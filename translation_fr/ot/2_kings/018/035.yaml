base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: fr
  text: Qui donc, parmi tous les dieux des pays, a délivré son pays de ma main[a], pour que Yahvé délivre Jérusalem de ma main ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici un verbe et un suffixe au pluriel : « Qui, parmi tous les dieux des pays, ont délivré leur pays de ma main ? »'
    reason: Le français principal adopte l’accord singulier naturel avec « qui », tandis que la note signale le pluriel formel du verbe et du possessif en hébreu.
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: Lequel de tous les dieux des pays
  rationale: מִי introduit une question rhétorique et בְּכָל a ici une valeur partitive. « Lequel de tous » est naturel en français et conserve la forme singulière de l’interrogatif, tandis que « pays » désigne les différents territoires ou peuples conquis.
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: a délivré son pays
  rationale: Le verbe נצל exprime ici la délivrance face à une puissance militaire. Le français met la proposition au singulier en accord avec « lequel », mais l’écart de nombre présent dans l’hébreu est signalé en note.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: Cette expression conserve l’image hébraïque transparente de la main comme symbole de pouvoir et de domination.
- source_word: כִּי יַצִּיל
  choice: pour que … délivre
  rationale: Dans cette provocation rhétorique, כִּי relie le prétendu précédent à la possibilité contestée que Yahvé sauve Jérusalem. « Pour que » rend naturellement cette logique sans transformer l’imparfait hébreu en affirmation certaine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, et le rend comme un nom propre plutôt que comme un titre.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville.
theological_decisions:
- issue: La portée de la provocation concernant Yahvé
  choice: Conserver la question rhétorique blasphématoire sans l’atténuer
  alternative: Reformuler pour préciser explicitement que l’orateur se trompe
  rationale: Le texte rapporte la prétention de l’émissaire assyrien, qui place Yahvé au même rang que les dieux des pays. La traduction doit préserver cette tension narrative sans approuver ses paroles ni y ajouter une réfutation absente de ce verset.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin lui-même. Sa forme française usuelle préserve ici le contraste voulu entre les dieux des pays et Yahvé.
translation_notes:
  register: Français moderne, digne et direct. La répétition de « de ma main » est maintenue parce qu’elle structure la vantardise de l’orateur et correspond à la répétition hébraïque. « Délivrer » convient au contexte militaire tout en conservant la portée théologique du verbe.
