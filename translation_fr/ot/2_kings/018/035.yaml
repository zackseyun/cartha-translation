  naturalness: « Qui donc, parmi tous les dieux des pays » est plus naturel et plus idiomatique en français moderne que « Lequel de tous les dieux des pays ». La répétition de « de ma main » et le registre de défi sont bien conservés.
  terminology: « Yahvé », « Jérusalem » et « délivrer » sont appropriés. « Dieux des pays » rend bien אֱלֹהֵי הָאֲרָצוֹת dans ce contexte.
