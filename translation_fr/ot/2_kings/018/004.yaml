  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: fr
  text: Il supprima les hauts lieux, brisa les pierres dressées, abattit l’Ashéra[a] et réduisit en morceaux le serpent de bronze que Moïse avait fabriqué, car jusqu’à cette époque les fils d’Israël lui offraient de l’encens. On l’appelait Nehoushtân[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le poteau d’Ashéra » ou « le poteau sacré ».'
    reason: lexical_alternative
  - marker: b
    text: 'Nehoushtân est probablement un jeu de mots sur le terme hébreu traduit par « bronze » et peut suggérer : « un simple objet de bronze ». Ou : « Il l’appela Nehoushtân. »'
    reason: wordplay_and_alternative_reading
lexical_decisions:
- source_word: הֵסִיר אֶת הַבָּמוֹת
  choice: Il supprima les hauts lieux
  rationale: « Supprimer » exprime l’élimination dans le contexte de la réforme, tandis que « hauts lieux » conserve le terme cultuel traditionnel et compréhensible.
- source_word: שִׁבַּר אֶת הַמַּצֵּבֹת
  choice: brisa les pierres dressées
  rationale: Les מַצֵּבוֹת sont des pierres cultuelles érigées; « pierres dressées » est plus précis en français courant que le seul « stèles » ou « piliers ».
- source_word: כָרַת אֶת הָאֲשֵׁרָה
  choice: abattit l’Ashéra
  rationale: Le verbe indique qu’on coupe ou abat un objet; la translittération préserve l’identité ancienne du symbole cultuel sans le réduire d’office à un simple poteau.
- source_word: כִתַּת
  choice: réduisit en morceaux
  rationale: Cette expression rend la destruction complète impliquée par le verbe, avec un français naturel.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: le serpent de bronze
  rationale: Rend directement le jeu lexical entre « serpent » et « bronze/cuivre » et maintient le lien avec le récit du Pentateuque.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Traduction formellement proche de l’expression familiale masculine hébraïque, claire dans ce contexte collectif.
- source_word: מְקַטְּרִים לוֹ
  choice: lui faisaient brûler de l’encens
  rationale: Rend l’action cultuelle continue et le pronom renvoyant au serpent.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: On l’appelait Nehoushtân
  rationale: La tournure impersonnelle française préserve l’indétermination contextuelle du sujet tout en restant naturelle.
theological_decisions:
- issue: Sens de אֲשֵׁרָה
  choice: l’Ashéra
  alternative: le poteau d’Ashéra / le poteau sacré
  rationale: Le contexte implique un objet matériel que l’on peut abattre, mais le terme hébreu conserve un lien avec la divinité Ashéra; la translittération évite de trancher plus que le texte.
- issue: Sujet de וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: On l’appelait Nehoushtân
  alternative: Il l’appela Nehoushtân
  rationale: Le singulier hébreu peut être compris avec Ézékias comme sujet ou rendu de façon indéfinie. La tournure choisie ne lui attribue pas nécessairement l’invention du nom.
translation_notes:
  register: Français international moderne, digne et lisible. Les verbes successifs gardent la vigueur de la réforme. « Ashéra » et « Nehoushtân » sont translittérés avec des accents facilitant la prononciation française; les ambiguïtés lexicales et syntaxiques sont conservées en notes.
