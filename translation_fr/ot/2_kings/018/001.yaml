- from: La troisième année du règne d’Osée, fils d’Éla, roi d’Israël, Ézéchias, fils d’Achaz, devint roi de Juda.[a]
  to: Dans la troisième année du règne d’Osée, fils d’Éla, roi d’Israël, Ézéchias, fils d’Achaz, devint roi[a] de Juda.
  rationale: La révision ajoute « Dans » pour rendre explicitement la préposition temporelle hébraïque et produire une phrase française complète. Elle conserve tous les référents, la datation régnique, les formes françaises traditionnelles des noms et le sens ingressif de מָלַךְ. L’ancre de note est déplacée après « roi », auquel l’alternative se rapporte.
