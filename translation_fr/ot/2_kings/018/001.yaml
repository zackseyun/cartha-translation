  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: fr
  text: Dans la troisième année du règne d’Osée, fils d’Éla, roi d’Israël, Ézéchias, fils d’Achaz, devint roi[a] de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « commença à régner ». Dans cette formule royale, le verbe hébreu marque l’accession d’Ézéchias au trône.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיְהִי
  choice: absence de connecteur explicite
  rationale: La forme narrative introduit ici une nouvelle notice royale. En français moderne, commencer directement par la date transmet naturellement cette fonction sans ajouter « Or » ou l’archaïque « Il arriva que ».
- source_word: בִּשְׁנַת שָׁלֹשׁ לְהוֹשֵׁעַ
  choice: La troisième année du règne d’Osée
  rationale: Il s’agit de la formule habituelle de datation selon les années de règne. L’ajout explicatif « du règne » rend en français la relation exprimée par לְ sans modifier le sens.
- source_word: בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: fils d’Éla, roi d’Israël
  rationale: 'Cette formulation conserve les deux précisions données sur Osée : sa filiation et sa royauté sur Israël.'
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule royale, le verbe désigne l’accession d’Ézéchias au trône plutôt que l’ensemble de son règne. « Devint roi » est clair et naturel en français contemporain.
- source_word: חִזְקִיָּה בֶן אָחָז
  choice: Ézéchias, fils d’Achaz
  rationale: Les formes françaises bibliques usuelles des noms propres sont retenues, avec une ponctuation qui rend lisible l’identification filiale.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le groupe apposé en hébreu s’intègre naturellement au verbe français dans « devint roi de Juda », sans répétition maladroite.
