base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: fr
  text: 'Après qu’ils eurent traversé, Élie dit à Élisée : « Demande-moi ce que je peux faire pour toi avant que je sois enlevé d’auprès de toi. » Élisée répondit : « Je t’en prie, que j’aie une double part[a] de ton esprit[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que j’aie deux parts de ton esprit ». L’expression hébraïque signifie « une double part » et évoque vraisemblablement la part d’héritage du premier-né.'
    reason: lexical_alternative
  - marker: b
    text: « Ton esprit » désigne l’esprit associé au ministère prophétique d’Élie. Certains comprennent cette demande comme le souhait de recevoir deux fois sa puissance prophétique.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: Après qu’ils eurent traversé
  rationale: La forme désigne Élie et Élisée ensemble et présente leur traversée comme accomplie avant la conversation. Le passé antérieur marque clairement cette succession en français soigné.
- source_word: שְׁאַל
  choice: Demande-moi
  rationale: L’impératif signifie simplement « demande ». Le pronom « moi », implicite dans la situation, rend l’offre naturelle en français.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: ce que je peux faire pour toi
  rationale: Cette formulation française exprime naturellement l’offre d’Élie sans transformer celle-ci en promesse absolue.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: avant que je sois enlevé d’auprès de toi
  rationale: Le passif « sois enlevé » respecte le nifal de לקח, tandis que « d’auprès de toi » conserve l’idée de séparation relationnelle portée par מֵעִמָּךְ.
- source_word: וִיהִי נָא
  choice: Je t’en prie, que…
  rationale: La tournure volitive accompagnée de נָא exprime une requête respectueuse. « Je t’en prie » en restitue la nuance sans raideur.
- source_word: פִּי שְׁנַיִם
  choice: une double part
  rationale: L’expression idiomatique désigne deux parts, ou une part double, et évoque vraisemblablement la part successorale du premier-né. « Double part » conserve cette résonance mieux que « deux fois plus ».
- source_word: בְּרוּחֲךָ
  choice: de ton esprit
  rationale: Le possessif est conservé et « esprit » reste sans majuscule afin de ne pas imposer une identification doctrinale plus précise que l’hébreu.
- source_word: אֵלָי
  choice: que me revienne
  rationale: Littéralement « à moi », l’expression indique que cette part doit échoir à Élisée. « Me revienne » s’accorde naturellement avec l’image d’une part d’héritage sans exclure l’idée d’un don spirituel.
theological_decisions:
- issue: Sens de la demande פִּי שְׁנַיִם בְּרוּחֲךָ
  choice: Élisée demande une double part de l’esprit d’Élie, avec une probable évocation de l’héritage du premier-né.
  alternative: Élisée demande à posséder deux fois plus de puissance prophétique qu’Élie.
  rationale: « Double part » préserve l’idiome hébreu et sa probable résonance successorale sans trancher abusivement la nature ou la mesure exacte du don demandé.
- issue: Référent de « ton esprit »
  choice: L’esprit ou le don prophétique associé à Élie demeure formulé sans précision technique supplémentaire.
  alternative: La formule désigne directement le Saint-Esprit en un sens trinitaire explicite.
  rationale: Le suffixe possessif renvoie à ce qui appartient à Élie ou le caractérise. La minuscule et la formulation littérale évitent d’introduire une détermination doctrinale absente de l’expression hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé antérieur convient au récit écrit et clarifie l’antériorité de la traversée. « D’auprès de toi » conserve la nuance relationnelle du texte source, tandis que « que me revienne » maintient discrètement l’image successorale.
