  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: fr
  text: 'Il prit le manteau d’Élie, qui lui était tombé des épaules, frappa les eaux et dit : « Où est Yahweh, le Dieu d’Élie ? »[a] Puis il frappa les eaux : elles se séparèrent de part et d’autre, et Élisée traversa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu ajoute ici les mots très brefs אַף הוּא, littéralement « lui aussi ». Leur rattachement est incertain. On peut les comprendre comme se rattachant à la question : « Où est Yahweh, le Dieu d’Élie — lui aussi ? »; ils peuvent souligner que le Dieu d’Élie est également à l’œuvre.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: manteau
  rationale: Désigne le vêtement extérieur caractéristique d’Élie. « Manteau » est concret, naturel en français moderne et moins chargé de connotations figurées que « mantle » en anglais.
- source_word: נָפְלָה מֵעָלָיו
  choice: qui était tombé de dessus lui
  rationale: Le plus-que-parfait situe clairement la chute du manteau avant l’action d’Élis–ée, tandis que « de dessus lui » conserve l’idée spatiale de מֵעָלָיו.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: frappa les eaux
  rationale: « Frapper » convient au registre narratif biblique sans archaïsme excessif; le pluriel « les eaux » reflète directement la forme hébraïque.
- source_word: אַיֵּה
  choice: Où est
  rationale: Rend directement l’interrogatif de lieu ou de présence, sans expliciter davantage l’appel implicite à l’intervention divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel au lieu de le remplacer par un titre.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: le Dieu d’Élie
  rationale: Préserve simplement et naturellement la relation construite en hébreu.
- source_word: אַף הוּא
  choice: Lui aussi
  rationale: Conserve dans le texte la brève expression emphatique et son ambiguïté syntaxique, sans la fondre silencieusement dans le récit.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: elles se séparèrent de part et d’autre
  rationale: Le pluriel reprend « les eaux » et l’expression française rend le mouvement dans deux directions indiqué par הֵנָּה וָהֵנָּה.
- source_word: וַיַּעֲבֹר
  choice: traversa
  rationale: Dans le contexte du Jourdain, « traverser » exprime naturellement le passage d’une rive à l’autre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel sans le substituer par un titre.
- issue: Interprétation de אַף הוּא
  choice: Lui aussi, rattaché formellement à l’action suivante et signalé par une note
  alternative: « Où est Yahweh, le Dieu d’Élie, lui aussi ? » ou omission comme expression elliptique
  rationale: L’hébreu est très condensé et sa ponctuation syntaxique demeure discutée. Le rendu retient les mots dans le texte, tout en évitant de transformer l’expression en affirmation théologique plus explicite que la source.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « frappa les eaux » est conservée, ainsi que le nom Yahweh. La formulation de la note maintient l’ambiguïté de אַף הוּא au lieu de la résoudre dans le corps du verset.
