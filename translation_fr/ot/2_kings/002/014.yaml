revisions:
- from: 'Il prit le manteau d’Élie qui était tombé de dessus lui, frappa les eaux et dit : « Où est Yahweh, le Dieu d’Élie ? » Lui aussi[a] frappa les eaux : elles se séparèrent de part et d’autre, et Élisée traversa.'
  to: 'Il prit le manteau d’Élie, qui lui était tombé des épaules, frappa les eaux et dit : « Où est Yahweh, le Dieu d’Élie ? »[a] Puis il frappa les eaux : elles se séparèrent de part et d’autre, et Élisée traversa.'
  rationale: 'La révision corrige le calque « de dessus lui », supprime l’attribution injustifiée de « Lui aussi » à Élisée et replace l’ambiguïté réelle de אַף הוּא dans une note ancrée au bon endroit. Le texte principal suit ainsi la solution prudente retenue dans l’audit anglais: il ne résout pas l’ellipse disputée, tout en conservant l’ordre narratif et la répétition de « frappa les eaux ».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:41:37Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend avec justesse la succession des actions, le manteau, les eaux, le nom Yahweh et le partage des eaux. Toutefois, « Lui aussi frappa les eaux » attribue artificiellement אַף הוּא à Élisée comme sujet de l’action suivante. Dans l’hébreu, cette expression elliptique et disputée se situe après « le Dieu d’Élie » et avant la seconde mention de l’action de frapper; son rattachement ne doit pas être résolu ainsi dans le texte courant.
  naturalness: « Qui était tombé de dessus lui » n’est pas idiomatique en français moderne. « Qui lui était tombé des épaules » est naturel tout en conservant l’idée du vêtement tombé d’Élie. Le déplacement de l’appel de note après la question correspond aussi à l’élément qu’explique la note.
  terminology: « Manteau », « les eaux », « Yahweh », « le Dieu d’Élie » et « traversa » conviennent au français international moderne et au registre narratif. La note doit présenter l’expression אַף הוּא sans lui imposer une analyse syntaxique ou théologique.
  issues:
  - severity: high
    issue: « Lui aussi » est rattaché à « frappa les eaux » comme si Élisée était aussi l’auteur de cette action.
    rationale: Ce rattachement produit une précision absente de l’hébreu et déplace l’expression אַף הוּא, qui suit immédiatement « le Dieu d’Élie » dans le discours direct. La construction est ambiguë et doit être conservée comme telle.
  - severity: medium
    issue: « de dessus lui » est un calque peu naturel.
    rationale: La tournure ne relève pas de l’usage moderne normal; « qui lui était tombé des épaules » exprime naturellement le même rapport spatial.
  - severity: medium
    issue: L’appel de note [a] est placé après « manteau », alors que la note porte sur אַף הוּא.
    rationale: L’ancre doit suivre la question, à l’endroit où l’expression hébraïque ambiguë intervient.
  revised_text: 'Il prit le manteau d’Élie, qui lui était tombé des épaules, frappa les eaux et dit : « Où est Yahweh, le Dieu d’Élie ? »[a] Puis il frappa les eaux : elles se séparèrent de part et d’autre, et Élisée traversa.'
  revised_footnotes:
  - marker: a
    text: 'Le texte hébreu ajoute ici les mots très brefs אַף הוּא, littéralement « lui aussi ». Leur rattachement est incertain. On peut les comprendre comme se rattachant à la question : « Où est Yahweh, le Dieu d’Élie — lui aussi ? »; ils peuvent souligner que le Dieu d’Élie est également à l’œuvre.'
    reason: alternative_reading
  revision_rationale: 'La révision corrige le calque « de dessus lui », supprime l’attribution injustifiée de « Lui aussi » à Élisée et replace l’ambiguïté réelle de אַף הוּא dans une note ancrée au bon endroit. Le texte principal suit ainsi la solution prudente retenue dans l’audit anglais: il ne résout pas l’ellipse disputée, tout en conservant l’ordre narratif et la répétition de « frappa les eaux ».'
