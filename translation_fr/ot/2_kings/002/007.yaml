id: 2KI.2.7
reference: 2 Kings 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: fr
  text: Cinquante hommes parmi les fils des prophètes[a] partirent et se tinrent en face d’eux[b], à distance[c], tandis qu’eux deux se tenaient au bord du Jourdain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « les fils des prophètes » : groupe reconnu d’hommes associés au ministère prophétique.'
    reason: cultural_note
  - marker: b
    text: Ou « vis-à-vis d’eux ».
    reason: lexical_alternative
  - marker: c
    text: Ou « au loin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: Cinquante hommes
  rationale: L’expression hébraïque désigne naturellement cinquante hommes. Le masculin est conservé conformément à אִישׁ.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: parmi les fils des prophètes
  rationale: La traduction conserve l’expression hébraïque reconnue « fils des prophètes » plutôt que de la remplacer par une interprétation comme « disciples » ou « confrérie ».
- source_word: הָלְכוּ
  choice: partirent
  rationale: Dans ce récit, הלך exprime simplement le déplacement. « Partirent » est idiomatique en français et convient au mouvement du groupe vers son poste d’observation.
- source_word: וַיַּעַמְדוּ
  choice: se tinrent
  rationale: עמד décrit ici une position maintenue. « Se tinrent » est naturel et évite d’ajouter l’idée plus appuyée de se poster délibérément.
- source_word: מִנֶּגֶד
  choice: en face d’eux
  rationale: Le terme indique une position vis-à-vis ou en face. Le complément « d’eux », implicite dans la scène, rend clairement le rapport spatial en français.
- source_word: מֵרָחוֹק
  choice: à distance
  rationale: Cette locution exprime l’éloignement spatial. « À distance » est clair, actuel et sans coloration archaïque.
- source_word: וּשְׁנֵיהֶם
  choice: tandis qu’eux deux
  rationale: La formulation garde la référence explicite aux deux hommes, Élie et Élisée, et « tandis que » fait ressortir sans l’exagérer le contraste avec les cinquante observateurs.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: se tenaient au bord du Jourdain
  rationale: Avec un cours d’eau, עַל signifie ici « auprès de » ou « au bord de », non littéralement « sur ». Cette formulation situe naturellement les deux hommes avant la traversée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La structure oppose clairement les cinquante observateurs aux deux personnages principaux, tout en conservant l’expression culturelle « fils des prophètes » et les nuances spatiales du texte hébreu.
