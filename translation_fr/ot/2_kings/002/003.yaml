base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: fr
  text: 'Alors les fils des prophètes qui étaient à Béthel sortirent pour aller trouver Élisée et lui dirent : « Sais-tu qu’aujourd’hui Yahweh va enlever ton maître de dessus ta tête[a] ? » Il répondit : « Je le sais moi aussi. Gardez le silence. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de dessus ta tête » ; l’expression peut désigner le retrait de celui qui exerce une autorité sur quelqu’un.'
    reason: Précision sur l’image idiomatique hébraïque et sa portée possible.
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: les fils des prophètes
  rationale: Cette traduction conserve l’expression relationnelle hébraïque et son sens probable de groupe ou de disciples rattachés aux prophètes, sans la préciser abusivement.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: qui étaient à Béthel
  rationale: La proposition situe le groupe à Béthel; cette formulation est naturelle en français et convient au cadre narratif.
- source_word: הֲיָדַעְתָּ
  choice: Sais-tu
  rationale: Le présent interrogatif rend naturellement en français la question hébraïque dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לֹקֵחַ
  choice: va enlever
  rationale: Le participe décrit ici une action imminente devant se produire ce jour-là; « va enlever » l’exprime clairement en français moderne.
- source_word: אֲדֹנֶיךָ
  choice: ton maître
  rationale: Le terme désigne Élie comme supérieur et guide d’Élisée, et non Dieu; « maître » évite l’ambiguïté de « seigneur ».
- source_word: מֵעַל רֹאשֶׁךָ
  choice: qui est au-dessus de toi
  rationale: La formulation conserve l’image hébraïque d’une personne placée au-dessus d’une autre en position d’autorité, tout en restant intelligible en français.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Moi aussi, je le sais
  rationale: Cette formulation rend explicitement גַּם אֲנִי, qui indique qu’Élisée partage leur connaissance.
- source_word: הֶחֱשׁוּ
  choice: Gardez le silence
  rationale: L’impératif pluriel s’adresse au groupe et conserve le ton ferme et solennel de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Sens de מֵעַל רֹאשֶׁךָ
  choice: qui est au-dessus de toi
  alternative: de dessus ta tête
  rationale: L’expression peut évoquer le retrait d’une personne exerçant une autorité sur Élisée. La traduction garde cette relation verticale sans imposer une interprétation plus précise de la manière dont Élie sera enlevé.
translation_notes:
  register: Français international moderne, narratif et digne. Le tour « fils des prophètes » conserve l’idiome hébraïque; le dialogue demeure direct et solennel. Le marqueur [a] figure dans le texte principal.
