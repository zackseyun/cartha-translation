source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אֶל מוֹצָ֣א הַ/מַּ֔יִם וַ/יַּשְׁלֶךְ שָׁ֖ם מֶ֑לַח וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה רִפִּ֨אתִי֙ לַ/מַּ֣יִם הָ/אֵ֔לֶּה לֹֽא יִהְיֶ֥ה מִ/שָּׁ֛ם ע֖וֹד מָ֥וֶת וּ/מְשַׁכָּֽלֶת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: fr
  text: 'Il se rendit à la source[a] de l’eau, y jeta du sel et dit : « Voici ce que dit Yahweh : J’ai guéri cette eau. Il n’en résultera plus ni mort ni fausse couche[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’endroit où l’eau jaillissait ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi évoquer la perte de descendance ou l’absence de fécondité.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: source
  rationale: Le nom désigne ici l’endroit d’où l’eau sort. « Source » est naturel en français et n’impose pas une description hydrologique plus précise que l’hébreu.
- source_word: הַמַּיִם
  choice: l’eau
  rationale: Bien que le mot hébreu ait une forme plurielle, le singulier collectif « l’eau » est l’expression idiomatique en français pour cette réserve d’eau.
- source_word: מֶלַח
  choice: sel
  rationale: Équivalent lexical direct, sans nécessité d’explicitation.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle et solennelle rend clairement la formule du messager prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: רִפִּאתִי
  choice: J’ai guéri
  rationale: Le verbe signifie normalement « guérir ». Garder cette image frappante appliquée à l’eau évite de réduire le propos à la seule potabilité.
- source_word: לַמַּיִם הָאֵלֶּה
  choice: cette eau
  rationale: Le singulier collectif est naturel en français et désigne l’approvisionnement local en eau comme un tout.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: Il ne viendra plus de là
  rationale: La tournure préserve l’idée que les effets funestes ne proviendront plus de cette source, sans préciser davantage leur mécanisme.
- source_word: מָוֶת
  choice: mort
  rationale: Équivalent direct. Le texte ne précise pas la nature des décès, de sorte que la traduction ne les attribue pas explicitement à une maladie particulière.
- source_word: מְשַׁכָּלֶת
  choice: fausse couche
  rationale: Le terme, issu de la racine שׁכל, évoque la perte de descendance ou le fait de la provoquer. « Fausse couche » exprime concrètement ce mal tout en signalant en note la portée lexicale plus large.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre de Dieu sans le remplacer par un titre.
- issue: Nature de la guérison de l’eau
  choice: Conserver l’image « J’ai guéri cette eau »
  alternative: J’ai assaini cette eau
  rationale: L’hébreu emploie le verbe ordinaire de guérison. La traduction maintient cette personnification et ne limite pas l’acte divin à une explication sanitaire.
- issue: Portée de מְשַׁכָּלֶת
  choice: fausse couche dans le texte, avec l’ambiguïté signalée en note
  alternative: stérilité / perte de descendance
  rationale: Le contexte concerne les effets néfastes de l’eau, mais le mot peut couvrir plus largement la perte de progéniture ou l’infécondité. La note préserve cette tension sans alourdir le verset.
translation_notes:
  register: Français international moderne, sobre et digne. La formule prophétique est rendue naturellement, tandis que l’image inhabituelle de l’eau « guérie » et la construction orientée vers la provenance (« de là ») sont conservées. Tous les marqueurs de note figurent dans le texte.
