  text: וַ/יָּשֻׁ֣בוּ אֵלָ֔י/ו וְ/ה֖וּא יֹשֵׁ֣ב בִּ/ירִיח֑וֹ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם הֲ/לֽוֹא אָמַ֥רְתִּי אֲלֵי/כֶ֖ם אַל תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: fr
  text: 'Ils revinrent auprès de lui tandis qu’il séjournait à Jéricho[a]. Il leur dit : « Ne vous avais-je pas dit : “N’y allez pas” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « tandis qu’il était assis à Jéricho ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: Ils revinrent auprès de lui
  rationale: Le verbe שׁוב exprime ici le retour des hommes vers Élisée. « Auprès de lui » rend naturellement la préposition et son suffixe tout en indiquant qu’ils le rejoignent.
- source_word: וְהוּא יֹשֵׁב בִּירִיחוֹ
  choice: tandis qu’il séjournait à Jéricho
  rationale: Le participe de ישׁב peut signifier être assis, demeurer ou séjourner. Dans ce contexte, il souligne surtout qu’Élisée était resté à Jéricho pendant leurs recherches; « séjournait » exprime ce sens sans exclure la valeur plus littérale signalée en note.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Il leur dit
  rationale: Traduction directe et naturelle de la formule narrative introduisant les paroles d’Élisée.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: Ne vous avais-je pas dit
  rationale: La tournure interrogative négative restitue la question rhétorique qui attend une réponse affirmative et porte une nuance de reproche.
- source_word: אַל תֵּלֵכוּ
  choice: N’y allez pas
  rationale: אַל suivi de l’inaccompli exprime une interdiction. Le pronom « y » est idiomatique en français et reprend la destination envisagée dans le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La ponctuation distingue clairement la citation de l’ordre antérieur à l’intérieur des paroles d’Élisée.
