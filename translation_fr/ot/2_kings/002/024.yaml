base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: fr
  text: Il se retourna, les vit et les maudit au nom du SEIGNEUR. Alors deux ourses sortirent de la forêt et déchirèrent quarante-deux de ces jeunes gens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: les maudit
  rationale: Rend directement le verbe קלל dans ce contexte de malédiction prononcée au nom du SEIGNEUR.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: deux ourses
  rationale: Le numéral féminin confirme qu’il s’agit de deux femelles.
- source_word: וַתְּבַקַּעְנָה
  choice: déchirèrent
  rationale: Le verbe בקע évoque l’action de fendre ou déchirer; cette formulation conserve la violence du texte sans préciser que les victimes furent tuées.
- source_word: יְלָדִים
  choice: jeunes gens
  rationale: Le terme peut désigner des enfants ou des jeunes; le contexte précédent ne permet pas de fixer ici un âge précis, et « jeunes gens » préserve cette latitude mieux que « garçons ».
theological_decisions:
- issue: Portée de la malédiction d’Élisée
  choice: « les maudit au nom du SEIGNEUR »
  alternative: « appela sur eux une malédiction au nom du SEIGNEUR »
  rationale: La traduction formelle maintient l’affirmation du texte sans expliquer le mécanisme ni identifier explicitement la malédiction à l’attaque des ourses.
- issue: Sort des quarante-deux jeunes
  choice: « déchirèrent »
  alternative: « tuèrent »
  rationale: Le texte décrit une grave attaque avec le verbe בקע, mais ne dit pas explicitement que les quarante-deux moururent.
translation_notes:
  register: Français international moderne, sobre et digne. « SEIGNEUR » représente le tétragramme יהוה selon la convention éditoriale. La coordination narrative simple de l’hébreu est conservée sans alourdir la phrase.
