  text: וַ/יֹּ֗אמֶר קְחוּ לִ/י֙ צְלֹחִ֣ית חֲדָשָׁ֔ה וְ/שִׂ֥ימוּ שָׁ֖ם מֶ֑לַח וַ/יִּקְח֖וּ אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/020.yaml
  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: fr
  text: 'Il dit : « Apportez-moi un récipient neuf et mettez-y du sel. » Ils le lui apportèrent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol de אמר poursuit le récit et introduit directement les paroles d’Élisée. En français, l’absence de conjonction est naturelle ici.
- source_word: קְחוּ לִי
  choice: Apportez-moi
  rationale: לקח signifie fondamentalement « prendre », mais avec לִי dans cette demande, « apportez-moi » rend naturellement l’action attendue.
- source_word: צְלֹחִית
  choice: récipient
  rationale: Le nom désigne un petit contenant sans en préciser sûrement la forme. « Récipient » conserve cette généralité mieux que « bol », « cruche » ou « flacon ».
- source_word: חֲדָשָׁה
  choice: neuf
  rationale: L’adjectif qualifie le récipient. Le masculin « neuf » s’accorde avec le choix français « récipient ».
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: et mettez-y du sel
  rationale: שׂים signifie « mettre, placer » et שָׁם, littéralement « là », renvoie au récipient qui vient d’être mentionné; le pronom adverbial « y » l’exprime idiomatiquement.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: Ils le lui apportèrent
  rationale: Dans le contexte, לקח décrit l’exécution de la demande et donc l’acheminement du récipient jusqu’à Élisée. Le complément d’objet, implicite en hébreu, est repris naturellement par « le ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le choix générique « récipient » préserve l’indétermination du terme hébreu sans nécessiter de note lexicale.
