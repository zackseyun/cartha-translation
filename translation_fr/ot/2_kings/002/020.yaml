    issue: Incohérence des temps narratifs
    rationale: Le premier wayyiqtol est rendu par « Il dit », tandis que le second est rendu par « Ils le lui apportèrent ». Le passé simple pour les deux respecte la séquence narrative hébraïque et améliore la fluidité française.
  revised_text: 'Il dit : « Apportez-moi un récipient neuf et mettez-y du sel. » Ils le lui apportèrent.'
