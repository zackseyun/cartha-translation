base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/013.yaml
  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: fr
  text: Il ramassa le manteau d’Élie[a], qui était tombé de lui, puis revint et se tint sur la rive du Jourdain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la cape ». Le terme hébreu désigne un vêtement extérieur distinctif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: ramassa
  rationale: Le verbe exprime l’action de soulever; puisqu’il s’agit d’un vêtement tombé, « ramassa » rend naturellement l’action concrète en français.
- source_word: אַדֶּרֶת
  choice: manteau
  rationale: Le terme désigne ici un vêtement extérieur distinctif. « Manteau » est clair, courant et digne; « cape » reste une autre traduction possible.
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: qui était tombé de ses épaules
  rationale: Le plus-que-parfait marque l’antériorité de la chute par rapport au ramassage. « De ses épaules » exprime idiomatiquement מֵעָלָיו dans le contexte d’un manteau porté sur soi.
- source_word: וַיָּשָׁב
  choice: puis revint
  rationale: שׁוב signifie revenir ou retourner; « revint » est concis, et « puis » rend naturellement la progression narrative.
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: Le verbe signifie se tenir debout. « Se tint » convient au registre narratif et évite la lourdeur de « se tint debout ».
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: sur la rive du Jourdain
  rationale: שָׂפָה désigne le bord ou la rive; pour un cours d’eau, « rive » est l’équivalent français naturel. Le nom conventionnel est « le Jourdain ».
