  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: fr
  text: 'Élie lui dit : « Élisée, reste ici, je te prie, car Yahweh m’a envoyé à Jéricho. » Mais Élisée répondit : « Aussi vrai que Yahweh est vivant et que toi, tu es vivant, je ne te quitterai pas. » Ils arrivèrent donc à Jéricho.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: reste ici, je te prie
  rationale: L’impératif de ישׁב signifie ici rester sur place plutôt que s’asseoir. נָא donne à la demande une nuance d’insistance courtoise, rendue par « je te prie » dans un registre digne et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin personnel plutôt que remplacé par un titre.
- source_word: שְׁלָחַנִי
  choice: m’envoie
  rationale: Le parfait hébreu exprime une mission reçue dont la portée demeure actuelle. Le présent français convient naturellement au déplacement en cours.
- source_word: יְרִיחוֹ
  choice: Jéricho
  rationale: Forme française usuelle du nom de lieu.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Aussi vrai que Yahweh est vivant et que tu es vivant
  rationale: Cette formulation restitue le serment solennel et son parallélisme. נֶפֶשׁ désigne ici la personne vivante, non spécifiquement une âme immatérielle.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: je ne te quitterai pas
  rationale: Dans la formule de serment elliptique, אִם implique une forte négation. « Quitter » convient au contexte immédiat du voyage.
- source_word: וַיָּבֹאוּ
  choice: Ils allèrent donc
  rationale: Le wayyiqtol fait progresser le récit. Le verbe בוא peut décrire le fait d’aller ou d’arriver selon le point de vue; ici « allèrent » évite la lourdeur de « vinrent » sans ajouter explicitement l’idée d’arrivée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre, sans lui substituer un titre.
- issue: Sens de נֶפֶשׁ dans la formule de serment
  choice: tu es vivant
  alternative: ton âme est vivante
  rationale: Dans cette formule, נֶפֶשׁ renvoie à la vie ou à la personne entière. Une traduction littérale par « âme » risquerait d’introduire une distinction anthropologique que le contexte n’exige pas.
translation_notes:
  register: Français international moderne, narratif et digne. Le vouvoiement n’est pas employé entre Élie et Élisée afin de conserver la proximité personnelle et la forme singulière de l’hébreu. Aucun marqueur de note n’est nécessaire.
