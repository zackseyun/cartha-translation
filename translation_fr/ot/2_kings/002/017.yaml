base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: fr
  text: 'Mais ils insistèrent auprès de lui jusqu’à ce qu’il soit embarrassé[a]. Alors il dit : « Envoyez-les. » Ils envoyèrent donc cinquante hommes, qui cherchèrent pendant trois jours, mais ne le trouvèrent pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce qu’il ait honte ». L’hébreu évoque la honte ou l’embarras suscité par leur insistance répétée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: ils insistèrent auprès de lui
  rationale: Le verbe פצר exprime une insistance persistante. Cette tournure française rend naturellement la pression répétée exercée sur Élisée.
- source_word: עַד בֹּשׁ
  choice: jusqu’à le mettre mal à l’aise
  rationale: בוש relève du champ de la honte et de l’embarras. Dans ce contexte de pression sociale, cette formulation française conserve le sens sans suggérer nécessairement une culpabilité morale.
- source_word: שְׁלָחוּ
  choice: Envoyez-les
  rationale: L’impératif masculin pluriel signifie littéralement « envoyez »; le pronom explicite naturellement en français les hommes proposés pour la recherche.
- source_word: חֲמִשִּׁים אִישׁ
  choice: cinquante hommes
  rationale: Le texte du verset dit simplement « cinquante hommes », sans répéter leur appartenance au groupe des fils des prophètes.
- source_word: וַיְבַקְשׁוּ
  choice: cherchèrent
  rationale: בקש signifie ici chercher; l’objet, Élie, ressort clairement du contexte et du pronom de la proposition suivante.
- source_word: שְׁלֹשָׁה יָמִים
  choice: pendant trois jours
  rationale: Cette formulation rend naturellement en français la durée exprimée par l’hébreu.
- source_word: וְלֹא מְצָאֻהוּ
  choice: mais ne le trouvèrent pas
  rationale: Le waw prend ici une valeur adversative naturelle après une recherche prolongée restée sans résultat.
