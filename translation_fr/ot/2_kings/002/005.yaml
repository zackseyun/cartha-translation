  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: fr
  text: 'Alors les fils des prophètes qui étaient à Jéricho s’approchèrent d’Élisée et lui dirent : « Sais-tu qu’aujourd’hui Yahweh enlève ton maître de dessus ta tête[a] ? » Il répondit : « Moi aussi, je le sais. Taisez-vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la position qu’il occupe au-dessus de toi » ; l’hébreu dit littéralement « de dessus ta tête ». L’expression peut évoquer le retrait d’une personne qui exerce une autorité sur une autre.
    reason: Préserve l’image concrète et l’ambiguïté de l’hébreu tout en indiquant, sans l’imposer, le sens idiomatique possible.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: s’approchèrent
  rationale: Le verbe נגשׁ exprime le fait de s’approcher. Ce choix naturel en français conserve le mouvement vers Élisée.
- source_word: בְנֵי הַנְּבִיאִים
  choice: les fils des prophètes
  rationale: La formulation conserve l’expression hébraïque, qui désigne vraisemblablement les membres ou disciples d’un groupe prophétique, sans substituer cette interprétation au texte.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: qui étaient à Jéricho
  rationale: La relative identifie le groupe établi ou présent à Jéricho.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הֲיָדַעְתָּ
  choice: Sais-tu
  rationale: Le parfait interrogatif porte ici sur la connaissance présente d’Élisée ; le présent français en rend naturellement le sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לֹקֵחַ
  choice: enlève
  rationale: Le participe présente l’action comme actuelle ou imminente. Le présent français garde cette vivacité sans imposer explicitement « est sur le point de ».
- source_word: אֲדֹנֶיךָ
  choice: ton maître
  rationale: Dans cette relation humaine, « maître » exprime clairement la position d’Élie par rapport à Élisée, sans la coloration théologique possible de « Seigneur ».
- source_word: מֵעַל רֹאשֶׁךָ
  choice: d’au-dessus de ta tête
  rationale: La traduction maintient l’image concrète et inhabituelle de l’hébreu, probablement liée à la position d’autorité du maître.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Moi aussi, je le sais
  rationale: Cette formulation rend à la fois la particule additive גַּם et le pronom emphatique אֲנִי dans un français naturel.
- source_word: הֶחֱשׁוּ
  choice: Taisez-vous
  rationale: L’impératif est au pluriel et demande de garder le silence ; cette tournure en conserve la brièveté et la force.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Interprétation de מֵעַל רֹאשֶׁךָ
  choice: Conserver dans le texte l’image « d’au-dessus de ta tête »
  alternative: de la position d’autorité qu’il occupe sur toi
  rationale: L’expression peut évoquer la suppression de l’autorité exercée par Élie sur Élisée, mais le texte ne développe pas lui-même cette interprétation. L’image est donc maintenue et expliquée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le dialogue reste bref. L’expression « fils des prophètes » et l’image « d’au-dessus de ta tête » sont volontairement plus formelles ou inhabituelles afin de préserver les formulations significatives de l’hébreu ; la note éclaire la seconde sans trancher son sens.
