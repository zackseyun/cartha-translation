  text: וַ/יֹּ֖אמֶר הִקְשִׁ֣יתָ לִ/שְׁא֑וֹל אִם תִּרְאֶ֨ה אֹתִ֜/י לֻקָּ֤ח מֵֽ/אִתָּ/ךְ֙ יְהִֽי לְ/ךָ֣ כֵ֔ן וְ/אִם אַ֖יִן לֹ֥א יִהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: fr
  text: 'Il répondit : « Tu as demandé une chose difficile. Si tu me vois être enlevé d’auprès de toi[a], il en sera ainsi pour toi ; sinon, il n’en sera pas ainsi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu me vois enlevé d’auprès de toi. »'
    reason: La construction avec le participe passif hébreu peut s’entendre soit comme le fait d’assister à l’enlèvement, soit comme la vision d’Élie une fois enlevé.
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: Tu demandes quelque chose de difficile
  rationale: L’expression hébraïque associe le hifil de קשׁה à l’infinitif de שׁאל et signifie ici que la demande formulée est difficile ou exigeante. Cette tournure est naturelle en français moderne sans ajouter ce qui la rend difficile.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: Si tu me vois au moment où je serai enlevé loin de toi
  rationale: Le participe passif לֻקָּח présente Élie comme étant enlevé, sans préciser l’agent. La formulation française exprime la condition liée au fait qu’Élisée soit témoin de son enlèvement, tandis que la note conserve la construction plus littérale et son léger éventail d’interprétation.
- source_word: יְהִי לְךָ כֵן
  choice: il en sera ainsi pour toi
  rationale: Cette expression idiomatique affirme que la chose demandée se réalisera pour Élisée. La traduction reste proche de l’hébreu et évite de préciser davantage la nature ou le mécanisme de cet accomplissement.
- source_word: וְאִם אַיִן
  choice: sinon
  rationale: 'אַיִן est elliptique : la condition sous-entendue est qu’Élisée ne voie pas Élie être enlevé. « Sinon » rend brièvement et naturellement cette opposition.'
- source_word: לֹא יִהְיֶה
  choice: il n’en sera pas ainsi
  rationale: Le sujet implicite est l’accomplissement de la demande. La reprise négative de la formule précédente clarifie ce sous-entendu tout en conservant la concision de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le dialogue conserve la sobriété de l’hébreu. « Il en sera ainsi pour toi » garde la formulation ouverte du texte sans expliciter la demande mentionnée au verset précédent ni attribuer explicitement l’enlèvement à un agent.
