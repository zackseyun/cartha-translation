base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: fr
  text: Alors que Yahweh était sur le point de faire monter Élie au ciel dans un tourbillon[a], Élie et Élisée partirent de Guilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la tempête » ou « dans un vent de tempête ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Lorsque…
  rationale: La formule narrative introduit ici une circonstance temporelle. En français moderne, la subordonnée en « lorsque » rend naturellement cette fonction sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: בְּהַעֲלוֹת
  choice: allait faire monter
  rationale: L’infinitif construit avec בְּ exprime le cadre temporel. « Allait faire monter » conserve le mouvement ascendant de עלה et, dans ce contexte, le caractère imminent de l’événement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֶת אֵלִיָּהוּ
  choice: Élie
  rationale: Le marqueur d’objet direct introduit le nom propre, rendu selon sa forme française usuelle.
- source_word: בַּסְעָרָה
  choice: dans un tourbillon
  rationale: סְעָרָה peut désigner une tempête, un vent de tempête ou un tourbillon. « Dans un tourbillon » convient au contexte tout en maintenant l’association exprimée par בְּ.
- source_word: הַשָּׁמָיִם
  choice: jusqu’au ciel
  rationale: Le pluriel hébreu désigne ici la sphère céleste ou la direction du ciel. Le singulier est idiomatique en français, et « jusqu’au » exprime naturellement la destination du mouvement ascendant.
- source_word: וַיֵּלֶךְ
  choice: partirent
  rationale: Le singulier hébreu précède un sujet composé. Avec מִן indiquant le point de départ, « partirent » rend naturellement le déplacement des deux hommes.
- source_word: וֶאֱלִישָׁע
  choice: et Élisée
  rationale: Le nom propre est rendu selon sa forme française usuelle.
- source_word: מִן הַגִּלְגָּל
  choice: de Guilgal
  rationale: מִן marque ici le lieu d’origine du déplacement.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve sans lui substituer un titre.
- issue: Sens de הַשָּׁמָיִם dans le récit de l’ascension
  choice: jusqu’au ciel
  alternative: jusqu’aux cieux
  rationale: Le pluriel hébreu peut être conservé formellement, mais le singulier français est plus naturel dans ce contexte. Ce choix idiomatique ne tranche pas une question cosmologique.
- issue: Valeur de בַּסְעָרָה
  choice: dans un tourbillon
  alternative: dans la tempête ; dans un vent de tempête
  rationale: Le terme autorise plusieurs images météorologiques proches. Le texte principal retient « tourbillon », tandis que la note préserve l’étendue lexicale sans préciser davantage le mécanisme de l’ascension.
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite une formule archaïque comme « Il advint que », conserve l’imminence de l’événement et place les notes sur les expressions auxquelles elles se rapportent.
