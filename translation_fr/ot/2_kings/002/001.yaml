  source_fidelity: La temporalité prospective de בְּהַעֲלוֹת est bien rendue par « était sur le point de faire monter ». « Partirent de Guilgal » correspond à וַיֵּלֶךְ … מִן־הַגִּלְגָּל. En revanche, « jusqu’au ciel » ajoute une nuance de limite/terme (« jusqu’à ») qui n’est pas exprimée par l’hébreu, dont הַשָּׁמַיִם est le complément directionnel de « faire monter ».
  naturalness: La formulation révisée est naturelle en français international moderne et conserve le ton narratif sobre. « Au ciel » est plus idiomatique et plus exact que « jusqu’au ciel » dans ce contexte.
