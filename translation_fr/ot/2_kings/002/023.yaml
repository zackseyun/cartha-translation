  text: וַ/יַּ֥עַל מִ/שָּׁ֖ם בֵּֽית אֵ֑ל וְ/ה֣וּא עֹלֶ֣ה בַ/דֶּ֗רֶךְ וּ/נְעָרִ֤ים קְטַנִּים֙ יָצְא֣וּ מִן הָ/עִ֔יר וַ/יִּתְקַלְּסוּ ב/וֹ֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ עֲלֵ֥ה קֵרֵ֖חַ עֲלֵ֥ה קֵרֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: fr
  text: 'Il monta de là à Béthel. Pendant qu’il montait sur le chemin, de jeunes garçons[a] sortirent de la ville, se moquèrent de lui et lui dirent : « Monte, chauve ! Monte[b], chauve ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de jeunes adolescents » ou « de jeunes gens » ; l’expression hébraïque peut désigner plus largement de jeunes personnes de sexe masculin, et pas nécessairement de très jeunes enfants.
    reason: lexical_alternative
  - marker: b
    text: La répétition de « Monte » peut n’être qu’une raillerie, mais elle peut aussi faire allusion à l’enlèvement d’Élie.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: il monta
  rationale: Le qatal narratif fait progresser le récit. « Il monta » rend directement le mouvement ascendant exprimé par עלה et permet d’en conserver la répétition dans la suite du verset.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Forme française traditionnelle et courante du nom de lieu hébreu.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: Pendant qu’il montait par le chemin
  rationale: La construction avec pronom et participe décrit une action en cours. Cette formulation conserve le verbe « monter », repris ensuite dans la moquerie.
- source_word: נְעָרִים קְטַנִּים
  choice: de jeunes garçons
  rationale: נערים désigne de jeunes personnes de sexe masculin et קטנים souligne leur jeunesse ou leur petitesse. « Jeunes garçons » est naturel en français sans imposer qu’il s’agisse de tout petits enfants; la portée plus large est signalée en note.
- source_word: יָצְאוּ מִן הָעִיר
  choice: sortirent de la ville
  rationale: Rend simplement et naturellement le mouvement exprimé par יצא מן.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: se moquèrent de lui
  rationale: Le hitpael de קלס exprime la dérision ou la raillerie. Cette traduction est claire, actuelle et suffisamment forte.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה signifie littéralement « monte ». Le maintien de ce sens préserve la répétition avec la montée d’Élisée et laisse ouverte une possible allusion à l’enlèvement d’Élie.
- source_word: קֵרֵחַ
  choice: chauve
  rationale: Employé comme appellation directe, l’adjectif קֵרֵחַ constitue ici une insulte. « Chauve ! » restitue en français la brièveté et la force railleuse de l’hébreu.
theological_decisions:
- issue: Portée possible de l’impératif répété « Monte »
  choice: Conserver le sens littéral « Monte » sans expliciter l’allusion dans le texte principal.
  alternative: 'Comprendre « Va-t’en ! » ou expliciter : « Monte comme Élie ! »'
  rationale: Le texte dit clairement « monte », mais la fonction exacte de cette raillerie reste discutée. La traduction conserve donc l’ambiguïté et mentionne en note l’allusion possible à l’enlèvement d’Élie.
- issue: Âge et responsabilité suggérés par נְעָרִים קְטַנִּים
  choice: Traduire par « de jeunes garçons » et signaler en note que l’expression peut aussi viser des adolescents ou de jeunes gens.
  alternative: « de petits garçons », « des adolescents » ou « de jeunes gens »
  rationale: L’expression indique des jeunes de sexe masculin sans permettre d’établir précisément leur âge. Une formulation non excessive dans le texte et une note lexicale évitent de trancher artificiellement la question.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit, tandis que l’imparfait marque l’action en cours. La répétition de « monter » est maintenue pour préserver le lien lexical et l’ambiguïté du texte hébreu.
