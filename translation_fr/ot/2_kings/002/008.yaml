  text: וַ/יִּקַּח֩ אֵלִיָּ֨הוּ אֶת אַדַּרְתּ֤/וֹ וַ/יִּגְלֹם֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֵּחָצ֖וּ הֵ֣נָּה וָ/הֵ֑נָּה וַ/יַּעַבְר֥וּ שְׁנֵי/הֶ֖ם בֶּ/חָרָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: fr
  text: Alors Élie prit son manteau[a], le roula et frappa les eaux. Elles se séparèrent de part et d’autre[b], et tous deux traversèrent à pied sec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vêtement de dessus ». Le terme hébreu désigne un manteau ou un vêtement extérieur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « d’un côté et de l’autre »; les eaux se séparèrent vers les deux côtés.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: son manteau
  rationale: אַדֶּרֶת désigne ici le vêtement de dessus caractéristique d’Élie. « Manteau » est naturel en français moderne et convient à l’action décrite.
- source_word: וַיִּגְלֹם
  choice: le roula
  rationale: Le verbe décrit le fait d’enrouler ou de ramasser le manteau afin de s’en servir pour frapper.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: frappa les eaux
  rationale: La formulation rend directement נכה et conserve le pluriel hébreu implicite dans la suite du récit.
- source_word: וַיֵּחָצוּ
  choice: elles se séparèrent
  rationale: Le verbe hébreu est au pluriel et renvoie aux eaux; le tour pronominal français exprime naturellement leur division sans préciser une cause non formulée.
- source_word: הֵנָּה וָהֵנָּה
  choice: de part et d’autre
  rationale: Cette expression française indique clairement que les eaux se séparent vers les deux côtés, sens contextuel de la locution hébraïque.
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: tous deux traversèrent
  rationale: « Tous deux » conserve l’insistance explicite sur les deux hommes dans une formulation française concise.
- source_word: בֶּחָרָבָה
  choice: à pied sec
  rationale: Locution française courante pour une traversée sans entrer dans l’eau; elle traduit naturellement l’idée du sol devenu sec dans ce contexte.
- source_word: וַיִּקַּח
  choice: Alors Élie prit
  rationale: « Alors » marque l’avancée séquentielle portée par le waw consécutif sans reproduire mécaniquement chaque coordination hébraïque.
theological_decisions:
- issue: Division miraculeuse des eaux
  choice: Décrire directement les eaux qui se séparent et la traversée à pied sec
  alternative: Employer une formulation qui naturalise l’événement ou en explicite la cause divine
  rationale: Le texte rapporte sobrement l’action et son résultat miraculeux sans nommer ici l’agent ultime; la traduction maintient cette retenue narrative.
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme reste simple et direct. « Les eaux » permet de respecter le pluriel du verbe hébreu; « de part et d’autre » explicite seulement l’orientation impliquée par le contexte.
