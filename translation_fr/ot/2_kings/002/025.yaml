lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: il se rendit
  rationale: Le wayyiqtol fait progresser le récit. « Il se rendit » exprime naturellement en français un déplacement vers une destination, sans ajouter de nuance causale.
- source_word: מִשָּׁם
  choice: De là
  rationale: L’adverbe indique un mouvement depuis le lieu mentionné auparavant. « De là » est clair, actuel et proche de l’hébreu.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: au mont Carmel
  rationale: La préposition marque la destination, et « mont Carmel » est la forme française usuelle du toponyme.
- source_word: וּמִשָּׁם
  choice: puis
  rationale: L’expression poursuit la succession des déplacements. « Puis » évite une répétition pesante en français tout en conservant l’ordre narratif.
- source_word: שָׁב
  choice: il retourna
  rationale: Dans ce contexte de déplacement, שׁוב signifie revenir ou retourner. « Il retourna » convient au récit et demeure concis.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: « Samarie » est la forme française traditionnelle et standard de ce nom de lieu.
