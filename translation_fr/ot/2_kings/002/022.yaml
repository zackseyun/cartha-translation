  text: וַ/יֵּרָפ֣וּ הַ/מַּ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ/דְבַ֥ר אֱלִישָׁ֖ע אֲשֶׁ֥ר דִּבֵּֽר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: fr
  text: Ainsi, les eaux furent guéries et le sont restées jusqu’à ce jour[a], conformément à la parole qu’Élisée avait prononcée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent assainies » ou « furent restaurées ». Le verbe hébreu est le terme habituellement employé pour « guérir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: furent guéries
  rationale: Le verbe רפא est le verbe habituel pour « guérir ». Son emploi à propos des eaux est conservé afin de respecter la métaphore du texte hébreu plutôt que de l’aplanir en « furent assainies » ou « furent restaurées ».
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le nom hébreu מַיִם a une forme plurielle. « Les eaux » est naturel en français dans le contexte d’une source et maintient la formulation du texte.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: et le sont encore aujourd’hui
  rationale: L’expression indique que l’état produit s’est maintenu jusqu’au temps du narrateur. Cette formulation française explicite naturellement la continuité impliquée par l’idiome hébreu.
- source_word: כִּדְבַר
  choice: conformément à la parole
  rationale: דָּבָר renvoie ici à la déclaration prophétique d’Élisée au verset précédent. « Parole » garde le lien concret entre ce qui a été dit et son accomplissement.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Forme française usuelle du nom biblique.
- source_word: אֲשֶׁר דִּבֵּר
  choice: qu’Élisée avait prononcée
  rationale: Le plus-que-parfait situe clairement la déclaration avant le résultat raconté, tandis que « prononcée » s’accorde naturellement avec « parole » sans modifier le sens.
theological_decisions:
- issue: Métaphore de guérison appliquée aux eaux
  choice: Conserver « les eaux furent guéries » dans le texte principal.
  alternative: « les eaux furent assainies » ou « les eaux furent restaurées »
  rationale: Le texte hébreu emploie le verbe ordinaire signifiant « guérir ». Le maintien de cette image préserve la représentation du rétablissement opéré conformément à la parole prophétique, sans lui imposer une explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « et le sont encore aujourd’hui » rend explicitement et naturellement la continuité de l’état jusqu’au présent du narrateur; la métaphore hébraïque de la guérison demeure au premier plan.
