  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: fr
  text: 'Élie dit à Élisée : « Reste ici, je te prie, car Yahweh m’a envoyé jusqu’à Béthel[a]. » Mais Élisée répondit : « Aussi vrai que Yahweh est vivant et que tu es vivant, je ne te quitterai pas[b] ! » Ils descendirent donc à Béthel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « m’a envoyé à Béthel ». Le mot hébreu עַד peut marquer la limite du trajet : « jusqu’à Béthel ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la formule de serment se termine ainsi : « si je te quitte… » L’imprécation étant laissée sous-entendue, le sens est : « je ne te quitterai certainement pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: Reste ici, je te prie
  rationale: Le verbe ישׁב peut signifier « s’asseoir », « rester » ou « demeurer ». Dans ce contexte, Élie demande à Élisée de ne pas poursuivre le voyage avec lui ; « reste ici » exprime donc naturellement le sens contextuel. « Je te prie » rend la nuance courtoise de נָא dans un registre digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » conserve le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: m’a envoyé jusqu’à Béthel
  rationale: עַד marque couramment la limite atteinte, « jusqu’à ». Cette formulation conserve la progression géographique du récit tout en restant naturelle en français.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Aussi vrai que Yahweh est vivant et que tu es vivant
  rationale: Cette tournure française restitue la formule solennelle de serment sans donner à נֶפֶשׁ le sens anthropologique technique d’« âme », qui ne convient pas ici.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: je ne te quitterai pas
  rationale: Après une formule de serment, אִם introduit ici une imprécation elliptique, littéralement « si je te quitte… », dont la valeur affirmée est une négation solennelle. La traduction explicite ce sens en français.
- source_word: וַיֵּרְדוּ
  choice: Ils descendirent
  rationale: Le verbe ירד signifie « descendre ». Le passé simple convient à la narration biblique française actuelle et conserve le mouvement directionnel.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Forme française usuelle du nom de lieu, avec l’accent graphique attendu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Formule de serment אִם אֶעֶזְבֶךָּ
  choice: je ne te quitterai pas
  alternative: si je te quitte…
  rationale: L’hébreu laisse l’imprécation sous-entendue. Le français explicite la portée négative du serment dans le texte, tandis que la note en conserve la forme littérale et la tension rhétorique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient la narration écrite sans archaïsme excessif. « Je te prie » conserve la politesse de נָא, et la formule « Aussi vrai que… » rend le serment hébreu de manière intelligible tout en maintenant sa solennité.
