  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: fr
  text: 'Élie lui dit : « Reste ici, je te prie, car Yahweh m’a envoyé vers le Jourdain[a]. » Mais Élisée répondit : « Aussi vrai que Yahweh est vivant et que tu es vivant[b], je ne te quitterai pas ! » Ils poursuivirent donc leur chemin tous les deux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au Jourdain ».'
    reason: lexical_alternative
  - marker: b
    text: 'Formule hébraïque de serment, littéralement : « Yahweh est vivant, et ta vie est vivante, si je te quitte… » La conséquence imprécatoire reste sous-entendue ; le sens est : « Je ne te quitterai certainement pas. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: Reste ici, je te prie
  rationale: Le verbe ישׁב signifie ici rester sur place plutôt que s’asseoir. La tournure « je te prie » restitue la nuance d’invitation ou de demande portée par נָא dans un registre digne et naturel.
- source_word: כִּי יְהוָה שְׁלָחַנִי
  choice: car Yahweh m’envoie
  rationale: Le parfait שְׁלָחַנִי désigne une mission reçue qui détermine le déplacement présent. Le présent français exprime naturellement cette mission en cours, sans nier qu’elle a déjà été confiée.
- source_word: הַיַּרְדֵּנָה
  choice: vers le Jourdain
  rationale: Le ה directionnel indique un mouvement en direction du Jourdain. « Vers » préserve cette valeur sans préciser au-delà de l’hébreu si la destination est le fleuve lui-même ou sa région immédiate.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formule française restitue clairement la force solennelle de l’expression hébraïque de serment tout en conservant l’affirmation que Yahweh est vivant.
- source_word: וְחֵי נַפְשְׁךָ
  choice: et que tu es vivant
  rationale: Dans cette formule de serment, נֶפֶשׁ renvoie à la vie ou à la personne de l’interlocuteur. Une traduction littérale par « ton âme vit » serait peu naturelle et pourrait suggérer une distinction anthropologique étrangère au propos.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: je ne te quitterai pas
  rationale: אִם introduit ici la proposition elliptique d’un serment imprécatoire. Le français exprime correctement sa valeur pragmatique par une négation catégorique.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: Ils poursuivirent donc leur chemin tous les deux
  rationale: La formulation rend à la fois la poursuite du déplacement et l’insistance de שְׁנֵיהֶם sur le fait qu’Élie et Élisée continuent ensemble.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin, non un titre. « Yahweh » le représente directement en français et permet de conserver sa fonction personnelle dans la déclaration et le serment.
- issue: Forme elliptique du serment אִם אֶעֶזְבֶךָּ
  choice: je ne te quitterai pas
  alternative: si je te quitte…
  rationale: L’hébreu omet la malédiction appelée sur celui qui violerait le serment. Traduire seulement « si je te quitte » obscurcirait le sens pour le lecteur français ; la négation ferme transmet la portée de la formule sans inventer le contenu de l’imprécation omise.
translation_notes:
  register: Français international moderne, narratif et digne. Les répliques restent naturelles sans gommer la solennité du serment. La répétition de « vivant » conserve le parallélisme hébreu, tandis que la note explicite son caractère idiomatique.
