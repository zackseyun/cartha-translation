id: 2KI.2.11
reference: 2 Kings 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י הֵ֣מָּה הֹלְכִ֤ים הָלוֹךְ֙ וְ/דַבֵּ֔ר וְ/הִנֵּ֤ה רֶֽכֶב אֵשׁ֙ וְ/ס֣וּסֵי אֵ֔שׁ וַ/יַּפְרִ֖דוּ בֵּ֣ין שְׁנֵי/הֶ֑ם וַ/יַּ֨עַל֙ אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: fr
  text: Comme ils continuaient leur chemin tout en parlant, voici qu’un char de feu et des chevaux de feu les séparèrent l’un de l’autre[a], et Élie monta au ciel dans le tourbillon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte dit que le char et les chevaux de feu séparèrent Élie et Élisée ; il ne précise pas qu’Élie monta dans le char.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « par le tourbillon ». La préposition hébraïque peut indiquer le moyen, l’accompagnement ou le lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה
  choice: Comme ils
  rationale: La tournure introduit le nouvel événement tout en rattachant temporellement celui-ci à l’action en cours. « Comme ils » est naturel en français moderne et conserve cette articulation narrative.
- source_word: הֹלְכִים הָלוֹךְ
  choice: continuaient leur chemin
  rationale: Le participe accompagné de l’infinitif absolu souligne la durée ou la continuation du déplacement. Cette formulation rend cet aspect sans lourdeur.
- source_word: וְדַבֵּר
  choice: tout en parlant
  rationale: L’action de parler est simultanée à la marche. « Tout en parlant » exprime clairement cette concomitance.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette formule attire l’attention sur une apparition saisissante et immédiate sans ajouter explicitement l’idée de soudaineté.
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: un char de feu et des chevaux de feu
  rationale: La répétition de « feu » reproduit le parallélisme concret des deux groupes construits hébreux sans réduire l’image à un simple adjectif.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: les séparèrent l’un de l’autre
  rationale: Le pluriel renvoie naturellement au char et aux chevaux pris ensemble, tandis que « l’un de l’autre » rend explicitement la relation entre les deux hommes.
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: Élie monta
  rationale: Le verbe עלה signifie directement « monter ». La formulation reste simple, narrative et digne.
- source_word: בַּסְעָרָה
  choice: dans le tourbillon
  rationale: « Tourbillon » rend ici le vent violent de סְעָרָה. « Dans » conserve la latitude de la préposition ב, qui peut évoquer le milieu, l’accompagnement ou le moyen.
- source_word: הַשָּׁמָיִם
  choice: au ciel
  rationale: Avec le verbe de mouvement, « monter au ciel » est l’expression française naturelle correspondant ici à la destination indiquée par הַשָּׁמָיִם.
theological_decisions:
- issue: Le char de feu a-t-il transporté Élie, ou le tourbillon est-il lié à son ascension ?
  choice: Le texte dit que le char et les chevaux séparent les deux hommes, puis qu’Élie monte au ciel dans le tourbillon.
  alternative: Élie monte au ciel à bord du char de feu.
  rationale: L’hébreu ne dit pas explicitement qu’Élie est monté dans le char. Il distingue la séparation causée par le char et les chevaux de l’ascension d’Élie associée au tourbillon. La traduction maintient cette distinction.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » maintient le relief littéraire de l’apparition, tandis que le reste de la phrase évite les tournures archaïques. Les deux notes sont placées exactement sur les expressions qu’elles éclairent.
