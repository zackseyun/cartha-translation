  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: fr
  text: 'Ils lui dirent : « Regarde : il y a parmi tes serviteurs cinquante hommes capables. Permets-leur, s’il te plaît, d’aller chercher ton maître. Peut-être que l’Esprit de Yahweh[a] l’a emporté et jeté sur l’une des montagnes ou dans l’une des vallées. » Mais il répondit : « Ne les envoyez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vent de Yahweh ». Le mot hébreu traduit par « Esprit » peut aussi signifier « vent ».
    reason: Conserver l’ambiguïté lexicale réelle de רוּחַ.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Écoute
  rationale: Dans ce dialogue, l’expression sert à attirer poliment l’attention avant une proposition. « Écoute » est naturel en français moderne, tandis que la politesse de la demande est aussi portée par « s’il te plaît ».
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: il y a parmi tes serviteurs
  rationale: La tournure existentielle désigne des hommes disponibles au sein du groupe des serviteurs; cette formulation reste proche de l’hébreu tout en étant naturelle en français.
- source_word: חֲמִשִּׁים אֲנָשִׁים בְּנֵי חַיִל
  choice: cinquante hommes capables
  rationale: L’idiome בְּנֵי חַיִל évoque ici des hommes vigoureux et aptes à mener la recherche, sans imposer une nuance militaire.
- source_word: יֵלְכוּ נָא
  choice: Permets-leur, s’il te plaît, d’aller
  rationale: Le jussif accompagné de נָא exprime une demande polie adressée à Élisée et implique qu’il autorise leur départ.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: chercher ton maître
  rationale: בקשׁ signifie ici rechercher une personne, et אֲדֹנֶיךָ désigne Élie dans sa relation de maître à disciple avec Élisée.
- source_word: פֶּן
  choice: Peut-être
  rationale: La particule introduit ici une explication conjecturale de la disparition d’Élie, plutôt qu’un résultat à éviter.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: l’Esprit de Yahweh l’a-t-il emporté
  rationale: Le contexte d’une action divine extraordinaire favorise « Esprit », tandis que le sens lexical possible « vent » est conservé en note.
- source_word: וַיַּשְׁלִכֵהוּ
  choice: et jeté
  rationale: Le verbe exprime l’action de jeter; ce choix français est direct, courant et compatible avec le déplacement décrit.
- source_word: בְּאַחַד הֶהָרִים א֖וֹ בְּאַחַת הַגֵּאָיוֹת
  choice: sur l’une des montagnes ou dans l’une des vallées
  rationale: Les prépositions françaises rendent naturellement les lieux d’aboutissement, et « vallées » demeure accessible tout en couvrant le sens de גיא.
- source_word: לֹא תִשְׁלָחוּן
  choice: Ne les envoyez pas
  rationale: L’impératif négatif pluriel répond directement à la proposition d’envoyer les cinquante hommes.
theological_decisions:
- issue: Sens de רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  alternative: le vent de Yahweh
  rationale: Dans le récit de l’enlèvement extraordinaire d’Élie, l’action personnelle attribuée à Yahweh favorise la lecture « Esprit ». Puisque רוּחַ peut aussi désigner le vent et que cette nuance reste possible, elle est signalée sans résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier hébreu adressé à Élisée; la réponse finale emploie le pluriel parce qu’elle vise le groupe. La syntaxe interrogative inversée après « Peut-être » préserve clairement la valeur conjecturale.
