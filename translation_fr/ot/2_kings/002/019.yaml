source:
  edition: WLC
  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל אֱלִישָׁ֔ע הִנֵּה נָ֞א מוֹשַׁ֤ב הָ/עִיר֙ ט֔וֹב כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י רֹאֶ֑ה וְ/הַ/מַּ֥יִם רָעִ֖ים וְ/הָ/אָ֥רֶץ מְשַׁכָּֽלֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: fr
  text: 'Les hommes de la ville dirent à Élisée : « Voici, je vous prie : l’emplacement de la ville est bon, comme mon seigneur peut le voir, mais l’eau est mauvaise et le pays cause des fausses couches[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et le pays est improductif ». Le mot hébreu traduit par « cause des fausses couches » peut désigner la perte de progéniture et, dans ce contexte, peut aussi s’étendre à la stérilité agricole.'
    reason: Alternative lexicale préservant l’étendue sémantique de מְשַׁכָּלֶת.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: dirent
  rationale: Le waw consécutif fait progresser le récit; le passé simple convient au registre narratif français.
- source_word: אַנְשֵׁי הָעִיר
  choice: les hommes de la ville
  rationale: La formulation conserve le masculin pluriel explicite de l’hébreu plutôt que de le neutraliser en « habitants ».
- source_word: הִנֵּה נָא
  choice: Voici, s’il te plaît
  rationale: « Voici » garde la valeur déictique de הִנֵּה, tandis que « s’il te plaît » rend l’adoucissement poli de נָא.
- source_word: מוֹשַׁב הָעִיר
  choice: l’emplacement de la ville
  rationale: Dans ce contexte, מוֹשָׁב désigne le site ou la situation géographique de la ville.
- source_word: טוֹב
  choice: bon
  rationale: Traduction directe qui exprime l’évaluation favorable du site.
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: comme mon seigneur peut le voir
  rationale: La tournure française naturelle conserve l’idée de constat visuel et l’adresse respectueuse.
- source_word: וְהַמַּיִם רָעִים
  choice: mais l’eau est mauvaise
  rationale: « Mais » explicite le contraste contextuel; le singulier collectif « l’eau » est idiomatique en français.
- source_word: וְהָאָרֶץ
  choice: et le pays
  rationale: « Pays » peut désigner la contrée environnante et permet au verbe suivant de viser ses êtres vivants comme sa fécondité, sans réduire אֶרֶץ au seul sol.
- source_word: מְשַׁכָּלֶת
  choice: provoque des fausses couches
  rationale: Le participe piel de שׁכל exprime le fait de priver de progéniture ou de faire perdre les petits. Cette traduction conserve sa force concrète, tandis que la note signale son extension possible à l’improductivité agricole.
theological_decisions:
- issue: Sens de אֲדֹנִי dans l’adresse à Élisée
  choice: mon seigneur
  alternative: mon maître
  rationale: Il s’agit d’un titre social respectueux adressé au prophète, et non d’un titre divin.
- issue: Portée de מְשַׁכָּלֶת
  choice: provoque des fausses couches
  alternative: est stérile / improductif
  rationale: Le texte conserve l’image forte de la perte de progéniture sans décider si elle concerne seulement les humains et les animaux ou s’étend aussi aux récoltes; cette ambiguïté est explicitée en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple soutient le registre narratif biblique sans archaïsme excessif. « Mon seigneur » reste un titre de respect humain dans ce contexte.
