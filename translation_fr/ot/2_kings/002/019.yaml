  source_fidelity: 'Le sens des principales unités hébraïques est bien rendu : אַנְשֵׁי הָעִיר par « les hommes de la ville », מוֹשַׁב par « emplacement », l’adresse honorifique אֲדֹנִי par « mon seigneur », et מְשַׁכָּלֶת par une formulation concrète accompagnée d’une note qui maintient l’ambiguïté contextuelle. Le passé simple rend adéquatement la progression narrative du waw consécutif.'
