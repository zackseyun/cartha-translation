  terminology: « Élisée » et « mon seigneur » sont appropriés. « Pays » préserve utilement l’ampleur de הָאָרֶץ. La note exprime correctement que le terme peut viser la perte de progéniture et, contextuellement, l’infécondité agricole, sans trancher indûment.
