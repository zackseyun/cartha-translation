  text: וֶ/אֱלִישָׁ֣ע רֹאֶ֗ה וְ/ה֤וּא מְצַעֵק֙ אָבִ֣/י אָבִ֗/י רֶ֤כֶב יִשְׂרָאֵל֙ וּ/פָ֣רָשָׁ֔י/ו וְ/לֹ֥א רָאָ֖/הוּ ע֑וֹד וַֽ/יַּחֲזֵק֙ בִּ/בְגָדָ֔י/ו וַ/יִּקְרָעֵ֖/ם לִ/שְׁנַ֥יִם קְרָעִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: fr
  text: 'Élisée regardait et criait : « Mon père ! Mon père ! Le char d’Israël et ses cavaliers ! »[a] Puis il ne le vit plus. Alors il saisit ses vêtements et les déchira en deux morceaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « Le char d’Israël et ses cavaliers ! » peut désigner Élie comme la véritable force et défense d’Israël, ou renvoyer au char et aux chevaux célestes dont Élisée est témoin.
    reason: Préserver l’ambiguïté du référent de l’exclamation.
lexical_decisions:
- source_word: רֹאֶה
  choice: regardait
  rationale: 'Le participe exprime une action en cours : Élisée est en train de regarder la scène. L’imparfait français en rend naturellement la durée.'
- source_word: מְצַעֵק
  choice: criait
  rationale: Le participe indique lui aussi une action en cours, contemporaine de la vision. « Criait » conserve la vivacité et la charge émotionnelle.
- source_word: אָבִי אָבִי
  choice: Mon père ! Mon père !
  rationale: La répétition et le suffixe de première personne sont conservés. Il s’agit d’une adresse exprimant la relation entre Élisée et Élie, non d’une paternité biologique.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Char d’Israël et ses cavaliers !
  rationale: Cette formulation garde le singulier « char », le pluriel « cavaliers » et le suffixe masculin singulier, sans imposer si l’exclamation désigne Élie ou la scène céleste.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: Puis il ne le vit plus
  rationale: Cette tournure française exprime clairement la cessation indiquée par עוֹד et s’intègre naturellement au récit.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: il saisit ses vêtements
  rationale: « Saisit » rend l’action énergique de prendre fermement les vêtements, tandis que le possessif traduit le suffixe hébreu sans ajouter explicitement « ses propres ».
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: les déchira en deux morceaux
  rationale: La formulation restitue le résultat de l’action et reste intelligible comme geste de deuil.
theological_decisions:
- issue: Sens de l’exclamation « Mon père ! Mon père ! Char d’Israël et ses cavaliers ! »
  choice: Conserver dans le texte une exclamation directe et métaphorique, sans en préciser le référent.
  alternative: Élisée peut identifier Élie comme la véritable force défensive d’Israël, ou parler du char et des cavaliers célestes qu’il voit.
  rationale: L’hébreu permet ces deux compréhensions. Une traduction directe, accompagnée d’une note, préserve l’ambiguïté et la tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Les imparfaits rendent les participes hébreux de manière durative; le passé simple fait progresser le récit. La métaphore centrale demeure volontairement non interprétée dans le corps du texte.
