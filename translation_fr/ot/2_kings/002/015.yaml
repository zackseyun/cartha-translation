id: 2KI.2.15
reference: 2 Kings 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: fr
  text: 'Quand les fils des prophètes qui se trouvaient à Jéricho l’aperçurent de loin[a], ils dirent : « L’esprit d’Élie repose sur Élisée. » Puis ils vinrent à sa rencontre et se prosternèrent devant lui jusqu’à terre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’en face ». L’expression hébraïque évoque une position opposée, à une certaine distance.
    reason: lexical_alternative
  - marker: b
    text: Ce geste exprime ici le respect et la soumission ; il ne désigne pas nécessairement une adoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֻהוּ
  choice: le virent
  rationale: Rend simplement le verbe ראה avec son suffixe objet masculin singulier, conformément au déroulement narratif.
- source_word: בְנֵי הַנְּבִיאִים
  choice: les fils des prophètes
  rationale: Conserve l’expression hébraïque et sa texture, tout en restant compréhensible en français biblique courant.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: qui étaient à Jéricho
  rationale: Identifie naturellement le groupe concerné par sa localisation.
- source_word: מִנֶּגֶד
  choice: d’en face
  rationale: Préserve l’idée spatiale d’une position opposée et visible, plutôt que de réduire l’expression à la seule notion de distance.
- source_word: נָחָה
  choice: repose
  rationale: Le parfait décrit ici un état établi constaté par les disciples des prophètes; le présent français exprime naturellement ce résultat.
- source_word: רוּחַ אֵלִיָּהוּ
  choice: L’esprit d’Élie
  rationale: Traduction directe du groupe construit, sans préciser dans le corps du texte s’il s’agit de l’esprit prophétique, de la puissance ou de la personne d’Élie.
- source_word: עַל אֱלִישָׁע
  choice: sur Élisée
  rationale: Rend directement עַל avec רוּחַ et conserve l’image de l’esprit reposant sur quelqu’un.
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: Expression française idiomatique correspondant au mouvement vers une personne afin de la rencontrer.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: se prosternèrent devant lui
  rationale: Restitue nettement le geste de profonde révérence sans le qualifier automatiquement d’adoration.
- source_word: אָרְצָה
  choice: jusqu’à terre
  rationale: Exprime la direction et l’ampleur physique de la prosternation indiquées par la forme directive.
theological_decisions:
- issue: Sens de « l’esprit d’Élie »
  choice: Maintenir littéralement « l’esprit d’Élie » dans le texte.
  alternative: Expliciter « l’esprit prophétique d’Élie » ou « la puissance prophétique d’Élie ».
  rationale: Le contexte évoque la succession et l’habilitation prophétiques, mais l’hébreu ne formule pas lui-même cette explication. La traduction conserve donc l’ambiguïté et évite aussi d’affirmer une transmigration personnelle.
- issue: Portée de la prosternation devant Élisée
  choice: Décrire un geste de profonde révérence devant Élisée.
  alternative: Employer un terme impliquant explicitement l’adoration religieuse.
  rationale: Le verbe peut désigner une prosternation devant Dieu ou devant un être humain selon le contexte. Ici, il marque la reconnaissance de l’autorité d’Élisée sans imposer l’idée d’un culte rendu à sa personne.
translation_notes:
  register: Français international moderne, narratif et digne. « Fils des prophètes » conserve l’idiome hébraïque; « d’en face » maintient sa nuance spatiale avec une note pour l’autre rendu possible. La place des notes suit strictement l’ordre [a], [b].
