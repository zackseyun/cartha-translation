id: 2KI.12.15
reference: 2 Kings 12:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי לְ/עֹשֵׂ֥י הַ/מְּלָאכָ֖ה יִתְּנֻ֑/הוּ וְ/חִזְּקוּ ב֖/וֹ אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/015.yaml
  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: fr
  text: car ils le remettaient à ceux qui exécutaient les travaux et, avec cet argent, ils réparaient la maison de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire le temple de Yahweh.
    reason: Clarification contextuelle de l’expression hébraïque « maison de Yahweh ».
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication de l’absence de vérification des comptes mentionnée au verset précédent.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: à ceux qui exécutaient les travaux
  rationale: Cette formulation rend littéralement l’idée de « ceux qui font le travail » tout en restant naturelle et sans préciser inutilement leur genre.
- source_word: יִתְּנֻהוּ
  choice: ils le remettaient
  rationale: L’imparfait français exprime naturellement l’action habituelle ou répétée décrite ici; le pronom renvoie à l’argent du contexte.
- source_word: וְחִזְּקוּ
  choice: ils réparaient
  rationale: Dans le contexte d’un bâtiment, le verbe « fortifier, rendre solide » désigne idiomatiquement sa remise en état.
- source_word: בּוֹ
  choice: avec cet argent
  rationale: Le pronom renvoie à l’argent mentionné dans le contexte. L’explicitation évite le tour français peu naturel « avec lui ».
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction conserve l’image hébraïque de la « maison » et rend directement le nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre divin plutôt que de lui substituer un titre.
- issue: Identification de בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: Le texte principal préserve l’expression hébraïque, tandis que la note indique son référent contextuel sans effacer l’image originale.
translation_notes:
  register: Français international moderne, digne et accessible. Les imparfaits rendent la valeur habituelle des verbes dans ce contexte narratif. Le maintien de « ils » dans les deux propositions respecte la formulation hébraïque sans résoudre explicitement son léger flottement référentiel.
