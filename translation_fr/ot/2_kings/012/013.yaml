base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: fr
  text: aux maçons[a] et aux tailleurs de pierre, ainsi qu’à l’achat de bois de construction et de pierres de carrière[b], afin de réparer les parties endommagées de la maison de Yahweh[c], et à toutes les dépenses engagées pour réparer cette maison[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ouvriers chargés des murs »; le terme hébreu peut désigner plus largement ceux qui construisent ou réparent des ouvrages de maçonnerie.
    reason: lexical_alternative
  - marker: b
    text: Ou « pierres taillées » ou « pierres de taille ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « afin de consolider la brèche — ou les dégradations — de la maison de Yahweh ».'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « pour tout ce qui sort pour la maison, afin de la consolider », c’est-à-dire pour toutes les dépenses nécessaires à sa remise en état.'
    reason: idiom_clarification
lexical_decisions:
- source_word: גֹּדְרִים
  choice: maçons
  rationale: Le participe désigne ici des ouvriers chargés de travaux de maçonnerie ou de réfection des murs. « Maçons » convient au contexte et s’accorde naturellement avec « tailleurs de pierre ».
- source_word: חֹצְבֵי הָאֶבֶן
  choice: tailleurs de pierre
  rationale: L’expression désigne ceux qui extraient ou taillent la pierre. « Tailleurs de pierre » est clair et idiomatique en français actuel.
- source_word: לִקְנוֹת עֵצִים
  choice: à l’achat de bois de construction
  rationale: Dans ce contexte, עֵצִים désigne du bois destiné aux travaux, et non du bois de chauffage. La formulation nominale s’intègre à la série des affectations de fonds.
- source_word: אַבְנֵי מַחְצֵב
  choice: pierres de carrière
  rationale: L’expression désigne des pierres extraites d’une carrière. Ce rendu conserve cette nuance sans préciser indûment le degré de taille ou de finition.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: afin de réparer les parties endommagées
  rationale: Littéralement, il s’agit de « fortifier » ou « consolider » une brèche ou une dégradation. En contexte architectural, « réparer les parties endommagées » exprime naturellement l’action visée tout en maintenant l’objet concret des travaux.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » préserve l’expression hébraïque, qui désigne ici le temple, et le nom divin est translittéré « Yahweh ».
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: et à toutes les dépenses engagées
  rationale: L’expression littérale « tout ce qui sort pour la maison » est un idiome relatif aux sommes dépensées. Le rendu français en explicite le sens financier.
- source_word: לְחָזְקָה
  choice: pour réparer cette maison
  rationale: Le verbe signifie fondamentalement « rendre fort, consolider »; dans ce contexte, il désigne la remise en état du bâtiment. « Cette maison » lève naturellement l’ambiguïté du pronom français sans ajouter de nouveau référent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase demeure un fragment coordonné, conformément à l’hébreu et à sa continuité avec le verset précédent. Le vocabulaire technique reste accessible, et les notes préservent les nuances littérales de חזק, בדק et de l’idiome financier.
