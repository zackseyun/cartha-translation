  text: וְ/יוֹזָבָ֣ד בֶּן שִׁ֠מְעָת וִ/יהוֹזָבָ֨ד בֶּן שֹׁמֵ֤ר עֲבָדָי/ו֙ הִכֻּ֣/הוּ וַ/יָּמֹ֔ת וַ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: fr
  text: Yozabad, fils de Shiméath, et Yehozabad, fils de Shomer, ses serviteurs[a], le frappèrent, et il mourut. On l’enterra auprès de ses ancêtres dans la Cité de David, et son fils Amatsia régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses fonctionnaires ». Le mot hébreu peut désigner des serviteurs ou des agents de la cour selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד
  choice: Yozabad
  rationale: Nom propre translittéré selon une forme française claire; le waw initial est rendu naturellement par la coordination avec le second sujet plutôt que par un « Et » d’ouverture.
- source_word: בֶּן שִׁמְעָת
  choice: fils de Shiméath
  rationale: La construction généalogique est rendue directement; l’accent aide la lecture française du nom.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: et Yehozabad, fils de Shomer
  rationale: La conjonction est conservée entre les deux sujets et les noms propres sont translittérés sans être traduits.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עֶבֶד peut désigner des serviteurs, des agents de cour ou des fonctionnaires. « Serviteurs » conserve l’étendue sémantique sans imposer l’idée d’esclavage.
- source_word: הִכֻּהוּ וַיָּמֹת
  choice: le frappèrent, et il mourut
  rationale: La traduction distingue l’action de frapper de la mort qui suit, conformément à la progression explicite de l’hébreu.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: On l’enterra
  rationale: Le pluriel indéfini hébreu se rend naturellement en français par « on »; le référent exact des personnes chargées de l’inhumation n’est pas précisé.
- source_word: עִם אֲבֹתָיו
  choice: auprès de ses ancêtres
  rationale: Dans ce contexte funéraire, « auprès de ses ancêtres » exprime naturellement l’inhumation dans le cadre dynastique sans laisser entendre qu’ils furent placés dans une même tombe.
- source_word: בְּעִיר דָּוִד
  choice: dans la Cité de David
  rationale: Forme française établie du nom de lieu; la majuscule marque son emploi comme désignation géographique.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: et son fils Amatsia régna à sa place
  rationale: La formule de succession est rendue de façon directe et idiomatique tout en conservant le verbe « régner ».
theological_decisions: []
