source:
  edition: WLC
  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: fr
  text: L’argent provenant des offrandes de réparation et des sacrifices pour le péché ne devait pas être apporté dans la maison de Yahvé[a] ; il revenait aux prêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de Yahvé », c’est-à-dire le temple.'
    reason: clarification
lexical_decisions:
- source_word: כֶּסֶף
  choice: l’argent
  rationale: Dans ce contexte de finances cultuelles, le terme désigne de l’argent remis en paiement, bien que son sens premier soit « argent métal ».
- source_word: אָשָׁם
  choice: offrandes de réparation
  rationale: Dans le vocabulaire sacrificiel, le terme désigne une offrande liée à la culpabilité et à la réparation. Cette formulation exprime sa fonction sans réduire le terme au seul sentiment de culpabilité.
- source_word: חַטָּאוֹת
  choice: sacrifices pour le péché
  rationale: Le pluriel renvoie ici à une catégorie sacrificielle et non aux péchés eux-mêmes. « Sacrifices pour le péché » est clair et courant en français biblique moderne.
- source_word: לֹא יוּבָא
  choice: n’était pas apporté
  rationale: L’imparfait passif négatif énonce la pratique prescrite concernant ces fonds dans le cadre narratif. La formulation française reste naturelle sans durcir explicitement l’énoncé en interdiction.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: La traduction conserve l’image hébraïque de la « maison » et rend directement le nom divin, tout en laissant la note préciser qu’il s’agit du temple.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: il revenait aux prêtres
  rationale: La clause indique l’attribution de cet argent aux prêtres. Le singulier s’accorde naturellement avec le nom collectif « argent ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme. « Yahvé » est une restitution française largement reconnaissable du nom propre, plutôt qu’un titre substitutif.
- issue: Sens cultuel de אָשָׁם
  choice: offrande de réparation
  alternative: sacrifice de culpabilité
  rationale: Le terme peut mettre en jeu à la fois la culpabilité et la réparation. « Offrande de réparation » conserve ici la dimension compensatoire de cette catégorie sacrificielle sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure administrative du verset et la distinction entre les deux catégories sacrificielles. « Maison de Yahvé » maintient l’expression hébraïque, explicitée en note.
