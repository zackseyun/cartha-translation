lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: avait sept ans
  rationale: La tournure hébraïque בֶּן + nombre + שָׁנִים exprime l’âge. « Avait sept ans » est son équivalent idiomatique naturel en français.
- source_word: יְהוֹאָשׁ
  choice: Joas
  rationale: « Joas » est la forme française traditionnelle et courante du nom hébreu יְהוֹאָשׁ; une note signale la translittération plus directe « Yehoash ».
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition בְּ suivie de l’infinitif construit de מלך et du suffixe pronominal forme ici une proposition temporelle. « Lorsqu’il devint roi » rend clairement l’accession à la royauté sans suggérer un règne progressif.
