source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: fr
  text: Alors le prêtre Yehoyada prit un coffre, perça un trou dans son couvercle[a] et le plaça à côté de l’autel, à droite lorsqu’un homme entre dans la maison de Yahweh[b]. Les prêtres qui gardaient le seuil y déposaient tout l’argent[c] apporté dans la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa porte ». Il s’agit vraisemblablement de la partie mobile fermant le coffre, donc de son couvercle.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « lorsqu’un homme entre » indique que la droite est déterminée du point de vue de la personne qui entre; le singulier peut avoir une valeur générale.
    reason: clarification
  - marker: c
    text: Le mot hébreu peut désigner aussi bien l’argent métal que l’argent servant de monnaie.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אֲרוֹן אֶחָד
  choice: un coffre
  rationale: Dans le contexte de la collecte destinée au temple, אֲרוֹן désigne un contenant. « Coffre » est naturel en français et évite les associations particulières du mot « arche ».
- source_word: וַיִּקֹּב חֹר
  choice: perça un trou
  rationale: La combinaison de נקב et חור décrit l’action de pratiquer une ouverture dans le coffre. « Perça un trou » rend clairement l’action physique.
- source_word: בְּדַלְתּוֹ
  choice: dans son couvercle
  rationale: דֶּלֶת signifie habituellement « porte », mais désigne ici vraisemblablement la partie mobile qui ferme le coffre; « couvercle » est donc le terme contextuel le plus naturel, avec le sens littéral signalé en note.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: à côté de l’autel
  rationale: אֵצֶל exprime ici la proximité spatiale.
- source_word: בימין בְּבוֹא אִישׁ
  choice: à droite lorsqu’un homme entre
  rationale: La formulation conserve le singulier masculin אִישׁ et situe le coffre du point de vue de la personne qui entre.
- source_word: שֹׁמְרֵי הַסַּף
  choice: qui gardaient le seuil
  rationale: Cette traduction préserve l’image concrète du seuil ainsi que la fonction de garde exercée par les prêtres.
- source_word: כָּל הַכֶּסֶף
  choice: tout l’argent
  rationale: En français comme en hébreu, « argent » peut désigner à la fois le métal et la monnaie; le choix conserve ainsi naturellement l’ambiguïté lexicale.
- source_word: וְנָתְנוּ שָׁמָּה
  choice: y déposaient
  rationale: L’imparfait français rend bien l’action habituelle des prêtres qui plaçaient dans le coffre les sommes apportées.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’expression concrète « maison » plutôt que de l’expliciter par « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de rendre directement le tétragramme présent dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le nom divin; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Portée du masculin singulier אִישׁ
  choice: lorsqu’un homme entre
  alternative: lorsqu’on entre
  rationale: Le rendu retenu garde la forme masculine singulière de l’hébreu sans exclure la possibilité d’un emploi représentatif, laquelle est précisée en note.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe narrative reste fluide tout en conservant les repères spatiaux du texte hébreu. « Yehoyada » représente directement le nom hébreu, et « maison de Yahweh » maintient l’image source.
