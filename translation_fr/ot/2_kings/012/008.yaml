  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: fr
  text: 'Alors le roi Joas convoqua le prêtre Jehoïada et les prêtres, et leur dit : « Pourquoi ne réparez-vous pas les dommages du Temple[a] ? À présent, ne recevez pas d’argent des personnes que vous connaissez[b], mais affectez-le à la réparation du Temple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de la maison » ; il s’agit du Temple.
    reason: cultural_note
  - marker: b
    text: Le terme hébreu est difficile. Il peut aussi désigner « vos connaissances », « vos donateurs » ou « vos contributeurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convoqua
  rationale: Dans ce contexte royal et administratif, קרא indique que le roi fait venir les intéressés; « convoqua » exprime clairement cette nuance.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: le roi Joas
  rationale: « Joas » est la forme française traditionnelle et courante du nom יהואש; le titre précède naturellement le nom.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: le prêtre Jehoïada et les prêtres
  rationale: La formulation conserve les deux groupes explicitement nommés sans ajouter « autres », absent de l’hébreu.
- source_word: אֵינְכֶם מְחַזְּקִים אֶת בֶּדֶק הַבָּיִת
  choice: ne réparez-vous pas les dégradations du Temple
  rationale: חזק, associé à בדק הבית, désigne ici l’action de réparer les parties endommagées. « Dégradations » rend l’objet des travaux, tandis que « Temple » explicite le référent contextuel de « la maison ».
- source_word: וְעַתָּה
  choice: Désormais
  rationale: Le terme introduit une nouvelle directive qui modifie la pratique antérieure; « Désormais » rend naturellement cette transition.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: ne recevez plus d’argent
  rationale: כסף désigne ici des fonds plutôt que le métal; « recevoir » convient au contexte des sommes remises aux prêtres, et « plus » traduit naturellement la cessation exigée.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: de ceux qui vous sont connus
  rationale: מַכָּרֵיכֶם est difficile. La traduction retient son sens relationnel le plus littéral sans imposer l’interprétation contextuelle « donateurs » ou « contributeurs ».
- source_word: כִּי לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: mais remettez-le pour les réparations du Temple
  rationale: כי possède ici une valeur corrective ou adversative. Le suffixe de תתנהו renvoie à l’argent; « remettez-le » exprime son affectation directe aux travaux.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le texte explicite « Temple » pour éviter l’ambiguïté référentielle en français, tout en signalant l’expression hébraïque littérale en note. La difficulté de מַכָּרֵיכֶם est conservée plutôt que résolue silencieusement.
