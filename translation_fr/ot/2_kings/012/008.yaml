revisions:
- from: 'Alors le roi Joas convoqua le prêtre Jehoïada et les prêtres, et leur dit : « Pourquoi ne réparez-vous pas les dégradations du Temple[a] ? Désormais, ne recevez plus d’argent de ceux qui vous sont connus[b], mais remettez-le pour les réparations du Temple. »'
  to: 'Alors le roi Joas convoqua le prêtre Jehoïada et les prêtres, et leur dit : « Pourquoi ne réparez-vous pas les dommages du Temple[a] ? À présent, ne recevez pas d’argent des personnes que vous connaissez[b], mais affectez-le à la réparation du Temple. »'
  rationale: La révision améliore l’idiomaticité française et la précision sans trancher le sens disputé de מַכָּרֵיכֶם. Elle maintient le référent contextuel « Temple », conserve l’alternance entre les dommages et leur réparation, et rend plus directement la transition וְעַתָּה.
