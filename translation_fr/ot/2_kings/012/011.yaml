- from: Chaque fois qu’ils voyaient qu’il y avait beaucoup d’argent dans le coffre, le secrétaire du roi et le grand prêtre montaient. Ils mettaient en paquets et comptaient l’argent qui se trouvait dans la maison de l’Éternel.
  to: Chaque fois qu’ils voyaient qu’il y avait beaucoup d’argent dans le coffre, le secrétaire du roi et le grand prêtre montaient alors, liaient l’argent en paquets et le comptaient, l’argent qui se trouvait dans la maison de l’Éternel.
  rationale: La révision explicite que l’argent est l’objet de l’action de lier en paquets, sans imposer un type précis de contenant. Elle maintient la valeur habituelle de la construction et l’ambiguïté du pronom initial, tout en rendant la succession des verbes hébreux dans une syntaxe française fluide.
