base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: fr
  text: Chaque fois qu’ils voyaient qu’il y avait beaucoup d’argent dans le coffre, le secrétaire du roi et le grand prêtre montaient alors, liaient l’argent en paquets et le comptaient, l’argent qui se trouvait dans la maison de l’Éternel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּסֶף
  choice: argent
  rationale: Dans ce contexte de collecte et de comptage, le mot désigne l’argent monnayé ou pesé, tout en conservant en français son lien naturel avec le métal.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: le secrétaire du roi
  rationale: סֹפֵר désigne ici un haut fonctionnaire chargé des écritures et des comptes royaux ; « secrétaire » est clair et naturel en français moderne.
- source_word: וַיָּצֻרוּ
  choice: ils mettaient en paquets
  rationale: Le verbe exprime l’action de lier ou de réunir l’argent en contenants ou paquets. Cette formulation reste proche du geste indiqué sans préciser indûment le type exact de contenant.
- source_word: בֵּית יְהוָה
  choice: la maison de l’Éternel
  rationale: « Maison » rend directement בֵּית et désigne ici le temple ; « l’Éternel » représente le nom divin יהוה selon un usage français établi.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Chaque fois que » rend la valeur répétitive de la construction narrative. Le pronom « ils » demeure non explicité, comme dans le texte hébreu. La seconde phrase allège la longue coordination hébraïque sans en modifier la succession.
