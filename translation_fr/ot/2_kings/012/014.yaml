id: 2KI.12.14
reference: 2 Kings 12:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: fr
  text: Toutefois, avec l’argent apporté dans la maison de Yahweh, on ne fabriquait pour la maison de Yahweh ni bassins en argent[a], ni coupe-mèches[b], ni coupes d’aspersion[c], ni trompettes, ni aucun objet en or ou en argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coupes en argent ».
    reason: Le nom hébreu peut désigner différents types de récipients, notamment des bassins ou des coupes.
  - marker: b
    text: Ou « mouchettes ». Le terme hébreu désigne probablement un instrument servant à entretenir ou à couper les mèches des lampes.
    reason: La forme précise de l’instrument n’est pas certaine, même si sa fonction liée à l’entretien des lampes est probable dans ce contexte.
  - marker: c
    text: Ou simplement « coupes ». Leur emploi pour l’aspersion est probable, mais n’est pas exprimé explicitement par le nom hébreu.
    reason: La traduction principale rend la fonction cultuelle vraisemblable du récipient ; la note conserve le sens lexical plus général.
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: La particule marque ici un contraste avec l’emploi de l’argent décrit dans le contexte précédent ; « Toutefois » restitue naturellement cette valeur adversative.
- source_word: יֵעָשֶׂה
  choice: on ne fabriquait
  rationale: Le nifal exprime une action passive et impersonnelle. La tournure française avec « on » conserve cette indétermination tout en évitant un passif lourd devant l’énumération.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve la désignation formelle du sanctuaire et la répétition présente dans l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé directement par le tétragramme.
- source_word: סִפּוֹת כֶּסֶף
  choice: bassins en argent
  rationale: סִפּוֹת désigne des récipients ; « bassins » convient au mobilier du sanctuaire tout en les distinguant des מִזְרָקוֹת mentionnés ensuite.
- source_word: מְזַמְּרוֹת
  choice: coupe-mèches
  rationale: Dans le contexte du sanctuaire, le terme désigne vraisemblablement des instruments servant à entretenir les mèches des lampes. « Coupe-mèches » en rend la fonction dans un français compréhensible.
- source_word: מִזְרָקוֹת
  choice: coupes d’aspersion
  rationale: Ces récipients cultuels servaient probablement à recueillir puis à projeter ou asperger un liquide, notamment le sang sacrificiel ; la traduction explicite cette fonction probable sans la présenter comme certaine grâce à une note.
- source_word: חֲצֹצְרוֹת
  choice: trompettes
  rationale: « Trompettes » est le terme français courant pour ces instruments métalliques employés dans le culte.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: aucun objet en or ou en argent
  rationale: כְּלִי est un terme général pouvant désigner un récipient, un ustensile ou un article ; « objet » garde ici cette amplitude sémantique.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: avec l’argent apporté
  rationale: Dans ce contexte administratif, כֶּסֶף désigne les fonds recueillis. « Avec » exprime naturellement en français la matière ou les ressources à partir desquelles les objets auraient été fabriqués.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition emphatique de « la maison de Yahweh » et l’énumération du texte hébreu, tout en employant une construction impersonnelle naturelle en français.
