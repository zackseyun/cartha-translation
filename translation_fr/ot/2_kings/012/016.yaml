source:
  edition: WLC
  text: וְ/לֹ֧א יְחַשְּׁב֣וּ אֶת הָ/אֲנָשִׁ֗ים אֲשֶׁ֨ר יִתְּנ֤וּ אֶת הַ/כֶּ֨סֶף֙ עַל יָדָ֔/ם לָ/תֵ֖ת לְ/עֹשֵׂ֣י הַ/מְּלָאכָ֑ה כִּ֥י בֶ/אֱמֻנָ֖ה הֵ֥ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/016.yaml
  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: fr
  text: On ne demandait pas de comptes aux hommes à qui l’on confiait l’argent afin qu’ils le remettent à ceux qui exécutaient les travaux, car ils se montraient dignes de confiance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec honnêteté » ou « avec intégrité » ; le terme hébreu décrit une conduite digne de confiance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: on ne demandait pas de comptes
  rationale: Le piel de חשׁב désigne ici l’établissement ou la vérification de comptes. Cette formulation française exprime naturellement l’absence d’obligation de rendre compte.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le pluriel אֲנָשִׁים renvoie ici aux hommes chargés de gérer les fonds; la traduction conserve cette référence masculine explicite.
- source_word: יִתְּנוּ אֶת־הַכֶּסֶף עַל־יָדָם
  choice: à qui l’on confiait l’argent
  rationale: L’expression littérale « donner l’argent sur/dans leur main » est un idiome indiquant que l’argent était placé sous leur responsabilité. « Confier » en transmet naturellement le sens en français.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף peut désigner l’argent métal ou la monnaie; dans le contexte du financement des réparations, « l’argent » convient le mieux.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: à ceux qui exécutaient les travaux
  rationale: Le participe désigne les personnes occupées aux travaux de réparation. Cette formulation reste proche de l’hébreu tout en étant naturelle.
- source_word: בֶאֱמֻנָה
  choice: avec fidélité
  rationale: אֱמוּנָה évoque ici une conduite digne de confiance dans la gestion des fonds. « Avec fidélité » préserve l’étendue du terme, tandis que la note signale les nuances contextuelles d’honnêteté et d’intégrité.
- source_word: הֵם עֹשִׂים
  choice: ils agissaient
  rationale: Dans ce contexte, la construction décrit leur manière habituelle de s’acquitter de leur responsabilité; « ils agissaient » est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « confier l’argent » restitue naturellement l’idiome hébreu de la remise entre les mains de responsables, tandis que « avec fidélité » conserve la portée éthique du texte sans la réduire à la seule honnêteté financière.
