  text: וַ/יֵּאֹ֖תוּ הַ/כֹּֽהֲנִ֑ים לְ/בִלְתִּ֤י קְחַת כֶּ֨סֶף֙ מֵ/אֵ֣ת הָ/עָ֔ם וּ/לְ/בִלְתִּ֥י חַזֵּ֖ק אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: fr
  text: Mais les prêtres acceptèrent de ne pas recevoir d’argent du peuple et de ne pas réparer les dommages du Temple[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fortifier les dommages de la Maison », expression qui signifie réparer les parties endommagées du Temple.'
    reason: lexical_alternative
  - marker: b
    text: La « Maison » désigne ici la maison du SEIGNEUR, c’est-à-dire le Temple.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: acceptèrent
  rationale: Le verbe אבה exprime ici le consentement. « Acceptèrent » est naturel en français et introduit clairement les deux infinitifs qui suivent.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant de כֹּהֲנִים dans ce contexte d’administration du sanctuaire.
- source_word: לְבִלְתִּי קְחַת
  choice: de ne plus recevoir
  rationale: Avec l’infinitif, לְבִלְתִּי exprime ce qu’ils consentent à ne pas faire. Le contexte indique la cessation d’une pratique déjà en cours; « recevoir » convient à l’argent remis par le peuple, sans exclure le sens littéral de « prendre ».
- source_word: כֶּסֶף
  choice: d’argent
  rationale: כֶּסֶף signifie littéralement « argent métal », mais désigne couramment l’argent comme moyen de paiement dans ce contexte administratif.
- source_word: מֵאֵת הָעָם
  choice: du peuple
  rationale: Traduction directe et idiomatique du complément indiquant la provenance.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: et de ne pas réparer
  rationale: חזק signifie littéralement « fortifier, consolider », mais forme avec בֶּדֶק הַבַּיִת une expression relative à la réparation des parties endommagées.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: les dégradations du Temple
  rationale: בֶּדֶק désigne les fissures, brèches ou autres parties endommagées. Dans le contexte, הַבַּיִת est la maison de l’Éternel, c’est-à-dire le Temple; la majuscule rend ce référent explicite tout en conservant une note sur l’expression hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Temple » est employé dans le texte pour éviter que « maison » soit compris comme une habitation ordinaire; les notes préservent néanmoins l’expression hébraïque. « Ne plus recevoir » explicite la cessation impliquée par le contexte immédiat.
