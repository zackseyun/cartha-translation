  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: fr
  text: Or, dans la vingt-troisième année du règne du roi Joas, les prêtres n’avaient pas réparé les dégradations du temple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les brèches de la Maison ». Ici, « la Maison » désigne le temple.'
    reason: Conserve l’alternative concrète pour בֶּדֶק sans la présenter comme le seul sens littéral possible, et signale la référence contextuelle de הַבַּיִת.
lexical_decisions:
- source_word: וַיְהִי
  choice: Dans
  rationale: Le wayyiqtol de היה marque ici une nouvelle étape du récit. En français moderne, la proposition temporelle placée en tête suffit à assurer cette transition sans recourir au tour plus lourd « Il arriva que ».
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: Dans la vingt-troisième année du règne du roi Joas
  rationale: Cette formulation française naturelle explicite la valeur de la préposition ל dans la formule de datation royale. « Joas » est la forme française usuelle du nom יְהוֹאָשׁ.
- source_word: לֹא חִזְּקוּ
  choice: n’avaient pas réparé
  rationale: חזק signifie fondamentalement « fortifier, consolider », mais, avec בֶּדֶק הַבָּיִת, il désigne l’exécution de réparations structurelles. Le plus-que-parfait rend l’état de non-achèvement constaté à cette date.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent direct et courant du nom hébreu.
- source_word: בֶּדֶק הַבָּיִת
  choice: les parties endommagées du temple
  rationale: בֶּדֶק désigne les fissures, brèches ou dégradations nécessitant une réparation. « Parties endommagées » s’accorde naturellement avec « réparer ». הַבָּיִת signifie littéralement « la Maison », mais désigne ici sans ambiguïté le temple.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe directe évite le calque narratif « Il arriva que », tandis que « les parties endommagées » exprime naturellement le besoin de réparations structurelles.
