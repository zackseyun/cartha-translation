    rationale: וְהֵם est un pronom sujet qui souligne que les prêtres ont cette responsabilité; il ne correspond pas nécessairement au réflexif français « eux-mêmes ».
  - severity: medium
    issue: « partout où ils y trouveront des dégâts »
    rationale: יִמָּצֵא est au passif et ne désigne pas les prêtres comme ceux qui découvrent les dégâts. « partout où des dégâts seront constatés » conserve mieux l'indétermination du sujet et la valeur du passif.
