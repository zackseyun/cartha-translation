  text: יִקְח֤וּ לָ/הֶם֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ מֵ/אֵ֣ת מַכָּר֑/וֹ וְ/הֵ֗ם יְחַזְּקוּ֙ אֶת בֶּ֣דֶק הַ/בַּ֔יִת לְ/כֹ֛ל אֲשֶׁר יִמָּצֵ֥א שָׁ֖ם בָּֽדֶק־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: fr
  text: Que les prêtres prennent, chacun auprès de la personne qui lui est connue[a], et qu’ils effectuent les réparations nécessaires à la Maison[b], partout où des dégâts seront constatés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès de son donateur ». Le terme hébreu désigne plus littéralement une personne connue du prêtre ou avec laquelle il est en relation; dans ce contexte de collecte, il peut s’agir de la personne dont il reçoit une contribution.
    reason: lexical_alternative
  - marker: b
    text: La « Maison » désigne ici le temple.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם הַכֹּהֲנִים
  choice: Que les prêtres prennent l’argent
  rationale: L’imparfait a ici une valeur directive. « L’argent » est implicite dans le contexte immédiat de la collecte et rend l’objet naturel en français, tandis que לָהֶם indique que les prêtres le reçoivent ou le prennent en charge.
- source_word: אִישׁ מֵאֵת מַכָּרוֹ
  choice: chacun auprès de la personne qu’il connaît
  rationale: אִישׁ est distributif et renvoie à chaque prêtre. מַכָּר désigne d’abord une connaissance ou une personne avec laquelle on est en relation; cette formulation conserve cette nuance sans imposer le sens plus précis de « donateur ».
- source_word: וְהֵם יְחַזְּקוּ
  choice: et qu’ils réparent eux-mêmes
  rationale: Le pronom indépendant וְהֵם met les prêtres en relief comme responsables de l’action. יְחַזְּקוּ signifie littéralement « renforcer », mais désigne ici la remise en état d’un bâtiment.
- source_word: בֶּדֶק הַבַּיִת
  choice: les parties endommagées de la Maison
  rationale: בֶּדֶק évoque une brèche, une dégradation ou un défaut à réparer. « Parties endommagées » exprime naturellement en français l’objet concret des réparations. La majuscule à « Maison » signale dans ce contexte la maison de l’Éternel, c’est-à-dire le temple, sans remplacer le terme hébreu.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: partout où ils y trouveront des dégâts
  rationale: La tournure rend l’étendue indéfinie de la réparation requise. Le passif hébreu « sera trouvé » est exprimé activement en français pour une lecture plus naturelle, sans changer le sens contextuel.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La construction directive est conservée par « Que… ». Le texte privilégie une formulation naturelle tout en maintenant l’ambiguïté de מַכָּר dans la note.
