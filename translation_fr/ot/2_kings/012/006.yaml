  source_fidelity: La directive et la responsabilité des prêtres sont bien rendues. Toutefois, « l’argent » n’est pas exprimé dans ce verset et doit rester implicite; « eux-mêmes » ajoute une emphase réflexive absente du texte; et « ils y trouveront » transforme le passif indéfini (« sera trouvé ») en action des prêtres.
  naturalness: La formulation révisée demeure naturelle en français international moderne. « les réparations nécessaires à la Maison » rend clairement le complément de « réparer » sans l’ajout maladroit de « parties ».
  terminology: « Maison » conserve le terme hébreu tout en étant expliqué comme le temple. « personne qui lui est connue » préserve l'ambiguïté lexicale de מַכָּרוֹ; la possibilité contextuelle de « donateur » est convenablement signalée en note.
