  text: אָ֣ז יַעֲלֶ֗ה חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יִּלָּ֥חֶם עַל גַּ֖ת וַֽ/יִּלְכְּדָ֑/הּ וַ/יָּ֤שֶׂם חֲזָאֵל֙ פָּנָ֔י/ו לַ/עֲל֖וֹת עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: fr
  text: Alors Hazaël, roi d’Aram, monta, combattit Gath et s’en empara. Puis Hazaël décida de monter contre Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mit son visage pour monter contre Jérusalem » ; cet idiome signifie qu’il se détermina à avancer contre elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: יַעֲלֶה
  choice: monta
  rationale: Conserve le verbe de montée, qui peut aussi évoquer ici une avancée militaire.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazaël, roi d’Aram
  rationale: Translittère le nom propre et conserve le nom ethnogéographique hébreu Aram plutôt que le traditionnel « Syrie ».
- source_word: וַיִּלָּחֶם עַל
  choice: combattre
  rationale: Exprime l’action de faire la guerre à une ville sans préciser davantage la forme de l’offensive.
- source_word: גַּת
  choice: Gath
  rationale: Translittération française usuelle du nom de lieu.
- source_word: וַיִּלְכְּדָהּ
  choice: s’en empara
  rationale: Rend idiomatiquement la prise d’une ville et rattache clairement le pronom à Gath.
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: décida
  rationale: Rend en français naturel l’expression idiomatique indiquant qu’Hazaël dirige résolument son intention vers l’action annoncée.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: de monter contre Jérusalem
  rationale: Préserve à la fois l’idée de montée et l’orientation militaire hostile, sans anticiper une attaque effectivement menée.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Aram » suit directement le terme hébreu. L’idiome « mettre son visage » est explicité dans le texte pour éviter une formulation peu naturelle, tandis que sa forme littérale est conservée en note.
