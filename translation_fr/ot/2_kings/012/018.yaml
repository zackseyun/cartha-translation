review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est juste : Hazaël monte, combat Gath, la prend, puis se détermine à monter contre Jérusalem. Toutefois, la note qualifiée de littérale ne rend pas correctement l’idiome hébreu וַיָּשֶׂם ... פָּנָיו (« mit/plaça son visage », c.-à-d. fixa résolument son intention), en le transformant en « tourna son visage ».'
  naturalness: Le français est moderne et narratif. La coordination explicite des actions (« monta, combattit Gath et s’en empara ») reflète plus nettement la succession des verbes hébreux que « monta combattre Gath ».
  terminology: « Hazaël », « Aram », « Gath » et « Jérusalem » sont appropriés. « Décida de monter contre » rend naturellement l’idiome de résolution sans affirmer que l’attaque a été menée.
  issues:
  - severity: medium
    issue: La note présente « tourna son visage » comme une traduction littérale.
    rationale: Le texte hébreu dit littéralement qu’Hazaël « mit/plaça son visage » pour monter contre Jérusalem. « Tourna son visage » correspond à une autre formulation et ne doit pas être attribué au texte comme littéral.
  - severity: low
    issue: « Monta combattre Gath » fusionne deux actions verbales successives.
    rationale: La formulation reste compréhensible, mais « monta, combattit Gath et s’en empara » conserve plus explicitement la séquence narrative du texte source.
  revised_text: Alors Hazaël, roi d’Aram, monta, combattit Gath et s’en empara. Puis Hazaël décida de monter contre Jérusalem.[a]
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « mit son visage pour monter contre Jérusalem » ; cet idiome signifie qu’il se détermina à avancer contre elle.'
    reason: lexical_alternative
  revision_rationale: La révision corrige la note littérale, préserve la force résolue de l’idiome sans imposer une lecture plus précise, et rend plus visible la succession des actions du récit hébreu.
