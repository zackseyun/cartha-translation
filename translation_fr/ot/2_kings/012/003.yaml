source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: fr
  text: Joas fit ce qui est droit aux yeux de Yahvé tous les jours où le prêtre Jehojada l’instruisit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Joas fit ce qui est droit aux yeux de Yahvé tous ses jours que le prêtre Jehojada l’instruisit. » La construction peut aussi être comprise comme rattachant l’instruction de Jehojada à l’ensemble des jours de Joas, sans préciser davantage la relation temporelle.'
    reason: ambiguïté syntaxique
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: fit ce qui est droit
  rationale: Cette tournure française naturelle conserve la formule d’évaluation morale du texte hébreu sans la paraphraser.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahvé
  rationale: La formulation garde la métaphore hébraïque transparente et rend le tétragramme par le nom propre « Yahvé ».
- source_word: כָּל יָמָיו אֲשֶׁר
  choice: tous les jours où
  rationale: Cette traduction suit étroitement la construction relative hébraïque et rattache naturellement la durée de la conduite droite à la période d’instruction, tout en signalant en note l’autre compréhension possible.
- source_word: הוֹרָהוּ
  choice: l’instruisit
  rationale: Le hiphil de ירה exprime ici l’action d’enseigner, d’instruire ou de guider; « instruisit » convient au rôle du prêtre sans préciser excessivement la forme de cet enseignement.
- source_word: יְהוֹאָשׁ
  choice: Joas
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom royal.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: le prêtre Jehojada
  rationale: « Prêtre » est le terme français courant pour כֹּהֵן; l’antéposition du titre produit ici une formulation française fluide.
theological_decisions:
- issue: Portée temporelle de la conduite droite de Joas
  choice: La proposition relative qualifie les jours durant lesquels Jehojada instruisait Joas.
  alternative: « Joas fit ce qui est droit aux yeux de Yahvé toute sa vie, parce que le prêtre Jehojada l’instruisit. »
  rationale: L’hébreu relie directement « tous ses jours » à la proposition introduite par אֲשֶׁר. La traduction principale conserve ce lien temporel et la tension narrative, tandis que la note reconnaît la lecture causale reflétée dans la couche anglaise consultée.
translation_notes:
  register: Français international moderne, clair et digne. « Fit ce qui est droit aux yeux de » conserve l’idiome biblique tout en restant intelligible; « prêtre » est préféré à l’ancien « sacrificateur ».
