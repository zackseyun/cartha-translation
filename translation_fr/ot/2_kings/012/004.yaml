id: 2KI.12.4
reference: 2 Kings 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: fr
  text: Toutefois, les hauts lieux[a] ne furent pas supprimés ; le peuple continuait à y offrir des sacrifices et à y brûler de l’encens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctuaires sur les hauteurs » ; l’hébreu désigne des lieux de culte locaux, souvent aménagés sur des hauteurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Toutefois
  rationale: La particule introduit une restriction à l’évaluation positive qui précède. « Toutefois » exprime naturellement cette valeur adversative en français.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: Le terme désigne des lieux de culte locaux, souvent situés sur une hauteur. « Hauts lieux » conserve la désignation historico-religieuse habituelle sans l’interpréter davantage dans le texte.
- source_word: לֹא סָרוּ
  choice: ne furent pas supprimés
  rationale: 'Avec « les hauts lieux » pour sujet, cette formulation rend le sens contextuel de l’idiome : ces lieux de culte ne furent pas éliminés.'
- source_word: עוֹד
  choice: continuait à
  rationale: L’adverbe indique que la pratique se poursuivait. En français, « continuait à » s’accorde naturellement avec le sujet collectif singulier « le peuple ».
- source_word: הָעָם
  choice: le peuple
  rationale: Traduction directe et naturelle du nom collectif.
- source_word: מְזַבְּחִים
  choice: offrir des sacrifices
  rationale: Le participe décrit une pratique habituelle et continue. Cette expression est claire et idiomatique en français.
- source_word: וּמְקַטְּרִים
  choice: et à y brûler de l’encens
  rationale: Dans ce contexte cultuel, le verbe désigne très probablement l’action de faire fumer de l’encens ; la formulation retenue est naturelle et respecte l’action continue.
- source_word: בַּבָּמוֹת
  choice: y
  rationale: Le pronom reprend sans ambiguïté « les hauts lieux » et évite en français une répétition lourde, tout en maintenant clairement le lieu des deux pratiques.
theological_decisions:
- issue: Évaluation du culte pratiqué sur les hauts lieux
  choice: Conserver le terme descriptif « hauts lieux » sans ajouter de condamnation explicite.
  alternative: Employer « sanctuaires » ou préciser qu’il s’agissait de lieux de culte non autorisés.
  rationale: Le verset signale que ces lieux subsistaient et restaient utilisés, mais n’explicite pas ici toute l’évaluation théologique sous-jacente. La traduction préserve cette tension sans ajouter de commentaire doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. La structure adversative et l’aspect continu des pratiques cultuelles sont conservés ; la reprise pronominale « y » allège la répétition en français sans perte de sens.
