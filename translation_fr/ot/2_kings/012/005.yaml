id: 2KI.12.5
reference: 2 Kings 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: fr
  text: 'Joas dit aux prêtres : « Tout l’argent des choses consacrées qui est apporté dans la maison de Yahweh — l’argent versé par tout homme recensé[a], l’argent provenant de l’évaluation des personnes[b], et tout l’argent qu’un homme a à cœur[c] d’apporter dans la maison de Yahweh — »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « l’argent de tout homme qui passe ». Il s’agit probablement de la contribution exigée des hommes recensés (voir Exode 30.13-16).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’argent correspondant à l’évaluation des personnes ». L’expression renvoie probablement aux sommes fixées lors de l’évaluation de personnes vouées (voir Lévitique 27.2-8).'
    reason: cross_reference
  - marker: c
    text: 'Littéralement : « qui monte sur le cœur d’un homme »; cette expression désigne ce que quelqu’un décide librement de donner.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: Tout l’argent des choses consacrées
  rationale: Cette formulation conserve la structure du groupe construit hébreu et le lien de l’argent avec ce qui est mis à part pour le sanctuaire, sans réduire d’emblée l’expression à une seule catégorie d’offrandes.
- source_word: יוּבָא בֵית יְהוָה
  choice: qui est apporté dans la maison de Yahweh
  rationale: Le passif « est apporté » correspond au hophal de בוא, et « dans la maison » rend la direction vers l’intérieur du temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: l’argent versé par tout homme recensé
  rationale: Dans ce contexte fiscal et cultuel, עוֹבֵר évoque vraisemblablement celui qui passe parmi les recensés. La formulation française exprime ce sens probable tout en signalant en note le tour littéral.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: l’argent provenant de l’évaluation des personnes
  rationale: Cette formulation rend l’expression hébraïque condensée sans préciser dans le texte principal qu’il s’agit nécessairement de vœux; la note indique le parallèle juridique probable.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: tout l’argent qu’un homme a à cœur
  rationale: « Avoir à cœur » est une expression française naturelle qui conserve l’image du cœur et communique une intention librement formée.
- source_word: לְהָבִיא בֵּית יְהוָה
  choice: d’apporter dans la maison de Yahweh
  rationale: L’infinitif exprime le but ou l’intention, et « dans » maintient le parallélisme avec la première occurrence.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre. « Yahweh » préserve cette fonction et évite de remplacer le nom par un titre.
- issue: Nature de l’évaluation des personnes
  choice: Ne pas expliciter les vœux dans le texte principal
  alternative: l’argent des personnes vouées selon leur estimation
  rationale: Le rapprochement avec Lévitique 27 est probable, mais la formulation hébraïque du verset reste condensée. Une note peut donner ce contexte sans transformer une probabilité en précision explicite du texte.
translation_notes:
  register: Français international moderne, digne et lisible. « Maison de Yahweh » conserve l’expression cultuelle biblique. Les tirets et la phrase laissée en suspens respectent la syntaxe du verset, dont la déclaration se poursuit au verset suivant.
