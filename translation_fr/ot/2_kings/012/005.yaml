  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Avoir à cœur d’apporter » est idiomatique et restitue naturellement l’intention exprimée par l’image hébraïque du cœur. Les tirets encadrent correctement l’énumération en apposition.
