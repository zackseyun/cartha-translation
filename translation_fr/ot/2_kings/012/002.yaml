  text: בִּ/שְׁנַת שֶׁ֤בַע לְ/יֵהוּא֙ מָלַ֣ךְ יְהוֹאָ֔שׁ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּ/ירֽוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: fr
  text: La septième année du règne de Jéhu, Joas devint roi. Il régna quarante ans à Jérusalem. Sa mère s’appelait Tsibya et elle était de Bersabée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: La septième année du règne de Jéhu
  rationale: La formule hébraïque date l’avènement d’après les années de règne de Jéhu. L’ajout explicatif « du règne de » est naturel en français et évite que « la septième année de Jéhu » soit compris comme son âge.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: Joas devint roi
  rationale: 'Dans cette formule d’accession, מָלַךְ a une valeur ingress ive : Joas accéda à la royauté. « Devint roi » l’exprime clairement.'
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: Il régna quarante ans
  rationale: Ici, le verbe indique la durée du règne ; « régna » est précis et idiomatique.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition française « à » convient naturellement devant le nom de cette ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette tournure française actuelle transmet naturellement la formule hébraïque « le nom de sa mère était ».
- source_word: צִבְיָה
  choice: Tsibia
  rationale: Translittération française usuelle du nom hébreu, qui distingue la consonne initiale צ par « Ts ».
- source_word: מִבְּאֵר שָׁבַע
  choice: elle était de Bersabée
  rationale: מִן indique ici l’origine géographique. La reprise explicite du sujet rend le français fluide et empêche de rattacher le lieu au nom lui-même.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les formes françaises traditionnelles Joas, Jéhu, Tsibia et Bersabée sont employées ; la syntaxe distingue nettement l’accession de Joas, la durée de son règne et l’origine de sa mère.
