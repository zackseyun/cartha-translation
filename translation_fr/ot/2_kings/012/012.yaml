source:
  edition: WLC
  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: fr
  text: Ils remettaient l’argent pesé[a] aux responsables des travaux, préposés à la maison de Yahvé[b], et ceux-ci le versaient aux charpentiers et aux constructeurs qui travaillaient à la maison de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’argent mesuré » ou « l’argent compté ». Le terme hébreu indique que la somme avait été déterminée, probablement par pesée.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte le nom divin YHWH, ici rendu par « Yahvé »; il est traditionnellement traduit par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: l’argent pesé
  rationale: Dans ce contexte de gestion des fonds du temple, מְתֻכָּן désigne vraisemblablement l’argent dont la quantité a été déterminée, probablement par pesée. « L’argent pesé » est concret et naturel, tout en laissant en note les autres nuances possibles.
- source_word: עַל יַד עֹשֵׂי הַמְּלָאכָה
  choice: aux responsables des travaux
  rationale: L’expression עַל יַד signifie littéralement « sur/dans la main de » et marque ici la remise de fonds à la charge de quelqu’un. עֹשֵׂי הַמְּלָאכָה désigne dans ce contexte ceux qui ont la responsabilité opérationnelle des travaux, plutôt que l’ensemble des ouvriers ensuite rémunérés.
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  choice: préposés à la maison de Yahvé
  rationale: Le participe passif הַפְּקֻדִים indique que ces hommes avaient reçu une charge ou une mission concernant le temple. « Préposés à » rend cette désignation sans préciser plus que l’hébreu la structure exacte de leur autorité.
- source_word: וַיּוֹצִיאֻהוּ
  choice: et ceux-ci le versaient
  rationale: Le verbe signifie littéralement « faire sortir ». Appliqué à de l’argent confié à des responsables, il exprime ici son décaissement ou son versement aux artisans. « Ceux-ci » clarifie naturellement en français que le sujet est le groupe immédiatement mentionné.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: aux charpentiers
  rationale: L’expression désigne littéralement les artisans du bois. Dans le cadre de travaux de bâtiment, « charpentiers » est précis et idiomatique.
- source_word: וְלַבֹּנִים
  choice: et aux constructeurs
  rationale: Le participe בֹּנִים désigne ceux qui bâtissent. « Constructeurs » conserve cette portée générale sans les identifier plus étroitement à des maçons.
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: qui travaillaient à la maison de Yahvé
  rationale: La tournure hébraïque indique qu’ils effectuaient des travaux sur le temple. « Travaillaient à » est naturel et n’ajoute pas explicitement l’idée de réparation, même si celle-ci ressort du contexte plus large.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte le nom divin YHWH. « Yahvé » est la forme française usuelle de sa translittération et permet de distinguer le nom propre du titre « Seigneur ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie ici explicitement le tétragramme YHWH. Le rendre par « Yahvé » préserve le nom propre dans le corps du texte; une note signale la convention française traditionnelle qui le remplace par un titre.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait présente les versements comme la procédure habituelle décrite dans le contexte. La formulation évite l’idiome peu naturel « dans la main de » et distingue les responsables chargés des fonds des artisans qui les recevaient.
