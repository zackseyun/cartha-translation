source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes de Joas et tout ce qu’il a fait, ne sont-ils pas écrits dans le livre des Annales des rois de Juda[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le livre des Chroniques des rois de Juda ». L’expression hébraïque peut désigner un registre officiel ou des annales royales.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: יֶתֶר désigne ce qui reste, et דִּבְרֵי, littéralement « paroles » ou « affaires », évoque ici les actes consignés dans le cadre de la formule récapitulative d’un règne.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Forme française traditionnelle et courante du nom de ce roi de Juda.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Traduction directe qui conserve la portée globale de כָל et la construction relative.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: La question rhétorique attend une réponse affirmative. Le pluriel français reprend les deux éléments coordonnés du sujet et correspond au pronom pluriel הֵם.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », le français dit naturellement qu’un fait est écrit dans un livre ou un registre.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les Annales
  rationale: Dans cette formule de renvoi aux sources royales, l’expression désigne une chronique ou des annales historiques, plutôt que le livre biblique canonique des Chroniques.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: des rois de Juda
  rationale: Le לְ marque ici le rapport entre les annales et les rois de Juda; le complément introduit par « de » est idiomatique en français.
