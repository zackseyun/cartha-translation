base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: fr
  text: Ses serviteurs se levèrent et formèrent un complot, puis ils frappèrent Joas à Beth-Millo, sur la descente qui mène à Silla[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’analyse de la syntaxe hébraïque : « à Beth-Millo, qui descend vers Silla ». L’expression décrit littéralement une descente ou un accès descendant en direction de Silla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans le contexte royal, le terme désigne les hommes au service du roi. « Serviteurs » reste proche de l’hébreu sans préciser qu’il s’agissait nécessairement de hauts fonctionnaires.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: formèrent un complot
  rationale: La construction hébraïque associe un verbe et un nom de même racine. Le français naturel exprime cet idiome par « former un complot », sans reproduire artificiellement la répétition.
- source_word: וַיַּכּוּ
  choice: frappèrent
  rationale: Le verbe נכה signifie ici frapper avec violence et le contexte indique que l’attaque fut mortelle. « Frappèrent » conserve toutefois la portée lexicale du verbe sans introduire dans ce verset le verbe explicite « tuer ».
- source_word: בֵּית מִלֹּא
  choice: Beth-Millo
  rationale: La séquence est comprise comme un nom de lieu et donc translittérée, plutôt que rendue par « maison de Millo ».
- source_word: הַיּוֹרֵד סִלָּא
  choice: sur la descente vers Silla
  rationale: Le participe יֹרֵד décrit un trajet ou un accès descendant en direction de Silla. Cette formulation conserve le détail topographique tout en restant concise.
- source_word: סִלָּא
  choice: Silla
  rationale: Nom propre de lieu, translittéré selon l’usage.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La première coordination hébraïque est répartie en deux phrases pour une lecture naturelle, sans modifier la succession des actions. « Se soulevèrent » rend ici l’entrée en action hostile des serviteurs, tandis que « formèrent un complot » exprime idiomatiquement la construction hébraïque à mot apparenté.
