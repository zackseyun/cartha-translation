id: 2KI.12.19
reference: 2 Kings 12:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: fr
  text: Joas, roi de Juda, prit tous les objets sacrés que Josaphat, Joram et Ochozias, ses ancêtres[b], rois de Juda, avaient consacrés, ainsi que ses propres objets sacrés et tout l’or qui se trouvait dans les trésors de la maison de Yahweh et de la maison du roi. Il envoya le tout à Hazaël, roi d’Aram. Alors Hazaël se retira de Jérusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « il monta de dessus Jérusalem » ; cette tournure indique ici que Hazaël cessa son avancée contre la ville et s’en éloigna.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses pères », c’est-à-dire ses ascendants dans la lignée royale.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie simplement « prendre » dans ce récit ; « saisit » suggérerait à tort une action violente.
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  choice: les objets sacrés / ses propres objets sacrés
  rationale: Le terme désigne des biens mis à part pour l’usage sacré. « Objets sacrés » reste concret et conserve la répétition lexicale de l’hébreu.
- source_word: הִקְדִּישׁוּ
  choice: avaient consacrés
  rationale: Le hiphil de קדש exprime ici l’affectation d’objets à un usage sacré.
- source_word: אֲבֹתָיו
  choice: ses ancêtres
  rationale: 'Dans cette généalogie royale, « pères » désigne les ascendants de Joas : Ochozias, Joram et Josaphat. « Ancêtres » est naturel et exact en français moderne.'
- source_word: הַנִּמְצָא
  choice: qui se trouvait
  rationale: Cette formulation rend naturellement le participe de מצא sans ajouter l’idée interprétative de disponibilité.
- source_word: בְּאֹצְרוֹת
  choice: dans les trésors
  rationale: אוצרות désigne ici les réserves où étaient conservés l’or et les objets précieux du temple et du palais.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’expression hébraïque « maison » et rend explicitement le nom divin יהוה par « Yahweh ».
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: La traduction littérale maintient le parallélisme avec « la maison de Yahweh », tout en désignant le palais royal dans ce contexte.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: Il envoya le tout à Hazaël
  rationale: « Le tout » reprend naturellement en français l’ensemble des objets et de l’or énumérés.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: Alors Hazaël se retira de Jérusalem
  rationale: L’expression indique que Hazaël abandonna son avance contre Jérusalem. Le nom du sujet est répété pour éviter l’ambiguïté du pronom français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Nature des biens remis à Hazaël
  choice: objets sacrés
  alternative: offrandes consacrées
  rationale: Le texte souligne leur statut cultuel sans préciser qu’il s’agit exclusivement d’offrandes ; la traduction évite donc de restreindre leur nature.
translation_notes:
  register: Français international moderne, courant et digne. Les noms suivent les formes françaises bibliques usuelles (Joas, Josaphat, Joram, Ochozias, Hazaël). La répétition d’« objets sacrés » préserve le lien lexical de l’hébreu, tandis que la dernière proposition explicite Hazaël comme sujet afin d’éviter une ambiguïté artificielle en français.
