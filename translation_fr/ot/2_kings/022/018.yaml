source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: fr
  text: 'Mais au roi de Juda, qui vous a envoyés consulter Yahweh, vous direz ceci : « Ainsi parle Yahweh, le Dieu d’Israël : Quant aux paroles que tu as entendues[a]…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition hébraïque reste ici en suspens; elle est reprise et complétée au verset suivant.
    reason: Précision syntaxique nécessaire pour expliquer la fin volontairement inachevée du verset.
lexical_decisions:
- source_word: וְאֶל
  choice: Mais au
  rationale: La conjonction et la préposition marquent ici le passage contrastif aux paroles destinées au roi, tout en conservant l’orientation vers lui.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rendu direct et usuel de la construction hébraïque.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: qui vous a envoyés
  rationale: Le participe identifie le roi par son action; une relative au passé composé est naturelle dans ce contexte narratif.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: consulter Yahweh
  rationale: Dans ce contexte prophétique, דרשׁ désigne la recherche d’une réponse ou d’une direction divine; « consulter » l’exprime clairement en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: vous direz ceci
  rationale: Cette formulation restitue naturellement l’instruction qui introduit le message, sans reproduire lourdement l’ordre des mots hébreu.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule française digne et consacrée pour la formule hébraïque du messager prophétique, avec une valeur présente.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe qui conserve l’identification de Yahweh au Dieu d’Israël.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Quant aux paroles que tu as entendues…
  rationale: « Quant à » marque le thème annoncé et préserve la construction suspendue, dont la suite syntaxique se trouve au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans introduire une substitution confessionnelle par un titre.
- issue: Construction suspendue à la fin du verset
  choice: Maintenir la suspension après « Quant aux paroles que tu as entendues »
  alternative: Compléter ou reformuler la proposition dans ce verset
  rationale: L’hébreu annonce un thème dont la proposition est reprise et achevée au verset suivant; la traduction ne doit pas résoudre artificiellement cette tension syntaxique.
translation_notes:
  register: Français international moderne, naturel et digne. « Consulter » convient au cadre d’une demande de réponse prophétique; « Ainsi parle » conserve la solennité de la formule de messager. Les points de suspension signalent que la déclaration se poursuit au verset suivant, et le guillemet ouvrant n’est donc pas fermé dans ce verset isolé.
