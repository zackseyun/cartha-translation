  text: וַ/יַּגֵּ֞ד שָׁפָ֤ן הַ/סֹּפֵר֙ לַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר סֵ֚פֶר נָ֣תַן לִ֔/י חִלְקִיָּ֖ה הַ/כֹּהֵ֑ן וַ/יִּקְרָאֵ֥/הוּ שָׁפָ֖ן לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: fr
  text: 'Alors Shaphân, le scribe, informa le roi en ces termes : « Le prêtre Hilqiya m’a donné un livre[a]. » Puis Shaphân le lut devant le roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un rouleau ». Le mot hébreu peut désigner de manière générale un écrit et ne précise pas à lui seul sa forme matérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: informa
  rationale: Le hifil de נגד signifie ici « faire savoir, informer ». « Informa » convient au cadre de la cour sans donner au propos une solennité excessive.
- source_word: הַסֹּפֵר
  choice: le scribe
  rationale: סֹפֵר peut désigner un secrétaire ou fonctionnaire royal. « Le scribe » conserve le titre historique et reste compréhensible en français moderne.
- source_word: סֵפֶר
  choice: un livre
  rationale: סֵפֶר désigne généralement un écrit ou document et ne précise pas à lui seul sa forme matérielle. L’indéfini hébreu est conservé ; une note signale la traduction possible « rouleau ».
- source_word: נָתַן לִי
  choice: m’a donné
  rationale: Le parfait hébreu présente une action accomplie dont le résultat demeure pertinent au moment où Shaphân parle. Le passé composé est naturel en français.
- source_word: וַיִּקְרָאֵהוּ
  choice: le lut
  rationale: Avec un écrit comme complément, קרא signifie lire, normalement à voix haute dans ce contexte. Le français « le lut devant le roi » exprime naturellement cette scène.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: Cette expression idiomatique signifie « en présence du roi ». « Devant le roi » est concis, naturel et fidèle.
- source_word: חִלְקִיָּה
  choice: Hilqiya
  rationale: Le nom propre est translittéré sous une forme française qui rend les consonnes hébraïques de façon reconnaissable.
- source_word: שָׁפָן
  choice: Shaphân
  rationale: Le nom propre est translittéré selon un usage français établi, avec l’accent circonflexe indiquant la voyelle longue.
