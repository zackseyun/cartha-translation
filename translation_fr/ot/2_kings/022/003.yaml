source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: fr
  text: 'La dix-huitième année du règne du roi Josias, le roi envoya le secrétaire Shafân, fils d’Atsalia, fils de Meshoullam, à la maison de Yahweh[a], en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au temple de Yahweh ». Littéralement, « à la maison de Yahweh ».
    reason: Précise le sens contextuel de l’expression hébraïque tout en conservant sa forme littérale dans le texte.
lexical_decisions:
- source_word: וַיְהִי בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: La dix-huitième année du règne du roi Josias
  rationale: La formule française exprime naturellement la datation selon l’année de règne, sans reproduire lourdement la tournure narrative וַיְהִי.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: le roi envoya
  rationale: Conserve la répétition explicite de « roi » dans l’hébreu.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: Shafân, fils d’Atsalia et petit-fils de Meshoullam
  rationale: 'Rend clairement en français la chaîne généalogique : Shafân est fils d’Atsalia, lui-même fils de Meshoullam.'
- source_word: הַסֹּפֵר
  choice: le secrétaire
  rationale: Dans ce cadre royal, סֹפֵר désigne vraisemblablement un haut fonctionnaire chargé des écrits; « secrétaire » communique mieux cette fonction en français actuel que le seul « scribe ».
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Conserve l’image littérale de la « maison » tout en laissant une note signaler le sens contextuel de temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer le titre « le Seigneur ».
- source_word: לֵאמֹר
  choice: 'en lui disant :'
  rationale: Introduit naturellement en français les paroles qui suivent au verset suivant; le pronom explicite le destinataire déjà nommé sans modifier le sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom divin personnel; « Yahweh » le représente directement.
- issue: Sens institutionnel de בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: Le texte principal préserve la métaphore hébraïque, tandis que la note donne son référent contextuel sans effacer la formulation source.
translation_notes:
  register: Français international actuel, clair et digne. Le passé simple convient au récit historique écrit. « Secrétaire » reflète le rôle administratif de Shafân; la généalogie est explicitée par « petit-fils » pour éviter une ambiguïté naturelle en français.
