  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: fr
  text: « Allez consulter Yahweh[a] pour moi, pour le peuple et pour tout Juda, au sujet des paroles de ce livre qui a été trouvé. En effet, grande est la fureur de Yahweh qui s’est enflammée contre nous, parce que nos pères[b] n’ont pas écouté les paroles de ce livre afin d’agir conformément à tout ce qui est écrit à notre égard[c]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « recherchez Yahweh » ou « interrogez Yahweh ». Ici, le contexte indique une consultation destinée à recevoir une réponse divine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nos ancêtres ». Littéralement : « nos pères ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, selon la nuance retenue : « pour nous », « à notre sujet » ou « contre nous ». L’hébreu indique que ce qui est écrit s’applique à la communauté, sans préciser ici à lui seul de quelle manière.'
    reason: source_ambiguity
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: consulter Yahweh
  rationale: Dans ce contexte, דרשׁ désigne une démarche visant à obtenir de Dieu une réponse au sujet du livre découvert. « Consulter » exprime naturellement cette demande formelle, tout en laissant en note les sens plus généraux possibles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: pour moi, pour le peuple et pour tout Juda
  rationale: La préposition בְּעַד exprime ici la représentation ou l’intervention en faveur de quelqu’un. La répétition de « pour » garde la structure et l’insistance de l’hébreu dans un français naturel.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: au sujet des paroles de ce livre qui a été trouvé
  rationale: « Au sujet de » introduit l’objet de la consultation, tandis que « paroles » maintient l’attention portée au contenu verbal du livre. La relative rend naturellement le participe passif הנמצא.
- source_word: חֲמַת יְהוָה
  choice: la fureur de Yahweh
  rationale: חֵמָה évoque une colère intense et brûlante. « Fureur » en conserve la force judiciaire sans l’atténuer.
- source_word: נִצְּתָה בָנוּ
  choice: s’est enflammée contre nous
  rationale: Le verbe יצת appartient au champ lexical de l’embrasement. Cette formulation conserve l’image du feu et rend le sens hostile de בָנוּ dans le contexte.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: nos pères n’ont pas écouté
  rationale: « Écouté » garde le sens premier de שׁמע, tandis que la proposition finale qui suit explicite la dimension d’obéissance. « Nos pères » reproduit la désignation masculine du texte.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: afin d’agir conformément à tout ce qui est écrit
  rationale: « Afin de » relie l’écoute attendue à sa finalité pratique; « conformément à » rend la préposition comparative כְּ et « tout » conserve la portée globale de כָּל.
- source_word: עָלֵינוּ
  choice: à notre égard
  rationale: Cette expression française préserve l’idée de ce qui est écrit relativement à la communauté, sans décider si le texte décrit celle-ci, lui impose des obligations ou prononce un jugement contre elle.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. La transcription « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Portée de אֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » maintient la forme masculine et le lien avec les générations antérieures d’Israël; la note indique l’équivalent collectif naturel sans effacer la forme du texte source.
- issue: Portée de עָלֵינוּ
  choice: à notre égard
  alternative: pour nous / contre nous / à notre sujet
  rationale: La préposition peut signaler l’application du texte à la communauté sans préciser à elle seule s’il s’agit d’instructions, de déclarations ou de jugements. Le rendu choisi conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement solennelle « grande est la fureur » conserve l’emphase initiale de l’hébreu, tandis que le reste de la phrase privilégie une formulation courante. L’image de la colère qui s’enflamme est maintenue.
