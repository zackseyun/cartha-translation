    text: 'Littéralement : « gardien des habits » ; il s’agit probablement d’une fonction officielle liée à la garde-robe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le second district ». L’hébreu désigne probablement un quartier particulier de Jérusalem.'
    reason: lexical_alternative
