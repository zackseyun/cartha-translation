  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: fr
  text: Alors le prêtre Hilqiya, Ahiqam, Akbor, Shaphan et Asaya allèrent trouver la prophétesse Houlda, femme de Shalloum, gardien des vêtements[a], fils de Tiqva, fils de Harhas. Elle habitait à Jérusalem, dans le deuxième quartier[b]. Ils lui parlèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « gardien des habits » ; il s’agit probablement d’une fonction officielle liée à la garde-robe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le second district ». L’hébreu désigne probablement un quartier particulier de Jérusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Alors ... allèrent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession narrative en français.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: L’hébreu porte simplement « le prêtre » et ne précise pas ici « le grand prêtre ».
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: la prophétesse Houlda
  rationale: Le substantif hébreu est explicitement féminin ; « prophétesse » le rend directement et naturellement.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: fils de Tiqva et petit-fils de Harhas
  rationale: Cette formulation française explicite sans ambiguïté les deux générations de la chaîne généalogique.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: gardien des vêtements
  rationale: Traduction proche de l’expression hébraïque, qui semble désigner une charge officielle sans permettre d’en préciser davantage la nature.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: Elle habitait
  rationale: Dans cette indication de lieu, יָשַׁב désigne naturellement le fait de résider.
- source_word: בַּמִּשְׁנֶה
  choice: dans le deuxième quartier
  rationale: Le terme paraît désigner un secteur particulier de Jérusalem ; la traduction conserve son sens ordinal sans imposer un nom traditionnel incertain.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: Ils lui parlèrent
  rationale: Rendu direct et idiomatique de la prise de parole adressée à Houlda.
theological_decisions:
- issue: Titre sacerdotal de Hilqiya
  choice: le prêtre
  alternative: le grand prêtre
  rationale: Le verset ne contient pas le terme « grand » ; la traduction n’importe donc pas un titre plus développé depuis le contexte.
- issue: Titre prophétique féminin de Houlda
  choice: la prophétesse
  alternative: la prophète
  rationale: Le terme source est morphologiquement féminin, et le français courant dispose du terme précis « prophétesse ».
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes francisées lisibles. La syntaxe reste claire pour un lectorat général tout en conservant les titres et les indications topographiques du texte hébreu.
