  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: fr
  text: parce qu’ils m’ont abandonné et ont fait des offrandes par le feu à d’autres dieux[a], afin de provoquer ma colère par toutes les œuvres de leurs mains. Ma colère s’enflammera donc contre ce lieu, et elle ne s’éteindra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément : « ont brûlé de l’encens pour d’autres dieux ».'
    reason: 'Alternative lexicale : קטר peut désigner plus particulièrement l’action de brûler de l’encens.'
lexical_decisions:
- source_word: תַּחַת אֲש׶ר
  choice: parce que
  rationale: L’expression introduit la cause du jugement; « parce que » en restitue naturellement la valeur causale.
- source_word: עֲזָבוּנִי
  choice: ils m’ont abandonné
  rationale: Le verbe exprime l’abandon relationnel et cultuel; ce choix est actuel tout en conservant la gravité de l’hébreu.
- source_word: וַיְקַטְּרוּ
  choice: ont fait brûler des offrandes
  rationale: Au piel, קטר désigne une offrande consumée, souvent mais pas exclusivement de l’encens. Cette formulation conserve à la fois le geste de brûler et une portée cultuelle non indûment restreinte.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: pour d’autres dieux
  rationale: La formule désigne directement des divinités autres que le Dieu d’Israël; « pour » convient idiomatiquement au destinataire d’une offrande.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: afin de provoquer ma colère
  rationale: La formulation garde la valeur de but ou de résultat de לְמַעַן et l’idée explicite de provocation contenue dans הכעיס.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: par tout ce que leurs mains ont fait
  rationale: Cette tournure française compréhensible conserve l’image des mains ainsi que sa portée polémique envers les œuvres idolâtres.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: Ma fureur s’est donc enflammée
  rationale: « Fureur » rend l’intensité de חֵמָה, tandis que « s’est enflammée » préserve la métaphore du feu reprise par le verbe « s’éteindre ».
- source_word: בַּמָּקוֹם הַזֶּה
  choice: contre ce lieu
  rationale: Bien que la préposition soit littéralement locative, « contre » exprime naturellement en français la cible de la fureur et du jugement.
- source_word: וְלֹא תִכְבֶּה
  choice: et elle ne s’éteindra pas
  rationale: Le féminin renvoie à la fureur représentée comme un feu; « ne s’éteindra pas » conserve cette image avec naturel.
theological_decisions:
- issue: Langage anthropopathique concernant la colère divine
  choice: Conserver l’idée que les actes humains provoquent la colère de Dieu et que sa fureur s’enflamme
  alternative: Remplacer ce langage par une formulation impersonnelle du jugement
  rationale: L’hébreu emploie explicitement un langage relationnel et affectif; la traduction ne doit pas en atténuer la tension théologique.
- issue: Image ignée du jugement divin
  choice: Conserver la métaphore cohérente « s’est enflammée » / « ne s’éteindra pas »
  alternative: Paraphraser en disant seulement que le châtiment est certain
  rationale: L’image du feu structure la fin du verset et exprime la force ainsi que l’irrévocabilité du jugement sans exiger d’interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche du mouvement causal de l’hébreu, tout en évitant des archaïsmes comme « délaissé » ou « ne sera pas éteinte ». Le marqueur [a] figure dans le texte principal.
