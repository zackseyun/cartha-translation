revisions:
- from: parce qu’ils m’ont abandonné et ont fait brûler des offrandes pour d’autres dieux[a], afin de provoquer ma colère par tout ce que leurs mains ont fait. Ma fureur s’est donc enflammée contre ce lieu, et elle ne s’éteindra pas.
  to: parce qu’ils m’ont abandonné et ont fait des offrandes par le feu à d’autres dieux[a], afin de provoquer ma colère par toutes les œuvres de leurs mains. Ma colère s’enflammera donc contre ce lieu, et elle ne s’éteindra pas.
  rationale: La révision corrige l’ambiguïté causative de la formulation française initiale, conserve la portée cultuelle non restreinte de קטר avec une note sur l’encens, et rend l’annonce de jugement au futur. Elle préserve l’enchaînement causal, le langage explicite de la colère divine et la métaphore ignée du texte hébreu, sans ajouter d’interprétation doctrinale.
