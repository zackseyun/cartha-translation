review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire. « Ont fait brûler des offrandes » introduit une nuance causative absente du piel de קטר. « Faire des offrandes par le feu » rend l’acte cultuel de combustion sans le limiter indûment à l’encens; la note conserve l’alternative plus précise. Le qatal וְנִצְּתָה, dans cette annonce de jugement, est rendu au futur conséquent (« s’enflammera »), en parallèle avec « ne s’éteindra pas ».
  naturalness: Le texte révisé emploie un français international moderne et soutenu. « À d’autres dieux » indique plus directement le destinataire des offrandes. « Toutes les œuvres de leurs mains » maintient l’expression imagée et polémique de l’hébreu dans une formulation naturelle.
  terminology: '« Colère » est préférable à « fureur » ici: il rend חֵמָה avec force sans accentuer inutilement le registre. La paire « s’enflammera / ne s’éteindra pas » préserve l’image du feu. Le marqueur [a] reste immédiatement après l’expression concernée.'
  issues:
  - severity: medium
    issue: Nuance causative dans « ont fait brûler des offrandes »
    rationale: En français, « faire brûler » peut signifier faire accomplir l’action par autrui. Le verbe hébreu décrit directement l’acte rituel accompli par le sujet.
  - severity: medium
    issue: Temps verbal de « s’est donc enflammée »
    rationale: Dans le contexte d’une proclamation de jugement, וְנִצְּתָה annonce la conséquence à venir; le futur français conserve cette orientation et la coordination avec « ne s’éteindra pas ».
  - severity: low
    issue: « Fureur » et « pour d’autres dieux »
    rationale: « Colère » est le rendu français plus direct et courant de חֵמָה dans ce registre; « à d’autres dieux » exprime plus précisément le destinataire cultuel.
  revised_text: parce qu’ils m’ont abandonné et ont fait des offrandes par le feu à d’autres dieux[a], afin de provoquer ma colère par toutes les œuvres de leurs mains. Ma colère s’enflammera donc contre ce lieu, et elle ne s’éteindra pas.
