  verdict: revise
  source_fidelity: 'La phrase rend fidèlement l’action de Shafân, le rapport au roi, le versement/vidage de l’argent et sa remise aux ouvriers. Toutefois, « ouvriers chargés des travaux dans la maison de Yahweh » déplace la portée de הַמֻּפְקָדִים : ils sont préposés/nommés à la Maison de Yahweh, et non simplement chargés des travaux qui s’y font.'
  naturalness: Le français est globalement moderne et naturel. « Préposés à la Maison de Yahweh » est à la fois plus précis et idiomatique dans ce contexte administratif. La majuscule uniforme à « Maison » évite une incohérence de présentation.
  terminology: « Secrétaire », « argent », « Maison » (avec note), et « Yahweh » conviennent. « Versé » conserve l’image du verbe hébreu, dont la note explicite utilement le sens contextuel.
