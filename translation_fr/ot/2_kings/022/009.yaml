source:
  edition: WLC
  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: fr
  text: 'Shafân, le secrétaire, se rendit auprès du roi et lui fit son rapport. Il dit : « Tes serviteurs ont versé[a] l’argent qui se trouvait dans la Maison[b] et l’ont remis entre les mains[c] des ouvriers préposés à la Maison de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ont vidé ». Le verbe hébreu signifie littéralement « verser » et désigne ici probablement l’argent retiré de son contenant en vue de son transfert.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le Temple.
    reason: cultural_note
  - marker: c
    text: 'Ou : « l’ont confié aux ». Littéralement : « l’ont donné sur la main de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: le secrétaire
  rationale: Dans ce contexte de cour royale, סֹפֵר désigne vraisemblablement un haut fonctionnaire chargé des écrits et des affaires administratives. « Secrétaire » exprime mieux cette fonction en français moderne que « scribe ».
- source_word: וַיָּשֶׁב אֶת־הַמֶּלֶךְ דָּבָר
  choice: lui fit son rapport
  rationale: L’expression signifie rapporter une réponse ou rendre compte au roi. Cette formulation française est naturelle tout en conservant le cadre administratif.
- source_word: הִתִּיכוּ
  choice: ont versé
  rationale: Le verbe évoque littéralement l’action de verser ou de vider. Ici, il s’agit vraisemblablement de sortir l’argent recueilli de son contenant afin de le transférer, et non de faire fondre du métal.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף signifie littéralement « argent » au sens du métal et, par extension, de la monnaie. Le français « argent » conserve naturellement les deux valeurs.
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: qui se trouvait dans la Maison
  rationale: Le participe peut se rendre naturellement par « qui se trouvait ». La majuscule à « Maison » signale que le mot désigne ici le temple sans remplacer dans le texte l’image hébraïque de la maison.
- source_word: וַיִּתְּנֻהוּ עַל־יַד
  choice: l’ont remis entre les mains
  rationale: Cette formulation conserve l’image concrète de l’hébreu tout en exprimant clairement la remise de l’argent à des responsables.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: des ouvriers chargés des travaux
  rationale: La traduction exprime à la fois l’exécution du travail et la responsabilité confiée à ces hommes, dans une formulation française concise.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’expression hébraïque « maison de » et rend directement le nom divin יהוה par « Yahweh ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel יהוה. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Identification de הַבַּיִת
  choice: la Maison, avec une note indiquant le temple
  alternative: le Temple
  rationale: Le contexte identifie clairement la Maison comme le temple, mais conserver « Maison » maintient le vocabulaire et l’image du texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit administratif reste fluide; les images hébraïques importantes sont conservées dans le texte ou signalées en note.
