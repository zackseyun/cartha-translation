revisions:
- from: 'Le secrétaire Shafân se rendit auprès du roi et lui fit son rapport. Il dit : « Tes serviteurs ont versé[a] l’argent qui se trouvait dans la Maison[b] et l’ont remis entre les mains[c] des ouvriers chargés des travaux dans la maison de Yahweh. »'
  to: 'Shafân, le secrétaire, se rendit auprès du roi et lui fit son rapport. Il dit : « Tes serviteurs ont versé[a] l’argent qui se trouvait dans la Maison[b] et l’ont remis entre les mains[c] des ouvriers préposés à la Maison de Yahweh. »'
  rationale: La révision rend explicitement la relation des ouvriers à la Maison de Yahweh, conformément au participe passif « préposés/nommés », sans modifier le sens du transfert des fonds. Elle uniformise aussi la typographie de « Maison ».
