    issue: La fonction des ouvriers est rendue de manière imprécise.
    rationale: L’expression עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים בֵּית יְהוָה désigne les ouvriers préposés à la Maison de Yahweh. « Chargés des travaux dans la maison » fait porter « chargés » sur les travaux et ajoute « dans », plutôt que de rendre leur désignation comme responsables nommés auprès de la Maison.
  - severity: low
    issue: Capitalisation non uniforme de « Maison ».
    rationale: Le premier emploi est « la Maison », mais le second est « la maison de Yahweh », alors que les deux emplois renvoient au même sanctuaire dans le contexte.
