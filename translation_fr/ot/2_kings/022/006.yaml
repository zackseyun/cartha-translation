  yaml_path: translation/ot/2_kings/022/006.yaml
  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: fr
  text: aux artisans, aux bâtisseurs et aux maçons[c], ainsi que pour acheter du bois de construction et des pierres de carrière[b], afin de consolider la maison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire le temple, la maison du SEIGNEUR dans ce contexte.
    reason: cross_reference
  - marker: b
    text: Ou « des pierres taillées » ou « des pierres de taille ».
    reason: lexical_alternative
  - marker: c
    text: Le terme traduit par « maçons » désigne plus littéralement ceux qui construisent ou réparent des murs ou des clôtures.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: aux artisans
  rationale: Le terme désigne largement des ouvriers qualifiés; « artisans » conserve cette portée sans le limiter aux seuls charpentiers.
- source_word: וְלַבֹּנִים
  choice: aux bâtisseurs
  rationale: Le participe substantivé issu de בנה désigne directement ceux qui bâtissent.
- source_word: וְלַגֹּדְרִים
  choice: aux maçons
  rationale: Le mot désigne littéralement ceux qui construisent ou réparent des murs ou des clôtures; dans ce contexte de travaux, « maçons » est naturel, avec une note qui préserve l’image précise.
- source_word: וְלִקְנוֹת
  choice: ainsi que pour acheter
  rationale: L’infinitif avec ל poursuit l’énumération de l’usage auquel l’argent est destiné.
- source_word: עֵצִים
  choice: du bois de construction
  rationale: Dans cette liste de matériaux, cette expression rend clairement le bois destiné au bâtiment.
- source_word: וְאַבְנֵי מַחְצֵב
  choice: des pierres de carrière
  rationale: L’expression désigne des pierres extraites d’une carrière; cette formulation reste transparente en français actuel sans imposer qu’elles aient déjà été taillées.
- source_word: לְחַזֵּק
  choice: afin de consolider
  rationale: Le verbe signifie rendre fort; « consolider » exprime naturellement cette action dans un contexte de réfection d’un bâtiment.
- source_word: אֶת־הַבָּיִת
  choice: la maison
  rationale: Le texte hébreu dit littéralement « la maison »; le contexte l’identifie comme la maison du SEIGNEUR, c’est-à-dire le temple, précision donnée en note.
