revisions:
- from: Qu’on remette l’argent aux responsables des travaux chargés de la maison de Yahweh[a]. Ceux-ci le donneront aux ouvriers qui travaillent dans la maison de Yahweh, afin de réparer les parties endommagées du bâtiment[b].
  to: Qu’on le remette aux ouvriers préposés dans la maison de Yahweh[a]. Ils le donneront aux ouvriers qui sont dans la maison de Yahweh, afin de réparer les dégradations de la maison[b].
  rationale: La révision retire l’interprétation non nécessaire selon laquelle le premier groupe serait explicitement constitué de responsables, rétablit la localisation « dans la maison de Yahweh » et conserve « maison » dans la dernière expression. Elle garde un français moderne et la distinction textuelle minimale entre les ouvriers préposés et les ouvriers auxquels ils remettent les fonds.
