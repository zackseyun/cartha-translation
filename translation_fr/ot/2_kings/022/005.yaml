base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: fr
  text: Qu’on le remette aux ouvriers préposés dans la maison de Yahweh[a]. Ils le donneront aux ouvriers qui sont dans la maison de Yahweh, afin de réparer les dégradations de la maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’on le donne entre les mains des ouvriers préposés dans la maison de Yahweh. » L’expression hébraïque indique une remise à leur garde ou à leur responsabilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « afin de consolider les dégradations de la maison ». Le terme peut désigner des fissures, brèches ou autres dommages nécessitant une réparation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְנֵה עַל־יַד
  choice: Qu’on remette l’argent
  rationale: Le verbe נתן signifie « donner », mais, avec עַל־יַד, il décrit ici la remise d’une somme à la garde ou au contrôle de responsables. « Remettre » rend naturellement cet idiome. « L’argent » explicite en français le pronom objet renvoyant au verset précédent.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: aux responsables des travaux chargés
  rationale: L’expression désigne littéralement ceux qui font l’ouvrage et qui ont été établis ou chargés d’une fonction. Dans ce contexte, il s’agit des responsables du chantier plutôt que de simples ouvriers; « chargés » conserve la nuance passive de הַמֻּפְקָדִים.
- source_word: בְּבֵית יְהוָה
  choice: de la maison de Yahweh
  rationale: « Maison » préserve le terme hébreu בית et désigne ici le temple. La préposition française « de » s’accorde naturellement avec « travaux chargés de », sans modifier le référent locatif et institutionnel.
- source_word: וְיִתְּנוּ אֹתוֹ
  choice: Ceux-ci le donneront
  rationale: Le pluriel renvoie aux responsables précédemment mentionnés. Le futur français exprime naturellement la suite de l’instruction; le pronom « le » reprend l’argent.
- source_word: לְעֹשֵׂי הַמְּלָאכָה אֲשֶׁר בְּבֵית יְהוָה
  choice: aux ouvriers qui travaillent dans la maison de Yahweh
  rationale: Pour ce second groupe, « ouvriers » distingue les exécutants des responsables. « Travaillent » explicite le sens de עֹשֵׂי הַמְּלָאכָה dans un français fluide, tandis que « dans » conserve la localisation exprimée par בְּ.
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: afin de réparer les parties endommagées du bâtiment
  rationale: חזק signifie littéralement « fortifier, consolider », mais associé à בֶּדֶק הַבָּיִת il désigne la remise en état des dégradations du bâtiment. Cette formulation française exprime clairement le sens concret tout en signalant en note l’image hébraïque.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin et correspond à la convention fournie dans la couche de consultation, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation distingue clairement les responsables du chantier des ouvriers exécutants, tout en conservant « maison de Yahweh » pour le temple. Les deux notes documentent les principales nuances lexicales sans alourdir le verset.
