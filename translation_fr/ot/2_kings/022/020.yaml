base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: fr
  text: « C’est pourquoi, voici que je vais te recueillir auprès de tes ancêtres, et tu seras enseveli dans tes tombeaux, dans la paix[a]. Tes yeux ne verront pas tout le malheur que je vais faire venir sur ce lieu. » Ils rapportèrent cette réponse au roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans la paix ». Dans ce contexte, l’expression peut signifier que Josias mourra avant de voir venir le jugement annoncé, sans nécessairement préciser les circonstances exactes de sa mort.
    reason: Préserver l’ambiguïté lexicale et la tension avec 2 Rois 23.29.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conclusion tirée de l’humilité et de la réaction de Josias dans le contexte précédent.
- source_word: הִנְנִי
  choice: voici que je vais
  rationale: Conserve l’emphase solennelle de l’annonce divine tout en rendant naturellement la construction hébraïque qui introduit une action imminente.
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  choice: je vais te recueillir … tu seras recueilli
  rationale: La répétition de « recueillir » reproduit celle de la racine אסף et convient à l’euphémisme funéraire, sans rendre le français artificiel.
- source_word: עַל אֲבֹתֶיךָ
  choice: auprès de tes ancêtres
  rationale: Rend le sens idiomatique d’être joint aux générations décédées. « Ancêtres » est plus immédiatement compréhensible en français moderne que le littéral « pères ».
- source_word: קִבְרֹתֶיךָ
  choice: tes tombeaux
  rationale: Conserve le pluriel hébreu et le caractère funéraire du terme.
- source_word: בְּשָׁלוֹם
  choice: dans la paix
  rationale: Maintient le substantif hébreu שָׁלוֹם et son ambiguïté, au lieu de préciser indûment la manière dont Josias mourra.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Tes yeux ne verront pas
  rationale: Conserve les yeux comme sujet explicite, ainsi que l’image et l’emphase de l’hébreu.
- source_word: הָרָעָה
  choice: le malheur
  rationale: Dans ce contexte de jugement, רָעָה désigne la calamité annoncée plutôt que le mal moral. « Malheur » est clair, digne et naturel.
- source_word: מֵבִיא עַל
  choice: je vais faire venir sur
  rationale: Rend l’action imminente exprimée par le participe et conserve l’idée d’un jugement venant sur le lieu.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ce lieu
  rationale: Traduction sobre et suffisamment large pour la réalité géographique visée dans le contexte.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: Ils rapportèrent cette réponse au roi
  rationale: Rend en français idiomatique la formule hébraïque indiquant le retour des envoyés avec un message.
theological_decisions:
- issue: Sens de « dans la paix » alors que Josias meurt ensuite au combat (2 Rois 23.29)
  choice: Conserver littéralement « dans la paix » et expliquer brièvement son sens contextuel possible en note.
  alternative: Traduire « paisiblement » comme une description précise de la manière de mourir, ou reformuler pour harmoniser explicitement les récits.
  rationale: L’hébreu ne résout pas lui-même la tension. La proposition suivante suggère que Josias mourra avant de voir le malheur annoncé, sans nécessairement affirmer qu’il connaîtra une mort paisible dans toutes ses circonstances.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la solennité prophétique, la répétition de la racine « recueillir » et le pluriel « tombeaux », tout en évitant un calque excessivement obscur.
