  text: אַ֚ךְ לֹא יֵחָשֵׁ֣ב אִתָּ֔/ם הַ/כֶּ֖סֶף הַ/נִּתָּ֣ן עַל יָדָ֑/ם כִּ֥י בֶ/אֱמוּנָ֖ה הֵ֥ם עֹשִֽׂים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: fr
  text: Mais on ne leur demandera aucun compte de l’argent remis entre leurs mains[a][b], car ils agissent avec fidélité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’argent » (le métal) ; le terme hébreu désigne couramment la monnaie dans un contexte financier.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « l’argent remis entre leurs mains ne sera pas compté avec eux » ; autrement dit, aucune reddition de comptes ne leur sera demandée pour ces fonds.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: La particule introduit une exception ou une restriction par rapport aux instructions précédentes ; « Mais » exprime naturellement cette valeur adversative.
- source_word: יֵחָשֵׁב אִתָּם
  choice: on ne leur demandera aucun compte
  rationale: Dans ce contexte financier, le niphal de חשׁב avec אִתָּם indique qu’aucune reddition de comptes ne sera exigée de ces hommes. La formulation française exprime clairement ce sens tout en signalant en note la tournure plus littérale.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף désigne littéralement l’argent métal, mais sert couramment à désigner la monnaie ; ici, le contexte financier appelle naturellement « l’argent » en français.
- source_word: הַנִּתָּן עַל יָדָם
  choice: remis entre leurs mains
  rationale: Cette formulation conserve l’image hébraïque de fonds placés entre les mains des responsables, tout en restant idiomatique en français.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle aucun compte ne leur est demandé.
- source_word: בֶאֱמוּנָה
  choice: avec fidélité
  rationale: Dans ce contexte, אֱמוּנָה désigne la fiabilité, la loyauté ou l’intégrité dans l’exercice d’une responsabilité, et non la foi doctrinale.
- source_word: הֵם עֹשִׂים
  choice: ils agissent
  rationale: Le verbe signifie littéralement « ils font » ; associé à בֶאֱמוּנָה, il décrit ici leur manière de se conduire dans l’accomplissement de leur tâche.
