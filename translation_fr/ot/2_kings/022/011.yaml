source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֶת דִּבְרֵ֖י סֵ֣פֶר הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: fr
  text: Lorsque le roi entendit les paroles du livre de la Loi[a], il déchira ses vêtements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du rouleau de la Loi ». Le mot hébreu סֵפֶר peut désigner un rouleau, un livre ou un document écrit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque … entendit
  rationale: La construction narrative avec וַיְהִי et כ suivi de l’infinitif construit exprime ici la circonstance temporelle. « Lorsque » rend naturellement la progression sans reproduire lourdement « il arriva que ».
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Équivalent direct du nom défini.
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Dans ce contexte, דְּבָרִים désigne les paroles lues ou le contenu verbal du document. « Paroles » maintient le lien formel avec l’hébreu.
- source_word: סֵפֶר הַתּוֹרָה
  choice: le livre de la Loi
  rationale: סֵפֶר peut désigner un livre, un rouleau ou un document écrit. « Livre de la Loi » est clair et consacré dans ce contexte; « rouleau » reste une possibilité signalée en note. Ici, תּוֹרָה renvoie au corpus normatif de l’alliance, ce que « Loi » exprime adéquatement.
- source_word: וַיִּקְרַע
  choice: il déchira
  rationale: קָרַע signifie déchirer. Le passé simple convient au récit historique et rend avec dignité ce geste de détresse et d’effroi.
- source_word: בְּגָדָיו
  choice: ses vêtements
  rationale: Équivalent moderne et digne du pluriel בְּגָדִים, sans préciser indûment qu’il s’agissait de robes.
