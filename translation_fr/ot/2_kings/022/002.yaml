  source_fidelity: 'Le texte restitue avec fidélité les trois propositions hébraïques : l’évaluation morale (« ce qui est juste »), la conformité complète à la voie de David (« en tout la voie ») et l’absence de déviation « ni à droite ni à gauche ». « Aux yeux de Yahweh » conserve l’image évaluative de בְּעֵינֵי יהוה, et « Yahweh » correspond à la politique du projet.'
