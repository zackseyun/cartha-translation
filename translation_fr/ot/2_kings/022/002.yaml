  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: fr
  text: Il fit ce qui est juste aux yeux de Yahweh. Il suivit en tout la voie de David, son père[a], sans s’en écarter ni à droite ni à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « son père » signifie ici son ancêtre ou le père de sa dynastie.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Il fit ce qui est juste
  rationale: L’adjectif substantivé désigne ici ce qui est moralement droit; cette formulation française est naturelle et conserve l’évaluation du texte.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette traduction garde l’image de l’expression hébraïque d’évaluation tout en restant claire en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit directement, conformément au texte hébreu et à l’usage du projet.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: Il suivit en tout la voie
  rationale: « Suivre la voie » restitue naturellement en français la métaphore hébraïque de la conduite, tandis que « en tout » exprime la conformité complète indiquée par בְּכָל.
- source_word: דָּוִד אָבִיו
  choice: David, son père
  rationale: La formulation conserve le langage dynastique du texte; une note précise que « père » a ici le sens plus large d’ancêtre.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: sans s’en écarter ni à droite ni à gauche
  rationale: Cette tournure française conserve l’image du chemin et l’idée d’une absence totale de déviation.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Rapport de Josias à David
  choice: David, son père
  alternative: David, son ancêtre
  rationale: Le terme hébreu אָב peut désigner un ancêtre ou un père dynastique. Le texte principal conserve la formulation généalogique et dynastique, tandis que la note prévient une lecture biologique immédiate.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au récit historique écrit. La métaphore de la voie et le parallélisme « ni à droite ni à gauche » sont conservés sans lourdeur littérale.
