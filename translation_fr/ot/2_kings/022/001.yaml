base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: fr
  text: Josias avait huit ans lorsqu’il devint roi, et il régna trente et un ans à Jérusalem. Sa mère s’appelait Yedida ; elle était fille d’Adaya et originaire de Botsqath.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: avait huit ans
  rationale: Expression française naturelle et exacte pour l’idiome hébreu d’âge, littéralement « fils de huit ans ».
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: Le syntagme situe l’âge de Josias au moment de son accession au trône ; cette formulation est naturelle en français moderne.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה מָלַךְ
  choice: il régna trente et un ans
  rationale: Rend directement le verbe de royauté et exprime le nombre selon l’usage français courant.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition « à » convient naturellement avec un nom de ville et indique le siège du règne.
- source_word: וְשֵׁם אִמּוֹ יְדִידָה
  choice: Sa mère s’appelait Yedida
  rationale: Tour idiomatique moderne qui conserve intégralement l’information de la formule hébraïque « le nom de sa mère était ».
- source_word: בַת עֲדָיָה
  choice: elle était fille d’Adaya
  rationale: Rend explicitement et naturellement la relation filiale indiquée par בַת.
- source_word: מִבָּצְקַת
  choice: de Botsqath
  rationale: La préposition מִן indique ici l’origine géographique ; « de » est la formulation française la plus fluide dans cette notice familiale.
