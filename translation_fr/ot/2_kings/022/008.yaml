  text: וַ֠/יֹּאמֶר חִלְקִיָּ֜הוּ הַ/כֹּהֵ֤ן הַ/גָּדוֹל֙ עַל שָׁפָ֣ן הַ/סֹּפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֨ן חִלְקִיָּ֧ה אֶת הַ/סֵּ֛פֶר אֶל שָׁפָ֖ן וַ/יִּקְרָאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: fr
  text: 'Alors le grand prêtre Hilqiya dit au scribe Shafân : « J’ai trouvé le livre de la Loi[a] dans la maison de Yahweh[b]. » Hilqiya donna le livre à Shafân, et il le lut[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rouleau de la Loi ». Le mot hébreu סֵפֶר peut désigner un livre, un rouleau ou, plus généralement, un document écrit.
    reason: lexical_alternative
  - marker: b
    text: La « maison de Yahweh » désigne ici le temple.
    reason: cultural_note
  - marker: c
    text: Ou, moins probablement, « et il en lut un passage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement en français la succession narrative.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: Il s’agit du titre établi pour le principal titulaire de la fonction sacerdotale en Israël.
- source_word: עַל שָׁפָן
  choice: à Shafân
  rationale: Avec un verbe de parole, עַל introduit ici la personne à qui l’on s’adresse.
- source_word: הַסֹּפֵר
  choice: le scribe
  rationale: Le terme désigne un scribe exerçant une fonction administrative ou royale. « Scribe » conserve le titre historique sans le réduire à la fonction moderne de secrétaire.
- source_word: סֵפֶר הַתּוֹרָה
  choice: le livre de la Loi
  rationale: סֵפֶר désigne un document écrit, généralement sous forme de rouleau à cette époque, et תּוֹרָה renvoie ici au texte légal et covenantiel découvert dans le temple. La formulation retenue est claire et consacrée en français.
- source_word: מָצָאתִי
  choice: J’ai trouvé
  rationale: Le passé composé rend naturellement l’accompli hébreu et souligne la pertinence présente de la découverte annoncée.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: La traduction conserve l’expression hébraïque « maison de Yahweh », qui désigne ici le temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַיִּתֵּן ... אֶת הַסֵּפֶר
  choice: donna le livre
  rationale: Cette formulation simple rend directement le verbe נתן et son complément d’objet.
- source_word: וַיִּקְרָאֵהוּ
  choice: et celui-ci le lut
  rationale: Le suffixe pronominal est rendu comme complément d’objet direct. « Celui-ci » indique naturellement que le sujet implicite est Shafân, le dernier personnage mentionné, lecture la plus probable dans la progression du récit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel du Dieu d’Israël plutôt que de le remplacer par un titre.
- issue: Sens de תּוֹרָה dans סֵפֶר הַתּוֹרָה
  choice: la Loi
  alternative: l’Instruction
  rationale: « Loi » convient au contexte légal et covenantiel de ce document tout en maintenant la désignation biblique reconnue. Le choix n’identifie pas plus précisément le contenu ou l’étendue du livre découvert.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms propres sont translittérés de façon à refléter l’hébreu. La syntaxe reste narrative et sobre; l’expression culturelle « maison de Yahweh » est conservée et expliquée en note.
