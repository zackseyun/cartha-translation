  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Il le lut » est plus fluide et préserve mieux la discrète indétermination de l’original que « celui-ci le lut ».
  terminology: '« Grand prêtre », « scribe », « livre de la Loi » et « maison de Yahweh » sont appropriés. La note sur le rouleau rend utilement la souplesse de סֵפֶר. La note finale doit être resserrée : ses deux formulations actuelles ne constituent pas des équivalents français également naturels de l’alternative « read from it ».'
