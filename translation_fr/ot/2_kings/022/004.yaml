  text: עֲלֵ֗ה אֶל חִלְקִיָּ֨הוּ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְ/יַתֵּ֣ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה אֲשֶׁ֥ר אָסְפ֛וּ שֹׁמְרֵ֥י הַ/סַּ֖ף מֵ/אֵ֥ת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: fr
  text: Monte auprès d’Hilqiya, le grand prêtre, et qu’il fasse le compte de l’argent apporté dans la maison de Yahweh, celui que les gardiens du seuil[a] ont recueilli auprès du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les portiers » ; littéralement « les gardiens du seuil ».
    reason: Le syntagme désigne probablement les responsables des portes du temple, mais sa formulation littérale évoque le seuil.
lexical_decisions:
- source_word: עֲלֵה
  choice: Monte auprès de
  rationale: L’impératif de עלה conserve l’idée directionnelle de monter, tout en formant une instruction naturelle en français.
- source_word: חִלְקִיָּהוּ
  choice: Hilqiya
  rationale: Translittération française du nom hébreu, qui rend notamment la consonne ק par « q ».
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: le grand prêtre
  rationale: Titre consacré et naturel en français pour le principal responsable sacerdotal.
- source_word: וְיַתֵּם
  choice: et qu’il fasse le compte
  rationale: Dans ce contexte administratif, le hiphil de תמם désigne l’achèvement du décompte ou de la totalisation des fonds. Cette formulation reste naturelle sans préciser plus que le texte.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: En français, « argent » peut désigner à la fois le métal et la monnaie, ce qui correspond bien au terme hébreu dans ce contexte.
- source_word: הַמּוּבָא
  choice: apporté
  rationale: Le participe passif hophal est rendu par un participe passé qui qualifie directement l’argent.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Rend littéralement בית par « maison » et conserve le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: אָסְפוּ
  choice: ont recueilli
  rationale: Le verbe exprime le rassemblement ou la collecte des fonds; « recueillir » convient au contexte financier et cultuel.
- source_word: שֹׁמְרֵי הַסַּף
  choice: les gardiens du seuil
  rationale: Traduction proche de la forme hébraïque, tandis que la fonction probable de portiers est signalée en note.
- source_word: מֵאֵת הָעָם
  choice: auprès du peuple
  rationale: Exprime naturellement en français la provenance des fonds recueillis, sans restreindre le référent.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la brièveté de l’ordre royal; « argent » préserve naturellement la double valeur de métal précieux et de fonds monétaires.
