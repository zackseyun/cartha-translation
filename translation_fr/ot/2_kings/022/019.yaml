  naturalness: La phrase longue demeure naturelle dans un registre biblique moderne. « Ton cœur était sensible » rend plus directement l'adjectif hébreu « tendre » que le passé composé inchoatif « s'est attendri ».
  terminology: « Yahweh » correspond au tétragramme dans le texte source et à la décision de l'audit anglais. « Désolation » et « malédiction » conservent les deux termes de jugement sans les développer interprétativement.
