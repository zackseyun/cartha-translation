source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: fr
  text: Parce que ton cœur était sensible et que tu t’es humilié devant Yahweh quand tu as entendu ce que j’ai prononcé contre ce lieu et contre ses habitants, qu’ils deviendraient une désolation[a] et une malédiction, parce que tu as déchiré tes vêtements et pleuré devant moi, moi aussi, je t’ai entendu, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet de stupeur » ou « une horreur ». Le mot hébreu שַׁמָּה peut désigner la désolation ou, dans un contexte de jugement, l’horreur ou ce qui provoque la stupeur.
    reason: alternative lexicale
lexical_decisions:
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit la cause de la réponse favorable de Dieu et permet de conserver la structure causale de la phrase hébraïque.
- source_word: רַךְ לְבָבְךָ
  choice: ton cœur s’est attendri
  rationale: Conserve la métaphore du cœur devenu tendre tout en exprimant naturellement en français la sensibilité et la réceptivité de Josias.
- source_word: וַתִּכָּנַע
  choice: tu t’es humilié
  rationale: Rend la forme réfléchie et l’abaissement volontaire de Josias devant Dieu sans ajouter une interprétation confessionnelle.
- source_word: מִפְּנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend l’expression idiomatique de la présence divine et conserve directement le nom divin.
- source_word: בְּשָׁמְעֲךָ
  choice: quand tu as entendu
  rationale: Exprime naturellement la valeur temporelle de la construction infinitive hébraïque.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: ce que j’ai prononcé
  rationale: Désigne le contenu de la parole divine et garde le caractère solennel d’une annonce de jugement.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: contre ce lieu et contre ses habitants
  rationale: Dans ce contexte de jugement, « contre » restitue la portée hostile de la parole annoncée.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: qu’ils deviendraient un spectacle de désolation et un objet de malédiction
  rationale: La formulation française s’applique conjointement au lieu et à ses habitants, tout en conservant les deux images de jugement et l’ambiguïté sémantique de שַׁמָּה dans une note.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: tu as déchiré tes vêtements
  rationale: Traduction directe et actuelle du geste conventionnel de deuil et d’humiliation.
- source_word: וַתִּבְכֶּה לְפָנַי
  choice: pleuré devant moi
  rationale: « Pleuré » exprime précisément le deuil, tandis que « devant moi » maintient l’adresse personnelle de Dieu.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: moi aussi, je t’ai entendu
  rationale: Le pronom disjoint restitue l’emphase de אָנֹכִי avec גַם; le complément « t’ » est implicite dans le contexte hébreu et nécessaire en français naturel.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: Formule prophétique solennelle, claire en français moderne, avec conservation du nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre divin au lieu de le remplacer par un titre.
- issue: Nature de la réaction intérieure de Josias
  choice: ton cœur s’est attendri
  alternative: ton cœur a été sensible
  rationale: La traduction maintient l’image hébraïque d’un cœur tendre et réceptif sans réduire cette réaction à une émotion passagère ni définir davantage sa portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La longue phrase causale de l’hébreu est conservée, mais des tirets structurent l’annonce de jugement. Le marqueur [a] est placé après « désolation », terme auquel la note se rapporte.
