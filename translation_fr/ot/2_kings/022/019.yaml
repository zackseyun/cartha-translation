  to: Parce que ton cœur était sensible et que tu t’es humilié devant Yahweh quand tu as entendu ce que j’ai prononcé contre ce lieu et contre ses habitants, qu’ils deviendraient une désolation[a] et une malédiction, parce que tu as déchiré tes vêtements et pleuré devant moi, moi aussi, je t’ai entendu, déclare Yahweh.
