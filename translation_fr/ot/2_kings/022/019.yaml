  - severity: low
    issue: « ton cœur s’est attendri » est légèrement plus dynamique que le prédicat adjectival hébreu
    rationale: רַךְ לְבָבְךָ décrit l'état d'un cœur tendre ou réceptif. « Ton cœur était sensible » conserve cet état de manière idiomatique et sobre.
