  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: fr
  text: 'Elle leur dit : « Ainsi parle Yahweh, le Dieu d’Israël : Dites à l’homme qui vous a envoyés auprès de moi : »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: Elle leur dit
  rationale: Le wayyiqtol poursuit directement le récit, et le pronom féminin renvoie à Houlda. « Leur » rend le complément pluriel אֲלֵיהֶם avec naturel.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule française consacrée et toujours intelligible restitue la formule de messager prophétique. Le présent exprime l’autorité actuelle de la proclamation sans calquer mécaniquement l’accompli hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, au lieu de le remplacer par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette traduction directe de la chaîne construite identifie Yahweh comme le Dieu d’Israël.
- source_word: אִמְרוּ
  choice: Dites
  rationale: L’impératif pluriel s’adresse aux membres de la délégation et introduit le message qu’ils doivent transmettre.
- source_word: לָאִישׁ
  choice: à l’homme
  rationale: Le nom masculin singulier אִישׁ désigne ici précisément l’homme qui a envoyé la délégation, c’est-à-dire le roi dans le contexte.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: qui vous a envoyés vers moi
  rationale: La relative est rendue naturellement. « Vers moi » conserve explicitement l’idée de destination portée par אֵלַי.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le conserve explicitement plutôt que de lui substituer un titre.
- issue: Genre du nom אִישׁ
  choice: l’homme
  alternative: la personne
  rationale: Le nom est masculin singulier et désigne dans ce contexte un homme précis. La traduction ne neutralise donc pas inutilement le genre.
translation_notes:
  register: Français international moderne, digne et accessible. « Ainsi parle » maintient le registre prophétique biblique sans archaïsme obscur. Les guillemets imbriqués et le deux-points final signalent que l’ordre donné à la délégation introduit la proclamation qui se poursuit au verset suivant.
