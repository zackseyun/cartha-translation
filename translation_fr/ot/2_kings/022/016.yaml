  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh : « Voici, je vais faire venir sur ce lieu et sur ses habitants un malheur[a], conformément à toutes les paroles du livre que le roi de Juda a lu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une calamité ». Ici, le mot hébreu désigne le désastre qui constitue le jugement, et non le mal moral.
    reason: alternative lexicale et clarification du sens contextuel
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Rend naturellement en français moderne la formule solennelle du messager prophétique, tout en conservant le nom divin.
- source_word: הִנְנִי מֵבִיא
  choice: Je vais faire venir
  rationale: Le participe précédé de הִנְנִי présente l’action comme certaine et imminente. Le futur proche français exprime cette imminence sans l’archaïsme d’un « voici, je fais venir ».
- source_word: רָעָה
  choice: un malheur
  rationale: Dans ce contexte de jugement, le terme désigne une calamité infligée et non le mal moral. « Malheur » convient au registre prophétique et s’emploie naturellement avec « faire venir sur ».
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: sur ce lieu et sur ses habitants
  rationale: La formulation française exprime clairement la destination du jugement et conserve le parallélisme du texte hébreu.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: conformément à toutes les paroles du livre
  rationale: L’hébreu juxtapose « toutes les paroles du livre » au malheur annoncé. « Conformément à » explicite avec retenue le rapport d’accomplissement exigé par le contexte, sans remplacer « paroles » par une paraphrase.
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: que le roi de Juda a lu
  rationale: Rend directement la proposition relative. Le passé composé correspond à la lecture récente ayant une portée présente; rien dans la forme verbale seule n’oblige à préciser « à haute voix ».
theological_decisions:
- issue: Sens de רָעָה dans l’annonce du jugement divin
  choice: un malheur
  alternative: un mal / une calamité
  rationale: Le contexte désigne le désastre historique annoncé comme jugement. « Malheur » évite de faire dire que Yahweh produit le mal moral, sans atténuer la sévérité du jugement.
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La transcription « Yahweh » représente directement le nom propre de l’alliance présent dans le texte hébreu.
- issue: Rapport syntaxique entre רָעָה et כָּל דִּבְרֵי הַסֵּפֶר
  choice: conformément à toutes les paroles du livre
  alternative: un malheur — toutes les paroles du livre
  rationale: L’accusatif « toutes les paroles » est syntaxiquement abrupt et peut présenter le contenu du jugement annoncé. Le rendu choisi communique en français le rapport contextuel entre le malheur et les paroles du livre, tout en maintenant l’expression « toutes les paroles ».
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique reste solennelle sans recourir à « ainsi parle », plus traditionnelle. Le discours direct est signalé par des guillemets français.
