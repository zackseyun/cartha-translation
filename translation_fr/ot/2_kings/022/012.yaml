source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֣ה הַ/כֹּהֵ֡ן וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַכְבּ֨וֹר בֶּן מִיכָיָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סֹּפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: fr
  text: 'Puis le roi donna cet ordre à Hilqiya le prêtre[a], à Ahiqam fils de Shafan, à Akbor fils de Mikaya, à Shafan le secrétaire[b] et à Asaya, serviteur du roi[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « Hilqiya le prêtre », sans employer explicitement le titre de « grand prêtre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Shafan le scribe ». Le terme hébreu peut désigner un scribe royal ou un secrétaire chargé de l’administration.
    reason: lexical_alternative
  - marker: c
    text: Ou « Asaya, fonctionnaire du roi ». L’hébreu dit littéralement « serviteur », terme qui peut désigner un fonctionnaire au service du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime ici l’autorité du roi. Cette tournure française restitue naturellement l’idée de commandement et introduit bien les paroles du verset suivant.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: Hilqiya le prêtre
  rationale: Le texte hébreu porte simplement « le prêtre » et ne donne pas explicitement à Hilqiya le titre de grand prêtre.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahiqam fils de Shafan
  rationale: « Fils de » rend directement et naturellement la désignation généalogique בֶּן.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: Akbor fils de Mikaya
  rationale: Les noms sont translittérés sous des formes françaises proches de l’hébreu.
- source_word: שָׁפָן הַסֹּפֵר
  choice: Shafan le secrétaire
  rationale: Dans le cadre de la cour royale, סֹפֵר désigne vraisemblablement un responsable de l’écrit et de l’administration. « Secrétaire » est naturel en français moderne, tandis que « scribe » demeure une possibilité lexicale.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaya, serviteur du roi
  rationale: עֶבֶד signifie littéralement « serviteur » ; à la cour, le terme peut aussi désigner un fonctionnaire au service du roi.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit le contenu de l’ordre au verset suivant. En français, les deux-points assurent naturellement cette liaison sans ajouter une formule pesante comme « en disant ».
theological_decisions:
- issue: Titre sacerdotal de Hilqiya
  choice: le prêtre
  alternative: le grand prêtre
  rationale: Même si le contexte peut faire de Hilqiya le principal responsable sacerdotal, ce verset emploie seulement הַכֹּהֵן, « le prêtre ». La traduction n’ajoute donc pas un titre absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la liste officielle des personnes mandatées, tout en rendant לֵאמֹר par une ponctuation française naturelle qui ouvre directement sur le contenu de l’ordre au verset suivant.
