base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: fr
  text: 'Il dit[a] : « Si Yahvé ne te secourt pas, d’où pourrais-je te secourir ? De l’aire de battage ou du pressoir ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se lire comme une exclamation volitive négative : « Que Yahvé ne te secoure pas ! » Le verbe traduit deux fois par « secourir » peut aussi signifier « sauver » ou « délivrer ».'
    reason: La particule אַל introduit habituellement une négation volitive, tandis que le contexte et de nombreuses traductions comprennent ici la phrase comme une condition négative. La note présente les deux possibilités sans introduire une lecture affirmative non attestée par le texte hébreu.
lexical_decisions:
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: Si Yahvé ne te secourt pas
  rationale: Dans ce contexte, la tournure est comprise comme une prémisse conditionnelle exprimant l’impuissance du roi. « Secourir » convient à la détresse concrète causée par la famine et peut rendre le même verbe hébreu dans les deux propositions. La construction avec אַל demeure toutefois grammaticalement difficile, d’où la variante signalée en note.
- source_word: יוֹשִׁעֵךְ / אֹשִׁיעֵךְ
  choice: te secourt / te secourir
  rationale: Le verbe ישׁע peut signifier sauver, délivrer ou secourir. « Secourir » est naturel ici pour une aide matérielle immédiate et maintient le parallélisme lexical de l’hébreu sans imposer une connotation exclusivement spirituelle.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est conservé comme nom propre. « Yahvé » est sa forme usuelle en français moderne.
- source_word: מֵאַיִן
  choice: d’où
  rationale: Cette formulation française concise exprime la question portant sur la provenance ou la source du secours.
- source_word: הַגֹּרֶן
  choice: l’aire de battage
  rationale: Le terme désigne l’endroit où l’on battait les céréales, présenté ici comme source possible de nourriture.
- source_word: הַיָּקֶב
  choice: le pressoir
  rationale: Le mot désigne le pressoir ou la cuve où l’on préparait le vin. « Pressoir » forme un parallèle concret et naturel avec « aire de battage ».
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Cette formulation sobre restitue le verbe narratif sans ajouter une nuance absente du texte source.
theological_decisions:
- issue: Interprétation de אַל devant יוֹשִׁעֵךְ
  choice: 'Une condition négative : « Si Yahvé ne te secourt pas »'
  alternative: 'Une exclamation ou un souhait négatif : « Non ! Que Yahvé te secoure ! » ou « Que Yahvé ne te secoure pas ! »'
  rationale: La lecture conditionnelle s’accorde le mieux avec la question rhétorique qui suit et avec l’aveu d’impuissance du roi. Comme אַל introduit normalement une négation volitive, la formulation hébraïque permet d’autres analyses, qui ne doivent pas être dissimulées.
- issue: Portée de ישׁע dans ce contexte
  choice: secourir
  alternative: sauver ou délivrer
  rationale: Le passage traite d’un secours concret pendant une famine. « Secourir » préserve cette portée sans exclure le sens plus large de délivrance porté par le verbe hébreu.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie le nom divin lui-même et non un titre. Le conserver comme nom propre respecte cette distinction.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « secourir » conserve le parallélisme hébreu. « Aire de battage » est un terme concret et intelligible, tandis que « pressoir » suffit dans ce contexte sans expliciter « à vin ».
