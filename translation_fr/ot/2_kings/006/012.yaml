base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: fr
  text: 'Mais l’un de ses serviteurs répondit : « Non, mon seigneur le roi ! C’est Élisée, le prophète qui est en Israël, qui rapporte au roi d’Israël les paroles que tu prononces dans ta chambre à coucher. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: C’est… qui
  rationale: Après la négation, la particule introduit ici la véritable explication; la tournure clivée rend naturellement en français cette opposition et l’accent porté sur Élisée.
- source_word: יַגִּיד
  choice: rapporte
  rationale: Le verbe נגד au hifil signifie faire connaître, annoncer ou rapporter. « Rapporte » convient au contexte où des propos secrets sont communiqués au roi d’Israël.
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: dans ta chambre à coucher
  rationale: Rend directement l’expression hébraïque « dans la chambre de ton lit », qui désigne la chambre à coucher, lieu privé.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר תְּדַבֵּר
  choice: jusqu’aux paroles que tu prononces
  rationale: « Paroles » conserve la valeur concrète de דְּבָרִים et « prononces » évite une répétition maladroite. « Jusqu’aux » explicite sobrement la portée emphatique du lieu le plus secret dans le contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et oralement fluide. « Mon seigneur le roi » conserve l’adresse respectueuse de l’hébreu sans employer un registre archaïque. L’exclamation après la négation reflète la vigueur probable de la réponse sans ajouter d’interprétation doctrinale.
