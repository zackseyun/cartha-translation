  text: וַ/יֹּ֖אמֶר הָ֣רֶם לָ֑/ךְ וַ/יִּשְׁלַ֥ח יָד֖/וֹ וַ/יִּקָּחֵֽ/הוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/007.yaml
  text: And he said, “Pick it up for yourself.” So he reached out his hand and took it.
translation:
  language: fr
  text: 'Il dit : « Ramasse-le toi-même[a]. » L’homme tendit la main et le prit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Soulève-le pour toi. »'
    reason: L’hébreu emploie le verbe « élever, soulever » et une tournure avec « pour toi », dont la nuance exacte peut être rendue de plusieurs façons.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol poursuit la narration. En français, le passé simple exprime naturellement cette succession sans qu’il soit nécessaire d’ajouter « et ».
- source_word: הָרֶם
  choice: Ramasse-le
  rationale: L’impératif de הֵרִים signifie littéralement « soulève », mais, dans ce contexte où l’objet est récupéré à la surface de l’eau, « ramasse-le » exprime naturellement l’action demandée. Le pronom objet est fourni par le contexte et par le suffixe de וַיִּקָּחֵהוּ dans la proposition suivante.
- source_word: לָךְ
  choice: toi-même
  rationale: 'Le ל avec suffixe masculin singulier souligne ici l’intervention personnelle du destinataire : il doit prendre lui-même l’objet désormais accessible.'
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: L’homme tendit la main
  rationale: « Tendre la main » rend directement et naturellement l’expression hébraïque. Le sujet explicite « l’homme » évite en français une succession ambiguë de pronoms renvoyant d’abord au prophète, puis à son interlocuteur.
- source_word: וַיִּקָּחֵהוּ
  choice: et le prit
  rationale: לקח a le sens courant de « prendre »; le suffixe masculin singulier est rendu par « le ».
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. Le passé simple convient à la narration biblique écrite sans être archaïque. « Ramasse-le » privilégie l’idiome français, tandis que la note conserve le sens plus littéral de l’impératif hébreu. Le changement de sujet implicite est clarifié par « L’homme ».
