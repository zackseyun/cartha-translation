  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: fr
  text: Il y envoya donc des chevaux, des chars et une troupe importante[a]. Ils arrivèrent de nuit et encerclèrent la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une force considérable ». L’expression hébraïque signifie littéralement « une force lourde » et désigne ici un contingent militaire substantiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁמָּה
  choice: Il y envoya donc
  rationale: Le verbe exprime l’action suivante du récit, tandis que שָׁמָּה indique la destination déjà mentionnée. « Y envoya » est naturel en français et « donc » marque sobrement la suite logique du contexte.
- source_word: סוּסִים
  choice: des chevaux
  rationale: Le nom désigne littéralement des chevaux. Le contexte militaire pourrait suggérer des cavaliers, mais le rendu concret préserve ce que dit le texte.
- source_word: וְרֶכֶב
  choice: des chars
  rationale: רֶכֶב peut désigner des chars ou l’ensemble des unités de chars. « Des chars » conserve l’image militaire concrète sans employer un terme technique.
- source_word: וְחַיִל כָּבֵד
  choice: une troupe importante
  rationale: Dans ce contexte, חַיִל désigne une force militaire, et כָּבֵד, littéralement « lourd », qualifie idiomatiquement une force substantielle. « Une troupe importante » exprime ce sens sans préciser indûment s’il s’agit de sa taille ou de sa puissance.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: Ils arrivèrent de nuit
  rationale: La tournure indique une arrivée pendant la nuit. « De nuit » est concise, naturelle et conserve la valeur narrative du moment choisi.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: et encerclèrent la ville
  rationale: Le verbe signifie entourer ou faire le tour. Dans ce contexte militaire, « encercler » rend clairement l’action.
