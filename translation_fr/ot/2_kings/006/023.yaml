revisions:
- from: Il leur prépara donc un grand festin[a]. Après qu’ils eurent mangé et bu, il les laissa partir, et ils retournèrent auprès de leur maître[b]. Dès lors, les bandes de pillards d’Aram[c] ne revinrent plus dans le pays d’Israël.
  to: Il leur prépara un grand festin[a]. Ils mangèrent et burent, puis il les renvoya, et ils retournèrent auprès de leur maître[b]. Les bandes de pillards d’Aram[c] ne revinrent plus dans le pays d’Israël.
  rationale: La révision retire des marqueurs discursifs non exprimés dans l’hébreu et remplace « laissa partir » par « renvoya », tout en conservant le sens, le registre et les ancres de notes du projet.
