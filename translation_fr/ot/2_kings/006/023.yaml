base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: fr
  text: Il leur prépara un grand festin[a]. Ils mangèrent et burent, puis il les renvoya, et ils retournèrent auprès de leur maître[b]. Les bandes de pillards d’Aram[c] ne revinrent plus dans le pays d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand banquet ». L’hébreu emploie ici un verbe et un nom de même racine pour parler de la préparation d’un repas copieux.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur seigneur ». Il s’agit vraisemblablement du roi d’Aram.
    reason: lexical_alternative
  - marker: c
    text: Aram est le nom hébreu du territoire souvent appelé « Syrie » dans les traductions plus anciennes.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֶה לָהֶם כֵּרָה גְדוֹלָה
  choice: Il leur prépara donc un grand festin
  rationale: Le verbe כרה associé au nom apparenté כֵּרָה constitue une tournure idiomatique désignant la préparation d’un repas copieux. « Grand festin » conserve l’intensité de גְדוֹלָה dans un français naturel.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: Après qu’ils eurent mangé et bu
  rationale: La subordination explicite naturellement en français la succession narrative des actions, sans modifier leur rapport temporel.
- source_word: וַיְשַׁלְּחֵם
  choice: il les laissa partir
  rationale: Dans ce contexte de captifs épargnés puis libérés, cette formulation rend naturellement שׁלח, tout en évitant de suggérer qu’ils furent envoyés en mission.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: auprès de leur maître
  rationale: La forme אֲדֹנֵי est morphologiquement construite avec un suffixe pluriel, mais désigne vraisemblablement ici un seul souverain, le roi d’Aram. « Maître » maintient le rapport d’autorité sans connotation divine.
- source_word: וְלֹא יָסְפוּ עוֹד ... לָבוֹא
  choice: ne revinrent plus
  rationale: La combinaison יסף, עוד et l’infinitif לבוא exprime la cessation de visites répétées. « Ne revinrent plus » est idiomatique et conserve cette valeur.
- source_word: גְּדוּדֵי אֲרָם
  choice: les bandes de pillards d’Aram
  rationale: גְּדוּדֵי désigne ici des détachements pratiquant des incursions, plutôt qu’une armée régulière. « Aram » suit le nom hébreu et évite l’anachronisme possible de « Syrie ».
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: dans le pays d’Israël
  rationale: Avec le verbe de mouvement לבוא, « revenir dans » exprime l’entrée sur le territoire, tandis que « pays d’Israël » rend אֶרֶץ יִשְׂרָאֵל de façon claire et digne.
