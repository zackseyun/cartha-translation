  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: fr
  text: 'Il dit : « N’aie pas peur, car ceux qui sont avec nous sont plus nombreux que ceux qui sont avec eux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Le verbe אמר signifie littéralement « dire ». Dans ce dialogue, « il répondit » rend naturellement la fonction narrative du waw consécutif et le lien avec les paroles précédentes, sans modifier le contenu de la réplique.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: אַל suivi de l’imparfait exprime ici une défense adressée à un homme au singulier. Cette formulation est naturelle en français moderne et conserve la valeur émotionnelle de ירא.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de ne pas avoir peur. « Car » convient au ton explicatif et digne du discours direct.
- source_word: רַבִּים
  choice: sont plus nombreux
  rationale: Bien que רַבִּים signifie formellement « nombreux », la construction comparative introduite par מֵאֲשֶׁר appelle en français « plus nombreux que ».
- source_word: אֲשֶׁר אִתָּנוּ
  choice: ceux qui sont avec nous
  rationale: La proposition relative employée substantivement désigne un groupe sans en préciser l’identité, comme dans l’hébreu.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: que ceux qui sont avec eux
  rationale: מִן marque la comparaison. Le second membre est elliptique en hébreu ; répéter « ceux qui sont avec » restitue en français le parallélisme implicite avec אִתָּנוּ.
theological_decisions:
- issue: Identité de ceux qui sont « avec nous »
  choice: Leur identité reste implicite.
  alternative: Les désigner explicitement comme l’armée céleste ou des anges.
  rationale: Ce verset ne nomme pas cette force, même si la suite du récit la révèle. La traduction conserve donc la retenue et la tension narrative du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse hébraïque masculine singulière. Aucun marqueur de note n’est nécessaire, puisque la formulation comparative française rend directement le sens de la construction hébraïque.
