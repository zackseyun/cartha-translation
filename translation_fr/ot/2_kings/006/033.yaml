  source_fidelity: 'Le sens général est fidèle au TM : l’action de parole est en cours, le messager humain arrive en descendant, le malheur est attribué à Yahweh dans les paroles rapportées, et יחל conserve son sens d’attendre/espérer. Le pronom sujet de « dit » demeure à juste titre non résolu, comme dans l’hébreu et son contexte narratif.'
  naturalness: « Pourquoi attendrais-je encore Yahweh ? » est grammaticalement possible, mais peu idiomatique en français moderne dans ce sens d’attente confiante ou d’expectative. « Pourquoi devrais-je encore attendre Yahweh ? » rend plus naturellement la question rhétorique בלי introduire un objet interprétatif tel que « son intervention ».
  terminology: « Yahweh », « le messager » et « ce malheur » conviennent au contexte et au registre. La note doit expliciter que l’espérance a Yahweh pour objet/source attendue, afin que l’alternative soit naturelle et sémantiquement complète.
