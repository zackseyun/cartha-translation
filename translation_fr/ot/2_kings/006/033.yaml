base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: fr
  text: 'Pendant qu’il leur parlait encore, voici que le messager descendit vers lui et dit : « Voici, ce malheur vient de Yahweh. Pourquoi devrais-je encore attendre Yahweh[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’aurais-je encore à espérer de Yahweh ? » Le verbe hébreu peut signifier « attendre » ou « espérer ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Pendant qu’il leur parlait encore
  rationale: La tournure rend l’action en cours exprimée par l’adverbe suffixé et le participe, dans un français narratif naturel.
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce contexte, il s’agit de l’émissaire humain envoyé par le roi, et non d’un être céleste.
- source_word: יֹרֵד אֵלָיו
  choice: descendit vers lui
  rationale: Le verbe indique un déplacement vers le bas en direction d’Élisée. Le passé simple convient au registre narratif dignifié.
- source_word: הִנֵּה
  choice: voici
  rationale: Le mot apparaît deux fois et garde dans les deux cas sa force de présentation et d’insistance.
- source_word: זֹאת הָרָעָה
  choice: ce malheur
  rationale: Dans le contexte du siège et de la famine, רָעָה désigne la calamité présente. « Malheur » reste accusateur sans suggérer que Yahweh serait la source du mal moral.
- source_word: מֵאֵת יְהוָה
  choice: vient de Yahweh
  rationale: La préposition présente Yahweh comme la source de la calamité selon les paroles du locuteur; le nom divin est translittéré.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: Pourquoi attendrais-je encore Yahweh ?
  rationale: יחל peut exprimer l’attente aussi bien que l’espérance. « Attendre » rend directement l’exaspération du locuteur, tandis que l’autre nuance est conservée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve ici le nom divin personnel.
- issue: Sens de יחל dans la plainte
  choice: attendre Yahweh
  alternative: espérer en Yahweh / espérer quelque chose de Yahweh
  rationale: Le verbe réunit les idées d’attente et d’espérance. Le texte principal retient l’attente sans supprimer l’autre lecture, signalée en note.
- issue: Attribution du malheur à Yahweh
  choice: ce malheur vient de Yahweh
  alternative: ce mal est de Yahweh
  rationale: La formulation conserve l’accusation explicite du locuteur sans l’élargir au problème abstrait de l’origine du mal moral.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la tenue narrative; « voici » conserve l’insistance de l’hébreu sans recourir à l’archaïsme « voici que… et voici » de manière excessive.
