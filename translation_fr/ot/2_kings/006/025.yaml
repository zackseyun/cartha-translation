base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: fr
  text: Il y eut une grande famine à Samarie. Or la ville était assiégée, au point qu’une tête d’âne coûtait quatre-vingts pièces d’argent, et qu’un quart de qab de fiente de colombes[a] coûtait cinq pièces d’argent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fiente de colombes » (ou « de pigeons »). Certains comprennent l’expression au sens propre; d’autres y voient le nom d’un aliment bon marché ou d’un produit végétal vendu pendant la famine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: Il y eut une grande famine
  rationale: La formule narrative introduit une nouvelle circonstance; « Il y eut » est naturel et digne, tandis que « grande famine » conserve directement l’intensité de l’hébreu.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Pour une ville, le français idiomatique emploie « à ».
- source_word: וְהִנֵּה צָרִים עָלֶיהָ
  choice: Or la ville était assiégée
  rationale: « Or » marque la circonstance remarquable signalée par וְהִנֵּה sans l’archaïsme de « voici »; la tournure passive française exprime naturellement le siège en cours et explicite que le pronom féminin renvoie à la ville.
- source_word: עַד הֱיוֹת
  choice: au point que ... coûtait
  rationale: La construction indique ici le résultat extrême du siège; « au point que » rend clairement ce rapport en français.
- source_word: רֹאשׁ חֲמוֹר
  choice: une tête d’âne
  rationale: Traduction directe de la chaîne construite, qui conserve l’image choquante de la disette.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: quatre-vingts pièces d’argent
  rationale: L’hébreu ne nomme pas explicitement l’unité monétaire; « pièces d’argent » évite donc de préciser indûment « sicles ».
- source_word: רֹבַע הַקַּב
  choice: un quart de qab
  rationale: « Quart » traduit רֹבַע et « qab » conserve l’ancienne unité de capacité sans imposer une conversion moderne incertaine.
- source_word: חרי יונים
  choice: fiente de colombes
  rationale: Le sens lexical direct désigne des excréments de colombes. La traduction principale le conserve, tandis que la note signale l’interprétation débattue comme nom d’un aliment bon marché ou d’un produit végétal.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: cinq pièces d’argent
  rationale: La valeur verbale de « coûtait » se prolonge naturellement dans la seconde proposition; l’ellipse évite une répétition lourde tout en conservant le parallèle des deux prix.
