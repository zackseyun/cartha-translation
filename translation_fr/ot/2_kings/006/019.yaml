base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: fr
  text: 'Élisée leur dit : « Ce n’est pas le chemin, et ce n’est pas la ville. Suivez-moi[a], et je vous conduirai auprès de l’homme que vous cherchez. » Puis il les conduisit à Samarie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Allez derrière moi. »'
    reason: Alternative lexicale signalant la forme concrète de l’expression hébraïque derrière le français idiomatique « Suivez-moi ».
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: le chemin
  rationale: דֶּרֶךְ désigne couramment un chemin, une route ou une voie. « Le chemin » conserve l’article défini et la portée concrète sans préciser davantage que l’hébreu.
- source_word: הָעִיר
  choice: la ville
  rationale: עִיר est le terme ordinaire pour une ville. L’article défini et le parallélisme avec « le chemin » sont préservés.
- source_word: לְכוּ אַחֲרַי
  choice: Suivez-moi
  rationale: Littéralement « allez derrière moi ». « Suivez-moi » exprime naturellement en français l’impératif et le déplacement demandé.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: et je vous conduirai
  rationale: La forme causative de הלך signifie ici faire aller, mener ou conduire. Le futur français convient à la promesse qui suit l’impératif.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: אִישׁ signifie normalement « homme ». Ce choix conserve la référence masculine singulière et l’ironie narrative, puisque l’homme recherché est Élisée lui-même.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: que vous cherchez
  rationale: בקשׁ signifie « chercher ». Le présent français rend naturellement leur recherche en cours sans surinterpréter l’aspect verbal.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: Puis il les conduisit
  rationale: La même forme causative de הלך décrit l’accomplissement de ce qu’Élisée vient d’annoncer. « Conduisit » maintient la cohérence lexicale; « puis » marque naturellement la progression narrative.
- source_word: שֹׁמְרוֹנָה
  choice: à Samarie
  rationale: Le hé directionnel indique un mouvement vers Samarie, exprimé normalement en français par « à Samarie » après « conduire ».
theological_decisions:
- issue: La déclaration trompeuse d’Élisée aux Araméens
  choice: 'Rendre directement : « Ce n’est pas le chemin, et ce n’est pas la ville. »'
  alternative: Paraphraser de manière à qualifier explicitement les paroles de mensonge, ou à les présenter comme une vérité partielle.
  rationale: Le récit donne ces paroles sans commentaire moral explicite. La traduction en conserve donc la formulation simple et laisse au lecteur l’évaluation éthique et théologique, sans atténuation ni condamnation ajoutée.
translation_notes:
  register: Français international moderne, sobre et digne. Le discours direct reste proche de la structure hébraïque; les verbes narratifs au passé simple conviennent au registre biblique littéraire sans être archaïques.
