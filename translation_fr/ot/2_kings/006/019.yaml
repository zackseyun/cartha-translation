  source_fidelity: 'Le texte rend fidèlement la structure et le sens de l’hébreu : les deux négations déictiques, l’impératif, la référence indirecte à « l’homme » recherché et le déplacement final vers Samarie sont préservés. Toutefois, « je vous conduirai vers l’homme » peut suggérer seulement une direction; l’hébreu אֶל exprime ici la destination. « je vous conduirai auprès de l’homme » rend plus exactement l’aboutissement sans expliciter l’ironie narrative.'
  naturalness: Le français est naturel, sobre et adapté à un registre biblique moderne. Le passé simple narratif (« dit », « conduisit ») convient. « Auprès de l’homme » est idiomatique après « conduire » et plus précis que « vers l’homme » dans ce contexte.
  terminology: 'Les noms et termes sont cohérents : « Élisée », « chemin », « ville », « homme » et « Samarie » conviennent. « Suivez-moi » est le meilleur équivalent idiomatique de לְכוּ אַחֲרַי; la note conserve utilement le tour concret de l’hébreu.'
