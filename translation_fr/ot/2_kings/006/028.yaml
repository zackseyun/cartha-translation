  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: fr
  text: 'Le roi lui demanda : « Qu’as-tu ? » Elle répondit : « Cette femme m’a dit : “Donne ton fils, et nous le mangerons aujourd’hui ; demain, nous mangerons le mien.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָךְ
  choice: Qu’as-tu ?
  rationale: Expression française naturelle et concise qui rend directement la question idiomatique hébraïque adressée à la femme.
- source_word: וְנֹאכְלֶנּוּ
  choice: et nous le mangerons
  rationale: Conserve le pluriel inclusif et le pronom masculin singulier renvoyant au fils, sans atténuer la dureté du récit.
- source_word: וְאֶת־בְּנִי נֹאכַל מָחָר
  choice: demain, nous mangerons le mien
  rationale: « Le mien » évite une répétition lourde en français tout en ayant pour antécédent explicite « ton fils » et en gardant l’accord proposé.
theological_decisions:
- issue: Violence extrême et cannibalisme pendant le siège
  choice: Traduction explicite et non euphémisée
  alternative: Employer une formulation indirecte ou atténuée
  rationale: Le texte hébreu décrit sans détour l’horreur de la situation ; la traduction doit préserver cette force narrative et théologique sans ajouter de commentaire.
translation_notes:
