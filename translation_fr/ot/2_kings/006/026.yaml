source:
  edition: WLC
  text: וַֽ/יְהִי֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל עֹבֵ֖ר עַל הַ/חֹמָ֑ה וְ/אִשָּׁ֗ה צָעֲקָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר הוֹשִׁ֖יעָ/ה אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/026.yaml
  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: fr
  text: 'Comme le roi d’Israël passait sur la muraille, une femme lui cria : « Au secours, mon seigneur le roi ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sauve-moi, mon seigneur le roi ! » Le verbe hébreu signifie littéralement « sauver », mais il exprime ici une demande pressante d’aide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי … עֹבֵר
  choice: Comme … passait
  rationale: La combinaison de וַיְהִי avec le participe עֹבֵר présente une action en cours servant de cadre au récit. « Comme … passait » restitue naturellement cette valeur circonstancielle en français.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Traduction directe de la chaîne construite, avec la détermination requise par le contexte narratif.
- source_word: עַל הַחֹמָה
  choice: sur la muraille
  rationale: עַל indique ici que le roi se déplace sur l’ouvrage défensif de la ville. « Muraille » convient mieux que « mur » à ce contexte de siège.
- source_word: וְאִשָּׁה צָעֲקָה אֵלָיו
  choice: une femme lui cria
  rationale: צעק exprime un cri fort et pressant. La construction française « lui cria » est concise, naturelle et conserve l’urgence de l’appel.
- source_word: לֵאמֹר
  choice: — introduction directe de la citation
  rationale: Le français n’a pas besoin de traduire explicitement le quotatif hébreu par « en disant » après « cria » ; les deux-points en rendent naturellement la fonction.
- source_word: הוֹשִׁיעָה
  choice: Au secours
  rationale: L’impératif de ישׁע signifie littéralement « sauve », mais fonctionne ici comme une demande urgente d’intervention adressée au roi. « Au secours » rend idiomatiquement cette supplication sans en préciser excessivement la nature.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette formulation conserve le respect de אֲדֹנִי et l’apposition royale הַמֶּלֶךְ, dans un registre digne et intelligible.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide sans archaïsme ; « muraille » précise le cadre urbain et militaire, tandis que « Au secours » traduit l’urgence de l’impératif hébreu.
