  text: וַ/יֹּ֗אמֶר לְכ֤וּ וּ/רְאוּ֙ אֵיכֹ֣ה ה֔וּא וְ/אֶשְׁלַ֖ח וְ/אֶקָּחֵ֑/הוּ וַ/יֻּגַּד ל֥/וֹ לֵ/אמֹ֖ר הִנֵּ֥ה בְ/דֹתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: fr
  text: 'Il dit : « Allez voir où il se trouve, afin que j’envoie des hommes le saisir. » On lui fit ce rapport : « Il est à Dotân.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dotân était une ville située au nord de Samarie. Elle est aussi mentionnée dans le récit de Joseph (Genèse 37.17).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol poursuit le récit. Le passé simple convient au registre narratif français et n’ajoute aucune nuance temporelle étrangère au texte.
- source_word: לְכוּ וּרְאוּ אֵיכֹה הוּא
  choice: Allez voir où il se trouve
  rationale: Les deux impératifs pluriels sont conservés. « Il se trouve » exprime naturellement la localisation demandée sans transformer explicitement l’enquête en ordre de le retrouver.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: afin que j’envoie des hommes le saisir
  rationale: La suite verbale exprime vraisemblablement le but de la recherche. Le complément « des hommes », implicite après « envoyer » en contexte, rend la phrase idiomatique en français; « saisir » restitue ici la valeur hostile de לקח.
- source_word: וַיֻּגַּד לוֹ לֵאמֹר
  choice: On lui fit ce rapport
  rationale: Cette tournure française conserve l’idée passive d’une information communiquée au roi, tout en évitant le lourd calque « il lui fut rapporté, disant ».
- source_word: הִנֵּה
  choice: Il est
  rationale: Dans la réponse, הִנֵּה présente l’information nouvelle. Le français moderne n’exige pas ici un équivalent autonome tel que « voici » ou « voyez ».
- source_word: בְדֹתָן
  choice: à Dotân
  rationale: La préposition ב est locative. Pour une ville, le français emploie naturellement « à »; la graphie « Dotân » représente le nom propre hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. La formulation évite les calques hébraïques peu naturels tout en gardant les impératifs, le rapport officiel et le but hostile de l’envoi.
