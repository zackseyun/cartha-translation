id: 2KI.6.15
reference: 2 Kings 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: fr
  text: 'Le serviteur de l’homme de Dieu se leva de bon matin et sortit. Et voici qu’une armée, avec des chevaux et des chars, entourait la ville. Son jeune serviteur[a] lui dit : « Hélas, mon maître ! Qu’allons-nous faire ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner un jeune homme, un serviteur ou un assistant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: se leva de bon matin
  rationale: Cette expression française naturelle rend l’idée de se lever tôt portée par le hifil de שׁכם, tandis que לָקוּם complète l’action de se lever.
- source_word: מְשָׁרֵת אִישׁ הָאֱלֹהִים
  choice: le serviteur de l’homme de Dieu
  rationale: « Serviteur » convient au rôle personnel de l’homme, et « homme de Dieu » conserve le titre prophétique traditionnel et ses résonances bibliques.
- source_word: וַיֵּצֵא
  choice: et sortit
  rationale: Le verbe décrit simplement le passage de l’intérieur vers l’extérieur; « sortit » est précis et idiomatique.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure conserve l’effet de découverte soudaine et la vivacité du marqueur hébreu.
- source_word: חַיִל
  choice: une armée
  rationale: Dans ce contexte de siège accompagné de chevaux et de chars, le mot désigne clairement une force militaire.
- source_word: סוֹבֵב
  choice: entourait
  rationale: L’imparfait rend l’état ou l’action en cours exprimé par le participe au moment où le serviteur découvre la scène.
- source_word: וְסוּס וָרָכֶב
  choice: avec des chevaux et des chars
  rationale: La préposition « avec » explicite naturellement en français les moyens militaires associés à l’armée, sans modifier le sens.
- source_word: נַעֲרוֹ
  choice: son jeune serviteur
  rationale: Cette formulation conserve à la fois la nuance d’âge et la fonction de service que peut exprimer נַעַר dans ce contexte.
- source_word: אֲהָהּ
  choice: Hélas
  rationale: L’interjection française exprime l’effroi et la détresse du locuteur dans un registre digne.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Il s’agit ici d’une adresse respectueuse à un supérieur humain, et non d’un titre divin.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: Qu’allons-nous faire ?
  rationale: Cette question idiomatique rend directement l’angoisse et la délibération exprimées par l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La construction « Et voici que » maintient la soudaineté de la découverte, tandis que le dialogue reste naturel et immédiatement compréhensible.
