revisions:
- from: 'Élisée était assis dans sa maison, et les anciens étaient assis avec lui. Le roi avait envoyé un homme devant lui, mais avant que le messager arrive auprès d’Élisée, celui-ci dit aux anciens : « Voyez-vous que ce fils d’assassin a envoyé quelqu’un pour m’ôter la tête[a] ? Attention ! Quand le messager arrivera, fermez la porte et retenez-le contre la porte. N’entend-on pas derrière lui le bruit des pas de son maître ? »[b]'
  to: 'Élisée était assis dans sa maison, et les anciens étaient assis avec lui. Le roi avait envoyé un homme devant lui, mais avant que le messager[b] n’arrive auprès d’Élisée, celui-ci dit aux anciens : « Voyez-vous que ce fils de meurtrier a envoyé quelqu’un pour m’ôter la tête[a] ? Attention ! Quand le messager arrivera, fermez la porte et retenez-le à la porte. N’entend-on pas derrière lui le bruit des pas de son maître ? »'
  rationale: La révision corrige le subjonctif requis après « avant que », emploie « meurtrier » pour correspondre au lexique hébreu sans interprétation historique ajoutée, et améliore légèrement l’idiomaticité de l’ordre donné au seuil. La note culturelle est ancrée au terme qu’elle explique.
