  text: וֶ/אֱלִישָׁע֙ יֹשֵׁ֣ב בְּ/בֵית֔/וֹ וְ/הַ/זְּקֵנִ֖ים יֹשְׁבִ֣ים אִתּ֑/וֹ וַ/יִּשְׁלַ֨ח אִ֜ישׁ מִ/לְּ/פָנָ֗י/ו בְּ/טֶ֣רֶם יָבֹא֩ הַ/מַּלְאָ֨ךְ אֵלָ֜י/ו וְ/ה֣וּא אָמַ֣ר אֶל הַ/זְּקֵנִ֗ים הַ/רְּאִיתֶם֙ כִּֽי שָׁלַ֞ח בֶּן הַֽ/מְרַצֵּ֤חַ הַ/זֶּה֙ לְ/הָסִ֣יר אֶת רֹאשִׁ֔/י רְא֣וּ כְּ/בֹ֣א הַ/מַּלְאָ֗ךְ סִגְר֤וּ הַ/דֶּ֨לֶת֙ וּ/לְחַצְתֶּ֤ם אֹת/וֹ֙ בַּ/דֶּ֔לֶת הֲ/ל֗וֹא ק֛וֹל רַגְלֵ֥י אֲדֹנָ֖י/ו אַחֲרָֽי/ו׀־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: fr
  text: 'Élisée était assis dans sa maison, et les anciens étaient assis avec lui. Le roi avait envoyé un homme devant lui, mais avant que le messager[b] n’arrive auprès d’Élisée, celui-ci dit aux anciens : « Voyez-vous que ce fils de meurtrier a envoyé quelqu’un pour m’ôter la tête[a] ? Attention ! Quand le messager arrivera, fermez la porte et retenez-le à la porte. N’entend-on pas derrière lui le bruit des pas de son maître ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour enlever ma tête » ; il s’agit de le faire exécuter par décapitation.'
    reason: lexical_alternative
  - marker: b
    text: Le « messager » est ici un envoyé humain du roi, et « son maître » désigne le roi qui le suit.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: était assis / étaient assis
  rationale: Les participes installent une scène en cours; l’imparfait français en rend naturellement la valeur durative.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: Le roi avait envoyé un homme devant lui
  rationale: Le contexte antérieur identifie le roi comme sujet. Le plus-que-parfait clarifie que l’envoi précède l’arrivée évoquée ensuite, tandis que « devant lui » conserve la possibilité que le roi suive l’homme.
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce contexte royal, מַלְאָךְ désigne un envoyé humain et non un ange.
- source_word: הֲרְאִיתֶם
  choice: Voyez-vous
  rationale: La question rhétorique appelle les anciens à reconnaître l’intention meurtrière du roi.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: ce fils d’assassin
  rationale: Cette formulation conserve l’injure hébraïque et son allusion probable à la culpabilité meurtrière de la maison royale, sans l’expliciter dans le texte.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: pour m’ôter la tête
  rationale: La tournure reste proche de l’idiome hébreu tout en étant intelligible en français; une note en précise le sens d’exécution par décapitation.
- source_word: רְאוּ
  choice: Attention !
  rationale: L’impératif introduit ici une consigne urgente plutôt qu’un ordre de regarder matériellement.
- source_word: סִגְרוּ הַדֶּלֶת
  choice: fermez la porte
  rationale: Rendu français direct et naturel de l’ordre défensif.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: retenez-le contre la porte
  rationale: לחץ exprime l’action de presser ou contenir l’homme à la porte afin de l’empêcher d’entrer; cette traduction préserve l’image sans surdéterminer le geste.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: N’entend-on pas derrière lui le bruit des pas de son maître ?
  rationale: Le français explicite naturellement la perception auditive sous-entendue et conserve l’idée que le maître du messager le suit de près.
theological_decisions:
- issue: Identification du sujet implicite de וַיִּשְׁלַח
  choice: Le roi avait envoyé
  alternative: Il avait envoyé
  rationale: Le contexte immédiat désigne le roi d’Israël comme sujet; le nommer évite en français une ambiguïté référentielle sans ajouter une nouvelle identification.
- issue: Référent de אֲדֹנָיו (« son maître »)
  choice: Conserver « son maître » dans le texte et identifier le roi en note
  alternative: les pas du roi
  rationale: Le texte hébreu emploie une relation de maîtrise plutôt que le titre royal; la traduction la préserve, tandis que la note fournit la référence contextuelle.
- issue: Portée de « fils d’assassin »
  choice: Conserver l’expression sans identifier explicitement l’assassin
  alternative: fils d’Achab, l’assassin
  rationale: L’expression est injurieuse et probablement dynastique, mais le verset ne nomme pas le père; l’ambiguïté historique ne doit pas être résolue dans le corps du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions de « assis » et « porte » sont maintenues parce qu’elles structurent la scène hébraïque. Les référents pronominaux ont été légèrement clarifiés par « auprès d’Élisée » et « celui-ci » afin d’éviter une confusion naturelle en français.
