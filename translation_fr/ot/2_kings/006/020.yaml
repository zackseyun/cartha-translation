language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֮ כְּ/בֹאָ֣/ם שֹׁמְרוֹן֒ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע יְהוָ֕ה פְּקַ֥ח אֶת עֵינֵֽי אֵ֖לֶּה וְ/יִרְא֑וּ וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵ֣ינֵי/הֶ֔ם וַ/יִּרְא֕וּ וְ/הִנֵּ֖ה בְּ/ת֥וֹךְ שֹׁמְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: fr
  text: 'Quand ils furent entrés dans Samarie, Élisée dit : « Yahweh, ouvre les yeux de ces hommes[a], afin qu’ils voient. » Yahweh leur ouvrit les yeux, et ils virent : ils étaient là, au milieu de Samarie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux-ci » ; « hommes » est explicité pour désigner les soldats araméens.'
    reason: Précision lexicale concernant l’ajout nécessaire à la fluidité du français.
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: Quand ils furent entrés
  rationale: La construction narrative introduit le moment où leur arrivée dans la ville est accomplie. Cette formulation restitue naturellement la valeur temporelle sans conserver le « il arriva » hébraïque, peu naturel ici en français.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom propre. Dans ce contexte, il s’agit de la ville fortifiée plutôt que de la région ; « dans Samarie » fait ressortir leur entrée à l’intérieur de la ville.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le tétragramme, nom personnel du Dieu d’Israël. La translittération « Yahweh » le distingue d’un titre tel que « le Seigneur ».
- source_word: פְּקַח ... אֶת עֵינֵי
  choice: ouvre les yeux
  rationale: L’expression concrète de l’hébreu est conservée. Dans le contexte, elle désigne la suppression de l’aveuglement ou du défaut de perception imposé par Dieu.
- source_word: אֵלֶּה
  choice: ces hommes
  rationale: Le démonstratif signifie littéralement « ceux-ci ». Le nom « hommes » est explicité en français pour identifier naturellement les soldats araméens visés, sans modifier le référent.
- source_word: וְיִרְאוּ
  choice: afin qu’ils voient
  rationale: Après l’impératif, le verbe exprime ici le but recherché par la prière d’Élisée. « Afin que » convient au registre digne du passage.
- source_word: וַיִּפְקַח יְהוָה אֶת עֵינֵיהֶם
  choice: Yahweh leur ouvrit les yeux
  rationale: Le pronom indirect produit une tournure française naturelle tout en conservant l’image hébraïque et en présentant l’action comme l’exaucement immédiat de la prière.
- source_word: וַיִּרְאוּ
  choice: et ils virent
  rationale: Le verbe concret « voir » est maintenu plutôt que remplacé par « comprendre » ou « se rendre compte », ce qui préserve l’écho verbal avec la prière précédente.
- source_word: וְהִנֵּה בְּתוֹךְ שֹׁמְרוֹן
  choice: ils étaient là, au milieu de Samarie
  rationale: « Là » rend la fonction présentative et saisissante de וְהִנֵּה, tandis que « au milieu de » conserve le sens spatial et dramatique de בְּתוֹךְ.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin lui-même et non le titre אֲדֹנָי. Le conserver sous la forme « Yahweh » respecte cette distinction textuelle.
- issue: Nature de l’ouverture des yeux
  choice: Conserver l’image « ouvrir les yeux » sans préciser s’il s’agit de vision physique ou de perception surnaturelle
  alternative: leur rendre la vue
  rationale: Le contexte implique une action divine sur leur capacité de voir ou de reconnaître leur environnement, mais le verset ne définit pas davantage son mécanisme. La formulation littérale préserve cette marge d’interprétation.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique soutenu sans être archaïque. La répétition de « yeux » et de « voir » est volontaire, car elle reproduit la structure et l’insistance du texte hébreu.
