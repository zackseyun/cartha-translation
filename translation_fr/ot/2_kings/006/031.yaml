base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: fr
  text: 'Il dit : « Que Dieu me fasse ceci, et plus encore, si la tête d’Élisée, fils de Shaphath, reste aujourd’hui sur son corps[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si la tête d’Élisée, fils de Shaphath, se tient aujourd’hui sur lui », c’est-à-dire si elle reste attachée à son corps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: Que Dieu me traite avec la plus grande sévérité
  rationale: Cette formule hébraïque fixe est un serment imprécatoire elliptique. La formulation française exprime naturellement sa force sans inventer le châtiment laissé implicite dans l’original.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le mot désigne ici Dieu au singulier dans une formule de serment.
- source_word: אִם
  choice: si
  rationale: Dans ce serment, אִם introduit la condition dont la réalisation ferait retomber la malédiction sur celui qui parle. « Si » conserve la structure et la tension de l’hébreu.
- source_word: יַעֲמֹד
  choice: reste
  rationale: Le sens premier est « se tenir », mais, avec « tête » pour sujet, le verbe indique ici qu’elle demeure attachée au corps.
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: la tête d’Élisée, fils de Shafath
  rationale: Cette formulation conserve l’image brutale et la construction nominale de l’hébreu tout en restant naturelle en français.
- source_word: עָלָיו
  choice: sur ses épaules
  rationale: Littéralement « sur lui ». L’expression française rend clairement la menace de décapitation; la formulation plus littérale est signalée en note.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Ce choix naturel en français conserve l’urgence temporelle du serment.
theological_decisions:
- issue: Nature et portée de la formule de serment
  choice: Un serment imprécatoire par lequel le locuteur appelle sur lui un châtiment divin si Élisée n’est pas décapité ce jour-là.
  alternative: Une simple exclamation de colère sans pleine valeur de serment.
  rationale: La formule « Ainsi Dieu me fasse, et ainsi il ajoute » est une formule biblique conventionnelle de serment et doit garder sa force solennelle.
translation_notes:
  register: Français international moderne, digne et direct. La formule de serment est rendue idiomatiquement, tandis que la note conserve l’image et la syntaxe elliptiques de l’hébreu.
