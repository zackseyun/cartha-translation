  rationale: La révision corrige le rendu de הַגּוֹי הַזֶּה en conservant son singulier collectif et ajuste la première proposition afin de mieux suivre la progression narrative de l’hébreu. Elle maintient la note nécessaire sur סַנְוֵרִים et ne résout pas au-delà du texte la nature précise de l’atteinte visuelle.
