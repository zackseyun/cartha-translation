  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: fr
  text: 'Lorsqu’ils descendirent vers lui, Élisée pria Yahweh et dit : « Je t’en prie, frappe cette nation d’aveuglement[a]. » Alors Yahweh les frappa d’aveuglement, conformément à la parole d’Élisée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une confusion aveuglante ». Le terme hébreu peut désigner une atteinte visuelle provoquée par Dieu, qui empêche de percevoir correctement, sans impliquer nécessairement une cécité totale ou permanente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: Comme ils descendaient vers lui
  rationale: ירד exprime le mouvement de descente, et אֶל indique ici l’approche vers Élisée. Le contexte rend manifeste l’intention hostile sans qu’il soit nécessaire de l’ajouter au texte.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: Élisée pria Yahweh
  rationale: התפלל est le verbe courant pour « prier »; le nom divin יהוה est translittéré « Yahweh ».
- source_word: הַךְ נָא
  choice: Je t’en prie, frappe
  rationale: נכה signifie ici « frapper » et נא donne à l’impératif la nuance d’une requête pressante et respectueuse.
- source_word: הַגּוֹי הַזֶּה
  choice: ces gens
  rationale: גוי peut désigner un peuple ou un groupe humain. Dans ce contexte, il s’agit de la troupe araméenne présente; « ces gens » est naturel en français et évite de suggérer que toute la nation est physiquement sur place.
- source_word: בַּסַּנְוֵרִים
  choice: d’aveuglement
  rationale: סנורים désigne une incapacité visuelle infligée par Dieu. « Aveuglement » conserve le sens principal tout en permettant la nuance d’une perception visuelle profondément troublée.
- source_word: וַיַּכֵּם
  choice: Et Yahweh les frappa
  rationale: Le sujet implicite est Yahweh, qui répond à la prière. Répéter son nom en français lève toute ambiguïté possible avec Élisée.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: conformément à la parole d’Élisée
  rationale: דבר signifie « parole » ou « déclaration ». La formulation conserve l’idiome hébreu et souligne que l’action divine correspond à la demande d’Élisée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » conserve le nom divin personnel au lieu de le remplacer par un titre.
- issue: Nature de l’atteinte exprimée par סנורים
  choice: aveuglement, avec précision en note
  alternative: confusion aveuglante
  rationale: Le terme décrit une atteinte divine de la perception visuelle, mais n’impose pas nécessairement une cécité totale ou permanente. Le texte principal garde le rendu transparent, tandis que la note préserve l’étendue sémantique.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait après « comme » rend la circonstance concomitante; « Je t’en prie » restitue naturellement la particule de supplication נא. La répétition de « Yahweh » clarifie le sujet implicite du verbe hébreu.
