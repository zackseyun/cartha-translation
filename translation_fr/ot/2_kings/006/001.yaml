  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: fr
  text: 'Les fils des prophètes dirent à Élisée[a] : « Regarde, s’il te plaît : l’endroit où nous habitons auprès de toi[b] est trop étroit pour nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les disciples » ou « la communauté des prophètes ». L’expression hébraïque « fils des prophètes » désigne vraisemblablement une communauté prophétique placée sous instruction ou supervision.
    reason: lexical_alternative
  - marker: b
    text: Ou « devant toi » ou « en ta présence ». L’expression peut évoquer la proximité d’Élisée ou le fait que cette communauté vivait sous sa supervision.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: les fils des prophètes
  rationale: Cette traduction formellement transparente conserve l’expression hébraïque, qui désigne vraisemblablement les membres d’une communauté prophétique sans préciser excessivement la nature de leur relation.
- source_word: הִנֵּה נָא
  choice: Vois, s’il te plaît
  rationale: « Vois » attire l’attention sur la situation, tandis que « s’il te plaît » rend la nuance d’insistance polie de נָא.
- source_word: הַמָּקוֹם
  choice: l’endroit
  rationale: Le terme reste général et peut désigner le lieu où la communauté habite ou se réunit, sans imposer un type de bâtiment.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: où nous habitons auprès de toi
  rationale: יָשַׁב a ici naturellement le sens d’« habiter ». « Auprès de toi » conserve l’idée de proximité ou de présence liée à לְפָנֶיךָ, sans trancher entre proximité physique et encadrement par Élisée; שָׁם est naturellement intégré au relatif de lieu en français.
- source_word: צַר מִמֶּנּוּ
  choice: est trop étroit pour nous
  rationale: « Trop étroit » rend directement l’idée spatiale de צַר et exprime clairement que le lieu ne suffit plus à la communauté.
- source_word: וַיֹּאמְרוּ
  choice: dirent
  rationale: Le passé simple convient au registre narratif biblique français et le contexte assure la progression du récit sans qu’il soit nécessaire d’ajouter un marqueur comme « alors ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « fils des prophètes » préserve l’idiome hébraïque; « auprès de toi » maintient l’ambiguïté entre présence physique et relation de supervision sans alourdir le verset d’une note.
