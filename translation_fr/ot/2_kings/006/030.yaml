base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: fr
  text: Lorsque le roi entendit les paroles de la femme, il déchira ses vêtements tandis qu’il passait sur la muraille. Le peuple vit, et voici qu’il portait une toile de sac à même la peau, sous ses vêtements[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’intérieur » ; l’expression indique que la toile de sac était portée sous les vêtements extérieurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: Lorsque le roi entendit
  rationale: L’infinitif construit précédé de כ introduit une proposition temporelle. « Lorsque… entendit » rend naturellement la succession narrative.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: les paroles de la femme
  rationale: דְּבָרִים peut désigner des paroles, une affaire ou un récit. Ici, il renvoie directement à ce que la femme vient de dire.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: il déchira ses vêtements
  rationale: Cette expression décrit le geste conventionnel de détresse ou d’horreur sans en expliciter davantage la signification.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: tandis qu’il passait sur la muraille
  rationale: La proposition circonstancielle situe l’action pendant le déplacement du roi sur la muraille; « sur » conserve la formulation spatiale du texte.
- source_word: וַיַּרְא הָעָם
  choice: Le peuple regarda
  rationale: ראה signifie habituellement « voir », mais ici « regarda » s’enchaîne naturellement avec וְהִנֵּה et attire l’attention sur le détail soudainement aperçu.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette formule conserve la fonction de הִנֵּה, qui attire l’attention sur une découverte frappante.
- source_word: הַשַּׂק
  choice: une toile de sac
  rationale: Le nom désigne ici la matière ou le vêtement grossier porté en signe de deuil. « Toile de sac » est clair en français moderne.
- source_word: עַל־בְּשָׂרוֹ
  choice: à même la peau
  rationale: Littéralement « sur sa chair ». Dans ce contexte vestimentaire, « à même la peau » exprime précisément le contact direct sans lourdeur.
- source_word: מִבָּיִת
  choice: sous ses vêtements
  rationale: L’expression signifie littéralement « de l’intérieur ». Le contexte indique que la toile de sac se trouvait sous les vêtements extérieurs, devenant visible lorsqu’ils furent déchirés.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la structure hébraïque tout en évitant un calque obscur; « et voici que » préserve l’effet de découverte produit par וְהִנֵּה.
