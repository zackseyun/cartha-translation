  source_fidelity: 'La traduction suit fidèlement la syntaxe et le sens général de l’hébreu : circonstance temporelle, déchirure des vêtements, déplacement sur la muraille et découverte du sac sous les vêtements. Toutefois, וַיַּרְא הָעָם signifie directement « le peuple vit » plutôt que « le peuple regarda » ; le verbe français « vit » rend mieux l’aboutissement perceptif exprimé par le texte source.'
  naturalness: Le français est globalement naturel et de registre narratif soutenu. « À même la peau, sous ses vêtements » exprime clairement les deux indications vestimentaires sans être lourd. « Le peuple vit » est plus idiomatique et précis ici que « Le peuple regarda ».
  terminology: « Paroles », « déchira ses vêtements », « muraille » et « toile de sac » conviennent au registre biblique moderne. La note rend utilement le littéral מִבָּיִת (« de l’intérieur ») et son sens contextuel, sans imposer une interprétation doctrinale.
