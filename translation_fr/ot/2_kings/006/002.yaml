  to: '« Allons, je t’en prie, jusqu’au Jourdain. Que chacun de nous prenne de là une poutre, et faisons-nous là un lieu pour y habiter. » Élisée dit : « Allez. »'
  rationale: La révision retire des précisions non nécessaires (« construire », « pourront » et « y » dans l’ordre final), tout en conservant le sens distributif, la demande polie, la destination, la collecte de poutres et le but d’habitation. Elle exprime de façon naturelle les deux indications spatiales de l’hébreu.
