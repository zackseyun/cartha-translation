  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: fr
  text: '« Allons, je t’en prie, jusqu’au Jourdain. Que chacun de nous prenne de là une poutre, et faisons-nous là un lieu pour y habiter. » Élisée dit : « Allez. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: Allons, s’il te plaît
  rationale: Le cohortatif à la première personne du pluriel exprime la proposition « allons », tandis que נָא marque ici une demande polie adressée à Élisée.
- source_word: עַד הַיַּרְדֵּן
  choice: jusqu’au Jourdain
  rationale: עַד indique le terme du déplacement, « jusqu’à » ou « vers ». « Le Jourdain » désigne naturellement le fleuve en français.
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: Que chacun de nous y prenne une poutre
  rationale: La formulation hébraïque, littéralement « prenons de là, chacun une poutre », est distributive. « Chacun de nous » rend clairement que chaque membre du groupe doit prendre une seule pièce de bois.
- source_word: קוֹרָה
  choice: poutre
  rationale: Le nom désigne une grosse pièce de bois destinée à une construction; « poutre » convient mieux au contexte que « tronc ».
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: et construisons-nous là un lieu
  rationale: עשה signifie largement « faire », mais la collecte de poutres rend ici l’idée de construction explicite. « Construisons-nous » exprime aussi le bénéficiaire לָנוּ.
- source_word: לָשֶׁבֶת שָׁם
  choice: où nous pourrons habiter
  rationale: ישב signifie ici demeurer ou habiter. La proposition relative produit un français naturel sans répéter lourdement « là ».
- source_word: וַיֹּאמֶר לֵכוּ
  choice: 'Élisée répondit : « Allez-y. »'
  rationale: Le sujet pronominal renvoie à Élisée dans le contexte immédiat. « Allez-y » rend en français naturel la permission concise exprimée par l’impératif.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et oralement naturel. La répétition hébraïque de שָׁם est allégée sans perte de sens. Le nom d’Élisée, explicité depuis le contexte, évite en français une référence pronominale potentiellement floue.
