base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: fr
  text: Le roi d’Israël envoya donc à l’endroit dont l’homme de Dieu lui avait parlé en le mettant en garde. Il prit là ses précautions[b], et ce ne fut pas une fois ni deux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Autre traduction possible : « Il se tint là sur ses gardes ». L’hébreu peut désigner soit la vigilance du roi, soit les précautions prises à cet endroit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya des hommes
  rationale: Le verbe signifie littéralement « envoya », sans complément d’objet exprimé. Le français exige ici de préciser implicitement ce qui fut envoyé; « des hommes » convient au contexte tout en étant signalé par une note.
- source_word: הַמָּקוֹם
  choice: l’endroit
  rationale: « L’endroit » rend naturellement le nom défini et renvoie à un lieu précis dans le récit.
- source_word: אֲשֶׁר אָמַר לוֹ אִישׁ הָאֱלֹהִים וְהִזְהִירֹה
  choice: dont l’homme de Dieu lui avait parlé en le mettant en garde
  rationale: Cette formulation conserve le titre hébreu « homme de Dieu » et relie naturellement en français la communication du lieu à l’avertissement adressé au roi.
- source_word: וְנִשְׁמַר שָׁם
  choice: Il prit là ses précautions
  rationale: Le niphal de שמר peut exprimer le fait de se garder ou de prendre garde. Cette traduction convient au contexte sans affirmer que le roi se trouvait personnellement sur place.
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: ce ne fut pas une fois ni deux
  rationale: Cette tournure française conserve l’image de l’expression hébraïque et indique que la chose se répéta à plusieurs reprises.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La tournure finale conserve l’idiome hébreu, tandis que les notes signalent les deux principales ambiguïtés du verset.
