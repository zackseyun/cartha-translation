base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: fr
  text: 'Puis Élisée pria en ces termes : « Yahweh, je t’en prie, ouvre-lui les yeux pour qu’il voie. » Yahweh ouvrit les yeux du jeune homme[a], et il vit : voici que la montagne était pleine de chevaux et de chars de feu tout autour d’Élisée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du serviteur ». Le mot hébreu peut désigner un jeune homme ou un serviteur selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: pria
  rationale: Le hitpael de פלל désigne ici une prière adressée à Dieu; « pria » est naturel et précis dans ce récit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: פְּקַח נָא
  choice: je t’en prie, ouvre
  rationale: פקח signifie « ouvrir », notamment les yeux, et נא marque ici une supplication polie plutôt qu’une indication temporelle.
- source_word: וְיִרְאֶה
  choice: pour qu’il voie
  rationale: Cette proposition exprime naturellement en français le but de l’ouverture demandée.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נער peut désigner un jeune homme ou un serviteur. Le corps du texte conserve le sens lexical direct, tandis que la note signale la valeur contextuelle possible.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française attire l’attention sur la découverte soudaine et saisissante, comme le marque הנה.
- source_word: הָהָר מָלֵא
  choice: la montagne était pleine de
  rationale: Traduction directe du nom défini et de l’adjectif prédicatif, dans une formulation française naturelle.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: chevaux et chars de feu
  rationale: La coordination est conservée, et « de feu » qualifie explicitement les chars sans préciser davantage la nature ontologique de la scène.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: tout autour d’Élisée
  rationale: Cette expression rend clairement l’idée d’encerclement portée par סביבות.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; l’Éternel
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » le conserve sous une forme française courante de translittération, sans le remplacer par un titre.
- issue: Nature de ce que voit le jeune homme
  choice: Conserver simplement l’affirmation qu’il voit la montagne pleine de chevaux et de chars de feu
  alternative: Préciser qu’il s’agit d’une armée angélique littérale ou d’une vision purement symbolique
  rationale: Le verset attribue cette perception à l’ouverture des yeux par Yahweh, mais ne définit pas plus précisément le statut métaphysique des chevaux et des chars.
translation_notes:
  register: Français international moderne, narratif et digne. « En ces termes » évite la lourdeur de « pria et dit » tout en conservant l’introduction du discours. « Voici que » maintient la vivacité de הנה sans archaïsme excessif.
