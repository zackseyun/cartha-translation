base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: fr
  text: 'Le cœur du roi d’Aram fut profondément troublé par cette affaire. Il convoqua ses serviteurs et leur dit : « Ne me direz-vous pas lequel des nôtres est du côté du roi d’Israël[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui d’entre nous [est] vers le roi d’Israël ». Cette expression hébraïque concise implique ici qu’une personne soutient ce roi ou agit en sa faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר לֵב
  choice: Le cœur … fut profondément troublé
  rationale: Le verbe évoque une vive agitation intérieure, tandis que לֵב désigne ici le siège des pensées et des émotions. Cette formulation conserve l’image hébraïque du cœur sans réduire l’émotion à la seule colère.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: par cette affaire
  rationale: Dans ce contexte, דָּבָר désigne la situation qui préoccupe le roi. « Affaire » est naturel en français et convient mieux que le littéral « chose ».
- source_word: וַיִּקְרָא אֶל עֲבָדָיו
  choice: Il convoqua ses serviteurs
  rationale: Dans un cadre royal, קרא אל peut exprimer le fait de faire venir quelqu’un, d’où « convoqua ». « Serviteurs » préserve la portée de עֲבָדָיו, qui peut inclure des officiers ou des membres de la cour.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: Ne me direz-vous pas
  rationale: La question négative a la force d’une demande pressante. La tournure française conserve sa forme rhétorique et l’autorité du roi.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: lequel des nôtres
  rationale: L’expression demande d’identifier un membre du camp araméen soupçonné de transmettre des renseignements. « Lequel des nôtres » est concis et idiomatique.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: est du côté du roi d’Israël
  rationale: La construction hébraïque est elliptique et marque ici une orientation ou une allégeance envers le roi d’Israël. La formulation française rend clairement le soupçon de collusion tout en signalant l’ellipse dans une note.
