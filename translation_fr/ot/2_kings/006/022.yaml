  naturalness: Le français est moderne, clair et d’un registre narratif approprié. « Tuerais-tu » restitue naturellement la valeur rhétorique. « Qu’ils aillent auprès de leurs maîtres » est fluide et plus strictement fidèle que « puis qu’ils retournent auprès de leur maître ».
  terminology: « Faits prisonniers », « épée », « arc », « pain et eau » et « tuer » conviennent au contexte militaire et au registre moderne. « Leurs maîtres » conserve le pluriel hébreu sans identifier ou singulariser leur autorité.
