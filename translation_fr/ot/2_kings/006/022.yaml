base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: fr
  text: 'Mais Élisée répondit : « Ne les tue pas. Tuerais-tu ceux que tu as faits prisonniers avec ton épée et ton arc ?[a] Mets devant eux du pain et de l’eau[b], afin qu’ils mangent, boivent et aillent auprès de leurs maîtres. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Est-ce que tu tues ceux que tu as faits prisonniers avec ton épée et ton arc ? » La formulation hébraïque est rhétorique et renforce l’ordre de ne pas les mettre à mort.'
    reason: alternative_reading
  - marker: b
    text: L’expression « du pain et de l’eau » peut désigner les provisions nécessaires, mais l’hébreu nomme explicitement ces deux éléments.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: tue / tuerais-tu
  rationale: Dans ce contexte, נכה désigne une mise à mort plutôt qu’un simple coup. « Tuer » exprime clairement l’enjeu, tandis que le conditionnel rend naturellement en français la force rhétorique de la seconde occurrence.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: ceux que tu as faits prisonniers
  rationale: שבה appartient au vocabulaire militaire de la capture et de la captivité. Cette formulation française conserve ce sens précis.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: avec ton épée et ton arc
  rationale: 'La mention concrète des deux armes fait partie du raisonnement : le roi n’a pas capturé ces hommes par ses propres armes.'
- source_word: שִׂים
  choice: Mets
  rationale: Impératif direct, courant et fidèle à la concision de l’hébreu.
- source_word: לֶחֶם וָמַיִם
  choice: du pain et de l’eau
  rationale: Le texte nomme explicitement ces deux éléments. Le rendu concret est conservé, tout en signalant en note la possible portée idiomatique de « pain ».
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Expression française naturelle pour présenter de la nourriture à quelqu’un.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: afin qu’ils mangent et boivent, puis qu’ils retournent
  rationale: « Afin que » exprime la finalité des formes verbales hébraïques; « puis » rend naturellement la progression vers leur départ.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: auprès de leur maître
  rationale: La forme morphologiquement plurielle אֲדֹנֵיהֶם peut désigner collectivement le maître ou souverain commun des soldats. Le contexte pointe vers le roi d’Aram; « leur maître » préserve ce référent singulier sans le préciser davantage.
theological_decisions:
- issue: Portée de la question rhétorique d’Élisée
  choice: La question renforce l’interdiction de tuer les prisonniers et souligne que le roi ne les a pas capturés par ses propres armes.
  alternative: Comprendre la proposition comme une simple affirmation, ou comme une règle concernant seulement les prisonniers capturés personnellement au combat.
  rationale: La particule interrogative et le contexte favorisent une question rhétorique. La traduction ne transforme toutefois pas cette remarque narrative en principe juridique général.
- issue: Référent de « leur maître »
  choice: Conserver le singulier sémantique et ne pas identifier explicitement le personnage.
  alternative: Traduire « leurs maîtres » ou expliciter « le roi d’Aram ».
  rationale: Le contexte suggère un chef commun, probablement le roi d’Aram, mais le texte emploie seulement le titre. La traduction garde cette retenue.
translation_notes:
  register: Français international moderne, direct et digne. « Ne les tue pas » évite l’archaïsme de « ne les frappe pas » lorsque le contexte indique une exécution. Le conditionnel « Tuerais-tu » rend la question rhétorique avec naturel. Les marqueurs de notes sont placés immédiatement après les segments concernés.
