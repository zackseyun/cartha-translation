  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יִּקְבֹּ֛ץ בֶּן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם אֶת כָּל מַחֲנֵ֑/הוּ וַ/יַּ֕עַל וַ/יָּ֖צַר עַל שֹׁמְרֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: fr
  text: Après cela, Ben-Hadad, roi d’Aram[a], rassembla toute son armée[b]. Il monta et assiégea Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « roi de Syrie ». L’hébreu porte « roi d’Aram ».'
    reason: alternative_reading
  - marker: b
    text: Ou « toutes ses forces »; littéralement « tout son camp » ou « toute son armée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette formule française naturelle conserve la succession narrative exprimée par l’hébreu sans reproduire lourdement « il arriva après cela que ».
- source_word: וַיִּקְבֹּץ
  choice: rassembla
  rationale: Le verbe signifie réunir ou assembler; « rassembla » convient au contexte militaire sans lui ajouter la nuance technique de « mobilisa ».
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Translittération française usuelle du nom propre.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: Le texte hébreu nomme explicitement Aram; ce choix évite de remplacer le nom ancien par l’appellation traditionnelle et interprétative « Syrie ».
- source_word: כָּל מַחֲנֵהוּ
  choice: toute son armée
  rationale: מַחֲנֶה peut désigner le camp, les forces rassemblées ou l’armée. Dans ce contexte de siège, « toute son armée » exprime clairement le référent, tandis qu’une note conserve l’étendue lexicale.
- source_word: וַיַּעַל
  choice: Il monta
  rationale: Le verbe exprime une montée ou une progression vers le lieu visé. « Monta » préserve cette formulation et sa possible portée topographique sans ajouter explicitement « marcha ».
- source_word: וַיָּצַר עַל
  choice: assiégea
  rationale: Avec עַל, le verbe désigne l’action d’assiéger une ville; ce rendu est concis et naturel.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française traditionnelle et standard du nom de lieu.
theological_decisions: []
