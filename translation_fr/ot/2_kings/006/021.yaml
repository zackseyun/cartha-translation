source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל אֱלִישָׁ֔ע כִּ/רְאֹת֖/וֹ אוֹתָ֑/ם הַ/אַכֶּ֥ה אַכֶּ֖ה אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: fr
  text: 'Alors, quand le roi d’Israël les vit, il dit à Élisée : « Dois-je les tuer ? Dois-je les tuer[a], mon père[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète la question pour la souligner.
    reason: lexical_alternative
  - marker: b
    text: « Mon père » est ici une manière respectueuse de s’adresser à Élisée.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... il dit
  rationale: Le waw narratif fait progresser le récit. « Alors ... il dit » rend naturellement cette succession en français moderne.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Le groupe construit est défini par le contexte et se rend directement ainsi.
- source_word: אֶל אֱלִישָׁע
  choice: à Élisée
  rationale: La préposition אֶל introduit ici le destinataire de la parole. Aucun titre tel que « le prophète » n’est ajouté, puisqu’il ne figure pas dans l’hébreu.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: quand le roi d’Israël les vit
  rationale: L’infinitif construit avec כ־ exprime le temps. La reprise explicite du roi dans la proposition française évite que le pronom soit attribué à Élisée.
- source_word: הַאַכֶּה אַכֶּה
  choice: Dois-je les tuer ? Dois-je les tuer ?
  rationale: Dans ce contexte militaire, נכה désigne une mise à mort plutôt qu’un simple coup. La répétition de la question conserve directement l’insistance de l’hébreu.
- source_word: אָבִי
  choice: mon père
  rationale: La traduction littérale préserve la forme familiale employée comme titre de respect envers Élisée.
theological_decisions:
- issue: Adresse honorifique à Élisée
  choice: Conserver « mon père » comme dans l’hébreu.
  alternative: Employer une formule interprétative telle que « mon maître » ou « monsieur ».
  rationale: Le sens est honorifique, mais le texte emploie explicitement le vocabulaire de la paternité. Le conserver évite d’aplanir cette image relationnelle.
- issue: Portée de נכה dans la question du roi
  choice: Traduire par « tuer » dans ce contexte militaire.
  alternative: Traduire plus littéralement par « frapper » ou « abattre ».
  rationale: Le roi demande l’autorisation de mettre à mort les soldats ennemis capturés. « Tuer » rend clairement la portée contextuelle sans introduire de conclusion théologique supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe identifie explicitement le roi comme sujet de « vit » afin d’éviter une ambiguïté artificielle en français; la répétition et l’adresse « mon père » sont conservées.
