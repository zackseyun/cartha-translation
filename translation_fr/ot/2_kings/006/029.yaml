base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: fr
  text: 'Nous avons fait cuire mon fils et nous l’avons mangé[a]. Le lendemain, je lui ai dit : « Donne ton fils, pour que nous le mangions[b]. » Mais elle a caché son fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait bouillir mon fils et nous l’avons mangé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et nous le mangerons » ; la forme hébraïque peut aussi être comprise comme un simple futur, même si le contexte après « Donne ton fils » favorise l’idée de but.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: nous avons fait cuire
  rationale: Le piel de בשׁל désigne ici l’action de cuire, possiblement de faire bouillir. « Faire cuire » est naturel en français moderne et conserve la portée générale du verbe sans imposer un procédé précis.
- source_word: בְּנִי / בְּנֵךְ / בְּנָהּ
  choice: mon fils / ton fils / son fils
  rationale: בֵּן désigne explicitement un fils; les suffixes possessifs et le lien familial sont conservés.
- source_word: וַנֹּאכְלֵהוּ
  choice: et nous l’avons mangé
  rationale: אכל signifie simplement « manger ». Le pronom objet masculin est rendu par « l’ », tandis que l’accord « mangé » indique clairement le référent masculin.
- source_word: וָאֹמַר אֵלֶיהָ
  choice: je lui ai dit
  rationale: Cette formulation française rend directement l’adresse à l’autre femme; l’enchaînement narratif est porté par « Le lendemain ».
- source_word: בַּיּוֹם הָאַחֵר
  choice: Le lendemain
  rationale: Expression française naturelle et exacte pour le jour qui suit.
- source_word: תְּנִי
  choice: Donne
  rationale: L’impératif de נתן est rendu sans amplification par l’impératif direct « Donne ».
- source_word: וְנֹאכְלֶנּוּ
  choice: pour que nous le mangions
  rationale: Après l’impératif, l’imparfait hébreu coordonné peut exprimer le but ou le résultat attendu. Le subjonctif français convient à cette lecture contextuelle.
- source_word: וַתַּחְבִּא
  choice: Mais elle a caché
  rationale: Le waw narratif marque la suite, mais le contexte établit un contraste avec la demande précédente; « Mais » le rend naturellement.
