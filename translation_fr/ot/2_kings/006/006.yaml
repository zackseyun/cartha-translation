  text: וַ/יֹּ֥אמֶר אִישׁ הָ/אֱלֹהִ֖ים אָ֣נָה נָפָ֑ל וַ/יַּרְאֵ֨/הוּ֙ אֶת הַ/מָּק֔וֹם וַ/יִּקְצָב עֵץ֙ וַ/יַּשְׁלֶךְ שָׁ֔מָּ/ה וַ/יָּ֖צֶף הַ/בַּרְזֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: fr
  text: 'L’homme de Dieu demanda : « Où est-il tombé ? » Celui-ci lui montra l’endroit. Alors l’homme de Dieu coupa un morceau de bois, le jeta là et fit flotter le fer[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fer ». Dans ce contexte, il s’agit de la tête en fer de la hache mentionnée au verset précédent.'
    reason: Clarification du référent contextuel de l’expression hébraïque concise.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Rend directement ce titre hébreu traditionnel appliqué ici au prophète, sans le remplacer par une explicitation interprétative.
- source_word: אָנָה נָפָל
  choice: Où est-il tombé ?
  rationale: Question naturelle en français sur le lieu où l’objet est tombé ; le pronom renvoie au fer mentionné dans le contexte précédent.
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: L’homme lui montra l’endroit
  rationale: Le hiphil de ראה signifie « faire voir », donc « montrer ». La répétition de « l’homme » évite l’ambiguïté que produirait une succession de pronoms masculins en français.
- source_word: וַיִּקְצָב עֵץ
  choice: tailla un morceau de bois
  rationale: קצב exprime ici l’action de couper ou de façonner, tandis que עץ peut désigner du bois. Cette formulation reste concrète sans préciser indûment qu’il s’agissait d’une branche ou d’un bâton.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: le jeta à cet endroit
  rationale: Rend simplement l’action de jeter et l’adverbe de lieu, avec un référent clair pour le pronom.
- source_word: וַיָּצֶף הַבַּרְזֶל
  choice: fit flotter le fer
  rationale: 'La forme verbale est causative : l’homme de Dieu fait flotter le fer. Cette traduction conserve cette construction plutôt que de transformer le fer en sujet d’un verbe intransitif.'
- source_word: הַבַּרְזֶל
  choice: le fer
  rationale: Reproduit l’expression hébraïque concise. Le contexte identifie ce « fer » comme la tête en fer de la hache perdue au verset précédent.
theological_decisions:
- issue: Caractère miraculeux de l’action
  choice: fit flotter le fer
  alternative: le fer flotta / le fer remonta à la surface
  rationale: Le récit présente directement une action extraordinaire. La traduction ne la naturalise pas et conserve en outre la valeur causative du verbe hébreu, sans expliquer le mécanisme du miracle.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases brèves suivent la progression des verbes hébreux. La répétition contrôlée de « l’homme » et de « l’homme de Dieu » assure la clarté des référents, tandis que « tailla un morceau de bois » évite un terme trop familier ou une précision absente du texte source.
