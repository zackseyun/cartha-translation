base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: fr
  text: 'Mais tandis que l’un d’eux abattait une pièce de bois, le fer[a] tomba dans l’eau. Il s’écria : « Ah ! mon maître, il était emprunté ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fer » ; il s’agit de la partie en fer de l’outil, c’est-à-dire de la tête de hache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל
  choice: abattait
  rationale: Le participe hiphil de נפל signifie ici « faire tomber » en coupant du bois. « Abattait » exprime naturellement cette action en français.
- source_word: הַקּוֹרָה
  choice: une poutre
  rationale: קוֹרָה désigne couramment une poutre ou une pièce de bois. L’article indéfini est naturel en français dans ce contexte.
- source_word: הַבַּרְזֶל
  choice: le fer
  rationale: La traduction conserve la métonymie exacte de l’hébreu, où « le fer » désigne la partie métallique de l’outil, comprise dans le contexte comme la tête de hache.
- source_word: וַיִּצְעַק
  choice: Il poussa un cri
  rationale: Cette formulation rend la réaction soudaine et angoissée exprimée par le verbe צעק.
- source_word: אֲהָהּ
  choice: Ah
  rationale: Cette interjection française actuelle exprime ici la détresse sans adopter le ton archaïque de « Hélas ».
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Le titre marque le rapport de respect entre le disciple et Élisée, sans suggérer nécessairement un titre divin.
- source_word: שָׁאוּל
  choice: emprunté
  rationale: Dans ce contexte, la forme indique que l’objet avait été obtenu en prêt et n’appartenait pas à celui qui l’utilisait.
