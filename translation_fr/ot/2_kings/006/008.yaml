source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֔ם הָיָ֥ה נִלְחָ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יִּוָּעַץ֙ אֶל עֲבָדָ֣י/ו לֵ/אמֹ֗ר אֶל מְק֛וֹם פְּלֹנִ֥י אַלְמֹנִ֖י תַּחֲנֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: fr
  text: 'Le roi d’Aram était en guerre contre Israël. Il tint conseil avec ses serviteurs et leur dit : « Mon camp sera à tel ou tel endroit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mon camp sera à l’endroit untel ». L’hébreu emploie une expression idiomatique pour désigner un lieu non précisé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Le roi d’Aram
  rationale: Le waw assure la continuité narrative sans devoir être rendu mécaniquement par « et ». Le nom géographique אֲרָם est conservé sous la forme « Aram », plutôt que remplacé par « Syrie ».
- source_word: הָיָה נִלְחָם
  choice: était en guerre
  rationale: La construction périphrastique היה avec le participe nifal présente une action durable ou répétée dans le passé. « Était en guerre » rend naturellement cet aspect en français.
- source_word: בְּיִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec נלחם, la préposition ב désigne ici l’adversaire ; « contre » exprime clairement ce rapport en français.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: Il tint conseil avec ses serviteurs
  rationale: Le verbe indique une consultation ou une délibération. « Tenir conseil avec » est idiomatique et conserve עֲבָדִים dans son sens large de serviteurs royaux, sans le restreindre à « officiers ».
- source_word: לֵאמֹר
  choice: et leur dit
  rationale: L’infinitif quotatif introduit les paroles du roi. En français narratif, « et leur dit » est plus naturel qu’un calque tel que « disant ».
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: à tel ou tel endroit
  rationale: La locution double désigne un lieu laissé indéterminé. « À tel ou tel endroit » est une expression française courante qui maintient cette indétermination.
- source_word: תַּחֲנֹתִי
  choice: Mon camp sera
  rationale: La forme désigne le campement du roi. Dans le contexte d’une délibération militaire préalable, le futur français explicite naturellement la valeur prospective de la proposition nominale hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Était en guerre » garde la durée de l’action ; « tint conseil » convient au cadre royal sans archaïsme excessif. La citation adopte un ordre naturel en français tout en préservant l’indétermination du lieu.
