  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: fr
  text: 'Alors, l’homme de Dieu envoya dire au roi d’Israël : « Garde-toi de passer par cet endroit, car les Araméens sont en train d’y descendre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « y descendent »; le participe hébreu ne précise pas à lui seul le déroulement temporel exact de l’action.'
    reason: ambiguïté aspectuelle
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya dire
  rationale: Le verbe signifie littéralement « envoya »; le contexte implique l’envoi d’un message. « Envoya dire » exprime naturellement cette ellipse en français sans préciser de messager.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Conserve le titre hébreu traditionnel sans le remplacer par l’interprétation « le prophète ».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Rend directement le titre royal et le nom du peuple.
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: Garde-toi de passer
  rationale: Le niphal impératif suivi de מִן exprime une mise en garde contre l’action de passer par le lieu; cette tournure est à la fois directe, digne et idiomatique.
- source_word: הַמָּקוֹם הַזֶּה
  choice: cet endroit
  rationale: Rendu naturel du groupe démonstratif dans une indication géographique.
- source_word: אֲרָם
  choice: les Araméens
  rationale: Dans ce contexte militaire, le nom Aram désigne les forces araméennes; « Araméens » évite l’appellation anachronique « Syriens ».
- source_word: נְחִתִּים
  choice: sont en train de descendre
  rationale: Le participe pluriel du verbe « descendre » décrit un mouvement en cours ou imminent. La périphrase progressive rend clairement cette valeur contextuelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Garde-toi » maintient la force de l’avertissement biblique sans devenir archaïque, tandis que « cet endroit » convient à une instruction concrète de déplacement.
