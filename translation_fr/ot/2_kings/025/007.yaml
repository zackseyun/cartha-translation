base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: fr
  text: Ils égorgèrent les fils de Sédécias sous ses yeux, puis il lui creva les yeux[a], le lia avec des entraves de bronze et l’emmena à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’aveugla ». Le verbe hébreu signifie littéralement « rendre aveugle » ; avec « les yeux » comme complément, il peut désigner concrètement l’acte de les crever.'
    reason: Alternative lexicale
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: égorgèrent
  rationale: Le verbe désigne un abattage ou une mise à mort violente; « égorgèrent » conserve ici sa force concrète et brutale.
- source_word: לְעֵינָיו
  choice: sous ses yeux
  rationale: Cette expression française naturelle indique que Sédécias assiste directement à la scène.
- source_word: עִוֵּר
  choice: creva les yeux
  rationale: Le verbe signifie « rendre aveugle »; avec « les yeux de Sédécias » comme objet, cette formulation exprime naturellement l’acte physique violent impliqué par le contexte.
- source_word: וַיַּאַסְרֵהוּ
  choice: le lia
  rationale: Le verbe signifie attacher ou emprisonner; la mention immédiate de l’entrave rend « lia » précis et direct.
- source_word: בַנְחֻשְׁתַּיִם
  choice: avec une double chaîne de bronze
  rationale: La forme duelle désigne vraisemblablement une paire d’entraves ou un dispositif double en métal; cette traduction garde la nuance du duel tout en restant compréhensible.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: l’emmena à Babylone
  rationale: Dans ce récit de transfert forcé, « emmena » est plus naturel en français que le calque « amena », sans modifier le sens.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: les fils de Sédécias
  rationale: C’est la formulation française naturelle du syntagme construit hébreu.
theological_decisions:
- issue: Changement de sujet entre le pluriel שָׁחֲטוּ et le singulier עִוֵּר
  choice: Expliciter le sujet singulier par « le roi de Babylone » avec une note
  alternative: Employer seulement « il », comme en hébreu
  rationale: L’hébreu passe de « ils égorgèrent » à « il aveugla » sans répéter le sujet, lequel est fourni par le verset précédent. L’explicitation évite une ambiguïté artificielle en français tout en signalant l’ellipse du texte source.
translation_notes:
  register: Français moderne, digne et narratif. « Égorgèrent » et « creva les yeux » conservent sans euphémisme la violence du texte. La seconde phrase rend clairement le passage du sujet pluriel au sujet singulier.
