  verdict: revise
  source_fidelity: 'La désignation explicite de « le roi de Babylone » dépasse le texte de ce verset : après le pluriel « ils égorgèrent », l’hébreu emploie un singulier implicite (« il aveugla / lia / emmena »). Le contexte peut suggérer le roi, mais le verset ne le nomme pas. « Une double chaîne de bronze » interprète trop précisément le duel de נְחֻשְׁתַּיִם, qui désigne plus sûrement des entraves/fers de bronze.'
  naturalness: « Sous ses yeux », « égorgèrent » et « lui creva les yeux » sont naturels dans un registre narratif soutenu et rendent la violence sans euphémisme. « Il » permet une phrase française claire tout en conservant l’ellipse et l’ambiguïté du sujet singulier. « Des entraves de bronze » est idiomatique et précis.
  terminology: « Sédécias » et « Babylone » sont les formes françaises usuelles. « Entraves de bronze » rend adéquatement les fers, chaînes ou entraves métalliques exprimés par le terme hébreu au duel, sans imposer l’image d’une seule chaîne double. Une note lexicale signale que « creva les yeux » explicite l’acte concrètement impliqué, là où le verbe signifie littéralement « aveugla ».
  issues:
