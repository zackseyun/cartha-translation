base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/028.yaml
  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: fr
  text: Il lui parla avec bienveillance[a] et plaça son trône au-dessus de ceux des rois qui étaient avec lui à Babylone[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il parla avec lui de bonnes choses »; cette expression signifie qu’il s’adressa à lui favorablement ou avec bienveillance.'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « trône » peut aussi désigner un « siège ». Il est question ici d’une place d’honneur et d’un rang supérieur à ceux des autres rois présents à Babylone.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: Il lui parla avec bienveillance
  rationale: Littéralement, l’expression évoque le fait de « parler de bonnes choses avec lui »; dans ce contexte, c’est une tournure idiomatique indiquant un accueil et des paroles favorables. « Avec bienveillance » est naturel et digne en français.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: plaça son trône
  rationale: Avec כִּסֵּא, le verbe נָתַן exprime ici l’attribution ou le positionnement d’une place royale, plutôt que le don matériel d’un trône.
- source_word: כִּסְאוֹ
  choice: son trône
  rationale: « Trône » conserve à la fois l’image concrète du siège d’honneur et sa portée symbolique liée au rang royal.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: au-dessus de ceux des rois
  rationale: מֵעַל indique une position supérieure, concrète ou hiérarchique. Le pronom « ceux » reprend naturellement « trône » en français et rend la comparaison avec les sièges ou trônes des autres rois sans lourdeur.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: des rois qui étaient avec lui
  rationale: Cette traduction directe préserve le référent possible de « lui » tel qu’il se présente dans l’hébreu, sans explicitation interprétative.
- source_word: בְּבָבֶל
  choice: à Babylone
  rationale: En français, le nom de la ville s’emploie normalement avec la préposition « à ».
theological_decisions: []
