base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: fr
  text: Alors une brèche fut ouverte dans la ville. Tous les combattants s’échappèrent[d] de nuit par la porte qui se trouvait entre les deux murailles, près du jardin du roi, tandis que les Chaldéens[a] entouraient la ville de tous côtés. Le roi[b] prit le chemin de l’Araba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Babyloniens ». L’hébreu dit précisément « les Chaldéens ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « il alla ». En hébreu, le sujet reste implicite; le contexte indique qu’il s’agit du roi.
    reason: lexical_alternative
  - marker: c
    text: L’Araba est la région de la dépression du Jourdain, qui s’étend vers le sud; le terme est aussi traditionnellement rendu par « la plaine ».
    reason: cultural_note
  - marker: d
    text: Le texte hébreu transmis ne comporte pas de verbe explicite à cet endroit. « S’échappèrent » restitue le sens suggéré par le contexte narratif et par le passage parallèle de Jérémie 39.4.
    reason: textual_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: une brèche fut ouverte dans la ville
  rationale: Le niphal de בקע décrit ici l’ouverture forcée des défenses lors du siège. Cette formulation française est naturelle dans un contexte militaire et conserve l’image d’une brèche.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: les combattants
  rationale: L’expression signifie littéralement « les hommes de guerre ». « Les combattants » en restitue clairement le sens militaire dans un français moderne sans lourdeur.
- source_word: הַלַּיְלָה
  choice: de nuit
  rationale: Le nom est employé adverbialement et indique le moment de la fuite.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: par la porte située entre les deux murailles
  rationale: Le duel חֹמֹתַיִם désigne explicitement deux murailles. En français, « par la porte » exprime naturellement l’itinéraire marqué par דֶּרֶךְ.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: près du jardin du roi
  rationale: Dans cette indication topographique, עַל exprime la proximité. « Près de » est clair et idiomatique.
- source_word: וְכַשְׂדִּים
  choice: les Chaldéens
  rationale: Le texte hébreu nomme précisément les Chaldéens. Le terme historique est donc conservé plutôt que remplacé dans le corps du texte par « Babyloniens ».
- source_word: עַל הָעִיר סָבִיב
  choice: aient encerclé la ville
  rationale: סָבִיב indique que les forces se trouvaient tout autour de la ville. « Encercler » rend cette situation de façon concise et naturelle.
- source_word: וַיֵּלֶךְ
  choice: Le roi prit
  rationale: Le sujet du verbe singulier n’est pas exprimé en hébreu. Le contexte identifie le roi; le rendre explicite évite une ambiguïté artificielle en français, tout en la signalant en note.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: le chemin de l’Araba
  rationale: L’Araba est ici un nom géographique. La translittération conserve ce référent plutôt que de l’aplatir en « plaine ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement segmentée pour rester claire. Le texte conserve « Chaldéens » et « Araba », termes précis de la source, avec des notes explicatives. Le verbe de fuite, sous-entendu dans la formulation hébraïque elliptique de ce verset mais requis par le contexte narratif, est exprimé en français.
