    issue: Le sujet explicite pluriel devient le pronom indéfini « on » dans la dernière proposition.
    rationale: וַיְדַבְּרוּ est à la troisième personne du pluriel. Même si les agents ne sont pas individuellement identifiés, « ils » préserve la continuité narrative et la forme du texte source.
  - severity: low
    issue: « Là » et la séparation en deux phrases ajoutent une articulation discursive absente de l’hébreu.
    rationale: Cette reformulation ne fausse pas le sens, mais une seule phrase coordonnée reflète plus directement la succession des actions et évite de déplacer l’accent vers le lieu.
