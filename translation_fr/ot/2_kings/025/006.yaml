  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: fr
  text: Alors ils capturèrent le roi et le firent monter auprès du roi de Babylone, à Ribla, et ils prononcèrent un jugement contre lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils parlèrent jugement avec lui » ; cette expression judiciaire signifie qu’ils prononcèrent un jugement contre lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: ils capturèrent
  rationale: Dans ce contexte, תפשׂ désigne l’arrestation du roi en fuite. « Capturèrent » exprime naturellement une prise réussie.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini renvoie au roi déjà mentionné, Sédécias, sans répéter son nom.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: le firent monter
  rationale: Cette formulation conserve le sens directionnel du causatif de עלה et reste naturelle en français.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: auprès du roi de Babylone
  rationale: אֶל indique ici qu’on conduit le prisonnier jusqu’au souverain pour comparaître devant lui. « Auprès de » garde cette relation sans rendre explicitement ce qui n’est qu’implicite.
- source_word: רִבְלָתָה
  choice: à Ribla
  rationale: Le hé directionnel indique un mouvement vers Ribla, tandis que le français « à Ribla » peut naturellement désigner à la fois la destination et le lieu de la comparution.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: on prononça la sentence contre lui
  rationale: L’expression hébraïque, littéralement « ils parlèrent jugement avec lui », est une formule judiciaire. « Prononcer la sentence contre quelqu’un » en restitue clairement la portée juridique.
