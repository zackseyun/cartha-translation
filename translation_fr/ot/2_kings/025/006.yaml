- from: Alors ils capturèrent le roi et le firent monter auprès du roi de Babylone, à Ribla. Là, on prononça la sentence contre lui.[a]
  to: Alors ils capturèrent le roi et le firent monter auprès du roi de Babylone, à Ribla, et ils prononcèrent un jugement contre lui.[a]
  rationale: La révision rétablit le sujet pluriel du texte hébreu et conserve la coordination narrative. « Prononcèrent un jugement » rend la portée judiciaire de l’expression idiomatique tout en préservant l’ampleur de מִשְׁפָּט. La note conserve une indication littérale, tout en signalant clairement le caractère idiomatique de la tournure.
