  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: fr
  text: Il incendia la maison de Yahweh[a], le palais royal, toutes les maisons de Jérusalem et toute grande maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le temple de Yahweh ». Littéralement : « la maison de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « toute vaste maison » ou « toute maison importante ». L’expression hébraïque peut désigner des maisons remarquables par leurs dimensions ou par leur importance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Il incendia
  rationale: Le wayyiqtol qal de שׂרף fait avancer le récit. « Incendia » exprime naturellement en français l’action de mettre le feu à des bâtiments.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette traduction conserve l’expression hébraïque « maison de YHWH » et le nom divin; « temple de Yahweh » est donné en note comme formulation contextuelle plus explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », conformément à la forme présente dans le texte hébreu.
- source_word: בֵּית הַמֶּלֶךְ
  choice: le palais royal
  rationale: Littéralement « la maison du roi »; dans ce contexte, l’expression désigne sa résidence officielle. « Palais royal » est idiomatique et immédiatement compréhensible.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: toutes les maisons de Jérusalem
  rationale: Rendu direct de la construction hébraïque, naturel en français et sans restriction ajoutée.
- source_word: כָּל בֵּית גָּדוֹל
  choice: toute grande demeure
  rationale: Le singulier précédé de כָּל reçoit une valeur distributive. « Grande » conserve l’ambiguïté de גָּדוֹל, qui peut évoquer les dimensions ou l’importance sociale; « demeure » convient à une habitation notable sans imposer un seul sens.
- source_word: שָׂרַף בָּאֵשׁ
  choice: Il livra aussi aux flammes
  rationale: Cette formulation restitue la reprise emphatique du verbe « brûler » et la mention du feu, tout en évitant une répétition maladroite en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre plutôt que de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Incendia » et « livra aux flammes » rendent la répétition hébraïque sans lourdeur. La seconde phrase préserve la reprise emphatique finale, tandis que la note maintient l’ambiguïté de גָּדוֹל.
