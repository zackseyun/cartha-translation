  - severity: low
    issue: « Demeure » interprète quelque peu בית.
    rationale: בית désigne d’abord une maison ; « demeure » peut évoquer une résidence plus distinguée. « Grande maison » maintient plus directement l’ambiguïté de גדול, qui peut concerner la dimension ou l’importance.
