  terminology: « Yahweh » est cohérent avec le choix de rendre explicitement le tétragramme. « Palais royal » est une explicitation contextuelle acceptable de « maison du roi ». La note sur la maison de Yahweh et celle sur « grande maison » préservent utilement les possibilités lexicales.
