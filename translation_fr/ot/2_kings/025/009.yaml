  source_fidelity: 'Le sens fondamental est bien rendu : le sujet incendie la maison de Yahweh, le palais, les maisons de Jérusalem et les « grandes maisons ». Toutefois, la seconde phrase avec « aussi » et « livra aux flammes » reformule plus librement la reprise finale de brûler ; une phrase unique rend plus nettement la coordination et la répétition emphatique du texte hébreu.'
