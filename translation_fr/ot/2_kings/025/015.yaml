base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/015.yaml
  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: fr
  text: Le chef de la garde emporta les pelles à braises[a] et les coupes[b], celles qui étaient en or et celles qui étaient en argent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les encensoirs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les bassins ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ce qui était or, or, et ce qui était argent, argent ». L’hébreu répète le nom de chaque métal pour classer les objets selon leur matière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: les pelles à braises
  rationale: Le terme désigne des ustensiles servant à prendre ou transporter des braises dans le service du temple. « Pelles à braises » est clair en français moderne sans imposer l'usage précis de l'encens.
- source_word: הַמִּזְרָקוֹת
  choice: les coupes
  rationale: Le mot désigne des récipients cultuels pouvant contenir ou servir à répandre un liquide sacrificiel. « Coupes » est naturel; « bassins » demeure possible.
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: celles qui étaient en or et celles qui étaient en argent
  rationale: Cette formulation rend naturellement en français la répartition des objets selon leur matière. Une note signale la répétition nominale emphatique de l'hébreu.
- source_word: לָקַח
  choice: emporta
  rationale: Dans ce contexte de prise et de déplacement du mobilier du temple, « emporta » exprime naturellement la valeur contextuelle de « prendre ».
- source_word: רַב טַבָּחִים
  choice: le chef de la garde
  rationale: L'expression fonctionne ici comme le titre d'un haut officier babylonien. « Chef de la garde » est idiomatique, concis et n'impose pas le sens littéral incertain lié aux exécuteurs ou aux gardes du corps.
