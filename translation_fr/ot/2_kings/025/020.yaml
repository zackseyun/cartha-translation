source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: fr
  text: Nebouzaradan, chef de la garde[a], les prit et les conduisit auprès du roi de Babylone, à Ribla[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « chef des égorgeurs » ; il s’agit probablement d’un titre militaire ou d’une fonction liée à la sécurité royale.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « les conduisit devant le roi de Babylone, à Ribla » ; le texte peut souligner leur comparution en présence du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: les prit
  rationale: Le verbe לקח signifie naturellement « prendre » dans ce récit. « Saisit » ajouterait une nuance de violence qui n’est pas explicitement portée par le verbe.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebouzaradan
  rationale: Translittération française courante du nom propre, avec « ou » pour rendre la voyelle de la première syllabe.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Littéralement « chef des égorgeurs/exécuteurs », l’expression désigne vraisemblablement un haut responsable militaire ou de la sécurité royale. « Chef de la garde » rend naturellement le titre sans imposer un sens trop littéral.
- source_word: וַיֹּלֶךְ
  choice: les conduisit
  rationale: La forme causative de הלך exprime ici le fait de faire aller des prisonniers vers une personne et un lieu. « Conduisit » est idiomatique et conserve l’idée de déplacement sous autorité.
- source_word: עַל
  choice: auprès de
  rationale: Avec un verbe de mouvement suivi d’une personne, עַל indique ici le mouvement jusque dans la présence du roi. « Auprès de » préserve cette nuance sans déterminer explicitement s’il s’agit d’une comparution.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Rendu direct et naturel de la chaîne construite hébraïque.
- source_word: רִבְלָתָה
  choice: à Ribla
  rationale: Le nom de lieu porte un suffixe directionnel. Dans la phrase entière, le français « à Ribla » peut indiquer naturellement le lieu où se trouve le roi tout en laissant le mouvement être exprimé par « conduisit auprès de ».
