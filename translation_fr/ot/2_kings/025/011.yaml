id: 2KI.25.11
reference: 2 Kings 25:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: fr
  text: Nebouzaradan, chef de la garde[a], déporta le reste du peuple qui était demeuré dans la ville, ceux qui avaient fait défection pour se rallier au roi de Babylone[b], ainsi que le reste de la population[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chef des tueurs »; il s’agit vraisemblablement du titre du commandant de la garde royale.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « ceux qui étaient tombés vers le roi de Babylone »; cette expression signifie ici qu’ils étaient passés dans son camp.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le reste de la foule » ou « le reste de la multitude ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: le reste du peuple
  rationale: Rend naturellement l’idée des personnes qui subsistaient après le siège, les morts et les déportations antérieures.
- source_word: הַנִּשְׁאָרִים בָּעִיר
  choice: qui était demeuré dans la ville
  rationale: Le participe nifal de שׁאר désigne ceux qui restaient encore à Jérusalem; le singulier collectif s’accorde avec « peuple ».
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: ceux qui avaient fait défection pour se rallier au roi de Babylone
  rationale: Dans ce contexte politico-militaire, נפל על est une expression désignant le passage dans le camp d’un souverain. La formulation française explicite ce sens sans suggérer une chute physique.
- source_word: יֶתֶר הֶהָמוֹן
  choice: le reste de la population
  rationale: הָמוֹן désigne ici une masse ou un ensemble de personnes. « Population » convient au contexte urbain tout en évitant le caractère potentiellement désordonné de « foule ».
- source_word: הֶגְלָה
  choice: déporta
  rationale: Le hifil de גלה exprime l’action forcée d’emmener en exil; « déporta » est précis, naturel et concis en français moderne.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebouzaradan
  rationale: Translittération française courante du nom propre.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Il s’agit vraisemblablement d’un titre officiel babylonien. Cette traduction fonctionnelle est intelligible en français; le sens littéral est conservé en note.
theological_decisions: []
