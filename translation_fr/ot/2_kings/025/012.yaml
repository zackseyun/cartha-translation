  text: וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ הִשְׁאִ֖יר רַב טַבָּחִ֑ים לְ/כֹֽרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: fr
  text: Mais le chef de la garde laissa quelques-uns des plus pauvres du pays pour cultiver les vignes et travailler les champs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour cultiver les vignes et labourer les champs ». Le second terme hébreu, rare, désigne probablement de manière générale ceux qui travaillent le sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/דַּלַּת הָ/אָרֶץ
  choice: Mais… quelques-uns des plus pauvres du pays
  rationale: 'La construction avec מִן a une valeur partitive : le chef en laissa une partie. « Mais » marque naturellement le contraste avec les déportations précédentes, et « les plus pauvres » rend la force contextuelle de דַּלַּת.'
- source_word: הִשְׁאִיר
  choice: laissa
  rationale: Le hifil de שׁאר signifie « laisser, laisser subsister ». « Quelques-uns » explicite en français l'objet partitif sous-entendu par l'hébreu.
- source_word: רַב טַבָּחִים
  choice: le chef de la garde
  rationale: Dans ce contexte babylonien, l'expression est un titre militaire désignant le commandant de la garde, malgré son sens littéral lié aux exécuteurs ou aux hommes chargés de tuer.
- source_word: לְ/כֹרְמִים
  choice: pour cultiver les vignes
  rationale: Le terme désigne les personnes qui travaillent dans les vignobles. La tournure verbale est naturelle en français moderne et conserve la fonction assignée.
- source_word: וּ/לְ/יֹגְבִים
  choice: et travailler les champs
  rationale: Le mot rare désigne vraisemblablement des travailleurs du sol. Cette formulation conserve cette portée agricole générale sans limiter indûment leur tâche au labour.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation verbale évite les termes professionnels moins courants comme « vignerons » au sens ancien de travailleurs de vigne et « laboureurs », tout en restant proche de la structure et du sens de l'hébreu.
