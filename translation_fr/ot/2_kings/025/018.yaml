  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖הוּ כֹּהֵ֣ן מִשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: fr
  text: Le chef de la garde prit Seraya, le prêtre en chef[a], Sophonie, le prêtre de second rang[b], et les trois gardiens du seuil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grand prêtre ». L’hébreu dit littéralement « le prêtre, le chef ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le prêtre adjoint ».
    reason: lexical_alternative
  - marker: c
    text: Ou « les portiers », c’est-à-dire les gardiens de l’entrée du Temple. L’hébreu dit littéralement « les gardiens du seuil ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: le chef de la garde
  rationale: Ce titre désigne ici le haut responsable babylonien de la garde royale. Une traduction idiomatique évite le littéralisme « chef des exécuteurs » tout en conservant sa fonction militaire.
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לָקַח signifie couramment « prendre ». Le contexte fait comprendre qu'il s'agit d'une arrestation ou d'une mise sous garde, sans qu'il soit nécessaire de renforcer le verbe.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: le prêtre en chef
  rationale: Cette formulation rend directement « le prêtre, le chef » et indique la première place de Seraya dans la hiérarchie sacerdotale, sans imposer comme seul équivalent le titre traditionnel « grand prêtre ».
- source_word: כֹּהֵן מִשְׁנֶה
  choice: le prêtre de second rang
  rationale: מִשְׁנֶה exprime ici le second rang ou la fonction d'adjoint. La formulation française explicite naturellement cette place hiérarchique.
- source_word: שֹׁמְרֵי הַסַּף
  choice: les gardiens du seuil
  rationale: La traduction conserve l'image concrète de l'hébreu. Dans ce contexte, il s'agit vraisemblablement de gardiens de l'entrée du Temple, possibilité signalée en note.
- source_word: שְׁלֹשֶׁת
  choice: les trois
  rationale: L'article convient en français devant ce groupe défini de responsables.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Transcription française moderne du nom hébreu.
- source_word: צְפַנְיָהוּ
  choice: Sophonie
  rationale: Forme française biblique bien établie du nom hébreu, immédiatement reconnaissable pour le lectorat francophone.
theological_decisions:
- issue: Désignation du premier responsable sacerdotal
  choice: prêtre en chef
  alternative: grand prêtre
  rationale: L'hébreu dit littéralement « le prêtre, le chef ». « Grand prêtre » est contextuellement possible, mais « prêtre en chef » préserve plus directement la forme et l'ambiguïté du titre hébreu.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase suit la structure sobre du récit hébreu. Les titres sont rendus fonctionnellement sans effacer les formulations concrètes ou les ambiguïtés de l'original.
