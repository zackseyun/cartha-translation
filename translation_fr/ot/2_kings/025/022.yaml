base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: fr
  text: Quant au peuple qui était resté dans le pays de Juda[a], que Nabuchodonosor, roi de Babylone, avait laissé sur place, il nomma à leur tête Guedalia, fils d’Ahikam, fils de Shaphân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui avait été laissé » ; le participe hébreu peut exprimer soit le fait de rester, soit celui d’avoir été laissé sur place après les déportations.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: le peuple
  rationale: Rend naturellement le collectif עָם dans ce contexte national et historique.
- source_word: הַנִּשְׁאָר
  choice: qui restait
  rationale: Le participe nifal de שׁאר désigne ici la population demeurée dans le pays après les déportations, sans introduire la portée théologique que pourrait suggérer « le reste ».
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: dans le pays de Juda
  rationale: Expression géographique française courante qui conserve le sens territorial de אֶרֶץ.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: celui que … avait laissé
  rationale: Le hifil de שׁאר exprime l’action de laisser sur place; le plus-que-parfait respecte l’antériorité narrative.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nabuchodonosor, roi de Babylone
  rationale: Emploie les formes françaises bibliques usuelles du nom et du titre royal.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: il plaça à sa tête
  rationale: Dans ce contexte administratif, פקד avec עַל indique l’établissement d’un responsable sur la population; cette formulation est naturelle en français et conserve l’idée d’autorité officielle.
- source_word: גְּדַלְיָהוּ
  choice: Guedalia
  rationale: Translittération française courante du nom propre.
- source_word: בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: fils d’Ahikam et petit-fils de Shafân
  rationale: Explicite en français la chaîne généalogique hébraïque sans ambiguïté sur la relation entre Guedalia et Shafân.
- source_word: וְ
  choice: Quant à
  rationale: Marque naturellement la transition thématique introduite par la conjonction initiale.
