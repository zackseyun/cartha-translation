    reason: lexical_alternative
  revision_rationale: 'La révision améliore la syntaxe française tout en conservant les deux caractérisations successives de la population dans l’hébreu : elle était demeurée en Juda et Nabuchodonosor l’y avait laissée. Elle restitue également la chaîne « fils de …, fils de … » sans en modifier la valeur historique.'
