revisions:
- from: Au septième mois, Ismaël, fils de Netania et petit-fils d’Élishama, qui était de lignée royale[a], vint avec dix hommes. Ils frappèrent Guedalia, qui mourut, ainsi que les Judéens et les Chaldéens[b] qui se trouvaient avec lui à Mitspa.
  to: Au septième mois, Ismaël, fils de Nethania, fils d’Élishama, issu de lignée royale[a], vint avec dix hommes. Ils frappèrent Guedalia, qui mourut, ainsi que les Judéens et les Chaldéens[b] qui se trouvaient avec lui à Mitspa.
  rationale: La révision corrige l’inférence généalogique injustifiée de « petit-fils » et nuance la note lexicale sur les Chaldéens. Elle ne modifie pas le sens narratif du passage.
