    text: 'Littéralement : « de la descendance royale » ; cette expression indique une ascendance royale.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « Chaldéens » peut aussi être rendu par « Babyloniens ».
    reason: lexical_alternative
