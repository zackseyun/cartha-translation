  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: fr
  text: Au septième mois, Ismaël, fils de Nethania, fils d’Élishama, issu de lignée royale[a], vint avec dix hommes. Ils frappèrent Guedalia, qui mourut, ainsi que les Judéens et les Chaldéens[b] qui se trouvaient avec lui à Mitspa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la descendance royale » ; cette expression indique une ascendance royale.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « Chaldéens » peut aussi être rendu par « Babyloniens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: Au septième mois
  rationale: Le tour narratif וַיְהִי introduit l’événement; en français, l’indication temporelle initiale suffit naturellement sans calque lourd comme « il arriva que ».
- source_word: בָּא
  choice: vint
  rationale: Rend simplement le mouvement vers Mitspa et conserve la progression narrative.
- source_word: בֶּן נְתַנְיָה בֶּן אֱלִישָׁמָע
  choice: fils de Netania et petit-fils d’Élishama
  rationale: Le second בֶּן marque ici l’ascendance; « petit-fils » explicite en français naturel la relation généalogique.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: qui était de lignée royale
  rationale: Exprime l’appartenance dynastique sans employer le calque peu naturel « de semence royale »; une note conserve l’image littérale.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: avec dix hommes
  rationale: Formulation française idiomatique de l’accompagnement.
- source_word: וַיַּכּוּ
  choice: Ils frappèrent
  rationale: Conserve le sens premier de נכה et laisse la proposition suivante préciser explicitement la mort de Guedalia.
- source_word: וַיָּמֹת
  choice: qui mourut
  rationale: Le singulier renvoie naturellement à Guedalia; la relative française maintient le résultat sans réduire les deux verbes hébreux à « tuèrent ».
- source_word: הַיְּהוּדִים
  choice: les Judéens
  rationale: Dans ce cadre monarchique et exilique, le terme ethnogéographique « Judéens » est historiquement précis.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: Reproduit directement l’ethnonyme hébreu; dans ce contexte, il désigne les Babyloniens.
- source_word: בַּמִּצְפָּה
  choice: à Mitspa
  rationale: Préposition locative naturelle en français avec le nom de cette ville.
