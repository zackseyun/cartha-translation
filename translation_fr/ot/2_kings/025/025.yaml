  source_fidelity: 'Révision nécessaire : la répétition de בן (« fils de ») exprime une généalogie et ne permet pas d’affirmer qu’Élishama était nécessairement le grand-père immédiat d’Ismaël. Le texte révisé conserve donc « fils de ... fils de ... ». La succession « ils frappèrent ... il mourut » et les autres compléments directs sont préservés.'
  naturalness: Le français demeure narratif, actuel et fluide. « Issu de lignée royale » rend naturellement l’appartenance dynastique sans calquer « semence ».
  terminology: '« Judéens », « Chaldéens », Mitspa et les formes françaises traditionnelles des noms sont appropriés. La note sur les Chaldéens est nuancée : le terme peut désigner les Babyloniens dans ce contexte, plutôt que de les identifier sans réserve.'
  issues:
