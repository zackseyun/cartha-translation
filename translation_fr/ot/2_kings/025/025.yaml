    issue: « petit-fils d’Élishama » restreint indûment la généalogie.
    rationale: En hébreu biblique, בן peut désigner un descendant et la construction « fils de Nethania, fils d’Élishama » ne prouve pas une relation de grand-père immédiat.
  - severity: low
    issue: La note b identifie catégoriquement les Chaldéens aux Babyloniens.
    rationale: Dans ce cadre, « Chaldéens » peut effectivement être rendu par « Babyloniens », mais la note doit présenter cette équivalence comme une possibilité contextuelle, conformément à l’ethnonyme source.
  revised_text: Au septième mois, Ismaël, fils de Nethania, fils d’Élishama, issu de lignée royale[a], vint avec dix hommes. Ils frappèrent Guedalia, qui mourut, ainsi que les Judéens et les Chaldéens[b] qui se trouvaient avec lui à Mitspa.
  revised_footnotes:
