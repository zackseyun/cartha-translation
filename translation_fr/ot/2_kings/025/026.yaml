  text: וַ/יָּקֻ֨מוּ כָל הָ/עָ֜ם מִ/קָּטֹ֤ן וְ/עַד גָּדוֹל֙ וְ/שָׂרֵ֣י הַ/חֲיָלִ֔ים וַ/יָּבֹ֖אוּ מִצְרָ֑יִם כִּ֥י יָרְא֖וּ מִ/פְּנֵ֥י כַשְׂדִּֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: fr
  text: Alors tout le peuple, du plus petit au plus grand, ainsi que les chefs des troupes, se levèrent et se rendirent en Égypte, car ils avaient peur des Chaldéens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le qal narratif de קום marque ici une action résolue. « Se levèrent » conserve cette étape du récit sans la réduire au simple fait de partir.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: Cette formulation naturelle en français rend directement l’expression collective et sa portée globale.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: du plus petit au plus grand
  rationale: La formule hébraïque exprime la totalité à travers une échelle de rang ou d’importance, sans imposer une interprétation fondée uniquement sur l’âge.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: ainsi que les chefs des troupes
  rationale: שָׂרֵי désigne des responsables ou commandants, et חֲיָלִים les forces armées dans ce contexte. « Chefs des troupes » est clair, actuel et suffisamment général.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: et se rendirent en Égypte
  rationale: בוא exprime ici le déplacement jusqu’en Égypte. « Se rendirent en Égypte » convient au point de vue narratif français et évite le déictique peu naturel « vinrent ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de leur départ. « Car » assure un enchaînement narratif naturel et digne.
- source_word: יָרְאוּ
  choice: ils avaient peur
  rationale: Le verbe ירא désigne ici la peur. L’imparfait français présente naturellement le motif qui sous-tend les actions au passé simple.
- source_word: מִפְּנֵי כַשְׂדִּים
  choice: des Chaldéens
  rationale: Avec ירא, מִפְּנֵי désigne ceux que l’on redoute. « Avoir peur des Chaldéens » est l’expression idiomatique française, et « Chaldéens » conserve l’ethnonyme historique traditionnel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit historique, tandis que l’imparfait exprime le motif durable de la fuite. La tournure « du plus petit au plus grand » préserve l’étendue et la relative ambiguïté sociale de l’expression hébraïque.
