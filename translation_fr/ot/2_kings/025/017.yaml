base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: fr
  text: L’un des piliers avait dix-huit coudées de haut, et un chapiteau en bronze était sur lui. Le chapiteau avait trois coudées de haut. Un ouvrage en treillis[a] et des grenades se trouvaient sur le chapiteau, tout autour ; le tout était en bronze. Le second pilier avait les mêmes éléments[b], avec le treillis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un réseau » : le mot hébreu désigne une structure ornementale semblable à un filet.'
    reason: lexical_alternative
  - marker: b
    text: 'La fin de la phrase est elliptique en hébreu. Littéralement : « et comme ceux-ci pour le second pilier, sur le treillis ». Elle indique que le second pilier portait une décoration correspondante.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: avait … de haut
  rationale: Le nom en construction exprime ici la hauteur. Cette tournure est naturelle en français tout en conservant la mesure architecturale du texte.
- source_word: עַמּוּד
  choice: pilier
  rationale: Le terme désigne les deux imposants piliers du Temple. « Pilier » est clair, courant et fidèle dans ce contexte architectural.
- source_word: כֹתֶרֶת
  choice: chapiteau
  rationale: Il s’agit de la partie ornementale placée au sommet d’un pilier ; « chapiteau » est le terme architectural précis en français.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte du mobilier et des éléments architecturaux du Temple, le mot désigne couramment le bronze ou un alliage cuivreux. « Bronze » est la désignation française habituelle et évite l’anachronisme de « laiton ».
- source_word: שְׂבָכָה
  choice: ouvrage en treillis
  rationale: Le mot évoque une structure ornementale en forme de filet. « Ouvrage en treillis » rend à la fois sa forme et sa fonction décorative.
- source_word: רִמֹּנִים
  choice: grenades
  rationale: Le terme désigne littéralement des grenades, ici des ornements ayant la forme de ce fruit. Le rendu direct conserve l’image du texte.
- source_word: סָבִיב
  choice: entouraient
  rationale: Le sens spatial d’une disposition tout autour du chapiteau est exprimé naturellement par le verbe « entouraient ».
- source_word: הַכֹּל נְחֹשֶׁת
  choice: le tout était en bronze
  rationale: Cette formulation restitue clairement la récapitulation concernant la matière des éléments décoratifs.
- source_word: וְכָאֵלֶּה
  choice: avait les mêmes éléments
  rationale: L’expression renvoie aux caractéristiques qui viennent d’être décrites. Le français explicite sobrement l’ellipse sans introduire de détail nouveau.
- source_word: עַל הַשְּׂבָכָה
  choice: y compris le treillis
  rationale: La proposition finale est elliptique. Ce rendu rattache le treillis aux éléments correspondants du second pilier tout en signalant l’incertitude dans une note.
