  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: fr
  text: Pour ce qui est des deux colonnes, de la Mer et des supports que Salomon avait faits pour la maison de Yahweh, on ne pesa pas le bronze de tous ces objets.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y avait pas de poids pour le bronze de tous ces objets ». Dans le contexte, cela peut indiquer que le bronze ne fut pas pesé en raison de sa très grande quantité.'
    reason: La tournure hébraïque לֹא הָיָה מִשְׁקָל peut être rendue littéralement ou exprimer l’absence de pesée ; l’explication par l’abondance demeure contextuelle.
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: les deux colonnes
  rationale: עַמּוּדִים désigne ici les grandes colonnes de bronze du temple. « Colonnes » est le terme architectural naturel en français moderne.
- source_word: הַיָּם הָאֶחָד
  choice: l’unique Mer
  rationale: יָם est le nom technique du grand bassin de bronze. La majuscule signale qu’il s’agit d’un objet cultuel nommé, et « unique » conserve le contraste numérique avec les deux colonnes.
- source_word: וְהַמְּכֹנוֹת
  choice: les supports
  rationale: מְכֹנוֹת désigne les structures ou bases qui portaient les bassins. « Supports » est concret et compréhensible sans imposer l’idée d’un simple socle fixe.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: que Salomon avait fabriqués
  rationale: Le plus-que-parfait convient au regard rétrospectif du récit, et « fabriquer » exprime la confection de ces objets matériels.
- source_word: לְבֵית יְהוָה
  choice: pour la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque, tandis que « Yahweh » représente directement le nom divin יהוה.
- source_word: לֹא הָיָה מִשְׁקָל
  choice: on ne pouvait évaluer le poids
  rationale: Cette formulation française rend l’idiome selon lequel la quantité de bronze dépassait toute mesure pratique, sans supprimer la possibilité d’une lecture plus littérale signalée en note.
- source_word: לִנְחֹשֶׁת
  choice: du bronze
  rationale: נְחֹשֶׁת désigne ici le métal cuivreux employé pour le mobilier du temple; « bronze » est le terme usuel dans ce contexte.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: de tous ces objets
  rationale: כֵּלִים est un terme large. « Objets » englobe naturellement les colonnes, la Mer et les supports, alors que « ustensiles » serait trop étroit.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve sa fonction de nom propre et évite de le remplacer par un titre.
- issue: Sens de לֹא הָיָה מִשְׁקָל
  choice: une quantité dont on ne pouvait évaluer le poids
  alternative: le bronze ne fut pas pesé
  rationale: Le contexte évoque l’extrême abondance du bronze. Le texte hébreu reste toutefois susceptible d’une formulation plus littérale, conservée dans la note plutôt que transformée en affirmation absolue.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’énumération solennelle de l’hébreu; « Mer » est maintenu comme nom traditionnel du grand bassin cultuel, et la note préserve l’ambiguïté de la formule finale.
