revisions:
- from: Quant aux deux colonnes, à l’unique Mer et aux supports que Salomon avait fabriqués pour la maison de Yahweh, on ne pouvait évaluer le poids du bronze de tous ces objets.[a]
  to: Pour ce qui est des deux colonnes, de la Mer et des supports que Salomon avait faits pour la maison de Yahweh, on ne pesa pas le bronze de tous ces objets.[a]
  rationale: La révision remplace l’inférence d’une impossibilité d’évaluation par l’énoncé plus proche de l’idiome hébreu, tout en conservant en note la lecture contextuelle liée à l’abondance du bronze. Elle améliore également la syntaxe française et maintient la « Mer » comme désignation traditionnelle et technique du bassin.
