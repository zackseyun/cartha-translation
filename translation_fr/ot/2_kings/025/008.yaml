source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֞א נְבוּזַרְאֲדָ֧ן רַב טַבָּחִ֛ים עֶ֥בֶד מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: fr
  text: Le septième jour du cinquième mois — c’était la dix-neuvième année du règne de Nabuchodonosor, roi de Babylone — Nebouzaradan, chef de la garde[a] et serviteur du roi de Babylone, vint à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chef des égorgeurs » ; ce titre désigne probablement le commandant de la garde royale ou des exécuteurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי בְּשִׁבְעָה לַחֹדֶשׁ
  choice: Le septième jour du cinquième mois
  rationale: Cette formulation française naturelle conserve précisément la date hébraïque et rend explicite le mot « jour », sous-entendu dans la tournure calendaire.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: c’était la dix-neuvième année du règne de Nabuchodonosor
  rationale: La préposition ל marque ici le calcul des années de règne. L’ajout idiomatique « du règne de » clarifie ce rapport sans modifier le sens.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Traduction directe de la chaîne construite, conservée dans ses deux occurrences.
- source_word: בָּא
  choice: vint
  rationale: Le passé simple convient au registre narratif biblique soutenu mais courant et rend directement le verbe de mouvement בוא.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebouzaradan
  rationale: Translittération française usuelle du nom propre.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Dans le contexte de la cour babylonienne, ce titre désigne vraisemblablement le commandant de la garde royale ou des exécuteurs. « Chef de la garde » exprime clairement la fonction, tandis qu’une note conserve le sens littéral plus rude.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: serviteur du roi de Babylone
  rationale: עֶבֶד peut désigner un serviteur, un subordonné ou un haut fonctionnaire. « Serviteur » préserve cette amplitude sans imposer le sens plus précis d’« esclave » ou de « dignitaire ».
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française conventionnelle du nom de lieu.
