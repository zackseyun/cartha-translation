  text: וְ/אֶת הַ/סִּירֹ֨ת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַֽ/מְזַמְּר֣וֹת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר יְשָֽׁרְתוּ בָ֖/ם לָקָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: fr
  text: Ils emportèrent les marmites, les pelles, les mouchettes[a], les coupes et tous les ustensiles de bronze avec lesquels on accomplissait le service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couteaux » ou « serpettes » ; le terme hébreu peut désigner un instrument tranchant, mais, dans cette liste d’objets du temple, il est généralement compris comme un instrument servant à entretenir les mèches des lampes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: les marmites
  rationale: סִירוֹת désigne couramment des récipients ou des pots destinés notamment à la cuisson. « Marmites » est naturel dans une liste d’ustensiles du temple sans préciser indûment leur fonction exacte.
- source_word: הַיָּעִים
  choice: les pelles
  rationale: יָעִים désigne des instruments servant à enlever les cendres ou à manipuler les braises. « Pelles » convient au contexte cultuel et reste immédiatement compréhensible.
- source_word: הַמְזַמְּרוֹת
  choice: les mouchettes[a]
  rationale: Le terme peut désigner un instrument tranchant, mais, dans cette liste d’objets du temple, il est couramment compris comme un instrument servant à couper ou entretenir les mèches des lampes. La note conserve l’incertitude lexicale.
- source_word: הַכַּפּוֹת
  choice: les coupes
  rationale: כַּפּוֹת peut désigner de petits récipients, plats ou objets en forme de cuillère. « Coupes » fournit ici un équivalent français lisible et suffisamment large.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: tous les ustensiles de bronze
  rationale: כְּלִים est un terme général désignant des objets, instruments ou récipients. « Ustensiles » convient à l’inventaire cultuel, et נְחֹשֶׁת désigne ici le bronze.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: avec lesquels on assurait le service
  rationale: שרת évoque ici le service accompli dans le sanctuaire. La tournure impersonnelle française restitue le sujet non exprimé du verbe hébreu sans identifier plus précisément les officiants.
- source_word: לָקָחוּ
  choice: Ils emportèrent
  rationale: Le verbe signifie littéralement « ils prirent »; dans le contexte du pillage et de l’enlèvement du mobilier du temple, « emportèrent » exprime naturellement le mouvement impliqué.
