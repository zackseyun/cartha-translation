base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: fr
  text: 'Guedalia leur fit serment, à eux et à leurs hommes[a], puis il leur dit : « N’ayez pas peur des serviteurs des Chaldéens[b]. Demeurez dans le pays, servez le roi de Babylone, et tout ira bien pour vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « leurs hommes » ; il peut s’agir de leurs compagnons ou de leurs soldats.
    reason: lexical_alternative
  - marker: b
    text: Les « Chaldéens » désignent ici les Babyloniens. Leurs « serviteurs » peuvent être leurs agents ou leurs administrateurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: s’engagea par serment
  rationale: Le niphal de שׁבע signifie « jurer, prêter serment ». Cette formulation française exprime naturellement un engagement solennel pris envers le groupe sans préciser davantage le contenu du serment.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: et envers leurs hommes
  rationale: אַנְשֵׁי signifie littéralement « hommes de ». Dans ce contexte, il s’agit vraisemblablement des hommes accompagnant les chefs, peut-être leurs soldats, mais le texte ne permet pas de le préciser avec certitude.
- source_word: אַל תִּירְאוּ
  choice: N’ayez pas peur
  rationale: Traduction directe et naturelle de l’impératif négatif du verbe ירא.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: des serviteurs des Chaldéens
  rationale: עַבְדֵי signifie littéralement « serviteurs de ». Il peut s’agir ici d’agents ou de représentants de l’autorité babylonienne, mais « serviteurs » préserve l’expression hébraïque.
- source_word: הַכַּשְׂדִּים
  choice: les Chaldéens
  rationale: כַּשְׂדִּים est l’appellation ethnique hébraïque traditionnelle. Dans ce contexte politique, elle désigne les Babyloniens.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Restez dans le pays
  rationale: ישׁב peut signifier habiter, demeurer ou rester. Après la conquête et les déplacements de population, « restez » rend bien l’appel à ne pas quitter le pays tout en conservant le sens de résidence.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: servez le roi de Babylone
  rationale: עבד suivi d’une personne signifie couramment « servir ». Le contexte implique une soumission politique, sans qu’il soit nécessaire de l’expliciter dans la traduction.
- source_word: וְיִטַב לָכֶם
  choice: et tout ira bien pour vous
  rationale: 'Cette tournure idiomatique française rend le sens impersonnel de יטב : la situation leur sera favorable.'
