source:
  edition: WLC
  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: fr
  text: Les Chaldéens[b] brisèrent les colonnes de bronze qui se trouvaient dans la maison de Yahweh, ainsi que les supports[a] et la mer de bronze qui se trouvait dans la maison de Yahweh, puis ils en emportèrent le bronze à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bases »; il s’agit des structures qui soutenaient les bassins du temple.
    reason: lexical_alternative
  - marker: b
    text: Les « Chaldéens » désignent ici les forces babyloniennes.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: les colonnes de bronze
  rationale: עַמּוּדִים désigne des colonnes ou piliers. « Colonnes » est naturel en français dans le contexte architectural du temple, et « bronze » est le terme moderne usuel pour נְחֹשֶׁת.
- source_word: אֲשֶׁר בֵּית יְהוָה / אֲשֶׁר בְּבֵית יְהוָה
  choice: qui se trouvaient dans la maison de Yahweh / qui se trouvait dans la maison de Yahweh
  rationale: La première proposition relative est sans préposition ni verbe exprimé, mais le parallèle explicite avec בְּבֵית dans la seconde favorise nettement une indication de lieu. Le verbe « se trouver » restitue naturellement l’ellipse hébraïque.
- source_word: הַמְּכֹנוֹת
  choice: les supports
  rationale: מְכֹנוֹת désigne les structures servant de supports aux bassins du temple. « Supports » est intelligible et concret en français moderne; « bases » demeure possible et figure en note.
- source_word: יָם הַנְּחֹשֶׁת
  choice: la Mer de bronze
  rationale: La traduction littérale de יָם, « mer », conserve le nom et l’image propres à ce grand bassin du temple. La majuscule signale qu’il s’agit ici d’un objet particulier.
- source_word: שִׁבְּרוּ
  choice: brisèrent
  rationale: Le verbe שׁבר exprime l’action de casser les grands objets de bronze, vraisemblablement afin d’en transporter le métal. « Brisèrent » est direct et suffit en français, la suite indiquant le démantèlement.
- source_word: כַשְׂדִּים
  choice: les Chaldéens
  rationale: Cette désignation reproduit précisément l’ethnonyme hébreu plutôt que de le remplacer dans le corps du texte par son référent contextuel, les forces babyloniennes.
- source_word: וַיִּשְׂאוּ אֶת נְחֻשְׁתָּם
  choice: puis ils en emportèrent le bronze
  rationale: נשא signifie ici emporter vers une destination. Le pronom suffixe de נְחֻשְׁתָּם renvoie collectivement aux objets brisés; la tournure française « en emportèrent le bronze » rend ce rapport plus naturellement que « leur bronze ».
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le ה directionnel marque le mouvement vers Babylone; « à Babylone » est l’équivalent idiomatique français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération courante plutôt que remplacé par un titre, ce qui préserve son statut de nom propre dans le texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: L’hébreu porte directement le tétragramme. « Yahweh » préserve le nom propre et correspond à sa vocalisation savante courante, sans le remplacer par le titre « le Seigneur ».
translation_notes:
  register: Français international moderne, digne et lisible. La coordination hébraïque est légèrement structurée par « ainsi que » et « puis » pour la fluidité, sans modifier la succession des actions. « Maison » conserve le terme cultuel du texte source, et « Mer » préserve le nom imagé du grand bassin.
