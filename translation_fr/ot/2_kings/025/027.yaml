    issue: « C’était l’année où il devint roi »
    rationale: Cette phrase transforme une indication de règne (בִּשְׁנַת מָלְכוֹ) en affirmation d’accession au trône. La première année est plausible dans le contexte, mais demeure une inférence à réserver à la note.
