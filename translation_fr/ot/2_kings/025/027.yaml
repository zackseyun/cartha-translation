translation_notes:
  register: Français international moderne, narratif et digne. La date est placée en tête selon l’usage naturel du français. L’image hébraïque « relever la tête » est maintenue afin de préserver sa force, puis explicitée par le contexte et une note. Les marqueurs de notes sont placés immédiatement après les éléments concernés.
