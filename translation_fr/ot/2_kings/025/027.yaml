  to: La trente-septième année de l’exil de Jojakin, roi de Juda, le vingt-septième jour du douzième mois, Évil-Merodak[b], roi de Babylone, dans l’année de son règne[c], releva la tête[a] de Jojakin, roi de Juda, en le faisant sortir de prison.
