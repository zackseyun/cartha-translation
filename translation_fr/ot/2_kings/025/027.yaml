  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: fr
  text: La trente-septième année de l’exil de Jojakin, roi de Juda, le vingt-septième jour du douzième mois, Évil-Merodak[b], roi de Babylone, dans l’année de son règne[c], releva la tête[a] de Jojakin, roi de Juda, en le faisant sortir de prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « relever la tête de quelqu’un » signifie ici lui témoigner de la faveur ou lui rendre sa dignité; cela se manifeste par sa libération.
    reason: lexical_alternative
  - marker: b
    text: Évil-Merodak est aussi connu dans les sources historiques sous le nom d’Amel-Marduk.
    reason: cultural_note
  - marker: c
    text: Litt. « dans l’année de son règne ». Le contexte peut désigner la première année de son règne, sans que le texte l’exprime explicitement.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: La trente-septième année…
  rationale: La formule narrative hébraïque introduit le nouvel épisode. En français actuel, commencer directement par l’indication temporelle évite le calque pesant « Il arriva que » tout en conservant la fonction discursive.
- source_word: לְגָלוּת
  choice: de l’exil
  rationale: גָּלוּת désigne la déportation ou la condition d’exilé qui en résulte. « Exil » est le terme français courant et précis.
- source_word: יְהוֹיָכִין
  choice: Jojakin
  rationale: Forme française biblique claire, proche du nom hébreu et distincte de Jojakim.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: le vingt-septième jour du douzième mois
  rationale: Rend naturellement en français la formule hébraïque de datation sans ajouter le nom d’un mois absent du texte.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Évil-Merodak
  rationale: Forme traditionnelle française du nom royal biblique; la forme akkadienne historiquement reconstruite est donnée en note.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: C’était l’année où il devint roi
  rationale: Le syntagme situe l’événement dans l’année de l’accession ou du règne d’Évil-Merodak. Cette formulation française exprime le sens probable sans introduire explicitement le nombre ordinal « première » dans le texte.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: releva la tête de
  rationale: Conserve l’image hébraïque de relèvement et de restauration, dont le sens favorable est expliqué en note.
- source_word: מִבֵּית כֶּלֶא
  choice: le fit sortir de prison
  rationale: Exprime clairement le mouvement hors du lieu de détention porté par מִן, avec une légère explicitation syntaxique naturelle en français.
