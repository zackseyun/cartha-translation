    issue: Ancrage de la note sur l’idiome
    rationale: La note a explique « releva la tête », mais son marqueur était placé après « prison ». Il doit suivre l’idiome.
  - severity: low
    issue: Ancrage de la note sur le nom royal
    rationale: La note historique sur Évil-Merodak doit être attachée au nom lui-même, non à « Babylone ».
