  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: fr
  text: La ville fut ainsi assiégée jusqu’à la onzième année du règne du roi Sédécias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la ville entra dans le siège », expression hébraïque signifiant qu’elle se trouvait en état de siège.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: La ville resta donc assiégée
  rationale: Littéralement, la ville « vint dans le siège ». Cette tournure hébraïque décrit ici l’état durable de la ville. « Resta assiégée » rend naturellement en français la valeur résultative et continue de l’expression; « donc » marque la progression narrative du waw.
- source_word: עַד
  choice: jusqu’à
  rationale: La préposition indique le terme temporel de l’état de siège.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: la onzième année
  rationale: Dans une formule de datation royale, le cardinal hébreu se rend naturellement en français par l’ordinal.
- source_word: לַמֶּלֶךְ
  choice: du règne du roi
  rationale: Dans cette formule chronologique, ל indique l’année du règne. L’explicitation « du règne » évite en français l’ambiguïté de « l’année du roi ».
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et courante du nom biblique.
theological_decisions: []
