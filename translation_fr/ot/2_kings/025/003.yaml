  text: בְּ/תִשְׁעָ֣ה לַ/חֹ֔דֶשׁ וַ/יֶּחֱזַ֥ק הָ/רָעָ֖ב בָּ/עִ֑יר וְ/לֹא הָ֥יָה לֶ֖חֶם לְ/עַ֥ם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: fr
  text: Le neuvième jour du mois, la famine s’aggrava dans la ville, et il n’y avait pas de pain[a] pour le peuple du pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nourriture », car le mot traduit par « pain » peut désigner plus largement les vivres.
    reason: lexical_alternative
  - marker: b
    text: Dans certains contextes, l’expression « peuple du pays » peut désigner plus précisément les gens du peuple ou la population locale.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: Le neuvième jour du mois
  rationale: L’hébreu dit littéralement « le neuvième du mois ». Le français explicite naturellement « jour ».
- source_word: וַיֶּחֱזַק
  choice: s’aggrava
  rationale: Le verbe חזק exprime ici l’intensification de la famine. « S’aggrava » restitue ce sens dans un français naturel et concis.
- source_word: הָרָעָב
  choice: la famine
  rationale: Dans le contexte du siège, רָעָב désigne une pénurie générale de nourriture, et non la simple sensation de faim.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Traduction directe et idiomatique de la locution hébraïque.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: et il n’y avait pas de pain
  rationale: Le texte conserve le terme concret « pain », tout en laissant une note signaler qu’il peut désigner plus largement la nourriture.
- source_word: לְעַם הָאָרֶץ
  choice: pour le peuple du pays
  rationale: Cette traduction proche de l’hébreu préserve l’étendue possible de l’expression sans imposer l’interprétation sociologique plus étroite de « gens du peuple ».
