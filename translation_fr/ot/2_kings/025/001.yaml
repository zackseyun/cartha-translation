source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבֻכַדְנֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֧וּא וְ/כָל חֵיל֛/וֹ עַל יְרוּשָׁלִַ֖ם וַ/יִּ֣חַן עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֖י/הָ דָּיֵ֥ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: fr
  text: La neuvième année de son règne, dans le dixième mois, le dixième jour du mois, Nabuchodonosor[a], roi de Babylone, vint avec toute son armée contre Jérusalem. Il établit son camp contre la ville, et ses troupes construisirent tout autour d’elle des ouvrages de siège[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom est aussi transcrit « Nebucadnetsar ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner un retranchement, une rampe ou, plus largement, les travaux militaires construits contre une ville assiégée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: La neuvième année…
  rationale: La formule narrative hébraïque introduit ici surtout la datation. En français courant, elle peut rester implicite sans recourir à l’archaïsme « il arriva que ».
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: La neuvième année de son règne
  rationale: Rend directement la formule de datation royale tout en conservant le pronom contextuel « son ».
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: au dixième mois, le dixième jour du mois
  rationale: Conserve l’ordre et la répétition de la formule calendaire hébraïque, sans imposer le nom d’un mois moderne.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom royal; une translittération plus proche de la forme hébraïque est signalée en note.
- source_word: הוּא וְכָל חֵילוֹ
  choice: avec toute son armée
  rationale: Exprime naturellement en français que le roi lui-même vient accompagné de l’ensemble de ses forces.
- source_word: עַל יְרוּשָׁלַםִ
  choice: contre Jérusalem
  rationale: Dans ce contexte militaire, עַל marque une action hostile dirigée contre la ville.
- source_word: וַיִּחַן עָלֶיהָ
  choice: Il établit son camp contre la ville
  rationale: Rend la prise de position militaire contre Jérusalem, avec « la ville » pour éviter un pronom français ambigu.
- source_word: וַיִּבְנוּ עָלֶיהָ דָּיֵק סָבִיב
  choice: ses troupes construisirent tout autour d’elle des ouvrages de siège
  rationale: Le verbe pluriel renvoie naturellement aux forces du roi. דָּיֵק désigne des aménagements militaires élevés contre une ville assiégée; le pluriel collectif français « ouvrages de siège » en préserve l’étendue sans préciser indûment leur forme.
