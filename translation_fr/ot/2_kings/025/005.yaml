  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחַ֣ר הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥גוּ אֹת֖/וֹ בְּ/עַרְב֣וֹת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: fr
  text: Mais l’armée des Chaldéens[a] poursuivit le roi et le rattrapa dans les plaines de Jéricho[b]. Toute son armée se dispersa loin de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’armée des Babyloniens ». L’hébreu dit « Chaldéens », terme qui désigne dans ce contexte les forces babyloniennes.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les steppes de Jéricho ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: l’armée des Chaldéens
  rationale: חֵיל désigne ici une force militaire, et כַּשְׂדִּים est rendu directement par « Chaldéens », désignation employée dans le texte hébreu pour les forces babyloniennes.
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  choice: poursuivit le roi
  rationale: En français, « poursuivre le roi » exprime naturellement רדף אַחַר sans reproduire de façon artificielle la préposition hébraïque.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: le rattrapa
  rationale: נשׂג indique que les poursuivants rejoignent celui qu’ils pourchassent ; « rattraper » est précis et naturel dans ce récit.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: dans les plaines de Jéricho
  rationale: עֲרָבוֹת désigne une région de plaines arides ou de steppes ; « plaines » est clair en français courant, tandis qu’une note conserve l’autre nuance.
- source_word: וְכָל חֵילוֹ
  choice: Toute son armée
  rationale: Le nom collectif חֵיל désigne ici les troupes du roi ; « toute son armée » est idiomatique et fidèle à כָל.
- source_word: נָפֹצוּ מֵעָלָיו
  choice: se dispersa loin de lui
  rationale: נפץ exprime la dispersion des troupes, et מֵעָלָיו leur éloignement d’avec le roi. Le singulier s’accorde naturellement avec le collectif français « armée ».
