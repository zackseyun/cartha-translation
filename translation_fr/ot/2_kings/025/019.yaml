revisions:
- from: Il prit aussi dans la ville un fonctionnaire[a] responsable des hommes de guerre, cinq hommes admis en présence du roi[b] qui se trouvaient dans la ville, le secrétaire, chef de l’armée, qui mobilisait[c] la population du pays, et soixante hommes de cette population qui se trouvaient dans la ville.
  to: Il prit aussi dans la ville un fonctionnaire[a] chargé des hommes de guerre, cinq hommes parmi ceux qui avaient accès au roi[b], qui se trouvaient dans la ville, le secrétaire du chef de l’armée, qui mobilisait[c] le peuple du pays, et soixante hommes du peuple du pays qui se trouvaient dans la ville.
  rationale: La révision corrige l’analyse syntaxique déterminante de « le secrétaire du chef de l’armée ». Elle rend aussi explicitement le partitif de l’hébreu et emploie uniformément « peuple du pays », sans résoudre au-delà du texte les nuances sociales de cette expression. Les notes conservent les alternatives lexicales et l’explication de l’idiome.
