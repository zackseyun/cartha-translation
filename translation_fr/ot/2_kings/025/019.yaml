source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: fr
  text: Il prit aussi dans la ville un fonctionnaire[a] chargé des hommes de guerre, cinq hommes parmi ceux qui avaient accès au roi[b], qui se trouvaient dans la ville, le secrétaire du chef de l’armée, qui mobilisait[c] le peuple du pays, et soixante hommes du peuple du pays qui se trouvaient dans la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un eunuque » ; le terme hébreu peut désigner soit un eunuque au sens propre, soit un fonctionnaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui voyaient la face du roi », expression hébraïque désignant des hommes ayant directement accès au roi, probablement des dignitaires ou des courtisans.
    reason: cultural_note
  - marker: c
    text: Ou « enrôlait » ou « convoquait pour le service militaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: fonctionnaire
  rationale: Le terme peut désigner un eunuque au sens propre ou un fonctionnaire de haut rang. Le contexte précise ici une responsabilité militaire, sans permettre d’affirmer son statut physique.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: responsable des hommes de guerre
  rationale: פָקִיד désigne une personne établie dans une fonction de surveillance ou de commandement. Cette formulation reste proche de l’hébreu tout en étant claire en français.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: admis en présence du roi
  rationale: L’expression idiomatique « voir la face du roi » désigne des hommes ayant directement accès au souverain. La traduction communique ce sens courtisan sans imposer une fonction plus précise.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: le secrétaire, chef de l’armée
  rationale: L’hébreu juxtapose deux désignations de manière concise. La traduction conserve cette apposition et laisse le participe suivant préciser la fonction militaire de cet homme.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: qui mobilisait la population du pays
  rationale: Le participe causatif de צבא évoque ici l’appel et l’organisation de personnes pour le service militaire. « Mobiliser » garde cette portée sans affirmer explicitement une conscription forcée.
- source_word: עַם הָאָרֶץ
  choice: la population du pays
  rationale: L’expression désigne les habitants du pays et peut comporter une nuance sociale. « Population du pays » demeure assez large pour ne pas la réduire aux seules classes populaires.
- source_word: נִמְצְאוּ / הַנִּמְצָאִים
  choice: se trouvaient
  rationale: Dans ce contexte narratif, le niphal de מצא indique que ces personnes étaient présentes ou furent trouvées dans la ville. « Se trouvaient » est naturel en français et conserve l’idée de leur localisation.
- source_word: לָקַח
  choice: prit
  rationale: Le verbe signifie normalement « prendre ». Le contexte implique qu’il s’agit de prisonniers emmenés, mais la traduction n’ajoute pas une violence que ce verbe n’exprime pas à lui seul.
