  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: fr
  text: 'Lorsque tous les chefs des troupes, eux et leurs hommes, apprirent que le roi de Babylone avait nommé Guedalia[a], ils vinrent auprès de Guedalia à Mitspa : Ismaël, fils de Netania, Yohanân, fils de Qaréah, Seraya, fils de Tanhoumeth le Netophatite, et Yaazania, fils du Maakatite, eux et leurs hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait confié une charge à Guedalia » ; le verbe hébreu peut désigner le fait de confier à quelqu’un une responsabilité ou une fonction de direction.
    reason: alternative lexicale
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: les chefs des troupes
  rationale: שָׂרִים désigne des chefs ou responsables, et חֲיָלִים les forces militaires dans ce contexte. « Chefs des troupes » est naturel en français moderne sans préciser indûment leur grade.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: eux et leurs hommes
  rationale: La tournure emphatique distingue les chefs des hommes qui leur sont attachés. Le possessif, implicite dans le contexte, rend l’expression naturelle en français.
- source_word: הִפְקִיד
  choice: avait établi
  rationale: Le verbe exprime le fait de confier une responsabilité ou de placer quelqu’un dans une fonction. « Avait établi » conserve cette amplitude sans ajouter explicitement le titre de gouverneur.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: vinrent le rejoindre à Mitspa
  rationale: Mitspa indique le lieu où se trouve Guedalia. « Le rejoindre à Mitspa » restitue clairement et naturellement le mouvement vers lui.
- source_word: הַנְּטֹפָתִי
  choice: le Netophatite
  rationale: Le gentilé hébreu est conservé sous une forme francisée, comme désignation géographique ou ethnique de Tanhoumeth.
- source_word: הַמַּעֲכָתִי
  choice: le Maakatite
  rationale: Le gentilé est conservé plutôt que paraphrasé par « originaire de Maaka », afin de respecter la forme du texte source.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן ...
  choice: 'ils vinrent le rejoindre ... : Ismaël ... Yohanân ... Seraya ... et Yaazania'
  rationale: Les noms sont en apposition au groupe des chefs. Les deux-points permettent de préserver cette structure tout en donnant une phrase française fluide.
- source_word: וְאַנְשֵׁיהֶם
  choice: eux et leurs hommes
  rationale: Cette reprise clôt la liste en associant les chefs nommés à leurs hommes et fait écho à la formulation du début du verset.
