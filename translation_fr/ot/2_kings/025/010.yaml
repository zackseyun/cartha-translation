  text: וְ/אֶת חוֹמֹ֥ת יְרוּשָׁלִַ֖ם סָבִ֑יב נָֽתְצוּ֙ כָּל חֵ֣יל כַּשְׂדִּ֔ים אֲשֶׁ֖ר רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/010.yaml
  text: And all the army of the Chaldeans who were with the captain of the guard tore down the walls of Jerusalem all around[a].
translation:
  language: fr
  text: Toute l’armée des Chaldéens qui était avec le chef de la garde démolit les murailles de Jérusalem tout autour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef des exécuteurs » ou « chef de la garde personnelle » pour le titre hébreu rab-tabbahim.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת
  choice: la muraille
  rationale: Le pluriel hébreu désigne l’ensemble des murs fortifiés de la ville. En français, « la muraille de Jérusalem » exprime naturellement cet ensemble défensif.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: סָבִיב
  choice: sur tout son pourtour
  rationale: Cette expression rend l’étendue circulaire indiquée par l’adverbe hébreu et précise que la muraille entourant la ville fut démolie.
- source_word: נָתְצוּ
  choice: démolit
  rationale: Le verbe נתץ exprime la destruction ou l’abattage d’un ouvrage. « Démolir » convient à une fortification et reste naturel en français.
- source_word: כָּל חֵיל
  choice: toute l’armée
  rationale: כָּל porte sur le nom collectif חֵיל, qui désigne ici la force armée chaldéenne. Le singulier du verbe français s’accorde avec le collectif « armée ».
- source_word: כַּשְׂדִּים
  choice: des Chaldéens
  rationale: Rendu direct de l’ethnonyme hébreu, sans le remplacer par l’appellation contextuelle « Babyloniens ».
- source_word: אֲשֶׁר
  choice: qui était avec
  rationale: La particule relative relie elliptiquement l’armée au dignitaire mentionné. « Qui était avec » explicite seulement la relation minimale exigée par le français.
- source_word: רַב טַבָּחִים
  choice: chef de la garde
  rationale: Ce titre royal et militaire désigne un haut responsable de la garde, probablement chargé aussi des exécutions. « Chef de la garde » est clair et idiomatique, tandis que les sens plus littéraux sont conservés en note.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve l’ordre narratif naturel et le collectif « toute l’armée ». « Sur tout son pourtour » évite l’ambiguïté possible de « tout autour » et rend explicitement l’étendue de la muraille sans ajouter d’interprétation théologique.
