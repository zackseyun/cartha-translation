base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: fr
  text: Le roi de Babylone les frappa et les mit à mort[a] à Ribla, dans le pays de Hamath. Ainsi, Juda fut déporté de sa terre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie successivement deux verbes : « les frappa » et « les mit à mort ». On pourrait aussi traduire l’ensemble par « les tua ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « Juda partit en exil de sa terre ». Dans ce contexte, le verbe hébreu peut être rendu par une tournure active ou passive ; le passif met en évidence le caractère forcé de la déportation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: les frappa
  rationale: Le verbe נכה signifie couramment « frapper ». Cette traduction maintient la distinction avec le verbe suivant, qui exprime explicitement la mise à mort.
- source_word: וַיְמִיתֵם
  choice: les fit mourir
  rationale: La forme causative de מות signifie « faire mourir » ou « mettre à mort ». « Les fit mourir » en conserve la valeur causative sans préciser davantage les modalités de l’exécution.
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction naturelle et directe de la construction hébraïque.
- source_word: בְּרִבְלָה
  choice: à Ribla
  rationale: « À » est la préposition française naturelle devant le nom de cette ville.
- source_word: בְּאֶרֶץ חֲמָת
  choice: dans le pays de Hamath
  rationale: Cette formulation rend directement l’expression géographique tout en restant claire en français moderne.
- source_word: וַיִּגֶל
  choice: fut déporté
  rationale: Dans ce contexte d’exil imposé, « fut déporté » exprime clairement l’arrachement forcé sous-entendu, tandis qu’une note conserve la possibilité de rendre la forme hébraïque de manière plus active.
- source_word: יְהוּדָה
  choice: Juda
  rationale: 'Le nom est conservé tel quel, avec sa portée métonymique possible : le royaume, le pays ou sa population.'
- source_word: מֵעַל אַדְמָתוֹ
  choice: loin de sa terre
  rationale: La préposition composée מֵעַל évoque l’éloignement hors du territoire, et אֲדָמָה désigne ici la terre de Juda. « Loin de sa terre » est naturel et souligne l’arrachement sans perdre le sens géographique.
