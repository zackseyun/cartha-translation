  to: Le roi de Babylone les frappa et les mit à mort[a] à Ribla, dans le pays de Hamath. Ainsi, Juda fut déporté de sa terre.[b]
  rationale: La révision remplace une tournure française peu idiomatique par « les mit à mort », supprime l’ajout sémantique « loin », et ancre chaque note à l’élément qu’elle commente. Elle maintient la concision, la portée collective de « Juda » et l’ambiguïté contrôlée entre formulation active et passive de l’exil.
