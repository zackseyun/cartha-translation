  source_fidelity: 'La première proposition conserve correctement les deux verbes hébreux successifs : le roi frappe, puis met à mort. « Loin de sa terre » ajoute toutefois une notion de distance que מֵעַל אַדְמָתוֹ n’explicite pas ; « de sa terre » est plus exact. « Fut déporté » rend de façon recevable l’exil contraint dans ce contexte.'
  naturalness: « Les fit mourir » est grammatical mais peu idiomatique en français moderne dans ce contexte narratif. « Les mit à mort » est naturel, sobre et rend bien la valeur causative. Le déplacement de l’appel de note après cette expression rend son objet immédiatement identifiable.
  terminology: « Babylone », « Ribla », « Hamath » et « Juda » sont cohérents. « Mettre à mort » évite d’ajouter la notion juridique plus précise d’« exécuter » tout en distinguant l’action de « frapper ».
