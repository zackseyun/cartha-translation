id: 2KI.25.30
reference: 2 Kings 25:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַ֨ת תָּמִ֧יד נִתְּנָה לּ֛/וֹ מֵ/אֵ֥ת הַ/מֶּ֖לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽ/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: fr
  text: Sa provision[a], une provision continuelle, lui était accordée de la part du roi, la part prévue pour chaque jour, jour après jour[b], tous les jours de sa vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ration », « part » ou « allocation ». Le terme hébreu désigne une provision qui lui était attribuée.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’affaire d’un jour en son jour », expression indiquant que la provision était fournie quotidiennement, selon la part prévue pour chaque jour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: provision
  rationale: Le nom désigne ici ce qui est attribué à Yehoyakîn pour son entretien. « Provision » reste assez large pour couvrir une ration ou une allocation matérielle sans suggérer nécessairement une somme d’argent.
- source_word: תָּמִיד
  choice: continuelle
  rationale: Ce terme exprime la permanence et la régularité de la provision pendant toute la période indiquée.
- source_word: נִתְּנָה
  choice: était accordée
  rationale: Le passif de נתן signifie littéralement « était donnée ». Dans le contexte d’une provision royale régulière, « était accordée » est naturel tout en conservant le sens de don ou d’attribution.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: de la part du roi
  rationale: Cette formulation conserve la valeur de provenance de la locution hébraïque et identifie le roi comme source de la provision.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: la part prévue pour chaque jour, jour après jour
  rationale: La tournure rend à la fois l’idée distributive de ce qui revient à chaque jour et la répétition quotidienne exprimée par l’idiome hébreu, sans calque obscur en français.
- source_word: כֹּל יְמֵי חַיָּו
  choice: tous les jours de sa vie
  rationale: Formulation française directe qui reproduit fidèlement l’expression hébraïque de durée viagère.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « provision, une provision continuelle » conserve l’insistance de l’hébreu. « Jour après jour » explicite naturellement l’idiome distributif sans supprimer la notion de part quotidienne.
