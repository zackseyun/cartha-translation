source:
  edition: WLC
  text: וְ/שִׁנָּ֕א אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם תָּמִ֛יד לְ/פָנָ֖י/ו כָּל יְמֵ֥י חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: fr
  text: Il changea ses vêtements de prison et prit constamment ses repas en sa présence[a], tous les jours de sa vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant lui » ; l’expression peut aussi évoquer des repas pris à la table du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: Il changea
  rationale: Le piel de שׁנה signifie ici « changer ». Cette formulation reste proche de l’hébreu tout en indiquant naturellement le changement de tenue.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: ses vêtements de prison
  rationale: La construction désigne les vêtements liés à son emprisonnement. « Vêtements de prison » est clair et naturel en français moderne.
- source_word: וְאָכַל לֶחֶם
  choice: et prit ses repas
  rationale: Littéralement « et mangea du pain », expression hébraïque courante pour prendre ses repas. Le rendu français restitue ici le sens idiomatique sans suggérer qu’il ne mangeait que du pain.
- source_word: תָּמִיד
  choice: constamment
  rationale: תמיד exprime la continuité ou la régularité durable, précisée ensuite par « tous les jours de sa vie ».
- source_word: לְפָנָיו
  choice: en sa présence
  rationale: Le sens littéral est « devant lui ». « En sa présence » en conserve la portée sans imposer explicitement l’interprétation plus précise d’un repas à la table du roi.
- source_word: כָּל יְמֵי חַיָּיו
  choice: tous les jours de sa vie
  rationale: Ce rendu fidèle reprend l’expression hébraïque usuelle désignant toute la durée restante de sa vie.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. L’idiome « manger du pain » est rendu par « prendre ses repas », tandis que l’ambiguïté de לְפָנָיו est conservée dans le texte et explicitée en note.
