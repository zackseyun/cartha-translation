  text: וְ/אֵת֩ כָּל אַנְשֵׁ֨י הַ/חַ֜יִל שִׁבְעַ֣ת אֲלָפִ֗ים וְ/הֶ/חָרָ֤שׁ וְ/הַ/מַּסְגֵּר֙ אֶ֔לֶף הַ/כֹּ֕ל גִּבּוֹרִ֖ים עֹשֵׂ֣י מִלְחָמָ֑ה וַ/יְבִיאֵ֧/ם מֶֽלֶךְ בָּבֶ֛ל גּוֹלָ֖ה בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: fr
  text: Le roi de Babylone emmena en exil à Babylone tous les hommes de valeur, au nombre de sept mille, ainsi que les artisans et les forgerons[a], au nombre de mille. Tous étaient des hommes vaillants, aptes au combat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les artisans et les ouvriers du métal ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « faisant la guerre », c’est-à-dire capables d’assurer un service militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: hommes de valeur
  rationale: L’expression désigne des hommes forts et capables, notamment utiles sur le plan militaire. « Hommes de valeur » en conserve la portée sans la réduire d’emblée à une fonction militaire précise.
- source_word: שִׁבְעַת אֲלָפִים
  choice: au nombre de sept mille
  rationale: Cette formulation française naturelle exprime clairement l’effectif du premier groupe.
- source_word: הֶחָרָשׁ
  choice: les artisans
  rationale: Le terme désigne largement des ouvriers qualifiés travaillant divers matériaux ; « artisans » évite de préciser indûment leur métier.
- source_word: הַמַּסְגֵּר
  choice: les forgerons
  rationale: Le mot désigne probablement des ouvriers du métal. « Forgerons » est concis et intelligible, tandis que le sens exact du métier reste signalé en note.
- source_word: אֶלֶף
  choice: au nombre de mille
  rationale: Cette expression rattache clairement le nombre au groupe formé par les artisans et les forgerons.
- source_word: הַכֹּל
  choice: Tous
  rationale: Le terme récapitule les groupes mentionnés. Une nouvelle phrase rend cette reprise claire et naturelle en français.
- source_word: גִּבּוֹרִים
  choice: hommes vaillants
  rationale: Le mot évoque des hommes forts et valeureux, avec ici une nette connotation guerrière.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: aptes au combat
  rationale: Littéralement « faisant la guerre », l’expression désigne des hommes capables de servir militairement. « Aptes au combat » transmet ce sens idiomatique sans suggérer nécessairement qu’ils combattaient à cet instant.
- source_word: וַיְבִיאֵם ... גּוֹלָה
  choice: emmena aussi en exil
  rationale: Le verbe signifie « amener » et le nom גּוֹלָה précise la condition de déportation. La formulation choisie est naturelle dans ce contexte.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le hé directionnel indique un mouvement vers Babylone, rendu normalement en français par « à Babylone ».
