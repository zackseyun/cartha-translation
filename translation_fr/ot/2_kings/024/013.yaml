  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: fr
  text: Il emporta de là tous les trésors de la maison de Yahweh et les trésors du palais royal, et il mit en pièces tous les objets en or que Salomon, roi d’Israël, avait faits dans le temple de Yahweh[a], comme Yahweh l’avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avait faits pour le temple de Yahweh ».'
    reason: La préposition hébraïque בְ est naturellement locative (« dans ») ; dans ce contexte, elle peut aussi être comprise comme indiquant la destination ou l’usage cultuel des objets.
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: Il emporta de là
  rationale: Le hiphil de יצא exprime ici le retrait des trésors hors du lieu; « emporta de là » est naturel en français et convient au contexte de pillage.
- source_word: אוֹצְרוֹת
  choice: trésors
  rationale: Dans ce contexte, le terme désigne les biens précieux enlevés plutôt que les pièces où ils étaient conservés.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction concrète de בֵּית préserve la distinction lexicale avec הֵיכַל plus loin dans le verset.
- source_word: בֵּית הַמֶּלֶךְ
  choice: le palais royal
  rationale: Le sens contextuel est le palais du roi; cette formulation est plus naturelle en français moderne que « la maison du roi ».
- source_word: וַיְקַצֵּץ
  choice: il mit en pièces
  rationale: Le piel de קצץ décrit l’action de découper ou de démembrer les objets; « mettre en pièces » conserve ce sens sans préciser indûment la méthode.
- source_word: כְּלֵי הַזָּהָב
  choice: les objets en or
  rationale: כְּלִי est un terme large désignant des objets, articles ou récipients; « objets » évite de limiter le sens aux seuls vases.
- source_word: בְּהֵיכַל יְהוָה
  choice: pour le temple de Yahweh
  rationale: הֵיכַל désigne ici l’édifice sacré. La préposition ב peut être comprise dans le cadre de la fabrication destinée au temple; cette lecture donne un français naturel tout en restant proche du contexte.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: comme Yahweh l’avait annoncé
  rationale: La formule signale l’accomplissement d’une parole divine antérieure; « annoncé » exprime naturellement cette valeur en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Rapport de בְּהֵיכַל יְהוָה avec עָשָׂה
  choice: avait faits pour le temple de Yahweh
  alternative: avait faits dans le temple de Yahweh
  rationale: L’hébreu permet formellement « dans le temple », mais le contexte des objets cultuels fabriqués par Salomon favorise une destination ou une appartenance au temple. Une note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et narratif. « Maison de Yahweh » conserve la formulation hébraïque et son contraste avec « temple »; « palais royal » évite une tournure française artificielle. La phrase reste fluide sans effacer l’ambiguïté de la préposition devant « temple ».
