id: 2KI.24.19
reference: 2 Kings 24:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, exactement comme l’avait fait Jojakim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple convient au registre narratif biblique sans qu’il soit nécessaire de rendre systématiquement le waw initial par « Et ».
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’expression עשה הרע désigne idiomatiquement l’action de faire ce qui est moralement mauvais; cette formulation est naturelle et fidèle en français moderne.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression conserve la métaphore hébraïque et indique que l’acte est évalué du point de vue de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre.
- source_word: כְּכֹל אֲשֶׁר
  choice: exactement comme
  rationale: Cette tournure française naturelle exprime la pleine correspondance marquée par כְּכֹל, sans la formulation peu idiomatique « selon tout ce que ».
- source_word: עָשָׂה
  choice: l’avait fait
  rationale: Le plus-que-parfait indique naturellement que la conduite de Jojakim, prise comme modèle de comparaison, est antérieure à celle du sujet actuel.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Cette forme française usuelle du nom hébreu est claire et conforme aux conventions bibliques francophones.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « aux yeux de » préserve l’image hébraïque; le passé simple maintient un registre narratif soutenu mais courant dans la traduction biblique.
