id: 2KI.24.10
reference: 2 Kings 24:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: fr
  text: À cette époque, les serviteurs de Nabucodonosor, roi de Babylone, montèrent contre Jérusalem[a], et la ville fut assiégée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « montèrent à Jérusalem » ; le verbe hébreu peut évoquer à la fois la montée vers la ville et une avancée militaire contre elle.
    reason: lexical_alternative
  - marker: b
    text: Plus littéralement, « la ville entra en état de siège », tournure qui peut souligner le début du siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: À cette époque
  rationale: Expression temporelle naturelle en français moderne, qui situe l’événement dans la période évoquée par le contexte.
- source_word: עָלָה
  choice: montèrent contre
  rationale: Conserve l’idée hébraïque de monter, pertinente pour Jérusalem, tout en rendant explicite la progression militaire hostile indiquée par le contexte.
- source_word: עַבְדֵי
  choice: les serviteurs
  rationale: Rend directement le terme hébreu sans préciser indûment s’il s’agit de soldats, d’officiers ou d’autres agents du roi.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabucodonosor
  rationale: Forme française traditionnelle et largement reconnue du nom royal.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Traduction directe et naturelle du titre royal.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: et la ville fut assiégée
  rationale: Formulation française claire et idiomatique. Une note signale la tournure hébraïque plus littérale, qui peut souligner le commencement de l’état de siège.
- source_word: מָצוֹר
  choice: assiégée
  rationale: Le verbe français exprime naturellement la mise en état de siège dans cette construction.
theological_decisions: []
