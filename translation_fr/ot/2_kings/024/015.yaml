source:
  edition: WLC
  text: וַ/יֶּ֥גֶל אֶת יְהוֹיָכִ֖ין בָּבֶ֑לָ/ה וְ/אֶת אֵ֣ם הַ֠/מֶּלֶךְ וְ/אֶת נְשֵׁ֨י הַ/מֶּ֜לֶךְ וְ/אֶת סָרִיסָ֗י/ו וְ/אֵת֙ אולי הָ/אָ֔רֶץ הוֹלִ֛יךְ גּוֹלָ֥ה מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: fr
  text: Il déporta Jojakin à Babylone, ainsi que la mère du roi, les épouses du roi, ses fonctionnaires de cour[a] et les notables du pays[b] ; il les emmena en exil de Jérusalem à Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses eunuques ». Le terme hébreu peut désigner soit des eunuques au sens strict, soit plus généralement des fonctionnaires royaux.
    reason: lexical_alternative
  - marker: b
    text: Ou « les puissants du pays » ou « les grands du pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Il déporta
  rationale: La forme causative de גלה exprime le fait de faire partir quelqu’un en exil. « Déporta » rend ce mouvement de manière concise et naturelle.
- source_word: בָּבֶלָה
  choice: à Babylone
  rationale: Le hé directionnel indique un mouvement vers Babylone ; « à Babylone » est l’expression française idiomatique.
- source_word: אֵם הַמֶּלֶךְ
  choice: la mère du roi
  rationale: Cette traduction suit directement l’expression hébraïque sans en faire nécessairement un titre officiel comme « reine mère ».
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: les épouses du roi
  rationale: Le pluriel construit désigne les femmes du roi au sens conjugal. « Épouses » évite l’ambiguïté possible de « femmes » en français moderne.
- source_word: סָרִיסָיו
  choice: ses fonctionnaires de cour
  rationale: סָרִיס peut désigner précisément des eunuques ou, plus largement, des fonctionnaires royaux. Le texte principal retient leur fonction, tandis qu’une note conserve l’autre sens possible.
- source_word: אֵילֵי הָאָרֶץ
  choice: les notables du pays
  rationale: L’expression désigne les hommes puissants ou éminents du pays. « Notables » communique naturellement leur rang social sans préciser davantage la nature de leur puissance.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: il les emmena en exil
  rationale: La construction associe le causatif de הלך à גּוֹלָה et décrit le fait de conduire des personnes comme exilées. La formulation garde explicitement le motif de l’exil.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: de Jérusalem à Babylone
  rationale: Les prépositions et le hé directionnel marquent clairement le lieu de départ et la destination.
