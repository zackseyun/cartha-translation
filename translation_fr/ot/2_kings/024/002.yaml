reference: 2 Kings 24:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: fr
  text: Yahweh envoya contre lui des bandes armées[a] de Chaldéens, d’Aram[b], de Moab et d’Ammonites. Il les envoya contre Juda pour le détruire[c], conformément à la parole que Yahweh avait prononcée par l’intermédiaire de ses serviteurs les prophètes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bandes de pillards ».
    reason: alternative lexicale
  - marker: b
    text: 'Hébreu : « Aram »; traditionnellement : « Syrie ».'
    reason: appellation traditionnelle alternative
  - marker: c
    text: Ou « pour faire périr Joïakim »; le pronom hébreu peut renvoyer soit à Juda, soit à Joïakim.
    reason: ambiguïté du référent
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: envoya
  rationale: Rend naturellement le verbe שלח dans le récit tout en conservant l’action délibérée de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin dans le cadre du projet.
- source_word: בּוֹ
  choice: contre lui
  rationale: Dans ce contexte d’hostilité militaire, la préposition marque l’action dirigée contre Joïakim.
- source_word: גְּדוּדֵי
  choice: bandes armées
  rationale: Le terme désigne vraisemblablement des détachements ou groupes de pillards plutôt que des armées régulières; « bandes armées » est clair et naturel en français.
- source_word: כַשְׂדִּים
  choice: Chaldéens
  rationale: Conserve la désignation précise du texte hébreu au lieu de la généraliser en « Babyloniens ».
- source_word: אֲרָם
  choice: Aram
  rationale: Reprend directement le nom hébreu sans lui substituer l’appellation traditionnelle « Syrie ».
- source_word: בְנֵי עַמּוֹן
  choice: Ammonites
  rationale: Gentilé français naturel pour la locution hébraïque littérale « fils d’Ammon ».
- source_word: וַיְשַׁלְּחֵם
  choice: Il les envoya
  rationale: Maintient la répétition verbale du texte hébreu, qui souligne le déroulement et l’intention de l’action.
- source_word: בִּיהוּדָה
  choice: contre Juda
  rationale: Le contexte militaire hostile justifie « contre », plus idiomatique ici que le sens spatial littéral « en/dans Juda ».
- source_word: לְהַאֲבִידוֹ
  choice: pour le détruire
  rationale: Le pronom masculin français peut viser Juda, lecture favorisée par le contexte, tout en laissant ouverte la possibilité grammaticale qu’il renvoie à Joïakim; cette ambiguïté est explicitée en note.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole que Yahweh avait prononcée
  rationale: Exprime clairement l’accomplissement de la parole prophétique tout en préservant la formule du texte source.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: par l’intermédiaire de ses serviteurs les prophètes
  rationale: Rend idiomatiquement l’hébraïsme « par la main de » sans perdre l’idée d’intermédiaires mandatés.
theological_decisions:
- issue: Référent du suffixe dans לְהַאֲבִידוֹ
  choice: 'Juda est le référent principal : « pour le détruire ».'
  alternative: 'Joïakim peut être le référent : « pour le faire périr » ou « pour le détruire ».'
  rationale: Juda vient d’être nommé et le contexte plus large porte sur le jugement du royaume. Toutefois, le suffixe masculin singulier peut aussi renvoyer à Joïakim, mentionné par « contre lui »; la note préserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « envoya » reproduit l’insistance narrative de l’hébreu. « Bandes armées » évite le registre trop informel de « bandes » employé seul, tandis que la note conserve la nuance possible de groupes de pillards.
