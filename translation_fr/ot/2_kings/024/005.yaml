id: 2KI.24.5
reference: 2 Kings 24:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְהוֹיָקִ֖ים וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes de Jojakim et tout ce qu’il a fait ne sont-ils pas écrits dans le livre des annales des rois de Juda[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le livre des événements des jours des rois de Juda ». Il s’agit d’un recueil d’annales royales cité à plusieurs reprises dans les livres des Rois, et pas nécessairement du livre biblique des Chroniques.
    reason: Préciser le sens du titre hébreu et éviter une identification documentaire injustifiée.
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: le reste des actes
  rationale: Dans cette formule de conclusion de règne, יֶתֶר désigne ce qui reste à raconter et דִּבְרֵי les faits ou actes consignés au sujet du roi. Cette formulation est à la fois idiomatique et proche de l’hébreu.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Forme française traditionnelle et couramment reconnue du nom royal.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Rend directement la proposition relative sans préciser indûment la nature de ses actions.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: Conserve la question rhétorique de la formule hébraïque ainsi que l’idée explicite de mise par écrit.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », « écrits dans le livre » est l’expression française naturelle pour désigner le contenu d’un document.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: le livre des annales des rois de Juda
  rationale: « Annales » exprime naturellement la valeur archivistique de דִּבְרֵי הַיָּמִים, tandis que le complément indique que ce recueil concerne les rois de Juda.
theological_decisions:
- issue: Identification du document cité
  choice: Présenter le titre comme celui d’annales royales, sans l’identifier au livre biblique des Chroniques
  alternative: le livre des Chroniques des rois de Juda
  rationale: Le texte cite une source documentaire royale utilisée dans les livres des Rois; rien n’impose de l’identifier aux livres canoniques des Chroniques.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure interrogative traditionnelle conserve la force rhétorique de l’hébreu. Aucun marqueur temporel tel que « Maintenant » n’a été ajouté, car le texte source n’en comporte pas.
