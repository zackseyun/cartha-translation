id: 2KI.24.4
reference: 2 Kings 24:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/גַ֤ם דַּֽם הַ/נָּקִי֙ אֲשֶׁ֣ר שָׁפָ֔ךְ וַ/יְמַלֵּ֥א אֶת יְרוּשָׁלִַ֖ם דָּ֣ם נָקִ֑י וְ/לֹֽא אָבָ֥ה יְהוָ֖ה לִ/סְלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: fr
  text: et aussi à cause du sang innocent qu’il avait versé[a]. Il avait rempli Jérusalem de sang innocent, et Yahvé ne voulut pas pardonner[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sang des innocents qu’il avait versé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Yahvé refusa de pardonner ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: et aussi à cause de
  rationale: La conjonction rattache ce motif à ceux du verset précédent, tandis que « à cause de » explicite en français la relation causale déjà établie par le contexte.
- source_word: דַּם הַנָּקִי
  choice: le sang innocent
  rationale: Cette expression française naturelle conserve l’image hébraïque du sang versé injustement et peut désigner collectivement le sang des innocents.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: qu’il avait versé
  rationale: « Verser le sang » est l’équivalent idiomatique courant de שׁפך דם ; le plus-que-parfait convient au regard rétrospectif du passage.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: Il avait rempli Jérusalem de sang innocent
  rationale: La tournure restitue directement l’image hébraïque ; « de » est nécessaire en français après « remplir ».
- source_word: וְלֹא אָבָה
  choice: et … ne voulut pas
  rationale: אָבָה exprime la volonté ou le consentement. « Ne voulut pas » en conserve la force sans réduire l’énoncé à une simple incapacité.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française « Yahvé » représente le nom divin plutôt que de lui substituer un titre.
- source_word: לִסְלֹחַ
  choice: pardonner
  rationale: « Pardonner » est l’équivalent français clair et usuel de סלח dans le contexte du pardon divin.
theological_decisions:
- issue: Le refus divin de pardonner face au sang innocent versé
  choice: Yahvé ne voulut pas pardonner
  alternative: Yahvé ne pardonnerait pas
  rationale: L’hébreu attribue explicitement à Yahvé un refus de pardonner dans ce contexte judiciaire. La formulation retenue maintient cette tension sans préciser au-delà du texte la portée ou la durée de ce refus.
translation_notes:
  register: Français international moderne, digne et direct. Le début demeure syntaxiquement lié au verset précédent, comme en hébreu. La répétition de « sang innocent » est conservée pour préserver l’insistance du texte source.
