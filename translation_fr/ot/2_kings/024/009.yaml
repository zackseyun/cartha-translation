  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, exactement comme son père l’avait fait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol qal de עשה fait progresser le récit et se rend naturellement en français par un passé simple.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’adjectif substantivé désigne ici ce qui est mauvais sur le plan moral; cette formulation restitue naturellement l’expression hébraïque.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette tournure française courante conserve l’image hébraïque et exprime le jugement porté par Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte source.
- source_word: כְּכֹל אֲשֶׁר
  choice: exactement comme
  rationale: כְּכֹל exprime une conformité complète à la conduite du père; « exactement comme » en restitue la force dans un français naturel.
- source_word: עָשָׂה
  choice: l’avait fait
  rationale: Le plus-que-parfait marque naturellement l’antériorité de la conduite du père par rapport à celle du fils.
- source_word: אָבִיו
  choice: son père
  rationale: Traduction directe du nom avec suffixe possessif masculin singulier.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; sa translittération évite de le remplacer par un titre.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique. La formule « aux yeux de Yahweh » conserve l’idiome hébraïque tout en restant immédiatement compréhensible.
