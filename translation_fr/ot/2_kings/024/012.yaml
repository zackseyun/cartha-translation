revisions:
- from: Alors Jojakin, roi de Juda, sortit à la rencontre du roi de Babylone, lui, sa mère, ses serviteurs, ses hauts fonctionnaires et ses eunuques[a]. Le roi de Babylone le fit prisonnier la huitième année de son règne[b].
  to: Alors Jojakin, roi de Juda, sortit à la rencontre du roi de Babylone, lui-même, sa mère, ses serviteurs, ses dignitaires et ses eunuques[a]. Le roi de Babylone le prit, la huitième année de son règne[b].
  rationale: La révision remplace une explicitation contextuelle (« le fit prisonnier ») par « le prit », plus proche de לקח tout en restant naturel en français. Elle ajuste le terme désignant les שָׂרִים et reformule la note chronologique de manière à indiquer la lecture la plus probable sans présenter comme explicite ce que l’hébreu laisse sous la forme d’un possessif.
