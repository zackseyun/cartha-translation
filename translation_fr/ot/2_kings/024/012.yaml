base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: fr
  text: Alors Jojakin, roi de Juda, sortit à la rencontre du roi de Babylone, lui-même, sa mère, ses serviteurs, ses dignitaires et ses eunuques[a]. Le roi de Babylone le prit, la huitième année de son règne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ses dignitaires de cour » ; le terme hébreu peut désigner des eunuques au sens propre ou, plus largement, des fonctionnaires de la cour royale.'
    reason: Alternative lexicale de סָרִיסָיו.
  - marker: b
    text: Le possessif hébreu renvoie vraisemblablement au roi de Babylone, l’antécédent immédiat ; cette lecture correspond aussi à la chronologie du récit.
    reason: Clarification prudente du référent possible du possessif hébreu.
lexical_decisions:
- source_word: וַיֵּצֵא ... עַל מֶלֶךְ בָּבֶל
  choice: sortit à la rencontre du roi de Babylone
  rationale: Le verbe יצא signifie littéralement « sortir » et, avec על dans ce contexte de siège, indique que Jojakin se rend auprès du roi babylonien. « Sortit à la rencontre de » reste proche de l’image hébraïque sans expliciter davantage par « se rendit » ou « capitula ».
- source_word: הוּא וְאִמּוֹ
  choice: lui, sa mère
  rationale: Le pronom reprend expressément le sujet avant l’énumération des personnes qui l’accompagnent. Cette tournure française conserve cette insistance sans lourdeur excessive.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עבד peut désigner des serviteurs, des agents ou des membres de l’entourage royal. « Serviteurs » garde ici la portée générale du terme.
- source_word: שָׂרָיו
  choice: ses hauts fonctionnaires
  rationale: שׂרים désigne des dirigeants de rang élevé. « Hauts fonctionnaires » convient au cadre de la cour et distingue ce groupe des simples serviteurs.
- source_word: סָרִיסָיו
  choice: ses eunuques
  rationale: Le sens concret « eunuques » préserve la distinction lexicale avec שׂרים. Comme le mot peut aussi désigner plus largement des dignitaires de cour, cette possibilité est signalée en note.
- source_word: וַיִּקַּח אֹתוֹ
  choice: le fit prisonnier
  rationale: לקח signifie couramment « prendre ». Dans ce contexte de siège et de déportation, « le fit prisonnier » exprime naturellement en français le résultat narratif, sans aller jusqu’à préciser les modalités de sa capture.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: la huitième année de son règne
  rationale: La formulation française reproduit l’expression chronologique hébraïque. Le contexte et l’antécédent immédiat orientent le possessif vers le roi de Babylone.
theological_decisions:
- issue: Référent du possessif dans « son règne »
  choice: le règne du roi de Babylone
  alternative: le règne de Jojakin
  rationale: Le roi de Babylone est l’antécédent masculin singulier immédiat, et la chronologie du récit correspond à la huitième année de Nabuchodonosor. Une note rend le référent explicite sans alourdir le verset.
- issue: Degré d’explicitation de la sortie de Jojakin
  choice: sortit à la rencontre du roi de Babylone
  alternative: se rendit au roi de Babylone / capitula devant le roi de Babylone
  rationale: Le contexte implique une reddition, mais le verbe hébreu dit littéralement qu’il « sortit ». La traduction évite de résoudre silencieusement toute la portée pragmatique par « capitula ».
translation_notes:
  register: Français international moderne, narratif et digne. « Jojakin » suit la forme française biblique courante. La syntaxe conserve l’insistance de l’énumération hébraïque, tandis que les notes préservent l’ambiguïté de סָרִיס et clarifient le repère chronologique.
