source:
  edition: WLC
  text: וַ/יָּבֹ֛א נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַל הָ/עִ֑יר וַ/עֲבָדָ֖י/ו צָרִ֥ים עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/011.yaml
  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: fr
  text: Nabuchodonosor, roi de Babylone, s’avança contre la ville, tandis que ses serviteurs l’assiégeaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « serviteurs » peut désigner les dignitaires, les agents ou les forces placées au service du roi de Babylone.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint attaquer
  rationale: Le verbe בוא signifie simplement « venir », mais, avec עַל et dans ce contexte militaire, « vint attaquer » exprime naturellement en français le mouvement hostile contre la ville.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et largement reconnue du nom du roi babylonien.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rend directement la chaîne construite qui indique la fonction royale et le royaume.
- source_word: עַל הָעִיר
  choice: la ville
  rationale: Complément de « attaquer » dans la formulation française; la valeur hostile de עַל est portée par le verbe.
- source_word: וַעֲבָדָיו
  choice: ses serviteurs
  rationale: Conserve le sens large de עֲבָדִים sans préciser indûment s’il s’agit de dignitaires, d’agents ou de forces au service du roi.
- source_word: צָרִים
  choice: l’assiégeaient
  rationale: Le participe de צור décrit ici une action de siège en cours, concomitante à l’arrivée du roi.
- source_word: עָלֶיהָ
  choice: l’
  rationale: Le pronom féminin renvoie à « la ville »; en français, « assiéger » prend naturellement un complément d’objet direct.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la succession narrative et la simultanéité du siège. Le terme « serviteurs » préserve l’étendue sémantique de l’hébreu, avec une note explicative pour éviter une compréhension trop étroite.
