source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: fr
  text: C’est bien sur l’ordre de Yahvé que cela s’abattit sur Juda, afin de les ôter de devant lui[a], à cause des péchés de Manassé, conformément à tout ce qu’il avait fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de sa présence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Cela arriva
  rationale: La particule אַךְ souligne ici l’affirmation et le lien explicatif avec le contexte. En français, l’emphase peut rester implicite dans une déclaration ferme; « assurément » serait plus lourd et moins naturel.
- source_word: עַל פִּי
  choice: sur l’ordre de
  rationale: Cette locution, littéralement « sur la bouche de », désigne couramment une action accomplie sur l’ordre ou selon la parole de quelqu’un.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui le distingue d’un titre tel que « le Seigneur ».
- source_word: הָיְתָה בִּיהוּדָה
  choice: arriva à Juda
  rationale: La tournure hébraïque est elliptique et renvoie au jugement décrit dans le contexte. « Arriva à Juda » garde cette référence implicite sans préciser excessivement la nature de l’événement.
- source_word: לְהָסִיר
  choice: afin de les écarter
  rationale: L’infinitif causatif exprime ici le but de faire disparaître ou d’éloigner. « Écarter » convient naturellement avec « de devant sa face ».
- source_word: מֵעַל פָּנָיו
  choice: de devant sa face
  rationale: Cette formulation conserve l’image concrète de l’hébreu et l’idée d’une exclusion hors de la présence divine.
- source_word: בְּחַטֹּאת
  choice: à cause des péchés de
  rationale: La préposition a une valeur causale; le nom peut être compris collectivement et désigne l’ensemble des fautes de Manassé.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: conformément à tout ce qu’il avait fait
  rationale: « Conformément à » préserve la nuance de correspondance exprimée par כְּ, tandis que le plus-que-parfait situe naturellement les actes de Manassé avant le jugement.
theological_decisions:
- issue: Objet implicite de l’éloignement
  choice: « les » renvoie contextuellement aux habitants de Juda, sans les nommer explicitement.
  alternative: Ne pas exprimer l’objet, ou rendre la proposition de manière impersonnelle.
  rationale: L’hébreu omet l’objet de לְהָסִיר, mais le français exige ici un complément pour rester clair. Le contexte immédiat permet « les » sans résoudre plus précisément l’étendue du groupe concerné.
- issue: Langage de la présence divine
  choice: Conserver dans le texte l’image « de devant sa face ».
  alternative: « loin de sa présence »
  rationale: La formulation concrète respecte l’anthropomorphisme hébreu et maintient la force théologique de l’expulsion, tandis que la note offre une expression française plus idiomatique.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase garde l’ellipse contextuelle du jugement tout en ajoutant le pronom requis en français. L’image hébraïque de la face divine est conservée dans le texte et éclairée en note.
