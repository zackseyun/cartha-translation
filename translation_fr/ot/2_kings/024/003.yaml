revisions:
- from: Cela arriva à Juda sur l’ordre de Yahvé, afin de les écarter de devant sa face[a], à cause des péchés de Manassé, conformément à tout ce qu’il avait fait.
  to: C’est bien sur l’ordre de Yahvé que cela s’abattit sur Juda, afin de les ôter de devant lui[a], à cause des péchés de Manassé, conformément à tout ce qu’il avait fait.
  rationale: La révision restitue explicitement l’emphase de אַךְ et améliore l’idiomaticité de l’expression de l’exclusion, sans préciser davantage que le texte source l’objet implicite de l’infinitif. « Cela s’abattit sur Juda » suit le sens contextuel du jugement qui vient sur Juda, déjà adopté par la piste d’audit anglaise, tandis que « conformément à tout ce qu’il avait fait » conserve la formulation proportionnelle de כְּכֹל אֲשֶׁר עָשָׂה.
