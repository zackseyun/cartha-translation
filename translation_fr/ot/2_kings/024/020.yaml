base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: fr
  text: Car c’est à cause de la colère de Yahweh que cela se produisit à Jérusalem et en Juda, jusqu’à ce qu’il les chasse de sa présence[a]. Sédécias se révolta contre le roi de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car la colère de Yahweh fut contre Jérusalem et Juda, jusqu’à ce qu’il les chasse de sa présence. » La première proposition est condensée en hébreu et peut aussi se traduire plus formellement ainsi.'
    reason: Lecture alternative de la syntaxe hébraïque condensée.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction rattache cette affirmation au contexte précédent en introduisant une explication causale.
- source_word: עַל אַף יְהוָה
  choice: à cause de la colère de Yahweh
  rationale: L’expression idiomatique désigne la colère divine; « à cause de » en marque clairement la portée causale, et le nom propre יהוה est rendu par « Yahweh ».
- source_word: הָיְתָה
  choice: les choses en arrivèrent là
  rationale: Le verbe féminin singulier n’a pas de sujet explicite. Cette tournure française naturelle exprime l’aboutissement de la situation sans prétendre lever entièrement la compression syntaxique de l’hébreu.
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: à Jérusalem et en Juda
  rationale: Les prépositions sont comprises dans leur sens locatif, désignant le cadre où cette situation s’est produite.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: jusqu’à ce qu’il les rejette
  rationale: La construction avec עַד indique le terme auquel aboutit la situation; « rejeter » garde la force de l’expulsion divine.
- source_word: מֵעַל פָּנָיו
  choice: loin de sa présence
  rationale: Cette expression idiomatique signifie être ôté de devant Dieu; « loin de sa présence » est clair et conserve sa portée théologique.
- source_word: וַיִּמְרֹד
  choice: se révolta
  rationale: Le verbe מרד exprime une rébellion politique contre un souverain.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: contre le roi de Babylone
  rationale: Avec מרד, la préposition בְּ introduit la personne contre laquelle la révolte est dirigée.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et courante de ce nom propre biblique.
theological_decisions:
- issue: Relation entre la colère divine, la situation de Jérusalem et de Juda, et leur expulsion
  choice: La colère de Yahweh est présentée comme la cause d’une situation qui aboutit au rejet hors de sa présence.
  alternative: « Car la colère de Yahweh fut contre Jérusalem et Juda, jusqu’à ce qu’il les rejette loin de sa présence. »
  rationale: La syntaxe hébraïque est condensée. Le texte principal rend naturellement sa progression causale, tandis que la note conserve une lecture plus formelle possible sans résoudre artificiellement l’ambiguïté.
- issue: Rendu du tétragramme יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin יהוה; « Yahweh » le représente directement plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. « Les choses en arrivèrent là » évite le calque obscur « cela fut » tout en gardant l’idée d’un aboutissement. Le passé simple convient au registre narratif biblique sans être archaïque.
