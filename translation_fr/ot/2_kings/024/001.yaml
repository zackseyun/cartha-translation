  text: בְּ/יָמָ֣י/ו עָלָ֔ה נְבֻכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יְהִי ל֨/וֹ יְהוֹיָקִ֥ים עֶ֨בֶד֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יָּ֖שָׁב וַ/יִּמְרָד בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: fr
  text: De son temps, Nabuchodonosor, roi de Babylone, monta[a], et Joïakim lui fut soumis pendant trois ans. Puis il se retourna[b] et se révolta contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avança ». Dans ce contexte, le verbe peut désigner la montée d’une armée contre un territoire.
    reason: lexical_alternative
  - marker: b
    text: Ou « revint en arrière ». Le verbe peut marquer un revirement d’allégeance avant la révolte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: De son temps
  rationale: Expression temporelle naturelle en français, renvoyant au règne du roi précédemment mentionné.
- source_word: עָלָה
  choice: monta
  rationale: Conserve le sens usuel de עלה et la sobriété du texte; dans ce contexte, le verbe évoque l'avancée du roi de Babylone sans expliciter davantage l'action militaire.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et largement reconnue du nom royal.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rend directement la construction hébraïque.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: Joïakim lui fut soumis
  rationale: La construction indique que Joïakim entra sous l'autorité politique de Nabuchodonosor. Cette formulation française restitue le rapport de sujétion sans introduire le vocabulaire féodal de « vassal ».
- source_word: שָׁלֹשׁ שָׁנִים
  choice: pendant trois ans
  rationale: Rend naturellement en français l'accusatif hébreu de durée.
- source_word: וַיָּשָׁב
  choice: Puis il changea de camp
  rationale: Dans l'enchaînement avec la révolte, שוב marque vraisemblablement un renversement d'allégeance. La formulation exprime ce mouvement en français courant tout en signalant en note le sens plus littéral.
- source_word: וַיִּמְרָד בּוֹ
  choice: se révolta contre lui
  rationale: Rend clairement מרד avec ב, qui désigne la rébellion contre un souverain.
