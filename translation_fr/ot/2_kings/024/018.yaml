  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: fr
  text: Sédécias avait vingt et un ans lorsqu’il devint roi, et il régna onze ans à Jérusalem. Sa mère s’appelait Hamoutal, fille de Jérémie, de Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: avait vingt et un ans
  rationale: L’expression hébraïque signifie littéralement « fils de vingt et une années » ; la tournure française naturelle exprime fidèlement son âge.
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: L’infinitif construit précédé de ב situe l’âge de Sédécias au moment de son accession à la royauté.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté ; « régna » est direct et conventionnel en français.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition locative se rend naturellement par « à » devant un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette formulation française actuelle restitue naturellement la formule royale « le nom de sa mère était ».
- source_word: חמיטל
  choice: Hamoutal
  rationale: Translittération française courante du nom propre hébreu, cohérente avec sa vocalisation massorétique Ḥămûṭal.
- source_word: בַּת יִרְמְיָהוּ
  choice: fille de Jérémie
  rationale: Expression généalogique directe indiquant la filiation.
- source_word: מִלִּבְנָה
  choice: de Libna
  rationale: La préposition מ indique ici l’origine géographique ; en français, « de Libna » est naturel et conserve cette valeur.
