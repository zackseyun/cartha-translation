  text: וְ/לֹֽא הֹסִ֥יף עוֹד֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ/צֵ֖את מֵֽ/אַרְצ֑/וֹ כִּֽי לָקַ֞ח מֶ֣לֶךְ בָּבֶ֗ל מִ/נַּ֤חַל מִצְרַ֨יִם֙ עַד נְהַר פְּרָ֔ת כֹּ֛ל אֲשֶׁ֥ר הָיְתָ֖ה לְ/מֶ֥לֶךְ מִצְרָֽיִם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: fr
  text: Le roi d’Égypte ne sortit plus de son pays, car le roi de Babylone avait pris tout ce qui appartenait au roi d’Égypte, depuis le torrent d’Égypte[a] jusqu’au fleuve Euphrate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’oued d’Égypte ». Le mot hébreu peut désigner un cours d’eau saisonnier ou son lit; « fleuve » est moins probable ici et pourrait être confondu avec le Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: ne sortit plus
  rationale: La construction הוסיף avec l’infinitif, niée et renforcée par עוד, exprime la cessation. « Ne sortit plus » rend naturellement l’idée sans expliciter davantage la portée militaire suggérée par le contexte.
- source_word: מֵאַרְצוֹ
  choice: de son pays
  rationale: « Pays » convient au domaine territorial du roi et constitue un équivalent français naturel de אֶרֶץ dans ce contexte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle le roi d’Égypte ne sortit plus. « Car » conserve un registre narratif digne et clair.
- source_word: לָקַח
  choice: avait pris
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité de la prise babylonienne par rapport à la cessation des sorties du roi d’Égypte. « Pris » préserve la largeur sémantique du verbe.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: tout ce qui appartenait au roi d’Égypte
  rationale: Cette formulation reproduit le tour possessif hébreu sans limiter explicitement la référence aux seuls territoires, même si les repères géographiques indiquent principalement une domination territoriale.
- source_word: מִנַּחַל מִצְרַיִם
  choice: depuis le torrent d’Égypte
  rationale: נַחַל désigne souvent un cours d’eau intermittent ou son lit. « Torrent » est traditionnel, intelligible et évite de suggérer le Nil.
- source_word: עַד נְהַר פְּרָת
  choice: jusqu’au fleuve Euphrate
  rationale: נהר désigne ici un fleuve permanent, et « le fleuve Euphrate » est une formulation française naturelle qui marque le contraste géographique avec נחל.
theological_decisions: []
