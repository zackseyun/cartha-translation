  text: וַ/יִּשְׁכַּ֥ב יְהוֹיָקִ֖ים עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: fr
  text: Joïakim se coucha avec ses pères[a], et son fils Joïakin devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « mourut ». L’hébreu dit littéralement « se coucha avec ses pères », formule habituelle annonçant la mort d’un roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Avec « avec ses pères », le verbe forme une expression royale conventionnelle annonçant la mort. « Se coucha » préserve l’image hébraïque sans réduire l’expression à sa seule interprétation.
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Cette formulation conserve le complément idiomatique hébreu et sa tonalité traditionnelle. Dans ce contexte, « pères » désigne les ancêtres.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Le verbe indique ici l’accession au trône; « devint roi » exprime plus nettement le changement de règne que « régna ».
- source_word: בְּנוֹ
  choice: son fils
  rationale: Traduction directe de la désignation filiale.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession, cette expression indique que Joïakin remplace Joïakim sur le trône.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: Joïakim / Joïakin
  rationale: Formes françaises usuelles des noms propres bibliques.
theological_decisions:
- issue: Traduction de la formule royale de décès sans ajouter de détail sur l’ensevelissement
  choice: Conserver dans le texte l’expression « se coucha avec ses pères »
  alternative: Traduire « mourut » ou ajouter qu’il fut enterré auprès de ses ancêtres
  rationale: L’hébreu emploie une formule conventionnelle de décès, mais ce verset n’affirme pas explicitement que Joïakim fut enterré avec ses ancêtres. La formulation retenue préserve l’image et évite d’ajouter un détail absent.
translation_notes:
  register: Français moderne, digne et accessible. La tournure traditionnelle « se coucha avec ses pères » est volontairement conservée et expliquée en note afin de respecter l’expression hébraïque tout en assurant sa compréhension.
