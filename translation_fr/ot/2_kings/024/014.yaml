base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: fr
  text: Il déporta toute Jérusalem, tous les hauts fonctionnaires et tous les vaillants guerriers, soit dix mille déportés, ainsi que tous les artisans et les forgerons[a]. Il ne resta que les plus pauvres parmi la population du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les métallurgistes » ; le terme hébreu traditionnellement traduit par « forgerons » peut désigner plus largement des ouvriers qualifiés travaillant le métal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: Il déporta
  rationale: Le hiphil de גלה exprime ici le fait de contraindre des personnes à partir en exil. « Déporta » rend directement cette action forcée dans un récit historique.
- source_word: כָּל יְרוּשָׁלִַם
  choice: tout Jérusalem
  rationale: La ville désigne ici, par métonymie, sa population, particulièrement les groupes ensuite énumérés. Garder l’expression hébraïque préserve sa force rhétorique.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: שׂרים désigne les membres de l’élite dirigeante. « Hauts fonctionnaires » évite de les identifier nécessairement à des princes de sang royal.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: les vaillants guerriers
  rationale: L’expression désigne des hommes reconnus pour leur force et leur valeur militaire. Cette formulation conserve à la fois le sens guerrier et le registre élevé.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: soit dix mille déportés
  rationale: גולה est un collectif désignant les personnes emmenées en exil. « Soit » présente naturellement le nombre comme une précision récapitulative des groupes précédents, conformément à la syntaxe du contexte.
- source_word: הֶחָרָשׁ
  choice: les artisans
  rationale: חרש désigne collectivement des ouvriers qualifiés ou artisans, sans préciser ici leur spécialité.
- source_word: הַמַּסְגֵּר
  choice: les forgerons
  rationale: Le terme paraît désigner une catégorie de travailleurs du métal, mais sa spécialisation exacte reste incertaine. Le rendu traditionnel « forgerons » est retenu, avec une note signalant le sens plus large possible.
- source_word: לֹא נִשְׁאַר
  choice: Il ne resta
  rationale: Le niphal indique que personne d’autre ne demeura sur place. Cette tournure française est concise et naturelle.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: que les plus pauvres parmi la population du pays
  rationale: דלת désigne la couche pauvre ou démunie de la population. « Parmi » conserve clairement la valeur partitive de l’expression.
