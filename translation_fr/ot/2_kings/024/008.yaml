revisions:
- from: Jojakin avait dix-huit ans lorsqu’il devint roi, et il régna trois mois à Jérusalem. Sa mère s’appelait Nehoushta ; elle était fille d’Elnatân, de Jérusalem.[a]
  to: Jojakin avait dix-huit ans lorsqu’il devint roi, et il régna trois mois à Jérusalem. Sa mère s’appelait Nehoushta, fille d’Elnatân, originaire de Jérusalem.
  rationale: La révision rattache explicitement la provenance à Nehoushta, sans ajouter d’interprétation. La note est supprimée, car l’ambiguïté signalée dans le projet français ne reflète pas utilement la fonction de la formule généalogique dans le texte source ni l’audit anglais.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:16:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : âge à l’avènement, durée et lieu du règne, nom et filiation de la mère. Cependant, le dernier complément מִירוּשָׁלָם (« de/depuis Jérusalem ») appartient à la notice concernant Nehoushta et doit être rendu de façon à caractériser celle-ci, conformément à la formulation généalogique hébraïque et à la piste d’audit anglaise.'
  naturalness: La formulation est globalement naturelle. « Elnatân, de Jérusalem » est toutefois une apposition française qui caractérise spontanément Elnatân, tandis que la note introduit une ambiguïté peu justifiée et ne rétablit pas clairement le sens de la notice. « originaire de Jérusalem » est plus net et idiomatique.
  terminology: Les noms « Jojakin », « Nehoushta » et « Elnatân » sont cohérents avec une translittération française lisible. Le registre est sobre et approprié à une notice royale.
  issues:
  - severity: medium
    issue: Le texte rattache grammaticalement « de Jérusalem » à Elnatân, et la note présente ce rattachement comme une ambiguïté à conserver.
    rationale: Dans la formule hébraïque, « Nehoushta, fille d’Elnatân, de Jérusalem » décrit la mère du roi comme étant de Jérusalem; l’audit anglais confirme ce sens (« His mother’s name was Nehushta ... from Jerusalem ») et ne signale qu’une alternative idiomatique « de Jérusalem », non une hésitation sur l’antécédent. La formulation française doit donc éviter d’attribuer la provenance au père.
  revised_text: Jojakin avait dix-huit ans lorsqu’il devint roi, et il régna trois mois à Jérusalem. Sa mère s’appelait Nehoushta, fille d’Elnatân, originaire de Jérusalem.
  revised_footnotes: []
