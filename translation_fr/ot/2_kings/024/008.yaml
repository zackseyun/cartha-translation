base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: fr
  text: Jojakin avait dix-huit ans lorsqu’il devint roi, et il régna trois mois à Jérusalem. Sa mère s’appelait Nehoushta, fille d’Elnatân, originaire de Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: avait dix-huit ans
  rationale: Cette formulation rend naturellement en français l’expression hébraïque habituelle indiquant l’âge.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge de Jojakin au moment de son accession au trône ; cette formulation est claire et idiomatique.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe signifie « régner, être roi » ; « régna » conserve ici sa force verbale.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: trois mois
  rationale: Le groupe nominal indique la durée du règne, clairement exprimée par le contexte français.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: La préposition locative devant un nom de ville se rend naturellement par « à » en français.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Équivalent français actuel et naturel de la formule hébraïque « le nom de sa mère était ».
- source_word: נְחֻשְׁתָּא
  choice: Nehoushta
  rationale: Translittération française lisible du nom hébreu.
- source_word: בַת אֶלְנָתָן
  choice: elle était fille d’Elnatân
  rationale: La chaîne construite exprime directement la filiation.
- source_word: מִירוּשָׁלָם
  choice: de Jérusalem
  rationale: Cette formulation concise reflète la provenance exprimée par מִן sans préciser artificiellement si le complément caractérise surtout Nehoushta ou Elnatân.
