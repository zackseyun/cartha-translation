base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: fr
  text: Le roi de Babylone établit comme roi Mattania, l’oncle de Yoyakîn, à sa place, et changea son nom en Sédécias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: établit comme roi
  rationale: 'Le hiphil de מלך exprime ici la causation ou l’investiture : le roi de Babylone installe Mattania comme roi.'
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Le groupe construit désigne clairement le sujet de l’action.
- source_word: מַתַּנְיָה
  choice: Mattania
  rationale: Forme française usuelle du nom propre hébreu.
- source_word: דֹדוֹ
  choice: son oncle
  rationale: Dans ce contexte historique, דּוֹד désigne l’oncle de Yoyakîn; le possessif hébreu renvoie au roi remplacé.
- source_word: תַּחְתָּיו
  choice: à la place de Yoyakîn
  rationale: Dans un contexte d’intronisation, l’expression marque le remplacement. Le référent du pronom est explicité en français afin d’éviter que « sa place » ne soit compris comme renvoyant au roi de Babylone.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: dont il changea le nom
  rationale: Avec « son nom » comme complément, סבב signifie idiomatiquement changer ou modifier le nom. La relative rend naturellement la continuité de l’action en français.
- source_word: צִדְקִיָּהוּ
  choice: Sédécias
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
