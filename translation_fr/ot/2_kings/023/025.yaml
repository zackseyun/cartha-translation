base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: fr
  text: Avant lui, il n’y eut aucun roi qui, comme lui, se tourna vers Yahweh[a] de tout son cœur, de toute son âme et de toute sa force[b], conformément à toute la loi de Moïse. Après lui, aucun roi comme lui ne se leva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « revint à Yahweh ». Le verbe hébreu peut exprimer un retour à Dieu dans le repentir et la fidélité à l’alliance.
    reason: lexical_alternative
  - marker: b
    text: L’expression « de tout son cœur, de toute son âme et de toute sa force » fait écho à Deutéronome 6.5.
    reason: cross_reference
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: Avant lui, il n’y eut aucun roi comme lui
  rationale: La comparaison placée en tête souligne le caractère unique de Josias parmi les rois qui l’ont précédé. Cette formulation conserve cette emphase dans un français naturel.
- source_word: שָׁב אֶל יְהוָה
  choice: revint à Yahweh
  rationale: Le verbe שׁוּב avec אֶל exprime ici un retour vers Dieu dans la fidélité à l’alliance. « Revint » préserve cette nuance sans réduire l’expression au seul repentir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: de tout son cœur, de toute son âme et de toute sa force
  rationale: La triple formule est conservée afin de rendre la totalité de l’engagement de Josias et l’écho intentionnel de Deutéronome 6.5.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: conformément à toute la loi de Moïse
  rationale: Dans ce contexte d’évaluation royale, תּוֹרָה désigne l’enseignement normatif transmis par Moïse; « loi » est clair et maintient la résonance canonique habituelle.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: Après lui non plus, il ne s’en leva aucun comme lui
  rationale: Le verbe קוּם est conservé par « se leva », tandis que « aucun » reprend naturellement la comparaison absolue avec les rois postérieurs.
theological_decisions:
- issue: Portée de שָׁב אֶל יְהוָה
  choice: « revint à Yahweh », avec une note signalant « se tourna vers Yahweh »
  alternative: « se repentit devant Yahweh »
  rationale: Le texte évoque un retour relationnel et une fidélité renouvelée à l’alliance; traduire uniquement par « se repentit » préciserait excessivement la nature de ce retour.
- issue: Écho de Deutéronome 6.5
  choice: Conserver la triade « cœur… âme… force »
  alternative: Paraphraser par « de tout son être »
  rationale: La formulation détaillée permet au lecteur de reconnaître l’écho au commandement d’aimer Yahweh totalement, sans effacer les termes du texte.
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; sa transcription préserve cette donnée et la dimension personnelle du nom d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La répétition « comme lui » et la structure avant/après sont maintenues pour encadrer l’affirmation de l’unicité de Josias.
