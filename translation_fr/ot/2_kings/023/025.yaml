- from: Avant lui, il n’y eut aucun roi comme lui, qui revint à Yahweh[a] de tout son cœur, de toute son âme et de toute sa force[b], conformément à toute la loi de Moïse. Après lui non plus, il ne s’en leva aucun comme lui.
  to: Avant lui, il n’y eut aucun roi qui, comme lui, se tourna vers Yahweh[a] de tout son cœur, de toute son âme et de toute sa force[b], conformément à toute la loi de Moïse. Après lui, aucun roi comme lui ne se leva.
