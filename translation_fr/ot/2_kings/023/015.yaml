  text: וְ/גַ֨ם אֶת הַ/מִּזְבֵּ֜חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֗ל הַ/בָּמָה֙ אֲשֶׁ֨ר עָשָׂ֜ה יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל גַּ֣ם אֶת הַ/מִּזְבֵּ֧חַ הַ/ה֛וּא וְ/אֶת הַ/בָּמָ֖ה נָתָ֑ץ וַ/יִּשְׂרֹ֧ף אֶת הַ/בָּמָ֛ה הֵדַ֥ק לְ/עָפָ֖ר וְ/שָׂרַ֥ף אֲשֵׁרָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: fr
  text: Quant à l’autel qui se trouvait à Béthel, le haut lieu que Jéroboam, fils de Nebath, qui avait fait pécher Israël, avait construit, il démolit aussi cet autel-là et ce haut lieu. Il brûla ce haut lieu, le réduisit en poussière et brûla l’Ashéra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poteau sacré d’Ashéra » ; le terme hébreu peut désigner l’objet cultuel associé au culte d’Ashéra.
    reason: alternative lexicale préservant l’ambiguïté du terme hébreu
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français courant et précis de מִזְבֵּחַ, sans explicitation superflue.
- source_word: בְּבֵית אֵל
  choice: à Béthel
  rationale: Rendu idiomatique en français de la localisation exprimée par la préposition בְּ devant le nom de lieu.
- source_word: הַבָּמָה
  choice: le haut lieu
  rationale: Conserve le sens religieux technique de בָּמָה et la répétition lexicale du verset.
- source_word: עָשָׂה
  choice: avait construit
  rationale: Dans ce contexte d’aménagement d’un lieu cultuel, « construire » est naturel; le plus-que-parfait marque l’antériorité de l’action de Jéroboam.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: avait fait pécher Israël
  rationale: Préserve directement la valeur causative du hifil de חטא.
- source_word: גַּם אֶת הַמִּזְבֵּחַ הַהוּא וְאֶת הַבָּמָה נָתָץ
  choice: Il démolit aussi l’autel […] ainsi que le haut lieu
  rationale: La restructuration place le verbe plus tôt pour produire une phrase française lisible, tout en conservant l’insistance de גַּם et les deux objets de נָתַץ.
- source_word: נָתָץ
  choice: démolit
  rationale: Exprime clairement la destruction d’installations cultuelles et convient aux deux objets coordonnés.
- source_word: וַיִּשְׂרֹף אֶת הַבָּמָה
  choice: Il brûla ce haut lieu
  rationale: Maintient la cohérence terminologique de בָּמָה; le démonstratif français assure la reprise naturelle.
- source_word: הֵדַק לְעָפָר
  choice: le réduisit en poussière
  rationale: Rend le résultat de la pulvérisation de façon idiomatique et précise.
- source_word: אֲשֵׁרָה
  choice: l’Ashéra
  rationale: La translittération conserve l’ambiguïté entre le nom associé à la divinité et l’objet cultuel, explicitée en note.
theological_decisions:
- issue: Référent de אֲשֵׁרָה
  choice: l’Ashéra
  alternative: le poteau sacré d’Ashéra
  rationale: Le contexte de destruction suggère fortement un objet cultuel, mais le terme hébreu peut désigner Ashéra ou l’objet associé à son culte. Le texte principal ne tranche donc pas au-delà de la source.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu. La syntaxe hébraïque très marquée a été réorganisée sans perte de contenu afin d’éviter une phrase française lourde ou ambiguë.
