base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: fr
  text: 'Puis le roi donna cet ordre à tout le peuple : « Célébrez la Pâque en l’honneur de Yahweh, votre Dieu, comme il est écrit dans ce livre de l’alliance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ אֶת כָּל הָעָם
  choice: Puis le roi donna cet ordre à tout le peuple
  rationale: צוה exprime un commandement. « Donna cet ordre » est naturel en français narratif et maintient la force directive du verbe; « tout le peuple » rend directement כל העם.
- source_word: עֲשׂוּ פֶסַח
  choice: Célébrez la Pâque
  rationale: L’expression signifie littéralement « faire une Pâque », mais désigne idiomatiquement sa célébration. « Célébrez la Pâque » est clair et actuel, sans formulation artificielle.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: en l’honneur de Yahweh, votre Dieu
  rationale: La préposition ל indique ici la destination ou la consécration de la célébration. « En l’honneur de » l’exprime naturellement en français, tandis que « Yahweh » préserve le nom divin et « votre Dieu » le suffixe pluriel.
- source_word: כַּכָּתוּב
  choice: comme il est écrit
  rationale: Cette formule française courante correspond fidèlement au participe passif hébreu et introduit la conformité à l’instruction écrite.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: dans ce livre de l’alliance
  rationale: Avec le verbe « écrire », על se rend naturellement par « dans » en français lorsqu’il s’agit du contenu d’un document. Le démonstratif « ce » et l’expression « livre de l’alliance » sont conservés.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel d’alliance au lieu de le remplacer par un titre.
- issue: Sens cultuel de עֲשׂוּ פֶסַח
  choice: Célébrez la Pâque
  alternative: Faites la Pâque / Observez la Pâque
  rationale: Le tour hébreu désigne l’accomplissement de la célébration pascale. « Célébrez » communique ce sens sans préciser davantage que le texte les modalités rituelles.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct reste impératif et solennel sans archaïsme. « Puis » assure la continuité narrative; la minuscule à « livre » évite d’imposer un statut de titre propre que l’hébreu ne marque pas nécessairement.
