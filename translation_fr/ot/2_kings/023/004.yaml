source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: fr
  text: Le roi ordonna alors au grand prêtre Hilqiya, aux prêtres de second rang et aux gardiens du seuil de retirer du temple de Yahweh tous les objets fabriqués pour Baal, pour Ashéra[a] et pour toute l’armée du ciel. Il les brûla hors de Jérusalem, dans les champs du Cédron, puis en transporta la poussière à Béthel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner un objet cultuel associé à Ashéra.
    reason: Préserve l’ambiguïté lexicale de אֲשֵׁרָה sans réduire l’alternative à un type précis d’objet cultuel.
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Le roi ordonna alors
  rationale: « Ordonner » restitue la force d’autorité de צוה; « alors » marque naturellement la progression narrative du waw consécutif.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: au grand prêtre Hilqiya
  rationale: « Grand prêtre » est le titre français établi; Hilqiya translittère le nom hébreu de manière reconnaissable et proche de sa forme source.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: aux prêtres de second rang
  rationale: Cette formulation naturelle conserve l’idée d’un rang secondaire sans préciser abusivement la structure de la fonction.
- source_word: שֹׁמְרֵי הַסַּף
  choice: aux gardiens du seuil
  rationale: Rendu proche de l’image et du rôle officiels exprimés par l’hébreu, sans réduire ceux-ci à de simples portiers.
- source_word: מֵהֵיכַל יְהוָה
  choice: du temple de Yahweh
  rationale: Le contexte cultuel impose « temple » pour היכל; le nom divin est rendu directement par « Yahweh ».
- source_word: כָּל הַכֵּלִים
  choice: tous les objets
  rationale: « Objets » est ici plus clair en français moderne que « ustensiles » ou « vases », tout en gardant la portée générale du terme.
- source_word: לַבַּעַל וְלָאֲשֵׁרָה וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: pour Baal, pour Ashéra et pour toute l’armée du ciel
  rationale: La répétition de « pour » conserve la construction parallèle et évite de trancher le référent ambigu d’Ashéra.
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: dans les champs du Cédron
  rationale: Rendu géographique idiomatique et proche du sens du texte.
- source_word: וְנָשָׂא אֶת עֲפָרָם
  choice: puis en transporta la poussière
  rationale: עפר désigne littéralement la poussière; le pronom « en » rattache clairement celle-ci aux objets brûlés sans la transformer en « cendres ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » conserve explicitement le nom propre sans le remplacer par un titre.
- issue: Référent de אֲשֵׁרָה
  choice: Ashéra
  alternative: le poteau sacré d’Ashéra
  rationale: Le mot peut désigner la déesse ou l’objet cultuel qui lui est associé. Le parallèle avec Baal et l’armée du ciel favorise le nom propre dans le texte, tandis qu’une note préserve l’autre possibilité.
- issue: Sujet de וַיִּשְׂרְפֵם
  choice: Il les brûla
  alternative: On les brûla
  rationale: La forme verbale est masculine singulière et renvoie naturellement au roi, même si l’exécution matérielle a pu être confiée à ses agents; la traduction conserve la responsabilité grammaticale du roi.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche de la progression hébraïque tout en évitant les archaïsmes; les titres et les lieux suivent des formes françaises naturelles.
