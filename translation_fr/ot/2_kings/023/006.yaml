  to: Il fit sortir l’Ashéra[a] de la maison de Yahweh et l’emporta hors de Jérusalem, dans la vallée du Cédron. Là, il la brûla, la réduisit en poussière et jeta sa poussière sur les tombes des gens du peuple.
