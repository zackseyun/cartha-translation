  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: fr
  text: Il fit sortir l’Ashéra[a] de la maison de Yahweh et l’emporta hors de Jérusalem, dans la vallée du Cédron. Là, il la brûla, la réduisit en poussière et jeta sa poussière sur les tombes des gens du peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poteau sacré d’Ashéra » ou « l’image d’Ashéra ». Le terme hébreu peut désigner la déesse cananéenne Ashéra ou l’objet cultuel associé à son culte. Ici, il désigne l’objet que le roi fait enlever et détruire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: l’Ashéra
  rationale: La translittération conserve le référent cultuel précis sans déterminer abusivement si l’objet avait la forme d’un poteau ou d’une statue. Le contexte montre qu’il s’agit ici de l’objet associé au culte d’Ashéra.
- source_word: מִבֵּית יְהוָה
  choice: de la maison de Yahweh
  rationale: « Maison » reproduit l’expression hébraïque désignant le sanctuaire tout en restant intelligible en français; le nom divin est conservé sous la forme « Yahweh ».
- source_word: נַחַל קִדְרוֹן
  choice: la vallée du Cédron
  rationale: נַחַל peut désigner un ravin, un oued ou la vallée parcourue par un cours d’eau saisonnier. « Vallée du Cédron » est une désignation géographique française claire et courante.
- source_word: וַיָּדֶק לְעָפָר
  choice: la réduisit en poussière
  rationale: Cette formulation naturelle exprime la pulvérisation complète indiquée par le verbe et son complément.
- source_word: עֲפָרָהּ
  choice: cette poussière
  rationale: עָפָר signifie « poussière », et non spécifiquement « cendres ». Le démonstratif évite en français une répétition lourde et renvoie sans ambiguïté à l’objet pulvérisé.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: sur les tombes des gens du peuple
  rationale: « Gens du peuple » rend la nuance sociale probable de בְּנֵי הָעָם, par opposition aux élites. Le pluriel français « tombes » exprime naturellement le lieu funéraire collectif évoqué par le singulier hébreu.
theological_decisions:
- issue: Identification de l’Ashéra
  choice: l’Ashéra
  alternative: le poteau sacré d’Ashéra / la statue d’Ashéra
  rationale: Le terme hébreu peut désigner Ashéra ou l’objet cultuel lié à son culte. Puisque cet élément est transporté, brûlé et pulvérisé, il s’agit ici d’un objet; la translittération préserve néanmoins l’ambiguïté concernant sa forme exacte.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque répétitive est légèrement restructurée avec « Là » afin d’éviter une répétition pesante de « vallée du Cédron », sans modifier la succession des actes.
