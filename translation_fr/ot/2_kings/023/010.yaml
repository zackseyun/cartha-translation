id: 2KI.23.10
reference: 2 Kings 23:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: fr
  text: Il souilla le Topheth, situé dans la vallée de Ben-Hinnom, afin que personne ne fasse passer son fils ou sa fille par le feu pour Molek[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « faire passer […] par le feu » désigne un rite cultuel associé à Molek, très probablement un sacrifice d’enfants. Le dernier mot peut aussi se comprendre, de façon moins probable, comme « le roi ».
    reason: Clarification culturelle et signalement d’une autre lecture possible.
lexical_decisions:
- source_word: וְטִמֵּא
  choice: Il souilla
  rationale: Le piel de טמא signifie « rendre impur, souiller ». Ici, Josias rend ce lieu cultuel impropre à tout nouvel usage; « souilla » conserve la notion d’impureté sans ajouter l’idée plus interprétative de profanation.
- source_word: הַתֹּפֶת
  choice: le Topheth
  rationale: Le nom de lieu est translittéré selon l’usage français, et l’article hébreu est naturellement conservé en français.
- source_word: בְּגֵי בני הִנֹּם
  choice: dans la vallée de Ben-Hinnom
  rationale: גֵי signifie « vallée ». « Ben-Hinnom » conserve le toponyme traditionnel sans transformer artificiellement le nom propre en « fils de Hinnom ».
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: afin que personne ne fasse passer
  rationale: La construction exprime le but préventif, et le hifil de עבר est causatif. « Afin que personne ne fasse passer » reproduit naturellement ces deux éléments.
- source_word: אִישׁ
  choice: personne
  rationale: Le masculin singulier אִישׁ a ici une portée générique. Dans une proposition négative française, « personne » en rend précisément et naturellement le sens.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: son fils ou sa fille
  rationale: Après une négation, « ou » exprime en français la portée distributive voulue, bien que l’hébreu emploie la conjonction ordinaire « et ».
- source_word: בָּאֵשׁ
  choice: par le feu
  rationale: Avec « faire passer », cette formulation française conserve l’expression rituelle hébraïque sans préciser au-delà du texte la manière exacte dont le feu intervenait.
- source_word: לַמֹּלֶךְ
  choice: pour Molek
  rationale: Dans ce contexte cultuel, le terme est le plus probablement le nom de la divinité Molek. La préposition ל peut ici être naturellement rendue par « pour ».
theological_decisions:
- issue: Formulation du rite impliquant les enfants
  choice: Conserver l’expression « faire passer son fils ou sa fille par le feu » dans le texte principal
  alternative: « sacrifier son fils ou sa fille par le feu »
  rationale: Le contexte désigne un rite cultuel associé à Molek, très probablement un sacrifice d’enfants, mais l’hébreu emploie une expression idiomatique plutôt que le verbe explicite « sacrifier ». Le texte principal préserve cette tension, et la note apporte l’éclairage nécessaire.
- issue: Identification de לַמֹּלֶךְ
  choice: Molek
  alternative: « le roi »
  rationale: L’identification à Molek est la lecture la plus probable dans ce contexte. La possibilité de comprendre les consonnes comme « au roi » demeure une lecture minoritaire et est signalée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant idiomatique; les noms propres sont translittérés sous les formes Topheth, Ben-Hinnom et Molek.
