- from: Ses serviteurs transportèrent son corps depuis Megiddo et l’amenèrent à Jérusalem[a]. Ils l’ensevelirent dans son tombeau. Puis le peuple du pays[b] prit Joachaz, fils de Josias, lui donna l’onction et le proclama roi à la place de son père.
