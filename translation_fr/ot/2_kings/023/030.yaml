    issue: « lui donna l’onction » atténue le verbe explicite d’onction.
    rationale: וַיִּמְשְׁחוּ signifie directement « ils l’oignirent ». Employer « oignirent » préserve l’acte rituel et politique formulé par le texte.
  - severity: low
    issue: « le proclama roi » introduit une nuance non explicitement exprimée.
    rationale: וַיַּמְלִיכוּ signifie « ils le firent roi » ou « ils l’établirent roi »; une proclamation publique peut être impliquée contextuellement, mais n’est pas énoncée.
  - severity: low
    issue: La note a spécule sur un char ou une monture et son ancrage est éloigné du verbe concerné.
    rationale: Le texte indique le transport et le verbe signifie littéralement « firent monter/monter à cheval », mais il ne précise pas le véhicule. La note doit se limiter à cette alternative lexicale et être ancrée à « transportèrent ».
  revised_text: Ses serviteurs transportèrent[a] son corps de Megiddo et l’amenèrent à Jérusalem. Ils l’ensevelirent dans son tombeau. Puis le peuple du pays[b] prit Joachaz, fils de Josias, l’oignit et le fit roi à la place de son père.
