  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: fr
  text: Ses serviteurs transportèrent[a] son corps de Megiddo et l’amenèrent à Jérusalem. Ils l’ensevelirent dans son tombeau. Puis le peuple du pays[b] prit Joachaz, fils de Josias, l’oignit et le fit roi à la place de son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le firent monter » ou « le firent monter à cheval ». Dans ce contexte, le verbe désigne le transport du corps de Josias.'
    reason: lexical_alternative
  - marker: b
    text: « Le peuple du pays » est une expression hébraïque désignant ici la population locale agissant comme corps politique.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ מֵת מִמְּגִדּוֹ
  choice: transportèrent son corps depuis Megiddo
  rationale: Le hifil de רכב signifie littéralement « faire monter » ou « faire voyager ». Puisque מֵת précise que Josias était mort, « transportèrent son corps » exprime naturellement en français le déplacement de sa dépouille sans suggérer qu’il voyageait vivant.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עבד peut désigner des serviteurs, des officiers ou des membres de l’entourage royal. « Serviteurs » reste direct et laisse le contexte royal préciser leur fonction.
- source_word: וַיְבִאֻהוּ יְרוּשָׁלַם
  choice: l’amenèrent à Jérusalem
  rationale: Le verbe בוא à la forme causative avec une destination signifie ici « amener à ». Le pronom renvoie à Josias, dont le corps vient d’être mentionné.
- source_word: וַיִּקְבְּרֻהוּ בִּקְבֻרָתוֹ
  choice: Ils l’ensevelirent dans son tombeau
  rationale: קבר désigne l’action d’ensevelir, et קְבֻרָה le lieu de sépulture. « Tombeau » convient au contexte d’une sépulture royale.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Cette expression hébraïque peut désigner la population locale agissant comme corps sociopolitique. La traduction formelle évite de la réduire sans preuve aux seules classes populaires.
- source_word: וַיִּקַּח
  choice: prit
  rationale: לקח signifie d’abord « prendre ». Dans ce contexte, le peuple prend Joachaz pour l’investir de la royauté; « prit » préserve la formulation hébraïque sans expliciter davantage que le texte.
- source_word: יְהוֹאָחָז בֶּן יֹאשִׁיָּהוּ
  choice: Joachaz, fils de Josias
  rationale: Les formes françaises bibliques usuelles des noms sont conservées, avec une filiation rendue de manière concise et transparente.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: lui donna l’onction
  rationale: משׁח désigne l’onction rituelle et politique. Cette expression française conserve l’acte concret d’investiture royale.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: le proclama roi à la place de son père
  rationale: Le hifil de מלך signifie faire régner ou établir comme roi. « Proclama roi » est naturel en français et exprime l’accession publique, tandis que « à la place de son père » rend directement תַּחַת אָבִיו.
theological_decisions:
- issue: Langage de l’onction royale
  choice: lui donna l’onction
  alternative: le désigna
  rationale: Le texte emploie explicitement משׁח, le verbe de l’onction. Il faut conserver la portée cérémonielle et politique de cet acte plutôt que le réduire à une simple désignation.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le registre narratif historique. « Transportèrent son corps » explicite sobrement l’état indiqué par מֵת, tandis que la note conserve l’image verbale littérale. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
