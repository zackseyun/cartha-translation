base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: fr
  text: Jojakim remit l’argent et l’or au pharaon. Toutefois, il leva sur le pays une contribution[a] afin de fournir l’argent sur l’ordre du pharaon[b]. Il exigea l’argent et l’or du peuple du pays, de chacun selon l’estimation établie pour lui[c], afin de les remettre au pharaon Néko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il soumit le pays à une évaluation » ou « il imposa une contribution sur le pays ». Le verbe hébreu désigne ici l’établissement d’une somme à payer.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « selon la bouche du pharaon », c’est-à-dire selon son ordre.
    reason: lexical_alternative
  - marker: c
    text: Ou « de chacun selon le montant qui lui avait été fixé »; de manière plus interprétative, « de chacun selon ses moyens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: l’argent et l’or
  rationale: « Argent » désigne à la fois le métal et, selon le contexte, un moyen de paiement; il conserve ici le parallélisme concret avec « or ».
- source_word: נָתַן
  choice: remit
  rationale: Dans le contexte d’un tribut, « remit » exprime naturellement l’acte de donner au pharaon sans rendre le verbe plus technique qu’il ne l’est en hébreu.
- source_word: הֶעֱרִיךְ אֶת הָאָרֶץ
  choice: imposa une contribution au pays
  rationale: Le hiphil de ערך désigne ici une évaluation imposée en vue du paiement. Cette formulation française rend clairement sa portée fiscale tout en signalant l’alternative plus formelle en note.
- source_word: עַל־פִּי פַרְעֹה
  choice: sur l’ordre du pharaon
  rationale: Littéralement « selon la bouche du pharaon »; l’expression idiomatique signifie que le paiement répondait à son ordre.
- source_word: נָגַשׂ
  choice: exigea
  rationale: Le verbe comporte une nuance de contrainte dans la perception du paiement; « exigea » la conserve mieux que le plus neutre « recueillit ».
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: de chacun selon son estimation
  rationale: La formulation maintient l’idée d’une évaluation individualisée et l’ambiguïté du possessif, sans préciser si elle se fondait sur les moyens de chacun.
- source_word: עַם הָאָרֶץ
  choice: le peuple du pays
  rationale: Cette traduction proche de l’hébreu évite de déterminer sans nécessité s’il s’agit spécifiquement des gens du peuple, des propriétaires ou d’un corps sociopolitique.
- source_word: פַרְעֹה נְכֹה
  choice: le pharaon Néko
  rationale: « Néko » est une translittération française claire du nom hébreu et distingue le nom propre du titre royal.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour rester naturelle, tandis que les répétitions de « l’argent et l’or » et « peuple du pays » conservent les traits marquants de l’hébreu. Le possessif de « son estimation » demeure volontairement ambigu.
