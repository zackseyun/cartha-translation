  to: Jojakim remit l’argent et l’or au pharaon. Toutefois, il leva sur le pays une contribution[a] afin de fournir l’argent sur l’ordre du pharaon[b]. Il exigea l’argent et l’or du peuple du pays, de chacun selon l’estimation établie pour lui[c], afin de les remettre au pharaon Néko.
