revisions:
- from: Il fit disparaître les chevaux que les rois de Juda avaient consacrés au soleil à l’entrée de la maison de Yahweh, près de la salle de Netân-Mélek, le haut fonctionnaire[a], qui se trouvait dans les dépendances[b] ; puis il brûla au feu les chars du soleil.
  to: Il fit disparaître les chevaux que les rois de Juda avaient consacrés au soleil, à l’entrée de la maison de Yahweh, près de la salle située dans les dépendances[b] et appartenant à Netân-Mélek, un fonctionnaire de la cour[a] ; puis il brûla au feu les chars du soleil.
  rationale: La révision attribue explicitement la localisation dans les dépendances à la salle, comme l’indique la syntaxe hébraïque, et remplace « haut fonctionnaire » par une expression qui préserve mieux l’ambiguïté de סָרִיס. Elle conserve la prudence nécessaire pour la relation spatiale complexe et pour le terme rare פַּרְוָרִים.
