  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: fr
  text: Il fit disparaître les chevaux que les rois de Juda avaient consacrés au soleil, à l’entrée de la maison de Yahweh, près de la salle située dans les dépendances[b] et appartenant à Netân-Mélek, un fonctionnaire de la cour[a] ; puis il brûla au feu les chars du soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’eunuque » ; le terme hébreu peut désigner soit un eunuque, soit un fonctionnaire de la cour.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est rare et désigne peut-être une partie périphérique du complexe du temple ; on pourrait aussi traduire « dans les bâtiments annexes » ou « sous les portiques ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: Il fit disparaître
  rationale: Le hiphil de שׁבת signifie ici faire cesser ou retirer de l’usage. « Fit disparaître » exprime naturellement l’élimination de ces objets cultuels dans le cadre des réformes de Josias.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: que les rois de Juda avaient consacrés au soleil
  rationale: נתן signifie littéralement « donner », mais le contexte cultuel indique une affectation ou une consécration au culte solaire.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: à l’entrée de la maison de Yahweh, près de la salle de
  rationale: La construction localise vraisemblablement les chevaux à l’entrée du temple, du côté de la salle mentionnée. Cette formulation évite de présenter à tort la séquence comme un déplacement « de… à… ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: נְתַן מֶלֶךְ
  choice: Netân-Mélek
  rationale: Transcription française du nom propre selon la vocalisation massorétique.
- source_word: הַסָּרִיס
  choice: le haut fonctionnaire
  rationale: סָרִיס peut désigner un eunuque ou un fonctionnaire de cour. Le texte ne permet pas de trancher avec certitude ; le sens administratif convient au contexte, et l’autre possibilité est signalée en note.
- source_word: בַּפַּרְוָרִים
  choice: dans les dépendances
  rationale: Ce terme architectural rare paraît désigner une zone périphérique ou annexe du complexe du temple. « Dépendances » reste intelligible sans imposer une identification trop précise.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: les chars du soleil
  rationale: La traduction littérale conserve l’image cultuelle et son éventuelle ambiguïté.
- source_word: שָׂרַף בָּאֵשׁ
  choice: il brûla au feu
  rationale: La formulation conserve l’expression hébraïque explicite avec « feu », malgré une légère redondance naturelle en français biblique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription garde le nom divin personnel du texte source plutôt que de lui substituer un titre.
- issue: Nature de la consécration des chevaux au soleil
  choice: consacrés au soleil
  alternative: donnés au soleil
  rationale: Le contexte des réformes cultuelles justifie « consacrés », sans préciser davantage la fonction exacte des chevaux ni identifier explicitement le soleil comme une divinité nommée.
translation_notes:
  register: Français international moderne, digne et accessible. Passé simple adapté au récit historique. « Maison de Yahweh » préserve la désignation hébraïque du temple ; les notes maintiennent les incertitudes lexicales réelles.
