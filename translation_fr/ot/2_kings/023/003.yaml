revisions:
- from: 'Le roi se tint près de la colonne et conclut l’alliance devant Yahweh : il s’engageait à suivre Yahweh, à garder ses commandements, ses prescriptions et ses décrets de tout son cœur et de toute son âme, et à mettre en pratique les paroles de cette alliance écrites dans ce livre[a]. Tout le peuple adhéra à l’alliance[b].'
  to: 'Le roi se tint près de la colonne et conclut l’alliance devant Yahweh : il s’engagea à suivre Yahweh, à garder ses commandements, ses prescriptions et ses décrets de tout son cœur et de toute son âme, et à mettre en pratique les paroles de cette alliance écrites dans ce livre[a]. Tout le peuple s’engagea dans l’alliance[b].'
  rationale: La révision corrige l’imparfait « s’engageait » en passé simple afin d’aligner la syntaxe française sur la succession d’actes narratifs et sur la portée de l’engagement royal. Elle remplace aussi « adhéra à l’alliance » par « s’engagea dans l’alliance », formulation qui exprime plus nettement la ratification collective sans imposer d’interprétation rituelle. Les notes existantes, correctement ancrées, sont conservées.
