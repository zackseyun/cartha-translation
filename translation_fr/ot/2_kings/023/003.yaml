  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: fr
  text: 'Le roi se tint près de la colonne et conclut l’alliance devant Yahweh : il s’engagea à suivre Yahweh, à garder ses commandements, ses prescriptions et ses décrets de tout son cœur et de toute son âme, et à mettre en pratique les paroles de cette alliance écrites dans ce livre[a]. Tout le peuple s’engagea dans l’alliance[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ce rouleau ». Le mot hébreu peut désigner un livre, un rouleau ou un document écrit.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « se tint dans l’alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: se tint près de la colonne
  rationale: Le sens premier est « se tenir debout »; עַל peut situer quelqu’un sur, auprès de ou à un emplacement donné. Dans ce cadre cérémoniel royal, « près de la colonne » est naturel et évite de suggérer que le roi se tenait littéralement dessus.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: conclut l’alliance
  rationale: כרת ברית est l’expression hébraïque usuelle pour conclure une alliance. Le français « conclure une alliance » est idiomatique et conserve l’article défini.
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie ici « devant, en présence de ». La formulation concise garde la solennité de la scène.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: suivre Yahweh
  rationale: Littéralement « marcher après Yahweh ». En français contemporain, « suivre Yahweh » exprime clairement l’image de fidélité et d’obéissance sans produire un calque peu naturel.
- source_word: לִשְׁמֹר
  choice: garder
  rationale: Dans un contexte d’alliance et de loi, שׁמר signifie observer fidèlement. « Garder » conserve cette nuance traditionnelle tout en restant intelligible.
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: ses commandements, ses prescriptions et ses décrets
  rationale: Cette série maintient trois catégories distinctes de dispositions divines. « Prescriptions » rend עֵדוֹת plus naturellement que le calque « témoignages » dans ce contexte juridique, tandis que « décrets » convient aux règles fixées désignées par חֻקִּים.
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: de tout son cœur et de toute son âme
  rationale: Cette formule française familière préserve les deux termes anthropologiques et la portée totale de l’engagement.
- source_word: לְהָקִים
  choice: mettre en pratique
  rationale: Dans ce contexte, le verbe indique la mise à exécution des paroles de l’alliance; « mettre en pratique » communique ce sens clairement.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: les paroles de cette alliance
  rationale: « Paroles » reste proche de דִּבְרֵי et souligne leur caractère écrit, sans les réduire par interprétation aux seuls « termes » juridiques.
- source_word: הַסֵּפֶר הַזֶּה
  choice: ce livre
  rationale: סֵפֶר peut désigner un livre, un rouleau ou un document écrit. « Livre » est naturel dans le texte, et la note conserve l’autre possibilité historique.
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: Tout le peuple adhéra à l’alliance
  rationale: Littéralement, le peuple « se tint dans l’alliance ». « Adhéra à l’alliance » exprime en français naturel la ratification et l’engagement collectifs, tandis qu’une note préserve la forme hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Portée de la formule finale וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: Tout le peuple adhéra à l’alliance
  alternative: Tout le peuple se tint dans l’alliance
  rationale: La traduction principale rend la valeur idiomatique d’engagement collectif sans trancher davantage la nature précise du rite. La formulation littérale est signalée en note.
- issue: Sujet implicite des infinitifs de l’engagement
  choice: il s’engageait à suivre…
  alternative: pour suivre…
  rationale: Le roi est le sujet grammatical immédiat, et les expressions « de tout son cœur » et « de toute son âme » sont au singulier. Cette formulation rend explicite le lien syntaxique sans nier l’adhésion ultérieure du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme solennel de la cérémonie est conservé, avec des formulations idiomatiques plutôt que des calques opaques. Les distinctions de vocabulaire juridique sont maintenues autant que le permet le français courant.
