source:
  edition: WLC
  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: fr
  text: Cependant, Yahweh ne se détourna pas de l’ardeur de sa grande colère[a], cette colère qui brûlait contre Juda[b], à cause de toutes les provocations par lesquelles Manassé l’avait poussé à la colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu évoque littéralement la brûlure ou l’embrasement de la colère, image idiomatique d’une colère intense.
    reason: lexical_alternative
  - marker: b
    text: Ou « en Juda ». La préposition hébraïque signifie littéralement « en/dans », mais le français dit naturellement qu’une colère brûle « contre » quelqu’un ou un peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Cependant
  rationale: Marque nettement le contraste avec les réformes de Josias mentionnées dans le contexte précédent.
- source_word: שָׁב
  choice: ne se détourna pas
  rationale: Conserve l’image fondamentale du verbe « tourner/revenir » et son complément introduit par מִן, sans expliciter davantage par « renoncer » ou « revenir sur sa décision ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: de l’ardeur de sa grande colère
  rationale: « Ardeur » exprime l’idée de brûlure contenue dans חֲרוֹן, tandis que « grande » rend הַגָּדוֹל. La formulation reste lisible tout en conservant l’image hébraïque.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: cette colère qui brûlait
  rationale: Reprend explicitement « colère » et conserve le verbe imagé « brûler », reflétant la répétition expressive de l’hébreu.
- source_word: בִּיהוּדָה
  choice: contre Juda
  rationale: Bien que בְּ signifie normalement « en/dans », le français emploie naturellement « contre » pour indiquer la cible d’une colère.
- source_word: עַל כָּל הַכְּעָסִים
  choice: à cause de toutes les provocations
  rationale: Dans ce contexte, le pluriel désigne les actes qui suscitent la colère; « provocations » en rend la valeur causative.
- source_word: אֲשֶׁר הִכְעִיסוֹ מְנַשֶּׁה
  choice: par lesquelles Manassé l’avait poussé à la colère
  rationale: Rend explicitement la valeur causative du hiphil de כעס et maintient le lien lexical avec les « provocations ».
theological_decisions:
- issue: Langage anthropopathique décrivant la colère divine
  choice: Conserver les images de l’ardeur et de la colère qui brûle.
  alternative: Yahweh ne renonça pas à son grand courroux.
  rationale: Le texte hébreu emploie à deux reprises un langage concret associé à la chaleur et à la colère. La traduction le garde sans l’atténuer ni lui ajouter une explication doctrinale.
- issue: Traduction du nom divin
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription permet de distinguer le nom personnel יהוה du titre אֲדֹנָי.
- issue: Persistance de la colère malgré les réformes de Josias
  choice: Traduire simplement le contraste par « Cependant » et « ne se détourna pas ».
  alternative: Yahweh refusa de pardonner à Juda.
  rationale: Le verset affirme que Yahweh ne se détourna pas de sa colère, mais ne formule pas directement une doctrine générale du pardon ni un refus de pardonner; la traduction n’ajoute donc pas cette conclusion.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Ardeur » et la répétition de « colère » préservent l’intensité et l’image de l’hébreu; « poussé à la colère » évite la répétition française peu naturelle « provoqué par des provocations » tout en maintenant le lien causatif.
