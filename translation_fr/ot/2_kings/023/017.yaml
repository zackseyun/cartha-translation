  source_fidelity: 'Le texte rend fidèlement les principaux éléments hébreux : le marqueur funéraire visible (הַצִּיּוּן), la tombe, le titre « l’homme de Dieu », son origine judéenne, sa proclamation antérieure et l’action de Josias contre l’autel de Béthel. « Ces choses » conserve de façon prudente l’ampleur de הַדְּבָרִים הָאֵלֶּה, qui peut renvoyer aux paroles prononcées aussi bien qu’aux événements annoncés et désormais réalisés.'
