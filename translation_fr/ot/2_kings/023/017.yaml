source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֚ה הַ/צִּיּ֣וּן הַלָּ֔ז אֲשֶׁ֖ר אֲנִ֣י רֹאֶ֑ה וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אַנְשֵׁ֣י הָ/עִ֗יר הַ/קֶּ֤בֶר אִישׁ הָֽ/אֱלֹהִים֙ אֲשֶׁר בָּ֣א מִֽ/יהוּדָ֔ה וַ/יִּקְרָ֗א אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר עָשִׂ֔יתָ עַ֖ל הַ/מִּזְבַּ֥ח בֵּֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: fr
  text: 'Alors il demanda : « Quel est ce monument[a] que je vois ? » Les hommes de la ville lui répondirent : « C’est la tombe de l’homme de Dieu qui est venu de Juda et qui a proclamé[b] ces choses que tu as faites contre l’autel de Béthel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « signe », « pierre commémorative » ou « monument funéraire ».
    reason: lexical_alternative
  - marker: b
    text: Ou « a crié » ou « a appelé à haute voix »; le verbe désigne ici la déclaration prophétique de l’homme de Dieu au sujet de l’autel (voir 1 Rois 13.1-2).
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: monument
  rationale: Le nom désigne un signe visible servant à marquer ou à commémorer un lieu. Dans ce contexte funéraire, « monument » reste naturel et suffisamment large pour ne pas préciser indûment la forme de l’objet.
- source_word: הַלָּז
  choice: ce
  rationale: Le démonstratif désigne ici un objet visible. Le français idiomatique l’intègre naturellement dans « ce monument » sans qu’il soit nécessaire d’ajouter « -là ».
- source_word: אֲנִי רֹאֶה
  choice: que je vois
  rationale: Le présent français rend naturellement la construction participiale hébraïque et la perception immédiate de Josias.
- source_word: הַקֶּבֶר
  choice: la tombe
  rationale: « Tombe » convient à un lieu d’ensevelissement identifié par un monument visible.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette traduction transparente conserve le titre hébraïque traditionnel sans le réduire à l’interprétation « prophète ».
- source_word: מִיהוּדָה
  choice: de Juda
  rationale: Formulation géographique courante et directe en français.
- source_word: וַיִּקְרָא
  choice: a proclamé
  rationale: Dans le rappel de 1 Rois 13.1-2, le verbe décrit une déclaration prophétique publique. « Proclamer » en exprime la force sans ajouter de contenu.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces choses
  rationale: L’expression peut viser à la fois les paroles prononcées et les événements annoncés puis accomplis; « ces choses » préserve cette ampleur.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: que tu as faites
  rationale: Le passé composé relie naturellement les actes récents de Josias à la scène présente.
- source_word: עַל הַמִּזְבֵּחַ
  choice: contre l’autel
  rationale: Le contexte de condamnation et de destruction donne à la préposition une valeur adversative que « contre » exprime clairement.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Il s’agit de la forme française usuelle du nom de lieu.
theological_decisions:
- issue: Nature de la déclaration antérieure de l’homme de Dieu
  choice: Employer « a proclamé » pour signaler une déclaration prophétique publique sans en développer le contenu.
  alternative: « a crié » ou « a lancé cet appel »
  rationale: Le verset renvoie à la prophétie de 1 Rois 13 contre l’autel de Béthel. La traduction retenue rend cette fonction perceptible tout en restant dans les limites du texte présent.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct; « demanda » explicite la valeur interrogative de וַיֹּאמֶר sans alourdir la phrase. Les marqueurs de notes sont placés immédiatement après les termes qu’ils documentent.
