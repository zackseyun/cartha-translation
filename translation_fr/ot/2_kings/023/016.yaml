source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: fr
  text: Puis Josias se tourna et vit les tombeaux qui se trouvaient là, sur la montagne[a]. Il envoya prendre les ossements des tombeaux, les brûla sur l’autel et le rendit impur, conformément à la parole de Yahweh que l’homme de Dieu avait proclamée[b], lui qui avait proclamé ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les tombes ». Le mot hébreu peut désigner des lieux de sépulture en général, et pas seulement des tombeaux construits.
    reason: lexical_alternative
  - marker: b
    text: Ou « avait crié » ou « avait appelé à haute voix ». Le verbe hébreu peut souligner une proclamation publique faite à voix forte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: se retourna
  rationale: Le verbe פנה exprime ici le fait de se tourner; « se retourna » rend naturellement le mouvement qui précède la découverte des tombeaux.
- source_word: הַקְּבָרִים
  choice: les tombeaux
  rationale: קבר peut désigner une tombe ou un tombeau. « Tombeaux » convient à des lieux de sépulture visibles sur la montagne, sans exclure le sens plus général signalé en note.
- source_word: בָּהָר
  choice: sur la montagne
  rationale: הַר peut désigner une montagne ou une colline; « montagne » traduit directement le terme sans préciser davantage le relief.
- source_word: הָעֲצָמוֹת
  choice: les ossements
  rationale: עצמות signifie concrètement « os ». « Ossements » est naturel en français pour des restes humains et conserve l’élément matériel de la profanation.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: les brûla sur l’autel
  rationale: La formulation garde les ossements comme objet direct et rend על par « sur », conformément à l’action cultuelle décrite.
- source_word: וַיְטַמְּאֵהוּ
  choice: le rendit impur
  rationale: טמא relève ici de l’impureté rituelle. Le pronom masculin renvoie le plus naturellement à l’autel; « rendit impur » exprime directement le résultat rituel sans employer un terme seulement moral.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: Cette formule marque l’accomplissement d’une parole divine antérieure; « conformément à » exprime clairement ce rapport.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Traduction directe de l’expression hébraïque et titre prophétique établi, sans la paraphraser par « prophète ».
- source_word: קָרָא
  choice: avait proclamée / avait annoncé
  rationale: קרא peut signifier appeler, crier ou proclamer. Les deux formulations françaises rendent ici une déclaration prophétique publique; la variation évite une répétition pesante sans effacer la reprise hébraïque.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces choses
  rationale: דברים peut désigner des paroles, des affaires ou des événements. « Ces choses » préserve l’étendue de la référence aux actes annoncés.
theological_decisions:
- issue: Formule d’accomplissement reliant l’action de Josias à la prophétie antérieure
  choice: « conformément à la parole de Yahweh que l’homme de Dieu avait proclamée »
  alternative: « selon la parole de Yahweh que l’homme de Dieu avait criée »
  rationale: La syntaxe présente l’action de Josias comme l’accomplissement de la parole de Yahweh transmise par l’homme de Dieu. La traduction conserve ce lien sans ajouter d’explication.
- issue: Rattachement de la dernière proposition relative
  choice: « lui qui avait annoncé ces choses » renvoie à l’homme de Dieu
  alternative: Formulation susceptible de rattacher la proposition à la parole de Yahweh
  rationale: Le participe relatif français explicite le référent humain naturel du second אֲשֶׁר קָרָא, tout en maintenant la répétition emphatique de l’activité prophétique.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le nom propre est conservé sous une translittération française courante, conformément au texte source et sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte les actions principales, tandis que le plus-que-parfait situe la proclamation antérieure. « Ossements » et « rendit impur » sont clairs pour un lectorat général tout en préservant la portée rituelle du passage.
