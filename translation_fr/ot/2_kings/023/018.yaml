  text: וַ/יֹּ֨אמֶר֙ הַנִּ֣יחוּ ל֔/וֹ אִ֖ישׁ אַל יָנַ֣ע עַצְמֹתָ֑י/ו וַֽ/יְמַלְּטוּ֙ עַצְמֹתָ֔י/ו אֵ֚ת עַצְמ֣וֹת הַ/נָּבִ֔יא אֲשֶׁר בָּ֖א מִ/שֹּׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: fr
  text: 'Il dit : « Laissez-le tranquille ! Que personne ne déplace ses os. » Ils épargnèrent[a] donc ses os, ainsi que ceux du prophète qui était venu de Samarie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « laissèrent donc ses os intacts ».'
    reason: 'Le verbe מלט peut ici mettre l’accent soit sur le fait d’épargner les os, soit sur le résultat : ils furent laissés intacts.'
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: Laissez-le tranquille
  rationale: L’impératif idiomatique ordonne de ne plus intervenir contre le défunt ni ses restes. Cette formulation est naturelle en français moderne.
- source_word: אִישׁ אַל יָנַע
  choice: Que personne ne déplace
  rationale: אִישׁ a ici une valeur générique, bien rendue par « personne » dans une interdiction. Dans ce contexte, נוע désigne le fait de déplacer les os de leur lieu de repos.
- source_word: עַצְמֹתָיו
  choice: ses os
  rationale: Le terme concret « os » est conservé, de même que sa répétition dans le verset.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: Ils épargnèrent donc ses os
  rationale: Le piel de מלט exprime ici le fait de préserver ou d’épargner les os de la profanation. « Épargnèrent » reste concis et proche de cette valeur.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: ainsi que ceux du prophète
  rationale: « Ceux » reprend naturellement « les os » en français tout en indiquant que les os du prophète furent eux aussi préservés.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: qui était venu de Samarie
  rationale: Le plus-que-parfait marque clairement que la venue du prophète depuis Samarie était antérieure à la scène racontée.
