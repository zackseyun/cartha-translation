  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: fr
  text: Le roi profana les hauts lieux situés en face de Jérusalem[a], à droite[b] du mont de la Destruction[c], que Salomon, roi d’Israël, avait bâtis pour Astarté, l’abomination des Sidoniens, pour Kemosh, l’abomination de Moab, et pour Milkom[d], l’abomination des Ammonites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’est de Jérusalem »; l’expression hébraïque signifie littéralement « devant Jérusalem » ou « en face de Jérusalem » et peut avoir ici une valeur topographique.
    reason: lexical_alternative
  - marker: b
    text: Ou « au sud »; dans l’orientation géographique hébraïque, le côté droit peut désigner le sud.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « mont de la Destruction »; on peut aussi comprendre « mont de la Corruption ». Cette hauteur est parfois identifiée au mont des Oliviers.
    reason: cross_reference
  - marker: d
    text: L’hébreu porte « Milkom », divinité des Ammonites; ce nom est parfois rapproché de « Molek ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: Cette expression française consacrée conserve le sens cultuel de בָּמוֹת, qui désigne ici des lieux de culte illégitimes, sans les réduire à un type précis de sanctuaire.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: en face de Jérusalem
  rationale: La formulation garde le sens spatial de l’expression hébraïque sans imposer dans le texte principal l’identification plus précise « à l’est de Jérusalem ».
- source_word: מִימִין
  choice: à droite
  rationale: Ce rendu reproduit le sens direct de l’hébreu. L’interprétation topographique « au sud » est signalée en note.
- source_word: הַר הַמַּשְׁחִית
  choice: le mont de la Destruction
  rationale: Le nom hébreu à portée péjorative est traduit plutôt que remplacé par l’identification traditionnelle au mont des Oliviers. « Destruction » rend le sens principal de מַשְׁחִית, tout en laissant « Corruption » comme possibilité.
- source_word: עַשְׁתֹּרֶת
  choice: Astarté
  rationale: Astarté est la forme française courante du nom de cette divinité sidonienne.
- source_word: שִׁקֻּץ / תּוֹעֲבַת
  choice: l’abomination
  rationale: Le même terme français préserve la forte condamnation cultuelle exprimée par les deux substantifs hébreux, malgré leur différence lexicale.
- source_word: כְמוֹשׁ
  choice: Kemosh
  rationale: Translittération française courante du nom de la divinité moabite.
- source_word: מִלְכֹּם
  choice: Milkom
  rationale: Le texte massorétique nomme Milkom; la traduction ne le remplace donc pas par Molek.
- source_word: טִמֵּא
  choice: profana
  rationale: Dans ce contexte, le piel de טמא décrit l’action par laquelle le roi rend ces lieux cultuellement impurs et impropres au culte. « Profana » exprime naturellement en français le résultat concret de cet acte.
theological_decisions:
- issue: Qualification polémique des divinités étrangères
  choice: Employer « l’abomination » pour שִׁקֻּץ et תּוֹעֵבָה
  alternative: « l’objet détestable » ou « l’horreur »
  rationale: Le texte porte délibérément un jugement religieux très fort. « Abomination » en maintient la vigueur sans neutraliser ces appellations en simples noms de dieux.
- issue: Identification du הַר הַמַּשְׁחִית
  choice: Traduire « le mont de la Destruction »
  alternative: « le mont de la Corruption » ou « le mont des Oliviers »
  rationale: Le texte emploie une désignation péjorative qu’il convient de conserver. L’identification possible avec le mont des Oliviers est informative, mais ne doit pas remplacer silencieusement le nom hébreu.
- issue: Identification de מִלְכֹּם
  choice: Conserver « Milkom » dans le texte principal
  alternative: « Molek »
  rationale: La forme consonantique du texte massorétique est Milkom. Une association historique ou traditionnelle avec Molek ne justifie pas de les confondre dans la traduction.
translation_notes:
  register: Français international moderne, digne et lisible. La longue phrase hébraïque est conservée en une seule phrase, mais sa syntaxe est allégée par « et que ». Les noms divins suivent des formes françaises usuelles. Le vocabulaire cultuel traditionnel (« hauts lieux », « abomination », « profana ») est maintenu parce qu’il reste intelligible et restitue la force polémique du passage.
