  rationale: La révision se limite à expliciter la portée de la négation dans la dernière coordination, afin de refléter « tous les jours des rois d’Israël et des rois de Juda » sans introduire d’affirmation historique supplémentaire. La note est conservée, avec une ponctuation française normalisée.
