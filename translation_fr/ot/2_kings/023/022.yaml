  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: fr
  text: En effet, aucune Pâque semblable à celle-ci[a] n’avait été célébrée depuis l’époque des juges qui avaient jugé Israël, ni à aucun moment durant toute la période des rois d’Israël et des rois de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme cette Pâque » ; le sens est « une Pâque comme celle-ci » ou « une telle Pâque ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: Introduit l’explication de l’ordre et de la célébration rapportés au verset précédent, avec une valeur explicative naturelle en français.
- source_word: לֹא נַעֲשָׂה
  choice: aucune … n’avait été célébrée
  rationale: Le verbe עשה signifie littéralement « faire », mais, avec la Pâque, « célébrer » exprime naturellement l’observance cultuelle. Le plus-que-parfait convient à la comparaison rétrospective.
- source_word: כַּפֶּסַח הַזֶּה
  choice: aucune Pâque semblable à celle-ci
  rationale: Le préfixe comparatif כְּ indique une Pâque « comme celle-ci », et non nécessairement l’absence totale de célébrations antérieures.
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: depuis l’époque des juges
  rationale: מן avec « jours » marque ici le point de départ temporel; « l’époque » est idiomatique en français sans perdre le sens.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: qui avaient jugé Israël
  rationale: Conserve le lien lexical entre « juges » et « juger », ainsi que l’ambiguïté fonctionnelle du verbe hébreu.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: ni durant toute l’époque des rois d’Israël et des rois de Juda
  rationale: « Ni » prolonge explicitement la négation; la répétition de « rois » maintient la distinction hébraïque entre les deux monarchies.
theological_decisions:
- issue: Portée de la comparaison historique
  choice: Aucune Pâque comparable à celle de Josias n’avait été célébrée durant la période mentionnée.
  alternative: Aucune Pâque n’avait été célébrée du tout durant cette période.
  rationale: La construction comparative כַּפֶּסַח הַזֶּה signifie « comme cette Pâque »; le texte compare donc la célébration de Josias aux précédentes sans nier nécessairement toute observance antérieure.
translation_notes:
  register: Français international moderne, digne et accessible. « Célébrée » est l’expression idiomatique pour la Pâque; « avaient jugé » préserve volontairement la répétition hébraïque et sa nuance historique.
