review_pass:
  verdict: revise
  source_fidelity: Le projet rend fidèlement la comparaison de כַּפֶּסַח הַזֶּה (« une Pâque semblable à celle-ci »), l’observance de la Pâque et la référence aux juges « qui avaient jugé Israël ». La portée négative sur les règnes d’Israël et de Juda doit toutefois être formulée plus explicitement en français.
  naturalness: Le français est globalement naturel et de registre approprié. Cependant, « ni durant toute l’époque » peut se lire comme une négation partielle (« pas pendant toute la période »), plutôt que comme l’absence de toute célébration comparable à n’importe quel moment de cette période.
  terminology: « Pâque », « célébrée », « juges », « Israël » et « Juda » sont appropriés. La note restitue correctement la valeur comparative de l’hébreu sans prétendre que toute célébration pascale antérieure aurait été absente.
  issues:
  - severity: medium
    issue: Ambiguïté de portée dans « ni durant toute l’époque des rois »
    rationale: Sous négation, cette formulation française peut signifier qu’une telle Pâque n’a pas eu lieu pendant l’intégralité de l’époque, tout en laissant entendre qu’elle aurait pu avoir lieu à certains moments. L’hébreu étend la négation à « tous les jours » des rois d’Israël et de Juda. « Ni à aucun moment durant toute la période » rend cette portée sans ambiguïté.
  revised_text: En effet, aucune Pâque semblable à celle-ci[a] n’avait été célébrée depuis l’époque des juges qui avaient jugé Israël, ni à aucun moment durant toute la période des rois d’Israël et des rois de Juda.
