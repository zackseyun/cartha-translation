translation_notes:
  register: Français moderne, digne et accessible. La syntaxe active de l’hébreu est conservée dans « se rassemblèrent ». L’explicitation « des messagers » évite en français un emploi absolu peu naturel de « envoya », tout en signalant dans la note la formulation littérale et l’autre compréhension possible.
