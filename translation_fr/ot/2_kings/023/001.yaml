  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: fr
  text: Alors le roi envoya appeler tous les anciens de Juda et de Jérusalem, et ils se rassemblèrent auprès de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya des messagers
  rationale: Le verbe signifie littéralement « envoya », sans objet exprimé. Dans ce contexte, il s’agit naturellement d’envoyer des messagers pour convoquer les anciens; l’explicitation minimale rend la phrase française intelligible, tandis que la note conserve la forme plus littérale.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini porte le titre employé par le verset; le contexte l’identifie à Josias, mais son nom n’est pas ajouté ici.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: se rassemblèrent auprès de lui
  rationale: La forme hébraïque est active et peut se rendre naturellement en français par un verbe pronominal. « Auprès de lui » exprime le mouvement vers le roi sans introduire l’idée plus interprétative de comparaître « devant » lui.
- source_word: כָּל זִקְנֵי
  choice: tous les anciens
  rationale: כָּל marque la totalité, et זִקְנֵי désigne ici les responsables reconnus de la communauté, selon le terme français biblique et institutionnel courant « anciens ».
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: de Juda et de Jérusalem
  rationale: Les noms propres sont rendus selon l’usage français courant, avec la coordination qui distingue le territoire de Juda et sa capitale.
