source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: fr
  text: 'Le SEIGNEUR déclara : « J’écarterai aussi Juda de ma présence, comme j’ai écarté Israël. Je rejetterai[a] cette ville que j’ai choisie — Jérusalem — ainsi que la maison[b] au sujet de laquelle j’ai dit : “Mon nom sera là.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai rejeté ». La forme verbale hébraïque peut désigner une action accomplie; elle est rendue ici au futur dans la continuité de l’annonce du jugement.'
    reason: alternative_reading
  - marker: b
    text: C’est-à-dire le Temple de Jérusalem. L’hébreu dit littéralement « la maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: La graphie en petites capitales suit l’usage français courant pour représenter le nom divin YHWH, tout en le distinguant du titre ordinaire « Seigneur ».
- source_word: אָסִיר / הֲסִרֹתִי (סור au hiphil)
  choice: j’écarterai / j’ai écarté
  rationale: Le hiphil exprime ici le fait de faire partir ou d’éloigner. « Écarter » garde le parallélisme entre le sort futur de Juda et celui, déjà accompli, d’Israël.
- source_word: מֵעַל פָּנַי
  choice: de ma présence
  rationale: Cette formulation française naturelle rend l’idiome hébreu signifiant littéralement « de devant ma face », sans effacer sa portée relationnelle.
- source_word: גַּם
  choice: aussi
  rationale: Le mot associe explicitement le sort de Juda à celui d’Israël.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Introduit directement la comparaison entre l’éloignement annoncé de Juda et celui d’Israël.
- source_word: וּמָאַסְתִּי
  choice: je rejetterai
  rationale: Dans cette déclaration de jugement, le parfait hébreu peut prolonger l’annonce tournée vers l’avenir. « Rejeter » exprime la répudiation sans ajouter la nuance affective plus forte de « mépriser ».
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Équivalent direct et naturel de l’expression démonstrative hébraïque.
- source_word: אֲשֶׁר בָּחַרְתִּי
  choice: que j’ai choisie
  rationale: Le passé composé renvoie naturellement, en français actuel, au choix antérieur de Jérusalem par Dieu.
- source_word: אֶת יְרוּשָׁלִַם
  choice: — Jérusalem —
  rationale: Les tirets marquent clairement l’apposition qui identifie « cette ville », sans ajouter d’explication au texte.
- source_word: הַבַּיִת
  choice: la maison
  rationale: Le terme signifie littéralement « la maison » et désigne ici le Temple. Le conserver maintient le vocabulaire et les résonances théologiques de l’hébreu; une note précise le référent.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: Mon nom sera là
  rationale: Traduction directe et idiomatique qui préserve le thème biblique de la présence du nom de Dieu dans le sanctuaire choisi.
theological_decisions:
- issue: Valeur temporelle de וּמָאַסְתִּי dans la déclaration prophétique de jugement
  choice: « Je rejetterai », avec une valeur future
  alternative: « J’ai rejeté »
  rationale: Bien que la forme soit un parfait, elle peut présenter comme certain le jugement annoncé et poursuivre la perspective future de « j’écarterai ». Une note conserve la possibilité d’une lecture comme action accomplie.
- issue: Traduction de הַבַּיִת
  choice: « la maison » dans le texte principal
  alternative: « le Temple »
  rationale: L’hébreu emploie « maison », désignation usuelle du Temple. Ce choix conserve la formulation source et ses échos intertextuels, tandis qu’une note donne le référent explicite.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases restent proches de la structure hébraïque, mais « de ma présence » remplace le calque peu naturel « de devant ma face ». Les tirets rendent l’apposition « Jérusalem ». Les marqueurs de notes sont placés exactement sur les éléments qu’ils expliquent.
