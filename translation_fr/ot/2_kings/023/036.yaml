base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: fr
  text: Joïaqim avait vingt-cinq ans lorsqu’il devint roi, et il régna onze ans à Jérusalem. Sa mère s’appelait Zebida, fille de Pedaya, originaire de Rouma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: avait vingt-cinq ans
  rationale: Cette tournure rend naturellement en français l’expression hébraïque idiomatique indiquant l’âge.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction avec ב indique ici le moment de l’accession au trône; cette formulation est naturelle et exacte en français.
- source_word: מָלַךְ
  choice: il régna
  rationale: Le verbe désigne l’exercice de la royauté et correspond directement au verbe français « régner ».
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: En français, la préposition « à » exprime naturellement le lieu où s’exerce le règne.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Rendu idiomatique de la formule hébraïque « le nom de sa mère était », sans perte d’information.
- source_word: זבידה
  choice: Zebida
  rationale: Translittération française moderne du nom propre selon la forme consonantique du texte source.
- source_word: בַת פְּדָיָה
  choice: fille de Pedaya
  rationale: La désignation filiale est rendue directement; « Pedaya » suit une translittération française lisible.
- source_word: מִן רוּמָה
  choice: originaire de Rouma
  rationale: מִן marque ici vraisemblablement l’origine géographique; « originaire de » l’explicite naturellement sans identifier davantage le lieu.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. La formule royale est rendue idiomatiquement, tandis que les noms propres suivent une translittération adaptée au français. Aucune note n’est nécessaire: la variante anglaise « Zebudah » relève d’une tradition de translittération propre à l’anglais et n’éclaire pas utilement le lecteur francophone.'
