revisions:
- from: Il mit fin aux fonctions des prêtres des cultes idolâtres[a] que les rois de Juda avaient établis pour faire brûler de l’encens sur les hauts lieux, dans les villes de Juda et aux alentours de Jérusalem. Il mit aussi fin aux fonctions de ceux qui faisaient brûler de l’encens en l’honneur de Baal, du soleil, de la lune, des constellations[b] et de toute l’armée des cieux[c].
  to: Il supprima les prêtres des cultes idolâtres[a] que les rois de Juda avaient établis pour brûler de l’encens dans les hauts lieux des villes de Juda et des environs de Jérusalem, ainsi que ceux qui brûlaient de l’encens en l’honneur de Baal, du soleil, de la lune, des constellations[b] et de toute l’armée des cieux[c].
  rationale: La révision remplace l’ajout interprétatif « mit fin aux fonctions » par « supprima », qui exprime naturellement la valeur causative de הִשְׁבִּית sans préciser le moyen employé ni réduire l’action à une simple destitution. Elle conserve la qualification lexicale de כְּמָרִים, la liste cultuelle et l’ambiguïté prudente de מַזָּלוֹת. La syntaxe des lieux et de la coordination est également resserrée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:16:28Z'
review_pass:
  verdict: revise
  source_fidelity: La structure, les groupes visés et la liste des destinataires du culte correspondent au texte hébreu. Toutefois, « mit fin aux fonctions » ajoute « fonctions » et restreint le verbe הִשְׁבִּית à une simple cessation d’activité, alors que celui-ci exprime plus largement la suppression ou la mise hors d’usage des personnes ou institutions concernées.
  naturalness: Le français est globalement clair, mais la répétition de « Il mit fin aux fonctions » devant « ceux qui faisaient brûler de l’encens » est lourde et peu naturelle, car ce second groupe n’est pas présenté comme détenteur de fonctions. « Dans les hauts lieux des villes de Juda et des environs de Jérusalem » rend plus directement l’imbrication des compléments locatifs.
  terminology: « Prêtres des cultes idolâtres », « hauts lieux », « Baal », « constellations » et « armée des cieux » sont appropriés. La note sur כְּמָרִים doit éviter d’introduire un nom divin absent du verset; « culte légitime rendu au SEIGNEUR » est plus neutre et conforme aux usages bibliques français.
  issues:
  - severity: medium
    issue: Ajout et restriction de sens dans « mit fin aux fonctions »
    rationale: Le texte hébreu dit que Josias fit cesser/supprima les כְּמָרִים et les autres personnes qui offraient de l’encens; il ne mentionne pas explicitement leurs « fonctions ». La formulation actuelle réduit indûment l’action à une cessation de charge.
  - severity: low
    issue: Reprise verbale lourde pour le second groupe
    rationale: « Il mit aussi fin aux fonctions de ceux » suppose des fonctions qui ne sont pas exprimées dans le texte et alourdit une coordination que le français peut rendre directement.
  - severity: low
    issue: Portée des compléments de lieu moins explicite
    rationale: Les hauts lieux sont situés dans les villes de Juda et les environs de Jérusalem. La formulation révisée rend cette relation plus nettement.
