source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: fr
  text: Il supprima les prêtres des cultes idolâtres[a] que les rois de Juda avaient établis pour brûler de l’encens dans les hauts lieux des villes de Juda et des environs de Jérusalem, ainsi que ceux qui brûlaient de l’encens en l’honneur de Baal, du soleil, de la lune, des constellations[b] et de toute l’armée des cieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu désigne des prêtres associés à des cultes illégitimes ou idolâtres, par opposition aux prêtres du culte légitime rendu au SEIGNEUR. On pourrait aussi traduire : « les prêtres païens ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des signes du zodiaque ». Le terme hébreu désigne probablement des constellations ou des groupements d’astres.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « toute l’armée des cieux ». Dans ce contexte, l’expression désigne l’ensemble des corps célestes auxquels un culte était rendu.'
    reason: clarification
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: Il mit fin aux fonctions de
  rationale: Le hifil de שׁבת signifie ici « faire cesser, supprimer ». Cette formulation naturelle évite de laisser entendre sans certitude que les prêtres furent tués, tout en exprimant la cessation de leur activité cultuelle.
- source_word: הַכְּמָרִים
  choice: les prêtres des cultes idolâtres
  rationale: כְּמָרִים désigne des desservants associés à un culte illégitime ou idolâtre, et non les prêtres légitimes de l’Éternel. La formulation précise cette distinction lexicale sans identifier une religion particulière.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: que les rois de Juda avaient établis
  rationale: Dans cette construction, נתן a le sens d’établir ou de nommer à une fonction. Le plus-que-parfait marque naturellement l’antériorité de cette nomination.
- source_word: וַיְקַטֵּר
  choice: pour faire brûler de l’encens
  rationale: Le verbe קטר désigne ici l’action cultuelle de faire fumer une offrande, couramment celle de l’encens. La tournure finale rend le rapport entre la nomination et la fonction confiée aux prêtres.
- source_word: בַּבָּמוֹת
  choice: sur les hauts lieux
  rationale: « Hauts lieux » est l’équivalent français traditionnel et précis de בָּמוֹת, qui désigne des sanctuaires cultuels locaux, souvent situés sur des hauteurs mais pas nécessairement.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: dans les villes de Juda et aux alentours de Jérusalem
  rationale: מְסִבֵּי désigne les lieux qui entourent Jérusalem. « Aux alentours » est idiomatique et conserve la distinction géographique.
- source_word: וְאֶת הַמְקַטְּרִים
  choice: ceux qui faisaient brûler de l’encens
  rationale: Le participe désigne un autre groupe caractérisé par cette pratique cultuelle. La reprise de « Il mit aussi fin aux fonctions » clarifie en français la coordination avec le premier complément.
- source_word: לַבַּעַל
  choice: en l’honneur de Baal
  rationale: La préposition ל marque ici le destinataire divin du rite. « En l’honneur de » exprime clairement la destination cultuelle en français.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: du soleil, de la lune
  rationale: Les deux astres sont présentés comme objets du culte. La répétition française de « de » maintient la structure énumérative.
- source_word: וְלַמַּזָּלוֹת
  choice: des constellations
  rationale: מַזָּלוֹת renvoie vraisemblablement à des constellations ou groupements astraux, peut-être ceux du zodiaque. « Constellations » évite une précision excessive.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: de toute l’armée des cieux
  rationale: La traduction conserve l’expression hébraïque imagée et son pluriel. Dans ce contexte de culte astral, elle désigne l’ensemble organisé des corps célestes.
theological_decisions:
- issue: Faut-il traduire הַכְּמָרִים simplement par « prêtres » ou signaler leur lien avec un culte illégitime ?
  choice: prêtres des cultes idolâtres
  alternative: prêtres ; prêtres païens
  rationale: Le terme hébreu lui-même distingue ces desservants des prêtres légitimes de l’Éternel, et le contexte nomme explicitement Baal et les astres. « Des cultes idolâtres » transmet cette valeur sans assimiler tous les non-Israélites à une catégorie moderne imprécise.
- issue: L’expression « armée des cieux » désigne-t-elle ici des êtres spirituels ou les corps célestes ?
  choice: Conserver l’expression dans le texte et préciser en note son référent contextuel astral
  alternative: tous les astres du ciel
  rationale: La formulation littérale préserve l’image et l’éventuelle amplitude de l’expression hébraïque, tandis que le contexte immédiat et la note indiquent qu’il s’agit ici des réalités célestes auxquelles un culte était rendu.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve les termes bibliques établis « hauts lieux » et « armée des cieux », avec des notes pour éviter les contresens. La répétition de « Il mit fin aux fonctions » allège l’ambiguïté syntaxique de l’hébreu tout en évitant de préciser sans preuve si ces prêtres furent seulement destitués, expulsés ou mis à mort.
