source:
  edition: WLC
  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: fr
  text: Josias supprima aussi tous les sanctuaires des hauts lieux situés dans les villes de Samarie, que les rois d’Israël avaient établis pour provoquer la colère[a]. Il leur fit tout ce qu’il avait fait à Béthel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement d’après le contexte général : « pour provoquer la colère du Seigneur ».'
    reason: Le Seigneur est l’objet implicite de la provocation, mais il n’est pas nommé dans cette proposition hébraïque.
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: Rend simplement la valeur additive de l’expression et rattache l’action de Josias au récit précédent.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: les sanctuaires des hauts lieux
  rationale: « Sanctuaires » exprime naturellement en français les bâtiments cultuels désignés littéralement comme les « maisons » des hauts lieux, tandis que « hauts lieux » conserve le terme biblique établi.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: dans les villes de Samarie
  rationale: Rendu direct du syntagme hébreu; Samarie désigne ici le territoire de l’ancien royaume du Nord.
- source_word: לְהַכְעִיס
  choice: pour provoquer la colère
  rationale: Conserve l’idée de but ou de résultat ainsi que l’absence d’objet explicite dans l’hébreu, sans ajouter le nom divin dans le corps du texte.
- source_word: הֵסִיר
  choice: supprima
  rationale: Dans le contexte d’une réforme cultuelle, « supprima » indique clairement que Josias fit disparaître ces sanctuaires, sans préciser davantage le procédé.
- source_word: וַיַּעַשׂ לָהֶם
  choice: Il leur fit
  rationale: Préserve la formulation directe de l’hébreu et son lien avec la proposition comparative qui suit.
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשָׂה
  choice: tout ce qu’il avait fait
  rationale: Formulation française naturelle qui rend l’ensemble des actes antérieurs sans la lourdeur de « selon toutes les actions ».
- source_word: בְּבֵית אֵל
  choice: à Béthel
  rationale: La préposition « à » convient naturellement à un nom de lieu et renvoie aux actes accomplis à Béthel dans le contexte précédent.
theological_decisions:
- issue: Objet implicite de la provocation dans לְהַכְעִיס
  choice: 'Laisser l’objet non exprimé dans le texte principal : « pour provoquer la colère ».'
  alternative: « pour provoquer la colère du Seigneur » ou « pour irriter le Seigneur »
  rationale: Le contexte indique que le Seigneur est celui dont la colère est provoquée, mais la proposition hébraïque ne le nomme pas. Le texte principal en préserve donc l’implicite, et la note en explicite le sens contextuel.
translation_notes:
  register: Français moderne, digne et accessible. « Sanctuaires des hauts lieux » privilégie la clarté cultuelle par rapport au calque obscur « maisons des hauts lieux ». La seconde phrase reste proche de la syntaxe hébraïque tout en étant idiomatique.
