  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: fr
  text: Joachaz avait vingt-trois ans lorsqu’il devint roi, et il régna trois mois à Jérusalem. Sa mère s’appelait Hamoutal, fille de Jérémie, qui était de Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: avait vingt-trois ans
  rationale: L’expression hébraïque indiquant l’âge est rendue par l’idiome français naturel.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La construction situe l’âge de Joachaz au moment de son accession au trône; cette formulation est précise et naturelle en français.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: il régna trois mois
  rationale: Le complément de durée hébreu se rend directement et naturellement ainsi en français.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition française « à » est l’usage normal avec un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette tournure française actuelle restitue naturellement la formule hébraïque « le nom de sa mère était ».
- source_word: חֲמוּטַל
  choice: Hamoutal
  rationale: Translittération française usuelle du nom hébreu.
- source_word: בַּת יִרְמְיָהוּ
  choice: fille de Jérémie
  rationale: La relation filiale est exprimée explicitement, avec la forme française traditionnelle du nom.
- source_word: מִלִּבְנָה
  choice: originaire de Libna
  rationale: La préposition מן indique ici l’origine géographique; en hébreu, l’expression se rattache naturellement à Jérémie.
