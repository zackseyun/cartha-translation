base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: fr
  text: Il démolit les locaux des prostitués cultuels[a] qui se trouvaient dans la maison de Yahweh, là où les femmes tissaient des tentures[b] pour l’Ashéra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est masculin pluriel et est apparenté à l’idée de personnes « consacrées ». Dans ce contexte, il est traditionnellement compris comme désignant des hommes associés à des pratiques sexuelles liées au culte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des maisons ». Il s’agit probablement de tentures, d’abris textiles ou d’autres étoffes cultuelles tissées pour l’Ashéra.
    reason: alternative_reading
  - marker: c
    text: « L’Ashéra » peut désigner soit la déesse Ashéra, soit l’objet cultuel qui lui était associé, parfois appelé « poteau sacré d’Ashéra ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: Il démolit
  rationale: Le verbe נתץ exprime la démolition ou le démantèlement d’une construction; « démolit » convient naturellement aux locaux mentionnés.
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: les locaux des prostitués sacrés
  rationale: בָּתֵּי signifie littéralement « maisons de », mais dans l’enceinte du temple il peut désigner des pièces ou quartiers; « locaux » évite de suggérer des maisons indépendantes. Le masculin pluriel הַקְּדֵשִׁים désigne ici des hommes voués à des pratiques sexuelles cultuelles illicites.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Traduction transparente de l’expression hébraïque, avec transcription du nom divin.
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: là où les femmes tissaient
  rationale: Le participe suggère une activité en cours ou habituelle. « Là où » rend שָׁם sans produire une répétition pesante en français.
- source_word: בָּתִּים
  choice: des tentures
  rationale: Le mot signifie littéralement « maisons », mais l’activité de tissage indique vraisemblablement des étoffes cultuelles, peut-être des tentures ou abris textiles. « Tentures » est intelligible tout en laissant l’incertitude en note.
- source_word: לָאֲשֵׁרָה
  choice: pour l’Ashéra
  rationale: La formulation conserve l’ambiguïté entre la divinité Ashéra et l’objet cultuel qui lui est associé.
theological_decisions:
- issue: Rendu de יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription rend explicitement le nom propre divin présent dans le texte hébreu.
- issue: Sens de אֲשֵׁרָה
  choice: l’Ashéra
  alternative: Ashéra; le poteau sacré d’Ashéra
  rationale: L’hébreu peut désigner la déesse ou l’objet cultuel associé; le texte principal ne tranche pas cette ambiguïté.
- issue: Identité des קְדֵשִׁים
  choice: prostitués sacrés
  alternative: hommes voués au culte
  rationale: Dans ce contexte, le terme masculin pluriel renvoie vraisemblablement à des hommes associés à des pratiques sexuelles cultuelles; la note signale la difficulté historique et lexicale sans effacer le sens contextuel.
translation_notes:
  register: Français international moderne, digne et direct. « Locaux » convient mieux que le littéral « maisons » à des espaces situés dans l’enceinte du temple. Les termes cultuels difficiles sont rendus clairement dans le texte et nuancés dans les notes.
