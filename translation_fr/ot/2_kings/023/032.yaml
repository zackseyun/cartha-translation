id: 2KI.23.32
reference: 2 Kings 23:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/032.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, en tout point comme l’avaient fait ses pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses pères »; c’est-à-dire ses ancêtres ou ses prédécesseurs.'
    reason: Le mot hébreu est littéralement « pères », mais sa portée dans cette formule royale peut inclure les ancêtres et les rois antérieurs.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le waw narratif fait progresser le récit. Le passé simple convient au registre narratif biblique en français et rend naturellement עשה.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’expression עשה הרע est une formule idiomatique signifiant « faire ce qui est mal », plutôt que le calque peu naturel « faire le mal » dans ce contexte évaluatif.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette formulation conserve la métaphore hébraïque tout en étant idiomatique en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כְּכֹל אֲשֶׁר
  choice: en tout point comme
  rationale: Cette tournure française exprime à la fois la comparaison introduite par כְּ et la portée globale de כֹּל, sans produire un calque maladroit.
- source_word: עָשׂוּ
  choice: l’avaient fait
  rationale: Le plus-que-parfait marque clairement l’antériorité des actes des pères par rapport à ceux du roi.
- source_word: אֲבֹתָיו
  choice: ses pères
  rationale: Ce choix conserve le terme concret du texte hébreu; dans cette formule royale, il peut désigner les ancêtres ou les prédécesseurs du roi.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme, nom propre du Dieu d’Israël. La translittération préserve ce nom au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif; « en tout point comme » restitue naturellement la portée globale de la comparaison hébraïque.
