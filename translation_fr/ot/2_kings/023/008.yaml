  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: fr
  text: Il fit venir tous les prêtres des villes de Juda et rendit impurs les hauts lieux où les prêtres avaient brûlé de l’encens, depuis Guéba jusqu’à Beer-Shéba. Il démolit aussi les hauts lieux des portes[a], qui se trouvaient à l’entrée de la porte de Josué, le responsable de la ville, à gauche d’un homme, à la porte de la ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « les sanctuaires situés aux portes ». L’hébreu dit littéralement « les hauts lieux des portes ».'
    reason: lexical_alternative
  - marker: b
    text: 'La formulation hébraïque est difficile et dit littéralement : « à la gauche d’un homme, à la porte de la ville ». Elle peut désigner le côté gauche pour une personne qui entrait par la porte, mais le point de vue n’est pas précisé.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Il fit venir
  rationale: Le hiphil de בוא signifie « faire venir » ou « amener ». Ici, « fit venir » exprime naturellement l’action de Josias convoquant les prêtres des localités de Juda.
- source_word: מֵעָרֵי יְהוּדָה
  choice: des villes de Juda
  rationale: עָרִים peut désigner des villes ou des localités. « Villes » est clair, courant et suffisamment large.
- source_word: וַיְטַמֵּא
  choice: rendit impurs
  rationale: Le piel de טמא signifie rendre impur ou profaner. « Rendit impurs » conserve explicitement la notion d’impureté cultuelle sans réduire l’acte à une simple destruction matérielle.
- source_word: הַבָּמוֹת
  choice: les hauts lieux
  rationale: « Hauts lieux » est l’équivalent français traditionnel et précis de בָּמוֹת, désignant des lieux de culte locaux, sans supposer que chacun se trouvait nécessairement sur une hauteur topographique.
- source_word: קִטְּרוּ שָׁמָּה
  choice: avaient brûlé de l’encens
  rationale: קטר désigne ici l’action de faire brûler de l’encens ou une offrande produisant de la fumée. Le plus-que-parfait marque naturellement l’antériorité par rapport à la profanation.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: depuis Guéba jusqu’à Beer-Shéba
  rationale: La construction מן...עד exprime l’étendue géographique du nord au sud. Les formes françaises usuelles des toponymes sont retenues.
- source_word: וְנָתַץ
  choice: Il démolit aussi
  rationale: נתץ signifie abattre ou démolir. « Démolit » convient à des installations cultuelles et « aussi » rend la progression narrative du waw.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: les hauts lieux des portes
  rationale: Cette formulation reste proche de la construction hébraïque condensée. La note signale la traduction plus interprétative « sanctuaires situés aux portes ».
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: à l’entrée de la porte de Josué
  rationale: La traduction conserve la chaîne nominale et la répétition de « porte », présentes dans l’hébreu.
- source_word: שַׂר הָעִיר
  choice: le responsable de la ville
  rationale: שַׂר désigne un dirigeant ou haut fonctionnaire. « Responsable » rend sa fonction civique sans lui attribuer un titre administratif moderne trop précis.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: à gauche de quelqu’un qui entrait par la porte de la ville
  rationale: La phrase hébraïque est elliptique, littéralement « à la gauche d’un homme dans/à la porte de la ville ». La traduction explicite avec prudence le point de vue probable d’une personne entrant, tout en signalant l’incertitude en note.
