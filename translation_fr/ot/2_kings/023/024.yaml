source:
  edition: WLC
  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: fr
  text: De plus, Josias fit disparaître les médiums, les spirites, les dieux domestiques, les idoles et toutes les choses abominables que l’on voyait dans le pays de Juda et à Jérusalem. Il agit ainsi afin de mettre en application les paroles de la Loi écrites dans le livre[a] que le prêtre Hilqiya avait trouvé dans la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le rouleau ». Le mot hébreu désigne un document écrit, qui pouvait se présenter sous la forme d’un rouleau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: De plus
  rationale: Rend la valeur additive de l’expression tout en reliant naturellement ce verset aux réformes précédentes.
- source_word: הָאֹבוֹת
  choice: les nécromanciens
  rationale: Dans cette association de termes, le mot désigne vraisemblablement des personnes qui consultent les morts. « Nécromanciens » est précis et évite de confondre les praticiens avec les esprits eux-mêmes.
- source_word: הַיִּדְּעֹנִים
  choice: les devins
  rationale: Désigne des praticiens occultes associés aux nécromanciens. « Devins » est naturel en français moderne, sans reprendre une formulation archaïque ou trop technique.
- source_word: הַתְּרָפִים
  choice: les dieux domestiques
  rationale: Rend la fonction probable de ces objets cultuels familiaux plutôt que de conserver la translittération opaque « téraphim ».
- source_word: הַגִּלֻּלִים
  choice: les idoles
  rationale: Traduction claire du terme péjoratif désignant les idoles; la nuance fortement méprisante de l’hébreu ne peut être reproduite littéralement sans lourdeur.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: toutes les choses abominables
  rationale: Conserve l’étendue du terme, qui peut englober divers objets et pratiques cultuels jugés détestables, sans le limiter aux seules idoles.
- source_word: נִרְאוּ
  choice: que l’on voyait
  rationale: Préserve l’idée exprimée par la forme passive, tout en donnant une tournure française naturelle.
- source_word: בִּעֵר
  choice: fit disparaître
  rationale: Exprime l’élimination complète des personnes et objets énumérés sans préciser abusivement la méthode employée ni affirmer explicitement que les praticiens furent mis à mort.
- source_word: לְמַעַן הָקִים
  choice: afin de mettre en application
  rationale: 'Exprime le but de Josias: faire valoir concrètement les paroles de la Loi. Cette formulation évite le possible sens prédictif de « accomplir ».'
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: les paroles de la Loi
  rationale: « Loi » convient au contexte de l’instruction d’alliance contenue dans le document découvert; « paroles » demeure proche de l’hébreu.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: écrites dans le livre
  rationale: Formulation idiomatique en français. Le mot hébreu peut désigner un document écrit sous forme de rouleau, possibilité signalée en note.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Conserve l’expression hébraïque « maison de Yahweh » plutôt que de l’expliciter par « temple ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération « Yahweh » représente directement le nom divin et suit la politique indiquée du projet sans le remplacer par un titre.
- issue: Portée de לְמַעַן הָקִים
  choice: afin de mettre en application
  alternative: afin d’accomplir; afin d’établir
  rationale: Le contexte concerne la mise en œuvre des exigences de la Loi. « Mettre en application » conserve cette orientation pratique sans suggérer que les paroles étaient nécessairement une prédiction.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux phrases allège la longue coordination hébraïque sans modifier son enchaînement logique. Le marqueur [a] est placé après « livre », terme auquel la note se rapporte.
