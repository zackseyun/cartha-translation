  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: fr
  text: Quant aux autels qui se trouvaient sur le toit de la chambre haute d’Ahaz[a] et que les rois de Juda avaient construits, ainsi qu’aux autels que Manassé avait construits dans les deux cours de la maison de Yahweh, le roi les démolit, les réduisit en morceaux sur place et jeta leur poussière dans le ravin du Cédron[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la pièce à l’étage d’Ahaz ». Le mot hébreu peut désigner une chambre haute ou une pièce située à l’étage.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le torrent du Cédron ». Le mot hébreu peut désigner un ravin, un lit de torrent ou le cours d’eau qui l’emprunte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: les autels
  rationale: Le nom מִזְבֵּחַ désigne directement un autel; son pluriel est conservé dans les deux occurrences.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: sur le toit de la chambre haute d’Ahaz
  rationale: עֲלִיָּה désigne généralement une pièce ou chambre située à l’étage. Cette formulation conserve le rapport architectural exprimé par l’hébreu.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: dans les deux cours de la maison de Yahweh
  rationale: חָצֵר signifie « cour » ou « cour intérieure », tandis que « maison de Yahweh » reproduit l’expression hébraïque sans la remplacer par le terme interprétatif « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin personnel est transcrit plutôt que remplacé par un titre.
- source_word: נָתַץ
  choice: les démolit
  rationale: Le verbe exprime la destruction ou la démolition d’une construction, ici des autels.
- source_word: וַיָּרָץ מִשָּׁם
  choice: les réduisit en morceaux sur place
  rationale: Dans la suite des actions, la forme est comprise comme exprimant la fragmentation des autels démolis; « sur place » rend naturellement מִשָּׁם dans ce contexte.
- source_word: עֲפָרָם
  choice: leur poussière
  rationale: עָפָר signifie « poussière » ou « terre meuble » et évoque ici les restes pulvérisés des autels.
- source_word: נַחַל קִדְרוֹן
  choice: le ravin du Cédron
  rationale: נַחַל peut désigner un ravin, un lit de torrent ou un oued. « Cédron » est la forme française traditionnelle du nom propre.
- source_word: וְאֶת ... וְאֶת
  choice: Quant aux… ainsi qu’aux…
  rationale: Cette construction française marque les compléments d’objet placés en tête, avant le verbe principal, tout en restant lisible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte explicitement le tétragramme; la transcription « Yahweh » préserve le nom personnel sans lui substituer un titre.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La longue phrase hébraïque est conservée, mais structurée par « Quant aux… ainsi qu’aux… ». Les répétitions significatives (« autels », « construits ») sont maintenues.
