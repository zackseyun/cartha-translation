source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes de Josias et tout ce qu’il a fait ne sont-ils pas écrits[a] dans le Livre des annales des rois de Juda[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consignés ». Le participe passif hébreu signifie littéralement « écrits », mais, dans ce contexte d’archives, il peut aussi avoir le sens de « consignés » dans un registre.
    reason: lexical_alternative
  - marker: b
    text: Le « Livre des annales des rois de Juda » désigne une source royale citée dans le livre des Rois, et pas nécessairement les livres bibliques de 1–2 Chroniques sous leur forme canonique finale.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: le reste des actes
  rationale: Dans cette formule historiographique, יֶתֶר désigne ce qui reste à rapporter et דִּבְרֵי les actes ou les affaires du roi, plutôt que ses seules paroles.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Rendu direct et naturel qui conserve la portée générale du verbe עשה.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: La question négative attend une réponse affirmative. Le pluriel rend explicitement הֵם כְּתוּבִים et renvoie aux actes ainsi qu’à tout ce que Josias a fait.
- source_word: עַל סֵפֶר
  choice: dans le Livre
  rationale: Bien que עַל signifie littéralement « sur », le français dit naturellement qu’un contenu est écrit dans un livre ou un registre.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: le Livre des annales
  rationale: « Annales » exprime naturellement l’idée d’un relevé chronologique officiel et évite de confondre automatiquement cette source avec le livre biblique des Chroniques.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: des rois de Juda
  rationale: Cette formulation française naturelle représente le titre de la source royale désignée par l’hébreu.
theological_decisions:
- issue: Identification du סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Présenter l’ouvrage comme les annales royales citées par le livre des Rois
  alternative: L’identifier directement aux livres canoniques de 1–2 Chroniques
  rationale: Le texte désigne une source documentaire concernant les rois de Juda, sans imposer son identification avec la forme canonique finale des Chroniques.
translation_notes:
  register: Français international moderne, clair et digne. La tournure interrogative conserve la formule rhétorique de l’hébreu. « Annales » est plus idiomatique que « événements des jours » et distingue utilement la source d’archives du titre canonique « Chroniques ».
