source:
  edition: WLC
  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: fr
  text: Le pharaon Néko établit comme roi Éliaquim, fils de Josias, à la place de son père Josias, et il changea son nom en Joïakim. Quant à Joachaz, il l’emmena. Joachaz arriva en Égypte et y mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: établit comme roi
  rationale: 'Le hiphil de מלך a ici un sens causatif : le pharaon installe Éliaquim sur le trône. Cette formulation est naturelle en français et conserve cette valeur.'
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans ce contexte de succession royale, la préposition indique qu’Éliaquim remplace Josias.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: il changea son nom
  rationale: L’expression hébraïque signifie que le pharaon donna un autre nom à Éliaquim; la formulation retenue reste proche de l’image de l’original.
- source_word: יְהוֹיָקִים
  choice: Joïakim
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: Quant à Joachaz, il l’emmena
  rationale: לקח signifie littéralement « prendre ». Dans ce récit, « emmener » exprime naturellement le déplacement imposé sans préciser davantage, comme le ferait « capturer », les modalités de cette prise.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: Joachaz arriva en Égypte
  rationale: Le verbe בוא exprime l’arrivée, littéralement « venir/entrer ». « Arriva » évite une difficulté de point de vue en français tout en conservant le mouvement vers l’Égypte. La répétition du nom clarifie le changement de référent suggéré par le contexte.
- source_word: וַיָּמָת שָׁם
  choice: et y mourut
  rationale: Traduction concise qui conserve la conclusion abrupte du récit.
theological_decisions:
- issue: Référent du sujet dans וַיָּבֹא… וַיָּמָת
  choice: Joachaz arriva en Égypte et y mourut
  alternative: il arriva en Égypte et y mourut
  rationale: La chaîne verbale hébraïque emploie formellement un sujet non exprimé, mais le contexte immédiat présente Joachaz comme l’objet emmené, et c’est sa destinée qui clôt la phrase. Répéter son nom en français rend ce référent naturel sans introduire d’interprétation doctrinale.
translation_notes:
  register: 'Français international moderne, narratif et digne. Les noms propres suivent les formes françaises courantes : Néko, Éliaquim, Josias, Joïakim et Joachaz. La répétition de « Josias » reflète celle de l’hébreu et évite toute ambiguïté sur l’identité du père.'
