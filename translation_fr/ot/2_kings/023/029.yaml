source:
  edition: WLC
  text: בְּ/יָמָ֡י/ו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם עַל מֶ֥לֶךְ אַשּׁ֖וּר עַל נְהַר פְּרָ֑ת וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִ/קְרָאת֔/וֹ וַ/יְמִיתֵ֨/הוּ֙ בִּ/מְגִדּ֔וֹ כִּ/רְאֹת֖/וֹ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: fr
  text: À son époque, le pharaon Néko[a], roi d’Égypte, monta contre le roi d’Assyrie jusqu’au fleuve Euphrate. Le roi Josias alla à sa rencontre[c][b], et il le tua à Meguiddo quand il le vit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Néko; graphie traditionnelle : Néco.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, en explicitant les référents par interprétation : « Le pharaon Néko tua Josias à Meguiddo lorsque celui-ci vint à sa rencontre. » L’hébreu emploie des pronoms ambigus à la troisième personne.'
    reason: alternative_reading
  - marker: c
    text: Voir aussi 2 Chroniques 35.20-24, récit parallèle de la mort de Josias.
    reason: cross_reference
lexical_decisions:
- source_word: בְּיָמָיו
  choice: À son époque
  rationale: Cette expression temporelle désigne la période où Josias régnait. La formulation française est naturelle tout en restant proche de l’idiome hébreu.
- source_word: עָלָה
  choice: monta contre
  rationale: Le verbe signifie littéralement « monter » et peut décrire une avancée militaire. « Monta contre » conserve l’image et la valeur hostile du contexte.
- source_word: פַרְעֹה נְכֹה
  choice: le pharaon Néko
  rationale: « Néko » transcrit le nom hébreu de manière claire pour le lectorat francophone; la graphie traditionnelle est signalée en note.
- source_word: עַל מֶלֶךְ אַשּׁוּר
  choice: contre le roi d’Assyrie
  rationale: Après un verbe de mouvement employé dans un contexte militaire, עַל exprime ici le plus naturellement l’opposition, sans exclure la difficulté posée par le contexte historique.
- source_word: עַל נְהַר פְּרָת
  choice: jusqu’au fleuve Euphrate
  rationale: La préposition indique ici le lieu visé par la montée. « Jusqu’au » exprime clairement la destination en français.
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: L’expression peut désigner une rencontre neutre ou hostile. Cette traduction en préserve l’étendue sémantique sans préciser le motif de Josias.
- source_word: וַיְמִיתֵהוּ
  choice: il le tua
  rationale: Le hiphil de מות signifie « faire mourir, tuer ». La formulation est directe, naturelle et maintient l’ambiguïté des pronoms hébreux.
- source_word: בִּמְגִדּוֹ
  choice: à Meguiddo
  rationale: « À » convient naturellement en français pour situer l’événement sur ce site.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: quand il le vit
  rationale: Les deux pronoms sont au masculin singulier et leurs référents restent formellement ambigus. La traduction reproduit cette ambiguïté.
theological_decisions:
- issue: Ambiguïté des pronoms dans « il le tua » et « quand il le vit »
  choice: Conserver les pronoms « il/le » sans nommer leurs référents dans le texte principal.
  alternative: « Le pharaon Néko tua Josias à Meguiddo lorsque celui-ci vint à sa rencontre. »
  rationale: La formulation hébraïque comprime les référents et permet une ambiguïté grammaticale, tandis que le récit parallèle de 2 Chroniques 35.20-24 éclaire différemment la scène. Le texte principal ne doit ni harmoniser silencieusement les récits ni trancher ce que l’hébreu laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la progression narrative de l’hébreu. « Fleuve Euphrate » suit l’usage biblique français; « Meguiddo » est la graphie française courante. Les marqueurs sont placés immédiatement après les éléments concernés, et l’ambiguïté pronominale est délibérément préservée.
