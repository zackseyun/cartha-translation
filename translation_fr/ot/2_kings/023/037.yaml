id: 2KI.23.37
reference: 2 Kings 23:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, conformément à tout ce qu’avaient fait ses pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses ancêtres » ou « ses prédécesseurs ». L’hébreu dit littéralement « ses pères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le verbe עשה avec waw consécutif fait progresser le récit. En français, le passé simple suffit naturellement à exprimer cette succession sans qu’il soit nécessaire d’ajouter systématiquement « Et ».
- source_word: הָרַע
  choice: ce qui est mal
  rationale: La tournure française « faire ce qui est mal » rend naturellement l’expression hébraïque עשה הרע tout en conservant son jugement moral.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression conserve la métaphore hébraïque et constitue en français une tournure courante indiquant le point de vue selon lequel l’acte est évalué.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre, conformément à la forme personnelle du nom divin dans le texte source.
- source_word: כְּכֹל אֲשֶׁר
  choice: conformément à tout ce que
  rationale: Cette formulation exprime la correspondance complète entre sa conduite et celle de ses prédécesseurs, sans réduire la portée de כֹל.
- source_word: עָשׂוּ
  choice: avaient fait
  rationale: Le plus-que-parfait situe clairement les actes des pères avant ceux du roi évalué dans ce verset.
- source_word: אֲבֹתָיו
  choice: ses pères
  rationale: Ce choix conserve le sens littéral de l’hébreu. Dans ce contexte royal, le mot peut toutefois désigner plus largement les ancêtres ou les prédécesseurs, ce que précise la note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve ici le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de אֲבֹתָיו dans une formule d’évaluation royale
  choice: ses pères
  alternative: ses ancêtres ; ses prédécesseurs
  rationale: La traduction principale garde l’image et la formulation du texte hébreu, tandis que la note signale la portée collective possible sans trancher plus étroitement que la source.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la formule d’évaluation royale et la métaphore « aux yeux de », tout en restant naturelle pour un lectorat général.
