  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: fr
  text: Mais ce ne fut que dans la dix-huitième année du règne du roi Josias que cette Pâque fut célébrée pour Yahvé à Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fut faite » ; ici, au sens de « fut célébrée » ou « fut observée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais c’est seulement
  rationale: Dans le contexte, la locution introduit une restriction en contraste avec le verset précédent; cette formulation rend naturellement cette valeur adversative et exceptive.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: la dix-huitième année du règne du roi Josias
  rationale: Le lamed rattache l’année au règne de Josias. L’ajout explicatif «du règne» exprime clairement l’idiome de datation royale en français.
- source_word: נַעֲשָׂה
  choice: fut célébrée
  rationale: Le sens littéral est «fut faite/accomplie», mais, avec la Pâque comme sujet, le français idiomatique dit qu’elle fut célébrée. Le passif du texte hébreu est conservé.
- source_word: הַפֶּסַח הַזֶּה
  choice: cette Pâque
  rationale: Rendu direct du groupe nominal démonstratif; «Pâque» est le terme français traditionnel et courant pour la fête biblique.
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: Le lamed indique ici l’orientation ou la dédicace de la célébration. «Pour Yahvé» reste proche de la syntaxe source et préserve le nom divin.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: Rendu locatif français naturel du nom de lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; YHWH
  rationale: Le texte porte explicitement le tétragramme. «Yahvé» est une forme française reconnue qui représente le nom propre plutôt que de le remplacer par un titre; la vocalisation exacte ancienne demeure toutefois incertaine.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure de datation royale est explicitée par «du règne»; le terme traditionnel «Pâque» est conservé. Le marqueur [a] figure dans le texte principal.
