source:
  edition: WLC
  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: fr
  text: Il égorgea sur les autels tous les prêtres des hauts lieux qui se trouvaient là[a], et il y brûla des ossements humains. Puis il retourna à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il immola sur les autels tous les prêtres des hauts lieux qui se trouvaient là ». Le verbe hébreu peut évoquer un abattage sacrificiel; ici, dans le contexte de la suppression des cultes illicites, il souligne vraisemblablement la violence de leur mise à mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: il égorgea
  rationale: Le verbe זבח peut désigner l’abattage, notamment sacrificiel. « Égorgea » exprime ici la mise à mort violente tout en laissant percevoir une coloration cultuelle, sans présenter explicitement ces morts comme un sacrifice légitime.
- source_word: כָּל כֹּהֲנֵי הַבָּמוֹת
  choice: tous les prêtres des hauts lieux
  rationale: « Tous » conserve la portée totalisante de כָּל. Dans les livres des Rois, « hauts lieux » est le terme usuel et précis pour les sanctuaires locaux visés par la réforme.
- source_word: אֲשֶׁר שָׁם
  choice: qui se trouvaient là
  rationale: Cette formulation française naturelle conserve la valeur locative de la proposition relative.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: sur les autels
  rationale: Le complément est placé près du verbe afin d’indiquer clairement que les prêtres furent mis à mort sur les autels, conformément au sens direct de עַל.
- source_word: וַיִּשְׂרֹף אֶת עַצְמוֹת אָדָם עֲלֵיהֶם
  choice: et il y brûla des ossements humains
  rationale: « Ossements humains » rend idiomatiquement l’emploi générique de אָדָם. Le pronom adverbial « y » renvoie sans lourdeur aux autels.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: Puis il retourna à Jérusalem
  rationale: « Puis » restitue naturellement la progression narrative du waw consécutif.
theological_decisions:
- issue: La possible nuance sacrificielle de וַיִּזְבַּח appliqué à la mise à mort des prêtres
  choice: « il égorgea » dans le texte
  alternative: « il immola » ou « il sacrifia »
  rationale: « Sacrifia » risquerait de faire comprendre que l’acte constituait une offrande cultuelle légitime, ce que le texte n’affirme pas. « Égorgea » garde la violence de la scène et une possible résonance sacrificielle; la note préserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, sobre et narratif. « Égorgea » assume la dureté explicite du récit; « hauts lieux » conserve le vocabulaire historique et religieux établi. La syntaxe évite de laisser croire que les prêtres se tenaient eux-mêmes sur les autels avant leur mise à mort.
