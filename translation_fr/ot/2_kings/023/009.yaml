  text: אַ֗ךְ לֹ֤א יַֽעֲלוּ֙ כֹּהֲנֵ֣י הַ/בָּמ֔וֹת אֶל מִזְבַּ֥ח יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם כִּ֛י אִם אָכְל֥וּ מַצּ֖וֹת בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: fr
  text: Toutefois, les prêtres des hauts lieux[a] ne montèrent pas à l’autel de Yahweh[b] à Jérusalem, mais ils mangèrent du pain sans levain parmi leurs frères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « les prêtres des sanctuaires locaux ».'
    reason: lexical_alternative
  - marker: b
    text: Le nom divin est YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: c
    text: Littéralement « parmi leurs frères » ; il s’agit probablement de leurs confrères prêtres ou de membres de leur parenté sacerdotale.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: La particule marque ici une restriction ou un contraste par rapport aux mesures de réforme qui précèdent; « Toutefois » exprime naturellement cette nuance adversative.
- source_word: יַעֲלוּ
  choice: ne montaient pas
  rationale: Le verbe עלה signifie « monter ». Cette formulation conserve l’expression liée à Jérusalem et s’accorde avec la valeur habituelle de l’inaccompli dans ce récit au passé.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: les prêtres des hauts lieux
  rationale: Rendu transparent de la construction hébraïque. « Hauts lieux » est le terme français traditionnel et intelligible pour les sanctuaires cultuels locaux désignés par בָּמוֹת.
- source_word: מִזְבַּח יְהוָה
  choice: l’autel de Yahweh
  rationale: Cette formulation préserve le rapport entre l’autel et le nom divin tout en restant naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter le tétragramme présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כִּי אִם
  choice: mais
  rationale: 'Dans cette phrase négative, l’expression introduit la situation contrastée: ces prêtres ne montaient pas à l’autel de Jérusalem, mais partageaient néanmoins le pain sans levain.'
- source_word: אָכְלוּ מַצּוֹת
  choice: ils mangeaient du pain sans levain
  rationale: מַצּוֹת désigne du pain sans levain; le singulier collectif « du pain » est idiomatique en français et convient au contexte alimentaire sacerdotal.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: parmi leurs frères
  rationale: La traduction conserve le sens littéral et le terme masculin de parenté, sans ajouter explicitement « prêtres », que le contexte suggère mais que l’hébreu n’énonce pas.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel, tandis que « le Seigneur » représente la substitution traditionnelle par un titre; une note signale cette tradition.
- issue: Portée du terme אֲחֵיהֶם
  choice: leurs frères
  alternative: leurs confrères prêtres
  rationale: Le groupe visé est vraisemblablement celui de leurs frères ou confrères du milieu sacerdotal, mais l’hébreu dit seulement « leurs frères ». La traduction garde cette légère ambiguïté au lieu de l’expliciter dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu sans être artificielle; l’imparfait décrit la situation durable résultant de la réforme. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
