  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: fr
  text: Il brisa les stèles, abattit les ashéras[a] et remplit leurs emplacements d’ossements humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les poteaux sacrés d’Ashéra ». Le terme hébreu désigne des objets cultuels associés à Ashéra, sans en préciser à lui seul la forme exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: brisa
  rationale: Le verbe exprime ici une destruction matérielle en morceaux. « Brisa » est naturel, énergique et fidèle sans ajouter une intensité absente du texte.
- source_word: הַמַּצֵּבוֹת
  choice: les stèles
  rationale: מַצֵּבָה désigne des pierres dressées à fonction cultuelle. « Stèles » rend clairement l’objet en français moderne, sans ajouter explicitement « sacrées ».
- source_word: וַיִּכְרֹת
  choice: abattit
  rationale: Avec des objets cultuels vraisemblablement en bois, כרת indique qu’on les coupe pour les faire tomber. « Abattit » exprime naturellement cette action.
- source_word: הָאֲשֵׁרִים
  choice: les ashéras
  rationale: La translittération conserve le terme cultuel spécifique et évite de déterminer sans preuve s’il s’agissait de poteaux, d’arbres ou d’autres objets associés à la déesse Ashéra. Une note donne l’interprétation courante.
- source_word: וַיְמַלֵּא
  choice: remplit
  rationale: Le sens premier du verbe est « remplir »; dans ce contexte, les ossements servent vraisemblablement à profaner les lieux, mais cette intention implicite n’est pas ajoutée au texte.
- source_word: מְקוֹמָם
  choice: leur emplacement
  rationale: Le nom hébreu est au singulier avec un suffixe pluriel. « Leur emplacement » en préserve la forme collective et le lien avec les objets détruits.
- source_word: עַצְמוֹת אָדָם
  choice: d’ossements humains
  rationale: אָדָם est ici générique et désigne des êtres humains, non des hommes adultes en particulier. « Ossements humains » est l’expression française naturelle et précise.
theological_decisions:
- issue: Sens générique de אָדָם
  choice: humains dans « ossements humains »
  alternative: d’homme dans « ossements d’homme »
  rationale: Dans cette construction, אָדָם qualifie l’origine des ossements de manière générique. Le rendre par « humains » conserve ce sens sans introduire une distinction de sexe.
- issue: Identification matérielle des אֲשֵׁרִים
  choice: ashéras, avec une note explicative
  alternative: poteaux sacrés d’Ashéra
  rationale: Le terme désigne des objets cultuels associés à Ashéra, mais ne précise pas à lui seul leur forme exacte. La translittération préserve cette ambiguïté historique.
translation_notes:
  register: Français international moderne, sobre et digne. La série de verbes au passé simple convient au récit historique écrit. « Stèles » et « ashéras » gardent la précision cultuelle sans alourdir le verset; la note éclaire le terme moins courant.
