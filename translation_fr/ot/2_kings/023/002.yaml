source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: fr
  text: Alors le roi monta à la maison de Yahweh[a], avec tous les hommes de Juda[b], tous les habitants de Jérusalem, les prêtres, les prophètes et tout le peuple, du plus petit au plus grand[c]. Il leur lut toutes les paroles du livre de l’alliance qui avait été trouvé dans la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « au temple de Yahweh ». Littéralement : « à la maison de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous les hommes de Juda ». Cette expression masculine peut représenter collectivement la population.'
    reason: source_language_clarification
  - marker: c
    text: Ou « du moins important au plus important ». L’expression désigne l’ensemble du peuple, sans distinction de rang.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה exprime une montée. « Monta » conserve cette orientation vers le sanctuaire tout en restant naturel en français.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Traduction formellement proche de l’hébreu « maison de YHWH ». « Temple de Yahweh » est un équivalent contextuel possible, signalé en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le tétragramme, nom divin personnel, qui est donc transcrit plutôt que remplacé par un titre.
- source_word: כָל אִישׁ יְהוּדָה
  choice: tous les hommes de Juda
  rationale: אִישׁ est masculin et fonctionne ici collectivement. La formulation française en conserve le caractère masculin et représentatif sans le neutraliser.
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: tous les habitants de Jérusalem
  rationale: Le participe substantivé désigne ceux qui habitent Jérusalem ; « habitants » est précis et idiomatique.
- source_word: אִתּוֹ
  choice: l’accompagnèrent
  rationale: Cette reformulation naturelle exprime clairement que les groupes mentionnés montèrent avec le roi.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent français courant et exact dans ce contexte cultuel.
- source_word: הַנְּבִיאִים
  choice: les prophètes
  rationale: Équivalent français standard du terme hébreu.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: Rend naturellement le collectif hébreu accompagné de כָל.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: du plus petit au plus grand
  rationale: Cette expression conserve l’image hébraïque et désigne l’ensemble du peuple, sans la réduire à une distinction d’âge.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: Il leur lut
  rationale: Le contexte d’un livre impose ici le sens « lire ». Le pronom indirect rend naturellement l’idée hébraïque littérale « à leurs oreilles », c’est-à-dire de manière audible pour eux.
- source_word: סֵפֶר הַבְּרִית
  choice: le livre de l’alliance
  rationale: Traduction directe qui préserve la désignation théologiquement importante du document.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin personnel. « Yahweh » le représente directement sans le remplacer par le titre « Seigneur ».
- issue: Portée du collectif masculin כָל אִישׁ יְהוּדָה
  choice: tous les hommes de Juda
  alternative: tout le peuple de Juda
  rationale: La traduction conserve le substantif masculin du texte tout en reconnaissant en note que l’expression peut avoir une fonction représentative.
- issue: Étendue de לְמִקָּטֹן וְעַד גָּדוֹל
  choice: du plus petit au plus grand
  alternative: du moins important au plus important
  rationale: La traduction préserve l’expression imagée et son amplitude sociale sans déterminer plus précisément un classement que l’hébreu laisse général.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée afin d’éviter une longue accumulation maladroite, tout en conservant tous les groupes du texte hébreu. « Maison de Yahweh » maintient l’image source ; « l’accompagnèrent » et « il leur lut » rendent naturellement les idiomes hébreux.
