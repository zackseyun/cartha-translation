  text: וַ/יַּאַסְרֵ/הוּ֩ פַרְעֹ֨ה נְכֹ֤ה בְ/רִבְלָה֙ בְּ/אֶ֣רֶץ חֲמָ֔ת ב/מלך בִּ/ירוּשָׁלִָ֑ם וַ/יִּתֶּן עֹ֨נֶשׁ֙ עַל הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: fr
  text: Le pharaon Néco le retint prisonnier à Ribla, au pays de Hamath[a], alors qu’il régnait à Jérusalem[b]. Puis il imposa au pays un tribut[c] de cent talents d’argent et d’un talent d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le territoire de Hamath ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est difficile. Elle peut être comprise « alors qu’il régnait à Jérusalem » ou, dans le contexte, « pour l’empêcher de régner à Jérusalem ».
    reason: alternative_reading
  - marker: c
    text: Ou « une amende » ou « une pénalité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: le retint prisonnier
  rationale: Le verbe אסר signifie lier, détenir ou emprisonner. « Le retint prisonnier » exprime naturellement ici la détention coercitive sans limiter le sens à l’action matérielle de lier.
- source_word: פַרְעֹה נְכֹה
  choice: le pharaon Néco
  rationale: « Néco » est la forme française courante du nom du pharaon; le titre est conservé.
- source_word: בְרִבְלָה
  choice: à Ribla
  rationale: La préposition française « à » convient naturellement à la localisation dans cette ville.
- source_word: בְּאֶרֶץ חֲמָת
  choice: dans le territoire de Hamath
  rationale: אֶרֶץ désigne ici la région relevant de Hamath. « Territoire » est clair en français moderne et évite de suggérer nécessairement un État au sens moderne.
- source_word: במלך בִּירוּשָׁלָם
  choice: pour l’empêcher de régner à Jérusalem
  rationale: Dans le contexte, l’expression est comprise comme indiquant que la détention empêche Yoahaz d’exercer la royauté à Jérusalem. La formulation hébraïque étant difficile et susceptible d’une autre analyse, cette ambiguïté est signalée en note.
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: il imposa … un tribut
  rationale: עֹנֶשׁ peut désigner une peine, une amende ou un paiement imposé. Les quantités de métaux précieux exigées du pays donnent ici au terme la valeur politique et économique d’un tribut.
- source_word: עַל הָאָרֶץ
  choice: au pays
  rationale: הָאָרֶץ renvoie ici au pays de Juda, collectivement soumis au prélèvement. « Imposer au pays » est idiomatique en français.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: cent talents d’argent
  rationale: Le talent est une ancienne unité de poids; conserver ce terme traditionnel évite une conversion moderne incertaine.
- source_word: וְכִכַּר זָהָב
  choice: un talent d’or
  rationale: Le singulier hébreu et l’ancienne unité de poids sont conservés.
theological_decisions:
- issue: Valeur de l’expression במלך בירושלם
  choice: 'Finalité ou résultat : la détention l’empêche de régner à Jérusalem.'
  alternative: 'Lecture temporelle possible : « alors qu’il régnait à Jérusalem »; ou formulation plus littérale : « de régner à Jérusalem ».'
  rationale: Le contexte narratif favorise l’idée d’une destitution empêchant la poursuite du règne, mais la forme hébraïque transmise est difficile. La note maintient cette tension au lieu de présenter l’interprétation contextuelle comme certaine.
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms propres suivent les formes françaises usuelles. Les unités anciennes sont conservées. Le rendu privilégie une syntaxe fluide tout en signalant en note les principales ambiguïtés lexicales et grammaticales.
