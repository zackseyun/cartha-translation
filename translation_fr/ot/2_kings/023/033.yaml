revisions:
- from: Le pharaon Néco le retint prisonnier à Ribla, dans le territoire de Hamath[a], pour l’empêcher de régner à Jérusalem[b]. Puis il imposa au pays un tribut[c] de cent talents d’argent et d’un talent d’or.
  to: Le pharaon Néco le retint prisonnier à Ribla, au pays de Hamath[a], alors qu’il régnait à Jérusalem[b]. Puis il imposa au pays un tribut[c] de cent talents d’argent et d’un talent d’or.
  rationale: La révision évite d’imposer dans le texte une lecture finalisée de la construction hébraïque contestée. La lecture circonstancielle est retenue dans le texte, tandis que l’interprétation contextuelle d’un empêchement de régner est conservée en note. Les autres retouches sont stylistiques et n’affectent pas le sens.
  reviewer_model: gpt-5.6-terra
