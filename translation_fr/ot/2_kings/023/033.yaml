    text: Ou « dans le territoire de Hamath ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est difficile. Elle peut être comprise « alors qu’il régnait à Jérusalem » ou, dans le contexte, « pour l’empêcher de régner à Jérusalem ».
    reason: alternative_reading
  - marker: c
    text: Ou « une amende » ou « une pénalité ».
    reason: lexical_alternative
  revision_rationale: La révision évite d’imposer dans le texte une lecture finalisée de la construction hébraïque contestée. La lecture circonstancielle est retenue dans le texte, tandis que l’interprétation contextuelle d’un empêchement de régner est conservée en note. Les autres retouches sont stylistiques et n’affectent pas le sens.
