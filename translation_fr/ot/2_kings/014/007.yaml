  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: fr
  text: Il battit dix mille Édomites dans la vallée du Sel, s’empara de Séla[a] au combat et lui donna le nom de Yoqtéel, qu’elle porte jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Séla peut aussi être compris selon son sens courant : « le rocher » ou « l’escarpement ». Ici, il s’agit probablement du nom du lieu Séla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: battit
  rationale: Dans ce contexte militaire, le verbe désigne une action victorieuse et meurtrière. « Battit » conserve la portée militaire sans imposer que le verbe signifie à lui seul « tua ».
- source_word: אֶת אֱדוֹם ... עֲשֶׂרֶת אֲלָפִים
  choice: dix mille Édomites
  rationale: L’hébreu dit littéralement « Édom, dix mille » ; en français naturel, le nombre désigne les combattants ou habitants d’Édom impliqués.
- source_word: בְּגֵיא הַמֶּלַח
  choice: dans la vallée du Sel
  rationale: Rendu géographique direct et idiomatique du groupe construit hébreu.
- source_word: וְתָפַשׂ
  choice: s’empara de
  rationale: Le verbe exprime ici la prise militaire d’un lieu.
- source_word: הַסֶּלַע
  choice: Séla
  rationale: Le contexte favorise le nom du lieu connu sous le nom de Séla, tout en laissant en note le sens lexical possible.
- source_word: בַּמִּלְחָמָה
  choice: au combat
  rationale: Expression française concise qui rend la circonstance militaire de la prise.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: lui donna le nom de
  rationale: Cette formulation française naturelle rend fidèlement la formule hébraïque de dénomination.
- source_word: יָקְתְאֵל
  choice: Yoqteel
  rationale: Translittération française visant à représenter les consonnes du nom hébreu יָקְתְאֵל.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: qu’elle porte encore aujourd’hui
  rationale: Rend naturellement l’idée que ce nom subsistait jusqu’à l’époque du narrateur, en explicitant le lien syntaxique avec la dénomination.
