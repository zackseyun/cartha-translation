  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes d’Amatsia n’est-il pas écrit dans le livre des Chroniques[a] des rois de Juda ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Annales ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes de
  rationale: יֶתֶר désigne « le reste » et דִּבְרֵי, dans cette formule historiographique, les actes ou affaires du roi plutôt que ses seules paroles. Le français naturel n’exige pas de connecteur initial explicite.
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Translittération française usuelle du nom royal hébreu.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: cela n’est-il pas écrit
  rationale: La question rhétorique attend une réponse affirmative. Le singulier collectif « cela » reprend naturellement en français « le reste des actes », tandis que « écrit » conserve la valeur du participe passif hébreu.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Dans cette formule archivistique, « dans le livre » est l’équivalent idiomatique français de l’hébreu, plutôt que le littéral « sur le livre ».
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: des Chroniques des rois de Juda
  rationale: « Chroniques » rend la désignation conventionnelle d’un registre annalistique royal; le לְ marque ici le rattachement de ce document aux rois de Juda.
