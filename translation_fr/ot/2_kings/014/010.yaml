base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: fr
  text: Tu as bel et bien frappé Édom, et ton cœur t’a élevé[a]. Fais-en ta gloire[b] et reste chez toi. Pourquoi t’exposerais-tu au malheur et tomberais-tu, toi et Juda avec toi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ton cœur s’est enorgueilli ». Littéralement : « ton cœur t’a élevé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « reçois-en l’honneur », « glorifie-toi ». Le sens est probablement : contente-toi de l’honneur que te vaut cette victoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: Tu as bel et bien frappé
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Bel et bien » rend cette insistance, tandis que « frappé » reste proche de נכה sans préciser davantage l’issue militaire.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: ton cœur t’a élevé
  rationale: Cette formulation conserve l’image hébraïque, où « ton cœur » est sujet, tout en laissant entendre l’orgueil ou l’exaltation de soi sans les expliciter dans le corps du texte.
- source_word: הִכָּבֵד
  choice: Fais-en ta gloire
  rationale: L’impératif nifal de כבד invite vraisemblablement le roi à se satisfaire de l’honneur tiré de sa victoire. Cette traduction est naturelle en français et préserve la possibilité contextuelle d’une invitation à jouir de cet honneur plutôt qu’à rechercher un nouveau conflit.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: et reste chez toi
  rationale: L’expression exhorte le roi à demeurer dans son domaine au lieu d’aller au-devant d’un autre affrontement. « Reste chez toi » est idiomatique et direct.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: provoquerais-tu le malheur
  rationale: Le hitpael de גרה évoque le fait de susciter ou de chercher un affrontement, et רעה désigne ici une calamité plutôt qu’un mal moral. « Provoquer le malheur » garde la force de l’avertissement.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: au risque de tomber, toi et Juda avec toi
  rationale: La tournure française exprime la conséquence redoutée sans la présenter comme l’intention du roi. Elle maintient l’accent hébraïque sur la chute conjointe du roi et de Juda.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement convient à l’adresse d’un roi à un autre. L’image du cœur qui élève est conservée dans le texte, et les deux expressions difficiles sont éclairées sans effacer leur ambiguïté.
