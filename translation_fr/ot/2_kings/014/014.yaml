  - severity: medium
    issue: La variante « les fils des garants » dans la note est imprécise.
    rationale: Elle peut signifier les descendants de personnes garantes, alors que l’expression hébraïque renvoie littéralement à des « fils » associés à des gages/cautions, expression dont le sens contextuel est probablement « otages ».
