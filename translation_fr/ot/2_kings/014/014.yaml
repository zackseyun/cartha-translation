base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: fr
  text: Il prit tout l’or et tout l’argent, tous les objets qui se trouvaient dans la maison de Yahweh et dans les salles du trésor du palais royal, ainsi que les otages[a], puis il retourna à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils des gages » ou « les fils des cautions »; l’expression désigne probablement des personnes retenues comme garantie, c’est-à-dire des otages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Il prit
  rationale: Le verbe poursuit la séquence narrative et se rend naturellement au passé simple en français soutenu mais courant.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: tout l’or et tout l’argent
  rationale: La répétition de « tout » exprime clairement l’ampleur totale de la saisie et convient à l’énumération française.
- source_word: כָּל הַכֵּלִים
  choice: tous les objets
  rationale: כֵּלִים est un terme large désignant des objets, ustensiles ou récipients; « objets » évite de restreindre indûment le sens.
- source_word: הַנִּמְצְאִים
  choice: qui se trouvaient
  rationale: Cette tournure attributive rend naturellement le participe hébreu et indique que les objets étaient présents dans les lieux mentionnés.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’expression hébraïque « maison » et représente explicitement le nom divin יהוה.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: et dans les trésors du palais royal
  rationale: « Palais royal » exprime naturellement en français le sens contextuel de « maison du roi », tandis que « trésors » désigne ici les réserves de biens précieux.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: les otages
  rationale: L’expression difficile, littéralement liée à des personnes servant de garantie, désigne très probablement des otages; la note conserve l’ambiguïté lexicale.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: puis il retourna à Samarie
  rationale: שׁוב exprime le retour, et la terminaison directionnelle indique le mouvement vers Samarie; « puis » marque naturellement la suite du récit.
