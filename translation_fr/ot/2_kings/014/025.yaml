language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: fr
  text: Il rétablit la frontière d’Israël depuis Lebo-Hamath[a] jusqu’à la mer de l’Araba[b], conformément à la parole de Yahweh, le Dieu d’Israël, qu’il avait prononcée par l’intermédiaire de son serviteur Jonas, fils d’Amittaï, le prophète originaire de Gath-Hépher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « depuis l’entrée de Hamath ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement de la mer Morte.
    reason: geographical_identification
lexical_decisions:
- source_word: הֵשִׁיב
  choice: rétablit
  rationale: Le hifil de שוב désigne ici le rétablissement de la frontière territoriale d’Israël; « rétablit » exprime naturellement cette restauration politique et géographique.
- source_word: גְּבוּל
  choice: frontière
  rationale: Le nom désigne ici la limite du territoire d’Israël. « Frontière » est précis et idiomatique en français moderne.
- source_word: מִלְּבוֹא חֲמָת
  choice: depuis Lebo-Hamath
  rationale: L’expression fonctionne comme une désignation géographique consacrée. La translittération préserve le toponyme, tandis que le sens plus littéral figure en note.
- source_word: יָם הָעֲרָבָה
  choice: la mer de l’Araba
  rationale: Cette traduction reproduit l’expression géographique hébraïque sans l’identifier directement à la mer Morte; cette identification probable est signalée en note.
- source_word: כִּדְבַר
  choice: conformément à la parole de
  rationale: La formule indique que l’événement accomplit une déclaration divine antérieure. « Conformément à » rend clairement ce rapport.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: L’idiome hébreu marque l’agent par lequel la parole a été communiquée. Cette formulation est naturelle en français tout en conservant le sens instrumental.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Dans le contexte de la mission prophétique, « serviteur » exprime adéquatement l’appartenance et le service envers Dieu.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Le titre identifie directement la fonction de Jonas.
- source_word: מִגַּת הַחֵפֶר
  choice: originaire de Gath-Hépher
  rationale: La préposition מן indique l’origine; « originaire de » rend ce rapport avec naturel en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte conserve le nom divin sous une forme translittérée, sans le remplacer par un titre ni adopter une vocalisation traditionnelle différente.
- issue: Identification de יָם הָעֲרָבָה
  choice: la mer de l’Araba
  alternative: la mer Morte
  rationale: Le corps du texte préserve l’expression hébraïque et ne transforme pas une identification géographique probable en équivalence explicite; la note donne cette identification.
- issue: Agent de la révélation prophétique dans בְּיַד עַבְדּוֹ
  choice: par l’intermédiaire de son serviteur
  alternative: par la main de son serviteur
  rationale: Le sens d’agence est conservé sans imposer en français un calque susceptible de paraître artificiel; Jonas demeure présenté comme le médiateur humain de la parole divine.
translation_notes:
  register: Français international moderne, digne et accessible. Les toponymes sont francisés selon l’usage biblique courant (Araba, Amittaï, Gath-Hépher). Les marqueurs de notes ont été placés auprès des expressions auxquelles leurs notes se rapportent.
