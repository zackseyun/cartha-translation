  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: fr
  text: 'Cependant, les hauts lieux[a] ne furent pas supprimés : le peuple continuait à y offrir des sacrifices et à y brûler de l’encens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctuaires locaux ». Le terme hébreu désigne des lieux de culte, souvent aménagés sur une hauteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Cependant
  rationale: La particule introduit ici une réserve à l’évaluation positive précédente. « Cependant » exprime naturellement cette valeur adversative en français.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: les hauts lieux / y
  rationale: Le terme désigne des lieux de culte locaux, souvent situés sur une hauteur. « Hauts lieux » est la désignation française traditionnelle et demeure compréhensible; le pronom « y » évite une répétition lourde dans la seconde proposition.
- source_word: לֹא סָרוּ
  choice: ne furent pas supprimés
  rationale: Avec les hauts lieux pour sujet, l’expression indique qu’ils ne furent pas écartés ou abolis. Cette tournure rend clairement le sens contextuel en français.
- source_word: עוֹד
  choice: continuait à
  rationale: L’adverbe marque la persistance d’une pratique. Associé aux participes suivants, « continuait à » exprime bien cette action habituelle qui se prolonge.
- source_word: הָעָם
  choice: le peuple
  rationale: Traduction directe du nom collectif désignant l’ensemble de la population.
- source_word: מְזַבְּחִים
  choice: offrir des sacrifices
  rationale: Le participe décrit une pratique cultuelle continue. Cette formulation est naturelle et précise en français.
- source_word: וּמְקַטְּרִים
  choice: brûler de l’encens
  rationale: Dans ce contexte cultuel, le verbe désigne vraisemblablement l’action de faire fumer de l’encens, tout en pouvant plus largement évoquer ce qu’on fait monter en fumée.
theological_decisions:
- issue: Évaluation du culte pratiqué dans les hauts lieux
  choice: Conserver le terme descriptif « hauts lieux » sans ajouter dans le texte qu’ils étaient illégitimes.
  alternative: sanctuaires locaux non autorisés
  rationale: Le contexte littéraire porte une appréciation défavorable sur leur maintien, mais ce verset se limite à rapporter qu’ils ne furent pas supprimés et que le peuple y poursuivait ses pratiques cultuelles.
translation_notes:
  register: Français international moderne, digne et accessible. La structure adversative et l’aspect continu des participes hébreux sont préservés sans alourdir la phrase.
