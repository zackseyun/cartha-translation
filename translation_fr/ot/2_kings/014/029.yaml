  text: וַ/יִּשְׁכַּ֤ב יָֽרָבְעָם֙ עִם אֲבֹתָ֔י/ו עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ זְכַרְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: fr
  text: Jéroboam s’endormit avec ses ancêtres[a], avec les rois d’Israël[b], et son fils Zacharie régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se coucha avec ses ancêtres » ; l’expression hébraïque est une formule traditionnelle annonçant la mort d’un roi.
    reason: lexical_alternative
  - marker: b
    text: Ou « parmi les rois d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Conserve l’image de la formule royale hébraïque de décès, tout en étant idiomatique dans l’expression française « se coucher avec ses ancêtres ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: « Ancêtres » exprime naturellement en français moderne le sens collectif de אָבוֹת dans cette formule, sans suggérer uniquement les pères immédiats.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: avec les rois d’Israël
  rationale: Reproduit la répétition de עִם et préserve l’ambiguïté entre association dynastique et lieu de sépulture.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Rendu concis et traditionnel du verbe מלך dans une notice de succession royale.
- source_word: זְכַרְיָה
  choice: Zacharie
  rationale: Forme française usuelle du nom biblique.
- source_word: בְנוֹ
  choice: son fils
  rationale: Rendu direct de la désignation filiale.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Exprime directement la succession au trône sans ajouter une nuance temporelle absente de l’hébreu.
