id: 2KI.14.24
reference: 2 Kings 14:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh. Il ne se détourna d’aucun des péchés de Jéroboam fils de Nebath[a], qui avait fait pécher Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « par lesquels il avait fait pécher Israël ». La proposition relative hébraïque peut se rapporter directement à Jéroboam ou évoquer les péchés par lesquels il avait entraîné Israël à pécher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Rend naturellement l’expression hébraïque « faire le mal », tout en conservant l’évaluation morale du texte.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Conserve l’image hébraïque transparente de l’évaluation divine et rend le tétragramme par le nom propre « Yahweh ».
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Il ne se détourna d’aucun des péchés
  rationale: 'Dans une proposition négative, « d’aucun » exprime avec naturel la portée exhaustive de מִכָּל : il n’abandonna aucun de ces péchés.'
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam fils de Nebath
  rationale: Forme française usuelle des noms propres et rendu direct de la relation filiale.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: qui avait fait pécher Israël
  rationale: Le hifil de חטא est causatif. Le plus naturellement, la relative caractérise Jéroboam comme celui qui avait entraîné Israël dans le péché.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un simple titre.
- issue: Référent de la relative אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'La relative renvoie directement à Jéroboam : « qui avait fait pécher Israël »'
  alternative: 'La relative renvoie instrumentalement aux péchés : « par lesquels il avait fait pécher Israël »'
  rationale: Le verbe causatif au singulier présente naturellement Jéroboam comme sujet. Toutefois, אֲשֶׁר est indéclinable et la proximité de « péchés » permet une lecture instrumentale; celle-ci est donc signalée en note sans effacer l’ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit historique; « avait fait pécher » marque l’antériorité de l’action de Jéroboam. La formulation évite un langage confessionnel propre à une tradition particulière.
