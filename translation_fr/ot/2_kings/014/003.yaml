source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: fr
  text: Il fit ce qui est droit aux yeux de Yahweh, mais pas comme David, son père[a][b] ; il fit tout ce que Joas, son père, avait fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « père » désigne David comme ancêtre dynastique, et non comme père immédiat.
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « seulement, il ne fit pas comme David, son père ». Le mot hébreu rendu par « mais » introduit une restriction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Il fit ce qui est droit
  rationale: Rend naturellement l’expression royale d’évaluation tout en conservant l’action exprimée par עשה et l’adjectif substantivé הַיָּשָׁר.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Conserve l’image hébraïque de l’évaluation divine et transcrit le nom divin יהוה conformément à l’usage du projet.
- source_word: רַק לֹא
  choice: mais pas
  rationale: רַק introduit ici une restriction à l’appréciation positive. « Mais pas » exprime clairement cette réserve sans annuler la première proposition.
- source_word: כְּדָוִד אָבִיו
  choice: comme David, son père
  rationale: Préserve la comparaison et le terme relationnel אָב, employé ici au sens dynastique d’ancêtre.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: il agit en tout comme … l’avait fait
  rationale: Exprime l’étendue de la conformité indiquée par כְּכֹל et emploie le plus-que-parfait pour situer naturellement en français la conduite antérieure de Joas.
- source_word: יוֹאָשׁ אָבִיו
  choice: Joas, son père
  rationale: « Joas » est la forme française traditionnelle et courante de יוֹאָשׁ ; ici, « père » désigne le père immédiat d’Amasias.
theological_decisions:
- issue: Évaluation du roi à la fois favorable et limitée
  choice: Maintenir l’affirmation qu’Amasias fit ce qui est droit, puis la restreindre en le distinguant de David et en le rapprochant de Joas.
  alternative: Atténuer soit l’éloge initial, soit la réserve introduite par רַק.
  rationale: La syntaxe hébraïque présente une appréciation véritablement positive, aussitôt nuancée. La traduction conserve cette tension sans transformer le verset en approbation totale ni en condamnation implicite.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « aux yeux de » conserve l’idiome hébreu tout en restant immédiatement compréhensible. La répétition de « son père » est maintenue afin de refléter le contraste entre David, ancêtre dynastique, et Joas, père immédiat.
