base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: fr
  text: 'Alors Amasias envoya des messagers à Joas, fils de Joachaz, fils de Jéhu, roi d’Israël, pour lui dire : « Viens, rencontrons-nous face à face[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « voyons-nous en face ». Dans ce contexte, cette expression constitue un défi à une confrontation militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque naturellement en français la progression du récit.
- source_word: שָׁלַח ... מַלְאָכִים
  choice: envoya des messagers
  rationale: Il s’agit d’agents humains chargés de transmettre un message royal.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: Joas, fils de Joachaz, fils de Jéhu
  rationale: Les formes françaises traditionnelles et largement reconnaissables des noms sont employées, et la chaîne généalogique de l’hébreu est conservée.
- source_word: לֵאמֹר
  choice: pour lui dire
  rationale: Formulation française naturelle pour introduire le discours direct tout en rendant la fonction du quotatif hébreu.
- source_word: לְכָה
  choice: Viens
  rationale: L’impératif constitue ici une invitation provocatrice ou un défi adressé directement au roi.
- source_word: נִתְרָאֶה פָנִים
  choice: rencontrons-nous face à face
  rationale: Cette formulation conserve l’image des « faces » tout en exprimant naturellement une rencontre directe; le contexte indique qu’il s’agit d’un défi militaire.
