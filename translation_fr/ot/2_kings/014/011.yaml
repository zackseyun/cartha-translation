  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ וַ/יַּ֨עַל יְהוֹאָ֤שׁ מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יִּתְרָא֣וּ פָנִ֔ים ה֖וּא וַ/אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה בְּ/בֵ֥ית שֶׁ֖מֶשׁ אֲשֶׁ֥ר לִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: fr
  text: Mais Amatsia ne voulut pas écouter[a]. Alors Joas, roi d’Israël, monta, et Joas et Amatsia, roi de Juda, se rencontrèrent face à face[b] à Beth-Shémesh, qui appartient à Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne tint pas compte de l’avertissement ». Le verbe hébreu peut désigner une écoute suivie d’une réaction, et pas seulement le fait d’entendre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ils se virent face à face » : expression désignant ici une rencontre directe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: ne voulut pas écouter
  rationale: Dans ce contexte, le verbe désigne une écoute qui conduit à tenir compte de l’avertissement. La tournure exprime le refus d’Amatsia sans aller jusqu’à « obéir », trop fort puisqu’il ne s’agit pas de l’ordre d’un supérieur.
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie normalement « monter ». Le contexte permet de comprendre un déplacement militaire, mais il n’est pas nécessaire de l’expliciter dans le texte.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: se trouvèrent face à face
  rationale: Cette formulation française naturelle conserve l’image hébraïque des visages et évoque une rencontre directe, ici dans un contexte d’affrontement.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Beth-Shémesh
  rationale: Le nom du lieu est translittéré selon une forme française courante plutôt que traduit littéralement par « maison du soleil ».
- source_word: אֲשֶׁר לִיהוּדָה
  choice: qui appartient à Juda
  rationale: La construction indique l’appartenance territoriale de la ville à Juda, et pas seulement sa situation géographique.
- source_word: וְלֹא
  choice: Mais
  rationale: La conjonction marque ici le contraste entre l’avertissement précédent et le refus d’Amatsia.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres suivent des formes françaises bibliques usuelles. La syntaxe « lui et Amatsia » maintient explicitement les deux sujets de l’hébreu, tandis que « se trouvèrent face à face » préserve l’image sans rendre la phrase artificielle.
