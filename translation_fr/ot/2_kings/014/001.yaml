lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: La deuxième année du règne de
  rationale: Dans cette formule de datation royale, le cardinal hébreu « deux » a une valeur ordinale. L’ajout de « du règne » explicite naturellement en français l’année royale qui sert de repère chronologique.
- source_word: לְ/יוֹאָשׁ
  choice: de Joas
  rationale: Dans une formule royale, la préposition ל indique le roi dont on compte les années de règne.
- source_word: בֶּן יוֹאָחָז
  choice: fils de Joachaz
  rationale: Traduction directe du patronyme, avec la forme française traditionnelle et intelligible du nom propre.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Le groupe construit désigne le titre royal et le royaume gouverné.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans ce contexte chronologique, le verbe signale l’accession au trône plutôt que la simple durée du règne.
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Forme française usuelle du nom hébreu.
- source_word: בֶן יוֹאָשׁ
  choice: fils de Joas
  rationale: Traduction directe du patronyme qui identifie Amatsia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: 'Le titre est intégré à la proposition verbale : « devint roi de Juda », formulation idiomatique en français.'
