  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: fr
  text: La deuxième année du règne de Joas, fils de Joachaz, roi d’Israël, Amatsia, fils de Joas, devint roi de Juda.
