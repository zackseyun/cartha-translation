  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: fr
  text: Amatsia, fils de Joas[a], roi de Juda, vécut quinze ans après la mort de Joas, fils de Joachaz, roi d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les deux hommes appelés « Joas » dans ce verset sont des personnes distinctes : le père d’Amatsia et le roi d’Israël. L’hébreu emploie ici deux graphies différentes de ce nom, יוֹאָשׁ et יְהוֹאָשׁ, que l’usage français rend habituellement toutes deux par « Joas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Le verbe חיה, suivi d’une durée, indique ici qu’Amatsia continua de vivre pendant un certain nombre d’années après la mort de l’autre roi. « Vécut » reste proche de l’hébreu sans ajouter la nuance plus interprétative de « survécut ».
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Forme française usuelle du nom du roi de Juda.
- source_word: בֶן
  choice: fils de
  rationale: Dans cette formule d’identification royale, le terme exprime la filiation directe.
- source_word: יוֹאָשׁ / יְהוֹאָשׁ
  choice: Joas / Joas
  rationale: « Joas » est la forme française biblique usuelle pour les deux variantes hébraïques présentes dans ce verset. Une note signale la différence de graphie et distingue les deux personnes.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Traduction directe de la fonction royale et du royaume d’Amatsia.
- source_word: אַחֲרֵי מוֹת
  choice: après la mort de
  rationale: Cette formulation rend directement la préposition suivie du nom construit et conserve l’expression nominale de l’hébreu.
- source_word: יְהוֹאָחָז
  choice: Joachaz
  rationale: Forme française usuelle de ce nom propre.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Traduction directe de la fonction royale et du royaume du Nord.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: quinze ans
  rationale: Rendu français naturel de l’expression hébraïque de durée.
