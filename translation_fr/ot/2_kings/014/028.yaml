source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Jéroboam, tout ce qu’il fit, sa puissance, comment il combattit et comment il rendit Damas et Hamath à Juda en Israël[a], tout cela n’est-il pas écrit dans le livre des Annales des rois d’Israël ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « à Juda en Israël ». L’expression est difficile. Elle peut désigner un territoire rendu à Israël qui avait autrefois appartenu à Juda, ou conserver une ancienne désignation géopolitique. Le texte principal suit d’aussi près que possible la formulation hébraïque sans lever l’ambiguïté.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: Le reste des actes de Jéroboam
  rationale: La formule royale résume les faits du règne. « Actes » rend ici דִּבְרֵי de façon idiomatique sans ajouter de marqueur temporel absent de l’hébreu.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tout ce qu’il fit
  rationale: Rendu direct qui conserve la portée générale du verbe עשה.
- source_word: וּגְבוּרָתוֹ
  choice: sa puissance
  rationale: גְּבוּרָה peut désigner la force, la vaillance ou les hauts faits. « Puissance » reste compact, tandis que la proposition suivante en précise la dimension militaire.
- source_word: אֲשֶׁר נִלְחָם
  choice: comment il combattit
  rationale: La tournure française exprime naturellement la valeur explicative de אֲשֶׁר après le nom récapitulatif.
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: et comment il rendit
  rationale: Le causatif de שׁוב exprime ici la restitution ou le rétablissement d’un territoire. « Rendit » préserve cette idée sans préciser indûment le rapport politique.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: Damas et Hamath
  rationale: Formes françaises usuelles de ces noms géographiques.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: à Juda en Israël
  rationale: La formulation hébraïque est concise et difficile. Ce rendu formel en conserve les deux rapports prépositionnels sans imposer une reconstruction historique.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: La question rhétorique traditionnelle est conservée. « Tout cela » reprend naturellement en français la série d’éléments au pluriel exprimée par הֵם.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dans le livre des Annales des rois d’Israël
  rationale: « Annales » rend clairement le titre d’un document royal d’archives et évite de le confondre avec le livre biblique des Chroniques.
theological_decisions:
- issue: Rapport entre Juda et Israël dans לִיהוּדָה בְּיִשְׂרָאֵל
  choice: Conserver « à Juda en Israël » dans le texte
  alternative: Comprendre qu’il s’agit d’un territoire rendu à Israël qui avait autrefois appartenu à Juda, ou d’une ancienne désignation géopolitique
  rationale: Le texte hébreu ne permet pas de trancher avec assurance. La traduction maintient donc la tension historique et géographique au lieu de l’harmoniser.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le caractère formulaire du résumé royal, tout en ajoutant « tout cela » pour rendre la reprise rhétorique naturelle en français. Le marqueur de note est placé directement après l’expression difficile qu’il explique.
