base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: fr
  text: Ils conspirèrent contre lui à Jérusalem. Il s’enfuit à Lakish. Ils envoyèrent des hommes pour le poursuivre à Lakish[a] et le mirent à mort là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils envoyèrent après lui à Lakish » ; l’hébreu ne précise pas qui fut envoyé.'
    reason: Le texte hébreu laisse implicite l’objet de « envoyèrent ». « Des hommes » est fourni pour une formulation française naturelle, sans identifier les personnes envoyées.
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: Ils conspirèrent contre lui
  rationale: La construction associant le verbe קשׁר au nom קֶשֶׁר est une expression idiomatique désignant un complot politique. « Conspirèrent contre lui » en restitue naturellement le sens hostile sans reproduire maladroitement la redondance hébraïque.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition ב marque ici simplement le lieu.
- source_word: וַיָּנָס
  choice: Il s’enfuit
  rationale: Le verbe נוס exprime directement la fuite; le passé simple convient au récit historique en français.
- source_word: לָכִישָׁה
  choice: à Lakish / jusqu’à Lakish
  rationale: Le ה directionnel indique un mouvement vers la ville. « À Lakish » convient avec « s’enfuit »; dans la proposition de poursuite, « jusqu’à Lakish » rend plus naturellement en français la destination répétée.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: Ils envoyèrent des hommes à sa poursuite
  rationale: Littéralement, le texte dit « ils envoyèrent derrière/après lui », sans exprimer le complément d’objet. Le français exige ici de préciser l’objet implicite; « des hommes » reste générique, tandis que « à sa poursuite » rend la valeur contextuelle de אַחֲרָיו. Une note signale l’ellipse de l’hébreu.
- source_word: וַיְמִתֻהוּ
  choice: le mirent à mort
  rationale: La forme causative de מות signifie « faire mourir, mettre à mort ». Cette formulation conserve le caractère délibéré de l’acte.
- source_word: שָׁם
  choice: là-bas
  rationale: L’adverbe renvoie à Lakish; « là-bas » est naturel après la répétition du nom de la ville.
