- from: Ils conspirèrent contre lui à Jérusalem. Il s’enfuit à Lakish. Ils envoyèrent des hommes à sa poursuite jusqu’à Lakish[a] et le mirent à mort là-bas.
  to: Ils conspirèrent contre lui à Jérusalem. Il s’enfuit à Lakish. Ils envoyèrent des hommes pour le poursuivre à Lakish[a] et le mirent à mort là.
  rationale: La révision retire « jusqu’à », qui introduit une nuance non nécessaire, et emploie une construction française naturelle pour rendre l’envoi implicite de poursuivants. Elle préserve la succession des actions, l’absence d’opposition introduite, et l’ambiguïté quant à l’identité de ceux qui furent envoyés.
