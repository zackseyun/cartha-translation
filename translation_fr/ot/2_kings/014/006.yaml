source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: fr
  text: 'Mais il ne mit pas à mort les fils des meurtriers[a], comme il est écrit dans le livre de la loi de Moïse, que Yahweh a prescrite en ces termes : « Les pères ne seront pas mis à mort à cause de leurs fils, et les fils ne seront pas mis à mort à cause de leurs pères ; mais chacun mourra pour son propre péché. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les fils de ceux qui avaient frappé ». L’hébreu dit littéralement : « les fils de ceux qui frappent » ; dans ce contexte judiciaire, il désigne les meurtriers.'
    reason: lexical_alternative
  - marker: b
    text: Cette citation reprend Deutéronome 24.16.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: les fils de ceux qui avaient tué son père
  rationale: « Les fils » conserve le masculin pluriel de בְּנֵי. Le participe הַמַּכִּים désigne ici les hommes qui avaient tué le père du roi dans le contexte immédiat ; l’explicitation du complément rend le français naturel sans modifier le référent.
- source_word: לֹא הֵמִית
  choice: il ne fit pas mourir
  rationale: Le hiphil de מות signifie « faire mourir, mettre à mort ». « Fit mourir » conserve le causatif et le registre judiciaire.
- source_word: כַּכָּתוּב
  choice: conformément à ce qui est écrit
  rationale: Cette formule exprime que l’action du roi se conforme à une prescription écrite.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: dans le livre de la loi de Moïse
  rationale: Rendu transparent de סֵפֶר et תּוֹרָה, conforme à la formule juridique biblique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve le nom propre plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵאמֹר
  choice: où Yahweh a donné ce commandement
  rationale: Formulation française naturelle qui garde Yahweh comme auteur du commandement et introduit directement la citation.
- source_word: לֹא יוּמְתוּ
  choice: ne seront pas mis à mort
  rationale: La forme causative passive a ici une valeur juridique et interdit l’exécution, plutôt que de simplement annoncer une absence de décès.
- source_word: אָבוֹת ... בָּנִים
  choice: les pères ... les fils
  rationale: Le rendu conserve les pluriels masculins précis de l’hébreu au lieu de les généraliser en « parents » et « enfants ».
- source_word: עַל
  choice: à cause de
  rationale: Dans cette formule juridique, עַל indique le motif imputé pour la peine.
- source_word: כִּי אִם
  choice: mais
  rationale: La locution introduit le principe contraire après les deux interdictions. « Mais » restitue sobrement cette opposition.
- source_word: אִישׁ
  choice: chacun
  rationale: Dans cet emploi distributif, אִישׁ signifie que chaque individu répond personnellement de son acte. « Chacun » est idiomatique en français et n’efface pas le sens.
- source_word: בְּחֶטְאוֹ
  choice: pour son propre péché
  rationale: « Son propre » rend le suffixe possessif et souligne l’opposition avec une peine infligée pour le péché d’un membre de la famille.
- source_word: יָמוּת
  choice: mourra
  rationale: Le qal signifie « mourir », contrairement aux formes causatives passives précédentes. Le choix préserve ce changement verbal et l’ambiguïté entre décès comme conséquence et exécution dans ce contexte juridique.
theological_decisions:
- issue: Responsabilité individuelle et responsabilité familiale dans la loi de l’alliance
  choice: Le texte interdit de mettre à mort les fils pour les actes des pères, ou les pères pour ceux des fils, et affirme que chacun meurt pour son propre péché.
  alternative: Comprendre le verset comme niant toute conséquence collective ou intergénérationnelle du péché.
  rationale: Le contexte et les formes verbales concernent la peine capitale et la culpabilité personnelle. La traduction garde cette portée judiciaire sans transformer le verset en affirmation générale sur toutes les conséquences communautaires du péché.
- issue: Portée du dernier verbe יָמוּת
  choice: mourra
  alternative: sera mis à mort
  rationale: La forme hébraïque finale est un qal, et non la forme causative passive des deux propositions précédentes. « Mourra » préserve cette différence et la tension du texte sans imposer une interprétation exclusivement judiciaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la structure juridique de l’hébreu, tandis que « où Yahweh a donné ce commandement » évite une tournure calquée. Les termes masculins « pères », « fils » sont conservés, et « chacun » exprime naturellement la valeur distributive de אִישׁ.
