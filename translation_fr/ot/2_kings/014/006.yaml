  source_fidelity: La traduction ajoute indûment « son père » au syntagme hébreu « les fils de ceux qui avaient frappé/tué ». Le contexte narratif permet d’identifier ces hommes aux assassins du père du roi, mais ce complément n’est pas exprimé dans le verset et ne doit pas être intégré au texte traduit. Le reste rend fidèlement la portée judiciaire des formes « mettre à mort » et conserve à juste titre « mourra » pour le dernier verbe, qui n’a pas la même forme hébraïque.
  naturalness: Le français révisé est moderne, clair et conserve un registre narratif et juridique digne. « Comme il est écrit » et « a prescrite en ces termes » sont naturels sans calquer inutilement l’hébreu.
  terminology: « Yahweh », « loi de Moïse », « pères », « fils », « mis à mort », « péché » et « mourra » sont cohérents avec le texte source et le dossier anglais. « Meurtriers » convient dans le contexte, tandis que la note conserve l’alternative plus littérale liée au participe « frapper ».
