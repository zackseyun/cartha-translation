source:
  edition: WLC
  text: וְ/לֹא דִבֶּ֣ר יְהוָ֔ה לִ/מְחוֹת֙ אֶת שֵׁ֣ם יִשְׂרָאֵ֔ל מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וַ/יּ֣וֹשִׁיעֵ֔/ם בְּ/יַ֖ד יָרָבְעָ֥ם בֶּן יוֹאָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: fr
  text: Mais Yahvé n’avait pas dit qu’il effacerait le nom d’Israël de sous le ciel[a]. Il les sauva donc par la main[b] de Jéroboam, fils de Joas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi être rendu par « faire disparaître » ou « supprimer » le nom d’Israël.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « par la main de » signifie ici « par l’intermédiaire de » ou « au moyen de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française traditionnelle et largement intelligible du nom divin, qui rend explicitement le tétragramme.
- source_word: דִבֶּר
  choice: n’avait pas déclaré
  rationale: Le plus-que-parfait situe cette parole divine avant l’acte de salut raconté ensuite ; « déclaré » convient à l’idée d’une décision annoncée sans transformer le verbe en décret technique.
- source_word: לִמְחוֹת
  choice: qu’il effacerait
  rationale: Le verbe exprime ici la suppression complète. « Effacer » s’associe naturellement au « nom » tout en conservant l’image hébraïque.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: le nom d’Israël
  rationale: La formulation garde l’image selon laquelle le nom représente l’existence et l’identité durables du peuple.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: de dessous le ciel
  rationale: Cette expression proche de l’hébreu conserve la portée cosmique de la disparition envisagée, sans la réduire par interprétation à « de la terre ».
- source_word: וַיּוֹשִׁיעֵם
  choice: Il les sauva donc
  rationale: « Sauva » rend directement le hifil de ישׁע. « Donc » exprime le lien logique narratif entre l’absence d’une déclaration d’anéantissement et l’intervention divine.
- source_word: בְּיַד
  choice: par la main de
  rationale: La traduction conserve l’image hébraïque de la main tout en présentant Jéroboam comme l’agent humain du salut accordé par Dieu.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: Jéroboam, fils de Joas
  rationale: Emploi des formes françaises bibliques usuelles des noms, avec une filiation exprimée naturellement.
theological_decisions:
- issue: Intention divine et préservation d’Israël
  choice: Yahvé n’avait pas annoncé l’effacement d’Israël et il les sauva donc en se servant de Jéroboam.
  alternative: Coordonner les deux propositions avec « et » sans expliciter leur relation logique.
  rationale: Le déroulement hébreu relie la non-déclaration de l’anéantissement à l’action salvatrice qui suit. « Donc » rend cette logique sans faire de la première proposition un décret technique ni effacer la tension créée par le fait que Dieu agit au moyen de Jéroboam.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « de dessous le ciel » et l’image « par la main de » conservent la couleur de l’hébreu ; les notes en explicitent le sens sans l’insérer directement dans le verset.
