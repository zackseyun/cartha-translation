  to: Joas, roi d’Israël, captura à Beth-Shémesh Amatsia, roi de Juda, fils de Joas, fils d’Ahazia. Puis il vint à Jérusalem[a] et fit une brèche dans la muraille de Jérusalem, de la porte d’Éphraïm jusqu’à la porte de l’Angle, sur une longueur de quatre cents coudées.
  rationale: La révision corrige l’attribution erronée à la lecture massorétique dans la note et rend פּרץ par « fit une brèche », formulation plus exacte que « démolit ». Elle améliore également l’expression de la longueur sans modifier le sens ni résoudre la variation textuelle de manière dogmatique.
