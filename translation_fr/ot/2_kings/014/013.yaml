  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: fr
  text: Joas, roi d’Israël, captura à Beth-Shémesh Amatsia, roi de Juda, fils de Joas, fils d’Ahazia. Puis il vint à Jérusalem[a] et fit une brèche dans la muraille de Jérusalem, de la porte d’Éphraïm jusqu’à la porte de l’Angle, sur une longueur de quatre cents coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu consonantique porte « ils vinrent à Jérusalem », mais le contexte et le verbe singulier qui suit soutiennent le sens « il vint à Jérusalem », avec Joas pour sujet.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: captura
  rationale: Dans ce contexte militaire, le verbe désigne la capture d’un roi fait prisonnier; « captura » est précis et naturel.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: à Beth-Shémesh
  rationale: La préposition ב devant un nom de lieu indique ici le lieu de la capture; « à » convient à l’usage français.
- source_word: ו/יבאו
  choice: Puis il vint
  rationale: Le texte consonantique porte une forme plurielle, « ils vinrent », tandis que la lecture massorétique, le fil du récit et le verbe singulier suivant soutiennent « il vint », avec Joas pour sujet. « Puis » rend naturellement la progression narrative.
- source_word: וַיִּפְרֹץ
  choice: démolit
  rationale: Avec la muraille comme complément, le verbe exprime l’ouverture d’une brèche par destruction. « Démolit » rend clairement l’action sans lourdeur.
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: la muraille de Jérusalem
  rationale: Même si la préposition signifie littéralement « dans », la construction française naturelle présente la muraille comme l’objet de la démolition.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: depuis la porte d’Éphraïm jusqu’à la porte de l’Angle
  rationale: La tournure marque l’étendue de la section détruite; « depuis… jusqu’à… » la restitue clairement.
- source_word: הַפִּנָּה
  choice: l’Angle
  rationale: Dans le nom propre de cette porte, « Angle » exprime le coin ou l’angle de la muraille et conserve sa fonction de désignation.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: sur quatre cents coudées
  rationale: La coudée est conservée comme unité ancienne, et « sur » explicite naturellement en français la longueur de la portion démolie sans convertir la mesure.
- source_word: בֶּן ... בֶּן ...
  choice: fils de Joas, fils d’Ahazia
  rationale: La répétition de « fils de » suit la formulation généalogique hébraïque et évite de remplacer le second lien par une explicitation absente du texte.
