base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: fr
  text: La quinzième année du règne d’Amatsia, fils de Joas et roi de Juda, Jéroboam, fils de Joas et roi d’Israël, devint roi à Samarie. Il régna quarante et un ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: La quinzième année du règne de
  rationale: La formule de datation royale emploie un cardinal avec שָׁנָה dans un sens ordinal. L’ajout de « du règne » explicite naturellement en français la référence à l’année de règne sans changer le sens.
- source_word: לַאֲמַצְיָהוּ
  choice: d’Amatsia
  rationale: Dans cette formule chronologique, ל indique le roi dont on compte les années de règne.
- source_word: בֶן יוֹאָשׁ
  choice: fils de Joas
  rationale: Traduction directe de la construction patronymique; la graphie française traditionnelle des noms est retenue.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: La chaîne construite désigne la fonction d’Amatsia et le royaume sur lequel il règne.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans une notice d’avènement, le qal de מלך marque ici l’accession à la royauté, distincte de l’indication suivante sur la durée du règne.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Transcription française conventionnelle du nom propre.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: La chaîne construite précise la fonction et le royaume de Jéroboam.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Le ב locatif situe la royauté dans la capitale; « à Samarie » est l’expression française naturelle pour une ville.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: quarante et un ans
  rationale: Rendu idiomatique moderne du nombre cardinal qui indique la durée du règne.
