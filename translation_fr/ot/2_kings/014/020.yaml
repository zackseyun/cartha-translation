review_pass:
  verdict: approve
  source_fidelity: 'Le texte rend fidèlement la séquence hébraïque : transport d’Amatsia « sur des chevaux », puis ensevelissement à Jérusalem « avec ses pères », dans la cité de David. Le passif français « il fut enterré » reflète correctement le nifal וַיִּקָּבֵר. La note a préserve avec justesse l’incertitude quant aux modalités concrètes du transport.'
  naturalness: 'Le français est naturel, sobre et adapté à un récit historique : « On le transporta », « il fut enterré » et « à Jérusalem » se lisent aisément. « Sur des chevaux » reste quelque peu inhabituel, mais cette légère étrangeté est justifiée, car elle conserve l’expression concrète et ambiguë de l’hébreu; la note l’explicite sans surinterpréter.'
  terminology: « Ses ancêtres » communique idiomatiquement la formule funéraire « ses pères » dans un français moderne, et la note conserve le libellé littéral ainsi que sa portée dynastique. « Cité de David » est un rendu établi et approprié du toponyme. Les ancres de notes sont correctement placées après les expressions concernées.
