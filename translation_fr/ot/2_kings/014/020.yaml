source:
  edition: WLC
  text: וַ/יִּשְׂא֥וּ אֹת֖/וֹ עַל הַ/סּוּסִ֑ים וַ/יִּקָּבֵ֧ר בִּ/ירוּשָׁלִַ֛ם עִם אֲבֹתָ֖י/ו בְּ/עִ֥יר דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/020.yaml
  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: fr
  text: On le transporta sur des chevaux[a], puis il fut enterré à Jérusalem avec ses ancêtres[b], dans la cité de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur les chevaux ». L’expression peut désigner le transport du corps au moyen de chevaux, sans en préciser les modalités.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec ses pères » ; il s’agit d’une formule funéraire désignant ses ancêtres royaux.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: On le transporta
  rationale: Le verbe נשׂא signifie ici porter ou transporter. Le sujet indéfini « on » convient au récit français et conserve l’objet pronominal renvoyant à Amatsia.
- source_word: עַל הַסּוּסִים
  choice: sur des chevaux
  rationale: Cette formulation reste proche de עַל, « sur », tout en employant l’article indéfini naturel en français. Le mode précis de transport du corps demeure incertain.
- source_word: וַיִּקָּבֵר
  choice: puis il fut enterré
  rationale: Le passif rend le nifal hébreu. « Puis » exprime naturellement la succession narrative portée par le second wayyiqtol.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Forme locative française usuelle pour la ville.
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: Dans cette formule funéraire, אָבוֹת désigne les pères ou ancêtres dynastiques. « Ancêtres » communique clairement ce sens en français moderne sans suggérer uniquement le père immédiat.
- source_word: בְּעִיר דָּוִד
  choice: dans la cité de David
  rationale: Rendu traditionnel et intelligible du toponyme, qui précise le lieu d’inhumation à Jérusalem.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La traduction privilégie une équivalence optimale : elle garde « sur des chevaux » pour préserver l’expression concrète et ambiguë de l’hébreu, tout en rendant la formule funéraire « avec ses pères » par le français courant « avec ses ancêtres ».'
