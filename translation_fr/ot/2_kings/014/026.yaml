  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: fr
  text: 'Car Yahvé vit que la détresse d’Israël était extrêmement amère[a] : il ne restait plus personne, ni captif ni libre[b], et Israël n’avait personne pour lui venir en aide.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était extrêmement pénible » ou « était très sévère ». L’expression hébraïque est difficile, mais elle souligne clairement l’extrême souffrance d’Israël.
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque dont le sens précis est discuté; littéralement, elle oppose celui qui est retenu à celui qui est laissé libre. Elle semble indiquer qu’il ne restait absolument personne, ou que toutes les catégories de la population étaient à bout.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel sous sa forme française courante, afin de préserver sa valeur d’alliance plutôt que de le remplacer par un titre.
- source_word: עֳנִי
  choice: détresse
  rationale: Désigne ici la condition pénible et accablée de la nation; « détresse » convient mieux au contexte qu’un sens économique étroit comme « pauvreté ».
- source_word: מֹרֶה מְאֹד
  choice: extrêmement amère
  rationale: Conserve l’image traditionnelle de l’amertume tout en exprimant clairement l’intensité extrême de la souffrance. La difficulté lexicale de l’hébreu est signalée en note.
- source_word: אֶפֶס
  choice: il ne restait plus personne
  rationale: Rend en français naturel la négation absolue introduisant la paire idiomatique qui suit.
- source_word: עָצוּר וְעָזוּב
  choice: ni captif ni libre
  rationale: 'Préserve les deux termes opposés de l’expression hébraïque tout en faisant entendre sa portée globale : personne, quelle que soit sa condition.'
- source_word: עֹזֵר
  choice: personne pour lui venir en aide
  rationale: Rend naturellement le participe « celui qui aide » sans lui attribuer le sens plus précis de « libérateur ».
theological_decisions:
- issue: Sens de l’expression difficile עָצוּר וְעָזוּב
  choice: il ne restait plus personne, ni captif ni libre
  alternative: il n’y avait plus ni personne de retenu ni personne de relâché
  rationale: L’ajout explicatif « personne » communique la négation totale, tandis que « ni captif ni libre » conserve la tension et la forme binaire de l’hébreu. La note reconnaît que la nuance exacte de cette expression traditionnelle reste discutée.
- issue: Sens de מֹרֶה מְאֹד
  choice: était extrêmement amère
  alternative: était extrêmement pénible / était très sévère
  rationale: Le contexte exige une forte intensification de la détresse d’Israël, mais la forme hébraïque est difficile. Le texte principal garde l’image de l’amertume et la note présente les principales possibilités sans trancher au-delà des données.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit le mouvement causal de l’hébreu; les formulations « il ne restait plus personne » et « personne pour lui venir en aide » évitent un calque obscur, tandis que les notes préservent les difficultés réelles du texte source.
