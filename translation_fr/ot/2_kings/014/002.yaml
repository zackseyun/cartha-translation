  variant: modern international French
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יהועדין מִן יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: fr
  text: Il avait vingt-cinq ans lorsqu’il devint roi, et il régna vingt-neuf ans à Jérusalem. Sa mère s’appelait Joaddîn[a] et elle était de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce nom est traditionnellement rendu par « Joaddân » dans de nombreuses traductions.
    reason: Variante traditionnelle du nom propre; le texte principal suit la forme consonantique fournie, יהועדין.
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Il avait vingt-cinq ans
  rationale: Il s’agit de l’expression hébraïque habituelle indiquant l’âge. Cette formulation en restitue naturellement le sens en français moderne.
- source_word: הָיָה בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La formule royale indique l’âge du souverain au moment de son accession au trône. « Lorsqu’il devint roi » est clair, naturel et fidèle.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: il régna vingt-neuf ans
  rationale: Le verbe מלך désigne ici l’exercice et la durée de la royauté; « régna » est l’équivalent français précis dans une notice royale.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: En français, on emploie naturellement la préposition « à » avec le nom de cette ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Cette tournure française actuelle restitue exactement la formule hébraïque « le nom de sa mère était » sans lourdeur inutile.
- source_word: יהועדין
  choice: Joaddîn
  rationale: Cette forme française translittère le nom attesté par le texte hébreu fourni tout en employant la forme initiale « Jo- », courante dans les noms bibliques français formés sur l’élément divin יהו.
- source_word: מִן יְרוּשָׁלָם
  choice: elle était de Jérusalem
  rationale: La préposition מן marque l’origine ou l’appartenance. La formulation explicite évite en français de rattacher par erreur « de Jérusalem » au nom propre.
