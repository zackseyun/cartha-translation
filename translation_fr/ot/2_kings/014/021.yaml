base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: fr
  text: Alors tout le peuple de Juda prit Azaria — il avait seize ans — et l’établit roi à la place de son père Amatsia[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azaria est également appelé Ozias ailleurs ; le texte hébreu porte ici le nom Azaria.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: prit
  rationale: Le verbe לקח signifie littéralement « prendre ». Dans ce contexte d’accession au trône, « prit » conserve l’action directe du texte sans introduire l’idée plus interprétative d’une élection.
- source_word: כָּל עַם יְהוּדָה
  choice: tout le peuple de Juda
  rationale: Cette formulation rend explicitement le peuple comme acteur collectif, plutôt que Juda comme simple territoire ou entité abstraite.
- source_word: עֲזַרְיָה
  choice: Azaria
  rationale: Le texte hébreu de ce verset porte la forme Azaria. L’autre nom du roi, Ozias, est signalé en note.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: il avait seize ans
  rationale: Expression idiomatique en français moderne qui restitue naturellement l’indication d’âge à valeur incidente.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: l’établit roi
  rationale: Le hiphil de מלך signifie faire régner quelqu’un, donc l’établir comme roi. Ce choix n’ajoute ni couronnement ni simple proclamation.
- source_word: תַּחַת אָבִיו
  choice: à la place de son père
  rationale: Dans un contexte de succession royale, תחת exprime le remplacement dans la fonction, et pas seulement une postériorité chronologique.
- source_word: אֲמַצְיָהוּ
  choice: Amatsia
  rationale: Forme française traditionnelle et transparente du nom propre hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le singulier « prit » et « établit » s’accorde avec le nom collectif « tout le peuple ». Les tirets conservent le caractère incident de l’indication d’âge.
