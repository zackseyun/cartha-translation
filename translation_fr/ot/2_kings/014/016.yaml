  text: וַ/יִּשְׁכַּ֤ב יְהוֹאָשׁ֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ בְּ/שֹׁ֣מְר֔וֹן עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יָרָבְעָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: fr
  text: Joas s’endormit avec ses ancêtres[a] et fut enterré à Samarie avec les rois d’Israël. Son fils Jéroboam régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se coucha avec ses pères » ; formule traditionnelle indiquant la mort.'
    reason: La note conserve l’image et la formulation hébraïques derrière une traduction française plus naturelle.
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: s’endormit
  rationale: Dans cette formule funéraire royale, le verbe évoque la mort. « S’endormit » conserve l’image hébraïque tout en étant plus naturel en français que le calque « se coucha ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: « Ancêtres » rend ici אָבוֹת de façon claire et naturelle en français moderne, dans une formule qui rattache le roi aux générations précédentes.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le passif français correspond à la forme hébraïque et convient au registre narratif.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: En français, la préposition « à » est la tournure locative idiomatique avec le nom de cette ville.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: avec les rois d’Israël
  rationale: « Avec » reflète directement עִם et indique l’association funéraire avec les autres rois d’Israël.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Ce verbe maintient la formule de succession royale sans développer explicitement l’idée d’accession.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Cette expression rend l’idée de remplacement dynastique, et pas seulement celle d’une succession chronologique.
theological_decisions: []
