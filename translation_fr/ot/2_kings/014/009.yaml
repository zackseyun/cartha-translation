    issue: « fit dire au cèdre »
    rationale: Cette tournure causative peut laisser entendre que le buisson charge un tiers de parler. Le texte hébreu dit directement que le buisson « envoya » au cèdre, en introduisant ses propres paroles. « envoya dire au cèdre » rend cette personnification avec plus de fidélité.
