  to: 'Alors Joas, roi d’Israël, envoya ce message à Amatsia, roi de Juda : « Le buisson épineux[a] du Liban envoya dire au cèdre du Liban : “Donne ta fille pour femme à mon fils.” Et un animal sauvage[b] du Liban passa et piétina le buisson épineux. »'
