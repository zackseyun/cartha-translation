base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: fr
  text: 'Alors Joas, roi d’Israël, envoya ce message à Amatsia, roi de Juda : « Le buisson épineux[a] du Liban envoya dire au cèdre du Liban : “Donne ta fille pour femme à mon fils.” Et un animal sauvage[b] du Liban passa et piétina le buisson épineux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chardon » ou « la ronce »; le mot hébreu désigne une plante épineuse.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un animal des champs », c’est-à-dire une bête sauvage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לֵאמֹר
  choice: 'envoya ce message à ... :'
  rationale: Cette tournure française naturelle exprime à la fois l’envoi et l’introduction du discours, sans alourdir la phrase par « envoya ... en disant ».
- source_word: יְהוֹאָשׁ
  choice: Joas
  rationale: Forme française traditionnelle et courante du nom du roi d’Israël.
- source_word: הַחוֹחַ
  choice: le buisson épineux
  rationale: Le terme désigne une plante épineuse sans permettre d’en préciser sûrement l’espèce. « Buisson épineux » rend clairement son caractère bas et vulnérable face au cèdre.
- source_word: הָאֶרֶז
  choice: le cèdre
  rationale: Équivalent direct qui conserve le contraste proverbial entre le végétal épineux et l’arbre majestueux.
- source_word: בַּלְּבָנוֹן
  choice: du Liban
  rationale: Dans cette image, le français idiomatique emploie « du Liban » pour situer les plantes et l’animal; les trois occurrences sont conservées.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: Donne ta fille pour femme à mon fils
  rationale: Formulation claire qui conserve explicitement la demande d’alliance matrimoniale.
- source_word: חַיַּת הַשָּׂדֶה
  choice: un animal sauvage
  rationale: Le syntagme signifie littéralement « un animal des champs » et désigne ici de façon générale une bête sauvage, sans indiquer d’espèce.
- source_word: וַתַּעֲבֹר
  choice: passa
  rationale: Rend simplement le mouvement de l’animal, conformément au récit imagé.
- source_word: וַתִּרְמֹס
  choice: piétina
  rationale: Verbe vif et concis correspondant à l’action d’écraser sous les pieds.
