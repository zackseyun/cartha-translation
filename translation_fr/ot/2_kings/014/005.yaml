base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: fr
  text: Lorsque le royaume fut solidement établi sous son autorité[a], il mit à mort[b] ses serviteurs qui avaient mis à mort le roi, son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lorsque le royaume devint fort dans sa main ». Cette expression signifie que son autorité royale était désormais solidement assurée.'
    reason: lexical_alternative
  - marker: b
    text: 'Le même verbe hébreu est employé pour l’acte du roi et pour celui de ses serviteurs : il mit à mort ceux qui avaient mis à mort son père.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Dès que
  rationale: La construction introduit le moment où se produit l’action suivante. « Dès que » rend naturellement la progression temporelle et la nuance d’immédiateté, sans conserver une formule narrative lourde en français.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: le royaume fut solidement établi entre ses mains
  rationale: Le verbe חזק exprime ici l’affermissement du pouvoir royal. « Entre ses mains » conserve l’image hébraïque de la maîtrise, tandis que « solidement établi » en explicite le sens politique.
- source_word: וַיַּךְ ... הַמַּכִּים
  choice: il mit à mort ... qui avaient mis à mort
  rationale: Dans ce contexte, נכה désigne une mise à mort. La répétition du même rendu français préserve le parallélisme lexical de l’hébreu entre l’acte d’Amatsia et celui des serviteurs.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: « Serviteurs » est le correspondant direct de עבד et peut désigner, dans le cadre de la cour, des hommes attachés au service du roi, y compris des fonctionnaires ou officiers.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: le roi, son père
  rationale: La formulation conserve l’apposition concise de l’hébreu tout en la rendant claire par la ponctuation française.
