  naturalness: Le texte est clair et de registre approprié. « Sous son autorité » est plus idiomatique en français international moderne que « entre ses mains » dans ce contexte, tout en explicitant sobrement l’idiome royal. La note conserve l’image littérale du texte hébreu.
