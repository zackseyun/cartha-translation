  yaml_path: translation/ot/2_kings/014/012.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: fr
  text: Juda fut battu devant Israël, et chacun s’enfuit à sa tente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacun s’enfuit chez lui ». L’hébreu dit littéralement « chacun à sa tente », expression courante pour le retour de chacun à son lieu d’habitation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: fut battu
  rationale: Le niphal de נָגַף indique ici une défaite militaire. « Fut battu » est naturel en français narratif et conserve la tournure passive du texte hébreu.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française usuelle du nom du royaume du Sud.
- source_word: לִפְנֵי
  choice: devant
  rationale: Dans ce contexte militaire, לִפְנֵי présente Israël comme l’adversaire devant lequel Juda subit la défaite; « devant » préserve la construction hébraïque sans la réduire à un simple complément d’agent.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom du royaume du Nord.
- source_word: וַיָּנֻסוּ
  choice: s’enfuit
  rationale: Le verbe נוּס signifie fuir. Le singulier français s’accorde avec le distributif « chacun ».
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif אִישׁ signifie que les combattants se dispersèrent individuellement. « Chacun » rend ce sens avec naturel en français moderne.
- source_word: לְאָהֳלוֹ
  choice: vers sa tente
  rationale: La traduction conserve l’image littérale de la tente, tout en signalant en note que l’expression peut désigner le lieu où chacun demeure.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Juda fut battu devant Israël » conserve la formulation militaire et la relation spatiale de l’hébreu; « chacun s’enfuit vers sa tente » maintient son image concrète tout en restant intelligible.
