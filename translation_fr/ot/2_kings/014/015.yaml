base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Joas, tout ce qu’il a fait, sa puissance et la manière dont il a combattu Amatsia[a], roi de Juda, tout cela n’est-il pas écrit dans le livre des Chroniques des rois d’Israël[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a combattu avec Amatsia ». Dans ce contexte militaire, la préposition hébraïque exprime un affrontement et peut aussi être rendue par « a combattu contre Amatsia ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le livre des Annales des rois d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָשׁ
  choice: Le reste des actes de Joas
  rationale: La formule royale de 2 Rois concerne les faits et gestes du roi, non seulement ses paroles. « Joas » est la forme française traditionnelle et courante de יְהוֹאָשׁ.
- source_word: אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: La proposition relative est rendue explicitement afin de ne rien omettre du texte hébreu.
- source_word: וּגְבוּרָתוֹ
  choice: sa puissance
  rationale: גְּבוּרָה désigne ici la force ou la puissance manifestée par le roi, avec une probable nuance militaire.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: et la manière dont il a combattu
  rationale: Cette formulation naturelle exprime l’affrontement sans ajouter « contre » dans le corps du texte; la valeur littérale de la préposition עִם est signalée en note.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: « Tout cela » reprend naturellement en français les différents éléments énumérés, tandis que la question rhétorique de l’hébreu est conservée.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dans le livre des Chroniques des rois d’Israël
  rationale: Rendu idiomatique du titre d’un recueil d’archives royales, conforme à la formule récurrente du livre des Rois.
