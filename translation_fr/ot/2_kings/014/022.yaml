  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: fr
  text: C’est lui qui reconstruisit Éilath et la rendit à Juda, après que le roi se fut couché avec ses pères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: reconstruisit
  rationale: Dans ce contexte de reprise d’une ville antérieurement connue, le verbe français « reconstruire » exprime naturellement la remise en état, même si l’hébreu dit littéralement « bâtit ».
- source_word: וַיְשִׁבֶהָ
  choice: la rendit
  rationale: Le hiphil de שׁוב signifie ici faire revenir ou restituer; « la rendit à Juda » conserve l’idée de réintégration politique.
- source_word: שְׁכַב ... עִם אֲבֹתָיו
  choice: se fut couché avec ses ancêtres
  rationale: Conserve l’euphémisme funéraire traditionnel de l’hébreu et son lien avec les générations précédentes, sans le réduire simplement à « mourir ».
theological_decisions:
- issue: Identité du « roi » dans la proposition temporelle
  choice: Maintien de la désignation non précisée « le roi »
  alternative: Expliciter « son père, le roi » ou nommer Amatsia
  rationale: Le texte hébreu garde ici le référent sous la forme « le roi »; l’expliciter résoudrait une référence que le verset laisse implicite.
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au récit historique; le plus-que-parfait du subjonctif « se fut couché » marque clairement l’antériorité et préserve la formule funéraire hébraïque.
