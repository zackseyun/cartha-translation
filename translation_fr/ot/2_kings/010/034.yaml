  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Jéhu, tout ce qu’il a fait et toute sa puissance[a], tout cela n’est-il pas écrit dans le livre des annales des rois d’Israël[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses exploits ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’une source constituée d’annales royales, et pas nécessairement du livre biblique des Chroniques.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: Le reste des actes de Jéhu
  rationale: Dans cette formule de conclusion de règne, דִּבְרֵי désigne les actes ou les affaires du roi plutôt que ses paroles. « Le reste des actes » est naturel en français et ne surcharge pas le וְ initial d’un marqueur temporel absent de l’hébreu.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Rend directement la totalité exprimée par כָּל et conserve la proposition relative de l’hébreu.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: et toute sa puissance
  rationale: גְּבוּרָה peut désigner la puissance, la vaillance ou les exploits par lesquels cette puissance se manifeste. « Toute sa puissance » préserve la formulation compacte et l’ambiguïté du terme; « tous ses exploits » est signalé en note.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: La question rhétorique, qui attend une réponse affirmative, est conservée. « Tout cela » reprend clairement en français la série des éléments précédents, là où l’hébreu emploie le pronom pluriel הֵם.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », « écrit dans le livre » est la tournure idiomatique française. « Livre » est la désignation conventionnelle de סֵפֶר dans cette formule, même si le support historique pouvait être un rouleau.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: le livre des annales des rois d’Israël
  rationale: Dans ce contexte, דִּבְרֵי הַיָּמִים désigne des archives royales ou annales. « Annales » évite de faire croire qu’il s’agit nécessairement du livre biblique des Chroniques, tandis que « des rois d’Israël » rend naturellement la relation marquée par לְ.
