source:
  edition: WLC
  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: fr
  text: 'Toutefois, Jéhu ne se détourna pas[a] des péchés de Jéroboam, fils de Nebath, par lesquels il avait fait pécher Israël : les veaux d’or qui se trouvaient à Béthel et à Dan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne s’écarta pas de derrière eux » ; autrement dit, il ne cessa pas de les suivre.'
    reason: L’hébreu emploie une tournure imagée dont la traduction littérale serait peu naturelle en français.
lexical_decisions:
- source_word: רַק
  choice: Toutefois
  rationale: Dans le contexte, la particule introduit une réserve qui limite le bilan positif de l’action de Jéhu. « Toutefois » exprime naturellement en français cette force à la fois restrictive et adversative.
- source_word: חֲטָאֵי
  choice: péchés
  rationale: Le pluriel désigne les fautes précises liées au culte instauré par Jéroboam ; « péchés » est direct, transparent et conforme au registre biblique courant.
- source_word: הֶחֱטִיא
  choice: avait fait pécher
  rationale: Cette formulation conserve explicitement la valeur causative du hiphil de חטא et l’antériorité de l’action de Jéroboam par rapport au règne de Jéhu.
- source_word: לֹא סָר מֵאַחֲרֵיהֶם
  choice: ne se détourna pas des
  rationale: Le français rend ainsi naturellement l’idée de ne pas abandonner une conduite suivie, tandis qu’une note conserve l’image plus littérale de l’hébreu.
- source_word: עֶגְלֵי הַזָּהָב
  choice: les veaux d’or
  rationale: Expression française usuelle qui conserve le référent cultuel concret et précise en apposition quels étaient les péchés visés.
- source_word: אֲשֶׁר בֵּית אֵל וַאֲשֶׁר בְּדָן
  choice: qui se trouvaient à Béthel et à Dan
  rationale: Le verbe « se trouvaient », sous-entendu en hébreu, produit une phrase française claire sans ajouter d’interprétation au simple repérage géographique.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: דָּן
  choice: Dan
  rationale: Translittération française courante du nom de lieu.
theological_decisions:
- issue: Rapport entre « les péchés de Jéroboam » et « les veaux d’or »
  choice: Les « veaux d’or » sont présentés après deux-points comme une précision apposée qui identifie concrètement les péchés mentionnés.
  alternative: On pourrait comprendre la dernière expression comme une reprise explicative après une rupture syntaxique.
  rationale: Les deux-points préservent la fonction explicative de la formulation hébraïque sans imposer une distinction théologique entre les péchés et les objets cultuels.
translation_notes:
  register: 'Français moderne, international et digne. La syntaxe reste accessible, avec « toutefois » pour marquer la réserve contextuelle et les deux-points pour rendre clairement l’apposition finale. Les noms propres suivent les formes françaises courantes : Jéhu, Jéroboam, Nebath et Béthel.'
