source:
  edition: WLC
  text: וּ/רְאִיתֶ֞ם הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ מִ/בְּנֵ֣י אֲדֹנֵי/כֶ֔ם וְ/שַׂמְתֶּ֖ם עַל כִּסֵּ֣א אָבִ֑י/ו וְ/הִֽלָּחֲמ֖וּ עַל בֵּ֥ית אֲדֹנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: fr
  text: Choisissez[a] parmi les fils de votre maître celui qui est le meilleur et le plus droit, placez-le sur le trône de son père et combattez pour la maison[b] de votre maître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Voyez celui qui est bon et droit parmi les fils de votre maître. » Ici, « voir » implique d’examiner les candidats afin d’en choisir un.'
    reason: lexical_alternative
  - marker: b
    text: Ici, la « maison » désigne la famille royale ou la dynastie, et non simplement un bâtiment.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Choisissez
  rationale: Le verbe signifie littéralement « voyez », mais, dans cette invitation ironique à examiner les candidats et à en retenir un, « choisissez » exprime naturellement l’action visée.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: celui qui est le meilleur et le plus droit
  rationale: Les deux adjectifs substantivés au singulier désignent un candidat parmi plusieurs. Le contexte leur donne une valeur comparative ou superlative, tandis que « droit » conserve la dimension morale de יָשָׁר sans exclure l’idée d’aptitude.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: parmi les fils de votre maître
  rationale: La préposition indique une sélection au sein du groupe. « Maître » désigne ici le souverain humain auquel les destinataires sont attachés, et non Dieu.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: placez-le sur le trône de son père
  rationale: Cette formulation française claire conserve l’image du texte et implique son installation comme successeur royal.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: et combattez pour la maison de votre maître
  rationale: « Combattre pour » rend la défense d’une cause ou d’un parti. « Maison » préserve l’image dynastique hébraïque, explicitée en note.
theological_decisions:
- issue: Sens de אֲדֹנֵיכֶם
  choice: votre maître
  alternative: votre seigneur
  rationale: Dans ce contexte narratif, le terme renvoie au roi humain dont les destinataires servent la famille. « Maître » évite de suggérer un titre divin.
- issue: Portée de בֵּית אֲדֹנֵיכֶם
  choice: la maison de votre maître
  alternative: la dynastie de votre maître
  rationale: Le maintien de « maison » conserve la métaphore biblique et son possible champ familial, domestique et dynastique; une note en précise le sens dominant ici.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs pluriels reproduisent le défi adressé collectivement aux responsables. La formulation conserve « maison » comme image dynastique tout en levant son ambiguïté culturelle par une note.
