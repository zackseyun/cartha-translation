source:
  edition: WLC
  text: וְ/עַתָּ֗ה כְּ/בֹ֨א הַ/סֵּ֤פֶר הַ/זֶּה֙ אֲלֵי/כֶ֔ם וְ/אִתְּ/כֶ֖ם בְּנֵ֣י אֲדֹנֵי/כֶ֑ם וְ/אִתְּ/כֶם֙ הָ/רֶ֣כֶב וְ/הַ/סּוּסִ֔ים וְ/עִ֥יר מִבְצָ֖ר וְ/הַ/נָּֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: fr
  text: Maintenant, quand cette lettre[a] vous parviendra, puisque vous avez avec vous les fils de votre maître[b], ainsi que les chars, les chevaux, une ville fortifiée[c] et les armes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce document ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des fils du roi que les destinataires servaient.
    reason: cultural_note
  - marker: c
    text: 'Ou : « une ville forte ». L’expression désigne une ville défendable dont disposent les destinataires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marqueur discursif qui introduit l’étape suivante du message de Jéhu. Le « et » préfixé peut être absorbé naturellement en français.
- source_word: כְּבֹא
  choice: quand … vous parviendra
  rationale: L’infinitif construit de בוא avec כ exprime le temps. Avec une lettre pour sujet, « parvenir » est idiomatique en français et inclut naturellement l’idée d’arrivée auprès des destinataires.
- source_word: הַסֵּפֶר הַזֶּה
  choice: cette lettre
  rationale: Dans ce contexte de correspondance royale, סֵפֶר désigne un message écrit, non un livre. « Lettre » est le terme français le plus naturel.
- source_word: אֲלֵיכֶם
  choice: vous
  rationale: Le pronom est pluriel en hébreu. En français, le pluriel ressort du contexte et du groupe de destinataires.
- source_word: וְאִתְּכֶם
  choice: vous avez avec vous
  rationale: Les groupes prépositionnels hébreux forment une proposition sans verbe. Le français fournit « avez » et rassemble naturellement sous cette construction les personnes et les moyens dont disposent les destinataires.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: les fils de votre maître
  rationale: אדון désigne ici le souverain que servaient les destinataires, dans un cadre politique et non divin. « Maître » conserve ce rapport sans introduire un titre divin.
- source_word: הָרֶכֶב
  choice: les chars
  rationale: Le nom collectif désigne les chars ou la force de chars. Le pluriel concret est clair et fidèle.
- source_word: וְהַסּוּסִים
  choice: les chevaux
  rationale: Rendu direct du terme hébreu, sans préciser au-delà du texte leur fonction militaire.
- source_word: וְעִיר מִבְצָר
  choice: une ville fortifiée
  rationale: Le groupe construit désigne une ville pourvue de fortifications et disponible comme position défensive.
- source_word: וְהַנָּשֶׁק
  choice: les armes
  rationale: נשק désigne ici l’armement de manière générale. « Armes » est plus clair et moins restrictif que « armure ».
theological_decisions: []
