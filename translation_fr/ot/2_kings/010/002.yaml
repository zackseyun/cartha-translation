  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule, car la proposition introduite ici se poursuit au verset suivant. L’énumération hébraïque est rendue avec fluidité sans effacer l’idée que toutes ces ressources sont à la disposition des destinataires.
