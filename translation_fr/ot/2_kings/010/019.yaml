  source_fidelity: 'Le texte français rend avec précision les éléments principaux du TM : וְעַתָּה (« Et maintenant »), les trois catégories liées à Baal, l’interdiction qu’un homme soit absent, le grand sacrifice destiné à Baal, la menace, et le but destructeur de la ruse de Jéhu. Contrairement à une observation de la piste anglaise, le texte hébreu fourni contient bien explicitement וְעַתָּה. Une légère correction du temps verbal narratif améliore la fidélité de וַיֵּהוּא עָשָׂה, qui rapporte l’action stratégique accomplie de Jéhu plutôt qu’une action en cours.'
