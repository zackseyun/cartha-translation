  terminology: « Prophètes de Baal », « prêtres », « rendre un culte », « sacrifice », « par ruse » et « faire périr » sont justes, cohérents et adaptés au registre narratif. « Pas un seul homme » conserve sans surcharge la formulation masculine singulière du texte source; la note fournit l’alternative inclusive.
