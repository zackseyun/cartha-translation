source:
  edition: WLC
  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: fr
  text: « Et maintenant, faites venir auprès de moi tous les prophètes de Baal, tous ceux qui lui rendent un culte et tous ses prêtres. Que pas un seul homme ne manque à l’appel[a], car j’ai un grand sacrifice à offrir à Baal. Quiconque manquera ne restera pas en vie. » Mais Jéhu avait agi ainsi par ruse[b], afin de faire périr ceux qui rendaient un culte à Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que personne ne manque à l’appel. » L’hébreu emploie au singulier le mot « homme » dans un sens représentatif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par tromperie » ; le terme peut aussi évoquer la perfidie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Le texte massorétique comporte explicitement la conjonction וְ et l’adverbe עַתָּה. La traduction les conserve comme transition dans le discours de Jéhu.
- source_word: נְבִיאֵי הַבַּעַל
  choice: les prophètes de Baal
  rationale: Le groupe construit désigne naturellement les prophètes attachés au culte de Baal.
- source_word: עֹבְדָיו
  choice: ceux qui lui rendent un culte
  rationale: Dans ce contexte cultuel, עבד exprime le service religieux de Baal. Cette formulation française est claire et évite l’ambiguïté de « serviteurs ».
- source_word: כֹּהֲנָיו
  choice: ses prêtres
  rationale: כֹּהֵן désigne ici les responsables cultuels, et le suffixe masculin singulier renvoie à Baal.
- source_word: קִרְאוּ אֵלַי
  choice: convoquez auprès de moi
  rationale: L’impératif pluriel exprime l’appel à se rassembler auprès de Jéhu; « convoquez » convient à son ordre officiel.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: Que pas un seul homme ne manque à l’appel
  rationale: Le nifal de פקד évoque ici l’absence lors d’un rassemblement ou d’un recensement. « Manquer à l’appel » restitue ce cadre, tandis que « un seul homme » conserve la forme masculine singulière et sa force distributive.
- source_word: זֶבַח גָּדוֹל לִי לַבַּעַל
  choice: j’ai un grand sacrifice à offrir à Baal
  rationale: La tournure rend la possession ou l’obligation exprimée par לִי tout en conservant Baal comme destinataire du sacrifice.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: Quiconque manquera ne restera pas en vie
  rationale: La répétition de פקד est maintenue par « manquera », et la menace littérale « ne vivra pas » est rendue dans un français naturel sans en atténuer la force.
- source_word: בְעָקְבָּה
  choice: par tromperie
  rationale: Le nom désigne une conduite trompeuse ou rusée. « Par tromperie » conserve l’évaluation explicite du narrateur.
- source_word: לְמַעַן הַאֲבִיד
  choice: afin de faire périr
  rationale: La proposition finale et la valeur causative du hifil de אבד sont toutes deux conservées.
- source_word: עֹבְדֵי הַבָּעַל
  choice: ceux qui rendaient un culte à Baal
  rationale: Le choix reprend le sens cultuel de עבד et assure la cohérence interne du verset.
theological_decisions:
- issue: Évaluation narrative de la conduite de Jéhu
  choice: Mais Jéhu agissait ainsi par tromperie
  alternative: Mais Jéhu avait agi ainsi par ruse
  rationale: Le narrateur qualifie explicitement la stratégie de Jéhu. La traduction ne la justifie pas et préserve la tension morale du récit.
- issue: Masculin singulier générique אִישׁ
  choice: Que pas un seul homme ne manque à l’appel
  alternative: Que personne ne manque à l’appel
  rationale: Le texte principal conserve le masculin singulier représentatif de l’hébreu et sa force emphatique; la note donne l’équivalent français inclusif possible.
- issue: Valeur de לִי dans l’annonce du sacrifice
  choice: j’ai un grand sacrifice à offrir à Baal
  alternative: je vais offrir un grand sacrifice à Baal
  rationale: Cette formulation garde l’idée que Jéhu présente le sacrifice comme étant de son ressort, sans suggérer qu’il en serait lui-même le bénéficiaire.
translation_notes:
  register: Français international moderne, digne et narratif. « Convoquez », « manque à l’appel » et « faire périr » restent accessibles tout en convenant au ton royal et à la gravité de la scène. La répétition liée au culte de Baal est conservée. Les deux appels de notes [a] et [b] figurent dans le texte principal.
