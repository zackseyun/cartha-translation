source:
  edition: WLC
  text: וַֽ/יִּתְּצ֔וּ אֵ֖ת מַצְּבַ֣ת הַ/בָּ֑עַל וַֽ/יִּתְּצוּ֙ אֶת בֵּ֣ית הַ/בַּ֔עַל וַ/יְשִׂמֻ֥/הוּ ל/מחראות עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: fr
  text: Ils démolirent la stèle de Baal et démolirent le temple de Baal[a] ; ils en firent des latrines jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de Baal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: ils démolirent
  rationale: Le verbe נתץ exprime la destruction violente d’un objet cultuel ou d’un bâtiment. « Démolir » convient naturellement aux deux emplois dans ce verset.
- source_word: מַצְּבַת
  choice: la stèle
  rationale: מַצֵּבָה désigne ici une pierre dressée à fonction cultuelle. « Stèle » est précis et courant en français biblique moderne.
- source_word: הַבָּעַל
  choice: de Baal
  rationale: בַּעַל est ici le nom ou titre de la divinité cananéenne, traditionnellement translittéré « Baal ».
- source_word: בֵּית הַבַּעַל
  choice: le temple de Baal
  rationale: בַּיִת signifie littéralement « maison », mais désigne dans ce contexte le sanctuaire de Baal. « Temple » rend clairement cette fonction en français naturel, tandis qu’une note conserve l’expression littérale.
- source_word: וַיְשִׂמֻהוּ
  choice: ils en firent
  rationale: Avec ל, שׂוּם indique ici la transformation ou l’affectation du bâtiment à un nouvel usage. « En firent » est direct et idiomatique.
- source_word: למחראות
  choice: des latrines
  rationale: Le nom, de forme plurielle, désigne un lieu destiné aux excréments. « Latrines » exprime sans euphémisme la profanation délibérée du sanctuaire.
- source_word: עַד הַיּוֹם
  choice: encore aujourd’hui
  rationale: Cette expression hébraïque indique que l’état décrit perdurait jusqu’à l’époque du narrateur. « Encore aujourd’hui » en est un équivalent français naturel.
theological_decisions:
- issue: Désignation du sanctuaire de Baal
  choice: le temple de Baal
  alternative: la maison de Baal
  rationale: Le contexte cultuel établit que בֵּית désigne un sanctuaire. « Temple » évite en français toute confusion avec une habitation, sans ajouter de précision doctrinale; le sens littéral est signalé en note.
- issue: Désignation de la profanation en למחראות
  choice: des latrines
  alternative: un lieu d’aisances
  rationale: Le texte souligne la profanation complète du lieu de culte. « Latrines » transmet clairement et sobrement cette force, sans archaïsme ni atténuation.
translation_notes:
  register: Français moderne, international et digne. La coordination a été légèrement allégée avec « ainsi que », tout en conservant la destruction de la stèle et celle du sanctuaire. Le pluriel « latrines » suit la forme hébraïque et l’usage français.
