  naturalness: Le français est moderne et clair. La formulation révisée rattache directement « jusqu’à ce jour » à l’état résultant, sans relative dont l’antécédent est déplacé.
  terminology: « Stèle », « Baal », « temple » et « latrines » sont des choix recevables. La note sur « temple » signale correctement que l’hébreu dit littéralement « maison de Baal ».
