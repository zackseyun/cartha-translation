  text: וַ/יְהִ֗י כְּ/בֹ֤א הַ/סֵּ֨פֶר֙ אֲלֵי/הֶ֔ם וַ/יִּקְחוּ֙ אֶת בְּנֵ֣י הַ/מֶּ֔לֶךְ וַֽ/יִּשְׁחֲט֖וּ שִׁבְעִ֣ים אִ֑ישׁ וַ/יָּשִׂ֤ימוּ אֶת רָֽאשֵׁי/הֶם֙ בַּ/דּוּדִ֔ים וַ/יִּשְׁלְח֥וּ אֵלָ֖י/ו יִזְרְעֶֽאלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: fr
  text: Quand la lettre leur parvint, ils prirent les fils du roi et égorgèrent les soixante-dix hommes. Ils mirent leurs têtes dans des récipients[a], puis les lui envoyèrent à Jizréel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner divers contenants, notamment des paniers, des pots ou des jarres.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: la lettre
  rationale: Dans ce récit, le terme désigne la communication écrite envoyée par Jéhu; « lettre » est précis et naturel.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: les fils du roi
  rationale: La formulation conserve le lien familial et dynastique explicite du texte hébreu.
- source_word: וַיִּשְׁחֲטוּ
  choice: égorgèrent
  rationale: Le verbe שׁחט désigne typiquement l’abattage par égorgement; ce choix restitue la violence concrète de l’action sans l’atténuer.
- source_word: שִׁבְעִים אִישׁ
  choice: les soixante-dix hommes
  rationale: אִישׁ compte ici des individus masculins et renvoie aux fils du roi déjà mentionnés.
- source_word: רָאשֵׁיהֶם
  choice: leurs têtes
  rationale: La traduction littérale est claire dans ce contexte et n’appelle aucun euphémisme.
- source_word: בַּדּוּדִים
  choice: dans des récipients
  rationale: דּוּד désigne un contenant, mais sa forme précise est incertaine ici; le terme générique français préserve cette indétermination.
- source_word: אֵלָיו
  choice: les lui envoyèrent
  rationale: Le pronom indirect reproduit l’hébreu et renvoie naturellement à Jéhu dans le contexte immédiat.
- source_word: יִזְרְעֶאלָה
  choice: à Jizréel
  rationale: Le hé directionnel indique un mouvement vers Jizréel; « à Jizréel » exprime naturellement cette destination en français.
