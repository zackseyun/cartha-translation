lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: régna vingt-huit ans
  rationale: La tournure hébraïque, littéralement « les jours pendant lesquels il régna », exprime idiomatiquement la durée du règne. Le français naturel l’intègre directement au verbe avec le complément de durée.
- source_word: יֵהוּא
  choice: Jéhu
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: מָלַךְ
  choice: régna
  rationale: « Régner » rend précisément le verbe royal מלך dans cette formule récapitulative.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec מלך, la préposition עַל désigne le peuple ou le royaume sur lequel s’exerce la royauté.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: vingt-huit ans
  rationale: Rendu direct et idiomatique de la durée indiquée.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: En français, « à » est la préposition normale devant un nom de ville et indique ici le siège du règne.
