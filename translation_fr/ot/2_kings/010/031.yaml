source:
  edition: WLC
  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: fr
  text: Mais Jéhu ne veilla pas à suivre la loi de Yahvé[a], le Dieu d’Israël, de tout son cœur. Il ne se détourna pas des péchés de Jéroboam[b], par lesquels Jéroboam avait fait pécher Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne prit pas soin de marcher selon la loi de Yahvé ». Le verbe hébreu souligne l’observance attentive.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des pratiques cultuelles instaurées par Jéroboam, auxquelles les livres des Rois font régulièrement référence.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: veilla à suivre
  rationale: La construction exprime le soin attentif apporté à une conduite. « Veiller à suivre » rend cette nuance en français naturel, tandis que la négation marque le défaut d’obéissance vigilante.
- source_word: תּוֹרַת
  choice: la loi
  rationale: Dans ce contexte d’obéissance à l’alliance, « loi » convient mieux que le sens plus général d’« instruction ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: בְּכָל לְבָבוֹ
  choice: de tout son cœur
  rationale: Expression française idiomatique qui conserve l’idée hébraïque d’un engagement intérieur entier.
- source_word: לֹא סָר מֵעַל
  choice: ne se détourna pas de
  rationale: Rend directement l’idée de ne pas abandonner une conduite religieuse fautive.
- source_word: חַטֹּאות
  choice: péchés
  rationale: Reproduit simplement le pluriel hébreu et la formule récurrente des Rois à propos de Jéroboam.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: par lesquels celui-ci avait fait pécher Israël
  rationale: Le pluriel « lesquels » rattache la relative aux péchés; « celui-ci » désambiguïse naturellement Jéroboam comme sujet du causatif, et le plus-que-parfait situe son action antérieure à celle de Jéhu.
theological_decisions:
- issue: Évaluation de la fidélité de Jéhu à l’alliance
  choice: Le texte oppose implicitement ses réformes antérieures à son manque d’obéissance entière envers Yahvé.
  alternative: Limiter le reproche à une réforme politique inachevée.
  rationale: Les expressions « de tout son cœur » et « ne se détourna pas des péchés » portent une appréciation religieuse et morale, sans nier les actes positifs de Jéhu rapportés dans le contexte.
- issue: Référent de celui qui fit pécher Israël
  choice: Jéroboam
  alternative: Jéhu
  rationale: La formule historiographique des Rois attribue régulièrement à Jéroboam le fait d’avoir fait pécher Israël. « Celui-ci » clarifie le référent sans ajouter d’interprétation doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. « Suivre la loi » évite la raideur de « marcher dans la loi », tandis que la note conserve l’image hébraïque. Les noms propres suivent les formes françaises usuelles : Jéhu, Jéroboam et Yahvé.'
