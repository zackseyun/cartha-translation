source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יֵהוּא֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֨אוּ֙ כָּל עֹבְדֵ֣י הַ/בַּ֔עַל וְ/לֹֽא נִשְׁאַ֥ר אִ֖ישׁ אֲשֶׁ֣ר לֹֽא בָ֑א וַ/יָּבֹ֨אוּ֙ בֵּ֣ית הַ/בַּ֔עַל וַ/יִּמָּלֵ֥א בֵית הַ/בַּ֖עַל פֶּ֥ה לָ/פֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: fr
  text: Jéhu fit transmettre un appel dans tout Israël. Tous les adorateurs de Baal vinrent ; il ne resta pas un seul homme qui ne soit venu. Ils entrèrent dans le temple de Baal, qui fut rempli d’un bout à l’autre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « bouche à bouche », expression indiquant que le temple était entièrement rempli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: Jéhu fit transmettre un appel dans tout Israël
  rationale: Le verbe signifie littéralement « envoyer », sans complément exprimé. En français, « fit transmettre un appel » rend naturellement l’envoi implicite d’une convocation à travers tout le territoire, sans présenter comme explicite dans l’hébreu un objet matériel précis.
- source_word: כָּל עֹבְדֵי הַבַּעַל
  choice: tous les adorateurs de Baal
  rationale: Dans ce contexte cultuel, le participe de עבד désigne ceux qui rendent un culte à Baal ; « adorateurs » évite le sens domestique que pourrait suggérer « serviteurs ».
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: il ne resta pas un seul homme qui ne soit venu
  rationale: Cette formulation conserve l’homme singulier אִישׁ et la tournure négative emphatique du texte, tout en restant naturelle en français.
- source_word: בֵּית הַבַּעַל
  choice: le temple de Baal
  rationale: Littéralement « la maison de Baal », l’expression désigne ici sans ambiguïté son sanctuaire. « Temple » communique ce sens cultuel immédiatement en français moderne.
- source_word: וַיִּמָּלֵא בֵית הַבַּעַל
  choice: le temple de Baal, qui fut rempli
  rationale: Le niphal de מלא exprime ici que l’édifice se remplit ou fut rempli ; la construction relative évite une répétition lourde tout en gardant le temple comme sujet.
- source_word: פֶּה לָפֶה
  choice: d’un bout à l’autre
  rationale: L’expression signifie littéralement « bouche à bouche » et fonctionne comme un idiome indiquant que tout l’espace était rempli. « D’un bout à l’autre » en restitue clairement le sens.
theological_decisions:
- issue: Langage masculin représentatif dans אִישׁ
  choice: il ne resta pas un seul homme qui ne soit venu
  alternative: il ne resta personne qui ne soit venu
  rationale: Le texte emploie explicitement le singulier masculin אִישׁ. Le conserver reflète la forme et l’insistance de l’hébreu sans introduire d’enjeu doctrinal étranger au passage.
- issue: Désignation du sanctuaire de Baal
  choice: temple de Baal
  alternative: maison de Baal
  rationale: « Temple » explicite la fonction cultuelle du bâtiment sans modifier la portée théologique du récit ; « maison de Baal » serait plus formel mais moins naturel et potentiellement moins clair en français courant.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’emphase totale du verset, tandis que « temple » et « adorateurs » rendent explicitement le contexte cultuel.
