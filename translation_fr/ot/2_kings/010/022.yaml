  text: וַ/יֹּ֗אמֶר לַֽ/אֲשֶׁר֙ עַל הַ/מֶּלְתָּחָ֔ה הוֹצֵ֣א לְב֔וּשׁ לְ/כֹ֖ל עֹבְדֵ֣י הַ/בָּ֑עַל וַ/יֹּצֵ֥א לָ/הֶ֖ם הַ/מַּלְבּֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: fr
  text: 'Il dit à celui qui était responsable du vestiaire : « Sors des vêtements[a] pour tous les adorateurs[b] de Baal. » Il sortit donc les vêtements pour eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « habits », dans les deux occurrences du verset.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « serviteurs de Baal », c’est-à-dire ceux qui se consacraient à son service cultuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: le vestiaire
  rationale: Le nom désigne ici un lieu ou un service où sont conservés des vêtements. « Vestiaire » est naturel en français moderne et évite les connotations ecclésiastiques particulières de « sacristie ».
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: à celui qui était responsable du vestiaire
  rationale: La tournure hébraïque signifie littéralement « à celui qui était sur le vestiaire » et indique la personne qui en avait la charge.
- source_word: הוֹצֵא
  choice: Sors
  rationale: L’impératif causatif de יצא demande de faire sortir les vêtements du lieu où ils sont gardés. « Sors » est direct et idiomatique dans ce contexte.
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: des vêtements / les vêtements
  rationale: Ces noms désignent collectivement ce qui est porté. « Vêtements » rend clairement ce sens collectif dans un français actuel.
- source_word: עֹבְדֵי הַבָּעַל
  choice: les adorateurs de Baal
  rationale: Le participe de עבד signifie littéralement ceux qui servent Baal, mais, dans ce contexte cultuel, il désigne ceux qui lui rendent un culte. « Adorateurs » communique naturellement cette fonction religieuse.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: Il sortit donc les vêtements pour eux
  rationale: Le nom singulier hébreu a une valeur collective. Le passé simple convient au registre narratif biblique français, tandis que « donc » exprime naturellement l’enchaînement avec l’ordre précédent.
theological_decisions:
- issue: Sens cultuel de עֹבְדֵי הַבָּעַל
  choice: adorateurs de Baal
  alternative: serviteurs de Baal
  rationale: « Adorateurs » explicite le service religieux visé sans suggérer seulement une domesticité ou une fonction administrative. La traduction plus littérale est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif soutenu mais courant dans la lecture biblique. « Vestiaire » est compris comme le local ou le service chargé des vêtements, et non comme une sacristie au sens chrétien ultérieur.
