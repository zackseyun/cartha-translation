  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֔ה לְ/קַצּ֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יַּכֵּ֥/ם חֲזָאֵ֖ל בְּ/כָל גְּב֥וּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: fr
  text: En ce temps-là, Yahweh commença à réduire Israël[a], et Hazaël les frappa dans tout le territoire d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à retrancher des portions d’Israël ». Le verbe hébreu évoque le commencement d’une diminution, probablement par la perte successive de territoires.
    reason: lexical_alternative
  - marker: b
    text: Ou « le long de toute la frontière d’Israël ». Le terme hébreu peut désigner aussi bien la frontière que le territoire délimité.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ce temps-là
  rationale: Cette tournure française naturelle rend l’expression temporelle hébraïque au pluriel sans lourdeur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin exprimé directement dans le texte hébreu.
- source_word: הֵחֵל
  choice: commença
  rationale: Le verbe marque le commencement de l’action.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: à retrancher des portions d’Israël
  rationale: La formulation conserve l’image d’une réduction par retranchements successifs, probablement territoriaux, sans suggérer l’anéantissement total d’Israël.
- source_word: וַיַּכֵּם
  choice: les frappa
  rationale: Le verbe נכה désigne ici une action militaire violente; le pronom pluriel renvoie aux Israélites.
- source_word: חֲזָאֵל
  choice: Hazaël
  rationale: Translittération française traditionnelle du nom propre.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: dans tout le territoire d’Israël
  rationale: גְּבוּל peut désigner une frontière ou l’étendue territoriale délimitée; le contexte militaire favorise ici le territoire dans son ensemble.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même; sa translittération préserve sa valeur de nom propre plutôt que de lui substituer un titre.
- issue: Portée de la réduction d’Israël
  choice: retrancher des portions d’Israël
  alternative: réduire Israël
  rationale: Le choix exprime une diminution progressive, vraisemblablement territoriale, tout en évitant d’affirmer que le peuple entier fut alors détruit.
translation_notes:
  register: Français international moderne, sobre et narratif. « Retrancher des portions » conserve l’image concrète de l’hébreu tout en restant intelligible; « frappa » maintient la force du verbe militaire sans préciser au-delà du texte s’il s’agit d’attaques ou de défaites.
