  source_fidelity: Le déroulement narratif, les impératifs, l’exécution « au fil de l’épée » et les sujets (« les gardes et les officiers ») sont bien rendus. Toutefois, « enceinte intérieure » choisit une interprétation architecturale précise de עִיר בֵּית־הַבַּעַל, dont le sens exact demeure discuté. Le texte principal devrait conserver davantage la formulation littérale, l’explication restant en note.
