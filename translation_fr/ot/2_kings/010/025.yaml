base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: fr
  text: 'Quand il eut fini d’offrir l’holocauste, Jéhu dit aux gardes et aux officiers : « Entrez, frappez-les ! Que personne ne sorte ! » Ils les passèrent au fil de l’épée. Puis les gardes et les officiers les jetèrent dehors et allèrent jusqu’à la cité du temple de Baal[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à la ville [ou la citadelle] de la maison de Baal ». L’expression peut désigner une enceinte fortifiée ou une zone sacrée intérieure du complexe du temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: Quand il eut fini d’offrir l’holocauste
  rationale: La construction temporelle indique que l’ordre de Jéhu suit l’achèvement du sacrifice. « Offrir l’holocauste » rend naturellement l’expression sacrificielle עשה + עולה.
- source_word: לָרָצִים
  choice: aux gardes
  rationale: רָצִים signifie littéralement « coureurs », mais désigne ici des membres de la garde royale. « Gardes » communique clairement leur fonction en français moderne.
- source_word: לַשָּׁלִשִׁים
  choice: aux officiers
  rationale: שָׁלִישׁ désigne un officier militaire, peut-être à l’origine lié aux chars. Le terme général « officiers » évite une précision de grade incertaine.
- source_word: בֹּאוּ הַכּוּם
  choice: Entrez, frappez-les !
  rationale: L’impératif בֹּאוּ commande ici de pénétrer dans le lieu, et נכה exprime une frappe violente dont le caractère mortel ressort du contexte immédiat.
- source_word: אִישׁ אַל יֵצֵא
  choice: Que personne ne sorte !
  rationale: Le singulier אִישׁ a une valeur distributive. « Personne » est l’équivalent français naturel sans modifier la portée de l’interdiction.
- source_word: לְפִי חָרֶב
  choice: au fil de l’épée
  rationale: Cette locution française traditionnelle et intelligible correspond à l’image hébraïque de la « bouche de l’épée » et indique une mise à mort par l’épée.
- source_word: וַיַּשְׁלִכוּ
  choice: les jetèrent dehors
  rationale: Le verbe signifie « jeter ». L’objet est sous-entendu en hébreu et repris par « les » en français; « dehors » exprime le mouvement suggéré par la progression du récit, sans préciser explicitement qu’il s’agit des corps.
- source_word: עַד עִיר בֵּית־הַבָּעַל
  choice: jusqu’à l’enceinte intérieure du temple de Baal
  rationale: עִיר signifie normalement « ville » ou « cité », mais l’expression paraît désigner ici une zone délimitée ou intérieure du complexe cultuel. « Enceinte intérieure » convient au mouvement dans le temple tout en signalant l’incertitude dans une note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Au fil de l’épée » conserve la vigueur de l’idiome hébreu. Le marqueur de note est placé après l’expression réellement concernée, plutôt qu’après « l’holocauste » comme dans la couche anglaise fournie.
