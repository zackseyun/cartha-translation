  text: וַ/יֹּ֨אמֶר֙ תִּפְשׂ֣וּ/ם חַיִּ֔ים וַֽ/יִּתְפְּשׂ֖וּ/ם חַיִּ֑ים וַֽ/יִּשְׁחָט֞וּ/ם אֶל בּ֣וֹר בֵּֽית עֵ֗קֶד אַרְבָּעִ֤ים וּ/שְׁנַ֨יִם֙ אִ֔ישׁ וְ/לֹֽא הִשְׁאִ֥יר אִ֖ישׁ מֵ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: fr
  text: 'Il dit : « Saisissez-les vivants ! » Ils les saisirent donc vivants et égorgèrent quarante-deux hommes à la fosse[a] de Beth-Éqed[b]. Il ne laissa subsister aucun d’eux[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « près de la fosse » ou « dans la fosse ». La préposition hébraïque permet plusieurs interprétations spatiales dans ce contexte. Le mot rendu par « fosse » peut également désigner une citerne.
    reason: lexical_alternative
  - marker: b
    text: Beth-Éqed est un nom de lieu. En hébreu, ce nom peut évoquer une « maison où l’on lie » ou un « lieu de rassemblement », mais il est employé ici comme nom propre.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « il ne laissa pas un homme d’entre eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: Saisissez-les
  rationale: Le verbe תפשׂ signifie ici appréhender ou capturer. « Saisissez-les » rend naturellement l’ordre bref et direct.
- source_word: חַיִּים
  choice: vivants
  rationale: 'L’adjectif est employé de façon adverbiale après l’impératif puis après le verbe narratif : ils doivent être pris en vie, avant d’être mis à mort.'
- source_word: וַיִּשְׁחָטוּם
  choice: ils les égorgèrent
  rationale: שׁחט désigne une mise à mort par égorgement ou abattage et est plus précis qu’un simple « tuer » ; ce choix conserve la violence du récit sans l’atténuer.
- source_word: אֶל־בּוֹר
  choice: près de la fosse
  rationale: אֶל peut exprimer une direction ou, selon le contexte, une relation spatiale. « Près de » convient au lieu de l’exécution, tandis que la note conserve les autres possibilités. בור est rendu par « fosse », terme naturel ici, sans exclure le sens possible de citerne.
- source_word: בֵּית עֵקֶד
  choice: Beth-Éqed
  rationale: Le groupe fonctionne comme un nom de lieu. La translittération évite de transformer en désignation descriptive une étymologie qui demeure secondaire dans le passage.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: quarante-deux hommes
  rationale: La construction numérique avec אִישׁ compte ici des hommes ; cette traduction est précise et idiomatique.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: Il ne laissa subsister aucun d’eux
  rationale: Le verbe au singulier a pour sujet implicite Jéhu. La formulation française exprime naturellement qu’aucun membre du groupe ne fut épargné, tout en conservant l’exhaustivité de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’impératif bref garde la vigueur de l’ordre, « égorgèrent » préserve la force du verbe hébreu, et la dernière proposition reste naturelle tout en soulignant qu’il n’y eut aucun survivant.
