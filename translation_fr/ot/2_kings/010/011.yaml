  text: וַ/יַּ֣ךְ יֵה֗וּא אֵ֣ת כָּל הַ/נִּשְׁאָרִ֤ים לְ/בֵית אַחְאָב֙ בְּ/יִזְרְעֶ֔אל וְ/כָל גְּדֹלָ֖י/ו וּ/מְיֻדָּעָ֣י/ו וְ/כֹהֲנָ֑י/ו עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: fr
  text: Jéhu abattit tous ceux qui restaient de la maison d’Achab à Jizréel, ainsi que tous ses dignitaires[a], ses proches[b] et ses prêtres, jusqu’à ne lui laisser aucun survivant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses grands » ou « ses notables ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ses connaissances », « ses familiers » ou « ses proches collaborateurs ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « jusqu’à ne lui laisser aucun survivant » ; « lui » peut renvoyer à Achab ou à la maison d’Achab.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: abattit
  rationale: Dans ce contexte narratif, נכה désigne une violence mortelle. « Abattit » exprime clairement la mise à mort sans l’archaïsme ni l’ambiguïté possible de « frappa ».
- source_word: הַנִּשְׁאָרִים לְבֵית אַחְאָב
  choice: ceux qui restaient de la maison d’Achab
  rationale: La tournure conserve à la fois l’idée du reste encore vivant et l’appartenance à la dynastie d’Achab.
- source_word: בְּיִזְרְעֶאל
  choice: à Jizréel
  rationale: « À » est la préposition française naturelle pour situer l’action dans une ville.
- source_word: גְּדֹלָיו
  choice: ses dignitaires
  rationale: Le terme désigne ici les personnages importants liés à la maison royale. « Dignitaires » rend naturellement leur rang social ou politique.
- source_word: מְיֻדָּעָיו
  choice: ses proches
  rationale: Le participe issu de ידע désigne les personnes connues de lui, vraisemblablement ses familiers ou proches collaborateurs dans ce contexte. « Proches » reste concis sans préciser indûment la nature du lien.
- source_word: כֹהֲנָיו
  choice: ses prêtres
  rationale: Il s’agit du sens direct du terme hébreu, sans qu’il soit nécessaire de préciser davantage leur fonction institutionnelle.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: jusqu’à ne lui laisser aucun survivant
  rationale: Cette formulation française conserve la construction résultative de l’hébreu, le pronom singulier et l’idée d’une élimination totale.
theological_decisions:
- issue: Référent du pronom לוֹ dans la proposition finale
  choice: Conserver le pronom sous la forme « lui »
  alternative: Expliciter « à Achab » ou employer « à cette maison »
  rationale: Le référent peut être Achab ou, collectivement, sa maison. Le maintien de « lui » préserve la formulation resserrée et l’ambiguïté réelle de l’hébreu sans imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et direct. Le vocabulaire reste accessible tout en conservant le langage dynastique (« maison d’Achab ») et la violence explicite du récit. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
