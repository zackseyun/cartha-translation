- from: 'Alors Yahweh dit à Jéhu : « Parce que tu as bien agi en faisant ce qui est droit à mes yeux, et que tu as fait à la maison d’Achab tout ce que j’avais à cœur de faire, tes fils siégeront sur le trône d’Israël jusqu’à la quatrième génération[a]. »'
  to: 'Alors Yahweh dit à Jéhu : « Parce que tu as bien agi en faisant ce qui est droit à mes yeux, et que tu as agi envers la maison d’Achab conformément à tout ce que j’avais à cœur de faire, tes fils occuperont le trône d’Israël jusqu’à la quatrième génération[a]. »'
  rationale: La révision améliore l’idiomaticité française de la clause concernant la maison d’Achab et de l’expression royale, sans étendre l’approbation divine au-delà de l’action mentionnée. Elle corrige aussi la présentation de l’idiome dans la note, tout en conservant son sens dynastique et son ancrage.
