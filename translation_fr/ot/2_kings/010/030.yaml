  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Jéhu : « Parce que tu as bien agi en faisant ce qui est droit à mes yeux, et que tu as agi envers la maison d’Achab conformément à tout ce que j’avais à cœur de faire, tes fils occuperont le trône d’Israël jusqu’à la quatrième génération[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « fils de quatrièmes [générations] » ; idiome désignant une succession dynastique sur quatre générations.'
    reason: L’idiome hébreu בְּנֵי רְבִעִים est explicité sans lui attribuer une formulation littérale française imprécise.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et le distingue d’un titre comme « le Seigneur ».
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: Rend directement et naturellement la relation causale qui introduit la déclaration divine.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: tu as bien agi en faisant ce qui est droit à mes yeux
  rationale: Conserve à la fois l’éloge exprimé par le hifil de יטב et la formule évaluative hébraïque « droit à mes yeux ».
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: tout ce que j’avais à cœur de faire
  rationale: Rend לֵבָב comme le dessein ou la volonté intérieure de Dieu, tout en gardant en français une métaphore naturelle liée au cœur.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: tu as fait à la maison d’Achab
  rationale: Préserve la formulation sobre de l’hébreu sans expliciter davantage la nature du jugement exécuté.
- source_word: בְּנֵי רְבִעִים
  choice: tes fils … jusqu’à la quatrième génération
  rationale: Explicite l’idiome dynastique tout en conservant le terme concret « fils ».
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: siégeront sur le trône d’Israël
  rationale: Conserve l’image royale du texte source; le datif לְךָ est naturellement porté par « tes fils » et la promesse dynastique.
theological_decisions:
- issue: Portée de l’approbation divine des actes de Jéhu
  choice: Présenter comme approuvée son exécution du dessein divin envers la maison d’Achab, sans étendre cette approbation à l’ensemble de sa conduite ou de son règne.
  alternative: Atténuer l’éloge pour éviter la tension morale, ou en faire une approbation générale de Jéhu.
  rationale: Le verset loue explicitement ce que Jéhu a fait à la maison d’Achab; il ne prononce pas ici de jugement global sur tout son règne. La traduction conserve cette portée précise et la tension du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient au discours direct et « siégeront » préserve l’image d’intronisation. La tournure « j’avais à cœur de faire » explicite légèrement l’intention implicite sans élargir l’approbation divine.
