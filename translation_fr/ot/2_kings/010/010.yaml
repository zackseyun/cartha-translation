  rationale: La révision explicite Yahweh comme sujet de la parole prononcée, conformément à la répétition du nom divin dans le texte hébreu, et remplace « avait annoncé » par « a dit » afin de préserver le parallélisme verbal avec « a accompli ». Les notes et leurs ancres restent correctement associées aux expressions qu’elles expliquent.
