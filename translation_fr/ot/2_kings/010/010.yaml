  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: fr
  text: Sachez donc que pas une seule parole de Yahweh, que Yahweh a prononcée contre la maison d’Achab, ne tombera à terre[a]. Yahweh a accompli ce qu’il a dit par l’intermédiaire de son serviteur Élie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne tombera pas à terre », expression signifiant qu’elle ne restera pas sans effet ou sans accomplissement.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main de son serviteur Élie » ; autre traduction possible : « par son serviteur Élie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: Sachez donc
  rationale: L’impératif pluriel appelle les auditeurs à reconnaître un fait, tandis que « donc » restitue naturellement la valeur inférentielle de la particule אֵפוֹא.
- source_word: לֹא יִפֹּל מִדְּבַר יְהוָה אַרְצָה
  choice: pas une seule parole de Yahweh […] ne tombera à terre
  rationale: La tournure partitive signifie qu’aucun élément de la parole divine ne restera sans accomplissement. L’image hébraïque de la parole qui « tombe à terre » est conservée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: עַל בֵּית אַחְאָב
  choice: contre la maison d’Achab
  rationale: Dans ce contexte de jugement, עַל a une valeur hostile, rendue par « contre ». « Maison » conserve l’expression biblique désignant la famille ou la dynastie d’Achab.
- source_word: וַיהוָה עָשָׂה
  choice: Yahweh a accompli
  rationale: Le verbe עשה signifie littéralement « faire » ; ici, « accomplir » exprime naturellement que Yahweh a mené à réalisation la parole prophétique annoncée.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: par l’intermédiaire de son serviteur Élie
  rationale: L’expression בְּיַד marque ici l’agent ou le médiateur de la parole prophétique. La formulation française évite un calque obscur tout en préservant ce rapport d’intermédiaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Certitude de l’accomplissement prophétique
  choice: conserver l’image « ne tombera à terre »
  alternative: « ne restera sans effet » ou « ne manquera de s’accomplir »
  rationale: L’image concrète du texte hébreu exprime la certitude qu’aucune partie de la parole de jugement ne faillira, sans réduire la formulation à sa seule explication.
- issue: Médiation prophétique d’Élie
  choice: « par l’intermédiaire de son serviteur Élie »
  alternative: « par la main de son serviteur Élie »
  rationale: La traduction communique l’agence prophétique exprimée par בְּיַד sans suggérer qu’Élie serait l’auteur ou l’exécutant direct du jugement.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel « Sachez » convient à une déclaration publique. L’idiome « tomber à terre » conserve la texture de l’hébreu, tandis que la note en explicite le sens. « Maison d’Achab » maintient l’expression dynastique biblique.
