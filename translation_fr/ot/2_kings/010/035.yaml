  text: וַ/יִּשְׁכַּ֤ב יֵהוּא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יְהוֹאָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: fr
  text: Jéhu se coucha avec ses ancêtres, et on l’enterra à Samarie. Son fils Joachaz devint roi à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Le verbe שׁכב signifie littéralement « se coucher » et sert ici de formule conventionnelle annonçant la mort d’un roi. « Se coucha » conserve l’image hébraïque, dont le complément explicite le sens funéraire.
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: Dans cette formule royale, אָבוֹת désigne les générations antérieures. « Ancêtres » est naturel en français moderne et évite que « pères » soit compris comme visant plusieurs pères immédiats.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: on l’enterra
  rationale: Le verbe hébreu est actif, à la troisième personne du pluriel, avec des agents non précisés. Le pronom indéfini « on » restitue naturellement cette indétermination en français.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition בְּ est locative. Devant un nom de ville, le français emploie naturellement « à ».
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans cette notice de succession, מלך marque l’accession à la royauté plutôt que la durée entière du règne.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: L’expression indique que Joachaz succède à Jéhu dans sa fonction royale.
- source_word: יֵהוּא
  choice: Jéhu
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: יְהוֹאָחָז
  choice: Joachaz
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
theological_decisions:
- issue: Portée de la formule funéraire « se coucher avec ses ancêtres »
  choice: Conserver l’idiome sans l’expliquer dans le corps du verset
  alternative: Traduire directement par « mourut »
  rationale: La formule hébraïque annonce bien la mort, mais son image ancestrale appartient au style des notices royales. La conserver préserve cette dimension sans lui attribuer une doctrine précise sur l’au-delà.
translation_notes:
  register: 'Français international moderne, digne et lisible. La syntaxe reste proche de la notice royale hébraïque tout en employant les usages naturels du français : « à Samarie », « on l’enterra » et « ses ancêtres ».'
