  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: fr
  text: Puis ils sortirent les stèles du temple de Baal et les brûlèrent[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pierres dressées » ou « les piliers sacrés ». Le terme hébreu désigne des pierres dressées liées au culte.
    reason: lexical_alternative
  - marker: b
    text: 'L''hébreu porte littéralement un suffixe objet singulier : « la brûlèrent », bien que le nom précédent, « stèles », soit au pluriel. Le sens paraît collectif.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: Puis ils sortirent
  rationale: Le hiphil de יצא signifie ici « faire sortir, sortir ». « Puis » marque naturellement la progression du récit portée par le waw consécutif.
- source_word: מַצְּבוֹת
  choice: les stèles
  rationale: מַצֵּבָה désigne une pierre dressée, souvent cultuelle. « Stèles » est précis, naturel en français et évite le sens architectural que pourrait suggérer « piliers ».
- source_word: בֵּית הַבַּעַל
  choice: du temple de Baal
  rationale: Dans ce contexte cultuel, בַּיִת (« maison ») désigne le sanctuaire de Baal. « Temple de Baal » est plus idiomatique et immédiatement compréhensible en français moderne.
- source_word: וַיִּשְׂרְפוּהָ
  choice: et les brûlèrent
  rationale: Le suffixe objet hébreu est au féminin singulier, malgré l'antécédent pluriel מַצְּבוֹת. Le pluriel français rend clairement le référent collectif sans créer l'impression d'un autre objet.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Temple » privilégie l'intelligibilité contextuelle; « stèles » conserve la précision cultuelle. Le passé simple convient au registre narratif biblique dignifié sans être archaïque.
