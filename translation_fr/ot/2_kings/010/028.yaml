  text: וַ/יַּשְׁמֵ֥ד יֵה֛וּא אֶת הַ/בַּ֖עַל מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: fr
  text: Ainsi, Jéhu fit disparaître Baal du milieu d’Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « extermina » ou « élimina ». Le verbe hébreu exprime le fait de causer la destruction ou la disparition.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le Baal » en hébreu ; en français, le nom de cette divinité s’emploie normalement sans article.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: élimina
  rationale: Le hifil de שׁמד exprime le fait de causer la destruction ou la disparition. « Élimina » rend naturellement l’idée de suppression dans ce contexte, sans imposer une description plus précise que l’hébreu.
- source_word: יֵהוּא
  choice: Jéhu
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Bien que l’hébreu porte l’article (« le Baal »), le français emploie normalement le nom de cette divinité sans article. Le texte nomme Baal sans expliciter « son culte ».
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La préposition מִן marque ici l’éloignement ou la suppression hors d’un domaine; « éliminer Baal d’Israël » est direct et idiomatique.
- source_word: וַ
  choice: Ainsi
  rationale: Le waw narratif fait progresser le récit et, dans le contexte, présente cette action comme l’aboutissement de ce qui précède.
theological_decisions:
- issue: Référent de « Baal »
  choice: Conserver « Baal » comme objet direct, en laissant le contexte indiquer que la suppression concerne aussi son culte.
  alternative: « le culte de Baal »
  rationale: L’hébreu dit littéralement « le Baal ». Développer en « culte de Baal » serait explicatif et réduirait la manière personnifiée dont le texte formule l’éradication.
translation_notes:
  register: Français moderne, sobre et digne. « Ainsi » marque l’aboutissement narratif; « élimina » reste compréhensible et conserve la force du verbe causatif hébreu.
