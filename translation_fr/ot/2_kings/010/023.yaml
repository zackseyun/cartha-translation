  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: fr
  text: 'Puis Jéhu et Jonadab, fils de Rékab, entrèrent dans la maison de Baal[a]. Jéhu dit aux adorateurs de Baal : « Cherchez et vérifiez qu’il n’y ait ici parmi vous aucun serviteur de Yahvé, mais seulement des adorateurs de Baal. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le temple de Baal ». Littéralement : « la maison de Baal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entrèrent
  rationale: Le verbe בוא peut signifier venir, aller ou entrer. Avec la destination « dans la maison de Baal » et un sujet composé, « entrèrent » exprime naturellement le mouvement vers l’intérieur.
- source_word: בֵּית הַבָּעַל
  choice: la maison de Baal
  rationale: Cette traduction conserve la formulation hébraïque littérale tout en laissant le contexte indiquer qu’il s’agit d’un sanctuaire.
- source_word: עֹבְדֵי הַבַּעַל
  choice: adorateurs de Baal
  rationale: Dans ce contexte cultuel, le participe de עבד désigne les personnes vouées au culte de Baal. « Adorateurs » rend ce sens plus clairement que « serviteurs » en français courant.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: Cherchez bien et assurez-vous
  rationale: Les deux impératifs demandent une inspection suivie d’une vérification. Cette formulation française naturelle préserve les deux mouvements sans lourdeur littérale.
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: qu’il n’y ait ici parmi vous
  rationale: פֶּן introduit une précaution visant à exclure une éventualité. Après « assurez-vous », le subjonctif négatif rend naturellement cette valeur.
- source_word: מֵעַבְדֵי יְהוָה
  choice: aucun serviteur de l’Éternel
  rationale: Le partitif pluriel hébreu signifie qu’aucune personne appartenant aux serviteurs de YHWH ne doit être présente. Le singulier après « aucun » est idiomatique en français.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Le nom divin est rendu selon la convention française traditionnelle de substitution employée par le projet, ici dans un contraste d’allégeance avec Baal.
- source_word: כִּי אִם ... לְבַדָּם
  choice: mais seulement
  rationale: 'L’ensemble forme une restriction exclusive : aucun serviteur de YHWH, mais uniquement les adorateurs de Baal.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: l’Éternel
  alternative: Yahvé
  rationale: « L’Éternel » suit la convention française de substitution du projet et distingue clairement le Dieu d’Israël de Baal, sans introduire une interprétation doctrinale supplémentaire.
- issue: Sens cultuel de עֹבְדֵי הַבַּעַל
  choice: adorateurs de Baal
  alternative: serviteurs de Baal
  rationale: Dans le sanctuaire de Baal et lors d’un rassemblement cultuel, « adorateurs » exprime le référent religieux, tandis que « serviteurs » pourrait évoquer à tort du personnel domestique. La différence lexicale avec « serviteur de l’Éternel » est contextuellement justifiée.
translation_notes:
  register: Français international moderne, digne et accessible. « Jéhu dit » explicite le sujet singulier du verbe hébreu afin d’éviter qu’après le sujet composé le pronom français « il » soit ambigu. « Cherchez bien et assurez-vous » rend idiomatiquement les deux impératifs.
