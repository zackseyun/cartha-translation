  register: 'Français international moderne, narratif et digne. Les noms suivent des formes françaises usuelles : Jéhu, Jonadab et Rékab. La syntaxe est clarifiée là où l’enchaînement des pronoms hébreux deviendrait ambigu en français, sans ajouter d’interprétation doctrinale.'
