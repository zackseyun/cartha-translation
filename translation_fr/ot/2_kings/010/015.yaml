  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֡ם וַ/יִּמְצָ֣א אֶת יְהוֹנָדָב֩ בֶּן רֵכָ֨ב לִ/קְרָאת֜/וֹ וַֽ/יְבָרְכֵ֗/הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/יֵ֧שׁ אֶת לְבָבְ/ךָ֣ יָשָׁ֗ר כַּ/אֲשֶׁ֤ר לְבָבִ/י֙ עִם לְבָבֶ֔/ךָ וַ/יֹּ֨אמֶר יְהוֹנָדָ֥ב יֵ֛שׁ וָ/יֵ֖שׁ תְּנָ֣/ה אֶת יָדֶ֑/ךָ וַ/יִּתֵּ֣ן יָד֔/וֹ וַ/יַּעֲלֵ֥/הוּ אֵלָ֖י/ו אֶל הַ/מֶּרְכָּבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: fr
  text: 'Il partit de là et trouva Jonadab, fils de Rékab, qui venait à sa rencontre. Il le salua[a] et lui dit : « Ton cœur est-il droit envers moi, comme mon cœur l’est envers toi ? »[b] Jonadab répondit : « Il l’est, oui, il l’est. »[c] Jéhu lui dit : « Donne-moi la main. » Jonadab lui donna la main, et Jéhu le fit monter auprès de lui dans le char.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le bénit ». Le verbe hébreu peut signifier « bénir », mais, dans cette scène de rencontre, il désigne probablement une salutation.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Ton cœur est-il droit, comme mon cœur est avec ton cœur ? » Cette expression peut évoquer une disposition intérieure commune, une loyauté réciproque ou un accord de vues.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Il l’est, et il l’est »; cette répétition renforce l’affirmation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Il partit de là
  rationale: La tournure exprime la poursuite du déplacement depuis le lieu précédent. « Partit de là » est naturel en français narratif et reste proche du sens.
- source_word: וַיִּמְצָא אֶת־יְהוֹנָדָב בֶּן־רֵכָב
  choice: trouva Jonadab, fils de Rékab
  rationale: מצא signifie normalement « trouver ». Ce choix conserve le lexème hébreu plutôt que de le réduire à « rencontra ».
- source_word: לִקְרָאתוֹ
  choice: qui venait à sa rencontre
  rationale: La construction indique un mouvement en vue d’une rencontre et montre que Jonadab s’approchait de Jéhu.
- source_word: וַיְבָרְכֵהוּ
  choice: Il le salua
  rationale: Bien que ברך puisse signifier « bénir », il désigne vraisemblablement ici une salutation lors d’une rencontre. Une note conserve l’autre possibilité.
- source_word: הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ
  choice: Ton cœur est-il droit envers moi, comme mon cœur l’est envers toi ?
  rationale: « Cœur » et « droit » préservent la métaphore et sa portée morale ou relationnelle. « Envers moi/toi » rend intelligible l’expression idiomatique avec עִם sans la réduire explicitement à une seule notion telle que la loyauté politique.
- source_word: יֵשׁ וָיֵשׁ
  choice: Il l’est, oui, il l’est
  rationale: La reprise française rend l’affirmation emphatique portée par la répétition hébraïque tout en restant naturelle.
- source_word: תְּנָה אֶת־יָדֶךָ
  choice: Donne-moi la main
  rationale: La formulation conserve l’image concrète de la main et convient à la réponse gestuelle qui suit, sans expliciter davantage sa possible valeur d’engagement.
- source_word: וַיִּתֵּן יָדוֹ
  choice: Jonadab lui donna la main
  rationale: La répétition française répond directement à l’ordre précédent. Le nom explicite le sujet afin d’éviter une ambiguïté pronominale peu naturelle en français.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה
  choice: Jéhu le fit monter auprès de lui dans le char
  rationale: Le causatif de עלה est rendu par « fit monter »; « auprès de lui » représente אֵלָיו et « dans le char » indique la destination.
