base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: fr
  text: 'Puis il dit : « Viens avec moi et vois mon zèle pour Yahweh[a]. » Et on le fit monter dans son char.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ma jalousie pour Yahweh ». Le nom hébreu peut exprimer le zèle ou la jalousie selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: Viens avec moi
  rationale: L’impératif de הלך fonctionne ici comme une invitation; « Viens avec moi » est naturel en français et exprime clairement l’accompagnement.
- source_word: וּרְאֵה
  choice: et vois
  rationale: L’impératif de ראה est conservé directement, sans ajouter l’idée plus interprétative de « constater » ou « être témoin ».
- source_word: בְּקִנְאָתִי
  choice: mon zèle
  rationale: קִנְאָה peut désigner le zèle ou la jalousie. Dans cette déclaration de dévouement revendiqué envers Yahweh, « zèle » convient au contexte tout en laissant l’autre nuance en note.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: Le ל marque ici l’objet ou la direction du zèle; le nom divin יהוה est translittéré « Yahweh ».
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: on le fit monter
  rationale: Le hiphil de רכב est causatif. Le sujet pluriel non précisé se rend naturellement par « on », tandis que « fit monter » exprime qu’il fut installé dans le véhicule.
- source_word: בְּרִכְבּוֹ
  choice: sur son char
  rationale: רֶכֶב désigne ici le char de Jéhu. En français, on dit naturellement « monter sur un char ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération « Yahweh » conserve le nom propre de l’alliance présent dans le texte hébreu.
- issue: Portée de קִנְאָה
  choice: zèle
  alternative: jalousie
  rationale: Le contexte met en avant l’ardeur revendiquée de Jéhu pour Yahweh, mais le terme hébreu garde une nuance possible de jalousie, signalée en note sans trancher davantage.
translation_notes:
  register: Français international moderne, direct et digne. La coordination simple des impératifs reflète le rythme hébreu; le sujet pluriel indéfini du dernier verbe est rendu par « on ».
