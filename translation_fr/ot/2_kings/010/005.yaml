base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: fr
  text: 'Alors le responsable du palais, le responsable de la ville, les anciens et les tuteurs[a] envoyèrent dire à Jéhu : « Nous sommes tes serviteurs et nous ferons tout ce que tu nous diras. Nous n’établirons personne comme roi. Fais ce qui est bon à tes yeux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui les élevaient » ou « ceux qui avaient leur garde ». Le terme hébreu désigne ici les personnes chargées de prendre soin des fils de la famille royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: le responsable du palais
  rationale: L’expression décrit le fonctionnaire chargé de la maison royale. « Palais » convient au contexte, tandis que « responsable » conserve la nature descriptive de la fonction sans imposer un titre administratif précis.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: le responsable de la ville
  rationale: L’hébreu décrit une charge sans donner nécessairement un titre officiel précis. Cette formulation reste claire sans préciser excessivement la fonction.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Traduction consacrée qui conserve le rôle social et politique de ces dirigeants communautaires.
- source_word: הָאֹמְנִים
  choice: les tuteurs
  rationale: Dans ce contexte, le terme désigne les personnes auxquelles les fils de la maison royale avaient été confiés. « Tuteurs » exprime clairement cette responsabilité, tout en laissant une note signaler la nuance éducative ou nourricière du terme.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Il s’agit ici d’une déclaration politique de soumission et non d’une insistance sur le statut d’esclave.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: nous ferons tout ce que tu nous diras
  rationale: Formulation française naturelle qui conserve la promesse complète d’obéissance.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: Nous n’établirons personne comme roi
  rationale: Le causatif hébreu signifie faire régner ou installer quelqu’un comme roi. « Établir comme roi » en conserve la force sans introduire l’idée plus particulière d’un couronnement.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: ce qui est bon à tes yeux
  rationale: Cette formulation conserve l’image hébraïque tout en restant immédiatement compréhensible en français moderne.
- source_word: עֲשֵׂה
  choice: Fais
  rationale: L’impératif bref reproduit la concision et la force de l’hébreu.
