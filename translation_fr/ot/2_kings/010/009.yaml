base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: fr
  text: 'Le matin venu, il sortit, se tint debout et dit à tout le peuple : « Vous êtes innocents[a]. Voyez : moi, j’ai conspiré contre mon maître et je l’ai tué. Mais qui a frappé tous ces gens-là ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « justes » ou « dans votre droit ». Le terme hébreu peut désigner des personnes justes ou déclarées exemptes de faute ; ici, le contexte public et judiciaire favorise « innocents ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Le matin venu
  rationale: Rend naturellement la formule narrative hébraïque sans alourdir le français par un calque de וַיְהִי.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: il sortit, se tint debout
  rationale: Conserve la succession des actions et la posture publique de Jéhu avant sa déclaration.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Expression française courante et digne pour désigner l’ensemble des personnes présentes auxquelles il s’adresse.
- source_word: צַדִּקִים אַתֶּם
  choice: Vous êtes innocents
  rationale: Dans cette mise en scène publique et quasi judiciaire, צַדִּיקִים indique vraisemblablement que les auditeurs sont exempts de culpabilité plutôt que moralement justes au sens général.
- source_word: הִנֵּה
  choice: C’est moi qui
  rationale: L’emphase de הִנֵּה est rendue idiomatiquement par la tournure clivée française, qui attire l’attention sur l’aveu de Jéhu.
- source_word: קָשַׁרְתִּי עַל
  choice: ai conspiré contre
  rationale: Rend directement le sens politique du verbe קשר construit avec עַל.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Désigne ici le souverain auquel Jéhu était soumis, sans suggérer un titre divin.
- source_word: וָאֶהְרְגֵהוּ
  choice: l’ai tué
  rationale: Formulation moderne, directe et exacte pour הרג avec son suffixe pronominal.
- source_word: וּמִי הִכָּה
  choice: Mais qui a frappé
  rationale: Le contexte donne à la conjonction une valeur contrastive; « frappé » préserve le lexème נכה et laisse le contexte indiquer l’issue mortelle.
- source_word: כָּל אֵלֶּה
  choice: tous ceux-ci
  rationale: Maintient le démonstratif et son référent humain sans préciser davantage que l’hébreu.
theological_decisions:
- issue: Valeur de צַדִּקִים dans la déclaration de Jéhu
  choice: innocents
  alternative: justes / dans leur droit
  rationale: Le contexte oppose la responsabilité avouée de Jéhu dans la mort de son maître à la responsabilité des auteurs du massacre exposé devant le peuple. La lecture forensique convient donc mieux, tout en signalant l’autre valeur possible en note.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de la progression hébraïque, tandis que « Le matin venu » et « C’est moi qui » assurent une formulation idiomatique. Le contraste rhétorique entre l’aveu de Jéhu et sa question finale est conservé.
