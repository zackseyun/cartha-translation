base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/004.yaml
  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: fr
  text: 'Mais ils eurent très, très peur et dirent : « Voilà : les deux rois n’ont pas pu lui résister ; comment pourrions-nous lui résister, nous ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד מְאֹד
  choice: ils furent saisis d’une très grande peur
  rationale: Le verbe ירא exprime ici la peur ressentie en réaction à la menace, tandis que le redoublement מְאֹד מְאֹד marque une forte intensité. Cette formulation naturelle en français conserve cette intensification sans lourdeur.
- source_word: הִנֵּה
  choice: non traduit explicitement
  rationale: Dans ce discours, הִנֵּה attire l’attention sur un fait manifeste. En français courant, l’enchaînement direct après « dirent » remplit naturellement cette fonction; « voyez » ou « voici » serait plus marqué.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: les deux rois
  rationale: L’expression désigne les deux rois déjà connus dans le contexte; l’article défini convient donc.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: n’ont pas pu lui résister
  rationale: Littéralement, les rois « ne se sont pas tenus devant lui ». Dans ce contexte d’affrontement et de défaite, l’expression signifie qu’ils n’ont pas été capables de tenir face à lui; « résister » en rend clairement le sens idiomatique.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: Comment pourrions-nous lui résister, nous ?
  rationale: La question tire la conséquence du sort des deux rois. Le conditionnel exprime naturellement l’impossibilité envisagée, et le pronom disjoint « nous » préserve l’emphase portée par אֲנָחְנוּ.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme du verbe עמד est conservé par la répétition de « résister » dans les deux propositions, tandis que l’image hébraïque littérale de « se tenir devant » est rendue idiomatiquement.
