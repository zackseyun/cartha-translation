  text: וַ/יָּבֹ֤א הַ/מַּלְאָךְ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר הֵבִ֖יאוּ רָאשֵׁ֣י בְנֵֽי הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר שִׂ֣ימוּ אֹתָ֞/ם שְׁנֵ֧י צִבֻּרִ֛ים פֶּ֥תַח הַ/שַּׁ֖עַר עַד הַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: fr
  text: 'Le messager arriva et lui annonça : « Ils ont apporté les têtes des fils du roi. » Jéhu dit : « Mettez-les en deux tas[a] à l’entrée de la porte jusqu’au matin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en deux monceaux ».
    reason: Alternative lexicale pour צִבֻּרִים.
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce récit, il s’agit d’un porteur humain de nouvelles, et non d’un être céleste.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: lui annonça
  rationale: Cette formulation française naturelle rend l’acte de rapporter la nouvelle sans conserver le pléonasme hébreu « annonça en disant ».
- source_word: הֵבִיאוּ
  choice: Ils ont apporté
  rationale: Le passé composé exprime une action achevée dont le résultat est présent au moment du rapport.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: les têtes des fils du roi
  rationale: Le pluriel concret « têtes » et le groupe « fils du roi » rendent directement la construction hébraïque et le contexte immédiat.
- source_word: שִׂימוּ אֹתָם
  choice: Mettez-les
  rationale: Impératif direct, courant et fidèle au verbe hébreu.
- source_word: שְׁנֵי צִבֻּרִים
  choice: en deux tas
  rationale: « Tas » est une expression française claire et concrète pour deux amas d’objets empilés.
- source_word: פֶּתַח הַשַּׁעַר
  choice: à l’entrée de la porte
  rationale: La traduction conserve le lieu concret désigné par l’expression hébraïque, c’est-à-dire l’entrée de la porte urbaine.
- source_word: עַד הַבֹּקֶר
  choice: jusqu’au matin
  rationale: Cette expression rend naturellement la durée qui se prolonge jusqu’au matin suivant.
theological_decisions:
- issue: Identification du sujet implicite de וַיֹּאמֶר (« il dit »)
  choice: Jéhu dit
  alternative: Il dit
  rationale: Le sujet est Jéhu dans le contexte immédiat. Le nommer en français évite que le lecteur attribue par erreur l’ordre au messager, sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et narratif. Le discours indirect hébraïque avec לֵאמֹר est rendu par deux-points, conformément à l’usage naturel du français, tandis que la brutalité concrète du texte est conservée.
