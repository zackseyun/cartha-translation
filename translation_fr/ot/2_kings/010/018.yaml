  text: וַ/יִּקְבֹּ֤ץ יֵהוּא֙ אֶת כָּל הָ/עָ֔ם וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַחְאָ֕ב עָבַ֥ד אֶת הַ/בַּ֖עַל מְעָ֑ט יֵה֖וּא יַעַבְדֶ֥/נּוּ הַרְבֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: fr
  text: 'Puis Jéhu rassembla tout le peuple et leur dit[a] : « Achab a peu servi Baal[b] ; Jéhu, lui, le servira beaucoup. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans le contexte, la déclaration de Jéhu est ironique : il affirme qu’il servira beaucoup Baal, mais la suite du récit montre qu’il s’agit d’une ruse destinée à rassembler les adorateurs de Baal.'
    reason: cross_reference
  - marker: b
    text: Ou « a peu adoré Baal » et « l’adorera beaucoup » ; le verbe hébreu traduit par « servir » peut désigner le service religieux rendu à une divinité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: rassembla
  rationale: Le verbe קבץ décrit ici l’action de réunir des personnes ; « rassembla » est naturel et précis dans un récit.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Cette formulation conserve l’étendue générale de l’expression hébraïque sans la réduire à une foule ou à un groupe particulier.
- source_word: עָבַד אֶת הַבַּעַל
  choice: a servi Baal
  rationale: Avec une divinité comme complément, עבד désigne le service religieux. « Servir Baal » reste proche de l’hébreu tout en étant compréhensible en français.
- source_word: מְעָט
  choice: peu
  rationale: « Peu » exprime naturellement le degré et prépare l’opposition concise avec « beaucoup ».
- source_word: יַעַבְדֶנּוּ
  choice: le servira
  rationale: Le pronom suffixe renvoie à Baal. Le futur rend ici la valeur de l’inaccompli dans le discours direct.
- source_word: הַרְבֵּה
  choice: beaucoup
  rationale: Employé adverbialement, le terme s’oppose directement à מְעָט ; « peu… beaucoup » préserve ce parallélisme.
- source_word: יֵהוּא
  choice: Jéhu
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Même si l’hébreu porte l’article, le français traite normalement Baal comme un nom propre sans article.
theological_decisions:
- issue: La déclaration de Jéhu au sujet de son service de Baal
  choice: Présenter directement les paroles de Jéhu sans signaler dans le corps du texte qu’il s’agit d’une ruse.
  alternative: Ajouter une indication telle que « prétendit vouloir servir » ou « affirma qu’il servirait ».
  rationale: Le contexte narratif révèle la tromperie, mais la formulation hébraïque rapporte simplement le discours. La traduction conserve donc l’ironie narrative sans l’expliquer dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. L’ajout disjonctif « lui » après « Jéhu » rend clairement et naturellement le contraste Achab/Jéhu, tandis que « peu… beaucoup » conserve la concision rhétorique de l’hébreu.
