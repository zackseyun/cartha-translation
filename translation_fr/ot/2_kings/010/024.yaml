base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: fr
  text: 'Ils entrèrent pour offrir des sacrifices et des holocaustes. Jéhu avait posté à l’extérieur quatre-vingts hommes. Il leur dit : « Si l’un de vous laisse échapper un seul des hommes que je livre entre vos mains, il donnera sa vie pour la vie de cet homme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa vie à la place de sa vie » ; le garde qui laisserait un homme s’échapper perdrait donc sa propre vie à la place de celle du fugitif.'
    reason: La formule hébraïque emploie deux fois le même pronom, dont les référents doivent être distingués en français pour rendre le sens de la sanction.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils entrèrent
  rationale: Dans ce contexte, בוא décrit l’entrée dans le lieu où les offrandes seront présentées. « Entrèrent » exprime naturellement ce mouvement sans imposer un point de vue extérieur.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: pour offrir des sacrifices et des holocaustes
  rationale: Avec des objets sacrificiels, עשה signifie accomplir ou offrir. « Sacrifices » rend זְבָחִים, tandis que « holocaustes » est le terme français courant pour les offrandes entièrement consumées désignées par עֹלוֹת.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: avait posté à l’extérieur quatre-vingts hommes
  rationale: שׂים prend ici le sens contextuel de placer des hommes en faction. Le plus-que-parfait marque clairement que cette disposition avait été prise avant l’entrée des adorateurs. « Hommes » évite de préciser « soldats », ce que l’hébreu ne fait pas.
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: Si l’un de vous laisse échapper un seul des hommes
  rationale: La formulation hébraïque est concise et quelque peu difficile, mais le contexte montre que Jéhu rend chaque garde responsable de toute fuite. Cette formulation française explicite cette responsabilité tout en conservant la portée distributive de l’avertissement.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: que je livre entre vos mains
  rationale: L’expression « amener sur/dans les mains » signifie remettre quelqu’un au pouvoir ou à la garde d’autrui. « Livrer entre vos mains » conserve l’image hébraïque dans un français idiomatique.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: il donnera sa vie pour la vie de cet homme
  rationale: נפש désigne ici la vie. La formulation précise que la vie du garde négligent répondra de celle du fugitif, en évitant l’ambiguïté que produiraient deux pronoms identiques en français.
