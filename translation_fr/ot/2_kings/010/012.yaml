base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: fr
  text: Puis il se leva, se mit en route et alla à Samarie. Il était à Beth-Éqed des bergers, sur le chemin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beth-Éqed est probablement un nom de lieu. Éqed peut évoquer le fait de lier ou de rassembler; certains comprennent l'expression comme désignant un lieu lié aux bergers, possiblement à la tonte. Le sens précis du nom reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se mit en route
  rationale: Dans cette suite narrative, le verbe קום introduit le départ de Jéhu plutôt que le simple fait de se lever; cette formulation est naturelle en français moderne.
- source_word: וַיָּבֹא וַיֵּלֶךְ שֹׁמְרוֹן
  choice: partit pour Samarie
  rationale: Les deux verbes successifs expriment le mouvement vers Samarie. Cette formulation française évite une répétition pesante tout en conservant la progression du récit.
- source_word: הוּא
  choice: Il se trouvait
  rationale: Le pronom indépendant introduit ici une indication circonstancielle de lieu; «Il se trouvait» rend clairement cette fonction.
- source_word: בֵּית עֵקֶד הָרֹעִים
  choice: Beth-Éqed-des-Bergers
  rationale: L'expression fonctionne comme un nom de lieu. Le premier élément est translittéré, tandis que הָרֹעִים, au sens clair de «bergers», est rendu en français.
- source_word: בַּדָּרֶךְ
  choice: sur le chemin
  rationale: La locution situe Beth-Éqed par rapport à l'itinéraire de Jéhu et reste proche de la formulation hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom de lieu est partiellement translittéré afin de préserver l'incertitude lexicale, et le référent «Jéhu» est explicité d'après le contexte immédiat pour éviter une ambiguïté peu naturelle en français.
