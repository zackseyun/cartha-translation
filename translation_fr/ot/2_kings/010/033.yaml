  text: מִן הַ/יַּרְדֵּן֙ מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ אֵ֚ת כָּל אֶ֣רֶץ הַ/גִּלְעָ֔ד הַ/גָּדִ֥י וְ/הָ/רֻאובֵנִ֖י וְ/הַֽ/מְנַשִּׁ֑י מֵ/עֲרֹעֵר֙ אֲשֶׁ֣ר עַל נַ֣חַל אַרְנֹ֔ן וְ/הַ/גִּלְעָ֖ד וְ/הַ/בָּשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: fr
  text: depuis le Jourdain vers l’est, tout le pays de Galaad — celui des Gadites, des Rubénites et des Manassites —, depuis Aroër, qui se trouve au bord de la vallée de l’Arnon[a], ainsi que Galaad et le Bashân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au bord du torrent de l’Arnon » ; le mot hébreu peut désigner un cours d’eau saisonnier, son lit ou la vallée qu’il forme.
    reason: Alternative lexicale préservant les différents sens possibles de נַחַל dans cette indication géographique.
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: depuis le Jourdain vers l’est
  rationale: « Le Jourdain » est la désignation française usuelle du fleuve. L’expression littérale « vers le lever du soleil » est ici une indication géographique signifiant « vers l’est ».
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: tout le pays de Galaad
  rationale: Cette proposition poursuit syntaxiquement le verset précédent. « Pays » rend naturellement אֶרֶץ dans cette description territoriale, tandis que « Galaad » conserve le nom régional traditionnel en français.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: celui des Gadites, des Rubénites et des Manassites
  rationale: Les gentilés hébreux désignent collectivement les groupes tribaux établis dans ce territoire. « Celui » explicite en français leur relation appositionnelle avec le pays sans les confondre avec les noms des tribus.
- source_word: מֵעֲרֹעֵר
  choice: depuis Aroër
  rationale: La préposition marque ici le point de départ ou la limite du territoire. « Aroër » suit la forme française traditionnelle du toponyme.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: qui se trouve au bord de la vallée de l’Arnon
  rationale: עַל a ici un sens locatif. נַחַל peut désigner un torrent, son lit ou la vallée correspondante ; « vallée » convient au contexte géographique, tandis que la note préserve l’étendue sémantique du terme.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: ainsi que Galaad et le Bashân
  rationale: « Ainsi que » conserve la force additive de la conjonction sans imposer une valeur culminante certaine. L’article devant « Bashân » correspond à l’usage français traditionnel pour cette région.
