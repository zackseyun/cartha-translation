  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: fr
  text: 'Achab avait soixante-dix fils à Samarie. Jéhu écrivit des lettres et les envoya à Samarie, aux chefs de Jizréel[a], aux anciens et à ceux qui étaient chargés d’élever les fils d’Achab[b], en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux chefs de Jizréel ». Puisque les lettres sont envoyées à Samarie, certains comprennent qu’il s’agit de chefs liés à Jizréel qui y résidaient ; certaines versions anciennes et certains interprètes lisent plutôt « aux chefs de Samarie ». Le texte principal conserve la formulation massorétique.'
    reason: textual_variant
  - marker: b
    text: Ou « aux pères nourriciers », « aux tuteurs » ou « aux responsables ». Le terme hébreu désigne ceux qui étaient chargés d’élever les fils d’Achab ou de veiller sur eux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: Achab avait
  rationale: La construction avec לְ exprime ici la possession et introduit la situation d’Achab; cette formulation est naturelle en français sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: שִׁבְעִים בָּנִים
  choice: soixante-dix fils
  rationale: בָּנִים désigne littéralement des fils, sens pertinent dans ce contexte de succession royale.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition בְּ indique le lieu; en français, une ville se construit naturellement avec « à ».
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: écrivit des lettres
  rationale: סְפָרִים désigne ici des communications écrites envoyées à des destinataires.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: les envoya à Samarie
  rationale: Le pronom « les » reprend naturellement les lettres, objet implicite du verbe hébreu.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: aux chefs de Jizréel
  rationale: שָׂרֵי désigne des responsables ou dirigeants. « Chefs » reste large et lisible, tandis que « de Jizréel » préserve la leçon massorétique difficile.
- source_word: הַזְּקֵנִים
  choice: aux anciens
  rationale: Dans ce contexte civique, זְקֵנִים désigne des responsables reconnus de la communauté.
- source_word: הָאֹמְנִים אַחְאָב
  choice: aux tuteurs des fils d’Achab
  rationale: Le participe de אמן désigne ceux qui avaient la charge d’élever ou de superviser les descendants royaux; l’ajout de « des fils » explicite en français la relation sous-entendue par le contexte.
- source_word: לֵאמֹר
  choice: 'Il écrivit :'
  rationale: לֵאמֹר introduit le contenu de la lettre au verset suivant. La reprise du verbe « écrire » évite en français le calque lourd « en disant » et prépare clairement la citation.
