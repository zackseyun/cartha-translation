  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: fr
  text: 'Alors Jéhu dit : « Consacrez une assemblée solennelle en l’honneur de Baal. » Et ils la proclamèrent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement la succession en français moderne.
- source_word: יֵהוּא
  choice: Jéhu
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: קַדְּשׁוּ
  choice: Consacrez
  rationale: L’impératif pluriel de קדשׁ demande de réserver officiellement l’événement à un usage cultuel; « consacrez » conserve cette portée rituelle.
- source_word: עֲצָרָה
  choice: une assemblée solennelle
  rationale: Le nom désigne une convocation religieuse officielle; cette formulation conserve son caractère cultuel et solennel.
- source_word: לַבַּעַל
  choice: en l’honneur de Baal
  rationale: La préposition ל indique ici la destination ou la finalité cultuelle de l’assemblée. Cette tournure est naturelle en français et explicite la relation sans suggérer que Baal reçoit matériellement l’assemblée.
- source_word: וַיִּקְרָאוּ
  choice: Et ils la proclamèrent
  rationale: Dans ce contexte, קרא désigne l’annonce publique et officielle de la convocation. Le pronom « la » reprend naturellement l’assemblée.
