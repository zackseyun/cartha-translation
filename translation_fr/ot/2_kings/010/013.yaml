base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: fr
  text: 'Jéhu rencontra les frères d’Ahazia[a], roi de Juda, et leur demanda : « Qui êtes-vous ? » Ils répondirent : « Nous sommes les frères d’Ahazia, et nous sommes descendus prendre des nouvelles[b] des fils du roi et des fils de la reine mère[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères d’Ahazia » peut désigner ses frères au sens strict ou, plus largement, de proches parents de la famille royale.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « voir si les fils du roi et les fils de la reine mère allaient bien ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression « reine mère » traduit l’hébreu gebirah, titre porté à la cour par la mère du roi.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: rencontra
  rationale: Dans ce récit, le verbe décrit le fait que Jéhu tombe sur ce groupe. « Rencontra » exprime naturellement cette rencontre sans suggérer nécessairement une recherche préalable.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: les frères d’Ahazia
  rationale: Le français conserve le terme concret de l’hébreu. Dans un contexte dynastique, « frères » peut toutefois désigner plus largement des proches parents, ambiguïté signalée en note.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Traduction directe et naturelle du titre royal rattaché à Ahazia.
- source_word: מִי אַתֶּם
  choice: Qui êtes-vous ?
  rationale: La question brève de l’hébreu se rend directement et naturellement ainsi en français.
- source_word: וַנֵּרֶד
  choice: nous sommes descendus
  rationale: Cette formulation conserve le mouvement de descente, vraisemblablement géographique, tout en convenant au discours direct.
- source_word: לִשְׁלוֹם
  choice: prendre des nouvelles
  rationale: Dans ce contexte, l’expression concerne le bien-être des personnes visitées. « Prendre des nouvelles » restitue l’idiome dans un français courant et digne.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: les fils du roi
  rationale: La traduction garde le sens masculin précis de בְּנֵי et le parallélisme de la phrase.
- source_word: הַגְּבִירָה
  choice: la reine mère
  rationale: Dans le cadre de la cour royale de Juda, גְּבִירָה désigne couramment la mère du roi investie d’un rang officiel; « reine mère » rend clairement cette fonction.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: et des fils de la reine mère
  rationale: La formulation préserve le parallélisme avec « les fils du roi » et maintient les deux groupes tels que les présente l’hébreu.
