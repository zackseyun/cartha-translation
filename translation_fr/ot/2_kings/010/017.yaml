  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹא֙ שֹֽׁמְר֔וֹן וַ֠/יַּךְ אֶת כָּל הַ/נִּשְׁאָרִ֧ים לְ/אַחְאָ֛ב בְּ/שֹׁמְר֖וֹן עַד הִשְׁמִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר אֶל אֵלִיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: fr
  text: Lorsqu’il arriva à Samarie, il frappa tous ceux qui restaient de la maison d’Achab à Samarie, jusqu’à les exterminer[a], conformément à la parole que Yahweh avait adressée à Élie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à l’exterminer ». Le suffixe hébreu est au singulier et peut désigner collectivement Achab, c’est-à-dire sa maison ou tout ce qui lui restait rattaché.'
    reason: Le texte principal adopte l’accord pluriel naturel en français, mais l’hébreu conserve un objet singulier dont le référent collectif est ambigu.
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: Lorsqu’il arriva à Samarie
  rationale: Le waw consécutif fait progresser le récit et relie l’arrivée à l’action suivante. « Lorsqu’il arriva » exprime naturellement cette relation temporelle en français.
- source_word: וַיַּךְ
  choice: il frappa
  rationale: Dans ce contexte, נכה désigne une violence mortelle. « Frapper » conserve l’expression sobre et grave de l’hébreu; la suite précise qu’il s’agit d’une extermination.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: tous ceux qui restaient de la maison d’Achab
  rationale: Le participe désigne ceux qui subsistaient encore, et le ל marque leur relation avec Achab. « De la maison d’Achab » rend cette appartenance de façon naturelle et collective dans le contexte de l’élimination de sa lignée et de son entourage.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La seconde mention du lieu est conservée conformément à la répétition de l’hébreu.
- source_word: עַד הִשְׁמִידוֹ
  choice: jusqu’à les exterminer[a]
  rationale: שׁמד exprime une destruction totale. Le français emploie le pluriel pour reprendre naturellement « tous ceux qui restaient », tandis que la note signale le suffixe singulier de l’hébreu et sa portée collective possible.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: « Parole » préserve la formule d’accomplissement prophétique, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: que Yahweh avait adressée à Élie
  rationale: Le plus-que-parfait situe correctement la parole prophétique avant son accomplissement. La répétition explicite de Yahweh évite en français une ambiguïté pronominale inutile.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Référent du suffixe singulier dans הִשְׁמִידוֹ
  choice: Pluriel dans le texte courant, avec signalement du singulier hébreu en note
  alternative: jusqu’à l’exterminer
  rationale: Le singulier peut viser collectivement Achab, sa maison ou son groupe, tandis que l’antécédent syntaxique exprimé en français est pluriel. La note maintient la tension du texte source sans produire une formulation française artificielle.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « Samarie » est maintenue pour respecter la structure hébraïque. « Exterminer » rend la force de שׁמד sans atténuer la violence du passage.
