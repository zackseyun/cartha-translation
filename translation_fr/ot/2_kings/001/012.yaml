base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: fr
  text: 'Élie leur répondit : « Si je suis un homme de Dieu, qu’un feu descende du ciel et te dévore, toi et tes cinquante hommes. » Alors un feu venu de Dieu[a] descendit du ciel et le dévora, lui et ses cinquante hommes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « un feu de Dieu ». Ou « un feu divin » ; la construction hébraïque peut aussi être comprise comme qualifiant le feu d’extraordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: Élie leur répondit
  rationale: Le double introducteur hébreu, littéralement « répondit et parla », est rendu par une formule française naturelle qui conserve la valeur de réponse sans lourdeur.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: Si je suis un homme de Dieu
  rationale: La tournure prédicative désigne le statut prophétique d’Élie. L’indéfini est naturel en français et ne tranche pas au-delà de l’hébreu.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: qu’un feu descende du ciel
  rationale: Le jussif exprime ici une invocation ou une sommation, bien rendue par le subjonctif français après « que ».
- source_word: וְתֹאכַל
  choice: et te dévore / le dévora
  rationale: Avec le feu comme sujet, « dévorer » conserve l’image concrète du verbe אכל et fonctionne naturellement en français biblique moderne.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: tes cinquante hommes / ses cinquante hommes
  rationale: L’hébreu dit littéralement « tes/ses cinquante »; l’ajout de « hommes » explicite sobrement qu’il s’agit de la troupe commandée par le chef.
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: Alors un feu de Dieu descendit du ciel
  rationale: Cette traduction garde le lien explicite entre אֵשׁ et אֱלֹהִים tout en préservant l’ambiguïté possible entre un feu appartenant à Dieu, venant de Dieu ou d’une intensité extraordinaire.
theological_decisions:
- issue: Titre prophétique אִישׁ הָאֱלֹהִים
  choice: un homme de Dieu
  alternative: l’homme de Dieu
  rationale: Le groupe nominal est prédicatif et peut se comprendre comme l’affirmation d’un statut prophétique. « Un homme de Dieu » est idiomatique sans exclure que le personnage soit déjà connu sous ce titre.
- issue: Rapport entre le feu et Dieu dans אֵשׁ אֱלֹהִים
  choice: un feu de Dieu
  alternative: un feu venant de Dieu
  rationale: « De Dieu » reproduit le lien nominal de l’hébreu sans préciser de façon indue s’il s’agit surtout de l’origine, de l’appartenance ou d’une qualification intensive.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « lui et ses cinquante hommes » conserve l’insistance de l’hébreu. Le tutoiement correspond à l’adresse au chef, au singulier.
