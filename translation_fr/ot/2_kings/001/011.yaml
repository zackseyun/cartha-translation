  text: וַ/יָּ֜שָׁב וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֥ים אַחֵ֖ר וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֨עַן֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָ/אֱלֹהִ֔ים כֹּֽה אָמַ֥ר הַ/מֶּ֖לֶךְ מְהֵרָ֥ה רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: fr
  text: 'Il envoya de nouveau vers lui un autre chef de cinquante avec ses cinquante hommes. Celui-ci prit la parole et lui dit : « Homme de Dieu, ainsi parle le roi : “Descends vite !” »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Viens vite ! » Cette formulation reflète le point de vue du représentant du roi, situé plus bas qu’Élie. Le verbe hébreu signifie simplement « descendre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: Il envoya de nouveau
  rationale: Dans cette construction narrative, וַיָּשָׁב marque la répétition de l’action plutôt qu’un retour physique.
- source_word: שַׂר חֲמִשִּׁים
  choice: chef de cinquante
  rationale: Le titre désigne l’officier placé à la tête d’une unité de cinquante hommes; cette formulation reste proche de l’hébreu et naturelle dans ce contexte ancien.
- source_word: וַחֲמִשָּׁיו
  choice: avec ses cinquante hommes
  rationale: Le waw exprime ici naturellement l’accompagnement; l’ajout de « hommes » explicite en français ce que le nombre désigne.
- source_word: וַיַּעַן וַיְדַבֵּר
  choice: Celui-ci prit la parole et lui dit
  rationale: Cette tournure française restitue naturellement la formule narrative hébraïque sans suggérer nécessairement une réponse à une question.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Homme de Dieu
  rationale: Titre reconnu d’Élie, employé ici comme apostrophe directe.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: ainsi parle le roi
  rationale: Cette formule conserve le caractère officiel et autoritaire du message royal.
- source_word: מְהֵרָה רֵדָה
  choice: Descends vite
  rationale: L’impératif français exprime clairement l’ordre et son urgence; « descendre » préserve le sens spatial sans imposer le point de vue déictique du locuteur.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formule officielle « ainsi parle le roi » et le titre « Homme de Dieu » maintiennent la solennité du récit, tandis que « prit la parole » et « vite » évitent un registre inutilement archaïque.
