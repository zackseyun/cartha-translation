  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: fr
  text: 'Ahazia tomba à travers le treillis de sa chambre haute, qui se trouvait à Samarie, et il tomba malade. Il envoya des messagers et leur dit : « Allez consulter Baal-Zeboub[a], le dieu d’Éqrôn, pour savoir si je guérirai de cette maladie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Zeboub transcrit la forme hébraïque du nom. La forme grecque ultérieure est Béelzéboul ; Belzébuth est une forme traditionnelle française.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: à travers le treillis
  rationale: L’expression décrit le passage par une ouverture munie d’un treillis. Cette formulation conserve l’image concrète sans ajouter explicitement « fenêtre ».
- source_word: עֲלִיָּתוֹ
  choice: sa chambre haute
  rationale: עֲלִיָּה désigne une pièce aménagée à l’étage ou sur le toit. « Chambre haute » est clair, digne et proche du sens hébreu.
- source_word: וַיָּחַל
  choice: il tomba malade
  rationale: Le verbe signifie ici qu’Ahazia devint malade à la suite de sa chute. L’hébreu parle de maladie plutôt que d’affirmer explicitement une blessure, comme le confirme חֳלִי plus loin dans le verset.
- source_word: מַלְאָכִים
  choice: messagers
  rationale: Dans ce contexte, il s’agit d’agents humains envoyés par le roi, non d’anges.
- source_word: דִרְשׁוּ
  choice: consulter
  rationale: דרשׁ désigne ici la recherche d’une réponse oraculaire auprès d’une divinité. « Consulter » exprime naturellement ce sens religieux en français.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zeboub
  rationale: Le nom propre est translittéré d’après sa forme hébraïque plutôt que remplacé par une forme grecque ou traditionnelle plus tardive.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: le dieu d’Éqrôn
  rationale: Le groupe construit identifie Baal-Zeboub comme la divinité d’Éqrôn.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: pour savoir si je guérirai de cette maladie
  rationale: Littéralement, l’expression demande s’il « vivra/revivra de » cette maladie. En français idiomatique, « guérir de cette maladie » communique l’idée de rétablissement tout en conservant l’incertitude.
- source_word: וַיִּפֹּל
  choice: tomba
  rationale: Le verbe narratif simple est rendu directement, sans étoffement.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française courante du nom de lieu.
theological_decisions:
- issue: Forme du nom de la divinité païenne
  choice: Baal-Zeboub
  alternative: Belzébuth
  rationale: Le texte massorétique porte בַּעַל זְבוּב. Le texte principal suit donc la forme hébraïque, tandis que la forme traditionnelle plus tardive est signalée en note sans être substituée au texte source.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible sans effacer la répétition sémantique entre « tomba malade » et « cette maladie ». Le marqueur « alors » rend l’enchaînement narratif du second wayyiqtol sans ajouter un repère temporel initial absent de l’hébreu.
