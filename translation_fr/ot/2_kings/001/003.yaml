source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: fr
  text: 'Mais l’ange de Yahweh parla à Élie le Tishbite : « Lève-toi, monte à la rencontre des messagers du roi de Samarie et dis-leur : “Est-ce parce qu’il n’y a pas de Dieu en Israël que vous allez consulter Baal-Zebub, le dieu d’Éqrôn ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Mais l’ange de Yahweh
  rationale: La conjonction marque ici le contraste avec la démarche du roi au verset précédent. Dans ce contexte, מַלְאַךְ désigne naturellement un ange, tandis que le nom divin est rendu directement par « Yahweh ».
- source_word: דִּבֶּר אֶל
  choice: parla à
  rationale: Rend directement la construction courante « parler à » dans un registre narratif digne et naturel.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Élie le Tishbite
  rationale: Le nom personnel reçoit sa forme française traditionnelle, tandis que le gentilé est translittéré sans préciser une origine que le texte ne développe pas.
- source_word: קוּם עֲלֵה
  choice: Lève-toi, monte
  rationale: Les deux impératifs sont conservés distinctement, et « monte » maintient la valeur directionnelle de עלה.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Exprime le but du déplacement sans renforcer indûment le ton en « affronter ».
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: les messagers du roi de Samarie
  rationale: Ici, מַלְאָךְ désigne clairement des agents humains; « messagers » les distingue de l’ange mentionné au début du verset.
- source_word: וְדַבֵּר אֲלֵהֶם
  choice: et dis-leur
  rationale: Cette formulation est idiomatique en français avant un discours direct tout en conservant l’ordre reçu.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Est-ce parce qu’il n’y a pas de Dieu en Israël
  rationale: Préserve la question rhétorique et son reproche implicite dans une formulation française claire, sans résoudre davantage l’expression hébraïque.
- source_word: אַתֶּם הֹלְכִים
  choice: vous allez
  rationale: Le présent périphrastique rend naturellement l’action projetée ou en cours exprimée par le participe.
- source_word: לִדְרֹשׁ בְּ
  choice: consulter
  rationale: Dans ce contexte oraculaire, le verbe signifie chercher une réponse auprès d’une divinité; « consulter » est précis et courant.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebub
  rationale: Le nom propre composé est translittéré et relié par un trait d’union pour en faciliter la lecture.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: le dieu d’Éqrôn
  rationale: La construction identifie Baal-Zebub comme la divinité associée à Éqrôn; l’article défini convient au sens contextuel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: « Ange » est le sens contextuel le plus naturel dans ce récit, sans ajouter d’affirmation sur l’identité métaphysique précise de ce personnage.
- issue: Force de la question rhétorique
  choice: Est-ce parce qu’il n’y a pas de Dieu en Israël… ?
  alternative: Est-ce faute d’un Dieu en Israël… ?
  rationale: La formulation retenue transmet clairement le reproche et préserve l’opposition théologique entre le Dieu d’Israël et Baal-Zebub.
translation_notes:
  register: Français international moderne, narratif et digne. Les impératifs restent directs; les noms Élie, Samarie et Baal suivent des formes immédiatement reconnaissables, tandis qu’Éqrôn et Tishbite restent proches des formes sources.
