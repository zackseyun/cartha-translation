  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: fr
  text: 'Ils lui répondirent : « Un homme est venu à notre rencontre et nous a dit d’aller retourner auprès du roi qui vous a envoyés et de lui dire : “Voici ce que dit Yahweh : Est-ce parce qu’il n’y a pas de Dieu en Israël[a] que tu envoies consulter Baal-Zeboub, le dieu d’Éqrôn ? C’est pourquoi tu ne descendras pas du lit sur lequel tu es monté[b], car tu mourras à coup sûr.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Est-ce faute d’un Dieu en Israël… ? »'
    reason: L’expression hébraïque peut être rendue soit comme une question sur l’absence de Dieu, soit par la tournure idiomatique « faute de ».
  - marker: b
    text: 'L’hébreu dit littéralement : « sur lequel tu es monté là » ; « là » reprend le lit dans une construction sémitique.'
    reason: La note signale l’adverbe résomptif présent dans le texte source, omis du corps du verset pour obtenir un français naturel.
lexical_decisions:
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom commun masculin conserve le point de vue des messagers, qui n’identifient pas encore Élie.
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: est venu à notre rencontre
  rationale: Dans ce contexte, עָלָה décrit l’approche de l’homme vers les messagers. « Est venu à notre rencontre » exprime naturellement le mouvement en français sans imposer une montée topographique incertaine.
- source_word: לְכוּ שׁוּבוּ
  choice: Allez, retournez
  rationale: Les deux impératifs hébreux sont maintenus, tout en produisant un ordre français clair.
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: et dites-lui
  rationale: Devant le discours direct qui suit, « dites-lui » est plus idiomatique que le littéral « parlez-lui » et rend fidèlement l’acte de transmettre le message.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle et digne rend la formule prophétique traditionnelle sans lourdeur.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Est-ce parce qu’il n’y a pas de Dieu en Israël
  rationale: La tournure conserve la question rhétorique et son reproche indigné, sans résoudre davantage l’expression hébraïque.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: tu envoies consulter
  rationale: Dans ce cadre religieux, דרש désigne la recherche d’un oracle auprès d’une divinité. « Consulter » rend précisément ce sens en français.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zeboub
  rationale: Le nom propre divin est translittéré sous une forme lisible et usuelle en français biblique.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: le dieu d’Éqrôn
  rationale: Le groupe construit identifie Baal-Zeboub comme la divinité associée à la ville d’Éqrôn.
- source_word: הַמִּטָּה
  choice: le lit
  rationale: מִטָּה peut désigner un lit ou une couche ; dans le contexte de la maladie du roi, « lit » est le terme français le plus naturel.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: sur lequel tu es monté
  rationale: La formulation rend l’idée de monter sur le lit tout en évitant de reproduire maladroitement l’adverbe résomptif hébreu שׁם.
- source_word: מוֹת תָּמוּת
  choice: tu mourras à coup sûr
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie la certitude de la mort ; « à coup sûr » communique cette emphase en français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Force de la question sur l’existence d’un Dieu en Israël
  choice: Est-ce parce qu’il n’y a pas de Dieu en Israël
  alternative: Est-ce faute d’un Dieu en Israël
  rationale: Le choix principal garde la forme existentielle de l’hébreu et la portée accusatrice de la question, tandis que l’autre analyse idiomatique demeure signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au singulier hébreu adressé au roi. Les citations imbriquées distinguent la réponse des messagers, les paroles de l’homme et l’oracle de Yahweh.
