base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: fr
  text: 'Élie répondit au chef de cinquante : « Mais si je suis un homme de Dieu, qu’un feu descende du ciel et te dévore, toi et tes cinquante hommes ! » Alors un feu descendit du ciel et le dévora, lui et ses cinquante hommes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: chef de cinquante
  rationale: Rend le titre militaire hébreu de façon concise, tout en conservant l’organisation de l’unité autour de cinquante hommes.
- source_word: וְאִם
  choice: Mais si
  rationale: Le waw marque ici naturellement une réplique contrastive à l’ordre précédent; « mais » préserve cette nuance attestée sans surinterpréter.
- source_word: תֵּרֶד
  choice: qu’un feu descende
  rationale: Le yiqtol exprime ici une parole injonctive ou optative, rendue naturellement en français par le subjonctif.
- source_word: וְתֹאכַל / וַתֹּאכַל
  choice: te dévore / le dévora
  rationale: « Dévorer » conserve l’image forte du feu qui consume entièrement, avec la distinction entre la parole adressée et son accomplissement narratif.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: tes cinquante hommes / ses cinquante hommes
  rationale: L’hébreu emploie substantivement « tes/ses cinquante »; l’ajout de « hommes » est requis pour un français clair.
theological_decisions:
- issue: Force de la déclaration conditionnelle d’Élie
  choice: « Mais si je suis un homme de Dieu »
  alternative: « Puisque je suis un homme de Dieu »
  rationale: La traduction maintient la forme conditionnelle explicite אִם et laisse subsister sa force rhétorique, sans la transformer en affirmation causale.
- issue: Nature de la parole concernant le feu
  choice: « qu’un feu descende »
  alternative: « un feu descendra »
  rationale: Le subjonctif reflète l’injonction ou l’appel formulé par Élie, plutôt qu’une simple prédiction.
translation_notes:
  register: Français moderne, narratif et digne. La répétition entre la parole d’Élie et son accomplissement est conservée, comme dans l’hébreu. « Chef de cinquante » maintient la couleur institutionnelle du texte sans recourir à un grade militaire moderne potentiellement anachronique.
