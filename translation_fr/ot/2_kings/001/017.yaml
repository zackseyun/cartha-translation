  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: fr
  text: Il mourut, conformément à la parole de Yahweh qu’Élie avait prononcée. Joram devint roi à sa place, la deuxième année du règne de Joram, fils de Josaphat, roi de Juda, car il n’avait pas de fils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « il » renvoie à Ahazia, et non à Joram, fils de Josaphat.
    reason: clarification du référent pronominal
lexical_decisions:
- source_word: וַיָּמָת
  choice: Il mourut donc
  rationale: Le wayyiqtol fait avancer le récit; « donc » relie naturellement cette mort à l’annonce précédente sans ajouter de contenu.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole de Yahweh
  rationale: La préposition כ exprime ici la conformité de l’événement à la parole prononcée; le nom divin est rendu par « Yahweh ».
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: qu’Élie avait prononcée
  rationale: Le plus-que-parfait situe la parole d’Élie avant la mort; « prononcée » convient naturellement à « la parole » sans transformer Élie en simple complément d’agent.
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: Joram devint roi à sa place
  rationale: Dans ce contexte successoral, מלך marque l’accession au trône; « à sa place » rend directement תַּחְתָּיו.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: la deuxième année du règne de Joram
  rationale: L’ajout idiomatique « du règne » explicite en français la datation royale impliquée par l’hébreu.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: fils de Josaphat, roi de Juda
  rationale: Cette apposition distingue le Joram de Juda du Joram qui succède à Ahazia.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: car il n’avait pas de fils
  rationale: כִּי introduit la raison de cette succession; « car » conserve une articulation narrative digne et naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le caractère de nom propre sans importer une interprétation confessionnelle.
- issue: Référent de « il n’avait pas de fils »
  choice: Maintenir le pronom « il » dans le texte et préciser son référent en note
  alternative: car Ahazia n’avait pas de fils
  rationale: L’hébreu emploie un pronom, dont le référent narratif est Ahazia. Le conserver respecte la forme du texte, tandis qu’une note prévient une possible confusion avec le Joram mentionné immédiatement auparavant.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms sont donnés sous leurs formes françaises usuelles (« Élie », « Joram », « Josaphat », « Juda »). La syntaxe reste proche de l’hébreu tout en évitant une ambiguïté excessive grâce à une note.
