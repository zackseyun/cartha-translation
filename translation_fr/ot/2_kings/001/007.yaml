  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: fr
  text: 'Alors il leur demanda : « À quoi ressemblait l’homme qui est monté à votre rencontre et qui vous a dit ces paroles ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה מִשְׁפַּט הָאִישׁ
  choice: À quoi ressemblait l’homme
  rationale: Dans ce contexte, la question porte sur les traits permettant d’identifier l’homme, comme le confirme la description donnée au verset suivant. Cette formulation est naturelle en français et rend le sens contextuel de מִשְׁפַּט sans lui imposer ici son sens habituel de « jugement ».
- source_word: עָלָה
  choice: est monté
  rationale: Conserve la nuance directionnelle du verbe hébreu « monter », même si le français pourrait simplement dire « est venu ».
- source_word: לִקְרַאתְכֶם
  choice: à votre rencontre
  rationale: Expression française idiomatique correspondant à l’idée d’aller vers quelqu’un pour le rencontrer.
- source_word: וַיְדַבֵּר אֲלֵיכֶם אֶת הַדְּבָרִים הָאֵלֶּה
  choice: qui vous a dit ces paroles
  rationale: Rend naturellement en français l’acte de communiquer les paroles citées, tout en conservant le concret de « ces paroles ».
