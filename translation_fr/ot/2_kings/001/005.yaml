base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: fr
  text: 'Les messagers revinrent auprès de lui, et il leur dit : « Pourquoi êtes-vous revenus ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: revinrent
  rationale: Le verbe שׁוב exprime ici le retour des envoyés auprès de celui qui les avait dépêchés. Le passé simple convient au récit suivi et reste naturel dans le registre biblique français.
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: Dans ce contexte, מַלְאָכִים désigne des agents humains envoyés par le roi, et non des êtres célestes.
- source_word: אֵלָיו
  choice: auprès de lui
  rationale: La préposition indique le mouvement vers le roi. « Auprès de lui » exprime clairement qu'ils reviennent en sa présence, sans ajouter explicitement l'identité du référent.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: et il leur dit
  rationale: Cette formulation conserve le verbe courant אָמַר, même si les paroles qui suivent prennent la forme d'une question.
- source_word: מַה זֶּה
  choice: Pourquoi
  rationale: L'expression signifie littéralement « Qu'est-ce donc ? », mais elle demande ici la raison de leur retour. « Pourquoi » en rend naturellement la fonction en français.
- source_word: שַׁבְתֶּם
  choice: êtes-vous revenus
  rationale: La forme est à la deuxième personne masculine du pluriel. Le passé composé est idiomatique dans la question directe et souligne le résultat présent de leur retour.
