source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: fr
  text: 'Il lui dit : « Voici ce que dit Yahweh : Puisque tu as envoyé des messagers consulter Baal-Zeboub[a], le dieu d’Éqron, est-ce parce qu’il n’y a pas de Dieu en Israël à qui demander une parole[b] ? C’est pourquoi le lit sur lequel tu es monté[c], tu n’en descendras pas, car tu mourras à coup sûr. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Baal-Zeboub » ; la forme apparentée « Baal-Zeboul » apparaît dans une tradition plus tardive.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « rechercher sa parole » ; il s’agit probablement de demander à Dieu une réponse ou un oracle.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « le lit sur lequel tu es monté là » ; le mot « là » sert vraisemblablement de reprise dans la proposition relative.
    reason: source_form
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Il lui dit
  rationale: Dans ce contexte narratif, דּבר introduit une déclaration directe. « Il lui dit » est naturel en français tout en distinguant cette introduction de la formule prophétique qui suit.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle rend clairement la formule de messager prophétique et conserve le nom divin יְהוָה sous la forme « Yahweh ».
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: La locution introduit le motif du jugement. « Puisque » convient bien à la réprimande et s’enchaîne naturellement avec la question rhétorique.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: tu as envoyé des messagers
  rationale: Les מַלְאָכִים sont ici des envoyés humains. Le passé composé correspond naturellement en français à l’acte accompli.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: consulter Baal-Zeboub
  rationale: Dans ce contexte religieux, דרש désigne la recherche d’une réponse divine ou d’un oracle. « Consulter » exprime ce sens sans surinterpréter la nature précise de la réponse.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: le dieu d’Éqron
  rationale: Le groupe construit identifie directement Baal-Zeboub comme la divinité d’Éqron.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: est-ce parce qu’il n’y a pas de Dieu en Israël
  rationale: La question rhétorique est conservée sans atténuer la réprimande. La majuscule à « Dieu » indique que le référent est le Dieu d’Israël.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: à qui demander sa parole
  rationale: La traduction maintient explicitement דָּבָר, « parole », tout en donnant à דרש une tournure française compréhensible. Le sens probable est la demande d’une réponse ou d’un oracle divin.
- source_word: לָכֵן
  choice: eh bien
  rationale: Après la question rhétorique enchâssée, « eh bien » marque naturellement en français la conséquence solennelle annoncée par le prophète.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  choice: le lit sur lequel tu es monté
  rationale: Cette formulation garde l’image concrète de עלה, « monter », et le lit placé en tête pour emphase. Le שׁם hébreu est resumptif et n’exige pas un « là » redondant en français.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: tu n’en descendras pas
  rationale: Le pronom « en » reprend le lit mis en relief, tandis que « descendras » conserve l’opposition lexicale entre עלה, monter, et ירד, descendre.
- source_word: מוֹת תָּמוּת
  choice: tu mourras à coup sûr
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la mort. « À coup sûr » restitue cette insistance en français naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Rapport entre la consultation de Baal-Zeboub et l’absence supposée de Dieu en Israël
  choice: Conserver la question rhétorique comme une réprimande sans l’expliciter davantage
  alternative: 'Reformuler : « Comme s’il n’y avait pas de Dieu en Israël à consulter ! »'
  rationale: La forme interrogative hébraïque associe l’acte du roi à une négation implicite du Dieu d’Israël. La traduction préserve cette tension rhétorique sans ajouter d’explication doctrinale.
- issue: Sens de בִּדְבָרוֹ dans la consultation de Dieu
  choice: sa parole
  alternative: un oracle de sa part
  rationale: « Sa parole » conserve le substantif explicite דָּבָר et laisse ouverte la forme précise de la réponse divine, tandis que « oracle » préciserait davantage que le texte.
translation_notes:
  register: 'Français international moderne, digne et accessible. La syntaxe conserve la mise en relief hébraïque du « lit » et l’opposition « monter/descendre », tout en évitant les lourdeurs littérales. Les noms propres suivent des formes françaises transparentes : Yahweh, Baal-Zeboub, Éqron.'
