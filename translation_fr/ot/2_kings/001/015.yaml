  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: fr
  text: 'Alors l’ange de Yahweh dit à Élie : « Descends avec lui ; n’aie pas peur de lui[a]. » Élie se leva et descendit avec lui auprès du roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ne crains pas devant lui », c’est-à-dire « ne crains pas à cause de sa présence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange ; dans cette formule narrative où il transmet directement un ordre divin, « ange » est le choix le plus naturel. Le nom divin יְהוָה est translittéré « Yahweh ».
- source_word: רֵד אוֹתוֹ
  choice: Descends avec lui
  rationale: L’impératif de ירד exprime le déplacement vers le bas, et אוֹתוֹ a ici une valeur d’accompagnement dans la construction idiomatique.
- source_word: אַל תִּירָא מִפָּנָיו
  choice: n’aie pas peur de lui
  rationale: Cette formulation française naturelle exprime l’interdiction de craindre cet homme, tout en signalant en note la tournure hébraïque littérale liée à sa face ou à sa présence.
- source_word: וַיָּקָם
  choice: Élie se leva donc
  rationale: Le verbe décrit la mise en action d’Élie en réponse à l’ordre. Le nom explicite évite une légère ambiguïté pronominale en français, et « donc » marque naturellement la conséquence narrative.
- source_word: וַיֵּרֶד אוֹתוֹ אֶל הַמֶּלֶךְ
  choice: descendit avec lui auprès du roi
  rationale: La répétition de ירד avec אוֹתוֹ indique de nouveau l’accompagnement ; אֶל marque le mouvement vers le roi, rendu ici naturellement par « auprès du roi ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: « Ange » convient à l’usage narratif et traditionnel du syntagme sans préciser davantage la nature ou le statut théologique de cette figure.
translation_notes:
  register: Français international moderne, clair et digne. « Descends » conserve l’image spatiale du récit ; « se leva donc » maintient un rythme narratif naturel sans archaïsme.
