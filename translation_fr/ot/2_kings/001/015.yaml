    rationale: Le waw narratif introduit la suite des événements sans exiger une inférence causale explicite. Le supprimer reflète plus sobrement la narration hébraïque.
  - severity: medium
    issue: Note littérale maladroite et imprécise
    rationale: « Devant sa face » est un calque non idiomatique. La note devrait rendre la tournure comme « devant lui » et expliquer que le sens contextuel est de ne pas craindre à cause de sa présence.
  revised_text: 'Alors l’ange de Yahweh dit à Élie : « Descends avec lui ; n’aie pas peur de lui[a]. » Élie se leva et descendit avec lui auprès du roi.'
