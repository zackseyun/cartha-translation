  variant: modern international French
source:
  edition: WLC
  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: fr
  text: 'Voici : le feu est descendu du ciel et a dévoré les deux premiers chefs de cinquante ainsi que leurs groupes de cinquante. Mais maintenant, que ma vie soit précieuse à tes yeux !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Introduit avec emphase le fait invoqué. « Voici » conserve la valeur déictique de l’hébreu dans un registre narratif digne et naturel.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: le feu est descendu du ciel
  rationale: Rend directement le mouvement et son point d’origine, dans un français idiomatique.
- source_word: וַתֹּאכַל
  choice: a dévoré
  rationale: Avec le feu pour sujet, « dévorer » exprime naturellement l’image concrète du verbe אכל, littéralement « manger », et sa portée destructrice.
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: les deux premiers chefs de cinquante
  rationale: « Chef de cinquante » reflète le titre militaire et la taille de l’unité; « premiers » renvoie aux deux officiers précédents du récit.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: ainsi que leurs groupes de cinquante
  rationale: Explicite en français le sens collectif de l’expression hébraïque, littéralement « leurs cinquantaines », sans la réduire au terme plus vague « hommes ».
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Marque le contraste entre le sort des groupes précédents et la supplication personnelle qui suit.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: que ma vie soit précieuse à tes yeux
  rationale: « Vie » rend ici le sens concret de נֶפֶשׁ dans une demande de survie; « précieuse à tes yeux » conserve l’image et la nuance d’estime de l’hébreu.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans une supplication pour échapper à la mort
  choice: vie
  alternative: âme
  rationale: Le chef demande à ne pas subir le sort mortel des deux groupes précédents. « Vie » exprime ce sens contextuel sans imposer une conception dualiste que le passage n’exige pas.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’appel emphatique initial, le langage militaire et l’image hébraïque « précieuse à tes yeux », tout en explicitant naturellement le collectif « groupes de cinquante ».
