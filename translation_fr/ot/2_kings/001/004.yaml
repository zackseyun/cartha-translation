  text: וְ/לָ/כֵן֙ כֹּֽה אָמַ֣ר יְהוָ֔ה הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּ֣י מ֣וֹת תָּמ֑וּת וַ/יֵּ֖לֶךְ אֵלִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh : « Tu ne descendras pas du lit sur lequel tu es monté[a], car tu mourras certainement. » Puis Élie s’en alla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « le lit où tu es monté là »; la formulation souligne le contraste entre « monter » et « descendre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: C’est pourquoi
  rationale: Exprime clairement, en français actuel, la conséquence du reproche et du jugement qui précèdent.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Rend naturellement la formule du messager prophétique tout en conservant le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme dans le texte hébreu.
- source_word: הַמִּטָּה
  choice: le lit
  rationale: Terme courant et suffisamment précis; « lit de malade » ajouterait une précision contextuelle absente du mot hébreu lui-même.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: sur lequel tu es monté
  rationale: Conserve le verbe de montée et son opposition intentionnelle avec « descendre », tout en évitant de reproduire le pronom adverbial hébreu de manière maladroite en français.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: Tu ne descendras pas du lit
  rationale: Préserve le contraste vertical entre עלה, « monter », et ירד, « descendre ».
- source_word: כִּי מוֹת תָּמוּת
  choice: car tu mourras certainement
  rationale: L’adverbe « certainement » rend la valeur intensive de l’infinitif absolu suivi du verbe conjugué.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: Puis Élie s’en alla
  rationale: Rend la progression narrative du waw consécutif et le sens simple de הלך dans un français naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin; sa transcription maintient la distinction entre ce nom propre et les titres divins.
- issue: Certitude de la mort annoncée
  choice: tu mourras certainement
  alternative: tu mourras
  rationale: La formulation retient l’intensification explicite produite en hébreu par מוֹת תָּמוּת, sans expliquer davantage la nature du jugement.
translation_notes:
  register: Français international moderne, clair et digne. La tournure volontairement marquée « monter sur le lit / descendre du lit » conserve l’image et le contraste verbal de l’hébreu sans reproduire sa syntaxe résomptive de façon artificielle.
