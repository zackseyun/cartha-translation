  terminology: « Chef de cinquante », « Homme de Dieu », « Élie », « serviteurs » et « vie » sont appropriés. Le titre « Homme de Dieu » conserve sa valeur prophétique reconnue sans ajout doctrinal. La note sur néfèsh est adéquate et son ancrage [a] est correct.
