  source_fidelity: 'Le sens général est fidèle au texte hébreu : l’action est répétée, il s’agit du troisième chef de cinquante et de son groupe, il monte et vient, s’agenouille devant Élie, le supplie, puis demande que sa vie et celle des cinquante soient précieuses aux yeux d’Élie. « Vie » rend correctement נֶפֶשׁ dans ce contexte de menace de mort. La formule « à tes yeux » préserve l’image de בְּעֵינֶיךָ.'
