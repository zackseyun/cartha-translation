  to: 'De nouveau, il envoya un troisième chef de cinquante avec ses cinquante hommes. Celui-ci monta et arriva. Le troisième chef de cinquante s’agenouilla devant Élie, le supplia et lui dit : « Homme de Dieu, je t’en prie, que ma vie[a] et celle de ces cinquante serviteurs qui te servent soient précieuses à tes yeux ! »'
