  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: fr
  text: 'De nouveau, il envoya un troisième chef de cinquante avec ses cinquante hommes. Celui-ci monta et arriva. Le troisième chef de cinquante s’agenouilla devant Élie, le supplia et lui dit : « Homme de Dieu, je t’en prie, que ma vie[a] et celle de ces cinquante serviteurs qui te servent soient précieuses à tes yeux ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon être » ou « mon âme ». Le mot hébreu néfèsh peut désigner la vie, la personne elle-même ou l’âme selon le contexte ; ici, il s’agit de vies menacées.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: De nouveau
  rationale: Dans cette séquence narrative, le verbe introduit la répétition de l’action du roi ; « De nouveau » restitue naturellement cette valeur plutôt qu’un littéral « il revint ».
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: un troisième chef de cinquante hommes avec ses cinquante hommes
  rationale: La formulation conserve l’ordre ordinal et la fonction militaire. « Hommes » explicite en français le groupe de cinquante naturellement sous-entendu par l’hébreu.
- source_word: וַיַּעַל וַיָּבֹא
  choice: Celui-ci monta et arriva
  rationale: Les deux verbes de mouvement sont conservés, tout en identifiant naturellement en français le nouveau sujet, le troisième chef.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  choice: se mit à genoux
  rationale: Expression française naturelle qui rend précisément la posture d’humilité sans renforcer le verbe en suggérant une chute.
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: le supplia
  rationale: Le verbe exprime une demande pressante et humble ; « supplia » convient au danger immédiat.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Homme de Dieu
  rationale: Titre prophétique traditionnel et transparent, ici employé comme apostrophe directe.
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: je t’en prie, que ... soient précieuses à tes yeux
  rationale: Cette formulation conserve l’image hébraïque de ce qui a du prix aux yeux de quelqu’un, plutôt que de l’aplatir en « épargne ».
- source_word: נַפְשִׁי וְנֶפֶשׁ
  choice: ma vie et celle de
  rationale: Dans ce contexte de menace mortelle, נֶפֶשׁ désigne la vie des personnes. La reprise par « celle » évite une répétition lourde en français.
- source_word: עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  choice: ces cinquante serviteurs qui sont à toi
  rationale: La formulation conserve à la fois le nombre, le démonstratif et la relation de service envers Élie, sans remplacer « serviteurs » par l’interprétation plus étroite « soldats ».
theological_decisions:
- issue: Sens de נֶפֶשׁ dans un récit où les personnes risquent de mourir
  choice: vie
  alternative: âme
  rationale: Le capitaine demande que lui-même et ses hommes ne meurent pas. « Vie » rend le sens contextuel sans importer une conception anthropologique ultérieure ; l’autre possibilité lexicale est signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le texte maintient les répétitions narratives significatives et l’image « précieuses à tes yeux », tout en employant des tournures françaises naturelles.
