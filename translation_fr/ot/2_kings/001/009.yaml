  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֣עַל אֵלָ֗י/ו וְ/הִנֵּה֙ יֹשֵׁב֙ עַל רֹ֣אשׁ הָ/הָ֔ר וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים הַ/מֶּ֥לֶךְ דִּבֶּ֖ר רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: fr
  text: 'Alors il envoya vers lui un chef de cinquante hommes avec ses cinquante hommes. Celui-ci monta vers lui : Élie était là, assis au sommet de la colline[a]. Il lui dit : « Homme de Dieu, le roi dit[b] : “Descends !” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la montagne ». Le mot hébreu הַר peut désigner une colline ou une montagne selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le roi a parlé : “Descends !” » La formule hébraïque employée par un messager est rendue ici de façon idiomatique par « le roi dit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors il envoya
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement cette succession narrative en français.
- source_word: שַׂר חֲמִשִּׁים
  choice: un chef de cinquante hommes
  rationale: L’expression désigne un officier commandant une unité de cinquante hommes. Cette formulation reste claire et proche de l’hébreu.
- source_word: וַחֲמִשָּׁיו
  choice: avec ses cinquante hommes
  rationale: Le suffixe possessif rattache les cinquante hommes au chef ; « avec » rend naturellement leur accompagnement.
- source_word: וַיַּעַל אֵלָיו
  choice: Celui-ci monta vers lui
  rationale: עלה indique ici un déplacement vers le haut, puisque l’homme de Dieu se trouve au sommet.
- source_word: וְהִנֵּה
  choice: Élie était là
  rationale: Dans cette scène, « était là » restitue avec naturel la valeur présentative et visuelle de הִנֵּה sans recourir à l’archaïsme « voici ».
- source_word: יֹשֵׁב
  choice: assis
  rationale: Le participe décrit la posture continue d’Élie au moment où l’officier arrive.
- source_word: עַל רֹאשׁ הָהָר
  choice: au sommet de la colline
  rationale: רֹאשׁ désigne le sommet ; הַר peut désigner une colline ou une montagne. « Colline » convient au contexte, tandis que l’autre possibilité est conservée en note.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Il lui dit
  rationale: En français narratif, « dit » introduit naturellement le discours direct tout en rendant la fonction de דבר dans ce contexte.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Homme de Dieu
  rationale: Titre prophétique traditionnel et immédiatement compréhensible ; la majuscule initiale est exigée ici par le début de la réplique.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: le roi dit
  rationale: La formule de messager, littéralement « le roi a parlé », s’exprime idiomatiquement au présent en français, sans renforcer indûment le verbe en « ordonne ».
- source_word: רֵדָה
  choice: Descends !
  rationale: L’impératif de ירד demande un mouvement vers le bas. « Descends » est direct, naturel et ne surdétermine pas le point de vue déictique.
