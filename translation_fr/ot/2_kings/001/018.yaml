base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Les autres actes d’Ahazia, qu’il a accomplis, ne sont-ils pas écrits[a] dans le livre des Annales des rois d’Israël[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consignés ». L’hébreu dit littéralement « écrits », selon une formule habituelle renvoyant aux archives royales.
    reason: lexical_alternative
  - marker: b
    text: Le « livre des Annales des rois d’Israël » désigne une source royale citée dans les livres des Rois, et pas nécessairement le livre biblique des Chroniques.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans cette formule de conclusion royale, יֶתֶר désigne le reste et דִּבְרֵי les faits ou actes du roi, plutôt que ses seules paroles.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Forme française usuelle du nom propre biblique.
- source_word: אֲשֶׁר עָשָׂה
  choice: ce qu’il a fait
  rationale: Rend directement la proposition relative hébraïque dans un français naturel.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: n’est-il pas écrit
  rationale: Conserve la question rhétorique qui attend une réponse affirmative; le singulier français s’accorde naturellement avec « le reste ».
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Littéralement « sur le livre/rouleau »; « dans le livre » est l’expression idiomatique française pour une source écrite.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les Annales
  rationale: Dans une référence aux archives royales, l’expression désigne une chronique annalistique; « Annales » évite de suggérer à tort le livre biblique des Chroniques.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Le לְ appartient ici au titre idiomatique du document et se rend naturellement par « des ».
