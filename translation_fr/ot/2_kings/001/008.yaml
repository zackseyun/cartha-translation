base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: fr
  text: 'Ils lui répondirent : « C’était un homme velu[a], avec une ceinture de cuir attachée autour de la taille. » Il dit : « C’est Élie le Tishbite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un homme revêtu d’un vêtement de poil ». L’expression hébraïque signifie littéralement « un possesseur de poil » et peut désigner soit un homme velu, soit un vêtement de poil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בַּעַל שֵׂעָר
  choice: un homme velu
  rationale: L’expression signifie littéralement « un homme maître/possesseur de poil ». « Un homme velu » en donne le sens descriptif le plus direct, tout en laissant en note l’interprétation possible d’un vêtement de poil.
- source_word: וְאֵזוֹר עוֹר
  choice: avec une ceinture de cuir
  rationale: אֵזוֹר désigne une ceinture et עוֹר en précise la matière. Cette formulation est claire et naturelle en français moderne.
- source_word: אָזוּר בְּמָתְנָיו
  choice: attachée autour de la taille
  rationale: Le participe אָזוּר indique que la ceinture est nouée ou portée, et מָתְנַיִם désigne la région des reins ou de la taille. La traduction évite l’expression vieillie « autour des reins ».
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Élie le Tishbite
  rationale: Le nom traditionnel français « Élie » est conservé, et le gentilé הַתִּשְׁבִּי est rendu par la forme conventionnelle « le Tishbite ».
- source_word: הוּא
  choice: C’est
  rationale: Dans cette identification fondée sur un signalement, « C’est Élie » est plus idiomatique en français que « Il est Élie ».
theological_decisions: []
