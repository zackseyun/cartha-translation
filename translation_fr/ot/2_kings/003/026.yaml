source:
  edition: WLC
  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: fr
  text: Quand le roi de Moab vit que le combat était trop fort pour lui, il prit avec lui sept cents hommes qui tiraient l’épée pour se frayer un passage jusqu’au roi d’Édom[a], mais ils n’y parvinrent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour se frayer un passage contre le roi d’Édom ». Dans ce contexte militaire, la préposition hébraïque peut marquer la direction (« vers ») ou l’hostilité (« contre »).
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: le combat était trop fort pour lui
  rationale: Cette formulation française naturelle conserve l’image hébraïque d’un combat devenu plus fort que le roi, c’est-à-dire qui prenait le dessus sur lui.
- source_word: אֹתוֹ
  choice: avec lui
  rationale: Après « il prit », la construction indique ici que le roi emmena cette troupe avec lui. Le complément associatif explicite rend la phrase intelligible en français.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: sept cents hommes
  rationale: « Hommes » traduit directement אִישׁ comme nom de comptage dans ce contexte militaire, sans ajouter l’interprétation « soldats ».
- source_word: שֹׁלֵף חֶרֶב
  choice: qui tiraient l’épée
  rationale: La traduction maintient l’image hébraïque de combattants tirant l’épée, plutôt que de l’aplanir en « armés ».
- source_word: לְהַבְקִיעַ
  choice: pour se frayer un passage
  rationale: Dans ce contexte militaire, le hifil de בקע décrit l’action de forcer les lignes adverses. « Se frayer un passage » est idiomatique et exprime clairement cette tentative de percée.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: jusqu’au roi d’Édom
  rationale: אֶל peut indiquer une direction ou une orientation hostile. « Jusqu’au » préserve ici le mouvement vers la position du roi d’Édom sans trancher implicitement la nuance hostile, signalée en note.
- source_word: וְלֹא יָכֹלוּ
  choice: mais ils n’y parvinrent pas
  rationale: Le verbe pluriel concerne le roi et ses hommes, qui échouent dans leur tentative. Cette tournure est concise et naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en employant des tournures militaires naturelles. L’ambiguïté de la préposition אֶל est conservée au moyen d’une note.
