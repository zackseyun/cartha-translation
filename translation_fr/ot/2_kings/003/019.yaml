  to: Vous attaquerez toutes les villes fortifiées et toutes les villes choisies[a]. Vous abattrez tous les bons arbres, vous boucherez toutes les sources d’eau et vous endommagerez avec des pierres toute bonne parcelle de terre[b].
  rationale: La révision remplace une explicitation trop forte du geste final par une formulation qui conserve le moyen indiqué (« avec des pierres ») et laisse à la note l’explication agricole probable. Elle adopte aussi « villes choisies », plus sobre et plus proche de l’ambiguïté lexicale de מִבְחוֹר.
