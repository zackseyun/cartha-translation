    issue: La formulation « en la couvrant de pierres » ajoute une modalité non explicitement formulée par l’hébreu.
    rationale: Le texte dit littéralement de maltraiter/endommager chaque bonne parcelle « avec des pierres ». Le geste est probablement l’épandage de pierres, mais « couvrir » peut suggérer une couverture complète et doit être réservé à l’explication de note.
  - severity: low
    issue: « Villes de premier choix » est légèrement idiomatique-commercial et moins directement calqué sur la notion de villes choisies.
    rationale: מִבְחוֹר évoque ce qui est choisi, d’élite ou excellent. « Villes choisies » conserve l’ambiguïté sans qualifier plus précisément leur valeur ou statut.
