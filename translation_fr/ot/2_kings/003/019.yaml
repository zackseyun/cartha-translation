  text: וְ/הִכִּיתֶ֞ם כָּל עִ֤יר מִבְצָר֙ וְ/כָל עִ֣יר מִבְח֔וֹר וְ/כָל עֵ֥ץ טוֹב֙ תַּפִּ֔ילוּ וְ/כָל מַעְיְנֵי מַ֖יִם תִּסְתֹּ֑מוּ וְ/כֹל֙ הַ/חֶלְקָ֣ה הַ/טּוֹבָ֔ה תַּכְאִ֖בוּ בָּ/אֲבָנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: fr
  text: Vous attaquerez toutes les villes fortifiées et toutes les villes choisies[a]. Vous abattrez tous les bons arbres, vous boucherez toutes les sources d’eau et vous endommagerez avec des pierres toute bonne parcelle de terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les villes de premier choix » ou « toutes les meilleures villes ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vous ferez souffrir avec des pierres ». L’expression hébraïque désigne vraisemblablement la dégradation de terres agricoles par l’épandage de pierres.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: vous attaquerez
  rationale: Dans ce contexte militaire, le hiphil de נכה appliqué à des villes signifie les frapper ou les attaquer. « Attaquer » est naturel en français sans présumer qu’elles seront toutes conquises.
- source_word: כָּל עִיר מִבְצָר
  choice: toutes les villes fortifiées
  rationale: מִבְצָר désigne une fortification ou une place forte ; « ville fortifiée » est l’expression française courante et précise.
- source_word: וְכָל עִיר מִבְחוֹר
  choice: toutes les villes de premier choix
  rationale: מִבְחוֹר qualifie ce qui est choisi, excellent ou remarquable. « De premier choix » conserve cette valeur sans préciser indûment s’il s’agit des plus belles, des meilleures ou des plus importantes.
- source_word: וְכָל עֵץ טוֹב תַּפִּילוּ
  choice: vous abattrez tous les bons arbres
  rationale: Le hiphil de נפל exprime ici le fait de faire tomber les arbres. « Abattre » est l’équivalent français idiomatique ; « bons arbres » préserve la généralité de טוֹב, qui peut évoquer des arbres utiles, précieux ou productifs.
- source_word: וְכָל מַעְיְנֵי מַיִם תִּסְתֹּמוּ
  choice: vous boucherez toutes les sources d’eau
  rationale: סתם signifie fermer ou obstruer, et מַעְיְנֵי מַיִם désigne des sources naturelles. « Boucher » exprime clairement l’action de les rendre inutilisables.
- source_word: וְכֹל הַחֶלְקָה הַטּוֹבָה
  choice: toute bonne parcelle de terre
  rationale: חֶלְקָה désigne une portion ou parcelle de terrain, souvent cultivée. « Parcelle de terre » reste proche du sens sans réduire nécessairement le terme à un champ précis.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: vous rendrez impropre à la culture … en la couvrant de pierres
  rationale: Le hiphil de כאב signifie littéralement « faire souffrir » ou « endommager ». Dans ce contexte agricole, l’action consiste à détériorer la terre avec des pierres ; la formulation française explicite l’effet concret tout en signalant le geste dans le texte.
