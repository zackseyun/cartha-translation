translation_notes:
  register: Français international moderne, digne et direct. Le futur rend les formes verbales hébraïques dans la continuité de l’annonce prophétique. La répétition de « toutes/tous » conserve l’insistance distributive de כָּל, tandis que la dernière proposition est légèrement explicitée pour rendre intelligible l’image agricole inhabituelle.
