id: 2KI.3.18
reference: 2 Kings 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָקַ֥ל זֹ֖את בְּ/עֵינֵ֣י יְהוָ֑ה וְ/נָתַ֥ן אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: fr
  text: 'Et cela est peu de chose aux yeux de Yahweh[a] : il livrera aussi Moab entre vos mains.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et cela est facile aux yeux de Yahweh. »'
    reason: Le terme hébreu peut désigner soit quelque chose de peu d’importance, soit quelque chose de facile à accomplir.
lexical_decisions:
- source_word: וְנָקַל
  choice: Et cela est peu de chose
  rationale: Le verbe exprime ici ce qui est léger, facile ou de faible importance. « Peu de chose » conserve l’évaluation implicite tout en restant idiomatique en français.
- source_word: זֹאת
  choice: cela
  rationale: Le démonstratif renvoie à l’eau que Yahweh vient de promettre de fournir, mentionnée dans le contexte précédent.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression conserve l’image hébraïque d’une estimation ou d’un jugement et demeure naturelle en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וְנָתַן
  choice: il livrera aussi
  rationale: Dans cette parole prophétique, la forme verbale annonce un résultat futur. « Aussi » fait ressortir l’acte supplémentaire annoncé après le don de l’eau; « livrera » exprime idiomatiquement la remise au pouvoir de quelqu’un.
- source_word: אֶת מוֹאָב
  choice: Moab
  rationale: Le texte nomme directement Moab comme royaume ou peuple pris collectivement.
- source_word: בְּיֶדְכֶם
  choice: entre vos mains
  rationale: L’expression française conserve l’image de la main tout en exprimant clairement la mise au pouvoir des destinataires.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin lui-même; « Yahweh » le conserve comme nom propre sans lui substituer un titre.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve les idiomes « aux yeux de » et « entre vos mains », courants et intelligibles en français biblique contemporain.
