  text: וַ/יְהִ֖י כְּ/מ֣וֹת אַחְאָ֑ב וַ/יִּפְשַׁ֥ע מֶֽלֶךְ מוֹאָ֖ב בְּ/מֶ֥לֶךְ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/005.yaml
  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: fr
  text: À la mort d’Achab[a], le roi de Moab se révolta contre le roi d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Après la mort d’Achab ». L’expression hébraïque peut situer la révolte à la mort d’Achab ou dans la période qui suivit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמוֹת
  choice: À la mort de
  rationale: La construction narrative suivie de כְּ avec l’infinitif construit de מות situe la révolte au moment de la mort d’Achab. « À la mort de » est naturel en français et conserve la valeur temporelle sans préciser davantage la succession exacte.
- source_word: אַחְאָב
  choice: Achab
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: וַיִּפְשַׁע
  choice: se révolta
  rationale: Dans ce contexte politique, פשע désigne la rupture de soumission d’un vassal envers son suzerain. « Se révolta » exprime clairement cette action en français moderne.
- source_word: מֶלֶךְ מוֹאָב
  choice: le roi de Moab
  rationale: Rendu direct et idiomatique de la chaîne construite hébraïque.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: contre le roi d’Israël
  rationale: Avec פשע, la préposition בְּ introduit la personne contre laquelle la révolte est dirigée ; « contre » est l’équivalent français idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le tour « À la mort de » évite le calque lourd « Et il arriva, quand… » tout en conservant le lien temporel et l’ambiguïté relative de l’hébreu.
