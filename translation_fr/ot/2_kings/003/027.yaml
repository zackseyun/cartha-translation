base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: fr
  text: Alors il prit son fils premier-né, celui qui devait régner à sa place, et l’offrit en holocauste sur la muraille. Il y eut une grande colère contre Israël[a] ; ils se retirèrent de lui et rentrèrent dans leur pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ne précise pas d’où venait cette grande colère. Elle peut être comprise comme une colère divine, la fureur moabite ou le profond désarroi d’Israël après le sacrifice.
    reason: Préserver une ambiguïté réelle du texte source et signaler les principales lectures possibles sans en imposer une.
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: son fils premier-né
  rationale: « Premier-né » rend précisément בְּכוֹר et conserve à la fois le lien familial et l’importance dynastique du fils.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: celui qui devait régner à sa place
  rationale: Cette formulation naturelle indique qu’il était le successeur désigné tout en reflétant תַּחְתָּיו, « à sa place ».
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: l’offrit en holocauste
  rationale: Le verbe à la forme causative associé à עֹלָה appartient au langage sacrificiel. « Offrir en holocauste » en restitue clairement la portée sans atténuer l’horreur de l’acte.
- source_word: עַל הַחֹמָה
  choice: sur la muraille
  rationale: « Muraille » désigne naturellement ici le mur fortifié de la ville sans qu’il soit nécessaire d’ajouter « de la ville ».
- source_word: קֶצֶף גָּדוֹל
  choice: une grande colère
  rationale: קֶצֶף exprime une colère ou une indignation intense. « Grande colère » reste direct et, surtout, n’en précise pas la source.
- source_word: עַל יִשְׂרָאֵל
  choice: contre Israël
  rationale: Avec קֶצֶף, la préposition עַל marque naturellement l’orientation hostile de la colère contre Israël.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: ils se retirèrent loin de lui
  rationale: נסע peut évoquer la levée du camp et le départ. Dans ce contexte militaire, cette traduction indique que les assaillants cessèrent l’opération menée contre le roi de Moab.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: rentrèrent dans leur pays
  rationale: Le sujet est constitué des forces coalisées. Le possessif explicite naturellement en français la destination comprise dans le contexte.
theological_decisions:
- issue: Identité de la source de la « grande colère contre Israël »
  choice: Conserver l’expression indéterminée « une grande colère contre Israël ».
  alternative: Préciser qu’il s’agit de la colère divine, de la fureur des Moabites ou du désarroi d’Israël.
  rationale: L’hébreu ne nomme ni l’auteur ni la source de cette colère. La traduction maintient donc l’ambiguïté et la tension du texte plutôt que de trancher entre plusieurs interprétations.
translation_notes:
  register: Français international moderne, digne et accessible. « Holocauste » conserve le terme sacrificiel traditionnel et précis ; la syntaxe reste sobre afin de préserver la force brutale du récit. Le marqueur de note est placé après « contre Israël », expression à laquelle la note se rapporte.
