  variant: modern international French
source:
  edition: WLC
  text: וִ/יהוֹרָ֣ם בֶּן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: fr
  text: Joram, fils d’Achab, devint roi d’Israël à Samarie la dix-huitième année du règne de Josaphat, roi de Juda[a]. Il régna douze ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Et Joram, fils d’Achab, devint roi d’Israël… » La conjonction hébraïque peut être rendue simplement par « et ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: Joram
  rationale: Le nom royal est rendu selon sa forme française biblique usuelle. Le waw initial assure la continuité narrative, que le français exprime naturellement sans ajouter ici « et ».
- source_word: בֶּן אַחְאָב
  choice: fils d’Achab
  rationale: Désignation filiale directe et naturelle en français, sans article.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule chronologique, le verbe signale l’accession au trône; ce choix le distingue du verbe suivant, qui indique la durée du règne.
- source_word: עַל יִשְׂרָאֵל
  choice: d’Israël
  rationale: Après « roi », le complément introduit par « de » est l’expression française idiomatique de la souveraineté sur Israël.
- source_word: בְּ/שֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition locative désigne ici la ville capitale; en français, on dit naturellement « à Samarie ».
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: la dix-huitième année du règne
  rationale: Formulation française claire du synchronisme royal; « du règne » explicite naturellement la valeur chronologique sans modifier le sens.
- source_word: לִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: de Josaphat, roi de Juda
  rationale: Dans ce synchronisme, ל indique que l’année est comptée relativement au règne de Josaphat.
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Il régna douze ans
  rationale: Ici, מלך décrit la durée du pouvoir royal. Une nouvelle phrase évite une coordination lourde et reste fidèle à la progression de l’hébreu.
