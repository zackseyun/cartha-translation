base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: fr
  text: Au matin, au moment où l’on présentait l’offrande de céréales[a], voici que de l’eau arrivait du côté d’Édom[b], et le pays se remplit de cette eau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au moment où montait l’offrande ». Dans le langage sacrificiel, cette expression désigne la présentation de l’offrande sur l’autel.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « par le chemin d’Édom » ou « en provenance d’Édom ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit littéralement « le pays se remplit de l’eau », c’est-à-dire de l’eau qui vient d’être mentionnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Au matin
  rationale: La formule narrative introduit l’événement suivant. « Au matin » rend naturellement l’indication temporelle sans recourir à une tournure archaïque comme « il advint ».
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: au moment où l’on présentait l’offrande de céréales
  rationale: עלה signifie littéralement « monter », mais, dans ce contexte cultuel, désigne la présentation de l’offrande sur l’autel. L’imparfait exprime le déroulement concomitant, et « offrande de céréales » précise le sens cultuel de מִנְחָה.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette formule attire vivement l’attention sur l’apparition inattendue de l’eau, avec une dignité plus naturelle en français moderne que « voici » isolé ou « soudain ».
- source_word: מַיִם בָּאִים
  choice: de l’eau arrivait
  rationale: Le français traite « eau » comme un nom massif. Le participe hébreu présente l’eau en train d’arriver ou comme un phénomène observable; l’imparfait en conserve la valeur durative.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: du côté d’Édom
  rationale: דֶּרֶךְ désigne littéralement le chemin ou la voie, mais la construction indique ici la provenance ou la direction. « Du côté d’Édom » est idiomatique tout en gardant cette nuance géographique.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: le pays se remplit de cette eau
  rationale: הָאָרֶץ désigne ici le territoire ou la région, non la terre entière. « Cette eau » reprend explicitement l’eau qui vient d’être mentionnée et reflète la détermination de הַמָּיִם, tout en restant naturel en français.
