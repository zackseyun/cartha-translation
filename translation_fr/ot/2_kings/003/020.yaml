translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » conserve la vivacité du récit biblique sans archaïsme excessif. « Offrande de céréales » emploie un terme cultuel clair pour le grand public; « le pays » maintient la portée territoriale de הָאָרֶץ.
