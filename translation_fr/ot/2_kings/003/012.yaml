  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט יֵ֥שׁ אוֹת֖/וֹ דְּבַר יְהוָ֑ה וַ/יֵּרְד֣וּ אֵלָ֗י/ו מֶ֧לֶךְ יִשְׂרָאֵ֛ל וִ/יהוֹשָׁפָ֖ט וּ/מֶ֥לֶךְ אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: fr
  text: 'Josaphat dit : « La parole de Yahweh est avec lui[a]. » Alors le roi d’Israël, Josaphat et le roi d’Édom descendirent auprès de lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a une parole de Yahweh. »'
    reason: La construction יֵשׁ אֹתוֹ peut être comprise comme une tournure possessive, et דְּבַר peut ici désigner un message prophétique particulier.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe narratif אמר introduit ici directement les paroles de Josaphat ; le passé simple convient au registre narratif français.
- source_word: יֵשׁ אֹתוֹ
  choice: est avec lui
  rationale: La construction existentielle avec אֹתוֹ peut exprimer la présence ou la possession. « Est avec lui » reste proche de la forme hébraïque tout en indiquant que la révélation divine se trouve auprès d’Élisée.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette formulation conserve l’expression prophétique traditionnelle et sa possible portée générale, sans la réduire d’emblée à un message particulier.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter explicitement le tétragramme du texte source.
- source_word: וַיֵּרְדוּ
  choice: descendirent
  rationale: Le verbe ירד désigne un mouvement vers le bas ; « descendirent » préserve cette indication directionnelle dans un français narratif naturel.
- source_word: אֵלָיו
  choice: auprès de lui
  rationale: La préposition indique un mouvement vers Élisée. « Auprès de lui » évite la répétition de « à lui » et exprime naturellement qu’ils se rendent en sa présence.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Rendu direct du titre et du nom territorial.
- source_word: וִיהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française biblique courante du nom propre יהושפט.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: et le roi d’Édom
  rationale: La coordination et le titre du texte hébreu sont conservés.
theological_decisions:
- issue: Rapport entre דְּבַר יְהוָה et Élisée
  choice: « La parole de Yahweh est avec lui »
  alternative: « Il a une parole de Yahweh »
  rationale: 'Le choix principal conserve l’ambiguïté de la construction : Josaphat peut affirmer que la parole révélée de Yahweh accompagne Élisée ou qu’Élisée détient un message venant de lui. La variante est signalée en note plutôt que d’imposer une seule interprétation.'
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple soutient le récit historique ; « auprès de lui » est idiomatique sans effacer le mouvement descendant exprimé par ירד.
