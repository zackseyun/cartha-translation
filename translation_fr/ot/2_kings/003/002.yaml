base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh, mais pas comme son père et sa mère[a]. Il enleva le pilier de Baal[b] que son père avait fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « seulement, pas comme son père et sa mère ». La particule hébraïque apporte une restriction : sa conduite était mauvaise, sans être comparable à celle de ses parents, probablement quant au degré.'
    reason: lexical_alternative
  - marker: b
    text: Ou « la pierre dressée de Baal » ou « la stèle cultuelle de Baal ». Le terme hébreu désigne une pierre ou un pilier dressé associé ici au culte de Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Il fit ce qui est mal
  rationale: L’expression hébraïque עשה + הרע signifie agir mal ou faire ce qui est mal. Cette formulation française est naturelle tout en conservant l’évaluation morale du texte.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette tournure conserve l’image de l’idiome hébraïque et exprime clairement qu’il s’agit de l’évaluation de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte hébreu.
- source_word: רַק
  choice: mais
  rationale: Ici, la particule introduit une restriction à l’évaluation précédente. « Mais » rend naturellement cette nuance concessive en français.
- source_word: לֹא כְאָבִיו וּכְאִמּוֹ
  choice: pas comme son père et sa mère
  rationale: La traduction garde la comparaison directe avec les deux parents sans préciser au-delà du texte s’il s’agit surtout de la nature ou du degré de leur conduite.
- source_word: וַיָּסַר
  choice: car il enleva
  rationale: Le verbe signifie enlever ou écarter. « Car » exprime le lien explicatif probable avec la restriction précédente, bien que l’hébreu emploie la coordination narrative.
- source_word: מַצְּבַת הַבַּעַל
  choice: la stèle de Baal
  rationale: מַצֵּבָה désigne une pierre dressée, souvent à fonction cultuelle. « Stèle » est précis et idiomatique, tandis qu’une note conserve les autres formulations possibles.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: que son père avait érigée
  rationale: Dans le contexte d’une stèle, « ériger » rend naturellement l’action exprimée par עשה. Le plus-que-parfait marque que cette action précède son enlèvement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de la comparaison avec les parents
  choice: pas comme son père et sa mère
  alternative: pas autant que son père et sa mère
  rationale: La formulation retenue préserve l’ambiguïté de la comparaison hébraïque. Le contexte suggère une différence de degré, mais le verset ne l’explicite pas entièrement.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe demeure proche du récit hébreu, tout en employant des articulations naturelles. Les notes signalent la nuance restrictive de רַק et la portée cultuelle de מַצֵּבָה sans surinterpréter le texte.
