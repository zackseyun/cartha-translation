  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: fr
  text: Ils se levèrent de bon matin. Le soleil brillait sur l’eau, et les Moabites virent, en face d’eux, l’eau rouge comme du sang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Ils se levèrent de bon matin
  rationale: La forme causative de שׁכם exprime le fait de se lever ou de partir tôt. « Se levèrent de bon matin » rend naturellement l’insistance temporelle en français courant et digne.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: Le soleil brillait sur l’eau
  rationale: זרח peut évoquer le lever ou l’éclat du soleil. Ici, la lumière tombant sur l’eau explique l’apparence observée; « brillait sur l’eau » préserve cette valeur contextuelle.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: et les Moabites virent
  rationale: Le nom propre « Moab » désigne collectivement le peuple. En français moderne, « les Moabites » évite que le territoire soit compris comme sujet voyant, sans modifier le référent.
- source_word: מִנֶּגֶד
  choice: en face d’eux
  rationale: Le terme indique une position vis-à-vis, en face ou de l’autre côté. « En face d’eux » conserve la relation spatiale sans ajouter l’idée incertaine de distance.
- source_word: אֶת הַמַּיִם אֲדֻמִּים כַּדָּם
  choice: l’eau rouge comme du sang
  rationale: L’adjectif pluriel s’accorde en hébreu avec מַיִם, morphologiquement pluriel, tandis que le français traite « eau » au singulier. La comparaison directe « comme du sang » garde l’image vive du texte.
