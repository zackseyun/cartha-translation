  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: fr
  text: Ils démolirent les villes et, sur chaque bonne parcelle de terre[a], chacun jeta sa pierre et la remplit. Ils bouchèrent toutes les sources d’eau et abattirent tous les bons arbres[b], jusqu’à ne laisser que les pierres de Kir-Haréset[c]. Alors, les frondeurs l’encerclèrent et la frappèrent[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque bon champ ». Le mot hébreu désigne une parcelle ou une portion de terre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tous les bons arbres »; il peut s’agir plus précisément d’arbres précieux ou productifs.
    reason: lexical_alternative
  - marker: c
    text: Kir-Haréset est un nom de lieu, probablement celui de la principale ville fortifiée de Moab dans ce contexte.
    reason: cultural_note
  - marker: d
    text: Ou « l’attaquèrent ». Le verbe hébreu signifie littéralement « frapper » et désigne ici une action militaire contre la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: Ils démolirent les villes
  rationale: Le verbe הרס exprime concrètement l’action d’abattre ou de démolir; « villes » convient aux agglomérations visées dans ce contexte militaire.
- source_word: חֶלְקָה טוֹבָה
  choice: bonne parcelle de terre
  rationale: חֶלְקָה désigne une portion ou parcelle de terrain; cette formulation conserve la portée agricole sans préciser indûment qu’il s’agit toujours d’un champ.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: chacun jeta sa pierre, jusqu’à la remplir
  rationale: « Chacun… sa pierre » reproduit la distribution singulière de l’hébreu. « Jusqu’à la remplir » exprime naturellement le résultat cumulatif, le suffixe féminin renvoyant à la parcelle.
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: Ils bouchèrent toutes les sources d’eau
  rationale: סתם signifie obstruer ou boucher; « sources d’eau » rend clairement מַעְיַן מַיִם.
- source_word: עֵץ טוֹב יַפִּילוּ
  choice: abattirent tous les bons arbres
  rationale: Le hifil de נפל signifie ici faire tomber. La traduction garde le sens large de « bons arbres » sans imposer « arbres fruitiers ».
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: Il ne resta finalement à Kir-Haréset que ses pierres
  rationale: Cette formulation rend le résultat de la dévastation et conserve l’ambiguïté du référent féminin de « ses pierres », probablement la ville ou la place.
- source_word: וַיָּסֹבּוּ הַקַּלָּעִים
  choice: les frondeurs l’encerclèrent
  rationale: הַקַּלָּעִים désigne les soldats maniant la fronde; סבב exprime ici l’encerclement.
- source_word: וַיַּכּוּהָ
  choice: la frappèrent
  rationale: נכה signifie littéralement frapper. Dans ce contexte, il décrit une attaque militaire, mais la formulation française conserve l’image verbale du texte source.
