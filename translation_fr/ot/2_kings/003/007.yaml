base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: fr
  text: 'Il partit donc et envoya ce message à Josaphat, roi de Juda : « Le roi de Moab s’est révolté contre moi.[a] Iras-tu avec moi faire la guerre à Moab ? » Josaphat répondit : « J’irai[b]. Moi comme toi, mon peuple comme ton peuple, mes chevaux comme tes chevaux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’est affranchi de mon autorité ». Le verbe hébreu peut désigner une révolte politique ou une rupture d’allégeance ; ici, il s’agit de la rébellion de Moab contre la domination israélite.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Je monterai ». Le verbe peut évoquer un déplacement vers un lieu plus élevé ou un départ en campagne militaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Il partit donc
  rationale: Le waw consécutif fait progresser le récit. « Partit donc » exprime naturellement la succession narrative sans surinterpréter la destination.
- source_word: וַיִּשְׁלַח אֶל
  choice: envoya ce message à
  rationale: Avec un destinataire suivi de paroles rapportées, le verbe désigne idiomatiquement l’envoi d’un message.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Josaphat, roi de Juda
  rationale: Les formes françaises usuelles des noms bibliques sont retenues, et la construction hébraïque est rendue directement.
- source_word: פָּשַׁע בִּי
  choice: s’est révolté contre moi
  rationale: Dans ce contexte politique, פשע désigne la révolte d’un vassal ou la rupture de son allégeance.
- source_word: הֲתֵלֵךְ אִתִּי אֶל מוֹאָב לַמִּלְחָמָה
  choice: Marcheras-tu avec moi contre Moab pour lui faire la guerre ?
  rationale: « Marcher avec » convient à une expédition militaire, tandis que « contre Moab » et « pour lui faire la guerre » rendent la direction et le but hostile de l’expression hébraïque.
- source_word: אֶעֱלֶה
  choice: J’irai
  rationale: עלה signifie littéralement « monter », mais peut désigner le départ en campagne. « J’irai » est naturel en français; le sens littéral est conservé en note.
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: Moi comme toi, mon peuple comme ton peuple, mes chevaux comme tes chevaux
  rationale: La formulation elliptique conserve le rythme et la force du serment de solidarité sans ajouter de verbes absents de l’hébreu.
