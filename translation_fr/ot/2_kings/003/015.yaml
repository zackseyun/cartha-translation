  text: וְ/עַתָּ֖ה קְחוּ לִ֣/י מְנַגֵּ֑ן וְ/הָיָה֙ כְּ/נַגֵּ֣ן הַֽ/מְנַגֵּ֔ן וַ/תְּהִ֥י עָלָ֖י/ו יַד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: fr
  text: Mais maintenant, faites-moi venir un musicien[a]. Pendant que le musicien jouait, la main de Yahweh[b] fut sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un instrumentiste ». L’hébreu désigne de manière générale une personne qui joue de la musique, sans préciser l’instrument.
    reason: lexical_alternative
  - marker: b
    text: « La main de Yahweh » est une expression hébraïque qui évoque ici la puissance divine ou l’influence prophétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: Cette expression marque une transition immédiate après les paroles précédentes. « Mais maintenant » rend naturellement le changement de mouvement du discours.
- source_word: קְחוּ לִי
  choice: faites-moi venir
  rationale: L’impératif pluriel accompagné du pronom datif demande aux interlocuteurs de procurer ou d’amener quelqu’un au locuteur. Cette formulation est idiomatique en français.
- source_word: מְנַגֵּן
  choice: un musicien
  rationale: Le participe de נגן désigne une personne qui joue d’un instrument, sans préciser lequel. « Musicien » conserve cette généralité.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: Pendant que le musicien jouait
  rationale: La construction introduit la circonstance temporelle dans laquelle survient l’action suivante. La formulation française reste fluide sans reproduire lourdement la formule narrative hébraïque.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: L’image hébraïque peut évoquer la puissance ou l’influence prophétique de Dieu. Le maintien de « main » préserve l’image et évite d’en préciser excessivement le sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre.
- source_word: וַתְּהִי עָלָיו
  choice: vint sur lui
  rationale: La tournure exprime ici la survenue de l’action divine. « Vint sur lui » conserve cette valeur événementielle ainsi que l’image de l’original.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre présent dans la source.
- issue: Interprétation de יַד יְהוָה
  choice: la main de Yahweh vint sur lui
  alternative: la puissance de Yahweh le saisit ; l’inspiration de Yahweh vint sur lui
  rationale: Dans le contexte, l’expression peut désigner une puissance ou une influence prophétique, mais la traduction garde l’image hébraïque et ne tranche pas davantage que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tandis que l’image biblique de « la main de Yahweh » est conservée. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
