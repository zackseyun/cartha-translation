source:
  edition: WLC
  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: fr
  text: Toutefois, il resta attaché aux péchés de Jéroboam, fils de Nebath, qui avait entraîné Israël dans le péché ; il ne s’en détourna pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Toutefois
  rationale: Dans ce contexte, la particule introduit une restriction qui nuance l’appréciation précédente du roi. « Toutefois » rend naturellement cette opposition en français.
- source_word: בְּחַטֹּאות
  choice: aux péchés
  rationale: Avec דבק, la préposition exprime l’attachement. La tournure française idiomatique est « rester attaché aux péchés ».
- source_word: חַטֹּאות
  choice: péchés
  rationale: Le nom conserve le jugement moral et religieux explicite du texte sans réduire ces actes à de simples pratiques politiques ou cultuelles.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Forme française traditionnelle et claire du nom propre et du patronyme hébreux.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: qui avait entraîné Israël dans le péché
  rationale: Le hifil de חטא a une valeur causative. « Entraîner dans le péché » exprime clairement que les actes de Jéroboam ont conduit Israël à pécher, tout en restant naturel en français.
- source_word: דָּבֵק
  choice: il resta attaché
  rationale: Le verbe exprime une adhésion persistante. « Resta attaché » convient à la formule narrative et souligne la continuité de cette conduite.
- source_word: לֹא סָר מִמֶּנָּה
  choice: il ne s’en détourna pas
  rationale: Cette expression française rend naturellement l’idée de ne pas abandonner une ligne de conduite. Le pronom « en » reprend collectivement les péchés mentionnés.
theological_decisions:
- issue: Formule d’évaluation de l’infidélité royale
  choice: Conserver les termes explicites « péchés » et « péché »
  alternative: Employer des termes plus neutres comme « pratiques » ou « égarements »
  rationale: Le texte hébreu porte un jugement théologique explicite sur la conduite associée à Jéroboam. Le vocabulaire du péché préserve ce jugement sans y ajouter de précision confessionnelle.
- issue: Référent de la proposition relative אֲשֶׁר הֶחֱטִיא
  choice: Rattacher « qui avait entraîné Israël dans le péché » à Jéroboam
  alternative: Comprendre les péchés comme le moyen par lequel Jéroboam a fait pécher Israël
  rationale: La formule hébraïque habituelle et l’accord verbal singulier désignent naturellement Jéroboam comme celui qui a conduit Israël au péché. Ses péchés restent implicitement le moyen de cette influence.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le contraste initial, le vocabulaire moral du texte et la persistance exprimée par דבק, sans lourdeur littérale.
