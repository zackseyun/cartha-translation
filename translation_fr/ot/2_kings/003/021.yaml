base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: fr
  text: Tout Moab apprit que les rois étaient montés pour lui faire la guerre. Tous ceux qui étaient en âge de ceindre une ceinture et plus âgés furent convoqués[a], et ils prirent position à la frontière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent rassemblés » ou « furent mobilisés ». Dans ce contexte, le verbe hébreu désigne vraisemblablement une convocation militaire plutôt qu’un simple appel ou cri.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis quiconque ceint une ceinture et au-dessus ». Cette expression désigne les hommes ayant atteint l’âge requis, puis les plus âgés.'
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: Tout Moab
  rationale: Le nom collectif désigne ici l’ensemble du peuple ou du pays de Moab. « Tout Moab » conserve cette formulation sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: שָׁמְעוּ
  choice: apprit
  rationale: Dans ce contexte de nouvelle rapportée, שׁמע signifie qu’une information est parvenue à Moab. « Apprit » est naturel en français narratif.
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: que les rois étaient montés
  rationale: Le plus-que-parfait situe la montée des rois avant la mobilisation moabite, tandis que « monter » préserve la valeur directionnelle de עלה.
- source_word: לְהִלָּחֶם בָּם
  choice: pour lui faire la guerre
  rationale: Le pronom renvoie au collectif « Moab »; le singulier « lui » évite en français de donner l’impression que les rois vont se combattre entre eux.
- source_word: וַיִּצָּעֲקוּ
  choice: Tous furent convoqués
  rationale: La forme et le contexte indiquent une convocation ou mobilisation collective plutôt qu’un simple cri. Le passif préserve la présentation hébraïque sans préciser l’auteur de l’appel.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: depuis ceux qui étaient en âge de porter la ceinture jusqu’aux plus âgés
  rationale: La traduction maintient l’image concrète de la ceinture tout en explicitant la progression d’âge exprimée par « et au-dessus ».
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: et ils prirent position à la frontière
  rationale: « Prirent position » rend la valeur militaire contextuelle de עמד tout en conservant la localisation à la frontière.
