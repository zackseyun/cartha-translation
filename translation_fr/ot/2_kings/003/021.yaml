revisions:
- from: Tout Moab apprit que les rois étaient montés pour lui faire la guerre. Tous furent convoqués[a], depuis ceux qui étaient en âge de porter la ceinture jusqu’aux plus âgés[b], et ils prirent position à la frontière.
  to: Tout Moab apprit que les rois étaient montés pour lui faire la guerre. Tous ceux qui étaient en âge de ceindre une ceinture et plus âgés furent convoqués[a], et ils prirent position à la frontière[b].
  rationale: 'La révision conserve le passif de la mobilisation et le sens collectif de Moab, tout en plaçant la catégorie mobilisée au sujet de la phrase. « Ceindre une ceinture » restitue plus exactement l’image hébraïque, et « et plus âgés » rend directement la valeur de « et au-dessus ». Les ancres ont été déplacées : la note lexicale sur la convocation suit le verbe concerné, et la note culturelle suit l’expression idiomatique concernée.'
