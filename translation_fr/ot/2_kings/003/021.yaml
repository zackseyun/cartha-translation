review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Moab apprend l’avancée des rois, une mobilisation est décrite, puis les Moabites se postent à la frontière. « Furent convoqués » rend bien la forme passive de וַיִּצָּעֲקוּ dans ce contexte. La formulation de l’expression liée à la ceinture peut toutefois être resserrée afin de mieux conserver l’image de « ceindre une ceinture » et la borne inférieure suivie de « et au-dessus ».'
  naturalness: Le français est globalement clair et de registre narratif soutenu. « Porter la ceinture » est moins précis et moins naturel ici que « ceindre une ceinture », puisque la ceinture représente l’aptitude ou l’âge de mobilisation. « Tous furent convoqués » peut aussi sembler inclure sans restriction l’ensemble de Moab avant que le complément n’en précise la catégorie ; « on convoqua tous ceux… » est plus fluide mais ajouterait un sujet indéfini. Le passif peut être conservé avec une formulation plus cohérente.
  terminology: « Tout Moab », « faire la guerre », « frontière » et « prirent position » conviennent. Aucune question théologique ou de nom propre ne se pose. La note doit présenter l’expression comme un idiome de mobilisation sans affirmer un âge précis absent du texte.
  issues:
  - severity: low
    issue: « porter la ceinture » affaiblit l’image idiomatique hébraïque.
    rationale: חֹגֵר חֲגֹרָה signifie littéralement « ceignant une ceinture ». En français, « ceindre une ceinture » conserve mieux l’image et évite de suggérer simplement le fait habituel de porter une ceinture.
  - severity: low
    issue: La construction « depuis ceux qui étaient en âge de porter la ceinture jusqu’aux plus âgés » explicite davantage que nécessaire la limite supérieure.
    rationale: וָמַעְלָה signifie « et au-dessus / et plus âgés ». Une formulation qui garde « et plus âgés » préserve plus directement l’ouverture de l’expression sans la transformer en intervalle fermé.
  revised_text: Tout Moab apprit que les rois étaient montés pour lui faire la guerre. Tous ceux qui étaient en âge de ceindre une ceinture et plus âgés furent convoqués[a], et ils prirent position à la frontière[b].
  revised_footnotes:
  - marker: a
    text: Ou « furent rassemblés » ou « furent mobilisés ». Dans ce contexte, le verbe hébreu désigne vraisemblablement une convocation militaire plutôt qu’un simple appel ou cri.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « depuis quiconque ceint une ceinture et au-dessus ». Cette expression désigne les hommes ayant atteint l’âge requis, puis les plus âgés.'
    reason: cultural_note
  revision_rationale: 'La révision conserve le passif de la mobilisation et le sens collectif de Moab, tout en plaçant la catégorie mobilisée au sujet de la phrase. « Ceindre une ceinture » restitue plus exactement l’image hébraïque, et « et plus âgés » rend directement la valeur de « et au-dessus ». Les ancres ont été déplacées : la note lexicale sur la convocation suit le verbe concerné, et la note culturelle suit l’expression idiomatique concernée.'
