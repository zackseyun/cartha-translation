  text: וַ/יֹּ֕אמֶר אֵי זֶ֥ה הַ/דֶּ֖רֶךְ נַעֲלֶ֑ה וַ/יֹּ֕אמֶר דֶּ֖רֶךְ מִדְבַּ֥ר אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: fr
  text: 'Il demanda : « Par quel chemin monterons-nous ? » Il répondit : « Par le chemin du désert d’Édom. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il demanda / Il répondit
  rationale: Le même verbe hébreu אמר introduit les deux prises de parole. En français, « demanda » puis « répondit » rendent naturellement leur fonction respective dans le dialogue, sans modifier le contenu.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Par quel chemin
  rationale: L’expression interrogative אֵי זֶה associée à דֶּרֶךְ demande quelle voie emprunter. « Par quel chemin » est idiomatique en français et prépare directement la réponse indiquant l’itinéraire.
- source_word: נַעֲלֶה
  choice: monterons-nous
  rationale: Le verbe עלה signifie ici « monter » ou « partir en campagne ». « Monterons-nous » conserve l’image spatiale et la portée du verbe sans ajouter explicitement une nuance militaire.
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: Par le chemin du désert d’Édom
  rationale: La réponse nominale désigne l’itinéraire. « Par » est fourni par le contexte français, tandis que « chemin du désert d’Édom » suit simplement la construction hébraïque et maintient la répétition de דֶּרֶךְ.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Forme française traditionnelle et courante du nom propre.
