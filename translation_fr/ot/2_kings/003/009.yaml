  text: וַ/יֵּלֶךְ֩ מֶ֨לֶךְ יִשְׂרָאֵ֤ל וּ/מֶֽלֶך יְהוּדָה֙ וּ/מֶ֣לֶךְ אֱד֔וֹם וַ/יָּסֹ֕בּוּ דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא הָיָ֨ה מַ֧יִם לַֽ/מַּחֲנֶ֛ה וְ/לַ/בְּהֵמָ֖ה אֲשֶׁ֥ר בְּ/רַגְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: fr
  text: Alors le roi d’Israël partit avec le roi de Juda et le roi d’Édom. Ils firent un détour de sept jours, mais il n’y avait pas d’eau pour le camp ni pour les animaux qui les accompagnaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui étaient à leurs pieds », expression désignant ici les animaux qui les accompagnaient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Le verbe הלך introduit ici le départ de l’expédition. « Partit » rend naturellement le mouvement sans imposer au verbe une nuance militaire qui vient seulement du contexte.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: le roi d’Israël ... le roi de Juda et le roi d’Édom
  rationale: La répétition du titre conserve la coordination hébraïque et met clairement en valeur l’alliance des trois rois.
- source_word: וַיָּסֹבּוּ דֶּרֶךְ שִׁבְעַת יָמִים
  choice: Ils suivirent un itinéraire détourné pendant sept jours
  rationale: סבב indique un déplacement indirect ou un détour, tandis que דֶּרֶךְ שִׁבְעַת יָמִים exprime l’étendue du trajet. Cette formulation française conserve les deux éléments sans donner l’impression qu’ils tournèrent simplement en rond.
- source_word: וְלֹא הָיָה מַיִם
  choice: il n’y avait pas d’eau
  rationale: Traduction directe et idiomatique de la proposition existentielle hébraïque.
- source_word: לַמַּחֲנֶה
  choice: pour le camp
  rationale: מַחֲנֶה peut désigner le camp ou les troupes qui y sont rassemblées. « Le camp » préserve cette amplitude de sens.
- source_word: וְלַבְּהֵמָה
  choice: pour les bêtes
  rationale: Le singulier collectif בְּהֵמָה désigne les animaux domestiques ou de transport accompagnant l’expédition. « Les bêtes » est naturel et n’en restreint pas indûment la catégorie.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: qui les accompagnaient
  rationale: L’expression signifie littéralement « qui étaient à leurs pieds » et désigne ici les animaux qui allaient avec eux. Le sens idiomatique figure dans le texte, et l’image littérale est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La première phrase respecte le singulier du verbe appliqué au roi d’Israël, puis la seconde reprend le pluriel hébreu pour les trois rois. La note est placée après l’expression qu’elle explique.
