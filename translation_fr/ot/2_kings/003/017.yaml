  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: fr
  text: 'Car voici ce que dit Yahweh : « Vous ne verrez ni vent ni pluie, mais ce lit de torrent[a] se remplira d’eau, et vous, vos troupeaux et vos bêtes, vous boirez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce ravin » ou « ce cours d’eau saisonnier ». Le mot hébreu נַחַל désigne souvent un oued, c’est-à-dire un cours d’eau temporaire ou son lit.
    reason: Signaler l’étendue sémantique du terme géographique hébreu et expliquer le choix d’une expression française accessible.
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que dit
  rationale: Cette tournure rend la valeur explicative de כִּי et la formule déclarative כֹה אָמַר dans un français moderne et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin exprimé directement par le tétragramme, plutôt que substitution par un titre.
- source_word: לֹא תִרְאוּ רוּחַ וְלֹא תִרְאוּ גֶשֶׁם
  choice: Vous ne verrez ni vent ni pluie
  rationale: Le futur convient au contexte prophétique. La construction française avec « ni… ni… » restitue naturellement le parallélisme négatif sans modifier le sens météorologique de רוּחַ.
- source_word: הַנַּחַל הַהוּא
  choice: ce lit de torrent
  rationale: נַחַל peut désigner un cours d’eau saisonnier ou son lit, souvent à sec. « Lit de torrent » est plus immédiatement compréhensible en français international que « oued » et convient au cadre aride.
- source_word: יִמָּלֵא מָיִם
  choice: se remplira d’eau
  rationale: 'Le nifal exprime ici le résultat : le lit de torrent deviendra plein d’eau.'
- source_word: וּשְׁתִיתֶם
  choice: vous boirez
  rationale: Le futur poursuit naturellement la suite des événements annoncés.
- source_word: מִקְנֵיכֶם וּבְהֶמְתְּכֶם
  choice: vos troupeaux et vos bêtes
  rationale: 'Cette formulation conserve les deux termes hébreux sans les confondre : מִקְנֶה désigne les animaux possédés ou les troupeaux, tandis que בְּהֵמָה désigne plus largement les bêtes.'
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte hébreu porte explicitement יְהוָה. « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La citation directe met clairement en relief l’oracle. La répétition emphatique « vous, vos troupeaux et vos bêtes » suit la structure hébraïque tout en restant intelligible.
