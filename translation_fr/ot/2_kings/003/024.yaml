source:
  edition: WLC
  text: וַ/יָּבֹאוּ֮ אֶל מַחֲנֵ֣ה יִשְׂרָאֵל֒ וַ/יָּקֻ֤מוּ יִשְׂרָאֵל֙ וַ/יַּכּ֣וּ אֶת מוֹאָ֔ב וַ/יָּנֻ֖סוּ מִ/פְּנֵי/הֶ֑ם ו/יבו בָ֔/הּ וְ/הַכּ֖וֹת אֶת מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: fr
  text: Lorsqu’ils arrivèrent au camp d’Israël, Israël se leva et frappa Moab. Moab prit la fuite devant Israël. Puis les Israélites y pénétrèrent[a] et continuèrent à frapper Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « ils entrèrent en elle ». Le suffixe féminin désigne probablement la terre ou le territoire de Moab. Autres traductions possibles : « ils entrèrent dans le pays » ou « ils avancèrent en Moab ».'
    reason: L’antécédent du suffixe féminin בָּהּ n’est pas exprimé et demeure implicite ; la note préserve cette ambiguïté tout en indiquant son sens géographique probable.
lexical_decisions:
- source_word: מַחֲנֵה
  choice: camp
  rationale: Dans ce contexte militaire, « camp » est le terme français le plus direct et naturel.
- source_word: וַיָּקֻמוּ
  choice: se leva
  rationale: Le verbe קום introduit ici une réaction militaire résolue. « Se leva » conserve l’image et la vivacité du récit sans expliciter davantage par « attaqua ».
- source_word: וַיַּכּוּ / וְהַכּוֹת
  choice: frappa / continuèrent à frapper
  rationale: נכה désigne l’action de frapper ou d’abattre. La première forme exprime l’action principale; l’infinitif final suggère sa continuation, rendue naturellement par « continuèrent à frapper ».
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: s’enfuit devant lui
  rationale: Moab et Israël sont traités comme des collectivités au singulier en français. « S’enfuir devant » restitue l’expression hébraïque et l’idée de déroute.
- source_word: וַיָּבֹאוּ בָהּ
  choice: les Israélites y pénétrèrent
  rationale: Le pronom adverbial « y » rend avec naturel l’entrée ou l’avancée dans un lieu tout en évitant de préciser abusivement l’antécédent du suffixe féminin. « Les Israélites » clarifie le sujet après les collectivités singulières Israël et Moab.
- source_word: מוֹאָב
  choice: Moab
  rationale: Le nom collectif est conservé comme dans l’hébreu, où il peut désigner le peuple, son armée ou son territoire selon le contexte.
