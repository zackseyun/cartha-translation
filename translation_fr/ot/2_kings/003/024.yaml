translation_notes:
  register: Français international moderne, narratif et digne. Les noms collectifs « Israël » et « Moab » restent au singulier, tandis que « les Israélites » est employé dans la dernière phrase pour lever une ambiguïté de sujet devenue peu naturelle en français.
