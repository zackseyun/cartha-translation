    rationale: Cette tournure est peu naturelle en français moderne et le pluriel « les regards » ajoute une nuance absente du texte. « Je ne te regarderais pas et ne te verrais pas » conserve simplement les deux verbes hébreux.
  - severity: low
    issue: Tournure « lui devant qui je me tiens »
    rationale: Le pronom détaché est superflu et alourdit la phrase. « Devant qui je me tiens » traduit l’expression sans perte.
  - severity: low
