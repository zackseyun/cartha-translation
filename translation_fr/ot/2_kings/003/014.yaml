revisions:
- from: 'Élisée dit : « Yahweh des armées est vivant, lui devant qui je me tiens[a] ! Si je ne tenais pas compte de la présence de Josaphat, roi de Juda[b], je ne porterais pas les regards vers toi et ne te verrais même pas. »'
  to: 'Élisée dit : « Aussi vrai que Yahweh, le Dieu des armées, est vivant, devant qui je me tiens[a], si je n''avais pas d''égards pour Josaphat, roi de Juda[b], je ne te regarderais pas et ne te verrais pas. »'
