base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: fr
  text: 'Élisée dit : « Aussi vrai que Yahweh, le Dieu des armées, est vivant, devant qui je me tiens[a], si je n''avais pas d''égards pour Josaphat, roi de Juda[b], je ne te regarderais pas et ne te verrais pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant la face de qui je me tiens ». L’expression peut aussi évoquer le service prophétique : « que je sers ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « si ce n’était par égard pour Josaphat, roi de Juda ». L’hébreu emploie une expression avec le mot « face » et le verbe « lever », qui signifie ici accorder considération ou faveur à quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: Yahweh des armées est vivant
  rationale: Cette formulation conserve la formule hébraïque solennelle de serment et rend directement le nom divin, tout en employant le titre français traditionnel « des armées ».
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: lui devant qui je me tiens
  rationale: La traduction maintient l’image concrète de se tenir devant Dieu, qui peut aussi évoquer le service du prophète, sans réduire l’expression à cette seule interprétation.
- source_word: לוּלֵי פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: si je ne tenais pas compte de la présence de Josaphat
  rationale: La construction associe littéralement la « face » de Josaphat au fait de la « relever » ou d’y avoir égard. Cette formulation française exprime naturellement la considération accordée à sa présence.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: je ne porterais pas les regards vers toi et ne te verrais même pas
  rationale: Dans cette formule de serment, אִם introduit une conséquence négative implicite. Les deux verbes hébreux restent distincts, et « même pas » fait entendre leur intensification sans les confondre.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Josaphat, roi de Juda
  rationale: Ces formes correspondent aux noms bibliques français usuels et identifient clairement le roi et son royaume.
theological_decisions:
- issue: Traduction du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin. Le rendre par « Yahweh » préserve sa valeur de nom propre plutôt que de lui substituer un titre.
- issue: Portée de la posture prophétique devant Dieu
  choice: lui devant qui je me tiens
  alternative: que je sers
  rationale: L’expression peut désigner le service prophétique, mais sa forme imagée demeure ouverte et ne doit pas être remplacée dans le texte principal par une seule explicitation.
- issue: Force négative de la formule de serment
  choice: je ne porterais pas les regards vers toi et ne te verrais même pas
  alternative: je te regarderais et je te verrais
  rationale: Dans ce contexte, les אִם de l’apodose ont la valeur d’une négation solennelle implicite. L’expliciter en français transmet le sens de la formule sans faire d’Élisée l’auteur d’une affirmation positive contraire au contexte.
translation_notes:
  register: Français international moderne, solennel sans archaïsme marqué. Les noms propres suivent l’usage biblique français courant. L’exclamation après la formule de serment en restitue la vigueur, tandis que la syntaxe conditionnelle reste claire pour un lectorat général.
