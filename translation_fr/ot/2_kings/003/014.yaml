    issue: Rendu de l’idiome פְּנֵי ... אֲנִי נֹשֵׂא
    rationale: « Tenir compte de la présence » ne rend pas nettement l’idée idiomatique d’avoir égard à Josaphat / de lui accorder faveur ou considération. Il ne s’agit pas simplement de sa présence physique.
