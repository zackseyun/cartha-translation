  text: וַ/יֹּ֕אמֶר כֹּ֖ה אָמַ֣ר יְהוָ֑ה עָשֹׂ֛ה הַ/נַּ֥חַל הַ/זֶּ֖ה גֵּבִ֥ים גֵּבִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
translation:
  language: fr
  text: 'Il dit : « Voici ce que dit Yahvé[a] : Creusez dans le lit de ce torrent[b] des fosses et encore des fosses[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Yahvé » transcrit le nom divin YHWH; traditionnellement : « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu peut désigner un torrent saisonnier, son lit, un ravin ou une vallée.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu dit littéralement : « Faites de ce lit de torrent des fosses, des fosses »; la répétition souligne leur grand nombre ou leur répartition dans tout le lit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol poursuit simplement le récit et introduit le discours direct; le français n’a pas besoin d’ajouter systématiquement « et ».
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahvé
  rationale: Formule française naturelle et digne qui conserve le caractère solennel de la formule prophétique de messager.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, plutôt que substitution par un titre.
- source_word: עָשֹׂה
  choice: Creusez
  rationale: Dans ce contexte, l’ordre de faire du lit du torrent des גבים implique concrètement l’excavation. « Creusez » exprime naturellement l’action en français sans préciser indûment la forme des cavités.
- source_word: הַנַּחַל הַזֶּה
  choice: dans le lit de ce torrent
  rationale: נחל peut désigner un cours d’eau saisonnier ou son lit. Le contexte d’un terrain sec destiné à recueillir l’eau favorise « lit de ce torrent », plus transparent en français international que « oued ».
- source_word: גֵּבִים גֵּבִים
  choice: des fosses et encore des fosses
  rationale: La répétition hébraïque a une valeur distributive ou intensive. Cette tournure conserve visiblement l’insistance et suggère de nombreuses fosses dans tout le lit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » conserve ici le nom propre tout en suivant sa forme française usuelle.
- issue: Valeur de l’impératif עָשֹׂה avec גֵּבִים גֵּבִים
  choice: Creusez … des fosses et encore des fosses
  alternative: Faites de ce ravin des fosses, des fosses
  rationale: Le sens pratique de l’ordre est de pratiquer de nombreuses excavations. La note conserve la formulation hébraïque plus littérale et son ambiguïté syntaxique.
translation_notes:
  register: Français moderne, international et digne. « Voici ce que dit » rend naturellement la formule prophétique; « lit de ce torrent » évite le régionalisme possible de « oued ». La répétition est maintenue sous une forme idiomatique afin de préserver l’emphase de l’hébreu.
