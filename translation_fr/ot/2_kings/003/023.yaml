review_pass:
  verdict: revise
  source_fidelity: Le sens de l’exclamation initiale, de la destruction réciproquement inférée, des coups portés mutuellement et du cri « au butin » est bien visé. Toutefois, « entre-détruits » est une formation très peu idiomatique en français moderne. La construction hébraïque חרב נחרבו est intensificatrice et peut aussi se comprendre plus littéralement comme « ont été complètement détruits » ; cette possibilité mérite une note, sans effacer l’interprétation contextuelle d’une destruction mutuelle.
  naturalness: « Se sont certainement détruits les uns les autres » est clair, idiomatique et garde une dignité narrative. La reprise « se sont frappés les uns les autres » reflète la seconde proposition hébraïque, même si elle est volontairement proche de la première.
  terminology: « Sang », « rois », « butin » et « Moab » conviennent. « Moab » comme apostrophe collective est possible en français et la note explicative est utile.
  issues:
  - severity: medium
    issue: « se sont certainement entre-détruits » n’est pas naturel en français moderne
    rationale: Le préfixe entre- ne se combine pas idiomatiquement avec « détruire » dans cet emploi. La formulation risque de distraire du sens narratif, alors que « se sont certainement détruits les uns les autres » rend la réciprocité de façon usuelle.
  - severity: low
    issue: Absence de note sur l’alternative textuelle/lexicale de la construction intensive
    rationale: L’hébreu peut se rendre plus littéralement par « ont été entièrement détruits ». Une note à l’ancre de la première affirmation préserve cette nuance sans imposer une lecture unique.
