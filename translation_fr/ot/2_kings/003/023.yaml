base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: fr
  text: 'Ils dirent : « C’est du sang ! Les rois se sont certainement détruits les uns les autres[a] ; ils se sont frappés les uns les autres. Maintenant, Moab[b], au butin ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les rois ont été complètement détruits. » L’hébreu emploie une forme intensive de « être détruit, dévasté » ; dans le contexte, les Moabites en concluent que les rois se sont retournés les uns contre les autres.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Moabites » ; le nom du pays désigne ici collectivement ses habitants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: C’est du sang !
  rationale: La proposition nominale hébraïque prend ici la forme d’une exclamation. Cette traduction conserve le démonstratif tout en restant naturelle en français.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: se sont certainement entre-détruits
  rationale: L’infinitif absolu suivi du verbe de même racine marque l’intensité ou la certitude. Le contexte et la proposition suivante indiquent que les Moabites supposent une destruction mutuelle entre les rois.
- source_word: הַמְּלָכִים
  choice: les rois
  rationale: Le pluriel défini désigne les souverains de la coalition mentionnés dans le contexte.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: ils se sont frappés les uns les autres
  rationale: La tournure אישׁ אֶת־רֵעֵהוּ exprime une action réciproque. La formulation française garde cette réciprocité sans préciser au-delà du texte s’ils se sont tués.
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Le terme introduit avec urgence l’exhortation qui découle de leur constat.
- source_word: לַשָּׁלָל
  choice: au butin
  rationale: Le ל directionnel et le nom שׁלל forment un cri bref invitant à aller prendre le butin.
- source_word: מוֹאָב
  choice: Moab
  rationale: Le nom du pays est employé comme apostrophe collective, conformément à la forme concise de l’hébreu.
theological_decisions:
- issue: Sens de הָחֳרֵב נֶחֶרְבוּ
  choice: se sont certainement entre-détruits
  alternative: ont certainement été dévastés / se sont certainement combattus
  rationale: La forme hébraïque met l’accent sur la dévastation, tandis que le contexte lui donne une portée réciproque. La traduction conserve à la fois l’idée de destruction et celle d’une action mutuelle, sans réduire le sens au seul fait de combattre.
translation_notes:
  register: Français moderne, vif et digne. Le discours direct garde le caractère précipité du constat et du cri de pillage. « Entre-détruits » est soutenu mais transparent et reflète mieux la force de חרב que le seul verbe « combattre ».
