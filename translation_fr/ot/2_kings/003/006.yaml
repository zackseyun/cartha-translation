  yaml_path: translation/ot/2_kings/003/006.yaml
  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: fr
  text: Ce jour-là, le roi Joram quitta Samarie et passa en revue tout Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dénombra tout Israël » ou « rassembla tout Israël ». Le verbe hébreu peut désigner un dénombrement ou une revue des troupes ; ici, le contexte favorise le sens militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: quitta
  rationale: Le verbe יצא exprime ici le départ depuis Samarie. « quitta » est naturel en français avec un complément d’origine et n’ajoute pas à lui seul une nuance militaire.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: le roi Joram
  rationale: Cette formulation rend naturellement en français la construction appositionnelle hébraïque. « Joram » est la forme française biblique courante du nom.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend précisément la référence temporelle tout en plaçant naturellement le cadre au début de la phrase.
- source_word: מִשֹּׁמְרוֹן
  choice: Samarie
  rationale: Avec « quitta », la provenance exprimée par מִן est intégrée directement et idiomatiquement au complément du verbe.
- source_word: וַיִּפְקֹד
  choice: passa en revue
  rationale: Dans le contexte d’une campagne militaire, פקד désigne vraisemblablement le recensement ou l’inspection des forces. « passa en revue » conserve cette portée militaire sans affirmer plus précisément qu’elles furent mobilisées.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Préserve l’expression collective hébraïque, qui peut désigner ici le peuple ou, dans le contexte, les forces du royaume du Nord.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le choix « passa en revue » reste accessible tout en conservant l’ambiguïté entre dénombrement et inspection militaire, explicitée dans la note.
