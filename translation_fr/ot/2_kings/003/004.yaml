base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: fr
  text: Mésha, roi de Moab, était éleveur de moutons. Il versait au roi d’Israël un tribut de cent mille agneaux et la laine de cent mille béliers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « cent mille béliers, laine ». Cette expression elliptique peut signifier « cent mille béliers avec leur laine » ou, plus probablement dans ce contexte, « la laine de cent mille béliers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: éleveur de moutons
  rationale: Le terme désigne une personne qui élève du petit bétail, particulièrement des moutons. « Éleveur de moutons » est clair, actuel et adapté au contexte économique.
- source_word: וְהֵשִׁיב
  choice: il versait
  rationale: Dans ce contexte, le hiphil de שׁוב exprime le fait de remettre régulièrement un paiement ou un tribut. L’imparfait français rend naturellement cette pratique habituelle.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: cent mille agneaux
  rationale: כָּרִים désigne ici des agneaux ou de jeunes béliers. « Agneaux » constitue une formulation naturelle dans cette liste de biens versés comme tribut.
- source_word: אֵילִים צָמֶר
  choice: la laine de cent mille béliers
  rationale: L’hébreu juxtapose « béliers » et « laine » dans une formulation elliptique. Cette traduction explicite le sens probablement visé tout en signalant l’ambiguïté dans une note.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: roi de Moab / roi d’Israël
  rationale: Traduction française normale des constructions nominales hébraïques, avec les noms géographiques sous leur forme française usuelle.
