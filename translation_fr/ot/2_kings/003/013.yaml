  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: fr
  text: 'Élisée dit au roi d’Israël : « Qu’y a-t-il entre moi et toi ?[a] Va trouver les prophètes de ton père et ceux de ta mère. » Le roi d’Israël lui répondit : « Non,[b] car Yahweh a appelé ces trois rois pour les livrer au pouvoir de Moab. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qu’y a-t-il à moi et à toi ? » Formule exprimant la distance ou le rejet.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Je t’en prie, ne dis pas cela, car Yahweh a appelé ces trois rois… » L’expression hébraïque est difficile et peut être comprise comme une supplication plutôt que comme une objection catégorique.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Qu’y a-t-il entre moi et toi ?
  rationale: Cette tournure française conserve la forme interrogative de l’idiome hébreu tout en exprimant naturellement la prise de distance ou le rejet.
- source_word: לֵךְ אֶל
  choice: Va trouver
  rationale: En français, « va trouver » rend naturellement le mouvement vers les prophètes impliqué par l’impératif suivi de אֶל.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: les prophètes de ton père et ceux de ta mère
  rationale: La formulation garde les références distinctes au père et à la mère tout en évitant une répétition lourde en français.
- source_word: אַל כִּי
  choice: Non, car
  rationale: L’expression hébraïque est difficile; dans ce contexte, elle introduit vraisemblablement une protestation du roi. La note signale la possibilité d’une supplication.
- source_word: קָרָא
  choice: a appelé
  rationale: Ce choix reste proche du verbe hébreu et peut évoquer le fait que Yahweh a réuni ou convoqué les trois rois.
- source_word: לָתֵת אוֹתָם בְּיַד מוֹאָב
  choice: pour les livrer au pouvoir de Moab
  rationale: « Livrer au pouvoir de » restitue clairement l’idiome de la main, qui désigne ici la domination, sans produire une expression française artificielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie le tétragramme; « Yahweh » en conserve la fonction de nom personnel.
- issue: Valeur de אַל כִּי dans la réponse du roi
  choice: 'Une objection : « Non, car… »'
  alternative: 'Une supplication : « Je t’en prie, ne dis pas cela, car… »'
  rationale: La syntaxe est elliptique et discutée. Le contexte permet une protestation brève, mais la note conserve l’autre lecture plausible.
- issue: Finalité ou résultat de l’appel des trois rois
  choice: pour les livrer
  alternative: de sorte qu’ils soient livrés
  rationale: L’infinitif לָתֵת peut exprimer le but ou le résultat. La traduction suit la lecture finale la plus directe sans développer davantage la causalité théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct; l’idiome hébreu de la « main » est explicité par « pouvoir », tandis que l’ambiguïté de la réponse du roi est préservée en note.
