  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: fr
  text: 'Alors le roi d’Israël dit : « Hélas ! Yahweh a appelé[a] ces trois rois pour les livrer aux mains de Moab[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a convoqué » ; le verbe hébreu signifie littéralement « appeler ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour les donner dans la main de Moab » ; cette expression hébraïque signifie les livrer au pouvoir de Moab.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession en français.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Rend directement la construction hébraïque et conserve le titre, puisque le roi n’est pas nommé dans ce verset.
- source_word: אֲהָהּ
  choice: Hélas !
  rationale: Cette interjection exprime la détresse ou la lamentation ; « Hélas ! » en garde la gravité dans un registre actuel et digne.
- source_word: כִּי
  choice: non exprimé séparément
  rationale: Après « Hélas ! », la proposition qui suit donne naturellement en français le motif de la détresse. Ajouter « car » alourdirait la réplique sans apporter de sens nécessaire.
- source_word: קָרָא
  choice: a appelé
  rationale: Conserve le sens premier du verbe, « appeler », sans préciser abusivement s’il s’agit de convoquer ou de réunir providentiellement les rois.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin représenté directement par le tétragramme dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ces trois rois
  rationale: Rend de façon idiomatique le nombre accompagné du démonstratif et désigne précisément la coalition déjà mentionnée.
- source_word: לָתֵת אֹתָם בְּיַד מוֹאָב
  choice: pour les livrer aux mains de Moab
  rationale: Rend comme une seule expression naturelle l’infinitif « donner » et l’idiome « dans la main de », qui signifie remettre au pouvoir d’un adversaire, tout en conservant l’image des mains.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom personnel divin. Sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Portée de קָרָא dans l’interprétation pessimiste du roi
  choice: a appelé
  alternative: a convoqué / a réuni
  rationale: « A appelé » reste au plus près du verbe hébreu et laisse ouverte la manière dont les trois rois ont été rassemblés. La finalité hostile perçue par le roi est exprimée dans la suite de sa déclaration.
- issue: Finalité divine affirmée par le roi
  choice: pour les livrer
  alternative: et il va les livrer
  rationale: L’infinitif hébreu exprime ici le but attribué à Yahweh par le roi. La traduction conserve cette affirmation comme parole du personnage, sans confirmer ni corriger son interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la vigueur de la lamentation et le nom divin, tout en rendant intelligible l’idiome hébraïque sans effacer son image.
