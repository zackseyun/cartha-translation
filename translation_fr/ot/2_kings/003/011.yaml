source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: fr
  text: 'Josaphat dit : « N’y a-t-il pas ici un prophète de Yahweh, afin que, par lui, nous consultions Yahweh[a] ? » Alors l’un des serviteurs du roi d’Israël répondit : « Élisée, fils de Shaphath, est ici, lui qui versait de l’eau sur les mains d’Élie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « afin que nous cherchions Yahweh par lui ». Il s’agit de consulter Yahweh par l’intermédiaire du prophète.'
    reason: lexical_alternative
  - marker: b
    text: Cette image évoque probablement le service personnel qu’Élisée rendait à Élie, notamment en lui versant de l’eau pour se laver les mains.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: N’y a-t-il pas
  rationale: Cette tournure interrogative française naturelle conserve la négation et la force de la question de Josaphat.
- source_word: נָבִיא לַיהוָה
  choice: un prophète de Yahweh
  rationale: La préposition marque ici la relation du prophète à Yahweh; « de Yahweh » est clair, naturel et proche de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: afin que, par lui, nous consultions Yahweh
  rationale: « Consulter Yahweh » exprime le sens contextuel de דרשׁ, tandis que « par lui » préserve le rôle médiateur du prophète sans préciser davantage le mécanisme de la révélation.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: l’un des serviteurs du roi d’Israël
  rationale: Dans ce contexte royal, עֶבֶד désigne un serviteur ou membre de l’entourage du roi; « serviteurs » reste sobre et suffisamment large.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: lui qui versait de l’eau sur les mains d’Élie
  rationale: L’imparfait français convient à une fonction habituelle passée et conserve l’image concrète du service personnel rendu à Élie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Médiation du prophète dans la consultation de Yahweh
  choice: par lui
  alternative: auprès de lui
  rationale: « Par lui » indique que la consultation de Yahweh s’effectue par l’intermédiaire du prophète, tout en évitant de présenter le prophète comme l’objet de la consultation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative demeure sobre; l’image hébraïque du versement d’eau est conservée plutôt que remplacée dans le texte par une explication comme « son assistant ».
