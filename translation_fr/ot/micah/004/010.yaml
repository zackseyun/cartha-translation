id: MIC.4.10
reference: Micah 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ח֧וּלִי וָ/גֹ֛חִי בַּת צִיּ֖וֹן כַּ/יּֽוֹלֵדָ֑ה כִּֽי עַתָּה֩ תֵצְאִ֨י מִ/קִּרְיָ֜ה וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה וּ/בָ֤את עַד בָּבֶל֙ שָׁ֣ם תִּנָּצֵ֔לִי שָׁ֚ם יִגְאָלֵ֣/ךְ יְהוָ֔ה מִ/כַּ֖ף אֹיְבָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/010.yaml
  text: Writhe and groan[a], daughter Zion, like a woman giving birth; for now you will go out from the city and dwell in the field, and you will go as far as Babylon. There you will be rescued[b]; there Yahweh will redeem you from the hand of your enemies.
translation:
  language: fr
  text: Tords-toi de douleur et gémis[a], fille de Sion, comme une femme qui accouche ! Car maintenant, tu vas sortir de la ville et demeurer dans les champs ; tu iras jusqu’à Babylone. Là, tu seras délivrée[b] ; là, Yahweh te rachètera de la main de tes ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pousse des cris ». Le verbe hébreu peut désigner un cri de douleur, ce qui convient à l’image de l’accouchement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu échapperas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ח֧וּלִי
  choice: Tords-toi de douleur
  rationale: L’impératif féminin évoque ici les contractions et les mouvements douloureux de l’accouchement. Cette formulation française rend clairement l’image physique sans la réduire à la seule peur.
- source_word: וָ/גֹ֛חִי
  choice: et gémis
  rationale: Le verbe désigne un cri ou un gémissement de douleur. « Gémis » s’accorde naturellement avec l’image de la femme qui accouche, tandis qu’une variante est signalée en note.
- source_word: בַּת צִיּ֖וֹן
  choice: fille de Sion
  rationale: Cette expression française consacrée et encore compréhensible conserve la personnification prophétique de Sion/Jérusalem.
- source_word: כַּ/יּֽוֹלֵדָ֑ה
  choice: comme une femme qui accouche
  rationale: La formulation explicite et naturelle conserve directement la comparaison avec une femme en train d’enfanter.
- source_word: מִ/קִּרְיָ֜ה
  choice: de la ville
  rationale: Le terme désigne ici la ville, comprise dans le contexte comme Sion/Jérusalem, sans qu’il soit nécessaire de remplacer le nom commun par une identification explicative.
- source_word: וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה
  choice: et demeurer dans les champs
  rationale: Le verbe exprime le fait de séjourner ou d’habiter, et שׂדה désigne l’espace rural hors de la ville. « Dans les champs » est idiomatique en français et n’ajoute pas explicitement une idée d’exposition absente du lexème.
- source_word: וּ/בָ֤את עַד בָּבֶל֙
  choice: tu iras jusqu’à Babylone
  rationale: « Jusqu’à » restitue la force de עַד, qui marque le terme atteint, tandis que « iras » convient au déplacement envisagé depuis la ville.
- source_word: שָׁ֣ם תִּנָּצֵ֔לִי
  choice: Là, tu seras délivrée
  rationale: Le niphal de נצל exprime ici la délivrance hors du danger. La tournure passive préserve la forme du texte et reste distincte du verbe גאל qui suit.
- source_word: יִגְאָלֵ֣/ךְ
  choice: te rachètera
  rationale: « Racheter » conserve la valeur relationnelle et restauratrice de גאל et évite de confondre ce verbe avec נצל, rendu juste auparavant par « délivrée ».
- source_word: יְהוָ֔ה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: מִ/כַּ֖ף אֹיְבָֽיִ/ךְ
  choice: de la main de tes ennemis
  rationale: La traduction conserve l’image hébraïque de la main comme symbole de pouvoir ou d’emprise, image également naturelle en français biblique courant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement sans lui substituer un titre.
- issue: Distinction entre נצל et גאל dans le contexte d’exil et de restauration
  choice: « délivrée » puis « rachètera »
  alternative: « sauvée » puis « délivrera »
  rationale: Deux verbes différents sont employés à proximité. Les rendre distinctement préserve la progression entre la délivrance du danger et l’action de rachat/restauration, sans imposer une explication doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement féminin singulier suit l’adresse personnifiée à la fille de Sion. La ponctuation met en relief l’appel initial et les deux occurrences emphatiques de « là ». Les métaphores de l’accouchement, de la main ennemie et du rachat sont conservées.
