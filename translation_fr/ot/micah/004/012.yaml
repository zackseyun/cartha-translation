id: MIC.4.12
reference: Micah 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵ֗מָּה לֹ֤א יָֽדְעוּ֙ מַחְשְׁב֣וֹת יְהוָ֔ה וְ/לֹ֥א הֵבִ֖ינוּ עֲצָת֑/וֹ כִּ֥י קִבְּצָ֖/ם כֶּ/עָמִ֥יר גֹּֽרְנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/012.yaml
  text: But they do not know the thoughts of Yahweh[a], and they do not understand his plan[b], for he has gathered them like sheaves to the threshing floor.
translation:
  language: fr
  text: 'Mais eux ne connaissent pas les pensées de Yahweh et ne comprennent pas son dessein[a] : il les a rassemblés comme des gerbes sur l’aire de battage[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son projet », « son conseil » ou « son intention ».
    reason: lexical_alternative
  - marker: b
    text: L’image évoque des gerbes rassemblées pour être battues ; dans ce contexte, elle suggère le jugement des peuples.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mais eux
  rationale: Le pronom explicite marque un contraste avec la perspective divine exposée ensuite ; « Mais eux » rend naturellement cette valeur en français.
- source_word: יָדְעוּ
  choice: ne connaissent pas
  rationale: L’accompli décrit ici leur ignorance actuelle ; le présent français convient à cette valeur résultative.
- source_word: מַחְשְׁבוֹת
  choice: les pensées
  rationale: Le pluriel peut désigner les pensées, intentions ou projets. « Pensées » conserve le sens lexical large et maintient une distinction avec עֲצָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הֵבִינוּ
  choice: ne comprennent pas
  rationale: Le verbe exprime la compréhension ou le discernement ; cette formulation est claire et naturelle en français moderne.
- source_word: עֲצָתוֹ
  choice: son dessein
  rationale: עֵצָה peut signifier conseil, projet ou dessein. « Dessein » exprime ici l’intention arrêtée de Yahweh sans confondre le terme avec מַחְשְׁבוֹת.
- source_word: כִּי
  choice: ':'
  rationale: Dans ce contexte, כִּי introduit l’explication de ce que les nations ignorent. Les deux-points rendent ce lien explicitatif avec naturel en français.
- source_word: קִבְּצָם
  choice: il les a rassemblés
  rationale: Le sujet implicite est Yahweh, et le suffixe désigne les peuples hostiles. Le passé composé présente le rassemblement comme accompli et pertinent pour la situation.
- source_word: כֶּעָמִיר
  choice: comme des gerbes
  rationale: עָמִיר désigne du grain coupé réuni en gerbe ou en tas ; « gerbes » restitue clairement l’image agricole.
- source_word: גֹּרְנָה
  choice: sur l’aire de battage
  rationale: Le hé directionnel indique le mouvement vers l’aire. En français, « rassembler sur l’aire » exprime naturellement la destination atteinte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Sujet implicite de קִבְּצָם
  choice: Yahweh rassemble les peuples hostiles
  alternative: Sujet indéterminé ; Sion comme sujet
  rationale: Yahweh est le référent le plus cohérent dans la proposition précédente, dont les nations ignorent précisément les pensées et le dessein. Le contexte suivant développe leur traitement sous l’image du battage.
- issue: Portée de l’image du battage
  choice: L’image suggère le jugement sans ajouter ce mot au corps du verset
  alternative: Expliciter « pour les juger » dans le texte
  rationale: Le rassemblement des gerbes sur l’aire implique leur battage et, dans le contexte, le jugement des nations ; conserver la métaphore évite toutefois de rendre explicite ce que l’hébreu laisse imagé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe contrastive et le parallélisme hébreu sont préservés sans raideur ; « aire de battage » maintient l’image agricole traditionnelle tout en étant éclairé par une note.
