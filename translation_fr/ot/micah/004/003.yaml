  text: וְ/שָׁפַ֗ט בֵּ֚ין עַמִּ֣ים רַבִּ֔ים וְ/הוֹכִ֛יחַ לְ/גוֹיִ֥ם עֲצֻמִ֖ים עַד רָח֑וֹק וְ/כִתְּת֨וּ חַרְבֹתֵי/הֶ֜ם לְ/אִתִּ֗ים וַ/חֲנִיתֹֽתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹֽא יִשְׂא֞וּ גּ֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ/ן ע֖וֹד מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/003.yaml
  text: And he will judge between many peoples[a], and will arbitrate for strong nations far away; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[c][b], nor will they learn war anymore.
translation:
  language: fr
  text: Il jugera entre de nombreux peuples et tranchera les différends de nations puissantes, même lointaines[a]. Ils transformeront leurs épées en socs de charrue[b] et leurs lances en serpes. Une nation ne lèvera plus l’épée contre une autre, et l’on n’apprendra plus à faire la guerre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il reprendra des nations puissantes, même lointaines » ou « il arbitrera leurs différends ».'
    reason: Le verbe hébreu peut exprimer la réprimande, la correction ou une décision rendue dans un différend.
  - marker: b
    text: 'Littéralement : « Ils martèleront leurs épées pour en faire des socs de charrue » ; le terme peut plus largement désigner des outils de labour.'
    reason: La note préserve l’image concrète du verbe כתת et l’étendue possible du nom אִתִּים.
  - marker: c
    text: 'Ou : « et l’on ne s’entraînera plus à la guerre ».'
    reason: L’expression hébraïque « apprendre la guerre » peut aussi désigner l’entraînement militaire.
lexical_decisions:
- source_word: וְשָׁפַט בֵּין עַמִּים רַבִּים
  choice: Il jugera entre de nombreux peuples
  rationale: « Juger entre » conserve le sens judiciaire de שׁפט et le rôle d’arbitre indiqué par בֵּין, tandis que « peuples » rend עַמִּים sans l’assimiler aux États-nations modernes.
- source_word: וְהוֹכִיחַ לְגוֹיִם עֲצֻמִים עַד רָחוֹק
  choice: et tranchera les différends de nations puissantes, jusqu’aux plus lointaines
  rationale: À la forme causative, יכח peut exprimer la réprimande, la correction ou le règlement d’un litige. Le parallélisme avec « jugera entre » favorise ici le sens judiciaire, sans effacer les autres possibilités, signalées en note. עַד רָחוֹק marque une portée qui s’étend au loin.
- source_word: וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים
  choice: Ils transformeront leurs épées en socs de charrue
  rationale: כתת évoque littéralement le fait de battre ou marteler. En français, « transformer en » rend naturellement le résultat concret de cette opération; la note conserve l’image littérale. אִתִּים désigne des outils ou pièces servant au labour.
- source_word: וַחֲנִיתֹתֵיהֶם לְמַזְמֵרוֹת
  choice: et leurs lances en serpes
  rationale: מַזְמֵרוֹת désigne des outils de taille. « Serpes » est concis, concret et traditionnel, tout en restant compréhensible en français moderne.
- source_word: לֹא יִשְׂאוּ גּוֹי אֶל גּוֹי חֶרֶב
  choice: Une nation ne lèvera plus l’épée contre une autre
  rationale: L’expression נשא חרב signifie lever ou prendre l’épée dans une intention hostile. La formulation distributive française rend naturellement la répétition de גּוֹי.
- source_word: וְלֹא יִלְמְדוּן עוֹד מִלְחָמָה
  choice: et l’on n’apprendra plus à faire la guerre
  rationale: למד מלחמה peut désigner l’apprentissage de la guerre ou l’entraînement militaire. La traduction principale reste proche du sens lexical, et la note indique l’autre nuance.
theological_decisions:
- issue: Référent du sujet singulier non exprimé des deux premiers verbes
  choice: Employer simplement « Il » sans identifier davantage le sujet dans ce verset
  alternative: Expliciter « le Seigneur », un dirigeant messianique, ou Sion/Jérusalem personnifiée
  rationale: L’hébreu porte un sujet masculin singulier implicite dont le référent dépend du contexte précédent. La traduction ne doit pas imposer dans ce verset une identification théologique que la proposition elle-même ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme prophétique est conservé par des propositions parallèles. « Socs de charrue » et « serpes » maintiennent l’imagerie agricole concrète sans archaïsme excessif; les ambiguïtés lexicales importantes sont signalées en notes.
