  - severity: low
    issue: Alternative de note « il arbitrera pour elles »
    rationale: « Arbitrer pour elles » peut suggérer que l’arbitre agit au bénéfice d’une partie. Dans ce contexte judiciaire, « il tranchera leurs différends » ou « il arbitrera leurs différends » est plus clair.
