  naturalness: Le registre est globalement naturel et digne. « Serpes » convient à l’outil de taille visé, et « socs de charrue » est idiomatique. La correction proposée améliore la fluidité de la seconde proposition et de sa note.
  terminology: « Peuples » / « nations » reflète utilement la distinction entre עַמִּים et גּוֹיִם. « Trancher les différends » exprime bien, dans le contexte, la fonction judiciaire de הוֹכִיחַ, tout en laissant la nuance de réprimande dans la note. Les notes conservent les alternatives lexicales pertinentes sans imposer d’interprétation théologique.
  issues:
