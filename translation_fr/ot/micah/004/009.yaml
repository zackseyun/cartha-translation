base_translation:
  language: en
  yaml_path: translation/ot/micah/004/009.yaml
  text: Why do you cry out so loudly? Is there no king in you? Has your counselor perished[c][b][a], that labor pains have seized you like a woman giving birth?
translation:
  language: fr
  text: Maintenant, pourquoi pousses-tu de si grands cris[a] ? N’y a-t-il pas de roi en toi[b] ? Ton conseiller a-t-il péri ? Car les douleurs de l’accouchement t’ont saisie[c], comme une femme qui enfante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pourquoi cries-tu si fort ? » Le verbe hébreu peut désigner un grand cri ou une clameur ; ici, le contexte évoque vraisemblablement un cri d’angoisse.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « N’y a-t-il pas de roi en toi ? » La ville est interpellée comme une femme.'
    reason: metaphor_clarification
  - marker: c
    text: 'Ou : « se sont emparées de toi » ou « t’ont étreinte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לָמָּה
  choice: Maintenant, pourquoi
  rationale: עַתָּה est un adverbe temporel explicite (« maintenant »), suivi de la question לָמָּה (« pourquoi »). La traduction conserve à la fois la transition temporelle et la force rhétorique.
- source_word: תָרִיעִי רֵעַ
  choice: pousses-tu de si grands cris
  rationale: Le verbe hiphil exprime ici l’émission d’un cri retentissant, et רֵעַ en précise l’intensité. Cette formulation française rend naturellement le cri fort et angoissé sans le réduire à une simple parole élevée.
- source_word: הֲמֶלֶךְ אֵין בָּךְ
  choice: N’y a-t-il pas de roi en toi ?
  rationale: La formulation conserve l’image littérale « en toi », adressée à la ville personnifiée, au lieu de l’aplanir en simple possession.
- source_word: יוֹעֲצֵךְ אָבָד
  choice: Ton conseiller a-t-il péri
  rationale: יוֹעֵץ désigne celui qui conseille, et אָבַד signifie ici périr ou disparaître. « Péri » préserve le caractère abrupt de la question sans préciser indûment la cause.
- source_word: הֶחֱזִיקֵךְ חִיל
  choice: les douleurs de l’accouchement t’aient saisie
  rationale: חִיל désigne dans ce contexte les douleurs liées à l’enfantement, comme le confirme la comparaison suivante. הֶחֱזִיקֵךְ évoque une emprise forte; « saisie » en garde la vigueur et marque le féminin de la destinataire.
- source_word: כַּיּוֹלֵדָה
  choice: comme une femme qui enfante
  rationale: Le participe féminin désigne une femme en train d’accoucher. « Qui enfante » conserve l’action et l’image vive du texte.
theological_decisions:
- issue: Personnification féminine de Sion ou Jérusalem
  choice: Maintenir l’adresse au féminin par « saisie » et par l’image de la femme qui enfante, sans nommer explicitement Sion ou Jérusalem.
  alternative: Ajouter « fille de Sion » ou neutraliser le genre de la destinataire.
  rationale: Les formes hébraïques sont au féminin singulier, mais le nom de la destinataire ne figure pas dans ce verset. La traduction conserve donc la personnification sans introduire une identification absente du texte immédiat.
- issue: Lien introduit par כִּי
  choice: « pour que », dans une construction interrogative exprimant le résultat qui appelle une explication.
  alternative: '« car » : « car les douleurs de l’accouchement t’ont saisie »; ou « puisque ».'
  rationale: Dans la suite des questions rhétoriques, כִּי relie la disparition supposée du conseiller à l’emprise des douleurs. « Pour que » reproduit de façon concise la tension logique du texte, sans trancher entièrement entre conséquence et explication causale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse prophétique au féminin singulier. « Enfante » garde une tonalité biblique sobre tout en restant courant. La ponctuation française et les espaces avant les points d’interrogation sont respectées.
