  yaml_path: translation/ot/micah/004/014.yaml
  text: Now muster yourself in troops[a], daughter of troops; a siege is set against us[c][b]. With a rod they strike the judge of Israel on the cheek.
translation:
  language: fr
  text: Maintenant, rassemble tes troupes[a], fille des troupes ! Un siège est établi contre nous. Ils frappent[b] le juge d’Israël[c] à la joue avec un bâton.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « taillade-toi » ou « fais-toi des incisions », si le verbe désigne ici des blessures volontaires plutôt que le rassemblement de troupes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils frapperont » ; dans ce contexte prophétique, l’inaccompli hébreu peut avoir une valeur future.'
    reason: lexical_alternative
  - marker: c
    text: L’expression « juge d’Israël » peut désigner plus largement son chef ou son dirigeant. Dans le contexte, certains y voient aussi une préfiguration messianique.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְגֹּדְדִי
  choice: rassemble tes troupes
  rationale: Le hitpolèl de גדד peut évoquer soit le fait de se taillader, soit celui de se regrouper en bandes. Le contexte militaire, renforcé par « fille des troupes » et le siège, favorise ici l’idée de rassembler des troupes, tout en maintenant l’autre sens en note.
- source_word: בַת גְּדוּד
  choice: fille des troupes
  rationale: La tournure hébraïque personnifie une ville ou une communauté. La traduction littérale conserve cette image et le jeu lexical avec le verbe précédent.
- source_word: מָצוֹר שָׂם עָלֵינוּ
  choice: On nous assiège
  rationale: Cette formulation française naturelle rend l’idée d’un siège établi contre « nous » sans imposer d’identité au sujet indéterminé du verbe hébreu.
- source_word: בַּשֵּׁבֶט
  choice: à coups de bâton
  rationale: שֵׁבֶט peut désigner un bâton, une verge ou un sceptre. Dans l’action de frapper, « bâton » est le sens concret le plus naturel; la locution « à coups de » restitue l’instrument et la violence de l’acte.
- source_word: יַכּוּ
  choice: ils frappent
  rationale: L’inaccompli hébreu peut avoir une valeur présente vive ou future dans ce contexte prophétique. Le présent décrit vivement la scène; le futur possible est signalé en note.
- source_word: עַל הַלְּחִי
  choice: sur la joue
  rationale: « Joue » rend naturellement לְחִי et souligne l’humiliation publique infligée au dirigeant.
- source_word: שֹׁפֵט יִשְׂרָאֵל
  choice: le juge d’Israël
  rationale: Cette traduction directe conserve le terme שֹׁפֵט et n’explicite pas prématurément s’il s’agit d’un juge au sens strict, d’un chef ou d’un roi.
theological_decisions:
- issue: Portée potentiellement messianique de « juge d’Israël »
  choice: Conserver « le juge d’Israël » sans identification messianique explicite dans le texte principal.
  alternative: Traduire « le chef d’Israël » ou identifier ce personnage au dirigeant messianique annoncé dans le contexte suivant.
  rationale: Le verset évoque immédiatement l’humiliation du dirigeant d’Israël pendant un siège. Le contexte littéraire suivant permet une lecture messianique, mais le présent verset ne l’impose pas sans ambiguïté; une traduction lexicale préserve donc cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. L’apostrophe poétique « fille des troupes » est conservée afin de préserver la personnification hébraïque et le jeu de mots militaire. La syntaxe est légèrement idiomatisée dans « On nous assiège » sans ajouter de sujet absent de l’hébreu.
