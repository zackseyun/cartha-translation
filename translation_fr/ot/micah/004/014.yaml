  naturalness: Le français est globalement moderne et compréhensible. « Un siège est établi contre nous » est à la fois idiomatique et plus proche de la construction source. « Ils frappent le juge d’Israël à la joue avec un bâton » évite la tournure moins naturelle « frappent sur la joue ».
  terminology: « Fille des troupes », « juge d’Israël », « joue » et « bâton » préservent les termes et les images du texte sans imposer une interprétation royale ou messianique. La note sur le « juge d’Israël » conserve de façon appropriée l’ouverture interprétative.
