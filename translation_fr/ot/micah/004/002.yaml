source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ גּוֹיִ֣ם רַבִּ֗ים וְ/אָֽמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה וְ/אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יוֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹֽרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/002.yaml
  text: And many nations will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For from Zion Torah will go out, and the word of Yahweh from Jerusalem.
translation:
  language: fr
  text: 'De nombreuses nations viendront et diront : « Venez, montons à la montagne de Yahweh, à la maison du Dieu de Jacob, afin qu’il nous enseigne ses voies et que nous marchions dans ses sentiers. » Car de Sion sortira la Torah[a], et de Jérusalem la parole de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la loi » ou « l’enseignement ».
    reason: Le mot hébreu תּוֹרָה possède ici une portée plus large que la seule législation et peut désigner l’instruction divine.
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: viendront
  rationale: Le verbe signifie littéralement « aller, marcher ». Le français adopte ici naturellement le point de vue du lieu vers lequel convergent les nations, sans perdre l’idée de déplacement.
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: Rend directement la portée internationale de גּוֹיִם et reste naturel en français moderne.
- source_word: לְכוּ וְנַעֲלֶה
  choice: Venez, montons
  rationale: L’impératif suivi du cohortatif constitue une invitation collective. « Montons » conserve l’idée concrète et traditionnelle de l’ascension vers Jérusalem.
- source_word: הַר יְהוָה
  choice: la montagne de Yahweh
  rationale: « Montagne » rend הַר, et le nom personnel Yahweh représente directement le tétragramme.
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: la maison du Dieu de Jacob
  rationale: « Maison » préserve l’expression hébraïque sans expliciter le référent par « temple ».
- source_word: וְיוֹרֵנוּ מִדְּרָכָיו
  choice: Il nous enseignera ses voies
  rationale: Le hiphil de ירה exprime l’enseignement. La préposition מן introduit ici ce qui est enseigné; une traduction littérale par « d’entre ses voies » serait peu naturelle et pourrait suggérer à tort un enseignement seulement partiel.
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: et nous marcherons sur ses sentiers
  rationale: « Marcher » conserve la métaphore biblique de la conduite, tandis que « sentiers » maintient le parallélisme poétique avec « voies » sans les confondre.
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français la raison pour laquelle les nations recherchent cet enseignement.
- source_word: תּוֹרָה
  choice: Torah
  rationale: La translittération conserve la richesse du terme, qui peut désigner la loi aussi bien que l’enseignement divin, particulièrement dans ce contexte prophétique.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Rend directement l’expression hébraïque et maintient son parallélisme avec la Torah qui sort de Sion.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le tétragramme comme nom personnel. « Yahweh » le représente sans lui substituer un titre.
- issue: Sens de תּוֹרָה dans la vision de Sion
  choice: Torah
  alternative: loi ; enseignement
  rationale: 'Le terme ne se limite pas nécessairement à des prescriptions juridiques : il peut désigner l’instruction divine dans son ensemble. La translittération préserve cette amplitude, et la note fournit les principaux équivalents français.'
- issue: Valeur des formes וְיוֹרֵנוּ et וְנֵלְכָה
  choice: 'futurs coordonnés : « Il nous enseignera… et nous marcherons… »'
  alternative: 'finalité : « afin qu’il nous enseigne… et que nous marchions… »'
  rationale: Dans la suite de l’invitation « montons », les formes peuvent exprimer le résultat attendu ou le but. Le futur français reproduit simplement l’enchaînement hébreu sans exclure cette nuance de finalité.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le parallélisme poétique est conservé par « voies / sentiers » et « de Sion / de Jérusalem ». Le nom Yahweh et le terme Torah sont maintenus conformément aux données lexicales, avec une note explicative pour Torah.
