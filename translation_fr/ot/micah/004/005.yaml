  text: כִּ֚י כָּל הָ֣/עַמִּ֔ים יֵלְכ֕וּ אִ֖ישׁ בְּ/שֵׁ֣ם אֱלֹהָ֑י/ו וַ/אֲנַ֗חְנוּ נֵלֵ֛ךְ בְּ/שֵׁם יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/005.yaml
  text: For all the peoples walk[a], each in the name of his god[c][b], but we will walk in the name of Yahweh our God forever and ever.
translation:
  language: fr
  text: Car tous les peuples[a] marchent, chacun[b] au nom de son dieu, mais nous, nous marcherons au nom de Yahweh[c], notre Dieu, pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les nations ». Le mot hébreu peut désigner des peuples ou des nations.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « chaque homme ». Le terme hébreu a ici une valeur distributive avec « tous les peuples ».'
    reason: lexical_alternative
  - marker: c
    text: « Yahweh » transcrit le nom divin YHWH. D’autres traductions françaises emploient notamment « le SEIGNEUR », « l’Éternel » ou « Jéhovah ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici une explication ou le fondement de ce qui précède. « Car » conserve clairement ce lien logique.
- source_word: כָּל הָעַמִּים
  choice: tous les peuples
  rationale: עַמִּים peut désigner des peuples ou des nations. « Peuples » préserve ici la pluralité des groupes humains sans imposer l'idée moderne d'États-nations.
- source_word: יֵלְכוּ / נֵלֵךְ
  choice: marchent / nous marcherons
  rationale: La répétition de הלך forme un parallèle important. « Marcher au nom de » conserve l'image hébraïque d'une conduite déterminée par l'attachement religieux, tandis que le futur dans la seconde proposition exprime l'engagement du groupe parlant.
- source_word: אִישׁ
  choice: chacun
  rationale: Bien que le mot signifie littéralement « homme », il a ici une fonction distributive en rapport avec « tous les peuples ». « Chacun » rend cette fonction sans restreindre indûment le propos aux personnes de sexe masculin.
- source_word: בְּשֵׁם
  choice: au nom de
  rationale: Cette expression peut évoquer l'allégeance, l'invocation ou l'autorité. « Au nom de » est naturel en français et maintient la répétition des deux membres du verset.
- source_word: אֱלֹהָיו
  choice: son dieu
  rationale: 'Le nom singulier accompagné d''un suffixe masculin singulier s''accorde avec la construction distributive introduite par אִישׁ : chacun marche au nom de la divinité qui est la sienne.'
- source_word: וַאֲנַחְנוּ
  choice: mais nous, nous
  rationale: La conjonction a ici une valeur contrastive. La dislocation « nous, nous » rend l'emphase explicite du pronom hébreu et oppose nettement l'engagement d'Israël à la conduite des autres peuples.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » représente le nom divin personnel יהוה au lieu de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Cette traduction directe conserve l'expression de la relation entre le groupe parlant et son Dieu.
- source_word: לְעוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: Cette formule française soutenue rend la double expression hébraïque qui souligne la permanence sans fin.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente directement, sans remplacer le nom par un titre, tout en signalant en note l'usage traditionnel.
- issue: Portée religieuse de « marcher au nom de »
  choice: Conserver l'expression imagée sans en préciser un seul sens
  alternative: vivre sous l'autorité de / suivre
  rationale: L'expression peut englober la conduite, l'allégeance et l'invocation. La formulation retenue préserve cette richesse et la tension du contraste, sans réduire le sens à une seule interprétation.
- issue: Masculin grammatical de אִישׁ
  choice: chacun
  alternative: chaque homme / chacun des peuples
  rationale: אִישׁ fonctionne distributivement avec « tous les peuples » et ne vise pas spécialement les hommes. « Chacun » conserve la distribution et l'ambiguïté quant à savoir si l'accent porte sur chaque peuple ou chaque membre de ces peuples.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de « marcher au nom de » est volontairement conservé. La reprise « nous, nous » restitue l'emphase hébraïque sans lourdeur excessive.
