  text: וְ/אַתָּ֣ה מִגְדַּל עֵ֗דֶר עֹ֛פֶל בַּת צִיּ֖וֹן עָדֶ֣י/ךָ תֵּאתֶ֑ה וּ/בָאָ֗ה הַ/מֶּמְשָׁלָה֙ הָ/רִ֣אשֹׁנָ֔ה מַמְלֶ֖כֶת לְ/בַ֥ת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/008.yaml
  text: And you[a], tower of the flock, hill of daughter Zion—to you it will come, yes, the former dominion will come[c][b], the kingdom of the daughter of Jerusalem.
translation:
  language: fr
  text: Et toi, tour du troupeau[a], colline de la fille de Sion[b], jusqu’à toi viendra, et viendra la domination d’autrefois[c], la royauté pour la fille de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Migdal-Éder » (nom de lieu) ; autre traduction possible : « tour de guet du troupeau ».'
    reason: alternative_reading
  - marker: b
    text: Ou « Ophel de la fille de Sion », si « Ophel » est compris comme un nom de lieu plutôt que comme le nom commun « colline ».
    reason: alternative_reading
  - marker: c
    text: La « domination d’autrefois » évoque probablement le rétablissement de l’ancienne autorité royale de Jérusalem.
    reason: cross_reference
lexical_decisions:
- source_word: מִגְדַּל עֵדֶר
  choice: tour du troupeau
  rationale: Le syntagme construit signifie littéralement « tour du troupeau ». Cette traduction conserve l’image prophétique tout en réservant en note la possibilité d’un nom de lieu, Migdal-Éder, attesté en Genèse 35.21.
- source_word: עֹפֶל
  choice: colline
  rationale: Le nom peut désigner une élévation ou un tertre, mais aussi servir de nom propre à Jérusalem. « Colline » exprime clairement le sens topographique courant ; « Ophel » est signalé en note.
- source_word: בַּת צִיּוֹן
  choice: la fille de Sion
  rationale: La personnification prophétique est conservée plutôt que réduite au simple nom « Sion ».
- source_word: עָדֶיךָ תֵּאתֶה
  choice: jusqu’à toi elle viendra
  rationale: « Jusqu’à toi » rend la valeur directionnelle de עַד. Le pronom féminin « elle » respecte la forme verbale féminine et anticipe « la domination ».
- source_word: הַמֶּמְשָׁלָה הָרִאשֹׁנָה
  choice: la domination d’autrefois
  rationale: מֶמְשָׁלָה désigne l’exercice du pouvoir ou la domination ; רִאשֹׁנָה a ici vraisemblablement une valeur temporelle, celle d’un pouvoir antérieur, plutôt que strictement ordinale.
- source_word: מַמְלֶכֶת
  choice: la royauté
  rationale: Le terme peut désigner un royaume, une souveraineté ou le pouvoir royal. « Royauté » convient ici à l’apposition avec « domination » et évite de faire du territoire le sens principal.
- source_word: לְבַת יְרוּשָׁלִָם
  choice: destinée à la fille de Jérusalem
  rationale: La préposition לְ exprime ici naturellement la destination ou l’attribution. Cette formulation conserve aussi la personnification féminine de Jérusalem.
theological_decisions:
- issue: Les désignations initiales sont-elles des titres descriptifs ou des noms de lieux fixes ?
  choice: Traduire dans le texte les sens descriptifs « tour du troupeau » et « colline »
  alternative: Employer les noms propres « Migdal-Éder » et « Ophel de la fille de Sion »
  rationale: Les expressions hébraïques gardent un sens lexical transparent. Les traduire préserve l’imagerie du passage, tandis que les notes maintiennent les lectures toponymiques possibles sans imposer une localisation ou une interprétation messianique particulière.
- issue: La « domination d’autrefois » désigne-t-elle explicitement la monarchie davidique restaurée ?
  choice: Conserver le langage politique général du texte
  alternative: Expliciter « l’ancienne domination davidique »
  rationale: Le contexte peut orienter vers le rétablissement de l’ancienne autorité royale de Jérusalem, mais David n’est pas nommé dans ce verset. La traduction ne rend donc pas explicite une identification qui demeure interprétative.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition « elle viendra ; oui, elle viendra » reproduit l’insistance de l’hébreu et le féminin grammatical prépare le sujet « la domination ». Les personnifications « fille de Sion » et « fille de Jérusalem » sont maintenues.
