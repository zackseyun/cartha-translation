base_translation:
  language: en
  yaml_path: translation/ot/micah/004/007.yaml
  text: And I will make the lame a remnant[a], and the outcast a strong nation[b]; and Yahweh will reign over them on Mount Zion from now and forever.
translation:
  language: fr
  text: Je ferai de celle qui boite[a] un reste, et de celle qui a été chassée[b] une nation puissante. Yahvé régnera sur eux, sur le mont Sion, dès maintenant et pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un féminin singulier, qui personnifie la communauté affligée.
    reason: grammatical_personification
  - marker: b
    text: Ou « celle qui a été éloignée ». Le terme évoque une personne qu’on a fait partir ou repoussée, notamment dans un contexte d’exil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי ... לִשְׁאֵרִית
  choice: De celle qui boite, je ferai un reste
  rationale: Le verbe שׂים avec לְ exprime ici le résultat d’une transformation. La tournure française « faire de… » rend naturellement cette valeur tout en conservant « un reste », terme prophétique important.
- source_word: הַצֹּלֵעָה
  choice: celle qui boite
  rationale: Le participe féminin singulier issu de צלע signifie « celle qui boite ». Cette formulation garde la personnification féminine sans transformer explicitement le référent collectif en pluriel.
- source_word: הַנַּהֲלָאָה
  choice: celle qui a été chassée au loin
  rationale: Le terme désigne une personne ou une communauté qu’on a fait partir ou éloignée. « Chassée au loin » fait entendre le déplacement forcé et convient au contexte d’exil, sans réduire le sens à une catégorie sociale d’« exclue ».
- source_word: לְגוֹי עָצוּם
  choice: une nation puissante
  rationale: גּוֹי désigne une nation ou un peuple constitué, et עָצוּם exprime la force ou la puissance. « Nation puissante » est clair, actuel et fidèle au caractère collectif et politique de l’expression.
- source_word: וּמָלַךְ יְהוָה עֲלֵיהֶם
  choice: Yahvé régnera sur eux
  rationale: מלך décrit l’exercice de la royauté, naturellement rendu par « régnera ». Le nom divin est translittéré « Yahvé », et עַל avec ce verbe indique la souveraineté exercée sur le peuple.
- source_word: בְּהַר צִיּוֹן
  choice: au mont Sion
  rationale: La préposition situe le règne de Yahvé au mont Sion. « Au mont Sion » est la formulation française idiomatique.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: dès maintenant et pour toujours
  rationale: L’expression indique un commencement présent suivi d’une durée sans fin. Cette traduction est naturelle en français et conserve les deux éléments temporels.
theological_decisions:
- issue: Personnification singulière ou explicitation collective des personnes restaurées
  choice: 'Conserver les deux formes féminines singulières : « celle qui boite » et « celle qui a été chassée au loin ».'
  alternative: 'Employer des pluriels explicites : « ceux qui boitent » et « ceux qui ont été chassés au loin ».'
  rationale: L’hébreu emploie des formes féminines singulières qui personnifient vraisemblablement Sion ou la communauté affligée. Les conserver respecte l’image du texte sans nier leur portée collective.
- issue: Passage des figures féminines singulières au pronom masculin pluriel עֲלֵיהֶם
  choice: Traduire « sur eux », en laissant le pronom renvoyer au « reste » et à la « nation » ainsi qu’aux groupes qu’ils représentent.
  alternative: Harmoniser grammaticalement par « sur elles » ou expliciter « sur ce peuple ».
  rationale: Le masculin pluriel hébreu marque la réalité collective derrière les personnifications. « Sur eux » préserve ce passage du singulier figuratif au collectif au lieu de l’effacer.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe parallèle demeure perceptible, tandis que « faire de… » évite un calque maladroit. « Celle qui boite » reste proche de l’image hébraïque; « chassée au loin » souligne le déplacement forcé sans ajouter d’interprétation confessionnelle.
