  source_fidelity: 'Le sens général est bien rendu : les impératifs s’adressent à Sion personnifiée, l’image du dépiquage est maintenue, et les peuples, le gain et les richesses sont correctement distingués. Toutefois, « rendre ta corne dure comme le fer » remplace l’image hébraïque plus directe de la corne faite de fer par une simple comparaison de dureté. Une formulation littérale reste naturelle en français. Le sens de חרם demeure lexicalement chargé et mérite une note propre.'
  naturalness: Le français est globalement fluide et d’un registre prophétique accessible. « Foule le grain » explicite convenablement le dépiquage dans un français international compréhensible. « Je ferai ta corne de fer et tes sabots de bronze » est à la fois plus fidèle et idiomatique dans ce registre.
  terminology: « Fille de Sion », « Yahvé », « Seigneur », « sabots », « bronze », « peuples » et « richesses » sont appropriés. « Vouer » est recevable pour חרם, à condition qu’une note indique la possibilité de l’interdit, y compris sa dimension destructive selon le contexte. La note sur בֶּצַע doit rester distincte de cette question.
