source:
  edition: WLC
  text: ק֧וּמִי וָ/ד֣וֹשִׁי בַת צִיּ֗וֹן כִּֽי קַרְנֵ֞/ךְ אָשִׂ֤ים בַּרְזֶל֙ וּ/פַרְסֹתַ֨יִ/ךְ֙ אָשִׂ֣ים נְחוּשָׁ֔ה וַ/הֲדִקּ֖וֹת עַמִּ֣ים רַבִּ֑ים וְ/הַחֲרַמְתִּ֤י לַֽ/יהוָה֙ בִּצְעָ֔/ם וְ/חֵילָ֖/ם לַ/אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/013.yaml
  text: Rise and thresh[a], daughter Zion, for I will make your horn iron, and I will make your hooves bronze; you will crush many peoples, and I will devote their gain to Yahweh[b], and their wealth to the Lord of all the earth.
translation:
  language: fr
  text: Lève-toi et foule le grain, fille de Sion, car je ferai ta corne de fer et tes sabots de bronze. Tu écraseras de nombreux peuples, et je vouerai[a] leur gain[b] à Yahvé, leurs richesses au Seigneur de toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je mettrai sous l’interdit ». Le verbe hébreu désigne l’affectation irrévocable à Dieu et peut, selon le contexte, impliquer une mise à destruction.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur profit malhonnête » ou « leur butin ». Le terme hébreu peut désigner un gain marqué par la cupidité ou l’injustice.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֧וּמִי וָד֣וֹשִׁי
  choice: Lève-toi et foule le grain
  rationale: Les impératifs féminins singuliers s’adressent à Sion personnifiée. « Foule le grain » explicite sobrement l’action de דושׁ et maintient l’image agricole qui se prolonge avec les sabots.
- source_word: בַת צִיּוֹן
  choice: fille de Sion
  rationale: Formule française naturelle pour l’expression prophétique personnifiant Sion, ici au vocatif.
- source_word: קַרְנֵךְ אָשִׂים בַּרְזֶל
  choice: je rendrai ta corne dure comme le fer
  rationale: La corne, image biblique de force, est conservée. « Dure comme le fer » exprime naturellement en français la qualité conférée par Dieu sans suggérer une transformation anatomique littérale.
- source_word: וּפַרְסֹתַיִךְ אָשִׂים נְחוּשָׁה
  choice: tes sabots comme le bronze
  rationale: Les sabots prolongent l’image du dépiquage par piétinement; « bronze » est le rendu contextuel usuel de נְחוּשָׁה.
- source_word: וַהֲדִקּוֹת עַמִּים רַבִּים
  choice: Tu écraseras de nombreux peuples
  rationale: Le verbe indique l’action de broyer ou réduire en morceaux; « écraseras » est fort, clair et cohérent avec l’image du foulage.
- source_word: וְהַחֲרַמְתִּי
  choice: je vouerai
  rationale: Le hifil de חרם exprime ici l’affectation irrévocable à Dieu, potentiellement sous le régime de l’interdit. « Vouer » conserve le sens cultuel sans imposer dans le texte principal l’idée plus étroite de destruction.
- source_word: בִּצְעָם
  choice: leur gain
  rationale: בצע peut désigner un profit, souvent avec une coloration de cupidité ou d’injustice. Le terme sobre « gain » préserve la latitude contextuelle; la nuance possible est signalée en note.
- source_word: וְחֵילָם
  choice: leurs richesses
  rationale: Dans le parallélisme avec « gain » et comme objet voué à Dieu, חֵיל désigne vraisemblablement les biens ou ressources plutôt que la puissance militaire.
- source_word: לַיהוָה ... לַאֲדוֹן כָּל הָאָרֶץ
  choice: à Yahvé ... au Seigneur de toute la terre
  rationale: Le nom divin est rendu par « Yahvé », tandis que אֲדוֹן est traduit par « Seigneur », ce qui préserve la distinction lexicale de l’hébreu.
theological_decisions:
- issue: Portée de חרם dans un contexte de victoire
  choice: je vouerai leur gain à Yahvé
  alternative: je mettrai leur gain sous l’interdit / je consacrerai leur butin à la destruction
  rationale: Les objets directs sont le gain et les richesses, non les peuples. « Vouer » rend l’affectation à Dieu tout en laissant subsister la tension entre consécration et interdit destructeur propre à חרם.
- issue: Nuance morale de בֶּצַע
  choice: leur gain
  alternative: leur profit malhonnête / leur butin
  rationale: Le mot peut être péjoratif, mais cette nuance n’est pas obligatoire dans chaque emploi. Le texte principal évite de la rendre certaine; la note conserve les principales possibilités.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’image prophétique du dépiquage est rendue explicitement par « foule le grain »; les métaphores de la corne et des sabots sont conservées. Le rythme est réparti en deux phrases pour une lecture naturelle.
