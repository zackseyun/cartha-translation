    issue: La métaphore de la corne de fer est atténuée.
    rationale: אָסִים ... בַּרְזֶל signifie littéralement « je ferai/placerai ta corne [comme] fer », c’est-à-dire une corne de fer. « Dure comme le fer » n’est pas faux quant à l’effet, mais substitue une comparaison de qualité à l’image matérielle du texte.
  - severity: medium
    issue: L’ambiguïté sémantique de חרם n’est pas documentée par une note.
    rationale: « Vouer » est un bon choix principal, mais le verbe peut désigner une consécration sous interdit, souvent associée à la destruction. Une note ancrée sur « vouer » préserve cette ambiguïté sans la résoudre de façon doctrinale.
