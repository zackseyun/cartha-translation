source:
  edition: WLC
  text: וְ/עַתָּ֛ה נֶאֶסְפ֥וּ עָלַ֖יִ/ךְ גּוֹיִ֣ם רַבִּ֑ים הָ/אֹמְרִ֣ים תֶּחֱנָ֔ף וְ/תַ֥חַז בְּ/צִיּ֖וֹן עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/011.yaml
  text: And now many nations have gathered against you[a], saying, “Let her be defiled[b], and let our eyes look on Zion.”
translation:
  language: fr
  text: 'Et maintenant, de nombreuses nations se sont rassemblées contre toi. Elles disent : « Qu’elle soit souillée[a], et que nos yeux contemplent Sion ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « profanée » ou « contaminée ». Le verbe hébreu peut désigner une souillure morale ou rituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien narratif de וְ et la valeur temporelle de עַתָּה.
- source_word: נֶאֶסְפוּ עָלַיִךְ
  choice: se sont rassemblées contre toi
  rationale: Le parfait nifal décrit un rassemblement accompli, et עַל exprime ici l’hostilité envers la ville interpellée.
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: Rend directement des groupes nationaux multiples, avec une tournure française naturelle.
- source_word: הָאֹמְרִים
  choice: Elles disent
  rationale: Le participe introduit les paroles hostiles des nations; une nouvelle phrase allège naturellement le français.
- source_word: תֶּחֱנָף
  choice: Qu’elle soit profanée
  rationale: Le verbe exprime ici la souillure ou la profanation de Sion; « profanée » convient particulièrement à une ville sainte sans réduire entièrement la portée possible du terme.
- source_word: וְתַחַז בְּצִיּוֹן עֵינֵינוּ
  choice: et que nos yeux contemplent Sion
  rationale: Préserve l’image explicite des yeux et le souhait hostile de voir le sort de Sion. « Contemplent » rend חזה sans ajouter explicitement l’humiliation, seulement impliquée par le contexte.
theological_decisions:
- issue: Changement entre l’adresse féminine singulière et la référence à Sion à la troisième personne
  choice: Conserver « contre toi », puis « qu’elle »
  alternative: Uniformiser avec « que tu sois profanée »
  rationale: L’hébreu passe de l’adresse directe עָלַיִךְ aux paroles des nations, où les formes féminines singulières désignent Sion. Le changement est donc maintenu.
- issue: Portée de תֶּחֱנָף
  choice: « Qu’elle soit profanée »
  alternative: « Qu’elle soit souillée »
  rationale: Les deux nuances sont possibles. « Profanée » fait entendre l’atteinte portée à Sion comme ville sainte, tandis que la note conserve l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde la personnification féminine de Sion, l’image corporelle de « nos yeux » et la tension du souhait hostile, sans expliciter davantage que l’hébreu.
