  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אֹֽסְפָה֙ הַ/צֹּ֣לֵעָ֔ה וְ/הַ/נִּדָּחָ֖ה אֲקַבֵּ֑צָה וַ/אֲשֶׁ֖ר הֲרֵעֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/006.yaml
  text: In that day[a], declares Yahweh, I will gather the lame, and I will assemble the outcast[c][b], even those whom I have afflicted.
translation:
  language: fr
  text: En ce jour-là, déclare l’Éternel, je rassemblerai celle qui boite[a] ; je réunirai celle qui a été chassée[b], et ceux que j’ai affligés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est au féminin singulier : « celle qui boite ». Elle peut désigner collectivement les personnes faibles ou blessées.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celle qui a été repoussée » ou « bannie ». Le mot souligne qu’elle a été contrainte de s’éloigner.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ceux à qui j’ai causé du malheur ». L’hébreu attribue explicitement à l’Éternel l’épreuve passée.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique usuelle, conservée dans un registre solennel et naturel en français.
- source_word: נְאֻם יְהוָה
  choice: déclare l’Éternel
  rationale: נְאֻם introduit une déclaration prophétique solennelle. « Déclare » en préserve la force, tandis que « l’Éternel » est une désignation française traditionnelle de YHWH.
- source_word: אֹסְפָה
  choice: je rassemblerai
  rationale: אָסַף exprime l’action de recueillir et de ramener ensemble ; « rassembler » convient au contexte de restauration.
- source_word: הַצֹּלֵעָה
  choice: celle qui boite
  rationale: Le participe féminin singulier est rendu formellement, tout en laissant percevoir sa possible valeur collective.
- source_word: וְהַנִּדָּחָה
  choice: celle qui a été chassée
  rationale: Le participe passif de נדח souligne que cette personne ou collectivité a été repoussée ou éloignée, plutôt qu’une simple dispersion.
- source_word: אֲקַבֵּצָה
  choice: je réunirai
  rationale: « Réunir » préserve une distinction naturelle avec אָסַף tout en maintenant le parallélisme des deux verbes de rassemblement.
- source_word: וַאֲשֶׁר הֲרֵעֹתִי
  choice: et celle que j’ai accablée
  rationale: La coordination hébraïque est conservée, ainsi que l’action divine explicite. « Accabler » exprime ici le fait d’avoir causé détresse ou malheur sans suggérer une malveillance morale.
theological_decisions:
- issue: Action divine dans הֲרֵעֹתִי
  choice: celle que j’ai accablée
  alternative: celle que j’ai laissée être accablée
  rationale: Le hiphil à la première personne attribue explicitement à YHWH l’épreuve antérieure. La traduction maintient la tension entre jugement et restauration au lieu d’atténuer cette action en simple permission.
- issue: Portée collective des participes féminins singuliers
  choice: celle qui boite… celle qui a été chassée… celle que j’ai accablée
  alternative: ceux qui boitent… les exilés… ceux que j’ai accablés
  rationale: Le singulier féminin de l’hébreu est préservé dans le texte, probablement avec une valeur collective renvoyant à Sion ou à un groupe personnifié ; une note signale cette portée afin de ne pas trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et prophétique. Le parallélisme est conservé sans lourdeur, les féminins singuliers de l’hébreu sont maintenus, et les notes explicitent leur probable valeur collective ainsi que la tension théologique liée à l’action divine.
