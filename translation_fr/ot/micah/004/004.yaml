source:
  edition: WLC
  text: וְ/יָשְׁב֗וּ אִ֣ישׁ תַּ֧חַת גַּפְנ֛/וֹ וְ/תַ֥חַת תְּאֵנָת֖/וֹ וְ/אֵ֣ין מַחֲרִ֑יד כִּי פִ֛י יְהוָ֥ה צְבָא֖וֹת דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/004.yaml
  text: And each will sit under his vine and under his fig tree[a], and there will be no one to make them afraid[b], for the mouth of Yahweh of Armies has spoken.
translation:
  language: fr
  text: Chacun s’assiéra sous sa vigne et sous son figuier, sans que personne le fasse trembler, car la bouche de Yahweh des armées a parlé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: Chacun s’assiéra
  rationale: Le verbe יָשַׁב signifie ici concrètement « s’asseoir », tout en évoquant une installation paisible et durable. Le futur convient à la promesse prophétique.
- source_word: אִישׁ
  choice: Chacun
  rationale: Employé distributivement après un verbe au pluriel, אִישׁ désigne chaque personne prise individuellement. « Chacun » restitue naturellement cette valeur en français sans alourdir la phrase.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: sous sa vigne et sous son figuier
  rationale: La traduction littérale conserve l’image biblique traditionnelle de paix, de sécurité et de prospérité stable.
- source_word: וְאֵין מַחֲרִיד
  choice: sans que personne le fasse trembler
  rationale: Le participe מַחֲרִיד désigne celui qui provoque le tremblement ou l’effroi. Cette formulation conserve l’image physique plus forte du texte hébreu et reprend au singulier la construction distributive de « chacun ».
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici le fondement et la garantie de la promesse.
- source_word: פִּי יְהוָה צְבָאוֹת
  choice: la bouche de Yahweh des armées
  rationale: « La bouche » est maintenue afin de préserver l’idiome hébreu qui souligne l’autorité et la certitude de la parole divine. Le nom propre יהוה est rendu par « Yahweh », et צְבָאוֹת par « des armées ».
- source_word: דִּבֵּר
  choice: a parlé
  rationale: Le parfait présente la déclaration comme accomplie et certaine; « a parlé » convient à la formule prophétique solennelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- issue: Portée de אִישׁ dans la construction distributive
  choice: Chacun
  alternative: chaque homme
  rationale: Le masculin singulier hébreu fonctionne ici distributivement. « Chacun » garde l’individualisation du propos tout en étant idiomatique en français moderne, sans trancher inutilement la portée représentative de la forme masculine.
- issue: Sens de צְבָאוֹת
  choice: des armées
  alternative: des puissances
  rationale: « Des armées » traduit directement le terme et conserve son champ militaire et cosmique, tandis que « des puissances » interpréterait davantage sa référence.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise et solennelle; les images concrètes de la vigne, du figuier, du tremblement et de la bouche divine sont conservées.
