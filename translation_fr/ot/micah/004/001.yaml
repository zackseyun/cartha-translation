id: MIC.4.1
reference: Micah 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים יִ֠הְיֶה הַ֣ר בֵּית יְהוָ֤ה נָכוֹן֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֥א ה֖וּא מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ עָלָ֖י/ו עַמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/001.yaml
  text: And it will happen in the latter days that the mountain of the house of Yahweh will be established as the chief of the mountains[a], and it will be lifted up above the hills[c][b], and peoples will stream to it.
translation:
  language: fr
  text: Dans les jours à venir[a], la montagne de la maison de Yahvé sera solidement établie à la tête des montagnes[b] et sera élevée au-dessus des collines ; des peuples y afflueront[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la fin des jours ». L’expression peut aussi désigner les temps à venir.
    reason: alternative_reading
  - marker: b
    text: Littéralement « à la tête des montagnes » ; l’expression peut évoquer la prééminence autant qu’une position physique.
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu représente les peuples coulant comme un cours d’eau vers la montagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: '[intégré à la tournure] Dans les jours à venir'
  rationale: La formule introduit une situation prophétique future. En français, l’ouverture temporelle permet une formulation naturelle sans ajouter le lourd « il arrivera que ».
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Dans les jours à venir
  rationale: Cette expression prophétique peut désigner l’avenir ou une période finale. La formulation choisie reste naturelle et ne lui impose pas un système eschatologique précis.
- source_word: הַר בֵּית יְהוָה
  choice: la montagne de la maison de Yahvé
  rationale: Cette formulation conserve la chaîne de dépendance hébraïque et l’association de la montagne avec la maison, c’est-à-dire le sanctuaire, de Yahvé.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui le distingue d’un titre comme « le Seigneur ».
- source_word: נָכוֹן
  choice: solidement établie
  rationale: Le terme exprime la fermeté, la stabilité et une position assurée.
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: à la tête des montagnes
  rationale: Cette traduction garde ensemble l’image spatiale et l’idée possible de prééminence, sans réduire le texte à une transformation topographique ni à une suprématie purement symbolique.
- source_word: וְנִשָּׂא הוּא מִגְּבָעוֹת
  choice: et s’élèvera au-dessus des collines
  rationale: La formulation restitue l’élévation du mont tout en laissant ouverte sa portée concrète ou honorifique.
- source_word: וְנָהֲרוּ
  choice: afflueront
  rationale: « Affluer » est idiomatique en français et conserve l’image d’un courant humain, remarquable ici puisque les peuples montent vers la montagne.
- source_word: עַמִּים
  choice: des peuples
  rationale: Le pluriel désigne plusieurs groupes humains et préserve la distinction avec le terme plus politique « nations ».
- source_word: עָלָיו
  choice: y
  rationale: Le pronom renvoie naturellement en français à la montagne comme destination du mouvement.
theological_decisions:
- issue: Portée eschatologique de בְּאַחֲרִית הַיָּמִים
  choice: Dans les jours à venir
  alternative: À la fin des jours
  rationale: Le choix principal indique un avenir prophétique sans exclure une portée finale; la note conserve explicitement l’autre lecture possible.
- issue: Nature de l’élévation de la montagne
  choice: Conserver à la fois l’image spatiale et la prééminence possible
  alternative: Comprendre l’élévation comme exclusivement topographique ou exclusivement symbolique
  rationale: Le parallélisme peut évoquer aussi bien la hauteur que le rang. La traduction ne tranche pas entre ces dimensions.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme prophétique est préservé, tandis que « afflueront » rend naturellement la métaphore du mouvement collectif. Les notes signalent les ambiguïtés temporelle et topographique sans les résoudre.
