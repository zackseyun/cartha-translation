revisions:
- from: Dans les jours à venir[a], la montagne de la maison de Yahvé sera solidement établie à la tête des montagnes[b] et s’élèvera au-dessus des collines ; des peuples y afflueront[c].
  to: Dans les jours à venir[a], la montagne de la maison de Yahvé sera solidement établie à la tête des montagnes[b] et sera élevée au-dessus des collines ; des peuples y afflueront[c].
  rationale: La seule révision nécessaire remplace le verbe pronominal actif par un passif français, « sera élevée », afin de reproduire la voix de la forme hébraïque sans trancher entre élévation concrète et exaltation honorifique. Le reste du texte et les notes préservent de façon satisfaisante les ambiguïtés du passage.
