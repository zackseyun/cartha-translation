review_pass:
  verdict: revise
  source_fidelity: La structure générale, le vocabulaire prophétique et l’image de l’afflux des peuples sont bien rendus. Toutefois, וְנִשָּׂא est une forme passive (« sera élevée / exaltée ») ; « s’élèvera » la reformule à l’actif intransitif et atténue cette donnée formelle et l’écho de l’exaltation conférée au mont.
  naturalness: Le français est moderne, clair et d’un registre prophétique approprié. « À la tête des montagnes » est soutenu et un peu calqué, mais il demeure compréhensible et permet de conserver l’ambivalence spatiale et honorifique, explicitée par la note.
  terminology: « Yahvé », « la maison de Yahvé », « peuples », « collines » et « afflueront » sont cohérents avec le texte hébreu et naturels en français international. « Affluer » transmet bien l’image inhabituelle de peuples qui « coulent » vers la montagne.
  issues:
