  text: כִּ֤י הֶעֱלִתִ֨י/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מִ/בֵּ֥ית עֲבָדִ֖ים פְּדִיתִ֑י/ךָ וָ/אֶשְׁלַ֣ח לְ/פָנֶ֔י/ךָ אֶת מֹשֶׁ֖ה אַהֲרֹ֥ן וּ/מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/004.yaml
  text: For I brought you up from the land of Egypt[a], and from the house of slavery I redeemed you; and I sent before you Moses, Aaron, and Miriam.
translation:
  language: fr
  text: Car je t’ai fait monter du pays d’Égypte ; je t’ai racheté de la maison d’esclavage[a], et j’ai envoyé devant toi Moïse, Aaron et Myriam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la maison des esclaves ».'
    reason: Alternative lexicale; l’hébreu emploie littéralement une construction signifiant « maison des esclaves », expression rendue idiomatiquement par « maison d’esclavage ».
lexical_decisions:
- source_word: כִּי
  choice: Oui
  rationale: Dans la réponse solennelle du SEIGNEUR commencée au verset précédent, la particule introduit et appuie le rappel de ses actes en faveur d’Israël. « Oui » rend naturellement cette valeur affirmative en français, sans imposer une relation causale trop étroite.
- source_word: הֶעֱלִתִיךָ
  choice: je t’ai fait monter
  rationale: Le hifil de עלה signifie littéralement « faire monter ». Cette formulation conserve l’image hébraïque traditionnelle de la montée depuis l’Égypte, tout en restant intelligible en français.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Rendu direct et idiomatique du complément d’origine; « pays » convient ici au sens territorial de אֶרֶץ.
- source_word: מִבֵּית עֲבָדִים
  choice: de la maison des esclaves
  rationale: La formulation garde le concret du pluriel עֲבָדִים, « esclaves », et reproduit l’image de la « maison », au prix d’une légère étrangeté voulue; une formulation française plus idiomatique est donnée en note.
- source_word: פְּדִיתִיךָ
  choice: je t’ai racheté
  rationale: פדה relève du champ lexical du rachat et de la libération. « Racheté » conserve ce relief sans réduire l’acte à un simple secours.
- source_word: וָאֶשְׁלַח
  choice: et j’ai envoyé
  rationale: Équivalent français simple et exact de שלח dans cette succession d’actes divins.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Préserve l’expression spatiale ou représentative de l’hébreu, qui peut évoquer des dirigeants envoyés en avant d’Israël ou placés à sa tête.
- source_word: אֶת מֹשֶׁה אַהֲרֹן וּמִרְיָם
  choice: Moïse, Aaron et Myriam
  rationale: Les trois personnes nommées sont conservées explicitement; les formes françaises usuelles de leurs noms sont employées.
theological_decisions:
- issue: Sens de עֲבָדִים dans la formule de l’Exode
  choice: esclaves
  alternative: esclavage; servitude; serviteurs
  rationale: « Esclaves » exprime concrètement le statut de ceux qui étaient asservis et évite d’atténuer la réalité sociale évoquée. La note conserve l’alternative abstraite et plus idiomatique « maison d’esclavage ».
- issue: Traduction de פדה
  choice: racheté
  alternative: libéré; délivré; payé ta rançon
  rationale: « Racheté » maintient la métaphore propre à פדה et sa résonance théologique, sans préciser un prix ni un bénéficiaire que le verset ne mentionne.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël considéré collectivement. La répétition de « je » souligne les actes de Dieu, tandis que « maison des esclaves » conserve volontairement l’image concrète de l’original.
