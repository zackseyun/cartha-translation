source:
  edition: WLC
  text: הִגִּ֥יד לְ/ךָ֛ אָדָ֖ם מַה טּ֑וֹב וּ/מָֽה יְהוָ֞ה דּוֹרֵ֣שׁ מִמְּ/ךָ֗ כִּ֣י אִם עֲשׂ֤וֹת מִשְׁפָּט֙ וְ/אַ֣הֲבַת חֶ֔סֶד וְ/הַצְנֵ֥עַ לֶ֖כֶת עִם אֱלֹהֶֽי/ךָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/008.yaml
  text: He has told you[a], O man, what is good; and what does Yahweh require of you but to do justice, and to love steadfast love[b], and to walk humbly with your God?
translation:
  language: fr
  text: Il t’a fait connaître, ô être humain[a], ce qui est bon. Et qu’est-ce que Yahweh exige de toi, sinon que tu pratiques la justice, que tu aimes la bonté fidèle[b] et que tu marches humblement avec ton Dieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu s’adresse au singulier à un représentant de l’humanité.
    reason: cultural_note
  - marker: b
    text: Ou « la compassion », « la bonté » ou « la fidélité à l’alliance ». Le mot hébreu חֶסֶד évoque une bonté loyale, constante et fidèle dans la relation.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד לְךָ
  choice: Il t’a fait connaître
  rationale: Le hiphil de נגד signifie « faire connaître, déclarer ». Le passé composé exprime une révélation déjà donnée qui demeure pertinente.
- source_word: אָדָם
  choice: ô être humain
  rationale: Le nom désigne ici un interlocuteur humain singulier employé de manière représentative. « Être humain » conserve cette portée sans faire croire que seuls les hommes sont visés.
- source_word: מַה טּוֹב
  choice: ce qui est bon
  rationale: טוֹב est ici le terme moral général « bon », sans nécessité de le réduire à « juste » ou « avantageux ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui distingue celui-ci du titre « Seigneur ».
- source_word: דּוֹרֵשׁ מִמְּךָ
  choice: exige de toi
  rationale: Dans ce contexte éthique et relationnel, דרש avec מן indique ce que Dieu attend ou requiert de l’interlocuteur.
- source_word: כִּי אִם
  choice: sinon que
  rationale: Dans la question rhétorique, cette locution introduit de façon exceptive le contenu de l’exigence.
- source_word: עֲשׂוֹת מִשְׁפָּט
  choice: que tu pratiques la justice
  rationale: Cette formulation française naturelle conserve la force active de עשה et le sens éthique de מִשְׁפָּט.
- source_word: אַהֲבַת חֶסֶד
  choice: que tu aimes la bonté fidèle
  rationale: חֶסֶד associe bonté, loyauté et attachement durable, souvent dans le cadre d’une relation d’alliance. « Bonté fidèle » en garde plusieurs dimensions tout en restant compréhensible.
- source_word: הַצְנֵעַ לֶכֶת
  choice: que tu marches humblement
  rationale: L’expression décrit une conduite empreinte d’humilité ou de modestie. La métaphore biblique de la marche demeure naturelle en français.
- source_word: עִם אֱלֹהֶיךָ
  choice: avec ton Dieu
  rationale: עִם signifie normalement « avec » et met ici en valeur la dimension relationnelle de la vie menée en compagnie de Dieu.
theological_decisions:
- issue: Sens de חֶסֶד
  choice: la bonté fidèle
  alternative: la compassion ; la bonté ; la fidélité à l’alliance
  rationale: Le terme dépasse la seule compassion et peut évoquer une bonté loyale et durable. La traduction retenue préserve cette richesse sans imposer « alliance » là où le mot n’est pas explicite.
- issue: Portée de אָדָם
  choice: ô être humain
  alternative: ô homme ; humanité
  rationale: Le texte interpelle une personne au singulier de façon représentative. « Être humain » maintient le singulier et la portée universelle, sans transformer l’adresse en nom collectif.
- issue: Relation exprimée par עִם
  choice: avec ton Dieu
  alternative: devant ton Dieu
  rationale: La préposition indique directement l’accompagnement ou la relation. « Devant » introduirait une nuance interprétative absente de la formulation hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement conservé parce que l’hébreu s’adresse à un interlocuteur singulier. La structure ternaire et la métaphore « marcher avec Dieu » sont maintenues.
