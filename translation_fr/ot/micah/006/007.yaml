revisions:
- from: Yahvé prendra-t-il plaisir à des milliers de béliers, à des myriades de torrents d’huile[a] ? Donnerai-je mon premier-né pour ma révolte, le fruit de mon corps[b] pour le péché de mon âme[c] ?
  to: Yahvé prendra-t-il plaisir à des milliers de béliers, à des myriades de torrents d’huile[a] ? Donnerai-je mon premier-né pour ma révolte, le fruit de mes entrailles[b] pour le péché de mon âme[c] ?
  rationale: La révision remplace une expression française moins naturelle par l’idiome « le fruit de mes entrailles », qui préserve l’image hébraïque et sa référence à la descendance. Elle clarifie aussi la note sur חַטַּאת afin de distinguer l’alternative lexicale cultuelle du sens retenu dans le texte, sans modifier la portée rhétorique du verset.
