  source_fidelity: Le texte rend correctement les deux interrogations rhétoriques, l’escalade hyperbolique des offrandes, « premier-né », ainsi que le parallélisme entre פשעתי (« ma révolte ») et חטאת נפשי. « Torrents d’huile » est une restitution fidèle et poétique de נחלי שמן.
  naturalness: La formulation est globalement naturelle et de registre approprié. Toutefois, « le fruit de mon corps » est nettement moins idiomatique en français que « le fruit de mes entrailles » pour désigner la descendance; ce dernier conserve l’image corporelle du texte sans imposer le sexe du locuteur.
  terminology: « Yahvé », « béliers », « premier-né », « révolte » et « péché » conviennent. La note c doit présenter l’alternative cultuelle sans transformer le sens principal ni suggérer que le texte approuve l’acte évoqué.
