    rationale: « Comme sacrifice pour le péché de ma vie » peut faire croire que la traduction principale porte sur un acte sacrificiel. L’alternative concerne le sens possible de חַטַּאת (« offrande/sacrifice pour le péché »), tandis que le texte principal conserve « péché » par parallélisme.
