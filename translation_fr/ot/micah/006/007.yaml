source:
  edition: WLC
  text: הֲ/יִרְצֶ֤ה יְהוָה֙ בְּ/אַלְפֵ֣י אֵילִ֔ים בְּ/רִֽבְב֖וֹת נַֽחֲלֵי שָׁ֑מֶן הַ/אֶתֵּ֤ן בְּכוֹרִ/י֙ פִּשְׁעִ֔/י פְּרִ֥י בִטְנִ֖/י חַטַּ֥את נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/007.yaml
  text: Will Yahweh be pleased with thousands of rams[a], with ten thousands of streams of oil? Shall I give my firstborn for my transgression[c][b], the fruit of my body for the sin of my soul?
translation:
  language: fr
  text: Yahvé prendra-t-il plaisir à des milliers de béliers, à des myriades de torrents d’huile[a] ? Donnerai-je mon premier-né pour ma révolte, le fruit de mes entrailles[b] pour le péché de mon âme[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à des dizaines de milliers de cours d’eau remplis d’huile ». L’expression hébraïque est une hyperbole évoquant une quantité immense d’huile.
    reason: lexical_alternative
  - marker: b
    text: Ou « le fruit de mon ventre ». Cette expression hébraïque désigne la descendance.
    reason: lexical_alternative
  - marker: c
    text: Ou « pour l’offrande pour le péché de ma vie ». Le mot hébreu peut désigner soit le péché, soit une offrande pour le péché ; le parallèle avec « ma révolte » favorise ici « péché ».
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיִרְצֶה
  choice: prendra-t-il plaisir
  rationale: Le verbe רצה exprime ici l’agrément ou l’acceptation favorable. Cette tournure française conserve la portée évaluative de la question rhétorique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin, plutôt que remplacement par un titre.
- source_word: בְּאַלְפֵי אֵילִים
  choice: à des milliers de béliers
  rationale: La préposition introduit ce qui pourrait susciter l’agrément de Yahvé; « béliers » correspond au contexte sacrificiel.
- source_word: בְּרִבְבוֹת נַחֲלֵי שָׁמֶן
  choice: à des myriades de torrents d’huile
  rationale: « Myriades » rend l’immensité exprimée par רִבְבוֹת, tandis que « torrents » préserve l’image concrète et hyperbolique de נַחֲלֵי.
- source_word: הַאֶתֵּן
  choice: Donnerai-je
  rationale: Le futur interrogatif français poursuit naturellement la série de questions rhétoriques et son intensification.
- source_word: בְּכוֹרִי
  choice: mon premier-né
  rationale: Le texte dit « premier-né » sans expliciter « fils »; la traduction reste donc sobre et fidèle.
- source_word: פִּשְׁעִי
  choice: ma révolte
  rationale: פשע peut désigner une transgression conçue comme rupture ou rébellion. « Révolte » en conserve ici la force.
- source_word: פְּרִי בִטְנִי
  choice: le fruit de mon corps
  rationale: L’expression désigne la descendance. « Corps » conserve l’image sans attribuer explicitement un sexe au locuteur.
- source_word: חַטַּאת נַפְשִׁי
  choice: le péché de mon âme
  rationale: חטאת est compris comme « péché » en parallèle avec « ma révolte ». « Mon âme » maintient la formulation personnelle et poétique de נַפְשִׁי, malgré la possibilité de comprendre « ma vie ».
theological_decisions:
- issue: 'Sens de חַטַּאת : « péché » ou « sacrifice pour le péché »'
  choice: péché
  alternative: sacrifice pour le péché
  rationale: Le parallélisme avec « ma révolte » favorise le sens moral abstrait, tout en laissant l’autre sens attesté dans une note.
- issue: Portée de la mention du premier-né
  choice: Conserver la question rhétorique sans suggérer une approbation divine
  alternative: Expliciter dans le corps du texte que le sacrifice est rejeté
  rationale: Le verset pousse à l’extrême l’escalade des offrandes proposées. La traduction ne doit ni atténuer cette évocation choquante ni ajouter au texte une explication.
translation_notes:
  register: Français international moderne, solennel et poétique sans archaïsme. Les deux interrogations et l’intensification des offrandes sont conservées; l’image hyperbolique des torrents d’huile demeure concrète.
