  to: C’est pourquoi, moi aussi, j’ai commencé à te frapper[a], en te dévastant à cause de tes péchés.
  rationale: La seule modification améliore l’idiomaticité de la clause exprimant le résultat dévastateur du jugement. Elle ne modifie ni la lecture inchoative retenue pour הֶחֱלֵיתִי ni l’ambiguïté lexicale signalée en note.
