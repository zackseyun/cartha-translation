  source_fidelity: Le texte principal rend correctement la séquence emphatique וְגַם אֲנִי (« C’est pourquoi, moi aussi »), la lecture inchoative plausible de הֶחֱלֵיתִי suivie de l’infinitif (« j’ai commencé à te frapper »), ainsi que le motif causal « à cause de tes péchés ». La note conserve de façon appropriée l’autre sens causatif possible de חלה. La révision proposée maintient ces choix.
  naturalness: « Te réduisant à la désolation » est compréhensible mais peu idiomatique en français international moderne et sonne comme un calque abstrait. « En te dévastant » exprime naturellement l’action causative de destruction tout en gardant le lien avec l’action de frapper.
  terminology: « Frapper », « dévaster » et « péchés » sont des termes actuels, sérieux et adaptés au registre prophétique. Ils ne surinterprètent pas le jugement ni ne lui imposent une lecture confessionnelle.
