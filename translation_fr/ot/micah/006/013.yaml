  variant: modern international French
source:
  edition: WLC
  text: וְ/גַם אֲנִ֖י הֶחֱלֵ֣יתִי הַכּוֹתֶ֑/ךָ הַשְׁמֵ֖ם עַל חַטֹּאתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/013.yaml
  text: Therefore I too have begun to strike you[a], making you desolate because of your sins.
translation:
  language: fr
  text: C’est pourquoi, moi aussi, j’ai commencé à te frapper[a], en te dévastant à cause de tes péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je t’ai rendu malade en te frappant ». Le verbe hébreu peut aussi évoquer le fait de rendre malade ou faible.'
    reason: Alternative lexicale authentique du hiphil de חלה, conservée afin de ne pas supprimer l’ambiguïté de l’hébreu.
lexical_decisions:
- source_word: וְגַם
  choice: C’est pourquoi, moi aussi
  rationale: Dans le contexte, la conjonction et l’adverbe expriment à la fois la conséquence des accusations précédentes et une addition emphatique. « C’est pourquoi » rend la portée inférentielle, tandis que « moi aussi » conserve l’insistance de גַם.
- source_word: אֲנִי
  choice: moi
  rationale: Le pronom explicite est conservé sous forme disjointe afin de souligner que le locuteur lui-même intervient pour juger.
- source_word: הֶחֱלֵיתִי
  choice: j’ai commencé
  rationale: Le hiphil de חלה peut signifier « rendre malade/faible » ou « commencer ». Avec l’infinitif « te frapper », la lecture inchoative donne une construction française claire et bien étayée, sans effacer l’autre possibilité, signalée en note.
- source_word: הַכּוֹתֶךָ
  choice: à te frapper
  rationale: L’infinitif construit de נכה avec suffixe de deuxième personne masculine singulière désigne ici une action punitive. « Frapper » est actuel, direct et conserve la vigueur judiciaire du terme.
- source_word: הַשְׁמֵם
  choice: te réduisant à la désolation
  rationale: Le hiphil de שמם exprime ici l’effet dévastateur du jugement. Cette formulation conserve la notion forte de ruine et s’enchaîne naturellement avec l’action de frapper.
- source_word: עַל
  choice: à cause de
  rationale: La préposition introduit le motif du jugement. « À cause de » rend clairement cette relation causale.
- source_word: חַטֹּאתֶךָ
  choice: tes péchés
  rationale: Le pluriel français correspond à la forme hébraïque et renvoie naturellement aux multiples violations dénoncées dans le contexte immédiat.
theological_decisions:
- issue: Formulation du jugement divin dans הֶחֱלֵיתִי הַכּוֹתֶךָ
  choice: « j’ai commencé à te frapper »
  alternative: « je t’ai rendu malade en te frappant »
  rationale: 'La suite du hiphil de חלה et de l’infinitif de נכה peut être comprise de manière inchoative : Dieu a commencé à frapper. La possibilité causative liée à la maladie ou à l’affaiblissement demeure réelle et est donc conservée en note, sans imposer au texte principal une maladie physique précise.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne masculine singulière. La syntaxe conserve l’emphase sur « moi aussi » et la sévérité du jugement, sans archaïsme.
