  text: הַ/אֶזְכֶּ֖ה בְּ/מֹ֣אזְנֵי רֶ֑שַׁע וּ/בְ/כִ֖יס אַבְנֵ֥י מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/011.yaml
  text: Shall I acquit one with wicked scales and with a bag of deceptive weights?[a][b]
translation:
  language: fr
  text: Puis-je déclarer innocent quelqu’un qui utilise des balances injustes et un sac de poids frauduleux ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puis-je être pur avec des balances injustes et un sac de faux poids ? » Le verbe hébreu peut signifier « être pur » ou « être déclaré innocent » ; le contexte favorise ici le sens judiciaire.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « des pierres de tromperie », c’est-à-dire des pierres utilisées comme poids dans le commerce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶזְכֶּה
  choice: Puis-je déclarer innocent
  rationale: Le verbe זכה peut exprimer le fait d’être pur ou d’être tenu pour innocent. Dans le contexte du procès d’alliance, la formulation française retient le sens judiciaire tout en laissant la variante littérale en note.
- source_word: בְּמֹאזְנֵי רֶשַׁע
  choice: qui utilise des balances iniques
  rationale: מֹאזְנַיִם désigne des balances commerciales, et רֶשַׁע leur attribue une qualité moralement coupable. L’ajout de « celui qui utilise » explicite naturellement en français le possesseur ou usager implicite sans changer l’accusation.
- source_word: וּבְכִיס
  choice: et un sac
  rationale: כִּיס désigne ici le sac ou la bourse où le marchand garde ses poids. « Sac » est clair et courant en français international.
- source_word: אַבְנֵי מִרְמָה
  choice: poids trompeurs
  rationale: L’expression signifie littéralement « pierres de tromperie » et renvoie aux pierres servant de poids dans le commerce. « Poids trompeurs » communique directement le référent et conserve la notion de fraude.
theological_decisions:
- issue: Sujet et portée de la question rhétorique
  choice: Le Seigneur demande s’il peut déclarer innocent celui qui pratique la fraude commerciale.
  alternative: Le locuteur demande s’il peut lui-même être pur en présence de balances iniques.
  rationale: Dans le contexte du procès d’alliance de Michée 6, le locuteur divin prononce une accusation. Le sens judiciaire convient donc le mieux, mais l’ambiguïté grammaticale réelle est signalée en note.
translation_notes:
  register: Français moderne, digne et accessible. La question rhétorique conserve sa force judiciaire. « Iniques » maintient la portée morale de רֶשַׁע, tandis que les notes préservent l’ambiguïté du verbe et l’image hébraïque des pierres servant de poids.
