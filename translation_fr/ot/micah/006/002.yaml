source:
  edition: WLC
  text: שִׁמְע֤וּ הָרִים֙ אֶת רִ֣יב יְהוָ֔ה וְ/הָ/אֵתָנִ֖ים מֹ֣סְדֵי אָ֑רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם עַמּ֔/וֹ וְ/עִם יִשְׂרָאֵ֖ל יִתְוַכָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/002.yaml
  text: Hear[a], O mountains, the case of Yahweh, and you enduring foundations of the earth; for Yahweh has a case against his people[c][b], and he will contend with Israel.
translation:
  language: fr
  text: 'Écoutez, montagnes, la cause[a] de Yahvé,


    et vous, solides fondements[b] de la terre !


    Car Yahvé est en litige avec[c] son peuple,


    et il plaidera contre Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « litige », « procès » ou « accusation ». Le mot hébreu peut désigner une contestation formulée dans un cadre judiciaire, notamment celui de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Ou « fondements immuables », « fondements durables » ou « anciens fondements de la terre ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « avec son peuple » ; dans ce contexte judiciaire, l’expression signifie que Yahvé a une cause à faire valoir contre lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel ouvre une sommation prophétique adressée aux montagnes comme témoins. « Écoutez » est naturel en français actuel.
- source_word: הָרִים
  choice: montagnes
  rationale: Le nom est employé en apostrophe. En français, la ponctuation suffit à marquer le vocatif sans ajouter une interjection archaïsante.
- source_word: רִיב
  choice: procès
  rationale: Le mot désigne ici un différend présenté dans un cadre judiciaire et d’alliance. « Procès » rend nettement cette dimension sans imposer tous les détails d’une procédure moderne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente ici le nom divin יהוה plutôt que de le remplacer par un titre.
- source_word: הָאֵתָנִים
  choice: solides
  rationale: Le terme évoque la fermeté, la force ou la permanence. « Solides » convient aux fondements de la terre tout en laissant les autres nuances en note.
- source_word: מֹסְדֵי אָרֶץ
  choice: fondements de la terre
  rationale: Cette expression conserve l’image cosmique des assises de la terre appelées à témoigner avec les montagnes.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de la sommation à écouter.
- source_word: עִם עַמּוֹ
  choice: avec son peuple
  rationale: Après רִיב, la préposition עִם marque la partie avec laquelle Yahvé est en litige. Le français « être en procès avec » garde à la fois la forme relationnelle et la portée adversative du contexte.
- source_word: יִתְוַכָּח
  choice: il plaidera contre
  rationale: Le hitpael de יכח peut désigner une confrontation argumentative ou judiciaire. « Plaidera contre » maintient le registre juridique et explicite l’opposition envers Israël.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Transcription française usuelle du nom du peuple de l’alliance.
theological_decisions:
- issue: Rendu du nom de l’alliance יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. La traduction conserve donc le nom propre sous sa forme française courante au lieu de lui substituer un titre.
- issue: Nature du רִיב entre Yahvé et son peuple
  choice: 'langage judiciaire : « procès », « plaidera contre »'
  alternative: 'langage plus général : « différend », « contestera »'
  rationale: Le contexte présente la création comme témoin et emploie deux termes parallèles de confrontation. Le registre judiciaire est bien attesté, mais la note signale que רִיב peut aussi désigner un litige ou une accusation, sans préciser indûment une procédure juridique moderne.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La disposition en quatre lignes met en valeur le parallélisme poétique. Le vocabulaire judiciaire relie רִיב et יִתְוַכָּח, tandis que les notes préservent leur étendue sémantique et l’ambiguïté de עִם.
