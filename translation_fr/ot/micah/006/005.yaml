  text: עַמִּ֗/י זְכָר נָא֙ מַה יָּעַ֗ץ בָּלָק֙ מֶ֣לֶךְ מוֹאָ֔ב וּ/מֶה עָנָ֥ה אֹת֖/וֹ בִּלְעָ֣ם בֶּן בְּע֑וֹר מִן הַ/שִּׁטִּים֙ עַד הַ/גִּלְגָּ֔ל לְמַ֕עַן דַּ֖עַת צִדְק֥וֹת יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/005.yaml
  text: My people[a], please remember what Balak king of Moab planned[c][b], and what Balaam son of Beor answered him—from Shittim to Gilgal—so that you may know the righteous acts of Yahweh.
translation:
  language: fr
  text: Mon peuple, souviens-toi, je t’en prie, de ce que Balak, roi de Moab, avait projeté[a], et de ce que Balaam, fils de Béor, lui avait répondu — de Shittim à Guilgal[b] —, afin que tu connaisses les actes justes de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que Balak, roi de Moab, avait conseillé ou conçu ».
    reason: lexical_alternative
  - marker: b
    text: Shittim et Guilgal sont des noms de lieux qui évoquent le passage d’Israël des plaines de Moab dans le pays.
    reason: cultural_note
  - marker: c
    text: Ou « les actes de salut de Yahweh » ou « les actes de justice de Yahweh ».
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Mon peuple
  rationale: Vocatif par lequel Dieu s’adresse à Israël; « mon peuple » conserve la dimension relationnelle et celle de l’alliance.
- source_word: זְכָר נָא
  choice: souviens-toi, je t’en prie
  rationale: L’impératif accompagné de נָא exprime ici une exhortation pressante mais adoucie; cette formulation est naturelle en français moderne.
- source_word: מַה יָּעַץ
  choice: ce qu’avait projeté
  rationale: Le verbe יעץ peut signifier conseiller, concevoir ou former un projet. Dans le contexte de Balak, « projeter » rend clairement son dessein hostile sans en préciser excessivement le contenu.
- source_word: בָּלָק מֶלֶךְ מוֹאָב
  choice: Balak, roi de Moab
  rationale: Translittération usuelle du nom propre et apposition naturelle en français.
- source_word: וּמֶה עָנָה אֹתוֹ
  choice: et ce que lui avait répondu
  rationale: Reproduit l’interrogatif « ce que » du texte hébreu et le sens direct de ענה, « répondre à quelqu’un ».
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaam, fils de Béor
  rationale: Translittération française usuelle des noms et conservation du patronyme.
- source_word: מִן הַשִּׁטִּים עַד הַגִּלְגָּל
  choice: depuis Shittim jusqu’à Guilgal
  rationale: Les noms de lieux sont translittérés. La tournure conserve la relation géographique et historique du texte sans expliciter de manière certaine son rattachement syntaxique.
- source_word: לְמַעַן דַּעַת
  choice: afin que tu connaisses
  rationale: Rend la proposition de but; le sujet à la deuxième personne est impliqué par l’adresse « Mon peuple ».
- source_word: צִדְקוֹת
  choice: les actes justes
  rationale: Le pluriel désigne les interventions justes et fidèles de Dieu dans l’histoire. « Actes justes » maintient le lien lexical avec la justice sans réduire le sens au seul salut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Sens de צִדְקוֹת יְהוָה
  choice: les actes justes de Yahweh
  alternative: les actes de salut de Yahweh; les actes de justice de Yahweh
  rationale: L’expression peut englober la justice, la fidélité à l’alliance et les délivrances historiques de Yahweh. La traduction retenue préserve cette amplitude théologique.
- issue: Portée de « depuis Shittim jusqu’à Guilgal »
  choice: Conserver l’expression entre tirets sans en imposer le rattachement
  alternative: Comprendre explicitement qu’il faut se souvenir de ce qui s’est passé entre Shittim et Guilgal
  rationale: La construction hébraïque est condensée et son rattachement précis demeure discuté; la formulation française conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’adresse solennelle de Yahweh, tout en évitant les tournures archaïques. Les tirets préservent la construction condensée et potentiellement ambiguë de l’indication géographique.
