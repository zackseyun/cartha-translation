  verdict: revise
  source_fidelity: 'Le sens de l’hébreu est bien rendu : l’appel adressé au peuple, le projet de Balak, la réponse de Balaam, le repère « de Shittim à Guilgal » et le but de connaître les צדקות de Yahweh sont conservés. La tournure géographique doit toutefois reproduire plus directement le couple מן…עד par « de… à… ».'
