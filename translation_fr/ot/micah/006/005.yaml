  terminology: « Mon peuple », « Balak », « Balaam », « Béor », « Shittim », « Guilgal » et « Yahweh » conviennent. « Les actes justes » conserve raisonnablement la portée de צדקות sans imposer la restriction interprétative de « actes de salut ».
  issues:
