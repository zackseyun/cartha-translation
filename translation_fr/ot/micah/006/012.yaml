  text: אֲשֶׁ֤ר עֲשִׁירֶ֨י/הָ֙ מָלְא֣וּ חָמָ֔ס וְ/יֹשְׁבֶ֖י/הָ דִּבְּרוּ שָׁ֑קֶר וּ/לְשׁוֹנָ֖/ם רְמִיָּ֥ה בְּ/פִי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/012.yaml
  text: whose rich men are full of violence[a], and her inhabitants speak lies; their tongue is deceitful in their mouth.
translation:
  language: fr
  text: Ses riches sont pleins de violence, et ses habitants disent des mensonges ; leur langue est trompeuse dans leur bouche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Ses
  rationale: Le relatif rattache la proposition à la ville évoquée dans le contexte. En français, une reprise possessive directe est plus naturelle qu’une construction avec « dont » isolée au début du verset.
- source_word: עֲשִׁירֶיהָ
  choice: ses riches
  rationale: Le masculin pluriel désigne les membres riches de la ville, probablement ses élites. « Ses riches » reste concis, naturel et conforme à la forme hébraïque.
- source_word: מָלְאוּ חָמָס
  choice: sont pleins de violence
  rationale: Cette formulation rend la valeur résultative de l’expression. חָמָס évoque la violence, l’oppression et les actes injustes ; « violence » en conserve ici la force principale.
- source_word: וְיֹשְׁבֶיהָ
  choice: et ses habitants
  rationale: Le participe substantivé désigne collectivement ceux qui habitent la ville ; « habitants » est précis et naturel.
- source_word: דִּבְּרוּ שָׁקֶר
  choice: disent des mensonges
  rationale: Le parfait décrit ici une conduite caractéristique dans l’accusation prophétique. Le présent français exprime naturellement cette portée, et « dire des mensonges » est idiomatique.
- source_word: וּלְשׁוֹנָם רְמִיָּה בְּפִיהֶם
  choice: dans leur bouche, leur langue n’est que tromperie
  rationale: La formulation conserve les images concrètes de la bouche et de la langue tout en rendant naturellement le prédicat nominal רְמִיָּה. « N’est que tromperie » exprime avec force l’identification hébraïque sans la réduire à un simple adjectif.
