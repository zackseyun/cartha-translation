source:
  edition: WLC
  text: אַתָּ֤ה תֹאכַל֙ וְ/לֹ֣א תִשְׂבָּ֔ע וְ/יֶשְׁחֲ/ךָ֖ בְּ/קִרְבֶּ֑/ךָ וְ/תַסֵּג֙ וְ/לֹ֣א תַפְלִ֔יט וַ/אֲשֶׁ֥ר תְּפַלֵּ֖ט לַ/חֶ֥רֶב אֶתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/014.yaml
  text: You will eat[a], but you will not be satisfied, and your emptiness will remain within you; you will move away, but you will not rescue anything, and what you do rescue I will give to the sword.
translation:
  language: fr
  text: Tu mangeras, mais tu ne seras pas rassasié, et ton vide restera au-dedans de toi[a]. Tu mettras à l’abri, mais tu ne sauveras rien ; et ce que tu sauveras, je le livrerai à l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « ton vide restera au-dedans de toi » est difficile. Elle pourrait aussi signifier « ton humiliation sera au milieu de toi » ou « ton affaissement sera au-dedans de toi ».
    reason: alternative_reading
lexical_decisions:
- source_word: תֹאכַל
  choice: tu mangeras
  rationale: Le qal inaccompli 2ms de אכל a ici une valeur prédictive dans un oracle de jugement.
- source_word: תִשְׂבָּע
  choice: tu ne seras pas rassasié
  rationale: שׂבע désigne le fait d’être rassasié après avoir mangé ; cette formulation française conserve clairement le contraste.
- source_word: יֶשְׁחֲךָ
  choice: ton vide restera
  rationale: La forme est obscure et diversement comprise. Dans le contexte de la faim non apaisée, « ton vide » est plausible ; « restera » explicite naturellement en français la proposition nominale sans prétendre résoudre la difficulté.
- source_word: בְּקִרְבֶּךָ
  choice: au-dedans de toi
  rationale: קֶרֶב peut désigner l’intérieur ou le milieu. Ici, l’expression évoque probablement une détresse intérieure.
- source_word: תַסֵּג
  choice: tu mettras à l’abri
  rationale: Le hiphil de סוג peut exprimer l’action de retirer ou d’emporter. Dans la séquence avec פלט, il s’agit vraisemblablement de tenter de soustraire quelque chose au danger ; cette traduction reste naturelle sans préciser l’objet implicite.
- source_word: תַפְלִיט / תְּפַלֵּט
  choice: tu ne sauveras rien / ce que tu sauveras
  rationale: Le hiphil de פלט signifie faire échapper, délivrer ou sauver. La répétition de « sauver » conserve celle du verbe hébreu ; « rien » rend explicite l’objet sous-entendu dans la première proposition.
- source_word: לַחֶרֶב
  choice: à l’épée
  rationale: Expression prophétique habituelle désignant la mort violente, notamment dans la guerre.
- source_word: אֶתֵּן
  choice: je le livrerai
  rationale: נתן signifie littéralement « donner », mais « livrer à l’épée » est l’expression française idiomatique qui maintient l’action directe du locuteur divin.
theological_decisions:
- issue: Sens de l’expression obscure וְיֶשְׁחֲךָ בְּקִרְבֶּךָ
  choice: un vide intérieur persistant, lié à la privation annoncée
  alternative: « ton humiliation sera au milieu de toi » ou « ton affaissement sera au-dedans de toi »
  rationale: Le contexte immédiat — manger sans être rassasié, échouer à mettre à l’abri et perdre ce qui est sauvé — favorise l’idée d’un manque intérieur. Une note signale néanmoins l’incertitude lexicale afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reflète les formes hébraïques de deuxième personne masculine singulière. La ponctuation met en relief la progression du jugement.
