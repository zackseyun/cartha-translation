source:
  edition: WLC
  text: אַתָּ֥ה תִזְרַ֖ע וְ/לֹ֣א תִקְצ֑וֹר אַתָּ֤ה תִדְרֹֽךְ זַ֨יִת֙ וְ/לֹא תָס֣וּךְ שֶׁ֔מֶן וְ/תִיר֖וֹשׁ וְ/לֹ֥א תִשְׁתֶּה יָּֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/015.yaml
  text: You will sow[a], but you will not reap; you will tread olives, but you will not anoint yourself with oil; and you will tread out new wine, but you will not drink wine.
translation:
  language: fr
  text: Tu sèmeras, mais tu ne moissonneras pas ; tu presseras des olives, mais tu ne t’enduiras pas d’huile ; tu produiras du vin nouveau[a], mais tu ne boiras pas de vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tu fouleras les olives… et du vin nouveau » ; le verbe de la proposition précédente est probablement sous-entendu dans la seconde.'
    reason: ellipse_lexicale
lexical_decisions:
- source_word: תִזְרַע
  choice: tu sèmeras
  rationale: Le verbe זרע signifie couramment « semer ». Ce choix conserve l’image agricole et son opposition directe avec la moisson.
- source_word: תִקְצוֹר
  choice: tu ne moissonneras pas
  rationale: קצר désigne l’action de moissonner ou de récolter. « Moissonner » forme ici un couple naturel avec « semer ».
- source_word: תִדְרֹךְ זַיִת
  choice: tu presseras les olives
  rationale: דרך signifie littéralement « fouler », mais, avec les olives, l’action visée est leur broyage ou leur pressage. « Presser » rend clairement le procédé en français moderne sans en modifier le sens.
- source_word: תָסוּךְ שֶׁמֶן
  choice: tu ne t’enduiras pas d’huile
  rationale: סוך désigne le fait d’appliquer de l’huile sur le corps. « S’enduire d’huile » exprime naturellement l’usage personnel refusé ici, sans suggérer nécessairement une onction rituelle.
- source_word: תִירוֹשׁ
  choice: vin nouveau
  rationale: תירוש désigne le produit récent de la vendange, le moût ou le vin nouveau. « Vin nouveau » conserve la portée agricole du terme sans le réduire au seul jus de raisin.
- source_word: וְתִירוֹשׁ
  choice: tu presseras aussi de quoi faire du vin nouveau
  rationale: L’hébreu ne répète pas le verbe devant תירוש ; celui-ci est vraisemblablement repris de la proposition précédente. La formulation française explicite cette ellipse tout en évitant l’expression incohérente « presser du vin ».
- source_word: תִשְׁתֶּה יַיִן
  choice: tu ne boiras pas de vin
  rationale: יין est le terme ordinaire pour le vin. La formulation maintient le contraste entre la production et la jouissance refusée.
- source_word: אַתָּה
  choice: tu
  rationale: Le pronom répété souligne l’adresse directe au singulier. Le tutoiement singulier et la structure répétée en conservent la force.
theological_decisions:
- issue: Nature de l’image du jugement
  choice: Un jugement exprimé par un travail agricole rendu vain et par la privation de ses produits
  alternative: Une simple série de malheurs agricoles sans arrière-plan d’alliance
  rationale: 'Le verset reprend la forme d’une malédiction : le peuple travaille, mais ne récolte ni ne jouit du fruit de son travail. La traduction conserve cette tension sans ajouter explicitement une interprétation théologique absente de la phrase.'
translation_notes:
  register: Français international moderne, sobre et digne. Le singulier « tu » respecte l’adresse hébraïque. « Presser les olives » est plus idiomatique que « fouler les olives », tandis que « s’enduire d’huile » évite la connotation exclusivement rituelle que pourrait prendre « s’oindre ».
