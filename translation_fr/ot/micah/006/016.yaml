  text: וְ/יִשְׁתַּמֵּ֞ר חֻקּ֣וֹת עָמְרִ֗י וְ/כֹל֙ מַעֲשֵׂ֣ה בֵית אַחְאָ֔ב וַ/תֵּלְכ֖וּ בְּ/מֹֽעֲצוֹתָ֑/ם לְמַעַן֩ תִּתִּ֨/י אֹתְ/ךָ֜ לְ/שַׁמָּ֗ה וְ/יֹשְׁבֶ֨י/הָ֙ לִ/שְׁרֵקָ֔ה וְ/חֶרְפַּ֥ת עַמִּ֖/י תִּשָּֽׂאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/016.yaml
  text: The statutes of Omri are kept[a], and all the works of the house of Ahab; and you walk in their counsels, so that I may make you a desolation, and her inhabitants an object of hissing[c][b], and you will bear the reproach of my people.
translation:
  language: fr
  text: Les prescriptions d’Omri sont observées, ainsi que toutes les pratiques de la maison d’Achab, et vous suivez leurs conseils. C’est pourquoi je ferai de toi une désolation, et de ses habitants un sujet de sifflements[a] ; vous porterez l’opprobre de mon peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un sujet de sifflement » ; il s’agit de sifflements de stupeur ou de mépris devant une ruine.'
    reason: cultural_note
  - marker: b
    text: L’expression hébraïque peut aussi désigner la honte de mon peuple ou l’opprobre dirigé contre mon peuple.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִשְׁתַּמֵּר
  choice: On observe
  rationale: Le nifal à valeur impersonnelle ou passive indique que les prescriptions sont effectivement suivies. « On observe » est naturel en français et conserve cette indétermination.
- source_word: חֻקּוֹת עָמְרִי
  choice: les prescriptions d’Omri
  rationale: « Prescriptions » garde la nuance de règles ou de politiques établies, sans suggérer nécessairement un code législatif formel.
- source_word: מַעֲשֵׂה בֵית אַחְאָב
  choice: toutes les pratiques de la maison d’Achab
  rationale: Dans ce contexte d’imitation durable, « pratiques » exprime mieux des manières d’agir que le calque plus abstrait « œuvres » ; « maison » conserve la référence dynastique.
- source_word: וַתֵּלְכוּ בְּמֹעֲצוֹתָם
  choice: vous suivez leurs conseils
  rationale: Cette formulation française naturelle restitue l’image de la conduite réglée par les conseils ou politiques d’Omri et de la maison d’Achab.
- source_word: לְמַעַן
  choice: C’est pourquoi
  rationale: Dans ce contexte de jugement, la construction peut exprimer le résultat de la conduite dénoncée. « C’est pourquoi » rend clairement le lien sans attribuer à Dieu le dessein de provoquer leur péché.
- source_word: לְשַׁמָּה
  choice: un lieu dévasté
  rationale: Le nom désigne une dévastation qui provoque la stupeur. « Un lieu dévasté » est idiomatique en français et convient à l’adresse collective ou urbaine.
- source_word: לִשְׁרֵקָה
  choice: un objet de dérision
  rationale: Le terme évoque concrètement le sifflement devant une ruine, souvent moqueur ou méprisant. Le texte principal en donne le sens culturel, précisé en note.
- source_word: וְחֶרְפַּת עַמִּי תִּשָּׂאוּ
  choice: vous porterez l’opprobre de mon peuple
  rationale: Cette traduction formellement proche conserve l’ambiguïté de la chaîne construite hébraïque et le changement entre le singulier collectif précédent et le pluriel adressé aux habitants.
theological_decisions:
- issue: Sens de « l’opprobre de mon peuple »
  choice: Conserver « l’opprobre de mon peuple » dans le texte principal.
  alternative: « l’opprobre infligé à mon peuple », « la honte de mon peuple » ou « l’opprobre que porte mon peuple »
  rationale: L’hébreu est compact et ne précise pas explicitement la direction ou la nature exacte de l’opprobre. La traduction ne tranche donc pas une ambiguïté susceptible d’avoir une portée théologique.
- issue: Valeur de לְמַעַן dans l’annonce du jugement
  choice: C’est pourquoi
  alternative: « afin que » ou « de sorte que »
  rationale: La formulation contextuelle exprime le résultat judiciaire de la conduite du peuple et évite de laisser entendre sans nécessité que son obéissance aux politiques impies aurait eu pour finalité divine sa destruction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’accusation prophétique tout en évitant les calques peu naturels. Les alternances entre « on », « vous », « toi » et « ses habitants » reflètent les changements de nombre et l’adresse collective du texte hébreu.
