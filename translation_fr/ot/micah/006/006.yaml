id: MIC.6.6
reference: Micah 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/מָּה֙ אֲקַדֵּ֣ם יְהוָ֔ה אִכַּ֖ף לֵ/אלֹהֵ֣י מָר֑וֹם הַ/אֲקַדְּמֶ֣/נּוּ בְ/עוֹל֔וֹת בַּ/עֲגָלִ֖ים בְּנֵ֥י שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/006.yaml
  text: With what shall I come before Yahweh[a], and bow myself before God on high? Shall I come before him with burnt offerings, with year-old calves?
translation:
  language: fr
  text: Avec quoi me présenterai-je devant Yahweh et me courberai-je devant le Dieu d’en haut[a] ? Me présenterai-je devant lui avec des holocaustes, avec des veaux âgés d’un an ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le Dieu de la hauteur » ou « le Dieu des hauteurs ». On pourrait aussi comprendre : « le Dieu Très-Haut ».'
    reason: L’expression hébraïque est descriptive et peut évoquer à la fois la demeure céleste de Dieu et son élévation, sans employer le titre divin habituel rendu par « Très-Haut ».
lexical_decisions:
- source_word: בַּמָּה
  choice: Avec quoi
  rationale: 'Cette tournure interrogative naturelle conserve le sens instrumental de la préposition : le locuteur demande ce qu’il doit apporter pour s’approcher de Dieu.'
- source_word: אֲקַדֵּם / הַאֲקַדְּמֶנּוּ
  choice: me présenterai-je devant / me présenterai-je devant lui
  rationale: Le verbe קדם évoque ici le fait de venir à la rencontre de quelqu’un ou de se présenter devant lui. La répétition française reproduit l’effet rhétorique de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: אִכַּף
  choice: me courberai-je
  rationale: Le niphal de כף décrit ici un geste corporel d’abaissement respectueux. « Me courber » le restitue sans le réduire à une disposition intérieure.
- source_word: לֵאלֹהֵי מָרוֹם
  choice: devant le Dieu d’en haut
  rationale: Cette formulation française garde l’image spatiale et l’idée d’élévation de מָרוֹם sans transformer automatiquement l’expression descriptive en titre fixe.
- source_word: בְעוֹלוֹת
  choice: avec des holocaustes
  rationale: « Holocauste » est le terme sacrificiel français usuel pour עוֹלָה, offrande entièrement consumée ; le pluriel est conservé.
- source_word: בַּעֲגָלִים בְּנֵי שָׁנָה
  choice: avec des veaux âgés d’un an
  rationale: La formulation rend explicitement et naturellement l’expression hébraïque « veaux fils d’une année ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte emploie directement le nom divin. « Yahweh » en conserve la fonction de nom personnel sans lui substituer un titre.
- issue: 'Statut de מָרוֹם : description ou titre divin'
  choice: le Dieu d’en haut
  alternative: le Dieu Très-Haut ; le Dieu des hauteurs
  rationale: מָרוֹם signifie la hauteur ou ce qui est élevé, mais l’expression n’emploie pas le titre habituel עֶלְיוֹן. Le rendu descriptif préserve cette distinction et l’ambiguïté entre localisation céleste et exaltation.
translation_notes:
  register: Français international moderne, digne et accessible. Les interrogations répétées et le parallélisme du texte hébreu sont conservés ; le vocabulaire sacrificiel traditionnel « holocaustes » demeure intelligible dans le contexte biblique.
