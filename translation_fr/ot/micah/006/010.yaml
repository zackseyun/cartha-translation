  text: ע֗וֹד הַ/אִשׁ֙ בֵּ֣ית רָשָׁ֔ע אֹצְר֖וֹת רֶ֑שַׁע וְ/אֵיפַ֥ת רָז֖וֹן זְעוּמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/010.yaml
  text: Are there still in the house of the wicked treasures of wickedness[b][a], and a scant measure that is accursed?
translation:
  language: fr
  text: Y a-t-il encore dans la maison du méchant des trésors de méchanceté et une mesure trop petite, maudite ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד
  choice: encore
  rationale: Exprime la persistance des pratiques injustes dénoncées.
- source_word: הַאִשׁ
  choice: Y a-t-il
  rationale: La forme hébraïque est difficile, mais le contexte favorise une interrogation rhétorique, rendue naturellement en français.
- source_word: בֵּית רָשָׁע
  choice: dans la maison du méchant
  rationale: Conserve le singulier hébreu et peut désigner aussi bien la demeure que la maisonnée.
- source_word: אֹצְרוֹת רֶשַׁע
  choice: des trésors acquis par la méchanceté
  rationale: Explicite sobrement le rapport probable entre les richesses accumulées et l'injustice, tout en maintenant leur qualification morale.
- source_word: אֵיפַת רָזוֹן
  choice: une mesure trop petite
  rationale: Dans ce contexte commercial, l'épha déficient désigne un récipient de mesure sous-dimensionné servant à léser l'acheteur.
- source_word: זְעוּמָה
  choice: maudite
  rationale: Préserve la forte condamnation exprimée par le terme hébreu, plutôt que de la réduire à une simple désapprobation.
theological_decisions:
- issue: Valeur interrogative de la proposition initiale malgré la difficulté textuelle
  choice: 'Interrogation rhétorique : « Y a-t-il encore… ? »'
  alternative: Déclaration affirmant la présence persistante du gain injuste dans la maison du méchant
  rationale: La suite des accusations divines sous forme de questions, notamment au verset suivant, soutient la lecture interrogative sans éliminer la difficulté de la forme hébraïque.
- issue: Relation exprimée par אֹצְרוֹת רֶשַׁע
  choice: Richesses acquises par des moyens mauvais
  alternative: 'Expression plus formelle : « trésors de méchanceté »'
  rationale: Le contexte des mesures commerciales frauduleuses indique probablement des biens amassés injustement. La formulation française rend ce sens sans introduire de précision doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Mesure trop petite » rend immédiatement compréhensible la fraude commerciale, tandis que la note conserve l’image et le terme culturel hébreux.
