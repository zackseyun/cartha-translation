id: MIC.6.1
reference: Micah 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְעוּ נָ֕א אֵ֥ת אֲשֶׁר יְהוָ֖ה אֹמֵ֑ר ק֚וּם רִ֣יב אֶת הֶ/הָרִ֔ים וְ/תִשְׁמַ֥עְנָה הַ/גְּבָע֖וֹת קוֹלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/001.yaml
  text: 'Hear now what Yahweh says: Arise[a], contend before the mountains, and let the hills hear your voice.'
translation:
  language: fr
  text: 'Écoutez donc ce que dit Yahweh :

    « Lève-toi, plaide ta cause devant les montagnes[a],

    et que les collines entendent ta voix ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plaide contre les montagnes » ou « entre en procès avec les montagnes ». Le verbe hébreu appartient au vocabulaire du litige judiciaire ; ici, les montagnes sont probablement convoquées comme témoins dans le procès d’alliance intenté par Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: Écoutez donc
  rationale: L’impératif appelle à une écoute attentive, tandis que נָא renforce ici l’appel. « donc » donne à l’introduction prophétique une insistance naturelle en français sans en faire une simple formule de politesse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֹמֵר
  choice: dit
  rationale: Le participe introduit la parole présente de Yahweh ; le présent français « dit » convient naturellement à cette formule.
- source_word: קוּם
  choice: Lève-toi
  rationale: Cet impératif constitue une sommation à se mettre en action. « Lève-toi » est actuel, direct et digne.
- source_word: רִיב
  choice: plaide ta cause
  rationale: Le verbe ריב possède ici une forte nuance judiciaire. Cette expression restitue l’idée de litige tout en restant claire pour le lectorat moderne.
- source_word: אֶת הֶהָרִים
  choice: devant les montagnes
  rationale: Avec ריב, אֶת peut désigner les parties impliquées dans le litige. Dans la scène judiciaire du contexte, les montagnes peuvent être prises comme témoins ; « devant » rend bien cette lecture sans masquer les autres possibilités.
- source_word: וְתִשְׁמַעְנָה
  choice: et que ... entendent
  rationale: Après les impératifs, l’inaccompli coordonné a une valeur proche du jussif. La tournure « et que » en transmet naturellement la force.
- source_word: הַגְּבָעוֹת
  choice: les collines
  rationale: Ce terme géographique courant maintient le parallélisme poétique avec les montagnes.
- source_word: קוֹלֶךָ
  choice: ta voix
  rationale: קוֹל désigne normalement la voix dans ce contexte de proclamation ; le rendu est à la fois littéral et idiomatique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » préserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Rôle des montagnes dans la scène judiciaire
  choice: plaider devant les montagnes
  alternative: plaider contre les montagnes / entrer en procès avec les montagnes
  rationale: Le contexte immédiat présente vraisemblablement les montagnes comme témoins du procès d’alliance, mais la construction hébraïque peut aussi les présenter comme parties au litige. Le texte principal retient la lecture contextuellement la plus probable et la note conserve l’ambiguïté.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La disposition en vers fait ressortir le parallélisme poétique. Le tutoiement correspond au singulier masculin des impératifs et du possessif hébreux.
