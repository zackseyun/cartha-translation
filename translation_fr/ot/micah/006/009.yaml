base_translation:
  language: en
  yaml_path: translation/ot/micah/006/009.yaml
  text: 'The voice of the LORD cries out to the city—and sound wisdom fears your name: hear the rod and him who appointed it.'
translation:
  language: fr
  text: 'La voix du SEIGNEUR[a] crie à la ville — la sagesse avisée discerne ton nom[b] : écoutez le bâton et celui qui l’a désigné !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: Signaler que « SEIGNEUR » représente le nom propre divin dans le texte source.
  - marker: b
    text: 'Le texte hébreu vocalisé lit littéralement : « la sagesse voit ton nom ». Les mêmes consonnes peuvent aussi être vocalisées pour donner « craint ton nom »; la traduction « il est sage de craindre ton nom » suppose en outre une autre analyse de la phrase.'
    reason: Préserver la lecture du WLC et signaler avec précision la variante de vocalisation et l’analyse interprétative souvent adoptée.
lexical_decisions:
- source_word: ק֤וֹל יְהוָה֙
  choice: La voix du SEIGNEUR
  rationale: Rend directement « la voix de YHWH »; les petites capitales signalent le nom divin représenté par « SEIGNEUR ».
- source_word: וְתוּשִׁיָּה
  choice: la vraie sagesse
  rationale: תושיה désigne une sagesse solide, efficace ou avisée; « vraie sagesse » reste naturel tout en conservant cette nuance.
- source_word: יִרְאֶה שְׁמֶךָ
  choice: reconnaît ton nom
  rationale: Le texte massorétique vocalisé porte le verbe « voir ». En français, « reconnaître ton nom » exprime idiomatiquement le fait de discerner sa portée sans adopter silencieusement la revocalisation « craindre ».
- source_word: מַטֶּה
  choice: le bâton
  rationale: Conserve l’image concrète du bâton, qui peut représenter ici l’instrument de correction ou de jugement.
- source_word: וּמִי יְעָדָהּ
  choice: et celui qui l’a désigné
  rationale: Rend le pronom interrogatif substantivé « qui » et le verbe יעד, « fixer, désigner, assigner »; le masculin français renvoie naturellement à l’auteur de cette désignation.
theological_decisions:
- issue: Relation entre la sagesse et le nom divin
  choice: « la vraie sagesse reconnaît ton nom »
  alternative: « il est sage de craindre ton nom »
  rationale: La traduction principale suit la vocalisation du WLC, « voit », tout en employant un français intelligible. Une note conserve l’importante lecture alternative « craint », obtenue par une autre vocalisation et largement attestée dans la tradition de traduction.
- issue: Identité de celui qui désigne le bâton
  choice: « celui qui l’a désigné »
  alternative: « celui qui l’a envoyé »
  rationale: Le texte ne nomme pas explicitement Dieu dans cette proposition. La formulation retenue préserve cette retenue tout en laissant le contexte suggérer l’autorité divine.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour volontairement frappant « Écoutez le bâton » conserve la personnification hébraïque. Le tiret marque la rupture syntaxique du verset, et les guillemets délimitent l’exhortation adressée aux habitants.
