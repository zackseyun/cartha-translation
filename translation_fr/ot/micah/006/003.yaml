  text: עַמִּ֛/י מֶה עָשִׂ֥יתִי לְ/ךָ֖ וּ/מָ֣ה הֶלְאֵתִ֑י/ךָ עֲנֵ֥ה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/003.yaml
  text: My people[b][a], what have I done to you? How have I wearied you? Answer me.
translation:
  language: fr
  text: Mon peuple, que t’ai-je fait ? En quoi t’ai-je lassé[a] ? Réponds-moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chargé d’un fardeau » / « accablé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Réponds contre moi » ou « Témoigne contre moi », si l’expression appartient au cadre judiciaire possible du passage.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Mon peuple
  rationale: Vocatif avec suffixe de première personne du singulier ; « Mon peuple » rend naturellement l’adresse d’alliance en français contemporain.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: que t’ai-je fait ?
  rationale: La tournure française conserve l’interrogation directe et l’action dirigée vers l’interlocuteur collectif.
- source_word: וּמָה הֶלְאֵתִיךָ
  choice: En quoi t’ai-je lassé ?
  rationale: « En quoi » exprime idiomatiquement la manière demandée par וּמָה, tandis que « lassé » rend le causatif de לאה sans alourdir la phrase.
- source_word: עֲנֵה בִּי
  choice: Réponds-moi
  rationale: Cette formulation est la plus naturelle pour l’injonction immédiate ; la préposition ב peut toutefois porter ici une nuance judiciaire ou adversative, signalée en note.
theological_decisions:
- issue: Tonalité d’alliance et possible cadre judiciaire
  choice: Conserver l’interpellation personnelle et directe sans ajouter au texte principal un vocabulaire explicite de procès.
  alternative: « Réponds contre moi » ou « témoigne contre moi »
  rationale: Le contexte peut évoquer un procès d’alliance, mais עֲנֵה בִּי n’impose pas à lui seul une traduction explicitement adversative. La note préserve cette possibilité.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier suit les formes hébraïques adressées au peuple comme à un interlocuteur collectif.
