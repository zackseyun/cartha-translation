  text: וְ/הִכְרַתִּ֧י פְסִילֶ֛י/ךָ וּ/מַצֵּבוֹתֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/לֹֽא תִשְׁתַּחֲוֶ֥ה ע֖וֹד לְ/מַעֲשֵׂ֥ה יָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/012.yaml
  text: And I will cut off your carved images and your pillars from your midst[b][a], and you will no longer bow down to the work of your hands.
translation:
  language: fr
  text: Je retrancherai du milieu de toi tes images sculptées et tes pierres dressées[a] ; tu ne te prosterneras plus devant l’œuvre de tes mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes piliers sacrés ». Le terme hébreu désigne des pierres placées verticalement, employées notamment dans des contextes cultuels.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu n’adoreras plus ce que tes mains ont fabriqué ». L’hébreu évoque plus littéralement le geste de se prosterner.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Je retrancherai
  rationale: Le hifil de כרת exprime ici l’action d’enlever ou de supprimer. « Retrancher » conserve l’image concrète de l’hébreu dans un registre biblique encore compréhensible.
- source_word: פְסִילֶיךָ
  choice: tes statues sculptées
  rationale: פֶּסֶל désigne une représentation façonnée par taille. Cette traduction conserve la nature concrète de l’objet sans la réduire au terme générique « idoles ».
- source_word: וּמַצֵּבוֹתֶיךָ
  choice: tes pierres dressées
  rationale: מַצֵּבָה désigne une pierre placée verticalement, souvent à fonction cultuelle. « Pierres dressées » est précis et naturel ; une note explicite le contexte sacré.
- source_word: מִקִּרְבֶּךָ
  choice: du milieu de toi
  rationale: Cette formulation garde l’image hébraïque d’une élimination opérée au sein même du peuple ou du territoire auquel le singulier s’adresse.
- source_word: וְלֹא תִשְׁתַּחֲוֶה עוֹד
  choice: tu ne te prosterneras plus
  rationale: Le verbe שׁחה décrit concrètement l’inclination ou la prosternation accomplie comme acte de culte. La traduction préserve ses dimensions physique et religieuse.
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  choice: devant l’œuvre de tes mains
  rationale: La locution désigne ce que l’être humain a lui-même fabriqué. « Devant » s’accorde naturellement en français avec « se prosterner », tandis que « l’œuvre de tes mains » conserve l’idiome et sa portée polémique.
theological_decisions:
- issue: Désignation des objets cultuels condamnés
  choice: Maintenir la distinction entre « statues sculptées » et « pierres dressées ».
  alternative: « idoles et piliers sacrés »
  rationale: L’hébreu nomme deux catégories distinctes d’objets. Les traduire séparément respecte sa précision et évite de tout ramener au terme théologique générique « idoles ».
- issue: Portée du dernier membre de phrase
  choice: « tu ne te prosterneras plus devant l’œuvre de tes mains »
  alternative: « tu n’adoreras plus ce que tes mains ont fabriqué »
  rationale: Le texte mentionne précisément le geste de prosternation, dans sa fonction cultuelle. Le conserver évite de remplacer l’image corporelle par la seule notion abstraite d’adoration.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque au peuple envisagé collectivement. La formulation conserve les images concrètes du retranchement, des objets façonnés et de la prosternation.
