source:
  edition: WLC
  text: וְ/הִכְרַתִּ֥י כְשָׁפִ֖ים מִ/יָּדֶ֑/ךָ וּֽ/מְעוֹנְנִ֖ים לֹ֥א יִֽהְיוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/011.yaml
  text: And I will cut off sorceries from your hand[b][a], and you will have no soothsayers.
translation:
  language: fr
  text: J’éliminerai de tes mains les pratiques magiques[a], et tu n’auras plus de devins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les sortilèges » ou « les pratiques de sorcellerie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de diseurs de bonne aventure » ou « de lecteurs de présages ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: J’éliminerai
  rationale: Le hiphil de כרת signifie ici retrancher, supprimer ou éliminer. « J’éliminerai » exprime naturellement en français l’action décisive de Dieu sans suggérer qu’il s’agit de couper matériellement quelque chose.
- source_word: כְשָׁפִים
  choice: les pratiques magiques
  rationale: Le pluriel désigne des actes de magie ou de sorcellerie. « Pratiques magiques » est clair en français actuel et évite les connotations parfois trop étroites de « sorcellerie ».
- source_word: מִיָּדֶךָ
  choice: de tes mains
  rationale: La formulation conserve l’image hébraïque de la main, associée ici à la possession, à la maîtrise ou à la pratique. Le pluriel « mains » est l’expression française la plus naturelle dans ce contexte.
- source_word: וּמְעוֹנְנִים
  choice: des devins
  rationale: Le terme désigne des personnes qui cherchent à connaître ou annoncer l’avenir par des signes ou des procédés occultes. « Devins » demeure assez large pour ne pas imposer une méthode particulière.
- source_word: לֹא יִהְיוּ לָךְ
  choice: tu n’auras plus de
  rationale: Littéralement, « ils ne seront pas pour toi ». « Tu n’auras plus de » rend idiomatiquement l’idée que ces praticiens ne se trouveront plus au sein du peuple auquel Dieu s’adresse.
theological_decisions:
- issue: Nature des pratiques condamnées
  choice: Le verset présente Dieu comme supprimant les pratiques magiques et les personnes qui exercent la divination au sein de son peuple.
  alternative: On pourrait préciser davantage le type de divination en parlant de lecteurs de présages ou de diseurs de bonne aventure.
  rationale: Les mots hébreux condamnent clairement la magie et la divination, mais ne permettent pas d’imposer ici une technique occulte unique. La traduction conserve cette portée générale.
translation_notes:
  register: Français moderne, international et digne. La phrase reste directe et prophétique. L’image des mains est conservée, tandis que « pratiques magiques » et « devins » rendent les deux réalités distinctes sans archaïsme excessif.
