  text: And I will execute vengeance in anger and wrath on the nations that have not listened[a].
translation:
  language: fr
  text: Et, dans ma colère et ma fureur, j’exercerai ma vengeance contre les nations qui n’ont pas écouté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui n’ont pas obéi » ou « qui n’ont pas prêté attention ». Le verbe hébreu peut signifier entendre, écouter ou répondre avec obéissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: Et […] j’exercerai
  rationale: Avec נָקָם (« vengeance ») comme complément, עשה forme une expression signifiant exercer ou accomplir la vengeance. « J’exercerai ma vengeance » est idiomatique en français et conserve la portée judiciaire.
- source_word: בְּאַף
  choice: dans ma colère
  rationale: אַף désigne littéralement le nez, mais exprime ici la colère. Le possessif explicite naturellement en français que cette colère est celle du locuteur divin.
- source_word: וּבְחֵמָה
  choice: et ma fureur
  rationale: חֵמָה renforce l’idée de אַף. « Fureur » distingue les deux termes tout en gardant le registre prophétique soutenu.
- source_word: נָקָם
  choice: ma vengeance
  rationale: נָקָם désigne la vengeance ou l’acte de venger, notamment dans un cadre de jugement divin. « Vengeance » en conserve mieux la nuance rétributive que « châtiment ».
- source_word: אֶת הַגּוֹיִם
  choice: contre les nations
  rationale: אֶת marque le complément direct en hébreu, mais l’expression française naturelle est « exercer sa vengeance contre » quelqu’un.
- source_word: אֲשֶׁר לֹא שָׁמֵעוּ
  choice: qui n’ont pas écouté
  rationale: שׁמע peut signifier entendre, écouter ou obéir. « N’ont pas écouté » préserve le sens lexical de base et laisse percevoir le refus de tenir compte de la parole, sans réduire l’ambiguïté.
theological_decisions:
- issue: Sens de שָׁמֵעוּ à propos des nations jugées
  choice: qui n’ont pas écouté
  alternative: qui n’ont pas obéi ; qui n’en ont pas tenu compte
  rationale: Le verbe שׁמע peut désigner aussi bien l’écoute que la réponse obéissante. Le texte principal conserve cette tension par « écouter », tandis que la note explicite les autres nuances possibles.
translation_notes:
  register: Français international moderne, naturel et digne. Le doublet « colère et fureur » maintient l’intensification poétique de l’hébreu, et « exercer ma vengeance » conserve le caractère judiciaire sans archaïsme.
