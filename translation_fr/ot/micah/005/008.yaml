id: MIC.5.8
reference: Micah 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תָּרֹ֥ם יָדְ/ךָ֖ עַל צָרֶ֑י/ךָ וְ/כָל אֹיְבֶ֖י/ךָ יִכָּרֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/008.yaml
  text: May your hand be lifted up over your adversaries[a], and may all your enemies be cut off.
translation:
  language: fr
  text: Que ta main se lève au-dessus de tes adversaires[a], et que tous tes ennemis soient retranchés !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ta main se lèvera au-dessus de tes adversaires, et tous tes ennemis seront retranchés. » Les formes verbales hébraïques peuvent aussi être comprises comme des annonces au futur.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּרֹם
  choice: se lève
  rationale: Le verbe רוּם, accordé avec « main », évoque ici une élévation victorieuse et la supériorité sur les adversaires. « Se lève » conserve l’image concrète dans un français naturel.
- source_word: יָדְךָ
  choice: ta main
  rationale: Traduction littérale qui préserve l’image hébraïque de la main comme symbole de puissance et d’action.
- source_word: עַל
  choice: au-dessus de
  rationale: Cette formulation maintient la dimension verticale et l’idée de domination victorieuse, sans réduire l’expression au simple sens de « contre ».
- source_word: צָרֶיךָ
  choice: tes adversaires
  rationale: צַר désigne ceux qui s’opposent ou se montrent hostiles. « Adversaires » permet de le distinguer du terme parallèle אֹיְבֶיךָ.
- source_word: וְכָל
  choice: et tous
  rationale: Rend directement la coordination et la portée globale de l’hébreu.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Équivalent courant de אֹיֵב, tout en maintenant une légère variation lexicale par rapport à « adversaires ».
- source_word: יִכָּרֵתוּ
  choice: soient retranchés
  rationale: Le niphal de כרת signifie littéralement « être retranché ». Ce choix conserve la force judiciaire et militaire de l’expression sans préciser davantage la manière dont les ennemis disparaissent.
theological_decisions:
- issue: Valeur des formes verbales inaccomplies dans ce contexte prophétique
  choice: 'Les rendre comme un souhait ou une demande : « Que ta main… et que tous tes ennemis… »'
  alternative: 'Les comprendre comme une annonce au futur : « Ta main se lèvera… et tous tes ennemis seront retranchés. »'
  rationale: Les formes hébraïques peuvent recevoir ici une nuance volitive proche du jussif, mais elles peuvent aussi exprimer une prédiction. Le texte principal retient la nuance de souhait, tandis que la note préserve explicitement la lecture au futur.
translation_notes:
  register: Français international moderne, digne et lisible. L’image concrète de la main élevée est conservée. « Retranchés », légèrement soutenu mais intelligible dans ce contexte, maintient la métaphore hébraïque et évite de préciser abusivement « détruits » ou « exterminés ».
