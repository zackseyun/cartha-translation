  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה וְ/הִכְרַתִּ֥י סוּסֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הַאֲבַדְתִּ֖י מַרְכְּבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/009.yaml
  text: And in that day[a], declares Yahweh, I will cut off your horses from among you, and I will destroy your chariots.
translation:
  language: fr
  text: En ce jour-là — déclaration de Yahweh —, je retrancherai du milieu de toi tes chevaux et je détruirai tes chars.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: La formule introduit un événement futur. En français, « En ce jour-là » en exprime naturellement la valeur temporelle et conserve la résonance prophétique sans rendre וְהָיָה de façon artificiellement séparée.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formule signale solennellement une parole divine. « Déclaration de Yahweh » reste proche de la construction nominale hébraïque tout en étant intelligible en français actuel.
- source_word: וְהִכְרַתִּי
  choice: je retrancherai
  rationale: Le hifil de כרת exprime ici une suppression décisive. « Retrancher » conserve davantage l’image concrète du verbe que le simple « enlever ».
- source_word: סוּסֶיךָ מִקִּרְבֶּךָ
  choice: je retrancherai de chez toi tes chevaux
  rationale: מִקִּרְבֶּךָ signifie littéralement « du milieu de toi ». « De chez toi » rend naturellement en français le retrait hors de la collectivité interpellée, désignée au singulier.
- source_word: וְהַאֲבַדְתִּי
  choice: je détruirai
  rationale: Le hifil de אבד signifie faire périr ou détruire ; « détruire » est ici l’équivalent direct et naturel.
- source_word: מַרְכְּבֹתֶיךָ
  choice: tes chars
  rationale: Le terme désigne les chars, dans ce contexte des moyens militaires, avec un suffixe de deuxième personne masculine singulière.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin au lieu de le remplacer par un titre.
- issue: Portée de la suppression des chevaux et des chars
  choice: Conserver l’énoncé concret de la suppression des moyens militaires
  alternative: Expliciter un jugement contre la confiance dans la puissance militaire
  rationale: Le contexte peut suggérer une condamnation de la confiance militaire, mais le verset énonce seulement l’action de Dieu. La traduction ne développe donc pas cette interprétation dans le texte.
translation_notes:
  register: Français international moderne, sobre et prophétique. Les tirets isolent la formule d’oracle sans alourdir la phrase. Le singulier « toi/tes » maintient l’adresse hébraïque à une collectivité personnifiée.
