  yaml_path: translation/ot/micah/005/013.yaml
  text: And I will uproot your Asherah poles from your midst[a], and I will destroy your cities.
translation:
  language: fr
  text: J’arracherai du milieu de toi tes poteaux d’Ashéra[a], et je détruirai tes villes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes ashérim » ou « tes poteaux sacrés ». Le terme hébreu peut désigner des objets cultuels associés à la déesse Ashéra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַשְׁתִּי
  choice: J’arracherai
  rationale: Le verbe נתשׁ exprime l’action d’arracher ou de déraciner. « J’arracherai » convient naturellement à l’enlèvement d’objets cultuels en bois.
- source_word: אֲשֵׁירֶיךָ
  choice: tes poteaux d’Ashéra
  rationale: Dans ce contexte d’élimination des objets idolâtres, le pluriel désigne probablement des objets cultuels associés à la déesse Ashéra. La formulation garde le nom spécifique sans le réduire à un terme générique comme « idoles ».
- source_word: מִקִּרְבֶּךָ
  choice: du milieu de toi
  rationale: Cette formulation conserve l’image et la tonalité solennelle de l’expression hébraïque, tout en restant compréhensible en français.
- source_word: וְהִשְׁמַדְתִּי
  choice: je détruirai
  rationale: Le hiphil de שׁמד signifie faire périr ou détruire. « Détruirai » rend clairement sa force sans l’amplifier.
- source_word: עָרֶיךָ
  choice: tes villes
  rationale: עִיר désigne normalement une ville ou une cité ; « villes » est ici la traduction directe et naturelle.
theological_decisions:
- issue: Référent de אֲשֵׁירֶיךָ
  choice: des objets cultuels associés au culte d’Ashéra (« poteaux d’Ashéra »)
  alternative: « tes ashéras » ou « tes poteaux sacrés » ; le terme peut aussi évoquer la déesse Ashéra elle-même
  rationale: Le contexte immédiat énumère des éléments idolâtres que Dieu supprimera, ce qui favorise le sens concret d’objets cultuels. La note préserve toutefois l’étendue sémantique du terme hébreu.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement singulier reflète les suffixes hébreux de deuxième personne masculine singulière, qui s’adressent collectivement au peuple. La tournure « du milieu de toi » conserve la solennité biblique sans archaïsme excessif.
