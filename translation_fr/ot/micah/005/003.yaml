  naturalness: Le français est globalement naturel, clair et d’un registre biblique moderne. « Il se tiendra debout » conserve volontairement l’image concrète de l’hébreu. Employer le pronom « les » permet une formulation française fluide tout en renvoyant aux habitants évoqués par le contexte, sans ajouter le possessif « son ».
  terminology: « Yahvé », « son Dieu », « majesté », « habiteront en sécurité » et « extrémités de la terre » sont appropriés et cohérents. Les notes conservent utilement l’alternative plus littérale de וישבו et la difficulté discursive de כי עתה.
