  text: וְ/עָמַ֗ד וְ/רָעָה֙ בְּ/עֹ֣ז יְהוָ֔ה בִּ/גְא֕וֹן שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו וְ/יָשָׁ֕בוּ כִּֽי עַתָּ֥ה יִגְדַּ֖ל עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/003.yaml
  text: And he will stand and shepherd in the strength of Yahweh[a], in the majesty of the name of Yahweh his God. And they will dwell secure[b], for now he will be great to the ends of the earth.
translation:
  language: fr
  text: Il se tiendra debout et les fera paître avec la force de Yahvé, dans la majesté du nom de Yahvé, son Dieu. Ils habiteront en sécurité[a], car maintenant[b] il sera grand jusqu’aux extrémités de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ils habiteront » ou « Ils demeureront ». Le verbe hébreu signifie littéralement « habiter », « demeurer » ou « s’asseoir » ; la sécurité est impliquée par le contexte.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « maintenant ». Certaines traductions mettent « alors » pour rendre plus fluide la succession prophétique.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָמַד
  choice: Il se tiendra debout
  rationale: Le verbe עמד signifie concrètement « se tenir debout ». Cette formulation conserve l’image d’un dirigeant établi qui prend sa place, sans la réduire à « se lèvera ».
- source_word: וְרָעָה
  choice: et fera paître son troupeau
  rationale: רעה désigne l’action de faire paître, de prendre soin d’un troupeau ou d’agir en berger. L’ajout explicite de « son troupeau », implicite dans l’image hébraïque, rend la phrase naturelle en français tout en préservant la métaphore pastorale et royale.
- source_word: בְּעֹז יְהוָה
  choice: avec la force de Yahvé
  rationale: עֹז désigne la force ou la puissance. « Avec » exprime naturellement en français le moyen par lequel le dirigeant accomplit sa tâche. Le nom divin יהוה est translittéré « Yahvé » plutôt que remplacé par un titre.
- source_word: בִּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו
  choice: dans la majesté du nom de Yahvé, son Dieu
  rationale: 'גאון peut exprimer la majesté, la grandeur ou l’élévation. La formulation conserve la structure et la portée du texte : le dirigeant agit dans la majesté attachée au nom de Yahvé, qui est appelé « son Dieu ».'
- source_word: וְיָשָׁבוּ
  choice: Ils habiteront en sécurité
  rationale: ישב signifie « s’asseoir », « demeurer » ou « habiter ». Le contexte implique la stabilité et la sécurité ; celles-ci sont exprimées dans le texte, tandis qu’une note signale la valeur plus littérale du verbe.
- source_word: כִּי עַתָּה
  choice: car maintenant
  rationale: כִּי introduit ici la raison et עַתָּה signifie normalement « maintenant ». La traduction conserve cette immédiateté prophétique au lieu de lisser la succession en disant « alors ».
- source_word: יִגְדַּל
  choice: il sera grand
  rationale: גדל exprime ici la grandeur ou l’élévation. « Il sera grand » reste proche de la forme verbale hébraïque et évite d’introduire l’idée d’une croissance progressive.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: jusqu’aux extrémités de la terre
  rationale: Cette expression idiomatique désigne les confins ou les régions les plus éloignées de la terre. La formulation française est à la fois exacte et courante.
theological_decisions:
- issue: Référent des verbes et pronoms au singulier
  choice: Le sujet demeure simplement « il », en continuité avec le dirigeant annoncé dans le contexte précédent.
  alternative: Nommer explicitement le Messie, le Christ, le roi ou un dirigeant davidique.
  rationale: Le contexte immédiat désigne le dirigeant promis, mais le verset lui-même ne donne aucun titre explicite. Garder « il » préserve la portée messianique possible sans l’inscrire dans le texte par ajout interprétatif.
- issue: Relation exprimée par אֱלֹהָיו
  choice: Conserver « son Dieu » à propos du dirigeant.
  alternative: Reformuler ou omettre cette expression afin d’atténuer une éventuelle tension christologique.
  rationale: L’hébreu dit explicitement « Yahvé, son Dieu ». La traduction maintient cette formulation sans résoudre par paraphrase les questions théologiques qu’elle peut soulever.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du berger, le nom divin « Yahvé », l’expression « son Dieu » et l’adverbe temporel « maintenant » sont conservés. La syntaxe reste proche de l’hébreu sans devenir artificielle.
