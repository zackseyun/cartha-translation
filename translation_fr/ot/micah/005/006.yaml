  text: וְ/הָיָ֣ה שְׁאֵרִ֣ית יַעֲקֹ֗ב בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/טַל֙ מֵ/אֵ֣ת יְהוָ֔ה כִּ/רְבִיבִ֖ים עֲלֵי עֵ֑שֶׂב אֲשֶׁ֤ר לֹֽא יְקַוֶּה֙ לְ/אִ֔ישׁ וְ/לֹ֥א יְיַחֵ֖ל לִ/בְנֵ֥י אָדָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/006.yaml
  text: And the remnant of Jacob will be among many peoples like dew from Yahweh[a], like showers upon the grass[b], which do not wait for a man or delay for the sons of man.
translation:
  language: fr
  text: Le reste de Jacob sera, au milieu de nombreux peuples, comme la rosée venant de Yahweh, comme des ondées sur l’herbe, sans attendre un homme ni espérer dans les êtres humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui n’attend pas un homme et n’espère pas dans les fils d’homme ». Les deux verbes hébreux peuvent exprimer l’attente ou l’espérance. La proposition peut se rapporter à l’image de la rosée et des ondées, soulignant qu’elles viennent sans dépendre de l’action humaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: Dans ce discours prophétique, la forme introduit une situation future; « sera » est naturel et conserve cette orientation.
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: le reste de Jacob
  rationale: « Le reste » préserve le motif prophétique du groupe survivant, tandis que « Jacob » maintient le nom explicitement employé.
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: au milieu de nombreux peuples
  rationale: Cette formulation rend directement l’idée de présence au sein de multiples groupes humains, sans les assimiler nécessairement à des États.
- source_word: כְּטַל מֵאֵת יְהוָה
  choice: comme une rosée venant de Yahweh
  rationale: « Venant de » exprime la provenance divine; « Yahweh » rend directement le nom divin יהוה.
- source_word: כִּרְבִיבִים עֲלֵי עֵשֶׂב
  choice: comme des ondées sur l’herbe
  rationale: « Ondées » évoque des pluies répétées ou abondantes tout en conservant l’image concrète de l’herbe.
- source_word: לֹא יְקַוֶּה לְאִישׁ
  choice: qui n’attendent rien de l’homme
  rationale: קוה peut signifier attendre ou espérer. Dans l’image météorologique, la tournure indique que la rosée et les pluies ne dépendent pas de l’intervention humaine.
- source_word: וְלֹא יְיַחֵל לִבְנֵי אָדָם
  choice: et ne comptent pas sur les êtres humains
  rationale: יחל recouvre les idées d’attendre et d’espérer. « Compter sur » rend ici l’absence de dépendance envers l’action humaine, sans répétition lourde.
theological_decisions:
- issue: Référent de la proposition relative
  choice: La proposition se rapporte à la rosée et aux ondées.
  alternative: Elle peut être comprise plus largement comme caractérisant le reste de Jacob.
  rationale: Les images météorologiques sont les antécédents les plus proches et viennent de Yahweh indépendamment de l’action humaine. La syntaxe permet toutefois une résonance indirecte avec le reste de Jacob; la traduction ne développe pas cette possibilité en affirmation politique.
- issue: Traduction de יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » préserve le nom divin dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le pluriel « qui n’attendent… et ne comptent… » rattache naturellement la proposition aux deux images, la rosée et les ondées. « Les êtres humains » rend idiomatiquement l’expression hébraïque « fils d’Adam », dont la forme littérale est conservée en note.
