revisions:
- from: Le reste de Jacob sera, au milieu de nombreux peuples, comme une rosée venant de Yahweh, comme des ondées sur l’herbe, qui n’attendent rien de l’homme et ne comptent pas sur les êtres humains.[a]
  to: Le reste de Jacob sera, au milieu de nombreux peuples, comme la rosée venant de Yahweh, comme des ondées sur l’herbe, sans attendre un homme ni espérer dans les êtres humains.[a]
  rationale: La révision corrige la note, emploie l’expression française générique « la rosée » et remplace le pluriel interprétatif par une construction participiale. Celle-ci rend les verbes d’attente et d’espérance de façon plus directe tout en évitant de trancher en français le référent disputé de la proposition relative.
