  text: וְ/הִכְרַתִּ֖י עָרֵ֣י אַרְצֶ֑/ךָ וְ/הָרַסְתִּ֖י כָּל מִבְצָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/010.yaml
  text: And I will cut off the cities of your land, and I will tear down all your strongholds.
translation:
  language: fr
  text: Je retrancherai les villes de ton pays et je démolirai toutes tes forteresses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Je retrancherai
  rationale: Le hiphil de כרת exprime ici l’élimination, avec l’image forte de « retrancher ». Ce choix conserve la vigueur prophétique de l’hébreu sans se limiter au sens plus général de « détruire ».
- source_word: עָרֵי
  choice: les villes de
  rationale: עִיר désigne normalement une ville ou une cité. « Les villes de » est direct et naturel en français moderne.
- source_word: אַרְצֶךָ
  choice: ton pays
  rationale: אֶרֶץ peut désigner la terre, le territoire ou le pays. Avec les villes et les forteresses, « ton pays » rend naturellement ici le territoire habité auquel s’adresse la parole.
- source_word: וְהָרַסְתִּי
  choice: je démolirai
  rationale: הרס évoque l’action concrète d’abattre ou de renverser des constructions. « Démolir » convient particulièrement aux forteresses et distingue ce verbe de כרת dans le premier membre.
- source_word: כָּל
  choice: toutes
  rationale: כָּל signifie « tout » ou « chaque ». L’accord féminin pluriel avec « forteresses » donne la formulation française naturelle « toutes tes forteresses ».
- source_word: מִבְצָרֶיךָ
  choice: tes forteresses
  rationale: מִבְצָר désigne un lieu fortifié. « Forteresses » exprime clairement et concrètement sa fonction militaire et défensive.
