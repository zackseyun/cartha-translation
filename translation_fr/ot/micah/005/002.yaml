    rationale: Le sujet grammatical est « le reste », nom singulier ; « reviendront » est donc fautif en français. Il faut écrire « reviendra », même si le référent collectif est pluriel en hébreu.
  - severity: low
    issue: Placement de l’ancre de la note b
    rationale: La note b porte sur l’identité de « celle qui est en travail » ; son ancre doit suivre cette expression plutôt que le verbe « aura enfanté ».
  - severity: low
    issue: « auprès des fils d’Israël » atténue la direction du retour
    rationale: « Auprès de » peut évoquer une simple proximité. « Vers les fils d’Israël » rend plus nettement le mouvement tout en ne résolvant pas le débat sur la nature exacte du retour.
