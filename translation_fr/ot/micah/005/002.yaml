  text: לָ/כֵ֣ן יִתְּנֵ֔/ם עַד עֵ֥ת יוֹלֵדָ֖ה יָלָ֑דָה וְ/יֶ֣תֶר אֶחָ֔י/ו יְשׁוּב֖וּ/ן עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/002.yaml
  text: Therefore he will give them up until the time when she who is in labor has given birth[c][b][a]; then the rest of his brothers will return to the sons of Israel.
translation:
  language: fr
  text: C’est pourquoi il les livrera[a] jusqu’au temps où celle qui est en travail[b] aura enfanté ; alors le reste de ses frères reviendra vers les fils d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les remettra » ou « les abandonnera ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu n’identifie pas explicitement « celle qui est en travail ». Il peut s’agir de Sion ou de Juda personnifié, de la mère du dirigeant promis, ou d’une autre figure.
    reason: alternative_reading
  - marker: c
    text: Ou « des enfants d’Israël ». L’hébreu dit littéralement « des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence tirée du contexte précédent dans un français actuel et soutenu.
- source_word: יִתְּנֵם
  choice: il les livrera
  rationale: Dans ce contexte, נתן avec le suffixe pluriel signifie les remettre ou les livrer au pouvoir d’autrui. « Livrera » conserve la dimension judiciaire sans imposer l’idée d’un abandon définitif.
- source_word: עַד עֵת
  choice: jusqu’au temps où
  rationale: Conserve l’expression temporelle explicite de l’hébreu tout en introduisant naturellement la proposition suivante.
- source_word: יוֹלֵדָה יָלָדָה
  choice: celle qui est en travail aura enfanté
  rationale: Rend le participe féminin puis le verbe accompli, sans identifier la femme ni ajouter explicitement la mention d’un enfant absente du texte.
- source_word: וְיֶתֶר אֶחָיו
  choice: alors le reste de ses frères
  rationale: « Le reste » évite de donner automatiquement à יֶתֶר le sens théologique technique de « reste fidèle », tandis que « ses frères » préserve le lien familial laissé indéterminé.
- source_word: יְשׁוּבוּן
  choice: reviendront
  rationale: שוב exprime ici un retour. L’accord au pluriel suit le verbe hébreu et prend « le reste de ses frères » dans son sens collectif.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: auprès des fils d’Israël
  rationale: « Auprès de » exprime le mouvement de retour vers le groupe sans transformer explicitement celui-ci en incorporation ou en réunification.
theological_decisions:
- issue: Identité de « celle qui est en travail »
  choice: L’identité reste indéterminée dans le texte principal.
  alternative: Sion ou Juda personnifié ; la mère du dirigeant promis ; une figure historique plus immédiate.
  rationale: Le texte hébreu ne nomme pas la femme. La traduction conserve donc cette ambiguïté et n’impose aucune lecture messianique ou historique particulière.
- issue: Référent de « ses frères »
  choice: La formulation familiale littérale est conservée sans précision supplémentaire.
  alternative: Les compatriotes israélites du dirigeant ; sa parenté ; les membres de la nation divisée appelés à être réunis.
  rationale: Le contexte rattache probablement le pronom au dirigeant évoqué, mais le verset ne définit pas plus précisément la nature de cette fraternité.
- issue: Sens du retour
  choice: « Reviendront auprès de » conserve l’idée de mouvement et de rapprochement.
  alternative: « Se rallieront aux » ou « seront réunis aux », qui expliciteraient une incorporation ou une réunification nationale.
  rationale: Le verbe שוב peut porter des résonances spatiales ou relationnelles ; la traduction évite de choisir trop nettement entre elles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans devenir artificielle. Le point-virgule met en relief le passage de la période d’abandon au retour annoncé.
