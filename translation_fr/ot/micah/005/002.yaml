revisions:
- from: C’est pourquoi il les livrera[a] jusqu’au temps où celle qui est en travail aura enfanté[b] ; alors le reste de ses frères reviendront auprès des fils d’Israël[c].
  to: C’est pourquoi il les livrera[a] jusqu’au temps où celle qui est en travail[b] aura enfanté ; alors le reste de ses frères reviendra vers les fils d’Israël[c].
  rationale: La révision corrige l’accord grammatical obligatoire du verbe avec « le reste », replace la note interprétative auprès de son référent précis, et choisit « vers » pour exprimer plus clairement le mouvement de retour sans surinterpréter la relation entre les frères et les fils d’Israël. Le reste du projet est fidèle, naturel et conserve les ambiguïtés voulues.
