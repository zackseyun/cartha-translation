id: MIC.5.5
reference: Micah 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רָע֞וּ אֶת אֶ֤רֶץ אַשּׁוּר֙ בַּ/חֶ֔רֶב וְ/אֶת אֶ֥רֶץ נִמְרֹ֖ד בִּ/פְתָחֶ֑י/הָ וְ/הִצִּיל֙ מֵֽ/אַשּׁ֔וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֔/נוּ וְ/כִ֥י יִדְרֹ֖ךְ בִּ/גְבוּלֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/005.yaml
  text: They will shepherd the land of Assyria with the sword[a], and the land of Nimrod at its entrances; and he will deliver us from Assyria when he comes into our land[b], and when he treads within our border.
translation:
  language: fr
  text: 'Ils gouverneront en bergers le pays d’Assyrie avec l’épée,

    et le pays de Nimrod à ses entrées[b].

    Il nous délivrera de l’Assyrie[a]

    quand elle entrera dans notre pays

    et foulera notre territoire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’Assyrien, quand il entrera ». L’hébreu peut personnifier l’Assyrie comme l’envahisseur ennemi.
    reason: alternative_reading
  - marker: b
    text: Ou « à ses portes ». Le mot hébreu signifie littéralement « à ses entrées » ou « à ses ouvertures ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  choice: ils gouverneront en bergers
  rationale: Le verbe רעה signifie normalement « faire paître, être berger ». Dans ce contexte militaire, il évoque une domination exercée par la conquête. « Gouverneront en bergers » conserve l’image pastorale tout en rendant son sens contextuel intelligible en français.
- source_word: אֶרֶץ אַשּׁוּר
  choice: le pays d’Assyrie
  rationale: Cette formulation garde la valeur territoriale de אֶרֶץ et la répétition du mot « pays ».
- source_word: בַּחֶרֶב
  choice: avec l’épée
  rationale: Le beth est instrumental et l’épée est conservée comme moyen concret de la conquête.
- source_word: אֶרֶץ נִמְרֹד
  choice: le pays de Nimrod
  rationale: La tournure française demeure naturelle tout en conservant le nom allusif de Nimrod.
- source_word: בִּפְתָחֶיהָ
  choice: à ses entrées
  rationale: פתח désigne une ouverture ou une entrée. La traduction évite « portes », qui correspondrait normalement à un autre terme hébreu, tout en signalant en note cette possibilité contextuelle.
- source_word: וְהִצִּיל
  choice: il nous délivrera
  rationale: Le hiphil de נצל signifie « délivrer, sauver ». Le sujet singulier est maintenu, avec l’objet « nous » implicite dans le contexte et nécessaire en français.
- source_word: מֵאַשּׁוּר
  choice: de l’Assyrie
  rationale: Le nom national prolonge les mentions territoriales précédentes. La lecture personnifiée « l’Assyrien » reste possible et figure en note.
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: quand elle entrera dans notre pays
  rationale: כִּי reçoit ici une valeur temporelle. Le pronom féminin suit nécessairement en français le choix principal « l’Assyrie »; l’hébreu emploie toutefois un verbe masculin et peut personnifier la puissance assyrienne.
- source_word: וְכִי יִדְרֹךְ בִּגְבוּלֵנוּ
  choice: et foulera notre territoire
  rationale: דרך conserve l’image concrète de fouler ou marcher, tandis que גבול désigne ici l’espace délimité, donc le territoire, et non seulement la ligne frontalière.
theological_decisions:
- issue: Passage d’un sujet pluriel à un sujet singulier
  choice: Conserver le passage de « ils gouverneront » à « il nous délivrera »
  alternative: Uniformiser le sujet au pluriel ou au singulier dans tout le verset
  rationale: L’hébreu passe réellement du pluriel au singulier. Cette tension peut distinguer les chefs mentionnés dans le contexte du souverain-délivreur et ne doit pas être harmonisée sans nécessité.
- issue: Référent d’אַשּׁוּר dans la dernière proposition
  choice: Traduire par « l’Assyrie » dans le texte principal
  alternative: Traduire par « l’Assyrien »
  rationale: Le contexte emploie d’abord un langage territorial, mais le masculin singulier de l’hébreu permet aussi de personnifier l’envahisseur assyrien. Le texte principal retient le nom national et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation « gouverneront en bergers » préserve l’image hébraïque sans donner à entendre une activité pastorale paisible, puisque « avec l’épée » en précise immédiatement la force militaire. Les marqueurs de notes sont placés auprès des expressions auxquelles les notes se rapportent.
