  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֥ה זֶ֖ה שָׁל֑וֹם אַשּׁ֣וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֗/נוּ וְ/כִ֤י יִדְרֹךְ֙ בְּ/אַרְמְנֹתֵ֔י/נוּ וַ/הֲקֵמֹ֤נוּ עָלָי/ו֙ שִׁבְעָ֣ה רֹעִ֔ים וּ/שְׁמֹנָ֖ה נְסִיכֵ֥י אָדָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/004.yaml
  text: And he will be peace[a]. When Assyria comes into our land and treads in our citadels[c][b], then we will raise up against him seven shepherds and eight princes of men.
translation:
  language: fr
  text: Celui-ci sera la paix. Quand l’Assyrie[a] entrera dans notre pays et qu’elle foulera le sol de nos citadelles[b], nous susciterons contre elle sept bergers et huit chefs parmi les hommes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Assyrien ». Le mot hébreu peut désigner l’Assyrie comme nation ou l’envahisseur assyrien pris individuellement.
    reason: alternative_reading
  - marker: b
    text: Ou « nos palais ». Le terme hébreu peut désigner des palais royaux ou des places fortes.
    reason: lexical_alternative
  - marker: c
    text: La formule « sept… et huit » est une expression numérique hébraïque qui peut évoquer un nombre abondant ou suffisant.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה זֶה
  choice: Et lui, il sera
  rationale: Le démonstratif זֶה renvoie au dirigeant annoncé dans le contexte immédiat. La tournure disloquée « Et lui, il… » conserve cette insistance anaphorique tout en restant naturelle en français actuel.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: Le nom שָׁלוֹם englobe paix, bien-être et intégrité. « La paix » est ici la formulation française la plus concise et laisse résonner toute la portée du terme.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Le mot désigne normalement la nation, mais peut aussi personnifier l’envahisseur assyrien. Le nom géopolitique convient naturellement avec l’entrée dans le pays; l’autre lecture est signalée en note.
- source_word: כִּי יָבוֹא
  choice: Quand … entrera
  rationale: Dans ce contexte, כִּי introduit vraisemblablement la circonstance temporelle de l’invasion. Avec un verbe de mouvement, « entrer dans » rend naturellement בְאַרְצֵנוּ.
- source_word: וְכִי יִדְרֹךְ
  choice: et qu’elle foulera
  rationale: Le verbe דרך évoque littéralement l’action de poser le pied ou de fouler. Cette image concrète est conservée sans expliciter davantage l’idée militaire de marche ou de piétinement.
- source_word: בְאַרְמְנֹתֵינוּ
  choice: nos citadelles
  rationale: אַרְמוֹן peut désigner un palais ou une place forte. Dans une scène d’invasion, « citadelles » exprime bien l’idée de centres urbains ou royaux fortifiés.
- source_word: וַהֲקֵמֹנוּ
  choice: nous susciterons
  rationale: Le hiphil de קום signifie faire se lever, établir ou désigner. « Susciter » convient à l’établissement de dirigeants appelés à faire face à l’envahisseur.
- source_word: עָלָיו
  choice: contre elle
  rationale: Le suffixe hébreu masculin singulier reprend l’Assyrie conçue comme l’envahisseur. En français, le genre grammatical de « l’Assyrie » impose naturellement « elle » dans la lecture principale.
- source_word: שִׁבְעָה רֹעִים
  choice: sept bergers
  rationale: Le terme signifie littéralement « bergers » et fonctionne métaphoriquement pour des dirigeants. L’image est conservée.
- source_word: וּשְׁמֹנָה נְסִיכֵי אָדָם
  choice: et huit chefs parmi les hommes
  rationale: נְסִיכִים désigne des chefs, princes ou dirigeants établis. « Chefs parmi les hommes » rend la construction avec אָדָם sans lui donner artificiellement le sens abstrait de toute l’humanité.
theological_decisions:
- issue: Identité du sujet qui « sera la paix »
  choice: Le sujet est personnel et renvoie au dirigeant annoncé dans le contexte précédent.
  alternative: Traduire plus formellement « celui-ci sera la paix », sans expliciter davantage la reprise personnelle.
  rationale: Le démonstratif renvoie naturellement au dirigeant issu de Bethléem dans le contexte immédiat. La traduction respecte ce lien discursif sans ajouter d’identification doctrinale absente de la proposition.
- issue: Portée de la formule numérique « sept… huit »
  choice: Conserver les nombres littéraux tout en signalant leur probable valeur d’abondance ou de suffisance.
  alternative: Y voir uniquement le dénombrement exact de quinze dirigeants.
  rationale: La construction graduée « sept… huit » est une formule numérique hébraïque susceptible d’évoquer un nombre amplement suffisant. Le texte principal ne tranche pas en paraphrasant l’expression.
- issue: Assyrie comme nation ou envahisseur personnifié
  choice: Employer « l’Assyrie » dans le texte principal.
  alternative: Employer « l’Assyrien » pour présenter personnellement l’envahisseur.
  rationale: Le terme hébreu permet les deux lectures. Le contexte géopolitique favorise le nom de la nation, tandis qu’une note préserve la personnification possible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve les images de la paix, des bergers et de l’action de fouler. « Et lui, il sera » marque naturellement l’insistance du démonstratif hébreu; « chefs parmi les hommes » évite l’archaïsme de « princes des hommes » sans neutraliser le caractère humain des dirigeants.
