  text: וְ/הָיָה֩ שְׁאֵרִ֨ית יַעֲקֹ֜ב בַּ/גּוֹיִ֗ם בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/אַרְיֵה֙ בְּ/בַהֲמ֣וֹת יַ֔עַר כִּ/כְפִ֖יר בְּ/עֶדְרֵי צֹ֑אן אֲשֶׁ֧ר אִם עָבַ֛ר וְ/רָמַ֥ס וְ/טָרַ֖ף וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/007.yaml
  text: And the remnant of Jacob will be among the nations[a], in the midst of many peoples, like a lion among the beasts of the forest, like a young lion among flocks of sheep, which, if it passes through, tramples and tears[b], and there is none to rescue.
translation:
  language: fr
  text: 'Le reste de Jacob sera parmi les nations, au milieu de peuples nombreux, comme un lion parmi les animaux de la forêt, comme un jeune lion parmi les troupeaux de petit bétail : s’il passe, il piétine et déchire[a], sans que personne puisse porter secours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « met en pièces ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: Le waw suivi du qatal exprime ici un résultat futur dans le discours prophétique. « Sera » en restitue clairement la portée.
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: le reste de Jacob
  rationale: « Le reste » est l’expression française biblique naturelle pour le groupe survivant, sans expliciter davantage sa portée théologique.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les nations au sens large ; cette traduction évite la connotation plus tardive de « païens ».
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: au milieu de peuples nombreux
  rationale: La formulation conserve l’image spatiale de בְּקֶרֶב et le parallélisme avec « parmi les nations ».
- source_word: כְּאַרְיֵה בְּבַהֲמוֹת יַעַר
  choice: comme un lion parmi les animaux de la forêt
  rationale: « Animaux » rend בְּהֵמוֹת en français moderne et accessible, tandis que « de la forêt » préserve la relation du texte hébreu.
- source_word: כִּכְפִיר
  choice: comme un jeune lion
  rationale: כְּפִיר évoque un lion jeune et vigoureux ; « jeune lion » est précis et naturel.
- source_word: בְּעֶדְרֵי צֹאן
  choice: parmi les troupeaux de petit bétail
  rationale: צֹאן peut comprendre les moutons et les chèvres. « Petit bétail » préserve cette étendue lexicale sans réduire indûment le sens aux seuls moutons.
- source_word: אֲשֶׁר אִם עָבַר
  choice: s’il passe
  rationale: La construction relative avec אִם garde une valeur conditionnelle. La formulation française concise conserve cette ouverture plutôt que de la transformer en certitude temporelle.
- source_word: וְרָמַס וְטָרַף
  choice: il piétine et déchire
  rationale: Ces verbes rendent directement l’action violente du prédateur sans ajouter explicitement « met en pièces », qui reste toutefois possible.
- source_word: וְאֵין מַצִּיל
  choice: sans que personne puisse délivrer
  rationale: Cette tournure française exprime l’absence de tout sauveteur. « Délivrer » conserve la portée générale de נצל tout en convenant à l’image d’une proie arrachée au prédateur.
theological_decisions:
- issue: La métaphore du reste semblable à un lion parmi les nations
  choice: Conserver l’image d’une puissance irrésistible sans définir le mode précis de son accomplissement.
  alternative: L’interpréter explicitement comme une conquête militaire, une domination politique ou une réalité eschatologique déterminée.
  rationale: Le texte décrit la supériorité prédatrice du reste, mais ne précise pas ici si son accomplissement doit être compris exclusivement en termes militaires, politiques ou eschatologiques.
translation_notes:
  register: Français international moderne, digne et imagé. La syntaxe a été légèrement resserrée après les deux comparaisons pour éviter un relatif ambigu en français. « Petit bétail » respecte mieux l’étendue de צֹאן que « moutons », tout en restant courant dans un registre biblique.
