source:
  edition: WLC
  text: וְ/אַתָּ֞ה בֵּֽית לֶ֣חֶם אֶפְרָ֗תָה צָעִיר֙ לִֽ/הְיוֹת֙ בְּ/אַלְפֵ֣י יְהוּדָ֔ה מִמְּ/ךָ֙ לִ֣/י יֵצֵ֔א לִֽ/הְי֥וֹת מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵ֑ל וּ/מוֹצָאֹתָ֥י/ו מִ/קֶּ֖דֶם מִ/ימֵ֥י עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/001.yaml
  text: But you[a], Bethlehem Ephrathah, too small to be among the clans of Judah, from you one will come out for me to be ruler in Israel, whose goings forth are from of old[b], from the days of eternity.
translation:
  language: fr
  text: Mais toi, Bethléhem Éphrata, trop petite pour être parmi les clans de Juda[a], de toi sortira pour moi celui qui sera un chef en Israël. Ses origines remontent aux temps anciens[b], aux jours d’éternité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trop petite pour être parmi les milliers de Juda ». Ici, les « milliers » peuvent désigner les groupes familiaux ou les clans de la tribu.'
    reason: lexical_alternative
  - marker: b
    text: 'Le mot rendu par « origines » peut aussi se traduire plus concrètement par « sorties » ou « venues ». L’ensemble peut également se comprendre : « ses origines remontent à l’Antiquité, aux jours d’autrefois », ou, dans un sens plus fort, comme évoquant une existence « depuis toujours ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית לֶחֶם אֶפְרָתָה
  choice: Bethléhem Éphrata
  rationale: Conserve les deux noms du lieu afin de distinguer cette Bethléhem des autres, tout en employant leurs formes françaises usuelles.
- source_word: צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה
  choice: trop petite pour compter parmi les clans de Juda
  rationale: « Trop petite pour » rend la construction infinitive, tandis que « clans » exprime ici le sens socio-administratif de אַלְפֵי, littéralement « milliers ».
- source_word: מִמְּךָ לִי יֵצֵא
  choice: de toi sortira pour moi
  rationale: Rend concrètement le verbe יָצָא et conserve explicitement לִי, « pour moi », sans préciser davantage la nature de cette relation avec Dieu.
- source_word: לִהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: celui qui exercera le pouvoir en Israël
  rationale: Formulation française naturelle qui conserve le sens de מוֹשֵׁל et la valeur locative de בְּ, sans remplacer celle-ci par « sur Israël ».
- source_word: מוֹצָאֹתָיו
  choice: ses origines
  rationale: Dans ce contexte, le nom peut désigner les sorties, les venues ou, par extension, les origines. « Ses origines » est intelligible en français moderne; le sens plus formel « ses sorties » est signalé en note afin de ne pas masquer l'ambiguïté.
- source_word: מִקֶּדֶם מִימֵי עוֹלָם
  choice: remontent aux temps anciens, aux jours d’éternité
  rationale: La formulation garde ensemble l’idée d’une haute antiquité et la possibilité d’une portée plus forte liée à l’éternité, sans réduire עוֹלָם aux seuls temps historiques ni imposer explicitement « depuis toujours ».
theological_decisions:
- issue: La dernière proposition affirme-t-elle explicitement une préexistence éternelle, ou évoque-t-elle plus modestement une origine très ancienne ?
  choice: Ses origines remontent aux temps anciens, aux jours d’éternité.
  alternative: 'Ses origines remontent à l’Antiquité, aux jours d’autrefois; ou, dans un sens plus fort: elles remontent à toujours.'
  rationale: Le vocabulaire hébreu permet une lecture portant sur une antiquité reculée aussi bien qu’une compréhension plus forte en rapport avec l’éternité. Le texte principal conserve cette tension au lieu de trancher une question théologique que la formulation hébraïque laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le contraste initial « Mais toi » et la répétition « de toi », tout en divisant la longue phrase hébraïque en deux phrases pour assurer une lecture naturelle. « Jours d’éternité » est volontairement plus solennel afin de préserver la densité et l’ambivalence de עוֹלָם.
