review_pass:
  verdict: revise
  source_fidelity: 'La structure fondamentale est conservée : l’adverbe temporel, l’accusation selon laquelle « mon peuple » se lève comme un ennemi, le passage à l’adresse au pluriel, le dépouillement des passants et la difficulté de la clausule finale. Toutefois, « de dessus le vêtement » reproduit maladroitement une relation vestimentaire ambiguë et ne rend pas naturellement l’acte de dépouiller les voyageurs. « Qui passent sans crainte » rend mieux בֶּטַח sans impliquer qu’ils soient effectivement en sécurité.'
  naturalness: Une légère révision améliore nettement le français actuel. « Se lève comme un ennemi » est plus idiomatique et plus transparent que « se dresse en ennemi ». La formulation « vous arrachez le manteau qu’ils portent sur leurs vêtements » préserve les deux termes de vêtement tout en évitant une expression française pesante.
  terminology: « Manteau » et « vêtements » constituent une paire naturelle pour אֶדֶר et שַׂלְמָה sans prétendre distinguer techniquement deux types de pièce. « Reviennent de la guerre » reste une lecture défendable de שׁוּבֵי מִלְחָמָה, et la note conserve les interprétations concurrentes sans les présenter comme certaines.
  issues:
  - severity: medium
    issue: La formulation « le manteau de dessus le vêtement » est peu naturelle et obscurcit le rapport entre les deux termes vestimentaires.
    rationale: L’hébreu emploie une expression difficile, mais décrit vraisemblablement l’enlèvement violent d’un manteau/ample vêtement extérieur. Une reformulation française explicite l’image sans supprimer l’ambiguïté lexicale.
  - severity: low
    issue: « En sécurité » peut suggérer une sécurité objective que l’agression immédiatement décrite dément.
    rationale: בֶּטַח désigne ici plus naturellement une marche confiante, tranquille ou sans crainte. « Sans crainte » est idiomatique et conserve cette nuance.
