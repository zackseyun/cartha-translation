source:
  edition: WLC
  text: וְ/אֶתְמ֗וּל עַמִּ/י֙ לְ/אוֹיֵ֣ב יְקוֹמֵ֔ם מִ/מּ֣וּל שַׂלְמָ֔ה אֶ֖דֶר תַּפְשִׁט֑וּ/ן מֵ/עֹבְרִ֣ים בֶּ֔טַח שׁוּבֵ֖י מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/008.yaml
  text: But lately my people have risen up as an enemy; from off the garment you strip the robe from those who pass by securely[a], those returning from war.
translation:
  language: fr
  text: 'Mais depuis peu, mon peuple se lève comme un ennemi : vous arrachez aux passants qui passent sans crainte le manteau qu’ils portent sur leurs vêtements, eux qui reviennent de la guerre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ceux qui se détournent du combat » ou « ceux qui renoncent à la guerre ». La fin du verset est difficile en hébreu et pourrait désigner des non-combattants pacifiques plutôt que des personnes revenant de la guerre.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶתְמוּל
  choice: Mais depuis peu
  rationale: Le terme signifie littéralement « hier », mais peut désigner idiomatiquement un passé récent. « Mais depuis peu » rend à la fois la valeur temporelle et le contraste introduit par la conjonction.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Rend directement le possessif et conserve la portée relationnelle de l’expression.
- source_word: לְאוֹיֵב יְקוֹמֵם
  choice: se dresse en ennemi
  rationale: La tournure exprime une attitude hostile. « En ennemi » reste proche de la construction prédicative hébraïque sans affirmer que le peuple est devenu, par essence, un ennemi.
- source_word: מִמּוּל שַׂלְמָה אֶדֶר תַּפְשִׁטוּן
  choice: vous arrachez le manteau de dessus le vêtement
  rationale: La formulation conserve les deux termes vestimentaires et l’image d’un vêtement extérieur retiré avec violence. « Arrachez » exprime naturellement la force suggérée par le contexte de prédation.
- source_word: מֵעֹבְרִים בֶּטַח
  choice: à ceux qui passent en sécurité
  rationale: Le participe désigne des passants ou voyageurs, et בֶּטַח leur état de sécurité ou d’absence de crainte. La formulation française garde cette nuance sans ajouter qu’ils seraient nécessairement confiants ou naïfs.
- source_word: שׁוּבֵי מִלְחָמָה
  choice: à ceux qui reviennent de la guerre
  rationale: Cette lecture prend שׁוּבֵי au sens de « ceux qui reviennent ». Comme la construction est difficile et admet d’autres analyses, celles-ci sont signalées en note.
theological_decisions:
- issue: Sens de la formule difficile שׁוּבֵי מִלְחָמָה
  choice: ceux qui reviennent de la guerre
  alternative: ceux qui se détournent du combat / ceux qui renoncent à la guerre
  rationale: 'La lecture retenue suit le sens courant de שוב, « revenir », et produit une accusation cohérente : même des voyageurs revenant de la guerre sont dépouillés. L’hébreu pouvant aussi évoquer des personnes qui se détournent du combat, cette ambiguïté réelle est conservée en note plutôt que tranchée silencieusement.'
translation_notes:
  register: Français international actuel, direct et digne. Le deux-points rend la transition entre l’accusation générale et l’acte concret. Le passage du singulier collectif (« mon peuple se dresse ») au pluriel adressé (« vous arrachez ») est maintenu, conformément au changement de personne du texte hébreu.
