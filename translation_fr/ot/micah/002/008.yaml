revisions:
- from: 'Mais depuis peu, mon peuple se dresse en ennemi : vous arrachez le manteau de dessus le vêtement à ceux qui passent en sécurité, à ceux qui reviennent de la guerre[a].'
  to: 'Mais depuis peu, mon peuple se lève comme un ennemi : vous arrachez aux passants qui passent sans crainte le manteau qu’ils portent sur leurs vêtements, eux qui reviennent de la guerre[a].'
  rationale: La révision maintient le sens retenu et l’ambiguïté signalée en note, tout en rendant l’accusation plus naturelle en français. « Comme un ennemi » exprime adéquatement la valeur prédicative/comparative de לְאוֹיֵב. La reprise « eux qui » présente « ceux qui reviennent de la guerre » comme une précision des passants, conformément à la lecture principale, sans modifier la portée de la note.
