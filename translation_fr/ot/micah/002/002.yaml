  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/חָמְד֤וּ שָׂדוֹת֙ וְ/גָזָ֔לוּ וּ/בָתִּ֖ים וְ/נָשָׂ֑אוּ וְ/עָֽשְׁקוּ֙ גֶּ֣בֶר וּ/בֵית֔/וֹ וְ/אִ֖ישׁ וְ/נַחֲלָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/002.yaml
  text: They covet fields and seize them[a], and houses and take them away; they oppress a man and his house[c][b], a man and his inheritance.
translation:
  language: fr
  text: Ils convoitent des champs et s’en emparent[a], des maisons et les prennent[b]. Ils oppriment l’homme et sa maison, l’homme et son héritage[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les prennent de force » ou « les dépouillent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les emportent ».
    reason: lexical_alternative
  - marker: c
    text: Ici, « héritage » peut désigner particulièrement la terre héritée, le patrimoine familial, et non simplement les biens en général.
    reason: cultural_note
lexical_decisions:
- source_word: חָמְדוּ
  choice: convoitent
  rationale: Le verbe exprime ici le désir coupable de ce qui appartient à autrui, désir qui conduit aux spoliations décrites ensuite.
- source_word: שָׂדוֹת
  choice: des champs
  rationale: Désigne concrètement des parcelles de terre cultivée.
- source_word: גָזָלוּ
  choice: s’en emparent
  rationale: Le verbe indique une prise injuste ou violente. « S’en emparent » convient aux champs et exprime clairement la dépossession.
- source_word: בָתִּים
  choice: des maisons
  rationale: Équivalent direct qui maintient l’accent concret sur les biens immobiliers.
- source_word: נָשָׂאוּ
  choice: les enlèvent
  rationale: Dans ce contexte, le verbe signifie emporter ou faire disparaître les maisons de la possession de leurs propriétaires; la formulation conserve l’image hébraïque sans préciser indûment le procédé.
- source_word: עָשְׁקוּ
  choice: oppriment
  rationale: Le verbe couvre l’exploitation, la spoliation et l’oppression économique; « oppriment » préserve cette portée générale.
- source_word: גֶּבֶר
  choice: l’homme
  rationale: Le masculin singulier représente ici la victime individuelle et reste parallèle à אִישׁ.
- source_word: בֵיתוֹ
  choice: sa maison
  rationale: Le terme peut désigner la maison physique ou la maisonnée. Le contexte foncier favorise « maison », tout en laissant entendre la sphère familiale.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le masculin singulier forme un parallélisme avec גֶּבֶר et désigne de nouveau la victime individuelle.
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: Le terme désigne particulièrement le patrimoine reçu, souvent une terre héréditaire, et porte davantage de résonance juridique et familiale que « biens ».
theological_decisions:
- issue: Noms masculins singuliers גֶּבֶר et אִישׁ
  choice: l’homme… l’homme
  alternative: une personne… une personne / les gens… leur héritage
  rationale: L’hébreu emploie deux noms masculins singuliers dans un parallélisme représentatif. La traduction conserve cette forme au lieu de la neutraliser ou de la pluraliser.
- issue: Portée de בֵיתוֹ
  choice: sa maison
  alternative: sa maisonnée
  rationale: Le contexte de saisie des champs et des maisons soutient le sens immobilier, mais l’ambiguïté possible avec la maisonnée demeure signalée par la formulation et le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme accusateur de l’hébreu est conservé, ainsi que le vocabulaire concret de la spoliation foncière. Les marqueurs de notes suivent leur mot ou proposition de référence.
