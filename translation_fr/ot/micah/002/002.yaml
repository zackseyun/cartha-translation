  to: Ils convoitent des champs et s’en emparent[a], des maisons et les prennent[b]. Ils oppriment l’homme et sa maison, l’homme et son héritage[c].
  rationale: La seule correction nécessaire remplace une expression française ambiguë et peu naturelle lorsqu’elle a pour objet « des maisons ». « Les prennent » traduit de façon claire et non surinterprétative l’appropriation exprimée dans le contexte; la note conserve « les emportent » comme possibilité lexicale plus imagée. Les ancres a, b et c restent placées auprès de leurs référents respectifs.
