review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental et le parallélisme de l’hébreu sont bien rendus : convoitise, appropriation des champs, prise des maisons, puis oppression d’un homme avec sa maison et son patrimoine héréditaire. Toutefois, « les enlèvent », appliqué à des maisons, suggère normalement en français l’enlèvement de personnes ou le déplacement matériel de bâtiments; il ne rend pas naturellement ici la prise ou l’éviction impliquée par נָשָׂאוּ.'
  naturalness: La formulation est globalement sobre et intelligible en français moderne. Le remplacement de « les enlèvent » par « les prennent » rend la seconde action naturelle sans introduire un mécanisme juridique ou matériel absent du texte source.
  terminology: « Convoitent », « champs », « s’en emparent », « oppriment », « maison » et « héritage » sont appropriés. « Héritage » conserve utilement la portée de נחלה, notamment le patrimoine foncier transmis. Les notes sont correctement ancrées dans le texte français révisé.
  issues:
  - severity: medium
    issue: « les enlèvent » à propos des maisons
    rationale: En français courant, « enlever une maison » évoque surtout son enlèvement matériel, ou bien « enlever » une personne. Dans ce contexte de dépossession, « les prennent » est idiomatique et garde la sobriété ainsi que l’ambiguïté du verbe hébreu נשׂא.
  revised_text: Ils convoitent des champs et s’en emparent[a], des maisons et les prennent[b]. Ils oppriment l’homme et sa maison, l’homme et son héritage[c].
