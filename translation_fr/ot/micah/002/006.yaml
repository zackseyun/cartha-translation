source:
  edition: WLC
  text: אַל תַּטִּ֖פוּ יַטִּיפ֑וּ/ן לֹֽא יַטִּ֣פוּ לָ/אֵ֔לֶּה לֹ֥א יִסַּ֖ג כְּלִמּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/006.yaml
  text: “Do not preach,” they preach. “One should not preach about these things; disgrace will not overtake us.”
translation:
  language: fr
  text: « Ne prêchez pas », prêchent-ils. « On ne devrait pas prêcher sur de telles choses[a] ; la honte ne nous atteindra pas. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ces gens » — le démonstratif hébreu peut désigner des choses ou des personnes.'
    reason: Le référent de לָאֵלֶּה est grammaticalement ambigu.
lexical_decisions:
- source_word: תַּטִּפוּ / יַטִּיפוּן / יַטִּיפוּ
  choice: « prêchez / prêchent / prêcher »
  rationale: Le verbe נטף signifie littéralement « faire couler goutte à goutte », puis, dans ce contexte prophétique, « prononcer un oracle, prophétiser, prêcher ». La répétition du même verbe est conservée afin de rendre l'ironie de la réplique.
- source_word: לָאֵלֶּה
  choice: « sur de telles choses »
  rationale: Le démonstratif peut désigner les annonces de jugement qui viennent d’être faites. Cette lecture s’accorde au contexte et reste naturelle en français ; l’autre référent possible, « ces gens », est signalé en note.
- source_word: לֹא יִסַּג כְּלִמּוֹת
  choice: « la honte ne nous atteindra pas »
  rationale: Cette formulation rend l’assurance présomptueuse des contradicteurs selon la lecture contextuelle la plus probable. Le singulier collectif « la honte » donne un français idiomatique pour le pluriel hébreu כְּלִמּוֹת, « hontes, humiliations ».
theological_decisions:
- issue: Identification des locuteurs et portée de leurs paroles
  choice: Présenter tout le verset comme les paroles de ceux qui veulent faire taire les prophètes
  alternative: Comprendre une partie du verset comme une réponse du prophète ou de Dieu
  rationale: La répétition ironique de נטף et la progression du discours favorisent une citation des contradicteurs, mais la ponctuation absente de l’hébreu ancien ne permet pas d’éliminer absolument d’autres répartitions des voix.
- issue: Assurance d’échapper au jugement
  choice: Conserver l’affirmation « la honte ne nous atteindra pas » sans la corriger ni l’expliquer dans le texte
  alternative: Reformuler explicitement comme une prétention fausse condamnée par Michée
  rationale: Le verset rapporte cette assurance dans toute sa tension ironique ; ajouter une évaluation théologique explicite dépasserait le texte.
translation_notes:
  register: Français international actuel, sobre et digne. « Prêcher » est retenu plutôt que « débiter des paroles » ou « prophétiser » afin de préserver en français la répétition mordante du verbe hébreu et de rester accessible. La ponctuation rend lisible le changement de niveau entre l’injonction citée et le commentaire « prêchent-ils ».
