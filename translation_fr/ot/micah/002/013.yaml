  naturalness: Le français est moderne, clair et d’un registre biblique accessible. « Faire une brèche » est un peu plus idiomatique que « ouvrir la brèche » tout en conservant l’image et la cohésion lexicale. « L’Éternel est à leur tête » est à la fois naturel et conforme à l’expression hébraïque.
  terminology: « Leur roi », « l’Éternel » et « à leur tête » sont appropriés. La désignation descriptive du participe ne tranche pas l’identité disputée de celui qui fait la brèche. La note conserve cette ambiguïté sans imposer d’interprétation confessionnelle.
