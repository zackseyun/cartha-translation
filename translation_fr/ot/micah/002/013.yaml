  text: עָלָ֤ה הַ/פֹּרֵץ֙ לִ/פְנֵי/הֶ֔ם פָּֽרְצוּ֙ וַֽ/יַּעֲבֹ֔רוּ שַׁ֖עַר וַ/יֵּ֣צְאוּ ב֑/וֹ וַ/יַּעֲבֹ֤ר מַלְכָּ/ם֙ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה בְּ/רֹאשָֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/013.yaml
  text: The one who breaks through has gone up before them[a]; they have broken through and passed through the gate, and gone out by it. Their king passes on before them[c][b], and Yahweh is at their head.
translation:
  language: fr
  text: Celui qui fait une brèche est monté devant eux[a]. Ils ont fait une brèche, ont franchi la porte et sont sortis par elle. Leur roi passe devant eux, et l’Éternel est à leur tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le briseur ». Le participe hébreu peut servir de désignation pour celui qui fait une brèche ou ouvre le passage. Son identité n’est pas précisée : il peut être compris comme un chef militaire, le roi ou l’Éternel lui-même.'
    reason: lexical_alternative
  - marker: b
    text: Hébreu YHWH, le nom personnel de Dieu, traditionnellement rendu ici par « l’Éternel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפֹּרֵץ
  choice: celui qui ouvre la brèche
  rationale: Le participe substantivé de פרץ désigne celui qui pratique une brèche ou ouvre un passage. Cette formulation naturelle conserve l’image et ne précise pas l’identité du personnage.
- source_word: עָלָה
  choice: est monté
  rationale: Le qal parfait décrit l’action comme accomplie; le passé composé convient au français moderne et peut conserver la vigueur de la vision prophétique.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: Cette expression spatiale rend directement l’idée d’une position en avant du groupe dans les deux occurrences.
- source_word: פָּרְצוּ
  choice: ils ont ouvert la brèche
  rationale: La reprise de «brèche» maintient le lien lexical avec הַפֹּרֵץ et représente l’action accomplie.
- source_word: וַיַּעֲבֹרוּ שַׁעַר
  choice: franchi la porte
  rationale: Dans ce contexte de déplacement à travers une ouverture, «franchir la porte» est idiomatique et précis.
- source_word: וַיֵּצְאוּ בוֹ
  choice: sont sortis par elle
  rationale: Le pronom renvoie à la porte; «par elle» reflète la préposition hébraïque sans ajouter d’interprétation.
- source_word: מַלְכָּם
  choice: leur roi
  rationale: Le terme מֶלֶךְ porte explicitement le sens royal, qu’il convient de conserver.
- source_word: וַיהוָה
  choice: l’Éternel
  rationale: Le tétragramme est rendu selon l’usage français biblique courant tout en le distinguant d’un simple titre seigneurial.
- source_word: בְּרֹאשָׁם
  choice: à leur tête
  rationale: La formulation conserve la métaphore spatiale hébraïque de la conduite du peuple.
theological_decisions:
- issue: Identité de הַפֹּרֵץ («celui qui ouvre la brèche»)
  choice: Désigner le personnage par son action sans l’identifier dans le texte principal.
  alternative: L’identifier au roi, à un chef militaire, au Messie ou à l’Éternel.
  rationale: L’hébreu ne précise pas explicitement le rapport entre celui qui ouvre la brèche, le roi et l’Éternel. La traduction préserve cette ambiguïté.
- issue: Rapport entre «leur roi» et «l’Éternel»
  choice: Conserver les deux désignations distinctes.
  alternative: Les traiter comme deux appellations explicites d’un même personnage.
  rationale: Le texte coordonne les deux expressions sans déclarer leur identité; les fusionner résoudrait une tension que l’hébreu laisse ouverte.
- issue: Temps de la séquence prophétique
  choice: 'Employer des formes passées cohérentes: «est monté», «ont ouvert», «est passé», «était».'
  alternative: Passer au présent de narration ou au futur prophétique.
  rationale: Les formes hébraïques présentent vivement la scène comme accomplie. Le passé français respecte cette perspective sans convertir implicitement les actions en prédictions futures.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de «brèche» reproduit la cohésion du texte hébreu. Les temps du passé maintiennent la présentation prophétique d’actions vues comme accomplies; les figures du conducteur, du roi et de l’Éternel ne sont pas artificiellement confondues.
