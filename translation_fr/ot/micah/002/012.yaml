source:
  edition: WLC
  text: אָסֹ֨ף אֶאֱסֹ֜ף יַעֲקֹ֣ב כֻּלָּ֗/ךְ קַבֵּ֤ץ אֲקַבֵּץ֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל יַ֥חַד אֲשִׂימֶ֖/נּוּ כְּ/צֹ֣אן בָּצְרָ֑ה כְּ/עֵ֨דֶר֙ בְּ/ת֣וֹךְ הַ/דָּֽבְר֔/וֹ תְּהִימֶ֖נָה מֵ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/012.yaml
  text: I will surely gather all of you[a], Jacob; I will surely collect the remnant of Israel. Together I will set them like the sheep of Bozrah, like a flock in the midst of its pasture[c][b]; they will be noisy with men.
translation:
  language: fr
  text: Oui, je te rassemblerai tout entier, Jacob ; je réunirai assurément le reste d’Israël. Je les placerai ensemble, comme les moutons de Bosra[a], comme un troupeau au milieu de son pâturage[b] ; ils feront grand bruit à cause de la multitude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des moutons dans un enclos ». L’hébreu est traditionnellement compris comme le nom de lieu « Bosra », mais certains y voient un terme apparenté au mot désignant un enclos à moutons.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au milieu de son enclos ». Le mot hébreu rare peut désigner ici un pâturage ou un parc à troupeaux.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils feront grand bruit à cause des êtres humains ». L’expression hébraïque est difficile ; elle peut évoquer le tumulte produit par une foule nombreuse.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֶאֱסֹף
  choice: Oui, je rassemblerai
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Oui » rend cette insistance avec naturel en français.
- source_word: יַעֲקֹב כֻּלָּךְ
  choice: je te rassemblerai tout entier, Jacob
  rationale: Le suffixe singulier présente Jacob comme une collectivité à laquelle Dieu s’adresse directement. Cette formulation conserve à la fois l’adresse collective et l’idée de totalité.
- source_word: קַבֵּץ אֲקַבֵּץ
  choice: je réunirai sans faute
  rationale: La seconde construction emphatique est maintenue, tandis que « réunir » varie naturellement le vocabulaire sans effacer le parallélisme.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: le reste d’Israël
  rationale: « Le reste » est une expression française claire qui désigne la partie survivante ou préservée du peuple et garde la portée prophétique du terme.
- source_word: יַחַד אֲשִׂימֶנּוּ
  choice: Je les placerai ensemble
  rationale: Le suffixe hébreu est morphologiquement singulier, mais son référent est le collectif formé par le reste d’Israël. Le pluriel français explicite ce référent sans changer le sens.
- source_word: כְּצֹאן בָּצְרָה
  choice: comme les moutons de Botsra
  rationale: La vocalisation massorétique favorise le nom de lieu Botsra. La possibilité d’un terme évoquant un enclos est conservée en note.
- source_word: כְּעֵדֶר בְּתוֹךְ הַדָּבְרוֹ
  choice: comme un troupeau au milieu de son pâturage
  rationale: Dans cette image pastorale, le nom rare désigne vraisemblablement un lieu de pacage. La traduction concurrente « enclos » est signalée en note.
- source_word: תְּהִימֶנָה מֵאָדָם
  choice: ils feront grand bruit à cause de la multitude
  rationale: Le verbe exprime un grondement ou un tumulte, et la préposition מִן introduit vraisemblablement sa cause. « La multitude » rend ici אָדָם comme un collectif humain tout en laissant la difficulté de l’expression visible dans la note.
theological_decisions:
- issue: Promesse de restauration adressée à Jacob et à Israël
  choice: Le verset est traduit comme une promesse divine de rassemblement concernant Jacob et le reste d’Israël.
  alternative: Comprendre d’emblée cette promesse comme une restauration uniquement spirituelle ou exclusivement eschatologique.
  rationale: Le texte hébreu nomme directement Jacob et Israël et emploie l’image prophétique du reste rassemblé. La traduction maintient cette référence sans lui imposer un système théologique ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et les deux formes d’insistance de l’hébreu sont conservés sans lourdeur excessive. Le nom propre « Botsra » demeure dans le texte principal, tandis que les ambiguïtés pastorales et la difficulté de la dernière proposition sont exposées en notes.
