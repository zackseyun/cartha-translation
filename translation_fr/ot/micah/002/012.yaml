    rationale: « Bosra » est la graphie française biblique courante de בָּצְרָה; elle facilite l’identification du lieu sans affecter l’ambiguïté textuelle signalée en note.
  - severity: low
    issue: Note c au singulier « l’être humain »
    rationale: אָדָם a ici une valeur collective. « les êtres humains » rend mieux le sens possible tout en conservant la difficulté de la construction avec מִן.
