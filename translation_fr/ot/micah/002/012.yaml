  naturalness: « Je réunirai sans faute » est peu idiomatique dans un français biblique moderne; « je réunirai assurément » rend naturellement l’insistance. Le reste de la formulation est clair, digne et accessible.
  terminology: « Le reste d’Israël », « troupeau » et « pâturage » conviennent. « Bosra » suit l’usage français établi pour le toponyme, tout en maintenant en note l’alternative lexicale « enclos ».
