revisions:
- from: 'C’est pourquoi, voici ce que dit Yahweh : « Me voici : je prépare un malheur contre ce clan[a]. Vous ne pourrez en dégager votre cou[b], et vous ne marcherez pas avec hauteur[c], car ce sera un temps de malheur[d]. »'
  to: 'C’est pourquoi, voici ce que dit Yahweh : « Voici, je prépare un malheur contre ce clan[a]. Vous ne pourrez pas en retirer vos cous[b], et vous ne marcherez pas la tête haute[c], car c’est un temps de malheur[d]. »'
  rationale: La révision améliore l’idiomaticité française et resserre l’alignement sur l’hébreu, notamment par le présent final et le pluriel « vos cous ». Elle conserve les choix lexicaux défendables du projet, la répétition de « malheur », l’ambiguïté de מִשְׁפָּחָה en note et les ancres de notes correspondantes.
