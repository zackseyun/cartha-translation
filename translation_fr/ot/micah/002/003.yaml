  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י חֹשֵׁ֛ב עַל הַ/מִּשְׁפָּחָ֥ה הַ/זֹּ֖את רָעָ֑ה אֲ֠שֶׁר לֹֽא תָמִ֨ישׁוּ מִ/שָּׁ֜ם צַוְּארֹֽתֵי/כֶ֗ם וְ/לֹ֤א תֵֽלְכוּ֙ רוֹמָ֔ה כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/003.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am planning disaster against this family, from which you will not remove your necks, and you will not walk haughtily[d][c][b], for it is an evil time.'
translation:
  language: fr
  text: 'C’est pourquoi, voici ce que dit Yahweh : « Voici, je prépare un malheur contre ce clan[a]. Vous ne pourrez pas en retirer vos cous[b], et vous ne marcherez pas la tête haute[c], car c’est un temps de malheur[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner une famille, une lignée ou un clan plus large.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vous n’en retirerez pas vos cous ». L’image évoque l’impossibilité d’échapper à un joug ou à un fardeau imposé.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « vous ne marcherez pas fièrement » ou « avec hauteur ».'
    reason: lexical_alternative
  - marker: d
    text: Le même mot hébreu est traduit par « malheur » plus tôt dans le verset ; cette répétition relie le jugement annoncé au temps de détresse qui vient.
    reason: literary_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement la conséquence des injustices dénoncées dans le contexte précédent.
- source_word: כֹּה אָמַר יְהוָה
  choice: voici ce que dit Yahweh
  rationale: Formulation prophétique claire et actuelle, tout en conservant le nom divin.
- source_word: הִנְנִי
  choice: Me voici
  rationale: Conserve la force emphatique et présentative de l’annonce divine.
- source_word: חֹשֵׁב
  choice: je prépare
  rationale: Exprime un dessein délibéré et fait écho au projet coupable des oppresseurs au verset précédent, sans suggérer une simple pensée passagère.
- source_word: עַל הַמִּשְׁפָּחָה הַזֹּאת
  choice: contre ce clan
  rationale: Dans ce contexte collectif, מִשְׁפָּחָה semble viser un groupe de parenté plus vaste qu’un seul foyer; une note conserve les autres possibilités.
- source_word: רָעָה
  choice: malheur
  rationale: « Malheur » désigne ici une calamité ou un jugement, sans attribuer un mal moral à Dieu, et permet de reproduire le même terme aux deux occurrences.
- source_word: אֲשֶׁר לֹא תָמִישׁוּ מִשָּׁם צַוְּארֹתֵיכֶם
  choice: Vous ne pourrez en dégager votre cou
  rationale: Préserve l’image concrète du cou qu’on ne peut retirer d’un joug ou d’un fardeau imposé.
- source_word: וְלֹא תֵלְכוּ רוֹמָה
  choice: vous ne marcherez pas avec hauteur
  rationale: Rend la démarche élevée ou orgueilleuse évoquée par רוֹמָה, dans un français où « avec hauteur » signale clairement l’arrogance.
- source_word: כִּי עֵת רָעָה הִיא
  choice: car ce sera un temps de malheur
  rationale: Rend la période de jugement à venir et reprend « malheur » afin de conserver la répétition rhétorique hébraïque.
theological_decisions:
- issue: Sens de רָעָה appliqué à l’action divine
  choice: « malheur » aux deux occurrences
  alternative: « mal » aux deux occurrences, ou « désastre » puis « temps mauvais »
  rationale: Le contexte parle d’une calamité judiciaire préparée par Dieu, non d’un mal moral commis par lui. « Malheur » maintient la répétition du texte hébreu sans lever la tension du jugement divin.
- issue: Portée de מִשְׁפָּחָה
  choice: « clan » dans le texte, avec les autres sens en note
  alternative: « famille » ou « maison »
  rationale: Le contexte paraît viser collectivement le groupe social coupable. La note évite néanmoins de présenter cette délimitation comme certaine.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images du cou et de la marche ainsi que la répétition de רָעָה, tout en explicitant les principales ambiguïtés lexicales dans les notes.
