  text: ק֣וּמוּ וּ/לְכ֔וּ כִּ֥י לֹא זֹ֖את הַ/מְּנוּחָ֑ה בַּ/עֲב֥וּר טָמְאָ֛ה תְּחַבֵּ֖ל וְ/חֶ֥בֶל נִמְרָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/010.yaml
  text: Rise and go[a], for this is not the resting place; because of uncleanness it brings destruction[b], even grievous destruction.
translation:
  language: fr
  text: Levez-vous et partez[a], car ce n’est pas ici le lieu de repos ; à cause de la souillure, il causera votre ruine[b], une ruine terrible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Allez-vous-en ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie un verbe et un nom de même racine afin d’accentuer l’annonce de ruine. Le féminin peut renvoyer au lieu de repos, compris dans le contexte comme le pays, ou être compris plus abstraitement : « à cause de la souillure ». Autre traduction possible : « parce qu’il est souillé, il détruira — une destruction terrible ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ וּלְכ֔וּ
  choice: Levez-vous et partez
  rationale: Les deux impératifs pluriels expriment un ordre de se mettre en mouvement et de quitter les lieux. « Partez » rend naturellement le sens contextuel de הלך sans ajouter explicitement l’idée d’expulsion.
- source_word: כִּ֥י לֹא זֹ֖את הַמְּנוּחָ֑ה
  choice: car ce lieu n’est pas un lieu de repos
  rationale: מְנוּחָה peut désigner le repos ou un lieu où l’on demeure en repos. La formulation française concrétise le démonstratif זֹאת tout en conservant cette nuance spatiale.
- source_word: בַּעֲב֥וּר טָמְאָ֛ה
  choice: Parce qu’il est souillé
  rationale: טָמְאָה est une forme féminine qui s’accorde vraisemblablement avec מְנוּחָה et, par extension, avec le pays ou le lieu évoqué. « Souillé » conserve la portée morale et cultuelle du terme.
- source_word: תְּחַבֵּ֖ל וְחֶ֥בֶל נִמְרָֽץ
  choice: il vous mènera à la ruine, à une ruine terrible
  rationale: Le verbe חבל suivi du nom apparenté חֶבֶל produit une répétition emphatique. « Mènera à la ruine » garde le lieu souillé comme sujet sans rendre le français artificiel, tandis que la reprise de « ruine » restitue l’insistance hébraïque. נִמְרָץ indique ici une forte intensité.
theological_decisions:
- issue: Référent de la forme féminine טָמְאָה et sujet de תְּחַבֵּל
  choice: Le lieu de repos, compris contextuellement comme le pays, est souillé et devient cause de ruine pour ses habitants.
  alternative: La souillure elle-même cause la destruction, sans sujet spatial explicite.
  rationale: L’accord féminin renvoie naturellement à מְנוּחָה, nom féminin, et le contexte concerne le pays qui ne sera plus un lieu de repos. La traduction n’ajoute cependant pas le mot « pays » dans le corps du verset.
- issue: Valeur de וְחֶבֶל נִמְרָץ
  choice: 'Une intensification par répétition : « à la ruine, à une ruine terrible ».'
  alternative: « et une destruction violente » ou « oui, une destruction complète ».
  rationale: Le verbe et le nom sont de même racine; leur reprise doit rester perceptible. « Terrible » exprime l’intensité de נִמְרָץ sans préciser indûment si elle est violente, douloureuse ou totale.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme injonctif et l’intensification prophétique sont conservés sans archaïsme. Les pronoms pluriels sont explicités seulement là où le français l’exige pour rendre naturellement la conséquence subie par les destinataires.
