revisions:
- from: Levez-vous et partez[a], car ce lieu n’est pas un lieu de repos. Parce qu’il est souillé, il vous mènera à la ruine[b], à une ruine terrible.
  to: Levez-vous et partez[a], car ce n’est pas ici le lieu de repos ; à cause de la souillure, il causera votre ruine[b], une ruine terrible.
  rationale: La révision suit plus étroitement la syntaxe causale hébraïque, restitue la force destructive du verbe et conserve l’intensification par répétition. Elle améliore aussi la fluidité du français et signale en note, sans la trancher dans le texte, l’ambiguïté du référent féminin.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:53:14Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement les impératifs pluriels et le thème du lieu de repos perdu. Toutefois, « Parce qu’il est souillé » ne reflète pas au plus près בַּעֲבוּר טָמְאָה (« à cause de la souillure / parce qu’elle est souillée »), et « mènera à la ruine » atténue le verbe תְּחַבֵּל, qui exprime la destruction. L’objet de ce verbe n’est pas formulé en hébreu mais vise naturellement les destinataires ; le français peut l’expliciter pour éviter une construction intransitive imprécise.
  naturalness: Le français du projet est globalement naturel, mais la répétition « ce lieu n’est pas un lieu » est lourde. « Ce n’est pas ici le lieu de repos » est plus fluide et conserve la valeur déictique de זֹאת. « Il causera votre ruine » est idiomatique, ferme et permet de conserver l’intensification finale.
  terminology: « Souillure » maintient la portée morale et cultuelle de טָמְאָה sans imposer une interprétation confessionnelle. « Lieu de repos » convient à מְנוּחָה dans ce contexte. La reprise « ruine, une ruine terrible » rend l’effet du verbe suivi de son nom apparenté, sans prétendre préciser davantage la nuance de נִמְרָץ.
  issues:
  - severity: medium
    issue: La causalité est formulée comme une proposition explicite (« Parce qu’il est souillé ») plutôt que comme « à cause de la souillure ».
    rationale: בַּעֲבוּר introduit directement le motif, suivi de la forme féminine טָמְאָה. Une formulation nominale française reflète mieux la construction tout en laissant ouverte la question du référent féminin.
  - severity: medium
    issue: « Il vous mènera à la ruine » affaiblit le sens destructeur de תְּחַבֵּל.
    rationale: Le verbe désigne le fait de ruiner ou détruire. « Causera votre ruine » est naturel en français et conserve une conséquence destructrice plus directe.
  - severity: low
    issue: La note b propose « il détruira » mais le texte principal emploie une formulation plus faible et ne signale pas l’ambiguïté du référent féminin.
    rationale: La note révisée doit à la fois expliquer l’insistance cognate et indiquer sobrement que le féminin peut renvoyer au lieu de repos, compris comme le pays, ou être compris plus abstraitement.
  revised_text: Levez-vous et partez[a], car ce n’est pas ici le lieu de repos ; à cause de la souillure, il causera votre ruine[b], une ruine terrible.
