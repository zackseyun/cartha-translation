source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִשָּׂ֧א עֲלֵי/כֶ֣ם מָשָׁ֗ל וְ/נָהָ֨ה נְהִ֤י נִֽהְיָה֙ אָמַר֙ שָׁד֣וֹד נְשַׁדֻּ֔נוּ חֵ֥לֶק עַמִּ֖/י יָמִ֑יר אֵ֚יךְ יָמִ֣ישׁ לִ֔/י לְ/שׁוֹבֵ֥ב שָׂדֵ֖י/נוּ יְחַלֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/004.yaml
  text: On that day one will take up a taunt against you and lament a lament[a], saying, “We are utterly ruined! He changes the portion of my people[b]. How he removes it from me! To the one who turns away he divides our fields.”
translation:
  language: fr
  text: 'Ce jour-là, on prononcera contre vous une raillerie et l’on entonnera une complainte[a], en disant :


    « Nous sommes complètement dévastés !


    Il change la part de mon peuple.


    Comme il me l’enlève !


    À celui qui se détourne[b], il répartit nos champs. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète des termes apparentés de lamentation pour produire un effet d’insistance. On pourrait aussi traduire : « et l’on se lamentera d’une lamentation » ou « et l’on poussera une lamentation ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’infidèle » ou « au rebelle ». L’hébreu est difficile et peut aussi être compris, de manière moins probable, comme désignant le ravisseur ou celui qui ramène.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשָּׂא ... מָשָׁל
  choice: on lancera ... un chant satirique
  rationale: L’expression signifie littéralement « élever/prononcer un mashal ». Dans ce contexte public de jugement et de défaite, מָשָׁל désigne vraisemblablement une parole formulée à valeur de satire ou de raillerie. « Chant satirique » convient aussi à la lamentation qui suit, sans réduire le terme à une simple maxime.
- source_word: וְנָהָה נְהִי נִהְיָה
  choice: et on entonnera une lamentation
  rationale: Cette accumulation de termes apparentés relève du langage du deuil et intensifie la plainte. Le français naturel ne permet pas de reproduire exactement toutes les répétitions sans lourdeur ; « entonner une lamentation » conserve le caractère solennel et formulé du cri, tandis que la note signale l’insistance de l’hébreu.
- source_word: שָׁדוֹד נְשַׁדֻּנוּ
  choice: Nous sommes complètement dévastés
  rationale: L’infinitif absolu associé à la forme verbale passive renforce fortement l’idée de dévastation. « Complètement » rend cette insistance, et « dévastés » convient à la fois à la ruine du peuple et à la perte de ses terres.
- source_word: חֵלֶק עַמִּי
  choice: la part de mon peuple
  rationale: חֵלֶק désigne une part ou un lot, ici dans le contexte des terres attribuées au peuple. « Part » reste plus proche du terme hébreu qu’« héritage », qui expliciterait davantage l’arrière-plan foncier.
- source_word: יָמִיר
  choice: Il transfère
  rationale: Le hiphil de מוּר exprime ici le changement ou l’échange de la part du peuple. « Transfère » fait clairement entendre le changement de détenteur dans ce contexte de dépossession, sans préciser indûment son mécanisme.
- source_word: אֵיךְ יָמִישׁ לִי
  choice: Comme il me l’enlève !
  rationale: אֵיךְ introduit une exclamation de stupeur ou de détresse. Le hiphil de מוּשׁ indique qu’on fait disparaître ou qu’on retire quelque chose ; le pronom « l’ » reprend naturellement la part mentionnée juste avant.
- source_word: לְשׁוֹבֵב
  choice: À celui qui se détourne
  rationale: Le mot difficile peut désigner quelqu’un qui se détourne ou se montre rebelle. Cette formulation transparente conserve l’image verbale et évite le terme plus chargé « apostat » ; les principales autres compréhensions sont données en note.
- source_word: שָׂדֵינוּ יְחַלֵּק
  choice: il répartit nos champs
  rationale: חלק signifie diviser ou attribuer en parts. « Répartit » exprime ici que les champs confisqués sont distribués à un autre.
theological_decisions:
- issue: Sens de לְשׁוֹבֵב
  choice: À celui qui se détourne
  alternative: À l’infidèle / au rebelle ; éventuellement au ravisseur ou à celui qui ramène
  rationale: La forme hébraïque et son rôle syntaxique sont discutés. Le texte principal retient le sens substantivé probablement lié à l’idée de se détourner, mais emploie une expression descriptive plutôt qu’un terme théologiquement plus déterminé. La note maintient l’ambiguïté réelle.
- issue: Identité de celui qui transfère et répartit les terres
  choice: Conserver le sujet implicite « il » sans l’identifier
  alternative: Identifier explicitement Dieu ou le conquérant comme sujet
  rationale: Les verbes hébreux ont un sujet masculin singulier non exprimé. Le contexte peut orienter l’interprétation, mais le verset ne nomme pas ce sujet ; la traduction préserve donc cette indétermination.
translation_notes:
  register: Français international actuel, digne et oralement fluide. La disposition en vers met en relief le passage au chant de lamentation. Les changements de « mon peuple », « me » et « nos champs » sont conservés tels qu’ils apparaissent dans l’hébreu, sans harmonisation. Les deux notes sont signalées dans le texte principal.
