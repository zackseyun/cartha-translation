review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la structure de plainte, l’intensif « complètement », les changements de personne (« mon peuple », « me », « nos champs ») et laisse le sujet masculin singulier non identifié. Toutefois, « chant satirique » ajoute l’idée que le מָשָׁל est chanté, ce que le terme n’exprime pas nécessairement. « Transfère » explicite davantage un changement de détenteur que ne le fait le verbe hébreu, qui signifie d’abord « changer/échanger ».
  naturalness: Le français est clair et digne. « On lancera ... un chant satirique » est cependant moins naturel et sémantiquement trop précis ; « prononcera ... une raillerie » rend mieux une parole de dérision publique. « Entonner une complainte » est idiomatique et conserve le caractère formulé de la lamentation.
  terminology: « Raillerie » rend ici le caractère de taunt de מָשָׁל sans imposer un genre musical. « Complainte » convient au registre de deuil. « Celui qui se détourne » conserve prudemment l’ambiguïté de לְשׁוֹבֵב ; la note doit présenter les autres possibilités sans donner à entendre que l’expression hébraïque elle-même serait formellement indéchiffrable.
  issues:
