    issue: « chant satirique » pour מָשָׁל
    rationale: Le מָשָׁל est une parole stylisée, ici une raillerie/taunt, mais le mot ne requiert pas qu’elle soit chantée. L’idée musicale appartient plus naturellement à la lamentation qui suit.
  - severity: low
    issue: « Il transfère » pour יָמִיר
    rationale: « Transfère » peut être défendable contextuellement, mais il précise un transfert de possession. « Il change » préserve le sens plus large de « changer/échanger » et l’ambiguïté du mécanisme.
  - severity: low
    issue: 'Note a : « la forme exacte de l’expression est difficile »'
    rationale: La répétition de termes apparentés est claire ; ce qui peut varier est sa restitution idiomatique en français. La note devrait le dire plus exactement.
