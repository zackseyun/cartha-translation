reference: Micah 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵן֙ לֹֽא יִֽהְיֶ֣ה לְ/ךָ֔ מַשְׁלִ֥יךְ חֶ֖בֶל בְּ/גוֹרָ֑ל בִּ/קְהַ֖ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/005.yaml
  text: Therefore you will have no one to cast the measuring line by lot in the assembly of Yahweh[a][b].
translation:
  language: fr
  text: C’est pourquoi tu n’auras personne pour jeter le cordeau au sort[a] dans l’assemblée de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la corde », « la ligne » ou « le cordeau de partage ». Le terme hébreu désigne ici la corde utilisée pour mesurer et répartir les terres reçues en héritage; l’expression évoque leur attribution par le sort.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la communauté de l’alliance réunie, notamment dans le cadre de la répartition des terres.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence judiciaire découlant des accusations précédentes.
- source_word: לֹא יִהְיֶה לְךָ
  choice: tu n’auras personne
  rationale: Rend idiomatiquement la tournure existentielle hébraïque tout en conservant l’adresse directe au masculin singulier.
- source_word: מַשְׁלִיךְ
  choice: pour jeter
  rationale: Le participe désigne ici celui qui accomplit l’action; cette formulation française s’accorde naturellement avec « personne ».
- source_word: חֶבֶל
  choice: le cordeau
  rationale: Dans ce contexte foncier, le terme désigne la corde servant à mesurer et à délimiter les parts de terre.
- source_word: בְּגוֹרָל
  choice: lors du partage par tirage au sort
  rationale: Explicite avec mesure l’emploi du sort pour attribuer les terres, sans réduire חֶבֶל à la seule notion abstraite de lot.
- source_word: בִּקְהַל יְהוָה
  choice: dans l’assemblée de Yahweh
  rationale: « Assemblée » désigne de façon actuelle et digne la communauté réunie; le nom divin est translittéré.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Préserve le nom personnel divin exprimé par le tétragramme plutôt que de lui substituer un titre.
theological_decisions:
- issue: Référent du jugement à la deuxième personne du singulier
  choice: Maintien de « tu », sans préciser davantage le destinataire
  alternative: Employer un pluriel collectif ou identifier explicitement les accapareurs de terres, les chefs ou les faux prophètes
  rationale: L’hébreu emploie un singulier direct, tandis que le contexte permet un destinataire collectif représenté au singulier. La traduction conserve cette tension sans imposer une identification plus étroite.
- issue: Portée de l’expression « dans l’assemblée de Yahweh »
  choice: La rattacher à la scène future de répartition des terres
  alternative: La comprendre plus généralement comme une exclusion de la communauté cultuelle
  rationale: Le cordeau et le tirage au sort évoquent fortement l’attribution foncière, mais le texte conserve aussi une dimension communautaire; la formulation n’exclut pas cette portée plus large.
translation_notes:
  register: Français international moderne, naturel et digne. « Cordeau » conserve l’image concrète de la mesure foncière; la brève explicitation « lors du partage par tirage au sort » rend la scène compréhensible sans supprimer l’ambiguïté du texte.
