revisions:
- from: Malheur à ceux qui trament le mal et préparent des actes mauvais sur leur lit ! Dès les premières lueurs du matin, ils les exécutent[a], parce qu’ils en ont le pouvoir.
  to: Malheur à ceux qui trament l’injustice et font le mal sur leurs lits ! Dès les premières lueurs du matin, ils le mettent à exécution[a], car ils en ont le pouvoir.
  rationale: La révision rend le second participe comme une pratique effective du mal plutôt que comme une simple préparation. Elle emploie un pronom singulier et l’expression idiomatique « mettre à exécution » pour représenter la réalisation matinale du mal ou du dessein conçu, sans prétendre fixer plus précisément l’antécédent du suffixe. La note conserve sobrement l’interprétation alternative de la dernière proposition.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:53:05Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation « préparent des actes mauvais » affaiblit et réinterprète פֹעֲלֵי רָע (« font/pratiquent le mal ») comme une simple préparation. De plus, le pluriel « les exécutent » ne correspond pas bien au suffixe féminin singulier de יַעֲשׂוּהָ, qui renvoie vraisemblablement au mal ou au dessein conçu. La proposition finale est correctement comprise comme un idiome de pouvoir/capacité.
  naturalness: La version proposée est globalement fluide, mais « ils les exécutent » a un antécédent pluriel créé par la traduction et rend la progression de l’hébreu moins nette. La révision conserve un français moderne et la tension entre la machination nocturne et sa réalisation au matin.
  terminology: « Malheur à » est approprié pour הוֹי. « Trament l’injustice » rend bien la préméditation de חֹשְׁבֵי אָוֶן; « font le mal » restitue sans l’atténuer le participe פֹעֲלֵי רָע. La note doit préserver l’alternative concernant אֵל sans ajouter l’idée interprétative de confiance, absente du verset.
  issues:
  - severity: medium
    issue: « préparent des actes mauvais » ne rend pas directement פֹעֲלֵי רָע.
    rationale: Le terme décrit des gens qui font ou pratiquent le mal; « préparent » réduit l’expression à une intention préalable et crée une opposition temporelle qui n’est pas explicitement portée par ce participe.
  - severity: medium
    issue: « ils les exécutent » crée un objet pluriel.
    rationale: יַעֲשׂוּהָ porte un suffixe objet féminin singulier. Même si son antécédent exact reste discuté, un singulier français évite de modifier ce trait.
  - severity: low
    issue: La note explicative ajoute « ce en quoi ils mettent leur confiance ».
    rationale: Cette explicitation théologique va au-delà de l’alternative de lecture. Une note brève préserve l’ambiguïté sans imposer une interprétation.
  revised_text: Malheur à ceux qui trament l’injustice et font le mal sur leurs lits ! Dès les premières lueurs du matin, ils le mettent à exécution[a], car ils en ont le pouvoir.
  revised_footnotes:
  - marker: a
    text: 'Autre traduction possible : « car leur main est leur dieu ».'
    reason: alternative_reading
  revision_rationale: La révision rend le second participe comme une pratique effective du mal plutôt que comme une simple préparation. Elle emploie un pronom singulier et l’expression idiomatique « mettre à exécution » pour représenter la réalisation matinale du mal ou du dessein conçu, sans prétendre fixer plus précisément l’antécédent du suffixe. La note conserve sobrement l’interprétation alternative de la dernière proposition.
