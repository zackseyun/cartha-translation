source:
  edition: WLC
  text: ה֧וֹי חֹֽשְׁבֵי אָ֛וֶן וּ/פֹ֥עֲלֵי רָ֖ע עַל מִשְׁכְּבוֹתָ֑/ם בְּ/א֤וֹר הַ/בֹּ֨קֶר֙ יַעֲשׂ֔וּ/הָ כִּ֥י יֶשׁ לְ/אֵ֖ל יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/001.yaml
  text: Woe to those who devise wickedness and work out evil on their beds! At the light of morning they do it[a], because it is in the power of their hand.
translation:
  language: fr
  text: Malheur à ceux qui trament l’injustice et font le mal sur leurs lits ! Dès les premières lueurs du matin, ils le mettent à exécution[a], car ils en ont le pouvoir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « car leur main est leur dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule conserve la force de dénonciation de l’interjection prophétique tout en étant naturelle dans un registre biblique français actuel.
- source_word: חֹשְׁבֵי אָוֶן
  choice: ceux qui trament le mal
  rationale: Le participe exprime une conception délibérée et malveillante. « Tramer » évoque clairement un complot préparé en secret, tandis que « le mal » rend ici la portée morale de אָוֶן.
- source_word: וּפֹעֲלֵי רָע
  choice: et préparent des actes mauvais
  rationale: Le second participe est compris comme une activité menée sur le lit, en parallèle avec la conception du mal, avant son exécution au matin. Cette formulation évite de suggérer qu’ils commettent déjà ces actes pendant la nuit.
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: sur leur lit
  rationale: Rend directement l’image spatiale hébraïque et reste idiomatique en français.
- source_word: בְּאוֹר הַבֹּקֶר
  choice: Dès les premières lueurs du matin
  rationale: Préserve l’image de la lumière matinale et exprime naturellement l’empressement à passer à l’acte.
- source_word: יַעֲשׂוּהָ
  choice: ils les exécutent
  rationale: Le suffixe féminin singulier renvoie globalement au mal projeté; le pluriel français reprend naturellement « des actes mauvais ». « Exécutent » marque le passage du projet à sa réalisation.
- source_word: כִּי יֶשׁ לְאֵל יָדָם
  choice: parce qu’ils en ont le pouvoir
  rationale: 'Rend le sens idiomatique le plus probable : leur capacité leur permet de réaliser leurs desseins. La formulation française est claire, sans reproduire artificiellement l’image de la main.'
theological_decisions:
- issue: Sens de לְאֵל dans la proposition finale
  choice: une désignation idiomatique du pouvoir ou de la capacité
  alternative: « parce que leur main est leur dieu »
  rationale: 'Dans le contexte, la proposition explique pourquoi les malfaiteurs passent immédiatement à l’acte : ils disposent du pouvoir nécessaire. La lecture figurée faisant de leur main leur dieu demeure possible et est conservée en note, sans être imposée dans le texte principal.'
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme oppose la préparation nocturne à l’exécution dès le matin. La note maintient l’ambiguïté réelle de la dernière proposition.
