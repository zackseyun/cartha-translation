  text: הֶ/אָמ֣וּר בֵּֽית יַעֲקֹ֗ב הֲ/קָצַר֙ ר֣וּחַ יְהוָ֔ה אִם אֵ֖לֶּה מַעֲלָלָ֑י/ו הֲ/ל֤וֹא דְבָרַ֨/י יֵיטִ֔יבוּ עִ֖ם הַ/יָּשָׁ֥ר הוֹלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/007.yaml
  text: Should it be said[a], O house of Jacob, “Is the Spirit of Yahweh impatient? Are these his deeds?” Do not my words do good to the one who walks uprightly?
translation:
  language: fr
  text: 'Peut-on dire, maison de Jacob : « Yahvé est-il à bout de patience[a] ? Sont-ce là ses actes ? » Mes paroles ne font-elles pas du bien à celui qui marche avec droiture ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « L’esprit de Yahvé est-il court ? » Le mot hébreu peut aussi désigner le « souffle »; l’expression évoque ici une patience limitée ou épuisée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָמ֣וּר
  choice: Est-ce bien ce qu’on dit
  rationale: Le participe passif interrogatif introduit une parole rapportée. Cette tournure française conserve la question rhétorique et reste naturelle.
- source_word: בֵּית יַעֲקֹב
  choice: maison de Jacob
  rationale: L’expression désigne collectivement le peuple issu de Jacob et fonctionne ici comme une interpellation directe.
- source_word: הֲקָצַר֙ ר֣וּחַ יְהוָ֔ה
  choice: Yahvé est-il à bout de patience
  rationale: Littéralement, l’hébreu demande si le « souffle/esprit » de Yahvé est devenu court. Dans cet idiome, la brièveté du souffle évoque surtout l’impatience ou une patience épuisée. La note conserve l’image et l’ambiguïté lexicales.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle « Yahvé » rend le nom divin distinctement plutôt que de le remplacer par un titre.
- source_word: אִם אֵ֖לֶּה מַעֲלָלָ֑יו
  choice: Sont-ce là ses actes ?
  rationale: מַעֲלָלִים désigne des actes ou des agissements. La formulation concise conserve la question rhétorique et son parallélisme.
- source_word: הֲל֤וֹא דְבָרַ֨י יֵיטִ֔יבוּ
  choice: Mes paroles ne font-elles pas du bien
  rationale: הֲלוֹא introduit une question qui attend une réponse affirmative, tandis que le hiphil de יטב exprime ici l’action de faire du bien ou d’être bénéfique.
- source_word: עִ֖ם הַיָּשָׁ֥ר הוֹלֵֽךְ
  choice: à celui qui marche avec droiture
  rationale: La traduction garde l’image biblique de la marche comme manière habituelle de vivre et rend הַיָּשָׁר par une conduite droite.
theological_decisions:
- issue: Faut-il comprendre רוּחַ יְהוָה comme l’Esprit de Yahvé ou comme sa patience/disposition ?
  choice: Yahvé est-il à bout de patience
  alternative: L’Esprit de Yahvé est-il limité ? / Le souffle de Yahvé est-il court ?
  rationale: L’association de קצר et רוח forme un idiome lié à l’impatience ou à l’épuisement de la patience. La traduction principale communique ce sens sans décider que le texte parle nécessairement de l’Esprit comme personne distincte; la note signale toutefois la formulation littérale et l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques et l’image de la « marche » ont été conservées; l’idiome hébreu obscur relatif au souffle/esprit est explicité dans une note plutôt que résolu sans indication.
