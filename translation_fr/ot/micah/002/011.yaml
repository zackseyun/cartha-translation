revisions:
- from: 'Si un homme qui court après le vent et le mensonge venait mentir ainsi : « Je te prêcherai le vin et les boissons enivrantes », ce serait bien le prédicateur de ce peuple[a] !'
  to: 'Si un homme marchait dans le vent et le mensonge, et mentait en disant : « Je te prêcherai au sujet du vin et des boissons alcoolisées », il serait le prédicateur de ce peuple.'
  rationale: La révision retire les ajouts interprétatifs ou emphatiques non nécessaires, rend explicitement le vin et les boissons alcoolisées comme le sujet du discours, et maintient le parallélisme ironique entre « prêcher » et « prédicateur ». La note est conservée avec une formulation plus prudente sur l'image lexicale.
  reviewer_model: gpt-5.6-terra
