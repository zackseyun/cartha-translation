source:
  edition: WLC
  text: לוּ אִ֞ישׁ הֹלֵ֥ךְ ר֨וּחַ֙ וָ/שֶׁ֣קֶר כִּזֵּ֔ב אַטִּ֣ף לְ/ךָ֔ לַ/יַּ֖יִן וְ/לַ/שֵּׁכָ֑ר וְ/הָיָ֥ה מַטִּ֖יף הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/011.yaml
  text: If a man should go about with wind and falsehood[a], lying, ‘I will preach to you of wine and strong drink,’ he would be the preacher of this people.
translation:
  language: fr
  text: 'Si un homme marchait dans le vent et le mensonge, et mentait en disant : « Je te prêcherai au sujet du vin et des boissons alcoolisées », il serait le prédicateur de ce peuple.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ
  choice: Si… venait
  rationale: Introduit une situation hypothétique. La tournure française au conditionnel rend naturellement cette hypothèse satirique sans lui ajouter une nuance de souhait.
- source_word: אִישׁ
  choice: un homme
  rationale: Conserve le singulier masculin du texte hébreu et la figure concrète du faux orateur.
- source_word: הֹלֵךְ רוּחַ וָשֶׁקֶר
  choice: qui court après le vent et le mensonge
  rationale: Rend l’idée d’une conduite orientée vers ce qui est inconsistant et faux, tout en maintenant les images du vent et du mensonge.
- source_word: כִּזֵּב
  choice: venait mentir ainsi
  rationale: Explicite l’acte mensonger qui introduit les paroles citées et donne une syntaxe française fluide.
- source_word: אַטִּף
  choice: Je te prêcherai
  rationale: Le verbe נטף peut désigner ici une proclamation de caractère prophétique. « Prêcher » reste accessible et laisse entendre l’ironie d’un message religieux complaisant.
- source_word: לַיַּיִן וְלַשֵּׁכָר
  choice: le vin et les boissons enivrantes
  rationale: « Boissons enivrantes » rend שֵׁכָר comme une catégorie de boissons fermentées ou alcoolisées, sans la limiter à un produit moderne précis.
- source_word: וְהָיָה מַטִּיף
  choice: ce serait bien le prédicateur
  rationale: La construction exprime le résultat ironique de l’hypothèse. « Prédicateur » maintient en français le lien avec « prêcher », tandis que « bien » souligne sans surcharger la pointe satirique.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Reproduit le collectif singulier et le ton de réprimande prophétique.
theological_decisions:
- issue: Valeur prophétique et ironique du verbe נטף
  choice: prêcher / prédicateur
  alternative: prophétiser / prophète ; faire ruisseler des paroles
  rationale: Le contexte dénonce le porte-parole mensonger qu’un peuple rebelle accueillerait volontiers. La traduction principale privilégie une proclamation religieuse intelligible sans attribuer automatiquement une véritable autorité prophétique à cet homme. La note conserve le terme technique possible et l’image littérale.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la satire, les images du vent et du mensonge, ainsi que l’adresse au singulier. L’exclamation finale fait ressortir la pointe ironique implicite du verset.
