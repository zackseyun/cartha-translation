  text: נְשֵׁ֤י עַמִּ/י֙ תְּגָ֣רְשׁ֔וּ/ן מִ/בֵּ֖ית תַּֽעֲנֻגֶ֑י/הָ מֵ/עַל֙ עֹֽלָלֶ֔י/הָ תִּקְח֥וּ הֲדָרִ֖/י לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/009.yaml
  text: You drive the women of my people out from their delightful houses[b][a]; from their children you take away my splendor forever.
translation:
  language: fr
  text: Vous chassez les femmes de mon peuple de leurs maisons agréables[a] ; vous enlevez pour toujours ma splendeur[b] à leurs jeunes enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les épouses de mon peuple ». Le mot hébreu peut désigner soit des femmes en général, soit des épouses.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma gloire », « ma majesté » ou « mon honneur ». Le terme hébreu peut évoquer la splendeur, la gloire, la majesté ou l’honneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁי עַמִּי
  choice: les femmes de mon peuple
  rationale: נְשֵׁי, pluriel construit de אִשָּׁה, peut désigner des femmes ou des épouses. Le terme général « femmes » convient au groupe vulnérable visé, tout en signalant l’autre possibilité en note.
- source_word: תְּגָרְשׁוּן
  choice: vous chassez
  rationale: Le piel de גרשׁ exprime une expulsion forcée. « Chasser » restitue cette violence en français naturel.
- source_word: מִבֵּית תַּעֲנֻגֶיהָ
  choice: de leurs maisons agréables
  rationale: La tournure hébraïque associe la maison aux agréments ou délices. Le suffixe féminin singulier peut avoir ici une valeur collective ou distributive. « Maisons agréables » reste naturel sans préciser indûment la nature de leur confort.
- source_word: מֵעַל עֹלָלֶיהָ
  choice: à leurs jeunes enfants
  rationale: עוֹלָל désigne de très jeunes enfants, parfois des nourrissons. Avec le verbe « enlever », מֵעַל se rend idiomatiquement par « à » en français.
- source_word: תִּקְחוּ
  choice: vous enlevez
  rationale: לקח signifie prendre ; dans cette accusation de dépossession, « enlever à » exprime clairement la privation.
- source_word: הֲדָרִי
  choice: ma splendeur
  rationale: הָדָר peut exprimer la splendeur, la gloire, la majesté ou l’honneur. « Splendeur » conserve le registre élevé et le possessif divin sans imposer une interprétation technique.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: עוֹלָם indique ici une durée durable ou indéfinie ; « pour toujours » rend naturellement la force de la dénonciation.
theological_decisions:
- issue: Référent du possessif dans « mon peuple » et « ma splendeur »
  choice: 'Conserver la première personne divine : « mon peuple » et « ma splendeur ».'
  alternative: Comprendre « ma splendeur » comme la dignité accordée par Dieu aux enfants plutôt que comme sa splendeur directement présente en eux.
  rationale: Le discours divin à la première personne est actif dans le contexte. La formulation littérale préserve la tension entre la splendeur propre à Dieu et la dignité ou la bénédiction qu’il confère, sans trancher.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme accusateur est conservé. « Jeunes enfants » rend la nuance de עֹלָל sans restreindre nécessairement le sens aux seuls nourrissons. Les marqueurs suivent immédiatement les expressions auxquelles les notes se rapportent.
