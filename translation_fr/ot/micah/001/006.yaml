id: MIC.1.6
reference: Micah 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י שֹׁמְר֛וֹן לְ/עִ֥י הַ/שָּׂדֶ֖ה לְ/מַטָּ֣עֵי כָ֑רֶם וְ/הִגַּרְתִּ֤י לַ/גַּי֙ אֲבָנֶ֔י/הָ וִ/יסֹדֶ֖י/הָ אֲגַלֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/006.yaml
  text: So I will make Samaria a heap in the open country[a], a place for planting vineyards[b]; I will pour her stones down into the valley and uncover her foundations.
translation:
  language: fr
  text: Je ferai donc de Samarie un tas de ruines en pleine campagne[a], un lieu où planter des vignes. Je déverserai[b] ses pierres dans la vallée et je mettrai à nu ses fondations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un tas de ruines dans les champs ». L’expression hébraïque est concise et peut se traduire plus littéralement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le verbe exprime l’idée de faire couler ou de verser ; ici, les pierres sont précipitées vers le bas, dans la vallée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Je ferai donc de
  rationale: Le qal à la 1re personne du singulier, précédé de la conjonction, exprime ici une déclaration prophétique à valeur future. « Donc » relie naturellement la sentence à ce qui précède sans renforcer excessivement le lien causal.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom propre.
- source_word: לְעִי הַשָּׂדֶה
  choice: un tas de ruines en pleine campagne
  rationale: עִי désigne un amas de décombres ou un monceau de ruines, et שׂדה le champ ou la campagne. Cette formulation rend clairement le contraste entre la ville et le terrain découvert.
- source_word: לְמַטָּעֵי כָרֶם
  choice: un lieu où planter des vignes
  rationale: La formule évoque un emplacement désormais destiné à des plantations de vigne. Le français reste naturel tout en conservant l’image agricole.
- source_word: וְהִגַּרְתִּי
  choice: Je déverserai
  rationale: Le hiphil de נגר signifie faire couler ou déverser. Appliqué aux pierres, il évoque leur chute en masse vers le bas et conserve la vigueur de la métaphore.
- source_word: לַגַּי
  choice: dans la vallée
  rationale: גַּי peut désigner une vallée ou un ravin. « Vallée » est le terme français le plus accessible sans imposer une topographie plus étroite.
- source_word: אֲבָנֶיהָ
  choice: ses pierres
  rationale: Le suffixe féminin singulier renvoie à Samarie. En français, le possessif « ses » convient naturellement tout en maintenant la référence à la ville.
- source_word: וִיסֹדֶיהָ אֲגַלֶּה
  choice: je mettrai à nu ses fondations
  rationale: Le piel de גלה signifie découvrir ou mettre à nu. L’expression rend l’image d’une destruction totale qui expose les fondations.
theological_decisions:
- issue: Personnification féminine de la ville
  choice: Employer les possessifs français « ses » pour Samarie
  alternative: Répéter « les pierres de Samarie » et « les fondations de Samarie »
  rationale: Les suffixes hébreux sont féminins singuliers et renvoient à la ville. Le français ne marque pas le genre du possesseur dans « ses » ; cette solution conserve la cohésion de l’image sans ajouter une personnification artificielle ni l’effacer par une paraphrase lourde.
translation_notes:
  register: Français international moderne, clair et digne. « Tas de ruines » explicite la valeur destructive de עִי ; « mettre à nu » garde la force concrète de l’image finale. Les deux propositions suivent le parallélisme et la progression du texte hébreu.
