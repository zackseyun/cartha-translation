  naturalness: La première apostrophe, « vous tous, peuples », est peu naturelle en français moderne. « Vous tous les peuples » conserve l’adresse directe et la pluralité tout en étant idiomatique. Pour le second membre, « Prête attention, terre, et tout ce qu’elle contient » restitue clairement la coordination hébraïque sans l’ajout interprétatif de « avec ».
