  text: שִׁמְעוּ֙ עַמִּ֣ים כֻּלָּ֔/ם הַקְשִׁ֖יבִי אֶ֣רֶץ וּ/מְלֹאָ֑/הּ וִ/יהִי֩ אֲדֹנָ֨/י יְהוִ֤ה בָּ/כֶם֙ לְ/עֵ֔ד אֲדֹנָ֖/י מֵ/הֵיכַ֥ל קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/002.yaml
  text: Hear[a], all you peoples; pay attention, O earth, and all that fills it. And let the Lord GOD be a witness against you[d][c][b], the Lord from his holy temple.
translation:
  language: fr
  text: Écoutez, vous tous les peuples ; prête attention, terre, et tout ce qu’elle contient. Que le Seigneur Yahweh soit témoin contre vous[a], le Seigneur depuis son saint temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « témoin parmi vous ». Dans ce contexte judiciaire, « contre vous » paraît plus probable.
    reason: alternative_reading
  - marker: b
    text: Ou « depuis son saint palais » ou « depuis son saint sanctuaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ עַמִּים כֻּלָּם
  choice: Écoutez, vous tous, peuples
  rationale: L’impératif pluriel ouvre une sommation prophétique solennelle. Cette formulation conserve l’adresse directe et la pluralité des peuples.
- source_word: הַקְשִׁיבִי
  choice: prête attention
  rationale: L’impératif féminin singulier s’adresse directement à « terre » ; le singulier est donc conservé en français.
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: terre, avec tout ce qui la remplit
  rationale: Le parallélisme avec tous les peuples favorise la portée universelle de « terre ». La tournure rend concrètement l’idée de sa pleine population ou de tout son contenu.
- source_word: וִיהִי
  choice: Que … soit
  rationale: Cette construction française restitue naturellement la valeur jussive et solennelle de la forme hébraïque.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: La traduction distingue les deux éléments du titre composé et rend explicitement le nom divin יהוה par « Yahweh ».
- source_word: בָּכֶם לְעֵד
  choice: témoin contre vous
  rationale: Le contexte de sommation judiciaire favorise la valeur adversative de la préposition, tout en maintenant l’image juridique du témoin.
- source_word: הֵיכַל קָדְשׁוֹ
  choice: son saint temple
  rationale: הֵיכָל peut désigner un palais ou un temple ; appliqué à la demeure sainte de Dieu, « temple » est naturel et reconnaissable en français.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU ; le Souverain Seigneur
  rationale: « Yahweh » préserve le nom propre de l’hébreu et évite de fondre les deux termes du titre composé.
- issue: Portée de אֶרֶץ
  choice: terre
  alternative: pays
  rationale: L’adresse à tous les peuples, suivie de tout ce qui remplit la terre, indique vraisemblablement une convocation universelle.
- issue: Valeur de בָּכֶם
  choice: contre vous
  alternative: parmi vous
  rationale: Le cadre prophétique et judiciaire rend probable l’idée d’un témoignage à charge, sans supprimer l’autre valeur linguistiquement possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement grammatical de « terre » reflète l’apostrophe hébraïque au féminin singulier ; le ton conserve la solennité d’une convocation judiciaire prophétique.
