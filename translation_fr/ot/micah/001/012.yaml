source:
  edition: WLC
  text: כִּֽי חָ֥לָֽה לְ/ט֖וֹב יוֹשֶׁ֣בֶת מָר֑וֹת כִּֽי יָ֤רַד רָע֙ מֵ/אֵ֣ת יְהוָ֔ה לְ/שַׁ֖עַר יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/012.yaml
  text: For the inhabitant of Maroth writhes for good, because disaster has come down from the LORD to the gate of Jerusalem.
translation:
  language: fr
  text: Car l’habitante de Maroth se tord dans l’attente du bonheur, parce que le malheur est descendu de la part de l’Éternel jusqu’à la porte de Jérusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלָה לְטוֹב
  choice: se tord dans l’attente du bonheur
  rationale: Le verbe חלה exprime normalement le fait d’être malade, faible ou souffrant; dans ce contexte, il évoque une attente douloureuse plutôt qu’une simple espérance. «Se tord» conserve la force physique de l’image, tandis que «dans l’attente du bonheur» rend לְטוֹב naturellement en français.
- source_word: יוֹשֶׁבֶת מָרוֹת
  choice: l’habitante de Maroth
  rationale: Le participe féminin singulier désigne collectivement la population, ou personnifie la ville; le féminin français conserve cette personnification.
- source_word: רָע
  choice: le malheur
  rationale: Ici רָע désigne une calamité ou un désastre, non une faute morale. «Malheur» préserve aussi le contraste lexical avec טוֹב, «bonheur».
- source_word: מֵאֵת יְהוָה
  choice: de la part de l’Éternel
  rationale: מֵאֵת marque la provenance ou l’initiative. «De la part de» rend cette nuance sans suggérer seulement un déplacement spatial. «L’Éternel» est la forme française traditionnelle et intelligible employée ici pour le tétragramme.
- source_word: לְשַׁעַר יְרוּשָׁלִָם
  choice: jusqu’à la porte de Jérusalem
  rationale: La préposition לְ indique ici le point atteint. La porte représente l’entrée et le lieu public stratégique de la ville.
theological_decisions:
- issue: Origine divine du malheur
  choice: «le malheur est descendu de la part de l’Éternel»
  alternative: «un désastre a atteint la porte de Jérusalem avec la permission de l’Éternel»
  rationale: Le texte attribue directement la provenance du רָע à YHWH. La traduction ne réduit pas cette affirmation à une simple permission, tout en rendant רָע comme calamité plutôt que comme mal moral.
- issue: Contraste entre טוֹב et רָע
  choice: «bonheur» / «malheur»
  alternative: «bien» / «désastre»
  rationale: Cette paire française fait entendre l’opposition voulue sans transformer טוֹב et רָע en catégories exclusivement morales.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la personnification féminine de Maroth, l’intensité inhabituelle de חלה et l’affirmation théologiquement tendue selon laquelle le malheur vient de l’Éternel.
