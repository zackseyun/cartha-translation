source:
  edition: WLC
  text: לָ/כֵן֙ תִּתְּנִ֣י שִׁלּוּחִ֔ים עַ֖ל מוֹרֶ֣שֶׁת גַּ֑ת בָּתֵּ֤י אַכְזִיב֙ לְ/אַכְזָ֔ב לְ/מַלְכֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/014.yaml
  text: Therefore you will give parting gifts for Moresheth-gath[b][a]; the houses of Achzib will prove deceptive to the kings of Israel.
translation:
  language: fr
  text: C’est pourquoi tu donneras des présents d’adieu[a] pour Morésheth-Gath ; les maisons d’Akzib[b] seront une déception pour les rois d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadeaux de séparation ». Le terme hébreu peut désigner des présents remis au moment de renvoyer quelqu’un et pourrait faire écho à une séparation conjugale.
    reason: lexical_alternative
  - marker: b
    text: 'Le nom Akzib ressemble au mot hébreu rendu par « déception », avec la nuance possible de « tromperie » ; il y a donc un jeu de mots : les maisons d’Akzib seront une déception pour les rois d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence des annonces de jugement précédentes.
- source_word: תִּתְּנִי
  choice: tu donneras
  rationale: Le qal inaccompli à la deuxième personne du féminin singulier est rendu par un futur prophétique sans préciser l’identité, laissée implicite, de la destinataire personnifiée.
- source_word: שִׁלּוּחִים
  choice: présents d’adieu
  rationale: Exprime des dons remis lors d’une séparation sans imposer le sens technique de présents de divorce, qui demeure une nuance possible.
- source_word: עַל
  choice: pour
  rationale: Dans ce contexte, « pour » rend souplement la relation entre les présents et Morésheth-Gath, sans faire nécessairement de la ville leur destinataire direct.
- source_word: מוֹרֶשֶׁת גַּת
  choice: Morésheth-Gath
  rationale: Translittération française claire du toponyme composé.
- source_word: בָּתֵּי אַכְזִיב
  choice: les maisons d’Akzib
  rationale: Conserve la formulation concrète du texte hébreu, qui peut désigner les maisons, mais aussi les maisonnées ou établissements de la ville.
- source_word: לְאַכְזָב
  choice: se révéleront trompeuses
  rationale: Rend idiomatiquement le prédicat signifiant mensonge, tromperie ou déception, tout en permettant d’expliquer le jeu sonore avec Akzib.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: pour les rois d’Israël
  rationale: Le français « pour » exprime naturellement la relation de détriment ou de déception envers les rois d’Israël.
theological_decisions:
- issue: Identité de la destinataire désignée par le verbe au féminin singulier
  choice: Maintenir la destinataire implicite par « tu », comme dans l’hébreu.
  alternative: Nommer explicitement Juda, Jérusalem ou Sion personnifiée, ou comprendre que Morésheth-Gath est directement interpellée.
  rationale: La forme verbale impose une destinataire féminine singulière, mais le verset ne la nomme pas. La traduction préserve donc cette ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Présents d’adieu » garde la nuance cérémonielle de la séparation ; « se révéleront trompeuses » communique clairement l’ironie du jeu de mots hébreu.
