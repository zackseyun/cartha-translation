  text: בְּ/גַת֙ אַל תַּגִּ֔ידוּ בָּכ֖וֹ אַל תִּבְכּ֑וּ בְּ/בֵ֣ית לְעַפְרָ֔ה עָפָ֖ר התפלשתי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/010.yaml
  text: In Gath[a], do not tell it; in Acco, do not weep.[b] In Beth-leaphrah[c], roll yourself in the dust.
translation:
  language: fr
  text: À Gath, ne l’annoncez pas ; ne pleurez pas du tout.[a] À Beth-Léafra[b], roule-toi dans la poussière.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture proposée : « à Akko, ne pleurez pas ». L’hébreu vocalisé signifie plus littéralement « pleurer, ne pleurez pas », tournure qui renforce l’interdiction ; certains y voient toutefois un jeu de mots sur le nom d’Akko.'
    reason: alternative_reading
  - marker: b
    text: Le nom Beth-Léafra évoque probablement en hébreu une « maison de poussière », en écho au mot « poussière » qui suit.
    reason: cultural_note
  - marker: c
    text: 'Le texte consonantique porte ici une forme à la première personne : « je me suis roulé ». Le contexte et la lecture traditionnelle conduisent beaucoup à comprendre un impératif : « roule-toi ».'
    reason: textual_variant
lexical_decisions:
- source_word: בְּגַת
  choice: À Gath
  rationale: Le nom de lieu est translittéré. En français, « à » est la préposition naturelle devant un nom de ville.
- source_word: אַל תַּגִּידוּ
  choice: ne l’annoncez pas
  rationale: Le hiphil de נגד signifie annoncer, rapporter ou déclarer. Le pronom « l’ » rend l’objet implicite sans l’expliciter indûment et conserve l’écho possible à 2 Samuel 1.20.
- source_word: בָּכוֹ אַל תִּבְכּוּ
  choice: ne pleurez surtout pas
  rationale: La vocalisation massorétique présente un infinitif absolu suivi d’une forme verbale de même racine, construction qui renforce ici l’interdiction. Cette lecture directe du WLC est retenue dans le texte, tandis que la lecture conjecturale comme nom de lieu « Akko » est signalée en note.
- source_word: בְּבֵית לְעַפְרָה
  choice: À Beth-Léafra
  rationale: Le toponyme est translittéré plutôt que traduit. Sa ressemblance avec עָפָר, « poussière », prépare le jeu de mots qui suit.
- source_word: עָפָר
  choice: poussière
  rationale: Équivalent usuel qui préserve à la fois l’image de deuil et le jeu sonore avec Beth-Léafra.
- source_word: התפלשתי
  choice: roule-toi
  rationale: Bien que la forme consonantique écrite soit à la première personne (« je me suis roulé »), le contexte impératif et la lecture traditionnelle soutiennent une adresse à la ville personnifiée. L’écart textuel est conservé en note.
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et prophétique. Le passage alterne le pluriel (« annoncez », « pleurez ») et le singulier (« roule-toi »), conformément aux formes hébraïques et à la personnification de Beth-Léafra. La lecture massorétique verbale de בָּכוֹ est privilégiée sur le conjectural toponyme Akko, sans supprimer cette ambiguïté.
