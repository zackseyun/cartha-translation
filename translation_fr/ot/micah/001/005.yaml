id: MIC.1.5
reference: Micah 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/פֶ֤שַׁע יַֽעֲקֹב֙ כָּל זֹ֔את וּ/בְ/חַטֹּ֖אות בֵּ֣ית יִשְׂרָאֵ֑ל מִֽי פֶ֣שַׁע יַעֲקֹ֗ב הֲ/לוֹא֙ שֹֽׁמְר֔וֹן וּ/מִי֙ בָּמ֣וֹת יְהוּדָ֔ה הֲ/ל֖וֹא יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/005.yaml
  text: All this is because of Jacob’s transgression[a], and because of the sins of the house of Israel[b]. What is Jacob’s transgression? Is it not Samaria? And what are the high places of Judah? Are they not Jerusalem?
translation:
  language: fr
  text: Tout cela est à cause de la révolte[a] de Jacob, à cause des péchés de la maison d’Israël. Quelle est la révolte de Jacob ? N’est-ce pas Samarie ? Et quels sont les hauts lieux[b] de Juda ? Ne sont-ils pas Jérusalem ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « transgression », ici et dans la seconde occurrence de « révolte ».
    reason: lexical_alternative
  - marker: b
    text: Les « hauts lieux » étaient des lieux de culte, souvent situés sur des hauteurs et fréquemment associés à un culte non autorisé ou idolâtre.
    reason: cultural_note
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: à cause de la révolte
  rationale: La préposition בְּ a ici une valeur causale. « Révolte » exprime la rupture volontaire envers Dieu portée par פֶּשַׁע, tout en restant naturel en français actuel.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom hébreu est conservé afin de respecter le parallélisme avec « la maison d’Israël » et la portée rhétorique du texte.
- source_word: כָּל־זֹאת
  choice: Tout cela arrive
  rationale: « Tout cela » renvoie aux manifestations de jugement précédentes. L’ajout idiomatique de « arrive » permet de relier naturellement la proposition causale sans préciser davantage la nature de « tout cela ».
- source_word: וּבְחַטֹּאות
  choice: à cause des péchés
  rationale: La préposition est de nouveau causale et חַטָּאוֹת désigne ici les péchés, non des sacrifices pour le péché.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette traduction conserve l’expression collective et dynastique du texte hébreu.
- source_word: מִי פֶשַׁע יַעֲקֹב
  choice: Quelle est la révolte de Jacob ?
  rationale: Bien que מִי signifie ordinairement « qui ? », il introduit ici l’identification rhétorique de ce qui incarne ou concentre la révolte. « Quelle est » est naturel en français et maintient l’ambiguïté métaphorique.
- source_word: הֲלוֹא
  choice: N’est-ce pas / Ne sont-ils pas
  rationale: Les questions négatives rendent la réponse affirmative attendue par la particule hébraïque.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom de la capitale du royaume du Nord.
- source_word: בָּמוֹת
  choice: hauts lieux
  rationale: Expression biblique française consacrée pour des lieux de culte surélevés, souvent liés dans ce contexte à un culte illégitime ou idolâtre.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française usuelle du nom de la tribu et du royaume.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la capitale de Juda.
theological_decisions:
- issue: Sens de פֶּשַׁע
  choice: révolte
  alternative: transgression
  rationale: « Révolte » fait ressortir la dimension relationnelle et collective de l’opposition à Dieu. La note conserve « transgression » comme autre traduction légitime.
- issue: Identification de Samarie et de Jérusalem
  choice: Conserver les questions rhétoriques qui identifient les capitales à la révolte et aux hauts lieux
  alternative: Expliquer que les capitales sont les centres ou les sources de la corruption religieuse
  rationale: Le texte présente une identification métaphorique ou métonymique tendue. La formulation française ne la résout pas par une paraphrase explicative.
- issue: Nombre de בָּמוֹת
  choice: quels sont les hauts lieux… ne sont-ils pas Jérusalem ?
  alternative: quel est le haut lieu… n’est-ce pas Jérusalem ?
  rationale: Le pluriel du texte massorétique est préservé, même si son identification à une ville singulière produit une tension grammaticale et rhétorique. Le pluriel « ils » peut viser les hauts lieux collectivement incarnés par Jérusalem.
translation_notes:
  register: Français international moderne, digne et lisible. La structure parallèle et les questions rhétoriques de l’hébreu sont conservées. Le pluriel difficile « hauts lieux » face au singulier « Jérusalem » est maintenu plutôt que corrigé silencieusement.
