  to: Tout cela est à cause de la révolte[a] de Jacob, à cause des péchés de la maison d’Israël. Quelle est la révolte de Jacob ? N’est-ce pas Samarie ? Et quels sont les hauts lieux[b] de Juda ? Ne sont-ils pas Jérusalem ?
