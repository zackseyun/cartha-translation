    issue: Ajout de « arrive » dans l’ouverture.
    rationale: L’hébreu dit littéralement « Tout cela [est] à cause de la révolte de Jacob ». Le verbe « arrive » est une explicitation possible, mais il introduit une nuance événementielle non exprimée et n’est pas nécessaire en français.
