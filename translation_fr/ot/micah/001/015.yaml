source:
  edition: WLC
  text: עֹ֗ד הַ/יֹּרֵשׁ֙ אָ֣בִי לָ֔/ךְ יוֹשֶׁ֖בֶת מָֽרֵשָׁ֑ה עַד עֲדֻּלָּ֥ם יָב֖וֹא כְּב֥וֹד יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/015.yaml
  text: I will yet bring an heir against you[a], inhabitant of Mareshah[b]; the glory of Israel will come as far as Adullam.
translation:
  language: fr
  text: Je ferai encore venir contre toi un héritier[a], habitante de Marésha ; jusqu’à Adoullam viendra la gloire d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un possesseur » ou « un conquérant ». L’hébreu fait probablement un jeu de mots avec le nom Marésha.
    reason: lexical_alternative
  - marker: b
    text: Ou « les nobles d’Israël » ou « la richesse ou la splendeur d’Israël ».
    reason: alternative_reading
lexical_decisions:
- source_word: עֹד
  choice: encore
  rationale: 'Marque la poursuite du jugement annoncé : celui-ci n’est pas achevé.'
- source_word: הַיֹּרֵשׁ
  choice: celui qui prendra possession de toi
  rationale: Le terme issu de ירשׁ peut désigner un héritier ou quelqu’un qui prend possession. Cette formulation convient au contexte de conquête et conserve le thème lexical qui fait écho au nom Marésha.
- source_word: אָבִי לָךְ
  choice: je ferai venir contre toi
  rationale: Le hiphil de בוא avec ל exprime ici l’introduction d’une puissance hostile ; « contre toi » rend le sens contextuel sans modifier l’image du mouvement.
- source_word: יוֹשֶׁבֶת
  choice: habitante
  rationale: Le participe féminin singulier interpelle la ville personnifiée comme une femme ; le féminin français préserve cette adresse directe.
- source_word: מָרֵשָׁה
  choice: Marésha
  rationale: Translittération française usuelle du nom de lieu ; le jeu sonore hébreu avec הַיֹּרֵשׁ ne peut être entièrement reproduit.
- source_word: עַד עֲדֻּלָּם
  choice: jusqu’à Adoullam
  rationale: עַד indique ici l’étendue spatiale du mouvement jusqu’à cette localité.
- source_word: כְּבוֹד יִשְׂרָאֵל
  choice: la gloire d’Israël
  rationale: 'Traduction large qui préserve les sens possibles de כבוד : gloire, splendeur, richesse ou élite sociale.'
theological_decisions:
- issue: Référent de « la gloire d’Israël »
  choice: Conserver la formulation générale « la gloire d’Israël ».
  alternative: « les nobles d’Israël » ou « la richesse/la splendeur d’Israël »
  rationale: L’hébreu ne détermine pas avec certitude si l’expression vise les dirigeants, les richesses ou ce qui fait la splendeur de la nation ; la traduction ne tranche donc pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe prophétique et l’adresse féminine à la ville sont conservées. Les deux marqueurs de note figurent dans le texte principal ; le marqueur [b] est placé après l’expression ambiguë qu’il explique.
