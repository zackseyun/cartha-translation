id: MIC.1.7
reference: Micah 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל פְּסִילֶ֣י/הָ יֻכַּ֗תּוּ וְ/כָל אֶתְנַנֶּ֨י/הָ֙ יִשָּׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל עֲצַבֶּ֖י/הָ אָשִׂ֣ים שְׁמָמָ֑ה כִּ֠י מֵ/אֶתְנַ֤ן זוֹנָה֙ קִבָּ֔צָה וְ/עַד אֶתְנַ֥ן זוֹנָ֖ה יָשֽׁוּבוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/007.yaml
  text: All her carved images will be smashed[a], and all her prostitute’s wages will be burned with fire; all her idols I will make desolate. For from the wages of a prostitute she gathered them[c][b], and to the wages of a prostitute they will return.
translation:
  language: fr
  text: Toutes ses images taillées seront mises en pièces[a], et tous ses gains de prostituée seront brûlés par le feu ; je livrerai toutes ses idoles à la désolation. Car c’est avec le salaire d’une prostituée[b] qu’elle les a amassées, et elles retourneront au salaire d’une prostituée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « statues sculptées ».
    reason: lexical_alternative
  - marker: b
    text: L’expression évoque métaphoriquement des richesses acquises par l’infidélité idolâtre de Samarie.
    reason: cultural_note
  - marker: c
    text: Ou « elles redeviendront le salaire d’une prostituée ».
    reason: alternative_reading
lexical_decisions:
- source_word: פְּסִילֶיהָ
  choice: ses statues sculptées
  rationale: פֶּסֶל désigne une représentation façonnée, notamment par taille, et employée comme idole. « Statues sculptées » garde le caractère concret du terme sans archaïsme.
- source_word: יֻכַּתּוּ
  choice: seront mises en pièces
  rationale: Le passif exprime une destruction violente. Cette tournure française est naturelle et conserve la force de l’image.
- source_word: אֶתְנַנֶּיהָ
  choice: ses gains de prostituée
  rationale: אֶתְנַן désigne la rétribution donnée pour la prostitution. « Gains de prostituée » rend explicitement la métaphore sexuelle tout en restant idiomatique.
- source_word: יִשָּׂרְפוּ בָאֵשׁ
  choice: seront brûlés par le feu
  rationale: La traduction maintient la mention explicite du feu et l’intensité de l’expression hébraïque.
- source_word: עֲצַבֶּיהָ
  choice: ses idoles
  rationale: עָצָב désigne ici des représentations idolâtriques. « Idoles » évite une répétition lourde après « statues sculptées », tout en conservant le référent religieux.
- source_word: אָשִׂים שְׁמָמָה
  choice: je réduirai … en ruines
  rationale: La tournure rend à la fois l’action personnelle exprimée par « je » et le résultat de dévastation contenu dans שְׁמָמָה, dans un français naturel.
- source_word: מֵאֶתְנַן זוֹנָה קִבָּצָה
  choice: c’est avec le salaire d’une prostituée qu’elle les a amassées
  rationale: La construction emphatique met en relief l’origine des biens. Le féminin singulier renvoie à Samarie personnifiée, tandis que le pronom reprend naturellement les statues ou idoles.
- source_word: וְעַד אֶתְנַן זוֹנָה יָשׁוּבוּ
  choice: et elles retourneront au salaire d’une prostituée
  rationale: Cette formulation suit le mouvement de retour exprimé par שׁוב et préserve l’énigmatique réversibilité de la métaphore, sans préciser indûment le mécanisme.
theological_decisions:
- issue: Métaphore de la prostitution appliquée à l’idolâtrie et à ses profits
  choice: Conserver explicitement le vocabulaire de la prostitution dans le texte principal
  alternative: Parler seulement de « gains malhonnêtes » ou de « profits idolâtres »
  rationale: La répétition de אֶתְנַן et זוֹנָה appartient à la force rhétorique de l’oracle. Une formulation atténuée effacerait le lien prophétique entre idolâtrie et infidélité.
- issue: Personnification féminine de Samarie
  choice: Employer « elle » et des possessifs féminins, en laissant Samarie personnifiée comme une femme
  alternative: Neutraliser la personnification en parlant impersonnellement de la ville
  rationale: Les formes féminines de l’hébreu soutiennent la personnification de la ville, essentielle à la métaphore du verset.
- issue: Sens de la dernière proposition
  choice: Traduire littéralement le retour « au salaire d’une prostituée »
  alternative: 'Expliciter : « elles redeviendront le salaire d’une prostituée »'
  rationale: Le texte permet de comprendre soit un retour à la même sphère de gain idolâtre, soit une transformation en nouvelle rétribution. Le texte principal conserve l’expression ouverte et la note signale l’autre compréhension.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme solennel de l’oracle est conservé, ainsi que la personnification féminine de Samarie et la métaphore volontairement dure de la prostitution. Les formulations archaïques ont été évitées.
