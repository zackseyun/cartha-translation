review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : destruction des images, combustion des gains liés à la prostitution, désolation des idoles, puis retournement des biens ainsi acquis. Toutefois, « réduirai ... en ruines » convient plus naturellement à une ville ou à un édifice qu’à des idoles et rend moins directement la formule hébraïque « je ferai ... une désolation ».'
  naturalness: Le français est moderne et soutenu. « Images taillées » est toutefois plus idiomatique et moins redondant que « statues sculptées ». « Je livrerai toutes ses idoles à la désolation » rend naturellement le jugement sur des objets sans leur attribuer artificiellement la qualité de ruines.
  terminology: Le vocabulaire de la prostitution est conservé sans atténuation et la personnification féminine de Samarie est maintenue. « Salaire d’une prostituée » reflète précisément אֶתְנַן זוֹנָה. La note finale conserve à bon droit l’autre possibilité interprétative.
  issues:
  - severity: low
    issue: « statues sculptées »
    rationale: L’expression est compréhensible, mais elle est légèrement pléonastique. « Images taillées » correspond directement à פְּסִילֶיהָ et constitue l’alternative française usuelle.
  - severity: medium
    issue: « je réduirai toutes ses idoles en ruines »
    rationale: La tournure est peu naturelle appliquée à des idoles et risque de suggérer des ruines architecturales. « Je livrerai toutes ses idoles à la désolation » conserve l’idée de dévastation exprimée par אָשִׂים שְׁמָמָה sans surinterpréter.
