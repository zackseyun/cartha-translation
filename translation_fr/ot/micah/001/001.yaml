  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל מִיכָה֙ הַ/מֹּ֣רַשְׁתִּ֔י בִּ/ימֵ֥י יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה אֲשֶׁר חָזָ֥ה עַל שֹׁמְר֖וֹן וִ/ירֽוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/001.yaml
  text: The word of Yahweh that came to Micah the Morashtite in the days of Jotham[a], Ahaz, and Hezekiah, kings of Judah[b], which he saw concerning Samaria and Jerusalem.
translation:
  language: fr
  text: La parole de Yahweh qui fut adressée à Michée de Morésheth[a], aux jours de Jotam, d’Achaz et d’Ézéchias, rois de Juda, et qu’il vit au sujet de Samarie et de Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « Michée le Morashtite », c’est-à-dire un homme originaire de Morésheth.
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « contre Samarie et Jérusalem ». La préposition hébraïque peut indiquer le sujet de la vision ou, dans ce contexte, une orientation hostile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: La parole de Yahweh
  rationale: La formule prophétique traditionnelle « parole de Yahweh » conserve à la fois la notion de révélation proclamée et le nom divin personnel.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: qui fut adressée à
  rationale: Cette tournure française exprime naturellement l’arrivée d’une révélation divine à un prophète, tout en restant proche de l’idiome hébreu.
- source_word: מִיכָה הַמֹּרַשְׁתִּי
  choice: Michée de Morésheth
  rationale: Le gentilé hébreu désigne Michée par son lieu d’origine. « de Morésheth » est plus naturel et immédiatement compréhensible en français que « le Morashtite ».
- source_word: בִּימֵי
  choice: aux jours de
  rationale: Cette expression conserve la formule hébraïque de datation royale dans un registre biblique encore clair en français moderne.
- source_word: יוֹתָם אָחָז יְחִזְקִיָּה
  choice: Yotam, Ahaz et Ézéchias
  rationale: Formes françaises usuelles ou directement translittérées des noms royaux.
- source_word: מַלְכֵי יְהוּדָה
  choice: rois de Juda
  rationale: Traduction directe du groupe construit hébreu, mise en apposition aux trois noms.
- source_word: אֲשֶׁר חָזָה
  choice: et qu’il vit
  rationale: Le verbe חזה appartient au vocabulaire de la vision prophétique. Le rendu littéral « vit » préserve l’image et la tension entre parole entendue et révélation vue.
- source_word: עַל
  choice: au sujet de
  rationale: Ce choix rend le sens général de thème ou d’objet sans exclure la nuance hostile possible dans un contexte d’annonce de jugement.
- source_word: שֹׁמְרוֹן וִירוּשָׁלָם
  choice: Samarie et Jérusalem
  rationale: Noms français traditionnels des deux villes, sans expliciter leur emploi éventuel comme désignation des royaumes correspondants.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin personnel. « Yahweh » le représente comme un nom propre plutôt que de lui substituer un titre.
- issue: Portée de la préposition עַל
  choice: au sujet de
  alternative: contre
  rationale: La préposition peut introduire le thème de la vision ou prendre ici une nuance adversative. Le texte principal garde le sens le plus large et la note signale l’autre possibilité.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve la structure de la suscription prophétique et le paradoxe intentionnel d’une « parole » que Michée « vit ». Les marqueurs de notes sont placés immédiatement après les éléments concernés.
