  text: כִּֽי הִנֵּ֥ה יְהוָ֖ה יֹצֵ֣א מִ/מְּקוֹמ֑/וֹ וְ/יָרַ֥ד וְ/דָרַ֖ךְ עַל במותי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/003.yaml
  text: For look, the LORD is coming out from his place; he will come down and tread on the high places of the earth.
translation:
  language: fr
  text: Car voici que le SEIGNEUR sort de son lieu ; il descend et foule les hauteurs de la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici que
  rationale: כִּי relie le verset à l’annonce précédente par une valeur causale, tandis que הִנֵּה attire solennellement l’attention sur l’intervention imminente.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rendu français traditionnel du tétragramme, en petites capitales, clair pour un lectorat général et distinct du titre אֲדֹנָי.
- source_word: מִמְּקוֹמוֹ
  choice: de sa demeure
  rationale: מָקוֹם signifie littéralement « lieu » ; ici, dans une scène théophanique, « demeure » exprime naturellement le lieu propre d’où YHWH sort sans préciser davantage sa nature.
- source_word: במותי אָרֶץ
  choice: les hauteurs de la terre
  rationale: La forme consonantique renvoie aux « hauteurs ». Le contexte cosmique favorise les reliefs élevés, tout en laissant subsister l’éventuel écho aux hauts lieux cultuels.
theological_decisions:
- issue: Nature de la sortie et de la descente divines
  choice: 'Conserver le langage spatial concret : « sort », « descend » et « foule »'
  alternative: Paraphraser comme une simple intervention ou un jugement divin
  rationale: Le texte présente une théophanie en images anthropomorphiques fortes. La traduction ne doit ni les atténuer ni définir métaphysiquement le lieu de Dieu.
- issue: Sens de « hauteurs »
  choice: Maintenir le terme général « hauteurs »
  alternative: Traduire explicitement par « hauts lieux » ou « sommets »
  rationale: « Hauts lieux » imposerait une lecture cultuelle, tandis que « sommets » éliminerait cet écho possible. « Hauteurs » préserve l’ambiguïté du texte.
translation_notes:
  register: Français moderne, solennel et accessible. Le présent « sort » donne à la vision sa vivacité, suivi de deux verbes coordonnés qui rendent le mouvement descendant et victorieux.
