  text: קָרְחִ֣י וָ/גֹ֔זִּי עַל בְּנֵ֖י תַּעֲנוּגָ֑יִ/ךְ הַרְחִ֤בִי קָרְחָתֵ/ךְ֙ כַּ/נֶּ֔שֶׁר כִּ֥י גָל֖וּ מִמֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/016.yaml
  text: Make yourself bald and shave your head for the children of your delight; enlarge your baldness like the eagle[a], for they have gone from you into exile.
translation:
  language: fr
  text: Rase-toi la tête, coupe tes cheveux en signe de deuil pour les enfants qui font ta joie ! Élargis ta calvitie comme l’aigle[a], car ils sont partis loin de toi en exil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme le vautour ». Le mot hébreu נֶשֶׁר peut désigner un grand oiseau charognard plutôt que spécifiquement un aigle ; dans les deux cas, l’image est celle d’une calvitie bien visible.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְחִי וָגֹזִּי
  choice: Rase-toi la tête, coupe tes cheveux en signe de deuil
  rationale: Les deux impératifs féminins décrivent des gestes de deuil. La formulation garde leur parallélisme tout en explicitant sobrement leur portée culturelle; « coupe tes cheveux » reflète גזז, « tondre/couper ».
- source_word: עַל בְּנֵי תַּעֲנוּגָיִךְ
  choice: pour les enfants qui font ta joie
  rationale: עַל indique ici le motif du deuil. בְּנֵי désigne les enfants sans restriction nécessaire au sexe masculin, et תַּעֲנוּגִים évoque ce qui procure délices ou joie.
- source_word: הַרְחִבִי קָרְחָתֵךְ
  choice: Élargis ta tonsure
  rationale: L’impératif הַרְחִבִי signifie « élargis », tandis que קָרְחָה désigne la partie rendue chauve. « Tonsure » exprime ici une zone du crâne rasée, sans intention d’évoquer une pratique ecclésiastique.
- source_word: כַּנֶּשֶׁר
  choice: comme le vautour
  rationale: נֶשֶׁר peut désigner un grand rapace, aigle ou vautour. Dans cette comparaison portant sur une tête visiblement dégarnie, « vautour » rend plus directement l’image probable, tout en conservant « aigle » en note comme traduction traditionnelle.
- source_word: כִּי גָלוּ מִמֵּךְ
  choice: car ils sont partis loin de toi en exil
  rationale: Le parfait de גלה exprime le départ en exil, et מִמֵּךְ la séparation d’avec la communauté personnifiée à laquelle s’adresse l’impératif féminin.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et solennel. L’adresse féminine à la communauté personnifiée est conservée. L’explicitation « en signe de deuil » rend intelligible la valeur culturelle des deux premiers impératifs sans supprimer leur image concrète.
