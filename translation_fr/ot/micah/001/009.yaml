source:
  edition: WLC
  text: כִּ֥י אֲנוּשָׁ֖ה מַכּוֹתֶ֑י/הָ כִּי בָ֨אָה֙ עַד יְהוּדָ֔ה נָגַ֛ע עַד שַׁ֥עַר עַמִּ֖/י עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/009.yaml
  text: For her wound is incurable[a], for it has come as far as Judah; it has reached to the gate of my people[b], to Jerusalem.
translation:
  language: fr
  text: Car ses blessures sont incurables[a], car cela est venu jusqu’à Juda ; cela a atteint la porte de mon peuple[b], jusqu’à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa blessure est incurable » ; le mot hébreu traduit par « blessures » est au pluriel, mais il peut avoir ici un sens collectif.
    reason: lexical_alternative
  - marker: b
    text: Ou « cela a touché la porte de mon peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנוּשָׁה
  choice: incurables
  rationale: L’adjectif décrit un état désespéré, au-delà de toute guérison. « Incurables » convient au contexte de jugement et s’accorde naturellement en français avec « blessures ».
- source_word: מַכּוֹתֶיהָ
  choice: ses blessures
  rationale: Le nom hébreu est morphologiquement pluriel et porte un suffixe féminin singulier, renvoyant à la ville ou à la nation personnifiée dans le contexte.
- source_word: בָאָה
  choice: le fléau est arrivé
  rationale: Le verbe féminin singulier présente la calamité comme avançant jusqu’à Juda. L’ajout explicatif de « le fléau » donne en français un antécédent naturel sans identifier trop précisément le sujet implicite.
- source_word: עַד יְהוּדָה
  choice: jusqu’à Juda
  rationale: עַד indique ici l’étendue atteinte par le jugement.
- source_word: נָגַע
  choice: il a atteint
  rationale: Le verbe peut signifier « toucher » ou « atteindre ». « Atteint » exprime naturellement l’arrivée du fléau à la limite de Jérusalem, tandis qu’une note conserve l’autre nuance.
- source_word: שַׁעַר עַמִּי
  choice: la porte de mon peuple
  rationale: Cette traduction maintient l’image concrète de la porte et la première personne du texte hébreu.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu, placée en apposition pour préciser « la porte de mon peuple ».
theological_decisions:
- issue: Référent des formes féminines et changement de genre verbal
  choice: Le désastre est rendu par « le fléau », tandis que « ses blessures » conserve la personnification féminine de la ville ou de la nation.
  alternative: 'On pourrait traduire plus littéralement : « car elle est arrivée jusqu’à Juda », en rapportant le féminin à la blessure, à la calamité ou à la ville personnifiée.'
  rationale: L’hébreu passe d’expressions féminines à un verbe masculin et ne fixe pas explicitement un unique sujet. La formulation française reste lisible sans imposer une identification théologique précise du référent.
- issue: Nombre de מַכּוֹתֶיהָ
  choice: « ses blessures » conserve le pluriel morphologique.
  alternative: « sa blessure » peut rendre le pluriel dans un sens collectif.
  rationale: Le pluriel source mérite d’apparaître dans le texte principal, tout en signalant en note la lecture collective possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme prophétique est conservé par les deux propositions parallèles ; les termes concrets « blessures », « fléau » et « porte » maintiennent l’image du jugement qui progresse jusqu’à Jérusalem.
