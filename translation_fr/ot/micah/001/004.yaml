  text: וְ/נָמַ֤סּוּ הֶֽ/הָרִים֙ תַּחְתָּ֔י/ו וְ/הָ/עֲמָקִ֖ים יִתְבַּקָּ֑עוּ כַּ/דּוֹנַג֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ כְּ/מַ֖יִם מֻגָּרִ֥ים בְּ/מוֹרָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/004.yaml
  text: And the mountains will melt beneath him, and the valleys will split open, like wax before the fire, like waters poured down a slope.
translation:
  language: fr
  text: 'Les montagnes fondront sous lui,

    et les vallées se fendront,

    comme la cire devant le feu,

    comme des eaux déversées le long d’une pente.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָמַסּוּ
  choice: fondront
  rationale: Le verbe נמס exprime l’idée de fondre ou de se dissoudre. « Fondront » est naturel en français et prépare la comparaison avec la cire.
- source_word: הֶהָרִים
  choice: les montagnes
  rationale: Traduction directe du nom pluriel défini.
- source_word: תַּחְתָּיו
  choice: sous ses pas
  rationale: Littéralement « sous lui ». Dans le prolongement de Michée 1.3, où le SEIGNEUR marche sur les hauteurs, « sous ses pas » rend naturellement l’image sans remplacer le pronom par son référent.
- source_word: וְהָעֲמָקִים
  choice: les vallées
  rationale: עֲמָקִים désigne les vallées ou lieux profonds. « Vallées » est le sens général et forme un parallèle naturel avec « montagnes ».
- source_word: יִתְבַּקָּעוּ
  choice: se fendront
  rationale: La forme verbale décrit le fait de se fendre ou de s’ouvrir sous l’effet d’une rupture. « Se fendront » conserve la force de l’image en français courant.
- source_word: כַּדּוֹנַג
  choice: comme la cire
  rationale: Traduction directe de la comparaison.
- source_word: מִפְּנֵי הָאֵשׁ
  choice: devant le feu
  rationale: L’expression signifie littéralement « de devant la face du feu » et évoque la cire exposée à sa présence. « Devant le feu » est concis et idiomatique.
- source_word: כְּמַיִם
  choice: comme l’eau
  rationale: Bien que מַיִם ait une forme plurielle en hébreu, le français emploie naturellement le singulier massif « l’eau » dans cette comparaison.
- source_word: מֻגָּרִים
  choice: déversée
  rationale: Le participe passif de נגר décrit une eau que l’on fait couler ou que l’on verse. « Déversée » restitue ce mouvement.
- source_word: בְּמוֹרָד
  choice: sur une pente
  rationale: מוֹרָד désigne une descente ou une pente. Avec « déversée », « sur une pente » exprime clairement l’écoulement vers le bas.
theological_decisions:
- issue: Référent du suffixe masculin dans תַּחְתָּיו
  choice: Le possessif « ses » renvoie au SEIGNEUR qui vient et marche dans le verset précédent.
  alternative: Rendre explicitement « sous le SEIGNEUR » ou conserver la formulation plus littérale « sous lui ».
  rationale: Le contexte immédiat identifie clairement le référent. « Sous ses pas » maintient le lien pronominal de l’hébreu et l’image de la marche divine sans répéter artificiellement le nom du SEIGNEUR.
translation_notes:
  register: Français moderne, poétique et digne. La disposition en quatre lignes met en valeur le parallélisme hébreu. Aucun terme technique ou confessionnel n’est introduit.
