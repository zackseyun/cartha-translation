  - severity: low
    issue: « déversée sur une pente » affaiblit la direction descendante de בְּמוֹרָד.
    rationale: La préposition française « sur » peut seulement situer l'eau sur la pente. « Le long d’une pente » exprime plus nettement l'écoulement vers le bas tout en gardant le participe passif « déversées ».
