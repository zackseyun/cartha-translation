source:
  edition: WLC
  text: רְתֹ֧ם הַ/מֶּרְכָּבָ֛ה לָ/רֶ֖כֶשׁ יוֹשֶׁ֣בֶת לָכִ֑ישׁ רֵאשִׁ֨ית חַטָּ֥את הִיא֙ לְ/בַת צִיּ֔וֹן כִּי בָ֥/ךְ נִמְצְא֖וּ פִּשְׁעֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/013.yaml
  text: Harness the chariot to the swift horse[a], inhabitant of Lachish; she was the beginning of sin to daughter Zion[d][c][b], for in you were found the transgressions of Israel.
translation:
  language: fr
  text: Attelle le char au coursier rapide, habitante de Lakish ! Elle a été, pour la fille de Sion[b], le commencement du péché[a], car c’est chez toi qu’ont été trouvées les révoltes d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’origine du péché ». L’expression peut présenter Lakish comme le point de départ par lequel la fille de Sion a adopté la révolte d’Israël.
    reason: alternative_reading
  - marker: b
    text: « La fille de Sion » est une personnification poétique de Sion, c’est-à-dire Jérusalem et sa population.
    reason: cultural_note
  - marker: c
    text: Ou « transgressions ». Le mot hébreu peut souligner une rébellion volontaire, et non une simple faute.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְתֹם הַמֶּרְכָּבָה לָרֶכֶשׁ
  choice: Attelle le char au coursier rapide
  rationale: L’impératif רְתֹם ordonne d’atteler un animal à un véhicule. רֶכֶשׁ désigne une monture rapide; « coursier rapide » garde cette idée dans un français actuel et digne.
- source_word: יוֹשֶׁבֶת לָכִישׁ
  choice: habitante de Lakish
  rationale: Le participe féminin singulier interpelle la ville personnifiée. Le féminin français conserve explicitement cette personnification.
- source_word: רֵאשִׁית חַטָּאת הִיא
  choice: Elle a été […] le commencement du péché
  rationale: רֵאשִׁית exprime ici le commencement ou point de départ, et חַטָּאת désigne le péché plutôt qu’un sacrifice pour le péché. La formulation laisse ouverte la manière précise dont Lakish en fut l’origine.
- source_word: לְבַת צִיּוֹן
  choice: pour la fille de Sion
  rationale: La préposition ל indique ici la relation avec Sion, tandis que « fille de Sion » conserve l’image poétique hébraïque sans l’aplanir.
- source_word: כִּי בָךְ נִמְצְאוּ
  choice: car c’est chez toi qu’ont été trouvées
  rationale: « Car » rend la valeur explicative de כִּי. « Chez toi » restitue naturellement l’adresse féminine singulière à la ville et la tournure emphatique souligne le lieu de la découverte.
- source_word: פִּשְׁעֵי יִשְׂרָאֵל
  choice: les révoltes d’Israël
  rationale: פֶּשַׁע évoque une transgression volontaire, voire une rébellion. « Révoltes » préserve mieux cette force que le terme plus général « fautes ».
theological_decisions:
- issue: Sens de חַטָּאת dans l’accusation prophétique
  choice: péché
  alternative: sacrifice pour le péché
  rationale: Le contexte accuse Lakish d’avoir transmis ou inauguré le mal associé aux révoltes d’Israël; il ne traite pas d’un rite sacrificiel.
- issue: Portée de רֵאשִׁית חַטָּאת
  choice: Lakish comme commencement ou point d’origine du péché pour la fille de Sion
  alternative: Lakish comme péché principal, ou comme première ville jugée
  rationale: La syntaxe relie naturellement Lakish au commencement du péché, puis justifie cette accusation par la présence en elle des révoltes d’Israël. La traduction n’explicite pas davantage le mécanisme historique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’impératif est direct et la ville est personnifiée au féminin. « Lakish » suit une translittération française usuelle; « coursier » maintient la dignité poétique sans archaïsme excessif.
