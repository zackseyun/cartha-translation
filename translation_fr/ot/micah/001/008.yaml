  text: עַל זֹאת֙ אֶסְפְּדָ֣ה וְ/אֵילִ֔ילָה אֵילְכָ֥ה שילל וְ/עָר֑וֹם אֶעֱשֶׂ֤ה מִסְפֵּד֙ כַּ/תַּנִּ֔ים וְ/אֵ֖בֶל כִּ/בְנ֥וֹת יַעֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/008.yaml
  text: Because of this I will lament and wail[a]; I will go stripped and naked. I will make a lament like the jackals[b], and mourning like the daughters of the ostrich.
translation:
  language: fr
  text: C’est pourquoi je me lamenterai et je pousserai des cris ; j’irai dépouillé[a] et nu. Je ferai une lamentation comme les chacals, et un deuil comme les filles de l’autruche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pieds nus et nu ». Le mot hébreu traduit par « dépouillé » est difficile ; il peut désigner le fait d’aller pieds nus, signe de deuil et d’humiliation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les filles de l’autruche », expression poétique hébraïque désignant les autruches, ou les autruches femelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶסְפְּדָה
  choice: je me lamenterai
  rationale: Le verbe ספד désigne la lamentation, souvent dans un contexte de deuil. « Me lamenter » le distingue du cri plus aigu exprimé par le verbe suivant.
- source_word: וְאֵילִילָה
  choice: et je pousserai des cris
  rationale: Le verbe ילל évoque des cris perçants. Cette formulation française garde leur intensité sans introduire ici une comparaison animale.
- source_word: אֵילְכָה שילל וְעָרוֹם
  choice: j’irai déchaussé et nu
  rationale: עָרוֹם signifie clairement « nu ». Le premier terme est difficile, mais « déchaussé » correspond bien à un geste public de deuil et d’humiliation ; l’autre lecture importante, « dépouillé », est signalée en note.
- source_word: מִסְפֵּד
  choice: une lamentation
  rationale: Le nom désigne l’expression audible du deuil. « Lamentation » est naturel et permet de maintenir une légère distinction avec אֵבֶל.
- source_word: כַּתַּנִּים
  choice: comme les chacals
  rationale: Dans la poésie prophétique, תַּנִּים désigne vraisemblablement les chacals, connus pour leurs cris lugubres, plutôt que les « dragons » des traductions anciennes.
- source_word: וְאֵבֶל
  choice: des cris de deuil
  rationale: אֵבֶל désigne le deuil comme état ou pratique. L’ajout de « cris » rend explicite le parallélisme sonore avec les animaux tout en conservant la notion de deuil.
- source_word: כִּבְנוֹת יַעֲנָה
  choice: comme les filles de l’autruche
  rationale: La traduction littérale conserve l’image familiale inhabituelle et la texture poétique de l’hébreu ; son sens zoologique est précisé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le futur à la première personne et le parallélisme du vers sont conservés. « Déchaussé » est privilégié à « pieds nus » pour garder la coordination concise avec « nu », tandis que les deux incertitudes lexicales importantes sont maintenues en notes.
