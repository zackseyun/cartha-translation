  text: עִבְרִ֥י לָ/כֶ֛ם יוֹשֶׁ֥בֶת שָׁפִ֖יר עֶרְיָה בֹ֑שֶׁת לֹ֤א יָֽצְאָה֙ יוֹשֶׁ֣בֶת צַֽאֲנָ֔ן מִסְפַּד֙ בֵּ֣ית הָאֵ֔צֶל יִקַּ֥ח מִ/כֶּ֖ם עֶמְדָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/011.yaml
  text: Pass on[a], naked and in shame, inhabitant of Shaphir. The inhabitant of Zaanan has not come out[c][b]. The lamentation of Beth-ezel will take away from you its support.
translation:
  language: fr
  text: Passe, nue et honteuse, habitante de Shaphir.[a] L’habitante de Tsaanân n’est pas sortie. La lamentation de Beth-Haëtsel vous privera de son appui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Shaphir, Tsaanân et Beth-Haëtsel sont des noms de lieux. Michée joue probablement sur leur sonorité ou leur sens : Shaphir peut évoquer la beauté, Tsaanân fait écho au verbe « sortir », et Beth-Haëtsel peut suggérer une maison voisine ou située à côté.'
    reason: cultural_note
  - marker: b
    text: 'Le dernier membre de phrase est difficile. Autre traduction possible : « La lamentation de Beth-Haëtsel vous enlèvera le lieu où vous tenir. » Il peut être question de la perte d’un appui ou d’un refuge proche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי לָכֶם
  choice: Passez votre chemin
  rationale: L’impératif féminin singulier s’adresse à la ville personnifiée, tandis que le pronom pluriel évoque collectivement ses habitants. Cette tournure naturelle peut suggérer le départ forcé ou l’exil sans l’expliciter.
- source_word: יוֹשֶׁבֶת שָׁפִיר
  choice: habitante de Shaphir
  rationale: Le participe féminin singulier personnifie la ville sous les traits d’une habitante; la formulation française conserve cette image.
- source_word: עֶרְיָה בֹשֶׁת
  choice: nue et couverte de honte
  rationale: La traduction exprime à la fois l’exposition physique et l’humiliation, avec une formulation française naturelle et digne.
- source_word: לֹא יָצְאָה יוֹשֶׁבֶת צַאֲנָן
  choice: L’habitante de Tsaanân n’est pas sortie
  rationale: La formulation reste proche de l’hébreu et ne précise pas si la ville ne sort pas pour combattre, secourir, mener le deuil ou partir.
- source_word: מִסְפַּד בֵּית הָאֵצֶל
  choice: Les lamentations de Beth-Haëtsel
  rationale: Le pluriel idiomatique français rend le deuil ou les lamentations associés à ce lieu, sans décider s’ils ont lieu dans la ville ou sont prononcés à son sujet.
- source_word: יִקַּח מִכֶּם עֶמְדָּתוֹ
  choice: vous priveront de son appui
  rationale: Le sens contextuel probable est la perte d’un soutien ou refuge voisin. La note conserve l’autre lecture plus formelle d’un lieu où se tenir.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les villes sont personnifiées au féminin. Les noms propres sont translittérés de façon à rester reconnaissables en français, et les jeux de mots hébreux sont expliqués en note plutôt que forcés dans le texte.
