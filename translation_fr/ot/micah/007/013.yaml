source:
  edition: WLC
  text: וְ/הָיְתָ֥ה הָ/אָ֛רֶץ לִ/שְׁמָמָ֖ה עַל יֹֽשְׁבֶ֑י/הָ מִ/פְּרִ֖י מַֽעַלְלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/013.yaml
  text: But the land will become a desolation because of its inhabitants[b][a], because of the fruit of their deeds.
translation:
  language: fr
  text: Mais le pays deviendra une désolation à cause de ses habitants[a], à cause du fruit de leurs actes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre deviendra une désolation ». Le mot hébreu peut désigner « le pays » ou « la terre » ; « le pays » convient mieux au contexte immédiat de jugement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « du fruit de leurs actes » : expression hébraïque désignant les conséquences produites par ce qu’ils ont fait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: deviendra
  rationale: Dans ce contexte prophétique, le parfait précédé de la conjonction a une valeur future; « deviendra » exprime le passage à un état de dévastation.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: אֶרֶץ peut désigner le pays ou la terre; ici, le territoire soumis au jugement convient le mieux au contexte immédiat.
- source_word: לִשְׁמָמָה
  choice: un lieu dévasté
  rationale: Le substantif désigne un état ou un spectacle de désolation; cette formulation conserve sa force nominale tout en restant naturelle en français.
- source_word: עַל יֹשְׁבֶיהָ
  choice: à cause de ses habitants
  rationale: La préposition exprime ici la cause, et le participe substantivé avec suffixe désigne ceux qui habitent le pays.
- source_word: מִפְּרִי מַעַלְלֵיהֶם
  choice: à cause du fruit de leurs actes
  rationale: La formulation garde la métaphore hébraïque du « fruit », c’est-à-dire des conséquences produites par leur conduite, ainsi que la valeur causale du contexte.
theological_decisions:
- issue: Structure causale du jugement
  choice: La dévastation du pays est reliée à ses habitants, puis au fruit de leurs actes.
  alternative: 'Comprendre plus littéralement le second membre comme indiquant la source: « par le fruit de leurs actes ».'
  rationale: L’hébreu juxtapose deux expressions causales. Répéter « à cause de » clarifie leur rapport sans dépasser l’affirmation morale du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Lieu dévasté » évite le tour moins naturel « une désolation », tandis que « fruit de leurs actes » préserve l’image hébraïque et sa portée morale.
