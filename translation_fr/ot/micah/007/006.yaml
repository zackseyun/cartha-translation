id: MIC.7.6
reference: Micah 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי בֵן֙ מְנַבֵּ֣ל אָ֔ב בַּ֚ת קָמָ֣ה בְ/אִמָּ֔/הּ כַּלָּ֖ה בַּ/חֲמֹתָ֑/הּ אֹיְבֵ֥י אִ֖ישׁ אַנְשֵׁ֥י בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/006.yaml
  text: For a son treats his father with contempt[a]; a daughter rises up against her mother; a daughter-in-law against her mother-in-law[b]; a man's enemies are the men of his own house.
translation:
  language: fr
  text: Car un fils traite son père avec mépris[a] ; une fille se dresse contre sa mère, une belle-fille contre sa belle-mère ; les ennemis d’un homme sont les gens de sa propre maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déshonore son père ». Le verbe hébreu peut évoquer le fait de traiter quelqu’un honteusement ou avec mépris.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les hommes de sa maison » ; l’expression peut désigner plus largement les membres de sa maisonnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la lamentation précédente et conserve clairement le lien logique.
- source_word: מְנַבֵּל
  choice: traite ... avec mépris
  rationale: Le participe piel de נבל exprime une conduite qui couvre quelqu’un de honte ou le traite avec mépris ; cette formulation naturelle en français garde la force relationnelle du verbe.
- source_word: קָמָה
  choice: se dresse contre
  rationale: Conserve l’image vive du verbe קום employé ici dans un sens hostile, sans préciser excessivement par « se révolte ».
- source_word: כַּלָּה
  choice: une belle-fille
  rationale: Dans cette série de relations familiales, le mot désigne la femme du fils plutôt qu’une jeune épouse ou une fiancée.
- source_word: אֹיְבֵי אִישׁ
  choice: les ennemis d’un homme
  rationale: Rend directement le masculin singulier générique אִישׁ et la construction possessive.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: les gens de sa propre maison
  rationale: אַנְשֵׁי signifie littéralement « hommes de », mais la locution désigne ici les personnes appartenant à la maisonnée ; « propre » souligne la proximité trahie.
theological_decisions:
- issue: Portée de l’expression masculine אַנְשֵׁי בֵיתוֹ
  choice: les gens de sa propre maison
  alternative: les hommes de sa propre maison
  rationale: Bien que אַנְשֵׁי soit morphologiquement masculin, l’expression construite peut désigner collectivement les membres de la maisonnée. Le contexte vient d’énumérer aussi des femmes ; la formulation retenue préserve donc la portée familiale sans imposer une restriction aux seuls hommes.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme familial et l’image « se dresse contre » sont conservés. La dernière expression reste proche de l’idiome hébreu tout en étant immédiatement compréhensible.
