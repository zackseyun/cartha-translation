source:
  edition: WLC
  text: כִּ/ימֵ֥י צֵאתְ/ךָ֖ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אַרְאֶ֖/נּוּ נִפְלָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/015.yaml
  text: As in the days when you came out from the land of Egypt[a], I will show him wondrous things.
translation:
  language: fr
  text: Comme aux jours où tu es sorti du pays d’Égypte, je lui[a] ferai voir des merveilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je leur ferai voir des merveilles ». Le suffixe hébreu est au singulier (« lui »), mais il peut désigner collectivement Israël.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּימֵי
  choice: Comme aux jours
  rationale: La préposition comparative כְּ jointe à יְמֵי établit un parallèle avec l’époque de l’Exode. « Comme aux jours » en conserve la forme concise et solennelle.
- source_word: צֵאתְךָ
  choice: où tu es sorti
  rationale: L’infinitif construit avec suffixe masculin singulier de deuxième personne signifie littéralement « ta sortie ». Une proposition temporelle est naturelle en français et maintient l’adresse au singulier.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette formulation conserve אֶרֶץ, « pays », et rend naturellement la préposition מִן indiquant le point de départ.
- source_word: אַרְאֶנּוּ
  choice: je lui ferai voir
  rationale: Le hiphil de ראה exprime ici l’idée de faire voir ou de montrer. « Je lui ferai voir » préserve explicitement le suffixe masculin singulier de troisième personne.
- source_word: נִפְלָאוֹת
  choice: des merveilles
  rationale: Le terme désigne des actes extraordinaires qui suscitent l’émerveillement. « Merveilles » garde cette portée large sans la réduire au seul sens technique de « miracles ».
theological_decisions:
- issue: Référent du suffixe masculin singulier dans אַרְאֶנּוּ
  choice: Conserver le singulier grammatical avec « lui », probablement en référence collective à Israël/Jacob.
  alternative: 'Employer le pluriel collectif : « je leur ferai voir des merveilles ».'
  rationale: La forme hébraïque est singulière, tandis que le contexte concerne le peuple de l’alliance. Le texte principal maintient cette tension grammaticale et référentielle au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « Comme aux jours où » conserve la tonalité prophétique sans archaïsme marqué ; « merveilles » fait écho au langage traditionnel de l’Exode tout en restant courant.
