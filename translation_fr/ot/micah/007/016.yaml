id: MIC.7.16
reference: Micah 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִרְא֤וּ גוֹיִם֙ וְ/יֵבֹ֔שׁוּ מִ/כֹּ֖ל גְּבֽוּרָתָ֑/ם יָשִׂ֤ימוּ יָד֙ עַל פֶּ֔ה אָזְנֵי/הֶ֖ם תֶּחֱרַֽשְׁנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/016.yaml
  text: Nations will see and be ashamed of all their might[a]; they will put their hand over their mouth[c][b]; their ears will become deaf.
translation:
  language: fr
  text: Les nations verront et auront honte de toute leur puissance[a]. Elles mettront la main sur leur bouche[b] ; leurs oreilles deviendront sourdes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront couvertes de honte à cause de toute leur puissance ». L’expression hébraïque peut indiquer une honte liée à la puissance des nations ou causée par elle.'
    reason: lexical_alternative
  - marker: b
    text: Mettre la main sur sa bouche est un geste exprimant le silence, la stupeur ou la soumission.
    reason: cultural_note
  - marker: c
    text: 'Ou : « leurs oreilles seront bouchées » ou « leurs oreilles n’entendront plus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: verront
  rationale: Le qal inaccompli de ראה exprime ici l’action de voir ou de constater. Le futur convient au contexte prophétique, et l’emploi absolu évite d’ajouter un complément absent de l’hébreu.
- source_word: גוֹיִם
  choice: les nations
  rationale: גּוֹיִם désigne ici les peuples ou nations dans un cadre collectif et géopolitique ; « les nations » est plus naturel et moins chargé que « les païens ».
- source_word: וְיֵבֹשׁוּ
  choice: et auront honte
  rationale: Le qal de בוש exprime la honte ou la confusion. « Auront honte » est clair, actuel et préserve la possibilité d’une honte éprouvée sans imposer explicitement un agent extérieur.
- source_word: מִכֹּל גְּבוּרָתָם
  choice: de toute leur puissance
  rationale: גְּבוּרָה désigne la force ou la puissance. La préposition מִן peut marquer ici la relation ou la cause ; la formulation compacte conserve cette latitude, explicitée en note.
- source_word: יָשִׂימוּ יָד עַל־פֶּה
  choice: elles mettront la main sur leur bouche
  rationale: La traduction conserve l’image idiomatique hébraïque et le singulier collectif « la main », tout en restant naturelle en français.
- source_word: אָזְנֵיהֶם תֶּחֱרַשְׁנָה
  choice: leurs oreilles deviendront sourdes
  rationale: Avec « oreilles » pour sujet, חרשׁ évoque le fait de devenir sourd ou de ne plus entendre. La traduction maintient l’image corporelle sans en fixer davantage le sens figuré.
theological_decisions: []
