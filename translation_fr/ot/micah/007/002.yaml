id: MIC.7.2
reference: Micah 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָבַ֤ד חָסִיד֙ מִן הָ/אָ֔רֶץ וְ/יָשָׁ֥ר בָּ/אָדָ֖ם אָ֑יִן כֻּלָּ/ם֙ לְ/דָמִ֣ים יֶאֱרֹ֔בוּ אִ֥ישׁ אֶת אָחִ֖י/הוּ יָצ֥וּדוּ חֵֽרֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/002.yaml
  text: The faithful has perished from the land[a], and there is no upright one among mankind. All of them lie in wait for blood[c][b]; each hunts his brother with a net.
translation:
  language: fr
  text: Le fidèle a disparu du pays[a], et il n’y a personne de droit parmi les êtres humains. Tous se tiennent en embuscade pour verser le sang ; chacun traque son frère[b] avec un filet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son frère » ; le terme peut aussi désigner plus largement un autre membre de la communauté.
    reason: lexical_alternative
  - marker: c
    text: Ou « avec un piège ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד
  choice: a disparu
  rationale: Le qal accompli exprime une disparition tenue pour effective. « A disparu » rend naturellement la plainte sans affaiblir sa gravité.
- source_word: חָסִיד
  choice: le fidèle
  rationale: Le terme désigne une personne caractérisée par la fidélité et la loyauté, notamment envers Dieu et l’alliance. Le singulier a ici une valeur représentative.
- source_word: מִן הָאָרֶץ
  choice: du pays
  rationale: Dans cette dénonciation de la société israélite, « pays » est le sens contextuel le plus concret ; « terre » demeure possible.
- source_word: וְיָשָׁר
  choice: personne de droit
  rationale: L’adjectif substantivé désigne une personne moralement droite. Cette formulation évite de préciser inutilement le genre tout en restant idiomatique.
- source_word: בָּאָדָם
  choice: parmi les êtres humains
  rationale: אָדָם est générique ici et renvoie à l’humanité, non aux seuls hommes de sexe masculin.
- source_word: אָיִן
  choice: il n’y a personne
  rationale: Rend l’absence existentielle exprimée par אָיִן et fournit en français le support naturel de l’adjectif substantivé.
- source_word: כֻּלָּם
  choice: tous
  rationale: Conserve la totalité sans exception exprimée par le pronom hébreu.
- source_word: לְדָמִים
  choice: pour verser le sang
  rationale: Le pluriel hébreu « sangs » évoque ici le meurtre ou l’effusion de sang. La tournure française explicite idiomatiquement le but meurtrier.
- source_word: יֶאֱרֹבוּ
  choice: se tiennent en embuscade
  rationale: Rend l’action de guetter clandestinement une victime en vue de l’attaquer.
- source_word: אִישׁ
  choice: chacun
  rationale: 'Le nom a une valeur distributive : chaque individu participe personnellement à cette violence.'
- source_word: אָחִיהוּ
  choice: son frère
  rationale: La traduction littérale renforce l’horreur de la trahison au sein de la communauté, tout en laissant une note signaler l’extension possible du terme.
- source_word: יָצ֥וּדוּ
  choice: traque
  rationale: Le verbe appartient au domaine de la chasse et de la capture. « Traque » convient à une cible humaine et maintient l’image prédatrice.
- source_word: חֵרֶם
  choice: avec un filet
  rationale: Dans ce contexte de chasse, le nom désigne un filet servant à capturer ; « piège » est une autre traduction possible.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: parmi les êtres humains
  alternative: parmi les hommes
  rationale: Le mot est grammaticalement masculin mais générique dans ce contexte. « Les êtres humains » transmet clairement cette portée sans limiter le propos aux personnes de sexe masculin.
- issue: Portée de אָחִיהוּ
  choice: son frère
  alternative: son semblable
  rationale: Le sens littéral conserve la force de la dénonciation d’une violence fraternelle et communautaire. La note indique que le terme peut viser plus largement un autre membre de la communauté.
translation_notes:
  register: Français international actuel, sobre et digne. La structure conserve le mouvement de la lamentation vers la dénonciation collective, ainsi que les images d’embuscade et de chasse. Le point-virgule marque la progression sans rompre le parallélisme.
