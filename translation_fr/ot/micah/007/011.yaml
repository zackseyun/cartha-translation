  text: י֖וֹם לִ/בְנ֣וֹת גְּדֵרָ֑יִ/ךְ י֥וֹם הַ/ה֖וּא יִרְחַק חֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/011.yaml
  text: A day for building your walls—on that day the boundary will be far removed[a].
translation:
  language: fr
  text: Un jour viendra pour bâtir tes murs ; ce jour-là, la frontière sera repoussée au loin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le décret sera éloigné ». Le mot hébreu peut désigner une frontière ou une limite, mais aussi un décret ou une prescription.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֖וֹם
  choice: Un jour viendra
  rationale: Le nom יוֹם ouvre ici une annonce prophétique elliptique. En français, « Un jour viendra » restitue naturellement cette valeur tout en rendant explicite le caractère futur suggéré par le contexte.
- source_word: לִ/בְנ֣וֹת
  choice: pour bâtir
  rationale: La préposition ל avec l’infinitif construit de בנה exprime ici la destination ou le moment prévu pour l’action. « Pour bâtir » reste proche de la forme hébraïque sans imposer explicitement l’idée de reconstruction.
- source_word: גְּדֵרָ֑יִ/ךְ
  choice: tes murs
  rationale: Le terme גדר désigne des murs ou barrières d’enceinte. « Tes murs » convient au contexte de restauration et demeure moins spécifique que « tes fortifications ».
- source_word: י֥וֹם הַ/ה֖וּא
  choice: ce jour-là
  rationale: Cette formule temporelle prophétique se rend naturellement en français par « ce jour-là ».
- source_word: יִרְחַק
  choice: sera repoussée au loin
  rationale: Le verbe רחק signifie être ou devenir éloigné. Avec une frontière comme sujet, « sera repoussée au loin » exprime idiomatiquement son éloignement sans identifier l’agent.
- source_word: חֹֽק
  choice: la frontière
  rationale: חֹק peut désigner une limite ou frontière, mais aussi un décret ou une prescription. Dans l’image immédiate des murs et de la restauration, le sens spatial s’intègre le mieux ; l’autre sens est conservé en note.
theological_decisions:
- issue: Sens de חֹק dans la dernière proposition
  choice: frontière ou limite spatiale
  alternative: décret ou prescription
  rationale: 'L’évocation de la construction des murs favorise une lecture territoriale : la limite sera éloignée. Le sens juridique reste lexicalement possible et est signalé en note afin de préserver l’ambiguïté réelle de l’hébreu.'
translation_notes:
  register: Français international moderne, naturel et digne. La tournure prophétique elliptique est légèrement explicitée par « viendra ». Le point-virgule conserve le parallélisme des deux membres, et la note préserve l’ambiguïté lexicale de חֹק.
