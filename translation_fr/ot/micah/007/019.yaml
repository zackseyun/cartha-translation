  variant: modern international French
source:
  edition: WLC
  text: יָשׁ֣וּב יְרַֽחֲמֵ֔/נוּ יִכְבֹּ֖שׁ עֲוֺֽנֹתֵ֑י/נוּ וְ/תַשְׁלִ֛יךְ בִּ/מְצֻל֥וֹת יָ֖ם כָּל חַטֹּאותָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/019.yaml
  text: He will again have compassion on us[a]; he will subdue our iniquities[b]. He will cast all their sins into the depths of the sea.
translation:
  language: fr
  text: Il aura de nouveau compassion de nous ; il soumettra nos fautes. Tu jetteras au fond de la mer tous leurs péchés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe brusquement de « il » à l’adresse directe « tu », puis de « nos fautes » à « leurs péchés ». Des témoins anciens et de nombreuses traductions harmonisent : « Il jettera tous nos péchés au fond de la mer. »'
    reason: alternative_reading
lexical_decisions:
- source_word: יָשׁוּב
  choice: de nouveau
  rationale: 'Avec le verbe qui suit, יָשׁוּב exprime ici la répétition : Dieu aura de nouveau compassion, plutôt qu’un retour spatial.'
- source_word: יְרַחֲמֵנוּ
  choice: aura compassion de nous
  rationale: רחם évoque une compassion profonde et miséricordieuse ; cette formulation est naturelle, digne et conserve la force affective du terme.
- source_word: יִכְבֹּשׁ
  choice: soumettra
  rationale: כבש signifie mettre sous domination ou réduire à l’impuissance. « Soumettra » garde l’image d’une victoire décisive sur les fautes sans ajouter l’idée plus précise de les piétiner.
- source_word: עֲוֺנֹתֵינוּ
  choice: nos fautes
  rationale: עון peut désigner la faute, l’iniquité ou la culpabilité. « Fautes » est clair en français moderne et demeure distinct du terme חטאת rendu ensuite par « péchés ».
- source_word: וְתַשְׁלִיךְ
  choice: Tu jetteras
  rationale: La forme massorétique est à la deuxième personne masculine du singulier. La traduction conserve donc le passage inattendu du discours sur Dieu à l’adresse directe à Dieu.
- source_word: בִּמְצֻלוֹת יָם
  choice: au fond de la mer
  rationale: מצולות désigne les profondeurs de la mer. « Au fond de la mer » restitue naturellement en français l’image d’un éloignement complet.
- source_word: כָּל
  choice: tous
  rationale: Le terme exprime la totalité ; son accord avec « péchés » donne naturellement « tous ».
- source_word: חַטֹּאותָם
  choice: leurs péchés
  rationale: Le suffixe massorétique est celui de la troisième personne du pluriel, « leurs », malgré le passage abrupt depuis « nos fautes ».
theological_decisions:
- issue: Changements de personne et de référent pronominal dans le verset
  choice: 'Conserver les changements du texte massorétique : « Il aura… il soumettra… Tu jetteras… leurs péchés ».'
  alternative: 'Harmoniser ainsi : « Il aura de nouveau compassion de nous… il jettera tous nos péchés au fond de la mer. »'
  rationale: Les changements sont réellement présents dans l’hébreu reçu. Les maintenir évite de résoudre silencieusement une tension textuelle et rhétorique, tout en signalant en note la formulation harmonisée attestée par des témoins anciens et courante dans les traductions.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation fait entendre le passage de la déclaration à l’adresse directe. La note unique accompagne le marqueur [a] placé après l’ensemble de la proposition concernée.
