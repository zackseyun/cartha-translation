source:
  edition: WLC
  text: אַל תַּאֲמִ֣ינוּ בְ/רֵ֔עַ אַֽל תִּבְטְח֖וּ בְּ/אַלּ֑וּף מִ/שֹּׁכֶ֣בֶת חֵיקֶ֔/ךָ שְׁמֹ֖ר פִּתְחֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/005.yaml
  text: Do not trust in a neighbor[a]; do not put confidence in a close companion. From the woman who lies in your bosom[d][c][b], guard the doors of your mouth.
translation:
  language: fr
  text: Ne vous fiez pas à un proche[a] ; ne placez pas votre confiance dans un ami intime[b]. Même à celle qui repose contre toi[c], garde les portes de ta bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à un ami » ou « à ton prochain ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans un confident » ou « dans un compagnon intime ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « à partir de celle qui couche dans ton sein ». L’expression évoque la compagne la plus intime, vraisemblablement l’épouse.
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: un proche
  rationale: Le terme désigne une personne de l’entourage et peut signifier « ami » ou « prochain ». « Un proche » conserve ici sa portée relationnelle sans lui attribuer d’emblée la plus grande intimité.
- source_word: אַלּוּף
  choice: un ami intime
  rationale: Dans ce contexte, le mot désigne un compagnon familier et étroitement lié, non un chef. Cette formulation marque la progression par rapport à רֵעַ.
- source_word: תַּאֲמִינוּ
  choice: vous fiez
  rationale: Le hifil de אמן construit avec ב exprime le fait d’accorder sa confiance à quelqu’un. « Se fier à » est naturel en français et convient à l’avertissement.
- source_word: תִּבְטְחוּ
  choice: placez votre confiance
  rationale: בטח exprime la confiance ou l’assurance placée en quelqu’un. La formulation préserve le parallélisme synonymique sans répéter exactement le premier verbe.
- source_word: מִשֹּׁכֶבֶת חֵיקֶךָ
  choice: Même devant la femme qui repose contre toi
  rationale: 'L’expression décrit littéralement la femme couchée dans le sein ou l’étreinte du destinataire, image de la relation domestique la plus intime. « Contre toi » restitue naturellement cette proximité en français moderne, tandis que « même devant » rend explicitement la valeur séparative et restrictive de מִן dans le contexte : il faut retenir ses paroles jusque devant elle.'
- source_word: שְׁמֹר
  choice: garde
  rationale: L’impératif demande de protéger ou surveiller soigneusement. « Garde » conserve la brièveté et la force de l’hébreu.
- source_word: פִּתְחֵי פִיךָ
  choice: les portes de ta bouche
  rationale: Cette traduction conserve la métaphore vive des ouvertures de la bouche comme des portes qu’il faut tenir fermées afin de maîtriser ses paroles.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passage du pluriel (« vous ») au singulier (« toi », « ta ») est conservé, puisqu’il correspond au changement de nombre dans le texte massorétique. La métaphore « les portes de ta bouche » est maintenue plutôt que paraphrasée.
