  source_fidelity: La première paire d’avertissements rend bien le parallélisme de confiance entre רֵעַ (« un proche ») et אַלּוּף (« un ami intime »). Le dernier membre doit cependant exprimer la retenue de parole à l’égard de la femme très proche, et non une position « devant » elle. La préposition מִן introduit la personne auprès/de laquelle il faut garder les paroles; « même à celle qui repose contre toi » rend cette relation de façon naturelle tout en conservant l’image.
  naturalness: Le français est globalement moderne et sobre. « Même devant la femme » modifie toutefois le sens et est moins juste dans ce contexte. « Même à celle qui repose contre toi » est plus idiomatique avec « garder les portes de ta bouche » au sens de retenir ses paroles. L’alternance du pluriel initial et du singulier final est à conserver, puisqu’elle suit l’hébreu.
  terminology: « Se fier à », « placer sa confiance » et « garder les portes de ta bouche » sont des choix adéquats. « Un proche » maintient utilement l’extension de רֵעַ sans imposer « voisin » ou « ami ». « Ami intime » convient à אַלּוּף dans ce contexte. La note doit supprimer « loin de », qui ne correspond pas au texte et induit une distance spatiale absente.
