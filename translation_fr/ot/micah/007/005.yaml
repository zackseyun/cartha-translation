    rationale: « Loin de » ajoute une idée d’éloignement qui n’est pas dans l’expression hébraïque et contredit la fonction contextuelle de l’avertissement. La note doit présenter littéralement la femme couchée dans le sein du destinataire, puis expliquer l’intimité de la relation.
