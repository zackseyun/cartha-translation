source:
  edition: WLC
  text: רְעֵ֧ה עַמְּ/ךָ֣ בְ/שִׁבְטֶ֗/ךָ צֹ֚אן נַֽחֲלָתֶ֔/ךָ שֹׁכְנִ֣י לְ/בָדָ֔ד יַ֖עַר בְּ/ת֣וֹךְ כַּרְמֶ֑ל יִרְע֥וּ בָשָׁ֛ן וְ/גִלְעָ֖ד כִּ/ימֵ֥י עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/014.yaml
  text: Shepherd your people with your staff[a], the flock of your inheritance, dwelling alone in a forest in the midst of Carmel; let them graze in Bashan and Gilead as in days of old.
translation:
  language: fr
  text: Fais paître ton peuple avec ton bâton, le troupeau qui est ton héritage, qui demeure à l’écart dans la forêt, au milieu du Carmel[a]. Qu’il paisse en Bashân et en Galaad, comme aux jours d’autrefois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu d’une terre fertile » ou « au milieu des pâturages ». Le mot hébreu peut désigner la région du Carmel ou une terre fertile.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵה
  choice: Conduis … [comme un berger]
  rationale: L’impératif de רעה présente Dieu comme berger. « Conduis » associé au « bâton de berger » exprime naturellement en français moderne la direction et les soins pastoraux, sans réduire le verbe à la seule alimentation.
- source_word: בְשִׁבְטֶךָ
  choice: avec ton bâton de berger
  rationale: Dans ce contexte pastoral, שֵׁבֶט désigne le bâton du berger. Cette formulation conserve l’image tout en évitant que « bâton » soit compris principalement comme instrument de châtiment.
- source_word: צֹאן נַחֲלָתֶךָ
  choice: le troupeau qui est ton héritage
  rationale: La formulation garde à la fois l’image collective du troupeau et le langage d’appartenance exprimé par נַחֲלָה.
- source_word: שֹׁכְנִי לְבָדָד
  choice: qui demeure à l’écart
  rationale: Le participe décrit la situation durable du troupeau. « À l’écart » rend l’isolement sans suggérer nécessairement un sentiment de solitude.
- source_word: יַעַר
  choice: dans la forêt
  rationale: Le sens concret de « forêt » maintient le contraste poétique entre le lieu isolé où demeure le troupeau et les pâturages fertiles demandés ensuite.
- source_word: בְּתוֹךְ כַּרְמֶל
  choice: au milieu du Carmel
  rationale: Le nom propre est retenu en raison du cadre géographique créé par Bashân et Galaad, tout en signalant en note le sens lexical possible de terre fertile.
- source_word: יִרְעוּ
  choice: Qu’il paisse
  rationale: L’imparfait à valeur volitive prolonge la prière. Le singulier français s’accorde avec le collectif « troupeau » et maintient explicitement l’image pastorale.
- source_word: בָשָׁן וְגִלְעָד
  choice: en Bashân et en Galaad
  rationale: Les noms traditionnels français de ces régions fertiles sont conservés.
- source_word: כִּימֵי עוֹלָם
  choice: comme aux jours d’autrefois
  rationale: Ici, עוֹלָם renvoie au passé lointain plutôt qu’à l’éternité. L’expression française est naturelle et conserve la portée historique.
theological_decisions:
- issue: Soins divins ou discipline dans שֵׁבֶט
  choice: bâton de berger, dans une image de conduite et de protection
  alternative: bâton ou verge mettant davantage l’accent sur l’autorité et la discipline
  rationale: La demande immédiate porte sur la conduite du troupeau et son accès aux pâturages. Le sens pastoral est donc privilégié sans nier la nuance d’autorité que peut porter le terme.
- issue: Référent de כַּרְמֶל
  choice: le territoire du Carmel
  alternative: une terre fertile ou un pâturage
  rationale: La mention de Bashân et de Galaad favorise une lecture géographique, mais le nom commun reste lexicalement possible et est conservé en note.
translation_notes:
  register: Français international moderne, clair et digne. « Bâton de berger » explicite l’image sans archaïsme; « paisse » est légèrement soutenu, mais reste précis et compréhensible dans ce contexte pastoral. Le marqueur de note est placé après « Carmel », auquel porte réellement l’ambiguïté.
