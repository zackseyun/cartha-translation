base_translation:
  language: en
  yaml_path: translation/ot/micah/007/003.yaml
  text: 'Their hands are on evil[a], to do it well: the prince asks, and the judge is for a bribe, and the great man speaks the desire of his soul[c][b]; thus they weave it together.'
translation:
  language: fr
  text: 'Leurs deux mains s’appliquent au mal pour bien le faire[a] : le chef demande, le juge agit contre paiement[b], et le puissant exprime le désir de son âme ; ensemble, ils l’entrelacent[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les deux mains sont au mal, pour bien le faire ». L’expression souligne leur entière application et leur habileté à faire le mal.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est elliptique : « le juge, contre paiement ». On peut aussi comprendre : « le juge demande un paiement » ou « le juge rend ses jugements contre paiement ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils la rendent tortueuse ». Le verbe évoque le tressage, l’entrelacement ou la torsion. Le pronom renvoie de façon implicite à l’affaire mauvaise ou au dessein en cause; l’image suggère que ces personnes coordonnent leurs actes de corruption comme on tresse plusieurs fils.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הָרַע כַּפַּיִם
  choice: Leurs deux mains s’appliquent au mal
  rationale: Le duel כַּפַּיִם peut souligner l’engagement des deux mains. « S’appliquent au mal » exprime naturellement leur participation active et résolue au mal, sans préciser à tort un geste concret.
- source_word: לְהֵיטִיב
  choice: pour bien le faire
  rationale: 'L’infinitif hifil de יטב signifie littéralement « bien faire ». La formulation conserve l’ironie du texte : leur habileté s’exerce dans le mal.'
- source_word: הַשַּׂר שֹׁאֵל
  choice: le chef demande
  rationale: שַׂר désigne un dirigeant ou haut responsable. « Chef » est actuel et assez large ; « demande » respecte la sobriété de שֹׁאֵל sans expliciter ce que le texte laisse sous-entendu.
- source_word: וְהַשֹּׁפֵט בַּשִּׁלּוּם
  choice: le juge agit contre paiement
  rationale: La construction hébraïque est elliptique. Cette formulation conserve l’idée d’une action judiciaire achetée sans ajouter que le juge demande lui-même le paiement.
- source_word: וְהַגָּדוֹל
  choice: le puissant
  rationale: L’adjectif substantivé désigne ici un personnage important ou influent. « Le puissant » rend clairement son statut social dans ce contexte de corruption.
- source_word: דֹּבֵר הַוַּת נַפְשׁוֹ
  choice: exprime le désir de son âme
  rationale: הַוַּת peut évoquer désir, avidité, malfaisance ou ruine. « Désir » préserve une part de l’ambiguïté lexicale, tandis que le contexte en montre le caractère mauvais et intéressé.
- source_word: וַיְעַבְּתוּהָ
  choice: ensemble, ils trament tout cela
  rationale: Le verbe עבת évoque ce qui est tressé, entrelacé ou rendu tortueux. « Trament » restitue en français l’image d’une corruption coordonnée ; le pronom féminin renvoie vraisemblablement à l’affaire mauvaise dans son ensemble.
