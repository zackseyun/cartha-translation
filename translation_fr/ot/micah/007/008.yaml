  text: אַֽל תִּשְׂמְחִ֤י אֹיַ֨בְתִּ/י֙ לִ֔/י כִּ֥י נָפַ֖לְתִּי קָ֑מְתִּי כִּֽי אֵשֵׁ֣ב בַּ/חֹ֔שֶׁךְ יְהוָ֖ה א֥וֹר לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/008.yaml
  text: Do not rejoice over me[a], my enemy; though I have fallen, I will rise. Though I sit in darkness[b], Yahweh will be a light to me.
translation:
  language: fr
  text: Ne te réjouis pas à mes dépens[a], mon ennemie ! Même après ma chute, je me relèverai[b]. Même si je demeure dans les ténèbres, Yahweh est pour moi une lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne jubile pas sur mon sort, mon ennemie ! » Le verbe hébreu signifie littéralement « se réjouir » ; « jubiler » fait davantage ressortir la joie hostile suggérée par le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Les deux verbes hébreux sont à la forme accomplie : littéralement, « je suis tombé(e), je me suis relevé(e) » ; l’hébreu ne marque pas le genre du locuteur ici. Dans ce contexte poétique, le second peut exprimer avec certitude le relèvement à venir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמְחִי ... לִי
  choice: Ne te réjouis pas à mon sujet
  rationale: La tournure conserve le sens premier de שׂמח, « se réjouir », tandis que לִי désigne ici la personne aux dépens de laquelle l’ennemie se réjouit. « Ne jubile pas sur mon sort » serait plus idiomatique, mais aussi plus interprétatif.
- source_word: אֹיַבְתִּי
  choice: mon ennemie
  rationale: Le nom hébreu est au féminin singulier et porte le suffixe de première personne ; le féminin français préserve cette adresse directe à une ennemie personnifiée.
- source_word: כִּי
  choice: Même si
  rationale: 'Dans les deux propositions, כִּי a naturellement une valeur concessive : la chute et les ténèbres ne justifient pas la joie de l’ennemie, car le renversement est assuré.'
- source_word: נָפַלְתִּי קָמְתִּי
  choice: je suis tombée, je me relèverai
  rationale: Les deux formes sont des accomplis hébreux. Le français rend la première comme un état résultant d’une chute et la seconde comme le relèvement futur présenté avec assurance dans la poésie.
- source_word: אֵשֵׁב בַּחֹשֶׁךְ
  choice: je demeure dans les ténèbres
  rationale: ישׁב peut signifier « s’asseoir », « demeurer » ou « habiter ». « Demeurer » garde ici l’image d’une situation prolongée sans imposer en français un genre grammatical au sujet.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle afin de conserver le nom propre présent dans le texte hébreu.
- source_word: אוֹר לִי
  choice: est pour moi une lumière
  rationale: La proposition nominale présente Yahweh comme lumière pour la locutrice. Cette formulation conserve la relation marquée par לִי et évite de réduire la métaphore à la seule orientation.
theological_decisions:
- issue: Temporalité de קָמְתִּי dans l’affirmation de relèvement
  choice: je me relèverai
  alternative: je me suis relevée
  rationale: Bien que la forme soit morphologiquement accomplie, le contraste avec la chute et la situation encore décrite dans les ténèbres favorise une certitude poétique portant sur le relèvement à venir. La note signale la forme littérale afin de préserver l’ambiguïté.
- issue: Temporalité de la proposition יְהוָה אוֹר לִי
  choice: Yahweh est pour moi une lumière
  alternative: Yahweh sera pour moi une lumière
  rationale: L’hébreu ne comporte pas de verbe exprimé. Le présent français respecte cette proposition nominale et peut désigner une réalité actuelle jusque dans les ténèbres ; le futur reste contextuellement possible.
translation_notes:
  register: Français international actuel, poétique et digne. L’adresse féminine « mon ennemie » suit explicitement la morphologie hébraïque. La formulation conserve les images de la chute, des ténèbres et de la lumière sans expliciter leur portée métaphorique.
