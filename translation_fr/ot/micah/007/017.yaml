  variant: modern international French
source:
  edition: WLC
  text: יְלַחֲכ֤וּ עָפָר֙ כַּ/נָּחָ֔שׁ כְּ/זֹחֲלֵ֣י אֶ֔רֶץ יִרְגְּז֖וּ מִ/מִּסְגְּרֹֽתֵי/הֶ֑ם אֶל יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ יִפְחָ֔דוּ וְ/יִֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/017.yaml
  text: They will lick the dust like a snake[a]; like crawling things of the earth they will come trembling out of their strongholds. To Yahweh our God they will turn in dread[d][c][b], and they will be afraid because of you.
translation:
  language: fr
  text: Ils lécheront la poussière comme le serpent ; comme les êtres qui rampent sur la terre, ils sortiront en tremblant de leurs refuges[a]. Ils viendront avec effroi vers Yahweh[b], notre Dieu, et ils auront peur de toi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leurs retranchements », « de leurs enceintes » ou « de leurs cachettes ».
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin YHWH.
    reason: alternative_reading
  - marker: c
    text: Ou « ils te craindront ». Le verbe hébreu peut exprimer la peur, parfois avec une nuance de crainte respectueuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְלַחֲכוּ עָפָר
  choice: ils lécheront la poussière
  rationale: Conserve l’image concrète et humiliante du verbe intensif « lécher » sans la paraphraser.
- source_word: כַּנָּחָשׁ
  choice: comme le serpent
  rationale: « Serpent » est le terme français courant et littéraire correspondant à נָחָשׁ ; l’article défini reflète celui de l’hébreu sans imposer une identification particulière.
- source_word: כְּזֹחֲלֵי אֶרֶץ
  choice: comme les êtres qui rampent sur la terre
  rationale: Rend l’idée générale de créatures rampantes sans les réduire à une catégorie zoologique précise.
- source_word: יִרְגְּזוּ מִמִּסְגְּרֹתֵיהֶם
  choice: ils sortiront en tremblant de leurs refuges
  rationale: רגז exprime le tremblement ou l’agitation ; la préposition מן indique ici qu’ils quittent leurs lieux clos. « Refuges » convient au contexte tout en laissant en note les autres valeurs possibles.
- source_word: אֶל יְהוָה אֱלֹהֵינוּ יִפְחָדוּ
  choice: ils viendront avec effroi vers Yahweh, notre Dieu
  rationale: La tournure française exprime la direction marquée par אֶל et la peur intense de פחד. Le mouvement est implicite dans la construction hébraïque, non dans le verbe פחד pris isolément.
- source_word: וְיִרְאוּ מִמֶּךָ
  choice: et ils auront peur de toi
  rationale: Préserve le second terme de peur et rend naturellement מן après ירא. Cette formulation conserve aussi l’adresse directe au singulier.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération identifie explicitement le nom divin du texte hébreu et évite de le remplacer silencieusement par un titre.
- issue: Nuance de ירא dans la dernière proposition
  choice: avoir peur
  alternative: éprouver de la crainte / être saisi de respect
  rationale: Le parallélisme immédiat avec פחד et le contexte d’humiliation des nations favorisent la peur, tout en laissant en note la nuance possible de crainte révérencielle.
- issue: Relation entre Yahweh et le pronom « toi »
  choice: maintenir « Yahweh, notre Dieu » puis l’adresse « toi »
  alternative: uniformiser entièrement à la troisième personne
  rationale: Le passage soudain à la deuxième personne appartient au texte hébreu et doit être conservé plutôt que lissé.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le parallélisme poétique, l’image du serpent et le double vocabulaire de la peur, sans préciser abusivement la nature des créatures rampantes ni des lieux clos.
