id: MIC.7.9
reference: Micah 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זַ֤עַף יְהוָה֙ אֶשָּׂ֔א כִּ֥י חָטָ֖אתִי ל֑/וֹ עַד֩ אֲשֶׁ֨ר יָרִ֤יב רִיבִ/י֙ וְ/עָשָׂ֣ה מִשְׁפָּטִ֔/י יוֹצִיאֵ֣/נִי לָ/א֔וֹר אֶרְאֶ֖ה בְּ/צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/009.yaml
  text: I will bear the indignation of Yahweh[a], because I have sinned against him, until he pleads my case and executes justice for me. He will bring me out to the light; I will look upon his righteousness.
translation:
  language: fr
  text: Je supporterai l’indignation de Yahweh, car j’ai péché contre lui, jusqu’à ce qu’il défende ma cause et me rende justice. Il me fera sortir dans la lumière ; je contemplerai sa justice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa droiture ». Le mot hébreu peut désigner aussi bien la justice que la droiture, particulièrement dans un contexte où le droit est rétabli.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַעַף יְהוָה
  choice: l’indignation de Yahweh
  rationale: זַעַף exprime une colère forte, ici dans un cadre moral et judiciaire. « Indignation » conserve cette nuance sans exagérer le contexte de discipline reconnue comme méritée. Le nom divin est translittéré « Yahweh ».
- source_word: אֶשָּׂא
  choice: Je supporterai
  rationale: נשא signifie ici porter ou endurer les conséquences d’une faute. « Supporter » est naturel en français et garde l’idée d’assumer ce qui pèse sur la personne.
- source_word: כִּי חָטָאתִי לוֹ
  choice: car j’ai péché contre lui
  rationale: כִּי introduit la cause, et la construction avec ל désigne celui envers qui la faute a été commise. « Pécher contre lui » est l’équivalent idiomatique français.
- source_word: עַד אֲשֶׁר
  choice: jusqu’à ce que
  rationale: La locution indique le terme jusqu’auquel la personne supportera l’indignation divine.
- source_word: יָרִיב רִיבִי
  choice: il défende ma cause
  rationale: 'Le verbe et son nom apparenté forment une expression juridique : prendre en main et soutenir la cause de quelqu’un. « Défendre ma cause » restitue clairement cette image judiciaire.'
- source_word: וְעָשָׂה מִשְׁפָּטִי
  choice: et me rende justice
  rationale: מִשְׁפָּטִי désigne ici un jugement favorable ou la reconnaissance judiciaire du bon droit. « Me rendre justice » est idiomatique et conserve le sens de réhabilitation.
- source_word: יוֹצִיאֵנִי לָאוֹר
  choice: Il me fera sortir à la lumière
  rationale: La forme causative de יצא signifie « faire sortir ». La formulation conserve l’image hébraïque du passage hors des ténèbres vers la lumière de la délivrance et de la réhabilitation.
- source_word: אֶרְאֶה
  choice: je contemplerai
  rationale: ראה signifie fondamentalement « voir ». « Contempler » convient au registre poétique et exprime une perception attentive sans imposer une interprétation supplémentaire.
- source_word: בְּצִדְקָתוֹ
  choice: sa justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou l’action conforme au droit. Dans ce contexte explicitement judiciaire, « justice » est naturel, tandis que « œuvre juste » préserve en note la possibilité d’insister sur la conduite droite de Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel. « Yahweh » le distingue d’un titre et le restitue directement, sans introduire de particularité confessionnelle.
- issue: Portée de בְּצִדְקָתוֹ dans un contexte de réhabilitation
  choice: sa justice
  alternative: son œuvre juste
  rationale: Le langage de la cause plaidée et du jugement favorise le sens judiciaire, mais le terme hébreu englobe aussi la droiture manifestée dans l’action. La note maintient cette amplitude sémantique.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme judiciaire est rendu par « défende ma cause » et « me rende justice » ; l’image de la sortie vers la lumière est conservée sans explicitation interprétative.
