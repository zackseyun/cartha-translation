source:
  edition: WLC
  text: תִּתֵּ֤ן אֱמֶת֙ לְ/יַֽעֲקֹ֔ב חֶ֖סֶד לְ/אַבְרָהָ֑ם אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבֹתֵ֖י/נוּ מִ֥/ימֵי קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/020.yaml
  text: You will show faithfulness to Jacob and steadfast love to Abraham, which you swore to our fathers from days of old.
translation:
  language: fr
  text: 'Tu montreras ta fidélité à Jacob

    et ton amour constant à Abraham,

    comme tu l’as juré à nos ancêtres

    depuis les temps anciens.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֶת (ʾemet)
  choice: fidélité
  rationale: Dans ce parallèle avec חֶסֶד et dans le contexte de l’alliance, le terme désigne la fiabilité et la fidélité de Dieu plutôt que la seule vérité propositionnelle.
- source_word: חֶסֶד (ḥesed)
  choice: amour constant
  rationale: Cette expression française courante rend l’amour durable, loyal et engagé du terme hébreu sans lui imposer un vocabulaire confessionnel spécialisé.
- source_word: תִּתֵּן (tittēn)
  choice: tu témoigneras
  rationale: Littéralement « tu donneras », mais ici le français naturel exprime le fait de manifester ou d’accorder fidélité et amour; « témoigneras » conserve l’action concrète envers Jacob et Abraham.
- source_word: לַאֲבֹתֵינוּ (laʾăḇōtênû)
  choice: à nos ancêtres
  rationale: « Ancêtres » communique clairement le sens généalogique de אבות en français moderne international, sans restreindre le référent aux seuls pères immédiats.
- source_word: מִימֵי קֶדֶם (mîmê qedem)
  choice: depuis les temps anciens
  rationale: Rend l’ancienneté lointaine exprimée littéralement par « depuis les jours d’autrefois » dans un français actuel et digne.
theological_decisions:
- issue: Rapport entre Jacob, Abraham et les promesses de l’alliance
  choice: Conserver les deux noms propres et le parallélisme sans expliciter s’ils désignent les patriarches, leurs descendants ou les deux.
  alternative: Traduire interprétativement par « au peuple de Jacob » et « aux descendants d’Abraham ».
  rationale: L’hébreu laisse fonctionner les noms patriarcaux avec leur portée personnelle et collective; l’explicitation réduirait cette richesse.
- issue: Portée de אֲשֶׁר sur la fidélité et l’amour constant
  choice: « comme tu l’as juré », renvoyant globalement à l’engagement divin exprimé dans les deux lignes précédentes.
  alternative: « que tu as jurés », faisant grammaticalement de la fidélité et de l’amour les objets directs et pluriels du serment.
  rationale: אֲשֶׁר peut introduire ici le rapport au serment sans imposer un accord nominal précis; la formulation choisie conserve la portée globale et naturelle de l’hébreu.
translation_notes:
  register: Français moderne international, poétique mais immédiatement compréhensible. Le parallélisme hébreu est conservé sur quatre lignes; le tutoiement correspond à l’adresse directe à Dieu dans le contexte.
