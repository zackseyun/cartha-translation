  text: וַ/אֲנִי֙ בַּ/יהוָ֣ה אֲצַפֶּ֔ה אוֹחִ֖ילָה לֵ/אלֹהֵ֣י יִשְׁעִ֑/י יִשְׁמָעֵ֖/נִי אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/007.yaml
  text: But as for me[a], I will watch for Yahweh; I will wait for the God of my salvation. My God will hear me.
translation:
  language: fr
  text: Mais moi, je regarderai vers Yahweh ; j’attendrai[a] le Dieu de mon salut. Mon Dieu m’entendra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je mettrai mon espérance dans le Dieu de mon salut ». Le verbe hébreu peut désigner une attente pleine d’espoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction et le pronom indépendant marquent un contraste appuyé avec la corruption et le manque de fiabilité décrits auparavant.
- source_word: בַּיהוָה אֲצַפֶּה
  choice: je guetterai Yahweh
  rationale: Le verbe צפה évoque le fait d’observer dans l’attente. « Guetter » conserve cette image vive et se construit naturellement avec la personne attendue.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אוֹחִילָה
  choice: j’attendrai
  rationale: Le verbe יחל peut exprimer l’attente confiante ou l’espérance. « J’attendrai » s’intègre au parallélisme sans effacer la nuance d’espoir, signalée en note.
- source_word: לֵאלֹהֵי יִשְׁעִי
  choice: le Dieu de mon salut
  rationale: Cette formulation conserve la structure du groupe construit hébreu, sa portée théologique et sa force poétique, tout en restant idiomatique en français.
- source_word: יִשְׁמָעֵנִי
  choice: m’entendra
  rationale: שׁמע signifie fondamentalement entendre ou écouter. « M’entendra » reste direct et n’explicite pas abusivement l’idée possible d’une réponse favorable.
- source_word: אֱלֹהָי
  choice: Mon Dieu
  rationale: Le possessif exprime la confession personnelle ; l’ordre français naturel place ce groupe au début de la proposition finale.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Expression de la nuance d’espérance dans אוֹחִילָה
  choice: j’attendrai, avec une note
  alternative: je mettrai mon espérance ; j’espérerai
  rationale: Le verbe peut désigner à la fois l’attente et l’espérance. Le texte principal garde l’attente, tandis que la note préserve l’autre nuance sans trancher artificiellement.
translation_notes:
  register: Français international moderne, sobre et poétique. « Guetter » maintient l’image concrète du veilleur, tandis que « j’attendrai » conserve le parallélisme et la confiance exprimée par le contexte.
