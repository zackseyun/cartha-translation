source:
  edition: WLC
  text: מִי אֵ֣ל כָּמ֗וֹ/ךָ נֹשֵׂ֤א עָוֺן֙ וְ/עֹבֵ֣ר עַל פֶּ֔שַׁע לִ/שְׁאֵרִ֖ית נַחֲלָת֑/וֹ לֹא הֶחֱזִ֤יק לָ/עַד֙ אַפּ֔/וֹ כִּֽי חָפֵ֥ץ חֶ֖סֶד הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/018.yaml
  text: Who is a God like you[a], bearing iniquity and passing over transgression for the remnant of his inheritance? He does not retain his anger forever[b], because he delights in steadfast love.
translation:
  language: fr
  text: Quel Dieu est comme toi, qui enlève la faute et passe par-dessus la transgression en faveur du reste de son héritage ? Il ne garde pas sa colère pour toujours, car il prend plaisir à l’amour fidèle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « amour fidèle » peut aussi être rendue par « bonté », « miséricorde » ou « amour de l’alliance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵל כָּמוֹךָ
  choice: Qui est un Dieu comme toi
  rationale: La question rhétorique exprime l’incomparabilité de Dieu et fait probablement écho au nom de Michée. L’article indéfini convient au sens prédicatif de אֵל en français.
- source_word: נֹשֵׂא עָוֹן
  choice: qui enlève la faute
  rationale: נשׂא signifie littéralement porter, mais, dans cet idiome, évoque le fait d’ôter ou de pardonner la faute. « Enlève » conserve l’image du retrait tout en restant naturel en français.
- source_word: עָוֹן
  choice: la faute
  rationale: עָוֹן peut désigner la faute aussi bien que la culpabilité qui en découle. « Faute » reste clair et se distingue du terme suivant.
- source_word: וְעֹבֵר עַל פֶּשַׁע
  choice: et passe sur la révolte
  rationale: La formulation conserve l’image hébraïque de passer par-dessus une offense, tout en rendant פֶּשַׁע par « révolte » afin d’en préserver la nuance de rupture délibérée.
- source_word: לִשְׁאֵרִית נַחֲלָתוֹ
  choice: du reste de son héritage
  rationale: Le contexte permet de rattacher le groupe aux fautes que Dieu pardonne chez les bénéficiaires. « Reste » conserve le terme prophétique important, et « héritage » le langage d’appartenance à Dieu.
- source_word: לֹא הֶחֱזִיק לָעַד אַפּוֹ
  choice: Il ne garde pas sa colère pour toujours
  rationale: « Garder » rend naturellement l’idée de retenir ou maintenir la colère, sans reproduire littéralement l’idiome corporel de אַף.
- source_word: כִּי חָפֵץ חֶסֶד הוּא
  choice: car il prend plaisir à l’amour fidèle
  rationale: חָפֵץ exprime le plaisir ou la complaisance. « Amour fidèle » rend ensemble les dimensions de bonté, de loyauté et d’engagement relationnel de חֶסֶד.
theological_decisions:
- issue: Sens de חֶסֶד
  choice: l’amour fidèle
  alternative: la bonté ; la miséricorde ; l’amour de l’alliance
  rationale: « Amour fidèle » préserve la richesse relationnelle et la loyauté durable du terme sans limiter celui-ci à la seule compassion ni expliciter excessivement la notion d’alliance.
- issue: Distinction entre עָוֹן et פֶּשַׁע
  choice: la faute ... la révolte
  alternative: le péché ... la transgression ; la culpabilité ... la rébellion
  rationale: Deux termes distincts sont maintenus. « Révolte » fait ressortir la nuance plus volontaire de פֶּשַׁע sans imposer une distinction doctrinale rigide.
- issue: Image de נשׂא עון
  choice: enlève la faute
  alternative: porte la faute ; pardonne la faute
  rationale: Le choix rend la fonction idiomatique de pardon tout en conservant une trace de l’image d’une faute ôtée. Il évite que « porte » soit compris comme une affirmation précise sur le mécanisme de l’expiation dans ce seul verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe poétique et la question rhétorique sont conservées, avec une formulation naturelle. Le seul marqueur de note [a] figure bien dans le texte principal.
