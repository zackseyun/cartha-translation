revisions:
- from: Qui est un Dieu comme toi, qui enlève la faute et passe sur la révolte du reste de son héritage ? Il ne garde pas sa colère pour toujours, car il prend plaisir à l’amour fidèle.[a]
  to: Quel Dieu est comme toi, qui enlève la faute et passe par-dessus la transgression en faveur du reste de son héritage ? Il ne garde pas sa colère pour toujours, car il prend plaisir à l’amour fidèle.[a]
  rationale: La révision rend la question initiale plus idiomatique, clarifie que le « reste » est bénéficiaire du pardon et remplace une expression française ambiguë par une formulation qui conserve l’image hébraïque de « passer par-dessus » une transgression. Elle préserve le sens, le registre et la note lexicale du projet.
