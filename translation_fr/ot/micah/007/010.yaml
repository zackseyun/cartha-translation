base_translation:
  language: en
  yaml_path: translation/ot/micah/007/010.yaml
  text: Then my enemy will see[a], and shame will cover her—the one who said to me, “Where is Yahweh your God?” My eyes will look on her[b]; now she will be trampled down like mud in the streets.
translation:
  language: fr
  text: 'Mon ennemie le verra, et la honte la couvrira,

    elle qui me disait :

    « Où est Yahweh, ton Dieu ? »

    Mes yeux la verront.

    À présent, elle sera piétinée

    comme la boue des rues.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתֵרֶא אֹיַבְתִּי
  choice: Mon ennemie le verra
  rationale: Le verbe à l’inaccompli poursuit la perspective future du contexte. Le pronom « le » reprend naturellement en français l’intervention et la délivrance évoquées au verset précédent, tandis que « ennemie » conserve le féminin grammatical marqué dans l’hébreu.
- source_word: וּתְכַסֶּהָ בוּשָׁה
  choice: et la honte la couvrira
  rationale: La formulation garde l’image hébraïque de la honte qui enveloppe l’ennemie, sans la réduire à un simple sentiment intérieur.
- source_word: הָאֹמְרָה אֵלַי
  choice: elle qui me disait
  rationale: Le participe féminin identifie l’ennemie par sa raillerie. L’imparfait français convient à une parole hostile répétée ou caractéristique sans exclure une occasion précise.
- source_word: אַיּוֹ יְהוָה אֱלֹהָיִךְ
  choice: Où est Yahweh, ton Dieu ?
  rationale: La question conserve la force de la provocation. Le nom divin יהוה est translittéré « Yahweh », et le féminin de l’interlocutrice est porté en français par le contexte plutôt que par le possessif.
- source_word: עֵינַי תִּרְאֶינָּה בָּהּ
  choice: Mes yeux la verront
  rationale: La traduction maintient le sujet explicite « mes yeux », qui souligne que la locutrice assistera personnellement au renversement de son ennemie.
- source_word: תִּהְיֶה לְמִרְמָס כְּטִיט חוּצוֹת
  choice: elle sera piétinée comme la boue des rues
  rationale: Cette formulation française naturelle exprime le fait d’être livrée au piétinement et conserve la comparaison humiliante avec la boue foulée dans les rues.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. Sa translittération préserve sa fonction de nom personnel dans la raillerie de l’ennemie.
- issue: Portée du regard de la locutrice sur son ennemie
  choice: Mes yeux la verront
  alternative: Je contemplerai sa chute
  rationale: Le texte affirme que ses yeux verront l’ennemie, mais ne nomme pas explicitement le spectacle contemplé. La traduction évite donc d’ajouter une satisfaction vengeresse ou de préciser indûment l’objet du regard.
translation_notes:
  register: Français international actuel, digne et accessible. La disposition poétique fait ressortir la raillerie puis le renversement. Le féminin « ennemie » rend visibles les accords féminins du texte hébreu, vraisemblablement liés à la personnification de la cité adverse.
