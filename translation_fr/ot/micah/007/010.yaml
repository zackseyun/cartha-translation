  source_fidelity: 'Le texte rend fidèlement la séquence hébraïque : l’ennemie, explicitement féminine, voit ; la honte la couvre ; elle lance la raillerie concernant Yahweh ; la locutrice la voit ; enfin l’ennemie est livrée au piétinement, comparée à la boue des rues. « Le verra » explicite avec retenue l’objet implicite fourni par le contexte immédiat (la délivrance/intervention évoquée au verset précédent) et ne compromet pas le sens du verset.'
  naturalness: Le français est actuel, clair et poétique. « Mon ennemie », « la honte la couvrira », « Mes yeux la verront » et « elle sera piétinée comme la boue des rues » sont naturels dans un registre biblique moderne et accessible. La mise en lignes soutient la progression du texte.
  terminology: « Yahweh » correspond au nom divin יהוה et à la décision terminologique fournie. « Ennemie » conserve utilement le féminin singulier du texte source. Les termes « honte », « Dieu » et « piétinée » sont exacts et ne surinterprètent pas le passage.
