review_pass:
  verdict: revise
  source_fidelity: La lamentation, le parfait résultatif (« je suis devenu »), l’absence de grappe et la figue précoce sont bien rendus. Toutefois, « comme lorsqu’on récolte » et « comme lorsqu’on grappille » transforment les comparaisons nominales hébraïques en circonstances verbales et atténuent l’image décisive d’un paysage dépouillé après la cueillette. Une formulation française fondée sur « après la récolte » rend cette image sans trancher indûment le débat lexical entre récolteurs, récoltes et état post-récolte.
  naturalness: Le français est globalement clair et de registre approprié. « Il n’y a pas une grappe à manger » est plus idiomatique que « il n’y a aucune grappe à manger ». « Que je désire de toute mon âme » est compréhensible, mais « que je désire » est plus naturel et porte suffisamment ici le sens de נפש comme désir/appétit personnel.
  terminology: « Fruits d’été », « vendange », « grappe » et « figue précoce » sont justes et naturels. La note b doit éviter la paraphrase maladroite « un fruit mûri le premier » et donner une équivalence lexicale française exacte, tout en signalant prudemment que le référent est probablement la figue précoce.
  issues:
  - severity: medium
    issue: Les deux comparaisons agricoles sont rendues comme des actions impersonnelles en cours.
    rationale: כאספי קיץ et כעוללות בציר sont des expressions nominales. Dans le contexte, elles évoquent surtout la pénurie qui reste après la récolte/vendange. « Lorsqu’on récolte » peut suggérer que des fruits sont encore normalement disponibles et modifie l’image.
  - severity: low
    issue: La note b formule le littéral de façon peu exacte et peu naturelle.
    rationale: בכורה désigne une primeur ou un fruit précoce ; « un fruit mûri le premier » n’est pas une formulation lexicale française satisfaisante.
