base_translation:
  language: en
  yaml_path: translation/ot/micah/007/001.yaml
  text: 'Woe is me! For I have become like the gatherers of summer fruit[a], like the gleanings of the grape harvest: there is no cluster to eat[b], no first-ripe fig that my soul desires.'
translation:
  language: fr
  text: 'Malheur à moi[a] ! Je suis devenu comme après la récolte des fruits d’été, comme après le grappillage de la vendange : il n’y a pas une grappe à manger, pas une figue précoce que je désire[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Hélas pour moi ! »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une primeur » ou « un fruit précoce » ; il s’agit probablement d’une première figue de la saison, particulièrement appréciée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְלַי לִי
  choice: Malheur à moi !
  rationale: Cette exclamation exprime une lamentation vive et personnelle. « Malheur à moi ! » en conserve la force dans un français actuel et digne.
- source_word: כִּי הָיִיתִי
  choice: Je suis devenu
  rationale: Le parfait de היה peut désigner ici l’entrée dans un état qui se prolonge ; le passé composé français rend à la fois le changement et la situation présente.
- source_word: כְאָסְפֵּי קַיִץ
  choice: comme lorsqu’on récolte les fruits d’été
  rationale: La forme hébraïque évoque la récolte ou ceux qui récoltent les produits d’été. La tournure impersonnelle française conserve cette légère indétermination tout en préparant naturellement l’image de la pénurie après la récolte.
- source_word: כְעֹלְלֹת בָּצִיר
  choice: comme lorsqu’on grappille après les vendanges
  rationale: עֹלְלֹת désigne le grappillage ou ce qui reste à grappiller. La formulation française restitue clairement la recherche des rares raisins laissés après les vendanges.
- source_word: אֵין אֶשְׁכּוֹל לֶאֱכֹל
  choice: il n’y a aucune grappe à manger
  rationale: אֶשְׁכּוֹל désigne ici une grappe, naturellement comprise comme une grappe de raisin grâce au contexte des vendanges.
- source_word: בִּכּוּרָה
  choice: figue précoce
  rationale: Le terme signifie ce qui mûrit en premier et, dans cet emploi, renvoie probablement à la première figue, particulièrement appréciée.
- source_word: אִוְּתָה נַפְשִׁי
  choice: que je désire de toute mon âme
  rationale: נֶפֶשׁ exprime ici le désir profond ou l’appétit de la personne. Cette tournure garde l’image hébraïque sans être obscure en français.
