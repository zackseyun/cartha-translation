id: MIC.7.12
reference: Micah 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: י֥וֹם הוּא֙ וְ/עָדֶ֣י/ךָ יָב֔וֹא לְ/מִנִּ֥י אַשּׁ֖וּר וְ/עָרֵ֣י מָצ֑וֹר וּ/לְ/מִנִּ֤י מָצוֹר֙ וְ/עַד נָהָ֔ר וְ/יָ֥ם מִ/יָּ֖ם וְ/הַ֥ר הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/012.yaml
  text: That day—they will come to you from Assyria and the cities of Egypt[a], and from Egypt to the River, from sea to sea[b], and from mountain to mountain.
translation:
  language: fr
  text: Ce jour-là, on viendra jusqu’à toi depuis l’Assyrie et les villes d’Égypte[a], depuis l’Égypte jusqu’au Fleuve[b], d’une mer à l’autre et d’une montagne à l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu מָצוֹר peut aussi être compris comme « forteresse », « place forte » ou « siège », plutôt que comme un nom désignant l’Égypte.
    reason: lexical_alternative
  - marker: b
    text: « Le Fleuve » désigne probablement l’Euphrate.
    reason: cross_reference
lexical_decisions:
- source_word: י֥וֹם הוּא֙
  choice: Ce jour-là
  rationale: Expression temporelle prophétique rendue de façon naturelle et digne en français moderne.
- source_word: וְעָדֶיךָ יָבוֹא
  choice: on viendra jusqu’à toi
  rationale: Le verbe est morphologiquement singulier, mais le contexte géographique suggère une venue collective. Le pronom indéfini « on » conserve le singulier verbal tout en permettant un sens collectif, et « jusqu’à toi » rend la valeur directionnelle de עַד.
- source_word: לְמִנִּי אַשּׁוּר
  choice: depuis l’Assyrie
  rationale: La locution marque le point d’origine; « Assyrie » est le nom géographique français usuel.
- source_word: וְעָרֵי מָצוֹר
  choice: et les villes d’Égypte
  rationale: Dans ce parallélisme géographique, מָצוֹר est vraisemblablement un nom poétique de l’Égypte. L’autre analyse lexicale est signalée en note.
- source_word: וּלְמִנִּי מָצוֹר
  choice: depuis l’Égypte
  rationale: La reprise de מָצוֹר dans une série de limites géographiques favorise ici encore le sens « Égypte ».
- source_word: וְעַד נָהָר
  choice: jusqu’au Fleuve
  rationale: Dans cet emploi géopolitique absolu, « le Fleuve » désigne probablement l’Euphrate. La traduction conserve toutefois la formulation concise de l’hébreu.
- source_word: וְיָם מִיָּם
  choice: d’une mer à l’autre
  rationale: Formulation française idiomatique qui exprime l’étendue entre deux mers.
- source_word: וְהַר הָהָר
  choice: et d’une montagne à l’autre
  rationale: Rend naturellement la construction elliptique et son parallélisme avec les mers.
theological_decisions:
- issue: Référent du verbe singulier יָבוֹא au sein d’une liste de régions
  choice: Sens collectif rendu par « on viendra jusqu’à toi »
  alternative: « il viendra jusqu’à toi » ou « ils viendront jusqu’à toi »
  rationale: Le singulier hébreu est maintenu grammaticalement sans imposer un individu précis, tandis que le contexte permet de comprendre une multitude venue de plusieurs régions.
- issue: Sens de מָצוֹר dans ce verset
  choice: Nom géographique désignant l’Égypte
  alternative: Nom commun signifiant « forteresse », « place forte » ou « siège »
  rationale: Le parallélisme avec l’Assyrie et le Fleuve favorise une suite de désignations géographiques, mais l’ambiguïté lexicale réelle est conservée en note.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La tournure « on viendra » préserve à la fois le singulier de l’hébreu et sa portée collective probable. Les deux notes sont appelées explicitement dans le corps du verset.
