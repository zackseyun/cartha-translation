revisions:
- from: Le meilleur d’entre eux est comme une ronce, et le plus droit, pire qu’une haie d’épines. Le jour annoncé par tes guetteurs[a], le jour de ton châtiment, est arrivé ; maintenant, ce sera pour eux la confusion.
  to: Le meilleur d’entre eux est comme une ronce ; le plus intègre est pire qu’une haie d’épines. Le jour de tes guetteurs[a], le jour de ton châtiment, est arrivé ; maintenant, ils seront dans la confusion.
  rationale: La révision retire l’interprétation non nécessaire selon laquelle les guetteurs annoncent le jour, améliore deux formulations françaises et corrige la note afin qu’elle reflète précisément les ambiguïtés du texte hébreu. Le sens de jugement de « châtiment » est maintenu, avec son alternative lexicale signalée.
