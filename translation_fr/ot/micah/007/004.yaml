  text: טוֹבָ֣/ם כְּ/חֵ֔דֶק יָשָׁ֖ר מִ/מְּסוּכָ֑ה י֤וֹם מְצַפֶּ֨י/ךָ֙ פְּקֻדָּתְ/ךָ֣ בָ֔אָה עַתָּ֥ה תִהְיֶ֖ה מְבוּכָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/004.yaml
  text: The best of them is like a brier; the upright is worse than a thorn hedge. The day of your watchmen[a], your punishment, has come; now their confusion will be.
translation:
  language: fr
  text: Le meilleur d’entre eux est comme une ronce ; le plus intègre est pire qu’une haie d’épines. Le jour de tes guetteurs[a], le jour de ton châtiment, est arrivé ; maintenant, ils seront dans la confusion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le jour que tes guetteurs attendent » ou « le jour qu’ils annoncent ». Littéralement : « le jour de tes guetteurs ». La relation exacte entre le jour et les guetteurs n’est pas explicitée. Le terme rendu par « châtiment » peut aussi désigner une intervention, une inspection ou une visitation; ici, le contexte évoque un jugement.'
    reason: Préserve l’ambiguïté syntaxique de יוֹם מְצַפֶּיךָ ainsi que le champ sémantique de פְּקֻדָּה, sans imposer l’interprétation « annoncé par ».
lexical_decisions:
- source_word: טוֹבָם
  choice: Le meilleur d’entre eux
  rationale: Le nom adjectival avec suffixe renvoie, dans une comparaison implicite, au meilleur parmi les personnes décrites.
- source_word: כְּחֵדֶק
  choice: comme une ronce
  rationale: חֵדֶק désigne une plante épineuse ; « ronce » conserve l’image concrète de ce qui blesse et accroche.
- source_word: יָשָׁר
  choice: le plus droit
  rationale: L’adjectif substantivé désigne celui qui passe pour moralement droit ; le superlatif relatif convient au parallélisme avec « le meilleur d’entre eux ».
- source_word: מִמְּסוּכָה
  choice: pire qu’une haie d’épines
  rationale: Le מִן exprime ici la comparaison, tandis que מְסוּכָה évoque une clôture ou haie épineuse. « Pire » explicite naturellement en français la valeur négative suggérée.
- source_word: מְצַפֶּיךָ
  choice: tes guetteurs
  rationale: Le terme dérivé de צפה peut désigner ceux qui guettent ou annoncent le jour à venir, vraisemblablement des sentinelles prophétiques. La formulation « le jour annoncé par » rend la relation avec יוֹם intelligible sans identifier dogmatiquement ces personnes.
- source_word: פְּקֻדָּתְךָ
  choice: ton châtiment
  rationale: Dans cet oracle de jugement, פְּקֻדָּה prend naturellement le sens d’une intervention punitive, tout en gardant dans la note son champ sémantique plus large.
- source_word: בָאָה
  choice: est arrivé
  rationale: Le parfait féminin singulier présente comme arrivé le jour composé des expressions coordonnées précédentes.
- source_word: עַתָּה תִהְיֶה מְבוּכָתָם
  choice: maintenant, ce sera pour eux la confusion
  rationale: Cette tournure conserve le nom מְבוּכָה et le futur de היה, tout en restant idiomatique et solennelle en français.
theological_decisions:
- issue: Sens de פְּקֻדָּתְךָ dans l’oracle de jugement
  choice: ton châtiment
  alternative: le jour où Dieu intervient à ton égard / ta visitation
  rationale: Le contexte de corruption collective et de calamité annoncée favorise le sens punitif. Une note préserve toutefois l’idée plus large d’intervention ou d’inspection portée par le terme hébreu.
- issue: Référent et fonction de מְצַפֶּיךָ
  choice: tes guetteurs, compris comme ceux qui annoncent le jour
  alternative: ceux qui te surveillent / le jour où l’on intervient à ton égard
  rationale: La racine צפה signifie guetter ou observer et peut évoquer des sentinelles prophétiques. La traduction évite de fixer leur identité au-delà de ce que le texte permet.
translation_notes:
  register: Français international moderne, naturel et digne. Les images végétales sont concrètes ; la seconde moitié garde la tension et la relative obscurité du texte hébreu sans imposer une identification confessionnelle des guetteurs.
