  text: בֹּנֶ֥ה צִיּ֖וֹן בְּ/דָמִ֑ים וִ/ירוּשָׁלִַ֖ם בְּ/עַוְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/010.yaml
  text: who builds Zion with bloodshed and Jerusalem with injustice[a].
translation:
  language: fr
  text: vous qui bâtissez Sion par le sang versé[a], et Jérusalem par l’injustice !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec des sangs » ; le pluriel hébreu désigne souvent le sang versé ou la culpabilité liée au meurtre.'
    reason: alternative lexicale et explication de l’idiome hébreu
lexical_decisions:
- source_word: בֹּנֶה
  choice: vous qui bâtissez
  rationale: Le participe masculin singulier poursuit l’interpellation des dirigeants au verset précédent. Le pluriel français reprend naturellement le groupe visé dans le contexte, tout en conservant la valeur descriptive du participe.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בְּדָמִים
  choice: au prix du sang
  rationale: Le pluriel hébreu דָּמִים désigne souvent le sang versé ou la culpabilité liée au meurtre. Cette tournure française exprime clairement que l’édification repose sur la violence meurtrière, sans suggérer que le sang serait littéralement un matériau.
- source_word: וִירוּשָׁלִַם
  choice: et Jérusalem
  rationale: Le nom propre est rendu sous sa forme française usuelle et la conjonction est conservée.
- source_word: בְּעַוְלָה
  choice: par l’injustice
  rationale: עַוְלָה désigne l’injustice, le tort ou l’iniquité. « Par l’injustice » convient au contexte de corruption sociale et judiciaire et met en valeur le moyen employé.
theological_decisions:
- issue: Nature de l’accusation prophétique
  choice: Les dirigeants sont accusés d’établir Sion et Jérusalem au moyen de violences meurtrières et de l’injustice.
  alternative: Traduire littéralement « avec du sang », en laissant l’image inexpliquée.
  rationale: Dans ce contexte, le pluriel hébreu « sangs » évoque le sang versé ou la culpabilité de meurtre. « Au prix du sang » préserve la force de l’image tout en évitant une compréhension matérielle trompeuse.
translation_notes:
  register: Français moderne, direct et solennel. L’exclamation rend la vigueur de la dénonciation qui se poursuit depuis le verset précédent. « Bâtissez » conserve la métaphore architecturale, tandis que « au prix du sang » et « par l’injustice » expriment les moyens criminels dénoncés.
