source:
  edition: WLC
  text: שִׁמְעוּ נָ֣א זֹ֗את רָאשֵׁי֙ בֵּ֣ית יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/מֲתַעֲבִ֣ים מִשְׁפָּ֔ט וְ/אֵ֥ת כָּל הַ/יְשָׁרָ֖ה יְעַקֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/009.yaml
  text: 'Hear this[a], please, heads of the house of Jacob and rulers of the house of Israel[b], who detest justice and make crooked all that is straight:'
translation:
  language: fr
  text: 'Écoutez donc ceci, chefs de la maison de Jacob et dirigeants de la maison d’Israël, vous qui détestez la justice et rendez tortueux tout ce qui est droit[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pervertissez tout ce qui est juste ». L’hébreu dit littéralement « rendez tortueux tout ce qui est droit », en opposant ce qui est droit à ce que les dirigeants rendent tortueux.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: Écoutez donc ceci
  rationale: L’impératif pluriel est rendu naturellement par « Écoutez ». Dans ce contexte, נָא marque surtout l’insistance ou l’urgence; « donc » transmet cette nuance sans donner au reproche prophétique une politesse artificielle. זֹאת reste le simple démonstratif « ceci ».
- source_word: רָאשֵׁי בֵּית יַעֲקֹב
  choice: chefs de la maison de Jacob
  rationale: « Chefs » exprime naturellement la fonction dirigeante de רָאשֵׁי en français, tout en conservant « maison de Jacob » et le parallélisme du texte.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: et dirigeants de la maison d’Israël
  rationale: קְצִינֵי désigne ici les détenteurs de l’autorité civile ou judiciaire. « Dirigeants » convient au contexte et évite la coloration principalement militaire que pourrait avoir « commandants ».
- source_word: הַמֲתַעֲבִים מִשְׁפָּט
  choice: vous qui détestez la justice
  rationale: Le participe décrit l’attitude durable des responsables envers le droit. « Détestez » garde la force de תעב, tandis que « justice » exprime le sens judiciaire et social de מִשְׁפָּט.
- source_word: וְאֵת כָּל הַיְשָׁרָה יְעַקֵּשׁוּ
  choice: et rendez tortueux tout ce qui est droit
  rationale: Cette formulation conserve l’opposition imagée entre ce qui est droit et l’action de le rendre tortueux. Elle est plus idiomatique en français que « rendre courbe » tout en restant proche de l’hébreu.
theological_decisions:
- issue: Désignations collectives du peuple de l’alliance
  choice: maison de Jacob ... maison d’Israël
  alternative: peuple de Jacob ... peuple d’Israël
  rationale: Le texte répète בֵּית dans les deux membres. « Maison » préserve le parallélisme, l’identité collective et la formulation source sans ajouter une interprétation.
- issue: Portée de מִשְׁפָּט
  choice: justice
  alternative: jugement / droit
  rationale: Dans cette dénonciation de responsables corrompus, le terme vise l’ordre juste, notamment judiciaire et social. « Justice » garde cette portée sans la limiter à une décision judiciaire particulière.
translation_notes:
  register: Français moderne, international et digne. Le verset conserve le ton direct de l’interpellation prophétique, le parallélisme des titres et l’image droit/tortueux. Le deux-points final signale que l’accusation se poursuit au verset suivant.
