  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אֹמַ֗ר שִׁמְעוּ נָא֙ רָאשֵׁ֣י יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֲ/ל֣וֹא לָ/כֶ֔ם לָ/דַ֖עַת אֶת הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/001.yaml
  text: 'And I said[a], “Hear now, heads of Jacob and rulers of the house of Israel: is it not for you to know justice?”'
translation:
  language: fr
  text: 'Et je dis : « Écoutez donc, chefs de Jacob et dirigeants de la maison d’Israël ! N’est-ce pas à vous de connaître la justice[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le droit » ou « le jugement ». Le mot hébreu peut désigner la justice, une décision judiciaire ou ce qui est juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Et je dis
  rationale: Le waw consécutif fait progresser le discours. « Et je dis » conserve le lien narratif sans imposer une succession temporelle plus forte avec « alors ».
- source_word: שִׁמְעוּ נָא
  choice: Écoutez donc
  rationale: L’impératif appelle à prêter attention, et נָא renforce ici l’exhortation. « donc » rend naturellement cette insistance dans une adresse prophétique.
- source_word: רָאשֵׁי יַעֲקֹב
  choice: chefs de Jacob
  rationale: En français, « chefs » désigne naturellement les responsables tout en restant proche de l’image hébraïque de la tête; « Jacob » conserve le nom collectif et historique du peuple.
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: et dirigeants de la maison d’Israël
  rationale: קְצִינֵי désigne des personnes investies d’autorité. « dirigeants » convient au contexte civique et judiciaire, tandis que « maison d’Israël » préserve la désignation collective biblique.
- source_word: הֲלוֹא לָכֶם
  choice: N’est-ce pas à vous
  rationale: La question appelle une réponse affirmative et présente la connaissance du droit comme une responsabilité propre aux dirigeants.
- source_word: לָדַעַת
  choice: de connaître
  rationale: Cette formulation conserve le sens fondamental de ידע tout en laissant entendre une connaissance pratique, attendue de ceux qui gouvernent.
- source_word: הַמִּשְׁפָּט
  choice: la justice
  rationale: Dans ce reproche adressé aux responsables, « la justice » exprime bien la dimension éthique et judiciaire du terme, sans exclure l’idée de jugement ou de droit.
theological_decisions:
- issue: Sens de מִשְׁפָּט dans le contexte de l’autorité publique et judiciaire
  choice: la justice
  alternative: le jugement; le droit
  rationale: Le prophète reproche aux dirigeants de manquer à leur responsabilité de reconnaître et d’appliquer ce qui est juste. « La justice » rend clairement cette portée publique, éthique et judiciaire, tandis qu’une note préserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme entre « chefs » et « dirigeants » est maintenu, ainsi que la désignation biblique « maison d’Israël ». La ponctuation souligne la vigueur de l’interpellation prophétique.
