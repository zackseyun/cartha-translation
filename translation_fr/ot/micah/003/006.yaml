base_translation:
  language: en
  yaml_path: translation/ot/micah/003/006.yaml
  text: Therefore it will be night for you[a], without vision, and darkness for you, without divination; the sun will go down on the prophets[b], and the day will grow dark over them.
translation:
  language: fr
  text: C’est pourquoi, pour vous, ce sera la nuit, sans vision[a] ; ce sera l’obscurité, sans divination ; le soleil se couchera sur les prophètes[b], et le jour s’assombrira sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement, « de vision » et « de divination ». La préposition hébraïque exprime probablement ici la privation : « sans vision » et « sans divination ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le soleil viendra sur les prophètes » ; avec le soleil pour sujet, l’expression signifie ici qu’il se couchera sur eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement la conséquence judiciaire de l’accusation précédente et conserve l’enchaînement logique du discours prophétique.
- source_word: לַיְלָה לָכֶם
  choice: pour vous, ce sera la nuit
  rationale: La proposition nominale hébraïque reçoit une valeur future selon le contexte. Cette formulation garde l’image de la nuit comme état de jugement destiné aux prophètes.
- source_word: מֵחָזוֹן
  choice: sans vision
  rationale: 'La préposition מִן a vraisemblablement ici un sens privatif : les prophètes seront privés de vision. La note conserve toutefois la formulation plus littérale possible.'
- source_word: וְחָשְׁכָה לָכֶם
  choice: et les ténèbres
  rationale: Le verbe חָשַׁךְ exprime l’obscurcissement. Le groupe nominal français maintient le parallélisme poétique avec « la nuit » tout en évoquant un état de profonde obscurité.
- source_word: מִקְּסֹם
  choice: sans divination
  rationale: Comme dans le membre parallèle, מִן est compris au sens privatif. « Divination » est le terme français courant et précis pour l’activité désignée par קסם.
- source_word: וּבָאָה הַשֶּׁמֶשׁ עַל הַנְּבִיאִים
  choice: le soleil se couchera sur les prophètes
  rationale: Bien que בוא signifie littéralement « venir », son emploi avec le soleil évoque idiomatiquement son coucher. La traduction préserve l’image de la lumière prophétique qui disparaît.
- source_word: וְקָדַר עֲלֵיהֶם הַיּוֹם
  choice: et le jour s’assombrira sur eux
  rationale: קדר dénote l’obscurcissement et la sombre tristesse. « S’assombrira » rend le mouvement vers les ténèbres sans transformer l’image en événement astronomique explicite.
theological_decisions:
- issue: Nature des images de jugement
  choice: Le verset décrit le jugement des prophètes corrompus comme une privation de vision et de divination, au moyen des images de la nuit, des ténèbres, du coucher du soleil et du jour qui s’assombrit.
  alternative: Y voir uniquement une disgrâce sociale ou un événement astronomique littéral.
  rationale: Le contexte immédiat porte sur les prophètes et leurs révélations prétendues. Les images d’obscurité signalent donc principalement la fin de leur accès revendiqué à la révélation sous le jugement de Dieu, sans exclure toute portée plus large de l’image.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme parallèle de l’hébreu est conservé autant que possible. Les choix « vision » et « divination » maintiennent la distinction lexicale du texte source, tandis que les notes signalent les formulations plus littérales et l’ambiguïté de la préposition.
