base_translation:
  language: en
  yaml_path: translation/ot/micah/003/005.yaml
  text: Thus says Yahweh concerning the prophets who lead my people astray[a], who bite with their teeth and cry, “Peace,” but against anyone who does not put something into their mouths[d][c][b], they consecrate war.
translation:
  language: fr
  text: 'Ainsi parle Yahweh au sujet des prophètes qui égarent mon peuple : ils mordent avec leurs dents et proclament : « Paix ! »[a] ; mais ils consacrent la guerre contre celui qui ne leur met rien dans la bouche[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « qui mordent avec leurs dents et proclament : “Paix !” » La juxtaposition avec la suite suggère probablement qu’ils annoncent le bien-être lorsqu’on les nourrit ou les paie.'
    reason: lexical_alternative
  - marker: b
    text: '« Consacrent la guerre » emploie le vocabulaire de la mise à part rituelle. Ou : « préparent une guerre contre lui »; l’expression peut aussi évoquer la proclamation d’une guerre sacrée.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin hébreu, qui le distingue d’un titre comme « le Seigneur ».
- source_word: עַל הַנְּבִיאִים
  choice: au sujet des prophètes
  rationale: עַל introduit ici les personnes visées par l’oracle; « au sujet de » respecte la syntaxe sans atténuer la condamnation exprimée ensuite.
- source_word: הַמַּתְעִים אֶת עַמִּי
  choice: qui égarent mon peuple
  rationale: Le participe hiphil de תעה exprime le fait de faire errer ou d’égarer; la formulation française est directe et naturelle.
- source_word: הַנֹּשְׁכִים בְּשִׁנֵּיהֶם
  choice: qui mordent à belles dents
  rationale: Cette expression conserve l’image concrète des dents tout en suggérant naturellement en français qu’ils mangent avidement.
- source_word: וְקָרְאוּ שָׁלוֹם
  choice: 'et proclament : « Paix ! »'
  rationale: 'קרא peut signifier appeler ou proclamer; « Paix » garde la portée large de שָׁלוֹם: bien-être, sécurité et prospérité.'
- source_word: וַאֲשֶׁר לֹא יִתֵּן עַל פִּיהֶם
  choice: quand ils ont quelque chose à se mettre sous la dent ... celui qui ne leur met rien dans la bouche
  rationale: La première formulation explicite le lien probable entre leur repas ou rémunération et leur annonce favorable; la seconde conserve de près l’image hébraïque dans la clause négative.
- source_word: וְקִדְּשׁוּ עָלָיו מִלְחָמָה
  choice: consacrent la guerre contre celui
  rationale: Le piel de קדשׁ emploie un vocabulaire cultuel pour la préparation d’une guerre. « Consacrent la guerre » préserve cette expression frappante plutôt que de la réduire à une simple hostilité.
theological_decisions:
- issue: Lien entre la nourriture reçue et la proclamation de paix
  choice: Rendre explicite par « quand ils ont quelque chose à se mettre sous la dent » le conditionnement implicite de l’annonce favorable.
  alternative: 'Conserver uniquement la coordination littérale: « qui mordent de leurs dents et proclament: “Paix!” »'
  rationale: Le parallélisme avec celui qui ne met rien dans leur bouche indique que les prophètes annoncent le bien-être lorsqu’ils sont nourris ou payés. La note signale toutefois la forme littérale afin de ne pas masquer l’image ni son ambiguïté.
- issue: Portée cultuelle de « consacrer la guerre »
  choice: Conserver « consacrent la guerre ».
  alternative: « déclarent la guerre » ou « préparent une guerre sainte »
  rationale: La traduction retenue maintient le langage cultuel du texte sans ajouter explicitement « sainte », mot absent du substantif hébreu, ni banaliser l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. Les images alimentaires et le vocabulaire cultuel sont maintenus, avec une légère explicitation dans le corps du verset et des précisions littérales en notes.
