revisions:
- from: Alors ils crieront vers Yahvé[a], mais il ne leur répondra pas. Il leur cachera son visage en ce temps-là, parce qu’ils ont fait le mal par leurs agissements.[b]
  to: Alors ils crieront vers Yahvé[a], mais il ne leur répondra pas ; il leur cachera son visage en ce temps-là, parce qu’ils ont commis de mauvaises actions.[b]
  rationale: La révision remplace une expression française maladroite par « ont commis de mauvaises actions », qui conserve la responsabilité active et la référence explicite à leurs actes. L’idiome du visage caché, le futur prophétique et la nuance causale principale sont préservés. La note maintient, sans la privilégier, une formulation plus proche de la construction hébraïque ainsi que la nuance possible de correspondance de כַּאֲשֶׁר.
