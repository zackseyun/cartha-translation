source:
  edition: WLC
  text: אָ֚ז יִזְעֲק֣וּ אֶל יְהוָ֔ה וְ/לֹ֥א יַעֲנֶ֖ה אוֹתָ֑/ם וְ/יַסְתֵּ֨ר פָּנָ֤י/ו מֵ/הֶם֙ בָּ/עֵ֣ת הַ/הִ֔יא כַּ/אֲשֶׁ֥ר הֵרֵ֖עוּ מַעַלְלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/004.yaml
  text: Then they will cry out to Yahweh[a], but he will not answer them; he will hide his face from them at that time, because they made their deeds evil.
translation:
  language: fr
  text: Alors ils crieront vers Yahvé[a], mais il ne leur répondra pas ; il leur cachera son visage en ce temps-là, parce qu’ils ont commis de mauvaises actions.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: divine_name
  - marker: b
    text: 'Ou : « parce qu’ils ont rendu leurs actes mauvais ». La particule peut aussi souligner la correspondance entre leur conduite et le jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: L’adverbe introduit la conséquence future de l’accusation précédente ; « Alors » conserve naturellement cette progression.
- source_word: יִזְעֲקוּ
  choice: ils crieront
  rationale: זעק désigne un appel pressant lancé dans la détresse ; « crieront » en garde l’intensité.
- source_word: אֶל יְהוָה
  choice: vers Yahvé
  rationale: La préposition אֶל marque la direction de l’appel. « Yahvé » représente le nom divin יְהוָה plutôt que de le remplacer silencieusement par un titre.
- source_word: וְלֹא יַעֲנֶה אוֹתָם
  choice: mais il ne leur répondra pas
  rationale: 'Le « mais » exprime en français la valeur adversative contextuelle de וְ : leur appel restera sans réponse.'
- source_word: וְיַסְתֵּר פָּנָיו מֵהֶם
  choice: Il leur cachera son visage
  rationale: La formulation conserve l’image biblique du visage divin caché, qui évoque le retrait de l’attention ou de la faveur de Dieu sans la réduire à une explication.
- source_word: בָּעֵת הַהִיא
  choice: en ce temps-là
  rationale: Expression temporelle française naturelle qui situe le jugement annoncé.
- source_word: כַּאֲשֶׁר
  choice: parce que
  rationale: Dans ce contexte, la particule introduit vraisemblablement le motif du jugement ; sa possible nuance de correspondance est signalée en note.
- source_word: הֵרֵעוּ מַעַלְלֵיהֶם
  choice: ils ont fait le mal par leurs agissements
  rationale: Cette formulation française naturelle conserve la culpabilité active exprimée par הֵרֵעוּ ainsi que la mention explicite de leurs actes, מַעַלְלֵיהֶם.
theological_decisions:
- issue: Image anthropomorphique du retrait divin
  choice: Conserver « Il leur cachera son visage »
  alternative: Il se détournera d’eux / il leur retirera sa faveur
  rationale: L’image hébraïque porte une forte valeur relationnelle et judiciaire. La conserver maintient la texture théologique du texte sans imposer une paraphrase interprétative.
- issue: Rapport entre leur conduite et le jugement
  choice: « parce qu’ils ont fait le mal par leurs agissements »
  alternative: « comme ils ont rendu mauvais leurs actes »
  rationale: Le texte peut mettre l’accent soit sur la cause du jugement, soit sur sa correspondance avec leur conduite. Le corps du texte retient le sens causal le plus naturel, tandis que la note préserve l’autre nuance possible.
translation_notes:
  register: Français international actuel, sobre et digne. Le futur prophétique, l’intensité de l’appel au secours et l’image du visage caché sont maintenus. La dernière proposition privilégie une expression idiomatique tout en conservant en note la formulation plus littérale et la nuance comparative possible.
