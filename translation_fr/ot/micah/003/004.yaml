    issue: « parce qu’ils ont fait le mal par leurs agissements »
    rationale: La locution « faire le mal par ses agissements » est lourde et redondante en français. Elle ne rend pas naturellement la formulation hébraïque הֵרֵעוּ מַעַלְלֵיהֶם, qui qualifie leur conduite mauvaise tout en maintenant leur responsabilité active.
  - severity: low
    issue: Formulation de la note b
    rationale: « comme ils ont rendu mauvais leurs actes » est grammaticalement possible mais peu idiomatique en français moderne. Une note doit préserver l’alternative textuelle sans introduire une formulation inutilement opaque.
