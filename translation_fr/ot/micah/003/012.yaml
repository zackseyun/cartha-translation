  to: C’est pourquoi, à cause de vous, Sion sera labourée comme un champ, Jérusalem deviendra un amas de ruines, et la montagne de la Maison[a] deviendra des hauteurs boisées[b].
  rationale: La révision se limite à une amélioration sûre de la restitution et de la fluidité de לְבָמוֹת יָעַר, ainsi qu’à la formulation de sa note. Elle conserve l’ambiguïté possible entre une image topographique de hauteurs forestières et le sens traditionnel de « hauts lieux », sans imposer une interprétation cultuelle.
