  text: לָ/כֵן֙ בִּ/גְלַלְ/כֶ֔ם צִיּ֖וֹן שָׂדֶ֣ה תֵֽחָרֵ֑שׁ וִ/ירוּשָׁלִַ֨ם֙ עִיִּ֣ין תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/012.yaml
  text: Therefore[a], because of you, Zion will be plowed like a field, and Jerusalem will become ruins[b], and the mountain of the house will become wooded heights.
translation:
  language: fr
  text: C’est pourquoi, à cause de vous, Sion sera labourée comme un champ, Jérusalem deviendra un amas de ruines, et la montagne de la Maison[a] deviendra des hauteurs boisées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le mont du Temple » ou « la montagne du Temple ». Littéralement : « la montagne de la Maison ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « des hauteurs de forêt » ou « des hauts lieux forestiers ». L’hébreu évoque probablement le mont du Temple redevenu sauvage et envahi par la végétation.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du péché des dirigeants dénoncé dans le contexte précédent, tout en conservant la force du jugement prophétique.
- source_word: בִּגְלַלְכֶם
  choice: à cause de vous
  rationale: Rend directement la cause et impute sans atténuation la responsabilité aux personnes interpellées.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: שָׂדֶה תֵחָרֵשׁ
  choice: sera labourée comme un champ
  rationale: Reproduit l’image agricole et la forme passive du verbe, qui dépeignent Sion réduite à un terrain que l’on laboure.
- source_word: וִירוּשָׁלִַם עִיִּין תִּהְיֶה
  choice: Jérusalem deviendra un amas de ruines
  rationale: Exprime en français naturel la transformation annoncée; « amas de ruines » conserve l’image concrète d’une ville détruite.
- source_word: וְהַר הַבַּיִת
  choice: la montagne de la Maison
  rationale: Suit de près l’expression hébraïque « la montagne de la maison ». La majuscule à « Maison » indique discrètement qu’il s’agit du Temple, sans remplacer dans le texte l’expression source par une explicitation.
- source_word: לְבָמוֹת יָעַר
  choice: des hauteurs couvertes de forêt
  rationale: Rend l’image topographique d’un lieu redevenu sauvage et boisé. Cette formulation française reste naturelle tout en conservant le pluriel de בָּמוֹת et le nom יַעַר, « forêt ».
theological_decisions:
- issue: Faut-il expliciter הַבַּיִת par « Temple » dans le texte principal ?
  choice: Conserver « la Maison » dans « la montagne de la Maison »
  alternative: « le mont du Temple » ou « la montagne du Temple »
  rationale: L’hébreu dit littéralement « la maison », désignation courante du Temple. La formulation retenue préserve la diction prophétique et son écho théologique, tandis que la note donne le référent explicite.
- issue: Faut-il donner à בָּמוֹת le sens cultuel de « hauts lieux » ?
  choice: Employer « hauteurs » dans une image de reboisement sauvage
  alternative: « hauts lieux d’une forêt » ou « hauteurs boisées »
  rationale: Dans ce contexte de destruction, יַעַר (« forêt ») oriente probablement l’expression vers la topographie et l’envahissement par la végétation plutôt que vers des sanctuaires cultuels. La note conserve néanmoins l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Les propositions parallèles gardent la progression cumulative du jugement. La répétition de « deviendra » explicite en français le verbe sous-entendu dans la dernière proposition hébraïque. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
