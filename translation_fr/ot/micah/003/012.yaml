  source_fidelity: Le texte rend fidèlement la chaîne de conséquences et la responsabilité directe exprimée par לָכֵן et בִּגְלַלְכֶם. « Sion sera labourée comme un champ » et « Jérusalem deviendra un amas de ruines » correspondent bien à l’hébreu. Pour לְבָמוֹת יָעַר, « hauteurs boisées » restitue plus directement l’image condensée de « hauteurs de forêt / hauteurs forestières » que « hauteurs couvertes de forêt ».
  naturalness: La formulation est moderne et digne. « Des hauteurs boisées » est plus idiomatique et plus concis que « des hauteurs couvertes de forêt », tout en gardant le pluriel de בָּמוֹת.
  terminology: « Sion », « Jérusalem » et « la montagne de la Maison » préservent la terminologie et la diction du texte. La majuscule à « Maison » signale de façon acceptable le référent cultuel sans substituer « Temple » au terme hébreu dans le texte principal. Les notes proposent les explicitations et alternatives sans les imposer.
