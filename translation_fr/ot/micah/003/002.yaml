  text: שֹׂ֥נְאֵי ט֖וֹב וְ/אֹ֣הֲבֵי רעה גֹּזְלֵ֤י עוֹרָ/ם֙ מֵֽ/עֲלֵי/הֶ֔ם וּ/שְׁאֵרָ֖/ם מֵ/עַ֥ל עַצְמוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/002.yaml
  text: you who hate good and love evil[a], who strip their skin from off them and their flesh from off their bones—
translation:
  language: fr
  text: vous qui détestez le bien et aimez le mal, qui leur arrachez la peau, et la chair de dessus leurs os —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׂנְאֵי טוֹב
  choice: vous qui détestez le bien
  rationale: Le participe qal pluriel poursuit l’interpellation du verset précédent. « Détester le bien » exprime naturellement en français moderne l’opposition morale voulue.
- source_word: וְאֹהֲבֵי רעה
  choice: et aimez le mal
  rationale: La construction parallèle est conservée, de même que le contraste concis entre « le bien » et « le mal ».
- source_word: גֹּזְלֵי
  choice: qui leur arrachez
  rationale: Dans cette métaphore de dépeçage, le verbe désigne un enlèvement violent. « Arrachez » en restitue la force sans réduire l’image à une exploitation abstraite.
- source_word: עוֹרָם מֵעֲלֵיהֶם
  choice: la peau
  rationale: Le pronom objet indirect « leur » dans « leur arrachez » rend la relation possessive et l’idée d’enlever la peau qui est sur eux, avec une formulation française fluide.
- source_word: וּשְׁאֵרָם מֵעַל עַצְמוֹתָם
  choice: et la chair de dessus les os
  rationale: « Chair » est le sens anatomique approprié en parallèle avec la peau et les os. « De dessus les os » préserve l’image spatiale et brutale du texte hébreu.
theological_decisions:
- issue: Violence métaphorique décrivant les dirigeants corrompus
  choice: Conserver l’image explicite de la peau arrachée et de la chair retirée des os.
  alternative: Paraphraser par « vous qui exploitez le peuple sans pitié ».
  rationale: Le texte hébreu emploie délibérément une image choquante de dépeçage pour dénoncer une oppression extrême; l’adoucir ferait perdre sa force prophétique.
translation_notes:
  register: Français international moderne, direct et solennel. La répétition antithétique « le bien / le mal » et l’image corporelle crue sont maintenues. Le tiret final indique que la phrase et la métaphore se poursuivent au verset suivant.
