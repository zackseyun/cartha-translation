id: MIC.3.7
reference: Micah 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בֹ֣שׁוּ הַ/חֹזִ֗ים וְ/חָֽפְרוּ֙ הַ/קֹּ֣סְמִ֔ים וְ/עָט֥וּ עַל שָׂפָ֖ם כֻּלָּ֑/ם כִּ֛י אֵ֥ין מַעֲנֵ֖ה אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/007.yaml
  text: The seers will be put to shame[a], and the diviners will be disgraced; all of them will cover their lips, because there is no answer from God.
translation:
  language: fr
  text: Les voyants seront couverts de honte, et les devins seront humiliés. Tous se couvriront les lèvres[a], car aucune réponse ne viendra de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ils se couvriront la lèvre » ; le terme peut désigner la lèvre supérieure ou la moustache. Il s’agit probablement d’un geste de honte, de deuil ou d’impureté.
    reason: Alternative lexicale et portée culturelle incertaine de l’expression hébraïque.
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: seront couverts de honte
  rationale: Le verbe בוש exprime ici la honte résultant du jugement annoncé. Cette tournure française rend naturellement sa dimension publique et résultative.
- source_word: הַחֹזִים
  choice: les voyants
  rationale: חֹזִים désigne des figures qui prétendent recevoir des visions. « Voyants » est concis, établi et distinct du terme général « prophètes ».
- source_word: וְחָפְרוּ
  choice: seront humiliés
  rationale: Dans cet emploi, חפר évoque la honte ou l’humiliation. « Seront humiliés » forme un parallélisme naturel avec la proposition précédente sans effacer la nuance de déshonneur public.
- source_word: הַקֹּסְמִים
  choice: les devins
  rationale: קֹסְמִים désigne ceux qui pratiquent la divination. « Devins » est direct et compréhensible en français moderne.
- source_word: וְעָטוּ עַל שָׂפָם
  choice: se couvriront les lèvres
  rationale: La formulation conserve l’image corporelle de l’hébreu sans décider si le geste signifie précisément la honte, le deuil ou l’impureté. Le détail anatomique incertain est signalé en note.
- source_word: כֻּלָּם
  choice: Tous
  rationale: Le pronom suffixe souligne que chacun des voyants et des devins est concerné. « Tous » maintient cette totalité avec naturel.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la cause de leur humiliation. « Car » convient au registre prophétique tout en restant courant.
- source_word: אֵין מַעֲנֵה אֱלֹהִים
  choice: aucune réponse ne vient de Dieu
  rationale: La proposition nominale indique l’absence de réponse provenant de Dieu. Cette formulation française reste proche du sens tout en étant idiomatique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים a ici un sens singulier et désigne Dieu comme source attendue d’une réponse authentique.
theological_decisions:
- issue: Présenter la dernière proposition comme le silence de Dieu ou comme l’absence de tout oracle valable
  choice: aucune réponse ne vient de Dieu
  alternative: Dieu ne répond pas
  rationale: La formulation retenue préserve la construction nominale et l’ambiguïté entre l’absence de réponse dans cette situation et une affirmation plus directement verbale du silence divin. Elle n’ajoute pas que les oracles sont faux, même si le contexte peut le suggérer.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que l’image hébraïque des lèvres, sans expliciter excessivement le sens rituel ou social du geste.
