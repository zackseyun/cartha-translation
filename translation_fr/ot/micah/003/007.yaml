  - severity: low
    issue: Formulation du littéral en note
    rationale: « se couvriront sur la lèvre » n’est pas une formulation littérale française claire. Une citation française plus lisible peut signaler le singulier de « lèvre » tout en laissant à la note les variantes anatomiques.
