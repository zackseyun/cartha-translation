source:
  edition: WLC
  text: רָאשֶׁ֣י/הָ בְּ/שֹׁ֣חַד יִשְׁפֹּ֗טוּ וְ/כֹהֲנֶ֨י/הָ֙ בִּ/מְחִ֣יר יוֹר֔וּ וּ/נְבִיאֶ֖י/הָ בְּ/כֶ֣סֶף יִקְסֹ֑מוּ וְ/עַל יְהוָה֙ יִשָּׁעֵ֣נוּ לֵ/אמֹ֔ר הֲ/ל֤וֹא יְהוָה֙ בְּ/קִרְבֵּ֔/נוּ לֹֽא תָב֥וֹא עָלֵ֖י/נוּ רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/011.yaml
  text: Her leaders judge for a bribe[a], and her priests teach for a price, and her prophets practice divination for silver; yet they lean on Yahweh, saying[b], “Is not Yahweh in our midst? No disaster will come upon us.”
translation:
  language: fr
  text: 'Ses dirigeants rendent la justice pour un pot-de-vin, ses prêtres enseignent contre paiement et ses prophètes pratiquent la divination pour de l’argent. Pourtant, ils s’appuient sur Yahweh en disant : « Yahweh n’est-il pas au milieu de nous ? Aucun malheur ne nous atteindra. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֶׁיהָ
  choice: ses dirigeants
  rationale: Le pluriel de רֹאשׁ avec suffixe féminin désigne ici les responsables de la ville; « dirigeants » restitue naturellement cette fonction politique.
- source_word: בְּשֹׁחַד יִשְׁפֹּטוּ
  choice: rendent la justice contre un pot-de-vin
  rationale: שֹׁחַד désigne un pot-de-vin, et שׁפט l’exercice du jugement. La tournure française exprime clairement que leurs décisions judiciaires sont achetées.
- source_word: בִּמְחִיר יוֹרוּ
  choice: enseignent contre paiement
  rationale: Le hiphil de ירה désigne l’instruction sacerdotale, tandis que מְחִיר indique le prix exigé. « Contre paiement » garde l’idée de commercialisation sans réduire nécessairement l’activité à un simple salaire.
- source_word: בְּכֶסֶף יִקְסֹמוּ
  choice: pratiquent la divination pour de l’argent
  rationale: קסם renvoie explicitement à la divination. כֶּסֶף signifie littéralement « argent/métal argent » et, dans ce contexte commercial, « argent » est le rendu français naturel.
- source_word: וְעַל־יְהוָה יִשָּׁעֵנוּ
  choice: Pourtant, ils s’appuient sur Yahweh
  rationale: Le niphal de שׁען conserve l’image de prendre appui sur quelqu’un. « Pourtant » rend le contraste ironique entre leur corruption et leur confiance religieuse affichée.
- source_word: הֲלוֹא יְהוָה בְּקִרְבֵּנוּ
  choice: Yahweh n’est-il pas au milieu de nous ?
  rationale: הֲלוֹא introduit une question rhétorique exprimant leur assurance; « au milieu de nous » rend directement בְּקִרְבֵּנוּ.
- source_word: לֹא תָבוֹא עָלֵינוּ רָעָה
  choice: Aucun malheur ne nous arrivera
  rationale: רָעָה peut désigner le mal ou une calamité. Ici, il s’agit du malheur que les locuteurs prétendent ne pas subir; la formulation française conserve cette portée contextuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin personnel. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de רָעָה dans la dernière proposition
  choice: malheur
  alternative: désastre; mal
  rationale: Le contexte annonce une calamité judiciaire, non le mal moral. « Malheur » reste assez large pour préserver la portée du terme sans attribuer à Dieu la production du mal moral.
- issue: Valeur logique de וְ avant וְעַל־יְהוָה
  choice: Pourtant
  alternative: Et
  rationale: La coordination hébraïque juxtapose leur corruption et leur recours affiché à Yahweh. Le contraste est manifeste dans le contexte; « pourtant » le rend sans ajouter une conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des trois groupes corrompus est maintenu, avec une légère variation idiomatique nécessaire en français. « Rendent la justice » précise la fonction judiciaire de שׁפט; « s’appuient » préserve la métaphore hébraïque.
