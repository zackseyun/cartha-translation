  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אוּלָ֗ם אָנֹכִ֞י מָלֵ֤אתִי כֹ֨חַ֙ אֶת ר֣וּחַ יְהוָ֔ה וּ/מִשְׁפָּ֖ט וּ/גְבוּרָ֑ה לְ/הַגִּ֤יד לְ/יַֽעֲקֹב֙ פִּשְׁע֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל חַטָּאתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/008.yaml
  text: But as for me[a], I am filled with power, with the Spirit of Yahweh, and with justice and might[b], to declare to Jacob his transgression and to Israel his sin.
translation:
  language: fr
  text: Mais moi, je suis rempli de puissance, de l’Esprit de Yahweh, de justice et de force[a], pour faire connaître à Jacob sa révolte[b], et à Israël son péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « je suis rempli de puissance par l’Esprit de Yahweh, ainsi que de justice et de force ». La construction hébraïque peut présenter l’Esprit de Yahweh soit comme ce dont le prophète est rempli, soit comme la source de sa puissance.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sa transgression ». Le mot hébreu peut souligner une désobéissance qui constitue une rébellion contre Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם אָנֹכִי
  choice: Mais moi
  rationale: Rend à la fois le contraste marqué avec les prophètes précédents et l’insistance du pronom de première personne, dans un français naturel.
- source_word: מָלֵאתִי
  choice: je suis rempli
  rationale: Exprime l’état présent résultant de l’action accomplie, sans imposer explicitement une valeur passive absente de la forme hébraïque.
- source_word: כֹחַ
  choice: puissance
  rationale: Convient à l’idée d’une capacité reçue pour exercer la mission prophétique.
- source_word: אֶת רוּחַ יְהוָה
  choice: de l’Esprit de Yahweh
  rationale: Comprend la séquence comme un autre contenu de la plénitude du prophète. La majuscule signale qu’il s’agit de l’Esprit de Dieu, et Yahweh transcrit le nom divin.
- source_word: וּמִשְׁפָּט
  choice: de sens de la justice
  rationale: Dans ce contexte prophétique, מִשְׁפָּט désigne vraisemblablement la capacité de discerner et de proclamer ce qui est juste; cette formulation est plus idiomatique que « rempli de justice » tout en conservant ce sens.
- source_word: וּגְבוּרָה
  choice: de force
  rationale: Évoque la vigueur et le courage nécessaires à la dénonciation prophétique, tout en évitant une répétition trop étroite de « puissance ».
- source_word: לְהַגִּיד
  choice: pour dénoncer
  rationale: Le verbe signifie annoncer ou faire connaître; avec pour objets la révolte et le péché du peuple, « dénoncer » communique naturellement la force accusatrice de la proclamation.
- source_word: לְיַעֲקֹב ... וּלְיִשְׂרָאֵל
  choice: à Jacob ... et à Israël
  rationale: Conserve les deux désignations parallèles du peuple sans ajouter « maison de », absent du texte.
- source_word: פִּשְׁעוֹ
  choice: sa révolte
  rationale: פֶּשַׁע désigne souvent une rupture volontaire ou une rébellion contre Dieu; « révolte » en restitue ici la gravité et la dimension de défi.
- source_word: חַטָּאתוֹ
  choice: son péché
  rationale: Équivalent direct et naturel qui maintient le parallélisme avec « sa révolte ».
theological_decisions:
- issue: Rapport syntaxique entre « puissance » et « l’Esprit de Yahweh »
  choice: 'Une série de réalités dont le prophète est rempli : puissance, Esprit de Yahweh, sens de la justice et force.'
  alternative: 'La puissance a pour source ou moyen l’Esprit de Yahweh : « rempli de puissance par l’Esprit de Yahweh, ainsi que de sens de la justice et de force ».'
  rationale: L’ordre hébreu permet de rattacher אֶת רוּחַ יְהוָה au verbe « être rempli » comme élément de contenu, mais la compréhension instrumentale demeure plausible; elle est donc conservée en note plutôt que tranchée silencieusement.
- issue: Nature de רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  alternative: l’esprit de Yahweh
  rationale: Dans un contexte d’habilitation prophétique, l’expression désigne naturellement l’Esprit de Dieu. La capitalisation française indique ce référent sans développer une formulation doctrinale absente du verset.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve dans le corps du texte le nom personnel présent dans l’hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme de la série hébraïque est conservé, tandis que « sens de la justice » et « dénoncer » rendent idiomatiquement la fonction prophétique. Tous les marqueurs de notes figurent dans le texte.
