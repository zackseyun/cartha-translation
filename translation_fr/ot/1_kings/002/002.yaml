  text: I am going the way of all the earth. So be strong[a], and be a man,
translation:
  language: fr
  text: Je m’en vais par le chemin de toute la terre. Sois donc fort et sois un homme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « montre-toi un homme » ou « conduis-toi en homme ». L’expression hébraïque associe le fait d’être un homme à une conduite courageuse et responsable.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Moi, je
  rationale: Le pronom indépendant peut porter une légère insistance. « Moi, je » reste naturel dans cette déclaration solennelle de David.
- source_word: הֹלֵךְ
  choice: m’en vais
  rationale: Le participe qal exprime ici le départ imminent de David vers la mort. « Je m’en vais » conserve à la fois l’aspect progressif et l’euphémisme.
- source_word: בְּדֶרֶךְ
  choice: par le chemin
  rationale: Cette formulation maintient la métaphore hébraïque du chemin suivi, sans remplacer explicitement l’image par « mourir ».
- source_word: כָּל הָאָרֶץ
  choice: de toute la terre
  rationale: Traduction proche de la forme hébraïque, désignant dans cette expression le sort commun des habitants de la terre.
- source_word: וְחָזַקְתָּ
  choice: Sois donc fort
  rationale: La forme verbale coordonnée prend en contexte une valeur exhortative. « Donc » rend le lien logique avec l’annonce du départ de David.
- source_word: וְהָיִיתָ
  choice: et sois
  rationale: Dans l’exhortation, le verbe exprime l’état ou la conduite attendue de Salomon; l’impératif français est naturel et fidèle à la fonction contextuelle.
- source_word: לְאִישׁ
  choice: un homme
  rationale: Le nom masculin s’adresse précisément à Salomon. La traduction conserve l’expression genrée et sa portée de courage et de responsabilité, explicitée en note sans surcharge du texte.
theological_decisions:
- issue: Expression genrée dans l’exhortation
  choice: sois un homme
  alternative: montre-toi un homme ; conduis-toi en homme
  rationale: L’hébreu emploie le nom « homme » dans une parole de père à fils. Le texte principal conserve cette forme et sa tension culturelle, tandis que la note indique qu’elle implique ici courage et sens des responsabilités sans imposer un stéréotype moderne.
translation_notes:
  register: Français international moderne, digne et direct. La métaphore traditionnelle du « chemin de toute la terre » est conservée, car elle demeure intelligible dans le contexte et évite d’expliciter excessivement l’euphémisme de la mort.
