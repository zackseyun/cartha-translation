  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: fr
  text: 'Et voici, tu as auprès de toi Shiméï, fils de Guéra, le Benjamite de Bahourim. Il m’a maudit d’une terrible malédiction le jour où je me suis rendu à Mahanaïm. Mais il est descendu à ma rencontre au Jourdain, et je lui ai juré par Yahweh : « Je ne te ferai pas mourir par l’épée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Si je te fais mourir par l’épée… » Il s’agit d’une formule de serment elliptique, dont l’imprécation est sous-entendue, et qui signifie ici : « Je ne te ferai pas mourir par l’épée. »'
    reason: La note signale la forme conditionnelle littérale de l’hébreu tout en expliquant la valeur négative de cette formule de serment.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: « Voici » conserve la fonction présentative et l’appel à l’attention de l’hébreu, dans un registre français digne sans être archaïque.
- source_word: עִמְּךָ
  choice: tu as auprès de toi
  rationale: Cette tournure naturelle exprime que Shiméï se trouve dans la sphère immédiate de Salomon, tout en conservant le sens de « avec toi ».
- source_word: שִׁמְעִי בֶן־גֵּרָא בֶן־הַיְמִינִי מִבַּחֻרִים
  choice: Shiméï, fils de Guéra, le Benjaminite de Bahourim
  rationale: Les noms suivent les formes françaises usuelles; le gentilé est rendu idiomatiquement et la provenance géographique reste explicite.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: Il m’a maudit d’une terrible malédiction
  rationale: La formulation conserve la construction intensive fondée sur la répétition de la même racine, tandis que « terrible » communique la gravité de נִמְרֶצֶת sans lui imposer une nuance physique.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: le jour où je me rendais à Mahanaïm
  rationale: L’imparfait décrit naturellement le déplacement en cours évoqué par l’expression temporelle hébraïque.
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: il est descendu à ma rencontre au Jourdain
  rationale: La traduction garde le mouvement descendant de יָרַד ainsi que l’idée d’une rencontre intentionnelle.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: je lui ai juré par Yahweh
  rationale: La tournure française restitue directement la formule de serment et transcrit le nom divin.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: Je ne te ferai pas mourir par l’épée
  rationale: Dans ce serment elliptique, אִם introduit une imprécation dont la conséquence est sous-entendue; la formulation négative exprime clairement la force pragmatique de l’engagement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve ici le caractère propre du nom divin sans substituer un titre.
- issue: Interprétation de la formule de serment אִם אֲמִיתְךָ בֶּחָרֶב
  choice: 'Formulation négative explicite : « Je ne te ferai pas mourir par l’épée »'
  alternative: 'Formulation littérale elliptique : « Si je te fais mourir par l’épée… »'
  rationale: L’hébreu omet l’imprécation qui compléterait normalement le serment. Le sens est un engagement solennel à ne pas tuer Shiméï; une note conserve toutefois la forme littérale et son ambiguïté grammaticale apparente.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’enchaînement hébreu sans lourdeur; les noms propres suivent des graphies françaises bibliques courantes. Le marqueur de note est placé sur la formule de serment qu’il explique.
