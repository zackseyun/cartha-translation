id: 1KI.2.23
reference: 1 Kings 2:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: fr
  text: 'Alors le roi Salomon jura par Yahweh[a] en disant : « Que Dieu me fasse cela, et qu’il y ajoute encore, car c’est au prix de sa vie[b] qu’Adonias a prononcé cette parole ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est יהוה (YHWH), traditionnellement rendu par « le Seigneur ».
    reason: divine_name
  - marker: b
    text: 'Littéralement : « avec/contre sa vie ». L’expression signifie qu’Adonias a parlé d’une manière qui met sa vie en jeu ou doit lui coûter la vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: jura
  rationale: Le verbe désigne l’action de prêter serment. « Jura » est concis, naturel et adapté au récit.
- source_word: בַּיהוָה
  choice: par Yahweh
  rationale: La préposition introduit celui par qui le serment est prêté, et le tétragramme est rendu comme un nom propre.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Que Dieu me fasse cela, et qu’il y ajoute encore
  rationale: Cette formulation conserve la structure de la formule hébraïque d’imprécation et son châtiment volontairement non précisé.
- source_word: כִּי
  choice: car
  rationale: Dans ce contexte, la particule introduit le motif affirmé du serment plutôt qu’une condition négative sous-entendue.
- source_word: בְנַפְשׁוֹ
  choice: au prix de sa vie
  rationale: L’expression indique que les paroles d’Adonias mettent sa vie en jeu ou la lui font perdre, tout en conservant la force judiciaire de l’hébreu.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: a prononcé cette parole
  rationale: Cette traduction garde la répétition lexicale et la solennité de l’expression hébraïque sans devenir obscure.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie directement le nom divin. « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction de nom propre.
- issue: Valeur de כִּי dans la formule de serment
  choice: car
  alternative: si
  rationale: La proposition affirme ici la raison de la sentence de Salomon. Une traduction conditionnelle obligerait à fournir une négation absente du texte et rendrait le sens moins transparent.
translation_notes:
  register: Français international moderne, narratif et digne. La formule de serment reste proche de l’hébreu, tandis que l’idiome בְנַפְשׁוֹ est rendu de façon intelligible sans effacer sa portée judiciaire.
