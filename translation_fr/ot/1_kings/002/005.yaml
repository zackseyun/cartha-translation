source:
  edition: WLC
  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: fr
  text: 'Tu sais aussi ce que m’a fait Joab, fils de Tserouya, ce qu’il a fait aux deux chefs des armées d’Israël, à Abner, fils de Ner, et à Amasa, fils de Yéter : il les a tués et a répandu en temps de paix le sang qu’on verse à la guerre[a] ; il a mis ce sang sur la ceinture qu’il portait à la taille et sur les sandales qu’il avait aux pieds[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il a mis le sang de la guerre dans la paix ». L’expression signifie que Joab a commis, en temps de paix, des meurtres propres à la guerre.'
    reason: lexical_alternative
  - marker: b
    text: L’image du sang sur la ceinture et les sandales de Joab évoque probablement la culpabilité attachée à lui à cause de ces meurtres.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: Tu sais aussi
  rationale: Rend l’insistance additive et l’adresse directe à Salomon dans un français naturel.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: ce que m’a fait
  rationale: Conserve le datif défavorable du texte hébreu sans préciser davantage la nature du tort fait à David.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joab, fils de Tserouya
  rationale: Forme française claire de la filiation et translittération moderne du nom hébreu.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: aux deux chefs des armées d’Israël
  rationale: « Chefs » exprime le rang militaire de שָׂרֵי, tandis que le pluriel « armées » reflète צִבְאוֹת.
- source_word: לְאַבְנֵר בֶּן נֵר וְלַעֲמָשָׂא בֶן יֶתֶר
  choice: à Abner, fils de Ner, et à Amasa, fils de Yéter
  rationale: Maintient l’identification appositionnelle des deux victimes et la répétition de la relation syntaxique.
- source_word: וַיַּהַרְגֵם
  choice: il les a tués
  rationale: Traduction directe et non euphémisée du verbe hébreu.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: a répandu en temps de paix le sang qu’on verse à la guerre
  rationale: Exprime clairement l’opposition entre guerre et paix portée par l’idiome hébreu, tout en conservant son image du sang.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ אֲשֶׁר בְּמָתְנָיו וּבְנַעֲלוֹ אֲשֶׁר בְּרַגְלָיו
  choice: il a mis ce sang sur la ceinture qu’il portait à la taille et sur les sandales qu’il avait aux pieds
  rationale: Préserve l’image concrète du sang sur les vêtements de Joab, avec des relatives idiomatiques en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la répétition accusatrice, l’opposition entre guerre et paix et l’image concrète du sang, tout en évitant une littéralité obscure.
