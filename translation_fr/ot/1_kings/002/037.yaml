base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: fr
  text: 'Car, le jour où tu sortiras et franchiras la vallée du Cédron[a], sache-le bien : tu mourras certainement ; ton sang sera sur ta tête[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’oued du Cédron » ou « le torrent du Cédron ». Le mot hébreu peut désigner une vallée, un ravin, un oued ou un cours d’eau saisonnier.
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque signifiant que tu porteras toi-même la responsabilité de ta mort.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Car, le jour où
  rationale: La formule introduit ici solennellement la condition et sa conséquence. « Le jour où » conserve la tournure juridique et temporelle de l’hébreu, tandis que « Car » relie naturellement cet avertissement au contexte.
- source_word: צֵאתְךָ
  choice: tu sortiras
  rationale: L’infinitif construit avec suffixe désigne l’action future de Shimeï quittant le périmètre qui lui est imposé. Le futur français convient à l’avertissement conditionnel.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: et franchiras la vallée du Cédron
  rationale: « Franchir » exprime clairement le passage au-delà de la limite. נחל peut désigner une vallée, un ravin, un oued ou son cours d’eau saisonnier ; « vallée du Cédron » est naturel en français et la note préserve l’alternative lexicale.
- source_word: יָדֹעַ תֵּדַע
  choice: sache-le bien
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’énoncé. « Sache-le bien » rend cette insistance dans un français actuel et solennel.
- source_word: כִּי מוֹת תָּמוּת
  choice: tu mourras certainement
  rationale: La construction avec infinitif absolu souligne la certitude de la mort. Cette formulation reproduit l’emphase sans calquer maladroitement « mourir, tu mourras ».
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: ton sang retombera sur ta tête
  rationale: Cette formulation conserve l’image hébraïque de la responsabilité du sang tout en étant idiomatique en français. La note en explicite la portée juridique.
theological_decisions:
- issue: Formule de culpabilité liée à la peine de mort
  choice: Conserver dans le texte l’image « ton sang retombera sur ta tête »
  alternative: tu seras toi-même responsable de ta mort
  rationale: L’expression concerne la responsabilité personnelle à l’égard d’une sanction annoncée. Garder la métaphore préserve la force juridique et morale de l’hébreu sans imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne, avec une tonalité solennelle adaptée à un avertissement royal et juridique. Les répétitions emphatiques hébraïques sont rendues idiomatiquement, et l’image de la responsabilité du sang est conservée avec une note explicative.
