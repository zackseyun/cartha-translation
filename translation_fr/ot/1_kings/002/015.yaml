source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: fr
  text: 'Il dit : « Tu sais que la royauté était à moi et que tous les Israélites avaient les regards tournés vers moi pour que je règne. Mais la royauté a changé de mains et elle est devenue celle de mon frère, car elle lui venait de Yahweh.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « car elle était à lui de par Yahweh ».'
    reason: La dernière proposition hébraïque exprime littéralement que la royauté « était à lui, de Yahweh »; elle peut souligner sa provenance ou sa détermination divine.
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: la royauté
  rationale: Dans ce contexte de succession, le terme désigne surtout la dignité et l'exercice du pouvoir royal, plutôt que le territoire du royaume.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: tout Israël comptait sur moi
  rationale: Rend naturellement l'expression idiomatique selon laquelle Israël avait dirigé son visage vers Adonias, c'est-à-dire qu'il se tournait vers lui dans l'attente de son règne.
- source_word: לִמְלֹךְ
  choice: pour régner
  rationale: Exprime directement l'exercice de la fonction royale sans ajouter explicitement l'idée d'une intronisation.
- source_word: וַתִּסֹּב
  choice: a changé de mains
  rationale: Restitue en français courant l'image d'un retournement ou transfert de la royauté, sans préciser le mécanisme de ce changement.
- source_word: וַתְּהִי לְאָחִי
  choice: elle est revenue à mon frère
  rationale: Rend le passage de la royauté au frère d'Adonias; « revenue » est idiomatique dans le contexte d'une attribution, sans impliquer qu'il la possédait auparavant.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: car elle lui venait de Yahweh
  rationale: Préserve l'idée de provenance divine portée par מֵיְהוָה, sans ajouter un verbe tel que « donner » qui n'apparaît pas dans l'hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אָחִי
  choice: mon frère
  rationale: Terme familial direct désignant Salomon du point de vue d'Adonias.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom divin personnel; sa transcription le distingue du titre אֲדֹנָי.
- issue: Degré d'explicitation de l'action divine dans la dernière proposition
  choice: car elle lui venait de Yahweh
  alternative: car Yahweh la lui avait donnée
  rationale: L'hébreu affirme la provenance divine de la royauté sans employer explicitement le verbe « donner »; la formulation retenue conserve cette réserve.
- issue: Prétention d'Adonias à la royauté
  choice: la royauté devait me revenir
  alternative: la royauté était à moi
  rationale: La construction לִי הָיְתָה peut exprimer que la royauté lui appartenait ou lui était destinée. Le contexte est une déclaration d'Adonias, non une validation narrative de son droit; la traduction maintient son point de vue sans en faire une affirmation théologique absolue.
translation_notes:
  register: Français international moderne, digne et oralement naturel. « Royauté » vise ici la fonction royale. L'idiome hébreu du visage est rendu par « comptait sur moi » afin d'être immédiatement compréhensible; la note est réservée à l'ambiguïté réelle de la proposition finale.
