  source_fidelity: La formulation « devait me revenir » interprète לִי הָיְתָה comme une destinée ou un droit futur, alors que l’hébreu dit plus directement que la royauté « était à moi ». De même, « elle est revenue à mon frère » suggère indûment un retour à un ancien détenteur. La révision conserve la revendication d’Adonias sans la valider et rend le transfert sans cette implication.
  naturalness: « Tous les Israélites avaient les regards tournés vers moi pour que je règne » est naturel dans un français moderne soutenu et restitue l’orientation expectative de l’idiome hébreu. « Elle est devenue celle de mon frère » est clair et idiomatique dans ce contexte successoral.
  terminology: « Royauté », « régner », « mon frère » et « Yahweh » conviennent. « Car elle lui venait de Yahweh » préserve sobrement la provenance divine exprimée par le texte, sans ajouter que Yahweh l’aurait explicitement donnée.
