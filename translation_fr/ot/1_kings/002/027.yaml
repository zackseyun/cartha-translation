source:
  edition: WLC
  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: fr
  text: Salomon chassa Abiathar de sa fonction de prêtre au service de Yahweh, accomplissant ainsi[a] la parole que Yahweh avait prononcée au sujet de la maison d’Éli à Silo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin d’accomplir la parole de Yahweh ». L’hébreu peut exprimer le but ou le résultat.
    reason: alternative_reading
  - marker: b
    text: Voir 1 Samuel 2.27-36 et 3.11-14 au sujet de la parole prononcée contre la maison d’Éli.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: chassa
  rationale: Le verbe גּרשׁ exprime une expulsion énergique. « Chassa » en conserve la force sans suggérer nécessairement un exil géographique.
- source_word: מִהְיוֹת כֹּהֵן לַיהוָה
  choice: de sa fonction de prêtre au service de Yahweh
  rationale: La préposition מִן avec l’infinitif de היה marque la destitution d’un état ou d’une charge, tandis que לַיהוָה indique la relation de service envers Yahweh. Cette formulation est naturelle en français et explicite qu’Abiathar est écarté de sa fonction sacerdotale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְמַלֵּא
  choice: accomplissant ainsi
  rationale: L’infinitif précédé de ל peut exprimer le but ou le résultat. Le participe français relie l’acte de Salomon à l’accomplissement de la parole antérieure sans trancher entièrement la question de son intention.
- source_word: דְּבַר יְהוָה אֲשֶׁר דִּבֶּר
  choice: la parole que Yahweh avait prononcée
  rationale: « Parole » convient à une déclaration divine, et le plus-que-parfait marque naturellement son antériorité par rapport à la destitution d’Abiathar.
- source_word: עַל בֵּית עֵלִי
  choice: au sujet de la maison d’Éli
  rationale: עַל peut signifier « au sujet de » ou, dans ce contexte de jugement, « contre ». Le choix retenu conserve la portée générale de la préposition sans effacer le caractère judiciaire donné par le contexte.
- source_word: בְּשִׁלֹה
  choice: à Silo
  rationale: La préposition בְּ est locative. En français, « à Silo » est la tournure idiomatique avec un nom de ville.
theological_decisions:
- issue: Rapport entre l’acte de Salomon et la parole divine
  choice: L’expulsion d’Abiathar est présentée comme accomplissant la parole antérieure de Yahweh.
  alternative: « afin d’accomplir la parole de Yahweh », qui ferait davantage ressortir le but de l’action.
  rationale: לְמַלֵּא peut indiquer le but ou le résultat. « Accomplissant ainsi » préserve le lien théologique entre l’événement et le jugement annoncé tout en évitant d’attribuer avec certitude à Salomon une intention que le texte laisse ambiguë.
- issue: Portée de la parole contre la maison d’Éli
  choice: « au sujet de la maison d’Éli »
  alternative: « contre la maison d’Éli »
  rationale: Le contexte indique une parole de jugement, mais la préposition עַל elle-même admet une formulation plus générale. La traduction laisse le contexte fournir la nuance hostile.
translation_notes:
  register: Français international moderne, digne et accessible. « Chassa » restitue la vigueur du verbe hébreu; « de sa fonction de prêtre au service de Yahweh » évite la tournure peu naturelle « d’être prêtre pour Yahweh ». Les deux appels de note figurent dans le texte principal.
