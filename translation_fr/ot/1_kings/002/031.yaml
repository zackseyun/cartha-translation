base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: fr
  text: 'Alors le roi lui dit : « Fais comme il l’a dit : frappe-le à mort[a] et enterre-le. Tu ôteras ainsi de moi et de la maison de mon père le sang innocent[b] que Joab a versé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tue-le ». L’expression hébraïque désigne ici le fait de se jeter sur quelqu’un pour l’exécuter.
    reason: lexical_alternative
  - marker: b
    text: Le « sang innocent » désigne le sang versé sans juste cause ; l’expression comporte aussi l’idée de la culpabilité liée à ce sang versé.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: Fais comme il l’a dit
  rationale: Cette formulation directe et naturelle conserve l’impératif ainsi que le renvoi aux paroles que Joab vient de prononcer.
- source_word: וּפְגַע בּוֹ
  choice: frappe-le à mort
  rationale: Le verbe פגע construit avec ב désigne ici une attaque mortelle, dans le contexte explicite de l’exécution de Joab. Cette traduction garde l’image de l’action violente tout en indiquant clairement son issue.
- source_word: וּקְבַרְתּוֹ
  choice: et enterre-le
  rationale: Rend directement le second ordre, qui suit l’exécution sans qu’il soit nécessaire d’ajouter un marqueur temporel absent de l’hébreu.
- source_word: וַהֲסִירֹתָ
  choice: Tu ôteras ainsi
  rationale: Le waw relie cette forme verbale aux impératifs précédents et peut exprimer leur conséquence ou leur finalité. « Ainsi » rend cette relation sans la réduire exclusivement à une proposition de but.
- source_word: דְּמֵי חִנָּם
  choice: le sang innocent
  rationale: Expression biblique concrète qui désigne le sang versé sans juste cause et évoque la culpabilité attachée à un tel meurtre.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: de dessus moi et de dessus la maison de mon père
  rationale: La répétition de « de dessus » préserve l’image hébraïque d’une culpabilité qui repose sur une personne et sur une maison, tout en restant intelligible en français.
theological_decisions:
- issue: Responsabilité liée au sang versé et maison royale
  choice: Conserver l’image du « sang innocent » ôté de dessus Salomon et la maison de son père.
  alternative: Expliciter par « délivrer de la culpabilité du sang versé » ou « ôter la culpabilité du meurtre ».
  rationale: L’hébreu parle concrètement du sang innocent qui repose sur des personnes et dont elles sont dégagées. Garder cette image préserve la portée juridique et morale ainsi que la tension concernant la responsabilité de la maison royale, sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et direct. Le discours royal garde sa vigueur impérative. « De dessus » est légèrement marqué, mais demeure clair et permet de conserver l’image juridique et théologique de l’hébreu.
