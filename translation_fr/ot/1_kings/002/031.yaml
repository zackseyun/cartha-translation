revisions:
- from: 'Alors le roi lui dit : « Fais comme il l’a dit : frappe-le à mort[a] et enterre-le. Tu ôteras ainsi de dessus moi et de dessus la maison de mon père le sang innocent[b] que Joab a versé. »'
  to: 'Alors le roi lui dit : « Fais comme il l’a dit : frappe-le à mort[a] et enterre-le. Tu ôteras ainsi de moi et de la maison de mon père le sang innocent[b] que Joab a versé. »'
  rationale: La révision remplace un calque hébreu peu naturel par une tournure française idiomatique, sans effacer l’idée de responsabilité qui pèse sur Salomon et sur la maison de son père. Elle ajuste également la note pour ne pas restreindre indûment le sens de l’expression à un seul acte de meurtre. Les ancres de notes demeurent correctement placées.
