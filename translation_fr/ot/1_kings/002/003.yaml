  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: fr
  text: Accomplis ton devoir envers Yahweh, ton Dieu, en suivant ses voies et en observant ses prescriptions, ses commandements, ses ordonnances et ses témoignages, comme il est écrit dans la Loi de Moïse, afin que tu agisses avec discernement[a] dans tout ce que tu feras et partout où tu te tourneras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que tu réussisses ». Le verbe hébreu peut mettre l’accent sur une conduite avisée ou sur la réussite qui en résulte.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: Accomplis ton devoir
  rationale: L’expression désigne l’accomplissement fidèle d’une obligation confiée. Cette formulation française naturelle évite le calque obscur « garde la garde » tout en conservant la force exhortative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin personnel présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: en suivant ses voies
  rationale: Conserve la métaphore hébraïque des « voies » tout en employant un verbe idiomatique en français moderne.
- source_word: חֻקֹּתָיו
  choice: ses prescriptions
  rationale: Rend les dispositions établies et maintient une distinction avec les autres termes juridiques de l’énumération.
- source_word: מִצְוֺתָיו
  choice: ses commandements
  rationale: Équivalent précis et usuel dans le contexte de la Torah.
- source_word: מִשְׁפָּטָיו
  choice: ses règles
  rationale: Désigne ici des normes ou décisions juridiques; « règles » est clair en français contemporain et reste distinct de « prescriptions » et « commandements ».
- source_word: עֵדְוֺתָיו
  choice: ses témoignages
  rationale: Conserve la nuance de témoignage ou d’attestation liée aux stipulations de l’alliance, malgré son registre légèrement formel.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: dans la Loi de Moïse
  rationale: Dans ce contexte, la Torah désigne l’instruction mosaïque écrite; « Loi de Moïse » est l’expression française établie et intelligible.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: afin que tu agisses avec discernement
  rationale: Le verbe peut évoquer à la fois la conduite avisée et la réussite qui en découle. Le choix principal met en avant le discernement sans exclure la nuance de succès, signalée en note.
- source_word: וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: et partout où tu te tourneras
  rationale: Reproduit naturellement l’image spatiale hébraïque, qui s’étend à toutes les directions et entreprises du roi.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom personnel divin. Le translittérer préserve cette donnée du texte source sans le remplacer par un titre.
- issue: Nuance de תַּשְׂכִּיל
  choice: que tu agisses avec discernement
  alternative: que tu réussisses / prospères
  rationale: Le verbe associe potentiellement conduite avisée et réussite. Le texte principal exprime la sagesse pratique, tandis que la note préserve explicitement l’autre nuance sans transformer la promesse en garantie générale de prospérité.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse personnelle de David à Salomon. Les termes de l’énumération juridique restent distincts, et la métaphore des « voies » est conservée.
