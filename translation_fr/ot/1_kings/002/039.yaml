base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: fr
  text: 'Au bout de trois ans, deux esclaves de Shimeï s’enfuirent chez Akish, fils de Maaka, roi de Gath. On informa Shimeï : « Voici que tes esclaves sont à Gath. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: Au bout de trois ans
  rationale: Rend naturellement en français le terme d’une période de trois ans, sans ajouter de marqueur discursif absent de l’hébreu.
- source_word: וַיִּבְרְחוּ
  choice: s’enfuirent
  rationale: Exprime le départ clandestin et la fuite hors de l’autorité du maître.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: esclaves
  rationale: Le contexte de fuite et de récupération met en avant leur condition servile plutôt qu’un simple service domestique.
- source_word: אֶל אָכִישׁ
  choice: chez Akish
  rationale: Dans ce contexte, אֶל indique qu’ils se rendent auprès d’Akish; « chez » est idiomatique en français.
- source_word: בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: fils de Maaka, roi de Gath
  rationale: Conserve directement la filiation et le titre royal.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: On informa Shimeï
  rationale: Le pluriel indéfini hébreu se rend naturellement par « on »; la formule לֵאמֹר est absorbée dans l’introduction française des paroles directes.
- source_word: הִנֵּה עֲבָדֶיךָ בְּגַת
  choice: Tes esclaves sont à Gath
  rationale: La présentation soudaine marquée par הִנֵּה est suffisamment portée par l’annonce directe; ajouter « voici » ou « regarde » serait moins naturel ici en français.
