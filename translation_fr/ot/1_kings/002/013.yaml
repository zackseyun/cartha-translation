base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: fr
  text: 'Adonias, fils de Hagguit, vint trouver Bethsabée, mère de Salomon. Elle lui demanda : « Est-ce en paix que tu viens[a] ? » Il répondit : « En paix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Ta venue est-elle en paix ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint trouver
  rationale: Le verbe בוא peut signifier « venir » ou « aller » selon le point de vue. « Vint trouver » exprime naturellement en français le déplacement vers Bethsabée et la rencontre recherchée.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: בֶן חַגִּית
  choice: fils de Hagguit
  rationale: Rend directement la construction filiale hébraïque et identifie Adonias par sa mère.
- source_word: בַּת שֶׁבַע
  choice: Bethsabée
  rationale: Forme française courante du nom propre.
- source_word: אֵם שְׁלֹמֹה
  choice: mère de Salomon
  rationale: Conserve l'apposition hébraïque et souligne le lien de Bethsabée avec le roi Salomon.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: Viens-tu dans des intentions pacifiques ?
  rationale: Dans ce contexte, שָׁלוֹם porte sur le caractère pacifique de la démarche d'Adonias. Cette formulation française naturelle restitue la méfiance implicite sans surinterpréter son motif précis.
- source_word: שָׁלוֹם
  choice: Oui, dans des intentions pacifiques
  rationale: La réponse hébraïque, très brève, reprend שָׁלוֹם. L'ajout idiomatique de « Oui » explicite la valeur affirmative en français tout en conservant l'écho de la question.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue reste direct et concis; la répétition de « dans des intentions pacifiques » préserve l'écho lexical de l'hébreu.
