lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: reposa
  rationale: Dans cette formule royale de décès, שׁכב signifie littéralement « se coucher » et, par euphémisme, mourir. « Reposa » conserve l’image hébraïque tout en étant naturel et digne en français.
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: Le sens est celui des générations précédentes. « Ancêtres » exprime clairement ce référent en français moderne et évite que « pères » soit compris comme désignant plusieurs pères immédiats.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le nifal exprime ici le passif ; « fut enterré » est l’équivalent français direct et naturel.
- source_word: בְּעִיר דָּוִד
  choice: dans la cité de David
  rationale: « La cité de David » rend la désignation géographique traditionnelle tout en distinguant ce nom de lieu du sens générique de « ville ».
- source_word: וַ
  choice: Puis
  rationale: Le waw narratif fait progresser le récit ; « Puis » restitue naturellement cette succession en français.
