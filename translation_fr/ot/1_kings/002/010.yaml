  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: fr
  text: Puis David s’endormit avec ses pères[a] et fut enterré dans la cité de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se coucha avec ses pères » ; expression hébraïque habituelle pour dire qu’il mourut.'
