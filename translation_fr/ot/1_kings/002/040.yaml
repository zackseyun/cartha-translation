base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: fr
  text: Alors Shimeï se leva, sella son âne et se rendit à Gath, chez Akish, pour chercher ses esclaves[a]. Shimeï se rendit à Gath et en ramena ses esclaves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses serviteurs ». Le mot hébreu עֲבָדָיו peut désigner des serviteurs ou des esclaves ; ici, « esclaves » souligne leur statut de dépendance et le fait qu’ils s’étaient enfuis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום marque ici le début de l’action. « Se leva » conserve la succession narrative et reste naturel en français moderne.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: sella son âne
  rationale: Dans un contexte de voyage, חבש désigne la préparation de l’animal, plus précisément le fait de le seller.
- source_word: גַּתָה
  choice: à Gath
  rationale: Le hé directionnel indique un mouvement vers Gath ; la préposition française « à » l’exprime naturellement.
- source_word: אֶל אָכִישׁ
  choice: chez Akish
  rationale: La formulation indique que Shimeï se rend à Gath auprès d’Akish. « Chez Akish » rend cette destination personnelle de façon idiomatique.
- source_word: לְבַקֵּשׁ
  choice: pour chercher
  rationale: בקש signifie ici rechercher concrètement des personnes. « Chercher » est clair, courant et fidèle au contexte.
- source_word: עֲבָדָיו
  choice: ses esclaves
  rationale: עבד peut désigner un serviteur ou un esclave. Le contexte de personnes enfuies que leur maître va récupérer met en avant leur statut de dépendance et justifie « esclaves », tout en signalant l’autre possibilité en note.
- source_word: וַיָּבֵא אֶת עֲבָדָיו מִגַּת
  choice: ramena ses esclaves de Gath
  rationale: Le hifil de בוא signifie « faire venir, amener ». « Ramena » exprime naturellement en français la récupération et le retour impliqués par le récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres sont translittérés sous les formes « Shimeï », « Gath » et « Akish ». La reprise « Shimeï y alla » conserve l’insistance du texte hébreu tout en évitant une lourdeur excessive.
