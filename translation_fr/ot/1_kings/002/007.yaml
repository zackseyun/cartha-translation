id: 1KI.2.7
reference: 1 Kings 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: fr
  text: Mais agis avec bonté envers les fils de Barzillaï le Galaadite[a]. Qu’ils soient parmi ceux qui mangent à ta table[b], car c’est ainsi qu’ils se sont approchés de moi[c] lorsque je fuyais devant Absalom, ton frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « agis avec loyauté envers les fils de Barzillaï ». L’expression hébraïque peut désigner une bonté fidèle et loyale, et non un simple sentiment bienveillant.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « qu’ils soient parmi ceux qui mangent à ta table » : cette expression évoque l’entretien régulier et la faveur accordés par le roi.'
    reason: cultural_note
  - marker: c
    text: Ou « ils sont venus vers moi » ou « ils m’ont soutenu ». Le verbe hébreu signifie littéralement « s’approcher »; dans ce contexte, il suggère qu’ils ont apporté leur soutien à David pendant sa fuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Mais… envers les fils de
  rationale: Le waw poursuit les instructions de David tout en marquant ici un contraste avec l’ordre précédent. « Fils de » convient aux descendants masculins de Barzillaï dans ce contexte.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzillaï le Galaadite
  rationale: Le nom propre et le gentilé suivent leurs formes françaises bibliques usuelles.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: agis avec bonté
  rationale: La locution signifie exercer concrètement une bonté qui peut aussi comporter fidélité et loyauté. Cette formulation reste naturelle sans imposer une nuance d’alliance que le contexte n’explicite pas.
- source_word: וְהָיוּ
  choice: Qu’ils soient
  rationale: Dans cette suite d’instructions, la forme exprime la volonté ou l’ordre de David à Salomon.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: parmi ceux qui mangent à ta table
  rationale: La formulation conserve l’image hébraïque et son idée de faveur et d’entretien réguliers par le roi.
- source_word: כִּי כֵן
  choice: car c’est ainsi que
  rationale: La tournure conserve à la fois la justification introduite par כִּי et la valeur comparative ou correspondante de כֵן.
- source_word: קָרְבוּ אֵלַי
  choice: ils se sont approchés de moi
  rationale: Ce rendu maintient le sens premier du verbe, tandis qu’une note signale qu’il implique probablement leur soutien à David.
- source_word: בְּבָרְחִי
  choice: lorsque je fuyais
  rationale: L’infinitif construit avec préposition et suffixe a ici une valeur temporelle, rendue naturellement en français.
- source_word: מִפְּנֵי
  choice: devant
  rationale: Ce choix conserve l’image de fuite loin de la présence d’Absalom; « pour échapper à » serait une explicitation possible.
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: Absalom, ton frère
  rationale: Le lien familial est conservé explicitement, comme dans l’hébreu.
