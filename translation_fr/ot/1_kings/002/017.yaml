base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: fr
  text: 'Il dit : « Je t’en prie, parle au roi Salomon, car il ne te refusera pas, pour qu’il me donne Abishag la Shounamite pour femme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Je t’en prie, parle
  rationale: L’impératif féminin singulier accompagné de נָא formule une demande polie adressée à Bethsabée. Cette tournure est naturelle en français moderne.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: au roi Salomon
  rationale: Le français place naturellement le titre royal avant le nom, tout en conservant le sens de l’apposition hébraïque.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison pour laquelle Bethsabée devrait présenter la demande.
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: il ne te dira pas non
  rationale: L’expression hébraïque signifie littéralement qu’il ne fera pas revenir le visage de Bethsabée, c’est-à-dire qu’il ne repoussera pas sa requête. « Ne pas te dire non » restitue clairement cet idiome en français courant sans préciser davantage la nature de la requête.
- source_word: וְיִתֶּן לִי
  choice: et qu’il me donne
  rationale: Le verbe préfixé coordonné exprime l’action qu’Adonias souhaite obtenir de Salomon. Le subjonctif français s’intègre naturellement à la demande transmise.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abishag la Shounamite
  rationale: Le nom personnel et le gentilé sont translittérés selon des formes françaises claires et couramment reconnaissables.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Cette construction désigne explicitement une union matrimoniale. « Pour femme » est concise, naturelle et conforme au registre biblique français.
