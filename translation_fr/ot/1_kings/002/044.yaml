  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל שִׁמְעִ֗י אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת כָּל הָ/רָעָ֗ה אֲשֶׁ֤ר יָדַע֙ לְבָ֣בְ/ךָ֔ אֲשֶׁ֥ר עָשִׂ֖יתָ לְ/דָוִ֣ד אָבִ֑/י וְ/הֵשִׁ֧יב יְהוָ֛ה אֶת רָעָתְ/ךָ֖ בְּ/רֹאשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: fr
  text: 'Alors le roi dit à Shiméï : « Toi, tu connais dans ton cœur[a] tout le mal que tu as fait à David, mon père. Yahweh a fait retomber[b] sur ta propre tête le mal que tu as commis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout le mal que ton cœur connaît ». Cette expression souligne que Shiméï a intérieurement conscience de sa faute.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Yahweh a ramené ton mal sur ta propre tête » ou « Yahweh t’a rendu ton mal ». Le verbe hébreu évoque le mal que Dieu fait revenir sur son auteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Alors le roi dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession narrative, tandis que « le roi » reprend le titre défini désignant Salomon dans le contexte.
- source_word: אֶל שִׁמְעִי
  choice: à Shiméï
  rationale: Transcription française usuelle du nom hébreu שִׁמְעִי.
- source_word: אַתָּה יָדַעְתָּ
  choice: Toi, tu connais
  rationale: Le pronom indépendant אַתָּה met le sujet en relief. La dislocation « Toi, tu » restitue cette insistance en français courant et solennel.
- source_word: כָּל הָרָעָה
  choice: tout le mal
  rationale: רָעָה désigne ici la faute moralement mauvaise commise envers David, et non un simple malheur.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: dans ton cœur
  rationale: Cette formulation française exprime la conscience intérieure de Shiméï sans conserver une tournure littérale peu naturelle où le cœur serait grammaticalement le sujet de « connaître ». La note signale cette image hébraïque.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: que tu as fait à David, mon père
  rationale: Rendu direct de l’acte commis contre David; l’apposition « mon père » conserve la relation explicitement énoncée.
- source_word: וְהֵשִׁיב
  choice: a fait retomber
  rationale: Le hiphil de שׁוב exprime ici le fait de faire revenir sur quelqu’un les conséquences de son acte. « Faire retomber » conserve cette image rétributive et s’accorde naturellement avec l’expression « sur ta tête ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: אֶת רָעָתְךָ
  choice: le mal que tu as commis
  rationale: Cette expression rend explicitement et naturellement en français le possessif hébreu « ton mal », c’est-à-dire la faute de Shiméï, tout en reprenant le même terme « mal » que dans la première proposition.
- source_word: בְּרֹאשֶׁךָ
  choice: sur ta propre tête
  rationale: L’expression conserve l’image hébraïque de la faute ou de ses conséquences revenant sur son auteur. « Propre » souligne que Shiméï en subit lui-même le retour.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme; sa transcription préserve le nom personnel sans lui substituer un titre.
- issue: Action divine dans la rétribution
  choice: Yahweh a fait retomber sur ta propre tête le mal que tu as commis
  alternative: Yahweh t’a rendu le mal que tu as commis
  rationale: Le texte attribue explicitement à Yahweh l’action de faire revenir la faute de Shiméï sur lui. Le rendu retenu maintient cette causalité divine ainsi que l’image du retour sur la tête, sans développer une doctrine au-delà de l’énoncé.
translation_notes:
  register: Français international moderne, digne et accessible. La mise en relief « Toi, tu » conserve l’insistance de l’hébreu. L’idiome du cœur est formulé naturellement dans le texte et explicité en note; l’image rétributive de la faute retombant sur la tête de son auteur est maintenue.
