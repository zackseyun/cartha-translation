  text: וַ/יֹּ֕אמֶר דָּבָ֥ר לִ֖/י אֵלָ֑יִ/ךְ וַ/תֹּ֖אמֶר דַּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/014.yaml
  text: Then he said[a], “I have something to say to you.” And she said, “Speak.”
translation:
  language: fr
  text: 'Puis il dit : « J’ai quelque chose[a] à te dire. » Elle répondit : « Parle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « J’ai une parole (ou une affaire) à te dire ». Le mot hébreu peut aussi signifier « chose »; l’expression désigne ce que le locuteur souhaite dire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis il dit
  rationale: Le wayyiqtol de אָמַר fait avancer le récit; « Puis il dit » rend naturellement cette succession en français.
- source_word: דָּבָר
  choice: quelque chose
  rationale: Dans l’expression דָּבָר לִי אֵלַיִךְ, le nom peut signifier « parole », « affaire » ou « chose »; « quelque chose » restitue ici l’indétermination de façon idiomatique.
- source_word: לִי
  choice: J’ai
  rationale: La construction avec לִי exprime ici ce que le locuteur a à communiquer; le français naturel emploie « j’ai ».
- source_word: אֵלַיִךְ
  choice: à te dire
  rationale: אֶל avec le suffixe féminin singulier désigne la destinataire, Bethsabée. Dans cette locution française, la direction vers l’interlocutrice est naturellement rendue par « te dire ».
- source_word: וַתֹּאמֶר
  choice: Elle répondit
  rationale: Le verbe est littéralement « elle dit », mais il introduit ici la réplique immédiate de Bethsabée; « répondit » exprime naturellement la fonction dialogique sans modifier le contenu.
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif masculin singulier de דָּבַר est rendu directement et sobrement par « Parle ».
