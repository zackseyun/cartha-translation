  text: וַ/יַּ֗עַל בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יְמִתֵ֑/הוּ וַ/יִּקָּבֵ֥ר בְּ/בֵית֖/וֹ בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: fr
  text: Alors Benaya, fils de Yehoyada, monta, le frappa et le mit à mort. Il fut enterré dans sa maison[a], au désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans sa maison ». Dans ce contexte funéraire, « maison » peut aussi désigner la propriété ou le domaine familial.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie d’abord « monter ». Le contexte permet de comprendre que Benaya se rend sur place pour exécuter l’ordre royal, sans qu’il soit nécessaire d’expliciter cette idée dans la traduction.
- source_word: וַיִּפְגַּע בּוֹ
  choice: le frappa
  rationale: Avec la préposition ב, פגע peut désigner une attaque ou un coup porté. « Le frappa » rend clairement l’action hostile tout en la distinguant du verbe suivant, qui exprime explicitement la mise à mort.
- source_word: וַיְמִתֵהוּ
  choice: le mit à mort
  rationale: La forme causative de מות signifie « faire mourir ». « Mettre à mort » en conserve la valeur causative et convient au contexte d’une exécution ordonnée par le roi.
- source_word: וַיִּקָּבֵר
  choice: on l’enterra
  rationale: Le nifal hébreu est passif. La tournure française indéfinie « on l’enterra » exprime naturellement l’inhumation sans identifier ceux qui l’accomplissent.
- source_word: בְּבֵיתוֹ
  choice: près de sa maison
  rationale: בית peut désigner la maison, le domaine ou la propriété familiale. Dans cette notice funéraire, « près de sa maison » évite de suggérer sans nécessité que le corps fut placé à l’intérieur du bâtiment.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מדבר désigne une région inhabitée ou peu habitée, souvent aride. « Désert » est ici une formulation française claire et traditionnelle, sans préciser davantage la nature du terrain.
theological_decisions: []
translation_notes:
  register: 'Français moderne, sobre et narratif. Les deux verbes hébreux décrivant l’attaque puis la mort sont conservés séparément (« le frappa et le mit à mort »). Les noms propres suivent une translittération française lisible : Benaya, Yehoyada.'
