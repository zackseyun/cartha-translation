  source_fidelity: 'La séquence verbale est fidèlement distinguée : Benaya « monta », l’attaqua/le frappa, puis le mit à mort. Toutefois, « près de sa maison » ajoute une localisation (« près de ») que בְּבֵיתוֹ n’exprime pas ; le texte hébreu dit littéralement « dans/à sa maison » et peut, dans ce contexte funéraire, viser la propriété familiale.'
  naturalness: Le français est sobre et naturel. « Il fut enterré » rend mieux le passif hébreu que le sujet indéfini « On l’enterra » et conserve le changement de sujet. « Dans sa maison, au désert » est volontairement proche de la formulation ancienne ; la note en explique la portée sans surinterpréter.
  terminology: « Benaya, fils de Yehoyada » est une translittération française lisible et cohérente. « Mit à mort » rend bien le causatif hébreu. « Désert » est possible pour מִדְבָּר ; « au désert » est idiomatique dans cette notice géographique.
