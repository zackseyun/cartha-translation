base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: fr
  text: Alors le roi donna ses ordres à Benaya, fils de Yehoyada. Celui-ci sortit, le frappa, et celui-ci mourut. Ainsi, le royaume fut solidement établi entre les mains de Salomon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « fut fermement assuré sous l’autorité de Salomon ». Littéralement : « fut solidement établi dans la main de Salomon » ; l’expression hébraïque évoque ici la maîtrise ou l’autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Alors le roi donna ses ordres
  rationale: Le verbe צוה exprime un ordre faisant autorité. « Donner ses ordres » convient naturellement au contexte royal et introduit la suite narrative.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya, fils de Yehoyada
  rationale: Les noms sont translittérés sous des formes françaises proches de l'hébreu, et la relation filiale est conservée explicitement.
- source_word: וַיֵּצֵא
  choice: Celui-ci sortit
  rationale: יצא signifie littéralement « sortir ». « Celui-ci » lève naturellement l'ambiguïté possible du pronom en français sans ajouter d'information étrangère au contexte.
- source_word: וַיִּפְגַּע בּוֹ וַיָּמֹת
  choice: le frappa et le fit mourir
  rationale: פגע avec ב désigne ici le coup porté lors d'une exécution, tandis que מות en indique explicitement l'issue. La formulation française garde les deux éléments sans la tournure peu naturelle « et il mourut », dont le sujet pourrait paraître ambigu.
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: Ainsi, le royaume fut solidement établi
  rationale: Le niphal de כון exprime l'affermissement ou la stabilité. « Ainsi » rend la valeur conclusive de la dernière proposition dans ce contexte.
- source_word: בְּיַד שְׁלֹמֹה
  choice: entre les mains de Salomon
  rationale: Cette expression conserve l'image hébraïque de la main comme symbole de maîtrise et de pouvoir, sous une forme idiomatique en français.
