  text: 'Bethsabée dit : « Bien, je parlerai de toi au roi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: répondit
  rationale: Le verbe אמר introduit une parole; dans cet échange, « répondit » rend naturellement la réaction de Bethsabée à la demande d’Adonias.
- source_word: בַּת שֶׁבַע
  choice: Bethsabée
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu, sans traduction de son étymologie.
- source_word: טוֹב
  choice: Bien
  rationale: Réponse brève marquant l’accord; « Bien » conserve la concision de l’hébreu et convient au dialogue français actuel.
- source_word: אָנֹכִי אֲדַבֵּר
  choice: Je parlerai
  rationale: Rend directement le pronom sujet explicite et l’imparfait de דבר, sans ajouter l’idée plus précise d’une requête.
- source_word: עָלֶיךָ
  choice: de toi
  rationale: La construction דבר על peut signifier parler au sujet de quelqu’un; le contexte suggère une intervention en sa faveur, mais cette formulation préserve l’ambiguïté lexicale.
- source_word: אֶל הַמֶּלֶךְ
  choice: au roi
  rationale: Traduction française naturelle de « vers/à le roi », avec la minuscule pour le titre royal.
