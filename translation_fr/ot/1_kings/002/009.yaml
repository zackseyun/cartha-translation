  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: fr
  text: Mais maintenant, ne le laisse pas impuni, car tu es un homme sage et tu sauras ce que tu devras lui faire. Tu feras descendre sa tête aux cheveux blancs au Shéol[a], dans le sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le séjour des morts » ou « la tombe ».
    reason: Alternative lexicale pour שְׁאוֹל, dont le champ sémantique ne correspond pas exactement à un seul terme français.
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: ne le laisse pas impuni
  rationale: Le piel de נקה avec suffixe objet peut signifier tenir pour innocent, acquitter ou laisser impuni. Ici, l’instruction porte concrètement sur l’application d’une peine; cette formulation en restitue naturellement la portée judiciaire.
- source_word: אִישׁ חָכָם
  choice: un homme sage
  rationale: L’expression désigne directement Salomon et conserve à la fois le substantif masculin et la qualité de sagesse.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: et tu sauras ce que tu dois lui faire
  rationale: Le parfait suivi de l’imparfait peut avoir ici une valeur prospective. «Tu sauras» exprime la confiance de David dans le discernement de Salomon, tandis que «dois» fait entendre la responsabilité implicite dans le contexte royal et judiciaire.
- source_word: וְהוֹרַדְתָּ
  choice: Tu feras descendre
  rationale: Le hiphil de ירד est causatif. Cette tournure conserve la force de «faire descendre» et poursuit l’instruction adressée à Salomon.
- source_word: שֵׂיבָתוֹ
  choice: ses cheveux blancs
  rationale: Le nom désigne les cheveux gris ou blancs, par métonymie la vieillesse. La traduction conserve l’image corporelle et évite de transformer directement la métaphore en «vieillesse».
- source_word: בְּדָם
  choice: dans le sang
  rationale: La préposition ב avec דם évoque ici une mort violente accompagnée de sang versé. «Dans le sang» conserve la brutalité et la concision de l’expression hébraïque.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: La translittération préserve la notion hébraïque sans la réduire au seul tombeau. Une note indique les principaux équivalents possibles en français.
theological_decisions:
- issue: Rendu de שְׁאוֹל
  choice: shéol
  alternative: le séjour des morts; la tombe
  rationale: La translittération maintient l’arrière-plan cosmologique et l’étendue sémantique du terme hébreu, sans imposer une interprétation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste proche de l’hébreu tout en étant idiomatique; l’image frappante des cheveux blancs descendant dans le sang est volontairement conservée.
