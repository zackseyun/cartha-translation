  text: וַ/יֹּ֨אמֶר שִׁמְעִ֤י לַ/מֶּ֨לֶךְ֙ ט֣וֹב הַ/דָּבָ֔ר כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וַ/יֵּ֧שֶׁב שִׁמְעִ֛י בִּ/ירוּשָׁלִַ֖ם יָמִ֥ים רַבִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: fr
  text: 'Shimeï dit au roi : « Cette parole est bonne.[a] Ton serviteur fera comme mon seigneur le roi l’a dit. » Et Shimeï habita longtemps à Jérusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Cette décision est bonne » ou « Ce que tu dis est juste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: Cette parole est bonne
  rationale: דָּבָר peut désigner une parole, une affaire ou une chose. Ici, Shimeï approuve la condition énoncée par Salomon. « Cette parole est bonne » conserve la formulation hébraïque tout en restant intelligible en français; une note signale les rendus contextuels plus idiomatiques.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Formule de déférence adressée au souverain. « Mon seigneur le roi » préserve le registre de cour sans imposer la nuance de propriété que pourrait suggérer « mon maître ».
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: Ton serviteur fera comme
  rationale: עַבְדֶּךָ est ici une humble désignation de soi dans le langage de cour; « ton serviteur » convient mieux que « ton esclave ». L’imparfait יַעֲשֶׂה a une valeur future et exprime l’engagement de Shimeï à obéir.
- source_word: וַיֵּשֶׁב
  choice: habita
  rationale: Dans ce contexte de résidence, יָשַׁב signifie habiter ou demeurer. « Habita » exprime clairement que Shimeï résida à Jérusalem conformément à l’ordre royal.
- source_word: יָמִים רַבִּים
  choice: longtemps
  rationale: Littéralement « de nombreux jours ». L’adverbe « longtemps » rend naturellement l’idée d’une durée prolongée et indéterminée en français moderne.
- source_word: שִׁמְעִי
  choice: Shimeï
  rationale: Transcription française usuelle du nom hébreu.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Forme française usuelle du nom de lieu; la préposition française « à » correspond naturellement à la résidence dans une ville.
