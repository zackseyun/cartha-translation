base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/006.yaml
  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: fr
  text: Agis selon ta sagesse et ne laisse pas sa tête blanche descendre en paix au séjour des morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au Shéol » ; ce terme hébreu désigne le domaine des morts et peut aussi, selon le contexte, être rendu par « la tombe ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Agis
  rationale: Le verbe עשה signifie largement « faire » ou « agir ». Dans la consigne donnée à Salomon, l’impératif français « Agis » exprime naturellement la portée pratique de la forme verbale.
- source_word: כְּחָכְמָתֶךָ
  choice: selon ta sagesse
  rationale: La préposition כ indique ici que l’action doit être conforme au discernement de Salomon. « Selon ta sagesse » reste proche de l’hébreu tout en étant naturel en français.
- source_word: וְלֹא תוֹרֵד
  choice: et ne fais pas descendre
  rationale: La forme causative de ירד signifie littéralement « faire descendre ». Cette formulation conserve la responsabilité active confiée à Salomon sans préciser davantage le moyen employé.
- source_word: שֵׂיבָתוֹ
  choice: ses cheveux blancs
  rationale: Le nom שֵׂיבָה peut désigner les cheveux blancs ou, par métonymie, la vieillesse. « Ses cheveux blancs » préserve l’image concrète et solennelle de l’hébreu.
- source_word: בְּשָׁלֹם
  choice: en paix
  rationale: שלום désigne ici une fin paisible, sans châtiment. « En paix » conserve la construction et la tension du texte sans l’expliciter excessivement.
- source_word: שְׁאֹל
  choice: le séjour des morts
  rationale: שְׁאוֹל désigne le domaine des morts et ne se réduit pas nécessairement à une tombe individuelle. « Le séjour des morts » rend le concept intelligible en français moderne, tandis que la note signale la translittération et l’autre traduction possible.
theological_decisions:
- issue: Sens de שְׁאֹל
  choice: le séjour des morts
  alternative: le shéol ; la tombe
  rationale: La traduction retenue préserve l’idée générale du domaine des morts sans imposer une conception doctrinale plus précise de l’au-delà. La note maintient visibles les autres rendus possibles.
- issue: Portée de la consigne concernant la mort de Joab
  choice: ne fais pas descendre en paix
  alternative: ne laisse pas descendre en paix
  rationale: La formulation causative suit la morphologie hébraïque et indique que Salomon doit agir, sans ajouter au verset une description explicite de l’exécution ou du châtiment.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement correspond à l’adresse directe de David à Salomon. L’image des « cheveux blancs » et l’expression « en paix » sont conservées afin de ne pas atténuer la force ni l’ambiguïté de l’hébreu.
