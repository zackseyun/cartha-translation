  text: וַ/יָּבֹ֨א בְנָיָ֜הוּ אֶל אֹ֣הֶל יְהוָ֗ה וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ צֵ֔א וַ/יֹּ֥אמֶר לֹ֖א כִּ֣י פֹ֣ה אָמ֑וּת וַ/יָּ֨שֶׁב בְּנָיָ֤הוּ אֶת הַ/מֶּ֨לֶךְ֙ דָּבָ֣ר לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר יוֹאָ֖ב וְ/כֹ֥ה עָנָֽ/נִי־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: fr
  text: 'Benaya se rendit alors à la tente de Yahweh[a] et dit à Joab : « Voici ce que dit le roi : “Sors !” » Mais Joab répondit : « Non, car je mourrai ici. » Benaya rapporta la réponse au roi en disant : « Voilà ce qu’a dit Joab et voilà ce qu’il m’a répondu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au tabernacle de Yahweh ». L’hébreu dit littéralement « à la tente de Yahweh ».
    reason: Alternative lexicale traditionnelle pour אֹהֶל.
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: la tente de Yahweh
  rationale: אֹהֶל signifie littéralement « tente ». Ce rendu suit directement l’hébreu sans introduire le terme traditionnel et plus interprétatif « tabernacle ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre afin de préserver le nom divin présent dans le texte hébreu.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Voici ce que dit le roi
  rationale: Cette formulation française naturelle rend la formule de messager hébraïque tout en conservant son caractère solennel.
- source_word: צֵא
  choice: Sors !
  rationale: L’impératif de יצא ordonne à Joab de quitter la tente ; « Sors ! » est direct et idiomatique en français.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: Non, car je mourrai ici
  rationale: Le rendu conserve le refus catégorique, le lien explicatif possible de כִּי et la résolution de mourir sur place.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: rapporta la réponse
  rationale: L’expression hébraïque désigne le retour d’un rapport au roi. « Rapporta la réponse » est clair et naturel dans ce contexte.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: Voilà ce qu’a dit Joab et voilà ce qu’il m’a répondu
  rationale: La répétition de « voilà ce que » reflète le double כֹּה, tandis que la formulation reste idiomatique en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie ici le tétragramme comme nom divin. « Yahweh » en préserve la fonction de nom propre plutôt que de lui substituer un titre.
- issue: Portée de la déclaration de Joab sur sa mort
  choice: « car je mourrai ici »
  alternative: « mais c’est ici que je mourrai »
  rationale: La traduction conserve l’ambiguïté entre explication de son refus, résolution personnelle et anticipation de son exécution, sans préciser davantage le rapport logique.
translation_notes:
  register: Français international moderne, digne et narratif. Les noms sont explicités dans le dialogue pour éviter l’ambiguïté des pronoms en français, sans ajouter d’information absente du contexte immédiat. La formule du messager et la répétition finale restent perceptibles sans archaïsme.
