source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: fr
  text: 'Yahweh fera retomber sur sa tête le sang qu’il a versé[a], car il s’est jeté sur deux hommes plus justes et meilleurs que lui et les a tués par l’épée, à l’insu de mon père David : Abner, fils de Ner, chef de l’armée d’Israël, et Amasa, fils de Yéter, chef de l’armée de Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fera retomber sur sa tête la responsabilité du sang versé ». L’expression hébraïque signifie que la responsabilité du meurtre et ses conséquences reviennent sur le coupable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: fera retomber
  rationale: Le hiphil de שוב exprime ici le retour, sur le coupable, des conséquences du sang versé. « Fera retomber » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, plutôt que substitution par un titre.
- source_word: דָּמוֹ ... עַל רֹאשׁוֹ
  choice: sur sa tête le sang qu’il a versé
  rationale: Cette formulation conserve l’image de la tête et explicite que le sang désigne la responsabilité liée au meurtre, sans réduire le texte au seul terme abstrait de culpabilité.
- source_word: פָּגַע
  choice: s’est jeté sur
  rationale: Dans ce contexte violent, le verbe évoque une attaque hostile. Cette traduction préserve la distinction avec le verbe explicite « tuer » qui suit.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: plus justes et meilleurs que lui
  rationale: « Justes » maintient la portée morale et juridique de צדיקים, tandis que « meilleurs » conserve le second terme comparatif sans les fusionner.
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: et les a tués par l’épée
  rationale: Rendu direct de l’acte meurtrier et de son instrument, dans un registre digne mais actuel.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: à l’insu de mon père David
  rationale: Expression française naturelle qui rend la valeur circonstancielle de la conjonction et l’absence de connaissance de David.
- source_word: שַׂר צְבָא יִשְׂרָאֵל / שַׂר צְבָא יְהוּדָה
  choice: chef de l’armée d’Israël / chef de l’armée de Juda
  rationale: Titre militaire clair et moderne, répété de manière cohérente pour les deux hommes.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; la translittération le distingue d’un simple titre.
- issue: Sens de l’expression du sang sur la tête
  choice: Le sang versé retombe sur la tête du meurtrier comme responsabilité et juste rétribution
  alternative: Sa culpabilité de meurtre retombera sur lui
  rationale: Le choix retenu garde l’image concrète de l’hébreu, tandis que la note en explique la valeur idiomatique sans supprimer sa tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression hébraïque, mais « à l’insu de » évite une tournure lourde. Les noms propres suivent des formes françaises usuelles; « Yéter » représente יֶתֶר.
