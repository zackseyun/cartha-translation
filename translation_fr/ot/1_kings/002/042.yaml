  text: וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ וַ/יִּקְרָ֣א לְ/שִׁמְעִ֗י וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/ל֧וֹא הִשְׁבַּעְתִּ֣י/ךָ בַֽ/יהוָ֗ה וָ/אָעִ֤ד בְּ/ךָ֙ לֵ/אמֹ֔ר בְּ/י֣וֹם צֵאתְ/ךָ֗ וְ/הָֽלַכְתָּ֙ אָ֣נֶה וָ/אָ֔נָה יָדֹ֥עַ תֵּדַ֖ע כִּ֣י מ֣וֹת תָּמ֑וּת וַ/תֹּ֧אמֶר אֵלַ֛/י ט֥וֹב הַ/דָּבָ֖ר שָׁמָֽעְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: fr
  text: 'Alors le roi fit appeler Shimeï et lui dit : « Ne t’avais-je pas fait prêter serment par Yahweh et ne t’avais-je pas averti[a] en disant : “Le jour où tu sortiras et iras où que ce soit[b], sache-le bien : tu mourras certainement” ? Et tu m’as répondu : “Cette parole est bonne[c] ; j’ai entendu.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne t’avais-je pas adressé une mise en garde solennelle » ; le verbe peut aussi avoir le sens judiciaire de « témoigner contre toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « iras çà et là », expression signifiant ici « iras où que ce soit ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Cette affaire est bonne » ou « Ce que tu dis est bon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: fait prêter serment par Yahweh
  rationale: Le hifil de שבע exprime le fait d’imposer ou de faire prêter un serment. Cette formulation française conserve la valeur causative et le caractère solennel de l’acte.
- source_word: בַיהוָה
  choice: par Yahweh
  rationale: La préposition introduit celui par qui le serment est prêté, et le tétragramme est rendu par le nom propre « Yahweh ».
- source_word: וָאָעִד בְּךָ
  choice: averti
  rationale: Le hifil de עוד peut signifier avertir, prendre à témoin ou adresser une mise en garde solennelle. « Averti » convient au contexte immédiat, tandis que la nuance judiciaire est signalée en note.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: iras où que ce soit
  rationale: La paire adverbiale signifie littéralement aller çà ou là et, dans ce contexte, désigne tout déplacement hors de la limite imposée.
- source_word: יָדֹעַ תֵּדַע
  choice: sache-le bien
  rationale: L’infinitif absolu renforce le verbe et marque la certitude. « Sache-le bien » restitue naturellement cette insistance en français.
- source_word: מוֹת תָּמוּת
  choice: tu mourras certainement
  rationale: L’infinitif absolu intensifie l’annonce de la mort. L’adverbe « certainement » en transmet la force sans reproduire artificiellement la répétition hébraïque.
- source_word: טוֹב הַדָּבָר
  choice: Cette parole est bonne
  rationale: דבר peut désigner une parole, une déclaration ou une affaire. « Cette parole » conserve ici le lien direct avec la condition énoncée par le roi.
- source_word: שָׁמָעְתִּי
  choice: j’ai entendu
  rationale: La traduction garde le sens lexical direct de שמע. Même si entendre peut impliquer accepter dans ce cadre, elle n’explicite pas une obéissance que le texte ne formule pas.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » le traite comme le nom propre divin et évite de le remplacer par un titre.
- issue: Portée de שָׁמָעְתִּי dans la réponse de Shimeï
  choice: j’ai entendu
  alternative: j’accepte ; j’obéirai
  rationale: Le contexte peut suggérer l’acceptation de la condition, mais la formulation hébraïque demeure « j’ai entendu ». La traduction préserve cette retenue et l’éventuelle tension entre audition, assentiment et obéissance.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours royal conserve sa solennité juridique, avec des formulations naturelles. Les intensifications hébraïques sont rendues idiomatiquement, et les ambiguïtés lexicales pertinentes sont maintenues dans les notes.
