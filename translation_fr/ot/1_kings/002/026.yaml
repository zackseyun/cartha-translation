  text: וּ/לְ/אֶבְיָתָ֨ר הַ/כֹּהֵ֜ן אָמַ֣ר הַ/מֶּ֗לֶךְ עֲנָתֹת֙ לֵ֣ךְ עַל שָׂדֶ֔י/ךָ כִּ֛י אִ֥ישׁ מָ֖וֶת אָ֑תָּה וּ/בַ/יּ֨וֹם הַ/זֶּ֜ה לֹ֣א אֲמִיתֶ֗/ךָ כִּֽי נָשָׂ֜אתָ אֶת אֲר֨וֹן אֲדֹנָ֤/י יְהֹוִה֙ לִ/פְנֵי֙ דָּוִ֣ד אָבִ֔/י וְ/כִ֣י הִתְעַנִּ֔יתָ בְּ/כֹ֥ל אֲשֶֽׁר הִתְעַנָּ֖ה אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: fr
  text: 'Le roi dit au prêtre Abiathar : « Va à Anatoth, sur tes terres, car tu mérites la mort[a]. Mais aujourd’hui, je ne te mettrai pas à mort, parce que tu as porté l’arche du Seigneur Yahweh devant David, mon père, et parce que tu as souffert dans tout ce dont mon père a souffert. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu es un homme de mort », c’est-à-dire passible de mort ou d’exécution.'
    reason: L’idiome hébreu אִישׁ מָוֶת ne se transpose pas naturellement mot à mot en français ; la note conserve sa forme concrète.
lexical_decisions:
- source_word: עֲנָתֹת
  choice: Anatoth
  rationale: Nom propre traditionnellement transcrit « Anatoth » en français.
- source_word: עַל שָׂדֶיךָ
  choice: dans tes terres
  rationale: L’expression désigne les terres d’Abiathar à Anatoth. « Dans tes terres » est naturel en français et conserve le caractère foncier et concret de שָׂדֶה.
- source_word: אִישׁ מָוֶת
  choice: tu mérites la mort
  rationale: Littéralement « un homme de mort » ; l’idiome indique qu’Abiathar est passible de mort. La formulation retenue exprime clairement cette responsabilité judiciaire.
- source_word: אֲמִיתֶךָ
  choice: je ne te ferai pas mourir
  rationale: Le hiphil de מות signifie « faire mourir, mettre à mort ». Cette formulation conserve le causatif hébreu et convient à la décision royale.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: tu as porté l’arche du Seigneur Yahweh
  rationale: נשא décrit ici le port matériel de l’arche. « Le Seigneur Yahweh » rend les deux éléments du titre אֲדֹנָי יְהוִה sans les confondre.
- source_word: לִפְנֵי דָוִד אָבִי
  choice: devant David, mon père
  rationale: לִפְנֵי signifie ici « devant, en présence de ». La virgule marque naturellement l’apposition française.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: tu as partagé toutes les souffrances de mon père
  rationale: Les deux formes évoquent les afflictions subies par Abiathar aux côtés de David. Cette formulation naturelle met en valeur sa solidarité avec David, motif de la clémence de Salomon.
- source_word: כִּי ... וְכִי
  choice: parce que ... et parce que
  rationale: Les deux propositions donnent parallèlement les raisons pour lesquelles Salomon épargne Abiathar ce jour-là.
theological_decisions:
- issue: Rendu du nom divin dans le titre אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le titre composé אֲדֹנָי יְהוִה. « Le Seigneur Yahweh » distingue le titre אֲדֹנָי du nom divin יהוה et préserve les deux éléments sans imposer une lecture confessionnelle particulière.
- issue: Portée de la condamnation d’Abiathar
  choice: tu mérites la mort
  alternative: tu es un homme voué à la mort
  rationale: L’idiome אִישׁ מָוֶת exprime qu’Abiathar est passible d’exécution, tandis que la proposition suivante précise que Salomon choisit de ne pas l’exécuter ce jour-là.
translation_notes:
  register: Français international moderne, digne et direct. Le discours royal reste solennel sans archaïsmes. « Anatoth » suit l’usage biblique français ; « Yahweh » transcrit explicitement le nom divin.
