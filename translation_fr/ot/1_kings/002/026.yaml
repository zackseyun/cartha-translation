  terminology: « Anatoth », « Abiathar », « l’arche » et « le Seigneur Yahweh » sont cohérents avec le texte source et le choix de distinguer אַדֹנָי de יהוה. La note explique correctement l’idiome hébreu sans surinterprétation.
