  text: As the days of David drew near for him to die[a], he commanded Solomon his son, saying,
translation:
  language: fr
  text: 'Comme le moment de sa mort approchait, David donna cet ordre à son fils Salomon :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: Comme le moment de sa mort approchait
  rationale: Littéralement, « les jours de David approchèrent pour mourir ». La formulation française restitue naturellement l’idiome hébreu, qui indique que la mort de David était proche.
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime ici un ordre solennel. « Donna cet ordre » convient à l’introduction du discours direct et reste naturel en français moderne.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: à son fils Salomon
  rationale: Cette formulation rend clairement le complément du verbe et l’apposition indiquant la filiation, dans l’ordre le plus naturel en français.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles qui suivent et rendent la fonction discursive de לֵאמֹר sans le calque lourd « en disant ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. L’idiome hébreu relatif aux « jours de David » est rendu selon son sens afin d’éviter une tournure obscure, tandis que la solennité de l’ordre final est conservée.
