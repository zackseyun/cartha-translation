  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: fr
  text: La nouvelle parvint à Joab, car Joab s’était rallié à Adonias[a], mais il ne s’était pas rallié à Absalom. Joab s’enfuit alors vers la tente de Yahweh et saisit les cornes de l’autel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « s’était tourné à la suite d’Adonias… ne s’était pas tourné à la suite d’Absalom ».'
    reason: lexical_alternative
  - marker: b
    text: Les « cornes » étaient des saillies en forme de corne aux quatre coins de l’autel. Les saisir constituait un appel à la protection ou à la clémence.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה בָּאָה עַד
  choice: La nouvelle parvint à
  rationale: « Nouvelle » exprime naturellement l’information reçue dans ce récit, sans la nuance incertaine de « rumeur »; « parvint à » rend avec élégance l’idée hébraïque d’arriver jusqu’à quelqu’un.
- source_word: נָטָה אַחֲרֵי
  choice: s’était rallié à
  rationale: Dans ce contexte de rivalité dynastique, l’expression désigne un ralliement politique. La même formulation est répétée pour Adonias et Absalom afin de conserver le parallélisme de l’hébreu.
- source_word: וַיָּנָס
  choice: s’enfuit
  rationale: Ce verbe exprime une fuite urgente et convient au registre narratif.
- source_word: אֹהֶל יְהוָה
  choice: la tente de Yahweh
  rationale: Rend directement l’expression hébraïque sans introduire le terme plus technique « tabernacle ».
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: saisit les cornes de l’autel
  rationale: Conserve le geste concret et le vocabulaire cultuel du texte, tandis qu’une note en explique la portée culturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération « Yahweh » préserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- issue: Interprétation politique de נָטָה אַחֲרֵי
  choice: s’était rallié à
  alternative: s’était tourné vers; avait suivi
  rationale: Le contexte concerne l’allégeance à des prétendants au trône. « Se rallier à » rend ce sens sans ajouter de précision doctrinale et maintient la répétition entre les deux propositions.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte les actions principales, tandis que le plus-que-parfait marque les allégeances antérieures. « Adonias » et « Absalom » suivent les formes françaises usuelles des noms bibliques.
