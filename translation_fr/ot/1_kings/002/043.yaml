  text: וּ/מַדּ֕וּעַ לֹ֣א שָׁמַ֔רְתָּ אֵ֖ת שְׁבֻעַ֣ת יְהוָ֑ה וְ/אֶת הַ/מִּצְוָ֖ה אֲשֶׁר צִוִּ֥יתִי עָלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: fr
  text: Pourquoi donc n’as-tu pas respecté le serment prêté au nom de Yahweh[a] et l’ordre que je t’avais imposé[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le serment de Yahweh ». Dans ce contexte, il s’agit du serment prêté en invoquant son nom ou sous son autorité.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « l’ordre que j’ai commandé sur toi ». Autre traduction : « l’ordre que je t’avais donné ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: Pourquoi donc
  rationale: מַדּוּעַ introduit une question de cause (« pourquoi ? ») ; « donc » rend naturellement le lien marqué par וּ avec l’accusation précédente.
- source_word: לֹא שָׁמַרְתָּ
  choice: n’as-tu pas respecté
  rationale: שׁמר signifie garder ou observer. En français actuel, « respecter » convient à la fois à un serment et à un ordre, tout en exprimant l’obligation enfreinte.
- source_word: אֵת שְׁבֻעַת יְהוָה
  choice: le serment de Yahweh
  rationale: La construction hébraïque est conservée sans décider dans le texte principal si le génitif désigne un serment prêté au nom de Yahweh, devant lui ou sous son autorité ; le contexte indique qu’il ne s’agit pas d’un serment prononcé par Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le distinguer d’un titre tel que « le Seigneur ».
- source_word: וְאֶת הַמִּצְוָה
  choice: et l’ordre
  rationale: מִצְוָה désigne ici une injonction précise du roi. « Ordre » est naturel dans ce contexte et évite la répétition pesante « commandement que j’ai commandé ».
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: que je t’avais imposé
  rationale: « Imposé » exprime le sens de צוה et rend la nuance de עַל, littéralement une obligation placée « sur » l’intéressé. Le plus-que-parfait situe naturellement cet ordre avant le manquement reproché.
theological_decisions:
- issue: Sens de « serment de Yahweh »
  choice: Conserver « de Yahweh » dans le texte et préciser l’ambiguïté en note
  alternative: « le serment prêté devant Yahweh » ou « le serment fait au nom de Yahweh »
  rationale: Le contexte favorise un serment prêté par Shiméi sous l’autorité de Yahweh, mais la relation exprimée par le construit hébreu reste concise ; la note évite de faire croire que Yahweh est celui qui a juré sans figer une seule formulation explicative.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin ; sa translittération préserve cette distinction.
translation_notes:
  register: Français international moderne, direct et solennel. « Respecter » régit naturellement les deux compléments, tandis que « imposé » conserve la force de l’obligation exprimée par la préposition hébraïque.
