  naturalness: La formulation est globalement naturelle et de registre approprié. « Le serment prêté au nom de Yahweh » est à la fois plus idiomatique et plus explicite dans le français contemporain. « L'ordre que je t'avais imposé » rend bien la force de l'injonction.
  terminology: « Yahweh » est cohérent avec le rendu demandé du tétragramme. « Ordre » convient à מִצְוָה dans cette parole royale; « imposé » rend de façon idiomatique la nuance de l'obligation placée sur Shiméi.
