source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לִ/שְׁלֹמֹ֑ה כִּי הָלַ֨ךְ שִׁמְעִ֧י מִ/ירוּשָׁלִַ֛ם גַּ֖ת וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: fr
  text: On informa Salomon que Shimeï était allé de Jérusalem à Gath et qu’il était revenu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On informa
  rationale: Le passif narratif indique que l’information fut communiquée à Salomon sans identifier le messager. La tournure française avec « on » conserve cette indétermination de manière naturelle.
- source_word: לִשְׁלֹמֹה
  choice: Salomon
  rationale: La préposition ל marque ici le destinataire de l’information; avec le verbe « informer », le français construit naturellement ce destinataire comme complément direct.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu du rapport au discours indirect.
- source_word: הָלַךְ
  choice: était allé
  rationale: הלך exprime le déplacement. Le plus-que-parfait situe cette action avant le moment où Salomon en fut informé.
- source_word: שִׁמְעִי
  choice: Shimeï
  rationale: Translittération française usuelle du nom hébreu, avec le tréma signalant que les voyelles se prononcent séparément.
- source_word: מִירוּשָׁלִַם
  choice: de Jérusalem
  rationale: La préposition מ indique le point de départ du déplacement.
- source_word: גַּת
  choice: à Gath
  rationale: Bien qu’aucune préposition ne précède le nom en hébreu, Gath fonctionne comme destination de הלך; « à » rend naturellement cette relation en français.
- source_word: וַיָּשֹׁב
  choice: et qu’il était revenu
  rationale: שׁוב signifie revenir ou retourner. La répétition de « que » clarifie en français que cette seconde action appartient elle aussi au contenu du rapport, tandis que le plus-que-parfait la situe avant l’information donnée à Salomon.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La tournure impersonnelle « On informa » évite la lourdeur de « Il fut rapporté » tout en laissant l’informateur anonyme. Aucun explicatif ni harmonisation théologique n’est ajouté.
