source:
  edition: WLC
  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: fr
  text: 'afin que Yahweh accomplisse la parole qu’il a prononcée à mon sujet[a], en disant : « Si tes fils gardent leur voie en marchant devant moi dans la vérité[b], de tout leur cœur et de toute leur âme, en disant : “Tu ne manqueras pas d’un homme sur le trône d’Israël[c].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il m’a adressée ». L’hébreu porte plus directement : « qu’il a prononcée à mon sujet » ou « me concernant ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « fidèlement » ou « avec intégrité ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « un homme de toi ne sera pas retranché de dessus le trône d’Israël »; l’expression signifie que la lignée royale ne manquera pas de représentant sur le trône.'
    reason: idiom_explanation
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat et s’insère naturellement dans la phrase française.
- source_word: יָקִים
  choice: accomplisse
  rationale: Le hiphil de קום signifie ici faire tenir ou rendre effective une parole; « accomplir » exprime naturellement la réalisation de la parole promise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: דְּבָרוֹ
  choice: la parole
  rationale: Conserve le substantif hébreu tout en laissant le contexte indiquer qu’il s’agit d’une promesse.
- source_word: דִּבֶּר עָלַי
  choice: qu’il a prononcée à mon sujet
  rationale: עַל désigne normalement ici l’objet du propos, « au sujet de », sans imposer la lecture contextuelle « qu’il m’a adressée ».
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: veillent sur leur conduite
  rationale: Rend le sens éthique de « garder leur voie » dans un français actuel, tout en conservant l’idée de vigilance.
- source_word: בָנֶיךָ
  choice: tes fils
  rationale: Respecte le masculin pluriel et la référence aux descendants dynastiques de David.
- source_word: לָלֶכֶת לְפָנַי
  choice: en marchant devant moi
  rationale: Conserve la métaphore relationnelle et éthique de la marche devant Dieu; le gérondif exprime la manière de veiller sur leur conduite.
- source_word: בֶּאֱמֶת
  choice: dans la vérité
  rationale: Préserve l’étendue sémantique de אֱמֶת, qui peut évoquer la vérité, la fidélité ou l’intégrité.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: de tout leur cœur et de toute leur âme
  rationale: Formulation française consacrée et claire qui exprime la totalité de l’engagement intérieur.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: tu ne manqueras pas d’un homme sur le trône d’Israël
  rationale: Rend l’idiome dynastique de façon intelligible sans remplacer explicitement « homme » par « descendant » ni effacer la formulation négative.
theological_decisions:
- issue: Caractère conditionnel de la promesse davidique
  choice: La condition est maintenue explicitement par « Si tes fils… alors… ».
  alternative: Atténuer la condition en la transformant en simple exhortation ou harmoniser le verset avec des formulations inconditionnelles de la promesse.
  rationale: L’hébreu rattache expressément la continuité dynastique à la conduite des fils de David; la traduction conserve cette tension théologique.
- issue: Sens de בֶּאֱמֶת
  choice: dans la vérité
  alternative: fidèlement; avec intégrité
  rationale: La formulation retenue ne réduit pas le terme à une seule dimension morale et conserve son ambiguïté entre vérité, fidélité et intégrité.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores bibliques de la marche et du cœur sont conservées; les tournures les plus sémitiques sont légèrement explicitées sans supprimer leur portée.
