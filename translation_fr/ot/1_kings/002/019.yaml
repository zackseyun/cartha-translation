base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: fr
  text: Bethsabée se rendit donc auprès du roi Salomon pour lui parler au sujet d’Adonias. Le roi se leva à sa rencontre et se prosterna devant elle. Puis il s’assit sur son trône et fit placer un trône pour la mère du roi, qui s’assit à sa droite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: au sujet d’Adonias
  rationale: La préposition עַל peut indiquer le sujet ou la personne en faveur de laquelle on intervient. « Au sujet de » conserve cette ouverture sans imposer explicitement l’idée d’intercession.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: se prosterna devant elle
  rationale: Le verbe שׁחה décrit ici un geste marqué de déférence; « se prosterner devant » en rend clairement la portée honorifique.
- source_word: כִּסֵּא
  choice: trône
  rationale: Le même nom désigne d’abord le trône de Salomon, puis le siège placé pour la reine mère. Répéter « trône » préserve ce parallélisme et l’honneur exceptionnel qui lui est accordé.
theological_decisions:
- issue: Nature de la démarche de Bethsabée en faveur d’Adonias
  choice: au sujet d’Adonias
  alternative: en faveur d’Adonias
  rationale: Le contexte suggère qu’elle porte sa demande, mais le texte hébreu dit littéralement qu’elle parle « au sujet de » lui. La traduction retenue évite de préciser davantage que la formulation source.
- issue: Geste de Salomon envers sa mère
  choice: se prosterna devant elle
  alternative: s’inclina devant elle
  rationale: « Se prosterna » rend la force habituelle du verbe sans faire de ce geste un acte cultuel; dans ce récit, il exprime l’honneur royal et filial.
translation_notes:
  register: Français international moderne, narratif et digne. La succession des actions est répartie en phrases naturelles, tandis que la répétition de « trône » et le titre « la mère du roi » restent proches de la structure hébraïque.
