base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: fr
  text: 'Le roi Salomon répondit à sa mère : « Pourquoi demandes-tu Abishag la Sunamite pour Adonias ? Demande donc aussi la royauté[a] pour lui, puisqu’il est mon frère aîné — pour lui, pour le prêtre Abiathar et pour Joab, fils de Cerouya ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le royaume » ou « le pouvoir royal ». Le terme hébreu peut désigner le règne ou l’autorité royale ; ici, « la royauté » met en relief la portée dynastique que Salomon attribue à la demande.
    reason: Alternative lexicale pour הַמְּלוּכָה et préservation de son étendue sémantique.
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה וַיֹּאמֶר לְאִמּוֹ
  choice: Le roi Salomon répondit à sa mère
  rationale: La formule hébraïque « répondit et dit » est rendue par le verbe français naturel « répondit », qui exprime à lui seul la réponse suivie du discours, sans ajouter le nom de la mère absent du verset.
- source_word: וְלָמָה אַתְּ שֹׁאֶלֶת
  choice: Pourquoi demandes-tu
  rationale: Le présent français convient à la demande en cours. Le tutoiement correspond à la deuxième personne féminine singulière et à la relation familiale.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: Abishag la Sunamite
  rationale: Le gentilé est conservé sous sa forme française biblique usuelle et identifie Abishag comme originaire de Sunem.
- source_word: לַאֲדֹנִיָּהוּ
  choice: pour Adonias
  rationale: La préposition indique le bénéficiaire de la demande ; « pour » est direct et idiomatique.
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: Demande donc aussi pour lui la royauté
  rationale: « La royauté » désigne ici le statut et le pouvoir de roi plutôt que le seul territoire. « Aussi » restitue l’escalade ironique de la réponse.
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: puisqu’il est mon frère aîné
  rationale: Cette formulation naturelle conserve l’argument fondé sur l’ordre de naissance et laisse entendre la portée dynastique du propos.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: — pour lui, pour le prêtre Abiathar et pour Joab, fils de Tserouya !
  rationale: Le français conserve l’ellipse hébraïque et la répétition de « pour », qui associent Adonias à ses soutiens et donnent à la phrase sa force accusatrice.
theological_decisions:
- issue: Portée politique et dynastique de la demande concernant Abishag
  choice: Rendre הַמְּלוּכָה par « la royauté » et maintenir le lien explicite établi par Salomon.
  alternative: Employer « le royaume » ou traduire plus librement par « le trône ».
  rationale: Le texte hébreu présente lui-même la demande d’Abishag comme liée à une prétention au pouvoir royal. « Royauté » préserve cette implication sans préciser davantage le mécanisme politique ou théologique.
- issue: Association d’Adonias, d’Abiathar et de Joab
  choice: Conserver la construction elliptique « pour lui, pour… et pour… ».
  alternative: 'Expliciter : « demande la royauté pour Adonias, Abiathar et Joab » ou « eux qui le soutiennent ».'
  rationale: La syntaxe hébraïque est abrupte et peut porter une nuance rhétorique difficile à résoudre. L’ellipse est donc maintenue plutôt que transformée en affirmation explicative.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde la vigueur ironique de Salomon. Les noms propres suivent des formes françaises bibliques courantes ; la ponctuation avec tiret conserve l’ajout abrupt de la fin du verset.
