  yaml_path: translation/ot/1_kings/002/021.yaml
  text: And she said, “Let Abishag the Shunammite be given to Adonijah your brother as a wife.”
translation:
  language: fr
  text: 'Elle dit : « Qu’Abishag la Sunamite soit donnée pour femme à ton frère Adonias. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le waw consécutif fait progresser le récit. En français, la simple juxtaposition rend naturellement cet enchaînement sans alourdir la phrase par « Et ».
- source_word: יֻתַּן
  choice: Qu’… soit donnée
  rationale: Le jussif passif exprime ici une demande. Cette tournure française conserve à la fois la valeur volitive et la voix passive.
- source_word: אֶת אֲבִישַׁג
  choice: Abishag
  rationale: אֶת marque l’objet direct défini et ne se traduit pas séparément. Le nom propre est translittéré selon sa forme française courante.
- source_word: הַשֻּׁנַמִּית
  choice: la Sunamite
  rationale: Le gentilé identifie Abishag par son origine à Shunem. La forme traditionnelle française est concise et intelligible.
- source_word: לַאֲדֹנִיָּהוּ
  choice: à … Adonias
  rationale: La préposition ל indique le bénéficiaire dans la construction exprimant le don d’une femme en mariage. L’ordre français naturel place « à ton frère Adonias » après « pour femme ».
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le suffixe masculin singulier s’adresse directement à Salomon et conserve la portée familiale de la requête.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Dans ce contexte matrimonial, l’expression signifie donner une femme en mariage. « Pour femme » est une formulation française naturelle, claire et digne.
