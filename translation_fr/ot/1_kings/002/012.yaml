id: 1KI.2.12
reference: 1 Kings 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: fr
  text: Salomon siégea sur le trône de David, son père, et son règne fut solidement établi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son royaume fut solidement établi » ou « sa royauté fut solidement établie ».
    reason: Le nom hébreu peut désigner le règne, le royaume ou la royauté.
lexical_decisions:
- source_word: יָשַׁב
  choice: siégea
  rationale: Avec « sur le trône », le verbe décrit Salomon occupant la place royale. « Siégea » conserve l’image tout en exprimant naturellement l’exercice de la royauté.
- source_word: כִּסֵּא
  choice: trône
  rationale: Dans ce contexte de succession royale, le terme désigne clairement le trône plutôt qu’un simple siège.
- source_word: אָבִיו
  choice: son père
  rationale: David est ici le père direct de Salomon; le sens familial ordinaire convient.
- source_word: וַתִּכֹּן
  choice: fut solidement établi
  rationale: La forme niphal exprime un état affermi, stable ou assuré. La tournure passive française conserve ce sens résultatif.
- source_word: מַלְכֻתוֹ
  choice: son règne
  rationale: מַלְכוּת peut désigner le règne, la royauté ou le royaume. Ici, le contexte immédiat porte surtout sur la stabilité du pouvoir exercé par Salomon; « règne » est naturel sans exclure les autres nuances, signalées en note.
- source_word: מְאֹד
  choice: solidement
  rationale: L’intensif hébreu renforce l’idée d’établissement. En français, « solidement établi » en rend la force plus naturellement qu’un calque tel que « très établi ».
theological_decisions:
- issue: La succession royale sur le trône de David
  choice: Présenter l’accession de Salomon et l’affermissement de son règne comme un constat historique.
  alternative: Employer une formulation qui soulignerait explicitement sa légitimité dynastique ou une portée messianique ultérieure.
  rationale: Le verset rapporte directement l’occupation du trône de David par Salomon et la consolidation de son pouvoir. Il ne formule pas lui-même les développements théologiques ultérieurs associés au trône davidique.
translation_notes:
  register: Français international moderne, sobre et digne. « Siégea sur le trône » maintient l’image royale dans une formulation naturelle. La note est placée après la proposition qu’elle précise.
