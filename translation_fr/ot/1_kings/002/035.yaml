source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע תַּחְתָּ֖י/ו עַל הַ/צָּבָ֑א וְ/אֶת צָד֤וֹק הַ/כֹּהֵן֙ נָתַ֣ן הַ/מֶּ֔לֶךְ תַּ֖חַת אֶבְיָתָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: fr
  text: Le roi plaça Benaya, fils de Yehoyada, à la tête de l’armée, à la place de Joab[a], et il plaça le prêtre Sadoc à la place d’Abiatar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à sa place » ; dans le contexte immédiat, le pronom renvoie à Joab, qui commandait auparavant l’armée.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: plaça
  rationale: Le verbe signifie littéralement « donner, mettre »; dans ce contexte administratif, « placer » exprime naturellement l’installation dans une fonction tout en restant proche de l’hébreu.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: Benaya, fils de Joad
  rationale: Transcription française usuelle des noms et rendu direct du patronyme hébreu.
- source_word: תַּחְתָּיו
  choice: à la place de Joab
  rationale: Le suffixe pronominal renvoie, dans le contexte immédiat, à Joab; expliciter le référent évite en français une ambiguïté artificielle.
- source_word: עַל־הַצָּבָא
  choice: à la tête de l’armée
  rationale: Dans ce contexte, צָבָא désigne l’armée et la préposition עַל marque l’autorité exercée sur elle; cette tournure française exprime naturellement le commandement militaire.
- source_word: צָדוֹק הַכֹּהֵן
  choice: le prêtre Sadoc
  rationale: Le titre apposé est conservé dans un ordre naturel en français, avec la transcription française traditionnelle du nom.
- source_word: תַּחַת אֶבְיָתָר
  choice: à la place d’Abiatar
  rationale: תַּחַת exprime ici le remplacement dans une charge; « à la place de » en conserve précisément le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque de « le roi » est allégée dans la seconde proposition par « il », sans perte de référent. Les noms suivent des formes françaises bibliques largement reconnues.
