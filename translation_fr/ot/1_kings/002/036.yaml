base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: fr
  text: 'Le roi envoya chercher Shimeï et lui dit : « Construis-toi une maison à Jérusalem et habite là. Ne sors pas de là pour aller où que ce soit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ici ou là », c’est-à-dire « où que ce soit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ וַיִּקְרָא לְשִׁמְעִי
  choice: Le roi envoya chercher Shimeï
  rationale: 'La formulation française rend naturellement les deux verbes de la formule narrative : le roi envoie quelqu’un afin de faire venir Shimeï. Répéter littéralement « envoya et appela » serait peu idiomatique en français.'
- source_word: בְּנֵה לְךָ בַיִת
  choice: Construis-toi une maison
  rationale: L’impératif direct et le datif d’intérêt לְךָ sont rendus par la construction française naturelle « construis-toi » ; « maison » désigne bien ici le lieu physique de résidence.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition française « à » est la manière idiomatique d’exprimer la localisation dans une ville.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: et habite là
  rationale: Dans ce contexte de résidence imposée, ישׁב exprime le fait d’habiter ou de demeurer. « Habite » est actuel, clair et fidèle.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: Ne sors de là
  rationale: Cette formulation conserve le mouvement exprimé par יצא et la référence explicite au lieu par מִשָּׁם.
- source_word: אָנֶה וָאָנָה
  choice: sous aucun prétexte
  rationale: Dans cette interdiction de quitter Jérusalem, l’expression distributive signifie qu’aucune sortie n’est permise, où que ce soit. La tournure française choisie exprime naturellement le caractère absolu de l’ordre, tandis que la note conserve l’image littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le discours royal garde la force de l’impératif sans archaïsme. La graphie « Shimeï » rend le nom hébreu שִׁמְעִי de façon lisible en français.
