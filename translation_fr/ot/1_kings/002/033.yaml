  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: fr
  text: Leur sang retombera sur la tête de Joab et sur celle de sa descendance à jamais[a]. Mais pour David, pour sa descendance, pour sa maison et pour son trône, il y aura la paix à jamais, de la part de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « leur sang ». Cette expression évoque ici la responsabilité du sang versé et les conséquences du meurtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: Que … retombe
  rationale: Dans cette déclaration judiciaire, le parfait précédé de la conjonction exprime une conséquence prononcée avec une nuance volitive. « Retomber sur la tête » restitue naturellement en français l’image du retour de la culpabilité sanglante sur son auteur.
- source_word: דְמֵיהֶם
  choice: leur sang
  rationale: Le pluriel hébreu désigne le sang des deux hommes tués. La traduction conserve l’expression concrète et laisse la note expliciter sa portée judiciaire.
- source_word: בְּרֹאשׁ
  choice: sur la tête de
  rationale: Cette expression idiomatique attribue à quelqu’un la responsabilité et les conséquences de ses actes, tout en conservant la métaphore hébraïque.
- source_word: זַרְעוֹ
  choice: sa descendance
  rationale: « Descendance » est collectif, naturel en français moderne et adapté au contexte dynastique, sans le caractère trop littéral de « semence ».
- source_word: לְעֹלָם / עַד עוֹלָם
  choice: à jamais / pour toujours
  rationale: Les deux expressions indiquent une durée indéfiniment prolongée. La légère variation française évite une répétition pesante sans modifier le sens.
- source_word: יִהְיֶה שָׁלוֹם
  choice: reçoivent … la paix
  rationale: Cette formulation française rend la paix destinée à David et aux siens tout en se combinant naturellement avec מֵעִם, qui en indique la source. « Paix » préserve l’ampleur de שָׁלוֹם.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: David, sa descendance, sa maison et son trône
  rationale: Les quatre bénéficiaires sont conservés. « Maison » et « trône » maintiennent leur portée dynastique et royale.
- source_word: מֵעִם יְהוָה
  choice: qui vient de Yahweh
  rationale: La tournure indique clairement et naturellement que Yahweh est la source de cette paix.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve sa valeur de nom propre.
theological_decisions:
- issue: Contraste entre le jugement de la lignée de Joab et la paix accordée à celle de David
  choice: Mais que David…
  alternative: Et pour David…
  rationale: La conjonction hébraïque peut être simplement coordonnante, mais le contenu oppose nettement le sang qui retombe sur Joab à la paix venant de Yahweh pour David. « Mais » rend ce contraste sans ajouter une idée étrangère.
- issue: Valeur de שָׁלוֹם dans le contexte dynastique
  choice: la paix
  alternative: le bien-être / la prospérité
  rationale: « Paix » conserve la richesse du terme, qui peut englober sécurité, stabilité et bien-être, sans le réduire à la seule prospérité.
- issue: Nuance modale des deux propositions
  choice: 'Deux formulations volitives : « Que… retombe » et « que… reçoivent »'
  alternative: 'Deux futurs déclaratifs : « retombera » et « il y aura »'
  rationale: Le contexte immédiat est une sentence prononcée par Salomon. Le français volitif reflète la force de la déclaration tout en maintenant le parallélisme entre jugement et bénédiction.
translation_notes:
  register: Français international moderne, digne et accessible. La structure équilibrée conserve le contraste judiciaire et dynastique du texte hébreu. Les exclamations rendent la force de la sentence sans employer un registre archaïque.
