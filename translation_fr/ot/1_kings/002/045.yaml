id: 1KI.2.45
reference: 1 Kings 2:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: fr
  text: Mais le roi Salomon sera béni[a], et le trône de David sera affermi devant Yahweh pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le roi Salomon est béni ». En hébreu, cette proposition sans verbe exprimé peut se comprendre comme une déclaration au présent, bien que le contexte permette aussi le sens futur retenu dans le texte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ שְׁלֹמֹה
  choice: Mais le roi Salomon
  rationale: Le וְ marque ici naturellement le contraste avec le jugement prononcé contre Shiméï au verset précédent. « Mais » rend ce mouvement discursif, tandis que « le roi Salomon » traduit directement le groupe nominal hébreu.
- source_word: בָּרוּךְ
  choice: sera béni
  rationale: Le participe passif/adjectif signifie « béni ». Dans cette déclaration royale tournée vers l’avenir et coordonnée avec יִהְיֶה נָכוֹן, le futur français exprime naturellement sa portée prospective, sans exclure la lecture présente signalée en note.
- source_word: וְ/כִסֵּא דָוִד
  choice: et le trône de David
  rationale: La construction génitive française reproduit clairement l’état construit hébreu et conserve la coordination.
- source_word: יִהְיֶה נָכוֹן
  choice: sera affermi
  rationale: L’expression indique que le trône sera rendu ferme, stable ou assuré. « Sera affermi » est naturel dans un contexte dynastique et reste proche de l’image hébraïque.
- source_word: לִ/פְנֵי יְהוָה
  choice: devant Yahweh
  rationale: « Devant » conserve le sens spatial et relationnel de לִפְנֵי, tandis que le nom divin est translittéré « Yahweh ».
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression française courante rend clairement la durée indéfinie ou perpétuelle exprimée par l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Valeur temporelle de בָּרוּךְ
  choice: 'futur : « sera béni »'
  alternative: 'présent : « est béni »'
  rationale: La proposition hébraïque est sans verbe exprimé et permet une déclaration présente. Toutefois, sa coordination avec « sera affermi » et le contexte de la sentence favorisent ici une orientation future. La note maintient l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste concise et proche de la proclamation royale hébraïque. « Affermi » a été préféré à « établi » pour exprimer plus directement la stabilité du trône.
