  text: וַ/יִּשְׁלַח֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בְּ/יַ֖ד בְּנָיָ֣הוּ בֶן יְהוֹיָדָ֑ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/025.yaml
  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: fr
  text: Alors le roi Salomon envoya Benaya, fils de Yehoyada[a]. Celui-ci le frappa, et il mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « envoya par la main de Benaya, fils de Yehoyada »; cette expression signifie qu’il le chargea d’agir en son nom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le verbe שׁלח désigne simplement l’action d’envoyer. « Envoya » conserve la formulation ordinaire de l’hébreu sans expliciter prématurément l’ordre d’exécution.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: le roi Salomon
  rationale: Cette formulation française naturelle préserve à la fois le titre royal et le nom propre.
- source_word: בְּיַד
  choice: envoya Benaya
  rationale: L’expression בְּיַד, littéralement « par la main de », marque ici l’intermédiaire chargé d’agir. En français naturel, Benaya devient le complément direct d’« envoya »; le sens littéral est signalé en note.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya, fils de Yehoyada
  rationale: Les formes « Benaya » et « Yehoyada » transcrivent les noms hébreux de manière lisible en français, et la virgule rend naturellement le patronyme.
- source_word: וַיִּפְגַּע בּוֹ
  choice: Celui-ci le frappa
  rationale: Avec la préposition ב, פגע peut exprimer une rencontre hostile ou le fait de frapper. « Le frappa » préserve cette portée sans absorber la mention explicite de la mort dans le verbe; « Celui-ci » identifie clairement Benaya comme sujet.
- source_word: וַיָּמֹת
  choice: et il mourut
  rationale: La coordination simple reproduit la succession narrative de l’hébreu et maintient l’énoncé explicite de la mort.
