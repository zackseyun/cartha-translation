  text: וְ/עַתָּ֗ה שְׁאֵלָ֤ה אַחַת֙ אָֽנֹכִי֙ שֹׁאֵ֣ל מֵֽ/אִתָּ֔/ךְ אַל תָּשִׁ֖בִי אֶת פָּנָ֑/י וַ/תֹּ֥אמֶר אֵלָ֖י/ו דַּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/016.yaml
  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: fr
  text: 'Et maintenant, j’ai une demande à te faire : ne me repousse pas[a]. Elle lui répondit : « Parle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne fais pas revenir mon visage », expression hébraïque signifiant : « ne me refuse pas » ou « ne rejette pas ma demande ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Marque la progression du dialogue tout en conservant la valeur connective et temporelle de l’hébreu.
- source_word: שְׁאֵלָה אַחַת
  choice: une demande
  rationale: שְׁאֵלָה désigne une demande ou requête. En français, « une demande » exprime naturellement l’unicité déjà portée par l’article indéfini dans ce contexte.
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: j’ai … à te faire
  rationale: Formulation française idiomatique qui rend l’acte présent de sollicitation exprimé par le pronom indépendant et le participe hébreu.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: ne me repousse pas
  rationale: Littéralement, l’expression demande de ne pas « faire revenir/détourner [le] visage » du requérant. « Ne me repousse pas » transmet clairement la valeur idiomatique sans suggérer un simple mouvement physique.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Elle lui répondit
  rationale: Dans cet échange, le verbe courant « dire » introduit une réponse directe ; « répondit » rend naturellement cette fonction discursive.
- source_word: דַּבֵּר
  choice: Parle
  rationale: Impératif bref et direct qui invite Adonias à formuler sa demande, conformément à l’hébreu.
