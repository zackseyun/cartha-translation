revisions:
- from: 'On rapporta au roi Salomon que Joab s’était enfui vers la tente de Yahvé[a] et qu’il se tenait près de l’autel. Alors Salomon envoya Benaya, fils de Joad, avec cet ordre : « Va, frappe-le à mort[b]. »'
  to: 'On rapporta au roi Salomon que Joab s’était enfui vers la tente de Yahvé[a], et le voilà près de l’autel. Alors Salomon envoya Benaya, fils de Yehoyada, avec cet ordre : « Va, attaque-le[b]. »'
  rationale: La révision corrige le patronyme de Benaya, restitue plus fidèlement l’effet de « voici »/« et voilà » et évite de présenter comme explicite dans le verbe même la portée mortelle que le contexte narratif établit. Elle maintient l’antériorité de la fuite, le nom divin Yahvé et un français moderne international.
