    reason: lexical_alternative
  revision_rationale: La révision corrige le patronyme de Benaya, restitue plus fidèlement l’effet de « voici »/« et voilà » et évite de présenter comme explicite dans le verbe même la portée mortelle que le contexte narratif établit. Elle maintient l’antériorité de la fuite, le nom divin Yahvé et un français moderne international.
