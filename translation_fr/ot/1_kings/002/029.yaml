  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: fr
  text: 'On rapporta au roi Salomon que Joab s’était enfui vers la tente de Yahvé[a], et le voilà près de l’autel. Alors Salomon envoya Benaya, fils de Yehoyada, avec cet ordre : « Va, attaque-le[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tente du SEIGNEUR ». L’hébreu porte le nom divin YHWH.
    reason: divine_name_alternative
  - marker: b
    text: Ou « va, frappe-le » ou « va, tombe sur lui ». Le verbe hébreu peut désigner le fait d’attaquer ou de frapper quelqu’un; le contexte narratif indique que l’ordre aboutit à sa mise à mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: On rapporta
  rationale: Le hophal de נגד exprime ici qu’une information est portée à la connaissance du roi. La tournure impersonnelle conserve le passif hébreu dans un français naturel.
- source_word: נָס
  choice: s’était enfui
  rationale: Le plus-que-parfait marque clairement que la fuite de Joab précède le rapport fait à Salomon.
- source_word: אֶל אֹהֶל יְהוָה
  choice: vers la tente de Yahvé
  rationale: אֹהֶל signifie littéralement « tente »; « vers » convient à la fuite en direction de ce lieu. Le nom divin est rendu par « Yahvé ».
- source_word: וְהִנֵּה אֵצֶל הַמִּזְבֵּחַ
  choice: et qu’il se tenait près de l’autel
  rationale: Dans le contenu rapporté, cette formulation française rend la mise en évidence produite par הִנֵּה sans l’archaïsme de « voici ». Le verbe « se tenait » explicite naturellement la proposition nominale.
- source_word: וַיִּשְׁלַח
  choice: Alors Salomon envoya
  rationale: « Alors » marque la progression narrative et la réaction de Salomon au rapport reçu.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya, fils de Joad
  rationale: Formes françaises traditionnelles et intelligibles des noms propres, avec le patronyme exprimé naturellement.
- source_word: לֵאמֹר
  choice: avec cet ordre
  rationale: Cette formulation idiomatique introduit directement les paroles confiées au messager tout en conservant leur force directive.
- source_word: פְּגַע בּוֹ
  choice: frappe-le à mort
  rationale: פגע avec ב peut désigner le fait de frapper ou d’attaquer quelqu’un. Le contexte d’exécution indique une frappe létale; la formulation garde l’image du coup plutôt que de réduire le verbe à « tue-le ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » rend le nom propre en français courant plutôt que de lui substituer un titre, tout en signalant en note l’équivalent traditionnel.
- issue: Portée létale de פְּגַע בּוֹ
  choice: frappe-le à mort
  alternative: attaque-le
  rationale: Le contexte immédiat est celui d’un ordre d’exécution. « À mort » exprime cette portée contextuelle, tandis que la note conserve l’étendue lexicale du verbe.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe évite les calques lourds tout en conservant l’antériorité de la fuite, la proximité de l’autel et la violence explicite de l’ordre.
