  edition: WLC
  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: fr
  text: Et maintenant, aussi vrai que Yahvé est vivant, lui qui m’a établi, qui m’a fait asseoir sur le trône de David, mon père, et qui m’a fait une maison[a], comme il l’avait promis, Adonias sera assurément mis à mort aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’a établi une dynastie ». Ici, le mot hébreu traduit par « maison » désigne probablement une lignée royale durable, et non un bâtiment.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: aussi vrai que Yahvé est vivant
  rationale: Cette formulation française naturelle conserve la force de la formule hébraïque de serment et l’appel explicite au Dieu vivant.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du nom divin préserve ici le nom personnel présent dans le texte hébreu.
- source_word: הֱכִינַנִי
  choice: m’a affermi
  rationale: Le hiphil de כון exprime l’idée de rendre ferme, d’établir ou de confirmer. « M’a affermi » convient au contexte où la royauté de Salomon est rendue stable.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: m’a fait asseoir sur le trône
  rationale: La tournure causative rend explicitement le hiphil de ישׁב tout en restant idiomatique en français.
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: le trône de David, mon père
  rationale: Cette formulation suit étroitement la chaîne construite hébraïque et reste claire en français moderne.
- source_word: עָשָׂה לִי בַּיִת
  choice: m’a fait une maison
  rationale: Le texte conserve l’image hébraïque de la « maison », qui peut désigner ici une lignée royale. Une note explicite cette portée dynastique sans la substituer au texte.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: comme il l’avait promis
  rationale: Dans ce contexte d’engagement divin accompli, « promis » exprime naturellement la portée de « parlé ».
- source_word: כִּי
  choice: construction emphatique du serment
  rationale: La certitude portée par כִּי est rendue en français par la formule globale « aussi vrai que… », sans ajout lourd tel que « assurément ».
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent direct et naturel en français moderne.
- source_word: יוּמַת
  choice: sera mis à mort
  rationale: 'Le hophal de מות est passif-causatif : Adonias ne mourra pas simplement, il sera exécuté sur ordre royal.'
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forme française traditionnelle et largement reconnue de ce nom biblique.
theological_decisions:
- issue: Sens de « maison » dans le langage royal et dynastique
  choice: Conserver « maison » dans le texte et signaler en note son sens probable de lignée ou dynastie
  alternative: Traduire directement par « dynastie » ou « lignée royale »
  rationale: בַּיִת peut désigner une dynastie dans le contexte de la promesse davidique. Le maintien de « maison » préserve l’image et les liens intertextuels de l’hébreu, tandis que la note évite qu’elle soit comprise seulement comme un bâtiment.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe ample conserve la solennité du serment royal sans archaïsmes. Le nom divin est rendu par « Yahvé ».
