  text: וַ/תֹּ֗אמֶר שְׁאֵלָ֨ה אַחַ֤ת קְטַנָּה֙ אָֽנֹכִי֙ שֹׁאֶ֣לֶת מֵֽ/אִתָּ֔/ךְ אַל תָּ֖שֶׁב אֶת פָּנָ֑/י וַ/יֹּֽאמֶר לָ֤/הּ הַ/מֶּ֨לֶךְ֙ שַׁאֲלִ֣י אִמִּ֔/י כִּ֥י לֹֽא אָשִׁ֖יב אֶת פָּנָֽיִ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/020.yaml
  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: fr
  text: 'Elle dit : « Je te demande une seule petite faveur ; ne me repousse pas. » Le roi lui répondit : « Demande, ma mère, car je ne te repousserai pas. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne fais pas revenir ma face » et « je ne ferai pas revenir ta face » ; expression signifiant ici ne pas repousser quelqu’un venu présenter une demande.'
    reason: La note rend visible l’image hébraïque inhabituelle, difficile à conserver telle quelle dans un français naturel.
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: une seule petite faveur
  rationale: L’expression désigne une demande présentée comme modeste. « Faveur » est idiomatique en français dans ce contexte de requête adressée au roi, tandis que « une seule » conserve אַחַת.
- source_word: אַל תָּשֶׁב אֶת פָּנָי / לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: ne me repousse pas / je ne te repousserai pas
  rationale: Littéralement, l’hébreu dit « ne fais pas revenir ma face / je ne ferai pas revenir ta face ». L’équivalent idiomatique français exprime le refus de la personne venue présenter une requête, et préserve la répétition entre la demande et la réponse.
- source_word: שַׁאֲלִי אִמִּי
  choice: Demande, ma mère
  rationale: Traduction directe de l’impératif féminin et du terme d’adresse respectueux et familial.
theological_decisions:
- issue: Portée de la promesse royale
  choice: Conserver la formulation personnelle « je ne te repousserai pas » sans expliciter qu’il accordera nécessairement la faveur.
  alternative: « je ne refuserai pas ta demande »
  rationale: Le texte emploie l’idiome de la « face » et ne nomme pas ici directement la demande comme objet du refus. La formulation retenue évite de transformer la courtoisie royale en promesse plus explicite qu’en hébreu.
translation_notes:
  register: Français moderne, digne et oralement naturel. Le parallélisme entre les paroles de la mère et la réponse du roi est maintenu ; l’idiome hébreu de la face est expliqué en note plutôt que reproduit de manière obscure.
