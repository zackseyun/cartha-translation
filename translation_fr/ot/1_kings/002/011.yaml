  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: fr
  text: 'David régna sur Israël pendant quarante ans : à Hébron, il régna sept ans, et à Jérusalem, il régna trente-trois ans.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ דָּוִד
  choice: David régna… pendant
  rationale: L’expression hébraïque « les jours où David régna » indique ici la durée de son règne. En français moderne, « régna… pendant » transmet naturellement cette valeur sans conserver un calque peu idiomatique.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec le verbe מָלַךְ, la préposition עַל désigne le peuple sur lequel s’exerce la royauté ; « régner sur » est l’expression française usuelle.
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarante ans
  rationale: Rendu direct du nombre et de l’unité de temps.
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: à Hébron, il régna sept ans
  rationale: La préposition בְּ marque ici le lieu. « À Hébron » est idiomatique pour une ville, et la répétition de « il régna » respecte la structure hébraïque.
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: et à Jérusalem, il régna trente-trois ans
  rationale: La conjonction, le repère géographique et la répétition du verbe sont conservés ; le nombre composé est formulé selon l’usage français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le début idiomatique explicite la durée exprimée par « les jours » en hébreu, tandis que le parallélisme des deux lieux de règne est préservé.
