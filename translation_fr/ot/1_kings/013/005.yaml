  source_fidelity: Le sens général est fidèle. « Se fendit » rend convenablement נִקְרָע et « l’homme de Dieu » conserve le titre hébreu. Pour וַיִּשָּׁפֵךְ… מִן, une tournure passive explicite restitue plus exactement le déversement depuis l’autel.
