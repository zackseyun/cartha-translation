  text: וְ/הַ/מִּזְבֵּ֣חַ נִקְרָ֔ע וַ/יִּשָּׁפֵ֥ךְ הַ/דֶּ֖שֶׁן מִן הַ/מִּזְבֵּ֑חַ כַּ/מּוֹפֵ֗ת אֲשֶׁ֥ר נָתַ֛ן אִ֥ישׁ הָ/אֱלֹהִ֖ים בִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: fr
  text: L’autel se fendit, et les cendres furent répandues hors de l’autel, conformément au signe[a] que l’homme de Dieu avait donné par la parole de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme le signe » ou « conformément au prodige ». Le mot hébreu מוֹפֵת peut désigner un signe, un prodige ou un présage.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Rendu français courant et précis de מִזְבֵּחַ dans ce contexte cultuel, sans explicitation superflue.
- source_word: נִקְרָע
  choice: se fendit
  rationale: Le verbe קרע exprime ici la rupture physique de l’autel. « Se fendit » restitue naturellement en français la valeur passive-résultative de la forme hébraïque.
- source_word: וַיִּשָּׁפֵךְ הַדֶּשֶׁן
  choice: les cendres se répandirent
  rationale: דֶּשֶׁן désigne ici les cendres ou résidus sacrificiels; le pluriel français est idiomatique. « Se répandirent » rend le déversement exprimé par שׁפך sans suggérer nécessairement une action humaine.
- source_word: מִן הַמִּזְבֵּחַ
  choice: hors de l’autel
  rationale: Cette formulation rend clairement le mouvement depuis l’autel marqué par מִן et convient au déversement des cendres.
- source_word: כַּמּוֹפֵת
  choice: conformément au signe
  rationale: La préposition כְּ indique ici la correspondance avec le signe annoncé; מוֹפֵת peut désigner un signe, un prodige ou un présage. Le choix principal reste neutre et intelligible.
- source_word: אֲשֶׁר נָתַן
  choice: que … avait donné
  rationale: Conserve le sens direct de נתן et l’antériorité de l’annonce par rapport à son accomplissement.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Maintient le titre hébreu traditionnel sans l’interpréter plus étroitement comme « prophète ».
- source_word: בִּדְבַר יְהוָה
  choice: par la parole de Yahweh
  rationale: Préserve la formule hébraïque et sa possible nuance d’autorité ou de commandement, sans la réduire à « ordre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de lui substituer un titre.
- issue: Nature de מוֹפֵת
  choice: signe
  alternative: prodige ou présage
  rationale: Dans le contexte, l’événement annoncé authentifie la parole de l’homme de Dieu. « Signe » conserve cette fonction sans exclure la dimension prodigieuse, signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire tout en restant immédiatement compréhensible; la syntaxe demeure proche de la progression hébraïque sans être artificielle.
