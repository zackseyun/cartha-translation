base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: fr
  text: Et voici que des hommes passaient. Ils virent le cadavre jeté sur le chemin et le lion qui se tenait à côté du cadavre. Ils arrivèrent dans la ville où habitait le vieux prophète et en parlèrent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parlèrent ». Dans ce contexte, il s’agit de rapporter ce qu’ils avaient vu.'
    reason: Précise que « en parlèrent » explicite l’objet implicite du verbe hébreu, sans lui attribuer un sens plus technique.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici que
  rationale: Conserve le marqueur narratif qui attire soudain l’attention, dans une tournure française digne et naturelle.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: des hommes passaient par là
  rationale: Le nom est masculin pluriel et le participe décrit une action en cours; «par là» rend idiomatiquement l’idée de passage dans cette scène.
- source_word: הַנְּבֵלָה
  choice: le cadavre
  rationale: Dans ce contexte de mort humaine, «cadavre» est précis et naturel.
- source_word: מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: jeté sur le chemin
  rationale: «Jeté» conserve la force du participe passif, plutôt que de l’affaiblir en simple position allongée; «sur le chemin» exprime le lieu concret.
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: le lion qui se tenait à côté du cadavre
  rationale: Rend clairement la posture et la proximité indiquées par עֹמֵד et אֵצֶל.
- source_word: וַיָּבֹאוּ וַיְדַבְּרוּ בָעִיר
  choice: Puis ils vinrent en parler dans la ville
  rationale: «Vinrent» respecte le mouvement narratif; «en parler» reste proche du verbe général «parler» tout en explicitant naturellement en français que l’incident est le sujet.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: où habitait le vieux prophète
  rationale: Le verbe avec la préposition désigne ici le lieu de résidence; «habitait» est clair et actuel, et «vieux prophète» conserve l’adjectif.
