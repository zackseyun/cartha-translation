  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: fr
  text: 'Il dit à ses fils : « Sellez-moi l’âne. » Ils lui sellèrent donc l’âne, et il le monta.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּנָיו
  choice: Il dit à ses fils
  rationale: Le verbe narratif fait progresser le récit sans qu’il soit nécessaire d’ajouter « alors »; בָּנָיו désigne ici ses fils, au masculin pluriel.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: Sellez-moi l’âne
  rationale: Dans le contexte de la préparation d’un animal pour être monté, חבש signifie « seller ». La tournure française est naturelle et conserve le bénéficiaire exprimé par לִי.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: Ils lui sellèrent donc l’âne
  rationale: La répétition de « seller » reprend exactement l’action commandée; « donc » rend naturellement le rapport de conséquence dans la progression narrative.
- source_word: וַיִּרְכַּב עָלָיו
  choice: et il le monta
  rationale: רכב על signifie monter un animal ou aller sur son dos. « Il le monta » est ici plus naturel et précis que « il chevaucha sur lui », tout en conservant le pronom masculin français renvoyant à l’âne.
