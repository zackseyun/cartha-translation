id: 1KI.13.1
reference: 1 Kings 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: fr
  text: Or voici qu’un homme de Dieu vint de Juda à Béthel sur l’ordre de Yahweh[a], tandis que Jéroboam se tenait près de l’autel pour faire brûler de l’encens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la parole de Yahweh » ou « conformément à la parole de Yahweh ».'
    reason: Alternative lexicale pour בִּדְבַר יְהוָה.
  - marker: b
    text: 'Ou : « et Jéroboam se tenait à l’autel pour faire brûler de l’encens ». La conjonction hébraïque peut simplement se traduire par « et », et l’expression rendue par « près de l’autel » peut aussi se traduire par « à l’autel ».'
    reason: Alternatives syntaxique et lexicale pour וְ et עַל הַמִּזְבֵּחַ.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici que
  rationale: « Voici que » conserve la fonction de mise en relief et la vivacité narrative de הִנֵּה ; « or » assure naturellement la transition en français.
- source_word: אִישׁ אֱלֹהִים
  choice: un homme de Dieu
  rationale: Reproduit l’expression hébraïque sans la réduire à l’interprétation « prophète ».
- source_word: בָּא מִיהוּדָה
  choice: vint de Juda
  rationale: Rend directement le mouvement depuis Juda dans un registre narratif digne et courant.
- source_word: בִּדְבַר יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: Exprime en français naturel que sa venue répond à la parole et au mandat de Yahweh, tout en signalant en note les rendus plus formels.
- source_word: אֶל בֵּית אֵל
  choice: à Béthel
  rationale: Emploie la forme française traditionnelle du nom de lieu et rend אֶל comme marque de destination.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: tandis que Jéroboam se tenait
  rationale: Le participe décrit une situation en cours à l’arrière-plan ; « tandis que » explicite naturellement la simultanéité sans nier que וְ puisse simplement signifier « et ».
- source_word: עַל הַמִּזְבֵּחַ
  choice: près de l’autel
  rationale: Dans cette construction, עַל indique la position auprès de l’autel plutôt que nécessairement sur sa surface.
- source_word: לְהַקְטִיר
  choice: pour faire brûler de l’encens
  rationale: Rend la valeur finale de l’infinitif et le sens cultuel probable du verbe, qui désigne ici la combustion de l’encens.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Nature de l’autorisation exprimée par בִּדְבַר יְהוָה
  choice: sur l’ordre de Yahweh
  alternative: par la parole de Yahweh ; conformément à la parole de Yahweh
  rationale: Le contexte présente la venue de l’homme de Dieu comme accomplie en réponse au mandat divin. La note préserve toutefois l’étendue sémantique de דָּבָר et de la préposition בְּ.
translation_notes:
  register: Français international moderne, narratif et digne. « Or voici que » garde la mise en relief de l’hébreu sans archaïsme excessif ; « homme de Dieu » conserve le titre source, et les notes maintiennent les ambiguïtés réelles de la préposition et de la coordination.
