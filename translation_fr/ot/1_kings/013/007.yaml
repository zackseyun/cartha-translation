  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: fr
  text: 'Alors le roi dit à l’homme de Dieu : « Viens chez moi et mange[a], et je te donnerai un cadeau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reprends des forces » / « prends quelque nourriture » ; le verbe hébreu peut signifier se fortifier ou se soutenir, souvent en prenant un repas.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors … dit » rend naturellement cette succession en français moderne.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du nom défini.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Conserve l’expression hébraïque traditionnelle sans l’interpréter plus précisément comme « prophète ».
- source_word: בֹּאָה
  choice: Viens
  rationale: L’impératif avec hé paragogique exprime ici une invitation; « Viens » est naturel et n’ajoute pas un degré de politesse incertain.
- source_word: אִתִּי הַבַּיְתָה
  choice: chez moi
  rationale: Le hé directionnel indique un mouvement vers la maison. Dans cette invitation, « chez moi » exprime idiomatiquement la destination et la relation avec le locuteur.
- source_word: וּסְעָדָה
  choice: et reprends des forces
  rationale: Le verbe סעד signifie soutenir ou fortifier, souvent grâce à un repas. Cette formulation préserve son sens plus large tout en restant naturelle; la note précise l’idée de manger.
- source_word: וְאֶתְּנָה לְךָ
  choice: et je te donnerai
  rationale: Rend naturellement la forme volitive à la première personne dans le contexte d’une offre.
- source_word: מַתָּת
  choice: un cadeau
  rationale: Le nom désigne un don ou un présent. « Cadeau » est courant et neutre, sans introduire l’idée plus précise d’une récompense.
