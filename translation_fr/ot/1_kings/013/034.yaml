  text: וַ/יְהִי֙ בַּ/דָּבָ֣ר הַ/זֶּ֔ה לְ/חַטַּ֖את בֵּ֣ית יָרָבְעָ֑ם וּ/לְ/הַכְחִיד֙ וּ/לְ/הַשְׁמִ֔יד מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: fr
  text: Cette affaire devint un péché pour la maison de Yarovam[a], entraînant le retranchement et la destruction de cette maison de la surface du sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, la « maison » de Yarovam désigne sa famille ou sa dynastie.
    reason: idiome_culturel
  - marker: b
    text: 'Littéralement : « de dessus la face du sol » ; expression hébraïque évoquant une disparition complète de la terre ou du pays.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיְהִי
  choice: devint
  rationale: 'Le verbe introduit ici le résultat de ce qui précède : l’affaire en vint à constituer un péché pour la maison de Jéroboam.'
- source_word: בַּדָּבָר הַזֶּה
  choice: cette affaire
  rationale: דָּבָר désigne largement l’affaire ou la conduite racontée, plutôt qu’une simple parole. « Cette affaire » conserve cette amplitude référentielle.
- source_word: לְחַטַּאת
  choice: un péché
  rationale: La tournure indique que l’affaire devint un péché, ou eut valeur de péché, pour la maison de Jéroboam.
- source_word: בֵּית יָרָבְעָם
  choice: la maison de Jéroboam
  rationale: « Maison » conserve l’image hébraïque, qui désigne ici la famille ou la dynastie.
- source_word: וּלְהַכְחִיד
  choice: retranchée
  rationale: Le hiphil de כחד exprime la disparition provoquée ou la suppression. « Retranchée » convient au jugement d’une lignée et reste distinct de « détruite ».
- source_word: וּלְהַשְׁמִיד
  choice: détruite
  rationale: Le hiphil de שמד exprime la destruction. Le choix préserve les deux verbes coordonnés sans les confondre.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface de la terre
  rationale: Cette formulation française rend naturellement l’expression hébraïque solennelle désignant une disparition complète de la terre ou du pays.
theological_decisions:
- issue: Référent implicite des verbes de suppression et de destruction
  choice: La maison de Jéroboam, c’est-à-dire sa lignée ou sa dynastie
  alternative: L’affaire pécheresse elle-même
  rationale: La maison de Jéroboam est le référent syntaxique et narratif le plus cohérent. Le pronom « elle » l’explicite sans imposer dans le corps du texte le terme interprétatif « dynastie ».
- issue: Valeur des infinitifs préfixés par לְ
  choice: Conséquence exprimée par « au point que »
  alternative: But exprimé par « afin de »
  rationale: Dans le contexte, la suppression de la maison apparaît comme l’aboutissement judiciaire de son péché. La formulation retenue rend ce lien tout en évitant de présenter le péché comme un dessein consciemment poursuivi par la maison.
translation_notes:
  register: Français international actuel, sobre et digne. La phrase conserve « maison » pour l’image dynastique hébraïque, mais emploie « de la surface de la terre » afin que l’idiome final soit immédiatement compréhensible.
