  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: fr
  text: 'Puis il dit à ses fils : « Sellez-moi l’âne. » Et ils le sellèrent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Puis il dit
  rationale: Le wayyiqtol fait progresser le récit. En français, « Puis » rend naturellement cette succession, tandis que « dit » convient au verbe de parole introduisant ici un discours direct.
- source_word: אֶל בָּנָיו
  choice: à ses fils
  rationale: Le pluriel masculin בָּנִים avec suffixe de troisième personne masculine singulière désigne ici ses fils.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Devant un discours direct, les deux-points rendent idiomatiquement en français la fonction introductive de לֵאמֹר sans le calque lourd « en disant ».
- source_word: חִבְשׁוּ לִי
  choice: Sellez-moi
  rationale: Avec un âne, חבשׁ signifie le seller. Le pronom « me » conserve le bénéficiaire exprimé par לִי.
- source_word: אֶת הַחֲמוֹר
  choice: l’âne
  rationale: חֲמוֹר est le terme courant désignant un âne ; l’article défini est conservé.
- source_word: וַיַּחֲבֹשׁוּ
  choice: Et ils le sellèrent
  rationale: La reprise de חבשׁ est conservée par le même verbe. Le pronom « le » renvoie naturellement à l’âne sans répétition inutile.
