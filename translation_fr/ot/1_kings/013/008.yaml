base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: fr
  text: 'Mais l’homme de Dieu dit au roi : « Si tu me donnais la moitié de ta maison[a], je n’irais pas avec toi, et je ne mangerais pas de pain ni ne boirais d’eau en ce lieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la moitié de ta maison ». Cette expression peut évoquer un domaine ou des biens considérables, mais la traduction conserve l’image du texte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette expression hébraïque désigne un messager investi d’une mission divine. La traduction littérale est naturelle en français et évite de préciser « prophète » là où le texte ne l’emploie pas.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: Même si tu me donnais la moitié de ta maison
  rationale: La tournure concessive et l’imparfait rendent naturellement l’hypothèse extrême exprimée en contexte. « Maison » conserve l’image hébraïque, tout en laissant ouverte la possibilité qu’il s’agisse plus largement des biens ou du domaine royal.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: je n’irais pas avec toi
  rationale: Bien que le verbe signifie littéralement « venir », « aller avec toi » est le choix déictique naturel en français dans la réponse à une invitation. Le conditionnel s’accorde avec l’hypothèse précédente.
- source_word: לֹא אֹכַל לֶחֶם
  choice: je ne mangerais pas de pain
  rationale: « Pain » conserve le terme concret du texte, qui peut aussi désigner plus largement de la nourriture ou un repas.
- source_word: לֹא אֶשְׁתֶּה מַּיִם
  choice: ni ne boirais d’eau
  rationale: Traduction directe, coordonnée à la proposition précédente selon une syntaxe française soutenue mais courante.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Cette formulation préserve le démonstratif et le caractère solennel de l’énoncé, sans se réduire au simple adverbe « ici ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La structure conditionnelle est rendue idiomatiquement, tandis que les images concrètes « maison », « pain » et « eau » sont conservées. Le tutoiement correspond au singulier hébreu et à l’usage narratif biblique français.
