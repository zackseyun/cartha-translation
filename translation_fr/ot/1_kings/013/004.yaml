  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דְּבַ֣ר אִישׁ הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר קָרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בְּ/בֵֽית אֵ֔ל וַ/יִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ לֵ/אמֹ֣ר תִּפְשֻׂ֑/הוּ וַ/תִּיבַ֤שׁ יָד/וֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔י/ו וְ/לֹ֥א יָכֹ֖ל לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: fr
  text: 'Lorsque le roi entendit la parole de l’homme de Dieu, qui avait crié contre l’autel de Béthel, Jéroboam tendit sa main de dessus l’autel et ordonna : « Saisissez-le ! » Mais sa main, qu’il avait tendue contre lui, se dessécha[a], et il ne put la ramener à lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se flétrit ». Littéralement : « devint sèche ».'
    reason: Le verbe hébreu décrit le dessèchement ; « se flétrit » est une autre manière traditionnelle d’exprimer l’atteinte soudaine de la main.
lexical_decisions:
- source_word: דְּבַר אִישׁ הָאֱלֹהִים
  choice: la parole que l’homme de Dieu avait proclamée
  rationale: « Parole » conserve le singulier concret de דְּבַר, tandis que « homme de Dieu » maintient le titre hébreu sans le remplacer par l’interprétation « prophète ». La relative française explicite naturellement que cette parole est celle qu’il avait proclamée.
- source_word: קָרָא עַל הַמִּזְבֵּחַ
  choice: avait proclamée contre l’autel
  rationale: קרא exprime ici une proclamation publique et על sa direction hostile. « Proclamer contre » rend la dénonciation prophétique avec force, sans langage inutilement archaïque.
- source_word: בְּבֵית אֵל
  choice: de Béthel
  rationale: 'Le complément est rattaché naturellement à « l’autel » en français : il s’agit de l’autel situé à Béthel.'
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: tendit la main depuis l’autel
  rationale: « Tendre la main » restitue l’expression gestuelle שׁלח יד. « Depuis l’autel » conserve מֵעַל הַמִּזְבֵּחַ et le point de départ du geste sans ajouter une posture précise que le verset n’énonce pas.
- source_word: תִּפְשֻׂהוּ
  choice: Saisissez-le !
  rationale: L’impératif pluriel s’adresse aux assistants du roi. « Saisissez-le ! » est direct et énergique, sans introduire la notion juridique moderne d’arrestation.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: sa main ... se dessécha
  rationale: Le verbe יבש signifie littéralement « devenir sec, se dessécher ». Ce choix conserve l’image hébraïque et présente sans diagnostic médical l’atteinte soudaine qui immobilise la main.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: qu’il avait tendue contre lui
  rationale: La répétition du geste est conservée, et « contre lui » rend la valeur hostile de עָלָיו.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: la ramener à lui
  rationale: La forme causative de שוב signifie « faire revenir ». Cette formulation française décrit clairement l’incapacité physique sans préciser au-delà du texte la nature de l’atteinte.
theological_decisions:
- issue: Nature du jugement frappant la main de Jéroboam
  choice: Décrire directement la main qui « se dessécha » et que le roi ne put ramener à lui.
  alternative: Employer une formulation médicale ou fonctionnelle telle que « se paralysa » ou la traditionnelle « se flétrit ».
  rationale: Le récit présente un effet physique immédiat en réponse au geste hostile du roi. La traduction conserve le caractère soudain du jugement et l’image propre au verbe hébreu, sans imposer de diagnostic ni développer une explication théologique absente du verset.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple porte les actions principales, tandis que le plus-que-parfait marque les actes antérieurs repris dans les relatives. Le commandement royal reste bref et vigoureux.
