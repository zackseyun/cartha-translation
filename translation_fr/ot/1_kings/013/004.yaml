revisions:
- from: 'Lorsque le roi entendit la parole que l’homme de Dieu avait proclamée contre l’autel de Béthel, Jéroboam tendit la main depuis l’autel et ordonna : « Saisissez-le ! » Mais la main qu’il avait tendue contre lui se dessécha[a], et il ne put la ramener à lui.'
  to: 'Lorsque le roi entendit la parole de l’homme de Dieu, qui avait crié contre l’autel de Béthel, Jéroboam tendit sa main de dessus l’autel et ordonna : « Saisissez-le ! » Mais sa main, qu’il avait tendue contre lui, se dessécha[a], et il ne put la ramener à lui.'
  rationale: La révision rétablit l’homme de Dieu comme sujet de l’action de crier contre l’autel, conformément à la syntaxe hébraïque, et affine le rendu de מֵעַל (« de dessus »). Le reste du texte et la note sont conservés, car ils rendent avec naturel et fidélité le geste hostile, le dessèchement de la main et l’incapacité de la ramener.
