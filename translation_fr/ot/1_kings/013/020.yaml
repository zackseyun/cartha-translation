source:
  edition: WLC
  text: וַ/יְהִ֕י הֵ֥ם יֹשְׁבִ֖ים אֶל הַ/שֻּׁלְחָ֑ן וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל הַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: fr
  text: Pendant qu’ils étaient assis à table, la parole de Yahweh fut adressée au prophète qui l’avait fait revenir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הֵם יֹשְׁבִים
  choice: Pendant qu’ils étaient assis
  rationale: La construction associe la formule narrative וַיְהִי à un pronom et un participe exprimant une action en cours. « Pendant qu’ils étaient assis » restitue naturellement la simultanéité en français sans alourdir la phrase.
- source_word: אֶל הַשֻּׁלְחָן
  choice: à table
  rationale: Avec le verbe « s’asseoir », אֶל désigne ici la place prise pour le repas. L’expression française idiomatique est « être assis à table ».
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette formule prophétique traditionnelle est conservée de manière directe, tout en rendant explicitement le nom divin.
- source_word: וַיְהִי ... אֶל הַנָּבִיא
  choice: fut adressée au prophète
  rationale: Littéralement, la parole « fut/vint au prophète ». « Fut adressée » exprime clairement la réception d’une révélation divine et convient au registre biblique moderne.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: qui l’avait fait revenir
  rationale: 'Le hiphil de שׁוב est causatif : le prophète avait amené l’homme de Dieu à revenir. Le plus-que-parfait marque correctement l’antériorité.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, fluide et digne. La tournure conserve la formule prophétique tout en évitant l’archaïsme « il arriva que ». Aucun marqueur de note n’est requis.
