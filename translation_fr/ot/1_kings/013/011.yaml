translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple marque l’avancée du récit, tandis que l’imparfait décrit la situation initiale. Les marqueurs de note sont placés sur les éléments qu’ils expliquent. La ponctuation rend lisible la longue coordination hébraïque sans effacer la reprise finale ni l’irrégularité singulier-pluriel.
