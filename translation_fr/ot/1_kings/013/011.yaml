  text: וְ/נָבִ֤יא אֶחָד֙ זָקֵ֔ן יֹשֵׁ֖ב בְּ/בֵֽית אֵ֑ל וַ/יָּב֣וֹא בְנ֡/וֹ וַ/יְסַפֶּר ל֣/וֹ אֶת כָּל הַ/מַּעֲשֶׂ֣ה אֲשֶׁר עָשָׂה֩ אִישׁ הָ/אֱלֹהִ֨ים הַ/יּ֜וֹם בְּ/בֵֽית אֵ֗ל אֶת הַ/דְּבָרִים֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל הַ/מֶּ֔לֶךְ וַֽ/יְסַפְּר֖וּ/ם לַ/אֲבִי/הֶֽם־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: fr
  text: Un vieux prophète[b] habitait à Béthel. Son fils vint lui raconter tout ce que l’homme de Dieu avait fait ce jour-là à Béthel, ainsi que les paroles qu’il avait adressées au roi ; ils les rapportèrent à leur père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe du singulier (« son fils vint lui raconter ») au pluriel (« ils les rapportèrent à leur père »). Cela peut laisser entendre la présence de plusieurs fils ou refléter une irrégularité du texte ou du récit ; la traduction conserve ce changement au lieu de l’harmoniser.
    reason: textual_variant
  - marker: b
    text: Ou « Un certain vieux prophète ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: un vieux prophète
  rationale: אֶחָד peut signaler ici un individu indéfini (« un certain »). « Un vieux prophète » est naturel en français et conserve cette indétermination ; l’autre possibilité est signalée en note.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: habitait à Béthel
  rationale: Dans ce contexte narratif, יֹשֵׁב indique la résidence plutôt que la posture assise.
- source_word: וַיָּבֹא בְנוֹ
  choice: son fils vint
  rationale: בְנוֹ est morphologiquement singulier. Le singulier est donc conservé malgré le passage ultérieur au pluriel.
- source_word: וַיְסַפֶּר לוֹ
  choice: lui raconter
  rationale: Le piel de ספר signifie couramment « raconter » ou « rapporter » ; « raconter » convient au récit transmis au père.
- source_word: אֶת כָּל הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה
  choice: tout ce que… avait fait
  rationale: Cette formulation française naturelle rend la totalité de l’action désignée par le singulier collectif מַעֲשֶׂה, sans recourir à l’expression peu idiomatique « tout l’acte ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Titre prophétique consacré dans les livres historiques, conservé littéralement et de manière cohérente.
- source_word: הַיּוֹם
  choice: ce jour-là
  rationale: Dans un récit au passé, cette expression rend naturellement la référence au jour en question.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: ainsi que les paroles qu’il avait adressées au roi
  rationale: « Les paroles » maintient la distinction entre l’action accomplie et le message prophétique prononcé devant le roi.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: ils les rapportèrent à leur père
  rationale: Le verbe, le suffixe objet et « leur père » sont au pluriel. La traduction conserve ce changement de nombre au lieu de l’harmoniser avec « son fils ».
