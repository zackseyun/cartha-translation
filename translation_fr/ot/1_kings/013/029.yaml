    issue: « célébrer son deuil »
    rationale: Cette expression est peu idiomatique en français contemporain dans ce contexte et n’exprime pas aussi directement l’action de se lamenter sur le défunt que le verbe hébreu ספּד.
  - severity: low
    issue: Note liée à une formulation remplacée
    rationale: La note actuelle explique convenablement la nuance de lamentation, mais son libellé doit être harmonisé avec « le pleurer » et conserver une véritable alternative lexicale.
