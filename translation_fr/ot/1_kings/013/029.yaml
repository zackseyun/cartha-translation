  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: fr
  text: Le prophète souleva le corps sans vie de l’homme de Dieu, le posa sur l’âne et le ramena. Il se rendit dans la ville du vieux prophète pour le pleurer[a] et l’enterrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour prononcer des lamentations funèbres ». Le verbe hébreu peut désigner précisément les lamentations funèbres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: souleva
  rationale: Le verbe נשׂא peut signifier « soulever, porter, prendre ». « Souleva » conserve ici l’action concrète qui précède le placement du corps sur l’âne.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Le syntagme défini renvoie, dans le contexte, au vieux prophète qui a retrouvé le corps.
- source_word: נִבְלַת
  choice: le corps sans vie
  rationale: נְבֵלָה désigne un cadavre. « Corps sans vie » est précis, digne et naturel en français contemporain, sans la nuance animale que peut prendre « carcasse ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Rend littéralement et de manière consacrée le titre narratif de cet envoyé de Dieu.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: le posa sur l’âne
  rationale: Le hiphil de נוח signifie ici « poser, placer ». Le pronom masculin français peut reprendre naturellement « corps ».
- source_word: וַיְשִׁיבֵהוּ
  choice: le ramena
  rationale: Le hiphil de שׁוב exprime le fait de faire revenir ou de ramener. Le pronom laisse subsister la référence naturelle au corps et, par métonymie, à l’homme décédé.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: Il se rendit dans la ville du vieux prophète
  rationale: La chaîne nominale signifie naturellement « la ville du vieux prophète », c’est-à-dire celle où il habitait. « Se rendit » convient au déplacement raconté en français.
- source_word: הַזָּקֵן
  choice: vieux
  rationale: Le terme décrit ici l’âge et distingue ce prophète de l’homme de Dieu ; il ne désigne pas une fonction d’ancien.
- source_word: לִסְפֹּד
  choice: pour célébrer son deuil
  rationale: ספד désigne le fait de mener le deuil, souvent avec des lamentations funèbres. Cette formulation française exprime l’action funéraire sans la réduire à une émotion intérieure.
- source_word: וּלְקָבְרוֹ
  choice: et l’enterrer
  rationale: קבר signifie simplement « enterrer ». Le suffixe renvoie à l’homme de Dieu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Corps sans vie » évite à la fois la rudesse de « cadavre » et l’imprécision possible de « corps ». La répétition du sujet au début de la seconde phrase est allégée tout en maintenant clairement le vieux prophète comme acteur.
