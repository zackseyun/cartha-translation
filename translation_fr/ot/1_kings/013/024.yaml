base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: fr
  text: Il s’en alla, et un lion le trouva sur le chemin et le tua. Son cadavre était jeté sur le chemin[a] ; l’âne se tenait à côté de lui, et le lion se tenait près du cadavre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son cadavre gisait sur le chemin après y avoir été jeté ». Le participe passif hébreu indique que le corps avait été jeté là, plutôt que de dire seulement qu’il se trouvait couché sur le chemin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Il partit donc
  rationale: Le wayyiqtol fait progresser le récit. « Partit » rend naturellement le départ dans ce contexte, et « donc » marque la continuité narrative sans préciser davantage le lien logique.
- source_word: וַיִּמְצָאֵהוּ
  choice: le trouva
  rationale: מצא signifie couramment « trouver ». Cette traduction directe conserve l’idée de la rencontre soudaine sans ajouter qu’elle serait fortuite.
- source_word: אַרְיֵה
  choice: un lion
  rationale: Première mention de l’animal dans la scène ; l’article indéfini convient en français.
- source_word: בַּדֶּרֶךְ
  choice: en chemin / sur le chemin
  rationale: דרך désigne ici le trajet ou le chemin. La variation française évite une tournure maladroite tout en conservant le même référent spatial.
- source_word: וַיְמִיתֵהוּ
  choice: le tua
  rationale: Le hifil de מות exprime ici le fait de causer la mort. « Le tua » est direct, sobre et idiomatique.
- source_word: נִבְלָתוֹ
  choice: son cadavre
  rationale: נבלה désigne un corps mort. « Cadavre » est précis, digne et applicable ici à un être humain.
- source_word: מֻשְׁלֶכֶת
  choice: gisait, jeté
  rationale: Le participe passif de שלך présente le corps dans l’état résultant d’avoir été jeté ou abattu là. « Gisait, jeté » produit un français naturel tout en conservant explicitement la valeur passive.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: l’âne se tenait à côté de lui
  rationale: Le participe עֹמֵד décrit une posture continue dans la scène. « Se tenait » est plus naturel que « était debout » ; « lui » reprend le cadavre.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: le lion se tenait près du cadavre
  rationale: La formulation conserve la description statique donnée par le participe et répète « le cadavre » comme le fait l’hébreu.
