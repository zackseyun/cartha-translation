revisions:
- from: Il partit donc. Un lion le trouva en chemin et le tua. Son cadavre gisait, jeté sur le chemin[a] ; l’âne se tenait à côté de lui, et le lion se tenait près du cadavre.
  to: Il s’en alla, et un lion le trouva sur le chemin et le tua. Son cadavre était jeté sur le chemin[a] ; l’âne se tenait à côté de lui, et le lion se tenait près du cadavre.
  rationale: La révision retire l’inférence logique de « donc » et rend directement le participe passif מֻשְׁלֶכֶת par « était jeté ». Elle maintient la description durable exprimée par les participes « se tenait », ainsi que la répétition finale de « cadavre » présente en hébreu. La note conserve l’alternative idiomatique tout en précisant que la passivité de « jeté » est l’élément sémantique décisif.
