    issue: « qui lui a brisé le corps » ajoute « le corps » et produit une tournure moins naturelle.
    rationale: וַיְשַׁבְּרֵהוּ a pour objet direct l'homme de Dieu, non son corps explicitement. Dans le contexte d'un lion, « l'a mis en pièces » exprime la violence de שבר sans ajouter cet élément anatomique.
  - severity: low
    issue: « donc » explicite plus fortement le rapport logique.
    rationale: La conséquence est bien impliquée par le contexte, mais le texte hébreu emploie simplement la coordination. La supprimer conserve l'enchaînement sans surtraduction.
