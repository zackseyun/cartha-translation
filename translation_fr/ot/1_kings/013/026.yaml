  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: fr
  text: 'Quand le prophète qui l’avait fait revenir de son chemin apprit ce qui s’était passé, il dit : « C’est l’homme de Dieu qui s’est rebellé contre l’ordre de Yahweh[a]. Yahweh l’a livré au lion, qui l’a mis en pièces et l’a tué, conformément à la parole que Yahweh lui avait adressée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’est rebellé contre la bouche de Yahweh » ; autres traductions possibles : « a désobéi au commandement de Yahweh » ou « a défié la parole de Yahweh ».'
    reason: Préserver l’image hébraïque et les nuances lexicales de מָרָה אֶת־פִּי יְהוָה.
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן־הַדֶּרֶךְ
  choice: l’avait fait revenir de son chemin
  rationale: 'Le hiphil de שוב exprime la causation : le prophète a amené l’homme de Dieu à revenir de son itinéraire. « Chemin » maintient le motif narratif récurrent.'
- source_word: וַיִּשְׁמַע
  choice: apprit ce qui s’était passé
  rationale: Le complément de « entendre » est implicite et renvoie à la nouvelle rapportée au verset précédent. Cette formulation française rend naturellement l’implicite sans en modifier le contenu.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Désignation consacrée d’un envoyé ou prophète de Dieu, maintenue pour assurer la continuité du récit.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: s’est rebellé contre l’ordre de Yahweh
  rationale: מרה signifie se rebeller ou se montrer réfractaire. L’expression littérale « la bouche de Yahweh » désigne ici l’ordre prononcé par lui ; « l’ordre » est naturel en français, tandis que l’image hébraïque est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin porté par le tétragramme, plutôt que substitution par un titre.
- source_word: וַיִּתְּנֵהוּ יְהוָה לָאַרְיֵה
  choice: Yahweh l’a donc livré au lion
  rationale: נתן avec ל exprime ici la remise au pouvoir du lion. « Livré » rend ce sens plus clairement que le littéral « donné ».
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: qui lui a brisé le corps
  rationale: שבר signifie littéralement « briser ». Avec le lion pour sujet, la formule décrit la violence corporelle de l’attaque sans confondre ce verbe avec le verbe suivant, « tuer ».
- source_word: וַיְמִתֵהוּ
  choice: l’a tué
  rationale: Le hiphil de מות signifie directement « faire mourir, tuer ».
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: conformément à la parole que Yahweh lui avait adressée
  rationale: La locution marque l’accomplissement de la parole antérieure de Yahweh. Le plus-que-parfait situe clairement cette parole avant la mort.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom propre divin. Sa transcription préserve cette valeur sans le remplacer par un titre.
- issue: Sens de פִּי יְהוָה
  choice: l’ordre de Yahweh
  alternative: la bouche de Yahweh / la parole de Yahweh
  rationale: L’expression concrète « bouche de Yahweh » désigne ce que Yahweh a expressément commandé. « Ordre » convient au contexte de désobéissance, et la note conserve le sens littéral ainsi que les autres rendus possibles.
- issue: Rapport entre la désobéissance et l’action de Yahweh
  choice: Yahweh l’a donc livré au lion
  alternative: et Yahweh l’a livré au lion
  rationale: Le contexte et la déclaration du prophète présentent la livraison au lion comme conséquence judiciaire de la rébellion. « Donc » explicite ce rapport sans préciser davantage le mécanisme théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie une syntaxe claire sans effacer l’enchaînement judiciaire du passage. Le marqueur [a] figure dans le texte principal.
