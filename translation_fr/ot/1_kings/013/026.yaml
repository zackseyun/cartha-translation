  to: 'Quand le prophète qui l’avait fait revenir de son chemin apprit ce qui s’était passé, il dit : « C’est l’homme de Dieu qui s’est rebellé contre l’ordre de Yahweh[a]. Yahweh l’a livré au lion, qui l’a mis en pièces et l’a tué, conformément à la parole que Yahweh lui avait adressée. »'
