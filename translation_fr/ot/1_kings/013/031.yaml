base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: fr
  text: 'Après l’avoir enterré, il dit à ses fils : « Quand je mourrai, enterrez-moi dans le tombeau où l’homme de Dieu est enterré. Déposez mes os à côté de ses os. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: Après l’avoir enterré
  rationale: La construction introduit la circonstance temporelle précédant la parole. En français, « Après l’avoir enterré » rend naturellement l’antériorité sans reproduire lourdement la formule narrative וַיְהִי.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le nom hébreu désigne explicitement les fils, et non les enfants au sens général.
- source_word: בְּמוֹתִי
  choice: Quand je mourrai
  rationale: Le futur français convient au décès envisagé depuis le moment où le personnage parle.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: enterrez-moi
  rationale: Dans ce contexte, la forme verbale exprime une instruction; l’impératif est clair et naturel en français.
- source_word: בַּקֶּבֶר
  choice: dans le tombeau
  rationale: Il s’agit d’un lieu funéraire déterminé susceptible d’accueillir plusieurs dépouilles; « tombeau » convient mieux ici que « tombe » ou « fosse ».
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette traduction directe conserve le titre caractéristique du récit sans le préciser abusivement par « prophète ».
- source_word: קָבוּר בּוֹ
  choice: est enterré
  rationale: Le participe passif exprime l’état résultant de l’ensevelissement; le présent français le rend simplement.
- source_word: אֵצֶל
  choice: à côté de
  rationale: Cette locution exprime clairement la proximité spatiale indiquée par la préposition hébraïque.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: ses os ... mes os
  rationale: Le maintien du terme concret « os » préserve l’image funéraire et son importance narrative.
- source_word: הַנִּיחוּ
  choice: Déposez
  rationale: L’impératif pluriel donne une instruction directe aux fils; « déposer » est naturel et digne dans ce contexte funéraire.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formule hébraïque וַיְהִי n’est pas traduite séparément par « il arriva que », formulation lourde ici; sa fonction d’enchaînement narratif est intégrée à la proposition temporelle initiale. Deux phrases impératives préservent la solennité et la clarté de la demande.
