revisions:
- from: Après cet événement, Jéroboam ne se détourna pas de sa mauvaise voie. Il recommença à prendre parmi tout le peuple des prêtres pour les hauts lieux. Quiconque le désirait, il l’investissait[a], et celui-ci devenait l’un des prêtres des hauts lieux.
  to: Après cet événement, Jéroboam ne se détourna pas de sa mauvaise voie. Il recommença à établir, parmi tout le peuple, des prêtres pour les hauts lieux. Quiconque le désirait, il l’établissait dans cette fonction[a], et celui-ci devenait l’un des prêtres des hauts lieux.
  rationale: 'La révision remplace « prendre ... des prêtres » par « établir ... des prêtres » afin de rendre l’action causative de Jéroboam : il confère la fonction sacerdotale à des personnes prises parmi le peuple. La formulation maintient la portée générale de « parmi tout le peuple », conformément à l’audit anglais, et la note reste correctement ancrée sur l’idiome « remplir la main ».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:40:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle : Jéroboam persiste dans sa mauvaise voie, recrute des prêtres au sein du peuple pour les hauts lieux, et installe tout volontaire dans cette fonction. Toutefois, « recommença à prendre ... des prêtres » peut suggérer qu’il choisissait des personnes déjà prêtres, alors que וַיַּעַשׂ exprime qu’il les faisait/établissait prêtres.'
  naturalness: Le récit est naturel et d’un registre biblique moderne. « Établir ... des prêtres » est plus précis et plus idiomatique ici que « prendre ... des prêtres ». La tournure générique au passé (« Quiconque le désirait, il l’établissait ») rend correctement la construction hébraïque.
  terminology: « Jéroboam », « mauvaise voie » et « hauts lieux » conviennent. « Établissait dans cette fonction » rend l’idiome d’installation sacerdotale sans imposer le vocabulaire confessionnel d’« ordination ». La note conserve justement l’expression littérale et son sens.
  issues:
  - severity: medium
    issue: « prendre parmi tout le peuple des prêtres » affaiblit le verbe « faire »/« établir »
    rationale: Le texte hébreu dit que Jéroboam « fit » des prêtres des hauts lieux à partir du peuple. « Prendre des prêtres » peut se comprendre comme le recrutement de prêtres déjà constitués. « Établir ... des prêtres » exprime leur accession à la charge.
  revised_text: Après cet événement, Jéroboam ne se détourna pas de sa mauvaise voie. Il recommença à établir, parmi tout le peuple, des prêtres pour les hauts lieux. Quiconque le désirait, il l’établissait dans cette fonction[a], et celui-ci devenait l’un des prêtres des hauts lieux.
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « il lui remplissait la main », expression hébraïque désignant l’installation ou la consécration de quelqu’un au service sacerdotal.'
    reason: lexical_alternative
  revision_rationale: 'La révision remplace « prendre ... des prêtres » par « établir ... des prêtres » afin de rendre l’action causative de Jéroboam : il confère la fonction sacerdotale à des personnes prises parmi le peuple. La formulation maintient la portée générale de « parmi tout le peuple », conformément à l’audit anglais, et la note reste correctement ancrée sur l’idiome « remplir la main ».'
