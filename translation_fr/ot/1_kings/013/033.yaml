id: 1KI.13.33
reference: 1 Kings 13:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: fr
  text: Après cet événement, Jéroboam ne se détourna pas de sa mauvaise voie. Il recommença à établir, parmi tout le peuple, des prêtres pour les hauts lieux. Quiconque le désirait, il l’établissait dans cette fonction[a], et celui-ci devenait l’un des prêtres des hauts lieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il lui remplissait la main », expression hébraïque désignant l’installation ou la consécration de quelqu’un au service sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: Après cet événement
  rationale: דָּבָר peut désigner une parole, une chose ou une affaire. Ici, la formule renvoie naturellement à l’épisode qui précède ; « événement » explicite ce référent sans ajouter d’interprétation.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: ne se détourna pas de sa mauvaise voie
  rationale: שׁוּב signifie concrètement revenir ou se détourner. Avec « de sa mauvaise voie », cette traduction conserve la métaphore morale de l’hébreu sans employer le terme plus interprétatif « se repentir ».
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: Il recommença à prendre
  rationale: Le second emploi de שׁוּב marque ici la reprise ou la répétition de l’action. « Recommença » rend cet aspect en français courant ; « prendre ... des prêtres » exprime le fait de les tirer du peuple pour les constituer prêtres.
- source_word: מִקְצוֹת הָעָם
  choice: parmi tout le peuple
  rationale: L’expression, littéralement liée aux « extrémités » du peuple, indique ici un recrutement ouvert et sans restriction dans l’ensemble de la population. Une traduction littérale par « aux extrémités du peuple » serait obscure en français.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: des prêtres pour les hauts lieux
  rationale: Dans ce contexte, בָמוֹת désigne les sanctuaires locaux appelés « hauts lieux ». La préposition « pour » indique clairement que ces prêtres y étaient affectés.
- source_word: הֶחָפֵץ
  choice: Quiconque le désirait
  rationale: 'Le participe substantivé singulier a une portée générique : toute personne qui le souhaitait.'
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: il l’investissait
  rationale: L’expression « remplir la main » est un idiome d’installation dans une charge sacerdotale. « Investir » communique cette entrée officielle en fonction tout en évitant les connotations confessionnelles modernes que pourrait porter « ordonner ».
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: celui-ci devenait l’un des prêtres des hauts lieux
  rationale: Le verbe singulier suivi du groupe nominal pluriel exprime l’entrée d’un individu dans cette catégorie. Le français exige de rendre explicitement « l’un des ».
theological_decisions:
- issue: Donner ou non à שׁוּב le sens religieux explicite de repentance
  choice: ne se détourna pas de sa mauvaise voie
  alternative: ne se repentit pas de sa mauvaise conduite
  rationale: Le contexte implique un refus de changement moral, mais le verbe hébreu conserve l’image concrète du retour ou du changement de direction. La traduction choisie préserve cette image et évite de préciser davantage que le texte.
- issue: Rendre l’idiome sacerdotal יְמַלֵּא אֶת יָדוֹ
  choice: il l’investissait
  alternative: il le consacrait / il lui remplissait la main
  rationale: L’idiome désigne l’installation dans le service sacerdotal. « Investissait » en exprime la fonction sans imposer une conception confessionnelle particulière de l’ordination ; la forme littérale reste accessible en note.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le passé simple convient au récit biblique, tandis que l’imparfait « investissait » rend l’action habituelle : Jéroboam procédait ainsi pour quiconque se présentait. « Hauts lieux » maintient le terme biblique traditionnel, encore intelligible, sans ajouter dans le corps du texte l’évaluation cultuelle implicite du contexte.'
