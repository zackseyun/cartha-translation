base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: fr
  text: 'Mais tu es revenu, tu as mangé du pain et bu de l’eau dans le lieu à propos duquel il t’avait dit : « Ne mange pas de pain et ne bois pas d’eau » — ton cadavre ne parviendra pas jusqu’au tombeau de tes pères.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ton cadavre ne viendra pas au tombeau de tes pères. »'
    reason: Signaler l’image verbale littérale de l’hébreu derrière le français idiomatique « ne parviendra pas jusqu’au ».
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: tu es revenu
  rationale: Rend directement le retour exprimé par שוב dans la suite narrative et convient au reproche adressé à l’homme de Dieu.
- source_word: וַתֹּאכַל לֶחֶם
  choice: tu as mangé du pain
  rationale: Conserve l’objet concret « pain » et reprend exactement le vocabulaire de l’interdiction.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: '[tu as] bu de l’eau'
  rationale: Rend simplement l’hébreu tout en évitant une répétition inutile du pronom et de l’auxiliaire en français.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: dans le lieu au sujet duquel il t’avait dit
  rationale: Rattache la parole au lieu concerné, comme en hébreu. Le plus-que-parfait situe naturellement l’interdiction avant le retour et le repas.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: « Ne mange pas de pain et ne bois pas d’eau. »
  rationale: Préserve les deux interdictions parallèles et la répétition des noms, qui donne sa force au reproche.
- source_word: נִבְלָתְךָ
  choice: ton cadavre
  rationale: « Cadavre » exprime nettement le corps mort désigné par נבלה, sans atténuer la dureté du jugement.
- source_word: לֹא תָבוֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: Ton cadavre ne rejoindra pas le tombeau de tes pères
  rationale: « Rejoindra » garde l’image hébraïque du cadavre qui ne vient pas au tombeau, tout en restant idiomatique en français; la note signale une traduction plus littérale.
- source_word: אֲבֹתֶיךָ
  choice: tes pères
  rationale: Conserve la formulation masculine et familiale de l’hébreu, qui évoque la sépulture des pères plutôt qu’une ascendance générique.
theological_decisions:
- issue: Nature de la sentence prononcée
  choice: Annonce concrète que le corps de l’homme de Dieu ne reposera pas dans le tombeau familial
  alternative: Évocation figurée plus générale d’un déshonneur après la mort
  rationale: Le texte hébreu parle précisément du cadavre et du tombeau des pères. La traduction maintient cette réalité concrète sans développer les implications théologiques ou sociales.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement suit l’adresse hébraïque au singulier. La formulation conserve le parallélisme du reproche et la dureté de la sentence, sans archaïsme excessif.
