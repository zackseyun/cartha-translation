  text: וַ/יְדַבֵּ֤ר אֲלֵ/הֶם֙ אֲבִי/הֶ֔ם אֵֽי זֶ֥ה הַ/דֶּ֖רֶךְ הָלָ֑ךְ וַ/יִּרְא֣וּ בָנָ֗י/ו אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֤ר הָלַךְ֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁר בָּ֖א מִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: fr
  text: 'Leur père leur dit : « Quel chemin a-t-il pris ? » Ses fils avaient en effet vu quel chemin avait pris l’homme de Dieu venu de Juda.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: dit
  rationale: Dans un récit introduisant une parole directe, « dit » rend naturellement la fonction du verbe, littéralement « parla ».
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Quel chemin
  rationale: L’expression interrogative demande d’identifier l’itinéraire emprunté ; « Quel chemin » est idiomatique et précis en français.
- source_word: הָלָךְ
  choice: a-t-il pris / avait pris
  rationale: Avec « chemin », le français courant emploie naturellement « prendre ». Le passé composé convient à la question, tandis que le plus-que-parfait marque que les fils avaient observé l’itinéraire auparavant.
- source_word: וַיִּרְאוּ
  choice: avaient vu
  rationale: Le plus-que-parfait explicite l’antériorité de leur observation par rapport à la question du père, sans changer la relation temporelle du récit.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette traduction conserve le titre hébreu traditionnel sans le réduire au terme plus interprétatif « prophète ».
- source_word: מִיהוּדָה
  choice: venu de Juda
  rationale: Cette formulation française naturelle indique l’origine du personnage et respecte la proposition relative hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « quel chemin avait pris » maintient le lien lexical avec la question, tandis que « en effet » rend la valeur explicative de la seconde proposition.
