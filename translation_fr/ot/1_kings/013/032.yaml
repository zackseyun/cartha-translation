source:
  edition: WLC
  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: fr
  text: Car la parole qu’il a proclamée de la part de Yahweh contre l’autel de Béthel et contre tous les sanctuaires des hauts lieux[b] dans les villes de Samarie s’accomplira à coup sûr[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’accomplira certainement ». L’hébreu associe un infinitif absolu à un verbe à l’imparfait pour souligner la certitude.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toutes les maisons des hauts lieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la demande formulée au verset précédent.
- source_word: הָיֹה יִהְיֶה
  choice: s’accomplira à coup sûr
  rationale: L’infinitif absolu joint à l’imparfait du même verbe renforce la certitude de l’accomplissement.
- source_word: הַדָּבָר
  choice: la parole
  rationale: Dans ce contexte prophétique, le terme désigne la parole ou l’oracle prononcé, plutôt qu’une simple chose.
- source_word: אֲשֶׁר קָרָא
  choice: qu’il a proclamée
  rationale: Rend l’annonce publique et solennelle du prophète dans un français naturel.
- source_word: בִּדְבַר יְהוָה
  choice: de la part de Yahweh
  rationale: Exprime que le prophète parlait en vertu de la révélation reçue de Yahweh, sans la formulation française peu naturelle « par la parole de Yahweh ».
- source_word: עַל
  choice: contre
  rationale: Dans cette dénonciation prophétique, la préposition désigne la cible du jugement annoncé.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר בְּבֵית אֵל
  choice: l’autel de Béthel
  rationale: Formulation française concise et naturelle pour l’autel situé à Béthel.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: tous les sanctuaires des hauts lieux
  rationale: « Sanctuaires » communique la fonction cultuelle des « maisons » mentionnées littéralement en hébreu; la note conserve la forme de l’expression source.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: dans les villes de Samarie
  rationale: Rend directement la chaîne construite sans effacer la désignation géographique du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin; sa translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Certitude de la parole prophétique
  choice: s’accomplira à coup sûr
  alternative: s’accomplira certainement
  rationale: Cette formulation rend avec naturel l’intensification produite par הָיֹה יִהְיֶה, sans ajouter d’interprétation théologique.
- issue: Sens cultuel de בָּתֵּי הַבָּמוֹת
  choice: sanctuaires des hauts lieux
  alternative: maisons des hauts lieux
  rationale: Le choix principal explicite sobrement la fonction des bâtiments, tandis que la note signale la formulation littérale et préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure causale et la portée solennelle de l’oracle tout en évitant les calques peu naturels.
