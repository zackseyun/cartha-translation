  text: וַ/יְהִ֗י אַחֲרֵ֛י אָכְל֥/וֹ לֶ֖חֶם וְ/אַחֲרֵ֣י שְׁתוֹת֑/וֹ וַ/יַּחֲבָשׁ ל֣/וֹ הַ/חֲמ֔וֹר לַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: fr
  text: Après que le prophète eut mangé du pain et bu, le vieux prophète sella l’âne pour lui, pour le prophète qu’il avait fait revenir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il avait ramené ».'
    reason: Le hifil de שוב signifie littéralement « faire revenir » ; « ramener » est une autre traduction française idiomatique selon le contexte.
lexical_decisions:
- source_word: וַיְהִי
  choice: Après que
  rationale: Dans ce récit, וַיְהִי fait avancer la narration et introduit la circonstance temporelle qui suit. Une tournure temporelle directe est plus naturelle en français moderne que « Il arriva que ».
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: Après que l’homme de Dieu eut mangé du pain
  rationale: אַחֲרֵי suivi de l’infinitif construit marque l’antériorité. Le pain, explicitement mentionné, est conservé. Le sujet implicite est précisé d’après le contexte immédiat afin d’éviter une confusion excessive en français.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: et bu
  rationale: La formulation conserve le parallélisme temporel tout en évitant une répétition lourde. Aucun objet comme l’eau ou le vin n’est ajouté, puisque l’hébreu n’en indique pas.
- source_word: וַיַּחֲבָשׁ
  choice: sella
  rationale: Dans ce contexte, חבש désigne l’action de seller un animal. Le sujet implicite est rendu par « le vieux prophète » d’après le contexte narratif.
- source_word: לוֹ הַחֲמוֹר לַנָּבִיא
  choice: sella l’âne pour lui, pour le prophète
  rationale: 'La formulation maintient la reprise appositionnelle de l’hébreu : « pour lui », puis l’identification « pour le prophète ». « Âne » est le terme courant et précis en français moderne.'
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: qu’il avait ramené
  rationale: Le hifil de שוב exprime ici le fait de faire revenir quelqu’un. « Ramener » est idiomatique dans le contexte et garde la valeur causative essentielle.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Les sujets implicites ont été précisés à partir du contexte pour assurer la lisibilité, tandis que la reprise « pour lui, pour le prophète » conserve la structure appositionnelle de l’hébreu.
