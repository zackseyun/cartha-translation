  revision_rationale: La révision remplace le titre non présent dans cette clause (« l’homme de Dieu ») par « le prophète », conformément au texte hébreu. Elle retient « avait fait revenir » dans le texte pour rendre explicitement la valeur causative du hifil, et place « avait ramené » en variante idiomatique. Le sujet « le vieux prophète » est maintenu comme désambiguïsation contextuelle du pronom hébreu.
