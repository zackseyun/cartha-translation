source:
  edition: WLC
  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: fr
  text: 'Il cria contre l’autel par la parole de Yahweh[a] et dit : « Autel, autel ! Voici ce que dit Yahweh : Un fils naîtra à la maison de David ; son nom sera Josias. Il sacrifiera sur toi[b] les prêtres des hauts lieux qui font fumer des offrandes sur toi[c], et l’on brûlera sur toi des ossements humains. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur l’ordre de Yahweh » ou « conformément à la parole de Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Il immolera sur toi ». Le verbe hébreu appartient au vocabulaire du sacrifice et souligne la profanation de l’autel.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui brûlent de l’encens sur toi ». Le verbe hébreu peut désigner l’action de faire monter la fumée d’encens ou, plus largement, celle d’offrandes consumées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל הַמִּזְבֵּחַ
  choice: Il cria contre l’autel
  rationale: קרא avec עַל exprime ici une proclamation prophétique forte dirigée contre l’autel. « Cria contre » conserve à la fois l’intensité et la portée hostile de l’annonce.
- source_word: בִּדְבַר יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: La préposition בְּ et דְּבַר peuvent marquer ici l’autorisation, l’impulsion ou le mandat prophétique. « Sur l’ordre de » est naturel en français tout en rendant la commission divine ; les autres nuances sont signalées en note.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: Autel, autel !
  rationale: La répétition vocative est maintenue afin de préserver la solennité et la force rhétorique de l’oracle.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formulation française actuelle et digne de la formule prophétique de messager, sans l’archaïsme de « Ainsi parle ».
- source_word: הִנֵּה בֵן נוֹלָד לְבֵית דָּוִד
  choice: Un fils va naître dans la maison de David
  rationale: Le participe passif נוֹלָד reçoit une valeur prospective dans cette annonce prophétique. « Va naître » exprime naturellement le futur annoncé ; « dans la maison » désigne ici la lignée dynastique.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: son nom sera Josias
  rationale: Cette formulation restitue clairement en français la construction nominale hébraïque qui précise d’avance le nom de l’enfant.
- source_word: וְזָבַח עָלֶיךָ
  choice: Il sacrifiera sur toi
  rationale: זבח désigne l’abattage sacrificiel. « Sacrifiera » conserve l’ironie cultuelle et la profanation annoncée, tandis que la note indique la nuance concrète d’immolation.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: les prêtres des hauts lieux
  rationale: « Hauts lieux » est le terme français biblique établi pour les sanctuaires locaux désignés par בָּמוֹת.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: qui font fumer des offrandes sur toi
  rationale: Le hiphil de קטר peut désigner plus largement l’action de faire monter la fumée sacrificielle, et pas seulement celle de brûler de l’encens. Cette traduction garde cette étendue sémantique.
- source_word: וְעַצְמוֹת אָדָם יִשְׂרְפוּ עָלֶיךָ
  choice: et l’on brûlera sur toi des ossements humains
  rationale: אָדָם est générique, d’où « humains ». Le sujet pluriel de יִשְׂרְפוּ n’étant pas identifié, le pronom indéfini « on » conserve cette indétermination en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Nature de l’acte exprimé par זבח envers les prêtres
  choice: sacrifiera
  alternative: immolera / égorgera
  rationale: Le choix maintient le registre sacrificiel et l’ironie théologique de prêtres traités comme des victimes sur l’autel, sans atténuer la violence ; la nuance d’immolation est donnée en note.
- issue: Portée de אָדָם dans עַצְמוֹת אָדָם
  choice: ossements humains
  alternative: ossements d’homme
  rationale: אָדָם désigne ici l’être humain de façon générique, et non spécifiquement un individu masculin.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition prophétique et la personnification de l’autel sont conservées. La syntaxe évite les archaïsmes tout en maintenant la solennité de l’oracle.
