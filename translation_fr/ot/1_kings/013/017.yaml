  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: fr
  text: 'Car une parole m’est parvenue de la part du SEIGNEUR : « Tu ne mangeras pas de pain et tu ne boiras pas d’eau là ; tu ne retourneras pas en empruntant le chemin par lequel tu es allé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: il m’a été dit par la parole du SEIGNEUR
  rationale: Cette formulation française naturelle conserve la répétition sémantique autour de la parole et présente l’ordre comme reçu sous l’autorité de YHWH, sans ajouter un sujet humain.
- source_word: לֶחֶם
  choice: pain
  rationale: Le terme désigne ici le pain au sens direct ; le contexte n’exige pas de l’élargir à toute nourriture.
- source_word: תָשׁוּב לָלֶכֶת
  choice: tu ne retourneras pas en empruntant
  rationale: La tournure restitue les deux idées verbales, retourner et aller/prendre un chemin, tout en restant idiomatique en français.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: le chemin par lequel tu es allé
  rationale: La traduction suit le point de vue du texte hébreu, qui emploie le verbe « aller », plutôt que de le remplacer par « venir ».
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La forme en capitales suit la convention française largement reconnue pour signaler le tétragramme sans imposer une vocalisation reconstruite.
- issue: Mode de transmission de l’interdiction divine
  choice: il m’a été dit par la parole du SEIGNEUR
  alternative: le SEIGNEUR m’a donné cet ordre
  rationale: Le choix conserve la formulation médiatisée et la répétition du texte source au lieu de la simplifier en discours direct de Dieu.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement convient au discours direct adressé à une seule personne. La structure de l’interdiction en trois volets et la tension de la formulation hébraïque autour de la « parole » sont conservées sans lourdeur excessive.
