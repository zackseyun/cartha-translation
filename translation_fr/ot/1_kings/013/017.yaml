  to: 'Car une parole m’est parvenue de la part du SEIGNEUR : « Tu ne mangeras pas de pain et tu ne boiras pas d’eau là ; tu ne retourneras pas en empruntant le chemin par lequel tu es allé. »'
  rationale: La révision remplace l’introduction passive par une formulation française naturelle qui maintient l’idée qu’un message a été reçu sous l’autorité du SEIGNEUR, sans introduire de médiateur humain. « Là » évite d’ajouter une nuance spatiale. Les prohibitions et la formulation du chemin suivi sont conservées.
