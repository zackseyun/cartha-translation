  naturalness: Le registre est bon et « Voici » convient à l’annonce prophétique. « L’autel va se fendre » est compréhensible, mais le futur simple (« se fendra ») donne une formulation prophétique plus sobre. « Qui sont dessus » est courant, mais « qui se trouvent sur lui » est plus net dans un texte narratif soutenu.
  terminology: « Yahweh » rend correctement le tétragramme. « Signe » est approprié pour מוֹפֵת, avec les alternatives en note. « Cendres » est le rendu français naturel de דֶּשֶׁן ; la nuance de résidus gras provenant des sacrifices doit être portée par une note plutôt que lexicalisée dans le corps du verset.
