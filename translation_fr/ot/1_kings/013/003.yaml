  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: fr
  text: 'Ce jour-là, il donna un signe[a] en disant : « Voici le signe que Yahweh a annoncé : l’autel se fendra, et les cendres[b] qui se trouvent sur lui seront répandues. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prodige » ou « présage » (hébreu מוֹפֵת).
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « cendres » peut désigner plus précisément les cendres ou résidus gras provenant des sacrifices.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: il donna
  rationale: Le verbe נתן signifie « donner, placer ». Avec מוֹפֵת, « donner un signe » rend naturellement l’acte par lequel l’homme de Dieu fournit le signe authentifiant sa parole.
- source_word: מוֹפֵת
  choice: signe
  rationale: מוֹפֵת peut désigner un signe, un prodige ou un présage. Ici, il s’agit avant tout de la confirmation annoncée de la parole prophétique ; « signe » convient sans accentuer indûment son caractère merveilleux.
- source_word: דִּבֶּר יְהוָה
  choice: dont Yahweh a parlé
  rationale: La tournure française conserve l’antériorité de la parole divine et rend le relatif אֲשֶׁר sans expliciter davantage son contenu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הִנֵּה
  choice: voici
  rationale: « Voici » conserve la force déictique et solennelle de הִנֵּה tout en restant naturel en français actuel.
- source_word: נִקְרָע
  choice: va se fendre
  rationale: Le niphal exprime ici l’événement subi par l’autel. Dans cette annonce prophétique, « va se fendre » est naturel et conserve l’image d’une rupture physique.
- source_word: וְנִשְׁפַּךְ
  choice: vont se répandre
  rationale: Le niphal de שׁפך signifie « être versé, se répandre ». Pour des résidus présents sur un autel qui se fend, « se répandre » exprime naturellement leur chute hors de celui-ci.
- source_word: הַדֶּשֶׁן
  choice: les cendres sacrificielles
  rationale: Dans ce contexte cultuel, דֶּשֶׁן désigne les cendres ou résidus gras des sacrifices. « Cendres sacrificielles » reste lisible tout en signalant cette nuance.
- source_word: אֲשֶׁר עָלָיו
  choice: qui sont dessus
  rationale: Cette relative rend directement la position des cendres sur l’autel, le pronom « dessus » ayant pour antécédent l’autel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Valeur temporelle des formes נִקְרָע et נִשְׁפַּךְ
  choice: annonce imminente au futur proche
  alternative: 'présent prophétique : « se fend… se répand »'
  rationale: Le signe est annoncé avant son accomplissement dans le récit. Le futur proche français exprime clairement cette valeur prédictive sans effacer la vivacité de l’hébreu.
translation_notes:
  register: Français international moderne, digne et narratif. « Voici » maintient la solennité prophétique ; le futur proche rend l’annonce immédiate. Le terme technique דֶּשֶׁן est explicité sobrement dans le corps du texte par « cendres sacrificielles ».
