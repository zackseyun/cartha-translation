source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: fr
  text: 'Il lui dit : « Moi aussi, je suis prophète comme toi. Un ange[a] m’a parlé sur l’ordre de Yahweh, en disant : “Ramène-le chez toi, afin qu’il mange du pain et boive de l’eau.” » Mais il lui mentit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « messager ». Le mot hébreu peut désigner un ange ou un messager humain.'
    reason: Préserver l’étendue sémantique de מַלְאָךְ.
lexical_decisions:
- source_word: נָבִיא
  choice: prophète
  rationale: Terme français usuel et précis pour une personne qui transmet une parole divine.
- source_word: מַלְאָךְ
  choice: ange
  rationale: Dans ce récit, la revendication d’un message reçu par la parole de Yahweh suggère un messager céleste. Le sens plus général « messager » est conservé en note.
- source_word: דִּבֶּר אֵלַי
  choice: m’a parlé
  rationale: Rend directement et naturellement l’idée d’une communication adressée au prophète.
- source_word: בִּדְבַר יְהוָה
  choice: par la parole de Yahweh
  rationale: Conserve le terme concret « parole » et la valeur instrumentale possible de la préposition hébraïque, sans préciser davantage le mécanisme de la révélation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent explicitement dans le texte hébreu.
- source_word: הֲשִׁבֵהוּ
  choice: Ramène-le
  rationale: Le hifil de שוב exprime ici l’action de faire revenir quelqu’un ; « ramener » en restitue naturellement la valeur causative.
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: avec toi dans ta maison
  rationale: Préserve l’accompagnement et la destination concrète exprimés en hébreu.
- source_word: וְיֹאכַל לֶחֶם
  choice: afin qu’il mange du pain
  rationale: Exprime le but de l’ordre tout en maintenant l’expression concrète « manger du pain ».
- source_word: וְיֵשְׁתְּ מָיִם
  choice: et boive de l’eau
  rationale: Conserve le parallélisme avec l’action de manger et le sens direct du texte.
- source_word: כִּחֵשׁ לוֹ
  choice: Mais il lui mentit
  rationale: Le verbe dénonce explicitement la fausseté de la déclaration. « Mais » fait ressortir le contraste narratif sans identifier autrement le contenu précis du mensonge.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom propre ; la transcription le rend visible sans le remplacer par un titre.
- issue: Identité du מַלְאָךְ revendiqué par le vieux prophète
  choice: ange
  alternative: messager
  rationale: Le contexte favorise un messager céleste, mais le mot hébreu reste lexicalement susceptible de désigner un messager humain ; cette ambiguïté est signalée en note.
- issue: Statut de la révélation alléguée
  choice: La déclaration est rapportée, puis explicitement qualifiée de mensonge
  alternative: Reformuler la déclaration comme une véritable révélation divine
  rationale: La dernière proposition interdit de valider théologiquement la revendication du prophète ; la traduction préserve le contraste posé par le narrateur.
translation_notes:
  register: Français moderne, international et digne. Le passé simple maintient la tonalité narrative biblique sans archaïsme lexical. La formulation conserve les images concrètes de l’hébreu et place l’appel de note immédiatement après le mot concerné.
