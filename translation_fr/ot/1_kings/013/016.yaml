  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: fr
  text: 'Il dit[a] : « Je ne peux pas retourner avec toi ni aller avec toi. Je ne mangerai pas de pain et ne boirai pas d’eau avec toi en ce lieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les deux premières propositions, l’hébreu emploie une forme féminine de « avec toi », puis une forme masculine dans la proposition concernant le repas et la boisson. Le français ne permet pas de rendre cette différence de genre.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Dans ce dialogue narratif, le verbe אָמַר introduit une réponse à l’invitation du prophète âgé ; « répondit » rend naturellement la relation discursive sans ajouter de contenu.
- source_word: לֹא אוּכַל לָשׁוּב
  choice: Je ne peux pas retourner
  rationale: L’imparfait de יכל sous négation exprime ici l’impossibilité, et שׁוב le retour vers le lieu proposé.
- source_word: וְלָבוֹא אִתָּךְ
  choice: ni t’accompagner
  rationale: בוא signifie venir ou aller selon le point de vue. Ici, le mouvement avec l’interlocuteur est rendu idiomatiquement par « accompagner », sans préciser indûment la direction.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: Je ne mangerai pas de pain
  rationale: Le futur français convient à l’interdiction qui régit la conduite du locuteur ; « pain » conserve le terme concret et la formule répétée du contexte.
- source_word: וְלֹא אֶשְׁתֶּה אִתְּךָ מַיִם
  choice: et ne boirai pas d’eau avec toi
  rationale: La coordination négative est conservée naturellement en français, ainsi que les termes concrets « eau » et « avec toi ».
- source_word: בַּמָּקוֹם הַזֶּה
  choice: dans ce lieu
  rationale: Traduction directe de la locution, dans un registre digne et naturel.
