  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: fr
  text: Il partit par un autre chemin et ne revint pas par le chemin qu’il avait pris pour venir à Béthel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Il partit donc
  rationale: Le wayyiqtol fait progresser le récit. « Il partit donc » exprime naturellement en français la conséquence de l’ordre reçu tout en conservant le mouvement narratif.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: par un autre chemin
  rationale: דֶּרֶךְ désigne ici le chemin ou l’itinéraire; cette formulation naturelle maintient le contraste avec le chemin de l’aller.
- source_word: וְלֹא שָׁב
  choice: et ne revint pas
  rationale: שׁוּב signifie ici revenir ou retourner; « ne revint pas » est concis et convient au contexte du déplacement.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: par le chemin qu’il avait pris pour venir
  rationale: La relative renvoie au chemin emprunté auparavant. Cette formulation explicite naturellement en français la valeur locative du suffixe בָהּ sans alourdir la phrase.
- source_word: אֶל בֵּית אֵל
  choice: à Béthel
  rationale: בֵּית אֵל est le nom propre de la ville. La graphie française usuelle « Béthel » est retenue; la préposition marque la destination de sa venue antérieure.
