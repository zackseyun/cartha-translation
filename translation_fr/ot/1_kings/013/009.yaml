source:
  edition: WLC
  text: כִּֽי כֵ֣ן צִוָּ֣ה אֹתִ֗/י בִּ/דְבַ֤ר יְהוָה֙ לֵ/אמֹ֔ר לֹא תֹ֥אכַל לֶ֖חֶם וְ/לֹ֣א תִשְׁתֶּה מָּ֑יִם וְ/לֹ֣א תָשׁ֔וּב בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתָּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: fr
  text: 'Car voici l’ordre qui m’a été donné par la parole du SEIGNEUR : « Tu ne mangeras pas de pain, tu ne boiras pas d’eau et tu ne reviendras pas par le chemin que tu as pris. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: Car voici
  rationale: Rend la justification introduite par כִּי et la référence à la teneur précise de l’ordre exprimée par כֵן, dans un français naturel.
- source_word: צִוָּה אֹתִי
  choice: l’ordre qui m’a été donné
  rationale: Le verbe hébreu a un sujet masculin singulier non exprimé. La tournure passive française conserve cette absence d’identification sans ajouter arbitrairement « il ».
- source_word: בִּדְבַר יְהוָה
  choice: par la parole du SEIGNEUR
  rationale: Traduction formelle de l’expression hébraïque; « SEIGNEUR » suit la convention française courante pour le tétragramme.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: Tu ne mangeras pas de pain
  rationale: Conserve le terme concret « pain » et la force prohibitive de לֹא avec l’inaccompli.
- source_word: וְלֹא תִשְׁתֶּה מָּיִם
  choice: tu ne boiras pas d’eau
  rationale: Reproduit directement la seconde interdiction, avec une coordination française fluide.
- source_word: וְלֹא תָשׁוּב בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: et tu ne reviendras pas par le chemin que tu as pris
  rationale: « Le chemin que tu as pris » rend idiomatiquement אֲשֶׁר הָלָכְתָּ sans transformer le verbe en « venir ».
theological_decisions:
- issue: Identité du sujet implicite de צִוָּה
  choice: Ne pas expliciter le sujet dans la traduction
  alternative: « il me l’a ordonné » ou « le SEIGNEUR me l’a ordonné »
  rationale: La forme verbale porte un sujet masculin singulier, mais le verset ne le nomme pas explicitement. La voix passive préserve cette donnée et évite de résoudre silencieusement la référence.
- issue: Représentation du nom divin יהוה
  choice: SEIGNEUR en petites capitales typographiques simulées par des capitales
  alternative: YHWH ou Yahvé
  rationale: Convention française largement intelligible et respectueuse de la tradition de lecture, sans imposer une vocalisation reconstruite.
translation_notes:
  register: Français moderne, digne et accessible. La citation est formulée avec le futur à valeur d’interdiction, naturel dans un énoncé solennel. Aucun marqueur de note n’est requis.
