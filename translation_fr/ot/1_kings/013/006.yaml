base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: fr
  text: 'Alors le roi répondit à l’homme de Dieu : « Je t’en prie, implore la faveur de Yahweh, ton Dieu, et prie pour moi, afin que ma main me soit rendue. » L’homme de Dieu implora la faveur de Yahweh, et la main du roi lui fut rendue : elle redevint comme auparavant.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַל ... אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: cherche la faveur de Yahweh / chercha la faveur de Yahweh
  rationale: L’expression idiomatique signifie solliciter ou rechercher la faveur de quelqu’un. Cette formulation française reste transparente sans reproduire littéralement « la face » ni suggérer, comme « apaiser », une propitiation que le contexte n’impose pas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le roi désigne Yahweh comme le Dieu de l’homme de Dieu. « Ton » conserve cette distance explicite sans la transformer en solidarité par « notre Dieu ».
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: et prie pour moi
  rationale: Cette formulation naturelle rend la prière en faveur d’autrui exprimée par le hitpael de פלל avec בעד.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: que ma main me soit rendue / la main du roi lui fut rendue
  rationale: Le retour de la main désigne ici son rétablissement après l’atteinte décrite au verset précédent. « Être rendue » conserve l’image hébraïque tout en étant intelligible en français.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: elle redevint comme auparavant
  rationale: La formule exprime le retour à l’état antérieur dans un français naturel et précis.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Le titre prophétique du texte source est conservé au lieu d’être remplacé par l’interprétation « le prophète ».
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: En français narratif, « répondit et dit » serait lourd et redondant. « Répondit » restitue naturellement la fonction de la formule hébraïque.
theological_decisions:
- issue: Yahweh est appelé « ton Dieu » dans la parole du roi
  choice: Conserver « Yahweh ton Dieu »
  alternative: « Yahweh notre Dieu »
  rationale: Le possessif singulier appartient au texte et maintient la distance exprimée par le roi. Le remplacer par « notre » introduirait une solidarité d’alliance que le passage ne formule pas.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure accessible; le parallélisme entre la demande et son accomplissement est conservé. Aucun marqueur de note n’est nécessaire, puisque l’idiome hébreu est rendu directement dans le texte.
