  - severity: low
    issue: L’apposition « Yahweh ton Dieu » gagnerait à être ponctuée.
    rationale: « Yahweh, ton Dieu » identifie clairement Yahweh comme l’apposition de « ton Dieu » et rend la phrase plus naturelle.
