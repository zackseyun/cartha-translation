  to: 'Alors le roi répondit à l’homme de Dieu : « Je t’en prie, implore la faveur de Yahweh, ton Dieu, et prie pour moi, afin que ma main me soit rendue. » L’homme de Dieu implora la faveur de Yahweh, et la main du roi lui fut rendue : elle redevint comme auparavant.'
  rationale: La révision remplace une formulation française quelque peu calquée par « implorer la faveur de », qui rend avec naturel et précision l’idiome hébreu de la sollicitation de faveur. Elle conserve la structure de la demande et de son accomplissement, le nom divin, la distance marquée par « ton Dieu », et l’image de la main rendue au roi.
