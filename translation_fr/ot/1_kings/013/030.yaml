source:
  edition: WLC
  text: וַ/יַּנַּ֥ח אֶת נִבְלָת֖/וֹ בְּ/קִבְר֑/וֹ וַ/יִּסְפְּד֥וּ עָלָ֖י/ו ה֥וֹי אָחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: fr
  text: 'Il déposa le cadavre dans son propre tombeau, puis ils se lamentèrent sur lui : « Hélas, mon frère[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mon frère » peut être ici une formule de lamentation exprimant la proximité ou la solidarité, sans nécessairement indiquer un lien de parenté biologique.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: déposa
  rationale: Le hiphil de נוח signifie ici « placer, déposer ». « Déposa » convient naturellement à la mise au tombeau sans ajouter l’idée d’un ensevelissement complet.
- source_word: נִבְלָתוֹ
  choice: le cadavre
  rationale: נְבֵלָה désigne explicitement un corps mort. « Cadavre » en conserve la force, tandis que « corps » serait plus atténué et « dépouille » plus interprétatif.
- source_word: בְּקִבְרוֹ
  choice: dans son propre tombeau
  rationale: קֶבֶר peut désigner une tombe ou un tombeau. Le contexte indique que le possessif renvoie au tombeau du vieux prophète; « son propre tombeau » rend ce rapport sans suggérer que le cadavre et le tombeau appartiennent à la même personne.
- source_word: וַיִּסְפְּדוּ
  choice: ils se lamentèrent
  rationale: ספד désigne le deuil exprimé pour un mort, souvent sous forme de lamentation. « Se lamentèrent » rend à la fois le pluriel hébreu et la parole funèbre qui suit.
- source_word: עָלָיו
  choice: sur lui
  rationale: Avec ספד, עַל introduit la personne sur laquelle porte la lamentation. « Sur lui » reste proche de l’hébreu et demeure naturel dans un registre biblique moderne.
- source_word: הוֹי
  choice: Hélas !
  rationale: הוֹי est ici une interjection de douleur funèbre. « Hélas ! » exprime le deuil sans lui donner la nuance de condamnation que pourrait évoquer « Malheur ! ».
- source_word: אָחִי
  choice: Mon frère
  rationale: אָחִי signifie littéralement « mon frère ». Cette formulation conserve le langage de proximité et de solidarité propre à la lamentation.
theological_decisions:
- issue: Portée de l’expression « mon frère »
  choice: Conserver la traduction littérale « Mon frère » et préciser son emploi possible en note.
  alternative: Mon proche / mon compagnon
  rationale: Le texte ne permet pas d’affirmer un lien biologique, mais remplacer « frère » supprimerait l’image familiale et la force affective de la formule funèbre.
translation_notes:
  register: Français international actuel, digne et lisible. La ponctuation détache l’interjection « Hélas ! » de l’apostrophe « Mon frère ! », tout en conservant la brièveté solennelle de la lamentation. Le pluriel « ils se lamentèrent » est maintenu conformément au texte hébreu.
