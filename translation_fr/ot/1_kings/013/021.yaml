source:
  edition: WLC
  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: fr
  text: 'Il s’écria à l’homme de Dieu venu de Juda : « Ainsi parle Yahweh : Puisque tu t’es rebellé contre la parole de Yahweh[a] et que tu n’as pas observé le commandement que Yahweh, ton Dieu, t’avait prescrit, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la bouche de Yahweh », expression qui désigne ce que Yahweh a dit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Il s’écria
  rationale: Le verbe קרא peut signifier appeler, proclamer ou crier. Dans cette dénonciation prophétique solennelle, « s’écria » rend la force de la prise de parole sans ajouter l’idée d’un simple appel de loin.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette désignation hébraïque traditionnelle est conservée telle quelle plutôt que remplacée par l’interprétation « le prophète ».
- source_word: מִיהוּדָה
  choice: venu de Juda
  rationale: Cette formulation française naturelle exprime le lieu d’origine tout en tenant compte du verbe בָּא, « venir ».
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique française consacrée, à la fois concise, solennelle et fidèle à la formule de messager hébraïque.
- source_word: יַעַן כִּי
  choice: Puisque
  rationale: Introduit naturellement en français le motif de la sentence annoncée, laquelle se poursuit au verset suivant.
- source_word: מָרִיתָ
  choice: tu t’es rebellé
  rationale: Le verbe מרה exprime une rébellion ou une défiance, et non une simple négligence.
- source_word: פִּי יְהוָה
  choice: la parole de Yahweh
  rationale: Littéralement « la bouche de Yahweh » ; l’expression désigne ici ce que Yahweh a déclaré. « La parole » restitue clairement cet idiome.
- source_word: וְלֹא שָׁמַרְתָּ
  choice: et que tu n’as pas observé
  rationale: Avec un commandement pour complément, שׁמר signifie garder, respecter ou observer. « Observer » est naturel et évite d’affaiblir l’idée d’obéissance.
- source_word: הַמִּצְוָה אֲשֶׁר צִוְּךָ
  choice: le commandement que … t’avait donné
  rationale: Cette tournure rend le nom et le verbe apparentés sans produire en français la répétition lourde « le commandement que … t’avait commandé ».
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Rend directement le nom divin et la relation personnelle exprimée par le suffixe possessif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le tétragramme, nom personnel de Dieu. Sa translittération le distingue du titre אֲדֹנָי et préserve cette donnée du texte.
- issue: Force de מָרִיתָ
  choice: tu t’es rebellé
  alternative: tu as désobéi
  rationale: Le choix retenu conserve la gravité de l’accusation et la notion de défiance portée par le verbe, sans réduire celle-ci à une simple infraction.
- issue: Idiome פִּי יְהוָה
  choice: la parole de Yahweh
  alternative: la bouche de Yahweh
  rationale: Le sens idiomatique vise ce que Yahweh a prononcé. La traduction principale communique ce sens, tandis que la note conserve l’image littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Ainsi parle Yahweh » maintient le registre prophétique. La phrase reste ouverte par une virgule finale à l’intérieur de la citation, car la sentence se poursuit au verset 22.
