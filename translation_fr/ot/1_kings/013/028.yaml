base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: fr
  text: Il partit et trouva son cadavre jeté sur la route[a]. L’âne et le lion se tenaient à côté du cadavre. Le lion n’avait pas mangé le cadavre et n’avait pas mis l’âne en pièces[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « corps » ou « dépouille » pour « cadavre » (hébreu נְבֵלָה) ; le terme hébreu est cru et souligne la réalité de la mort.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « n’avait pas brisé l’âne ». Dans ce contexte, il s’agit de le mettre en pièces ou de le mutiler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: son cadavre / le cadavre
  rationale: נְבֵלָה désigne un corps mort. « Cadavre » convient naturellement à un être humain et conserve la rudesse du terme hébreu; « corps » serait moins saisissant et « carcasse » évoque surtout un animal en français contemporain.
- source_word: מֻשְׁלֶכֶת
  choice: jeté
  rationale: Le participe passif de שלך indique que le cadavre a été jeté ou abandonné là. « Jeté » préserve la force de l’image sans l’affaiblir en simple « étendu ».
- source_word: בַּדֶּרֶךְ
  choice: sur la route
  rationale: דֶּרֶךְ désigne ici la voie empruntée; « sur la route » est idiomatique et respecte la localisation du texte.
- source_word: עֹמְדִים אֵצֶל
  choice: se tenaient à côté de
  rationale: Le participe avec אֵצֶל présente les deux animaux immobiles près du cadavre. « Se tenaient à côté de » restitue naturellement ce tableau en français.
- source_word: לֹא אָכַל
  choice: n’avait pas mangé
  rationale: אָכַל est le verbe courant « manger ». Le plus-que-parfait exprime l’état de fait constaté à l’arrivée de l’homme sans renforcer indûment le verbe par « dévorer ».
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: n’avait pas mis l’âne en pièces
  rationale: שׁבר signifie littéralement « briser ». Avec l’âne comme objet et le lion comme sujet, « mettre en pièces » transmet l’image d’une destruction violente tout en restant naturel; la note conserve le sens littéral.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: Il partit et trouva
  rationale: Les deux wayyiqtol marquent une progression narrative simple. « Il partit et trouva » est fluide, actuel et fidèle, tout en rendant וַיֵּלֶךְ plus précisément que « il alla » dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « cadavre », présente dans l’hébreu, est conservée. La première phrase est séparée de la description des animaux afin d’éviter une coordination française ambiguë et de rendre clairement le pluriel עֹמְדִים.
