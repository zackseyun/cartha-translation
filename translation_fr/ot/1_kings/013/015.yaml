  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו לֵ֥ךְ אִתִּ֖/י הַ/בָּ֑יְתָ/ה וֶ/אֱכֹ֖ל לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/015.yaml
  text: Then he said to him[a], “Come home with me and eat bread.”
translation:
  language: fr
  text: 'Alors il lui dit : « Viens[a] avec moi à la maison et mange du pain[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Va » ; dans cette invitation, le français emploie naturellement « viens » du point de vue de celui qui parle.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « pain » peut aussi désigner plus largement de la nourriture ou un repas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors il lui dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » restitue naturellement cette succession narrative, tandis que « lui » rend אֵלָיו.
- source_word: לֵךְ אִתִּי
  choice: Viens avec moi
  rationale: לֵךְ signifie littéralement « va », mais, dans une invitation formulée par celui qui accompagne l’interlocuteur, le français dit naturellement « viens avec moi ».
- source_word: הַבָּיְתָה
  choice: à la maison
  rationale: Le hé directionnel indique un mouvement vers la maison. « À la maison » reste naturel sans expliciter « chez moi », qui est seulement impliqué par le contexte.
- source_word: וֶאֱכֹל לָחֶם
  choice: et mange du pain
  rationale: Cette formulation conserve la simplicité du verbe « manger » et le sens premier de לֶחֶם, « pain », tout en laissant à la note son emploi possible au sens plus large de nourriture ou de repas.
