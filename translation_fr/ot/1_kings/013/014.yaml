  edition: WLC
  text: וַ/יֵּ֗לֶךְ אַֽחֲרֵי֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יִּ֨מְצָאֵ֔/הוּ יֹשֵׁ֖ב תַּ֣חַת הָ/אֵלָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו הַ/אַתָּ֧ה אִישׁ הָ/אֱלֹהִ֛ים אֲשֶׁר בָּ֥אתָ מִֽ/יהוּדָ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: fr
  text: 'Il partit donc à la recherche de l’homme de Dieu et le trouva assis sous le térébinthe[a]. Il lui demanda : « Es-tu l’homme de Dieu qui est venu de Juda ? » Il répondit : « Oui, c’est moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous le chêne ». Le mot hébreu אֵלָה désigne plus précisément un térébinthe.
    reason: Alternative lexicale liée à l’identification de l’arbre.
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: partit donc à la recherche de
  rationale: Dans ce contexte de poursuite immédiate, l’expression indique qu’il se met en route derrière l’homme pour le retrouver. Cette formulation est naturelle en français et conserve le mouvement du récit.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Traduction directe du titre hébreu, maintenue sans le réduire au terme plus interprétatif « prophète ».
- source_word: וַיִּמְצָאֵהוּ
  choice: le trouva
  rationale: Le verbe מצא signifie ici simplement trouver quelqu’un après l’avoir recherché.
- source_word: יֹשֵׁב
  choice: assis
  rationale: Le participe décrit la posture de l’homme au moment où il est trouvé.
- source_word: תַּחַת הָאֵלָה
  choice: sous le térébinthe
  rationale: אֵלָה désigne plus précisément le térébinthe, même si l’identification par « chêne » est également traditionnelle.
- source_word: הַאַתָּה
  choice: Es-tu
  rationale: Rend directement et naturellement la question d’identification introduite par la particule interrogative et le pronom.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: qui est venu de Juda
  rationale: La proposition relative identifie l’homme par sa provenance; le passé composé convient naturellement au dialogue français.
- source_word: אָנִי
  choice: Oui, c’est moi
  rationale: La réponse hébraïque elliptique signifie littéralement « Moi ». En français courant, « Oui, c’est moi » exprime clairement l’affirmation d’identité sans lui prêter une portée théologique indépendante.
theological_decisions:
- issue: Traduction du titre אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  alternative: le prophète de Dieu
  rationale: La traduction directe préserve le titre propre au récit et évite de substituer une désignation de fonction plus étroite.
- issue: Portée de la réponse אָנִי
  choice: Oui, c’est moi
  alternative: Je suis
  rationale: La réponse affirme simplement l’identité demandée. La formulation française choisie évite que « Je suis » soit artificiellement investi d’une portée théologique que le contexte ne requiert pas.
translation_notes:
  register: Français international moderne, narratif et digne. « Partit donc à la recherche de » explicite naturellement la poursuite contextuelle; les répétitions hébraïques de « il dit » sont rendues par « demanda » et « répondit » pour un dialogue fluide, sans modifier le contenu.
