source:
  edition: WLC
  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: fr
  text: « Lève-toi, descends à la rencontre d’Achab, roi d’Israël, qui est à Samarie. Le voici dans la vigne de Naboth, où il est descendu pour en prendre possession[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la posséder » ou « pour en hériter ». Selon le contexte, le verbe hébreu peut signifier prendre possession, posséder ou hériter.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: Lève-toi
  rationale: L’impératif de קום appelle à se mettre debout et à agir. « Lève-toi » conserve la vigueur du commandement prophétique dans un français actuel et digne.
- source_word: רֵד
  choice: descends
  rationale: L’impératif de ירד exprime un déplacement vers le bas. « Descends » en garde directement le sens directionnel.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: Cette expression signifie aller vers quelqu’un pour le rencontrer. Elle préserve la nature de la rencontre sans expliciter trop tôt l’idée de confrontation.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Traduction directe et naturelle du titre royal à l’état construit.
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: qui est à Samarie
  rationale: La proposition hébraïque est sans verbe exprimé; le français requiert ici « est ». « À Samarie » convient naturellement à une localisation dans une ville et conserve telle quelle l’indication du texte source.
- source_word: הִנֵּה
  choice: Le voici
  rationale: La particule attire vivement l’attention sur la présence actuelle d’Achab. « Le voici » rend cette fonction déictique sans archaïsme.
- source_word: בְּכֶרֶם נָבוֹת
  choice: dans la vigne de Naboth
  rationale: La préposition בְּ indique ici la localisation, rendue directement par « dans ».
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: où il est descendu
  rationale: Le relatif renvoie à la vigne. Le passé composé relie naturellement en français le déplacement antérieur d’Achab à sa présence actuelle sur place.
- source_word: לְרִשְׁתּוֹ
  choice: pour en prendre possession
  rationale: Le verbe ירשׁ peut désigner le fait de prendre possession, de posséder ou d’hériter. Dans ce contexte, la formulation choisie exprime l’appropriation concrète de la vigne sans ajouter au verbe une violence qui n’y est pas explicitement formulée.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs restent brefs et énergiques. La formulation conserve l’indication « à Samarie » et la tension apparente avec la présence d’Achab dans la vigne, sans la résoudre par une précision absente de l’hébreu.
