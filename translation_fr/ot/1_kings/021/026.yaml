id: 1KI.21.26
reference: 1 Kings 21:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּתְעֵ֣ב מְאֹ֔ד לָ/לֶ֖כֶת אַחֲרֵ֣י הַ/גִּלֻּלִ֑ים כְּ/כֹל֙ אֲשֶׁ֣ר עָשׂ֣וּ הָ/אֱמֹרִ֔י אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: fr
  text: Il se conduisit de manière tout à fait abominable en suivant les idoles[a], selon tout ce qu’avaient fait les Amorites, que Yahweh avait chassés devant les fils d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « idoles » est fortement méprisant; on pourrait aussi traduire par « idoles répugnantes » ou, plus littéralement, « idoles de fumier ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les Israélites »; l’expression hébraïque signifie littéralement « les fils d’Israël » et désigne ici collectivement le peuple d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: Il se conduisit de manière tout à fait abominable
  rationale: Cette formulation rend la valeur comportementale du verbe au hitpael ainsi que l’intensité de מְאֹד, dans un français naturel, sans réduire le propos à un simple état.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: en suivant
  rationale: Le tour exprime la manière dont Achab s’est conduit de façon abominable. « Suivre » conserve l’idée d’adhésion et d’allégeance impliquée par l’image hébraïque.
- source_word: הַגִּלֻּלִים
  choice: les idoles
  rationale: « Idoles » est immédiatement compréhensible. La nuance fortement méprisante du mot hébreu est signalée en note.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: selon tout ce qu’avaient fait
  rationale: Cette tournure conserve étroitement la comparaison avec l’ensemble de la conduite des Amorites. Le plus-que-parfait situe naturellement leurs actes avant le récit concernant Achab.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier morphologique a ici une valeur collective; le pluriel français est donc naturel.
- source_word: הוֹרִישׁ
  choice: avait chassés
  rationale: Le hiphil de ירשׁ exprime ici l’expulsion des anciens habitants. « Chasser » est clair et convient au contexte de la prise du pays.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: מִפְּנֵי
  choice: devant
  rationale: Dans ce contexte, la préposition décrit les Amorites repoussés de devant Israël; « devant » conserve cette image spatiale.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette traduction formelle préserve l’expression masculine du texte source; l’équivalent collectif plus idiomatique est indiqué en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: Le choix principal conserve la forme de l’hébreu, tandis que la note précise son sens collectif afin d’éviter de suggérer que seuls des hommes sont visés.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit historique; les formulations restent proches de la structure hébraïque sans devenir artificielles.
