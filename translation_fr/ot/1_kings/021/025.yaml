source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: fr
  text: Il n’y eut vraiment personne comme Achab, qui s’était vendu pour faire ce qui est mal aux yeux de Yahweh, lui que Jézabel, sa femme, avait entraîné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: vraiment
  rationale: Dans ce contexte, la particule souligne avec force le caractère incomparable d’Achab. « Vraiment » restitue cette valeur emphatique en français naturel.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: il n’y eut personne comme Achab
  rationale: Cette tournure idiomatique exprime l’absence de personne comparable à Achab.
- source_word: הִתְמַכֵּר
  choice: s’était vendu
  rationale: Le verbe à la forme réfléchie évoque métaphoriquement quelqu’un qui se vend ou se livre lui-même. « S’était vendu » conserve cette image frappante.
- source_word: לַעֲשׂוֹת הָרַע
  choice: pour faire ce qui est mal
  rationale: Cette formulation courante rend l’idée de commettre ce qui est moralement mauvais sans introduire un mal particulier absent du texte.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La traduction conserve l’image hébraïque du jugement porté par Dieu tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: הֵסַתָּה
  choice: avait poussé
  rationale: Le hifil exprime l’action d’inciter ou de pousser quelqu’un à agir. « Avait poussé » est clair et naturel, tout en gardant la nuance négative donnée par le contexte.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: lui que sa femme Jézabel avait poussé à agir ainsi
  rationale: Cette relative maintient le rattachement grammatical à Achab sans transformer explicitement la proposition en cause. « À agir ainsi » explicite seulement le renvoi à l’action mauvaise déjà mentionnée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement et évite de lui substituer un titre.
- issue: Responsabilité d’Achab et influence de Jézabel
  choice: Achab se vend lui-même, tandis que Jézabel le pousse à agir ainsi
  alternative: présenter l’influence de Jézabel comme la cause qui disculperait partiellement Achab
  rationale: Le verset juxtapose l’engagement volontaire d’Achab dans le mal et l’incitation de Jézabel. La traduction conserve les deux éléments sans réduire la responsabilité de l’un au profit de l’autre.
translation_notes:
  register: Français international moderne, digne et accessible. L’image forte de l’homme qui « s’était vendu » est conservée. La reprise « lui que » préserve la construction relative et évite d’imposer une relation causale plus explicite que l’hébreu.
