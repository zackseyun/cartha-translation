  yaml_path: translation/ot/1_kings/021/014.yaml
  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: fr
  text: 'Alors ils envoyèrent dire à Jézabel : « Naboth a été lapidé et il est mort. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Alors ils envoyèrent dire
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, tandis que « envoyèrent dire » rend de façon idiomatique l’envoi d’un message introduit par לֵאמֹר.
- source_word: אֶל אִיזֶבֶל
  choice: à Jézabel
  rationale: La préposition indique la destinataire du message; le nom propre suit sa forme française traditionnelle.
- source_word: לֵאמֹר
  choice: dire
  rationale: Dans la tournure « envoyèrent dire », l’infinitif rend naturellement la formule hébraïque qui introduit le contenu du message.
- source_word: סֻקַּל
  choice: a été lapidé
  rationale: Le pual est passif. Le passé composé convient à l’annonce d’un fait qui vient de s’accomplir, sans ajouter « à mort », absent de ce verbe.
- source_word: נָבוֹת
  choice: Naboth
  rationale: Forme française traditionnelle du nom propre.
- source_word: וַיָּמֹת
  choice: et il est mort
  rationale: Cette traduction conserve la valeur événementielle et séquentielle du wayyiqtol, plutôt que de la transformer en simple état résultant.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation brève garde la structure du message hébreu et son parallélisme verbal, sans expliciter que la lapidation a causé la mort au-delà de ce que dit le texte.
