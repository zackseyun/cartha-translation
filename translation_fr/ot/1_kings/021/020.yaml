source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל אֵ֣לִיָּ֔הוּ הַֽ/מְצָאתַ֖/נִי אֹיְבִ֑/י וַ/יֹּ֣אמֶר מָצָ֔אתִי יַ֚עַן הִתְמַכֶּרְ/ךָ֔ לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: fr
  text: 'Achab dit à Élie : « M’as-tu trouvé, mon ennemi ? » Élie répondit : « Je t’ai trouvé, parce que tu t’es vendu pour faire ce qui est mal aux yeux de Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement rendu par « le SEIGNEUR »; autres formes possibles : « Yahvé » et « Jéhovah ».'
    reason: Signaler le tétragramme et les principales traditions de rendu en français.
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: M’as-tu trouvé
  rationale: Le verbe מצא signifie ici « trouver ». La formulation interrogative directe conserve le ton de confrontation d’Achab.
- source_word: אֹיְבִי
  choice: mon ennemi
  rationale: Le nom avec suffixe de première personne est rendu directement. En français moderne, le vocatif se comprend sans ajouter l’interjection vieillie « ô ».
- source_word: מָצָאתִי
  choice: Je t’ai trouvé
  rationale: La répétition de « trouver » préserve l’écho verbal voulu entre la question d’Achab et la réponse d’Élie.
- source_word: יַעַן
  choice: parce que
  rationale: Cette conjonction introduit la raison de la déclaration d’Élie; « parce que » en exprime clairement la valeur causale.
- source_word: הִתְמַכֶּרְךָ
  choice: tu t’es vendu
  rationale: La forme réflexive de מכר signifie littéralement « se vendre ». Cette traduction conserve l’image forte d’un abandon volontaire au mal.
- source_word: לַעֲשׂוֹת הָרַע
  choice: pour faire ce qui est mal
  rationale: L’infinitif suivi de l’adjectif substantivé désigne l’action de commettre ce qui est mauvais. Cette tournure est naturelle en français et garde la portée morale de l’expression.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: « Aux yeux de » conserve l’image de l’idiome hébreu exprimant l’évaluation divine, tout en restant naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de signaler que le texte hébreu emploie ici le tétragramme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le représente comme nom propre sans le remplacer par le titre traditionnel, tandis que la note signale les autres usages connus.
translation_notes:
  register: Français moderne, digne et direct. Le dialogue conserve sa brièveté et son hostilité. « Ô mon ennemi » a été évité parce que « ô » sonnerait inutilement archaïque; la simple apostrophe « mon ennemi » rend naturellement le vocatif hébreu.
