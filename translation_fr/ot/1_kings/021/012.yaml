  text: They proclaimed a fast and seated Naboth at the head of the people[a].
translation:
  language: fr
  text: Ils proclamèrent un jeûne et firent asseoir Naboth à la tête du peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le peuple » ou « à la première place parmi le peuple ». L’expression hébraïque dit littéralement « à la tête du peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: Ils proclamèrent
  rationale: Avec « jeûne » pour complément, le verbe désigne l’annonce publique et officielle d’un jeûne. « Proclamèrent » convient au caractère civique et solennel de l’action.
- source_word: צוֹם
  choice: un jeûne
  rationale: Le nom désigne ici un jeûne formel observé collectivement; « un jeûne » est l’expression française naturelle après « proclamer ».
- source_word: וְהֹשִׁיבוּ
  choice: et firent asseoir
  rationale: La forme causative du verbe ישב signifie qu’on amène quelqu’un à s’asseoir ou qu’on lui assigne une place. « Firent asseoir » conserve explicitement cette valeur causative.
- source_word: אֶת נָבוֹת
  choice: Naboth
  rationale: אֶת marque Naboth comme complément d’objet direct défini. Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: בְּרֹאשׁ
  choice: à la tête de
  rationale: L’expression signifie littéralement « à la tête de » ou « au premier rang de ». La traduction retenue préserve l’image hébraïque et l’idée d’une place en vue sans préciser davantage la disposition de l’assemblée.
- source_word: הָעָם
  choice: du peuple
  rationale: Le terme עם désigne le peuple, ici vraisemblablement la population réunie. « Peuple » reste plus proche du lexique hébreu que l’interprétation « assemblée ».
