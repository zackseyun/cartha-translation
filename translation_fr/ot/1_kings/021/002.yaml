base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: fr
  text: 'Achab dit à Naboth : « Donne-moi ta vigne pour que j’en fasse un jardin potager, car elle est près de ma maison. À sa place, je te donnerai une vigne meilleure que la tienne. Ou, si cela te paraît bon[a], je te paierai son prix en argent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si cela est bon à tes yeux », expression qui signifie « si cela te convient » ou « si tu l’approuves ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל נָבוֹת לֵאמֹר
  choice: Achab dit à Naboth
  rationale: La formule narrative hébraïque signifie littéralement qu’Achab parla à Naboth en disant. « Dit à » en restitue naturellement la fonction en français sans alourdir la phrase.
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: Donne-moi ta vigne
  rationale: L’impératif direct et le complément de première personne sont conservés, tandis que כֶּרֶם reçoit son équivalent français courant, « vigne ».
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: pour que j’en fasse un jardin potager
  rationale: 'La tournure française exprime clairement le résultat recherché : convertir la vigne en jardin destiné à la culture de légumes.'
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: car elle est près de ma maison
  rationale: La proposition causale et la proximité spatiale sont rendues directement et naturellement.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו כֶּרֶם טוֹב מִמֶּנּוּ
  choice: À sa place, je te donnerai une vigne meilleure
  rationale: תַּחְתָּיו indique ici un échange. Le comparatif מִמֶּנּוּ est implicitement compris en français après « meilleure », sans répétition lourde de « qu’elle ».
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: si cela te paraît bon
  rationale: Cette formulation reste proche de l’image hébraïque tout en étant compréhensible en français moderne; elle exprime l’approbation personnelle de Naboth sans la réduire nécessairement à une simple préférence.
- source_word: אֶתְּנָה לְךָ כֶסֶף מְחִיר זֶה
  choice: je te paierai son prix en argent
  rationale: La formulation rend explicitement la proposition d’un paiement monétaire correspondant au prix de la vigne, dans un français idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le discours direct conserve le ton franc de la demande d’Achab, tandis que les formulations idiomatiques évitent les calques inutiles sans effacer l’image de ce qui est « bon aux yeux » de Naboth.
