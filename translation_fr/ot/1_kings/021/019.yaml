source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: fr
  text: 'Tu lui parleras en ces termes : « Ainsi parle Yahweh : N’as-tu pas assassiné[a], et aussi pris possession ? » Tu lui parleras en ces termes : « Ainsi parle Yahweh : À l’endroit où les chiens ont léché le sang de Naboth, les chiens lécheront ton sang, à toi aussi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tué ». Le verbe hébreu peut avoir ce sens plus général, mais il désigne ici vraisemblablement un meurtre.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression finale « à toi aussi » est emphatique en hébreu : elle souligne qu’Achab subira personnellement la même humiliation que Naboth.'
    reason: rhetorical_emphasis
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: Tu lui parleras en ces termes
  rationale: Cette formulation française naturelle conserve la solennité de la mission prophétique ainsi que la répétition intégrale de la formule dans le texte hébreu.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique traditionnelle et concise, au présent en français, qui rend le parfait de déclaration hébreu et conserve le nom divin.
- source_word: הֲרָצַחְתָּ
  choice: N’as-tu pas assassiné
  rationale: רצח désigne ici un homicide criminel. « Assassiner » porte en français la force morale et judiciaire de l’accusation, sans réduire le rôle d’Achab à l’acte matériel de mise à mort.
- source_word: וְגַם יָרָשְׁתָּ
  choice: et aussi pris possession
  rationale: ירש peut signifier hériter, posséder ou prendre possession. Le contexte indique l’appropriation de la vigne, mais l’absence de complément dans l’hébreu est conservée.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: À l’endroit où
  rationale: Rend directement la construction locative et relative dans un français actuel.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: ont léché ... lécheront
  rationale: La répétition du même verbe français reproduit le lien verbal et l’image saisissante de l’hébreu.
- source_word: הַכְּלָבִים
  choice: les chiens
  rationale: Traduction littérale de l’image centrale du jugement prophétique.
- source_word: דַּם נָבוֹת
  choice: le sang de Naboth
  rationale: Rend directement la chaîne construite hébraïque et conserve la forme usuelle du nom propre.
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: ton sang, à toi aussi
  rationale: La reprise pronominale française maintient l’ajout final abrupt et emphatique גַּם אָתָּה, qui applique personnellement à Achab le sort annoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Force morale de l’accusation exprimée par הֲרָצַחְתָּ
  choice: N’as-tu pas assassiné
  alternative: N’as-tu pas tué
  rationale: Le contexte est celui du meurtre illégitime de Naboth, auquel Achab est tenu pour responsable. « Assassiné » conserve cette force accusatrice, tandis que « tué » serait plus général.
- issue: Portée de וְגַם יָרָשְׁתָּ
  choice: et aussi pris possession
  alternative: et aussi hérité
  rationale: « Pris possession » laisse ouverte la gamme contextuelle de ירש tout en évitant de présenter l’acquisition comme un héritage légitime.
- issue: Emphase finale de גַּם אָתָּה
  choice: ton sang, à toi aussi
  alternative: aussi ton sang
  rationale: La formulation retenue préserve la mise en relief personnelle et tardive de l’hébreu au lieu de l’intégrer silencieusement dans une phrase plus lisse.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de la formule de mission prophétique est volontairement conservée. La syntaxe légèrement abrupte de la question et de la conclusion respecte la force rhétorique de l’hébreu.
