base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: fr
  text: 'Il lui répondit : « Parce que j’ai parlé à Naboth de Jizréel et lui ai dit : “Donne-moi ta vigne contre de l’argent ou, si tu préfères, je te donnerai une autre vigne à la place.” Mais il m’a répondu : “Je ne te donnerai pas ma vigne.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Parce que
  rationale: 'Conserve la valeur causale du texte hébreu : Achab répond directement à la question précédente sur la cause de son abattement.'
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Naboth de Jizréel
  rationale: Formulation française naturelle pour désigner l’homme originaire ou habitant de Jizréel.
- source_word: תְּנָה לִּי
  choice: Donne-moi
  rationale: Reproduit simplement l’impératif hébreu sans préciser juridiquement si la vigne doit être vendue ou cédée, ce que la suite explicite.
- source_word: בְּכֶסֶף
  choice: contre de l’argent
  rationale: כֶּסֶף désigne ici le paiement en argent, plutôt que le métal en tant que tel.
- source_word: אִם חָפֵץ אַתָּה
  choice: si tu préfères
  rationale: Rend idiomatiquement l’idée de volonté ou de bon plaisir dans le choix proposé.
- source_word: כֶרֶם תַּחְתָּיו
  choice: une autre vigne à la place
  rationale: Exprime clairement l’échange proposé tout en conservant le sens de substitution.
