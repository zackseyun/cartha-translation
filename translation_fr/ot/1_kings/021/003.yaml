source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר נָב֖וֹת אֶל אַחְאָ֑ב חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/תִּתִּ֛/י אֶת נַחֲלַ֥ת אֲבֹתַ֖/י לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: fr
  text: 'Mais Naboth répondit à Achab : « Que Yahweh me garde de te donner le patrimoine de mes pères ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais ... répondit
  rationale: Le waw fait progresser le récit, tandis que « mais » marque naturellement le contraste avec la proposition d’Achab. « Répondit » convient au contexte dialogué sans modifier le contenu de la parole.
- source_word: נָבוֹת אֶל־אַחְאָב
  choice: Naboth ... à Achab
  rationale: Les noms propres suivent leurs formes françaises usuelles et אֶל introduit l’interlocuteur.
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: Que Yahweh me garde de
  rationale: Cette tournure française exprime le rejet énergique et religieux porté par l’idiome hébreu, tout en nommant explicitement Yahweh. Elle évite le calque peu naturel « loin de moi par Yahweh ».
- source_word: מִתִּתִּי ... לָךְ
  choice: de te donner
  rationale: L’infinitif désigne l’acte repoussé et le pronom datif est rendu naturellement avant le verbe en français.
- source_word: נַחֲלַת אֲבֹתַי
  choice: le patrimoine de mes pères
  rationale: « Patrimoine » désigne ici un bien foncier reçu dans la lignée familiale et rend mieux cette réalité que le français courant « héritage », qui pourrait suggérer l’acte ou l’ensemble de la succession.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Valeur de חָלִילָה לִּי מֵיהוָה
  choice: Que Yahweh me garde de
  alternative: Loin de moi, par Yahweh, l’idée de
  rationale: Le choix conserve la référence explicite à Yahweh et la force de répudiation, tout en donnant une formulation française naturelle. Le calque pourrait laisser ouverte une nuance de serment, mais il serait obscur et peu idiomatique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la solennité de la déclaration sans archaïsme excessif. « Pères » préserve le masculin explicite de l’hébreu et la notion de lignée.
