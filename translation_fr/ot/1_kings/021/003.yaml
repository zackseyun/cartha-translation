  source_fidelity: 'Le texte rend fidèlement la réponse de Naboth : le contraste narratif (« Mais »), l’adresse à Achab, le refus énergique formulé en relation avec Yahweh, l’infinitif « de te donner » et la possession foncière héritée des pères sont tous préservés. « Que Yahweh me garde de » est une équivalence idiomatique française recevable de l’expression forte חָלִילָה לִּי מֵיְהוָה, sans prétendre résoudre de façon excessive sa nuance d’invocation ou de répudiation.'
