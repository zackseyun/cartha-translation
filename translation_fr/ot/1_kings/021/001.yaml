  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כֶּ֧רֶם הָיָ֛ה לְ/נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י אֲשֶׁ֣ר בְּ/יִזְרְעֶ֑אל אֵ֚צֶל הֵיכַ֣ל אַחְאָ֔ב מֶ֖לֶךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: fr
  text: Après ces événements[a], Naboth de Jizréel avait une vigne à Jizréel, à côté du palais d’Achab, roi de Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Après ces événements, il y avait à Jizréel, à côté du palais d’Achab, roi de Samarie, une vigne appartenant à Naboth de Jizréel. » L’hébreu exprime la possession par une tournure signifiant littéralement « il y avait une vigne à Naboth ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[non rendu séparément]'
  rationale: La forme narrative introduit un nouvel épisode. En français moderne, sa fonction discursive est naturellement portée par la proposition temporelle qui ouvre le verset, sans ajouter « Or » ni la formule vieillie « Il arriva que ».
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: La formule marque une transition temporelle. « Événements » restitue ici naturellement le sens contextuel de דְּבָרִים tout en conservant le pluriel.
- source_word: כֶּרֶם
  choice: une vigne
  rationale: « Vigne » est le terme français courant pour un terrain planté de ceps et correspond au sens normal de כֶּרֶם.
- source_word: הָיָה לְנָבוֹת
  choice: Naboth … avait
  rationale: La construction existentielle possessive, littéralement « une vigne était à Naboth », se rend idiomatiquement en français par le verbe « avoir ».
- source_word: נָבוֹת
  choice: Naboth
  rationale: Translittération française traditionnelle du nom propre.
- source_word: הַיִּזְרְעֵאלִי
  choice: de Jizréel
  rationale: Le gentilé désigne l’origine ou le rattachement de Naboth à Jizréel. « De Jizréel » est plus naturel en français courant que « le Jizréélite » et préserve le sens.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: à Jizréel
  rationale: Le groupe localise la vigne dans la ville de Jizréel. La préposition « à » convient à un nom de ville.
- source_word: אֵצֶל
  choice: à côté de
  rationale: Cette locution exprime clairement la proximité immédiate indiquée par אֵצֶל.
- source_word: הֵיכַל
  choice: palais
  rationale: Dans ce contexte royal, הֵיכַל désigne la résidence d’Achab, et non un temple.
- source_word: אַחְאָב
  choice: Achab
  rationale: Forme française traditionnelle du nom du roi.
- source_word: מֶלֶךְ שֹׁמְרוֹן
  choice: roi de Samarie
  rationale: La construction qualifie Achab par son domaine royal. L’apposition française avec virgule est claire et naturelle.
