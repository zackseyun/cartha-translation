  text: וַ/יַּעֲשׂוּ֩ אַנְשֵׁ֨י עִיר֜/וֹ הַ/זְּקֵנִ֣ים וְ/הַ/חֹרִ֗ים אֲשֶׁ֤ר הַ/יֹּֽשְׁבִים֙ בְּ/עִיר֔/וֹ כַּ/אֲשֶׁ֛ר שָׁלְחָ֥ה אֲלֵי/הֶ֖ם אִיזָ֑בֶל כַּ/אֲשֶׁ֤ר כָּתוּב֙ בַּ/סְּפָרִ֔ים אֲשֶׁ֥ר שָׁלְחָ֖ה אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: fr
  text: Les hommes de sa ville — les anciens et les notables[a] qui habitaient dans sa ville — firent ce que Jézabel leur avait envoyé, comme cela était écrit dans les lettres qu’elle leur avait envoyées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dignitaires »; le terme hébreu peut désigner des hommes socialement éminents ou de hauts responsables.
    reason: Alternative lexicale pour הַחֹרִים, dont le sens porte sur le rang social ou officiel.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: firent
  rationale: Le verbe עשה exprime ici l’exécution des directives reçues. « Firent » conserve la simplicité et la force narrative de l’hébreu.
- source_word: אַנְשֵׁי עִירוֹ
  choice: les hommes de sa ville
  rationale: L’expression désigne ici les hommes de la ville, ensuite précisés comme étant les anciens et les notables; le masculin explicite convient donc au contexte civique.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Dans ce cadre civique, le terme désigne les responsables reconnus de la communauté, et non simplement des hommes âgés.
- source_word: הַחֹרִים
  choice: les notables
  rationale: Le terme désigne des hommes de rang ou de condition sociale élevée. « Notables » est naturel en français et convient au contexte administratif et judiciaire.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: qui habitaient dans sa ville
  rationale: Le verbe ישב signifie ici résider ou habiter. Cette formulation est claire et idiomatique en français moderne.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: ce que Jézabel leur avait demandé
  rationale: L’hébreu dit littéralement qu’elle avait « envoyé » vers eux, avec un objet implicite éclairé par les lettres mentionnées ensuite. Le contexte montre qu’il s’agit de directives; cette formulation rend naturellement leur exécution sans confondre ce premier membre avec la proposition suivante.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: conformément à ce qui était écrit dans les lettres
  rationale: סְפָרִים désigne ici la correspondance envoyée par Jézabel. « Lettres » est donc plus précis que « livres » ou « documents ».
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: qu’elle leur avait envoyées
  rationale: La proposition relative identifie simplement les lettres comme celles que Jézabel leur avait envoyées.
