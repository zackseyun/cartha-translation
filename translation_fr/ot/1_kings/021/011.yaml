  source_fidelity: La formulation « ce que Jézabel leur avait demandé » interprète l’objet implicite de שָׁלְחָה (« elle avait envoyé [quelque chose] ») comme une demande. Le contexte indique bien des instructions, mais le verbe « envoyer » peut être conservé en français sans cette explicitation. Le reste rend fidèlement les anciens, les notables, leur résidence dans la ville, et les lettres envoyées.
  naturalness: Le français est globalement clair et de registre approprié. « Firent ce que Jézabel leur avait envoyé » est idiomatique dans ce contexte narratif, l’objet sous-entendu étant éclairé immédiatement par la mention des lettres. « Comme cela était écrit » reflète naturellement le second כַּאֲשֶׁר.
  terminology: « Les anciens » convient au rôle civique; « les notables » rend bien הַחֹרִים. La note proposant « les dignitaires » fournit une alternative légitime et ne force pas une lecture institutionnelle précise.
