base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: fr
  text: 'Achab rentra donc chez lui, maussade et irrité à cause de ce que lui avait dit Naboth de Jizréel[a] : « Je ne te donnerai pas l’héritage de mes pères[b]. » Il se coucha sur son lit, détourna le visage et ne mangea pas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause de la parole que Naboth de Jizréel lui avait adressée ». Le mot hébreu peut désigner une parole, une affaire ou une chose.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’héritage de mes ancêtres ». Hébreu : « de mes pères ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il ne mangea pas de pain ». En hébreu, « manger du pain » peut désigner le fait de prendre de la nourriture en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: maussade et irrité
  rationale: Cette paire rend l’humeur renfermée et le vif mécontentement d’Achab dans un français actuel, sans recourir à des termes archaïques.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: à cause de ce que lui avait dit
  rationale: Dans ce contexte, דָּבָר désigne les paroles de Naboth. Cette formulation française est naturelle tout en conservant le lien causal.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Naboth de Jizréel
  rationale: Le gentilé hébreu est rendu par une tournure géographique claire et usuelle en français biblique moderne.
- source_word: נַחֲלַת אֲבוֹתָי
  choice: l’héritage de mes pères
  rationale: « Héritage » préserve la portée familiale et foncière de נַחֲלָה, tandis que « mes pères » maintient le pluriel masculin explicite de l’hébreu.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: Il se coucha sur son lit
  rationale: Rend directement l’action narrative et reste idiomatique en français.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: détourna le visage
  rationale: Cette expression française restitue le geste de retrait boudeur suggéré par le contexte sans en amplifier explicitement l’interprétation.
- source_word: וְלֹא אָכַל לָחֶם
  choice: refusa de manger
  rationale: Le contexte indique une abstention volontaire; « manger » rend naturellement l’emploi métonymique de « pain » pour la nourriture en général.
theological_decisions:
- issue: Langage masculin relatif à la transmission ancestrale
  choice: l’héritage de mes pères
  alternative: l’héritage de mes ancêtres
  rationale: L’hébreu emploie explicitement le masculin pluriel אֲבוֹתָי. Le conserver respecte la formulation patrimoniale du texte sans la neutraliser.
