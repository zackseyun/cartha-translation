base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: fr
  text: Lorsqu’Achab entendit ces paroles, il déchira ses vêtements, mit une toile de sac sur sa chair, jeûna, se coucha dans cette toile de sac et alla d’un pas lent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alla doucement », « marcha à pas feutrés » ou « alla d’un air abattu ». Le mot hébreu évoque une démarche lente et contenue; dans ce contexte, il peut aussi suggérer l’humiliation ou l’abattement.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Quand … entendit
  rationale: Le français narratif naturel exprime ici la construction temporelle sans reproduire lourdement la formule וַיְהִי par « il arriva que ».
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans le contexte, דְּבָרִים désigne les paroles de jugement prononcées par Élie; « paroles » en conserve la dimension verbale.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: il déchira ses vêtements
  rationale: Expression française claire qui conserve le geste concret de deuil ou d’humiliation.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: se couvrit le corps d’une toile de sac
  rationale: « Toile de sac » rend שַׂק dans un français compréhensible, tandis que « le corps » traduit idiomatiquement בָּשָׂר sans perdre l’idée de contact corporel.
- source_word: וַיָּצֹם
  choice: jeûna
  rationale: Équivalent direct et naturel du verbe צום.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: Il se couchait vêtu de cette toile
  rationale: L’imparfait traduit naturellement l’attitude prolongée suggérée dans cette série finale; « se couchait » n’impose pas l’idée de sommeil.
- source_word: וַיְהַלֵּךְ אַט
  choice: marchait d’un pas accablé
  rationale: אַט décrit une démarche lente, contenue ou abattue. Cette formulation rend le comportement visible sans conclure explicitement à la sincérité intérieure d’Achab.
theological_decisions:
- issue: Nature de la réaction d’Achab
  choice: Décrire ses gestes extérieurs de deuil et d’humiliation sans déclarer sa repentance sincère ou non.
  alternative: Dire explicitement qu’Achab se repentit sincèrement, ou qu’il ne fit que simuler le deuil.
  rationale: L’hébreu rapporte ses actes et sa démarche, mais ce verset ne tranche pas directement la question de son état intérieur.
translation_notes:
  register: Français moderne, international et digne. La formulation évite les archaïsmes tout en conservant les gestes concrets du texte hébreu et son ambiguïté quant à la sincérité d’Achab.
