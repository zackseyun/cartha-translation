source:
  edition: WLC
  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: fr
  text: 'Faites asseoir en face de lui deux hommes sans scrupules, et qu’ils témoignent contre lui en disant : « Tu as maudit[a] Dieu et le roi ! » Puis faites-le sortir et lapidez-le, afin qu’il meure.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « béni ». L’hébreu emploie ici « bénir » comme un euphémisme pour « maudire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: Faites asseoir
  rationale: Le hifil de ישׁב exprime ici l’action de faire prendre place; cette formulation conserve clairement la valeur causative.
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: deux hommes sans scrupules
  rationale: Le texte précise qu’il s’agit de deux hommes, conformément au cadre judiciaire. L’expression idiomatique בְּנֵי בְלִיַּעַל désigne des individus moralement corrompus ou sans principes, et non nécessairement des êtres associés à un nom propre « Bélial ».
- source_word: נֶגְדּוֹ
  choice: en face de lui
  rationale: Cette expression indique qu’ils doivent être placés devant l’accusé, face à lui, dans le cadre formel de l’assemblée.
- source_word: וִיעִדֻהוּ
  choice: qu’ils témoignent contre lui
  rationale: Dans ce contexte judiciaire, le hifil de עוד désigne un témoignage à charge plutôt qu’une simple prise de parole.
- source_word: בֵּרַכְתָּ
  choice: Tu as maudit
  rationale: Bien que ברך signifie ordinairement « bénir », il sert ici d’euphémisme révérenciel pour « maudire ». Le sens contextuel est rendu dans le texte, tandis que la forme littérale est signalée en note.
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: Dieu et le roi
  rationale: L’accusation fabriquée associe une offense contre Dieu à une offense contre l’autorité royale; le contexte appelle le singulier « Dieu ».
- source_word: וְהוֹצִיאֻהוּ
  choice: faites-le sortir
  rationale: Le verbe signifie le faire sortir ou l’emmener hors du lieu de l’assemblée, en vue de son exécution.
- source_word: וְסִקְלֻהוּ
  choice: lapidez-le
  rationale: « Lapider » est le terme français précis et consacré pour cette forme d’exécution.
- source_word: וְיָמֹת
  choice: afin qu’il meure
  rationale: La tournure exprime ici l’issue recherchée de la lapidation; « afin que » rend naturellement cette relation de finalité ou de résultat.
theological_decisions:
- issue: Emploi euphémistique de ברך lorsque Dieu est l’objet
  choice: Traduire par « maudit » dans le texte principal
  alternative: Traduire littéralement par « béni » et n’expliquer le sens que dans une note
  rationale: Dans le contexte narratif et judiciaire, l’accusation porte clairement sur une malédiction ou un blasphème contre Dieu, passible de mort. « Béni » ferait comprendre le contraire au lecteur moderne; la note conserve néanmoins la particularité de l’hébreu.
- issue: Interprétation de בְּנֵי בְלִיַּעַל
  choice: deux hommes sans scrupules
  alternative: deux fils de Bélial
  rationale: Dans ce passage, l’expression caractérise des hommes corrompus disposés à porter un faux témoignage. La traiter comme un nom propre importerait une association démonologique qui n’est pas imposée par le texte.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs au pluriel reflètent les instructions données aux responsables; le vocabulaire judiciaire demeure explicite sans archaïsme.
