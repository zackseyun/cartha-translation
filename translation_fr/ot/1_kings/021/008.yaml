  variant: modern international French
source:
  edition: WLC
  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: fr
  text: Elle écrivit donc des lettres au nom d’Achab, les scella avec son sceau et les envoya aux anciens et aux notables qui se trouvaient dans sa ville[a] et qui habitaient avec Naboth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la ville d’Achab ». En hébreu, le suffixe rendu par « sa » peut renvoyer soit à Naboth, soit à Achab.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Elle écrivit donc
  rationale: Le waw consécutif fait avancer le récit; « donc » exprime naturellement la suite narrative, et le féminin singulier renvoie à Jézabel dans le contexte.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: des lettres / les
  rationale: סֵפֶר désigne ici des communications écrites officielles; « lettres » est le terme français courant et précis. Le pronom « les » évite une répétition lourde.
- source_word: בְּשֵׁם אַחְאָב
  choice: au nom d’Achab
  rationale: Cette expression conserve l’idée qu’elle agit sous l’identité ou l’autorité officielle d’Achab, sans préciser si celui-ci l’a autorisée.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: les scella avec son sceau
  rationale: La formulation rend directement l’action de fermer ou authentifier les lettres au moyen du sceau appartenant à Achab.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: « Anciens » est le terme biblique français usuel pour les responsables civiques locaux désignés par זְקֵנִים.
- source_word: הַחֹרִים
  choice: les notables
  rationale: חֹרִים désigne des hommes de rang élevé ou influents; « notables » est naturel en français moderne et convient au cadre municipal.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: qui se trouvaient dans sa ville
  rationale: Le suffixe masculin singulier est conservé sous la forme ambiguë « sa », dont le référent peut être Naboth ou Achab.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: qui habitaient avec Naboth
  rationale: La traduction garde la construction relationnelle-locale de ישב avec אֶת, sans développer explicitement « dans la même ville ».
theological_decisions:
- issue: Référent du suffixe pronominal dans בְּעִירוֹ
  choice: Conserver « sa ville » dans le texte, en comprenant probablement la ville de Naboth
  alternative: La ville d’Achab
  rationale: La syntaxe permet les deux référents. Naboth s’accorde naturellement avec la proposition suivante, tandis qu’Achab reste un antécédent possible. Le français « sa ville » préserve l’ambiguïté authentique, et une note l’explicite.
translation_notes:
  register: Français international moderne, narratif et digne. « Notables » est préféré à « nobles » pour désigner clairement les personnalités influentes de la ville. L’ambiguïté du possessif hébreu est maintenue dans le corps du texte et expliquée en note.
