  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: fr
  text: 'Alors Jézabel, sa femme, lui dit[a] : « Gouvernes-tu maintenant Israël en roi ? Lève-toi, mange et réjouis-toi[b] ! Moi, je te donnerai la vigne de Naboth le Jizréélite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est donc toi qui exerces maintenant la royauté sur Israël ! » L’hébreu peut se comprendre comme une affirmation moqueuse plutôt que comme une question.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « mange du pain et que ton cœur soit heureux ». « Manger du pain » est une expression hébraïque qui signifie prendre un repas.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Alors ... lui dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: Jézabel, sa femme
  rationale: Conserve l’apposition hébraïque et rappelle le lien de Jézabel avec Achab.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: Est-ce ainsi que tu exerces maintenant la royauté sur Israël ?
  rationale: La tournure idiomatique signifie littéralement « faire/exercer la royauté ». Le contexte favorise une question rhétorique de reproche ; « ainsi » rend la portée moqueuse sans effacer l’ambiguïté, signalée en note.
- source_word: קוּם
  choice: Lève-toi
  rationale: Impératif direct, naturel et fidèle en français moderne.
- source_word: אֱכָל לֶחֶם
  choice: mange
  rationale: Littéralement « mange du pain », expression hébraïque désignant le fait de prendre un repas ; le français naturel appelle ici « mange », avec une note culturelle.
- source_word: וְיִטַב לִבֶּךָ
  choice: et retrouve ta bonne humeur
  rationale: Littéralement, « que ton cœur soit bien/heureux ». Cette formulation actuelle exprime clairement le retour à une disposition joyeuse après l’abattement d’Achab.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: Moi, je te donnerai
  rationale: Le pronom indépendant אֲנִי est emphatique ; la dislocation « Moi, je » conserve cette insistance en français.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: la vigne de Naboth de Jizréel
  rationale: Rend naturellement la chaîne construite et identifie Naboth par son lieu d’origine ou d’appartenance, sans recourir au gentilé français rare « Jizréélite ».
theological_decisions:
- issue: Portée de la première parole de Jézabel
  choice: 'Question rhétorique : « Est-ce ainsi que tu exerces maintenant la royauté sur Israël ? »'
  alternative: 'Affirmation ou raillerie : « C’est donc toi qui exerces maintenant la royauté sur Israël ! »'
  rationale: L’hébreu ne porte pas de marque interrogative explicite. Le contexte suggère fortement un reproche sarcastique sous forme de question, mais la note préserve la lecture affirmative possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient au dialogue conjugal et à l’adresse directe. La formulation conserve le sarcasme de Jézabel, l’emphase de « Moi, je » et l’ambiguïté syntaxique de la proposition initiale au moyen d’une note.
