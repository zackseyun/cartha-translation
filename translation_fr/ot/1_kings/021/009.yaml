  text: וַ/תִּכְתֹּ֥ב בַּ/סְּפָרִ֖ים לֵ/אמֹ֑ר קִֽרְאוּ צ֔וֹם וְ/הוֹשִׁ֥יבוּ אֶת נָב֖וֹת בְּ/רֹ֥אשׁ הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: fr
  text: 'Elle écrivit dans les lettres : « Proclamez un jeûne et faites asseoir Naboth à la tête du peuple[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant le peuple » ou « à une place bien en vue parmi le peuple ». L’hébreu dit littéralement « à la tête du peuple », ce qui peut désigner une position visible ou importante dans l’assemblée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Elle écrivit
  rationale: Le wayyiqtol à la 3e personne du féminin singulier poursuit le récit et renvoie à Jézabel dans le contexte. Le passé simple convient au registre narratif français.
- source_word: בַּסְּפָרִים
  choice: dans les lettres
  rationale: Dans ce contexte, סְפָרִים désigne les lettres envoyées aux responsables de la ville, et non des livres; « dans les lettres » rend naturellement la préposition ב.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit directement en français le contenu écrit et rend avec naturel la fonction quotative de לֵאמֹר, sans alourdir la phrase par « en disant ».
- source_word: קִרְאוּ צוֹם
  choice: Proclamez un jeûne
  rationale: L’impératif pluriel קִרְאוּ a ici une portée publique et officielle; « proclamer un jeûne » est une formulation française claire et idiomatique.
- source_word: וְהוֹשִׁיבוּ אֶת נָבוֹת
  choice: et faites asseoir Naboth
  rationale: Le hiphil impératif pluriel de ישׁב exprime la causalité. « Faites asseoir » la conserve plus précisément que le simple « placez ».
- source_word: בְּרֹאשׁ הָעָם
  choice: à la tête du peuple
  rationale: 'Cette traduction garde l’image littérale de l’hébreu et laisse ouverte la nuance exacte: place de premier plan, position visible ou emplacement devant l’assemblée.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme excessif. La formulation littérale « à la tête du peuple » préserve l’ambiguïté spatiale et sociale de l’expression hébraïque.
