lexical_decisions:
- source_word: וַיְהִי דְּבַר יְהוָה אֶל
  choice: La parole de Yahweh fut adressée à
  rationale: Cette tournure française naturelle rend la formule prophétique hébraïque indiquant qu’une révélation divine parvient à son destinataire, tout en conservant « parole » pour דָּבָר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH; « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: הַתִּשְׁבִּי
  choice: le Tishbite
  rationale: Rend directement le gentilé ou titre hébreu en conservant l’identification traditionnelle d’Élie.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Introduit naturellement en français le discours divin qui commence au verset suivant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom personnel; le conserver sous la forme « Yahweh » évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français moderne, digne et lisible. La formule « fut adressée à » est idiomatique dans le registre prophétique; les deux-points maintiennent le lien avec les paroles rapportées au verset suivant.
