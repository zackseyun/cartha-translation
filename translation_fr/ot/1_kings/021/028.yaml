  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: fr
  text: 'La parole de Yahweh[a] fut adressée à Élie le Tishbite en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le SEIGNEUR ».'
