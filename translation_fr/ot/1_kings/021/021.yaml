  naturalness: Le français est généralement clair et solennel. « Je balaierai ceux qui viendront après toi » et « j’exterminerai chez Achab » sont cependant raides et ne sonnent pas comme du français moderne naturel. « Je détruirai ta lignée » et « parmi les siens » expriment clairement le sens contextuel sans alourdir la phrase.
  terminology: « Malheur » convient à רָעָה dans ce contexte. « Tout mâle » rend plus précisément l’expression masculine crue que « tout homme »; la note conserve la formulation littérale. « Esclave ou homme libre » est plus naturel que « esclave ou libre » et garde le rendu traditionnel, sans supprimer la réserve textuelle de la note.
