base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: fr
  text: 'Voici : je vais faire venir sur toi le malheur. Je détruirai ta lignée et j’exterminerai, parmi les siens, tout mâle[a], esclave ou homme libre[b], en Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quiconque urine contre un mur », expression hébraïque crue désignant les mâles.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, les deux termes peuvent se rendre par « retenu et laissé » ; leur sens précis dans cette formule est incertain. Ensemble, ils indiquent probablement que personne n’est excepté.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Conserve la formule solennelle et immédiate de l’annonce prophétique dans un français biblique encore naturel.
- source_word: מבי ... רָעָה
  choice: je fais venir sur toi le malheur
  rationale: Dans cette annonce de jugement, רָעָה désigne une calamité infligée plutôt que le mal moral. « Le malheur » est idiomatique et garde la gravité de la menace.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: Je balaierai ceux qui viendront après toi
  rationale: Le verbe exprime l’élimination complète, tandis que אַחֲרֶיךָ, littéralement « après toi », vise ici ceux qui succéderont à Achab. Cette formulation rend l’objet implicite sans le limiter explicitement aux descendants biologiques.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: j’exterminerai chez Achab
  rationale: כרת, dans cette formule de jugement, signifie retrancher ou faire disparaître. « Chez Achab » rend naturellement l’appartenance au groupe ou à la maison d’Achab exprimée par לְאַחְאָב.
- source_word: מַשְׁתִּין בְּקִיר
  choice: tout homme
  rationale: L’expression hébraïque crue, littéralement « celui qui urine contre un mur », désigne les personnes de sexe masculin. Le sens est donné dans le texte et la forme littérale dans une note.
- source_word: וְעָצוּר וְעָזוּב
  choice: esclave ou libre
  rationale: Cette paire traditionnelle fonctionne dans la formule comme une totalité englobante. La note signale que le sens précis des deux termes hébreux reste discuté.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Rend directement et naturellement la valeur locative de la préposition.
theological_decisions:
- issue: Sens de רָעָה dans une annonce divine de jugement
  choice: le malheur
  alternative: le mal / le désastre
  rationale: Le contexte indique une calamité annoncée comme jugement. « Le malheur » préserve la sévérité du propos sans présenter רָעָה comme une qualification morale de l’action divine.
- issue: Référent de אַחֲרֶיךָ
  choice: ceux qui viendront après toi
  alternative: ta descendance / après toi
  rationale: Le contexte concerne la suppression de la lignée d’Achab, mais l’hébreu dit simplement « après toi ». La formulation choisie rend l’objet humain implicite tout en évitant de réduire sans nécessité le groupe aux seuls descendants biologiques.
translation_notes:
  register: Français moderne, solennel et direct. « Voici » maintient la force de la formule prophétique ; « balaierai » et « exterminerai » conservent la violence du jugement. Les deux notes rendent visibles l’expression crue et l’incertitude lexicale sans alourdir le verset.
