source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: fr
  text: 'Alors les deux hommes malfaisants[a] vinrent s’asseoir en face de lui. Ces hommes malfaisants témoignèrent contre Naboth devant le peuple en disant : « Naboth a maudit[b] Dieu et le roi ! » Ils le firent sortir de la ville, le lapidèrent à coups de pierres, et il mourut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils de Bélial », puis « hommes de Bélial »; expressions idiomatiques désignant des hommes mauvais et sans scrupules.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement « a béni », euphémisme employé ici au sens de « a maudit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: hommes malfaisants
  rationale: Ces expressions idiomatiques désignent des hommes moralement mauvais et sans scrupules, non des descendants biologiques ni nécessairement un être nommé Bélial. « Hommes malfaisants » est clair, actuel et digne; la forme littérale est signalée en note.
- source_word: נֶגְדּוֹ
  choice: en face de lui
  rationale: La préposition décrit leur position face à Naboth dans cette mise en scène judiciaire.
- source_word: וַיְעִדֻהוּ
  choice: témoignèrent contre Naboth
  rationale: La forme verbale exprime ici un témoignage à charge dans un cadre judiciaire.
- source_word: נֶגֶד הָעָם
  choice: devant le peuple
  rationale: L’expression indique que l’accusation est portée publiquement en présence du peuple.
- source_word: בֵּרַךְ
  choice: a maudit
  rationale: Bien que le texte consonantique emploie littéralement « bénir », il s’agit ici d’un euphémisme révérenciel dont le sens contextuel est « maudire ». La note conserve cette particularité de l’hébreu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte israélite d’accusation de blasphème, le référent est le Dieu d’Israël; le singulier français convient.
- source_word: וָמֶלֶךְ
  choice: et le roi
  rationale: La conjonction coordonne les deux personnes que Naboth est accusé d’avoir maudites.
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: Ils le firent sortir de la ville
  rationale: Cette formulation rend directement le causatif et le déplacement hors de la ville en vue de l’exécution.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים
  choice: le lapidèrent à coups de pierres
  rationale: « Lapider » nomme précisément le mode d’exécution, tandis que « à coups de pierres » conserve l’élément concret explicitement présent en hébreu.
- source_word: וַיָּמֹת
  choice: et il mourut
  rationale: La proposition fait progresser simplement le récit jusqu’au résultat fatal.
theological_decisions:
- issue: Rendu de l’euphémisme בֵּרַךְ dans l’accusation de blasphème
  choice: Traduire le sens contextuel par « a maudit » dans le texte principal
  alternative: Traduire littéralement par « a béni » et expliquer que le mot signifie ici « maudire »
  rationale: L’accusation porte manifestement sur une malédiction dirigée contre Dieu et le roi. Rendre « a béni » dans le texte principal obscurcirait le sens juridique de l’accusation; une note préserve néanmoins la forme euphémistique de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire judiciaire reste accessible (« témoignèrent contre »), et la violence concrète de l’exécution est conservée sans amplification.
