  text: הַ/מֵּ֤ת לְ/אַחְאָב֙ בָּ/עִ֔יר יֹאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: fr
  text: Tout membre de la maison d’Achab qui mourra dans la ville sera mangé par les chiens[a], et celui qui mourra dans les champs sera mangé par les oiseaux du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le mort appartenant à Achab » ; l’expression désigne tout membre de la maison ou de la lignée d’Achab qui meurt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: Tout membre de la maison d’Achab qui mourra
  rationale: Le participe substantivé הַמֵּת a ici une valeur générique, et לְאַחְאָב marque l’appartenance ou le rattachement. « Membre de la maison d’Achab » exprime naturellement en français la maisonnée ou la lignée visée, sans suggérer qu’Achab possède littéralement ces personnes.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Rend directement la valeur locative et maintient le contraste avec les champs.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: sera mangé par les chiens
  rationale: La tournure passive est naturelle en français avec le patient en tête et conserve le sens concret de אכל, « manger ».
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: et celui qui mourra dans les champs
  rationale: La formulation reprend la construction générique parallèle. Le pluriel français « dans les champs » désigne idiomatiquement la campagne ou l’espace hors de la ville.
- source_word: עוֹף הַשָּׁמָיִם
  choice: les oiseaux du ciel
  rationale: Cette expression française naturelle conserve l’image et la construction génitive de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La répétition hébraïque est légèrement variée (« tout membre… », puis « celui… ») pour éviter une lourdeur sans affaiblir le parallélisme. La note est placée après la première proposition concernée.
