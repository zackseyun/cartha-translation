  text: וַ/יְהִ֛י כִּ/שְׁמֹ֥עַ אַחְאָ֖ב כִּ֣י מֵ֣ת נָב֑וֹת וַ/יָּ֣קָם אַחְאָ֗ב לָ/רֶ֛דֶת אֶל כֶּ֛רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י לְ/רִשְׁתּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: fr
  text: Quand Achab apprit que Naboth était mort[a], il se leva pour descendre à la vigne de Naboth le Jizréélite, afin d’en prendre possession[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était décédé ». L’hébreu peut exprimer soit l’état qui en résulte (« était mort »), soit le fait accompli de la mort.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin de la posséder » ou « afin d’en hériter ». Selon le contexte, le verbe hébreu peut signifier prendre possession, posséder ou hériter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quand … apprit
  rationale: La construction introduit une transition narrative suivie d’une proposition temporelle. « Quand … apprit » est naturel en français moderne et n’accentue pas indûment l’immédiateté.
- source_word: מֵת
  choice: était mort
  rationale: Le parfait de מות peut présenter soit l’état résultant, soit l’événement accompli. « Était mort » rend directement l’état annoncé à Achab, tout en signalant l’autre possibilité en note.
- source_word: וַיָּקָם
  choice: il se leva
  rationale: Le verbe קום marque ici le début résolu de l’action. « Se leva » conserve la sobriété et la dignité du récit sans développer le sens en « se mit en route ».
- source_word: לָרֶדֶת
  choice: pour descendre
  rationale: ירד exprime un déplacement vers le bas. « Descendre » préserve cette indication directionnelle plutôt que de la réduire à « aller ».
- source_word: כֶּרֶם
  choice: vigne
  rationale: Dans ce contexte, כֶּרֶם désigne un terrain planté de vignes. « Vigne » est l’équivalent français courant et naturel.
- source_word: הַיִּזְרְעֵאלִי
  choice: le Jizréélite
  rationale: L’adjectif gentilé identifie Naboth par son lien avec Jizréel. La forme « le Jizréélite » conserve directement cette désignation.
- source_word: לְרִשְׁתּוֹ
  choice: afin d’en prendre possession
  rationale: ירשׁ peut signifier prendre possession, posséder ou hériter selon le contexte. Ici, Achab se rend sur place pour s’approprier effectivement la vigne; cette formulation rend l’acte sans ajouter au verbe l’idée plus forte de saisie violente.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Vigne » est préféré à « vignoble », plus idiomatique ici. La répétition du nom d’Achab dans l’hébreu est allégée par « il » après la proposition temporelle, sans perte de référent. Les notes conservent l’ambiguïté aspectuelle de מֵת et l’étendue sémantique de ירשׁ.
