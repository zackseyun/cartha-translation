id: 1KI.21.17
reference: 1 Kings 21:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל אֵלִיָּ֥הוּ הַ/תִּשְׁבִּ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/017.yaml
  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh fut adressée à Élie le Thischbite[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Et il arriva que la parole de Yahweh fut adressée à Élie le Thischbite, en ces termes. »'
    reason: La construction hébraïque וַיְהִי peut être rendue plus formellement par « Et il arriva que », et לֵאמֹר par « en ces termes ».
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors … fut adressée
  rationale: La forme narrative fait progresser le récit vers l’événement suivant. « Alors » rend naturellement cette succession en français moderne, sans recourir à la tournure vieillie « il arriva que ».
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette formule prophétique consacrée désigne une révélation divine. « Parole » en conserve mieux la portée littéraire et théologique que le terme plus interprétatif « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: אֶל
  choice: à
  rationale: Dans une formule désignant une communication adressée à quelqu’un, « à » est l’équivalent français naturel.
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: Le nom personnel est rendu selon sa forme française traditionnelle et couramment reconnue.
- source_word: הַתִּשְׁבִּי
  choice: le Tishbite
  rationale: Ce gentilé ou titre compact est conservé sous sa forme française traditionnelle, sans préciser de manière interprétative « originaire de Tishbé ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit les paroles divines qui suivent. En français, les deux-points remplissent naturellement cette fonction et évitent le calque pesant « en disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel de Dieu plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et fluide. La tournure passive « fut adressée » restitue l’expression prophétique sans archaïsme excessif. Le gentilé traditionnel « Tishbite » est maintenu, tandis que les deux-points annoncent directement le discours du verset suivant.
