  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: fr
  text: Je rendrai ta maison semblable à celle de Jéroboam, fils de Nebath, et à celle de Baasa, fils d’Ahiyya[a], à cause de la provocation par laquelle tu m’as provoqué et tu as fait pécher Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta dynastie ». Ici, le mot hébreu traduit par « maison » désigne la lignée royale d’Achab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je rendrai
  rationale: Dans cette formule de jugement, le verbe נתן exprime le résultat imposé à la maison d’Achab. « Je rendrai » est naturel en français devant « semblable à ».
- source_word: בֵּיתְךָ
  choice: ta maison
  rationale: בַּיִת peut désigner la maison, la famille ou la dynastie. Le maintien de « maison » préserve la métaphore hébraïque, tandis que la note en précise le sens royal.
- source_word: כְבֵית ... וּכְבֵית
  choice: semblable à celle de… et à celle de
  rationale: La préposition comparative כְּ est rendue clairement; « celle » évite une répétition lourde du mot « maison » sans effacer la comparaison.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Forme française usuelle des noms bibliques et traduction directe du patronyme hébreu.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baesha, fils d’Ahija
  rationale: Translittération française lisible et maintien de la formule patronymique.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: parce que tu m’as provoqué par tes offenses
  rationale: Le substantif כַּעַס et le hifil de כעס expriment une provocation qui suscite la colère. Cette formulation rend la cause du jugement et évite en français la répétition maladroite « provocation… provoqué ».
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: et que tu as fait pécher Israël
  rationale: Le hifil de חטא signifie causer quelqu’un à pécher; « faire pécher » en donne une traduction directe et idiomatique.
theological_decisions:
- issue: Objet implicite du verbe « provoquer »
  choice: Expliciter « m’ »
  alternative: Laisser l’objet inexprimé
  rationale: Le locuteur est le Seigneur et le contexte établit qu’Achab l’a provoqué. L’explicitation est nécessaire à la fluidité du français sans ajouter de contenu théologique étranger.
- issue: Sens royal de בֵּית
  choice: Conserver « maison » dans le texte
  alternative: Traduire directement par « dynastie »
  rationale: « Maison » conserve l’image hébraïque et son écho littéraire; une note indique qu’il s’agit ici de la lignée royale.
- issue: Responsabilité d’Achab dans le péché d’Israël
  choice: « tu as fait pécher Israël »
  alternative: « tu as entraîné Israël dans le péché »
  rationale: La formulation retenue maintient la force causative du hifil sans résoudre la tension entre l’influence du roi et la responsabilité du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’oracle hébreu tout en évitant les répétitions peu naturelles. Les noms propres suivent des formes françaises bibliques courantes.
