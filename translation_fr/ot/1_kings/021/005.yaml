base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: fr
  text: 'Alors Jézabel, sa femme, vint le trouver et lui dit[a] : « Pourquoi as-tu l’esprit si sombre que tu ne manges pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Qu’est-ce donc ? Ton esprit est sombre, et tu ne manges pas de pain. »'
    reason: La note conserve la forme syntaxique et l’expression « manger du pain » de l’hébreu, que le texte principal rend de manière idiomatique.
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: Alors ... vint le trouver
  rationale: Le wayyiqtol fait avancer le récit. « Alors » marque naturellement la succession, et « vint le trouver » rend en français idiomatique le mouvement vers lui.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: Jézabel, sa femme
  rationale: Le nom suit la forme française traditionnelle « Jézabel »; l’apposition rend directement le rapport exprimé par אִשְׁתּוֹ.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: et lui dit
  rationale: Devant un discours direct, « lui dit » est plus naturel en français que le calque « lui parla ».
- source_word: מַה זֶּה
  choice: Pourquoi
  rationale: L’expression signifie littéralement « Qu’est-ce que ceci ? », mais elle demande ici la raison de l’état d’Achab. « Pourquoi » en transmet la valeur idiomatique.
- source_word: רוּחֲךָ סָרָה
  choice: as-tu l’esprit si sombre
  rationale: רוּחַ désigne ici la disposition intérieure. « L’esprit sombre » préserve l’image du texte sans réduire le sens à la seule tristesse; « si » communique la force de la question.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: que tu ne manges pas
  rationale: Le lien par « que » présente l’absence de nourriture comme la manifestation de son état, sans ajouter une seconde question. « Manger du pain » est un idiome hébreu courant pour prendre de la nourriture; le français naturel peut employer simplement « manger ».
