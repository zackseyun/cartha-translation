source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: fr
  text: 'Quand Jézabel apprit que Naboth avait été lapidé et qu’il était mort, elle dit à Achab : « Lève-toi, prends possession de la vigne de Naboth de Jizréel, qu’il a refusé de te céder contre de l’argent[a], car Naboth n’est plus en vie : il est mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’il a refusé de te donner contre de l’argent »; autrement : « qu’il a refusé de te vendre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quand … apprit
  rationale: La formule narrative introduit l’événement suivant. « Quand … apprit » exprime naturellement sa valeur temporelle sans reproduire lourdement « et il arriva ».
- source_word: סֻקַּל
  choice: avait été lapidé
  rationale: Le passif de סקל désigne précisément la lapidation. Le plus-que-parfait situe cet acte avant les paroles de Jézabel et conserve la voix passive.
- source_word: וַיָּמֹת
  choice: et qu’il était mort
  rationale: Cette proposition complète ce que Jézabel apprend et distingue la lapidation de son issue mortelle. Le français exige naturellement la reprise de « que ».
- source_word: קוּם
  choice: Lève-toi
  rationale: Impératif courant et direct, fidèle à l’immédiateté de l’ordre sans registre archaïque.
- source_word: רֵשׁ
  choice: prends possession de
  rationale: ירש peut signifier posséder, hériter ou prendre possession. Ici, Jézabel ordonne à Achab de s’approprier le bien devenu disponible; cette formulation préserve l’action sans imposer le cadre plus précis de l’héritage.
- source_word: כֶּרֶם
  choice: vigne
  rationale: En français biblique et courant, « vigne » désigne naturellement le terrain planté de ceps aussi bien que la culture elle-même.
- source_word: הַיִּזְרְעֵאלִי
  choice: de Jizréel
  rationale: Le gentilé identifie Naboth par son lieu d’origine ou de résidence. « De Jizréel » est plus naturel en français moderne que « le Jizréélite ».
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: qu’il a refusé de te céder contre de l’argent
  rationale: Le texte dit littéralement « qu’il a refusé de te donner contre de l’argent ». « Céder » rend clairement le transfert de propriété sans expliciter autant que « vendre » la nature juridique de la transaction.
- source_word: בְכֶסֶף
  choice: contre de l’argent
  rationale: כסף signifie littéralement « argent » au sens du métal et, par métonymie, de la monnaie. En français, « contre de l’argent » exprime naturellement ici le paiement envisagé.
- source_word: אֵין נָבוֹת חַי
  choice: Naboth n’est plus en vie
  rationale: Cette formulation conserve la première affirmation négative distincte de la déclaration finale « il est mort », tout en étant idiomatique en français.
- source_word: כִּי מֵת
  choice: il est mort
  rationale: La déclaration finale, brève et brutale, renforce le constat précédent. Les deux occurrences de כִּי sont rendues ensemble par « car » puis par la ponctuation, afin d’éviter une répétition française pesante.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le discours direct demeure abrupt, conformément au ton de Jézabel. « De Jizréel » évite un gentilé rare, et la ponctuation conserve l’insistance de la double déclaration sur la mort de Naboth.
