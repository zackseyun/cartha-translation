source:
  edition: WLC
  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: fr
  text: 'Yahweh a aussi parlé au sujet de Jézabel : « Les chiens mangeront Jézabel dans l’enceinte de Jizréel[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « près du rempart de Jizréel ». Le terme hébreu est difficile et peut désigner plus précisément la zone fortifiée extérieure de la ville.'
    reason: Alternative lexicale liée au sens incertain de חֵל.
lexical_decisions:
- source_word: וְגַם
  choice: a aussi
  rationale: Conserve la valeur additive de גַם et relie cette déclaration au jugement précédent, dans un ordre naturel en français.
- source_word: לְאִיזֶבֶל
  choice: au sujet de Jézabel
  rationale: Avec דִּבֶּר, la préposition לְ peut introduire la personne dont il est question. Le contexte présente un oracle concernant Jézabel, sans laisser entendre que Dieu s’adresse directement à elle.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: 'Yahweh a parlé […] :'
  rationale: « A parlé » traduit directement דִּבֶּר. Les deux-points introduisent naturellement en français les paroles annoncées par לֵאמֹר, sans l’expression lourde « en disant ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: הַכְּלָבִים יֹאכְלוּ
  choice: Les chiens mangeront
  rationale: Reproduit l’article défini et le sens simple du verbe אָכַל, sans renforcer celui-ci par « dévoreront ».
- source_word: בְּחֵל יִזְרְעֶאל
  choice: sur le territoire de Jizréel
  rationale: חֵל est difficile dans ce passage. « Territoire » rend clairement la localisation sans imposer une reconstruction architecturale précise; l’autre sens possible est signalé en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu emploie explicitement le nom divin; sa translittération préserve ce nom personnel sans le remplacer par un titre.
- issue: Sens de לְאִיזֶבֶל avec דִּבֶּר
  choice: au sujet de Jézabel
  alternative: à Jézabel; contre Jézabel
  rationale: Dans le contexte narratif, Élie rapporte une déclaration divine concernant le sort de Jézabel; elle n’est pas présentée comme la destinataire directe de cet oracle.
- issue: Interprétation de בְּחֵל יִזְרְעֶאל
  choice: sur le territoire de Jizréel
  alternative: près du rempart de Jizréel
  rationale: Le nom חֵל est lexicalement incertain ici. Le texte principal garde un sens locatif lisible, tandis que la note conserve l’interprétation architecturale possible.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe évite le calque « parla, disant » tout en conservant la force déclarative de l’hébreu. Les noms propres sont rendus sous les formes françaises « Jézabel » et « Jizréel ».
