source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: fr
  text: « As-tu vu qu’Achab s’est humilié devant moi ? Puisqu’il s’est humilié devant moi, je ne ferai pas venir le malheur[a] durant sa vie ; c’est durant la vie de son fils que je ferai venir le malheur sur sa maison[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la calamité ». Le mot hébreu peut aussi signifier « le mal », mais il désigne ici le désastre infligé comme jugement, et non le mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ici, « maison » peut désigner la famille, la maisonnée ou la dynastie d’Achab.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: As-tu vu comment
  rationale: Le parfait qal introduit une question directe adressée à Élie. « As-tu vu comment » exprime naturellement en français le constat d’un comportement observable et sa pertinence présente.
- source_word: נִכְנַע
  choice: s’est humilié
  rationale: Le niphal de כנע indique ici qu’Achab s’est abaissé et soumis en réaction au jugement annoncé. Cette formulation préserve le sens réfléchi sans ajouter explicitement la notion de repentance.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: devant moi
  rationale: L’expression signifie littéralement « de devant ma face », mais fonctionne ici comme un idiome indiquant l’attitude d’Achab en présence de Dieu.
- source_word: יַעַן כִּי
  choice: Puisque
  rationale: La locution introduit la raison pour laquelle le jugement est différé. « Puisque » rend clairement ce lien causal.
- source_word: לֹא אָבִיא
  choice: je ne ferai pas venir
  rationale: Le hiphil de בוא signifie faire venir ou amener. Cette traduction française conserve l’image et reste naturelle.
- source_word: הָרָעָה
  choice: le malheur
  rationale: Dans ce contexte de jugement, רעה désigne une calamité punitive et non le mal moral. « Malheur » convient au registre et au contexte.
- source_word: בְּיָמָיו
  choice: durant sa vie
  rationale: Littéralement « pendant ses jours ». L’expression française explicite naturellement qu’il s’agit de la vie d’Achab.
- source_word: בִּימֵי בְנוֹ
  choice: durant la vie de son fils
  rationale: Cette formulation maintient le parallèle temporel avec « durant sa vie » tout en étant plus idiomatique que « aux jours de son fils » en français moderne.
- source_word: עַל בֵּיתוֹ
  choice: sur sa maison
  rationale: « Maison » conserve l’ambivalence de בית, qui peut désigner la maisonnée, la famille ou la dynastie royale. Une note en précise la portée possible.
theological_decisions:
- issue: Nature de la réaction d’Achab
  choice: s’est humilié
  alternative: s’est repenti ; s’est soumis
  rationale: Le texte affirme qu’Achab s’est humilié devant Dieu et que le jugement est donc différé, mais il n’emploie pas explicitement le vocabulaire habituel de la repentance. La traduction ne va pas au-delà de l’action énoncée.
- issue: Sens de רָעָה lorsque Dieu la fait venir
  choice: le malheur
  alternative: le mal ; la calamité
  rationale: Le contexte parle d’un désastre judiciaire annoncé contre la maison d’Achab, non d’un mal moral commis par Dieu. « Malheur » préserve cette distinction.
- issue: Portée du jugement différé
  choice: durant sa vie ; durant la vie de son fils
  alternative: en ses jours ; aux jours de son fils
  rationale: Le jugement n’est pas annulé, mais reporté à la génération suivante. La formulation française rend clairement cette tension sans l’expliquer davantage.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours divin garde sa force directe. La répétition de « s’est humilié devant moi » est conservée, tandis que les expressions temporelles hébraïques sont rendues de façon idiomatique.
