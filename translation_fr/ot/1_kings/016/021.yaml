id: 1KI.16.21
reference: 1 Kings 16:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: fr
  text: 'Alors le peuple d’Israël se divisa en deux : une moitié du peuple soutenait Tibni, fils de Guinath, pour le faire roi, et l’autre moitié soutenait Omri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָלֵק
  choice: se divisa
  rationale: Le nifal de חלק exprime ici la division du peuple; le singulier français convient au nom collectif « peuple ».
- source_word: הָעָם יִשְׂרָאֵל
  choice: le peuple d’Israël
  rationale: Cette formulation française naturelle identifie la population nationale visée.
- source_word: לַחֵצִי
  choice: en deux
  rationale: Dans ce contexte, l’expression indique une division en deux moitiés; « en deux » est clair et idiomatique.
- source_word: חֲצִי הָעָם
  choice: une moitié du peuple
  rationale: La formulation conserve la répartition équilibrée exprimée par le texte hébreu.
- source_word: הָיָה אַחֲרֵי
  choice: soutenait
  rationale: Littéralement « était derrière/après »; dans ce contexte de rivalité dynastique, l’expression désigne l’appui politique accordé à un prétendant.
- source_word: תִבְנִי בֶן גִּינַת
  choice: Tibni, fils de Guinath
  rationale: Les noms propres sont translittérés selon l’usage biblique français, et la filiation est rendue explicitement.
- source_word: לְהַמְלִיכוֹ
  choice: pour le faire roi
  rationale: L’infinitif hifil de מלך avec suffixe signifie faire régner quelqu’un, donc le faire roi, sans impliquer nécessairement une cérémonie de couronnement.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: et l’autre moitié soutenait Omri
  rationale: Le verbe est sous-entendu dans le second membre parallèle; « l’autre moitié » rend naturellement en français la seconde des deux parties.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Soutenait » explicite l’allégeance politique mieux que le calque « suivait », tandis que « se divisa en deux » conserve la structure et le mouvement du texte source.
