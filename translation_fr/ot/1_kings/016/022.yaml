base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: fr
  text: Mais le peuple qui soutenait Omri l’emporta[a] sur le peuple qui soutenait Tibni, fils de Guinat. Tibni mourut, et Omri devint roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se montra plus fort que » ou « devint plus fort que ». Le verbe hébreu peut exprimer la force ou la supériorité ; ici, le camp d’Omri prend l’avantage dans le conflit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: l’emporta
  rationale: Dans cette construction avec אֶת, le verbe חזק exprime la supériorité d’un groupe sur l’autre. « L’emporta sur » rend naturellement en français l’issue de cette lutte politique, tout en laissant en note les nuances plus littérales liées à la force.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: le peuple qui soutenait Omri
  rationale: Ici, אַחֲרֵי désigne le ralliement à un chef plutôt qu’une position physique. « Soutenait Omri » exprime clairement l’appartenance à son camp.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: sur le peuple qui soutenait Tibni
  rationale: Le complément de חזק désigne la faction rivale sur laquelle le camp d’Omri prend l’avantage. La répétition de « qui soutenait » conserve le parallélisme hébreu.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: Tibni, fils de Guinath
  rationale: Les noms propres sont translittérés selon leur forme biblique française courante, et בֶן est rendu par l’identification généalogique usuelle « fils de ».
- source_word: וַיָּמָת תִּבְנִי
  choice: Tibni mourut alors
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque la succession narrative sans affirmer explicitement que la victoire du camp d’Omri causa directement la mort de Tibni.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: Omri devint roi
  rationale: Dans ce contexte, מלך indique l’accession d’Omri à la royauté après la disparition de son rival; « devint roi » est plus précis ici que « régna ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Le peuple » est conservé pour rendre הָעָם, tandis que « soutenait » explicite naturellement l’allégeance politique exprimée par אַחֲרֵי. Le marqueur de note est placé sur « l’emporta », expression à laquelle porte la variante lexicale.
