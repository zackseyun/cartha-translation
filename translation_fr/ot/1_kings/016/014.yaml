source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֵלָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes d’Éla et tout ce qu’il a fait, tout cela n’est-il pas écrit dans le livre des Chroniques des rois d’Israël[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le livre des Annales des rois d’Israël ».'
    reason: Alternative lexicale pour דִּבְרֵי הַיָּמִים, qui peut désigner des chroniques ou des annales.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: Le reste des actes d’Éla
  rationale: Dans cette formule royale, דִּבְרֵי désigne les faits ou actes rapportés, plutôt que de simples « paroles ». Le וְ initial assure la liaison avec le contexte sans exiger l’ajout d’un adverbe temporel comme « maintenant ».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Rend directement la portée générale du verbe עָשָׂה et conserve le parallélisme avec les actes d’Éla.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: La question rhétorique attend une réponse affirmative. « Tout cela » reprend naturellement en français les deux éléments précédents, tandis que « écrit » conserve l’image documentaire du texte hébreu.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », le français idiomatique dit qu’un contenu est écrit « dans » un livre ou un registre.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: des Chroniques des rois d’Israël
  rationale: L’expression désigne un registre historique relatif aux rois d’Israël. « Chroniques » conserve le titre traditionnel, tandis que la note signale l’équivalent « Annales ».
theological_decisions:
- issue: Identification du document cité
  choice: Présenter le titre comme celui d’un registre royal, sans l’identifier au livre biblique des Chroniques
  alternative: Comprendre la mention comme une référence au livre canonique des Chroniques
  rationale: La formulation hébraïque renvoie aux annales des rois du royaume d’Israël et ne permet pas de les identifier au livre biblique des Chroniques.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve la question rhétorique de la formule royale et évite d’ajouter un marqueur temporel absent de l’hébreu.
