  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Baésha, ce qu’il a fait et sa puissance, tout cela n’est-il pas écrit dans le livre des Chroniques[a] des rois d’Israël ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le livre des Annales des rois d’Israël ».'
    reason: Alternative lexicale pour סֵפֶר דִּבְרֵי הַיָּמִים, expression qui peut désigner des chroniques ou des annales royales.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans cette formule royale, דִּבְרֵי désigne les faits ou actes consignés concernant le roi, plutôt que ses seules paroles. « Le reste des actes » conserve la concision et le caractère formulaire de l’hébreu.
- source_word: בַעְשָׁא
  choice: Baésha
  rationale: Forme française usuelle du nom propre hébreu.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: ce qu’il a fait
  rationale: Rend directement la proposition relative sans ajouter l’idée de totalité absente du texte hébreu.
- source_word: וּגְבוּרָתוֹ
  choice: et sa puissance
  rationale: Conserve le nom abstrait גְּבוּרָה, qui peut désigner la force, la puissance ou les exploits par lesquels elle se manifeste, sans imposer le sens plus interprétatif d’« exploits ».
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: Préserve la question rhétorique habituelle des Rois. « Tout cela » reprend naturellement en français les divers éléments énumérés et correspond au pronom pluriel hébreu הֵם.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Dans l’idiome de la consignation écrite, עַל se rend naturellement en français par « dans ».
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: le livre des Chroniques
  rationale: Désigne un document annalistique. « Chroniques » est transparent et traditionnel, tandis qu’« Annales » reste une possibilité signalée en note.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Le ל marque ici la relation du document aux rois d’Israël ; le complément français en « de » est naturel et précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure annalistique et la question rhétorique du texte hébreu, tout en employant « tout cela » pour assurer une reprise naturelle de l’énumération.
