    rationale: Le projet emploie « par leurs idoles », alors que בְהַבְלֵיהֶם exprime plus directement « avec leurs idoles ». « Avec » maintient mieux la formulation et l’ambiguïté instrumentale de l’hébreu.
  - severity: low
    issue: Construction « suivit ... ainsi que les péchés »
    rationale: La construction calque la coordination hébraïque mais sonne mal en français. « Suivit ... et commit les péchés » clarifie sans modifier le sens.
  revised_text: Il suivit entièrement la voie de Jéroboam, fils de Nebath, et commit les péchés par lesquels celui-ci avait fait pécher Israël, provoquant Yahweh, le Dieu d’Israël, avec leurs idoles[a].
