review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle au texte hébreu : le roi adopte pleinement la conduite de Jéroboam, les péchés en question sont ceux par lesquels Jéroboam avait fait pécher Israël, et cette conduite provoque Yahweh. Toutefois, la préposition בְ dans בְהַבְלֵיהֶם est plus directement rendue par « avec » que par « par » ; le texte français doit préserver ce rapport instrumental sans le reformuler inutilement.'
  naturalness: '« Suivit ... ainsi que les péchés » est compréhensible, mais peu naturel en français moderne : on suit une voie, tandis qu’on commet des péchés. Une coordination avec un second verbe rend la phrase plus idiomatique tout en conservant les deux compléments coordonnés de l’hébreu.'
  terminology: « Jéroboam, fils de Nebath », « Yahweh » et « le Dieu d’Israël » conviennent. « Idoles » est un rendu contextuel justifié de הֶבֶל dans ce contexte polémique ; la note conserve utilement les possibilités plus littérales.
  issues:
