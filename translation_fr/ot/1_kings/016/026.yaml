revisions:
- from: Il suivit en tout la voie de Jéroboam, fils de Nebath, ainsi que les péchés par lesquels celui-ci avait fait pécher Israël, provoquant Yahweh, le Dieu d’Israël, par leurs idoles[a].
  to: Il suivit entièrement la voie de Jéroboam, fils de Nebath, et commit les péchés par lesquels celui-ci avait fait pécher Israël, provoquant Yahweh, le Dieu d’Israël, avec leurs idoles[a].
  rationale: La révision remplace une coordination française peu idiomatique par deux verbes appropriés (« suivit » / « commit ») et rend בְ par « avec ». Elle conserve le causatif « avait fait pécher », le référent explicité par « celui-ci », le nom divin Yahweh et la note lexicale sur « idoles ».
