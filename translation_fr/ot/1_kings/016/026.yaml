  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט ו/ב/חטאתי/ו אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: fr
  text: Il suivit entièrement la voie de Jéroboam, fils de Nebath, et commit les péchés par lesquels celui-ci avait fait pécher Israël, provoquant Yahweh, le Dieu d’Israël, avec leurs idoles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs vanités » ou « leurs choses sans valeur » ; le terme hébreu est une désignation polémique courante des idoles.'
    reason: La note conserve l’image de vide et d’inconsistance portée par הֶבֶל, que le rendu contextuel « idoles » ne fait pas apparaître.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: Il suivit en tout la voie
  rationale: Dans cette expression, הלך décrit la conduite plutôt qu’un déplacement. « Suivre la voie » conserve la métaphore biblique, tandis que « en tout » exprime la conformité complète indiquée par בְּכָל.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Les noms propres sont rendus selon leur forme française biblique courante.
- source_word: וּבְחַטֹּאתָיו
  choice: ainsi que les péchés
  rationale: Le suffixe masculin singulier renvoie naturellement à Jéroboam, immédiatement nommé. La formulation française est reliée à « suivit » pour reproduire le parallélisme hébreu sans lourdeur excessive.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: par lesquels celui-ci avait fait pécher Israël
  rationale: Le hiphil de חטא est causatif. « Celui-ci » précise que Jéroboam, et non le roi sujet du verset, avait entraîné Israël dans le péché; le plus-que-parfait marque naturellement l’antériorité.
- source_word: לְהַכְעִיס
  choice: provoquant
  rationale: L’infinitif peut exprimer le but ou le résultat. Le participe français garde cette ouverture tout en reliant l’action à la conduite décrite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin, sans lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction hébraïque.
- source_word: בְּהַבְלֵיהֶם
  choice: par leurs idoles
  rationale: הֶבֶל désigne littéralement ce qui est souffle, inconsistant ou vain; dans ce contexte polémique et cultuel, il vise les idoles. « Idoles » rend clairement le référent, et la métaphore hébraïque est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Référent du suffixe dans « ses péchés » et sujet de « fit pécher »
  choice: Jéroboam
  alternative: le roi dont parle le contexte immédiat
  rationale: Jéroboam est l’antécédent grammatical immédiat du suffixe et le personnage traditionnellement décrit comme ayant fait pécher Israël. « Celui-ci » explicite ce lien sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la « voie » est conservée, mais la syntaxe est légèrement réorganisée pour éviter un calque hébraïque obscur. Le marqueur de note est placé après « idoles », terme auquel la note se rapporte.
