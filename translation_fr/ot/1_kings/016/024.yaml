  text: וַ/יִּ֜קֶן אֶת הָ/הָ֥ר שֹׁמְר֛וֹן מֵ֥/אֶת שֶׁ֖מֶר בְּ/כִכְּרַ֣יִם כָּ֑סֶף וַ/יִּ֨בֶן֙ אֶת הָ/הָ֔ר וַ/יִּקְרָ֗א אֶת שֵׁ֤ם הָ/עִיר֙ אֲשֶׁ֣ר בָּנָ֔ה עַ֣ל שֶׁם שֶׁ֔מֶר אֲדֹנֵ֖י הָ/הָ֥ר שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: fr
  text: Il acheta à Shémer la colline de Samarie pour deux talents d’argent[a]. Il construisit sur la colline et donna à la ville qu’il avait bâtie le nom de Samarie[b], d’après celui de Shémer, propriétaire de la colline.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le talent était une importante unité de poids servant notamment à mesurer les métaux précieux.
    reason: cultural_note
  - marker: b
    text: En hébreu, le nom Shomron (« Samarie ») est rapproché ici du nom de Shémer.
    reason: lexical_note
lexical_decisions:
- source_word: וַיִּקֶן
  choice: Il acheta
  rationale: Le verbe קנה désigne ici l’acquisition d’un terrain contre paiement. « Acheter » est le terme français courant et précis.
- source_word: הָהָר
  choice: la colline
  rationale: הַר peut désigner une montagne ou une colline. Dans ce contexte de site urbain, « colline » correspond mieux au relief évoqué et à l’usage français.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française traditionnelle et largement reconnue du nom du lieu, qui désigne ici d’abord la colline, puis la ville.
- source_word: מֵאֵת שֶׁמֶר
  choice: à Shémer
  rationale: Avec le verbe « acheter », le français exprime naturellement le vendeur par « acheter à quelqu’un ».
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: pour deux talents d’argent
  rationale: כִּכָּר désigne ici un talent, unité pondérale importante employée pour les métaux précieux; le duel indique qu’il y en avait deux.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: Il construisit sur la colline
  rationale: Littéralement, le texte dit qu’il « bâtit la colline ». La formulation française explicite sobrement qu’il construisit sur ce site, sans préciser davantage la nature des ouvrages.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: donna à la ville […] le nom de
  rationale: Cette tournure rend naturellement en français l’idiome hébreu « appeler le nom de la ville », tout en conservant l’acte formel de nomination.
- source_word: אֲשֶׁר בָּנָה
  choice: qu’il avait bâtie
  rationale: Le plus-que-parfait clarifie en français que la construction de la ville précède l’attribution de son nom.
- source_word: עַל שֵׁם
  choice: d’après celui de
  rationale: La formule indique que le nom de la ville a été donné en référence au nom de Shémer.
- source_word: אֲדֹנֵי הָהָר
  choice: propriétaire de la colline
  rationale: אָדוֹן renvoie ici à la possession du terrain, non à un titre nobiliaire ou religieux. « Propriétaire » exprime clairement ce rapport juridique.
theological_decisions: []
