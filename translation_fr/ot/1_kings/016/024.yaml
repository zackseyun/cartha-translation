  register: Français international moderne, digne et accessible. La syntaxe suit la progression du récit hébreu tout en évitant les calques peu naturels. La répétition de la construction et de la nomination est conservée, et le lien étymologique exprimé par le texte est rendu explicitement sans prétendre établir une étymologie au-delà de ce rapprochement narratif.
