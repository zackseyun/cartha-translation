revisions:
- from: à cause des péchés qu’il avait commis[a], en faisant ce qui est mal aux yeux de Yahweh, en suivant la voie de Jéroboam et en commettant le péché par lequel il avait fait pécher Israël.
  to: à cause des péchés qu’il avait commis[a], en faisant ce qui est mal aux yeux de Yahweh, en suivant la voie de Jéroboam et le péché qu’il avait commis pour faire pécher Israël.
  rationale: La révision conserve le pluriel idiomatique français au début, tout en rétablant pour la seconde proposition le parallélisme « en suivant … et [en suivant] le péché ». Elle rend l’infinitif final par « pour faire pécher Israël », sans transformer sa valeur en une affirmation instrumentale ou achevée. La note est rendue plus exacte quant à la construction cognate hébraïque.
