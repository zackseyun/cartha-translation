  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: fr
  text: à cause des péchés qu’il avait commis[a], en faisant ce qui est mal aux yeux de Yahweh, en suivant la voie de Jéroboam et le péché qu’il avait commis pour faire pécher Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à cause de son péché qu’il avait péché »; l’hébreu emploie une construction apparentée au singulier.'
    reason: La note signale à la fois le singulier grammatical et la répétition du nom et du verbe hébreux, que le français idiomatique rend par le pluriel « péchés qu’il avait commis ».
lexical_decisions:
- source_word: עַל
  choice: à cause de
  rationale: La préposition introduit ici la cause du jugement mentionné dans le contexte précédent.
- source_word: חטאתו אֲשֶׁר חָטָא
  choice: des péchés qu’il avait commis
  rationale: La tournure apparentée, littéralement « son péché qu’il avait péché », désigne idiomatiquement ses actes coupables. Le pluriel collectif est naturel en français, tandis qu’une note conserve la forme singulière de l’hébreu.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: en faisant ce qui est mal aux yeux de Yahweh
  rationale: Cette formulation conserve la métaphore évaluative hébraïque et exprime naturellement le contenu de sa faute.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: en suivant la voie de Jéroboam
  rationale: « Suivre la voie » rend clairement, en français actuel, la métaphore hébraïque de la conduite sans en effacer l’image.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: et en commettant le péché par lequel il avait fait pécher Israël
  rationale: La formulation maintient le second substantif au singulier et rend explicitement la valeur causative du hifil de חטא, sans laisser l’infinitif final en suspens.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un simple titre et suit l’orientation fournie pour cette édition.
- issue: Responsabilité de Zimri dans le péché d’Israël
  choice: il avait fait pécher Israël
  alternative: il avait entraîné Israël à pécher
  rationale: Le choix retenu conserve directement la force causative du verbe hébreu sans préciser au-delà du texte le mécanisme de cette influence.
translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure un complément causal rattaché au verset précédent. Les participes anglais ont été rendus par des groupes en « en », et l’image de la « voie » a été conservée sous une forme française naturelle.
