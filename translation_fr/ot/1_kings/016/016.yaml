  text: וַ/יִּשְׁמַ֤ע הָ/עָם֙ הַ/חֹנִ֣ים לֵ/אמֹ֔ר קָשַׁ֣ר זִמְרִ֔י וְ/גַ֖ם הִכָּ֣ה אֶת הַ/מֶּ֑לֶךְ וַ/יַּמְלִ֣כוּ כָֽל יִ֠שְׂרָאֵל אֶת עָמְרִ֨י שַׂר צָבָ֧א עַל יִשְׂרָאֵ֛ל בַּ/יּ֥וֹם הַ/ה֖וּא בַּֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: fr
  text: 'Le peuple qui campait là apprit la nouvelle : « Zimri a conspiré et il a même tué le roi. » Alors, ce jour-là, dans le camp, tout Israël proclama roi Omri, le chef de l’armée d’Israël.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: le peuple qui campait là
  rationale: Rend naturellement le participe « campant » dans ce contexte militaire; « là » explicite seulement la situation indiquée par le camp mentionné en fin de verset.
- source_word: קָשַׁר
  choice: a conspiré
  rationale: Le verbe désigne ici un complot ou une conjuration contre le roi.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: a même tué le roi
  rationale: Bien que נכה signifie littéralement « frapper », le contexte immédiat établit que Zimri a mis le roi à mort; « tué » communique le sens contextuel sans ambiguïté artificielle.
- source_word: וַיַּמְלִכוּ
  choice: proclama roi
  rationale: Exprime l’action causative d’établir quelqu’un comme roi, dans un français idiomatique.
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: le chef de l’armée d’Israël
  rationale: La préposition עַל marque ici l’autorité d’Omri sur l’armée d’Israël; cette formulation française évite l’ambiguïté de « sur Israël ».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. L’ordre final des compléments (« ce jour-là, dans le camp ») conserve les repères temporel et spatial de l’hébreu tout en produisant une phrase naturelle.
