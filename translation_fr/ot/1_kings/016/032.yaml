source:
  edition: WLC
  text: וַ/יָּ֥קֶם מִזְבֵּ֖חַ לַ/בָּ֑עַל בֵּ֣ית הַ/בַּ֔עַל אֲשֶׁ֥ר בָּנָ֖ה בְּ/שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: fr
  text: Il érigea un autel pour Baal dans le temple de Baal[a] qu’il avait bâti à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de Baal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Il érigea
  rationale: Le hiphil de קום signifie ici faire tenir debout, dresser ou établir. « Ériger un autel » est une expression française naturelle et digne, proche de l’action hébraïque.
- source_word: מִזְבֵּחַ
  choice: un autel
  rationale: Équivalent français usuel de מִזְבֵּחַ dans un contexte sacrificiel.
- source_word: לַבָּעַל
  choice: pour Baal
  rationale: Le ל marque ici la destination ou la dédicace de l’autel. « Pour Baal » restitue naturellement cette relation en français.
- source_word: בֵּית הַבַּעַל
  choice: le temple de Baal
  rationale: Littéralement « la maison de Baal ». Dans ce contexte cultuel, « temple » communique clairement le référent en français moderne, tandis qu’une note conserve la forme concrète de l’hébreu.
- source_word: אֲשֶׁר בָּנָה
  choice: qu’il avait bâti
  rationale: Le plus-que-parfait indique naturellement que la construction du temple précède l’érection de l’autel. « Bâtir » convient au registre narratif biblique sans être archaïque.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Pour une ville, la préposition locative ב se rend idiomatiquement par « à » en français.
theological_decisions:
- issue: Sens de בֵּית הַבַּעַל
  choice: le temple de Baal
  alternative: la maison de Baal
  rationale: Le nom בַּיִת peut désigner une maison ou, lorsqu’il s’agit de la demeure cultuelle d’une divinité, un temple. Le texte vise ici un édifice cultuel; « temple » rend donc le sens contextuel, sans masquer la formulation littérale, signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. « Il érigea » maintient la concision du récit; « temple » évite l’ambiguïté que « maison de Baal » pourrait créer pour un lecteur contemporain, tout en conservant cette formulation dans la note.
