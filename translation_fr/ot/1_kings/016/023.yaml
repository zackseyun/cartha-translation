base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: fr
  text: Dans la trente et unième année du règne d’Asa, roi de Juda, Omri devint roi d’Israël. Il régna douze ans, dont six ans à Tirsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וְ/אַחַת שָׁנָה לְ/אָסָא
  choice: La trente et unième année du règne d’Asa
  rationale: Cette formulation française naturelle rend la formule hébraïque de datation royale et explicite la relation marquée par לְ sans modifier le sens.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rend directement le titre royal et le territoire gouverné.
- source_word: מָלַךְ עָמְרִי עַל יִשְׂרָאֵל
  choice: Omri devint roi d’Israël
  rationale: Dans cette formule d’avènement, מָלַךְ a une valeur ingressive; « devint roi » la restitue clairement, tandis que « d’Israël » est plus idiomatique en français que « sur Israël ».
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Il régna douze ans
  rationale: Exprime naturellement en français la durée totale du règne.
- source_word: בְּ/תִרְצָה מָלַךְ שֵׁשׁ שָׁנִים
  choice: dont six à Tirsa
  rationale: La tournure concise indique clairement que six des douze années de règne eurent Tirsa pour siège, tout en évitant une répétition lourde de « régna ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe distingue clairement les douze années du règne total des six années passées à régner depuis Tirsa; aucune note n’est nécessaire puisque « dont six » rend cette relation explicitement.
