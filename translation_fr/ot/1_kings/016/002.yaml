  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: fr
  text: Parce que je t’ai élevé de la poussière et t’ai établi chef de mon peuple Israël, et que tu as marché dans la voie de Jéroboam et fait pécher[a] mon peuple Israël, provoquant ma colère par leurs péchés,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une forme causative ; on pourrait aussi traduire : « entraîné mon peuple Israël dans le péché ».'
    reason: Précise la force causative du verbe et propose une formulation française naturelle équivalente.
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Parce que
  rationale: Introduit la raison du jugement annoncé au verset suivant et conserve la construction suspendue du texte hébreu.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: je t’ai élevé de la poussière
  rationale: Conserve l’image concrète de l’élévation depuis une condition humble tout en évoquant l’accession au pouvoir.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: t’ai établi chef
  rationale: « Établi » exprime l’acte de confier une fonction, et « chef » rend נָגִיד sans employer un titre royal plus précis que l’hébreu.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: mais que tu as marché dans la voie de Jéroboam
  rationale: Préserve la métaphore hébraïque de la conduite comme marche. « Mais » explicite avec naturel le contraste contextuel entre l’élévation accordée par Dieu et la conduite de Baasha, sans modifier le contenu des propositions.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: et fait pécher mon peuple Israël
  rationale: Rend directement la forme causative du verbe חטא et maintient la responsabilité du roi dans le péché du peuple.
- source_word: לְהַכְעִיסֵנִי
  choice: provoquant ainsi ma colère
  rationale: Exprime le résultat de l’action et la dimension personnelle de l’offense faite à Dieu.
- source_word: בְּחַטֹּאתָם
  choice: par leurs péchés
  rationale: Conserve le pluriel et la valeur instrumentale probable de la préposition בְּ.
theological_decisions:
- issue: Référent du suffixe pluriel dans בְּחַטֹּאתָם (« leurs péchés »)
  choice: Le suffixe renvoie immédiatement au peuple d’Israël, amené à pécher par Baasha.
  alternative: Il peut englober plus largement les pratiques coupables liées à la voie de Jéroboam, auxquelles Baasha participe lui-même.
  rationale: L’antécédent grammatical le plus proche est « mon peuple Israël ». Cette lecture maintient à la fois la responsabilité du peuple pour ses péchés et celle du roi qui l’y a conduit.
- issue: Valeur de la conjonction devant « tu as marché »
  choice: « mais » pour faire ressortir le contraste implicite entre la faveur divine et l’infidélité de Baasha.
  alternative: « et » rendrait plus formellement le simple וַ hébreu.
  rationale: Le waw hébreu permet ici une relation déterminée par le contexte. Le contraste est manifeste, mais il n’est pas lexicalement marqué par une conjonction adversative spécifique.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique « marcher dans la voie » est conservée. La virgule finale maintient le lien syntaxique avec l’annonce du jugement au verset suivant.
