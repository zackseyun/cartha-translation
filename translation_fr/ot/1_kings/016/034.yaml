  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: fr
  text: À son époque, Hiel de Béthel rebâtit Jéricho[a]. Au prix d’Abiram, son fils aîné, il en posa les fondations, et au prix de Segoub, son plus jeune fils, il en installa les portes[b], conformément à la parole que Yahvé avait prononcée par l’intermédiaire de Josué, fils de Noun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « bâtit Jéricho ». « Rebâtit » tient compte du fait que la ville avait été détruite auparavant.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, la préposition peut être rendue par « avec » ou « en » : « avec/en Abiram, son fils aîné… et avec/en Segoub, son plus jeune fils ». Dans le contexte de Josué 6.26, la formulation est généralement comprise comme signifiant que la reconstruction lui coûta la vie de ses fils.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: À son époque
  rationale: Expression temporelle naturelle renvoyant à l’époque du roi mentionné précédemment, sans préciser davantage que l’hébreu.
- source_word: בָּנָה
  choice: rebâtit
  rationale: Le verbe signifie littéralement « bâtit », mais le contexte historique d’une ville auparavant détruite justifie « rebâtit » ; la note conserve le sens strict.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: Hiel de Béthel
  rationale: La désignation indique l’origine ou le rattachement à Béthel ; cette tournure est claire et naturelle en français moderne.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: Au prix d’Abiram, son fils aîné
  rationale: 'La préposition ב est rendue selon le contexte d’accomplissement de la malédiction de Josué 6.26 : les travaux entraînent la perte du fils, sans préciser la manière dont il meurt.'
- source_word: יִסְּדָהּ
  choice: il en posa les fondations
  rationale: Le verbe יסד, dans le contexte d’une construction, désigne la pose des fondations ; « en » renvoie naturellement à Jéricho.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: et au prix de Segoub, son plus jeune fils
  rationale: La formulation parallèle reprend le sens contextuel de ב ; צעיר désigne ici le plus jeune dans l’ordre familial.
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: il en installa les portes
  rationale: Dans le contexte d’une ville, דלתות désigne les battants ou portes urbaines ; « installa » exprime naturellement leur mise en place.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole que Yahvé
  rationale: La formule indique l’accomplissement de la parole divine. Le nom personnel יהוה est rendu par « Yahvé », conformément à la couche anglaise fournie et sans masquer le nom présent dans l’hébreu.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: avait prononcée par l’intermédiaire de
  rationale: ביד est une expression d’agence prophétique ; la tournure française transmet clairement la médiation sans traduire littéralement « par la main de ».
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, fils de Noun
  rationale: Forme française usuelle du nom et rendu naturel du patronyme.
theological_decisions:
- issue: Nature de l’accomplissement concernant les fils de Hiel
  choice: Présenter la reconstruction comme réalisée au prix de la perte de son fils aîné puis de son plus jeune fils.
  alternative: Traduire littéralement « avec/en Abiram… avec/en Segoub », ce qui pourrait seulement associer leurs vies aux étapes des travaux.
  rationale: L’écho direct à Josué 6.26 favorise fortement un accomplissement de la malédiction impliquant la mort des fils. « Au prix de » communique cette lecture contextuelle sans ajouter de mécanisme causal ni de détail absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme des deux étapes de construction. Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondants.
