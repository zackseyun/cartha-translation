  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: fr
  text: Achab fit aussi l’Ashéra[a], et il fit encore davantage pour irriter Yahvé, le Dieu d’Israël, que tous les rois d’Israël qui l’avaient précédé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le poteau sacré d’Ashéra ». Le mot hébreu peut désigner la déesse Ashéra ou l’objet cultuel qui lui est associé.
    reason: Lecture alternative destinée à préserver l’ambiguïté lexicale du texte hébreu.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie couramment « faire » ou « fabriquer ». « Fit » reste direct sans préciser indûment qu’Achab aurait dressé l’objet.
- source_word: הָאֲשֵׁרָה
  choice: l’Ashéra
  rationale: Le terme אֲשֵׁרָה peut désigner la déesse Ashéra ou l’objet cultuel qui lui est associé. La translittération préserve cette ambiguïté.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: alla plus loin encore dans ses actes
  rationale: La construction יסף suivie de l’infinitif exprime l’ajout ou la poursuite; avec la comparaison finale, elle marque ici une aggravation par rapport aux rois antérieurs.
- source_word: לְהַכְעִיס
  choice: provoquant la colère de
  rationale: Le hifil de כעס signifie causer l’irritation ou la colère. Cette formulation française explicite naturellement la valeur causative.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » translittère le nom divin plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la chaîne construite, en apposition au nom divin.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל
  choice: que tous les rois d’Israël
  rationale: La préposition מן introduit ici le second terme d’une comparaison liée à l’aggravation exprimée dans la proposition précédente.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: qui l’avaient précédé
  rationale: L’expression désigne clairement les rois antérieurs; cette formulation est plus naturelle en français moderne que le calque « qui avaient été avant lui ».
theological_decisions:
- issue: Référent de אֲשֵׁרָה
  choice: Conserver « l’Ashéra » sans trancher entre la déesse et sa représentation cultuelle.
  alternative: « le poteau sacré d’Ashéra » ou « Ashéra » en tant que déesse
  rationale: Le texte hébreu ne précise pas sans équivoque si le terme désigne ici la divinité ou l’objet cultuel qui lui est associé. Le corps du texte conserve donc l’ambiguïté, et la note expose les deux possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase maintient la progression emphatique du texte hébreu tout en évitant un calque maladroit de יסף לעשות. Le nom divin est rendu par « Yahvé » et le terme cultuel ambigu est translittéré.
