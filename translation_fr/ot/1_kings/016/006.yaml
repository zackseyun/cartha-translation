id: 1KI.16.6
reference: 1 Kings 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב בַּעְשָׁא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/תִרְצָ֑ה וַ/יִּמְלֹ֛ךְ אֵלָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: fr
  text: Baasha se coucha avec ses pères[a] et fut enterré à Tirtsa. Son fils Éla régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec ses ancêtres ». L’expression hébraïque « se coucher avec ses pères » est une formule conventionnelle désignant la mort d’un roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Le verbe signifie littéralement « se coucher » et appartient ici à la formule royale conventionnelle désignant la mort. Le conserver évite de réduire l’expression à la simple paraphrase « mourut ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Cette formulation reproduit l’expression hébraïque récurrente dans les notices de décès royales. Bien que « avec ses ancêtres » soit plus immédiatement idiomatique en français, « avec ses pères » préserve la forme et la portée traditionnelle de la formule.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le nifal a ici un sens passif. « Fut enterré » convient au registre narratif et à la notice funéraire.
- source_word: בְּתִרְצָה
  choice: à Tirtsa
  rationale: Avec un nom de ville, le français emploie naturellement « à ». « Tirtsa » translittère le nom hébreu תִּרְצָה de manière adaptée au français.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans une notice de succession royale, « régna » restitue avec concision la formule hébraïque, sans expliciter plus que le texte.
- source_word: אֵלָה בְנוֹ
  choice: son fils Éla
  rationale: Cet ordre est plus naturel en français que la séquence hébraïque littérale, tout en conservant exactement la relation familiale et l’identité du successeur.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans ce contexte de succession, l’expression indique qu’Éla remplace Baasha comme roi. « À sa place » conserve cette idée plus précisément que « après lui ».
theological_decisions:
- issue: Portée de la formule funéraire « se coucha avec ses pères »
  choice: Conserver l’image hébraïque sans la remplacer par « mourut »
  alternative: Baasha mourut / Baasha rejoignit ses ancêtres
  rationale: La formule indique conventionnellement la mort du roi, mais son image et son caractère récurrent font partie du texte. La traduction ne lui attribue pas davantage de précision sur l’état des morts que l’hébreu lui-même.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe a été légèrement réordonnée dans la seconde phrase pour être naturelle en français. L’expression funéraire traditionnelle est volontairement conservée et expliquée en note.
