  text: וַ/יַּעֲלֶ֥ה עָמְרִ֛י וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ מִֽ/גִּבְּת֑וֹן וַ/יָּצֻ֖רוּ עַל תִּרְצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/017.yaml
  text: Then Omri and all Israel with him went up from Gibbethon[a], and they laid siege to Tirzah.
translation:
  language: fr
  text: Alors Omri monta de Guibbethôn avec tout Israël, et ils assiégèrent Tirtsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: monta
  rationale: Le verbe עלה exprime fondamentalement un mouvement vers le haut; « monta » préserve l’idiome hébreu sans préciser s’il s’agit de la topographie ou d’une avancée militaire.
- source_word: עָמְרִי
  choice: Omri
  rationale: Transcription française courante du nom personnel.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: avec tout Israël
  rationale: Conserve le collectif national « Israël » et rattache naturellement « avec lui » à Omri en français, sans expliciter davantage qu’il s’agit des forces qui le soutiennent.
- source_word: מִגִּבְּתוֹן
  choice: de Guibbethôn
  rationale: Le préfixe מן indique le point de départ; « Guibbethôn » suit une transcription française intelligible du toponyme.
- source_word: וַיָּצֻרוּ
  choice: ils assiégèrent
  rationale: Dans ce contexte militaire, צור désigne l’action d’assiéger; le verbe français est direct, naturel et fidèle.
- source_word: עַל
  choice: Tirtsa comme complément direct de « assiégèrent »
  rationale: Avec צור, על introduit la cible du siège; le français exprime idiomatiquement cette relation par un complément direct.
- source_word: תִּרְצָה
  choice: Tirtsa
  rationale: Transcription française du nom de lieu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. L’ordre a été légèrement réorganisé (« de Guibbethôn avec tout Israël ») pour éviter que « avec lui » paraisse lourd, tout en conservant les relations du texte hébreu. Aucun ajout interprétatif tel que « armée » ou « troupes ».
