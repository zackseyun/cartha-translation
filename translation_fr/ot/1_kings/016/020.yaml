  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י זִמְרִ֔י וְ/קִשְׁר֖/וֹ אֲשֶׁ֣ר קָשָׁ֑ר הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Zimri et son complot, qu’il trama[a], ne sont-ils pas consignés dans le livre des Annales des rois d’Israël ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son complot qu’il complota ». L’hébreu emploie un nom et un verbe de la même racine pour produire un effet d’insistance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: Le reste des actes de Zimri
  rationale: Dans cette formule royale récurrente, דִּבְרֵי désigne les faits et gestes du roi plutôt que ses seules paroles. « Actes » est concis, naturel et adapté au contexte annalistique.
- source_word: וְקִשְׁרוֹ
  choice: et son complot
  rationale: קֶשֶׁר désigne ici un complot politique contre le pouvoir royal. Le possessif « son » rend explicitement le suffixe hébreu de troisième personne du masculin singulier.
- source_word: אֲשֶׁר קָשָׁר
  choice: qu’il avait ourdi
  rationale: Le verbe reprend en hébreu la racine du nom קֶשֶׁר. « Ourdir un complot » exprime naturellement en français l’action conspiratrice, tandis qu’une note signale la répétition étymologique de l’original.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas consignés
  rationale: La question négative conserve la forme rhétorique de la formule hébraïque. « Consignés » convient à l’inscription de faits dans des archives, sans modifier le sens de « écrits ».
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dans le livre des Annales
  rationale: Dans cette formule archivistique, עַל se rend idiomatiquement par « dans ». דִּבְרֵי הַיָּמִים désigne un registre annalistique; « Annales » évite de le confondre avec le livre biblique canonique des Chroniques.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Le לְ marque ici le rattachement du registre aux rois d’Israël et se rend naturellement par un complément introduit par « des ».
