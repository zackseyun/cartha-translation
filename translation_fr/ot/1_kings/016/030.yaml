source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: fr
  text: Achab, fils d’Omri, fit ce qui est mal aux yeux de Yahweh, plus que tous ceux qui l’avaient précédé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie « faire »; avec הָרַע, il forme l’expression courante « faire ce qui est mal ».
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’adjectif substantivé avec l’article désigne « le mal » ou, plus naturellement en français dans cette tournure, « ce qui est mal ».
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette traduction conserve l’image hébraïque tout en exprimant clairement que l’acte est évalué du point de vue de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: plus que tous ceux qui l’avaient précédé
  rationale: La préposition comparative מִן et l’expression temporelle לְפָנָיו indiquent qu’Akab surpassa dans le mal tous ses prédécesseurs.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. « Akab » et « Omri » suivent les formes françaises bibliques usuelles. La formulation conserve l’idiome « aux yeux de » et rend explicitement la valeur temporelle de « devant lui » par « l’avaient précédé ».
