  text: הַ/מֵּ֤ת לְ/בַעְשָׁא֙ בָּ/עִ֔יר יֹֽאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּ֥ת ל/וֹ֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: fr
  text: Quiconque, parmi ceux de Baasha[a], mourra dans la ville, les chiens le mangeront ; et quiconque, parmi les siens, mourra dans la campagne, les oiseaux du ciel[b] le mangeront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui meurt, appartenant à Baasha » ; ou : « celui de Baasha ». Il s’agit vraisemblablement de membres de sa maison ou de sa dynastie, mais l’hébreu ne le précise pas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les oiseaux des cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת
  choice: quiconque … mourra
  rationale: Le participe singulier a ici une valeur générique. La tournure française « quiconque … mourra » exprime naturellement toute personne visée dans le contexte de cet oracle.
- source_word: לְבַעְשָׁא
  choice: parmi ceux de Baasha
  rationale: Le lamed marque une relation d’appartenance ou d’association. Cette formulation conserve l’indétermination de l’hébreu sans préciser davantage « maison », « famille » ou « dynastie ».
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Traduction locative directe, qui maintient le contraste avec la campagne.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: les chiens le mangeront
  rationale: Le verbe אָכַל signifie littéralement « manger ». Le pronom « le » est nécessaire en français et reprend la personne qui mourra.
- source_word: וְהַמֵּת לוֹ
  choice: et quiconque, parmi les siens, mourra
  rationale: Le pronom renvoie à Baasha. « Parmi les siens » préserve le parallélisme tout en évitant une répétition lourde de son nom.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שׂדה peut désigner un champ ou l’espace ouvert hors de la ville. « Dans la campagne » rend ici clairement l’opposition spatiale entre ville et dehors sans suggérer nécessairement une parcelle cultivée précise.
- source_word: עוֹף הַשָּׁמָיִם
  choice: les oiseaux du ciel
  rationale: Le collectif עוֹף désigne les oiseaux ou créatures volantes. « Les oiseaux du ciel » est une expression française naturelle qui conserve l’image biblique.
