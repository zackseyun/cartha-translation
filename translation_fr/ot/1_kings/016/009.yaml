  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ עַבְדּ֣/וֹ זִמְרִ֔י שַׂ֖ר מַחֲצִ֣ית הָ/רָ֑כֶב וְ/ה֤וּא בְ/תִרְצָה֙ שֹׁתֶ֣ה שִׁכּ֔וֹר בֵּ֣ית אַרְצָ֔א אֲשֶׁ֥ר עַל הַ/בַּ֖יִת בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: fr
  text: Mais son serviteur Zimri, chef de la moitié des chars, conspira contre lui alors que celui-ci se trouvait à Tirtsa, buvant jusqu’à l’ivresse[a] dans la maison d’Artsa, responsable du palais à Tirtsa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « buvant jusqu’à s’enivrer ». L’expression hébraïque décrit vivement une consommation d’alcool en cours qui mène à l’ivresse.'
    reason: lexical_alternative
  - marker: b
    text: '« Responsable du palais » correspond à un titre administratif : Artsa était vraisemblablement responsable de la maison royale ou de l’administration du palais.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: conspira contre lui
  rationale: Le verbe קשר suivi de עַל désigne, dans les récits royaux, une conspiration contre un souverain. « Conspira contre lui » conserve cette portée politique.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: עבד signifie littéralement « serviteur », tout en pouvant désigner ici un officier ou un fonctionnaire royal. La traduction garde le terme concret sans exclure sa fonction officielle.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Translittération française usuelle du nom propre.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: chef de la moitié des chars
  rationale: שַׂר désigne un chef ou commandant, et רכב la force de chars. Cette formulation reste proche de la chaîne construite hébraïque tout en étant lisible.
- source_word: וְהוּא
  choice: alors que celui-ci se trouvait
  rationale: Le pronom introduit les circonstances dans lesquelles la conspiration a lieu. « Celui-ci » maintient la référence pronominale sans ajouter le nom absent de l’hébreu.
- source_word: בְתִרְצָה
  choice: à Tirtsa
  rationale: Translittération du toponyme avec la préposition française naturelle pour un nom de ville.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: buvant jusqu’à l’ivresse
  rationale: L’association du participe « buvant » et de l’adjectif « ivre » décrit de manière vive une consommation en cours qui aboutit à l’ivresse.
- source_word: בֵּית אַרְצָא
  choice: dans la maison d’Artsa
  rationale: בית suivi d’un nom propre désigne naturellement la maison de cette personne. La traduction conserve la formulation concrète du texte.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: qui était chargé du palais
  rationale: L’expression עַל־הַבַּיִת est un titre administratif désignant le responsable de la maison royale ou du palais. « Chargé du palais » communique la fonction sans surcharger le texte.
- source_word: בְּתִרְצָה
  choice: à Tirtsa
  rationale: La répétition finale du lieu est conservée conformément à l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms sont translittérés sous les formes « Zimri », « Tirtsa » et « Artsa ». La syntaxe reste proche de l’hébreu, notamment par la répétition de « à Tirtsa », tout en rendant explicitement la valeur circonstancielle de וְהוּא.
