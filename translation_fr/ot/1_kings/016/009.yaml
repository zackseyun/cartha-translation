  to: Mais son serviteur Zimri, chef de la moitié des chars, conspira contre lui alors que celui-ci se trouvait à Tirtsa, buvant jusqu’à l’ivresse[a] dans la maison d’Artsa, responsable du palais à Tirtsa[b].
  rationale: La révision ne modifie pas le sens du passage. Elle remplace la relative ambiguë par l’apposition « responsable du palais à Tirtsa », qui rattache explicitement le titre administratif à Artsa et conserve la répétition finale du lieu présente en hébreu. La note b est ajustée en conséquence.
