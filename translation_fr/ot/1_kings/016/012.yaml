id: 1KI.16.12
reference: 1 Kings 16:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: fr
  text: Ainsi, Zimri extermina toute la maison de Baésha[b], conformément à la parole de Yahweh, qu’il avait prononcée contre[a] Baésha par l’intermédiaire du prophète Jéhu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à Baésha ». La préposition hébraïque signifie littéralement « à » ou « vers », mais elle introduit ici une parole de jugement dirigée contre lui.'
    reason: lexical_alternative
  - marker: b
    text: Ici, la « maison de Baésha » désigne sa famille royale ou sa dynastie, et non simplement son habitation ou sa maisonnée.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: extermina
  rationale: Le hifil de שׁמד exprime ici l’anéantissement complet de la dynastie. « Extermina » rend nettement cette force dans le récit, sans préciser le moyen employé.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: toute la maison de Baésha
  rationale: Dans ce contexte royal, « maison » désigne la famille régnante ou la dynastie de Baésha, et non un bâtiment ni seulement les personnes vivant sous son toit.
- source_word: כִּדְבַר
  choice: conformément à la parole de
  rationale: La tournure marque la conformité de l’événement à une déclaration divine antérieure et son accomplissement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription « Yahweh » représente le nom divin יהוה au lieu de lui substituer un titre.
- source_word: אֲשֶׁר דִּבֶּר
  choice: qu’il avait prononcée
  rationale: Le plus-que-parfait exprime naturellement l’antériorité de l’oracle; « prononcée » s’accorde avec « parole » et convient au registre prophétique.
- source_word: אֶל בַּעְשָׁא
  choice: contre Baésha
  rationale: אֶל signifie littéralement « vers/à », mais, dans ce contexte d’oracle de jugement, « contre » communique la portée hostile de la parole tout en laissant l’alternative littérale en note.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: par l’intermédiaire du prophète Jéhu
  rationale: L’expression idiomatique « par la main de » indique l’intermédiaire ou l’agent; cette formulation est claire et naturelle en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve sous forme transcrite sans le remplacer par un titre.
- issue: Portée de אֶל dans la parole prophétique concernant Baésha
  choice: contre Baésha
  alternative: à Baésha
  rationale: Le contexte indique une parole de jugement dirigée contre Baésha. Comme la préposition peut formellement se traduire par « à », cette ambiguïté est signalée en note.
- issue: Sens de « maison » dans la condamnation de Baésha
  choice: maison au sens de dynastie ou famille royale
  alternative: maisonnée physique de Baésha
  rationale: Le contexte de succession royale et d’élimination de la lignée favorise le sens dynastique, sans réduire l’expression à un bâtiment ou à une simple maisonnée.
translation_notes:
  register: Français international moderne, narratif et digne. « Ainsi » assure la continuité du récit; « conformément à » rend clairement l’accomplissement de l’oracle. Les noms sont transcrits sous les formes françaises Baésha et Jéhu.
