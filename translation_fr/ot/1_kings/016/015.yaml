  text: בִּ/שְׁנַת֩ עֶשְׂרִ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֥ךְ זִמְרִ֛י שִׁבְעַ֥ת יָמִ֖ים בְּ/תִרְצָ֑ה וְ/הָ/עָ֣ם חֹנִ֔ים עַֽל גִּבְּת֖וֹן אֲשֶׁ֥ר לַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: fr
  text: La vingt-septième année du règne d’Asa, roi de Juda, Zimri régna sept jours à Tirtsa, tandis que le peuple campait contre Guibbethon[a], qui appartenait aux Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de Guibbethon ». Dans ce contexte militaire, « contre Guibbethon » indique probablement que le peuple campait face à la ville pour l’attaquer.
    reason: La préposition עַל peut avoir un sens spatial (« près de », « à ») ou hostile (« contre »). Le contexte favorise le second sans exclure entièrement le premier.
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה לְאָסָא מֶלֶךְ יְהוּדָה
  choice: La vingt-septième année du règne d’Asa, roi de Juda
  rationale: La formule française explicite naturellement l’année de règne sous-entendue par la formule hébraïque de synchronisme, tout en conservant le titre d’Asa.
- source_word: מָלַךְ זִמְרִי שִׁבְעַת יָמִים
  choice: Zimri régna sept jours
  rationale: Dans cette construction suivie d’une durée, מָלַךְ décrit naturellement l’exercice de la royauté pendant sept jours. « Régna sept jours » est direct et idiomatique en français.
- source_word: בְּתִרְצָה
  choice: à Tirtsa
  rationale: La préposition locative est rendue par « à », conformément à l’usage français devant un nom de ville.
- source_word: וְהָעָם חֹנִים
  choice: tandis que le peuple campait
  rationale: Le participe exprime une situation en cours servant d’arrière-plan. « Tandis que » restitue cette valeur circonstancielle, et le singulier « campait » s’accorde naturellement avec le collectif « peuple ».
- source_word: עַל גִּבְּתוֹן
  choice: contre Guibbethon
  rationale: Dans ce contexte militaire, עַל indique vraisemblablement que le campement était dirigé contre la ville. La traduction évite toutefois de préciser qu’un siège formel était en cours.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: qui appartenait aux Philistins
  rationale: Le lamed marque ici l’appartenance ou l’association. Cette formulation reste claire sans ajouter une notion plus précise d’occupation militaire.
