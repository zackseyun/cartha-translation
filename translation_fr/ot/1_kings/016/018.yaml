  text: וַ/יְהִ֞י כִּ/רְא֤וֹת זִמְרִי֙ כִּֽי נִלְכְּדָ֣ה הָ/עִ֔יר וַ/יָּבֹ֖א אֶל אַרְמ֣וֹן בֵּית הַ/מֶּ֑לֶךְ וַ/יִּשְׂרֹ֨ף עָלָ֧י/ו אֶת בֵּֽית מֶ֛לֶךְ בָּ/אֵ֖שׁ וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: fr
  text: Quand Zimri vit que la ville avait été prise, il entra dans la citadelle du palais royal[a], mit le feu au palais royal où il se trouvait[b] et mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « forteresse » ou « palais ». Le mot hébreu peut désigner un édifice royal fortifié.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « il brûla sur lui le palais royal avec le feu ». La tournure indique qu'il incendia le palais sur lui-même ; le texte ne précise pas davantage les circonstances physiques de sa mort.
    reason: cultural_note
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: Quand … vit
  rationale: La préposition כ avec l’infinitif construit introduit ici une proposition temporelle. « Quand … vit » rend naturellement cette relation dans le récit.
- source_word: נִלְכְּדָה הָעִיר
  choice: la ville avait été prise
  rationale: Le nifal de לכד exprime la prise de la ville. Le plus-que-parfait français marque clairement que celle-ci précède la réaction de Zimri.
- source_word: אַרְמוֹן בֵּית הַמֶּלֶךְ
  choice: la citadelle du palais royal
  rationale: אַרְמוֹן peut désigner un palais ou un édifice royal fortifié. « Citadelle » distingue cette structure intérieure du בֵּית הַמֶּלֶךְ mentionné avec elle, rendu ici par « palais royal ».
- source_word: וַיִּשְׂרֹף עָלָיו אֶת בֵּית מֶלֶךְ בָּאֵשׁ
  choice: incendia le palais autour de lui
  rationale: Cette formulation française naturelle exprime que Zimri met lui-même le feu à la résidence royale alors qu’il s’y trouve. « Autour de lui » explicite sobrement la valeur contextuelle de עָלָיו sans ajouter que l’édifice s’écroula.
- source_word: וַיָּמֹת
  choice: et mourut
  rationale: Le verbe poursuit simplement la chaîne narrative et présente la mort comme l’issue de l’incendie.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste concise, tout en évitant le tour littéral peu naturel « brûla le palais sur lui-même ». La répétition hébraïque de « maison du roi » est légèrement allégée en français après « palais royal », sans effacer l’identité du bâtiment.
