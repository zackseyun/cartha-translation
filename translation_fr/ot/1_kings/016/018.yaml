  source_fidelity: 'Le sens narratif est bien rendu : Zimri constate la prise de la ville, se rend dans la structure royale fortifiée, y met le feu et meurt. Cependant, « autour de lui » interprète la préposition עָלָיו de manière un peu plus spatiale que nécessaire. La formulation « où il se trouvait » rend naturellement en français le fait essentiel qu''il incendie le palais sur lui-même, sans suggérer un effondrement ni préciser le mécanisme de sa mort.'
  naturalness: « La citadelle du palais royal » est compréhensible et convient au registre narratif. « Incendia le palais autour de lui » est également idiomatique, mais « mit le feu au palais royal où il se trouvait » est plus direct et moins susceptible d'être compris comme une simple description des flammes environnantes.
  terminology: « Citadelle » préserve utilement la distinction entre אַרְמוֹן et « palais royal » pour בֵּית מֶלֶךְ. La note b doit éviter une pseudo-citation française littérale ambiguë (« brûla sur lui le palais ») et ne devrait pas affirmer plus que le texte ; elle peut expliquer la construction hébraïque sans imposer une lecture détaillée du déroulement physique.
