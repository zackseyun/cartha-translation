  - severity: low
    issue: « Autour de lui » est une explicitation spatiale légèrement plus interprétative de עָלָיו.
    rationale: Une formulation indiquant qu'il incendia le palais où il se trouvait transmet naturellement en français l'effet réflexif de l'action tout en laissant ouverte la représentation matérielle exacte.
