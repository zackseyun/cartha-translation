revisions:
- from: La parole de Yahweh fut aussi prononcée, par l’intermédiaire du prophète Jéhu, fils de Hanani, contre Baasha et contre sa maison, à cause de tout le mal qu’il avait fait aux yeux de Yahweh, l’irritant par l’œuvre de ses mains et devenant ainsi semblable à la maison de Jéroboam, et parce qu’il l’avait frappé[a].
  to: La parole de Yahweh fut aussi adressée, par l’intermédiaire du prophète Jéhu, fils de Hanani, contre Baasha et contre sa maison, à cause de tout le mal qu’il avait fait aux yeux de Yahweh, l’irritant par l’œuvre de ses mains et en devenant semblable à la maison de Jéroboam, et parce qu’il l’avait frappé[a].
  rationale: La révision remplace une formulation qui réduisait la formule prophétique à l’acte de prononcer par « fut aussi adressée », plus englobant et idiomatique. Elle retire également « ainsi », ajout interprétatif mineur. Le pronom final et sa note sont maintenus afin de ne pas résoudre l’ambiguïté du suffixe masculin singulier hébreu.
