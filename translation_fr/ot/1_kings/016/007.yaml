  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: fr
  text: La parole de Yahweh fut aussi adressée, par l’intermédiaire du prophète Jéhu, fils de Hanani, contre Baasha et contre sa maison, à cause de tout le mal qu’il avait fait aux yeux de Yahweh, l’irritant par l’œuvre de ses mains et en devenant semblable à la maison de Jéroboam, et parce qu’il l’avait frappé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom hébreu est masculin singulier. Il peut désigner Jéroboam lui-même ou, plus probablement dans ce contexte, sa maison, c’est-à-dire sa dynastie, considérée collectivement.
    reason: Ambiguïté du référent du suffixe pronominal hébreu.
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: Marque l’ajout et la continuité avec le jugement annoncé dans le contexte précédent.
- source_word: בְּיַד יֵהוּא
  choice: par l’intermédiaire de Jéhu
  rationale: Rend naturellement l’idiome hébreu exprimant l’intermédiaire ou l’agent par lequel la parole prophétique est transmise.
- source_word: דְּבַר יְהוָה הָיָה
  choice: La parole de Yahweh fut prononcée
  rationale: Conserve la formule prophétique et le nom divin, tout en donnant en français un sens naturel à la tournure hébraïque littérale « la parole… fut ».
- source_word: אֶל ... וְאֶל
  choice: contre… et contre
  rationale: Dans ce contexte de condamnation, la préposition introduit les destinataires visés par la parole de jugement.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: « Maison » conserve l’étendue du terme hébreu, qui peut désigner la famille, la maisonnée ou la dynastie.
- source_word: וְעַל כָּל הָרָעָה
  choice: à cause de tout le mal
  rationale: La préposition indique ici le motif du jugement.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Préserve l’image de la formule hébraïque d’évaluation morale, courante et compréhensible en français.
- source_word: לְהַכְעִיסוֹ
  choice: l’irritant
  rationale: Exprime la valeur causative du verbe sans alourdir la phrase.
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: par l’œuvre de ses mains
  rationale: Maintient l’image concrète de l’hébreu, sans décider si elle désigne globalement ses actes ou plus précisément des objets idolâtres.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: devenant ainsi semblable à la maison de Jéroboam
  rationale: Rend le résultat ou la manière exprimés par l’infinitif et conserve « maison » au sens potentiellement dynastique.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: et parce qu’il l’avait frappé
  rationale: Reproduit le pronom masculin singulier du texte hébreu et laisse subsister l’ambiguïté de son référent, explicitée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Référent du suffixe dans הִכָּה אֹתוֹ
  choice: pronom masculin singulier ambigu, « il l’avait frappé »
  alternative: « il avait anéanti cette maison »
  rationale: Le suffixe hébreu est masculin singulier. Il peut viser personnellement Jéroboam ou renvoyer collectivement à sa maison/dynastie; le texte principal ne tranche donc pas silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique et les images hébraïques importantes (« parole », « maison », « aux yeux », « œuvre de ses mains ») sont conservées, avec une syntaxe française fluide. Le marqueur [a] est placé après la proposition qu’il explique.
