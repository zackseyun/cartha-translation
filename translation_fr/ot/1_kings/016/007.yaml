  terminology: « Yahweh », « maison », « aux yeux de Yahweh » et « l’œuvre de ses mains » sont cohérents avec les termes importants du passage. La note conserve utilement l’ambiguïté du suffixe final sans imposer l’identification à Jéroboam ou à sa dynastie.
