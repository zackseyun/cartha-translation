base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/028.yaml
  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: fr
  text: Omri se coucha avec ses pères[a] et fut enterré à Samarie. Son fils Achab régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « se coucha avec ses pères »; formule habituelle des récits royaux pour parler de la mort.'
    reason: La formulation littérale préserve l’expression hébraïque, tandis que la note en explicite le sens conventionnel pour le lecteur moderne.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עָמְרִי עִם אֲבֹתָיו
  choice: Omri se coucha avec ses pères
  rationale: Cette traduction conserve la formule royale hébraïque récurrente désignant la mort, sans en effacer l’image ni le caractère dynastique. Le français reste compréhensible grâce à la note.
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le nifal appelle ici une tournure passive. « Fut enterré » est naturel, précis et adapté au registre narratif.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Pour un nom de ville, le français emploie naturellement « à » afin d’indiquer le lieu de l’ensevelissement.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession, « régna » rend sobrement le verbe sans ajouter explicitement une valeur inchoative.
- source_word: אַחְאָב בְּנוֹ תַּחְתָּיו
  choice: Son fils Achab régna à sa place
  rationale: L’antéposition de « Son fils » donne une phrase française fluide tout en conservant le lien dynastique; « à sa place » exprime directement la succession.
