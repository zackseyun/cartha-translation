  text: וַ/יָּבֹ֤א זִמְרִי֙ וַ/יַּכֵּ֣/הוּ וַ/יְמִיתֵ֔/הוּ בִּ/שְׁנַת֙ עֶשְׂרִ֣ים וָ/שֶׁ֔בַע לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: fr
  text: Alors Zimri entra, le frappa et le tua, la vingt-septième année du règne d’Asa, roi de Juda. Puis il régna à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Alors … entra
  rationale: Le verbe בוא peut signifier « venir » ou « entrer ». Dans le contexte immédiat de l’assassinat, « entra » exprime naturellement le mouvement sans préciser un lieu que l’hébreu ne nomme pas; « Alors » rend la progression narrative.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: וַיַּכֵּהוּ
  choice: le frappa
  rationale: נכה signifie couramment « frapper ». Cette formulation conserve la succession des deux actes exprimés en hébreu sans ajouter que le premier coup fut déjà mortel.
- source_word: וַיְמִיתֵהוּ
  choice: et le tua
  rationale: À la forme causative, מות signifie « faire mourir, tuer ». « Le tua » est direct, naturel et fidèle.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע לְאָסָא
  choice: la vingt-septième année du règne d’Asa
  rationale: Il s’agit de la formule habituelle de datation par année de règne. L’ajout explicatif « du règne » rend en français le rapport marqué par ל sans modifier le sens.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Formulation française conventionnelle et fidèle du titre royal.
- source_word: וַיִּמְלֹךְ
  choice: Puis il régna
  rationale: מלך signifie « régner » et peut, selon le contexte, marquer l’accession au trône. « Régna » conserve le choix verbal de l’hébreu; « Puis » rend clairement la suite narrative.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession royale, תחתיו indique que Zimri prend la place de l’homme tué. « À sa place » conserve cette image et son sens dynastique.
