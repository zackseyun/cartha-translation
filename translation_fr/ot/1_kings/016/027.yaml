source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes d’Omri, ce qu’il a fait et la puissance qu’il a déployée[a], tout cela n’est-il pas écrit dans le livre des Annales des rois d’Israël[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les exploits qu’il a accomplis ». Le mot hébreu גְּבוּרָה peut désigner soit la puissance, soit les actes qui la manifestent.
    reason: lexical_alternative
  - marker: b
    text: Le « livre des Annales des rois d’Israël » était une source d’archives royales; il ne s’agit pas du livre biblique des Chroniques.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: Le reste des actes d’Omri
  rationale: Dans cette formule de bilan royal, דִּבְרֵי désigne les actes ou les affaires du règne plutôt que de simples « paroles ». Le français omet un connecteur initial superflu tout en conservant la transition contextuelle.
- source_word: אֲשֶׁר עָשָׂה
  choice: ce qu’il a fait
  rationale: Rend directement la proposition relative hébraïque et conserve sa portée récapitulative.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: et la puissance qu’il a déployée
  rationale: גְּבוּרָה peut désigner la puissance elle-même ou les exploits qui la manifestent. « qu’il a déployée » exprime naturellement en français la puissance mise en œuvre, tout en maintenant le nom abstrait et la proposition relative.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: La reprise « tout cela » rend le pronom pluriel hébreu de manière idiomatique après l’énumération et conserve la question rhétorique qui appelle une réponse affirmative.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dans le livre des Annales
  rationale: Dans cette formule archivistique, עַל סֵפֶר signifie idiomatiquement « dans le livre ». דִּבְרֵי הַיָּמִים désigne des annales royales; « Annales » évite de confondre cette source avec le livre biblique des Chroniques.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: 'Le לְ exprime ici la relation ou le domaine concerné : les annales relatives aux rois d’Israël.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu. La répétition hébraïque de עָשָׂה est partiellement conservée par « ce qu’il a fait » puis rendue idiomatiquement par « qu’il a déployée ». La question rhétorique et l’ambiguïté de גְּבוּרָה sont préservées.
