source:
  edition: WLC
  text: הִנְ/נִ֥י מַבְעִ֛יר אַחֲרֵ֥י בַעְשָׁ֖א וְ/אַחֲרֵ֣י בֵית֑/וֹ וְ/נָֽתַתִּי֙ אֶת בֵּ֣יתְ/ךָ֔ כְּ/בֵ֖ית יָרָבְעָ֥ם בֶּן נְבָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: fr
  text: Voici[a], je vais faire disparaître Baasha et sa maison, et je rendrai ta maison semblable à celle de Jéroboam, fils de Nebath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Voici, je consume après Baasha et après sa maison. » Cette expression signifie que Baasha et sa lignée seront entièrement éliminés.'
    reason: Signaler l’image et la construction idiomatique de l’hébreu, tout en expliquant son sens sans présenter une construction française opaque comme une paraphrase autonome ni ajouter un titre divin absent du verset.
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Introduit avec solennité l’annonce divine et conserve la force déictique de la formule prophétique hébraïque.
- source_word: מַבְעִיר אַחֲרֵי
  choice: je vais faire disparaître
  rationale: L’expression hébraïque évoque l’action de consumer ou d’éliminer entièrement ce qui vient après quelqu’un. Cette formulation française exprime clairement l’anéantissement annoncé sans imposer le feu comme moyen littéral.
- source_word: בַעְשָׁא
  choice: Basha
  rationale: Transcription française moderne du nom hébreu.
- source_word: בֵיתוֹ / בֵיתְךָ
  choice: sa maison / ta maison
  rationale: Le mot « maison » conserve l’image hébraïque tout en portant ici le sens de maisonnée et de lignée dynastique.
- source_word: וְנָתַתִּי
  choice: je rendrai
  rationale: Dans cette construction comparative, le verbe נתן signifie faire devenir ou rendre semblable.
- source_word: כְּבֵית
  choice: semblable à celle de
  rationale: Rend naturellement la comparaison en français tout en évitant la répétition lourde de « maison ».
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Forme française usuelle du nom et tournure moderne pour le patronyme.
theological_decisions:
- issue: Nature du jugement contre la lignée de Basha
  choice: Exprimer la disparition complète de Basha et de sa maison sans préciser que le feu en serait le moyen littéral.
  alternative: 'Traduire plus littéralement : « je vais consumer après Basha et après sa maison ».'
  rationale: L’idiome annonce un jugement divin total contre la maison royale. Une traduction strictement littérale serait obscure en français et pourrait faire croire que le texte précise le procédé matériel du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. « Maison » est maintenu pour préserver l’image biblique et sa portée familiale et dynastique.
