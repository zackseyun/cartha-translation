id: 1KI.16.25
reference: 1 Kings 16:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: fr
  text: Omri fit ce qui est mal aux yeux de Yahweh et agit plus mal que tous ceux qui l’avaient précédé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et il fut pire que tous ceux qui l’avaient précédé ». Le verbe hébreu peut décrire Omri lui-même ou sa conduite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: fit
  rationale: Avec הָרַע comme complément, עשה désigne idiomatiquement le fait de commettre ou de pratiquer ce qui est mal; « fit » conserve simplement la formule hébraïque.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’adjectif avec article est substantivé dans la formule « faire le mal »; « ce qui est mal » est naturel en français et exprime l’évaluation morale.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression française préserve l’image et le point de vue évaluatif de l’idiome hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וַיָּרַע
  choice: agit plus mal
  rationale: Le hiphil de רעע, suivi de la comparaison, peut porter sur la conduite d’Omri; cette formulation garde la continuité avec ses actes sans faire de l’homme lui-même l’unique objet du jugement.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: que tous ceux qui l’avaient précédé
  rationale: La formulation respecte l’absence du mot « rois » dans ce verset tout en rendant clairement la comparaison avec les prédécesseurs d’Omri.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de וַיָּרַע
  choice: agit plus mal
  alternative: fut pire
  rationale: Le verbe peut qualifier Omri lui-même ou sa conduite. Le texte principal retient le sens évaluatif courant dans le contexte narratif, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et digne. La formule « aux yeux de » conserve l’image hébraïque; le plus-que-parfait situe naturellement les prédécesseurs par rapport au règne d’Omri.
