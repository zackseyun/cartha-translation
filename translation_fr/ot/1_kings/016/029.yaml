  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: fr
  text: Achab, fils d’Omri, devint roi d’Israël la trente-huitième année du règne d’Asa, roi de Juda. Achab, fils d’Omri, régna vingt-deux ans sur Israël, à Samarie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule royale, le verbe marque l’accession d’Achab à la royauté; « devint roi » la distingue de l’indication ultérieure sur la durée de son règne.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: la trente-huitième année du règne
  rationale: Cette formulation française naturelle rend la valeur ordinale de la date et explicite que l’année est comptée dans le règne d’Asa.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: d’Asa, roi de Juda
  rationale: Le complément indique le règne servant de repère chronologique; l’apposition conserve le titre royal de manière claire.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Le verbe introduit ici la durée totale du règne, et non le seul moment de l’accession.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: « À Samarie » est l’expression française idiomatique pour le lieu depuis lequel le roi gouvernait.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: vingt-deux ans
  rationale: Rendu français direct et usuel d’une durée de règne.
- source_word: וְ
  choice: enchaînement sans « et » initial
  rationale: En français moderne, le lien narratif avec la séquence précédente reste perceptible sans conjonction initiale; cela évite une tournure artificielle tout en conservant la continuité.
theological_decisions: []
translation_notes:
  register: 'Style narratif sobre, actuel et digne. La répétition du nom complet d’Achab est conservée comme dans l’hébreu. Deux phrases rendent plus clairement les deux volets de la formule royale : accession, puis lieu et durée du règne.'
