  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וָ/שֵׁשׁ֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ אֵלָ֨ה בֶן בַּעְשָׁ֧א עַל יִשְׂרָאֵ֛ל בְּ/תִרְצָ֖ה שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: fr
  text: La vingt-sixième année du règne d’Asa, roi de Juda, Éla, fils de Baasha, devint roi d’Israël à Tirtsa. Il régna deux ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה לְאָסָא מֶלֶךְ יְהוּדָה
  choice: La vingt-sixième année du règne d’Asa, roi de Juda
  rationale: Cette formulation française naturelle restitue la formule hébraïque de datation par année de règne. L’ajout explicatif « du règne » exprime la fonction du ל sans modifier le sens.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette notice d’accession, le verbe désigne l’entrée d’Éla dans la royauté plutôt que la totalité de son règne.
- source_word: אֵלָה בֶן בַּעְשָׁא
  choice: Éla, fils de Baasha
  rationale: Les noms propres sont translittérés, et la construction filiale hébraïque est rendue selon l’usage français courant.
- source_word: עַל יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Avec le verbe « devenir roi », le français exprime naturellement le domaine gouverné par « roi d’Israël »; cela conserve la portée de עַל sans alourdir la phrase.
- source_word: בְּתִרְצָה
  choice: à Tirtsa
  rationale: La préposition ב indique ici le lieu où se trouvait le siège du règne; « à » est la préposition française idiomatique devant un nom de ville.
- source_word: שְׁנָתָיִם
  choice: Il régna deux ans
  rationale: Le duel hébreu signifie « deux ans ». Une seconde phrase évite l’ambiguïté française selon laquelle Éla aurait seulement mis deux ans à devenir roi, tout en reliant clairement la durée à son règne.
