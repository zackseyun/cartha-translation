source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh fut adressée à Jéhu, fils de Hanani, contre Baésha[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet de Baésha ». La préposition hébraïque peut avoir un sens plus large, mais elle introduit ici un oracle de jugement; c’est pourquoi « contre » a été retenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors ... fut adressée
  rationale: Le wayyiqtol introduit une nouvelle étape du récit. « Alors » marque naturellement la progression, tandis que la tournure française « la parole fut adressée » rend idiomatiquement la venue de la parole divine.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette formule prophétique traditionnelle conserve la portée formelle et théologique de דָּבָר sans l'expliciter par « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de la parole divine; « à » est son équivalent français naturel.
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: Jéhu, fils de Hanani
  rationale: Les formes françaises usuelles des noms sont retenues; les virgules rendent naturellement l'apposition « fils de Hanani ».
- source_word: עַל
  choice: contre
  rationale: Dans ce contexte d'annonce prophétique de jugement, « contre » exprime la force hostile ou judiciaire de la préposition, tout en laissant « au sujet de » comme possibilité lexicale en note.
- source_word: בַּעְשָׁא
  choice: Baésha
  rationale: Forme française biblique usuelle du nom propre hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Puisque les paroles commencent au verset suivant, les deux-points introduisent leur contenu de façon plus naturelle en français que le calque « en disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur de עַל dans la formule prophétique
  choice: contre Baésha
  alternative: au sujet de Baésha
  rationale: L'oracle introduit est une dénonciation; « contre » en conserve la portée judiciaire sans ajouter le contenu du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique reste reconnaissable, mais « fut adressée » et les deux-points évitent des calques hébraïques peu naturels. Le nom divin est translittéré « Yahweh » conformément au texte source.
