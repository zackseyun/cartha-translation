base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: fr
  text: Or, lorsqu’il devint roi, dès qu’il fut assis sur son trône, il tua tous ceux de la maison de Baasha. Il ne lui laissa aucun homme[a], ni aucun de ses proches parents[b], ni aucun de ses amis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quelqu’un qui urine contre un mur » ; expression crue désignant un individu de sexe masculin.'
    reason: lexical_alternative
  - marker: b
    text: Ou « ses vengeurs » ou « ses rédempteurs » ; le terme hébreu désigne un proche parent investi d’obligations familiales.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Or
  rationale: Introduit la suite du récit sans recourir à la tournure archaïque « il advint que ».
- source_word: בְמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: Dans ce contexte, la construction temporelle vise l’accession au trône plutôt que l’ensemble du règne.
- source_word: כְשִׁבְתּוֹ עַל כִּסְאוֹ
  choice: dès qu’il se fut assis sur son trône
  rationale: « Dès que » rend l’enchaînement immédiat, et le plus-que-parfait marque naturellement l’antériorité en français.
- source_word: הִכָּה
  choice: il frappa
  rationale: Le verbe נכה désigne ici une attaque mortelle. « Frapper » conserve la formulation hébraïque, le contexte indiquant qu’il s’agit d’une mise à mort.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: toute la maison de Baasha
  rationale: « Maison » garde le sens dynastique et familial du terme hébreu, fréquent dans les livres des Rois.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: Il ne lui laissa aucun
  rationale: La formulation conserve le pronom datif hébreu et exprime l’extermination de la lignée de Baasha.
- source_word: מַשְׁתִּין בְּקִיר
  choice: homme
  rationale: L’expression hébraïque, volontairement crue, désigne un individu de sexe masculin. Le texte principal en donne le sens, tandis que la note conserve l’image littérale.
- source_word: וְגֹאֲלָיו
  choice: ses proches parents
  rationale: Le גֹּאֵל est un parent tenu à certaines obligations familiales, notamment racheter ou venger. « Proches parents » préserve ici le lien familial sans imposer une fonction précise.
- source_word: וְרֵעֵהוּ
  choice: ses amis
  rationale: רֵעַ peut désigner un ami, un compagnon ou un associé. « Amis » est clair et naturel, tout en convenant au réseau personnel de Baasha.
