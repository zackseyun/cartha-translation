  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: fr
  text: à cause de tous les péchés de Baasha et de ceux de son fils Éla, péchés qu’ils avaient commis et par lesquels ils avaient entraîné Israël dans le péché, provoquant ainsi la colère de Yahweh, le Dieu d’Israël, par leurs idoles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs vanités » ou « leurs choses sans valeur » ; expression polémique couramment employée pour parler des idoles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: à cause de
  rationale: Dans cette formule de jugement, la préposition introduit le motif de l’action mentionnée au verset précédent. « À cause de » exprime clairement cette valeur causale.
- source_word: כָּל חַטֹּאות
  choice: tous les péchés
  rationale: Cette traduction directe conserve à la fois le sens de חַטֹּאות et la portée globale de כָּל.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Translittération moderne du nom propre hébreu.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  choice: et de ceux de son fils Éla
  rationale: La reprise pronominale évite une répétition lourde de « péchés » tout en indiquant clairement qu’Éla est le fils de Baasha.
- source_word: אֲשֶׁר חָטְאוּ
  choice: péchés qu’ils avaient commis
  rationale: Le français idiomatique dit « commettre des péchés ». La reprise explicite de « péchés » clarifie l’antécédent du relatif.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: et par lesquels ils avaient entraîné Israël dans le péché
  rationale: La forme causative de חטא signifie qu’ils ont amené Israël à pécher. « Entraîner dans le péché » restitue naturellement cette causalité sans supprimer le lien avec leurs propres péchés.
- source_word: לְהַכְעִיס
  choice: irritant ainsi
  rationale: Le participe français relie naturellement l’irritation de Yahweh aux actes précédents. « Ainsi » rend leur effet sans trancher trop fortement entre but et résultat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction naturelle et exacte de la construction hébraïque.
- source_word: בְּהַבְלֵיהֶם
  choice: par leurs idoles
  rationale: הֶבֶל désigne littéralement ce qui est vapeur, vain ou sans valeur. Dans ce contexte polémique lié au culte, le pluriel renvoie aux idoles; la nuance littérale est conservée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel du Dieu d’Israël au lieu de lui substituer un titre.
- issue: Sens de בְּהַבְלֵיהֶם dans le contexte du culte idolâtre
  choice: leurs idoles
  alternative: leurs vanités / leurs choses sans valeur
  rationale: Le terme qualifie polémiquement les objets de culte comme vains et sans valeur. Le texte principal explicite le référent, tandis que la note préserve l’image et l’évaluation contenues dans l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure causale du verset est conservée, ainsi que la responsabilité conjointe de Baasha et d’Éla. Le marqueur de note est placé après « idoles », terme auquel la note se rapporte.
