base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: fr
  text: Comme si c’était peu de chose pour lui de suivre les péchés de Jéroboam, fils de Nebath[a], il prit pour femme Jézabel, fille d’Ethbaal, roi des Sidoniens, puis il alla servir Baal et se prosterna devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Était-ce peu de chose pour lui de suivre les péchés de Jéroboam, fils de Nebath… ? » L’ouverture hébraïque est idiomatique et souligne qu’Achab tenait ces péchés pour insignifiants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: Comme s’il avait été peu de chose
  rationale: 'Cette tournure française rend l’idiome hébreu et sa force rhétorique : Achab traite les péchés de Jéroboam comme insignifiants avant d’aller plus loin. Une note conserve la possibilité d’une question rhétorique.'
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: de suivre les péchés
  rationale: Dans ce contexte, הלך avec ב décrit une conduite habituelle. « Suivre les péchés » est naturel en français moderne tout en conservant l’idée d’adopter une voie de conduite.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: il prit pour femme Jézabel
  rationale: Rend directement la construction hébraïque « prendre pour femme » dans un français digne et intelligible.
- source_word: אֶתְבַּעַל
  choice: Ethbaal
  rationale: Translittération française courante du nom royal phénicien, sans traduire le nom propre.
- source_word: צִידֹנִים
  choice: les Sidoniens
  rationale: Reproduit le gentilé pluriel hébreu et le titre « roi des Sidoniens ».
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: servir Baal
  rationale: Le verbe עבד exprime ici le service cultuel. « Servir » maintient la distinction avec la prosternation exprimée par le verbe suivant.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: se prosterna devant lui
  rationale: Rend précisément le geste corporel d’abaissement sans le réduire au terme plus général « adorer ».
theological_decisions:
- issue: Rapport entre les péchés de Jéroboam et le culte de Baal pratiqué par Achab
  choice: 'La formulation fait ressortir une aggravation : Achab traite les péchés de Jéroboam comme peu de chose, puis s’engage dans le service de Baal.'
  alternative: 'Lire l’ouverture uniquement comme une question rhétorique : « Était-ce peu de chose pour lui de suivre les péchés de Jéroboam… ? »'
  rationale: L’idiome hébreu et la progression narrative soutiennent cette aggravation, mais la note préserve l’ambiguïté syntaxique entre comparaison et question rhétorique.
translation_notes:
  register: Français international moderne, clair et digne. « Suivre les péchés » évite le calque moins naturel « marcher dans les péchés ». Les noms suivent des formes françaises bibliques usuelles, et la succession « servir… se prosterner » conserve les deux gestes cultuels distincts de l’hébreu.
