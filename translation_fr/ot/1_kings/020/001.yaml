  text: וּ/בֶן הֲדַ֣ד מֶֽלֶךְ אֲרָ֗ם קָבַץ֙ אֶת כָּל חֵיל֔/וֹ וּ/שְׁלֹשִׁ֨ים וּ/שְׁנַ֥יִם מֶ֛לֶךְ אִתּ֖/וֹ וְ/ס֣וּס וָ/רָ֑כֶב וַ/יַּ֗עַל וַ/יָּ֨צַר֙ עַל שֹׁ֣מְר֔וֹן וַ/יִּלָּ֖חֶם בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: fr
  text: Ben-Hadad, roi d’Aram, rassembla toute son armée. Trente-deux rois l’accompagnaient, ainsi que des chevaux et des chars. Puis il monta, assiégea Samarie et combattit contre elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֶן הֲדַד
  choice: Ben-Hadad
  rationale: Le nom propre est translittéré directement. Le waw initial assure la continuité narrative, mais n’exige pas nécessairement un « et » en tête de cette unité en français.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: « Aram » reproduit le nom géographique hébreu plutôt que l’appellation traditionnelle « Syrie ».
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: rassembla toute son armée
  rationale: קבץ signifie rassembler, et חַיִל désigne ici collectivement les forces militaires.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: Trente-deux rois l’accompagnaient
  rationale: Cette formulation naturelle exprime fidèlement la présence des trente-deux rois avec Ben-Hadad, sans reproduire une coordination hébraïque maladroite en français.
- source_word: וְסוּס וָרָכֶב
  choice: ainsi que des chevaux et des chars
  rationale: Les singuliers hébreux ont ici une valeur collective; le pluriel est naturel en français et conserve l’image concrète.
- source_word: וַיַּעַל
  choice: Puis il monta
  rationale: עלה exprime une montée ou une progression vers le haut; « monta » conserve ce mouvement, tandis que « Puis » rend la succession narrative.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: assiégea Samarie
  rationale: צור על est l’expression militaire usuelle pour mettre une ville en état de siège.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: et l’attaqua
  rationale: Dans ce contexte de siège, לחם ב signifie engager le combat contre la ville. « L’attaqua » est idiomatique et ne suppose pas sa prise.
