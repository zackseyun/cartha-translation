base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: fr
  text: Toi, reconstitue une armée semblable à celle que tu as perdue, cheval pour cheval et char pour char. Puis combattons-les dans la plaine. Nous serons certainement plus forts qu’eux. » Il les écouta et fit ainsi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: reconstitue une armée
  rationale: Le verbe מנה signifie compter, recenser ou affecter. Dans ce contexte, il s’agit de lever de nouveau une force équivalente à celle qui a été perdue; « reconstitue » exprime naturellement cette opération militaire en français.
- source_word: הַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: celle que tu as perdue
  rationale: Littéralement, « l’armée qui est tombée loin de toi / de ton côté ». La formulation française traduit idiomatiquement la destruction de l’armée du roi sans suggérer qu’il l’aurait volontairement abandonnée.
- source_word: סוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: cheval pour cheval et char pour char
  rationale: Conserve la construction distributive et l’idée d’un remplacement à effectif égal.
- source_word: בַּמִּישׁוֹר
  choice: dans la plaine
  rationale: מִישׁוֹר désigne ici le terrain plat opposé aux montagnes mentionnées dans le contexte.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: Nous serons certainement plus forts qu’eux
  rationale: La tournure hébraïque אִם לֹא sert ici de formule emphatique de certitude, et non de véritable condition.
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: Il les écouta
  rationale: Équivalent français naturel de l’expression idiomatique « écouter leur voix », avec le sens de suivre leur conseil.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. L’impératif « reconstitue » convient à un conseil stratégique adressé au roi et évite le calque peu naturel « compte pour toi ». La transition « Puis » rend clairement la succession du réarmement et du combat.
