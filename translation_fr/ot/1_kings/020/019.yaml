  text: וְ/אֵ֨לֶּה֙ יָצְא֣וּ מִן הָ/עִ֔יר נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וְ/הַ/חַ֖יִל אֲשֶׁ֥ר אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/019.yaml
  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: fr
  text: 'Ceux-ci sortirent de la ville : les jeunes gens des chefs des provinces[a], et l’armée qui venait derrière eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les serviteurs » ou « les auxiliaires des chefs des provinces ». Le mot hébreu peut désigner de jeunes hommes, des serviteurs ou des auxiliaires ; les deux idées peuvent se recouper ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici ceux qui
  rationale: Le démonstratif pluriel renvoie au groupe dénombré au verset précédent. « Voici ceux qui » introduit naturellement en français la désignation de ceux qui sortirent.
- source_word: יָצְאוּ מִן־הָעִיר
  choice: sortirent de la ville
  rationale: Rend directement le verbe de sortie et le point de départ, sans ajouter l’idée plus précise d’une marche militaire.
- source_word: נַעֲרֵי
  choice: les jeunes gens attachés aux
  rationale: נַעַר peut désigner de jeunes hommes, des serviteurs ou des assistants. « Jeunes gens attachés aux » conserve l’idée de jeunesse tout en indiquant leur relation fonctionnelle avec les chefs; l’autre valeur est signalée en note.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: chefs des provinces
  rationale: שַׂר désigne un chef ou responsable, tandis que מְדִינוֹת renvoie à des circonscriptions administratives. La construction française suit clairement la relation génitivale de l’hébreu sans imposer un grade militaire précis.
- source_word: וְהַחַיִל
  choice: et l’armée
  rationale: Dans ce contexte de combat, חַיִל désigne la force militaire qui accompagne le premier groupe.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: qui venait derrière eux
  rationale: Préserve l’image spatiale et l’ordre de progression exprimés par אַחֲרֵיהֶם, dans une formulation française naturelle.
