base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: fr
  text: Chacun frappa l’homme qui lui faisait face[a]. Les Araméens s’enfuirent, et les Israélites les poursuivirent. Mais Ben-Hadad, roi d’Aram, parvint à s’échapper à cheval, avec des cavaliers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun frappa son homme ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « parvint à s’échapper sur un cheval et avec des cavaliers ». L’hébreu présente Ben-Hadad monté et accompagné de cavaliers, mais la relation exacte entre les deux éléments reste concise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: frappa
  rationale: Dans ce contexte de combat, נכה indique un coup qui met l’adversaire hors de combat. « Frapper » préserve toutefois l’indétermination du texte quant à sa mort, contrairement à « tuer ».
- source_word: אִישׁ אִישׁוֹ
  choice: chacun… l’homme qui lui faisait face
  rationale: L’expression littérale « chacun son homme » désigne ici l’adversaire auquel chaque combattant était opposé. Cette formulation naturelle explicite l’idiome sans ajouter l’idée certaine de mise à mort.
- source_word: אֲרָם
  choice: les Araméens
  rationale: Bien que le nom propre soit littéralement « Aram », le verbe au pluriel montre qu’il désigne ici les forces araméennes; « les Araméens » est donc idiomatique et précis en français.
- source_word: וַיָּנֻסוּ
  choice: s’enfuirent
  rationale: Le verbe נוס décrit une fuite devant l’ennemi, et non un simple repli organisé.
- source_word: וַיִּרְדְּפֵם
  choice: les poursuivirent
  rationale: רדף est le terme courant pour poursuivre un ennemi en fuite.
- source_word: יִשְׂרָאֵל
  choice: les Israélites
  rationale: Le singulier collectif « Israël » désigne ici les combattants qui poursuivent les Araméens; le gentilé pluriel est naturel en français.
- source_word: וַיִּמָּלֵט
  choice: parvint à s’échapper
  rationale: Le verbe exprime le fait d’échapper au danger. « Parvint à » rend naturellement en français l’issue réussie, sans introduire une intervention divine explicite.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Translittération française usuelle du nom propre, avec trait d’union.
- source_word: עַל סוּס
  choice: à cheval
  rationale: Littéralement « sur un cheval »; l’expression française idiomatique « à cheval » conserve le sens du singulier sans lourdeur.
- source_word: וּפָרָשִׁים
  choice: avec des cavaliers
  rationale: פָרָשִׁים désigne des hommes montés. Le waw peut ici être compris comme associant les cavaliers à Ben-Hadad pendant sa fuite.
theological_decisions: []
