base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: fr
  text: 'Les messagers revinrent et dirent : « Voici ce que dit Ben-Hadad : Bien que je t’aie envoyé dire[a] : “Tu me donneras ton argent, ton or, tes épouses et tes fils”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car je t’ai envoyé dire… » La particule hébraïque traduite par « bien que » peut prendre plusieurs sens. Le sens concessif retenu ici introduit l’aggravation de la menace au verset suivant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: Les messagers revinrent
  rationale: Dans ce contexte diplomatique, מַלְאָכִים désigne des envoyés humains. « Messagers » reste large et exact, tandis que « revinrent » rend la progression narrative et le sens de שוב.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française naturelle et digne rend la formule officielle du messager sans l’archaïsme de « Ainsi parle ».
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Le nom propre est translittéré selon sa forme française conventionnelle.
- source_word: כִּי
  choice: Bien que
  rationale: 'La particule est comprise ici dans un sens concessif : la demande antérieure est rappelée avant l’escalade formulée au verset suivant. L’ambiguïté lexicale est signalée en note.'
- source_word: שָׁלַחְתִּי אֵלֶיךָ לֵאמֹר
  choice: je t’aie envoyé dire
  rationale: Cette tournure idiomatique française exprime l’envoi antérieur du message sans ajouter d’élément de sens substantiel.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: ton argent, ton or
  rationale: « Argent » peut désigner le métal comme les richesses et forme en français le couple naturel « argent et or ».
- source_word: וְנָשֶׁיךָ
  choice: tes épouses
  rationale: Dans ce contexte, נָשִׁים désigne les femmes d’Achab au sens conjugal. « Épouses » évite l’ambiguïté moderne de « tes femmes ».
- source_word: וּבָנֶיךָ
  choice: tes fils
  rationale: בָּנִים désigne ici les fils et non, de manière générique, les enfants.
- source_word: לִי תִתֵּן
  choice: Tu me donneras
  rationale: Le futur français exprime ici l’ordre impérieux ou l’obligation imposée, tout en restant proche de la forme hébraïque.
