source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: fr
  text: 'L’homme de Dieu s’approcha et dit au roi d’Israël : « Voici ce que dit Yahweh : Parce que les Araméens[a] ont dit : “Yahweh est un dieu des montagnes, mais il n’est pas un dieu des vallées[b]”, je livrerai toute cette immense multitude entre tes mains, et vous saurez[c] que je suis Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Aram » avec un verbe au pluriel, désignant collectivement les Araméens. Certaines traductions traditionnelles emploient « les Syriens ».
    reason: Précision sur le nom du peuple et sur l’accord collectif.
  - marker: b
    text: 'On peut aussi traduire : « le dieu des hauteurs […] le dieu des plaines ». L’hébreu oppose les terrains élevés aux régions basses ou aux vallées.'
    reason: Le vocabulaire topographique permet plusieurs équivalents selon le relief envisagé.
  - marker: c
    text: « Vous saurez » est au pluriel en hébreu, alors que « tes mains » s’adresse au roi au singulier.
    reason: Le français doit rendre visible le changement de nombre présent dans le texte source.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: L’expression est définie et désigne ici un personnage prophétique déjà identifié dans le récit.
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Le verbe exprime simplement le fait de venir près ou de s’avancer, sans préciser davantage la manière.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle et digne rend naturellement la formule hébraïque du messager prophétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֲרָם
  choice: les Araméens
  rationale: Le nom collectif Aram est construit avec un verbe au pluriel; en français, « les Araméens » exprime naturellement le peuple visé.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: un dieu des montagnes, mais il n’est pas un dieu des vallées
  rationale: L’article indéfini restitue la conception araméenne de Yahweh comme divinité locale parmi d’autres; « montagnes » et « vallées » rendent directement le contraste topographique.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: toute cette grande multitude
  rationale: הָמוֹן désigne une masse nombreuse ou une multitude; le contexte est militaire, mais le terme hébreu n’est pas limité au sens technique d’« armée ».
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Cette expression conserve l’image de l’idiome hébreu tout en signifiant clairement que l’ennemi sera livré au pouvoir du roi.
- source_word: וִידַעְתֶּם
  choice: vous saurez
  rationale: Le verbe hébreu est à la deuxième personne du masculin pluriel, bien que la parole soit adressée au roi au singulier dans le contexte immédiat.
- source_word: כִּי אֲנִי יְהוָה
  choice: que je suis Yahweh
  rationale: La formulation conserve sans ajout la déclaration d’identité divine du texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin; sa translittération préserve la distinction entre un nom propre et un titre.
- issue: Portée de l’affirmation araméenne sur Dieu
  choice: « un dieu des montagnes » et non « un dieu des vallées »
  alternative: « le Dieu des montagnes » et non « le Dieu des vallées »
  rationale: L’indéfini fait entendre que les Araméens considèrent Yahweh comme une divinité territoriale parmi d’autres, sans approuver leur conception.
- issue: Nombre du destinataire dans וִידַעְתֶּם
  choice: pluriel « vous saurez »
  alternative: singulier « tu sauras » harmonisé avec l’adresse au roi
  rationale: Le passage du singulier « tes mains » au pluriel du verbe est réel dans l’hébreu. Le conserver laisse entendre que la connaissance résultant de la victoire s’étend au-delà du seul roi, sans effacer la tension grammaticale.
translation_notes:
  register: Français international moderne, naturel et digne. La formule prophétique reste solennelle sans archaïsme. Le tutoiement singulier adressé au roi (« tes mains ») est suivi du pluriel (« vous saurez ») afin de préserver le changement grammatical de l’hébreu; la note évite que ce contraste soit pris pour une incohérence.
