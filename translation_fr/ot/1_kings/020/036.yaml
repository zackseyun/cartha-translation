base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: fr
  text: 'Alors il lui dit : « Puisque tu n’as pas écouté la voix du SEIGNEUR, voici : dès que tu me quitteras, le lion te frappera. » L’homme le quitta, et le lion le trouva et le frappa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: tu n’as pas écouté la voix
  rationale: Conserve l’expression hébraïque, qui implique ici l’obéissance, tout en restant naturelle et intelligible en français.
- source_word: הִנְּךָ הוֹלֵךְ מֵאִתִּי
  choice: dès que tu m’auras quitté
  rationale: Rend la valeur imminente et circonstancielle de la formule hébraïque plus naturellement que le littéral « te voici allant d’auprès de moi ».
- source_word: הִכְּךָ / וַיַּכֵּהוּ
  choice: te frappera / le frappa
  rationale: Maintient la répétition du même verbe hébreu sans préciser au-delà du texte la nature ou l’issue du coup.
- source_word: וַיִּמְצָאֵהוּ
  choice: le rencontra
  rationale: Dans ce récit, « rencontrer » exprime naturellement le fait que le lion tombe sur l’homme, sans suggérer nécessairement une recherche préalable.
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: le SEIGNEUR
  alternative: Yahvé
  rationale: Suit la convention française largement reconnue des petites capitales, sans introduire une vocalisation dans le corps du texte.
- issue: Issue de l’attaque du lion
  choice: le frappa
  alternative: le tua
  rationale: Le verset emploie le verbe « frapper » et ne dit pas explicitement ici « tuer » ; la traduction préserve donc la formulation et sa possible tension narrative.
translation_notes:
  register: Français moderne, sobre et narratif. La répétition « frappera / frappa » reproduit l’accomplissement exact de la parole annoncée. « L’homme » explicite le sujet pour éviter l’ambiguïté de deux pronoms masculins successifs, sans ajouter d’information substantielle.
