base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: fr
  text: 'Ils attachèrent donc des toiles de sac autour de leur taille et mirent des cordes sur leur tête. Ils vinrent trouver le roi d’Israël et dirent : « Ton serviteur Ben-Hadad dit : “Je t’en prie, laisse-moi vivre[a].” » Il répondit : « Est-il encore vivant ? C’est mon frère[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que ma vie vive, je t’en prie. » Autre traduction possible : « Épargne ma vie, je t’en prie. »'
    reason: lexical_alternative
  - marker: b
    text: Ici, « mon frère » exprime probablement une fraternité politique ou liée à une alliance, et non un lien familial littéral.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ שַׂקִּים בְּמָתְנֵיהֶם
  choice: ils attachèrent des sacs autour de leur taille
  rationale: חגר exprime l’action d’attacher ou de ceindre. Le pluriel שַׂקִּים est conservé par « sacs », tandis que « autour de leur taille » rend מָתְנַיִם en français moderne.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: et mirent des cordes sur leur tête
  rationale: « Cordes » rend concrètement חֲבָלִים. La préposition ב est traduite sans préciser davantage la disposition exacte des cordes.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans ce discours diplomatique adressé à un roi, עבד est une formule d’abaissement conventionnelle ; « serviteur » convient mieux que « esclave » au premier plan du contexte.
- source_word: בֶן הֲדַד
  choice: Ben-Hadad
  rationale: Translittération française usuelle du nom propre.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: Je t’en prie, laisse-moi vivre
  rationale: Littéralement, « que ma vie vive, je te prie ». La formulation retenue transmet naturellement la demande de préserver la vie du locuteur.
- source_word: הַעוֹדֶנּוּ חַי
  choice: Est-il encore vivant ?
  rationale: La question demande si Ben-Hadad demeure en vie ; « encore vivant » est idiomatique en français contemporain.
- source_word: אָחִי הוּא
  choice: C’est mon frère !
  rationale: La traduction conserve le terme direct de parenté et son effet rhétorique, sans le réduire explicitement à une alliance politique.
theological_decisions:
- issue: Sens de « frère » dans la réponse du roi
  choice: Conserver littéralement « C’est mon frère ! »
  alternative: « C’est mon allié » ou « Il est comme un frère pour moi »
  rationale: Le mot hébreu אָחִי est le terme ordinaire pour « mon frère ». Le contexte peut évoquer une fraternité politique ou conventionnelle plutôt qu’un lien familial, mais le texte ne l’explicite pas ; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve le tutoiement attendu dans l’adresse royale ancienne. « Sacs » respecte le pluriel concret du texte hébreu ; l’expression désigne des vêtements ou pièces d’étoffe grossière portés en signe d’humiliation. Les deux appels de note figurent dans le texte principal.
