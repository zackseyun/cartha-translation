    issue: « des sacs autour de leur taille »
    rationale: En français contemporain, « sacs » évoque normalement des récipients. Le terme hébreu désigne ici une étoffe grossière ou des pièces de cette étoffe portées en signe d’humiliation. « Des toiles de sac » est plus fidèle et plus naturel.
  - severity: low
    issue: « Le roi demanda » et point d’exclamation final
    rationale: Le texte hébreu dit simplement « il dit » après la question et ne marque pas d’exclamation. « Il répondit » conserve mieux la sobriété narrative, et le point final évite d’accentuer rhétoriquement la réplique.
