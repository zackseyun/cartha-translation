  to: 'Ils attachèrent donc des toiles de sac autour de leur taille et mirent des cordes sur leur tête. Ils vinrent trouver le roi d’Israël et dirent : « Ton serviteur Ben-Hadad dit : “Je t’en prie, laisse-moi vivre[a].” » Il répondit : « Est-il encore vivant ? C’est mon frère[b]. »'
