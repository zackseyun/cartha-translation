base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: fr
  text: 'Lorsqu’il entendit ce message[a], il était en train de boire avec les rois dans les abris[b]. Il dit à ses serviteurs : « Prenez position ! »[c] Et ils prirent position contre la ville.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cette parole » ; ou : « cette affaire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans les huttes » ; traditionnellement : « dans les pavillons ».'
    reason: lexical_alternative
  - marker: c
    text: Le commandement hébreu signifie littéralement « Placez ! » C’est probablement un ordre militaire bref demandant aux hommes de prendre position contre la ville.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: ce message
  rationale: דָּבָר peut désigner une parole, une affaire ou un message. Ici, Ben-Hadad réagit à la réponse qui vient de lui être transmise ; « ce message » est donc naturel en français tout en préservant le sens contextuel.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: il était en train de boire avec les rois
  rationale: Le participe exprime une action en cours. Cette formulation française restitue naturellement la tournure hébraïque « il buvait, lui et les rois » sans modifier la scène.
- source_word: בַּסֻּכּוֹת
  choice: sous les abris
  rationale: סֻכּוֹת désigne des abris ou constructions temporaires. « Sous les abris » reste concret et compréhensible, sans introduire l’idée plus précise de tentes.
- source_word: שִׂימוּ
  choice: Prenez position !
  rationale: L’impératif signifie littéralement « Placez ! » ou « Mettez ! », mais il est elliptique. Dans ce contexte militaire, « Prenez position ! » rend sa brièveté et sa fonction sans ajouter de détails sur les préparatifs.
- source_word: וַיָּשִׂימוּ עַל־הָעִיר
  choice: ils prirent position contre la ville
  rationale: La construction elliptique avec עַל exprime ici un déploiement hostile contre la ville. La traduction reprend le commandement précédent et conserve la concision du récit.
