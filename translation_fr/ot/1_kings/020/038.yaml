  text: וַ/יֵּ֨לֶךְ֙ הַ/נָּבִ֔יא וַ/יַּעֲמֹ֥ד לַ/מֶּ֖לֶךְ עַל הַ/דָּ֑רֶךְ וַ/יִּתְחַפֵּ֥שׂ בָּ/אֲפֵ֖ר עַל עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/038.yaml
  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: fr
  text: Le prophète partit et se tint sur le chemin, en attendant le roi. Il se déguisa avec de la cendre sur les yeux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « avec la cendre sur ses yeux ». Le mot rendu par « cendre » peut, selon certains, désigner ici une couverture ou un bandeau servant au déguisement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: alla donc
  rationale: Le waw consécutif fait avancer le récit; « donc » exprime naturellement la suite et la conséquence de l'ordre reçu au verset précédent.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Traduction directe du nom défini.
- source_word: וַיַּעֲמֹד
  choice: se poster
  rationale: Dans ce contexte d'attente délibérée sur le passage du roi, « se poster » rend plus naturellement l'action que le simple « se tenir debout », sans ajouter l'idée d'une embuscade.
- source_word: לַמֶּלֶךְ
  choice: pour attendre le roi
  rationale: 'Le lamed indique ici la relation de but: le prophète prend position afin de rencontrer le roi. L''ajout explicite d''« attendre » clarifie ce rapport en français.'
- source_word: עַל הַדָּרֶךְ
  choice: au bord du chemin
  rationale: Cette formulation française convient à quelqu'un qui se place sur le trajet du roi sans imposer l'idée qu'il se tient au milieu de la voie.
- source_word: וַיִּתְחַפֵּשׂ
  choice: Il se déguisa
  rationale: Le hitpael exprime l'action de se rendre méconnaissable, comme le confirme la suite du récit.
- source_word: בָּאֲפֵר
  choice: en mettant un bandeau
  rationale: Même si אֵפֶר signifie habituellement « cendre », le contexte et la mention « sur ses yeux » permettent le sens rare d'une pièce d'étoffe ou d'un bandeau. L'ambiguïté lexicale est signalée en note.
- source_word: עַל עֵינָיו
  choice: sur ses yeux
  rationale: Rendu formel qui conserve précisément la partie du visage couverte selon l'hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. « Se poster » et « pour attendre » rendent clairement la mise en scène narrative, tandis que la note préserve l'ambiguïté réelle de בָּאֲפֵר.
