  source_fidelity: La traduction de בָּאֲפֵר par « bandeau » dans le texte courant privilégie une interprétation contextuelle minoritaire d’un mot qui signifie normalement « cendre(s) ». Puisque le sens est discuté, le texte doit conserver le sens premier et signaler l’autre possibilité en note. « Au bord du chemin » restreint aussi inutilement עַל הַדָּרֶךְ (« sur le chemin / la route »).
  naturalness: Le français est globalement fluide et de registre approprié. « En attendant le roi » rend naturellement la finalité impliquée par לַמֶּלֶךְ, sans devoir introduire « pour attendre » comme complément explicatif.
  terminology: « Prophète » et « se déguisa » sont justes. « Cendre » est le rendu lexical premier d’אֵפֶר; l’hypothèse d’un bandeau ou d’une pièce d’étoffe doit rester en note.
