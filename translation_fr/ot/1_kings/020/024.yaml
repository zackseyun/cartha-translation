  text: וְ/אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עֲשֵׂ֑ה הָסֵ֤ר הַ/מְּלָכִים֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ וְ/שִׂ֥ים פַּח֖וֹת תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: fr
  text: 'Et fais ceci : écarte chaque roi de son poste, et nomme des gouverneurs[a] à leur place.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : des gouverneurs provinciaux.'
    reason: Le titre פַּחוֹת peut désigner plus précisément des responsables administrant des provinces.
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: Et fais ceci
  rationale: La tournure rend naturellement l’objet antéposé suivi de l’impératif, sans alourdir le français par « cette chose ».
- source_word: הָסֵר
  choice: écarte
  rationale: L’impératif à valeur causative demande de retirer les rois de leur fonction ou de leur commandement. « Écarte » conserve cette portée sans affirmer qu’ils sont entièrement déposés.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: les rois, chacun de son poste
  rationale: « Chacun » restitue la valeur distributive de אִישׁ après le pluriel. Dans ce contexte administratif et militaire, « poste » exprime le sens fonctionnel de מָקוֹם plus clairement que le simple « endroit ».
- source_word: וְשִׂים
  choice: et nomme
  rationale: שׂים signifie littéralement « placer, mettre » ; lorsqu’il s’agit d’installer des responsables dans une fonction, « nommer » est le verbe français naturel.
- source_word: פַּחוֹת
  choice: des gouverneurs
  rationale: Le terme désigne des hauts fonctionnaires administratifs, souvent responsables d’une province. « Gouverneurs » est précis sans imposer ici une titulature plus étroite.
- source_word: תַּחְתֵּיהֶם
  choice: à leur place
  rationale: L’expression indique que les gouverneurs doivent remplacer les rois dans leurs fonctions.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. La syntaxe conserve la succession des deux ordres et la précision distributive « chacun », tout en rendant explicitement le contexte de fonction par « poste » et « nomme ».
