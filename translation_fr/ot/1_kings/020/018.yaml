  text: וַ/יֹּ֛אמֶר אִם לְ/שָׁל֥וֹם יָצָ֖אוּ תִּפְשׂ֣וּ/ם חַיִּ֑ים וְ/אִ֧ם לְ/מִלְחָמָ֛ה יָצָ֖אוּ חַיִּ֥ים תִּפְשֽׂוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: fr
  text: 'Il dit : « S’ils sont sortis pour faire la paix, capturez-les vivants ; et s’ils sont sortis pour combattre, capturez-les vivants. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol narratif introduit ici le discours direct. « Il dit » convient au récit français sans surcharger la succession temporelle.
- source_word: אִם
  choice: si
  rationale: La particule introduit chacune des deux éventualités et se rend naturellement par « si ».
- source_word: לְשָׁלוֹם
  choice: pour faire la paix
  rationale: La construction exprime ici une intention pacifique. Cette formulation française est naturelle tout en conservant l’idée de finalité portée par לְ.
- source_word: יָצָאוּ
  choice: sont sortis
  rationale: Le parfait décrit la sortie déjà accomplie des hommes ; le passé composé est idiomatique dans ce discours direct.
- source_word: תִּפְשׂוּם
  choice: capturez-les
  rationale: Dans ce contexte militaire, תפשׂ commande de s’emparer des hommes et de les faire prisonniers ; « capturez-les » est précis et courant.
- source_word: חַיִּים
  choice: vivants
  rationale: L’adjectif indique l’état dans lequel ils doivent être capturés.
- source_word: וְאִם
  choice: et s’ils
  rationale: La coordination simple de l’hébreu est conservée sans introduire un contraste plus marqué que celui du texte.
- source_word: לְמִלְחָמָה
  choice: pour combattre
  rationale: Dans ce contexte, la construction indique qu’ils sortent avec l’intention d’engager le combat ; cette expression est plus naturelle en français que le calque « pour la bataille ».
- source_word: חַיִּים תִּפְשׂוּם
  choice: capturez-les vivants
  rationale: La répétition intégrale de l’ordre est maintenue. L’ordre des mots est adapté au français, sans tenter de reproduire artificiellement l’antéposition hébraïque de חַיִּים dans la seconde proposition.
