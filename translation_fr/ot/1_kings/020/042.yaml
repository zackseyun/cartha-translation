revisions:
- from: 'Il lui dit : « Ainsi parle Yahvé : Parce que tu as relâché l’homme que j’avais voué à la destruction[a] alors qu’il était entre tes mains, ta vie prendra la place de sa vie, et ton peuple celle de son peuple. »'
  to: 'Il lui dit : « Ainsi parle Yahvé : Puisque tu as libéré l’homme que j’avais voué à la destruction[a], qui était entre tes mains, ta vie sera à la place de la sienne, et ton peuple à la place du sien. »'
  rationale: La révision remplace la subordonnée temporelle par une relative qui rend plus fidèlement l’homme comme étant sous la garde ou le pouvoir du destinataire, tout en conservant l’absence d’une notion supplémentaire de fuite. Elle explicite aussi le parallélisme de substitution par « à la place de », sans modifier le sens de l’oracle.
