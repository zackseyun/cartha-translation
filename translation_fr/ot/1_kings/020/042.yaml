review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : l’oracle de YHWH reproche la libération d’un homme voué au ḥérem et annonce une substitution de vie et de peuple. Cependant, « alors qu’il était entre tes mains » transforme la préposition « de ta main » en circonstance temporelle et affaiblit légèrement l’idée de remise en liberté hors de la garde ou du pouvoir du destinataire.'
  naturalness: Le français est globalement clair et d’un registre approprié. « Tu as libéré … qui était entre tes mains » est plus naturel et plus directement lié au sens de contrôle/garde que « tu as relâché … alors qu’il était entre tes mains ». « Ta vie sera à la place de la sienne » restitue plus directement la formule judiciaire future.
  terminology: « Yahvé » est une transcription française courante et cohérente. « Voué à la destruction » rend bien le vocabulaire de חֵרֶם sans imposer un jargon confessionnel. La note, ancrée à cette expression, présente convenablement « sous mon interdit » comme une possibilité lexicale et explique la portée judiciaire divine.
  issues:
  - severity: medium
    issue: Rendu de מִיָּד par « alors qu’il était entre tes mains »
    rationale: Le syntagme signifie littéralement « de ta main » et exprime la sortie de la garde ou du pouvoir. « Alors que » introduit une valeur temporelle qui n’est pas explicitement présente. Une relative (« qui était entre tes mains ») conserve l’image de la garde sans cette inflexion.
  revised_text: 'Il lui dit : « Ainsi parle Yahvé : Puisque tu as libéré l’homme que j’avais voué à la destruction[a], qui était entre tes mains, ta vie sera à la place de la sienne, et ton peuple à la place du sien. »'
  revised_footnotes:
  - marker: a
    text: 'Ou : « l’homme placé sous mon interdit ». Le terme hébreu désigne ici quelqu’un voué à la destruction en vertu d’un jugement divin.'
    reason: Alternative lexicale permettant de signaler la portée particulière du terme חֵרֶם.
  revision_rationale: La révision remplace la subordonnée temporelle par une relative qui rend plus fidèlement l’homme comme étant sous la garde ou le pouvoir du destinataire, tout en conservant l’absence d’une notion supplémentaire de fuite. Elle explicite aussi le parallélisme de substitution par « à la place de », sans modifier le sens de l’oracle.
