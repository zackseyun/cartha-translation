  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: fr
  text: 'Il lui dit : « Ainsi parle Yahvé : Puisque tu as libéré l’homme que j’avais voué à la destruction[a], qui était entre tes mains, ta vie sera à la place de la sienne, et ton peuple à la place du sien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’homme placé sous mon interdit ». Le terme hébreu désigne ici quelqu’un voué à la destruction en vertu d’un jugement divin.'
    reason: Alternative lexicale permettant de signaler la portée particulière du terme חֵרֶם.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui préserve ici le nom d’alliance plutôt que de le remplacer par un titre.
- source_word: יַעַן
  choice: Parce que
  rationale: Introduit directement et naturellement le motif de la sentence.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: tu as relâché ... alors qu’il était entre tes mains
  rationale: « Relâché » exprime la libération d’un captif sans ajouter l’idée d’une fuite; « entre tes mains » restitue idiomatiquement la notion de garde et de pouvoir portée par מִיָּד.
- source_word: אִישׁ חֶרְמִי
  choice: l’homme que j’avais voué à la destruction
  rationale: Rend le suffixe de première personne ainsi que la force judiciaire et religieuse de חֵרֶם, sans employer le terme français potentiellement opaque « interdit ».
- source_word: וְהָיְתָה נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: ta vie prendra la place de sa vie
  rationale: נֶפֶשׁ désigne ici la vie; « prendre la place de » exprime clairement la substitution indiquée par תַּחַת.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: et ton peuple celle de son peuple
  rationale: Maintient le parallélisme et le sens substitutif, tout en évitant une répétition lourde en français.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Formule prophétique traditionnelle, concise, digne et naturelle en français biblique moderne.
theological_decisions:
- issue: Traduction du vocabulaire de חֵרֶם dans un oracle de jugement
  choice: voué à la destruction
  alternative: placé sous mon interdit
  rationale: Le choix retenu conserve l’idée d’une condamnation consacrée par le jugement divin, sans réduire le terme à une hostilité personnelle ni imposer un jargon confessionnel.
translation_notes:
  register: Français international moderne, avec une dignité adaptée à un oracle prophétique. La formulation conserve le parallélisme judiciaire tout en rendant idiomatiquement l’image hébraïque de la main comme pouvoir ou garde.
