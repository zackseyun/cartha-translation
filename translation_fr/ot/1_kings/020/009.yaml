  text: וַ/יֹּ֜אמֶר לְ/מַלְאֲכֵ֣י בֶן הֲדַ֗ד אִמְר֞וּ לַֽ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ כֹּל֩ אֲשֶׁר שָׁלַ֨חְתָּ אֶל עַבְדְּ/ךָ֤ בָ/רִֽאשֹׁנָה֙ אֶעֱשֶׂ֔ה וְ/הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹ֥א אוּכַ֖ל לַ/עֲשׂ֑וֹת וַ/יֵּֽלְכוּ֙ הַ/מַּלְאָכִ֔ים וַ/יְשִׁבֻ֖/הוּ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: fr
  text: 'Il dit donc aux messagers de Ben-Hadad : « Dites à mon seigneur le roi : “Tout ce que tu as envoyé à ton serviteur la première fois, je le ferai ; mais cela[a], je ne peux pas le faire.” » Les messagers partirent et lui rapportèrent une réponse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette affaire » ou « cette demande ». Le mot hébreu peut aussi signifier « parole » ou « message », selon le contexte.
    reason: Préserver l’étendue sémantique de דָּבָר sans imposer une interprétation unique.
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: messagers
  rationale: Dans ce contexte diplomatique, le terme désigne les représentants humains de Ben-Hadad, non des êtres célestes.
- source_word: בֶן הֲדַד
  choice: Ben-Hadad
  rationale: Translittération française usuelle du nom propre.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: à mon seigneur le roi
  rationale: Conserve la formule diplomatique de déférence sans donner ici à « seigneur » un sens divin.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ
  choice: tout ce que tu as demandé
  rationale: Littéralement « tout ce que tu as envoyé » ; dans le contexte, le complément sous-entendu est la demande transmise. La formulation française explicite ce sens contextuel sans en modifier la portée.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Formule conventionnelle d'humilité dans un échange royal ; « esclave » surdéterminerait ici le statut social.
- source_word: בָרִאשֹׁנָה
  choice: la première fois
  rationale: Renvoie clairement au premier message de Ben-Hadad et se lit naturellement en français moderne.
- source_word: וְהַדָּבָר הַזֶּה
  choice: mais cette chose
  rationale: Préserve la largeur sémantique de דָּבָר, qui peut désigner une chose, une affaire, une parole ou, ici, une demande.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: je ne peux pas la faire
  rationale: Rend directement l'incapacité exprimée par יכל suivi de l'infinitif ; le pronom féminin reprend naturellement « chose ».
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: lui rapportèrent cette réponse
  rationale: Rend idiomatiquement le retour d'une parole ou d'un message à Ben-Hadad ; « réponse » correspond à la fonction de cette parole dans le récit.
