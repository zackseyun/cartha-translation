  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֣אמֶר דַּבְּר֔וּ אַל יִתְהַלֵּ֥ל חֹגֵ֖ר כִּ/מְפַתֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: fr
  text: 'Le roi d’Israël répondit : « Dites-lui : “Que celui qui revêt son armure ne se vante pas comme celui qui la retire[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que celui qui ceint ne se vante pas comme celui qui délie. » Le proverbe oppose celui qui s’équipe pour le combat à celui qui ôte son équipement après le combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: Le roi d’Israël répondit
  rationale: La formule narrative hébraïque signifie littéralement « répondit et dit ». En français moderne, « répondit » exprime naturellement les deux verbes sans lourdeur.
- source_word: דַּבְּרוּ
  choice: Dites-lui
  rationale: L’impératif est au pluriel et s’adresse aux messagers. Le complément « lui », sous-entendu en hébreu, désigne leur maître d’après le contexte.
- source_word: אַל יִתְהַלֵּל
  choice: Que … ne se vante pas
  rationale: Le jussif négatif formule ici une mise en garde proverbiale; « se vanter » rend le sens réfléchi de la forme hitpael de הלל.
- source_word: חֹגֵר
  choice: celui qui revêt son armure
  rationale: Le participe signifie littéralement « celui qui ceint ». Dans ce contexte militaire, l’équipement de combat est sous-entendu; « revêt son armure » transmet clairement l’image de celui qui se prépare au combat.
- source_word: כִּמְפַתֵּחַ
  choice: comme celui qui la retire
  rationale: Le participe désigne celui qui délie ou détache ce qu’il portait. Le pronom « la » reprend l’armure explicitée dans la première moitié et conserve le contraste entre le début et la fin du combat.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proverbiale est conservée, tandis que la formule hébraïque redondante « répondit et dit » est rendue idiomatiquement par « répondit ».
