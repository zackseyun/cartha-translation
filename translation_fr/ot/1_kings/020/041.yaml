  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: fr
  text: Alors, il s’empressa d’enlever le bandeau[a] qui couvrait ses yeux, et le roi d’Israël reconnut qu’il était l’un des prophètes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu הָאֲפֵר est traditionnellement compris par certains comme signifiant « de la cendre », mais, dans ce contexte, il désigne probablement une pièce d’étoffe ou un bandeau placé sur les yeux comme déguisement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: il s’empressa
  rationale: Le verbe מהר exprime la hâte; « s’empressa » rend naturellement l’action immédiate dans le récit.
- source_word: וַיָּסַר
  choice: d’enlever
  rationale: La forme causative de סור signifie ici enlever ou retirer un objet.
- source_word: הָאֲפֵר
  choice: le bandeau
  rationale: Même si אֵפֶר signifie habituellement « cendre », le contexte décrit un objet placé sur les yeux pour servir de déguisement. « Bandeau » en exprime clairement la fonction tout en signalant l’incertitude lexicale en note.
- source_word: מֵעַל עֵינָיו
  choice: qui couvrait ses yeux
  rationale: Cette formulation française naturelle conserve l’idée spatiale d’un objet placé sur les yeux.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: reconnut
  rationale: Le hiphil de נכר signifie reconnaître ou identifier. Le complément et la proposition qui suit se combinent naturellement en français sous la forme « reconnut qu’il était ».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Traduction directe de la construction nominale hébraïque.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de la reconnaissance, et non sa cause.
- source_word: מֵהַנְּבִאִים
  choice: l’un des prophètes
  rationale: Le מן partitif marque l’appartenance au groupe des prophètes.
- source_word: הוּא
  choice: il était
  rationale: La proposition nominale hébraïque exige une copule en français; l’imparfait convient au point de vue narratif.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement restructurée pour éviter le tour peu naturel « le reconnut, qu’il était », sans perdre le contenu de l’hébreu. L’ambiguïté de הָאֲפֵר est conservée dans la note.
