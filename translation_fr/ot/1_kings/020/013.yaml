  edition: WLC
  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: fr
  text: 'Or voici qu’un prophète s’approcha d’Achab, roi d’Israël, et lui dit : « Voici ce que dit Yahweh : As-tu vu toute cette immense multitude[a] ? Voici que je la livre entre tes mains aujourd’hui, et tu sauras que je suis Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute cette immense armée » ou « toute cette grande horde ». Le mot hébreu peut désigner une foule nombreuse ou une masse de combattants ; ici, il renvoie aux forces ennemies.
    reason: alternative lexicale liée au contexte militaire
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici que
  rationale: Rend le marqueur narratif et son effet de mise en relief dans un français actuel et soutenu.
- source_word: נָבִיא אֶחָד
  choice: un prophète
  rationale: Le numéral אֶחָד introduit ici un individu non identifié ; l’article indéfini est la tournure française naturelle.
- source_word: נִגַּשׁ אֶל
  choice: s’approcha de
  rationale: Reproduit directement le mouvement d’approche exprimé par le verbe hébreu.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Formulation française naturelle de la formule prophétique, avec le présent du discours messager.
- source_word: הֲרָאִיתָ
  choice: As-tu vu
  rationale: Respecte l’interrogation et la forme accomplie du verbe, qui désigne la force ennemie déjà placée sous les yeux d’Achab.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: toute cette immense multitude
  rationale: Préserve le sens large de הָמוֹן sans préciser indûment « armée », tout en rendant naturellement l’idée de grandeur.
- source_word: הִנְנִי נֹתְנוֹ
  choice: Voici que je la livre
  rationale: Conserve l’emphase de הִנְנִי et la valeur imminente ou certaine du participe ; « livrer » convient au contexte militaire.
- source_word: בְיָדְךָ
  choice: entre tes mains
  rationale: Maintient l’image de l’idiome hébreu désignant la remise au pouvoir de quelqu’un, idiome également intelligible en français.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: et tu sauras que je suis Yahweh
  rationale: Préserve la formule de reconnaissance et son orientation future sans en expliciter davantage la portée.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; sa translittération préserve le nom divin personnel sans lui substituer un titre.
- issue: Portée de la formule וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: tu sauras que je suis Yahweh
  alternative: tu reconnaîtras que je suis Yahweh
  rationale: La traduction littérale conserve l’ambiguïté entre connaissance, reconnaissance et constat expérientiel, sans résoudre la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « voici » conserve la mise en relief présente dans les deux constructions hébraïques, tandis que « un prophète » évite le tour moins naturel « un certain prophète ».
