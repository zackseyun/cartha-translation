base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: fr
  text: 'Il passa en revue les jeunes gens des chefs des provinces : ils étaient deux cent trente-deux. Après eux, il passa en revue tout le peuple, tous les fils d’Israël[a] : ils étaient sept mille.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les Israélites ». L’hébreu dit littéralement « tous les fils d’Israël », une expression de filiation au masculin employée collectivement pour désigner le peuple d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: passa en revue
  rationale: Dans ce contexte militaire, le verbe désigne le recensement et l’organisation d’hommes en vue de leur déploiement. « Passer en revue » rend ces deux aspects sans réduire l’action à un simple comptage.
- source_word: נַעֲרֵי
  choice: les jeunes gens
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. « Jeunes gens » conserve ici le sens premier sans préciser indûment leur statut.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: les chefs des provinces
  rationale: שַׂר désigne largement un chef ou un haut responsable, et מְדִינָה une circonscription administrative. La formulation française préserve cette portée administrative sans imposer le sens plus étroit de « commandants ».
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: deux cent trente-deux
  rationale: Rendu direct du nombre selon l’usage orthographique français traditionnel, avec « cent » invariable puisqu’il est suivi d’un autre nombre.
- source_word: וְאַחֲרֵיהֶם
  choice: Après eux
  rationale: La formule conserve l’ordre concret des deux groupes passés en revue.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Même si le contexte est militaire, le texte dit « tout le peuple » plutôt que « toute l’armée » ou « toutes les troupes ».
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: tous les fils d’Israël
  rationale: Cette traduction conserve l’expression familiale masculine de l’hébreu. Une note indique l’équivalent collectif plus courant en français moderne.
- source_word: שִׁבְעַת אֲלָפִים
  choice: sept mille
  rationale: Rendu direct du nombre qui indique l’effectif du second groupe.
