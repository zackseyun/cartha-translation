  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: fr
  text: Ils campèrent les uns en face des autres pendant sept jours. Le septième jour, le combat s’engagea, et les fils d’Israël[a] abattirent cent mille soldats à pied[c] d’Aram[b] en un seul jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des Araméens ». En hébreu, « Aram » peut désigner le royaume araméen ou son peuple.
    reason: lexical_alternative
  - marker: c
    text: Ou « fantassins ». L’hébreu désigne littéralement des soldats « à pied ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: campèrent
  rationale: Le verbe חנה désigne l’installation d’un camp; « campèrent » est direct et naturel en français moderne.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: les uns en face des autres
  rationale: Cette formulation rend l’opposition spatiale entre les deux armées tout en reproduisant le contraste concis de l’hébreu.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: « Pendant » exprime clairement la durée indiquée par l’hébreu.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Le septième jour
  rationale: La formule narrative hébraïque est rendue sans lourdeur archaïque, tout en conservant le repère temporel.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: le combat s’engagea
  rationale: Littéralement, la bataille « s’approcha »; dans ce contexte, l’expression signifie que les forces entrèrent effectivement en combat. « S’engagea » conserve l’image d’une rencontre militaire en français idiomatique.
- source_word: וַיַּכּוּ
  choice: abattirent
  rationale: נכה exprime le fait de frapper, souvent avec une issue mortelle en contexte militaire. « Abattirent » garde cette force sans employer le verbe plus plat « vainquirent ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction conserve l’expression masculine littérale du texte, appropriée ici à la force combattante d’Israël.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom propre hébreu est conservé plutôt que remplacé par le terme géopolitique ultérieur « Syrie ».
- source_word: מֵאָה אֶלֶף
  choice: cent mille
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: רַגְלִי
  choice: soldats à pied
  rationale: Le terme désigne des combattants se déplaçant à pied; cette expression transparente garde l’image lexicale de l’hébreu.
- source_word: בְּיוֹם אֶחָד
  choice: en un seul jour
  rationale: « Un seul » fait ressortir en français que ce nombre de soldats fut abattu dans la durée d’une journée.
theological_decisions:
- issue: Expression masculine בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: Le texte source dit littéralement « fils d’Israël » et vise ici la force combattante. La formulation masculine est donc conservée, tandis que l’équivalent collectif courant est signalé en note.
- issue: Valeur du nom אֲרָם
  choice: Aram
  alternative: les Araméens
  rationale: L’hébreu emploie le nom propre « Aram », susceptible de désigner le royaume ou son peuple. Le texte principal préserve ce nom sans imposer une explicitation ethnique.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un large lectorat, sans archaïsmes; « fils d’Israël » et « Aram » préservent toutefois les formes distinctives de l’hébreu, avec des variantes explicatives en notes.
