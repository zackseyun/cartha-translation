source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: fr
  text: 'L’un des fils des prophètes[a] dit à son compagnon, par la parole de Yahweh[b] : « Frappe-moi, je te prie. » Mais l’homme refusa de le frapper.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’un des membres du groupe des prophètes » ou « l’un des disciples des prophètes ». L’hébreu dit littéralement « l’un des fils des prophètes », expression courante désignant un groupe prophétique.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur l’ordre de Yahweh » ou « à la parole de Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: Un homme
  rationale: Dans ce récit, אִישׁ אֶחָד introduit un individu non identifié. « Un homme » est naturel en français et n’ajoute pas un marqueur temporel absent de l’hébreu.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: parmi les fils des prophètes
  rationale: Cette formulation conserve l’expression hébraïque, qui désigne vraisemblablement un membre d’un groupe prophétique, sans préciser indûment la nature de ce groupe.
- source_word: רֵעֵהוּ
  choice: son compagnon
  rationale: « Compagnon » convient au contexte tout en évitant de supposer la proximité affective qu’évoquerait « ami ».
- source_word: בִּדְבַר יְהוָה
  choice: sur l’ordre de Yahweh
  rationale: Dans ce contexte, la parole divine autorise et commande la demande. Cette formulation française exprime clairement la force de בִּדְבַר, tandis qu’une note conserve l’alternative plus formelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: הַכֵּינִי נָא
  choice: Frappe-moi, je te prie
  rationale: נכה signifie ici « frapper »; נָא donne à l’impératif une nuance de requête, rendue par « je te prie » dans un registre digne et naturel.
- source_word: וַיְמָאֵן
  choice: refusa
  rationale: Le verbe exprime un refus net plutôt qu’une simple hésitation.
- source_word: לְהַכֹּתוֹ
  choice: de le frapper
  rationale: La reprise de « frapper » maintient la cohérence lexicale et n’anticipe pas la blessure mentionnée ensuite.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre divin plutôt que de lui substituer un titre.
- issue: Interprétation de בְּנֵי הַנְּבִיאִים
  choice: les fils des prophètes
  alternative: le groupe des prophètes / les disciples des prophètes
  rationale: Le sens collectif ou institutionnel est probable, mais la formulation principale conserve l’image hébraïque et la note présente les interprétations possibles.
- issue: Force de בִּדְבַר יְהוָה
  choice: sur l’ordre de Yahweh
  alternative: par la parole de Yahweh
  rationale: Le contexte suggère une instruction divine, mais la note signale la traduction plus formelle afin de préserver la portée possible de l’expression.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple; « je te prie » conserve la nuance de נָא sans familiarité excessive. Les appels de note suivent immédiatement les expressions concernées.
