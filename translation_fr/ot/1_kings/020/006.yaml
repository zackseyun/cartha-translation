id: 1KI.20.6
reference: 1 Kings 20:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אִם כָּ/עֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת עֲבָדַ/י֙ אֵלֶ֔י/ךָ וְ/חִפְּשׂוּ֙ אֶת בֵּ֣יתְ/ךָ֔ וְ/אֵ֖ת בָּתֵּ֣י עֲבָדֶ֑י/ךָ וְ/הָיָה֙ כָּל מַחְמַ֣ד עֵינֶ֔י/ךָ יָשִׂ֥ימוּ בְ/יָדָ֖/ם וְ/לָקָֽחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: fr
  text: Mais non ! Demain, à cette heure-ci, j’enverrai mes serviteurs chez toi. Ils fouilleront ta maison et les maisons de tes serviteurs. Tout ce à quoi tu tiens[a], ils s’en saisiront et l’emporteront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce qui est désirable à tes yeux », c’est-à-dire tout ce que tu considères comme précieux.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils le mettront dans leur main et le prendront » ; l’expression décrit le fait de s’en emparer et de l’emporter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais non !
  rationale: Dans le contexte, cette locution rejette la limite précédemment acceptée et renforce la menace. « Mais non ! » en restitue la valeur corrective avec naturel.
- source_word: כָּעֵת מָחָר
  choice: Demain, à cette heure-ci
  rationale: Expression temporelle idiomatique désignant le même moment le lendemain.
- source_word: עֲבָדַי
  choice: mes serviteurs
  rationale: Le mot désigne ici les agents du roi envoyés pour exécuter ses ordres ; « serviteurs » convient au contexte politique sans insister indûment sur leur statut social.
- source_word: וְחִפְּשׂוּ
  choice: ils fouilleront
  rationale: Le verbe évoque une recherche minutieuse. Dans le cadre d’une confiscation forcée, « fouiller » est plus naturel et plus précis que le simple « chercher », sans ajouter explicitement l’idée de saccage.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: ta maison et les maisons de tes serviteurs
  rationale: « Maison » conserve le parallélisme hébreu. Le premier terme pourrait désigner le palais, mais le texte ne l’impose pas.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: Tout ce à quoi tu tiens
  rationale: Cette formulation française naturelle exprime ce qui est précieux ou désirable aux yeux d’une personne, tandis que la note conserve l’image hébraïque.
- source_word: יָשִׂימוּ בְיָדָם וְלָקָחוּ
  choice: ils s’en saisiront et l’emporteront
  rationale: La traduction exprime clairement la prise de possession et l’enlèvement annoncés, tout en conservant les deux étapes verbales de la menace.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La menace royale reste nette. « Ta maison » préserve l’ambiguïté entre demeure et palais, et les notes rendent visibles les images idiomatiques de l’hébreu.
