source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ בְּ/מִ֔י וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וַ/יֹּ֛אמֶר מִֽי יֶאְסֹ֥ר הַ/מִּלְחָמָ֖ה וַ/יֹּ֥אמֶר אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: fr
  text: 'Achab demanda : « Par qui ? » Il répondit : « Voici ce que dit Yahweh : Par les jeunes hommes[a] des gouverneurs des provinces. » Achab demanda encore : « Qui engagera le combat ? » Il répondit : « Toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les serviteurs » ou « les hommes de suite des gouverneurs des provinces ». Le terme hébreu peut désigner aussi bien de jeunes hommes que des assistants attachés au service de responsables.
    reason: alternative lexicale
lexical_decisions:
- source_word: בְּמִי
  choice: Par qui ?
  rationale: La préposition בְּ avec l’interrogatif מִי exprime ici l’agent ou le moyen. « Par qui ? » est direct et naturel en français.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit Yahweh
  rationale: Cette formulation française actuelle conserve la solennité de la formule prophétique tout en restant naturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה ; sa translittération préserve le nom propre plutôt que de lui substituer un titre.
- source_word: בְּנַעֲרֵי
  choice: Par les jeunes hommes
  rationale: נַעַר peut désigner de jeunes hommes, mais aussi des serviteurs, assistants ou hommes de suite. Le texte retient le sens lexical premier et signale en note la nuance fonctionnelle possible.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: des gouverneurs des provinces
  rationale: שָׂרִים désigne ici des responsables investis d’autorité, et מְדִינוֹת des circonscriptions administratives. « Gouverneurs des provinces » exprime clairement ce cadre sans leur attribuer un grade militaire précis.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: Qui engagera le combat ?
  rationale: Avec מִלְחָמָה, le verbe אָסַר forme un idiome signifiant engager ou commencer la bataille. « Engager le combat » rend ce sens de façon idiomatique et digne.
- source_word: אָתָּה
  choice: Toi
  rationale: Le pronom indépendant de deuxième personne masculin singulier apporte une réponse brève et appuyée ; « Toi » en conserve la force.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le Tétragramme. « Yahweh » préserve le nom divin personnel, tandis que « le Seigneur » lui substituerait un titre.
translation_notes:
  register: Français international moderne, clair et digne. Les verbes de parole sont légèrement variés (« demanda », « répondit ») selon leur fonction dans le dialogue. La formule prophétique reste solennelle sans archaïsme, et l’ambiguïté de נַעַר est conservée au moyen d’une note.
