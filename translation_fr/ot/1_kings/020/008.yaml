base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: fr
  text: 'Alors tous les anciens et tout le peuple lui dirent : « Ne l’écoute pas et n’accepte pas. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne lui obéis pas et ne donne pas ton accord. » Les verbes hébreux peuvent exprimer respectivement l’idée d’écouter ou d’obéir (שׁמע), et celle de vouloir, d’accepter ou de consentir (אבה).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors ... dirent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession, et « dirent » conserve le verbe de parole.
- source_word: אֵלָיו
  choice: lui
  rationale: L’hébreu emploie un pronom dont l’antécédent contextuel est le roi ; le pronom est donc conservé sans explicitation.
- source_word: כָּל הַזְּקֵנִים
  choice: tous les anciens
  rationale: Dans ce contexte, זְקֵנִים désigne les responsables de la communauté, et non simplement des hommes âgés.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: עָם désigne ici l’ensemble plus large du peuple, aux côtés des anciens.
- source_word: אַל תִּשְׁמַע
  choice: Ne l’écoute pas
  rationale: שׁמע peut signifier entendre, écouter ou obéir. Dans le contexte d’une demande formulée par Ben-Hadad, « écouter » préserve la portée immédiate tout en laissant perceptible l’idée de déférer à sa demande. Le pronom « l’ » est fourni naturellement en français par le contexte.
- source_word: וְלֹא תֹאבֶה
  choice: et n’accepte pas
  rationale: אבה exprime le fait de vouloir, d’accepter ou de consentir. « N’accepte pas » est naturel en français dans ce contexte de négociation et marque clairement le refus demandé.
