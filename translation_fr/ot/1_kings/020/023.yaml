source:
  edition: WLC
  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: fr
  text: 'Les serviteurs du roi d’Aram lui dirent[a] : « Leurs dieux sont des dieux des montagnes ; c’est pourquoi ils ont été plus forts que nous. Mais combattons-les dans la plaine, et nous serons certainement plus forts qu’eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Leur Dieu est un dieu des montagnes… » Les formes hébraïques traduites ici au pluriel (« dieux ») reflètent la manière polythéiste dont les Araméens parlent du Dieu d’Israël.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Le terme désigne les hommes au service du roi et peut inclure ses courtisans ou conseillers ; « serviteurs » conserve directement l’expression hébraïque sans préciser indûment leur fonction.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom propre ancien est conservé plutôt que remplacé par le nom géopolitique plus tardif « Syrie ».
- source_word: אֱלֹהֵי הָרִים אֱלֹהֵיהֶם
  choice: Leurs dieux sont des dieux des montagnes
  rationale: Les formes hébraïques permettent une lecture plurielle naturelle, adaptée à la manière polythéiste dont les Araméens parlent du Dieu d’Israël. « Montagnes » exprime ici les hauteurs ou régions montagneuses.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette tournure française actuelle restitue clairement le rapport causal de l’expression hébraïque.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: ils ont été plus forts que nous
  rationale: Le verbe חזק suivi de מן exprime ici une comparaison de force ; cette formulation garde la valeur comparative et prépare la reprise en fin de verset.
- source_word: וְאוּלָם
  choice: Mais
  rationale: La conjonction introduit le contraste entre l’explication de la défaite et la nouvelle stratégie proposée.
- source_word: נִלָּחֵם אִתָּם
  choice: combattons-les
  rationale: Dans ce contexte délibératif, la première personne du pluriel exprime une proposition énergique ; l’impératif français est naturel et fidèle à cette nuance.
- source_word: בַּמִּישׁוֹר
  choice: dans la plaine
  rationale: מִישׁוֹר désigne un terrain plat ou une région de plaine, en contraste avec les montagnes.
- source_word: אִם לֹא
  choice: certainement
  rationale: L’expression fonctionne ici comme une affirmation appuyée, et non comme une simple condition négative littérale.
- source_word: נֶחֱזַק מֵהֶם
  choice: nous serons plus forts qu’eux
  rationale: La traduction conserve le comparatif et la répétition lexicale qui répond à « ils ont été plus forts que nous ».
theological_decisions:
- issue: La manière dont les Araméens décrivent la divinité d’Israël
  choice: « Leurs dieux sont des dieux des montagnes »
  alternative: « Leur Dieu est un dieu des montagnes »
  rationale: Le discours rapporté exprime la compréhension polythéiste erronée des Araméens, et non l’affirmation théologique du narrateur. Le pluriel préserve cette perspective et l’ironie narrative, tandis qu’une note signale l’autre lecture possible de la forme אֱלֹהִים.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de la progression hébraïque, tout en employant une proposition exhortative idiomatique (« combattons-les ») et en conservant la répétition comparative du texte source.
