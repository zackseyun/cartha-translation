base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: fr
  text: 'Ben-Hadad lui envoya ce message : « Que les dieux m’en fassent autant, et davantage encore, si la poussière de Samarie suffit à fournir des poignées à tous ceux qui sont à mes pieds. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: lui envoya ce message
  rationale: Dans ce contexte diplomatique, le verbe signifie qu’une communication est envoyée à Achab. « Ce message » rend naturellement en français la parole qui suit, sans préciser que des messagers sont mentionnés dans l’hébreu.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Transcription française usuelle du nom propre.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: Que les dieux me traitent avec la plus grande sévérité
  rationale: Cette formulation française rend la valeur imprécatoire de la formule de serment, dont la sanction précise demeure volontairement implicite dans l’hébreu.
- source_word: אִם
  choice: si
  rationale: Dans une formule de serment, אִם introduit la condition qui entraînerait la malédiction. La construction française avec « si » en préserve la logique.
- source_word: יִשְׂפֹּק
  choice: suffit
  rationale: Le verbe exprime l’idée de quantité suffisante; le présent français convient à la condition formulée dans le serment.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: la poussière de Samarie
  rationale: Rend directement la relation construite du texte hébreu.
- source_word: לִשְׁעָלִים
  choice: à remplir le creux de la main de chacun
  rationale: Le terme rare désigne ici vraisemblablement le creux des mains ou des poignées. Cette formulation rend concrètement l’image et s’accorde avec l’hyperbole militaire.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: de chacun de ceux qui marchent à ma suite
  rationale: Littéralement « de tout le peuple qui est à mes pieds »; l’expression désigne les hommes placés sous le commandement du roi et qui l’accompagnent. Le choix garde l’image de la marche tout en étant naturel en français.
theological_decisions:
- issue: Sens de אֱלֹהִים dans le serment d’un roi araméen
  choice: les dieux
  alternative: Dieu
  rationale: Le verbe pluriel et l’identité du locuteur non israélite favorisent une référence à ses divinités. Le pluriel respecte donc à la fois la grammaire et le cadre narratif.
translation_notes:
  register: Français international moderne, digne et accessible. La formule de serment est rendue idiomatiquement plutôt que calquée; l’hyperbole menaçante et l’image corporelle du texte source sont conservées.
