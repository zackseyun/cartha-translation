revisions:
- from: 'Ben-Hadad lui envoya ce message : « Que les dieux me traitent avec la plus grande sévérité si la poussière de Samarie suffit à remplir le creux de la main de chacun de ceux qui marchent à ma suite[a] ! »'
  to: 'Ben-Hadad lui envoya ce message : « Que les dieux m’en fassent autant, et davantage encore, si la poussière de Samarie suffit à fournir des poignées à tous ceux qui sont à mes pieds. »'
  rationale: La révision restitue la structure complète et elliptique de la formule de serment, préserve l’image de personnes « à mes pieds » et rend le terme rare avec prudence. L’ancre de note est maintenue sur la proposition qui contient l’image des poignées et des sujets du roi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:41:03Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation du serment « me traitent avec la plus grande sévérité » explicite une sanction absente du texte et ne rend pas l’intensification « et qu’ils ajoutent encore ». La relation de subordination exprimée littéralement par « à mes pieds » est préférable à « marchent à ma suite », qui atténue l’image royale et militaire.
  naturalness: Le français proposé est globalement clair et soutenu. « M’en fassent autant, et davantage encore » est une formule de serment naturelle qui conserve mieux le caractère elliptique de l’hébreu.
  terminology: « Ben-Hadad », « les dieux » et « Samarie » conviennent. Pour le terme rare לִשְׁעָלִים, « des poignées » est concis; la note doit signaler l’incertitude lexicale plutôt que présenter « creux des mains » comme un littéral assuré.
  issues:
  - severity: medium
    issue: La formule imprécatoire est paraphrasée et son second membre est omis.
    rationale: 'כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ signifie littéralement une formule du type « Que les dieux m’en fassent autant, et davantage encore ». « Avec la plus grande sévérité » ajoute une qualification non exprimée et efface « davantage ». '
  - severity: medium
    issue: « Ceux qui marchent à ma suite » interprète et affaiblit « qui sont à mes pieds ».
    rationale: L’expression בְּרַגְלַי évoque les personnes sous l’autorité du roi. « Qui sont à mes pieds » conserve l’image et l’ambiguïté sans imposer seulement l’idée de suivre en marchant.
  - severity: low
    issue: La note qualifie « creux des mains » de littéral malgré l’incertitude du terme rare.
    rationale: Le sens « poignées/creux de la main » est l’interprétation traditionnelle et contextuellement la plus vraisemblable, mais il convient de le présenter comme tel.
  revised_text: 'Ben-Hadad lui envoya ce message : « Que les dieux m’en fassent autant, et davantage encore, si la poussière de Samarie suffit à fournir des poignées à tous ceux qui sont à mes pieds. »'
  revised_footnotes:
  - marker: a
    text: Le terme hébreu rare traduit par « poignées » est traditionnellement compris comme désignant les creux de la main. Ben-Hadad se vante que la poussière de Samarie ne suffirait pas à donner même une poignée à chacun de ceux qui sont sous ses ordres.
    reason: Expression hébraïque et terme rare nécessitant une clarification.
  revision_rationale: La révision restitue la structure complète et elliptique de la formule de serment, préserve l’image de personnes « à mes pieds » et rend le terme rare avec prudence. L’ancre de note est maintenue sur la proposition qui contient l’image des poignées et des sujets du roi.
