base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: fr
  text: 'Les hommes guettaient un présage[a] ; ils s’empressèrent de le prendre au mot[b] et dirent : « Ben-Hadad est ton frère ! » Achab répondit : « Allez le chercher. » Ben-Hadad sortit donc à sa rencontre, et Achab le fit monter sur le char[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cherchaient à interpréter un présage ». Le verbe hébreu peut évoquer la divination ; ici, ces hommes semblent surtout guetter dans les paroles d’Achab un indice qui leur soit favorable.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est difficile. Elle indique probablement qu’ils saisirent aussitôt la formulation d’Achab comme une concession favorable.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, « le fit monter sur le char » : la forme verbale hébraïque est causative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: guettaient un présage
  rationale: Le piel de נחשׁ peut désigner la recherche ou l’interprétation de présages. Ici, les hommes attendent dans les paroles d’Achab un indice favorable ; « guettaient un présage » conserve cette nuance sans suggérer nécessairement un rite divinatoire formel.
- source_word: וַיְמַהֲרוּ
  choice: s’empressèrent
  rationale: Cette formulation rend naturellement l’idée de hâte et maintient la progression vive du récit.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: de le prendre au mot
  rationale: L’expression hébraïque est difficile. Dans le contexte, les hommes saisissent aussitôt la parole favorable d’Achab et la traitent comme un engagement. L’objet implicite est sa déclaration au sujet de « ton frère ».
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Le sens littéral convient et préserve la portée diplomatique du terme, que les hommes exploitent immédiatement.
- source_word: בֹּאוּ קָחֻהוּ
  choice: Allez le chercher
  rationale: Dans ce contexte, les deux impératifs invitent les hommes à aller faire venir Ben-Hadad. Cette tournure est idiomatique en français moderne.
- source_word: וַיֵּצֵא אֵלָיו
  choice: sortit donc à sa rencontre
  rationale: La formulation rend le mouvement de Ben-Hadad hors de sa cachette vers Achab. « À sa rencontre » est plus naturel que le littéral « sortit vers lui ».
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: il le fit monter sur le char
  rationale: 'Le hifil de עלה est causatif : Achab fait monter Ben-Hadad, sans que le texte implique nécessairement qu’il le soulève physiquement.'
- source_word: הַמֶּרְכָּבָה
  choice: le char
  rationale: L’hébreu emploie l’article défini sans possessif explicite ; la traduction conserve cette forme.
