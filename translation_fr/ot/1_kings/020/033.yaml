  register: 'Français international moderne, narratif et digne. « Prendre au mot » exprime clairement la réaction opportuniste des envoyés, tandis que les notes préservent l’incertitude des deux expressions hébraïques difficiles. Les pronoms de la dernière proposition suivent la concision du texte source : Achab fait monter Ben-Hadad sur le char.'
