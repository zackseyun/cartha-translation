source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל הָתְפָּקְדוּ֙ וְ/כָלְכְּל֔וּ וַ/יֵּלְכ֖וּ לִ/קְרָאתָ֑/ם וַ/יַּחֲנ֨וּ בְנֵֽי יִשְׂרָאֵ֜ל נֶגְדָּ֗/ם כִּ/שְׁנֵי֙ חֲשִׂפֵ֣י עִזִּ֔ים וַ/אֲרָ֖ם מִלְא֥וּ אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: fr
  text: Les fils d’Israël[a] furent passés en revue et ravitaillés[b], puis ils partirent à leur rencontre. Les fils d’Israël campèrent en face d’eux, comme deux petits troupeaux de chèvres[c], tandis qu’Aram remplissait le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Israélites ». L’hébreu dit littéralement « les fils d’Israël », désignation collective traditionnelle du peuple.
    reason: lexical_alternative
  - marker: b
    text: Ou « pourvus de provisions ». Le verbe désigne vraisemblablement ici le ravitaillement nécessaire à la campagne.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie ici un terme rare dans l’expression littérale « comme deux חֲשִׂפֵי de chèvres ». L’image évoque deux groupes minuscules, par contraste avec l’immense armée araméenne.
    reason: cultural_note
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: furent passés en revue
  rationale: Dans ce contexte militaire, le hitpael de פקד désigne le rassemblement et le recensement des combattants. « Furent passés en revue » conserve cette nuance sans suggérer nécessairement une mobilisation au sens administratif moderne.
- source_word: וְכָלְכְּלוּ
  choice: furent ravitaillés
  rationale: Le verbe כלכל évoque ici le fait de pourvoir les combattants de ce qui leur est nécessaire pour la campagne. « Ravitaillés » est naturel et précis dans un contexte militaire.
- source_word: לִקְרָאתָם
  choice: à leur rencontre
  rationale: La tournure signifie aller à la rencontre de quelqu’un; le contexte indique qu’il s’agit ici d’affronter l’armée ennemie, sans qu’il soit nécessaire de renforcer explicitement le verbe.
- source_word: נֶגְדָּם
  choice: en face d’eux
  rationale: נגד indique une position vis-à-vis ou en face de l’autre camp. Cette formulation exprime clairement la disposition des deux armées.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: comme deux petits troupeaux de chèvres
  rationale: L’expression hébraïque inhabituelle représente Israël sous l’aspect de deux groupes minuscules. Cette traduction garde l’image pastorale et rend naturellement le contraste numérique.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: tandis qu’Aram remplissait le pays
  rationale: Le singulier collectif « Aram » est conservé comme dans l’hébreu. « Remplissait le pays » maintient l’image de l’immense armée araméenne déployée sur tout le territoire, tandis que « tandis que » exprime le contraste sans donner au simple waw une valeur adversative trop forte.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La traduction formelle préserve la désignation collective traditionnelle de l’hébreu ainsi que sa répétition dans le verset; une note indique l’équivalent courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure répétitive de l’hébreu est conservée, de même que l’image de la petitesse d’Israël opposée à Aram qui remplit le pays. Les notes signalent les expressions hébraïques dont une traduction entièrement littérale serait obscure.
