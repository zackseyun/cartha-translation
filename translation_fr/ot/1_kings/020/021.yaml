  text: וַ/יֵּצֵא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יַּ֥ךְ אֶת הַ/סּ֖וּס וְ/אֶת הָ/רָ֑כֶב וְ/הִכָּ֥ה בַ/אֲרָ֖ם מַכָּ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: fr
  text: Alors le roi d’Israël sortit, frappa les chevaux et les chars, et infligea à Aram[a] un grand coup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « aux Araméens » : « Aram » peut désigner ici le royaume ou ses forces.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא décrit simplement la sortie du roi dans la suite narrative; « sortit » évite d’ajouter l’idée plus précise d’une marche militaire.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Rendu direct et naturel de la construction hébraïque.
- source_word: וַיַּךְ
  choice: frappa
  rationale: נכה peut signifier frapper, attaquer ou vaincre; « frappa » conserve ici sa force concrète sans préciser excessivement l’issue.
- source_word: הַסּוּס
  choice: les chevaux
  rationale: Bien que le nom soit morphologiquement au singulier, il a ici un sens collectif militaire, rendu naturellement par le pluriel français.
- source_word: הָרָכֶב
  choice: les chars
  rationale: רכב désigne collectivement les chars ou les forces de chars; « les chars » est clair et idiomatique.
- source_word: וְהִכָּה
  choice: infligea
  rationale: Avec le complément מַכָּה, « infligea » forme une tournure française naturelle tout en conservant l’idée de porter un coup.
- source_word: בַאֲרָם
  choice: à Aram
  rationale: Le texte hébreu nomme Aram, qui peut désigner le royaume ou, par métonymie, ses forces; la préposition française « à » convient avec « infliger un coup ».
- source_word: מַכָּה גְדוֹלָה
  choice: un coup terrible
  rationale: L’expression signifie littéralement un grand coup. « Un coup terrible » est naturel en français et exprime la gravité du revers sans imposer explicitement l’idée d’un massacre.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de l’hébreu tout en évitant un calque peu naturel; « Aram » est conservé plutôt que le nom traditionnel « Syrie ».
