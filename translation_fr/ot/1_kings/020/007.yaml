  text: וַ/יִּקְרָ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ לְ/כָל זִקְנֵ֣י הָ/אָ֔רֶץ וַ/יֹּ֨אמֶר֙ דְּעֽוּ נָ֣א וּ/רְא֔וּ כִּ֥י רָעָ֖ה זֶ֣ה מְבַקֵּ֑שׁ כִּֽי שָׁלַ֨ח אֵלַ֜/י לְ/נָשַׁ֤/י וּ/לְ/בָנַ/י֙ וּ/לְ/כַסְפִּ֣/י וְ/לִ/זְהָבִ֔/י וְ/לֹ֥א מָנַ֖עְתִּי מִמֶּֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: fr
  text: 'Alors le roi d’Israël convoqua tous les anciens du pays et leur dit : « Sachez donc et voyez bien que cet homme cherche le mal ; il a envoyé demander mes femmes, mes fils, mon argent et mon or, et je ne les lui ai pas refusés. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: notre malheur
  rationale: Dans ce contexte, le terme désigne le tort ou le désastre recherché par Ben-Hadad, plutôt qu’un « mal » abstrait. Le possessif explicite naturellement l’enjeu collectif perçu par le roi.
- source_word: מְבַקֵּשׁ
  choice: cherche
  rationale: Rend directement le participe hébreu, qui présente l’intention hostile comme actuelle.
- source_word: שָׁלַח אֵלַי לְ־
  choice: m’a fait réclamer
  rationale: La tournure signifie ici qu’il a envoyé des messagers auprès du roi pour réclamer ces biens et ces personnes; cette formulation évite le calque peu naturel « il a envoyé vers moi pour ».
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: je ne les lui ai pas refusés
  rationale: Exprime idiomatiquement le fait de ne pas retenir ou soustraire les éléments demandés.
theological_decisions:
- issue: Portée de רָעָה
  choice: notre malheur
  alternative: le mal / des ennuis
  rationale: Le contexte politique et militaire favorise l’idée d’un préjudice ou d’un désastre projeté, sans transformer le propos en jugement doctrinal abstrait sur le mal.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Sachez-le, je vous prie, et voyez » conserve l’insistance des deux impératifs et la nuance de politesse de נָא, tandis que la syntaxe du discours reste naturelle.
