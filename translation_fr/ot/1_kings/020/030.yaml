base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: fr
  text: Les survivants s’enfuirent à Afek, dans la ville. La muraille s’effondra sur vingt-sept mille hommes qui restaient. Ben-Hadad s’enfuit lui aussi et entra dans la ville, jusque dans une pièce intérieure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une chambre dans une chambre »; l’expression peut désigner une pièce intérieure, voire la plus reculée.'
    reason: La formulation hébraïque est imagée et peut suggérer une chambre située au fond d’une autre; la note préserve cette nuance sans imposer une précision absente du texte.
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: les survivants / les hommes qui restaient
  rationale: Le terme désigne ceux qui ont survécu au combat. « Les survivants » est naturel à la première occurrence; la variation « les hommes qui restaient » évite une répétition lourde tout en conservant le même sens à la seconde.
- source_word: אֲפֵקָה
  choice: à Afek
  rationale: Le hé directionnel indique un mouvement vers Afek. Le nom de lieu est translittéré sous la forme française courante.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: la muraille s’effondra
  rationale: L’article défini est conservé. « Muraille » convient à l’enceinte d’une ville, et « s’effondra » exprime naturellement la chute de l’ouvrage sans préciser davantage sa cause.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: sur vingt-sept mille des hommes
  rationale: La construction numérique est rendue idiomatiquement; « hommes » convient au contexte militaire et « des » rattache ce groupe à ceux qui restaient.
- source_word: וּבֶן הֲדַד נָס
  choice: Ben-Hadad s’enfuit lui aussi
  rationale: « Lui aussi » marque le parallèle narratif avec la fuite des survivants, tandis que « s’enfuit » maintient le lien lexical avec le premier verbe de fuite.
- source_word: חֶדֶר בְּחָדֶר
  choice: jusque dans une chambre retirée
  rationale: L’expression, littéralement « une chambre dans une chambre », évoque une pièce intérieure et cachée. « Chambre retirée » est naturel en français, tandis que la formulation hébraïque est conservée en note afin de ne pas masquer son image ni sa possible nuance d’intériorité croissante.
