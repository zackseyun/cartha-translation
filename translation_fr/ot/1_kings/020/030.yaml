    issue: « Chambre retirée » peut être compris dans un sens différent
    rationale: Le mot français « retirée » souligne plutôt l’isolement; « pièce intérieure » reflète plus directement l’intériorité exprimée par חדר בחדר, tandis que la note garde la formulation littérale et les lectures possibles.
