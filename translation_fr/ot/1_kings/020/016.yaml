base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: fr
  text: Ils sortirent à midi, tandis que Ben-Hadad buvait, ivre, dans les cabanes[a], lui et les trente-deux rois qui lui prêtaient main-forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les abris » ou « dans les pavillons ». L’hébreu dit littéralement « dans les cabanes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Ils sortirent
  rationale: Le qal wayyiqtol de יצא fait avancer le récit et décrit simplement leur sortie, dans ce contexte depuis la ville, sans ajouter une nuance militaire absente du verbe.
- source_word: בַּצָּהֳרָיִם
  choice: à midi
  rationale: Cette expression désigne le milieu du jour; « à midi » est précis et naturel en français moderne.
- source_word: וּבֶן הֲדַד
  choice: tandis que Ben-Hadad
  rationale: Le waw introduit ici naturellement une circonstance simultanée à leur sortie plutôt qu’une simple coordination.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: buvait jusqu’à s’enivrer
  rationale: Le participe שֹׁתֶה présente une action en cours, et שִׁכּוֹר en indique l’état résultant. Cette formulation française conserve l’action et l’ivresse sans préciser une boisson que l’hébreu ne nomme pas.
- source_word: בַּסֻּכּוֹת
  choice: dans les abris[a]
  rationale: סֻכּוֹת désigne des constructions légères ou temporaires. « Abris » est compréhensible et laisse ouverte leur forme exacte; la note signale les autres rendus possibles et le sens concret.
- source_word: הוּא וְהַמְּלָכִים
  choice: lui et les ... rois
  rationale: Le pronom hébreu inclut explicitement Ben-Hadad avec les rois associés; la construction française maintient cette insistance.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ
  choice: les trente-deux rois
  rationale: Le nom singulier après le nombre relève de la syntaxe hébraïque; le français exige ici le pluriel.
- source_word: עֹזֵר אֹתוֹ
  choice: qui lui prêtaient main-forte
  rationale: Le participe de עזר exprime l’aide continue apportée à Ben-Hadad. Cette locution courante convient au contexte militaire sans surinterpréter la nature exacte de l’assistance.
theological_decisions: []
