  text: וַ/יִּשְׁלַ֧ח מַלְאָכִ֛ים אֶל אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל הָ/עִֽירָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/002.yaml
  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: fr
  text: Il envoya des messagers à Achab, roi d’Israël, vers la ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la ville ». En hébreu, le mot « ville » porte une terminaison indiquant un mouvement vers la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il envoya
  rationale: Le wayyiqtol de שׁלח fait progresser le récit et se rend naturellement par un passé simple en français narratif. Le sujet masculin singulier est conservé par « Il ».
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Dans ce contexte politique et militaire, le terme désigne des agents humains chargés de transmettre un message, et non des êtres célestes.
- source_word: אֶל
  choice: auprès de
  rationale: La préposition introduit ici la personne destinataire de l’envoi. « Auprès de » s’accorde naturellement avec la destination géographique déjà exprimée par « dans la ville » et évite une répétition lourde de « à ».
- source_word: אַחְאָב
  choice: Achab
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: La chaîne construite indique la fonction royale d’Achab. L’apposition sans article reste naturelle en français.
- source_word: הָעִירָה
  choice: dans la ville
  rationale: Le ה directionnel attaché à עִיר exprime un mouvement en direction de la ville; dans ce contexte, « dans la ville » rend naturellement l’entrée vers la destination, tout en laissant « vers la ville » comme possibilité.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au récit historique écrit. La ponctuation distingue clairement la destination géographique (« dans la ville ») du destinataire (« auprès d’Achab »), sans effacer l’ordre ni la nuance directionnelle de l’hébreu.
