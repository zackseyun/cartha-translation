base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: fr
  text: 'Pendant que ton serviteur s’affairait ici et là[a], il n’était plus là[b]. Alors le roi d’Israël lui dit : « Ainsi sera ton jugement[c] : tu l’as toi-même prononcé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faisait une chose et une autre ». L’expression hébraïque décrit quelqu’un occupé à diverses tâches ou dans diverses directions.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et il n’est pas ». L’homme placé sous sa garde n’était plus présent.'
    reason: lexical_alternative
  - marker: c
    text: Ou « ta sentence » ou « ton verdict ». Le roi applique au locuteur la règle de jugement que celui-ci vient lui-même d’énoncer.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette adresse au roi, le locuteur parle de lui-même avec déférence. « Serviteur » rend cette humilité sociale sans imposer ici le sens plus étroit d’« esclave ».
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: s’affairait ici et là
  rationale: L’expression évoque une personne occupée dans diverses directions ou à diverses tâches. Cette tournure française naturelle conserve l’idée de dispersion.
- source_word: וְהוּא אֵינֶנּוּ
  choice: l’homme avait disparu
  rationale: Littéralement, « et lui, il n’était plus là ». Le plus-que-parfait marque clairement que son absence est constatée après les occupations du serviteur, sans préciser davantage comment il est parti.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Traduction directe du titre royal.
- source_word: כֵּן מִשְׁפָּטֶךָ
  choice: Tel sera ton jugement
  rationale: La formule introduit la décision judiciaire du roi. « Jugement » maintient la portée juridique de מִשְׁפָּט, tandis que « tel sera » exprime l’application du verdict au locuteur.
- source_word: אַתָּה חָרָצְתָּ
  choice: tu l’as toi-même prononcé
  rationale: Le pronom explicite אַתָּה est emphatique. Dans ce contexte judiciaire, « prononcé » rend naturellement l’idée que l’homme a déterminé son propre jugement par ses paroles.
