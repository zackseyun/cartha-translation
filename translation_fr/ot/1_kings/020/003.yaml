source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ כֹּ֚ה אָמַ֣ר בֶּן הֲדַ֔ד כַּסְפְּ/ךָ֥ וּֽ/זְהָבְ/ךָ֖ לִֽ/י ה֑וּא וְ/נָשֶׁ֧י/ךָ וּ/בָנֶ֛י/ךָ הַ/טּוֹבִ֖ים לִ/י הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: fr
  text: 'Il lui dit : « Ainsi parle Ben-Hadad : Ton argent et ton or sont à moi ; tes femmes et tes fils, les meilleurs[a], sont à moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’adjectif hébreu peut aussi signifier « bons », « beaux » ou « les plus précieux » dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Il lui dit
  rationale: Le wayyiqtol de אמר avec le complément indirect לוֹ introduit normalement une parole dans le récit ; « Il lui dit » est direct et naturel en français.
- source_word: כֹּה אָמַר
  choice: Ainsi parle
  rationale: Cette formule solennelle introduit le message transmis au nom d’un souverain. Le présent français conserve la force actuelle de la proclamation dans le récit.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Translittération française claire du nom propre, avec un trait d’union.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: Ton argent et ton or
  rationale: Le rendu conserve les deux biens concrets nommés en hébreu, sans généraliser le premier en « richesses ».
- source_word: לִי הוּא
  choice: sont à moi
  rationale: Malgré le pronom hébreu singulier après le sujet composé, la phrase revendique la possession des deux biens ; le pluriel est requis en français.
- source_word: וְנָשֶׁיךָ
  choice: tes femmes
  rationale: Dans ce contexte familial et possessif, נָשִׁים désigne les épouses. « Tes femmes » est l’expression française biblique et historique naturelle pour les multiples épouses d’un roi.
- source_word: וּבָנֶיךָ
  choice: tes fils
  rationale: בָּנִים désigne ici les descendants masculins ; « fils » maintient cette précision.
- source_word: הַטּוֹבִים
  choice: les meilleurs
  rationale: 'L’adjectif masculin pluriel se rapporte aux fils et peut avoir ici une valeur superlative ou qualitative : les meilleurs, les plus beaux ou les plus précieux. La mise en apposition respecte l’ordre hébreu et évite de décider sans nécessité si seuls certains fils sont réclamés.'
- source_word: לִי הֵם
  choice: sont à moi
  rationale: La répétition de la revendication possessive reproduit l’insistance et le parallélisme de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, solennel et accessible. « Ainsi parle » conserve le caractère officiel de la formule de messager, tandis que la répétition de « sont à moi » maintient la menace catégorique du discours. La ponctuation appositive autour de « les meilleurs » préserve autant que possible la syntaxe et l’ambiguïté de l’hébreu.
