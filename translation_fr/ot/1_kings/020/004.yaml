base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: fr
  text: 'Le roi d’Israël répondit : « Comme tu l’as dit, mon seigneur le roi, je suis à toi, ainsi que tout ce qui m’appartient. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: Le roi d’Israël répondit
  rationale: La tournure hébraïque associe « répondre » et « dire ». En français narratif moderne, « répondit » exprime naturellement l’ensemble sans le lourd pléonasme « répondit et dit ».
- source_word: כִּדְבָרְךָ
  choice: Comme tu l’as dit
  rationale: Cette formulation française naturelle rend כְּ (« comme, selon ») et דָּבָר (« parole, chose dite »), tout en conservant l’assentiment déférent du roi.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: אֲדֹנִי désigne ici un supérieur humain et constitue une formule de cour. « Mon seigneur » préserve la déférence sans suggérer un titre divin.
- source_word: לְךָ אֲנִי
  choice: je suis à toi
  rationale: Le datif לְךָ exprime ici l’appartenance ou la soumission. « Je suis à toi » conserve la brièveté et la force de la déclaration hébraïque.
- source_word: וְכָל אֲשֶׁר לִי
  choice: ainsi que tout ce qui m’appartient
  rationale: La formulation rend explicitement l’idée possessive de לִי et reproduit la portée globale de כָּל אֲשֶׁר, dans un français clair et digne.
theological_decisions:
- issue: Valeur de אֲדֹנִי adressé à un roi humain
  choice: mon seigneur
  alternative: mon maître
  rationale: Le contexte identifie un titre de déférence envers Ben-Hadad, non une désignation divine. « Mon seigneur » convient au registre royal et évite d’introduire une portée théologique absente du texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formule hébraïque redondante « répondit et dit » est condensée conformément à l’usage narratif français, tandis que le ton de capitulation et de déférence demeure intact.
