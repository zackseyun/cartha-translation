review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les serviteurs conseillent à Ben-Hadad de se présenter en suppliants au roi d’Israël dans l’espoir d’avoir la vie sauve. Toutefois, « Écoute » ne rend pas naturellement הִנֵּה־נָא dans cette réplique; la formule signifie plutôt « Voici donc / Nous avons entendu dire ». « sacs » est également trop littéral et ambigu en français moderne pour les vêtements de deuil : « sacs de toile » est plus clair sans explicitation excessive.'
  naturalness: La syntaxe est fluide et le registre convient. « Peut-être te laissera-t-il la vie » est intelligible, mais « il t’épargnera peut-être la vie » est plus idiomatique, tout en rendant précisément l’idée de laisser vivre.
  terminology: « rois compatissants » peut rendre מַלְכֵי חֶסֶד dans ce contexte, mais « rois cléments » est plus idiomatique en français pour une clémence attendue d’un souverain envers un ennemi vaincu. Les cordes et les sacs de toile doivent rester concrets, sans leur attribuer une signification rituelle dans le texte.
  issues:
  - severity: medium
    issue: Rendu de הִנֵּה נָא par « Écoute »
    rationale: L’hébreu introduit une constatation ou une proposition avec insistance polie (« voici donc / nous avons entendu dire »), et non un appel direct à écouter. « Écoute » change légèrement la fonction discursive.
  - severity: medium
    issue: « des sacs » pour שַׂקִּים
    rationale: En français contemporain, « sacs autour de notre taille » évoque d’abord des contenants. « sacs de toile » maintient l’objet vestimentaire austère visé par le contexte et reste naturel.
  - severity: low
    issue: « te laissera-t-il la vie »
    rationale: La tournure est possible, mais « t’épargnera peut-être la vie » est plus naturelle et rend clairement l’idiome hébreu « faire vivre ta personne ».
