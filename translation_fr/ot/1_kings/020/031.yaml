  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: fr
  text: 'Ses serviteurs lui dirent : « Nous avons entendu dire que les rois d’Israël sont des rois cléments. Mettons donc des sacs de toile autour de nos reins et des cordes sur nos têtes, puis allons vers le roi d’Israël. Peut-être t’épargnera-t-il la vie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Écoute
  rationale: Cette formule attire avec insistance l’attention de l’interlocuteur. En français actuel, « Écoute » en restitue naturellement la fonction sans le littéralisme raide de « Voici, je te prie ».
- source_word: מַלְכֵי בֵּית יִשְׂרָאֵל
  choice: les rois d’Israël
  rationale: « Maison d’Israël » désigne ici le royaume ou la dynastie d’Israël; la formulation abrégée est naturelle et non ambiguë dans ce contexte.
- source_word: מַלְכֵי חֶסֶד
  choice: des rois compatissants
  rationale: חֶסֶד évoque ici la bienveillance et la clémence attendues d’un vainqueur. « Compatissants » conserve la caractérisation personnelle sans surcharger le texte d’un sens doctrinal.
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: des sacs autour de notre taille
  rationale: Les sacs sont portés comme signes d’humiliation et de supplication; « autour de notre taille » rend précisément la construction hébraïque.
- source_word: וַחֲבָלִים בְּרֹאשֵׁנוּ
  choice: des cordes autour de notre tête
  rationale: Traduction concrète de l’image hébraïque, sans expliquer au-delà du texte la fonction symbolique des cordes.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: te laissera-t-il la vie
  rationale: L’expression signifie ici épargner la vie de Ben-Hadad. Cette tournure française rend clairement l’idiome tout en conservant l’incertitude exprimée par אוּלַי.
theological_decisions:
- issue: Portée de חֶסֶד appliqué aux rois d’Israël
  choice: compatissants
  alternative: miséricordieux / bienveillants
  rationale: Le contexte porte sur la clémence politique envers un ennemi vaincu, non sur une affirmation théologique particulière. « Compatissants » maintient cette portée contextuelle.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Les impératifs délibératifs hébreux sont rendus par « Mettons » et « allons », et la répétition de נָא par « donc », afin d’exprimer la supplication sans lourdeur archaïque.
