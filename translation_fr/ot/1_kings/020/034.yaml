  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: fr
  text: 'Il lui dit : « Je te rendrai les villes que mon père a prises à ton père, et tu pourras établir des rues à ton usage[a] à Damas, comme mon père l’avait fait à Samarie. » « Quant à moi, je te laisserai partir en vertu de ce traité[b]. » Il conclut donc un traité[c] avec lui et le laissa partir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des marchés » ou « des quartiers ». Le mot hébreu signifie littéralement « rues » ou « espaces ouverts » et peut désigner ici des secteurs commerciaux accordés par traité.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le cadre de cette alliance ». Le mot hébreu peut désigner une alliance ou un traité ; il s’agit ici d’un accord politique entre rois.
    reason: alternative_reading
  - marker: c
    text: L’hébreu dit littéralement « coupa une alliance [ou un traité] », expression consacrée qui signifie conclure formellement un accord contraignant.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: les villes
  rationale: עִיר désigne couramment une ville ou une cité ; le contexte concerne la restitution de territoires urbains entre rois.
- source_word: לָקַח ... אָשִׁיב
  choice: a prises ... rendrai
  rationale: Cette paire verbale exprime la prise de possession puis sa restitution. « Rendre » est naturel en français diplomatique et conserve clairement le mouvement inverse.
- source_word: וְחוּצוֹת
  choice: tes propres rues
  rationale: חוּצוֹת désigne littéralement des rues ou des espaces ouverts. Dans ce traité, le mot peut viser des secteurs commerciaux ou des quartiers bénéficiant de droits particuliers ; le texte retient le sens concret et la note conserve les autres possibilités.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: tu pourras établir tes propres rues à Damas
  rationale: שׂים signifie placer ou établir. La tournure française exprime ici l’autorisation d’aménager ou d’instituer des espaces urbains réservés.
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: comme mon père en avait établi à Samarie
  rationale: Le pronom « en » reprend naturellement « rues » en français, tandis que le plus-que-parfait marque l’antériorité de l’accord précédent.
- source_word: בַּבְּרִית
  choice: aux termes d’un traité
  rationale: בְּרִית désigne ici un accord politique entre rois. « Aux termes d’un traité » rend naturellement le rapport entre l’accord et la libération sans imposer une valeur théologique.
- source_word: אֲשַׁלְּחֶךָּ
  choice: je te laisserai partir
  rationale: Dans ce contexte, le verbe indique que le roi captif sera relâché après l’accord.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: il conclut donc un traité avec lui
  rationale: כרת ברית est l’expression hébraïque habituelle pour conclure formellement une alliance ou un traité. « Conclure un traité » est l’équivalent idiomatique français.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: et le laissa partir
  rationale: La formulation reprend la promesse précédente et en rapporte l’exécution.
theological_decisions:
- issue: Sens de בְּרִית dans un accord politique entre deux rois
  choice: traité
  alternative: alliance
  rationale: Le contexte est celui d’un accord diplomatique interétatique. « Traité » en communique directement la fonction, tandis que « alliance », sens lexical également possible, est signalé en note afin de préserver le lien sémantique sans charger indûment le passage.
- issue: Changement de locuteur avant וַאֲנִי
  choice: conserver une nouvelle réplique sans ajouter explicitement le nom d’Achab
  alternative: 'Achab répondit : « Quant à moi… »'
  rationale: Le pronom emphatique « quant à moi » et le sens du dialogue indiquent un changement de locuteur, mais le texte hébreu n’introduit pas explicitement Achab par un verbe de parole. La ponctuation rend le changement perceptible sans ajouter une identification absente du texte.
translation_notes:
  register: Français international actuel, digne et lisible. Le dialogue conserve la transition abrupte de l’hébreu entre les deux locuteurs, tout en la rendant visible par deux citations distinctes. « Établir » convient au cadre de concessions urbaines et diplomatiques ; les sens plus précis possibles de חוּצוֹת restent en note.
