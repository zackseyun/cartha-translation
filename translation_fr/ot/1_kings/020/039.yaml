source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/מֶּ֨לֶךְ֙ עֹבֵ֔ר וְ/ה֖וּא צָעַ֣ק אֶל הַ/מֶּ֑לֶךְ וַ/יֹּ֜אמֶר עַבְדְּ/ךָ֣ יָצָ֣א בְ/קֶֽרֶב הַ/מִּלְחָמָ֗ה וְ/הִנֵּֽה אִ֨ישׁ סָ֜ר וַ/יָּבֵ֧א אֵלַ֣/י אִ֗ישׁ וַ/יֹּ֨אמֶר֙ שְׁמֹר֙ אֶת הָ/אִ֣ישׁ הַ/זֶּ֔ה אִם הִפָּקֵד֙ יִפָּקֵ֔ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ א֥וֹ כִכַּר כֶּ֖סֶף תִּשְׁקֽוֹל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: fr
  text: 'Comme le roi passait, il lui cria et dit : « Ton serviteur est allé au cœur du combat. Et voici qu’un homme s’est écarté et m’a amené un autre homme en disant : “Garde cet homme. S’il venait vraiment à manquer[a], ta vie sera à la place de la sienne[b], ou bien tu pèseras un talent d’argent.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe par un infinitif absolu : « s’il venait effectivement à manquer » ou « s’il était de quelque manière introuvable » .'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ta vie à la place de sa vie », formule juridique exprimant une substitution.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: passait
  rationale: Le participe, associé à ויהי, présente une action en cours à l’arrière-plan ; « comme le roi passait » rend naturellement cet aspect duratif.
- source_word: צָעַק
  choice: cria
  rationale: Le verbe exprime un appel puissant et pressant ; « cria » conserve cette intensité sans préciser davantage le ton.
- source_word: עַבְדְּךָ
  choice: Ton serviteur
  rationale: Dans une adresse au roi, il s’agit d’une formule de déférence ; « ton serviteur » est idiomatique et convient mieux ici que « ton esclave ».
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: au cœur du combat
  rationale: Cette expression actuelle et vive conserve l’idée d’être au milieu même des affrontements.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: La formule préserve l’effet de présentation vive du récit tout en restant naturelle dans un registre narratif digne.
- source_word: אִישׁ סָר
  choice: un homme s’est écarté
  rationale: סוּר signifie se détourner ou s’écarter ; la formulation reste proche du texte sans préciser de quoi l’homme s’est écarté.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: m’a amené un autre homme
  rationale: Le second אִישׁ est l’objet de « amener ». « Un autre homme » clarifie en français qu’il s’agit de deux hommes distincts, ce que la syntaxe hébraïque implique.
- source_word: שְׁמֹר
  choice: Garde
  rationale: L’impératif désigne ici la mise sous surveillance ou en détention ; « garde » est concis et adapté au contexte militaire.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: S’il venait vraiment à manquer
  rationale: Le verbe au niphal exprime le fait d’être absent ou introuvable, et l’infinitif absolu renforce l’énoncé ; « vraiment » rend cette insistance.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: ta vie prendra la place de la sienne
  rationale: נֶפֶשׁ désigne ici la vie, tandis que תַּחַת marque la substitution ; cette traduction conserve explicitement la formule juridique.
- source_word: כִּכַּר כֶּסֶף
  choice: un talent d’argent
  rationale: « Talent » est l’équivalent conventionnel de cette ancienne unité de poids et conserve la mesure du texte source.
- source_word: תִּשְׁקוֹל
  choice: tu pèseras
  rationale: Le verbe signifie littéralement « peser » et rappelle que l’argent était acquitté au poids ; il est préférable à un simple « tu paieras ».
theological_decisions:
- issue: Portée de נֶפֶשׁ dans la formule de substitution
  choice: « ta vie prendra la place de la sienne »
  alternative: « ton âme prendra la place de son âme »
  rationale: Dans ce contexte pénal, נֶפֶשׁ renvoie à la vie de la personne, non à une distinction théologique entre âme et corps. La formulation retenue préserve la logique de substitution sans importer une anthropologie étrangère au passage.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours de cour conserve « ton serviteur ». « Et voici que » maintient la vivacité du récit, tandis que « au cœur du combat » évite une tournure inutilement archaïque. Les deux notes sont placées exactement après les expressions qu’elles éclairent.
