    rationale: L’hébreu emploie « ta vie sera à la place de sa vie ». Employer « sera » conserve mieux la structure et le caractère de sanction juridique, sans ajout interprétatif.
  - severity: low
    issue: « Il cria vers lui » est moins naturel en français contemporain.
    rationale: « Il lui cria » exprime directement le datif de l’hébreu et s’intègre mieux au récit.
