  text: וַ/יֵּצְא֗וּ נַעֲרֵ֛י שָׂרֵ֥י הַ/מְּדִינ֖וֹת בָּ/רִֽאשֹׁנָ֑ה וַ/יִּשְׁלַ֣ח בֶּן הֲדַ֗ד וַ/יַּגִּ֤ידוּ ל/וֹ֙ לֵ/אמֹ֔ר אֲנָשִׁ֕ים יָצְא֖וּ מִ/שֹּׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: fr
  text: 'Les jeunes gens des chefs des provinces sortirent les premiers. Ben-Hadad envoya des hommes[a], et ceux-ci lui firent ce rapport : « Des hommes sont sortis de Samarie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « envoya », sans indiquer qui Ben-Hadad envoya. La suite montre que plusieurs personnes lui firent un rapport.
    reason: complément implicite
lexical_decisions:
- source_word: נַעֲרֵי
  choice: les jeunes gens de
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. « Jeunes gens » conserve son sens premier sans exclure ici leur fonction militaire auprès des chefs.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: les chefs des provinces
  rationale: Le groupe construit désigne les dirigeants ou commandants rattachés aux provinces. « Chefs des provinces » reste proche de la formulation hébraïque tout en étant naturel en français.
- source_word: בָּרִאשֹׁנָה
  choice: les premiers
  rationale: L’adverbe marque la priorité dans l’ordre de sortie. L’accord français avec le sujet pluriel exige « les premiers », sans préciser davantage la tactique militaire.
- source_word: וַיִּשְׁלַח
  choice: envoya des hommes
  rationale: Le verbe signifie simplement « envoya » et son complément n’est pas exprimé. Le pluriel du verbe suivant implique cependant des personnes chargées de rapporter ce qu’elles ont vu; « des hommes » explicite sobrement ce complément sans les qualifier de manière certaine comme éclaireurs.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: et ceux-ci lui firent ce rapport
  rationale: La tournure rend naturellement en français le verbe de déclaration suivi du contenu rapporté. « Ceux-ci » identifie les envoyés comme sujets du pluriel hébreu.
- source_word: אֲנָשִׁים
  choice: Des hommes
  rationale: Le nom masculin pluriel désigne ici vraisemblablement les combattants ou envoyés sortant de la ville; la traduction conserve cette désignation.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: sont sortis de Samarie
  rationale: Le parfait présente la sortie comme accomplie au moment du rapport. « Sortir de Samarie » est idiomatique et fidèle au mouvement depuis la ville.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Transcription française courante du nom propre.
