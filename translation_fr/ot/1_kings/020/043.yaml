base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/043.yaml
  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: fr
  text: Le roi d’Israël s’en alla donc chez lui, sombre et irrité[a], et il arriva à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plein de ressentiment et irrité ». Les deux termes hébreux associent un profond mécontentement à une vive irritation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: repartit
  rationale: Dans ce contexte narratif, le verbe indique que le roi s’en va après la parole de condamnation; « repartit » exprime naturellement ce départ en français.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Rendu direct et idiomatique de la chaîne construite hébraïque.
- source_word: עַל בֵּיתוֹ
  choice: chez lui
  rationale: Avec un verbe de mouvement, עַל peut désigner la destination. « Chez lui » rend naturellement l’idée de retourner à sa résidence sans préciser indûment « palais ».
- source_word: סַר
  choice: sombre
  rationale: Dans la paire סַר וְזָעֵף, le terme évoque une disposition intérieure renfrognée ou pleine de ressentiment; « sombre » reste naturel et digne en français.
- source_word: וְזָעֵף
  choice: et furieux
  rationale: Le terme exprime une vive irritation ou colère visible. « Furieux » distingue nettement ce second trait du premier.
- source_word: וַיָּבֹא
  choice: et il arriva
  rationale: Le verbe בוא marque ici l’aboutissement du déplacement; « arriva » convient mieux que le déictique français « vint » sans point d’observation explicite.
- source_word: שֹׁמְרוֹנָה
  choice: à Samarie
  rationale: Le hé directionnel marque un mouvement vers Samarie, rendu naturellement par « à » après « arriver ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve les deux qualificatifs hébreux sans les réduire à un seul état affectif; « chez lui » évite de transformer explicitement la maison royale en « palais ».
