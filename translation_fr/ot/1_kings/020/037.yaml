  text: וַ/יִּמְצָא֙ אִ֣ישׁ אַחֵ֔ר וַ/יֹּ֖אמֶר הַכֵּ֣י/נִי נָ֑א וַ/יַּכֵּ֥/הוּ הָ/אִ֖ישׁ הַכֵּ֥ה וּ/פָצֹֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/037.yaml
  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: fr
  text: 'Puis il trouva un autre homme et lui dit : « Frappe-moi, je t’en prie. » L’homme le frappa et le blessa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce l’action par une tournure répétitive, littéralement : « l’homme le frappa, frappant et blessant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Puis il trouva
  rationale: La forme narrative fait avancer le récit. « Puis » marque naturellement la succession sans ajouter de lien causal.
- source_word: אִישׁ אַחֵר
  choice: un autre homme
  rationale: Cette expression désigne directement un second homme, distinct de celui du verset précédent.
- source_word: הַכֵּינִי נָא
  choice: Frappe-moi, je t’en prie
  rationale: L’impératif de נכה avec le suffixe de première personne signifie « frappe-moi » ; נָא donne à la demande une nuance d’insistance courtoise, rendue par « je t’en prie ».
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: L’homme le frappa
  rationale: La traduction conserve le sujet explicite et le pronom objet du texte hébreu dans un ordre français naturel.
- source_word: הַכֵּה וּפָצֹעַ
  choice: et le blessa
  rationale: 'Les formes absolues précisent et renforcent l’action : l’homme frappe effectivement le prophète et le blesse. La formulation française évite une répétition maladroite tout en conservant le résultat concret.'
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Je t’en prie » rend la particule de supplication dans un registre digne et naturel ; « frappa » convient mieux que le plus familier « tapa » à la gravité de la scène.
