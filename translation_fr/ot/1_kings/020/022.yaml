base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: fr
  text: 'Alors le prophète s’approcha du roi d’Israël et lui dit : « Va, fortifie-toi, réfléchis bien à ce que tu dois faire[a], car, au retour de l’année[b], le roi d’Aram[c] montera contre toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que tu feras ». La forme hébraïque est littéralement au futur, mais elle peut avoir ici le sens pratique de ce que le roi doit faire pour se préparer.
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque désignant le retour ou le renouvellement de l’année, souvent compris comme la saison où reprenaient les campagnes militaires; on traduit parfois « au printemps prochain ».
    reason: cultural_note
  - marker: c
    text: Traditionnellement « le roi de Syrie »; l’hébreu porte « Aram ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Le verbe נגשׁ exprime l’action de s’approcher; cette traduction est précise et naturelle dans un récit français.
- source_word: הִתְחַזַּק
  choice: fortifie-toi
  rationale: L’impératif au hitpael a une valeur réflexive et appelle ici le roi à affermir sa position et à se préparer.
- source_word: וְדַע וּרְאֵה
  choice: réfléchis bien
  rationale: La paire littérale « sache et vois » constitue ici une invitation à examiner attentivement la situation. « Réfléchis bien » en restitue naturellement la force pratique sans introduire une action étrangère au contexte.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: à ce que tu dois faire
  rationale: La forme hébraïque est littéralement future (« ce que tu feras »), mais le contexte d’exhortation permet une nuance délibérative ou pratique; l’ambiguïté est signalée en note.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: au retour de l’année
  rationale: Cette formulation conserve l’image de l’hébreu et son idiome temporel, expliqué en note pour le lecteur moderne.
- source_word: מֶלֶךְ אֲרָם
  choice: le roi d’Aram
  rationale: « Aram » correspond directement au nom hébreu, sans lui substituer l’appellation traditionnelle et plus tardive « Syrie ».
- source_word: עֹלֶה עָלֶיךָ
  choice: montera contre toi
  rationale: Dans ce contexte militaire, עלה על décrit la marche d’une armée contre un adversaire. Le présent participial hébreu prend ici une portée future imminente en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La coordination hébraïque littérale « sache et vois » est rendue idiomatiquement par « réfléchis bien »; l’image militaire de « monter contre » et l’expression temporelle « retour de l’année » sont conservées.
