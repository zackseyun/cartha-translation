source:
  edition: WLC
  text: וַֽ/יְהִי֙ לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֔ה וַ/יִּפְקֹ֥ד בֶּן הֲדַ֖ד אֶת אֲרָ֑ם וַ/יַּ֣עַל אֲפֵ֔קָ/ה לַ/מִּלְחָמָ֖ה עִם יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: fr
  text: Au retour de l’année[a], Ben-Hadad mobilisa les forces d’Aram[b] et monta à Afek pour livrer bataille à Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au retour de l’année », expression désignant le moment où le cycle annuel recommence. Certains traduisent : « au printemps ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les Araméens ». En hébreu, « Aram » peut désigner le royaume aussi bien que son peuple ou son armée.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « contre Israël ». La préposition hébraïque signifie littéralement « avec », ici dans un contexte de combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: Au retour de l’année
  rationale: Cette formulation conserve l’image de l’hébreu, celle du cycle annuel qui revient, sans préciser qu’il s’agit du printemps, ce que le contexte peut suggérer sans l’énoncer explicitement.
- source_word: וַיִּפְקֹד
  choice: mobilisa
  rationale: Dans un contexte militaire, פקד désigne ici l’action de recenser, passer en revue ou rassembler les troupes. « Mobilisa » exprime naturellement cette préparation militaire.
- source_word: אֶת אֲרָם
  choice: les forces d’Aram
  rationale: Le texte nomme littéralement Aram, mais le verbe militaire indique que le royaume est envisagé sous l’aspect de ses hommes ou de son armée. Cette formulation garde le nom ancien tout en rendant la métonymie intelligible.
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie normalement « monter ». Le conserver respecte le mouvement exprimé sans décider s’il est principalement topographique ou militaire.
- source_word: אֲפֵקָה
  choice: à Afek
  rationale: Le ה directionnel attaché au nom indique un déplacement vers Afek, rendu naturellement en français par « à Afek » après « monta ».
- source_word: לַמִּלְחָמָה
  choice: pour livrer bataille
  rationale: Le nom מִלְחָמָה désigne la guerre ou le combat. Dans le récit de cette campagne, « livrer bataille » est précis et idiomatique.
- source_word: עִם יִשְׂרָאֵל
  choice: à Israël
  rationale: La préposition עִם signifie littéralement « avec », mais, associée à « livrer bataille », le français emploie naturellement « à » pour désigner l’adversaire.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve le nom historique « Aram » et l’image hébraïque du retour de l’année, tandis que « mobilisa les forces » et « livrer bataille » rendent clairement le contexte militaire.
