  text: וְ/הָיָ֗ה הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב חֲזָאֵ֖ל יָמִ֣ית יֵה֑וּא וְ/הַ/נִּמְלָ֛ט מֵ/חֶ֥רֶב יֵה֖וּא יָמִ֥ית אֱלִישָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: fr
  text: Il arrivera que quiconque échappera à l’épée de Hazaël, Jéhu le mettra à mort ; et quiconque échappera à l’épée de Jéhu, Élisée le mettra à mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Élisée le fera mourir ». Le verbe hébreu est causatif. Dans ce contexte, l’action d’Élisée peut être comprise comme directe ou comme le jugement exercé par l’intermédiaire de son ministère prophétique.
    reason: Préciser la nuance causative du verbe et préserver l’ambiguïté concernant la manière dont Élisée exerce ce jugement.
lexical_decisions:
- source_word: וְהָיָה
  choice: Alors
  rationale: La formule hébraïque introduit ici le résultat futur annoncé. « Alors » en rend naturellement la fonction narrative et prospective sans reproduire lourdement l’idiome mot à mot.
- source_word: הַנִּמְלָט / וְהַנִּמְלָט
  choice: quiconque échappera / et quiconque échappera
  rationale: Le participe défini est employé comme substantif avec une portée générale. « Quiconque » exprime clairement cette valeur indéfinie en français moderne.
- source_word: מֵחֶרֶב
  choice: à l’épée de
  rationale: L’image concrète de l’épée est conservée, car elle désigne ici la force meurtrière ou le jugement armé associé à Hazaël puis à Jéhu. Après « échapper », le français idiomatique demande « échapper à ».
- source_word: חֲזָאֵל
  choice: Hazaël
  rationale: Transcription française usuelle du nom propre.
- source_word: יָמִית
  choice: mettra à mort
  rationale: Le hiphil de מות a une valeur causative. « Mettre à mort » conserve cette force agentive et le parallélisme des deux propositions, tout en restant naturel et digne.
- source_word: יֵהוּא
  choice: Jéhu
  rationale: Transcription française usuelle du nom propre.
- source_word: אֱלִישָׁע
  choice: Élisée
  rationale: Forme française traditionnelle et largement reconnue du nom propre biblique.
theological_decisions:
- issue: Rôle d’Élisée dans la mise à mort
  choice: Conserver l’énoncé direct selon lequel Élisée mettra à mort ceux qui auront échappé à Jéhu.
  alternative: Comprendre cette action comme le jugement produit ou annoncé par le ministère prophétique d’Élisée, plutôt que comme une mise à mort accomplie personnellement.
  rationale: La syntaxe hébraïque présente directement Hazaël, Jéhu et Élisée comme agents dans une série parallèle. Le texte principal ne doit pas atténuer cette tension. La possibilité d’une action exercée par l’intermédiaire du ministère prophétique est signalée en note.
translation_notes:
  register: Français international moderne, clair et soutenu. La répétition de « quiconque échappera » et de « mettra à mort » préserve le parallélisme solennel de l’hébreu. Le point-virgule distingue les deux volets étroitement liés de l’annonce.
