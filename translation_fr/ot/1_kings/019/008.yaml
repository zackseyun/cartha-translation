  text: וַ/יָּ֖קָם וַ/יֹּ֣אכַל וַ/יִּשְׁתֶּ֑ה וַ/יֵּ֜לֶךְ בְּ/כֹ֣חַ הָ/אֲכִילָ֣ה הַ/הִ֗יא אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה עַ֛ד הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: fr
  text: Il se leva donc, mangea et but. Fortifié par cette nourriture[a], il marcha pendant quarante jours et quarante nuits jusqu’à l’Horeb, la montagne de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la force de cette nourriture » ou « de ce repas ». L’expression hébraïque désigne les forces qu’il reçut de ce qu’il avait mangé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֹּאכַל וַיִּשְׁתֶּה
  choice: Il se leva donc, mangea et but
  rationale: Les formes narratives successives font avancer le récit. « Se leva », « mangea » et « but » rendent directement les verbes hébreux; « donc » exprime ici l’enchaînement avec le contexte sans alourdir la phrase par plusieurs « et ».
- source_word: וַיֵּלֶךְ
  choice: il marcha
  rationale: הלך signifie fondamentalement « aller, marcher ». Avec une durée de quarante jours et quarante nuits, « marcha » exprime naturellement le déplacement prolongé sans ajouter l’idée plus précise d’une expédition.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: Fortifié par cette nourriture
  rationale: L’expression signifie qu’il poursuivit sa route grâce aux forces reçues de ce qu’il avait mangé. Cette formulation française naturelle conserve le lien causal entre la nourriture et la force, tandis que la note signale la tournure plus littérale.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: pendant quarante jours et quarante nuits
  rationale: La préposition « pendant » rend explicite la valeur de durée que la syntaxe hébraïque exprime sans préposition.
- source_word: עַד הַר הָאֱלֹהִים חֹרֵב
  choice: jusqu’à l’Horeb, la montagne de Dieu
  rationale: עַד marque ici le terme du déplacement. L’apposition française conserve l’ordre final du nom « Horeb » tout en rendant clairement le rapport entre ce lieu et « la montagne de Dieu ».
theological_decisions:
- issue: Sens de הָאֱלֹהִים dans הַר הָאֱלֹהִים
  choice: Dieu
  alternative: divine
  rationale: Dans cette désignation biblique établie de l’Horeb, אֱלֹהִים renvoie naturellement à Dieu. « La montagne de Dieu » conserve la formulation solennelle et l’association du lieu avec le Dieu d’Israël sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est divisée en deux pour éviter une accumulation peu naturelle de coordinations. « L’Horeb » suit l’usage français courant pour ce nom de montagne.
