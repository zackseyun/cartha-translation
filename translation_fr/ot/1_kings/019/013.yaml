base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: fr
  text: 'Quand Élie l’entendit[a], il se couvrit le visage de son manteau, sortit et se tint à l’entrée de la grotte. Et voici qu’une voix lui dit : « Que fais-tu ici[b], Élie ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le complément du verbe « entendit » reste sous-entendu. Le contexte renvoie à ce qui vient d’être décrit, souvent compris comme le son ou la voix du verset précédent.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « Qu’y a-t-il pour toi ici ? » Cette expression hébraïque demande à Élie ce qu’il fait en ce lieu ou ce qui l’y amène.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Quand Élie l’entendit
  rationale: La préposition כְּ avec l’infinitif construit introduit ici une proposition temporelle. Le pronom « l’ » rend naturellement en français l’objet sous-entendu par l’hébreu, sans préciser s’il s’agit du son ou de la voix évoqués dans le contexte immédiat.
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: il s’enveloppa le visage dans son manteau
  rationale: Le verbe exprime l’action de couvrir ou d’envelopper étroitement. « Manteau » désigne de façon claire et actuelle le vêtement extérieur distinctif appelé אַדֶּרֶת.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: sortit et se tint
  rationale: Ces verbes décrivent simplement la sortie de la grotte puis la position prise par Élie. « Se tint » restitue mieux l’action de prendre place que le statique « était debout ».
- source_word: פֶּתַח הַמְּעָרָה
  choice: à l’entrée de la grotte
  rationale: פֶּתַח désigne l’ouverture ou l’entrée. « Entrée » est précis et naturel en français moderne.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette tournure conserve la fonction de présentation vive de הִנֵּה sans ajouter l’idée de soudaineté.
- source_word: אֵלָיו קוֹל וַיֹּאמֶר
  choice: une voix lui dit
  rationale: La proposition nominale « vers lui, une voix », suivie de « et elle dit », est rendue par une formulation française naturelle qui conserve l’absence d’identification explicite de la voix dans ce verset.
- source_word: מַה לְּךָ פֹה
  choice: Que fais-tu ici
  rationale: L’expression idiomatique interroge Élie sur ce qui l’amène ou l’occupe en ce lieu. Cette formulation française en restitue la portée sans la réduire à son seul motif.
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: La forme française traditionnelle et courante du nom biblique est employée.
theological_decisions:
- issue: Objet sous-entendu du verbe « entendre »
  choice: l’entendit
  alternative: entendit cela ; entendit le son ; entendit la voix
  rationale: L’hébreu ne formule aucun objet, mais le contexte immédiat en fournit un. Le pronom minimal « l’ » produit une phrase française naturelle tout en évitant de décider si Élie entend le son mentionné auparavant ou une voix divine.
- issue: Identité de la voix
  choice: une voix
  alternative: la voix du Seigneur
  rationale: Le verset dit seulement קוֹל, « une voix », sans en nommer explicitement la source. La traduction maintient cette formulation et laisse le contexte guider l’interprétation.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant la présentation vive de הִנֵּה, l’objet implicite après « entendre » et l’identité non précisée de la voix.
