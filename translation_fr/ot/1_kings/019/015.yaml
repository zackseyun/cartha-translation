    rationale: « Tu donneras l’onction à Hazaël » est une paraphrase administrative qui ne rend pas aussi directement le verbe hébreu מָשַׁח, « oindre ».
  - severity: low
    issue: Formulation de l’investiture inutilement explicitée
    rationale: « Pour qu’il soit roi sur Aram » introduit une subordonnée de but absente de la formule hébraïque. « Comme roi d’Aram » reproduit plus directement la fonction conférée.
  - severity: low
    issue: Expression du trajet lourde
    rationale: « Retourne par ton chemin vers » est compréhensible, mais « reprends ta route vers » est plus naturel tout en conservant l’idée de retour et de chemin.
