  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו לֵ֛ךְ שׁ֥וּב לְ/דַרְכְּ/ךָ֖ מִדְבַּ֣רָ/ה דַמָּ֑שֶׂק וּ/בָ֗אתָ וּ/מָשַׁחְתָּ֧ אֶת חֲזָאֵ֛ל לְ/מֶ֖לֶךְ עַל אֲרָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: fr
  text: 'Yahweh lui dit : « Va, reprends ta route vers le désert de Damas[a]. Quand tu y seras arrivé, tu oindras Hazaël comme roi d’Aram[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « en direction du désert de Damas ». En hébreu, le mot « désert » porte une terminaison indiquant la direction.'
    reason: lexical_alternative
  - marker: b
    text: Aram est le nom hébreu du pays souvent appelé « Syrie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: לֵךְ שׁוּב
  choice: Va, retourne
  rationale: Les deux impératifs hébreux sont conservés, tout en restant naturels en français.
- source_word: לְדַרְכְּךָ
  choice: par ton chemin
  rationale: Cette formulation rend la voie ou l’itinéraire propre à Élie sans préciser plus que l’hébreu qu’il s’agit exactement du même trajet.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: vers le désert de Damas
  rationale: La finale directive de מִדְבָּרָה exprime un mouvement en direction du désert associé à Damas.
- source_word: וּבָאתָ
  choice: Quand tu y seras arrivé
  rationale: Le parfait avec waw poursuit la séquence prescrite; la subordonnée temporelle exprime naturellement que l’onction aura lieu après l’arrivée.
- source_word: וּמָשַׁחְתָּ
  choice: tu donneras l’onction à
  rationale: Cette expression française actuelle conserve l’acte concret et officiel de l’onction sans recourir au verbe moins courant « oindre ».
- source_word: חֲזָאֵל
  choice: Hazaël
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: pour qu’il soit roi sur Aram
  rationale: La formulation conserve à la fois la finalité de l’onction et la préposition indiquant la royauté exercée sur Aram.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Portée de l’onction de Hazaël
  choice: pour qu’il soit roi sur Aram
  alternative: comme roi d’Aram
  rationale: Ce rendu maintient la relation entre l’onction et l’accession royale sans développer les implications théologiques ou politiques du mandat.
translation_notes:
  register: Français international moderne, clair et digne. Les deux impératifs sont maintenus; « donner l’onction » évite un archaïsme excessif tout en conservant le geste royal. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
