base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: fr
  text: 'Puis il se coucha et dormit sous un genêt. Et voici qu’un ange[a] le toucha et lui dit : « Lève-toi et mange. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « messager ». Le mot hébreu מַלְאָךְ peut désigner un messager humain ou un être céleste ; ici, le contexte favorise « ange ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: Puis il se coucha et s’endormit
  rationale: Les deux wayyiqtol font avancer le récit. « Se coucha » rend שׁכב, tandis que « s’endormit » exprime naturellement en français l’entrée dans le sommeil indiquée par ישׁן dans cette succession.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: sous un genêt
  rationale: רֹתֶם désigne le genêt du désert; אֶחָד a ici une valeur indéfinie, rendue naturellement par « un ».
- source_word: וְהִנֵּה זֶה
  choice: Et voici que
  rationale: Cette tournure conserve la fonction présentative et l’effet de surprise de הִנֵּה avec זֶה, sans calque maladroit.
- source_word: מַלְאָךְ
  choice: ange
  rationale: Le mot peut désigner un messager humain ou céleste. La provision surnaturelle dans le contexte favorise ici « ange », tout en maintenant « messager » en note comme possibilité lexicale.
- source_word: נֹגֵעַ בּוֹ
  choice: le toucha
  rationale: Le participe de נגע décrit le contact; dans le fil narratif français, un passé simple rend naturellement cette action ponctuelle.
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: La formulation conserve le destinataire explicite et s’intègre au récit au passé simple.
- source_word: קוּם אֱכֹל
  choice: Lève-toi et mange
  rationale: Les deux impératifs brefs sont conservés. La coordination par « et » est naturelle en français et ne développe pas davantage l’hébreu.
theological_decisions:
- issue: 'Sens de מַלְאָךְ : ange ou messager'
  choice: ange
  alternative: messager
  rationale: Le contexte immédiat et la suite du récit favorisent un être céleste, mais le terme hébreu n’impose pas lexicalement ce sens à lui seul; l’autre possibilité est donc signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme excessif; « Lève-toi » reste courant, et « voici que » préserve la vivacité du marqueur hébreu.
