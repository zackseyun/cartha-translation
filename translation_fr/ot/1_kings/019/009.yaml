base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: fr
  text: 'Il arriva à la grotte et y passa la nuit. Et voici que la parole de Yahweh lui parvint et lui dit : « Que fais-tu ici, Élie ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi es-tu ici, Élie ? » L’expression hébraïque signifie littéralement : « Qu’y a-t-il pour toi ici, Élie ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: Là, il arriva à la grotte
  rationale: Le verbe בוא exprime ici le mouvement vers la grotte. « Arriva à » est naturel en français et n’impose pas l’idée qu’il y entra, que le texte n’explicite pas nécessairement.
- source_word: וַיָּלֶן שָׁם
  choice: et y passa la nuit
  rationale: לון/לין signifie loger ou passer la nuit. Cette formulation courante conserve clairement la valeur temporelle, tandis que « y » reprend sans lourdeur le lieu indiqué.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: הִנֵּה attire vivement l’attention sur l’événement qui suit. « Voici que » en préserve la fonction narrative dans un français actuel et digne.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: La formule prophétique traditionnelle est conservée, ainsi que le nom divin personnel יְהוָה sous la forme « Yahweh ».
- source_word: וַיֹּאמֶר לוֹ
  choice: 'lui fut adressée :'
  rationale: La tournure française fait de « la parole de Yahweh » le sujet de manière naturelle et rend implicitement l’idée qu’elle lui parla, sans la répétition peu idiomatique « lui fut adressée et lui dit ».
- source_word: מַה לְּךָ פֹה
  choice: Que fais-tu ici
  rationale: L’expression hébraïque signifie littéralement « Qu’y a-t-il pour toi ici ? ». En contexte, « Que fais-tu ici ? » rend naturellement la question portant sur la présence d’Élie sans la réduire uniquement à sa motivation.
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: La forme française traditionnelle et courante du nom biblique est employée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme nom personnel plutôt que de lui substituer un titre.
- issue: Sens de la question מַה לְּךָ פֹה
  choice: Que fais-tu ici ?
  alternative: Pourquoi es-tu ici ?
  rationale: 'La formulation retenue préserve une portée plus large : elle peut interroger la présence, la situation ou l’action d’Élie. « Pourquoi » préciserait davantage la cause ou le motif que ne le fait nécessairement l’hébreu.'
translation_notes:
  register: Français international moderne, narratif et digne. La structure reste proche de l’hébreu, mais la tournure de révélation est formulée idiomatiquement. Le marqueur d’attention הִנֵּה est conservé par « voici que ».
