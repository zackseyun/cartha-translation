  rationale: Révision limitée au rattachement correct de la note b et à un léger ajustement de « attelage » afin de ne pas restreindre indûment le terme hébreu כְּלִי. Le reste de la traduction est conservé, car il est fidèle, naturel et théologiquement non surinterprétatif.
