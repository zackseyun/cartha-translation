  - severity: low
    issue: « Attelage » est plus étroit que כְּלִי
    rationale: Dans ce contexte, כְּלִי peut couvrir le matériel ou les instruments liés aux bœufs, le joug n’étant qu’une possibilité. « Le matériel de l’attelage » conserve mieux cette ampleur lexicale.
