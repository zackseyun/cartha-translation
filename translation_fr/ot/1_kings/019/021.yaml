base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: fr
  text: Puis Élisée revint sur ses pas[a], prit la paire de bœufs et les offrit en sacrifice. Avec le matériel de l’attelage[b], il fit cuire la viande et la donna aux gens, qui mangèrent. Ensuite, il se leva, suivit Élie et se mit à son service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « revint de derrière lui ».'
    reason: La note préserve la construction directionnelle inhabituelle de l’hébreu.
  - marker: b
    text: 'Ou : « avec le joug ou le matériel des bœufs ».'
    reason: Le terme hébreu désigne de façon générale un objet, un instrument ou du matériel ; dans ce contexte, il peut notamment renvoyer au joug ou à d’autres pièces de l’équipement de labour.
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: Puis Élisée revint sur ses pas
  rationale: L’expression signifie littéralement qu’il revint de derrière Élie. Le nom explicite le référent du pronom en français et « revint sur ses pas » rend naturellement le mouvement de retour sans suggérer qu’Élisée renonce à suivre Élie.
- source_word: צֶמֶד הַבָּקָר
  choice: la paire de bœufs
  rationale: צֶמֶד désigne ici une paire, vraisemblablement sous le joug. Comme les animaux sont ensuite immolés, « paire de bœufs » désigne clairement l’objet; la note conserve la nuance possible de « joug » ou d’« attelage ».
- source_word: וַיִּזְבָּחֵהוּ
  choice: les offrit en sacrifice
  rationale: זבח exprime normalement l’immolation sacrificielle. La formulation conserve cette coloration sans préciser le destinataire ni le cadre cultuel, que le texte ne nomme pas.
- source_word: וּבִכְלִי הַבָּקָר
  choice: Avec l’attelage des bœufs
  rationale: כְּלִי est un terme large pour le matériel ou les instruments. Dans ce contexte, il s’agit vraisemblablement du matériel de trait en bois utilisé pour la cuisson; « attelage » est idiomatique, tandis que la note signale l’étendue lexicale.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: il fit cuire la viande
  rationale: בשל peut signifier cuire ou faire bouillir. « Fit cuire » reste naturel en français et ne tranche pas plus précisément que ne l’exige le contexte; « viande » convient mieux que « chair » dans le cadre d’un repas.
- source_word: לָעָם
  choice: aux gens
  rationale: עם désigne ici les personnes présentes ou la communauté locale. « Aux gens » est naturel et évite que « au peuple » suggère nécessairement l’ensemble d’Israël.
- source_word: וַיָּקָם
  choice: Ensuite, il se leva
  rationale: La formule narrative indique qu’Élisée se met en mouvement. « Il se leva » conserve l’image et le registre dignifié du texte.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: suivit Élie
  rationale: Littéralement, Élisée « alla derrière Élie ». « Suivit Élie » exprime clairement ce mouvement en français moderne sans ajouter de nuance doctrinale.
- source_word: וַיְשָׁרְתֵהוּ
  choice: se mit à son service
  rationale: שרת désigne un service personnel, souvent celui d’un assistant. Cette formulation rend l’entrée dans ce rôle tout en laissant sa nature exacte ouverte.
theological_decisions:
- issue: La portée sacrificielle de זבח
  choice: « les offrit en sacrifice »
  alternative: « les abattit » ou « les égorgea »
  rationale: Le verbe porte habituellement une connotation sacrificielle, qu’il convient de conserver. La traduction ne précise toutefois ni à qui le sacrifice est offert ni s’il relève d’un rite institutionnel.
translation_notes:
  register: Français international moderne, narratif et dignifié. Les enchaînements sont fluidifiés sans effacer la succession des actes. Les notes ne sont placées qu’après des éléments auxquels elles se rapportent explicitement.
