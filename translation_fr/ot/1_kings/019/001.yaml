  text: וַ/יַּגֵּ֤ד אַחְאָב֙ לְ/אִיזֶ֔בֶל אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה אֵלִיָּ֑הוּ וְ/אֵ֨ת כָּל אֲשֶׁ֥ר הָרַ֛ג אֶת כָּל הַ/נְּבִיאִ֖ים בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: fr
  text: Achab raconta à Jézabel tout ce qu’Élie avait fait et comment il avait tué par l’épée tous les prophètes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: raconta
  rationale: Le verbe נגד au hifil signifie ici « rapporter, raconter ». « Raconta » est naturel en français et convient au compte rendu détaillé d’Achab.
- source_word: וְאֵת כָּל־אֲשֶׁר הָרַג
  choice: et comment il avait tué
  rationale: La construction hébraïque répète littéralement « et tout ce qu’il avait tué », formulation difficile en français. « Et comment il avait tué » restitue naturellement le second élément du rapport sans modifier l’attribution grammaticale à Élie.
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: Rend directement l’instrument indiqué par la préposition ב et conserve l’image concrète du texte.
theological_decisions:
- issue: Attribution de la mise à mort des prophètes
  choice: Le pronom « il » renvoie à Élie.
  alternative: Employer une tournure impersonnelle ou attribuer l’acte à d’autres exécutants.
  rationale: Le sujet grammatical implicite de הָרַג se rattache naturellement à Élie, nommé dans la proposition précédente. La traduction conserve cette attribution sans l’atténuer ni l’amplifier.
- issue: Identité des « prophètes »
  choice: Conserver simplement « tous les prophètes ».
  alternative: Préciser « les prophètes de Baal ».
  rationale: Le contexte antérieur les identifie, mais ce verset ne répète pas le complément « de Baal ». La traduction n’ajoute donc pas une précision absente du texte hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Le plus-que-parfait situe clairement les actes d’Élie avant le récit qu’en fait Achab. Aucun marqueur de note n’est requis.
