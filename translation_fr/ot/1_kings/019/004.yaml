  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: fr
  text: 'Mais lui-même marcha dans le désert pendant une journée de marche. Il arriva et s’assit sous un genêt. Il demanda à mourir et dit : « C’en est assez ! Maintenant, Yahweh, prends ma vie, car je ne vaux pas mieux que mes pères. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמִּדְבָּר דֶּרֶךְ יוֹם
  choice: marcha dans le désert pendant toute une journée
  rationale: דֶּרֶךְ יוֹם désigne le trajet ou la marche d’une journée. Cette formulation française exprime naturellement le déplacement accompli dans le désert sans réduire l’expression à une simple durée abstraite.
- source_word: רֹתֶם אַחַת
  choice: un genêt
  rationale: רֹתֶם désigne un arbuste désertique généralement identifié comme un genêt. En français, « un genêt » est naturel et l’indéfini rend ici correctement le numéral אַחַת employé avec une valeur proche de l’article indéfini.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: il demanda alors la mort
  rationale: L’expression hébraïque signifie qu’Élie demande à mourir. « Demanda la mort » restitue clairement l’idiome sans introduire une conception particulière de l’âme.
- source_word: רַב עַתָּה
  choice: C’en est assez ! Maintenant
  rationale: רַב est une exclamation signifiant « assez », tandis que עַתָּה garde sa fonction temporelle et marque l’urgence de la demande.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre, conformément à la forme hébraïque du tétragramme et sans lui substituer un titre.
- source_word: קַח נַפְשִׁי
  choice: prends ma vie
  rationale: Dans ce contexte de demande de mort, נֶפֶשׁ désigne la vie ou la personne vivante. « Ma vie » est précis et naturel en français.
- source_word: כִּי לֹא־טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: car je ne vaux pas mieux que mes pères
  rationale: טוֹב avec מִן exprime ici une comparaison. « Ne pas valoir mieux que » rend la portée comparative tout en conservant « mes pères », qui peut désigner les ancêtres ou prédécesseurs.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte rapporte une adresse directe au Dieu d’Israël par son nom. « Yahweh » préserve le caractère de nom propre, tandis que « le SEIGNEUR » serait une substitution traditionnelle par un titre.
- issue: Sens de נֶפֶשׁ dans la demande d’Élie
  choice: vie
  alternative: âme
  rationale: Le contexte immédiat est une demande de mourir. « Vie » communique ce sens sans trancher une question anthropologique étrangère au propos du verset.
- issue: Portée de אֲבֹתָי
  choice: mes pères
  alternative: mes ancêtres
  rationale: '« Mes pères » maintient l’expression relationnelle et sa possible amplitude : ancêtres ou prédécesseurs. « Mes ancêtres » serait plus explicite mais réduirait légèrement cette souplesse.'
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif est conservé, avec une formulation idiomatique. « Genêt » évite l’expression botaniquement maladroite « arbre à genêts ». Aucun marqueur de note n’est nécessaire puisque le texte ne comporte aucune note.
