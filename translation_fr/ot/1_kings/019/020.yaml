  naturalness: La révision allège l’enchaînement narratif (« Il laissa les bœufs ») et emploie « courut après Élie », formulation moderne et naturelle. « Retourne » rend de façon idiomatique le double impératif hébreu sans en expliciter la nuance disputée.
  terminology: Les noms Élie et Élisée sont conformes à l’usage biblique français. « Bœufs », « embrasser », et « suivre » sont exacts et de registre moderne digne. Les notes maintiennent la distinction entre le sens littéral d’« embrasser » et le sens contextuel d’adieu, ainsi que l’ambiguïté de la parole d’Élie.
