base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: fr
  text: 'Il laissa les bœufs, courut après Élie et lui dit[a] : « Je t’en prie, laisse-moi embrasser mon père et ma mère, puis je te suivrai. » Élie lui répondit : « Retourne[b], car que t’ai-je fait ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus généralement : « Laisse-moi faire mes adieux à mon père et à ma mère. » Le verbe hébreu signifie littéralement « embrasser ».'
    reason: lexical_alternative
  - marker: b
    text: 'La réponse d’Élie est difficile. Elle peut aussi se comprendre ainsi : « Retourne, car qu’ai-je fait pour toi ? » ou comme une manière elliptique de laisser Élisée décider lui-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: il laissa
  rationale: Le verbe עזב signifie couramment « laisser » ou « abandonner ». Ici, « laissa » décrit naturellement l’interruption du labour sans affirmer à lui seul un abandon définitif.
- source_word: הַבָּקָר
  choice: les bœufs
  rationale: בקר peut désigner les bovins en général, mais le contexte du labour avec des paires d’animaux favorise « bœufs ».
- source_word: וַיָּרָץ אַחֲרֵי
  choice: courut derrière
  rationale: Cette formulation conserve l’image spatiale de l’hébreu et exprime clairement qu’Élisée se lance à la suite d’Élie.
- source_word: אֶשְּׁקָה נָּא
  choice: Je t’en prie, laisse-moi embrasser
  rationale: נשק désigne littéralement le fait d’embrasser, tandis que נָא marque ici une demande polie. Le geste concret est conservé dans le texte.
- source_word: לְאָבִי וּלְאִמִּי
  choice: mon père et ma mère
  rationale: La traduction maintient la mention distincte des deux parents plutôt que de la condenser en « mes parents ».
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: puis je te suivrai
  rationale: הלך אחרי signifie aller derrière quelqu’un et peut, dans ce contexte, évoquer le fait de devenir son compagnon ou serviteur. « Je te suivrai » est naturel en français tout en préservant cette portée possible.
- source_word: לֵךְ שׁוּב
  choice: Va, retourne
  rationale: Les deux impératifs sont conservés afin de rendre la brièveté abrupte et le caractère elliptique de l’hébreu, malgré une tournure moins courante en français.
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: car qu’est-ce que je t’ai fait ?
  rationale: Cette traduction directe conserve l’ambiguïté de la question et n’impose ni permission, ni reproche, ni rappel de l’appel.
theological_decisions:
- issue: 'Sens de la réponse d’Élie : כִּי מֶה עָשִׂיתִי לָךְ'
  choice: Conserver la question littérale « car qu’est-ce que je t’ai fait ? »
  alternative: « car qu’ai-je fait pour toi ? » ; ou une formule elliptique par laquelle Élie laisserait la décision à Élisée
  rationale: La clause peut être comprise comme une permission, un reproche ou un rappel de la portée du geste prophétique. Le texte principal maintient cette tension sans trancher.
translation_notes:
  register: Français moderne, international et digne. La narration reste fluide, tandis que « Va, retourne » conserve volontairement la formulation abrupte et énigmatique de l’hébreu. Les marqueurs [a] et [b] figurent dans le texte principal.
