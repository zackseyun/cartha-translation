  to: 'Il laissa les bœufs, courut après Élie et lui dit[a] : « Je t’en prie, laisse-moi embrasser mon père et ma mère, puis je te suivrai. » Élie lui répondit : « Retourne[b], car que t’ai-je fait ? »'
