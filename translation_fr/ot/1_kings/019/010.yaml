  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: fr
  text: 'Il répondit : « J’ai déployé un zèle ardent pour Yahweh, le Dieu des armées, car les Israélites ont abandonné ton alliance, démoli tes autels et tué tes prophètes par l’épée. Je suis resté seul, et ils cherchent à m’ôter la vie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: J’ai déployé un zèle ardent
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’idée verbale. Cette formulation française exprime naturellement la force de ce zèle sans évoquer principalement la jalousie envieuse.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition marque ici l’objet du zèle d’Élie, et le nom divin יהוה est translittéré afin de préserver le nom propre de l’alliance.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: צְבָאוֹת désigne des armées ou des troupes célestes et terrestres. « Dieu des armées » reste intelligible et plus transparent en français moderne que « Dieu des puissances », sans le confondre avec un autre titre divin.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Élie et « car » convient au registre solennel sans être archaïque.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: ont abandonné ton alliance
  rationale: עָזַב signifie abandonner ou délaisser. « Abandonné » conserve ici la gravité de la rupture de l’alliance en français courant.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais désigne collectivement le peuple d’Israël. « Les Israélites » est naturel, précis et non ambigu en français moderne.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: démoli tes autels
  rationale: הָרַס exprime l’action d’abattre ou de démolir une construction. « Démoli » rend concrètement la destruction des autels.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: tué tes prophètes par l’épée
  rationale: La traduction conserve à la fois l’acte de tuer et le moyen explicitement indiqué par l’hébreu.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Je suis resté seul
  rationale: La formulation rend l’affirmation emphatique d’Élie concernant son isolement, tout en restant idiomatique en français.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: ils cherchent à m’ôter la vie
  rationale: נֶפֶשׁ désigne ici la vie de la personne. L’expression française « ôter la vie » réunit naturellement le fait de rechercher sa vie et l’intention de la prendre, sans introduire la notion technique d’âme.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme, nom propre divin. « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction de nom d’alliance.
- issue: Portée de l’affirmation « Je suis resté seul »
  choice: Conserver l’affirmation d’Élie sans la nuancer
  alternative: Je crois être resté seul
  rationale: Le verset rapporte la perception et la plainte d’Élie. Ajouter une réserve anticipant la réponse divine ultérieure résoudrait une tension narrative absente de cette phrase.
- issue: Sens de « Dieu des armées »
  choice: Conserver l’image plurielle des armées
  alternative: Dieu tout-puissant
  rationale: « Tout-puissant » correspond à un titre différent et effacerait l’imagerie propre à צְבָאוֹת.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formulation garde le rythme de la plainte d’Élie, avec trois accusations coordonnées, puis l’affirmation de son isolement et de la menace qui pèse sur lui. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée.
