  text: וַ/יַּבֵּ֕ט וְ/הִנֵּ֧ה מְרַאֲשֹׁתָ֛י/ו עֻגַ֥ת רְצָפִ֖ים וְ/צַפַּ֣חַת מָ֑יִם וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖שָׁב וַ/יִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: fr
  text: 'Il regarda, et voici : près de sa tête se trouvaient une galette cuite sur des pierres brûlantes[a] et une cruche d’eau. Il mangea, but et se recoucha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une galette sur les braises ». Le mot hébreu רְצָפִים peut désigner des pierres chauffées utilisées pour la cuisson, mais il est aussi traduit par « braises ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: Il regarda
  rationale: Le verbe נבט exprime l’action de regarder. Cette formulation reste sobre et n’ajoute aucune direction absente de l’hébreu.
- source_word: וְהִנֵּה
  choice: et voici
  rationale: La particule הִנֵּה attire vivement l’attention sur ce qu’Élie découvre. « Et voici » en conserve la force narrative dans un registre biblique encore compréhensible.
- source_word: מְרַאֲשֹׁתָיו
  choice: près de sa tête
  rationale: Le terme désigne l’endroit où repose la tête ou ce qui se trouve à son chevet. « Près de sa tête » exprime naturellement la situation sans la préciser excessivement.
- source_word: עֻגַת
  choice: une galette
  rationale: עֻגָה désigne un pain rond ou une galette, et non nécessairement un gâteau sucré. « Galette » évite cette dernière connotation en français moderne.
- source_word: רְצָפִים
  choice: cuite sur des pierres brûlantes
  rationale: Le mot peut désigner des pierres chauffées servant à la cuisson, bien que le sens « braises » soit aussi défendu. Le texte retient la première possibilité et signale l’autre en note.
- source_word: וְצַפַּחַת מָיִם
  choice: et une cruche d’eau
  rationale: צַפַּחַת désigne un petit récipient pour liquide. « Cruche » est clair, concret et naturel dans ce récit.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: Il mangea, but
  rationale: Les deux verbes successifs sont rendus simplement, en conservant le rythme rapide du récit hébreu.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: et se recoucha
  rationale: La combinaison de שׁוב et שׁכב signifie qu’il recommence à se coucher. « Se recoucha » rend ce sens de façon concise et idiomatique.
theological_decisions: []
