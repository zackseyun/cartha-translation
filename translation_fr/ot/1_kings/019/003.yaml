base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: fr
  text: Il vit cela[a], se leva et partit pour sauver sa vie. Il arriva à Beer-Shéba, qui appartient à Juda, et y laissa son serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu traditionnel porte « il vit »; certains témoins anciens ont « il eut peur ».
    reason: Signaler une variante textuelle ancienne qui modifie sensiblement la motivation attribuée à Élie.
lexical_decisions:
- source_word: וַיַּרְא
  choice: Il vit cela
  rationale: Le texte massorétique porte « il vit ». « Cela » explicite en français l’objet sous-entendu par le contexte sans remplacer le verbe par « avoir peur ».
- source_word: אֶל־נַפְשׁוֹ
  choice: pour sauver sa vie
  rationale: Cette expression indique ici qu’il part afin de préserver sa vie; la traduction idiomatique française communique clairement ce sens.
- source_word: נַעֲרוֹ
  choice: son serviteur
  rationale: Dans ce contexte, נַעַר désigne l’homme qui accompagne et sert Élie, plutôt qu’un jeune garçon au sens strict.
theological_decisions:
- issue: Variante entre « il vit » et « il eut peur »
  choice: Conserver « Il vit cela » dans le texte principal
  alternative: « Il eut peur »
  rationale: Le WLC demandé lit וַיַּרְא, « il vit ». La variante ancienne « il eut peur » est signalée sans corriger silencieusement le texte source.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque répétitive est légèrement allégée pour obtenir une phrase naturelle, tout en conservant la succession des actions.
