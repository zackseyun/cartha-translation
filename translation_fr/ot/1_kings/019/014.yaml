source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: fr
  text: 'Il répondit : « J’ai déployé un zèle ardent pour Yahvé, le Dieu des armées, car les fils d’Israël ont abandonné ton alliance, démoli tes autels et tué tes prophètes par l’épée. Moi seul, je suis resté, et ils cherchent à prendre ma vie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: J’ai déployé un zèle ardent
  rationale: L’infinitif absolu associé au verbe conjugué renforce l’idée verbale. Cette formulation française exprime naturellement l’intensité et le zèle d’Élie sans suggérer l’envie moderne que pourrait évoquer « jaloux ».
- source_word: לַיהוָה
  choice: pour Yahvé
  rationale: La préposition ל indique ici l’objet du zèle, et le nom divin יהוה est rendu par « Yahvé ».
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  rationale: צבאות désigne des armées ou des troupes. « Le Dieu des armées » conserve la portée du titre sans préciser abusivement s’il s’agit d’armées terrestres ou célestes.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication donnée par Élie. « Car » convient au registre narratif et soutenu du passage.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: ont abandonné ton alliance
  rationale: עזב signifie abandonner ou délaisser. « Abandonner l’alliance » exprime clairement la gravité de la rupture.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: La formulation conserve le désignant collectif et généalogique littéral de l’hébreu, intelligible en français biblique moderne.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: démoli tes autels
  rationale: הרס signifie renverser ou démolir une construction. « Démoli » est précis et naturel pour des autels.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: tué tes prophètes par l’épée
  rationale: La traduction conserve explicitement l’instrument de la mise à mort et la violence concrète de l’hébreu.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Moi seul, je suis resté
  rationale: La dislocation avec « Moi seul » restitue l’insistance portée par אֲנִי לְבַדִּי tout en restant naturelle en français.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: ils cherchent à prendre ma vie
  rationale: Dans cet idiome, נפש désigne la vie de la personne. Le français réunit naturellement la recherche et son but sans répéter un pronom peu idiomatique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahvé » représente le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée du titre אֱלֹהֵי צְבָאוֹת
  choice: le Dieu des armées
  alternative: le Dieu de l’univers
  rationale: « Armées » maintient l’image lexicale de צבאות et son ambiguïté possible entre troupes terrestres et célestes; « univers » en élargirait interprétativement le sens.
- issue: Désignation collective בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: La traduction retenue préserve la forme généalogique et collective de l’expression sans décider qu’elle ne serait qu’un simple gentilé.
translation_notes:
  register: Français international moderne, digne et narratif. Le discours direct reste ferme et emphatique. « Zèle ardent » rend l’intensification hébraïque sans introduire une note sur la jalousie, tandis que « Dieu des armées » préserve l’ouverture sémantique du titre.
