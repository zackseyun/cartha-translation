base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: fr
  text: 'Alors Jézabel envoya un messager à Élie pour lui dire : « Que les dieux[a] me fassent ceci, et même davantage, si demain à cette heure je ne rends pas ta vie pareille à celle de l’un d’eux ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que Dieu me fasse ceci, et même davantage. » Le mot hébreu אֱלֹהִים peut désigner Dieu au singulier ou des dieux au pluriel ; ici, le contexte de Jézabel et les verbes au pluriel favorisent « les dieux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: Alors … envoya
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: מַלְאָךְ
  choice: messager
  rationale: Dans ce cadre royal, le terme désigne un envoyé humain et non un être céleste.
- source_word: לֵאמֹר
  choice: pour lui dire
  rationale: Formulation française naturelle pour introduire les paroles transmises par le messager.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: Que les dieux me fassent ceci, et même davantage
  rationale: La traduction conserve la forme imprécatoire de cette formule de serment. Le complément « me » explicite en français la personne sur laquelle retomberait la malédiction, implicite dans la formule hébraïque.
- source_word: אֱלֹהִים
  choice: les dieux
  rationale: Le contexte de Jézabel et les deux verbes au pluriel favorisent ici le sens pluriel, sans effacer la possibilité grammaticale du singulier signalée en note.
- source_word: כִּי
  choice: si
  rationale: Dans la formule de serment, la conjonction introduit la condition qui ferait retomber l’imprécation sur celle qui parle.
- source_word: כָעֵת מָחָר
  choice: demain à cette heure
  rationale: Cette expression rend directement le moment correspondant du jour suivant, sans ajouter l’idée d’une échéance antérieure.
- source_word: אָשִׂים אֶת נַפְשְׁךָ
  choice: je ne rends pas ta vie
  rationale: Cette formulation conserve נֶפֶשׁ comme objet et exprime l’idée de mettre la vie d’Élie dans le même état que celle des prophètes tués.
- source_word: נַפְשְׁךָ … כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: ta vie pareille à celle de l’un d’eux
  rationale: « Vie » convient ici mieux que « âme » et la répétition du concept est maintenue. « L’un d’eux » respecte le singulier אַחַד plutôt que de généraliser en « chacun d’eux ».
theological_decisions:
- issue: Référent de אֱלֹהִים dans le serment de Jézabel
  choice: 'pluriel : « les dieux »'
  alternative: 'singulier : « Dieu »'
  rationale: Jézabel est associée au culte de Baal, et les formes verbales יַעֲשׂוּן et יוֹסִפוּן sont plurielles. La note conserve toutefois l’ambiguïté lexicale réelle de אֱלֹהִים.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formule de serment reste volontairement proche de sa tournure hébraïque afin d’en préserver la force et la structure, tandis que « pour lui dire » et « demain à cette heure » assurent une lecture naturelle.
