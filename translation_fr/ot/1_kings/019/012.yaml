source:
  edition: WLC
  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: fr
  text: Après le tremblement de terre, il y eut un feu ; Yahweh n’était pas dans le feu. Après le feu, il y eut le son d’un silence ténu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une voix douce et légère », « un doux murmure » ou « un murmure à peine perceptible ». L’hébreu porte littéralement « le son d’un silence ténu », une expression volontairement délicate et difficile.
    reason: Signaler les principaux rendus possibles de l’expression ambiguë קוֹל דְּמָמָה דַקָּה sans en effacer la tension dans le texte principal.
lexical_decisions:
- source_word: וְאַחַר
  choice: Après
  rationale: Marque naturellement en français la succession des manifestations, tout en préservant le mouvement narratif de l’hébreu.
- source_word: הָרַעַשׁ
  choice: le tremblement de terre
  rationale: רַעַשׁ peut désigner une secousse violente ou un séisme; dans cette scène théophanique, « tremblement de terre » est précis et naturel.
- source_word: אֵשׁ
  choice: un feu
  rationale: Le nom sans article introduit une nouvelle manifestation; « un feu » restitue cette valeur tout en convenant à l’usage français.
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: Yahweh n’était pas dans le feu
  rationale: La préposition ב est rendue selon son sens locatif sans préciser davantage la nature de la présence divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel plutôt que de lui substituer un titre.
- source_word: קוֹל
  choice: le son
  rationale: קוֹל peut signifier « son » ou « voix ». « Son » conserve l’ambiguïté sans introduire explicitement une parole.
- source_word: דְּמָמָה
  choice: silence
  rationale: Le terme évoque le silence, le calme ou l’immobilité. « Silence » préserve nettement le paradoxe avec « son ».
- source_word: דַקָּה
  choice: subtil
  rationale: L’adjectif signifie littéralement « fin, mince, ténu ». « Subtil » est naturel en français tout en gardant la délicatesse et l’étrangeté de l’expression.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Rendu de קוֹל דְּמָמָה דַקָּה
  choice: le son d’un silence subtil
  alternative: un doux murmure
  rationale: Le choix principal conserve la tension intentionnelle entre « son » et « silence », ainsi que la délicatesse de דַקָּה, sans imposer l’idée d’une voix ou d’un murmure.
translation_notes:
  register: Français international moderne, digne et lisible. « Vint » et « il y eut » rendent explicite la syntaxe nominale elliptique de l’hébreu. L’expression finale reste volontairement inhabituelle, mais compréhensible, afin de préserver l’ambiguïté du texte source.
