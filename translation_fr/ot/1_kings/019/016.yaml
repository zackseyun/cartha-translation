  source_fidelity: 'Le sens des deux mandats est bien rendu : l’inaccompli directif, l’investiture de Jéhu sur Israël, l’origine d’Élisée et la nuance de תחתיךָ sont conservés. Une formulation plus directement équivalente à משח et aux compléments de fonction rend toutefois le parallélisme hébreu plus net.'
  naturalness: « Donner l’onction à » est compréhensible, mais reste moins idiomatique et moins direct que « oindre » dans un contexte biblique. « Comme roi/prophète » est plus concis et correspond mieux à la construction d’investiture.
  terminology: Les noms Jéhu, Nimshi, Élisée, Shaphath et Abel-Mehola sont cohérents avec les usages bibliques français. « Oindre » maintient le terme technique sans explicitation confessionnelle. La note doit signaler les deux pôles sémantiques possibles de תחתיךָ, sans présenter comme alternative principale une expression déjà retenue dans le texte.
