  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: fr
  text: Tu oindras Jéhu, fils de Nimshi, comme roi sur Israël, et tu oindras Élisée, fils de Shaphath, originaire d’Abel-Mehola, comme prophète à ta place[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après toi » ou « pour te remplacer » ; l’hébreu peut évoquer la succession ou le remplacement.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: tu donneras l’onction à
  rationale: Le qal inaccompli à valeur directive exprime ici un ordre. « Donner l’onction à » rend clairement l’acte de consécration tout en restant naturel en français moderne.
- source_word: לְמֶלֶךְ
  choice: pour qu’il soit roi
  rationale: Le לְ marque l’accès à une fonction. Cette formulation française exprime naturellement la nomination à la royauté.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec la royauté, עַל indique l’autorité exercée sur le peuple.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Jéhu, fils de Nimshi
  rationale: Les noms suivent les formes françaises bibliques usuelles, et le patronyme hébreu est conservé explicitement.
- source_word: אֱלִישָׁע בֶּן שָׁפָט
  choice: Élisée, fils de Shaphath
  rationale: Les noms suivent les formes françaises bibliques usuelles, et le lien patronymique est préservé.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: originaire d’Abel-Mehola
  rationale: Le préfixe מִן indique la provenance. « Originaire de » identifie clairement Abel-Mehola comme le lieu d’origine d’Élisée.
- source_word: לְנָבִיא
  choice: pour qu’il soit prophète
  rationale: Comme pour la royauté, לְ indique ici la nomination à une fonction.
- source_word: תַּחְתֶּיךָ
  choice: à ta place
  rationale: Cette expression conserve l’idée centrale de succession ou de remplacement sans préciser excessivement sa chronologie.
- source_word: וְאֵת ... וְאֶת
  choice: et … et
  rationale: Les marqueurs d’objet direct ne se traduisent pas; les conjonctions coordonnent les deux ordres, dont la structure parallèle est conservée.
theological_decisions:
- issue: Nature du rapport entre Élie et Élisée dans תַּחְתֶּיךָ
  choice: Élisée est établi prophète « à ta place », formulation qui évoque la succession sans en fixer toutes les modalités.
  alternative: « après toi » mettrait davantage l’accent sur la chronologie; « pour te remplacer » accentuerait davantage le remplacement.
  rationale: L’hébreu peut exprimer la succession ou le remplacement. Le texte principal garde cette tension, et la note signale les nuances possibles sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tu donneras l’onction » reproduit le parallélisme hébreu. Le marqueur de note est placé après « à ta place », expression à laquelle porte réellement la variante.
