  rationale: La révision emploie « oindre », terme français biblique précis pour משח, et « comme roi/prophète », qui reflète clairement l’attribution d’une fonction. Elle conserve « à ta place », sans trancher entre succession chronologique et remplacement, et développe la note de manière équilibrée.
