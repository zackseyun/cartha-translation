  text: וַ/יֵּ֣לֶךְ מִ֠/שָּׁם וַ/יִּמְצָ֞א אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ וְ/ה֣וּא חֹרֵ֔שׁ שְׁנֵים עָשָׂ֤ר צְמָדִים֙ לְ/פָנָ֔י/ו וְ/ה֖וּא בִּ/שְׁנֵ֣ים הֶ/עָשָׂ֑ר וַ/יַּעֲבֹ֤ר אֵלִיָּ֨הוּ֙ אֵלָ֔י/ו וַ/יַּשְׁלֵ֥ךְ אַדַּרְתּ֖/וֹ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: fr
  text: Élie partit de là et trouva Élisée, fils de Shaphath. Celui-ci labourait avec douze attelages devant lui, et il était avec le douzième[a]. Élie passa près de lui et jeta son manteau sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il était avec le douzième ». Le mot hébreu traduit par « attelage » désigne une paire d’animaux sous le joug, probablement des bœufs.'
    reason: L’hébreu est elliptique quant à la position exacte d’Élisée et ne nomme pas expressément les animaux.
  - marker: b
    text: On peut aussi traduire « sa cape ». Ce vêtement prend une valeur symbolique dans la suite du récit.
    reason: Signale la nuance lexicale de אַדֶּרֶת sans intégrer au texte principal une interprétation du geste.
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Élie partit de là
  rationale: Le verbe fait avancer le récit; « partit de là » rend naturellement le déplacement depuis le lieu précédent. Le sujet explicite, Élie, évite en français une ouverture pronominale ambiguë.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: et trouva Élisée, fils de Shaphath
  rationale: מָצָא signifie directement « trouver ». Les formes françaises usuelles des noms bibliques sont retenues.
- source_word: וְהוּא חֹרֵשׁ
  choice: Celui-ci labourait
  rationale: Le participe décrit une action en cours. Une nouvelle phrase avec « Celui-ci » assure une lecture fluide tout en identifiant clairement Élisée.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: douze attelages
  rationale: צֶמֶד désigne ici une paire d’animaux réunis pour le labour. « Attelages » est idiomatique en français agricole et n’ajoute pas explicitement « bœufs », absent de l’hébreu.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Cette formulation conserve directement la relation spatiale exprimée par l’hébreu.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: et il conduisait lui-même le douzième
  rationale: L’hébreu dit elliptiquement qu’Élisée était « avec le douzième ». Le verbe « conduisait » explicite seulement l’action naturellement impliquée par le labour et rend la scène compréhensible en français.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: Élie passa près de lui
  rationale: La formulation rend le mouvement d’Élie vers Élisée sans surinterpréter la portée symbolique de son geste.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: et jeta son manteau sur lui
  rationale: אַדֶּרֶת désigne ici le vêtement extérieur distinctif d’Élie. « Manteau » est actuel, digne et immédiatement compréhensible.
theological_decisions:
- issue: Portée symbolique du manteau d’Élie
  choice: 'Décrire simplement le geste: « jeta son manteau sur lui »'
  alternative: Paraphraser le geste comme une nomination d’Élisée à la succession prophétique
  rationale: Le contexte permet de reconnaître un geste d’appel et de succession, mais le verset ne l’explique pas explicitement. La traduction conserve donc l’acte concret et laisse sa portée théologique se dégager du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement restructurées pour éviter l’accumulation de coordinations hébraïques. « Attelages » conserve l’image agricole sans introduire explicitement les bœufs; l’ellipse « avec le douzième » est clarifiée dans le texte et signalée en note.
