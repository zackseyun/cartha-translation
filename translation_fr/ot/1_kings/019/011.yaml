base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: fr
  text: 'Il dit : « Sors et tiens-toi sur la montagne devant Yahweh. » Et voici que Yahweh passait, tandis qu’un vent impétueux et puissant mettait les montagnes en pièces et fracassait les rochers devant Yahweh ; mais Yahweh n’était pas dans le vent[a]. Après le vent, il y eut un tremblement de terre, mais Yahweh n’était pas dans le tremblement de terre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahweh n’était pas dans le vent ». Cette expression peut signifier qu’il ne s’y révélait pas, mais la traduction conserve la formulation du texte.'
    reason: Préserver l’ambiguïté théologique et la formulation locative de l’hébreu.
  - marker: b
    text: Le mot hébreu peut aussi désigner une secousse ou un ébranlement. Le texte dit littéralement que Yahweh n’était pas « dans » ce phénomène.
    reason: Signaler l’étendue sémantique de רַעַשׁ tout en conservant la formulation locative sans déduction théologique.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre, conformément à la forme explicite du texte hébreu.
- source_word: צֵא וְעָמַדְתָּ
  choice: Sors et tiens-toi
  rationale: 'Rend directement les deux verbes : sortir du lieu où se trouve Élie, puis se tenir debout à l’endroit indiqué.'
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Conserve le sens spatial de l’expression hébraïque sans l’expliciter en « dans la présence de ».
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Marque l’irruption dramatique de la scène dans un français narratif actuel et digne.
- source_word: עֹבֵר
  choice: passait
  rationale: L’imparfait rend la valeur progressive du participe hébreu tout en laissant ouverte la nuance d’un passage en cours.
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: un vent impétueux et puissant
  rationale: Le contexte impose le sens météorologique de רוּחַ. Les deux qualificatifs conservent l’intensification hébraïque dans une formulation française naturelle.
- source_word: מְפָרֵק הָרִים
  choice: fendait les montagnes
  rationale: Exprime l’action violente et continue du participe, sans alourdir la phrase.
- source_word: וּמְשַׁבֵּר סְלָעִים
  choice: et fracassait les rochers
  rationale: Maintient le parallélisme participial et la vigueur de l’image.
- source_word: רַעַשׁ
  choice: tremblement de terre
  rationale: Dans cette scène de phénomènes naturels, cette expression est la lecture contextuelle la plus probable, tout en signalant en note le sens plus large du terme.
theological_decisions:
- issue: Formulation « Yahweh n’était pas dans le vent / le tremblement de terre »
  choice: Conserver la formulation locative « n’était pas dans »
  alternative: « ne se révélait pas dans » ou « n’était pas présent dans »
  rationale: L’hébreu affirme littéralement que Yahweh n’était pas « dans » ces phénomènes. La traduction n’explique pas cette déclaration par une théorie de la présence, de la révélation ou de la souveraineté divine.
- issue: Passage de Yahweh
  choice: « Yahweh passait »
  alternative: « Yahweh allait passer »
  rationale: Le participe peut présenter une action en cours ou imminente. L’imparfait conserve la vivacité de la scène sans transformer explicitement l’énoncé en futur proche.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de la progression hébraïque, tandis que « impétueux et puissant », « fendait » et « fracassait » assurent une expression naturelle et vive.
