  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: fr
  text: 'Puis l’ange de Yahweh[a] revint une deuxième fois, le toucha et dit : « Lève-toi et mange, car le voyage dépasse tes forces. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ».
    reason: 'Alternative lexicale : מַלְאָךְ peut signifier aussi bien « ange » que « messager ».'
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Dans ce contexte narratif, שׁוב indique que l’être céleste revient auprès d’Élie. « Revint » est précis, naturel et concis.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager humain ou un ange. Dans cette scène, « ange » est la désignation française la plus naturelle d’un envoyé céleste, tandis que la note conserve l’autre sens lexical possible.
- source_word: שֵׁנִית
  choice: une deuxième fois
  rationale: Cette expression indique explicitement qu’il s’agit de la seconde intervention; elle est plus précise que « de nouveau ».
- source_word: וַיִּגַּע בּוֹ
  choice: le toucha
  rationale: Le verbe נגע suivi du pronom signifie directement « le toucha ». La répétition est déjà exprimée par « une deuxième fois ».
- source_word: קוּם אֱכֹל
  choice: Lève-toi et mange
  rationale: Les deux impératifs sont rendus directement dans un français moderne et naturel, sans atténuer leur force.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison des deux ordres. « Car » convient au discours direct dans un registre digne et courant.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: le voyage dépasse tes forces
  rationale: L’hébreu présente le chemin ou voyage comme étant « trop grand » ou « trop considérable » pour Élie. Cette formulation française exprime naturellement que le trajet excède ses capacités, sans réduire nécessairement le problème à sa seule longueur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de le remplacer par un titre.
- issue: Nature de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le contexte présente un envoyé divin, pour lequel « ange » est le terme français usuel. La polysémie de מַלְאָךְ est néanmoins préservée dans une note, sans imposer une identification théologique supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. Les impératifs restent directs; « dépasse tes forces » rend idiomatiquement la difficulté du voyage sans introduire un ton archaïque.
