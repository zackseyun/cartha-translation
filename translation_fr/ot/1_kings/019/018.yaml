base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: fr
  text: 'Mais j’ai gardé pour moi, en Israël, sept mille : tous les genoux qui n’ont pas fléchi devant Baal, et toute bouche qui ne l’a pas embrassé[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Embrasser une idole était un geste d’hommage ou d’adoration.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Mais je laisserai … pour moi
  rationale: Le hiphil de שׁאר exprime le fait de laisser subsister ou de préserver. Dans cette parole divine, le parfait hébreu peut présenter comme certaine l’action annoncée; le futur français convient au déroulement du contexte. « Mais » rend la valeur adversative du waw, et « pour moi » explicite l’appartenance impliquée sans recourir à un terme doctrinal technique.
- source_word: בְיִשְׂרָאֵל
  choice: en Israël
  rationale: Expression locative directe et naturelle en français.
- source_word: שִׁבְעַת אֲלָפִים
  choice: sept mille personnes
  rationale: Le nombre désigne des Israélites; « personnes » rend explicite le référent humain nécessaire en français avant les images corporelles qui suivent.
- source_word: כָּל הַבִּרְכַּיִם אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: tous les genoux qui n’ont pas fléchi devant Baal
  rationale: La formulation conserve l’image concrète et collective des genoux. « Fléchir le genou devant » exprime naturellement en français le geste de soumission cultuelle; Baal est traité comme un nom propre malgré l’article hébreu.
- source_word: וְכָל הַפֶּה אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: et toutes les bouches qui ne lui ont pas donné de baiser
  rationale: Le pluriel français maintient le parallélisme avec « tous les genoux ». « Donner un baiser » conserve le geste concret de נשׁק, tandis que le pronom renvoie clairement à Baal.
theological_decisions:
- issue: Rendre l’affirmation concernant ceux que Dieu fait subsister sans importer une terminologie doctrinale ultérieure
  choice: Mais je laisserai en Israël sept mille personnes pour moi
  alternative: Mais j’ai gardé pour moi sept mille personnes en Israël
  rationale: Le choix conserve l’action souveraine de Dieu et la destination « pour moi », tout en évitant le terme théologique spécialisé « reste ». Le futur reflète ici une lecture contextuelle possible du parfait prophétique, sans nier la possibilité d’un état déjà établi.
translation_notes:
  register: Français international actuel, digne et accessible. Les images corporelles du texte hébreu sont conservées. Le marqueur [a] apparaît immédiatement après le geste nécessitant l’explication culturelle.
