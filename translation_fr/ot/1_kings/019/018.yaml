revisions:
- from: 'Mais je laisserai en Israël sept mille personnes pour moi : tous les genoux qui n’ont pas fléchi devant Baal, et toutes les bouches qui ne lui ont pas donné de baiser[a].'
  to: 'Mais j’ai gardé pour moi, en Israël, sept mille : tous les genoux qui n’ont pas fléchi devant Baal, et toute bouche qui ne l’a pas embrassé[a].'
  rationale: La révision rend le parfait hébreu par un parfait français, conserve l’idée de préservation personnelle sans vocabulaire doctrinal ajouté, et améliore l’idiomaticité de la seconde image. Le singulier collectif « toute bouche » reflète plus directement le singulier hébreu tout en restant naturel en français.
