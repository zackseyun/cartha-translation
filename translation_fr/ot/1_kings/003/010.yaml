id: 1KI.3.10
reference: 1 Kings 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י אֲדֹנָ֑/י כִּ֚י שָׁאַ֣ל שְׁלֹמֹ֔ה אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: fr
  text: La demande plut au Seigneur, puisque Salomon avait demandé cela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיטַב
  choice: plut
  rationale: Dans cette construction avec בְּעֵינֵי, le verbe יטב exprime une appréciation favorable. « Plut » rend naturellement l’idiome en français sans modifier son sens.
- source_word: הַדָּבָר
  choice: la demande
  rationale: דבר est large (« parole, chose, affaire »), mais désigne ici ce que Salomon vient de demander. « La demande » explicite sobrement le référent et évite le tour peu naturel « la chose fut bonne aux yeux de ».
- source_word: בְּעֵינֵי
  choice: '[exprimé par la construction] plut au'
  rationale: L’idiome évaluatif « être bon aux yeux de » se rend en français courant par « plaire à ». Le sens est conservé, même si la métaphore des yeux n’est pas reproduite.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le texte porte אֲדֹנָי, et non le tétragramme יהוה ; « le Seigneur » est donc la correspondance directe.
- source_word: כִּי
  choice: puisque
  rationale: כִּי introduit ici la raison de l’appréciation favorable. « Puisque » marque clairement ce rapport causal dans un récit.
- source_word: שָׁאַל
  choice: avait demandé
  rationale: Le verbe signifie « demander ». Le plus-que-parfait français situe naturellement cette demande avant la réaction du Seigneur, sans prétendre qu’un plus-que-parfait soit morphologiquement marqué en hébreu.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: cela
  rationale: « Cela » reprend naturellement en français le contenu précis de la demande précédente tout en représentant l’expression démonstrative « cette chose/cette affaire ».
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte massorétique emploie אֲדֹנָי et non יהוה. Il convient donc de traduire le titre « Seigneur » sans lui substituer un rendu conventionnel du tétragramme.
translation_notes:
  register: Français international moderne, simple et digne. La formulation privilégie un idiome français naturel (« plut au Seigneur ») plutôt qu’un calque (« fut bonne aux yeux du Seigneur »), tout en conservant le rapport causal et la reprise démonstrative du texte hébreu.
