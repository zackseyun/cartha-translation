source:
  edition: WLC
  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: fr
  text: Salomon s’allia par mariage avec le pharaon, roi d’Égypte[a]. Il prit pour femme la fille du pharaon et l’amena dans la cité de David, jusqu’à ce qu’il ait fini de bâtir sa propre maison, la maison de Yahweh[b] et la muraille qui entourait Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « devint parent par mariage avec le pharaon ». Le verbe hébreu souligne l’établissement d’un lien matrimonial, qui comporte vraisemblablement ici une dimension d’alliance politique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le temple de Yahweh ». Littéralement : « la maison de Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: s’allia par mariage avec
  rationale: Le hitpael de חתן désigne ici l’entrée dans une relation matrimoniale avec la maison du pharaon. Dans ce contexte royal, la formulation française exprime à la fois le lien familial et sa portée politique sans réduire le verbe à une union romantique.
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: avec le pharaon, roi d’Égypte
  rationale: L’apposition hébraïque identifie le pharaon comme roi d’Égypte. La virgule donne une formulation française naturelle.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: Il prit pour femme la fille du pharaon
  rationale: לקח avec une femme comme complément est un idiome courant pour la prendre en mariage. « Prendre pour femme » restitue ce sens en français courant et évite l’ambiguïté de « prit » seul.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: et l’amena dans la cité de David
  rationale: Le verbe exprime le fait de faire venir ou d’amener, et אֶל indique la destination. « Dans » convient à l’entrée dans son lieu de résidence.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: jusqu’à ce qu’il ait fini de bâtir
  rationale: עַד suivi de l’infinitif construit marque le terme temporel de la situation. Le subjonctif passé est idiomatique en français après « jusqu’à ce que » et maintient cette relation temporelle.
- source_word: אֶת בֵּיתוֹ
  choice: sa propre maison
  rationale: « Maison » conserve le sens premier de בַּיִת, probablement le palais ou complexe royal dans ce contexte. « Propre » distingue cette construction de la maison de Yahweh sans imposer « palais » au texte.
- source_word: וְאֶת בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction garde l’image littérale de la « maison » et rend le tétragramme par le nom personnel « Yahweh ». Une note signale l’équivalent contextuel « temple ».
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: et la muraille qui entourait Jérusalem
  rationale: חוֹמָה désigne la muraille fortifiée, tandis que סָבִיב en précise le caractère environnant. La proposition relative est naturelle en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre, tout en évitant d’introduire une interprétation confessionnelle particulière.
- issue: Sens de בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: « Maison » préserve la métaphore et la formulation hébraïque; « temple » en explicite justement le référent dans ce contexte, mais au prix d’une légère interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. « Cité de David » conserve la désignation historique traditionnelle; « muraille » convient mieux que « mur » à une fortification urbaine. La phrase a été divisée après la première proposition pour alléger la longue coordination hébraïque sans modifier son enchaînement narratif.
