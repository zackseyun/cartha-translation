  source_fidelity: 'La structure narrative et les principaux termes sont bien rendus : « au milieu de la nuit », l’auto-désignation déférente « ta servante », l’état duratif « dormait », ainsi que le parallélisme des deux actions de coucher. Toutefois, « prit mon fils à côté de moi » signifie en français qu’elle prit l’enfant alors qu’elle se trouvait à côté de la narratrice, plutôt que « le prit d’auprès de moi » ; il faut marquer l’éloignement exprimé par מֵאֶצְלִי.'
