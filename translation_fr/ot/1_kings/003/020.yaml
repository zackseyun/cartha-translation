  text: וַ/תָּקָם֩ בְּ/ת֨וֹךְ הַ/לַּ֜יְלָה וַ/תִּקַּ֧ח אֶת בְּנִ֣/י מֵֽ/אֶצְלִ֗/י וַ/אֲמָֽתְ/ךָ֙ יְשֵׁנָ֔ה וַ/תַּשְׁכִּיבֵ֖/הוּ בְּ/חֵיקָ֑/הּ וְ/אֶת בְּנָ֥/הּ הַ/מֵּ֖ת הִשְׁכִּ֥יבָה בְ/חֵיקִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: fr
  text: Elle se leva au milieu de la nuit, prit mon fils d’auprès de moi pendant que ta servante dormait, et le coucha contre elle[a] ; puis elle coucha son fils mort contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans son sein… dans mon sein ». Le mot hébreu peut désigner la poitrine ou le giron, c’est-à-dire l’espace tout contre une personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: au milieu de la nuit
  rationale: Cette expression situe l’action au cœur de la nuit, et non simplement pendant la nuit.
- source_word: מֵאֶצְלִי
  choice: à côté de moi
  rationale: אֵצֶל exprime ici la proximité immédiate du fils auprès de sa mère endormie.
- source_word: וַאֲמָתְךָ יְשֵׁנָה
  choice: pendant que ta servante dormait
  rationale: La formule conserve la manière humble dont la femme se désigne devant le roi, tandis que l’imparfait rend l’état qui forme l’arrière-plan de l’action.
- source_word: וַתַּשְׁכִּיבֵהוּ
  choice: elle le coucha
  rationale: Le hiphil de שׁכב signifie faire coucher ou déposer en position couchée ; « coucha » convient naturellement au contexte nocturne.
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: contre elle / contre moi
  rationale: חֵיק désigne la poitrine, le sein ou le giron. « Contre » rend naturellement en français la proximité corporelle sans imposer une localisation anatomique plus précise que l’hébreu.
- source_word: בְּנָהּ הַמֵּת
  choice: son fils mort
  rationale: 'Le participe avec l’article qualifie le fils : il s’agit de son fils qui était mort.'
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La répétition de « coucha » et le parallélisme « contre elle / contre moi » reproduisent la structure accusatrice de l’hébreu. « Ta servante » conserve le registre de déférence devant le roi.
