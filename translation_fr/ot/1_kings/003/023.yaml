  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ זֹ֣את אֹמֶ֔רֶת זֶה בְּנִ֥/י הַ/חַ֖י וּ/בְנֵ֣/ךְ הַ/מֵּ֑ת וְ/זֹ֤את אֹמֶ֨רֶת֙ לֹ֣א כִ֔י בְּנֵ֥/ךְ הַ/מֵּ֖ת וּ/בְנִ֥/י הֶ/חָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: fr
  text: 'Alors le roi dit[a] : « Celle-ci dit : “Voici mon fils, celui qui est vivant, et ton fils est celui qui est mort.” Et celle-là dit : “Non ! C’est ton fils qui est mort, et mon fils qui est vivant.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Celle-ci dit… et celle-ci dit… » L’hébreu emploie deux démonstratifs féminins identiques pour désigner les deux femmes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » marque naturellement la succession en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le titre défini est conservé sans lui substituer le nom propre.
- source_word: זֹאת ... וְזֹאת
  choice: Celle-ci ... Et celle-là
  rationale: Les démonstratifs féminins renvoient aux deux femmes. Cette formulation française garde leur valeur déictique et contrastive sans répéter « femme ».
- source_word: אֹמֶרֶת
  choice: dit
  rationale: Le participe présente vivement les affirmations opposées ; en français narratif, « dit » est plus naturel ici que « est en train de dire ».
- source_word: זֶה בְּנִי הַחַי
  choice: Voici mon fils, celui qui est vivant
  rationale: « Voici » conserve la désignation démonstrative de l’enfant, tandis que l’apposition rend explicitement הַחַי sans aplatir la structure hébraïque.
- source_word: בְּנִי / בְּנֵךְ
  choice: mon fils / ton fils
  rationale: בֵּן désigne ici un fils ; le contexte concerne un nourrisson de sexe masculin.
- source_word: הַחַי / הַמֵּת
  choice: celui qui est vivant / celui qui est mort
  rationale: Ces formes déterminées ont une valeur substantive et forment un contraste symétrique, rendu idiomatiquement en français.
- source_word: לֹא כִי
  choice: Non ! C’est ... qui
  rationale: La construction exprime une contradiction énergique suivie d’une rectification. La tournure clivée française en conserve la force sans introduire un « car » peu naturel.
