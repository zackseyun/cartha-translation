  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: fr
  text: 'Alors le roi dit : « Coupez l’enfant vivant en deux, et donnez-en la moitié à l’une[a] et la moitié à l’autre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « à l’une… et à l’une », avec des formes féminines qui renvoient aux deux femmes du récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession narrative en français moderne.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe du nom défini.
- source_word: גִּזְרוּ
  choice: Coupez
  rationale: L’impératif pluriel de גזר ordonne ici de trancher physiquement. « Coupez » est direct et naturel, sans atténuer la violence de l’ordre.
- source_word: הַיֶּלֶד הַחַי
  choice: l’enfant vivant
  rationale: L’adjectif distingue cet enfant de l’enfant mort mentionné dans le contexte. Cette formulation est concise et idiomatique.
- source_word: לִשְׁנָיִם
  choice: en deux
  rationale: La locution indique une division en deux parties et s’emploie naturellement avec « couper ».
- source_word: וּתְנוּ
  choice: et donnez-en
  rationale: Le second impératif pluriel est coordonné au premier. Le pronom « en » reprend naturellement l’enfant ainsi partagé sans modifier le sens.
- source_word: הַחֲצִי
  choice: la moitié
  rationale: Le nom désigne chacune des deux moitiés; l’article défini est naturel en français.
- source_word: לְאַחַת … לְאֶחָת
  choice: à l’une … à l’autre
  rationale: Les deux formes hébraïques sont féminines et renvoient aux deux femmes du récit. La tournure distributive française « l’une … l’autre » rend clairement le sens.
