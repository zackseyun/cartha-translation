source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: fr
  text: Voici, j’ai agi conformément à tes paroles. Voici, je t’ai donné un cœur[a] sage et doué de discernement, si bien qu’il n’y a eu personne comme toi avant toi et qu’après toi il ne se lèvera personne comme toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, le mot hébreu traduit par « cœur » désigne notamment la faculté intérieure de penser, de juger et de discerner, et pas seulement le siège des émotions. On pourrait aussi traduire : « un cœur sage et intelligent ».'
    reason: Précision lexicale sur le champ de sens de לֵב et indication d’une autre formulation possible.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la particule qui attire solennellement l’attention dans la parole divine; « voici » convient mieux au registre biblique digne que les formes plus familières « regarde » ou « vois ».
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: j’ai agi conformément à tes paroles
  rationale: « J’ai agi » rend naturellement l’action accomplie exprimée par עשה, tandis que « conformément à tes paroles » préserve le terme explicite « paroles » sans le remplacer par l’interprétation contextuelle « demande ».
- source_word: נָתַתִּי לְךָ
  choice: je t’ai donné
  rationale: Le passé composé présente le don comme accompli et « donné » correspond directement au sens de נתן.
- source_word: לֵב
  choice: cœur
  rationale: Le mot hébreu désigne ici la faculté intérieure de penser, de juger et de discerner, sans exclure les autres dimensions de la personne; « esprit » en réduirait la portée.
- source_word: חָכָם וְנָבוֹן
  choice: sage et doué de discernement
  rationale: « Sage » exprime la sagesse nécessaire au gouvernement, et « doué de discernement » distingue clairement la nuance de compréhension judicieuse portée par נבון.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: si bien qu’il n’y a eu personne comme toi avant toi
  rationale: « Si bien que » marque le résultat ou la caractérisation du don sans lui attribuer une valeur de but; la formulation française exprime naturellement le caractère sans précédent de cette sagesse.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: et qu’après toi il ne se lèvera personne comme toi
  rationale: « Se lèvera » conserve l’image de קום, ici au sens de paraître ou de surgir dans l’histoire, tout en restant intelligible en français.
theological_decisions:
- issue: Portée de la supériorité promise à Salomon
  choice: La comparaison demeure liée, dans la phrase, au cœur sage et doué de discernement qui lui est donné.
  alternative: Comprendre l’énoncé comme une affirmation de supériorité absolue de Salomon dans tous les domaines.
  rationale: Le contexte immédiat porte sur la sagesse et le discernement accordés pour juger. La traduction ne généralise donc pas la promesse au-delà de ce que précise le texte, sans toutefois ajouter une restriction explicative absente de l’hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « Voici » est conservée pour reproduire l’insistance solennelle de l’hébreu. Le tutoiement correspond à l’adresse divine singulière à Salomon. La syntaxe reste naturelle tout en maintenant l’image de quelqu’un qui « se lèvera » après lui.
