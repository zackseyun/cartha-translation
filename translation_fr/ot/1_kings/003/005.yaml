  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: fr
  text: 'À Gabaon, Yahvé apparut à Salomon dans un rêve pendant la nuit[a], et Dieu dit : « Demande : que te donnerai-je ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « dans le rêve de la nuit », c’est-à-dire dans un rêve survenu pendant la nuit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: À Gabaon
  rationale: La préposition בְּ marque ici le lieu. « À Gabaon » est la tournure française naturelle pour situer la scène.
- source_word: נִרְאָה
  choice: apparut
  rationale: Le nifal de ראה désigne couramment une apparition, notamment divine. « Apparut » rend ce sens sans préciser davantage la forme de la manifestation.
- source_word: יְהֹוָה
  choice: Yahvé
  rationale: Cette forme française courante représente directement le tétragramme, plutôt que de le remplacer par un titre.
- source_word: אֶל שְׁלֹמֹה
  choice: à Salomon
  rationale: אֶל indique ici la personne à qui l’apparition est accordée; « à Salomon » est idiomatique en français.
- source_word: בַּ/חֲל֣וֹם הַ/לָּיְלָה
  choice: dans un rêve pendant la nuit
  rationale: La formulation rend naturellement le sens de l’expression littérale « dans le rêve de la nuit » tout en conservant le cadre nocturne.
- source_word: וַ/יֹּאמֶר
  choice: et … dit
  rationale: Le waw narratif fait progresser le récit. La coordination simple avec « et » suffit en français.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le texte passe de יהוה à אֱלֹהִים. Traduire ce dernier par « Dieu » préserve ce changement lexical.
- source_word: שְׁאַל
  choice: Demande
  rationale: L’impératif est direct et ouvert. « Demande » conserve cette brièveté sans ajouter un objet particulier.
- source_word: מָה אֶתֶּן לָךְ
  choice: ce que je dois te donner
  rationale: Cette proposition rend la question indirecte hébraïque « que te donnerai-je ? » après l’impératif, dans un français clair, sans ajouter « ce que tu veux ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. « Yahvé » en conserve la fonction de nom propre dans une forme française reconnue.
- issue: Changement de יהוה à אֱלֹהִים dans le même verset
  choice: Yahvé … Dieu
  alternative: Harmoniser les deux occurrences en « Dieu » ou en « Yahvé »
  rationale: Le maintien des deux désignations reflète fidèlement la variation du texte hébreu et évite de l’aplanir pour des raisons stylistiques.
- issue: Nuance de מָה אֶתֶּן לָךְ
  choice: ce que je dois te donner
  alternative: ce que tu veux que je te donne
  rationale: La variante serait plus explicite, mais elle introduirait l’idée de volonté ou de désir, absente de la formulation hébraïque.
translation_notes:
  register: Français international actuel, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La ponctuation et les espaces suivent l’usage typographique français.
