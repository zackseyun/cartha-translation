source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: fr
  text: 'Salomon dit : « Tu as manifesté envers ton serviteur David, mon père, une grande fidélité[a], comme il a marché devant toi avec fidélité[b], justice et droiture de cœur envers toi. Tu lui as conservé cette grande fidélité et tu lui as donné un fils qui siège sur son trône, comme on le voit aujourd’hui[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand amour fidèle », « une grande bonté » ou « une grande fidélité à l’alliance ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « avec vérité » ; le terme peut aussi évoquer la sincérité ou l’intégrité.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « comme en ce jour » : la situation présente en apporte la confirmation visible.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: fidélité
  rationale: Dans ce contexte royal et relationnel, le terme désigne la loyauté constante de Dieu envers David. « Fidélité » garde cette force sans ajouter explicitement le mot « alliance », absent du verset; une note conserve les autres nuances possibles.
- source_word: עָשִׂיתָ עִם
  choice: tu as témoigné … à
  rationale: Cette tournure française exprime naturellement l’action d’accorder ou de manifester la חֶסֶד à quelqu’un.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans une prière royale, « serviteur » rend le statut de David devant Dieu de façon exacte et naturelle.
- source_word: כַּאֲשֶׁר
  choice: parce que
  rationale: La conjonction introduit ici le motif associé à la faveur fidèle manifestée envers David; « parce que » transmet clairement cette valeur causale possible.
- source_word: הָלַךְ לְפָנֶיךָ
  choice: il a marché devant toi
  rationale: La traduction conserve la métaphore hébraïque traditionnelle de la conduite vécue en présence de Dieu, encore intelligible en français.
- source_word: בֶּאֱמֶת
  choice: avec fidélité
  rationale: אֱמֶת peut exprimer la vérité, la fiabilité ou la fidélité. Ici, dans une série décrivant la conduite de David, « avec fidélité » est naturel tout en laissant « avec vérité » en note.
- source_word: בִּצְדָקָה
  choice: justice
  rationale: Le nom désigne ici la rectitude morale de David. Après « avec », l’ellipse de la préposition devant les trois termes produit une phrase française fluide.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: droiture de cœur
  rationale: Cette expression préserve l’image hébraïque d’un cœur droit et désigne l’intégrité intérieure.
- source_word: עִמָּךְ
  choice: envers toi
  rationale: Le sens littéral est « avec toi », mais « droiture de cœur avec toi » serait peu naturel. « Envers toi » conserve la dimension relationnelle sans confondre ce complément avec « devant toi ».
- source_word: וַתִּשְׁמָר לוֹ
  choice: tu lui as conservé
  rationale: שׁמר indique que Dieu a maintenu pour David la fidélité déjà mentionnée; « conserver à quelqu’un » est concis et idiomatique.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: un fils qui siège sur son trône
  rationale: Le participe présente le fils comme actuellement assis sur le trône. « Qui siège » rend naturellement en français cet accomplissement présent.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Cette formulation rend l’idiome hébraïque qui désigne la situation présente comme confirmation visible, sans reproduire un calque français obscur.
theological_decisions:
- issue: Portée de חֶסֶד dans le contexte davidique
  choice: fidélité
  alternative: amour fidèle; bonté; fidélité à l’alliance
  rationale: Le contexte de succession royale donne au mot une forte dimension de loyauté durable et probablement d’alliance. Toutefois, puisque le mot « alliance » n’est pas explicite dans la proposition, le texte principal retient « fidélité » et la note expose les nuances possibles sans imposer une formulation doctrinale plus précise que l’hébreu.
- issue: Relation entre la conduite de David et la fidélité divine
  choice: parce qu’il a marché devant toi
  alternative: comme il a marché devant toi
  rationale: כַּאֲשֶׁר peut être causal ou comparatif. Le contexte permet la valeur causale, retenue pour sa clarté, mais cette traduction ne prétend pas définir à elle seule la relation théologique entre grâce, promesse et conduite humaine.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique « marcher devant toi » et l’image concrète du trône sont conservées; les formulations moins idiomatiques sont rendues par des équivalents naturels. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal et correspondent aux notes.
