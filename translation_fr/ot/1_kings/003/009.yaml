source:
  edition: WLC
  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: fr
  text: Accorde donc à ton serviteur un cœur qui écoute[a], afin qu’il juge ton peuple et discerne entre le bien et le mal. Car qui est capable de juger ton peuple, ce peuple si considérable[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cœur intelligent » ; littéralement « un cœur qui écoute » ou « qui entend ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu signifie littéralement « lourd » ou « de poids » ; il peut évoquer ici l’importance ou l’ampleur du peuple, ainsi que le poids de la tâche qui consiste à le gouverner.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Accorde donc
  rationale: Dans cette prière, la forme verbale introduite par waw exprime une demande découlant du contexte précédent. « Accorde donc » rend naturellement cette supplication en français.
- source_word: לְעַבְדְּךָ
  choice: à ton serviteur
  rationale: Salomon se désigne humblement devant Dieu par le terme conventionnel עבד. « Serviteur » convient au registre royal et religieux sans mettre indûment l’accent sur le statut d’esclave.
- source_word: לֵב שֹׁמֵעַ
  choice: un cœur qui écoute
  rationale: Cette formulation conserve l’image hébraïque du cœur attentif et réceptif, siège de la pensée et de la volonté, plutôt que de la réduire à la seule faculté intellectuelle.
- source_word: לִשְׁפֹּט
  choice: afin qu’il juge
  rationale: שפט englobe ici l’exercice du gouvernement et de la justice. « Juger » en préserve le sens lexical central, tandis que le contexte royal laisse percevoir sa portée plus large.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: Traduction directe qui conserve à la fois la relation du peuple à Dieu et sa réalité politique.
- source_word: לְהָבִין
  choice: et discerne
  rationale: À la forme hiphil, בין désigne une compréhension capable de distinguer. « Discerner » convient précisément au contexte judiciaire.
- source_word: בֵּין טוֹב לְרָע
  choice: entre le bien et le mal
  rationale: La traduction garde la formulation morale et évaluative de l’hébreu sans la restreindre à « le juste et l’injuste ».
- source_word: כִּי מִי יוּכַל
  choice: Car qui est capable
  rationale: Cette proposition donne la raison de la demande et souligne l’insuffisance humaine devant la tâche.
- source_word: הַכָּבֵד
  choice: si considérable
  rationale: L’adjectif signifie littéralement « lourd » et peut évoquer l’importance, l’ampleur ou le poids de la charge. « Considérable » reste naturel en français et laisse ouvertes ces dimensions.
theological_decisions:
- issue: L’idiome anthropologique dans la demande de Salomon
  choice: un cœur qui écoute
  alternative: un cœur intelligent / un cœur qui comprend
  rationale: Dans l’anthropologie hébraïque, le cœur est le centre de la réflexion, du discernement et de la volonté. Conserver « cœur » et l’image de l’écoute respecte cette conception sans réduire la demande à l’intelligence abstraite.
- issue: La portée de la fonction royale exprimée par שפט
  choice: juger
  alternative: gouverner / rendre justice
  rationale: Le verbe peut recouvrir gouvernement et administration de la justice. « Juger » conserve son noyau lexical et la tension entre les dimensions judiciaire et politique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à Dieu. L’image concrète du « cœur qui écoute » est maintenue, et « considérable » évite l’étrangeté de « lourd » dans le corps du texte tout en conservant sa nuance dans une note.
