  text: וְ/אִ֣ם תֵּלֵ֣ךְ בִּ/דְרָכַ֗/י לִ/שְׁמֹ֤ר חֻקַּ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖ךְ דָּוִ֣יד אָבִ֑י/ךָ וְ/הַאַרַכְתִּ֖י אֶת יָמֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: fr
  text: Et si tu marches dans mes voies, en observant mes prescriptions et mes commandements, comme David, ton père, a marché dans ces voies, alors je prolongerai tes jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : je prolongerai ta vie.'
    reason: L’expression hébraïque « prolonger tes jours » désigne une vie prolongée; la note donne l’équivalent idiomatique français.
lexical_decisions:
- source_word: וְאִם
  choice: Et si
  rationale: La conjonction et la particule conditionnelle rattachent cette condition à la suite du discours de l’Éternel.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: tu marches dans mes voies
  rationale: Cette formulation conserve la métaphore hébraïque de la conduite morale et l’expression d’alliance, tout en restant compréhensible en français actuel.
- source_word: לִשְׁמֹר
  choice: en observant
  rationale: L’infinitif précise la manière de marcher dans les voies de Dieu. « Observer » convient naturellement à des prescriptions et à des commandements.
- source_word: חֻקַּי
  choice: mes prescriptions
  rationale: « Prescriptions » rend le terme juridique et cultuel tout en le distinguant de « commandements ».
- source_word: וּמִצְוֺתַי
  choice: et mes commandements
  rationale: Ce choix conserve le registre de l’alliance et la distinction lexicale avec חֻקַּי.
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: comme … y a marché
  rationale: La reprise de « marcher » préserve l’écho verbal voulu par l’hébreu; « y » renvoie naturellement aux voies de Dieu.
- source_word: דָּוִיד אָבִיךָ
  choice: David, ton père
  rationale: L’apposition suit de près l’ordre hébreu et désigne David comme ancêtre de Salomon.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: alors je prolongerai tes jours
  rationale: « Alors » explicite naturellement l’apodose de la condition. « Prolonger tes jours » conserve l’image hébraïque sans masquer la promesse d’une vie plus longue.
theological_decisions:
- issue: Promesse conditionnelle d’une longue vie liée à l’obéissance à l’alliance
  choice: Présenter directement la condition et la promesse concrète de jours prolongés.
  alternative: Interpréter la phrase comme une promesse dynastique inconditionnelle ou comme une bénédiction générale.
  rationale: Le texte lie explicitement l’allongement des jours de Salomon à sa marche dans les voies de Dieu, à l’exemple de David. La traduction ne doit ni atténuer cette condition ni lui imposer une catégorie théologique ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique « marcher dans mes voies » et l’expression « prolonger tes jours » sont conservées, tandis que la syntaxe demeure naturelle. La répétition du verbe « marcher » reflète l’écho du texte hébreu.
