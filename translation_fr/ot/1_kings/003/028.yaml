  text: וַ/יִּשְׁמְע֣וּ כָל יִשְׂרָאֵ֗ל אֶת הַ/מִּשְׁפָּט֙ אֲשֶׁ֣ר שָׁפַ֣ט הַ/מֶּ֔לֶךְ וַ/יִּֽרְא֖וּ מִ/פְּנֵ֣י הַ/מֶּ֑לֶךְ כִּ֣י רָא֔וּ כִּֽי חָכְמַ֧ת אֱלֹהִ֛ים בְּ/קִרְבּ֖/וֹ לַ/עֲשׂ֥וֹת מִשְׁפָּֽט־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: fr
  text: Tout Israël entendit parler du jugement que le roi avait rendu, et tous craignirent le roi[a], car ils virent que la sagesse de Dieu était en lui pour rendre la justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « éprouvèrent un profond respect pour le roi » ou « furent saisis de crainte devant le roi ». Le terme hébreu peut exprimer la peur, la révérence ou une crainte respectueuse devant une autorité reconnue.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour exercer le droit » ou « pour prononcer des jugements ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: apprit
  rationale: Dans ce contexte, le verbe signifie que la nouvelle du jugement parvint à l’ensemble du peuple. « Apprit » exprime cela naturellement en français.
- source_word: כָל יִשְׂרָאֵל
  choice: Tout Israël
  rationale: Cette expression collective traditionnelle désigne la nation dans son ensemble et conserve la forme concise de l’hébreu.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: le jugement que le roi avait rendu
  rationale: « Rendre un jugement » est une formulation juridique française naturelle qui reproduit le lien entre le nom מִשְׁפָּט et le verbe שׁפט.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: craignit le roi
  rationale: « Craindre » conserve le sens premier de ירא, tout en pouvant inclure ici le respect et la révérence suscités par l’autorité et la sagesse reconnues du roi.
- source_word: חָכְמַת אֱלֹהִים
  choice: la sagesse de Dieu
  rationale: Le syntagme attribue explicitement cette sagesse à Dieu; la traduction garde cette référence personnelle sans la réduire à l’adjectif « divine ».
- source_word: בְּקִרְבּוֹ
  choice: était en lui
  rationale: L’expression présente la sagesse comme résidant en Salomon; « en lui » restitue simplement cette image intérieure.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: pour rendre la justice
  rationale: Cette expression française naturelle décrit l’exercice de la fonction judiciaire, tout en laissant en note les possibilités plus littérales ou ponctuelles.
theological_decisions:
- issue: Sens de אֱלֹהִים dans l’attribution de la sagesse royale
  choice: Dieu
  alternative: divine
  rationale: L’hébreu nomme explicitement Dieu et attribue à celui-ci la sagesse manifestée par Salomon; rien dans le contexte ne justifie d’atténuer cette référence.
- issue: Nuance de la réaction exprimée par וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: craignit le roi
  alternative: éprouva un profond respect pour le roi / fut saisi de crainte devant le roi
  rationale: Le verbe peut exprimer la peur, la révérence ou une crainte mêlée de respect. Le texte principal retient le sens lexical direct, tandis que la note préserve l’étendue de la nuance sans trancher la tension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe collective de « Tout Israël » est conservée; les verbes au singulier sont naturels en français. Le vocabulaire juridique reste accessible, et les notes maintiennent les ambiguïtés lexicales de l’hébreu.
