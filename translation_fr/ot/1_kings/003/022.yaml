base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: fr
  text: 'Mais l’autre femme dit[a] : « Non ! C’est mon fils qui est vivant, et le tien est mort. » La première répliqua : « Non ! C’est ton fils qui est mort, et le mien est vivant. » C’est ainsi qu’elles parlèrent devant le roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire plus littéralement : « Mon fils est le vivant, et ton fils est le mort […] ton fils est le mort, et mon fils est le vivant. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: dit
  rationale: Le verbe narratif courant אָמַר introduit ici directement les paroles de la femme ; « dit » en donne le sens sans surinterpréter la prise de parole.
- source_word: הָאִשָּׁה הָאַחֶרֶת
  choice: l’autre femme
  rationale: Le syntagme désigne l’autre des deux femmes impliquées dans le différend ; « femme » convient au contexte sans lui attribuer un statut matrimonial.
- source_word: לֹא כִי
  choice: Non !
  rationale: La locution exprime une contradiction énergique. Cette formulation brève et vive est naturelle en français moderne.
- source_word: בְּנִי הַחַי
  choice: C’est mon fils qui est vivant
  rationale: La construction clivée restitue clairement l’identification contrastive portée par l’adjectif défini הַחַי, tout en restant idiomatique en français.
- source_word: וּבְנֵךְ הַמֵּת
  choice: et le tien est mort
  rationale: Le possessif évite une répétition lourde, tandis que l’opposition « vivant / mort » conserve le contraste explicite entre les deux enfants.
- source_word: וְזֹאת אֹמֶרֶת
  choice: La première répliqua
  rationale: Le démonstratif féminin renvoie à l’autre interlocutrice dans l’alternance. « La première » l’identifie naturellement en français d’après le récit précédent, et « répliqua » rend l’opposition immédiate sans ajouter de contenu.
- source_word: וַתְּדַבֵּרְנָה
  choice: C’est ainsi qu’elles parlèrent
  rationale: Le féminin pluriel récapitule leur échange contradictoire. « C’est ainsi » rend la progression récapitulative du récit sans imposer l’idée non explicite qu’elles continuèrent longtemps.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: Traduction à la fois directe et idiomatique ; le contexte identifie déjà le roi, sans qu’il soit nécessaire d’ajouter son nom.
