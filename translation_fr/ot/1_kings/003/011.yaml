  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: fr
  text: 'Et Dieu lui dit : « Puisque tu as demandé cela, et que tu n’as demandé pour toi ni une longue vie, ni la richesse, ni la vie de tes ennemis, mais que tu as demandé pour toi le discernement pour écouter et rendre la justice,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: une longue vie
  rationale: Littéralement « de nombreux jours » ; en français courant, l’expression désigne naturellement une longue vie.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: la vie de tes ennemis
  rationale: נֶפֶשׁ désigne ici la vie des ennemis, demandée au sens de leur mort, sans expliciter davantage que l’hébreu.
- source_word: הָבִין
  choice: le discernement nécessaire
  rationale: L’infinitif exprime la capacité de comprendre ou discerner ; « discernement » convient au contexte judiciaire.
- source_word: לִשְׁמֹעַ מִשְׁפָּט
  choice: pour écouter et rendre la justice
  rationale: שׁמע conserve l’idée d’écouter, tandis que מִשְׁפָּט renvoie ici à l’exercice de la justice et du jugement royal. La formulation française rend la finalité judiciaire sans réduire le terme à une simple perception auditive.
theological_decisions:
- issue: Sens de « la vie de tes ennemis »
  choice: Conserver la formulation concrète « la vie de tes ennemis »
  alternative: « la mort de tes ennemis »
  rationale: Le texte hébreu dit littéralement que Salomon n’a pas demandé leur נֶפֶשׁ, leur vie. La traduction préserve cette tournure et son implicite sans l’interpréter à la place du lecteur.
- issue: Portée de מִשְׁפָּט
  choice: « rendre la justice »
  alternative: « entendre le jugement »
  rationale: Dans le contexte de la fonction royale, il s’agit de discerner les affaires entendues afin d’exercer la justice. Cette formulation demeure centrée sur la responsabilité judiciaire accordée par Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par une virgule finale, conformément à la continuité syntaxique avec le verset suivant. Le parallélisme négatif est rendu naturellement par la série « ni… ni… ni… ».
