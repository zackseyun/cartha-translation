  to: 'Alors le roi répondit : « Donnez-lui l’enfant vivant et ne le faites surtout pas mourir[a] : c’est elle qui est sa mère. »'
  rationale: La traduction est conservée pour l’essentiel. Le déplacement de « surtout » rend l’interdiction plus idiomatique en français. La note est corrigée afin de refléter la différence entre l’infinitif absolu « mourir » et le verbe causatif « faire mourir », tout en expliquant l’intensité de l’interdiction.
