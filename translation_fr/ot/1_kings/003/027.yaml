base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: fr
  text: 'Alors le roi répondit : « Donnez-lui l’enfant vivant et ne le faites surtout pas mourir[a] : c’est elle qui est sa mère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement une forme intensive : « mourir, vous ne le ferez pas mourir ». Elle exprime ici une interdiction catégorique : « ne le tuez surtout pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: Alors le roi répondit
  rationale: La formule narrative signifie littéralement « le roi répondit et dit ». En français moderne, « répondit » exprime naturellement l’ensemble sans reproduire une redondance hébraïque peu idiomatique.
- source_word: תְּנוּ לָהּ
  choice: Donnez-lui
  rationale: L’impératif pluriel suivi du pronom indirect est rendu directement et naturellement.
- source_word: הַיָּלוּד הַחַי
  choice: l’enfant vivant
  rationale: יַלוּד désigne ici l’enfant qui est né, et הַחַי précise qu’il est vivant. Cette formulation est claire et conserve le contraste du récit.
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: et surtout ne le faites pas mourir
  rationale: La combinaison de l’infinitif absolu et du verbe causatif renforce fortement l’interdiction. « Surtout ne… pas » restitue cette insistance dans un français naturel, tandis que « faites pas mourir » reflète la valeur causative.
- source_word: הִיא אִמּוֹ
  choice: c’est elle qui est sa mère
  rationale: La tournure emphatique française met en relief הִיא, placé en tête de la proposition hébraïque, et affirme l’identité de la véritable mère.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours royal reste ferme sans devenir artificiellement solennel. La redondance de la formule hébraïque « répondit et dit » est allégée conformément à l’usage français.
