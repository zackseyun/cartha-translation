  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: fr
  text: 'Alors le roi dit : « Apportez-moi une épée. » Et l’on apporta l’épée devant le roi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Rend directement le nom défini avec son article.
- source_word: קְחוּ לִי
  choice: Apportez-moi
  rationale: Bien que לקח signifie fondamentalement « prendre », l’impératif suivi de לִי demande ici d’aller chercher une épée et de l’amener au locuteur ; « Apportez-moi » est l’équivalent idiomatique naturel.
- source_word: חָרֶב
  choice: une épée
  rationale: La première occurrence est sans article et introduit l’objet demandé ; l’article indéfini convient en français.
- source_word: וַיָּבִאוּ
  choice: Et l’on apporta
  rationale: Le waw narratif enchaîne l’exécution de l’ordre. Le pluriel hébreu a un sujet indéterminé ; « l’on » le restitue sans inventer d’acteurs précis.
- source_word: הַחֶרֶב
  choice: l’épée
  rationale: La seconde occurrence porte l’article et renvoie à l’épée qui vient d’être demandée.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: Expression française concise qui conserve l’idée de faire venir l’objet en présence du roi.
