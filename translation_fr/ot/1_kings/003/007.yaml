source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: fr
  text: 'Et maintenant, Yahweh, mon Dieu, c’est toi qui as établi ton serviteur comme roi à la place de David, mon père ; et moi, je ne suis qu’un jeune garçon[a] : je ne sais pas sortir ni entrer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un enfant » ou « un jeune homme ». L’expression hébraïque est une manière humble de souligner la jeunesse et l’inexpérience de Salomon, sans en préciser l’âge.
    reason: lexical_alternative
  - marker: b
    text: « Sortir et entrer » est une expression hébraïque qui peut désigner l’exercice de responsabilités, notamment dans la vie publique.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Reproduit simplement la transition hébraïque qui introduit la prière de Salomon.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh mon Dieu
  rationale: Conserve le nom divin יהוה sous la forme « Yahweh » et rend directement le possessif אֱלֹהָי.
- source_word: אַתָּה הִמְלַכְתָּ
  choice: c’est toi qui as établi roi
  rationale: La tournure emphatique rend le pronom אַתָּה et le hiphil de מלך, qui signifie faire de quelqu’un un roi ou l’établir comme roi.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette prière royale, le terme exprime la dépendance et l’humble service de Salomon envers Dieu.
- source_word: תַּחַת דָּוִד אָבִי
  choice: à la place de David, mon père
  rationale: תַּחַת marque ici la succession de Salomon à David.
- source_word: נַעַר קָטֹן
  choice: un jeune garçon
  rationale: La formule souligne humblement la jeunesse et l’inexpérience; elle ne permet pas de déterminer avec précision l’âge de Salomon.
- source_word: לֹא אֵדַע צֵאת וָבֹא
  choice: je ne sais pas sortir ni entrer
  rationale: Conserve l’image idiomatique hébraïque sans introduire directement l’interprétation « gouverner » dans le texte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; sa translittération préserve le nom propre de l’alliance.
- issue: Portée de נַעַר קָטֹן
  choice: je ne suis qu’un jeune garçon
  alternative: je ne suis qu’un enfant / je suis très jeune
  rationale: Le rendu garde l’auto-abaissement de Salomon et son inexpérience sans transformer la formule en affirmation précise sur son âge.
- issue: Sens de « sortir et entrer »
  choice: conserver l’expression dans le texte et l’expliquer en note
  alternative: je ne sais pas gouverner / diriger
  rationale: L’hébreu emploie une image susceptible de désigner l’exercice des responsabilités, notamment publiques; la conserver évite de réduire sa portée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure de la prière reste proche de l’hébreu, tandis que « c’est toi qui » et « je ne suis qu’ » rendent naturellement ses accents emphatiques et humbles.
