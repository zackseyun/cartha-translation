  text: Then one woman said, “Please, my lord, I and this woman live in one house, and I gave birth while she was in the house with me.
translation:
  language: fr
  text: 'Alors l’une des femmes dit : « Je t’en prie, mon seigneur ! Cette femme et moi habitons dans la même maison, et j’ai accouché alors qu’elle était avec moi dans la maison. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Pardon, mon seigneur !
  rationale: Formule respectueuse par laquelle on sollicite la permission de parler devant le roi ; « Pardon » est naturel en français moderne, tandis que « mon seigneur » conserve le titre honorifique.
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: habitons dans la même maison
  rationale: Le participe exprime ici une situation d’habitation commune ; « la même maison » restitue naturellement l’hébreu littéral « une seule maison ».
- source_word: וָאֵלֵד עִמָּהּ בַּבָּיִת
  choice: j’ai accouché alors qu’elle était avec moi dans la maison
  rationale: Préserve la présence de l’autre femme au moment de l’accouchement sans surinterpréter la préposition עִם.
theological_decisions: []
translation_notes:
  register: Français international moderne, oral mais digne, adapté à une déclaration adressée au roi. Le présent « habitons » respecte la valeur contextuelle du participe hébreu et l’ambiguïté temporelle relevée dans la tradition de traduction.
