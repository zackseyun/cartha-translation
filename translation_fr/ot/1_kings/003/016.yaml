lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marqueur temporel qui introduit l’épisode suivant et conserve naturellement la progression du récit.
- source_word: תָּבֹאנָה
  choice: vinrent trouver
  rationale: Le verbe בוא exprime ici un mouvement vers le roi. « Vinrent trouver » est idiomatique en français et maintient cette orientation.
- source_word: שְׁתַּיִם נָשִׁים
  choice: deux femmes
  rationale: Rendu direct et naturel du groupe formé par le nombre et le nom.
- source_word: זֹנוֹת
  choice: qui se prostituaient
  rationale: Le participe qualifie les femmes. Cette proposition relative exprime leur activité sans employer un substantif susceptible de réduire leur identité à celle-ci.
- source_word: אֶל הַמֶּלֶךְ
  choice: le roi
  rationale: Dans « vinrent trouver le roi », le complément conserve le mouvement dirigé vers le roi exprimé par אֶל.
- source_word: וַתַּעֲמֹדְנָה
  choice: et se tinrent
  rationale: Le verbe עמד décrit leur position debout ou leur comparution; « se tinrent » convient au contexte d’une audience sans expliciter davantage la scène.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Rendu direct de l’expression courante désignant la présence devant un souverain ou un juge.
