  naturalness: Le français est moderne et digne. Une virgule plutôt qu’un point après « l’honneur » relie plus clairement les dons à leur conséquence. « Durant toute ta vie » est naturel et rattache sans ambiguïté la durée à la comparaison.
  terminology: « Richesse », « honneur », « parmi les rois » et « aucun homme » conviennent. « Aucun homme » maintient l’explicitation de אִישׁ sans réduire indûment le sens à « aucun roi ».
