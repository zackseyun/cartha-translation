  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: fr
  text: 'Je t’ai aussi donné ce que tu n’as pas demandé : la richesse et l’honneur, de sorte que, parmi les rois, aucun homme ne sera comme toi durant toute ta vie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est à l’accompli : littéralement, « aucun homme n’a été comme toi parmi les rois, tous tes jours ». Dans le contexte de cette promesse, il peut aussi être rendu au futur, comme dans le texte.'
    reason: ambiguïté de l’aspect verbal et de la portée temporelle
lexical_decisions:
- source_word: וְגַם
  choice: Je t’ai aussi
  rationale: La conjonction et la particule additive poursuivent la parole de Dieu et introduisent un don qui s’ajoute à celui que Salomon avait demandé. En français, « aussi » suffit à rendre naturellement cette valeur cumulative.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: ce que tu n’as pas demandé
  rationale: Cette formulation idiomatique conserve directement le sens de la proposition relative hébraïque.
- source_word: נָתַתִּי לָךְ
  choice: donné
  rationale: Le passé composé rend l’accompli hébreu comme un don décidé et accordé par Dieu, avec un effet présent pour Salomon.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: la richesse et l’honneur
  rationale: Le double גַּם coordonne deux bienfaits supplémentaires. « Richesse » convient à עֹשֶׁר, tandis que « honneur » exprime ici le rang et la considération royale portés par כָּבוֹד, plutôt que la « gloire » au sens théologique.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: Ainsi […] il n’y aura […] aucun homme comme toi
  rationale: La proposition indique naturellement le résultat des dons accordés. Le futur français convient à la portée de la promesse sur la vie à venir de Salomon, tandis que « aucun homme » conserve l’emploi explicite de אִישׁ.
- source_word: בַּמְּלָכִים
  choice: parmi les rois
  rationale: La préposition situe la comparaison au sein de la catégorie des rois.
- source_word: כָּל יָמֶיךָ
  choice: pendant toute ta vie
  rationale: Cette expression rend en français actuel l’idiome hébreu littéral « tous tes jours » sans en modifier la portée.
theological_decisions:
- issue: Portée temporelle de לֹא הָיָה dans une promesse
  choice: il n’y aura
  alternative: il n’y a pas eu
  rationale: Bien que le verbe hébreu soit morphologiquement à l’accompli, le contexte est celui de dons divins dont les effets s’étendront sur tous les jours de Salomon. Le futur exprime donc le mieux la valeur contextuelle, tout en signalant la forme hébraïque en note.
- issue: Maintien du nom masculin אִישׁ
  choice: aucun homme comme toi
  alternative: personne comme toi
  rationale: Le texte nomme explicitement un homme au sein des rois. La traduction conserve cette précision sans remplacer le terme par « roi », qui anticiperait le groupe comparatif suivant.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue clairement le don supplémentaire de son résultat. « Pendant toute ta vie » est plus naturel aujourd’hui que le calque « tous tes jours », tout en gardant la même étendue temporelle.
