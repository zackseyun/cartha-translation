base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: fr
  text: Je me suis levée le matin pour allaiter mon fils, et voilà qu’il était mort. Je l’ai examiné attentivement le matin, et voilà que ce n’était pas mon fils, celui que j’avais mis au monde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם
  choice: Je me suis levée
  rationale: Le wayyiqtol qal à la première personne du singulier exprime l’action successive de la femme. Le féminin est exigé par l’identité de la locutrice en contexte.
- source_word: בַּבֹּקֶר
  choice: le matin / au matin
  rationale: L’expression temporelle est répétée deux fois dans l’hébreu. La répétition est conservée, avec une légère variation idiomatique en français.
- source_word: לְהֵינִיק
  choice: pour allaiter
  rationale: L’infinitif hifil de ינק désigne ici le fait de donner le sein à un nourrisson. « Allaiter » est précis et naturel en français moderne.
- source_word: אֶת־בְּנִי
  choice: mon fils
  rationale: בֵּן avec le suffixe de première personne signifie spécifiquement « mon fils ».
- source_word: וְהִנֵּה
  choice: et voilà que
  rationale: La particule introduit une constatation soudaine et dramatique. Sa répétition est maintenue aux deux endroits.
- source_word: מֵת
  choice: il était mort
  rationale: Le terme décrit l’état de l’enfant au moment où sa mère se lève. Cette formulation est claire et respecte la valeur prédicative de l’hébreu.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: Je l’ai examiné attentivement
  rationale: La forme réfléchie/intensive de בין ou בון exprime une observation soigneuse conduisant à la reconnaissance. « Examiner attentivement » rend cette nuance sans surinterprétation.
- source_word: לֹא הָיָה בְנִי
  choice: ce n’était pas mon fils
  rationale: La tournure française avec « ce » est naturelle pour identifier l’enfant observé tout en conservant exactement le constat de la mère.
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: celui que j’avais mis au monde
  rationale: Le verbe ילד à la première personne renvoie à l’accouchement. Le plus-que-parfait marque naturellement en français l’antériorité de la naissance par rapport à la reconnaissance.
