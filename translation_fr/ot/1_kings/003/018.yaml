translation_notes:
  register: 'Français moderne, clair et digne, adapté à une déposition orale devant le roi. La répétition finale de « dans la maison » est maintenue pour préserver l’insistance de l’hébreu. Aucun marqueur de note n’est nécessaire, car la variante fournie dans la couche anglaise semble rattachée au mauvais segment : son contenu concerne זָר et non « après mon accouchement ».'
