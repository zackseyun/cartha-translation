  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: fr
  text: 'Le troisième jour après mon accouchement, cette femme a elle aussi accouché. Nous étions ensemble ; il n’y avait aucun étranger[a] avec nous dans la maison : nous étions seules toutes les deux dans la maison.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « personne extérieure ». Le terme hébreu peut désigner quelqu’un qui ne fait pas partie du groupe ou de la maisonnée.
    reason: alternative_lexical
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: Le troisième jour après mon accouchement
  rationale: La tournure temporelle situe naturellement l’événement au troisième jour après que la locutrice a enfanté. En français, « après mon accouchement » est clair et idiomatique, sans alourdir la narration par un calque de וַיְהִי.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: cette femme a elle aussi accouché
  rationale: « Cette femme » conserve la valeur déictique et quelque peu insistante de הָאִשָּׁה הַזֹּאת dans la déposition. « Elle aussi » rend explicitement גַּם.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: Nous étions ensemble
  rationale: Cette formulation rend directement יַחְדָּו sans anticiper la précision suivante sur l’absence de tiers.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: il n’y avait aucun étranger avec nous dans la maison
  rationale: « Étranger » conserve le sens de זָר, qui désigne ici une personne extérieure au groupe ou à la maisonnée, plutôt que de généraliser immédiatement en « personne d’autre ».
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: nous étions seules toutes les deux dans la maison
  rationale: Cette formulation française naturelle exprime l’exclusivité de זוּלָתִי et le féminin de שְׁתַּיִם, tout en conservant la répétition de « dans la maison » qui souligne l’absence de témoin.
