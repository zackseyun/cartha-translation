source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: fr
  text: Cependant, le peuple offrait des sacrifices sur les hauts lieux[a], car jusqu’alors aucune maison n’avait été construite pour le nom de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « temple ». Hébreu : « maison ». L’expression « pour le nom de Yahweh » désigne la maison de culte qui devait être construite à Jérusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Cependant
  rationale: La particule introduit ici une réserve par rapport à l’appréciation positive qui précède. « Cependant » exprime naturellement cette nuance concessive en français.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme désigne ici l’ensemble de la population qui rendait un culte, sans opposition technique nécessaire avec ses dirigeants.
- source_word: מְזַבְּחִים
  choice: offrait des sacrifices
  rationale: Le participe marque une pratique en cours ou habituelle ; l’imparfait français en rend bien l’aspect.
- source_word: בַבָּמוֹת
  choice: sur les hauts lieux
  rationale: « Hauts lieux » est le terme biblique français courant pour les sites cultuels appelés בָּמוֹת ; la préposition « sur » conserve l’image spatiale de l’hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle le peuple sacrifiait sur les hauts lieux.
- source_word: לֹא נִבְנָה בַיִת
  choice: aucune maison n’avait été construite
  rationale: Le passif est conservé et בַּיִת est rendu par son sens premier, « maison », sans expliciter « temple » dans le texte.
- source_word: לְשֵׁם יְהוָה
  choice: pour le nom de Yahweh
  rationale: Cette formulation préserve l’expression théologique propre au langage du temple, sans la réduire à « pour Yahweh ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu.
- source_word: עַד הַיָּמִים הָהֵם
  choice: jusqu’alors
  rationale: 'Cette tournure française naturelle rend la limite temporelle de l’hébreu : jusqu’à l’époque dont parle le récit.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » en préserve la valeur de nom propre.
- issue: Interprétation de בַיִת
  choice: maison
  alternative: temple
  rationale: « Maison » respecte le lexème hébreu et maintient l’expression « maison pour le nom de Yahweh » ; le contexte permet de comprendre qu’il s’agit du temple sans l’imposer dans la traduction.
- issue: Portée de רַק
  choice: Cependant
  alternative: Seulement
  rationale: Dans le contexte, la particule introduit une réserve concessive plutôt qu’une simple restriction portant exclusivement sur « le peuple ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant un calque maladroit. « Jusqu’alors » est préféré à « en ces jours-là », car עַד exprime explicitement une limite temporelle.
