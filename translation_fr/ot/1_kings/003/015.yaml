  text: וַ/יִּקַ֥ץ שְׁלֹמֹ֖ה וְ/הִנֵּ֣ה חֲל֑וֹם וַ/יָּב֨וֹא יְרוּשָׁלִַ֜ם וַֽ/יַּעֲמֹ֣ד לִ/פְנֵ֣י אֲר֣וֹן בְּרִית אֲדֹנָ֗/י וַ/יַּ֤עַל עֹלוֹת֙ וַ/יַּ֣עַשׂ שְׁלָמִ֔ים וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָֽי/ו׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: fr
  text: 'Salomon se réveilla, et voici : c’était un rêve. Il se rendit à Jérusalem et se tint devant l’arche de l’alliance du Seigneur. Il offrit des holocaustes et des sacrifices de paix[a], puis donna un banquet pour tous ses serviteurs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ; ces sacrifices donnaient notamment lieu à un repas partagé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: se réveilla
  rationale: Le verbe désigne le réveil après le sommeil. « Se réveilla » est la formulation narrative la plus naturelle en français moderne.
- source_word: וְהִנֵּה
  choice: et voici
  rationale: La particule attire brusquement l’attention sur ce que Salomon constate. « Et voici » en conserve la force sans transformer explicitement la constatation en acte de compréhension.
- source_word: חֲלוֹם
  choice: c’était un rêve
  rationale: 'L’hébreu dit littéralement « voici : un rêve ». La copule ajoutée est nécessaire en français courant et n’altère pas le sens.'
- source_word: וַיָּבֹא יְרוּשָׁלִַם
  choice: il se rendit à Jérusalem
  rationale: בוא exprime ici l’arrivée à Jérusalem. « Se rendit » est naturel en français et évite d’ajouter l’idée explicite d’un retour, absente du texte.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: se tint devant
  rationale: Cette expression rend directement l’action de se tenir en présence de l’arche, dans un registre digne et naturel.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: l’arche de l’alliance du Seigneur
  rationale: La formulation préserve la chaîne construite hébraïque. Le texte fourni porte אֲדֹנָי, « Seigneur », plutôt que le tétragramme יהוה ; « du Seigneur » respecte donc cette donnée textuelle.
- source_word: וַיַּעַל עֹלוֹת
  choice: il offrit des holocaustes
  rationale: עֹלָה désigne le sacrifice entièrement consumé sur l’autel. « Holocaustes » est le terme sacrificiel français établi ; le verbe « offrit » exprime naturellement le hiphil de עלה dans ce contexte.
- source_word: שְׁלָמִים
  choice: sacrifices de paix
  rationale: Cette expression correspond étroitement au nom hébreu de cette catégorie sacrificielle, tout en laissant à la note l’autre rendu courant qui souligne le repas partagé.
- source_word: מִשְׁתֶּה
  choice: un banquet
  rationale: Le nom désigne un festin, souvent avec boisson. « Banquet » convient au cadre royal et festif.
- source_word: לְכָל עֲבָדָיו
  choice: pour tous ses serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs ou des fonctionnaires royaux. Le rendu direct « serviteurs » conserve cette largeur sémantique sans restreindre le groupe aux seuls hauts fonctionnaires.
theological_decisions:
- issue: Rendu du titre divin dans אֲרוֹן בְּרִית אֲדֹנָי
  choice: du Seigneur
  alternative: de l’Éternel
  rationale: Le texte massorétique fourni lit אֲדֹנָי, titre signifiant « Seigneur », et non יהוה. Traduire « l’Éternel » importerait ici un autre mot hébreu et effacerait une particularité réelle du texte source.
- issue: Sens sacrificiel de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: Le rendu principal maintient le lien lexical avec l’idée de paix ou d’intégrité, tandis que l’alternative souligne à juste titre la communion exprimée par le repas sacrificiel. La note conserve les deux dimensions sans imposer une interprétation unique.
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme séquentiel de l’hébreu est conservé sans multiplier mécaniquement les « et ». « Et voici » maintient l’effet de découverte du texte source ; les termes sacrificiels établis sont employés avec une note pour le terme potentiellement ambigu.
