  yaml_path: translation/ot/1_kings/003/019.yaml
  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: fr
  text: Le fils de cette femme mourut pendant la nuit, parce qu’elle s’était couchée sur lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lorsqu’elle s’était couchée sur lui » ou « elle qui s’était couchée sur lui »; le contexte permet de comprendre cette proposition comme indiquant la cause de la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מוּת rapporte un événement passé dans le récit; le passé simple convient au registre narratif français.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: Le fils de cette femme
  rationale: Cette formulation naturelle conserve le sens précis de בֶּן, « fils », ainsi que le démonstratif « cette ».
- source_word: לָיְלָה
  choice: pendant la nuit
  rationale: L’accusatif de temps indique le moment où la mort survint; « pendant la nuit » est naturel en français et garde l’idée de la période nocturne.
- source_word: אֲשֶׁר
  choice: parce que
  rationale: Dans ce contexte, la proposition explique la cause de la mort. Le lien causal est rendu explicitement, tout en signalant en note la formulation hébraïque plus ouverte.
- source_word: שָׁכְבָה עָלָיו
  choice: elle s’était couchée sur lui
  rationale: שָׁכַב avec עַל décrit ici le fait de se trouver couché sur l’enfant. Le plus-que-parfait marque naturellement en français l’action antérieure à sa mort.
