id: 1KI.3.3
reference: 1 Kings 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֤ב שְׁלֹמֹה֙ אֶת יְהוָ֔ה לָ/לֶ֕כֶת בְּ/חֻקּ֖וֹת דָּוִ֣ד אָבִ֑י/ו רַ֚ק בַּ/בָּמ֔וֹת ה֥וּא מְזַבֵּ֖חַ וּ/מַקְטִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: fr
  text: Salomon aimait Yahweh et suivait les prescriptions de David, son père. Toutefois, il offrait des sacrifices et faisait brûler de l’encens dans les hauts lieux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « hauts lieux » étaient des sites cultuels locaux, souvent aménagés sur une hauteur.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: aimait
  rationale: L’imparfait exprime naturellement en français l’attitude durable attribuée à Salomon, tout en conservant le sens direct d’אהב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לָלֶכֶת בְּחֻקּוֹת
  choice: suivait les prescriptions
  rationale: L’expression hébraïque « marcher dans les prescriptions » décrit la conduite. Cette formulation française naturelle conserve la nuance normative de חֻקּוֹת.
- source_word: דָּוִד אָבִיו
  choice: de David, son père
  rationale: Cette formulation garde l’apposition hébraïque tout en étant claire et idiomatique en français.
- source_word: רַק
  choice: Toutefois
  rationale: Le terme introduit une restriction à l’évaluation positive précédente. « Toutefois » marque cette réserve sans transformer le passage en condamnation absolue.
- source_word: בַּבָּמוֹת
  choice: dans les hauts lieux
  rationale: « Hauts lieux » est le terme biblique français usuel pour les sites cultuels locaux, souvent établis sur une hauteur; une note en précise le sens.
- source_word: מְזַבֵּחַ
  choice: offrait des sacrifices
  rationale: Le participe indique ici une pratique habituelle; l’imparfait français en restitue l’aspect duratif.
- source_word: וּמַקְטִיר
  choice: et faisait brûler de l’encens
  rationale: Dans ce contexte cultuel, le hiphil de קטר désigne ce que l’on fait monter en fumée. Cette traduction courante reste intelligible, bien que le terme puisse aussi viser plus largement des offrandes consumées.
theological_decisions:
- issue: Évaluation narrative du culte pratiqué par Salomon
  choice: Le verset affirme réellement l’amour de Salomon pour Yahweh, puis apporte une réserve concernant son culte dans les hauts lieux.
  alternative: Comprendre soit que l’éloge est ironique ou presque annulé, soit que le culte dans les hauts lieux est pleinement approuvé à ce stade.
  rationale: La syntaxe commence par une appréciation positive, puis רַק introduit une limitation. La traduction maintient cette tension sans la résoudre dans un sens entièrement favorable ou entièrement défavorable.
translation_notes:
  register: Français international moderne, digne et accessible. « Suivait les prescriptions » rend naturellement l’image hébraïque de la marche; « hauts lieux » conserve le vocabulaire biblique traditionnel avec une explication en note.
