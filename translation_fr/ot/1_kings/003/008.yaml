source:
  edition: WLC
  text: וְ/עַ֨בְדְּ/ךָ֔ בְּ/ת֥וֹךְ עַמְּ/ךָ֖ אֲשֶׁ֣ר בָּחָ֑רְתָּ עַם רָ֕ב אֲשֶׁ֧ר לֹֽא יִמָּנֶ֛ה וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: fr
  text: Et ton serviteur se trouve au milieu de ton peuple que tu as choisi, un peuple si nombreux qu’on ne peut ni le compter ni le dénombrer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’on ne peut compter ni dénombrer tant il est nombreux » ou « à cause de sa multitude ».'
    reason: La traduction courante intègre la valeur causale de מֵרֹב dans « si nombreux »; la note rend plus explicitement la construction hébraïque.
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: Et ton serviteur
  rationale: Dans la prière de Salomon, « serviteur » exprime naturellement sa dépendance et sa soumission envers Dieu, sans la connotation sociale plus étroite qu’aurait ici « esclave ».
- source_word: בְּתוֹךְ עַמְּךָ
  choice: se trouve au milieu de ton peuple
  rationale: « Au milieu de » conserve l’image spatiale de בְּתוֹךְ tout en restant naturel en français; « se trouve » explicite la proposition nominale hébraïque sans en modifier le sens.
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: que tu as choisi
  rationale: La formulation directe préserve l’affirmation explicite selon laquelle Dieu a choisi ce peuple.
- source_word: עַם רָב
  choice: un peuple si nombreux
  rationale: Dans ce contexte, רָב désigne principalement l’importance numérique, comme le confirme la proposition qui suit. « Si nombreux » relie naturellement les deux membres de la phrase.
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר מֵרֹב
  choice: qu’on ne peut ni le compter ni le dénombrer
  rationale: Les deux verbes parallèles d’énumération sont maintenus, tandis que « ne peut » rend l’impossibilité causée par la multitude. La note restitue explicitement מֵרֹב.
theological_decisions:
- issue: Statut d’Israël comme peuple choisi par Dieu
  choice: ton peuple que tu as choisi
  alternative: ton peuple, celui que tu as choisi
  rationale: L’hébreu affirme directement l’appartenance du peuple à Dieu et son choix par Dieu. La traduction conserve ces deux éléments sans développer leur portée théologique au-delà du verset.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement convient à l’adresse biblique directe à Dieu. La formulation garde le parallélisme « compter / dénombrer » et évite un vocabulaire confessionnel ajouté.
