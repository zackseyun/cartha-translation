source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: fr
  text: Le roi se rendit à Gabaon pour y offrir des sacrifices, car c’était le principal haut lieu[a]. Salomon offrit mille holocaustes sur cet autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grand haut lieu ». L’adjectif hébreu peut évoquer aussi bien la grandeur que l’importance ou la prééminence.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: se rendit
  rationale: Le verbe הלך indique simplement le déplacement; « se rendit » est naturel en français narratif sans ajouter l’idée de montée.
- source_word: גִּבְעֹנָה
  choice: à Gabaon
  rationale: Le ה directionnel marque un mouvement vers la ville; « Gabaon » est la forme française traditionnelle et largement reconnue.
- source_word: לִזְבֹּחַ שָׁם
  choice: pour y offrir des sacrifices
  rationale: זבח désigne l’action sacrificielle en général. Cette formulation explicite naturellement en français que les sacrifices sont offerts, sans anticiper le terme plus précis « holocaustes » de la suite.
- source_word: הַבָּמָה הַגְּדוֹלָה
  choice: le principal haut lieu
  rationale: במה est conservé comme terme cultuel « haut lieu ». Dans ce contexte, גדול exprime vraisemblablement la prééminence; une note préserve le sens plus littéral « grand ».
- source_word: אֶלֶף עֹלוֹת
  choice: mille holocaustes
  rationale: עֹלוֹת désigne des sacrifices entièrement brûlés. « Holocaustes » est le terme biblique français précis et concis.
- source_word: יַעֲלֶה
  choice: offrit
  rationale: Le hiphil de עלה avec עֹלוֹת signifie idiomatiquement « offrir » des holocaustes. Dans cette narration, le passé simple rend le yiqtol comme un événement passé, sans lui imposer une valeur habituelle.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: sur cet autel
  rationale: Rend directement la préposition et le démonstratif dans un français naturel.
theological_decisions:
- issue: Traduction de בָּמָה dans le contexte du culte antérieur au Temple
  choice: haut lieu
  alternative: sanctuaire
  rationale: « Haut lieu » conserve la terminologie cultuelle et la tension biblique associée à ces lieux de culte, que « sanctuaire » atténuerait.
- issue: Valeur de הַגְּדוֹלָה
  choice: principal
  alternative: grand
  rationale: Le contexte peut désigner le haut lieu prééminent plutôt que sa seule dimension physique. La note maintient explicitement l’autre lecture possible.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans archaïsmes syntaxiques. Le terme technique « haut lieu » est maintenu pour sa portée historique et théologique.
