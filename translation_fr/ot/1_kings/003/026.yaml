  text: וַ/תֹּ֣אמֶר הָ/אִשָּׁה֩ אֲשֶׁר בְּנָ֨/הּ הַ/חַ֜י אֶל הַ/מֶּ֗לֶךְ כִּֽי נִכְמְר֣וּ רַחֲמֶי/הָ֮ עַל בְּנָ/הּ֒ וַ/תֹּ֣אמֶר בִּ֣י אֲדֹנִ֗/י תְּנוּ לָ/הּ֙ אֶת הַ/יָּל֣וּד הַ/חַ֔י וְ/הָמֵ֖ת אַל תְּמִיתֻ֑/הוּ וְ/זֹ֣את אֹמֶ֗רֶת גַּם לִ֥/י גַם לָ֛/ךְ לֹ֥א יִהְיֶ֖ה גְּזֹֽרוּ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: fr
  text: 'Alors la femme dont le fils était vivant dit au roi, car elle fut saisie de compassion pour son fils : « Je vous en prie, mon seigneur, donnez-lui l’enfant vivant ; ne le tuez surtout pas ! » Mais l’autre dit : « Il ne sera ni à moi ni à toi. Coupez-le en deux ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: elle était bouleversée de compassion
  rationale: L’expression hébraïque associe l’idée d’une émotion qui s’échauffe ou s’agite à celle d’une profonde tendresse. Cette formulation française naturelle conserve l’intensité de la compassion maternelle sans traduire littéralement les entrailles.
- source_word: בִּי אֲדֹנִי
  choice: Je vous en prie, mon seigneur
  rationale: בִּי introduit ici une supplication urgente et respectueuse. Le vouvoiement convient à l’adresse faite au roi.
- source_word: הַיָּלוּד הַחַי
  choice: l’enfant vivant
  rationale: יַלוּד désigne l’enfant qui est né. « Enfant » reste naturel et n’impose pas un âge plus précis que l’hébreu.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: surtout, ne le faites pas mourir
  rationale: L’infinitif absolu joint au verbe conjugué renforce vivement l’interdiction. « Surtout » restitue cette insistance dans un français idiomatique.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Mais l’autre dit
  rationale: Le démonstratif désigne contrastivement la seconde femme ; « l’autre » explicite naturellement ce contraste.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: Il ne sera ni à moi ni à toi
  rationale: Le sujet implicite est l’enfant. Le pronom masculin « il » conserve cette référence personnelle et la rivalité possessive.
- source_word: גְּזֹרוּ
  choice: Coupez-le en deux
  rationale: L’impératif est bref et brutal. Le contexte du verset précédent permet d’expliciter le complément et le résultat de la coupe.
theological_decisions: []
