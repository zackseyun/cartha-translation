  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: fr
  text: 'Quand tout Israël vit que le roi ne les avait pas écoutés, le peuple répondit au roi : « Quelle part avons-nous avec David ? Nous n’avons aucun héritage avec le fils de Jessé ! À tes tentes, Israël[a] ! Maintenant, occupe-toi de ta propre maison, David[b] ! » Alors Israël se rendit à ses tentes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Rentre chez toi, Israël ! » L’hébreu dit littéralement « À tes tentes » : c’est une formule de dispersion qui exprime ici le retrait de l’allégeance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « maison » peut aussi désigner la dynastie : « occupe-toi de ta propre dynastie, David ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל יִשְׂרָאֵל
  choice: Quand tout Israël vit
  rationale: « Vit » conserve l’image hébraïque tout en exprimant naturellement la constatation collective et politique d’Israël.
- source_word: לֹא שָׁמַע ... אֲלֵיהֶם
  choice: ne l’avait pas écouté
  rationale: שׁמע avec אֶל signifie ici prêter attention ou donner suite, et non simplement entendre. Le pronom singulier reprend le collectif « tout Israël » en français.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: le peuple répondit au roi
  rationale: Cette formulation française rend directement l’idiome hébreu « retourner une parole ».
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: Quelle part avons-nous en David ?
  rationale: « Part » maintient le vocabulaire de participation et de répartition, avec sa portée politique, sans le réduire à une simple rupture relationnelle.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: Nous n’avons aucun héritage dans le fils de Jessé !
  rationale: « Héritage » préserve les résonances territoriales et tribales de נַחֲלָה; « le fils de Jessé » garde la manière volontairement non royale de désigner David.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: À tes tentes, Israël !
  rationale: La traduction littérale conserve le slogan traditionnel de dispersion et de retrait d’allégeance; son sens idiomatique est indiqué en note.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: Maintenant, occupe-toi de ta propre maison, David !
  rationale: Dans ce contexte, ראה exprime l’idée de veiller à ou de prendre en charge. « Maison » préserve l’ambivalence entre maisonnée et dynastie.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: Alors Israël regagna ses tentes
  rationale: Le singulier « ses » s’accorde naturellement avec le nom collectif singulier « Israël », tandis que « regagna » exprime le mouvement de dispersion vers les lieux d’habitation.
theological_decisions:
- issue: Slogan politique dirigé contre la maison de David
  choice: Rendre directement la rupture d’allégeance envers David et sa maison sans lui attribuer explicitement un jugement théologique ultérieur.
  alternative: Transformer le propos en rejet explicite de l’alliance davidique, ou le réduire à une querelle domestique.
  rationale: Le texte rapporte une révolte historique contre Roboam et la monarchie davidique. La formulation conserve sa force politique ainsi que la portée potentiellement dynastique de « maison », sans résoudre davantage la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve la vigueur scandée du slogan politique, le collectif « tout Israël » et l’ambivalence de « maison ». Les marqueurs [a] et [b] figurent dans le texte principal.
