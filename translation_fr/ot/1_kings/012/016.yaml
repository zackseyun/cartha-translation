revisions:
- from: 'Quand tout Israël vit que le roi ne l’avait pas écouté, le peuple répondit au roi : « Quelle part avons-nous en David ? Nous n’avons aucun héritage dans le fils de Jessé ! À tes tentes, Israël[a] ! Maintenant, occupe-toi de ta propre maison, David[b] ! » Alors Israël regagna ses tentes.'
  to: 'Quand tout Israël vit que le roi ne les avait pas écoutés, le peuple répondit au roi : « Quelle part avons-nous avec David ? Nous n’avons aucun héritage avec le fils de Jessé ! À tes tentes, Israël[a] ! Maintenant, occupe-toi de ta propre maison, David[b] ! » Alors Israël se rendit à ses tentes.'
  rationale: La révision corrige le pluriel exigé par le texte hébreu et améliore deux calques prépositionnels afin d’obtenir un français international naturel. Elle maintient la force politique du slogan, la désignation dépréciative « le fils de Jessé », le sens littéral de « tentes » et l’ambiguïté de « maison ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:40:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction restitue bien la structure du verset, le refus du roi d''écouter, le slogan de rupture et la polysémie de « maison ». Toutefois, « ne l’avait pas écouté » singularise indûment le complément : l’hébreu dit que le roi ne les avait pas écoutés, c’est-à-dire les Israélites/le peuple. « Dans David » et « dans le fils de Jessé » sont aussi peu naturels en français pour cette formule d’allégeance et d’héritage.'
  naturalness: Le registre est globalement digne et accessible. « Avec David » et « avec le fils de Jessé » rendent plus idiomatiquement la formule rhétorique française tout en gardant son sens politique. « Se rendit à ses tentes » reste proche du mouvement exprimé sans renforcer inutilement l’idée de retour contenue dans « regagna ».
  terminology: « Tout Israël », « le fils de Jessé », « tentes » et « maison » sont appropriés. La note sur « maison » préserve à juste titre la possible référence dynastique sans l’imposer dans le texte.
  issues:
  - severity: medium
    issue: Le pronom complément est au singulier dans « le roi ne l’avait pas écouté ».
    rationale: אֲלֵיהֶם est pluriel (« eux »). Même si « Israël » peut être un collectif, le français peut et devrait expliciter ici « ne les avait pas écoutés », en référence à ceux qui avaient parlé au roi.
  - severity: low
    issue: « Quelle part avons-nous en David ? » et « aucun héritage dans le fils de Jessé » sont des calques peu idiomatiques.
    rationale: La préposition hébraïque peut exprimer la relation ou l'appartenance politique. En français, « avec David » / « avec le fils de Jessé » rend naturellement la formule sans perdre son parallélisme de part et d'héritage.
  - severity: low
    issue: « Regagna ses tentes » introduit légèrement l’idée de retour.
    rationale: וַיֵּלֶךְ signifie simplement qu’Israël alla/s’en alla vers ses tentes. « Se rendit à ses tentes » est plus neutre.
