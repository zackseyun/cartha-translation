base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: fr
  text: 'Ainsi parle Yahweh : « Ne montez pas et ne combattez pas vos frères, les fils d’Israël[a]. Que chacun retourne chez lui, car cette affaire vient de moi. » Ils écoutèrent donc la parole de Yahweh et s’en retournèrent, conformément à la parole de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « vos frères, les Israélites ». Littéralement, l’hébreu dit « avec vos frères, les fils d’Israël » ; avec le verbe « combattre », la préposition signifie ici qu’il s’agit de combattre contre eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ainsi parle Yahweh
  rationale: Formule prophétique consacrée et naturelle en français, tout en conservant directement le nom divin.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: Ne montez pas et ne combattez pas
  rationale: Conserve les deux interdictions distinctes et le sens militaire contextuel de « monter ».
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: vos frères, les fils d’Israël
  rationale: Avec le verbe « combattre », עִם désigne ceux contre qui l’on combat. « Frères » maintient l’accent familial essentiel, et « fils d’Israël » reproduit l’apposition hébraïque.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Que chacun retourne chez lui
  rationale: Rend naturellement en français l’impératif et la valeur distributive de אִישׁ, sans alourdir la phrase par un masculin inutile.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: car cette affaire vient de moi
  rationale: « Affaire » convient à la portée de דָּבָר dans ce contexte, tandis que « vient de moi » exprime l’origine divine sans préciser davantage le mode de causalité.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: Ils écoutèrent donc la parole de Yahweh
  rationale: « Écoutèrent » préserve à la fois l’acte d’entendre et l’idée d’obéissance, confirmée par la suite du récit.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: et s’en retournèrent, conformément à la parole de Yahweh
  rationale: Formulation française fluide qui conserve le mouvement de retour et sa conformité au commandement divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée familiale de אֲחֵיכֶם
  choice: vos frères
  alternative: vos compatriotes israélites
  rationale: '« Vos frères » maintient la force de l’interdiction : il s’agirait de combattre des membres du même peuple d’alliance.'
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la solennité de l’oracle prophétique, le vocabulaire de parenté et la retenue du texte quant à la causalité divine.
