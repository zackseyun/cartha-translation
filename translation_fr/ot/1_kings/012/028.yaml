base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: fr
  text: 'Après avoir pris conseil, le roi fit deux veaux d’or et leur dit : « C’est trop pour vous de monter à Jérusalem[a]. Voici tes dieux, Israël[b], qui t’ont fait monter du pays d’Égypte ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous êtes montés assez longtemps à Jérusalem. »'
    reason: La construction hébraïque peut décrire la montée comme trop pénible ou déclarer qu’elle a duré assez longtemps.
  - marker: b
    text: 'Ou : « Voici ton Dieu, Israël. » La forme hébraïque peut parfois désigner Dieu au singulier ; ici, les deux veaux et le verbe au pluriel favorisent « tes dieux ».'
    reason: La grammaire permet une lecture singulière du nom, mais le contexte et l’accord verbal soutiennent le pluriel.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: Après avoir pris conseil
  rationale: Le nifal de יעץ exprime ici la consultation ou la délibération. Cette tournure naturelle conserve le lien séquentiel avec la fabrication des veaux.
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: deux veaux d’or
  rationale: Cette formulation suit de près le groupe construit hébreu et maintient l’écho à l’épisode d’Exode 32.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: C’est trop pour vous de monter à Jérusalem
  rationale: La phrase peut présenter la montée à Jérusalem comme une charge excessive ou signifier que le peuple y est monté assez longtemps. Le premier sens convient directement à l’argument du roi, tandis que l’autre est signalé en note.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » rend naturellement en français la force déictique et présentative de הִנֵּה.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: tes dieux, Israël
  rationale: Le contexte immédiat des deux veaux et le verbe pluriel הֶעֱלוּ favorisent le pluriel, tout en laissant possible une lecture singulière signalée en note.
- source_word: הֶעֱלוּךָ
  choice: qui t’ont fait monter
  rationale: La formulation conserve le causatif et le mouvement ascendant du verbe עלה ainsi que son accord pluriel explicite.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette expression suit étroitement la formule hébraïque de l’exode et reste idiomatique en français.
theological_decisions:
- issue: Faut-il rendre אֱלֹהֶיךָ au singulier ou au pluriel dans la proclamation du roi ?
  choice: 'Pluriel : « tes dieux, Israël »'
  alternative: 'Singulier : « ton Dieu, Israël »'
  rationale: אֱלֹהִים peut désigner le Dieu d’Israël au singulier, mais la mention de deux veaux et surtout le verbe pluriel הֶעֱלוּ favorisent ici « tes dieux ». Une note préserve néanmoins l’ambiguïté lexicale et l’écho à Exode 32.4.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde le tutoiement collectif singulier adressé à Israël, conformément aux formes hébraïques, et conserve la tension entre l’allusion à l’exode et la pluralité idolâtre.
