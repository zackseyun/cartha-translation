base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: fr
  text: 'Il leur dit : « Quel conseil donnez-vous pour que nous répondions[a] à ce peuple qui m’a parlé en ces termes : “Allège le joug[b] que ton père nous a imposé” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour que nous donnions une réponse ». L’hébreu emploie l’expression « retourner une parole », au sens de répondre.'
    reason: lexical_alternative
  - marker: b
    text: Le « joug » représente ici les lourds travaux et les obligations que le roi imposait au peuple.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Que me conseillez-vous
  rationale: La tournure participiale sollicite l’avis présent des conseillers. L’ajout de « me », implicite dans la situation et naturel en français, clarifie le destinataire du conseil sans modifier le sens.
- source_word: וְנָשִׁיב דָּבָר
  choice: afin que nous répondions
  rationale: L’expression signifie idiomatiquement « rendre/donner une réponse ». « Afin que nous répondions » restitue la nuance de but et reste fluide en français.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier collectif et le démonstratif sont conservés, ainsi que la possible nuance de distance dans les paroles du roi.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: qui m’a parlé en ces termes
  rationale: Cette formulation française naturelle introduit fidèlement le contenu des paroles rapportées sans reproduire lourdement l’hébraïsme « a parlé… en disant ».
- source_word: הָקֵל
  choice: Allège
  rationale: L’impératif demande de rendre moins pesante la charge évoquée par le joug; « Allège » conserve à la fois l’ordre et l’image.
- source_word: מִן הָעֹל
  choice: le joug
  rationale: Le sens concret de עֹל est maintenu afin de préserver la métaphore du travail et des obligations imposés.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: que ton père nous a imposé
  rationale: « Imposer » exprime naturellement en français l’idée de placer un joug sur quelqu’un tout en gardant sa dimension coercitive.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe directe convient à une scène de conseil royal; « ce peuple » conserve la légère distance perceptible dans l’hébreu, tandis que « en ces termes » évite un calque maladroit.
