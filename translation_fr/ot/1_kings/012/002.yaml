base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: fr
  text: Lorsque Jéroboam, fils de Nebath, l’apprit[a], alors qu’il était encore en Égypte, où il s’était enfui devant le roi Salomon, Jéroboam résidait en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « entendit », sans en préciser l’objet; celui-ci est sous-entendu d’après le contexte, probablement la nouvelle rapportée dans le récit environnant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque … l’apprit
  rationale: La construction avec כ et l’infinitif de שׁמע introduit une proposition temporelle. Le français exige ici un complément plus naturellement que l’hébreu; le pronom « l’ » renvoie sans le préciser à la nouvelle donnée par le contexte.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Les formes françaises traditionnelles et largement reconnues des noms propres sont conservées, ainsi que la filiation.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: il était encore en Égypte
  rationale: La proposition circonstancielle indique que Jéroboam se trouvait toujours en Égypte au moment où il apprit la nouvelle.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: où il s’était enfui pour échapper au roi Salomon
  rationale: Le relatif renvoie naturellement à l’Égypte. L’expression מִפְּנֵי marque ici la fuite hors de la présence ou du pouvoir du roi; « pour échapper à » l’exprime clairement en français.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: Jéroboam demeura en Égypte
  rationale: ישׁב peut signifier habiter ou demeurer. « Demeura » rend ici la continuation de son séjour tout en conservant la répétition présente dans le texte hébreu.
