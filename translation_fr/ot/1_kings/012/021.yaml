source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: fr
  text: 'Lorsque Roboam arriva à Jérusalem[a], il rassembla toute la maison de Juda et la tribu de Benjamin : 180 000 hommes d’élite aptes au combat, afin de combattre la maison d’Israël et de rendre le royaume à Roboam, fils de Salomon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte consonantique porte « ils arrivèrent », mais la lecture traditionnelle et le contexte indiquent « il arriva ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּבֹא / ויבאו
  choice: arriva
  rationale: Le contexte exige un sujet singulier, Roboam, comme le confirme le verbe singulier qui suit. « Arriva à Jérusalem » rend naturellement le mouvement vers la ville.
- source_word: וַיַּקְהֵל
  choice: rassembla
  rationale: Le hiphil de קהל exprime l’action de réunir ou de convoquer un groupe ; « rassembla » est clair et naturel en français moderne.
- source_word: כָּל בֵּית יְהוּדָה
  choice: toute la maison de Juda
  rationale: Cette formulation conserve l’expression politique et collective « maison de Juda » ainsi que son parallèle avec « maison d’Israël ».
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: la tribu de Benjamin
  rationale: Le terme שֵׁבֶט est explicite et désigne ici la tribu comme entité politique et militaire.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: 180 000
  rationale: La notation chiffrée est immédiatement lisible et conforme à l’usage français contemporain.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: hommes d’élite aptes au combat
  rationale: בָּחוּר désigne ici des hommes choisis ou de premier rang, tandis que עֹשֵׂה מִלְחָמָה précise leur capacité militaire. La traduction restitue les deux éléments sans suggérer seulement leur jeunesse.
- source_word: לְהִלָּחֵם עִם
  choice: afin de combattre
  rationale: Dans ce contexte hostile, « combattre » exprime clairement l’objectif militaire ; son complément désigne l’adversaire.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: La traduction préserve l’expression collective et son contraste délibéré avec « la maison de Juda » après la division du royaume.
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: rendre le royaume
  rationale: Le hiphil de שׁוב signifie faire revenir ou restituer. « Rendre le royaume à Roboam » exprime naturellement le projet de replacer le royaume sous son autorité.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: à Roboam, fils de Salomon
  rationale: La préposition ל marque le destinataire ou bénéficiaire de la restitution ; l’apposition française identifie clairement Roboam.
theological_decisions:
- issue: Portée politique de הַמְּלוּכָה
  choice: le royaume
  alternative: la royauté
  rationale: Le contexte vise le territoire et le pouvoir royal passés sous une autre autorité. « Royaume » conserve cette portée politique concrète, tout en laissant entendre l’exercice de la royauté.
translation_notes:
  register: Français international moderne, digne et narratif. Les expressions parallèles « maison de Juda » et « maison d’Israël » sont conservées pour respecter la structure politique du texte. La formulation militaire demeure précise sans archaïsme.
