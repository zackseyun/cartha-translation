reference: 1 Kings 12:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/דָּבָ֥ר הַ/זֶּ֖ה לְ/חַטָּ֑את וַ/יֵּלְכ֥וּ הָ/עָ֛ם לִ/פְנֵ֥י הָ/אֶחָ֖ד עַד דָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: fr
  text: Cette affaire devint un péché, et le peuple se rendit devant l’un[a], jusqu’à Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’un ». Il s’agit probablement de l’un des deux veaux érigés par Jéroboam, en particulier de celui qui se trouvait à Dan.'
    reason: Préciser le référent probable d’une expression hébraïque elliptique sans supprimer son ambiguïté dans le texte principal.
lexical_decisions:
- source_word: וַיְהִי
  choice: devint
  rationale: 'Avec לְחַטָּאת, le verbe exprime ici un résultat : l’affaire en vint à constituer un péché.'
- source_word: הַדָּבָר הַזֶּה
  choice: cette affaire
  rationale: דָּבָר peut désigner une chose, une affaire ou une situation. « Cette affaire » renvoie naturellement à l’organisation cultuelle mise en place par Jéroboam sans en préciser davantage la nature.
- source_word: לְחַטָּאת
  choice: un péché
  rationale: Dans ce contexte de culte condamné par le récit, חַטָּאת désigne le péché, et non un sacrifice pour le péché. Le substantif est conservé.
- source_word: וַיֵּלְכוּ הָעָם
  choice: le peuple se rendit
  rationale: Le verbe הָלַךְ indique un déplacement. « Se rendit » est idiomatique en français avec la destination cultuelle qui suit, sans ajouter explicitement « pour adorer ».
- source_word: לִפְנֵי
  choice: devant
  rationale: Le sens spatial « devant, en présence de » est conservé sans expliciter dans le texte principal l’acte de culte implicite.
- source_word: הָאֶחָד
  choice: l’un
  rationale: L’hébreu emploie littéralement « l’un » en omettant le nom. La formulation française maintient cette ellipse et laisse la note préciser son référent probable.
- source_word: עַד דָּן
  choice: jusqu’à Dan
  rationale: עַד marque ici la limite géographique du déplacement, Dan étant le sanctuaire situé au nord.
theological_decisions:
- issue: Nature du péché lié au culte de Jéroboam
  choice: L’organisation cultuelle devint un péché.
  alternative: Elle devint une occasion de péché.
  rationale: Le contexte exclut ici le sens de « sacrifice pour le péché », mais le verset ne développe pas davantage la nature doctrinale de la faute. La traduction conserve donc l’affirmation concise du texte.
- issue: Référent de « l’un »
  choice: Maintenir « l’un » dans le texte et expliquer en note qu’il s’agit probablement de l’un des deux veaux, surtout celui de Dan.
  alternative: Rendre explicitement « l’un des veaux » dans le texte principal.
  rationale: L’hébreu est elliptique et quelque peu abrupt. Maintenir l’ellipse préserve cette particularité et évite de transformer une identification contextuellement probable en précision formellement exprimée.
translation_notes:
  register: Français international moderne, sobre et digne. « Cette affaire » évite la lourdeur de « cette chose », tandis que « se rendit devant » exprime naturellement le déplacement sans ajouter explicitement une intention d’adoration absente de la formulation hébraïque.
