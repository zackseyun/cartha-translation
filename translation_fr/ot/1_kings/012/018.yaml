base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: fr
  text: Alors le roi Roboam envoya Adoram[a], qui était responsable des travaux forcés, et tout Israël le lapida, et il mourut. Le roi Roboam s’empressa de monter sur son char pour s’enfuir à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Adoram »; certains passages apparentés emploient la forme « Adoniram ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Rend naturellement le wayyiqtol narratif de שלח et l’envoi d’Adoram en mission.
- source_word: אֲדֹרָם
  choice: Adoram[a]
  rationale: Conserve exactement la forme du nom dans le texte massorétique de ce verset; la forme apparentée « Adoniram » est signalée en note.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: qui était responsable des travaux forcés
  rationale: Exprime clairement la fonction officielle d’Adoram à la tête de la corvée imposée par l’État.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: le lapida
  rationale: « Lapider » rend en français naturel et précis l’expression hébraïque qui mentionne explicitement la pierre, sans la redondance peu idiomatique « lapider avec des pierres ».
- source_word: כָל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Préserve la désignation collective et politique employée dans le récit.
- source_word: וַיָּמֹת
  choice: et il mourut
  rationale: Maintient la simple succession narrative et énonce explicitement l’issue de la lapidation.
- source_word: הִתְאַמֵּץ
  choice: s’empressa
  rationale: Dans ce contexte de fuite urgente, le hitpael de אמץ décrit l’effort résolu et rapide de Roboam; « s’empressa » en transmet naturellement la valeur contextuelle.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: de monter sur son char
  rationale: Traduction française idiomatique de עלה avec מֶרְכָּבָה, qui conserve l’idée de monter dans ou sur le véhicule.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: pour s’enfuir à Jérusalem
  rationale: « S’enfuir » restitue l’urgence de נוּס plutôt qu’un simple départ.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Travaux forcés » explicite la corvée étatique; « le lapida » évite une répétition non idiomatique; « s’empressa » communique l’effort urgent de הִתְאַמֵּץ dans le contexte.
