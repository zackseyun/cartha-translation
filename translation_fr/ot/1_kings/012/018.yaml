    rationale: Le texte hébreu emploie une simple coordination narrative (וַ־). Même si le contexte rend l’enchaînement tragique évident, « mais » interprète la relation entre l’envoi d’Adoram et sa lapidation. « et » préserve mieux la neutralité du source.
