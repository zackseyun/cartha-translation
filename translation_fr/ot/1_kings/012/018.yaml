  source_fidelity: 'La traduction rend exactement les éléments essentiels du texte massorétique : Adoram, sa charge sur la corvée, la lapidation par « tout Israël », sa mort, puis la fuite urgente de Roboam vers Jérusalem. Toutefois, « Mais » introduit une opposition qui n’est pas explicitement portée par le waw narratif hébreu ; la coordination doit rester neutre.'
