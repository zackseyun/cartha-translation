  text: And the king answered the people harshly, and he abandoned the counsel of the elders who had advised him.
translation:
  language: fr
  text: Le roi répondit durement au peuple et écarta le conseil des anciens qui l’avaient conseillé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le qal de ענה signifie ici « répondre »; ce choix conserve le lien narratif avec la demande formulée auparavant par le peuple.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne le souverain déjà connu dans le contexte.
- source_word: הָעָם
  choice: au peuple
  rationale: עָם désigne ici le peuple assemblé qui s'adresse au roi; le complément indirect est la tournure naturelle en français avec « répondre ».
- source_word: קָשָׁה
  choice: durement
  rationale: Employé adverbialement, le terme caractérise la manière sévère dont le roi répond.
- source_word: וַיַּעֲזֹב
  choice: rejeta
  rationale: עזב exprime l'abandon ou la mise à l'écart. Dans ce contexte de délibération, « rejeta » rend naturellement la décision de ne pas suivre le conseil.
- source_word: עֲצַת
  choice: le conseil
  rationale: עֵצָה désigne un avis donné dans le cadre d'une délibération; « conseil » convient au contexte royal tout en restant courant.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Le terme désigne des hommes reconnus comme conseillers expérimentés, et pas seulement des hommes âgés.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: que les anciens lui avaient donné
  rationale: La relative précise l'origine du conseil. Le plus-que-parfait indique naturellement que ce conseil avait été donné avant d'être rejeté.
