  text: וַ/יְהִי֙ דְּבַ֣ר הָֽ/אֱלֹהִ֔ים אֶל שְׁמַעְיָ֥ה אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: fr
  text: 'La parole de Dieu fut adressée à Shemaïa, l’homme de Dieu[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit ici « Dieu » (אֱלֹהִים), et non le nom divin YHWH, souvent rendu par « le SEIGNEUR » dans des formules semblables.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans la formule וַיְהִי דְּבַר… אֶל, cette tournure française rend naturellement la venue d’une communication divine sans calquer lourdement l’hébreu.
- source_word: דְּבַר
  choice: parole
  rationale: Dans cette formule de révélation, דָּבָר désigne une communication divine. « Parole » conserve l’expression biblique et sa portée théologique.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Le texte porte אֱלֹהִים et désigne ici le vrai Dieu; il ne porte pas le nom divin YHWH.
- source_word: שְׁמַעְיָה
  choice: Shemaïa
  rationale: Transcription française courante du nom hébreu, avec tréma pour en guider la prononciation.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Cette expression est un titre reconnu désignant une figure prophétique et se trouve ici en apposition à Shemaïa.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Puisque le discours divin suit au verset suivant, les deux-points introduisent celui-ci en français plus naturellement qu’un calque tel que « en disant ».
theological_decisions:
- issue: Traduction d אֱלֹהִים dans la formule de révélation
  choice: Dieu
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement אֱלֹהִים, et non YHWH. La traduction respecte donc le terme présent sans l’harmoniser avec la formule prophétique plus habituelle.
translation_notes:
  register: Français international moderne, digne et naturel. « Fut adressée » maintient la formule prophétique sans archaïsme excessif; les deux-points assurent une transition fluide vers le discours du verset suivant.
