  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: fr
  text: 'Jéroboam organisa une fête au huitième mois[a], le quinzième jour du mois, semblable à la fête célébrée en Juda, et il monta à l’autel[b]. Il fit de même à Béthel : il offrit des sacrifices aux veaux qu’il avait faits et installa à Béthel les prêtres des hauts lieux qu’il avait établis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fête célébrée en Juda désigne probablement la fête des Huttes, aussi appelée fête des Tentes, qui avait lieu le quinzième jour du septième mois. Jéroboam fixa sa fête rivale un mois plus tard.
    reason: cross_reference
  - marker: b
    text: 'Ou : « il monta sur l’autel ». L’expression hébraïque peut se traduire ainsi plus littéralement, mais elle désigne ici probablement le fait de monter à l’autel pour y officier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: organisa une fête
  rationale: Avec חָג, עשה signifie ici tenir ou organiser une fête. Cette formulation française est naturelle sans préciser, au-delà du texte, s’il s’agit de la création durable d’une nouvelle institution.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: au huitième mois
  rationale: Rendu direct de l’indication calendaire hébraïque.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: le quinzième jour du mois
  rationale: Formulation française courante pour cette date hébraïque.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: semblable à la fête célébrée en Juda
  rationale: Le comparatif est explicite. « Célébrée » rend naturellement la relative sans identifier dans le corps du texte une fête que l’hébreu ne nomme pas.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: il monta à l’autel
  rationale: La locution peut désigner le fait de s’avancer ou de monter vers l’autel afin d’y officier. « À l’autel » évite de faire croire sans nécessité qu’il monta sur sa surface, tout en conservant le mouvement ascendant.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: Il fit de même à Béthel
  rationale: כֵּן exprime la correspondance avec l’action précédente. Cette tournure est claire et idiomatique en français.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: il offrit des sacrifices aux veaux
  rationale: L’infinitif indique ici l’action cultuelle accomplie à Béthel, et le complément hébreu présente les veaux comme destinataires des sacrifices.
- source_word: הָעֲגָלִים
  choice: les veaux
  rationale: Le nom signifie littéralement « veaux ». Le contexte indique leur caractère idolâtre sans qu’il soit nécessaire d’ajouter « idoles » au texte.
- source_word: וְהֶעֱמִיד
  choice: installa
  rationale: Dans ce contexte cultuel, le verbe exprime la mise en place des prêtres dans leur fonction ou leur poste. « Installa » conserve cette nuance sans ajouter une procédure de nomination non formulée.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: les prêtres des hauts lieux
  rationale: « Hauts lieux » est le terme français traditionnel et précis pour ces sanctuaires locaux.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait aménagés
  rationale: Pour des lieux cultuels, « aménagés » rend naturellement עשה et rattache bien la relative aux hauts lieux, tout en évitant l’expression peu idiomatique « faits ».
theological_decisions:
- issue: Identification de « la fête célébrée en Juda »
  choice: Conserver une désignation générique dans le texte principal.
  alternative: L’identifier explicitement à la fête des Huttes ou des Tentes.
  rationale: La date et le contexte rendent cette identification très probable, mais le verset hébreu ne donne pas le nom de la fête. La note fournit donc l’information contextuelle sans la faire entrer dans le texte.
- issue: Évaluation cultuelle des actes de Jéroboam
  choice: Décrire ses actes sans ajouter de qualificatifs condamnatoires.
  alternative: Parler d’« idoles » ou de prêtres « illégitimes » dans le texte principal.
  rationale: Le récit environnant condamne ce culte, mais le présent verset décrit les actes sans ces qualificatifs. La traduction laisse le contexte porter l’évaluation.
- issue: Sens spatial de עַל dans la montée à l’autel
  choice: « monta à l’autel » dans le texte principal.
  alternative: « monta sur l’autel » selon une lecture plus strictement spatiale.
  rationale: L’expression peut évoquer l’approche ascendante de l’autel pour officier. Le français principal retient le sens contextuel le plus naturel, tandis que la note préserve la possibilité d’un rendu plus littéral.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la progression hébraïque, avec une ponctuation qui clarifie les actes accomplis à Béthel. Les termes cultuels établis (« autel », « sacrifices », « hauts lieux ») sont conservés.
