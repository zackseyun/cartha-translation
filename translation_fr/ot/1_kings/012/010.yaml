base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: fr
  text: 'Les jeunes gens qui avaient grandi avec lui lui dirent : « Voici ce que tu diras à ce peuple qui t’a dit : “Ton père a rendu notre joug pesant ; toi, allège-le pour nous.” Voici ce que tu leur diras : “Mon petit doigt est plus épais que les reins de mon père.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: les jeunes gens
  rationale: Dans ce contexte, le terme désigne les compagnons de génération de Roboam, et non de petits enfants ; « jeunes gens » reste naturel tout en conservant le contraste avec les anciens.
- source_word: עֻלֵּנוּ
  choice: notre joug
  rationale: Le sens concret de « joug » porte ici une image politique claire de la charge imposée au peuple et mérite d’être conservé.
- source_word: קָטָנִּי
  choice: mon petit doigt
  rationale: Le mot signifie littéralement « mon petit » ; dans cette comparaison corporelle, l’ellipse hébraïque renvoie traditionnellement et naturellement au petit doigt.
- source_word: מָתְנֵי אָבִי
  choice: les reins de mon père
  rationale: מָתְנַיִם désigne les reins, les hanches ou la région lombaire. « Les reins » préserve l’image corporelle et le registre proverbial sans réduire le sens à un simple tour de taille.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « Voici ce que tu diras » est légèrement modulée en « Voici donc ce que tu leur répondras » à la seconde occurrence pour une lecture naturelle, sans changer la force de la consigne. Le tutoiement correspond à l’adresse directe au roi dans le récit.
