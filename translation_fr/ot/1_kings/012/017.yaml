  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּשְׁבִ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עֲלֵי/הֶ֖ם רְחַבְעָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/017.yaml
  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: fr
  text: Mais Roboam régna sur les Israélites qui habitaient dans les villes de Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression signifie littéralement « les fils d’Israël », mais elle désigne ici le peuple d’Israël; « les Israélites » en rend naturellement le sens collectif en français moderne.
- source_word: הַיֹּשְׁבִים
  choice: qui habitaient
  rationale: Le participe de ישׁב exprime ici une résidence durable. L’imparfait français convient à cet état dans le cadre du récit.
- source_word: בְּעָרֵי יְהוּדָה
  choice: dans les villes de Juda
  rationale: Cette traduction directe conserve la valeur locative et la référence territoriale de l’expression hébraïque.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans ce contexte narratif, מלך désigne l’exercice de la royauté; « régna » est précis, concis et conforme au registre historique.
- source_word: עֲלֵיהֶם
  choice: sur
  rationale: La préposition marque l’autorité royale exercée sur le groupe précédemment nommé. En français, « régner sur » exprime naturellement cette relation sans répéter un pronom.
- source_word: רְחַבְעָם
  choice: Roboam
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: וּ
  choice: Mais
  rationale: Dans le contexte, la conjonction introduit le contraste entre la révolte des tribus du Nord et le maintien de l’autorité de Roboam sur les Israélites établis dans les villes de Juda.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation reste proche de la structure hébraïque tout en employant les expressions idiomatiques « les Israélites », « habitaient » et « régna sur ».
