  variant: modern international French
source:
  edition: WLC
  text: ו/ידבר אֵלָ֜י/ו לֵ/אמֹ֗ר אִם הַ֠/יּוֹם תִּֽהְיֶה עֶ֜בֶד לָ/עָ֤ם הַ/זֶּה֙ וַֽ/עֲבַדְתָּ֔/ם וַ/עֲנִיתָ֕/ם וְ/דִבַּרְתָּ֥ אֲלֵי/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: fr
  text: 'Il lui parla en ces termes : « Si, aujourd’hui, tu te fais le serviteur de ce peuple, si tu les sers, leur réponds et leur adresses des paroles bienveillantes[a], alors ils seront tes serviteurs pour toujours[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de bonnes paroles ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous les jours ».'
    reason: idiom
lexical_decisions:
- source_word: עֶבֶד
  choice: serviteur
  rationale: Le terme peut désigner un esclave ou un serviteur. Ici, son emploi politique et métaphorique invite le roi à se mettre au service du peuple; « serviteur » convient au contexte et préserve le contraste avec la fin du verset.
- source_word: וַעֲבַדְתָּם
  choice: tu les sers
  rationale: Cette formulation conserve en français le lien lexical avec « serviteur » et le mouvement réciproque du conseil.
- source_word: וַעֲנִיתָם
  choice: leur réponds
  rationale: Dans le contexte de la requête du peuple, ענה signifie répondre, et non affliger.
- source_word: דְּבָרִים טוֹבִים
  choice: des paroles bienveillantes
  rationale: La traduction exprime naturellement l’idée de propos bons ou favorables sans en limiter indûment la portée; une note signale la formulation plus littérale.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: ils seront tes serviteurs
  rationale: 'Le substantif est maintenu afin de préserver la réciprocité frappante: le roi sert le peuple aujourd’hui, et celui-ci sera ensuite à son service.'
- source_word: כָּל הַיָּמִים
  choice: pour toujours
  rationale: C’est l’équivalent idiomatique naturel de l’expression hébraïque « tous les jours » dans ce contexte de fidélité durable.
- source_word: אִם הַיּוֹם
  choice: Si, aujourd’hui
  rationale: 'La place détachée de « aujourd’hui » conserve l’accent temporel: la décision immédiate du roi aura des effets durables.'
- source_word: וַיְדַבֵּר אֵלָיו לֵאמֹר
  choice: Il lui parla en ces termes
  rationale: La traduction suit la forme verbale singulière telle qu’elle apparaît dans le texte source fourni et rend naturellement la formule introductive hébraïque.
theological_decisions:
- issue: La royauté présentée sous la métaphore du service
  choice: Conserver explicitement le vocabulaire de serviteur et de service
  alternative: Employer un vocabulaire politique explicatif, comme « gouverner dans leur intérêt » ou « se mettre à leur disposition »
  rationale: Le texte formule un conseil politique au moyen d’une réciprocité volontairement frappante. Garder le même champ lexical préserve cette tension sans lui imposer une doctrine ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle reste proche du mouvement de l’hébreu, tandis que « en ces termes », « paroles bienveillantes » et « pour toujours » évitent un calque peu naturel. Les marqueurs [a] et [b] figurent dans le texte aux endroits correspondants.
