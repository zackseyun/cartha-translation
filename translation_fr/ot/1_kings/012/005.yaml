    issue: 'Formulation temporelle peu naturelle et ambiguë : « Partez encore pour trois jours »'
    rationale: La construction française est peu idiomatique et « encore » peut sembler porter sur l’action de partir plutôt que sur les trois jours additionnels. Le texte hébreu exprime un délai/période de trois jours de plus.
  - severity: low
    issue: « me voir » explicite une notion absente du texte
    rationale: L’expression est naturelle, mais אֵלַי signifie plus précisément « auprès de moi / vers moi ». Une formulation directe préserve mieux la concision de la source.
