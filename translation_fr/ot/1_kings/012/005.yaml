  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לְכ֥וּ עֹ֛ד שְׁלֹשָׁ֥ה יָמִ֖ים וְ/שׁ֣וּבוּ אֵלָ֑/י וַ/יֵּלְכ֖וּ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/005.yaml
  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: fr
  text: 'Il leur dit : « Allez-vous-en pour trois jours de plus, puis revenez auprès de moi. » Le peuple partit donc.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Il leur dit
  rationale: Le wayyiqtol introduit la parole dans la continuité du récit; « leur » rend naturellement אֲלֵיהֶם.
- source_word: לְכוּ
  choice: Partez
  rationale: L’impératif pluriel de הלך demande ici à la délégation de quitter temporairement la présence du roi; « partez » exprime clairement ce mouvement sans la nuance potentiellement brusque de « allez-vous-en ».
- source_word: עוֹד שְׁלֹשָׁה יָמִים
  choice: encore pour trois jours
  rationale: עוֹד associé à une durée indique une période supplémentaire. Cette formulation conserve cette valeur temporelle et reste naturelle en français.
- source_word: וְשׁוּבוּ אֵלָי
  choice: puis revenez me voir
  rationale: שוב exprime le retour, tandis que אֵלָי en indique le terme, le locuteur. « Puis » explicite la succession des deux impératifs; « revenez me voir » est une expression française naturelle pour revenir auprès d’une personne.
- source_word: וַיֵּלְכוּ הָעָם
  choice: Le peuple partit donc
  rationale: Le collectif הָעָם est rendu au singulier en français. « Partit » reprend le mouvement demandé par לְכוּ, et « donc » marque naturellement l’exécution de l’ordre dans la trame narrative.
