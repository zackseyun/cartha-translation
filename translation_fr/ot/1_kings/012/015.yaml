source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: fr
  text: Ainsi, le roi n’écouta pas le peuple, car cette situation venait de Yahweh[a], afin que s’accomplisse la parole que Yahweh avait prononcée par l’intermédiaire d’Ahiya de Silo[b] à Jéroboam, fils de Nebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car la cause venait de Yahweh ». Le mot hébreu peut désigner une cause, une raison ou une tournure prise par les circonstances.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « par la main d’Ahiya le Silonite », expression hébraïque signifiant « par l’intermédiaire d’Ahiya de Silo ».
    reason: source_idiom
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: écouter
  rationale: Avec la préposition אֶל et dans le contexte de la requête du peuple, le verbe signifie prêter attention ou accéder à la demande, et non simplement entendre.
- source_word: הָעָם
  choice: le peuple
  rationale: Rendu courant et précis pour l’assemblée du peuple d’Israël dans ce contexte.
- source_word: סִבָּה
  choice: tournure des événements
  rationale: Le nom peut désigner une cause, une raison ou un retournement des circonstances. Ce choix convient au récit tout en conservant l’idée d’une situation dont l’origine est attribuée à Yahweh.
- source_word: מֵעִם יְהוָה
  choice: venait de Yahweh
  rationale: La préposition composée exprime ici la provenance ou l’origine. La formulation française reste directe sans préciser davantage le mécanisme de l’action divine.
- source_word: לְמַעַן הָקִים אֶת דְּבָרוֹ
  choice: afin d’accomplir sa parole
  rationale: לְמַעַן introduit le but, et הֵקִים appliqué à une parole peut exprimer sa réalisation ou sa confirmation. « Accomplir sa parole » est idiomatique en français et garde la portée prophétique.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: Littéralement « par la main de », cet idiome hébreu indique l’agent par lequel la parole a été transmise.
- source_word: הַשִּׁילֹנִי
  choice: de Silo
  rationale: Le gentilé hébreu signifie qu’Ahiya est originaire de Silo ou y est rattaché. « De Silo » est plus transparent en français moderne que « le Silonite ».
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Forme française traditionnelle et claire du nom personnel suivi du patronyme hébreu.
theological_decisions:
- issue: Causalité divine et décision humaine
  choice: La tournure des événements est dite venir de Yahweh et avoir pour but l’accomplissement de sa parole, tandis que le refus reste grammaticalement l’action du roi.
  alternative: Présenter l’événement comme seulement permis par Dieu, ou affirmer explicitement que Dieu a directement contraint le roi à refuser.
  rationale: L’hébreu attribue clairement à Yahweh l’origine de la circonstance et en énonce le but, sans expliquer le mécanisme reliant la providence divine à la décision du roi. La traduction conserve cette tension.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible tout en conservant la répétition de « Yahweh » et le lien explicite entre la providence divine et l’accomplissement de la parole prophétique.
