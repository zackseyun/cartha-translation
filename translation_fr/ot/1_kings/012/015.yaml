revisions:
- from: Ainsi, le roi n’écouta pas le peuple, car cette tournure des événements venait de Yahweh[a], afin d’accomplir sa parole, celle que Yahweh avait prononcée par l’intermédiaire d’Ahiya de Silo[b] à Jéroboam, fils de Nebath.
  to: Ainsi, le roi n’écouta pas le peuple, car cette situation venait de Yahweh[a], afin que s’accomplisse la parole que Yahweh avait prononcée par l’intermédiaire d’Ahiya de Silo[b] à Jéroboam, fils de Nebat.
  rationale: La révision clarifie que l’accomplissement concerne la parole prophétique de Yahweh, sans préciser le mécanisme de la causalité divine. Elle améliore aussi la fluidité française et normalise le patronyme « Nebat ».
