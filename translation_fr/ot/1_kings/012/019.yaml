  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: fr
  text: Ainsi, Israël est en révolte contre la maison de David jusqu’à ce jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un verbe narratif : « Ainsi, Israël se révolta contre la maison de David jusqu’à ce jour. » L’expression « jusqu’à ce jour » indique que cette rupture perdure à l’époque du narrateur.'
    reason: Précise la forme narrative hébraïque et la valeur durable de l’expression temporelle, sans imposer une analyse théologique.
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: s’est révolté
  rationale: Dans ce contexte politique, פשע désigne une révolte contre l’autorité dynastique. Le passé composé présente l’événement passé tout en s’accordant naturellement avec sa portée durable, explicitée par « jusqu’à ce jour ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé. Ici, il désigne collectivement les tribus du Nord, par opposition à la dynastie davidique.
- source_word: בְּבֵית דָּוִד
  choice: contre la maison de David
  rationale: Avec פשע, la préposition ב marque l’autorité contre laquelle on se révolte. « Maison de David » conserve le sens dynastique de l’expression hébraïque.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Cette expression hébraïque indique que la situation issue de l’événement raconté perdure jusqu’à l’époque du narrateur. La formulation française est courante et digne.
- source_word: וַ
  choice: C’est ainsi que
  rationale: Dans ce contexte conclusif, le waw narratif introduit le résultat durable des événements précédents. « C’est ainsi que » rend ce lien plus naturellement qu’un simple « et ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Maison de David » est maintenu comme expression dynastique biblique claire ; aucune précision interprétative sur l’étendue d’« Israël » n’est ajoutée au corps du texte.
