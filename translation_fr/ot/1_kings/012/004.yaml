base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: fr
  text: Ton père a rendu notre joug pénible[a]. Maintenant, allège le dur service[b] imposé par ton père et le lourd joug qu’il a fait peser sur nous, et nous te servirons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a rendu notre joug dur ». Le joug représente ici les obligations pesantes imposées au peuple.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « service » peut aussi désigner le travail ou les corvées exigées.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: a rendu notre joug pénible
  rationale: Le hifil de קשׁה exprime l’action de rendre dur ou pénible. « Joug » conserve l’image concrète des obligations oppressives, tandis que « pénible » donne un français naturel sans confondre ce premier adjectif avec כבד, « lourd », dans la suite.
- source_word: הָקֵל
  choice: allège
  rationale: L’impératif signifie rendre plus léger ou soulager. « Allège » préserve l’opposition directe avec le « lourd joug ».
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: le dur service imposé par ton père
  rationale: עֲבֹדָה peut désigner le service, le travail ou les corvées exigées par le pouvoir. Cette formulation garde l’étendue du terme tout en explicitant naturellement que le père est l’auteur de l’imposition.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: et le lourd joug
  rationale: « Lourd » rend כבד et maintient la métaphore du joug ainsi que son parallélisme avec le service pénible.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: qu’il a fait peser sur nous
  rationale: La locution נתן על signifie ici imposer ou placer sur quelqu’un. « Faire peser sur » est idiomatique et prolonge naturellement l’image du lourd joug.
- source_word: וְנַעַבְדֶךָּ
  choice: et nous te servirons
  rationale: Le verbe exprime la promesse qui suivra l’allègement demandé. Le futur simple conserve sobrement cette relation de conséquence sans la surinterpréter.
