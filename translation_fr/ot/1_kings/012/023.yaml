  text: אֱמֹ֗ר אֶל רְחַבְעָ֤ם בֶּן שְׁלֹמֹה֙ מֶ֣לֶךְ יְהוּדָ֔ה וְ/אֶל כָּל בֵּ֥ית יְהוּדָ֖ה וּ/בִנְיָמִ֑ין וְ/יֶ֥תֶר הָ/עָ֖ם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: fr
  text: '« Parle à Roboam, fils de Salomon et roi de Juda, ainsi qu’à toute la communauté de Juda et de Benjamin et au reste du peuple[a], en ces termes : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le contexte peut viser les personnes rassemblées pour la guerre, mais l’hébreu dit simplement « le peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: Parle à
  rationale: L’impératif de אמר suivi de אֶל commande de transmettre un message à des destinataires précis. « Parle à » est naturel en français et convient à l’introduction solennelle du discours.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Roboam, fils de Salomon
  rationale: Les noms suivent leur forme française biblique usuelle, et la relation de filiation est rendue directement.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le titre royal et son complément sont rendus de manière directe et idiomatique.
- source_word: כָּל בֵּית יְהוּדָה וּבִנְיָמִין
  choice: toute la communauté de Juda et de Benjamin
  rationale: Dans ce contexte politique et collectif, בֵּית désigne la communauté constituée autour de Juda. En français actuel, « communauté » transmet mieux ce sens que le calque ambigu « maison », tandis que « de Juda et de Benjamin » associe naturellement les deux groupes.
- source_word: וְיֶתֶר הָעָם
  choice: et au reste du peuple
  rationale: יֶתֶר signifie « reste » ou « restant », et הָעָם désigne explicitement le peuple. Le contexte peut viser les hommes rassemblés pour combattre, sans que le mot « armée » figure ici.
- source_word: לֵאמֹר
  choice: 'Dis-leur :'
  rationale: L’infinitif quotatif introduit les paroles du verset suivant. Une nouvelle proposition impérative avec deux-points est plus naturelle en français que le calque « en disant », sans modifier la fonction du terme.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « communauté de Juda et de Benjamin » privilégie la clarté du sens collectif de l’hébreu sur le calque « maison de Juda ». Le discours reste ouvert sur le verset suivant grâce aux deux-points.
