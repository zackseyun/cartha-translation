  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: fr
  text: Lorsque tout Israël apprit que Jéroboam était revenu, ils envoyèrent le chercher et le convoquèrent à l’assemblée, puis l’établirent roi sur tout Israël. Personne ne resta attaché à la maison de David[a], sauf la seule tribu de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Personne ne suivit la maison de David ». L’expression hébraïque signifie littéralement « être après la maison de David » et marque ici l’allégeance ou l’alignement politique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque … apprit
  rationale: La construction introduit une transition temporelle dans le récit. « Lorsque » en rend naturellement la valeur sans conserver artificiellement « il arriva que ».
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Conserve l’expression collective nationale de l’hébreu, courante dans ce contexte historique.
- source_word: כִּי שָׁב יָרָבְעָם
  choice: que Jéroboam était revenu
  rationale: שׁוּב désigne ici le retour de Jéroboam, antérieur aux actions qui suivent.
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: ils le firent convoquer à l’assemblée
  rationale: Cette formulation française réunit naturellement l’envoi implicite d’un intermédiaire et la convocation de Jéroboam, sans préciser que des messagers furent envoyés puisque le texte ne les nomme pas.
- source_word: הָעֵדָה
  choice: l’assemblée
  rationale: Le terme désigne ici le corps d’Israël réuni pour une décision politique. « Assemblée » évite une coloration ecclésiale indue.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: l’établirent roi
  rationale: Le hiphil de מלך signifie faire régner ou établir comme roi. Cette formulation reste proche de l’hébreu sans ajouter une cérémonie de couronnement.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sur tout Israël
  rationale: Rend directement l’étendue de l’autorité royale exprimée par עַל.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: Personne ne se rallia à la maison de David
  rationale: L’expression idiomatique « être derrière/après » marque ici l’alignement ou l’allégeance politique. « Se rallier à » l’exprime clairement en français moderne.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: sauf la seule tribu de Juda
  rationale: זוּלָתִי introduit l’exception et לְבַדּוֹ en souligne l’exclusivité; « la seule tribu » conserve cette insistance.
theological_decisions:
- issue: Formule d’allégeance politique après la division du royaume
  choice: Personne ne se rallia à la maison de David
  alternative: Personne ne resta attaché à la maison de David
  rationale: Le texte décrit principalement l’alignement politique des tribus. « Se rallia » rend l’idiome sans décider si l’accent porte sur l’acte de suivre ou sur le maintien d’une fidélité antérieure; l’autre nuance est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure accessible; « l’établirent roi » conserve une légère solennité adaptée au récit royal. Le collectif « tout Israël » est repris par « ils », usage naturel lorsque l’on pense aux membres du peuple.
