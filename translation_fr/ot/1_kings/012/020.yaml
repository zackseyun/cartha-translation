revisions:
- from: Lorsque tout Israël apprit que Jéroboam était revenu, ils le firent convoquer à l’assemblée et l’établirent roi sur tout Israël. Personne ne se rallia à la maison de David[a], sauf la seule tribu de Juda.
  to: Lorsque tout Israël apprit que Jéroboam était revenu, ils envoyèrent le chercher et le convoquèrent à l’assemblée, puis l’établirent roi sur tout Israël. Personne ne resta attaché à la maison de David[a], sauf la seule tribu de Juda.
  rationale: La révision restaure les deux verbes successifs relatifs à l’envoi et à la convocation de Jéroboam. Elle affine aussi la dernière proposition afin d’exprimer l’allégeance politique qui demeure à la maison de David, tout en conservant en note l’alternative plus littérale « suivit ».
