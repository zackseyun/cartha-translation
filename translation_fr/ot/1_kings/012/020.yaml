    reason: lexical_alternative
  revision_rationale: La révision restaure les deux verbes successifs relatifs à l’envoi et à la convocation de Jéroboam. Elle affine aussi la dernière proposition afin d’exprimer l’allégeance politique qui demeure à la maison de David, tout en conservant en note l’alternative plus littérale « suivit ».
