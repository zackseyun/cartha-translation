review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le retour de Jéroboam, l’assemblée, son établissement comme roi et l’exception de Juda. Toutefois, « ils le firent convoquer » transforme les deux verbes coordonnés (« ils envoyèrent » et « ils appelèrent/convoquèrent ») en une seule causation passive et efface l’action d’envoyer.
  naturalness: Le français est globalement fluide et de registre narratif approprié. « Ils envoyèrent le chercher et le convoquèrent à l’assemblée » est idiomatique et restitue plus explicitement la double action du texte.
  terminology: « Jéroboam », « l’assemblée », « la maison de David », « roi » et « la tribu de Juda » sont appropriés. « Resta attaché à la maison de David » rend naturellement, dans ce contexte politique, l’idée d’allégeance durable exprimée par l’idiome hébreu.
  issues:
  - severity: medium
    issue: La double action « ils envoyèrent et ils l’appelèrent » est réduite à « ils le firent convoquer ».
    rationale: Le texte hébreu coordonne וַיִּשְׁלְחוּ et וַיִּקְרְאוּ. La formulation actuelle ajoute une construction causative et ne représente plus explicitement l’envoi. « Envoyèrent le chercher et le convoquèrent » conserve les deux actions sans prétendre préciser l’identité des envoyés.
  - severity: low
    issue: « Personne ne se rallia à la maison de David » peut évoquer surtout un ralliement nouveau plutôt que la persistance de l’allégeance après la sécession.
    rationale: L’expression אַחֲרֵי בֵית־דָּוִד décrit ici ceux qui étaient du côté de la maison de David. « Personne ne resta attaché à la maison de David » reflète mieux cette nuance sans imposer une lecture confessionnelle.
  revised_text: Lorsque tout Israël apprit que Jéroboam était revenu, ils envoyèrent le chercher et le convoquèrent à l’assemblée, puis l’établirent roi sur tout Israël. Personne ne resta attaché à la maison de David[a], sauf la seule tribu de Juda.
  revised_footnotes:
