base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: fr
  text: Et maintenant, mon père a rendu votre joug pesant, mais moi, j’alourdirai encore votre joug. Mon père vous a châtiés avec des fouets, mais moi, je vous châtierai avec des scorpions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « avec des fouets-scorpions », c’est-à-dire des fouets ou des lanières particulièrement douloureux. L’hébreu dit littéralement : « avec des scorpions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: a rendu … pesant
  rationale: Le hiphil de עמס exprime l’idée d’imposer une lourde charge. Avec « joug », cette formulation naturelle conserve en français l’image et son poids concret.
- source_word: עֹל / עֻלְּכֶם
  choice: joug
  rationale: Le terme désigne concrètement un joug et, par métaphore, une domination oppressive ou des obligations accablantes. La répétition est conservée pour maintenir la force rhétorique de l’hébreu.
- source_word: כָּבֵד
  choice: pesant
  rationale: L’adjectif signifie littéralement « lourd ». « Pesant » convient naturellement au joug et évite de remplacer l’image par une interprétation telle que « dur ».
- source_word: אוֹסִיף עַל
  choice: j’alourdirai encore
  rationale: La construction signifie ajouter à quelque chose ou l’augmenter. En français, « j’alourdirai encore votre joug » rend clairement et naturellement l’augmentation annoncée, sans l’expression peu idiomatique « j’ajouterai à votre joug ».
- source_word: יִסַּר / אֲיַסֵּר
  choice: a châtiés / châtierai
  rationale: יסר peut désigner une correction ou un châtiment, ici explicitement corporel et formulé comme une menace politique. « Châtier » conserve cette gravité ainsi que la répétition verbale.
- source_word: בַּשּׁוֹטִים
  choice: avec des fouets
  rationale: שׁוֹט désigne un fouet. Cette traduction est directe, claire et conserve l’instrument du châtiment.
- source_word: בָּעַקְרַבִּים
  choice: avec des scorpions
  rationale: Le nom signifie littéralement « scorpions ». Il peut ici évoquer des fouets particulièrement cruels ou munis de pointes, mais le texte principal conserve l’image hébraïque, tandis que la note signale l’autre compréhension possible.
