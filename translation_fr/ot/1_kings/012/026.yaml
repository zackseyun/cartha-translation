  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: fr
  text: 'Jéroboam se dit en lui-même[a] : « Maintenant, le royaume retournera à la maison de David. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « dans son cœur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: se dit
  rationale: Le verbe introduit ici une parole intérieure. « Se dit » exprime naturellement cette pensée en français, tandis que « dans son cœur » conserve l’image hébraïque.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בְּלִבּוֹ
  choice: dans son cœur
  rationale: Rend littéralement l’expression hébraïque tout en restant compréhensible; elle désigne une réflexion intérieure.
- source_word: עַתָּה
  choice: Maintenant
  rationale: Conserve la valeur temporelle immédiate et la concision de l’hébreu.
- source_word: תָּשׁוּב
  choice: retournera
  rationale: Le verbe שׁוב exprime le retour; le futur convient à la crainte de Jéroboam concernant un rétablissement politique.
- source_word: הַמַּמְלָכָה
  choice: le royaume
  rationale: Désigne ici le pouvoir royal ou le territoire soumis au roi; « royaume » est le terme français le plus direct dans ce contexte.
- source_word: לְבֵית דָּוִד
  choice: à la maison de David
  rationale: Conserve l’expression dynastique biblique et sa résonance, sans la réduire explicitement à « dynastie ».
theological_decisions:
- issue: Expression de la parole intérieure בְּלִבּוֹ
  choice: se dit dans son cœur
  alternative: se dit en lui-même
  rationale: La formulation retenue préserve l’image anthropologique de l’hébreu sans ajouter d’interprétation doctrinale; la note donne l’équivalent idiomatique français.
translation_notes:
  register: Français moderne, sobre et digne. La tournure « dans son cœur » garde la texture biblique de l’original; « maison de David » maintient la portée dynastique sans paraphrase explicative.
