  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ אֲשֶׁ֥ר הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: fr
  text: Mais il rejeta le conseil que les anciens lui avaient donné et consulta les jeunes hommes qui avaient grandi avec lui et qui se tenaient devant lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui étaient à son service » ; l’expression hébraïque « se tenir devant quelqu’un » peut désigner le service à la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: rejeta
  rationale: Le verbe עזב signifie laisser, abandonner ou délaisser. Dans ce contexte, « rejeta » exprime clairement la décision de Roboam d’écarter le conseil reçu, en français moderne et naturel.
- source_word: עֲצַת
  choice: le conseil
  rationale: עֵצָה désigne ici l’avis ou le conseil donné au roi. « Conseil » convient au contexte de délibération royale et reste courant en français.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Le terme désigne des hommes âgés qui exercent ici la fonction de conseillers expérimentés. « Les anciens » rend à la fois leur âge relatif et leur statut reconnu.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: que les anciens lui avaient donné
  rationale: Avec « conseil », la tournure française naturelle est « donner un conseil ». Le plus-que-parfait marque que ce conseil avait déjà été formulé.
- source_word: וַיִּוָּעַץ
  choice: consulta
  rationale: Le niphal de יעץ signifie ici consulter ou prendre conseil auprès de quelqu’un. « Consulta » est concis, idiomatique et adapté à la narration.
- source_word: הַיְלָדִים
  choice: les jeunes hommes
  rationale: Bien que le mot puisse désigner des enfants ou des garçons, le contexte parle des pairs adultes de Roboam présents à la cour. « Jeunes hommes » maintient le contraste avec les anciens sans suggérer qu’il s’agit d’enfants.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: qui avaient grandi avec lui
  rationale: Cette expression indique qu’ils avaient été élevés ou avaient grandi aux côtés de Roboam. Le plus-que-parfait s’intègre naturellement au récit.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: qui se tenaient devant lui
  rationale: Cette traduction conserve l’image de l’expression hébraïque. Celle-ci peut aussi être un idiome de cour indiquant qu’ils étaient à son service, possibilité signalée en note sans l’imposer dans le texte.
