  text: וַֽ/יִּשְׁלְחוּ֙ וַ/יִּקְרְאוּ ל֔/וֹ ו/יבאו יָרָבְעָ֖ם וְ/כָל קְהַ֣ל יִשְׂרָאֵ֑ל וַֽ/יְדַבְּר֔וּ אֶל רְחַבְעָ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: fr
  text: 'Ils envoyèrent chercher Jéroboam[a]. Jéroboam et toute l’assemblée[b] d’Israël vinrent parler à Roboam en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils envoyèrent et l’appelèrent ». Il s’agit de faire venir Jéroboam.'
    reason: lexical_alternative
  - marker: b
    text: Ou « communauté ». Le terme désigne ici Israël réuni en assemblée dans un cadre public.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: Ils envoyèrent donc chercher Jéroboam
  rationale: Cette formulation française exprime naturellement l’envoi de personnes chargées de faire venir Jéroboam, tout en évitant le lourd calque « ils envoyèrent et l’appelèrent ». Le nom remplace le pronom afin d’éviter toute ambiguïté en français, comme le permet le contexte immédiat.
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le pluriel du verbe présente Jéroboam et l’assemblée comme les sujets de l’arrivée; « vinrent » suit simplement la progression narrative.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וְכָל קְהַל יִשְׂרָאֵל
  choice: et toute l’assemblée d’Israël
  rationale: קָהָל désigne ici le corps d’Israël rassemblé dans un cadre public et politique. « Assemblée » convient mieux que « congrégation », qui pourrait recevoir une coloration ecclésiale en français moderne.
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם
  choice: parler à Roboam
  rationale: « Parler à » rend directement דִּבֵּר אֶל et maintient l’introduction du discours qui suit.
- source_word: רְחַבְעָם
  choice: Roboam
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette tournure française introduit naturellement la citation du verset suivant sans reproduire artificiellement le participe « disant ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement restructurée pour éviter un calque hébraïque peu naturel, sans modifier la séquence des actions. Le deux-points signale que la déclaration se poursuit au verset suivant.
