base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: fr
  text: Jéroboam bâtit Sichem, dans la région montagneuse d’Éphraïm, et y habita. Puis il partit de là et bâtit Penuel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Penuel est aussi écrit « Péniel » dans certains passages bibliques et dans certaines traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: bâtit
  rationale: Le verbe בנה signifie couramment « bâtir ». Dans le contexte d’une ville, il peut aussi évoquer sa reconstruction ou sa fortification, mais « bâtit » préserve le sens général sans préciser indûment la nature des travaux.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Nom de lieu rendu selon sa forme française biblique courante.
- source_word: בְּהַר אֶפְרַיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: הַר peut désigner non seulement une montagne précise, mais aussi une région de relief montagneux. Cette formulation naturelle en français exprime ici le sens géographique régional.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: et s’y installa
  rationale: ישב peut signifier habiter, demeurer ou s’installer. Le pronom féminin renvoie à la ville de Sichem; « s’y installa » rend naturellement l’idée de résidence dans ce contexte.
- source_word: וַיֵּצֵא מִשָּׁם
  choice: Puis il partit de là
  rationale: יצא signifie littéralement « sortir » ou « partir ». Ici, l’expression indique le départ de Sichem; « partit de là » est idiomatique tout en conservant le mouvement exprimé par l’hébreu.
- source_word: פְּנוּאֵל
  choice: Pénouel
  rationale: Ce nom propre suit la vocalisation du texte hébreu de ce verset. La forme apparentée « Péniel » est signalée en note.
