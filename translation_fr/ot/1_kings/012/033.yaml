base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: fr
  text: Il monta sur l’autel qu’il avait construit à Béthel, le quinzième jour du huitième mois, le mois qu’il avait imaginé selon son propre cœur[a]. Il célébra une fête pour les Israélites et monta sur l’autel pour faire brûler de l’encens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « le mois qu’il avait conçu de sa propre initiative » ou, littéralement, « le mois qu’il avait imaginé de son cœur ».'
    reason: La formule hébraïque indique que le choix du mois venait de Jéroboam lui-même; l’expression « de son cœur » peut aussi évoquer son intention ou son dessein personnel.
lexical_decisions:
- source_word: וַיַּעַל
  choice: il monta
  rationale: Le verbe עלה signifie couramment « monter ». Sa répétition dans le verset est conservée, tout en précisant « pour y faire brûler » à la seconde occurrence afin d’obtenir un français naturel.
- source_word: הַמִּזְבֵּחַ
  choice: l’autel
  rationale: Équivalent français direct et usuel de מזבח dans un contexte cultuel.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: qu’il avait construit à Béthel
  rationale: « Construit » exprime naturellement la fabrication d’un autel; « à Béthel » convient à un nom de ville.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: le quinzième jour du huitième mois
  rationale: Formulation française idiomatique qui reproduit exactement la date hébraïque.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: mois qu’il avait lui-même imaginé
  rationale: בדא exprime ici l’idée d’inventer ou de concevoir. La tournure retenue garde la critique implicite d’un calendrier issu de l’initiative de Jéroboam, sans l’expliciter davantage.
- source_word: וַיַּעַשׂ חָג
  choice: il institua une fête
  rationale: Dans ce contexte, עשה avec חג ne décrit pas seulement la célébration ponctuelle, mais l’établissement de cette fête; « institua » rend cette valeur clairement et dignement.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les Israélites
  rationale: L’expression signifie littéralement « pour les fils d’Israël », mais fonctionne comme désignation nationale. « Les Israélites » en restitue naturellement la portée collective en français moderne.
- source_word: לְהַקְטִיר
  choice: pour y faire brûler de l’encens
  rationale: Dans ce cadre cultuel, הקטיר désigne l’action de faire monter en fumée, souvent de l’encens. Cette traduction concise correspond au contexte tout en évitant d’ajouter un objet sacrificiel non précisé.
theological_decisions:
- issue: Portée évaluative de la formule décrivant le mois choisi par Jéroboam
  choice: qu’il avait lui-même imaginé
  alternative: qu’il avait conçu de sa propre initiative; qu’il avait tiré de son propre cœur
  rationale: Le texte présente la date comme une innovation humaine plutôt que comme une prescription divine. La traduction conserve cette critique narrative implicite sans transformer le verset en commentaire théologique.
- issue: Désignation nationale בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël; le peuple d’Israël
  rationale: Ici, la formule désigne collectivement la nation et non uniquement des descendants masculins. « Les Israélites » transmet cette fonction sans imposer une lecture confessionnelle particulière.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement réorganisées pour éviter une coordination lourde, tout en maintenant la répétition de « monta » et la progression du texte hébreu.
