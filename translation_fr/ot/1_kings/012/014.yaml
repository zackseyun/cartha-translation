  text: וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֗ם כַּ/עֲצַ֤ת הַ/יְלָדִים֙ לֵ/אמֹ֔ר אָבִ/י֙ הִכְבִּ֣יד אֶֽת עֻלְּ/כֶ֔ם וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: fr
  text: 'Il leur parla suivant le conseil des jeunes gens : « Mon père a rendu votre joug pesant, et moi, j’ajouterai encore à votre joug. Mon père vous a corrigés avec des fouets, mais moi, je vous corrigerai avec des scorpions[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « avec des fouets à pointes », c’est-à-dire des fouets munis de pointes ou de crochets ; l’hébreu dit littéralement « avec des scorpions ».'
    reason: 'Alternative lexicale : le terme concret peut désigner ou évoquer un instrument de flagellation particulièrement cruel.'
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Il leur parla
  rationale: Le piel de דבר signifie couramment « parler ». Cette formulation conserve le verbe hébreu sans préciser davantage qu’il s’agit d’une réponse.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: suivant le conseil des jeunes gens
  rationale: עֵצָה désigne un conseil, et le כ marque ici la conformité. « Jeunes gens » identifie naturellement les conseillers plus jeunes, par contraste avec les anciens.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: a rendu votre joug pesant
  rationale: Cette traduction garde à la fois le sens causatif de כבד et l’image concrète du joug portée par עֹל.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: j’ajouterai encore à votre joug
  rationale: יסף avec על signifie littéralement « ajouter à ». « Encore » rend explicite en français la valeur d’accroissement sans remplacer l’image hébraïque.
- source_word: יִסַּר / אֲיַסֵּר
  choice: a corrigés / corrigerai
  rationale: יסר peut désigner une correction imposée, une discipline ou un châtiment. « Corriger » conserve cette amplitude tout en convenant au contexte coercitif.
- source_word: בַּשּׁוֹטִים
  choice: avec des fouets
  rationale: שׁוֹט désigne un fouet ou un instrument servant à flageller ; « fouets » est l’équivalent français courant et précis.
- source_word: בָּעַקְרַבִּים
  choice: avec des scorpions
  rationale: Le texte hébreu emploie littéralement le nom « scorpions ». L’image est conservée dans le texte, tandis que son possible sens technique est signalé en note.
theological_decisions:
- issue: Nature de l’instrument désigné par « scorpions »
  choice: Conserver l’image littérale « scorpions » dans le texte principal
  alternative: Traduire « fouets à pointes » ou « fouets garnis de crochets »
  rationale: Le substantif hébreu désigne littéralement des scorpions, mais pourrait évoquer un type de fouet muni de pointes ou de barbes. La traduction ne tranche pas cette ambiguïté lexicale et l’explique en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la déclaration royale ainsi que les images concrètes du joug, des fouets et des scorpions sont préservés.
