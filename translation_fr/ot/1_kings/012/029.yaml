source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הָ/אֶחָ֖ד בְּ/בֵֽית אֵ֑ל וְ/אֶת הָ/אֶחָ֖ד נָתַ֥ן בְּ/דָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: fr
  text: Il plaça l’un à Béthel[a] et mit l’autre à Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il s’agit de l’un des deux veaux mentionnés au verset précédent. Autre traduction : « Il plaça un veau à Béthel et mit l’autre à Dan. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le verbe שׂים signifie « placer, mettre ». « Plaça » convient au récit et exprime clairement l’installation de l’objet en un lieu.
- source_word: אֶת הָאֶחָד
  choice: l’un
  rationale: Dans cette construction distributive renvoyant aux deux objets du verset précédent, « l’un » est l’équivalent français naturel de l’expression hébraïque littéralement « le un ».
- source_word: בְּבֵית אֵל
  choice: à Béthel
  rationale: La préposition בְּ marque ici la localisation. Devant un nom de ville, le français emploie naturellement « à » ; Béthel est conservé comme nom propre traditionnel.
- source_word: וְאֶת הָאֶחָד
  choice: et l’autre
  rationale: La répétition hébraïque de « l’un » forme une paire distributive ; en français idiomatique, elle se rend par « l’un… l’autre ».
- source_word: נָתַן
  choice: mit
  rationale: Dans ce contexte locatif, נָתַן a le sens de « mettre, placer ». « Mit » préserve le sens tout en reproduisant la variation verbale du texte hébreu.
- source_word: בְּדָן
  choice: à Dan
  rationale: La préposition בְּ indique la localisation ; « à Dan » est la tournure française naturelle avec ce nom de lieu.
theological_decisions:
- issue: Référent de « l’un » et « l’autre »
  choice: Conserver les objets sous-entendus et renvoyer ainsi aux deux veaux mentionnés au verset précédent.
  alternative: « Il plaça un veau à Béthel et mit l’autre à Dan. »
  rationale: L’antécédent est clair dans le contexte, mais l’hébreu ne répète pas le nom « veau ». Maintenir l’ellipse respecte la formulation de la source sans obscurcir le sens.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La tournure « l’un… l’autre » conserve naturellement l’ellipse de l’hébreu.
