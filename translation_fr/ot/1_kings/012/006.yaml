  text: וַ/יִּוָּעַ֞ץ הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הַ/זְּקֵנִים֙ אֲשֶׁר הָי֣וּ עֹמְדִ֗ים אֶת פְּנֵי֙ שְׁלֹמֹ֣ה אָבִ֔י/ו בִּֽ/הְיֹת֥/וֹ חַ֖י לֵ/אמֹ֑ר אֵ֚יךְ אַתֶּ֣ם נֽוֹעָצִ֔ים לְ/הָשִׁ֥יב אֶת הָֽ/עָם הַ/זֶּ֖ה דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: fr
  text: 'Alors le roi Roboam consulta les anciens qui avaient servi en présence de son père Salomon du vivant de celui-ci[a]. Il leur demanda : « Comment me conseillez-vous de répondre à ce peuple[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui se tenaient devant son père Salomon ». Cette expression peut désigner ceux qui servaient en sa présence, notamment à la cour.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « répondre à ce peuple une parole », c’est-à-dire lui donner une réponse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: consulta
  rationale: Le nifal de יעץ exprime ici le fait de demander conseil à d’autres. « Consulta » est naturel en français et convient au cadre royal.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: le roi Roboam
  rationale: Cet ordre est idiomatique en français et représente directement le titre suivi du nom.
- source_word: הַזְּקֵנִים
  choice: les anciens
  rationale: Dans ce contexte de cour, le terme désigne des hommes d’expérience, probablement des conseillers de haut rang, et non simplement des hommes âgés.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: qui avaient servi en présence de Salomon
  rationale: L’expression idiomatique « se tenir devant » peut désigner le service ou l’assistance à la cour. La formulation française en communique le sens tout en gardant l’idée de présence.
- source_word: אָבִיו
  choice: son père
  rationale: Le possessif renvoie à Roboam et identifie Salomon comme son père.
- source_word: בִּהְיֹתוֹ חַי
  choice: du vivant de celui-ci
  rationale: Cette formulation rattache sans ambiguïté la proposition temporelle à Salomon et indique que ces anciens le servaient avant sa mort.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Comment me conseillez-vous
  rationale: La question sollicite leur avis sur la réponse à donner. « Me » est implicite dans la scène de consultation et nécessaire à une formulation française naturelle.
- source_word: לְהָשִׁיב
  choice: de répondre
  rationale: Le hifil de שוב désigne ici le fait de faire revenir une parole, donc de donner une réponse.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le nom collectif singulier et le démonstratif sont conservés, ainsi que la légère distance perceptible dans l’expression.
- source_word: דָּבָר
  choice: répondre
  rationale: Littéralement « une parole », le nom complète ici l’expression signifiant donner une réponse. Le français naturel n’exige pas de le rendre séparément dans le texte principal.
