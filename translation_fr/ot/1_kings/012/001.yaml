  text: וַ/יֵּ֥לֶךְ רְחַבְעָ֖ם שְׁכֶ֑ם כִּ֥י שְׁכֶ֛ם בָּ֥א כָל יִשְׂרָאֵ֖ל לְ/הַמְלִ֥יךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/001.yaml
  text: Then Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: fr
  text: Roboam se rendit à Sichem, car tout Israël était venu à Sichem pour le faire roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: se rendit
  rationale: Exprime naturellement en français le déplacement de Roboam vers Sichem, sans ajouter une nuance absente du verbe hébreu.
- source_word: כִּי
  choice: car
  rationale: Conserve ici la relation causale explicite entre le rassemblement d’Israël à Sichem et le déplacement de Roboam.
- source_word: כָל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Reproduit l’expression collective hébraïque, qui désigne l’ensemble du peuple représenté dans ce rassemblement.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: pour le faire roi
  rationale: 'Rend la construction causative de מלך : le reconnaître ou l’établir comme roi.'
theological_decisions:
- issue: Rôle du peuple dans l’accession de Roboam
  choice: pour le faire roi
  alternative: pour le proclamer roi
  rationale: Le causatif hébreu indique que le peuple vient établir Roboam comme roi. « Faire roi » préserve cette formulation sans préciser davantage la forme politique ou cérémonielle de l’acte.
translation_notes:
  register: Français international moderne, simple et digne. Le nom שְׁכֶם est rendu selon sa forme française traditionnelle « Sichem ». Aucun marqueur de note n’est nécessaire.
