    issue: « nomma prêtres des hommes pris dans l’ensemble du peuple » est lourd
    rationale: La construction est peu idiomatique en français moderne. « Institua comme prêtres des hommes issus de l’ensemble du peuple » exprime clairement l’établissement de ces personnes comme prêtres.
