  text: וַ/יַּ֖עַשׂ אֶת בֵּ֣ית בָּמ֑וֹת וַ/יַּ֤עַשׂ כֹּֽהֲנִים֙ מִ/קְצ֣וֹת הָ/עָ֔ם אֲשֶׁ֥ר לֹֽא הָי֖וּ מִ/בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: fr
  text: Il établit un sanctuaire de hauts lieux[a] et institua comme prêtres des hommes issus de l’ensemble du peuple[b], qui n’étaient pas descendants de Lévi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une maison de hauts lieux », expression désignant ici un sanctuaire associé aux hauts lieux.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut aussi se rendre par « parmi le peuple » ou « dans toutes les couches du peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il établit / nomma
  rationale: 'Le verbe עשה signifie largement « faire ». Le contexte appelle en français deux formulations naturelles : « établit » pour le sanctuaire et « nomma » pour les prêtres, sans changer l’action décrite.'
- source_word: בֵּית בָּמוֹת
  choice: un sanctuaire pour les hauts lieux
  rationale: Littéralement « une maison de hauts lieux ». Dans ce contexte cultuel, « sanctuaire » rend naturellement בית, tandis que « pour les hauts lieux » conserve le lien avec les lieux de culte appelés במות sans supposer que le bâtiment se trouvait nécessairement en hauteur.
- source_word: כֹּהֲנִים
  choice: prêtres
  rationale: Équivalent français courant de כהנים dans un contexte cultuel.
- source_word: מִקְצוֹת הָעָם
  choice: des hommes pris dans l’ensemble du peuple
  rationale: L’expression indique que les prêtres furent choisis dans la population en général. Cette formulation évite le calque obscur « des extrémités du peuple » tout en conservant la portée collective de l’expression.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: qui n’étaient pas descendants de Lévi
  rationale: Cette traduction conserve l’image généalogique de « fils de Lévi » tout en étant idiomatique en français moderne.
theological_decisions:
- issue: Nature de l’institution cultuelle créée par Jéroboam
  choice: un sanctuaire pour les hauts lieux
  alternative: une maison de hauts lieux
  rationale: « Sanctuaire » explicite seulement la valeur cultuelle que l’expression possède dans ce contexte. La traduction ne qualifie pas elle-même ce culte d’illégitime et n’ajoute donc aucun jugement théologique absent de ce verset.
- issue: Origine non lévitique des prêtres
  choice: qui n’étaient pas descendants de Lévi
  alternative: qui n’étaient pas lévites
  rationale: Le choix retenu reproduit la formulation généalogique du texte hébreu et maintient explicitement la distinction historique et cultuelle, sans en développer les conséquences doctrinales.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase privilégie une syntaxe fluide tout en conservant les éléments cultuels et généalogiques du texte hébreu. Les notes signalent les deux principaux idiomes sans alourdir le verset.
