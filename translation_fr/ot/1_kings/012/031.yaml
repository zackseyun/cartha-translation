  source_fidelity: Le texte hébreu emploie le verbe général עשה (« faire/établir ») pour les deux actions. « Établit » et « institua comme prêtres » rendent le sens contextuel sans imposer une modalité technique. בֵּית בָּמוֹת est au singulier et désigne un sanctuaire lié aux hauts lieux ; « un sanctuaire de hauts lieux » évite de suggérer indûment qu’il était construit au service de plusieurs lieux distincts. מִקְצוֹת הָעָם indique un recrutement dans la population au sens large, et la relative précise que ces prêtres n’étaient pas de la descendance de Lévi.
  naturalness: La formulation révisée est fluide en français international moderne et conserve un registre biblique sobre. « Institua comme prêtres des hommes issus de l’ensemble du peuple » est plus naturel que « nomma prêtres des hommes pris dans… », tout en gardant la portée collective de l’expression hébraïque.
  terminology: « Sanctuaire », « hauts lieux », « prêtres » et « descendance de Lévi » sont des termes français clairs et appropriés au contexte cultuel et généalogique. La note a conserve la littéralité de l’expression sans transformer la note en commentaire doctrinal.
