base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: fr
  text: 'Jéroboam et tout le peuple se rendirent auprès de Roboam le troisième jour, comme le roi l’avait dit : « Revenez auprès de moi le troisième jour. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: se rendirent auprès de
  rationale: Le verbe בוא peut signifier « venir » ou « aller » selon le point de vue. « Se rendirent auprès de » exprime naturellement en français le déplacement vers Roboam sans imposer artificiellement le point de vue du narrateur.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: וְכָל הָעָם
  choice: et tout le peuple
  rationale: Rend directement עָם et désigne collectivement les personnes venues présenter leur demande au roi.
- source_word: אֶל רְחַבְעָם
  choice: auprès de Roboam
  rationale: La préposition אֶל marque ici le mouvement en direction d’une personne; « auprès de » convient naturellement après « se rendre ».
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: le troisième jour
  rationale: Expression temporelle française usuelle, fidèle à la formulation hébraïque.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Marque la conformité entre leur venue et l’instruction préalable du roi.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: le roi l’avait demandé
  rationale: Dans ce contexte, דִּבֶּר renvoie à l’instruction précédemment donnée. Le plus-que-parfait marque clairement son antériorité, et « demandé » produit une formulation française naturelle sans modifier le contenu de l’ordre cité.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Introduit directement les paroles antérieures du roi.
- source_word: שׁוּבוּ אֵלַי
  choice: Revenez auprès de moi
  rationale: שׁוּב exprime le retour; l’impératif pluriel et la direction vers le roi sont conservés dans une formulation actuelle et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « le troisième jour » est conservée comme dans l’hébreu. Aucun enjeu théologique particulier ni aucune note textuelle nécessaire.
