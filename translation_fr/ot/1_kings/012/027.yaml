revisions:
- from: Si[a] ce peuple monte à Jérusalem pour offrir des sacrifices dans la maison de Yahweh[b], alors le cœur de ce peuple reviendra à son seigneur[c], Roboam, roi de Juda. Ils me tueront et retourneront à Roboam, roi de Juda.
  to: Si[a] ce peuple monte pour offrir des sacrifices dans la maison de Yahweh[b] à Jérusalem, alors le cœur de ce peuple reviendra à leur seigneur[c], à Roboam, roi de Juda. Ils me tueront et retourneront à Roboam, roi de Juda.
  rationale: La localisation « à Jérusalem » est rattachée à la « maison de Yahweh », comme dans l’hébreu. Le possessif est corrigé en « leur » pour représenter le suffixe pluriel d’« אֲדֹנֵיהֶם ». Les autres choix, y compris la condition introduite par « si », la métaphore du cœur et la répétition de « revenir/retourner », sont conservés.
