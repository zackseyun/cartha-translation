    issue: « son seigneur » au lieu de « leur seigneur »
    rationale: אֲדֹנֵיהֶם porte un suffixe de troisième personne du pluriel (« leur »), dont le référent est « ce peuple ». L’apposition identifie ce seigneur unique comme Roboam.
