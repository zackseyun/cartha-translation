  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: fr
  text: Si[a] ce peuple monte pour offrir des sacrifices dans la maison de Yahweh[b] à Jérusalem, alors le cœur de ce peuple reviendra à leur seigneur[c], à Roboam, roi de Juda. Ils me tueront et retourneront à Roboam, roi de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quand ce peuple monte… ». La particule hébraïque peut parfois prendre un sens temporel, mais elle exprime probablement ici l’éventualité redoutée par Jéroboam.
    reason: lexical_alternative
  - marker: b
    text: La « maison de Yahweh » désigne ici le temple de Jérusalem.
    reason: cultural_note
  - marker: c
    text: Ou « à leur maître ». Le terme hébreu peut désigner un seigneur ou un maître; l’apposition qui suit montre qu’il s’agit de Roboam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: La particule introduit ici l’éventualité que Jéroboam redoute; «si» en conserve mieux la valeur conditionnelle, sans exclure la nuance temporelle signalée en note.
- source_word: יַעֲלֶה
  choice: monte à Jérusalem
  rationale: Le verbe עלה signifie «monter» et appartient au langage habituel du pèlerinage vers Jérusalem; cette formulation conserve aussi la nuance topographique.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: pour offrir des sacrifices
  rationale: Littéralement «faire des sacrifices»; «offrir des sacrifices» est l’expression française naturelle pour l’acte cultuel visé.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: La traduction conserve l’image hébraïque de la «maison» tout en précisant en note qu’il s’agit du temple de Jérusalem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit directement afin de représenter le tétragramme du texte source.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: alors le cœur de ce peuple reviendra
  rationale: La métaphore du cœur exprime un retour intérieur d’allégeance. «Reviendra» conserve la répétition de שׁוב avec la fin du verset.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: à son seigneur
  rationale: Le référent singulier est explicité immédiatement par l’apposition «Roboam, roi de Juda». «Seigneur» garde la notion d’autorité politique, tandis que «maître» est signalé comme autre possibilité.
- source_word: וַהֲרָגֻנִי
  choice: Ils me tueront
  rationale: Le verbe הרג désigne directement l’action de tuer; la formulation est claire et actuelle.
- source_word: וְשָׁבוּ
  choice: et retourneront
  rationale: Ce choix reprend en français le même radical conceptuel que «reviendra», reflétant la répétition de שׁוב dans l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. «Yahweh» représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Sens du retour du cœur
  choice: conserver la métaphore «le cœur… reviendra»
  alternative: «ce peuple fera de nouveau allégeance»
  rationale: La formulation littérale préserve à la fois l’image anthropologique du cœur et la tension entre orientation intérieure et loyauté politique, sans réduire le propos à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle et les répétitions du texte hébreu sont maintenues, tandis que l’ordre des mots est légèrement adapté pour une lecture française naturelle.
