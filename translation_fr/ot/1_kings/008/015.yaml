  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣ד אָבִ֑/י וּ/בְ/יָד֥/וֹ מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: fr
  text: 'Il dit : « Béni soit Yahweh, le Dieu d’Israël, qui a parlé de sa bouche à David, mon père, et qui a accompli de sa main ce qu’il avait dit : »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif employé dans cette formule de bénédiction se rend naturellement et formellement en français par « Béni soit ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette formulation rend directement la chaîne construite hébraïque.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: qui a parlé de sa bouche
  rationale: Le maintien de « sa bouche » préserve le parallélisme concret entre la parole prononcée et l’accomplissement réalisé « de sa main ».
- source_word: אֵת דָּוִד אָבִי
  choice: à David, mon père
  rationale: Avec le verbe « parler », אֵת désigne ici naturellement le destinataire; l’apposition est ponctuée pour une lecture française claire.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: et qui, de sa main, a accompli ce qu’il avait promis
  rationale: « De sa main » conserve l’image hébraïque, tandis que « ce qu’il avait promis » explicite l’objet sous-entendu de מִלֵּא et le rapport entre parole et accomplissement.
- source_word: לֵאמֹר
  choice: 'Il avait dit :'
  rationale: L’infinitif quotatif introduit les paroles rapportées au verset suivant. Une proposition française distincte évite le maladroit « en disant » après la longue phrase et rend clairement la transition.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le conserve sans le remplacer par un titre et correspond à la vocalisation savante courante.
- issue: Rapport entre la parole divine et son accomplissement
  choice: Conserver les images « de sa bouche » et « de sa main »
  alternative: Simplifier en « qui avait promis et qui a tenu sa promesse »
  rationale: Le parallélisme anthropomorphique du texte souligne la correspondance entre ce que Dieu dit et ce qu’il réalise; il convient de ne pas effacer cette tension imagée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement réorganisée à la fin pour introduire naturellement la citation du verset suivant, tout en conservant le parallélisme hébreu de la bouche et de la main.
