  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: fr
  text: 'En ce temps-là, Salomon célébra la fête, avec tout Israël : une grande assemblée, depuis Lebo-Hamath[a] jusqu’au torrent d’Égypte[b], devant Yahweh notre Dieu, pendant sept jours et sept jours, soit quatorze jours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’entrée de Hamath ». L’hébreu peut être compris comme une indication géographique descriptive ou comme le nom de lieu Lebo-Hamath.
    reason: alternative_reading
  - marker: b
    text: Ou « l’ouadi d’Égypte ». Le terme hébreu désigne souvent un cours d’eau saisonnier plutôt qu’un grand fleuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ … אֶת הֶחָג
  choice: célébra la fête
  rationale: Le verbe עָשָׂה signifie littéralement « faire », mais avec חַג il désigne idiomatiquement la célébration ou l’observance d’une fête. « Célébra la fête » est naturel et précis en français.
- source_word: קָהָל גָּדוֹל
  choice: une grande assemblée
  rationale: קָהָל désigne une communauté effectivement rassemblée. « Assemblée » conserve la portée collective et formelle sans connotation ecclésiale indue.
- source_word: מִלְּבוֹא חֲמָת
  choice: de Lebo-Hamath
  rationale: L’expression sert couramment de repère territorial et peut être comprise comme un nom de lieu. L’autre lecture possible, « l’entrée de Hamath », est conservée en note.
- source_word: נַחַל מִצְרַיִם
  choice: le torrent d’Égypte
  rationale: נַחַל désigne souvent un cours d’eau temporaire, un lit de torrent ou un ouadi, et non un grand fleuve. « Torrent d’Égypte » évite notamment une confusion avec le Nil.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: devant Yahweh notre Dieu
  rationale: « Devant » rend directement la relation spatiale et cultuelle exprimée par לִפְנֵי, tandis que « Yahweh » représente le nom divin יהוה.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: pendant sept jours et sept jours
  rationale: La répétition inhabituelle de l’hébreu est maintenue afin de ne pas effacer la structure de deux périodes successives de sept jours.
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: soit quatorze jours
  rationale: « Soit » rend naturellement en français la récapitulation apposée qui donne la durée totale.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Rapport entre les deux périodes de sept jours
  choice: conserver « sept jours et sept jours »
  alternative: « sept jours, puis sept autres jours »
  rationale: La formulation française conserve la répétition exacte et la légère tension du texte hébreu, sans préciser davantage la relation entre les deux célébrations.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près l’ordre hébreu tout en rendant explicite, par « formant », le rapport appositif entre « tout Israël » et « une grande assemblée ». Les deux marqueurs de note sont placés sur les expressions géographiques auxquelles les notes se rapportent.
