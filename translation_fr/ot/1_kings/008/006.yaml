  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: fr
  text: Puis les prêtres apportèrent l’arche de l’alliance de Yahweh à sa place, dans le sanctuaire intérieur du Temple[a], dans le lieu très saint[b], sous les ailes des chérubins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « de la Maison » ; il s’agit ici du Temple.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « le Saint des saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Puis … apportèrent
  rationale: Le wayyiqtol fait progresser le récit. « Puis » rend naturellement cette succession, tandis qu’« apportèrent » convient au déplacement de l’arche vers son emplacement.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Équivalent direct du nom défini pluriel désignant les ministres du culte chargés de transporter l’arche.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Cette formulation conserve clairement la chaîne construite hébraïque et le nom divin personnel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français moderne du tétragramme, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: מְקוֹמוֹ
  choice: sa place
  rationale: Le suffixe renvoie à l’arche. La traduction n’ajoute pas l’idée interprétative de place « attitrée » ou « prévue ».
- source_word: דְּבִיר
  choice: le sanctuaire intérieur
  rationale: Dans le contexte du Temple, le terme désigne la pièce la plus intérieure. Cette expression est claire et évite le traditionnel « oracle », aujourd’hui ambigu.
- source_word: הַבַּיִת
  choice: du Temple
  rationale: Le mot signifie littéralement « la Maison », mais désigne ici sans ambiguïté le Temple. « Du Temple » est naturel en français et rend explicite le référent contextuel.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: le lieu très saint
  rationale: Cette expression rend en français accessible la valeur superlative de la construction hébraïque, littéralement « le saint des saints ».
- source_word: תַּחַת
  choice: sous
  rationale: Équivalent spatial direct et naturel.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: les ailes des chérubins
  rationale: « Ailes » rend littéralement כַּנְפֵי, et « chérubins » est le terme français établi pour ces êtres associés au sanctuaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. Employer « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Désignation de la pièce la plus sacrée
  choice: le lieu très saint
  alternative: le Saint des saints
  rationale: Le choix principal communique clairement la valeur superlative de l’hébreu à un lectorat moderne; la note conserve l’idiome traditionnel et la forme plus littérale sans trancher au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsmes. « Temple » clarifie le référent de « Maison », tandis que la note conserve la forme hébraïque; « lieu très saint » privilégie l’intelligibilité tout en signalant l’expression littérale.
