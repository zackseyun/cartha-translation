  text: And all the men of Israel assembled before King Solomon at the festival, in the month of Ethanim, which is the seventh month.
translation:
  language: fr
  text: Tous les hommes d’Israël se rassemblèrent auprès du roi Salomon pendant la fête, au mois d’Éthanim, qui est le septième mois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: tous les hommes d’Israël
  rationale: Reproduit l’expression hébraïque au singulier collectif tout en l’exprimant naturellement en français.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: auprès du roi Salomon
  rationale: La préposition אֶל marque ici le mouvement et le rassemblement vers le roi; «auprès de» est naturel sans introduire l’idée distincte de comparution exprimée par «devant».
- source_word: בֶּחָג
  choice: pour la fête
  rationale: Dans ce contexte cultuel, חַג désigne la fête des Tentes; le texte hébreu dit simplement «la fête», formulation conservée dans le corps du verset.
- source_word: יֶרַח הָאֵתָנִים
  choice: mois d’Étanim
  rationale: Conserve le nom ancien du mois sous une translittération française usuelle.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: le septième mois
  rationale: Traduction directe de l’explication chronologique donnée par le texte.
