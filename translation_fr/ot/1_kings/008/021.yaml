id: 1KI.8.21
reference: 1 Kings 8:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וָ/אָשִׂ֨ם שָׁ֤ם מָקוֹם֙ לָֽ/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֤ר כָּרַת֙ עִם אֲבֹתֵ֔י/נוּ בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: fr
  text: J’y ai aménagé une place pour l’arche, où se trouve l’alliance de Yahweh, celle qu’il a conclue[a] avec nos pères[b] lorsqu’il les a fait sortir du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’il a coupée »; c’est l’expression hébraïque employée pour conclure une alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec nos ancêtres ». L’hébreu dit : « avec nos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: J’y ai aménagé une place
  rationale: Cette formulation française naturelle exprime l’action achevée de mettre ou d’établir là une place, sans reproduire le tour hébreu de façon maladroite.
- source_word: לָאָרוֹן
  choice: pour l’arche
  rationale: Dans ce contexte cultuel, אָרוֹן désigne l’arche; le terme consacré et immédiatement intelligible en français est donc retenu.
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: où se trouve l’alliance de Yahweh
  rationale: Le tour conserve l’affirmation locative du texte hébreu et son identification de ce qui se trouve dans l’arche, sans expliciter qu’il s’agit matériellement des tables de l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כָּרַת
  choice: a conclue
  rationale: En français courant, on « conclut » une alliance; le sens littéral « couper » serait obscur dans le corps du texte, mais il est signalé en note.
- source_word: עִם אֲבֹתֵינוּ
  choice: avec nos pères
  rationale: Le choix conserve la désignation masculine explicite de l’hébreu; « nos ancêtres » reste une possibilité contextuelle indiquée en note.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: lorsqu’il les a fait sortir
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle, tandis que le hifil de יצא exprime le fait de faire sortir.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Cette expression française idiomatique rend précisément la provenance après « faire sortir ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre; « Yahweh » en préserve la fonction et évite de le remplacer silencieusement par un titre.
- issue: Portée de בְּרִית dans l’arche
  choice: où se trouve l’alliance
  alternative: où se trouvent les tables de l’alliance
  rationale: L’hébreu dit bien que « l’alliance » s’y trouve. La traduction ne résout pas la métonymie en ajoutant « les tables », absent de ce verset.
- issue: Référence masculine אֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » correspond directement au masculin hébreu et conserve la formulation historique du texte, tandis que la note présente le sens plus englobant possible.
translation_notes:
  register: Français international moderne, fluide et digne. « J’y ai aménagé une place » évite le calque peu naturel « j’y ai placé une place ». La reprise « celle qu’il a conclue » clarifie sans supprimer le lien syntaxique entre l’alliance, Yahweh et les pères.
