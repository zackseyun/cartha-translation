  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: fr
  text: Que Yahweh notre Dieu soit avec nous, comme il l’a été avec nos pères[a] ! Qu’il ne nous délaisse pas et qu’il ne nous abandonne pas !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nos ancêtres ». L’hébreu dit littéralement « nos pères » et désigne les ancêtres d’Israël.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Que … soit
  rationale: Le jussif qal de היה exprime ici un souhait ou une prière. La tournure « Que … soit » en restitue naturellement la valeur volitive en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: La forme avec suffixe de première personne du pluriel signifie directement « notre Dieu ».
- source_word: עִמָּנוּ
  choice: avec nous
  rationale: La préposition עם exprime ici la présence et l’accompagnement de Dieu auprès de son peuple.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: Le terme introduit une comparaison entre la présence demandée maintenant et celle accordée aux générations antérieures.
- source_word: הָיָה עִם אֲבֹתֵינוּ
  choice: il a été avec nos pères
  rationale: La formulation conserve la préposition « avec » et le terme masculin אבות, tout en employant un passé composé naturel en français moderne.
- source_word: אַל יַעַזְבֵנוּ
  choice: Qu’il ne nous délaisse pas
  rationale: Le jussif négatif formule une supplication. « Délaisser » exprime le fait de laisser sans soutien tout en permettant de distinguer ce verbe du suivant.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: et ne nous abandonne pas
  rationale: Le second jussif négatif prolonge le parallélisme. « Abandonner » rend la notion d’être laissé ou rejeté sans effacer entièrement la nuance entre les deux verbes hébreux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel de Dieu au lieu de lui substituer un titre.
- issue: Traduction de אֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le mot hébreu signifie littéralement « nos pères » et désigne ici les pères d’Israël. La traduction principale conserve cette forme, tandis qu’une note signale l’équivalent contextuel plus général.
- issue: Relation entre les deux verbes négatifs עזב et נטש
  choice: délaisser / abandonner
  alternative: abandonner / rejeter
  rationale: Les verbes ont des sens proches sans être strictement identiques. Deux termes français apparentés mais distincts préservent le parallélisme et sa tension relationnelle sans en faire une simple répétition.
translation_notes:
  register: Français international moderne, digne et adapté à une prière publique. Les deux phrases exclamatives rendent la force des souhaits exprimés par les jussifs, sans alourdir la syntaxe.
