base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: fr
  text: 'Que tes yeux soient ouverts sur cette maison nuit et jour, sur le lieu dont tu as dit : « Mon nom sera là »[a], afin d’entendre la prière que ton serviteur adresse vers ce lieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Mon nom sera là » est une expression liée au temple : elle indique que Dieu a choisi d’associer son nom à ce lieu et suggère sa présence dans le cadre de l’alliance, sans que l’expression se réduise à cette seule explication.'
    reason: Clarification d’un idiome théologique tout en préservant sa formulation et sa portée ouverte dans le texte principal.
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: Que tes yeux soient ouverts
  rationale: L’infinitif avec ל poursuit la demande du contexte avec une valeur de but ou de résultat. La tournure française au subjonctif est naturelle et conserve l’image anthropomorphique de l’hébreu.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: sur cette maison
  rationale: Avec des yeux « ouverts », אֶל indique l’orientation du regard. « Sur » est idiomatique en français, tandis que « maison » conserve le vocabulaire biblique du temple.
- source_word: לַיְלָה וָיוֹם
  choice: nuit et jour
  rationale: Cette expression idiomatique évoque une attention continuelle tout en conservant l’ordre des termes hébreux.
- source_word: אֶל הַמָּקוֹם
  choice: sur le lieu
  rationale: Le second אֶל reprend l’orientation du regard vers l’emplacement choisi. « Lieu » maintient le motif spatial du texte.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: Mon nom sera là
  rationale: La formulation explicite de l’hébreu est conservée sans la réduire à « ma présence » ou « j’habiterai là ».
- source_word: לִשְׁמֹעַ
  choice: afin d’entendre
  rationale: L’infinitif exprime ici le but. « Afin d’entendre » rend clairement ce rapport syntaxique et garde le sens d’une écoute attentive à la prière.
- source_word: אֶל הַתְּפִלָּה
  choice: la prière
  rationale: « Prière » est l’équivalent français courant et suffisamment large de תְּפִלָּה.
- source_word: יִתְפַּלֵּל עַבְדְּךָ
  choice: que ton serviteur fait
  rationale: Dans la proposition relative, l’imparfait hébreu peut couvrir l’action envisagée ou répétée. Cette formulation française évite une temporalité future trop appuyée.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: en se tournant vers ce lieu
  rationale: Avec le verbe « prier », אֶל marque l’orientation de la prière. L’explicitation minimale « en se tournant » rend naturellement en français cette direction sans laisser entendre que le lieu lui-même est le destinataire.
theological_decisions:
- issue: Le langage anthropomorphique des yeux de Dieu
  choice: Conserver « Que tes yeux soient ouverts »
  alternative: « Sois attentif à cette maison » ou « veille sur cette maison »
  rationale: L’image corporelle exprime l’attention divine. La préserver maintient la force poétique et théologique du texte sans la remplacer par une abstraction.
- issue: La portée de « Mon nom sera là »
  choice: Conserver littéralement l’expression dans le texte principal
  alternative: « Ma présence sera là » ou « j’habiterai là »
  rationale: Le langage du nom associe Dieu au lieu qu’il a choisi et suggère sa présence d’alliance, sans permettre de réduire d’emblée l’expression à une seule paraphrase.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu dans la prière. « Maison » et « lieu » préservent les répétitions et le vocabulaire cultuel du texte source.
