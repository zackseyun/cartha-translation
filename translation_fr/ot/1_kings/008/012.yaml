source:
  edition: WLC
  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכֹּ֖ן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: fr
  text: 'Alors Salomon dit : « Yahweh a dit qu’il habiterait dans l’épaisse obscurité[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la nuée sombre ». Le mot hébreu עֲרָפֶל peut désigner une obscurité dense ou une nuée sombre, notamment dans les descriptions de la présence manifeste de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marqueur temporel et narratif naturel en français, qui maintient l’enchaînement du récit.
- source_word: אָמַר
  choice: dit / a dit
  rationale: Rend simplement les deux occurrences du verbe אמר, la seconde introduisant la parole rapportée de Yahweh.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, plutôt que substitution par un titre.
- source_word: לִשְׁכֹּן
  choice: qu’il habiterait
  rationale: Après « a dit », cette formulation idiomatique exprime en français le contenu de la parole ou de l’intention divine porté par l’infinitif avec ל.
- source_word: בָּעֲרָפֶל
  choice: dans l’épaisse obscurité
  rationale: עֲרָפֶל désigne une obscurité dense, parfois conçue comme une nuée sombre dans les récits de manifestation divine. Cette traduction conserve l’image et sa tension théophanique.
theological_decisions:
- issue: La demeure de Yahweh dans עֲרָפֶל
  choice: Yahweh a dit qu’il habiterait dans l’épaisse obscurité
  alternative: Yahweh a dit qu’il habiterait dans la nuée sombre
  rationale: « L’épaisse obscurité » préserve le paradoxe de la présence divine manifestée tout en demeurant voilée, sans réduire l’expression à un simple phénomène météorologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur dans le passé « habiterait » rend idiomatiquement le discours rapporté. Le nom divin est conservé sous la forme « Yahweh ».
