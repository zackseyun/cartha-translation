  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לְבָבָ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ אֹיְבֵי/הֶ֖ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/הַ/בַּ֖יִת אֲשֶׁר בנית לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: fr
  text: et qu’ils reviennent à toi de tout leur cœur et de toute leur âme[a], dans le pays de leurs ennemis qui les ont emmenés en captivité, et qu’ils te prient tournés vers leur pays, que tu as donné à leurs pères, vers la ville que tu as choisie et vers la maison que j’ai bâtie pour ton nom[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retournent vers toi ». Dans ce contexte, l’expression peut aussi évoquer le repentir.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie qu’ils prient tournés vers leur pays, la ville et la maison.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire la maison, ou le temple, consacré à ton nom.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: et qu’ils reviennent à toi
  rationale: Le verbe שׁוּב signifie d’abord « revenir, retourner ». Dans ce contexte d’alliance, il implique aussi le repentir, sans que celui-ci soit explicité à la place de l’image relationnelle et directionnelle du texte.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: de tout leur cœur et de toute leur âme
  rationale: Cette formulation française naturelle conserve les deux images hébraïques et exprime un engagement total.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם
  choice: dans le pays de leurs ennemis
  rationale: « Pays » convient au français courant et maintient le contraste géographique avec « leur pays » dans la suite.
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: qui les ont emmenés en captivité
  rationale: Le verbe שׁבה désigne le fait de prendre quelqu’un comme captif. La formulation retenue exprime clairement l’exil forcé.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: et qu’ils te prient
  rationale: Rendu direct et idiomatique du verbe התפלל construit avec אֶל.
- source_word: דֶּרֶךְ אַרְצָם
  choice: en direction de leur pays
  rationale: Avec un lieu, דֶּרֶךְ indique ici l’orientation physique de la prière. Cette traduction évite de suggérer qu’ils prient seulement au sujet du pays.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: celui que tu as donné à leurs pères
  rationale: Le démonstratif « celui » reprend clairement « pays ». « Leurs pères » conserve l’expression historique et relationnelle du texte hébreu.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: de la ville que tu as choisie
  rationale: La répétition de « en direction de » est naturellement sous-entendue en français, tandis que le choix divin de la ville reste explicite.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: et de la maison que j’ai bâtie pour ton nom
  rationale: « Maison » préserve בַּיִת et sa portée théologique. La première personne correspond à Salomon, qui parle de l’édifice qu’il a construit; « pour ton nom » maintient l’idiome hébreu sans le paraphraser.
theological_decisions:
- issue: Portée de שׁוּב dans le retour vers Dieu
  choice: reviennent à toi
  alternative: se repentent devant toi / retournent vers toi
  rationale: Le contexte implique le repentir, mais le verbe garde une image de retour personnel et d’alliance. La traduction ne réduit donc pas cette tension à un terme doctrinal unique.
- issue: Personne grammaticale dans la mention de la maison
  choice: que j’ai bâtie
  alternative: qu’ils ont bâtie / qui a été bâtie
  rationale: Dans la bouche de Salomon, la lecture à la première personne s’accorde au contexte du discours et conserve le détail textuel au lieu de l’effacer.
- issue: Sens de « pour ton nom »
  choice: idiome conservé dans le texte principal
  alternative: consacrée à ton nom
  rationale: La formulation source est théologiquement riche et ne doit pas être remplacée par une seule explication; une note en éclaire le sens cultuel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe avec « et que » conserve le caractère conditionnel de la prière dans son contexte plus large. Les termes traditionnels « cœur », « âme », « pères », « maison » et « nom » sont maintenus lorsqu’ils portent l’imagerie et les résonances du texte hébreu.
