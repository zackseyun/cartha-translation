base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: fr
  text: car ils entendront parler de ton grand nom, de ta main puissante et de ton bras étendu, et il viendra[a] prier en direction de cette maison —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe du pluriel (« ils entendront ») au singulier (« il viendra prier »), probablement des étrangers en général à un étranger pris individuellement.
    reason: Préserver et expliquer le changement de nombre grammatical dans le texte source.
lexical_decisions:
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison explicative liée à la prière de l’étranger évoquée au verset précédent.
- source_word: יִשְׁמְעוּן אֶת שִׁמְךָ הַגָּדוֹל
  choice: ils entendront parler de ton grand nom
  rationale: Avec שׁמע, « entendre parler de » exprime naturellement en français le fait d’apprendre la renommée de quelqu’un, tout en conservant le terme théologiquement significatif « nom ».
- source_word: יָדְךָ הַחֲזָקָה
  choice: ta main puissante
  rationale: Cette formulation préserve l’image concrète de la puissance agissante de Dieu et reste naturelle en français biblique moderne.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: ton bras étendu
  rationale: La traduction littérale conserve l’image biblique traditionnelle de l’intervention active de Dieu sans la réduire à une abstraction.
- source_word: וּבָא וְהִתְפַּלֵּל
  choice: et il viendra prier
  rationale: Le singulier hébreu est maintenu afin de préserver le passage des étrangers considérés collectivement à l’étranger pris individuellement comme représentant.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: en direction de cette maison
  rationale: Dans ce contexte de prière liée au temple, אֶל indique l’orientation de la prière plutôt qu’une entrée physique dans l’édifice.
theological_decisions:
- issue: Langage anthropomorphique décrivant la puissance de Dieu
  choice: Conserver « main » et « bras » dans le texte principal
  alternative: Paraphraser par « puissance » ou « force »
  rationale: Les images corporelles appartiennent au langage et à la théologie du texte hébreu; les remplacer par des notions abstraites en atténuerait la force littéraire.
- issue: Passage du pluriel au singulier
  choice: Conserver « ils entendront… il viendra »
  alternative: 'Uniformiser au pluriel : « ils entendront… ils viendront prier »'
  rationale: Le texte hébreu passe réellement du pluriel au singulier. La traduction garde cette tension, qui peut faire passer des étrangers en général à l’étranger représentatif.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire concret du texte hébreu est conservé; « en direction de » explicite naturellement l’orientation de la prière. Le tiret final indique que la phrase se poursuit au verset suivant.
