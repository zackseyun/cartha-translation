  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר תִֽהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ/ן אִ֚ישׁ נֶ֣גַע לְבָב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: fr
  text: Toute prière, toute supplication faite par toute personne[a], ou par tout ton peuple Israël, chacun connaissant le mal qui atteint son cœur[b] et étendant les mains vers cette maison[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faite pour toute personne » ; la préposition hébraïque peut ici indiquer l’auteur de la prière ou la personne pour laquelle elle est faite.
    reason: ambiguïté syntaxique
  - marker: b
    text: Littéralement « la plaie de son cœur ».
    reason: alternative lexicale
  - marker: c
    text: Il s’agit du temple, appelé ici « cette maison ».
    reason: note culturelle
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: Toute prière, toute supplication
  rationale: La répétition de כָּל est conservée pour exprimer la portée exhaustive. « Supplication » rend la demande insistante de תְּחִנָּה tout en restant naturelle dans un registre biblique moderne.
- source_word: אֲשֶׁר תִהְיֶה
  choice: faite
  rationale: Le verbe « faire » est implicitement associé à la prière en français. Cette légère explicitation permet une phrase naturelle sans déterminer davantage la valeur de la proposition hébraïque.
- source_word: לְכָל הָאָדָם
  choice: par un homme, quel qu’il soit
  rationale: Cette formulation conserve le singulier représentatif de אָדָם et la portée indéfinie de כָּל. La note maintient l’ambiguïté de la préposition לְ, qui peut aussi se comprendre « pour ».
- source_word: לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: ou par tout ton peuple Israël
  rationale: La formulation garde le parallélisme entre l’individu et le peuple pris collectivement, ainsi que l’expression d’alliance « ton peuple Israël ».
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: chacun connaissant
  rationale: « Chacun » restitue la valeur distributive de אִישׁ au sein du cadre individuel ou collectif; le participe conserve la dépendance syntaxique du verset, qui se poursuit au verset suivant.
- source_word: נֶגַע לְבָבוֹ
  choice: le mal qui frappe son propre cœur
  rationale: נֶגַע évoque littéralement une atteinte, un coup ou une plaie. Cette traduction garde l’image d’un mal qui atteint intérieurement la personne, sans réduire le sens à une maladie physique.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: et tendant les mains
  rationale: La formulation exprime naturellement en français le geste de prière consistant à déployer ou étendre les paumes.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: vers cette maison
  rationale: « Vers » rend l’orientation de la prière, tandis que « maison » conserve le terme hébreu et sa résonance théologique; le référent est explicité en note.
theological_decisions:
- issue: Valeur de הָאָדָם au singulier représentatif
  choice: un homme, quel qu’il soit
  alternative: toute personne
  rationale: Le choix conserve le singulier humain du texte et son caractère représentatif, sans limiter la portée universelle de l’expression.
- issue: Sens métaphorique de נֶגַע לְבָבוֹ
  choice: le mal qui frappe son propre cœur
  alternative: la plaie de son cœur
  rationale: La traduction préserve l’image d’une atteinte intérieure sans décider si elle désigne la conscience du péché, la détresse ou une autre affliction.
- issue: Désignation du sanctuaire par הַבַּיִת
  choice: cette maison
  alternative: ce temple
  rationale: « Maison » respecte la désignation explicite du texte hébreu et sa portée théologique; une note précise le référent culturel.
translation_notes:
  register: Français international moderne, naturel et digne. La structure reste ouverte par une virgule finale, puisque la phrase se poursuit au verset 39. Les répétitions et les images principales de l’hébreu sont conservées, avec des notes lorsque leur traduction exige une explicitation.
