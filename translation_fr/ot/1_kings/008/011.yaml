    issue: Temps de « remplissait »
    rationale: Le parfait hébreu מָלֵא présente la maison comme remplie par la gloire de Yahweh. Dans cette relation explicative, « avait rempli » rend mieux l’action accomplie antérieure à l’incapacité des prêtres, sans imposer une interprétation supplémentaire.
  - severity: low
