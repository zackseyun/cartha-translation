  verdict: revise
  source_fidelity: 'La construction est globalement fidèle : les prêtres sont incapables de se tenir debout afin d’accomplir le service, en raison de la nuée, car la gloire de Yahweh a rempli sa maison. L’imparfait « remplissait » affaiblit toutefois la valeur accomplie du parfait hébreu מָלֵא dans l’explication narrative ; le plus-que-parfait français rend naturellement l’antériorité de l’action par rapport à l’incapacité des prêtres.'
  naturalness: « Assurer le service » est compréhensible, mais « accomplir leur service » est plus idiomatique dans ce contexte cultuel tout en restant sobre et moderne. « Nuée » convient au registre biblique international moderne.
  terminology: « Prêtres », « nuée », « gloire de Yahweh » et « maison de Yahweh » sont appropriés. La répétition du nom divin reflète l’hébreu. La note explicative relative au temple doit être ancrée à « maison », et non au nom divin.
