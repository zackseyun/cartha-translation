    rationale: La note « C’est-à-dire le temple » explique « la maison de Yahweh » ; son appel doit donc suivre « maison » plutôt que « Yahweh ».
  - severity: low
    issue: Formulation de la note a
    rationale: « Se tenir là » ajoute un déictique absent de l’hébreu. Une alternative limitée à « se tenir debout pour servir » préserve mieux le texte source.
