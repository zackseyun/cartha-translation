language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא יָכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמֹ֥ד לְ/שָׁרֵ֖ת מִ/פְּנֵ֥י הֶֽ/עָנָ֑ן כִּי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: fr
  text: Les prêtres ne pouvaient pas se tenir debout pour accomplir leur service[a] à cause de la nuée, car la gloire de Yahweh avait rempli la maison[b] de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se tenir debout pour servir ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: pouvaient
  rationale: Le verbe exprime ici la capacité. Avec la négation, « ne pouvaient pas » rend directement l’incapacité des prêtres.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: C’est le terme français courant et précis pour les ministres sacerdotaux dans ce contexte cultuel.
- source_word: לַעֲמֹד
  choice: se tenir debout
  rationale: Cette expression conserve le sens concret de « se tenir, être debout » sans préciser si les prêtres ne pouvaient pas prendre position ou rester à leur poste.
- source_word: לְשָׁרֵת
  choice: assurer le service
  rationale: Dans le contexte du temple, cette formulation évoque naturellement le service cultuel des prêtres tout en gardant le sens fondamental de « servir ».
- source_word: מִפְּנֵי הֶעָנָן
  choice: à cause de la nuée
  rationale: La locution prépositionnelle indique ici la cause de leur incapacité. « Nuée » convient au registre biblique français et à cette manifestation visible.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit l’explication de l’incapacité des prêtres.
- source_word: מָלֵא
  choice: remplissait
  rationale: L’imparfait présente le remplissage de la maison comme la situation qui explique pourquoi les prêtres ne pouvaient pas y accomplir leur service.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: La traduction conserve l’image théologique de la gloire divine manifestée, sans la réduire par paraphrase à la seule notion de présence.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La formulation littérale préserve le vocabulaire hébreu de la « maison », tout en renvoyant ici au temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre et le distingue d’un titre.
- issue: Sens de כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  alternative: la présence de Yahweh
  rationale: « Gloire » préserve l’image et sa portée théologique sans résoudre l’expression en une interprétation abstraite de la présence divine.
- issue: Désignation du sanctuaire par בֵּית יְהוָה
  choice: la maison de Yahweh
  alternative: le temple de Yahweh
  rationale: « Maison » garde la métaphore hébraïque et sa résonance théologique; une note précise le référent contextuel.
translation_notes:
  register: Français international moderne, digne et accessible. « Nuée » maintient la tonalité biblique sans être obscure; « assurer le service » rend naturellement l’activité officielle des prêtres. La répétition « Yahweh… Yahweh » est conservée comme dans l’hébreu.
