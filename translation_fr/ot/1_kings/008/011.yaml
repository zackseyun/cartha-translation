- from: Les prêtres ne pouvaient pas se tenir debout pour assurer le service[a] à cause de la nuée, car la gloire de Yahweh remplissait la maison de Yahweh[b].
  to: Les prêtres ne pouvaient pas se tenir debout pour accomplir leur service[a] à cause de la nuée, car la gloire de Yahweh avait rempli la maison[b] de Yahweh.
  rationale: La révision rend la valeur accomplie de מָלֵא par « avait rempli », emploie une formulation française plus naturelle pour le service sacerdotal et replace l’appel de note sur le terme qu’elle explique. Elle maintient la littéralité de « maison de Yahweh », la causalité de la nuée et l’imagerie de la gloire divine.
