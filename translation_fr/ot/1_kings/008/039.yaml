  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: fr
  text: Donc, écoute depuis les cieux, le lieu où tu habites; pardonne, agis et rends à chacun selon toutes ses voies, dont tu connais le cœur. Car toi seul connais le cœur de tous les êtres humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les fils de l’être humain », expression hébraïque qui désigne tous les humains.'
    reason: La note conserve la forme masculine et idiomatique de l’hébreu tout en clarifiant sa portée collective.
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: écoute depuis le ciel
  rationale: Dans cette prière, l’imparfait hébreu a une valeur de demande. « Écoute » la rend naturellement en français. Le texte situe l’écoute divine au ciel; « depuis le ciel » exprime clairement ce point d’origine dans le contexte de la réponse de Dieu.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: le lieu où tu habites
  rationale: Cette formulation actuelle et naturelle conserve l’idée d’un lieu établi comme demeure de Dieu.
- source_word: וְסָלַחְתָּ וְעָשִׂיתָ
  choice: Pardonne, agis
  rationale: Les formes verbales poursuivent la série de demandes adressées à Dieu. « Agis » garde la portée volontairement large de עָשָׂה sans préciser indûment la nature de l’intervention.
- source_word: וְנָתַתָּ לָאִישׁ כְּכָל דְּרָכָיו
  choice: rends à chacun selon toutes ses voies
  rationale: « Rends à chacun » exprime ici la rétribution individuelle portée par « donner à l’homme ». « Voies » conserve la métaphore hébraïque de la conduite humaine et sa résonance biblique.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: puisque tu connais son cœur
  rationale: La proposition relie l’action juste de Dieu à sa connaissance du cœur de chacun. « Puisque » rend cette relation clairement sans réduire le cœur à la seule pensée.
- source_word: לְבַדְּךָ
  choice: toi seul
  rationale: Cette expression maintient l’accent sur le caractère exclusif de la connaissance divine des cœurs.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: tous les êtres humains
  rationale: L’expression hébraïque, littéralement « tous les fils de l’être humain », désigne collectivement l’ensemble des humains. La formulation retenue transmet ce sens idiomatique en français moderne, tandis qu’une note conserve la forme de l’expression source.
theological_decisions:
- issue: Portée anthropologique de כָּל בְּנֵי הָאָדָם
  choice: tous les êtres humains
  alternative: tous les fils de l’être humain
  rationale: Dans ce contexte, la tournure masculine hébraïque est collective et inclut l’humanité entière. Une traduction littérale en français serait peu naturelle et pourrait être comprise comme excluant les femmes; la note signale néanmoins l’image originale.
- issue: Connaissance divine du cœur
  choice: Car toi seul, tu connais le cœur
  alternative: car toi seul connais la pensée intérieure
  rationale: '« Cœur » préserve le terme et la tension anthropologique du texte biblique: il désigne l’intériorité humaine, notamment la pensée et la volonté, sans être ramené à une seule faculté.'
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à la prière biblique adressée directement à Dieu. « Voies » conserve une légère couleur biblique, tandis que le reste de la phrase évite les tournures archaïques.
