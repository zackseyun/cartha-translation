  to: Donc, écoute depuis les cieux, le lieu où tu habites; pardonne, agis et rends à chacun selon toutes ses voies, dont tu connais le cœur. Car toi seul connais le cœur de tous les êtres humains[a].
  rationale: La révision rétablit la valeur relative de la proposition portant sur le cœur, sans imposer une relation causale qui n’est pas explicitement formulée dans l’hébreu. Elle allège aussi l’ouverture tout en maintenant la séquence de supplication et le registre biblique moderne.
