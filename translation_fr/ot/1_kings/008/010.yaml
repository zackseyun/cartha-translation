  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: fr
  text: Quand les prêtres sortirent du sanctuaire[a], la nuée remplit la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du lieu saint » ou « de l’espace sacré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Quand … sortirent
  rationale: La construction narrative avec וַיְהִי et l’infinitif construit précédé de בְּ situe l’action dans le temps. « Quand … sortirent » est naturel en français et évite le tour plus lourd « Il arriva que, lorsque… ».
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Traduction directe du nom défini au pluriel.
- source_word: מִן הַקֹּדֶשׁ
  choice: du sanctuaire
  rationale: Dans ce contexte, קֹדֶשׁ désigne l’espace sacré du temple dont les prêtres sortent. « Sanctuaire » est idiomatique et conserve l’ambiguïté sur la délimitation précise de cet espace.
- source_word: וְהֶעָנָן
  choice: la nuée
  rationale: Le nom est défini. « Nuée », terme français courant dans le registre biblique, distingue cette manifestation visible d’un simple nuage météorologique sans expliciter davantage le texte.
- source_word: מָלֵא
  choice: remplit
  rationale: Le qal accompli masculin singulier décrit l’événement principal avec la nuée pour sujet; le passé simple convient au récit français soutenu.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » préserve l’image concrète de בַּיִת plutôt que de l’interpréter directement par « temple ». Le nom divin est translittéré « Yahweh » conformément à sa présence explicite dans l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre; « le SEIGNEUR » refléterait la tradition de lecture, mais non la forme lexicale du texte.
- issue: Nature de la nuée
  choice: Ne pas expliciter son identité dans le corps du texte
  alternative: la nuée de la présence divine; la gloire de Yahweh
  rationale: Le contexte peut associer la nuée à la présence divine, mais ce verset dit seulement qu’elle remplit la maison. La traduction ne doit pas ajouter une identification théologique absente de la proposition.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au récit historique écrit. « Nuée » garde une tonalité biblique intelligible; « maison de Yahweh » préserve la formulation et l’image hébraïques.
