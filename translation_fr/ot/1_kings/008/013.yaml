  text: בָּנֹ֥ה בָנִ֛יתִי בֵּ֥ית זְבֻ֖ל לָ֑/ךְ מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: fr
  text: Oui, j’ai bel et bien bâti pour toi une demeure élevée[a], un lieu établi[b] pour que tu y demeures à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une demeure majestueuse » ou « une maison élevée ». Le mot hébreu désigne une demeure élevée ou exaltée.
    reason: lexical_alternative
  - marker: b
    text: Ou « un lieu fixe » ou « un lieu stable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: Oui, j’ai bâti
  rationale: L’infinitif absolu placé devant le verbe conjugué renforce l’affirmation. « Oui » restitue cette insistance de manière naturelle en français moderne.
- source_word: בֵּית זְבֻל
  choice: une maison majestueuse
  rationale: « Maison » conserve l’image hébraïque plutôt que d’expliciter « temple ». Le nom זְבֻל évoque une demeure élevée ou sublime ; « majestueuse » en exprime ici la dignité sans suggérer uniquement la hauteur physique.
- source_word: לָךְ
  choice: pour toi
  rationale: La préposition indique le bénéficiaire et maintient l’adresse directe à Dieu.
- source_word: מָכוֹן
  choice: un lieu établi
  rationale: Le terme désigne un emplacement fixé, stable ou solidement établi. Cette formulation conserve l’idée de permanence sans anticiper le verbe « habiter » qui suit.
- source_word: לְשִׁבְתְּךָ
  choice: où tu habiteras
  rationale: Le verbe ישׁב peut signifier s’asseoir, demeurer ou habiter. Dans le contexte de la maison, « habiter » est clair et naturel, tout en laissant possible en arrière-plan l’idée d’intronisation.
- source_word: עוֹלָמִים
  choice: pour toujours
  rationale: Cette expression rend naturellement la durée indéfinie et renforcée du pluriel hébreu.
theological_decisions:
- issue: La demeure de Dieu dans le temple pourrait-elle être reformulée pour éviter l’idée d’une résidence locale permanente ?
  choice: Conserver sans atténuation l’affirmation selon laquelle Dieu habitera dans cette maison pour toujours.
  alternative: Paraphraser par « un lieu où ton nom résidera » ou « un lieu où l’on t’adorera ».
  rationale: Le verset parle explicitement d’une maison et d’un lieu où Dieu habitera. Il convient de préserver cette formulation théologique et sa tension, sans lui ajouter ici les précisions apportées par le contexte plus large.
translation_notes:
  register: Français international moderne, digne et accessible. « Majestueuse » évite que « élevée » soit compris seulement au sens architectural ; les variantes plus littérales sont conservées en note. La syntaxe garde le parallélisme entre la maison et le lieu établi.
