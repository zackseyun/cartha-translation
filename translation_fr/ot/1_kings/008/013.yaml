  source_fidelity: La traduction rend correctement l’emphase de l’infinitif absolu, l’adresse à Dieu, l’idée d’une demeure élevée et celle d’un lieu stable. Toutefois, « où tu habiteras » transforme l’infinitif construct עם suffixe (« pour ton habitation / pour que tu y demeures ») en futur indicatif, ajoutant une nuance temporelle que l’hébreu n’exprime pas explicitement.
  naturalness: Le français est globalement naturel et digne. « Pour que tu y demeures à jamais » restitue plus exactement la construction de but tout en restant idiomatique dans un registre biblique moderne.
  terminology: « Demeure élevée » rend plus directement זְבֻל comme substantif désignant une habitation exaltée, sans imposer l’interprétation « temple ». « Lieu établi » rend bien מָכוֹן. « Demeurer » convient au contexte et maintient la portée cultuelle sans surinterprétation.
