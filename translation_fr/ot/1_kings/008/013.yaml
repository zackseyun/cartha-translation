    rationale: לְשִׁבְתְּךָ est un infinitif construct avec suffixe, littéralement « pour ton habitation / pour que tu y demeures », et non un verbe au futur. La formulation actuelle fait de la durée une prédiction future plutôt que d’exprimer la destination ou la fonction du lieu.
