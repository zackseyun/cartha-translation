source:
  edition: WLC
  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: fr
  text: Quand les cieux seront fermés et qu’il n’y aura pas de pluie parce qu’ils auront péché contre toi, ils prieront en direction de ce lieu, célébreront ton nom[a] et se détourneront de leur péché parce que tu les affligeras[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaîtront ton nom » ou « rendront grâce à ton nom ». Le verbe hébreu peut exprimer la louange reconnaissante aussi bien que la reconnaissance ou la confession ouverte.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu les humilieras ». La même forme hébraïque peut aussi être comprise comme « tu leur répondras », mais le contexte de la sécheresse comme discipline favorise ici « tu les affligeras ».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: Quand les cieux seront fermés
  rationale: La préposition בְּ introduit ici une circonstance temporelle, et l’infinitif nifal de עצר exprime la fermeture ou la retenue. « Les cieux » conserve le pluriel hébreu et l’image selon laquelle la pluie est retenue.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: et qu’il n’y aura pas de pluie
  rationale: Cette formulation française naturelle exprime le résultat de la fermeture des cieux et s’accorde avec la perspective future de la prière de Salomon.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: parce qu’ils auront péché contre toi
  rationale: כִּי est causal dans ce contexte, et לָךְ désigne Dieu comme celui contre qui la faute est commise. Le futur antérieur situe le péché avant la sécheresse envisagée.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: s’ils prient en direction de ce lieu
  rationale: אֶל indique ici l’orientation de la prière vers le Temple, et non une prière adressée au lieu lui-même. « En direction de » rend ce rapport sans ambiguïté.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: célèbrent ton nom
  rationale: Au hifil, ידה peut exprimer la louange reconnaissante, la proclamation ou la confession. « Célébrer ton nom » convient au contexte de prière et garde une portée assez large; les autres nuances sont signalées en note.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: et se détournent de leur péché
  rationale: שׁוב avec מִן décrit littéralement le fait de revenir ou de se détourner de quelque chose. Cette traduction rend clairement l’abandon du péché sans remplacer l’image verbale par le terme plus interprétatif « se repentir ».
- source_word: כִּי תַעֲנֵם
  choice: parce que tu les affliges
  rationale: La forme consonantique et vocalisée peut relever du verbe ענה au sens d’affliger ou d’humilier; dans le contexte, la sécheresse constitue une discipline qui conduit au retour. La lecture « tu leur réponds » reste grammaticalement possible et est conservée en note.
theological_decisions:
- issue: Orientation de la prière vers le Temple
  choice: prient en direction de ce lieu
  alternative: prient ce lieu / prient à ce lieu
  rationale: Le lieu est l’orientation de la prière en tant que lieu associé au nom de Dieu; il n’en est pas le destinataire. La formulation évite de suggérer qu’un édifice reçoit lui-même la prière.
- issue: Sens de תַעֲנֵם
  choice: tu les affliges
  alternative: tu leur réponds
  rationale: Les deux analyses sont morphologiquement possibles. Le contexte immédiat relie toutefois la sécheresse au péché et le retour du peuple à l’action divine; la lecture « affliger » rend donc le mieux la logique de la discipline, tout en maintenant l’autre lecture en note.
- issue: Valeur de הוֹדוּ אֶת שְׁמֶךָ
  choice: célèbrent ton nom
  alternative: reconnaissent ton nom / rendent grâce à ton nom
  rationale: Le verbe peut réunir louange, reconnaissance et confession ouverte. « Célèbrent » ne réduit pas le passage à une confession de faute, tandis que la note préserve l’étendue sémantique de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme conditionnel de la prière est conservé, ainsi que la virgule finale indiquant que la phrase se poursuit au verset suivant. « Les cieux » maintient l’image biblique sans rendre l’ensemble archaïque.
