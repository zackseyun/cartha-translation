  text: וְ/שָׁמַעְתָּ֤ הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתְּ/ךָ֔ אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/049.yaml
  text: then hear in heaven[a], the place of your dwelling, their prayer and their plea, and uphold their cause[b],
translation:
  language: fr
  text: alors, écoute dans le ciel[a], le lieu où tu demeures, leur prière et leur supplication, et fais-leur justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis le ciel, le lieu où tu demeures ». L’hébreu peut se comprendre comme désignant le lieu où Dieu entend ou celui d’où il répond; le mot traduit par « lieu » évoque un emplacement établi.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « défends leur cause » ou « rends-leur justice ». Littéralement : « fais leur droit (ou leur jugement) », expression qui signifie agir en faveur de leur cause juridique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: alors, écoute
  rationale: Le qatal avec waw s’inscrit dans la suite de la requête conditionnelle et prend ici une valeur de demande adressée à Dieu. « Alors » exprime naturellement l’enchaînement.
- source_word: הַשָּׁמַיִם
  choice: dans le ciel
  rationale: Le nom pluriel hébreu désigne ici le domaine céleste de Dieu. Aucune préposition équivalant explicitement à « depuis » n’est présente, si bien que « dans le ciel » préserve mieux la formulation.
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: le lieu où tu demeures
  rationale: מָכוֹן évoque un lieu établi ou assigné. Cette formulation française reste naturelle tout en conservant l’idée d’un lieu de demeure.
- source_word: תְּפִלָּתָם
  choice: leur prière
  rationale: Traduction courante de תְּפִלָּה, qui désigne ici la prière en général.
- source_word: תְּחִנָּתָם
  choice: leur supplication
  rationale: תְּחִנָּה désigne une demande instante de faveur ou de grâce. « Supplication » maintient la distinction avec la prière générale.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: et fais-leur justice
  rationale: L’expression idiomatique signifie agir judiciairement en faveur de quelqu’un ou défendre son droit. « Fais-leur justice » en rend clairement la portée juridique.
theological_decisions:
- issue: Langage spatial relatif à la demeure céleste de Dieu
  choice: Conserver « dans le ciel, le lieu où tu demeures »
  alternative: « depuis le ciel, ta demeure »
  rationale: La traduction garde l’image biblique de la demeure céleste sans ajouter que Dieu serait spatialement limité au ciel.
- issue: Portée judiciaire de מִשְׁפָּטָם
  choice: « fais-leur justice »
  alternative: « défends leur cause » ou « prononce leur jugement »
  rationale: Le choix conserve l’idée que Dieu intervient en faveur de leur droit, sans présumer indûment l’issue exacte au-delà de l’idiome hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Supplication » conserve le contraste lexical avec « prière »; les répétitions et l’imagerie céleste du texte sont maintenues sans lourdeur excessive.
