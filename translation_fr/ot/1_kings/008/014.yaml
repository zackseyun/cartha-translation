  text: וַ/יַּסֵּ֤ב הַ/מֶּ֨לֶךְ֙ אֶת פָּנָ֔י/ו וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וְ/כָל קְהַ֥ל יִשְׂרָאֵ֖ל עֹמֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/014.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: fr
  text: Puis le roi se retourna et bénit toute l’assemblée d’Israël[a], tandis que toute l’assemblée d’Israël se tenait debout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la communauté rassemblée d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב אֶת־פָּנָיו
  choice: se retourna
  rationale: L’expression hébraïque signifie littéralement qu’il « tourna son visage ». En français actuel, « se retourna » exprime naturellement le mouvement physique sans produire la tournure maladroite « tourna son visage ».
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Traduction directe et usuelle de ברך, appropriée ici pour la bénédiction publique prononcée par le roi.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: toute l’assemblée d’Israël
  rationale: קהל désigne ici le peuple réuni. « Assemblée » conserve ce sens collectif et concret dans un français moderne, sans la coloration ecclésiale possible de « congrégation ».
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: tandis que toute l’assemblée d’Israël se tenait debout
  rationale: Le participe עֹמֵד décrit la posture continue de l’assemblée au moment de la bénédiction. « Tandis que » rend la valeur circonstancielle, et « se tenait debout » est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « toute l’assemblée d’Israël » est conservée afin de respecter l’insistance et la structure de l’hébreu. L’idiome littéral « tourna son visage » est rendu naturellement par « se retourna ».
