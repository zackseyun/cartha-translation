  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: fr
  text: Écoute la supplication de ton serviteur et de ton peuple Israël lorsqu’ils prieront en direction de ce lieu[a]. Et toi, écoute au ciel, là où tu demeures[b] ; écoute et pardonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers ce lieu ».'
    reason: La préposition hébraïque marque l’orientation vers le temple ; la formulation plus littérale « vers ce lieu » reste possible.
  - marker: b
    text: 'Ou : « dans le lieu où tu demeures, au ciel ».'
    reason: L’hébreu juxtapose « le lieu où tu demeures » et « le ciel » ; cette autre formulation en reproduit plus directement l’ordre.
lexical_decisions:
- source_word: תְּחִנַּת
  choice: supplication
  rationale: Le nom désigne une demande pressante de faveur ou de miséricorde. « Supplication » conserve la force de la requête et convient au registre solennel de la prière sans être obscur.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette adresse royale à Dieu, le terme exprime l’humilité et la soumission de Salomon. « Serviteur » convient mieux au contexte que « esclave ».
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ton peuple Israël
  rationale: Cette formulation directe identifie Israël comme le peuple de Dieu et reproduit naturellement la relation syntaxique de l’hébreu.
- source_word: יִתְפַּלְלוּ
  choice: ils prieront
  rationale: Le hitpael de פלל est le verbe hébreu courant pour prier. Le futur français s’accorde naturellement avec la perspective de la prière de Salomon.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: en direction de ce lieu
  rationale: La préposition אֶל peut marquer la direction. Ici, elle présente le temple comme le point vers lequel la prière est orientée, sans affirmer que les personnes prient nécessairement à l’intérieur du temple.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: là où tu demeures
  rationale: Cette formulation française naturelle rend le sens du groupe construit, « le lieu de ta demeure », tout en évitant une tournure pesante.
- source_word: אֶל הַשָּׁמַיִם
  choice: au ciel
  rationale: Avec le verbe « écouter » et la mention du lieu où Dieu demeure, la préposition directionnelle a ici une valeur locative idiomatique. « Au ciel » garde le lien étroit entre le ciel et la demeure divine.
- source_word: וְשָׁמַעְתָּ / תִּשְׁמַע
  choice: écoute
  rationale: שׁמע désigne ici une écoute attentive qui répond à la prière. L’impératif français exprime naturellement la demande adressée à Dieu et maintient la répétition du texte hébreu.
- source_word: וְסָלָחְתָּ
  choice: pardonne
  rationale: סלח est le verbe habituel du pardon accordé par Dieu. « Pardonne » est clair, direct et adapté au parallélisme avec « écoute ».
theological_decisions:
- issue: Le temple comme orientation de la prière et le ciel comme demeure de Dieu
  choice: La prière est dirigée vers « ce lieu », tandis que Dieu écoute « au ciel, là où [il] demeure ».
  alternative: Traduire comme si les Israélites priaient nécessairement dans le temple, ou comme si Dieu écoutait depuis le temple.
  rationale: Le verset maintient ensemble le rôle du temple terrestre comme point d’orientation de la prière et le ciel comme demeure de Dieu. La traduction préserve cette tension sans assimiler les deux lieux.
- issue: Valeur de l’impératif dans la prière
  choice: « Écoute… écoute et pardonne. »
  alternative: 'Employer le futur déclaratif : « tu écouteras… tu pardonneras ».'
  rationale: Les formes hébraïques se trouvent dans une supplication et ont ici une force de demande. L’impératif français restitue cette fonction sans transformer la demande en simple prédiction.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe traditionnelle de la prière biblique. La répétition d’« écoute » est conservée parce qu’elle structure la supplication hébraïque ; « Et toi » maintient l’emphase explicite du pronom hébreu.
