  text: וַֽ/יַּעְמֹ֕ד וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל ק֥וֹל גָּד֖וֹל לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: fr
  text: 'Puis il se leva et bénit toute l’assemblée d’Israël, d’une voix forte, en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: Puis il se leva
  rationale: Le waw consécutif fait progresser le récit. Dans ce contexte, עמד indique que Salomon se met debout; « se leva » est plus naturel en français que « se tint debout » et s’accorde avec le verset précédent.
- source_word: וַיְבָרֶךְ
  choice: et bénit
  rationale: ברך désigne ici l’action de prononcer une bénédiction sur le peuple rassemblé. « Bénit » reste concis et ne précise pas un mécanisme théologique absent du texte.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: toute l’assemblée d’Israël
  rationale: קהל désigne la communauté réunie. « Assemblée » est actuel, clair et conserve la dimension collective et publique; כָּל est rendu par « toute ».
- source_word: קוֹל גָּדוֹל
  choice: d’une voix forte
  rationale: L’expression signifie littéralement « [d’]une grande voix » et indique ici le volume. « D’une voix forte » est l’expression idiomatique naturelle en français.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: 'L’infinitif introduit les paroles qui suivent. « En disant : » maintient explicitement ce lien formel avec le discours du verset suivant.'
theological_decisions:
- issue: Nature de la bénédiction prononcée sur Israël
  choice: Salomon prononce une bénédiction sur le peuple rassemblé.
  alternative: Comprendre qu’il confère lui-même une grâce divine dans un sens sacramentel ou fortement causatif.
  rationale: Dans ce cadre royal et liturgique, ברך peut désigner la proclamation d’une bénédiction. La traduction conserve « bénit » sans attribuer à Salomon un pouvoir ou un mécanisme que le texte ne précise pas.
translation_notes:
  register: Français international moderne, digne et fluide. La ponctuation prépare directement le discours du verset suivant. Aucune note n’est nécessaire, car « assemblée » et « voix forte » rendent clairement les expressions hébraïques sans perte notable.
