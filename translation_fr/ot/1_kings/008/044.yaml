  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: fr
  text: Lorsque ton peuple partira en guerre contre son ennemi, sur le chemin où tu l’enverras[a], et qu’il priera Yahweh en direction de la ville que tu as choisie et de la maison que j’ai bâtie pour ton nom[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la valeur conditionnelle de l’hébreu : « Si ton peuple part en guerre… » Le mot traduit par « chemin » peut aussi désigner la voie ou la direction d’une campagne.'
    reason: Préserve l’ambiguïté possible de כִּי et explicite sobrement la portée de דֶּרֶךְ, en lien direct avec l’ancre.
  - marker: b
    text: C’est-à-dire le temple ; l’hébreu dit littéralement « la maison ».
    reason: Clarifie le référent de הַבַּיִת sans modifier le terme conservé dans le texte.
lexical_decisions:
- source_word: כִּי יֵצֵא
  choice: Lorsque … partira
  rationale: כִּי introduit ici une situation éventuelle dans la série de requêtes de Salomon. « Lorsque » donne une formulation française naturelle sans lui attribuer une valeur causale.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: עַם désigne ici collectivement Israël comme le peuple appartenant à Dieu. Le singulier collectif est conservé en français.
- source_word: לַמִּלְחָמָה עַל אֹיְבוֹ
  choice: combattre son ennemi
  rationale: Cette formulation idiomatique exprime le départ pour la guerre contre l’ennemi. Le singulier « son ennemi » correspond au suffixe hébreu singulier et s’accorde avec « ton peuple ».
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: en suivant le chemin où tu l’enverras
  rationale: דֶּרֶךְ garde son image concrète de chemin tout en pouvant désigner la voie ou la direction de la campagne prescrite par Dieu. Le pronom collectif français reprend « ton peuple ».
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: et qu’il priera Yahweh
  rationale: התפלל est le verbe courant pour prier. Le singulier collectif français reprend « ton peuple », tandis que le nom divin est translittéré.
- source_word: דֶּרֶךְ הָעִיר
  choice: en direction de la ville
  rationale: Ici דֶּרֶךְ marque l’orientation de la prière plutôt qu’un déplacement sur un chemin.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: la ville que tu as choisie
  rationale: La traduction suit la formulation concise de l’hébreu sans ajouter l’objet ou le but du choix divin.
- source_word: וְהַבַּיִת
  choice: et de la maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici le temple. Garder « maison » préserve l’expression biblique liée au nom de Dieu.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: que j’ai bâtie pour ton nom
  rationale: La formulation conserve l’expression théologiquement chargée « pour ton nom », sans la réduire à la seule idée d’honneur ou de réputation.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Désignation du sanctuaire par הַבַּיִת
  choice: la maison
  alternative: le temple
  rationale: Même si le référent est le temple de Jérusalem, l’hébreu dit « la maison ». Cette traduction préserve l’expression « maison … pour ton nom ».
- issue: Valeur circonstancielle de כִּי
  choice: Lorsque
  alternative: Si
  rationale: Dans la série des éventualités envisagées par la prière, les deux valeurs sont possibles. « Lorsque » convient au déroulement rhétorique, tandis qu’une note signale la valeur conditionnelle possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset reste syntaxiquement ouvert par une virgule, puisqu’il constitue la protase dont la requête principale se poursuit au verset suivant. Le tutoiement correspond à l’adresse directe à Dieu et le singulier collectif est maintenu pour « ton peuple ».
