  naturalness: Le singulier collectif (« ton peuple », « il ») est idiomatique et cohérent. « Partira en guerre contre son ennemi » rend naturellement le contexte militaire sans alourdir le verset. La phrase demeure à juste titre ouverte, car la demande principale suit au verset suivant.
  terminology: « Yahweh », « la ville que tu as choisie », « la maison » et « pour ton nom » sont des choix justes. La note sur « la maison » identifie sobrement le référent sans remplacer dans le texte le terme hébreu.
