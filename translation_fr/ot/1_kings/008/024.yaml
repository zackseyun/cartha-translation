  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣ד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: fr
  text: toi qui as tenu envers ton serviteur David, mon père, ce que tu lui avais dit[a]. Tu as parlé de ta bouche et, de ta main, tu l’as accompli[b], comme on le voit aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que tu avais dit à ton serviteur David, mon père ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Tu as parlé de ta bouche, et de ta main tu as accompli » : image frappante indiquant que Dieu a réalisé ce qu’il avait déclaré.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: as tenu
  rationale: Le verbe שׁמר exprime ici le fait de tenir un engagement. « As tenu » préserve sa distinction avec מִלֵּאתָ, rendu plus loin par « as accompli ».
- source_word: לְעַבְדְּךָ
  choice: envers ton serviteur
  rationale: La préposition ל peut indiquer ce qui est dit ou fait à l’égard de David. « Envers » convient naturellement avec « tenir » tout en conservant la relation personnelle.
- source_word: דָּוִד אָבִי
  choice: David, mon père
  rationale: Cette formulation suit l’ordre hébreu et reste naturelle en français grâce à l’apposition.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: ce que tu lui avais dit
  rationale: « Dit » rend sobrement דבר sans transformer explicitement la parole en promesse. Le plus-que-parfait situe naturellement cette parole avant son accomplissement.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Tu l’avais dit de ta bouche
  rationale: La formulation conserve l’image concrète et le parallélisme entre la bouche qui parle et la main qui accomplit.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: et de ta main tu l’as accompli
  rationale: « Accompli » exprime l’idée de mener la parole à sa pleine réalisation; « de ta main » maintient la métaphore anthropomorphique.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: L’expression hébraïque désigne un accomplissement présent et observable. Cette tournure en transmet le sens idiomatique dans un français actuel.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu (« bouche » et « main »)
  choice: Conserver les images concrètes dans le texte principal.
  alternative: Paraphraser par « tu l’avais promis et tu l’as réalisé ».
  rationale: Le texte hébreu oppose intentionnellement la parole de la bouche à l’action de la main. Garder ces images respecte sa force rhétorique sans chercher à résoudre ou à atténuer son mode de discours sur Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe à Dieu. La syntaxe conserve le parallélisme poétique de l’hébreu tout en évitant une tournure excessivement littérale.
