reference: 1 Kings 8:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י אִם בִּנְ/ךָ֙ הַ/יֹּצֵ֣א מֵ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: fr
  text: 'Cependant, ce n’est pas toi qui bâtiras la maison, mais ton fils, qui sera issu de ton propre corps[a] : c’est lui qui bâtira la maison pour mon nom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui sortira de tes reins », expression désignant ton propre descendant biologique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Cependant
  rationale: Introduit ici une restriction qui nuance l’approbation précédente du projet de David; « Cependant » exprime naturellement cette valeur concessive.
- source_word: לֹא תִבְנֶה
  choice: ce n’est pas toi qui bâtiras
  rationale: Cette tournure française conserve la valeur future de la déclaration divine tout en faisant ressortir le contraste entre David et son fils, sans trancher excessivement entre interdiction et décret.
- source_word: הַבָּיִת
  choice: la maison
  rationale: Le texte hébreu dit littéralement « la maison ». Bien qu’il s’agisse du temple, ce choix préserve l’expression biblique et sa portée théologique.
- source_word: כִּי אִם
  choice: mais
  rationale: Dans la construction « non pas toi, mais ton fils », « mais » rend clairement et naturellement le contraste correctif.
- source_word: בִּנְךָ
  choice: ton fils
  rationale: Le singulier avec suffixe désigne un fils précis dans le contexte, à savoir Salomon.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: celui qui sortira de toi
  rationale: Rend clairement la descendance physique en français moderne, tandis qu’une note conserve l’image littérale des reins.
- source_word: הוּא
  choice: c’est lui
  rationale: 'L’expression restitue l’emphase du pronom indépendant hébreu: ce fils, et non David, bâtira la maison.'
- source_word: יִבְנֶה הַבַּיִת
  choice: bâtira la maison
  rationale: La répétition du verbe et de son complément reproduit celle de l’hébreu et maintient la solennité de la déclaration.
- source_word: לִשְׁמִי
  choice: pour mon nom
  rationale: Préserve l’expression biblique et cultuelle sans l’expliciter par une interprétation telle que « en l’honneur de mon nom ».
theological_decisions:
- issue: Faut-il rendre בַּיִת par « maison » ou l’interpréter comme « temple » ?
  choice: maison
  alternative: temple
  rationale: Le référent est bien le temple, mais l’hébreu emploie « maison »; conserver ce terme respecte l’image et l’expression théologique du texte.
- issue: La négation exprime-t-elle une interdiction ou une prédiction/décision divine ?
  choice: ce n’est pas toi qui bâtiras
  alternative: tu ne dois pas bâtir
  rationale: La formulation retenue préserve la solennité et la valeur future tout en évitant de réduire l’énoncé à un simple commandement.
translation_notes:
  register: Français international moderne, digne et accessible. « Bâtir » convient au registre solennel du contexte sans être archaïque. La structure contrastive et « c’est lui » rendent l’emphase de l’hébreu.
