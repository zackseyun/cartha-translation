source:
  edition: WLC
  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: fr
  text: Il n’y avait dans l’arche que les deux tables de pierre[a] que Moïse y avait déposées à Horeb, où Yahweh avait conclu[b] une alliance avec les Israélites[c] à leur sortie du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les deux tables de la pierre ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le verbe « couper »; dans cette expression, « alliance » est sous-entendu. L’idiome signifie « conclure une alliance ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « les fils d’Israël »; on peut aussi traduire « les enfants d’Israël » ou « le peuple d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Il n’y avait dans l’arche que
  rationale: La négation existentielle suivie de רַק exprime naturellement en français la restriction « ne… que ».
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: les deux tables de pierre
  rationale: « Tables de pierre » est l’expression française traditionnelle et intelligible pour les tables de l’alliance, tout en suivant de près la construction hébraïque.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה
  choice: que Moïse y avait déposées
  rationale: Le plus-que-parfait marque clairement l’antériorité du dépôt par rapport à la description de l’arche; « déposer » rend le causatif de נוח dans ce contexte.
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: Cette tournure locative est idiomatique en français pour le massif ou lieu nommé Horeb.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: où Yahweh avait conclu une alliance avec
  rationale: Le texte sous-entend בְּרִית, « alliance », dans l’expression idiomatique « couper une alliance ». « Conclure une alliance » restitue le sens en français naturel, tandis que « où » rattache l’événement à l’Horeb.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Dans cet emploi collectif, l’expression désigne le peuple d’Israël. « Les Israélites » est précis et naturel en français moderne; la forme littérale est signalée en note.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: à leur sortie du pays d’Égypte
  rationale: Cette formulation concise rend la construction temporelle hébraïque et conserve explicitement le pays d’Égypte comme point de départ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée sans substituer un titre.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  alternative: les fils d’Israël
  rationale: L’expression familiale hébraïque fonctionne ici comme une désignation collective du peuple. Le texte principal privilégie le français courant, et la note conserve la forme littérale.
- issue: Alliance sous-entendue après כָּרַת
  choice: avait conclu une alliance
  alternative: avait coupé
  rationale: En hébreu, le verbe « couper » peut à lui seul évoquer l’expression consacrée « couper une alliance ». Le complément « une alliance » est explicité en français afin de rendre l’idiome sans obscurité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans reproduire ses tournures opaques. Les termes bibliques établis « arche », « tables de pierre » et « alliance » sont conservés.
