  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: fr
  text: Quand ils pécheront contre toi — car il n’y a aucun être humain qui ne pèche — et que tu te mettras en colère contre eux, que tu les livreras à un ennemi et que leurs ravisseurs les emmèneront en captivité dans le pays de l’ennemi, qu’il soit lointain ou proche,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Quand ils pécheront contre toi
  rationale: Dans cette série de situations envisagées par la prière, כִּי introduit un cas éventuel mais attendu. « Quand » garde le mouvement du discours, tandis que « contre toi » exprime naturellement la valeur relationnelle de חטא avec ל.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: il n’y a aucun être humain qui ne pèche
  rationale: אָדָם est ici générique et désigne tout membre de l’humanité. « Être humain » conserve cette portée sans suggérer que l’affirmation ne viserait que les hommes de sexe masculin.
- source_word: וְאָנַפְתָּ בָם
  choice: que tu te mettras en colère contre eux
  rationale: Le verbe exprime l’entrée dans la colère divine; la tournure française suit la progression de la phrase sans en exagérer l’intensité.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: et que tu les livreras à un ennemi
  rationale: « Livrer à » rend idiomatiquement נתן לפני dans un contexte de défaite et de passage sous la puissance ennemie. L’indéfini reflète l’absence d’article sur אוֹיֵב.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: leurs vainqueurs les emmèneront en captivité
  rationale: Le jeu de mots hébreu associe le verbe de capture au participe « ceux qui les capturent ». « Vainqueurs » évite une répétition française pesante, tandis que « en captivité » maintient explicitement l’idée de déportation captive.
- source_word: אֶל אֶרֶץ הָאוֹיֵב
  choice: dans le pays de l’ennemi
  rationale: La formulation conserve l’article défini présent dans l’hébreu et désigne le territoire sous l’autorité de l’ennemi.
- source_word: רְחוֹקָה אוֹ קְרוֹבָה
  choice: qu’il soit lointain ou proche
  rationale: Les adjectifs qualifient « le pays »; le pronom masculin français rend cet accord et la tournure exprime clairement l’alternative.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: être humain
  alternative: homme; personne
  rationale: Le substantif singulier אָדָם a ici une portée universelle. « Être humain » est précis, actuel et inclusif, tout en conservant la référence explicite à l’humanité et l’affirmation théologique universelle du péché.
- issue: Articulation entre le péché, la colère divine et la défaite
  choice: Conserver la chaîne verbale sans expliciter davantage le rapport causal
  alternative: Ajouter « alors » ou « de sorte que »
  rationale: L’hébreu juxtapose les étapes au moyen de וְ. La traduction préserve cette progression et évite d’imposer une analyse théologique plus précise que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La longue période syntaxique et la virgule finale sont conservées parce que le verset fait partie d’une phrase conditionnelle qui se poursuit. Aucun marqueur de note n’est requis.
