source:
  edition: WLC
  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: fr
  text: Béni soit Yahweh, qui a accordé le repos à son peuple Israël, conformément à tout ce qu’il avait dit ! De toutes les bonnes paroles qu’il avait prononcées par l’intermédiaire de Moïse, son serviteur, pas une seule n’est restée sans effet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Pas une seule promesse n’est restée sans accomplissement parmi toutes ses bonnes promesses », car ici « parole » désigne ce que Dieu avait annoncé et promis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Cette formule exclamative et doxologique rend naturellement en français la valeur du prédicat hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé directement par le tétragramme.
- source_word: נָתַן מְנוּחָה
  choice: a accordé le repos
  rationale: L’expression désigne le repos stable accordé après les conflits et l’instabilité, et non seulement une paix intérieure.
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: à son peuple Israël
  rationale: Cette formulation française conserve naturellement le rapport d’apposition et le vocabulaire d’alliance.
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: conformément à tout ce qu’il avait déclaré
  rationale: « Conformément à » exprime le rapport d’accomplissement; le plus-que-parfait situe la parole divine avant l’octroi du repos sans transformer explicitement « parler » en « promettre ».
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: Pas une seule parole n’est restée sans effet
  rationale: 'Cette tournure rend clairement l’idiome hébreu: aucune parole prononcée n’a échoué ni manqué son accomplissement.'
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: parmi toutes les bonnes paroles
  rationale: Le pluriel naturel en français rend la valeur collective du singulier hébreu dans ce contexte, tout en maintenant le lien lexical avec la parole divine.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: Cette formulation actuelle rend l’expression hébraïque d’agence sans reproduire littéralement un idiome peu naturel en français.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Dans cette désignation honorifique de Moïse comme agent mandaté de Dieu, « serviteur » convient mieux que « esclave ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel; sa translittération évite de lui substituer un titre.
- issue: Sens de דָּבָר / דְּבָרוֹ
  choice: parole / paroles
  alternative: promesse / promesses
  rationale: Le contexte implique des promesses accomplies, mais l’hébreu emploie le terme général « parole ». Le texte principal conserve ce lexème et la note signale la nuance de promesse.
translation_notes:
  register: Français international moderne, digne et accessible. La structure doxologique est conservée, tandis que les idiomes hébreux sont rendus dans un français naturel. Le plus-que-parfait clarifie l’antériorité des paroles divines par rapport à leur accomplissement.
