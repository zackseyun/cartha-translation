revisions:
- from: Béni soit Yahweh, qui a accordé le repos à son peuple Israël, conformément à tout ce qu’il avait déclaré ! Pas une seule parole n’est restée sans effet parmi toutes les bonnes paroles qu’il avait prononcées par l’intermédiaire de Moïse, son serviteur.[a]
  to: Béni soit Yahweh, qui a accordé le repos à son peuple Israël, conformément à tout ce qu’il avait dit ! De toutes les bonnes paroles qu’il avait prononcées par l’intermédiaire de Moïse, son serviteur, pas une seule n’est restée sans effet.[a]
  rationale: La révision améliore la syntaxe française et rend plus explicitement la construction « de toutes les bonnes paroles » du texte hébreu, sans modifier le sens. « Dit » remplace « déclaré » afin de conserver le caractère général du verbe hébreu, tandis que la note maintient l’alternative interprétative légitime de « promesse ».
