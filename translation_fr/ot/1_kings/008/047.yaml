  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לִבָּ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שֹֽׁבֵי/הֶם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ וְ/הֶעֱוִ֖ינוּ רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: fr
  text: 'si, dans le pays où ils auront été emmenés captifs, ils rentrent en eux-mêmes, reviennent et te supplient dans le pays de ceux qui les auront emmenés captifs, en disant : « Nous avons péché, nous avons agi injustement, nous avons fait le mal »,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: ils rentrent en eux-mêmes
  rationale: L’expression hébraïque signifie littéralement ramener quelque chose à son cœur et, dans ce contexte, retrouver ses esprits ou prendre conscience de sa faute. « Rentrer en eux-mêmes » conserve l’image intérieure dans un français naturel.
- source_word: וְשָׁבוּ
  choice: reviennent à toi
  rationale: Le verbe שׁוב signifie revenir ou retourner. Le complément « à toi », implicite dans le mouvement de conversion décrit et explicité par la supplication qui suit, donne un français clair sans remplacer le verbe par le terme théologiquement plus interprétatif « se repentir ».
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: te supplient
  rationale: Le hitpael de חנן exprime une demande insistante de faveur ou de grâce adressée à Dieu.
- source_word: חָטָאנוּ וְהֶעֱוִינוּ רָשָׁעְנוּ
  choice: Nous avons péché, nous avons commis des fautes, nous avons agi avec méchanceté
  rationale: 'La triple confession est maintenue avec trois propositions distinctes : manquer/pécher, agir de travers ou commettre l’iniquité, et agir méchamment.'
theological_decisions:
- issue: Sens de וְשָׁבוּ dans un contexte de confession
  choice: reviennent à toi
  alternative: se repentent
  rationale: « Revenir » préserve la métaphore fondamentale de שׁוב et évite de réduire le mouvement décrit à un terme doctrinal unique. L’orientation vers Dieu ressort du contexte immédiat.
translation_notes:
  register: Français moderne, digne et accessible. La structure conditionnelle commencée dans les versets précédents est conservée par « si ». La triple confession garde son rythme solennel sans archaïsmes.
