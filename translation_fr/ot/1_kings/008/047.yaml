  - severity: low
    issue: « commis des fautes » est trop faible pour הֶעֱוִינוּ
    rationale: Le terme désigne une conduite tordue, inique ou injuste, et non de simples erreurs ou fautes. « agi injustement » est plus fidèle et demeure idiomatique.
