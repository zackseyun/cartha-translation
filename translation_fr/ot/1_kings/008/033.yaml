source:
  edition: WLC
  text: בְּֽ/הִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב אֲשֶׁ֣ר יֶחֶטְאוּ לָ֑/ךְ וְ/שָׁ֤בוּ אֵלֶ֨י/ךָ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִֽתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ אֵלֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: fr
  text: Lorsque les Israélites, ton peuple, seront vaincus devant un ennemi parce qu’ils auront péché contre toi, qu’ils reviendront à toi, célébreront ton nom[a], te prieront et t’imploreront dans cette maison,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaîtront ton nom » ou « rendront grâce à ton nom ». Selon le contexte, le verbe hébreu peut exprimer la confession ou la reconnaissance, la louange ou l’action de grâce.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: sera vaincu
  rationale: Le nifal de נָגַף, dans ce contexte militaire, exprime la défaite subie. « Sera vaincu » est naturel en français et conserve la valeur passive.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ton peuple Israël
  rationale: Cette formulation conserve à la fois le possessif d’alliance et l’identification du peuple.
- source_word: לִפְנֵי אוֹיֵב
  choice: devant un ennemi
  rationale: La traduction garde le sens spatial de לִפְנֵי, courant dans les formules de défaite, ainsi que l’indétermination du nom sans article.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: parce qu’il aura péché contre toi
  rationale: Dans le contexte, אֲשֶׁר introduit la cause de la défaite. Le futur antérieur situe naturellement le péché avant celle-ci.
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: s’il revient à toi
  rationale: « Revenir » rend directement שׁוּב sans ajouter explicitement la notion doctrinale plus développée de repentance. La tournure conditionnelle s’accorde avec la structure de la prière, dont la réponse divine apparaît au verset suivant.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: célèbre ton nom
  rationale: Le hifil de ידה peut exprimer la confession, la louange ou l’action de grâce. Avec « ton nom » comme complément, « célébrer » est idiomatique et laisse entendre la reconnaissance publique de Dieu; les autres valeurs sont signalées en note.
- source_word: וְהִתְפַּלְלוּ
  choice: te prie
  rationale: « Prier » est l’équivalent français direct et courant du hitpael de פלל.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: t’implore
  rationale: Le hitpael de חנן désigne une supplication pressante adressée à Dieu. « Implorer » en restitue la force sans ajouter un objet absent du texte.
- source_word: בַּבַּיִת הַזֶּה
  choice: dans cette maison
  rationale: La préposition signifie ici « dans », et « maison » conserve l’appellation hébraïque du sanctuaire sans la remplacer par l’explicitation « temple ».
theological_decisions:
- issue: Portée de שׁוּב dans le mouvement de restauration
  choice: revient à toi
  alternative: se repent et revient à toi
  rationale: Le contexte implique une démarche de repentance, mais le verbe signifie directement « revenir ». La traduction évite donc d’expliciter davantage que le texte.
- issue: Sens de וְהוֹדוּ אֶת שְׁמֶךָ dans un contexte pénitentiel
  choice: célèbre ton nom
  alternative: reconnaît ton nom / rend grâce à ton nom
  rationale: Le contexte de péché et de retour favorise l’idée de reconnaissance de Dieu, tandis que la construction avec « ton nom » peut également exprimer la louange ou l’action de grâce. La note conserve cette pluralité sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier grammatical reprend naturellement « ton peuple », bien que l’hébreu passe du nom collectif singulier à des verbes au pluriel. La phrase reste ouverte par une virgule, puisque la demande de Salomon se poursuit au verset suivant.
