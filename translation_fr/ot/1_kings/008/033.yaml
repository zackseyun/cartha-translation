review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la défaite devant un ennemi, la causalité du péché, le retour vers Dieu, la prière, la supplication et la localisation « dans cette maison ». Toutefois, le texte hébreu emploie des formes verbales au pluriel pour Israël; le passage au singulier dans le français (« il aura péché », « s’il revient », « célèbre », « te prie », « t’implore ») efface cette morphologie et produit une discordance référentielle.
  naturalness: Le français est globalement moderne et digne. La reformulation avec « les Israélites, ton peuple » permet une syntaxe plurielle naturelle, sans recourir à des alternances ambiguës entre le collectif singulier et ses membres.
  terminology: « Célébrer ton nom » est un rendu idiomatique et défendable de וְהוֹדוּ אֶת־שְׁמֶךָ; la note conserve utilement les valeurs de reconnaissance/confession et d’action de grâce. « Implorer » restitue bien la supplication intense, sans ajouter « faveur », absent du texte.
  issues:
  - severity: medium
    issue: Les actions attribuées à Israël sont mises au singulier.
    rationale: 'L’hébreu passe de « ton peuple Israël » à des verbes pluriels: « ils pécheront », « ils reviendront », « ils célébreront », « ils prieront » et « ils supplieront ». Le singulier français du projet est possible avec un collectif dans certains contextes, mais ici la succession « s’il revient, célèbre, te prie » est moins fidèle à la morphologie source et moins nette.'
