  to: Lorsque les Israélites, ton peuple, seront vaincus devant un ennemi parce qu’ils auront péché contre toi, qu’ils reviendront à toi, célébreront ton nom[a], te prieront et t’imploreront dans cette maison,
  rationale: La révision rétablit le pluriel des verbes correspondant aux formes hébraïques et explicite naturellement le référent collectif par « les Israélites, ton peuple ». Elle maintient la phrase ouverte, comme dans la prière qui se poursuit au verset suivant, ainsi que l’ambiguïté lexicale de ידה signalée en note.
