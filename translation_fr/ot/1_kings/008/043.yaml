source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: fr
  text: Écoute depuis le ciel, le lieu où tu demeures, et agis conformément à tout ce que l’étranger te demandera[a], afin que tous les peuples de la terre connaissent ton nom, te craignent comme ton peuple Israël, et sachent que cette maison que j’ai construite porte ton nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour tout ce pour quoi l’étranger fera appel à toi » ou « criera vers toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ton nom est appelé sur cette maison », expression indiquant que cette maison est associée au nom de Dieu.'
    reason: idiom_explanation
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: écoute depuis le ciel
  rationale: Dans cette prière, l’imparfait hébreu a la valeur d’une requête. « Depuis le ciel » exprime naturellement en français le lieu d’où Dieu écoute, précisé aussitôt comme le lieu de sa demeure.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: le lieu où tu demeures
  rationale: Cette formulation actuelle et digne rend le lieu établi de la demeure divine sans raideur littérale.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: et agis conformément à tout ce que
  rationale: « Agis » conserve la portée large du verbe עשה, tandis que « conformément à » rend la relation exprimée par כְּ.
- source_word: יִקְרָא אֵלֶיךָ
  choice: te demandera
  rationale: Dans le contexte d’une prière adressée à Dieu pour obtenir quelque chose, « demander » rend clairement en français l’appel implicite, tandis qu’une note conserve les traductions plus formelles.
- source_word: הַנָּכְרִי
  choice: l’étranger
  rationale: Le terme désigne une personne appartenant à un autre peuple, et non simplement un inconnu.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: tous les peuples de la terre
  rationale: « Peuples » respecte le pluriel עַמִּים et « de la terre » maintient la portée universelle du passage.
- source_word: לְיִרְאָה אֹתְךָ
  choice: te craindront
  rationale: « Craindre » préserve la tension biblique entre crainte, respect et révérence, sans l’atténuer en simple estime.
- source_word: כְּעַמְּךָ יִשְׂרָאֵל
  choice: comme ton peuple Israël
  rationale: La comparaison avec la réponse d’Israël est conservée directement; le verbe « craindre » se comprend pour les deux groupes.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: cette maison […] porte ton nom
  rationale: Cette expression française naturelle communique l’association et l’appartenance exprimées par l’idiome hébreu; la note en donne la forme plus littérale.
theological_decisions:
- issue: La crainte de Dieu exprimée par ירא
  choice: te craindront
  alternative: te révéreront
  rationale: Le choix retenu garde ensemble la révérence, l’émerveillement et la crainte sainte que le verbe peut évoquer, sans résoudre cette richesse théologique.
- issue: L’idiome שִׁמְךָ נִקְרָא עַל
  choice: cette maison porte ton nom
  alternative: ton nom est invoqué sur cette maison
  rationale: L’idiome marque que le temple est associé à Dieu et lui appartient. La formulation principale est intelligible en français moderne, et la note préserve la forme hébraïque ainsi que son ambiguïté possible.
- issue: La portée universelle de la prière
  choice: tous les peuples de la terre
  alternative: toutes les nations de la terre
  rationale: « Peuples » suit le lexème hébreu sans introduire une conception politique moderne de la nation et maintient l’ouverture de la prière aux non-Israélites.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe de prière demeure directe; les termes bibliques « peuples », « nom » et « craindre » sont conservés. Les deux marqueurs de note sont placés immédiatement après les expressions qu’ils expliquent.
