review_pass:
  verdict: revise
  source_fidelity: 'La requête initiale et les verbes au subjonctif sont bien rendus. Cependant, le texte hébreu enchaîne deux finalités sous למען : « afin que tous les peuples ... connaissent ton nom, te craignent ..., et sachent ... ». Le futur indicatif français (« connaîtront », « craindront », « sauront ») affaiblit cette dépendance finale et peut présenter ces résultats comme de simples prédictions. Le rendu de l’idiome final par « porte ton nom » est acceptable et naturel, avec note littérale.'
  naturalness: Le français est globalement naturel, mais « Toi, écoute » est plus marqué que nécessaire en français moderne et « afin que ... connaissent ... craignent ... sachent » produit une phrase de prière plus fluide et plus fidèle à la syntaxe de finalité.
  terminology: '« l’étranger », « tous les peuples de la terre », « ton nom » et « te craignent » conviennent. « porte ton nom » transmet idiomatiquement l’association divine de la maison sans imposer une lecture confessionnelle. La note doit éviter de réduire l’idiome à une appartenance ou consécration exclusive : elle peut signaler l’association de la maison au nom de Dieu.'
  issues:
  - severity: medium
    issue: Les verbes « connaîtront », « craindront » et « sauront » sont à l’indicatif futur.
    rationale: Après למען (« afin que »), les imparfaits expriment le but visé. Le subjonctif français (« connaissent », « te craignent », « sachent ») conserve cette relation syntaxique et pragmatique.
  - severity: low
    issue: La note b interprète l’idiome de manière un peu trop arrêtée par « appartient à Dieu ou qu’elle lui est consacrée ».
    rationale: L’idiome indique que le nom divin est invoqué/appelé sur la maison, donc son association avec Dieu; « appartient » et « consacrée » sont des explications possibles, mais ne doivent pas épuiser le sens.
  revised_text: Écoute depuis le ciel, le lieu où tu demeures, et agis conformément à tout ce que l’étranger te demandera[a], afin que tous les peuples de la terre connaissent ton nom, te craignent comme ton peuple Israël, et sachent que cette maison que j’ai construite porte ton nom[b].
  revised_footnotes:
  - marker: a
    text: 'Ou : « pour tout ce pour quoi l’étranger fera appel à toi » ou « criera vers toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ton nom est appelé sur cette maison », expression indiquant que cette maison est associée au nom de Dieu.'
    reason: idiom_explanation
