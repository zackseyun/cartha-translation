revisions:
- from: Toi, écoute depuis le ciel, le lieu où tu demeures, et agis conformément à tout ce que l’étranger te demandera[a]. Ainsi, tous les peuples de la terre connaîtront ton nom et te craindront comme ton peuple Israël, et ils sauront que cette maison que j’ai construite porte ton nom[b].
  to: Écoute depuis le ciel, le lieu où tu demeures, et agis conformément à tout ce que l’étranger te demandera[a], afin que tous les peuples de la terre connaissent ton nom, te craignent comme ton peuple Israël, et sachent que cette maison que j’ai construite porte ton nom[b].
  rationale: La révision remplace l’indicatif futur par le subjonctif requis par la proposition de but introduite par « afin que ». Elle conserve la requête initiale, la terminologie biblique et le rendu français naturel de l’idiome final, tout en rendant la note moins interprétative.
