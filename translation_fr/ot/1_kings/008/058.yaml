  terminology: La triade « commandements, prescriptions et règles de droit » maintient utilement les trois termes juridiques hébreux sans prétendre fixer des catégories techniques étanches. « Nos pères » respecte le masculin du texte source; la note offre légitimement « nos ancêtres » comme possibilité référentielle.
