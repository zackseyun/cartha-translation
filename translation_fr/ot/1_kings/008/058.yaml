  source_fidelity: 'La structure finale est bien rendue : Dieu incline les cœurs vers lui, avec pour conséquence/finalité de marcher dans toutes ses voies et de garder la triade d’instructions. « Vers lui », « marcher dans toutes ses voies », et la distinction entre commandements, prescriptions et règles de droit sont fidèles au texte hébreu. En revanche, « qu’il a donnés à nos pères » affaiblit le verbe צִוָּה (« il a commandé / prescrit ») en le remplaçant par un simple don.'
