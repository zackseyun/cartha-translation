source:
  edition: WLC
  text: לְ/הַטּ֥וֹת לְבָבֵ֖/נוּ אֵלָ֑י/ו לָ/לֶ֣כֶת בְּ/כָל דְּרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֤י/ו וְ/חֻקָּי/ו֙ וּ/מִשְׁפָּטָ֔י/ו אֲשֶׁ֥ר צִוָּ֖ה אֶת אֲבֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: fr
  text: qu’il incline nos cœurs vers lui, afin que nous marchions dans toutes ses voies et que nous gardions ses commandements, ses prescriptions et ses règles de droit, qu’il a prescrits à nos pères[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ». L’hébreu dit littéralement « nos pères ».
    reason: Alternative lexicale permettant d’expliciter la portée ancestrale du terme tout en conservant sa forme masculine dans le texte.
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: qu’il incline
  rationale: Le hiphil de נטה exprime ici l’action de faire pencher ou de tourner. « Incliner » conserve l’image de l’orientation intérieure tout en restant naturel dans un registre biblique digne.
- source_word: לְבָבֵנוּ
  choice: nos cœurs
  rationale: לֵבָב désigne le centre de la pensée, de la volonté et des affections. Le pluriel français est idiomatique avec « nos » et conserve l’anthropologie imagée de l’hébreu.
- source_word: אֵלָיו
  choice: vers lui
  rationale: La préposition marque une orientation en direction de Dieu ; « vers lui » rend clairement ce mouvement sans ajouter une valeur réflexive absente de la forme hébraïque.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: afin que nous marchions dans toutes ses voies
  rationale: הלך employé avec « voies » décrit métaphoriquement la conduite. « Marcher dans ses voies » préserve cette image biblique et « afin que » explicite naturellement en français le rapport de finalité.
- source_word: וְלִשְׁמֹר
  choice: et que nous gardions
  rationale: שׁמר avec des prescriptions signifie les garder, les observer ou s’y conformer. « Garder » maintient le vocabulaire d’alliance tout en demeurant compréhensible.
- source_word: מִצְוֺתָיו
  choice: ses commandements
  rationale: מִצְוָה désigne ce qui est expressément commandé ; « commandements » en donne l’équivalent précis et traditionnel.
- source_word: וְחֻקָּיו
  choice: ses prescriptions
  rationale: חֹק désigne des dispositions établies ou prescrites. « Prescriptions » distingue ce terme des commandements et des décisions juridiques sans employer un archaïsme.
- source_word: וּמִשְׁפָּטָיו
  choice: ses règles de droit
  rationale: מִשְׁפָּט peut désigner des décisions, dispositions ou normes juridiques. « Règles de droit » fait entendre ici la nuance légale et évite que « jugements » soit compris seulement comme des actes de condamnation.
- source_word: אֲשֶׁר צִוָּה
  choice: qu’il a donnés
  rationale: Avec cette série de dispositions, צוה peut se rendre naturellement par « donner » au sens de prescrire. Le masculin pluriel « donnés » reprend l’ensemble coordonné.
- source_word: אֶת אֲבֹתֵינוּ
  choice: à nos pères
  rationale: אָבוֹתֵינוּ est le terme masculin « nos pères » et renvoie aux devanciers d’Israël. Le texte principal conserve cette forme, tandis que la note signale l’équivalent référentiel plus général.
theological_decisions:
- issue: Articulation entre l’action divine et l’obéissance humaine
  choice: qu’il incline nos cœurs vers lui, afin que nous marchions… et que nous gardions
  alternative: qu’il tourne nos cœurs vers lui pour nous faire marcher… et garder
  rationale: La formulation conserve à la fois l’initiative divine dans l’orientation du cœur et l’appel à la conduite obéissante, sans définir davantage leur rapport théologique.
- issue: Maintien de la triade du vocabulaire de l’alliance
  choice: ses commandements, ses prescriptions et ses règles de droit
  alternative: ses ordres, ses décrets et ses jugements
  rationale: Les trois termes hébreux restent distincts. La formulation retenue exprime leur texture juridique et conventionnelle sans les réduire à un terme générique ni laisser croire à trois catégories techniques parfaitement délimitées.
- issue: Référence ancestrale au masculin
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le texte garde le terme de parenté masculin de l’hébreu. Une note donne « ancêtres » comme traduction possible lorsque l’accent porte sur l’ensemble des générations antérieures d’Israël.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore biblique du cœur, de la marche et des voies est conservée. La phrase garde son caractère syntaxiquement lié au contexte précédent, conformément à l’infinitif hébreu initial.
