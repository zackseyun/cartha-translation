id: 1KI.8.18
reference: 1 Kings 8:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣ד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱטִיבֹ֔תָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: fr
  text: 'Mais Yahvé dit à David, mon père : « Puisque tu avais à cœur de bâtir une maison[a] pour mon nom, tu as bien fait d’avoir cela à cœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un temple ». L’hébreu dit littéralement « une maison ».
    reason: Alternative lexicale précisant le référent contextuel de בַּיִת.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe אמר au wayyiqtol introduit ici les paroles rapportées ; « dit » est la formulation narrative naturelle en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante translittère le nom divin personnel יהוה au lieu de lui substituer un titre.
- source_word: אָבִי
  choice: mon père
  rationale: Le suffixe de première personne du singulier indique que Salomon désigne David comme son père.
- source_word: יַעַן אֲשֶׁר
  choice: puisque
  rationale: Les particules introduisent la raison ; « puisque » rend clairement ce rapport sans alourdir la phrase.
- source_word: הָיָה עִם לְבָבְךָ
  choice: tu avais à cœur
  rationale: Cette tournure française naturelle conserve l’image du cœur tout en exprimant l’intention ou le profond désir.
- source_word: לִבְנוֹת בַּיִת
  choice: bâtir une maison
  rationale: בַּיִת signifie littéralement « maison ». Dans le contexte, il s’agit du Temple, mais « maison » préserve l’expression hébraïque.
- source_word: לִשְׁמִי
  choice: pour mon nom
  rationale: La traduction garde l’expression théologique hébraïque qui associe le sanctuaire au nom de Dieu.
- source_word: הֱטִיבֹתָ
  choice: tu as bien fait
  rationale: Le hiphil de יטב exprime ici l’approbation ; « tu as bien fait » est direct et idiomatique.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: d’avoir cela à cœur
  rationale: Cette formulation reprend délibérément l’image du cœur et rend la proposition qui précise le motif de l’approbation divine.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: Yahweh ; le SEIGNEUR
  rationale: « Yahvé » est une translittération française reconnue du nom personnel divin et évite de remplacer celui-ci par un titre.
- issue: Rendu de בַּיִת dans le contexte du sanctuaire
  choice: maison
  alternative: temple
  rationale: Le mot hébreu signifie « maison » ; conserver ce terme maintient l’idiome du texte, tandis qu’une note explicite son référent contextuel.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « à cœur » reflète la répétition hébraïque tout en restant idiomatique. Le marqueur de note est placé après « maison », le terme auquel la note se rapporte.
