revisions:
- from: Car tu les as mis à part pour toi, afin qu’ils soient ton héritage parmi tous les peuples de la terre, comme tu l’avais déclaré par l’intermédiaire de Moïse, ton serviteur[a], lorsque tu as fait sortir nos pères[b] d’Égypte, Seigneur Yahvé[c].
  to: Car tu les as mis à part pour toi, comme héritage d’entre tous les peuples de la terre, comme tu l’avais déclaré par l’intermédiaire de Moïse, ton serviteur[a], lorsque tu as fait sortir nos pères[b] d’Égypte, Seigneur Yahweh[c].
  rationale: La révision rend explicitement la séparation « d’entre tous les peuples », conserve directement la syntaxe d’appartenance « pour toi, comme héritage », et harmonise la transcription du nom divin avec l’audit. Les ancres et les trois notes restent correctement associées aux expressions qu’elles éclairent.
