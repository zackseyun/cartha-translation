    issue: « parmi tous les peuples » ne rend pas explicitement la séparation exprimée par מִכֹּל.
    rationale: Le préfixe מן marque ici le groupe dont Israël est distingué. « D’entre tous les peuples de la terre » préserve cette relation.
  - severity: low
    issue: « afin qu’ils soient ton héritage » ajoute une proposition finale absente du texte.
    rationale: לְךָ לְנַחֲלָה peut se rendre directement par « pour toi comme héritage », sans modifier le sens en une finalité explicite.
  - severity: medium
    issue: « Yahvé » ne suit pas la décision théologique d’audit fournie pour YHWH.
    rationale: L’audit prescrit « Yahweh » pour le Tétragramme; la graphie doit être harmonisée dans le texte et la note.
