  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: fr
  text: Car tu les as mis à part pour toi, comme héritage d’entre tous les peuples de la terre, comme tu l’avais déclaré par l’intermédiaire de Moïse, ton serviteur[a], lorsque tu as fait sortir nos pères[b] d’Égypte, Seigneur Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de Moïse, ton serviteur ».'
    reason: L’hébreu emploie une expression idiomatique qui présente Moïse comme l’intermédiaire de la parole divine.
  - marker: b
    text: 'Ou : « nos ancêtres ».'
    reason: Le mot hébreu אָבוֹת peut désigner les pères ou, plus largement, les générations précédentes.
  - marker: c
    text: 'Hébreu : « Adonaï YHWH »; autre traduction traditionnelle : « Seigneur DIEU ».'
    reason: La note signale les deux éléments du titre divin et l’autre convention française courante.
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: tu les as mis à part
  rationale: Le hifil de בדל exprime l’action de séparer ou de mettre à part. Cette formulation française est naturelle et conserve l’idée d’une distinction voulue par Dieu.
- source_word: לְךָ לְנַחֲלָה
  choice: pour toi, afin qu’ils soient ton héritage
  rationale: Cette formulation rend à la fois l’appartenance exprimée par לְךָ et la fonction de לְנַחֲלָה, sans donner à entendre qu’Israël serait un héritage reçu d’un tiers.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: parmi tous les peuples de la terre
  rationale: Dans ce contexte, מן marque la séparation d’Israël par rapport à l’ensemble des peuples. « De la terre » conserve la portée universelle de l’expression.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: comme tu l’avais déclaré
  rationale: Le plus-que-parfait explicite naturellement en français que la parole divine précédait l’action évoquée, tandis que « déclaré » garde un registre digne.
- source_word: בְּיַד מֹשֶׁה
  choice: par l’intermédiaire de Moïse
  rationale: L’expression hébraïque signifie littéralement « par la main de Moïse » et désigne ici Moïse comme médiateur de la parole divine.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans ce titre honorifique appliqué à Moïse, « serviteur » convient mieux que « esclave » au contexte.
- source_word: בְּהוֹצִיאֲךָ
  choice: lorsque tu as fait sortir
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle. La construction causative « faire sortir » reflète précisément le sens du verbe.
- source_word: אֶת אֲבֹתֵינוּ
  choice: nos pères
  rationale: La traduction garde l’expression masculine concrète du texte hébreu, qui désigne les générations antérieures d’Israël; « nos ancêtres » demeure possible.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahvé
  rationale: Cette traduction distingue le titre אֲדֹנָי du nom divin יהוה et évite la répétition artificielle « Seigneur SEIGNEUR ».
theological_decisions:
- issue: Israël comme נַחֲלָה de Dieu
  choice: ton héritage
  alternative: ta possession
  rationale: « Héritage » conserve la métaphore d’allotissement et d’appartenance propre au vocabulaire de l’alliance, sans la réduire à la seule idée de propriété.
- issue: Expression du nom divin dans אֲדֹנָי יְהוִה
  choice: Seigneur Yahvé
  alternative: Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre יהוה. « Seigneur Yahvé » représente distinctement les deux éléments; la note indique la forme hébraïque afin de rendre transparente cette décision.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure de la prière adressée directement à Dieu, tout en remplaçant l’idiome hébraïque « par la main de » par son équivalent français naturel.
