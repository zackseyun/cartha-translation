  text: וַֽ/יַּעֲל֞וּ אֶת אֲר֤וֹן יְהוָה֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶֽת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל וַ/יַּעֲל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: fr
  text: Ils montèrent[a] l’arche de Yahweh, la tente de la rencontre et tous les objets sacrés qui se trouvaient dans la tente ; les prêtres et les lévites[b] les montèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « firent monter ». Le verbe hébreu peut désigner le fait d’amener ou de porter vers le haut, notamment dans une procession.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « les prêtres et les lévites ». Certains comprennent cette expression plus précisément comme désignant le sacerdoce lévitique, mais le texte hébreu nomme les deux groupes.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Ils firent monter
  rationale: Le hifil de עלה signifie ici « faire monter » ou « amener en montant ». Cette formulation conserve le mouvement ascendant vers le sanctuaire sans préciser à tort le mode de transport.
- source_word: אֲרוֹן יְהוָה
  choice: l’arche de Yahweh
  rationale: אֲרוֹן désigne ici l’arche sacrée, tandis que le nom divin יְהוָה est rendu par « Yahweh » afin de conserver le nom propre présent dans l’hébreu.
- source_word: אֹהֶל מוֹעֵד
  choice: la tente de la rencontre
  rationale: Cette traduction rend directement les deux éléments de l’expression hébraïque et reste claire en français moderne.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: tous les objets sacrés
  rationale: כְּלֵי est un terme large pouvant désigner des récipients, instruments ou autres objets. « Objets sacrés » préserve cette largeur de sens sans limiter indûment la catégorie.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: qui se trouvaient dans la tente
  rationale: La proposition relative se rattache naturellement aux objets sacrés. « La tente » renvoie sans lourdeur à la tente de la rencontre déjà mentionnée.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: les firent monter
  rationale: La répétition du verbe hébreu est conservée, de même que son sens directionnel.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: les prêtres et les lévites
  rationale: L’hébreu nomme explicitement les deux groupes ; la traduction maintient cette formulation sans les fondre en une seule catégorie.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Rapport entre les prêtres et les lévites dans l’action de transporter
  choice: Maintenir explicitement « les prêtres et les lévites »
  alternative: les prêtres lévitiques
  rationale: La syntaxe hébraïque nomme les deux groupes. Les réunir sous une seule désignation résoudrait une tension que le texte ne tranche pas explicitement.
translation_notes:
  register: Français international actuel, digne et accessible. La ponctuation et la reprise pronominale suivent un ordre naturel en français, tandis que la répétition finale de « firent monter » conserve la structure insistante de l’hébreu.
