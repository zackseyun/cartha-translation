  rationale: La révision remplace une tournure française potentiellement causative et moins naturelle par « montèrent », qui exprime idiomatiquement le transport ascendant dans ce contexte. Elle maintient la répétition du verbe, le caractère non spécifié du sujet initial, le nom Yahweh et la distinction textuelle entre prêtres et lévites. La note lexicale est reformulée en français naturel sans modifier le sens.
