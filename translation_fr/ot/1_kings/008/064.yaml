revisions:
- from: Ce jour-là, le roi consacra le milieu de la cour située devant la maison de Yahweh. C’est là qu’il offrit l’holocauste, l’offrande de céréales et les graisses des sacrifices de paix[a], car l’autel de bronze qui se trouvait devant Yahweh était trop petit pour contenir l’holocauste, l’offrande de céréales et les graisses des sacrifices de paix.
  to: Ce jour-là, le roi consacra le milieu de la cour située devant la maison de Yahweh, car il y offrit l’holocauste, l’offrande de céréales et les parties grasses des sacrifices de paix[a], parce que l’autel de bronze qui se trouvait devant Yahweh était trop petit pour contenir l’holocauste, l’offrande de céréales et les parties grasses des sacrifices de paix.
  rationale: La révision rétablit le premier « car », correspondant au premier כִּי et à sa fonction causale. Elle remplace également « graisses » par « parties grasses » aux deux occurrences pour refléter plus précisément le terme sacrificiel hébreu. La répétition finale, le double motif causal, la spatialité de « devant » et les termes principaux du texte source sont maintenus.
  reviewer_model: gpt-5.6-terra
