  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: fr
  text: Ce jour-là, le roi consacra le milieu de la cour située devant la maison de Yahweh, car il y offrit l’holocauste, l’offrande de céréales et les parties grasses des sacrifices de paix[a], parce que l’autel de bronze qui se trouvait devant Yahweh était trop petit pour contenir l’holocauste, l’offrande de céréales et les parties grasses des sacrifices de paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: consacra
  rationale: Le verbe désigne ici la mise à part d’un espace pour un usage sacré; « consacra » garde ce sens cultuel dans un français naturel.
- source_word: תּוֹךְ הֶחָצֵר
  choice: le milieu de la cour
  rationale: תּוֹךְ indique le milieu ou la partie centrale; « le milieu de la cour » conserve directement cette valeur spatiale.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: devant la maison de Yahweh
  rationale: לִפְנֵי est spatial, et « maison de Yahweh » préserve l’image hébraïque sans la remplacer silencieusement par « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עָשָׂה שָׁם
  choice: c’est là qu’il offrit
  rationale: Dans ce contexte sacrificiel, עָשָׂה signifie accomplir ou offrir les sacrifices; cette formulation est idiomatique en français.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: « Holocauste » est le terme cultuel français courant pour l’offrande entièrement consumée.
- source_word: הַמִּנְחָה
  choice: l’offrande de céréales
  rationale: Dans ce contexte cultuel, מִנְחָה désigne une offrande végétale, généralement céréalière; cette traduction est précise et compréhensible.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: les graisses des sacrifices de paix
  rationale: חֶלְבֵי vise les parties grasses brûlées sur l’autel, tandis que « sacrifices de paix » conserve la désignation traditionnelle de שְׁלָמִים.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: l’autel de bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze; pour cet objet cultuel, « bronze » est le rendu conventionnel et probable.
- source_word: קָטֹן מֵהָכִיל
  choice: était trop petit pour contenir
  rationale: La construction exprime une capacité insuffisante; ce rendu naturel préserve explicitement l’idée de volume.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Sens de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion
  rationale: Les deux rendus reflètent des aspects possibles du terme. « Sacrifices de paix » maintient la désignation traditionnelle sans réduire sa portée à une seule interprétation; une note signale l’autre rendu courant.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du mouvement de l’hébreu tout en évitant les tournures archaïques. L’image « maison de Yahweh » et la répétition finale sont conservées.
