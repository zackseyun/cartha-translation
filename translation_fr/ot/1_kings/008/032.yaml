base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: fr
  text: 'Et toi, écoute depuis le ciel[a], agis et juge tes serviteurs : condamne le méchant en faisant retomber sa conduite sur sa tête[b], et déclare le juste innocent[c] en lui accordant un traitement conforme à sa justice.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « écoute dans le ciel ». L’hébreu porte littéralement « écoute les cieux », formule dans laquelle « les cieux » indique vraisemblablement le lieu de l’écoute divine.'
    reason: lexical_alternative
  - marker: b
    text: « Faire retomber sa conduite sur sa tête » est une expression hébraïque qui signifie rendre à quelqu’un selon sa manière d’agir.
    reason: cultural_note
  - marker: c
    text: 'Autres traductions possibles : « donne raison au juste » ou « reconnais le juste comme tel ». Le verbe appartient ici au langage judiciaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: écoute depuis le ciel
  rationale: Dans cette formule de prière, « depuis le ciel » exprime naturellement en français le lieu d’où Dieu écoute, sans reproduire l’étrange littéralisme « écoute les cieux ».
- source_word: וְעָשִׂיתָ
  choice: interviens
  rationale: Le verbe עשה est très large (« faire, agir »). Dans ce contexte de requête judiciaire, « interviens » rend clairement l’appel à une action divine consécutive à l’écoute.
- source_word: וְשָׁפַטְתָּ אֶת־עֲבָדֶיךָ
  choice: juge tes serviteurs
  rationale: Cette formulation conserve le cadre judiciaire sans anticiper le verdict, précisé ensuite par les deux propositions parallèles.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: condamne le méchant
  rationale: Le hifil de רשע désigne ici l’acte judiciaire de reconnaître coupable et de condamner.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: en faisant retomber sa conduite sur sa propre tête
  rationale: La formulation garde l’image hébraïque de la tête tout en indiquant clairement que la conduite du coupable se retourne contre lui.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: et déclare le juste innocent
  rationale: 'Le hifil de צדק a ici une valeur judiciaire : il s’agit de prononcer un verdict favorable, non de transformer moralement la personne.'
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: en lui accordant ce qui correspond à sa justice
  rationale: Cette expression rend le don ou traitement conforme à la justice du juste, tout en évitant le calque français peu naturel « lui donner selon sa justice ».
theological_decisions:
- issue: Sens judiciaire ou transformateur des verbes רשע et צדק
  choice: Employer « condamne » et « déclare innocent » comme termes de verdict judiciaire.
  alternative: Employer « punis » et « rends juste » ou « justifie ».
  rationale: Le contexte est celui d’une procédure sous serment et d’un jugement entre parties. Les formes causatives décrivent ici la déclaration de culpabilité ou d’innocence; elles n’affirment pas une transformation morale.
- issue: Nature de la rétribution selon la justice
  choice: Conserver la formulation générale « ce qui correspond à sa justice ».
  alternative: Préciser « récompense-le comme le mérite sa justice ».
  rationale: Le texte affirme une correspondance entre le traitement reçu et la justice de la personne, sans employer explicitement le vocabulaire du mérite.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme judiciaire et le parallélisme entre le méchant et le juste sont conservés; les formulations trop littérales ou inutilement confessionnelles sont évitées.
