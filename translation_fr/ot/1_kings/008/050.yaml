source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: fr
  text: Pardonne à ton peuple, qui a péché contre toi, ainsi que toutes les transgressions qu’il a commises contre toi. Accorde-lui de trouver compassion auprès de ceux qui l’ont emmené en captivité, afin qu’ils aient compassion de lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et ils auront compassion de lui » ; la dernière proposition peut exprimer le résultat aussi bien que le but.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: Pardonne
  rationale: Dans le contexte de la prière de Salomon, le parfait qal à la deuxième personne a une valeur de demande. L’impératif français rend naturellement cette fonction.
- source_word: לְעַמְּךָ
  choice: à ton peuple
  rationale: Le complément introduit par ל est conservé, car « pardonner à quelqu’un » est la construction française idiomatique.
- source_word: חָטְאוּ לָךְ
  choice: qui a péché contre toi
  rationale: Avec חטא, ל désigne ici la personne offensée. Le singulier collectif reprend naturellement « ton peuple ».
- source_word: וּלְכָל פִּשְׁעֵיהֶם
  choice: ainsi que toutes les révoltes
  rationale: פשע exprime plus fortement que le simple péché l’idée de rupture, d’insoumission ou de rébellion. « Révoltes » préserve ce relief lexical.
- source_word: אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: qu’il a commises contre toi
  rationale: Cette formulation évite en français la répétition maladroite « révoltes par lesquelles il s’est révolté », tout en gardant Dieu comme personne offensée.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: Fais-lui trouver compassion
  rationale: L’expression נתן + ל + רחמים signifie placer quelqu’un en situation de recevoir de la compassion. Cette tournure française exprime clairement l’action demandée à Dieu.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: auprès de ceux qui l’ont emmené en captivité
  rationale: Le participe désigne ceux qui ont capturé le peuple. La formulation explicite le rapport tout en restant naturelle.
- source_word: וְרִחֲמוּם
  choice: afin qu’ils aient compassion de lui
  rationale: « Afin que » rend la valeur finale probable de la proposition et maintient le lien lexical entre רחמים et רחם. La valeur consécutive reste possible et est signalée en note.
theological_decisions:
- issue: Rapport entre l’action de Dieu et la compassion des ravisseurs
  choice: La prière demande à Dieu de faire trouver au peuple de la compassion auprès de ses ravisseurs, afin qu’ils le traitent avec compassion.
  alternative: 'La dernière proposition peut décrire directement le résultat : « et ils auront compassion de lui » ou « de sorte qu’ils aient compassion de lui ».'
  rationale: La syntaxe hébraïque permet une nuance de but ou de résultat. Le texte principal adopte la valeur finale adaptée au contexte de prière, sans exclure l’autre lecture.
translation_notes:
  register: 'Français moderne, digne et accessible. Le singulier collectif reprend « peuple » tout au long du verset. La répétition « compassion… compassion » est volontaire : elle reflète le jeu lexical hébreu entre רַחֲמִים et רִחֲמוּם.'
