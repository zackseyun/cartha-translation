source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: fr
  text: 'Salomon offrit à Yahweh des sacrifices de paix[a] : 22 000 bovins et 120 000 têtes de petit bétail. Le roi et tous les Israélites[b] consacrèrent la maison de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifices de communion » ou « sacrifices de bien-être ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tous les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: offrit
  rationale: Dans ce contexte sacrificiel, « offrit » exprime naturellement en français l’acte cultuel de sacrifier, sans devoir répéter lourdement « sacrifia un sacrifice ».
- source_word: זֶבַח הַשְּׁלָמִים
  choice: des sacrifices de paix
  rationale: « Sacrifices de paix » conserve le terme cultuel traditionnel tout en restant compréhensible; une note signale les autres nuances possibles de communion et de bien-être.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération « Yahweh » représente directement le nom divin יהוה présent dans le texte hébreu.
- source_word: בָּקָר
  choice: bovins
  rationale: Le nom collectif désigne le gros bétail; « bovins » convient à un dénombrement très élevé sans le limiter aux bœufs mâles ou castrés.
- source_word: צֹאן
  choice: têtes de petit bétail
  rationale: Le collectif peut englober les moutons et les chèvres. « Petit bétail » préserve cette extension mieux que le seul mot « moutons », et « têtes de » rend le dénombrement idiomatique.
- source_word: וַיַּחְנְכוּ
  choice: firent la dédicace
  rationale: Le verbe désigne ici l’inauguration solennelle de l’édifice pour son usage sacré; « firent la dédicace » est précis dans ce contexte.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette formulation conserve l’image explicite de la « maison » dans l’hébreu plutôt que de l’interpréter simplement comme « temple ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Israël », mais fonctionne ici comme une désignation collective du peuple; « les Israélites » est naturel et inclusif en français moderne.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Portée de l’expression בְּנֵי יִשְׂרָאֵל
  choice: tous les Israélites
  alternative: tous les fils d’Israël
  rationale: La tournure masculine hébraïque sert ici d’appellation collective du peuple. La traduction idiomatique évite de suggérer que seuls les hommes sont concernés, tandis que la note conserve la forme littérale.
- issue: Sens cultuel de שְׁלָמִים
  choice: sacrifices de paix
  alternative: sacrifices de communion / sacrifices de bien-être
  rationale: Aucun équivalent français unique ne restitue toutes les associations du terme. Le choix traditionnel « paix » est maintenu sans exclure les nuances de communion et de bien-être, indiquées en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe hébraïque répétitive a été allégée sans omettre l’acte sacrificiel, ses destinataires ni les quantités. Les nombres sont présentés en chiffres pour rendre immédiatement perceptible l’ampleur de l’offrande.
