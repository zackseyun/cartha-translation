id: 1KI.8.1
reference: 1 Kings 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: fr
  text: Alors Salomon convoqua auprès du roi Salomon, à Jérusalem, les anciens d’Israël, tous les chefs des tribus et les responsables des familles ancestrales des fils d’Israël[a], afin de faire monter l’arche de l’alliance de Yahweh depuis la cité de David, c’est-à-dire Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « fils d’Israël » : expression familiale et nationale qui désigne collectivement les Israélites.'
    reason: Précision lexicale sur la portée collective d’une expression hébraïque littéralement masculine.
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: יַקְהֵל
  choice: convoqua
  rationale: Le hiphil de קהל exprime l’action de faire assembler; « convoqua » convient au rassemblement officiel organisé par le roi.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Désignation sociopolitique traditionnelle et précise des dirigeants reconnus d’Israël.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: tous les chefs des tribus
  rationale: Dans ce contexte, מַטּוֹת désigne les tribus plutôt que des bâtons au sens concret.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: les responsables des familles ancestrales
  rationale: נְשִׂיאֵי désigne des dirigeants reconnus, tandis que הָאָבוֹת renvoie ici aux unités familiales ou lignagères. Cette formulation évite l’expression française peu naturelle « maisons des pères ».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Conserve l’expression familiale et nationale explicite de l’hébreu; une note en précise la portée collective.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה יְרוּשָׁלִָם
  choice: auprès de lui, à Jérusalem
  rationale: Dans le contexte d’un rassemblement, אֶל indique le mouvement vers la présence du roi. Le pronom évite en français une répétition pesante de « Salomon » tout en conservant le sens.
- source_word: לְהַעֲלוֹת
  choice: afin de faire monter
  rationale: Préserve à la fois la valeur causative et le mouvement ascendant exprimé par עלה.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: Rend directement la chaîne construite hébraïque et emploie la désignation française traditionnelle de l’arche.
- source_word: מֵעִיר דָּוִד
  choice: depuis la cité de David
  rationale: Rend clairement l’origine du déplacement; « cité » convient à cette désignation historique et géographique.
- source_word: הִיא צִיּוֹן
  choice: c’est-à-dire Sion
  rationale: Exprime naturellement en français l’identification appositive de la cité de David à Sion.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée de l’expression לִבְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël; le peuple d’Israël
  rationale: La traduction conserve la métaphore familiale masculine du texte source sans réduire sa portée collective aux seuls hommes; la note rend cette portée explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la convocation royale tout en réorganisant légèrement les constituants pour éviter la répétition peu naturelle de « Salomon » en français. « Familles ancestrales » explicite la structure sociale visée sans importer une terminologie confessionnelle.
