source:
  edition: WLC
  text: כִּֽי עַמְּ/ךָ֥ וְ/נַחֲלָתְ/ךָ֖ הֵ֑ם אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מִ/מִּצְרַ֔יִם מִ/תּ֖וֹךְ כּ֥וּר הַ/בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: fr
  text: Car ils sont ton peuple et ton héritage[a], eux que tu as fait sortir d’Égypte, du milieu de la fournaise de fer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton bien » ou « ton patrimoine ».
    reason: lexical_alternative
  - marker: b
    text: La « fournaise de fer » est une image de l’Égypte comme lieu d’oppression et de souffrance intenses ; voir Deutéronome 4.20.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la demande de Salomon dans le contexte de la prière.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: Rend directement la désignation relationnelle et collective d’Israël.
- source_word: וְנַחֲלָתְךָ
  choice: et ton héritage
  rationale: Préserve l’image d’un bien attribué à Dieu et la portée d’appartenance liée à l’alliance, tout en laissant en note les autres nuances possibles.
- source_word: הֵם
  choice: ils sont
  rationale: Reproduit la valeur prédicative du pronom hébreu dans une tournure française naturelle.
- source_word: אֲשֶׁר
  choice: eux que
  rationale: Rattache clairement la proposition relative au peuple, constitué de personnes, sans ambiguïté syntaxique.
- source_word: הוֹצֵאתָ
  choice: tu as fait sortir
  rationale: Rend explicitement le causatif du hifil et reprend la formulation traditionnelle et naturelle de l’Exode.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Expression française idiomatique après « faire sortir », fidèle à l’idée d’une sortie hors du pays.
- source_word: מִתּוֹךְ
  choice: du milieu de
  rationale: Conserve l’image spatiale d’une délivrance opérée depuis l’intérieur d’une réalité oppressive.
- source_word: כּוּר הַבַּרְזֶל
  choice: la fournaise de fer
  rationale: Maintient sans l’expliquer dans le corps du texte la métaphore biblique de l’Égypte comme lieu d’oppression intense.
theological_decisions:
- issue: Désignation d’Israël comme la נַחֲלָה de Dieu
  choice: ton héritage
  alternative: ton bien / ton patrimoine
  rationale: « Héritage » conserve le langage d’attribution et d’appartenance propre à l’alliance sans préciser au-delà de ce qu’affirme le texte.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement adressé à Dieu suit la prière du contexte. La répétition et la métaphore concrète de l’hébreu sont conservées.
