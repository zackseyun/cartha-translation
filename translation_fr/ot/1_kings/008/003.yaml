  text: And all the elders of Israel came[b][a], and the priests carried the ark.
translation:
  language: fr
  text: Tous les anciens d’Israël vinrent, et les prêtres portèrent[a] l’arche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « soulevèrent » ou « emportèrent » l’arche.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de l’arche de l’alliance ; cette désignation complète ne figure pas dans ce verset, mais ressort clairement du contexte.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le wayyiqtol de בוא poursuit la narration. « Vinrent » rend simplement le déplacement sans préciser une destination que le verset ne nomme pas.
- source_word: כֹּל
  choice: tous
  rationale: Le terme porte sur l’ensemble des anciens d’Israël ; « tous » est la formulation française directe et naturelle.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: les anciens d’Israël
  rationale: Cette chaîne construite désigne les responsables reconnus d’Israël. « Les anciens d’Israël » est l’expression française usuelle et claire.
- source_word: וַיִּשְׂאוּ
  choice: portèrent
  rationale: Le verbe נשׂא peut signifier « soulever » ou « porter ». Dans le contexte du transport de l’arche, « portèrent » exprime naturellement l’action sans exclure l’idée littérale de la soulever.
- source_word: הַכֹּהֲנִים
  choice: les prêtres
  rationale: Le nom défini au pluriel désigne précisément les prêtres présents.
- source_word: אֶת הָאָרוֹן
  choice: l’arche
  rationale: Le texte dit simplement « l’arche », objet défini et déjà identifiable dans le contexte. Ajouter « de l’alliance » dans le corps du verset expliciterait une information contextuelle qui n’est pas formulée ici.
