  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: fr
  text: Si un homme pèche contre son prochain et qu’un serment[a] lui est imposé pour le faire jurer, et que ce serment vient devant ton autel dans cette maison,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une malédiction » ; le terme hébreu peut désigner le serment lui-même ou la malédiction appelée sur celui qui ne le respecte pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: pèche
  rationale: Le verbe חטא exprime ici une faute commise contre autrui; « pèche » en conserve la portée morale et religieuse.
- source_word: אִישׁ
  choice: un homme
  rationale: L’hébreu emploie un masculin singulier à valeur représentative; la traduction en maintient la forme.
- source_word: לְרֵעֵהוּ
  choice: contre son prochain
  rationale: רֵעַ désigne le prochain, le compagnon ou l’autre membre de la communauté; « son prochain » convient au contexte relationnel et biblique.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: qu’un serment lui est imposé
  rationale: Cette tournure rend la procédure judiciaire par laquelle quelqu’un est placé sous serment, tout en conservant la construction passive et en laissant « serment » au premier plan.
- source_word: לְהַאֲלֹתוֹ
  choice: pour le faire jurer
  rationale: L’infinitif causatif de אלה signifie faire prêter serment à quelqu’un; cette formulation en exprime clairement la valeur causative.
- source_word: וּבָא אָלָה
  choice: et que ce serment vient
  rationale: Le sujet grammatical le plus naturel est אָלָה, « le serment ». « Vient » conserve l’image et la syntaxe de l’hébreu sans transformer le serment en personne accusée.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: devant ton autel
  rationale: Traduction spatiale directe et idiomatique de l’expression hébraïque.
- source_word: בַּבַּיִת הַזֶּה
  choice: dans cette maison
  rationale: בַּיִת signifie littéralement « maison ». Dans le contexte, il s’agit du Temple, mais « maison » préserve le vocabulaire et la résonance théologique de l’hébreu.
theological_decisions:
- issue: Sens de אָלָה dans un contexte judiciaire lié au sanctuaire
  choice: serment
  alternative: malédiction, ou imprécation
  rationale: Le contexte décrit principalement une prestation de serment devant l’autel. Toutefois, אָלָה peut aussi désigner la malédiction invoquée contre celui qui jure faussement; cette nuance est donc conservée dans une note.
translation_notes:
  register: Français international moderne, digne et lisible. La proposition reste ouverte par une virgule, conformément à la syntaxe de la prière qui se poursuit au verset suivant. « Cette maison » est maintenu plutôt que « ce temple » afin de préserver l’image hébraïque.
