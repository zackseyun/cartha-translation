source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: fr
  text: 'Et il dit : « Yahweh, Dieu d’Israël, il n’y a aucun Dieu comme toi, ni dans le ciel là-haut ni sur la terre ici-bas, toi qui maintiens ton alliance et ton amour fidèle[a] envers tes serviteurs qui marchent devant toi de tout leur cœur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu ḥèsèd peut aussi évoquer la bonté constante ou la loyauté envers l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Et il dit
  rationale: Le wayyiqtol poursuit la narration et introduit la prière de Salomon. Le présent de narration français conserve naturellement cette progression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Cette construction à l’état construit forme ici un titre d’adresse clair et naturel.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: il n’y a pas de Dieu comme toi
  rationale: Cette formulation exprime directement l’incomparabilité de Yahweh sans transformer l’énoncé en affirmation plus explicitement polémique sur d’autres dieux.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: ni dans le ciel là-haut ni sur la terre ici-bas
  rationale: La tournure corrélative française exprime idiomatiquement la portée totale du mérisme hébreu. Le singulier « ciel » est naturel en français dans ce contexte.
- source_word: שֹׁמֵר
  choice: toi qui gardes
  rationale: Le participe décrit le caractère durable de Yahweh. La reprise « toi qui » rattache clairement cette caractérisation à l’adresse initiale.
- source_word: הַבְּרִית
  choice: l’alliance
  rationale: L’article défini est conservé, sans identifier plus précisément une alliance que ne le fait le verset.
- source_word: וְהַחֶסֶד
  choice: et l’amour fidèle
  rationale: Dans son association avec l’alliance, חֶסֶד désigne un amour loyal et constant ; « amour fidèle » maintient ensemble l’affection et la fidélité.
- source_word: לַעֲבָדֶיךָ
  choice: envers tes serviteurs
  rationale: « Envers » exprime naturellement la relation de l’alliance et de l’amour fidèle à ceux qui servent Dieu.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: qui marchent devant toi
  rationale: La métaphore hébraïque de la marche est conservée ; elle évoque la conduite vécue dans la présence de Dieu.
- source_word: בְּכָל לִבָּם
  choice: de tout leur cœur
  rationale: Cette expression française idiomatique rend l’engagement intérieur entier et sans partage indiqué par l’hébreu.
theological_decisions:
- issue: Incomparabilité divine dans אֵין כָּמוֹךָ אֱלֹהִים
  choice: il n’y a pas de Dieu comme toi
  alternative: nul n’est comme toi parmi les dieux
  rationale: Le choix suit la lecture contextuelle la plus directe d’אֱלֹהִים comme « Dieu », tout en laissant l’affirmation porter sur l’incomparabilité de Yahweh sans ajouter une formulation absente du texte.
- issue: Portée de חֶסֶד dans un contexte d’alliance
  choice: l’amour fidèle
  alternative: la fidélité bienveillante
  rationale: « Amour fidèle » préserve la tension entre attachement, bonté et loyauté d’alliance, sans réduire le terme à la seule émotion ni à la seule obligation.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent narratif « il dit » est naturel dans le récit biblique français. La métaphore « marchent devant toi » et le parallélisme spatial sont conservés sans lourdeur archaïque.
