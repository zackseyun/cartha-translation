  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֤ת יִשְׂרָאֵל֙ הַ/נּוֹעָדִ֣ים עָלָ֔י/ו אִתּ֖/וֹ לִ/פְנֵ֣י הָֽ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: fr
  text: Le roi Salomon se tenait devant l’arche avec toute l’assemblée d’Israël réunie auprès de lui. Ils offraient en sacrifice du petit et du gros bétail qu’on ne pouvait ni compter ni dénombrer, tant il y en avait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲדַת
  choice: assemblée
  rationale: « Assemblée » désigne naturellement le corps national réuni dans ce cadre public et cultuel, sans connotation ecclésiale ajoutée.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: réunie auprès de lui
  rationale: Le participe niphal exprime le rassemblement de l’assemblée en relation avec Salomon. « Auprès de lui » conserve cette relation sans imposer une orientation spatiale trop précise.
- source_word: אִתּוֹ
  choice: se tenaient avec lui
  rationale: La proposition hébraïque est sans verbe exprimé. Cette formulation française explicite sobrement la présence conjointe du roi et de l’assemblée devant l’arche.
- source_word: לִפְנֵי הָאָרוֹן
  choice: devant l’arche
  rationale: Équivalent français naturel de l’expression spatiale et cultuelle, sans développer « arche » en « arche de l’alliance ».
- source_word: מְזַבְּחִים
  choice: offraient en sacrifice
  rationale: Le participe indique une action en cours; cette expression rend clairement la portée rituelle du verbe.
- source_word: צֹאן וּבָקָר
  choice: du petit et du gros bétail
  rationale: Ces termes désignent deux catégories de bétail, et non uniquement des moutons et des bovins; le rendu français reste précis et idiomatique dans un contexte sacrificiel.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: qu’on ne pouvait ni compter ni dénombrer
  rationale: Le doublet verbal hébreu est conservé afin de rendre son effet d’intensification.
- source_word: מֵרֹב
  choice: tant il y en avait
  rationale: Cette tournure française exprime naturellement que l’abondance des animaux empêchait de les compter.
theological_decisions:
- issue: Désignation de l’arche
  choice: l’arche
  alternative: l’arche de l’alliance
  rationale: Le texte hébreu porte seulement « l’arche ». L’expansion « de l’alliance » importerait une précision contextuelle absente de ce verset.
- issue: Relation de l’assemblée à Salomon
  choice: réunie auprès de lui
  alternative: réunie devant lui
  rationale: La préposition עָלָיו marque ici une relation de rassemblement autour du roi, mais sa nuance exacte demeure souple. « Auprès de lui » évite de trancher inutilement en faveur d’une position strictement frontale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe hébraïque très coordonnée est répartie en deux phrases pour assurer une lecture naturelle, tout en conservant la présence commune de Salomon et de l’assemblée devant l’arche ainsi que le doublet « compter/dénombrer ».
