revisions:
- from: Le roi Salomon et toute l’assemblée d’Israël, réunie auprès de lui, se tenaient avec lui devant l’arche. Ils offraient en sacrifice du petit et du gros bétail qu’on ne pouvait ni compter ni dénombrer, tant il y en avait.
  to: Le roi Salomon se tenait devant l’arche avec toute l’assemblée d’Israël réunie auprès de lui. Ils offraient en sacrifice du petit et du gros bétail qu’on ne pouvait ni compter ni dénombrer, tant il y en avait.
  rationale: La réorganisation place explicitement l’assemblée avec Salomon devant l’arche et évite que Salomon soit présenté comme se tenant « avec lui-même ». Elle conserve la nuance prudente de « réunie auprès de lui », le caractère progressif de l’action sacrificielle et le doublet hébraïque « compter / dénombrer ».
