    rationale: Le texte porte עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל, « tes serviteurs et ton peuple, Israël ». La virgule seule fait de « ton peuple Israël » une apposition à « tes serviteurs », ce qui modifie la syntaxe source.
  - severity: medium
    issue: « À ton pays » affaiblit le sens spatial et lexical de la demande de pluie.
    rationale: עַל אַרְצְךָ signifie « sur ta terre ». « Pays » peut aussi évoquer un État moderne, tandis que « terre » rend le don territorial hébreu et la préposition « sur » convient à la pluie.
  - severity: medium
    issue: La note a donne comme alternative la formulation désormais préférable.
    rationale: Une fois « depuis le ciel » retenu dans le texte, la note doit présenter « dans le ciel » comme variante.
  - severity: low
    issue: « Tu leur enseigneras » est une restitution française moins naturelle de la relation causale possible de כִּי.
    rationale: Le présent « car tu leur enseignes » exprime naturellement la valeur causale sans imposer une séquence future. La lecture temporelle reste signalée en note.
  revised_text: Alors, écoute depuis le ciel[a] et pardonne le péché de tes serviteurs et de ton peuple, Israël, car tu leur enseignes le bon chemin qu’ils doivent suivre[b]. Accorde la pluie sur ta terre, que tu as donnée à ton peuple comme héritage.
  revised_footnotes:
