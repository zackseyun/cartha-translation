  to: Alors, écoute depuis le ciel[a] et pardonne le péché de tes serviteurs et de ton peuple, Israël, car tu leur enseignes le bon chemin qu’ils doivent suivre[b]. Accorde la pluie sur ta terre, que tu as donnée à ton peuple comme héritage.
