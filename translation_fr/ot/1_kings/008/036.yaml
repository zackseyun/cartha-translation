  verdict: revise
  source_fidelity: 'Révision nécessaire : le texte hébreu coordonne « tes serviteurs » et « ton peuple, Israël » ; la formulation proposée les assimilait par apposition et omettait ainsi la conjonction. « Ta terre » et « sur ta terre » rendent plus exactement אַרְצְךָ et עַל. La requête est conservée par des impératifs français naturels.'
  naturalness: « Écoute depuis le ciel » est plus idiomatique et plus clair en français moderne que « écoute dans le ciel ». Le présent dans « car tu leur enseignes » évite un futur français qui pouvait indûment présenter l’enseignement comme un événement simplement à venir.
  terminology: « Serviteurs », « peuple, Israël », « bon chemin », « pluie », « terre » et « héritage » conservent les termes relationnels et territoriaux du texte sans surcharge doctrinale.
  issues:
