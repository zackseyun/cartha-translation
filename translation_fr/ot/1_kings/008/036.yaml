source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/סָ֨לַחְתָּ֜ לְ/חַטַּ֤את עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל כִּ֥י תוֹרֵ֛/ם אֶת הַ/דֶּ֥רֶךְ הַ/טּוֹבָ֖ה אֲשֶׁ֣ר יֵֽלְכוּ בָ֑/הּ וְ/נָתַתָּ֤ה מָטָר֙ עַל אַרְצְ/ךָ֔ אֲשֶׁר נָתַ֥תָּה לְ/עַמְּ/ךָ֖ לְ/נַחֲלָֽה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: fr
  text: Alors, écoute depuis le ciel[a] et pardonne le péché de tes serviteurs et de ton peuple, Israël, car tu leur enseignes le bon chemin qu’ils doivent suivre[b]. Accorde la pluie sur ta terre, que tu as donnée à ton peuple comme héritage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « écoute dans le ciel ». L’expression hébraïque est littéralement « écoute le ciel/les cieux » ; le français doit suppléer une préposition.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « quand tu leur enseigneras le bon chemin qu’ils doivent suivre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: écoute dans le ciel
  rationale: La construction hébraïque dit littéralement « écoute le ciel/les cieux » sans préposition. Le français doit en suppléer une ; « dans le ciel » conserve l’idée du lieu où Dieu écoute, tandis que la note signale l’autre compréhension naturelle.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: pardonne le péché
  rationale: Dans ce contexte de prière et de retour à Dieu, חַטָּאת désigne la faute dont le peuple demande le pardon, non un sacrifice pour le péché.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: tes serviteurs, ton peuple Israël
  rationale: « Serviteurs » convient à des personnes placées sous l’autorité de Dieu. La juxtaposition garde l’apposition qui identifie ces serviteurs comme le peuple d’Israël.
- source_word: כִּי תוֹרֵם
  choice: car tu leur enseigneras
  rationale: כִּי peut ici être causal ou circonstanciel. Le choix principal retient sa valeur causale courante sans transformer l’enseignement divin en un impératif absent de l’hébreu ; la note conserve l’autre lecture possible.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: le bon chemin qu’ils doivent suivre
  rationale: « Bon chemin » préserve la métaphore de la conduite, tandis que « suivre » est plus naturel en français moderne que « marcher dans » pour parler d’un chemin.
- source_word: וְנָתַתָּה מָטָר
  choice: Accorde aussi la pluie
  rationale: L’impératif français rend naturellement la valeur de requête des formes verbales dans cette prière. « Accorder » exprime le don demandé sans suggérer un mécanisme absent du texte.
- source_word: עַל אַרְצְךָ
  choice: à ton pays
  rationale: 'Le possessif de deuxième personne est maintenu : le pays appartient à Dieu, même s’il l’a donné à son peuple.'
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: que tu as donné en héritage à ton peuple
  rationale: « Héritage » rend la valeur foncière et durable de נַחֲלָה dans le cadre du don du pays à Israël.
theological_decisions:
- issue: Propriété divine et don du pays
  choice: ton pays, que tu as donné en héritage à ton peuple
  alternative: le pays que tu as donné en héritage à ton peuple
  rationale: Le texte appelle explicitement le territoire « ton pays » en s’adressant à Dieu, puis affirme qu’il l’a donné à son peuple. Maintenir les deux propositions préserve la tension entre propriété divine et héritage d’Israël.
- issue: Rapport entre le pardon et l’enseignement divin
  choice: car tu leur enseigneras
  alternative: quand tu leur enseigneras
  rationale: La conjonction כִּי permet les deux rapports. La traduction principale adopte la valeur causale courante, tandis que la note préserve la lecture circonstancielle sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs gardent le ton de supplication de la prière. La métaphore du chemin est conservée, mais formulée idiomatiquement avec « suivre ».
