  source_fidelity: 'Le sens est globalement fidèle : la requête porte sur l’écoute de la prière et de la supplication, suivie de l’exercice de la justice en leur faveur. Toutefois, en français, « écoute dans le ciel leur prière » est syntaxiquement maladroit et peut laisser entendre que la prière se trouve dans le ciel. Le complément hébreu « les cieux » désigne le lieu d’où Dieu entend ; « depuis le ciel » rend ce sens avec clarté sans trancher au-delà du texte.'
  naturalness: « Depuis le ciel, écoute leur prière » est une formulation française moderne, sobre et naturelle dans le registre de prière. « Rends-leur justice » est plus idiomatique et précis que « fais-leur justice », tout en conservant la portée judiciaire de l’expression hébraïque.
  terminology: « Prière » et « supplication » rendent bien la distinction entre תְּפִלָּה et תְּחִנָּה. « Rends-leur justice » préserve l’ambiguïté utile entre faire droit à leur cause et les justifier/vindiquer, sans import doctrinal.
