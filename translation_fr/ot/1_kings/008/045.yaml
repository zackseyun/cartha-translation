    rationale: Dans « écoute dans le ciel leur prière », le groupe prépositionnel est peu naturel en français et son rattachement est ambigu. Le contexte et la formule hébraïque indiquent le lieu d’où Dieu entend ; « depuis le ciel » l’exprime naturellement.
  - severity: low
    issue: « Fais-leur justice »
    rationale: La formulation est compréhensible, mais « rends-leur justice » est l’expression française usuelle pour l’exercice de la justice en faveur de quelqu’un et restitue mieux l’idiome משפט.
  - severity: low
    issue: Note a incohérente avec la formulation proposée
    rationale: La note présente « depuis le ciel » comme une possibilité alors que cette formulation est nécessaire pour une expression française claire ; elle doit être limitée à l’information sur le pluriel littéral hébreu.
