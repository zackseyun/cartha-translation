  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
translation:
  language: fr
  text: alors, depuis le ciel, écoute leur prière et leur supplication, et rends-leur justice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « défends leur cause » ou « maintiens leur droit ». L’hébreu dit littéralement : « fais leur justice/jugement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: alors, écoute
  rationale: Le parfait qal à la 2e personne du masculin singulier prend ici, dans la prière adressée à Dieu, une valeur de requête. « Alors » exprime naturellement la conséquence des conditions énoncées auparavant.
- source_word: הַשָּׁמַיִם
  choice: dans le ciel
  rationale: La forme hébraïque signifie littéralement « les cieux » et fonctionne ici comme indication de lieu, sans préposition exprimée. « Dans le ciel » restitue naturellement en français cette formule de prière sans ajouter explicitement l’idée de provenance.
- source_word: תְּפִלָּתָם
  choice: leur prière
  rationale: תְּפִלָּה est le terme général désignant la prière. Le singulier muni d’un suffixe pluriel se rend naturellement par le collectif « leur prière ».
- source_word: תְּחִנָּתָם
  choice: leur supplication
  rationale: תְּחִנָּה désigne une demande pressante de faveur ou de grâce. « Supplication » conserve cette intensité et reste distinct de « prière ».
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: et fais-leur justice
  rationale: Littéralement, l’expression signifie « faire leur jugement/justice ». « Fais-leur justice » est idiomatique en français et conserve le sens judiciaire d’une intervention de Dieu en leur faveur.
theological_decisions:
- issue: Sens de l’expression judiciaire dans la requête adressée à Dieu
  choice: '« fais-leur justice » : demande que Dieu rende justice à son peuple et intervienne en sa faveur'
  alternative: « défends leur cause » ou « maintiens leur droit »
  rationale: L’expression עשה משפט peut désigner l’exercice de la justice en faveur de quelqu’un. La formulation retenue préserve la portée judiciaire sans préciser indûment la forme que doit prendre cette intervention.
translation_notes:
  register: Français international moderne, sobre et digne. « Supplication » maintient la distinction avec la prière générale, tandis que « fais-leur justice » rend clairement l’idiome judiciaire hébreu.
