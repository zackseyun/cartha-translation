source:
  edition: WLC
  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: fr
  text: S’il y a dans le pays une famine ou une épidémie, si les cultures se flétrissent ou jaunissent, s’il y a des sauterelles ou des insectes dévorants[a], si son ennemi l’assiège dans ses villes[b], tout fléau, toute maladie—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne un insecte qui dévore les cultures ; il peut s’agir d’une espèce ou d’un stade particulier de sauterelle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans le pays de ses portes » ; les « portes » désignent les villes du pays.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: famine
  rationale: Dans cette liste de désastres touchant tout le pays, le terme désigne une famine plutôt qu’une faim individuelle.
- source_word: דֶּבֶר
  choice: épidémie
  rationale: Le mot désigne une maladie contagieuse frappant collectivement; « épidémie » est actuel et le distingue du terme plus général נֶגַע plus loin.
- source_word: שִׁדָּפוֹן
  choice: les cultures se flétrissent
  rationale: Le terme évoque des cultures desséchées ou ravagées, notamment par un vent brûlant; cette formulation intelligible conserve l’image d’un dommage agricole sans préciser abusivement sa cause.
- source_word: יֵרָקוֹן
  choice: les cultures […] jaunissent
  rationale: Dans ce contexte agricole, le terme évoque le jaunissement ou dépérissement des plantes. La formulation descriptive évite le terme technique et aujourd’hui peu transparent « nielle ».
- source_word: אַרְבֶּה
  choice: sauterelles
  rationale: Terme hébreu courant pour la sauterelle migratrice, employé ici collectivement.
- source_word: חָסִיל
  choice: insectes dévorants
  rationale: Il s’agit d’un insecte ravageur qui dévore les cultures, mais son identification précise est incertaine; la note conserve l’hypothèse d’une espèce ou d’un stade de sauterelle.
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: si l’ennemi assiège le peuple
  rationale: Le verbe à la forme causative exprime l’action de cerner ou d’assiéger. Le singulier hébreu reprend collectivement Israël; « le peuple » explicite sobrement ce référent en français.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: dans le pays, aux portes de ses villes
  rationale: La traduction garde l’image des portes tout en indiquant naturellement qu’il s’agit des portes des villes du pays.
- source_word: כָּל נֶגַע
  choice: quel que soit le fléau
  rationale: נֶגַע est un terme large pouvant désigner un coup, une atteinte ou un fléau; « quel que soit » restitue la portée générale de כָּל.
- source_word: כָּל מַחֲלָה
  choice: ou la maladie
  rationale: Le terme désigne généralement la maladie; coordonné à « fléau », il clôt la liste sans confondre les deux notions.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La longue énumération et le tiret final conservent le caractère inachevé de la phrase, qui se poursuit au verset suivant. Les termes agricoles sont rendus de façon descriptive afin d’éviter des appellations anciennes ou excessivement précises.
