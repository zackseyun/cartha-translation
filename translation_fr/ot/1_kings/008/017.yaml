source:
  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣ד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: fr
  text: David, mon père, avait à cœur de bâtir une maison pour le nom de Yahweh[a], le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de bâtir un temple pour le nom de Yahweh ». L’hébreu dit littéralement « de bâtir une maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: avait à cœur
  rationale: La tournure hébraïque indique qu’un projet ou un désir était présent dans le cœur de David. « Avait à cœur » est naturel en français moderne tout en conservant l’image du cœur, sans réduire le sens à une simple décision.
- source_word: דָּוִד אָבִי
  choice: David, mon père
  rationale: Cette formulation suit l’ordre hébreu et reste idiomatique en français grâce à l’apposition.
- source_word: לִבְנוֹת
  choice: de bâtir
  rationale: « Bâtir » convient au contexte d’un édifice sacré et rend simplement le verbe בנה.
- source_word: בַּיִת
  choice: une maison
  rationale: Le texte hébreu dit littéralement « maison ». Ce choix préserve l’image théologique du sanctuaire comme maison de Dieu; « temple » demeure une explicitation possible.
- source_word: לְשֵׁם
  choice: pour le nom de
  rationale: La traduction conserve la formulation biblique et son ambiguïté suggestive, sans la réduire à « en l’honneur de » ni préciser davantage la relation entre le nom et le sanctuaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette expression française naturelle rend le syntagme construit et identifie Yahweh comme le Dieu d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » préserve le nom propre au lieu de le remplacer par un titre liturgique traditionnel.
- issue: Sens de בַּיִת dans le contexte du sanctuaire
  choice: une maison
  alternative: un temple
  rationale: « Maison » est le sens lexical direct et maintient l’image voulue par l’hébreu, tandis que « temple » explicite correctement le référent mais interprète davantage.
- issue: Expression לְשֵׁם יְהוָה
  choice: pour le nom de Yahweh
  alternative: en l’honneur de Yahweh
  rationale: La formulation littérale conserve la portée théologique du « nom » — identité, renommée et présence reconnue — sans choisir entre ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. « Avait à cœur » exprime naturellement l’intention tout en gardant la métaphore hébraïque du cœur. L’emploi de « maison » et de « pour le nom de » conserve les images et tensions du texte source.
