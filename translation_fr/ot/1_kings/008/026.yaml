  text: וְ/עַתָּ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵאָ֤מֶן נָא֙ דברי/ך אֲשֶׁ֣ר דִּבַּ֔רְתָּ לְ/עַבְדְּ/ךָ֖ דָּוִ֥ד אָבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: fr
  text: Et maintenant, Dieu d’Israël, je t’en prie, que la parole[b] que tu as adressée à ton serviteur David, mon père, soit confirmée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soit établie », « s’avère vraie » ou, de manière plus dynamique, « se réalise ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu écrit « tes paroles » ; le singulier rend ici naturellement leur sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction et l’adverbe temporel, qui inscrivent cette demande dans la continuité de la prière de Salomon.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: Rend directement la construction hébraïque employée ici comme apostrophe, sans ajouter le « ô » aujourd’hui soutenu ou archaïsant.
- source_word: יֵאָמֶן
  choice: que soit confirmée
  rationale: Le niphal de אמן exprime ici l’affermissement ou la confirmation de ce que Dieu a déclaré. La tournure passive conserve cette nuance tout en restant compréhensible en français.
- source_word: נָא
  choice: je t’en prie
  rationale: Exprime naturellement en français moderne la valeur suppliante de la particule dans le contexte d’une prière.
- source_word: דבריך
  choice: la parole
  rationale: La forme écrite est plurielle, « tes paroles », mais le verbe au singulier et le contexte permettent de comprendre collectivement l’ensemble de la déclaration divine. Le singulier français est naturel sans expliciter davantage par « promesse ».
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: que tu as adressée
  rationale: Dans la construction דבר ל, « adresser une parole à quelqu’un » rend idiomatiquement l’acte de parler à David sans introduire explicitement la notion de promesse.
- source_word: לְעַבְדְּךָ
  choice: à ton serviteur
  rationale: Dans cette adresse à Dieu au sujet de David, « serviteur » restitue la relation d’appartenance et d’honneur mieux que « esclave ».
- source_word: דָּוִד אָבִי
  choice: David, mon père
  rationale: Suit l’ordre appositionnel de l’hébreu et identifie clairement David comme le père de Salomon.
theological_decisions:
- issue: Nature de la demande concernant la déclaration antérieure de Dieu à David
  choice: Une prière demandant que la parole de Dieu soit confirmée
  alternative: Une prière demandant que la promesse de Dieu se réalise
  rationale: « Soit confirmée » préserve l’idée de fermeté portée par la racine אמן ainsi que la forme passive, sans réduire la déclaration divine au seul accomplissement futur ni ajouter un contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le ton d’une supplication sans recourir à des formes liturgiques archaïques. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
