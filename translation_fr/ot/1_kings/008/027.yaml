source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֥ב אֱלֹהִ֖ים עַל הָ/אָ֑רֶץ הִ֠נֵּה הַ/שָּׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: fr
  text: 'Car Dieu habitera-t-il vraiment sur la terre ? Voici : les cieux, même les cieux les plus élevés[a], ne peuvent te contenir[b] ; encore moins cette maison que j’ai bâtie[c] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les cieux et les cieux des cieux », expression désignant les cieux les plus élevés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne peuvent te renfermer ».'
    reason: lexical_alternative
  - marker: c
    text: « Cette maison » désigne le temple bâti par Salomon.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: Mais… vraiment
  rationale: La combinaison introduit ici une question rhétorique étonnée, en contraste avec l’idée que Dieu ferait réellement sa demeure auprès de son peuple. « Mais… vraiment » restitue naturellement cette tension en français.
- source_word: יֵשֵׁב
  choice: habitera
  rationale: Le verbe peut signifier s’asseoir, demeurer ou habiter. Dans le contexte de la présence divine et du temple, « habiter » est le choix idiomatique sans suggérer que l’édifice enfermerait Dieu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom a ici un sens singulier, confirmé par le verbe et par le contexte de la prière adressée au Dieu d’Israël.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: La terre est mise en contraste avec les cieux ; « sur la terre » conserve directement cette opposition cosmique.
- source_word: הִנֵּה
  choice: Voici
  rationale: Le terme attire solennellement l’attention sur l’affirmation qui suit. « Voici » convient au registre élevé de la prière tout en restant clair.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: les cieux, même les cieux les plus élevés
  rationale: La tournure hébraïque « les cieux et les cieux des cieux » forme une intensification superlative. La traduction communique son sens en français moderne, tandis que la note conserve la forme littérale.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: ne peuvent te contenir
  rationale: Le verbe exprime ici la capacité de contenir ou de renfermer. « Contenir » rend clairement l’idée qu’aucun espace créé ne peut circonscrire Dieu.
- source_word: אַף כִּי
  choice: encore moins
  rationale: 'Cette locution introduit un raisonnement a fortiori : si les cieux ne peuvent contenir Dieu, la maison bâtie par Salomon le peut moins encore.'
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: « Maison » traduit le terme hébreu et préserve le motif biblique du temple comme maison de Dieu ; une note en précise le référent.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: que j’ai bâtie
  rationale: Le parfait désigne l’action achevée de Salomon, dont le résultat est présent au moment de la prière. « J’ai bâtie » en donne une expression naturelle et digne.
theological_decisions:
- issue: Transcendance divine et présence dans le temple
  choice: Conserver la question rhétorique sur l’habitation de Dieu sur terre, puis affirmer que même les cieux ne peuvent le contenir.
  alternative: Présenter le verset comme une négation absolue de toute présence divine sur terre, ou laisser entendre que le temple contient littéralement Dieu.
  rationale: Le texte unit sans les confondre l’étonnement devant la présence réelle de Dieu auprès de son peuple et l’affirmation de sa transcendance sur tout espace créé. La traduction préserve cette tension sans la résoudre dans un sens doctrinal particulier.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique garde sa solennité ; « Voici » maintient l’appel emphatique de l’hébreu, et « encore moins » exprime naturellement le raisonnement a fortiori. Le terme « maison » est conservé plutôt que remplacé par « temple » afin de respecter l’image du texte source.
