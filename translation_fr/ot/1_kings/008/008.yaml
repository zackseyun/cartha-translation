  text: וַֽ/יַּאֲרִכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הַ/קֹּ֨דֶשׁ֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: fr
  text: Les barres étaient si longues que leurs extrémités étaient visibles depuis le Lieu saint, devant le sanctuaire intérieur[a], mais elles n’étaient pas visibles de l’extérieur. Elles sont là jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lieu très saint ». Le terme hébreu désigne le sanctuaire intérieur du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: étaient si longues
  rationale: 'Le verbe ארך exprime ici la longueur des barres et introduit naturellement en français la conséquence indiquée ensuite : leurs extrémités étaient visibles.'
- source_word: הַבַּדִּים
  choice: les barres
  rationale: בַּדִּים désigne les barres servant à porter l’arche. « Barres » est le terme courant et précis en français moderne.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: leurs extrémités étaient visibles
  rationale: רָאשֵׁי signifie littéralement « têtes », mais « extrémités » convient naturellement à des barres. Le niphal de ראה indique ici qu’elles étaient visibles.
- source_word: מִן הַקֹּדֶשׁ
  choice: depuis le lieu saint
  rationale: Dans cette description architecturale, הַקֹּדֶשׁ désigne la pièce extérieure du Temple, distincte du sanctuaire intérieur. « Depuis » rend clairement le point d’observation.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: devant le sanctuaire intérieur
  rationale: דְּבִיר désigne la pièce intérieure où se trouvait l’arche, et עַל־פְּנֵי se rend naturellement par « devant ».
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: mais elles ne l’étaient pas de l’extérieur
  rationale: Cette formulation conserve le contraste entre la visibilité depuis le lieu saint et l’absence de visibilité depuis l’extérieur, sans lourde répétition.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: Elles sont là jusqu’à ce jour
  rationale: Cette expression hébraïque signale, du point de vue du narrateur, que les barres se trouvent encore à cet endroit. Le présent rend cet état continu avec naturel.
theological_decisions:
- issue: Identification du דְּבִיר
  choice: sanctuaire intérieur
  alternative: lieu très saint
  rationale: « Sanctuaire intérieur » décrit directement la partie du Temple visée sans imposer un terme interprétatif; l’équivalent traditionnel « lieu très saint » est conservé en note.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation maintient les distinctions architecturales du texte hébreu tout en évitant les termes archaïques.
