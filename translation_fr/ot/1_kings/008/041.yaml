source:
  edition: WLC
  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: fr
  text: De même, quant à l’étranger[a], qui ne fait pas partie de ton peuple Israël mais qui vient d’un pays lointain à cause de ton nom —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la personne venue d’ailleurs ». Le mot hébreu désigne ici un non-Israélite, et non simplement un voyageur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Et aussi
  rationale: Conserve à la fois le lien avec les demandes précédentes et la valeur additive, voire légèrement emphatique, de l’expression hébraïque.
- source_word: אֶל הַנָּכְרִי
  choice: l’étranger
  rationale: Dans la construction prolongée qui commence ici, אֶל introduit le cas de l’étranger. Le français peut laisser cette relation syntaxique se poursuivre jusqu’aux verbes de la demande dans les versets suivants sans ajouter « concernant », qui alourdirait la phrase.
- source_word: הַנָּכְרִי
  choice: l’étranger
  rationale: Désigne ici une personne non israélite, et non simplement un voyageur ou quelqu’un d’inconnu. « L’étranger » est naturel, digne et conserve la distinction avec Israël.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: qui ne fait pas partie de ton peuple Israël
  rationale: Formulation française naturelle qui exprime clairement l’absence d’appartenance au peuple d’Israël sans réduire la relation à une simple provenance géographique.
- source_word: וּבָא
  choice: mais qui vient
  rationale: Le waw fait progresser la description; « mais » rend le léger contraste entre la non-appartenance à Israël et la venue de l’étranger, sans en faire une forte opposition.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: d’un pays lointain
  rationale: Expression française courante qui restitue directement l’éloignement géographique.
- source_word: לְמַעַן שְׁמֶךָ
  choice: à cause de ton nom
  rationale: Dans ce contexte, la renommée du nom de Dieu motive la venue de l’étranger. « À cause de » exprime clairement ce motif tout en conservant le terme théologiquement chargé de « nom ».
theological_decisions:
- issue: Distinction entre Israël, peuple de Dieu, et l’étranger non israélite
  choice: l’étranger, qui ne fait pas partie de ton peuple Israël
  alternative: l’immigré, qui n’est pas de ton peuple Israël
  rationale: Le texte vise l’appartenance extérieure à Israël plutôt qu’un statut migratoire moderne. Cette formulation maintient la distinction d’alliance sans exclure la portée de la prière en faveur du non-Israélite.
- issue: Sens de « pour/à cause de ton nom »
  choice: à cause de ton nom
  alternative: pour l’amour de ton nom
  rationale: Le contexte présente le nom et la renommée de Dieu comme la raison de la venue de l’étranger. Le choix retenu évite de faire de l’expression une demande visant la défense du nom divin, tout en conservant « ton nom ».
translation_notes:
  register: Français international moderne, clair et digne. Le tiret final signale que la phrase et la demande se poursuivent dans les versets suivants. La répétition de « qui » rend la longue proposition relative naturelle en français.
