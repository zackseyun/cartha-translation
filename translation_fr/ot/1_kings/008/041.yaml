revisions:
- from: Et aussi l’étranger[a], qui ne fait pas partie de ton peuple Israël, mais qui vient d’un pays lointain à cause de ton nom—
  to: De même, quant à l’étranger[a], qui ne fait pas partie de ton peuple Israël mais qui vient d’un pays lointain à cause de ton nom —
  rationale: 'La révision rend explicitement la valeur thématique de אֶל par « quant à », tout en conservant l’addition de וְגַם par « De même ». Elle maintient les choix sémantiques sûrs du projet : « l’étranger », son extériorité au peuple d’Israël, la provenance lointaine et le motif lié au nom divin. Le tiret final est conservé, puisque la syntaxe et la demande se poursuivent dans les versets suivants.'
