id: 1KI.8.52
reference: 1 Kings 8:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/הְי֨וֹת עֵינֶ֤י/ךָ פְתֻחוֹת֙ אֶל תְּחִנַּ֣ת עַבְדְּ/ךָ֔ וְ/אֶל תְּחִנַּ֖ת עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל לִ/שְׁמֹ֣עַ אֲלֵי/הֶ֔ם בְּ/כֹ֖ל קָרְאָ֥/ם אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: fr
  text: Que tes yeux soient ouverts à la supplication[a] de ton serviteur et à la supplication de ton peuple Israël, afin de les écouter[b] chaque fois qu’ils t’invoquent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « requête pressante ». Le terme hébreu désigne une demande insistante de faveur ou de compassion.
    reason: lexical_alternative
  - marker: b
    text: Ou « les entendre ». Le verbe hébreu peut signifier entendre, écouter ou prêter attention selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Que ... soient
  rationale: L’infinitif avec ל poursuit la prière de Salomon. En français, la tournure optative « Que ... soient » restitue naturellement la valeur de requête.
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: tes yeux soient ouverts
  rationale: Cette formulation conserve l’image anthropomorphique hébraïque de l’attention bienveillante de Dieu et la force de la demande.
- source_word: תְּחִנַּת
  choice: supplication
  rationale: Le terme désigne une demande pressante de faveur ou de compassion. « Supplication » est précis, digne et intelligible en français biblique moderne.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette prière royale, Salomon se présente devant Dieu comme son serviteur. Ce choix convient mieux au contexte que « esclave ».
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ton peuple Israël
  rationale: La formulation identifie Israël comme le peuple de Dieu sans ajouter une ponctuation interprétative inutile.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: afin de les écouter
  rationale: שׁמע peut exprimer le fait d’entendre, d’écouter ou d’exaucer. « Écouter » indique une attention active tout en préservant l’ambiguïté entre audition et réponse favorable.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: chaque fois qu’ils t’invoquent
  rationale: La construction a ici une valeur temporelle répétitive. Dans le contexte de la prière adressée à Dieu, « invoquer » rend naturellement קרא אל.
theological_decisions:
- issue: Langage anthropomorphique au sujet de Dieu
  choice: Conserver « tes yeux soient ouverts »
  alternative: Paraphraser par « sois attentif »
  rationale: L’hébreu emploie explicitement l’image des yeux ouverts pour évoquer l’attention divine. La conserver respecte la texture littéraire et théologique sans imposer une compréhension corporelle de Dieu.
- issue: Portée de שׁמע dans la réponse divine à la prière
  choice: Traduire par « écouter »
  alternative: Traduire par « entendre » ou « exaucer »
  rationale: « Écouter » exprime l’attention sans réduire le verbe à une simple perception auditive ni expliciter jusqu’à l’« exaucement » ce que l’hébreu laisse ouvert.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu dans le contexte. La répétition de « supplication » est conservée pour refléter le parallélisme hébreu.
