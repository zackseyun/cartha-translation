  text: כִּ֤י הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם אֶל מְק֖וֹם הָֽ/אָר֑וֹן וַ/יָּסֹ֧כּוּ הַ/כְּרֻבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: fr
  text: Car les chérubins déployaient leurs ailes au-dessus de l’emplacement de l’arche[a], et ils couvraient d’en haut l’arche et ses barres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en direction de l’emplacement de l’arche ». La préposition hébraïque a ordinairement un sens directionnel, mais le contexte favorise ici l’idée que les ailes s’étendaient au-dessus de l’emplacement de l’arche.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit une explication de l’affirmation précédente et conserve naturellement la valeur causale du terme hébreu.
- source_word: הַכְּרוּבִים
  choice: les chérubins
  rationale: Terme français consacré pour les figures célestes associées à l’arche, sans la connotation enfantine que peut avoir « chérubins » hors contexte biblique.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: déployaient leurs ailes
  rationale: Le participe décrit ici une disposition durable; l’imparfait français exprime naturellement cet état. Le possessif est implicite en hébreu et nécessaire en français courant.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: au-dessus de l’emplacement de l’arche
  rationale: Dans ce contexte spatial, les ailes s’étendent au-dessus de l’endroit occupé par l’arche, comme le confirme la proposition suivante. Une note conserve toutefois la valeur directionnelle ordinaire de אֶל.
- source_word: וַיָּסֹכּוּ
  choice: couvraient
  rationale: Le verbe סכך exprime l’action de couvrir ou d’abriter. « Couvraient » rend clairement l’image physique sans ajouter explicitement l’idée d’ombre.
- source_word: בַּדָּיו
  choice: ses barres
  rationale: Il s’agit des longues pièces servant à porter l’arche. « Barres » est le terme français biblique courant et reste immédiatement compréhensible.
- source_word: מִלְמָעְלָה
  choice: d’en haut
  rationale: Conserve l’indication spatiale selon laquelle l’arche et ses barres étaient couvertes par-dessus.
