id: 1KI.8.16
reference: 1 Kings 8:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: fr
  text: Depuis le jour où j’ai fait sortir d’Égypte mon peuple, Israël, je n’ai choisi aucune ville parmi toutes les tribus d’Israël pour y bâtir une maison afin que mon nom y soit[b] ; mais[a] j’ai choisi David pour qu’il soit à la tête de mon peuple, Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « et j’ai choisi David ». La conjonction hébraïque peut simplement coordonner les deux propositions, mais le contexte favorise un contraste : aucune ville n’avait été choisie, tandis que David avait été choisi.'
    reason: lexical_alternative
  - marker: b
    text: « Une maison afin que mon nom y soit » est une expression hébraïque désignant un sanctuaire associé au nom et à la présence du Seigneur, c’est-à-dire le temple.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: j’ai fait sortir
  rationale: 'Le hifil de יצא exprime la causation : Dieu a fait sortir Israël d’Égypte. Cette formulation française conserve directement ce sens.'
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: mon peuple, Israël
  rationale: La virgule rend explicite l’apposition par laquelle « Israël » identifie « mon peuple », tout en préservant la désignation d’alliance.
- source_word: בָחַרְתִּי
  choice: j’ai choisi
  rationale: « Choisir » est l’équivalent français direct et théologiquement transparent du verbe בחר.
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: aucune ville parmi toutes les tribus d’Israël
  rationale: Cette formulation naturelle conserve le rapport condensé entre une ville et l’ensemble des tribus, sans préciser davantage que l’hébreu.
- source_word: לִבְנוֹת בַּיִת
  choice: pour y bâtir une maison
  rationale: « Maison » préserve le terme concret בַּיִת et l’expression théologique hébraïque, au lieu de remplacer directement le mot par « temple ».
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: afin que mon nom y soit
  rationale: La traduction conserve le verbe simple היה, « être », et évite d’introduire « habiter », qui serait plus interprétatif.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: mais j’ai choisi David
  rationale: Dans le contexte, le waw oppose l’absence de choix d’une ville au choix positif de David. « Mais » exprime naturellement ce contraste, tout en signalant en note la lecture coordonnée possible.
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: pour qu’il soit à la tête de mon peuple, Israël
  rationale: « Être à la tête de » rend naturellement en français l’idée d’être placé au-dessus du peuple, sans expliciter davantage la fonction par un verbe tel que « régner ».
theological_decisions:
- issue: Théologie du temple dans « une maison afin que mon nom y soit »
  choice: Conserver l’expression hébraïque avec « maison » et « mon nom y soit ».
  alternative: Traduire explicitement par « un temple où mon nom habiterait ».
  rationale: La formulation retenue maintient le thème deutéronomiste du lieu associé au nom du Seigneur sans identifier interprétativement le nom à une présence localisée ni substituer d’emblée « temple » à « maison ».
- issue: Contraste entre le choix d’une ville et celui de David
  choice: Traduire le waw par « mais ».
  alternative: Traduire par « et ».
  rationale: 'Le contexte met en relief deux actes de choix contrastés : aucune ville n’avait été choisie, tandis que David l’avait été. La variante coordonnée demeure signalée en note afin de préserver l’ambiguïté grammaticale.'
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu dans l’expression « afin que mon nom y soit », dont la légère solennité préserve le langage théologique du passage. Le point-virgule clarifie le contraste central.
