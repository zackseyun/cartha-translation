base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/034.yaml
  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: fr
  text: Alors, écoute dans le ciel[a], pardonne le péché de ton peuple Israël et ramène-les dans le pays que tu as donné à leurs pères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « écoute depuis le ciel ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire les ancêtres auxquels Dieu avait donné le pays.
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: écoute dans le ciel
  rationale: La construction hébraïque associe « écouter » à « les cieux » sans préposition. « Dans le ciel » conserve le lieu où Dieu entend, tandis que « depuis le ciel » reste une autre compréhension possible signalée en note.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: pardonne le péché
  rationale: סלח exprime ici le pardon accordé par Dieu, et חטאת désigne le péché d’Israël, au singulier collectif, non un sacrifice pour le péché.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: ton peuple Israël
  rationale: Cette formulation directe garde l’identification d’Israël comme peuple de Dieu.
- source_word: וַהֲשֵׁבֹתָם
  choice: ramène-les
  rationale: La forme causative de שוב signifie faire revenir. « Ramène-les » exprime clairement le retour concret du peuple vers le pays.
- source_word: אֶל הָאֲדָמָה
  choice: dans le pays
  rationale: אֲדָמָה peut désigner le sol ou la terre, mais le contexte de la promesse territoriale appelle ici « le pays ».
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: que tu as donné à leurs pères
  rationale: La proposition rappelle le don du pays aux pères d’Israël. « Leurs pères » conserve la formulation masculine et l’ancrage patriarcal du texte.
theological_decisions:
- issue: Sens de לַאֲבוֹתָם dans le langage de la promesse
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Dans ce contexte, le terme évoque les pères auxquels le pays a été donné. La traduction retenue conserve cette formulation sans élargir ni neutraliser la référence.
- issue: Nature du rétablissement exprimé par וַהֲשֵׁבֹתָם
  choice: ramène-les dans le pays
  alternative: rétablis-les dans le pays
  rationale: Le texte décrit d’abord un retour spatial concret vers le pays. « Ramène-les » préserve le sens causatif sans transformer ce retour en notion théologique plus abstraite.
translation_notes:
  register: Français moderne, digne et accessible. L’adresse emphatique « toi » reflète וְאַתָּה, et la suite coordonnée garde le mouvement de la prière hébraïque. « Le ciel » rend naturellement en français le pluriel hébreu שָׁמַיִם lorsqu’il désigne la demeure divine.
