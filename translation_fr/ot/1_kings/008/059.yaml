source:
  edition: WLC
  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: fr
  text: Que ces paroles que j’ai prononcées devant Yahweh en le suppliant restent, jour et nuit, proches de Yahweh notre Dieu, afin qu’il fasse droit à son serviteur et à son peuple Israël[b], selon les besoins de chaque jour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’affaire d’un jour en son jour » ; autrement dit, ce que chaque jour demande.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’il défende la cause de son serviteur et la cause de son peuple Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: Que … restent
  rationale: La forme exprime ici un souhait qui prolonge la prière de Salomon. « Restent » rend naturellement l’idée que ces paroles demeurent continuellement auprès de Dieu.
- source_word: דְבָרַי אֵלֶּה אֲשֶׁר הִתְחַנַּנְתִּי
  choice: les paroles par lesquelles j’ai supplié
  rationale: Le hitpael de חנן désigne une supplication pressante. « Par lesquelles » conserve le lien instrumental entre les paroles et la supplication, sans lourdeur excessive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin יהוה, afin de préserver le nom propre employé dans le texte hébreu.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: proches de Yahweh notre Dieu
  rationale: Rendu direct de קְרֹבִים אֶל, qui présente les paroles de la prière comme demeurant près de Dieu et donc constamment devant lui.
- source_word: יוֹמָם וָלָיְלָה
  choice: jour et nuit
  rationale: Expression française naturelle qui conserve l’image hébraïque d’une continuité sans interruption.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: afin qu’il fasse droit à
  rationale: « Faire droit à quelqu’un » exprime en français moderne l’idée judiciaire de soutenir sa juste cause ou de lui rendre justice.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Dans la prière royale de Salomon, « serviteur » convient au rapport d’obéissance envers Dieu sans mettre au premier plan le sens social d’« esclave ».
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: selon les besoins de chaque jour
  rationale: 'Cette formulation rend le sens distributif de l’idiome : Dieu doit intervenir quotidiennement selon ce que la situation du jour demande.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme. La transcription « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Sens judiciaire de עשה משפט
  choice: faire droit à son serviteur et à son peuple
  alternative: rendre justice à son serviteur et à son peuple
  rationale: « Faire droit à » maintient l’image d’une cause portée devant le juge et n’impose pas l’idée que le serviteur ou le peuple serait nécessairement victime d’une injustice précise.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la forme de souhait de la prière, la répétition du nom Yahweh et la nuance judiciaire de מִשְׁפָּט. Les notes sont placées après les expressions qu’elles éclairent.
