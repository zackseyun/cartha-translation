source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: fr
  text: Alors Salomon se tint devant l’autel de Yahweh, face à toute l’assemblée d’Israël, et étendit les mains vers le ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les cieux ».'
    reason: La forme hébraïque est plurielle, tandis que le singulier collectif « le ciel » est plus naturel en français dans cette expression.
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se tint
  rationale: Le verbe עמד décrit ici la position prise par Salomon devant l’autel; « se tint » convient au registre narratif solennel sans ajouter l’idée explicite qu’il se serait levé.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: devant l’autel de Yahweh
  rationale: לִפְנֵי garde son sens spatial naturel, tandis que la construction מִזְבַּח יְהוָה est rendue directement. Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: face à toute l’assemblée d’Israël
  rationale: « Face à » exprime la position publique de Salomon par rapport à la communauté réunie et évite de répéter « devant »; קהל désigne ici l’assemblée d’Israël.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: étendit les mains
  rationale: Dans le geste de prière décrit par פרשׂ avec כפים, le français idiomatique parle d’étendre les mains; « mains » traduit naturellement le sens contextuel de « paumes ».
- source_word: הַשָּׁמָיִם
  choice: le ciel
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, « vers le ciel » est la tournure française naturelle pour indiquer la direction de ce geste de prière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme tel, sans lui substituer un titre; la vocalisation ancienne exacte demeure toutefois incertaine.
- issue: Sens de הַשָּׁמָיִם dans le geste de prière
  choice: le ciel
  alternative: les cieux
  rationale: Le contexte exprime d’abord la direction des mains. Le singulier collectif français reste ouvert à la portée théologique du terme sans réduire celui-ci au seul ciel visible.
translation_notes:
  register: Français international actuel, digne et lisible. La syntaxe conserve la progression narrative et la solennité du geste public de prière, sans archaïsmes inutiles.
