  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: fr
  text: Mais tourne-toi vers la prière de ton serviteur et vers sa supplication[a], Yahweh, mon Dieu, pour écouter le cri[b] et la prière que ton serviteur élève aujourd’hui devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa demande de faveur ». Le terme hébreu désigne une demande pressante de faveur ou de compassion.
    reason: lexical_alternative
  - marker: b
    text: Ou « le cri retentissant ». Le mot hébreu peut désigner un cri sonore ou une clameur ; ici, il s’agit d’un cri adressé à Dieu dans la prière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Mais tourne-toi vers
  rationale: Le verbe פנה évoque concrètement le fait de se tourner vers quelqu’un ou quelque chose et, dans ce contexte de prière, demande à Dieu d’y prêter attention. « Mais » marque naturellement le contraste avec l’affirmation du verset précédent.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: la prière
  rationale: « Prière » est l’équivalent direct et courant de תפלה. Sa répétition conserve le parallélisme hébreu.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette adresse humble à Dieu, עבד désigne le serviteur plutôt que de mettre l’accent sur le statut d’esclave. Les deux occurrences sont rendues de la même manière.
- source_word: תְּחִנָּתוֹ
  choice: sa supplication
  rationale: תחנה désigne un appel pressant visant à obtenir grâce ou compassion. « Supplication » conserve cette intensité dans un registre digne et compréhensible.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, mon Dieu
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre; אֱלֹהָי est rendu directement par « mon Dieu ».
- source_word: לִשְׁמֹעַ
  choice: pour écouter
  rationale: L’infinitif exprime ici le but de la demande. « Écouter » rend le sens de שמע dans le contexte d’une prière adressée à Dieu.
- source_word: הָרִנָּה
  choice: le cri
  rationale: רנה peut désigner un cri retentissant, un appel ou, dans d’autres contextes, un cri joyeux. Ici, son parallélisme avec la prière favorise le sens d’un cri adressé à Dieu.
- source_word: מִתְפַּלֵּל לְפָנֶיךָ
  choice: t’adresse
  rationale: L’expression française « la prière que… t’adresse » restitue naturellement l’action de prier devant Dieu, sans alourdir la phrase par une répétition verbale peu idiomatique.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent moderne et direct de l’indication temporelle hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte porte explicitement le tétragramme. La forme « Yahweh » préserve le nom personnel au lieu de lui substituer un titre; elle suit aussi la convention de translittération retenue pour cette édition.
translation_notes:
  register: Français international moderne, digne et accessible. L’image concrète de Dieu qui se tourne vers la prière est conservée. Le tutoiement correspond à l’adresse directe au singulier du texte hébreu. Le second marqueur est placé après « cri », le mot auquel sa note se rapporte.
