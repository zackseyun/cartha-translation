revisions:
- from: Mais tourne-toi vers la prière de ton serviteur et vers sa supplication[a], Yahweh, mon Dieu, pour écouter le cri[b] et la prière que ton serviteur t’adresse aujourd’hui.
  to: Mais tourne-toi vers la prière de ton serviteur et vers sa supplication[a], Yahweh, mon Dieu, pour écouter le cri[b] et la prière que ton serviteur élève aujourd’hui devant toi.
  rationale: La révision conserve la demande adressée à Dieu, tout en rendant explicitement la prière du serviteur « devant » lui. Les notes sont maintenues aux mêmes ancres; la première est clarifiée pour refléter plus exactement la valeur de תחנה.
