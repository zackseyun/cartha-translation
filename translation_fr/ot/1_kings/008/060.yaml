  text: לְמַ֗עַן דַּ֚עַת כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֖ין עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: fr
  text: afin que tous les peuples de la terre sachent que le SEIGNEUR, c’est lui qui est Dieu, et qu’il n’y en a pas d’autre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: afin que … sachent
  rationale: Exprime naturellement en français la finalité introduite par לְמַעַן, avec l’idée de connaissance portée par דַּעַת.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: tous les peuples de la terre
  rationale: Conserve le pluriel עַמֵּי et la portée universelle de l’expression.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Suit la convention française traditionnelle qui signale le tétragramme par SEIGNEUR en petites capitales typographiques.
- source_word: הוּא הָאֱלֹהִים
  choice: c’est lui qui est Dieu
  rationale: Préserve l’insistance du pronom indépendant הוּא plutôt que de réduire la proposition à « le SEIGNEUR est Dieu ».
- source_word: אֵין עוֹד
  choice: il n’y en a pas d’autre
  rationale: Rend l’affirmation exclusive de manière idiomatique tout en laissant le référent implicite, comme en hébreu.
theological_decisions:
- issue: Exclusivité divine affirmée par אֵין עוֹד
  choice: qu’il n’y en a pas d’autre
  alternative: qu’il n’existe aucun autre Dieu
  rationale: La formulation retenue conserve l’ellipse et l’ambiguïté grammaticale de l’hébreu sans ajouter explicitement « Dieu », tout en communiquant clairement l’affirmation dans son contexte.
translation_notes:
  register: Français moderne, international et digne. La tournure disloquée « c’est lui qui est Dieu » restitue l’emphase hébraïque sans paraître archaïque. La coordination « et que » relie naturellement les deux objets de « sachent ».
