base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: fr
  text: Le roi et tout Israël avec lui offraient des sacrifices[a] devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sacrifiaient un sacrifice »; cette construction hébraïque, qui associe un verbe et un nom de même racine, souligne l’acte d’offrir un sacrifice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Le roi
  rationale: Le waw poursuit simplement le récit; en français, il n’est pas nécessaire de le rendre par « et » en tête de phrase. Le nom défini désigne le roi déjà mentionné, Salomon.
- source_word: וְכָל יִשְׂרָאֵל
  choice: et tout Israël
  rationale: La désignation collective du peuple est conservée plutôt que développée en « tous les Israélites ».
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Cette expression concise rattache tout Israël au roi et reproduit naturellement la relation exprimée en hébreu.
- source_word: זֹבְחִים זֶבַח
  choice: offraient des sacrifices
  rationale: Le participe décrit une action en cours. La tournure française idiomatique rend la construction hébraïque apparentée, littéralement « sacrifiaient un sacrifice », sans en reproduire la lourdeur; une note signale la forme originale.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » conserve de manière concise la portée spatiale et cultuelle de l’expression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre tout en évitant de le remplacer par un titre.
translation_notes:
  register: Français moderne, clair et digne. « Offraient des sacrifices » est naturel dans un contexte cultuel, tandis que la note conserve la texture particulière de l’hébreu.
