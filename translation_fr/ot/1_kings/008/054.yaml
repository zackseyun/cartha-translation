source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת שְׁלֹמֹ֗ה לְ/הִתְפַּלֵּל֙ אֶל יְהוָ֔ה אֵ֛ת כָּל הַ/תְּפִלָּ֥ה וְ/הַ/תְּחִנָּ֖ה הַ/זֹּ֑את קָ֞ם מִ/לִּ/פְנֵ֨י מִזְבַּ֤ח יְהוָה֙ מִ/כְּרֹ֣עַ עַל בִּרְכָּ֔י/ו וְ/כַפָּ֖י/ו פְּרֻשׂ֥וֹת הַ/שָּׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: fr
  text: Lorsque Salomon eut fini d’adresser à Yahweh toute cette prière et cette supplication[a], il se releva de devant l’autel de Yahweh, où il était à genoux, les paumes étendues vers le ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « demande pressante de faveur ». Le terme hébreu désigne une demande insistante de grâce ou de faveur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses paumes déployées vers le ciel » ; le mot hébreu peut aussi être rendu plus généralement par « mains ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Lorsque … eut fini
  rationale: La construction introduit une proposition temporelle. Le passé antérieur exprime naturellement en français soigné l’achèvement de la prière avant le changement de posture.
- source_word: לְהִתְפַּלֵּל אֶל יְהוָה
  choice: d’adresser à Yahweh … cette prière
  rationale: « Adresser une prière à » rend naturellement le verbe et son complément en français, tout en maintenant Yahweh comme destinataire explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français du nom divin יהוה, plutôt que substitution par un titre.
- source_word: אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: toute cette prière et cette supplication
  rationale: « Prière » garde le terme général, tandis que « supplication » exprime l’appel insistant à la grâce ou à la faveur porté par תְּחִנָּה.
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: il se releva de devant l’autel de Yahweh
  rationale: « Se releva » indique clairement le changement de posture; « de devant » conserve la relation spatiale exprimée par מִלִּפְנֵי.
- source_word: מִכְּרֹעַ עַל בִּרְכָּיו
  choice: où il était à genoux
  rationale: Cette formulation française naturelle restitue la posture explicite sans le pléonasme peu idiomatique « agenouillé sur ses genoux ».
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: les paumes ouvertes vers le ciel
  rationale: כַּף désigne précisément la paume ou, par extension, la main. « Paumes ouvertes » rend le geste corporel avec précision, et « vers le ciel » exprime la direction.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Nuance de תְּחִנָּה
  choice: supplication
  alternative: appel à la faveur
  rationale: « Supplication » conserve l’idée d’une demande pressante de grâce sans préciser davantage que ne le fait le contexte.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe temporelle est naturelle, le nom Yahweh est conservé, et la posture de Salomon demeure concrète sans reproduire un pléonasme hébraïque maladroit en français.
