    issue: Le rendu « paumes ouvertes » atténue légèrement l’idée de paumes étendues ou déployées.
    rationale: פּרֻשׂוֹת décrit des mains/paumes déployées dans un geste d’extension. « Étendues » est à la fois précis et naturel.
  - severity: low
    issue: La formulation alternative de la note a est maladroite.
    rationale: « Appel pressant à la faveur » ne dit pas nettement qu’il s’agit d’une demande de faveur. « Demande pressante de faveur » exprime le sens lexical de façon plus idiomatique.
  revised_text: Lorsque Salomon eut fini d’adresser à Yahweh toute cette prière et cette supplication[a], il se releva de devant l’autel de Yahweh, où il était à genoux, les paumes étendues vers le ciel[b].
  revised_footnotes:
  - marker: a
    text: Ou « demande pressante de faveur ». Le terme hébreu désigne une demande insistante de grâce ou de faveur.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ses paumes déployées vers le ciel » ; le mot hébreu peut aussi être rendu plus généralement par « mains ».
    reason: lexical_alternative
  revision_rationale: La révision conserve intégralement la structure et le sens du texte hébreu, tout en affinant le geste exprimé par פּרֻשׂוֹת et en clarifiant l’alternative lexicale de la note a.
