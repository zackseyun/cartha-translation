  to: Lorsque Salomon eut fini d’adresser à Yahweh toute cette prière et cette supplication[a], il se releva de devant l’autel de Yahweh, où il était à genoux, les paumes étendues vers le ciel[b].
  rationale: La révision conserve intégralement la structure et le sens du texte hébreu, tout en affinant le geste exprimé par פּרֻשׂוֹת et en clarifiant l’alternative lexicale de la note a.
