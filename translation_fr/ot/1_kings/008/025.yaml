  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: fr
  text: 'Et maintenant, Yahweh, Dieu d’Israël, accomplis pour ton serviteur David, mon père, ce que tu lui as déclaré en disant : « Tu ne manqueras pas, devant moi, d’un homme qui siège sur le trône d’Israël[a], à la seule condition que tes fils veillent sur leur conduite en marchant devant moi comme tu as marché devant moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Pour toi, aucun homme ne sera retranché de devant moi, siégeant sur le trône d’Israël. »'
    reason: Conserve la forme plus littérale de l’idiome hébreu לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי, tandis que le texte principal en exprime naturellement le sens dynastique.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel sous une forme translittérée, au lieu de lui substituer un titre.
- source_word: שְׁמֹר
  choice: accomplis
  rationale: Avec une parole promise pour objet, le verbe signifie ici la garder en la réalisant. « Accomplis » rend ce sens clairement et naturellement en français.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: pour ton serviteur David, mon père
  rationale: « Serviteur » convient au contexte royal et à l’humilité de la prière; l’apposition respecte la structure hébraïque sans produire une tournure artificielle.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: ce que tu lui as déclaré
  rationale: Reste proche du verbe « parler » tout en indiquant naturellement le caractère solennel de la parole divine, sans ajouter explicitement le mot « promesse ».
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: Tu ne manqueras pas, devant moi, d’un homme
  rationale: Rend en français courant le sens dynastique de l’expression hébraïque. La formulation plus littérale avec « retranché » est conservée en note.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: qui siège sur le trône d’Israël
  rationale: Rend naturellement le participe hébreu et identifie sans ambiguïté la fonction royale de cet homme.
- source_word: רַק אִם
  choice: pourvu seulement que
  rationale: Exprime nettement la condition renforcée introduite par la combinaison hébraïque, sans en atténuer la portée.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: tes fils veillent sur leur conduite
  rationale: Transpose l’image hébraïque de « garder leur voie » dans une expression française claire qui vise la manière de vivre.
- source_word: לָלֶכֶת לְפָנַי
  choice: en marchant devant moi
  rationale: Conserve l’image biblique de la marche et présente celle-ci comme la manière de veiller sur sa conduite.
- source_word: כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: comme tu as marché devant moi
  rationale: Préserve le parallélisme lexical et l’adresse à David à l’intérieur de la parole citée.
theological_decisions:
- issue: Conditionnalité de la promesse dynastique faite à David
  choice: La continuité dynastique est formulée ici avec une condition explicite portant sur la conduite des fils de David.
  alternative: Comprendre la promesse comme inconditionnelle et limiter la condition à la jouissance historique de ses bienfaits.
  rationale: רַק אִם introduit explicitement la conduite des descendants comme condition. La traduction maintient cette tension sans la résoudre à partir d’autres textes.
translation_notes:
  register: Français moderne, international et digne. La syntaxe de la prière reste solennelle, mais les expressions idiomatiques sont rendues de façon intelligible. L’image répétée de la marche devant Dieu est conservée.
