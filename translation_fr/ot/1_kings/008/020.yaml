  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: fr
  text: 'Yahweh a accompli la parole qu’il avait prononcée[a] : j’ai succédé à David, mon père, et je siège sur le trône d’Israël, comme Yahweh l’avait dit. J’ai construit la maison pour le nom de Yahweh[b], le Dieu d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a confirmé sa parole » ou « a réalisé ce qu’il avait dit ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « la maison »; il s’agit du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: a accompli
  rationale: Avec « parole » pour complément, le hiphil de קום exprime ici le fait de donner effet à une parole, de la mener à son accomplissement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: la parole qu’il avait prononcée
  rationale: Conserve le champ lexical de la parole et la répétition de דבר, tout en employant un français naturel.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: j’ai succédé à David, mon père
  rationale: Dans ce contexte dynastique, קום תחת signifie se lever à la place de quelqu’un, donc lui succéder. Cette formulation française rend clairement le sens sans suggérer une opposition.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: je siège sur le trône d’Israël
  rationale: Le présent traduit naturellement l’état royal actuel résultant de l’intronisation évoquée.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: comme Yahweh l’avait annoncé
  rationale: « Annoncé » rend ici la parole divine antérieure à laquelle l’événement correspond, sans expliciter davantage qu’elle constitue une promesse.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: J’ai construit la maison
  rationale: « Maison » conserve le terme hébreu et son motif théologique; le contexte désigne le Temple.
- source_word: לְשֵׁם יְהוָה
  choice: pour le nom de Yahweh
  rationale: Préserve l’expression biblique et sa portée théologique plutôt que de la réduire à « en l’honneur de ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et usuelle du titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription préserve cette distinction au lieu de le remplacer par un titre.
- issue: Traduction de הַבַּיִת
  choice: la maison
  alternative: le Temple
  rationale: Le référent est bien le Temple, mais « maison » conserve le lexème et le motif biblique de la maison de Yahweh; une note explicite le référent.
- issue: Portée de דִּבֶּר
  choice: avait prononcée / avait annoncé
  alternative: avait promise
  rationale: Le contexte implique une promesse, mais le verbe signifie littéralement parler; la traduction évite d’effacer cette légère tension lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation répartit la longue coordination hébraïque sans en altérer la progression. « Siéger sur le trône » est idiomatique en français, tandis que « maison » et « pour le nom de » préservent les expressions théologiquement marquées du texte source.
