  source_fidelity: Le texte rend correctement l’accomplissement de la parole divine, la succession de Salomon à David, son règne sur Israël et la construction de la maison pour le nom de Yahweh. « J’ai succédé à David, mon père » est une formulation fidèle et idiomatique de la succession exprimée par תַּחַת. Toutefois, « l’avait annoncé » interprète plus spécifiquement la parole comme une annonce; « l’avait dit » préserve mieux le verbe répété דִּבֵּר (« parler/dire »).
