source:
  edition: WLC
  text: וְ/הָיָ֤ה לְבַבְ/כֶם֙ שָׁלֵ֔ם עִ֖ם יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֧כֶת בְּ/חֻקָּ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: fr
  text: Que votre cœur soit donc tout entier avec Yahweh notre Dieu[a], pour marcher selon ses prescriptions et garder ses commandements, comme vous le faites aujourd’hui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans partage envers Yahweh notre Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « comme en ce jour » ; le jour présent sert de point de comparaison pour cette fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Que ... soit donc
  rationale: Dans ce contexte d’exhortation, la construction se rend naturellement en français par « Que ... soit » ; « donc » marque le lien avec la bénédiction qui précède.
- source_word: לְבַבְכֶם שָׁלֵם
  choice: votre cœur soit ... tout entier
  rationale: « Cœur » conserve l’image hébraïque de la personne intérieure, notamment sa volonté et sa fidélité. « Tout entier » exprime une loyauté complète sans suggérer une perfection sans péché.
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: avec Yahweh notre Dieu
  rationale: « Avec » préserve la formulation relationnelle de עִם, et « Yahweh » représente directement le nom divin יהוה.
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: afin de suivre ses prescriptions
  rationale: Le verbe « suivre » rend naturellement en français l’image conventionnelle de marcher selon une voie, tandis que « prescriptions » désigne les règles établies exprimées par חֻקִּים.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: et de garder ses commandements
  rationale: « Garder » conserve la force d’observer fidèlement, et « commandements » maintient le registre d’alliance.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme aujourd’hui
  rationale: Cette expression française actuelle rend l’idiome hébreu qui présente le jour présent comme exemple ou témoignage de cette fidélité.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur, Jéhovah
  rationale: Le texte porte le nom propre de Dieu. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de שָׁלֵם dans l’exhortation à la fidélité
  choice: tout entier avec Yahweh
  alternative: sans partage envers Yahweh ; pleinement attaché à Yahweh
  rationale: La formulation choisie garde l’image relationnelle de l’hébreu et exprime une fidélité entière sans résoudre cette notion en une catégorie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe exhortative est naturelle ; le nom divin et l’image du cœur sont conservés, tandis que « suivre ses prescriptions » évite le calque peu idiomatique « marcher dans ses prescriptions ».
