  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: fr
  text: Le huitième jour, il congédia le peuple ; ils bénirent le roi et regagnèrent leurs tentes[a], joyeux et le cœur en fête, à cause de tout le bien que Yahweh avait fait pour David, son serviteur, et pour Israël, son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chez eux » ; littéralement « vers leurs tentes ».
    reason: L’expression peut désigner idiomatiquement le retour au domicile, tandis que le texte hébreu conserve l’image et la direction vers les tentes.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Le huitième jour
  rationale: Rend directement l’expression temporelle sans ajouter « de la fête », précision déductible du contexte mais absente du verset.
- source_word: שִׁלַּח אֶת הָעָם
  choice: il laissa partir le peuple
  rationale: Le piel de שלח exprime ici le fait de congédier ou d’autoriser le départ; cette formulation est naturelle en français et en conserve le sens.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: Ils bénirent le roi
  rationale: ברך signifie normalement « bénir ». Même si le geste peut comporter ici une dimension d’adieu, la traduction conserve le sens lexical et l’idée d’appeler le bien sur le roi.
- source_word: לְאָהֳלֵיהֶם
  choice: regagnèrent leurs tentes
  rationale: L’hébreu dit littéralement « vers leurs tentes ». « Regagnèrent » exprime naturellement le retour, tandis que « tentes » préserve l’image du texte source; l’équivalent idiomatique figure en note.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: dans la joie et le cœur heureux
  rationale: La formulation rend à la fois la joie manifeste et l’idiome hébreu de la bonté ou allégresse du cœur, sans supprimer le langage du cœur.
- source_word: עַל כָּל הַטּוֹבָה
  choice: à cause de tout le bien
  rationale: La préposition indique ici la raison de leur joie, et « tout le bien » garde la portée générale des bienfaits accomplis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְדָוִד עַבְדּוֹ
  choice: à David, son serviteur
  rationale: Dans ce cadre royal et relationnel, « serviteur » rend עבד de manière exacte et contextuellement appropriée.
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: et à Israël, son peuple
  rationale: La traduction conserve simplement la désignation relationnelle d’Israël comme peuple de Yahweh.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le verset emploie directement le tétragramme. « Yahweh » conserve le nom divin et évite de le remplacer par le titre « le SEIGNEUR ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est fluide sans expliciter des éléments seulement contextuels. Le parallélisme affectif de l’hébreu et son langage du cœur sont conservés.
