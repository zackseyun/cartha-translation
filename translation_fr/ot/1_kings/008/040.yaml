source:
  edition: WLC
  text: לְמַ֨עַן֙ יִֽרָא֔וּ/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: fr
  text: afin qu’ils te craignent tous les jours de leur vie[a] dans le pays[b] que tu as donné à nos pères[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aussi longtemps qu’ils vivront ». Littéralement : « tous les jours où ils vivent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur la terre ». Littéralement : « sur la face du sol ». Le terme hébreu peut aussi désigner la terre ou le pays.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « à nos ancêtres ». L’hébreu dit : « à nos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit naturellement en français le but ou le résultat recherché dans la prière de Salomon.
- source_word: יִרָאוּךָ
  choice: qu’ils te craignent
  rationale: Le verbe ירא exprime ici la crainte révérencielle envers Dieu. « Te craignent » conserve la force de cette notion biblique sans la réduire au simple respect.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: tous les jours de leur vie
  rationale: Cette formulation française naturelle rend la totalité de la période exprimée par l’hébreu, littéralement « tous les jours où ils vivent ».
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sur la terre
  rationale: אֲדָמָה peut désigner le sol ou la terre. La proposition suivante renvoie à la terre donnée aux pères d’Israël; « sur la terre » reste naturel tout en conservant une part de l’ambiguïté lexicale.
- source_word: אֲשֶׁר נָתַתָּה
  choice: que tu as donnée
  rationale: Le passé composé exprime naturellement en français le don accompli dont les effets demeurent. L’accord au féminin rattache clairement le relatif à « terre ».
- source_word: לַאֲבֹתֵינוּ
  choice: à nos pères
  rationale: Rend directement le terme hébreu et préserve la formulation biblique et historique; « à nos ancêtres » demeure une possibilité de sens.
theological_decisions:
- issue: Sens de ירא à l’égard de Dieu
  choice: qu’ils te craignent
  alternative: qu’ils te révèrent
  rationale: « Craindre » maintient la tension biblique entre crainte, respect et fidélité envers Dieu, tandis que « révérer » risquerait d’en atténuer la force.
- issue: Portée de הָאֲדָמָה
  choice: la terre
  alternative: le pays
  rationale: Le contexte du don aux pères vise la terre d’Israël, mais le nom hébreu peut aussi désigner le sol ou la terre. Le choix retenu respecte le contexte sans supprimer entièrement cette latitude.
- issue: Référent de אֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: Le texte hébreu dit explicitement « nos pères ». La traduction le conserve sans exclure le sens collectif d’ancêtres signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le vocabulaire théologique de la crainte de Dieu, tout en rendant naturellement l’expression temporelle hébraïque.
