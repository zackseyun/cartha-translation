  text: וּ/פְקָעִים֩ מִ/תַּ֨חַת לִ/שְׂפָת֤/וֹ סָבִיב֙ סֹבְבִ֣ים אֹת֔/וֹ עֶ֚שֶׂר בָּֽ/אַמָּ֔ה מַקִּפִ֥ים אֶת הַ/יָּ֖ם סָבִ֑יב שְׁנֵ֤י טוּרִים֙ הַ/פְּקָעִ֔ים יְצֻקִ֖ים בִּ/יצֻקָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: fr
  text: Sous son rebord, des motifs en forme de courges[a] l’entouraient de tous côtés, à raison de dix par coudée ; ils faisaient tout le tour de la Mer. Ces motifs, disposés en deux rangées, avaient été coulés d’une seule pièce avec elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « boutons » ou « bossettes » ; le terme hébreu désigne des ornements ayant l’apparence de courges.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: motifs en forme de courges
  rationale: Le terme désigne ici des ornements ressemblant à des courges. Cette formulation concrète indique clairement qu’il s’agit de formes décoratives, sans imposer une identification botanique précise.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: sous son rebord
  rationale: שָׂפָה signifie littéralement « lèvre » ou « bord » ; « rebord » convient naturellement au bord supérieur d’un grand bassin.
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: l’entouraient de tous côtés
  rationale: La formulation conserve l’insistance de la répétition hébraïque tout en restant naturelle en français.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: à raison de dix par coudée
  rationale: La phrase indique vraisemblablement la densité des ornements le long de la circonférence ; cette traduction demeure concise sans préciser davantage le mode exact de mesure.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: ils faisaient tout le tour de la Mer
  rationale: « La Mer » est ici le nom donné au grand bassin. La tournure française restitue à la fois l’encerclement et l’insistance de סָבִיב.
- source_word: שְׁנֵי טוּרִים
  choice: disposés en deux rangées
  rationale: טוּרִים désigne des rangées ; l’ajout de « disposés » exprime naturellement leur agencement.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: avaient été coulés d’une seule pièce avec elle
  rationale: La répétition de la racine de « couler » indique que les ornements faisaient partie de la même fonte et n’avaient pas été ajoutés après coup.
theological_decisions: []
