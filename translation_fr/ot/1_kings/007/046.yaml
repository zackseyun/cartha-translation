base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/046.yaml
  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: fr
  text: Dans la plaine du Jourdain, le roi les coula dans une terre argileuse[a], entre Soukkoth et Tsartân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans l’épaisseur du sol », expression qui désigne probablement une terre dense et argileuse convenant à la confection de moules.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: Dans la plaine du Jourdain
  rationale: Dans ce contexte géographique, כִּכָּר désigne la région plane du Jourdain. « Plaine » reste proche de la formulation hébraïque sans imposer le terme plus large de « vallée ».
- source_word: יְצָקָם
  choice: le roi les fit couler
  rationale: Le verbe יצק désigne ici la coulée d’objets métalliques. « Fit couler » est naturel en français et le pronom « les » reprend les objets de bronze mentionnés dans le contexte.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: L’hébreu emploie le nom commun défini, sans nommer Salomon dans ce verset.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: dans une terre argileuse
  rationale: מַעֲבֶה évoque l’épaisseur ou la densité du sol; dans le contexte de la fonte, l’expression désigne vraisemblablement une terre argileuse adaptée à la confection des moules.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: entre Soukkoth et Tsartân
  rationale: Les noms de lieux sont translittérés d’après l’hébreu dans une graphie lisible en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve « le roi » plutôt que d’expliciter Salomon et rend le procédé métallurgique de manière idiomatique sans ajouter explicitement les moules au texte principal.
