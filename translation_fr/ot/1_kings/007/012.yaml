source:
  edition: WLC
  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: fr
  text: La grande cour avait, tout autour, trois rangées de pierres de taille et une rangée de poutres de cèdre[a], comme[b] la cour intérieure de la maison de Yahweh et le vestibule[c] de la maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trois assises de pierres taillées et une assise de pièces de cèdre coupées ».
    reason: Alternative lexicale et architecturale pour טוּר, גָּזִית et כְּרֻתֹת אֲרָזִים.
  - marker: b
    text: Ou « et pour la cour intérieure de la maison de Yahweh et pour le vestibule de la maison ». La préposition hébraïque peut exprimer ici soit une comparaison, soit une relation.
    reason: Préservation de l’ambiguïté syntaxique de la préposition ל.
  - marker: c
    text: C’est-à-dire le hall d’entrée du bâtiment du temple.
    reason: Précision culturelle et architecturale sur אֻלָם.
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: la grande cour
  rationale: חָצֵר désigne une cour fermée. « Grande cour » est naturel dans ce contexte architectural et reste proche de l’hébreu.
- source_word: סָבִיב
  choice: tout autour
  rationale: L’adverbe exprime l’idée d’encerclement. Sa place après « avait » donne une phrase française fluide sans perdre la portée spatiale.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: trois rangées de pierres de taille
  rationale: Dans un contexte de construction, טוּר désigne une rangée ou une assise, et גָּזִית des pierres travaillées. Cette formulation est claire pour le lecteur non spécialiste.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: et une rangée de poutres de cèdre
  rationale: כְּרֻתֹת signifie littéralement des éléments coupés; le contexte architectural permet de les rendre par « poutres ». Le parallélisme avec les rangées de pierre est conservé.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: comme la cour intérieure de la maison de Yahweh
  rationale: Le ל préfixé peut introduire ici une correspondance avec les structures citées. « Comme » explicite naturellement l’ellipse, tandis qu’une note préserve l’analyse relationnelle plus littérale.
- source_word: אֻלָם
  choice: vestibule
  rationale: Le mot désigne le porche ou hall d’entrée d’un édifice monumental. « Vestibule » convient au registre architectural et demeure compréhensible.
- source_word: הַבָּיִת
  choice: la maison
  rationale: Dans ce contexte, בַּיִת désigne le bâtiment du temple proprement dit. « Maison » préserve l’expression hébraïque sans effacer son sens cultuel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Valeur du ל devant la cour intérieure et le vestibule
  choice: 'valeur comparative : « comme »'
  alternative: 'valeur relationnelle : « et pour »'
  rationale: Le contexte architectural favorise une comparaison elliptique entre les modes de construction, mais la préposition hébraïque permet aussi une lecture relationnelle; celle-ci est donc signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire architectural courant (« rangées », « pierres de taille », « poutres », « vestibule ») privilégie la clarté, tandis que les notes conservent les possibilités plus techniques ou littérales.
