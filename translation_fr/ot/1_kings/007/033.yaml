base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: fr
  text: La fabrication des roues était semblable à celle d’une roue de char ; leurs essieux[a], leurs jantes, leurs rayons et leurs moyeux[b] étaient tous en métal coulé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poignées » ou « supports ». Le terme hébreu est apparenté au mot « main », mais il semble désigner ici des pièces d’axe ou de soutien.
    reason: lexical_alternative
  - marker: b
    text: Les termes hébreux rendus par « rayons » et « moyeux » sont rares. On pourrait aussi les comprendre comme des « cerclages » et des « entretoises » ou des « pièces d’assemblage ». Leur sens technique exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה הָאוֹפַנִּים / כְּמַעֲשֵׂה
  choice: Les roues étaient fabriquées comme
  rationale: מַעֲשֵׂה désigne ici la manière dont les roues étaient ouvragées. Cette formulation rend clairement la comparaison sans recourir à un terme technique ou vieilli.
- source_word: אוֹפַן הַמֶּרְכָּבָה
  choice: des roues de char
  rationale: מֶרְכָּבָה désigne normalement un char dans ce contexte ancien. Le français emploie naturellement le pluriel générique après la comparaison, sans modifier le sens du singulier hébreu.
- source_word: יְדוֹתָם
  choice: leurs essieux
  rationale: Bien que le mot soit apparenté à יָד, « main », le contexte mécanique favorise des pièces d’axe ou de soutien ; « essieux » est le terme français courant le plus plausible.
- source_word: גַבֵּיהֶם
  choice: leurs jantes
  rationale: Le sens concret de « dos » ou partie surélevée s’applique ici au pourtour de la roue ; « jantes » est clair en français moderne.
- source_word: חִשֻּׁקֵיהֶם
  choice: leurs rayons
  rationale: Dans cette énumération des parties d’une roue, le terme rare est vraisemblablement une pièce reliant ou maintenant l’ensemble ; « rayons » suit l’interprétation contextuelle la plus accessible, tout en signalant l’incertitude en note.
- source_word: חִשֻּׁרֵיהֶם
  choice: leurs moyeux
  rationale: Ce terme technique rare est compris comme la pièce centrale de la roue. « Moyeux » est précis et usuel, mais l’incertitude est conservée en note.
- source_word: הַכֹּל מוּצָק
  choice: étaient tous en métal coulé
  rationale: מוּצָק indique une fabrication par coulage. L’ajout explicatif « en métal » rend naturellement en français le procédé présupposé dans ce contexte de pièces métalliques.
