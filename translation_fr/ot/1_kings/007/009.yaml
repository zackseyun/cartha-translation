  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: fr
  text: Tout cela était fait de pierres coûteuses[a], taillées sur mesure et sciées à la scie, à l’intérieur comme à l’extérieur, depuis la fondation jusqu’au couronnement[b], et, à l’extérieur, jusqu’à la grande cour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierres précieuses » ou « pierres de valeur ». Il s’agit probablement ici de pierres de construction coûteuses et de grande qualité, plutôt que de pierres gemmes.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « jusqu’aux tefaḥot ». La partie architecturale exacte est incertaine; le terme peut désigner la finition supérieure de l’ouvrage, par exemple le couronnement ou l’assise supérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Toutes ces constructions
  rationale: Le pronom démonstratif pluriel renvoie naturellement aux bâtiments et parties architecturales décrits dans le contexte immédiat. L’explicitation évite en français une formule obscure comme « toutes celles-ci ».
- source_word: אֲבָנִים יְקָרֹת
  choice: en pierres de grand prix
  rationale: יְקָרֹת signifie précieuses, coûteuses ou de grande valeur. Dans ce contexte architectural, il s’agit de pierres de construction coûteuses et de haute qualité, non de pierres gemmes.
- source_word: כְּמִדֹּת גָּזִית
  choice: taillées sur mesure
  rationale: La formulation exprime à la fois la taille de pierres de dimension et leur façonnage selon des mesures précises.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: sciées à la scie
  rationale: Cette expression conserve la formulation concrète et emphatique de l’hébreu, qui associe le participe au nom de l’instrument.
- source_word: מִבַּיִת וּמִחוּץ
  choice: sur la face intérieure comme sur la face extérieure
  rationale: Dans le cadre de la maçonnerie, la formule désigne vraisemblablement le travail effectué sur les deux faces des pierres; cette traduction rend clairement ce sens architectural sans effacer la distinction intérieur/extérieur.
- source_word: מִמַּסָּד
  choice: depuis les fondations
  rationale: מַסָּד désigne la fondation ou la base d’un édifice; « fondations » est le terme architectural français naturel.
- source_word: עַד הַטְּפָחוֹת
  choice: jusqu’au couronnement
  rationale: Le terme rare טְפָחוֹת désigne ici une partie supérieure de l’ouvrage, mais son identification exacte est incertaine. « Couronnement » reste architectural tout en étant moins excessivement précis que d’autres possibilités.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: et, à l’extérieur, jusqu’à la grande cour
  rationale: La traduction suit la portée spatiale de la phrase et rend הֶחָצֵר הַגְּדוֹלָה par le terme architectural simple et courant « la grande cour ».
