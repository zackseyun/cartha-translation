translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition des termes techniques de l’hébreu est partiellement conservée afin de refléter le caractère descriptif du passage, tandis que « chapiteaux » fournit le terme architectural français précis. L’ajout existentiel « Il y avait » transforme naturellement la proposition nominale hébraïque en phrase française sans attribuer explicitement l’action à un artisan.
