base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/017.yaml
  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: fr
  text: 'Il y avait, pour les chapiteaux placés au sommet des colonnes, des treillis à motif de réseau et des cordons tressés à motif de chaînettes[a] : sept pour le premier chapiteau et sept pour le second.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des réseaux en ouvrage réticulé et des torsades en ouvrage de chaînes ». L’hébreu emploie deux paires de termes techniques apparentés pour décrire les ornements des chapiteaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: des treillis en ouvrage de réseau
  rationale: La formulation conserve les deux termes apparentés de l’hébreu et leur image concrète de décoration ajourée, tout en restant intelligible dans un contexte architectural.
- source_word: גְּדִלִים מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: des cordons tressés en ouvrage de chaînettes
  rationale: « Cordons tressés » rend l’idée d’éléments torsadés ou entrelacés sans leur attribuer une forme florale; « chaînettes » exprime leur facture en chaînes ornementales.
- source_word: כֹּתָרֹת
  choice: chapiteaux
  rationale: Dans ce contexte architectural, le mot désigne les éléments ornementaux couronnant les colonnes; « chapiteaux » est le terme français moderne précis.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: placés au sommet des colonnes
  rationale: Cette formulation rend naturellement la relation spatiale exprimée par l’hébreu, où רֹאשׁ signifie littéralement « tête ».
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: sept pour le premier chapiteau et sept pour le second
  rationale: Le texte compte explicitement sept éléments pour chacun des deux chapiteaux; la formulation française garde cette répartition sans préciser davantage quels éléments sont comptés.
