  text: וְ/כֹֽתָרֹ֗ת אֲשֶׁר֙ עַל רֹ֣אשׁ הָ/עַמּוּדִ֔ים מַעֲשֵׂ֖ה שׁוּשַׁ֣ן בָּֽ/אוּלָ֑ם אַרְבַּ֖ע אַמּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/019.yaml
  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: fr
  text: 'Les chapiteaux qui se trouvaient au sommet des colonnes étaient travaillés en forme de lis[b], dans le portique[a] : quatre coudées[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le vestibule » ou « sur le porche ». Le mot hébreu désigne le hall d’entrée ou le portique du Temple.
    reason: lexical_alternative
  - marker: b
    text: Ou simplement « en forme de lis ». Certains comprennent ici le mot hébreu comme désignant un motif floral en forme de lotus.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « quatre coudées ». Cette mesure désigne probablement la hauteur de la partie des chapiteaux façonnée en forme de lis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת
  choice: chapiteaux
  rationale: Dans ce contexte architectural, « chapiteaux » est le terme français précis et courant pour les éléments placés au sommet des colonnes.
- source_word: רֹאשׁ
  choice: sommet
  rationale: Le sens littéral est « tête », mais « sommet » exprime naturellement la position architecturale en français.
- source_word: הָעַמּוּדִים
  choice: colonnes
  rationale: « Colonnes » convient au contexte architectural du Temple et s’associe naturellement à « chapiteaux ».
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: travaillés en forme de fleur de lis
  rationale: Cette formulation rend l’idée d’un ouvrage ou façonnage floral sans réduire מַעֲשֵׂה à une simple comparaison ni employer une tournure française artificielle.
- source_word: שׁוּשַׁן
  choice: fleur de lis
  rationale: « Lis » est l’équivalent traditionnel et direct; « fleur de lis » précise qu’il s’agit de la forme florale, tandis que l’identification comme lotus reste possible et est signalée en note.
- source_word: בָּאוּלָם
  choice: dans le portique
  rationale: אוּלָם désigne le hall d’entrée ou portique du Temple. « Portique » est précis, moderne et naturel.
- source_word: אַרְבַּע אַמּוֹת
  choice: quatre coudées
  rationale: L’hébreu donne la mesure sans préciser explicitement la dimension mesurée; la traduction conserve cette concision et la note indique l’interprétation probable.
theological_decisions: []
