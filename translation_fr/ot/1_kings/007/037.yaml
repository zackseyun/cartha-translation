  text: כָּ/זֹ֣את עָשָׂ֔ה אֵ֖ת עֶ֣שֶׂר הַ/מְּכֹנ֑וֹת מוּצָ֨ק אֶחָ֜ד מִדָּ֥ה אַחַ֛ת קֶ֥צֶב אֶחָ֖ד לְ/כֻלָּֽ/הְנָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/037.yaml
  text: 'Thus he made the ten stands: one casting[a], one measure, one form for all of them.'
translation:
  language: fr
  text: 'C’est ainsi qu’il fabriqua les dix supports : ils étaient tous d’une même fonte[a], d’une même dimension et d’une même forme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils étaient tous d’un même ouvrage moulé, de mêmes dimensions et d’un même modèle ». L’hébreu emploie trois expressions parallèles et très concises pour souligner que les dix supports étaient fabriqués selon les mêmes caractéristiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּזֹאת
  choice: C’est ainsi
  rationale: Cette expression reprend rétrospectivement la description de la conception et de la fabrication des supports.
- source_word: עָשָׂה
  choice: il fabriqua
  rationale: Dans ce contexte artisanal, « fabriquer » est plus précis que le très général « faire », tout en restant naturel.
- source_word: הַמְּכֹנוֹת
  choice: les dix supports
  rationale: Le terme désigne ici les structures mobiles destinées à porter les bassins. « Supports » exprime leur fonction sans les réduire à de simples chariots.
- source_word: מוּצָק אֶחָד
  choice: d’une même fonte
  rationale: L’expression appartient au vocabulaire du métal coulé et souligne l’uniformité de fabrication des dix supports; la note conserve une autre compréhension possible.
- source_word: מִדָּה אַחַת
  choice: d’une même dimension
  rationale: Le singulier hébreu « une seule mesure » indique que les dix supports avaient des dimensions identiques.
- source_word: קֶצֶב אֶחָד
  choice: d’une même forme
  rationale: Dans ce contexte, קֶצֶב évoque la forme, le modèle ou les proportions; « forme » maintient le parallélisme concis de l’hébreu.
- source_word: לְכֻלָּהְנָה
  choice: ils étaient tous
  rationale: Cette formulation française naturelle rend l’application collective des mêmes caractéristiques aux dix supports.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La reformulation avec « ils étaient tous » rend explicite le rapport des trois expressions nominales avec les dix supports, tout en conservant leur parallélisme et leur insistance sur l’uniformité.
