  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: fr
  text: Il fit la salle des Colonnes[a], longue de cinquante coudées et large de trente. Un portique se trouvait devant elles ; il y avait aussi des colonnes et un auvent[b] devant elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même mot hébreu, אוּלָם, est rendu ici par « salle » et plus loin par « portique » ; selon l’agencement envisagé, on pourrait aussi traduire les deux occurrences par « portique » ou « vestibule ».
    reason: lexical_alternative
  - marker: b
    text: Le sens du mot hébreu עָב est incertain dans ce contexte architectural. Il pourrait aussi désigner un seuil, des poutres ou un autre élément couvert de la façade.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: la salle des Colonnes
  rationale: Dans ce contexte architectural, אוּלָם désigne une construction importante, et הָעַמּוּדִים la caractérise par ses colonnes. « Salle des Colonnes » est naturel en français et convient mieux à ses dimensions que « porche ».
- source_word: עָשָׂה
  choice: fit
  rationale: Le verbe courant עשה signifie « faire ». « Fit » reste proche de l’hébreu, sans préciser plus que le texte qu’il la construisit.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: elle avait cinquante coudées de long et trente coudées de large
  rationale: Cette formulation française naturelle conserve exactement les dimensions et explicite seulement le sujet implicite des suffixes hébreux.
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: Devant elles se trouvait un portique
  rationale: La seconde occurrence de אוּלָם semble désigner un élément d’entrée placé devant les colonnes. « Portique » convient à cette fonction tout en laissant la note signaler que le même mot hébreu est rendu différemment.
- source_word: וְעַמֻּדִים
  choice: des colonnes
  rationale: Le nom est conservé explicitement dans l’énumération architecturale concise de l’hébreu.
- source_word: וְעָב
  choice: un auvent
  rationale: Le terme est incertain dans ce contexte. « Auvent » exprime de façon lisible un élément saillant ou couvert, sans masquer l’incertitude, qui est signalée en note.
- source_word: עַל־פְּנֵיהֶם
  choice: Devant elles
  rationale: Le féminin pluriel renvoie naturellement en français aux « colonnes », même si la référence du pronom hébreu reste quelque peu difficile dans cette description concise.
