revisions:
- from: Chaque base avait quatre roues de bronze et des essieux de bronze. À ses quatre angles se trouvaient des supports. Sous la cuve, ces supports étaient coulés, chacun à côté d’une guirlande[a].
  to: Une base avait quatre roues de bronze et des essieux de bronze. Ses quatre pieds étaient munis de supports. Sous la cuve, les supports étaient coulés, chacun à côté d’une guirlande[a].
  rationale: La révision rétablit le singulier de la base décrit dans le texte source et rend plus directement la relation entre les quatre éléments inférieurs et leurs supports. Elle conserve « guirlande » comme rendu prudent du terme rare final, avec la note existante, et ajoute une note nécessaire sur le sens technique incertain de « supports ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T17:09:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'La version rend correctement les roues, les essieux, la cuve, la fonte et l’ornementation probable. Toutefois, « Chaque base » neutralise l’article et le numéral de לַמְּכוֹנָה הָאַחַת (« une base / la base en question »), et « À ses quatre angles se trouvaient des supports » atténue la relation exprimée par פַעֲמֹתָיו et לָהֶם : quatre pieds ou points d’appui munis de supports. « Angles » est possible à titre d’interprétation structurelle, mais il est moins proche du terme, dont le sens premier est lié au pied/pas et qui demeure techniquement incertain.'
  naturalness: Le français est globalement clair et de registre approprié. « Ses quatre pieds étaient munis de supports » est plus idiomatique que la formulation actuelle tout en préservant la relation entre les deux éléments. « Une base » convient mieux au singulier du texte source dans une description d’un exemplaire type.
  terminology: « Bronze », « essieux », « cuve » et « coulés » sont justes et naturels. « Base » est acceptable pour מְכוֹנָה, bien que « support mobile » soit une autre possibilité. « Supports » pour כְּתֵפֹת demeure une solution fonctionnelle prudente; une note doit signaler le sens littéral « épaules » et l’incertitude technique. La note sur לֹיוֹת doit conserver les possibilités « guirlandes/fেস্টons ».
  issues:
  - severity: medium
    issue: « Chaque base » remplace le singulier « une base » du texte hébreu.
    rationale: לַמְּכוֹנָה הָאַחַת désigne littéralement « la/une base » dans la description; une portée distributive peut être contextuellement comprise, mais elle ne doit pas être imposée dans le corps du texte.
  - severity: medium
    issue: « À ses quatre angles se trouvaient des supports » ne rend pas explicitement les quatre פַעֲמֹת ni la relation « des supports pour eux ».
    rationale: Le terme est difficile et peut désigner des pieds, des points d’appui ou, selon certaines interprétations, des coins. « Pieds » est plus près de la valeur lexicale sans exclure la fonction structurelle; « munis de supports » rend la relation marquée par לָהֶם.
  - severity: low
    issue: L’ambiguïté technique de כְּתֵפֹת n’est pas documentée en note.
    rationale: Puisque « supports » est une interprétation fonctionnelle de « épaules », une note lexicale brève améliore la transparence sans alourdir le texte.
  revised_text: Une base avait quatre roues de bronze et des essieux de bronze. Ses quatre pieds étaient munis de supports. Sous la cuve, les supports étaient coulés, chacun à côté d’une guirlande[a].
  revised_footnotes:
  - marker: a
    text: Le terme hébreu rare peut désigner des guirlandes ou des festons décoratifs.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu signifie littéralement « épaules » ; dans cette description technique, il désigne probablement des pièces saillantes servant de supports.
    reason: lexical_alternative
  revision_rationale: La révision rétablit le singulier de la base décrit dans le texte source et rend plus directement la relation entre les quatre éléments inférieurs et leurs supports. Elle conserve « guirlande » comme rendu prudent du terme rare final, avec la note existante, et ajoute une note nécessaire sur le sens technique incertain de « supports ».
