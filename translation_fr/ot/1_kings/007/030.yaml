  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: fr
  text: Une base avait quatre roues de bronze et des essieux de bronze. Ses quatre pieds étaient munis de supports. Sous la cuve, les supports étaient coulés, chacun à côté d’une guirlande[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rare peut désigner des guirlandes ou des festons décoratifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: roues de bronze
  rationale: אוֹפַנִּים désigne des roues; dans le mobilier du temple, נְחֹשֶׁת se rend conventionnellement et vraisemblablement par « bronze ».
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: Chaque base
  rationale: מְכוֹנָה désigne ici la structure mobile qui porte la cuve. La tournure hébraïque avec l’article et « une » a une valeur distributive dans cette description; « chaque base » est naturel en français.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: essieux de bronze
  rationale: Dans le contexte immédiat des roues, סַרְנִים désigne vraisemblablement les pièces servant d’essieux.
- source_word: אַרְבָּעָה פַעֲמֹתָיו
  choice: à ses quatre angles
  rationale: פַעֲמֹתָיו est difficile dans cette description mécanique et peut évoquer les pieds ou points d’appui; « angles » exprime ici les quatre emplacements structurels sans les confondre avec les supports nommés ensuite.
- source_word: כְּתֵפֹת
  choice: supports
  rationale: Le sens littéral est « épaules », mais le contexte architectural indique des pièces saillantes soutenant la cuve.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: Sous la cuve
  rationale: כִּיּוֹר désigne le récipient porté par la base; « cuve » convient au mobilier du temple et reste courant.
- source_word: יְצֻקוֹת
  choice: étaient coulés
  rationale: Le participe passif de יצק appartient ici au vocabulaire de la fonte des métaux.
- source_word: מֵעֵבֶר אִישׁ
  choice: chacun à côté de
  rationale: La locution marque une disposition distributive; cette formulation préserve la relation spatiale sans préciser abusivement sa géométrie.
- source_word: לֹיוֹת
  choice: guirlande
  rationale: Ce terme rare semble désigner un ornement en forme de feston ou de guirlande; le singulier français suit la construction distributive.
