base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: fr
  text: Il plaça cinq supports du côté droit de la Maison et cinq du côté gauche de la Maison, et il plaça la Mer du côté droit de la Maison, vers l’est, face au sud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La description spatiale est très compacte en hébreu. Elle indique vraisemblablement que la Mer se trouvait du côté sud-est de la Maison.
    reason: clarification_spatiale
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: supports
  rationale: Dans le contexte du mobilier du temple, le terme désigne les structures de bronze sur roues qui portaient les bassins. « Supports » exprime clairement leur fonction sans insister excessivement sur leur mobilité.
- source_word: כֶּתֶף
  choice: côté
  rationale: Le sens littéral est « épaule », mais, dans une description architecturale, le mot désigne naturellement le côté d’un bâtiment.
- source_word: הַבַּיִת
  choice: la Maison
  rationale: L’hébreu dit « la maison » et désigne ici le temple. La majuscule signale cet emploi particulier tout en conservant l’image hébraïque.
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: sur le côté droit / sur le côté gauche
  rationale: Cette formulation conserve le repérage corporel de l’hébreu au lieu de le convertir directement en points cardinaux.
- source_word: הַיָּם
  choice: la Mer
  rationale: Il s’agit de l’appellation conventionnelle du grand bassin de bronze du temple; la majuscule indique qu’il s’agit d’un élément particulier du mobilier cultuel.
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: du côté droit de la Maison, vers l’est, en face du sud
  rationale: La traduction garde la succession compacte et quelque peu difficile des indications spatiales hébraïques, plutôt que de la réduire sans réserve à « au sud-est ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Maison » et « Mer » prennent une majuscule parce qu’ils désignent ici le temple et son grand bassin de bronze. La répétition spatiale de l’hébreu est largement conservée afin de ne pas effacer son ambiguïté.
