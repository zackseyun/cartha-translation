base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: fr
  text: Il fit aussi la salle du trône, où il devait rendre la justice — la salle du jugement — ; elle était lambrissée de cèdre, du sol au sol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon une interprétation courante, « du sol au plafond ». L’hébreu dit littéralement « du sol au sol ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: la salle du Trône
  rationale: אוּלָם désigne ici un vaste espace architectural de type salle ou portique; « salle » convient naturellement au contexte palatial. כִּסֵּא signifie « trône, siège » et garde ici sa portée royale.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: où il rendrait la justice
  rationale: L’imparfait יִשְׁפָּט peut exprimer la fonction prévue ou habituelle du lieu. « Rendre la justice » est une expression française naturelle qui conserve le sens judiciaire sans préciser indûment s’il s’agit d’une action unique ou répétée.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: la salle du Jugement
  rationale: Le groupe construit nomme la salle d’après sa fonction. « Jugement » reste plus proche de מִשְׁפָּט que « justice », tandis que la majuscule signale le nom fonctionnel de la salle.
- source_word: עָשָׂה
  choice: Il fit
  rationale: עָשָׂה signifie largement « faire ». « Fit » demeure proche de l’hébreu et convient à l’énumération architecturale.
- source_word: וְסָפוּן בָּאֶרֶז
  choice: elle fut lambrissée de cèdre
  rationale: סָפוּן exprime l’idée de couvrir ou revêtir. « Lambrissée de cèdre » rend naturellement en français un revêtement intérieur en bois.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: d’un sol à l’autre
  rationale: Le texte massorétique répète littéralement קַרְקַע, « sol ». La traduction conserve cette répétition énigmatique plutôt que de la corriger silencieusement, tout en donnant en note l’interprétation architecturale courante.
