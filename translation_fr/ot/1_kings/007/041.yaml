source:
  edition: WLC
  text: עַמֻּדִ֣ים שְׁנַ֔יִם וְ/גֻלֹּ֧ת הַ/כֹּתָרֹ֛ת אֲשֶׁר עַל רֹ֥אשׁ הָֽ/עַמֻּדִ֖ים שְׁתָּ֑יִם וְ/הַ/שְּׂבָכ֣וֹת שְׁתַּ֔יִם לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל רֹ֥אשׁ הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/041.yaml
  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: fr
  text: les deux colonnes, les deux vasques[a] des chapiteaux qui se trouvaient au sommet des colonnes, et les deux treillis[b] destinés à couvrir les deux vasques des chapiteaux qui se trouvaient au sommet des colonnes ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « globes » ou « formes arrondies » ; le terme hébreu désigne des éléments arrondis des chapiteaux, dont la forme architecturale exacte demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « réseaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: colonnes
  rationale: Dans ce contexte architectural, « colonnes » est le terme français courant et précis pour les deux grands éléments dressés du Temple.
- source_word: גֻלֹּת
  choice: vasques
  rationale: Le mot désigne ici des éléments arrondis associés aux chapiteaux. « Vasques » évoque une forme de coupe sans prétendre fixer avec certitude leur configuration architecturale.
- source_word: כֹּתָרֹת
  choice: chapiteaux
  rationale: Terme architectural français précis et actuel pour la partie ornementale située au sommet d’une colonne.
- source_word: רֹאשׁ
  choice: sommet
  rationale: Bien que le sens premier soit « tête », « sommet » est l’équivalent idiomatique dans cette description architecturale.
- source_word: שְּׂבָכוֹת
  choice: treillis
  rationale: Le terme évoque un ouvrage ornemental ajouré ou entrecroisé ; « treillis » est naturel en français et conserve cette image.
- source_word: לְכַסּוֹת
  choice: destinés à couvrir
  rationale: L’infinitif exprime la fonction ou le but des treillis ; cette formulation s’intègre naturellement à une liste d’objets.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: deux
  rationale: La répétition du nombre structure l’inventaire hébreu et est conservée.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: qui se trouvaient au sommet des colonnes
  rationale: La formulation préserve la proposition relative et sa répétition tout en restant fluide en français.
theological_decisions: []
