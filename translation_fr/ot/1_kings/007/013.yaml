lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  choice: envoya chercher
  rationale: Cette tournure française naturelle rend l’enchaînement des deux verbes, littéralement « envoya et prit », dans lequel le second indique que Salomon fit venir Hiram.
- source_word: מִצֹּר
  choice: à Tyr
  rationale: Après « chercher », le français idiomatique emploie « à » pour désigner le lieu où se trouve la personne que l’on fait venir; le sens d’origine ou de provenance reste clair dans le contexte.
