source:
  edition: WLC
  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: fr
  text: Il était fils d’une veuve de la tribu de Nephtali, et son père était un Tyrien[a], artisan du bronze. Il était rempli de sagesse, d’intelligence et de connaissance pour exécuter toutes sortes d’ouvrages en bronze[b]. Il vint auprès du roi Salomon et exécuta tout son travail.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme de Tyr ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu neḥoshet peut désigner le cuivre ou le bronze ; « bronze » convient ici au contexte du mobilier du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: fils d’une veuve
  rationale: Expression française naturelle qui conserve l’accent hébreu sur la situation de veuvage de la mère.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: de la tribu de Nephtali
  rationale: Dans ce contexte d’appartenance, מַטֶּה désigne la tribu.
- source_word: אִישׁ צֹרִי
  choice: un Tyrien
  rationale: Le gentilé צֹרִי désigne un homme de Tyr; « un Tyrien » est concis et idiomatique en français.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: artisan du bronze
  rationale: חֹרֵשׁ désigne ici un travailleur qualifié, tandis que נְחֹשֶׁת renvoie vraisemblablement au bronze dans le contexte du mobilier du temple.
- source_word: וַיִּמָּלֵא
  choice: Il était rempli
  rationale: Le passif français reflète l’état ou la capacité reçue exprimée par la forme hébraïque, sans préciser un agent absent du texte.
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: de sagesse, d’intelligence et de connaissance
  rationale: Cette triade conserve les trois notions distinctes du texte, ici appliquées à l’habileté artisanale.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: pour exécuter toutes sortes d’ouvrages en bronze
  rationale: La formulation rend l’étendue de כָּל מְלָאכָה dans un français naturel adapté au travail artisanal.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: Il vint auprès du roi Salomon
  rationale: Rend simplement la progression narrative et la venue auprès du roi.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: et exécuta tout son travail
  rationale: Conserve le suffixe possessif ambigu sans ajouter l’idée non explicite d’une mission confiée ou d’un achèvement.
