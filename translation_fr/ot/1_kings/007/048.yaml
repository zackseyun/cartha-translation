  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: fr
  text: 'Salomon fit tous les objets qui étaient dans la maison de Yahweh : l’autel d’or et la table d’or sur laquelle se trouvait le pain de la Présence[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pain de proposition ». Littéralement, « le pain de la Présence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה a le sens large de « faire »; dans cet inventaire, « fit » est naturel, digne et n’ajoute pas une précision artisanale absente de l’hébreu.
- source_word: כָּל הַכֵּלִים אֲשֶׁר בֵּית יְהוָה
  choice: tous les objets destinés à la maison de Yahweh
  rationale: כֵּלִים désigne ici les objets ou ustensiles cultuels. La construction hébraïque est elliptique; « destinés à » explicite naturellement leur rapport au sanctuaire sans modifier le sens.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’expression concrète de l’hébreu, tandis que « Yahweh » rend directement le nom divin יהוה.
- source_word: מִזְבַּח הַזָּהָב
  choice: l’autel d’or
  rationale: Cette formulation française est concise et reproduit directement le syntagme hébreu.
- source_word: הַשֻּׁלְחָן ... זָהָב
  choice: la table d’or
  rationale: Le זָהָב final qualifie naturellement la table. En français, le rattacher immédiatement à « table » évite que « d’or » paraisse qualifier le pain.
- source_word: אֲשֶׁר עָלָיו
  choice: sur laquelle était placé
  rationale: Le texte dit littéralement « sur laquelle était ». L’ajout idiomatique de « placé » rend clairement la relation locative sans changer le contenu.
- source_word: לֶחֶם הַפָּנִים
  choice: le pain de la Présence
  rationale: Cette traduction garde l’image hébraïque des « faces/de la présence » et demeure compréhensible en français moderne; une note donne le terme cultuel traditionnel.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel et suit la décision doctrinale fournie, sans le remplacer par un titre.
- issue: Sens de לֶחֶם הַפָּנִים
  choice: pain de la Présence
  alternative: pains de proposition
  rationale: Le choix principal préserve le sens littéral et la portée cultuelle sans imposer une interprétation supplémentaire; l’expression française traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe elliptique de l’hébreu est légèrement explicitée par « destinés à », et la position de « d’or » est ajustée pour lever une ambiguïté purement syntaxique en français. Le seul appel de note [a] figure bien dans le texte.
