  - severity: low
    issue: « était placé » ajoute une précision absente de l’hébreu.
    rationale: אֲשֶׁר עָלָיו signifie « qui était sur elle/lui ». « se trouvait » restitue la relation locative sans suggérer un acte de placement.
  - severity: low
    issue: La variante de note est au pluriel alors que le texte hébreu et la traduction principale emploient le singulier.
    rationale: לֶחֶם est morphologiquement singulier et la traduction principale dit « le pain ». Une note au singulier maintient l’alignement formel, tout en signalant l’équivalent traditionnel.
