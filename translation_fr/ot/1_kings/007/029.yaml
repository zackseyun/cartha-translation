  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: fr
  text: Sur les panneaux qui étaient entre les traverses figuraient des lions, des bœufs et des chérubins. Des motifs semblables figuraient aussi sur les traverses, dans leur partie supérieure[a]. Sous les lions et les bœufs se trouvaient des guirlandes[b], un ouvrage en relief retombant[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « et sur les traverses, ainsi, au-dessus ». La construction est elliptique ; elle semble indiquer un décor correspondant dans la partie supérieure des traverses.'
    reason: textual_difficulty
  - marker: b
    text: 'Ou : « festons ». Le terme hébreu est rare, et la forme exacte de cet ornement reste incertaine.'
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque est difficile ; elle paraît désigner un ouvrage ornemental pendant ou descendant, mais la technique précise n’est pas certaine.
    reason: textual_difficulty
lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: panneaux
  rationale: Dans la description architecturale des supports, le terme désigne les surfaces décorées placées entre des éléments de structure. « Panneaux » les distingue clairement des שְׁלַבִּים.
- source_word: שְׁלַבִּים
  choice: traverses
  rationale: Le mot désigne les éléments de structure entre lesquels les panneaux étaient disposés. « Traverses » est concret et naturel en français, sans les confondre avec les panneaux eux-mêmes.
- source_word: אֲרָיוֹת
  choice: lions
  rationale: Sens direct du pluriel dans ce contexte décoratif.
- source_word: בָּקָר
  choice: bœufs
  rationale: Le nom collectif désigne ici des figures bovines. « Bœufs » est traditionnel et naturel dans la description du mobilier du temple, sans imposer la précision de « taureaux ».
- source_word: כְרוּבִים
  choice: chérubins
  rationale: Terme français consacré pour ces êtres célestes associés au sanctuaire ; il évite les connotations modernes et enfantines de « angelots ».
- source_word: כֵּן
  choice: socle
  rationale: Pris ici comme le substantif « socle, support », ce sens donne une syntaxe cohérente à כֵּן מִמָּעַל. La même forme peut toutefois être comprise comme l’adverbe « de même », possibilité signalée en note.
- source_word: מִמָּעַל
  choice: au-dessus
  rationale: Rend simplement la position supérieure indiquée par le texte.
- source_word: מִתַּחַת
  choice: sous
  rationale: Rend la position des ornements par rapport aux lions et aux bœufs.
- source_word: לֹיוֹת
  choice: guirlandes
  rationale: Ce nom rare semble désigner des ornements en feston ou en guirlande. « Guirlandes » convient au contexte tout en laissant l’incertitude lexicale en note.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: en relief qui retombaient
  rationale: La formule difficile semble décrire un ouvrage ornemental descendant ou pendant. Cette expression française communique à la fois son caractère travaillé et son orientation sans prétendre identifier précisément la technique.
