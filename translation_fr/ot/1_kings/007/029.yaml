revisions:
- from: Sur les panneaux qui se trouvaient entre les traverses figuraient des lions, des bœufs et des chérubins. Sur les traverses, au-dessus, se trouvait un socle[a] ; sous les lions et les bœufs, il y avait des guirlandes[b] en relief qui retombaient[c].
  to: Sur les panneaux qui étaient entre les traverses figuraient des lions, des bœufs et des chérubins. Des motifs semblables figuraient aussi sur les traverses, dans leur partie supérieure[a]. Sous les lions et les bœufs se trouvaient des guirlandes[b], un ouvrage en relief retombant[c].
  rationale: La correction retire « socle », interprétation insuffisamment fondée de כֵּן, et rend la proposition elliptique par « des motifs semblables », avec une note qui expose la littéralité et l’incertitude. Les termes architecturaux et les notes sur les ornements rares sont maintenus et harmonisés.
