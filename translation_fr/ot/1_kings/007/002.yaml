  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: fr
  text: Il construisit la Maison de la Forêt du Liban. Elle avait cent coudées de long, cinquante de large et trente de haut. Elle reposait sur quatre rangées de colonnes en cèdre[a], avec des poutres en cèdre[b] posées sur les colonnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Elle comportait quatre rangées de colonnes en cèdre »; la préposition hébraïque peut indiquer soit le support (« sur »), soit la disposition de l’ensemble (« avec »).
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « poutres » signifie littéralement « pièces taillées »; il pourrait désigner des poutres, des chevrons ou un autre élément de charpente en cèdre équarri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il construisit
  rationale: Le wayyiqtol fait progresser le récit et se rend naturellement par un passé simple dans ce registre narratif.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: la Maison de la Forêt du Liban
  rationale: La chaîne construite est conservée comme nom propre du bâtiment; « Maison » traduit בֵּית sans imposer ici la fonction plus précise de « palais ».
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: Elle avait cent coudées de long, cinquante de large et trente de haut
  rationale: Cette formulation française naturelle préserve les trois dimensions et l’unité ancienne tout en évitant le calque lourd « sa longueur était… ».
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: Elle reposait sur quatre rangées de colonnes en cèdre
  rationale: טוּרֵי désigne des rangées et עַמּוּדִים des colonnes ou piliers. « Reposait sur » exprime le sens spatial probable de עַל, tandis qu’une note maintient l’autre analyse possible.
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: avec des poutres en cèdre posées sur les colonnes
  rationale: כְרֻתוֹת désigne littéralement des pièces taillées; « poutres » convient au contexte architectural sans prétendre lever entièrement l’incertitude, signalée en note.
