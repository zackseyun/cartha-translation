base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: fr
  text: Il dressa les colonnes au portique du Temple[a]. Il dressa la colonne de droite et l’appela Yakin, puis il dressa la colonne de gauche et l’appela Boaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yakin et Boaz sont des translittérations des noms hébreux donnés aux colonnes; leurs sens possibles ne sont pas traduits ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: dressa
  rationale: Le hiphil de קום signifie ici « faire tenir debout », donc ériger ou mettre en place. « Dresser » convient naturellement à des colonnes et rend la répétition hébraïque.
- source_word: הָעַמֻּדִים
  choice: les colonnes
  rationale: עַמּוּד désigne ici les grandes colonnes architecturales du sanctuaire; « colonnes » est le terme français moderne le plus précis dans ce contexte.
- source_word: לְאֻלָם הַהֵיכָל
  choice: devant le portique du Temple
  rationale: אוּלָם désigne le portique ou vestibule situé en façade. La préposition לְ marque ici le rattachement ou l’emplacement; « devant le portique » explicite naturellement la position architecturale des colonnes sans modifier leur fonction.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: la colonne de droite
  rationale: יְמָנִי signifie littéralement « de droite ». Cette formulation conserve l’orientation relative du texte sans la convertir en point cardinal.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: l’appela
  rationale: L’idiome hébreu signifie littéralement « appela son nom ». En français moderne, « l’appela » rend clairement et dignement l’acte de donner un nom.
- source_word: יָכִין
  choice: Yakin
  rationale: Le nom de la colonne est translittéré plutôt que traduit. « Yakin » représente clairement la consonne hébraïque initiale yod en français et évite une prononciation ambiguë de « Jakin ».
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: la colonne de gauche
  rationale: שְׂמָאלִי signifie « de gauche ». La formulation forme un parallèle naturel avec « la colonne de droite ».
- source_word: בֹּעַז
  choice: Booz
  rationale: Le nom est translittéré selon sa forme française biblique bien établie, « Booz », plutôt que traduit.
