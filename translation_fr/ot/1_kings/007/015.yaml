  text: וַ/יָּ֛צַר אֶת שְׁנֵ֥י הָ/עַמּוּדִ֖ים נְחֹ֑שֶׁת שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה אַמָּ֗ה קוֹמַת֙ הָ/עַמּ֣וּד הָ/אֶחָ֔ד וְ/חוּט֙ שְׁתֵּים עֶשְׂרֵ֣ה אַמָּ֔ה יָסֹ֖ב אֶת הָ/עַמּ֥וּד הַ/שֵּׁנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: fr
  text: Il coula les deux colonnes de bronze. La première colonne avait dix-huit coudées de hauteur, et un cordon de douze coudées faisait le tour de la seconde colonne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faisait le tour de la seconde colonne ». L’enchaînement est surprenant : la hauteur vient d’être donnée pour l’une des colonnes, tandis que le cordon est dit entourer la seconde.'
    reason: La note signale fidèlement la tension syntaxique du texte hébreu sans l’harmoniser ni imposer une identification différente de la colonne.
lexical_decisions:
- source_word: וַיָּצַר
  choice: Il coula
  rationale: Dans le contexte du travail du bronze, le verbe désigne naturellement la coulée du métal plutôt qu’une simple mise en forme.
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: les deux colonnes
  rationale: « Colonnes » est le terme architectural français courant et naturel pour ces grands éléments du temple.
- source_word: נְחֹשֶׁת
  choice: de bronze
  rationale: Dans ce contexte architectural antique, le terme désigne vraisemblablement le bronze; « laiton » serait anachronique et « cuivre » trop restrictif.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: dix-huit coudées
  rationale: La mesure ancienne est conservée sans conversion afin de ne pas introduire une précision moderne artificielle.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: La première colonne avait ... de hauteur
  rationale: Cette formulation française naturelle rend la construction hébraïque « la hauteur de l’une des colonnes » et prépare la mention de la seconde.
- source_word: וְחוּט
  choice: et un cordon
  rationale: חוּט désigne un fil ou un cordon; ici, il sert à exprimer la mesure du pourtour.
- source_word: יָסֹב
  choice: faisait le tour
  rationale: Le verbe signifie littéralement « entourer, faire le tour ». La traduction conserve l’image concrète du cordon sans ajouter explicitement un verbe de mesure.
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: de la seconde colonne
  rationale: Le texte massorétique fourni porte explicitement « la seconde colonne »; cette formulation est donc retenue dans le texte principal plutôt que le pronom « elle ».
