  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: fr
  text: Ainsi fut achevé tout le travail que le roi Salomon avait réalisé pour la maison de Yahweh. Puis Salomon y apporta les choses saintes de David, son père — l’argent, l’or et les objets — et les déposa dans les salles du trésor de la maison de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: fut achevé
  rationale: Le verbe שׁלם exprime ici l’achèvement; le passif français s’accorde naturellement avec « tout le travail » et rend l’état résultant.
- source_word: כָּל הַמְּלָאכָה
  choice: tout le travail
  rationale: מְלָאכָה désigne ici l’ensemble des travaux de construction et d’aménagement du sanctuaire.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque, tandis que « Yahweh » rend directement le nom divin יְהוָה.
- source_word: וַיָּבֵא
  choice: y apporta
  rationale: Le hiphil de בוא signifie « faire venir, apporter »; le pronom adverbial « y » explicite naturellement en français la destination déjà mentionnée sans l’ajouter conceptuellement.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: les choses saintes de David, son père
  rationale: קָדְשֵׁי désigne des biens mis à part comme saints ou consacrés; la formulation directe conserve le lien lexical avec la sainteté sans préciser davantage que l’hébreu.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: l’argent, l’or et les objets
  rationale: כֵּלִים est un terme large pour des objets, récipients ou ustensiles. « Objets » évite de leur attribuer une fonction que le texte ne précise pas.
- source_word: נָתַן
  choice: les déposa
  rationale: נתן signifie littéralement « mettre, placer »; « déposer » convient au rangement de biens précieux dans des trésors.
- source_word: בְּאֹצְרוֹת
  choice: dans les trésors
  rationale: Le pluriel אֹצְרוֹת désigne les réserves ou salles du trésor rattachées au sanctuaire; « trésors » reste concis et proche du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Nature de קָדְשֵׁי דָּוִד
  choice: les choses saintes de David
  alternative: les biens consacrés par David
  rationale: Le génitif hébreu peut désigner les biens saints appartenant à David ou mis à part par lui. La traduction retenue conserve cette relation sans décider explicitement qui les a consacrés ni à quel moment.
translation_notes:
  register: Français international moderne, digne et lisible. La structure narrative est fluide, l’image traditionnelle de la « maison » est conservée, et le vocabulaire cultuel évite tout jargon confessionnel.
