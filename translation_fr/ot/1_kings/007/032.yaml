base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: fr
  text: Les quatre roues étaient sous les panneaux[a], et leurs essieux étaient sur le support[b]. Chaque roue avait une hauteur d’une coudée et demie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadres » ou « bordures » (hébreu מִסְגְּרוֹת).
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les mains des roues » en hébreu; dans ce contexte, l’expression désigne probablement leurs essieux ou leurs axes de soutien.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: roues / roue
  rationale: Dans cette description architecturale, אוֹפַן désigne les roues matérielles du support de bronze.
- source_word: לְמִתַּחַת
  choice: sous
  rationale: Cette préposition composée exprime clairement une position inférieure; « sous » est naturel et précis en français.
- source_word: הַמִּסְגְּרוֹת
  choice: les panneaux
  rationale: Dans le contexte de fabrication, מִסְגְּרוֹת désigne vraisemblablement les parties latérales encadrées; « panneaux » est lisible, tandis que « cadres » ou « bordures » restent possibles.
- source_word: וִידוֹת
  choice: leurs essieux
  rationale: Littéralement « mains des roues », l’expression désigne ici les pièces saillantes servant à fixer ou porter les roues; « essieux » rend le sens mécanique probable. Le possessif évite une répétition lourde.
- source_word: בַּמְּכוֹנָה
  choice: étaient fixés au support
  rationale: מְכוֹנָה désigne le support mobile de bronze. La formulation explicite le rapport d’attache indiqué en contexte, sans prétendre préciser davantage sa construction.
- source_word: קוֹמַת
  choice: avait une hauteur de
  rationale: קוֹמָה introduit ici la dimension verticale de la roue.
- source_word: הָאֶחָד
  choice: chaque
  rationale: Littéralement « l’une », le terme a ici une valeur distributive; « chaque roue » est le français idiomatique correspondant.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: une coudée et demie
  rationale: La mesure antique est conservée, et cette formulation française rend directement l’expression hébraïque.
