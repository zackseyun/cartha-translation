  text: וְ/זֶ֛ה מַעֲשֵׂ֥ה הַ/מְּכוֹנָ֖ה מִסְגְּרֹ֣ת לָ/הֶ֑ם וּ/מִסְגְּרֹ֖ת בֵּ֥ין הַ/שְׁלַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/028.yaml
  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
translation:
  language: fr
  text: 'Voici comment les supports étaient construits : ils avaient des cadres[a], et des cadres se trouvaient entre les traverses[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « panneaux »; le mot hébreu désigne des sections encadrées ou des éléments formant un cadre.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner des montants, des barreaux ou des pièces de liaison; la forme architecturale exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Voici comment
  rationale: Cette tournure française introduit naturellement la description annoncée par la conjonction et le démonstratif hébreux.
- source_word: מַעֲשֵׂה
  choice: était construit
  rationale: Dans ce contexte architectural, le nom désigne la facture ou le mode de construction; une formulation verbale est plus naturelle en français moderne.
- source_word: הַמְּכוֹנָה
  choice: le support
  rationale: Le terme désigne ici l'un des supports mobiles destinés aux bassins; « support » reste clair sans préciser au-delà du texte.
- source_word: מִסְגְּרֹת
  choice: cadres
  rationale: Le mot désigne vraisemblablement des éléments encadrants ou des sections délimitées; « cadres » maintient cette valeur formelle, tandis que « panneaux » demeure possible.
- source_word: לָהֶם
  choice: il avait
  rationale: Le syntagme prépositionnel exprime ici la possession; cette formulation est idiomatique en français.
- source_word: וּמִסְגְּרֹת
  choice: et des cadres se trouvaient
  rationale: La répétition du nom hébreu est conservée, avec un verbe ajouté pour obtenir une phrase française naturelle.
- source_word: בֵּין
  choice: entre
  rationale: La préposition indique directement la position de ces éléments par rapport aux pièces structurelles.
- source_word: הַשְׁלַבִּים
  choice: les traverses
  rationale: Le terme renvoie à des éléments de liaison dans la structure; « traverses » est architecturalement naturel, mais la forme précise reste incertaine.
