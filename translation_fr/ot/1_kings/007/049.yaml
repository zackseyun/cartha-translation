id: 1KI.7.49
reference: 1 Kings 7:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת הַ֠/מְּנֹרוֹת חָמֵ֨שׁ מִ/יָּמִ֜ין וְ/חָמֵ֧שׁ מִ/שְּׂמֹ֛אול לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֣ב סָג֑וּר וְ/הַ/פֶּ֧רַח וְ/הַ/נֵּרֹ֛ת וְ/הַ/מֶּלְקַחַ֖יִם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: fr
  text: ainsi que les porte-lampes[a], cinq à droite et cinq à gauche, devant le sanctuaire intérieur, en or pur[b] ; les fleurs, les lampes et les pinces[c], en or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chandeliers ». Il s’agit de supports pour des lampes à huile, et non pour des bougies.
    reason: lexical_alternative
  - marker: b
    text: Ou « or affiné ».
    reason: lexical_alternative
  - marker: c
    text: Ou « mouchettes », c’est-à-dire des instruments servant à entretenir les mèches.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: porte-lampes
  rationale: Le terme désigne les supports portant les lampes à huile, et non les lampes elles-mêmes. « Porte-lampes » évite l’anachronisme de « chandeliers ».
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: à droite ... à gauche
  rationale: Cette traduction conserve le repérage spatial relatif de l’hébreu sans le convertir implicitement en sud et nord.
- source_word: לִפְנֵי הַדְּבִיר
  choice: devant le sanctuaire intérieur
  rationale: דְּבִיר désigne la pièce la plus intérieure du Temple. Cette formulation est claire et ne lui impose pas dans le texte principal une appellation technique ultérieure.
- source_word: זָהָב סָגוּר
  choice: en or pur
  rationale: L’expression désigne un or de grande qualité, vraisemblablement affiné. « Or pur » est une formulation française naturelle et traditionnelle.
- source_word: הַפֶּרַח
  choice: les fleurs
  rationale: Le singulier hébreu a ici une valeur collective et désigne les ornements floraux des porte-lampes.
- source_word: הַנֵּרֹת
  choice: les lampes
  rationale: Il s’agit des lampes individuelles placées sur les porte-lampes.
- source_word: הַמֶּלְקַחַיִם
  choice: les pinces
  rationale: Le mot désigne un instrument à deux branches utilisé pour entretenir les lampes. « Pinces » en est l’équivalent lexical le plus direct.
- source_word: זָהָב
  choice: en or
  rationale: Le dernier terme qualifie collectivement les fleurs, les lampes et les pinces, conformément au style d’inventaire du passage.
theological_decisions:
- issue: Désignation du דְּבִיר
  choice: sanctuaire intérieur
  alternative: Très-Saint
  rationale: Le choix principal décrit sobrement la pièce la plus intérieure du Temple tout en préservant la possibilité de l’appellation cultuelle donnée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve le caractère énumératif du verset et son rattachement au contexte précédent. Les termes concrets sont privilégiés, avec les variantes traditionnelles ou fonctionnelles placées en notes.
