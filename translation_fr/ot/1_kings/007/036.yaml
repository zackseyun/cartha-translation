source:
  edition: WLC
  text: וַ/יְפַתַּ֤ח עַל הַ/לֻּחֹת֙ יְדֹתֶ֔י/הָ וְ/עַל֙ ו/מסגרתי/ה כְּרוּבִ֖ים אֲרָי֣וֹת וְ/תִמֹרֹ֑ת כְּ/מַֽעַר אִ֥ישׁ וְ/לֹי֖וֹת סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/036.yaml
  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: fr
  text: Sur les panneaux de ses supports et sur ses cadres, il grava des chérubins, des lions et des palmiers, selon l’espace disponible pour chacun[a], avec des guirlandes tout autour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile. Autre traduction possible : « là où il y avait de la place pour chaque motif ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des festons ». Le terme hébreu désigne probablement des ornements disposés autour des figures.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: il grava
  rationale: Dans ce contexte d’ornementation artisanale, le verbe désigne l’action d’inciser des motifs décoratifs.
- source_word: הַלֻּחֹת
  choice: les panneaux
  rationale: Le terme désigne ici des surfaces structurelles décorées, et non des tablettes portant une inscription.
- source_word: יְדֹתֶיהָ
  choice: ses supports
  rationale: Littéralement « ses mains » ; dans la description de la base, il s’agit vraisemblablement de pièces latérales ou saillantes servant de supports.
- source_word: מַסְגְּרֹתֶיהָ
  choice: ses cadres
  rationale: Le mot désigne les bordures structurelles qui encadrent les panneaux.
- source_word: כְּרוּבִים
  choice: des chérubins
  rationale: « Chérubins » est le terme français traditionnel et précis pour ces êtres associés au sanctuaire.
- source_word: אֲרָיוֹת
  choice: des lions
  rationale: Sens direct du terme dans cette liste de motifs décoratifs.
- source_word: תִמֹרֹת
  choice: des palmiers
  rationale: Dans le décor du sanctuaire, le nom désigne des motifs représentant des palmiers.
- source_word: כְּמַעַר אִישׁ
  choice: selon l’espace disponible pour chacun
  rationale: La formule hébraïque est difficile ; elle paraît indiquer que chaque motif était disposé en fonction de la place qui lui était réservée.
- source_word: לֹיֹת
  choice: des guirlandes
  rationale: Le nom semble désigner des ornements courbes ou suspendus entourant les figures ; « guirlandes » convient au contexte décoratif.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression rend naturellement l’idée d’une décoration disposée sur le pourtour.
theological_decisions: []
