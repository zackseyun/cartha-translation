    rationale: « Il en acheva l’ensemble » maintient une reprise référentielle de la demeure tout en exprimant que l’ensemble du complexe fut achevé.
  revised_text: Salomon construisit sa propre demeure[a] pendant treize ans, et il en acheva l’ensemble.
