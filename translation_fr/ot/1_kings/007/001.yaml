  text: וְ/אֶת בֵּית/וֹ֙ בָּנָ֣ה שְׁלֹמֹ֔ה שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יְכַ֖ל אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/001.yaml
  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: fr
  text: Salomon construisit sa propre demeure[a] pendant treize ans, et il en acheva l’ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son palais ». Ici, le mot hébreu traduit par « demeure » peut désigner une résidence royale ou un ensemble palatial.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: sa propre demeure
  rationale: בַּיִת signifie couramment « maison », mais peut désigner, dans un contexte royal, une résidence ou un ensemble palatial. « Demeure » reste naturel et digne en français, tandis que « propre » rend le contraste avec la construction du temple évoquée auparavant.
- source_word: בָּנָה
  choice: mit … à construire
  rationale: Le qatal qal 3ms présente le fait passé. Avec l’indication de durée, la tournure française « mit treize ans à construire » exprime naturellement la durée du chantier sans changer son aspect narratif.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: treize ans
  rationale: Dans la construction idiomatique « mettre … à », le français exprime directement par « treize ans » la durée totale des travaux.
- source_word: וַיְכַל
  choice: puis il l’acheva
  rationale: Le wayyiqtol de כלה fait progresser le récit et indique l’achèvement du projet après les treize années de travaux. « Puis » explicite sobrement cette succession.
- source_word: כָּל בֵּיתוֹ
  choice: il l’acheva entièrement
  rationale: כָּל marque ici la totalité de l’ouvrage. Le pronom reprend « sa propre demeure » et « entièrement » restitue la portée totalisante sans la tournure peu naturelle « toute sa demeure » après « achever ».
- source_word: וְאֶת
  choice: sa propre demeure
  rationale: La conjonction avec le marqueur d’objet introduit un sujet connexe en contraste avec le temple. En français, cette valeur discursive est rendue naturellement par « sa propre demeure » plutôt que par une traduction mécanique du marqueur.
