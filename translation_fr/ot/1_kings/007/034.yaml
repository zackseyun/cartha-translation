  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: fr
  text: Il y avait quatre supports aux quatre coins d’une même base ; ces supports faisaient partie intégrante de la base.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: supports / ses supports
  rationale: Le nom désigne littéralement des « épaules », mais, dans la description de cet ouvrage, il s’agit d’éléments structurels porteurs ; « supports » exprime naturellement leur fonction en français.
- source_word: מְכֹנָה
  choice: base
  rationale: Dans ce contexte, le terme désigne le châssis mobile ou socle portant une cuve. « Base » reste clair, concis et cohérent avec la description de l’objet.
- source_word: הָאֶחָת
  choice: l’unique base
  rationale: La formulation conserve la valeur explicite de « la une / l’unique » dans le texte massorétique, plutôt que de généraliser en « chaque base ».
- source_word: מִן הַמְּכֹנָה
  choice: faisaient corps avec la base elle-même
  rationale: La préposition indique que les supports provenaient de la base ou en constituaient une partie intégrante ; cette tournure française rend clairement l’unité de fabrication.
