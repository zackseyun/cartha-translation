base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: fr
  text: Il fit les colonnes, ainsi que deux rangées tout autour de l’un des treillis, pour couvrir les chapiteaux qui étaient au-dessus des grenades[a] ; il fit de même pour le second chapiteau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu de ce verset est difficile. « Les grenades » désigne probablement des éléments décoratifs en forme de grenade ; certains comprennent que les deux rangées de ces ornements entouraient le treillis de chaque chapiteau.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le verbe courant עשה introduit ici la fabrication dans la suite narrative ; « fit » est direct, naturel et digne.
- source_word: הָעַמּוּדִים
  choice: les colonnes
  rationale: Dans ce contexte architectural, « colonnes » est le terme français courant et précis. Le texte consonantique massorétique porte bien « les colonnes », malgré une difficulté textuelle signalée en note.
- source_word: שְׁנֵי טוּרִים
  choice: deux rangées
  rationale: טוּר désigne une disposition en ligne ; « rangées » convient à l’agencement des éléments décoratifs.
- source_word: סָבִיב
  choice: tout autour
  rationale: Cette expression rend clairement la disposition circulaire autour de l’ouvrage.
- source_word: הַשְּׂבָכָה הָאֶחָת
  choice: du premier treillis
  rationale: שׂבכה désigne un ouvrage ornemental en réseau. Dans la comparaison des deux ensembles correspondants, « premier » rend naturellement l’un des deux sans modifier le référent.
- source_word: לְכַסּוֹת
  choice: pour couvrir
  rationale: L’infinitif exprime vraisemblablement le but ; « couvrir » conserve son sens lexical direct.
- source_word: הַכֹּתָרֹת
  choice: les chapiteaux
  rationale: Dans un contexte de colonnes, כותרת désigne le chapiteau ; c’est le terme architectural français exact.
- source_word: אֲשֶׁר עַל רֹאשׁ
  choice: qui se trouvaient au-dessus de
  rationale: La formulation rend la relation spatiale de l’hébreu sans employer le calque peu naturel « sur la tête de ».
- source_word: הָרִמֹּנִים
  choice: les grenades
  rationale: Le mot signifie littéralement « grenades » et désigne probablement ici des ornements en forme de grenade ; le sens décoratif est précisé en note.
- source_word: וְכֵן עָשָׂה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: il fit de même pour le second chapiteau
  rationale: Cette formulation française concise conserve l’idée de répétition du même travail sur l’élément correspondant.
