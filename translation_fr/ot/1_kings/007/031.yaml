base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: fr
  text: Son ouverture[a] s’élevait d’une coudée depuis l’intérieur du chapiteau. Elle était ronde, d’une facture semblable à celle d’un socle[b], et mesurait une coudée et demie. L’ouverture portait aussi des motifs sculptés[c], et leurs encadrements étaient carrés, non ronds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sa bouche » ; l’hébreu emploie une image architecturale pour désigner l’ouverture.
    reason: lexical_alternative
  - marker: b
    text: Expression technique incertaine ; on pourrait aussi traduire « faite comme un support », « à la manière d’un socle » ou « ouvrage de piédestal ».
    reason: textual_or_technical_ambiguity
  - marker: c
    text: Le terme peut aussi désigner des gravures, des guirlandes ou des ornements entrelacés.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: ouverture
  rationale: Dans cette description architecturale, le mot désigne la « bouche » de l’élément, c’est-à-dire son ouverture. « Ouverture » est naturel en français tout en conservant le sens concret.
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: à partir de l’intérieur du chapiteau
  rationale: La construction indique l’intérieur de la partie supérieure appelée כֹּתֶרֶת. Cette formulation exprime clairement le point de départ spatial.
- source_word: וָמַעְלָה
  choice: s’élevait
  rationale: L’expression indique une extension vers le haut; le verbe français explicite naturellement l’idée verbale implicite sans préciser indûment la forme de la saillie.
- source_word: בָּאַמָּה
  choice: d’une coudée
  rationale: La préposition introduit ici la mesure de l’élévation.
- source_word: עָגֹל
  choice: ronde
  rationale: Équivalent direct et courant du terme indiquant une forme circulaire.
- source_word: מַעֲשֵׂה כֵן
  choice: exécutée comme un ouvrage de socle
  rationale: La formule technique est difficile. Cette traduction reste proche des deux éléments hébreux, « ouvrage » et « socle/support », sans imposer une reconstruction architecturale précise.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: une coudée et demie
  rationale: Rendu français normal de la mesure; le texte ne précise pas explicitement s’il s’agit du diamètre ou d’une autre dimension.
- source_word: מִקְלָעוֹת
  choice: motifs sculptés
  rationale: Le terme désigne un décor travaillé dont la forme exacte reste incertaine. « Motifs sculptés » communique l’idée ornementale sans la limiter à des guirlandes.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: leurs encadrements
  rationale: Le nom désigne des cadres ou bordures délimitant des parties de l’ouvrage. « Encadrements » conserve mieux le sens formel que « panneaux ».
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: étaient carrés, non ronds
  rationale: La traduction reproduit directement l’opposition explicite entre une forme à quatre côtés et une forme ronde.
