  register: Français international moderne, sobre et descriptif. La syntaxe a été légèrement segmentée pour rendre lisible cette description architecturale très technique. Les incertitudes concernant la forme du socle, la dimension d’une coudée et demie et la nature du décor ne sont pas résolues au-delà de ce que permet l’hébreu.
