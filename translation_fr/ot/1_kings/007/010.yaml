  yaml_path: translation/ot/1_kings/007/010.yaml
  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: fr
  text: Les fondations étaient faites de pierres de grande valeur[a], de grandes pierres, les unes de dix coudées et les autres de huit coudées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierres précieuses ». L’hébreu souligne leur grande valeur ou leur qualité supérieure ; dans ce contexte de construction, il ne s’agit vraisemblablement pas de gemmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: Les fondations étaient faites de
  rationale: Le participe passif de יסד décrit ici la fondation ou l'assise de l'édifice. Le pluriel « les fondations » est naturel en français architectural, tandis que « étaient faites de » restitue la construction passive sans alourdir la phrase.
- source_word: אֲבָנִים יְקָרוֹת
  choice: pierres de grande valeur
  rationale: יְקָרוֹת exprime la valeur, le prix ou la qualité élevée. Dans ce contexte de construction, cette formulation évite que « pierres précieuses » soit compris comme désignant des gemmes.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: de grandes pierres
  rationale: גְּדֹלוֹת indique ici la taille physique; « grandes pierres » est clair, courant et fidèle.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: les unes de dix coudées
  rationale: La chaîne construite indique une dimension sans préciser s'il s'agit de la longueur, de la largeur ou d'un autre axe. La traduction conserve cette indétermination.
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: et les autres de huit coudées
  rationale: La tournure française exprime naturellement les deux catégories parallèles de pierres sans ajouter de dimension non indiquée par l'hébreu.
- source_word: אַמּוֹת
  choice: coudées
  rationale: « Coudée » est le terme français conventionnel pour l'unité ancienne אַמָּה et préserve la mesure du texte source sans conversion interprétative.
