  text: וַ/יַּנַּ֤ח שְׁלֹמֹה֙ אֶת כָּל הַ/כֵּלִ֔ים מֵ/רֹ֖ב מְאֹ֣ד מְאֹ֑ד לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: fr
  text: Salomon laissa tous les objets sans les peser, car ils étaient extrêmement nombreux[a] ; le poids du bronze ne fut pas déterminé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Salomon laissa tous les objets, car ils étaient extrêmement nombreux ; le poids du bronze ne fut pas recherché ni établi. »'
    reason: Alternative lexicale préservant une lecture plus formelle de וַיַּנַּח et לֹא נֶחְקַר.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: laissa … sans les peser
  rationale: Le verbe indique que Salomon renonça à poursuivre une opération concernant les objets. La proposition suivante précisant que le poids du bronze ne fut pas déterminé, cette formulation explicite naturellement en français ce qui fut laissé de côté, sans introduire d’idée étrangère au contexte.
- source_word: כָּל הַכֵּלִים
  choice: tous les objets
  rationale: כֵּלִים est un terme large désignant des objets, ustensiles ou pièces d’équipement. « Objets » convient au contexte du mobilier du temple et reste naturel en français moderne.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: car ils étaient extrêmement nombreux
  rationale: La préposition מִן avec רֹב exprime ici la cause, tandis que le redoublement de מְאֹד marque une forte intensification. La traduction conserve à la fois le rapport causal et l’emphase.
- source_word: לֹא נֶחְקַר
  choice: ne fut pas déterminé
  rationale: Le niphal de חקר signifie ici qu’une donnée ne fut pas établie ou vérifiée. Appliqué au poids, « ne fut pas déterminé » exprime clairement qu’aucun total précis ne fut établi.
- source_word: מִשְׁקַל
  choice: le poids
  rationale: Le nom désigne directement le poids ou la quantité mesurée selon le poids. « Le poids » est l’équivalent français le plus direct.
- source_word: הַנְּחֹשֶׁת
  choice: du bronze
  rationale: Dans le contexte du mobilier du temple, נְחֹשֶׁת désigne conventionnellement le bronze plutôt que le cuivre pur.
theological_decisions: []
