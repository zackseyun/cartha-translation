base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: fr
  text: Hiram fabriqua les cuves, les pelles et les coupes[a]. Ainsi, Hiram acheva tout le travail qu’il fit pour le roi Salomon, pour la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « bassins d’aspersion » : il s’agit de récipients employés dans les rites sacrificiels.'
    reason: Alternative lexicale précisant la fonction cultuelle possible de מִזְרָקוֹת.
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: cuves
  rationale: Le terme désigne ici de grands récipients associés au mobilier du sanctuaire. « Cuves » est naturel en français moderne et les distingue des coupes mentionnées ensuite.
- source_word: יָּעִים
  choice: pelles
  rationale: Le mot désigne des ustensiles servant notamment à enlever les cendres ou les braises; « pelles » convient clairement au contexte cultuel.
- source_word: מִּזְרָקוֹת
  choice: coupes
  rationale: Le terme désigne des récipients employés pour recueillir ou répandre le sang et d’autres liquides sacrificiels. « Coupes » reste lisible sans imposer une fonction trop précise; la nuance rituelle est donnée en note.
- source_word: וַיְכַל
  choice: acheva
  rationale: Le verbe exprime l’achèvement de la tâche; « acheva » est concis, digne et idiomatique.
- source_word: כָּל הַמְּלָאכָה
  choice: tout le travail
  rationale: Cette formulation conserve la portée générale de מְלָאכָה sans la limiter au seul artisanat.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » traduit directement בֵּית et conserve l’expression hébraïque, tandis que « Yahweh » représente le nom divin יְהוָה.
- source_word: חִירוֹם / חִירָם
  choice: Hiram
  rationale: Les deux graphies hébraïques renvoient ici au même artisan; « Hiram » est la forme française conventionnelle.
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: qu’il faisait pour le roi Salomon
  rationale: Dans la proposition récapitulative, « faisait » rend naturellement le verbe עשה et le datif indique que le travail était accompli pour le roi.
- source_word: לַעֲשׂוֹת ... בֵּית יְהוָה
  choice: en vue de la maison de Yahweh
  rationale: Cette tournure évite de suggérer que le travail se déroulait simplement à l’intérieur du sanctuaire et exprime sa destination.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. Le vocabulaire concret distingue les grands récipients (« cuves ») des récipients rituels plus petits (« coupes »). La syntaxe finale conserve la destination du travail sans laisser entendre qu’il fut nécessairement exécuté dans le sanctuaire.
