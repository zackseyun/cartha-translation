  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: fr
  text: Au sommet des colonnes se trouvait un décor de lis[a], et le travail des colonnes fut achevé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un décor en forme de lis », « un ornement en forme de lis » ou « un motif de lis ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la fabrication des colonnes fut achevée » ou « l’ouvrage des colonnes fut terminé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: sommet
  rationale: Dans ce contexte architectural, le mot désigne la partie supérieure des colonnes sans imposer le terme technique « chapiteau ».
- source_word: הָעַמּוּדִים
  choice: les colonnes
  rationale: « Colonnes » est le terme architectural naturel en français moderne pour les deux éléments décrits dans ce passage.
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: un décor en forme de lis
  rationale: L’expression désigne vraisemblablement un ouvrage ornemental représentant un lis; cette formulation est claire tout en conservant l’image du texte hébreu.
- source_word: וַתִּתֹּם
  choice: Ainsi fut achevé
  rationale: Le verbe exprime l’achèvement. La tournure passive française rend naturellement le sens, tandis que « Ainsi » marque la conclusion de la description.
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: le travail des colonnes
  rationale: La formulation conserve la portée générale de מְלָאכָה, qui peut désigner le travail de fabrication ou l’ouvrage réalisé, sans préciser davantage que l’hébreu.
