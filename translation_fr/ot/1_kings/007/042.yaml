  text: וְ/אֶת הָ/רִמֹּנִ֛ים אַרְבַּ֥ע מֵא֖וֹת לִ/שְׁתֵּ֣י הַ/שְּׂבָכ֑וֹת שְׁנֵֽי טוּרִ֤ים רִמֹּנִים֙ לַ/שְּׂבָכָ֣ה הָֽ/אֶחָ֔ת לְ/כַסּ֗וֹת אֶת שְׁתֵּי֙ גֻּלֹּ֣ת הַ/כֹּֽתָרֹ֔ת אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/עַמּוּדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: fr
  text: les quatre cents grenades pour les deux treillis[a], deux rangées de grenades pour chaque treillis, afin de couvrir les deux renflements des chapiteaux[b] qui se trouvaient au sommet des colonnes ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ouvrages en forme de filet ». Le terme hébreu désigne un décor ajouré sur les chapiteaux.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu évoque des formes arrondies ; il peut aussi désigner des vasques ou des globes.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: grenades
  rationale: Le nom désigne littéralement des grenades. Dans ce contexte, il s’agit d’ornements en forme de grenade, mais le texte conserve simplement le terme concret.
- source_word: שְׂבָכוֹת
  choice: treillis
  rationale: Le mot désigne un ouvrage ornemental ajouré, semblable à un filet ou à un treillis. « Treillis » est naturel et précis en français architectural.
- source_word: טוּרִים
  choice: rangées
  rationale: Le terme décrit des éléments disposés en lignes ordonnées ; « rangées » exprime clairement cet agencement.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: pour chaque treillis
  rationale: 'La formulation littérale « pour le treillis, l’un » a ici une valeur distributive : les deux rangées sont associées à chacun des deux treillis.'
- source_word: לְכַסּוֹת
  choice: afin de couvrir
  rationale: L’infinitif exprime la fonction ou le but des rangées de grenades. « Afin de couvrir » conserve explicitement cette relation.
- source_word: גֻּלֹּת
  choice: renflements
  rationale: Le nom évoque des formes arrondies, comparables à des vasques ou à des globes. « Renflements » rend la forme architecturale sans les confondre avec les chapiteaux entiers.
- source_word: כֹּתָרֹת
  choice: chapiteaux
  rationale: Dans ce contexte architectural, le mot désigne les éléments qui couronnent les colonnes ; « chapiteaux » est le terme français standard.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: au sommet des colonnes
  rationale: Dans cette description, l’expression situe les chapiteaux sur les colonnes. Cette formulation française transmet clairement la relation spatiale visée.
theological_decisions: []
