  yaml_path: translation/ot/1_kings/007/011.yaml
  text: And above were costly stones[a], cut according to measure, and cedar.
translation:
  language: fr
  text: Au-dessus, il y avait des pierres de grande valeur[a], taillées sur mesure, ainsi que du bois de cèdre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des pierres de grande valeur, aux dimensions de pierres de taille ».'
    reason: La relation syntaxique entre כְּמִדּוֹת (« selon les dimensions ») et גָּזִית (« pierre taillée ») permet une traduction plus littérale que « taillées sur mesure ».
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: Au-dessus
  rationale: Dans cette description architecturale, l’expression situe naturellement les matériaux dans la partie supérieure de la construction.
- source_word: אֲבָנִים יְקָרוֹת
  choice: des pierres de grande valeur
  rationale: יְקָרוֹת désigne ici des pierres coûteuses ou de qualité supérieure, sans nécessairement évoquer des pierres précieuses au sens de gemmes.
- source_word: כְּמִדּוֹת גָּזִית
  choice: taillées sur mesure
  rationale: Cette formulation française naturelle exprime l’idée de pierres travaillées selon des dimensions déterminées, tout en signalant en note la construction hébraïque plus littérale et ambiguë.
- source_word: וָאָרֶז
  choice: ainsi que du bois de cèdre
  rationale: Le français précise naturellement qu’il s’agit du matériau de construction; « ainsi que » coordonne clairement le cèdre avec les pierres.
