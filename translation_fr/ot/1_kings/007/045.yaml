  text: וְ/אֶת הַ/סִּיר֨וֹת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַ/מִּזְרָק֗וֹת וְ/אֵת֙ כָּל הַ/כֵּלִ֣ים ה/אהל אֲשֶׁ֨ר עָשָׂ֥ה חִירָ֛ם לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מְמֹרָֽט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: fr
  text: les chaudrons, les pelles, les bassins[a], ainsi que tous les ustensiles que Hiram fabriqua pour le roi Salomon, pour la maison de Yahweh, étaient en bronze poli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les coupes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en bronze lustré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: les chaudrons
  rationale: Le terme désigne des récipients profonds, notamment des marmites ou chaudrons. « Chaudrons » convient à cette liste d’ustensiles du sanctuaire sans préciser indûment leur usage.
- source_word: הַיָּעִים
  choice: les pelles
  rationale: Il s’agit d’instruments servant notamment à retirer ou à déplacer les cendres de l’autel. « Pelles » est le terme français usuel dans ce contexte.
- source_word: הַמִּזְרָקוֹת
  choice: les bassins
  rationale: Ces récipients servaient à recueillir ou à répandre des liquides. « Bassins » exprime bien leur fonction cultuelle, tandis que « coupes » demeure possible.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: tous les ustensiles
  rationale: כֵּלִים est un terme général désignant ici les objets et instruments employés dans le sanctuaire. « Ustensiles » est naturel et précis en français.
- source_word: עָשָׂה
  choice: fabriqua
  rationale: Le verbe courant signifie « faire » ou « fabriquer ». « Fabriqua » convient particulièrement à des objets métalliques et reste sobre.
- source_word: חִירָם
  choice: Hiram
  rationale: « Hiram » est la translittération française courante de ce nom dans les livres des Rois.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: pour le roi Salomon
  rationale: La préposition indique naturellement le commanditaire ou bénéficiaire du travail.
- source_word: בֵּית יְהוָה
  choice: pour la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque, tout en étant intelligible comme désignation du sanctuaire. Le contexte indique que les objets lui étaient destinés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte des objets cultuels antiques, « bronze » est l’équivalent français conventionnel et historiquement plausible.
- source_word: מְמֹרָט
  choice: poli
  rationale: Le terme décrit un métal rendu lisse et brillant. « Poli » est clair et naturel en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin lui-même. « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Fonction syntaxique de נְחֹשֶׁת מְמֹרָט
  choice: étaient en bronze poli
  alternative: en bronze poli
  rationale: La formule nominale finale caractérise l’ensemble des objets énumérés. L’ajout de « étaient » rend cette prédication explicite et naturelle en français sans modifier son étendue.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la forme d’une énumération poursuivie depuis le contexte précédent. Le passé simple convient au registre narratif biblique sans être archaïque; la prédication finale est explicitée par « étaient » pour assurer une syntaxe française naturelle.
