  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: fr
  text: 'Il était lambrissé de cèdre au-dessus[a] des structures latérales qui reposaient sur les colonnes : quarante-cinq en tout, quinze par rangée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il était recouvert de cèdre par le haut, au-dessus des éléments latéraux qui étaient sur les colonnes. » Les termes architecturaux hébreux sont difficiles à interpréter, en particulier צלעות, qui peut signifier « côtés », « nervures », « éléments latéraux » ou « chambres latérales ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: Il était lambrissé
  rationale: Le participe passif de ספן exprime un revêtement. « Lambrissé » convient à un habillage architectural en cèdre sans imposer l’idée plus étroite d’une toiture.
- source_word: בָּאֶרֶז
  choice: de cèdre
  rationale: La préposition ב marque ici le matériau ; « de cèdre » est la tournure française naturelle avec « lambrissé ».
- source_word: מִמַּעַל
  choice: par-dessus
  rationale: L’adverbe situe le revêtement dans la partie supérieure de l’ensemble architectural, sans préciser davantage une disposition incertaine.
- source_word: עַל הַצְּלָעֹת
  choice: au-dessus des structures latérales
  rationale: צלעות signifie littéralement « côtés » ou « nervures » et peut désigner des annexes ou éléments latéraux dans un bâtiment. « Structures latérales » conserve cette indétermination mieux que « chambres ».
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: qui reposaient sur les colonnes
  rationale: Cette formulation rend la relation spatiale exprimée par עַל en français naturel, tout en laissant le relatif se rapporter aux structures latérales.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: quarante-cinq en tout
  rationale: Le nombre indique vraisemblablement le total des éléments mentionnés ; « en tout » explicite sobrement sa relation avec les quinze de chaque rangée.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: quinze par rangée
  rationale: טור désigne une rangée ou un alignement. La formule française exprime clairement la répartition du total en trois rangées de quinze, sans ajouter explicitement le nombre de rangées.
