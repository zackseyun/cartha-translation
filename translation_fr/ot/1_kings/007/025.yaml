source:
  edition: WLC
  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: fr
  text: 'Elle reposait sur douze bœufs : trois tournés vers le nord, trois vers l’ouest[a], trois vers le sud et trois vers l’est. La Mer était sur eux, au-dessus, et tous avaient l’arrière-train tourné vers l’intérieur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « vers la mer », manière courante dans la Bible de désigner l’ouest.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toutes leurs parties arrière étaient orientées vers l’intérieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: Elle reposait
  rationale: Le participe qal décrit la position de la Mer sur les figures de bœufs. « Reposait » exprime naturellement en français sa position stable et la relation de support, sans ajouter l’idée qu’on l’y aurait installée.
- source_word: בָּקָר
  choice: bœufs
  rationale: Le terme désigne ici les douze figures bovines qui soutiennent la grande cuve. « Bœufs » est le terme traditionnel et naturel dans ce contexte architectural, tandis que le lexème hébreu n’impose pas précisément « taureaux ».
- source_word: פֹנִים
  choice: tournés vers
  rationale: Bien que le mot soit littéralement lié à la face, la construction répétée décrit l’orientation des figures. « Tournés vers » convient aux quatre points cardinaux et reste idiomatique.
- source_word: יָמָּה
  choice: vers l’ouest
  rationale: La forme signifie littéralement « vers la mer », mais sert couramment en hébreu biblique à désigner l’ouest. La série des quatre points cardinaux confirme ce sens.
- source_word: הַיָּם
  choice: la Mer
  rationale: Dans ce contexte, le mot est le nom donné à la grande cuve de bronze du Temple. La majuscule signale cet emploi particulier tout en conservant l’image hébraïque.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: était sur eux, au-dessus
  rationale: Cette formulation suit directement l’hébreu, qui indique que la Mer se trouvait sur les bœufs et au-dessus d’eux, sans verbe explicite signifiant « poser » ou « installer ».
- source_word: אֲחֹרֵיהֶם
  choice: l’arrière-train
  rationale: Le terme désigne les parties arrière des figures animales. « Arrière-train » est clair, courant et digne en français, sans préciser davantage leur anatomie.
- source_word: בָּיְתָה
  choice: vers l’intérieur
  rationale: La forme directionnelle indique que l’arrière des douze figures était orienté vers le centre, sous la cuve.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition complète de « tournés » n’est conservée qu’au premier membre, puis sous-entendue dans les trois suivants pour alléger la phrase sans perdre la structure des quatre groupes. « Elle » reprend la Mer mentionnée dans le contexte immédiat.
