  text: There were three rows of window frames[a], with window opposite window three times.
translation:
  language: fr
  text: Il y avait trois rangées d’encadrements de fenêtres, une fenêtre en face d’une autre, trois fois[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une fenêtre en face d’une autre sur trois niveaux ». L’hébreu dit littéralement : « fenêtre vers fenêtre, trois fois » ; il décrit probablement une disposition répétée sur trois niveaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁקֻפִים
  choice: encadrements de fenêtres
  rationale: Dans ce contexte architectural, le terme désigne vraisemblablement des ouvertures encadrées ou leurs cadres. « Encadrements de fenêtres » conserve cette nuance structurelle, tandis que « fenêtres » serait plus général et « linteaux » trop précis.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: trois rangées
  rationale: טוּר désigne une suite ordonnée ou une rangée. « Trois rangées » est clair et naturel en français architectural, sans imposer l’interprétation plus précise de trois niveaux superposés.
- source_word: מֶחֱזָה
  choice: fenêtre
  rationale: Le mot évoque une ouverture permettant de voir ou de laisser entrer la lumière. En parallèle avec שְׁקֻפִים, « fenêtre » est le terme français le plus clair.
- source_word: מֶחֱזָה אֶל מֶחֱזָה
  choice: une fenêtre faisant face à une autre
  rationale: Cette formulation rend l’orientation réciproque exprimée par אֶל tout en évitant la tournure française peu naturelle « fenêtre vers fenêtre ».
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: trois fois
  rationale: La traduction littérale « trois fois » préserve l’imprécision du texte hébreu. La note indique l’interprétation architecturale possible « sur trois niveaux ».
