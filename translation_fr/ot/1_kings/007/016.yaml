  text: וּ/שְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָ/תֵ֛ת עַל רָאשֵׁ֥י הָֽ/עַמּוּדִ֖ים מֻצַ֣ק נְחֹ֑שֶׁת חָמֵ֣שׁ אַמּ֗וֹת קוֹמַת֙ הַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת קוֹמַ֖ת הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: fr
  text: Il fit deux chapiteaux[a] en bronze coulé pour les placer au sommet des colonnes. L’un des chapiteaux avait cinq coudées de haut, et le second avait cinq coudées de haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couronnes »; le terme hébreu désigne ici la partie ornementale placée au sommet d’une colonne.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: chapiteaux / chapiteau
  rationale: Dans ce contexte architectural, le terme désigne la partie ornementale placée au sommet d’une colonne. « Chapiteau » est le terme français moderne précis; « couronne » serait plus littéral, mais pourrait induire en erreur.
- source_word: עָשָׂה
  choice: fit
  rationale: Le verbe courant exprime simplement la fabrication, sans ajouter une nuance technique absente de l’hébreu.
- source_word: לָתֵת
  choice: pour les placer
  rationale: L’infinitif indique ici le but de la fabrication. Le pronom explicite naturellement en français que ce sont les deux chapiteaux qui sont placés.
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: au sommet des colonnes
  rationale: « Sommet » rend naturellement le sens architectural de « têtes », tandis que « colonnes » convient précisément aux éléments décrits.
- source_word: מֻצַק נְחֹשֶׁת
  choice: en bronze coulé
  rationale: Cette formulation indique à la fois la matière et le procédé de fabrication.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinq coudées
  rationale: La mesure ancienne du texte source est conservée plutôt que convertie en unité moderne.
- source_word: קוֹמַת
  choice: de haut
  rationale: Dans une phrase donnant une mesure architecturale, cette tournure française est naturelle et rend exactement l’idée de hauteur.
- source_word: הָאֶחָת
  choice: l’un
  rationale: L’hébreu dit littéralement « l’un », sans le désigner explicitement comme le premier.
- source_word: הַשֵּׁנִית
  choice: le second
  rationale: L’hébreu désigne explicitement le deuxième élément de la paire; « le second » préserve cette précision.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « cinq coudées de haut » est conservée afin de refléter l’insistance symétrique du texte hébreu.
