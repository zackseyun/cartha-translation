base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: fr
  text: les bassins, les mouchettes, les coupes[a], les coupelles et les pelles à feu, en or pur ; ainsi que les ferrures de pivot[b] des portes de la Maison intérieure, c’est-à-dire du lieu très saint[c], et de celles des portes de la Maison, c’est-à-dire de la grande salle, en or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les coupes d’aspersion ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne probablement des pivots, leurs logements ou des garnitures semblables permettant aux portes de tourner, plutôt que des charnières latérales modernes.
    reason: cultural_note
  - marker: c
    text: 'Expression traditionnelle : « le Saint des saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: les bassins
  rationale: Dans cette liste d’objets du Temple, le terme désigne probablement des récipients. « Bassins » le distingue de מִזְרָקוֹת plus loin dans le verset.
- source_word: הַמְזַמְּרוֹת
  choice: les mouchettes
  rationale: Dans un contexte cultuel, il s’agit d’ustensiles servant à tailler ou retirer les mèches consumées des lampes. « Mouchettes » est le terme français précis.
- source_word: הַמִּזְרָקוֹת
  choice: les coupes
  rationale: Le mot désigne des récipients employés notamment pour recueillir ou asperger des liquides dans le culte. La note conserve la nuance plus précise possible.
- source_word: הַכַּפּוֹת
  choice: les petites coupes
  rationale: Le nom désigne un petit récipient creux. Cette formulation naturelle évite de préciser indûment qu’il s’agissait de cuillères ou de brûle-parfums.
- source_word: הַמַּחְתּוֹת
  choice: les brasiers
  rationale: Ces récipients servaient à transporter des braises ou du feu. « Brasiers » exprime clairement cette fonction sans les limiter à l’encens.
- source_word: זָהָב סָגוּר
  choice: en or pur
  rationale: L’expression désigne un or de haute qualité, affiné ; « or pur » est idiomatique en français.
- source_word: הַפֹּתוֹת
  choice: les pièces de pivot
  rationale: Le terme désigne vraisemblablement les garnitures dans lesquelles pivotaient les portes, plutôt que des charnières latérales modernes. Une note signale l’incertitude sur la forme exacte.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: la Maison intérieure
  rationale: Cette traduction conserve l’image hébraïque de la Maison tout en laissant la proposition suivante identifier cet espace.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: du lieu très saint
  rationale: Le français courant rend naturellement ainsi la construction superlative hébraïque. La formulation traditionnelle figure en note.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: des portes de la Maison, c’est-à-dire de la grande salle
  rationale: הֵיכָל désigne ici la salle principale du Temple, distincte de la pièce intérieure. « C’est-à-dire » explicite l’apposition hébraïque sans modifier son référent.
- source_word: זָהָב
  choice: en or
  rationale: Le dernier mot indique la matière des garnitures de porte ; le français exige ici la préposition « en ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. « Maison » avec majuscule maintient la désignation du Temple dans ce contexte. « Mouchettes » est un terme technique encore intelligible, tandis que « grande salle » évite l’anachronisme ecclésial possible de « nef ».
