base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: fr
  text: Il fit ensuite la Mer, moulée en métal[a]. Elle mesurait dix coudées d’un bord à l’autre, était ronde sur tout son pourtour et haute de cinq coudées. Un cordeau de trente coudées[c][b] en faisait tout le tour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bassin ». L’hébreu appelle ce grand récipient du temple « la Mer »; cette appellation formelle est conservée dans le texte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un cordeau de trente coudées »; autrement dit, son pourtour mesurait trente coudées.'
    reason: cultural_note
  - marker: c
    text: La forme écrite ici est קוה (« cordeau »), comprise traditionnellement au sens de cordeau de mesure; voir le passage parallèle en 2 Chroniques 4.2.
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: la Mer
  rationale: Le mot désigne ici le grand bassin du temple, mais le rendu formel « la Mer » conserve l’appellation métaphorique propre au texte hébreu.
- source_word: מוּצָק
  choice: en métal coulé
  rationale: Le participe indique un objet fabriqué par coulage du métal. Cette expression est claire en français moderne et précise naturellement le procédé.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: dix coudées d’un bord à l’autre
  rationale: La formulation exprime la mesure transversale entre les deux bords du récipient sans alourdir le français par une répétition littérale.
- source_word: עָגֹל סָבִיב
  choice: ronde sur tout son pourtour
  rationale: Ce rendu conserve à la fois la forme circulaire et l’insistance de סָבִיב.
- source_word: קוֹמָתוֹ
  choice: haute de cinq coudées
  rationale: Dans ce contexte architectural, la tournure adjectivale est plus naturelle que « sa hauteur était de » tout en restant exacte.
- source_word: וקוה
  choice: un cordeau
  rationale: Le terme renvoie à une ligne ou corde servant à mesurer. « Cordeau » garde l’image concrète de l’instrument de mesure.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: en faisait tout le tour
  rationale: La formulation française rend le verbe d’encerclement et l’insistance adverbiale sans répétition maladroite.
- source_word: אַמָּה
  choice: coudée
  rationale: « Coudée » est le terme français consacré pour cette unité ancienne; aucune conversion moderne n’est introduite dans le texte principal.
