  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
translation:
  language: fr
  text: Toutes les ouvertures et tous les montants avaient des encadrements carrés[a]. Une fenêtre faisait face à une autre, trois fois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avaient des linteaux carrés »; le terme architectural hébreu peut désigner plus précisément la partie supérieure de l’encadrement, c’est-à-dire le linteau.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une fenêtre en face d’une fenêtre, trois fois »; il peut s’agir de fenêtres correspondantes disposées sur trois niveaux ou en trois rangées.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: ouvertures
  rationale: Le nom désigne des ouvertures ou des entrées; « ouvertures » convient au contexte architectural sans supposer des vantaux.
- source_word: מְּזוּזוֹת
  choice: montants
  rationale: Le terme désigne les poteaux latéraux ou jambages d’une ouverture; « montants » est naturel et précis en français actuel.
- source_word: רְבֻעִים
  choice: carré
  rationale: L’adjectif indique une forme à quatre côtés ou quatre angles; l’accord au singulier rattache ici la qualité à « encadrement ».
- source_word: שָׁקֶף
  choice: encadrement
  rationale: Ce terme architectural rare peut viser l’encadrement, et peut-être plus précisément sa partie supérieure ou son linteau; « encadrement » évite une précision incertaine.
- source_word: מוּל מֶחֱזָה אֶל מֶחֱזָה
  choice: Une fenêtre faisait face à une autre
  rationale: מֶחֱזָה désigne vraisemblablement une ouverture permettant de voir, donc une fenêtre; מוּל exprime la correspondance ou la position en vis-à-vis.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: trois fois
  rationale: Cette traduction conserve l’expression hébraïque littérale et son ambiguïté, plutôt que d’imposer l’interprétation spatiale « sur trois rangées ».
