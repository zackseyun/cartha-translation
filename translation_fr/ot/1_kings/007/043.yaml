  text: and the ten stands[a], and the ten basins on the stands,
translation:
  language: fr
  text: et les dix supports[a], et les dix bassins sur les supports,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « socles » ; traditionnellement « cuves » pour « bassins ».
    reason: Signaler les principaux équivalents français possibles des termes techniques désignant ce mobilier du temple.
lexical_decisions:
- source_word: וְ/אֶת
  choice: ainsi que
  rationale: אֵת marque le complément d’objet défini sans équivalent direct en français, tandis que וְ poursuit l’énumération. « Ainsi que » rend naturellement ce lien avec les éléments précédents.
- source_word: הַ/מְּכֹנוֹת
  choice: les supports
  rationale: Dans ce contexte, מְכֹנוֹת désigne les structures mobiles décrites aux versets précédents et destinées à porter les bassins. « Supports » exprime clairement leur fonction sans préciser excessivement leur mobilité.
- source_word: עָשֶׂר
  choice: dix
  rationale: Nombre cardinal qualifiant מְכֹנוֹת.
- source_word: וְ/אֶת הַ/כִּיֹּרֹת עֲשָׂרָה
  choice: et les dix bassins
  rationale: כִּיּוֹר désigne ici un récipient destiné au lavage. « Bassins » est moderne, clair et adapté au mobilier du temple.
- source_word: עַל
  choice: posés sur
  rationale: La préposition indique que les bassins se trouvent au-dessus des supports. L’ajout contextuel de « posés » produit une formulation française naturelle sans modifier la relation spatiale.
- source_word: הַ/מְּכֹנוֹת
  choice: les supports
  rationale: Le terme répété est traduit de la même manière afin de préserver la cohérence interne du verset.
