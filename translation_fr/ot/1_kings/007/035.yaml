source:
  edition: WLC
  text: וּ/בְ/רֹ֣אשׁ הַ/מְּכוֹנָ֗ה חֲצִ֧י הָ/אַמָּ֛ה קוֹמָ֖ה עָגֹ֣ל סָבִ֑יב וְ/עַ֨ל רֹ֤אשׁ הַ/מְּכֹנָה֙ יְדֹתֶ֔י/הָ וּ/מִסְגְּרֹתֶ֖י/הָ מִמֶּֽ/נָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: fr
  text: Au sommet du socle se trouvait un élément circulaire qui en faisait tout le tour et mesurait une demi-coudée de haut. Au sommet du socle, ses supports[a] et ses panneaux[b] faisaient corps avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ses mains »; le mot peut aussi désigner ses poignées, ses bras ou d’autres pièces en saillie.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses cadres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: Au sommet du socle
  rationale: רֹאשׁ désigne ici le sommet, et מְכוֹנָה le socle mobile en bronze décrit dans ce passage. « Socle » est naturel en français et le distingue de ses éléments de soutien.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: mesurait une demi-coudée de haut
  rationale: Cette formulation française exprime clairement la dimension verticale indiquée par קוֹמָה, tout en conservant l’unité ancienne.
- source_word: עָגֹל סָבִיב
  choice: un élément circulaire qui en faisait tout le tour
  rationale: Le texte hébreu qualifie de circulaire une partie dont le nom n’est pas exprimé. « Élément » évite de préciser sans certitude s’il s’agissait d’un rebord, d’un bandeau ou d’une autre pièce, tandis que « qui en faisait tout le tour » rend סָבִיב.
- source_word: יְדֹתֶיהָ
  choice: ses supports
  rationale: יָד signifie littéralement « main », mais peut désigner une partie saillante ou fonctionnelle d’un objet. « Supports » convient au contexte architectural sans éliminer les autres possibilités, signalées en note.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: ses panneaux
  rationale: מִסְגְּרוֹת peut désigner les sections encadrées ou les cadres du socle. « Panneaux » est clair dans la description, avec « cadres » conservé en note comme autre traduction possible.
- source_word: מִמֶּנָּה
  choice: faisaient corps avec lui
  rationale: L’expression indique que ces pièces provenaient du socle lui-même ou lui étaient intégrées, plutôt que d’avoir été ajoutées séparément. « Faisaient corps avec lui » rend naturellement cette relation sans imposer un procédé de fabrication précis.
