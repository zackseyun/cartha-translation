  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: fr
  text: Il fit dix supports[a] de bronze. Chaque support mesurait quatre coudées de long, quatre de large et trois de haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bases ». Le terme hébreu désigne ici les structures de bronze servant de supports aux bassins dans l’ensemble du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Il fit
  rationale: Le wayyiqtol de עשה fait avancer le récit. Le passé simple convient au registre narratif biblique en français tout en restant clair.
- source_word: הַמְּכֹנוֹת
  choice: supports
  rationale: Dans ce contexte, מְכֹנוֹת désigne les structures de bronze qui soutiennent les bassins. « Supports » exprime clairement leur fonction sans les réduire à de simples socles immobiles.
- source_word: עֶשֶׂר
  choice: dix
  rationale: Rend directement le nombre cardinal.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans l’inventaire du mobilier du temple, נְחֹשֶׁת désigne conventionnellement le bronze travaillé, même si le terme peut aussi englober le cuivre.
- source_word: אַרְבַּע בָּאַמָּה אֹרֶךְ הַמְּכוֹנָה הָאֶחָת
  choice: Chaque support mesurait quatre coudées de long
  rationale: 'Littéralement, « le support unique » a ici une valeur distributive : chaque support avait les mêmes dimensions. Cette formulation française naturelle conserve cette portée.'
- source_word: וְאַרְבַּע בָּאַמָּה רָחְבָּהּ
  choice: quatre de large
  rationale: La formulation elliptique évite une répétition lourde de « coudées » tout en conservant sans ambiguïté la largeur indiquée.
- source_word: וְשָׁלֹשׁ בָּאַמָּה קוֹמָתָהּ
  choice: trois de haut
  rationale: קוֹמָה indique ici la dimension verticale. « De haut » est idiomatique et reprend clairement l’unité déjà exprimée.
- source_word: אַמָּה
  choice: coudée
  rationale: L’unité ancienne est conservée plutôt que convertie, car sa valeur moderne exacte demeure approximative.
