base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: fr
  text: Il fit dix bassins en bronze. Chaque bassin pouvait contenir quarante baths[a] et mesurait quatre coudées[b]. Il y avait un bassin sur chacun des dix supports.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le bath était une unité hébraïque de capacité pour les liquides.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « quatre coudées ». L’hébreu ne précise pas la dimension mesurée ; il peut s’agir de la largeur ou du diamètre du bassin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: bassins
  rationale: Le terme désigne ici de grands récipients destinés aux ablutions dans le mobilier du Temple. « Bassins » est clair, actuel et naturel.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Dans le contexte du mobilier du Temple, « bronze » est la traduction française conventionnelle et rend vraisemblablement le métal ou l’alliage visé.
- source_word: בַּת
  choice: baths
  rationale: Le bath est une unité hébraïque de capacité. Le nom est conservé afin d’éviter une conversion moderne donnant une précision illusoire.
- source_word: יָכִיל
  choice: pouvait contenir
  rationale: Le verbe exprime la capacité du récipient ; cette tournure est idiomatique en français.
- source_word: אַרְבַּע בָּאַמָּה
  choice: mesurait quatre coudées de large
  rationale: La formulation française explicite la dimension vraisemblablement visée, tout en signalant en note que l’hébreu ne nomme pas l’axe de mesure.
- source_word: מְכוֹנָה
  choice: supports
  rationale: Le mot désigne les structures mobiles servant de bases aux bassins dans le contexte immédiat. « Supports » exprime clairement leur fonction sans surcharger ce verset.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: Un bassin reposait sur chacun des dix supports
  rationale: 'Cette formulation rend naturellement la construction distributive : un bassin par support, pour les dix supports.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est fluide sans effacer l’imprécision réelle de la mesure hébraïque, conservée dans la note.
