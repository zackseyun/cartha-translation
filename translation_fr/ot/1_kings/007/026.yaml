source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת֛/וֹ כְּ/מַעֲשֵׂ֥ה שְׂפַת כּ֖וֹס פֶּ֣רַח שׁוֹשָׁ֑ן אַלְפַּ֥יִם בַּ֖ת יָכִֽיל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: fr
  text: Son épaisseur était d’une largeur de main, et son rebord était façonné comme le rebord d’une coupe, comme une fleur de lis. Il pouvait contenir deux mille baths[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La description parallèle en 2 Chroniques 4.5 indique que la cuve pouvait contenir trois mille baths. Cette différence peut être d’ordre textuel ou liée à la transmission du texte; elle peut aussi refléter une distinction entre la capacité maximale et le contenu habituel.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: son épaisseur
  rationale: Le nom désigne l’épaisseur de la matière constituant la cuve; le suffixe renvoie à celle-ci. Cette formulation est naturelle et concrète en français.
- source_word: טֶפַח
  choice: une largeur de main
  rationale: Le téfaḥ est une mesure correspondant à la largeur d’une main. La traduction rend le sens de l’unité ancienne de façon immédiatement compréhensible.
- source_word: שְׂפָתוֹ
  choice: son rebord
  rationale: Pour une grande cuve, « rebord » désigne clairement le bord supérieur; « lèvre » demeure possible mais paraît moins naturel ici.
- source_word: כְּמַעֲשֵׂה
  choice: était façonné comme
  rationale: L’expression porte sur la forme ouvragée du rebord. « Était façonné comme » rend naturellement la comparaison artisanale.
- source_word: שְׂפַת כּוֹס
  choice: le rebord d’une coupe
  rationale: Cette traduction maintient la correspondance lexicale avec le rebord de la cuve et exprime clairement la comparaison.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: une fleur de lis
  rationale: L’expression décrit une forme florale, vraisemblablement évasée. « Fleur de lis » est concise et naturelle, sans imposer davantage de précision botanique.
- source_word: אַלְפַּיִם בַּת
  choice: deux mille baths
  rationale: Le bath est une ancienne unité de capacité pour les liquides. Sa translittération préserve la mesure du texte sans conversion incertaine.
- source_word: יָכִיל
  choice: Il pouvait contenir
  rationale: La forme verbale exprime ici la capacité de la cuve plutôt que son contenu effectif.
theological_decisions:
- issue: Différence avec 2 Chroniques 4.5
  choice: Conserver « deux mille baths » dans le texte et signaler en note la lecture parallèle de trois mille baths.
  alternative: Harmoniser le chiffre avec 2 Chroniques 4.5 ou interpréter explicitement l’un comme capacité maximale et l’autre comme contenu habituel.
  rationale: Le texte massorétique de 1 Rois 7.26 porte « deux mille ». La traduction préserve cette donnée et laisse ouverte la nature de la différence avec le passage parallèle.
translation_notes:
  register: Français international moderne, digne et accessible. « Cuve » n’est pas répété dans ce verset puisque les pronoms reprennent naturellement l’objet décrit dans le contexte. L’unité « bath » est conservée et mise au pluriel en français.
