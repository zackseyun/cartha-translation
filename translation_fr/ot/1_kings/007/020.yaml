source:
  edition: WLC
  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: fr
  text: Les chapiteaux étaient placés sur les deux colonnes, également au-dessus, en face du renflement[a] situé à côté du treillis[b]. Deux cents grenades étaient disposées en rangées tout autour du second chapiteau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du ventre » ; il s’agit probablement de la partie arrondie et saillante du chapiteau.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit du réseau décoratif fixé aux chapiteaux.
    reason: cultural_note
  - marker: c
    text: 'Ou : « de l’autre chapiteau ». L’hébreu dit « le second », ce qui peut simplement distinguer le chapiteau correspondant de la deuxième colonne.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹתָרֹת
  choice: chapiteaux
  rationale: Dans ce contexte architectural, le terme désigne la partie supérieure ouvragée d’une colonne. « Chapiteaux » est le terme français moderne précis.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: des deux colonnes
  rationale: La tournure française « les chapiteaux des deux colonnes » exprime naturellement leur emplacement sur les colonnes sans modifier la relation spatiale du texte hébreu.
- source_word: גַּם מִמַּעַל
  choice: aussi au-dessus
  rationale: Cette formulation conserve à la fois la valeur additive de גַּם et l’indication verticale de מִמַּעַל, malgré la difficulté de la description architecturale.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: en face du renflement
  rationale: לְעֻמַּת indique une position vis-à-vis de quelque chose. הַבֶּטֶן signifie littéralement « le ventre », mais désigne vraisemblablement ici une partie arrondie et saillante du chapiteau.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: situé à côté du treillis
  rationale: שבכה désigne un ouvrage décoratif en réseau ou en treillis. לְעֵבֶר exprime ici une relation spatiale difficile à déterminer précisément ; « à côté de » reste cohérent sans imposer une reconstruction détaillée.
- source_word: הָרִמּוֹנִים
  choice: grenades
  rationale: Il s’agit de représentations ornementales de grenades, clairement identifiables par le contexte architectural.
- source_word: מָאתַיִם טֻרִים סָבִיב
  choice: deux cents grenades étaient disposées en rangées tout autour
  rationale: La formulation rend le nombre, l’organisation en rangées et la disposition circulaire dans un français naturel.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: du second chapiteau
  rationale: « Second » est le sens direct de שֵׁנִית. Dans cette description d’une paire de colonnes, « l’autre chapiteau » reste également possible et est signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve les indications spatiales du texte hébreu sans prétendre résoudre entièrement sa syntaxe architecturale difficile. Les termes techniques « chapiteau », « renflement » et « treillis » restent accessibles dans le contexte.
