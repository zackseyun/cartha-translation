  text: and the one Sea[a], and the twelve oxen under the Sea;
translation:
  language: fr
  text: et la Mer unique, et les douze bœufs sous la Mer ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיָּם
  choice: la Mer
  rationale: Dans le contexte du mobilier du Temple, יָם désigne le grand réservoir d’eau en métal fondu traditionnellement appelé « la Mer ». La majuscule permet de reconnaître cet objet particulier tout en conservant l’image hébraïque.
- source_word: הָאֶחָד
  choice: unique
  rationale: L’adjectif numéral défini distingue cet exemplaire unique des autres éléments multiples de l’inventaire. « La Mer unique » restitue naturellement en français sa valeur définie et énumérative.
- source_word: הַבָּקָר
  choice: bœufs
  rationale: Dans ce contexte architectural, בָּקָר désigne les figures bovines placées sous la Mer. « Bœufs » est le terme français traditionnel et précis sans imposer la nuance de « taureaux ».
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Traduction directe du nombre cardinal.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition indique la position physique des figures bovines par rapport à la Mer.
- source_word: וְאֶת
  choice: et … ainsi que
  rationale: Les conjonctions répétées et les marques d’objet direct poursuivent l’énumération. En français, les marques d’objet ne se traduisent pas, tandis que « et » et « ainsi que » rendent clairement l’enchaînement sans lourdeur excessive.
