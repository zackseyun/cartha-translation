  text: וּ/בֵית/וֹ֩ אֲשֶׁר יֵ֨שֶׁב שָׁ֜ם חָצֵ֣ר הָ/אַחֶ֗רֶת מִ/בֵּית֙ לָֽ/אוּלָ֔ם כַּ/מַּֽעֲשֶׂ֥ה הַ/זֶּ֖ה הָיָ֑ה וּ/בַ֜יִת יַעֲשֶׂ֤ה לְ/בַת פַּרְעֹה֙ אֲשֶׁ֣ר לָקַ֣ח שְׁלֹמֹ֔ה כָּ/אוּלָ֖ם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: fr
  text: Sa maison, où il devait habiter[a], se trouvait dans l’autre cour, en retrait du portique; elle était construite de la même manière. Il fit aussi pour la fille du pharaon[b], qu’il avait prise pour femme, une maison semblable à ce portique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dans une autre cour, plus à l’intérieur, au-delà du portique». La formule spatiale hébraïque est difficile, et sa description de l’emplacement de la résidence par rapport au portique est comprise de diverses manières.
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit littéralement «qu’il avait prise», c’est-à-dire prise en mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: Sa maison
  rationale: Le nom avec suffixe pronominal désigne la résidence de Salomon; la conjonction initiale est naturellement absorbée dans l’enchaînement français.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: où il devait habiter
  rationale: יָשַׁב signifie ici «habiter»; l’imparfait prospectif exprime la destination résidentielle du bâtiment, tandis que שָׁם est rendu par «où».
- source_word: חָצֵר הָאַחֶרֶת
  choice: dans l’autre cour
  rationale: L’article défini désigne une cour distincte au sein du complexe royal; «cour» convient au contexte architectural.
- source_word: מִבֵּית לָאוּלָם
  choice: en retrait du Palais
  rationale: La formule spatiale hébraïque est difficile. «En retrait de» exprime prudemment une position plus intérieure ou plus éloignée, sans imposer une reconstitution architecturale précise.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: elle était construite de la même manière
  rationale: מַעֲשֶׂה renvoie ici au mode de construction ou au travail architectural; cette formulation française rend clairement la comparaison.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: Il fit aussi ... une maison
  rationale: Le yiqtol s’inscrit dans le résumé narratif de la construction; «fit» le rend comme un passé simple, et «aussi» restitue la continuité additive.
- source_word: לְבַת פַּרְעֹה
  choice: pour la fille du pharaon
  rationale: Rendu direct du complément introduit par לְ; la minuscule à «pharaon» suit l’usage français moderne pour le titre.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: qu’il avait prise pour femme
  rationale: לָקַח, avec une femme comme objet dans ce contexte, désigne la prise en mariage; l’expression conserve néanmoins le verbe concret «prendre».
- source_word: כָּאוּלָם הַזֶּה
  choice: semblable à ce Palais
  rationale: אוּלָם désigne ici le vaste édifice royal précédemment décrit, traditionnellement appelé le Palais de la Forêt du Liban; «Palais» évite le sens domestique que pourrait suggérer «porche».
