source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: fr
  text: 'Yahvé lui dit : « J’ai entendu ta prière et ta supplication[a] que tu as présentée devant moi. J’ai consacré cette maison[b] que tu as bâtie afin d’y placer mon nom pour toujours. Mes yeux et mon cœur y seront tous les jours[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la demande de faveur » ou « l’imploration » : le terme hébreu désigne une demande humble et pressante de grâce.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le temple que Salomon avait bâti ; l’hébreu dit littéralement « cette maison ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « mes yeux et mon cœur y seront tous les jours ». Cette image exprime l’attention et la sollicitude constantes de Yahvé.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui préserve le nom propre plutôt que de le remplacer par un titre.
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: Le passé composé exprime naturellement en français une action accomplie dont le résultat demeure pertinent dans la réponse divine.
- source_word: תְּפִלָּתְךָ
  choice: ta prière
  rationale: Équivalent français usuel dans ce contexte de requête adressée à Dieu.
- source_word: תְּחִנָּתְךָ
  choice: la supplication
  rationale: Distingue ce terme de « prière » et conserve l’idée d’un appel humble et pressant à la faveur divine.
- source_word: הִתְחַנַּנְתָּה לְפָנַי
  choice: que tu m’as adressées
  rationale: Formulation française naturelle qui relie les deux noms coordonnés au geste de présenter une requête devant Dieu, sans répétition lourde du cognat de « supplication ».
- source_word: הִקְדַּשְׁתִּי
  choice: J’ai consacré
  rationale: Rend l’action de mettre à part comme saint pour l’usage divin, tout en restant clair en français actuel.
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: Conserve le mot hébreu « maison » et sa résonance théologique, bien que le référent soit le temple bâti par Salomon.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: afin d’y placer mon nom
  rationale: Préserve la formule du nom liée au temple sans la transformer en affirmation plus interprétative sur la présence ou la demeure de Dieu.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française naturelle de la durée indéfinie ou permanente indiquée par l’hébreu.
- source_word: עֵינַי וְלִבִּי
  choice: Mes yeux et mon cœur
  rationale: Maintient littéralement l’image anthropomorphique de l’attention et de la sollicitude divines.
- source_word: כָּל הַיָּמִים
  choice: en tout temps
  rationale: Rend idiomatiquement la continuité exprimée par « tous les jours » sans produire une tournure française artificielle.
theological_decisions:
- issue: Le langage anthropomorphique dans « mes yeux et mon cœur »
  choice: Conserver littéralement l’image corporelle
  alternative: Paraphraser par « mon attention et ma sollicitude »
  rationale: L’hébreu emploie intentionnellement cette image pour exprimer le regard constant et l’attachement de Yahvé; la conserver respecte la texture théologique sans imposer une lecture matérialiste.
- issue: Le sens de « placer mon nom » dans le temple
  choice: Préserver la formule du nom telle quelle
  alternative: Traduire par « y demeurer » ou « y être adoré »
  rationale: Le texte parle précisément du nom de Dieu. Une paraphrase doctrinale réduirait l’ambiguïté et la portée propres à cette formule cultuelle et covenantale.
- issue: La portée temporelle de עַד עוֹלָם
  choice: Traduire par « pour toujours » sans explicitation doctrinale
  alternative: Limiter explicitement la durée à celle du temple ou affirmer une permanence absolue inconditionnelle
  rationale: La traduction conserve l’affirmation forte du texte sans trancher dans le verset seul la manière dont elle s’articule avec la suite du récit.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse singulière de Dieu à Salomon. La syntaxe reste fluide tout en conservant les principales images et formules hébraïques.
