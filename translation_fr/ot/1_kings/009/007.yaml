source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: fr
  text: alors je retrancherai Israël de la surface du pays que je leur ai donné. Quant à la maison[a] que j’ai consacrée pour mon nom[b], je l’écarterai de ma présence[c]. Israël deviendra un proverbe et un objet de raillerie[d] parmi tous les peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire le Temple. L’hébreu dit : « la maison ».'
    reason: lexical_alternative
  - marker: b
    text: Dans cet idiome hébreu, la maison est consacrée pour porter et honorer le nom de Dieu.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « je la renverrai de devant ma face » ; autre traduction possible : « je la renverrai de ma présence ».'
    reason: lexical_alternative
  - marker: d
    text: 'Autre traduction possible : « un proverbe et une parole de raillerie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: je retrancherai
  rationale: Le hiphil de כרת exprime ici l’exclusion ou l’élimination. « Retrancher » conserve la force du jugement d’alliance sans affirmer explicitement une extermination totale.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface du pays
  rationale: Cette formulation restitue l’image hébraïque de la « face » du sol tout en employant « pays », puisque le contexte parle du territoire donné à Israël.
- source_word: הַבַּיִת
  choice: la maison
  rationale: Le texte hébreu dit littéralement « la maison ». Le contexte désigne le Temple, mais conserver « maison » maintient le motif théologique propre au livre des Rois.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: que j’ai consacrée à mon nom
  rationale: « Consacrer » exprime la mise à part comme sainte, tandis que « à mon nom » préserve l’idiome hébreu important dans ce contexte.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: je la rejetterai loin de ma présence
  rationale: שׁלח peut signifier envoyer ou renvoyer. Ici, appliqué à la maison et associé à la face de Dieu, il exprime son rejet. « Présence » rend naturellement en français l’image anthropomorphique de la face.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: un sujet de proverbe et de raillerie
  rationale: 'Cette traduction distingue les deux termes : מָשָׁל évoque une formule proverbiale, et שְׁנִינָה des paroles mordantes ou moqueuses. L’ajout de « sujet de » donne une formulation française naturelle.'
- source_word: בְּכָל הָעַמִּים
  choice: parmi tous les peuples
  rationale: « Peuples » rend le pluriel עַמִּים sans suggérer nécessairement les États-nations modernes.
theological_decisions:
- issue: Portée du jugement annoncé contre Israël
  choice: je retrancherai Israël de la surface du pays
  alternative: je détruirai Israël dans le pays
  rationale: Le verbe annonce un jugement grave et une exclusion du pays, mais il ne faut pas lui faire affirmer sans nécessité l’anéantissement total d’Israël.
- issue: Désignation du sanctuaire
  choice: la maison
  alternative: le Temple
  rationale: « Maison » suit directement l’hébreu et conserve le motif de la maison consacrée au nom de Dieu ; une note précise le référent.
- issue: Image de la face divine
  choice: loin de ma présence
  alternative: de devant ma face
  rationale: La traduction choisie communique clairement le rejet du sanctuaire sans donner à l’expression une littéralité corporelle maladroite en français. La note conserve l’image hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe en deux phrases allège la longue coordination hébraïque sans modifier sa progression. « Quant à » clarifie la reprise du second objet du jugement. Les termes « retrancher », « consacrer » et « présence » gardent une tonalité biblique sobre sans archaïsme excessif.
