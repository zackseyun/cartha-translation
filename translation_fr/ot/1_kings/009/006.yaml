  source_fidelity: La structure conditionnelle, la portée dynastique, les deux termes juridiques et la distinction entre servir et se prosterner sont bien rendus. Toutefois, « résolument » ajoute l’idée d’une détermination volontaire que l’infinitif absolu n’exprime pas nécessairement; il marque plutôt l’insistance. « Si jamais » rend cette insistance de façon idiomatique sans surinterpréter.
  naturalness: La phrase est globalement naturelle, mais « vous, ou vos fils, vous détournez résolument » est lourd et peu fluide. La suppression des virgules d’incise et le remplacement par « si jamais vous ou vos fils vous détournez » donnent une syntaxe française plus naturelle.
  terminology: « Commandements », « prescriptions », « servir d’autres dieux » et « se prosterner devant eux » sont précis et adaptés à un registre moderne soutenu. La note doit indiquer plus directement que « et » correspond à la formulation hébraïque, tout en expliquant le choix interprétatif de « ou » dans le texte.
