  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: fr
  text: Mais si jamais vous ou vos fils vous détournez de moi[a], si vous ne gardez pas mes commandements et mes prescriptions que j’ai placés devant vous, et si vous allez servir d’autres dieux et vous prosterner devant eux,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous et vos fils ». L’hébreu dit littéralement « vous et vos fils »; dans ce contexte, l’avertissement peut viser Salomon lui-même ou sa lignée royale.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Mais si
  rationale: La particule introduit la condition; « mais » marque naturellement en français le contraste avec la promesse précédente.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: vous détournez résolument
  rationale: L’infinitif absolu avec le verbe conjugué renforce l’idée verbale. Avec מֵאַחֲרַי, il s’agit de se détourner de YHWH; « résolument » rend l’intensification sans suggérer un retour repentant.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: vous, ou vos fils
  rationale: Dans ce contexte royal, l’expression vise Salomon et ses descendants dynastiques. « Ou » explicite la portée distributive possible de l’avertissement, tandis qu’une note conserve le sens littéral avec « et ».
- source_word: מֵאַחֲרַי
  choice: de moi
  rationale: Avec « se détourner », le complément français naturel « de moi » exprime l’abandon de la fidélité envers Dieu; l’idée de cesser de le suivre reste implicite dans cette tournure.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: si vous ne gardez pas
  rationale: שׁמר appliqué aux commandements signifie les garder ou les observer. La répétition de « si » clarifie en français la structure conditionnelle de la longue phrase.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: mes commandements et mes prescriptions
  rationale: Deux termes distincts maintiennent la différenciation juridique de l’hébreu. « Prescriptions » est actuel et digne, sans archaïsme inutile.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: que j’ai placés devant vous
  rationale: נתן avec לפני signifie idiomatiquement placer ou mettre devant quelqu’un. Le participe passé s’accorde avec les deux noms masculins pluriels coordonnés.
- source_word: וַהֲלַכְתֶּם
  choice: et si vous allez
  rationale: הלך introduit ici les actes d’apostasie qui suivent. « Aller servir » est une tournure française naturelle; la reprise de « si » maintient clairement la condition.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: servir d’autres dieux
  rationale: « Servir » conserve le sens propre de עבד et le distingue du geste de prosternation exprimé ensuite.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: vous prosterner devant eux
  rationale: Cette formulation conserve l’image concrète de l’abaissement cultuel et évite de fondre les deux verbes hébreux en un seul terme général comme « adorer ».
theological_decisions:
- issue: Portée dynastique de l’avertissement
  choice: « vous, ou vos fils » vise Salomon personnellement ou ses descendants royaux.
  alternative: « vous et vos fils », lecture formellement plus proche de la coordination hébraïque.
  rationale: Le contexte concerne Salomon, la maison de David et le temple. La traduction principale fait ressortir la portée conditionnelle applicable à Salomon comme à sa lignée, tandis que la note préserve l’ambiguïté réelle de la coordination.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle est clarifiée par la reprise de « si ». Les deux actes idolâtres, servir et se prosterner, restent distincts. La virgule finale est conservée puisque le verset forme la protase dont la conséquence vient au verset suivant.
