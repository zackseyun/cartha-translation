source:
  edition: WLC
  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: fr
  text: Trois fois par an, Salomon offrait des holocaustes et des sacrifices de paix sur l’autel qu’il avait construit pour Yahweh, et il y faisait brûler de l’encens devant Yahweh[a]. Il acheva ainsi la Maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « il y faisait fumer des offrandes » : le verbe hébreu peut désigner plus largement l’action de transformer un sacrifice en fumée, et pas seulement celle de brûler de l’encens.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la maison », c’est-à-dire le temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: offrait
  rationale: Dans un contexte sacrificiel, le hiphil de עלה signifie couramment « offrir » un sacrifice. Ce verbe français reste naturel et ne précise pas si Salomon accomplissait lui-même le rite ou le faisait accomplir.
- source_word: עֹלוֹת
  choice: holocaustes
  rationale: Terme cultuel français établi pour les sacrifices entièrement consumés sur l’autel.
- source_word: שְׁלָמִים
  choice: sacrifices de paix
  rationale: Rend la catégorie de sacrifices liée à la paix, au bien-être et à la communion, tout en conservant une formulation reconnaissable dans le vocabulaire biblique.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: trois fois par an
  rationale: Équivalent idiomatique direct de l’expression temporelle hébraïque.
- source_word: עַל הַמִּזְבֵּחַ אֲשֶׁר בָּנָה לַיהוָה
  choice: sur l’autel qu’il avait construit pour Yahweh
  rationale: La proposition relative est rendue directement; le plus-que-parfait marque naturellement l’antériorité de la construction.
- source_word: וְהַקְטֵיר
  choice: il y faisait brûler de l’encens
  rationale: Le hiphil de קטר peut désigner l’action de faire produire une fumée sacrificielle et, plus précisément, de brûler de l’encens. Le choix principal est idiomatique, tandis que la note conserve le sens plus large possible.
- source_word: אִתּוֹ
  choice: y
  rationale: Le pronom adverbial renvoie naturellement à l’autel sans imposer la traduction plus littérale et maladroite « avec lui ».
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: Rend de façon concise la localisation cultuelle exprimée par l’hébreu, sans trancher excessivement la syntaxe difficile de la proposition.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: Il acheva ainsi la Maison
  rationale: Le piel de שלם exprime l’achèvement. « Maison » conserve l’image hébraïque, avec une majuscule contextuelle et une note précisant qu’il s’agit du temple.
theological_decisions:
- issue: Nature de la participation de Salomon aux rites sacrificiels
  choice: La traduction attribue les actions à Salomon selon la formulation du récit, sans préciser s’il les accomplissait personnellement ou les faisait accomplir sous son autorité.
  alternative: Expliciter soit que Salomon officiait lui-même, soit qu’il chargeait les prêtres d’officier.
  rationale: Le résumé royal hébreu permet une attribution directe pouvant englober l’organisation ou le patronage des rites. Il convient de préserver cette tension sans importer une conclusion sur les fonctions sacerdotales du roi.
- issue: Sens de וְהַקְטֵיר
  choice: « faisait brûler de l’encens » dans le texte, avec le sens sacrificiel plus général signalé en note
  alternative: « faisait fumer des offrandes »
  rationale: Le contexte du sanctuaire permet le sens précis d’encens, mais le verbe hébreu peut désigner plus largement la transformation d’une offrande en fumée. La note maintient cette ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase place « trois fois par an » en tête pour alléger la longue structure hébraïque. « Holocaustes », « sacrifices de paix » et « Maison » conservent le registre cultuel sans archaïsme syntaxique.
