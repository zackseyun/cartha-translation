source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: fr
  text: 'Et l’on répondra : « C’est parce qu’ils ont abandonné Yahweh, leur Dieu, qui avait fait sortir leurs pères du pays d’Égypte. Ils se sont attachés à d’autres dieux, se sont prosternés devant eux et les ont servis. Voilà pourquoi Yahweh a fait venir sur eux tout ce malheur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tout ce mal »; ici, le mot hébreu désigne le malheur ou la calamité du jugement, et non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Et l’on répondra
  rationale: Dans le prolongement de la question du verset précédent, le verbe introduit la réponse que donneront les observateurs. Le pronom indéfini « l’on » est naturel en français sans préciser un sujet que l’hébreu laisse implicite.
- source_word: עַל אֲשֶׁר
  choice: C’est parce que
  rationale: La locution introduit directement la cause du jugement; cette tournure française convient à une réponse explicative.
- source_word: עָזְבוּ
  choice: ont abandonné
  rationale: « Abandonner » exprime clairement la rupture d’allégeance sans archaïsme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le référent est Yahweh; malgré sa forme morphologique plurielle, אֱלֹהִים a ici un sens singulier.
- source_word: אֲשֶׁר הוֹצִיא אֶת אֲבֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: qui avait fait sortir leurs pères du pays d’Égypte
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité de l’Exode, tout en conservant de près la formule hébraïque et le terme masculin « pères ».
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: Ils se sont attachés à d’autres dieux
  rationale: Avec ב, חזק exprime ici une adhésion ferme. « S’attacher à » rend cette allégeance délibérée dans un français naturel.
- source_word: וישתחו לָהֶם
  choice: se sont prosternés devant eux
  rationale: La formulation conserve le geste concret de prosternation plutôt que de le réduire au terme plus général « adorer ».
- source_word: וַיַּעַבְדֻם
  choice: les ont servis
  rationale: « Servir » préserve la distinction lexicale et la progression entre attachement, prosternation et service cultuel.
- source_word: עַל כֵּן
  choice: Voilà pourquoi
  rationale: Cette locution marque clairement la conséquence et reprend avec naturel la structure causale de la réponse.
- source_word: הֵבִיא יְהוָה עֲלֵיהֶם אֵת כָּל הָרָעָה הַזֹּאת
  choice: Yahweh a fait venir sur eux tout ce malheur
  rationale: « Faire venir » reflète le causatif hébreu, et « malheur » désigne ici la calamité du jugement plutôt que le mal moral.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération le distingue du titre אֲדֹנָי et préserve sa fonction d’alliance.
- issue: Portée de רָעָה dans le jugement divin
  choice: tout ce malheur
  alternative: tout ce mal
  rationale: Dans ce contexte, רָעָה désigne la calamité infligée en jugement, non une faute morale attribuée à Dieu.
- issue: Terme ancestral אֲבֹתָם
  choice: leurs pères
  alternative: leurs ancêtres
  rationale: Le choix conserve la forme masculine du texte et la formule traditionnelle liée à la génération sortie d’Égypte, sans exclure la portée ancestrale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe explicative répond au contexte du verset précédent; les trois verbes concernant les autres dieux restent distincts. Le discours direct est ponctué selon l’usage français.
