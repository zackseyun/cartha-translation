source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל עָרֵ֤י הַֽ/מִּסְכְּנוֹת֙ אֲשֶׁ֣ר הָי֣וּ לִ/שְׁלֹמֹ֔ה וְ/אֵת֙ עָרֵ֣י הָ/רֶ֔כֶב וְ/אֵ֖ת עָרֵ֣י הַ/פָּרָשִׁ֑ים וְ/אֵ֣ת חֵ֣שֶׁק שְׁלֹמֹ֗ה אֲשֶׁ֤ר חָשַׁק֙ לִ/בְנ֤וֹת בִּ/ירוּשָׁלִַ֨ם֙ וּ/בַ/לְּבָנ֔וֹן וּ/בְ/כֹ֖ל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: fr
  text: ainsi que toutes les villes-entrepôts qui appartenaient à Salomon[a], les villes de chars, les villes de cavaliers[b], et tout ce que Salomon désirait ardemment construire[c] à Jérusalem, au Liban et dans tout le territoire soumis à son autorité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « villes de stockage » ou « villes de ravitaillement ». L’hébreu désigne des villes affectées au stockage de biens ou de provisions.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « villes des cavaliers ». Le terme hébreu désigne plus précisément les cavaliers que les chevaux en général.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, la construction hébraïque parle du « désir de Salomon » et de ce qu’il « désirait construire » ; elle exprime avec insistance ce que Salomon tenait vivement à construire.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: villes-entrepôts
  rationale: L’expression désigne des villes affectées au stockage de provisions ou de biens. « Villes-entrepôts » est clair en français moderne et conserve leur fonction administrative.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: qui appartenaient à Salomon
  rationale: La construction avec לְ exprime ici naturellement la possession ou l’affectation à Salomon.
- source_word: עָרֵי הָרֶכֶב
  choice: les villes de chars
  rationale: Traduction concise qui désigne des villes affectées aux chars et à leur infrastructure militaire.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: les villes de cavaliers
  rationale: פָּרָשִׁים désigne plus précisément des cavaliers que des chevaux; cette formulation préserve la distinction avec les chars.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: tout ce que Salomon désirait ardemment
  rationale: Le nom et le verbe de même racine forment une expression emphatique. « Désirait ardemment » en restitue l’intensité sans reproduire une lourde répétition.
- source_word: לִבְנוֹת
  choice: construire
  rationale: Équivalent français naturel de בנה dans le contexte des projets royaux de construction.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: à Jérusalem, au Liban
  rationale: La variation des prépositions est idiomatique en français et conserve le sens locatif de l’hébreu.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: dans tout le territoire soumis à son autorité
  rationale: Cette formulation rend à la fois la dimension territoriale de אֶרֶץ et l’idée de domination ou d’autorité royale portée par מֶמְשָׁלָה.
