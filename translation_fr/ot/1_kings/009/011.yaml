base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: fr
  text: Hiram, roi de Tyr, avait fourni à Salomon du bois de cèdre, du bois de cyprès[a] et de l’or, tout ce que Salomon désirait. Alors, le roi Salomon donna à Hiram vingt villes dans le pays de Galilée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « genévrier », « sapin » ou un autre conifère; l’espèce exacte désignée par le mot hébreu berosh est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: avait fourni
  rationale: Dans cette construction, le verbe exprime l’approvisionnement de Salomon par Hiram. Le plus-que-parfait présente naturellement cette information comme l’arrière-plan de l’action principale.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: du bois de cèdre
  rationale: Le nom עֵץ suivi de l’espèce désigne ici le matériau de construction plutôt que les arbres vivants.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: du bois de cyprès[a]
  rationale: « Cyprès » est une identification courante de בְּרוֹשׁ, mais l’espèce exacte reste incertaine; une note conserve cette incertitude lexicale.
- source_word: וּבַזָּהָב
  choice: et de l’or
  rationale: Rendu direct du nom de matière.
- source_word: לְכָל חֶפְצוֹ
  choice: autant qu’il en désirait
  rationale: Cette formulation française naturelle exprime la pleine mesure du désir de Salomon sans préciser au-delà de l’hébreu la nature des demandes.
- source_word: אָז יִתֵּן
  choice: Alors, ... donna
  rationale: Après le marqueur temporel אָז, l’imparfait hébreu relate ici un événement passé dans la suite narrative.
- source_word: עֶשְׂרִים עִיר
  choice: vingt villes
  rationale: « Villes » est le rendu courant de עִיר et convient au contexte territorial.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: dans le pays de Galilée
  rationale: Rendu transparent de la désignation géographique, sans réduire אֶרֶץ à une catégorie administrative précise.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: Hiram ... Salomon ... Tyr ... Galilée
  rationale: Emploi des formes françaises conventionnelles des noms propres bibliques et géographiques.
