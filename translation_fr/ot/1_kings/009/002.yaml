source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה שֵׁנִ֑ית כַּ/אֲשֶׁ֛ר נִרְאָ֥ה אֵלָ֖י/ו בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: fr
  text: Alors Yahweh apparut à Salomon une seconde fois[a], comme il lui était apparu à Gabaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nouveau »; littéralement « une seconde fois ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה exprime ici une manifestation de Yahweh. « Apparut » est naturel, précis et conserve le parallèle avec נִרְאָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: שֵׁנִית
  choice: une seconde fois
  rationale: Cette formulation rend explicitement la valeur séquentielle de l’adverbe et souligne qu’il s’agit de la deuxième apparition à Salomon.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: « Comme » introduit simplement et naturellement la comparaison avec l’apparition antérieure.
- source_word: נִרְאָה
  choice: il lui était apparu
  rationale: Le plus-que-parfait situe clairement l’apparition à Gabaon avant celle rapportée dans la proposition principale; le pronom « lui » rend אֵלָיו.
- source_word: בְּגִבְעוֹן
  choice: à Gabaon
  rationale: « À » est la préposition française idiomatique avec ce nom de lieu; « Gabaon » est sa forme française traditionnelle et largement reconnue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel sans le remplacer par un titre et sans adopter la forme hybride « Jéhovah ».
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme des deux formes hébraïques de ראה, tout en employant le plus-que-parfait pour marquer naturellement l’antériorité de l’apparition à Gabaon.
