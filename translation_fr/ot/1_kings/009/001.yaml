source:
  edition: WLC
  text: וַ/יְהִי֙ כְּ/כַלּ֣וֹת שְׁלֹמֹ֔ה לִ/בְנ֥וֹת אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵת֙ כָּל חֵ֣שֶׁק שְׁלֹמֹ֔ה אֲשֶׁ֥ר חָפֵ֖ץ לַ/עֲשֽׂוֹת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: fr
  text: Lorsque Salomon eut fini de construire la maison de Yahweh, la maison du roi et tout ce qu’il désirait réaliser[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les projets que Salomon désirait réaliser » ; littéralement, « tout le désir de Salomon ».
    reason: L’expression כָּל חֵשֶׁק שְׁלֹמֹה peut désigner soit l’ensemble de ce que Salomon désirait, soit ses projets envisagés collectivement ; le nom חֵשֶׁק signifie littéralement « désir ».
lexical_decisions:
- source_word: וַיְהִי
  choice: Lorsque
  rationale: Dans cette construction, וַיְהִי introduit la circonstance temporelle développée par כְּכַלּוֹת. En français narratif naturel, « Lorsque » transmet cette fonction sans le calque lourd « Et il arriva que ».
- source_word: כְּכַלּוֹת
  choice: eut fini
  rationale: La préposition כְּ avec l’infinitif construit de כלה marque ici le moment où l’action antérieure est achevée. Le passé antérieur convient à la narration soutenue et à la séquence avec le verset suivant.
- source_word: לִבְנוֹת
  choice: de construire
  rationale: Après « finir », le français demande naturellement « de » suivi de l’infinitif.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’expression hébraïque et son parallèle avec « la maison du roi » ; « temple » serait une explicitation contextuelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La forme rend directement le nom divin exprimé par le tétragramme.
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: Ce rendu littéral préserve le parallélisme avec « la maison de Yahweh » ; « palais royal » serait possible, mais plus interprétatif.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה
  choice: tout ce qu’il désirait
  rationale: חֵשֶׁק peut désigner le désir ou ce qui est désiré. La formulation française exprime naturellement ce dernier sens tout en laissant la note signaler l’ambiguïté.
- source_word: חָפֵץ
  choice: désirait
  rationale: Le verbe exprime le désir, le plaisir ou la volonté. « Désirait » maintient son lien sémantique avec חֵשֶׁק.
- source_word: לַעֲשׂוֹת
  choice: réaliser
  rationale: עשה signifie largement « faire ». Dans le contexte des constructions et entreprises de Salomon, « réaliser » reste général tout en étant idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé antérieur « eut fini » marque clairement l’antériorité. La virgule finale est conservée parce que le verset forme une proposition circonstancielle dont la proposition principale commence au verset suivant.
