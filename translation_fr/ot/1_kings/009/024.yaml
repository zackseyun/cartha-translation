  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: fr
  text: Mais la fille du pharaon monta de la Cité de David à la maison que Salomon avait bâtie pour elle. C’est alors qu’il bâtit le Millo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « les terrasses » ou « le remblai ». Le terme hébreu millo désigne probablement un ouvrage défensif ou une structure de soutènement faite de remblais ou de terrasses.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: La particule marque ici une transition ou une réserve par rapport au contexte précédent; « Mais » rend naturellement cette fonction sans lui donner le sens restrictif de « seulement ».
- source_word: בַּת פַרְעֹה
  choice: la fille du pharaon
  rationale: Le syntagme construit désigne simplement la femme par sa relation avec le pharaon; cette formulation est naturelle en français moderne.
- source_word: עָלְתָה
  choice: monta
  rationale: Le verbe עלה exprime un mouvement vers le haut, probablement topographique; « monta » conserve cette nuance.
- source_word: מֵעִיר דָּוִד
  choice: de la Cité de David
  rationale: La préposition indique le point de départ et le nom propre traditionnel est conservé.
- source_word: אֶל בֵּיתָהּ
  choice: vers la maison
  rationale: בַּיִת peut désigner une maison ou un palais, mais « maison » évite de préciser au-delà du texte; « vers » s’accorde naturellement avec le mouvement exprimé par « monta ».
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: que Salomon avait bâtie pour elle
  rationale: Le plus-que-parfait indique naturellement que la construction précédait le déménagement. Le sujet implicite est rendu par « Salomon » pour éviter en français l’ambiguïté créée par la proximité de « pharaon », conformément au contexte narratif.
- source_word: אָז
  choice: C’est alors que
  rationale: Cette tournure française marque clairement la relation temporelle et la progression du récit.
- source_word: בָּנָה
  choice: il bâtit
  rationale: Le verbe est rendu comme un fait narratif accompli, sans ajouter l’idée non exprimée de commencement.
- source_word: הַמִּלּוֹא
  choice: le Millo
  rationale: Le terme désigne vraisemblablement un ouvrage topographique ou défensif précis à Jérusalem, mais sa nature exacte reste discutée; la translittération préserve cette incertitude.
