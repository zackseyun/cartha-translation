  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: fr
  text: Le roi Salomon construisit aussi une flotte à Étsion-Guéber, près d’Éloth, sur le rivage de la mer Rouge[a], dans le pays d’Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « mer des Roseaux »; traditionnellement traduit par « mer Rouge ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: aussi une flotte
  rationale: Le nom אֳנִי peut désigner un navire ou, collectivement dans ce contexte maritime, une flotte. « Aussi » rend le lien narratif porté par la conjonction וְ.
- source_word: עָשָׂה
  choice: construisit
  rationale: Le verbe signifie couramment « faire », mais avec une flotte ou des navires, « construire » est l’expression française naturelle et précise.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: à Étsion-Guéber
  rationale: La préposition בְּ localise ici l’activité dans un port; « à » convient naturellement devant le nom de lieu.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: près d’Éloth
  rationale: La construction associe géographiquement Étsion-Guéber à Éloth. « Près de » exprime cette proximité sans préciser davantage une relation que l’hébreu formule de manière inhabituelle.
- source_word: עַל שְׂפַת יַם סוּף
  choice: sur le rivage de la mer Rouge
  rationale: שָׂפָה désigne le bord ou le rivage. « Mer Rouge » est la désignation traditionnelle et géographiquement intelligible; le sens lexical possible de יַם־סוּף est signalé en note.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: dans le pays d’Édom
  rationale: Cette formulation conserve le substantif אֶרֶץ et l’accent géographique du texte hébreu.
theological_decisions: []
