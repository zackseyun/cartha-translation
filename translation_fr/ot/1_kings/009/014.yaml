- source_word: כִּכַּר
  choice: talents
  rationale: Le talent est une ancienne unité de poids; le pluriel français est requis après « cent vingt ».
- source_word: זָהָב
  choice: or
  rationale: 'Le nom désigne l’or et complète ici l’unité de poids: « talents d’or ».'
