  text: וַ/יֵּצֵ֤א חִירָם֙ מִ/צֹּ֔ר לִ/רְאוֹת֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁ֥ר נָתַן ל֖/וֹ שְׁלֹמֹ֑ה וְ/לֹ֥א יָשְׁר֖וּ בְּ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: fr
  text: Hiram sortit de Tyr pour voir les villes que Salomon lui avait données, mais elles ne lui plurent pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elles n’étaient pas droites à ses yeux », expression qui signifie ici qu’elles ne lui convenaient pas ou ne lui plaisaient pas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: partit
  rationale: Le verbe יצא indique ici que Hiram sort de Tyr ou la quitte. « Partit » rend naturellement ce déplacement en français sans préciser davantage son motif.
- source_word: מִצֹּר
  choice: de Tyr
  rationale: La préposition מן marque le point de départ; « de Tyr » est la formulation française naturelle.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: ראה signifie simplement « voir ». Le contexte peut suggérer une inspection, mais « voir » évite d'ajouter cette nuance au texte.
- source_word: הֶעָרִים
  choice: les villes
  rationale: עיר peut désigner une ville ou une localité; « les villes » convient au contexte territorial et correspond à l'usage biblique courant.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: que Salomon lui avait données
  rationale: Le plus-que-parfait indique naturellement en français que le don des villes précède leur visite. Le participe passé s'accorde avec le complément direct antéposé « que », dont l'antécédent est « les villes ».
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: mais elles ne lui plurent pas
  rationale: L'expression idiomatique ישר בעיני exprime ce qui paraît bon, convenable ou agréable au jugement de quelqu'un. « Ne lui plurent pas » communique clairement l'insatisfaction de Hiram sans suggérer avant tout une faute morale.
