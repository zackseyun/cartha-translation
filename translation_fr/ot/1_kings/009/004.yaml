id: 1KI.9.4
reference: 1 Kings 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: fr
  text: Quant à toi, si tu marches devant moi comme David, ton père, a marché, avec un cœur intègre[a] et avec droiture, en faisant tout ce que je t’ai commandé, et si tu observes mes prescriptions et mes règles[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un cœur entier ». Le terme hébreu souligne la plénitude et l’intégrité, sans nécessairement désigner une absence absolue de péché.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes prescriptions et mes ordonnances ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Quant à toi
  rationale: Marque le passage à une adresse directe et légèrement emphatique, de façon naturelle en français.
- source_word: תֵּלֵךְ לְפָנַי
  choice: tu marches devant moi
  rationale: Conserve l’image hébraïque de la marche comme conduite de vie vécue devant Dieu.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: comme David, ton père, a marché
  rationale: Maintient la comparaison et la répétition verbale du texte source.
- source_word: בְּתָם לֵבָב
  choice: avec un cœur intègre
  rationale: Exprime l’idée de plénitude, de cohérence morale et de sincérité sans suggérer une perfection absolue.
- source_word: וּבְיֹשֶׁר
  choice: et avec droiture
  rationale: Rend la rectitude morale dans un français actuel et digne.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: en faisant tout ce que je t’ai commandé
  rationale: Relie clairement la marche devant Dieu à l’obéissance concrète et conserve la portée globale de כְּכֹל.
- source_word: חֻקַּי
  choice: mes prescriptions
  rationale: Terme naturel en français pour des dispositions établies, tout en restant distinct du terme juridique suivant.
- source_word: וּמִשְׁפָּטַי
  choice: et mes règles
  rationale: Rend les décisions ou normes juridiques divines dans une langue accessible; « ordonnances » reste une possibilité plus traditionnelle.
- source_word: תִּשְׁמֹר
  choice: tu observes
  rationale: Dans ce contexte d’alliance, le verbe signifie respecter et mettre en pratique les commandements.
theological_decisions:
- issue: La présentation de David comme modèle
  choice: « avec un cœur intègre »
  alternative: « d’un cœur irréprochable » ou « d’un cœur entier »
  rationale: Le texte présente David comme modèle de fidélité entière sans nécessairement affirmer qu’il était absolument sans péché; « intègre » préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore biblique « marcher devant Dieu » est conservée; la syntaxe conditionnelle reste ouverte, puisque la phrase se poursuit au verset suivant.
