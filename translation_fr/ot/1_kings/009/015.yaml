  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: fr
  text: Voici ce qui concerne la corvée[a] que le roi Salomon imposa pour bâtir la maison de Yahweh, sa propre maison, le Millo[b], la muraille de Jérusalem, Hatsor, Meguiddo et Guézer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « prestation de travail obligatoire » : il s’agit d’un travail exigé par l’État, et non d’un impôt payé en argent.'
    reason: lexical_alternative
  - marker: b
    text: Le Millo était probablement un ouvrage fortifié ou un aménagement en terrasses à Jérusalem. Le mot hébreu peut évoquer un remblai, mais l’identification exacte reste incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: ce qui concerne
  rationale: Dans la tournure וְזֶה דְבַר הַמַּס, דְבַר introduit une notice explicative sur la corvée. « Voici ce qui concerne » est naturel en français et conserve cette fonction sans donner au nom le sens trop précis de « compte rendu ».
- source_word: הַמַּס
  choice: la corvée
  rationale: Dans ce contexte de grands travaux royaux, מַס désigne un travail obligatoire imposé par l’État, et non un impôt monétaire. « Corvée » est le terme français précis et encore compréhensible, explicité en note.
- source_word: הֶעֱלָה
  choice: imposa
  rationale: Le hiphil de עלה signifie ici lever ou imposer une prestation. Avec « corvée », le verbe « imposer » est idiomatique et exprime clairement la contrainte administrative.
- source_word: לִבְנוֹת
  choice: pour bâtir
  rationale: L’infinitif exprime le but. « Pour bâtir » restitue directement cette valeur et convient au registre biblique moderne.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: La traduction conserve l’image hébraïque de la « maison » plutôt que de l’expliciter par « temple », et rend directement le nom divin.
- source_word: בֵּיתוֹ
  choice: sa propre maison
  rationale: « Sa propre maison » fait ressortir le contraste avec la maison de Yahweh tout en restant proche de l’hébreu; il s’agit du complexe palatial de Salomon.
- source_word: הַמִּלּוֹא
  choice: le Millo
  rationale: Le mot désigne vraisemblablement un ouvrage ou un secteur fortifié connu de Jérusalem, mais son identification exacte reste incertaine. La translittération évite une précision injustifiée.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: la muraille de Jérusalem
  rationale: « Muraille » rend naturellement en français le mur défensif d’une ville.
- source_word: חָצֹר
  choice: Hatsor
  rationale: Translittération française usuelle du nom de lieu.
- source_word: מְגִדּוֹ
  choice: Meguiddo
  rationale: Translittération française usuelle du nom de lieu.
- source_word: גָּזֶר
  choice: Guézer
  rationale: Translittération française usuelle du nom de lieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin sans le remplacer par un titre; « le SEIGNEUR » demeure une tradition de lecture possible, mais elle ne reproduit pas directement le nom.
- issue: Nature de la maison de Salomon
  choice: sa propre maison
  alternative: son palais
  rationale: Le contexte renvoie au palais royal, mais l’hébreu dit littéralement « sa maison ». Le texte conserve cette formulation et laisse le contexte en préciser la fonction.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde la forme d’une notice administrative tout en évitant les calques pesants. Les noms de lieux suivent des translittérations françaises courantes; le terme technique « Millo » est conservé et expliqué en note.
