  text: אֵ֣לֶּה שָׂרֵ֣י הַ/נִּצָּבִ֗ים אֲשֶׁ֤ר עַל הַ/מְּלָאכָה֙ לִ/שְׁלֹמֹ֔ה חֲמִשִּׁ֖ים וַ/חֲמֵ֣שׁ מֵא֑וֹת הָ/רֹדִ֣ים בָּ/עָ֔ם הָ/עֹשִׂ֖ים בַּ/מְּלָאכָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: fr
  text: 'Voici les chefs des préposés[a] qui étaient chargés des travaux pour Salomon : ils étaient cinq cent cinquante et exerçaient leur autorité[b] sur le peuple qui exécutait les travaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des responsables établis » ; le terme hébreu désigne des personnes établies dans une fonction ou chargées d’une mission.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « supervisaient » ; le verbe hébreu peut signifier gouverner, exercer son autorité ou avoir la charge de quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: les chefs des préposés
  rationale: Le groupe construit est rendu sans omettre הַנִּצָּבִים. « Préposés » exprime ici des responsables établis dans une fonction, tandis que « chefs » traduit שָׂרֵי et marque leur rang.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: chargés des travaux de Salomon
  rationale: Cette formulation française naturelle conserve l’idée d’être placé au-dessus des travaux accomplis au service de Salomon.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: cinq cent cinquante
  rationale: Rendu français standard du nombre hébreu.
- source_word: הָרֹדִים
  choice: exerçaient leur autorité sur
  rationale: Le verbe רדה exprime l’exercice d’une autorité ou d’une domination. Ce choix en conserve la force sans introduire une nuance militaire absente du contexte.
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  choice: sur le peuple qui exécutait les travaux
  rationale: « Peuple » garde le sens large de עָם, et la proposition qui suit précise qu’il s’agit des personnes affectées aux travaux.
