  text: And Hiram sent his servants on the ship with Solomon’s servants—men of ships, men who knew the sea.
translation:
  language: fr
  text: Hiram envoya, à bord du navire, ses serviteurs — des marins connaissant la mer — avec les serviteurs de Salomon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֳנִי
  choice: sur la flotte
  rationale: Le nom אֳנִי peut être collectif dans ce contexte maritime; « flotte » s’accorde naturellement avec l’entreprise navale décrite au verset précédent.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: des marins
  rationale: Littéralement « hommes de navires »; l’expression idiomatique française « marins » en transmet clairement le sens.
- source_word: יֹדְעֵי הַיָּם
  choice: qui connaissaient bien la mer
  rationale: Le participe de ידע exprime ici une connaissance pratique et expérimentée de la navigation maritime; « bien » rend naturellement cette compétence sans surinterprétation.
- source_word: עֲבָדָיו / עַבְדֵי שְׁלֹמֹה
  choice: ses serviteurs / ceux de Salomon
  rationale: « Serviteurs » conserve la portée large de עבד; la reprise par « ceux » évite une répétition lourde tout en maintenant le rapport d’appartenance.
