  verdict: revise
  source_fidelity: La première proposition rend correctement וַהֲקִמֹתִי, « le trône de ta royauté », « sur Israël » et לְעוֹלָם. Dans la citation, « Il ne te manquera jamais un homme » exprime bien l’effet dynastique de l’idiome, mais « jamais » ajoute une explicitation temporelle qui n’est pas formulée dans cette clause et affaiblit la correspondance avec la négation simple de לֹא יִכָּרֵת. La formulation révisée conserve l’idiome français de continuité dynastique sans surinterpréter « homme » comme « descendant ».
  naturalness: Le français révisé demeure moderne, solennel et accessible. « Il ne te manquera pas un homme sur le trône d’Israël » est une tournure biblique naturelle dans ce contexte royal; elle évite à la fois le calque opaque « être retranché » et une paraphrase excessive.
  terminology: « Trône de ta royauté », « Israël » et la désignation « David, ton père » sont appropriés. Aucun terme théologique ne demande d’explicitation. La citation conserve l’ambiguïté contrôlée de l’hébreu quant à « un homme » sans imposer une lecture messianique ou dynastique plus précise.
