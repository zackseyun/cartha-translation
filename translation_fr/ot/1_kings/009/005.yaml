    rationale: Le texte hébreu dit littéralement qu’un homme ne sera pas retranché/manquera à Salomon quant au trône. La durée « pour toujours » est déjà exprimée dans la proposition principale; ajouter « jamais » dans la citation est défendable comme implication contextuelle, mais n’est pas nécessaire et réduit la proximité formelle avec la source.
