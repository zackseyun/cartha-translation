base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: fr
  text: 'alors j’établirai pour toujours le trône de ta royauté sur Israël, comme je l’ai déclaré au sujet de David, ton père, en disant : « Il ne te manquera pas un homme sur le trône d’Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: alors j’établirai
  rationale: Le parfait avec waw exprime ici la conséquence promise de la condition formulée au verset précédent ; « établir » rend naturellement le sens de faire subsister fermement.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: le trône de ta royauté
  rationale: Cette formulation conserve à la fois l’image dynastique du trône et le nom abstrait מַמְלָכָה, sans réduire l’expression au seul « royaume ».
- source_word: לְעֹלָם
  choice: pour toujours
  rationale: Équivalent français direct de la durée indéfinie ou perpétuelle exprimée dans la promesse.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Il ne te manquera jamais un homme
  rationale: L’expression idiomatique signifie qu’aucun descendant masculin apte à occuper le trône ne fera défaut. Une traduction littérale par « ne sera pas retranché » serait ambiguë et peu naturelle en français.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: sur le trône d’Israël
  rationale: Avec la négation de יכרת, la construction signifie qu’un homme de la lignée ne cessera pas d’occuper le trône ; le français idiomatique emploie « sur le trône ».
theological_decisions:
- issue: Portée de la promesse dynastique « pour toujours »
  choice: Conserver « pour toujours » sans explicitation doctrinale
  alternative: Préciser dans le texte que la promesse est conditionnelle ou l’appliquer explicitement au Messie
  rationale: Le verset doit rester lié à la condition du contexte immédiat tout en gardant intacte la force de la promesse faite à David ; aucune interprétation théologique ultérieure n’est ajoutée au texte.
- issue: Forme de la continuité dynastique
  choice: « Il ne te manquera jamais un homme »
  alternative: « Un homme issu de toi ne sera pas retranché »
  rationale: L’idiome hébreu exprime la permanence d’une lignée sur le trône, non une affirmation explicite sur le sort individuel d’un homme. La formulation retenue transmet cette valeur sans introduire une doctrine supplémentaire.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde le vocabulaire royal et dynastique du texte hébreu, avec une citation solennelle et idiomatique.
