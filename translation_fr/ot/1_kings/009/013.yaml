base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: fr
  text: 'Il dit : « Que sont ces villes que tu m’as données, mon frère ? » Alors il les appela pays de Caboul[a] jusqu’à ce jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Caboul est vraisemblablement un nom de lieu, mais l’hébreu peut aussi suggérer un jeu de mots méprisant, évoquant peut-être quelque chose de « bon à rien » ou de « lié, restreint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: Que sont ces villes
  rationale: La question exprime une appréciation indignée sur la qualité des villes. Cette formulation française conserve la force de la plainte sans en préciser excessivement le sens.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: que tu m’as données
  rationale: Le passé composé rend naturellement en français une action accomplie dont le résultat motive la réaction présente de Hiram.
- source_word: אָחִי
  choice: mon frère
  rationale: Le possessif est explicite en hébreu. Cette traduction conserve à la fois le sens littéral et la formule diplomatique employée entre souverains.
- source_word: וַיִּקְרָא לָהֶם
  choice: Il leur donna donc le nom de
  rationale: Le verbe קרא construit avec ל exprime ici l’attribution d’un nom. La formulation choisie est naturelle en français et identifie clairement Caboul comme une désignation.
- source_word: אֶרֶץ כָּבוּל
  choice: pays de Caboul
  rationale: אֶרֶץ est rendu par « pays », et כָּבוּל est conservé comme nom de lieu sous sa forme française usuelle. L’éventuel jeu de mots péjoratif est signalé en note plutôt qu’imposé dans le texte.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: qu’elles portent encore aujourd’hui
  rationale: Cette formulation idiomatique rend la persistance du nom jusqu’au temps du narrateur, tout en évitant l’ambiguïté française selon laquelle l’acte de nommer se serait prolongé.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le dialogue conserve l’adresse diplomatique « mon frère » et la tonalité de vive déception. La syntaxe narrative a été légèrement explicitée pour rendre naturellement en français la formule hébraïque indiquant que le nom subsiste jusqu’au temps du narrateur.
