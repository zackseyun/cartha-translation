    issue: La périphrase finale « qu’elles portent encore aujourd’hui » remplace la formule temporelle du narrateur.
    rationale: Le texte hébreu dit littéralement que l’appellation subsiste « jusqu’à ce jour ». La relative française rattache explicitement la persistance aux villes et alourdit la désignation collective « pays de Caboul ».
