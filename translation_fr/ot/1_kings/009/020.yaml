base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: fr
  text: Tous ceux qui restaient parmi les Amorites, les Hittites, les Perizzites, les Hivvites et les Jébusites, et qui n’étaient pas issus d’Israël[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui n’étaient pas parmi les fils d’Israël » ; autrement : « qui n’étaient pas Israélites ».'
    reason: La note signale la forme généalogique et la relation exprimée par l’hébreu, tout en donnant l’équivalent collectif idiomatique.
lexical_decisions:
- source_word: כָּל הָעָם הַנּוֹתָר
  choice: Tous ceux qui restaient
  rationale: Cette formulation française naturelle rend la totalité du groupe collectif désigné par « tout le peuple restant », sans donner à עָם le sens moderne d’une nation organisée.
- source_word: מִן הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: des Amoréens, des Hittites, des Perizzites, des Hivvites et des Jébusites
  rationale: מִן indique ici les peuples dont provenaient les survivants. Les ethnonymes suivent les formes françaises bibliques courantes.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: et qui n’étaient pas issus d’Israël
  rationale: « Issus d’Israël » exprime naturellement l’appartenance par ascendance portée par מִבְּנֵי יִשְׂרָאֵל. Le pronom emphatique הֵמָּה est reflété par la proposition explicite, sans ajout lourd tel que « eux-mêmes ».
theological_decisions:
- issue: Portée généalogique et collective de בְּנֵי יִשְׂרָאֵל
  choice: issus d’Israël
  alternative: des fils d’Israël / des Israélites
  rationale: Le choix conserve l’idée d’origine ou de descendance sans faire croire qu’il s’agit seulement des fils immédiats de Jacob. « Israélites » serait plus idiomatique mais rendrait moins visible la construction généalogique du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le tiret final maintient la phrase ouverte, puisque la construction se poursuit au verset suivant.
