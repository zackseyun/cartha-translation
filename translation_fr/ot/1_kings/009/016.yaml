  text: פַּרְעֹ֨ה מֶֽלֶךְ מִצְרַ֜יִם עָלָ֗ה וַ/יִּלְכֹּ֤ד אֶת גֶּ֨זֶר֙ וַ/יִּשְׂרְפָ֣/הּ בָּ/אֵ֔שׁ וְ/אֶת הַֽ/כְּנַעֲנִ֛י הַ/יֹּשֵׁ֥ב בָּ/עִ֖יר הָרָ֑ג וַֽ/יִּתְּנָ/הּ֙ שִׁלֻּחִ֔ים לְ/בִתּ֖/וֹ אֵ֥שֶׁת שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: fr
  text: Le pharaon, roi d’Égypte, était monté et s’était emparé de Guézer. Il l’avait livrée au feu, avait tué les Cananéens qui habitaient la ville, puis l’avait donnée comme cadeau de mariage[a] à sa fille, la femme de Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme dot ». Le terme hébreu désigne un don lié au mariage ; sa portée sociale exacte ne correspond pas nécessairement en tout point à la dot au sens français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: était monté
  rationale: Le plus-que-parfait marque un événement antérieur qui explique le contexte des travaux de Salomon, tandis que « monter » conserve l’expression hébraïque du déplacement.
- source_word: וַיִּלְכֹּד
  choice: s’était emparé de
  rationale: Rend clairement le sens militaire de לכד dans un français actuel et naturel.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: l’avait livrée au feu
  rationale: Conserve la mention explicite du feu et l’intensité de l’expression hébraïque sans employer la tournure peu naturelle « brûlée avec du feu ».
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le singulier morphologique a ici une valeur collective désignant la population cananéenne de la ville.
- source_word: הַיֹּשֵׁב בָּעִיר
  choice: qui habitaient la ville
  rationale: Formulation française naturelle qui garde la fonction descriptive du participe hébreu.
- source_word: הָרָג
  choice: avait tué
  rationale: Traduction directe et sobre de הרג, sans archaïsme ni amplification stylistique.
- source_word: וַיִּתְּנָהּ
  choice: l’avait donnée
  rationale: Le pronom féminin renvoie naturellement à la ville de Guézer en français.
- source_word: שִׁלֻּחִים
  choice: comme cadeau de mariage
  rationale: Expression compréhensible et non technique qui rend le don lié au mariage sans imposer à tort une institution matrimoniale française exactement équivalente.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: à sa fille, la femme de Salomon
  rationale: Préserve l’apposition qui identifie la fille du pharaon comme l’épouse de Salomon.
