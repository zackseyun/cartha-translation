lexical_decisions:
- source_word: וַיִּבֶן
  choice: construisit
  rationale: Le qal wayyiqtol de בנה signifie normalement « construire ». Dans ce contexte de travaux royaux, il peut s’agir d’une reconstruction ou de fortifications, mais le sens lexical simple est conservé.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom personnel.
- source_word: גָּזֶר
  choice: Guézer
  rationale: Transcription française courante du nom de lieu hébreu.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: Beth-Horôn-la-Basse
  rationale: Cette formulation française naturelle désigne la localité basse parmi les deux villes appelées Beth-Horôn, tout en préservant la distinction géographique.
- source_word: אֶת / וְאֶת
  choice: '[non traduits séparément]'
  rationale: Ces particules marquent les compléments d’objet direct et leur fonction est rendue par la syntaxe française.
