source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: fr
  text: Mais Salomon ne réduisit aucun des fils d’Israël en esclavage, car ils étaient des hommes de guerre, ses serviteurs, ses chefs, ses officiers[a], ainsi que les chefs de ses chars et de ses cavaliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses aides de camp » ; le terme hébreu désigne peut-être une catégorie particulière d’officiers supérieurs, possiblement liée aux chars.
    reason: Le sens institutionnel précis de שָׁלִישׁ est incertain ; cette note conserve une possibilité de traduction plus spécifique sans la présenter comme certaine.
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: Mais parmi les fils d’Israël
  rationale: « Mais » exprime le contraste avec les populations non israélites soumises aux travaux forcés au verset précédent. « Fils d’Israël » conserve l’expression généalogique et masculine de l’hébreu.
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: Salomon ne fit aucun esclave
  rationale: L’expression signifie que Salomon ne plaça aucun Israélite dans le statut servile décrit par le contexte. « Esclave » rend sans l’atténuer la condition impliquée par עָבֶד.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: ses hommes de guerre
  rationale: Cette formulation actuelle mais digne conserve la désignation masculine et militaire de l’hébreu. Le possessif rend naturelle en français l’intégration de cette catégorie à la liste des hommes au service de Salomon.
- source_word: וַעֲבָדָיו
  choice: ses serviteurs
  rationale: Dans un cadre royal, עֶבֶד peut désigner des serviteurs ou agents du roi sans imposer ici le sens social précis d’« esclaves ». « Serviteurs » préserve la portée large du terme et le contraste contextuel avec le premier עָבֶד.
- source_word: וְשָׂרָיו
  choice: ses chefs
  rationale: שַׂר désigne un responsable, chef ou haut fonctionnaire. « Chefs » convient à cette liste militaire et administrative sans surspécifier le rang.
- source_word: וְשָׁלִשָׁיו
  choice: ses officiers
  rationale: Le référent historique exact de שָׁלִישׁ demeure discuté; « officiers » offre un équivalent clair et non excessivement précis, avec une autre possibilité signalée en note.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: les chefs de ses chars
  rationale: La construction désigne les responsables des chars ou du corps de chars de Salomon. Cette traduction reste proche de la formulation hébraïque.
- source_word: וּפָרָשָׁיו
  choice: ses cavaliers
  rationale: Le mot désigne les troupes montées; « cavaliers » est direct, naturel et historiquement approprié.
theological_decisions:
- issue: Statut social exprimé par עָבֶד dans la première proposition
  choice: ne fit aucun esclave
  alternative: n’affecta aucun homme aux travaux forcés
  rationale: Le contexte oppose les Israélites aux populations assujetties. « Esclave » évite d’adoucir le statut servile, tandis que l’alternative expliciterait davantage le contexte du travail imposé que le mot lui-même.
- issue: Sens de וַעֲבָדָיו dans la liste royale
  choice: ses serviteurs
  alternative: ses fonctionnaires
  rationale: Le même champ lexical peut couvrir divers degrés de dépendance et de service. Ici, dans une énumération de fonctions royales et militaires, « serviteurs » maintient cette largeur sémantique sans affirmer que tous étaient esclaves ni réduire le terme à une charge administrative.
- issue: Désignation masculine de אַנְשֵׁי הַמִּלְחָמָה
  choice: ses hommes de guerre
  alternative: ses guerriers
  rationale: La traduction conserve la forme masculine explicite de la désignation militaire ancienne au lieu de la neutraliser.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde la progression de la liste hébraïque tout en employant « ainsi que » pour éviter une coordination finale lourde. Le contraste lexical entre « esclave » et « serviteurs » reflète les emplois contextuellement distincts de עָבֶד dans le même verset.
