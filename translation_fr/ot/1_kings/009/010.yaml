id: 1KI.9.10
reference: 1 Kings 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ עֶשְׂרִ֣ים שָׁנָ֔ה אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה אֶת שְׁנֵ֣י הַ/בָּתִּ֑ים אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֥ית הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: fr
  text: Il arriva qu’au bout de vingt ans[a], pendant lesquels Salomon avait construit les deux maisons[b] — la maison de Yahweh et la maison du roi —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après vingt ans ». L’expression hébraïque désigne l’achèvement d’une période de vingt ans.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les deux maisons », c’est-à-dire la maison de Yahweh et celle du roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette formule rend la transition narrative introduite par le waw consécutif avec היה, sans employer l’archaïsme « il advint ».
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: au bout de vingt ans
  rationale: L’expression désigne le point atteint lorsque la période de vingt ans est achevée. Cette tournure est naturelle en français et conserve la valeur temporelle de l’hébreu.
- source_word: אֲשֶׁר
  choice: pendant lesquels
  rationale: Le relatif rattache l’activité de construction à la période de vingt ans; « pendant lesquels » exprime clairement ce rapport sans imposer une précision étrangère au texte.
- source_word: בָּנָה
  choice: avait construit
  rationale: Le plus-que-parfait indique qu’au terme de la période considérée, les travaux sont présentés rétrospectivement comme accomplis.
- source_word: שְׁנֵי הַבָּתִּים
  choice: les deux maisons
  rationale: La traduction conserve le sens concret et le parallélisme lexical de בַּיִת, les deux édifices étant ensuite explicitement nommés.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette formulation suit littéralement la construction hébraïque et préserve l’appellation « maison » plutôt que de l’interpréter directement comme « Temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que remplacé par un titre.
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: La formulation conserve le parallèle avec « la maison de Yahweh »; « palais royal » serait naturel, mais plus interprétatif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le distingue d’un simple titre et maintient la tension entre nom propre et désignation traditionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. « Il arriva que » garde la transition du récit sans archaïsme marqué. Le tiret final est conservé parce que la phrase se poursuit au verset suivant.
