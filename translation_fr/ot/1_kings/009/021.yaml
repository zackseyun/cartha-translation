language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: fr
  text: Leurs descendants qui étaient restés après eux dans le pays, et que les Israélites n’avaient pas pu vouer à la destruction[a], Salomon les réquisitionna pour le travail forcé, jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frapper d’interdit » ou « détruire entièrement ». Le verbe hébreu désigne ici le fait de placer des personnes sous l’interdit, comme une consécration irrévocable au jugement.
    reason: Signaler l’étendue sémantique et théologique de חרם sans la réduire à la seule destruction militaire.
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: leurs descendants
  rationale: Le pluriel de בֵּן peut désigner les fils, les enfants ou, comme ici, la génération issue des peuples précédemment nommés. « Descendants » exprime clairement ce rapport sans limiter le groupe aux hommes.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: étaient restés après eux
  rationale: Cette formulation conserve à la fois l’idée du reste survivant et la relation temporelle avec la génération antérieure.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce récit, אֶרֶץ désigne le territoire où demeuraient ces populations. « Pays » est naturel en français moderne et n’ajoute pas un nom géographique absent du texte.
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: n’avaient pas pu vouer à la destruction
  rationale: Le verbe חרם associe la mise irrévocable à part sous jugement et la destruction. Cette expression garde ces deux dimensions mieux que le simple verbe « détruire ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Équivalent français courant et naturel de l’expression hébraïque « les fils d’Israël » dans un contexte collectif.
- source_word: וַיַּעֲלֵם
  choice: les réquisitionna
  rationale: Le hiphil de עלה suivi de לְמַס décrit ici l’affectation administrative de personnes à une corvée. « Réquisitionna » rend cette action causative sans affirmer un statut juridique d’esclave.
- source_word: לְמַס עֹבֵד
  choice: pour le travail forcé
  rationale: מַס désigne une levée ou corvée, et עֹבֵד en précise le caractère laborieux. « Travail forcé » est clair, actuel et moins technique que « corvée ».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Formule française traditionnelle et précise correspondant directement à l’expression temporelle hébraïque, sans expliciter davantage ce qui perdure.
theological_decisions:
- issue: Sens de החרים dans un contexte de conquête et de jugement
  choice: vouer à la destruction
  alternative: exterminer entièrement ; frapper d’interdit
  rationale: « Vouer à la destruction » préserve la tension entre destruction et mise à part irrévocable sous jugement. « Exterminer » aplatirait la dimension cultuelle, tandis que « frapper d’interdit » serait moins immédiatement compréhensible.
translation_notes:
  register: Français international moderne, sobre et digne. La longue phrase suit le mouvement syntaxique de l’hébreu tout en employant des termes courants. La finale « jusqu’à ce jour » conserve la concision et une certaine ambiguïté du texte quant à l’aspect précis de la situation qui perdure.
