base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: fr
  text: Ils allèrent[a] à Ophir, en prirent quatre cent vingt talents d’or et les apportèrent au roi Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ils arrivèrent à Ophir ». Le verbe hébreu peut exprimer le fait d’aller ou de venir, selon le point de vue adopté dans le récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils allèrent
  rationale: Dans cette séquence narrative, le mouvement est présenté vers Ophir. « Allèrent » est naturel en français, tandis que la note conserve l’autre valeur possible du verbe בוא.
- source_word: אוֹפִירָה
  choice: à Ophir
  rationale: Le hé directionnel ajouté au nom de lieu indique un mouvement vers Ophir, rendu par la préposition « à ».
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: y prirent
  rationale: Le pronom adverbial « y » reprend naturellement Ophir et exprime ici le lieu d’où l’or fut pris, sans alourdir la phrase par « prirent de là ».
- source_word: זָהָב
  choice: d’or
  rationale: Rendu courant du nom זָהָב; le complément « talents d’or » est idiomatique en français.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: quatre cent vingt talents
  rationale: La quantité exacte est conservée et l’ancienne unité de poids כִּכָּר est rendue par son équivalent traditionnel « talent ».
- source_word: וַיָּבִאוּ
  choice: les apportèrent
  rationale: Le hifil de בוא signifie ici « apporter ». Le pronom « les » reprend les quatre cent vingt talents et rend explicite l’objet sous-entendu en hébreu.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: au roi Salomon
  rationale: Cette formulation respecte l’apposition hébraïque tout en suivant l’ordre naturel du titre et du nom en français.
