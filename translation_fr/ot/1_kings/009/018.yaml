  text: and Baalath[a], and Tamar in the wilderness, in the land.
translation:
  language: fr
  text: et Baalath et Tamar[a], dans le désert, dans le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Tamar » ; le passage parallèle, en 2 Chroniques 8.4, porte « Tadmor ».
    reason: Variante textuelle dans le passage parallèle.
lexical_decisions:
- source_word: וְ/אֶת
  choice: ainsi que
  rationale: La particule אֵת, qui marque le complément d’objet direct, ne se traduit pas; la conjonction וְ poursuit l’énumération commencée au verset précédent. « Ainsi que » rend naturellement cette continuité en français.
- source_word: בַּעֲלָת
  choice: Baalath
  rationale: Nom de lieu conservé sous une forme translittérée traditionnelle.
- source_word: וְ/אֶת
  choice: et
  rationale: Comme dans la première occurrence, אֵת reste implicite, tandis que וְ coordonne les deux noms de lieux.
- source_word: תמר
  choice: Tamar
  rationale: Le texte consonantique massorétique porte תמר, rendu par « Tamar ». La leçon « Tadmor » du passage parallèle est signalée en note plutôt qu’introduite dans le texte.
- source_word: בַּ/מִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne ici une région désertique ou sauvage; « désert » est naturel et géographiquement approprié en français moderne.
- source_word: בָּ/אָֽרֶץ
  choice: dans le pays
  rationale: אֶרֶץ a ici un sens territorial général. « Pays » préserve cette référence sans en préciser abusivement l’étendue.
