source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: fr
  text: 'Et cette maison sera réduite en ruines[a]. Tous ceux qui passeront près d’elle seront consternés, siffleront[b] et diront : « Pourquoi Yahweh a-t-il fait cela à ce pays et à cette maison ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu dit : « cette maison sera haute » ou « sera élevée ». Dans ce contexte, beaucoup comprennent que la maison deviendra une ruine ou un spectacle effrayant; voir aussi 2 Chroniques 7.21.'
    reason: Difficulté textuelle et sens contextuel de עֶלְיוֹן.
  - marker: b
    text: Ce sifflement est un son aigu exprimant la stupeur ou la dérision.
    reason: Précision sur la portée du verbe hébreu שׁרק.
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: Et cette maison
  rationale: בַּיִת signifie littéralement « maison ». Dans ce contexte, le mot désigne le temple, mais « maison » conserve le vocabulaire hébreu et sa répétition rhétorique.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: sera réduite en ruines
  rationale: Le texte massorétique porte littéralement « sera haute/élevée », formulation difficile dans ce contexte de jugement. Le sens contextuel de dévastation est exprimé dans le texte, tandis que la difficulté hébraïque est explicitement conservée en note.
- source_word: כָּל עֹבֵר עָלָיו
  choice: Tous ceux qui passeront près d’elle
  rationale: L’expression désigne les passants. Cette formulation est naturelle en français et conserve la portée distributive de כָּל.
- source_word: יִשֹּׁם
  choice: seront consternés
  rationale: Le verbe décrit une réaction de stupeur horrifiée devant la dévastation. « Être consterné » en rend clairement la force émotionnelle.
- source_word: וְשָׁרָק
  choice: siffleront
  rationale: Le verbe évoque un son aigu marquant la stupeur ou la dérision. « Siffler » est l’équivalent lexical direct; la valeur du geste est précisée en note.
- source_word: וְאָמְרוּ
  choice: et diront
  rationale: Le pluriel hébreu se rattache naturellement en français à « tous ceux qui passeront ».
- source_word: עַל מֶה
  choice: Pourquoi
  rationale: La locution demande la cause du jugement; « pourquoi » est son équivalent français le plus naturel.
- source_word: עָשָׂה יְהוָה כָּכָה
  choice: Yahweh a-t-il fait cela
  rationale: La formulation française rend directement la question portant sur l’acte de jugement visible et conserve le nom divin.
- source_word: לָאָרֶץ הַזֹּאת
  choice: à ce pays
  rationale: אֶרֶץ désigne ici le territoire concerné plutôt que la terre au sens cosmique; « pays » est clair en français moderne.
- source_word: וְלַבַּיִת הַזֶּה
  choice: et à cette maison
  rationale: « Maison » conserve le terme hébreu et la reprise exacte du début du verset, tout en désignant contextuellement le temple.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de עֶלְיוֹן dans le contexte du jugement
  choice: sera réduite en ruines
  alternative: sera haute / élevée
  rationale: Le sens littéral du texte massorétique est difficile à concilier avec la réaction horrifiée des passants et le contexte de malédiction. La traduction contextuelle est retenue sans dissimuler la tension textuelle, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement du texte hébreu sans lourdeur; « maison » maintient le motif littéraire, et les notes préservent l’ambiguïté textuelle ainsi que la valeur culturelle du sifflement.
