  text: וְ/עַתָּ֡ה צַוֵּה֩ וְ/יִכְרְתוּ לִ֨/י אֲרָזִ֜ים מִן הַ/לְּבָנ֗וֹן וַֽ/עֲבָדַ/י֙ יִהְי֣וּ עִם עֲבָדֶ֔י/ךָ וּ/שְׂכַ֤ר עֲבָדֶ֨י/ךָ֙ אֶתֵּ֣ן לְ/ךָ֔ כְּ/כֹ֖ל אֲשֶׁ֣ר תֹּאמֵ֑ר כִּ֣י אַתָּ֣ה יָדַ֗עְתָּ כִּ֣י אֵ֥ין בָּ֛/נוּ אִ֛ישׁ יֹדֵ֥עַ לִ/כְרָת עֵצִ֖ים כַּ/צִּדֹנִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: fr
  text: Maintenant, ordonne que l’on abatte pour moi des cèdres du Liban. Que mes serviteurs soient avec les tiens, et je te donnerai le salaire de tes serviteurs selon tout ce que tu diras. En effet, tu sais qu’il n’y a parmi nous aucun homme[a] qui sache abattre des arbres[b] comme les Sidoniens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « aucun homme parmi nous ». Dans ce contexte, l’expression signifie que personne parmi eux ne possède une compétence comparable ; elle ne formule pas nécessairement une exclusion sociale fondée sur le sexe.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « couper du bois ». L’hébreu parle littéralement de « couper des arbres », dans un contexte d’exploitation du bois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers la demande. « Maintenant » est naturel en français moderne sans alourdir la phrase par un « Et » initial.
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: ordonne que l’on abatte pour moi
  rationale: L’impératif suivi du jussif exprime l’ordre demandé au roi. Le sujet des exécutants restant indéfini en hébreu, « que l’on » le préserve naturellement; « abattre » convient à des arbres destinés au bois d’œuvre.
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  choice: des cèdres du Liban
  rationale: Formulation française usuelle et concise indiquant la provenance des cèdres.
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: Mes serviteurs seront avec les tiens
  rationale: Conserve le terme עבד et le sens simple de l’arrangement prévu. Le pronom « les tiens » évite une répétition pesante sans en changer le référent.
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: je te donnerai le salaire de tes serviteurs
  rationale: שׂכר désigne la rémunération du travail. La traduction maintient la forme directe de la promesse faite au roi.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: selon tout ce que tu diras
  rationale: Rend la portée générale de כְּכֹל ainsi que la fixation des conditions par l’interlocuteur, sans préciser davantage que l’hébreu.
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: En effet, tu sais
  rationale: Introduit clairement en français la raison donnée pour cette demande. Le pronom explicite correspond naturellement à la construction française.
- source_word: אֵין בָּנוּ אִישׁ
  choice: il n’y a parmi nous aucun homme
  rationale: Reproduit formellement אִישׁ tout en plaçant « parmi nous » comme dans le sens de l’expression hébraïque. Une note signale que l’énoncé porte sur l’absence d’une personne possédant cette compétence.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: qui sache abattre des arbres
  rationale: La tournure exprime un savoir-faire. « Abattre des arbres » rend concrètement כרת et le pluriel עֵצִים dans ce contexte d’exploitation forestière.
- source_word: כַּצִּדֹנִים
  choice: comme les Sidoniens
  rationale: Préserve directement la comparaison avec les Sidoniens, réputés ici pour leur savoir-faire.
