base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: fr
  text: Car il exerçait son autorité sur tout le pays d’au-delà du Fleuve[a], depuis Tiphsah jusqu’à Gaza, sur tous les rois d’au-delà du Fleuve ; et il avait la paix de tous côtés autour de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire l’Euphrate.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: il dominait
  rationale: Le participe exprime ici l’exercice continu de l’autorité. « Il dominait » rend naturellement cette valeur durative et la suzeraineté politique impliquée par le contexte.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: sur toute la région située de l’autre côté du Fleuve
  rationale: L’expression désigne un territoire au-delà de l’Euphrate. L’ajout de « région située » explicite naturellement en français la valeur géographique sans remplacer la formulation hébraïque par son référent.
- source_word: הַנָּהָר
  choice: le Fleuve
  rationale: L’hébreu emploie le nom commun défini comme désignation conventionnelle de l’Euphrate. La majuscule signale cet emploi géographique, tandis qu’une note identifie le fleuve.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: depuis Tipsah jusqu’à Gaza
  rationale: La tournure marque les limites géographiques de la domination. « Tipsah » est une translittération française simple de תִּפְסַח.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: sur tous les rois de l’autre côté du Fleuve
  rationale: La préposition exprime l’autorité exercée sur ces rois. Cette formulation reste concise et conserve la portée politique du texte.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: et il jouissait de la paix
  rationale: L’expression concerne la paix et la sécurité politiques dont bénéficiait le roi. « Jouissait de la paix » est idiomatique en français tout en conservant l’idée que cette paix lui était acquise.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: de tous côtés, tout autour de lui
  rationale: Cette expression spatiale indique que la paix régnait dans toutes les directions environnantes. La traduction évite d’interpréter plus précisément עֲבָרָיו comme « voisins » ou « frontières ».
