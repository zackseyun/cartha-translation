  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: fr
  text: Il prononça trois mille proverbes[a], et ses chants furent au nombre de mille cinq.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sentences » ou « paraboles » ; le mot hébreu מָשָׁל a un sens plus large que « proverbe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Il prononça
  rationale: Le piel de דבר signifie ici « parler, énoncer ». « Il prononça » reste proche du verbe hébreu tout en convenant à des proverbes, sans expliciter l’idée de composition.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: trois mille
  rationale: Rendu direct et idiomatique du nombre cardinal.
- source_word: מָשָׁל
  choice: proverbes
  rationale: Après le nombre, le singulier hébreu a une valeur comptable collective. « Proverbes » convient au contexte de la sagesse de Salomon, tandis qu’une note conserve l’étendue sémantique plus large du terme.
- source_word: וַיְהִי
  choice: furent au nombre de
  rationale: Dans cet énoncé numérique, היה indique le total. Cette tournure française naturelle évite qu’« étaient » suggère seulement une qualité ou une identité.
- source_word: שִׁירוֹ
  choice: ses chants
  rationale: Le nom singulier suffixé prend ici une valeur collective devant le nombre. « Chants » est digne et naturel en français biblique moderne.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: mille cinq
  rationale: L’hébreu dit littéralement « cinq et mille ». Le français ordonne naturellement le nombre comme « mille cinq », en conservant le total exact de 1 005.
