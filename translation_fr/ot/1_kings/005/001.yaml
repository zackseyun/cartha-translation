id: 1KI.5.1
reference: 1 Kings 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: fr
  text: Salomon dominait sur tous les royaumes depuis le Fleuve[a] jusqu’au pays des Philistins et jusqu’à la frontière de l’Égypte. Ils lui apportaient un tribut[b] et le servaient tous les jours de sa vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire l’Euphrate.
    reason: cross_reference
  - marker: b
    text: Ou « un présent ». Le mot hébreu peut désigner un don, une offrande ou un tribut ; ici, le contexte politique favorise « tribut ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: dominait
  rationale: Le participe accompagné de הָיָה décrit une domination continue dans le passé. L’imparfait français rend naturellement cette valeur durative.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: sur tous les royaumes
  rationale: Avec משל, la préposition marque ici l’autorité exercée sur plusieurs royaumes soumis.
- source_word: מִן הַנָּהָר
  choice: depuis le Fleuve
  rationale: Le texte emploie l’appellation géopolitique conventionnelle « le Fleuve », identifiée comme l’Euphrate en note.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: pays des Philistins
  rationale: Cette formulation claire et directe reflète le syntagme construit hébreu.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: et jusqu’à la frontière de l’Égypte
  rationale: La tournure exprime la limite géographique de l’étendue territoriale.
- source_word: מַגִּשִׁים מִנְחָה
  choice: lui apportaient un tribut
  rationale: מִנְחָה peut désigner un don, une offrande ou un tribut. Le contexte de royaumes soumis favorise ici le sens politique de « tribut ».
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: le servaient
  rationale: עבד avec une personne comme objet indique le service rendu à un supérieur, ici dans un cadre politique, sans préciser indûment sa forme.
- source_word: כָּל יְמֵי חַיָּיו
  choice: tous les jours de sa vie
  rationale: La traduction conserve l’idiome hébreu tout en restant naturelle et intelligible en français.
theological_decisions: []
