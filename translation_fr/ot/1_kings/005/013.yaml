base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: fr
  text: Il parla des arbres, depuis le cèdre qui se trouve au Liban jusqu’à l’hysope[a] qui sort du mur. Il parla aussi des animaux, des oiseaux, des êtres qui rampent et des poissons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « une petite plante aromatique ». L’identification botanique exacte du terme hébreu אֵזוֹב est incertaine ; « hysope » est la traduction traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: Il parla de
  rationale: La construction דבר על signifie ici « parler de, au sujet de ». Cette formulation naturelle ne précise pas s’il les décrivait ou les enseignait en détail.
- source_word: הָעֵצִים
  choice: les arbres
  rationale: Le pluriel עֵצִים désigne ici les arbres ou végétaux ligneux; « arbres » est le terme français courant et convient au parcours allant du cèdre à l’hysope.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: le cèdre qui pousse au Liban
  rationale: Le relatif hébreu indique littéralement le cèdre « qui est au Liban ». « Qui pousse » explicite naturellement la présence d’un arbre dans cette région sans modifier le sens.
- source_word: מִן ... וְעַד
  choice: depuis ... jusqu’à
  rationale: Cette tournure rend la construction corrélative et son étendue, du grand cèdre au petit végétal mural.
- source_word: הָאֵזוֹב
  choice: l’hysope
  rationale: « Hysope » est la traduction traditionnelle et reconnue, mais l’identification botanique exacte reste incertaine; cette incertitude est signalée en note.
- source_word: יֹצֵא בַּקִּיר
  choice: qui sort du mur
  rationale: Cette formulation conserve l’image littérale de יצא, « sortir », sans imposer une interprétation botanique plus précise. Elle peut désigner une plante qui pousse hors d’un mur.
- source_word: הַבְּהֵמָה
  choice: les animaux
  rationale: Dans cette énumération zoologique, בְּהֵמָה désigne largement les animaux terrestres plutôt que seulement le bétail.
- source_word: הָעוֹף
  choice: les oiseaux
  rationale: « Oiseaux » rend naturellement la catégorie des créatures volantes dans ce contexte.
- source_word: הָרֶמֶשׂ
  choice: les êtres qui rampent
  rationale: Cette expression conserve l’étendue de la catégorie hébraïque, qui ne se limite pas aux reptiles.
- source_word: הַדָּגִים
  choice: les poissons
  rationale: C’est l’équivalent français courant du pluriel hébreu désignant cette catégorie aquatique.
theological_decisions: []
