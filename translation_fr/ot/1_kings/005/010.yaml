id: 1KI.5.10
reference: 1 Kings 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תֵּ֨רֶב֙ חָכְמַ֣ת שְׁלֹמֹ֔ה מֵֽ/חָכְמַ֖ת כָּל בְּנֵי קֶ֑דֶם וּ/מִ/כֹּ֖ל חָכְמַ֥ת מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: fr
  text: La sagesse de Salomon surpassait celle de tous les peuples de l’Orient[a] et toute la sagesse de l’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « tous les fils de l’Orient » ; expression hébraïque désignant les populations de l’Est.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: surpassait
  rationale: Le verbe רבה, suivi de la préposition comparative מִן, exprime ici une supériorité de degré. « Surpassait » rend clairement cette comparaison en français naturel.
- source_word: חָכְמַת / חָכְמָה
  choice: la sagesse
  rationale: Dans ce contexte, le terme désigne largement la sagesse, le savoir et l’excellence intellectuelle. « Sagesse » demeure le rendu français le plus juste et le plus courant.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: מֵחָכְמַת
  choice: celle de
  rationale: Après « la sagesse de Salomon surpassait », le pronom « celle » évite une répétition lourde tout en conservant explicitement l’objet de la comparaison.
- source_word: כָּל
  choice: tous / toute
  rationale: L’accord varie selon le substantif français, mais la portée globale de chacune des deux occurrences hébraïques est conservée.
- source_word: בְּנֵי קֶדֶם
  choice: les peuples de l’Orient
  rationale: Littéralement « les fils de l’Orient », il s’agit d’une désignation ethnogéographique idiomatique. « Les peuples de l’Orient » est naturel en français et préserve la dimension collective ainsi que la référence régionale.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: et toute la sagesse de l’Égypte
  rationale: Ce second complément comparatif dépend du même verbe. La formulation française maintient sa coordination avec le premier sans répéter « surpassait ».
- source_word: מִצְרָיִם
  choice: l’Égypte
  rationale: Nom français usuel du pays.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. L’imparfait « surpassait » convient à la description narrative d’une qualité durable. « Les peuples de l’Orient » évite le calque peu naturel « les fils de l’Orient », dont l’image littérale est néanmoins signalée en note.
