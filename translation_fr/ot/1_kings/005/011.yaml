base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: fr
  text: Il était plus sage que tous les hommes[b], plus sage qu’Éthan l’Ézrahite[a], qu’Héman, Kalkol et Darda, les fils de Mahol. Son nom était connu[c] dans toutes les nations alentour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ézrahite » semble être une désignation familiale ou ethnique ; certains la rapprochent de « Zérahite ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu rendu par « tous les hommes » peut aussi désigner l’ensemble de l’humanité. Dans ce contexte, la comparaison avec des sages masculins nommés favorise « tous les hommes ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « son nom était dans toutes les nations alentour ». Cette expression désigne sa notoriété ou sa renommée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם
  choice: Il était plus sage
  rationale: Avec la construction comparative introduite par מִן, le verbe exprime ici une supériorité en sagesse plutôt qu’un simple devenir.
- source_word: מִכָּל הָאָדָם
  choice: que tout homme
  rationale: אָדָם peut désigner un homme ou l’humanité; la comparaison immédiatement précisée par des sages masculins nommés favorise ici « tout homme », tout en laissant l’autre possibilité en note.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: plus qu’Étan l’Ezrahite
  rationale: Le terme הָאֶזְרָחִי est conservé comme désignation familiale ou ethnique translittérée, sans trancher son étymologie incertaine.
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: qu’Hémân, Kalkol et Darda
  rationale: Les noms propres sont translittérés d’après leurs formes hébraïques, avec des accents adaptés à la lecture française lorsque cela est usuel.
- source_word: בְּנֵי מָחוֹל
  choice: les fils de Mahol
  rationale: Dans cette liste de personnes nommées, la lecture patronymique ou familiale est la plus directe; les interprétations liées au sens de « danse » sont plus conjecturales.
- source_word: וַיְהִי שְׁמוֹ
  choice: Son nom était connu
  rationale: L’expression signifie littéralement que « son nom était » dans les nations, mais elle désigne idiomatiquement sa renommée; « était connu » reste proche de l’image du nom tout en étant naturel en français.
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  choice: parmi toutes les nations environnantes
  rationale: גּוֹיִם désigne ici les peuples ou nations voisins, sans la connotation théologique plus tardive de « païens ».
theological_decisions:
- issue: Portée de אָדָם dans la comparaison
  choice: tout homme
  alternative: toute l’humanité
  rationale: La forme peut être collective et universelle, mais les sages masculins ensuite nommés rendent « tout homme » contextuellement plausible. La note préserve explicitement la portée plus large possible.
- issue: Sens de la formule « son nom était »
  choice: Son nom était connu
  alternative: Son nom était parmi toutes les nations environnantes
  rationale: Le français explicite légèrement l’idée idiomatique de réputation sans remplacer « nom » par « renommée »; la note donne le sens littéral.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe comparative est clarifiée par la répétition de « plus que ». Les noms suivent une translittération lisible en français. Les ambiguïtés de אָדָם, d’« Ezrahite » et de l’idiome portant sur le nom sont préservées dans les notes.
