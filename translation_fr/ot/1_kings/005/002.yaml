  text: וַ/יְהִ֥י לֶֽחֶם שְׁלֹמֹ֖ה לְ/י֣וֹם אֶחָ֑ד שְׁלֹשִׁ֥ים כֹּר֙ סֹ֔לֶת וְ/שִׁשִּׁ֥ים כֹּ֖ר קָֽמַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/002.yaml
  text: Solomon’s provision for one day was thirty cors of fine flour and sixty cors of meal[b][a],
translation:
  language: fr
  text: La provision quotidienne de Salomon était de trente cors de fleur de farine et de soixante cors de farine[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le cor était une grande unité de capacité pour les matières sèches. L’hébreu porte « trente cors » et « soixante cors ».
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « le pain de Salomon » ; le mot « pain » désigne ici plus largement sa provision alimentaire quotidienne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: était
  rationale: Le wayyiqtol de היה poursuit le récit et introduit ici un état; l’imparfait français convient naturellement, sans ajouter un marqueur temporel absent du texte.
- source_word: לֶחֶם שְׁלֹמֹה
  choice: la provision de Salomon
  rationale: לֶחֶם signifie littéralement « pain », mais désigne ici, dans un relevé administratif de denrées, la provision alimentaire de la maison royale.
- source_word: לְיוֹם אֶחָד
  choice: quotidienne
  rationale: Cette formulation française exprime naturellement la quantité nécessaire pour une journée.
- source_word: שְׁלֹשִׁים כֹּר
  choice: trente cors
  rationale: Le nom de cette ancienne unité de capacité est translittéré plutôt que remplacé dans le texte par une équivalence moderne incertaine.
- source_word: סֹלֶת
  choice: fleur de farine
  rationale: Le terme désigne une farine fine et de qualité; « fleur de farine » est précis, idiomatique et distingue ce produit du terme plus général qui suit.
- source_word: וְשִׁשִּׁים כֹּר
  choice: et de soixante cors
  rationale: La répétition de la préposition en français clarifie que la même unité s’applique à la seconde quantité.
- source_word: קָמַח
  choice: farine
  rationale: קָמַח est le terme général pour la farine, par contraste avec la farine fine סֹלֶת.
theological_decisions: []
