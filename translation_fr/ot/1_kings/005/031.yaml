  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ וַ/יַּסִּעוּ֩ אֲבָנִ֨ים גְּדֹל֜וֹת אֲבָנִ֧ים יְקָר֛וֹת לְ/יַסֵּ֥ד הַ/בָּ֖יִת אַבְנֵ֥י גָזִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: fr
  text: Alors le roi donna l’ordre d’extraire de grandes pierres, des pierres de grande valeur, des pierres de taille[a], afin de poser les fondations de la maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des pierres taillées » ou « des pierres équarries ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire le temple ; l’hébreu porte « la maison ».
    reason: cross_reference
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Alors le roi donna l’ordre
  rationale: Le wayyiqtol fait progresser le récit. « Alors » rend naturellement cette succession, et « donna l’ordre » exprime clairement le verbe צוה en français moderne.
- source_word: וַיַּסִּעוּ
  choice: d’extraire
  rationale: La forme causative de נסע peut évoquer le fait de déplacer ou d’arracher. Dans ce contexte de construction, il s’agit vraisemblablement d’extraire les pierres de la carrière, sans qu’il soit nécessaire d’ajouter explicitement « de la carrière ».
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: de grandes pierres
  rationale: Traduction directe et naturelle du nom accompagné de l’adjectif.
- source_word: אֲבָנִים יְקָרוֹת
  choice: des pierres de prix
  rationale: יקר signifie ici « précieux, de valeur, coûteux ». « Pierres de prix » garde un registre digne et évite de faire penser à des pierres gemmes.
- source_word: לְיַסֵּד
  choice: afin de poser les fondations
  rationale: Dans un contexte architectural, יסד désigne l’établissement des fondations. La tournure française au pluriel est idiomatique.
- source_word: הַבָּיִת
  choice: la maison
  rationale: Le texte hébreu dit littéralement « la maison ». Le contexte désigne le temple, précision conservée en note plutôt qu’intégrée silencieusement au texte.
- source_word: אַבְנֵי גָזִית
  choice: des pierres de taille
  rationale: L’expression désigne des pierres taillées ou équarries. « Pierres de taille » est le terme architectural français naturel et fonctionne ici comme une troisième description appositionnelle des pierres.
theological_decisions:
- issue: Sens de הַבָּיִת dans le contexte du sanctuaire
  choice: Conserver « la maison » dans le texte et préciser en note qu’il s’agit du temple
  alternative: Traduire directement par « le temple »
  rationale: Cette solution préserve la diction hébraïque tout en levant l’ambiguïté contextuelle pour le lecteur, sans imposer au texte principal une explicitation absente du lexème source.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « pierres » est maintenue pour reproduire l’insistance et la structure appositionnelle de l’hébreu. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
