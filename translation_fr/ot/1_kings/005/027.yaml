  text: וַ/יַּ֨עַל הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מַ֖ס מִ/כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י הַ/מַּ֔ס שְׁלֹשִׁ֥ים אֶ֖לֶף אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/027.yaml
  text: King Solomon conscripted forced labor from all Israel[b][a], and the forced labor was thirty thousand men.
translation:
  language: fr
  text: Le roi Salomon leva parmi tout Israël une corvée[a] ; elle comptait trente mille hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « imposa parmi tout Israël un service de travail obligatoire ». Le mot hébreu désigne ici une prestation de travail imposée, et non principalement un impôt en argent.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: imposa
  rationale: Le hifil de עלה, associé à מַס dans ce contexte administratif, exprime l’établissement d’une levée. « Imposa » est naturel en français et conserve l’initiative contraignante du roi.
- source_word: מַס
  choice: service de travail obligatoire
  rationale: Ici, מַס désigne une prestation de travail exigée par l’autorité, et non principalement un impôt en argent. Cette formulation est plus accessible que le terme technique « corvée ».
- source_word: מִכָּל יִשְׂרָאֵל
  choice: à tout Israël
  rationale: La préposition מן marque ici la population au sein de laquelle la levée est effectuée. Avec « imposer un service », « à tout Israël » rend naturellement la portée générale de la mesure sans affirmer que chaque individu a personnellement travaillé.
- source_word: וַיְהִי הַמַּס
  choice: y furent soumis
  rationale: La reprise française évite de répéter lourdement « service de travail obligatoire » et introduit naturellement l’effectif de la levée, tout en conservant sa nature coercitive.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: trente mille hommes
  rationale: אִישׁ désigne ici les hommes comptés pour cette main-d’œuvre ; « hommes » conserve la spécificité masculine du texte.
