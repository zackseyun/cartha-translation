translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple porte l’action principale, tandis que les plus-que-parfaits rendent les faits antérieurs. La seconde occurrence de כִּי est rendue par une nouvelle phrase introduite par « En effet » afin de clarifier le lien explicatif sans résoudre davantage la nature exacte de l’affection d’Hiram pour David.
