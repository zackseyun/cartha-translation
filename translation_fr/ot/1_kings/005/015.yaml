base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: fr
  text: Hiram, roi de Tyr, envoya ses serviteurs auprès de Salomon, car il avait appris qu’on l’avait oint roi à la place de son père. En effet, Hiram avait toujours aimé David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Hiram avait été l’ami de David toute sa vie. » L’hébreu dit littéralement qu’Hiram « aimait David tous les jours », ce qui exprime une relation favorable et durable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le passé simple convient au verbe narratif hébreu et au registre soutenu d’un récit historique en français.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: Hiram, roi de Tyr
  rationale: Cette formulation française naturelle conserve le nom propre et le titre royal en apposition.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme peut désigner des serviteurs, des sujets ou des agents royaux. « Serviteurs » préserve cette amplitude sans préciser indûment leur statut.
- source_word: אֶל שְׁלֹמֹה
  choice: auprès de Salomon
  rationale: Dans ce contexte diplomatique, « auprès de » exprime naturellement l’envoi de représentants vers Salomon, sans ajouter de but explicite.
- source_word: כִּי שָׁמַע
  choice: car il avait appris
  rationale: Le premier כִּי introduit la raison de l’envoi, et le plus-que-parfait marque l’antériorité de l’information reçue.
- source_word: כִּי אֹתוֹ מָשְׁחוּ לְמֶלֶךְ
  choice: qu’on l’avait consacré roi
  rationale: Le « on » français rend le sujet pluriel non identifié du verbe hébreu. « Consacré roi » communique l’onction royale dans une langue actuelle sans effacer sa fonction d’investiture.
- source_word: תַּחַת אָבִיהוּ
  choice: à la place de son père
  rationale: Dans un contexte de succession, תַּחַת indique que Salomon remplace son père comme roi.
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד
  choice: En effet, Hiram avait toujours aimé David
  rationale: La construction exprime une disposition durable. « Avait toujours aimé » conserve la chaleur relationnelle du verbe אהב sans la réduire à une alliance politique.
- source_word: כָּל הַיָּמִים
  choice: toujours
  rationale: « Toujours » rend naturellement en français la continuité exprimée par « tous les jours ».
