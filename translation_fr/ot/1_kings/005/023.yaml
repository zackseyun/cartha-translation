  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: fr
  text: Mes serviteurs les feront descendre du Liban jusqu’à la mer. Je les formerai en radeaux sur la mer jusqu’au lieu que tu m’indiqueras. Là, je les démonterai, et toi, tu les emporteras. Quant à toi, tu feras ce que je désire en fournissant de la nourriture pour ma maisonnée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en donnant du pain à ma maison ». Ici, « pain » désigne probablement la nourriture ou les provisions, et « maison » la maisonnée d’Hiram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: mes serviteurs
  rationale: Dans ce contexte royal et administratif, le terme désigne les hommes au service d’Hiram, sans mettre l’accent sur leur statut juridique.
- source_word: יֹרִדוּ
  choice: les feront descendre
  rationale: 'Le hiphil de ירד est causatif : les serviteurs feront descendre le bois depuis le Liban jusqu’à la côte.'
- source_word: יָמָּה
  choice: jusqu’à la mer
  rationale: La forme indique un mouvement en direction de la mer ; cette traduction convient au transport maritime décrit ensuite.
- source_word: אֲשִׂימֵם דֹּבְרוֹת
  choice: je les assemblerai en radeaux
  rationale: Le groupe verbal décrit la mise des pièces de bois sous forme de radeaux destinés au flottage.
- source_word: בַּיָּם
  choice: sur la mer
  rationale: « Sur » exprime naturellement en français l’image de radeaux flottant à la surface de la mer.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: jusqu’au lieu que tu m’indiqueras
  rationale: L’expression signifie probablement que Salomon fera connaître à Hiram le lieu de livraison. « Indiquer » rend cette portée sans préciser indûment la manière dont le message sera envoyé.
- source_word: וְנִפַּצְתִּים
  choice: je les désassemblerai
  rationale: נפץ peut exprimer l’idée de briser ou disperser ; dans ce contexte, il s’agit de défaire les radeaux une fois arrivés.
- source_word: תִשָּׂא
  choice: tu les emporteras
  rationale: נשא a le sens large de soulever, porter ou prendre ; ici, Salomon devra prendre en charge le bois après le démontage des radeaux.
- source_word: חֶפְצִי
  choice: mon désir
  rationale: Le mot désigne ce que souhaite ou veut Hiram et conserve ici sa dimension personnelle.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: en fournissant de la nourriture aux gens de ma maison
  rationale: « Pain » désigne par métonymie la nourriture ou les provisions, tandis que « maison » renvoie ici vraisemblablement à la maisonnée royale.
theological_decisions: []
