revisions:
- from: Mes serviteurs les feront descendre du Liban jusqu’à la mer. Je les assemblerai en radeaux sur la mer et les conduirai jusqu’au lieu que tu m’indiqueras. Là, je les désassemblerai, et toi, tu les emporteras. Quant à toi, tu satisferas mon désir en fournissant de la nourriture aux gens de ma maison.[a]
  to: Mes serviteurs les feront descendre du Liban jusqu’à la mer. Je les formerai en radeaux sur la mer jusqu’au lieu que tu m’indiqueras. Là, je les démonterai, et toi, tu les emporteras. Quant à toi, tu feras ce que je désire en fournissant de la nourriture pour ma maisonnée.[a]
  rationale: La révision resserre la formulation sur la syntaxe et les actions du texte source, remplace deux expressions françaises moins naturelles, et conserve l’ambiguïté lexicale de « pain » et de « maison » dans la note.
