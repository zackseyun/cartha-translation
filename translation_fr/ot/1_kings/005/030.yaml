  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: fr
  text: 'Sans compter les principaux responsables de Salomon chargés de l’ouvrage : trois mille trois cents, qui exerçaient leur autorité sur les travailleurs qui accomplissaient le travail[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « le peuple » ; il s’agit ici des personnes qui travaillaient à l’ouvrage. « Exerçaient leur autorité » traduit un verbe qui peut signifier « dominer » ou « gouverner » ; dans ce contexte, il désigne leur autorité sur les travailleurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: sans compter
  rationale: Introduit naturellement en français un groupe qui s’ajoute aux effectifs mentionnés auparavant.
- source_word: שָּׂרֵי הַנִּצָּבִים
  choice: les chefs des intendants
  rationale: Conserve à la fois l’idée de rang portée par שׂרים et celle de fonction administrative ou de surveillance portée par נצבים, sans confondre ces responsables avec ceux que désigne ensuite הָרֹדִים.
- source_word: לִשְׁלֹמֹה
  choice: de Salomon
  rationale: Le complément français exprime naturellement la relation administrative indiquée par le lamed.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: qui étaient responsables des travaux
  rationale: Rend l’autorité exercée sur l’ensemble du chantier dans un français courant; le pluriel « travaux » convient à ce grand projet de construction.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: trois mille trois cents hommes
  rationale: Donne clairement l’effectif; « hommes » sert de nom compté implicite en français sans modifier le nombre massorétique.
- source_word: הָרֹדִים
  choice: qui exerçaient leur autorité sur
  rationale: Préserve la force de רדה, plus marquée que la simple surveillance, tout en l’inscrivant clairement dans le cadre administratif du travail.
- source_word: בָּעָם
  choice: les gens
  rationale: Reste proche du sens ordinaire de עָם sans réduire explicitement le terme à « ouvriers »; la proposition suivante précise qu’il s’agit des personnes affectées aux travaux.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: qui effectuaient les travaux
  rationale: Reproduit simplement la proposition participiale qui identifie les personnes placées sous leur autorité.
