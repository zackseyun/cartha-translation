  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: fr
  text: 'Et voici, j’ai l’intention de bâtir une maison[a] pour le nom de Yahweh, mon Dieu[b], comme Yahweh l’a déclaré à David, mon père : « Ton fils, celui que je mettrai à ta place[c] sur ton trône, c’est lui qui bâtira la maison pour mon nom. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un temple » ; l’hébreu dit littéralement « une maison ».
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « pour le nom de Yahweh, mon Dieu » reprend une formule liée au sanctuaire : la maison est consacrée au nom et à la présence de Yahweh.'
    reason: cultural_note
  - marker: c
    text: Ou « que j’établirai après toi » ; littéralement « que je mettrai à ta place ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי
  choice: Et voici, j’ai l’intention
  rationale: « Voici » conserve la fonction de mise en relief de הִנֵּה, tandis que le participe אֹמֵר suivi de l’infinitif exprime ici la résolution présente de Salomon plutôt qu’un simple acte de parole.
- source_word: לִבְנוֹת בַּיִת
  choice: bâtir une maison
  rationale: בַּיִת signifie littéralement « maison ». Le contexte désigne le Temple, mais « maison » préserve la formulation hébraïque et sa portée théologique.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: pour le nom de Yahweh, mon Dieu
  rationale: La traduction conserve la formule cultuelle hébraïque « pour le nom de », qui évoque la consécration de la maison au nom et à la présence de Dieu sans la réduire à la seule idée d’honneur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de rendre directement le tétragramme hébreu plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: comme Yahweh l’a déclaré
  rationale: « Comme » exprime le lien de conformité entre le projet de Salomon et la promesse divine antérieure; « déclaré » convient naturellement à une parole solennelle.
- source_word: אֶל דָּוִד אָבִי
  choice: à David, mon père
  rationale: Cette formulation suit l’ordre hébreu tout en restant naturelle en français.
- source_word: בִּנְךָ אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ
  choice: Ton fils, celui que je mettrai à ta place
  rationale: La formulation exprime la désignation du successeur tout en conservant l’idée hébraïque de remplacement, plutôt que de paraphraser simplement par « après toi ».
- source_word: עַל כִּסְאֶךָ
  choice: sur ton trône
  rationale: Il s’agit de l’expression royale usuelle indiquant que le fils succédera à David et régnera.
- source_word: הוּא יִבְנֶה
  choice: c’est lui qui bâtira
  rationale: La tournure clivée française rend l’emphase portée en hébreu par le pronom הוּא sur le fils désigné comme bâtisseur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin. « Yahweh » préserve son caractère de nom personnel et distingue celui-ci d’un titre.
- issue: Sens de « pour le nom » dans la formule du sanctuaire
  choice: Conserver « pour le nom de Yahweh »
  alternative: « en l’honneur de Yahweh »
  rationale: La formule hébraïque associe la maison au nom divin et porte une densité théologique que la paraphrase par le seul honneur ne restituerait pas entièrement.
translation_notes:
  register: Français international moderne, digne et accessible. « Bâtir » maintient une tonalité solennelle sans archaïsme excessif. La syntaxe de la citation reste proche de l’hébreu, et « c’est lui qui » rend explicitement son emphase.
