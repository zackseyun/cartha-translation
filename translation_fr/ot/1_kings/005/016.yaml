lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors ... envoya
  rationale: Le wayyiqtol de שׁלח fait avancer le récit. « Alors » exprime naturellement en français la succession narrative portée par la conjonction hébraïque.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante de ce nom propre biblique.
- source_word: אֶל
  choice: à
  rationale: La préposition désigne ici le destinataire de l'envoi; avec « envoyer dire », « à » est l'équivalent français naturel.
- source_word: חִירָם
  choice: Hiram
  rationale: Transcription française usuelle de la forme hébraïque חִירָם présente dans ce verset.
- source_word: לֵאמֹר
  choice: dire
  rationale: L'infinitif construit introduit le message qui suit. La tournure française idiomatique « envoyer dire à » rend fidèlement sa fonction sans le calque lourd « en disant ».
