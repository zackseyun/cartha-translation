  text: וְ/הַ/שְּׂעֹרִ֣ים וְ/הַ/תֶּ֔בֶן לַ/סּוּסִ֖ים וְ/לָ/רָ֑כֶשׁ יָבִ֗אוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִֽהְיֶה שָּׁ֔ם אִ֖ישׁ כְּ/מִשְׁפָּטֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/008.yaml
  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: fr
  text: Ils apportaient l’orge et la paille pour les chevaux et les montures[a], à l’endroit où se trouvait chacun[b], selon ce qui lui était prescrit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner plus précisément des animaux de selle choisis, peut-être des coursiers, des mulets ou des chevaux de char.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un homme »; le singulier est employé ici au sens distributif, pour chacun des responsables.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: l’orge
  rationale: Le nom désigne ici l’orge fournie comme nourriture pour les animaux; le singulier collectif est idiomatique en français.
- source_word: וְהַתֶּבֶן
  choice: la paille
  rationale: תֶּבֶן désigne couramment la paille ou le chaume, ici employé comme fourrage parallèlement à l’orge.
- source_word: לַסּוּסִים
  choice: destinées aux chevaux
  rationale: La préposition marque la destination des provisions; «destinées à» rend naturellement cette relation en français.
- source_word: וְלָרָכֶשׁ
  choice: et aux montures[a]
  rationale: רֶכֶשׁ désigne des animaux de selle ou des bêtes sélectionnées dans un contexte royal, sans permettre d’en préciser avec certitude l’espèce ou l’usage.
- source_word: יָבִיאוּ
  choice: Ils apportaient
  rationale: La forme active plurielle est conservée. Dans ce contexte administratif, l’imparfait français exprime naturellement une livraison habituelle.
- source_word: אֶל־הַמָּקוֹם
  choice: à l’endroit
  rationale: Rendu locatif direct et naturel de «vers le lieu».
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: où se trouvait chaque homme[b]
  rationale: אִישׁ, singulier à valeur distributive, renvoie à chacun des hommes responsables des livraisons ou des districts.
- source_word: כְּמִשְׁפָּטוֹ
  choice: conformément à la tâche qui lui était assignée
  rationale: Dans ce contexte, מִשְׁפָּט évoque la règle prescrite, l’attribution ou la responsabilité administrative plutôt qu’un jugement judiciaire.
