base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: fr
  text: Ces administrateurs[a] ont pourvu aux besoins du roi Salomon et de tous ceux qui venaient à la table du roi Salomon[b], chacun pendant son mois[c] ; rien ne manquait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsables » ou « gouverneurs ». L’hébreu désigne des administrateurs nommés à la tête de districts.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne ceux qui avaient accès à la table royale.
    reason: cultural_clarification
  - marker: c
    text: C’est-à-dire pendant le mois où il était chargé de l’approvisionnement, selon une rotation mensuelle.
    reason: idiom_clarification
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: pourvoyaient aux besoins de
  rationale: Le piel de כלכל désigne ici l’approvisionnement ou l’entretien matériel de la cour. Cette formulation française exprime naturellement cette responsabilité sans préciser à tort la nature des fournitures.
- source_word: הַנִּצָּבִים
  choice: administrateurs
  rationale: Dans ce contexte, le terme désigne des responsables nommés à la tête de districts et chargés de l’approvisionnement royal. « Administrateurs » rend leur fonction déléguée sans les assimiler à une charge politique française moderne.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: et de tous ceux qui s’approchaient de sa table
  rationale: La traduction conserve l’image hébraïque de l’approche de la table royale, laquelle désigne en contexte les personnes admises à y prendre part.
- source_word: אִישׁ חָדְשׁוֹ
  choice: chacun durant son mois
  rationale: Cette formulation garde la tournure distributive du texte et renvoie à la rotation mensuelle des administrateurs.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: ils ne laissaient rien manquer
  rationale: Le verbe exprime ici l’absence de manque. Cette tournure rattache clairement le résultat à la diligence des administrateurs et convient au contexte d’approvisionnement.
