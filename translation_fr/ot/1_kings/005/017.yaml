  variant: modern international French
source:
  edition: WLC
  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: fr
  text: Tu sais que David, mon père, n’a pas pu bâtir une maison pour le nom de Yahvé, son Dieu, à cause des combats qui l’encerclaient, jusqu’à ce que Yahvé les mette[a] sous la plante de ses pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « les » renvoie vraisemblablement aux ennemis de David, mais ceux-ci ne sont pas nommés explicitement dans le texte hébreu.
    reason: ambiguïté du référent
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: Tu sais
  rationale: Le parfait qal, dans cette adresse directe, exprime naturellement un savoir présent. Le pronom explicite est conservé sans surcharger l’emphase.
- source_word: בַּיִת
  choice: une maison
  rationale: Le nom est sans article et désigne le sanctuaire à venir. « Une maison » conserve l’expression hébraïque sans la remplacer d’emblée par le terme interprétatif « temple ».
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: pour le nom de Yahvé, son Dieu
  rationale: Cette formulation maintient l’idiome théologique « pour le nom de » au lieu de le réduire à « en l’honneur de ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » rend directement le nom divin יהוה plutôt que de lui substituer un titre.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: à cause des combats qui l’encerclaient
  rationale: Le singulier collectif « guerre » est associé à un verbe pluriel dans le texte massorétique. « Les combats » exprime naturellement la situation de conflit continu et l’image d’un encerclement hostile.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: jusqu’à ce que Yahvé les mette
  rationale: Avec le complément « sous la plante de ses pieds », נתן signifie ici mettre ou placer en position de soumission. Le pronom pluriel est conservé afin de ne pas expliciter silencieusement son référent.
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: sous la plante de ses pieds
  rationale: כפות désigne ici la partie inférieure des pieds. Cette formulation garde l’image hébraïque complète de la domination.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahvé » le représente directement en français et le distingue du titre אֲדֹנָי.
- issue: Référent du pronom אֹתָם (« les »)
  choice: maintenir le pronom sans nommer explicitement son référent
  alternative: « ses ennemis »
  rationale: Le contexte implique vraisemblablement les adversaires de David, mais aucun substantif pluriel correspondant n’est exprimé immédiatement dans l’hébreu. Le texte principal préserve cette légère indétermination, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’hébreu tout en restant naturelle; « bâtir une maison pour le nom de » conserve volontairement l’idiome biblique.
