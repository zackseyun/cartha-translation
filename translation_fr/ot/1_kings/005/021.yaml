  text: וַ/יְהִ֞י כִּ/שְׁמֹ֧עַ חִירָ֛ם אֶת דִּבְרֵ֥י שְׁלֹמֹ֖ה וַ/יִּשְׂמַ֣ח מְאֹ֑ד וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ הַ/יּ֔וֹם אֲשֶׁ֨ר נָתַ֤ן לְ/דָוִד֙ בֵּ֣ן חָכָ֔ם עַל הָ/עָ֥ם הָ/רָ֖ב הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: fr
  text: 'Lorsque Hiram entendit les paroles de Salomon, il se réjouit beaucoup et dit : « Béni soit le SEIGNEUR aujourd’hui, lui qui a donné à David un fils sage à la tête de ce peuple nombreux ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: les paroles de Salomon
  rationale: Rend directement l’expression hébraïque et convient au contexte du message transmis par Salomon.
- source_word: וַיִּשְׂמַח מְאֹד
  choice: il éprouva une très grande joie
  rationale: Exprime naturellement en français l’intensification de שׂמח par מְאֹד.
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: Béni soit le SEIGNEUR aujourd’hui
  rationale: Conserve l’acclamation, le nom divin représenté selon la convention française en petites capitales, et la portée temporelle explicite de הַיּוֹם.
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: pour gouverner ce grand peuple
  rationale: Le sens de l’autorité exercée « sur » le peuple est rendu explicitement et naturellement par « pour gouverner », sans ajouter de titre royal absent de l’hébreu.
theological_decisions:
- issue: Confession de Hiram au sujet de YHWH
  choice: Conserver l’acclamation telle quelle, sans préciser la nature ou l’étendue de la foi de Hiram
  alternative: Formuler la phrase comme une confession explicite d’adhésion religieuse
  rationale: Le texte rapporte que Hiram bénit YHWH, mais ne tranche pas ici la question de son engagement religieux personnel.
- issue: Fonction du fils sage donné à David
  choice: « pour gouverner ce grand peuple »
  alternative: « à la tête de ce grand peuple »
  rationale: La préposition עַל indique sa position d’autorité; « gouverner » explicite sobrement cette relation dans un français naturel.
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative reste fluide; l’exclamation finale restitue la force de la bénédiction prononcée par Hiram.
