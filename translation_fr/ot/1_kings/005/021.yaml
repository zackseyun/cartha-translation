revisions:
- from: 'Lorsque Hiram entendit les paroles de Salomon, il éprouva une très grande joie et dit : « Béni soit le SEIGNEUR aujourd’hui, lui qui a donné à David un fils sage pour gouverner ce grand peuple ! »'
  to: 'Lorsque Hiram entendit les paroles de Salomon, il se réjouit beaucoup et dit : « Béni soit le SEIGNEUR aujourd’hui, lui qui a donné à David un fils sage à la tête de ce peuple nombreux ! »'
  rationale: La révision conserve l'acclamation et son ancrage temporel (« aujourd’hui »), tout en rendant plus exactement le peuple « nombreux » et la position du fils sage « à la tête de » ce peuple. Elle améliore également la fluidité du récit sans modifier le sens.
