  text: עֲשָׂרָ֨ה בָקָ֜ר בְּרִאִ֗ים וְ/עֶשְׂרִ֥ים בָּקָ֛ר רְעִ֖י וּ/מֵ֣אָה צֹ֑אן לְ֠/בַד מֵֽ/אַיָּ֤ל וּ/צְבִי֙ וְ/יַחְמ֔וּר וּ/בַרְבֻּרִ֖ים אֲבוּסִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/003.yaml
  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: fr
  text: dix bœufs engraissés, vingt bœufs élevés au pâturage et cent bêtes de petit bétail[a], sans compter les cerfs, les gazelles, les daims[b] et les volailles engraissées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner collectivement les moutons et les chèvres.
    reason: lexical_alternative
  - marker: b
    text: L’identification exacte de l’animal désigné par le terme hébreu est incertaine; on propose aussi « chevreuils ».
    reason: lexical_alternative
  - marker: c
    text: L’espèce précise des oiseaux est incertaine; il pourrait notamment s’agir d’oies engraissées.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: bœufs engraissés
  rationale: בָקָר est un collectif désignant les bovins, et בְּרִאִים indique ici des animaux gras ou bien nourris. « Bœufs engraissés » est naturel dans une liste de provisions et exprime leur préparation particulière pour la consommation.
- source_word: בָּקָר רְעִי
  choice: bœufs élevés au pâturage
  rationale: רְעִי renvoie au pacage. Cette formulation française établit clairement le contraste avec les bovins engraissés mentionnés juste avant.
- source_word: צֹאן
  choice: bêtes de petit bétail
  rationale: צֹאן peut désigner collectivement les moutons et les chèvres. « Petit bétail » conserve cette extension sans réduire arbitrairement le terme aux seuls moutons; « bêtes de » convient après le nombre cent.
- source_word: לְבַד
  choice: sans compter
  rationale: L’expression introduit des éléments supplémentaires par rapport aux quantités déjà énumérées. « Sans compter » est idiomatique et précis dans ce contexte.
- source_word: אַיָּל
  choice: cerfs
  rationale: Le mot désigne un cervidé, souvent le cerf mâle. Le pluriel français s’accorde naturellement avec la valeur collective de la liste.
- source_word: צְבִי
  choice: gazelles
  rationale: צְבִי désigne couramment la gazelle; le pluriel français rend la portée collective du nom dans cette énumération.
- source_word: יַחְמוּר
  choice: daims
  rationale: L’identification zoologique exacte demeure incertaine. « Daims » est une possibilité reconnue et compréhensible, tandis que l’incertitude est signalée en note.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: volailles engraissées
  rationale: בַרְבֻּרִים désigne apparemment des oiseaux destinés à la table, sans certitude sur l’espèce, et אֲבוּסִים indique qu’ils sont engraissés. « Volailles engraissées » est naturel sans imposer une espèce précise.
