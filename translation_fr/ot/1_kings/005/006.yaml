  text: וַ/יְהִ֣י לִ/שְׁלֹמֹ֗ה אַרְבָּעִ֥ים אֶ֛לֶף אֻרְוֺ֥ת סוּסִ֖ים לְ/מֶרְכָּב֑/וֹ וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/006.yaml
  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: fr
  text: Salomon avait quarante mille stalles pour les chevaux de ses chars[a], et douze mille cavaliers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « écuries pour les chevaux destinés à ses chars » ; le mot hébreu désigne plus précisément des stalles ou des emplacements où les chevaux sont nourris.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomon avait
  rationale: La construction ויהי ל exprime ici la possession; « Salomon avait » est la formulation française la plus naturelle.
- source_word: אַרְבָּעִים אֶלֶף
  choice: quarante mille
  rationale: Rendu direct du nombre cardinal hébreu.
- source_word: אֻרְוֺת
  choice: stalles
  rationale: Le terme désigne plus précisément des emplacements ou mangeoires individuels pour les chevaux que l’ensemble d’un bâtiment d’écurie.
- source_word: סוּסִים
  choice: chevaux
  rationale: Équivalent français courant du nom hébreu au pluriel.
- source_word: לְמֶרְכָּבוֹ
  choice: de ses chars
  rationale: Le singulier suffixé a ici un sens collectif et renvoie à l’ensemble des chars de Salomon; dans la tournure française, « les chevaux de ses chars » exprime naturellement leur affectation.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: et douze mille
  rationale: Rendu direct de l’expression numérique.
- source_word: פָּרָשִׁים
  choice: cavaliers
  rationale: Le mot désigne normalement des hommes montés à cheval; « cavaliers » est précis et naturel en français moderne.
