base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: fr
  text: Salomon donna à Hiram vingt mille kors de blé comme provisions pour sa maisonnée[a], ainsi que vingt kors d’huile obtenue par broyage[b]. C’est ainsi que Salomon donnait à Hiram, année après année.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la nourriture pour sa maison ». L’expression hébraïque désigne probablement les vivres fournis à la maison royale d’Hiram.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne une huile de qualité obtenue d’olives pilées ou broyées.
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: donna / donnait
  rationale: Le qatal présente le don établi, tandis que l’imparfait, associé à « chaque année », exprime sa répétition habituelle dans le passé.
- source_word: כֹּר
  choice: kors
  rationale: Le kor est une mesure ancienne précise employée pour les matières sèches comme pour les liquides. La translittération conserve l’unité du texte sans lui attribuer une équivalence moderne incertaine.
- source_word: חִטִּים
  choice: blé
  rationale: Le terme hébreu désigne précisément le blé, et non les céréales en général.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: pour nourrir sa maison
  rationale: מַכֹּלֶת désigne la nourriture ou les provisions, et « sa maison » peut englober la maisonnée ou la cour royale d’Hiram. La formulation française reste naturelle tout en conservant cette portée.
- source_word: שֶׁמֶן כָּתִית
  choice: huile obtenue par broyage
  rationale: כָּתִית qualifie une huile tirée d’olives pilées ou broyées. Cette formulation rend le procédé plus clairement que le calque peu naturel « huile battue », sans ajouter « olive » dans le corps du texte.
- source_word: כֹּה
  choice: Voilà ce que
  rationale: Dans ce contexte, כֹּה reprend les quantités énumérées comme la teneur de la fourniture annuelle.
- source_word: שָׁנָה בְשָׁנָה
  choice: chaque année
  rationale: Cette expression française naturelle rend la répétition annuelle indiquée par l’idiome hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Kors » conserve l’unité ancienne; les notes expliquent la portée de « maison » et le procédé de fabrication de l’huile.
