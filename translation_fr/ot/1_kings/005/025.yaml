revisions:
- from: Salomon donna à Hiram vingt mille kors de blé pour nourrir sa maison[a], ainsi que vingt kors d’huile obtenue par broyage[b]. Voilà ce que Salomon donnait à Hiram chaque année.
  to: Salomon donna à Hiram vingt mille kors de blé comme provisions pour sa maisonnée[a], ainsi que vingt kors d’huile obtenue par broyage[b]. C’est ainsi que Salomon donnait à Hiram, année après année.
  rationale: 'La révision conserve le sens et l’ambiguïté contrôlée du texte hébreu : les vivres sont destinés à la « maison » d’Hiram, comprise vraisemblablement comme sa maisonnée ou sa cour. Elle rend plus directement la reprise de כֹּה et supprime de la note sur l’huile une précision historique non nécessairement établie par le seul terme hébreu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T16:51:15Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général, les quantités, l’unité ancienne et la répétition annuelle sont bien rendus. Toutefois, « pour nourrir sa maison » transforme légèrement « provisions/nourriture pour sa maison » en une formulation plus finalisée et laisse « maison » ambigu en français. « C’est ainsi que » rend plus directement כֹּה que « Voilà ce que ».
  naturalness: Le français est clair et moderne. « Comme provisions pour sa maisonnée » est à la fois plus proche de l’hébreu et naturel dans ce contexte de cour royale. « Année après année » restitue bien l’idiome tout en gardant un rythme soutenu.
  terminology: « Kors », « blé » et « huile obtenue par broyage » sont recevables. La note sur l’huile doit éviter d’affirmer un contraste technique (« plutôt que par un procédé ultérieur de pressage ») qui dépasse ce que le terme hébreu établit avec certitude.
  issues:
  - severity: low
    issue: « pour nourrir sa maison » est moins précis que l’expression source.
    rationale: מַכֹּלֶת désigne des vivres ou provisions. La « maison » vise la maisonnée, probablement la maison/cour royale d’Hiram, plutôt que le bâtiment ou seulement l’acte de nourrir.
  - severity: low
    issue: « Voilà ce que » est un peu plus discursif que nécessaire.
    rationale: כֹּה introduit la manière ou le modèle de l’approvisionnement répété ; « C’est ainsi que » le rend plus directement.
  - severity: medium
    issue: La note b présente une reconstruction technique trop assurée.
    rationale: כָּתִית évoque une huile issue d’olives pilées ou broyées, mais le contraste avec un « procédé ultérieur de pressage » ne doit pas être présenté comme une certitude textuelle.
  revised_text: Salomon donna à Hiram vingt mille kors de blé comme provisions pour sa maisonnée[a], ainsi que vingt kors d’huile obtenue par broyage[b]. C’est ainsi que Salomon donnait à Hiram, année après année.
  revised_footnotes:
  - marker: a
    text: Ou « de la nourriture pour sa maison ». L’expression hébraïque désigne probablement les vivres fournis à la maison royale d’Hiram.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne une huile de qualité obtenue d’olives pilées ou broyées.
    reason: cultural_note
