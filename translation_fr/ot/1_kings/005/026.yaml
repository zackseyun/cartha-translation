id: 1KI.5.26
reference: 1 Kings 5:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יהוָ֗ה נָתַ֤ן חָכְמָה֙ לִ/שְׁלֹמֹ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר ל֑/וֹ וַ/יְהִ֣י שָׁלֹ֗ם בֵּ֤ין חִירָם֙ וּ/בֵ֣ין שְׁלֹמֹ֔ה וַ/יִּכְרְת֥וּ בְרִ֖ית שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: fr
  text: Yahweh donna de la sagesse à Salomon, comme il le lui avait dit[a]. La paix régna entre Hiram et Salomon, et tous deux conclurent une alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme il le lui avait promis ». Le verbe hébreu signifie littéralement « parler » ou « dire », mais il peut désigner ici la parole que Yahweh avait précédemment adressée à Salomon.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « coupèrent une alliance », expression hébraïque signifiant « conclure une alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: נָתַן חָכְמָה
  choice: donna de la sagesse
  rationale: Cette formulation naturelle reste proche du sens simple du verbe נָתַן et du substantif חָכְמָה.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: comme il le lui avait dit
  rationale: Le verbe דִּבֶּר signifie littéralement « parler » ou « dire ». Le plus-que-parfait exprime naturellement en français l'antériorité de cette parole divine sans la qualifier explicitement de promesse.
- source_word: וַיְהִי שָׁלוֹם
  choice: La paix régna
  rationale: Cette tournure française idiomatique exprime l'existence de relations pacifiques entre les deux rois sans réduire שָׁלוֹם à la simple amitié.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: conclurent une alliance
  rationale: « Conclure une alliance » rend naturellement en français l'idiome hébreu littéral « couper une alliance », tout en conservant le terme distinctif בְרִית.
- source_word: שְׁנֵיהֶם
  choice: tous deux
  rationale: Cette expression concise indique clairement la participation mutuelle de Hiram et de Salomon.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel ; le Seigneur ; Jéhovah
  rationale: « Yahweh » représente directement le nom divin hébreu et évite de remplacer celui-ci par un titre.
- issue: Valeur de la parole divine dans כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: comme il le lui avait dit
  alternative: comme il le lui avait promis
  rationale: Le contexte peut faire comprendre cette parole comme une promesse, mais le verbe hébreu signifie littéralement « parler » ou « dire ». Le texte principal conserve cette relative indétermination et la note signale l'interprétation contextuelle possible.
- issue: Traduction de בְרִית dans un contexte politique
  choice: alliance
  alternative: traité
  rationale: Bien qu'il s'agisse ici de relations internationales, le terme hébreu est le mot courant pour « alliance ». Le conserver permet de préserver la continuité lexicale sans nier la portée politique de l'accord.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « La paix régna » est plus naturel que le calque « il y eut paix », tandis que « conclurent une alliance » restitue idiomatiquement la formule hébraïque.
