  text: וַ/יְהִ֨י חִיר֜וֹם נֹתֵ֣ן לִ/שְׁלֹמֹ֗ה עֲצֵ֧י אֲרָזִ֛ים וַ/עֲצֵ֥י בְרוֹשִׁ֖ים כָּל חֶפְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/024.yaml
  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: fr
  text: Hiram fournissait à Salomon du bois de cèdre et du bois de cyprès[a], tout ce qu’il désirait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bois de genévrier »; traditionnellement, « bois de sapin ». L’espèce exacte désignée par le mot hébreu beroshim est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: fournissait
  rationale: Avec le participe נֹתֵן, la construction situe dans le récit une action passée continue ou habituelle. En français, l’imparfait exprime naturellement cette valeur sans calquer la formule hébraïque d’introduction.
- source_word: חִירוֹם
  choice: Hiram
  rationale: Translittération française traditionnelle et courante du nom propre.
- source_word: נֹתֵן
  choice: fournissait
  rationale: Le verbe « fournir » convient au contexte d’approvisionnement en matériaux et l’imparfait conserve la valeur durative ou habituelle du participe.
- source_word: לִשְׁלֹמֹה
  choice: à Salomon
  rationale: La préposition לְ marque ici le destinataire; elle est explicitement rendue en français.
- source_word: עֲצֵי אֲרָזִים
  choice: du bois de cèdre
  rationale: Dans ce contexte de construction, la locution désigne du matériau de construction plutôt que des arbres sur pied.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: et du bois de cyprès[a]
  rationale: « Cyprès » est une identification moderne fréquente de בְּרוֹשׁ, mais l’espèce exacte demeure incertaine; la note conserve les principales possibilités.
- source_word: כָּל חֶפְצוֹ
  choice: autant qu’il en désirait
  rationale: Cette formulation naturelle exprime toute la quantité souhaitée par Salomon sans le calque peu idiomatique « tout son désir ».
