base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: fr
  text: Dieu donna à Salomon de la sagesse, une très grande intelligence et une étendue d’intelligence[a], comme le sable qui est au bord de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « largeur de cœur ». En hébreu, le « cœur » peut désigner le siège de la pensée et de l’intelligence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן signifie simplement « donner »; le passé simple convient au registre narratif biblique en français.
- source_word: חָכְמָה
  choice: de la sagesse
  rationale: « Sagesse » est l’équivalent courant et conserve ici la portée pratique et royale du terme.
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  choice: une très grande intelligence
  rationale: תְבוּנָה désigne la faculté de comprendre ou de discerner; הַרְבֵּה מְאֹד en exprime le degré exceptionnel.
- source_word: וְרֹחַב לֵב
  choice: une largeur d’esprit
  rationale: L’expression signifie littéralement « largeur de cœur », mais לֵב peut désigner le siège de la pensée. « Largeur d’esprit » maintient l’image d’une vaste capacité intérieure sans suggérer seulement l’émotion.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: comparable au sable qui est au bord de la mer
  rationale: Cette formulation naturelle conserve la comparaison et rend explicitement שְׂפַת הַיָּם par « bord de la mer ».
theological_decisions:
- issue: Sens anthropologique de לֵב dans רֹחַב לֵב
  choice: largeur d’esprit
  alternative: largeur de cœur
  rationale: En hébreu biblique, le « cœur » comprend les facultés intellectuelles. Le texte principal communique cette valeur à un lectorat moderne, tandis que la note conserve la formulation littérale et l’ambiguïté anthropologique de l’image.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre narratif soutenu mais courant dans une traduction biblique; la métaphore spatiale du texte hébreu est conservée.
