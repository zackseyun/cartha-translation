source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח חִירָם֙ אֶל שְׁלֹמֹ֣ה לֵ/אמֹ֔ר שָׁמַ֕עְתִּי אֵ֥ת אֲשֶׁר שָׁלַ֖חְתָּ אֵלָ֑/י אֲנִ֤י אֶֽעֱשֶׂה֙ אֶת כָּל חֶפְצְ/ךָ֔ בַּ/עֲצֵ֥י אֲרָזִ֖ים וּ/בַ/עֲצֵ֥י בְרוֹשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: fr
  text: 'Alors Hiram envoya ce message à Salomon : « J’ai entendu ce que tu m’as envoyé[a]. Je ferai tout ce que tu désires en ce qui concerne le bois de cèdre et le bois de cyprès[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que tu m’as demandé ». Littéralement, l’hébreu dit « ce que tu m’as envoyé » ; il peut s’agir du message de Salomon considéré comme une demande.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne une essence d’arbre dont l’identification est incertaine ; il est aussi traduit par « genévrier » ou « sapin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח חִירָם אֶל שְׁלֹמֹה לֵאמֹר
  choice: Alors Hiram envoya ce message à Salomon
  rationale: Le waw consécutif fait progresser le récit. « Alors » rend naturellement cette succession, et « envoya ce message » exprime en français courant la formule hébraïque introduisant les paroles transmises.
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: Le parfait indique ici que Hiram a reçu et pris en compte la communication de Salomon. La traduction conserve l’image auditive du verbe hébreu.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: ce que tu m’as envoyé
  rationale: Cette formulation reste proche de l’hébreu et ne réduit pas explicitement l’envoi à une demande, même si le contexte permet ce sens.
- source_word: אֶעֱשֶׂה
  choice: Je ferai
  rationale: Le verbe עשה est général. « Je ferai » préserve l’engagement global de Hiram sans le préciser davantage.
- source_word: כָּל חֶפְצְךָ
  choice: tout ce que tu désires
  rationale: Cette tournure est naturelle en français moderne et rend l’idée de volonté ou de souhait exprimée par חֵפֶץ.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: en ce qui concerne le bois de cèdre
  rationale: La préposition ב précise ici le domaine dans lequel Hiram satisfera le désir de Salomon. « Bois de cèdre » convient au contexte de matériaux de construction.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: et le bois de cyprès
  rationale: « Cyprès » est une traduction moderne courante de בְּרוֹשׁ, mais l’identification exacte de l’essence reste incertaine et mérite une note.
theological_decisions: []
