id: 1KI.5.18
reference: 1 Kings 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: fr
  text: 'Mais maintenant, Yahweh mon Dieu m’a donné du repos de tous côtés : il n’y a ni adversaire[a] ni malheur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « opposant ». Le mot hébreu est ici un nom commun et ne désigne pas nécessairement Satan comme nom propre.
    reason: lexical_alternative
  - marker: b
    text: Ou « événement funeste », « calamité » ou « désastre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: La formule marque une transition contrastive entre les difficultés antérieures et la situation présente.
- source_word: הֵנִיחַ ... לִי
  choice: m’a donné du repos
  rationale: Le hiphil de נוח exprime ici l’action de procurer le repos; cette tournure française naturelle en conserve la valeur causative et le bénéficiaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel, conformément à sa présence explicite dans le texte hébreu.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Rend directement la construction possessive.
- source_word: מִסָּבִיב
  choice: de tous côtés
  rationale: Expression française idiomatique indiquant l’absence de menaces dans tout l’environnement du roi.
- source_word: אֵין שָׂטָן
  choice: il n’y a ni adversaire
  rationale: שָׂטָן fonctionne ici comme un nom commun désignant un opposant, dans un contexte politique et militaire.
- source_word: וְאֵין פֶּגַע רָע
  choice: ni malheur
  rationale: « Malheur » exprime naturellement un événement nuisible ou funeste sans limiter le sens à une catastrophe précise ni faire de רָע un jugement exclusivement moral.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; sa transcription préserve la référence au nom personnel de Dieu.
- issue: Statut de שָׂטָן
  choice: nom commun « adversaire »
  alternative: nom propre « Satan »
  rationale: Le contexte décrit l’absence d’opposition au règne de Salomon. Rien n’exige d’identifier ici une figure démoniaque personnelle.
- issue: Portée de פֶּגַע רָע
  choice: malheur
  alternative: événement funeste; calamité; désastre
  rationale: Le syntagme peut désigner largement un coup, un incident nuisible ou une calamité; « malheur » conserve cette ampleur sans préciser indûment sa nature.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation relie naturellement le repos accordé par Dieu à l’absence d’adversaire et de malheur. Les marqueurs suivent immédiatement les termes concernés.
