base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: fr
  text: 'Il les envoya au Liban, dix mille par mois, par roulement[a] : ils passaient un mois au Liban et deux mois chez eux[b]. Adoniram était responsable de la corvée[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en équipes alternées ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans sa maison » ; il s’agit de la maison de chacun des travailleurs.
    reason: lexical_alternative
  - marker: c
    text: Ou « du travail obligatoire » ; le terme hébreu désigne une prestation de travail imposée par l’État.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Il les envoyait
  rationale: L’imparfait français exprime naturellement l’envoi répété qu’implique ici l’organisation mensuelle par roulement.
- source_word: לְבָנוֹנָה
  choice: au Liban
  rationale: Le suffixe directionnel indique un mouvement vers le Liban; « au Liban » est l’expression française idiomatique.
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: dix mille par mois
  rationale: Dans ce contexte de rotation, בַּחֹדֶשׁ a une valeur distributive mensuelle.
- source_word: חֲלִיפוֹת
  choice: par roulement
  rationale: Le nom désigne une alternance ou une succession de groupes; « par roulement » est clair et naturel en français moderne.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: ils passaient un mois au Liban
  rationale: Le singulier חֹדֶשׁ indique une durée d’un mois; « passaient » rend naturellement la rotation habituelle.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: et deux mois chez eux
  rationale: Littéralement « dans sa maison »; le suffixe singulier a ici un sens distributif, chaque homme retournant chez lui.
- source_word: וַאֲדֹנִירָם עַל הַמַּס
  choice: Adoniram était responsable de la corvée
  rationale: עַל marque la responsabilité ou la supervision, tandis que מַס désigne ici un service de travail obligatoire imposé par l’État.
