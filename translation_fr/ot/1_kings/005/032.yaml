id: 1KI.5.32
reference: 1 Kings 5:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: fr
  text: Ainsi, les bâtisseurs de Salomon, ceux de Hiram et les hommes de Guébal[a] taillèrent et préparèrent le bois et les pierres pour construire la Maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Guébalites » ou « les Giblites », c’est-à-dire des travailleurs originaires de Guébal (Byblos).
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire la maison du SEIGNEUR, le Temple.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: taillèrent
  rationale: Le verbe פסל désigne ici le façonnage de matériaux de construction. « Tailler » convient aussi bien au bois qu’à la pierre et reste naturel en français moderne.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: les bâtisseurs de Salomon
  rationale: La vocalisation בֹּנֵי correspond ici au participe construit de בנה, « bâtir », et désigne les ouvriers chargés des travaux de Salomon, non ses fils.
- source_word: וּבֹנֵי חִירוֹם
  choice: ceux de Hiram
  rationale: Le pronom reprend naturellement « les bâtisseurs » en français tout en conservant le parallélisme entre les équipes de Salomon et de Hiram.
- source_word: וְהַגִּבְלִים
  choice: les hommes de Guébal
  rationale: Le gentilé désigne des gens originaires de Guébal, l’ancienne Byblos. Cette formulation est immédiatement compréhensible, tandis que les gentilés plus techniques sont conservés en note.
- source_word: וַיָּכִינוּ
  choice: préparèrent
  rationale: Au hiphil, כון signifie couramment « préparer » ou « rendre prêt » ; « préparèrent » convient précisément au contexte du chantier.
- source_word: הָעֵצִים
  choice: le bois
  rationale: Dans ce contexte, le pluriel hébreu désigne le bois employé comme matériau de construction. Le collectif français « le bois » est idiomatique.
- source_word: וְהָאֲבָנִים
  choice: les pierres
  rationale: Cette traduction conserve la formulation générale de l’hébreu sans préciser indûment qu’il s’agissait de blocs ou de pierres de taille.
- source_word: לִבְנוֹת הַבָּיִת
  choice: pour construire la Maison
  rationale: La tournure exprime naturellement le but de la préparation. « Maison » préserve le terme hébreu בַּיִת et son emploi contextuel pour le sanctuaire.
theological_decisions:
- issue: Identification de הַבָּיִת comme le Temple
  choice: Conserver « la Maison » dans le texte et expliquer le référent en note
  alternative: Traduire directement par « le Temple »
  rationale: L’hébreu dit littéralement « la maison ». Le contexte l’identifie au Temple du SEIGNEUR, mais conserver l’image dans le texte évite d’effacer l’expression source tout en assurant la clarté grâce à la note.
translation_notes:
  register: Français moderne, clair et digne. « Bâtisseurs » rend précisément la fonction des ouvriers ; « ceux de Hiram » évite une répétition pesante. La majuscule à « Maison » signale son emploi particulier pour le sanctuaire sans remplacer l’image hébraïque par une explicitation dans le corps du texte.
