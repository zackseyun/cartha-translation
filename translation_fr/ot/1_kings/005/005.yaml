base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: fr
  text: Juda et Israël vécurent en sécurité, chacun[a] sous sa vigne et sous son figuier[b], depuis Dan jusqu’à Bersabée, tous les jours de Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « chaque homme », au masculin singulier, employé ici dans un sens distributif.
    reason: lexical_alternative
  - marker: b
    text: L’expression « sous sa vigne et sous son figuier » est une image traditionnelle de paix, de sécurité et de prospérité dans le pays.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: vécurent
  rationale: Le verbe signifie littéralement « s’asseoir, demeurer, habiter » ; avec לָבֶטַח et un sujet collectif, il décrit une vie stable et sûre. « Vécurent » est naturel en français et conserve la valeur durative.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Juda et Israël
  rationale: Les deux entités politiques et territoriales nommées par l’hébreu sont conservées sans généralisation.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: Cette expression rend directement l’idée d’une existence à l’abri et sans crainte.
- source_word: אִישׁ
  choice: chacun
  rationale: Le nom masculin singulier est employé distributivement. « Chacun » reproduit cette distribution de manière naturelle, sans limiter artificiellement la scène aux seuls hommes adultes.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: sous sa vigne et sous son figuier
  rationale: 'L’image concrète traditionnelle est conservée afin de préserver sa portée littéraire : paix, sécurité et jouissance paisible de ses biens.'
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: depuis Dan jusqu’à Bersabée
  rationale: Cette formule géographique désigne l’ensemble du pays, de son extrémité nord à son extrémité sud. Les noms propres suivent leurs formes françaises usuelles.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: tout au long du règne de Salomon
  rationale: Littéralement « tous les jours de Salomon ». Dans ce contexte royal, la formulation française explicite naturellement la période de son règne sans modifier la durée affirmée.
theological_decisions:
- issue: Valeur distributive du masculin אִישׁ
  choice: chacun
  alternative: chaque homme
  rationale: Le masculin singulier hébreu a ici une fonction distributive et représentative. « Chacun » en restitue le sens collectif sans imposer une restriction de sexe que le tableau national n’exige pas.
- issue: Image de la vigne et du figuier
  choice: conserver littéralement l’image
  alternative: paraphraser par « dans la paix et la prospérité »
  rationale: La métaphore traditionnelle porte une force littéraire et intertextuelle importante. La conserver évite de réduire ses résonances à une seule interprétation.
- issue: Sens temporel de כֹּל יְמֵי שְׁלֹמֹה
  choice: tout au long du règne de Salomon
  alternative: tous les jours de Salomon
  rationale: La traduction retenue exprime en français idiomatique la durée du gouvernement de Salomon évoquée dans le contexte, plutôt qu’une formulation littérale pouvant suggérer indistinctement toute sa vie biologique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant idiomatique ; l’image concrète est préservée et les formes françaises usuelles des toponymes sont employées.
