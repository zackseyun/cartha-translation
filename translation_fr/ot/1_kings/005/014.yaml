source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ מִ/כָּל הָ֣/עַמִּ֔ים לִ/שְׁמֹ֕עַ אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה מֵ/אֵת֙ כָּל מַלְכֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר שָׁמְע֖וּ אֶת חָכְמָתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: fr
  text: Des gens vinrent de tous les peuples[a] pour entendre la sagesse de Salomon ; ils venaient de la part de tous les rois de la terre qui avaient entendu parler de sa sagesse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de toutes les nations ». Le mot hébreu est au pluriel et peut désigner des peuples ou des nations.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de tous les rois de la terre ». La formulation hébraïque, très condensée, peut indiquer que ces visiteurs venaient de chez ces rois ou qu’ils étaient envoyés par eux.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le wayyiqtol de בוא poursuit le récit au passé ; « vinrent » est direct et naturel.
- source_word: מִכָּל הָעַמִּים
  choice: de tous les peuples
  rationale: Le pluriel עַמִּים désigne des peuples distincts ; « peuples » conserve cette forme, tandis que « nations » reste possible.
- source_word: לִשְׁמֹעַ
  choice: pour entendre
  rationale: L’infinitif exprime ici le but de leur venue ; « pour entendre » rend clairement cette fonction.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: la sagesse de Salomon
  rationale: Cette formulation rend naturellement et avec transparence la chaîne construite hébraïque.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: ils venaient de la part de tous les rois de la terre
  rationale: מֵאֵת indique ici vraisemblablement la provenance ou l’autorité à l’origine de la venue. La reprise explicite « ils venaient » clarifie en français la formulation hébraïque comprimée sans préciser indûment si les visiteurs étaient officiellement envoyés.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: qui avaient entendu parler de sa sagesse
  rationale: « Entendre parler de » est l’expression française idiomatique quand il s’agit d’une réputation connue par des rapports.
