  text: וַ/יְהִ֧י לִ/שְׁלֹמֹ֛ה שִׁבְעִ֥ים אֶ֖לֶף נֹשֵׂ֣א סַבָּ֑ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֥ב בָּ/הָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/029.yaml
  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: fr
  text: Salomon avait soixante-dix mille porteurs de charges et quatre-vingt mille tailleurs de pierre dans la montagne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la montagne »; le singulier hébreu peut aussi désigner collectivement une région montagneuse où la pierre était extraite.'
    reason: Le singulier hébreu peut s’entendre littéralement ou comme une désignation topographique collective.
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomon avait
  rationale: La construction היה + ל exprime ici la possession ou la mise à disposition. « Salomon avait » en donne le sens avec naturel en français.
- source_word: שִׁבְעִים אֶלֶף נֹשֵׂא סַבָּל
  choice: soixante-dix mille porteurs de charges
  rationale: Le participe נֹשֵׂא associé à סַבָּל désigne des ouvriers chargés de transporter de lourdes charges. « Porteurs de charges » reste clair et proche de l’expression hébraïque.
- source_word: וּשְׁמֹנִים אֶלֶף חֹצֵב
  choice: et quatre-vingt mille tailleurs de pierre
  rationale: חֹצֵב désigne celui qui taille ou extrait un matériau dur. Dans le contexte des travaux de construction, la pierre est l’objet implicite; « tailleurs de pierre » l’explicite naturellement sans réduire nécessairement ces ouvriers au seul travail de finition.
- source_word: בָּהָר
  choice: dans la région montagneuse
  rationale: Le singulier défini הַר peut avoir une valeur topographique ou collective. « Dans la région montagneuse » rend ce sens de terrain sans imposer l’idée d’une montagne unique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La coordination est allégée conformément à l’usage français, sans virgule avant « et ». Le marqueur de note est placé après l’expression qu’il précise.
