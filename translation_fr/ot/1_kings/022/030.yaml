base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: fr
  text: 'Le roi d’Israël dit à Josaphat : « Moi, je me déguiserai[a] pour aller au combat, mais toi, mets tes vêtements. » Le roi d’Israël se déguisa donc et alla au combat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu vocalisé peut aussi se comprendre : « Déguise-toi et va au combat. » Cependant, les mots « mais toi » et la suite du récit, où le roi d’Israël se déguise, appuient fortement le sens retenu dans le texte.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: je me déguiserai
  rationale: La forme massorétique peut se lire comme un impératif, « déguise-toi », mais le contraste avec וְאַתָּה (« mais toi ») et surtout la suite narrative, où le roi d’Israël se déguise effectivement, indiquent que le roi expose ici son propre projet. « Moi » rend explicite ce contraste sans alourdir la phrase.
- source_word: וָבֹא בַמִּלְחָמָה
  choice: pour aller au combat
  rationale: בוא exprime l’entrée dans la situation de combat. En français actuel, « aller au combat » est plus naturel que le calque « entrer dans la bataille » et convient à l’intention annoncée.
- source_word: וְאַתָּה
  choice: mais toi
  rationale: Le pronom indépendant marque fortement le contraste entre le déguisement du roi d’Israël et la tenue visible de Josaphat.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: porte tes habits royaux
  rationale: בְּגָדִים signifie littéralement « vêtements » ou « habits ». Le contexte exige des vêtements permettant d’identifier Josaphat comme roi ; « habits royaux » exprime naturellement cette implication contextuelle sans préciser indûment leur forme.
- source_word: וַיִּתְחַפֵּשׂ
  choice: se déguisa
  rationale: Le verbe narratif décrit directement l’action réflexive du roi et confirme la compréhension de sa déclaration précédente.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: alla au combat
  rationale: Cette formulation française naturelle conserve la répétition de l’action annoncée, tout en exprimant l’entrée du roi dans l’affrontement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le contraste entre les deux rois est mis en relief par « Moi » et « mais toi ». « Habits royaux » communique la fonction identificatrice des vêtements dans ce contexte militaire.
