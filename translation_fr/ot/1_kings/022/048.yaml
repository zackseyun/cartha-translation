source:
  edition: WLC
  text: וּ/מֶ֥לֶךְ אֵ֛ין בֶּ/אֱד֖וֹם נִצָּ֥ב מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: fr
  text: Il n’y avait pas de roi en Édom ; un gouverneur[a] faisait fonction de roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un représentant » ou « un fonctionnaire nommé ». Le mot hébreu désigne littéralement quelqu’un qui est placé ou établi dans une fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֵין
  choice: Il n’y avait pas de roi
  rationale: La tournure française exprime naturellement l’inexistence indiquée par אֵין dans le cadre passé du récit. La conjonction וּ est rendue implicitement, le point-virgule assurant ici l’enchaînement narratif.
- source_word: בֶּ/אֱדוֹם
  choice: en Édom
  rationale: La préposition בְּ est comprise dans son sens locatif le plus direct devant le nom de lieu Édom.
- source_word: נִצָּב
  choice: un gouverneur
  rationale: Le participe désigne une personne placée ou nommée à un poste. Dans ce contexte politique, « gouverneur » exprime une autorité déléguée sans en faire un roi dynastique indépendant.
- source_word: מֶלֶךְ
  choice: faisait fonction de roi
  rationale: Le dernier מֶלֶךְ est employé comme prédicat. Cette formulation française conserve l’idée que le responsable nommé exerçait la fonction royale, sans lui attribuer nécessairement le statut d’un roi indépendant.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Faisait fonction de roi » clarifie la relation prédicative très concise de l’hébreu tout en maintenant la distinction entre le titre royal absent et l’autorité exercée par un responsable nommé.
