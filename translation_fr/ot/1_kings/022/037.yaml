base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/037.yaml
  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: fr
  text: Ainsi, le roi mourut et fut ramené à Samarie[a]. On enterra le roi à Samarie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « le roi mourut et il vint à Samarie ». Dans le contexte, cela signifie que le corps du roi fut ramené à Samarie après sa mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le qal wayyiqtol de מות exprime l’événement de la mort dans la succession narrative ; le passé simple convient au registre narratif français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini renvoie au souverain déjà connu dans le contexte, Achab, sans remplacer ici le titre hébreu par son nom propre.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: fut ramené à Samarie
  rationale: La forme hébraïque signifie littéralement « il vint à Samarie », mais elle suit immédiatement la mort du roi. Le français naturel explicite donc le transport de son corps ; « ramené » convient puisque Samarie est sa capitale et le lieu de son ensevelissement.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom de lieu.
- source_word: וַיִּקְבְּרוּ
  choice: on enterra
  rationale: Le pluriel hébreu à sujet non précisé se rend naturellement en français par « on », tout en conservant l’indétermination des agents.
- source_word: אֶת הַמֶּלֶךְ
  choice: le roi
  rationale: La répétition du nom dans l’hébreu est conservée plutôt que remplacée par un pronom.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: Avec un nom de ville, le français emploie naturellement « à » pour indiquer le lieu de l’ensevelissement.
