source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֛רֶךְ אָסָ֥א אָבִ֖י/ו לֹא סָ֣ר מִמֶּ֑/נּוּ לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: fr
  text: Il suivit en tout la voie d’Asa, son père[a] ; il ne s’en écarta pas, faisant ce qui est droit aux yeux de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il marcha dans toute la voie d’Asa, son père » ou « Il se conforma entièrement à la conduite d’Asa, son père ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « aux yeux de Yahweh », expression signifiant « selon le jugement de Yahweh » ou « devant Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Il suivit
  rationale: Le verbe signifie littéralement « aller, marcher ». Avec « la voie de » dans cette formule d’évaluation royale, « suivre » exprime naturellement en français l’idée d’adopter une conduite tout en maintenant l’image du chemin.
- source_word: בְּכָל דֶּרֶךְ
  choice: en tout la voie
  rationale: דֶּרֶךְ est singulier dans le texte massorétique et désigne ici la conduite ou le modèle de vie. « En tout » rend la portée de כָּל sans transformer le singulier en pluriel.
- source_word: אָסָא אָבִיו
  choice: d’Asa, son père
  rationale: Cette construction française naturelle conserve à la fois le nom d’Asa et sa relation paternelle avec Josaphat.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: il ne s’en écarta pas
  rationale: סוּר signifie « s’écarter, se détourner ». Le pronom singulier renvoie à « la voie » et prolonge l’image du chemin.
- source_word: לַעֲשׂוֹת
  choice: faisant
  rationale: Le participe français relie naturellement l’action morale à la conduite décrite, sans trancher excessivement entre nuance de but et de résultat.
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: L’expression עָשָׂה הַיָּשָׁר est une formule habituelle signifiant agir conformément à ce qui est jugé droit.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: La formulation conserve l’image hébraïque de l’évaluation divine et reste claire en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Formule d’évaluation de la conduite royale
  choice: Le verset affirme que Josaphat a suivi le modèle de conduite d’Asa et a fait ce qui est droit selon l’évaluation de Yahweh.
  alternative: Paraphraser le verset comme une approbation générale de sa fidélité royale.
  rationale: La traduction conserve la formule d’évaluation du texte hébreu sans lui ajouter une portée doctrinale ou une appréciation plus absolue que celle qui est explicitement formulée.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction garde la métaphore de la voie, le singulier du texte hébreu et l’expression imagée « aux yeux de Yahweh », tout en employant une syntaxe française naturelle.
