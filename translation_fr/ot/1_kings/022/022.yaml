  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: fr
  text: 'Il répondit : « Je sortirai et je serai un esprit de mensonge[a] dans la bouche de tous ses prophètes. » Il lui dit : « Tu le séduiras[b] et tu réussiras aussi. Sors et fais ainsi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit de fausseté ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Tu le tromperas » ou « Tu le persuaderas ». Le verbe hébreu peut évoquer la séduction, la persuasion ou la tromperie selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Je sortirai
  rationale: Le qal inaccompli à la première personne exprime ici l’action projetée. « Sortir » garde le mouvement et prépare la reprise par l’impératif « Sors ».
- source_word: וְהָיִיתִי
  choice: et je serai
  rationale: Le verbe היה indique ici le rôle que l’esprit assumera. « Je serai » reste direct et naturel sans préciser davantage s’il s’agit de devenir ou d’agir comme tel.
- source_word: רוּחַ שֶׁקֶר
  choice: un esprit de mensonge
  rationale: Cette formulation rend naturellement en français un esprit caractérisé par le mensonge, tout en restant proche de l’association nominale hébraïque.
- source_word: בְּפִי
  choice: dans la bouche de
  rationale: Le calque intelligible conserve l’image hébraïque de paroles prononcées par l’intermédiaire des prophètes.
- source_word: כָּל נְבִיאָיו
  choice: tous ses prophètes
  rationale: La formulation exprime sans restriction l’ensemble des prophètes rattachés au roi visé dans le contexte.
- source_word: תְּפַתֶּה
  choice: Tu le séduiras
  rationale: Le piel de פתה peut désigner l’action d’attirer, de persuader ou de tromper. Dans ce contexte, « séduire » conserve l’idée d’amener quelqu’un vers une conduite funeste sans imposer un mécanisme unique.
- source_word: וְגַם תּוּכָל
  choice: et tu réussiras
  rationale: יכל exprime ici la capacité qui aboutit effectivement au résultat. « Tu réussiras » est idiomatique et convient à cette scène d’envoi.
- source_word: צֵא
  choice: Sors
  rationale: L’impératif reprend explicitement le verbe de la proposition « Je sortirai », ce qui préserve la cohésion verbale du texte.
- source_word: וַעֲשֵׂה כֵן
  choice: et fais ainsi
  rationale: Cette formulation concise rend l’ordre d’agir de la manière proposée, dans un registre digne et courant.
theological_decisions:
- issue: La permission ou la mission divine dans une scène où intervient le mensonge
  choice: 'Conserver le dialogue direct : l’esprit propose d’être un esprit de mensonge, puis reçoit l’ordre de sortir et d’agir ainsi.'
  alternative: Atténuer les paroles en les présentant comme une simple permission ou en évitant l’ordre explicite.
  rationale: Les verbes hébreux sont directs. La traduction maintient donc la tension entre la souveraineté divine et l’action de l’esprit sans la résoudre par une paraphrase doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre « Je sortirai » et « Sors » est conservé, de même que l’image biblique « dans la bouche ». Les pronoms maintiennent les référents implicites de l’hébreu tout en rendant l’échange compréhensible.
