source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: fr
  text: 'Mais Josaphat dit : « N’y a-t-il pas encore[a] ici un prophète de Yahweh, que nous puissions le consulter ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « N’y a-t-il pas ici encore un autre prophète de Yahweh, que nous puissions le consulter ? »
    reason: L’adverbe עוֹד peut évoquer soit la présence persistante d’un prophète, soit un prophète supplémentaire par rapport à ceux qui ont déjà été consultés.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais … dit
  rationale: Le waw consécutif fait avancer le récit, tandis que « Mais » exprime naturellement le contraste avec le recours précédent aux autres prophètes.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: הַאֵין
  choice: N’y a-t-il pas
  rationale: La tournure interrogative négative conserve la recherche de confirmation exprimée en hébreu, dans un registre français digne et naturel.
- source_word: פֹּה
  choice: ici
  rationale: Équivalent direct et idiomatique de l’adverbe locatif.
- source_word: נָבִיא
  choice: un prophète
  rationale: Désignation usuelle de celui qui parle au nom de Dieu.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: 'Le lamed indique ici la relation ou l’appartenance : il s’agit d’un prophète associé à Yahweh et parlant pour lui.'
- source_word: עוֹד
  choice: encore
  rationale: Le mot indique qu’un prophète demeure disponible; sa portée permet aussi, dans le contexte, de comprendre « un autre prophète ».
- source_word: וְנִדְרְשָׁה
  choice: que nous puissions consulter
  rationale: Le cohortatif à la première personne du pluriel exprime le but et le désir de rechercher une réponse; cette formulation s’intègre naturellement à la question.
- source_word: מֵאוֹתוֹ
  choice: le consulter
  rationale: Bien que la préposition signifie littéralement « de sa part », « consulter quelqu’un » rend en français l’action de rechercher par son intermédiaire une réponse divine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » préserve le nom d’alliance sans le remplacer par un titre.
- issue: Relation du prophète à Yahweh dans לַיהוָה
  choice: un prophète de Yahweh
  alternative: un prophète pour Yahweh
  rationale: « De Yahweh » exprime sans surinterprétation que le prophète lui appartient ou parle en son nom.
translation_notes:
  register: Français international moderne, clair et digne. L’interrogation négative garde la tonalité soutenue du dialogue, tandis que « consulter » évite une formulation littérale peu naturelle.
