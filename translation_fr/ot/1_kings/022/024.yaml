revisions:
- from: 'Alors Sédécias, fils de Kenaana, s’approcha de Michée, le frappa sur la joue et lui dit : « Par quel chemin l’Esprit de Yahweh est-il passé de moi jusqu’à toi pour te parler ? »[a]'
  to: 'Alors Sédécias, fils de Kenaana, s’avança, frappa Michée sur la joue et lui dit : « Par où[a] l’Esprit de Yahweh est-il passé en me quittant pour te parler ? »'
  rationale: La révision évite d’ajouter Michée comme complément du mouvement, garde « frappa » comme rendu neutre de נכה, et reformule la question pour reproduire plus naturellement l’image sarcastique d’un Esprit qui serait passé d’auprès de Sédécias afin de parler à Michée. La note conserve l’alternative lexicale « Par quel chemin » avec une ancre placée sur l’interrogatif concerné.
