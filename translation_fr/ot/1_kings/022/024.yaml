base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: fr
  text: 'Alors Sédécias, fils de Kenaana, s’avança, frappa Michée sur la joue et lui dit : « Par où[a] l’Esprit de Yahweh est-il passé en me quittant pour te parler ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par quel chemin l’Esprit de Yahweh est-il passé en me quittant pour te parler ? »'
    reason: L’expression interrogative אֵי זֶה peut souligner la voie ou le chemin du passage ; מֵאִתִּי indique que l’Esprit est censé être parti d’auprès de Sédécias.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’approcha de Michée
  rationale: Le verbe נגשׁ exprime le fait de s’avancer ou de s’approcher. La répétition du nom de Michée rend en français la cible du mouvement sans alourdir la scène.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Sédécias, fils de Kenaana
  rationale: Les noms prennent leurs formes françaises bibliques usuelles ou une translittération française claire; la filiation hébraïque est conservée.
- source_word: וַיַּכֶּה אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: le frappa sur la joue
  rationale: נכה désigne largement l’action de frapper et ne précise pas nécessairement qu’il s’agit d’une gifle. לֶחִי est rendu naturellement par « joue ».
- source_word: אֵי זֶה
  choice: Par quel chemin
  rationale: L’expression interrogative porte ici sur la voie par laquelle l’Esprit serait passé. Cette formulation conserve l’image spatiale et le ton provocateur de la question.
- source_word: עָבַר מֵאִתִּי
  choice: est-il passé de moi
  rationale: עבר évoque un passage, tandis que מֵאִתִּי en indique le point de départ. La tournure volontairement imagée reflète la raillerie de Sédécias.
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: Dans cette controverse prophétique, רוּחַ renvoie à l’Esprit divin censé inspirer la parole prophétique. Le nom personnel יהוה est translittéré « Yahweh ».
- source_word: לְדַבֵּר אוֹתָךְ
  choice: pour te parler
  rationale: La construction indique que la parole est adressée à Michée. « Te parler » est idiomatique et ne surcharge pas la syntaxe hébraïque.
theological_decisions:
- issue: Sens et capitalisation de רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  alternative: l’esprit de Yahweh
  rationale: Le contexte est celui de l’inspiration prophétique divine; la majuscule signale ce référent sans trancher la véracité de la prétention sarcastique de Sédécias.
- issue: Portée de la question de Sédécias
  choice: Conserver l’image d’un passage de Sédécias à Michée
  alternative: Reformuler comme une simple question sur le moment où l’Esprit aurait quitté Sédécias
  rationale: Le texte demande par où ou par quelle voie l’Esprit est passé. Garder cette image préserve la raillerie et évite d’expliquer à la place du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La question reste vive et sarcastique. « Frapper sur la joue » demeure plus neutre que « gifler », qui préciserait un geste que le verbe hébreu général n’impose pas.
