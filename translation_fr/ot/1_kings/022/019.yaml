  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: fr
  text: 'Alors il dit : « C’est pourquoi, écoute la parole de Yahweh : j’ai vu Yahweh assis sur son trône, et toute l’armée des cieux[a] se tenant auprès de lui[b], à sa droite et à sa gauche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la multitude céleste » ou « toute l’armée du ciel ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « se tenant sur lui » ou « au-dessus de lui » ; dans ce contexte, l’expression désigne probablement ceux qui se tiennent auprès de lui pour le servir, à sa droite et à sa gauche.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence tirée de l’échange précédent tout en conservant la force solennelle de la transition prophétique.
- source_word: שְׁמַע
  choice: écoute
  rationale: Impératif masculin singulier adressé directement à Achab ; « écoute » est plus naturel en français actuel que le calque « entends ».
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Conserve la formule prophétique traditionnelle ainsi que le nom divin personnel présent dans l’hébreu.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le passé composé rapporte naturellement en français la vision dont Michée présente maintenant le contenu.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: assis sur son trône
  rationale: Rend directement le participe, qui décrit Yahweh dans une posture royale continue.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: toute l’armée des cieux
  rationale: Préserve l’image collective et potentiellement militaire de צָבָא sans réduire explicitement ce groupe aux seuls anges.
- source_word: עֹמֵד עָלָיו
  choice: se tenant auprès de lui
  rationale: Dans la scène de cour céleste, cette formulation française exprime naturellement la présence en service autour du trône, précisée ensuite par « à sa droite et à sa gauche », tout en signalant en note la formulation hébraïque plus littérale.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: à sa droite et à sa gauche
  rationale: Reproduit clairement la symétrie spatiale de l’hébreu dans un français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie le Tétragramme ; « Yahweh » conserve ici le nom personnel plutôt que de lui substituer un titre.
- issue: Identité de צְבָא הַשָּׁמַיִם dans la cour céleste
  choice: toute l’armée des cieux
  alternative: tous les anges du ciel
  rationale: Le terme hébreu désigne collectivement l’armée ou la multitude céleste. La traduction retenue maintient l’imagerie et évite de préciser une ontologie que le verset ne formule pas.
- issue: Rapport spatial exprimé par עָלָיו
  choice: auprès de lui
  alternative: au-dessus de lui / autour de lui
  rationale: Le contexte du trône et la précision « à sa droite et à sa gauche » favorisent l’idée d’assistants se tenant auprès de Yahweh, mais une note conserve la difficulté de la formulation littérale.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe garde le ton solennel d’une déclaration prophétique sans employer de tournures archaïques. Les deux occurrences du nom divin sont rendues uniformément par « Yahweh ».
