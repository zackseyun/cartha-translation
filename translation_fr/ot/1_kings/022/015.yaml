base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: fr
  text: 'Il se rendit donc auprès du roi. Le roi lui demanda : « Michée, devons-nous monter à Ramoth-de-Galaad pour combattre, ou devons-nous y renoncer ? » Michée lui répondit : « Monte et réussis ! Yahweh la livrera au pouvoir du roi. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, la réponse de Michée est probablement ironique, mais l’hébreu ne marque pas explicitement cette ironie.
    reason: ambiguïté du ton
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: Il se rendit donc
  rationale: Le wayyiqtol fait progresser le récit. « Se rendre auprès de » exprime naturellement l’arrivée de Michée devant le roi sans multiplier les « et ».
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: הֲנֵלֵךְ
  choice: devons-nous monter
  rationale: L’imparfait interrogatif à la première personne du pluriel sollicite un conseil. « Devons-nous » rend cette valeur délibérative, tandis que « monter » conserve le verbe hébreu de déplacement.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-de-Galaad
  rationale: Forme toponymique courante en français biblique moderne.
- source_word: לַמִּלְחָמָה
  choice: combattre
  rationale: Le complément de but est rendu idiomatiquement par l’infinitif, sans perdre le sens militaire.
- source_word: אִם נֶחְדָּל
  choice: ou devons-nous y renoncer
  rationale: חדל désigne ici le fait de s’abstenir de l’expédition. Le pronom « y » explicite naturellement en français l’entreprise envisagée.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה est conservé, y compris sa valeur habituelle de mouvement vers un lieu élevé ou une campagne militaire.
- source_word: וְהַצְלַח
  choice: et réussis
  rationale: L’impératif hiphil de צלח exprime la réussite de l’entreprise. Cette formulation directe préserve aussi l’ambiguïté du ton.
- source_word: וְנָתַן יְהוָה
  choice: Yahweh la livrera
  rationale: Après les impératifs, le parfait coordonné annonce ici un résultat futur assuré. « La » reprend naturellement la ville visée, objet implicite en hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: au pouvoir du roi
  rationale: L’expression hébraïque « dans la main de » désigne la remise au pouvoir ou au contrôle de quelqu’un. La formulation française transmet clairement cet idiome.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; sa translittération préserve le caractère personnel du nom divin.
- issue: Ton de la première réponse de Michée
  choice: Traduire les paroles sans signal explicite d’ironie dans le texte principal
  alternative: Ajouter une formulation ouvertement sarcastique
  rationale: Le contexte suggère fortement l’ironie, mais l’hébreu ne la marque pas lexicalement. Le texte principal conserve donc cette ambiguïté, expliquée en note.
- issue: Objet implicite de וְנָתַן
  choice: la, renvoyant à Ramoth-de-Galaad
  alternative: Ne pas exprimer d’objet
  rationale: L’hébreu laisse l’objet sous-entendu. Le français exige ici un complément naturel; le référent contextuel le plus immédiat est la ville, sans préciser davantage la nature de la victoire.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct et soutenu sans archaïsmes. « Monte et réussis » conserve volontairement la forme concise et quelque peu frappante de l’hébreu.
