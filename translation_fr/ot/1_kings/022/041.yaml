  text: וִ/יהֽוֹשָׁפָט֙ בֶּן אָסָ֔א מָלַ֖ךְ עַל יְהוּדָ֑ה בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/אַחְאָ֖ב מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/041.yaml
  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: fr
  text: Josaphat, fils d’Asa, devint roi de Juda la quatrième année du règne d’Achab, roi d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוֹשָׁפָט
  choice: Josaphat
  rationale: La conjonction ו relie cette notice au contexte précédent, mais son rendu explicite par « et » serait peu naturel en français au début de cette nouvelle notice royale. Le nom suit sa forme française biblique usuelle.
- source_word: בֶּן אָסָא
  choice: fils d’Asa
  rationale: La construction exprime directement la filiation; cette formulation est naturelle et précise en français.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule de succession, le parfait qal marque ici l’accession à la royauté plutôt que la durée du règne.
- source_word: עַל יְהוּדָה
  choice: de Juda
  rationale: Avec « devenir roi », le français idiomatique dit « roi de Juda »; cela conserve l’idée de souveraineté exprimée par עַל sans calque maladroit.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: la quatrième année
  rationale: Il s’agit de la formule chronologique habituelle fondée sur l’année de règne.
- source_word: לְאַחְאָב
  choice: du règne d’Achab
  rationale: Dans cette formule de datation, ל indique que l’année est comptée par rapport au règne d’Achab. L’ajout explicite de « règne » évite en français l’expression ambiguë « la quatrième année d’Achab ».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Le titre en apposition identifie la fonction et le royaume d’Achab de manière concise.
