  text: וְ/יֶ֨תֶר֙ הַ/קָּדֵ֔שׁ אֲשֶׁ֣ר נִשְׁאַ֔ר בִּ/ימֵ֖י אָסָ֣א אָבִ֑י/ו בִּעֵ֖ר מִן הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
translation:
  language: fr
  text: Il fit disparaître du pays le reste des prostitués cultuels[a] qui subsistaient encore à l’époque d’Asa, son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un nom masculin singulier à valeur collective. Il est généralement compris comme désignant des hommes associés à des pratiques sexuelles cultuelles ; on peut aussi traduire : « les prostitués sacrés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: le reste des
  rationale: יֶתֶר désigne ce qui subsiste d’un ensemble. « Le reste des » est naturel en français et convient au sens collectif du groupe concerné.
- source_word: הַקָּדֵשׁ
  choice: des prostitués sacrés
  rationale: Dans ce contexte historique, קָדֵשׁ, masculin singulier à valeur collective, désigne des hommes liés à une pratique sexuelle cultuelle illicite. Le pluriel restitue cette valeur collective; « sacrés » marque leur rattachement au culte sans les qualifier moralement de saints.
- source_word: אֲשֶׁר נִשְׁאַר
  choice: qui subsistaient
  rationale: Le verbe exprime le fait d’être resté ou d’avoir survécu à une action antérieure. « Subsistaient » rend clairement cette idée dans la proposition relative.
- source_word: בִּימֵי אָסָא אָבִיו
  choice: depuis l’époque d’Asa, son père
  rationale: Bien que בִּימֵי signifie littéralement « aux jours de », le contexte indique que ces hommes étaient encore présents après le règne d’Asa. « Depuis l’époque de » explicite naturellement ce rapport temporel sans modifier le référent.
- source_word: בִּעֵר
  choice: fit disparaître
  rationale: בער peut signifier consumer, éliminer ou enlever. Ici, avec « du pays », « fit disparaître » exprime leur élimination du territoire sans préciser indûment s’il s’agissait d’une expulsion ou d’une mise à mort.
- source_word: מִן הָאָרֶץ
  choice: du pays
  rationale: Dans ce cadre politique et géographique, הָאָרֶץ désigne le territoire du royaume, non la terre entière. « Du pays » est idiomatique en français.
theological_decisions:
- issue: Traduction de קָדֵשׁ dans un contexte cultuel et sexuel controversé
  choice: prostitués sacrés
  alternative: hommes voués à la prostitution sacrée; prostitués cultuels; consacrés
  rationale: Le terme est masculin et associé, dans ce contexte, à une pratique sexuelle cultuelle interdite. « Prostitués sacrés » communique à la fois les dimensions sexuelle et cultuelle, sans reprendre le terme traditionnel « sodomites », qui importerait des associations postérieures et serait moins précis. La note explique la forme masculine et la valeur du qualificatif.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère collectif du singulier hébreu et évite le terme traditionnel mais imprécis « sodomites ». « Fit disparaître » préserve l’ambiguïté du moyen employé.
