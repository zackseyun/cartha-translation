source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh et suivit la voie de son père, la voie de sa mère et la voie de Jéroboam, fils de Nebath, qui fit pécher Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: L’expression française rend naturellement l’idiome hébreu « faire le mal », tout en explicitant la valeur substantivée de הָרַע.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette formulation conserve l’image hébraïque du regard comme expression d’une évaluation morale et maintient le nom divin.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: suivit la voie
  rationale: En français actuel, « suivre la voie de quelqu’un » garde la métaphore de la conduite sans produire le calque peu naturel « marcher dans la voie ».
- source_word: אָבִיו ... אִמּוֹ
  choice: de son père, celle de sa mère
  rationale: Le pronom « celle » évite une répétition lourde tout en conservant explicitement la double référence du texte.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jéroboam, fils de Nebath
  rationale: Les formes françaises bibliques usuelles des noms sont retenues, et le patronyme hébreu est conservé.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: avait entraîné Israël dans le péché
  rationale: Cette expression rend la valeur causative du hiphil de חטא dans un français naturel, sans suggérer une contrainte absolue qui supprimerait la responsabilité d’Israël.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom personnel divin; sa translittération le distingue d’un titre et suit la donnée hébraïque directe.
- issue: Force causative de הֶחֱטִיא
  choice: avait entraîné Israël dans le péché
  alternative: avait fait pécher Israël
  rationale: Le choix préserve la causalité attribuée à Jéroboam tout en restant idiomatique et sans trancher au-delà du texte la relation entre son influence et la responsabilité du peuple.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition hébraïque de « voie » est légèrement allégée par « celle », mais les trois modèles de conduite restent nettement énumérés. Le plus-que-parfait situe naturellement l’action antérieure de Jéroboam par rapport au règne évoqué.
