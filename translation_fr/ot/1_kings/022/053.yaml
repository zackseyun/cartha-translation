  source_fidelity: 'La structure et les éléments essentiels du verset sont bien rendus : l’évaluation « aux yeux de Yahweh », les trois voies suivies et le patronyme de Jéroboam sont conservés. Toutefois, « avait entraîné Israël dans le péché » est plus interprétatif que le hiphil hébreu הֶחֱטִיא, dont la force causative directe est mieux rendue par « fit pécher Israël ». Le plus-que-parfait n’est pas requis par la forme verbale hébraïque.'
