  terminology: « Yahweh », « Jéroboam » et « Nebath » sont cohérents avec les choix annoncés et avec un français biblique international. « Fit pécher Israël » rend avec précision la causalité sans expliquer davantage le mécanisme ni diminuer la responsabilité collective implicite d’Israël.
