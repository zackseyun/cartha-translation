base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: fr
  text: Ce jour-là, le combat devint plus intense[a]. Le roi fut maintenu debout[b] dans son char, face à Aram, et il mourut le soir. Le sang de sa blessure coula au fond du char[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le combat prit de l’ampleur » ; littéralement « le combat monta ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le roi resta debout ». La forme hébraïque peut indiquer qu’on le maintenait debout ou qu’il était calé dans cette position.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « dans le sein (ou le giron) du char », image désignant sa partie intérieure ou basse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: le combat devint plus intense
  rationale: Littéralement, le combat « monta » ; dans ce contexte, עלה exprime l’intensification des affrontements. « Le combat » convient mieux que « la guerre » à la scène immédiate.
- source_word: הָיָה מָעֳמָד
  choice: fut maintenu debout
  rationale: La forme passive ou causative suggère que le roi blessé fut gardé en position debout, plutôt qu’il ne se tint simplement debout de lui-même.
- source_word: בַּמֶּרְכָּבָה
  choice: sur son char
  rationale: En français courant, on se trouve « sur un char », contrairement à l’anglais « in the chariot ». Le possessif explicite naturellement qu’il s’agit du char du roi.
- source_word: נֹכַח אֲרָם
  choice: face à Aram
  rationale: נֹכַח indique une position en vis-à-vis. Le nom ancien Aram est conservé sans le remplacer par le terme géopolitique plus tardif « Syrie ».
- source_word: וַיָּמָת בָּעֶרֶב
  choice: mais il mourut le soir
  rationale: « Le soir » rend naturellement la précision temporelle. « Mais » explicite avec retenue le contraste narratif entre son maintien au combat et sa mort.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: Le sang de sa blessure coula
  rationale: Avec le sang comme sujet, « coula » exprime naturellement le mouvement indiqué par יצק, souvent « verser ».
- source_word: אֶל חֵיק הָרָכֶב
  choice: au fond du char
  rationale: חֵיק signifie littéralement « sein » ou « giron » ; appliqué au char, l’image désigne sa partie intérieure ou basse, où le sang s’accumule.
