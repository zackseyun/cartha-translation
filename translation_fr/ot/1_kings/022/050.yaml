  text: אָ֠ז אָמַ֞ר אֲחַזְיָ֤הוּ בֶן אַחְאָב֙ אֶל יְה֣וֹשָׁפָ֔ט יֵלְכ֧וּ עֲבָדַ֛/י עִם עֲבָדֶ֖י/ךָ בָּ/אֳנִיּ֑וֹת וְ/לֹ֥א אָבָ֖ה יְהוֹשָׁפָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: fr
  text: 'Alors Ahazia, fils d’Achab, dit à Josaphat : « Que mes serviteurs aillent avec les tiens sur les navires[a]. » Mais Josaphat ne voulut pas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les navires ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Mais Josaphat refusa. » L’hébreu dit plus littéralement qu’il « ne voulut pas » ou « n’y consentit pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque la succession narrative de manière naturelle en français moderne.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahazia, fils d’Achab
  rationale: Suit les formes françaises usuelles des noms bibliques et rend explicitement la relation filiale.
- source_word: יֵלְכוּ
  choice: Que … aillent
  rationale: Le yiqtol à valeur volitive exprime ici une proposition ou une demande, bien rendue par le subjonctif français.
- source_word: עֲבָדַי / עֲבָדֶיךָ
  choice: mes serviteurs / les tiens
  rationale: « Serviteurs » conserve la large gamme de עֶבֶד sans imposer le statut d’esclaves ou de fonctionnaires; « les tiens » évite une répétition lourde tout en maintenant le parallèle.
- source_word: בָּאֳנִיּוֹת
  choice: sur les navires
  rationale: En contexte maritime, le français idiomatique emploie « sur » pour désigner le fait d’embarquer ou de servir à bord; la préposition hébraïque ב peut aussi être comprise comme « dans ».
- source_word: וְלֹא אָבָה
  choice: Mais … ne voulut pas
  rationale: Rend directement l’absence de volonté ou de consentement exprimée par אָבָה, sans renforcer automatiquement le sens en « refusa ».
