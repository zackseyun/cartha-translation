id: 1KI.22.33
reference: 1 Kings 22:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: fr
  text: Quand les chefs des chars virent que ce n’était pas le roi d’Israël, ils cessèrent de le poursuivre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils revinrent de derrière lui », expression hébraïque signifiant qu’ils cessèrent de le suivre ou de le poursuivre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Quand
  rationale: Dans cette construction narrative, וַיְהִי introduit l’événement qui suit et se combine avec la proposition temporelle en כִּרְאוֹת. En français actuel, « Quand » rend naturellement l’enchaînement sans ajouter la tournure lourde « Et il arriva que ».
- source_word: כִּרְאוֹת
  choice: virent
  rationale: 'L’infinitif construit précédé de כ exprime ici la circonstance temporelle : « quand… virent ».'
- source_word: שָׂרֵי הָרֶכֶב
  choice: les chefs des chars
  rationale: שָׂרֵי désigne les chefs militaires, tandis que הָרֶכֶב peut désigner les chars ou le corps de chars. « Les chefs des chars » reste proche de l’hébreu et convient au contexte militaire.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: que ce n’était pas le roi d’Israël
  rationale: La proposition indique ce qu’ils constatent. La tournure française avec « ce » identifie naturellement la personne observée sans modifier le sens du pronom masculin hébreu.
- source_word: וַיָּשׁוּבוּ מֵאַחֲרָיו
  choice: ils cessèrent de le poursuivre
  rationale: L’expression signifie littéralement qu’ils revinrent ou se détournèrent de derrière lui. Dans cette scène militaire, elle indique qu’ils abandonnèrent la poursuite.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation évite l’archaïsme « il arriva que » tout en conservant le lien temporel et la progression du récit.
