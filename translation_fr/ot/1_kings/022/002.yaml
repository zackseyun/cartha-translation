  text: In the third year[a], Jehoshaphat king of Judah went down to the king of Israel.
translation:
  language: fr
  text: La troisième année, Josaphat, roi de Juda, descendit auprès du roi d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « se rendit auprès du roi d’Israël ». Le verbe hébreu signifie littéralement « descendre » et peut évoquer le relief géographique aussi bien qu’un simple déplacement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: La troisième année
  rationale: La formule narrative וַיְהִי introduit ici l’indication temporelle. En français naturel, elle peut être rendue sans calque par le groupe temporel placé en tête de phrase.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד exprime littéralement un mouvement vers le bas et peut aussi relever de la manière hébraïque de décrire un déplacement selon la géographie. « Descendit » en conserve la nuance directionnelle.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: La forme française traditionnelle et largement reconnue du nom biblique est retenue.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: La chaîne construite désigne la fonction royale de Josaphat; l’apposition française naturelle est encadrée de virgules.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: auprès du roi d’Israël
  rationale: אֶל indique le mouvement vers une personne. « Auprès de » exprime naturellement ici le fait de se rendre chez le roi d’Israël sans ajouter un lieu absent du texte.
