  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: fr
  text: 'Le roi d’Israël rassembla alors les prophètes, environ quatre cents hommes, et leur demanda : « Dois-je aller combattre Ramoth-de-Galaad, ou dois-je y renoncer ? » Ils répondirent : « Monte ! Le Seigneur[a] la livrera entre les mains du roi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Monte ! Mon seigneur la livrera entre les mains du roi. » L’hébreu אֲדֹנָי peut, dans certains contextes, signifier « mon seigneur », mais il désigne plus probablement ici Dieu par le titre « le Seigneur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: rassembla
  rationale: Le qal narratif de קבץ exprime l’action de réunir des personnes ; « rassembla » est naturel et précis.
- source_word: הַנְּבִיאִים
  choice: les prophètes
  rationale: Équivalent français courant de נְבִיאִים, sans préjuger ici de l’authenticité de leur parole.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: environ quatre cents hommes
  rationale: Le préfixe כ־ indique une approximation ; אִישׁ explicite qu’il s’agit d’hommes.
- source_word: הַאֵלֵךְ
  choice: Dois-je aller
  rationale: La forme interrogative à la première personne exprime une délibération ou une demande de conseil.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: combattre Ramoth-de-Galaad
  rationale: Cette formulation française rend naturellement le mouvement militaire dirigé contre la ville, sans alourdir la phrase par un calque.
- source_word: אִם אֶחְדָּל
  choice: ou dois-je y renoncer
  rationale: חדל signifie cesser, s’abstenir ou renoncer ; le pronom « y » reprend ici l’expédition militaire envisagée.
- source_word: עֲלֵה
  choice: Monte !
  rationale: Le verbe עלה est un idiome militaire fréquent, littéralement « monter » ; le conserver maintient la couleur du texte hébreu tout en restant intelligible.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: La vocalisation massorétique indique probablement ici le titre divin אֲדֹנָי, distinct du nom divin YHWH. Une autre analyse possible est signalée en note.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: au pouvoir du roi
  rationale: L’expression hébraïque « dans la main de » désigne la mise sous l’autorité ou la puissance de quelqu’un ; « au pouvoir du roi » en restitue clairement le sens en français moderne.
theological_decisions:
- issue: Interprétation de אֲדֹנָי dans la réponse des prophètes
  choice: le Seigneur
  alternative: mon seigneur
  rationale: Dans ce contexte oraculaire, la lecture comme titre divin est la plus probable. Cependant, la forme peut aussi correspondre à « mon seigneur » ; cette ambiguïté textuelle réelle est conservée en note, sans identifier אֲדֹנָי au tétragramme.
translation_notes:
  register: Français international moderne, narratif et digne. « Ramoth-de-Galaad » suit la forme française traditionnelle du toponyme. La tournure idiomatique « au pouvoir du roi » évite un calque obscur, tandis que « Monte ! » conserve l’expression militaire hébraïque.
