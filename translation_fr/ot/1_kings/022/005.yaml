source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: fr
  text: 'Josaphat dit au roi d’Israël : « Je t’en prie, recherche aujourd’hui la parole de Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « consulte aujourd’hui Yahweh au sujet de sa parole » ; ou : « demande aujourd’hui une parole à Yahweh ».'
    reason: La construction עם דָּרַשׁ peut mettre l’accent sur la recherche de la parole divine ou sur la consultation de Yahweh afin d’obtenir une réponse.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw consécutif fait avancer le récit. En français narratif, le passé simple exprime naturellement cette succession sans qu’il soit nécessaire d’ajouter « puis ».
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: au roi d’Israël
  rationale: Rend directement la préposition et le titre royal, dans un français naturel.
- source_word: דְּרָשׁ
  choice: consulte
  rationale: Dans ce contexte, le verbe désigne la recherche d’une révélation ou d’une direction divine. « Consulter Yahweh » exprime clairement l’acte demandé.
- source_word: נָא
  choice: S’il te plaît
  rationale: La particule marque une demande courtoise ou pressante. Le tutoiement convient à l’échange direct entre les deux rois et demeure naturel en français moderne.
- source_word: כַיּוֹם
  choice: aujourd’hui
  rationale: Conserve la valeur temporelle explicite de l’hébreu, qui souligne l’immédiateté de la consultation.
- source_word: אֶת דְּבַר יְהוָה
  choice: Yahweh pour recevoir sa parole
  rationale: Cette formulation française naturelle conserve à la fois l’idée de consulter Dieu et celle de rechercher la parole qu’il donnera, sans réduire דָּבָר à un simple conseil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Objet de la consultation prophétique
  choice: consulte aujourd’hui Yahweh pour recevoir sa parole
  alternative: recherche aujourd’hui la parole de Yahweh
  rationale: L’hébreu permet de mettre l’accent soit sur la recherche de la parole, soit sur la consultation de Yahweh en vue d’une parole. Le texte principal privilégie une formulation idiomatique sans effacer cette diversité, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit biblique écrit; la demande directe reste naturelle grâce à « S’il te plaît ». Le nom divin est translittéré « Yahweh ».
