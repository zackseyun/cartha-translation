  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: fr
  text: 'Et maintenant, voici : Yahweh a mis un esprit de mensonge[a] dans la bouche de tous tes prophètes que voici, et Yahweh a prononcé le malheur contre toi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de fausseté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Yahweh a prononcé la calamité contre toi ». Le terme hébreu peut désigner un malheur ou une calamité dans un contexte de jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction qui poursuit le discours et la transition temporelle immédiate.
- source_word: הִנֵּה
  choice: voici
  rationale: Marque solennellement l’attention, dans un français actuel et digne.
- source_word: נָתַן
  choice: a mis
  rationale: Rend directement l’action exprimée par le verbe hébreu et convient naturellement à la construction « dans la bouche ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: רוּחַ שֶׁקֶר
  choice: un esprit de mensonge
  rationale: Exprime le groupe construit comme un esprit caractérisé par le mensonge, tout en maintenant sa dimension d’agent personnel.
- source_word: בְּפִי
  choice: dans la bouche de
  rationale: Conserve l’image hébraïque de paroles placées dans la bouche; le singulier a ici une portée distributive devant le groupe pluriel.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: tous tes prophètes que voici
  rationale: Préserve le possessif adressé au roi ainsi que la valeur démonstrative et insistante de אֵלֶּה.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: a prononcé le malheur contre toi
  rationale: « Prononcé » maintient l’acte de parole, tandis que « malheur » désigne ici le jugement nuisible annoncé sans attribuer à Dieu un mal moral.
theological_decisions:
- issue: Sens de רָעָה lorsqu’il est associé à l’action de Yahweh
  choice: le malheur
  alternative: le mal; la calamité
  rationale: Dans ce contexte de jugement, le mot désigne un événement funeste ou une calamité, non une faute morale. « Malheur » conserve la force menaçante du texte sans en effacer la portée judiciaire.
- issue: Action divine à l’égard de l’esprit de mensonge
  choice: Yahweh a mis un esprit de mensonge
  alternative: Yahweh a permis qu’un esprit de mensonge agisse
  rationale: Le verbe נָתַן attribue directement l’action à Yahweh. La traduction ne la réduit donc pas à une simple permission et maintient la tension théologique du récit.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « Voici » garde la tonalité prophétique; « que voici » restitue l’insistance démonstrative sans la tournure peu naturelle « ces prophètes à toi ».
