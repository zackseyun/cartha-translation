  text: וְ/יֶתֶר֩ דִּבְרֵ֨י אַחְאָ֜ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וּ/בֵ֤ית הַ/שֵּׁן֙ אֲשֶׁ֣ר בָּנָ֔ה וְ/כָל הֶ/עָרִ֖ים אֲשֶׁ֣ר בָּנָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes d’Achab, tout ce qu’il a fait, la maison d’ivoire qu’il a bâtie[a] et toutes les villes qu’il a bâties, tout cela n’est-il pas écrit dans le livre des Annales des rois d’Israël[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la maison de l’ivoire ». L’expression désigne probablement un édifice royal décoré d’ivoire, et non une construction entièrement faite d’ivoire.
    reason: lexical_alternative
  - marker: b
    text: Le « livre des Annales des rois d’Israël » est une source royale citée dans les livres des Rois ; il ne s’agit pas nécessairement du livre biblique des Chroniques.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: Le reste des actes d’Achab
  rationale: Dans cette formule récapitulative des livres des Rois, דִּבְרֵי désigne les faits ou actes du roi, plutôt que ses seules paroles. « Le reste des actes » est clair et historiographiquement naturel.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Cette formulation conserve la portée générale du verbe עָשָׂה sans préciser indûment la nature de ses réalisations.
- source_word: וּבֵית הַשֵּׁן
  choice: la maison d’ivoire
  rationale: Le rendu reste proche de l’expression hébraïque et ne transforme pas explicitement la maison en « palais », même si un édifice royal est probablement visé.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: et toutes les villes qu’il a bâties
  rationale: עָרִים signifie normalement « villes » ; « bâties » reprend le verbe בָּנָה et s’accorde naturellement avec ce nom.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: La question rhétorique attend une réponse affirmative. « Tout cela » rassemble naturellement en français les différents éléments énumérés, tandis que « écrit » conserve le sens direct de כְּתוּבִים.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dans le livre des Annales
  rationale: « Dans le livre » est l’expression idiomatique française pour un contenu écrit. Ici, דִּבְרֵי הַיָּמִים désigne des annales royales ; « Annales » évite de suggérer une identification automatique avec le livre biblique des Chroniques.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Dans le titre de cette source, la préposition לְ exprime la relation avec les rois d’Israël ; le complément introduit par « des » est naturel en français.
