  yaml_path: translation/ot/1_kings/022/036.yaml
  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: fr
  text: 'Au coucher du soleil, un cri parcourut le camp[a] : « Chacun vers sa ville, chacun vers son pays[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « une clameur », « le cri » ou « la proclamation parcourut le camp ». Le mot hébreu רִנָּה désigne souvent un cri puissant ou retentissant ; ici, il s’agit de l’annonce diffusée dans tout le camp.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Chacun vers sa ville, et chacun vers son pays ! » Il s’agit d’une formule consacrée pour congédier les combattants après la bataille.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר הָרִנָּה בַּמַּחֲנֶה
  choice: un cri parcourut le camp
  rationale: Le verbe עבר décrit ici la propagation du cri dans le camp. « Parcourut le camp » conserve cette image concrète tout en étant naturel en français. רִנָּה désigne un cri sonore; dans ce contexte, il s'agit de l'annonce collective qui met fin au combat, sans idée nécessaire de joie.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: Au coucher du soleil
  rationale: Littéralement lié à l'entrée ou au déclin du soleil, ce tour hébreu est une expression courante désignant le coucher du soleil.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu du cri et rendent inutile un participe tel que « disant », qui serait moins idiomatique.
- source_word: אִישׁ ... וְאִישׁ
  choice: chacun ... chacun
  rationale: La répétition distributive est conservée. Dans cette formule militaire, « chacun » s'adresse naturellement à chaque combattant sans alourdir la phrase par « chaque homme ».
- source_word: אֶל עִירוֹ
  choice: retourne dans sa ville
  rationale: Le texte dit littéralement « vers sa ville ». L'ajout contextuel de « retourne » explicite en français la valeur de cette formule de dispersion après la bataille.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: que chacun retourne dans son pays
  rationale: אֶרֶץ peut désigner la terre, le territoire ou le pays d'une personne. « Son pays » exprime ici naturellement son territoire d'origine et maintient le parallélisme avec « sa ville ».
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve le parallélisme de l'hébreu tout en rendant explicitement, par « retourne », la valeur idiomatique de l'ordre de dispersion.
