  to: 'Le roi d’Israël dit à Josaphat[a] : « Il y a encore un homme par l’intermédiaire de qui l’on peut consulter Yahweh. Mais moi, je le déteste, car il ne prophétise rien de bon à mon sujet, mais seulement du mal : c’est Michée, fils de Yimla. » Josaphat répondit : « Que le roi ne parle pas ainsi ! »'
