  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: fr
  text: 'Le roi d’Israël dit à Josaphat[a] : « Il y a encore un homme par l’intermédiaire de qui l’on peut consulter Yahweh. Mais moi, je le déteste, car il ne prophétise rien de bon à mon sujet, mais seulement du mal : c’est Michée, fils de Yimla. » Josaphat répondit : « Que le roi ne parle pas ainsi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour consulter Yahweh par son intermédiaire ».'
    reason: Conserve l’alternative de rattachement de מֵאֹתוֹ attestée dans la piste d’audit anglaise.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, plutôt que de le remplacer par un titre.
- source_word: עוֹד אִישׁ אֶחָד
  choice: Il reste encore un homme
  rationale: Rend la valeur additive de עוֹד et l’individualisation exprimée par אִישׁ אֶחָד dans un français naturel.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: par l’intermédiaire de qui l’on peut consulter Yahweh
  rationale: Dans ce contexte prophétique, דרש signifie consulter ou rechercher une réponse de Dieu; מֵאֹתוֹ présente l’homme comme intermédiaire.
- source_word: שְׂנֵאתִיו
  choice: je le déteste
  rationale: Le parfait exprime ici l’attitude arrêtée et actuelle du roi; le présent français la communique directement.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: il ne prophétise rien de bon à mon sujet, mais seulement du mal
  rationale: Préserve le contraste entre טוֹב et רָע ainsi que la valeur restrictive de כִּי אִם, sans préciser indûment si רָע désigne le mal en général ou le malheur annoncé.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: Michée, fils de Yimla
  rationale: Emploie la forme française traditionnelle de Michée et une translittération française claire du patronyme.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Que le roi ne parle pas ainsi !
  rationale: Rend l’interdiction respectueuse à la troisième personne et le ton de cour, tout en restant idiomatique en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte explicitement le nom divin; sa transcription conserve la référence personnelle et l’identité d’alliance sans la remplacer par un titre.
- issue: Portée de רָע dans la plainte d’Achab
  choice: du mal
  alternative: du malheur
  rationale: « Du mal » conserve l’étendue sémantique et l’ambiguïté du terme hébreu, alors que « du malheur » limiterait d’emblée le sens à la calamité annoncée.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue garde le respect protocolaire de Josaphat envers le roi. La formulation évite l’archaïsme « qu’il ne dise point » tout en restant plus solennelle que « le roi ne devrait pas dire cela ».
