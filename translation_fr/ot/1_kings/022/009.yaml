  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֲרָ֖/ה מִיכָ֥יְהוּ בֶן יִמְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: fr
  text: 'Alors le roi d’Israël appela un officier de la cour[a] et lui dit : « Fais vite venir Michée, fils de Yimla. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu saris peut désigner un eunuque ou, plus généralement, un officier de la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Dans ce contexte narratif, קרא signifie appeler quelqu’un ou le faire venir. « Appela » reste proche de l’hébreu et convient naturellement en français.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Traduction directe de la chaîne construite désignant le locuteur.
- source_word: אֶל סָרִיס אֶחָד
  choice: un haut fonctionnaire
  rationale: סָרִיס peut désigner un eunuque au sens propre ou, plus largement, un dignitaire de la cour. Ici, le rôle administratif paraît au premier plan; une note conserve l’autre possibilité lexicale.
- source_word: מַהֲרָה
  choice: Fais vite venir
  rationale: L’expression impérative marque l’urgence. Comme l’hébreu n’énonce pas ici un verbe distinct signifiant « amener », le français l’explicite idiomatiquement par « venir » dans la tournure causative « fais venir ».
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: « Michée » est la forme française biblique établie de ce nom propre.
- source_word: בֶן יִמְלָה
  choice: fils de Yimla
  rationale: Traduction directe du patronyme; « Yimla » reproduit clairement la forme hébraïque יִמְלָה en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Fais vite venir » exprime clairement l’ordre urgent, tandis que la note préserve l’ambiguïté de סָרִיס.
