  text: יְהוֹשָׁפָ֗ט בֶּן שְׁלֹשִׁ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ בְּ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: fr
  text: Josaphat avait trente-cinq ans lorsqu’il devint roi, et il régna vingt-cinq ans à Jérusalem. Sa mère s’appelait Azouba ; elle était fille de Shilhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et largement reconnue du nom biblique, correspondant à la translittération de l’hébreu.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: avait trente-cinq ans
  rationale: Rend naturellement en français l’idiome hébreu littéral « fils de trente-cinq ans ».
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: Dans cette formule royale, l’expression situe l’âge de Josaphat au moment de son accession au trône.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: il régna vingt-cinq ans
  rationale: Rendu direct et idiomatique de la durée de son règne.
- source_word: בִּירוּשָׁלָם
  choice: à Jérusalem
  rationale: La préposition française « à » convient naturellement avec un nom de ville.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Expression française actuelle et naturelle qui conserve l’information de la formule hébraïque « le nom de sa mère était ».
- source_word: עֲזוּבָה
  choice: Azouba
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: בַּת שִׁלְחִי
  choice: elle était fille de Shilhi
  rationale: Rend explicitement et naturellement la relation généalogique indiquée par l’hébreu.
