base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: fr
  text: 'Le roi d’Aram avait donné cet ordre aux trente-deux chefs de ses chars : « N’attaquez ni petit ni grand[a], mais uniquement le roi d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « petit ou grand » désigne ici les personnes de tout rang ou de toute importance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Le roi d’Aram
  rationale: Le contexte français permet de ne pas rendre ו par une conjonction initiale. « Aram » conserve le nom hébreu plutôt que l’appellation traditionnelle « Syrie ».
- source_word: צִוָּה
  choice: avait donné cet ordre
  rationale: Le plus-que-parfait présente l’ordre comme antérieur à la scène de bataille; cette formulation rend naturellement l’acte de commander.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: aux trente-deux chefs de ses chars
  rationale: שָׂרֵי désigne des chefs ou commandants, et הָרֶכֶב la force de chars. Le possessif « ses » rend sobrement אֲשֶׁר לוֹ sans la lourdeur de « qui lui appartenaient ».
- source_word: לֹא תִּלָּחֲמוּ אֶת קָטֹן וְאֶת גָּדוֹל
  choice: Ne combattez ni petit ni grand
  rationale: La tournure conserve l’idiome hébreu opposant les personnes de rang inférieur et supérieur; la note en explicite la portée.
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: mais seulement le roi d’Israël
  rationale: « Mais seulement » rend l’exception restrictive de כִּי אִם, tandis que « seulement » exprime aussi l’exclusivité de לְבַדּוֹ sans redondance artificielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe militaire reste claire sans calquer inutilement l’hébreu. Le discours direct conserve l’idiome « ni petit ni grand », accompagné d’une note explicative.
