source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ אֶת זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִילֻ֨/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד בֹּאִ֥/י בְ/שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: fr
  text: 'et tu diras : « Ainsi parle le roi : Mettez cet homme en prison et nourrissez-le de pain de détresse et d’eau de détresse[a], jusqu’à ce que je revienne en paix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pain d’oppression et de l’eau d’oppression » ; l’expression désigne probablement des rations de prison pénibles ou très réduites.
    reason: Alternative lexicale et explication d’un idiome hébreu ambigu.
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ainsi parle le roi
  rationale: Conserve la formule solennelle du messager royal dans un français naturel et digne.
- source_word: שִׂימוּ אֶת זֶה
  choice: Mettez cet homme
  rationale: Le démonstratif désigne Michée dans le contexte. « Cet homme » explicite naturellement le référent sans ajouter d’information.
- source_word: בֵּית הַכֶּלֶא
  choice: en prison
  rationale: Rend avec naturel l’expression hébraïque signifiant littéralement « maison de détention ».
- source_word: וְהַאֲכִילֻהוּ
  choice: et nourrissez-le
  rationale: Reproduit directement la valeur causative de la forme verbale tout en introduisant naturellement les deux compléments alimentaires.
- source_word: לֶחֶם לַחַץ
  choice: pain de détresse
  rationale: Préserve l’image et la dureté de l’expression hébraïque, qui peut évoquer des rations pénibles ou réduites sans l’interpréter directement.
- source_word: וּמַיִם לַחַץ
  choice: eau de détresse
  rationale: Maintient le parallélisme intentionnel avec « pain de détresse » et conserve l’ambiguïté de l’expression.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: jusqu’à ce que je revienne en paix
  rationale: « Revienne » convient au contexte du retour attendu du roi, tandis que « en paix » conserve la portée de שָׁלוֹם et l’ironie narrative.
theological_decisions:
- issue: Portée de בְשָׁלוֹם dans la déclaration d’Akab
  choice: en paix
  alternative: sain et sauf ; victorieux
  rationale: L’hébreu peut évoquer un retour sans dommage ou couronné de succès. « En paix » préserve cette amplitude et la tension ironique du récit sans imposer une interprétation.
translation_notes:
  register: Français international moderne, solennel mais accessible. La formule royale et les expressions parallèles du texte hébreu sont conservées, avec une note pour éclairer leur sens probable.
