  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: fr
  text: Ahazia, fils d’Achab, devint roi d’Israël à Samarie, la dix-septième année du règne de Josaphat, roi de Juda. Il régna deux ans sur Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule d’accession, le qatal signale l’arrivée d’Ahazia à la royauté; « devint roi » l’exprime naturellement en français.
- source_word: עַל יִשְׂרָאֵל
  choice: d’Israël / sur Israël
  rationale: Avec מלך, עַל désigne le peuple sur lequel s’exerce la royauté. La première occurrence est rendue idiomatiquement par « roi d’Israël », la seconde plus formellement par « régna… sur Israël ».
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition ב marque ici le lieu où siège la royauté; pour une ville, le français emploie naturellement « à ».
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: la dix-septième année du règne de Josaphat
  rationale: Cette formulation française explicite naturellement la formule hébraïque de synchronisme royal sans en modifier le sens.
- source_word: וַיִּמְלֹךְ
  choice: Il régna
  rationale: Après la notice d’accession, le verbe introduit la durée du règne; « régna » évite une répétition maladroite.
- source_word: שְׁנָתָיִם
  choice: deux ans
  rationale: Le duel hébreu indique exactement une durée de deux années.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahazia, fils d’Achab
  rationale: Les noms sont translittérés selon leur forme française biblique courante, et la relation filiale du construit hébreu est conservée.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le titre en apposition identifie Josaphat et se rend directement par la tournure française consacrée.
