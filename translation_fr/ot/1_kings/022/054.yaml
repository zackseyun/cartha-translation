  text: וַֽ/יַּעֲבֹד֙ אֶת הַ/בַּ֔עַל וַ/יִּֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יַּכְעֵ֗ס אֶת יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: fr
  text: Il servit Baal et se prosterna devant lui[a]. Il provoqua la colère de Yahweh, le Dieu d’Israël, tout comme son père l’avait fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adora » ; le verbe hébreu désigne littéralement le fait de s’incliner ou de se prosterner.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: servit
  rationale: Le verbe עבד signifie fondamentalement « servir » et peut désigner le service cultuel. « Servit » conserve ce sens tout en laissant au verbe suivant l’expression du geste d’adoration.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Dans ce contexte, Baal fonctionne comme le nom ou titre propre de la divinité. L’article hébreu n’a pas besoin d’être reproduit en français.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: se prosterna devant lui
  rationale: Le verbe שׁחה décrit concrètement le fait de s’incliner ou de se prosterner, souvent comme acte d’adoration. Cette formulation évite de le confondre avec le verbe précédent.
- source_word: וַיַּכְעֵס
  choice: provoqua ainsi la colère de
  rationale: Le hiphil de כעס exprime l’idée de faire éprouver de la colère ou d’irriter. Cette tournure française rend clairement la valeur causative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu et souligne le contraste avec Baal.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette traduction directe et naturelle rend fidèlement la chaîne construite hébraïque.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: exactement comme son père l’avait fait
  rationale: La formulation restitue naturellement la comparaison globale exprimée par l’hébreu; le plus-que-parfait situe l’action du père avant celle du fils.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte oppose explicitement le Dieu d’Israël à Baal. Conserver le nom personnel sous la forme « Yahweh » maintient cette distinction sans remplacer le nom par un titre.
- issue: Rapport entre service cultuel et prosternation
  choice: 'Conserver deux actions distinctes : « servit » et « se prosterna »'
  alternative: Fusionner les deux sous l’idée générale d’adoration
  rationale: L’hébreu emploie deux verbes coordonnés. Les maintenir préserve à la fois le service rendu à Baal et le geste concret de soumission cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. « Provoqua ainsi la colère » explicite naturellement la valeur causative du verbe hébreu.
