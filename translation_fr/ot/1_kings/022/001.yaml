base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/001.yaml
  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: fr
  text: Pendant trois ans, il n’y eut pas de guerre entre Aram et Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, litt. : « Ils restèrent trois ans sans guerre entre Aram et Israël. »'
    reason: lexical_alternative
  - marker: b
    text: « Aram » est le nom hébreu souvent rendu par « Syrie » dans certaines traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: ils restèrent
  rationale: Le verbe יָשַׁב signifie littéralement « s’asseoir, habiter », mais, avec une indication de durée et la situation décrite ensuite, il exprime ici la continuité d’un état. « Ils restèrent » conserve cette nuance tout en étant naturel en français.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: pendant trois ans
  rationale: L’accusatif temporel hébreu indique une durée; « pendant trois ans » l’exprime clairement en français.
- source_word: אֵין מִלְחָמָה
  choice: sans guerre
  rationale: La tournure hébraïque signifie littéralement « il n’y a pas de guerre ». Après « ils restèrent », « sans guerre » restitue de façon concise l’absence de conflit.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et ...
  rationale: Cette construction française rend naturellement la répétition relationnelle de l’hébreu.
- source_word: אֲרָם
  choice: Aram
  rationale: « Aram » translittère directement le nom hébreu et évite de le remplacer par l’appellation géopolitique plus tardive « Syrie ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française traditionnelle et directe du nom propre hébreu.
theological_decisions: []
