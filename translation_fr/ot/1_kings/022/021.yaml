base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: fr
  text: 'Alors l’esprit s’avança, se tint devant Yahweh et dit : « Moi, je le séduirai.[a] » Yahweh lui dit : « Comment ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je le persuaderai » ou « je le tromperai ». Le verbe hébreu peut désigner la séduction, la persuasion ou la tromperie; le verset suivant précise le moyen employé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: l’esprit
  rationale: L’article hébreu désigne ici un être spirituel déterminé dans la scène du conseil céleste. La minuscule évite de l’identifier sans nécessité à l’Esprit saint.
- source_word: וַיֵּצֵא
  choice: s’avança
  rationale: Dans cette scène de cour, le verbe décrit naturellement le fait de sortir du groupe pour se présenter; « s’avança » rend ce mouvement avec clarté.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: se tint devant
  rationale: Cette formulation conserve l’idée de prendre place en présence d’un supérieur et le caractère solennel de l’audience.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֲפַתֶּנּוּ
  choice: je le séduirai
  rationale: Au piel, פתה peut exprimer l’action de séduire, persuader ou tromper. « Séduire » conserve ici l’idée d’amener Achab à agir sans préciser avant le verset suivant le procédé employé.
- source_word: בַּמָּה
  choice: Comment ?
  rationale: L’interrogation porte sur le moyen ou la manière. « Comment ? » est naturel, direct et exact en français moderne.
theological_decisions:
- issue: Identité de הָרוּחַ dans le conseil céleste
  choice: un être spirituel particulier, rendu par « l’esprit »
  alternative: « l’Esprit » au sens de l’Esprit saint, ou « un esprit » indéfini
  rationale: Le récit présente un membre déterminé de l’armée céleste qui s’avance. La traduction garde l’article sans imposer une identification à l’Esprit saint que le contexte n’exige pas.
- issue: Portée de אֲפַתֶּנּוּ
  choice: « je le séduirai »
  alternative: « je le persuaderai » ou « je le tromperai »
  rationale: Le verbe laisse ouverte la nuance exacte de l’incitation; le verset suivant en précise le moyen. La formulation ne résout donc pas prématurément la tension du récit.
translation_notes:
  register: Français international moderne, digne et narratif. « Alors » assure l’enchaînement; « Moi » rend l’insistance du pronom hébreu. La ponctuation place l’appel de note immédiatement après la proposition concernée.
