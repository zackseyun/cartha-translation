  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: fr
  text: 'Michée dit : « Si tu reviens vraiment sain et sauf, Yahweh n’a pas parlé par moi[a]. » Puis il dit : « Écoutez, peuples, vous tous[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par mon intermédiaire ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie le pluriel « peuples » : l’appel s’adresse largement à tous les peuples, et non à un seul peuple.'
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du prophète dans le récit des Rois.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Si tu reviens vraiment
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la condition ; « vraiment » exprime cette insistance en français naturel.
- source_word: בְּשָׁלוֹם
  choice: sain et sauf
  rationale: Dans ce contexte de guerre, le terme désigne un retour sans dommage. Cette expression française communique clairement le sens contextuel tout en conservant l’idée de bien-être attachée à שָׁלוֹם.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Yahweh n’a pas parlé par moi
  rationale: La préposition ב marque ici Michée comme l’instrument de la parole prophétique. « Par moi » reste proche de la formulation hébraïque ; la note indique une formulation française équivalente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin explicitement présent dans le texte hébreu.
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif appelle publiquement les auditeurs à prêter attention ; « Écoutez » est direct et naturel en français moderne.
- source_word: עַמִּים כֻּלָּם
  choice: vous tous, les peuples
  rationale: Le pluriel « peuples » est conservé, ainsi que la portée générale de l’appel ; l’ordre est adapté à un français idiomatique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin lui-même ; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Locuteur de la dernière proposition ויאמר
  choice: Michée reste le locuteur
  alternative: Y voir une remarque éditoriale ou la parole d’un autre locuteur
  rationale: La continuité narrative la plus directe attribue également cet appel public à Michée, sans supposer un changement de locuteur que le texte ne précise pas.
- issue: Valeur probatoire de la prophétie conditionnelle
  choice: c’est que Yahweh n’a pas parlé par moi
  alternative: Yahweh n’a pas parlé par moi
  rationale: 'La tournure française explicite le rapport logique déjà porté par la condition hébraïque : si Achab revient indemne, la parole de Michée ne venait pas de Yahweh. Elle n’ajoute aucune conclusion doctrinale étrangère au texte.'
translation_notes:
  register: Français international moderne, digne et oralement clair. « Déclara » et « ajouta » évitent la répétition pesante de « dit » tout en maintenant Michée comme locuteur. « Sain et sauf » privilégie le sens contextuel de בְּשָׁלוֹם, tandis que l’appel final conserve le pluriel inhabituel et solennel de l’hébreu.
