id: 1KI.22.32
reference: 1 Kings 22:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: fr
  text: 'Lorsque les chefs des chars virent Josaphat, ils dirent : « C’est certainement le roi d’Israël ! » Alors ils se dirigèrent vers lui pour le combattre[a], mais Josaphat poussa un cri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils se tournèrent contre lui pour l’attaquer »; le verbe hébreu peut désigner le fait de se tourner vers quelqu’un ou contre lui afin d’engager le combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Lorsque … virent
  rationale: La construction introduit la circonstance temporelle du récit. « Lorsque » restitue naturellement ce lien en français moderne sans alourdir la phrase par « il arriva que ».
- source_word: שָׂרֵי הָרֶכֶב
  choice: les chefs des chars
  rationale: שָׂרֵי désigne ici les responsables militaires, et הָרֶכֶב les chars ou les unités de chars. Cette formulation reste proche de l’hébreu tout en étant intelligible.
- source_word: אַךְ
  choice: certainement
  rationale: Dans ce contexte, la particule exprime une identification assurée plutôt qu’une restriction.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: C’est … le roi d’Israël
  rationale: La tournure française d’identification avec « c’est » est naturelle et conserve l’erreur d’identification commise par les chefs.
- source_word: וַיָּסֻרוּ עָלָיו
  choice: ils se dirigèrent vers lui
  rationale: Avec עַל et l’infinitif qui suit, סור décrit ici un mouvement hostile en direction de Josaphat. Le choix rend clairement le mouvement sans imposer une image plus précise que le texte.
- source_word: לְהִלָּחֵם
  choice: pour le combattre
  rationale: L’infinitif de לחם exprime l’engagement dans le combat; le pronom explicite en français la cible déjà indiquée par עָלָיו.
- source_word: וַיִּזְעַק
  choice: poussa un cri
  rationale: זעק désigne un cri pressant, souvent poussé dans la détresse, sans préciser ici les paroles prononcées.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe évite le calque pesant « il arriva que », tandis que le vocabulaire militaire reste proche de l’hébreu. L’exclamation traduit la conviction soudaine des chefs sans ajouter de contenu au texte.
