base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: fr
  text: 'Le messager qui était allé appeler Michée lui dit : « Vois donc : les paroles des prophètes sont, d’une seule voix[a], favorables au roi. Que ta parole soit donc comme celle de l’un d’eux, et prononce une parole favorable. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’une seule bouche »; c’est-à-dire unanimement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: le messager
  rationale: Dans ce récit, le terme désigne l’homme envoyé chercher Michée, et non un être céleste. « Messager » conserve le sens courant du mot hébreu sans introduire l’idée plus officielle d’un ambassadeur.
- source_word: לִקְרֹא
  choice: appeler
  rationale: Le verbe signifie fondamentalement « appeler ». Dans le contexte, il s’agit bien de faire venir Michée auprès du roi, mais « appeler » reste naturel en français et plus proche de la formulation hébraïque que « convoquer ».
- source_word: הִנֵּה נָא
  choice: Vois donc
  rationale: הִנֵּה attire l’attention, tandis que נָא donne ici une nuance d’insistance ou de sollicitation. « Vois donc » rend ces deux éléments dans un registre actuel et digne.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: les paroles des prophètes
  rationale: Cette traduction directe conserve le pluriel et évite de préciser prématurément s’il s’agit de prédictions formelles, de messages ou de simples déclarations.
- source_word: פֶּה אֶחָד
  choice: d’une seule voix
  rationale: Littéralement « d’une seule bouche », cette expression signifie que les prophètes tiennent unanimement le même discours. L’équivalent idiomatique français préserve l’image de la parole commune; le sens littéral est signalé en note.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: favorables au roi
  rationale: Le qualificatif טוֹב décrit ici des paroles positives à l’égard du roi ou de son projet. « Favorables au roi » exprime ce rapport sans préciser indûment le contenu de la prédiction.
- source_word: יְהִי נָא דְבָרְךָ
  choice: Que ta parole soit donc
  rationale: Le singulier « ta parole » peut désigner collectivement le message que Michée va prononcer. La tournure française conserve la demande insistante exprimée par נָא.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: comme celle de l’un d’eux
  rationale: Le pronom « celle » reprend naturellement « ta parole » tout en respectant la comparaison singulière de l’hébreu avec la parole de l’un des prophètes.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: et prononce une parole favorable
  rationale: La formulation rend explicitement la valeur adverbiale de טוֹב en français tout en conservant le champ lexical de la parole. Elle évite le calque peu naturel « parle bien », qui pourrait évoquer la qualité de l’élocution.
