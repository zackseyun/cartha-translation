  - severity: medium
    issue: Restructuration de « et il tombera à Ramoth-de-Galaad » en « où il tombera »
    rationale: L’hébreu coordonne « monter » et « tomber » et place le complément de lieu après « tomber ». La relative française lie grammaticalement Ramoth-de-Galaad au seul événement de la chute et ne conserve pas aussi directement la séquence verbale.
  revised_text: 'Yahweh dit : « Qui incitera[a] Achab, afin qu’il monte et tombe à Ramoth-de-Galaad ? » L’un disait ceci, l’autre cela.'
