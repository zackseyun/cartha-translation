base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: fr
  text: 'Yahweh dit : « Qui incitera[a] Achab, afin qu’il monte et tombe à Ramoth-de-Galaad ? » L’un disait ceci, l’autre cela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « persuadera » ou « trompera » ; selon le contexte, le verbe peut exprimer diverses manières d’amener quelqu’un à agir.
    reason: alternative lexicale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: יְפַתֶּה
  choice: incitera[a]
  rationale: Le piel de פתה peut exprimer l’action d’amener quelqu’un à agir, avec selon le contexte les nuances de persuasion, de séduction ou de tromperie. « Incitera » reste naturel en français et évite de trancher entièrement cette ambiguïté dans le texte principal.
- source_word: וְיַעַל
  choice: à monter attaquer
  rationale: Dans ce contexte militaire, « monter » désigne l’expédition contre la ville. L’ajout explicatif « attaquer » rend le sens naturel en français sans modifier le but de l’action.
- source_word: וְיִפֹּל
  choice: où il tombera
  rationale: Le verbe נפל signifie littéralement « tomber » et implique ici la défaite et la mort au combat. Le choix conserve l’image sobre de l’hébreu sans l’expliciter davantage.
- source_word: בְּרָמֹת גִּלְעָד
  choice: Ramoth-de-Galaad
  rationale: Cette forme française usuelle du nom de lieu identifie la ville située en Galaad.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: L’un disait ceci, l’autre cela
  rationale: Cette tournure française concise et naturelle restitue l’échange de propositions différentes au sein du conseil, tout en conservant le contraste entre les participants.
theological_decisions:
- issue: Participation divine à la chute d’Achab
  choice: Conserver directement la question de Yahweh sur celui qui incitera Achab à partir au combat et à tomber.
  alternative: Atténuer l’initiative divine par une paraphrase telle que « qui influencera Achab ».
  rationale: L’hébreu présente Yahweh comme celui qui pose la question au conseil céleste. La traduction maintient cette formulation et la tension théologique qu’elle porte, sans réduire la souveraineté ni le jugement divins.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le discours direct, l’image de la « chute » et la concision de la scène du conseil céleste.
