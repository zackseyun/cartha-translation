  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: fr
  text: 'Alors le roi lui dit : « Combien de fois faudra-t-il que je te fasse jurer de ne me dire que la vérité au nom de Yahweh ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו הַמֶּלֶךְ
  choice: Alors le roi lui dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement la succession, tandis que le titre « le roi » est conservé comme dans l’hébreu.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Combien de fois
  rationale: Cette tournure française naturelle conserve la question rhétorique et l’exaspération liée à la répétition.
- source_word: אֲנִי מַשְׁבִּיעֶךָ
  choice: faudra-t-il que je te fasse jurer
  rationale: Le hiphil de שׁבע signifie faire jurer ou placer sous serment. Le futur « faudra-t-il » rend naturellement la force exaspérée de la question sans affaiblir l’idée de serment.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: de ne me dire que la vérité
  rationale: La construction restrictive hébraïque, littéralement « ne pas me parler, sauf vérité », correspond idiomatiquement en français à « ne me dire que la vérité ».
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: « Au nom de » conserve l’idée d’autorité et d’invocation attachée à בְּשֵׁם, et le nom divin est rendu directement par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le caractère propre du nom divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le ton irrité du roi, la valeur causative du verbe de serment et le titre « le roi », sans expliciter davantage la tension narrative avec la réponse précédente de Michée.
