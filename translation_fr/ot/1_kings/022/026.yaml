  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קַ֚ח אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֵ֖/הוּ אֶל אָמֹ֣ן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: fr
  text: 'Alors le roi d’Israël dit : « Prends Michée et ramène-le à Amon, gouverneur de la ville[a], et à Joas, fils du roi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commandant de la ville » ou « haut responsable de la ville ». Le titre hébreu peut désigner un haut fonctionnaire civil ou un chef militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement la succession narrative sans alourdir la phrase.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Rendu direct du groupe nominal hébreu. Le texte conserve le titre plutôt que de nommer Achab.
- source_word: קַח
  choice: Prends
  rationale: L’impératif est au singulier et signifie couramment « prendre ». Le pluriel « Prenez » effacerait cette donnée grammaticale, tandis que « saisis » accentuerait indûment la violence.
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française biblique usuelle du nom propre.
- source_word: וַהֲשִׁיבֵהוּ
  choice: ramène-le
  rationale: Le hiphil de שוב exprime ici le fait de faire revenir quelqu’un. « Ramène-le » indique clairement que Michée retourne sous la garde des responsables mentionnés.
- source_word: אֶל
  choice: auprès de
  rationale: Dans ce contexte de remise à des responsables, « auprès de » est plus naturel en français que le simple « à », tout en conservant la direction exprimée par la préposition.
- source_word: אָמֹן
  choice: Amôn
  rationale: Transcription française claire du nom hébreu, avec accent circonflexe pour guider la prononciation et éviter une lecture identique au nom commun français.
- source_word: שַׂר הָעִיר
  choice: gouverneur de la ville
  rationale: שַׂר désigne un dirigeant ou haut responsable, civil ou militaire. Dans ce cadre urbain, « gouverneur » rend bien la fonction administrative sans exclure toute autorité militaire.
- source_word: וְאֶל יוֹאָשׁ
  choice: et de Joas
  rationale: La seconde préposition coordonne un deuxième destinataire. Après « auprès de », sa reprise sous la forme « de » est nécessaire en français.
- source_word: בֶּן הַמֶּלֶךְ
  choice: fils du roi
  rationale: Rendu direct et idiomatique de la chaîne construite, sans ajouter le titre de « prince », absent de l’hébreu.
