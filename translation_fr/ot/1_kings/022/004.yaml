base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: fr
  text: 'Il dit à Josaphat : « Iras-tu avec moi combattre à Ramoth en Galaad ? » Josaphat répondit au roi d’Israël : « Je suis comme toi, mon peuple comme ton peuple, mes chevaux comme tes chevaux.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une formule brève, sans verbe dans les deux derniers membres : « Je suis comme toi, mon peuple comme ton peuple, mes chevaux comme tes chevaux. » Elle exprime la solidarité et l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Iras-tu avec moi
  rationale: La particule interrogative et l’imparfait qal forment une question directe. « Iras-tu » conserve le verbe de mouvement et « avec moi » exprime exactement l’accompagnement.
- source_word: לַמִּלְחָמָה
  choice: combattre
  rationale: Avec le verbe « aller », le nom désigne ici le fait de partir prendre part au combat. L’infinitif français donne une formulation naturelle sans ajouter l’idée d’une campagne prolongée.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth en Galaad
  rationale: Cette forme française distingue la ville de Ramoth de la région de Galaad et correspond à un usage géographique biblique bien établi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Le groupe construit désigne de façon définie le souverain d’Israël dans ce contexte.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Il en est de moi comme de toi
  rationale: Cette tournure française restitue l’expression comparative sans verbe et exprime la solidarité proposée, sans préciser davantage la nature de l’accord.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: de mon peuple comme de ton peuple
  rationale: La construction parallèle prolonge directement la comparaison initiale et en conserve la concision.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: de mes chevaux comme de tes chevaux
  rationale: « Chevaux » traduit concrètement סוּסִים sans le remplacer par l’interprétation plus étroite « cavalerie ».
