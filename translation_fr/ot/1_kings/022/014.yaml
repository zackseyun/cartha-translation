  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: fr
  text: 'Michée dit : « Aussi vrai que Yahweh est vivant, tout ce que Yahweh me dira, je le dirai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit le récit et introduit directement les paroles de Michée ; le passé simple convient au registre narratif français.
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du prophète dans ce récit.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formulation française naturelle conserve la valeur solennelle de la formule hébraïque de serment.
- source_word: אֵת אֲשֶׁר יֹאמַר יְהוָה אֵלַי
  choice: tout ce que Yahweh me dira
  rationale: La relative indéfinie est rendue naturellement par « tout ce que » ; le futur exprime ici l’orientation contextuelle de l’imparfait hébreu.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: je le dirai
  rationale: Le pronom « le » reprend explicitement ce que Yahweh dira, comme le pronom résomptif hébreu אֹתוֹ, tandis que « dirai » est idiomatique en français pour transmettre un message.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte porte le nom divin personnel. « Yahweh » le représente directement sans lui substituer un titre ; sa répétition dans les deux propositions est conservée.
translation_notes:
  register: Français moderne, digne et accessible. La formule « Aussi vrai que… est vivant » restitue la force du serment sans calque maladroit, et la reprise « je le dirai » préserve l’insistance de l’hébreu.
