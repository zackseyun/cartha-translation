source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹֽא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: fr
  text: Toutefois, les hauts lieux[a] ne furent pas supprimés ; le peuple continuait à offrir des sacrifices et à brûler de l’encens sur les hauts lieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctuaires des hauteurs ». Le terme hébreu désigne des sites cultuels locaux, traditionnellement appelés « hauts lieux ».
    reason: lexical_alternative
  - marker: b
    text: Le verset ne précise pas si ces sacrifices étaient offerts au SEIGNEUR dans des lieux non autorisés ou s’ils relevaient de pratiques idolâtres plus larges.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: Marque le contraste avec l’évaluation positive qui précède, dans un français naturel et soutenu.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: les hauts lieux / sur les hauts lieux
  rationale: « Hauts lieux » est le terme français traditionnel et historiquement précis pour ces sites cultuels locaux, souvent situés sur des hauteurs, sans les réduire à de simples sanctuaires.
- source_word: לֹא סָרוּ
  choice: ne furent pas supprimés
  rationale: Avec « les hauts lieux » pour sujet, l’expression indique que ces sites cultuels ne furent pas éliminés, plutôt qu’un départ physique.
- source_word: עוֹד
  choice: continuait à
  rationale: Exprime la persistance de la pratique et rend naturellement en français la valeur durative de עוֹד avec les participes suivants.
- source_word: הָעָם
  choice: le peuple
  rationale: Rend directement le collectif hébreu désignant la population.
- source_word: מְזַבְּחִים
  choice: à offrir des sacrifices
  rationale: Le participe décrit une pratique habituelle qui se poursuivait ; « offrir des sacrifices » est idiomatique dans le registre cultuel français.
- source_word: וּמְקַטְּרִים
  choice: et à brûler de l’encens
  rationale: Dans cette formule cultuelle, קטר désigne vraisemblablement l’action de faire brûler de l’encens, tout en pouvant plus largement évoquer une offrande consumée en fumée.
theological_decisions:
- issue: Nature du culte pratiqué sur les hauts lieux
  choice: Décrire les actes sans préciser à quelle divinité les sacrifices étaient destinés.
  alternative: Préciser qu’il s’agissait soit d’un culte rendu au SEIGNEUR dans des lieux non autorisés, soit d’un culte syncrétiste ou idolâtre.
  rationale: L’hébreu condamne implicitement la persistance des hauts lieux, mais ne nomme pas ici le destinataire du culte. La traduction conserve cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. « Toutefois » maintient le contraste ; « continuait à » restitue la pratique persistante exprimée par עוֹד et les participes. La répétition de « hauts lieux » est conservée conformément à l’hébreu.
