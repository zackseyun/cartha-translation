source:
  edition: WLC
  text: יְהוֹשָׁפָ֡ט עשר אֳנִיּ֨וֹת תַּרְשִׁ֜ישׁ לָ/לֶ֧כֶת אוֹפִ֛ירָ/ה לַ/זָּהָ֖ב וְ/לֹ֣א הָלָ֑ךְ כִּֽי נשברה אֳנִיּ֖וֹת בְּ/עֶצְי֥וֹן גָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: fr
  text: Josaphat construisit des navires de Tarsis[a] pour aller chercher de l’or à Ophir, mais ils ne partirent pas[b], car les navires firent naufrage à Étsion-Guéber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des navires de type Tarsis » : l’expression peut désigner une catégorie de grands navires de haute mer plutôt que des navires venant réellement de Tarsis.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le singulier (« il ne partit pas »), probablement avec un sens collectif renvoyant à la flotte ou à l’ensemble des navires.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: construisit
  rationale: Le texte consonantique est compris ici, d’après la syntaxe et le contexte, comme une forme verbale signifiant « faire, construire, préparer », avec Josaphat pour sujet et les navires pour objet.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: des navires de Tarsis
  rationale: 'Cette formulation conserve le tour construit hébreu et son ambiguïté : il peut s’agir de navires associés à Tarsis ou d’une catégorie de grands navires de haute mer.'
- source_word: לָלֶכֶת אוֹפִירָה לַזָּהָב
  choice: pour aller chercher de l’or à Ophir
  rationale: L’infinitif exprime le but et la forme directionnelle d’Ophir la destination. « Aller chercher de l’or » rend naturellement en français la finalité de l’expédition.
- source_word: וְלֹא הָלָךְ
  choice: mais ils ne partirent pas
  rationale: Bien que le verbe hébreu soit au singulier, son sujet implicite est compris collectivement comme la flotte ou l’ensemble des navires. « Partir » convient à une expédition qui n’a pas pu prendre la mer.
- source_word: נשברה
  choice: firent naufrage
  rationale: Le niphal de שבר signifie « être brisé ». Dans ce contexte maritime, « faire naufrage » exprime clairement et idiomatiquement que les navires ont été détruits ou gravement endommagés.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: à Étsion-Guéber
  rationale: La préposition ב désigne ici le lieu où les navires ont fait naufrage; « à » est naturel pour un port ou une localité.
theological_decisions: []
