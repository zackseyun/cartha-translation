  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לוֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֽוֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: fr
  text: 'Alors le roi d’Israël dit à Josaphat : « Ne t’avais-je pas dit qu’il ne prophétiserait rien de bon à mon sujet, mais seulement du mal[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais seulement des malheurs ». L’hébreu dit littéralement « du bon… mais seulement du mal » ; dans ce contexte, le « mal » peut désigner une annonce défavorable ou un désastre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette progression en français.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Le groupe construit identifie directement celui qui parle. Le nom d’Achab n’est pas ajouté, conformément au texte hébreu.
- source_word: אֶל יְהוֹשָׁפָט
  choice: à Josaphat
  rationale: La préposition introduit le destinataire. Le texte donne seulement le nom propre, sans ajouter le titre de roi.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: Ne t’avais-je pas dit
  rationale: La tournure interrogative négative appelle l’assentiment et porte un ton de reproche. Le plus-que-parfait situe naturellement l’avertissement avant la scène présente.
- source_word: לֹא יִתְנַבֵּא
  choice: il ne prophétiserait
  rationale: 'L’imparfait hébreu est compris par rapport au verbe antérieur « j’avais dit » : le futur dans le passé français rend bien la plainte du roi sur ce que Michée annoncerait.'
- source_word: עָלַי
  choice: à mon sujet
  rationale: Avec un verbe de parole prophétique, עַל désigne ce qui concerne une personne. « À mon sujet » est naturel et précis.
- source_word: טוֹב
  choice: rien de bon
  rationale: L’adjectif est employé substantivement. La négation française appelle naturellement « rien de bon », sans préciser davantage la nature du bien annoncé.
- source_word: כִּי אִם
  choice: mais seulement
  rationale: 'Après une négation, cette locution marque ici une opposition exclusive : non pas l’un, mais seulement l’autre.'
- source_word: רָע
  choice: du mal
  rationale: « Du mal » maintient l’opposition lexicale directe avec « bon » et conserve l’ambiguïté entre ce qui est défavorable et le malheur annoncé. Une formulation plus contextuelle est signalée en note.
theological_decisions:
- issue: Sens de רָע dans la plainte du roi au sujet de la prophétie
  choice: du mal
  alternative: des malheurs
  rationale: Le contexte vise une annonce défavorable ou désastreuse, mais le choix principal conserve l’opposition hébraïque très nette entre טוֹב et רָע sans réduire le terme à une seule nuance. La note préserve l’interprétation contextuelle plausible.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe entre les deux rois dans ce récit. La formulation garde le contraste abrupt du texte hébreu tout en respectant la syntaxe idiomatique française.
