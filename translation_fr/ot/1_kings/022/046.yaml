source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes de Josaphat, la vaillance dont il fit preuve[a] et la manière dont il combattit, tout cela n’est-il pas écrit dans le livre des Chroniques des rois de Juda ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les exploits qu’il accomplit ». L’hébreu associe littéralement « sa vaillance » à « qu’il fit », tournure qui désigne une valeur manifestée par des actes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Le reste des actes
  rationale: Dans la formule récapitulative des règnes, דְּבָרִים désigne les faits ou actes du roi plutôt que ses paroles. Le וְ initial n’exige pas ici l’ajout d’un marqueur temporel comme « maintenant ».
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et couramment reconnue du nom du roi.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: la vaillance dont il fit preuve
  rationale: Littéralement, l’hébreu associe « sa vaillance » à « qu’il fit ». Cette tournure idiomatique évoque une valeur manifestée par des actes ; la formulation française conserve le nom tout en restant naturelle.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: et la manière dont il combattit
  rationale: Le verbe נלחם signifie combattre ou faire la guerre. Cette traduction conserve la proposition relative sans introduire explicitement des « guerres » absentes du texte.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: La question rhétorique de l’hébreu est maintenue. « Tout cela » reprend naturellement en français les différents éléments énumérés, là où l’hébreu emploie le pronom pluriel הֵם.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: dans le livre des Chroniques des rois de Juda
  rationale: Dans cette formule de renvoi documentaire, עַל סֵפֶר se rend naturellement par « dans le livre ». « Chroniques des rois de Juda » exprime le titre des annales royales concernées.
theological_decisions: []
