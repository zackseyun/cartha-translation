  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: fr
  text: Le roi d’Israël et Josaphat, roi de Juda, montèrent à Ramoth en Galaad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: montèrent
  rationale: Le verbe עלה exprime le mouvement vers le haut ou vers une destination; « montèrent » conserve cet aspect sans préciser davantage le caractère militaire du déplacement.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: le roi d’Israël
  rationale: Le texte hébreu emploie le titre plutôt que le nom d’Achab; la traduction conserve ce choix narratif.
- source_word: וִיהוֹשָׁפָט
  choice: et Josaphat
  rationale: « Josaphat » est la forme française traditionnelle et courante du nom יהושפט.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le titre est mis en apposition après le nom propre, conformément à la syntaxe naturelle du français.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth en Galaad
  rationale: Cette forme française distingue naturellement la ville de Ramoth de la région de Galaad et correspond à l’usage biblique francophone courant.
- source_word: וַ
  choice: donc
  rationale: Dans ce contexte, le waw narratif fait avancer le récit et présente le départ comme la suite de la décision précédente; « donc » rend clairement cette relation en français.
