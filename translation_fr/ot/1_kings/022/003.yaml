base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: fr
  text: 'Le roi d’Israël dit à ses serviteurs : « Savez-vous que Ramoth en Galaad nous appartient, alors que nous ne faisons rien[a] pour la prendre des mains du roi d’Aram[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « nous restons silencieux sans la prendre ». L’expression hébraïque évoque ici une inaction blâmable.'
    reason: lexical_alternative
  - marker: b
    text: Aram est le nom hébreu souvent rendu par « Syrie » dans des traductions plus anciennes.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme peut désigner des serviteurs ou des hauts fonctionnaires royaux. « Serviteurs » conserve l’expression hébraïque sans préciser outre mesure leur rang.
- source_word: הֲיְדַעְתֶּם
  choice: Savez-vous
  rationale: La forme interrogative introduit une question rhétorique fondée sur un savoir partagé; aucun élément négatif explicite ne justifie « Ne savez-vous pas ».
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: que Ramoth en Galaad nous appartient
  rationale: La construction avec לָנוּ exprime ici la possession ou la revendication territoriale. « Nous appartient » restitue clairement cette valeur en français naturel.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth en Galaad
  rationale: Cette forme française traditionnelle et intelligible rend le nom composé de la ville située en Galaad.
- source_word: מַחְשִׁים
  choice: nous ne faisons rien
  rationale: Le participe signifie littéralement demeurer silencieux, mais décrit ici une inaction blâmable. La formulation française exprime naturellement cette portée contextuelle, tandis qu’une note conserve l’image hébraïque.
- source_word: מִקַּחַת אֹתָהּ
  choice: pour la reprendre
  rationale: Le contexte indique que la ville revendiquée par Israël est sous le contrôle d’Aram. « Reprendre » rend naturellement l’action négligée sans ajouter l’idée plus violente de conquête ou de saisie.
- source_word: מִיַּד
  choice: des mains de
  rationale: Cette formulation conserve l’image hébraïque de la « main » comme expression de possession ou de pouvoir et demeure idiomatique en français.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom hébreu est translittéré plutôt que remplacé par l’appellation géopolitique plus tardive « Syrie ».
