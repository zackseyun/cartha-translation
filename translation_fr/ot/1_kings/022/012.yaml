source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: fr
  text: 'Et tous les prophètes prophétisaient de même : « Monte à Ramoth-en-Galaad et réussis[a] ! Yahweh la livrera entre les mains du roi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « remporte la victoire » ; autre traduction possible : « prospère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: Tous les prophètes
  rationale: Le collectif défini est rendu directement. En français, omettre ici le וְ initial donne un enchaînement narratif naturel sans perte de sens.
- source_word: נִבְּאִים
  choice: prophétisaient
  rationale: Le participe décrit une action en cours ou répétée dans la scène ; l’imparfait français en rend naturellement l’aspect.
- source_word: כֵּן
  choice: de même
  rationale: Cette expression indique que tous tenaient le même discours prophétique, tout en restant concise et naturelle.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Le deux-points introduit idiomatiquement en français le discours direct porté par « prophétisaient », sans calquer inutilement « en disant ».
- source_word: עֲלֵה
  choice: Monte
  rationale: Le sens premier de עלה est conservé ; le contexte militaire reste implicite comme en hébreu.
- source_word: רָמֹת גִּלְעָד
  choice: Ramoth-en-Galaad
  rationale: Forme française traditionnelle et intelligible du toponyme composé.
- source_word: וְ/הַצְלַח
  choice: et réussis
  rationale: Le hiphil impératif de צלח annonce une issue heureuse. « Réussis » est concis ; l’alternative « remporte la victoire » explicite davantage le contexte militaire.
- source_word: וְ/נָתַן
  choice: Yahweh la livrera
  rationale: Le qatal coordonné après les impératifs est compris comme une annonce assurée. « La » reprend naturellement la ville en français, et « livrer » convient à l’idiome de remise au pouvoir de quelqu’un.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin personnel est translittéré plutôt que remplacé par un titre.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: entre les mains du roi
  rationale: L’idiome hébreu désigne la mise au pouvoir du roi. Le pluriel « entre les mains » est la tournure française consacrée et demeure imagé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; la translittération préserve le nom propre sans le remplacer par un titre.
- issue: Objet implicite de וְנָתַן
  choice: la, renvoyant à Ramoth-en-Galaad
  alternative: cela, pouvant viser plus largement l’issue de la bataille
  rationale: Le féminin français permet de reprendre naturellement la ville nommée, tout en reconnaissant que l’objet n’est pas exprimé dans l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait restitue l’action en cours ; le discours direct reste bref et énergique. La coordination hébraïque finale est rendue par deux phrases successives, naturelles en français, sans introduire de lien causal absent du texte.
