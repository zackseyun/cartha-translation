base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: fr
  text: Josaphat se coucha avec ses ancêtres[a] et fut enterré avec ses ancêtres dans la cité de David, son père[b]. Son fils Joram devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « se coucha avec ses ancêtres » est une formule hébraïque habituelle pour parler de la mort.
    reason: lexical_alternative
  - marker: b
    text: Ici, « père » relève du langage généalogique hébreu et peut désigner un ancêtre.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: se coucha avec ses ancêtres
  rationale: La formule royale exprime la mort. « Se coucha » conserve l’image hébraïque, tandis que « ses ancêtres » rend le sens dynastique de אֲבֹתָיו dans un français actuel et évite que « ses pères » soit compris comme plusieurs pères immédiats.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: fut enterré avec eux
  rationale: Le passif rend naturellement le nifal. Le pronom « eux » évite une répétition lourde tout en renvoyant clairement aux ancêtres.
- source_word: בְּעִיר דָּוִד
  choice: dans la cité de David
  rationale: « Cité de David » est la désignation traditionnelle et précise de ce lieu; « cité » convient au registre historique et solennel du récit.
- source_word: אָבִיו
  choice: son père
  rationale: Le texte hébreu emploie littéralement « son père ». Ce choix préserve la formulation généalogique ancienne, dont le sens plus large est expliqué en note.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans ce contexte de succession, le verbe marque l’accession au trône plutôt que la durée entière du règne.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: L’expression indique que Joram succède à Josaphat dans la fonction royale, sans ajouter une nuance absente du texte.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La tournure funéraire imagée de l’hébreu est conservée, tandis que « ancêtres » clarifie la portée dynastique. Le nom יְהוֹרָם est rendu par la forme française usuelle « Joram ».
