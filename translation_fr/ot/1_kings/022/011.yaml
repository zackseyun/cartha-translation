  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥ה בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלֹּתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: fr
  text: 'Alors Sédécias, fils de Kenaana, se fit des cornes de fer et dit : « Ainsi parle le SEIGNEUR : Avec ces cornes, tu encorneras les Araméens jusqu’à les exterminer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: des cornes de fer
  rationale: Rend directement l’image symbolique concrète du texte hébreu.
- source_word: תְּנַגַּח
  choice: tu frapperas
  rationale: Le verbe évoque littéralement l’action de donner des coups de corne; « frapper » reste naturel en français tout en étant explicité par « avec ces cornes ».
- source_word: אֲרָם
  choice: les Araméens
  rationale: Dans ce contexte militaire, le nom du pays désigne collectivement ses combattants ou son peuple; cette métonymie est rendue naturellement en français.
- source_word: עַד כַּלֹּתָם
  choice: jusqu’à les exterminer
  rationale: Exprime l’achèvement destructeur indiqué par כלה avec le suffixe objet pluriel, sans affaiblir la violence de l’oracle.
- source_word: כֹּה אָמַר יְהוָה
  choice: Voici ce que dit le SEIGNEUR
  rationale: Formule prophétique idiomatique et solennelle; « le SEIGNEUR » représente le tétragramme.
theological_decisions:
- issue: Statut de la parole attribuée au SEIGNEUR
  choice: Conserver sans commentaire la formule « Voici ce que dit le SEIGNEUR » dans la bouche de Sédécias
  alternative: Signaler dans le verset qu’il s’agit d’une fausse prophétie
  rationale: Le verset rapporte la revendication prophétique de Sédécias; son évaluation ressort du contexte narratif et ne doit pas être ajoutée à la traduction.
translation_notes:
  register: Français moderne, clair et digne. La tournure « se fit » conserve la valeur bénéficiaire de לֹו. « Kenaana » suit une translittération française simple du nom hébreu.
