  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּכֶּה֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לְ/רַכָּב֗/וֹ הֲפֹ֥ךְ יָדְ/ךָ֛ וְ/הוֹצִיאֵ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: fr
  text: 'Mais un homme tira de l’arc au hasard[a] et atteignit le roi d’Israël entre les pièces de son armure et sa cuirasse[b]. Le roi dit alors à son conducteur de char : « Fais demi-tour[c] et retire-moi du camp, car je suis blessé[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi signifier « sans viser », « innocemment » ou « dans sa simplicité » ; ici, elle indique probablement que l’archer ne visait aucune personne en particulier.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « entre les debaqim et la cuirasse ». Le premier terme désigne probablement des pièces jointes ou fixées de l’armure, mais le sens technique exact des deux termes reste incertain.
    reason: cultural_note
  - marker: c
    text: Littéralement « Tourne ta main », expression qui demande au conducteur de manœuvrer le char.
    reason: lexical_alternative
  - marker: d
    text: Le verbe hébreu peut signifier « être malade », « être affaibli » ou « être blessé » ; dans ce contexte, il s’agit d’une blessure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Mais un homme
  rationale: Le waw introduit ici un retournement narratif, tandis que אִישׁ désigne simplement un homme non identifié.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: tira de l’arc
  rationale: Expression française naturelle pour l’action de bander l’arc et de décocher une flèche dans ce contexte.
- source_word: לְתֻמּוֹ
  choice: au hasard
  rationale: Dans ce contexte militaire, l’expression indique vraisemblablement que l’archer ne visait personne en particulier; une note conserve les autres nuances possibles.
- source_word: וַיַּכֶּה
  choice: atteignit
  rationale: נכה signifie ici frapper ou toucher; « atteignit » convient naturellement à une flèche sans anticiper la déclaration explicite de la blessure.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: entre les pièces de son armure et sa cuirasse
  rationale: Les termes techniques relatifs à l’armure sont incertains. Cette formulation évoque clairement une ouverture entre deux éléments protecteurs sans imposer une identification trop précise.
- source_word: לְרַכָּבוֹ
  choice: à son conducteur de char
  rationale: Le mot désigne ici l’homme qui dirige le char; cette expression est claire en français moderne.
- source_word: הֲפֹךְ יָדְךָ
  choice: Fais demi-tour
  rationale: Littéralement « tourne ta main »; il s’agit d’un ordre idiomatique demandant au conducteur de manœuvrer le char.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: emmène-moi hors du combat
  rationale: מַחֲנֶה peut désigner le camp ou l’armée en campagne; dans la scène, le roi demande à être retiré de la zone de combat.
- source_word: כִּי הָחֳלֵיתִי
  choice: car je suis blessé
  rationale: Le verbe peut exprimer la maladie, l’affaiblissement ou la blessure; le coup de flèche rend ici « blessé » contextuellement certain, sans ajouter un degré de gravité absent du texte.
