source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: fr
  text: 'Il dit : « J’ai vu tout Israël dispersé sur les montagnes, comme des brebis sans berger. Et Yahweh a dit : “Ils n’ont pas de maître[a] ; que chaque homme retourne chez lui en paix.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils n’ont pas de maîtres. » Le nom hébreu est au pluriel ; dans ce contexte, il désigne l’autorité dirigeante dont Israël est privé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: dispersé
  rationale: Le participe de פוץ décrit Israël répandu en divers endroits. « Dispersé » est naturel en français et conserve l’image d’une armée désorganisée et privée de chef.
- source_word: אֶל הֶהָרִים
  choice: sur les montagnes
  rationale: Bien que אֶל exprime souvent un mouvement vers un lieu, la construction décrit ici la répartition spatiale d’Israël ; « sur les montagnes » rend clairement la scène de la vision.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: comme des brebis sans berger
  rationale: Cette formulation concise conserve la comparaison pastorale et l’absence de berger exprimée par אֵין.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: אֲדֹנִים
  choice: maître
  rationale: Le nom hébreu est morphologiquement pluriel, mais le contexte vise l’autorité dirigeante dont Israël sera privé, immédiatement le roi. Le singulier « maître » est idiomatique en français, tandis qu’une note préserve la forme plurielle de l’hébreu.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: que chaque homme retourne chez lui
  rationale: L’imparfait a ici une valeur jussive. « Que… retourne » rend cette directive, « chaque homme » reflète le distributif masculin אִישׁ, et « chez lui » exprime naturellement לְבֵיתוֹ.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: « En paix » est l’équivalent français direct de l’expression hébraïque et en conserve la portée, y compris dans ce contexte de défaite annoncée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Nombre et portée de אֲדֹנִים
  choice: Ils n’ont pas de maître
  alternative: Ils n’ont pas de maîtres ; ils n’ont pas de chef
  rationale: La forme hébraïque est plurielle, mais le contexte évoque la disparition du roi comme autorité à la tête de l’armée. « Maître » reste proche du lexique sans expliciter davantage que le texte ; la note signale le pluriel formel.
- issue: Distributif masculin אִישׁ
  choice: chaque homme
  alternative: chacun
  rationale: Le choix conserve le nom masculin singulier employé dans la source, sans neutraliser sa formulation distributive.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe du discours prophétique est conservée. « Tout Israël » maintient l’expression collective de l’hébreu, et « comme des brebis sans berger » rend l’image avec naturel sans en réduire la tension politique et théologique.
