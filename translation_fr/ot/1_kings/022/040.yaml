  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: fr
  text: Achab se coucha avec ses pères[a], et son fils Ochozias devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement: «se coucha avec ses pères»; formule royale habituelle signifiant qu’il mourut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Conserve l’image de l’hébreu et le caractère formulaire de l’avis royal de décès; dans cette expression, le verbe indique la mort.
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Reproduit l’expression royale hébraïque traditionnelle et sa portée dynastique. «Avec ses ancêtres» serait plus explicite, mais moins proche de la formulation source.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Exprime clairement l’accession au trône, plutôt que la durée du règne.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Rend la succession à la même fonction et reste naturel en français.
- source_word: אַחְאָב
  choice: Achab
  rationale: Forme française biblique usuelle du nom propre.
- source_word: אֲחַזְיָהוּ
  choice: Ochozias
  rationale: Forme française biblique usuelle du nom propre.
- source_word: בְנוֹ
  choice: son fils
  rationale: Conserve explicitement la relation filiale qui structure l’avis de succession dynastique.
