  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: fr
  text: Le roi d’Israël et Josaphat, roi de Juda, étaient assis chacun sur son trône, vêtus d’habits[a], sur l’aire de battage, à l’entrée de la porte de Samarie. Tous les prophètes prophétisaient devant eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vêtus de vêtements ». L’hébreu ne précise pas qu’il s’agissait d’habits royaux, même si le cadre peut suggérer une tenue d’apparat.'
    reason: Précision lexicale et maintien de la distinction entre ce que dit explicitement le texte et ce que suggère le contexte.
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Le roi d’Israël
  rationale: Le ו initial relie la scène au contexte, mais le français n’exige pas ici de connecteur explicite en tête de phrase.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: et Josaphat, roi de Juda
  rationale: Le nom et son titre apposé sont rendus directement, dans une formulation française naturelle.
- source_word: יֹשְׁבִים
  choice: étaient assis
  rationale: Le participe décrit la posture continue des deux rois dans cette scène.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: chacun sur son trône
  rationale: אִישׁ a ici une valeur distributive, et le contexte royal justifie « trône » plutôt que le terme générique « siège ».
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: revêtus de leurs habits[a]
  rationale: Cette formulation reste proche de l’expression hébraïque sans ajouter l’adjectif « royaux », absent du texte; la note signale le caractère littéral et la possible portée cérémonielle du contexte.
- source_word: בְּגֹרֶן
  choice: sur l’aire de battage
  rationale: גֹּרֶן désigne l’aire où l’on battait les céréales; « sur » est la préposition française idiomatique pour ce lieu.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: à l’entrée de la porte de Samarie
  rationale: La traduction conserve la chaîne de détermination de l’hébreu sans la remplacer par une paraphrase urbaine.
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים לִפְנֵיהֶם
  choice: Tous les prophètes prophétisaient devant eux
  rationale: L’imparfait restitue l’action en cours des prophètes, et « devant eux » convient à la scène d’audience royale.
