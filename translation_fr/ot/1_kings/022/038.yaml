  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: fr
  text: On lava le char au bassin de Samarie, et les chiens léchèrent son sang; les prostituées s’y lavèrent[a], conformément à la parole que Yahweh avait prononcée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’y baignèrent ». L’hébreu ne précise pas l’objet du verbe « laver »; il peut aussi se comprendre sans valeur réfléchie explicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף אֶת־הָרֶכֶב
  choice: On lava le char
  rationale: Le verbe est formellement à la 3e personne du masculin singulier, mais son agent n’est pas nommé. Le pronom indéfini « on » rend naturellement cet emploi impersonnel en français sans inventer d’acteur.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: au bassin de Samarie
  rationale: Dans ce contexte, עַל indique le lieu où le char est lavé. « Au bassin » est une formulation française naturelle qui n’impose pas le sens littéral « sur ».
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת־דָּמוֹ
  choice: les chiens léchèrent son sang
  rationale: Traduction directe de l’action et du suffixe possessif renvoyant à Achab; « léchèrent » conserve l’image concrète sans ajout.
- source_word: וְהַזֹּנוֹת
  choice: les prostituées
  rationale: Terme moderne et exact pour désigner les femmes nommées par זֹנוֹת, sans recourir à un mot vieilli ou euphémistique.
- source_word: רָחָצוּ
  choice: s’y lavèrent
  rationale: Le verbe signifie laver ou se laver, mais l’hébreu n’exprime aucun complément d’objet. Le français exige ici une formulation plus explicite; « s’y lavèrent » demeure naturelle, tandis qu’une note signale l’ambiguïté de la construction.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: conformément à la parole que Yahweh avait prononcée
  rationale: Cette formulation conserve la déclaration d’accomplissement prophétique et rend l’antériorité de la parole divine par le plus-que-parfait.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » représente le nom propre divin plutôt qu’un titre de substitution.
- issue: Interprétation de וְהַזֹּנוֹת רָחָצוּ
  choice: les prostituées s’y lavèrent
  alternative: les prostituées s’y baignèrent; ou les prostituées lavèrent quelque chose qui n’est pas précisé
  rationale: Les prostituées sont grammaticalement le sujet, mais le verbe ne précise pas ce qui est lavé. Le texte principal reste idiomatique en français et la note préserve l’incertitude au lieu de la masquer.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au récit historique; le pronom indéfini « on » évite d’identifier un agent que l’hébreu ne nomme pas. La ponctuation distingue les trois actions tout en maintenant leur enchaînement.
