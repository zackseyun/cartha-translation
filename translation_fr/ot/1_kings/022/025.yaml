  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּבֹ֛א חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/025.yaml
  text: And Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide.”
translation:
  language: fr
  text: 'Michée dit : « Tu verras bien, ce jour-là, quand tu iras de pièce en pièce pour te cacher[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la pièce la plus retirée ». L’hébreu répète littéralement le mot « pièce » et peut évoquer un déplacement de pièce en pièce ou un repli vers l’intérieur pour se cacher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple suffit naturellement, sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: מִיכָיְהוּ
  choice: Michée
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: הִנְּךָ רֹאֶה
  choice: Tu verras bien
  rationale: הִנְּךָ attire fortement l’attention et, avec le participe puis la référence future « ce jour-là », donne une annonce prédictive. « Tu verras bien » en restitue la pointe directe et menaçante en français courant.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle idiomatique en français moderne.
- source_word: אֲשֶׁר תָּבֹא
  choice: quand tu iras
  rationale: La proposition relative décrit ici la circonstance temporelle. בוא exprime le déplacement vers les pièces où l’homme cherchera refuge.
- source_word: חֶדֶר בְּחֶדֶר
  choice: de pièce en pièce
  rationale: La répétition de חֶדֶר suggère un déplacement entre des pièces ou un retrait toujours plus intérieur. Cette formulation préserve la répétition sans imposer une seule interprétation spatiale.
- source_word: לְהֵחָבֵה
  choice: pour te cacher
  rationale: L’infinitif indique le but; le pronom réfléchi rend explicitement et naturellement en français le fait que le sujet cherche à se dissimuler.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. « Tu verras bien » conserve la force de l’interpellation sans recourir à l’archaïsant « voici ». Le marqueur de note est placé après l’expression qu’il éclaire.
