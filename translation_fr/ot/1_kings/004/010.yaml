lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: Ben-Hésed
  rationale: Dans cette liste administrative, l’expression fonctionne vraisemblablement comme un nom propre. La translittération conserve toutefois l’ambiguïté signalée en note avec le sens formel « fils de Hésed ».
- source_word: בָּאֲרֻבּוֹת
  choice: à Aroubboth
  rationale: La préposition ב est locative. « À » convient naturellement en français devant le nom d’une localité, lequel est translittéré.
- source_word: לוֹ
  choice: il avait
  rationale: La construction pronominale indique ici le territoire confié à cet administrateur. Cette formulation française est naturelle tout en restant concise.
- source_word: שֹׂכֹה
  choice: Soko
  rationale: Le nom de lieu est translittéré directement depuis l’hébreu.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: et tout le pays de Hépher
  rationale: אֶרֶץ désigne ici un pays ou territoire, et כָל est conservé par « tout ».
