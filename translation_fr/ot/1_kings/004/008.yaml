  text: 'And these were their names: Ben-hur[a], in the hill country of Ephraim;'
translation:
  language: fr
  text: 'Et voici leurs noms : Ben-Hur[a], dans la région montagneuse d’Éphraïm ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils de Hur », si l’expression est comprise comme un patronyme plutôt que comme un nom propre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Cette tournure française introduit naturellement une liste tout en rendant la valeur présentative de la conjonction et du démonstratif hébreux.
- source_word: שְׁמוֹתָם
  choice: leurs noms
  rationale: L’hébreu est une proposition nominale, sans verbe exprimé. « Voici leurs noms » la rend naturellement en français sans imposer inutilement un temps verbal.
- source_word: בֶּן חוּר
  choice: Ben-Hour
  rationale: Dans cette liste de responsables territoriaux, l’expression peut fonctionner comme un nom propre. La translittération conserve cette lecture, tandis qu’une note signale l’analyse patronymique possible.
- source_word: בְּהַר אֶפְרָיִם
  choice: dans la région montagneuse d’Éphraïm
  rationale: Dans cette expression territoriale, הַר désigne vraisemblablement les hauteurs ou la région montagneuse d’Éphraïm, plutôt qu’une montagne unique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation présentative est idiomatique, et la ponctuation finale conserve le lien avec la suite de la liste.
