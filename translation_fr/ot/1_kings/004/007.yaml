  text: וְ/לִ/שְׁלֹמֹ֞ה שְׁנֵים עָשָׂ֤ר נִצָּבִים֙ עַל כָּל יִשְׂרָאֵ֔ל וְ/כִלְכְּל֥וּ אֶת הַ/מֶּ֖לֶךְ וְ/אֶת בֵּית֑/וֹ חֹ֧דֶשׁ בַּ/שָּׁנָ֛ה יִהְיֶ֥ה עַל אחד לְ/כַלְכֵּֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: fr
  text: Salomon avait douze administrateurs[a] responsables de l’ensemble d’Israël. Ils pourvoyaient aux besoins du roi et de sa maison ; chacun devait le faire pendant un mois de l’année.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « responsables », « fonctionnaires » ou « gouverneurs ». Le terme hébreu désigne de manière générale des personnes établies dans une fonction administrative.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: Salomon avait
  rationale: Le ל préfixé marque ici la possession ou l’attribution ; « Salomon avait » l’exprime naturellement en français. Le ו de liaison narrative n’a pas besoin d’être rendu isolément hors contexte.
- source_word: שְׁנֵים עָשָׂר
  choice: douze
  rationale: Nombre cardinal sans difficulté particulière.
- source_word: נִצָּבִים
  choice: administrateurs
  rationale: Le terme désigne largement des hommes établis ou nommés à une fonction. « Administrateurs » convient à leur mission royale sans les définir trop précisément comme gouverneurs.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: chargés de tout Israël
  rationale: עַל indique ici le domaine sur lequel porte leur charge. Cette formulation française exprime leur responsabilité administrative sans exagérer leur autorité politique.
- source_word: וְכִלְכְּלוּ
  choice: Ils approvisionnaient
  rationale: Dans ce contexte de service royal, כלכל signifie fournir les vivres et ressources nécessaires. « Approvisionnaient » rend clairement cette fonction concrète.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: le roi et sa maison
  rationale: « Maison » conserve la portée de בַּיִת, qui peut englober la maisonnée et l’ensemble de la cour royale, plutôt que le seul bâtiment.
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: pendant un mois de l’année
  rationale: La formule indique la durée annuelle de service assignée à chacun des douze administrateurs.
- source_word: יִהְיֶה עַל אֶחָד
  choice: chacun devait assurer
  rationale: Littéralement, la tâche « était sur un » à tour de rôle. « Chacun devait » rend naturellement cette répartition distributive.
- source_word: לְכַלְכֵּל
  choice: assurer l’approvisionnement
  rationale: L’infinitif reprend le même verbe que וְכִלְכְּלוּ ; cette formulation évite une répétition maladroite tout en conservant le sens logistique.
