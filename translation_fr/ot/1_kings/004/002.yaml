  text: וְ/אֵ֥לֶּה הַ/שָּׂרִ֖ים אֲשֶׁר ל֑/וֹ עֲזַרְיָ֥הוּ בֶן צָד֖וֹק הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/002.yaml
  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: fr
  text: 'Et voici les hauts fonctionnaires qui étaient à son service : Azaria, fils de Sadoc, le prêtre[a] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte : « Azaria, fils de Sadoc, le prêtre. » « Le prêtre » peut désigner Sadoc ou être le titre d’Azaria. Le texte ne dit pas explicitement « le grand prêtre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La conjonction et le démonstratif introduisent une liste. « Voici » remplit naturellement cette fonction en français, sans alourdir la liaison narrative.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: שׂרים désigne ici les principaux responsables de l’administration royale. « Hauts fonctionnaires » exprime leur rang sans suggérer une noblesse héréditaire comme pourrait le faire « princes ».
- source_word: אֲשֶׁר לוֹ
  choice: qu’il avait à son service
  rationale: La tournure avec לֹו marque l’appartenance à l’administration de Salomon. Cette formulation française explicite naturellement la relation administrative sans préciser indûment leurs fonctions.
- source_word: עֲזַרְיָהוּ
  choice: Azaria
  rationale: Forme française biblique usuelle du nom propre.
- source_word: בֶן צָדוֹק
  choice: fils de Sadoc
  rationale: Rendu direct et idiomatique de la relation filiale ; « Sadoc » est la forme française biblique usuelle.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: L’hébreu dit simplement « le prêtre » et non « le grand prêtre » ; le rendu conserve cette précision et l’ambiguïté du rattachement syntaxique.
theological_decisions:
- issue: Référent et portée de « le prêtre »
  choice: Conserver « Azaria, fils de Sadoc, le prêtre » dans le texte et signaler l’ambiguïté en note.
  alternative: « Azaria, fils du prêtre Sadoc » ou « Azaria, fils de Sadoc, [était] prêtre »
  rationale: La construction hébraïque ne permet pas d’établir avec certitude si « le prêtre » désigne Sadoc ou donne le titre d’Azaria. Elle ne dit pas explicitement « grand prêtre ». La traduction ne tranche donc pas silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. « Hauts fonctionnaires » convient au cadre administratif royal ; « qu’il avait à son service » évite le calque peu naturel « qui étaient à lui ». Le marqueur [a] figure dans le texte.
