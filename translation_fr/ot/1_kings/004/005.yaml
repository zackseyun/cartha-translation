  text: וַ/עֲזַרְיָ֥הוּ בֶן נָתָ֖ן עַל הַ/נִּצָּבִ֑ים וְ/זָב֧וּד בֶּן נָתָ֛ן כֹּהֵ֖ן רֵעֶ֥ה הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: fr
  text: Azariahou, fils de Nathan, était responsable des gouverneurs. Zaboud, fils de Nathan, était prêtre[a] et ami du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « haut fonctionnaire » ou « conseiller royal » dans ce contexte de cour.
    reason: Alternative lexicale liée à l’emploi possible de כֹּהֵן pour une haute fonction auprès du roi.
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: Azariahou
  rationale: Translittération française qui conserve la finale hébraïque -yahou du nom.
- source_word: בֶן נָתָן
  choice: fils de Nathan
  rationale: Formulation généalogique et relationnelle normale en français.
- source_word: עַל הַנִּצָּבִים
  choice: était responsable des gouverneurs
  rationale: Dans cette liste administrative, עַל exprime l’autorité ou la supervision, et הַנִּצָּבִים désigne des fonctionnaires nommés chargés de circonscriptions ou de fonctions. Cette formulation est claire sans préciser davantage leur statut.
- source_word: זָבוּד
  choice: Zaboud
  rationale: Translittération adaptée aux conventions phonétiques françaises.
- source_word: כֹּהֵן
  choice: prêtre
  rationale: Le sens lexical ordinaire est « prêtre ». Le contexte de cour permet éventuellement d’y voir un haut dignitaire, possibilité signalée en note plutôt qu’intégrée au texte.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: ami du roi
  rationale: Traduction directe et naturelle de l’expression, qui peut aussi désigner un proche confident royal.
theological_decisions:
- issue: Sens de כֹּהֵן dans un contexte administratif royal
  choice: prêtre dans le texte principal, avec en note la possibilité d’un haut dignitaire de la cour
  alternative: haut fonctionnaire ou conseiller royal
  rationale: Le sens premier du terme doit être conservé, tandis que l’ambiguïté liée au contexte de cour mérite d’être rendue visible sans être tranchée dans la traduction.
translation_notes:
  register: Français international moderne, sobre et digne. « Était responsable de » rend naturellement la relation hiérarchique; les deux fonctions de Zaboud sont coordonnées comme dans l’hébreu. Le marqueur [a] est placé après « prêtre », le mot auquel la note se rapporte.
