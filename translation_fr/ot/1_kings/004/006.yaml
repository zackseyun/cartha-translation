  text: וַ/אֲחִישָׁ֖ר עַל הַ/בָּ֑יִת וַ/אֲדֹנִירָ֥ם בֶּן עַבְדָּ֖א עַל הַ/מַּֽס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/006.yaml
  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: fr
  text: Ahishar était responsable de la maison royale[a], et Adoniram, fils d’Abda, était responsable des travaux forcés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement «était sur la maison». Il s’agit d’un titre de cour désignant la responsabilité de la maison ou de l’administration royale. Autre traduction possible: «était responsable du palais».'
    reason: lexical_alternative
  - marker: b
    text: Ou «de la corvée». Le terme hébreu désigne une prestation de travail obligatoire imposée par l’État.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: Ahishar
  rationale: Nom propre translittéré selon l’usage courant; la coordination וַ est rendue naturellement par la structure française de la phrase.
- source_word: עַל הַבָּיִת
  choice: était responsable de la maison royale
  rationale: Dans cette liste administrative, עַל marque une fonction d’autorité. Littéralement «sur la maison», l’expression désigne ici la gestion de la maison ou de l’administration royale; «maison royale» conserve cette portée institutionnelle sans la réduire au seul bâtiment.
- source_word: וַאֲדֹנִירָם
  choice: et Adoniram
  rationale: Nom propre translittéré; le וַ préfixé est rendu par «et».
- source_word: בֶּן עַבְדָּא
  choice: fils d’Abda
  rationale: Formule patronymique hébraïque rendue par son équivalent français usuel.
- source_word: עַל הַמַּס
  choice: était responsable des travaux forcés
  rationale: מַס désigne ici la prestation de travail obligatoire imposée par l’État, plutôt qu’un simple impôt. «Travaux forcés» est clair en français moderne, tandis que «corvée» serait plus technique et pourrait évoquer un cadre historique français trop précis.
theological_decisions: []
