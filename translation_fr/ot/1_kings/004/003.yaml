  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: fr
  text: Élihoreph et Ahija, fils de Shisha[a], étaient secrétaires[b] ; Josaphat, fils d’Ahiloud, était l’archiviste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le passage parallèle de 1 Chroniques 18.16, le nom apparaît sous une forme apparentée, souvent transcrite « Shavsha » ou « Shawsha ».
    reason: alternative_reading
  - marker: b
    text: Ou « scribes » ; le terme hébreu désigne ici des fonctionnaires royaux chargés de l’écriture et de la documentation.
    reason: lexical_alternative
  - marker: c
    text: Ou « responsable des annales » ; le terme hébreu désigne un fonctionnaire de la cour qui conservait les dossiers et portait certaines affaires à l’attention du roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: Élihoreph
  rationale: Nom propre transcrit selon les usages français, avec accent initial pour guider naturellement la prononciation.
- source_word: וַאֲחִיָּה
  choice: et Ahiya
  rationale: Le préfixe conjonctif est rendu par « et » ; le nom est transcrit sous une forme française claire et proche de l’hébreu.
- source_word: בְּנֵי שִׁישָׁא
  choice: fils de Shisha
  rationale: Rend directement la filiation et suit la forme du nom propre attestée dans ce verset du texte massorétique, sans l’harmoniser avec le passage parallèle.
- source_word: סֹפְרִים
  choice: secrétaires
  rationale: Dans cette liste administrative, le terme désigne des fonctionnaires royaux chargés de travaux d’écriture et de documents. « Secrétaires » exprime clairement cette fonction tout en la distinguant de celle mentionnée ensuite.
- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et largement reconnaissable de ce nom propre biblique.
- source_word: בֶּן אֲחִילוּד
  choice: fils d’Ahiloud
  rationale: Rendu naturel de la désignation patronymique ; le nom propre est transcrit selon l’usage français.
- source_word: הַמַּזְכִּיר
  choice: l’archiviste
  rationale: Titre d’un haut fonctionnaire de cour chargé de conserver ou rappeler les affaires et de les porter à l’attention du roi. « Archiviste » est intelligible en français moderne et distingue cette charge de celle des secrétaires.
