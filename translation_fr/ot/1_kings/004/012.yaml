  text: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד תַּעְנַ֖ךְ וּ/מְגִדּ֑וֹ וְ/כָל בֵּ֣ית שְׁאָ֡ן אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָ/ה מִ/תַּ֣חַת לְ/יִזְרְעֶ֗אל מִ/בֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה עַ֖ד מֵ/עֵ֥בֶר לְ/יָקְמֳעָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: fr
  text: 'Baana, fils d’Ahiloud : Taanak et Meguiddo, ainsi que tout Beth-Shéan, qui est près de Tsartân, au-dessous de Jizréel, depuis Beth-Shéan jusqu’à Abel-Mehola, et jusqu’au-delà de Yoqmeam[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à la région située de l’autre côté de Yoqmeam ». L’expression hébraïque qui délimite le territoire est concise et quelque peu difficile.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: Baana, fils d’Ahiloud
  rationale: Les noms de personnes sont translittérés selon des formes françaises claires et usuelles; la virgule convient à la structure d’une liste administrative.
- source_word: תַּעְנַ֖ךְ וּמְגִדּ֑וֹ
  choice: Taanak et Meguiddo
  rationale: Les deux toponymes sont translittérés selon des conventions françaises courantes, en conservant leur coordination simple.
- source_word: וְכָל בֵּ֣ית שְׁאָ֡ן
  choice: ainsi que tout Beth-Shéan
  rationale: כָל appliqué ici au toponyme peut viser l’ensemble de la localité ou de son territoire; « tout Beth-Shéan » garde cette concision et cette portée territoriale sans ajouter explicitement « région ».
- source_word: אֲשֶׁר֩ אֵ֨צֶל צָרְתַ֜נָה
  choice: qui est près de Tsartân
  rationale: אֵצֶל exprime la proximité spatiale. « Près de » est naturel en français sans préciser indûment la distance.
- source_word: מִתַּ֣חַת לְיִזְרְעֶ֗אל
  choice: au-dessous de Jizréel
  rationale: La formulation conserve l’indication topographique d’une position plus basse, plutôt que de l’interpréter comme une orientation cardinale.
- source_word: מִבֵּ֤ית שְׁאָן֙ עַ֚ד אָבֵ֣ל מְחוֹלָ֔ה
  choice: depuis Beth-Shéan jusqu’à Abel-Mehola
  rationale: Cette tournure française rend directement les deux limites géographiques introduites par מִן et עַד.
- source_word: עַ֖ד מֵעֵ֥בֶר לְיָקְמֳעָֽם
  choice: et jusqu’au-delà de Yoqmeam
  rationale: La formulation maintient la concision et la difficulté de l’expression frontalière hébraïque, où מֵעֵבֶר évoque l’autre côté ou l’au-delà d’un lieu. Une lecture géographique plus explicite est donnée en note.
