id: 1KI.4.4
reference: 1 Kings 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְנָיָ֥הוּ בֶן יְהוֹיָדָ֖ע עַל הַ/צָּבָ֑א וְ/צָד֥וֹק וְ/אֶבְיָתָ֖ר כֹּהֲנִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: fr
  text: Benaya, fils de Yehoyada, commandait l’armée, et Sadok et Abiatar étaient prêtres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, si כֹּהֲנִים est pris ici dans un sens administratif plus large : « hauts fonctionnaires » ou « principaux dignitaires ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: commandait l’armée
  rationale: La construction עַל avec un domaine de responsabilité exprime ici l’autorité ou la direction. « Commandait l’armée » est naturel en français et rend la fonction sans imposer un titre militaire précis.
- source_word: הַצָּבָא
  choice: l’armée
  rationale: Dans ce contexte, צָבָא désigne les forces militaires organisées; « l’armée » est l’équivalent moderne le plus clair.
- source_word: כֹּהֲנִים
  choice: prêtres
  rationale: Le sens ordinaire de כֹּהֲנִים est « prêtres », et Sadok comme Abiatar sont connus ailleurs comme figures sacerdotales. Le contexte administratif ne suffit pas à écarter ce sens premier.
- source_word: בְנָיָהוּ
  choice: Benaya
  rationale: Translittération française moderne du nom hébreu.
- source_word: יְהוֹיָדָע
  choice: Yehoyada
  rationale: Translittération française moderne qui reflète la forme hébraïque du nom.
- source_word: צָדוֹק
  choice: Sadok
  rationale: Forme française courante du nom biblique.
- source_word: אֶבְיָתָר
  choice: Abiatar
  rationale: Forme française courante du nom biblique.
theological_decisions:
- issue: Faut-il donner à כֹּהֲנִים un sens non cultuel, tel que « hauts fonctionnaires », en raison du contexte de la liste administrative royale ?
  choice: prêtres
  alternative: hauts fonctionnaires ou principaux dignitaires
  rationale: Le sens premier du terme hébreu est « prêtres », et les deux hommes sont explicitement associés au sacerdoce ailleurs. La traduction principale conserve donc ce sens, tandis qu’une note signale l’interprétation administrative possible sans la privilégier.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation concise respecte la structure de la liste de responsables. « Commandait l’armée » est plus idiomatique que « était sur l’armée », tout en préservant l’idée d’autorité. La note maintient l’ambiguïté lexicale proposée sans affaiblir le sens sacerdotal le mieux attesté.
