- source_word: יְהוֹשָׁפָט
  choice: Josaphat
  rationale: Forme française traditionnelle et encore reconnaissable du nom propre hébreu Yehoshaphat.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement le marqueur patronymique hébreu dans cette liste administrative.
- source_word: פָּרוּחַ
  choice: Parouah
  rationale: Translittération française naturelle du nom propre hébreu, avec « ou » pour la voyelle /u/ et « h » final pour la consonne gutturale.
- source_word: בְּ/יִשָׂשכָר
  choice: dans le territoire d’Issacar
  rationale: La préposition בְ indique littéralement la localisation (« dans »). L’ajout de « le territoire de » rend explicite, sans surinterprétation, que la tribu d’Issacar désigne ici le district confié à cet administrateur.
