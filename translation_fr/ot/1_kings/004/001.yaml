  text: King Solomon was king over all Israel.
translation:
  language: fr
  text: Le roi Salomon était roi de tout Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: était
  rationale: La forme narrative de היה introduit ici l’état décrit et ouvre une nouvelle section. En français naturel, l’imparfait « était » porte la prédication sans ajouter un marqueur temporel absent du texte.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini est en apposition au nom propre. En français, le titre employé ainsi se rend naturellement par « le roi Salomon ».
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: מֶלֶךְ
  choice: roi
  rationale: La seconde occurrence est prédicative. « Était roi » conserve la structure nominale et la répétition du mot hébreu plutôt que de la remplacer par le verbe « régnait ».
- source_word: עַל
  choice: sur
  rationale: Dans un contexte d’autorité royale, עַל indique l’exercice de l’autorité sur un peuple; « sur » est l’équivalent français naturel.
- source_word: כָּל
  choice: tout
  rationale: Le quantificateur exprime ici la totalité d’Israël.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française standard du nom national.
theological_decisions:
- issue: Rendu de la double occurrence de מֶלֶךְ
  choice: 'Conserver les deux occurrences : « Le roi Salomon était roi sur tout Israël. »'
  alternative: « Salomon était roi sur tout Israël » ou « Le roi Salomon régnait sur tout Israël »
  rationale: L’hébreu emploie d’abord מֶלֶךְ comme titre, puis comme prédicat. Garder la répétition préserve l’insistance du texte sur l’autorité royale de Salomon à l’égard de tout Israël, sans ajouter d’interprétation.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « roi » est volontaire afin de refléter celle de l’hébreu, même si une formulation française plus lissée pourrait employer « régnait ».
