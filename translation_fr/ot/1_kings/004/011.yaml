lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: Ben-Abinadab
  rationale: Le nom est translittéré de manière transparente; «Ben» fait ici partie de la désignation propre plutôt que d’être traduit par «fils de».
- source_word: כָּל נָפַת דֹּאר
  choice: toute la région de Dor
  rationale: נָפָה désigne ici un territoire ou district administratif. «Région» est naturel en français et convient mieux au contexte que le sens étymologique possible de «hauteur».
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: était sa femme
  rationale: Cette formulation française directe rend fidèlement l’expression hébraïque «elle était pour lui comme femme/épouse».
