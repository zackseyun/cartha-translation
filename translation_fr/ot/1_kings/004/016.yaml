- source_word: בְּ/אָשֵׁר
  choice: en Asher
  rationale: La préposition בְּ situe ici le ressort territorial de l’administrateur; «en» reste proche de l’hébreu sans expliciter davantage la fonction administrative.
- source_word: וּ/בְעָלֽוֹת
  choice: et à Bealoth
  rationale: Le terme est compris comme le toponyme Bealoth. En français, la préposition «à» est ajoutée pour rendre naturellement l’association d’un responsable à une localité, tout en conservant la coordination concise.
