  text: אֲחִימַ֖עַץ בְּ/נַפְתָּלִ֑י גַּם ה֗וּא לָקַ֛ח אֶת בָּשְׂמַ֥ת בַּת שְׁלֹמֹ֖ה לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/015.yaml
  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: fr
  text: Ahimaats[a], en Nephtali ; lui aussi épousa Basemath, fille de Salomon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chargé de Nephtali » ou « pour Nephtali » ; la préposition hébraïque peut désigner le territoire confié à Ahimaats dans cette liste d’intendants de district.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « prit Basemath, fille de Salomon, pour femme », expression hébraïque courante signifiant qu’il l’épousa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: Ahimaats
  rationale: Nom propre transcrit selon une forme française usuelle, qui représente le son consonantique final צ par « ts ».
- source_word: בְּנַפְתָּלִי
  choice: en Nephtali
  rationale: Dans cette liste administrative, la préposition בְ suivie du nom tribal ou territorial désigne vraisemblablement le ressort de l'intendant. « En Nephtali » conserve naturellement la valeur locative sans préciser davantage la fonction.
- source_word: גַּם הוּא
  choice: lui aussi
  rationale: Cette formulation française naturelle maintient l'insistance additive de l'hébreu.
- source_word: לָקַח ... לְאִשָּׁה
  choice: épousa
  rationale: Littéralement « prit ... pour femme » ; il s'agit d'une tournure hébraïque habituelle signifiant contracter mariage. « Épousa » en transmet clairement le sens en français moderne.
- source_word: בָּשְׂמַת
  choice: Basemath
  rationale: Transcription française traditionnelle et intelligible de ce nom propre.
- source_word: בַּת שְׁלֹמֹה
  choice: fille de Salomon
  rationale: Le groupe construit exprime directement la filiation ; la formulation française reste proche de l'hébreu et naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule conserve la structure elliptique de la liste administrative. La tournure idiomatique « épousa » évite en français actuel l'ambiguïté ou la rudesse de « prit pour femme », tandis que la note préserve la forme littérale.
