  text: בֶּן גֶּ֖בֶר בְּ/רָמֹ֣ת גִּלְעָ֑ד ל֡/וֹ חַוֺּת֩ יָאִ֨יר בֶּן מְנַשֶּׁ֜ה אֲשֶׁ֣ר בַּ/גִּלְעָ֗ד ל֚/וֹ חֶ֤בֶל אַרְגֹּב֙ אֲשֶׁ֣ר בַּ/בָּשָׁ֔ן שִׁשִּׁים֙ עָרִ֣ים גְּדֹל֔וֹת חוֹמָ֖ה וּ/בְרִ֥יחַ נְחֹֽשֶׁת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: fr
  text: 'Ben-Guéber, à Ramoth en Galaad : les villages de Yaïr[a], fils de Manassé, qui se trouvent en Galaad, lui appartenaient, ainsi que la région d’Argob[b], située en Basan : soixante grandes villes entourées de murailles et munies de verrous de bronze.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les campements de Yaïr » ; en hébreu : Havvoth-Yaïr.'
    reason: lexical_alternative
  - marker: b
    text: Ou « le district d’Argob » ou « le territoire d’Argob ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: Ben-Guéber
  rationale: Dans cette liste administrative, l’expression fonctionne comme la désignation de l’un des responsables. La translittération préserve cet emploi nominal, tout en suivant les conventions françaises d’accentuation des noms bibliques.
- source_word: בְּרָמֹת גִּלְעָד
  choice: à Ramoth en Galaad
  rationale: La préposition בְּ est locative. « Ramoth en Galaad » est une forme française traditionnelle et immédiatement compréhensible du nom de lieu.
- source_word: לֹו
  choice: Il avait sous son autorité / ainsi que
  rationale: Les deux occurrences indiquent les territoires confiés à ce responsable dans le cadre de l’administration de Salomon. Cette formulation explicite naturellement en français la notion de ressort administratif sans réduire le texte à une possession privée.
- source_word: חַוֺּת יָאִיר
  choice: les villages de Yaïr
  rationale: חַוֺּת désigne ici les établissements connus sous le nom de Hawoth-Yaïr. « Villages » est clair en français moderne, tandis qu’une note conserve les autres possibilités lexicales et la translittération.
- source_word: בֶּן מְנַשֶּׁה
  choice: fils de Manassé
  rationale: La traduction formelle préserve la formulation généalogique du texte, qui peut également signaler une appartenance à la lignée ou à la tribu de Manassé.
- source_word: חֶבֶל אַרְגֹּב
  choice: la région d’Argob
  rationale: חֶבֶל peut désigner une étendue délimitée, un district ou un territoire. « Région » convient au contexte géographique et administratif sans imposer un statut administratif trop précis.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: soixante grandes villes
  rationale: La traduction directe rend le nombre et l’importance ou la taille exprimée par גְּדֹלוֹת, sans ajouter une qualification absente du texte.
- source_word: חוֹמָה וּבְרִיחַ נְחֹשֶׁת
  choice: entourées de murailles et munies de verrous de bronze
  rationale: חוֹמָה évoque l’enceinte fortifiée et בְרִיחַ le verrou ou la barre servant à fermer une porte. Le pluriel français distribue naturellement ces défenses entre les soixante villes, sans confondre les verrous avec les portes elles-mêmes.
