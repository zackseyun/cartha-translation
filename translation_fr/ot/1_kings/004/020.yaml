  yaml_path: translation/ot/1_kings/004/020.yaml
  text: Judah and Israel were as numerous as the sand by the sea in multitude[a], eating and drinking and rejoicing.
translation:
  language: fr
  text: Juda et Israël étaient aussi nombreux que le sable au bord de la mer[a]. Ils mangeaient, buvaient et se réjouissaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement «nombreux comme le sable qui est au bord de la mer, en grand nombre»; cette image hébraïque exprime une population extrêmement nombreuse.
    reason: La note signale la formulation plus littérale et explique l’idiome sans alourdir le texte principal.
lexical_decisions:
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Juda et Israël
  rationale: Les deux noms propres désignent les collectivités associées sous le règne de Salomon; leurs formes françaises traditionnelles et courantes sont retenues.
- source_word: רַבִּים כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: étaient aussi nombreux que le sable au bord de la mer
  rationale: La tournure comparative française exprime naturellement l’immense population évoquée par l’image hébraïque. «Aussi nombreux» rend רַבִּים avec la comparaison introduite par כ, tandis que לָרֹב renforce l’idée de grand nombre sans qu’une formule française redondante soit nécessaire.
- source_word: אֹכְלִים וְשֹׁתִים וּשְׂמֵחִים
  choice: Ils mangeaient, buvaient et se réjouissaient
  rationale: L’imparfait restitue la valeur descriptive et continue des participes hébreux. Une nouvelle phrase évite une succession lourde de participes présents et donne un français actuel et fluide.
