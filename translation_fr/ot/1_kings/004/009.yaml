  text: Ben-deker[a], in Makaz, in Shaalbim, in Beth-shemesh, and in Elon-beth-hanan.
translation:
  language: fr
  text: Ben-Déker[a], à Maqats, à Shaalbim, à Beth-Shémesh et à Élôn-Beth-Hanân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement, « le fils de Déker » ; la forme hébraïque est ici conservée comme désignation personnelle : « Ben-Déker ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: Ben-Déker
  rationale: Dans cette liste administrative, la construction בֶּן suivie d’un nom propre sert vraisemblablement de désignation personnelle. La translittération préserve la forme hébraïque sans la transformer en proposition descriptive.
- source_word: בְּ/מָקַץ
  choice: à Maqats
  rationale: La préposition בְ situe le domaine associé à cet intendant. En français, « à » convient naturellement devant un nom de localité sans expliciter davantage la fonction administrative donnée par le contexte.
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: à Shaalbim
  rationale: La conjonction et la préposition introduisent une autre localité. Le nom propre est translittéré.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: à Beth-Shémesh
  rationale: Même si la préposition n’est pas répétée devant ce nom, sa valeur locative se prolonge dans l’énumération. Le toponyme est translittéré plutôt que traduit.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: à Élôn-Beth-Hanân
  rationale: L’expression est comprise comme un toponyme composé. La préposition « à », héritée de la série, rend explicite en français le lien locatif sans ajouter de contenu administratif.
