base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: fr
  text: Guéber, fils d’Ouri, dans le pays de Galaad, territoire de Sihôn, roi des Amorites, et d’Og, roi du Basan, il était le seul gouverneur dans ce pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il était le seul gouverneur préposé à ce pays ». L’hébreu dit littéralement « dans le pays », mais certains comprennent l’expression dans un sens administratif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: Guéber
  rationale: Nom propre rendu selon une translittération française usuelle, sans le traduire comme un nom commun.
- source_word: בֶּן אֻרִי
  choice: fils d’Ourí
  rationale: Rend directement la construction patronymique hébraïque dans un français naturel.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: dans le pays de Galaad
  rationale: « Pays » exprime explicitement אֶרֶץ et prépare la précision territoriale apposée qui suit.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: le territoire de Sihôn, roi des Amorites, et d’Og, roi du Basan
  rationale: « Territoire » évite une répétition lourde de « pays » tout en conservant le sens territorial et l’apposition qui identifie Galaad par les anciens royaumes de Sihôn et d’Og.
- source_word: נְצִיב
  choice: gouverneur
  rationale: Dans la liste administrative du chapitre, le terme désigne un responsable régional nommé; « gouverneur » est clair et actuel.
- source_word: אֶחָד
  choice: le seul
  rationale: Dans cette proposition nominale, le numéral souligne naturellement en français qu’il n’y avait qu’un gouverneur pour ce territoire.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: dans ce pays
  rationale: Conserve le sens local littéral de ב (« dans »). Le relatif hébreu est intégré à une formulation française fluide; l’éventuel sens administratif est signalé en note.
