base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: fr
  text: 'Puis il s’étendit trois fois sur l’enfant et invoqua Yahweh en disant : « Yahweh, mon Dieu, je t’en prie, que la vie de cet enfant revienne dans son corps[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que l’âme de cet enfant revienne dans son corps ». Littéralement : « que le נֶפֶשׁ de cet enfant revienne dans son être intérieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: il s’étendit
  rationale: Le verbe rare décrit ici Élie étendant son corps sur celui de l’enfant. « S’étendit » est naturel en français et conserve l’action physique sans imposer l’image plus opaque de « se mesurer ».
- source_word: עַל הַיֶּלֶד
  choice: sur l’enfant
  rationale: La préposition indique ici la position physique d’Élie par rapport à l’enfant. « Sur l’enfant » convient naturellement à l’action décrite.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: par trois fois
  rationale: Expression française courante et digne qui souligne la répétition de l’acte.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: invoqua Yahweh
  rationale: Dans ce contexte de prière pressante, קרא אל désigne un appel adressé à Dieu. « Invoqua » exprime clairement cette prière sans exagérer son intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, mon Dieu
  rationale: Cette formulation française conserve l’adresse directe et le possessif de la prière hébraïque.
- source_word: תָּשָׁב נָא
  choice: je t’en prie, que … revienne
  rationale: Le jussif accompagné de נָא exprime une supplication urgente et respectueuse. La tournure choisie est idiomatique en français et garde la force de la demande.
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans ce récit, נֶפֶשׁ désigne naturellement la vie qui anime l’enfant. « Vie » évite de trancher une question d’anthropologie théologique, tandis que « âme », lexicalement possible, est signalé en note.
- source_word: הַיֶּלֶד הַזֶּה
  choice: cet enfant
  rationale: יַלֶד peut désigner un enfant ou un garçon. « Cet enfant » est précis dans le contexte et naturel en français, sans ajouter une nuance d’âge absente du terme.
- source_word: עַל קִרְבּוֹ
  choice: en lui
  rationale: L’expression signifie littéralement « sur/vers son intérieur ». « En lui » rend naturellement l’idée du retour de la vie dans la personne tout en restant proche de l’image hébraïque.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le contexte du retour à la vie
  choice: vie
  alternative: âme
  rationale: « Vie » correspond au sens narratif immédiat sans transformer le verset en affirmation technique sur la composition de l’être humain. La note conserve « âme » comme possibilité lexicale et maintient ainsi l’ambiguïté théologique réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le récit demeure concis, tandis que la prière garde son urgence. Le nom divin est rendu par « Yahweh » et l’ambiguïté de נֶפֶשׁ est préservée en note.
