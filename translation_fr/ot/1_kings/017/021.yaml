revisions:
- from: 'Puis il s’étendit sur l’enfant par trois fois et invoqua Yahweh en disant : « Yahweh, mon Dieu, je t’en prie, que la vie de cet enfant revienne en lui[a] ! »'
  to: 'Puis il s’étendit trois fois sur l’enfant et invoqua Yahweh en disant : « Yahweh, mon Dieu, je t’en prie, que la vie de cet enfant revienne dans son corps[a] ! »'
  rationale: La révision améliore la clarté syntaxique de l’action répétée et rend plus idiomatiquement l’idiome final tout en conservant le sens narratif de « vie » et l’alternative lexicale « âme » en note. « Dans son corps » explicite le référent corporel impliqué par le contexte sans en faire une thèse sur la nature de l’âme.
