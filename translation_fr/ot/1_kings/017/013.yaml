  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֵלִיָּ֨הוּ֙ אַל תִּ֣ירְאִ֔י בֹּ֖אִי עֲשִׂ֣י כִ/דְבָרֵ֑/ךְ אַ֣ךְ עֲשִׂי לִ֣/י מִ֠/שָּׁם עֻגָ֨ה קְטַנָּ֤ה בָ/רִאשֹׁנָה֙ וְ/הוֹצֵ֣אתְ לִ֔/י וְ/לָ֣/ךְ וְ/לִ/בְנֵ֔/ךְ תַּעֲשִׂ֖י בָּ/אַחֲרֹנָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: fr
  text: 'Élie lui dit : « N’aie pas peur. Va[a], fais comme tu l’as dit. Seulement, prépare-moi d’abord, avec ce que tu as, une petite galette[b] et apporte-la-moi. Ensuite, prépare-en pour toi et pour ton fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Viens ». Ici, le verbe sert à encourager la femme à passer à l’action.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut désigner une petite galette, un petit pain ou un gâteau cuit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: N’aie pas peur
  rationale: Cette tournure exprime naturellement en français moderne l’interdiction de craindre, sans modifier sa force.
- source_word: בֹּאִי
  choice: Va
  rationale: Le verbe signifie littéralement « viens », mais il sert ici d’exhortation à passer à l’action; « va » convient au contexte où la femme doit aller préparer la nourriture.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: fais comme tu l’as dit
  rationale: Rend naturellement l’idée d’agir conformément au projet qu’elle vient d’énoncer.
- source_word: אַךְ
  choice: Seulement
  rationale: Introduit la restriction ou la condition ajoutée par Élie, sans transformer celle-ci en opposition absolue.
- source_word: מִשָּׁם
  choice: avec ce que tu as
  rationale: Littéralement « de là »; dans le contexte, l’expression renvoie aux maigres provisions de farine et d’huile dont la femme vient de parler. La formulation française explicite sobrement ce référent.
- source_word: עֻגָה קְטַנָּה
  choice: une petite galette
  rationale: עֻגָה désigne un pain ou gâteau cuit, probablement plat; « petite galette » est clair et évite l’idée moderne d’un gâteau sucré.
- source_word: בָרִאשֹׁנָה
  choice: d’abord
  rationale: Marque clairement la priorité temporelle demandée par Élie.
- source_word: וְהוֹצֵאתְ לִי
  choice: et apporte-la-moi
  rationale: Le hiphil de יצא signifie littéralement « fais-la sortir pour moi »; en français, « apporte-la-moi » exprime naturellement le mouvement voulu.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: prépare-en pour toi et pour ton fils
  rationale: Le pronom « en » reprend naturellement la nourriture déjà mentionnée, dont l’objet reste implicite en hébreu.
- source_word: בָאַחֲרֹנָה
  choice: Ensuite
  rationale: Indique l’ordre postérieur de la préparation destinée à la femme et à son fils.
theological_decisions:
- issue: La priorité troublante accordée à la nourriture d’Élie
  choice: Conserver explicitement « d’abord », puis « ensuite »
  alternative: Atténuer la demande d’Élie par une paraphrase justificative
  rationale: Le texte hébreu impose nettement cet ordre. La traduction en préserve la tension éthique et théologique sans la résoudre ni la moraliser.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond aux formes féminines singulières de l’hébreu. « Galette » évite la connotation nécessairement sucrée de « gâteau », tandis que la succession « d’abord… ensuite » conserve sans l’adoucir la demande d’Élie.
