  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: fr
  text: Après ces événements, le fils de la femme à qui appartenait la maison tomba malade. Sa maladie devint très grave, jusqu’à ce qu’il ne reste plus de souffle en lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il ne reste plus de vie en lui ». L’hébreu dit littéralement : « qu’il ne reste plus de souffle en lui ».'
    reason: Alternative lexicale signalant la portée vitale de נְשָׁמָה tout en conservant son sens concret de « souffle » dans le texte principal.
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: Rend naturellement la transition narrative et conserve le pluriel de הַדְּבָרִים, sans reproduire lourdement la formule « et il arriva ».
- source_word: חָלָה
  choice: tomba malade
  rationale: 'Exprime en français courant la valeur ingressive du verbe : le fils commence à être malade.'
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: le fils de la femme à qui appartenait la maison
  rationale: Conserve le sens de possession ou de maîtrise exprimé par בַּעֲלַת הַבָּיִת, dans une formulation moderne et non archaïque.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: Sa maladie devint extrêmement grave
  rationale: Reproduit l’aggravation de l’état du fils et la forte intensification de מְאֹד.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: au point qu’il ne resta plus en lui aucun souffle
  rationale: Préserve l’image hébraïque de la נְשָׁמָה, le souffle, tout en exprimant naturellement en français l’aboutissement de l’aggravation.
theological_decisions:
- issue: Faut-il expliciter la mort du fils ou conserver l’expression hébraïque ?
  choice: Conserver « il ne resta plus en lui aucun souffle »
  alternative: « il mourut » ou « il ne resta plus aucune vie en lui »
  rationale: L’hébreu décrit littéralement l’absence de נְשָׁמָה sans employer ici une simple formule disant qu’il mourut. La traduction maintient cette formulation et son implication sans la résoudre explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase hébraïque est répartie en deux phrases françaises pour une lecture naturelle, sans perte de progression narrative. Le marqueur de note est placé sur l’expression qu’il explique.
