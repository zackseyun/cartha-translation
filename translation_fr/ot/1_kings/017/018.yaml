  naturalness: Le registre est globalement juste et accessible. « Qu’y a-t-il entre moi et toi ? » est possible, mais « Qu’ai-je à faire avec toi ? » est plus idiomatique en français moderne tout en conservant la mise à distance accusatrice. « Rappeler ma faute » rend naturellement l’idée de la faire revenir à l’esprit sans préciser indûment qui s’en souvient.
  terminology: « Élie », « homme de Dieu », « faute » et « mon fils » conviennent. La note sur « faute » préserve utilement l’ambiguïté de עָוֹן entre méfait, culpabilité et conséquences de la culpabilité.
