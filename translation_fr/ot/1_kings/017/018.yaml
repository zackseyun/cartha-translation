base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: fr
  text: 'Elle dit à Élie : « Qu’ai-je à faire avec toi, homme de Dieu ? Es-tu venu vers moi pour rappeler ma faute[a] et faire mourir mon fils ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon péché » ou « ma culpabilité ». Le terme hébreu peut désigner une faute, la culpabilité qui en résulte ou les conséquences de cette culpabilité.
    reason: Alternative lexicale préservant l’étendue sémantique de עָוֹן.
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Qu’y a-t-il entre moi et toi
  rationale: Cette tournure française conserve l’image de l’expression idiomatique hébraïque ainsi que sa force de protestation et de mise à distance.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homme de Dieu
  rationale: Titre hébreu consacré désignant ici le prophète ou messager de Dieu, sans paraphrase interprétative.
- source_word: בָּאתָ אֵלַי
  choice: Es-tu venu chez moi
  rationale: Le passé composé rend naturellement la valeur rhétorique et accusatrice de l’accompli dans ce discours direct.
- source_word: לְהַזְכִּיר
  choice: pour rappeler le souvenir de
  rationale: 'Cette formulation exprime la valeur causative du hiphil : faire revenir la faute à la mémoire ou attirer de nouveau l’attention sur elle.'
- source_word: עֲוֺנִי
  choice: ma faute
  rationale: « Faute » garde la portée morale du terme tout en restant naturel en français ; le mot hébreu peut aussi viser le péché, la culpabilité ou ses conséquences, ambiguïté signalée en note.
- source_word: וּלְהָמִית
  choice: et faire mourir
  rationale: Le hiphil de מות est causatif ; « faire mourir » en conserve la forme sans durcir le sens en « tuer ».
- source_word: בְּנִי
  choice: mon fils
  rationale: Le nom hébreu désigne précisément le fils, et non simplement un enfant.
theological_decisions:
- issue: Portée de עֲוֺנִי dans l’accusation de la veuve
  choice: ma faute
  alternative: mon péché ; ma culpabilité
  rationale: La veuve relie la mort de son fils à sa propre responsabilité morale. Le texte hébreu ne tranche pas nettement entre l’acte mauvais, l’état de culpabilité et le poids ou les conséquences de cette culpabilité ; la traduction principale et la note préservent cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La question idiomatique conserve sa formulation relationnelle et sa force de protestation. « Rappeler le souvenir de » maintient le ton solennel et évite de préciser qui se souvient de la faute, puisque l’hébreu ne l’explicite pas.
