id: 1KI.17.5
reference: 1 Kings 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ וַ/יַּ֖עַשׂ כִּ/דְבַ֣ר יְהוָ֑ה וַ/יֵּ֗לֶךְ וַ/יֵּ֨שֶׁב֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: fr
  text: Il partit donc et agit conformément à la parole de Yahweh. Il alla demeurer près de l’oued de Kerith[a], qui se trouve en face du Jourdain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près du torrent de Kerith » ou « dans le ravin de Kerith » ; le terme hébreu peut désigner un oued, un ravin ou un cours d’eau saisonnier.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « qui est devant/en face du Jourdain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Il partit donc / Il alla
  rationale: Le waw consécutif fait progresser le récit. « Donc » marque naturellement qu’Élie exécute l’ordre précédent, tandis que la seconde occurrence est conservée par « Il alla ».
- source_word: וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: agit conformément à la parole de Yahweh
  rationale: Cette formulation conserve l’idée d’une action accomplie en conformité avec la parole ou l’ordre divin, sans réduire דְבַר à de simples propos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: וַיֵּשֶׁב
  choice: alla demeurer
  rationale: ישׁב indique ici le fait de résider ou de rester dans un lieu. « Demeurer » convient au registre narratif et n’impose pas l’idée d’une installation définitive.
- source_word: בְּנַחַל כְּרִית
  choice: près de l’oued de Kerith
  rationale: נַחַל peut désigner un ravin ou un cours d’eau, souvent saisonnier. « Oued » rend bien cette réalité géographique, et « près de » exprime naturellement la localisation en français.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: qui se trouve en face du Jourdain
  rationale: « En face de » reflète le sens spatial de עַל־פְּנֵי sans préciser une direction cardinale absente de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre sans lui substituer un titre.
- issue: Valeur géographique de עַל פְּנֵי הַיַּרְדֵּן
  choice: en face du Jourdain
  alternative: à l’est du Jourdain
  rationale: L’hébreu exprime une relation spatiale telle que « devant » ou « en face de », mais ne dit pas explicitement « à l’est ». La traduction évite donc de résoudre cette donnée géographique de manière trop précise.
translation_notes:
  register: Français international moderne, clair et digne. La répétition du verbe « aller » dans l’hébreu est maintenue sous des formes naturelles. « Oued » préserve la couleur géographique du récit, avec des équivalents plus courants donnés en note.
