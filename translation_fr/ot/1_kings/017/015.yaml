base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/015.yaml
  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: fr
  text: Elle alla donc et fit selon la parole d’Élie. Et elle mangea — lui, elle et sa maisonnée — pendant de nombreux jours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Et elle mangea, lui, elle et sa maisonnée, des jours. » L’hébreu emploie un verbe au féminin singulier, suivi de la liste explicite de ceux qui mangèrent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Elle alla donc
  rationale: Le wayyiqtol de הלך fait progresser le récit. « Donc » exprime naturellement en français la conséquence de la parole précédente sans alourdir la coordination.
- source_word: וַתַּעֲשֶׂה
  choice: et fit
  rationale: עשה désigne ici la mise en pratique de l’instruction d’Élie. « Fit » conserve l’expression sobre et générale de l’hébreu.
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: selon la parole d’Élie
  rationale: דבר désigne ici une parole donnée comme instruction. Cette formulation reste proche de l’hébreu tout en étant claire et digne en français.
- source_word: וַתֹּאכַל
  choice: Et elle mangea
  rationale: Le verbe est formellement à la troisième personne du féminin singulier. La traduction maintient ce singulier avant l’énumération explicite des personnes concernées.
- source_word: הוּא וְהִיא וּבֵיתָהּ
  choice: lui, elle et sa maisonnée
  rationale: 'La formulation conserve l’ordre inhabituel de l’hébreu : « lui », puis « elle », puis sa maison au sens collectif. Dans le contexte, « lui » renvoie naturellement à Élie.'
- source_word: בֵּיתָהּ
  choice: sa maisonnée
  rationale: בַּיִת peut désigner la maison physique ou les personnes qui la composent. Ici, le contexte du repas favorise le sens collectif de « maisonnée ».
- source_word: יָמִים
  choice: pendant de nombreux jours
  rationale: Le pluriel יָמִים employé adverbialement indique une durée prolongée. « Pendant de nombreux jours » l’exprime naturellement sans préciser davantage cette durée.
