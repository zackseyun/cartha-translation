  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלָ֥י/ו לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/008.yaml
  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: fr
  text: 'Alors la parole de Yahweh lui fut adressée :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors… fut adressée
  rationale: La forme narrative fait progresser le récit. « Alors » exprime naturellement cette succession en français, tandis que la tournure complète rend l’idée que la parole divine survient.
- source_word: דְבַר
  choice: la parole
  rationale: Dans la formule prophétique דְבַר יְהוָה, « la parole » désigne une communication divine et conserve l’expression biblique établie sans la réduire à une simple information.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie le nom divin יהוה. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom masculin singulier renvoie à Élie dans le contexte. La construction française « lui fut adressée » rend idiomatiquement le sens de « vint à lui ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Cet infinitif introduit les paroles directes qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans ajouter le lourd « en disant ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Puisque l’hébreu présente le tétragramme comme nom propre, « Yahweh » en préserve la fonction et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français moderne, sobre et digne. La formule « la parole de Yahweh lui fut adressée » est naturelle dans le registre biblique français; les deux-points annoncent clairement le discours du verset suivant.
