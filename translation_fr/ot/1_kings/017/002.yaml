  text: And the word of Yahweh came to him[a], saying,
translation:
  language: fr
  text: 'Alors, la parole de Yahweh[a] lui fut adressée en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu : YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR » dans de nombreuses traductions.'
    reason: Préciser la forme hébraïque sous-jacente et signaler le rendu traditionnel.
lexical_decisions:
- source_word: וַיְהִי
  choice: Alors, … fut adressée
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession en français, tandis que la tournure « fut adressée » intègre idiomatiquement le verbe avec la formule prophétique.
- source_word: דְבַר
  choice: la parole
  rationale: Dans la construction דְבַר יְהוָה, « la parole » conserve la formule prophétique et sa portée révélatrice sans la réduire au sens plus interprétatif de « message ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֵלָיו
  choice: lui
  rationale: La préposition אֶל avec suffixe pronominal indique que la parole est dirigée vers Élie; « lui fut adressée » est la formulation française naturelle.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit le discours direct qui suit. « En ces termes » remplit naturellement cette fonction en français et évite le calque pesant « disant ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre tout en évitant de le remplacer par le titre « le SEIGNEUR »; « Jéhovah » repose sur une vocalisation hybride traditionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La tournure prophétique consacrée « la parole de Yahweh lui fut adressée » est naturelle en français biblique actuel; les deux-points annoncent directement le discours du verset suivant.
