  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: fr
  text: Les corbeaux lui apportaient du pain et de la viande le matin, et du pain et de la viande le soir. Il buvait de l’eau du torrent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’eau de l’oued » ou « de l’eau du cours d’eau » ; le mot hébreu נַחַל désigne un cours d’eau, souvent saisonnier, ou son lit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: Les corbeaux
  rationale: עֹרְבִים désigne normalement des corbeaux ou, plus largement, des corvidés. « Corbeaux » conserve le sens lexical ordinaire et la lecture concrète du texte.
- source_word: מְבִיאִים
  choice: apportaient
  rationale: Le participe exprime ici une action répétée ou habituelle dans le récit; l’imparfait français la rend naturellement.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom marque le bénéficiaire de l’action; « lui apportaient » est la tournure française idiomatique.
- source_word: לֶחֶם
  choice: du pain
  rationale: Le nom concret signifie « pain »; il n’est pas élargi en « nourriture ».
- source_word: וּבָשָׂר
  choice: et de la viande
  rationale: Dans ce contexte alimentaire, בָּשָׂר désigne naturellement de la viande plutôt que la « chair » au sens général.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Expression temporelle courante et fidèle en français moderne.
- source_word: וְלֶחֶם וּבָשָׂר בָּעָרֶב
  choice: et du pain et de la viande le soir
  rationale: La répétition hébraïque est conservée afin de maintenir le rythme et l’accent sur la provision du matin et du soir.
- source_word: וּמִן הַנַּחַל
  choice: au torrent
  rationale: נַחַל désigne un cours d’eau, souvent temporaire, ou son lit. « Boire au torrent » est naturel en français; une note signale les autres rendus possibles.
- source_word: יִשְׁתֶּה
  choice: Il buvait
  rationale: L’imparfait exprime l’action habituelle indiquée par l’inaccompli dans ce contexte narratif.
theological_decisions:
- issue: Nature des agents désignés par עֹרְבִים
  choice: des corbeaux au sens littéral
  alternative: des Arabes, des marchands ou d’autres agents humains
  rationale: Le sens lexical ordinaire de עֹרְבִים est « corbeaux », et le contexte immédiat ne justifie pas de remplacer ce sens pour atténuer le caractère miraculeux du récit.
translation_notes:
  register: Français moderne, digne et accessible. L’imparfait rend les actions répétées. La seconde proposition devient une phrase autonome pour éviter une coordination lourde, sans modifier la relation narrative. Le marqueur [a] est placé après « torrent », terme auquel la note se rapporte.
