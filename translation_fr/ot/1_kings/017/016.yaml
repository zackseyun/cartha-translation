source:
  edition: WLC
  text: כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א כָלָ֔תָה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א חָסֵ֑ר כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/יַ֥ד אֵלִיָּֽהוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: fr
  text: La farine dans la jarre ne s’épuisa pas, et l’huile dans la cruche ne manqua pas, conformément à la parole que Yahweh avait prononcée par l’intermédiaire d’Élie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main d’Élie » ; expression hébraïque signifiant « par l’intermédiaire d’Élie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: la farine dans la jarre
  rationale: כַּד désigne ici un récipient domestique contenant de la farine. Cette formulation française naturelle évite de suggérer que la jarre elle-même serait « de farine ».
- source_word: לֹא כָלָתָה
  choice: ne s’épuisa pas
  rationale: Le verbe כלה exprime ici le fait d’arriver à épuisement ou à son terme. « Ne s’épuisa pas » rend clairement la continuité de la provision.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: l’huile dans la cruche
  rationale: צַפַּחַת désigne un petit récipient, adapté à l’huile. « Cruche » le distingue naturellement de la jarre à farine.
- source_word: לֹא חָסֵר
  choice: ne manqua pas
  rationale: חסר signifie devenir insuffisant ou manquer. Le singulier hébreu s’accorde avec le récipient, mais le sens porte sur la réserve d’huile ; le français formule naturellement le sujet comme « l’huile ».
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole que Yahweh
  rationale: « Conformément à » conserve le rapport explicite entre l’événement et la parole divine, tandis que « Yahweh » rend directement le nom divin יהוה.
- source_word: אֲשֶׁר דִּבֶּר
  choice: avait prononcée
  rationale: Le plus-que-parfait marque que la parole divine précédait son accomplissement ; « prononcer une parole » convient au registre biblique sans être archaïque.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: par l’intermédiaire d’Élie
  rationale: Littéralement « par la main d’Élie », cette formule hébraïque exprime l’intermédiaire humain par lequel la parole a été transmise. La traduction retenue en communique naturellement le sens.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Médiation prophétique dans בְּיַד אֵלִיָּהוּ
  choice: par l’intermédiaire d’Élie
  alternative: par la main d’Élie
  rationale: La traduction indique qu’Élie est l’intermédiaire de la parole, tout en maintenant Yahweh comme celui qui l’a prononcée. La note conserve l’image littérale hébraïque.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme des deux provisions est conservé, sans préciser que l’huile est de l’huile d’olive puisque l’hébreu ne le dit pas.
