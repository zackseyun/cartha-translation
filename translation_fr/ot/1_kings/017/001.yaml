  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: fr
  text: 'Élie le Tishbite[a], l’un des habitants de Galaad, dit à Achab : « Aussi vrai que Yahweh, le Dieu d’Israël devant qui je me tiens, est vivant, il n’y aura pendant ces années ni rosée ni pluie, si ce n’est sur ma parole[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Élie, originaire de Tishbé, l’un des habitants de Galaad ». Le terme hébreu est un gentilé, mais l’identification exacte de Tishbé est incertaine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « si ce n’est conformément à ma parole » ou « si ce n’est à ma parole ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: le Tishbite
  rationale: Le gentilé hébreu est conservé sous sa forme traditionnelle et concise; il identifie Élie par son origine, même si la localisation précise de Tishbé demeure incertaine.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: l’un des habitants de Galaad
  rationale: תּוֹשָׁבֵי désigne ici les habitants ou résidents; cette formulation française naturelle conserve la valeur partitive de מִן.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh … est vivant
  rationale: Cette tournure française rend explicitement la valeur solennelle de la formule de serment hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct du groupe construit, sans explicitation théologique ajoutée.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: devant qui je me tiens
  rationale: Conserve l’image hébraïque de se tenir devant Dieu, laquelle peut évoquer à la fois sa présence et son service sans réduire l’expression à une seule interprétation.
- source_word: אִם יִהְיֶה
  choice: il n’y aura
  rationale: Dans cette formule de serment, אִם introduit une négation emphatique implicite; le français doit l’exprimer directement.
- source_word: טַל וּמָטָר
  choice: ni rosée ni pluie
  rationale: La construction française négative distingue naturellement les deux phénomènes mentionnés.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: pendant ces années
  rationale: Rendu temporel naturel qui préserve la référence démonstrative et la durée indéterminée du texte.
- source_word: כִּי אִם
  choice: sauf
  rationale: Marque clairement l’exception introduite par la locution hébraïque.
- source_word: לְפִי דְבָרִי
  choice: sur ma parole
  rationale: Expression française concise pouvant signifier conformément à la parole d’Élie ou lorsqu’il la prononcera, sans développer artificiellement la source de son autorité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » en conserve la fonction de nom personnel plutôt que de le remplacer par un titre.
- issue: Portée de לְפִי דְבָרִי
  choice: sauf sur ma parole
  alternative: si ce n’est conformément à ma parole / sauf à ma parole
  rationale: Le rendu préserve l’autorité prophétique affirmée par Élie sans préciser qu’il agirait indépendamment de Dieu ni ajouter une explication doctrinale absente du verset.
- issue: Formule אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: devant qui je me tiens
  alternative: que je sers
  rationale: Le choix maintient la tension entre présence, comparution et service, au lieu de ramener l’expression au seul service religieux.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formule de serment est rendue idiomatiquement; les expressions concrètes « devant qui je me tiens » et « sur ma parole » sont maintenues afin de préserver leur densité et leur ambiguïté légitime.
