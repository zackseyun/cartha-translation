    rationale: Dans ce contexte, לְפִי דְבָרִי signifie que la rosée et la pluie ne viendront qu’en conformité avec la parole d’Élie. « Sur ma parole » seul peut être compris comme « sur ma promesse/mon témoignage ». La formule « si ce n’est sur ma parole » rend l’exception de façon plus claire et traditionnelle sans ajouter d’interprétation.
