base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: fr
  text: 'Puis il cria à Yahweh et dit : « Yahweh, mon Dieu, as-tu aussi fait venir le malheur[a] sur la veuve chez qui je séjourne[b], en faisant mourir son fils ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait du mal à la veuve » ; le verbe hébreu peut signifier causer du tort, faire venir une calamité ou mal agir envers quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Ou « auprès de qui je séjourne » ; l’hébreu évoque le séjour d’un hôte ou d’une personne dépendante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: il cria vers Yahweh
  rationale: Dans ce contexte de prière pressante, קרא אל exprime un appel fervent. « Cria vers » conserve à la fois l’intensité et la construction directionnelle de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, mon Dieu
  rationale: Cette apostrophe directe reproduit l’association compacte du nom divin et de « mon Dieu ».
- source_word: הֲגַם
  choice: aussi
  rationale: La particule interrogative accompagnée de גם marque avec stupeur l’ajout de cette calamité aux épreuves déjà subies.
- source_word: הֲרֵעוֹתָ
  choice: as-tu aussi fait venir le malheur
  rationale: Le hiphil de רעע peut désigner le fait de causer un tort ou une calamité sans impliquer nécessairement une accusation de faute morale. « Faire venir le malheur » garde la causalité et la force de la plainte.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: chez qui je séjourne
  rationale: Le hitpael de גור évoque la résidence de quelqu’un accueilli comme hôte ou résident temporaire. « Séjourne » exprime cette nuance dans un registre digne et actuel.
- source_word: לְהָמִית אֶת בְּנָהּ
  choice: en faisant mourir son fils
  rationale: L’infinitif causatif précise le moyen ou le résultat du malheur. Cette formulation maintient l’attribution causale explicite de la prière sans employer le plus abrupt « tuer ».
theological_decisions:
- issue: La plainte d’Élie accuse-t-elle Dieu de mal moral ou lui attribue-t-elle une calamité ?
  choice: « fait venir le malheur […] en faisant mourir son fils »
  alternative: « fait du mal à la veuve […] en tuant son fils »
  rationale: Le texte attribue hardiment à Dieu la calamité et la mort, mais le verbe hébreu n’exige pas qu’Élie l’accuse de méchanceté morale. La traduction conserve cette tension sans l’atténuer en parlant d’une simple permission divine.
translation_notes:
  register: Français international moderne, naturel et digne. « Cria vers » traduit la ferveur de l’appel ; « séjourne » reste intelligible tout en gardant la nuance de résidence temporaire. La question conserve le caractère direct et troublant de la lamentation d’Élie.
