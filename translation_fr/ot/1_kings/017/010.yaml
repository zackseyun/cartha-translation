base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: fr
  text: 'Il se leva et partit pour Sarepta. Lorsqu’il arriva à l’entrée de la ville[a], voici qu’une veuve était là, ramassant du bois. Il l’appela et lui dit : « Je t’en prie, apporte-moi un peu d’eau dans un récipient, afin que je boive. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la porte de la ville ». L’hébreu emploie פֶּתַח, « ouverture, entrée », terme plus général que le mot précis signifiant « porte de ville ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Il se leva donc et partit
  rationale: La succession des deux verbes narratifs exprime le fait de se lever puis de partir. « Donc » relie naturellement l’action à l’ordre reçu dans le contexte, sans ajouter de causalité étrangère.
- source_word: צָרְפַתָה
  choice: pour Sarepta
  rationale: Le hé directionnel marque le mouvement vers le lieu. « Partir pour » rend cette direction en français naturel; « Sarepta » est la forme française traditionnelle et courante du toponyme.
- source_word: וַיָּבֹא אֶל פֶּתַח הָעִיר
  choice: Lorsqu’il arriva à l’entrée de la ville
  rationale: פֶּתַח désigne une ouverture ou une entrée, terme moins précis que le mot hébreu habituel pour « porte ». La subordination temporelle restitue avec fluidité l’enchaînement narratif.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure conserve la fonction de הִנֵּה, qui attire l’attention sur la scène découverte, dans un registre narratif digne mais encore naturel.
- source_word: אִשָּׁה אַלְמָנָה
  choice: une veuve
  rationale: L’expression littérale « une femme, une veuve » se rend idiomatiquement par « une veuve » sans perte de sens.
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: ramassant du bois
  rationale: Le participe décrit une action en cours. עֵצִים peut désigner du bois ou des morceaux de bois; « du bois » est naturel en français et n’impose pas l’image de grosses pièces.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: Il l’appela
  rationale: קרא אֶל signifie appeler quelqu’un ou l’interpeller. « Il l’appela » est concis et naturel dans cette scène.
- source_word: קְחִי נָא
  choice: Je t’en prie, apporte-moi
  rationale: לקח signifie fondamentalement « prendre », mais dans cette demande il implique d’aller prendre puis d’apporter. נָא marque ici une requête polie, rendue par « je t’en prie ».
- source_word: מְעַט מַיִם
  choice: un peu d’eau
  rationale: Cette expression reproduit directement et naturellement la petite quantité indiquée par מְעַט.
- source_word: בַּכְּלִי
  choice: dans un récipient
  rationale: כְּלִי est un terme général pour un objet ou contenant. « Récipient » conserve cette généralité sans préciser indûment une cruche ou une jarre.
- source_word: וְאֶשְׁתֶּה
  choice: afin que je boive
  rationale: La forme volitive exprime le but souhaité de la demande. « Afin que je boive » en préserve la nuance et le registre.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le texte conserve la vivacité de הִנֵּה par « voici que », tout en privilégiant des formulations immédiatement compréhensibles. Le tutoiement correspond à l’adresse d’un seul interlocuteur et ne marque pas ici un manque de respect.
