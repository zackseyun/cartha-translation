  source_fidelity: 'Le sens du texte hébreu est très bien rendu dans l’ensemble : le mouvement vers Sarepta, l’« entrée » (פֶּתַח) de la ville, la veuve qui ramasse du bois, et la demande polie d’eau dans un récipient sont fidèles. Toutefois, « donc » introduit explicitement une relation consécutive qui n’est pas portée par les deux wayyiqtol hébreux du verset.'
  naturalness: Le français est naturel, clair et adapté à un registre narratif moderne et digne. « Voici qu’une veuve était là » rend bien la mise en relief de וְהִנֵּה. « Afin que je boive » est correct, quoique légèrement soutenu, sans être artificiel.
  terminology: « Sarepta » est une forme française établie. « Entrée » préserve à juste titre la généralité de פֶּתַח, par opposition à « porte ». « Récipient » respecte la portée large de כְּלִי. La note devrait cependant donner l’alternative usuelle « porte de la ville », en plus de l’explication lexicale.
