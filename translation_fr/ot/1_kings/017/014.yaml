source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: fr
  text: 'Car voici ce que dit Yahvé, le Dieu d’Israël : « La jarre de farine ne s’épuisera pas, et la cruche d’huile ne se videra pas[a], jusqu’au jour où Yahvé fera tomber la pluie sur le sol[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne diminuera pas » ou « ne manquera pas ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur la face du sol ».'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que son remplacement par le titre « le Seigneur ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement la chaîne construite hébraïque et conserve l’identification donnée dans la formule prophétique.
- source_word: כַּד הַקֶּמַח
  choice: la jarre de farine
  rationale: כַּד désigne un récipient domestique; « jarre » convient au stockage de la farine et distingue ce récipient de celui de l’huile.
- source_word: לֹא תִכְלָה
  choice: ne s’épuisera pas
  rationale: Le verbe כלה exprime ici le fait d’arriver à son terme ou d’être entièrement consommé; cette formulation est naturelle pour une réserve de farine.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: la cruche d’huile
  rationale: צַפַּחַת désigne un récipient, vraisemblablement plus petit; « cruche » est clair en français et permet de le distinguer de la jarre.
- source_word: לֹא תֶחְסָר
  choice: ne se videra pas
  rationale: חסר signifie manquer ou diminuer. Avec un récipient d’huile comme sujet, « ne se videra pas » exprime naturellement la non-diminution de son contenu sans ajouter que l’huile est nécessairement de l’huile d’olive.
- source_word: עַד יוֹם
  choice: jusqu’au jour où
  rationale: Conserve explicitement l’expression temporelle hébraïque.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: Yahvé fera tomber la pluie
  rationale: נתן signifie littéralement « donner »; appliqué à la pluie, « faire tomber la pluie » est une tournure française naturelle qui garde Yahvé comme agent.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sur le sol
  rationale: Rend clairement l’idée de pluie répandue sur la surface du terrain, tandis que la note conserve l’image hébraïque littérale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie le nom divin lui-même. Sa transcription préserve le nom personnel au lieu de lui substituer un titre; « Yahvé » correspond à l’usage français courant.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve la solennité de la formule prophétique sans archaïsmes; les deux récipients sont distingués par « jarre » et « cruche ».
