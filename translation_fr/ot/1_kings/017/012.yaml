source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: fr
  text: 'Elle répondit : « Aussi vrai que Yahweh, ton Dieu, est vivant, je n’ai pas de petite galette[a], mais seulement une poignée de farine dans la jarre et un peu d’huile dans la cruche. Regarde, je ramasse deux morceaux de bois, puis je rentrerai préparer cela pour mon fils et moi. Nous le mangerons, puis nous mourrons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « petit pain » ou « pain cuit ». Le mot hébreu désigne une petite galette de pain.
    reason: Préciser l’étendue lexicale de מָעוֹג, qui ne correspond pas simplement au pain en général.
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Aussi vrai que Yahweh, ton Dieu, est vivant
  rationale: Cette formulation française naturelle conserve la solennité de la formule de serment et rend directement le nom divin.
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: je n’ai pas de petite galette
  rationale: Dans cette formule de serment, אִם exprime une forte négation. מָעוֹג désigne vraisemblablement un petit pain ou une galette, plutôt que le pain au sens général.
- source_word: מְלֹא כַף קֶמַח
  choice: une poignée de farine
  rationale: Équivalent français idiomatique de la quantité littérale correspondant au contenu d’une paume, qui souligne l’extrême pénurie.
- source_word: כַּד
  choice: jarre
  rationale: Désigne ici le récipient domestique où la farine est conservée.
- source_word: צַפַּחַת
  choice: cruche
  rationale: Désigne un petit récipient à liquide; ce choix le distingue clairement de la jarre à farine.
- source_word: וְהִנְנִי
  choice: Regarde
  rationale: Attire l’attention sur l’action en cours dans un français actuel, sans archaïsme.
- source_word: מְקֹשֶׁשֶׁת שְׁנַיִם עֵצִים
  choice: je ramasse deux morceaux de bois
  rationale: Le participe exprime une action en cours. « Morceaux de bois » évite de suggérer nécessairement des brindilles tout en conservant l’idée d’un combustible extrêmement réduit.
- source_word: וּבָאתִי וַעֲשִׂיתִיהוּ
  choice: puis je rentrerai préparer cela
  rationale: Le verbe בוא suggère qu’elle va rentrer, et le pronom masculin renvoie de manière générale à ce qu’elle préparera avec ses maigres provisions.
- source_word: לִי וְלִבְנִי
  choice: pour mon fils et moi
  rationale: Ordre naturel en français, sans modifier les bénéficiaires indiqués dans l’hébreu.
- source_word: וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: Nous le mangerons, puis nous mourrons
  rationale: Conserve la succession tragique et directe des deux actions.
theological_decisions:
- issue: Rendu du nom divin יְהוָה dans le serment de la veuve sidonienne
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel dans la bouche de la veuve sans atténuer la formule de serment.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le tutoiement correspond à l’adresse singulière à Élie. La syntaxe brève de la conclusion conserve la détresse et la résignation de la veuve.
