base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: fr
  text: 'Élie prit alors l’enfant, le descendit de la chambre haute jusque dans la maison et le donna à sa mère. Puis Élie dit : « Regarde, ton fils est vivant[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton fils vit ».'
    reason: Alternative grammaticale et stylistique pour חַי בְּנֵךְ, dont le prédicat peut se rendre en français par un adjectif (« est vivant ») ou par un verbe (« vit »).
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe narratif courant לקח signifie ici « prendre »; « prit » reste naturel et n’ajoute aucune précision sur la manière de porter l’enfant.
- source_word: הַיֶּלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon. « L’enfant » est naturel en français et évite de préciser un âge ou un stade de développement que le texte ne donne pas.
- source_word: וַיֹּרִדֵהוּ
  choice: le descendit
  rationale: La forme causative de ירד exprime le fait de faire descendre. « Le descendit » restitue directement le mouvement sans préciser qu’Élie l’aurait porté.
- source_word: הָעֲלִיָּה
  choice: la chambre haute
  rationale: עֲלִיָּה désigne une pièce située à l’étage ou sur la terrasse. « Chambre haute » conserve cette réalité architecturale dans un registre biblique clair et digne.
- source_word: הַבַּיְתָה
  choice: jusque dans la maison
  rationale: La terminaison directionnelle indique un mouvement vers l’intérieur de la maison; « jusque dans » rend clairement le trajet depuis la chambre haute.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: le rendit à sa mère
  rationale: נתן signifie littéralement « donner ». Dans ce contexte, « rendre à sa mère » est l’expression française naturelle pour la remise de son enfant, sans modifier l’action décrite.
- source_word: רְאִי
  choice: Regarde
  rationale: L’impératif féminin singulier de ראה s’adresse directement à la mère. « Regarde » garde sa force démonstrative dans un français moderne.
- source_word: חַי בְּנֵךְ
  choice: ton fils est vivant
  rationale: L’adjectif prédicatif חַי affirme l’état présent du fils. « Est vivant » est idiomatique et ne développe pas le miracle au-delà du texte hébreu.
theological_decisions:
- issue: Degré d’explicitation du retour à la vie
  choice: ton fils est vivant
  alternative: ton fils vit de nouveau / ton fils a été ramené à la vie
  rationale: L’hébreu affirme sobrement que le fils est vivant. Le contexte manifeste le miracle, mais la traduction ne doit pas ajouter « de nouveau » ni expliciter un mécanisme de résurrection absent de cette déclaration.
translation_notes:
  register: Français international moderne, narratif et digne. « Chambre haute » préserve le cadre architectural ancien sans archaïsme excessif. La reprise du nom « Élie » suit l’hébreu et donne du relief à sa déclaration. Le point d’exclamation traduit la force dramatique de l’annonce sans en développer le contenu.
