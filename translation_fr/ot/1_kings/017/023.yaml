    issue: « le rendit à sa mère » dépasse légèrement le sens lexical de וַיִּתְּנֵהוּ לְאִמּוֹ.
    rationale: Le texte hébreu dit littéralement qu’Élie « le donna à sa mère ». « Rendre » présuppose explicitement une restitution; celle-ci est plausible dans le récit, mais relève du contexte plutôt que du verbe עצמו. « Le donna à sa mère » préserve la formulation source.
  revised_text: 'Élie prit alors l’enfant, le descendit de la chambre haute jusque dans la maison et le donna à sa mère. Puis Élie dit : « Regarde, ton fils est vivant[a] ! »'
