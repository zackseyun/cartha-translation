  revision_rationale: La seule révision nécessaire remplace « rendit » par « donna », afin de refléter directement נתן sans ajouter la notion de restitution. Le reste du texte conserve avec naturel la concision, la dynamique narrative et l’annonce sobre du texte hébreu.
