  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: fr
  text: 'Comme elle allait en chercher, il l’appela[a] et dit : « S’il te plaît, apporte-moi un morceau de pain[b] dans ta main. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’appela alors qu’elle s’éloignait ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une bouchée de pain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: Comme elle allait en chercher
  rationale: La tournure exprime naturellement en français l’action en cours et son but. Le pronom « en » renvoie à l’eau demandée au verset précédent, sans répétition inutile.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: il l’appela
  rationale: קרא avec אֶל indique qu’il lui adresse un appel. « Il l’appela » est idiomatique et conserve la progression du récit.
- source_word: לִקְחִי נָא לִי
  choice: S’il te plaît, apporte-moi
  rationale: Dans ce contexte, לקח désigne le fait de prendre quelque chose pour le remettre au demandeur ; « apporte-moi » rend donc l’intention plus naturellement que « prends-moi ». נָא adoucit l’impératif et correspond à « s’il te plaît ».
- source_word: פַּת לֶחֶם
  choice: un morceau de pain
  rationale: La locution désigne une petite portion ou bouchée de pain. « Un morceau de pain » est clair, courant et digne.
- source_word: בְּיָדֵךְ
  choice: dans ta main
  rationale: La formulation concrète de l’hébreu est conservée. Bien qu’elle puisse évoquer plus largement ce que la femme aura avec elle, l’image reste compréhensible en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste fluide tout en conservant l’image concrète de la main et la politesse exprimée par נָא.
