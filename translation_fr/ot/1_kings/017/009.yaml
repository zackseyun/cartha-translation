source:
  edition: WLC
  text: ק֣וּם לֵ֤ךְ צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן וְ/יָשַׁבְתָּ֖ שָׁ֑ם הִנֵּ֨ה צִוִּ֥יתִי שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה לְ/כַלְכְּלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: fr
  text: « Lève-toi, va à Sarepta, qui appartient à Sidon[a], et installe-toi là. Voici, j’ai ordonné là-bas à une veuve de pourvoir à tes besoins[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est dans la région de Sidon » ou « près de Sidon ». L’hébreu relie plus littéralement Sarepta à Sidon, ce qui indique vraisemblablement une relation régionale ou politique.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’ai chargé là-bas une veuve de subvenir à tes besoins ». L’hébreu dit « j’ai ordonné »; la suite du récit ne montre pas encore que la veuve ait consciemment reçu cet ordre.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: Lève-toi
  rationale: L’impératif de קום appelle à se lever pour agir. « Lève-toi » est naturel et conserve la force de l’ordre.
- source_word: לֵ֤ךְ
  choice: va
  rationale: Dans cet ordre de déplacement, l’impératif de הלך se rend naturellement par « va ».
- source_word: צָרְפַתָה
  choice: Sarepta
  rationale: Forme française traditionnelle et courante du nom de lieu biblique.
- source_word: אֲשֶׁר לְצִידוֹן
  choice: qui dépend de Sidon
  rationale: La préposition לְ marque ici le rapport de Sarepta avec Sidon, vraisemblablement une appartenance régionale ou politique. « Dépend de » préserve ce rapport sans le réduire à une simple localisation.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: et installe-toi là
  rationale: Le parfait avec waw poursuit ici la série d’ordres. « Installe-toi là » exprime un séjour résidentiel et convient mieux au contexte qu’un simple « reste là ».
- source_word: הִנֵּה
  choice: Voici
  rationale: La particule attire l’attention sur la disposition annoncée par Dieu. « Voici » demeure clair, digne et idiomatique dans le registre biblique français.
- source_word: צִוִּיתִי
  choice: j’ai ordonné
  rationale: Le piel de צוה signifie directement « ordonner ». Cette traduction conserve la force du verbe et la tension narrative concernant la manière dont la veuve a reçu cet ordre.
- source_word: אִשָּׁה אַלְמָנָה
  choice: une veuve
  rationale: L’expression littérale « une femme, une veuve » se rend naturellement en français par « une veuve », sans perte de sens.
- source_word: לְכַלְכְּלֶךָ
  choice: de pourvoir à tes besoins
  rationale: כלכל désigne le fait d’entretenir ou de soutenir quelqu’un. « Pourvoir à tes besoins » englobe la nourriture et la subsistance que demande le contexte.
theological_decisions:
- issue: Sens de l’affirmation divine selon laquelle Dieu a « ordonné » à la veuve
  choice: Maintenir « j’ai ordonné »
  alternative: « j’ai chargé une veuve » ou « j’ai désigné une veuve »
  rationale: Le verbe hébreu צוה signifie normalement « ordonner ». Le récit ne montre pas encore que la veuve ait consciemment reçu cet ordre; la traduction conserve donc cette tension au lieu d’expliquer d’avance comment agit la parole souveraine de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs restent directs; « Voici » conserve la fonction discursive de הִנֵּה sans recourir à une tournure obscure. Les notes signalent les ambiguïtés géographique et narrative sans les résoudre dans le corps du texte.
