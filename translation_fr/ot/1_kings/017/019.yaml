base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: fr
  text: 'Il lui dit : « Donne-moi ton fils. » Puis il le prit de son giron[a], le porta à l’étage, dans la chambre où il logeait[b], et le coucha sur son propre lit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de contre sa poitrine » ou « de ses genoux ». Le terme hébreu désigne la région de la poitrine ou du giron, où l’on tient un enfant tout près de soi.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la pièce haute où il séjournait » ; il s’agit d’une pièce située à l’étage ou sur la terrasse.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: Donne-moi
  rationale: 'L’impératif de נתן suivi de לִי exprime naturellement une demande directe : « Donne-moi ». Cette formulation conserve l’urgence sans ajouter de dureté.'
- source_word: בְּנֵךְ
  choice: ton fils
  rationale: בֵּן désigne précisément le fils, plutôt qu’un enfant sans indication de sexe.
- source_word: מֵחֵיקָהּ
  choice: sur ses genoux
  rationale: חֵיק désigne la zone du giron, des genoux ou de la poitrine où l’on tient quelqu’un près de soi. « Sur ses genoux » est clair et naturel en français moderne, tandis que la note conserve les autres nuances possibles.
- source_word: וַיַּעֲלֵהוּ
  choice: le porta dans
  rationale: Le contexte et la destination située à l’étage impliquent qu’Élie monte en portant le garçon. En français, « le porta dans la chambre à l’étage » exprime naturellement ce déplacement ascendant sans lourdeur.
- source_word: הָעֲלִיָּה
  choice: la chambre à l’étage
  rationale: עֲלִיָּה désigne une pièce haute ou aménagée à l’étage. Cette expression est moderne, intelligible et moins archaïque que « chambre haute ».
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: où il logeait
  rationale: Dans ce contexte, ישב indique le fait de résider ou de séjourner, non la posture assise. « Où il logeait » convient à l’hébergement d’Élie chez la veuve.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: le coucha
  rationale: La forme causative de שׁכב signifie faire se coucher ou étendre quelqu’un. « Le coucha » est concis et idiomatique.
- source_word: עַל מִטָּתוֹ
  choice: sur son propre lit
  rationale: Le suffixe renvoie à Élie, sujet des verbes. « Son propre lit » lève naturellement l’ambiguïté possible en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. Le discours direct reste sobre. « Chambre à l’étage » et « où il logeait » privilégient une compréhension immédiate, tandis que les notes signalent l’étendue sémantique des termes hébreux.
