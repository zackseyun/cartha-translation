id: 1KI.17.22
reference: 1 Kings 17:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: fr
  text: Yahweh écouta la voix d’Élie, et la vie de l’enfant[a] revint en lui, et il vécut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’âme de l’enfant revint en lui ». Selon le contexte, le mot hébreu néfèsh peut désigner la « vie », l’« âme » ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: écouta
  rationale: Dans le contexte de la prière d’Élie, שׁמע exprime non seulement le fait d’entendre, mais aussi l’accueil favorable et la réponse de Dieu. « Écouta » conserve cette nuance sans explicitation excessive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּקוֹל אֵלִיָּהוּ
  choice: la voix d’Élie
  rationale: Cette formulation garde l’image concrète de l’hébreu. « La prière d’Élie » serait plus explicite, mais aussi plus interprétatif.
- source_word: וַתָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב indique ici un retour ou un rétablissement. « Revint » rend directement le mouvement décrit.
- source_word: נֶפֶשׁ
  choice: la vie
  rationale: Dans ce récit où l’enfant mort recommence à vivre, « la vie » exprime clairement le sens contextuel de נֶפֶשׁ sans imposer une anthropologie précise. L’autre traduction traditionnelle, « l’âme », est signalée en note.
- source_word: הַיֶּלֶד
  choice: l’enfant
  rationale: יֶלֶד désigne ici l’enfant de la veuve. « L’enfant » est naturel en français et convient au contexte.
- source_word: עַל קִרְבּוֹ
  choice: en lui
  rationale: קֶרֶב désigne l’intérieur ou le dedans d’une personne. « En lui » rend idiomatiquement le retour de la vie à l’intérieur de l’enfant, sans surcharger la phrase.
- source_word: וַיֶּחִי
  choice: et il vécut
  rationale: Cette traduction suit de près la formulation concise de l’hébreu et maintient sa répétition avec le retour de la vie.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le récit du retour à la vie
  choice: la vie
  alternative: l’âme
  rationale: Le contexte immédiat porte sur le rétablissement de la vie de l’enfant. « La vie » transmet ce sens sans trancher une question anthropologique que le terme hébreu, à lui seul, ne résout pas. « L’âme » demeure une possibilité lexicale réelle et est donc conservée en note.
translation_notes:
  register: Français moderne, sobre et digne. La phrase conserve le parallélisme narratif et la répétition de « vie/vécut » propres à l’hébreu, tout en employant « en lui » pour rendre naturellement l’expression désignant l’intérieur de l’enfant.
