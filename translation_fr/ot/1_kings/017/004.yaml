source:
  edition: WLC
  text: וְ/הָיָ֖ה מֵ/הַ/נַּ֣חַל תִּשְׁתֶּ֑ה וְ/אֶת הָ/עֹרְבִ֣ים צִוִּ֔יתִי לְ/כַלְכֶּלְ/ךָ֖ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: fr
  text: Tu boiras de l’eau du torrent[a], et j’ai ordonné aux corbeaux[b] de pourvoir à tes besoins[c] là-bas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du cours d’eau » ou « de l’oued ».
    reason: lexical_alternative
  - marker: b
    text: Certains ont proposé d’y voir autre chose que des oiseaux, par exemple un nom de lieu ou un groupe humain; toutefois, le sens hébreu ordinaire est « corbeaux », ce que confirme la suite du récit.
    reason: alternative_reading
  - marker: c
    text: Ou « de te soutenir » ou « de te nourrir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Tu boiras
  rationale: La tournure hébraïque introduit ici la situation à venir. En français moderne, le futur exprime naturellement cette valeur sans reproduire lourdement « il arrivera que ».
- source_word: מֵהַנַּחַל
  choice: de l’eau du torrent
  rationale: נַחַל peut désigner un torrent, un cours d’eau ou le lit d’un oued. L’ajout explicatif « de l’eau » rend idiomatiquement l’acte de boire tout en conservant « torrent » comme désignation accessible du lieu.
- source_word: תִּשְׁתֶּה
  choice: tu boiras
  rationale: L’imparfait hébreu de deuxième personne masculine singulière indique ici une action future.
- source_word: הָעֹרְבִים
  choice: les corbeaux
  rationale: Le nom hébreu désigne ordinairement des corvidés, traditionnellement rendus ici par « corbeaux »; la suite du récit confirme qu’il s’agit d’oiseaux.
- source_word: צִוִּיתִי
  choice: j’ai ordonné
  rationale: Le parfait présente un ordre déjà donné et toujours pertinent pour la provision promise à Élie.
- source_word: לְכַלְכֶּלְךָ
  choice: de pourvoir à tes besoins
  rationale: Le verbe signifie entretenir, soutenir ou ravitailler. Cette formulation garde une portée assez large sans anticiper excessivement les précisions du verset suivant.
- source_word: שָׁם
  choice: là-bas
  rationale: L’adverbe renvoie au lieu vers lequel Élie vient d’être envoyé; « là-bas » est naturel dans ce contexte directif.
theological_decisions:
- issue: Identité des agents chargés de ravitailler Élie
  choice: Des corbeaux au sens littéral
  alternative: Un nom de lieu ou un groupe humain, interprétations parfois proposées
  rationale: Le sens ordinaire de הָעֹרְבִים est celui des oiseaux, et le contexte suivant les décrit apportant du pain et de la viande. La traduction conserve donc le sens lexical direct sans rationaliser le récit.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe évite le calque pesant « il arrivera que », tandis que « j’ai ordonné » préserve l’antériorité et la pertinence présente de l’ordre divin.
