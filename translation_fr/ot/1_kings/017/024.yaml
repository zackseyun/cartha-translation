  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: fr
  text: 'Alors la femme dit à Élie : « Maintenant, je sais que tu es un homme de Dieu et que la parole de Yahweh dans ta bouche est vraie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est vérité » ou « est digne de confiance ». Le nom hébreu peut souligner la vérité, la véracité ou la fiabilité.
