lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה אֶל אֵלִיָּהוּ
  choice: Alors la femme dit à Élie
  rationale: Le waw consécutif fait progresser le récit; « Alors » exprime naturellement la succession. « La femme » conserve le terme immédiat du texte sans remplacer celui-ci par « la veuve ».
- source_word: עַתָּה זֶה יָדַעְתִּי
  choice: Maintenant, je sais
  rationale: L’expression marque une prise de conscience désormais acquise. Le présent français rend naturellement la valeur résultative de la forme verbale.
- source_word: אִישׁ אֱלֹהִים
  choice: un homme de Dieu
  rationale: Expression hébraïque reconnue désignant un homme qui appartient à Dieu et parle en son nom; la formulation traditionnelle demeure claire en français moderne.
- source_word: וּדְבַר יְהוָה
  choice: et que la parole de Yahweh
  rationale: « Parole » préserve la formule prophétique et sa portée théologique; le nom divin est transcrit « Yahweh ».
- source_word: בְּפִיךָ
  choice: dans ta bouche
  rationale: La formulation conserve l’image hébraïque de la parole prophétique prononcée, tout en restant compréhensible en français.
- source_word: אֱמֶת
  choice: est vérité
  rationale: Le nom prédicatif hébreu peut exprimer la vérité, la véracité ou la fiabilité. « Est vérité » conserve sa forme nominale et la force de l’affirmation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve ici le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de אֱמֶת appliqué à la parole divine
  choice: est vérité
  alternative: est vraie; est digne de confiance
  rationale: Le choix principal maintient le nom abstrait et ne réduit pas sa portée à la seule exactitude factuelle; une note signale les autres nuances lexicales possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde l’image sémitique « dans ta bouche » ainsi que le nom prédicatif « vérité », sans devenir inutilement archaïque.
