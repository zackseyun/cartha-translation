id: 1KI.17.3
reference: 1 Kings 17:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֵ֣ךְ מִ/זֶּ֔ה וּ/פָנִ֥יתָ לְּ/ךָ֖ קֵ֑דְמָ/ה וְ/נִסְתַּרְתָּ֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: fr
  text: Pars d’ici, tourne-toi vers l’est et cache-toi près de l’oued de Kerith[a], qui se trouve en face du Jourdain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près du torrent de Kerith ». Le mot hébreu נחל peut désigner un oued, un ravin ou un cours d’eau.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie littéralement « devant le Jourdain ». Elle peut aussi se comprendre comme « à l’est du Jourdain » ou « vis-à-vis du Jourdain » dans ce contexte géographique.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: Pars d’ici
  rationale: L’impératif de הלך suivi de מִזֶּה commande à Élie de quitter le lieu où il se trouve. « Pars d’ici » est direct et naturel en français.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: tourne-toi vers l’est
  rationale: פנה avec la terminaison directionnelle de קֵדְמָה indique un changement d’orientation vers l’est. La tournure pronominale française exprime naturellement ce mouvement sans donner à לְךָ une valeur emphatique excessive.
- source_word: וְנִסְתַּרְתָּ
  choice: cache-toi
  rationale: 'Le nifal de סתר a ici un sens réfléchi ou résultatif : Élie doit se mettre à l’abri des regards. « Cache-toi » est clair et fidèle au commandement.'
- source_word: בְּנַחַל
  choice: près de l’oued
  rationale: נחל peut désigner un ravin servant de cours d’eau, souvent saisonnier. « Oued » convient au cadre levantin et évite de suggérer nécessairement un cours d’eau permanent; la préposition בְּ est rendue naturellement par « près de » dans ce contexte.
- source_word: כְּרִית
  choice: Kerith
  rationale: Le nom propre est translittéré sous la forme française usuelle « Kerith ».
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: qui se trouve en face du Jourdain
  rationale: עַל־פְּנֵי peut exprimer une position devant ou en face de quelque chose. Cette traduction conserve l’indication spatiale du texte sans imposer dans le corps du verset l’interprétation géographique « à l’est du Jourdain ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Oued » conserve la réalité géographique d’un cours d’eau potentiellement saisonnier; la note fournit l’équivalent plus traditionnel « torrent ». Le tour « en face du Jourdain » maintient l’ambiguïté spatiale de l’hébreu.
