  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
translation:
  language: fr
  text: Au bout d’un certain temps, le oued[a] se dessécha, car il n’y avait pas de pluie dans le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torrent ». Le mot hébreu peut désigner un cours d’eau saisonnier ou son lit, autrement dit un oued.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Au bout d’un certain temps
  rationale: La formule narrative introduit l’événement suivant. En français moderne, sa valeur se fond naturellement dans l’indication temporelle, sans le calque lourd « il arriva que ».
- source_word: מִקֵּץ יָמִים
  choice: au bout d’un certain temps
  rationale: L’expression indique l’écoulement d’une période non précisée. Cette formulation française en conserve le caractère indéfini.
- source_word: וַיִּיבַשׁ
  choice: se dessécha
  rationale: Le verbe décrit ici un cours d’eau qui cesse de contenir de l’eau ; « se dessécha » convient au registre narratif et reste naturel.
- source_word: הַנָּחַל
  choice: le oued
  rationale: נחל désigne souvent un cours d’eau, fréquemment saisonnier, ou son lit encaissé. « Oued » rend précisément cette réalité géographique proche-orientale.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la cause de l’assèchement. « Car » exprime clairement ce lien explicatif dans un récit soutenu.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: il ne pleuvait pas
  rationale: La tournure française exprime naturellement l’absence persistante de pluie qui explique l’assèchement.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire ou la région touchée par la sécheresse, et non la terre entière.
