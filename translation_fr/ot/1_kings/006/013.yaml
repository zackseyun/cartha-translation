  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: fr
  text: J’habiterai au milieu des Israélites[a] et je n’abandonnerai pas mon peuple, Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: J’habiterai
  rationale: Le verbe שׁכן exprime ici la présence durable de Dieu auprès de son peuple. « Habiter » garde cette portée relationnelle et théologique dans un français naturel.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Cette expression rend directement l’idée d’une présence au sein de la communauté sans localiser Dieu exclusivement dans le temple.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: L’expression hébraïque signifie littéralement « les fils d’Israël », mais elle désigne collectivement le peuple d’Israël. « Les Israélites » est inclusif, précis et idiomatique en français moderne.
- source_word: וְלֹא אֶעֱזֹב
  choice: et je n’abandonnerai pas
  rationale: Dans ce contexte d’alliance, עזב évoque le fait de délaisser ou d’abandonner. « Je n’abandonnerai pas » restitue clairement la force relationnelle de la promesse.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Traduction directe de la formule possessive d’alliance, qui conserve toute sa portée dans le contexte.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé selon l’usage français standard.
theological_decisions:
- issue: La présence divine dans le contexte du temple
  choice: « J’habiterai au milieu des Israélites »
  alternative: « Je résiderai parmi les Israélites »
  rationale: La formulation exprime la présence de Dieu auprès de son peuple en lien avec le temple, sans affirmer qu’il y serait enfermé ou exclusivement localisé. Elle préserve ainsi la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Israélites » évite le caractère potentiellement masculin ou généalogique de « fils d’Israël », tandis que la note conserve la forme littérale de l’hébreu.
