base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: fr
  text: Il construisit, au fond du Temple, un espace de vingt coudées avec des planches de cèdre, depuis le sol jusqu’aux murs[a]. Il y construisit, à l’intérieur, le sanctuaire intérieur[b], le lieu très saint[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis le sol jusqu’aux poutres » ou « jusqu’aux chevrons ». Le texte hébreu porte « jusqu’aux murs », lecture conservée ici.
    reason: alternative_reading
  - marker: b
    text: Hébreu debir, nom de la pièce la plus intérieure du Temple.
    reason: cultural_note
  - marker: c
    text: 'Traduction traditionnelle : « le Saint des saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: du fond du Temple
  rationale: L’expression désigne la partie la plus reculée ou arrière de l’édifice. « Du fond du Temple » rend naturellement cette localisation en français; « Temple » explicite ici la fonction du bâtiment sans modifier le référent.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: avec des planches de cèdre
  rationale: צְלָעוֹת peut désigner des éléments latéraux, des nervures ou des planches. Dans ce contexte architectural, « planches de cèdre » exprime clairement le matériau de l’aménagement intérieur.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: depuis le sol jusqu’aux murs
  rationale: Le texte massorétique porte littéralement « jusqu’aux murs ». Malgré la difficulté architecturale, cette lecture est conservée dans le texte principal, tandis que l’interprétation courante « poutres/chevrons » est signalée en note.
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: À l’intérieur, il aménagea ainsi
  rationale: La formulation hébraïque est condensée et décrit la création d’un espace à l’intérieur de l’édifice. « Aménagea ainsi » relie naturellement cet espace aux vingt coudées et au revêtement qui viennent d’être mentionnés.
- source_word: לִדְבִיר
  choice: le sanctuaire intérieur
  rationale: דְּבִיר est le terme technique désignant la pièce la plus intérieure du Temple. « Sanctuaire intérieur » en traduit la fonction sans imposer au lecteur une translittération hébraïque peu connue.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: le lieu très saint
  rationale: La construction hébraïque exprime le degré suprême de sainteté. « Le lieu très saint » est clair en français moderne, tandis que la formule traditionnelle « le Saint des saints » est conservée en note.
- source_word: אַמָּה
  choice: coudées
  rationale: L’unité ancienne est maintenue plutôt que convertie dans le corps du texte, afin de préserver la forme et le cadre historique de la mesure source.
theological_decisions:
- issue: Désignation de la pièce la plus sacrée du Temple
  choice: le lieu très saint
  alternative: le Saint des saints
  rationale: La traduction principale rend directement le superlatif hébraïque en français moderne. La formule traditionnelle reste indiquée en note sans lui donner une priorité doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’unité ancienne « coudée » et la lecture difficile du texte massorétique, tout en évitant une tournure excessivement calquée. La répétition sémantique entre « sanctuaire intérieur » et « lieu très saint » reflète les deux désignations hébraïques successives.
