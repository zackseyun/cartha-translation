  yaml_path: translation/ot/1_kings/006/035.yaml
  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: fr
  text: Il y sculpta des chérubins, des palmiers et des fleurs épanouies, puis il les recouvrit d’or en l’ajustant aux motifs sculptés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָלַע
  choice: Il y sculpta
  rationale: Le verbe désigne ici l’exécution de motifs en relief ou gravés sur les portes; « y » rattache naturellement l’action aux portes mentionnées dans le contexte.
- source_word: כְרוּבִים
  choice: des chérubins
  rationale: Terme traditionnel et précis pour les êtres célestes représentés dans le sanctuaire.
- source_word: תִמֹרוֹת
  choice: des palmiers
  rationale: Le nom désigne des figures de palmiers, motif décoratif du temple.
- source_word: פְטֻרֵי צִצִּים
  choice: des fleurs épanouies
  rationale: L’expression désigne des fleurs ouvertes ou écloses; « épanouies » est naturel et conserve l’image.
- source_word: מְיֻשָּׁר עַל הַמְּחֻקֶּה
  choice: ajusté sur les motifs sculptés
  rationale: Le participe suggère que l’or était appliqué ou ajusté conformément au relief sculpté. Cette formulation évite de trancher excessivement entre les nuances « étendu uniformément » et « adapté ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation reste proche de la structure hébraïque tout en explicitant par « les motifs sculptés » le collectif הַמְּחֻקֶּה. Aucun marqueur de note n’est requis.
