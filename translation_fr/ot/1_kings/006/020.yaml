  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: fr
  text: Le sanctuaire intérieur[a] avait vingt coudées de long, vingt coudées de large et vingt coudées de haut. Salomon le recouvrit d’or pur[b] et recouvrit aussi l’autel en bois de cèdre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Devant le sanctuaire intérieur », dans une phrase elliptique.'
    reason: ambiguïté syntaxique
  - marker: b
    text: 'Ou : « d’or fin ».'
    reason: alternative lexicale
  - marker: c
    text: 'Ou : « un autel en bois de cèdre ».'
    reason: alternative grammaticale
lexical_decisions:
- source_word: לִפְנֵי הַדְּבִיר
  choice: Le sanctuaire intérieur
  rationale: La tournure hébraïque est elliptique et signifie littéralement « devant le sanctuaire intérieur ». Dans le contexte, les dimensions et le pronom objet qui suit renvoient au sanctuaire intérieur lui-même. Le texte principal privilégie donc une formulation française intelligible, tandis qu’une note conserve l’ambiguïté syntaxique.
- source_word: הַדְּבִיר
  choice: le sanctuaire intérieur
  rationale: דְּבִיר désigne la pièce la plus intérieure du temple. « Sanctuaire intérieur » est clair, digne et moins interprétatif que « Saint des saints ».
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: vingt coudées de long, vingt coudées de large et vingt coudées de haut
  rationale: Cette formulation naturelle reproduit exactement les trois dimensions et conserve l’unité de mesure ancienne sans conversion approximative.
- source_word: וַיְצַפֵּהוּ
  choice: le recouvrit
  rationale: Le verbe צפה décrit ici l’action de revêtir une surface d’or. « Recouvrir » est naturel en français courant et convient au contexte architectural.
- source_word: זָהָב סָגוּר
  choice: or pur
  rationale: L’expression désigne un or raffiné de haute qualité. « Or pur » est idiomatique; « or fin » demeure une possibilité lexicale signalée en note.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: recouvrit aussi l’autel en bois de cèdre
  rationale: La séquence désigne vraisemblablement un autel fait de cèdre. L’article défini convient au référent connu dans ce contexte, mais l’absence d’article en hébreu permet aussi « un autel », possibilité conservée en note.
theological_decisions:
- issue: Désignation du דְּבִיר
  choice: sanctuaire intérieur
  alternative: Saint des saints
  rationale: Le choix retenu décrit sobrement la pièce sans importer une appellation technique ou cultuelle plus marquée que le mot hébreu dans ce verset.
translation_notes:
  register: Français international moderne, sobre et digne. Le nom « Salomon » explicite le sujet implicite du verbe hébreu afin d’éviter en français une reprise pronominale ambiguë. Les trois marqueurs [a], [b] et [c] figurent dans le texte principal et correspondent exactement aux notes.
