  text: וְ/אֵת֙ פֶּ֣תַח הַ/דְּבִ֔יר עָשָׂ֖ה דַּלְת֣וֹת עֲצֵי שָׁ֑מֶן הָ/אַ֥יִל מְזוּז֖וֹת חֲמִשִֽׁית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/031.yaml
  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: fr
  text: Pour l’entrée du sanctuaire intérieur, il fit des portes en bois d’olivier ; le cadre et les montants étaient à cinq côtés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le cadre et les montants représentaient un cinquième ». Cette traduction traditionnelle du dernier membre de phrase reste difficile à interpréter sur le plan architectural.'
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: entrée
  rationale: Le terme désigne ici l’ouverture donnant accès à la pièce, distincte des portes mentionnées ensuite.
- source_word: הַדְּבִיר
  choice: sanctuaire intérieur
  rationale: Dans le contexte du temple, דְּבִיר désigne la pièce la plus intérieure. Cette formulation claire évite d’imposer une terminologie cultuelle postérieure.
- source_word: דַּלְת֣וֹת
  choice: portes
  rationale: Le pluriel renvoie naturellement aux deux battants, sans recourir au terme plus technique « vantaux ».
- source_word: עֲצֵי שָׁמֶן
  choice: bois d’olivier
  rationale: La locution désigne idiomatiquement du bois d’olivier.
- source_word: הָאַיִל
  choice: le cadre
  rationale: Dans cet emploi architectural, אַיִל semble désigner un élément porteur ou l’encadrement de l’ouverture ; « cadre » reste naturel tout en conservant la distinction avec מְזוּזוֹת.
- source_word: מְזוּזוֹת
  choice: les montants
  rationale: Le mot désigne les éléments verticaux latéraux de l’encadrement d’une porte.
- source_word: חֲמִשִׁית
  choice: formaient un ensemble à cinq côtés
  rationale: L’hébreu est très elliptique. Dans ce contexte architectural, le terme paraît décrire une structure à cinq côtés, mais une autre analyse grammaticale demeure possible et est signalée en note.
