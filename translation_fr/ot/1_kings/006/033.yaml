base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/033.yaml
  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: fr
  text: De même, il fit pour l’entrée de la grande salle des montants en bois d’olivier, à quatre côtés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens de l’expression hébraïque est incertain. Littéralement, elle signifie quelque chose comme « d’une quatrième part » ; elle peut désigner une forme à quatre côtés, une forme carrée ou un encadrement à quatre côtés.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: De même
  rationale: Marque la correspondance avec l’aménagement décrit au verset précédent, dans un français naturel.
- source_word: עָשָׂה
  choice: il fit
  rationale: Rend simplement le verbe courant עשה dans ce contexte de construction.
- source_word: לְפֶתַח הַהֵיכָל
  choice: pour l’entrée de la grande salle
  rationale: פתח désigne ici l’entrée architecturale, et היכל la salle principale du Temple, distincte du sanctuaire intérieur.
- source_word: מְזוּזוֹת
  choice: des montants
  rationale: Désigne les éléments verticaux qui encadrent l’entrée; «montants» est précis et naturel en français architectural.
- source_word: עֲצֵי שָׁמֶן
  choice: en bois d’olivier
  rationale: Équivalent idiomatique traditionnel et contextuellement probable de l’expression hébraïque.
- source_word: מֵאֵת רְבִעִית
  choice: formant un cadre à quatre côtés
  rationale: La formule hébraïque, littéralement proche de «d’une quatrième part», est obscure. Le rendu proposé exprime une interprétation architecturale plausible tout en signalant l’incertitude en note.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. «Grande salle» évite le terme spécialisé «nef», potentiellement trompeur pour l’architecture du Temple. L’obscurité de la dernière expression hébraïque est conservée au moyen d’une note.
