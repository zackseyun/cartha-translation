  text: וְ/אֶת קַרְקַ֥ע הַ/בַּ֖יִת צִפָּ֣ה זָהָ֑ב לִ/פְנִ֖ימָה וְ/לַ/חִיצֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: fr
  text: Il recouvrit d’or le sol de la Maison[a], à l’intérieur comme à l’extérieur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sol du Temple ». L’hébreu dit littéralement « le sol de la maison ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « à l’intérieur comme à l’extérieur » signifie probablement que le sol était recouvert d’or sur toute son étendue, depuis la partie intérieure jusqu’à la partie extérieure.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: sol
  rationale: Dans ce contexte architectural, le terme désigne la surface sur laquelle on marche à l’intérieur de l’édifice; « sol » est naturel en français moderne.
- source_word: הַבַּיִת
  choice: la Maison
  rationale: L’hébreu dit littéralement « la maison », désignation habituelle du Temple dans ce contexte. La majuscule signale cet emploi particulier sans remplacer le terme source par une explicitation.
- source_word: צִפָּה
  choice: recouvrit
  rationale: Le verbe décrit l’application d’un revêtement sur une surface. « Recouvrir d’or » est idiomatique et précis en français architectural.
- source_word: זָהָב
  choice: d’or
  rationale: Rendu direct du matériau; la construction française naturelle avec « recouvrir » est « recouvrir d’or ».
- source_word: לִפְנִימָה
  choice: à l’intérieur
  rationale: Le terme indique la partie intérieure et forme un contraste spatial avec le terme suivant.
- source_word: וְלַחִיצוֹן
  choice: comme à l’extérieur
  rationale: Cette formulation française rend la paire corrélative intérieure-extérieure tout en préservant la brièveté quelque peu énigmatique de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « La Maison » conserve la désignation hébraïque du sanctuaire; les notes maintiennent l’alternative « Temple » et expliquent sans l’imposer le sens probable de la formule spatiale.
