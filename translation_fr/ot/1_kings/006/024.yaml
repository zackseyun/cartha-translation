base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: fr
  text: 'Une aile du chérubin mesurait cinq coudées, et sa seconde aile mesurait cinq coudées : d’une extrémité de ses ailes à l’autre extrémité, il y avait dix coudées.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus près de l’hébreu : « des extrémités de ses ailes jusqu’aux extrémités de ses ailes », c’est-à-dire d’une extrémité d’aile à l’autre.'
    reason: La formulation hébraïque répète « les extrémités de ses ailes »; le texte principal en donne le sens naturel en français.
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinq coudées
  rationale: « Coudée » est l’équivalent français traditionnel et précis de אַמָּה dans une description architecturale.
- source_word: כְּנַף
  choice: aile
  rationale: Dans la représentation des chérubins du temple, כָּנָף désigne clairement une aile.
- source_word: הַכְּרוּב
  choice: le chérubin
  rationale: Le nom est au singulier et désigne ici chacune des figures sculptées; « chérubin » est le terme français établi.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: une aile ... sa seconde aile
  rationale: Cette formulation naturelle maintient la distinction entre les deux ailes tout en reflétant l’opposition hébraïque entre « l’une » et « la seconde ».
- source_word: עֶשֶׂר אַמּוֹת
  choice: dix coudées
  rationale: Il s’agit de la mesure totale de l’envergure.
- source_word: מִקְצוֹת כְּנָפָיו וְעַד קְצוֹת כְּנָפָיו
  choice: d’une extrémité de ses ailes à l’autre
  rationale: La tournure exprime naturellement en français toute la distance entre les deux extrémités des ailes, sans ajouter le terme technique « envergure » absent de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « mesurait » explicite la construction nominale hébraïque et convient au contexte architectural. Le possessif « sa » rattache sans ambiguïté la seconde aile au même chérubin.
