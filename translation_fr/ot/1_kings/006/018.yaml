  text: וְ/אֶ֤רֶז אֶל הַ/בַּ֨יִת֙ פְּנִ֔ימָה מִקְלַ֣עַת פְּקָעִ֔ים וּ/פְטוּרֵ֖י צִצִּ֑ים הַ/כֹּ֣ל אֶ֔רֶז אֵ֥ין אֶ֖בֶן נִרְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/018.yaml
  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: fr
  text: Le cèdre qui revêtait l’intérieur de la Maison était sculpté de coloquintes[a] et de fleurs épanouies[b]. Tout était en cèdre ; aucune pierre n’était visible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « boutons ». Le terme hébreu désigne des formes ornementales arrondies et peut évoquer ici des sculptures en forme de coloquintes ou de courges.
    reason: lexical_alternative
  - marker: b
    text: Ou « fleurs ouvertes ». L’hébreu décrit vraisemblablement des fleurs sculptées en pleine floraison.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: cèdre
  rationale: Le nom désigne ici le bois de cèdre servant au revêtement intérieur ; « cèdre » est naturel et précis en français.
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: À l’intérieur de la Maison
  rationale: La tournure situe le revêtement de cèdre sur les surfaces intérieures du temple. La majuscule à « Maison » indique naturellement, dans ce contexte, la Maison de l’Éternel sans ajouter un référent absent du verset.
- source_word: מִקְלַעַת
  choice: était sculpté de motifs
  rationale: Le terme évoque un travail décoratif incisé ou sculpté. L’ajout de « motifs » rend en français le caractère ornemental des formes représentées.
- source_word: פְּקָעִים
  choice: coloquintes
  rationale: Dans les descriptions du temple, le mot désigne vraisemblablement des ornements arrondis en forme de coloquintes ou de courges. « Coloquintes » conserve l’image végétale traditionnelle, avec une note signalant l’incertitude.
- source_word: וּפְטוּרֵי צִצִּים
  choice: et de fleurs épanouies
  rationale: L’expression décrit probablement des fleurs ouvertes ou des floraisons sculptées. « Fleurs épanouies » est clair, actuel et digne.
- source_word: הַכֹּל אֶרֶז
  choice: Tout était en cèdre
  rationale: Cette formulation concise résume que toutes les surfaces visibles étaient revêtues de cèdre.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: aucune pierre n’était visible
  rationale: La formulation française préserve le sens passif et indique que la maçonnerie était entièrement dissimulée.
