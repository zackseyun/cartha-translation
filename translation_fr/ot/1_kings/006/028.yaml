  text: And he overlaid the cherubim with gold[a].
translation:
  language: fr
  text: Il recouvrit d’or les chérubins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plaqua d’or les chérubins » ou « couvrit d’or les chérubins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: recouvrit
  rationale: Dans ce contexte de construction du temple, le verbe צפה désigne l’action de couvrir un objet d’une couche de matériau, ici d’or. « Recouvrir d’or » est naturel en français et conserve le sens sans préciser indûment la technique.
- source_word: אֶת
  choice: non traduit
  rationale: אֶת marque le complément d’objet direct défini et n’a pas d’équivalent lexical autonome en français.
- source_word: הַכְּרוּבִים
  choice: les chérubins
  rationale: « Chérubins » est le pluriel français établi dans le vocabulaire biblique et convient aux figures monumentales du temple.
- source_word: זָהָב
  choice: d’or
  rationale: Le nom indique le matériau appliqué. Après « recouvrir », la construction française idiomatique est « recouvrir d’or ».
