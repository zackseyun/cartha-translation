id: 1KI.6.22
reference: 1 Kings 6:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת כָּל הַ/בַּ֛יִת צִפָּ֥ה זָהָ֖ב עַד תֹּ֣ם כָּל הַ/בָּ֑יִת וְ/כָל הַ/מִּזְבֵּ֥חַ אֲֽשֶׁר לַ/דְּבִ֖יר צִפָּ֥ה זָהָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: fr
  text: Il revêtit d’or tout le Temple, jusqu’à ce que l’ensemble du Temple soit achevé ; il revêtit aussi d’or l’autel tout entier qui était rattaché au sanctuaire intérieur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui appartenait au sanctuaire intérieur ». L’hébreu indique un lien avec le sanctuaire intérieur sans en préciser exactement la nature ni la position de l’autel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: le Temple
  rationale: Le nom signifie littéralement « maison », mais, dans ce contexte architectural, il désigne clairement le Temple. « Le Temple » est immédiatement compréhensible en français moderne tout en conservant le référent.
- source_word: צִפָּה
  choice: revêtit
  rationale: Le verbe désigne ici l’application d’un matériau précieux sur une surface. « Revêtir d’or » est précis, naturel et adapté au registre de la construction du Temple.
- source_word: זָהָב
  choice: or
  rationale: Équivalent direct et non ambigu du matériau mentionné.
- source_word: עַד תֹּם
  choice: jusqu’à ce que … soit achevé
  rationale: Cette formulation française rend la progression jusqu’à l’achèvement exprimée par la locution hébraïque, sans la réduire silencieusement à un simple adverbe comme « entièrement ».
- source_word: כָּל הַמִּזְבֵּחַ
  choice: l’autel tout entier
  rationale: Cette tournure idiomatique exprime clairement la totalité de l’autel visée par כָּל.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: qui était rattaché au sanctuaire intérieur
  rationale: La préposition ל marque une relation avec le sanctuaire intérieur sans déterminer avec certitude une localisation précise. « Rattaché à » préserve cette relative indétermination.
- source_word: דְּבִיר
  choice: sanctuaire intérieur
  rationale: Ce terme clair en français moderne désigne la pièce la plus intérieure du Temple. Il évite l’archaïsme « oracle » et ne remplace pas directement le terme architectural par une désignation théologique traditionnelle.
theological_decisions:
- issue: Nature du lien entre l’autel et le דְּבִיר
  choice: rattachement au sanctuaire intérieur
  alternative: présence dans le sanctuaire intérieur / emplacement devant le sanctuaire intérieur
  rationale: L’hébreu indique une association au moyen de ל sans préciser à lui seul si l’autel se trouvait dans le sanctuaire, devant lui, ou s’il lui appartenait fonctionnellement. La traduction conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. « Temple » privilégie la clarté contextuelle par rapport au littéral « Maison ». La répétition de « Temple » et de « revêtit d’or » conserve l’insistance et la structure du texte hébreu.
