base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: fr
  text: La Maison[a], c’est-à-dire la grande salle située devant le sanctuaire intérieur, avait quarante coudées de long.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la salle principale située devant le sanctuaire intérieur ». L’hébreu précise que « la Maison » est le הֵיכָל (hékhal), la pièce principale devant le sanctuaire intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים בָּ/אַמָּה
  choice: avait quarante coudées de long
  rationale: La conjonction poursuit la description architecturale; en français, la tournure « avait … de long » exprime naturellement cette dimension. אַמָּה désigne la coudée.
- source_word: הַ/בָּיִת
  choice: la Maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici l’édifice du temple. La majuscule signale cet emploi particulier sans remplacer le terme hébreu par une interprétation.
- source_word: ה֖וּא
  choice: c’est-à-dire
  rationale: Le pronom a ici une valeur explicative ou appositionnelle et précise ce que désigne « la Maison ».
- source_word: הַ/הֵיכָל
  choice: la grande salle
  rationale: הֵיכָל désigne dans ce contexte la pièce principale de l’édifice, distincte du sanctuaire intérieur. « Grande salle » est précis et plus immédiatement compréhensible que le terme architectural « nef ».
- source_word: לִ/פְנָֽ/י
  choice: située devant le sanctuaire intérieur
  rationale: L’expression signifie « devant »; son complément implicite est, d’après le verset précédent, le sanctuaire intérieur. Celui-ci est explicité afin que la relation architecturale soit claire en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Grande salle » évite l’ambiguïté ecclésiastique de « nef », tandis que « sanctuaire intérieur » conserve la distinction architecturale du contexte.
