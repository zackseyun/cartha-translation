    issue: Ajout de « ainsi »
    rationale: Le texte hébreu enchaîne simplement « et il fit des pièces latérales tout autour » ; « ainsi » introduit une nuance de conséquence ou de manière qui n’est pas explicitement marquée.
  - severity: low
    issue: « aménagea » est légèrement moins direct que le verbe source
    rationale: וַיַּעַשׂ signifie ici « il fit »/« il réalisa ». « Aménagea » reste possible dans le contexte architectural, mais « fit » conserve plus exactement l’énoncé sans préciser le type d’intervention.
