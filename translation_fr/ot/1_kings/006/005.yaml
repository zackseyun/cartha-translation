  text: וַ/יִּבֶן֩ עַל קִ֨יר הַ/בַּ֤יִת יצוע סָבִ֔יב אֶת קִיר֤וֹת הַ/בַּ֨יִת֙ סָבִ֔יב לַֽ/הֵיכָ֖ל וְ/לַ/דְּבִ֑יר וַ/יַּ֥עַשׂ צְלָע֖וֹת סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: fr
  text: Il construisit contre le mur de la Maison une annexe tout autour[a], le long des murs de la Maison, autour de la grande salle[b] et du sanctuaire intérieur[c] ; il fit des pièces latérales tout autour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une structure périphérique ». Le mot hébreu est rare et désigne ici la construction adossée aux murs du Temple.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne la salle principale du Temple, distincte du sanctuaire intérieur.
    reason: cultural_note
  - marker: c
    text: Ou « le Lieu très saint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il construisit
  rationale: Le passé simple convient au registre narratif soutenu et rend naturellement le wayyiqtol de בנה.
- source_word: עַל קִיר הַבַּיִת
  choice: contre le mur de la Maison
  rationale: Dans ce contexte architectural, עַל indique une construction adossée au mur plutôt que posée sur celui-ci.
- source_word: יצוע
  choice: une annexe
  rationale: Ce nom rare désigne ici l'ensemble architectural entourant l'édifice. « Annexe » reste compréhensible sans imposer une reconstitution trop précise.
- source_word: סָבִיב
  choice: tout autour / autour
  rationale: La répétition est en grande partie conservée afin de rendre l'insistance du texte sur la disposition périphérique.
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: le long des murs de la Maison
  rationale: Le pluriel « murs » est conservé ; « le long de » exprime naturellement la disposition de l'annexe contre leur pourtour.
- source_word: לַהֵיכָל
  choice: autour de la grande salle
  rationale: הֵיכָל désigne ici la pièce principale du Temple, distincte du sanctuaire intérieur. « Grande salle » est clair en français courant.
- source_word: וְלַדְּבִיר
  choice: et du sanctuaire intérieur
  rationale: דְּבִיר désigne la pièce sacrée la plus intérieure ; cette formulation conserve la distinction spatiale sans privilégier une terminologie confessionnelle.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: il aménagea ainsi des pièces latérales
  rationale: Dans ce cadre architectural, צְלָעוֹת désigne des pièces sur les côtés. « Aménagea » rend l'action sans suggérer qu'elles seraient indépendantes de l'annexe déjà mentionnée.
theological_decisions:
- issue: Désignation du דְּבִיר
  choice: sanctuaire intérieur
  alternative: Lieu très saint
  rationale: « Sanctuaire intérieur » traduit directement la fonction et la position de la pièce, tout en évitant d'imposer une désignation liturgique plus interprétative.
translation_notes:
  register: Français international moderne, digne et lisible. « Maison » avec majuscule signale dans ce contexte l'édifice consacré à Dieu. La syntaxe conserve l'insistance hébraïque sur le pourtour, tout en évitant une lourdeur excessive.
