revisions:
- from: Il construisit contre le mur de la Maison une annexe tout autour[a], le long des murs de la Maison, autour de la grande salle[b] et du sanctuaire intérieur[c] ; il aménagea ainsi des pièces latérales tout autour.
  to: Il construisit contre le mur de la Maison une annexe tout autour[a], le long des murs de la Maison, autour de la grande salle[b] et du sanctuaire intérieur[c] ; il fit des pièces latérales tout autour.
  rationale: La révision retire l’ajout non exprimé « ainsi » et remplace « aménagea » par « fit », plus proche du verbe hébreu. Elle conserve les choix lexicaux prudents, la distinction entre les deux espaces du Temple, les répétitions périphériques du source et les trois ancres de notes.
