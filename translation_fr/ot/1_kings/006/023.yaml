  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: fr
  text: Dans le sanctuaire intérieur[a], il fit deux chérubins en bois d’olivier. Chacun avait dix coudées de haut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le lieu très saint ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sa hauteur était de dix coudées »; le singulier est compris au sens distributif et se rapporte à chacun des deux chérubins.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: dans le sanctuaire intérieur
  rationale: דְּבִיר désigne la salle la plus intérieure du Temple. « Sanctuaire intérieur » est clair, naturel et n’impose pas une désignation technique plus tardive.
- source_word: כְרוּבִים
  choice: chérubins
  rationale: « Chérubins » est le terme biblique français consacré pour ces êtres particuliers et correspond au pluriel hébreu.
- source_word: עֲצֵי שָׁמֶן
  choice: en bois d’olivier
  rationale: L’expression désigne ici le bois de l’olivier; cette formulation est idiomatique en français moderne.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dix coudées
  rationale: La coudée est l’unité de longueur ancienne correspondant à אַמָּה et constitue l’équivalent français traditionnel et précis.
- source_word: קוֹמָתוֹ
  choice: Chacun avait dix coudées de haut
  rationale: L’hébreu emploie littéralement le singulier « sa hauteur », compris distributivement pour chacun des deux chérubins. La formulation française rend ce sens clairement tout en signalant la forme littérale en note.
- source_word: וַיַּעַשׂ
  choice: il fit
  rationale: Le verbe עשה signifie couramment « faire ». « Il fit » convient au registre narratif biblique tout en restant compréhensible.
theological_decisions:
- issue: Désignation du דְּבִיר
  choice: sanctuaire intérieur
  alternative: lieu très saint
  rationale: Le choix décrit l’emplacement sans imposer une terminologie cultuelle particulière; l’autre traduction possible est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour éviter une construction lourde et rendre explicitement la valeur distributive du singulier hébreu.
