  text: וּ/שְׁתֵּי֮ דַּלְת֣וֹת עֲצֵי שֶׁמֶן֒ וְ/קָלַ֣ע עֲ֠לֵי/הֶם מִקְלְע֨וֹת כְּרוּבִ֧ים וְ/תִמֹר֛וֹת וּ/פְטוּרֵ֥י צִצִּ֖ים וְ/צִפָּ֣ה זָהָ֑ב וַ/יָּ֛רֶד עַל הַ/כְּרוּבִ֥ים וְ/עַל הַ/תִּֽמֹר֖וֹת אֶת הַ/זָּהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: fr
  text: Les deux battants étaient aussi en bois d’olivier. Il y sculpta des chérubins, des palmiers et des fleurs épanouies, puis les recouvrit d’or. Il appliqua[a] l’or sur les chérubins et sur les palmiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fit descendre l’or » ; l’expression décrit l’application de l’or sur les motifs sculptés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: Les deux battants étaient aussi en bois d’olivier
  rationale: דַּלְתוֹת désigne ici les deux panneaux ou battants de la porte. עֲצֵי שֶׁמֶן est rendu par l’expression française traditionnelle et intelligible « bois d’olivier ». « Aussi » exprime le lien additif de ו avec la description précédente.
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  choice: Il y sculpta
  rationale: Le verbe et le nom apparenté décrivent un travail ornemental taillé dans le bois. En français, « y sculpta » évite la lourdeur d’une répétition comme « sculpta des sculptures » tout en conservant l’action concrète.
- source_word: כְּרוּבִים
  choice: des chérubins
  rationale: « Chérubins » est le terme français biblique courant pour ces êtres associés au sanctuaire, sans les réduire à des figures enfantines.
- source_word: תִמֹרוֹת
  choice: des palmiers
  rationale: Dans ce décor architectural, le mot désigne des représentations de palmiers ; « palmiers » est clair et naturel.
- source_word: וּפְטוּרֵי צִצִּים
  choice: des fleurs épanouies
  rationale: L’expression décrit des motifs floraux ouverts ou en floraison. « Fleurs épanouies » restitue leur aspect visuel sans préciser indûment l’espèce.
- source_word: וְצִפָּה זָהָב
  choice: puis les recouvrit d’or
  rationale: צפה désigne le fait de plaquer ou revêtir un objet de métal. « Recouvrir d’or » est naturel en français et convient au travail de dorure décrit.
- source_word: וַיָּרֶד ... אֶת הַזָּהָב
  choice: Il appliqua l’or sur
  rationale: La tournure hébraïque inhabituelle évoque littéralement le fait de faire descendre l’or sur les reliefs. « Appliqua » exprime clairement l’opération de dorure sans imposer une technique particulière.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: sur les chérubins et sur les palmiers
  rationale: La répétition de « sur » reproduit l’insistance structurelle du double עַל et identifie précisément les motifs dorés.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Battants » convient mieux que « portes » aux deux panneaux d’une même ouverture. La syntaxe a été légèrement explicitée pour produire une phrase française naturelle, sans ajouter de détail architectural ni résoudre au-delà du contexte la formulation inhabituelle du dernier verbe.
