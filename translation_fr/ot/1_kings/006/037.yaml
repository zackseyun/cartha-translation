source:
  edition: WLC
  text: בַּ/שָּׁנָה֙ הָֽ/רְבִיעִ֔ית יֻסַּ֖ד בֵּ֣ית יְהוָ֑ה בְּ/יֶ֖רַח זִֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: fr
  text: La quatrième année, les fondations de la maison de Yahweh furent posées[a], au mois de Ziv.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « la maison de Yahweh fut fondée ».'
    reason: Le passif hébreu peut être rendu soit par l’expression architecturale « les fondations furent posées », soit plus littéralement par « la maison fut fondée ».
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: La quatrième année
  rationale: L’expression hébraïque indique simplement le moment. Le règne de Salomon est connu par le contexte, mais n’est pas précisé dans ce verset; il n’est donc pas ajouté.
- source_word: יֻסַּד
  choice: les fondations … furent posées
  rationale: Le passif de יסד désigne ici l’établissement des fondations d’un bâtiment. Cette tournure est naturelle en français et rend clairement l’image architecturale.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image concrète de בַּיִת tout en désignant clairement, dans ce contexte, le sanctuaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par « Yahweh », conformément à la forme personnelle du tétragramme dans le texte source.
- source_word: בְּיֶרַח זִו
  choice: au mois de Ziv
  rationale: La formulation traduit directement le nom propre du mois sans ajouter qu’il s’agit du deuxième mois, précision donnée par le contexte mais absente de ce verset.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le caractère de nom propre sans introduire une substitution traditionnelle.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la structure hébraïque tout en employant l’expression française naturelle « poser les fondations ».
