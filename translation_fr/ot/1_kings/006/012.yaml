  to: Quant à cette maison que tu bâtis, si tu te conduis selon mes prescriptions, si tu mets en pratique mes ordonnances et si tu gardes tous mes commandements en vivant selon eux, alors j’accomplirai à ton égard la parole[a] que j’ai adressée à David, ton père.
