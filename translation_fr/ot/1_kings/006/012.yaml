  text: הַ/בַּ֨יִת הַ/זֶּ֜ה אֲשֶׁר אַתָּ֣ה בֹנֶ֗ה אִם תֵּלֵ֤ךְ בְּ/חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֣/י תַּֽעֲשֶׂ֔ה וְ/שָׁמַרְתָּ֥ אֶת כָּל מִצְוֺתַ֖/י לָ/לֶ֣כֶת בָּ/הֶ֑ם וַ/הֲקִמֹתִ֤י אֶת דְּבָרִ/י֙ אִתָּ֔/ךְ אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל דָּוִ֥ד אָבִֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: fr
  text: Quant à cette maison que tu bâtis, si tu te conduis selon mes prescriptions, si tu mets en pratique mes ordonnances et si tu gardes tous mes commandements en vivant selon eux, alors j’accomplirai à ton égard la parole[a] que j’ai adressée à David, ton père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « je confirmerai auprès de toi ma parole » ou « j’établirai avec toi ma parole ». L’expression hébraïque signifie rendre effective, confirmer ou accomplir ce qui a été déclaré auparavant.'
    reason: Alternative lexicale et explication de l’idiome hébraïque הקים דבר.
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: cette maison
  rationale: Le nom בַּיִת signifie littéralement « maison ». Le contexte désigne le Temple, mais « maison » conserve l’expression hébraïque et sa portée théologique sans explicitation inutile.
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  choice: que tu bâtis
  rationale: Le participe בֹנֶה présente la construction comme une action en cours. « Que tu bâtis » est naturel, actuel et plus solennel que « que tu es en train de construire ».
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: si tu te conduis selon mes prescriptions
  rationale: הלך avec ב décrit la manière de vivre ou de se conduire. Cette formulation restitue le sens de la métaphore sans imposer au français le calque moins naturel « marcher dans ». חֻקּוֹת est rendu par « prescriptions », terme approprié au cadre de l’alliance.
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: si tu mets en pratique mes règles
  rationale: עשה indique ici l’exécution concrète, tandis que מִשְׁפָּטִים désigne des règles ou décisions normatives. « Mettre en pratique » est idiomatique et garde la force juridique du propos.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: si tu gardes tous mes commandements
  rationale: שׁמר appliqué aux commandements signifie les garder ou les observer. « Garder » conserve le vocabulaire biblique de la fidélité tout en restant intelligible.
- source_word: לָלֶכֶת בָּהֶם
  choice: en vivant selon eux
  rationale: L’infinitif précise la mise en œuvre concrète des commandements. « En vivant selon eux » exprime naturellement en français la conduite durable impliquée par l’image hébraïque de la marche.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: alors je confirmerai à ton égard la parole
  rationale: L’expression הקים דבר signifie rendre ferme ou confirmer une parole antérieure. « Confirmer » restitue clairement l’idiome, « à ton égard » représente אִתָּךְ sans transformer arbitrairement la relation en bénéfice, et « alors » rend explicite l’apodose de la condition.
- source_word: דְּבָרִי
  choice: la parole
  rationale: דָּבָר peut désigner une parole ou, contextuellement, une promesse. « Parole » maintient le lien lexical avec le verbe « adresser » qui suit, tandis que la note signale la valeur promissoire possible.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: que j’ai adressée à David, ton père
  rationale: דבר אל signifie parler ou adresser une parole à quelqu’un. La formulation française évite le tour peu naturel « que j’ai parlée à » et n’explicite pas davantage que l’hébreu le contenu comme une promesse.
theological_decisions:
- issue: Rapport conditionnel entre la construction du Temple, l’obéissance de Salomon et la parole donnée à David
  choice: 'Conserver clairement la structure conditionnelle : l’affermissement de la parole à l’égard de Salomon est lié à son obéissance.'
  alternative: Présenter le verset soit comme la simple réaffirmation d’une alliance entièrement inconditionnelle, soit comme l’annulation de tout élément inconditionnel de la promesse davidique.
  rationale: La syntaxe hébraïque énonce explicitement une condition introduite par אִם et sa conséquence. La traduction maintient cette tension sans résoudre dans le texte les rapports théologiques plus larges entre les dimensions conditionnelles et inconditionnelles de l’alliance davidique.
translation_notes:
  register: Français international moderne, digne et accessible. « Bâtis » et « parole » gardent une légère couleur biblique sans archaïsme. La reprise de « si » clarifie la série des trois conditions. Le marqueur de note est placé après « la parole », expression directement concernée par la note.
