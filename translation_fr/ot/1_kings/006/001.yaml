source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: fr
  text: Il arriva que, la quatre-cent-quatre-vingtième année après la sortie des fils d’Israël du pays d’Égypte[a], la quatrième année du règne de Salomon sur Israël, au mois de Ziv[b] — c’est-à-dire le deuxième mois —, Salomon construisit[c] la maison de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « les Israélites » ou « le peuple d’Israël ».
    reason: lexical_alternative
  - marker: b
    text: Ziv était l’ancien nom du deuxième mois du calendrier hébreu.
    reason: cultural_note
  - marker: c
    text: Ou « commença à construire ». Le verbe hébreu signifie simplement « construisit », mais le contexte situe ici le commencement des travaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva que
  rationale: Cette formule conserve la transition narrative et l’introduction solennelle d’un repère chronologique, sans recourir à l’archaïsme « il advint ».
- source_word: בִּשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: la quatre cent quatre-vingtième année
  rationale: L’hébreu désigne une année précise dans un décompte, et non simplement une durée de 480 ans.
- source_word: לְצֵאת
  choice: après la sortie
  rationale: L’infinitif construit avec לְ fixe le point de départ du calcul chronologique. « Après la sortie » est naturel en français et évite de substituer le terme interprétatif « exode ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Ce rendu garde l’image familiale et collective de l’expression hébraïque; une note signale les formulations françaises plus courantes.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: du pays d’Égypte
  rationale: Le mot אֶרֶץ, « pays », est explicitement présent dans le texte source.
- source_word: בְּחֹדֶשׁ זִו
  choice: au mois de Ziv
  rationale: Le nom historique du mois est conservé plutôt que remplacé par une équivalence calendaire approximative.
- source_word: הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: c’est-à-dire le deuxième mois
  rationale: Cette tournure rend naturellement la précision explicative donnée par le texte.
- source_word: לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: la quatrième année du règne de Salomon sur Israël
  rationale: La formulation française exprime clairement la datation selon les années du règne de Salomon.
- source_word: וַיִּבֶן
  choice: construisit
  rationale: Le verbe hébreu signifie simplement « construire ». Le contexte peut viser le commencement des travaux, possibilité conservée en note sans l’introduire directement dans le texte.
- source_word: הַבַּיִת לַיהוָה
  choice: la maison de Yahweh
  rationale: « Maison » préserve le terme hébreu plutôt que de l’expliciter par « temple »; « de Yahweh » exprime idiomatiquement en français la destination et l’appartenance indiquées par לְ.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Maintien de l’expression familiale בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites / le peuple d’Israël
  rationale: Le choix principal conserve l’image généalogique et collective de l’hébreu, tandis que la note reconnaît les équivalents idiomatiques possibles.
- issue: Commencement ou réalisation de la construction
  choice: construisit
  alternative: commença à construire
  rationale: Le verbe source ne comporte pas explicitement l’idée de commencement, même si la chronologie du récit indique qu’il s’agit du début du chantier. Cette tension est maintenue par une note.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La longue indication chronologique de l’hébreu est conservée, avec des virgules et des tirets pour en faciliter la lecture. « Il arriva que » maintient la couleur narrative biblique sans archaïsme excessif.
