  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: fr
  text: La hauteur de l’un des chérubins était de dix coudées[a] ; il en était de même pour le second chérubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coudée était une ancienne unité de longueur correspondant approximativement à la distance entre le coude et l’extrémité des doigts.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: La hauteur de
  rationale: קוֹמָה désigne la hauteur ou la stature. Dans ce contexte architectural, « hauteur » est le terme français le plus naturel et le plus précis.
- source_word: הַכְּרוּב הָאֶחָד
  choice: l’un des chérubins
  rationale: L’hébreu dit littéralement « le chérubin, l’un ». La formulation française distingue naturellement celui-ci de l’autre sans introduire l’idée interprétative de « premier ».
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dix coudées
  rationale: La mesure est donnée directement. Comme le mot « hauteur » précède déjà, il n’est pas nécessaire de répéter « de haut ».
- source_word: וְכֵן
  choice: il en était de même pour
  rationale: Cette tournure exprime clairement l’égalité de mesure entre les deux chérubins et reste naturelle en français moderne.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: le second chérubin
  rationale: Le texte hébreu emploie explicitement « le second ». Cette traduction en conserve la précision.
