  variant: modern international French
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָה֩ הָ/אַחַ֨ת עֶשְׂרֵ֜ה בְּ/יֶ֣רַח בּ֗וּל ה֚וּא הַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י כָּלָ֣ה הַ/בַּ֔יִת לְ/כָל דְּבָרָ֖י/ו וּ/לְ/כָל משפט/ו וַ/יִּבְנֵ֖/הוּ שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: fr
  text: La onzième année[a], au mois de Boul — c’est-à-dire le huitième mois —, le Temple fut achevé dans toutes ses parties et conformément à toutes ses prescriptions[b]. Salomon le construisit donc en sept ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Boul était l’ancien nom du huitième mois du calendrier israélite.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « dans tous ses détails et selon tout le plan prescrit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: La onzième année
  rationale: Rend naturellement en français l’expression ordinale hébraïque et conserve le repère chronologique.
- source_word: בְּיֶרַח בּוּל
  choice: au mois de Boul
  rationale: יֶרַח désigne ici un mois; le nom ancien Boul est translittéré en français.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: c’est-à-dire le huitième mois
  rationale: Cette formulation restitue clairement la valeur explicative de l’apposition hébraïque.
- source_word: כָּלָה הַבַּיִת
  choice: le Temple fut achevé
  rationale: כלה exprime l’achèvement de la construction. Dans ce contexte, הַבַּיִת désigne sans ambiguïté le Temple; la majuscule signale cet emploi spécifique en français courant.
- source_word: לְכָל דְּבָרָיו
  choice: dans toutes ses parties
  rationale: Dans le contexte architectural, דְּבָרָיו renvoie aux éléments ou détails de l’édifice plutôt qu’à des paroles.
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: conformément à toutes ses prescriptions
  rationale: מִשְׁפָּטוֹ évoque ici la forme, la règle ou le plan prescrit de l’édifice; «prescriptions» conserve cette nuance sans lui donner un sens strictement juridique.
- source_word: וַיִּבְנֵהוּ
  choice: Salomon le construisit donc
  rationale: Le nom explicite le sujet sous-entendu par le verbe hébreu et évite en français une ambiguïté après le passif; «donc» rend la reprise récapitulative du waw narratif.
- source_word: שֶׁבַע שָׁנִים
  choice: en sept ans
  rationale: Formulation française idiomatique pour la durée totale nécessaire à l’achèvement d’un ouvrage.
