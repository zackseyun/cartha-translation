  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
translation:
  language: fr
  text: et deux portes en bois de cyprès[a]. La première porte avait deux battants pliants[b], et la seconde, deux battants pliants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement « sapin ». Le mot hébreu désigne probablement le cyprès ou un conifère semblable.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « deux panneaux pivotants ». Les termes architecturaux hébreux sont rares, et leur sens précis est incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: portes
  rationale: Le pluriel désigne les deux portes, chacune étant ensuite décrite au singulier.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: en bois de cyprès
  rationale: « Cyprès » est une identification moderne courante de בְּרוֹשׁ, même si l’essence exacte de ce conifère demeure incertaine.
- source_word: צְלָעִים
  choice: battants
  rationale: Dans ce contexte architectural, le mot désigne vraisemblablement les parties articulées dont se compose une porte.
- source_word: גְּלִילִים
  choice: pliants
  rationale: Le terme évoque un mouvement de rotation ou de repli; « pliants » exprime naturellement la fonction probable de ces battants sans masquer l’incertitude, signalée en note.
- source_word: קְלָעִים
  choice: battants pliants
  rationale: Ce terme rare est parallèle à צְלָעִים dans la description de la seconde porte; une même traduction conserve le parallélisme architectural.
- source_word: הַדֶּלֶת הָאַחַת
  choice: la première porte
  rationale: Dans l’opposition avec « la seconde », le français idiomatique emploie naturellement « la première ».
- source_word: הַדֶּלֶת הַשֵּׁנִית
  choice: la seconde
  rationale: La reprise elliptique de « porte » évite une lourdeur tout en conservant clairement le contraste ordinal.
