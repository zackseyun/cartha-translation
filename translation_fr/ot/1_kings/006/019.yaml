  text: וּ/דְבִ֧יר בְּ/תוֹךְ הַ/בַּ֛יִת מִ/פְּנִ֖ימָה הֵכִ֑ין לְ/תִתֵּ֣ן שָׁ֔ם אֶת אֲר֖וֹן בְּרִ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/019.yaml
  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: fr
  text: Il aménagea le sanctuaire intérieur à l’intérieur de la maison, afin d’y placer l’arche de l’alliance de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבִיר
  choice: sanctuaire intérieur
  rationale: Dans le contexte du temple, le terme désigne la pièce la plus intérieure, où devait être placée l’arche. « Sanctuaire intérieur » exprime clairement son emplacement et sa fonction sans recourir au traditionnel mais obscur « oracle ».
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: au-dedans de la Maison
  rationale: Cette formulation rend la localisation interne exprimée par בְּתוֹךְ et מִפְּנִימָה, tout en évitant une répétition lourde avec « sanctuaire intérieur ». La majuscule à « Maison » indique naturellement ici la maison de Yahweh, c’est-à-dire le temple, sans remplacer le mot hébreu.
- source_word: הֵכִין
  choice: aménagea
  rationale: Le verbe signifie préparer ou rendre prêt en vue d’un usage. Dans le contexte d’une pièce du temple, « aménagea » est naturel et exprime la préparation fonctionnelle sans préciser indûment les travaux réalisés.
- source_word: לְתִתֵּן
  choice: afin d’y placer
  rationale: L’infinitif introduit le but de l’aménagement. « Afin de » rend explicitement cette valeur finale, et « y » reprend naturellement le sanctuaire intérieur.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: l’arche de l’alliance de Yahweh
  rationale: La formulation conserve de manière transparente la chaîne de dépendance hébraïque et le lien entre l’alliance et Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré comme un nom propre plutôt que remplacé par un titre, conformément au choix éditorial du projet.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin et suit le choix éditorial indiqué, sans lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et lisible. « Maison » conserve le terme hébreu בַּיִת tout en signalant par la majuscule qu’il s’agit du temple. La phrase garde la distinction entre le sanctuaire intérieur et l’ensemble de la Maison.
