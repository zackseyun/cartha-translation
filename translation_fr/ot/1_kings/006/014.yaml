  text: וַ/יִּ֧בֶן שְׁלֹמֹ֛ה אֶת הַ/בַּ֖יִת וַ/יְכַלֵּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/014.yaml
  text: So Solomon built the house and finished it[a].
translation:
  language: fr
  text: Ainsi, Salomon construisit la maison et l’acheva[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le temple ». L’hébreu dit littéralement « la maison », désignation courante du temple dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: construisit
  rationale: Le wayyiqtol qal de בנה présente une action passée dans la suite narrative. « Construisit » est naturel en français et convient à l’édification d’un bâtiment.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom שְׁלֹמֹה.
- source_word: הַבַּיִת
  choice: la maison
  rationale: בַּיִת signifie littéralement « maison ». Dans ce contexte, le mot désigne le temple, mais conserver « la maison » respecte la formulation hébraïque et l’usage récurrent du chapitre.
- source_word: וַיְכַלֵּהוּ
  choice: l’acheva
  rationale: Le piel de כלה avec suffixe masculin singulier signifie mener quelque chose à son terme. « L’acheva » rend avec concision le verbe et son pronom objet, qui renvoie à la maison.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple conserve la dignité du récit historique; « la maison » préserve le terme source tout en étant éclairé par une note.
