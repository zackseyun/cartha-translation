base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: fr
  text: L’étage inférieur avait cinq coudées de large, celui du milieu six coudées, et le troisième sept coudées. En effet, Salomon avait aménagé des décrochements[a] tout autour, à l’extérieur du temple, afin que les poutres ne soient pas fixées dans les murs du temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retraits », « ressauts » ou « renfoncements » ; le terme hébreu désigne un dispositif architectural dont la forme exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « afin de ne pas prendre dans les murs de la maison ». Le texte ne précise pas l’élément concerné ; les poutres sont déduites du contexte architectural.'
    reason: implicit_information
lexical_decisions:
- source_word: היצוע
  choice: l’étage
  rationale: Dans ce contexte architectural, le nom désigne un niveau de la structure latérale entourant le temple. « Étage » exprime clairement cette disposition en français courant.
- source_word: הַתַּחְתֹּנָה
  choice: inférieur
  rationale: Le terme désigne le niveau le plus bas dans la série formée par l’étage inférieur, celui du milieu et le troisième.
- source_word: בָּאַמָּה
  choice: coudées
  rationale: L’unité de mesure ancienne est conservée sans conversion afin de rester proche du texte source.
- source_word: רָחְבָּהּ
  choice: avait … de large
  rationale: Cette tournure rend naturellement en français la construction indiquant la largeur de chaque étage.
- source_word: הַתִּיכֹנָה
  choice: celui du milieu
  rationale: L’adjectif substantivé renvoie au niveau intermédiaire sans qu’il soit nécessaire de répéter « étage ».
- source_word: הַשְּׁלִישִׁית
  choice: le troisième
  rationale: L’ordinal désigne le troisième niveau de la structure latérale.
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit l’explication architecturale des largeurs croissantes.
- source_word: מִגְרָעוֹת
  choice: décrochements
  rationale: Le mot désigne vraisemblablement des retraits successifs ou ressauts dans la maçonnerie. « Décrochements » convient au contexte architectural tout en laissant ouverte la forme précise de l’aménagement.
- source_word: נָתַן לַבַּיִת סָבִיב חוּצָה
  choice: Salomon avait aménagé … tout autour, à l’extérieur du temple
  rationale: La formulation idiomatique exprime l’installation de ces décrochements sur le pourtour extérieur du bâtiment. « Salomon » explicite le sujet implicite d’après le contexte immédiat, et « temple » précise le référent de « maison ».
- source_word: לְבִלְתִּי אֲחֹז בְּקִירוֹת הַבָּיִת
  choice: afin que les poutres ne soient pas encastrées dans les murs du temple
  rationale: L’infinitif exprime le but. Le texte laisse implicite ce qui ne devait pas prendre appui dans les murs ; « les poutres » est explicité d’après le contexte de la structure latérale, tandis que la note conserve la formulation littérale et son ambiguïté.
