  yaml_path: translation/ot/1_kings/006/010.yaml
  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: fr
  text: Il construisit l’annexe latérale[a] contre l’ensemble du temple. Elle avait cinq coudées de hauteur, et il l’y fixa avec des bois de cèdre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chambres latérales »; le terme hébreu désigne probablement la construction attenante qui longeait le temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec des poutres de cèdre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il construisit
  rationale: Le wayyiqtol de בנה exprime l’action suivante du récit. Le passé simple convient au registre narratif français soutenu et courant de la traduction biblique.
- source_word: היצוע
  choice: l’annexe latérale
  rationale: Le terme désigne ici la construction attenante qui longeait le bâtiment du temple. « Annexe latérale » rend l’ensemble architectural sans le réduire avec certitude à des chambres individuelles.
- source_word: עַל כָּל הַבַּיִת
  choice: contre toute la longueur du temple
  rationale: עַל a ici une valeur spatiale d’appui ou de proximité. « Toute la longueur » explicite naturellement en français l’étendue de la construction le long du bâtiment, tandis que « temple » rend le référent contextuel de הַבַּיִת.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: Elle avait cinq coudées de hauteur
  rationale: Cette formulation française naturelle conserve la mesure et rattache le suffixe de « sa hauteur » à l’annexe latérale.
- source_word: וַיֶּאֱחֹז אֶת הַבַּיִת
  choice: il la fixa au temple
  rationale: אחז signifie fondamentalement « saisir, tenir »; dans ce contexte de construction, il décrit une liaison structurelle. Le pronom « la » reprend naturellement l’annexe, objet compris de l’opération d’assemblage.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: avec des pièces de bois de cèdre
  rationale: עֲצֵי désigne du bois ou des éléments en bois. Cette expression garde une certaine généralité architecturale sans imposer qu’il s’agisse précisément de poutres, de planches ou de solives.
