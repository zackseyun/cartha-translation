  text: He made for the house windows with recessed frames[a].
translation:
  language: fr
  text: Il fit pour le temple des fenêtres aux encadrements en retrait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les termes hébreux employés ici sont rares dans ce contexte architectural et leur sens est incertain. L’expression est aussi comprise comme désignant des encadrements biseautés, des embrasures qui se resserrent, des fenêtres à encadrements fixes ou fermés, ou des fenêtres larges à l’intérieur et étroites à l’extérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: il fit
  rationale: Le wayyiqtol de עשה exprime ici l’action narrative simple de faire ou de construire.
- source_word: לַבָּיִת
  choice: pour le temple
  rationale: La préposition ל indique ce pour quoi les fenêtres furent faites. Dans ce contexte, בַּיִת désigne clairement l’édifice du temple; « temple » évite en français l’ambiguïté de « maison » tout en conservant le sens contextuel.
- source_word: חַלּוֹנֵי
  choice: des fenêtres
  rationale: Pluriel construit de חַלּוֹן, terme ordinaire pour des fenêtres ou ouvertures de fenêtre.
- source_word: שְׁקֻפִים אֲטֻמִים
  choice: à cadres en retrait
  rationale: Ces deux termes architecturaux rares décrivent vraisemblablement la forme ou l’aménagement fixe des ouvertures. « À cadres en retrait » offre une formulation lisible sans prétendre reconstituer avec certitude le dispositif exact; l’incertitude et les principales autres analyses sont signalées en note.
