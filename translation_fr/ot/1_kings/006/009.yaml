  text: So he built the house and finished it, and he covered the house with beams and rows of cedar.
translation:
  language: fr
  text: Il bâtit le temple et l’acheva ; il le couvrit de poutres et de rangées de cèdre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens précis des termes hébreux désignant ces éléments de charpente est incertain ; ils peuvent désigner des poutres et des rangées ou séries de bois de cèdre.
    reason: Signale l’incertitude lexicale architecturale sans ajouter « planches » ni imposer une reconstruction particulière.
lexical_decisions:
- source_word: הַבַּיִת
  choice: le temple
  rationale: Dans ce contexte, « la maison » désigne le temple de l’Éternel. « Le temple » est naturel en français moderne et évite une ambiguïté inutile.
- source_word: וַיְכַלֵּהוּ
  choice: et l’acheva
  rationale: Rend directement l’idée de mener l’édifice à son achèvement.
- source_word: וַיִּסְפֹּן
  choice: Il couvrit
  rationale: Le verbe décrit l’action de couvrir ou de lambrisser la construction; « couvrit » conserve la portée générale du terme.
- source_word: גֵּבִים
  choice: poutres
  rationale: Le terme architectural rare est compris ici comme désignant les grosses pièces de bois de la couverture.
- source_word: וּשְׂדֵרֹת בָּאֲרָזִים
  choice: et de rangées de planches de cèdre
  rationale: « Rangées » préserve l’idée d’éléments disposés en séries, tandis que « planches de cèdre » explicite naturellement le matériau et la nature probable des éléments.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le terme contextuel « temple » est préféré à la traduction littérale « maison ». La structure architecturale demeure formulée avec prudence en raison de termes hébreux rares.
