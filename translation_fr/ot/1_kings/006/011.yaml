  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁלֹמֹ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/011.yaml
  text: And the word of Yahweh came to Solomon[a], saying[b],
translation:
  language: fr
  text: La parole de Yahweh fut adressée à Salomon en ces termes :[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et il arriva que la parole de Yahweh vint à Salomon, disant : »'
    reason: La note conserve la structure narrative et le verbe de mouvement de l’expression hébraïque וַיְהִי… לֵאמֹר, rendue plus naturellement dans le texte principal.
lexical_decisions:
- source_word: וַיְהִי
  choice: fut adressée
  rationale: Dans cette formule narrative, וַיְהִי fait progresser le récit et se combine naturellement en français avec l’arrivée de la parole divine, sans recourir au tour lourd « il arriva que ».
- source_word: דְּבַר
  choice: la parole
  rationale: Dans la formule דְּבַר יְהוָה, « la parole » conserve l’expression biblique habituelle d’une communication divine; « le message » serait possible, mais moins formel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu porte le nom divin יהוה. La translittération « Yahweh » préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: אֶל שְׁלֹמֹה
  choice: à Salomon
  rationale: La préposition אֶל désigne le destinataire de la parole, et « Salomon » est la forme française consacrée du nom.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif introduit les paroles divines citées au verset suivant. « En ces termes » remplit cette fonction de manière naturelle et digne en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Puisque l’hébreu emploie explicitement le Tétragramme, « Yahweh » conserve le nom personnel présent dans le texte. Le rendu traditionnel « le SEIGNEUR » reste une convention possible, mais remplace le nom par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « fut adressée à » maintient la formule biblique sans archaïsme excessif; les deux-points annoncent directement le discours du verset suivant.
