  text: וְ/אֵת֩ כָּל קִיר֨וֹת הַ/בַּ֜יִת מֵסַ֣ב קָלַ֗ע פִּתּוּחֵי֙ מִקְלְעוֹת֙ כְּרוּבִ֣ים וְ/תִֽמֹרֹ֔ת וּ/פְטוּרֵ֖י צִצִּ֑ים מִ/לִּ/פְנִ֖ים וְ/לַ/חִיצֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: fr
  text: Il sculpta, tout autour, tous les murs de la Maison de motifs sculptés de chérubins, de palmiers et de fleurs épanouies[a], à l’intérieur comme à l’extérieur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « boutons de fleurs » ou « fleurs en train de s’ouvrir »; l’expression hébraïque désigne des motifs floraux, mais leur forme exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut désigner les côtés, les zones ou les parties intérieure et extérieure; dans ce contexte, elle se rapporte vraisemblablement à l’aménagement du sanctuaire.
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: les murs de la Maison
  rationale: « Maison » conserve le terme hébreu courant pour désigner ici le temple; la majuscule signale naturellement cet emploi cultuel sans remplacer le mot par une explicitation.
- source_word: מֵסַב
  choice: tout autour
  rationale: Rend de manière idiomatique l’étendue circulaire ou complète de l’ornementation.
- source_word: קָלַע / פִּתּוּחֵי מִקְלְעוֹת
  choice: sculpta … des figures gravées
  rationale: La combinaison exprime un travail décoratif incisé ou sculpté. Cette formulation garde à la fois l’action et le caractère figuratif des motifs sans imposer la technique précise du bas-relief.
- source_word: כְּרוּבִים
  choice: chérubins
  rationale: Terme biblique français usuel pour ces êtres célestes associés au sanctuaire.
- source_word: תִמֹרֹת
  choice: palmiers
  rationale: Désigne des formes ou motifs de palmiers dans le décor architectural; « palmiers » reste clair et concret.
- source_word: פְטוּרֵי צִצִּים
  choice: fleurs épanouies
  rationale: Évoque des fleurs ouvertes ou déployées tout en laissant la forme artistique exacte indéterminée.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: aussi bien dans la partie intérieure que dans la partie extérieure
  rationale: Le contexte architectural favorise une opposition entre les sections intérieure et extérieure du sanctuaire. « Partie » évite d’ajouter explicitement « salles » ou « murs », absents de cette expression, tout en restant naturel en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure conserve « Maison » comme désignation biblique du temple, tout en évitant les archaïsmes. L’ambiguïté de la dernière expression est maintenue dans la note plutôt que résolue avec une précision architecturale absente de l’hébreu.
