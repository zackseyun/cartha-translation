source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: fr
  text: 'Il plaça les chérubins dans la salle intérieure du Temple[a]. Les ailes des chérubins furent déployées : l’aile de l’un toucha un mur, et l’aile du second chérubin toucha l’autre mur ; leurs ailes, vers le centre de la salle, se touchaient aile contre aile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la maison intérieure ». Cette expression désigne la partie intérieure du Temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Il plaça
  rationale: Le verbe נתן peut signifier « mettre » ou « placer » ; dans cette description architecturale, « plaça » exprime naturellement le positionnement des chérubins.
- source_word: הַכְּרוּבִים
  choice: les chérubins
  rationale: « Chérubins » est le terme français traditionnel et précis pour ces êtres célestes, sans les assimiler aux représentations populaires de petits anges.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: à l’intérieur de la partie la plus retirée du Temple
  rationale: L’hébreu dit littéralement « à l’intérieur de la maison intérieure ». Ici, בַּיִת désigne le Temple et הַפְּנִימִי sa partie intérieure ; cette formulation française reste intelligible sans identifier silencieusement l’espace par un terme cultuel plus interprétatif.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: Les chérubins déployèrent leurs ailes
  rationale: La construction hébraïque se lit formellement « ils déployèrent les ailes des chérubins » ; le contexte indique naturellement que les chérubins sont le sujet, ce que le français exprime sans lourdeur.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: toucha / se touchaient
  rationale: La racine נגע indique un contact réel. Le passé simple convient à la progression narrative, tandis que l’imparfait décrit la disposition résultante des ailes centrales.
- source_word: כְּנַף הָאֶחָד
  choice: l’aile de l’un
  rationale: Cette expression suit de près « l’aile de l’un » et n’introduit pas l’idée de « premier », absente de l’hébreu.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: le second chérubin
  rationale: « Second » reproduit l’ordinal hébreu et convient à un ensemble de deux.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: l’autre mur
  rationale: Littéralement « le second mur » ; « l’autre mur » est plus naturel en français dans cette opposition spatiale entre deux murs.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: leurs ailes dirigées vers le milieu du Temple
  rationale: תּוֹךְ désigne ici le milieu ou l’intérieur. La rencontre des ailes montre qu’elles étaient orientées vers le centre de l’espace.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: se touchaient, aile contre aile
  rationale: La formulation conserve l’image concrète de l’hébreu, littéralement « touchant aile contre aile », dans un français naturel.
