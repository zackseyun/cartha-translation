translation_notes:
  register: Français international moderne, digne et accessible. « Temple » rend la référence contextuelle de « maison » plus clairement dans le corps du texte, tandis que la note conserve la formulation hébraïque littérale. Le passé simple porte les actions successives et l’imparfait décrit la disposition spatiale durable.
