revisions:
- from: 'Il plaça les chérubins à l’intérieur de la partie la plus retirée du Temple[a]. Les chérubins déployèrent leurs ailes : l’aile de l’un toucha un mur, et l’aile du second chérubin toucha l’autre mur ; leurs ailes dirigées vers le milieu du Temple se touchaient, aile contre aile.'
  to: 'Il plaça les chérubins dans la salle intérieure du Temple[a]. Les ailes des chérubins furent déployées : l’aile de l’un toucha un mur, et l’aile du second chérubin toucha l’autre mur ; leurs ailes, vers le centre de la salle, se touchaient aile contre aile.'
  rationale: La révision remplace une expression qui surinterprétait l’hébreu par « salle intérieure », intelligible en français et conforme au contexte architectural. Elle évite aussi de préciser sans nécessité que les chérubins eux-mêmes accomplissent l’action de déployer les ailes. La note fournit la formulation littérale et l’explication contextuelle minimale.
