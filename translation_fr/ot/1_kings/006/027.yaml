    text: 'Littéralement : « dans la maison intérieure ». Cette expression désigne la partie intérieure du Temple.'
    reason: lexical_alternative
  revision_rationale: La révision remplace une expression qui surinterprétait l’hébreu par « salle intérieure », intelligible en français et conforme au contexte architectural. Elle évite aussi de préciser sans nécessité que les chérubins eux-mêmes accomplissent l’action de déployer les ailes. La note fournit la formulation littérale et l’explication contextuelle minimale.
