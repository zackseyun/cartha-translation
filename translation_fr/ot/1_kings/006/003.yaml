  text: וְ/הָ/אוּלָ֗ם עַל פְּנֵי֙ הֵיכַ֣ל הַ/בַּ֔יִת עֶשְׂרִ֣ים אַמָּה֙ אָרְכּ֔/וֹ עַל פְּנֵ֖י רֹ֣חַב הַ/בָּ֑יִת עֶ֧שֶׂר בָּ/אַמָּ֛ה רָחְבּ֖/וֹ עַל פְּנֵ֥י הַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: fr
  text: Le portique[a] qui se trouvait devant la grande salle de la Maison[b] avait vingt coudées de long, correspondant à la largeur de la Maison, et dix coudées de profondeur devant la Maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vestibule » ; il s’agit de la structure d’entrée placée devant la grande salle.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu rendu par « Maison » désigne ici le Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: Le portique
  rationale: אוּלָם désigne ici la structure d’entrée placée devant la salle principale. « Portique » est un terme architectural courant et n’implique pas nécessairement un espace intérieur fermé.
- source_word: עַל־פְּנֵי
  choice: situé devant / devant
  rationale: Cette expression indique la position de la structure par rapport au bâtiment; « devant » rend naturellement cette relation spatiale.
- source_word: הֵיכַל
  choice: la grande salle
  rationale: Dans l’architecture du Temple, הֵיכַל désigne la salle principale, distincte du portique et du sanctuaire intérieur. « Grande salle » est plus immédiatement compréhensible que le terme spécialisé « nef ».
- source_word: הַבַּיִת
  choice: du Temple / du bâtiment
  rationale: Le sens littéral est « la maison », mais le contexte identifie clairement l’édifice comme le Temple. « Bâtiment » évite la répétition ambiguë de « Temple » dans les indications de dimensions.
- source_word: עֶשְׂרִים אַמָּה
  choice: vingt coudées
  rationale: La mesure ancienne est conservée sans conversion, puisque la longueur exacte de la coudée peut varier.
- source_word: אָרְכּוֹ
  choice: de long
  rationale: Cette formulation française naturelle exprime la longueur portée par le nom hébreu avec suffixe possessif.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: sur toute la largeur du bâtiment
  rationale: La proposition indique que les vingt coudées du portique s’étendaient en travers de la façade, selon la largeur du bâtiment.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: dix coudées
  rationale: Dans cette formule de mesure, la préposition ב est idiomatique; elle n’a pas besoin d’être rendue séparément en français.
- source_word: רָחְבּוֹ
  choice: de profondeur
  rationale: Le mot signifie littéralement « sa largeur », mais, pour un portique placé devant la façade, cette dimension correspond à l’avancée d’avant en arrière. « Profondeur » rend clairement la géométrie sans modifier la mesure.
