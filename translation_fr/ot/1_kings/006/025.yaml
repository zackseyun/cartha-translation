  text: וְ/עֶ֨שֶׂר֙ בָּֽ/אַמָּ֔ה הַ/כְּר֖וּב הַ/שֵּׁנִ֑י מִדָּ֥ה אַחַ֛ת וְ/קֶ֥צֶב אֶחָ֖ד לִ/שְׁנֵ֥י הַ/כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/025.yaml
  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: fr
  text: Le second chérubin mesurait également dix coudées. Les deux chérubins avaient les mêmes dimensions et la même forme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: mesurait également dix coudées
  rationale: La tournure hébraïque indique une dimension de dix coudées sans préciser ici s’il s’agit de la hauteur. « Mesurait » reste neutre, et « également » rend naturellement la coordination avec la description précédente.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: le second chérubin
  rationale: Rend directement le nom défini suivi de l’adjectif ordinal.
- source_word: מִדָּה אַחַת
  choice: les mêmes dimensions
  rationale: Littéralement « une seule mesure » pour les deux chérubins. Au pluriel, « dimensions » exprime naturellement en français leur taille identique dans ce contexte descriptif.
- source_word: וְקֶצֶב אֶחָד
  choice: la même forme
  rationale: קֶצֶב peut désigner ici la forme, les proportions ou la configuration générale. « Forme » est clair, large et naturel.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: Les deux chérubins avaient
  rationale: Le texte dit littéralement que la mesure et la forme étaient « pour les deux chérubins ». La restructuration française exprime clairement que ces caractéristiques leur étaient communes.
