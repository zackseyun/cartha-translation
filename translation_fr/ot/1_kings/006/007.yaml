  to: La maison[a], lors de sa construction, fut bâtie en pierres entièrement préparées à la carrière ; et ni marteau, ni hache, ni aucun outil de fer ne se fit entendre dans la maison pendant sa construction.
  rationale: La révision remplace « taillées » par « préparées », formulation qui rend l’achèvement des pierres sans imposer une opération particulière. Elle maintient l’indication de la carrière tout en conservant, dans la note, l’ambiguïté lexicale de מַסָּע. Elle supprime également l’inférence ajoutée par « ainsi » et la majuscule non exigée par le texte source.
