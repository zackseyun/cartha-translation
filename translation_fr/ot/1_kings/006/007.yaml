base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: fr
  text: La maison[a], lors de sa construction, fut bâtie en pierres entièrement préparées à la carrière ; et ni marteau, ni hache, ni aucun outil de fer ne se fit entendre dans la maison pendant sa construction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en pierres préparées à la carrière ». Le terme hébreu מַסָּע est technique et peut désigner la carrière, l’extraction, ou l’acheminement de pierres déjà préparées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: la Maison
  rationale: Le mot hébreu signifie littéralement « maison » et désigne ici le temple. « Maison » conserve le vocabulaire de la source et l’écho biblique de la « maison du SEIGNEUR » ; la majuscule aide à signaler ce référent dans ce contexte.
- source_word: בְּהִבָּנֹתוֹ
  choice: lors de sa construction / pendant sa construction
  rationale: L’infinitif construit précédé de ב exprime une circonstance temporelle. Les deux formulations françaises naturelles rendent la même expression hébraïque, la seconde soulignant la durée.
- source_word: אֶבֶן שְׁלֵמָה
  choice: des pierres entièrement taillées
  rationale: שְׁלֵמָה exprime l’idée d’intégrité ou d’achèvement. Dans ce contexte de construction, la formule indique des pierres complètement préparées avant leur mise en place.
- source_word: מַסָּע
  choice: à la carrière
  rationale: Ce terme technique rare paraît lié à l’extraction ou à l’acheminement depuis la carrière. « À la carrière » situe naturellement la préparation des pierres tout en laissant en note l’autre compréhension possible.
- source_word: נִבְנָה
  choice: fut bâtie
  rationale: Le nifal accompli décrit la manière dont l’édifice fut construit. Le passé simple convient au registre narratif français.
- source_word: מַקָּבוֹת
  choice: marteau
  rationale: Bien que la forme hébraïque soit plurielle, l’énumération française au singulier désigne naturellement une catégorie d’outils.
- source_word: הַגַּרְזֶן
  choice: hache
  rationale: « Hache » est l’équivalent courant et direct ; « herminette » demeure possible mais est moins assuré et moins accessible.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: aucun outil de fer
  rationale: כָּל avec le nom au singulier a ici une portée distributive. Cette formulation française exprime clairement l’exclusion de tout outil en fer.
- source_word: לֹא נִשְׁמַע
  choice: ne se fit entendre
  rationale: Le nifal de שמע est passif. Avec la série négative « ni… ni… ni aucun », « ne se fit entendre » est idiomatique et conserve l’accent sur l’absence de bruit sur le chantier.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et lisible. « Maison » préserve le terme hébreu plutôt que de l’expliciter par « Temple ». La syntaxe met en relief le contraste entre la préparation préalable des pierres et le silence des outils de fer sur le lieu de construction.
