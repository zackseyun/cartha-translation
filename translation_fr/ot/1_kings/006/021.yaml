translation_notes:
  register: Français international moderne, sobre et digne. « La Maison » préserve l’appellation hébraïque du temple, tandis que « sanctuaire intérieur » explicite le terme architectural rare debir. La syntaxe reste fluide sans effacer l’incertitude concernant la disposition des chaînes.
