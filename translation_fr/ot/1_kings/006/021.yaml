base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: fr
  text: Salomon revêtit d’or pur[a] l’intérieur de la Maison. Il tendit des chaînes d’or devant le sanctuaire intérieur[b][c], puis le revêtit d’or[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’or affiné ». L’hébreu dit littéralement « d’or fermé », expression qui désigne un or de haute qualité.
    reason: lexical_alternative
  - marker: b
    text: Ou « fit passer des chaînes d’or en travers de la façade du sanctuaire intérieur ». Le verbe hébreu signifie littéralement « faire passer » et peut décrire des chaînes tendues d’un côté à l’autre.
    reason: alternative_reading
  - marker: c
    text: Le « sanctuaire intérieur » est le debir, la pièce la plus reculée du temple, appelée plus tard le lieu très saint.
    reason: cultural_note
  - marker: d
    text: L’antécédent exact du pronom hébreu (« le ») est discuté. Il peut viser le sanctuaire intérieur ou l’élément architectural qui vient d’être mentionné.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַף
  choice: revêtit
  rationale: Dans ce contexte architectural, צפה désigne l’action de recouvrir une surface d’une couche de métal. « Revêtir d’or » est naturel et précis en français.
- source_word: הַבַּיִת
  choice: la Maison
  rationale: L’hébreu dit littéralement « la maison », terme qui désigne ici le temple. La majuscule signale cet emploi particulier sans remplacer le mot source par « Temple ».
- source_word: מִפְּנִימָה
  choice: l’intérieur de
  rationale: Cette formulation française courante rend clairement la valeur spatiale de l’adverbe hébreu.
- source_word: זָהָב סָגוּר
  choice: or pur
  rationale: L’expression hébraïque, littéralement « or fermé », est un idiome désignant vraisemblablement un or de haute qualité ou affiné. « Or pur » en communique le sens probable.
- source_word: וַיְעַבֵּר
  choice: tendit
  rationale: Le hiphil de עבר signifie littéralement « faire passer ». Avec des chaînes et l’indication de lieu, « tendit » exprime naturellement leur mise en place devant le sanctuaire, sans préciser abusivement leur fonction.
- source_word: בְּרַתּוּקוֹת
  choice: des chaînes
  rationale: Ce nom rare semble désigner ici des chaînes ou chaînettes d’or. « Chaînes » est le rendu le mieux attesté et le plus intelligible.
- source_word: לִפְנֵי הַדְּבִיר
  choice: devant le sanctuaire intérieur
  rationale: לִפְנֵי signifie directement « devant ». Ce rendu conserve la formulation spatiale du texte sans imposer que les chaînes traversaient toute la façade.
- source_word: הַדְּבִיר
  choice: le sanctuaire intérieur
  rationale: דְּבִיר désigne la pièce la plus intérieure du temple. « Sanctuaire intérieur » est exact et compréhensible, tout en évitant d’introduire dans le texte principal une appellation postérieure.
- source_word: וַיְצַפֵּהוּ
  choice: qu’il revêtit d’or
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au דְּבִיר, lui aussi masculin singulier. La relative française rend ce lien tout en conservant une légère possibilité d’ambiguïté référentielle.
