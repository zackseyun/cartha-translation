base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: fr
  text: L’entrée de la chambre latérale du milieu se trouvait sur le côté droit du Temple. On montait par des escaliers tournants[a] jusqu’à l’étage intermédiaire, puis de l’étage intermédiaire au troisième étage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est rare et son sens exact est incertain ; il désigne probablement des escaliers tournants ou en spirale.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « du milieu au troisième », c’est-à-dire de l’étage intermédiaire au troisième étage.'
    reason: clarification
lexical_decisions:
- source_word: פֶּתַח
  choice: l’entrée
  rationale: Le nom désigne une ouverture servant d’accès; « l’entrée » convient naturellement à cette description architecturale.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: la chambre latérale du milieu
  rationale: Dans le contexte du Temple, צֵלָע désigne une chambre ou une structure latérale plutôt qu’une « côte » au sens littéral. Le singulier et le qualificatif « du milieu » sont conservés.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: se trouvait sur le côté droit du Temple
  rationale: כֶּתֶף, littéralement « épaule », désigne ici le côté du bâtiment. יְמָנִית est rendu par « droit » sans transformer implicitement l’indication en « sud ». Dans ce contexte, הַבַּיִת renvoie au Temple.
- source_word: וּבְלוּלִּים
  choice: par un escalier tournant
  rationale: Ce terme rare est traditionnellement compris comme désignant un dispositif d’escalier tournant ou en spirale. Le singulier collectif est idiomatique en français; une note conserve l’incertitude lexicale.
- source_word: יַעֲלוּ
  choice: on montait
  rationale: La troisième personne masculine plurielle a ici une valeur impersonnelle; « on montait » est la formulation française la plus naturelle.
- source_word: עַל הַתִּיכֹנָה
  choice: jusqu’à l’étage intermédiaire
  rationale: La succession des niveaux montre que le terme désigne ici l’étage du milieu. « Intermédiaire » évite la répétition maladroite de « milieu » tout en gardant le sens.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: puis de l’étage intermédiaire au troisième
  rationale: La formulation suit le mouvement exprimé par l’hébreu, « du milieu au troisième », en explicitant « étage » là où le français en a besoin pour la clarté.
