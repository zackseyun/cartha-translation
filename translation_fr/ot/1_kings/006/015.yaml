    text: L’expression hébraïque, inhabituelle, peut désigner le plafond intérieur, la charpente ou le revêtement sous le toit.
    reason: cultural_note
  - marker: b
    text: Ou « de genévrier » ; traditionnellement, « de sapin ». Le nom hébreu désigne probablement une espèce de conifère, sans qu’on puisse l’identifier avec certitude.
    reason: lexical_alternative
  revision_rationale: La révision ne modifie pas le sens architectural ni les choix lexicaux principaux. Elle corrige surtout une formulation française peu naturelle pour la limite supérieure et rend plus précis le rapport entre les murs et leur face intérieure. Les notes conservent l’ambiguïté de la structure supérieure et de l’essence de conifère.
