base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: fr
  text: Il garnit de planches de cèdre les murs de la Maison, à l’intérieur. Du sol de la Maison jusqu’aux parois de la toiture[a], il les revêtit de bois à l’intérieur, et il recouvrit le sol de la Maison de planches de cyprès[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque, inhabituelle, peut désigner le plafond intérieur, la charpente ou le revêtement sous le toit.
    reason: cultural_note
  - marker: b
    text: Ou « de genévrier » ; traditionnellement, « de sapin ». Le nom hébreu désigne probablement une espèce de conifère, sans qu’on puisse l’identifier avec certitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן אֶת קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: Il garnit […] les murs intérieurs de la Maison
  rationale: Dans ce contexte architectural, בנה décrit l’aménagement des murs au moyen de boiseries. « Garnit » rend naturellement l’action sans faire croire que les murs porteurs étaient entièrement en bois. « La Maison » conserve l’appellation hébraïque du sanctuaire dans ce contexte.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: de planches de cèdre
  rationale: צלעות peut désigner des éléments latéraux ou des planches; ici, des planches de revêtement. אֲרָזִים désigne clairement le cèdre.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: Depuis le sol de la Maison
  rationale: קַרְקַע désigne ici la surface intérieure sur laquelle on marche, donc le sol.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: jusqu’aux parois du plafond
  rationale: La formulation hébraïque est inhabituelle. Cette traduction en préserve les deux éléments, « parois » et « plafond », sans trancher précisément la nature de la limite architecturale supérieure.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: il en revêtit l’intérieur de bois
  rationale: צפה signifie couvrir ou revêtir. Le pronom « en » reprend naturellement la Maison et exprime l’application du bois sur ses surfaces intérieures.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: il recouvrit le sol de la Maison
  rationale: Le même verbe צפה décrit ici explicitement la pose d’un revêtement sur le sol.
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: de planches de cyprès
  rationale: צלעות désigne de nouveau des planches. Le nom d’arbre בְּרוֹשִׁים renvoie probablement à un conifère, souvent rendu par « cyprès », mais son identification exacte reste incertaine.
