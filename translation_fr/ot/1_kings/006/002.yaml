reference: 1 Kings 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/בַּ֗יִת אֲשֶׁ֨ר בָּנָ֜ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ לַֽ/יהוָ֔ה שִׁשִּֽׁים אַמָּ֥ה אָרְכּ֖/וֹ וְ/עֶשְׂרִ֤ים רָחְבּ֑/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: fr
  text: La maison que le roi Salomon construisit pour Yahweh avait soixante coudées de long, vingt coudées de large[a] et trente coudées de haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, l’unité « coudée » n’est pas répétée devant « vingt »; elle est sous-entendue par la suite des mesures.
    reason: clarification
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: La maison
  rationale: בַּיִת signifie littéralement « maison » et désigne ici le sanctuaire. « Maison » préserve à la fois la formulation hébraïque et sa portée théologique. Le וְ initial n'est pas rendu explicitement, car le français n'exige pas ici de connecteur.
- source_word: אֲשֶׁר בָּנָה
  choice: que … construisit
  rationale: La proposition relative est rendue naturellement en français. Le qatal בָּנָה présente la construction comme un fait accompli.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: le roi Salomon
  rationale: Ordre idiomatique du titre royal suivi du nom propre en français.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici la destination ou la dédicace de l'édifice; le nom divin יהוה est translittéré « Yahweh ».
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: soixante coudées de long
  rationale: Formulation française naturelle qui conserve le nombre, l'unité et la dimension indiquée.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: vingt coudées de large
  rationale: Le mot « coudées », non répété dans ce membre en hébreu, est clairement sous-entendu par la série de mesures et doit être exprimé en français pour éviter l'ambiguïté.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: trente coudées de haut
  rationale: קוֹמָה désigne la hauteur; cette tournure est claire et idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le caractère propre du nom, tandis que « le SEIGNEUR » reflète la tradition de lecture et demeure une traduction possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. « Maison » est préféré à « temple » afin de conserver l'image et le lexique de l'hébreu.
