  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: fr
  text: Il construisit la cour intérieure avec trois rangées de pierres de taille et une rangée de poutres de cèdre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « trois assises de pierres de taille et une assise de poutres de cèdre ».'
    reason: Alternative lexicale architecturale pour טוּר, qui peut désigner une rangée ou une assise de construction.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il construisit
  rationale: Le wayyiqtol de בנה poursuit la séquence narrative. Le passé simple convient au registre narratif français et le sujet masculin singulier est repris naturellement par « Il ».
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: la cour intérieure
  rationale: חָצֵר désigne ici l’espace découvert associé au Temple, et פְּנִימִית le qualifie d’intérieur. « Cour intérieure » est précis, naturel et traditionnel dans ce contexte architectural.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: trois rangées de
  rationale: טוּר peut désigner une rangée ou une assise de maçonnerie. « Rangées » reste immédiatement compréhensible, tandis que le terme architectural « assises » est signalé en note.
- source_word: גָזִית
  choice: pierres de taille
  rationale: גָזִית désigne des pierres travaillées ou équarries. « Pierres de taille » est l’expression française usuelle et précise pour ce matériau de construction.
- source_word: וְטוּר
  choice: et une rangée de
  rationale: Le nom singulier טוּר indique une rangée supplémentaire, sans que le texte hébreu emploie explicitement le nombre « un ». L’article indéfini français en respecte la formulation.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: poutres de cèdre
  rationale: La formule désigne des pièces de bois de cèdre coupées et préparées pour la construction. « Poutres de cèdre » rend naturellement leur fonction architecturale probable sans alourdir le texte.
