  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: fr
  text: Et il y eut guerre entre Roboam et Jéroboam tous les jours de sa vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous les jours de la vie de Roboam ». À la lumière du contexte proche et de la discussion textuelle, certains comprennent plutôt que le pronom renvoie à Abiya (Abiyam).'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Il y eut guerre
  rationale: La construction existentielle avec היה se rend naturellement ainsi en français. Cette formulation conserve l’idée de guerre sans ajouter explicitement la notion de continuité.
- source_word: בֵין ... וּ/בֵין
  choice: entre… et…
  rationale: La répétition hébraïque de la préposition désigne les deux parties au conflit; le français courant emploie « entre… et… ».
- source_word: רְחַבְעָם
  choice: Roboam
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: כָּל יְמֵי חַיָּיו
  choice: tous les jours de sa vie
  rationale: Cette expression préserve l’idiome hébreu et, surtout, le pronom masculin singulier sans en préciser le référent.
theological_decisions:
- issue: Référent du pronom dans « tous les jours de sa vie »
  choice: Conserver « sa vie » sans identifier l’antécédent dans le texte principal.
  alternative: « tous les jours de la vie de Roboam » ou, selon une autre compréhension liée au contexte et à la discussion textuelle, « tous les jours de la vie d’Abiya (Abiyam) »
  rationale: Le suffixe hébreu signifie littéralement « sa » et la proposition ne nomme pas explicitement son référent. Le maintien du pronom préserve l’ambiguïté du texte source et la tension avec le contexte.
translation_notes:
  register: Français moderne, sobre et digne. « Il y eut guerre » garde une légère solennité narrative tout en restant immédiatement compréhensible. Le marqueur [a] figure dans le texte principal.
