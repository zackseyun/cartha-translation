id: 1KI.15.10
reference: 1 Kings 15:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַרְבָּעִ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: fr
  text: Il régna quarante et un ans à Jérusalem, et sa mère s’appelait Maaka, fille[a] d’Abishalom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fille » ; dans un contexte généalogique, le terme hébreu peut aussi désigner plus largement une descendante.
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : Abishalom ; on trouve aussi la forme « Absalom ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: quarante et un ans
  rationale: La construction hébraïque signifie littéralement « quarante et une année ». En français courant, la durée s’exprime naturellement par « quarante et un ans ».
- source_word: מָלַךְ
  choice: il régna
  rationale: Dans ce contexte, le verbe décrit la durée de l’exercice du pouvoir royal, et non l’accession au trône.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition בְּ marque ici le lieu ; devant un nom de ville, « à Jérusalem » est l’expression française naturelle.
- source_word: וְשֵׁם אִמּוֹ
  choice: et sa mère s’appelait
  rationale: Cette formulation française naturelle rend fidèlement l’expression hébraïque « et le nom de sa mère était ».
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Le nom propre est translittéré à partir de la forme hébraïque, avec une graphie simple et lisible en français.
- source_word: בַּת
  choice: fille
  rationale: Le sens lexical direct est « fille ». Une portée généalogique plus large reste possible selon l’usage hébraïque et est signalée en note.
- source_word: אֲבִישָׁלוֹם
  choice: Abishalom
  rationale: La forme choisie reproduit le nom hébreu présent dans ce verset ; la forme traditionnelle « Absalom » est indiquée en note.
theological_decisions:
- issue: Lien de parenté entre Maaka et Abishalom
  choice: Conserver « fille d’Abishalom » dans le texte principal.
  alternative: « petite-fille d’Abishalom » ou « descendante d’Abishalom »
  rationale: L’hébreu dit explicitement « fille ». Même si ce terme peut parfois désigner plus largement une descendante dans un contexte généalogique, la traduction ne doit pas résoudre silencieusement la question historique.
translation_notes:
  register: Français moderne, international et digne. La syntaxe est fluide sans perdre la précision du texte hébreu ; les ambiguïtés généalogiques et la variante du nom sont conservées dans les notes.
