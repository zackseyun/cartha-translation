source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh et marcha dans la voie de son père et dans le péché par lequel son père fit pécher Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: La formule royale est rendue de manière directe et idiomatique, tout en conservant le verbe « faire » et la portée morale de הָרַע.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette tournure française naturelle conserve la métaphore évaluative de l’hébreu ainsi que le nom divin.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: marcha dans la voie de son père
  rationale: « Marcha dans la voie » préserve la métaphore hébraïque de la conduite et reste compréhensible dans un registre biblique moderne.
- source_word: וּבְחַטָּאתוֹ
  choice: et dans son péché
  rationale: La traduction conserve le singulier, le suffixe possessif et le parallélisme avec « dans la voie », sans expliciter plus que le texte l’identité du référent.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: par lequel il avait fait pécher Israël
  rationale: Le causatif de חטא est rendu par « faire pécher ». Le plus-que-parfait situe naturellement l’action antérieure exprimée par la relative dans le récit français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Référent de « son » et de « il » dans la dernière proposition
  choice: Maintien de la formulation pronominale
  alternative: Expliciter « son père » ou « celui-ci »
  rationale: La syntaxe hébraïque rattache fortement le péché au père, mais la chaîne pronominale garde une certaine souplesse référentielle. La traduction évite de résoudre silencieusement cette tension.
translation_notes:
  register: Français international moderne, digne et relativement formel. La métaphore de la marche morale est maintenue; la formulation demeure proche de la syntaxe hébraïque sans devenir obscure.
