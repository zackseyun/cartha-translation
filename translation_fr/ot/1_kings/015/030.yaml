  source_fidelity: La formulation « qu’il avait fait commettre à Israël » ne rend pas clairement le hiphil הֶחֱטִיא (« il fit pécher Israël ») et peut laisser entendre que Jéroboam a fait commettre ses propres péchés à Israël. « Par lesquels il avait fait pécher Israël » exprime explicitement la causalité et respecte l’antécédent pluriel. La seconde proposition est mieux rendue avec « par » pour le ב instrumental (« par sa provocation »), sans transformer inutilement cette préposition en une seconde expression causale.
  naturalness: Le texte révisé est naturel, clair et d’un registre biblique moderne sobre. La reprise de « pécher » est préférable ici, car elle évite l’ambiguïté et conserve le lien lexical du texte hébreu.
  terminology: « Péchés », « faire pécher », « provocation », « Yahweh » et « le Dieu d’Israël » sont appropriés. « Provoqué la colère de Yahweh » explicite justement la valeur causative de הִכְעִיס sans répétition maladroite avec « provocation ».
