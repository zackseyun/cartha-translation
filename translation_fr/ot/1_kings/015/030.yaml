  text: עַל חַטֹּ֤אות יָרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל בְּ/כַעְס֕/וֹ אֲשֶׁ֣ר הִכְעִ֔יס אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: fr
  text: à cause des péchés que Jéroboam avait commis et par lesquels il avait fait pécher Israël, et par la provocation[a] par laquelle il avait provoqué la colère de Yahweh, le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa colère » ; le nom hébreu peut désigner la colère ou la provocation. Ici, « provocation » correspond mieux au verbe suivant, qui signifie « provoquer la colère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: à cause de
  rationale: Dans ce contexte, la préposition introduit la cause du jugement évoqué dans la phrase précédente.
- source_word: חַטֹּאות ... חָטָא
  choice: les péchés qu’il avait commis
  rationale: Cette formulation française naturelle conserve le nom pluriel et le sens du verbe, sans répétition maladroite de « pécher ».
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: qu’il avait fait commettre à Israël
  rationale: 'Le hiphil de חטא exprime ici la causalité : Jéroboam a amené Israël à commettre ces péchés.'
- source_word: בְּכַעְסוֹ
  choice: à cause de la provocation
  rationale: כַּעַס peut désigner la colère ou ce qui provoque l’irritation. « Provocation » convient au verbe causatif qui suit tout en gardant l’ambiguïté dans une note.
- source_word: הִכְעִיס
  choice: avait irrité
  rationale: Le verbe causatif signifie provoquer à la colère. « Irriter » est ici idiomatique et évite une répétition lourde avec « provocation ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et conventionnelle de cette construction génitivale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, rendu ici comme nom propre afin de préserver son caractère personnel.
- issue: Responsabilité de Jéroboam dans le péché d’Israël
  choice: qu’il avait fait commettre à Israël
  alternative: par lesquels il avait entraîné Israël dans le péché
  rationale: La formulation retenue conserve directement la valeur causative du hiphil sans préciser davantage le mécanisme de cette influence.
translation_notes:
  register: Français international moderne, digne et lisible. Les plus-que-parfaits inscrivent naturellement les actes de Jéroboam dans le contexte narratif antérieur. La répétition causale « à cause de… et à cause de… » explicite la structure du verset sans atténuer le lien entre le péché de Jéroboam, celui d’Israël et l’irritation de Yahweh.
