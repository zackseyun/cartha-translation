id: 1KI.15.2
reference: 1 Kings 15:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁלֹ֣שׁ שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: fr
  text: Il régna trois ans à Jérusalem, et sa mère s’appelait Maaka, fille d’Abishalom[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abishalom est la forme du nom hébreu employée ici; de nombreuses traductions françaises utilisent « Absalom ».
    reason: lexical_alternative
  - marker: b
    text: Dans certains contextes généalogiques, l’expression hébraïque « fille de » peut désigner plus largement une descendante.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: trois ans
  rationale: Le nombre cardinal suivi du nom pluriel indique la durée du règne; « trois ans » est la formulation française naturelle.
- source_word: מָלַךְ
  choice: régna
  rationale: Le qal de מלך désigne ici l’exercice de la royauté, et non l’accession au trône.
- source_word: בִּירוּשָׁלִָם
  choice: à Jérusalem
  rationale: La préposition ב indique le lieu; en français courant, on dit naturellement « à Jérusalem ».
- source_word: וְשֵׁם אִמּוֹ
  choice: et sa mère s’appelait
  rationale: Cette formulation rend naturellement en français la tournure hébraïque « et le nom de sa mère était », sans perdre le contenu de la notice royale.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Translittération française lisible du nom hébreu מַעֲכָה.
- source_word: בַּת
  choice: fille de
  rationale: Le sens lexical direct est « fille de »; l’éventuelle portée généalogique plus large est conservée en note.
- source_word: אֲבִישָׁלוֹם
  choice: Abishalom
  rationale: Cette forme reproduit le nom hébreu présent dans ce verset; la forme française traditionnelle « Absalom » est signalée en note.
theological_decisions:
- issue: Portée généalogique de בַּת אֲבִישָׁלוֹם
  choice: Conserver « fille d’Abishalom » dans le texte principal.
  alternative: « descendante d’Abishalom » ou, selon la reconstruction généalogique, « petite-fille d’Abishalom ».
  rationale: L’hébreu dit explicitement « fille de ». La possibilité d’un emploi généalogique plus large ne doit pas être imposée au texte principal, mais elle mérite d’être signalée afin de préserver l’ambiguïté historique.
translation_notes:
  register: Français international moderne, simple et digne. La formule royale est légèrement assouplie en « sa mère s’appelait », tandis que les noms propres et l’expression de parenté restent proches de l’hébreu.
