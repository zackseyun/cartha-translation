  text: וַ/יִּשְׁכַּ֤ב אָסָא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: fr
  text: Asa se coucha avec ses pères[a] et fut enterré avec ses pères dans la Cité de David, son père[b]. Son fils Josaphat régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec ses ancêtres ». L’hébreu dit littéralement « avec ses pères », formule royale habituelle évoquant la mort et l’ensevelissement.
    reason: lexical_alternative
  - marker: b
    text: Ici, « son père » désigne David comme ancêtre royal d’Asa, et non comme son père immédiat.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Conserve l’image de la formule royale hébraïque relative à la mort, sans la réduire au simple verbe « mourir ».
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Reproduit la formule dynastique et funéraire répétée dans l’hébreu; une note donne l’équivalent français plus explicite « avec ses ancêtres ».
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Rend naturellement en français le nifal passif du verbe hébreu.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: dans la Cité de David, son père
  rationale: Suit de près la syntaxe hébraïque et maintient le lien dynastique avec David, tout en signalant par une note qu’il s’agit d’un ancêtre royal.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Formulation concise et habituelle des notices de succession royale.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Exprime précisément le remplacement d’Asa par son fils sur le trône, et non une simple postériorité chronologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « se coucha avec ses pères » conserve volontairement la formule littéraire hébraïque; les notes en éclairent le sens. « Cité de David » reprend l’appellation traditionnelle du lieu.
