  source_fidelity: 'Le texte français rend tous les éléments du verset hébreu : la formule de décès « se coucha avec ses pères », la double mention « avec ses pères », l’ensevelissement, la Cité de David avec l’apposition « son père », puis l’accession de Josaphat à la place d’Asa. La note b clarifie correctement que David est un ancêtre dynastique et non le père immédiat d’Asa.'
  naturalness: Le français est clair, digne et adapté à une notice royale. « Se coucha avec ses pères » est une formulation biblique volontairement littérale, dont la note explique adéquatement la valeur idiomatique. « Fut enterré » et « régna à sa place » sont naturels en français moderne.
  terminology: Les noms Asa et Josaphat sont les formes françaises bibliques usuelles. « Cité de David » conserve l’appellation traditionnelle. Les termes dynastiques et funéraires, ainsi que la répétition formelle de « avec ses pères », respectent le registre et la formulation source.
