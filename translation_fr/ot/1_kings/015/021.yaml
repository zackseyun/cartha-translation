  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: fr
  text: Lorsque Baasha l’apprit, il cessa de bâtir Rama et resta à Tirtsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Lorsque … l’apprit
  rationale: La formule narrative introduit une proposition temporelle. « Lorsque » est naturel en français; le pronom « l’ » reprend implicitement la nouvelle rapportée dans le contexte.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Translittération usuelle du nom propre hébreu.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: il cessa de fortifier
  rationale: חדל suivi de מן et de l’infinitif exprime l’arrêt d’une activité. Dans le contexte, בנה appliqué à une ville désigne sa construction ou sa fortification.
- source_word: אֶת הָרָמָה
  choice: Rama
  rationale: Le terme est ici le nom de la localité; l’article hébreu n’est pas rendu en français.
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: ישׁב peut signifier demeurer, habiter ou rester. « Resta » convient au mouvement narratif sans affirmer un établissement permanent.
- source_word: בְּתִרְצָה
  choice: à Tirtsa
  rationale: Pour une ville, la préposition hébraïque ב est naturellement rendue par « à » en français.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la sobriété du récit hébreu et explicite seulement l’objet implicite de « apprit » par le pronom « l’ ».
