source:
  edition: WLC
  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: fr
  text: Le reste de tous les actes d’Asa, toute sa puissance, tout ce qu’il a fait et les villes qu’il a bâties, tout cela n’est-il pas écrit dans le livre des annales des rois de Juda ? Toutefois, dans sa vieillesse, il fut atteint d’une maladie aux pieds.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu précise la partie du corps touchée sans indiquer la nature exacte de la maladie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: Le reste de tous les actes d’Asa
  rationale: La formule récapitulative royale emploie דִּבְרֵי au sens large des actes et événements du règne. « Actes » convient au contexte historiographique.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: toute sa puissance
  rationale: גְּבוּרָה peut désigner la force, la puissance ou les hauts faits. « Puissance » maintient ici le nom abstrait et le distingue de « tout ce qu’il a fait ».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Traduction directe de la proposition relative, sans préciser indûment la nature des réalisations d’Asa.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: et les villes qu’il a bâties
  rationale: בָּנָה signifie « bâtir ». Le texte ne dit pas explicitement « fortifier », même si le contexte historique pourrait le suggérer.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: tout cela n’est-il pas écrit
  rationale: Cette tournure conserve la question rhétorique hébraïque. « Tout cela » reprend naturellement en français l’ensemble pluriel des éléments énumérés.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: dans le livre des annales des rois de Juda
  rationale: Dans cette formule royale, דִּבְרֵי הַיָּמִים désigne des annales ou une chronique officielle. « Annales » évite de confondre nécessairement cet ouvrage-source avec le livre biblique des Chroniques.
- source_word: רַק
  choice: Toutefois
  rationale: רַק introduit ici une réserve ou une précision contrastive concernant la fin du règne.
- source_word: לְעֵת זִקְנָתוֹ
  choice: dans sa vieillesse
  rationale: Formulation française naturelle qui conserve la valeur temporelle de l’expression hébraïque.
- source_word: חָלָה אֶת רַגְלָיו
  choice: il fut atteint d’une maladie aux pieds
  rationale: L’hébreu indique qu’Asa fut malade et précise la partie du corps touchée, sans identifier la maladie. Cette formulation demeure naturelle tout en préservant cette indétermination.
theological_decisions:
- issue: Nature exacte de la maladie d’Asa
  choice: Ne pas identifier la maladie ; dire seulement qu’elle touchait ses pieds.
  alternative: Nommer une affection précise ou comprendre רַגְלָיו comme un euphémisme.
  rationale: Le verset ne fournit aucun diagnostic et n’impose pas une lecture euphémistique. La traduction conserve donc l’ambiguïté médicale du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la formule royale et sa question rhétorique, tout en allégeant les répétitions qui seraient peu naturelles en français. Le marqueur de note [a] figure dans le texte à l’endroit pertinent.
