base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: fr
  text: Il expulsa du pays les hommes qui se livraient à la prostitution rituelle[a][b], et il supprima toutes les idoles[c] que ses pères avaient fabriquées[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fit disparaître du pays » ou « chassa du pays ». Le verbe exprime le fait de faire partir ou d’éliminer d’un lieu, sans préciser nécessairement le moyen employé.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie un nom masculin désignant ici des hommes associés à des pratiques sexuelles rituelles illicites. La traduction traditionnelle « sodomites » ne rend pas précisément le sens du terme dans ce contexte.
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu traduit par « idoles » est fortement méprisant ; il peut évoquer des « idoles répugnantes », voire des « idoles-ordures ».
    reason: lexical_alternative
  - marker: d
    text: Ou « ses ancêtres » ou « ses aïeux ». En hébreu, « ses pères » peut désigner les générations antérieures.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: il expulsa
  rationale: Le hiphil de עבר exprime ici le fait de faire disparaître des personnes d’un territoire. « Expulsa » rend naturellement cette action, tandis que la note conserve l’alternative moins précise « fit disparaître ».
- source_word: הַקְּדֵשִׁים
  choice: les hommes qui se livraient à la prostitution rituelle
  rationale: Le masculin pluriel désigne ici des hommes associés à des pratiques sexuelles cultuelles illicites. Cette formulation évite le traditionnel « sodomites », lexicalement trompeur, et rend le référent compréhensible sans présenter « consacrés » comme le sens contextuel.
- source_word: מִן הָאָרֶץ
  choice: du pays
  rationale: Dans ce contexte politique et territorial, הָאָרֶץ renvoie vraisemblablement au territoire de Juda. « Du pays » est idiomatique en français moderne.
- source_word: וַיָּסַר
  choice: il supprima
  rationale: Le hiphil de סור signifie enlever ou écarter. « Supprima » exprime ici l’élimination des objets idolâtres et évite la répétition du premier verbe.
- source_word: כָּל הַגִּלֻּלִים
  choice: toutes les idoles
  rationale: גִּלּוּלִים est un terme fortement méprisant pour les idoles. Le texte principal garde le français clair « idoles », et une note signale la nuance dépréciative.
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: que ses pères avaient fabriquées
  rationale: « Ses pères » conserve le pluriel masculin de l’hébreu, qui désigne les générations masculines antérieures. Le plus-que-parfait marque naturellement l’antériorité de leur fabrication par rapport à la réforme d’Asa.
theological_decisions:
- issue: Sens contextuel de הַקְּדֵשִׁים
  choice: des hommes se livrant à la prostitution rituelle
  alternative: les consacrés ; les sodomites
  rationale: Le contexte des réformes cultuelles indique des hommes associés à une pratique sexuelle rituelle illicite. « Consacrés » serait trop littéral et trompeur ici, tandis que « sodomites » importerait une catégorie plus tardive que le terme hébreu ne désigne pas précisément.
- issue: Rendu de אֲבֹתָיו
  choice: ses pères
  alternative: ses ancêtres ; ses aïeux
  rationale: Le choix conserve le masculin de l’expression hébraïque et sa référence aux prédécesseurs paternels, sans neutraliser silencieusement le terme. La note donne le sens idiomatique générationnel.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure en deux actions du texte hébreu. « Prostitution rituelle » est plus naturel en français courant que « prostitution cultuelle », tandis que les notes préservent les nuances lexicales et les autres possibilités de traduction.
