  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: fr
  text: Ben-Hadad écouta le roi Asa[a] et envoya les chefs de ses troupes contre les villes d’Israël. Il frappa Iyôn, Dan, Abel-Beth-Maaka et tout Kinneroth[b], ainsi que tout le territoire de Nephtali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prêta attention au roi Asa ». L’expression hébraïque peut indiquer qu’il écouta Asa et donna suite à sa demande.
    reason: lexical_alternative
  - marker: b
    text: Kinneroth est ici un nom de lieu, probablement celui d’une région ou d’un district.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: écouta favorablement
  rationale: L’expression signifie ici que Ben-Hadad prêta une oreille favorable à Asa et donna suite à sa demande, sans impliquer nécessairement une relation d’obéissance.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: les chefs de ses armées
  rationale: Cette formulation française naturelle exprime à la fois le commandement militaire et la relation de possession ou de subordination marquée par אֲשֶׁר לוֹ.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: contre les villes d’Israël
  rationale: Dans ce contexte militaire, עַל désigne la cible contre laquelle les forces sont envoyées.
- source_word: וַיַּךְ
  choice: frappa
  rationale: Le verbe conserve l’expression directe et relativement large de נכה, sans préciser indûment s’il s’agit d’attaquer, de vaincre ou de détruire.
- source_word: עִיּוֹן
  choice: Iyôn
  rationale: Translittération française claire du nom de lieu hébreu.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Beth-Maaka
  rationale: Translittération française lisible du nom composé, avec des traits d’union pour en signaler l’unité.
- source_word: כָּל כִּנְרוֹת
  choice: tout Kinneroth
  rationale: Kinneroth est ici un toponyme, probablement le nom d’une région ou d’un district; le singulier « tout » traite l’ensemble comme un territoire.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: ainsi que tout le territoire de Nephtali
  rationale: Après l’énumération des lieux frappés, עַל étend vraisemblablement la portée de l’attaque au territoire de Nephtali. « Ainsi que » rend naturellement cette relation additive sans répéter maladroitement « contre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le récit demeure concis; les noms propres sont translittérés selon des formes françaises lisibles. « Écouta favorablement » explicite sobrement la valeur contextuelle de l’idiome, tandis que « frappa » préserve l’étendue sémantique du verbe hébreu.
