source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: fr
  text: La troisième année du règne d’Asa, roi de Juda, Baésha, fils d’Ahija, devint roi de tout Israël à Tirsa. Il régna vingt-quatre ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ לְאָסָא
  choice: La troisième année du règne d’Asa
  rationale: La préposition ב introduit le cadre temporel et ל rattache l’année au règne d’Asa. L’ajout explicite de « du règne » produit en français une formule chronologique naturelle sans changer le sens.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Cette apposition identifie Asa par son titre et son royaume; la formulation française est concise et usuelle.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans ce contexte d’accession, le verbe מלך a une valeur ingressive. « Devint roi » distingue naturellement l’entrée en fonction de la durée du règne indiquée ensuite.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baésha, fils d’Ahija
  rationale: Les noms suivent une translittération française courante, et « fils d’ » conserve la formule patronymique hébraïque.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: de tout Israël
  rationale: Avec מלך, עַל marque l’autorité exercée sur un peuple. Après « devint roi », le français idiomatique emploie « roi de » tout en conservant כָּל, « tout ».
- source_word: בְּתִרְצָה
  choice: à Tirsa
  rationale: La préposition ב indique ici le lieu où le roi établit et exerce son règne. Pour une ville, le français moderne emploie naturellement « à ».
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: vingt-quatre ans
  rationale: Le groupe numéral indique la durée du règne. Une seconde phrase avec « Il régna » rend clairement cette valeur durative.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase est divisée en deux pour éviter une coordination lourde et distinguer clairement l’accession de la durée du règne. Aucun terme ne requiert de note textuelle ou théologique.
