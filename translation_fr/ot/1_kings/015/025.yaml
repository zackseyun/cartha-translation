  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: fr
  text: Nadab, fils de Jéroboam, devint roi d’Israël la deuxième année du règne d’Asa, roi de Juda. Il régna deux ans sur Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב
  choice: Nadab
  rationale: La conjonction hébraïque assure la continuité du récit sans exiger ici un connecteur français explicite. Le nom est translittéré selon l’usage français biblique.
- source_word: בֶּן יָרָבְעָם
  choice: fils de Jéroboam
  rationale: Rend directement la relation filiale dans un français naturel.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: devint roi d’Israël
  rationale: Le premier emploi du verbe indique l’accession au trône. « Roi d’Israël » est l’expression française idiomatique pour la royauté exercée sur Israël.
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/אָסָא
  choice: la deuxième année du règne d’Asa
  rationale: La formule chronologique hébraïque emploie le cardinal « deux », rendu naturellement en français par l’ordinal. L’ajout explicatif « du règne » clarifie sans modifier le sens que l’année est comptée par rapport au règne d’Asa.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rendu français standard du titre royal et du nom territorial.
- source_word: וַ/יִּמְלֹךְ עַל יִשְׂרָאֵל שְׁנָתָיִם
  choice: Il régna deux ans sur Israël
  rationale: Le second emploi du verbe, accompagné d’une durée, décrit la période du règne. La place finale de « sur Israël » conserve explicitement l’objet de l’autorité royale.
