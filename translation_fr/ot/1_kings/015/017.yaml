  text: וַ/יַּ֨עַל בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: fr
  text: Baasha, roi d’Israël, monta contre Juda et bâtit Rama[a], afin que personne ne puisse sortir ni entrer auprès d’Asa, roi de Juda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fortifia Rama ». Le verbe hébreu signifie simplement « bâtir », mais le contexte indique probablement des travaux militaires destinés à contrôler le passage.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « sortir ni entrer » évoque les déplacements et l’accès dans les deux sens : Baasha cherchait à bloquer les mouvements en rapport avec Asa, roi de Juda.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְהוּדָה
  choice: monta contre Juda
  rationale: Dans ce contexte militaire, עלה suivi de עַל décrit une avancée hostile. « Monta contre » conserve à la fois l’idée d’ascension ou de campagne et la valeur adversative.
- source_word: בַּעְשָׁא מֶלֶךְ יִשְׂרָאֵל
  choice: Baésha, roi d’Israël
  rationale: Le nom propre suit la forme française courante, et la chaîne construite désigne directement sa fonction royale.
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: bâtit Rama
  rationale: Le verbe בנה signifie littéralement « bâtir ». Le contexte suggère des travaux de fortification, mais cette précision reste en note afin de ne pas la faire entrer silencieusement dans le texte.
- source_word: לְבִלְתִּי תֵּת
  choice: afin de ne laisser personne
  rationale: La construction exprime un but préventif. En français, l’objet humain implicite du verbe est rendu par « personne », conformément au sens de l’expression qui suit.
- source_word: יֹצֵא וָבָא
  choice: sortir ni entrer
  rationale: Cette paire verbale désigne les déplacements dans les deux sens. La coordination négative « ni » est naturelle en français après « ne laisser personne ».
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: auprès d’Asa, roi de Juda
  rationale: La préposition ל marque ici le mouvement ou l’accès en relation avec Asa. « Auprès de » préserve cette orientation sans ajouter explicitement « depuis et vers », absent de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Bâtit » maintient la formulation concrète de l’hébreu, tandis que la note explicite la probable portée militaire. La ponctuation autour des titres royaux facilite la lecture sans modifier leur fonction.
