  variant: modern international French
source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: fr
  text: car David avait fait ce qui est droit aux yeux de Yahvé et ne s’était écarté de rien de ce que Yahvé lui avait commandé durant toute sa vie, sauf dans l’affaire d’Urie le Hittite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le cas d’Urie le Hittite ».'
    reason: Variante lexicale possible pour בִּדְבַר, qui peut désigner une affaire ou un cas.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: car
  rationale: Dans le contexte, le relatif introduit la raison de l’affirmation précédente. « Car » exprime clairement ce rapport causal tout en maintenant le lien avec le verset 4.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: avait fait ce qui est droit
  rationale: Cette formulation rend naturellement l’idiome hébreu « faire ce qui est droit » et conserve l’évaluation morale du texte.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahvé
  rationale: La traduction conserve la métaphore évaluative hébraïque, courante et intelligible en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est translittéré conformément à l’usage du projet.
- source_word: וְלֹא סָר
  choice: et ne s’était écarté
  rationale: Le verbe סור décrit ici le fait de dévier de la voie de l’obéissance ; « s’écarter de » est naturel en français.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: d’aucun des commandements qu’il lui avait donnés
  rationale: Après une négation, « d’aucun » restitue la totalité exprimée par כֹּל. La relative explicite naturellement en français ce que Yahvé avait commandé à David.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: tous les jours de sa vie
  rationale: Cette expression proche de l’hébreu demeure claire, digne et idiomatique en français.
- source_word: רַק
  choice: sauf
  rationale: Dans ce contexte, רַק introduit l’unique exception à l’éloge qui précède.
- source_word: בִּדְבַר אוּרִיָּה
  choice: dans l’affaire d’Urie
  rationale: דָּבָר désigne ici une affaire ou un cas. « Dans l’affaire de » conserve l’idiome sans préciser davantage la nature de la faute.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Urie le Hittite
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre, suivie de la désignation ethnique traduite directement.
theological_decisions:
- issue: Évaluation de l’obéissance de David malgré ses péchés connus
  choice: Conserver l’éloge général du texte avec sa seule exception explicitement formulée.
  alternative: Paraphraser en disant que David fut généralement fidèle, ou ajouter une explication concernant sa repentance ou sa fidélité à l’alliance.
  rationale: Le verset juxtapose une appréciation très large de l’obéissance de David et une exception précise. La traduction préserve cette tension sans l’atténuer ni lui ajouter une explication théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le début par « car » maintient la dépendance syntaxique envers le verset précédent. Les plus-que-parfaits rendent clairement l’antériorité de la conduite de David par rapport au récit principal.
