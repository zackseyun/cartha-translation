  to: car David avait fait ce qui est droit aux yeux de Yahvé et ne s’était écarté de rien de ce que Yahvé lui avait commandé durant toute sa vie, sauf dans l’affaire d’Urie le Hittite[a].
  rationale: Révision limitée de l’expression correspondant à מִכֹּל אֲשֶׁר צִוָּהוּ afin d’en conserver la portée totale, sans la réduire à des commandements explicitement catégorisés. « Durant toute sa vie » rend naturellement כֹּל יְמֵי חַיָּיו. La tension théologique et l’exception explicitement limitée à Urie sont inchangées.
  reviewer_model: gpt-5.6-terra
