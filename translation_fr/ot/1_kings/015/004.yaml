- from: Cependant, à cause de David, Yahvé, son Dieu, lui donna une lampe[a] à Jérusalem, en établissant son fils après lui et en affermissant Jérusalem.
  to: Cependant, à cause de David, Yahvé, son Dieu, lui donna une lampe[a] à Jérusalem, pour susciter son fils après lui et maintenir Jérusalem.
  rationale: La révision remplace les gérondifs par des infinitifs de finalité, plus fidèles à la fonction des infinitifs hébreux dans le contexte, et rend le dernier verbe par « maintenir », qui correspond mieux à l’idée de faire subsister. La métaphore de la lampe, le référent non explicité de « son Dieu » et la formulation du motif lié à David sont conservés.
