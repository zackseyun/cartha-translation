  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: fr
  text: Cependant, à cause de David, Yahvé, son Dieu, lui donna une lampe[a] à Jérusalem, pour susciter son fils après lui et maintenir Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une lumière ». L’expression « donner une lampe à quelqu’un à Jérusalem » évoque ici la préservation de la lignée royale de David.
    reason: Alternative lexicale et explication de la métaphore.
lexical_decisions:
- source_word: כִּי
  choice: Cependant
  rationale: Dans le contexte, la proposition marque le contraste avec l’infidélité d’Abiyam décrite au verset précédent, tout en introduisant la raison pour laquelle sa lignée ne fut pas retranchée.
- source_word: לְמַעַן דָּוִד
  choice: à cause de David
  rationale: Cette tournure française rend naturellement l’action accomplie en considération de David, sans ajouter une formulation confessionnelle.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » rend le nom divin plutôt que de le remplacer par un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le possessif hébreu est conservé sans préciser davantage son référent, qui demeure celui du roi dans le contexte immédiat.
- source_word: נִיר
  choice: lampe
  rationale: Le sens concret est maintenu afin de préserver la métaphore de la continuité de la maison royale de David.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: en établissant son fils après lui
  rationale: Le hiphil de קום évoque ici le fait de susciter ou maintenir un successeur. « Établir son fils après lui » conserve l’image dynastique tout en restant intelligible en français.
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: et en affermissant Jérusalem
  rationale: Le hiphil de עמד signifie faire tenir ou maintenir. « Affermir » évite la répétition d’« établir » et exprime la préservation de Jérusalem comme centre du règne.
theological_decisions:
- issue: Sens métaphorique de נִיר en rapport avec l’alliance davidique
  choice: Conserver « lampe » dans le texte principal
  alternative: lumière ; dynastie ; descendance
  rationale: La métaphore hébraïque évoque la permanence de la lignée davidique. La conserver maintient les résonances bibliques sans réduire l’image à son interprétation.
- issue: Référent de « son Dieu »
  choice: Conserver le possessif sans explicitation
  alternative: le Dieu de David
  rationale: Le contexte favorise le roi alors en vue, mais la traduction littérale « son Dieu » préserve la formulation et l’éventuelle tension référentielle de l’hébreu.
- issue: Rapport des infinitifs לְהָקִים et וּלְהַעֲמִיד à l’action principale
  choice: Les rendre par des gérondifs de moyen ou d’accomplissement
  alternative: pour établir son fils après lui et pour affermir Jérusalem
  rationale: Les infinitifs peuvent exprimer le but ou le résultat. Le gérondif français relie naturellement le don de la lampe à sa réalisation concrète, sans exclure entièrement la nuance de finalité.
translation_notes:
  register: Français international moderne, digne et accessible. « Cependant » marque le contraste contextuel; « Yahvé » rend le nom divin. La syntaxe reste proche de l’hébreu tout en évitant une tournure artificielle en français.
