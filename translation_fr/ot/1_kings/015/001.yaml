source:
  edition: WLC
  text: וּ/בִ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לַ/מֶּ֖לֶךְ יָרָבְעָ֣ם בֶּן נְבָ֑ט מָלַ֥ךְ אֲבִיָּ֖ם עַל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: fr
  text: La dix-huitième année du règne de Jéroboam, fils de Nebath, Abiyam[a] devint roi de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici « Abiyam »; le même roi est appelé « Abiya » dans d’autres passages.
    reason: La note préserve la forme précise du nom dans ce verset tout en signalant la variante de désignation attestée ailleurs.
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: La dix-huitième année
  rationale: La formule cardinale hébraïque se rend naturellement en français par un ordinal dans cette indication chronologique. Le ו narratif n’est pas traduit séparément, car la formule française se suffit à elle-même.
- source_word: לַמֶּלֶךְ יָרָבְעָם בֶּן נְבָט
  choice: du règne de Jéroboam, fils de Nebath
  rationale: Dans cette formule de datation, le ל marque l’année de règne du souverain. L’ajout de « règne » explicite naturellement cette relation en français sans modifier le sens; « fils de Nebath » conserve le patronyme hébreu.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans une notice d’accession, le verbe au qatal indique ici l’entrée dans la royauté plutôt que l’ensemble du règne.
- source_word: אֲבִיָּם
  choice: Abiyam
  rationale: La forme propre à ce verset dans le texte massorétique est conservée, au lieu de l’harmoniser avec « Abiya », employé ailleurs pour le même roi.
- source_word: עַל יְהוּדָה
  choice: de Juda
  rationale: Avec le verbe « devenir roi », le français idiomatique dit « roi de Juda »; cette expression rend la souveraineté sur Juda indiquée par עַל.
