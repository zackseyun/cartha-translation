source:
  edition: WLC
  text: וַ/יְמִתֵ֣/הוּ בַעְשָׁ֔א בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/028.yaml
  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: fr
  text: Baasha le mit à mort[a] dans la troisième année du règne d’Asa, roi de Juda, et il régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le tua ». Le verbe hébreu est causatif (« le fit mourir ») ; « le mit à mort » en rend plus littéralement la nuance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: le mit à mort
  rationale: Le hiphil de מות exprime la causation de la mort. « Le mit à mort » en conserve la force causative et la gravité narrative dans un français naturel.
- source_word: בַעְשָׁא
  choice: Baesha
  rationale: Le nom propre est translittéré sous sa forme française usuelle.
- source_word: בִּשְׁנַת שָׁלֹשׁ לְאָסָא
  choice: dans la troisième année du règne d’Asa
  rationale: La formule de datation royale désigne la troisième année comptée à partir de l’accession d’Asa ; l’ajout de « du règne » rend cette relation explicite et idiomatique en français.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Traduction directe du titre et du royaume.
- source_word: וַיִּמְלֹךְ
  choice: et régna
  rationale: Le qal wayyiqtol de מלך signifie ici qu’il exerça la royauté ; « régna » conserve la formulation concise du récit.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: תחת avec suffixe pronominal exprime ici le remplacement dans la succession royale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative reste concise ; le sujet de « régna » est naturellement Baesha. Le marqueur [a] est placé après l’unité de datation, conformément au texte de consultation, bien que la note porte sur « le mit à mort ».
