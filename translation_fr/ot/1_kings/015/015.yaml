source:
  edition: WLC
  text: וַ/יָּבֵא֙ אֶת קָדְשֵׁ֣י אָבִ֔י/ו ו/קדש/ו בֵּ֣ית יְהוָ֑ה כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: fr
  text: 'Il apporta dans la maison de Yahweh les biens consacrés de son père et ses propres biens consacrés : de l’argent, de l’or et des ustensiles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Il apporta
  rationale: Le hiphil de בוא signifie couramment « apporter » ou « faire entrer ». Le complément de destination rend inutile l’ajout explicite de « entrer ».
- source_word: קָדְשֵׁי אָבִיו
  choice: les biens sacrés de son père
  rationale: Le pluriel construit de קֹדֶשׁ désigne ici des biens mis à part pour le sanctuaire. « Biens sacrés » conserve le lien avec la sainteté tout en évitant de préciser indûment la nature des dons.
- source_word: וְקָדְשׁוֹ
  choice: et les siens
  rationale: Le nom singulier muni du suffixe de troisième personne fonctionne collectivement et forme un parallèle avec les biens sacrés du père. « Les siens » évite une répétition lourde en français.
- source_word: בֵּית יְהוָה
  choice: dans la maison de Yahweh
  rationale: « Maison » reproduit l’expression hébraïque traditionnelle pour le sanctuaire sans la remplacer par l’interprétation contextuelle « temple ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit « Yahweh », ce qui préserve le nom propre présent dans le texte hébreu.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: de l’argent, de l’or et des ustensiles
  rationale: Ces termes précisent vraisemblablement la composition des biens sacrés. Dans un contexte cultuel, « ustensiles » rend largement כֵּלִים et peut désigner divers objets ou instruments.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme; sa transcription conserve le nom divin plutôt que de lui substituer un titre.
- issue: Sens de קָדְשֵׁי אָבִיו וְקָדְשׁוֹ
  choice: les biens sacrés de son père et les siens
  alternative: les biens que son père avait consacrés et ceux qu’il avait lui-même consacrés
  rationale: Le texte principal conserve la formulation nominale et sa légère ambiguïté quant au rapport entre les personnes et les biens; la note donne la lecture active probable sans l’imposer.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique. Les deux-points présentent naturellement l’argent, l’or et les ustensiles comme une précision sur les biens sacrés.
