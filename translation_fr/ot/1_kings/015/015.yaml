revisions:
- from: 'Il apporta dans la maison de Yahweh les biens sacrés de son père et les siens[a] : de l’argent, de l’or et des ustensiles.'
  to: 'Il apporta dans la maison de Yahweh les biens consacrés de son père et ses propres biens consacrés : de l’argent, de l’or et des ustensiles.'
  rationale: La révision remplace l’ellipse ambiguë « les siens » par « ses propres biens consacrés ». Elle préserve ainsi le parallélisme et le sens cultuel de l’hébreu sans imposer que les personnes aient nécessairement accompli l’acte de consécration ; cette lecture active demeure, à juste titre, proposée en note.
