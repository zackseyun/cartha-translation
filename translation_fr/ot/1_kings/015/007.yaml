source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י אֲבִיָּם֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ם וּ/בֵ֥ין יָרָבְעָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: fr
  text: Le reste des actes d’Abiyam[a], et tout ce qu’il a fait, ne sont-ils pas écrits dans le livre des annales des rois de Juda[b] ? Il y eut guerre entre Abiyam et Jéroboam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abiyam est appelé Abiya dans certains passages parallèles ou apparentés ; le texte hébreu porte ici Abiyam.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « le Livre des Chroniques des rois de Juda ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: le reste des actes
  rationale: Dans la formule récapitulative des règnes, דִּבְרֵי désigne largement les actes et les événements concernant le roi, plutôt que ses seules paroles.
- source_word: אֲבִיָּם
  choice: Abiyam
  rationale: Translittère la forme אֲבִיָּם du texte hébreu sans l’harmoniser avec la forme Abiya employée dans certains passages parallèles ou apparentés.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Rend directement la portée générale du verbe עָשָׂה sans préciser indûment la nature des réalisations du roi.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: Conserve la question rhétorique et le pluriel du texte source.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: le livre des annales des rois de Juda
  rationale: « Annales » exprime naturellement en français le sens d’un registre historique royal, tandis que la note signale l’autre rendu traditionnel possible.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Il y eut guerre
  rationale: Rend simplement la proposition existentielle sans ajouter une idée explicite de durée.
- source_word: בֵּין אֲבִיָּם וּבֵין יָרָבְעָם
  choice: entre Abiyam et Jéroboam
  rationale: Reproduit la relation d’opposition exprimée par la préposition hébraïque redoublée et emploie la forme française traditionnelle Jéroboam.
