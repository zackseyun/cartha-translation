base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: fr
  text: « Il y a une alliance entre moi et toi, entre mon père et ton père. Voici, je t’envoie un pot-de-vin d’argent et d’or. Va, romps ton alliance avec Baasha, roi d’Israël, afin qu’il s’éloigne de moi. »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁחַד
  choice: présent
  rationale: Le terme peut désigner un don destiné à obtenir une faveur, voire un pot-de-vin. Dans cette adresse diplomatique, « présent » conserve un ton naturel sans effacer le caractère intéressé du versement.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: afin qu’il se retire de mon territoire
  rationale: L’expression signifie littéralement qu’il « monte/s’éloigne de dessus moi ». Ici, elle vise la cessation de la pression militaire exercée par Baasha; « de mon territoire » rend clairement le sens contextuel sans suggérer un simple éloignement personnel.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve le marqueur hébreu qui attire l’attention sur l’envoi de l’argent et de l’or, dans un registre biblique encore compréhensible aujourd’hui.
theological_decisions:
- issue: Qualification morale du paiement à Ben-Hadad
  choice: présent
  alternative: pot-de-vin
  rationale: Le mot hébreu autorise une qualification négative, mais le verset rapporte les paroles d’Asa sans formuler explicitement un jugement moral. « Présent » préserve cette retenue narrative, tandis que le contexte rend manifeste le but intéressé du paiement.
translation_notes:
  register: Discours direct, français moderne et digne. La syntaxe répétitive de la formule d’alliance est maintenue. « Baasha » suit une translittération internationale courante et évite une francisation confessionnellement marquée.
