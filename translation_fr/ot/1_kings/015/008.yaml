  text: וַ/יִּשְׁכַּ֤ב אֲבִיָּם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אָסָ֥א בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: fr
  text: Abiyam[b] se coucha avec ses pères[a], et ils l’enterrèrent dans la cité de David. Puis Asa, son fils, devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « se coucha avec ses pères », formule hébraïque courante évoquant la mort et le rattachement aux ancêtres.
    reason: cultural_note
  - marker: b
    text: Dans certains passages parallèles ou apparentés, Abiyam est appelé Abiya; le texte hébreu porte ici « Abiyam ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: se coucha
  rationale: Dans la formule « se coucher avec ses pères », le verbe évoque la mort. Cette traduction conserve l’image hébraïque sans la réduire simplement à « mourut ».
- source_word: אֲבִיָּם
  choice: Abiyam
  rationale: Le texte hébreu de ce verset porte la forme אֲבִיָּם, translittérée « Abiyam » en français.
- source_word: עִם אֲבֹתָיו
  choice: avec ses pères
  rationale: Cette formule traditionnelle de mort et de rattachement aux ancêtres conserve ici sa dimension familiale et dynastique.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: et ils l’enterrèrent
  rationale: L’hébreu emploie un verbe actif au pluriel sans préciser les agents; le français peut conserver cette construction.
- source_word: בְּעִיר דָּוִד
  choice: dans la cité de David
  rationale: « La cité de David » est une désignation géographique biblique établie et naturelle en français.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans cette formule de succession, le verbe indique l’accession au trône plutôt que la durée du règne.
- source_word: אָסָא בְנוֹ
  choice: Asa, son fils
  rationale: Cette formulation française naturelle maintient explicitement le lien filial exprimé par l’hébreu.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans le contexte royal, l’expression désigne la succession dans la fonction et non une simple postériorité chronologique.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formule hébraïque traditionnelle est conservée dans le texte et expliquée en note; le récit de succession reste concis et fidèle à la syntaxe narrative.
