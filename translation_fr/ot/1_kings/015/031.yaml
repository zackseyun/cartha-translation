  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: fr
  text: Le reste des actes de Nadab et tout ce qu’il a fait ne sont-ils pas écrits dans le livre des annales[a] des rois d’Israël ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le livre des Chroniques des rois d’Israël ». L’expression hébraïque désigne une source annalistique royale, et non nécessairement le livre biblique des Chroniques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: Le reste des actes de Nadab
  rationale: יֶתֶר désigne ce qui reste, et דִּבְרֵי, dans cette formule de bilan royal, renvoie aux faits ou actes du roi plutôt qu’à ses seules paroles. Le וְ initial assure la transition avec le contexte sans exiger l’ajout de « Maintenant ».
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: et tout ce qu’il a fait
  rationale: Traduction directe et naturelle de la proposition relative, qui conserve le caractère formulaire du texte hébreu.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: 'הֲלֹא introduit une question rhétorique appelant une réponse affirmative. Le pluriel français reprend les deux éléments coordonnés : « le reste des actes » et « tout ce qu’il a fait ».'
- source_word: עַל סֵפֶר
  choice: dans le Livre
  rationale: Bien que עַל signifie littéralement « sur », le français parle naturellement de faits écrits « dans » un livre ou un registre.
- source_word: דִּבְרֵי הַיָּמִים
  choice: des annales
  rationale: Dans les citations de sources royales, l’expression désigne un registre chronologique officiel. « Annales » communique ce sens sans suggérer automatiquement le livre biblique des Chroniques.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: 'Dans le titre de cette source, לְ exprime la relation : il s’agit des annales concernant les rois d’Israël.'
