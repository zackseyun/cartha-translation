id: 1KI.15.18
reference: 1 Kings 15:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: fr
  text: 'Alors Asa prit tout l’argent et tout l’or qui restaient dans les trésors de la maison de Yahweh et dans ceux de la maison du roi[a], et il les remit entre les mains de ses serviteurs. Puis le roi Asa les envoya à Ben-Hadad, fils de Tabrimmôn, fils de Hézyôn, roi d’Aram[b], qui résidait à Damas, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du palais royal » pour « de la maison du roi ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Aram » ; traduction traditionnelle : « Syrie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Alors Asa prit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב
  choice: tout l’argent et tout l’or
  rationale: La répétition de « tout » rend clairement la portée totalisante de כָּל sur les deux métaux précieux.
- source_word: הַנּוֹתָרִים
  choice: qui restaient
  rationale: Le participe de יתר désigne ce qui subsistait encore dans les trésors.
- source_word: בְּאֹצְרוֹת בֵּית יְהוָה
  choice: dans les trésors de la maison de Yahweh
  rationale: « Trésors » convient au contexte de métaux précieux, et « maison de Yahweh » conserve l’expression hébraïque ainsi que le nom divin.
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: et dans ceux de la maison du roi
  rationale: « Ceux » évite une répétition lourde tout en gardant l’expression littérale « maison du roi » ; le contexte permet aussi de comprendre le palais royal.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: et il les remit entre les mains de ses serviteurs
  rationale: Cette formulation française conserve l’image de la remise en main et exprime la mise sous la responsabilité des serviteurs.
- source_word: וַיִּשְׁלָחֵם
  choice: Puis le roi Asa les envoya
  rationale: Le pronom « les » conserve la formulation du texte et une possible ambiguïté référentielle entre les biens remis et les serviteurs chargés de les porter.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: Ben-Hadad, fils de Tabrimmôn, fils de Hézyôn
  rationale: Les noms sont translittérés et la filiation à deux degrés est conservée.
- source_word: מֶלֶךְ אֲרָם
  choice: roi d’Aram
  rationale: « Aram » préserve la désignation historique et géographique hébraïque plutôt que de lui substituer « Syrie ».
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: qui résidait à Damas
  rationale: Le participe de ישב indique ici le lieu de résidence ; « résidait » est naturel et digne en français moderne.
- source_word: לֵאמֹר
  choice: 'pour lui dire :'
  rationale: Cette tournure introduit naturellement en français le discours direct du verset suivant tout en rendant la fonction de לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » en préserve la fonction de nom propre.
- issue: Rendu de אֲרָם
  choice: Aram
  alternative: Syrie
  rationale: « Aram » maintient la désignation du texte hébreu et évite l’anachronisme potentiel du nom géographique plus tardif « Syrie ».
- issue: Référent du suffixe dans וַיִּשְׁלָחֵם
  choice: les envoya
  alternative: envoya ses serviteurs ; envoya l’argent et l’or
  rationale: Le pronom hébreu peut être rattaché aux biens précieux ou, du fait de l’antécédent immédiat, aux serviteurs. Le pronom français conserve cette ambiguïté sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide sans effacer les images hébraïques importantes ; les noms propres suivent une translittération française lisible.
