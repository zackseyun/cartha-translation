id: 1KI.15.34
reference: 1 Kings 15:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: fr
  text: Il fit ce qui est mal aux yeux de Yahweh et suivit la voie de Jéroboam ainsi que le péché par lequel celui-ci avait fait pécher Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Il fit ce qui est mal
  rationale: Cette tournure française naturelle conserve la formule d’évaluation du récit hébreu sans le calque peu idiomatique « il fit le mal ».
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Conserve la métaphore hébraïque transparente qui exprime l’évaluation divine, tout en rendant directement le nom divin.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: suivit la voie de Jéroboam
  rationale: En français, « suivre la voie de » exprime naturellement le comportement conforme à un modèle et préserve l’image du chemin.
- source_word: וּבְחַטָּאתוֹ
  choice: ainsi que le péché
  rationale: Le singulier est maintenu comme dans la formule hébraïque; « ainsi que » coordonne clairement la voie et le péché de Jéroboam.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: par lequel celui-ci avait fait pécher Israël
  rationale: « Faire pécher » conserve la valeur causative du hiphil de חטא. « Celui-ci » désambiguïse naturellement le référent, Jéroboam, tandis que le plus-que-parfait situe son action antérieure au règne évalué.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Responsabilité de Jéroboam dans le péché d’Israël
  choice: avait fait pécher Israël
  alternative: avait entraîné Israël dans le péché
  rationale: La formulation retenue garde explicitement la valeur causative du verbe hébreu sans préciser davantage le mécanisme de cette influence.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le caractère formulaire du livre des Rois, tout en évitant les calques lourds. Aucun marqueur de note n’est requis.
