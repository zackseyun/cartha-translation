source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת עֶשְׂרִ֔ים לְ/יָרָבְעָ֖ם מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֥ךְ אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/009.yaml
  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: fr
  text: La vingtième année du règne de Jéroboam, roi d’Israël, Asa devint roi de Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: La vingtième année
  rationale: La conjonction préfixée ouvre une notice chronologique et n’a pas besoin d’être rendue séparément en français. Le cardinal hébreu « vingt » a ici une valeur ordinale naturelle dans la formule de datation.
- source_word: לְ/יָרָבְעָם
  choice: du règne de Jéroboam
  rationale: La préposition לְ marque ici le règne servant de repère au décompte. En français, « du règne de » explicite naturellement cette relation chronologique sans modifier le sens.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: Rendu direct et idiomatique du titre royal hébreu.
- source_word: מָלַךְ
  choice: devint roi
  rationale: Dans cette formule royale, le qatal de מָלַךְ signale l’accession au trône plutôt que toute la durée du règne. « Devint roi » l’exprime clairement en français moderne.
- source_word: אָסָא
  choice: Asa
  rationale: Transcription française usuelle du nom propre.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Traduction formelle et naturelle de la construction hébraïque, qui désigne le royaume sur lequel Asa accède à la royauté.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la brièveté de la notice royale tout en rendant explicite, selon l’usage français, que la vingtième année est celle du règne de Jéroboam.
