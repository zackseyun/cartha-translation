  variant: modern international French
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת מַעֲכָ֣ה אִמּ֗/וֹ וַ/יְסִרֶ֨/הָ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה מִפְלֶ֖צֶת לָ/אֲשֵׁרָ֑ה וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: fr
  text: Il retira aussi à Maaka, sa mère[a], son rang de reine mère, parce qu’elle avait fabriqué un objet abominable[b] pour Ashéra[c]. Asa abattit cet objet et le brûla dans la vallée du Cédron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sa mère »; dans le langage royal, ce mot peut parfois désigner une grand-mère ou une autre ancêtre.
    reason: lexical_alternative
  - marker: b
    text: Ou « une représentation abominable », « une chose effroyable ». La nature exacte de cet objet cultuel est incertaine.
    reason: lexical_alternative
  - marker: c
    text: « Ashéra » peut désigner la déesse portant ce nom ou son symbole cultuel, souvent appelé « poteau sacré » d’Ashéra.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Il … aussi
  rationale: Rend la valeur additive qui rattache cette mesure aux réformes mentionnées auparavant; le sujet masculin est explicité naturellement en français.
- source_word: מַעֲכָה אִמּוֹ
  choice: Maaka, sa mère
  rationale: Conserve le sens direct de l’hébreu אֵם (« mère »), tout en signalant en note que le terme peut désigner ici une ancêtre, notamment une grand-mère.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: Il retira … son rang de reine mère
  rationale: Le hiphil de סור exprime la destitution, et גְּבִירָה désigne ici la dignité officielle de la femme de premier rang à la cour, habituellement la reine mère.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: parce qu’elle avait fabriqué
  rationale: Le contexte donne à la proposition une portée causale; le plus-que-parfait situe naturellement la fabrication avant la destitution.
- source_word: מִפְלֶצֶת
  choice: un objet abominable
  rationale: Ce nom rare qualifie fortement un objet cultuel repoussant sans permettre d’en déterminer précisément la forme; « objet » évite de présumer qu’il s’agissait nécessairement d’une statue.
- source_word: לָאֲשֵׁרָה
  choice: pour Ashéra
  rationale: La translittération préserve l’ambiguïté entre le nom de la déesse et celui de son symbole cultuel.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: Asa abattit cet objet
  rationale: « Abattit » conserve le sens concret de כרת (« couper, abattre »), tandis que « cet objet » reprend clairement l’objet cultuel déjà mentionné sans alourdir la phrase.
- source_word: וַיִּשְׂרֹף
  choice: et le brûla
  rationale: Rendu direct et idiomatique du verbe « brûler ».
- source_word: בְּנַחַל קִדְרוֹן
  choice: dans la vallée du Cédron
  rationale: נַחַל peut désigner un ravin, un oued ou son cours d’eau; « vallée du Cédron » est une désignation française claire du lieu.
theological_decisions:
- issue: Référent de אֲשֵׁרָה
  choice: Ashéra
  alternative: la déesse Ashéra / un poteau sacré d’Ashéra
  rationale: Le mot hébreu peut renvoyer à la divinité ou à son symbole cultuel. Comme le verset mentionne déjà séparément un objet fabriqué, préciser davantage trancherait une ambiguïté réelle du texte.
- issue: Lien familial de Maaka avec Asa
  choice: sa mère
  alternative: sa grand-mère / son aïeule
  rationale: Le texte massorétique dit littéralement « sa mère ». Le contexte dynastique peut cependant autoriser un emploi plus large; la traduction garde donc le terme source et expose l’autre possibilité en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde les titres royaux compréhensibles, évite un vocabulaire confessionnel particulier et préserve les incertitudes lexicales relatives à Maaka, à l’objet cultuel et à Ashéra.
