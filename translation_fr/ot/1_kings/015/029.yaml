revisions:
- from: Dès qu’il fut devenu roi, il frappa toute la maison de Jéroboam. Il ne laissa à Jéroboam aucun être vivant, jusqu’à l’avoir anéantie[a], conformément à la parole que Yahweh avait prononcée par l’intermédiaire de son serviteur Ahija de Silo.
  to: Lorsqu’il devint roi, il frappa toute la maison de Jéroboam. Il ne laissa à Jéroboam aucun être vivant, jusqu’à le détruire[a], conformément à la parole que Yahweh avait prononcée par l’intermédiaire de son serviteur Ahija de Silo.
  rationale: La révision remplace l’adverbe temporel trop fort par une équivalence neutre et corrige la note afin qu’elle signale réellement l’ambiguïté du suffixe hébreu. « Le détruire » conserve le masculin du texte source tout en permettant la lecture collective contextualisée de la maison/dynastie de Jéroboam.
