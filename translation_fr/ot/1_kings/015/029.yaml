  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: fr
  text: Lorsqu’il devint roi, il frappa toute la maison de Jéroboam. Il ne laissa à Jéroboam aucun être vivant, jusqu’à le détruire[a], conformément à la parole que Yahweh avait prononcée par l’intermédiaire de son serviteur Ahija de Silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom masculin singulier hébreu peut renvoyer à Jéroboam ou, collectivement, à sa maison (sa dynastie).
    reason: ambiguïté du référent du suffixe masculin singulier hébreu
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: Dès qu’il fut devenu roi
  rationale: La formule narrative introduit ici une circonstance temporelle liée à l’accession au trône. « Dès que » rend naturellement la proximité entre son avènement et l’extermination qui suit.
- source_word: הִכָּה
  choice: il frappa
  rationale: Le verbe נכה signifie frapper et, dans ce contexte, mettre à mort. « Frappa » conserve la force et la sobriété de l’hébreu sans ajouter une précision absente du texte.
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: toute la maison de Jéroboam
  rationale: « Maison » désigne ici la famille ou dynastie royale; conserver ce terme maintient cette portée à la fois familiale et politique.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה
  choice: Il ne laissa ... aucun être vivant
  rationale: נְשָׁמָה évoque littéralement le souffle, mais l’expression signifie qu’aucun survivant ne fut laissé. La formulation française transmet clairement l’image vitale sans paraître artificielle.
- source_word: לְיָרָבְעָם
  choice: à Jéroboam
  rationale: 'Le לְ marque ici l’appartenance ou la relation: aucun survivant appartenant à la lignée de Jéroboam ne subsista. « À Jéroboam » conserve la construction hébraïque dans un français intelligible.'
- source_word: עַד הִשְׁמִידוֹ
  choice: jusqu’à l’avoir anéantie
  rationale: Le suffixe hébreu est masculin singulier, mais son référent peut être collectivement la maison de Jéroboam. En français, le pronom féminin renvoie naturellement à « maison »; l’autre analyse possible est signalée en note.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole ... de Yahweh
  rationale: La locution exprime l’accomplissement d’une parole divine. « Conformément à » rend clairement ce rapport d’accomplissement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la forme française courante « Yahweh », qui conserve le nom divin plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: que Yahweh avait prononcée par l’intermédiaire de son serviteur
  rationale: בְיַד signifie littéralement « par la main de », formule de médiation prophétique. « Par l’intermédiaire de » en transmet le sens dans un français naturel et digne.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: Ahija de Silo
  rationale: Le gentilé hébreu désigne Ahija comme originaire ou résident de Silo. Cette tournure est plus immédiatement compréhensible en français moderne que « le Silonite ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le nom divin. « Yahweh » préserve ce nom personnel sans lui substituer un titre.
- issue: Référent du suffixe dans עַד הִשְׁמִידוֹ
  choice: la maison de Jéroboam, comprise collectivement (« l’avoir anéantie »)
  alternative: Jéroboam comme chef éponyme de sa maison (« l’avoir anéanti »)
  rationale: La morphologie permet formellement « lui », tandis que le contexte immédiat présente la maison comme objet de l’extermination. Le texte principal privilégie le référent contextuel et la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en évitant les calques opaques. « Maison » conserve la notion dynastique; « par l’intermédiaire de » explicite naturellement l’idiome prophétique « par la main de ».
