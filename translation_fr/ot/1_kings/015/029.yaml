    text: Le pronom masculin singulier hébreu peut renvoyer à Jéroboam ou, collectivement, à sa maison (sa dynastie).
    reason: ambiguïté du référent du suffixe masculin singulier hébreu
  revision_rationale: La révision remplace l’adverbe temporel trop fort par une équivalence neutre et corrige la note afin qu’elle signale réellement l’ambiguïté du suffixe hébreu. « Le détruire » conserve le masculin du texte source tout en permettant la lecture collective contextualisée de la maison/dynastie de Jéroboam.
