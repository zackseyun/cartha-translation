lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Il y eut guerre
  rationale: La tournure existentielle rend naturellement היה avec מִלְחָמָה, tandis que « et » n’est pas exprimé séparément en français, l’enchaînement narratif étant suffisamment clair dans ce verset isolé.
- source_word: בֵּין ... וּ/בֵין
  choice: entre ... et
  rationale: C’est l’équivalent idiomatique français de la construction corrélative hébraïque.
- source_word: אָסָא
  choice: Asa
  rationale: Translittération française traditionnelle et courante du nom propre.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Translittération claire du nom propre hébreu, cohérente avec la forme fournie dans la couche de consultation.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: L’apposition identifie Baasha sans nécessiter d’article défini en français.
- source_word: כָּל יְמֵי/הֶם
  choice: tous les jours de leur vie
  rationale: Cette expression française conserve l’image des « jours » tout en indiquant naturellement qu’il s’agit de la durée de leur vie.
