reference: 1 Kings 15:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: fr
  text: Mais les hauts lieux ne furent pas supprimés. Pourtant, le cœur d’Asa fut tout entier à Yahweh tous les jours de sa vie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le cœur d’Asa resta sans partage avec Yahweh toute sa vie ». Littéralement, l’hébreu dit : « le cœur d’Asa fut entier avec Yahweh tous ses jours ».'
    reason: Alternative lexicale permettant de voir la formulation concrète de l’hébreu et la nuance d’un attachement sans partage.
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: Mais les hauts lieux
  rationale: בָּמוֹת désigne ici les sanctuaires locaux établis sur les hauteurs. « Les hauts lieux » est l’expression française biblique consacrée et demeure concise; la conjonction est rendue par « Mais » pour marquer le contraste avec l’évaluation positive qui suit.
- source_word: לֹא סָרוּ
  choice: ne furent pas supprimés
  rationale: Avec « les hauts lieux » pour sujet, סוּר exprime leur élimination dans le cadre d’une réforme cultuelle, non un simple déplacement. « Supprimés » communique clairement cette valeur contextuelle.
- source_word: רַק
  choice: Pourtant
  rationale: 'רַק introduit ici une concession: malgré le maintien des hauts lieux, la fidélité fondamentale d’Asa est affirmée. « Pourtant » exprime naturellement cette tension en français.'
- source_word: לְבַב אָסָא
  choice: le cœur d’Asa
  rationale: לְבַב représente la personne intérieure, notamment sa volonté et son attachement. Le groupe nominal hébreu se rend directement et naturellement par « le cœur d’Asa ».
- source_word: שָׁלֵם
  choice: tout entier
  rationale: Avec « cœur », שָׁלֵם évoque l’intégrité et un attachement sans partage plutôt qu’une perfection morale absolue. « Fut tout entier à » conserve cette image tout en restant idiomatique.
- source_word: עִם יְהוָה
  choice: à Yahweh
  rationale: עִם signifie littéralement « avec », mais la tournure française naturelle correspondant à un cœur שָׁלֵם envers Dieu est « être tout entier à ». La note conserve la formulation plus littérale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », plutôt que par un titre de substitution.
- source_word: כָּל יָמָיו
  choice: tous les jours de sa vie
  rationale: Cette formulation française naturelle conserve la portée temporelle exhaustive de l’expression hébraïque, littéralement « tous ses jours ».
theological_decisions:
- issue: Sens du « cœur entier » d’Asa malgré le maintien des hauts lieux
  choice: Le verset affirme que l’attachement fondamental d’Asa à Yahweh fut entier, sans prétendre que sa conduite ou ses réformes furent parfaites.
  alternative: Comprendre שָׁלֵם comme une déclaration de perfection morale absolue, ou atténuer l’affirmation jusqu’à n’y voir qu’une approbation générale.
  rationale: La juxtaposition explicite du maintien des hauts lieux et du cœur שָׁלֵם maintient une tension entre une réforme inachevée et une fidélité intérieure réelle. « Tout entier à Yahweh » préserve cette tension sans attribuer à Asa une perfection exempte de toute faute.
translation_notes:
  register: Français international moderne, clair et digne. « Hauts lieux » conserve le terme biblique usuel; « fut tout entier à » traduit l’image du cœur entier dans une tournure française naturelle. La ponctuation en deux phrases rend nettement le contraste concessif.
