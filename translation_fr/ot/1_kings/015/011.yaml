id: 1KI.15.11
reference: 1 Kings 15:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: fr
  text: Asa fit ce qui est droit aux yeux de Yahweh, comme David, son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « David, son ancêtre » ; ici, « père » désigne un ancêtre de la lignée royale, et non le père immédiat d’Asa.
    reason: Alternative lexicale et clarification du sens dynastique de אָב.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Dans cette formule d’évaluation royale, « faire ce qui est droit » rend naturellement le sens de עשה en français.
- source_word: אָסָא
  choice: Asa
  rationale: Le nom propre est translittéré selon la forme française biblique courante.
- source_word: הַיָּשָׁר
  choice: ce qui est droit
  rationale: Cette formulation idiomatique conserve la valeur morale de יָשָׁר, « droit, juste ».
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression française naturelle préserve la métaphore hébraïque du jugement porté par quelqu’un.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: כְּדָוִד
  choice: comme David
  rationale: La préposition comparative כ־ est rendue directement par « comme ».
- source_word: אָבִיו
  choice: son père
  rationale: « Père » conserve le terme hébreu et son emploi dynastique pour désigner un ancêtre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel sans lui substituer un titre.
- issue: Sens de « David, son père » appliqué à Asa
  choice: Maintenir « son père » dans le texte avec une note
  alternative: son ancêtre
  rationale: אָבִיו peut désigner un ancêtre dynastique. Le maintien de « père » respecte la formulation source, tandis que la note prévient une lecture limitée au père immédiat.
translation_notes:
  register: Français international moderne, naturel et digne. La structure brève de la formule royale et l’image « aux yeux de » sont conservées.
