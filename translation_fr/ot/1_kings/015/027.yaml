id: 1KI.15.27
reference: 1 Kings 15:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: fr
  text: Baésha, fils d’Ahiya, de la maison d’Issacar, complota contre lui[a] et le frappa à mort[b] à Guibbethon, qui appartenait aux Philistins[c], pendant que Nadab et tout Israël assiégeaient la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « forma une conspiration contre lui ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le tua »; l’hébreu dit littéralement « le frappa ».
    reason: lexical_alternative
  - marker: c
    text: Ou « qui était aux mains des Philistins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: complota contre lui
  rationale: Le verbe קשר construit avec עַל désigne ici une conspiration dirigée contre le roi. « Complota contre lui » est naturel en français et conserve la portée politique de l’expression.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baésha, fils d’Ahiya
  rationale: Les noms sont translittérés selon un usage français courant, et בֶן est rendu directement par « fils de ».
- source_word: לְבֵית יִשָּׂשכָר
  choice: de la maison d’Issacar
  rationale: La formule indique l’appartenance familiale ou tribale. « Maison » préserve cette dimension généalogique sans la réduire à la seule tribu.
- source_word: וַיַּכֵּהוּ
  choice: le frappa à mort
  rationale: נכה signifie littéralement « frapper »; dans ce récit, le coup entraîne la mort. « Frappa à mort » conserve l’image verbale tout en exprimant clairement l’issue.
- source_word: בְּגִבְּתוֹן
  choice: à Guibbethon
  rationale: La préposition française « à » convient naturellement à une action située dans ou aux abords d’une ville assiégée.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: qui appartenait aux Philistins
  rationale: La construction avec לְ exprime l’appartenance ou la maîtrise. Le rendu principal reste proche de la formulation hébraïque, tandis qu’une note signale la nuance possible de contrôle militaire.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל צָרִים עַל גִּבְּתוֹן
  choice: pendant que Nadab et tout Israël assiégeaient la ville
  rationale: Le participe צָרִים décrit une action en cours servant d’arrière-plan au meurtre. « Pendant que » rend naturellement cette valeur circonstancielle; « la ville » évite une répétition lourde tout en ayant Guibbethon pour référent immédiat.
