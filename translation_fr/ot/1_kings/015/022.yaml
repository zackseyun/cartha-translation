  text: וְ/הַ/מֶּ֨לֶךְ אָסָ֜א הִשְׁמִ֤יעַ אֶת כָּל יְהוּדָה֙ אֵ֣ין נָקִ֔י וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֤בֶן בָּ/ם֙ הַ/מֶּ֣לֶךְ אָסָ֔א אֶת גֶּ֥בַע בִּנְיָמִ֖ן וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: fr
  text: Alors le roi Asa convoqua tout Juda — personne n’en fut exempté[a] — et ils emportèrent les pierres et le bois de Rama, dont Baésha s’était servi pour bâtir[b]. Avec ces matériaux, le roi Asa bâtit Guéba de Benjamin et Mitspa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y avait personne d’exempt », c’est-à-dire que personne ne fut dispensé de cette corvée.'
    reason: lexical_alternative
  - marker: b
    text: 'La proposition peut aussi être rendue plus littéralement : « avec lesquels Baésha avait bâti ». Elle renvoie aux pierres et au bois que Baésha avait employés pour fortifier Rama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמִיעַ
  choice: convoqua
  rationale: Le hiphil de שׁמע signifie ici faire entendre un appel dans tout Juda. « Convoqua » exprime naturellement l’ordre de mobilisation impliqué par le contexte.
- source_word: אֵין נָקִי
  choice: personne n’en fut exempté
  rationale: Dans ce contexte de corvée collective, נָקִי désigne celui qui est dégagé d’une obligation, non l’innocence morale.
- source_word: וַיִּשְׂאוּ
  choice: ils emportèrent
  rationale: Le verbe décrit l’enlèvement et le transport des matériaux depuis Rama en vue de leur réemploi.
- source_word: אַבְנֵי הָרָמָה
  choice: les pierres de Rama
  rationale: Cette formulation rend simplement la construction hébraïque tout en rattachant les pierres au chantier de Rama.
- source_word: עֵצֶיהָ
  choice: le bois
  rationale: Le pluriel hébreu désigne ici du bois de construction; le collectif français « le bois » est naturel dans ce contexte.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: dont Baésha s’était servi pour bâtir
  rationale: La relative se rapporte naturellement aux pierres et au bois employés par Baésha. Cette formulation évite de laisser entendre qu’il aurait « bâti » les matériaux eux-mêmes, tout en conservant l’objet de bâtir implicite comme en hébreu.
- source_word: וַיִּבֶן בָּם
  choice: Avec ces matériaux, … bâtit
  rationale: Le pronom renvoie aux pierres et au bois. « Ces matériaux » rend la référence clairement et naturellement en français.
- source_word: גֶּבַע בִּנְיָמִן
  choice: Guéba de Benjamin
  rationale: La formulation conserve le lien appositionnel ou territorial entre Guéba et Benjamin.
- source_word: הַמִּצְפָּה
  choice: Mitspa
  rationale: L’article hébreu n’est pas conservé devant le nom propre; « Mitspa » est une translittération française courante.
