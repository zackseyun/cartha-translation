  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: fr
  text: Il y eut guerre entre Asa et Baasha, roi d’Israël, tout au long de leurs jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous leurs jours ». Cette expression peut évoquer toute la durée de leur vie; dans ce contexte, elle peut aussi se comprendre comme la durée de leur opposition durant leurs règnes.'
    reason: Préserver l’idiome hébreu et son ambiguïté quant à sa portée chronologique exacte, sans introduire « vie » ou « règnes » dans le texte principal.
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Il y eut guerre
  rationale: La proposition existentielle signifie littéralement qu’« il y eut guerre ». Cette formulation française, concise et soutenue, rend l’hébreu sans ajouter explicitement l’idée de continuation.
- source_word: בֵּין ... וּ/בֵין
  choice: entre ... et
  rationale: La construction prépositionnelle corrélative exprime directement l’opposition réciproque entre Asa et Baasha.
- source_word: אָסָא
  choice: Asa
  rationale: Translittération française traditionnelle et courante du nom propre.
- source_word: בַּעְשָׁא
  choice: Baasha
  rationale: Translittération qui représente distinctement le nom hébreu בַּעְשָׁא et reste accessible au lectorat francophone.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: roi d’Israël
  rationale: La chaîne construite désigne la fonction royale de Baasha; en français, l’apposition sans article est naturelle.
- source_word: כָּל יְמֵי/הֶם
  choice: durant toute leur vie
  rationale: L’expression idiomatique hébraïque, littéralement « tous leurs jours », indique toute la durée qui leur est attribuée dans ce contexte. Le singulier distributif « leur vie » est naturel en français, tandis que la note conserve la forme littérale et son ambiguïté contextuelle.
theological_decisions:
- issue: Portée chronologique de כָּל יְמֵיהֶם
  choice: Ne pas préciser dans le texte s’il s’agit de leur vie ou de leur règne au-delà de l’expression idiomatique « durant toute leur vie »
  alternative: durant tous les jours de leurs règnes
  rationale: Le texte hébreu dit « tous leurs jours » et ne mentionne pas explicitement leurs règnes. Une précision politique résoudrait indûment la portée de l’idiome.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « Il y eut guerre » garde la concision narrative de l’hébreu. Le nom « Baasha » est conservé sous une translittération transparente plutôt que francisé davantage.
