base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: fr
  text: Il imita tous les péchés que son père avait commis avant lui[a], et son cœur ne fut pas entièrement dévoué à Yahweh, son Dieu[b][c], comme l’avait été le cœur de David, son ancêtre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « avant lui » peut signifier « en sa présence » ou « avant son époque » ; elle peut aussi suggérer que les péchés de son père constituaient un exemple placé devant lui.
    reason: lexical_alternative
  - marker: b
    text: Yahweh est la transcription du nom divin hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: c
    text: 'Autre traduction : « son cœur ne fut pas entièrement fidèle à Yahweh, son Dieu ».'
    reason: alternative_reading
  - marker: d
    text: Littéralement « son père ». Dans ce contexte dynastique, le terme désigne David comme son ancêtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: Il suivit tous les péchés
  rationale: Avec בְּ et un objet moral, הלך décrit la conduite. « Suivit » rend naturellement en français l’idée d’adopter une ligne de conduite déjà exemplifiée, sans ajouter explicitement « la voie » au texte.
- source_word: אָבִיו אֲשֶׁר עָשָׂה לְפָנָיו
  choice: que son père avait commis avant lui
  rationale: Le relatif renvoie naturellement aux péchés commis par son père. « Avant lui » conserve la possible nuance temporelle ou celle d’un comportement placé devant lui comme exemple.
- source_word: לְבָבוֹ
  choice: son cœur
  rationale: Le terme désigne la personne intérieure, notamment sa volonté et sa fidélité. « Cœur » en conserve l’image et la portée.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: entièrement dévoué à Yahweh, son Dieu
  rationale: Dans ce contexte relationnel, שָׁלֵם exprime une adhésion entière, sans partage. « Entièrement dévoué à » est idiomatique en français tout en évitant de suggérer une perfection absolue.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément à la forme hébraïque du texte source.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: comme l’avait été le cœur de David, son père
  rationale: La comparaison porte explicitement sur le cœur. « Son père » préserve la formulation généalogique hébraïque, où « père » peut désigner un ancêtre.
theological_decisions:
- issue: Portée de שָׁלֵם appliqué au cœur
  choice: Une dévotion entière envers Dieu
  alternative: Un cœur parfait avec Dieu
  rationale: Le contexte évalue la fidélité à l’alliance par comparaison avec David. Il s’agit d’une loyauté sans partage, non d’une affirmation selon laquelle David aurait été absolument sans péché.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription préserve le nom personnel présent dans le texte hébreu; une note signale le rendu traditionnel français.
- issue: David qualifié de « père »
  choice: Conserver « son père »
  alternative: son ancêtre
  rationale: Le mot hébreu est identique dans les deux occurrences. Le conserver manifeste l’usage généalogique ancien, tandis qu’une note en clarifie le sens ici.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image du cœur, le nom divin et l’ambiguïté de « avant lui », tout en rendant l’idiome moral de הלך de manière intelligible.
