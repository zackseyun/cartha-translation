base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: fr
  text: La main de Yahweh était sur Élie[a]. Il retroussa son vêtement[b], puis courut devant Achab jusqu’à l’entrée de Jizréel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus traditionnelle : « la main de Yahweh vint sur Élie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ceignit ses reins » ; il releva son vêtement long pour pouvoir courir.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel et préserve sa distinction par rapport au titre « Seigneur ».
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: La main de Yahweh fut sur
  rationale: Conserve l’image hébraïque de la « main » comme expression de l’action ou de la puissance divine, sans préciser la nature exacte de l’action exercée sur Élie.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: il releva les pans de son vêtement et les fixa à sa taille
  rationale: Rend clairement le geste culturel consistant à retrousser et attacher un vêtement long pour pouvoir courir, plutôt que de reproduire littéralement l’expression aujourd’hui peu transparente « ceindre ses reins ».
- source_word: וַיָּרָץ לִפְנֵי
  choice: il courut devant
  rationale: 'Préserve le sens spatial direct : Élie court en avant d’Achab, sans ajouter une fonction cérémonielle que le texte n’explicite pas.'
- source_word: עַד בֹּאֲכָה
  choice: jusqu’à l’entrée de
  rationale: Exprime naturellement en français le point d’approche ou d’arrivée indiqué par la construction hébraïque.
- source_word: יִזְרְעֶאלָה
  choice: Jizréel
  rationale: Emploie la forme française usuelle du nom de lieu biblique.
theological_decisions:
- issue: Nature de l’action divine sur Élie
  choice: Conserver l’image « la main de Yahweh fut sur Élie » sans définir davantage son effet
  alternative: 'Expliciter : « la puissance de Yahweh saisit Élie » ou parler d’une force miraculeuse'
  rationale: L’expression hébraïque affirme clairement l’action de Dieu, mais ne précise pas si elle désigne une force physique miraculeuse, une impulsion prophétique ou les deux. La formulation retenue préserve cette tension.
translation_notes:
  register: Français moderne, digne et narratif. L’image théologique de la main divine est maintenue, tandis que le geste vestimentaire est explicité dans le corps du texte pour être immédiatement compréhensible.
