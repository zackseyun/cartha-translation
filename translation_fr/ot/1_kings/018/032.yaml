  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: fr
  text: Avec les pierres, il bâtit un autel au nom de Yahweh. Puis il creusa autour de l’autel une tranchée, de la mesure de deux séas de semence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « comme [la mesure ou l’étendue de] deux séas de semence ». Le séa était une ancienne mesure de capacité. L’expression est obscure : elle peut désigner la contenance de la tranchée ou son étendue selon une mesure agricole fondée sur la quantité de semence.'
    reason: Précision culturelle et conservation de l’ambiguïté de l’expression hébraïque.
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: Avec les pierres, il bâtit un autel
  rationale: La construction hébraïque signifie littéralement qu’il bâtit les pierres en autel. Cette formulation française naturelle conserve le rôle matériel des pierres sans introduire explicitement l’idée de reconstruction.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: « Au nom de » rend naturellement בְּשֵׁם dans ce contexte cultuel, tandis que « Yahweh » transcrit le nom divin personnel.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: il creusa une tranchée
  rationale: תְּעָלָה désigne un canal ou une tranchée. En français, « creusa une tranchée » exprime idiomatiquement l’action impliquée par « fit une tranchée ».
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: dont la capacité correspondait à environ deux séas de semence
  rationale: L’expression hébraïque est elliptique et difficile. Cette traduction conserve l’idée probable d’une mesure de capacité, marque l’approximation portée par כְּ et maintient l’unité ancienne sans conversion spéculative.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: autour de l’autel
  rationale: Rend directement et naturellement la position circulaire indiquée par סָבִיב.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de כְּבֵית סָאתַיִם זֶרַע
  choice: une capacité correspondant à environ deux séas de semence
  alternative: une superficie où l’on pouvait semer deux séas de grain
  rationale: La tournure peut évoquer la capacité de la tranchée ou une mesure de superficie fondée sur la quantité de semence. Le contexte favorise la capacité, mais une note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée en deux pour alléger la coordination narrative. « Tranchée » est concret et courant; « séa » conserve la mesure ancienne, expliquée en note.
