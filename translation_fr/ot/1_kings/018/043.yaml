base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: fr
  text: 'Puis il dit à son serviteur[a] : « Monte, je te prie, et regarde du côté de la mer[b]. » Il monta, regarda et dit : « Il n’y a rien. » Alors il lui dit : « Retourne sept fois[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à son jeune homme » ou « à son assistant ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « regarde dans la direction de la mer ».
    reason: lexical_alternative
  - marker: c
    text: 'C’est-à-dire : refais le trajet et regarde de nouveau, jusqu’à ce que cela ait été fait sept fois.'
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: son serviteur
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. Ici, l’homme reçoit les instructions d’Élie; « serviteur » exprime naturellement sa fonction sans affirmer son âge.
- source_word: עֲלֵה נָא
  choice: Monte, je te prie
  rationale: L’impératif עֲלֵה exprime la montée, tandis que נָא nuance la demande. « Je te prie » conserve cette nuance dans un registre digne et naturel.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: regarde du côté de la mer
  rationale: הביט signifie regarder, et דֶּרֶךְ יָם indique ici la direction de la mer. Cette formulation est idiomatique en français tout en conservant l’orientation spatiale.
- source_word: אֵין מְאוּמָה
  choice: Il n’y a rien
  rationale: La formule nie que quoi que ce soit soit visible. La traduction retenue est concise, naturelle et fidèle.
- source_word: שֻׁב
  choice: Retourne-y
  rationale: שׁוּב signifie revenir ou retourner. Le pronom « y » renvoie naturellement au lieu d’observation et permet de conserver l’ordre bref du texte.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Cette expression numérique est rendue directement, sans explicitation dans le corps du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases restent brèves pour suivre le rythme hébreu. « Je te prie » rend la nuance de נָא sans donner à l’ordre un ton excessivement familier; « retourne-y » conserve la concision de l’impératif final, tandis que la note précise l’action sous-entendue.
