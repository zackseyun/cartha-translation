id: 1KI.18.31
reference: 1 Kings 18:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֵלִיָּ֗הוּ שְׁתֵּ֤ים עֶשְׂרֵה֙ אֲבָנִ֔ים כְּ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יַעֲקֹ֑ב אֲשֶׁר֩ הָיָ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר יִשְׂרָאֵ֖ל יִהְיֶ֥ה שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: fr
  text: 'Élie prit douze pierres, d’après le nombre des tribus des fils de Jacob[a], à qui la parole de Yahvé avait été adressée en ces termes[b] : « Israël sera ton nom. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « des enfants de Jacob ». L’hébreu dit littéralement « des fils de Jacob ».
    reason: lexical_alternative
  - marker: b
    text: Cette parole rappelle le changement de nom de Jacob en Genèse 32.29 et 35.10.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח, dans cette forme narrative, indique simplement qu’Élie prit les pierres; « prit » est direct et naturel en français.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: douze pierres
  rationale: Rendu littéral et idiomatique du nombre suivi du nom.
- source_word: כְּמִסְפַּר
  choice: d’après le nombre de
  rationale: Exprime la correspondance numérique marquée par la préposition כ et le nom מִסְפָּר sans alourdir la phrase.
- source_word: שִׁבְטֵי בְנֵי יַעֲקֹב
  choice: les tribus des fils de Jacob
  rationale: Conserve l’expression familiale concrète de l’hébreu et son lien avec les douze tribus.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֵלָיו
  choice: à qui la parole de Yahvé avait été adressée
  rationale: Le singulier אֵלָיו rattache naturellement la proposition à Jacob. Cette formulation française restitue l’idée biblique d’une parole divine venue à lui tout en restant fluide.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, qui préserve ici le nom propre présent dans le texte hébreu.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Introduit naturellement en français le contenu de la parole directe.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israël sera ton nom
  rationale: Conserve l’ordre hébreu, qui place « Israël » en tête, ainsi que la solennité de la déclaration de changement de nom.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme; sa transcription préserve le nom divin plutôt que de le remplacer par un titre.
- issue: Référent de la proposition relative אֲשֶׁר ... אֵלָיו
  choice: Jacob
  alternative: les fils de Jacob ou les tribus
  rationale: Le pronom suffixe hébreu est masculin singulier et la citation qui suit est précisément la parole par laquelle Jacob reçoit le nom d’Israël.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le lien explicite entre les douze pierres, les douze tribus et Jacob, tout en évitant un calque excessivement lourd de la formule hébraïque de révélation.
