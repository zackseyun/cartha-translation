base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/016.yaml
  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: fr
  text: Abdias alla à la rencontre d’Achab et l’informa[a]. Puis Achab alla à la rencontre d’Élie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui fit son rapport ». Le verbe hébreu peut signifier « dire », « rapporter » ou « informer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: Le wayyiqtol de הלך fait progresser simplement le récit. « Alla » exprime naturellement le déplacement sans ajouter de nuance absente de l’hébreu.
- source_word: עֹבַדְיָהוּ
  choice: Abdias
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: La construction indique un mouvement vers quelqu’un en vue d’une rencontre. Cette expression française convient naturellement aux deux occurrences.
- source_word: אַחְאָב
  choice: Achab
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: וַיַּגֶּד לוֹ
  choice: l’informa
  rationale: Le hifil de נגד peut signifier « dire », « rapporter » ou « informer ». Le complément implicite, connu par le contexte, n’est pas explicité dans la traduction.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: Puis Achab alla
  rationale: Le second wayyiqtol poursuit la succession narrative. « Puis » rend cette progression avec naturel en français moderne.
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom biblique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition de « à la rencontre de » conserve le parallélisme de l’hébreu, tandis que « donc » et « puis » assurent un enchaînement narratif naturel.
