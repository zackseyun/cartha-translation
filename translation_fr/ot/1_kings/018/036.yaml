  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: fr
  text: 'Au moment où l’on présentait l’offrande de céréales, le prophète Élie s’approcha et dit : « Yahweh, Dieu d’Abraham, d’Isaac et d’Israël[a], que l’on sache aujourd’hui que c’est toi qui es Dieu en Israël, que je suis ton serviteur et que c’est par ta parole[b] que j’ai fait toutes ces choses. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu dit ici « Israël », et non « Jacob », comme dans la formule patriarcale plus familière.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « selon ta parole » ou « sur ta parole ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: Au moment où l’on présentait l’offrande de céréales
  rationale: La tournure rend l’infinitif de עלה employé pour la présentation d’une offrande, tandis que « offrande de céréales » exprime le sens cultuel précis de מִנְחָה sans ajouter explicitement « du soir », absent de l’hébreu.
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Ce verbe traduit directement le mouvement exprimé par נגשׁ et convient au caractère solennel de la scène.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Dieu d’Abraham, d’Isaac et d’Israël
  rationale: Le texte massorétique porte explicitement « Israël », et non « Jacob » ; la traduction évite donc toute harmonisation avec la formule patriarcale plus courante.
- source_word: הַיּוֹם יִוָּדַע
  choice: que l’on sache aujourd’hui
  rationale: Cette formulation française naturelle rend la valeur volitive du niphal imparfait dans la prière d’Élie.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Dieu en Israël
  rationale: La préposition ב est conservée par « en », sans préciser indûment si le rapport visé est spatial, communautaire ou souverain.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans ce contexte prophétique, « serviteur » exprime une personne placée au service de Dieu et chargée d’une mission, sans la connotation réductrice que pourrait prendre « esclave » en français actuel.
- source_word: וּבִדְבָרֶךָ
  choice: par ta parole
  rationale: Cette traduction concise conserve la possible valeur instrumentale de ב tout en laissant entendre l’autorité directrice de la parole divine ; une note signale l’autre nuance possible.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: j’ai fait toutes ces choses
  rationale: Ici, דְּבָרִים désigne les faits ou actes concernés plutôt que des paroles prononcées ; le passé composé relie naturellement ces actes accomplis à la demande présente.
theological_decisions:
- issue: Rendu du nom d’alliance יהוה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Formule patriarcale avec « Israël » plutôt que « Jacob »
  choice: Dieu d’Abraham, d’Isaac et d’Israël
  alternative: Dieu d’Abraham, d’Isaac et de Jacob
  rationale: Le texte hébreu lit « Israël ». Le conserver respecte la forme particulière du verset et son lien avec l’identité du peuple présent.
- issue: Rapport entre la parole divine et les actes d’Élie
  choice: par ta parole
  alternative: selon ta parole / sur ta parole
  rationale: La construction hébraïque peut présenter la parole de Dieu comme moyen, fondement ou norme de l’action. Le texte principal reste proche de la formulation source et la note préserve les autres nuances.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve le rythme solennel de la prière, avec une syntaxe fluide. Les marqueurs de note sont placés précisément après les expressions qu’ils commentent.
