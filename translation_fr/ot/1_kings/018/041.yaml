  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ לְ/אַחְאָ֔ב עֲלֵ֖ה אֱכֹ֣ל וּ/שְׁתֵ֑ה כִּי ק֖וֹל הֲמ֥וֹן הַ/גָּֽשֶׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/041.yaml
  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: fr
  text: 'Élie dit à Achab : « Monte, mange et bois, car le grondement d’une forte pluie se fait entendre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le bruit du tumulte de la pluie » ou « le bruit d’une abondance de pluie ». Le mot hébreu peut évoquer un grondement, un fracas ou une grande abondance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw consécutif fait avancer le récit; en français narratif, le passé simple suffit sans imposer un connecteur absent du sens principal.
- source_word: אֵלִיָּהוּ לְאַחְאָב
  choice: Élie dit à Achab
  rationale: Les noms suivent l’usage français traditionnel, et לְ marque le destinataire de la parole.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה conserve le mouvement ascendant indiqué par le contexte.
- source_word: אֱכֹל וּשְׁתֵה
  choice: mange et bois
  rationale: Traduction directe et naturelle des deux impératifs.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Élie.
- source_word: קוֹל הֲמוֹן הַגָּשֶׁם
  choice: j’entends le grondement de la pluie
  rationale: La tournure française rend naturellement l’expression hébraïque compacte où קוֹל désigne un bruit perceptible et הֲמוֹן un tumulte ou grondement. L’ajout idiomatique de « j’entends » explicite le rapport du locuteur au bruit sans transformer celui-ci en simple abondance quantitative.
theological_decisions:
- issue: Nature prophétique ou auditive de l’affirmation
  choice: Conserver l’image d’un bruit de pluie entendu par Élie
  alternative: « une pluie abondante arrive »
  rationale: L’hébreu parle littéralement du « bruit » ou de la « voix » du tumulte de la pluie; la traduction ne précise pas si Élie l’entend physiquement ou prophétiquement.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au récit biblique écrit; les impératifs restent directs. La note préserve la densité et l’ambiguïté de l’expression hébraïque.
