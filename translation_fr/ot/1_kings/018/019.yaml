source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: fr
  text: Maintenant, envoie convoquer auprès de moi tout Israël au mont Carmel[a], ainsi que les quatre cent cinquante prophètes de Baal et les quatre cents prophètes d’Ashéra[b], qui mangent à la table de Jézabel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « vers le mont Carmel ». La préposition hébraïque indique un mouvement en direction du lieu de rassemblement.'
    reason: lexical_alternative
  - marker: b
    text: « Ashéra » peut désigner la déesse portant ce nom ou, dans certains contextes, un objet cultuel qui lui est associé. Ici, le parallèle avec Baal favorise la référence à la divinité.
    reason: cultural_note
  - marker: c
    text: L’expression peut aussi se rendre par « qui prennent leurs repas à la table de Jézabel » ; elle indique qu’ils bénéficient de son soutien royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque la transition vers l’ordre immédiat d’Élie. « Maintenant » est naturel en français actuel sans qu’il soit nécessaire de reproduire mécaniquement la conjonction initiale.
- source_word: שְׁלַח קְבֹץ
  choice: envoie rassembler
  rationale: Cette formulation conserve les deux idées de l’hébreu — envoyer et réunir — tout en indiquant naturellement qu’Achab doit faire procéder au rassemblement.
- source_word: אֵלַי
  choice: auprès de moi
  rationale: Exprime le mouvement en direction d’Élie sans introduire l’idée plus interprétative de comparution « devant » lui.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Conserve la désignation collective et nationale ainsi que l’ampleur rhétorique de l’expression hébraïque.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: au mont Carmel
  rationale: Désigne en français le lieu où doit se faire le rassemblement; la préposition hébraïque exprime proprement le mouvement vers ce lieu, signalé en note.
- source_word: נְבִיאֵי הַבַּעַל
  choice: les quatre cent cinquante prophètes de Baal
  rationale: La construction française place naturellement le nombre avant le groupe nominal tout en conservant l’association explicite des prophètes avec Baal.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: les quatre cents prophètes d’Ashéra
  rationale: Le nom propre « Ashéra » est retenu en raison du parallélisme avec Baal, sans imposer dans le texte l’interprétation d’un objet cultuel.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: qui mangent à la table de Jézabel
  rationale: Rend directement l’image hébraïque. Elle évoque leur entretien par le patronage royal sans transformer cette implication en paraphrase explicite.
theological_decisions:
- issue: Sens de אֲשֵׁרָה dans ce verset
  choice: Ashéra est compris et transcrit comme le nom de la divinité.
  alternative: Comprendre le terme comme désignant un objet cultuel associé à Ashéra.
  rationale: Le parallélisme avec « les prophètes de Baal » favorise ici la référence à la divinité. Une note maintient néanmoins visible l’autre valeur attestée du terme.
- issue: Portée de כָּל יִשְׂרָאֵל
  choice: Conserver l’expression collective « tout Israël ».
  alternative: Expliciter par « tous les Israélites » ou par une représentation nationale.
  rationale: L’hébreu emploie une désignation nationale globale. La traduction en préserve la force sans décider si chaque individu est visé de manière distributive.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de l’hébreu tout en évitant un calque artificiel; les nombres sont écrits en toutes lettres selon l’usage littéraire.
