  text: וַ֠/יִּקְחוּ אֶת הַ/פָּ֨ר אֲשֶׁר נָתַ֣ן לָ/הֶם֮ וַֽ/יַּעֲשׂוּ֒ וַ/יִּקְרְא֣וּ בְ/שֵׁם הַ֠/בַּעַל מֵ/הַ/בֹּ֨קֶר וְ/עַד הַ/צָּהֳרַ֤יִם לֵ/אמֹר֙ הַ/בַּ֣עַל עֲנֵ֔/נוּ וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין עֹנֶ֑ה וַֽ/יְפַסְּח֔וּ עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֥ר עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: fr
  text: 'Ils prirent donc le taureau qui leur avait été donné, le préparèrent et invoquèrent le nom de Baal depuis le matin jusqu’à midi, en disant : « Baal, réponds-nous ! » Mais il n’y eut aucune voix, et personne ne répondit. Alors ils boitèrent[a] autour de l’autel qui avait été fait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils dansaient autour de l’autel » ou « ils bondissaient autour de l’autel ». Le verbe hébreu évoque probablement un mouvement rituel exécuté en boitant ou en sautillant et peut intentionnellement faire écho à l’emploi de la même racine par Élie au verset 21.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: ils prirent
  rationale: Rend simplement le wayyiqtol narratif de לקח et convient à la réception du taureau mentionné au verset précédent.
- source_word: הַפָּר
  choice: le taureau
  rationale: פַּר désigne couramment un taureau destiné au sacrifice; « taureau » est précis et naturel en français.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: qui leur avait été donné
  rationale: Le passif évite d’expliciter le sujet sous-entendu tout en situant naturellement le don avant l’action principale.
- source_word: וַיַּעֲשׂוּ
  choice: le préparèrent
  rationale: Dans ce contexte sacrificiel, עשה est elliptique et désigne la préparation de l’animal; « l’offrirent » anticiperait indûment l’étape du feu.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: invoquèrent le nom de Baal
  rationale: Rend avec naturel l’idiome cultuel קרא בשם, sans en affaiblir la référence explicite au nom.
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: depuis le matin jusqu’à midi
  rationale: Expression française claire et fidèle à toute la durée indiquée.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: Baal, réponds-nous !
  rationale: Conserve l’adresse directe et rend ענה par le verbe français habituel dans un appel adressé à une divinité.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: il n’y eut aucune voix, et personne ne répondit
  rationale: Préserve la double négation emphatique ainsi que la distinction entre l’absence de voix et l’absence de répondant.
- source_word: וַיְפַסְּחוּ
  choice: ils se mirent à boiter
  rationale: « Boiter » maintient le sens premier possible de פסח et son écho littéraire probable avec le verset 21, tandis que la note signale les autres mouvements rituels possibles.
- source_word: עַל הַמִּזְבֵּחַ
  choice: autour de l’autel
  rationale: Dans ce contexte de mouvement rituel, עַל indique vraisemblablement un déplacement auprès ou autour de l’autel, non sur sa surface.
- source_word: אֲשֶׁר עָשָׂה
  choice: qui avait été fait
  rationale: Le passif français conserve l’indétermination du sujet de la forme masculine singulière עָשָׂה et évite d’identifier arbitrairement celui qui avait fait l’autel.
theological_decisions:
- issue: Formulation de l’invocation adressée à Baal
  choice: invoquèrent le nom de Baal
  alternative: invoquèrent Baal
  rationale: La formulation retenue préserve l’idiome biblique de l’appel au nom d’une divinité sans suggérer que cet appel soit légitime ou efficace.
- issue: Sens de וַיְפַסְּחוּ
  choice: ils se mirent à boiter autour de l’autel
  alternative: ils dansèrent / bondirent autour de l’autel
  rationale: Le choix garde la tension lexicale et l’ironie probable liées à la même racine au verset 21, sans exclure les nuances rituelles concurrentes, données en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique littéraire sans archaïsme marqué. La répétition négative de l’hébreu est conservée pour sa force rhétorique.
