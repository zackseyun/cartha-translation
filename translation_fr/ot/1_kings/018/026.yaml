  - severity: low
    issue: Formulation elliptique des variantes dans la note
    rationale: « Ou “à danser” » ne constitue pas à elle seule une alternative aussi claire que « ils dansaient autour de l’autel ». Des formulations complètes améliorent la lisibilité sans modifier l’analyse.
