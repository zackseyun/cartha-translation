source:
  edition: WLC
  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: fr
  text: 'Ne vous a-t-on pas raconté, mon seigneur, ce que j’ai fait lorsque Jézabel tuait les prophètes de Yahweh : j’ai caché cent hommes parmi les prophètes de Yahweh, cinquante hommes dans une grotte[a], et je leur ai fourni du pain et de l’eau ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cinquante, cinquante hommes dans la grotte ». Cette tournure hébraïque indique une répartition par groupes de cinquante ; on peut aussi comprendre : « cinquante hommes dans chaque grotte » ou « deux groupes de cinquante dans des grottes ».'
    reason: La répétition de « cinquante » est distributive, tandis que le singulier « la grotte » peut être compris de manière générique ou distributive ; la formulation exacte de la disposition reste discutée.
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: N’a-t-on pas raconté à mon seigneur
  rationale: La question rhétorique attend une réponse affirmative. Le passif hébreu se rend naturellement en français par le pronom indéfini « on », tandis que « mon seigneur » conserve l’adresse respectueuse à Élie sans en faire un titre divin.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי
  choice: ce que j’ai fait
  rationale: Rendu direct et idiomatique de la proposition relative objet ; le passé composé convient à une action passée invoquée pour expliquer la situation présente.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: quand Jézabel faisait mourir
  rationale: La préposition avec l’infinitif construit exprime ici la circonstance temporelle. L’imparfait présente la mise à mort comme une action en cours, et « faisait mourir » traduit clairement l’action meurtrière sans suggérer nécessairement qu’elle l’accomplissait de ses propres mains.
- source_word: נְבִיאֵי יְהוָה
  choice: les prophètes de Yahweh
  rationale: Le groupe construit est rendu explicitement, et le tétragramme est translittéré par « Yahweh ».
- source_word: וָאַחְבִּא מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: J’ai caché cent des prophètes de Yahweh
  rationale: 'La construction avec מִן est partitive : les cent appartiennent à l’ensemble des prophètes de Yahweh. En français, « cent des prophètes » est plus naturel que l’ajout de « hommes », lequel apparaît ensuite dans l’expression distributive.'
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: cinquante hommes par grotte
  rationale: La répétition de « cinquante » marque une répartition en groupes de cinquante. « Par grotte » conserve cette valeur distributive tout en restant naturel et sans imposer plus de précision que l’hébreu.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: et je leur ai fourni du pain et de l’eau
  rationale: Le verbe désigne le fait d’entretenir ou de pourvoir aux besoins. « Fournir » exprime naturellement cette prise en charge, tandis que les provisions concrètes sont conservées.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Portée de מִנְּבִיאֵי יְהוָה
  choice: cent des prophètes de Yahweh
  alternative: cent hommes pris parmi les prophètes de Yahweh
  rationale: La valeur partitive est maintenue sans transformer le groupe en catégorie théologique différente ni ajouter une nuance absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et le respect d’Abdias envers Élie sont conservés. La seconde phrase évite une longue subordination peu naturelle en français, tout en maintenant le lien explicatif avec ce qu’Abdias a fait.
