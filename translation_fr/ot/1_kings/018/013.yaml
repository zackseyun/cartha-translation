revisions:
- from: N’a-t-on pas raconté à mon seigneur ce que j’ai fait quand Jézabel faisait mourir les prophètes de Yahweh ? J’ai caché cent des prophètes de Yahweh[a], cinquante hommes par grotte, et je leur ai fourni du pain et de l’eau.
  to: 'Ne vous a-t-on pas raconté, mon seigneur, ce que j’ai fait lorsque Jézabel tuait les prophètes de Yahweh : j’ai caché cent hommes parmi les prophètes de Yahweh, cinquante hommes dans une grotte[a], et je leur ai fourni du pain et de l’eau ?'
  rationale: La révision rétablit « cent hommes », rattache explicitement les actes d’Abdias à la question rhétorique, et déplace la note à l’expression qu’elle explique. « Cinquante hommes dans une grotte » conserve le singulier hébreu sans imposer dans le texte principal soit « chaque », soit un nombre déterminé de grottes ; les possibilités de formulation sont signalées en note.
