source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֤הוּ לְ/כָל הָ/עָם֙ גְּשׁ֣וּ אֵלַ֔/י וַ/יִּגְּשׁ֥וּ כָל הָ/עָ֖ם אֵלָ֑י/ו וַ/יְרַפֵּ֛א אֶת מִזְבַּ֥ח יְהוָ֖ה הֶ/הָרֽוּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: fr
  text: 'Alors Élie dit à tout le peuple : « Approchez-vous de moi. » Tout le peuple s’approcha de lui, et il répara[a] l’autel de Yahweh qui avait été démoli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « guérit »; on pourrait aussi traduire : « remit en état ».'
    reason: Le verbe hébreu רפא signifie normalement « guérir », emploi métaphorique remarquable lorsqu’il a pour objet l’autel.
lexical_decisions:
- source_word: גְּשׁוּ / וַיִּגְּשׁוּ
  choice: Approchez-vous / s’approcha
  rationale: Le verbe נגשׁ exprime ici un mouvement physique vers Élie. La reprise du même verbe français fait correspondre l’exécution à l’ordre donné.
- source_word: וַיְרַפֵּא
  choice: répara
  rationale: רפא signifie littéralement « guérir », mais, appliqué à un autel, il désigne sa remise en état. « Répara » est naturel et concret en français.
- source_word: מִזְבַּח יְהוָה
  choice: l’autel de Yahweh
  rationale: Cette formulation rend directement la relation construite et conserve le nom divin personnel.
- source_word: הֶהָרוּס
  choice: qui avait été démoli
  rationale: Le participe passif de הרס indique que l’autel avait été abattu ou détruit auparavant. « Démoli » garde la force concrète du terme.
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit; « Alors » exprime naturellement cette succession en français moderne.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: Rendu collectif idiomatique de l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve ici le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme lexical entre l’ordre d’Élie et la réaction du peuple est conservé; la métaphore hébraïque « guérir » est signalée en note sans rendre le corps du texte artificiel.
