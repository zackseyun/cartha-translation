source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: fr
  text: Quand je t’aurai quitté, l’Esprit de Yahweh[a] t’emportera je ne sais où. Quand j’irai annoncer la nouvelle à Achab et qu’il ne te trouvera pas, il me tuera. Pourtant, ton serviteur craint Yahweh depuis sa jeunesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le vent de Yahweh » : le mot hébreu peut signifier « esprit », « vent » ou « souffle » ; ici, « Esprit » convient le mieux au contexte.'
    reason: Alternative lexicale authentique de רוּחַ.
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: Quand je t’aurai quitté
  rationale: Le futur antérieur exprime naturellement en français l’action antérieure envisagée dans cette éventualité, sans alourdir par une formule littérale comme « il arrivera que ».
- source_word: רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  rationale: Dans ce contexte prophétique, רוּחַ désigne le plus naturellement l’agent divin susceptible de transporter Élie; la possibilité lexicale « vent » est conservée en note.
- source_word: יִשָּׂאֲךָ
  choice: pourra t’emporter
  rationale: נשא signifie porter ou emporter. « pourra » rend la crainte hypothétique exprimée par Abdias dans le contexte, tandis que « emporter » convient au déplacement soudain redouté.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: je ne sais où
  rationale: Expression française naturelle qui préserve l’idée d’une destination inconnue sans introduire un lieu précis absent de l’hébreu.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: Puis j’irai prévenir Achab
  rationale: Le mouvement vers Achab est implicite dans וּבָאתִי, et הגיד signifie ici lui transmettre l’information. « Prévenir » restitue clairement la fonction du rapport.
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: 'et il ne te trouvera pas : alors il me tuera'
  rationale: La formulation conserve la séquence future et rend explicitement, par « alors », le rapport de conséquence porté par le récit.
- source_word: וְעַבְדְּךָ
  choice: ton serviteur
  rationale: Il s’agit ici d’une autodésignation déférente d’Abdias devant Élie, non d’une insistance sur un statut servile.
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: craint Yahweh depuis sa jeunesse
  rationale: Le présent avec « depuis » exprime en français une disposition commencée dans la jeunesse et toujours actuelle; « craindre » conserve la notion biblique de crainte révérencielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Sens de רוּחַ יְהוָה
  choice: l’Esprit de Yahweh
  alternative: le vent de Yahweh
  rationale: L’action personnelle de transporter le prophète et le contexte narratif favorisent « Esprit », mais le champ sémantique de רוּחַ autorise « vent »; cette ambiguïté réelle est signalée en note.
- issue: Nature de la crainte de Yahweh
  choice: craint Yahweh
  alternative: révère Yahweh
  rationale: « Craindre » maintient la tension du vocabulaire biblique entre peur, respect et fidélité religieuse, sans la réduire silencieusement à la seule révérence.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération représente directement le tétragramme du texte source et évite de substituer un titre au nom propre.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La syntaxe suit clairement la chaîne de conséquences redoutée par Abdias. Le nom « Yahweh » est conservé, et l’ambiguïté de רוּחַ est signalée sans obscurcir le texte principal.
