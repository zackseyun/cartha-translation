  text: וַ/יֹּ֥אמֶר ל֖/וֹ אָ֑נִי לֵ֛ךְ אֱמֹ֥ר לַ/אדֹנֶ֖י/ךָ הִנֵּ֥ה אֵלִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: fr
  text: 'Il lui répondit : « C’est bien moi.[a] Va dire à ton maître : “Élie est là.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte simplement le pronom emphatique « moi », employé ici pour s’identifier. On pourrait aussi traduire : « C’est moi. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Il lui répondit
  rationale: Dans le fil narratif, וַיֹּאמֶר introduit la réponse d’Élie à la question d’Abdias au verset précédent. « Répondit » exprime naturellement cette relation en français, tandis que « lui » rend לוֹ.
- source_word: אָ֑נִי
  choice: C’est bien moi
  rationale: Le pronom indépendant sert ici d’identification emphatique. « C’est bien moi » est idiomatique en français et conserve l’insistance du texte hébreu sans ajouter de prédicat explicite.
- source_word: לֵךְ אֱמֹר
  choice: Va dire
  rationale: Les deux impératifs successifs, « va » et « dis », forment naturellement en français la tournure « Va dire », qui conserve à la fois le mouvement et l’ordre de transmettre le message.
- source_word: לַאדֹנֶיךָ
  choice: à ton maître
  rationale: אָדוֹן désigne ici Achab, le supérieur humain d’Abdias. « Maître » rend la relation d’autorité et évite une confusion avec le titre divin « Seigneur ».
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Élie est là
  rationale: הִנֵּה attire l’attention sur la présence d’Élie. Dans ce message rapporté, « Élie est là » rend cette valeur déictique de façon naturelle et actuelle.
theological_decisions:
- issue: Rendu de אָדוֹן pour un supérieur humain
  choice: maître
  alternative: seigneur
  rationale: Le référent est Achab, non Dieu. « Maître » préserve clairement la distinction avec le titre divin tout en exprimant l’autorité sociale.
- issue: Nature de l’auto-identification אָ֑נִי
  choice: C’est bien moi
  alternative: Moi / C’est moi
  rationale: L’hébreu ne comporte que le pronom emphatique. La traduction retenue explicite seulement ce que l’idiome français exige et marque l’emphase sans transformer l’énoncé en formule théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste bref et direct; la formulation évite l’archaïsme « voici » tout en conservant la force de l’identification et de l’annonce.
