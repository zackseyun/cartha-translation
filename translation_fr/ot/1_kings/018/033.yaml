  text: Puis il disposa le bois, découpa le taureau en morceaux et plaça les morceaux sur le bois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: il disposa
  rationale: Le verbe ערך exprime ici l’action d’ordonner ou de disposer le bois en vue du sacrifice. « Disposa » est naturel, précis et adapté au contexte rituel.
- source_word: הָעֵצִים
  choice: le bois
  rationale: Le pluriel hébreu désigne collectivement les pièces de bois servant de combustible. En français courant, le collectif singulier « le bois » est le plus idiomatique.
- source_word: וַיְנַתַּח
  choice: découpa ... en morceaux
  rationale: Le verbe נתח désigne le fait de diviser un animal en plusieurs morceaux, notamment lors de la préparation d’un sacrifice. Cette formulation rend explicitement l’action sans employer un terme trop technique.
- source_word: הַפָּר
  choice: le taureau
  rationale: Dans ce contexte sacrificiel, פַּר désigne un bovin mâle. « Taureau » en donne une traduction directe sans préciser un âge que le verset n’impose pas.
- source_word: וַיָּשֶׂם
  choice: le plaça
  rationale: Le verbe שׂים indique ici que l’animal découpé est posé délibérément sur le bois. « Plaça » convient au caractère ordonné de la préparation.
- source_word: עַל הָעֵצִים
  choice: sur le bois
  rationale: La préposition עַל a ici son sens spatial ordinaire. « Sur le bois » est clair et idiomatique.
