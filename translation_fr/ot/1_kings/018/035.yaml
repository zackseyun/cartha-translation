  text: וַ/יֵּלְכ֣וּ הַ/מַּ֔יִם סָבִ֖יב לַ/מִּזְבֵּ֑חַ וְ/גַ֥ם אֶת הַ/תְּעָלָ֖ה מִלֵּא מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: fr
  text: L’eau se répandit tout autour de l’autel[a] et remplit aussi d’eau le fossé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « alla tout autour de l’autel »; le verbe décrit ici le mouvement de l’eau.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la rigole » ou « la tranchée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: se répandit
  rationale: Le verbe signifie littéralement « aller », mais, avec l’eau pour sujet, il décrit ici son mouvement. « Se répandit » est naturel en français et convient au contexte sans préciser indûment la manière dont elle s’écoula.
- source_word: הַמַּיִם
  choice: L’eau
  rationale: Le nom hébreu, de forme plurielle, se rend naturellement en français par le nom massif singulier « l’eau ».
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: tout autour de l’autel
  rationale: סָבִיב exprime l’espace environnant; « tout autour » restitue clairement l’idée d’encerclement.
- source_word: וְגַם
  choice: et ... aussi
  rationale: Cette formulation rend l’ajout emphatique de וְגַם dans un ordre naturel en français.
- source_word: אֶת־הַתְּעָלָה
  choice: le fossé
  rationale: Dans ce contexte, תְּעָלָה désigne l’excavation aménagée autour de l’autel. « Fossé » est courant et concret; « rigole » reste possible.
- source_word: מִלֵּא
  choice: remplit
  rationale: Correspondance directe et idiomatique du verbe « remplir »; le sujet implicite demeure l’eau.
- source_word: מָיִם
  choice: d’eau
  rationale: Après « remplir », le français emploie naturellement le complément introduit par « de ».
