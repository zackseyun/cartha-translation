source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: fr
  text: 'Il répondit : « Ce n’est pas moi qui ai attiré le malheur sur Israël, mais toi et la famille de ton père, parce que vous avez abandonné les commandements de Yahweh et que tu as suivi les Baals[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte le pluriel « les Baals », qui peut désigner les diverses formes locales ou manifestations du culte de Baal.
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: ai attiré le malheur sur
  rationale: Le verbe עכר désigne ici le fait de causer un malheur ou de jeter le trouble sur une communauté. Cette tournure naturelle en français reprend précisément l’accusation du verset précédent.
- source_word: כִּי אִם
  choice: mais
  rationale: Dans cette construction, les particules opposent la dénégation d’Élie à la réorientation de l’accusation vers Achab.
- source_word: וּבֵית אָבִיךָ
  choice: et la famille de ton père
  rationale: Littéralement « la maison de ton père ». En français actuel, « la famille de ton père » exprime clairement la responsabilité familiale ou dynastique sans suggérer un bâtiment.
- source_word: בַּעֲזָבְכֶם
  choice: parce que vous avez abandonné
  rationale: La préposition ב avec l’infinitif construit a ici une valeur causale. Le suffixe pluriel exige « vous », visant Achab et la maison de son père.
- source_word: מִצְוֺת
  choice: les commandements
  rationale: Ce terme conserve la portée juridique et relationnelle de מִצְוֺת dans le cadre de l’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la forme usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: tu as suivi
  rationale: L’expression signifie suivre quelqu’un dans l’allégeance ou le culte. Le verbe hébreu est au singulier et s’adresse directement à Achab.
- source_word: הַבְּעָלִים
  choice: les Baals
  rationale: Le pluriel explicite de l’hébreu est conservé; il peut renvoyer aux diverses formes locales ou manifestations cultuelles de Baal.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de le remplacer par un titre.
- issue: Pluriel הַבְּעָלִים
  choice: les Baals
  alternative: Baal
  rationale: Le pluriel hébreu est significatif et ne doit pas être réduit silencieusement au singulier.
- issue: Alternance entre le pluriel et le singulier dans l’accusation
  choice: « vous avez abandonné » puis « tu as suivi »
  alternative: uniformiser au pluriel ou au singulier
  rationale: Le texte hébreu passe du suffixe pluriel בַּעֲזָבְכֶם, qui englobe Achab et sa maison, au verbe singulier וַתֵּלֶךְ, qui interpelle Achab. La traduction préserve cette variation.
translation_notes:
  register: Français moderne, direct et digne. « Attirer le malheur sur » rend le poids de עכר plus nettement que le simple « troubler ». La variation « vous »/« tu » est volontaire et reproduit les nombres grammaticaux de l’hébreu.
