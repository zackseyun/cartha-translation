  text: וַֽ/יִּקְרְאוּ֙ בְּ/ק֣וֹל גָּד֔וֹל וַ/יִּתְגֹּֽדְדוּ֙ כְּ/מִשְׁפָּטָ֔/ם בַּ/חֲרָב֖וֹת וּ/בָֽ/רְמָחִ֑ים עַד שְׁפָךְ דָּ֖ם עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/028.yaml
  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: fr
  text: Alors ils crièrent d’une voix forte et se firent des incisions[a] avec des épées et des lances, selon leur coutume[b], jusqu’à ce que le sang coule sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se tailladèrent ». L’hébreu désigne une autolacération rituelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « selon leur pratique » ou « comme ils en avaient l’habitude ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: ils crièrent
  rationale: Dans ce contexte d’invocation rituelle de Baal, קרא exprime un appel poussé avec force plutôt qu’un simple fait d’appeler.
- source_word: בְּקוֹל גָּדוֹל
  choice: d’une voix forte
  rationale: Cette tournure française naturelle conserve l’expression concrète de l’hébreu.
- source_word: וַיִּתְגֹּדְדוּ
  choice: se tailladèrent
  rationale: La forme réfléchie désigne des incisions rituelles que les participants s’infligent eux-mêmes; « se tailladèrent » rend ce geste plus précisément que le général « se coupèrent ».
- source_word: כְּמִשְׁפָּטָם
  choice: selon leur coutume
  rationale: מִשְׁפָּט désigne ici leur manière de faire établie ou leur pratique rituelle habituelle, non une décision judiciaire.
- source_word: בַּחֲרָבוֹת
  choice: avec des épées
  rationale: La préposition ב marque ici l’instrument.
- source_word: וּבָרְמָחִים
  choice: et des lances
  rationale: רְמָחִים désigne des armes d’hast; « lances » est précis et courant en français moderne.
- source_word: עַד שְׁפָךְ דָּם
  choice: jusqu’à ce que le sang coule
  rationale: La construction avec עַד indique l’étendue ou le résultat du geste. « Coule » restitue sobrement l’écoulement du sang sans imposer l’intensité plus forte de « jaillisse ».
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: La préposition עַל situe le sang sur leur corps; la formulation française reste volontairement proche de l’image hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme excessif. « Se tailladèrent » explicite naturellement le caractère réfléchi de la lacération rituelle, tandis que les notes préservent les nuances possibles de כְּמִשְׁפָּטָם et de la proposition finale.
