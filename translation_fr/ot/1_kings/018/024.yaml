base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: fr
  text: '«Invoquez le nom de votre dieu[a], et moi, j’invoquerai le nom de Yahweh. Le dieu qui répondra par le feu, c’est lui qui est Dieu.» Tout le peuple répondit: «Cette proposition est bonne[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vos dieux», si אֱלֹהֵיכֶם est compris comme un véritable pluriel plutôt que comme la désignation d’une seule divinité.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu דָּבָר peut aussi se traduire par «parole», «affaire» ou «chose»; ici, il désigne la proposition soumise au peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: Invoquez le nom de
  rationale: En contexte cultuel, קרא avec בְּשֵׁם désigne l’invocation d’une divinité par son nom. «Invoquez le nom de» est naturel en français et conserve ce sens.
- source_word: אֱלֹהֵיכֶם
  choice: votre dieu
  rationale: אֱלֹהִים est de forme plurielle, mais peut désigner une seule divinité. Ici, les prophètes doivent invoquer Baal, face à Yahweh; le singulier convient donc au contexte immédiat, tout en signalant l’autre lecture en note.
- source_word: וַאֲנִי אֶקְרָא
  choice: et moi, j’invoquerai
  rationale: Le pronom indépendant אֲנִי est rendu par «moi» afin de conserver l’opposition emphatique entre les deux parties.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: le dieu qui répondra par le feu
  rationale: La minuscule dans «le dieu» maintient le cadre du concours entre deux prétendants à la divinité sans présumer du verdict; בָאֵשׁ est rendu dans son sens instrumental par «par le feu».
- source_word: הוּא הָאֱלֹהִים
  choice: c’est lui qui est Dieu
  rationale: La tournure disloquée restitue l’insistance du pronom הוּא et le caractère décisif de l’identification finale.
- source_word: וַיַּעַן כָּל־הָעָם וַיֹּאמְרוּ
  choice: Tout le peuple répondit
  rationale: En français, «répondit» exprime naturellement la réponse verbale; ajouter «et dit» alourdirait inutilement la narration.
- source_word: טוֹב הַדָּבָר
  choice: Cette proposition est bonne
  rationale: Dans ce contexte, דָּבָר désigne la proposition d’Élie. «Cette proposition est bonne» exprime clairement l’approbation du peuple, tandis que l’étendue lexicale du terme est conservée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Nombre de אֱלֹהֵיכֶם
  choice: votre dieu
  alternative: vos dieux
  rationale: La forme peut être comprise comme un pluriel véritable, mais le duel narratif oppose ici Baal à Yahweh et favorise le singulier. L’ambiguïté morphologique est explicitement conservée en note.
- issue: Statut du premier הָאֱלֹהִים dans la formule du verdict
  choice: le dieu qui répondra
  alternative: Dieu qui répondra
  rationale: La proposition énonce le critère qui identifiera le vrai Dieu parmi les divinités revendiquées. La minuscule évite d’anticiper le résultat, tandis que «Dieu» dans la conclusion marque l’identification finale.
translation_notes:
  register: Français international moderne, digne et direct. L’impératif «Invoquez» garde la portée cultuelle de l’expression hébraïque; la formulation «c’est lui qui est Dieu» conserve l’emphase et la tension théologique du test.
