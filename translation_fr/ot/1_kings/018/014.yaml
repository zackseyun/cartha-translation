  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: fr
  text: 'Et maintenant, tu dis : « Va dire à ton maître : “Voici Élie !” » Et il me tuera.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Reproduit la transition emphatique du texte hébreu dans un français naturel.
- source_word: לַאדֹנֶיךָ
  choice: à ton maître
  rationale: אדון désigne ici le maître humain d'Abdias, le roi Achab, et non le nom divin.
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Voici Élie !
  rationale: « Voici » rend directement la particule présentative הִנֵּה et convient au registre narratif sans surinterprétation.
- source_word: וַהֲרָגָנִי
  choice: Et il me tuera
  rationale: Le contexte donne à la forme verbale une portée prospective; le sujet implicite renvoie naturellement au maître mentionné juste avant.
