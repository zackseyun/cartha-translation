  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: fr
  text: 'Il répondit : « Quel péché ai-je commis pour que tu livres ton serviteur aux mains d’Achab, pour qu’il me mette à mort[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour qu’il me tue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Dans ce dialogue, le wayyiqtol introduit la réplique d’Abdias ; « Il répondit » rend naturellement la fonction discursive sans alourdir le récit.
- source_word: מֶה חָטָאתִי
  choice: Quel péché ai-je commis
  rationale: Cette formulation conserve le sens moral et religieux de חטא ainsi que la force interrogative de מֶה, dans un français actuel et idiomatique.
- source_word: כִּי
  choice: pour que
  rationale: Dans cette question de protestation, כִּי introduit la conséquence supposée de la faute ; « pour que » exprime naturellement ce rapport sans affirmer qu’Élie cherche réellement sa mort.
- source_word: נֹתֵן
  choice: tu livres
  rationale: Le participe exprime une action envisagée comme imminente. « Livrer » rend ici l’idée de remettre quelqu’un au pouvoir d’un autre.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Il s’agit d’une formule déférente d’auto-désignation ; « serviteur » convient mieux au contexte que « esclave ».
- source_word: בְּיַד אַחְאָב
  choice: aux mains d’Achab
  rationale: Cette expression conserve la métaphore hébraïque du pouvoir et du contrôle tout en étant idiomatique en français.
- source_word: לַהֲמִיתֵנִי
  choice: afin qu’il me fasse mourir
  rationale: La forme causative de מות signifie littéralement « faire mourir ». La formulation garde cette valeur et indique naturellement qu’Achab serait l’agent de l’exécution.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La question conserve la protestation morale d’Abdias et la métaphore hébraïque des « mains » comme expression du pouvoir.
