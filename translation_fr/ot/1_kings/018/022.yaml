source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: fr
  text: 'Alors Élie dit au peuple : « Moi seul, je suis resté prophète de Yahweh[a], mais les prophètes de Baal sont au nombre de quatre cent cinquante hommes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Moi seul, je reste prophète de Yahweh. » Cette déclaration décrit la position publique d’Élie dans cet affrontement, bien que le récit mentionne ailleurs d’autres prophètes cachés par Abdias (1 Rois 18.4, 13).'
    reason: Signaler une autre façon de rendre le verbe hébreu et préserver la tension narrative sans modifier les paroles rapportées.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait avancer le récit. « Alors » rend naturellement cette progression narrative en français moderne.
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: אֶל הָעָם
  choice: au peuple
  rationale: עָם désigne ici le peuple d’Israël rassemblé, plutôt qu’une foule indéterminée.
- source_word: אֲנִי
  choice: Moi, je
  rationale: La dislocation française « Moi, je » restitue avec naturel l’insistance produite par le pronom hébreu explicite devant le verbe déjà conjugué.
- source_word: נוֹתַרְתִּי
  choice: je suis resté
  rationale: 'Le parfait décrit l’état résultant d’Élie : il est demeuré ou a été laissé dans cette situation. « Je suis resté » conserve cette nuance sans trancher explicitement entre valeur active et passive.'
- source_word: לְבַדִּי
  choice: seul
  rationale: Le terme souligne l’isolement revendiqué par Élie.
- source_word: נָבִיא לַיהוָה
  choice: comme prophète de Yahweh
  rationale: « Comme prophète » exprime le statut dans lequel Élie dit être resté, et « de Yahweh » rend idiomatiquement l’appartenance et le service indiqués par לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: tandis que les prophètes de Baal
  rationale: Le waw introduit ici un contraste numérique marqué. « Tandis que » le rend clairement; le nom propre Baal s’emploie naturellement sans article en français.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: sont quatre cent cinquante hommes
  rationale: La formulation conserve le nombre écrit en toutes lettres et rend אִישׁ, terme de comptage individualisant explicitement masculin.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. La transcription préserve le nom personnel sans le remplacer par un titre.
- issue: Affirmation d’Élie selon laquelle il est resté seul
  choice: Moi, je suis resté seul comme prophète de Yahweh
  alternative: Moi seul, je reste prophète de Yahweh
  rationale: La formulation conserve l’affirmation telle qu’elle est prononcée, sans l’harmoniser avec les mentions des prophètes cachés par Abdias en 1 Rois 18.4, 13. Elle maintient aussi la possibilité de comprendre נוֹתַרְתִּי comme « suis resté » ou « ai été laissé ».
translation_notes:
  register: Français international moderne, digne et accessible. La tournure disloquée « Moi, je » porte l’emphase hébraïque sans recourir à la répétition peu naturelle « Je, moi seul ». Le contraste est explicité par « tandis que », et la structure de comptage hébraïque est conservée malgré son caractère légèrement soutenu en français.
