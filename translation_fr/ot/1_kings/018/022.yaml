  source_fidelity: 'Le sens fondamental est fidèle : Élie s’adresse au peuple, affirme être le seul prophète de Yahweh qui soit resté, et oppose son isolement aux 450 prophètes de Baal. « Moi seul » rend plus directement la combinaison emphatique de אָנֹכִי / אֲנִי explicite et de לְבַדִּי, sans affaiblir la portée de l’affirmation.'
  naturalness: La formulation actuelle « je suis resté seul comme prophète » est compréhensible, mais peut laisser entendre qu’Élie est resté seul dans son rôle plutôt qu’il est le seul prophète restant. « Moi seul, je suis resté prophète de Yahweh » est plus idiomatique et plus précis. « Sont au nombre de quatre cent cinquante hommes » est aussi plus naturel que « sont quatre cent cinquante hommes », tout en conservant le terme explicite « hommes ».
  terminology: Élie, Yahweh, Baal et Abdias sont les formes françaises usuelles et cohérentes. « Prophète de Yahweh » rend correctement le rapport exprimé par לַיהוָה. Le maintien de « Yahweh » respecte le choix de rendre le tétragramme par le nom divin.
