    rationale: En français, cette séquence peut décrire la manière dont Élie est resté plutôt que signifier sans équivoque qu’il est l’unique prophète de Yahweh restant. Le déplacement de « seul » vers « Moi seul » clarifie la relation avec le prédicat.
  - severity: low
    issue: Prédicat numérique peu idiomatique
    rationale: « Les prophètes de Baal sont quatre cent cinquante hommes » est calqué sur la structure source. « Sont au nombre de quatre cent cinquante hommes » demeure fidèle au comptage explicite tout en étant plus naturel en français moderne.
