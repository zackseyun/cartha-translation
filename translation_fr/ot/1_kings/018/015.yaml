revisions:
- from: 'Élie dit : « Aussi vrai que Yahweh, le maître des armées, est vivant, lui devant qui je me tiens, aujourd’hui je me présenterai certainement devant Achab[a]. »'
  to: 'Élie dit : « Aussi vrai que Yahweh des armées est vivant, devant qui je me tiens, aujourd’hui je me présenterai[a] devant Achab. »'
  rationale: La révision maintient la formule solennelle du serment et l’explicitation contextuelle d’Achab, tout en rendant le titre divin sans paraphrase interprétative, en supprimant une intensification non exigée et en déplaçant l’ancre de la note sur le verbe concerné.
