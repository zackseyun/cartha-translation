review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle, y compris l’explicitation contextuelle légitime de « lui » par « Achab ». Toutefois, « le maître des armées » interprète et reformule le titre יהוה צבאות au lieu d’en préserver la désignation traditionnelle et plus large. L’adverbe « certainement » n’est pas requis par le texte hébreu : la force d’assurance est déjà portée par la formule de serment.'
  naturalness: La phrase est globalement naturelle, mais « lui devant qui je me tiens » est moins idiomatique que « devant qui je me tiens ». « Yahweh des armées » est un titre biblique français bien établi et reste compréhensible dans un registre moderne solennel.
  terminology: « Yahweh » rend correctement le tétragramme. « Yahweh des armées » rend צבאות sans ajouter l’idée spécifique de maîtrise ni restreindre indûment la portée des « armées »/« troupes ». La note doit être ancrée immédiatement après le verbe auquel elle se rapporte.
  issues:
  - severity: medium
    issue: Le titre « le maître des armées » est interprétatif.
    rationale: צבאות signifie littéralement « armées, troupes, forces organisées » dans le titre divin. « Maître » ajoute une reformulation conceptuelle absente du texte. « Yahweh des armées » conserve mieux le titre hébreu et son ampleur.
  - severity: low
    issue: « Certainement » ajoute une explicitation non nécessaire.
    rationale: Le כִּי introductif et la formule de serment donnent l’assurance de l’énoncé, mais ne demandent pas nécessairement un adverbe français distinct.
  - severity: low
    issue: L’ancre de note est placée après « Achab » plutôt qu’après le verbe expliqué.
    rationale: La variante signalée concerne אֵרָאֶה, rendu par « me présenterai » ; l’ancre doit suivre ce verbe pour une référence précise.
  revised_text: 'Élie dit : « Aussi vrai que Yahweh des armées est vivant, devant qui je me tiens, aujourd’hui je me présenterai[a] devant Achab. »'
  revised_footnotes:
  - marker: a
    text: Ou « j’apparaîtrai devant lui » ou « je me ferai voir de lui ». Le verbe hébreu peut signifier être vu, apparaître ou se présenter.
    reason: lexical_alternative
  revision_rationale: La révision maintient la formule solennelle du serment et l’explicitation contextuelle d’Achab, tout en rendant le titre divin sans paraphrase interprétative, en supprimant une intensification non exigée et en déplaçant l’ancre de la note sur le verbe concerné.
