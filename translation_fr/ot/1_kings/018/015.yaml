source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: fr
  text: 'Élie dit : « Aussi vrai que Yahweh des armées est vivant, devant qui je me tiens, aujourd’hui je me présenterai[a] devant Achab. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’apparaîtrai devant lui » ou « je me ferai voir de lui ». Le verbe hébreu peut signifier être vu, apparaître ou se présenter.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh […] est vivant
  rationale: Cette formulation française naturelle conserve la force solennelle de la formule hébraïque de serment.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé directement dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: le maître des armées
  rationale: Le français « maître des armées » exprime clairement l’autorité de Yahweh sur les armées sans employer l’archaïsme peu transparent « des armées » comme simple complément du nom.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: lui devant qui je me tiens
  rationale: Cette traduction préserve l’image hébraïque de la présence et du service devant un supérieur, sans la réduire au seul sens de « servir ».
- source_word: כִּי הַיּוֹם
  choice: aujourd’hui […] certainement
  rationale: כִּי introduit ici l’assurance garantie par le serment ; « certainement » en restitue la force dans un français naturel.
- source_word: אֵרָאֶה אֵלָיו
  choice: je me présenterai devant Achab
  rationale: Le niphal de ראה peut signifier être vu, apparaître ou se présenter. Le pronom est explicité par « Achab » pour éviter en français une référence momentanément ambiguë à Yahweh, mentionné juste avant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom propre ; « Yahweh » préserve cette fonction et évite de le remplacer par un titre.
- issue: Portée du titre צְבָאוֹת
  choice: le maître des armées
  alternative: des armées célestes
  rationale: Le choix conserve l’ampleur du titre et n’en limite pas explicitement la portée aux seules armées célestes.
translation_notes:
  register: Français international moderne, solennel mais accessible. La formule de serment garde sa dignité, tandis que « maître des armées » évite le tour traditionnel mais peu naturel « Yahweh des armées ». Le nom « Achab » explicite l’antécédent du pronom hébreu d’après le contexte immédiat.
