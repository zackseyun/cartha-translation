source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: fr
  text: 'Puis il dit : « Remplissez quatre cruches[a] d’eau et versez-la sur l’holocauste et sur le bois. » Puis il dit : « Faites-le une deuxième fois », et ils le firent une deuxième fois. Puis il dit : « Faites-le une troisième fois », et ils le firent une troisième fois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quatre jarres » ; le terme hébreu désigne un récipient servant à transporter des liquides.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis il dit
  rationale: Le waw consécutif fait progresser le récit. « Puis il dit » restitue naturellement cette succession en français moderne.
- source_word: מִלְאוּ
  choice: Remplissez
  rationale: Impératif masculin pluriel de מלא, qui ordonne aux destinataires de remplir les récipients.
- source_word: אַרְבָּעָה כַדִּים
  choice: quatre cruches
  rationale: כַּד désigne un récipient servant notamment à transporter des liquides. « Cruches » convient naturellement au contexte sans préciser indûment sa forme exacte.
- source_word: מַיִם
  choice: d’eau
  rationale: Le complément introduit par « de » après « remplissez » est la formulation idiomatique française du contenu.
- source_word: וְיִצְקוּ
  choice: et versez-la
  rationale: Le verbe poursuit l’ordre adressé au même groupe. Le pronom féminin singulier renvoie collectivement à « l’eau ».
- source_word: עַל הָעֹלָה
  choice: sur l’holocauste
  rationale: עֹלָה est le terme sacrificiel habituel pour une offrande entièrement consumée. « Holocauste » est son équivalent français biblique établi.
- source_word: וְעַל הָעֵצִים
  choice: et sur le bois
  rationale: עֵצִים désigne ici le bois disposé pour le sacrifice ; le singulier collectif « le bois » est naturel et précis en français.
- source_word: שְׁנוּ
  choice: Faites-le une deuxième fois
  rationale: L’impératif de שנה demande de répéter l’action. La formulation explicite le décompte qui structure le passage.
- source_word: וַיִּשְׁנוּ
  choice: et ils le firent une deuxième fois
  rationale: Cette proposition rapporte l’exécution de l’ordre et conserve le parallélisme avec celui-ci.
- source_word: שַׁלֵּשׁוּ
  choice: Faites-le une troisième fois
  rationale: Le piel impératif de שלשׁ signifie ici accomplir l’action pour la troisième fois, après sa première exécution et sa répétition.
- source_word: וַיְשַׁלֵּשׁוּ
  choice: et ils le firent une troisième fois
  rationale: La traduction rend l’accomplissement du troisième ordre tout en reproduisant la progression et le rythme de l’hébreu.
theological_decisions:
- issue: Traduction du terme sacrificiel עֹלָה
  choice: holocauste
  alternative: offrande entièrement brûlée
  rationale: Le terme désigne le sacrifice israélite intégralement consumé sur l’autel. « Holocauste » demeure l’équivalent français consacré et concis, sans ajouter une explication au corps du verset.
translation_notes:
  register: Français international moderne, fluide et digne. La répétition marquée de « une deuxième fois » et « une troisième fois » est conservée afin de reproduire la progression rhétorique de l’hébreu.
