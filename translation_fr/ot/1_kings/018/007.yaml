base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: fr
  text: 'Abdias était en chemin lorsque, voici qu’Élie vint à sa rencontre. Quand il le reconnut, il tomba face contre terre et dit : « Est-ce bien toi, mon seigneur Élie ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: quand
  rationale: Dans ce récit, la particule introduit l’apparition soudaine d’Élie. Une tournure temporelle naturelle en français en conserve l’effet narratif sans l’artificiel « voici ».
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: Rend le mouvement d’Élie vers Abdias et respecte la construction hébraïque.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: il tomba face contre terre
  rationale: Expression française claire et digne pour la posture de profond respect décrite littéralement comme tomber sur son visage.
- source_word: הַאַתָּה זֶה
  choice: Est-ce bien toi
  rationale: Restitue naturellement en français la question de reconnaissance insistante.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Conserve le titre respectueux adressé à Élie, sans le confondre avec le nom divin.
theological_decisions:
- issue: Nature de l’hommage d’Abdias envers Élie
  choice: Conserver la prosternation et le titre « mon seigneur » comme marques de profond respect
  alternative: Employer un vocabulaire suggérant explicitement l’adoration religieuse
  rationale: Le texte décrit le geste et l’adresse sans préciser qu’il s’agit d’un acte cultuel; la traduction ne doit pas trancher au-delà de la source.
translation_notes:
  register: Français international moderne, narratif et digne. « Abdias » et « Élie » suivent les formes françaises bibliques courantes. La surprise portée par וְהִנֵּה est intégrée à la progression de la phrase plutôt que rendue par « voici ».
