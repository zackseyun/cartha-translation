  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: fr
  text: Lorsque Jézabel exterminait les prophètes de Yahweh[a], Abdias prit cent prophètes et les cacha, cinquante par grotte[b], puis leur fournit du pain et de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « supprimait » ; plus littéralement, « retranchait » les prophètes de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « cinquante hommes dans la grotte ». L’hébreu signifie probablement qu’Abdias les cacha en groupes de cinquante, apparemment dans des grottes distinctes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: Lorsque … exterminait
  rationale: La construction avec וַיְהִי et l’infinitif construit introduit le cadre temporel. Le hiphil de כרת signifie littéralement « retrancher » ou « couper » et désigne ici l’élimination meurtrière des prophètes.
- source_word: אִיזֶבֶל
  choice: Jézabel
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: נְבִיאֵי יְהוָה
  choice: les prophètes de Yahweh
  rationale: Le rapport construit est rendu directement, et le nom divin est translittéré afin de représenter le tétragramme.
- source_word: וַיִּקַּח עֹבַדְיָהוּ מֵאָה נְבִאִים
  choice: Abdias prit cent prophètes
  rationale: Traduction directe de לקח et emploi de la forme française usuelle du nom עֹבַדְיָהוּ.
- source_word: וַיַּחְבִּיאֵם
  choice: les cacha
  rationale: Le hiphil de חבא signifie « cacher » ou « dissimuler ».
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: cinquante par grotte
  rationale: Cette formulation française naturelle exprime la répartition probable en deux groupes de cinquante, tout en signalant en note la formulation singulière et compacte de l’hébreu.
- source_word: וְכִלְכְּלָם לֶחֶם וָמָיִם
  choice: puis leur fournit du pain et de l’eau
  rationale: כלכל exprime ici le fait de pourvoir durablement aux besoins de quelqu’un; « fournir » convient aussi bien au pain qu’à l’eau. « Puis » marque naturellement la succession portée par le waw narratif.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le caractère de nom propre sans remplacer celui-ci par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple porte les actions successives du récit, tandis que l’imparfait présente l’action de Jézabel comme le cadre en cours. Les formulations trop archaïques comme « retrancher » sont réservées à la note.
