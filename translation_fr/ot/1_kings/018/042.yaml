base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: fr
  text: Achab monta pour manger et boire, et Élie monta au sommet du Carmel. Il se courba jusqu’à terre et mit son visage entre ses genoux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: monta
  rationale: Le verbe עלה exprime couramment un déplacement vers le haut. « Monta » est naturel et conserve cette orientation.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: pour manger et boire
  rationale: Les infinitifs indiquent ici le but. Cette formulation est idiomatique en français moderne.
- source_word: וְאֵלִיָּהוּ
  choice: tandis qu’Élie
  rationale: La conjonction hébraïque signifie littéralement « et », mais la construction oppose les actions d’Achab et d’Élie. « Tandis que » rend ce contraste sans lui donner une valeur adversative excessive.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: monta au sommet du Carmel
  rationale: רֹאשׁ, littéralement « tête », désigne idiomatiquement le sommet. « Carmel » conserve le nom propre sans ajouter « mont », absent de cette formulation hébraïque.
- source_word: וַיִּגְהַר אַרְצָה
  choice: Il se courba jusqu’à terre
  rationale: Le rare verbe גהר décrit une posture fortement courbée. « Jusqu’à terre » rend la direction exprimée par אַרְצָה sans interpréter le geste comme une prière explicite.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
  choice: mit son visage entre ses genoux
  rationale: Traduction concrète et directe de la posture décrite par l’hébreu.
theological_decisions:
- issue: Faut-il présenter explicitement la posture d’Élie comme une prière ?
  choice: Conserver uniquement la description physique.
  alternative: « Il se courba pour prier » ou « il pria, le visage entre les genoux ».
  rationale: Le contexte général suggère la prière, mais ce verset ne la nomme pas. La traduction préserve donc la description concrète sans résoudre cette implication.
translation_notes:
  register: Français international moderne, naturel et digne. « Achab » et « Élie » suivent les formes françaises usuelles des noms bibliques. La coordination est légèrement explicitée par « tandis que » afin de faire ressortir le contraste narratif.
