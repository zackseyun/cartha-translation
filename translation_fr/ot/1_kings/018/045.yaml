base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: fr
  text: En très peu de temps[a], le ciel s’assombrit, avec des nuages et du vent, et une forte pluie se mit à tomber[b]. Achab monta sur son char et partit pour Jizréel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque : « jusqu’ici et jusqu’ici » ; elle signifie « entre-temps » ou « en très peu de temps ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une grande pluie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: En très peu de temps
  rationale: L’expression idiomatique marque un bref intervalle. Cette formulation française est naturelle et conserve l’idée de rapidité sans reproduire littéralement l’hébreu « jusqu’ici et jusqu’ici ».
- source_word: הַשָּׁמַיִם
  choice: le ciel
  rationale: Dans ce contexte météorologique, « le ciel » est l’équivalent français naturel du pluriel hébreu désignant la voûte céleste visible.
- source_word: הִתְקַדְּרוּ
  choice: s’assombrit
  rationale: Le verbe exprime le fait de devenir sombre ou menaçant. « S’assombrit » convient au registre courant et digne du récit.
- source_word: עָבִים וְרוּחַ
  choice: sous l’effet des nuages et du vent
  rationale: Cette tournure rend les nuages et le vent comme les éléments accompagnant ou causant l’assombrissement, sans épaissir indûment le sens de עָבִים.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: une pluie torrentielle se mit à tomber
  rationale: Littéralement « il y eut une grande pluie ». En français météorologique, « pluie torrentielle » transmet naturellement l’intensité de גָּדוֹל, tandis que « se mit à tomber » rend l’événement narratif.
- source_word: וַיִּרְכַּב
  choice: monta sur son char
  rationale: Le verbe signifie monter ou chevaucher. Le char, implicite dans l’hébreu et fourni par le contexte narratif, est explicité pour une lecture française naturelle.
- source_word: יִזְרְעֶאלָה
  choice: pour Jizréel
  rationale: Le hé directionnel indique un mouvement vers Jizréel. « Partit pour » l’exprime idiomatiquement en français.
