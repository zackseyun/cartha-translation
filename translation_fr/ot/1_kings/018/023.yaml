base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: fr
  text: Qu’ils nous donnent deux taureaux. Qu’ils choisissent pour eux l’un des deux taureaux, le découpent en morceaux et le placent sur le bois, mais qu’ils n’y mettent pas de feu. Moi, je préparerai l’autre taureau, je le placerai sur le bois et je n’y mettrai pas de feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: Qu’on nous donne
  rationale: La forme verbale exprime ici une proposition ou une demande dans le cadre du défi. Cette tournure française est directe et naturelle.
- source_word: שְׁנַיִם פָּרִים
  choice: deux taureaux
  rationale: פַּר désigne un bovin mâle, notamment dans un contexte sacrificiel. « Taureaux » reste précis sans ajouter l’idée de jeunesse.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: Qu’ils choisissent pour eux l’un des deux
  rationale: בחר signifie « choisir » et לָהֶם marque l’attribution à leur propre camp. « L’un des deux » rend naturellement la référence à un des deux taureaux déjà mentionnés.
- source_word: וִינַתְּחֻהוּ
  choice: le découpent en morceaux
  rationale: Dans la préparation sacrificielle, נתּח désigne le fait de diviser l’animal en morceaux, sans préciser un nombre particulier de quartiers.
- source_word: וְיָשִׂימוּ עַל הָעֵצִים
  choice: le placent sur le bois
  rationale: שׂים signifie « mettre, placer »; הָעֵצִים désigne collectivement le bois disposé pour le sacrifice.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: mais sans y mettre le feu
  rationale: L’hébreu dit littéralement qu’ils ne doivent pas y mettre de feu. La tournure française exprime clairement l’interdiction sans ajouter une indication spatiale absente du texte.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: Moi, je préparerai l’autre taureau
  rationale: עשה appliqué ici à l’animal renvoie à sa préparation. Puisqu’un taureau a été attribué à l’autre camp, הַפָּר הָאֶחָד désigne naturellement celui qui reste, « l’autre taureau ».
- source_word: וְנָתַתִּי עַל הָעֵצִים
  choice: je le placerai sur le bois
  rationale: נתן a ici le sens concret de « mettre, placer ». La répétition française conserve le parallélisme des deux préparations.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: je n’y mettrai pas le feu
  rationale: Cette traduction suit la formulation hébraïque et maintient le parallèle exact avec la consigne donnée à l’autre camp.
theological_decisions:
- issue: Description de la préparation sacrificielle sans surinterprétation cultuelle
  choice: 'Employer des termes concrets : « découper en morceaux », « placer sur le bois », « mettre le feu »'
  alternative: Employer systématiquement des termes techniques comme « offrir », « disposer » ou « immoler »
  rationale: Le verset expose les gestes pratiques du défi du Carmel plutôt qu’une doctrine du sacrifice. Une formulation concrète évite d’introduire des catégories théologiques que le texte ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. Le détachement « Moi » rend le contraste explicite de וַאֲנִי. Les impératifs indirects sont formulés avec « Qu’on » et « Qu’ils », tandis que « sans y mettre le feu » évite la lourdeur d’une coordination répétée et ne rajoute pas « dessous », absent de l’hébreu.
