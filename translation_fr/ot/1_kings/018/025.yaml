  text: וַ/יֹּ֨אמֶר אֵלִיָּ֜הוּ לִ/נְבִיאֵ֣י הַ/בַּ֗עַל בַּחֲר֨וּ לָ/כֶ֜ם הַ/פָּ֤ר הָֽ/אֶחָד֙ וַ/עֲשׂ֣וּ רִאשֹׁנָ֔ה כִּ֥י אַתֶּ֖ם הָ/רַבִּ֑ים וְ/קִרְאוּ֙ בְּ/שֵׁ֣ם אֱלֹהֵי/כֶ֔ם וְ/אֵ֖שׁ לֹ֥א תָשִֽׂימוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: fr
  text: 'Alors Élie dit aux prophètes de Baal : « Choisissez pour vous l’un des taureaux et préparez-le en premier, puisque vous êtes nombreux. Puis invoquez le nom de votre dieu[a], mais ne mettez pas de feu dessous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie invoquer la divinité ou faire appel à elle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne mettez pas de feu ». Le mot « dessous » est sous-entendu par le contexte du sacrifice.'
    reason: implicit_context
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: aux prophètes de Baal
  rationale: La chaîne construite indique directement leur appartenance cultuelle à Baal.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: Choisissez pour vous l’un des taureaux
  rationale: Dans le contexte, il s’agit de choisir l’un des deux taureaux déjà mentionnés. « Pour vous » conserve la valeur de לָכֶם sans alourdir la phrase.
- source_word: וַעֲשׂוּ רִאשֹׁנָה
  choice: et préparez-le en premier
  rationale: Dans ce contexte sacrificiel, עשה désigne la préparation de l’animal. רִאשֹׁנָה marque l’ordre dans lequel les deux groupes doivent agir.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: puisque vous êtes nombreux
  rationale: La proposition donne la raison pour laquelle les prophètes de Baal doivent commencer. Cette formulation restitue directement leur supériorité numérique.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: Puis invoquez le nom de votre dieu
  rationale: קרא בשם est une expression signifiant invoquer une divinité ou faire appel à elle. « Invoquez le nom » en conserve l’image hébraïque dans un français clair.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: mais ne mettez pas de feu dessous
  rationale: Le texte interdit de placer le feu destiné à embraser le sacrifice. « Dessous » est implicite dans la scène sacrificielle, mais non exprimé dans l’hébreu; une note le signale.
theological_decisions:
- issue: אֱלֹהֵיכֶם à propos de Baal
  choice: votre dieu
  alternative: vos dieux
  rationale: Bien que אֱלֹהִים puisse avoir une forme plurielle, le référent immédiat est Baal, une divinité singulière. Le singulier évite d’introduire ici une pluralité que le contexte ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs pluriels correspondent au groupe des prophètes; la formulation conserve l’expression « le nom de votre dieu » tout en explicitant discrètement, par une note, l’élément spatial implicite dans la dernière proposition.
