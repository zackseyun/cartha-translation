source:
  edition: WLC
  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: fr
  text: 'Bien des jours plus tard, au cours de la troisième année, la parole de Yahweh fut adressée à Élie : « Va, présente-toi à Achab, et je donnerai de la pluie au pays[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je donnerai de la pluie sur la face du sol »; on peut aussi traduire : « je ferai tomber la pluie sur le pays ».'
    reason: Conserver l’image hébraïque littérale tout en signalant une formulation française idiomatique possible.
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: Bien des jours plus tard
  rationale: Cette formulation rend naturellement la transition narrative et l’idée d’un long intervalle, sans reprendre servilement l’idiome hébreu.
- source_word: וּדְבַר יְהוָה הָיָה אֶל אֵלִיָּהוּ
  choice: la parole de Yahweh fut adressée à Élie
  rationale: Rend la formule prophétique comme une communication divine destinée au prophète, dans un français courant et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: au cours de la troisième année
  rationale: Conserve la référence temporelle telle qu’elle est donnée, sans préciser explicitement le point de départ que le verset laisse implicite.
- source_word: לֵךְ הֵרָאֵה אֶל אַחְאָב
  choice: Va, présente-toi à Achab
  rationale: Le niphal impératif de ראה signifie ici se rendre visible; « présente-toi » exprime naturellement l’ordre donné à Élie.
- source_word: וְאֶתְּנָה מָטָר
  choice: et je donnerai de la pluie
  rationale: Conserve le verbe נתן, « donner », et présente ainsi la pluie comme un don de Yahweh.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: au pays
  rationale: Dans le contexte de la sécheresse en Israël, « au pays » rend naturellement la portée locale de אֲדָמָה; la note conserve l’image hébraïque littérale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction sans le remplacer par un titre.
- issue: Point de départ de « la troisième année »
  choice: Ne pas l’expliciter
  alternative: la troisième année de la sécheresse
  rationale: Le contexte permet de rapporter l’expression à la période de sécheresse, mais le verset ne nomme pas explicitement ce point de départ; la traduction conserve donc cette légère indétermination.
- issue: Dieu « donne » la pluie
  choice: je donnerai de la pluie
  alternative: je ferai tomber la pluie
  rationale: Le choix garde l’image de la pluie comme don divin, sans développer davantage la causalité exprimée par le texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide; les formulations archaïques telles que « il advint » sont évitées. Le marqueur de note est placé après l’expression qu’il explique.
