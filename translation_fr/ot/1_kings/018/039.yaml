  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: fr
  text: 'Quand tout le peuple vit cela, il tomba face contre terre et dit : « Yahweh, lui, est Dieu[a] ! Yahweh, lui, est Dieu ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Yahweh, lui, est le Dieu ! » L’article hébreu présente Yahweh comme le vrai Dieu, par opposition à Baal.'
    reason: La note conserve la forme plus littérale et explique la valeur contrastive de l’article hébreu.
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit cela
  rationale: Le verbe signifie « voir ». « Cela » explicite sobrement l’objet sous-entendu, à savoir le feu et l’événement qui viennent d’être racontés.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Cette expression rend naturellement le collectif hébreu tout en conservant son caractère inclusif.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: tous tombèrent face contre terre
  rationale: La formulation conserve l’image concrète de la prosternation. « Tous » reprend les verbes hébreux au pluriel après le collectif « tout le peuple ».
- source_word: וַיֹּאמְרוּ
  choice: dirent
  rationale: Le verbe hébreu courant désigne simplement l’action de parler, sans préciser à lui seul le volume ou l’intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הוּא
  choice: lui
  rationale: Le pronom explicite est maintenu sous une forme française naturelle afin de préserver l’insistance de la confession.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans cette proposition attributive, le français exprime naturellement l’identification par « Dieu » ; l’article hébreu marque ici Yahweh comme le vrai Dieu par opposition à Baal.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le caractère de nom propre sans remplacer celui-ci par un titre.
- issue: Portée de הָאֱלֹהִים avec l’article
  choice: Dieu
  alternative: le vrai Dieu
  rationale: Le contexte oppose clairement Yahweh à Baal, mais ajouter « vrai » dans le corps du texte expliciterait davantage que l’hébreu. La note signale la valeur contrastive de l’article sans résoudre excessivement la formulation.
translation_notes:
  register: Français moderne, digne et oralement fluide. La répétition intégrale est conservée pour rendre la force solennelle de l’acclamation collective ; « lui » maintient l’emphase du pronom hébreu sans alourdir la phrase.
