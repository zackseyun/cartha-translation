  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: fr
  text: 'La septième fois, il dit : « Regarde ! Un petit nuage, grand comme la paume d’un homme[a], monte de la mer. » Alors Élie dit : « Monte dire à Achab : “Attelle ton char[b] et descends, avant que la pluie ne te retienne[c].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme la paume d’un homme ».'
    reason: La formulation principale explicite que la comparaison porte sur la taille apparente du nuage, tandis que la note conserve la forme concise de l’hébreu.
  - marker: b
    text: Il s’agit d’attacher les chevaux ou l’équipe de trait au char afin de le préparer au départ.
    reason: Cette note éclaire l’action concrète exprimée par le verbe hébreu dans son contexte ancien.
  - marker: c
    text: 'Ou : « de peur que la pluie ne t’arrête » ou « ne te bloque ».'
    reason: Le verbe hébreu peut exprimer l’idée de retenir, d’arrêter ou d’empêcher d’avancer.
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: La septième fois
  rationale: Dans le contexte des allers-retours répétés du serviteur, l’expression désigne la septième occurrence. Cette formulation française naturelle conserve la progression narrative sans reproduire lourdement l’idiome hébreu.
- source_word: הִנֵּה
  choice: Regarde !
  rationale: La particule attire immédiatement l’attention sur ce qui vient d’apparaître. L’impératif est courant et vivant en français moderne.
- source_word: עָב קְטַנָּה
  choice: un petit nuage
  rationale: Rendu direct du groupe nominal, naturel en français.
- source_word: כְּכַף אִישׁ
  choice: grand comme la paume d’un homme
  rationale: Le כ comparatif et כַּף, « paume », décrivent vraisemblablement la taille apparente du nuage. L’ajout de « grand » explicite naturellement en français le rapport de comparaison sans changer l’image.
- source_word: עֹלָה מִיָּם
  choice: monte de la mer
  rationale: Le participe féminin décrit une action en cours. « Monte de la mer » conserve le mouvement visible et la provenance.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif garde la nuance directionnelle du texte, probablement depuis le poste d’observation vers Élie ou le lieu où le message doit être transmis.
- source_word: אֱמֹר אֶל אַחְאָב
  choice: dire à Achab
  rationale: Formulation transparente et idiomatique pour introduire le message adressé à Achab.
- source_word: אֱסֹר
  choice: Attelle ton char
  rationale: Le verbe signifie littéralement lier ou attacher et, dans ce contexte, préparer l’attelage pour le départ. L’objet implicite est explicité pour que l’ordre soit immédiatement compréhensible.
- source_word: וָרֵד
  choice: et descends
  rationale: Conserve la direction topographique de l’impératif, depuis le Carmel vers un lieu plus bas.
- source_word: וְלֹא יַעֲצָרְכָה הַגָּשֶׁם
  choice: avant que la pluie ne te retienne
  rationale: 'Cette formulation rend la valeur préventive de la coordination négative : Achab doit partir avant que la pluie n’entrave son déplacement. « Retienne » préserve l’idée d’empêcher ou de retarder.'
