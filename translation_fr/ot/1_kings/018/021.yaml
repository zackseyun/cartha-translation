  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: fr
  text: 'Élie s’approcha de tout le peuple et dit : « Jusqu’à quand continuerez-vous à boiter entre deux branches[a] ? Si Yahweh est Dieu, suivez-le ; si c’est Baal, suivez-le. » Mais le peuple ne lui répondit pas un mot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jusqu’à quand hésiterez-vous entre deux partis ? » L’hébreu évoque plus littéralement le fait de boiter ou de sautiller sur deux branches ou embranchements, image d’une loyauté partagée.'
    reason: La tournure hébraïque est métaphorique et son image exacte est discutée ; la note donne le sens contextuel sans effacer l’expression concrète du texte.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Le verbe נגשׁ exprime le fait de s’approcher. « S’approcha » est naturel en français et conserve le mouvement d’Élie vers le peuple.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Cette formulation rend directement l’expression collective hébraïque et souligne que l’appel s’adresse à l’ensemble du peuple réuni.
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Équivalent français naturel de la formule interrogative temporelle hébraïque, avec sa force de reproche.
- source_word: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: continuerez-vous à boiter entre deux branches
  rationale: « Boiter » conserve l’image concrète de פסח, tandis que « branches » rend le sens premier probable de סְעִפִּים. « Continuer » exprime naturellement en français la valeur durative du participe après « jusqu’à quand ». La note signale le sens métaphorique de loyauté partagée sans le substituer au texte.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: Si Yahweh est Dieu
  rationale: La construction prédicative est rendue directement, et le nom divin יהוה est translittéré « Yahweh » afin de préserver le nom propre présent dans le texte hébreu.
- source_word: לְכוּ אַחֲרָיו
  choice: suivez-le
  rationale: L’expression « aller après » désigne ici l’adhésion et la fidélité ; « suivez-le » en est l’équivalent français clair et idiomatique.
- source_word: וְאִם הַבַּעַל
  choice: si c’est Baal
  rationale: Le texte hébreu laisse sous-entendre « qui est Dieu ». Le français « si c’est Baal » conserve cette ellipse de façon naturelle. L’article hébreu n’est pas reproduit, Baal fonctionnant ici comme un nom propre en français.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: Mais le peuple ne lui répondit pas un mot
  rationale: Cette formulation garde l’insistance de l’hébreu sur le silence total. « Mais » explicite la valeur adversative du וְ dans le contexte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie explicitement le Tétragramme. « Yahweh » préserve ici le nom propre et distingue nettement Yahweh de Baal dans l’alternative posée par Élie.
- issue: Métaphore de פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: conserver l’image de boiter entre deux branches
  alternative: hésiter entre deux opinions / être partagé entre deux partis
  rationale: Le sens contextuel est celui d’une loyauté divisée, mais la formulation hébraïque reste imagée et comporte une certaine ambiguïté lexicale. Le texte principal conserve donc cette tension, tandis que la note en éclaire la portée.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste direct et vigoureux. « Boiter entre deux branches » est volontairement imagé plutôt qu’entièrement idiomatisé ; la note garantit l’intelligibilité tout en préservant la texture et l’ambiguïté de l’hébreu.
