base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: fr
  text: Réponds-moi, Yahvé, réponds-moi, afin que ce peuple sache que c’est toi, Yahvé, qui es Dieu[a], et que c’est toi qui as fait revenir leur cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui es le Dieu ».'
    reason: L’article de הָאֱלֹהִים peut être rendu explicitement, bien que « être le Dieu » soit moins naturel sans complément en français.
  - marker: b
    text: 'Littéralement : « leur cœur ». En hébreu, le singulier « cœur » désigne collectivement le peuple tout entier.'
    reason: La note signale le nom singulier avec suffixe pluriel dans le texte hébreu.
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Réponds-moi
  rationale: Dans cette prière, le verbe demande une réponse divine manifestée par une action. La répétition est conservée pour garder l’insistance d’Élie.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française traditionnelle et largement reconnue du nom divin transcrit le tétragramme comme un nom propre plutôt que de le remplacer par un titre.
- source_word: וְיֵדְעוּ
  choice: afin que … sache
  rationale: L’imparfait précédé de la conjonction exprime ici le but ou le résultat recherché par la prière. Le singulier « sache » s’accorde avec le collectif « ce peuple ».
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Cette formulation conserve le nom collectif singulier de l’hébreu et reste naturelle en français.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: que c’est toi, Yahvé, qui es Dieu
  rationale: La tournure emphatique française rend la mise en relief du pronom אַתָּה et identifie Yahvé comme Dieu face à Baal, sans rendre artificiellement l’article hébreu.
- source_word: הֲסִבֹּתָ
  choice: as fait revenir
  rationale: Cette forme causative accomplie attribue clairement à Dieu l’action de produire le retour, tout en évitant une expression spatiale maladroite en français.
- source_word: אֶת לִבָּם
  choice: son cœur
  rationale: Le suffixe pluriel renvoie aux membres du peuple, tandis que « cœur » reste singulier en hébreu. En français, « son cœur » rattache naturellement ce cœur collectif à « ce peuple ».
- source_word: אֲחֹרַנִּית
  choice: revenir
  rationale: L’adverbe indique un mouvement de retour. Intégré au verbe « faire revenir », il conserve cette idée sans préciser explicitement une destination absente du texte hébreu.
theological_decisions:
- issue: L’action divine dans le retour du peuple
  choice: que c’est toi qui as fait revenir son cœur
  alternative: que c’est toi qui ramènes son cœur
  rationale: Le parfait hébreu est rendu comme une action accomplie et sa forme causative est maintenue. La traduction affirme ainsi l’action de Dieu sans l’atténuer ni l’inscrire dans un système doctrinal plus large.
- issue: Identification de Yahvé comme Dieu
  choice: c’est toi, Yahvé, qui es Dieu
  alternative: c’est toi, Yahvé, qui es le Dieu
  rationale: En contexte, l’article hébreu peut présenter Dieu comme le vrai Dieu face à Baal. La formulation sans article est plus naturelle en français et conserve pleinement cette affirmation; l’autre possibilité est signalée en note.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition oratoire est conservée. « C’est toi … qui » maintient l’emphase hébraïque, et « as fait revenir » préserve à la fois l’aspect accompli et la causalité divine sans ajouter explicitement « vers toi », destination suggérée par le contexte mais non exprimée dans le texte.
