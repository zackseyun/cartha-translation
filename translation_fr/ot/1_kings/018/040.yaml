source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ לָ/הֶ֜ם תִּפְשׂ֣וּ אֶת נְבִיאֵ֣י הַ/בַּ֗עַל אִ֛ישׁ אַל יִמָּלֵ֥ט מֵ/הֶ֖ם וַֽ/יִּתְפְּשׂ֑וּ/ם וַ/יּוֹרִדֵ֤/ם אֵלִיָּ֨הוּ֙ אֶל נַ֣חַל קִישׁ֔וֹן וַ/יִּשְׁחָטֵ֖/ם שָֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: fr
  text: 'Élie leur dit alors : « Saisissez les prophètes de Baal ! Que pas un seul[a] d’entre eux ne s’échappe ! » Ils les saisirent, puis Élie les fit descendre au torrent du Qishôn[b] et les égorgea là.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’un homme ne s’échappe pas d’entre eux » ; l’expression signifie qu’aucun d’eux ne doit s’échapper.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu naḥal peut désigner un torrent, le lit d’un cours d’eau ou un ravin.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ
  choice: Saisissez
  rationale: L’impératif pluriel de תפשׂ appelle une arrestation énergique ; « saisissez » est direct et conserve la force du verbe.
- source_word: נְבִיאֵי הַבַּעַל
  choice: les prophètes de Baal
  rationale: Rend directement la chaîne construite hébraïque et identifie le groupe sans paraphrase.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: Que pas un seul d’entre eux ne s’échappe
  rationale: 'Formulation française naturelle qui conserve la valeur distributive de אִישׁ : aucun individu du groupe ne doit s’échapper.'
- source_word: וַיִּתְפְּשׂוּם
  choice: Ils les saisirent
  rationale: La répétition de « saisir » maintient le lien lexical avec l’ordre donné.
- source_word: וַיּוֹרִדֵם
  choice: les fit descendre
  rationale: Le factitif français rend précisément le hiphil de ירד sans préciser indûment comment ils furent conduits.
- source_word: נַחַל קִישׁוֹן
  choice: au torrent du Qishôn
  rationale: נַחַל peut désigner un torrent, son lit ou une vallée fluviale ; « torrent » est naturel en français et convient au relief évoqué, tandis que « Qishôn » translittère le nom propre.
- source_word: וַיִּשְׁחָטֵם
  choice: les égorgea
  rationale: שׁחט désigne typiquement l’abattage par égorgement. « Égorgea » conserve ici la précision et la violence crue du verbe, contrairement au plus général « tua ».
- source_word: שָׁם
  choice: là
  rationale: Équivalent locatif simple et direct.
theological_decisions:
- issue: Présentation de la mise à mort violente des prophètes de Baal
  choice: Rapporter directement qu’Élie « les égorgea », sans atténuation ni commentaire moral ajouté.
  alternative: Employer « les exécuta » ou « les mit à mort », ou ajouter explicitement une autorisation divine.
  rationale: Le texte hébreu attribue directement l’action à Élie et emploie le verbe concret שׁחט. La traduction doit préserver cette dureté sans introduire dans le verset une justification théologique qu’il n’énonce pas.
translation_notes:
  register: Français international moderne, narratif et digne. Les impératifs sont vifs, la syntaxe reste accessible, et la violence du récit n’est ni amplifiée ni atténuée.
