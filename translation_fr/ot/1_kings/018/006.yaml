  text: וַֽ/יְחַלְּק֥וּ לָ/הֶ֛ם אֶת הָ/אָ֖רֶץ לַֽ/עֲבָר בָּ֑/הּ אַחְאָ֞ב הָלַ֨ךְ בְּ/דֶ֤רֶךְ אֶחָד֙ לְ/בַדּ֔/וֹ וְ/עֹֽבַדְיָ֛הוּ הָלַ֥ךְ בְּ/דֶרֶךְ אֶחָ֖ד לְ/בַדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: fr
  text: 'Ils se partagèrent donc le pays à parcourir : Achab partit seul dans une direction[a], et Abdias partit seul dans une autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète littéralement la même expression pour les deux hommes : « Achab partit seul dans une direction, et Abdias partit seul dans une direction. » Ici, « une autre » rend explicite en français le contraste entre leurs itinéraires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: ils se partagèrent
  rationale: Le piel de חלק exprime ici un partage actif, et לָהֶם indique que les deux hommes répartissent entre eux la zone à parcourir. « Se partagèrent » rend naturellement cette réciprocité en français.
- source_word: אֶת הָאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire qu’ils doivent explorer. « Le pays » est naturel et évite le sens global que pourrait suggérer « la terre ».
- source_word: לַעֲבָר בָּהּ
  choice: à parcourir
  rationale: L’infinitif de עבר avec בָּהּ indique le déplacement à travers le territoire. « À parcourir » exprime idiomatiquement en français la finalité du partage sans préciser davantage le mode de déplacement.
- source_word: הָלַךְ
  choice: partit
  rationale: Dans ce récit de séparation et d’itinéraires, « partit » rend naturellement le mouvement de chacun sans laisser entendre qu’ils se déplaçaient nécessairement à pied.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: dans une direction
  rationale: דֶּרֶךְ peut désigner un chemin, un itinéraire ou une direction. Ici, « dans une direction » convient au partage du territoire et n’impose pas l’existence d’une route précise.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: « Seul » rend directement et dignement l’idée que chacun suivit séparément son propre itinéraire.
- source_word: אַחְאָב / עֹבַדְיָהוּ
  choice: Achab / Abdias
  rationale: Ces formes françaises traditionnelles et largement reconnues permettent une lecture naturelle en français moderne.
- source_word: בְּדֶרֶךְ אֶחָד (seconde occurrence)
  choice: dans une autre
  rationale: L’hébreu répète littéralement « dans une direction », mais le parallélisme distributif implique deux itinéraires distincts. « Une autre » explicite en français naturel le contraste contextuel, avec une note signalant la répétition hébraïque.
