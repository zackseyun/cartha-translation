  text: וַ/יִּקְרָ֣א אַחְאָ֔ב אֶל עֹבַדְיָ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/עֹבַדְיָ֗הוּ הָיָ֥ה יָרֵ֛א אֶת יְהוָ֖ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: fr
  text: Achab appela Abdias[a], qui était responsable de la maison royale. Or Abdias craignait profondément Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui était chargé du palais ». L’hébreu dit littéralement : « qui était préposé à la maison », expression désignant un haut responsable de la maison royale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אַחְאָב אֶל עֹבַדְיָהוּ
  choice: Achab appela Abdias
  rationale: קרא + אֶל indique ici qu’Achab fait appeler Abdias. « Appela » reste naturel en français sans renforcer le verbe jusqu’à « convoqua ».
- source_word: עֹבַדְיָהוּ
  choice: Abdias
  rationale: Forme française biblique traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: qui était responsable de la maison royale
  rationale: L’expression désigne un haut fonctionnaire préposé à la maison ou à l’administration du roi. « Maison royale » conserve la portée institutionnelle de בַּיִת sans la réduire au seul bâtiment du palais.
- source_word: וְעֹבַדְיָהוּ
  choice: Or Abdias
  rationale: Le waw introduit ici une information d’arrière-plan sur Abdias ; « Or » rend naturellement cette fonction discursive.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: craignait Yahweh
  rationale: La tournure exprime une disposition caractéristique. « Craignait » préserve la force religieuse de ירא, qui comprend respect et révérence sans éliminer la notion de crainte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: מְאֹד
  choice: profondément
  rationale: L’adverbe intensifie la crainte révérencielle d’Abdias. « Profondément » est naturel en français moderne et évite le tour peu idiomatique « craignait beaucoup ».
theological_decisions:
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Sens religieux de יָרֵא
  choice: craignait
  alternative: révérait
  rationale: « Craignait » maintient la tension du terme hébreu, qui désigne ici une crainte respectueuse et fidèle ; « révérait » n’en exprimerait que l’aspect positif.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure narrative et l’information d’arrière-plan tout en explicitant sobrement la fonction administrative d’Abdias.
