  text: וַ/יִּשְׁלַ֥ח אַחְאָ֖ב בְּ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקְבֹּ֥ץ אֶת הַ/נְּבִיאִ֖ים אֶל הַ֥ר הַ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/020.yaml
  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: fr
  text: Achab envoya un message à tous les fils d’Israël et rassembla les prophètes au mont Carmel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à tous les Israélites ». L’hébreu dit littéralement « à tous les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya des messagers
  rationale: Le verbe signifie littéralement « envoya ». Comme le complément désigne les destinataires, le français demande généralement de préciser ce qui a été envoyé; « des messagers » exprime naturellement l’action sans aller jusqu’à l’idée plus interprétative de « convoquer ».
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: à tous les fils d’Israël
  rationale: Après שׁלח, בְּ peut introduire les destinataires. La formulation conserve l’expression familiale masculine littérale בְּנֵי יִשְׂרָאֵל, tandis que « à tous les Israélites » est signalé comme équivalent naturel en note.
- source_word: וַיִּקְבֹּץ
  choice: rassembla
  rationale: קבץ signifie couramment « rassembler » ou « réunir »; « rassembla » convient directement à l’action exercée sur les prophètes.
- source_word: הַנְּבִיאִים
  choice: les prophètes
  rationale: נְבִיאִים est le terme hébreu ordinaire pour les prophètes; le contexte détermine quels prophètes sont visés sans qu’il soit nécessaire de le préciser dans la traduction.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: au mont Carmel
  rationale: La tournure française conventionnelle et exacte pour הַר suivi de ce nom géographique est « le mont Carmel »; avec le mouvement vers le lieu, אֶל est rendu par « au ».
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. « Envoya des messagers » évite le tour peu naturel « envoya à » tout en restant proche du sens contextuel; la structure narrative brève de l’hébreu est conservée.
