source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: fr
  text: 'Aussi vrai que Yahweh, ton Dieu, est vivant, il n’y a ni nation ni royaume où mon seigneur n’ait envoyé pour te chercher. Quand on disait : « Il n’est pas ici », il faisait prêter serment au royaume et à la nation qu’ils ne pouvaient pas te trouver.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Aussi vrai que Yahweh, ton Dieu, est vivant
  rationale: Rend la formule hébraïque de serment de façon naturelle et solennelle en français, tout en conservant l’invocation de la vie de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: il n’y a pas une nation ni un royaume où… n’ait
  rationale: Dans cette formule de serment, אִם a une force emphatique et nie qu’un pays ait échappé aux recherches, plutôt que d’exprimer une condition réelle.
- source_word: שָׁלַח אֲדֹנִי שָׁם לְבַקֶּשְׁךָ
  choice: mon seigneur n’ait envoyé des gens à ta recherche
  rationale: « Mon seigneur » désigne respectueusement Achab. L’ajout explicatif « des gens » est naturellement impliqué par « envoyer » et évite en français de laisser le verbe sans complément compréhensible.
- source_word: וְאָמְרוּ אָיִן
  choice: 'Quand on disait : « Il n’est pas ici »'
  rationale: Le pronom indéfini restitue la réponse des autorités ou habitants sans préciser un sujet absent de l’hébreu; « il » désigne clairement Élie dans le contexte.
- source_word: וְהִשְׁבִּיעַ
  choice: il faisait jurer
  rationale: Le hiphil de שבע exprime le fait d’imposer un serment; l’imparfait français convient à l’action répétée décrite.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: qu’on ne t’avait pas trouvé
  rationale: Après le verbe de serment, כִּי en introduit le contenu. Le plus-que-parfait présente le résultat de la recherche antérieure sans transformer explicitement l’énoncé en incapacité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom personnel est conservé sous sa forme translittérée, sans le remplacer par un titre.
- issue: Force de אִם dans la formule de serment
  choice: 'affirmation emphatique négative : « il n’y a pas… »'
  alternative: 'condition littérale : « s’il existe… »'
  rationale: La construction de serment est elliptique en hébreu; son sens contextuel affirme avec force l’étendue universelle des recherches d’Achab.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit le discours direct adressé à Élie. La syntaxe garde la solennité du serment tout en évitant un calque obscur de l’hébreu.
