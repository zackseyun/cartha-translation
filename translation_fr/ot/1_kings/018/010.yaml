  - severity: low
    issue: Ajout de « des gens »
    rationale: Le verbe hébreu « envoyer » n’a pas d’objet exprimé. Le français peut le conserver sans ajouter des envoyés explicitement.
  - severity: low
    issue: Formulation négative peu naturelle
    rationale: « Il n’y a ni nation ni royaume » est la formulation française usuelle de cette négation coordonnée.
