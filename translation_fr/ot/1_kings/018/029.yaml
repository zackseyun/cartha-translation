base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: fr
  text: Quand midi fut passé, ils continuèrent à prophétiser[a] jusqu’à ce que soit offerte l’offrande de céréales[b]. Mais aucune voix ne se fit entendre, personne ne répondit et personne ne fut attentif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils se livrèrent à des manifestations extatiques ». L’hébreu emploie le verbe habituel pour « prophétiser », mais il décrit ici le comportement extatique des prophètes de Baal.'
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi désigner le moment de l’offrande régulière du soir.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כַּעֲבֹר הַצָּהֳרַיִם
  choice: Quand midi fut passé
  rationale: La tournure temporelle fait avancer le récit. Cette formulation naturelle en français rend le passage au-delà de midi sans conserver inutilement une formule narrative lourde comme « il arriva que ».
- source_word: וַיִּתְנַבְּאוּ
  choice: ils continuèrent à prophétiser
  rationale: Le hitpael de נבא est le verbe ordinaire de la prophétie, employé ici pour le comportement extatique des prophètes de Baal. « Continuèrent » exprime la durée suggérée par le contexte, tandis qu’une note conserve le sens contextuel plus interprétatif.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: jusqu’à ce que soit offerte l’offrande de céréales
  rationale: La formulation rend l’action d’offrir la מִנְחָה sans ajouter « du soir », absent de l’expression hébraïque. La répétition française de « offerte / offrande » reste claire et précise.
- source_word: וְאֵין קוֹל
  choice: aucune voix ne se fit entendre
  rationale: קוֹל peut désigner une voix ou un son. Dans l’attente d’une réponse divine, « voix » convient, et « ne se fit entendre » donne une formulation idiomatique.
- source_word: וְאֵין עֹנֶה
  choice: personne ne répondit
  rationale: Le participe עֹנֶה indique l’absence de tout répondant. Le passé simple s’intègre naturellement au récit français.
- source_word: וְאֵין קָשֶׁב
  choice: personne ne leur prêta attention
  rationale: קָשֶׁב exprime l’attention ou l’écoute. Cette formulation explicite naturellement en français qu’aucun être ne prêtait attention à leurs appels.
theological_decisions:
- issue: Caractérisation de l’activité extatique des prophètes de Baal
  choice: ils continuèrent à prophétiser
  alternative: ils entrèrent en transe / ils délirèrent
  rationale: Le texte hébreu emploie le verbe habituel pour prophétiser. Le conserver dans le texte principal respecte le choix lexical et l’ironie du récit sans imposer une appréciation théologique; la note signale la nuance extatique possible.
- issue: Identification temporelle de la מִנְחָה
  choice: l’offrande de céréales
  alternative: le moment de l’offrande régulière du soir
  rationale: מִנְחָה désigne couramment une offrande de céréales, mais cette expression peut aussi servir de repère pour l’heure de l’offrande régulière, souvent associée au soir. Le texte principal ne précise donc pas « du soir », tandis que la note conserve cette lecture.
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve la progression ternaire de l’hébreu — aucune voix, aucune réponse, aucune attention — sous une forme idiomatique, et les deux notes sont placées immédiatement après les expressions qu’elles expliquent.
