base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: fr
  text: 'À midi, Élie se moqua d’eux et dit : « Criez à haute voix, puisqu’il est un dieu ! Il est peut-être plongé dans ses pensées, ou bien il s’est retiré[a], ou encore il est en voyage. Peut-être qu’il dort et qu’il se réveillera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « il est allé faire ses besoins ». L’expression hébraïque est probablement euphémistique.'
    reason: Alternative lexicale pour une expression hébraïque rare et vraisemblablement euphémistique.
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: À midi
  rationale: Le tour narratif וַיְהִי introduit ici la circonstance temporelle; en français moderne, « À midi » suffit naturellement sans calquer une formule narrative lourde.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: se moqua d’eux
  rationale: Le verbe exprime une raillerie méprisante; cette formulation française est claire, naturelle et conserve la force du propos.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: Criez plus fort
  rationale: Dans le contexte de leurs appels déjà répétés, le comparatif idiomatique restitue naturellement l’ordre ironique d’élever fortement la voix.
- source_word: כִּי אֱלֹהִים הוּא
  choice: puisqu’il est un dieu
  rationale: Élie parle ironiquement de Baal. L’indéfini évite toute identification avec le Dieu d’Israël et « puisqu’ » rend ici la justification sarcastique.
- source_word: כִּי שִׂיחַ
  choice: Il est peut-être plongé dans ses pensées
  rationale: שִׂיחַ peut évoquer la réflexion ou la préoccupation intérieure. « Peut-être » explicite en français la série de suppositions ironiques sans en fixer excessivement le sens.
- source_word: וְכִי שִׂיג לוֹ
  choice: ou bien il s’est retiré
  rationale: L’expression rare semble indirecte et probablement euphémistique. Le texte principal en conserve la retenue, tandis que la note donne le sens possible.
- source_word: וְכִי דֶרֶךְ לוֹ
  choice: ou encore il est en voyage
  rationale: Le syntagme indique qu’il est parti sur la route ou absent pour voyager; cette formulation est idiomatique en français.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: Peut-être qu’il dort et qu’il se réveillera
  rationale: La traduction conserve la possibilité sarcastique et rend וְיִקָץ comme un verbe intransitif, sans introduire l’idée qu’on doit le réveiller.
theological_decisions:
- issue: Traduction de אֱלֹהִים à propos de Baal
  choice: un dieu
  alternative: Dieu
  rationale: Le contexte est une raillerie adressée aux prophètes de Baal, non une confession concernant le Dieu d’Israël. L’article indéfini préserve cette distinction et l’ironie.
- issue: Interprétation de l’expression euphémistique שִׂיג לוֹ
  choice: il s’est retiré
  alternative: il est allé faire ses besoins
  rationale: L’hébreu est rare et indirect. La traduction principale préserve son caractère euphémistique et la note signale l’interprétation probable sans la présenter comme certaine.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La formulation maintient le sarcasme d’Élie sans devenir familière ni grossière; la note préserve l’ambiguïté du texte hébreu.
