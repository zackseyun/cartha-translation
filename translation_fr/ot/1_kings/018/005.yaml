  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל עֹ֣בַדְיָ֔הוּ לֵ֤ךְ בָּ/אָ֨רֶץ֙ אֶל כָּל מַעְיְנֵ֣י הַ/מַּ֔יִם וְ/אֶ֖ל כָּל הַ/נְּחָלִ֑ים אוּלַ֣י נִמְצָ֣א חָצִ֗יר וּ/נְחַיֶּה֙ ס֣וּס וָ/פֶ֔רֶד וְ/ל֥וֹא נַכְרִ֖ית מֵ/הַ/בְּהֵמָֽה־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: fr
  text: 'Achab dit à Abdias : « Va à travers le pays, vers toutes les sources d’eau et tous les cours d’eau saisonniers[a]. Peut-être trouverons-nous de l’herbe et pourrons-nous garder en vie les chevaux et les mulets, afin de ne pas avoir à éliminer une partie du bétail[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les torrents » ou « tous les oueds ». Le mot hébreu peut désigner un torrent, son lit ou un cours d’eau saisonnier.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « afin que nous ne retranchions pas du bétail », c’est-à-dire une partie du bétail. Il s’agit probablement de devoir réduire le nombre d’animaux faute de nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Avec le verbe « aller », la préposition hébraïque peut exprimer un déplacement à travers le territoire. « Va dans le pays » reste proche de la formulation source tout en introduisant naturellement les lieux à inspecter.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: les sources d’eau
  rationale: Cette traduction concrète et naturelle reproduit directement la construction hébraïque.
- source_word: הַנְּחָלִים
  choice: les cours d’eau saisonniers
  rationale: Le terme désigne souvent des lits de torrent ou des cours d’eau intermittents. Cette formulation rend le sens géographique probable dans un contexte de sécheresse sans recourir au terme moins courant « oueds ».
- source_word: אוּלַי נִמְצָא
  choice: Peut-être trouverons-nous
  rationale: La formulation conserve à la fois l’incertitude et la perspective exprimée à la première personne du pluriel.
- source_word: חָצִיר
  choice: de l’herbe
  rationale: Le mot désigne ici la végétation servant de nourriture aux animaux ; « herbe » est clair et n’introduit pas l’idée de fourrage déjà coupé.
- source_word: וּנְחַיֶּה
  choice: pourrons-nous garder en vie
  rationale: Le hiphil exprime le fait de faire vivre ou de préserver la vie. La tournure française rend naturellement le but pratique de la recherche.
- source_word: סוּס וָפֶרֶד
  choice: les chevaux et les mulets
  rationale: Les singuliers hébreux ont ici une valeur collective ; le pluriel français exprime naturellement les deux catégories d’animaux.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: afin de ne pas avoir à éliminer une partie du bétail
  rationale: Le verbe כרת signifie littéralement « retrancher » et évoque ici la suppression ou la perte d’animaux. « Une partie du bétail » rend la valeur partitive probable de מן, tandis qu’une note conserve l’image littérale.
