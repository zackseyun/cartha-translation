base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: fr
  text: Alors le feu de Yahweh[a] tomba et consuma l’holocauste, le bois, les pierres et la poussière, puis lécha l’eau qui était dans le fossé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un feu venant de Yahweh ». L’hébreu peut mettre l’accent sur l’origine divine du feu.'
    reason: Alternative lexicale préservant l’ambiguïté de אֵשׁ יְהוָה.
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: le feu de Yahweh
  rationale: La juxtaposition des noms exprime un feu étroitement associé à Yahweh, tout en pouvant suggérer qu’il vient de lui. La formulation française conserve cette concision et l’ambiguïté de la relation.
- source_word: וַתִּפֹּל
  choice: tomba
  rationale: Le verbe נפל signifie littéralement « tomber » et préserve ici l’image saisissante d’un feu qui tombe d’en haut.
- source_word: וַתֹּאכַל
  choice: consuma
  rationale: Le sens concret est « mangea », mais « consumer » est le verbe français naturel pour l’action destructrice du feu.
- source_word: הָעֹלָה
  choice: l’holocauste
  rationale: Dans le vocabulaire sacrificiel, עֹלָה désigne l’offrande entièrement brûlée. « Holocauste » est le terme biblique français concis et établi.
- source_word: הָעֵצִים
  choice: le bois
  rationale: Le collectif français « le bois » rend naturellement le pluriel hébreu désignant les pièces de bois disposées sur l’autel.
- source_word: הָאֲבָנִים
  choice: les pierres
  rationale: 'Traduction directe qui maintient l’intensité du prodige : même les pierres sont consumées.'
- source_word: הֶעָפָר
  choice: la poussière
  rationale: עָפָר désigne ici la poussière ou terre meuble; « poussière » conserve l’image vive du texte.
- source_word: לִחֵכָה
  choice: lécha toute
  rationale: Le verbe לָחַך signifie « lécher ». Cette image est conservée; « toute » explicite idiomatiquement en français que l’eau est entièrement absorbée, résultat impliqué par le contexte.
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: l’eau qui était dans le fossé
  rationale: תְּעָלָה désigne le fossé ou canal creusé autour de l’autel. « Fossé » est concret et naturel dans ce cadre.
- source_word: וַ
  choice: Alors / et / puis
  rationale: Les waw narratifs font progresser le récit. Leur rendu varié en français moderne exprime clairement la succession sans lourdeur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre d’alliance et évite de le remplacer par un titre.
- issue: Relation exprimée par אֵשׁ יְהוָה
  choice: le feu de Yahweh
  alternative: un feu venant de Yahweh
  rationale: La formulation retenue reproduit la relation nominale concise de l’hébreu sans décider exclusivement entre appartenance, association et provenance; la variante de provenance est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme accumulatif de l’hébreu est maintenu par l’énumération, tandis que « puis » distingue naturellement l’action finale. Le terme cultuel « holocauste » est conservé pour sa précision biblique.
