  text: וַ/יְהִ֛י כִּ/רְא֥וֹת אַחְאָ֖ב אֶת אֵלִיָּ֑הוּ וַ/יֹּ֤אמֶר אַחְאָב֙ אֵלָ֔י/ו הַ/אַתָּ֥ה זֶ֖ה עֹכֵ֥ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: fr
  text: 'Quand Achab vit Élie, il lui dit : « Est-ce toi qui troubles Israël[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui attires le malheur sur Israël » ou « qui causes le désastre en Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Quand … vit
  rationale: La construction narrative avec l’infinitif précédé de כִּ exprime ici la circonstance temporelle. En français moderne, « Quand Achab vit » restitue naturellement cette relation sans reprendre une formule archaïque comme « il arriva que ».
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: וַיֹּאמֶר אַחְאָב אֵלָיו
  choice: il lui dit
  rationale: Cette formulation française rend directement le verbe de parole et son complément, tout en évitant la répétition peu naturelle du nom d’Achab.
- source_word: הַאַתָּה זֶה
  choice: C’est donc toi
  rationale: La tournure interrogative hébraïque est insistante et accusatrice. « C’est donc toi » en conserve la force confrontante dans un français naturel.
- source_word: עֹכֵר
  choice: qui sèmes le trouble
  rationale: Le participe de עכר désigne celui qui cause du trouble, du malheur ou un désastre. La proposition relative est plus idiomatique que « perturbateur » ou « fauteur de trouble » et conserve l’accusation directe.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française standard du nom national.
theological_decisions:
- issue: Portée de l’accusation d’Achab
  choice: « qui sèmes le trouble en Israël »
  alternative: « qui attires le malheur sur Israël » ou « qui causes le désastre en Israël »
  rationale: Le texte rapporte l’accusation d’Achab sans la valider. La traduction maintient cette tension narrative et théologique, sans préciser à tort la nature exacte du mal attribué à Élie.
translation_notes:
  register: Français moderne, digne et oralement naturel. La question directe garde le ton accusateur d’Achab. Le marqueur de note [a] est placé après l’expression qu’il précise.
