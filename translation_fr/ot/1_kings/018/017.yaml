  source_fidelity: La temporalité (« Quand Achab vit Élie ») et l'accusation interrogative sont bien rendues. Toutefois, « sèmes le trouble en Israël » introduit une métaphore absente de עֹכֵר et « en Israël » est moins direct que l'objet « Israël » dans l'hébreu. Une formulation directe conserve mieux l'accusation portée contre Élie.
  naturalness: « Est-ce toi qui troubles Israël ? » est un français moderne, naturel et nettement accusateur. Il restitue l'emphase interrogative sans ajouter l'inférence de « donc ».
  terminology: Achab, Élie et Israël sont les formes françaises usuelles. « Troubler Israël » rend de manière sobre et fidèle le participe עֹכֵר, tout en laissant entendre qu'il s'agit de l'accusation d'Achab.
