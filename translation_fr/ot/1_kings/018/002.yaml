  yaml_path: translation/ot/1_kings/018/002.yaml
  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: fr
  text: Élie alla donc se présenter devant Achab[a]. Or la famine était très sévère à Samarie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se montrer à Achab » ou « paraître devant Achab ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la famine était intense à Samarie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: alla donc
  rationale: Le waw consécutif fait avancer le récit et relie cette action à l’ordre du verset précédent; « donc » exprime naturellement ce lien en français.
- source_word: אֵלִיָּהוּ
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: se présenter devant Achab
  rationale: L’infinitif niphal de ראה signifie ici « paraître, se montrer ». « Se présenter devant » conserve la nuance réflexive et convient à une comparution auprès du roi.
- source_word: וְהָרָעָב
  choice: Or la famine
  rationale: Le waw introduit ici une circonstance d’arrière-plan plutôt qu’une nouvelle action; « or » marque clairement ce changement de plan narratif.
- source_word: חָזָק
  choice: était très sévère
  rationale: Avec « famine », חָזָק exprime une forte intensité. « Très sévère » est naturel en français moderne et rend la force de l’adjectif.
- source_word: בְּשֹׁמְרוֹן
  choice: à Samarie
  rationale: La préposition ב indique le lieu. En français, « à Samarie » convient naturellement si le nom désigne la ville, comme le contexte le suggère, sans expliciter davantage.
