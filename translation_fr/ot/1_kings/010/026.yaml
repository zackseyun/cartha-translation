source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּֽרָשִׁ֑ים וַ/יַּנְחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: fr
  text: Salomon rassembla des chars et des cavaliers[a]. Il possédait 1 400 chars et 12 000 cavaliers. Il les répartit dans les villes de chars et auprès du roi, à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des troupes de cavalerie » ; le terme hébreu désigne plus littéralement des hommes montés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: rassembla
  rationale: Le verbe אסף désigne ici le rassemblement ou l'accumulation de moyens militaires. « Rassembla » est naturel et reste proche du sens hébreu.
- source_word: רֶכֶב
  choice: chars
  rationale: Le singulier hébreu a ici une valeur collective. Le dénombrement qui suit appelle naturellement le pluriel français « chars ».
- source_word: פָרָשִׁים
  choice: cavaliers
  rationale: Le nom désigne des hommes montés plutôt que les chevaux eux-mêmes. « Cavaliers » rend directement ce sens sans imposer l'abstraction collective « cavalerie ».
- source_word: וַיְהִי לוֹ
  choice: Il possédait
  rationale: L'expression idiomatique hébraïque marque la possession. « Il possédait » convient au contexte d'inventaire des ressources royales.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1 400 chars
  rationale: Le nombre et le nom collectif sont rendus directement selon la typographie française moderne.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12 000 cavaliers
  rationale: Le nombre est rendu directement, et « cavaliers » reprend de façon cohérente le même terme hébreu.
- source_word: וַיַּנְחֵם
  choice: Il les répartit
  rationale: Le hiphil de נוח signifie faire reposer, déposer ou placer. Dans ce contexte, « répartit » exprime leur placement entre les villes désignées et Jérusalem, sans préciser davantage la nature militaire de leur présence.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: dans les villes de chars
  rationale: Cette expression désigne des villes associées au stationnement ou à l'administration des chars. « Villes de chars » conserve la formulation concrète et concise de l'hébreu.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: et auprès du roi, à Jérusalem
  rationale: « Auprès du roi » rend naturellement עִם dans le contexte de forces maintenues en présence du roi, tandis que la virgule évite de faire de « roi à Jérusalem » un groupe nominal ambigu.
