  text: וּ/שְׁנֵ֧ים עָשָׂ֣ר אֲרָיִ֗ים עֹמְדִ֥ים שָׁ֛ם עַל שֵׁ֥שׁ הַֽ/מַּעֲל֖וֹת מִ/זֶּ֣ה וּ/מִ/זֶּ֑ה לֹֽא נַעֲשָׂ֥ה כֵ֖ן לְ/כָל מַמְלָכֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/020.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: fr
  text: Douze lions se tenaient là, de part et d’autre des six marches. Rien de tel n’avait été fait dans aucun royaume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁנֵים עָשָׂר אֲרָיִים
  choice: Douze lions
  rationale: Le nombre cardinal introduit les figures de lions; le français naturel n’a pas besoin de conserver ici la conjonction initiale de manière autonome.
- source_word: עֹמְדִים שָׁם
  choice: se tenaient là
  rationale: Le participe qal décrit leur position dans la scène; « se tenaient là » rend naturellement cet état visuel.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: sur les six marches
  rationale: מַעֲלוֹת désigne ici les marches qui montent vers le trône, et עַל indique leur emplacement sur celles-ci.
- source_word: מִ/זֶּה וּ/מִ/זֶּה
  choice: un de chaque côté
  rationale: L’expression distributive situe les douze lions symétriquement des deux côtés; dans ce contexte, elle implique naturellement un lion de chaque côté de chacune des six marches.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: Rien de semblable n’avait été fait
  rationale: Le nifal de עשה avec כֵן exprime qu’aucune réalisation comparable n’avait été produite.
- source_word: לְ/כָל מַמְלָכוֹת
  choice: pour aucun royaume
  rationale: 'Sous la négation, לְכָל מַמְלָכוֹת prend une valeur distributive: aucun des royaumes n’avait bénéficié d’une réalisation semblable.'
