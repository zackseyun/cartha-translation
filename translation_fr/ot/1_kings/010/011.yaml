  text: וְ/גַם֙ אֳנִ֣י חִירָ֔ם אֲשֶׁר נָשָׂ֥א זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֨יא מֵ/אֹפִ֜יר עֲצֵ֧י אַלְמֻגִּ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֥בֶן יְקָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: fr
  text: De plus, la flotte[a] d’Hiram, qui avait transporté de l’or d’Ofir, rapporta d’Ofir du bois d’almug[b] en très grande quantité et des pierres précieuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le navire d’Hiram »; le nom hébreu est au singulier, mais il peut avoir ici un sens collectif et désigner l’entreprise maritime d’Hiram.
    reason: lexical_alternative
  - marker: b
    text: L’espèce exacte de ce bois est incertaine; le terme est aussi transcrit « algum » dans d’autres passages.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: De plus
  rationale: Introduit naturellement une information supplémentaire tout en conservant la valeur additive de l’hébreu.
- source_word: אֳנִי חִירָם
  choice: la flotte de Hiram
  rationale: Bien que אֳנִי soit morphologiquement singulier, le contexte permet un sens collectif désignant les navires ou l’entreprise maritime de Hiram; « flotte » est naturel en français.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: qui transportait de l’or
  rationale: Rend le sens concret de נשׂא dans un contexte de transport maritime et convient au rôle habituel de cette flotte.
- source_word: מֵאוֹפִיר
  choice: d’Ofir
  rationale: Transcription française courante du nom de lieu avec la préposition source conservée.
- source_word: הֵבִיא
  choice: rapporta
  rationale: Le hiphil de בוא signifie ici « faire venir, apporter »; « rapporta » s’accorde naturellement avec une expédition maritime revenant chargée de marchandises.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: du bois d’almug
  rationale: Conserve le terme hébreu traditionnel sans identifier abusivement une espèce botanique incertaine.
- source_word: הַרְבֵּה מְאֹד
  choice: en très grande quantité
  rationale: Reproduit explicitement l’intensification de l’expression hébraïque et s’emploie naturellement avec « bois ».
- source_word: וְאֶבֶן יְקָרָה
  choice: et des pierres précieuses
  rationale: Le singulier hébreu peut avoir une valeur collective; le pluriel français convient naturellement à une cargaison.
