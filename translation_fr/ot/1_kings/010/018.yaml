lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Puis ... fit
  rationale: Le wayyiqtol fait progresser le récit; « Puis » exprime naturellement la succession en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini désigne Salomon dans le contexte.
- source_word: כִּסֵּא
  choice: trône
  rationale: Dans ce contexte royal, « trône » est plus précis que le terme générique « siège ».
- source_word: שֵׁן
  choice: ivoire
  rationale: Bien que le mot signifie littéralement « dent », il désigne ici l’ivoire comme matériau.
- source_word: גָּדוֹל
  choice: grand
  rationale: « Grand » peut évoquer à la fois les dimensions et la magnificence du trône.
- source_word: וַיְצַפֵּהוּ
  choice: le recouvrit
  rationale: Le verbe צפה désigne ici l’action de couvrir ou de plaquer un objet avec un matériau; « recouvrir » est naturel et précis en français.
- source_word: זָהָב
  choice: or
  rationale: Équivalent direct du terme désignant le matériau.
- source_word: מוּפָז
  choice: affiné
  rationale: Le terme qualifie un or de haute qualité, possiblement purifié ou fin; « affiné » conserve cette idée sans imposer une précision technique incertaine.
