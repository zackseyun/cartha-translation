  text: וַ/יִּגְדַּל֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה מִ/כֹּ֖ל מַלְכֵ֣י הָ/אָ֑רֶץ לְ/עֹ֖שֶׁר וּ/לְ/חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/023.yaml
  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: fr
  text: Ainsi, le roi Salomon surpassa tous les rois de la terre en richesse et en sagesse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Et le roi Salomon devint plus grand que tous les rois de la terre en richesse et en sagesse. »'
    reason: Alternative lexicale qui reflète plus directement la forme du verbe hébreu et la conjonction initiale.
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: surpassa
  rationale: Dans cette construction comparative avec מִן, le verbe גדל exprime le fait de devenir ou d’être plus grand que d’autres. « Surpassa » rend ce sens avec naturel et sans ajouter d’idée étrangère.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: le roi Salomon
  rationale: Cette formulation française naturelle conserve le titre défini et le nom propre en apposition.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: tous les rois de la terre
  rationale: אֶרֶץ peut désigner le pays ou la terre. Ici, la comparaison internationale des souverains favorise le sens large « terre », sans imposer le terme plus expansif « monde ».
- source_word: לְעֹשֶׁר
  choice: en richesse
  rationale: עֹשֶׁר désigne la richesse matérielle. La préposition « en » convient à la comparaison portant sur le domaine dans lequel Salomon surpassait les autres rois.
- source_word: וּלְחָכְמָה
  choice: et en sagesse
  rationale: חָכְמָה signifie « sagesse ». La répétition de « en » produit en français une coordination claire et équilibrée.
- source_word: וַ
  choice: Ainsi
  rationale: Le waw fait progresser le récit et introduit ici un bilan découlant de ce qui précède. « Ainsi » exprime naturellement cette valeur récapitulative ou consécutive; « Et » reste possible dans une traduction plus formelle.
