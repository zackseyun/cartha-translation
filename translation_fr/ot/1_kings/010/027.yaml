source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: fr
  text: Le roi rendit l’argent aussi commun à Jérusalem que les pierres, et les cèdres aussi abondants que les sycomores[a] de la Shéphéla[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de figuiers-sycomores, arbres répandus dans les basses terres du Levant.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la basse région ». La Shéphéla est la zone de collines basses de Juda située entre la région montagneuse et la plaine côtière.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: rendit… aussi commun / aussi abondants
  rationale: Dans ces comparaisons, נתן exprime le fait de rendre une ressource commune ou abondante. Cette formulation restitue naturellement en français la valeur causative de l’hébreu.
- source_word: הַמֶּלֶךְ
  choice: Le roi
  rationale: L’hébreu dit simplement « le roi ». Le contexte l’identifie à Salomon, mais le verset ne le nomme pas.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף désigne ici le métal précieux, considéré comme une richesse disponible en grande quantité.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition locative se rend naturellement par « à » devant le nom de la ville.
- source_word: כָּאֲבָנִים
  choice: aussi commun… que les pierres
  rationale: Le préfixe כְּ marque une comparaison; l’ajout de « commun » explicite l’idée contextuelle d’une abondance telle que l’argent était aussi ordinaire que les pierres.
- source_word: הָאֲרָזִים
  choice: les cèdres
  rationale: Le pluriel hébreu désigne les cèdres, avec une possible implication de bois de cèdre, sans qu’il soit nécessaire de la préciser.
- source_word: כַּשִּׁקְמִים
  choice: que les sycomores[a]
  rationale: שִׁקְמִים désigne les figuiers-sycomores du Levant. « Sycomores » conserve la désignation traditionnelle et concise, avec une note explicative.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: de la Shéphéla[b]
  rationale: La tournure française « les sycomores de la Shéphéla » rend naturellement les arbres qui se trouvent dans cette région. Le toponyme précis est conservé et expliqué en note.
- source_word: לָרֹב
  choice: aussi abondants
  rationale: לָרֹב indique une grande quantité et complète la comparaison entre les cèdres et les nombreux sycomores de la région.
