  text: וְ/כָ֨ל הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/024.yaml
  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: fr
  text: Toute la terre cherchait à voir Salomon[a] pour entendre la sagesse que Dieu avait mise dans le cœur de Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cherchait le visage de Salomon », expression qui signifie chercher à être admis en sa présence ou à obtenir une audience auprès de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Toute la terre
  rationale: L’expression collective et hyperbolique désigne les peuples du monde connu. « Toute la terre » conserve l’image et la portée du texte hébreu sans la limiter à un territoire local.
- source_word: מְבַקְשִׁים
  choice: cherchait
  rationale: Le participe exprime ici une démarche habituelle ou répétée. Avec le sujet collectif singulier « toute la terre », l’imparfait français rend naturellement cette valeur.
- source_word: אֶת־פְּנֵי שְׁלֹמֹה
  choice: à voir Salomon
  rationale: Littéralement, l’expression signifie « chercher le visage de Salomon »; dans ce contexte royal, elle désigne le fait de chercher à accéder à sa présence ou à obtenir une audience. « Chercher à voir Salomon » est naturel en français et préserve une part de l’image.
- source_word: לִשְׁמֹעַ
  choice: pour entendre
  rationale: L’infinitif précédé de ל exprime le but. « Pour entendre » suit directement le sens de la forme hébraïque.
- source_word: חָכְמָתוֹ
  choice: la sagesse
  rationale: 'Le suffixe possessif est rendu par le contexte: il s’agit de la sagesse de Salomon. La relative qui suit permet une formulation française fluide sans perdre le référent.'
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: que Dieu avait mise
  rationale: נָתַן signifie littéralement « donner », mais avec « dans son cœur », « mettre » est l’expression française naturelle. Le plus-que-parfait situe ce don avant la venue des peuples.
- source_word: בְּלִבּוֹ
  choice: dans son cœur
  rationale: « Cœur » conserve l’anthropologie hébraïque, où le terme englobe notamment l’intelligence, le discernement et la volonté, sans le réduire au seul « esprit ».
theological_decisions:
- issue: Traduction de אֱלֹהִים
  choice: Dieu
  alternative: le SEIGNEUR
  rationale: Le texte porte אֱלֹהִים et non le nom divin YHWH; « Dieu » maintient cette distinction lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’hyperbole « toute la terre », l’image hébraïque du cœur et, en note, l’expression idiomatique du « visage ».
