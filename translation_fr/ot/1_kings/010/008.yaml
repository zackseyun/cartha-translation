  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: fr
  text: Heureux sont tes hommes ! Heureux sont tes serviteurs que voici, qui se tiennent constamment devant toi et entendent ta sagesse !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette exclamation exprime une condition enviable de bonheur et de faveur. « Heureux » est la formulation française naturelle et consacrée des béatitudes, tout en gardant un registre digne.
- source_word: אֲנָשֶׁיךָ
  choice: tes hommes
  rationale: Le pluriel masculin désigne ici les hommes appartenant à l’entourage royal. « Tes hommes » conserve cette précision sans élargir indûment le sens à tout le peuple.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans le cadre de la cour royale, le terme désigne les personnes au service du roi. « Serviteurs » convient mieux au contexte que « esclaves », qui mettrait au premier plan un statut que le verset ne souligne pas.
- source_word: אֵלֶּה
  choice: que voici
  rationale: Cette tournure rend naturellement en français la valeur proximale du démonstratif et rattache clairement celui-ci aux serviteurs présents.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: qui se tiennent devant toi
  rationale: La traduction garde l’image concrète de personnes se tenant devant le roi, expression qui implique leur présence et leur service à la cour.
- source_word: תָּמִיד
  choice: constamment
  rationale: L’adverbe indique une présence régulière et continue. « Constamment » préserve cette nuance sans imposer nécessairement une permanence absolue.
- source_word: הַשֹּׁמְעִים
  choice: et entendent
  rationale: Le participe coordonné décrit ces serviteurs comme ceux qui entendent la sagesse de Salomon. « Entendent » conserve le sens direct du verbe sans ajouter explicitement l’idée d’obéissance.
- source_word: חָכְמָתֶךָ
  choice: ta sagesse
  rationale: La formulation directe respecte l’objet hébreu et laisse au contexte le soin d’indiquer que cette sagesse se manifeste notamment dans les paroles et les décisions du roi.
