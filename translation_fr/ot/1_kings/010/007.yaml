  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לַ/דְּבָרִ֗ים עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּ֥ה לֹֽא הֻגַּד לִ֖/י הַ/חֵ֑צִי הוֹסַ֤פְתָּ חָכְמָה֙ וָ/ט֔וֹב אֶל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: fr
  text: Mais je n’ai pas cru ce qu’on racontait jusqu’à ce que je vienne et que je le voie de mes propres yeux. Et voici qu’on ne m’en avait pas dit la moitié ! Ta sagesse et ta prospérité[a] surpassent ce que j’avais entendu dire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ta sagesse et ta richesse surpassent ce que j’avais entendu dire. » Le mot hébreu טוֹב peut désigner le bien-être ou la prospérité en général et, dans ce contexte, inclure la richesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: je n’ai pas cru
  rationale: Le hiphil de אמן signifie ici tenir les propos entendus pour vrais ou crédibles. « Croire » rend directement ce sens.
- source_word: לַדְּבָרִים
  choice: ce qu’on racontait
  rationale: Dans ce contexte, דְּבָרִים désigne les propos ou récits qui circulaient au sujet de Salomon. Cette formulation est plus naturelle en français que le littéral « les paroles ».
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: que je le voie de mes propres yeux
  rationale: L’hébreu dit littéralement « mes yeux ont vu ». L’expression française conserve l’insistance sur le constat personnel.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Ce marqueur attire l’attention et exprime la surprise; « voici » en préserve la force rhétorique dans un registre biblique encore compréhensible.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: on ne m’en avait pas même raconté la moitié
  rationale: Cette tournure idiomatique restitue la négation emphatique et renvoie clairement aux récits précédemment entendus.
- source_word: הוֹסַפְתָּ ... אֶל
  choice: Tu surpasses ... ce que
  rationale: Dans cette construction comparative, יסף avec אֶל exprime le dépassement plutôt qu’une simple addition. Le français au présent convient à la constatation directe de la reine, le parfait hébreu ne devant pas être assimilé mécaniquement à un passé composé.
- source_word: חָכְמָה וָטוֹב
  choice: en sagesse et en prospérité
  rationale: חָכְמָה signifie « sagesse ». Dans le contexte de la réussite et de la splendeur royales, טוֹב désigne le bien-être ou la prospérité, tout en pouvant inclure la richesse.
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: ce que j’avais entendu dire
  rationale: Cette formulation française rend naturellement le rapport entendu auparavant, sans la connotation incertaine de « rumeur ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici » conserve l’effet de surprise du marqueur hébreu; « prospérité » maintient la portée assez large de טוֹב, tandis que la note signale l’interprétation plus étroite « richesse ».
