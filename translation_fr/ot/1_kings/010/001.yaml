source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שֹׁמַ֛עַת אֶת שֵׁ֥מַע שְׁלֹמֹ֖ה לְ/שֵׁ֣ם יְהוָ֑ה וַ/תָּבֹ֥א לְ/נַסֹּת֖/וֹ בְּ/חִידֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: fr
  text: La reine de Saba entendit parler de la renommée de Salomon, associée au nom de Yahweh[a], et elle vint le mettre à l’épreuve par des énigmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les nouvelles concernant Salomon en rapport avec le nom de Yahweh ». L’expression hébraïque est concise et peut indiquer que la renommée de Salomon était liée au nom ou à la réputation de Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au moyen de questions difficiles ». Le mot hébreu désigne plus littéralement des énigmes ou des paroles énigmatiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַֽלְכַּת שְׁבָא
  choice: La reine de Saba
  rationale: Le waw assure la continuité narrative, mais n’exige pas ici un connecteur explicite en français. « Saba » est la forme française traditionnelle et largement reconnue du nom de lieu.
- source_word: שֹׁמַעַת אֶת שֵׁמַע שְׁלֹמֹה
  choice: entendit parler de la renommée de Salomon
  rationale: שֵׁמַע peut désigner ce qui se rapporte, les nouvelles ou la renommée de quelqu’un. « Entendit parler de la renommée » rend naturellement en français le fait que la reine reçoit un écho de la réputation de Salomon.
- source_word: לְ/שֵׁם יְהוָה
  choice: associée au nom de Yahweh
  rationale: La préposition לְ exprime ici un rapport difficile à préciser. « Associée à » conserve le lien entre la renommée de Salomon et le nom de Yahweh sans imposer une valeur causale ou finale.
- source_word: וַ/תָּבֹא לְ/נַסֹּת֖/וֹ
  choice: et elle vint le mettre à l’épreuve
  rationale: Le wayyiqtol fait progresser le récit, et נסה signifie essayer ou éprouver. « Mettre à l’épreuve » convient à l’examen auquel la reine soumet Salomon.
- source_word: בְּ/חִידֽוֹת
  choice: par des énigmes
  rationale: חִידוֹת désigne des énigmes ou des paroles obscures. « Énigmes » est plus proche du sens lexical que l’interprétation « questions difficiles ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de lui substituer un titre.
- issue: Lien entre la renommée de Salomon et le nom de Yahweh
  choice: la renommée de Salomon, associée au nom de Yahweh
  alternative: la renommée que Salomon devait au nom de Yahweh
  rationale: La construction hébraïque est compacte et ambiguë. Le texte principal maintient une relation ouverte sans décider que le nom de Yahweh est nécessairement la cause de la renommée de Salomon.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation garde l’ambiguïté de לְשֵׁם sans alourdir excessivement la phrase. Les marqueurs de notes suivent les expressions qu’ils expliquent.
