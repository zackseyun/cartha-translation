    rationale: Dans la lecture toponymique, les marchands obtiennent les chevaux de/depuis Qoué; « à Qoué » situe l’achat sans exprimer clairement la provenance.
  - severity: low
    issue: La note b ajoute « un certain prix »
    rationale: L’adjectif « certain » n’a pas d’équivalent dans l’hébreu et devrait être supprimé.
