base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: fr
  text: Les chevaux destinés à Salomon étaient importés d’Égypte et de Qoué[a] ; les marchands du roi les obtenaient de Qoué, à un prix.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rendu par « Qoué » est incertain. Il peut s’agir d’un nom de lieu, probablement situé en Cilicie, ou d’un nom commun désignant quelque chose comme un convoi ou un lot de chevaux.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible de ce texte hébreu difficile : « Les chevaux destinés à Salomon étaient importés d’Égypte et d’un lot ; les marchands du roi acquéraient un lot à un prix. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: étaient importés
  rationale: Dans ce contexte commercial, le nom désigne vraisemblablement la provenance ou l’importation des chevaux. La tournure verbale est naturelle en français et indique clairement le mouvement vers Salomon.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: Les chevaux destinés à Salomon
  rationale: Le lamed peut exprimer l’appartenance ou la destination. « destinés à Salomon » reste proche de « pour Salomon » sans affirmer plus précisément une possession déjà acquise.
- source_word: מִמִּצְרָיִם
  choice: d’Égypte
  rationale: Traduction usuelle du nom géographique.
- source_word: וּמִקְוֵה / מִקְוֵה
  choice: et de Qoué / à Qoué
  rationale: Le terme difficile est compris comme un nom de lieu, probablement la Cilicie. Cette lecture convient à la mention d’une région d’approvisionnement, mais l’autre analyse lexicale est signalée en note.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: les marchands du roi
  rationale: Désigne naturellement les agents commerciaux au service du roi.
- source_word: יִקְחוּ
  choice: les achetaient
  rationale: Le verbe signifie littéralement « prendre » ou « acquérir » ; la mention du prix rend ici l’achat explicite dans le contexte commercial.
- source_word: בִּמְחִיר
  choice: au prix convenu
  rationale: La préposition et le nom indiquent une acquisition moyennant un prix. « convenu » produit un français naturel sans supposer nécessairement un tarif officiel.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’incertitude du terme מִקְוֵה au moyen de notes, tout en retenant dans le texte principal la lecture géographique la plus cohérente avec le contexte commercial.
