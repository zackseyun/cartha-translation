base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: fr
  text: Elle donna au roi cent vingt talents d’or, une très grande quantité d’aromates et des pierres précieuses. Jamais plus il n’arriva autant d’aromates[a] que la reine de Saba en donna au roi Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici « aromate » au singulier (« comme cet aromate »), probablement dans un sens collectif ; le contexte souligne surtout l’abondance des aromates.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Elle donna
  rationale: Le wayyiqtol de נתן fait progresser le récit; le passé simple convient au registre narratif français et le pronom reprend naturellement la reine de Saba.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: cent vingt talents d’or
  rationale: כִּכָּר désigne une unité ancienne de poids. La conserver évite une conversion moderne incertaine.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: une très grande quantité d’aromates
  rationale: בְשָׂמִים désigne des substances aromatiques, épices ou baumes; «aromates» est ici naturel et assez large, tandis que הַרְבֵּה מְאֹד souligne fortement la quantité.
- source_word: וְאֶבֶן יְקָרָה
  choice: des pierres précieuses
  rationale: Le singulier hébreu אֶבֶן peut avoir un sens collectif dans cette liste de présents; le pluriel français l’exprime naturellement.
- source_word: לֹא בָא ... עוֹד
  choice: Jamais plus il n’arriva
  rationale: בוא indique ici l’arrivée de marchandises ou de présents; avec la négation et עוֹד, la tournure signifie qu’une telle quantité ne se présenta plus par la suite.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: une aussi grande quantité d’aromates
  rationale: Le singulier בֹּשֶׂם est vraisemblablement collectif et לָרֹב porte sur l’abondance. La formulation française rend explicitement la comparaison quantitative.
- source_word: מַלְכַּת שְׁבָא
  choice: la reine de Saba
  rationale: «Saba» est la forme française traditionnelle et courante du nom biblique שְׁבָא.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: au roi Salomon
  rationale: Cette tournure rend naturellement en français l’association hébraïque du titre et du nom propre.
