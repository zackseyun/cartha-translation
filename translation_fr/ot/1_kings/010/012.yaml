  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: fr
  text: Le roi fit avec le bois d’almug[a] des éléments de soutien[b] pour la maison de Yahweh et pour la maison du roi, ainsi que des lyres et des harpes pour les chanteurs. Jamais auparavant un tel bois d’almug n’était arrivé, et l’on n’en a pas vu jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ailleurs, un terme apparenté présente la variante orthographique « algum ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu est rare et incertain ; il peut désigner des appuis ou d’autres éléments architecturaux, tels que des marches ou des balustrades.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: le bois d’almug
  rationale: Le terme désigne un bois précieux importé, mais l’espèce exacte demeure inconnue. La translittération « almug » respecte la forme du texte massorétique sans proposer une identification botanique conjecturale.
- source_word: מִסְעָד
  choice: des éléments de soutien
  rationale: Ce nom rare désigne vraisemblablement un aménagement architectural, mais son sens précis est incertain. « Éléments de soutien » reste compréhensible sans trancher entre appuis, marches, balustrades ou piliers.
- source_word: לְבֵית יְהוָה
  choice: pour la maison de Yahweh
  rationale: « Maison » conserve l’image et le parallélisme hébreux avec la maison du roi; le nom divin est rendu par « Yahweh ».
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: et pour la maison du roi
  rationale: Cette formulation conserve le parallélisme formel avec « la maison de Yahweh », tout en restant naturelle en français.
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: des lyres et des harpes
  rationale: Ces deux termes désignent des instruments à cordes distincts. Les équivalents choisis sont courants, même si l’identification organologique exacte reste incertaine.
- source_word: לַשָּׁרִים
  choice: pour les chanteurs
  rationale: Le terme vient du verbe « chanter » et désigne plus précisément les chanteurs que les musiciens en général.
- source_word: לֹא בָא כֵן עֲצֵי אַלְמֻגִּים
  choice: Jamais pareil bois d’almug n’était arrivé
  rationale: « Pareil » rend כֵן sans déterminer si l’affirmation porte surtout sur la quantité, la qualité ou le caractère exceptionnel du bois; le plus-que-parfait exprime l’absence de précédent.
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: et on n’en a pas vu jusqu’à ce jour
  rationale: Le passé composé avec « jusqu’à ce jour » restitue la portée continue de l’observation depuis le point de vue du narrateur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme des deux « maisons » et maintient l’incertitude propre aux termes rares relatifs au bois et à l’architecture.
