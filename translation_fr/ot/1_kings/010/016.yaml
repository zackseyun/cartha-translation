  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: fr
  text: Le roi Salomon fit deux cents grands boucliers en or battu[b] ; six cents sicles d’or[a] furent employés pour chaque bouclier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « six cents d’or montaient sur le bouclier unique » ; le « sicle » est sous-entendu comme unité de poids.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne ici un grand bouclier, vraisemblablement distinct des boucliers plus petits mentionnés au verset suivant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe courant עשה désigne ici la fabrication ; « fit » est naturel et digne dans ce récit.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: le roi Salomon
  rationale: Cette formulation française associe naturellement le titre et le nom.
- source_word: מָאתַיִם
  choice: deux cents
  rationale: Rendu direct du nombre cardinal.
- source_word: צִנָּה
  choice: grands boucliers
  rationale: צִנָּה désigne vraisemblablement un grand bouclier, distinct du type plus petit mentionné au verset suivant.
- source_word: זָהָב שָׁחוּט
  choice: or martelé
  rationale: Le participe שָׁחוּט décrit ici de l’or travaillé et aminci par martelage ; « or martelé » est précis et idiomatique.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: six cents sicles d’or
  rationale: L’unité de poids n’est pas exprimée dans l’hébreu, mais le sicle est sous-entendu par la construction et le contexte.
- source_word: יַעֲלֶה עַל
  choice: furent employés pour
  rationale: Littéralement « montaient sur » ; dans ce contexte, la tournure indique la quantité d’or appliquée ou utilisée pour chaque bouclier.
- source_word: הַצִּנָּה הָאֶחָת
  choice: chaque bouclier
  rationale: Littéralement « le bouclier unique » ou « un bouclier » ; la valeur distributive est rendue naturellement par « chaque bouclier ».
