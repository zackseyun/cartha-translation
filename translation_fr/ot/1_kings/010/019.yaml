base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: fr
  text: Le trône avait six marches et un sommet arrondi à l’arrière du trône[a]. Il avait des accoudoirs de part et d’autre du siège[b], et deux lions se tenaient à côté des accoudoirs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une tête arrondie pour le trône, derrière lui ». Le terme « tête » désigne une partie supérieure, dont la forme précise n’est pas indiquée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vers le lieu où l’on s’assoit » ou « près du lieu où l’on s’assoit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: marches
  rationale: Dans la description architecturale du trône, le terme désigne les marches permettant d’y monter. « Marches » est précis et naturel en français.
- source_word: לַכִּסֵּה
  choice: Le trône avait
  rationale: Le ל préfixé est rendu idiomatiquement comme une relation de possession dans cette description, plutôt que par le calque « pour le trône ».
- source_word: רֹאשׁ עָגֹל
  choice: un sommet arrondi
  rationale: L’expression signifie littéralement « une tête ronde ». « Sommet arrondi » décrit la partie supérieure du trône sans préciser indûment qu’il s’agit d’un appuie-tête ou d’un dossier.
- source_word: מֵאַחֲרָיו
  choice: à l’arrière
  rationale: Cette expression situe la partie arrondie à l’arrière du trône, dans une formulation française concise.
- source_word: יָדֹת
  choice: accoudoirs
  rationale: Bien que le mot soit apparenté à « mains », son emploi dans la description d’un siège désigne naturellement ses bras ou accoudoirs.
- source_word: מִזֶּה וּמִזֶּה
  choice: de part et d’autre
  rationale: Cette locution française exprime clairement la disposition bilatérale indiquée par l’hébreu.
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: du siège
  rationale: Littéralement « près du lieu où l’on s’assoit » ou « vers le lieu de l’assise » ; dans ce contexte, « du siège » en communique naturellement la fonction et la position.
- source_word: אֲרָיוֹת
  choice: lions
  rationale: Équivalent direct du nom pluriel hébreu, qui désigne ici des figures de lions associées au trône.
- source_word: עֹמְדִים
  choice: se tenaient
  rationale: Le participe présente les lions dans une position fixe et dressée. « Se tenaient » convient à la description statique sans imposer qu’il s’agisse d’animaux vivants.
- source_word: אֵצֶל הַיָּדוֹת
  choice: à côté des accoudoirs
  rationale: La formulation situe les deux lions près des bras du trône et maintient la cohérence lexicale avec la première occurrence de יָדֹת.
