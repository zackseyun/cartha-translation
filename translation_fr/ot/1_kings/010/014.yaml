  yaml_path: translation/ot/1_kings/010/014.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: fr
  text: Le poids de l’or qui arrivait à Salomon en une année était de six cent soixante-six talents d’or.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le talent était une importante unité de poids antique. Le verset donne la quantité annuelle selon cette mesure, sans la convertir en unités modernes.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: était
  rationale: La forme narrative introduit ici le relevé comptable; une formulation directe avec « était » est naturelle en français et évite d’ajouter un marqueur temporel absent du texte.
- source_word: מִשְׁקַל
  choice: Le poids
  rationale: Le nom désigne le poids ou la mesure pondérale; « le poids » en donne le sens direct dans ce contexte comptable.
- source_word: הַזָּהָב ... זָהָב
  choice: de l’or ... d’or
  rationale: La première occurrence désigne la quantité d’or reçue, tandis que la seconde précise la matière mesurée en talents.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: qui arrivait à Salomon
  rationale: Le verbe בוא avec ל indique ce qui venait ou parvenait à Salomon, sans préciser qu’un agent l’apportait. L’imparfait convient à ce relevé d’un revenu annuel dans le cadre narratif.
- source_word: בְּשָׁנָה אֶחָת
  choice: en une année
  rationale: La locution indique la quantité reçue sur la durée d’une année; cette traduction reste proche de l’hébreu et naturelle en français.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: six cent soixante-six
  rationale: C’est la transcription française directe du nombre cardinal hébreu.
- source_word: כִּכַּר
  choice: talents
  rationale: Le talent est l’unité pondérale antique habituelle correspondant à כִּכָּר; la conserver évite une conversion moderne incertaine dans le corps du texte.
