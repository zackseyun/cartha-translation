source:
  edition: WLC
  text: וַ/תֵּ֨רֶא֙ מַֽלְכַּת שְׁבָ֔א אֵ֖ת כָּל חָכְמַ֣ת שְׁלֹמֹ֑ה וְ/הַ/בַּ֖יִת אֲשֶׁ֥ר בָּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/004.yaml
  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
translation:
  language: fr
  text: Quand la reine de Saba vit toute la sagesse de Salomon et la maison qu’il avait construite,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le palais qu’il avait construit ». Le mot hébreu traduit par « maison » peut, dans ce contexte, désigner une résidence royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Quand … vit
  rationale: Le waw consécutif fait avancer le récit, mais le verset ouvre ici une proposition circonstancielle qui se poursuit au verset suivant; « Quand » rend naturellement cette fonction syntaxique.
- source_word: מַלְכַּת שְׁבָא
  choice: la reine de Saba
  rationale: Le syntagme construit désigne la souveraine de Saba; la minuscule convient à un titre descriptif en français.
- source_word: אֵת
  choice: '[marqueur de l’objet direct, non traduit]'
  rationale: Ce marqueur grammatical introduit l’objet direct défini et n’appelle aucun équivalent lexical en français.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: toute la sagesse de Salomon
  rationale: Cette formulation conserve la totalité exprimée par כָּל et le rapport construit, tout en restant naturelle en français.
- source_word: וְהַבַּיִת
  choice: et la maison
  rationale: בַּיִת signifie formellement « maison ». Dans ce contexte royal, il peut désigner le palais de Salomon; cette possibilité est conservée en note plutôt qu’intégrée silencieusement au texte.
- source_word: אֲשֶׁר בָּנָה
  choice: qu’il avait construite
  rationale: La proposition relative qualifie « maison ». Le plus-que-parfait indique naturellement que la construction était achevée avant la visite de la reine; l’accord féminin est requis en français.
