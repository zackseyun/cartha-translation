- from: Il fit aussi trois cents boucliers en or battu[a] ; trois mines d’or furent appliquées sur chaque bouclier[b]. Le roi les plaça dans la Maison de la Forêt du Liban[c].
  to: Il fit aussi trois cents boucliers en or battu[a] ; on appliqua trois mines d’or à chaque bouclier[b]. Le roi les plaça dans la Maison de la Forêt du Liban[c].
  rationale: La révision rend plus idiomatique en français l’idée que trois mines d’or étaient affectées à chaque bouclier. Elle clarifie également la note littérale et retire de la note historique une précision fonctionnelle qui ne relève pas directement du verset. Les ancres a, b et c restent correctement associées aux expressions concernées.
