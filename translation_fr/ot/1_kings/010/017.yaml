base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: fr
  text: Il fit aussi trois cents boucliers en or battu[a] ; on appliqua trois mines d’or à chaque bouclier[b]. Le roi les plaça dans la Maison de la Forêt du Liban[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en or martelé » ou « en or aminci au marteau ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « trois mines d’or montaient sur un bouclier », c’est-à-dire que trois mines d’or étaient appliquées à chacun des boucliers.'
    reason: lexical_alternative
  - marker: c
    text: La Maison de la Forêt du Liban est le nom d’un bâtiment royal lié au complexe palatial de Salomon (voir 1 Rois 7.2).
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: boucliers
  rationale: מָגֵן désigne ici le grand bouclier, par contraste avec les petits boucliers du verset précédent. « Boucliers » est le terme français courant et naturel.
- source_word: זָהָב שָׁחוּט
  choice: or battu
  rationale: שָׁחוּט décrit de l’or travaillé au marteau, probablement aminci en plaques. « Or battu » rend de façon concise le procédé de fabrication.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: trois mines
  rationale: מָנֶה est une unité de poids ancienne. « Mine » est sa désignation française usuelle et maintient la donnée métrologique du texte.
- source_word: יַעֲלֶה עַל
  choice: furent appliquées sur
  rationale: L’expression signifie littéralement que l’or « montait sur » le bouclier. « Furent appliquées sur » exprime naturellement en français la quantité d’or apposée à chacun, sans affirmer que le bouclier était entièrement en or massif.
- source_word: הַמָּגֵן הָאֶחָת
  choice: chaque bouclier
  rationale: Le singulier hébreu, littéralement « le bouclier, l’un », a ici une valeur distributive ; « chaque bouclier » en communique clairement le sens.
- source_word: וַיִּתְּנֵם
  choice: les plaça
  rationale: נתן prend ici le sens de mettre ou déposer dans un lieu. « Les plaça » convient au registre narratif et à la destination des objets.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: la Maison de la Forêt du Liban
  rationale: Il s’agit du nom d’un bâtiment royal précis. La majuscule signale ce nom propre, tandis que « Maison » conserve la formulation hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination initiale implicite dans le contexte est rendue par « aussi ». « Il fit » explicite naturellement l’action sous-entendue par la construction hébraïque tout en maintenant le roi comme agent dans le contexte immédiat. Les unités anciennes et le nom propre du bâtiment sont conservés.
