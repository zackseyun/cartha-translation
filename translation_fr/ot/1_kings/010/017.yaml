  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : les trois cents grands boucliers sont en or battu, la quantité de trois mines est distributive pour chaque bouclier, et le roi les dépose dans le bâtiment nommé. « Il fit aussi » explicite de manière acceptable l’agent repris du contexte précédent. Une légère révision améliore la formulation française de l’application de l’or.'
  naturalness: « Trois mines d’or furent appliquées sur chaque bouclier » est compréhensible, mais l’association de « appliquer » avec « sur » est moins idiomatique ici. « On appliqua trois mines d’or à chaque bouclier » est naturel, conserve l’absence d’agent explicite dans cette proposition et exprime clairement la répartition.
  terminology: « Boucliers », « or battu », « mines » et « Maison de la Forêt du Liban » sont appropriés. La note sur le bâtiment doit éviter de présenter comme probable une fonction d’arsenal qui reste une identification historique, non une donnée du verset.
  issues:
  - severity: low
    issue: Formulation de l’application de l’or
    rationale: En français moderne, on applique une quantité ou un revêtement « à » un objet plutôt que « sur » celui-ci dans cette construction. La reformulation est plus fluide sans modifier le sens.
  - severity: medium
    issue: 'Note c : fonction d’arsenal présentée comme probable'
