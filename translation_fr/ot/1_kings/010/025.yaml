base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: fr
  text: 'Et chacun apportait son tribut[a] : des objets en argent, des objets en or, des vêtements[b], des armes[c], des aromates, des chevaux et des mulets, année après année[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présent » ou « cadeau ». Le terme hébreu peut désigner un don, une offrande ou un tribut; dans ce contexte royal, « tribut » est retenu.
    reason: lexical_alternative
  - marker: b
    text: Ou « manteaux » ou « vêtements de dessus ».
    reason: lexical_alternative
  - marker: c
    text: Ou « équipement militaire ».
    reason: lexical_alternative
  - marker: d
    text: L’expression hébraïque indique que cela se répétait chaque année.
    reason: idiom_clarification
lexical_decisions:
- source_word: מְבִאִים
  choice: apportait
  rationale: Le participe avec הֵמָּה décrit ici une action habituelle et répétée. En français, l’imparfait rend naturellement cette valeur sans alourdir la phrase.
- source_word: אִישׁ מִנְחָתוֹ
  choice: chacun apportait son tribut
  rationale: אִישׁ a une valeur distributive (« chacun »). Dans ce contexte royal, מִנְחָה désigne vraisemblablement un présent remis au roi, voire un tribut; une note conserve l’autre possibilité.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: des objets en argent, des objets en or
  rationale: כְּלִי est un terme large pouvant désigner divers objets, récipients ou ustensiles. « Objets » évite de préciser indûment leur nature et maintient le parallélisme.
- source_word: שְׂלָמוֹת
  choice: vêtements
  rationale: Le mot semble désigner des vêtements de dessus, peut-être des manteaux ou des robes. Le terme générique « vêtements » convient à la liste tout en laissant la précision possible en note.
- source_word: נֵשֶׁק
  choice: armes
  rationale: Le terme peut couvrir l’armement ou l’équipement militaire. « Armes » est clair et idiomatique, tandis qu’« armures » demeure une autre interprétation possible.
- source_word: בְשָׂמִים
  choice: aromates
  rationale: Le mot désigne des substances odorantes précieuses. « Aromates » est naturel dans un contexte ancien de présents royaux et reste plus large que « épices » au sens culinaire moderne.
- source_word: סוּסִים וּפְרָדִים
  choice: des chevaux et des mulets
  rationale: Ces équivalents français correspondent directement au sens usuel des deux noms hébreux.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: année après année
  rationale: Cette expression idiomatique indique une récurrence annuelle. « Année après année » restitue à la fois la répétition et le caractère suivi de l’usage.
theological_decisions:
- issue: Nature de la מִנְחָה remise à Salomon
  choice: tribut
  alternative: présent / cadeau
  rationale: Le cadre royal et la succession régulière des remises favorisent « tribut », sans exclure qu’il s’agisse de présents honorifiques; l’ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, fluide et digne. L’imparfait exprime l’action coutumière; la liste garde le rythme sobre de l’hébreu. Tous les marqueurs de note figurent dans le texte principal.
