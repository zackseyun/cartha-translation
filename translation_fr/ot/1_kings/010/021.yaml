id: 1KI.10.21
reference: 1 Kings 10:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: fr
  text: Tous les récipients à boire du roi Salomon étaient en or, et tous les objets de la Maison de la Forêt du Liban étaient en or fin[a]. L’argent était considéré comme sans aucune valeur à l’époque de Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en or pur » ou « en or affiné ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: récipients à boire
  rationale: L’expression désigne largement les objets servant à boire, sans la restreindre aux seules coupes.
- source_word: זָהָב
  choice: or
  rationale: Terme matériel direct, répété dans le verset pour souligner la richesse et la splendeur.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: la Maison de la Forêt du Liban
  rationale: Cette formulation conserve la structure hébraïque et le caractère de nom propre de cet édifice royal.
- source_word: זָהָב סָגוּר
  choice: or fin
  rationale: L’expression désigne un or de grande qualité, pur ou affiné. « Or fin » est naturel en français et évite que « or massif » précise indûment la composition.
- source_word: אֵין כֶּסֶף לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: L’argent était considéré comme sans aucune valeur
  rationale: 'La proposition exprime un jugement de valeur plutôt que l’absence matérielle d’argent : celui-ci ne comptait pour rien.'
- source_word: בִּימֵי שְׁלֹמֹה
  choice: à l’époque de Salomon
  rationale: Formulation temporelle naturelle en français moderne, fidèle au sens de l’expression hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Maison de la Forêt du Liban » est conservé comme désignation d’un édifice royal. La syntaxe distingue l’or ordinaire du premier membre et l’or de qualité supérieure explicitement qualifié dans le second.
