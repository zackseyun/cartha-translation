  verdict: revise
  source_fidelity: La bénédiction optative, le nom divin, la faveur accordée au roi, l’intronisation, la cause fondée sur l’amour de Yahweh pour Israël, ainsi que le binôme משפט וצדקה sont globalement rendus fidèlement. La note conserve utilement l’alternative nominale de בְּאַהֲבַת.
