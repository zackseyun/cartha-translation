id: 1KI.10.9
reference: 1 Kings 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: fr
  text: Béni soit Yahweh, ton Dieu, qui a pris plaisir en toi pour te placer sur le trône d’Israël ! Parce que Yahweh aime Israël pour toujours[a], il t’a établi roi afin que tu exerces le droit et la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de l’amour éternel de Yahweh pour Israël ». L’hébreu emploie ici le nom « amour » plutôt qu’un verbe.'
    reason: La note préserve la construction nominale de l’hébreu et une autre formulation possible du rapport causal.
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Béni soit
  rationale: Cette formule française naturelle et solennelle conserve la valeur optative de la tournure hébraïque de bénédiction.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, ton Dieu
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, et le suffixe masculin singulier est rendu par « ton ».
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: qui a pris plaisir en toi
  rationale: חפץ avec ב exprime le plaisir et la faveur accordés à une personne ; cette formulation garde la chaleur de l’expression sans la réduire à une simple approbation.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: au point de te placer sur le trône d’Israël
  rationale: « Placer sur le trône » préserve l’image d’intronisation. « Au point de » relie naturellement en français le plaisir de Yahweh à l’élévation royale, sans effacer la valeur de visée de l’infinitif.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: Parce que Yahweh aime Israël pour toujours
  rationale: Le ב est compris dans son sens causal contextuel. La formulation verbale est naturelle en français et exprime la permanence indiquée par לְעֹלָם, tandis qu’une note signale la construction nominale plus littérale.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: il t’a établi roi
  rationale: שׂים suivi de ל marque ici l’établissement dans une fonction. « Établi roi » convient au registre royal et reste moins administratif que « nommé ».
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: afin que tu exerces le droit et la justice
  rationale: Dans ce contexte royal, עשה désigne l’exercice du gouvernement. « Le droit et la justice » maintient les deux notions coordonnées de מִשְׁפָּט et צְדָקָה dans une expression française claire et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin ; sa translittération préserve cette donnée sans lui substituer un titre confessionnel traditionnel.
- issue: Valeur de בְּאַהֲבַת יְהוָה et forme nominale de אַהֲבָה
  choice: Parce que Yahweh aime Israël pour toujours
  alternative: À cause de l’amour éternel de Yahweh pour Israël
  rationale: La lecture causale convient au lien logique entre l’amour de Yahweh et l’établissement du roi. La construction hébraïque emploie toutefois le nom « amour » ; cette nuance légitime est conservée en note plutôt que tranchée silencieusement.
- issue: Portée éthique de מִשְׁפָּט וּצְדָקָה
  choice: le droit et la justice
  alternative: la justice et la droiture
  rationale: La traduction choisie met en avant la responsabilité judiciaire et le gouvernement juste du roi, tout en maintenant deux termes distincts et sans leur imposer une lecture doctrinale particulière.
translation_notes:
  register: Français international moderne, clair et digne. L’exclamation marque la formule de bénédiction ; le vocabulaire royal demeure accessible sans archaïsme. Le tutoiement correspond au singulier de l’adresse hébraïque.
