translation_notes:
  register: Français international moderne, courant et digne. L’imparfait exprime une pratique commerciale habituelle. La formulation évite le calque peu naturel des deux verbes hébreux de mouvement, mais une note conserve l’idiome d’agence et son référent implicite.
