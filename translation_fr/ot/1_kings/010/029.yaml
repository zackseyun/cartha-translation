  rationale: La révision conserve l’imparfait de pratique commerciale et les choix lexicaux sûrs, tout en rendant explicite que les chars et les chevaux sont exportés vers les rois concernés. Les notes sont ajustées pour respecter plus strictement ce qui est explicite ou implicite dans l’hébreu et pour ne pas surdéterminer le référent de « leur ».
