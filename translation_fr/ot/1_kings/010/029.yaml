base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: fr
  text: On importait d’Égypte un char pour six cents sicles d’argent[a], et un cheval pour cent cinquante. C’est aussi par leur intermédiaire[b] qu’on les exportait vers tous les rois des Hittites et les rois d’Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « six cents d’argent »; l’unité monétaire est sous-entendue. Le sicle était une unité de poids.
    reason: implicit_unit
  - marker: b
    text: 'Littéralement : « par leur main ». Cette expression désigne une médiation ou une agence; le pronom renvoie à des intermédiaires mentionnés dans le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: On importait
  rationale: Les deux verbes de mouvement, littéralement « montait et sortait », décrivent ici l’acheminement commercial depuis l’Égypte. « On importait » restitue naturellement leur valeur contextuelle sans reproduire une redondance obscure en français.
- source_word: מֶרְכָּבָה
  choice: un char
  rationale: Le singulier désigne ici une unité commerciale dont le prix est indiqué.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Rend directement la provenance exprimée par la préposition hébraïque.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: pour six cents sicles d’argent
  rationale: L’hébreu dit littéralement « pour six cents [d’]argent ». L’ajout de « sicles » explicite l’unité de poids monétaire sous-entendue, tandis que « d’argent » conserve le terme explicite כֶּסֶף.
- source_word: וְסוּס
  choice: et un cheval
  rationale: Le mot désigne simplement un cheval; le contexte militaire ne justifie pas de préciser « cheval de guerre » dans le texte.
- source_word: בַּחֲמִשִּׁים וּמֵאָה
  choice: pour cent cinquante
  rationale: Le prix est formulé selon l’ordre naturel des nombres en français. L’unité, déjà donnée pour le char, reste sous-entendue comme en hébreu.
- source_word: וְכֵן
  choice: De même
  rationale: Cette locution relie le prix d’importation à la pratique analogue de fourniture aux autres rois.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: pour tous les rois des Hittites
  rationale: La préposition לְ peut ici marquer les bénéficiaires ou destinataires du commerce. « Pour » convient à la construction avec « exporter » et conserve cette nuance.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: et les rois d’Aram
  rationale: « Aram » conserve le nom propre hébreu, sans le remplacer par l’appellation traditionnelle mais moins exacte « Syrie ».
- source_word: בְּיָדָם
  choice: par leur intermédiaire
  rationale: L’expression signifie littéralement « par leur main » et exprime ici l’agence. La tournure française est claire tout en laissant le référent du pronom aussi implicite que dans le verset.
- source_word: יֹצִאוּ
  choice: on en exportait
  rationale: Le hifil de יצא signifie « faire sortir ». Dans ce contexte commercial, « exporter » en donne le sens; le pronom « en » renvoie naturellement aux chars et chevaux.
