  source_fidelity: 'Le sens commercial des verbes de mouvement est bien rendu par « importait » et « exportait », et les prix, les Hittites et Aram sont correctement représentés. Toutefois, « on en exportait pour » est moins précis : « en » ne renvoie pas clairement aux deux types de marchandises et « pour » peut suggérer une destination prévue plutôt que des destinataires. La place de l’expression d’agence peut aussi être plus nettement liée à l’exportation.'
  naturalness: Le français est globalement moderne et naturel. « C’est aussi par leur intermédiaire qu’on les exportait vers… » est plus fluide et plus explicite dans son articulation que « De même, par leur intermédiaire, on en exportait pour… ».
  terminology: '« Char », « sicle », « Hittites » et « Aram » conviennent. La note sur le sicle doit éviter de présenter « unités » comme un terme présent dans l’hébreu : l’unité est sous-entendue.'
