source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הַ/מֶּ֔לֶךְ אֱמֶת֙ הָיָ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר שָׁמַ֖עְתִּי בְּ/אַרְצִ֑/י עַל דְּבָרֶ֖י/ךָ וְ/עַל חָכְמָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/006.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: fr
  text: 'Alors elle dit au roi : « Ce que j’avais entendu dire dans mon pays au sujet de tes paroles[a] et de ta sagesse était vrai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes affaires » ou « tes réalisations ». Le terme hébreu traduit par « paroles » peut désigner plus largement ce qui concerne le roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors elle dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: אֶל־הַמֶּלֶךְ
  choice: au roi
  rationale: Rend directement la préposition et le nom défini.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: Ce que … était vrai
  rationale: Dans cette proposition, אֱמֶת a une valeur prédicative. La tournure « ce que j’avais entendu dire … était vrai » restitue naturellement en français l’idée d’un rapport véridique sans imposer à דָּבָר le sens étroit de « parole ».
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: que j’avais entendu dire
  rationale: Le plus-que-parfait situe ce qu’elle avait entendu avant sa visite, tandis que « entendu dire » exprime idiomatiquement un renseignement reçu.
- source_word: בְּאַרְצִי
  choice: dans mon pays
  rationale: « Pays » est ici une traduction naturelle de אֶרֶץ avec le suffixe de première personne.
- source_word: עַל־דְּבָרֶיךָ
  choice: au sujet de tes paroles
  rationale: « Paroles » reste proche du pluriel hébreu et convient au contexte de la sagesse de Salomon, tout en laissant en note les sens plus larges possibles de דְּבָרִים.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: et de ta sagesse
  rationale: Traduction directe qui conserve la coordination avec le membre précédent.
