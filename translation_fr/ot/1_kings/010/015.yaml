  register: Français international moderne, fluide et digne. La phrase demeure un fragment syntaxiquement lié au verset précédent, comme dans l’hébreu. Les répétitions commerciales de l’original sont conservées tout en distinguant les négociants itinérants du commerce exercé par les marchands.
