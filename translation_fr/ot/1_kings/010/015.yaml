  variant: modern international French
source:
  edition: WLC
  text: לְ/בַד֙ מֵ/אַנְשֵׁ֣י הַ/תָּרִ֔ים וּ/מִסְחַ֖ר הָ/רֹכְלִ֑ים וְ/כָל מַלְכֵ֥י הָ/עֶ֖רֶב וּ/פַח֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/015.yaml
  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: fr
  text: sans compter ce qui provenait des négociants itinérants[a], du commerce des marchands, de tous les rois d’Arabie[b] et des gouverneurs du pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes qui circulaient ». L’expression hébraïque est difficile et peut désigner plus généralement des commerçants itinérants.
    reason: lexical_alternative
  - marker: b
    text: Ou « de tous les rois des populations mêlées ». Le mot hébreu peut avoir ce sens dans certains contextes, mais « Arabie » paraît mieux convenir ici.
    reason: alternative_reading
  - marker: c
    text: Ou « des gouverneurs provinciaux » ; le terme désigne des administrateurs régionaux et peut aussi être rendu par « satrapes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: sans compter
  rationale: Cette expression introduit ici des revenus qui s’ajoutent au total indiqué précédemment. « Sans compter » est naturel en français et rend clairement cette addition.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: ce qui provenait des négociants itinérants
  rationale: L’expression hébraïque est difficile. Dans ce contexte commercial, תָּרִים désigne probablement des personnes qui circulent, vraisemblablement pour commercer. L’ajout explicatif « ce qui provenait » relie naturellement cette source au revenu mentionné dans le contexte.
- source_word: וּמִסְחַר
  choice: du commerce
  rationale: מִסְחָר désigne l’activité ou le trafic commercial. « Commerce » convient au contexte économique et reste distinct des personnes qui l’exercent.
- source_word: הָרֹכְלִים
  choice: des marchands
  rationale: רֹכְלִים désigne des personnes qui font du commerce. « Marchands » est clair et assez large, sans le sens plus étroit que pourrait suggérer « colporteurs ».
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: de tous les rois d’Arabie
  rationale: Dans cette liste géopolitique, עֶרֶב désigne vraisemblablement l’Arabie ou les populations arabes. « Rois d’Arabie » est la formulation géographique la plus naturelle en français.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: et des gouverneurs du pays
  rationale: פַחוֹת désigne des administrateurs régionaux placés sous une autorité supérieure. « Gouverneurs » est précis sans imposer le terme historiquement plus spécifique « satrapes ».
theological_decisions: []
