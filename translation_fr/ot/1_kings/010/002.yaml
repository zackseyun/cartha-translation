  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: fr
  text: Elle arriva à Jérusalem avec une suite très imposante[a], et avec des chameaux chargés d’aromates, d’une très grande quantité d’or et de pierres précieuses. Elle vint trouver Salomon et lui parla de tout ce qu’elle avait dans le cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un entourage très nombreux » ; plus littéralement, « avec une force ou des richesses très considérables ». Le mot hébreu חַיִל peut désigner la richesse, la force ou un groupe important de personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: avec une suite très imposante
  rationale: חַיִל peut désigner la force, les richesses ou un groupe nombreux. Dans le contexte du voyage d’une reine, « suite » évoque naturellement les personnes et les moyens qui l’accompagnent, tandis que « très imposante » rend l’intensité de כָּבֵד מְאֹד sans donner au cortège un caractère exclusivement militaire.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: des chameaux chargés d’aromates
  rationale: Le participe נֹשְׂאִים décrit ce que transportent les chameaux. « Chargés de » est une formulation française naturelle et fait ressortir l’importance de la cargaison. « Aromates » convient au commerce de produits précieux désigné ici par בְּשָׂמִים.
- source_word: וְזָהָב רַב מְאֹד
  choice: d’une très grande quantité d’or
  rationale: Cette formulation restitue clairement l’intensification quantitative de רַב מְאֹד dans un français courant et digne.
- source_word: וְאֶבֶן יְקָרָה
  choice: et de pierres précieuses
  rationale: Le singulier hébreu אֶבֶן peut avoir ici une valeur collective. Le pluriel est idiomatique en français dans cette énumération de biens précieux.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: Elle vint trouver Salomon
  rationale: La répétition de וַתָּבֹא signale une nouvelle étape après l’arrivée à Jérusalem. « Vint trouver » conserve ce mouvement vers Salomon sans répétition française pesante.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: et lui parla
  rationale: אֵלָיו indique que Salomon est le destinataire de ses paroles. « Lui parla » est direct et n’impose pas au texte l’idée d’un échange réciproque explicite.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: de tout ce qu’elle avait dans le cœur
  rationale: La traduction conserve l’image hébraïque du cœur comme siège des pensées, préoccupations et intentions. Elle préserve ainsi la portée de l’expression sans la réduire aux seules questions qu’elle avait en tête.
theological_decisions: []
