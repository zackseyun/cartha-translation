base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: fr
  text: Car le roi avait en mer une flotte de Tarsis[a], avec la flotte d’Hiram. Une fois tous les trois ans, la flotte de Tarsis arrivait, chargée d’or et d’argent, d’ivoire, de singes et de paons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « flotte de Tarsis » peut désigner des navires qui se rendaient à Tarsis ou, plus généralement, des navires de haute mer destinés au commerce lointain.
    reason: L’expression hébraïque est susceptible de plusieurs interprétations géographiques ou techniques.
  - marker: b
    text: L’identification exacte du mot hébreu traduit par « paons » est incertaine ; il pourrait désigner une autre espèce animale exotique.
    reason: Le terme תֻכִּיִּים est rare et son sens zoologique précis reste discuté.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: une flotte de Tarsis
  rationale: אֳנִי est un nom collectif désignant une flotte. « De Tarsis » conserve l’expression hébraïque sans décider si elle indique la destination, l’origine ou un type de navires adaptés aux voyages lointains.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: une fois tous les trois ans
  rationale: Rend directement la périodicité exprimée par l’hébreu, dans un français naturel.
- source_word: שֶׁנְהַבִּים
  choice: ivoire
  rationale: Le terme, morphologiquement pluriel, désigne l’ivoire ou des défenses d’éléphant; « ivoire » est ici l’appellation commerciale française la plus naturelle.
- source_word: קֹפִים
  choice: singes
  rationale: Le mot désigne des singes; ce terme général évite de préciser sans preuve une espèce particulière.
- source_word: תֻכִּיִּים
  choice: paons
  rationale: « Paons » est l’identification traditionnelle et probable, mais le mot rare demeure incertain; cette incertitude est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La structure répétitive du verset est conservée, ainsi que le collectif « flotte ». « Arrivait » traduit תָּבוֹא sans ajouter explicitement l’idée d’un retour.
