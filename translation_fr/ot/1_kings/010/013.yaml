  text: וְ/הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה נָתַ֣ן לְ/מַֽלְכַּת שְׁבָ֗א אֶת כָּל חֶפְצָ/הּ֙ אֲשֶׁ֣ר שָׁאָ֔לָה מִ/לְּ/בַד֙ אֲשֶׁ֣ר נָֽתַן לָ֔/הּ כְּ/יַ֖ד הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/תֵּ֛פֶן וַ/תֵּ֥לֶךְ לְ/אַרְצָ֖/הּ הִ֥יא וַ/עֲבָדֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: fr
  text: Le roi Salomon donna à la reine de Saba tout ce qu’elle désirait, tout ce qu’elle avait demandé, en plus de ce qu’il lui donna selon les moyens du roi Salomon[a]. Puis elle s’en retourna dans son pays, elle et ses serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la main du roi Salomon », expression pouvant évoquer ses moyens, son pouvoir ou sa générosité.'
    reason: L’expression hébraïque est imagée et admet plusieurs nuances proches que le texte français ne peut toutes conserver.
lexical_decisions:
- source_word: נָתַן
  choice: donna
  rationale: Le verbe courant « donner » convient naturellement aux deux occurrences et n’ajoute aucune nuance absente de l’hébreu.
- source_word: מַלְכַּת שְׁבָא
  choice: la reine de Saba
  rationale: Rendu français traditionnel et transparent du titre suivi du nom géographique.
- source_word: כָּל חֶפְצָהּ
  choice: tout ce qu’elle désirait
  rationale: חֵפֶץ peut désigner le désir ou ce qui est désiré ; cette formulation française exprime naturellement les deux dimensions.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: tout ce qu’elle avait demandé
  rationale: שׁאל signifie ici demander ou solliciter. Le plus-que-parfait situe naturellement sa demande avant le don de Salomon.
- source_word: מִלְּבַד
  choice: en plus de
  rationale: Dans ce contexte, la préposition marque l’addition plutôt que l’exclusion.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: selon les moyens du roi Salomon
  rationale: Littéralement « selon la main du roi Salomon » ; l’expression évoque ce qui était en son pouvoir ou à la mesure de ses ressources, avec une possible connotation de générosité.
- source_word: וַתֵּפֶן וַתֵּלֶךְ לְאַרְצָהּ
  choice: elle s’en retourna dans son pays
  rationale: Cette tournure française restitue naturellement le mouvement de départ et de retour exprimé par les deux verbes hébreux, sans la lourdeur de « elle se tourna et alla ».
- source_word: הִיא וַעֲבָדֶיהָ
  choice: elle et ses serviteurs
  rationale: Le terme עֲבָדִים désigne ici les membres de sa suite en position de service ; « serviteurs » reste l’équivalent direct sans préciser davantage leur statut.
theological_decisions:
- issue: Sens de l’expression כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: selon les moyens du roi Salomon
  alternative: avec une générosité digne du roi Salomon
  rationale: Le choix retenu conserve l’idée de capacité ou de ressources contenue dans l’image de la « main », sans réduire l’expression à la seule générosité. Une note fournit la forme littérale et signale l’étendue sémantique.
- issue: Statut des עֲבָדֶיהָ de la reine
  choice: ses serviteurs
  alternative: les gens de sa suite
  rationale: Le contexte ne permet pas de déterminer plus précisément leur statut social. Le terme direct « serviteurs » préserve cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « tout ce que » et celle du nom de Salomon reflètent l’insistance et la structure du texte hébreu. La conclusion « elle et ses serviteurs » conserve l’emphase du pronom indépendant.
