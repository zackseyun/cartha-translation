base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/003.yaml
  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: fr
  text: Salomon répondit à toutes ses questions[a] ; il n’y eut rien de caché au roi qu’il ne lui fît connaître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Salomon lui fit connaître toutes ses paroles », ou « toutes ses affaires ». Dans le contexte, il s’agit des réponses apportées aux questions de la reine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: répondit
  rationale: Le verbe signifie couramment « dire, déclarer, faire connaître », mais le contexte immédiat présente les propos de la reine comme des questions difficiles auxquelles Salomon répond. « Répondit » exprime naturellement cette valeur contextuelle.
- source_word: דְּבָרֶיהָ
  choice: toutes ses questions
  rationale: דבר peut désigner des paroles, des affaires ou des choses. Ici, puisque la reine met Salomon à l’épreuve par des questions difficiles, « ses questions » constitue la précision contextuelle la plus naturelle, tout en signalant en note la formulation plus littérale.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם
  choice: il n’y eut rien de caché
  rationale: Cette tournure conserve l’image hébraïque de ce qui demeure caché tout en étant idiomatique en français.
- source_word: מִן־הַמֶּלֶךְ
  choice: pour le roi
  rationale: Avec l’idée passive de ce qui est caché, מן indique que rien n’échappait au roi. « Caché pour le roi » est intelligible et évite l’ambiguïté moderne de « caché au roi », qui pourrait suggérer qu’on lui dissimulait volontairement quelque chose.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: qu’il ne lui expliqua
  rationale: Le second emploi de נגד désigne la communication à la reine de ce que le roi savait. « Expliqua » évite une répétition lourde et rend la nuance d’élucidation impliquée par les questions difficiles.
