  source_fidelity: 'La première proposition rend correctement la valeur contextuelle de וַיַּגֶּד et de דְּבָרֶיהָ : Salomon répond aux questions de la reine. La seconde doit exprimer plus directement que rien n’était caché au roi et qu’il le communiqua à la reine. « Pour le roi » affaiblit et dénature légèrement la relation exprimée par מִן־הַמֶּלֶךְ.'
  naturalness: « Caché pour le roi » n’est pas une tournure naturelle dans ce sens en français moderne. « Caché au roi » est l’expression idiomatique appropriée. Le subjonctif imparfait dans la relative négative conserve un registre narratif biblique soigné sans être obscur.
