source:
  edition: WLC
  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: fr
  text: 'les mets de sa table, la disposition de ses serviteurs, le service de ses officiers et leurs vêtements, ses échansons, ainsi que l’holocauste qu’il offrait dans la maison de Yahweh[a] : elle en eut le souffle coupé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la montée par laquelle il se rendait à la maison de Yahweh », expression pouvant désigner l’escalier ou le cortège par lequel il y montait.'
    reason: La vocalisation massorétique donne « son holocauste », mais les consonnes permettent une lecture liée à la montée, appuyée par le passage parallèle de 2 Chroniques 9.4.
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: les mets de sa table
  rationale: מַאֲכָל désigne la nourriture ou les provisions. « Les mets de sa table » conserve l’image concrète tout en convenant au cadre royal.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: la disposition de ses serviteurs
  rationale: מוֹשָׁב peut désigner la place, la manière de siéger ou l’agencement. « Disposition » évoque ici l’organisation ordonnée de la cour sans limiter indûment le sens aux sièges.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: le service de ses officiers
  rationale: מַעֲמָד évoque leur station ou leur présence officielle, et מְשָׁרְתִים des personnes chargées du service royal. « Le service de ses officiers » exprime leur fonction officielle et les distingue des serviteurs mentionnés juste avant.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: leurs vêtements
  rationale: Traduction directe et naturelle du terme désignant les habits ou la tenue.
- source_word: מַשְׁקָיו
  choice: ses échansons
  rationale: Dans un contexte royal, le mot désigne vraisemblablement les hommes chargés de servir les boissons. « Échansons » est le terme français précis pour cette fonction de cour.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: l’holocauste qu’il offrait dans la maison de Yahweh
  rationale: La vocalisation massorétique עֹלָתוֹ indique l’holocauste. Le verbe יַעֲלֶה peut signifier faire monter, donc offrir, un sacrifice. L’autre lecture possible, liée à la montée vers le sanctuaire, est conservée en note.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » reproduit directement l’expression hébraïque, dont le référent est le temple, et Yahweh rend le nom divin personnel.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: elle en eut le souffle coupé
  rationale: L’expression hébraïque dit littéralement qu’il ne resta plus de souffle en elle. Cette tournure française naturelle conserve l’image du souffle et exprime son saisissement sans l’expliquer davantage.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom divin personnel. « Yahweh » le représente directement plutôt que de le remplacer par un titre.
- issue: Sens de עֹלָתוֹ dans la liste
  choice: l’holocauste qu’il offrait dans la maison de Yahweh
  alternative: la montée par laquelle il se rendait à la maison de Yahweh
  rationale: Le texte massorétique vocalisé soutient « son holocauste », tandis que les consonnes et le parallèle de 2 Chroniques 9.4 ont suscité la lecture « sa montée ». Le texte principal suit la vocalisation de la WLC et la note maintient l’alternative réelle.
translation_notes:
  register: Français international actuel, digne et lisible. Le vocabulaire de cour reste précis sans archaïsme syntaxique; « échansons », terme spécialisé mais établi, évite une périphrase lourde. La dernière proposition emploie une expression française naturelle qui conserve l’image hébraïque du souffle.
