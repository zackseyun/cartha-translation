base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: fr
  text: 'Alors le pharaon lui dit : « Que te manque-t-il auprès de moi, puisque tu cherches à partir pour ton pays ? » Il répondit : « Rien. Mais laisse-moi partir, je t’en prie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une tournure emphatique : littéralement, « tu me renverras assurément ». La construction avec un infinitif absolu et un verbe conjugué intensifie la demande.'
    reason: La formulation française fluide « laisse-moi partir, je t’en prie » ne reproduit pas formellement l’emphase de l’hébreu.
lexical_decisions:
- source_word: כִּי מָה
  choice: Que
  rationale: Dans cette question, כִּי introduit directement la demande d’explication. En français naturel, « Que te manque-t-il… ? » exprime suffisamment la réaction de Pharaon sans ajouter un « mais » peu idiomatique.
- source_word: מָה אַתָּה חָסֵר עִמִּי
  choice: Que te manque-t-il auprès de moi
  rationale: חָסֵר exprime le fait de manquer de quelque chose, et עִמִּי situe cette éventuelle insuffisance dans la relation et le séjour auprès de Pharaon.
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: pour que tu cherches
  rationale: La tournure française exprime le lien circonstanciel entre l’absence de manque et le désir de partir. הִנֵּה attire l’attention sur la situation présente, sans devoir être rendu séparément par « voici ».
- source_word: לָלֶכֶת אֶל אַרְצֶךָ
  choice: à partir dans ton pays
  rationale: הלך signifie ici aller ou partir, non explicitement « retourner ». « Dans ton pays » rend naturellement אֶל אַרְצֶךָ dans ce contexte.
- source_word: לֹא
  choice: Rien
  rationale: 'La négation isolée répond elliptiquement à la question : rien ne manque à Hadad.'
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: laisse-moi partir, je t’en prie
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la demande. Cette formulation transmet en français une supplication insistante tout en gardant le sens de permission ou de congé.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct. « Le pharaon » suit l’usage français du titre commun, et « auprès de moi » conserve la dimension relationnelle de l’hébreu.
