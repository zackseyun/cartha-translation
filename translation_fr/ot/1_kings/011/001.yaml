id: 1KI.11.1
reference: 1 Kings 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: fr
  text: 'Le roi Salomon aima beaucoup de femmes étrangères[a], ainsi que la fille du pharaon : des Moabites, des Ammonites, des Édomites, des Sidoniennes et des Hittites.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup d’épouses étrangères ». L’hébreu dit littéralement « beaucoup de femmes étrangères » ; le contexte montre qu’il s’agissait de femmes que Salomon avait prises comme épouses ou compagnes.
    reason: 'Alternative lexicale : conserver dans le texte le sens formel de נָשִׁים tout en signalant la portée matrimoniale indiquée par le contexte.'
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: Le roi Salomon
  rationale: Le titre et le nom sont rendus directement. Le וְ narratif n’exige pas ici un marqueur français explicite tel que « Or » ou « Alors ».
- source_word: אָהַב
  choice: aima
  rationale: Le verbe signifie normalement « aimer ». Le passé simple convient au registre narratif biblique moderne et conserve la force du terme sans l’atténuer.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: beaucoup de femmes étrangères
  rationale: 'Cette formulation suit les trois éléments hébreux : « femmes », « étrangères » et « beaucoup ». En français, « femmes » peut aussi évoquer des épouses selon le contexte, ce qui conserve utilement l’ouverture lexicale de l’hébreu.'
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: ainsi que la fille du pharaon
  rationale: « Ainsi que » exprime l’ajout marqué par וְאֶת sans décider plus que la syntaxe si la fille du pharaon est simplement ajoutée ou explicitement comprise dans la catégorie précédente.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: des Moabites, des Ammonites, des Édomites, des Sidoniennes et des Hittites
  rationale: Les gentilés féminins français usuels rendent précisément les peuples ou origines énumérés; « Sidoniennes » maintient la référence spécifique à Sidon.
theological_decisions:
- issue: Faut-il préciser « femmes » ou « épouses » ?
  choice: femmes
  alternative: épouses
  rationale: נָשִׁים signifie ici littéralement « femmes ». Le contexte matrimonial est réel, mais il ne faut pas imposer dans le texte principal une précision plus étroite que celle de l’hébreu.
- issue: Rapport de la fille du pharaon avec les femmes étrangères
  choice: coordination additive exprimée par « ainsi que »
  alternative: inclusion explicite par « notamment » ou « parmi lesquelles »
  rationale: La construction hébraïque ajoute la fille du pharaon comme objet du verbe. « Ainsi que » respecte ce lien tout en évitant de trancher artificiellement la portée catégorielle exacte de la coordination.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif littéraire sans archaïsme marqué. Les gentilés féminins évitent de répéter « femmes » tout en restant immédiatement compréhensibles.
