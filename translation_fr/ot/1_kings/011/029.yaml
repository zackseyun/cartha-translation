  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: fr
  text: À cette époque, Jéroboam sortit de Jérusalem, et le prophète Ahija, de Silo, le rencontra en chemin. Il s’était enveloppé dans un manteau neuf, et tous deux étaient seuls dans le champ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: À cette époque
  rationale: Cette formule introduit naturellement la scène et son cadre temporel en français moderne, sans reproduire lourdement la tournure existentielle hébraïque.
- source_word: יָצָא מִירוּשָׁלָם
  choice: sortit de Jérusalem
  rationale: « Sortir de » conserve le mouvement exprimé par יָצָא tout en restant idiomatique.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: le rencontra
  rationale: מצא signifie fondamentalement « trouver », mais décrit ici une rencontre sur le chemin ; « rencontra » est naturel en français et convient au contexte.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: Le prophète Ahija, de Silo
  rationale: Le gentilé הַשִּׁילֹנִי est rendu clairement par « de Silo » ; la fonction de prophète est conservée en apposition naturelle.
- source_word: בַּדֶּרֶךְ
  choice: en chemin
  rationale: Cette expression française courante rend avec concision le lieu de la rencontre.
- source_word: וְהוּא מִתְכַּסֶּה
  choice: Il s’était enveloppé
  rationale: Le plus-que-parfait rend l’état de fond au moment de la rencontre, tandis que la forme pronominale conserve la valeur réfléchie du hitpael. Le pronom maintient l’ambiguïté possible de l’hébreu quant à son antécédent.
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: dans un manteau neuf
  rationale: שַׂלְמָה désigne un vêtement, notamment un vêtement extérieur ; « manteau » prépare naturellement le geste symbolique du verset suivant.
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: tous deux étaient seuls
  rationale: La formulation restitue avec naturel l’insistance sur l’absence de toute autre personne.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: « Campagne » convient au cadre extérieur et isolé sans supposer nécessairement une parcelle cultivée ; « champ » demeure une possibilité plus littérale.
theological_decisions:
- issue: Identité de la personne portant le manteau neuf
  choice: Conserver le pronom « Il »
  alternative: Expliciter « Ahija » ou « Jéroboam »
  rationale: Le pronom hébreu peut grammaticalement être rattaché à l’un ou l’autre personnage, même si Ahija est le référent le plus immédiat. La traduction ne tranche donc pas une ambiguïté que le texte ne résout pas explicitement.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont légèrement segmentées pour la lisibilité. Les noms propres suivent les formes françaises courantes « Jéroboam », « Ahija » et « Silo ».
