source:
  edition: WLC
  text: מִן הַ/גּוֹיִ֗ם אֲשֶׁ֣ר אָֽמַר יְהוָה֩ אֶל בְּנֵ֨י יִשְׂרָאֵ֜ל לֹֽא תָבֹ֣אוּ בָ/הֶ֗ם וְ/הֵם֙ לֹא יָבֹ֣אוּ בָ/כֶ֔ם אָכֵן֙ יַטּ֣וּ אֶת לְבַבְ/כֶ֔ם אַחֲרֵ֖י אֱלֹהֵי/הֶ֑ם בָּ/הֶ֛ם דָּבַ֥ק שְׁלֹמֹ֖ה לְ/אַהֲבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: fr
  text: 'd’entre les nations au sujet desquelles Yahvé avait dit aux fils d’Israël[a] : « Vous n’irez pas parmi elles, et elles ne viendront pas parmi vous. Assurément, elles détourneront votre cœur vers leurs dieux. » C’est à elles que Salomon s’attacha par amour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans ce contexte, le sens est plus explicitement : « Vous ne vous unirez pas à elles par mariage, et elles ne s’uniront pas à vous. » L’hébreu dit plus littéralement : « Vous n’irez pas parmi elles, et elles ne viendront pas parmi vous. »'
    reason: Précise le sens matrimonial contextuel tout en signalant la formulation plus générale du texte hébreu.
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: parmi les nations
  rationale: Le verset dépend syntaxiquement de la mention des femmes étrangères au verset précédent. « Parmi les nations » restitue naturellement la provenance exprimée par מִן tout en conservant גּוֹיִם par « nations ».
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: au sujet desquelles Yahvé avait dit
  rationale: La relative se rapporte aux nations; le plus-que-parfait situe naturellement la parole divine avant l’action de Salomon. Le nom divin est translittéré « Yahvé ».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Cette formulation conserve l’expression hébraïque et sa forme masculine collective, sans effacer son caractère traditionnel.
- source_word: לֹא תָבֹאוּ בָהֶם וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: Vous n’irez pas parmi elles, et elles ne viendront pas parmi vous
  rationale: La formulation garde le parallélisme et l’expression générale de l’hébreu. Le contexte matrimonial est explicité en note plutôt qu’introduit directement dans le texte.
- source_word: אָכֵן
  choice: Assurément
  rationale: Ce terme exprime ici une forte certitude et introduit la raison de l’interdiction.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: elles détourneront votre cœur
  rationale: Le hiphil de נטה indique qu’elles feront dévier le cœur. « Détourner » rend clairement le changement d’orientation impliqué par la suite de la phrase.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: vers leurs dieux
  rationale: Littéralement « après leurs dieux », l’expression désigne l’orientation religieuse vers eux. « Vers » rend cette image idiomatiquement en français sans ajouter explicitement le verbe « suivre ».
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה
  choice: C’est à elles que Salomon s’attacha
  rationale: La construction détachée « C’est à elles » conserve la reprise emphatique de בָּהֶם. Dans le contexte immédiat, le pronom vise les femmes issues des nations mentionnées.
- source_word: לְאַהֲבָה
  choice: par amour
  rationale: La locution exprime la motivation ou la manière de l’attachement de Salomon tout en maintenant le champ lexical de l’amour.
theological_decisions:
- issue: Expliciter ou non l’interdiction des mariages mixtes dans le texte principal
  choice: Conserver l’expression générale « aller parmi elles / venir parmi vous »
  alternative: « Vous ne vous marierez pas avec elles, et elles ne se marieront pas avec vous »
  rationale: Le contexte concerne bien les unions matrimoniales, mais l’hébreu emploie le verbe בוא avec la préposition ב et ne nomme pas directement le mariage. Le texte principal préserve cette formulation, tandis que la note en précise le sens contextuel.
- issue: Référent des pronoms féminins en français
  choice: Employer « elles » en accord avec « nations », tout en laissant le contexte renvoyer aux femmes étrangères
  alternative: Rendre explicitement « ces femmes »
  rationale: L’hébreu emploie des pronoms masculins accordés avec גּוֹיִם, mais le contexte vise les femmes issues de ces peuples. En français, « elles » suit grammaticalement « nations » sans surinterpréter le référent dans le corps du verset.
- issue: Rendre l’orientation du cœur après les dieux étrangers
  choice: « détourneront votre cœur vers leurs dieux »
  alternative: « inclineront votre cœur à suivre leurs dieux »
  rationale: « Détourner » exprime le mouvement d’éloignement implicite dans le contexte sans préciser de quoi le cœur est détourné; « vers leurs dieux » maintient la direction indiquée par אַחֲרֵי.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le lien avec le verset précédent, puisque le fragment initial complète la mention des femmes étrangères. Le parallélisme de la parole divine et l’emphase finale sur l’attachement de Salomon sont maintenus.
