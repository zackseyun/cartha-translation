  text: וַ/יִּקְבֹּ֤ץ עָלָי/ו֙ אֲנָשִׁ֔ים וַ/יְהִ֣י שַׂר גְּד֔וּד בַּ/הֲרֹ֥ג דָּוִ֖ד אֹתָ֑/ם וַ/יֵּלְכ֤וּ דַמֶּ֨שֶׂק֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַֽ/יִּמְלְכ֖וּ בְּ/דַמָּֽשֶׂק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: fr
  text: Il rassembla des hommes autour de lui et devint le chef d’une bande lorsque David les tua. Ils allèrent à Damas[a], s’y établirent et régnèrent à Damas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans toute la seconde moitié du verset, les verbes hébreux sont au pluriel : « ils allèrent… s’établirent… régnèrent ». Certaines traductions les mettent au singulier (« il »), parce que le contexte se concentre sur Rezôn.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: Il rassembla des hommes autour de lui
  rationale: Le verbe קבץ avec עַל et un suffixe pronominal exprime ici le rassemblement de partisans autour de soi. Cette tournure est naturelle en français et conserve l’image spatiale de l’hébreu.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Dans ce contexte militaire, le masculin pluriel désigne des hommes qui rejoignent une troupe; « des hommes » est donc plus précis que « des gens ».
- source_word: שַׂר גְּדוּד
  choice: le chef d’une bande
  rationale: שַׂר désigne un chef ou commandant, tandis que גְּדוּד peut désigner une troupe ou bande armée. « Chef d’une bande » reste neutre et n’ajoute pas explicitement l’idée de pillage.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: lorsque David les tua
  rationale: La préposition בְּ avec l’infinitif construit marque ici une circonstance temporelle. Le pronom objet pluriel est conservé sans préciser davantage son antécédent, qui demeure quelque peu tendu dans le récit.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: Ils allèrent à Damas
  rationale: La traduction garde le verbe au pluriel tel qu’il figure dans le texte massorétique et rend naturellement le mouvement vers Damas.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: s’y établirent
  rationale: ישב peut signifier habiter ou s’établir. Dans le contexte d’une arrivée à Damas, « s’y établirent » exprime clairement l’installation.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: et régnèrent à Damas
  rationale: Le qal de מלך signifie régner ou être roi. Le pluriel du texte hébreu est maintenu malgré l’attention portée à Rezôn dans le contexte.
theological_decisions:
- issue: Verbes au pluriel dans les dernières propositions, alors que le récit environnant se concentre sur Rezôn
  choice: 'Conserver le pluriel : « Ils allèrent… s’y établirent et régnèrent »'
  alternative: 'Harmoniser au singulier : « Il alla… s’y établit et régna »'
  rationale: Le texte massorétique emploie trois formes verbales au pluriel. Les conserver respecte la donnée textuelle et laisse subsister la tension narrative sans l’aplanir par interprétation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste concise; « bande » évite de présenter ce groupe comme une unité militaire régulière tout en n’ajoutant pas la nuance explicite de pillards.
