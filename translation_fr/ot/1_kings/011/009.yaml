id: 1KI.11.9
reference: 1 Kings 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: fr
  text: Yahweh se mit en colère contre Salomon, parce que son cœur s’était détourné de Yahweh, le Dieu d’Israël, qui lui était apparu deux fois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: se mit en colère
  rationale: Le verbe à cette forme présente la manifestation ou l’entrée dans la colère. « Se mit en colère » en rend naturellement la force sans l’intensifier en « entra en fureur ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel porté par le tétragramme, au lieu de le remplacer par un titre.
- source_word: בִּשְׁלֹמֹה
  choice: contre Salomon
  rationale: Avec un verbe exprimant la colère, la préposition בְּ désigne ici la personne qui en est l’objet ; « contre » est idiomatique en français.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit explicitement la cause de la colère de Yahweh.
- source_word: נָטָה לְבָבוֹ
  choice: son cœur s’était détourné
  rationale: Cette formulation conserve l’image hébraïque du cœur tout en exprimant clairement l’éloignement et la rupture d’attachement.
- source_word: מֵעִם
  choice: de
  rationale: La préposition marque ici l’éloignement relationnel ; le verbe « se détourner de » en exprime naturellement le sens.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et usuelle de la construction hébraïque, qui maintient l’identification de Yahweh au Dieu d’Israël.
- source_word: הַנִּרְאָה אֵלָיו
  choice: qui lui était apparu
  rationale: Le participe défini est rendu par une proposition relative se rapportant à Yahweh, le Dieu d’Israël ; le plus-que-parfait situe ces apparitions avant la colère racontée.
- source_word: פַּעֲמָיִם
  choice: deux fois
  rationale: Équivalent français naturel de la forme duelle hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte emploie directement le nom divin. « Yahweh » le préserve comme nom personnel sans lui substituer un titre.
- issue: Langage anthropopathique de la colère divine
  choice: se mit en colère
  alternative: fut en colère / entra en fureur
  rationale: La traduction conserve sans l’atténuer l’attribution explicite de la colère à Yahweh, tout en évitant une intensification que le verbe n’impose pas.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle ; l’image du cœur et le nom divin sont conservés.
