base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: fr
  text: Mais à son fils, je donnerai une tribu, afin que David, mon serviteur, ait toujours une lampe[a] devant moi à Jérusalem, la ville que j’ai choisie pour moi-même afin d’y placer mon nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une lumière ». En hébreu, la « lampe » représente ici la continuité de la lignée de David ou la permanence de sa royauté.
    reason: Signaler l’autre traduction possible et expliquer brièvement la portée de la métaphore dynastique.
lexical_decisions:
- source_word: וְלִבְנוֹ
  choice: Mais à son fils
  rationale: Dans le contexte du partage du royaume, la conjonction marque ici un contraste avec ce qui précède; « Mais » le rend naturellement en français.
- source_word: שֵׁבֶט אֶחָד
  choice: une tribu
  rationale: Dans le contexte de la division du royaume, שֵׁבֶט désigne une unité tribale et politique, non un sceptre.
- source_word: לְמַעַן הֱיוֹת
  choice: afin que… ait
  rationale: Cette construction exprime le but; cette formulation française en conserve clairement la valeur finale.
- source_word: נִיר
  choice: lampe
  rationale: « Lampe » conserve l’image concrète qui évoque ici la continuité de la lignée ou de la présence royale davidique.
- source_word: לְדָוִיד עַבְדִּי
  choice: David, mon serviteur
  rationale: Cette apposition naturelle et digne conserve à la fois le nom propre et le titre relationnel.
- source_word: כָּל הַיָּמִים
  choice: toujours
  rationale: L’adverbe exprime naturellement en français la continuité indiquée par l’idiome hébreu.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Ce rendu transparent préserve l’idiome de la présence divine sans l’expliciter excessivement.
- source_word: בָּחַרְתִּי לִי
  choice: j’ai choisie pour moi-même
  rationale: Le passé composé convient à l’effet présent du choix accompli, tandis que « pour moi-même » conserve le datif לִי.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: afin d’y établir mon nom
  rationale: « Établir mon nom » reste proche de la formule théologique du texte tout en étant plus idiomatique en français moderne que « mettre mon nom »; « y » rend le repère locatif שָׁם.
theological_decisions:
- issue: Métaphore dynastique de נִיר
  choice: Conserver « lampe » comme image de la continuité davidique
  alternative: « lumière », ou expliciter « une lignée durable »
  rationale: Le texte emploie une métaphore concrète. La conserver laisse percevoir la théologie dynastique sans remplacer l’image par son interprétation.
- issue: Théologie du nom dans לָשׂוּם שְׁמִי שָׁם
  choice: Conserver la formule « établir mon nom »
  alternative: « établir ma présence » ou « être adoré là »
  rationale: La mention du « nom » est une formule théologique importante. Elle ne doit pas être réduite à une interprétation de la présence ou du culte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de l’hébreu tout en évitant les tournures artificielles. La virgule appositive dans « David, mon serviteur » clarifie le titre.
