  text: וַ/יֹּ֨אמֶר֙ לְ/יָֽרָבְעָ֔ם קַח לְ/ךָ֖ עֲשָׂרָ֣ה קְרָעִ֑ים כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י קֹרֵ֤עַ אֶת הַ/מַּמְלָכָה֙ מִ/יַּ֣ד שְׁלֹמֹ֔ה וְ/נָתַתִּ֣י לְ/ךָ֔ אֵ֖ת עֲשָׂרָ֥ה הַ/שְּׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: fr
  text: 'Il dit à Jéroboam : « Prends dix morceaux[a], car voici ce que dit Yahweh, le Dieu d’Israël : “Regarde, j’arrache le royaume de la main de Salomon et je te donnerai dix tribus.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dix morceaux déchirés ». Le nom hébreu désigne des morceaux produits par un déchirement, en accord avec le geste symbolique d’Ahija qui déchire le vêtement.
    reason: Alternative lexicale précisant le lien entre le nom employé et l’action symbolique.
lexical_decisions:
- source_word: קַח לְךָ
  choice: Prends pour toi
  rationale: L’impératif signifie « prends », tandis que לְךָ ajoute une nuance personnelle que « pour toi » conserve sans alourdir excessivement la phrase.
- source_word: קְרָעִים
  choice: morceaux
  rationale: Issu de la racine « déchirer », le nom désigne les morceaux produits par le déchirement du vêtement. « Morceaux » est le terme français le plus naturel dans ce contexte; la note explicite la nuance.
- source_word: כִּי כֹה אָמַר
  choice: car voici ce que dit
  rationale: Cette formulation restitue la formule prophétique de manière actuelle et intelligible, sans l’archaïsme de « ainsi parle ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Formulation française naturelle du groupe construit qui identifie Yahweh comme Dieu d’Israël.
- source_word: הִנְנִי
  choice: Regarde,
  rationale: L’interpellation attire l’attention sur l’action divine imminente ou présentée comme déjà en cours; « Regarde » en garde la vivacité dans un français moderne.
- source_word: קֹרֵעַ
  choice: j’arrache
  rationale: Le participe présente l’action prophétique avec une force actuelle et saisissante. « J’arrache » convient aussi au retrait violent d’un royaume détenu par un roi.
- source_word: הַמַּמְלָכָה
  choice: le royaume
  rationale: Équivalent direct et usuel du nom hébreu dans ce contexte politique.
- source_word: מִיַּד שְׁלֹמֹה
  choice: de la main de Salomon
  rationale: La traduction conserve l’image hébraïque de la main comme siège du pouvoir ou de la possession.
- source_word: וְנָתַתִּי לְךָ
  choice: et je te donnerai
  rationale: Le parfait consécutif poursuit l’annonce prophétique; le futur français en exprime naturellement le sens.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: dix tribus
  rationale: Après un nombre, le français omet naturellement l’article; il s’agit des dix unités tribales destinées à Jéroboam.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Aspect de l’action divine en קֹרֵעַ
  choice: j’arrache
  alternative: je vais arracher
  rationale: Le présent conserve la présentation vive de l’action dans l’oracle, sans trancher trop précisément entre action en cours et imminence prophétique.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est rendue sans archaïsme, tandis que l’image de « la main de Salomon » et la vivacité du présent sont conservées.
