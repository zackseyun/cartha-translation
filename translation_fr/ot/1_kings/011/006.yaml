id: 1KI.11.6
reference: 1 Kings 11:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: fr
  text: Salomon fit ce qui est mal aux yeux de Yahweh et ne suivit pas pleinement Yahweh[a], comme l’avait fait David, son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « ne s’attacha pas entièrement à suivre Yahweh ». L’expression hébraïque évoque une loyauté ou une obéissance qui n’est pas entière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה introduit ici la conduite de Salomon. « Fit » s’intègre naturellement à l’expression française « faire ce qui est mal ».
- source_word: הָרַע
  choice: ce qui est mal
  rationale: L’adjectif substantivé désigne ici le mal moral. « Ce qui est mal » est clair, actuel et plus naturel en français que « le mal » après le verbe « faire » dans cette phrase.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette formulation conserve la métaphore évaluative de l’hébreu tout en restant idiomatique en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre de substitution.
- source_word: מִלֵּא אַחֲרֵי
  choice: suivit pleinement
  rationale: L’expression idiomatique indique que Salomon n’a pas suivi Yahweh de manière complète. Cette traduction garde l’idée de loyauté ou d’obéissance incomplète sans la réduire à un sentiment intérieur.
- source_word: כְּדָוִד אָבִיו
  choice: comme l’avait fait David, son père
  rationale: Le verbe est sous-entendu en hébreu et repris explicitement en français pour rendre la comparaison naturelle et non équivoque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » préserve sa fonction de nom propre et évite de le remplacer par un titre.
- issue: Portée de וְלֹא מִלֵּא אַחֲרֵי יְהוָה
  choice: ne suivit pas pleinement Yahweh
  alternative: ne fut pas entièrement attaché à Yahweh
  rationale: La proposition souligne une fidélité incomplète. La traduction retenue préserve cette nuance sans affirmer, sur la seule base de cette expression, une rupture absolue ni limiter la question à la dévotion intérieure.
translation_notes:
  register: Français international moderne, simple et digne. La métaphore « aux yeux de » est conservée parce qu’elle est naturelle en français. Le passé simple convient au registre narratif biblique, tandis que « comme l’avait fait » explicite sans lourdeur le verbe sous-entendu dans la comparaison.
