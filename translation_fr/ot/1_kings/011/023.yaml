source:
  edition: WLC
  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: fr
  text: Dieu suscita contre lui un adversaire[a], Rezôn, fils d’Éliada, qui s’était enfui d’auprès de Hadadézer, son maître, roi de Tsoba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : satan ; ici, ce nom commun signifie « adversaire » ou « opposant », et non le nom propre Satan.'
    reason: Préciser le sens lexical contextuel et prévenir une lecture démonologique étrangère à ce passage.
lexical_decisions:
- source_word: וַיָּקֶם
  choice: suscita
  rationale: Le hifil de קום exprime ici le fait que Dieu fait surgir un homme comme opposant. « Suscita » est naturel dans un récit historique et conserve l’action divine sans la préciser davantage.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte narratif, le terme désigne le Dieu d’Israël.
- source_word: לוֹ
  choice: contre lui
  rationale: Après « suscita » et avec שָׂטָן comme complément, la préposition ל marque ici la relation hostile envers l’homme visé, à savoir Salomon dans le contexte. « Contre lui » rend explicitement cette valeur contextuelle.
- source_word: שָׂטָן
  choice: un adversaire
  rationale: Le mot est ici un nom commun désignant un opposant humain et politique, non le nom propre « Satan ».
- source_word: רְזוֹן בֶּן אֶלְיָדָע
  choice: Rezôn, fils d’Éliada
  rationale: Le nom personnel est translittéré et la filiation est rendue selon l’usage français courant.
- source_word: אֲשֶׁר בָּרַח
  choice: qui s’était enfui
  rationale: Le plus-que-parfait indique naturellement que cette fuite précède l’action principale du récit.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: de chez son maître Hadadézer
  rationale: מֵאֵת exprime l’éloignement d’une personne. La formulation française « de chez » convient à une fuite hors du service ou de l’entourage d’un maître; l’intégration de אֲדֹנָיו ici lève l’ambiguïté syntaxique.
- source_word: מֶלֶךְ צוֹבָה
  choice: roi de Tsoba
  rationale: La chaîne construite est rendue directement, avec translittération du nom de lieu.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Dans cette relation politique de subordination, « maître » est plus précis que « seigneur » et évite toute confusion avec un titre divin.
theological_decisions:
- issue: Sens de שָׂטָן dans ce contexte
  choice: Nom commun « adversaire »
  alternative: Nom propre « Satan »
  rationale: Le personnage est explicitement Rezôn, un opposant politique humain. Employer le nom propre « Satan » introduirait une identification théologique absente du texte.
- issue: Rôle de Dieu dans l’apparition de l’adversaire
  choice: « Dieu suscita »
  alternative: « Dieu permit qu’apparaisse »
  rationale: Le hifil וַיָּקֶם attribue directement à Dieu le fait de faire surgir cet adversaire. La traduction conserve cette affirmation et sa tension théologique sans l’atténuer en simple permission.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en regroupant naturellement « son maître » avec Hadadézer. Les noms propres suivent une translittération française lisible.
