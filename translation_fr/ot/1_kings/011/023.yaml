    issue: « de chez son maître Hadadézer »
    rationale: Cette expression est idiomatique, mais elle introduit une nuance domestique ou spatiale que le texte hébreu n’exprime pas nécessairement. « s’était enfui d’auprès de Hadadézer, son maître » conserve plus précisément l’idée de fuite loin d’une personne à laquelle Rezôn était subordonné.
