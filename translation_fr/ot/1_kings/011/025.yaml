  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: fr
  text: Il fut un adversaire d’Israël durant tout le règne de Salomon, outre le mal causé par Hadad[a]. Il prit Israël en horreur et régna sur Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique. La relation exacte de cette expression à la phrase principale, ainsi que le verbe sous-entendu à propos de Hadad, demeurent incertains. On peut aussi comprendre : « en plus du mal que Hadad [fit] » ou « sans compter le mal de Hadad ».'
    reason: La construction hébraïque « et le mal que Hadad… » ne contient pas de verbe explicite et son lien syntaxique précis avec la proposition principale est discuté.
lexical_decisions:
- source_word: שָׂטָן
  choice: adversaire
  rationale: Dans ce récit politique, le nom désigne un opposant humain, non Satan comme nom propre.
- source_word: לְיִשְׂרָאֵל
  choice: d’Israël
  rationale: Avec « adversaire », le complément introduit par ל indique naturellement en français le peuple auquel il s’oppose.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: pendant toute la vie de Salomon
  rationale: Cette tournure française naturelle conserve la portée temporelle globale de l’expression hébraïque sans la restreindre explicitement au seul règne.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: outre le mal que causait Hadad
  rationale: « Outre » rend la valeur additive probable de la proposition, tandis que « causait » explicite sobrement le verbe sous-entendu dans la formulation hébraïque elliptique.
- source_word: רָעָה
  choice: mal
  rationale: Ici, le terme désigne le tort ou les malheurs infligés à Israël; « mal » reste concis et conserve une part de l’amplitude sémantique de l’hébreu.
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: Il prit Israël en horreur
  rationale: Cette expression française idiomatique rend la forte aversion exprimée par קוץ et traite Israël comme l’objet de cette aversion.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: régna sur Aram
  rationale: La traduction garde le nom propre Aram plutôt que le terme géographique plus tardif « Syrie » et rend directement le verbe מלך.
theological_decisions:
- issue: שָׂטָן désigne-t-il ici Satan comme être surnaturel ou un adversaire humain?
  choice: un adversaire humain
  alternative: Satan
  rationale: Le contexte présente des opposants politiques à Salomon; le mot est ici un nom commun et ne doit pas recevoir une portée démonologique absente du passage.
translation_notes:
  register: Français international actuel, digne et lisible. « Adversaire », « prit en horreur » et « régna sur Aram » maintiennent la force du récit sans archaïsme marqué; la note signale honnêtement l’ellipse hébraïque.
