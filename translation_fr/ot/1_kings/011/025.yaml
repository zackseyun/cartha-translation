  rationale: La révision maintient le sens politique et la force du texte tout en évitant de faire de « tous les jours de Salomon » une affirmation sur toute sa vie biologique. Elle retire aussi l’imparfait interprétatif de la clause elliptique sur Hadad et fait de la note le lieu approprié pour signaler l’ambiguïté syntaxique.
