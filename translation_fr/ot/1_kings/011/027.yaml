  variant: modern international French
source:
  edition: WLC
  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: fr
  text: 'Voici pourquoi il leva la main contre le roi : Salomon avait construit le Millo[b] et fermé la brèche de la Cité de David, son père[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Son père » désigne David comme père de Salomon.
    reason: clarification
  - marker: b
    text: Le « Millo » était probablement un ouvrage fortifié ou une structure en remblais et en terrasses à Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: voici pourquoi
  rationale: Dans cette construction, le nom signifie littéralement « la chose » ou « l’affaire », mais introduit ici l’explication de l’action de Jéroboam. « Voici pourquoi » rend naturellement cette valeur explicative.
- source_word: הֵרִים יָד
  choice: leva la main contre
  rationale: Cette formulation conserve l’image de l’expression hébraïque tout en restant intelligible en français. Dans le contexte, elle désigne une action hostile ou une révolte, sens signalé en note.
- source_word: בַּמֶּלֶךְ
  choice: contre le roi
  rationale: La préposition désigne la personne visée par l’action hostile. L’hébreu dit simplement « le roi »; Salomon est nommé dans la proposition suivante.
- source_word: הַמִּלּוֹא
  choice: le Millo
  rationale: Le terme paraît désigner un ouvrage architectural ou défensif précis de Jérusalem. La translittération évite de trancher entre des identifications incertaines.
- source_word: סָגַר
  choice: fermé
  rationale: Le verbe signifie fondamentalement « fermer ». Appliqué à une brèche, il évoque le fait de la combler ou de la réparer sans abandonner l’image hébraïque.
- source_word: פֶּרֶץ
  choice: la brèche
  rationale: Dans le contexte des fortifications urbaines, « brèche » désigne précisément une ouverture ou une rupture dans l’enceinte.
- source_word: עִיר דָּוִד
  choice: la Cité de David
  rationale: Il s’agit de la désignation propre du secteur fortifié de Jérusalem associé à David; la majuscule marque ce toponyme consacré.
- source_word: אָבִיו
  choice: son père
  rationale: 'Le suffixe renvoie naturellement à Salomon : David est son père. La proximité syntaxique de « Cité de David » peut toutefois créer en français une légère ambiguïté, que la note clarifie.'
theological_decisions:
- issue: Portée de l’expression « lever la main contre »
  choice: Conserver l’idiome dans le texte et indiquer son sens contextuel en note
  alternative: Traduire directement « se révolta contre »
  rationale: Le maintien de l’image préserve la forme et une part de l’ambiguïté de l’hébreu, tandis que la note communique clairement sa portée hostile sans imposer une paraphrase dans le texte.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe explicative est fluide, l’idiome hébraïque est conservé et le terme topographique incertain « Millo » est translittéré. Tous les marqueurs de notes figurent dans le texte.
