  naturalness: Le français est naturel, moderne et d’un registre approprié. « Je t’arracherai assurément le royaume » rend plus directement le futur emphatique hébreu que « je vais certainement t’arracher ».
  terminology: « Yahweh », « alliance », « prescriptions », « royaume » et « serviteur » conviennent. « Prescriptions » est clair et garde une dignité juridique adaptée à חֻקֹּתַי.
