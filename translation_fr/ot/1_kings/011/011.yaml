  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: fr
  text: 'Yahweh dit donc à Salomon : « Puisque tu as agi ainsi[a] et que tu n’as pas respecté mon alliance ni les prescriptions que je t’avais ordonnées, je t’arracherai assurément le royaume et le donnerai à ton serviteur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « cela a été avec toi ». L’expression hébraïque est elliptique et peut renvoyer à la conduite ou à la disposition persistante de Salomon.'
    reason: Conserver la formulation inhabituelle et la relative ambiguïté de l’expression hébraïque tout en donnant un texte principal naturel en français.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: Introduit naturellement en français la cause du jugement annoncé, avec la même valeur causale que l’hébreu.
- source_word: הָיְתָה זֹּאת עִמָּךְ
  choice: tu as agi ainsi
  rationale: Cette formulation française rend de façon intelligible l’expression hébraïque elliptique, qui renvoie à la conduite persistante de Salomon; une note conserve sa forme plus littérale et son ambiguïté.
- source_word: שָׁמַרְתָּ
  choice: respecté
  rationale: Convient aux deux compléments, l’alliance et les prescriptions, tout en exprimant l’idée d’observer fidèlement.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: Rend directement le terme juridique et théologique בְּרִית.
- source_word: חֻקֹּתַי
  choice: les prescriptions
  rationale: Terme actuel et digne pour les règles établies par Dieu, plus immédiatement compréhensible que « statuts » dans ce contexte.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: que je t’avais données
  rationale: Formulation idiomatique française qui conserve l’idée de prescriptions imposées à Salomon; le plus-que-parfait situe naturellement ces ordres avant sa désobéissance.
- source_word: קָרֹעַ אֶקְרַע
  choice: je vais certainement t’arracher
  rationale: « Certainement » restitue l’intensification produite par l’infinitif absolu, tandis que « arracher » conserve l’image vigoureuse de la déchirure et de la dépossession.
- source_word: הַמַּמְלָכָה
  choice: le royaume
  rationale: Désigne ici le royaume placé sous l’autorité de Salomon.
- source_word: מֵעָלֶיךָ
  choice: t’arracher le royaume
  rationale: La construction française avec pronom indirect exprime naturellement le retrait du royaume à Salomon.
- source_word: לְעַבְדֶּךָ
  choice: à ton serviteur
  rationale: Dans le contexte royal, עֶבֶד désigne un subordonné de Salomon; « serviteur » garde cette portée sans imposer le sens plus étroit d’esclave.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » en préserve la fonction de nom propre.
- issue: Interprétation de הָיְתָה זֹּאת עִמָּךְ
  choice: 'une référence à la conduite de Salomon : « tu as agi ainsi »'
  alternative: « cela a été avec toi » ou « telle a été ta disposition »
  rationale: Le contexte immédiat présente l’apostasie de Salomon comme le motif du jugement. La traduction principale rend ce sens contextuel sans préciser davantage la nature de sa conduite, tandis que la note signale la formulation hébraïque inhabituelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours divin reste direct et solennel sans archaïsmes; le tutoiement correspond à l’adresse singulière de Yahweh à Salomon.
