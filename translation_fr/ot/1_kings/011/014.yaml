id: 1KI.11.14
reference: 1 Kings 11:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֨קֶם יְהוָ֤ה שָׂטָן֙ לִ/שְׁלֹמֹ֔ה אֵ֖ת הֲדַ֣ד הָ/אֲדֹמִ֑י מִ/זֶּ֧רַע הַ/מֶּ֛לֶךְ ה֖וּא בֶּ/אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: fr
  text: Alors Yahvé suscita contre Salomon un adversaire[a], Hadad l’Édomite. Il était de descendance royale en Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : satan ; ici, ce mot signifie « adversaire » ou « opposant », et non le nom propre Satan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: suscita
  rationale: Le hifil de קום exprime ici l’action de faire surgir quelqu’un. « Suscita » rend naturellement l’initiative divine sans suggérer une nomination officielle.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: שָׂטָן
  choice: un adversaire
  rationale: Dans ce contexte, le mot est un nom commun désignant un opposant humain, identifié comme Hadad, et non le nom propre Satan.
- source_word: לִשְׁלֹמֹה
  choice: contre Salomon
  rationale: Avec שָׂטָן, la préposition ל indique la personne à laquelle l’adversaire s’oppose.
- source_word: הֲדַד הָאֲדֹמִי
  choice: Hadad l’Édomite
  rationale: Cette formulation conserve le nom propre et rend naturellement le gentilé hébreu en français.
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: de descendance royale
  rationale: Littéralement « de la semence du roi », l’expression désigne l’appartenance à la lignée royale. « De descendance royale » en conserve clairement le sens généalogique.
- source_word: הוּא בֶּאֱדוֹם
  choice: en Édom
  rationale: La proposition rattache la lignée royale à Édom. La phrase française maintient cette indication sans surcharger la syntaxe.
theological_decisions:
- issue: Sens de שָׂטָן dans ce verset
  choice: 'Nom commun : « un adversaire »'
  alternative: 'Nom propre : « Satan »'
  rationale: La syntaxe identifie Hadad comme l’adversaire suscité contre Salomon. Le passage parle donc d’un opposant humain et politique, sans identifier celui-ci au diable.
translation_notes:
  register: Français international moderne, clair et digne. « Suscita » convient au registre biblique sans être archaïque. Deux phrases permettent d’éviter une ponctuation lourde tout en préservant l’apposition et la proposition finale du texte hébreu.
