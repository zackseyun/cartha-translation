source:
  edition: WLC
  text: וְ/יָרָבְעָם֩ בֶּן נְבָ֨ט אֶפְרָתִ֜י מִן הַ/צְּרֵדָ֗ה וְ/שֵׁ֤ם אִמּ/וֹ֙ צְרוּעָה֙ אִשָּׁ֣ה אַלְמָנָ֔ה עֶ֖בֶד לִ/שְׁלֹמֹ֑ה וַ/יָּ֥רֶם יָ֖ד בַּ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: fr
  text: Jéroboam, fils de Nebath, un Éphraïmite[a] de Tseréda — sa mère s’appelait Tseroua et était veuve —, était serviteur de Salomon. Il leva la main contre le roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Éphrathite » ; ici, le sens le plus probable est « Éphraïmite ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Il se révolta contre le roi ». Littéralement : « Il leva la main contre le roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: un Éphraïmite
  rationale: Dans ce contexte du livre des Rois, le terme désigne très probablement l’appartenance à la tribu d’Éphraïm. La possibilité « Éphrathite » est conservée en note.
- source_word: הַצְּרֵדָה
  choice: Tseréda
  rationale: Translittération française usuelle du nom de lieu.
- source_word: צְרוּעָה
  choice: Tseroua
  rationale: Translittération française naturelle du nom propre.
- source_word: אִשָּׁה אַלְמָנָה
  choice: était veuve
  rationale: Le français naturel exprime pleinement le sens des deux mots hébreux (« une femme, une veuve ») par « était veuve », sans redondance artificielle.
- source_word: עֶבֶד
  choice: serviteur
  rationale: Le mot peut désigner un esclave, un serviteur ou un agent royal. Ici, « serviteur » maintient sa largeur sémantique et convient au cadre administratif développé dans la suite du récit.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: Il leva la main contre le roi
  rationale: Cette formulation conserve l’image hébraïque, qui peut désigner une action hostile ou une révolte ouverte, sans en réduire prématurément le sens.
- source_word: וְ
  choice: absence de connecteur explicite
  rationale: Le waw initial assure ici la continuité narrative. En français, celle-ci est naturellement portée par l’enchaînement du récit, sans qu’un « alors » temporel soit nécessaire.
theological_decisions:
- issue: Nature exacte de l’action de Jéroboam contre le roi
  choice: conserver l’expression imagée « leva la main contre »
  alternative: « se révolta contre »
  rationale: L’idiome implique l’hostilité ou la rébellion, mais la traduction littérale intelligible préserve l’ambiguïté quant à la forme précise de l’opposition.
translation_notes:
  register: Français international moderne, digne et narratif. Les noms propres suivent des formes françaises transparentes. L’incise sur la mère de Jéroboam reproduit la structure du verset sans alourdir la phrase ; une nouvelle phrase avant l’action finale améliore la lisibilité tout en maintenant la coordination narrative.
