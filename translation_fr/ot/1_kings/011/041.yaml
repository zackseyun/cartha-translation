  text: וְ/יֶ֨תֶר דִּבְרֵ֧י שְׁלֹמֹ֛ה וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/חָכְמָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתֻבִ֔ים עַל סֵ֖פֶר דִּבְרֵ֥י שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: fr
  text: Le reste des actes de Salomon, tout ce qu’il a fait et sa sagesse, tout cela n’est-il pas écrit dans le Livre des actes de Salomon[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Livre des chroniques de Salomon ». Le titre hébreu contient littéralement « les paroles ou les affaires de Salomon », expression qui désigne ici le récit de ses actes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: Le reste des actes de Salomon
  rationale: Dans cette formule de conclusion d’un règne, דִּבְרֵי désigne les affaires ou les actes du roi plutôt que ses seules paroles. « Le reste des actes » rend naturellement l’expression sans ajouter de marqueur temporel absent de l’hébreu.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: tout ce qu’il a fait
  rationale: Cette formulation directe conserve le sens large du verbe עשה sans préciser indûment la nature ou la réussite de ses réalisations.
- source_word: וְחָכְמָתוֹ
  choice: et sa sagesse
  rationale: Traduction directe du nom muni du suffixe possessif ; la sagesse de Salomon reste une catégorie distincte et marquante du bilan.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: cela n’est-il pas écrit
  rationale: La question rhétorique, qui appelle une réponse affirmative, est conservée. Le pronom récapitulatif neutre « cela » permet une formulation française fluide pour l’ensemble des éléments précédents.
- source_word: עַל סֵפֶר
  choice: dans le Livre
  rationale: Bien que la préposition signifie littéralement « sur », « écrit dans le livre » est l’expression idiomatique française. La majuscule signale ici le titre du document cité.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: le Livre des actes de Salomon
  rationale: Le titre désigne vraisemblablement un document relatant le règne de Salomon. « Actes » reste proche de l’usage historiographique de דִּבְרֵי et évite de confondre ce document avec le livre biblique des Chroniques.
