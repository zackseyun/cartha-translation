source:
  edition: WLC
  text: וְ/כֵ֣ן עָשָׂ֔ה לְ/כָל נָשָׁ֖י/ו הַ/נָּכְרִיּ֑וֹת מַקְטִיר֥וֹת וּֽ/מְזַבְּח֖וֹת לֵ/אלֹהֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/008.yaml
  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: fr
  text: Il fit de même pour toutes ses femmes étrangères[a], qui brûlaient de l’encens et offraient des sacrifices à leurs dieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu laisse implicite l’action précise de Salomon et renvoie à ce qui est rapporté au verset précédent.
    reason: Précision sur l’ellipse du texte source.
lexical_decisions:
- source_word: וְכֵן
  choice: Il fit de même
  rationale: Cette expression marque la répétition de l’action rapportée au verset précédent. « De même » est naturel en français et conserve le renvoi contextuel.
- source_word: עָשָׂה
  choice: fit
  rationale: Le verbe signifie largement « faire ». La traduction garde l’action implicite, comme en hébreu, sans ajouter explicitement qu’il construisit des lieux de culte.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: pour toutes ses femmes étrangères
  rationale: La préposition exprime ici ce que Salomon fit en faveur de chacune d’elles. « Femmes étrangères » désigne clairement ses épouses originaires d’autres peuples.
- source_word: מַקְטִירוֹת
  choice: qui brûlaient de l’encens
  rationale: Dans ce contexte cultuel, le participe hiphil de קטר désigne l’action de faire fumer ou de brûler de l’encens. L’imparfait français rend naturellement l’activité habituelle ou continue exprimée par le participe.
- source_word: וּמְזַבְּחוֹת
  choice: et offraient des sacrifices
  rationale: Le participe de זבח décrit l’activité sacrificielle. « Offrir des sacrifices » est une formulation française claire et idiomatique.
- source_word: לֵאלֹהֵיהֶן
  choice: à leurs dieux
  rationale: Le pluriel muni d’un suffixe féminin pluriel renvoie aux divinités des femmes étrangères. La minuscule distingue ces dieux du Dieu d’Israël.
theological_decisions:
- issue: Référent des participes מַקְטִירוֹת וּמְזַבְּחוֹת
  choice: Les femmes étrangères sont celles qui brûlaient l’encens et offraient les sacrifices.
  alternative: Les participes pourraient décrire plus largement le culte pratiqué dans les sanctuaires aménagés par Salomon.
  rationale: Les participes féminins pluriels s’accordent directement avec « ses femmes étrangères ». La traduction conserve donc cette relation grammaticale sans attribuer ces actes à Salomon.
- issue: Ellipse de l’action accomplie par Salomon
  choice: L’action reste implicite dans « fit de même » et se comprend à partir du verset précédent.
  alternative: 'Expliciter : « Il construisit des lieux de culte pour toutes ses femmes étrangères. »'
  rationale: Le texte hébreu ne répète pas l’objet du verbe « faire ». Maintenir l’ellipse respecte la formulation source et évite d’insérer dans ce verset des précisions provenant uniquement du contexte.
translation_notes:
  register: Français moderne, courant et digne. L’imparfait rend la valeur durative ou habituelle des participes hébreux, tandis que « fit de même » préserve le renvoi elliptique au verset précédent.
