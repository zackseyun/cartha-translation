  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: fr
  text: Je ferai souffrir la descendance de David à cause de cela, mais pas pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pas tous les jours », c’est-à-dire pas indéfiniment.'
    reason: La note préserve la formulation hébraïque tout en évitant que son rendu littéral français soit compris comme « pas chaque jour ».
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: Je ferai souffrir
  rationale: Le piel de ענה exprime ici le fait d’infliger une souffrance ou une humiliation. « Je ferai souffrir » rend clairement le jugement annoncé sans lui donner le sens social plus précis d’« opprimer » ni la possible nuance bénéfique d’« humilier ».
- source_word: זֶרַע דָּוִד
  choice: la descendance de David
  rationale: זֶרַע est un singulier collectif désignant ici la lignée de David. « La descendance » est naturel en français et conserve cette valeur collective.
- source_word: לְמַעַן זֹאת
  choice: à cause de cela
  rationale: La locution indique la cause du jugement et renvoie aux faits précédemment évoqués. « À cause de cela » est précis et idiomatique.
- source_word: אַךְ
  choice: mais
  rationale: La particule introduit ici une restriction qui limite la durée du jugement. « Mais » exprime naturellement ce contraste.
- source_word: לֹא כָל הַיָּמִים
  choice: pas pour toujours
  rationale: L’expression signifie littéralement « pas tous les jours », mais indique idiomatiquement que l’affliction ne durera pas indéfiniment. « Pas pour toujours » en donne le sens naturel, tandis que la note conserve l’image hébraïque.
theological_decisions:
- issue: Durée du jugement contre la lignée de David
  choice: Le jugement est réel, mais il ne durera pas toujours.
  alternative: Rendre littéralement l’expression par « pas tous les jours ».
  rationale: L’hébreu limite explicitement la durée de l’affliction sans préciser quand ni comment elle prendra fin. La traduction maintient ainsi la tension entre jugement et préservation de la lignée, sans développer davantage l’implication théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Je ferai souffrir » évite un archaïsme inutile, tandis que « la descendance de David » convient au registre biblique sans être technique.
