source:
  edition: WLC
  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: fr
  text: Salomon chercha alors à faire mourir Jéroboam[a]. Mais Jéroboam se leva et s’enfuit en Égypte, auprès de Shishak, roi d’Égypte. Il resta en Égypte jusqu’à la mort de Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chercha à tuer Jéroboam ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: chercha
  rationale: Le verbe בקש exprime ici une volonté active ou une tentative, sans affirmer que le projet a abouti. « Chercha à » conserve cette nuance.
- source_word: לְהָמִית
  choice: à faire mourir
  rationale: L’infinitif hiphil de מות est causatif. « Faire mourir » en restitue directement la valeur sans préciser, au-delà du texte, la forme envisagée de la mise à mort.
- source_word: וַיָּקָם
  choice: se leva
  rationale: קום marque dans le récit le passage à une action décisive. « Se leva » garde l’expression hébraïque tout en restant intelligible en français narratif.
- source_word: וַיִּבְרַח
  choice: s’enfuit
  rationale: ברח désigne la fuite devant un danger; « s’enfuit » est naturel et précis dans ce contexte.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: en Égypte, auprès de Shishak, roi d’Égypte
  rationale: Le premier nom indique la destination, et אֶל introduit ensuite la personne auprès de laquelle Jéroboam se réfugie. « Auprès de » évite en français l’étrange impression qu’il fuit vers le roi comme vers un lieu, tout en conservant les deux indications.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: Il resta en Égypte
  rationale: Littéralement, la construction signifie « il fut en Égypte », mais avec « jusqu’à », elle décrit naturellement un séjour qui se prolonge. « Resta » rend ce sens contextuel en français courant.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: jusqu’à la mort de Salomon
  rationale: Cette formulation reproduit naturellement la construction nominale hébraïque et n’ajoute aucune précision interprétative.
theological_decisions: []
translation_notes:
  register: 'Français moderne, digne et narratif. La syntaxe reste proche de l’hébreu, avec quelques ajustements idiomatiques : « auprès de » pour la relation à Shishak et « resta » pour היה suivi de la limite temporelle. Le nom שִׁישַׁק est transcrit « Shishak », conformément à la forme du texte massorétique.'
