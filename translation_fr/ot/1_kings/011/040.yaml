  source_fidelity: 'Le rendu suit fidèlement la progression du texte hébreu : l’intention de Salomon n’est pas présentée comme accomplie (« chercha à »), Jéroboam se lève, fuit en Égypte auprès de Shishak, puis y demeure jusqu’à la mort de Salomon. « Faire mourir » restitue de manière recevable la valeur causative de l’hiphil בלי ajouter de modalité judiciaire précise.'
