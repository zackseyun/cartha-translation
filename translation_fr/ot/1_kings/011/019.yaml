id: 1KI.11.19
reference: 1 Kings 11:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּמְצָא֙ הֲדַ֥ד חֵ֛ן בְּ/עֵינֵ֥י פַרְעֹ֖ה מְאֹ֑ד וַ/יִּתֶּן ל֤/וֹ אִשָּׁה֙ אֶת אֲח֣וֹת אִשְׁתּ֔/וֹ אֲח֖וֹת תַּחְפְּנֵ֥יס הַ/גְּבִירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: fr
  text: Hadad trouva une grande faveur aux yeux du pharaon. Celui-ci lui donna pour femme la sœur de sa propre femme[a], la sœur de Tahpenès, la reine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le possessif renvoie très probablement au pharaon. Il pourrait, mais moins vraisemblablement, renvoyer à Hadad.
    reason: alternative_reading
  - marker: b
    text: Littéralement « la grande dame »; ce titre désigne une femme de très haut rang à la cour, parfois la reine mère.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: trouva une grande faveur aux yeux de
  rationale: Cette formulation conserve l’image de l’idiome hébreu tout en restant compréhensible en français moderne; « grande » rend l’intensification exprimée par מְאֹד.
- source_word: פַרְעֹה
  choice: le pharaon
  rationale: Forme française courante du titre royal égyptien; l’article est naturel en français dans ce contexte narratif.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: lui donna pour femme
  rationale: La construction indique que le pharaon donne cette femme à Hadad en mariage; la formulation française est concise et explicite.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: la sœur de sa propre femme
  rationale: Le possessif renvoie très probablement au pharaon. « Sa propre femme » rend ce référent plus clair dans le texte, tandis qu’une note conserve l’autre possibilité grammaticale.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: la sœur de Tahpenès
  rationale: L’apposition précise l’identité de la femme donnée à Hadad en la rattachant à Tahpenès.
- source_word: תַּחְפְּנֵיס
  choice: Tahpenès
  rationale: Transcription française claire du nom hébreu.
- source_word: הַגְּבִירָה
  choice: la reine
  rationale: Le terme désigne une femme de tout premier rang à la cour. Dans ce contexte égyptien, où Tahpenès vient d’être présentée comme la femme du pharaon, « la reine » est plus naturel et contextuellement mieux fondé que « la reine mère »; une note signale toutefois la portée moins précise du titre hébreu.
theological_decisions:
- issue: Référent du possessif dans « la sœur de sa femme »
  choice: 'Le possessif renvoie au pharaon: il donne à Hadad la sœur de sa propre femme.'
  alternative: 'Le possessif pourrait grammaticalement renvoyer à Hadad: le pharaon lui donnerait alors la sœur de la femme de Hadad.'
  rationale: La reprise « la sœur de Tahpenès » et la logique du récit favorisent nettement le pharaon comme référent, sans rendre l’autre analyse grammaticale absolument impossible.
- issue: Sens du titre הַגְּבִירָה
  choice: la reine
  alternative: la grande dame; la dame principale; la reine mère
  rationale: Le mot désigne une haute dignitaire royale et peut, selon le contexte biblique, s’appliquer à une reine mère. Ici, l’identification de Tahpenès comme femme du pharaon favorise « reine », tout en laissant l’étendue exacte du titre incertaine.
translation_notes:
  register: Français international moderne, digne et narratif. L’expression « trouver faveur aux yeux de » maintient la couleur de l’idiome hébreu sans archaïsme excessif. Les ambiguïtés réelles concernant le possessif et le titre de Tahpenès sont conservées dans les notes.
