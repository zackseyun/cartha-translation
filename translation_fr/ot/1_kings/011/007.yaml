  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: fr
  text: Alors Salomon construisit un haut lieu pour Kemosh, l’abomination de Moab, sur la montagne en face de Jérusalem, et pour Molek[a], l’abomination des Ammonites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Milkom » ; la forme hébraïque est traditionnellement lue « Molek », mais certains la rapprochent de Milkom, divinité des Ammonites.
    reason: Lecture alternative liée à l’identification du nom divin dans le contexte ammonite.
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: L’adverbe situe l’action dans la suite du récit. « Alors » en restitue naturellement la progression temporelle.
- source_word: יִבְנֶה
  choice: construisit
  rationale: Malgré sa forme inaccomplie, le verbe, associé à אָז dans ce récit au passé, présente ici l’action suivante. Le passé simple convient au registre narratif soutenu.
- source_word: בָּמָה
  choice: un haut lieu
  rationale: Ce terme désigne un site cultuel, souvent établi sur une hauteur. « Haut lieu » conserve son sens religieux technique sans ajouter d’explication au texte.
- source_word: לִכְמוֹשׁ
  choice: pour Kemosh
  rationale: La préposition indique que le haut lieu est destiné à cette divinité. Le nom propre est translittéré selon une forme française reconnaissable.
- source_word: שִׁקֻּץ מוֹאָב
  choice: l’abomination de Moab
  rationale: שִׁקֻּץ exprime le jugement fortement péjoratif du narrateur sur cette divinité ou son culte. « Abomination » en préserve la force et le parallélisme.
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: sur la montagne qui fait face à Jérusalem
  rationale: La traduction conserve הַר comme « montagne » et rend l’expression spatiale עַל־פְּנֵי sans imposer dans le texte une localisation géographique plus précise.
- source_word: וּלְמֹלֶךְ
  choice: et pour Molek[a]
  rationale: Le texte massorétique vocalisé porte Molek. La possibilité d’un rapprochement avec Milkom est signalée en note plutôt que tranchée silencieusement.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: l’abomination des Ammonites
  rationale: La formulation reprend le parallélisme hébreu avec Kemosh. « Les Ammonites » rend idiomatiquement « les fils d’Ammon » en français.
theological_decisions:
- issue: Désignation péjorative des divinités étrangères
  choice: Traduire שִׁקֻּץ par « abomination » dans les deux occurrences
  alternative: « chose détestable » ou « dieu abominable »
  rationale: Le jugement négatif appartient au texte hébreu lui-même. « Abomination » en conserve la vigueur sans préciser au-delà du texte s’il s’agit de la divinité, de son image ou de son culte.
- issue: Identification de מֹלֶךְ
  choice: Molek dans le texte principal
  alternative: Milkom
  rationale: La vocalisation massorétique soutient « Molek », tandis que le contexte ammonite conduit certains à rapprocher ce nom de Milkom. Le texte principal suit la forme transmise et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient à la narration biblique écrite. Les termes cultuels traditionnels « haut lieu » et « abomination » sont conservés pour leur précision et leur force, tandis que la syntaxe reste claire pour le lecteur contemporain.
