  text: וַ/יִּתְפֹּ֣שׂ אֲחִיָּ֔ה בַּ/שַּׂלְמָ֥ה הַ/חֲדָשָׁ֖ה אֲשֶׁ֣ר עָלָ֑י/ו וַ/יִּ֨קְרָעֶ֔/הָ שְׁנֵ֥ים עָשָׂ֖ר קְרָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/030.yaml
  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: fr
  text: Alors Ahija saisit le manteau neuf qu’il portait et le déchira en douze morceaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: saisit
  rationale: Le verbe exprime l’action concrète de prendre fermement. « Saisit » est naturel et concis en français sans imposer une violence excessive.
- source_word: שַׂלְמָה
  choice: manteau
  rationale: Le nom désigne un vêtement de dessus. « Manteau » est clair en français moderne et convient à l’action de le déchirer.
- source_word: הַחֲדָשָׁה
  choice: neuf
  rationale: L’adjectif signifie directement « nouveau ». Avec un objet fabriqué comme un manteau, « neuf » est le choix idiomatique.
- source_word: אֲשֶׁר עָלָיו
  choice: qui était sur lui
  rationale: Cette formulation reste proche de l’expression hébraïque et préserve l’ambiguïté quant à la personne qui portait le manteau.
- source_word: וַיִּקְרָעֶהָ
  choice: le déchira
  rationale: Le verbe signifie déchirer, et le pronom masculin reprend naturellement « manteau » en français.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: en douze morceaux
  rationale: L’expression décrit le résultat du déchirement. Cette tournure française naturelle conserve le nombre et la portée symbolique du geste.
theological_decisions:
- issue: Référent du pronom dans אֲשֶׁר עָלָיו
  choice: Conserver « qui était sur lui » dans le texte et signaler l’ambiguïté en note.
  alternative: « qu’il portait »
  rationale: L’hébreu ne précise pas sans ambiguïté si le manteau était sur Ahija ou sur Jéroboam. Une traduction plus explicite résoudrait indûment cette ambiguïté narrative.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure simple et concrète, tandis que la note préserve l’ambiguïté réelle du texte hébreu.
