  text: וַ/יִּבְרַ֣ח אֲדַ֡ד הוּא֩ וַ/אֲנָשִׁ֨ים אֲדֹמִיִּ֜ים מֵ/עַבְדֵ֥י אָבִ֛י/ו אִתּ֖/וֹ לָ/ב֣וֹא מִצְרָ֑יִם וַ/הֲדַ֖ד נַ֥עַר קָטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: fr
  text: Hadad s’enfuit en Égypte[a], accompagné de quelques hommes édomites au service de son père. Hadad était un tout jeune garçon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour venir en Égypte ». En hébreu, le verbe « venir » peut être employé là où le français dirait « aller » ou indiquerait simplement la destination.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « un petit garçon » ou « un jeune garçon ». L’expression hébraïque souligne que Hadad était encore très jeune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: s’enfuit
  rationale: Le qal de ברח signifie couramment « fuir » ou « s’enfuir ». La forme pronominale est naturelle en français et convient à une fuite vers l’Égypte.
- source_word: אֲדַד
  choice: Hadad
  rationale: Transcription française usuelle du nom propre.
- source_word: הוּא וַאֲנָשִׁים אֲדֹמִיִּים
  choice: accompagné de quelques Édomites
  rationale: Le pronom indépendant souligne Hadad comme sujet, tandis que les hommes édomites l’accompagnent. Cette formulation restitue naturellement la relation sans reproduire l’apposition hébraïque de manière pesante.
- source_word: מֵעַבְדֵי אָבִיו
  choice: qui étaient au service de son père
  rationale: עֶבֶד peut désigner ici les serviteurs ou membres de la suite du père. « Au service de » convient au contexte sans préciser indûment leur statut social; la tournure et « quelques » rendent la valeur partitive de מִן.
- source_word: אִתּוֹ
  choice: accompagné de
  rationale: La formulation exprime clairement que les Édomites étaient avec Hadad.
- source_word: לָבוֹא מִצְרָיִם
  choice: vers l’Égypte
  rationale: L’infinitif de בוא suivi de la destination indique le but de la fuite. Après « s’enfuit », le français idiomatique emploie naturellement « vers l’Égypte » plutôt qu’un littéral « pour venir en Égypte ».
- source_word: נַעַר קָטָן
  choice: un tout jeune garçon
  rationale: נַעַר désigne un garçon ou un jeune homme, et קָטָן accentue ici son très jeune âge. « Tout jeune garçon » est naturel et préserve cette insistance.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe hébraïque appositive est reformulée pour éviter une phrase lourde, tout en conservant Hadad comme sujet principal, l’origine édomite de ses compagnons, leur appartenance au service de son père et l’insistance finale sur son très jeune âge.
