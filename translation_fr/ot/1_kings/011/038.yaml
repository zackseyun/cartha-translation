    text: Le terme hébreu peut aussi évoquer une maison « solidement établie », « sûre » ou « fidèle ». Ici, la « maison » désigne une dynastie durable.
    reason: Préciser la métaphore dynastique et les nuances de נֶאֱמָן sans présenter « durable » comme une traduction littérale stricte.
  revision_rationale: La révision rétablit l’ouverture connective du texte hébreu, aligne explicitement chacune des trois propositions d’obéissance coordonnées sur la condition initiale, et améliore la comparaison avec David. La note est reformulée pour distinguer la traduction contextuelle de ses alternatives lexicales.
