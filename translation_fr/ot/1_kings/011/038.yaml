  to: Et si tu écoutes tout ce que je te commanderai, si tu marches dans mes voies, si tu fais ce qui est droit à mes yeux en gardant mes prescriptions et mes commandements, comme David, mon serviteur, l’a fait, alors je serai avec toi, je te bâtirai une maison durable[a], comme celle que j’ai bâtie pour David, et je te donnerai Israël.
  rationale: La révision rétablit l’ouverture connective du texte hébreu, aligne explicitement chacune des trois propositions d’obéissance coordonnées sur la condition initiale, et améliore la comparaison avec David. La note est reformulée pour distinguer la traduction contextuelle de ses alternatives lexicales.
