source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: fr
  text: Et si tu écoutes tout ce que je te commanderai, si tu marches dans mes voies, si tu fais ce qui est droit à mes yeux en gardant mes prescriptions et mes commandements, comme David, mon serviteur, l’a fait, alors je serai avec toi, je te bâtirai une maison durable[a], comme celle que j’ai bâtie pour David, et je te donnerai Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi évoquer une maison « solidement établie », « sûre » ou « fidèle ». Ici, la « maison » désigne une dynastie durable.
    reason: Préciser la métaphore dynastique et les nuances de נֶאֱמָן sans présenter « durable » comme une traduction littérale stricte.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: tu écoutes
  rationale: Le verbe שׁמע peut signifier entendre, écouter ou obéir. « Écouter » conserve l’image auditive, tandis que les propositions suivantes explicitent l’obéissance attendue.
- source_word: אֲצַוֶּךָ
  choice: je te commanderai
  rationale: L’imparfait hébreu porte ici naturellement sur les commandements que Dieu donnera; le futur français respecte cette orientation sans atténuer l’autorité du verbe.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: tu marches dans mes voies
  rationale: Cette formulation conserve la métaphore biblique de la conduite comme marche et reste intelligible en français actuel.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: ce qui est droit à mes yeux
  rationale: La traduction préserve l’expression évaluative hébraïque et indique que Dieu est la référence de ce qui est droit.
- source_word: לִשְׁמֹר
  choice: en gardant
  rationale: Le gérondif exprime la manière concrète de faire ce qui est droit.
- source_word: חֻקּוֹתַי
  choice: mes prescriptions
  rationale: « Prescriptions » rend le caractère normatif et juridique du terme tout en restant clair en français moderne.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: Ce terme garde le registre formel de l’alliance et distingue le nom du verbe « commander » employé plus haut.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte royal, עבד est un titre honorable désignant David dans son service envers Dieu; « serviteur » convient mieux que « esclave ».
- source_word: בַיִת נֶאֱמָן
  choice: une maison durable
  rationale: « Maison » conserve la métaphore dynastique, tandis que « durable » rend ici l’idée de solidité, de permanence et de fiabilité portée par נֶאֱמָן.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: je te donnerai Israël
  rationale: Cette formulation directe respecte la construction hébraïque et présente Israël comme ce que Dieu accorde au roi.
theological_decisions:
- issue: Sens de « maison » dans la promesse
  choice: Conserver « maison » dans le texte en lui donnant son sens dynastique
  alternative: Traduire explicitement par « dynastie » ou comprendre un palais matériel
  rationale: La comparaison avec la maison bâtie pour David, dans un contexte de succession royale, vise une lignée dynastique. Garder « maison » préserve l’image biblique et ses échos intertextuels; la note en précise le sens.
- issue: Caractère conditionnel de la promesse
  choice: Rendre explicitement la condition par la série « si… si… alors »
  alternative: Présenter le don comme une promesse inconditionnelle
  rationale: La particule אִם et l’enchaînement des exigences d’obéissance font de la présence divine et de la maison promise une véritable promesse conditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle est clarifiée sans supprimer la répétition hébraïque; les métaphores bibliques « marcher dans mes voies » et « bâtir une maison » sont conservées.
