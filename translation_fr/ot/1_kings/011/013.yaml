id: 1KI.11.13
reference: 1 Kings 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: fr
  text: 'Pourtant[a], je ne déchirerai pas tout le royaume : je donnerai une tribu à ton fils, par égard pour David, mon serviteur, et par égard pour Jérusalem, que j’ai choisie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Seulement, je ne déchirerai pas tout le royaume. »'
    reason: La particule רַק peut être comprise comme une restriction exprimée plus littéralement par « seulement », plutôt que comme l’adversatif « pourtant ».
lexical_decisions:
- source_word: רַק
  choice: Pourtant
  rationale: La particule introduit ici une restriction au jugement annoncé précédemment. « Pourtant » exprime naturellement cette valeur adversative, tandis que « seulement » demeure possible.
- source_word: כָּל הַמַּמְלָכָה
  choice: tout le royaume
  rationale: Cette expression désigne le royaume dans sa totalité et conserve simplement la portée globale de כָּל.
- source_word: אֶקְרָע
  choice: je ne déchirerai pas
  rationale: Le verbe קָרַע signifie littéralement « déchirer ». Ce choix maintient l’image vive du démembrement politique du royaume sans ajouter de complément absent de l’hébreu.
- source_word: שֵׁבֶט אֶחָד
  choice: une tribu
  rationale: Dans le contexte de la division d’Israël, שֵׁבֶט désigne une tribu plutôt qu’un bâton ou un sceptre. L’indéfini français rend naturellement « une seule tribu » sans surcharger la formulation.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: je donnerai une tribu à ton fils
  rationale: « Donner » correspond directement au verbe hébreu et conserve la simplicité de la promesse.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: par égard pour David, mon serviteur
  rationale: לְמַעַן exprime ici le motif ou la considération. « Par égard pour » est idiomatique en français et évite la possible nuance négative de « à cause de ».
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: et par égard pour Jérusalem
  rationale: La répétition de « par égard pour » reproduit le parallélisme et place David et Jérusalem comme deux considérations distinctes.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: que j’ai choisie
  rationale: Le passé composé présente le choix antérieur de Jérusalem comme toujours pertinent; l’accord féminin est requis en français.
theological_decisions:
- issue: Motif de la préservation d’une tribu
  choice: Le texte attribue cette préservation à l’égard de Dieu pour David et pour Jérusalem, la ville qu’il a choisie.
  alternative: Faire dépendre exclusivement cette préservation de l’alliance davidique, ou principalement du temple et de la ville.
  rationale: L’hébreu donne deux motifs parallèles, sans les hiérarchiser ni préciser ici un mécanisme doctrinal plus large. La traduction maintient cette tension et ce parallélisme.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore de la déchirure est conservée; « par égard pour » rend naturellement le double לְמַעַן sans introduire d’interprétation confessionnelle.
