source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: fr
  text: Mais une tribu lui restera[a], par égard pour mon serviteur David et par égard pour Jérusalem, la ville que j’ai choisie parmi toutes les tribus d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « une tribu ». On comprend souvent que Benjamin est rattaché à Juda, notamment en raison de la situation de Jérusalem, mais le texte lui-même dit bien « une tribu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: Mais une tribu
  rationale: שֵׁבֶט désigne ici une unité tribale. La conjonction est rendue par « Mais » pour exprimer le contraste avec le partage du royaume annoncé dans le contexte.
- source_word: יִהְיֶה לּוֹ
  choice: lui restera
  rationale: Littéralement « sera à lui » ; dans le contexte de l’arrachement du royaume, « lui restera » exprime naturellement l’idée de possession conservée.
- source_word: לְמַעַן
  choice: par égard pour
  rationale: Cette expression restitue le motif de l’action divine sans réduire לְמַעַן à une simple relation causale. Sa répétition conserve le parallélisme hébreu.
- source_word: עַבְדִּי דָוִד
  choice: mon serviteur David
  rationale: Formulation française naturelle qui conserve ce titre royal et relationnel.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: Jérusalem, la ville
  rationale: La virgule rend clairement l’apposition hébraïque.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: que j’ai choisie
  rationale: Le passé composé présente le choix comme un acte accompli dont la portée demeure ; le pronom locatif hébreu est intégré idiomatiquement au verbe français.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: parmi toutes les tribus d’Israël
  rationale: Avec le verbe « choisir », « parmi » exprime naturellement la sélection à l’intérieur d’un ensemble.
theological_decisions:
- issue: Tension numérique entre « une tribu » et les passages ou décomptes associant Juda et Benjamin sous Roboam
  choice: Conserver « une tribu », conformément au texte hébreu.
  alternative: Interpréter cette expression comme une métonymie incluant Benjamin dans Juda, ou harmoniser en traduisant « un royaume » ou « deux tribus ».
  rationale: L’hébreu dit explicitement « une tribu ». La traduction préserve cette formulation et laisse à la note l’explication historique ou interprétative possible.
translation_notes:
  register: Français international moderne, clair et digne. « Par égard pour » évite à la fois la lourdeur d’une formulation trop littérale et l’ambiguïté affective possible de « pour l’amour de ». Le parallélisme de la phrase hébraïque est conservé.
