source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: fr
  text: Toutefois, je ne le ferai pas[a] de ton vivant, par égard pour David, ton père ; je l’arracherai des mains de ton fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : je n’arracherai pas le royaume, comme annoncé au verset précédent.'
    reason: cross_reference
  - marker: b
    text: L’hébreu dit littéralement « de la main de ton fils » ; cette expression désigne ce qui se trouve en son pouvoir ou en sa possession.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Toutefois
  rationale: La particule introduit ici une restriction qui tempère l’annonce du jugement formulée au verset précédent. « Toutefois » exprime naturellement cette valeur adversative.
- source_word: בְּיָמֶיךָ
  choice: de ton vivant
  rationale: Littéralement « dans tes jours ». L’expression française « de ton vivant » restitue clairement l’idée que le jugement n’aura pas lieu pendant la vie et le règne de Salomon.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: je ne le ferai pas
  rationale: Le suffixe renvoie à l’action annoncée précédemment, celle d’arracher le royaume. Le pronom « le » conserve cette référence contextuelle sans répéter explicitement l’objet.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: par égard pour David, ton père
  rationale: לְמַעַן indique ici le motif ou la considération accordée à David. « Par égard pour » rend cette nuance plus précisément qu’une simple relation causale.
- source_word: מִיַּד בִּנְךָ
  choice: des mains de ton fils
  rationale: L’hébreu dit littéralement « de la main de ton fils », image qui désigne son pouvoir ou sa possession. Le pluriel « des mains » est l’expression idiomatique naturelle en français tout en conservant l’image.
- source_word: אֶקְרָעֶנָּה
  choice: je l’arracherai
  rationale: Le verbe קָרַע signifie « déchirer, arracher ». Dans ce contexte de retrait du royaume, « arracher » rend à la fois la force de l’image et le transfert de souveraineté.
theological_decisions:
- issue: Nature et report du jugement prononcé contre Salomon
  choice: Le retrait annoncé du royaume est reporté au temps du fils de Salomon, par égard pour David.
  alternative: 'Expliciter dans le corps du verset : « je n’arracherai pas le royaume de ton vivant » puis « je l’arracherai à ton fils ».'
  rationale: L’hébreu laisse l’action et son objet dépendre du contexte précédent. La traduction maintient ce lien implicite, conserve le motif de la considération accordée à David et ne précise pas davantage la nature de cette faveur.
translation_notes:
  register: Français international moderne, digne et accessible. « De ton vivant » et « des mains de » rendent naturellement deux expressions idiomatiques hébraïques, tandis que « arracher » préserve l’image vigoureuse du texte source.
