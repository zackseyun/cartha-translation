  to: 'Quand Hadad apprit en Égypte que David s’était couché avec ses pères[a] et que Joab, le chef de l’armée, était mort, il dit au pharaon : « Laisse-moi partir, afin que j’aille dans mon pays. »'
  rationale: La révision restitue plus exactement la formule hébraïque « se coucher avec ses pères » et évite d’expliciter dans « retourne » une nuance absente de la formulation source. La note conserve l’explication indispensable de l’idiome funéraire.
