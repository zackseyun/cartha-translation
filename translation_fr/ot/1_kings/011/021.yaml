base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: fr
  text: 'Quand Hadad apprit en Égypte que David s’était couché avec ses pères[a] et que Joab, le chef de l’armée, était mort, il dit au pharaon : « Laisse-moi partir, afin que j’aille dans mon pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression hébraïque traditionnelle signifiant « mourir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: apprit
  rationale: Dans ce contexte de nouvelles reçues en Égypte, « apprit » exprime naturellement le sens contextuel de « entendre » sans ajouter d’information.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: s’était couché auprès de ses ancêtres
  rationale: Cette formulation conserve l’image de l’expression funéraire hébraïque tout en indiquant en note son sens idiomatique.
- source_word: מֵת
  choice: était mort
  rationale: Le rendu exprime l’état résultant marqué par la forme hébraïque et s’intègre naturellement à la proposition rapportée.
- source_word: שַׂר הַצָּבָא
  choice: le chef de l’armée
  rationale: « Chef de l’armée » désigne clairement et dignement la fonction militaire de Joab en français courant.
- source_word: שַׁלְּחֵנִי
  choice: Laisse-moi partir
  rationale: Dans une demande adressée au pharaon, cette expression rend naturellement l’impératif demandant l’autorisation d’être libéré ou congédié.
- source_word: וְאֵלֵךְ
  choice: afin que je retourne
  rationale: « Afin que » rend la visée volitive de la forme hébraïque; « retourne » est imposé naturellement par le mouvement vers son propre pays dans ce contexte.
- source_word: אַרְצִי
  choice: mon pays
  rationale: « Pays » rend ici אֶרֶץ de façon idiomatique et le suffixe possessif est directement exprimé par « mon ».
