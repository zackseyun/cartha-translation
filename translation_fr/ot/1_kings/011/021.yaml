review_pass:
  verdict: revise
  source_fidelity: 'La formule funéraire שָׁכַב עִם אֲבֹתָיו est bien reconnue comme un idiome de mort. Toutefois, « auprès de ses ancêtres » modifie les deux éléments de l’image : עִם signifie « avec », et « pères » ne doit pas être élargi à « ancêtres ». « Retourne » explicite un retour que le cohortatif « que j’aille » ne formule pas directement.'
  naturalness: Le français est globalement clair et d’un registre narratif moderne. « S’était couché avec ses pères », soutenu par une note, conserve l’idiome tout en restant recevable dans une traduction biblique moderne. « Afin que j’aille dans mon pays » est fluide et plus proche du mouvement exprimé.
  terminology: « Pharaon », « chef de l’armée », « Laisse-moi partir » et « mon pays » conviennent. Le nom Hadad est correctement rendu.
  issues:
  - severity: medium
    issue: L’expression « s’était couché auprès de ses ancêtres » ne rend pas exactement l’idiome hébreu.
    rationale: Le texte porte littéralement « s’était couché avec ses pères ». « Auprès de » remplace « avec », et « ancêtres » élargit « pères »; ces changements atténuent la formule source.
  - severity: low
    issue: « Que je retourne » ajoute explicitement l’idée de retour.
    rationale: Le contexte rend un retour plausible, mais וְאֵלֵךְ signifie simplement « que j’aille ». Il est préférable de ne pas ajouter cette nuance dans le texte principal.
  revised_text: 'Quand Hadad apprit en Égypte que David s’était couché avec ses pères[a] et que Joab, le chef de l’armée, était mort, il dit au pharaon : « Laisse-moi partir, afin que j’aille dans mon pays. »'
  revised_footnotes:
