- from: Il arriva[a], lorsque David était en Édom[b] et que Joab, chef de l’armée, monta enterrer ceux qui avaient été tués, que celui-ci abattit tous les mâles en Édom —
  to: Il arriva[a], lorsque David était en Édom[b], lorsque Joab, chef de l’armée, monta enterrer ceux qui avaient été tués, qu’il abattit tous les mâles en Édom —
  rationale: La révision rétablit les deux propositions temporelles de l’hébreu et remplace le démonstratif « celui-ci » par le pronom narratif neutre « il ». Le sens, le registre et les ancres de notes sont autrement conservés.
