source:
  edition: WLC
  text: וַ/יְהִ֗י בִּֽ/הְי֤וֹת דָּוִד֙ אֶת אֱד֔וֹם בַּ/עֲל֗וֹת יוֹאָב֙ שַׂ֣ר הַ/צָּבָ֔א לְ/קַבֵּ֖ר אֶת הַ/חֲלָלִ֑ים וַ/יַּ֥ךְ כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: fr
  text: Il arriva[a], lorsque David était en Édom[b], lorsque Joab, chef de l’armée, monta enterrer ceux qui avaient été tués, qu’il abattit tous les mâles en Édom —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et il arriva ». L’hébreu emploie une formule narrative courante qui introduit ici une explication de l’arrière-plan.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « lorsque David était avec Édom ». Dans ce contexte, l’expression renvoie probablement à la présence ou à la campagne de David en Édom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva
  rationale: Cette formule narrative courante introduit ici une explication rétrospective. « Il arriva » en conserve la fonction et la dignité sans lourdeur archaïque.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: lorsque David était en Édom
  rationale: La construction forme une proposition temporelle. L’expression hébraïque avec אֶת est inhabituelle; le contexte militaire favorise la présence ou la campagne de David en Édom, tout en justifiant une note qui conserve l’ambiguïté formelle.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: que Joab … monta
  rationale: L’infinitif construit précédé de בְּ exprime ici le temps. Le passé simple s’intègre naturellement au récit français et conserve le verbe de mouvement.
- source_word: שַׂר הַצָּבָא
  choice: chef de l’armée
  rationale: Titre militaire clair, actuel et fidèle, sans coloration archaïque.
- source_word: לְקַבֵּר
  choice: enterrer
  rationale: L’infinitif exprime le but de la montée de Joab.
- source_word: הַחֲלָלִים
  choice: ceux qui avaient été tués
  rationale: Le terme désigne les personnes tuées, notamment au combat. Cette formulation garde la nuance violente sans recourir au substantif littéraire « les tués ».
- source_word: וַיַּךְ
  choice: celui-ci abattit
  rationale: Dans ce contexte militaire, נכה indique une action létale. « Abattit » en rend directement la force; « celui-ci » clarifie que Joab est le sujet grammatical le plus proche sans ajouter un nom absent de l’hébreu.
- source_word: כָּל זָכָר
  choice: tous les mâles
  rationale: זָכָר désigne spécifiquement les êtres de sexe masculin. Le pluriel français rend naturellement la portée collective de l’expression.
- source_word: בֶּאֱדוֹם
  choice: en Édom
  rationale: La préposition est rendue dans son sens locatif le plus direct, sans élargir explicitement la portée à tout le territoire.
theological_decisions:
- issue: Rendre sans atténuation ni amplification un récit de violence militaire
  choice: Conserver l’affirmation directe selon laquelle tous les mâles en Édom furent abattus
  alternative: Paraphraser par « vainquit les Édomites » ou expliciter une extermination totale
  rationale: Le texte rapporte une violence extrême. La traduction en garde la force sans l’adoucir, mais n’ajoute aucune explication morale, doctrinale ou historique absente du verset.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la structure circonstancielle de l’hébreu tout en identifiant naturellement Joab comme sujet de l’action finale. Le tiret final est maintenu, car le verset se poursuit syntaxiquement au verset suivant.
