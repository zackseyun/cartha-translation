translation_notes:
  register: Français international moderne, narratif et digne. « Maison du pharaon » préserve l’ambiguïté voulue entre le palais comme lieu et la maisonnée royale comme milieu social. La répétition hébraïque est légèrement allégée par « y » dans la dernière proposition.
