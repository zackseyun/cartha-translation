base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: fr
  text: La sœur de Tahpenès lui donna un fils, Guenoubath[a]. Tahpenès le sevra dans la maison du pharaon[b], et Guenoubath y vivait parmi les fils du pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre formulation possible : « La sœur de Tahpenès mit au monde pour lui son fils, Guenoubath. » L’ordre des mots hébreux permet aussi de nommer d’abord l’enfant.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe « sevrer » signifie ici amener l’enfant au stade où il ne dépend plus de l’allaitement ; Guenoubath continua ensuite à vivre dans la maisonnée royale.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לּוֹ
  choice: lui donna un fils
  rationale: Le verbe ילד accompagné de לּוֹ indique que la sœur de Tahpenès enfanta un fils pour Hadad. Cette formulation est naturelle en français tout en conservant le bénéficiaire exprimé par l’hébreu.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: la sœur de Tahpenès
  rationale: Le rapport construit est direct. Cette tournure claire et digne convient au récit.
- source_word: גְּנֻבַת
  choice: Guenoubath
  rationale: Translittération française intelligible du nom propre hébreu.
- source_word: בְּנוֹ
  choice: un fils, Guenoubath
  rationale: La relation filiale avec Hadad est exprimée naturellement par « lui donna un fils ». L’apposition identifie ce fils comme Guenoubath sans reproduire lourdement l’ordre des mots hébreu.
- source_word: וַתִּגְמְלֵהוּ
  choice: le sevra
  rationale: Dans ce contexte, גמל désigne le sevrage d’un enfant, et non de manière générale son éducation.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: dans la maison du pharaon
  rationale: La « maison » peut évoquer à la fois le palais et la maisonnée royale. La traduction conserve cette amplitude sémantique.
- source_word: וַיְהִי
  choice: y vivait
  rationale: L’imparfait rend idiomatiquement en français la situation durable décrite par היה dans ce résumé narratif, sans imposer l’idée plus forte de « rester ».
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: parmi les fils du pharaon
  rationale: La formulation conserve le masculin pluriel בְּנֵי et situe Guenoubath au milieu des fils de la famille royale.
