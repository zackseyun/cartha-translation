  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: fr
  text: Quand Salomon fut vieux, ses femmes inclinèrent son cœur vers d’autres dieux, et son cœur ne fut pas tout entier à Yahweh, son Dieu[a], comme l’avait été le cœur de David, son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne fut pas pleinement attaché à Yahweh, son Dieu ». Littéralement, l’hébreu dit que son cœur n’était pas « entier avec » Yahweh.
    reason: Alternative idiomatique et indication de la métaphore littérale de שָׁלֵם עִם.
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: Quand Salomon fut vieux
  rationale: Cette formulation française naturelle restitue la valeur temporelle de l’expression, littéralement « au temps de la vieillesse de Salomon », sans lourdeur.
- source_word: נָשָׁיו
  choice: ses femmes
  rationale: Le pluriel possessif est direct et désigne sans atténuation les épouses de Salomon.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: inclinèrent son cœur
  rationale: Le causatif de נטה exprime le fait de faire pencher ou tourner. « Inclinèrent son cœur » conserve l’image hébraïque sans ajouter explicitement l’idée plus forte d’égarement.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: vers d’autres dieux
  rationale: Dans cette construction, אַחֲרֵי évoque l’orientation et la poursuite. « Vers » donne un français naturel tout en conservant le mouvement du cœur en direction d’autres dieux.
- source_word: לְבָבוֹ
  choice: son cœur
  rationale: Le cœur englobe ici la volonté, la pensée et la fidélité. Le maintien de l’image biblique préserve cette richesse anthropologique.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: ne fut pas tout entier à Yahweh, son Dieu
  rationale: « Tout entier à » exprime idiomatiquement en français une loyauté sans partage, tout en conservant la métaphore de l’intégrité du cœur portée par שָׁלֵם.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: comme l’avait été le cœur de David, son père
  rationale: La comparaison porte explicitement sur le cœur. Cette formulation le maintient et rend explicite en français l’ellipse verbale hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la pratique éditoriale indiquée dans les données de consultation.
theological_decisions:
- issue: Sens de שָׁלֵם appliqué au cœur de Salomon
  choice: ne fut pas tout entier à Yahweh
  alternative: ne fut pas pleinement attaché à Yahweh
  rationale: Le choix retenu conserve l’image d’un cœur entier ou sans partage et la tension entre les fautes de David et l’orientation fondamentale de son cœur, sans imposer une définition doctrinale plus étroite.
- issue: Désignation אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  alternative: des dieux étrangers
  rationale: L’hébreu signifie directement « d’autres dieux ». Cette traduction ne réduit pas l’opposition religieuse à une distinction ethnique ou nationale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche de l’hébreu, tandis que « tout entier à » évite le calque peu naturel « entier avec ». Le marqueur de note est placé sur l’expression qu’il explique.
