base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: fr
  text: En effet, Joab et tout Israël[a] y étaient restés six mois, jusqu’à ce que Joab ait exterminé[b] tous les mâles en Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Tout Israël » désigne probablement ici les forces israélites qui accompagnaient Joab, et non chaque membre du peuple.
    reason: cultural_note
  - marker: b
    text: 'Ou : « retranché ». Le verbe hébreu signifie littéralement « couper, retrancher » et peut désigner l’élimination d’une population.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit ici une explication de ce qui précède. « En effet » rend naturellement cette valeur explicative en français.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: six mois
  rationale: Le groupe nominal indique simplement la durée du séjour.
- source_word: יָשַׁב שָׁם
  choice: y étaient restés
  rationale: Dans ce contexte militaire, יָשַׁב exprime une présence prolongée plutôt qu’une installation permanente; « y » reprend naturellement le lieu en français.
- source_word: יוֹאָב וְכָל יִשְׂרָאֵל
  choice: Joab et tout Israël
  rationale: La formulation conserve le collectif hébreu, qui désigne vraisemblablement ici les forces israélites accompagnant Joab.
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Cette locution marque clairement le terme temporel de leur séjour et appelle ici le subjonctif en français.
- source_word: הִכְרִית
  choice: ait éliminé
  rationale: Le hiphil de כרת signifie retrancher ou faire disparaître. « Éliminer » transmet clairement l’idée dans ce contexte sans conserver un calque français peu naturel.
- source_word: כָּל זָכָר
  choice: tout individu de sexe masculin
  rationale: זָכָר désigne le sexe masculin sans limiter explicitement la référence aux adultes; cette formulation préserve cette précision.
- source_word: בֶּאֱדוֹם
  choice: en Édom
  rationale: La préposition est locative et situe l’action sur le territoire d’Édom.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait situe le séjour dans l’arrière-plan narratif; le subjonctif passé après « jusqu’à ce que » maintient le rapport temporel. La formulation explicite de כָּל זָכָר évite de réduire indûment le sens aux seuls hommes adultes.
