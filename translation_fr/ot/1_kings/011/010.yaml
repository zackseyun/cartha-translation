source:
  edition: WLC
  text: וְ/צִוָּ֤ה אֵלָי/ו֙ עַל הַ/דָּבָ֣ר הַ/זֶּ֔ה לְ/בִ֨לְתִּי לֶ֔כֶת אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹ֣א שָׁמַ֔ר אֵ֥ת אֲשֶׁר צִוָּ֖ה יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: fr
  text: et lui avait ordonné, à ce sujet, de ne pas suivre d’autres dieux[a]. Mais il ne se conforma pas à ce que Yahweh avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aller derrière d’autres dieux ». Cette expression courante du langage de l’alliance signifie se tourner vers d’autres divinités et leur rendre un culte.'
    reason: Note culturelle et idiomatique
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: et lui avait ordonné
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité de l’ordre divin dans le récit, tandis que « lui avait ordonné » rend l’objet indirect אֵלָיו sans lourdeur.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: à ce sujet
  rationale: Dans ce contexte, דָּבָר désigne l’affaire ou le point en question. « À ce sujet » est idiomatique et évite le calque « au sujet de cette chose ».
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: de ne pas suivre d’autres dieux
  rationale: La construction exprime le contenu négatif de l’ordre. « Suivre d’autres dieux » restitue en français courant l’expression hébraïque littérale « aller derrière d’autres dieux ».
- source_word: וְלֹא שָׁמַר
  choice: Mais il ne se conforma pas
  rationale: Le waw prend ici une valeur nettement contrastive. Dans le contexte d’un ordre, שׁמר signifie observer ou respecter; « se conformer à » exprime clairement cette désobéissance tout en gardant un registre digne.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: à ce que Yahweh avait ordonné
  rationale: Cette formulation conserve la proposition relative indéfinie « ce que » et la répétition du verbe « ordonner », présente dans l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter le tétragramme comme nom propre plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en préserve la fonction de nom personnel.
- issue: Sens de « suivre d’autres dieux »
  choice: Conserver l’image de la suite dans le texte
  alternative: adorer d’autres dieux
  rationale: L’expression implique l’attachement cultuel et l’adoration, mais le verbe hébreu dit littéralement « aller derrière ». La traduction conserve cette image et laisse la note en expliciter la portée cultuelle sans réduire l’expression à un seul aspect.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit, tandis que le plus-que-parfait signale l’ordre antérieur. La coordination initiale « et » est maintenue parce que le verset prolonge directement la phrase précédente.
