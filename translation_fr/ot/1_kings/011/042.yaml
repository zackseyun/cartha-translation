  text: Salomon régna quarante ans à Jérusalem sur tout Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים אֲשֶׁר
  choice: '[omis comme tournure autonome]'
  rationale: La formule hébraïque, littéralement « et les jours pendant lesquels », exprime ici la durée totale du règne. En français moderne, cette idée se rend plus naturellement par le verbe suivi du complément de durée, sans perte de sens.
- source_word: מָלַךְ
  choice: régna
  rationale: Le qal de מלך désigne ici l’exercice de la royauté ; « régna » est l’équivalent français usuel dans un sommaire royal.
- source_word: שְׁלֹמֹה
  choice: Salomon
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בִ/ירוּשָׁלִַם
  choice: à Jérusalem
  rationale: La préposition ב est locative ; devant un nom de ville, le français idiomatique emploie « à ».
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: sur tout Israël
  rationale: La préposition עַל marque l’autorité royale, tandis que « tout Israël » conserve la référence collective et nationale du texte.
- source_word: אַרְבָּעִים שָׁנָה
  choice: quarante ans
  rationale: Traduction directe de l’expression indiquant la durée du règne.
