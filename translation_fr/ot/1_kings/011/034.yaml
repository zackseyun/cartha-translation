  source_fidelity: La première proposition rend correctement le retrait partiel du royaume, mais « je le maintiendrai » ajoute l’idée de continuité et atténue le verbe hébreu « j’établirai/je placerai ». La relation causale introduite par כִּי (« car ») doit rester explicite.
  naturalness: Le texte est globalement fluide. « Je le maintiendrai comme chef » est toutefois moins naturel que « je l’établirai comme dirigeant » et présente une nuance interprétative non nécessaire.
  terminology: « Commandements » et « prescriptions » distinguent convenablement les deux termes juridiques. « Dirigeant » rend נָשִׂיא sans lui imposer le titre plus précis de « roi »; il est plus idiomatique ici que « chef ».
