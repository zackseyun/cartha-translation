  text: וְ/לֹֽא אֶקַּ֥ח אֶת כָּל הַ/מַּמְלָכָ֖ה מִ/יָּד֑/וֹ כִּ֣י נָשִׂ֣יא אֲשִׁתֶ֗/נּוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו לְמַ֨עַן דָּוִ֤ד עַבְדִּ/י֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי אֹת֔/וֹ אֲשֶׁ֥ר שָׁמַ֖ר מִצְוֺתַ֥/י וְ/חֻקֹּתָֽ/י־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: fr
  text: Mais je ne retirerai pas de sa main tout le royaume, car je l’établirai comme dirigeant tous les jours de sa vie, à cause de David, mon serviteur, que j’ai choisi et qui a observé mes commandements et mes prescriptions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקַּח ... מִיָּדוֹ
  choice: je ne lui arracherai pas
  rationale: Le verbe « prendre » associé à « de sa main » exprime ici le retrait du pouvoir royal; « arracher » rend naturellement en français cette dépossession énergique dans le contexte.
- source_word: נָשִׂיא
  choice: chef
  rationale: Terme souple désignant un dirigeant ou un prince. « Chef » préserve sa portée générale sans lui attribuer explicitement le titre de roi.
- source_word: אֲשִׁתֶנּוּ
  choice: je le maintiendrai comme
  rationale: Le verbe signifie littéralement « je le placerai/établirai ». Dans ce contexte, Salomon étant déjà au pouvoir et devant le rester toute sa vie, « maintenir » explicite naturellement la continuité voulue.
- source_word: מִצְוֹתַי וְחֻקֹּתָי
  choice: mes commandements et mes prescriptions
  rationale: 'La distinction entre les deux termes juridiques est conservée: les ordres divins et les règles établies.'
theological_decisions:
- issue: Portée de l’éloge de David
  choice: qui a observé mes commandements et mes prescriptions
  alternative: qui observait mes commandements et mes prescriptions
  rationale: Le parfait hébreu présente l’obéissance de David comme un fait global dans ce discours d’alliance. La traduction conserve cette affirmation sans tenter de la concilier dans le verset avec les récits de ses fautes.
- issue: Statut de Salomon pendant le jugement annoncé
  choice: chef
  alternative: roi / prince
  rationale: נָשִׂיא ne porte pas nécessairement le titre royal précis. « Chef » maintient l’idée d’autorité tout en évitant d’ajouter une distinction institutionnelle absente du terme source.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe est légèrement réorganisée en deux phrases pour éviter une longue chaîne causale, tout en conservant le lien entre le maintien de Salomon et la fidélité accordée à David.
