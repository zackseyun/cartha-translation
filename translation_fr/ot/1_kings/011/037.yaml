  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: fr
  text: Je te prendrai, toi, et tu régneras sur tout ce que tu désireras[a] ; tu seras roi sur Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce que ton âme désirera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקַּח
  choice: je te prendrai
  rationale: Le verbe לקח signifie couramment « prendre ». Dans ce contexte d’établissement divin, cette formulation conserve la force concrète de l’hébreu sans expliciter par « choisir » ce que le texte laisse implicite.
- source_word: וּמָלַכְתָּ
  choice: tu régneras
  rationale: Le verbe מלך désigne l’exercice de la royauté, et non seulement l’accession au trône.
- source_word: בְּכֹל אֲשֶׁר
  choice: sur tout ce que
  rationale: Avec le verbe « régner », la préposition ב indique ici l’étendue du domaine soumis à l’autorité.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: tu désireras
  rationale: L’expression idiomatique signifie littéralement « ton âme désirera ». En français moderne, « tu désireras » en restitue naturellement le sens, tandis qu’une note conserve l’image hébraïque.
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: tu seras roi
  rationale: La construction היה suivie d’un nom exprime ici le statut qui sera celui de Jéroboam.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec la royauté, עַל marque normalement l’autorité exercée sur un peuple ou un royaume.
theological_decisions:
- issue: Expression anthropologique נֶפֶשׁ
  choice: Rendre l’idiome dans le texte par « tu désireras », avec le sens littéral en note.
  alternative: « tout ce que ton âme désirera » ou « tout ce que ton cœur désirera »
  rationale: נֶפֶשׁ appartient à une expression idiomatique et n’énonce pas ici une doctrine technique de l’âme. Le texte principal reste naturel en français, et la note préserve la transparence envers l’image originale sans remplacer « âme » par l’interprétation « cœur ».
translation_notes:
  register: Français international moderne, digne et direct. La reprise emphatique « toi » reflète וְאֹתְךָ et souligne le choix du destinataire. Le futur rend naturellement les formes hébraïques dans cette promesse prophétique.
