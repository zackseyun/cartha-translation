source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: fr
  text: Salomon suivit Ashtoreth[a], la divinité des Sidoniens[b], et Milkom[c], l’abomination des Ammonites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Astarté », forme du nom plus courante en français.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut se rendre littéralement par « le dieu des Sidoniens » ou « les dieux des Sidoniens » ; dans cette apposition à Ashtoreth, il désigne la divinité des Sidoniens.
    reason: lexical_alternative
  - marker: c
    text: Certains rapprochent Milkom de Molek, mais le texte hébreu porte ici « Milkom ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: suivit
  rationale: L’expression hébraïque « aller après » marque ici l’attachement et l’allégeance cultuelle, et non un simple déplacement. « Suivit » conserve cette portée sans expliciter davantage par « adora ».
- source_word: עַשְׁתֹּרֶת
  choice: Ashtoreth
  rationale: La translittération suit la forme du nom propre dans le texte hébreu. La forme française plus connue « Astarté » est signalée en note.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: la divinité des Sidoniens
  rationale: אֱלֹהֵי a formellement l’apparence d’un pluriel construit, mais désigne ici en apposition la divinité nommée Ashtoreth. « Divinité » rend le référent sans imposer en français le masculin « dieu » ni expliciter « déesse » au-delà de la forme hébraïque.
- source_word: מִלְכֹּם
  choice: Milkom
  rationale: Le texte consonantique porte Milkom. La translittération française par k distingue cette forme de Molek, auquel elle est parfois associée.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: l’abomination des Ammonites
  rationale: שִׁקֻּץ est un terme fortement péjoratif désignant ce qui est odieux, notamment une idole. « Abomination » en garde la force et la portée évaluative.
theological_decisions:
- issue: Faut-il expliciter que l’action de Salomon constitue un culte idolâtre ?
  choice: suivit
  alternative: adora
  rationale: Le contexte indique l’apostasie, mais le verset emploie l’expression « aller après ». « Suivit » conserve l’image et l’idée d’allégeance sans remplacer l’expression par une interprétation plus explicite.
- issue: Genre du titre appliqué à Ashtoreth
  choice: la divinité des Sidoniens
  alternative: la déesse des Sidoniens / le dieu des Sidoniens
  rationale: Ashtoreth est une divinité féminine, tandis que la forme hébraïque אֱלֹהֵי ne marque pas ici un féminin grammatical. « Divinité » respecte à la fois le référent et la formulation du texte sans résoudre excessivement cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste concise et proche du parallélisme hébreu. Les noms propres suivent la forme hébraïque, avec les équivalents plus connus indiqués en note.
