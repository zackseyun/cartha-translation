  text: וַ/יָּקֻ֨מוּ֙ מִ/מִּדְיָ֔ן וַ/יָּבֹ֖אוּ פָּארָ֑ן וַ/יִּקְחוּ֩ אֲנָשִׁ֨ים עִמָּ֜/ם מִ/פָּארָ֗ן וַ/יָּבֹ֤אוּ מִצְרַ֨יִם֙ אֶל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וַ/יִּתֶּן ל֣/וֹ בַ֗יִת וְ/לֶ֨חֶם֙ אָ֣מַר ל֔/וֹ וְ/אֶ֖רֶץ נָ֥תַן לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: fr
  text: Ils partirent de Madian et arrivèrent à Parân. Ils prirent avec eux des hommes de Parân et se rendirent en Égypte, auprès du pharaon, roi d’Égypte. Celui-ci lui donna une maison, lui attribua de la nourriture[a] et lui donna des terres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « et du pain, il lui dit » ; le sens semble être que le pharaon ordonna qu’on lui fournisse des provisions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: Ils partirent de Madian
  rationale: Dans un récit de voyage, קום suivi du point de départ exprime idiomatiquement la mise en route. « Partirent » est plus naturel en français que le littéral « se levèrent ».
- source_word: פָּארָן
  choice: Parân
  rationale: Translittération française traditionnelle du nom géographique, avec accent circonflexe indiquant la voyelle longue.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: Ils prirent avec eux des hommes de Parân
  rationale: אֲנָשִׁים désigne ici des hommes ajoutés au groupe; la formulation conserve le sens concret et la provenance.
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: auprès du pharaon, roi d’Égypte
  rationale: « Auprès du pharaon » rend naturellement la destination personnelle introduite par אֶל; la minuscule convient ici au titre royal, précisé par l’apposition.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: Celui-ci lui donna une maison
  rationale: « Celui-ci » clarifie sans ambiguïté que le sujet est le pharaon, tandis que « maison » conserve le sens direct de בַיִת.
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: lui attribua de la nourriture
  rationale: La formulation hébraïque est inhabituelle, littéralement « et du pain il lui dit ». Le contexte suggère un ordre ou une attribution de provisions; « nourriture » rend le sens étendu de לֶחֶם.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: lui donna des terres
  rationale: Dans ce contexte de don royal, אֶרֶץ désigne vraisemblablement un domaine foncier. Le pluriel français « des terres » exprime naturellement cette valeur sans suggérer un pays entier.
