  text: וְ/הָ/אִ֥ישׁ יָרָבְעָ֖ם גִּבּ֣וֹר חָ֑יִל וַ/יַּ֨רְא שְׁלֹמֹ֜ה אֶת הַ/נַּ֗עַר כִּֽי עֹשֵׂ֤ה מְלָאכָה֙ ה֔וּא וַ/יַּפְקֵ֣ד אֹת֔/וֹ לְ/כָל סֵ֖בֶל בֵּ֥ית יוֹסֵֽף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: fr
  text: Jéroboam était un homme de valeur[a]. Salomon vit que ce jeune homme était travailleur et le plaça à la tête de toutes les corvées de la maison de Joseph[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un homme capable » ou « un homme vaillant ». L’expression hébraïque peut désigner la force, la vaillance ou des capacités remarquables.
    reason: lexical_alternative
  - marker: b
    text: La « maison de Joseph » désigne les tribus issues de Joseph, en particulier Éphraïm et Manassé.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: Jéroboam était un homme
  rationale: Cette formulation française naturelle présente Jéroboam sans ajouter un marqueur temporel absent de l’hébreu; la conjonction וְ assure simplement la continuité du récit.
- source_word: גִּבּוֹר חָיִל
  choice: un homme de grande valeur
  rationale: L’expression peut évoquer la force, la vaillance ou une capacité remarquable. Dans ce contexte administratif, « de grande valeur » conserve cette ampleur sans limiter le sens à la guerre.
- source_word: וַיַּרְא
  choice: vit
  rationale: Rend directement ראה; le contexte fait comprendre qu’il s’agit de constater une qualité chez Jéroboam.
- source_word: הַנַּעַר
  choice: ce jeune homme
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur. Ici, l’âge et le statut de Jéroboam conviennent à « jeune homme ».
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: que ce jeune homme était travailleur
  rationale: La tournure signifie littéralement qu’il était quelqu’un qui accomplissait le travail. « Était travailleur » exprime naturellement l’activité et l’application qui motivent sa nomination.
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: le chargea de superviser
  rationale: Le hiphil de פקד exprime ici le fait d’établir quelqu’un sur une responsabilité. La formulation française explicite naturellement la fonction administrative.
- source_word: לְכָל סֵבֶל
  choice: toutes les corvées
  rationale: סֵבֶל désigne un travail pénible imposé, souvent le service de corvée. Le pluriel collectif est idiomatique en français et garde la dimension socio-politique du terme.
- source_word: בֵּית יוֹסֵף
  choice: la maison de Joseph
  rationale: La traduction conserve la désignation tribale hébraïque, dont le référent est précisé en note.
