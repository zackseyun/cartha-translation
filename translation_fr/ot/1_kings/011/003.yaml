source:
  edition: WLC
  text: וַ/יְהִי ל֣/וֹ נָשִׁ֗ים שָׂרוֹת֙ שְׁבַ֣ע מֵא֔וֹת וּ/פִֽלַגְשִׁ֖ים שְׁלֹ֣שׁ מֵא֑וֹת וַ/יַּטּ֥וּ נָשָׁ֖י/ו אֶת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: fr
  text: Il eut sept cents épouses, des princesses, et trois cents concubines ; ses épouses détournèrent son cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Il eut
  rationale: La tournure היה + ל exprime la possession. « Il eut » la rend naturellement en français dans un récit au passé.
- source_word: נָשִׁים שָׂרוֹת
  choice: femmes de haut rang
  rationale: נָשִׁים désigne ici les femmes de Salomon, tandis que שָׂרוֹת précise leur rang élevé. Cette formulation naturelle conserve cette relation sans imposer le sens plus étroit de « princesses ».
- source_word: שְׁבַע מֵאוֹת
  choice: sept cents
  rationale: Rendu direct du nombre cardinal.
- source_word: וּפִלַגְשִׁים
  choice: et trois cents concubines
  rationale: « Concubines » est le terme français conventionnel pour des partenaires reconnues mais de statut inférieur aux épouses principales.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: trois cents
  rationale: Rendu direct du nombre cardinal.
- source_word: וַיַּטּוּ
  choice: détournèrent
  rationale: Le verbe נטה exprime ici un changement d'orientation. « Détournèrent » conserve ce mouvement sans expliciter davantage sa portée religieuse, développée par le contexte.
- source_word: נָשָׁיו
  choice: ses femmes
  rationale: Le terme reprend נָשִׁים et désigne les femmes de Salomon. En français biblique courant, « ses femmes » indique naturellement ses épouses dans ce contexte.
- source_word: אֶת לִבּוֹ
  choice: son cœur
  rationale: « Cœur » conserve l'image hébraïque et sa richesse sémantique, qui englobe la volonté, la pensée et la fidélité, et non les seules émotions.
theological_decisions:
- issue: Portée de « son cœur »
  choice: Conserver « son cœur », qui peut désigner l'être intérieur, la volonté et la fidélité de Salomon.
  alternative: Expliciter par « sa fidélité » ou comprendre la phrase comme un simple changement affectif.
  rationale: Le texte hébreu emploie le terme concret לֵב. Le conserver maintient sa profondeur anthropologique et la tension théologique, sans réduire ni surinterpréter le propos.
- issue: Nature de l'action des femmes
  choice: « détournèrent » son cœur
  alternative: « égarèrent » son cœur ou « inclinèrent » son cœur
  rationale: « Détournèrent » traduit le changement de direction exprimé par נטה tout en laissant le contexte préciser de qui ou de quoi le cœur est détourné.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif. La formulation évite une lourde apposition tout en conservant le statut élevé des sept cents femmes et l'image théologiquement chargée du cœur.
