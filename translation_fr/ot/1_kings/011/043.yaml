base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: fr
  text: Salomon reposa avec ses ancêtres[a] et fut enterré dans la ville de David, son père. Roboam, son fils, régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « se coucha avec ses pères » : expression habituelle pour parler de la mort et du fait de rejoindre ses ancêtres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: reposa avec ses ancêtres
  rationale: Cette formulation française conserve l’image hébraïque traditionnelle du repos dans la mort et l’idée de rejoindre ses ascendants, tout en évitant l’ambiguïté moderne de « se coucha avec ses pères ».
- source_word: וַיִּקָּבֵר
  choice: fut enterré
  rationale: Le nifal exprime ici le passif ; « fut enterré » est précis, naturel et adapté au registre narratif.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: dans la ville de David, son père
  rationale: La traduction conserve à la fois le lieu dynastique et l’apposition qui identifie David comme le père de Salomon.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: « Régna » rend avec concision la formule royale de succession.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Cette expression marque clairement le remplacement de Salomon par Roboam, et pas seulement une succession chronologique.
