  text: וְ/לָקַחְתִּ֥י הַ/מְּלוּכָ֖ה מִ/יַּ֣ד בְּנ֑/וֹ וּ/נְתַתִּ֣י/הָ לְּ/ךָ֔ אֵ֖ת עֲשֶׂ֥רֶת הַ/שְּׁבָטִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: fr
  text: Mais je prendrai le royaume de la main de son fils[a] et je te le donnerai, à savoir les dix tribus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la main de son fils »; cette expression signifie que le royaume sera retiré à son pouvoir.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « et je te le donnerai, les dix tribus ». Les dix tribus précisent ici ce qui lui sera donné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Mais je prendrai
  rationale: Le qatal avec waw a ici une valeur future dans le discours prophétique. « Mais » marque naturellement le contraste avec le verset précédent.
- source_word: הַמְּלוּכָה
  choice: le royaume
  rationale: Dans ce contexte, le terme désigne le domaine royal retiré à la lignée de Salomon; « royaume » est clair et idiomatique en français.
- source_word: מִיַּד בְּנוֹ
  choice: des mains de son fils
  rationale: Cette formulation conserve l’image hébraïque de la main comme symbole de pouvoir ou de possession, tout en étant naturelle en français.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: et je te le donnerai
  rationale: Le suffixe féminin renvoie au royaume; le pronom français masculin s’accorde avec « royaume ». Le sujet est répété pour une syntaxe française fluide.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: à savoir les dix tribus
  rationale: 'La locution explicite la valeur appositionnelle de l’expression: ce qui est donné à Jéroboam correspond aux dix tribus, sans laisser entendre que le royaume entier lui est remis.'
theological_decisions:
- issue: Étendue du royaume donné à Jéroboam
  choice: « à savoir les dix tribus » présente les dix tribus comme l’explication de ce qui lui est donné
  alternative: « et je te donnerai les dix tribus »
  rationale: La construction hébraïque rattache « les dix tribus » au pronom objet de « je te le donnerai ». La traduction conserve cette apposition sans trancher au-delà de la syntaxe du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Des mains de son fils » conserve l’image sémitique tout en restant intelligible; « à savoir » clarifie sobrement l’apposition hébraïque.
