  naturalness: Le français est globalement moderne et fluide. Une seule phrase, avec une coordination cohérente, restitue mieux la construction tout en restant lisible. « En faisant … et en observant » est naturel en français et exprime adéquatement le rapport de conduite.
  terminology: « Astarté », « Kemosh », « Milkom », « prescriptions » et « règles » sont recevables en français international. La note sur Astarté préserve utilement la tension entre le genre connu de la divinité et la formulation masculine de l’hébreu; celle sur Milkom conserve l’alternative sans l’imposer.
