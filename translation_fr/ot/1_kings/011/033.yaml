source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: fr
  text: parce qu’ils m’ont abandonné, se sont prosternés devant Astarté[a], le dieu des Sidoniens, devant Kemosh, le dieu de Moab, et devant Milkom[b], le dieu des Ammonites, et n’ont pas suivi mes voies en faisant ce qui est droit à mes yeux et en observant mes prescriptions et mes règles, comme David, son père[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la déesse des Sidoniens ». L’hébreu dit littéralement « le dieu des Sidoniens », bien qu’Astarté soit une divinité féminine.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte ici « Milkom » ; certains rapprochent ce nom de Molek.
    reason: alternative_reading
  - marker: c
    text: Ici, David est appelé son « père » au sens d’ancêtre dynastique, et non de père biologique immédiat.
    reason: cultural_note
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: parce que
  rationale: Introduit naturellement en français la cause du partage du royaume.
- source_word: עֲזָבוּנִי
  choice: ils m’ont abandonné
  rationale: Exprime clairement la rupture de fidélité impliquée par le verbe hébreu dans ce contexte d’apostasie.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se sont prosternés devant
  rationale: Conserve à la fois le geste physique et sa portée cultuelle.
- source_word: לְעַשְׁתֹּרֶת
  choice: devant Astarté
  rationale: Astarté est la forme française courante du nom de cette divinité correspondant à l’hébreu Ashtoreth.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: le dieu des Sidoniens
  rationale: Suit la formulation grammaticale masculine du texte hébreu, sans corriger silencieusement selon le sexe connu de la divinité.
- source_word: לִכְמוֹשׁ
  choice: devant Kemosh
  rationale: Translittération française claire du nom propre hébreu.
- source_word: וּלְמִלְכֹּם
  choice: et devant Milkom
  rationale: Reproduit la lecture du texte massorétique plutôt que de l’identifier directement à Molek.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: Ils n’ont pas suivi mes voies
  rationale: Rend naturellement en français l’image hébraïque de marcher dans les voies de Dieu.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: en faisant ce qui est droit à mes yeux
  rationale: Préserve l’évaluation selon le regard de Dieu et rattache l’action à la conduite dans ses voies.
- source_word: וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: et en observant mes prescriptions et mes règles
  rationale: Le seul verbe hébreu « faire » régit les trois compléments; « observer » explicite en français idiomatique son sens appliqué aux dispositions juridiques tout en maintenant deux catégories distinctes.
- source_word: כְּדָוִד אָבִיו
  choice: comme l’a fait David, son ancêtre
  rationale: Dans le contexte, « père » désigne David comme père dynastique de Salomon; « ancêtre » évite de laisser croire qu’il est son père biologique immédiat.
theological_decisions:
- issue: Genre de la divinité Astarté dans אֱלֹהֵי צִדֹנִין
  choice: le dieu des Sidoniens
  alternative: la déesse des Sidoniens
  rationale: Le texte hébreu emploie la désignation grammaticale rendue littéralement par « le dieu »; la note signale le sexe féminin de la divinité sans normaliser le texte principal.
- issue: Identification de מִלְכֹּם
  choice: Milkom
  alternative: Molek
  rationale: La forme massorétique du verset est Milkom. L’association traditionnelle avec Molek reste possible mais ne doit pas remplacer la lecture du texte dans le corps de la traduction.
- issue: Sens de אָבִיו appliqué à David
  choice: son ancêtre
  alternative: son père
  rationale: David est ici le père dynastique de Salomon, non son père biologique immédiat; le choix français transmet ce rapport sans modifier la portée dynastique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase longue de l’hébreu est divisée en deux pour la lisibilité. Les noms divins suivent des formes françaises reconnaissables; le vocabulaire cultuel et juridique reste précis sans archaïsme.
