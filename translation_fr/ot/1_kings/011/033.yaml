  to: parce qu’ils m’ont abandonné, se sont prosternés devant Astarté[a], le dieu des Sidoniens, devant Kemosh, le dieu de Moab, et devant Milkom[b], le dieu des Ammonites, et n’ont pas suivi mes voies en faisant ce qui est droit à mes yeux et en observant mes prescriptions et mes règles, comme David, son père[c].
