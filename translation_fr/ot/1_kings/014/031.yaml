  text: וַ/יִּשְׁכַּ֨ב רְחַבְעָ֜ם עִם אֲבֹתָ֗י/ו וַ/יִּקָּבֵ֤ר עִם אֲבֹתָי/ו֙ בְּ/עִ֣יר דָּוִ֔ד וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִ֑ית וַ/יִּמְלֹ֛ךְ אֲבִיָּ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: fr
  text: Roboam se coucha avec ses pères et fut enterré avec eux dans la Cité de David. Sa mère s’appelait Naama l’Ammonite. Son fils Abiyam régna à sa place.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abiyam est appelé Abiya dans certains autres passages; le texte hébreu de ce verset porte précisément « Abiyam ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: se coucha avec ses pères
  rationale: La formule royale est un euphémisme conventionnel de la mort. Cette traduction en conserve l’image et le caractère formulaire, tout en évitant d’ajouter explicitement « mourut ».
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: fut enterré avec eux
  rationale: « Fut enterré » rend directement le passif; « avec eux » évite en français une répétition pesante de « avec ses pères » sans changer le référent.
- source_word: בְּעִיר דָּוִד
  choice: dans la Cité de David
  rationale: Rend naturellement le nom géographique traditionnel tout en conservant sa forme biblique reconnaissable.
- source_word: וְשֵׁם אִמּוֹ
  choice: Sa mère s’appelait
  rationale: Expression française actuelle et naturelle pour la formule hébraïque littérale « le nom de sa mère était ».
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: Naama l’Ammonite
  rationale: Le gentilé français s’accorde au féminin et rend donc explicitement la forme féminine de l’hébreu sans l’expansion inutile « femme ammonite ».
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Rend directement le verbe de la formule de succession royale.
- source_word: אֲבִיָּם
  choice: Abiyam
  rationale: Reproduit la forme propre à ce verset, אֲבִיָּם, plutôt que de l’harmoniser avec Abiya, forme attestée ailleurs.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Expression française naturelle qui conserve l’idée de remplacement dans la succession dynastique.
theological_decisions:
- issue: Portée de l’expression « se coucha avec ses pères »
  choice: Conserver l’euphémisme hébreu
  alternative: « mourut et rejoignit ses ancêtres »
  rationale: Le texte formule la mort au moyen d’une expression dynastique traditionnelle; la traduction ne précise pas davantage la nature de cet état ni une doctrine de l’au-delà.
translation_notes:
  register: Français moderne, digne et lisible, avec maintien de la formule royale hébraïque. « Ses pères » est conservé plutôt que remplacé par « ses ancêtres » afin de préserver la tournure dynastique. Le marqueur de note est placé après le nom concerné dans la dernière phrase.
