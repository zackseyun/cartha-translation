source:
  edition: WLC
  text: וַ/יְהִ֛י בַּ/שָּׁנָ֥ה הַ/חֲמִישִׁ֖ית לַ/מֶּ֣לֶךְ רְחַבְעָ֑ם עָלָ֛ה שושק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/025.yaml
  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: fr
  text: La cinquième année du règne du roi Roboam, Shishak, roi d’Égypte, marcha[a] contre Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « monta ». En hébreu, ce verbe peut désigner l’avancée d’une armée, notamment vers une ville importante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[non rendu séparément]'
  rationale: Cette forme introduit le nouvel événement du récit. En français moderne, la proposition datée assure naturellement cette transition sans qu’il soit nécessaire d’ajouter « Or » ou « Il arriva que ».
- source_word: בַּשָּׁנָה הַחֲמִישִׁית
  choice: La cinquième année
  rationale: Formulation française naturelle pour une date calculée selon les années de règne.
- source_word: לַמֶּלֶךְ רְחַבְעָם
  choice: du règne du roi Roboam
  rationale: Dans cette formule chronologique, le lamed renvoie au règne de Roboam. L’ajout de « règne » explicite en français le rapport sous-entendu et évite de suggérer l’âge du roi.
- source_word: עָלָה
  choice: marcha
  rationale: Dans ce contexte militaire, le verbe désigne une progression hostile vers une ville. « Marcha contre » exprime naturellement cette avancée sans affirmer plus précisément que l’attaque avait déjà commencé; la note conserve l’image directionnelle de l’hébreu.
- source_word: שושק
  choice: Shishak
  rationale: Translittération proche de la forme hébraïque du nom, sans lui substituer l’identification historique égyptienne « Sheshonq ».
- source_word: מֶלֶךְ מִצְרַיִם
  choice: roi d’Égypte
  rationale: L’apposition française identifie simplement la fonction et le royaume de Shishak.
- source_word: עַל יְרוּשָׁלִָם
  choice: contre Jérusalem
  rationale: Avec le verbe de mouvement employé dans un cadre militaire, la préposition a ici un sens hostile, rendu clairement par « contre ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La tournure « marcha contre » reste digne et claire, tandis que la note signale l’image spatiale de l’expression hébraïque.
