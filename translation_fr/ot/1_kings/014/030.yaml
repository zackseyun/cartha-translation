review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu énonce qu’il y eut guerre entre les deux personnages « tous les jours » (כָּל־הַיָּמִים). Dans ce contexte, l’expression marque la persistance du conflit, sans préciser formellement si l’horizon est leur vie entière ou leurs règnes. « Durant toute leur vie » choisit explicitement l’une de ces lectures dans le texte principal.
  naturalness: « Il y eut guerre » est compréhensible, mais son tour sans article est assez littéraire et moins naturel en français international moderne. « Roboam et Jéroboam furent en guerre tout le temps » est clair, fluide et conserve la notion de conflit durable.
  terminology: Les formes françaises usuelles « Roboam » et « Jéroboam » conviennent. Le terme « guerre » rend directement מִלְחָמָה. La note doit éviter de présenter « tous les jours » comme une traduction française pleinement neutre du sens contextuel, tout en signalant la formulation littérale et l’ambiguïté de portée.
  issues:
  - severity: medium
    issue: Portée temporelle rendue trop précisément dans le texte principal
    rationale: « Durant toute leur vie » affirme que la durée visée est leur vie entière, alors que l’hébreu dit littéralement « tous les jours » et que, dans le contexte royal, la référence peut être comprise comme la durée de leurs règnes. Une formulation qui exprime la permanence du conflit sans trancher cette portée est préférable.
  - severity: low
    issue: Tour « Il y eut guerre » de registre soutenu
    rationale: Le tour est possible, mais il est moins idiomatique en français moderne international que l’expression « furent en guerre ». La révision améliore la lisibilité sans modifier le sens.
