- from: Il y eut guerre entre Roboam et Jéroboam durant toute leur vie[a].
  to: Roboam et Jéroboam furent en guerre tout le temps[a].
  rationale: La révision conserve « guerre », les noms français établis et l’idée d’un conflit persistant. Elle évite toutefois de fixer dans le texte principal une portée biographique (« toute leur vie ») que l’hébreu ne formule pas explicitement. La note maintient l’alternative vie/règne et l’ancrage littéral de l’expression hébraïque.
  reviewer_model: gpt-5.6-terra
