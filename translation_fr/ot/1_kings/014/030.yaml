  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: fr
  text: Roboam et Jéroboam furent en guerre tout le temps[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les jours ». L’expression indique que le conflit persista; elle peut se rapporter à toute la durée de leur vie ou de leur règne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Il y eut guerre
  rationale: La construction avec מִלְחָמָה et le verbe היה exprime simplement l’existence d’un état de guerre. « Il y eut guerre » reste proche de l’hébreu tout en étant naturel et digne en français.
- source_word: בֵין ... וּ/בֵין
  choice: entre ... et
  rationale: La construction prépositionnelle corrélative indique une opposition réciproque entre les deux rois.
- source_word: רְחַבְעָם
  choice: Roboam
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: כָּל הַיָּמִים
  choice: durant toute leur vie
  rationale: Littéralement « tous les jours ». Dans ce contexte, l’expression indique que le conflit a persisté pendant toute la période associée aux deux rois, vraisemblablement leur vie ou leur règne. Le singulier collectif « leur vie » est idiomatique en français.
theological_decisions:
- issue: Portée temporelle de כָּל הַיָּמִים
  choice: durant toute leur vie
  alternative: tous les jours / durant tout leur règne
  rationale: Le texte hébreu ne précise pas explicitement s’il s’agit de leur vie ou de leur règne. Le texte principal emploie l’expression française naturelle « durant toute leur vie », tandis que la note conserve l’ambiguïté contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la sobriété de l’énoncé hébreu sans ajouter l’idée explicite de combats continuels.
