base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: fr
  text: 'Jéroboam dit à sa femme : « Lève-toi, je te prie, et déguise-toi, afin qu’on ne sache pas[a] que tu es la femme de Jéroboam. Puis va à Silo. Le prophète Ahija est là ; c’est lui qui a annoncé à mon sujet que je deviendrais roi de ce peuple[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ils ne sauront pas » ; le sujet demeure indéfini en hébreu.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est concis : « il a parlé à mon sujet, pour roi sur ce peuple » ; on peut aussi comprendre : « pour que je sois roi de ce peuple » ou « de moi comme roi de ce peuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יָרָבְעָם לְאִשְׁתּוֹ
  choice: Jéroboam dit à sa femme
  rationale: Formulation narrative française naturelle qui conserve le verbe de parole et la relation conjugale explicitement indiquée.
- source_word: קוּמִי נָא
  choice: Lève-toi, je te prie
  rationale: L’impératif rend קוּמִי, tandis que « je te prie » exprime la nuance d’exhortation ou de requête portée par נָא sans archaïsme excessif.
- source_word: וְהִשְׁתַּנִּית
  choice: et déguise-toi
  rationale: Le hitpael de שנה désigne ici le fait de modifier son apparence afin de ne pas être reconnue ; « déguise-toi » en rend clairement le sens réflexif.
- source_word: וְלֹא יֵדְעוּ
  choice: afin qu’on ne sache pas
  rationale: Après l’ordre de se déguiser, la coordination hébraïque prend naturellement une valeur de but ou de résultat. Le pronom français « on » garde le sujet humain indéfini.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: Puis va à Silo
  rationale: La forme verbale coordonnée prolonge les instructions avec une valeur impérative ; « puis » rend clairement la succession en français.
- source_word: הִנֵּה שָׁם אֲחִיָּה הַנָּבִיא
  choice: Le prophète Ahija est là
  rationale: Cette formulation actuelle et digne restitue la présentation déictique de הִנֵּה שָׁם sans recourir au vieillissant « voici que ».
- source_word: הוּא דִבֶּר
  choice: c’est lui qui a annoncé
  rationale: La construction clivée conserve l’insistance du pronom indépendant הוּא. Dans ce contexte prophétique, « annoncé » rend naturellement דִבֶּר tout en restant un verbe de parole.
- source_word: עָלַי לְמֶלֶךְ עַל הָעָם הַזֶּה
  choice: à mon sujet que je deviendrais roi de ce peuple
  rationale: La traduction exprime en français idiomatique que la parole prophétique concernait l’accession de Jéroboam à la royauté, tout en signalant en note la concision syntaxique de l’hébreu.
theological_decisions:
- issue: Rapport syntaxique entre עָלַי et לְמֶלֶךְ
  choice: « a annoncé à mon sujet que je deviendrais roi »
  alternative: « a parlé à mon sujet pour que je sois roi » ou « a parlé de moi comme roi »
  rationale: L’hébreu est très condensé et permet plusieurs explicitations françaises. Le contexte de la prophétie d’Ahija favorise l’annonce de l’accession au trône, mais la note conserve les autres lectures syntaxiquement possibles sans imposer une précision doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « Lève-toi, je te prie » conserve la politesse de נָא ; « Silo » et « Ahija » suivent les formes françaises bibliques courantes. Le discours direct reste fluide, tandis que les notes documentent les deux indéterminations réelles du texte hébreu.
