    rationale: « Ce qui lui avait été dit » ajoute que l’action correspond à des paroles qui lui ont été adressées. Le contexte précédent fournit bien des instructions, mais la formule hébraïque dit simplement « elle fit ainsi ». Il est préférable de ne pas expliciter davantage.
  - severity: medium
    issue: Rendu de קָמוּ עֵינָיו
    rationale: « Ses yeux étaient devenus fixes » est maladroit en français et ne signifie pas naturellement une perte de vision. Dans ce contexte, l’idiome décrit une vue diminuée par la vieillesse. Le rendu fonctionnel « sa vue avait baissé » est plus clair; la note maintient la formulation littérale et signale son caractère idiomatique.
  revised_text: La femme de Jéroboam fit ainsi. Elle se leva, alla à Silo et arriva à la maison d’Ahija. Or Ahija ne pouvait pas voir, car sa vue avait baissé[a] à cause de son grand âge.
