- from: La femme de Jéroboam fit donc ce qui lui avait été dit. Elle se leva, alla à Silo et arriva à la maison d’Ahija. Or Ahija ne pouvait pas voir, car ses yeux étaient devenus fixes[a] à cause de son grand âge.
  to: La femme de Jéroboam fit ainsi. Elle se leva, alla à Silo et arriva à la maison d’Ahija. Or Ahija ne pouvait pas voir, car sa vue avait baissé[a] à cause de son grand âge.
  rationale: La révision supprime une explicitation non exprimée dans le texte source et remplace une image française peu naturelle par un rendu idiomatique de la déficience visuelle. La note préserve l’image hébraïque inhabituelle et son interprétation contextuelle, sans imposer une explication médicale.
