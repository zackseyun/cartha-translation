  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: fr
  text: La femme de Jéroboam fit ainsi. Elle se leva, alla à Silo et arriva à la maison d’Ahija. Or Ahija ne pouvait pas voir, car sa vue avait baissé[a] à cause de son grand âge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ses yeux s’étaient tenus debout ». C’est une expression qui décrit ici une perte de la vue liée à l’âge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: fit donc ce qui lui avait été dit
  rationale: La formule narrative signifie qu’elle agit conformément aux instructions précédentes. Cette formulation explicite naturellement le référent de « ainsi » sans ajouter d’action nouvelle.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: La femme de Jéroboam
  rationale: Rendu direct et naturel de la construction possessive hébraïque.
- source_word: וַתָּקָם
  choice: Elle se leva
  rationale: Conserve l’étape narrative exprimée par le verbe hébreu, dans un registre courant et digne.
- source_word: וַתֵּלֶךְ שִׁלֹה
  choice: alla à Silo
  rationale: Rend simplement le mouvement vers la destination indiquée.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: arriva à la maison d’Ahija
  rationale: Préserve l’idée d’arrivée à la maison sans préciser indûment si elle y entra immédiatement.
- source_word: וַאֲחִיָּהוּ
  choice: Or Ahija
  rationale: « Or » marque naturellement le changement de focalisation vers Ahija.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: ne pouvait pas voir
  rationale: Traduction directe de l’expression d’incapacité suivie de l’infinitif.
- source_word: קָמוּ עֵינָיו
  choice: ses yeux étaient devenus fixes
  rationale: Conserve l’image concrète de l’hébreu, littéralement « ses yeux s’étaient tenus debout », qui décrit ici une perte de la vue liée à l’âge; une note évite que l’image soit mal comprise.
- source_word: מִשֵּׂיבוֹ
  choice: à cause de son grand âge
  rationale: Exprime clairement la cause indiquée par la préposition et le terme désignant la vieillesse.
