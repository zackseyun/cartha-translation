base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: fr
  text: 'Yahweh dit à Ahija : « Voici que la femme de Jéroboam vient te consulter au sujet de son fils, car il est malade. Tu lui diras telle et telle chose[a]. Lorsqu’elle arrivera, elle se déguisera[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ainsi et ainsi ». Cette formule désigne un message précis dont le contenu n’est pas encore rapporté.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « elle cherchera à ne pas être reconnue » ou « elle se fera passer pour une autre ». Le verbe hébreu exprime le fait de se rendre méconnaissable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et suit la décision terminologique fournie, sans le remplacer par un titre.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Marque l’attention et l’imminence dans un français actuel et digne.
- source_word: בָּאָה לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: vient te consulter au sujet de son fils
  rationale: « Consulter » convient au contexte d’une demande adressée à un prophète et rend naturellement l’idée de rechercher auprès de lui une parole ou un renseignement.
- source_word: כִּי חֹלֶה הוּא
  choice: car il est malade
  rationale: Rend directement la proposition causale dans un registre narratif naturel.
- source_word: כָּזֹה וְכָזֶה תְּדַבֵּר אֵלֶיהָ
  choice: Tu lui diras telle et telle chose
  rationale: Conserve la formule hébraïque qui annonce un message déterminé sans encore en donner le contenu.
- source_word: וִיהִי כְבֹאָהּ
  choice: Lorsqu’elle arrivera
  rationale: Restitue sobrement la formule temporelle hébraïque sans calque lourd.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: elle sera déguisée
  rationale: Exprime le fait qu’elle cherchera à ne pas être reconnue, tout en gardant la perspective de son état au moment de l’arrivée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé sous une forme française courante, conformément à la décision terminologique fournie, plutôt que d’être remplacé par un titre.
- issue: Nature de la consultation prophétique
  choice: vient te consulter au sujet de son fils
  alternative: vient chercher auprès de toi une parole au sujet de son fils
  rationale: Le verbe « consulter » reste naturel et laisse le contexte prophétique déterminer s’il s’agit d’une information ou d’un oracle, sans préciser davantage que l’hébreu.
