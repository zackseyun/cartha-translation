  source_fidelity: 'Le sens général est fidèle au texte hébreu : Yahweh avertit Ahija de l’arrivée de la femme de Jéroboam, de l’objet de sa demande concernant son fils malade, et lui prescrit une réponse dont le contenu demeure provisoirement non formulé. « Telle et telle chose » rend correctement la formule volontairement indéterminée כָּזֹה וְכָזֶה. La dernière proposition emploie toutefois un hitpael qui souligne l’action de se rendre méconnaissable ; « elle sera déguisée » décrit surtout un état et peut affaiblir cette nuance réflexive.'
