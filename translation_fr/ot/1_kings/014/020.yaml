  text: וְ/הַ/יָּמִים֙ אֲשֶׁ֣ר מָלַ֣ךְ יָרָבְעָ֔ם עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָ֑ה וַ/יִּשְׁכַּב֙ עִם אֲבֹתָ֔י/ו וַ/יִּמְלֹ֛ךְ נָדָ֥ב בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: fr
  text: La durée du règne de Jéroboam fut de vingt-deux ans. Puis il s’endormit avec ses pères[a], et son fils Nadab devint roi à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « il se coucha avec ses pères ». Cette expression hébraïque désigne la mort dans une formule de succession royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: La durée du règne de … fut
  rationale: Cette formulation française naturelle rend la formule hébraïque de bilan royal sans reproduire lourdement la conjonction initiale ni l’expression littérale « les jours pendant lesquels il régna ».
- source_word: יָרָבְעָם
  choice: Jéroboam
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: vingt-deux ans
  rationale: Rendu idiomatique moderne de l’expression numérique hébraïque.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: il se coucha auprès de ses ancêtres
  rationale: Le choix conserve l’image de la formule hébraïque désignant la mort, tout en évitant en français moderne l’ambiguïté sexuelle possible de « se coucher avec ». « Ancêtres » exprime ici naturellement le pluriel אָבוֹת.
- source_word: וַיִּמְלֹךְ
  choice: devint roi
  rationale: Dans cette formule de succession, le verbe marque l’accession au trône plutôt que la durée du règne.
- source_word: נָדָב בְּנוֹ
  choice: son fils Nadab
  rationale: Ordre naturel en français, qui maintient explicitement la relation filiale.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Rend directement l’idée de remplacement et de succession royale.
theological_decisions:
- issue: Formule royale décrivant la mort
  choice: Conserver l’image par « il se coucha auprès de ses ancêtres »
  alternative: « il mourut » ou, plus traditionnellement, « il s’endormit avec ses pères »
  rationale: La formule est un idiome narratif conventionnel, non un enseignement développé sur l’au-delà. Garder l’image préserve la texture du texte sans lui ajouter une précision doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase adopte la tournure française usuelle des notices royales tout en préservant, avec une note, l’image de l’idiome hébraïque.
