  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: fr
  text: Ils se construisirent, eux aussi, des hauts lieux, des stèles et des ashéras[a], sur toute colline élevée et sous tout arbre verdoyant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poteaux sacrés » ou « symboles sacrés d’Ashéra » ; le terme hébreu désigne des objets cultuels associés à Ashéra, sans en préciser clairement la forme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: se construisirent
  rationale: Le verbe בנה signifie normalement « construire ». La tournure pronominale avec לָהֶם rend naturellement l’idée qu’ils établirent ces installations pour leur propre usage.
- source_word: גַם הֵמָּה
  choice: eux aussi
  rationale: Cette formulation conserve l’insistance du texte hébreu et le lien avec les fautes évoquées dans le contexte précédent.
- source_word: בָּמוֹת
  choice: hauts lieux
  rationale: Terme français consacré pour les sanctuaires cultuels locaux désignés par בָּמוֹת ; il reste concis et convient à l’énumération.
- source_word: מַצֵּבוֹת
  choice: stèles
  rationale: Le mot désigne des pierres dressées à fonction cultuelle. « Stèles » est naturel en français biblique moderne et plus précis que le simple « colonnes ».
- source_word: אֲשֵׁרִים
  choice: poteaux sacrés d’Ashéra
  rationale: Dans cette liste d’installations cultuelles, le pluriel désigne vraisemblablement des objets associés à la déesse Ashéra. Cette traduction rend ce lien explicite tout en signalant par une note l’incertitude sur leur forme exacte.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: sur toute colline élevée
  rationale: Rend directement la topographie et la portée généralisante de la formule hébraïque.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: et sous tout arbre verdoyant
  rationale: רַעֲנָן évoque un arbre vert, frais et luxuriant. « Verdoyant » restitue cette image dans un français naturel et digne.
theological_decisions:
- issue: 'Référent de אֲשֵׁרִים : la déesse Ashéra elle-même ou des objets cultuels qui lui sont associés'
  choice: des objets cultuels, rendus par « poteaux sacrés d’Ashéra »
  alternative: « ashéras », « symboles d’Ashéra » ou « objets sacrés d’Ashéra »
  rationale: Son emploi aux côtés des hauts lieux et des stèles favorise ici le sens d’objets matériels. La note maintient toutefois l’incertitude réelle concernant leur nature et leur forme.
translation_notes:
  register: Français international actuel, lisible et digne. « Hauts lieux » et « stèles » conservent le vocabulaire cultuel technique sans alourdir le verset ; la note explique le terme le plus incertain.
