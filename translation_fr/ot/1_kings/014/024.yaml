source:
  edition: WLC
  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: fr
  text: Il y avait aussi dans le pays des prostitués cultuels[a]. Ils se livrèrent à toutes les abominations des nations que Yahvé avait chassées devant les fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un prostitué cultuel », ou peut-être « un homme voué au culte ». Le terme hébreu קָדֵשׁ est masculin singulier, mais il est employé ici collectivement. Dans ce contexte, il désigne vraisemblablement une personne associée à des pratiques cultuelles sexuelles interdites.
    reason: Signaler l’emploi collectif du singulier et préserver l’incertitude lexicale et historique du terme, tout en expliquant le rendu retenu.
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: Rend naturellement la valeur additive du syntagme, qui introduit un grief supplémentaire.
- source_word: קָדֵשׁ
  choice: des prostitués sacrés
  rationale: Le nom masculin singulier est employé ici dans une construction existentielle à valeur collective. Le pluriel français désigne naturellement cette catégorie de personnes liées à des pratiques sexuelles cultuelles illicites, sans reprendre le traditionnel « sodomites », trompeur.
- source_word: הָיָה בָאָרֶץ
  choice: Il y avait dans le pays
  rationale: Rend l’emploi existentiel de היה avec son complément de lieu; l’accord conceptuel permet ensuite le pluriel collectif français.
- source_word: עָשׂוּ
  choice: Ils commirent
  rationale: Dans le contexte des « abominations », « commettre » est idiomatique en français tout en conservant la portée morale du verbe et de son complément.
- source_word: כְּכֹל הַתּוֹעֲבֹת
  choice: toutes les abominations
  rationale: Formulation française concise qui exprime leur conformité à l’ensemble des pratiques condamnées; « abominations » conserve le poids moral et religieux de תּוֹעֵבָה.
- source_word: הַגּוֹיִם
  choice: des nations
  rationale: Désigne ici les peuples non israélites de Canaan sans introduire les connotations plus tardives de « païens » ou de « Gentils ».
- source_word: הוֹרִישׁ
  choice: avait chassées
  rationale: Le hiphil de ירשׁ exprime ici l’expulsion et la dépossession des habitants antérieurs; le plus-que-parfait marque l’antériorité.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui le rend comme un nom propre plutôt que de le remplacer par un titre.
- source_word: מִפְּנֵי
  choice: devant
  rationale: Conserve l’image spatiale de l’hébreu dans la formule de l’expulsion devant Israël.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Préserve l’expression familiale masculine de l’hébreu, tout en restant intelligible comme désignation collective du peuple.
theological_decisions:
- issue: Sens de קָדֵשׁ dans un contexte de culte illicite et de pratique sexuelle
  choice: des prostitués sacrés
  alternative: un prostitué sacré; des prostitués de temple; des hommes voués à un culte illicite
  rationale: Le terme masculin désigne des personnes associées à un culte interdit et traditionnellement comprises comme pratiquant une prostitution cultuelle. La traduction garde cette dimension tout en signalant en note les possibilités lexicales et le singulier hébreu.
- issue: Identification du sujet pluriel de עָשׂוּ
  choice: Ils
  alternative: Les habitants du pays; les Judéens
  rationale: Le texte hébreu laisse le sujet implicite. Le pronom conserve cette continuité et évite d’expliciter plus que la source.
- issue: Rendu de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites; le peuple d’Israël
  rationale: La formulation source est conservée sans neutraliser son image généalogique.
- issue: Rendu du tétragramme יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le nom propre est rendu directement dans sa forme française usuelle, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. « Prostitués sacrés » est compréhensible mais volontairement accompagné d’une note afin d’éviter que « sacrés » soit perçu comme une approbation. « Abominations » maintient la force religieuse et morale du texte; « fils d’Israël » en conserve la forme généalogique.
