  naturalness: Le français est sobre et globalement naturel. « Prostitués cultuels » est plus idiomatique et plus précis dans ce contexte que « prostitués sacrés », où « sacré » peut suggérer une qualification positive ou une sainteté effective. « Se livrèrent à toutes les abominations » est une formulation française naturelle qui restitue le sens contextuel de la comparaison hébraïque.
  terminology: '« Yahvé », « les fils d’Israël » et « abominations » sont cohérents avec les choix du projet et avec le registre du passage. Le sens précis de קָדֵשׁ demeure débattu : la note doit présenter « prostitué cultuel » comme le rendu retenu tout en signalant l’alternative moins spécifique, sans affirmer au-delà de ce que le terme permet d’établir.'
