  text: וַ/יִּקְבְּר֥וּ אֹת֛/וֹ וַ/יִּסְפְּדוּ ל֖/וֹ כָּל יִשְׂרָאֵ֑ל כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥הוּ הַ/נָּבִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: fr
  text: Ils l’enterrèrent, et tout Israël le pleura, selon la parole de Yahweh, qu’il avait prononcée par l’intermédiaire de son serviteur, le prophète Ahija[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de son serviteur, le prophète Ahija » ; cette expression signifie ici « par l’intermédiaire de son serviteur, le prophète Ahija ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Ils l’enterrèrent
  rationale: Le qal narratif de קבר désigne simplement l’action d’enterrer. Le pronom « l’ » renvoie au fils décédé dans le contexte.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: le pleura
  rationale: ספד désigne les manifestations de deuil à la mort de quelqu’un. « Le pleura » est naturel en français moderne et conserve l’idée de lamentation funèbre sans en préciser indûment la forme.
- source_word: כָּל יִשְׂרָאֵל
  choice: tout Israël
  rationale: Expression collective conventionnelle désignant l’ensemble du peuple d’Israël.
- source_word: כִּדְבַר יְהוָה
  choice: conformément à la parole que Yahweh avait prononcée
  rationale: La préposition כְּ exprime ici la conformité entre l’événement et la parole prophétique antérieure. Cette formulation française conserve le motif de l’accomplissement de la parole.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre.
- source_word: בְּיַד עַבְדּוֹ
  choice: par l’intermédiaire de son serviteur
  rationale: Littéralement « par la main de son serviteur », cette tournure hébraïque indique l’intermédiaire par lequel la parole a été communiquée.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: le prophète Ahija
  rationale: Le nom propre suit sa forme française usuelle, et le titre défini identifie sa fonction.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin. « Yahweh » le préserve comme nom propre sans lui substituer un titre.
- issue: Médiation prophétique exprimée par בְּיַד עַבְדּוֹ
  choice: par l’intermédiaire de son serviteur
  alternative: par la main de son serviteur
  rationale: Le choix exprime clairement l’intermédiation d’Ahija en français actuel, sans ajouter de précision doctrinale sur son mode.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit historique écrit ; « le pleura » rend de façon concise le deuil public exprimé par le verbe hébreu.
