  naturalness: Le français est globalement naturel et le passé simple convient au récit biblique. « Selon la parole de Yahweh, qu’il avait prononcée… » est à la fois plus idiomatique dans ce registre et plus transparent quant à l’antécédent de la relative.
  terminology: « Yahweh », « son serviteur » et « le prophète Ahija » sont cohérents avec les choix fournis. « Par l’intermédiaire de » rend fidèlement l’idiome hébreu בְּיַד sans le calquer artificiellement.
