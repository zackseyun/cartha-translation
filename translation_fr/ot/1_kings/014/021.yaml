source:
  edition: WLC
  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: fr
  text: Roboam, fils de Salomon, régna en Juda[a]. Roboam avait quarante et un ans lorsqu’il devint roi, et il régna dix-sept ans à Jérusalem, la ville que Yahweh avait choisie parmi toutes les tribus d’Israël pour y placer son nom[b]. Sa mère s’appelait Naama, l’Ammonite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « régna sur Juda ».'
    reason: Alternative syntaxique pour la préposition ב dans un contexte royal.
  - marker: b
    text: 'Littéralement : « pour y mettre son nom ». Cette expression d’alliance désigne le lieu spécialement associé à la présence et au culte de Yahweh.'
    reason: La note préserve le sens littéral de l’expression hébraïque et en éclaire la portée culturelle et théologique.
lexical_decisions:
- source_word: מָלַךְ בִּיהוּדָה
  choice: régna en Juda
  rationale: Le verbe désigne l’exercice de la royauté, et la préposition ב est rendue au plus près par « en ». « Régna sur Juda » reste possible et est signalé en note.
- source_word: בְּמָלְכוֹ
  choice: lorsqu’il devint roi
  rationale: La préposition suivie de l’infinitif construit situe l’âge de Roboam au moment de son accession au trône.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: pour y établir son nom
  rationale: Cette formulation française naturelle conserve l’image hébraïque du nom divin mis en ce lieu, sans la développer en paraphrase sur la présence ou l’habitation.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: parmi toutes les tribus d’Israël
  rationale: La préposition מִן exprime ici une sélection opérée au sein de l’ensemble des tribus.
- source_word: וְשֵׁם אִמּוֹ נַעֲמָה
  choice: Sa mère s’appelait Naama
  rationale: Cette tournure actuelle et naturelle rend fidèlement la formule hébraïque « le nom de sa mère était ».
- source_word: הָעַמֹּנִית
  choice: l’Ammonite
  rationale: Le gentilé féminin identifie l’origine ethnique de Naama; « l’Ammonite » est concis, clair et non archaïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Expression « établir son nom »
  choice: conserver l’expression imagée avec une note explicative
  alternative: paraphraser par « manifester sa présence » ou « être adoré »
  rationale: L’hébreu associe le lieu choisi au nom de Yahweh. La traduction conserve cette formulation théologiquement riche sans réduire son sens à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit la notice royale hébraïque sans calquer ses lourdeurs. « Yahweh » conserve le nom divin; « Naama » suit une translittération française simple.
