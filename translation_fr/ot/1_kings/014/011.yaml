  rationale: La révision remplace « parmi les gens de Jéroboam » par « de la maison de Jéroboam », sens contextuellement précis de la formule hébraïque, et reformule les deux membres au pluriel distributif. Cela garantit que les morts dans les champs, comme ceux dans la ville, sont bien ceux de la maison de Jéroboam. La note b de l’audit est également rétablie avec son ancre.
