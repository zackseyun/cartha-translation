  terminology: « Maison de Jéroboam » correspond au sens contextuel de l’expression et évite l’extension indéterminée de « les gens de Jéroboam ». « Yahvé » est une translittération française courante du tétragramme. « Oiseaux du ciel » est idiomatique et directement lié à l’hébreu.
