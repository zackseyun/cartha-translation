  text: הַ/מֵּ֨ת לְ/יָֽרָבְעָ֤ם בָּ/עִיר֙ יֹאכְל֣וּ הַ/כְּלָבִ֔ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י יְהוָ֖ה דִּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: fr
  text: Ceux de la maison de Jéroboam qui mourront dans la ville[a], les chiens les mangeront ; et ceux qui mourront dans les champs, les oiseaux du ciel[b] les mangeront, car Yahvé a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le mort de Jéroboam » ; c’est-à-dire une personne appartenant à la maison de Jéroboam qui viendra à mourir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les oiseaux des cieux » ; traditionnellement : « les oiseaux de l’air ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: Quiconque, parmi les gens de Jéroboam, mourra
  rationale: La tournure hébraïque désigne de manière distributive les personnes rattachées à Jéroboam, et non Jéroboam seul. « Les gens de Jéroboam » conserve cette relation sans la limiter explicitement à la famille biologique.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Rendu locatif direct et naturel du nom défini au singulier.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: les chiens le mangeront
  rationale: Le verbe אָכַל signifie directement « manger ». Le pronom objet, nécessaire en français, reprend « quiconque » sans renforcer l’image par « dévorer ».
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: et quiconque mourra dans les champs
  rationale: La formulation reprend le parallélisme distributif de la première proposition. « Dans les champs » est une expression française naturelle pour le domaine extérieur opposé à la ville.
- source_word: עוֹף הַשָּׁמָיִם
  choice: les oiseaux du ciel
  rationale: Le collectif עוֹף est rendu au pluriel en français ; « du ciel » traduit directement הַשָּׁמָיִם dans cette expression usuelle.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: car Yahvé a parlé
  rationale: כִּי introduit ici le fondement et la certitude du jugement. Le parfait דִּבֵּר est naturellement rendu par le passé composé, et le nom divin est translittéré.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente le nom propre en français et évite de le remplacer par un titre.
- issue: Étendue de l’expression לְיָרָבְעָם
  choice: les gens de Jéroboam
  alternative: la maison de Jéroboam
  rationale: Le lien exprimé par לְ peut viser la maisonnée ou la lignée de Jéroboam. Le texte principal garde une formulation large, tandis que la note signale la tournure littérale et son sens contextuel.
translation_notes:
  register: Français moderne, soutenu mais courant. Le parallélisme et la violence sobre de l’hébreu sont conservés. Le futur rend les imparfaits hébreux dans cette annonce de jugement.
