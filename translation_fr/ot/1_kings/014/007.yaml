source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: fr
  text: 'Va dire à Jéroboam : « Voici ce que dit Yahweh, le Dieu d’Israël : Puisque je t’ai élevé[a] du milieu du peuple et que je t’ai établi dirigeant[b] sur mon peuple Israël,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je t’ai exalté ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « je t’ai nommé chef ». Littéralement : « je t’ai donné comme dirigeant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: Va dire
  rationale: Les deux impératifs féminins s’adressent à la femme de Jéroboam. « Va dire » est naturel en français et conserve l’ordre de transmettre le message.
- source_word: לְיָרָבְעָם
  choice: à Jéroboam
  rationale: La préposition לְ introduit le destinataire du message; le nom est rendu selon sa forme française usuelle.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française actuelle rend clairement la formule solennelle du messager prophétique sans archaïsme inutile.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction qui identifie Yahweh comme le Dieu d’Israël.
- source_word: יַעַן אֲשֶׁר
  choice: Puisque
  rationale: Introduit la cause sur laquelle repose la déclaration de jugement qui se poursuit dans les versets suivants.
- source_word: הֲרִימֹתִיךָ
  choice: je t’ai élevé
  rationale: Le hifil de רום exprime ici l’élévation de Jéroboam à une position supérieure; « élevé » garde à la fois l’image et le sens politique.
- source_word: מִתּוֹךְ הָעָם
  choice: du milieu du peuple
  rationale: Rend l’idée d’une sélection opérée au sein même du peuple tout en restant idiomatique en français.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: je t’ai établi dirigeant
  rationale: Littéralement « je t’ai donné comme dirigeant »; « établi » exprime naturellement l’acte de nomination, et « dirigeant » désigne une autorité officielle sans suggérer indûment un titre dynastique.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: sur mon peuple Israël
  rationale: Conserve la préposition d’autorité, le possessif divin et l’apposition « Israël ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel dans une translittération courante sans le remplacer par un titre.
- issue: Portée politique de נָגִיד
  choice: dirigeant
  alternative: chef; prince; souverain
  rationale: Le terme désigne celui qui est placé en autorité sur Israël. « Dirigeant » exprime cette fonction sans importer un rang princier héréditaire ni préciser davantage la nature de la royauté.
- issue: Phrase causale laissée ouverte
  choice: maintien de la virgule finale
  alternative: transformer le segment en phrase autonome
  rationale: « Puisque » ouvre une proposition dont la conséquence apparaît dans la suite du discours. Conserver cette suspension respecte la syntaxe et la tension du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique reste solennelle, tandis que « Voici ce que dit » évite un tour inutilement archaïque. Les guillemets français ouvrent la citation, qui demeure syntaxiquement inachevée à la fin du verset comme en hébreu.
