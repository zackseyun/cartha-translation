source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: fr
  text: J’ai arraché le royaume à la maison de David[a] et je te l’ai donné. Mais tu n’as pas été comme David, mon serviteur, qui a gardé mes commandements et qui a marché à ma suite de tout son cœur, ne faisant que ce qui est droit à mes yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « maison de David » désigne ici la dynastie de David, c’est-à-dire sa lignée royale.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: J’ai arraché
  rationale: Le verbe קרע signifie littéralement « déchirer ». Avec le royaume comme objet et un complément introduit par « à », « arracher » conserve en français l’image vive d’une séparation forcée sans suggérer que le royaume lui-même a été mis en pièces.
- source_word: הַמַּמְלָכָה
  choice: le royaume
  rationale: מַמְלָכָה désigne ici le royaume comme entité politique; « royaume » est le terme français naturel et précis.
- source_word: מִבֵּית דָּוִד
  choice: à la maison de David
  rationale: Cette formulation conserve l’expression dynastique hébraïque « maison de David »; une note en explicite le sens.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: et je te l’ai donné
  rationale: La séquence narrative rapporte une action passée; le pronom « l’ » reprend « le royaume ».
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: Mais tu n’as pas été comme David, mon serviteur
  rationale: Le passé composé exprime naturellement en français le constat portant sur la conduite de Jéroboam jusqu’au moment de l’accusation. L’apposition « David, mon serviteur » est fluide et fidèle.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte royal et relationnel, עֶבֶד est un titre de service honorable devant Dieu; « serviteur » convient mieux que « esclave ».
- source_word: שָׁמַר מִצְוֺתַי
  choice: a gardé mes commandements
  rationale: שׁמר associé aux commandements signifie les garder ou les observer. « Garder mes commandements » préserve le vocabulaire biblique tout en restant clair.
- source_word: הָלַךְ אַחֲרַי
  choice: a marché à ma suite
  rationale: Cette traduction maintient la métaphore hébraïque de la marche derrière Dieu, tout en étant plus idiomatique en français que « marcher après moi ».
- source_word: בְּכָל לְבָבוֹ
  choice: de tout son cœur
  rationale: Expression française naturelle correspondant à l’idée hébraïque d’une adhésion intérieure entière et sans partage.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר
  choice: ne faisant que ce qui est droit
  rationale: La tournure participiale relie naturellement l’action à la marche fidèle de David et rend explicitement רַק, « seulement ».
- source_word: הַיָּשָׁר בְּעֵינָי
  choice: ce qui est droit à mes yeux
  rationale: La formulation conserve l’idiome hébraïque « à mes yeux », compréhensible en français, et souligne l’évaluation divine.
theological_decisions:
- issue: Présentation de David comme modèle malgré les péchés rapportés ailleurs
  choice: Conserver sans atténuation l’évaluation positive propre à ce verset.
  alternative: Ajouter une restriction telle que « dans l’ensemble » ou « généralement ».
  rationale: Le verset oppose directement David à Jéroboam et affirme que David a gardé les commandements de Dieu et n’a fait que ce qui était droit à ses yeux. Ajouter une nuance harmonisante effacerait la tension avec d’autres passages, notamment 1 Rois 15.5.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu sans produire de calques opaques. « Marcher à ma suite » préserve la métaphore source; « ne faisant que » rend רַק avec naturel. Le marqueur [a] figure immédiatement après l’expression expliquée.
