  text: וְ/לָקַ֣חַתְּ בְּ֠/יָדֵ/ךְ עֲשָׂרָ֨ה לֶ֧חֶם וְ/נִקֻּדִ֛ים וּ/בַקְבֻּ֥ק דְּבַ֖שׁ וּ/בָ֣את אֵלָ֑י/ו ה֚וּא יַגִּ֣יד לָ֔/ךְ מַה יִּֽהְיֶ֖ה לַ/נָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: fr
  text: Prends avec toi dix pains, des gâteaux et un pot de miel, puis va le trouver. Il te dira ce qui arrivera au garçon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחַתְּ בְּיָדֵךְ
  choice: Prends avec toi
  rationale: L’expression signifie littéralement « prends dans ta main »; en français actuel, « prends avec toi » restitue naturellement l’idée d’emporter.
- source_word: עֲשָׂרָה לֶחֶם
  choice: dix pains
  rationale: Le numéral est explicite, et לֶחֶם désigne ici des pains comptables plutôt que le pain comme matière.
- source_word: וְנִקֻּדִים
  choice: quelques gâteaux
  rationale: Le terme désigne vraisemblablement des produits de boulangerie ponctués ou émiettés; « quelques gâteaux » demeure naturel sans préciser une forme incertaine.
- source_word: וּבַקְבֻּק דְּבַשׁ
  choice: un pot de miel
  rationale: בַּקְבֻּק est un petit récipient ou flacon; « pot » convient idiomatiquement au miel en français moderne.
- source_word: וּבָאת אֵלָיו
  choice: puis va le trouver
  rationale: Le verbe de mouvement suivi de אֵלָיו exprime ici le fait de se rendre auprès de lui; cette formulation évite le calque « viens vers lui ».
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: ce qui arrivera au garçon
  rationale: Rend directement la question sur le devenir ou le sort futur du jeune garçon sans en préciser l’issue.
