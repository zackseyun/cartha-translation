reference: 1 Kings 14:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: fr
  text: Yahweh suscitera pour lui-même un roi sur Israël, qui retranchera la maison de Jéroboam ce jour même. Mais quoi ? Maintenant même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin de l’hébreu est abrupte et difficile : littéralement, « et quoi ? même maintenant ». Certains y voient une exclamation qui souligne l’imminence du jugement, par exemple : « Et quoi ? Maintenant même ! » ou « Mais quoi de plus ? Déjà maintenant. »'
    reason: Lecture alternative d’une expression hébraïque elliptique et incertaine.
lexical_decisions:
- source_word: וְהֵקִים
  choice: suscitera
  rationale: Le hiphil de קום peut signifier « faire se lever », « susciter » ou « établir ». « Suscitera » exprime ici que Yahweh fera apparaître ce roi, sans préciser les modalités de son accession au trône.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לּוֹ
  choice: pour lui-même
  rationale: 'Le pronom renvoie le plus naturellement au sujet Yahweh : il suscitera ce roi pour accomplir son propre dessein.'
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: un roi sur Israël
  rationale: Avec un roi, עַל exprime naturellement l'autorité exercée sur un peuple.
- source_word: אֲשֶׁר יַכְרִית
  choice: qui retranchera
  rationale: Le hiphil de כרת signifie ici retrancher, éliminer ou faire disparaître. « Retranchera » conserve l'image et la force judiciaire de l'expression hébraïque.
- source_word: בֵּית יָרָבְעָם
  choice: la maison de Jéroboam
  rationale: « Maison » conserve le terme dynastique du récit biblique sans le réduire explicitement à la seule notion de dynastie.
- source_word: זֶה הַיּוֹם
  choice: dès ce jour
  rationale: La formulation garde la référence littérale à « ce jour » tout en produisant une tournure française naturelle dans ce contexte temporel.
- source_word: וּמֶה גַּם עָתָּה
  choice: Mais quoi ? Dès maintenant.
  rationale: La formule hébraïque est abrupte et elliptique. Cette traduction en conserve la rupture et l'accent sur l'immédiateté sans reconstruire une proposition absente du texte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; sa translittération préserve le nom divin au lieu de le remplacer par un titre.
- issue: Interprétation de la proposition difficile וּמֶה גַּם עָתָּה
  choice: 'Maintenir l''ellipse : « Mais quoi ? Dès maintenant. »'
  alternative: Le jugement commence déjà maintenant.
  rationale: La syntaxe hébraïque est comprimée et son sens exact demeure incertain. La traduction conserve donc sa tension plutôt que d'expliciter une interprétation particulière.
translation_notes:
  register: Français international moderne, digne et lisible. « Suscitera » et « retranchera » conservent la couleur du récit biblique tout en restant compréhensibles ; la fin volontairement heurtée reproduit l'ambiguïté de l'hébreu.
