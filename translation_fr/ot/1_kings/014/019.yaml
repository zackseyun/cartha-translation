base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: fr
  text: 'Le reste des actes de Jéroboam[a], comment il combattit et comment il régna : tout cela est consigné[b] dans le livre des Annales des rois d’Israël[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le reste des affaires de Jéroboam ». Dans cette formule royale, « actes » désigne les faits et gestes consignés à son sujet.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une tournure présentative, littéralement : « voici qu’ils sont écrits », qui attire l’attention sur le document mentionné.'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit d’annales royales ou d’un document historique officiel, et non des livres bibliques de 1 et 2 Chroniques.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: Le reste des actes de Jéroboam
  rationale: Dans cette formule de bilan royal, דִּבְרֵי désigne largement les faits et gestes ou les affaires du roi. « Actes » restitue ce sens de manière concise et idiomatique.
- source_word: אֲשֶׁר נִלְחַם
  choice: ses guerres
  rationale: Le verbe נלחם signifie « combattre, faire la guerre ». La nominalisation française s’intègre naturellement à l’énumération récapitulative sans préciser davantage que l’hébreu.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: et son règne
  rationale: Le verbe מלך signifie ici « régner ». « Son règne » forme un parallèle naturel avec « ses guerres » et couvre ce que rapporte la source sur son activité royale.
- source_word: הִנָּם כְּתוּבִים
  choice: tout cela est écrit
  rationale: הִנָּם attire l’attention sur les éléments qui viennent d’être mentionnés. « Tout cela » rend cette reprise présentative en français moderne, tandis que « est écrit » conserve le participe passif de כתב.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dans le livre des Annales
  rationale: Bien que עַל signifie littéralement « sur », le français dit naturellement qu’un contenu est écrit « dans » un livre. דִּבְרֵי הַיָּמִים désigne ici des annales royales.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: des rois d’Israël
  rationale: Dans le titre de ce document royal, le ל exprime le rapport aux rois d’Israël; « des rois d’Israël » est la formulation française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure du bilan royal tout en remplaçant un littéral « voici, ils sont écrits » par la tournure française naturelle « tout cela est écrit ». La majuscule à « Annales » signale le titre conventionnel du document, sans l’identifier au livre biblique des Chroniques.
