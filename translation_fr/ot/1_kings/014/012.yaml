  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: fr
  text: Quant à toi, lève-toi et va chez toi. Dès que tes pieds entreront dans la ville, l’enfant mourra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: Quant à toi
  rationale: La conjonction jointe au pronom indépendant féminin singulier introduit ici un changement d’adresse emphatique; « Quant à toi » restitue naturellement cette mise en relief sans forcer une opposition.
- source_word: ק֖וּמִי
  choice: lève-toi
  rationale: L’impératif de קום appelle à se mettre en mouvement. « Lève-toi » est actuel, digne et plus naturel en français moderne que « debout » ou « lève-toi donc ».
- source_word: לְכִ֣י לְ/בֵיתֵ֑/ךְ
  choice: retourne chez toi
  rationale: Dans le contexte, la femme doit repartir vers sa maison. « Retourne chez toi » exprime idiomatiquement la destination et le retour implicite, tandis que « va à ta maison » serait peu naturel.
- source_word: בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ
  choice: Au moment où tes pieds entreront
  rationale: ב suivi de l’infinitif construit marque le moment de l’action. Le maintien de « tes pieds » préserve l’image concrète et l’idiome d’arrivée du texte hébreu.
- source_word: הָ/עִ֖ירָ/ה
  choice: dans la ville
  rationale: Le suffixe directionnel indique un mouvement vers l’intérieur de la ville; avec « entrer », le français demande naturellement « dans la ville ».
- source_word: וּ/מֵ֥ת
  choice: mourra
  rationale: Dans cette annonce prophétique, la forme verbale exprime le résultat futur certain. Le futur simple français le rend clairement sans ajouter un « alors » absent du texte.
- source_word: הַ/יָּֽלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon. Ici, le référent est identifié sans que son sexe soit mis en relief; « l’enfant » convient au contexte et conserve la portée du terme.
