  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲחִיָּ֜הוּ אֶת ק֤וֹל רַגְלֶ֨י/הָ֙ בָּאָ֣ה בַ/פֶּ֔תַח וַ/יֹּ֕אמֶר בֹּ֖אִי אֵ֣שֶׁת יָרָבְעָ֑ם לָ֣/מָּה זֶּ֗ה אַ֚תְּ מִתְנַכֵּרָ֔ה וְ/אָ֣נֹכִ֔י שָׁל֥וּחַ אֵלַ֖יִ/ךְ קָשָֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: fr
  text: 'Lorsque Ahija entendit le bruit de ses pas, alors qu’elle arrivait à l’entrée, il dit : « Entre, femme de Jéroboam. Pourquoi te déguises-tu ? J’ai été envoyé vers toi avec un message grave[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’ai été envoyé vers toi, dure » ; l’adjectif féminin est employé sans nom exprimé. Il peut sous-entendre un message ou une nouvelle grave.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: le bruit de ses pas
  rationale: Cette formulation française naturelle conserve l’image auditive de l’hébreu sans l’étrangeté de « le bruit de ses pieds ».
- source_word: בָּאָה בַפֶּתַח
  choice: au moment où elle franchissait l’entrée
  rationale: Le contexte décrit son arrivée à l’ouverture de la maison; « franchissait l’entrée » exprime naturellement son mouvement vers l’intérieur sans identifier פתח à une porte matérielle.
- source_word: בֹּאִי
  choice: Entre
  rationale: Impératif féminin singulier, rendu de façon directe et idiomatique en français.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: femme de Jéroboam
  rationale: La tournure conserve la relation construite de l’hébreu et convient à l’interpellation directe.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: Pourquoi te déguises-tu ?
  rationale: Le hitpael de נכר indique ici qu’elle cherche à ne pas être reconnue ou à passer pour une autre personne, conformément au contexte immédiat.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: J’ai été envoyé vers toi
  rationale: Le participe passif exprime l’état résultant d’un envoi; le passé composé est naturel en français et préserve l’idée de mission sans expliciter l’auteur de l’envoi.
- source_word: קָשָׁה
  choice: avec un message accablant
  rationale: L’adjectif féminin est employé elliptiquement, sans nom exprimé. « Message » explicite sobrement l’implicite prophétique, tandis qu’« accablant » communique la gravité de ce qui sera annoncé.
theological_decisions:
- issue: Nom implicite après קָשָׁה
  choice: avec un message accablant
  alternative: une dure nouvelle / chargé d’une parole sévère
  rationale: L’hébreu dit littéralement qu’Ahija est « envoyé vers toi, dure », en laissant le substantif sous-entendu. Le contexte favorise un message ou une nouvelle grave, mais la note conserve l’ellipse et son ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. « Ahija » et « Jéroboam » suivent les formes françaises bibliques usuelles. La syntaxe reste fluide tout en conservant l’ellipse hébraïque dans une note.
