revisions:
- from: 'Lorsque Ahija entendit le bruit de ses pas au moment où elle franchissait l’entrée, il dit : « Entre, femme de Jéroboam. Pourquoi te déguises-tu ? J’ai été envoyé vers toi avec un message accablant.[a] »'
  to: 'Lorsque Ahija entendit le bruit de ses pas, alors qu’elle arrivait à l’entrée, il dit : « Entre, femme de Jéroboam. Pourquoi te déguises-tu ? J’ai été envoyé vers toi avec un message grave[a]. »'
  rationale: La révision limite le mouvement de la femme à son arrivée à l’entrée, conformément à l’hébreu, et clarifie la note sur l’adjectif elliptique. Elle conserve la mission implicite et le caractère grave de l’annonce, sans imposer un substantif ou une interprétation théologique plus précise que le texte ne le permet.
