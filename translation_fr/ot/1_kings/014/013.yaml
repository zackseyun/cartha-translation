base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: fr
  text: Tout Israël prendra le deuil pour lui et l’enterrera, car lui seul, de la maison de Jéroboam, sera mis au tombeau[a], parce qu’on a trouvé en lui quelque chose de bon à l’égard de Yahweh[b], le Dieu d’Israël, dans la maison de Jéroboam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lui seul viendra à Jéroboam, au tombeau ». La construction est difficile ; dans le contexte, le sens est qu’il sera le seul membre de la maison de Jéroboam à recevoir une sépulture.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « quelque chose de bon envers Yahweh » ou « quelque chose d’agréable à Yahweh ». L’hébreu peut désigner une disposition orientée vers Yahweh ou une qualité favorable à ses yeux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: portera son deuil
  rationale: Le verbe ספד désigne les lamentations ou le deuil pour un mort. Cette tournure française est naturelle et convient au deuil collectif.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: et l’enterrera
  rationale: Le sujet collectif « Tout Israël » appelle naturellement le singulier en français.
- source_word: כִּי זֶה לְבַדּוֹ
  choice: car lui seul
  rationale: Cette formulation exprime clairement l’exclusivité marquée par לְבַדּוֹ.
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: dans la maison de Jéroboam, entrera dans une tombe
  rationale: La construction hébraïque est difficile. Le contexte indique qu’il sera le seul membre de la maison de Jéroboam à recevoir une sépulture; la formulation conserve toutefois l’image littérale de l’entrée dans une tombe.
- source_word: דָּבָר טוֹב
  choice: quelque chose de bon
  rationale: Cette expression garde le caractère indéfini et général de l’hébreu.
- source_word: אֶל יְהוָה
  choice: envers Yahweh
  rationale: « Envers » préserve l’orientation relationnelle de אֶל sans préciser s’il s’agit d’une disposition dirigée vers Yahweh ou d’une qualité qui lui est agréable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu.
- source_word: בְּבֵית יָרָבְעָם
  choice: dans la maison de Jéroboam
  rationale: « Maison » conserve la nuance familiale et dynastique de בַּיִת dans ce contexte.
theological_decisions:
- issue: Sens de « quelque chose de bon envers Yahweh »
  choice: Conserver la formulation relationnelle ouverte « quelque chose de bon envers Yahweh »
  alternative: « quelque chose d’agréable à Yahweh » ou « une bonne disposition envers Yahweh »
  rationale: L’hébreu אֶל peut exprimer une orientation vers Yahweh ou une relation favorable à son égard. Le texte ne précise pas explicitement la nature du bien constaté.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique est conservé; « maison » maintient la portée familiale et dynastique. La syntaxe a été légèrement réorganisée pour être intelligible en français sans effacer l’ambiguïté de l’hébreu.
