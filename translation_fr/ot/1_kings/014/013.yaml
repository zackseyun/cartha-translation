  source_fidelity: Le sens contextuel de יָבֹא לְיָרָבְעָם אֶל־קָבֶר est correctement compris comme l’exception de sépulture accordée à ce seul membre de la maison de Jéroboam. Toutefois, « entrera dans une tombe » est trop littéral et peu naturel en français, et peut suggérer une action physique plutôt que la réception d’une sépulture. La relation finale « dans la maison de Jéroboam » est maintenue, comme dans l’hébreu, avec la répétition significative de la maison/dynastie.
  naturalness: « Tout Israël prendra le deuil pour lui » et « sera mis au tombeau » sont idiomatiques dans un registre biblique moderne et accessible. « Quelque chose de bon à l’égard de Yahweh » est plus naturel que « quelque chose de bon envers Yahweh » tout en laissant ouverte la nuance de אֶל.
  terminology: « Yahweh », « Dieu d’Israël » et « maison de Jéroboam » sont appropriés. « Maison » conserve la portée à la fois familiale et dynastique de בַּיִת. « Au tombeau » rend naturellement l’idée de sépulture sans imposer une interprétation théologique.
