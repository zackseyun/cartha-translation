  to: Tout Israël prendra le deuil pour lui et l’enterrera, car lui seul, de la maison de Jéroboam, sera mis au tombeau[a], parce qu’on a trouvé en lui quelque chose de bon à l’égard de Yahweh[b], le Dieu d’Israël, dans la maison de Jéroboam.
  rationale: La révision remplace une image française artificielle par une expression naturelle qui transmet le sens funéraire contextuellement requis, tout en conservant dans la note l’ambiguïté de la construction hébraïque. Elle améliore aussi la formulation de la relation à Yahweh sans en réduire l’ouverture sémantique.
