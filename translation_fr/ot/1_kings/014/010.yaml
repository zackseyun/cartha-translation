  verdict: revise
  source_fidelity: 'Le sens général de l’oracle est fidèlement rendu : calamité, retranchement total des mâles et image volontairement dégradante des excréments. Toutefois, « jusqu’aux derniers restes de la maison de Jéroboam » interprète et amplifie אַחֲרֵי (« après / derrière ») en faisant explicitement de la maison des « restes ». Il est plus sûr de rendre directement l’élimination de la maison tout en conservant la comparaison finale.'
  naturalness: Le français est moderne, clair et d’un registre solennel approprié. « Balayer la maison de Jéroboam, comme on balaie les excréments » est naturel dans le cadre de cette image de suppression complète et évite l’ajout interprétatif de « derniers restes ».
  terminology: « Malheur », « retrancher », « tout mâle », « esclave ou libre » et « excréments » conviennent. La note b conserve à juste titre l’incertitude de עָצוּר וְעָזוּב et ne présente pas l’équivalence sociale comme assurée.
