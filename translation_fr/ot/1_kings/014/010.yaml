source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: fr
  text: C’est pourquoi, voici que je vais faire venir le malheur sur la maison de Jéroboam. Je retrancherai de chez Jéroboam tout mâle[a], esclave ou libre[b] en Israël, et je balaierai la maison de Jéroboam, comme on balaie les excréments jusqu’à ce qu’il n’en reste plus rien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quiconque urine contre un mur », expression hébraïque crue désignant les personnes de sexe masculin.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou peut-être : « celui qui est retenu comme celui qui est laissé libre ». Le sens précis de l’expression hébraïque est incertain ; elle semble désigner tous sans exception.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: malheur
  rationale: Dans cet oracle de jugement, le nom désigne une calamité infligée, non le mal moral. « Malheur » est naturel en français et conserve la gravité de la menace.
- source_word: וְהִכְרַתִּי
  choice: je retrancherai
  rationale: Le verbe כרת évoque ici l’élimination complète de personnes et de la lignée; « retrancher » conserve l’image et le registre solennel du jugement.
- source_word: מַשְׁתִּין בְּקִיר
  choice: tout mâle
  rationale: L’expression hébraïque, littéralement « celui qui urine contre un mur », est une désignation crue des personnes de sexe masculin. Le texte rend clairement le référent et la note conserve la forme de l’idiome.
- source_word: עָצוּר וְעָזוּב
  choice: esclave ou libre
  rationale: Le sens exact de cette formule figée est discuté. Cette traduction traditionnelle et plausible la comprend comme un mérisme indiquant toutes les catégories sociales, sans exception, tout en signalant l’incertitude en note.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: je balaierai jusqu’aux derniers restes de la maison de Jéroboam
  rationale: בער, éclairé par la comparaison avec l’enlèvement des excréments, exprime ici une élimination totale. אַחֲרֵי peut désigner ce qui reste derrière; cette formulation rend donc l’idée des derniers restes sans reproduire un français obscur.
- source_word: הַגָּלָל
  choice: les excréments
  rationale: Le terme est délibérément cru et méprisant. « Excréments » garde la force de l’image dans un registre français digne mais non édulcoré.
- source_word: עַד תֻּמּוֹ
  choice: jusqu’à ce qu’il n’en reste plus rien
  rationale: La locution marque l’achèvement total de l’élimination; cette formulation est idiomatique et explicite en français moderne.
theological_decisions:
- issue: Préserver la sévérité de l’oracle divin de jugement
  choice: Employer des termes directs — « faire venir le malheur », « retrancher », « excréments » — et exprimer l’élimination totale de la dynastie.
  alternative: Atténuer le passage avec « difficultés », « enlever » ou « déchets ».
  rationale: L’hébreu présente volontairement un jugement grave et une comparaison méprisante. La traduction ne doit ni adoucir cette violence rhétorique ni lui ajouter une interprétation confessionnelle.
- issue: Portée de עָצוּר וְעָזוּב
  choice: « esclave ou libre », avec une note indiquant l’incertitude et la valeur probable de totalité.
  alternative: « retenu ou relâché », « enfermé ou laissé libre », ou une simple paraphrase telle que « sans aucune exception ».
  rationale: La formule est obscure et ne doit pas être présentée comme entièrement certaine. Le choix retenu reste intelligible tout en préservant l’ambiguïté par la note.
translation_notes:
  register: Français international moderne, naturel et solennel. « Voici que » garde la force d’annonce de הִנְנִי sans archaïsme excessif. La répétition de « Jéroboam » et la rudesse de la comparaison finale sont conservées. Les marqueurs [a] et [b] figurent dans le texte aux endroits concernés.
