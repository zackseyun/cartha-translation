    rationale: La construction וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם évoque l’élimination poursuivie après la maison de Jéroboam, et la comparaison indique son caractère total. Elle ne désigne pas explicitement « les derniers restes » de cette maison. Une formulation plus directe préserve mieux l’ambiguïté syntaxique.
