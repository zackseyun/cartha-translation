  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: fr
  text: Chaque fois que le roi entrait dans la maison de Yahweh, les gardes[a] les[b] portaient, puis les rapportaient dans la salle des gardes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les coureurs »; dans ce contexte royal, il s’agit des gardes ou des gardes du corps du roi.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom « les » désigne les boucliers de bronze que Roboam avait fait fabriquer à la place des boucliers d’or emportés par Shishaq (voir 1 Rois 14.26-27).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: Chaque fois que ... entrait
  rationale: La construction מִדֵּי suivie de l’infinitif exprime une action habituelle et répétée. « Chaque fois que » en restitue naturellement la valeur itérative; וַיְהִי sert ici à assurer la continuité narrative sans exiger une traduction distincte.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: « Maison » conserve l’image hébraïque du sanctuaire, tandis que « Yahweh » rend le nom divin personnel יהוה plutôt que de lui substituer un titre.
- source_word: יִשָּׂאוּם
  choice: les portaient
  rationale: L’imparfait, dans ce cadre itératif, décrit l’action coutumière des gardes. Le pronom objet renvoie aux boucliers de bronze mentionnés au verset précédent.
- source_word: הָרָצִים
  choice: les gardes
  rationale: Le sens littéral est « les coureurs », mais, dans le cadre de la cour royale, le terme désigne les hommes qui escortaient et protégeaient le roi. « Gardes » communique clairement leur fonction.
- source_word: וֶהֱשִׁיבוּם
  choice: puis les rapportaient
  rationale: Le hifil de שוב signifie faire revenir ou ramener. « Rapportaient » convient à des objets que l’on remet dans leur lieu de rangement après usage.
- source_word: אֶל תָּא הָרָצִים
  choice: dans la salle des gardes
  rationale: תָּא désigne une pièce ou une salle. « Salle des gardes » préserve le rapport possessif sans imposer le sens plus spécialisé de « corps de garde ».
