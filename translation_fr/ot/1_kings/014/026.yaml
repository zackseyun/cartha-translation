id: 1KI.14.26
reference: 1 Kings 14:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת כָּל מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: fr
  text: Il prit les trésors de la maison de Yahweh[a] et ceux du palais royal ; il prit tout. Il prit aussi tous les boucliers d’or que Salomon avait faits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de Yahweh » désigne ici le temple.
    reason: Clarification de l’expression hébraïque littérale.
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: il prit
  rationale: Le verbe לקח signifie ici simplement « prendre ». La répétition de « prit » conserve l’insistance narrative de l’hébreu sans ajouter la nuance plus forte de « saisir » ou « piller ».
- source_word: אֹצְרוֹת
  choice: trésors
  rationale: Dans ce contexte, le terme désigne les biens précieux emportés plutôt que les locaux où ils étaient conservés.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Cette formulation conserve l’image hébraïque de la « maison » tout en laissant une note préciser qu’il s’agit du temple.
- source_word: בֵּית הַמֶּלֶךְ
  choice: le palais royal
  rationale: Littéralement « la maison du roi ». « Palais royal » exprime naturellement en français moderne la réalité visée dans ce contexte.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: il prit tout
  rationale: Cette formulation brève restitue la force récapitulative et totale de la proposition hébraïque.
- source_word: מָגִנֵּי הַזָּהָב
  choice: les boucliers d’or
  rationale: Cette expression française naturelle correspond précisément à la construction hébraïque.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: que Salomon avait faits
  rationale: Le plus-que-parfait situe clairement la fabrication des boucliers avant leur enlèvement.
- source_word: וַיִּקַּח ... וַיִּקַּח
  choice: Il prit… Il prit aussi
  rationale: La reprise du verbe conserve la structure emphatique de l’hébreu, tandis que « aussi » rend l’enchaînement naturel en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin YHWH. « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre, sans modifier le sens théologique du passage.
translation_notes:
  register: Français international moderne, sobre et narratif. « Palais royal » évite la raideur de « maison du roi », tandis que « maison de Yahweh » préserve l’expression source. La ponctuation met en relief l’affirmation récapitulative « il prit tout ».
