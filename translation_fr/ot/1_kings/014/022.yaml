source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יְהוּדָ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְקַנְא֣וּ אֹת֗/וֹ מִ/כֹּל֙ אֲשֶׁ֣ר עָשׂ֣וּ אֲבֹתָ֔/ם בְּ/חַטֹּאתָ֖/ם אֲשֶׁ֥ר חָטָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: fr
  text: Juda fit ce qui est mal aux yeux du SEIGNEUR et, par les péchés qu’ils commirent, ils provoquèrent sa jalousie[a] plus que ne l’avaient fait tous leurs ancêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rendirent jaloux » ou « éveillèrent sa jalousie ». L’hébreu emploie le langage de la jalousie liée à l’alliance pour décrire la réaction du SEIGNEUR à l’infidélité de Juda.
    reason: alternative lexicale et contexte théologique
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Le nom propre désigne collectivement le royaume et le peuple de Juda. Le passage ultérieur au pluriel est conservé, comme en hébreu.
- source_word: הָרַע
  choice: ce qui est mal
  rationale: Cette formulation française naturelle rend l’expression idiomatique « faire le mal » tout en gardant sa portée morale.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux du SEIGNEUR
  rationale: La traduction conserve la métaphore évaluative hébraïque. Le tétragramme YHWH est rendu par « le SEIGNEUR ».
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: ils provoquèrent sa jalousie
  rationale: Cette formulation préserve le langage de la jalousie divine suscitée par l’infidélité du peuple, sans le réduire à la colère.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: plus que ne l’avaient fait tous leurs ancêtres
  rationale: Le comparatif hébreu est rendu clairement; « ancêtres » exprime ici plus naturellement que « pères » la référence aux générations précédentes.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: par les péchés qu’ils commirent
  rationale: Le français évite la répétition étymologique peu naturelle « les péchés qu’ils péchèrent », tout en conservant la valeur instrumentale de la préposition.
theological_decisions:
- issue: La jalousie divine
  choice: ils provoquèrent sa jalousie
  alternative: ils le rendirent jaloux; ils éveillèrent sa jalousie
  rationale: Le texte évoque la réaction du SEIGNEUR à l’infidélité de Juda dans le cadre de l’alliance. « Provoquèrent sa jalousie » maintient cette catégorie biblique sans suggérer une envie moralement fautive.
- issue: Le passage du singulier au pluriel
  choice: Juda fit… ils commirent… ils provoquèrent
  alternative: Le peuple de Juda fit… il commit… il provoqua
  rationale: L’hébreu présente Juda comme un sujet collectif, puis emploie le pluriel. La traduction conserve cette variation significative plutôt que de l’uniformiser.
translation_notes:
  register: Français international actuel, sobre et digne. Le passé simple convient au récit historique. « Ancêtres » est préféré à « pères » pour éviter une ambiguïté en français moderne, tandis que le changement du singulier collectif « Juda » au pluriel « ils » est volontairement préservé.
