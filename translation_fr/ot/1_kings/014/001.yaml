lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: À cette époque-là
  rationale: La locution signifie littéralement « en/à ce temps-là ». « À cette époque-là » est un marqueur temporel narratif naturel en français moderne.
- source_word: חָלָה
  choice: tomba malade
  rationale: Le verbe חלה peut désigner le fait de devenir malade. « Tomba malade » exprime naturellement l'apparition de la maladie dans la progression du récit.
- source_word: אֲבִיָּה
  choice: Abiya
  rationale: Cette forme translittère le nom hébreu de manière claire et naturelle en français, tout en distinguant le yod consonantique.
- source_word: בֶן יָרָבְעָם
  choice: fils de Jéroboam
  rationale: Cette formulation rend directement la relation filiale exprimée par la chaîne construite hébraïque et reste idiomatique en français.
