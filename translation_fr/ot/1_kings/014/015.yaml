source:
  edition: WLC
  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: fr
  text: Yahweh frappera Israël, comme un roseau se balance dans l’eau. Il arrachera Israël de cette bonne terre qu’il a donnée à leurs ancêtres et les dispersera au-delà du Fleuve[a], parce qu’ils se sont fabriqué leurs ashéras[b], provoquant ainsi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « le Fleuve » désigne l’Euphrate.
    reason: cross_reference
  - marker: b
    text: 'Hébreu : « leurs ashéras » ; il s’agit d’objets cultuels associés à la déesse Ashéra, souvent compris comme des poteaux ou des représentations en bois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: frappera
  rationale: Dans ce discours prophétique, la forme verbale a une valeur future. « Frappera » exprime clairement le jugement divin sans archaïsme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: qui oscillera comme un roseau dans l’eau
  rationale: Le sujet sous-entendu du verbe est Israël, tandis que le roseau fournit l’image comparative. Cette formulation naturelle en français conserve le mouvement instable évoqué par le texte.
- source_word: וְנָתַשׁ
  choice: Il arrachera
  rationale: Le verbe évoque l’arrachement, souvent avec l’idée de déracinement. « Arrachera » conserve l’image tout en s’appliquant naturellement à Israël retiré de sa terre.
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: cette bonne terre
  rationale: La formulation garde l’évaluation positive et le lien avec le don territorial.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: qu’il a donnée à leurs ancêtres
  rationale: « Ancêtres » rend naturellement en français moderne le sens collectif et généalogique de אבות sans exclure artificiellement les femmes de la lignée.
- source_word: וְזֵרָם
  choice: et les dispersera
  rationale: Le verbe exprime ici la dispersion en exil. « Dispersera » est précis et idiomatique.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: au-delà du Fleuve
  rationale: Le texte hébreu dit littéralement « le Fleuve », appellation conventionnelle de l’Euphrate. La majuscule signale ce référent géographique, expliqué en note.
- source_word: יַעַן אֲשֶׁר
  choice: parce que
  rationale: Cette locution introduit directement la cause du jugement.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: ils se sont fabriqué leurs ashéras
  rationale: La translittération « ashéras » préserve l’indétermination matérielle du terme, qui désigne des objets cultuels associés à la déesse Ashéra, sans imposer l’interprétation plus précise de « poteaux ».
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: provoquant ainsi Yahweh
  rationale: Le participe indique que la fabrication de ces objets provoque Yahweh, avec une nuance de colère implicite dans le verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » préserve cette donnée au lieu de la remplacer par un titre.
- issue: Identification de « le Fleuve »
  choice: Conserver « le Fleuve » dans le texte et préciser en note qu’il s’agit de l’Euphrate
  alternative: au-delà de l’Euphrate
  rationale: Cette solution respecte l’expression hébraïque tout en donnant au lecteur moderne l’information géographique nécessaire.
- issue: Nature des אֲשֵׁרִים
  choice: ashéras
  alternative: poteaux d’Ashéra
  rationale: La forme translittérée conserve l’ambiguïté quant à la forme exacte de ces objets cultuels; la note en explicite l’association religieuse sans trancher abusivement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est divisée en deux phrases pour éviter une période excessivement lourde, tout en gardant la succession du jugement, de l’exil et de sa cause. Les marqueurs [a] et [b] figurent dans le texte principal.
