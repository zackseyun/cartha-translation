  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: fr
  text: Alors la femme de Jéroboam se leva, partit et arriva à Tirtsa. Comme elle arrivait au seuil de la maison, le garçon mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: se leva
  rationale: Le qal wayyiqtol de קום fait progresser le récit. « Se leva » conserve l’enchaînement narratif hébreu sans réduire le verbe au seul départ.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: la femme de Jéroboam
  rationale: La chaîne construite indique simplement la relation conjugale; cette formulation est naturelle et digne en français moderne.
- source_word: וַתֵּלֶךְ
  choice: partit
  rationale: Dans cette séquence, הלך décrit son déplacement après qu’elle s’est levée. « Partit » évite la répétition peu naturelle « alla et arriva » sans ajouter de précision étrangère au contexte.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: arriva à Tirtsa
  rationale: בוא et le hé directionnel de תִרְצָתָה expriment le mouvement jusqu’à Tirtsa. « Arriva à » rend clairement la destination.
- source_word: הִיא בָּאָה
  choice: Au moment où elle franchissait
  rationale: Le pronom indépendant suivi du participe forme une proposition circonstancielle et souligne le moment précis de l’accomplissement. Avec « le seuil », « franchissait » exprime naturellement l’arrivée à cet endroit.
- source_word: בְסַף הַבַּיִת
  choice: le seuil de la maison
  rationale: סַף désigne précisément le seuil ou le pas d’une porte. Le mouvement est exprimé en français par « franchissait ».
- source_word: וְהַנַּעַר
  choice: le garçon
  rationale: נַעַר peut désigner un garçon, un jeune homme, un serviteur ou un enfant. Ici, le contexte immédiat renvoie au fils de Jéroboam; « le garçon » conserve la nuance lexicale sans préciser son âge au-delà du texte.
- source_word: מֵת
  choice: mourut
  rationale: La forme de מות désigne ici l’événement qui survient à cet instant et accomplit l’annonce du verset précédent. Le passé simple convient au récit français.
