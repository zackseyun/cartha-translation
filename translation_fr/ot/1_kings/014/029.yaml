source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י רְחַבְעָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: fr
  text: Le reste des actes de Roboam, ainsi que tout ce qu’il a fait, n’est-il pas écrit dans le livre des Annales des rois de Juda[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque désigne un registre royal des événements. On pourrait aussi traduire : « le livre des Chroniques des rois de Juda ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: Le reste des actes de Roboam
  rationale: Dans cette formule historiographique, דִּבְרֵי désigne les affaires ou les actes du roi plutôt que ses seules paroles. Le וְ initial assure la continuité du récit sans exiger un adverbe temporel explicite.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ainsi que tout ce qu’il a fait
  rationale: Cette formulation naturelle conserve la portée générale de עָשָׂה sans préciser la nature ni la valeur des actions.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: n’est-il pas écrit
  rationale: La question rhétorique négative, qui appelle une réponse affirmative, est conservée. En français, le sujet grammatical singulier renvoie à l’ensemble du contenu mentionné.
- source_word: עַל סֵפֶר
  choice: dans le livre
  rationale: Bien que עַל signifie littéralement « sur », « écrit dans le livre » est l’expression documentaire idiomatique en français.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: des Annales des rois de Juda
  rationale: Dans cette formule de citation royale, דִּבְרֵי הַיָּמִים désigne un relevé chronologique d’événements. « Annales » évite de laisser croire qu’il s’agit nécessairement du livre biblique des Chroniques.
