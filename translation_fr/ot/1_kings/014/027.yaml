id: 1KI.14.27
reference: 1 Kings 14:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתָּ֔/ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: fr
  text: Le roi Roboam fit donc à leur place des boucliers de bronze et les confia aux chefs des coureurs[a], qui gardaient l’entrée de la maison du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de manière plus explicite, « les chefs de la garde ». L’hébreu dit littéralement « les chefs des coureurs »; il s’agissait probablement d’un corps royal servant de garde ou de messagers.
    reason: lexical_alternative
  - marker: b
    text: La « maison du roi » désigne le palais royal.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie ici simplement « faire, fabriquer »; le passé simple convient au registre narratif biblique français.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: le roi Roboam
  rationale: Cet ordre est naturel en français et représente directement le titre suivi du nom.
- source_word: תַּחְתָּם
  choice: à leur place
  rationale: Le suffixe renvoie aux boucliers d’or emportés au verset précédent; cette expression conserve clairement l’idée de remplacement.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: des boucliers de bronze
  rationale: נְחֹשֶׁת peut désigner le cuivre ou le bronze; « bronze » est l’équivalent usuel pour ce type d’objet antique.
- source_word: וְהִפְקִיד עַל יַד
  choice: les confia aux
  rationale: La tournure signifie placer les objets sous la responsabilité de quelqu’un. « Confier à » rend naturellement l’idiome hébreu sans reproduire artificiellement « sur la main de ».
- source_word: שָׂרֵי הָרָצִים
  choice: les chefs des coureurs
  rationale: Cette traduction conserve l’expression concrète et quelque peu ambiguë de l’hébreu; le corps en question pouvait assurer des fonctions de garde ou de messagerie.
- source_word: הַשֹּׁמְרִים
  choice: qui gardaient
  rationale: La proposition relative rend naturellement le participe décrivant leur fonction habituelle.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: l’entrée de la maison du roi
  rationale: La formulation reste proche de l’hébreu, tandis qu’une note précise qu’il s’agit du palais royal.
theological_decisions: []
