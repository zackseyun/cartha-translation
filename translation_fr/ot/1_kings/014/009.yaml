  text: וַ/תָּ֣רַע לַ/עֲשׂ֔וֹת מִ/כֹּ֖ל אֲשֶׁר הָי֣וּ לְ/פָנֶ֑י/ךָ וַ/תֵּ֡לֶךְ וַ/תַּעֲשֶׂה לְּ/ךָ֩ אֱלֹהִ֨ים אֲחֵרִ֤ים וּ/מַסֵּכוֹת֙ לְ/הַכְעִיסֵ֔/נִי וְ/אֹתִ֥/י הִשְׁלַ֖כְתָּ אַחֲרֵ֥י גַוֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: fr
  text: Tu as fait plus de mal que tous ceux qui t’ont précédé. Tu es allé te fabriquer d’autres dieux et des images coulées[a], afin de provoquer ma colère, et tu m’as jeté derrière ton dos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des statues de métal fondu » ; l’hébreu désigne des représentations fabriquées par coulage, probablement des objets cultuels en métal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת
  choice: Tu as agi plus mal
  rationale: L’idiome רעה + לעשות exprime l’action mauvaise; avec מִכֹּל, le comparatif est explicité naturellement en français.
- source_word: מִכֹּל אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: que tous ceux qui ont été avant toi
  rationale: 'לְפָנֶיךָ a ici une valeur temporelle: les prédécesseurs du roi.'
- source_word: וַתֵּלֶךְ וַתַּעֲשֶׂה לְּךָ
  choice: Tu es allé te faire
  rationale: Cette formulation conserve le verbe de mouvement et rend le datif réfléchi ou bénéficiaire לְךָ sans lourdeur excessive.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: d’autres dieux
  rationale: Traduction directe de l’expression d’alliance, sans ajouter la nuance de provenance qu’impliquerait « dieux étrangers ».
- source_word: וּמַסֵּכוֹת
  choice: des statues de métal fondu
  rationale: מַסֵּכוֹת désigne des représentations obtenues par fonte ou coulage; cette formulation moderne indique à la fois l’objet et son mode de fabrication.
- source_word: לְהַכְעִיסֵנִי
  choice: afin de provoquer ma colère
  rationale: Rend la valeur causative du hifil de כעס et le suffixe de première personne.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: et moi, tu m’as rejeté derrière ton dos
  rationale: La dislocation de « moi » reflète l’emphase de וְאֹתִי; « rejeté derrière ton dos » préserve l’image corporelle et le mépris qu’elle exprime.
theological_decisions:
- issue: Rendre le langage de l’idolâtrie sans atténuer l’offense liée à l’alliance
  choice: d’autres dieux et des statues de métal fondu
  alternative: des dieux étrangers et des idoles
  rationale: La traduction maintient la distinction entre les divinités illicites et leurs représentations cultuelles concrètes, sans tout réduire au terme générique « idoles ».
- issue: Préserver la force de la métaphore du rejet de Dieu
  choice: et moi, tu m’as rejeté derrière ton dos
  alternative: tu m’as méprisé
  rationale: Le texte hébreu emploie une image physique vigoureuse; elle est conservée plutôt que remplacée par une abstraction interprétative.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse personnelle au roi. La syntaxe conserve l’emphase accusatrice et les images concrètes de l’hébreu sans archaïsme inutile.
