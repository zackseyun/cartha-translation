revisions:
- from: Tu as agi plus mal que tous ceux qui ont été avant toi. Tu es allé te faire d’autres dieux et des statues de métal fondu[a], afin de provoquer ma colère, et moi, tu m’as rejeté derrière ton dos.
  to: Tu as fait plus de mal que tous ceux qui t’ont précédé. Tu es allé te fabriquer d’autres dieux et des images coulées[a], afin de provoquer ma colère, et tu m’as jeté derrière ton dos.
  rationale: La révision améliore l’idiomaticité française tout en maintenant les éléments lexicaux du texte hébreu. Elle restitue littéralement le verbe final (« jeter »), préservant ainsi la vive métaphore sans l’interpréter par « rejeter ».
