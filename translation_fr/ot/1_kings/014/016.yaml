  rationale: 'La révision remplace une formulation qui risquait d’assimiler les péchés d’Israël à ceux commis personnellement par Jéroboam par une expression française naturelle du causatif : « il a fait pécher Israël ». L’ajout de « par lesquels » préserve le lien instrumental exprimé dans la traduction anglaise de contrôle, sans préciser davantage la nature historique du jugement.'
