source:
  edition: WLC
  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: fr
  text: Il livrera[a] Israël à cause des péchés que Jéroboam a commis et par lesquels il a fait pécher Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « donnera ». Dans ce contexte de jugement, le verbe signifie livrer un peuple au malheur ou à ses ennemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: Il livrera
  rationale: Le verbe נָתַן signifie littéralement « donner », mais, dans ce contexte de jugement et avec Israël comme objet direct, il exprime l’idée de livrer quelqu’un au malheur ou à ses ennemis. « Livrera » est naturel en français et n’ajoute pas l’identité de l’instrument du jugement.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom désigne collectivement le peuple ou le royaume du Nord; la particule אֶת marque ici l’objet direct.
- source_word: בִּגְלַל
  choice: à cause de
  rationale: La préposition indique clairement la cause ou le motif du jugement.
- source_word: חַטֹּאות יָרָבְעָם
  choice: des péchés que Jéroboam…
  rationale: Le pluriel חַטֹּאות est rendu par « péchés ». La construction française avec une relative évite la lourdeur de « des péchés de Jéroboam qu’il… » tout en conservant son entière responsabilité.
- source_word: אֲשֶׁר חָטָא
  choice: que Jéroboam a commis
  rationale: Littéralement, le texte parle des péchés « qu’il a péchés ». En français courant, on « commet » des péchés; cette formulation restitue naturellement la culpabilité personnelle de Jéroboam.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: et qu’il a fait commettre à Israël
  rationale: La forme causative de חטא signifie « faire pécher ». La reprise de « commettre » sous-entend sans ambiguïté « commettre des péchés » et rattache la seconde relative aux mêmes péchés, comme le permet la syntaxe hébraïque.
theological_decisions:
- issue: Agent et portée du jugement
  choice: Il livrera Israël
  alternative: Il abandonnera Israël / Il remettra Israël aux mains de ses ennemis
  rationale: Le sujet renvoie à Dieu dans le contexte, mais le verset ne nomme pas ici ceux ou ce à quoi Israël sera livré. La traduction conserve donc l’affirmation du jugement divin sans préciser son instrument.
- issue: Responsabilité de Jéroboam et participation d’Israël
  choice: les péchés que Jéroboam a commis et qu’il a fait commettre à Israël
  alternative: les péchés de Jéroboam, celui qui a péché et qui a entraîné Israël dans le péché
  rationale: 'La formulation retenue maintient les deux aspects du texte: Jéroboam a personnellement péché et il a exercé une influence causative sur Israël. Elle ne supprime toutefois pas la participation réelle d’Israël aux péchés commis.'
translation_notes:
  register: Français international moderne, sobre et digne. « Livrer » conserve la force judiciaire du contexte. La coordination parallèle (« que… et qu’… ») rend la structure hébraïque de façon fluide, sans développer au-delà du verset.
