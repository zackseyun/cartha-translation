review_pass:
  verdict: revise
  source_fidelity: La forme causative הֶחֱטִיא signifie « faire pécher / entraîner dans le péché ». Le projet « faire commettre [les péchés] à Israël » peut laisser entendre plus étroitement qu’Israël a commis précisément les mêmes péchés que Jéroboam, alors que le texte exprime sa responsabilité d’avoir fait pécher Israël. « Par lesquels il a fait pécher Israël » rend explicitement et sobrement le lien conservé par l’anglais POB (« by which »).
  naturalness: « Il livrera Israël » et « à cause des péchés » sont naturels, clairs et adaptés à un français international moderne. « Faire pécher » est ici une expression française courante et plus exacte que la périphrase proposée.
  terminology: 'Les noms et termes clés sont bien rendus : « Israël », « Jéroboam », « péchés » et « livrera ». La note sur « donnera » justifie adéquatement la valeur judiciaire de « livrera », sans identifier indûment l’instrument du jugement.'
  issues:
  - severity: medium
    issue: La seconde relative « qu’il a fait commettre à Israël » est trop restrictive.
    rationale: Elle présente les péchés mentionnés comme des actes qu’il aurait fait commettre à Israël. Le causatif hébreu exprime plus directement que Jéroboam a fait pécher Israël; « par lesquels il a fait pécher Israël » conserve à la fois la causalité et le rattachement syntaxique retenu dans l’audit anglais.
  revised_text: Il livrera[a] Israël à cause des péchés que Jéroboam a commis et par lesquels il a fait pécher Israël.
  revised_footnotes:
  - marker: a
    text: Littéralement « donnera ». Dans ce contexte de jugement, le verbe signifie livrer un peuple au malheur ou à ses ennemis.
    reason: lexical_alternative
  revision_rationale: 'La révision remplace une formulation qui risquait d’assimiler les péchés d’Israël à ceux commis personnellement par Jéroboam par une expression française naturelle du causatif : « il a fait pécher Israël ». L’ajout de « par lesquels » préserve le lien instrumental exprimé dans la traduction anglaise de contrôle, sans préciser davantage la nature historique du jugement.'
