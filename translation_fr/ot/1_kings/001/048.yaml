source:
  edition: WLC
  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: fr
  text: 'Le roi a aussi dit : « Béni soit Yahweh, le Dieu d’Israël, qui a donné aujourd’hui quelqu’un pour siéger sur mon trône, et mes yeux le voient. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: Le roi a encore dit ceci
  rationale: « Encore » restitue la valeur additive de וְגַם, tandis que « ceci » reprend la fonction cataphorique de כָּכָה et introduit naturellement la citation en français.
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Formule française courante et digne pour une bénédiction doxologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français du nom divin, qui conserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rend directement et naturellement l’expression construite hébraïque.
- source_word: אֲשֶׁר נָתַן הַיּוֹם
  choice: qui a donné aujourd’hui
  rationale: Le passé composé exprime l’acte accompli dont le résultat est présent; « donné » conserve le sens ordinaire de נתן sans expliciter davantage la nomination.
- source_word: יֹשֵׁב עַל כִּסְאִי
  choice: quelqu’un pour siéger sur mon trône
  rationale: Le participe substantivé désigne la personne placée sur le trône. « Pour siéger » exprime naturellement en français le résultat ou la fonction, sans ajouter le nom de Salomon.
- source_word: וְעֵינַי רֹאוֹת
  choice: et mes yeux le voient
  rationale: La formulation garde la coordination hébraïque et l’image concrète des yeux témoins. Le pronom « le » reprend en français l’événement implicite que le texte hébreu laisse sans objet exprimé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; la translittération préserve le nom divin tout en évitant de le remplacer par un titre.
- issue: Nature du don exprimé par נָתַן
  choice: a donné quelqu’un pour siéger
  alternative: a établi quelqu’un sur mon trône
  rationale: Le choix conserve le verbe général « donner » et laisse le contexte royal préciser sa portée, sans transformer implicitement le verbe en terme technique de nomination.
- issue: Objet non exprimé de רֹאוֹת
  choice: le voient
  alternative: voient
  rationale: L’hébreu ne formule aucun objet. Le français exige ici un complément plus naturel; « le » renvoie sobrement à l’événement qui vient d’être décrit, sans en préciser davantage la nature.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans conserver le tour artificiel « ainsi a dit ». L’exclamation finale convient au caractère doxologique de la parole.
