source:
  edition: WLC
  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: fr
  text: 'Et les serviteurs du roi sont eux aussi venus bénir notre seigneur, le roi David, en disant : « Que ton Dieu rende le nom de Salomon plus illustre que le tien[b], et qu’il rende son trône plus grand que le tien ! » Puis le roi s’est incliné sur le lit[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le roi adora sur le lit ». Le verbe hébreu peut désigner le fait de s’incliner ou de se prosterner, mais aussi l’adoration, selon le contexte.'
    reason: alternative_reading
  - marker: b
    text: Ici, le « nom » désigne aussi la réputation ou la renommée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: eux aussi
  rationale: Rend la valeur additive de la conjonction et de l’adverbe tout en reliant naturellement cette information au récit précédent.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: les serviteurs du roi
  rationale: Dans ce contexte de cour, le terme désigne largement les serviteurs, dignitaires ou fonctionnaires royaux; « serviteurs » conserve cette amplitude.
- source_word: לְבָרֵךְ
  choice: bénir
  rationale: Il s’agit d’une bénédiction solennelle prononcée devant David, et non d’une simple félicitation.
- source_word: אֶת אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: notre seigneur, le roi David
  rationale: Conserve la formule honorifique de cour et clarifie l’apposition en français.
- source_word: יֵיטֵב אֱלֹהֶיךָ אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: Que ton Dieu rende le nom de Salomon plus illustre que le tien
  rationale: Le causatif de יטב exprime ici le fait de rendre meilleur, tandis que « plus illustre » communique naturellement la renommée attachée au « nom » sans supprimer l’image hébraïque.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: et qu’il rende son trône plus grand que le tien
  rationale: Préserve le causatif de גדל, la comparaison et l’image dynastique concrète du trône.
- source_word: וַיִּשְׁתַּחוּ
  choice: s’est incliné
  rationale: Le verbe peut décrire une inclination ou une prosternation cultuelle. Ce choix exprime le geste sans préciser un objet d’adoration que le verset ne nomme pas.
- source_word: עַל הַמִּשְׁכָּב
  choice: sur le lit
  rationale: Rendu direct de l’expression hébraïque, sans ajouter le possessif implicite.
theological_decisions:
- issue: Le geste du roi désigne-t-il explicitement une adoration ou une inclination corporelle ?
  choice: le roi s’est incliné
  alternative: le roi s’est prosterné en adoration
  rationale: Le verbe hébreu peut évoquer soit un geste de révérence, soit l’adoration. Comme aucun objet n’est exprimé dans cette proposition, le texte principal conserve l’indétermination et la note signale l’autre compréhension possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton solennel de la bénédiction royale, tandis que les formulations restent naturelles. Les notes maintiennent l’ambiguïté lexicale et théologique du texte hébreu.
