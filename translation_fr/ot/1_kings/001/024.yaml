base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: fr
  text: 'Alors Nathan dit : « Mon seigneur le roi, est-ce toi qui as dit[a] : “Adonias régnera après moi et s’assiéra sur mon trône” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « as-tu dit ». Le parfait hébreu, dans cette question, peut être rendu en français par le passé composé ou le passé simple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors Nathan dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession narrative en français moderne.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mon seigneur le roi
  rationale: Cette formule d’adresse courtoise conserve à la fois l’honorifique possessif et le titre royal.
- source_word: אַתָּה אָמַרְתָּ
  choice: est-ce toi qui as dit
  rationale: Le pronom indépendant אַתָּה met vraisemblablement le roi en relief; la tournure interrogative française conserve cette insistance ainsi que la valeur accomplie du parfait.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forme française traditionnelle et couramment reconnue du nom hébreu.
- source_word: יִמְלֹךְ
  choice: régnera
  rationale: Le verbe signifie régner ou être roi; « régnera » conserve directement le langage de succession royale.
- source_word: אַחֲרָי
  choice: après moi
  rationale: La formule concise indique la succession sans préciser davantage les circonstances.
- source_word: יֵשֵׁב עַל כִּסְאִי
  choice: siégera sur mon trône
  rationale: « Siéger sur le trône » conserve l’image royale et exprime naturellement l’exercice de la royauté en français.
