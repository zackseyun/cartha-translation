  text: וַ/אֲדֹנִיָּ֧ה בֶן חַגִּ֛ית מִתְנַשֵּׂ֥א לֵ/אמֹ֖ר אֲנִ֣י אֶמְלֹ֑ךְ וַ/יַּ֣עַשׂ ל֗/וֹ רֶ֚כֶב וּ/פָ֣רָשִׁ֔ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: fr
  text: 'Adonias, fils de Haggith, s’éleva[a] en disant : « Moi, je régnerai[b]. » Il se procura un char, des cavaliers et cinquante hommes qui couraient devant lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se mit en avant » ou « chercha à se faire grand ». Le verbe hébreu exprime ici l’élévation de soi.
    reason: lexical_alternative
  - marker: b
    text: Ou « Je serai roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: s’éleva lui-même
  rationale: Le participe hitpael de נשׂא exprime ici l’élévation de soi et la mise en avant personnelle. Cette formulation conserve la valeur réfléchie et la critique implicite sans ajouter un jugement explicite.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: 'en disant : « C’est moi qui régnerai. »'
  rationale: La tournure française rend l’introduction de la citation, le verbe « régner » et l’insistance portée par אֲנִי sur la prétention personnelle d’Adonias.
- source_word: וַיַּעַשׂ לוֹ
  choice: Il se procura
  rationale: Dans ce contexte, עשה לו indique qu’Adonias se constitue les attributs d’une suite royale. « Se procura » reste naturel en français sans préciser indûment s’il les a fabriqués, achetés ou fait préparer.
- source_word: רֶכֶב
  choice: un char
  rationale: Le singulier est conservé et désigne vraisemblablement ici le véhicule servant à la démonstration royale.
- source_word: פָרָשִׁים
  choice: des cavaliers
  rationale: Le pluriel désigne des hommes montés accompagnant le char; « cavaliers » est le terme français courant et transparent.
- source_word: חֲמִשִּׁים אִישׁ
  choice: cinquante hommes
  rationale: La formulation respecte l’expression numérique hébraïque et conserve la référence masculine explicite.
- source_word: רָצִים לְפָנָיו
  choice: qui couraient devant lui
  rationale: Le participe décrit la fonction continue de ces hommes dans le cortège, celle de coureurs précédant Adonias.
theological_decisions:
- issue: Caractérisation de l’ambition d’Adonias
  choice: s’éleva lui-même
  alternative: se mit en avant; chercha à se faire grand
  rationale: Le texte présente une auto-élévation implicitement blâmable. La traduction garde cette nuance sans expliciter davantage la condamnation morale.
- issue: Nature de la prétention royale
  choice: C’est moi qui régnerai
  alternative: Je serai roi
  rationale: Le choix conserve à la fois la force verbale de מלך et l’accent porté par le pronom אֲנִי, sans déterminer ici la légitimité de sa revendication.
- issue: Genre des membres du cortège
  choice: cinquante hommes
  alternative: cinquante personnes; cinquante coureurs
  rationale: Le nom אִישׁ est explicitement masculin et désigne les hommes du cortège royal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure proche de l’hébreu tout en étant idiomatique. Le pronom emphatique est rendu par « C’est moi qui », et les notes préservent les principales possibilités lexicales sans résoudre artificiellement l’ambiguïté.
