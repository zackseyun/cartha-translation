  text: עוֹדֶ֣/נּוּ מְדַבֵּ֔ר וְ/הִנֵּ֧ה יוֹנָתָ֛ן בֶּן אֶבְיָתָ֥ר הַ/כֹּהֵ֖ן בָּ֑א וַ/יֹּ֤אמֶר אֲדֹנִיָּ֨הוּ֙ בֹּ֔א כִּ֣י אִ֥ישׁ חַ֛יִל אַ֖תָּה וְ/ט֥וֹב תְּבַשֵּֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: fr
  text: 'Il parlait encore quand Jonathan, fils du prêtre Abiathar, arriva. Adonias lui dit : « Entre, car tu es un homme de valeur[a] et tu apportes de bonnes nouvelles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un homme vaillant », « un homme capable » ou « un homme de haut rang » (hébreu : אִישׁ חַיִל). Selon le contexte, l’expression peut désigner la bravoure, la compétence ou la position sociale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Il parlait encore quand
  rationale: Cette formulation française naturelle rend l’action en cours au moment où survient l’arrivée de Jonathan.
- source_word: וְהִנֵּה
  choice: quand
  rationale: Dans ce récit, la tournure présentative hébraïque signale l’irruption soudaine de Jonathan. Le français narratif la rend naturellement par « quand », sans le littéralisme vieilli de « voici ».
- source_word: יוֹנָתָן
  choice: Jonathan
  rationale: Forme française usuelle du nom propre.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: fils du prêtre Abiathar
  rationale: Le titre « prêtre » qualifie le plus naturellement Abiathar dans cette chaîne généalogique.
- source_word: בָּא
  choice: arriva
  rationale: Le verbe indique ici l’arrivée de Jonathan sur les lieux; « arriva » convient au mouvement narratif.
- source_word: בֹּא
  choice: Entre
  rationale: L’impératif constitue une invitation à pénétrer dans le lieu où se trouve le groupe.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison donnée par Adonias à son invitation.
- source_word: אִישׁ חַיִל
  choice: un homme de valeur
  rationale: L’expression peut évoquer la vaillance, la compétence, les qualités personnelles ou le rang. « Homme de valeur » conserve cette amplitude en français.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: et tu apportes de bonnes nouvelles
  rationale: Rend naturellement l’attente confiante d’Adonias selon laquelle Jonathan est porteur d’une annonce favorable.
