translation_notes:
  register: Français international moderne, narratif et digne. La construction évite un « voici » artificiel tout en gardant la soudaineté de l’arrivée. « Adonias » suit la forme française biblique usuelle, tandis que « homme de valeur » préserve l’ambiguïté sémantique de l’hébreu.
