base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: fr
  text: Mais le prêtre Tsadok, Benaya, fils de Yehoyada, le prophète Nathan, Shiméï, Réï et les vaillants hommes de David[a] n’étaient pas du côté d’Adonias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les vaillants hommes qui étaient à David ». Littéralement, l’hébreu dit : « les vaillants hommes qui étaient/appartenaient à David ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צָד֣וֹק הַ֠/כֹּהֵן
  choice: Mais le prêtre Tsadok
  rationale: La conjonction וְ marque ici le contraste avec les partisans d’Adonias énumérés au verset précédent; « mais » l’exprime naturellement. L’apposition hébraïque est rendue par l’ordre français courant « le prêtre Tsadok ».
- source_word: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֜ע
  choice: Benaya, fils de Yehoyada
  rationale: La construction patronymique est conservée dans un français naturel. Les noms sont translittérés de façon cohérente avec l’hébreu.
- source_word: וְ/נָתָ֤ן הַ/נָּבִיא֙
  choice: le prophète Nathan
  rationale: Le titre apposé הַנָּבִיא est conservé, avec l’ordre idiomatique du français.
- source_word: וְ/שִׁמְעִ֣י וְ/רֵעִ֔י
  choice: Shiméï, Réï
  rationale: Les noms propres sont translittérés; la répétition des conjonctions hébraïques est adaptée à l’énumération française.
- source_word: וְ/הַ/גִּבּוֹרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד
  choice: et les vaillants hommes attachés à David
  rationale: גִּבּוֹרִים désigne des hommes réputés pour leur force ou leur valeur guerrière. « Attachés à David » rend naturellement la relation exprimée par אֲשֶׁר לְדָוִד sans la réduire nécessairement à une simple possession.
- source_word: לֹ֥א הָי֖וּ עִם
  choice: ne se rangèrent pas aux côtés de
  rationale: Littéralement « n’étaient pas avec ». Dans ce contexte de rivalité successorale, la formulation française exprime l’absence de soutien politique tout en conservant l’image d’être ou non aux côtés de quelqu’un.
- source_word: אֲדֹנִיָּֽהוּ
  choice: Adonias
  rationale: Forme française traditionnelle et largement reconnaissable du nom hébreu.
