revisions:
- from: Mais le prêtre Tsadok, Benaya, fils de Yehoyada, le prophète Nathan, Shiméï, Réï et les vaillants hommes attachés à David[a] ne se rangèrent pas aux côtés d’Adonias.
  to: Mais le prêtre Tsadok, Benaya, fils de Yehoyada, le prophète Nathan, Shiméï, Réï et les vaillants hommes de David[a] n’étaient pas du côté d’Adonias.
  rationale: La révision remplace une formulation qui ajoutait l’idée d’un ralliement ponctuel par une expression française stative correspondant à « n’étaient pas avec ». Elle adopte aussi « de David », idiomatique pour la désignation du groupe, tout en maintenant dans la note l’ambiguïté lexicale et relationnelle de l’hébreu.
