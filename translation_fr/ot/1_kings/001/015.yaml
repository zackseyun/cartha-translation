  text: וַ/תָּבֹ֨א בַת שֶׁ֤בֶע אֶל הַ/מֶּ֨לֶךְ֙ הַ/חַ֔דְרָ/ה וְ/הַ/מֶּ֖לֶךְ זָקֵ֣ן מְאֹ֑ד וַֽ/אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית מְשָׁרַ֖ת אֶת הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: fr
  text: Bethsabée entra dans la chambre où se trouvait le roi. Or, le roi était très âgé, et Abishag la Sunamite était au service du roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא
  choice: entra
  rationale: Le wayyiqtol fait progresser le récit; « entra » exprime naturellement le mouvement vers l’espace privé où se trouve le roi.
- source_word: בַת שֶׁבַע
  choice: Bethsabée
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: אֶל הַמֶּלֶךְ הַחַדְרָה
  choice: dans la chambre du roi
  rationale: חֶדֶר désigne une pièce intérieure ou privée, et le hé directionnel marque l’entrée. Cette formulation française rend naturellement l’ensemble, sans suggérer à tort que la chambre appartient nécessairement au roi plutôt que d’être celle où il se trouve; la note conserve cette nuance.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: Le roi était très âgé
  rationale: La proposition fournit une information d’arrière-plan. « Très âgé » est naturel et dignifié pour זָקֵן מְאֹד.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: et Abishag la Sunamite
  rationale: Le nom est translittéré selon l’usage français courant; le gentilé féminin désigne une femme de Sunem.
- source_word: מְשָׁרַת אֶת הַמֶּלֶךְ
  choice: était à son service
  rationale: Le participe exprime une activité continue auprès du roi. « Était à son service » convient au contexte de cour et de soins, sans coloration ecclésiastique.
theological_decisions: []
