  text: וְ/הַ/מֶּ֤לֶךְ דָּוִד֙ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יְכַסֻּ֨/הוּ֙ בַּ/בְּגָדִ֔ים וְ/לֹ֥א יִחַ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/001.yaml
  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: fr
  text: Le roi David était vieux, avancé en âge[a]. On le couvrit de vêtements, mais il ne parvenait pas à se réchauffer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « venu dans les jours », expression hébraïque désignant une personne très âgée ou avancée en âge.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Le roi David
  rationale: Le waw initial introduit ici la scène sans exiger un adverbe temporel en français. Le titre et le nom sont rendus directement et naturellement.
- source_word: זָקֵן
  choice: était vieux
  rationale: Rendu direct du constat relatif à l’âge, sans atténuation ni archaïsme.
- source_word: בָּא בַּ/יָּמִים
  choice: avancé en âge
  rationale: Cette expression idiomatique, littéralement liée au fait d’être « entré dans les jours », indique un âge avancé. La tournure française conserve l’idée et le registre digne.
- source_word: וַ/יְכַסֻּהוּ בַּ/בְּגָדִים
  choice: On le couvrait de vêtements
  rationale: La forme verbale a un sujet pluriel indéfini, que le pronom français « on » rend naturellement. « Vêtements » traduit בְּגָדִים sans introduire l’idée plus précise de couvertures.
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: mais il n’arrivait pas à se réchauffer
  rationale: Le verbe exprime ici le fait de devenir chaud. Cette formulation idiomatique rend l’incapacité persistante suggérée par le contexte, tandis que « mais » fait ressortir le contraste entre les soins prodigués et leur inefficacité.
