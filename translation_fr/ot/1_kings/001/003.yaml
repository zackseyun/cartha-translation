  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: fr
  text: On chercha donc dans tout le territoire d’Israël une belle jeune femme, et l’on trouva Abishag la Sunamite[a], que l’on amena au roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La Sunamite : c’est-à-dire une femme originaire de Sunem.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: On chercha
  rationale: Le verbe בקשׁ exprime ici une recherche active. Le sujet indéfini « on » est naturel en français narratif lorsque les agents ont été désignés par le contexte précédent.
- source_word: נַעֲרָה יָפָה
  choice: une belle jeune femme
  rationale: נַעֲרָה désigne une personne de sexe féminin encore jeune, ici en âge d’accomplir le service envisagé. « Jeune femme » évite aussi bien l’archaïsme de « jeune fille » au sens ancien que l’idée d’une enfant; יָפָה signifie simplement « belle ».
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: dans tout le territoire d’Israël
  rationale: גְּבוּל désigne ici l’étendue territoriale d’Israël plutôt que sa seule frontière. Cette formulation restitue naturellement la portée de la recherche.
- source_word: וַיִּמְצְאוּ
  choice: l’on trouva
  rationale: Le verbe מצא est rendu par son équivalent narratif direct « trouver ». « L’on » maintient le sujet indéfini tout en évitant la rencontre peu harmonieuse de « et on ».
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abishag la Sunamite
  rationale: Le nom propre est translittéré sous sa forme française usuelle. Le gentilé est conservé afin de refléter la désignation hébraïque; il indique qu’elle venait de Sunem.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: que l’on amena au roi
  rationale: Le hiphil de בוא signifie « amener » ou « faire venir ». La proposition relative évite une succession lourde de coordinations tout en conservant exactement la progression narrative.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative demeure fluide sans archaïsmes; le gentilé traditionnel « Sunamite » est expliqué en note.
