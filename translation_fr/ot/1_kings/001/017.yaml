    issue: « Oui » pour כִּי
    rationale: Dans ce contexte, כִּי introduit la proposition jurée (« que / assurément » selon l’analyse), mais « Oui » n’est pas une introduction naturelle du contenu d’un serment en français et risque de faire entendre une réponse à une question absente.
  - severity: low
    issue: « c’est lui qui siégera »
    rationale: La formulation française marque une exclusivité ou un contraste appuyé. Le pronom hébreu explicite peut avoir une valeur de reprise du sujet sans exiger cette focalisation; « il siégera » préserve mieux l’ambiguïté.
