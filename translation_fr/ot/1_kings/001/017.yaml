  source_fidelity: Le sens de la promesse dynastique est bien rendu, de même que l’auto-désignation féminine « ta servante ». Toutefois, כִּי introduit ici le contenu du serment et ne correspond pas naturellement à un « Oui » français autonome. Le pronom הוּא peut être traduit simplement par « il » sans imposer une focalisation exclusive (« c’est lui »).
  naturalness: Le registre est globalement moderne et respectueux. Dans une citation de serment, « Oui, Salomon… » sonne toutefois artificiel en français; une phrase déclarative directe est plus idiomatique.
  terminology: « Mon seigneur », « le SEIGNEUR », « ta servante », « régnera » et « trône » sont des choix appropriés. « SEIGNEUR » conserve utilement la distinction conventionnelle pour le tétragramme.
  issues:
