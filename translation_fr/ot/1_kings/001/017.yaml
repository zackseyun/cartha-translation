base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: fr
  text: 'Elle lui dit : « Mon seigneur, tu as juré par le SEIGNEUR, ton Dieu, à ta servante : “Salomon, ton fils, régnera après moi et il siégera sur mon trône.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Mon seigneur
  rationale: Formule d’adresse respectueuse naturelle en français, qui conserve le rapport de statut exprimé par l’hébreu.
- source_word: בַּיהוָה
  choice: par le SEIGNEUR
  rationale: Rend le nom divin YHWH selon la convention française en petites capitales, ici représentées par des capitales.
- source_word: לַאֲמָתֶךָ
  choice: à ta servante
  rationale: Conserve l’auto-désignation féminine et déférente de Bath-Shéba.
- source_word: כִּי
  choice: Oui
  rationale: Dans le contenu du serment, la particule introduit ou renforce l’affirmation; « Oui » en restitue la force sans la surinterpréter.
- source_word: יִמְלֹךְ אַחֲרָי
  choice: régnera après moi
  rationale: Traduction directe de la succession royale annoncée.
- source_word: וְהוּא יֵשֵׁב עַל־כִּסְאִי
  choice: et c’est lui qui siégera sur mon trône
  rationale: La tournure clivée restitue l’emphase portée par le pronom indépendant הוּא.
theological_decisions:
- issue: Force de כִּי dans la citation du serment
  choice: « Oui »
  alternative: Omission de la particule ou « Certainement »
  rationale: « Oui » maintient la valeur affirmative probable tout en évitant de donner au serment une nuance de certitude plus forte que ne l’exige le texte.
- issue: Représentation du nom divin יהוה
  choice: « le SEIGNEUR »
  alternative: « YHWH » ou « Yahvé »
  rationale: Suit une convention biblique française largement reconnue sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à la deuxième personne singulière de l’hébreu et convient au dialogue direct dans ce contexte ancien. Ponctuation française et guillemets imbriqués adaptés à une citation à l’intérieur du discours.
