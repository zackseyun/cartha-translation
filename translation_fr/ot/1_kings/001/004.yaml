base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: fr
  text: La jeune femme était très belle ; elle devint l’assistante du roi et le servit, mais le roi ne la connut pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : il n’eut pas de relations sexuelles avec elle. En hébreu, « connaître » est ici un euphémisme pour les relations sexuelles.'
    reason: Précision du sens de l’euphémisme hébreu ידע.
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: la jeune femme
  rationale: נַעֲרָה désigne ici une jeune personne de sexe féminin. « Jeune femme » est naturel en français moderne, sans la nuance potentiellement trop juvénile de « jeune fille » ni le caractère archaïque de « jeune femme vierge » ou « demoiselle ».
- source_word: יָפָה עַד מְאֹד
  choice: était très belle
  rationale: La construction exprime un haut degré de beauté. « Très belle » rend clairement l’intensité tout en restant naturelle et sobre.
- source_word: סֹכֶנֶת
  choice: l’auxiliaire du roi
  rationale: Le terme désigne une femme attachée au roi pour lui apporter aide et soins. « Auxiliaire » préserve cette fonction de soutien sans la limiter à des soins médicaux ni suggérer une relation amoureuse.
- source_word: וַתְּשָׁרְתֵהוּ
  choice: et le servit
  rationale: שרת signifie servir ou être au service de quelqu’un. Cette formulation directe convient au registre narratif et distingue l’activité de service du rôle exprimé par סֹכֶנֶת.
- source_word: יְדָעָהּ
  choice: ne la connut pas
  rationale: ידע est employé ici comme euphémisme pour les relations sexuelles. Le texte principal conserve l’image hébraïque, tandis que la note en explicite le sens.
theological_decisions:
- issue: Euphémisme sexuel dans le récit
  choice: Conserver « le roi ne la connut pas » dans le texte principal et en expliquer le sens dans une note.
  alternative: « le roi n’eut pas de relations sexuelles avec elle »
  rationale: Ce choix préserve l’expression littéraire de l’hébreu et la tension narrative, tout en indiquant sans ambiguïté au lecteur que David n’eut pas d’union sexuelle avec la jeune femme.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression hébraïque, avec une ponctuation naturelle. « Auxiliaire » évite aussi bien le vocabulaire médical trop précis que les connotations romantiques.
