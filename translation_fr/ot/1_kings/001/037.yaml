source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: fr
  text: Comme Yahweh a été avec mon seigneur le roi, de même, qu’il soit avec Salomon[a] et qu’il rende son trône plus grand que celui de mon seigneur, le roi David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que Yahweh soit avec Salomon ». En hébreu, le verbe exprimant le souhait n’énonce pas son sujet ; celui-ci renvoie à Yahweh dans la proposition précédente.'
    reason: Précision sur le sujet implicite du jussif et possibilité d’explicitation en français.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme nom divin personnel plutôt que remplacé par un titre.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Comme… de même
  rationale: Cette tournure française naturelle conserve la construction comparative corrélative de l’hébreu.
- source_word: הָיָה ... עִם
  choice: a été avec
  rationale: Le passé composé exprime naturellement le regard rétrospectif sur l’accompagnement de David, sans exclure sa continuité.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette formule conserve la déférence de l’expression de cour et le titre royal.
- source_word: יהי
  choice: qu’il soit
  rationale: Le subjonctif à valeur optative rend le jussif hébreu; le sujet demeure implicite et renvoie à Yahweh.
- source_word: וִיגַדֵּל
  choice: et qu’il rende… plus grand
  rationale: Le hifil exprime ici l’action de rendre grand; la comparaison qui suit appelle « plus grand ».
- source_word: כִּסְאוֹ
  choice: son trône
  rationale: Le concret « trône » est conservé, tout en laissant subsister sa portée possible de royauté ou de règne.
- source_word: מִכִּסֵּא
  choice: plus grand que celui de
  rationale: La préposition מן introduit le second terme de la comparaison; « celui » évite une répétition lourde en français.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: mon seigneur, le roi David
  rationale: La formulation française conserve à la fois l’honorifique, le titre et le nom propre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ou le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; sa transcription préserve le nom personnel et évite de lui substituer un titre.
- issue: Sujet implicite du jussif יהי
  choice: qu’il soit
  alternative: que Yahweh soit
  rationale: L’hébreu laisse le sujet inexprimé tout en renvoyant clairement à Yahweh dans la proposition précédente; le pronom préserve cette continuité et l’ambiguïté grammaticale formelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme de la bénédiction, tandis que « celui de » allège la répétition sans effacer l’image concrète du trône.
