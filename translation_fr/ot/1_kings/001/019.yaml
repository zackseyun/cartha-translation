base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: fr
  text: Il a sacrifié des bovins, du bétail engraissé et du petit bétail[a] en abondance, et il a invité tous les fils du roi, le prêtre Abiathar et Joab, chef de l’armée. Mais il n’a pas invité ton serviteur Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « petit bétail » peut désigner aussi bien des moutons que des chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Il a sacrifié
  rationale: Le verbe זבח désigne ici l’abattage sacrificiel, et non un simple abattage de boucherie.
- source_word: שׁוֹר
  choice: des bovins
  rationale: Le terme désigne un animal de l’espèce bovine sans imposer ici un sexe précis; « bovins » convient à l’emploi collectif.
- source_word: מְרִיא
  choice: des bêtes grasses
  rationale: Le nom désigne du bétail engraissé. « Bêtes grasses » est naturel dans une liste sacrificielle et reste distinct de la catégorie précédente.
- source_word: צֹאן
  choice: du petit bétail
  rationale: Le terme collectif peut englober les moutons et les chèvres; « petit bétail » préserve cette étendue sémantique.
- source_word: לָרֹב
  choice: en abondance
  rationale: Cette expression indique une quantité considérable et se rend naturellement ainsi en français.
- source_word: וַיִּקְרָא ... לֹא קָרָא
  choice: il a invité ... il n’a pas invité
  rationale: Même si קרא signifie littéralement « appeler », le contexte d’un sacrifice accompagné d’un festin indique une invitation; la répétition française conserve celle de l’hébreu.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: tous les fils du roi
  rationale: Traduction directe qui maintient la référence spécifiquement masculine aux fils royaux.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: le prêtre Abiathar
  rationale: L’ordre français naturel place le titre avant le nom, sans modifier sa fonction.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: Joab, chef de l’armée
  rationale: שַׂר הַצָּבָא désigne le principal responsable militaire; « chef de l’armée » est clair et idiomatique.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ
  choice: Mais il n’a pas invité ton serviteur Salomon
  rationale: « Mais » explicite le contraste contextuel porté par le waw, tandis que l’antéposition de « ton serviteur » restitue naturellement la formule déférente adressée à David.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’ampleur du sacrifice, la liste des invités et le contraste marqué par l’exclusion de Salomon.
