base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: fr
  text: Le roi envoya avec lui le prêtre Tsadok, le prophète Nathan, Benaya, fils de Yehoyada, ainsi que les Kérétiens et les Pélétiens. Ils le firent monter sur la mule du roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: Le roi envoya avec lui
  rationale: Le verbe שׁלח exprime ici simplement l’envoi, et אִתּוֹ l’accompagnement. L’ordre français place naturellement le sujet avant le verbe.
- source_word: צָדוֹק הַכֹּהֵן
  choice: le prêtre Tsadok
  rationale: L’apposition hébraïque est rendue dans l’ordre le plus naturel en français moderne. La translittération « Tsadok » représente clairement le צ initial.
- source_word: נָתָן הַנָּבִיא
  choice: le prophète Nathan
  rationale: Le titre est placé avant le nom, conformément à l’usage français courant, sans modifier le sens de l’apposition.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya, fils de Yehoyada
  rationale: Le patronyme hébreu est conservé explicitement. Les formes choisies restent lisibles en français tout en reflétant les consonnes des noms hébreux.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: les Kérétiens et les Pélétiens
  rationale: Ces désignations de groupes sont translittérées plutôt qu’interprétées. Les formes françaises maintiennent leur parallélisme.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: Ils le firent monter
  rationale: La tournure causative française rend directement le hiphil de רכב et évite de suggérer qu’ils l’ont eux-mêmes porté ou soulevé.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: sur la mule du roi
  rationale: פִּרְדָּה désigne une mule femelle. Le français « mule » exprime naturellement ce sens tout en restant idiomatique.
