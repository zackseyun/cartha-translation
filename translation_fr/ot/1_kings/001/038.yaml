  text: וַ/יֵּ֣רֶד צָד֣וֹק הַ֠/כֹּהֵן וְ/נָתָ֨ן הַ/נָּבִ֜יא וּ/בְנָיָ֣הוּ בֶן יְהוֹיָדָ֗ע וְ/הַ/כְּרֵתִי֙ וְ/הַ/פְּלֵתִ֔י וַ/יַּרְכִּ֨בוּ֙ אֶת שְׁלֹמֹ֔ה עַל פִּרְדַּ֖ת הַ/מֶּ֣לֶךְ דָּוִ֑ד וַ/יֹּלִ֥כוּ אֹת֖/וֹ עַל גִּחֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: fr
  text: Alors le prêtre Tsadok, le prophète Nathan, Benaya, fils de Yehoyada, les Kerétiens et les Pelétiens descendirent. Ils firent monter Salomon sur la mule[a] du roi David et le conduisirent à Guihon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un nom féminin qui désigne une mule femelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendirent
  rationale: Préserve le sens directionnel de ירד tout en restant naturel dans le contexte narratif.
- source_word: הַכֹּהֵן
  choice: le prêtre
  rationale: Équivalent français courant de כהן, placé en apposition avec Tsadok.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Équivalent direct et usuel de נביא.
- source_word: בֶן יְהוֹיָדָע
  choice: fils de Yehoyada
  rationale: Rend directement le patronyme hébreu.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: les Kerétiens et les Pelétiens
  rationale: Conserve les noms des deux groupes sans imposer l'interprétation fonctionnelle possible de « garde royale ».
- source_word: וַיַּרְכִּבוּ
  choice: ils firent monter Salomon
  rationale: Rend explicitement la valeur causative du hiphil de רכב dans un français naturel.
- source_word: פִּרְדַּת
  choice: la mule
  rationale: Le nom hébreu est féminin et désigne ici une mule; le français permet de conserver naturellement cette précision grammaticale et lexicale.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: du roi David
  rationale: Rend fidèlement la relation possessive de la chaîne construite hébraïque.
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: le conduisirent
  rationale: Reflète la forme causative de הלך et convient au déplacement cérémoniel de Salomon monté sur la mule.
- source_word: עַל גִּחוֹן
  choice: à Guihon
  rationale: Dans ce contexte de mouvement vers un lieu, על indique idiomatiquement la destination.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase est divisée en deux pour éviter une coordination trop lourde. Les titres restent en apposition et les noms des Kerétiens et des Pelétiens sont conservés plutôt que remplacés par une interprétation telle que « garde royale ».
