source:
  edition: WLC
  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: fr
  text: 'On informa Salomon en ces termes : « Voici qu’Adonias a peur du roi Salomon et voici qu’il s’est agrippé aux cornes de l’autel, en disant : “Que le roi Salomon me jure aujourd’hui qu’il ne fera pas mourir son serviteur par l’épée.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה
  choice: On informa Salomon
  rationale: Le passif hébreu impersonnel est rendu par une tournure française naturelle qui conserve l’indétermination de l’informateur.
- source_word: הִנֵּה
  choice: Voici que / Il a
  rationale: La première occurrence attire l’attention sur la crainte d’Adonias. La seconde n’est pas répétée mécaniquement, afin d’éviter une lourdeur peu naturelle en français tout en conservant la vivacité du rapport.
- source_word: יָרֵא אֶת
  choice: a peur de
  rationale: Dans ce contexte de recherche de protection, le verbe exprime la peur devant Salomon plutôt que le respect révérenciel.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: les cornes de l’autel
  rationale: Rendu concret et traditionnel de l’expression cultuelle, sans explicitation interprétative.
- source_word: יִשָּׁבַע לִי כַיּוֹם
  choice: me jure aujourd’hui
  rationale: Reproduit clairement la demande d’un serment immédiat adressé en faveur d’Adonias.
- source_word: אִם יָמִית אֶת עַבְדּוֹ בֶּחָרֶב
  choice: qu’il ne fera pas mourir son serviteur par l’épée
  rationale: La formule hébraïque abrégée de serment avec אִם porte ici une valeur négative; le français explicite cette valeur sans ajouter le châtiment sous-entendu.
theological_decisions:
- issue: Valeur de יָרֵא à l’égard du roi Salomon
  choice: a peur du roi Salomon
  alternative: craint le roi Salomon
  rationale: « A peur de » exprime sans ambiguïté la détresse d’Adonias dans la scène; « craindre » pourrait être compris comme une révérence politique ou religieuse.
- issue: Formule de serment négative avec אִם
  choice: qu’il ne fera pas mourir son serviteur
  alternative: s’il fait mourir son serviteur
  rationale: La traduction restitue le sens pragmatique certain de la formule tout en évitant qu’une reproduction littérale ne fasse dire en français le contraire de la demande.
translation_notes:
  register: Français moderne, digne et narratif. La syntaxe évite le calque « disant » tout en maintenant le discours rapporté. « Son serviteur » conserve l’auto-désignation humble d’Adonias, et « par l’épée » préserve l’image exacte du texte hébreu.
