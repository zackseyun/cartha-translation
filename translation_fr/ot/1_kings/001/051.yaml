- from: 'On informa Salomon en ces termes : « Voici qu’Adonias a peur du roi Salomon. Il a saisi les cornes de l’autel et dit : “Que le roi Salomon me jure aujourd’hui qu’il ne fera pas mourir son serviteur par l’épée.” »'
  to: 'On informa Salomon en ces termes : « Voici qu’Adonias a peur du roi Salomon et voici qu’il s’est agrippé aux cornes de l’autel, en disant : “Que le roi Salomon me jure aujourd’hui qu’il ne fera pas mourir son serviteur par l’épée.” »'
  rationale: La révision rétablit la double mise en relief de הִנֵּה et remplace « et dit » par « en disant », qui correspond plus exactement à לֵאמֹר et produit une syntaxe française naturelle. Le reste du texte est conservé, notamment la formulation explicite de la demande négative contenue dans la formule de serment.
