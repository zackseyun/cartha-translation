base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: fr
  text: 'Alors le prêtre Sadoc prit de la tente[a] la corne d’huile et oignit Salomon. Puis ils sonnèrent du shofar[b], et tout le peuple s’écria : « Vive le roi Salomon ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du tabernacle »; l’hébreu dit simplement « de la tente ».
    reason: alternative_reading
  - marker: b
    text: 'Hébreu shofar : instrument à vent fait d’une corne, souvent une corne de bélier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le passé simple fait progresser naturellement le récit et rend la forme narrative hébraïque sans lourdeur.
- source_word: צָדוֹק הַכֹּהֵן
  choice: le prêtre Sadoc
  rationale: Cette tournure française naturelle conserve à la fois le nom propre et le titre de Sadoc.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: la corne contenant l’huile
  rationale: « Corne » préserve l’objet rituel concret; « contenant l’huile » exprime clairement la relation entre le récipient et son contenu.
- source_word: מִן הָאֹהֶל
  choice: dans la tente
  rationale: Le français emploie naturellement « prendre dans » pour indiquer l’endroit d’où l’objet est retiré. « Tente » respecte le terme hébreu courant sans préciser davantage le type de sanctuaire.
- source_word: וַיִּמְשַׁח
  choice: donna l’onction à
  rationale: Cette expression rend l’acte rituel de משׁח dans un français actuel et digne, tout en évitant l’ambiguïté moderne possible du verbe isolé « oindre ».
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: ils sonnèrent du cor
  rationale: « Sonner du cor » est idiomatique en français et conserve l’image d’un instrument à vent en corne; la note précise le terme hébreu.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Rendu direct de l’expression collective, qui souligne le caractère public de l’acclamation.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Vive le roi Salomon !
  rationale: Formule française consacrée d’acclamation royale, correspondant à la valeur volitive du jussif hébreu.
theological_decisions:
- issue: Degré de précision de הָאֹהֶל dans le contexte de l’onction royale
  choice: la tente
  alternative: le tabernacle; la tente sacrée
  rationale: L’hébreu emploie simplement le nom commun « tente » avec l’article. Même si le contexte suggère une tente-sanctuaire, la traduction ne transforme pas cette indication en terme cultuel plus technique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme excessif. Les notes ont été placées auprès des mots qu’elles expliquent, contrairement à leur position manifestement inversée dans la couche anglaise fournie.
