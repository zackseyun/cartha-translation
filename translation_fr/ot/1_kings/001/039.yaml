review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, « dans la tente » peut se comprendre comme le lieu où Sadoc a pris l’objet, alors que מן marque explicitement la provenance (« de la tente »). La note a emploie elle aussi à tort « dans le tabernacle » comme variante. « Shofar » permet de rendre précisément l’instrument défini du texte sans l’assimiler à un cor moderne.
  naturalness: Le récit au passé simple et l’acclamation « Vive le roi Salomon ! » sont naturels dans un français biblique moderne et international. « Donner l’onction » est recevable, mais « oignit » est plus direct pour l’acte rituel précis et reste courant dans ce registre.
  terminology: « Sadoc », « prêtre », « tente », « corne d’huile », « oignit » et « shofar » respectent les termes et le registre du passage. La note explique de façon accessible le mot hébreu translittéré.
  issues:
  - severity: medium
    issue: Préposition et note a non conformes à la provenance exprimée par מן.
    rationale: Le texte hébreu dit que la corne d’huile est prise « de la tente ». La formulation et la note actuelles disent « dans », ce qui ne rend pas explicitement ce rapport de provenance et produit une variante « dans le tabernacle » qui ne correspond pas à l’alternative annoncée.
  - severity: low
    issue: « Sonnèrent du cor » est moins précis que le shofar défini du texte.
    rationale: Le shofar est un instrument particulier; « cor » peut évoquer un instrument moderne ou générique. La translittération, expliquée en note, conserve l’ambiguïté matérielle sans imposer « trompette ».
  revised_text: 'Alors le prêtre Sadoc prit de la tente[a] la corne d’huile et oignit Salomon. Puis ils sonnèrent du shofar[b], et tout le peuple s’écria : « Vive le roi Salomon ! »'
  revised_footnotes:
