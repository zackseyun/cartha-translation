  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: fr
  text: 'Voici : pendant que tu seras encore en train de parler là-bas avec le roi, j’entrerai après toi et je confirmerai tes paroles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je compléterai tes paroles » ou « je développerai ce que tu auras dit » ; l’expression hébraïque peut désigner l’ajout de précisions qui confirment les propos d’une autre personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: La particule attire l’attention sur le déroulement immédiat du plan. « Voici » conserve cette valeur déictique dans un registre digne sans recourir à l’archaïsme « voici que ».
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: pendant que tu parleras encore
  rationale: L’adverbe suffixé et le participe féminin décrivent l’action de Bethsabée encore en cours au moment où Nathan interviendra. Le futur convient naturellement au plan annoncé en français.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: là avec le roi
  rationale: Cette formulation conserve l’adverbe de lieu et le sens courant de עִם, tout en évoquant une conversation en présence du roi.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: j’entrerai après toi
  rationale: Dans le cadre du palais, בוא implique vraisemblablement l’entrée auprès du roi. « J’entrerai » rend ce mouvement avec naturel, et « après toi » préserve l’enchaînement prévu.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: je confirmerai tes paroles
  rationale: L’expression idiomatique peut signifier compléter les propos de quelqu’un en leur apportant un appui. Dans ce contexte, Nathan entend corroborer la déclaration de Bethsabée; « confirmer » rend clairement cette fonction sans effacer les autres possibilités, signalées en note.
