source:
  edition: WLC
  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: fr
  text: 'Va trouver le roi David et dis-lui : « Mon seigneur le roi, ne m’as-tu pas juré, à moi, ta servante[a] : “Ton fils Salomon régnera après moi, et c’est lui qui siégera sur mon trône” ? Pourquoi donc Adonias est-il devenu roi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un nom explicitement féminin : Bethsabée se désigne avec déférence comme la servante du roi.'
    reason: Précision lexicale et socioculturelle sur l’autodésignation féminine אֲמָה.
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: Va trouver
  rationale: Les deux impératifs féminins singuliers expriment le déplacement puis l’entrée auprès du roi. « Va trouver » restitue naturellement l’ensemble en français sans redondance maladroite.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette formulation française naturelle conserve le titre et le nom.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: et dis-lui
  rationale: Le parfait consécutif prolonge ici l’instruction impérative.
- source_word: הֲלֹא
  choice: ne m’as-tu pas
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative; le pronom indirect explicite en français le complément exprimé ensuite en hébreu.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mon seigneur le roi
  rationale: Formule de respect adressée à un souverain humain, dans un registre digne et intelligible.
- source_word: נִשְׁבַּעְתָּ
  choice: juré
  rationale: Le verbe désigne explicitement le fait de prêter serment.
- source_word: לַאֲמָתְךָ
  choice: à moi, ta servante
  rationale: Le nom est explicitement féminin et constitue l’autodésignation déférente de Bethsabée; le français conserve cette information directement dans le texte.
- source_word: לֵאמֹר כִּי
  choice: ':'
  rationale: Les particules introduisent le contenu cité du serment. Les deux-points sont idiomatiques en français, sans ajouter une emphase absente du contexte immédiat.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: Ton fils Salomon
  rationale: Ordre naturel en français qui préserve le lien filial mis en avant.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: régnera après moi
  rationale: Rend directement le règne et la succession, sans préciser davantage le mécanisme d’accession.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: et c’est lui qui siégera sur mon trône
  rationale: La tournure clivée rend l’insistance du pronom indépendant הוּא tout en conservant l’image royale du trône.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָּהוּ
  choice: Pourquoi donc Adonias est-il devenu roi ?
  rationale: « Donc » fait ressortir la conséquence argumentative; le parfait décrit ici l’accession déjà revendiquée par Adonias, plutôt qu’un règne durable.
theological_decisions:
- issue: Statut royal d’Adonias exprimé par מָלַךְ
  choice: est-il devenu roi
  alternative: règne-t-il
  rationale: La traduction conserve la présentation du fait du point de vue de la question rapportée, sans valider théologiquement ou juridiquement la légitimité d’Adonias.
- issue: Emphase de כִּי dans la citation du serment
  choice: aucun adverbe emphatique ajouté
  alternative: assurément / oui
  rationale: Dans לֵאמֹר כִּי, כִּי peut simplement introduire le contenu du serment. Ne pas ajouter « assurément » évite de surtraduire une emphase incertaine.
translation_notes:
  register: Français international moderne, digne et fluide. Le tutoiement correspond à la deuxième personne singulière de l’hébreu et reste naturel dans l’adresse personnelle au roi. « Adonias » suit la forme française biblique usuelle du nom.
