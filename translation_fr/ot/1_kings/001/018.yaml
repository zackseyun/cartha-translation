  text: Et maintenant, voici qu’Adonias est devenu roi ; et maintenant, mon seigneur le roi, tu ne le sais pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Reproduit la transition insistante du texte hébreu; la répétition est rendue ensuite naturellement par « et toi » afin d’éviter une lourdeur excessive en français.
- source_word: הִנֵּה
  choice: voici que
  rationale: Marque l’attention et le caractère saisissant de l’annonce dans un français courant et digne.
- source_word: מָלָךְ
  choice: est devenu roi
  rationale: Dans ce contexte, le parfait indique l’accession ou la prise de la royauté plutôt qu’un simple état durable.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Conserve le titre respectueux adressé à David sans confondre אֲדֹנִי avec le nom divin.
- source_word: לֹא יָדָעְתָּ
  choice: tu ne le sais pas
  rationale: Rend directement la négation et le parfait de ידע, avec un pronom reprenant l’événement annoncé.
theological_decisions:
- issue: Statut de la royauté d’Adonias
  choice: est devenu roi
  alternative: règne
  rationale: La formulation rapporte la prise ou la revendication effective de la royauté sans trancher sa légitimité théologique ou dynastique.
translation_notes:
  register: Français moderne international, naturel et respectueux. Le tutoiement convient à l’adresse personnelle en contexte royal biblique; la répétition hébraïque de « maintenant » est légèrement lissée sans supprimer l’insistance rhétorique.
