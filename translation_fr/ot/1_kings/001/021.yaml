source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּ/שְׁכַ֥ב אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ עִם אֲבֹתָ֑י/ו וְ/הָיִ֗יתִי אֲנִ֛י וּ/בְנִ֥/י שְׁלֹמֹ֖ה חַטָּאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: fr
  text: Quand mon seigneur le roi reposera avec ses ancêtres, mon fils Salomon et moi, nous serons considérés comme coupables[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pécheurs ». Le terme hébreu peut désigner des personnes jugées fautives ou coupables ; ici, le contexte évoque probablement un statut politique et juridique plutôt qu’un simple jugement moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: nous serons
  rationale: La tournure introduit ici la conséquence redoutée; une construction française fluide au futur rend mieux la fonction de l’hébreu qu’un calque tel que « il arrivera que ».
- source_word: כִּשְׁכַב
  choice: quand ... reposera
  rationale: Le verbe שׁכב associé aux ancêtres est un idiome de mort. « Reposera » conserve l’image sans être aussi mécanique que « se couchera » en français.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette formulation garde le ton respectueux de l’adresse de cour faite à David.
- source_word: עִם אֲבֹתָיו
  choice: avec ses ancêtres
  rationale: « Ancêtres » exprime naturellement en français moderne la référence aux pères défunts tout en préservant l’idiome familial.
- source_word: וְהָיִיתִי אֲנִי
  choice: moi, nous serons considérés
  rationale: Le verbe « être » avec חטאים indique vraisemblablement un statut imputé à Bethsabée et à Salomon; « considérés » explicite sans surdéterminer ce statut social et politique.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: mon fils Salomon et moi
  rationale: L’ordre est adapté à l’usage français naturel tout en conservant le lien filial et le nom propre.
- source_word: חַטָּאִים
  choice: coupables
  rationale: Dans le contexte de la succession, le terme désigne probablement des personnes tenues pour fautives ou passibles de sanction. « Coupables » conserve aussi la portée morale possible mieux que « criminels ».
theological_decisions: []
