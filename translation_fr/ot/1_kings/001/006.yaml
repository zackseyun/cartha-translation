reference: 1 Kings 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹֽא עֲצָב֨/וֹ אָבִ֤י/ו מִ/יָּמָי/ו֙ לֵ/אמֹ֔ר מַדּ֖וּעַ כָּ֣כָה עָשִׂ֑יתָ וְ/גַם ה֤וּא טֽוֹב תֹּ֨אַר֙ מְאֹ֔ד וְ/אֹת֥/וֹ יָלְדָ֖ה אַחֲרֵ֥י אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: fr
  text: 'Son père ne l’avait jamais contrarié[a] en lui disant : « Pourquoi as-tu agi ainsi ? » Lui aussi était très beau, et il était né après Absalom[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « peiné », « affligé » ou « repris ». Le verbe hébreu évoque le fait de causer peine ou contrariété ; dans ce contexte, il souligne que David n’avait jamais arrêté ni confronté Adonias.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et elle l’avait mis au monde après Absalom ». La tournure indique ici l’ordre des naissances, non qu’Adonias et Absalom avaient la même mère.'
    reason: clarification
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: contrarié
  rationale: Le verbe peut exprimer le fait de peiner, d’affliger ou de mécontenter quelqu’un. Ici, la question qui suit montre que David n’avait jamais repris ni contrecarré Adonias. « Contrarié » conserve l’idée de lui causer du déplaisir sans réduire le sens à une réprimande formelle.
- source_word: מִיָּמָיו
  choice: jamais
  rationale: L’expression signifie littéralement « depuis ses jours » et, avec la négation, désigne tout le cours de sa vie. « Jamais » en rend naturellement la force en français.
- source_word: לֵאמֹר
  choice: en lui disant
  rationale: Cette tournure introduit le contenu de la correction que son père ne lui avait jamais adressée.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: Pourquoi as-tu agi ainsi ?
  rationale: La formulation garde la question directe et le caractère général de כָּכָה, tout en restant naturelle en français moderne.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: très beau
  rationale: L’expression décrit l’apparence physique. « Très beau » est clair, idiomatique et approprié pour un homme.
- source_word: וְאֹתוֹ יָלְדָה אַחֲרֵי אַבְשָׁלוֹם
  choice: il était né après Absalom
  rationale: La phrase situe Adonias dans l’ordre des naissances. Cette formulation naturelle évite de suggérer à tort qu’Adonias et Absalom avaient la même mère, tout en préservant le sens chronologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé dans la question rend une interpellation directe encore pertinente au moment où elle aurait dû être formulée ; le plus-que-parfait présente l’indulgence durable du père comme un fait antérieur au récit.
