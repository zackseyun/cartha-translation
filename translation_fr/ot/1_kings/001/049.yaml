  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: fr
  text: Alors tous les invités d’Adonias tremblèrent, se levèrent, et chacun partit de son côté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: pris de peur
  rationale: Le verbe חרד exprime le tremblement causé par la peur ou l’alarme. En français narratif, « pris de peur » rend naturellement la réaction sans l’intensifier jusqu’à « terrifiés ».
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le verbe קום signifie ici se lever; cette formulation convient à des convives qui quittent soudainement le banquet.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: tous les invités d’Adonias
  rationale: Le participe passif הַקְּרֻאִים désigne les personnes invitées, et la construction avec ל marque ici leur association avec Adonias.
- source_word: וַיֵּלְכוּ
  choice: partit
  rationale: Le verbe הלך signifie fondamentalement aller. Avec « chacun » et dans ce contexte de dispersion, « partit » constitue une expression française naturelle.
- source_word: אִישׁ לְדַרְכּוֹ
  choice: chacun partit de son côté
  rationale: L’expression distributive signifie littéralement qu’un homme alla vers son propre chemin. « Chacun partit de son côté » rend clairement et idiomatiquement la dispersion individuelle.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La formulation conserve la succession rapide des réactions tout en rendant idiomatiquement l’expression hébraïque finale.
