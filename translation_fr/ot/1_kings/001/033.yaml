base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: fr
  text: 'Le roi leur dit : « Emmenez avec vous les serviteurs de votre seigneur, faites monter[a] Salomon, mon fils, sur la mule qui m’appartient, et faites-le descendre à Guihon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mettez Salomon, mon fils, sur la mule qui m’appartient ». Le verbe hébreu est causatif : les serviteurs doivent placer Salomon sur la mule pour qu’il la monte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Dans ce cadre royal, le terme désigne les hommes au service du roi sans préciser leur statut juridique; « serviteurs » convient donc mieux que « esclaves ».
- source_word: אֲדֹנֵיכֶם
  choice: votre seigneur
  rationale: Le roi parle de lui-même à la troisième personne selon l’usage de cour. « Votre seigneur » préserve ce registre solennel et politique.
- source_word: וְהִרְכַּבְתֶּם
  choice: faites monter
  rationale: La forme causative indique que les destinataires doivent faire en sorte que Salomon monte sur la mule. Cette tournure française est à la fois précise et naturelle.
- source_word: שְׁלֹמֹה בְנִי
  choice: Salomon, mon fils
  rationale: L’apposition rend explicitement la relation filiale soulignée par le roi et suit naturellement l’ordre du discours en français.
- source_word: הַפִּרְדָּה
  choice: la mule
  rationale: Le nom hébreu désigne une mule; son sexe grammatical n’a pas besoin d’être davantage explicité en français.
- source_word: אֲשֶׁר לִי
  choice: qui m’appartient
  rationale: La proposition relative est conservée afin de mettre en relief l’appartenance personnelle de la mule au roi, signe de son autorisation royale.
- source_word: וְהוֹרַדְתֶּם
  choice: faites-le descendre
  rationale: La forme causative de ירד exprime un déplacement vers le bas. La traduction conserve cette donnée topographique plutôt que de la réduire à « conduisez-le ».
- source_word: גִּחוֹן
  choice: Guihon
  rationale: Le nom propre est translittéré selon son graphisme français biblique courant.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Le roi leur dit
  rationale: Le passé simple convient au récit français et rend naturellement la progression narrative portée par le waw consécutif.
