reference: 1 Kings 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נָתָ֗ן אֶל בַּת שֶׁ֤בַע אֵם שְׁלֹמֹה֙ לֵ/אמֹ֔ר הֲ/ל֣וֹא שָׁמַ֔עַתְּ כִּ֥י מָלַ֖ךְ אֲדֹנִיָּ֣הוּ בֶן חַגִּ֑ית וַ/אֲדֹנֵ֥י/נוּ דָוִ֖ד לֹ֥א יָדָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: fr
  text: 'Alors Nathan dit à Bethsabée, mère de Salomon : « N’as-tu pas appris qu’Adonias, fils de Haggith, est devenu roi[a], et que notre seigneur David ne le sait pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’est fait roi ». Littéralement, l’hébreu peut signifier « est devenu roi » ou « a régné » ; le contexte peut laisser entendre qu’Adonias s’est élevé lui-même à la royauté, mais ce verset ne l’affirme pas explicitement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession narrative en français moderne.
- source_word: בַּת שֶׁבַע
  choice: Bethsabée
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: אֵם שְׁלֹמֹה
  choice: mère de Salomon
  rationale: Rend directement la relation exprimée par l’état construit, dans un français naturel.
- source_word: לֵאמֹר
  choice: non rendu séparément
  rationale: La formule hébraïque d’introduction de la parole est déjà exprimée en français par « dit » et les guillemets ; ajouter « en disant » serait redondant.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: N’as-tu pas appris
  rationale: הֲלוֹא introduit une question rhétorique qui attend une confirmation. Dans ce contexte, שׁמע désigne la réception d’une nouvelle ; « appris » est idiomatique sans perdre ce sens.
- source_word: מָלַךְ
  choice: est devenu roi
  rationale: Le verbe peut désigner l’accession à la royauté ou l’exercice du règne. Ici, « est devenu roi » conserve la valeur événementielle sans affirmer explicitement qu’Adonias s’est lui-même proclamé roi.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: Adonias, fils de Haggith
  rationale: Les noms sont rendus selon leurs formes françaises usuelles ou par translittération, et la filiation est exprimée directement.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: et que notre seigneur David
  rationale: Le titre humain אֲדֹנֵינוּ est conservé dans un registre respectueux ; la minuscule distingue cet emploi de tout titre divin.
- source_word: לֹא יָדָע
  choice: ne le sait pas
  rationale: Le parfait hébreu décrit ici l’ignorance actuelle de David. Le pronom « le » explicite en français l’objet implicite du verbe.
theological_decisions:
- issue: Sens de מָלַךְ dans la tentative d’accession d’Adonias
  choice: est devenu roi
  alternative: s’est fait roi / s’est proclamé roi
  rationale: Le contexte peut suggérer une usurpation ou une auto-exaltation, mais le verbe employé dans ce verset ne l’énonce pas explicitement. La traduction principale maintient donc l’ambiguïté, tandis que la note signale l’interprétation contextuelle possible.
- issue: Titre אֲדֹנֵינוּ appliqué à David
  choice: notre seigneur David
  alternative: notre maître David
  rationale: Il s’agit d’un titre de cour humain et respectueux, non d’un titre divin. La minuscule évite toute confusion théologique tout en conservant la dignité du propos.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la question rhétorique et la coordination hébraïques, tout en évitant la formule française redondante « en disant ». Les noms bibliques suivent les formes françaises courantes.
