source:
  edition: WLC
  text: וְ/עַתָּ֕ה לְכִ֛י אִיעָצֵ֥/ךְ נָ֖א עֵצָ֑ה וּ/מַלְּטִי֙ אֶת נַפְשֵׁ֔/ךְ וְ/אֶת נֶ֥פֶשׁ בְּנֵ֖/ךְ שְׁלֹמֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/012.yaml
  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
translation:
  language: fr
  text: 'Maintenant, viens donc : laisse-moi te donner un conseil, et sauve ta vie ainsi que celle de ton fils Salomon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit une transition urgente dans le discours; la conjonction hébraïque a ici surtout une fonction de liaison et n’exige pas nécessairement « et » en français.
- source_word: לְכִי
  choice: viens donc
  rationale: Bien que le verbe signifie littéralement « aller, marcher », cette forme fonctionne ici comme une invitation pressante. « Viens donc » rend naturellement cette force en français.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: laisse-moi te donner un conseil
  rationale: La construction associe le verbe « conseiller » au nom apparenté « conseil ». Le français idiomatique évite cette répétition; « laisse-moi te donner un conseil » conserve le sens et la nuance d’exhortation portée par נָא.
- source_word: וּמַלְּטִי
  choice: afin que tu sauves
  rationale: L’impératif appelle Bethsabée à agir pour préserver sa vie. En français, la subordination finale relie naturellement le conseil à son objectif sans affaiblir l’urgence.
- source_word: נַפְשֵׁךְ
  choice: ta vie
  rationale: נֶפֶשׁ désigne ici la vie de la personne menacée, non une âme immatérielle.
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: et celle de ton fils Salomon
  rationale: « Celle » reprend clairement « ta vie » et préserve le parallélisme tout en évitant une répétition lourde.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond aux formes féminines singulières adressées à Bethsabée. « Viens donc » et « laisse-moi » rendent l’urgence persuasive sans archaïsme.
