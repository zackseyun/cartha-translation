source:
  edition: WLC
  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: fr
  text: Si cette affaire[a] vient de mon seigneur le roi, ne fais-tu pas savoir à tes serviteurs qui siégera sur le trône de mon seigneur le roi après lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette chose » ou « ce fait » .
    reason: Alternative lexicale pour le terme large דָּבָר dans ce contexte.
lexical_decisions:
- source_word: אִם
  choice: Est-ce… que
  rationale: Dans ce contexte, אִם introduit une question rhétorique incisive. La tournure interrogative française préserve cette force sans transformer la question en affirmation.
- source_word: מֵאֵת אֲדֹנִי הַמֶּלֶךְ נִהְיָה
  choice: de mon seigneur le roi que vient
  rationale: Cette formulation exprime l’origine ou l’autorisation royale indiquée par מֵאֵת avec נִהְיָה, tout en restant naturelle en français.
- source_word: הַדָּבָר הַזֶּה
  choice: cette affaire
  rationale: דָּבָר est un terme large qui désigne ici l’action ou la décision royale rapportée. « Affaire » convient au contexte politique sans préciser excessivement la nature de l’acte.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: sans que tu aies fait savoir
  rationale: Le hiphil de ידע signifie « faire savoir, informer ». « Sans que » rend naturellement en français le lien étonné et accusateur entre l’origine royale supposée de l’affaire et l’absence d’information.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans le cadre de la cour, עבד est une désignation déférente des officiers du roi. « Serviteurs » exprime cette subordination sans mettre indûment l’accent sur l’esclavage.
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: qui siégera sur le trône
  rationale: « Siégera sur le trône » conserve l’image hébraïque explicite de la succession royale plutôt que de la réduire au seul verbe « régner ».
- source_word: אַחֲרָיו
  choice: après lui
  rationale: La traduction directe garde l’idée temporelle de succession sans expliciter davantage par « à sa place ».
theological_decisions:
- issue: Sens de עבד dans une adresse de cour
  choice: tes serviteurs
  alternative: tes esclaves
  rationale: Il s’agit ici d’une formule conventionnelle de déférence employée par des responsables de la cour. Le contexte met en avant leur relation de service au roi, non leur statut juridique éventuel.
- issue: Origine ou autorisation royale de l’affaire
  choice: de mon seigneur le roi que vient
  alternative: sur l’ordre de mon seigneur le roi
  rationale: 'La formulation retenue conserve la latitude de מֵאֵת : l’affaire peut émaner du roi ou avoir reçu son autorisation. « Sur l’ordre » trancherait plus nettement en faveur d’un commandement explicite.'
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition de « mon seigneur le roi » est conservée comme élément de la déférence solennelle de la cour. La question demeure rhétorique et laisse subsister l’ambiguïté entre origine et autorisation royales.
