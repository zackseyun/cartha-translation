translation_notes:
  register: Français international moderne, digne et oralement fluide. Le tutoiement respecte l'adresse au roi dans le cadre biblique français. La reprise par « nous » évite une dislocation maladroite tout en préservant l'insistance initiale et l'ensemble de la liste.
