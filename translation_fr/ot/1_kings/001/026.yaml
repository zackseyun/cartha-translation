base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: fr
  text: Mais moi, ton serviteur, ainsi que le prêtre Tsadok, Benaya, fils de Yehoïada, et Salomon, ton serviteur, il ne nous a pas invités.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il ne nous a pas appelés » ou « il ne nous a pas convoqués ». Le verbe hébreu peut signifier appeler, convoquer ou inviter ; « inviter » convient au contexte immédiat du festin sacrificiel d’Adonias.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: Mais moi, ton serviteur
  rationale: Le groupe prépositionnel placé en tête et le pronom indépendant marquent fortement le contraste. « Mais moi » le rend naturellement, tandis que « ton serviteur » conserve le langage déférent de la cour.
- source_word: צָדֹק הַכֹּהֵן
  choice: le prêtre Tsadok
  rationale: Le titre défini est rendu dans l'ordre français naturel. Le nom hébreu est translittéré « Tsadok » selon l'usage français.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya, fils de Yehoïada
  rationale: Le patronyme hébreu est exprimé clairement en français moderne, avec des translittérations françaises reconnaissables.
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: Salomon, ton serviteur
  rationale: Le nom suit la forme française traditionnelle et la désignation de cour répétée est conservée.
- source_word: לֹא קָרָא
  choice: il ne nous a pas invités
  rationale: Dans le contexte du sacrifice et du banquet d'Adonias, קרא signifie naturellement « inviter ». Le pronom « nous » reprend en français la liste antéposée des personnes que le verbe hébreu régit au moyen de לְ.
