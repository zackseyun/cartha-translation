base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: fr
  text: 'Adonias et tous les invités qui étaient avec lui entendirent ce bruit alors qu’ils venaient de finir de manger[a]. Lorsque Joab entendit le son de la trompe[b], il demanda : « Pourquoi ce vacarme dans la ville ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors qu’ils finissaient de manger ». La clause hébraïque peut situer l’audition soit au terme du repas, soit au moment même où il s’achevait.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie shofar, une corne utilisée notamment pour donner des signaux publics.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendirent ce bruit
  rationale: Le verbe signifie « entendre ». Le complément « ce bruit », implicite en hébreu, est fourni par le contexte immédiat et rend la phrase naturelle en français.
- source_word: הַקְּרֻאִים
  choice: les invités
  rationale: Le participe passif de קרא désigne ici les personnes conviées au repas ; « les invités » est précis et idiomatique.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: au moment où ils achevaient de manger
  rationale: La proposition situe l'audition du bruit à la fin du repas, tout en maintenant l'ambiguïté entre l'achèvement en cours et le moment où le repas vient d'être terminé.
- source_word: קוֹל הַשּׁוֹפָר
  choice: le son de la trompe
  rationale: שׁוֹפָר désigne une trompe en corne servant notamment aux signaux publics. « Trompe » est clair en français et évite de confondre l'instrument avec la trompette moderne.
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Équivalent français direct et naturel de l'interrogatif.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: Pourquoi la ville est-elle en effervescence ?
  rationale: La formulation française exprime naturellement le bruit agité de la ville. « En effervescence » convient à l'agitation collective et sonore du contexte sans préciser à tort s'il s'agit de joie ou de trouble.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forme française biblique usuelle du nom propre.
- source_word: יוֹאָב
  choice: Joab
  rationale: Translittération française usuelle du nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit. « En effervescence » conserve l'idée d'une agitation bruyante sans la réduire à une émeute ni expliciter sa cause.
