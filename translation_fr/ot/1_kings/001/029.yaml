id: 1KI.1.29
reference: 1 Kings 1:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֥ע הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: fr
  text: 'Le roi prêta serment et dit : « Aussi vrai que Yahweh est vivant, lui qui m’a délivré de toute détresse,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: prêta serment
  rationale: Le niphal de שׁבע désigne l’action de prêter serment. Cette tournure est naturelle et digne en français narratif.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini est conservé comme titre, sans lui substituer le nom de David.
- source_word: וַיֹּאמַר
  choice: dit
  rationale: Traduction simple du verbe narratif אמר, sans ajouter une force déclarative absente de l’hébreu.
- source_word: חַי יְהוָה
  choice: Aussi vrai que Yahweh est vivant
  rationale: Cette formule française explicite naturellement la valeur de la formule hébraïque de serment tout en conservant le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel exprimé par le tétragramme, plutôt que substitution par un titre.
- source_word: אֲשֶׁר
  choice: lui qui
  rationale: Le relatif renvoie à Yahweh comme sujet personnel; « lui qui » assure un enchaînement français clair.
- source_word: פָּדָה
  choice: m’a délivré
  rationale: Dans ce contexte de dangers traversés, פדה exprime le fait d’arracher ou de délivrer. « Délivré » est naturel en français et conserve l’idée d’une intervention salvatrice, sans suggérer nécessairement le paiement d’une rançon.
- source_word: נַפְשִׁי
  choice: m’
  rationale: Ici נֶפֶשׁ désigne la personne ou la vie de David. La construction « m’a délivré » rend idiomatiquement ce sens sans introduire une conception particulière de l’âme.
- source_word: מִכָּל צָרָה
  choice: de toute détresse
  rationale: La formule garde la portée globale de כָּל et rend צָרָה par un terme français courant exprimant l’épreuve et le danger.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin personnel. Le conserver évite de le remplacer par un titre.
- issue: Sens de נַפְשִׁי dans le contexte
  choice: m’ dans « m’a délivré »
  alternative: mon âme / ma vie
  rationale: Le contexte parle de la personne de David préservée de multiples dangers. Le pronom français rend ce sens global sans imposer une lecture dualiste; « ma vie » resterait une explicitation possible.
- issue: Portée de פדה
  choice: délivré
  alternative: racheté
  rationale: Le verbe peut évoquer le rachat ou la délivrance. Ici, les détresses dont David a été sauvé favorisent « délivré », sans nier la richesse sémantique du terme.
translation_notes:
  register: Français international moderne, naturel et solennel. La formule « Aussi vrai que… est vivant » marque clairement le serment. La virgule finale est maintenue parce que la déclaration se poursuit au verset suivant.
