base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: fr
  text: 'Salomon dit : « S’il se montre un homme de valeur[a], il ne tombera pas un cheveu de sa tête à terre[b] ; mais si l’on trouve du mal en lui, il mourra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un fils de force » ou « un fils de vaillance ». L’expression hébraïque peut désigner un homme de valeur, capable ou courageux selon le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque signifiant qu’il ne lui arrivera aucun mal.
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: un homme de valeur
  rationale: L’expression signifie littéralement « fils de force/vaillance ». Dans ce contexte, elle porte sur la valeur morale et la loyauté d’Adonias plutôt que sur ses qualités guerrières.
- source_word: יִהְיֶה
  choice: se montre
  rationale: Le conditionnel envisage le comportement futur d’Adonias. « Se montre » exprime naturellement en français l’idée que sa conduite révélera ce qu’il est.
- source_word: לֹא יִפֹּל מִשַּׂעֲרָתוֹ אָרְצָה
  choice: pas un seul de ses cheveux ne tombera à terre
  rationale: Cette tournure conserve l’image hébraïque, idiome qui promet qu’Adonias ne subira aucun mal.
- source_word: רָעָה
  choice: quelque chose de mauvais
  rationale: Le nom hébreu peut désigner le mal, une mauvaise conduite ou un acte répréhensible. Cette formulation garde sa portée générale sans préciser une infraction absente du texte.
- source_word: תִמָּצֵא בוֹ
  choice: si l’on trouve en lui
  rationale: La construction passive hébraïque indique qu’un mal serait découvert comme appartenant à Adonias ; le tour impersonnel est naturel en français.
- source_word: וָמֵת
  choice: il mourra
  rationale: La proposition énonce solennellement la conséquence judiciaire, sans ajouter une nuance d’obligation qui n’est pas explicite.
theological_decisions: []
