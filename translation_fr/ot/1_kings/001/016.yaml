  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: fr
  text: 'Bethsabée s’inclina et se prosterna devant le roi. Le roi lui demanda : « Que désires-tu[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qu’y a-t-il pour toi ? » Cette expression peut aussi signifier : « Qu’est-ce qui te préoccupe ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: s’inclina
  rationale: Le verbe קָדַד décrit l’action de courber le corps. « S’inclina » rend le geste sans préciser à tort qu’elle se mit à genoux.
- source_word: בַּת שֶׁבַע
  choice: Bethsabée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu בַּת־שֶׁבַע.
- source_word: וַתִּשְׁתַּחוּ
  choice: se prosterna
  rationale: Le verbe שׁחה désigne ici une profonde marque de déférence. « Se prosterna » le distingue du premier geste et préserve la succession des deux verbes.
- source_word: לַמֶּלֶךְ
  choice: devant le roi
  rationale: Dans le contexte d’un geste d’hommage, « devant le roi » est l’équivalent français naturel de la construction avec ל.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Le roi lui demanda
  rationale: Dans ce contexte, אָמַר introduit une question adressée à Bethsabée. « Lui demanda » produit un récit français naturel tout en conservant la fonction de la parole.
- source_word: מַה לָּךְ
  choice: Que désires-tu ?
  rationale: L’expression signifie littéralement « Qu’y a-t-il pour toi ? » et sert ici à inviter Bethsabée à exposer sa requête. « Que désires-tu ? » convient au registre courtois d’une audience royale sans suggérer nécessairement qu’elle est troublée.
