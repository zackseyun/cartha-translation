  to: 'Car aujourd’hui, il est descendu et a sacrifié des bœufs, du bétail engraissé et des moutons en abondance. Il a invité tous les fils du roi, les chefs de l’armée et le prêtre Abiathar. Et les voilà qui mangent et boivent devant lui et qui disent : « Vive le roi Adonias ! »[a]'
