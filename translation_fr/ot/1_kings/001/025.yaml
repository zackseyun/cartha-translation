base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: fr
  text: 'Car aujourd’hui, il est descendu et a sacrifié des bœufs, du bétail engraissé et des moutons en abondance. Il a invité tous les fils du roi, les chefs de l’armée et le prêtre Abiathar. Et les voilà qui mangent et boivent devant lui et qui disent : « Vive le roi Adonias ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que le roi Adonias vive ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui justifie l’avertissement formulé dans le contexte précédent, sans renforcer excessivement le lien causal.
- source_word: יָרַד הַיּוֹם
  choice: aujourd’hui, il est descendu
  rationale: Conserve le mouvement descendant exprimé par יָרַד et situe naturellement l’action récente dans le récit.
- source_word: וַיִּזְבַּח
  choice: a sacrifié
  rationale: Préserve la dimension sacrificielle du verbe זבח, plutôt que de le réduire au simple abattage d’animaux.
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: des bœufs, des bêtes grasses et des moutons
  rationale: Distingue les trois catégories. « Bêtes grasses » garde la relative indétermination de מְרִיא, qui désigne du bétail engraissé sans imposer l’âge suggéré par « veaux ».
- source_word: לָרֹב
  choice: en abondance
  rationale: Rend l’idée d’une quantité considérable dans une expression française naturelle.
- source_word: וַיִּקְרָא לְ
  choice: Il a invité
  rationale: Dans le cadre d’un festin, קרא suivi de ל désigne ici l’action de convoquer ou d’inviter des personnes.
- source_word: שָׂרֵי הַצָּבָא
  choice: les chefs de l’armée
  rationale: Rend clairement la fonction militaire des שׂרים en français moderne, sans préciser un grade non indiqué.
- source_word: וְהִנָּם
  choice: Et les voilà
  rationale: Restitue la fonction présentative et insistante de הִנָּם dans un français actuel et vivant.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Traduction directe qui peut désigner le fait d’être en sa présence, sans expliciter davantage la disposition du banquet.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: Vive le roi Adonias !
  rationale: Formule française consacrée pour l’acclamation hébraïque, tout en gardant le titre royal revendiqué pour Adonias.
theological_decisions:
- issue: Statut royal d’Adonias dans l’acclamation
  choice: « le roi Adonias » dans une citation directe
  alternative: « Que le roi Adonias vive ! » ou une formulation qui atténuerait son titre
  rationale: Le texte rapporte la proclamation des convives sans valider narrativement la légitimité d’Adonias. Les guillemets maintiennent cette distinction.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe est divisée en trois phrases pour la lisibilité, tout en conservant l’enchaînement du rapport. « Adonias » suit la forme française traditionnelle du nom biblique.
