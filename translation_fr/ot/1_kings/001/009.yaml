source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: fr
  text: Adonias sacrifia des moutons, des bovins et des bêtes engraissées près de la pierre de Zohéleth[a], qui se trouve à côté d’En-Roguel. Il invita tous ses frères, les fils du roi, ainsi que tous les hommes de Juda qui étaient au service du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zohéleth est un nom de lieu; son sens exact est incertain.
    reason: cultural_note
  - marker: b
    text: L’expression « au service du roi » peut désigner des serviteurs, des membres de l’entourage royal ou des fonctionnaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: sacrifia
  rationale: Le verbe זבח désigne ici l’abattage sacrificiel lié à un festin; « sacrifia » conserve sa portée rituelle et politique.
- source_word: צֹאן
  choice: des moutons
  rationale: צֹאן peut englober le petit bétail, notamment moutons et chèvres. « Moutons » est naturel dans cette énumération, sans exclure totalement la portée collective du terme source.
- source_word: בָקָר
  choice: des bovins
  rationale: Le terme collectif בָקָר désigne les bêtes de l’espèce bovine; « bovins » en garde l’étendue sans le restreindre aux bœufs.
- source_word: מְרִיא
  choice: des bêtes engraissées
  rationale: Le nom désigne du bétail engraissé pour une consommation spéciale, sans préciser qu’il s’agit de veaux.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: près de la pierre de Zohéleth
  rationale: עִם a ici une valeur locative. Le toponyme est translittéré, son sens exact étant incertain.
- source_word: עֵין רֹגֵל
  choice: En-Roguel
  rationale: Il s’agit d’un nom de lieu connu; la translittération évite de le transformer à tort en simple description.
- source_word: וַיִּקְרָא
  choice: invita
  rationale: Dans le contexte du banquet sacrificiel, le verbe exprime l’appel à participer; « invita » rend naturellement cette fonction sociale.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: tous ses frères, les fils du roi
  rationale: La formulation conserve l’apposition hébraïque et l’insistance sur leur appartenance à la famille royale.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: tous les hommes de Juda
  rationale: L’hébreu emploie explicitement un nom masculin pluriel; la traduction en garde la forme plutôt que de la neutraliser.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: qui étaient au service du roi
  rationale: Cette tournure française exprime le statut de serviteurs, d’agents ou de fonctionnaires royaux sans imposer une fonction administrative précise.
theological_decisions:
- issue: Portée genrée de אַנְשֵׁי יְהוּדָה
  choice: les hommes de Juda
  alternative: les gens de Juda / le peuple de Juda
  rationale: Le texte hébreu est explicitement masculin. Le rendu retenu préserve ce trait, même si l’expression pourrait parfois avoir une portée sociale plus large.
- issue: Statut de עַבְדֵי הַמֶּלֶךְ
  choice: qui étaient au service du roi
  alternative: les serviteurs du roi / les fonctionnaires du roi
  rationale: Le terme peut désigner des serviteurs, des membres de l’entourage ou des agents royaux. La formulation retenue maintient cette latitude sans trancher leur charge exacte.
translation_notes:
  register: Français international moderne, fluide et digne. Le récit est divisé en deux phrases pour éviter une coordination lourde. Les toponymes suivent une translittération française usuelle; les termes de bétail restent précis sans spécialiser indûment מְרִיא.
