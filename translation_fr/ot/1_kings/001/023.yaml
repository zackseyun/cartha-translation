  text: וַ/יַּגִּ֤ידוּ לַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר הִנֵּ֖ה נָתָ֣ן הַ/נָּבִ֑יא וַ/יָּבֹא֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ עַל אַפָּ֖י/ו אָֽרְצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: fr
  text: 'On annonça au roi : « Voici Nathan, le prophète. » Nathan se présenta devant le roi et se prosterna devant le roi, le visage contre terre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Dans cette annonce d’arrivée, « Voici » attire naturellement l’attention sur la présence de Nathan tout en conservant la force présentative de l’hébreu.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna
  rationale: Le verbe désigne ici un geste physique de profond respect devant le roi; « se prosterna » est précis et naturel.
- source_word: עַל אַפָּיו אָרְצָה
  choice: le visage contre terre
  rationale: Cette formulation restitue l’image concrète de la face dirigée jusqu’au sol, sans lourdeur littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La formule hébraïque לֵאמֹר n’est pas rendue séparément, car les deux-points introduisent naturellement le discours direct. La répétition de « roi » est légèrement allégée par « devant lui » sans perte de référent.
