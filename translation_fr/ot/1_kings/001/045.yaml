base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: fr
  text: Le prêtre Tsadok et le prophète Nathan l’ont oint roi à Guihon, puis ils sont remontés de là dans la joie, et la ville est en effervescence[a]. Voilà le bruit que vous avez entendu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la ville retentit » ou « la ville est en émoi » ; le verbe hébreu évoque une agitation bruyante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: lui ont donné l’onction
  rationale: Dans un contexte royal, משׁח désigne l’acte d’oindre quelqu’un pour l’établir dans sa fonction. Cette formulation française est claire et conserve l’image concrète de l’onction.
- source_word: צָדוֹק הַכֹּהֵן
  choice: le prêtre Tsadok
  rationale: Le nom propre est translittéré sous la forme française courante « Tsadok » et le titre est rendu simplement par « prêtre ».
- source_word: וְנָתָן הַנָּבִיא
  choice: le prophète Nathan
  rationale: « Prophète » est le sens ordinaire de נביא; « Nathan » est la forme française établie du nom.
- source_word: לְמֶלֶךְ
  choice: comme roi
  rationale: La préposition לְ marque ici la fonction en vue de laquelle l’onction est donnée. « Comme roi » est naturel en français et évite de suggérer que l’onction elle-même serait un titre.
- source_word: בְּגִחוֹן
  choice: à Guihon
  rationale: Le nom du lieu est translittéré; « à » est la préposition française naturelle pour situer l’événement.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: ils sont remontés de là
  rationale: עלה exprime un mouvement ascendant. Le passé composé convient au récit rapporté dont le résultat sonore demeure perceptible.
- source_word: שְׂמֵחִים
  choice: dans la joie
  rationale: Cette expression rend leur état et la manière dont ils remontent, dans un français naturel et digne.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: la ville tout entière est en effervescence
  rationale: Le verbe הום évoque une agitation bruyante ou un tumulte. « En effervescence » rend à la fois l’agitation collective et le bruit, sans imposer l’idée négative d’une émeute.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: Voilà le bruit que vous avez entendu
  rationale: הוּא a ici une valeur démonstrative et explicative. קוֹל peut désigner un son, un bruit ou une voix; « bruit » renvoie naturellement à l’agitation de la ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve le vocabulaire royal de l’onction, le mouvement ascendant indiqué par le texte hébreu et l’ambivalence du tumulte urbain, qui peut être compris comme une effervescence joyeuse plutôt que comme un désordre hostile.
