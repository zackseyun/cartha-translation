  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: fr
  text: Adonias eut peur de Salomon. Il se leva, alla saisir les cornes de l’autel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Saisir les cornes de l’autel était un geste par lequel on cherchait asile ou grâce au sanctuaire.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: eut peur à cause de
  rationale: L’expression indique ici que Salomon est la cause ou l’objet de la peur d’Adonias. Cette formulation naturelle conserve explicitement la valeur de la préposition מִפְּנֵי.
- source_word: וַיָּקָם
  choice: Il se leva
  rationale: Équivalent courant du verbe narratif, sans ajouter de nuance absente de l’hébreu.
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: Rend directement le mouvement dans la séquence narrative.
- source_word: וַיַּחֲזֵק בְּ
  choice: saisir
  rationale: Exprime le fait de prendre fermement les cornes de l’autel, sans expliciter dans le corps du texte la demande implicite de protection ou de grâce.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: les cornes de l’autel
  rationale: Conserve la terminologie cultuelle concrète et traditionnelle de l’hébreu.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonias
  rationale: Forme française biblique usuelle du nom propre, claire pour le lectorat francophone.
theological_decisions:
- issue: Geste de refuge auprès de l’autel
  choice: Décrire littéralement Adonias saisissant les cornes de l’autel.
  alternative: 'Paraphraser : « se réfugia auprès de l’autel » ou « demanda grâce à l’autel ».'
  rationale: Le texte hébreu rapporte l’acte physique sans en formuler expressément la portée juridique ou symbolique. Celle-ci est donc expliquée en note plutôt qu’intégrée au verset.
translation_notes:
  register: Français moderne, digne et accessible. La coordination hébraïque est légèrement allégée en deux phrases pour une narration naturelle, tout en conservant l’ordre des actions. Le marqueur de note [a] figure immédiatement après la mention de Salomon, conformément au dossier fourni.
