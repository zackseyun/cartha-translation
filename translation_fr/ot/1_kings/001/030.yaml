source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: fr
  text: 'Comme je te l’ai juré par Yahweh, le Dieu d’Israël, en disant : « Salomon, ton fils, régnera après moi et il siégera sur mon trône à ma place », je ferai ainsi aujourd’hui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: Comme
  rationale: 'La tournure ouvre une corrélation avec כִּי כֵן : « Comme… ainsi… ». Le français naturel peut conserver cette structure solennelle.'
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: je te l’ai juré
  rationale: Le passé composé exprime naturellement en français un serment antérieur encore déterminant; le pronom « l’ » anticipe le contenu explicité ensuite.
- source_word: בַּיהוָה
  choice: par Yahweh
  rationale: La préposition indique celui par qui le serment est prêté; le nom divin est translittéré afin de représenter directement le tétragramme.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Rendu direct et usuel de la construction génitive hébraïque.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Cette formule introduit explicitement le contenu du serment tout en conservant la structure de l’hébreu.
- source_word: כִּי
  choice: '[non traduit séparément]'
  rationale: Dans le discours cité, la particule introduit le contenu assuré du serment. La solennité et la certitude sont déjà portées en français par « juré » et le futur; ajouter « certainement » serait lourd et pourrait surinterpréter sa fonction.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: ton fils Salomon
  rationale: L’ordre français naturel place le lien familial avant le nom propre, sans modifier le sens.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: régnera après moi
  rationale: « Régner » rend directement la fonction royale du verbe; « après moi » préserve la notion de succession sans l’expliciter davantage.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: et c’est lui qui siégera sur mon trône à ma place
  rationale: La construction emphatique rend le pronom הוּא; « siégera sur mon trône » conserve l’image royale, tandis que « à ma place » exprime le sens successoral ou substitutif de תַּחְתָּי.
- source_word: כִּי כֵן אֶעֱשֶׂה
  choice: ainsi je l’accomplirai
  rationale: « Ainsi » ferme la corrélation ouverte par « Comme ». « L’accomplirai » renvoie idiomatiquement au serment et à son contenu, sans ajouter un objet étranger au contexte.
- source_word: הַיּוֹם הַזֶּה
  choice: aujourd’hui
  rationale: Équivalent français moderne et direct de l’expression déictique hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le représente explicitement et évite de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
- issue: Portée de תַּחְתָּי dans le contexte de la succession royale
  choice: à ma place
  alternative: après moi
  rationale: La formule peut exprimer le remplacement ou la succession. « À ma place » conserve cette tension, tandis que la proposition précédente indique déjà clairement la succession chronologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure corrélative « Comme… ainsi… » maintient la logique formelle du serment. Aucun archaïsme n’est requis; « siégera » conserve toutefois l’image du trône avec un registre royal approprié.
