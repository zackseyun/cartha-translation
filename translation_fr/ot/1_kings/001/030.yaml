  to: 'Comme je te l’ai juré par Yahweh, le Dieu d’Israël, en disant : « Salomon, ton fils, régnera après moi et il siégera sur mon trône à ma place », je ferai ainsi aujourd’hui.'
  rationale: La révision maintient la structure corrélative du serment et tous les éléments du texte hébreu, tout en remplaçant une formulation légèrement interprétative par « je ferai ainsi », plus proche de כִּי כֵן אֶעֱשֶׂה. Aucune note n’est nécessaire, car aucune ambiguïté textuelle significative n’est tranchée ou masquée.
