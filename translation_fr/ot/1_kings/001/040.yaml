base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: fr
  text: Tout le peuple monta derrière lui. Le peuple jouait de la flûte[a] et se réjouissait d’une grande joie, et la terre se fendit au bruit qu’ils faisaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jouait d’instruments à vent » ; le terme hébreu peut désigner assez largement des instruments de type flûte.
    reason: lexical_alternative
  - marker: b
    text: L’expression « la terre se fendit » est vraisemblablement une hyperbole évoquant le vacarme assourdissant de la célébration.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: monta
  rationale: Le verbe עלה exprime une montée, concrète ou processionnelle. « Monta » conserve ce mouvement sans préciser davantage l’itinéraire.
- source_word: כָל הָעָם
  choice: tout le peuple
  rationale: Rendu direct et naturel du nom collectif précédé de כָל.
- source_word: אַחֲרָיו
  choice: derrière lui
  rationale: Dans ce contexte, l’expression décrit le peuple qui suit Salomon en procession. « Derrière lui » garde l’image spatiale de l’hébreu.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: jouait de la flûte
  rationale: Le participe désigne ici l’action de jouer d’instruments à vent, et חֲלִלִים des flûtes ou instruments analogues. Le singulier générique français est naturel avec le collectif « peuple ».
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: se réjouissait d’une grande joie
  rationale: Cette formulation conserve la construction emphatique formée en hébreu avec un verbe et un nom de même racine, tout en restant intelligible en français.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: la terre se fendit
  rationale: Le verbe בקע signifie « se fendre, se partager ». Le rendu actif préserve l’image saisissante et l’hyperbole du texte.
- source_word: בְּקוֹלָם
  choice: au bruit qu’il faisait
  rationale: קוֹל peut désigner la voix, le son ou le bruit. « Bruit » englobe ici les instruments et la célébration; le pronom singulier reprend grammaticalement le nom collectif « peuple ».
