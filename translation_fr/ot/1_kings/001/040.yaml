- from: Tout le peuple monta derrière lui. Le peuple jouait de la flûte[a] et se réjouissait d’une grande joie, et la terre se fendit au bruit qu’il faisait[b].
  to: Tout le peuple monta derrière lui. Le peuple jouait de la flûte[a] et se réjouissait d’une grande joie, et la terre se fendit au bruit qu’ils faisaient[b].
  rationale: La seule révision remplace le pronom singulier final par un pluriel sémantique. Elle clarifie que le bruit est celui des participants et rend compte du suffixe pluriel de « leur bruit » en hébreu, sans modifier l’image ni le degré d’affirmation du texte.
