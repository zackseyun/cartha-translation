base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: fr
  text: 'Alors le roi David répondit[a] : « Faites venir Bethsabée auprès de moi. » Elle vint devant le roi et se tint devant le roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prit la parole ». En hébreu, la formule narrative signifie littéralement « répondit et dit » et peut introduire une prise de parole même lorsqu’aucune question explicite ne précède.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: 'répondit :'
  rationale: La tournure française rend naturellement la formule narrative hébraïque « répondit et dit » sans en reproduire la lourdeur, tout en conservant le sens de réponse ou de prise de parole.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette construction française naturelle rend le titre suivi du nom en apposition.
- source_word: קִרְאוּ לִי
  choice: Appelez … auprès de moi
  rationale: L’impératif pluriel s’adresse aux serviteurs présents et exprime l’ordre de faire venir quelqu’un auprès du roi, sans ajouter une nuance absente du texte.
- source_word: לְבַת שָׁבַע
  choice: Bethsabée
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu בַּת־שֶׁבַע.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: Elle entra en présence du roi
  rationale: Cette formulation idiomatique exprime le fait de venir devant le roi dans un cadre de cour.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: se tint devant lui
  rationale: « Se tint » rend l’action de se tenir debout ou de prendre place devant le roi; le pronom évite une répétition pesante tout en maintenant la seconde mention de la position devant lui.
