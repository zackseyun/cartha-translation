  text: וְ/הִנֵּ֛ה עוֹדֶ֥/נָּה מְדַבֶּ֖רֶת עִם הַ/מֶּ֑לֶךְ וְ/נָתָ֥ן הַ/נָּבִ֖יא בָּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/022.yaml
  text: And behold[a], while she was still speaking with the king, Nathan the prophet came in.
translation:
  language: fr
  text: Et voici[a] que Nathan le prophète entra alors qu’elle parlait encore avec le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Or voici ». Le marqueur hébreu attire l’attention sur cette soudaine évolution de la scène.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Or voici
  rationale: Le marqueur discursif attire l’attention sur une arrivée qui fait soudain progresser la scène. « Or voici » en conserve la vivacité dans un registre narratif digne, sans donner à « voici » une fonction déictique artificielle.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: tandis qu’elle parlait encore
  rationale: L’adverbe muni du suffixe féminin et le participe expriment la continuation de l’action de Bethsabée; cette tournure française rend clairement la simultanéité.
- source_word: עִם הַמֶּלֶךְ
  choice: avec le roi
  rationale: « Avec » correspond directement à עִם et convient naturellement à une conversation en audience royale.
- source_word: וְנָתָן הַנָּבִיא
  choice: le prophète Nathan
  rationale: Le titre apposé identifie la fonction de Nathan. En français, l’ordre « le prophète Nathan » est naturel et fidèle.
- source_word: בָּא
  choice: entra
  rationale: Dans le contexte de l’audience au palais, le verbe indique que Nathan arrive dans la pièce ou en présence du roi; « entra » l’exprime avec concision.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Or voici » maintient le relief du marqueur hébreu, tandis que « entra » convient mieux au contexte spatial que le plus vague « vint ».
