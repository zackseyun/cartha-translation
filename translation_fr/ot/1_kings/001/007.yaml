base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: fr
  text: Il s’entretint avec Joab, fils de Tserouya, et avec le prêtre Abiathar. Tous deux soutinrent Adonias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils aidèrent après Adonias » ; l’expression indique qu’ils se rangèrent de son côté ou le soutinrent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: Il s’entendit avec
  rationale: Littéralement, « ses paroles étaient avec ». Dans ce contexte de concertation politique, la tournure indique qu’Adonias communiqua et se concerta avec Joab et Abiathar. « Il s’entendit avec » rend naturellement cette idée sans préciser indûment le contenu de leur accord.
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Joab, fils de Tserouya
  rationale: Le lien de filiation est rendu explicitement, et les noms propres sont translittérés selon l’usage français biblique courant.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: le prêtre Abiathar
  rationale: Le titre défini est conservé, dans un ordre naturel en français.
- source_word: וַיַּעְזְרוּ
  choice: Tous deux soutinrent
  rationale: Le verbe עזר signifie « aider, assister, soutenir ». Dans le contexte d’une entreprise politique, « soutenir » exprime clairement l’appui apporté à Adonias. « Tous deux » rend explicite le sujet pluriel, Joab et Abiathar.
- source_word: אַחֲרֵי אֲדֹנִיָּה
  choice: Adonias
  rationale: אַחֲרֵי signifie littéralement « derrière, après », mais peut marquer le fait de suivre quelqu’un ou de se ranger à ses côtés. Avec עזר, le français idiomatique appelle « soutenir Adonias » ; la forme littérale est signalée en note.
theological_decisions: []
translation_notes:
  register: 'Français moderne, digne et accessible. La formulation évite le calque obscur « ses paroles étaient avec » tout en conservant l’idée de concertation. Les noms suivent des formes françaises bibliques usuelles : Joab, Tserouya, Abiathar et Adonias.'
