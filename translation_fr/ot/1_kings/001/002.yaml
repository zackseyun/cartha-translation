  source_fidelity: Révision nécessaire pour rendre explicitement l’image concrète de בְּחֵיקֶךָ (« dans ton sein / giron »), que « contre toi » atténuait. La finale וְחַם exprime le résultat visé (« ait chaud ») plus directement que « se réchauffe ». Le reste rend bien les propositions exhortatives, la formule de cour et les deux termes de « jeune femme vierge ».
  naturalness: Le français révisé reste moderne et fluide, tout en conservant le tutoiement exigé par l’adresse directe au roi dans l’hébreu. « Se tienne au service du roi » rend naturellement l’idiome « se tenir devant le roi ».
  terminology: « Prendre soin de lui » est un rendu prudent et naturel du rare סֹכֶנֶת, sans lui attribuer une fonction professionnelle ou une implication sexuelle. « Sein » conserve le sens spatial et corporel de חֵיק; la note indique l’alternative « giron ».
  issues:
  - severity: medium
    issue: L’expression « qu’elle couche contre toi » ne rend pas explicitement le complément « dans ton sein/giron ».
    rationale: Le texte hébreu comporte בְּחֵיקֶךָ, image concrète de proximité corporelle. La note donnait le littéral, mais le corps du texte peut le rendre sans lourdeur en français.
  - severity: low
    issue: La note b ajoutait « c’est-à-dire tout contre sa poitrine ».
    rationale: Cette explicitation est inutilement restrictive et peut brouiller l’adresse directe (« ton sein »). Le terme hébreu peut désigner le sein ou le giron; il convient de préserver cette latitude.
  - severity: low
    issue: « Afin que ... se réchauffe » présente le résultat comme un processus.
    rationale: 'וְחַם vise l’état recherché: que le roi ait chaud / soit réchauffé. « Ait chaud » est plus direct et idiomatique.'
