base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: fr
  text: 'Alors ses serviteurs lui dirent : « Qu’on cherche pour mon seigneur le roi une jeune femme vierge ; qu’elle se tienne au service du roi, qu’elle prenne soin de lui[a] et qu’elle se couche dans ton sein[b], afin que mon seigneur le roi ait chaud. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’elle soit son assistante », « son accompagnante » ou « sa garde-malade ». Le terme hébreu est rare et désigne une personne qui assiste quelqu’un ou prend soin de lui.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner le « giron »; il évoque une proximité corporelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans le cadre de la cour royale, le terme désigne naturellement les serviteurs ou agents du roi, sans qu’il faille préciser ici un statut d’esclave.
- source_word: יְבַקְשׁוּ
  choice: qu’on cherche
  rationale: Le pluriel actif à valeur jussive exprime une proposition. Le français indéfini « qu’on cherche » est naturel sans imposer que les locuteurs se chargent eux-mêmes de la recherche.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: pour mon seigneur le roi
  rationale: Cette formulation conserve la déférence de la formule de cour ainsi que le possessif de première personne.
- source_word: נַעֲרָה בְתוּלָה
  choice: une jeune femme vierge
  rationale: 'La traduction rend les deux éléments du syntagme : נַעֲרָה désigne une jeune femme et בְתוּלָה précise qu’elle est vierge.'
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: qu’elle se tienne au service du roi
  rationale: La tournure signifie littéralement « se tenir devant le roi », mais, dans ce contexte de cour, elle implique le service. La formulation française conserve l’image de la station tout en rendant sa valeur idiomatique.
- source_word: סֹכֶנֶת
  choice: qu’elle prenne soin de lui
  rationale: Ce terme rare désigne vraisemblablement une personne qui assiste ou soigne quelqu’un. Une tournure verbale est plus naturelle en français et évite de préciser indûment une fonction professionnelle.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: qu’elle couche contre toi
  rationale: חֵיק désigne le sein, le giron ou la poitrine. « Contre toi » exprime naturellement en français la proximité corporelle destinée à procurer de la chaleur, tandis qu’une note conserve l’image littérale.
- source_word: וְחַם
  choice: afin que mon seigneur le roi se réchauffe
  rationale: Le contexte indique le résultat recherché. « Se réchauffe » convient à l’état du roi, qui ne parvient pas à retrouver sa chaleur.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours conserve la formule de déférence propre à la cour. Les impératifs à la troisième personne sont rendus par le subjonctif exhortatif. Les notes signalent l’incertitude du terme rare סֹכֶנֶת et l’image concrète de חֵיק sans alourdir le verset.
