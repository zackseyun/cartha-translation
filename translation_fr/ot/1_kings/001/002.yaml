revisions:
- from: 'Ses serviteurs lui dirent donc : « Qu’on cherche pour mon seigneur le roi une jeune femme vierge. Qu’elle se tienne au service du roi et qu’elle prenne soin de lui[a] ; qu’elle couche contre toi[b], afin que mon seigneur le roi se réchauffe. »'
  to: 'Alors ses serviteurs lui dirent : « Qu’on cherche pour mon seigneur le roi une jeune femme vierge ; qu’elle se tienne au service du roi, qu’elle prenne soin de lui[a] et qu’elle se couche dans ton sein[b], afin que mon seigneur le roi ait chaud. »'
  rationale: La révision rétablit dans le texte l’image de « se coucher dans ton sein », tout en conservant une note brève qui reconnaît la nuance possible de « giron ». Elle remplace aussi « se réchauffe » par « ait chaud », plus proche du résultat exprimé par l’hébreu. Aucune interprétation doctrinale ou sexualisante n’est ajoutée.
