  rationale: La révision conserve l’image hébraïque et le registre de cour, tout en rétablissant le destinataire pluriel de לָהֶם par « leur ». « Pour que tu leur indiques » est une formulation moderne et naturelle qui rend la fonction de l’infinitif לְהַגִּיד sans renforcer indûment la relation de finalité. Les deux ancres de notes restent correctement placées et leurs notes demeurent pertinentes.
