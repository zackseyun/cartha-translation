source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: fr
  text: Et toi, mon seigneur le roi, les yeux de tout Israël sont tournés vers toi[a], pour que tu leur indiques qui siégera sur le trône de mon seigneur le roi après lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les yeux de tout Israël sont sur toi ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire après le roi David.
    reason: referent_clarification
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mon seigneur le roi
  rationale: Cette formule conserve à la fois la déférence exprimée par אֲדֹנִי et le titre royal, dans un français digne et naturel.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: tout Israël a les yeux fixés sur toi
  rationale: Le français garde l’image hébraïque des yeux tournés vers le roi tout en exprimant naturellement l’attention et l’attente du peuple.
- source_word: לְהַגִּיד לָהֶם
  choice: afin que tu lui annonces
  rationale: L’infinitif hiphil de נגד exprime ici le fait de faire connaître une décision. « Annoncer » convient au contexte officiel de la succession; « lui » reprend collectivement « tout Israël ».
- source_word: מִי יֵשֵׁב
  choice: qui siégera
  rationale: Avec le trône comme complément, ישב évoque l’accession au règne. Le futur « siégera » est naturel et conserve l’image du texte.
- source_word: עַל כִּסֵּא
  choice: sur le trône
  rationale: Traduction directe et idiomatique de la préposition עַל et du nom כִּסֵּא.
- source_word: אַחֲרָיו
  choice: après lui
  rationale: Le suffixe masculin singulier est explicitement conservé. Dans le contexte, il renvoie au roi David et indique sa succession.
theological_decisions:
- issue: Référent du pronom dans אַחֲרָיו
  choice: « après lui », c’est-à-dire après le roi David
  alternative: « ensuite » ou « après cela »
  rationale: La forme hébraïque comporte un suffixe personnel masculin singulier qui renvoie le plus naturellement au roi auquel Bethsabée s’adresse. Le pronom est donc maintenu dans le texte, sans réduire l’expression à une simple indication temporelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse directe au singulier du texte hébreu. L’image des yeux fixés sur le roi est conservée, et « tout Israël » est traité comme un collectif.
