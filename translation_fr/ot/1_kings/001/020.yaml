    rationale: Le texte hébreu emploie le pronom pluriel « à eux ». Même si « tout Israël » est un collectif français, « leur » rend mieux le destinataire pluriel explicite et se lit naturellement.
  - severity: low
    issue: « afin que tu lui annonces »
    rationale: La tournure est plus lourde et moins directement idiomatique que « pour que tu leur indiques ». Le verbe נגד signifie ici faire savoir ; « indiquer » maintient la sobriété du texte sans ajouter une notion de proclamation officielle.
