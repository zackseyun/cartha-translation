  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l’adresse honorifique, l’attention d’Israël, la désignation du successeur et le pronom personnel « après lui » sont conservés. Toutefois, לָהֶם est pluriel (« leur »), alors que « lui » reprend grammaticalement le collectif « tout Israël » et atténue la forme source.'
  naturalness: '« Afin que tu lui annonces » est moins naturel dans ce contexte : avec « tout Israël », le pronom singulier paraît raide, et « afin que » peut marquer une finalité plus explicite que l’infinitif hébreu. « Pour que tu leur indiques » est idiomatique, garde l’orientation vers les destinataires et convient à une décision de succession.'
  terminology: « Mon seigneur le roi », « trône » et « après lui » sont appropriés. « Siégera » rend bien le verbe de s’asseoir dans le contexte successoral, sans surinterpréter. Le renvoi de « lui » à David est correctement expliqué en note.
