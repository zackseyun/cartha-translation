  text: וְֽ/אֶת נָתָן֩ הַ/נָּבִ֨יא וּ/בְנָיָ֜הוּ וְ/אֶת הַ/גִּבּוֹרִ֛ים וְ/אֶת שְׁלֹמֹ֥ה אָחִ֖י/ו לֹ֥א קָרָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: fr
  text: Mais il n’invita ni le prophète Nathan[a], ni Benaya, ni les vaillants guerriers, ni son frère Salomon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais il n’appela ni le prophète Nathan, ni Benaya, ni les vaillants guerriers, ni son frère Salomon. » Le verbe hébreu signifie littéralement « appeler »; ici, il a le sens d’inviter ou de convoquer au festin d’Adonias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Mais… ni
  rationale: La conjonction poursuit l’énumération du verset précédent, tandis que « mais » fait ressortir le contraste entre les personnes invitées et celles qui furent exclues. Les marqueurs d’objet ne sont pas traduits directement; la série négative est rendue naturellement par « ni… ni ».
- source_word: נָתָן הַנָּבִיא
  choice: le prophète Nathan
  rationale: Cette formulation est naturelle en français moderne et traduit directement le titre נָבִיא.
- source_word: וּבְנָיָהוּ
  choice: Benaya
  rationale: Le nom propre est translittéré selon une forme française courante; la conjonction préfixée est intégrée à l’énumération négative.
- source_word: הַגִּבּוֹרִים
  choice: les vaillants guerriers
  rationale: Dans ce contexte royal et militaire, גִּבּוֹרִים désigne les hommes de guerre d’élite de David. « Vaillants guerriers » reste clair sans affaiblir cette nuance.
- source_word: שְׁלֹמֹה אָחִיו
  choice: son frère Salomon
  rationale: Le suffixe renvoie à Adonias dans le contexte. L’ordre français retenu est plus naturel que le calque « Salomon, son frère ».
- source_word: לֹא קָרָא
  choice: n’invita pas
  rationale: קרא signifie littéralement « appeler », mais désigne ici l’invitation au festin organisé par Adonias; « inviter » exprime clairement l’action contextuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La construction répétée « ni… ni » rend clairement l’énumération des personnes non invitées; la note conserve le sens littéral du verbe hébreu.
