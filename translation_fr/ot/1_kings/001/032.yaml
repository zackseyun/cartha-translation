base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: fr
  text: 'Alors le roi David dit : « Faites venir auprès de moi le prêtre Tsadok, le prophète Nathan et Benaya, fils de Yehoyada. » Ils vinrent devant le roi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » en restitue naturellement la succession en français moderne.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette formulation française naturelle conserve le titre royal et l’identification de David.
- source_word: קִרְאוּ לִי
  choice: Appelez auprès de moi
  rationale: L’impératif pluriel de קרא avec לִי ordonne de faire venir les personnes auprès du locuteur ; cette traduction reste proche de la construction hébraïque tout en étant idiomatique.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: le prêtre Tsadok
  rationale: Le nom propre est translittéré et le titre défini précise sa fonction.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: le prophète Nathan
  rationale: La traduction rend directement le nom et le titre défini, dans l’ordre le plus naturel en français.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: et Benaya, fils de Yehoyada
  rationale: Les noms sont translittérés ; « fils de » rend l’identification patronymique exprimée par בֶּן.
- source_word: וַיָּבֹאוּ
  choice: Ils se présentèrent
  rationale: Dans ce contexte d’audience royale, בוא désigne leur venue auprès du roi ; « se présentèrent » exprime naturellement leur arrivée en sa présence sans ajouter d’idée substantielle.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: Cette expression rend directement et naturellement la présence indiquée par לִפְנֵי.
