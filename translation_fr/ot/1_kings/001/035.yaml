  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: fr
  text: Puis vous remonterez derrière lui. Il viendra s’asseoir sur mon trône et il régnera à ma place. C’est lui que j’ai désigné pour être chef[a] à la tête d’Israël et de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « C’est lui à qui j’ai ordonné d’être prince [ou dirigeant] à la tête d’Israël et de Juda. » Le verbe hébreu signifie souvent « ordonner », et נָגִיד peut aussi se traduire par « prince » ou « dirigeant ».'
    reason: Alternative lexicale préservant le sens courant de צוה et la gamme sémantique de נָגִיד.
lexical_decisions:
- source_word: וַעֲלִיתֶם
  choice: vous remonterez
  rationale: Le verbe עלה exprime une montée. « Remonterez » convient au déplacement de retour qui suit l’onction à Guihon et conserve le sens directionnel.
- source_word: אַחֲרָיו
  choice: derrière lui
  rationale: Dans cette procession royale, l’expression indique que les accompagnateurs suivent Salomon. « Derrière lui » est naturel et concret en français.
- source_word: וּבָא וְיָשַׁב עַל־כִּסְאִי
  choice: Il viendra s’asseoir sur mon trône
  rationale: Cette formulation restitue la succession des verbes בוא et ישב tout en exprimant naturellement l’intronisation.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: et régnera à ma place
  rationale: תַּחְתָּי marque ici la substitution dans la fonction royale. « À ma place » préserve cette idée sans la réduire à une simple succession chronologique.
- source_word: צִוִּיתִי
  choice: j’ai désigné
  rationale: Bien que צוה signifie souvent « ordonner », la construction avec « être chef » a ici une force d’établissement dans une charge. « Désigné » rend ce sens contextuel sans effacer l’alternative littérale, signalée en note.
- source_word: לִהְיוֹת נָגִיד
  choice: pour être chef
  rationale: נָגִיד désigne un dirigeant établi à la tête d’un peuple. « Chef » est accessible et reste distinct du verbe « régner », ce qui préserve les deux termes hébreux.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: sur Israël et sur Juda
  rationale: La répétition de la préposition dans le sens d’autorité est naturellement rendue par la construction française « sur… et sur… ».
theological_decisions:
- issue: Rapport entre נָגִיד et la royauté exprimée par מלך
  choice: Traduire נָגִיד par « chef » tout en rendant מלך par « régnera »
  alternative: Traduire נָגִיד par « prince » ou « dirigeant »
  rationale: Le texte emploie deux termes distincts pour l’autorité royale. Les différencier évite de les fondre tous deux dans le mot « roi » et conserve la nuance du texte sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement de la procession, de l’intronisation et de la désignation officielle. Le marqueur de note est placé après le groupe lexical concerné.
