  text: וַ/יַּ֨עַן בְּנָיָ֧הוּ בֶן יְהֽוֹיָדָ֛ע אֶת הַ/מֶּ֖לֶךְ וַ/יֹּ֣אמֶר אָמֵ֑ן כֵּ֚ן יֹאמַ֣ר יְהוָ֔ה אֱלֹהֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: fr
  text: 'Benaya, fils de Yehoyada, répondit au roi : « Amen ! Que Yahweh, le Dieu de mon seigneur le roi, le dise ainsi[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que Yahweh, le Dieu de mon seigneur le roi, dise de même ! » Le verbe hébreu signifie littéralement « dire » et prend ici le sens de confirmer ou d’ordonner l’accomplissement du souhait du roi.'
    reason: alternative lexicale et explicitation du sens contextuel
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Dans ce dialogue de cour, le verbe ענה introduit normalement une réponse ; « répondit » est direct et naturel en français.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya, fils de Yehoyada
  rationale: Les noms propres sont translittérés sous une forme française lisible, et le patronyme hébreu est conservé par « fils de ».
- source_word: וַיֹּאמֶר
  choice: 'répondit au roi :'
  rationale: La formule hébraïque littérale « répondit… et dit » est redondante en français moderne ; les deux verbes sont naturellement réunis dans l’introduction de la citation.
- source_word: אָמֵן
  choice: Amen !
  rationale: Le terme exprime ici à la fois l’assentiment et le souhait que la décision annoncée s’accomplisse ; sa forme traditionnelle reste claire en français.
- source_word: כֵּן יֹאמַר
  choice: qu’il le dise ainsi
  rationale: L’imparfait hébreu prend ici une valeur optative après « Amen », tandis que כֵּן renvoie aux paroles ou au projet précédemment exprimés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: אֱלֹהֵי אֲדֹנִי הַמֶּלֶךְ
  choice: le Dieu de mon seigneur le roi
  rationale: Cette formulation conserve la relation construite par אֱלֹהֵי et le registre déférent de l’adresse royale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de יֹאמַר après אָמֵן
  choice: 'souhait de confirmation divine : « Que… le dise ainsi »'
  alternative: 'futur simple : « Yahweh le dira ainsi »'
  rationale: 'Après l’acclamation « Amen », le contexte favorise une nuance volitive ou jussive : Benaya souhaite que Dieu confirme la parole du roi, sans affirmer simplement un événement futur.'
translation_notes:
  register: 'Français international moderne, digne et accessible. La redondance narrative hébraïque « répondit… et dit » est allégée en « répondit… : ». L’expression de cour « mon seigneur le roi » est conservée. Le point d’exclamation final rend la force optative de la déclaration.'
