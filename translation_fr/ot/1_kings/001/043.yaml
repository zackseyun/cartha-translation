  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: fr
  text: 'Jonathan répondit à Adonias : « Au contraire, notre seigneur, le roi David, a établi Salomon comme roi.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « Mais notre seigneur, le roi David, a établi Salomon comme roi. » Le mot hébreu traduit par « au contraire » peut aussi se rendre par « mais » ; ici, il exprime une correction nette.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: répondit
  rationale: En français actuel, le doublet hébreu « répondit et dit » est peu naturel. Le seul verbe « répondit » restitue clairement la fonction des deux verbes dans le dialogue.
- source_word: לַאֲדֹנִיָּהוּ
  choice: à Adonias
  rationale: La préposition ל est rendue par « à » ; la forme française traditionnelle et courante du nom est « Adonias ».
- source_word: אֲבָל
  choice: Au contraire
  rationale: Dans ce contexte, אֲבָל corrige nettement ce qu’Adonias supposait. « Au contraire » exprime cette force adversative, tandis que la note conserve la possibilité d’un simple « mais ».
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: notre seigneur, le roi David
  rationale: « Seigneur » convient au langage respectueux de la cour. L’apposition avec virgule garde distincts le titre de respect et la désignation royale.
- source_word: הִמְלִיךְ אֶת שְׁלֹמֹה
  choice: a établi Salomon comme roi
  rationale: Le hiphil de מלך signifie faire de quelqu’un un roi ou l’installer comme roi. « A établi Salomon comme roi » rend cette valeur causative sans introduire l’idée plus précise d’une onction ou d’une proclamation.
