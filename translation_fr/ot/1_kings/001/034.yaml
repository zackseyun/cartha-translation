base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: fr
  text: 'Là, le prêtre Tsadok et le prophète Nathan l’oindront roi d’Israël. Vous sonnerez alors du cor[a] et vous proclamerez : « Vive le roi Salomon ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : shofar, cor utilisé pour donner un signal ou faire une proclamation ; traditionnellement rendu par « trompette ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח אֹתוֹ
  choice: lui donneront l’onction
  rationale: Dans cette suite d’instructions, la forme verbale coordonnée a une valeur directive. « Donner l’onction » exprime naturellement en français l’acte officiel de consécration royale.
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe renvoie simplement au lieu indiqué dans le contexte précédent.
- source_word: צָדוֹק הַכֹּהֵן וְנָתָן הַנָּבִיא
  choice: le prêtre Tsadok et le prophète Nathan
  rationale: Les noms sont translittérés et les fonctions sont rendues par leurs équivalents français usuels.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: pour le faire roi sur Israël
  rationale: La préposition לְ marque ici l’accession à la fonction, tandis que עַל exprime l’autorité exercée sur Israël. Cette formulation reste claire sans effacer ces deux rapports.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: Puis vous sonnerez du cor
  rationale: Le shofar est un cor servant notamment aux signaux et aux proclamations publiques. « Sonner du cor » est précis et idiomatique; « puis » marque naturellement l’enchaînement des instructions.
- source_word: וַאֲמַרְתֶּם
  choice: et vous proclamerez
  rationale: Dans ce contexte cérémoniel et public, le verbe « proclamer » rend mieux la portée de l’ordre que le simple « dire », sans ajouter de contenu.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Vive le roi Salomon !
  rationale: Le jussif hébreu appartient à une formule d’acclamation royale, dont « Vive le roi… ! » est l’équivalent français établi.
