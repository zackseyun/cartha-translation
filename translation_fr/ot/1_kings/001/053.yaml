base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: fr
  text: 'Alors le roi Salomon envoya des gens, et ils firent descendre Adonias de l’autel.[a] Il vint et se prosterna devant le roi Salomon, et Salomon lui dit : « Va chez toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils le firent descendre de dessus l’autel ».'
    reason: Nuance spatiale de l’hébreu מֵעַל (« de dessus »), rendue plus naturellement dans le texte par « de l’autel ».
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya des hommes
  rationale: Le verbe signifie littéralement « envoya », sans complément exprimé. En français, préciser « des hommes » rend naturellement compréhensible le sujet pluriel de la proposition suivante, sans identifier davantage les agents.
- source_word: וַיֹּרִדֻהוּ
  choice: firent descendre Adonias
  rationale: La forme causative exprime que des agents non nommés lui firent quitter l’endroit. Le nom « Adonias », fourni sans ambiguïté par le contexte immédiat, évite en français une succession de pronoms équivoque.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: de l’autel
  rationale: מֵעַל indique le mouvement depuis ou de dessus l’autel. « De l’autel » est naturel et convient au contexte où Adonias en tenait les cornes; une note conserve le sens plus littéral.
- source_word: וַיָּבֹא
  choice: Il vint
  rationale: Rendu direct du verbe בוא, sans préciser une destination que l’hébreu ne formule pas.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterner
  rationale: Le verbe désigne un geste marqué d’abaissement ou d’hommage. « Se prosterner » en conserve la force tout en restant naturel dans un récit royal.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: devant le roi Salomon
  rationale: Dans ce contexte, la préposition marque la personne devant laquelle l’hommage est accompli. « Devant » est l’expression française idiomatique.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: Va chez toi
  rationale: Cette formulation actuelle et digne traduit l’impératif et la destination littérale « vers ta maison », avec la valeur d’un congé royal.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est légèrement fluidifiée. « Adonias » explicite le pronom objet d’après le contexte afin d’éviter une ambiguïté française, tandis que la note préserve la nuance spatiale et causative de l’hébreu.
