    issue: « envoya des hommes » précise le sexe des agents.
    rationale: Le texte hébreu dit seulement que le roi « envoya » ; les agents qui font descendre Adonias restent non identifiés. « Des gens » conserve l’implication d’agents envoyés sans cette précision supplémentaire.
  - severity: medium
    issue: La note contient « loin de l’autel ».
    rationale: מֵעַל signifie « de dessus / depuis l’autel » et n’exprime pas l’éloignement (« loin de »). La note doit conserver la nuance spatiale sans ajout.
