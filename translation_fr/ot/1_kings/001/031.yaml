base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: fr
  text: 'Alors Bethsabée s’inclina, le visage contre terre, et se prosterna devant le roi. Elle dit : « Que mon seigneur, le roi David, vive pour toujours ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: s’inclina
  rationale: Le verbe קָדַד décrit le fait de courber profondément le corps. « S’inclina » rend naturellement le geste sans préciser outre mesure la posture.
- source_word: אַפַּיִם אֶרֶץ
  choice: le visage contre terre
  rationale: L’expression hébraïque associe littéralement le visage et la terre pour décrire une profonde marque de soumission. Cette formulation française en conserve l’image et l’intensité.
- source_word: וַתִּשְׁתַּחוּ
  choice: se prosterna
  rationale: Le verbe désigne une prosternation ou une profonde révérence. « Se prosterna » le distingue du premier geste et préserve la progression du texte.
- source_word: לַמֶּלֶךְ
  choice: devant le roi
  rationale: Bien que la préposition signifie littéralement « vers/à », le français emploie naturellement « devant » avec le verbe « se prosterner » dans ce contexte.
- source_word: יְחִי
  choice: Que … vive
  rationale: Le jussif exprime ici un souhait ou une acclamation. La tournure « Que … vive » reproduit directement cette valeur.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Dans une adresse royale, אֲדֹנִי est un titre respectueux. « Mon seigneur » convient au registre de cour sans introduire de nuance théologique étrangère.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: le roi David
  rationale: Cette formulation française unit naturellement le titre et le nom tout en conservant l’article présent en hébreu dans l’ensemble de l’adresse.
- source_word: לְעֹלָם
  choice: pour toujours
  rationale: עוֹלָם exprime ici la durée indéfinie dans une acclamation royale. « Pour toujours » est clair, actuel et fidèle à cette emphase.
