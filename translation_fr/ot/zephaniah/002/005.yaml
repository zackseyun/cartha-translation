source:
  edition: WLC
  text: ה֗וֹי יֹֽשְׁבֵ֛י חֶ֥בֶל הַ/יָּ֖ם גּ֣וֹי כְּרֵתִ֑ים דְּבַר יְהוָ֣ה עֲלֵי/כֶ֗ם כְּנַ֨עַן֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךְ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/005.yaml
  text: Woe[a], inhabitants of the seacoast, nation of the Cherethites! The word of Yahweh is against you, Canaan, land of the Philistines; and I will destroy you until no inhabitant remains.
translation:
  language: fr
  text: 'Malheur à vous, habitants du littoral, nation des Keréthiens[a] ! La parole de Yahweh est contre vous, Canaan, pays des Philistins : je te détruirai jusqu’à ce qu’il ne reste plus aucun habitant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Kéréthiens » ; peut-être : « Crétois ».'
    reason: L’ethnonyme hébreu כְּרֵתִים admet des variantes de translittération française ; son identification aux Crétois demeure possible, mais incertaine.
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à vous
  rationale: L’interjection prophétique annonce ici un jugement. « Malheur à vous » restitue sa force oraculaire en français naturel.
- source_word: יֹשְׁבֵי חֶבֶל הַיָּם
  choice: habitants du littoral
  rationale: L’expression désigne ceux qui vivent dans la bande côtière. « Littoral » est précis, courant et concis.
- source_word: גּוֹי כְּרֵתִים
  choice: nation des Kérétiens
  rationale: גּוֹי désigne ici un peuple constitué, tandis que כְּרֵתִים est conservé comme ethnonyme plutôt que réinterprété avec certitude comme « Crétois ».
- source_word: דְּבַר יְהוָה עֲלֵיכֶם
  choice: La parole de Yahweh est contre vous
  rationale: Cette formule prophétique présente la parole divine comme dirigée contre ses destinataires dans un contexte de jugement.
- source_word: כְּנַעַן אֶרֶץ פְּלִשְׁתִּים
  choice: Canaan, pays des Philistins
  rationale: L’apposition identifie ici Canaan au territoire philistin sans effacer la portée géographique du nom Canaan.
- source_word: וְהַאֲבַדְתִּיךְ
  choice: Je te détruirai
  rationale: Le verbe causatif exprime une destruction directe. Le singulier féminin de l’hébreu est conservé par « te », qui reprend Canaan envisagé comme le pays.
- source_word: מֵאֵין יוֹשֵׁב
  choice: jusqu’à ce qu’il ne reste plus aucun habitant
  rationale: Cette formulation française exprime clairement le résultat de dépeuplement total indiqué par l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Passage du pluriel au singulier dans l’adresse
  choice: « contre vous » puis « Je te détruirai »
  alternative: uniformiser tout le verset au pluriel
  rationale: L’hébreu passe du pluriel עֲלֵיכֶם, visant les habitants et la nation, au suffixe féminin singulier de וְהַאֲבַדְתִּיךְ, visant Canaan ou le pays. La traduction préserve ce changement rhétorique et grammatical.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe prophétique reste directe. Le changement de destinataire grammatical entre « vous » et « te » est volontairement conservé.
