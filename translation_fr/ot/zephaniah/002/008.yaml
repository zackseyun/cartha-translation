  text: שָׁמַ֨עְתִּי֙ חֶרְפַּ֣ת מוֹאָ֔ב וְ/גִדּוּפֵ֖י בְּנֵ֣י עַמּ֑וֹן אֲשֶׁ֤ר חֵֽרְפוּ֙ אֶת עַמִּ֔/י וַ/יַּגְדִּ֖ילוּ עַל גְּבוּלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/008.yaml
  text: I have heard the reproach of Moab and the insults of the sons of Ammon[b][a], with which they reproached my people and magnified themselves against their border.
translation:
  language: fr
  text: 'J’ai entendu les outrages de Moab et les insultes des fils d’Ammon[a] : ils ont outragé mon peuple et se sont élevés contre leur frontière[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les Ammonites ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « contre leur frontière ». Le suffixe peut renvoyer au peuple qui vient d’être mentionné ; on pourrait aussi comprendre : « contre leur propre frontière ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: J’ai entendu
  rationale: Le parfait à la première personne exprime ici un fait accompli dont la portée demeure actuelle dans la parole divine.
- source_word: חֶרְפַּת
  choice: les outrages
  rationale: Le terme désigne le mépris exprimé contre quelqu’un; « outrages » convient au contexte verbal et moral.
- source_word: גִדּוּפֵי
  choice: les insultes
  rationale: Le mot désigne des paroles injurieuses. « Insultes » est clair et n’impose pas le sens plus spécifiquement religieux de « blasphèmes ».
- source_word: בְּנֵי עַמּוֹן
  choice: les fils d’Ammon
  rationale: Cette traduction conserve l’expression hébraïque et son parallélisme tout en restant intelligible; « les Ammonites » est donné en note comme équivalent naturel.
- source_word: אֲשֶׁר חֵרְפוּ אֶת עַמִּי
  choice: ils ont outragé mon peuple
  rationale: En français, une proposition explicative après les deux groupes nominaux rend naturellement la reprise hébraïque sans alourdir la phrase.
- source_word: וַיַּגְדִּילוּ
  choice: se sont élevés
  rationale: La forme causative de גדל exprime ici l’élévation orgueilleuse de soi. « Se sont élevés » conserve l’image sans la réduire au seul fait de se vanter.
- source_word: עַל גְּבוּלָם
  choice: contre son territoire
  rationale: עַל a ici une valeur hostile. Le singulier collectif « son » reprend naturellement « mon peuple » en français, tandis que « territoire » rend la portée territoriale de גְּבוּל.
theological_decisions:
- issue: Référent du suffixe pluriel dans גְּבוּלָם
  choice: Le territoire de « mon peuple »
  alternative: Leur propre frontière, ou une frontière sans référent davantage précisé
  rationale: L’antécédent immédiat est « mon peuple », nom collectif auquel le suffixe pluriel hébreu peut renvoyer selon le sens. Le contexte évoque l’hostilité de Moab et d’Ammon envers le peuple de Dieu; une note conserve toutefois l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des paroles hostiles est maintenu, ainsi que l’image d’une élévation orgueilleuse. La ponctuation française clarifie la relation entre les outrages entendus et les actes qui suivent.
