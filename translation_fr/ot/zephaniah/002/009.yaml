review_pass:
  verdict: revise
  source_fidelity: La traduction restitue bien le serment divin, les comparaisons avec Sodome et Gomorrhe, ainsi que les images de stérilité. Toutefois, « leur territoire » remplace l’objet pronominal pluriel du texte hébreu (« eux ») par une interprétation métonymique explicite. Cette précision n’est pas nécessaire et réduit l’ambiguïté du texte source.
  naturalness: Le français est globalement moderne et solennel. « Une désolation perpétuelle » est plus direct et plus proche de l’hébreu que « un lieu dévasté pour toujours ». La répétition de « le reste » conserve utilement le vocabulaire prophétique sans nuire à la fluidité.
  terminology: « Yahweh des armées », « Moab », « Sodome », « Gomorrhe » et « Ammonites » sont appropriés. « Le reste de mon peuple » et « le reste de ma nation » rendent les deux expressions hébraïques sans introduire l’idée supplémentaire de survivants. La note sur la locution קשה מִמְשַׁק חָרוּל préserve correctement l’incertitude lexicale.
  issues:
  - severity: medium
    issue: Explicitation de l’objet de « prendra possession » en « leur territoire »
    rationale: יִנְחָלוּם a pour objet le pronom pluriel renvoyant à Moab et aux Ammonites. Le sens peut impliquer leurs terres ou biens, mais le texte ne dit pas explicitement « leur territoire ». Il convient de conserver l’expression française « en prendra possession », qui maintient la métonymie et l’ambiguïté du source.
  - severity: low
    issue: « Les survivants de ma nation » affaiblit la répétition de « reste »
    rationale: וְיֶתֶר exprime à nouveau le reste ou reliquat. « Survivants » est possible dans le contexte, mais ajoute une nuance explicative et efface la correspondance lexicale avec שְׁאֵרִית au membre précédent.
  - severity: low
    issue: « Un lieu dévasté pour toujours » est moins proche du syntagme nominal hébreu
    rationale: וּשְׁמָמָה עַד־עוֹלָם désigne une désolation durable. « Une désolation perpétuelle » est idiomatique, conserve la forme nominale et évite de transformer la désolation en simple description d’un lieu.
