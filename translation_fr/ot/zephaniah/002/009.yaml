revisions:
- from: 'C’est pourquoi, aussi vrai que je suis vivant — déclaration de Yahweh des armées, le Dieu d’Israël —, Moab deviendra comme Sodome, et les Ammonites[a] comme Gomorrhe : un domaine couvert d’orties[b], une fosse de sel et un lieu dévasté pour toujours. Le reste de mon peuple les pillera, et les survivants de ma nation prendront possession de leur territoire[c].'
  to: 'C’est pourquoi, aussi vrai que je suis vivant — déclaration de Yahweh des armées, le Dieu d’Israël —, Moab deviendra comme Sodome, et les Ammonites[a] comme Gomorrhe : un terrain couvert d’orties[b], une fosse de sel et une désolation perpétuelle. Le reste de mon peuple les pillera, et le reste de ma nation en prendra possession.'
  rationale: La révision maintient l’imagerie difficile des orties avec une note appropriée, améliore le rendu de la désolation et, surtout, retire l’ajout interprétatif « leur territoire ». « En prendra possession » rend naturellement le verbe hébreu tout en laissant ouvert le référent métonymique du pronom. Le parallélisme et la terminologie prophétique sont renforcés par « le reste » dans les deux membres.
