source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֡נִי נְאֻם֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כִּֽי מוֹאָ֞ב כִּ/סְדֹ֤ם תִּֽהְיֶה֙ וּ/בְנֵ֤י עַמּוֹן֙ כַּֽ/עֲמֹרָ֔ה מִמְשַׁ֥ק חָר֛וּל וּ/מִכְרֵה מֶ֥לַח וּ/שְׁמָמָ֖ה עַד עוֹלָ֑ם שְׁאֵרִ֤ית עַמִּ/י֙ יְבָזּ֔וּ/ם וְ/יֶ֥תֶר גוי יִנְחָלֽוּ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/009.yaml
  text: Therefore[a], as I live, declares Yahweh of hosts, the God of Israel, Moab will surely become like Sodom, and the sons of Ammon like Gomorrah—a place overgrown with weeds, a salt pit, and a perpetual desolation. The remnant of my people will plunder them[b], and the remainder of my nation will inherit them.
translation:
  language: fr
  text: 'C’est pourquoi, aussi vrai que je suis vivant — déclaration de Yahweh des armées, le Dieu d’Israël —, Moab deviendra comme Sodome, et les Ammonites[a] comme Gomorrhe : un terrain couvert d’orties[b], une fosse de sel et une désolation perpétuelle. Le reste de mon peuple les pillera, et le reste de ma nation en prendra possession.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Ammon ».'
    reason: lexical_alternative
  - marker: b
    text: 'La locution hébraïque est difficile ; on pourrait aussi traduire plus formellement : « une possession d’orties » ou « une étendue d’orties ».'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée des accusations précédentes.
- source_word: חַי אָנִי
  choice: aussi vrai que je suis vivant
  rationale: Rend la formule hébraïque de serment divin dans un français idiomatique tout en conservant sa solennité.
- source_word: נְאֻם יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  choice: déclaration de Yahweh des armées, le Dieu d’Israël
  rationale: « Déclaration de » conserve la formule prophétique; le nom divin est translittéré « Yahweh », et צְבָאוֹת est rendu par le titre traditionnel et intelligible « des armées ».
- source_word: מוֹאָב כִּסְדֹם תִּהְיֶה
  choice: Moab deviendra comme Sodome
  rationale: « Deviendra » convient au contexte de jugement et de transformation en territoire dévasté.
- source_word: וּבְנֵי עַמּוֹן
  choice: les Ammonites
  rationale: Équivalent moderne et naturel du gentilé hébraïque littéral « les fils d’Ammon »; la forme littérale est signalée en note.
- source_word: מִמְשַׁק חָרוּל
  choice: un domaine couvert d’orties
  rationale: La locution hébraïque est difficile. Cette formulation garde l’image d’un terrain abandonné envahi de plantes piquantes sans prétendre résoudre avec certitude le sens rare de מִמְשַׁק.
- source_word: וּמִכְרֵה מֶלַח
  choice: une fosse de sel
  rationale: Rend l’image d’un lieu salin et stérile; le singulier correspond à la forme du texte hébreu.
- source_word: וּשְׁמָמָה עַד עוֹלָם
  choice: et un lieu dévasté pour toujours
  rationale: Expression claire et actuelle qui conserve à la fois la dévastation et sa durée indéfinie.
- source_word: שְׁאֵרִית עַמִּי
  choice: Le reste de mon peuple
  rationale: « Le reste » exprime le groupe ayant survécu, tout en restant plus immédiatement compréhensible que le terme spécialisé « le reste fidèle ».
- source_word: יְבָזּוּם
  choice: les pillera
  rationale: Le verbe בזז désigne le fait de prendre le butin d’ennemis vaincus.
- source_word: וְיֶתֶר גוי יִנְחָלוּם
  choice: les survivants de ma nation prendront possession de leur territoire
  rationale: « Les survivants » fait écho au « reste » sans lourde répétition. Le territoire est explicité comme objet naturel de la prise de possession, tout en signalant en note la formulation pronominale plus littérale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom propre de l’alliance sans le remplacer par un titre.
- issue: Portée du serment introduit par כִּי
  choice: La certitude est portée par « aussi vrai que je suis vivant » et le futur déclaratif
  alternative: ajouter « certainement » devant « deviendra »
  rationale: La particule introduit ici le contenu solennel du serment. Ajouter un adverbe risquerait une emphase redondante en français.
- issue: Objet de יִנְחָלוּם
  choice: leur territoire
  alternative: eux
  rationale: Le suffixe masculin pluriel renvoie formellement à Moab et aux Ammonites, mais le verbe hébreu évoque la prise de possession. Le texte français exprime la métonymie territoriale sans suggérer que des personnes seraient possédées; la littéralité est conservée en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe solennelle du serment prophétique est conservée sans archaïsmes. Les termes rares ou métonymiques sont rendus clairement dans le corps du texte, avec les ambiguïtés réelles documentées en notes.
