source:
  edition: WLC
  text: וְ/הָ֣יָה חֶ֗בֶל לִ/שְׁאֵרִ֛ית בֵּ֥ית יְהוּדָ֖ה עֲלֵי/הֶ֣ם יִרְע֑וּ/ן בְּ/בָתֵּ֣י אַשְׁקְל֗וֹן בָּ/עֶ֨רֶב֙ יִרְבָּצ֔וּ/ן כִּ֧י יִפְקְדֵ֛/ם יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/שָׁ֥ב שבות/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/007.yaml
  text: And the coastland shall belong to the remnant of the house of Judah; on it they shall pasture. In the houses of Ashkelon they shall lie down at evening, for Yahweh their God will attend to them and restore their fortunes.
translation:
  language: fr
  text: Le littoral appartiendra au reste de la maison de Juda. Ils y feront paître leurs troupeaux et, le soir, ils se coucheront dans les maisons d’Ascalon, car Yahweh, leur Dieu, prendra soin d’eux[a] et rétablira leur situation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « interviendra en leur faveur » ou « les visitera ». Le verbe hébreu peut désigner une intervention attentive, pour bénir ou pour juger; ici, le contexte indique une action favorable.
    reason: lexical_alternative
  - marker: b
    text: Ou « ramènera leurs captifs ». L’expression hébraïque signifie souvent rétablir un peuple dans sa situation antérieure, et pas seulement faire revenir des captifs.
    reason: alternative_reading
lexical_decisions:
- source_word: חֶבֶל
  choice: le littoral
  rationale: Dans le contexte immédiat de la côte philistine, le nom désigne une étendue territoriale; « littoral » rend naturellement cette localisation côtière.
- source_word: שְׁאֵרִית
  choice: le reste
  rationale: « Le reste » est une expression prophétique courante qui désigne la partie préservée du peuple, sans réduire le terme à un simple décompte de survivants.
- source_word: עֲלֵיהֶם יִרְעוּן
  choice: Ils y feront paître leurs troupeaux
  rationale: Le pronom hébreu, formellement pluriel, renvoie au territoire côtier envisagé collectivement. L’objet « leurs troupeaux » est implicite dans l’emploi pastoral du verbe רעה et rend l’image clairement en français.
- source_word: בְּבָתֵּי אַשְׁקְלוֹן בָּעֶרֶב יִרְבָּצוּן
  choice: le soir, ils se coucheront dans les maisons d’Ascalon
  rationale: La formulation conserve l’image concrète du coucher au soir tout en suivant un ordre naturel en français.
- source_word: יִפְקְדֵם
  choice: prendra soin d’eux
  rationale: Dans ce contexte de restauration, פקד exprime une intervention divine attentive et favorable. Une note conserve l’amplitude du verbe, qui peut aussi se traduire par « visiter » ou « intervenir en faveur de ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְשָׁב שְׁבוּתָם
  choice: et rétablira leur situation
  rationale: L’expression idiomatique désigne souvent le renversement du malheur et le retour à une condition favorable, sans se limiter nécessairement au retour de captifs.
theological_decisions:
- issue: Portée de l’expression de restauration וְשָׁב שְׁבוּתָם
  choice: rétablira leur situation
  alternative: ramènera leurs captifs
  rationale: Le contexte annonce le retour à la possession, au pâturage et à la sécurité. Le sens plus large de rétablissement convient donc au passage, tandis que la lecture concrète relative aux captifs est signalée en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin; « Yahweh » le préserve sans le remplacer par un titre.
- issue: Sens de פקד dans un contexte de grâce
  choice: prendra soin d’eux
  alternative: les visitera
  rationale: Le verbe peut exprimer diverses formes d’intervention attentive, favorables ou judiciaires. La restauration annoncée ici oriente vers une intervention bienveillante, sans effacer l’alternative lexicale donnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique est conservé. La formulation privilégie une syntaxe naturelle tout en maintenant les images territoriale et pastorale du texte hébreu.
