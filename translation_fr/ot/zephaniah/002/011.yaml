source:
  edition: WLC
  text: נוֹרָ֤א יְהוָה֙ עֲלֵי/הֶ֔ם כִּ֣י רָזָ֔ה אֵ֖ת כָּל אֱלֹהֵ֣י הָ/אָ֑רֶץ וְ/יִשְׁתַּֽחֲווּ ל/וֹ֙ אִ֣ישׁ מִ/מְּקוֹמ֔/וֹ כֹּ֖ל אִיֵּ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/011.yaml
  text: Yahweh will be fearsome against them[a], for he will make all the gods of the earth waste away; and they will bow down to him, each from his own place[b], all the coastlands of the nations.
translation:
  language: fr
  text: Yahvé sera redoutable contre eux, car il fera dépérir tous les dieux de la terre[a]. Tous les peuples des rivages des nations se prosterneront devant lui, chacun depuis son propre lieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il affamera tous les dieux de la terre ». Le verbe hébreu évoque littéralement le fait de devenir maigre ou décharné.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous les peuples des îles des nations ». Dans les textes prophétiques, ce terme peut désigner les îles, les régions côtières et, plus largement, des peuples maritimes lointains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא
  choice: redoutable
  rationale: Cet adjectif prédicatif exprime le fait que Yahvé inspire la crainte et l’effroi. « Redoutable » est naturel en français moderne et conserve cette force active.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La transcription du nom divin préserve le nom personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: Dans ce contexte de jugement, la préposition a une valeur adversative plutôt que simplement spatiale.
- source_word: רָזָה
  choice: fera dépérir
  rationale: Le verbe évoque littéralement le fait de devenir maigre ou décharné. « Faire dépérir » conserve l’image d’un affaiblissement progressif sans imposer l’idée strictement physique d’une famine.
- source_word: אֵת כָּל אֱלֹהֵי הָאָרֶץ
  choice: tous les dieux de la terre
  rationale: Le pluriel désigne directement les divinités des nations, tandis que « terre » convient à la portée universelle du verset.
- source_word: וְיִשְׁתַּחֲווּ לוֹ
  choice: ils se prosterneront devant lui
  rationale: Le verbe décrit une prosternation qui peut constituer un acte de culte. Cette formulation garde ensemble le geste physique et sa portée religieuse.
- source_word: אִישׁ מִמְּקוֹמוֹ
  choice: chacun depuis le lieu où il se trouve
  rationale: La formulation rend la valeur distributive de אִישׁ et conserve le sens de provenance de מִן, tout en restant compréhensible en français courant.
- source_word: כֹּל אִיֵּי הַגּוֹיִם
  choice: tous les rivages des nations
  rationale: אִיִּים peut désigner des îles ou des régions côtières lointaines. « Rivages » conserve l’image géographique et l’emploi prophétique élargi.
theological_decisions:
- issue: Comment rendre le jugement porté sur « tous les dieux de la terre » sans ajouter une affirmation métaphysique étrangère au verset
  choice: Conserver « tous les dieux de la terre » et dire que Yahvé les « fera dépérir ».
  alternative: Réduire explicitement les « dieux » à des idoles, ou paraphraser par la destruction de toute fausse religion.
  rationale: L’hébreu parle expressément des « dieux » dans une déclaration polémique de la suprématie de Yahvé. La traduction directe préserve cette rhétorique sans lui superposer une explication systématique.
- issue: La dernière proposition décrit-elle un pèlerinage centralisé ou un culte rendu à Yahvé depuis des lieux dispersés ?
  choice: Traduire מִמְּקוֹמוֹ par « depuis le lieu où il se trouve ».
  alternative: Dire « à sa place » ou interpréter la proposition comme un pèlerinage vers Sion.
  rationale: La préposition מִן indique naturellement la provenance. La formulation retenue préserve donc l’image de peuples dispersés rendant hommage à Yahvé depuis leurs divers lieux, sans préciser davantage ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe finale conserve le pronom verbal explicite puis l’apposition « tous les rivages des nations », conformément à l’ordre et à la tension du texte hébreu. « Depuis le lieu où il se trouve » évite une tournure trop littérale et raide tout en maintenant l’idée de provenance.
