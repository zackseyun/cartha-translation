  text: גַּם אַתֶּ֣ם כּוּשִׁ֔ים חַֽלְלֵ֥י חַרְבִּ֖/י הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/012.yaml
  text: You Cushites also will be slain by my sword[a][b].
translation:
  language: fr
  text: Vous aussi, Koushites[b], vous serez tués par mon épée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Vous aussi, Koushites — eux, les tués de mon épée. » La proposition hébraïque ne comporte pas de verbe exprimant le temps.'
    reason: lexical_alternative
  - marker: b
    text: Les Koushites sont les habitants de Koush, région antique située au sud de l’Égypte ; le terme est parfois traduit par « Éthiopiens », sans correspondre exactement aux frontières de l’Éthiopie actuelle.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Conserve la valeur additive qui inclut les Koushites parmi les peuples visés par le jugement.
- source_word: אַתֶּם
  choice: vous
  rationale: Rend l’adresse directe à la deuxième personne du pluriel; sa présence répétée dans « Vous aussi… vous » donne en français une tournure naturelle et légèrement emphatique.
- source_word: כּוּשִׁים
  choice: Koushites
  rationale: Translittère l’ethnonyme antique sans l’identifier trop précisément à la population de l’Éthiopie moderne.
- source_word: חַֽלְלֵי
  choice: transpercés
  rationale: Le terme désigne des personnes frappées à mort, souvent par une arme. « Transpercés » maintient le lien concret avec l’épée, tandis que la note donne la formulation nominale plus littérale.
- source_word: חַרְבִּי
  choice: mon épée
  rationale: Reproduit l’image concrète du texte ainsi que le suffixe de première personne, dont le locuteur est l’Éternel dans le contexte.
- source_word: הֵמָּה
  choice: vous serez
  rationale: Le pronom indépendant sert dans une proposition nominale et porte une nuance emphatique. Le futur exprime naturellement en français la portée prospective de l’annonce prophétique, sans masquer dans la note la forme littérale « ils sont ».
theological_decisions:
- issue: Valeur temporelle de la proposition nominale sans verbe
  choice: 'futur : « vous serez transpercés »'
  alternative: 'présent littéral : « ils sont ceux que mon épée a transpercés »'
  rationale: Le contexte prophétique présente un jugement à venir, ce que le futur rend clairement en français. La note préserve néanmoins l’ambiguïté grammaticale de la proposition hébraïque sans verbe.
- issue: Référent du suffixe « mon »
  choice: conserver simplement « mon épée »
  alternative: expliciter « l’épée de l’Éternel »
  rationale: Le texte porte une première personne singulière et le contexte identifie le locuteur; remplacer le pronom par un nom divin supprimerait l’effet direct de l’oracle.
translation_notes:
  register: Français international moderne, sobre et prophétique. « Koushites » évite une assimilation géographique anachronique; « transpercés » conserve l’image de la mort violente par l’épée. Les deux appels de note figurent dans le texte.
