  text: בְּ/טֶ֨רֶם֙ לֶ֣דֶת חֹ֔ק כְּ/מֹ֖ץ עָ֣בַר י֑וֹם בְּ/טֶ֣רֶם לֹא יָב֣וֹא עֲלֵי/כֶ֗ם חֲרוֹן֙ אַף יְהוָ֔ה בְּ/טֶ֨רֶם֙ לֹא יָב֣וֹא עֲלֵי/כֶ֔ם י֖וֹם אַף יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/002.yaml
  text: before the decree gives birth—before the day passes away like chaff—before the burning anger of Yahweh comes upon you[c][b][a], before the day of Yahweh’s anger comes upon you.
translation:
  language: fr
  text: avant que le décret n’enfante[a], avant que le jour ne passe comme la bale[b], avant que l’ardente colère de Yahweh ne vienne sur vous, avant que le jour de la colère de Yahweh ne vienne sur vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avant que le décret ne prenne effet ». L’hébreu dit littéralement « avant que le décret n’enfante » et emploie l’image d’une naissance pour évoquer l’apparition ou l’exécution du décret.
    reason: lexical_alternative
  - marker: b
    text: Ou « avant que le jour ne s’en aille comme la bale ». La formulation hébraïque est concise et poétique; le rattachement exact de « comme la bale » et le rapport de cette proposition avec la précédente peuvent être compris de façon légèrement différente.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: avant que
  rationale: La locution temporelle, répétée trois fois en hébreu, structure l’avertissement urgent. En français, sa répétition naturelle produit quatre propositions introduites par « avant que », la première occurrence gouvernant deux images successives dans le texte hébreu compact.
- source_word: לֶדֶת
  choice: n’enfante
  rationale: L’infinitif de ילד évoque littéralement l’enfantement. « Enfanter » conserve cette métaphore saisissante sans la réduire à la simple prise d’effet du décret.
- source_word: חֹק
  choice: le décret
  rationale: Dans ce contexte de jugement prophétique, חֹק désigne vraisemblablement une décision arrêtée ou un décret, plutôt qu’une loi générale.
- source_word: כְּמֹץ
  choice: comme la balle du grain
  rationale: « Balle du grain » désigne clairement l’enveloppe légère séparée lors du vannage et évite que le lecteur moderne comprenne « balle » au sens de projectile ou de ballon.
- source_word: עָבַר יוֹם
  choice: le jour ne passe
  rationale: Cette formulation française rend directement le passage rapide du jour tout en laissant la comparaison avec la balle du grain porter l’image poétique.
- source_word: חֲרוֹן אַף
  choice: l’ardente colère
  rationale: L’expression hébraïque exprime une colère brûlante et intense. « Ardente colère » garde l’image de la chaleur dans un registre digne et naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme personnelle présente dans le texte source.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: ne vienne sur vous
  rationale: Cette tournure conserve le mouvement exprimé par בוא avec על et convient à une formule de jugement.
- source_word: יוֹם אַף יְהוָה
  choice: le jour de la colère de Yahweh
  rationale: La chaîne construite est rendue explicitement sans l’assimiler automatiquement à une formule théologique plus développée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom propre du texte hébreu au lieu de lui substituer un titre.
- issue: Force métaphorique de לֶדֶת חֹק
  choice: conserver l’image dans « le décret n’enfante »
  alternative: « le décret ne prenne effet »
  rationale: Le texte emploie explicitement le langage de l’enfantement. Le maintenir respecte sa vigueur prophétique et évite d’expliquer silencieusement une image dont le complément demeure implicite.
- issue: Rapport syntaxique entre כְּמֹץ et עָבַר יוֹם
  choice: « le jour ne passe comme la balle du grain »
  alternative: « avant que, comme la balle du grain, le jour ne passe »
  rationale: L’hébreu poétique est très condensé. Le choix principal rattache naturellement la comparaison au passage du jour sans prétendre lever entièrement l’ambiguïté de la construction.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition de « avant que » conserve l’urgence et l’anaphore du texte. Le subjonctif avec le « ne » explétif est idiomatique après « avant que »; il ne constitue pas une négation. « Balle du grain » apporte la précision nécessaire à un lectorat général tout en conservant l’image agricole.
