source:
  edition: WLC
  text: זֹ֥את לָ/הֶ֖ם תַּ֣חַת גְּאוֹנָ֑/ם כִּ֤י חֵֽרְפוּ֙ וַ/יַּגְדִּ֔לוּ עַל עַ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/010.yaml
  text: This will be their lot in return for their pride[a], because they taunted and magnified themselves against the people of Yahweh of Armies.
translation:
  language: fr
  text: Voilà ce qu’ils recevront en retour de leur orgueil, car ils ont insulté le peuple de Yahweh des armées[a] et se sont exaltés contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת לָהֶם
  choice: Voilà ce qu’ils recevront
  rationale: Le démonstratif suivi de לָהֶם exprime ici le sort qui leur échoira. Cette formulation française rend naturellement ce sens résultatif sans ajouter un nom absent de l’hébreu.
- source_word: תַּחַת גְּאוֹנָם
  choice: en retour de leur orgueil
  rationale: תַּחַת marque ici la rétribution, et גָּאוֹן désigne dans ce contexte l’orgueil hautain.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du jugement. « Car » convient au registre prophétique tout en restant courant.
- source_word: חֵרְפוּ
  choice: ils ont insulté
  rationale: Le verbe exprime l’outrage et le mépris verbal. « Insulter » est clair, actuel et suffisamment fort.
- source_word: וַיַּגְדִּילוּ עַל
  choice: et se sont élevés contre lui
  rationale: Le hiphil de גדל avec עַל évoque le fait de se grandir ou de s’exalter aux dépens de quelqu’un. La tournure choisie conserve l’image de l’élévation orgueilleuse et la valeur hostile de עַל.
- source_word: עַם יְהוָה צְבָאוֹת
  choice: le peuple de Yahweh des armées
  rationale: עַם est rendu par « peuple » dans son sens collectif et relationnel. Le nom divin est translittéré « Yahweh », et צְבָאוֹת par « des armées », formulation transparente qui préserve la force du titre.
theological_decisions:
- issue: Rendu du titre divin יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: l’Éternel des armées
  rationale: Le texte porte explicitement le nom divin יהוה. Sa translittération préserve le nom personnel, tandis que « des armées » communique le sens de צְבָאוֹת. La formulation française traditionnelle est signalée en note.
- issue: Sujet implicite de וַיַּגְדִּילוּ עַל
  choice: se sont élevés contre lui, c’est-à-dire contre le peuple
  alternative: ont fait les grands contre le peuple
  rationale: L’hébreu coordonne deux verbes ayant le même sujet et le même complément introduit par עַל. Le pronom français évite une répétition lourde sans changer le référent ni atténuer l’auto-exaltation hostile.
translation_notes:
  register: Français international moderne, digne et accessible. « Voilà ce qu’ils recevront » exprime naturellement la sentence annoncée; « se sont élevés contre lui » conserve l’image hébraïque sans employer le calque peu idiomatique « se sont grandis ».
