  rationale: La révision restitue plus directement les deux expressions de résultat appliquées à Ninive, maintient l’image de la main étendue et conserve « contre le nord », conforme au contexte de jugement. La note est reformulée en français naturel sans modifier l’alternative lexicale signalée.
