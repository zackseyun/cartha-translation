  text: וְ/יֵ֤ט יָד/וֹ֙ עַל צָפ֔וֹן וִֽ/יאַבֵּ֖ד אֶת אַשּׁ֑וּר וְ/יָשֵׂ֤ם אֶת נִֽינְוֵה֙ לִ/שְׁמָמָ֔ה צִיָּ֖ה כַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/013.yaml
  text: And he will stretch out his hand against the north and destroy Assyria[a], and he will make Nineveh a desolation, dry like the wilderness.
translation:
  language: fr
  text: Il étendra la main contre le nord, détruira l’Assyrie et fera de Ninive une désolation, une terre aride comme le désert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une étendue sauvage ». Le mot hébreu midbar peut désigner une étendue sauvage, une zone de pâturage ou une région désertique, selon le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְיֵט יָדוֹ
  choice: Il étendra la main
  rationale: Cette formulation naturelle conserve l’image anthropomorphique concrète du verbe נטה employé avec « main ».
- source_word: עַל צָפוֹן
  choice: contre le nord
  rationale: Dans ce contexte de jugement suivi de la destruction de l’Assyrie, עַל exprime ici l’orientation hostile de l’action.
- source_word: וִיאַבֵּד אֶת אַשּׁוּר
  choice: et détruira l’Assyrie
  rationale: Le hifil de אבד exprime le fait de causer la ruine; « détruire » en rend clairement la force.
- source_word: וְיָשֵׂם אֶת נִינְוֵה לִשְׁמָמָה
  choice: Il fera de Ninive un lieu dévasté
  rationale: La tournure « faire de… » restitue naturellement la construction résultative avec שׂים, tandis que « un lieu dévasté » exprime le nom שְׁמָמָה en français courant.
- source_word: צִיָּה
  choice: aride
  rationale: Le terme évoque un état desséché ou une terre desséchée; « aride » convient à la description de Ninive devenue dévastée.
- source_word: כַּמִּדְבָּר
  choice: comme le désert
  rationale: מִדְבָּר désigne un espace sauvage, peu habité ou désertique. « Désert » est ici naturel, tout en laissant l’autre nuance dans une note.
theological_decisions:
- issue: Image anthropomorphique du jugement divin
  choice: Conserver « Il étendra la main »
  alternative: « Il agira contre le nord »
  rationale: L’hébreu présente expressément l’action judiciaire de Dieu au moyen d’une image corporelle. La conserver maintient la vigueur poétique sans réduire l’énoncé à une abstraction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement réorganisée en deux phrases pour plus de clarté, sans atténuer la force prophétique. Le pronom « Il » reprend le sujet divin du contexte immédiat.
