id: ZEP.2.4
reference: Zephaniah 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י עַזָּה֙ עֲזוּבָ֣ה תִֽהְיֶ֔ה וְ/אַשְׁקְל֖וֹן לִ/שְׁמָמָ֑ה אַשְׁדּ֗וֹד בַּֽ/צָּהֳרַ֨יִם֙ יְגָ֣רְשׁ֔וּ/הָ וְ/עֶקְר֖וֹן תֵּעָקֵֽר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/004.yaml
  text: For Gaza will be abandoned[a], and Ashkelon a desolation; Ashdod—they will drive her out at noon[b], and Ekron will be uprooted.
translation:
  language: fr
  text: 'Car Gaza sera abandonnée[a],

    Ascalon deviendra un lieu dévasté ;

    Ashdod — on la chassera en plein midi[b],

    et Éqron sera déracinée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, il y a probablement un jeu de mots entre « Gaza » (ʿAzzah) et « abandonnée » (ʿazouvah), dont les sonorités sont proches.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à midi ». L’expression souligne que l’expulsion d’Ashdod aura lieu au grand jour, et non à la faveur de l’obscurité.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de l’appel précédent et conserve naturellement le lien causal en français.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forme française usuelle du nom de lieu.
- source_word: עֲזוּבָה תִהְיֶה
  choice: sera abandonnée
  rationale: Rend le sens passif et résultatif de la tournure. Le jeu sonore hébreu avec le nom Gaza ne peut être reproduit naturellement en français et est signalé en note.
- source_word: אַשְׁקְלוֹן לִשְׁמָמָה
  choice: Ascalon deviendra un lieu dévasté
  rationale: Explicite la prédication elliptique et rend שְׁמָמָה par une expression française naturelle évoquant la dévastation.
- source_word: אַשְׁדּוֹד
  choice: Ashdod
  rationale: Forme française courante du nom de lieu biblique.
- source_word: בַּצָּהֳרַיִם
  choice: en plein midi
  rationale: Conserve l’indication temporelle tout en soulignant que l’expulsion se déroule ouvertement, en pleine lumière.
- source_word: יְגָרְשׁוּהָ
  choice: on la chassera
  rationale: Le pronom indéfini français rend le sujet pluriel non exprimé sans inventer son identité ; « la » reprend la ville et conserve sa personnification grammaticale.
- source_word: וְעֶקְרוֹן תֵּעָקֵר
  choice: et Éqron sera déracinée
  rationale: Préserve l’image forte de l’arrachement des racines et le probable effet sonore entre le nom Éqron et le verbe hébreu.
theological_decisions: []
