  text: וְ/רָבְצ֨וּ בְ/תוֹכָ֤/הּ עֲדָרִים֙ כָּל חַיְת/וֹ ג֔וֹי גַּם קָאַת֙ גַּם קִפֹּ֔ד בְּ/כַפְתֹּרֶ֖י/הָ יָלִ֑ינוּ ק֠וֹל יְשׁוֹרֵ֤ר בַּֽ/חַלּוֹן֙ חֹ֣רֶב בַּ/סַּ֔ף כִּ֥י אַרְזָ֖ה עֵרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/014.yaml
  text: Herds will lie down in her midst[a], every beast of the nations; both the desert owl and the hedgehog will spend the night among her capitals. A voice will sing in the window; devastation will be on the threshold[c][b], for her cedarwork has been laid bare.
translation:
  language: fr
  text: Des troupeaux se coucheront au milieu d’elle, ainsi que toutes sortes d’animaux[a]. Le pélican et le hérisson[b] passeront la nuit sur ses chapiteaux. Une voix chantera à la fenêtre ; la désolation sera sur le seuil, car ses boiseries de cèdre ont été mises à nu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile : littéralement, peut-être « tout animal d’une nation ». Il semble désigner toutes sortes d’animaux.'
    reason: alternative_reading
  - marker: b
    text: L’identification de ces deux animaux est incertaine. Le premier terme peut aussi désigner une chouette du désert, et le second un porc-épic.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: se coucheront
  rationale: Le verbe רבץ décrit couramment des animaux qui se couchent ou se reposent ; ce choix conserve l’image concrète de la ville en ruine occupée par des bêtes.
- source_word: עֲדָרִים
  choice: Des troupeaux
  rationale: Le nom désigne des groupes d’animaux. « Troupeaux » est naturel en français et reste suffisamment large dans ce contexte.
- source_word: בְתוֹכָהּ
  choice: au milieu d’elle
  rationale: Le suffixe féminin renvoie à la ville personnifiée ; la formulation maintient cette personnification.
- source_word: כָּל חַיְתוֹ גוֹי
  choice: toutes sortes d’animaux sauvages
  rationale: L’hébreu est difficile et pourrait se rendre plus littéralement par « tout animal d’une nation ». La traduction retenue exprime la valeur globale probablement visée sans imposer à la phrase française une construction obscure.
- source_word: קָאַת
  choice: le pélican
  rationale: L’identification zoologique est incertaine. « Pélican » est un équivalent traditionnel plausible d’un oiseau associé aux lieux déserts ; l’incertitude est signalée en note.
- source_word: קִפֹּד
  choice: le hérisson
  rationale: L’espèce exacte demeure discutée. « Hérisson » est une traduction courante qui convient à l’image d’un animal habitant les ruines ; une autre possibilité figure en note.
- source_word: בְּכַפְתֹּרֶיהָ
  choice: parmi les chapiteaux de ses colonnes
  rationale: כפתור désigne ici vraisemblablement des chapiteaux ou ornements architecturaux. L’ajout explicatif « de ses colonnes » rend le référent compréhensible en français.
- source_word: יָלִינוּ
  choice: passeront la nuit
  rationale: Le verbe לין signifie passer la nuit ou loger pour la nuit ; cette expression est naturelle et précise.
- source_word: קוֹל יְשׁוֹרֵר
  choice: Une voix chantera
  rationale: La traduction garde le sens de « voix/son » et le verbe issu de שׁיר, « chanter », ainsi que l’étrangeté poétique de l’image.
- source_word: בַּחַלּוֹן
  choice: à la fenêtre
  rationale: La préposition peut indiquer la localisation à la fenêtre ; cette tournure est idiomatique en français.
- source_word: חֹרֶב
  choice: la désolation
  rationale: Dans ce contexte de destruction urbaine, le nom évoque la ruine ou la désolation. « Désolation » convient au registre poétique et au tableau d’ensemble.
- source_word: בַּסַּף
  choice: sur le seuil
  rationale: סף désigne concrètement le seuil d’une entrée ; la traduction préserve ce détail architectural.
- source_word: כִּי אַרְזָה עֵרָה
  choice: car les boiseries de cèdre ont été mises à nu
  rationale: La construction concise évoque le cèdre exposé ou dépouillé. « Boiseries de cèdre » explicite naturellement en français l’élément architectural sans effacer l’image de mise à nu.
