  to: Des troupeaux se coucheront au milieu d’elle, ainsi que toutes sortes d’animaux[a]. Le pélican et le hérisson[b] passeront la nuit sur ses chapiteaux. Une voix chantera à la fenêtre ; la désolation sera sur le seuil, car ses boiseries de cèdre ont été mises à nu.
