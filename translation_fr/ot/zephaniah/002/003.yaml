source:
  edition: WLC
  text: בַּקְּשׁ֤וּ אֶת יְהוָה֙ כָּל עַנְוֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר מִשְׁפָּט֖/וֹ פָּעָ֑לוּ בַּקְּשׁוּ צֶ֨דֶק֙ בַּקְּשׁ֣וּ עֲנָוָ֔ה אוּלַי֙ תִּסָּ֣תְר֔וּ בְּ/י֖וֹם אַף יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/003.yaml
  text: Seek Yahweh[a], all you humble of the land, who have carried out his justice; seek righteousness, seek humility[d][c][b]; perhaps you will be hidden in the day of Yahweh’s anger.
translation:
  language: fr
  text: 'Cherchez Yahvé, vous tous, humbles du pays[a],

    vous qui mettez en pratique son droit[b].

    Cherchez la justice[c], cherchez l’humilité.

    Peut-être serez-vous cachés[d]

    au jour de la colère de Yahvé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « humbles de la terre »; עַנְוֵי peut aussi évoquer les doux ou les affligés.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui accomplissez son ordonnance » ou « qui pratiquez sa justice ».
    reason: lexical_alternative
  - marker: c
    text: Le terme peut aussi être rendu par « droiture » ou « ce qui est juste ».
    reason: lexical_alternative
  - marker: d
    text: Ou « vous pourrez être cachés » ou, selon le sens, « vous serez mis à l’abri ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקְּשׁוּ
  choice: Cherchez
  rationale: L’impératif pluriel appelle directement les destinataires à rechercher Yahvé, la justice et l’humilité. La répétition du verbe est conservée pour préserver la force rhétorique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin représenté par le tétragramme, préférable ici à la substitution par un titre comme « le Seigneur ».
- source_word: עַנְוֵי הָאָרֶץ
  choice: humbles du pays
  rationale: עַנְוֵי désigne les humbles, les doux ou les gens de condition modeste. « Humbles » maintient le lien lexical avec l’appel à chercher l’humilité. Dans ce contexte prophétique adressé à Juda, « pays » convient mieux, sans exclure le sens « terre ».
- source_word: אֲשֶׁר מִשְׁפָּטוֹ פָּעָלוּ
  choice: vous qui mettez en pratique son droit
  rationale: פּעל exprime l’action d’accomplir ou de pratiquer, tandis que מִשְׁפָּט peut désigner le droit, une décision, une règle ou la justice. Cette formulation française reste intelligible tout en conservant la dimension active et normative.
- source_word: צֶדֶק
  choice: la justice
  rationale: צֶדֶק désigne ce qui est juste, la justice ou la droiture. « Justice » est naturel en français et convient au parallèle éthique avec l’humilité.
- source_word: עֲנָוָה
  choice: l’humilité
  rationale: Le nom peut exprimer l’humilité, la douceur ou l’abaissement. « Humilité » établit clairement l’écho avec « humbles » au début du verset.
- source_word: אוּלַי
  choice: Peut-être
  rationale: L’adverbe indique une possibilité et non une certitude. Il faut maintenir cette réserve explicite.
- source_word: תִּסָּתְרוּ
  choice: serez-vous cachés
  rationale: Le nifal de סתר signifie être caché ou dissimulé. La formulation conserve l’image hébraïque; la possibilité est déjà marquée par « Peut-être ».
- source_word: בְּיוֹם אַף יְהוָה
  choice: au jour de la colère de Yahvé
  rationale: אַף désigne ici la colère. « Au jour de » est idiomatique en français et conserve la portée prophétique de l’expression.
theological_decisions:
- issue: Le verset promet-il une protection certaine ou seulement possible aux humbles ?
  choice: 'La protection demeure possible, sans être garantie : « Peut-être serez-vous cachés » vient traduire explicitement אוּלַי.'
  alternative: Comprendre le verset comme une promesse certaine de délivrance pour le reste fidèle.
  rationale: L’adverbe hébreu אוּלַי marque expressément l’incertitude. La traduction préserve cette tension au lieu de transformer l’exhortation en garantie.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et la triple répétition de « cherchez » sont maintenus. « Serez-vous cachés » est légèrement moins idiomatique que « serez-vous à l’abri », mais conserve plus directement l’image du texte hébreu; la note donne l’équivalent interprétatif naturel.
