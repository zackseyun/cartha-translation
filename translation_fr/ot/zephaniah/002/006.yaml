lexical_decisions:
- source_word: חֶבֶל הַיָּם
  choice: le littoral
  rationale: L’expression désigne la région ou bande de terre située le long de la mer; « le littoral » est naturel et précis en français moderne.
- source_word: נְוֹת
  choice: une région de pâturages
  rationale: Le pluriel peut désigner des pâturages ou lieux où paissent les troupeaux. « Une région de pâturages » s’accorde avec le singulier du verbe et rend le sens collectif.
- source_word: כְּרֹת
  choice: des puits
  rationale: Terme rare et incertain, probablement lié à l’idée de creuser; « puits » représente une interprétation lexicale ancienne et contextuellement plausible, sans masquer l’incertitude.
- source_word: גִּדְרוֹת צֹאן
  choice: des enclos pour les troupeaux
  rationale: Expression concrète désignant des espaces clôturés pour le petit bétail; « troupeaux » convient mieux au français courant que la répétition de « moutons ».
