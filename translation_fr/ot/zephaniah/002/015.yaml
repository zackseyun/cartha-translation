  text: זֹ֞֠את הָ/עִ֤יר הָ/עַלִּיזָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָבָ֔/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד אֵ֣יךְ הָיְתָ֣ה לְ/שַׁמָּ֗ה מַרְבֵּץ֙ לַֽ/חַיָּ֔ה כֹּ֚ל עוֹבֵ֣ר עָלֶ֔י/הָ יִשְׁרֹ֖ק יָנִ֥יעַ יָדֽ/וֹ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/015.yaml
  text: This is the exultant city that lived securely[a], that said in her heart, ‘I am, and there is none besides me.’ How she has become a desolation[b], a resting place for wild animals! Everyone who passes by her will hiss and wave his hand.
translation:
  language: fr
  text: 'C’est là la ville en liesse qui vivait en sécurité, celle qui se disait en son cœur : « Je suis, et il n’y en a pas d’autre que moi. » Comment est-elle devenue une étendue dévastée[a], un gîte pour les animaux sauvages ! Tous ceux qui passeront devant elle siffleront[b] et agiteront la main.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un spectacle terrifiant ». Le terme hébreu peut désigner une dévastation qui inspire l’effroi.
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut désigner un sifflement exprimant la stupeur ou la dérision.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הָעַלִּיזָה
  choice: en liesse
  rationale: L’expression rend naturellement la joie exubérante et satisfaite que décrit l’adjectif, sans réduire le sens à la seule insouciance.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: qui vivait en sécurité
  rationale: Le participe décrit une situation durable; cette formulation est claire et idiomatique en français moderne.
- source_word: הָאֹמְרָה בִּלְבָבָהּ
  choice: celle qui se disait en son cœur
  rationale: La tournure conserve à la fois le discours intérieur et la personnification féminine de la ville.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Moi, et personne d’autre !
  rationale: Cette formulation concise préserve la revendication d’exclusivité et l’arrogance de la ville sans transformer le pronom hébreu en verbe d’existence explicite.
- source_word: לְשַׁמָּה
  choice: une étendue dévastée
  rationale: Le choix exprime concrètement la ruine du lieu tout en laissant à une note la nuance possible d’horreur suscitée par cette dévastation.
- source_word: מַרְבֵּץ
  choice: un gîte
  rationale: Le nom désigne un endroit où les animaux se couchent; « gîte » est bref, naturel et moins spécifiquement prédateur que « repaire ».
- source_word: לַחַיָּה
  choice: pour les animaux sauvages
  rationale: Dans le contexte des ruines inhabitées, le singulier collectif désigne les bêtes sauvages qui viennent y séjourner.
- source_word: יִשְׁרֹק
  choice: siffleront
  rationale: Le verbe peut évoquer un sifflement de stupeur ou de dérision; « siffler » conserve cette ambiguïté mieux qu’une paraphrase explicative.
- source_word: יָנִיעַ יָדוֹ
  choice: agiteront la main
  rationale: La formulation conserve le geste visible sans déterminer plus précisément que l’hébreu sa forme exacte.
theological_decisions:
- issue: La prétention exprimée par אֲנִי וְאַפְסִי עוֹד
  choice: « Moi, et personne d’autre ! »
  alternative: « Je suis, et il n’y en a pas d’autre en dehors de moi. »
  rationale: L’hébreu commence par le pronom « moi », non par un verbe signifiant explicitement « je suis ». Le choix retenu garde néanmoins l’écho frappant des affirmations d’exclusivité divine, ici détournées par une ville orgueilleuse, sans accentuer artificiellement cet écho.
translation_notes:
  register: Français international moderne, clair et digne. « En liesse » et « gîte » évitent un ton archaïque tout en conservant la vigueur poétique. La syntaxe maintient la personnification féminine de la ville et la forme exclamative du jugement prophétique.
