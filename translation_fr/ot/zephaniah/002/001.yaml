id: ZEP.2.1
reference: Zephaniah 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִֽתְקוֹשְׁשׁ֖וּ וָ/ק֑וֹשּׁוּ הַ/גּ֖וֹי לֹ֥א נִכְסָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/001.yaml
  text: Gather yourselves together[a], yes, gather, O shameless nation,
translation:
  language: fr
  text: Rassemblez-vous, oui, rassemblez-vous, nation qui n’a pas honte[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « nation non désirée » ou « nation sans aspiration ». L’expression hébraïque est difficile.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְקוֹשְׁשׁוּ
  choice: Rassemblez-vous
  rationale: L’impératif pluriel réfléchi appelle le peuple à se réunir. Le sens concret de la racine, « ramasser de la paille ou du chaume », convient moins bien ici que l’emploi figuré.
- source_word: וָקֹושּׁוּ
  choice: oui, rassemblez-vous
  rationale: Le second impératif reprend et renforce le premier. « Oui » rend naturellement la valeur intensive possible du waw tout en conservant la répétition.
- source_word: הַגּוֹי
  choice: nation
  rationale: « Nation » conserve la portée collective de גּוֹי dans cette interpellation prophétique.
- source_word: לֹא נִכְסָף
  choice: sans honte
  rationale: Cette expression hébraïque difficile signifie plus littéralement « qui n’est pas désirée » ou « sans désir ». Dans le contexte de l’appel à réagir avant le jugement, « sans honte » exprime une interprétation idiomatique reconnue, tandis que les possibilités plus littérales sont conservées en note.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et direct. La répétition impérative et l’interpellation prophétique sont conservées; la difficulté de la dernière expression est signalée sans masquer son ambiguïté.
