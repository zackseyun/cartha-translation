- from: Lamentez-vous, habitants du Mortier[a], car tout le peuple des marchands est réduit au silence[b] ; tous ceux qui pèsent l’argent sont retranchés.
  to: Lamentez-vous, habitants du Mortier[a], car tous les marchands sont anéantis[b] ; tous ceux qui pèsent l’argent sont retranchés.
