source:
  edition: WLC
  text: הֵילִ֖ילוּ יֹשְׁבֵ֣י הַ/מַּכְתֵּ֑שׁ כִּ֤י נִדְמָה֙ כָּל עַ֣ם כְּנַ֔עַן נִכְרְת֖וּ כָּל נְטִ֥ילֵי כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/011.yaml
  text: Wail[a], inhabitants of the Mortar, for all the merchant people are destroyed[b]; all who weigh out silver are cut off.
translation:
  language: fr
  text: Lamentez-vous, habitants du Mortier[a], car tous les marchands sont anéantis[b] ; tous ceux qui pèsent l’argent sont retranchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu : Maktèsh, littéralement « mortier ». Il s’agit probablement du nom d’un quartier commerçant de Jérusalem, peut-être ainsi appelé en raison de sa forme creuse.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « tout le peuple de Canaan est anéanti ». Dans ce contexte commercial, « Canaan » désigne probablement les marchands, selon un emploi attesté du terme en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Lamentez-vous
  rationale: L’impératif pluriel de ילל appelle à pousser un cri de deuil devant le désastre. « Lamentez-vous » est naturel, digne et conserve la force prophétique.
- source_word: יֹשְׁבֵי
  choice: habitants de
  rationale: Le participe construit de ישב est employé comme substantif collectif et désigne les personnes qui résident dans le lieu interpellé.
- source_word: הַמַּכְתֵּשׁ
  choice: le Mortier
  rationale: Le terme signifie littéralement « le mortier » et paraît désigner un quartier de Jérusalem. La majuscule signale le nom de lieu tout en conservant son sens concret.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’appel à se lamenter.
- source_word: נִדְמָה
  choice: est réduit au silence
  rationale: Le nifal de דמה peut exprimer le fait d’être réduit au silence, anéanti ou supprimé. Le choix français maintient l’image hébraïque sans la confondre avec נִכְרְתוּ dans le membre parallèle.
- source_word: כָּל עַם כְּנַעַן
  choice: tout le peuple des marchands
  rationale: Dans ce contexte commercial, כְּנַעַן peut désigner les marchands. « Peuple des marchands » préserve le nom collectif עַם, tandis qu’une note conserve la lecture littérale « peuple de Canaan ».
- source_word: נִכְרְתוּ
  choice: sont retranchés
  rationale: Le nifal de כרת signifie couramment « être retranché ». Cette formulation conserve l’expression hébraïque traditionnelle de jugement.
- source_word: כָּל נְטִילֵי כָסֶף
  choice: tous ceux qui pèsent l’argent
  rationale: Dans un contexte de commerce, l’expression désigne vraisemblablement ceux qui manipulent l’argent pesé pour les transactions. « Pèsent l’argent » rend ce sens probable sans préciser indûment leur profession.
