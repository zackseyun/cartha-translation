review_pass:
  verdict: revise
  source_fidelity: Le sens commercial de כְּנַעַן est bien motivé par le contexte et le parallélisme avec les personnes qui pèsent l’argent. Toutefois, « tout le peuple des marchands » est une restitution trop calquée et peu naturelle en français. Le nifal נִדְמָה exprime ici la ruine ou l’anéantissement du groupe ; « sont anéantis » le rend plus directement que « est réduit au silence », sans effacer le contraste avec « sont retranchés » (נִכְרְתוּ).
  naturalness: La formulation révisée est plus idiomatique en français international moderne tout en gardant le rythme de l’oracle. « Le Mortier » demeure acceptable comme nom de lieu traduit, avec l’explication en note.
  terminology: « Marchands » rend naturellement le sens vraisemblablement commercial de « Canaan » ; la note conserve explicitement la lecture géographique/littérale. « Retranchés » conserve le vocabulaire de jugement de כרת. « Ceux qui pèsent l’argent » correspond au sens commercial retenu dans l’audit anglais.
  issues:
  - severity: medium
    issue: « tout le peuple des marchands » est une expression française lourde et artificielle.
    rationale: Elle reproduit excessivement le collectif עַם et nuit à la lisibilité sans apporter une nuance indispensable. « Tous les marchands » rend le collectif dans un français naturel.
  - severity: low
    issue: « est réduit au silence » est moins précis dans ce contexte que « sont anéantis ».
    rationale: נִדְמָה peut comporter l’idée de silence, mais dans ce jugement contre les acteurs commerciaux, l’idée de disparition/ruine est plus immédiate. Le pluriel français suit le collectif interprété comme des marchands.
  revised_text: Lamentez-vous, habitants du Mortier[a], car tous les marchands sont anéantis[b] ; tous ceux qui pèsent l’argent sont retranchés.
