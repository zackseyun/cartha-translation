  text: וְ/הָיָ֗ה בְּ/יוֹם֙ זֶ֣בַח יְהוָ֔ה וּ/פָקַדְתִּ֥י עַל הַ/שָּׂרִ֖ים וְ/עַל בְּנֵ֣י הַ/מֶּ֑לֶךְ וְ/עַ֥ל כָּל הַ/לֹּבְשִׁ֖ים מַלְבּ֥וּשׁ נָכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/008.yaml
  text: And on the day of Yahweh’s sacrifice[a], I will punish the officials, the king’s sons[c][b], and all who wear foreign clothing.
translation:
  language: fr
  text: Au jour du sacrifice de Yahweh[a], je punirai les responsables[b], les fils du roi et tous ceux qui portent des vêtements étrangers[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sacrifice du SEIGNEUR ». Dans le contexte, l’expression peut aussi évoquer un festin sacrificiel préparé par Yahweh en vue du jugement (voir 1.7).
    reason: lexical_alternative
  - marker: b
    text: Ou « les dignitaires », « les chefs » ou « les princes ».
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire des vêtements associés aux peuples étrangers ; l’expression peut suggérer l’adoption de coutumes ou d’allégeances étrangères, et pas seulement le port d’étoffes venues d’ailleurs.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Au jour
  rationale: La formule introduit un événement futur. En français, « Au jour de… » restitue naturellement le repère prophétique sans le tour lourd « Il arrivera qu’au jour… ».
- source_word: זֶבַח יְהוָה
  choice: du sacrifice de Yahweh
  rationale: Le syntagme construit désigne directement le sacrifice associé à Yahweh. Cette formulation préserve la concision et l’ambiguïté quant à la fonction exacte de Yahweh dans la scène sacrificielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וּפָקַדְתִּי עַל
  choice: j’interviendrai contre
  rationale: Dans ce contexte de jugement, פקד avec על exprime une intervention punitive. « J’interviendrai contre » conserve cette force tout en évitant de réduire le verbe à la seule exécution d’une peine.
- source_word: הַשָּׂרִים
  choice: les hauts responsables
  rationale: שׂרים désigne ici les membres dirigeants ou dignitaires. « Hauts responsables » est actuel et ne suggère pas nécessairement des princes de sang.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: les fils du roi
  rationale: Traduction directe du groupe construit, qui maintient la référence masculine et familiale.
- source_word: כָּל הַלֹּבְשִׁים
  choice: tous ceux qui portent
  rationale: Cette proposition relative rend naturellement en français le participe hébreu.
- source_word: מַלְבּוּשׁ נָכְרִי
  choice: des vêtements étrangers
  rationale: La traduction conserve le sens concret de tenues associées à l’étranger, sans expliciter dans le corps du texte les coutumes ou loyautés que celles-ci peuvent symboliser.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Sens de זֶבַח יְהוָה dans la scène de jugement
  choice: le sacrifice de Yahweh
  alternative: le festin sacrificiel préparé par Yahweh
  rationale: Le génitif hébreu reste formellement ouvert. Le contexte de Sophonie 1.7 évoque une victime ou un festin préparé par Yahweh, mais le texte du verset 8 ne précise pas davantage le rapport.
- issue: Portée de l’intervention exprimée par פקד על
  choice: j’interviendrai contre
  alternative: je punirai
  rationale: Le contexte impose une portée judiciaire et punitive; la formulation choisie la communique sans effacer la nuance plus large de visitation ou de règlement de comptes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste resserrée comme l’hébreu. « Hauts responsables » évite l’ambiguïté dynastique de « princes », puisque les fils du roi sont nommés séparément. Les trois appels de note figurent dans le texte dans l’ordre a, b, c.
