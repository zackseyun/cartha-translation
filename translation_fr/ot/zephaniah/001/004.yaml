  text: וְ/נָטִ֤יתִי יָדִ/י֙ עַל יְהוּדָ֔ה וְ/עַ֖ל כָּל יוֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/הִכְרַתִּ֞י מִן הַ/מָּק֤וֹם הַ/זֶּה֙ אֶת שְׁאָ֣ר הַ/בַּ֔עַל אֶת שֵׁ֥ם הַ/כְּמָרִ֖ים עִם הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/004.yaml
  text: And I will stretch out my hand against Judah and against all the inhabitants of Jerusalem[a], and I will cut off from this place the remnant of Baal, the name of the idolatrous priests along with the priests[b],
translation:
  language: fr
  text: J’étendrai ma main contre Juda et contre tous les habitants de Jérusalem, et je retrancherai de ce lieu ce qui reste de Baal, le nom[a] des prêtres idolâtres[b] avec les prêtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souvenir ». En hébreu, supprimer le nom de quelqu’un peut signifier effacer jusqu’à son souvenir.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne des prêtres liés à un culte païen ou syncrétique et les distingue ici des « prêtres » mentionnés ensuite.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָטִיתִי יָדִי
  choice: J’étendrai ma main
  rationale: Conserve l’image hébraïque d’une intervention décisive de Dieu dans le jugement. Le futur convient à la série d’actions annoncées dans ce contexte prophétique.
- source_word: עַל יְהוּדָה וְעַל כָּל יוֹשְׁבֵי יְרוּשָׁלָם
  choice: contre Juda et contre tous les habitants de Jérusalem
  rationale: Avec le geste hostile de la main étendue, עַל a ici le sens adversatif de « contre ». « Habitants » rend naturellement יוֹשְׁבֵי dans ce contexte.
- source_word: וְהִכְרַתִּי
  choice: Je retrancherai
  rationale: Le hiphil de כרת exprime ici l’élimination dans un contexte de jugement. « Retrancher » préserve la force judiciaire de l’expression sans la réduire à une simple destruction matérielle.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: de ce lieu
  rationale: Cette formulation conserve la référence déictique du texte sans décider explicitement si le lieu désigne Jérusalem ou un territoire plus large.
- source_word: שְׁאָר הַבַּעַל
  choice: ce qui reste de Baal
  rationale: Cette tournure française rend clairement שְׁאָר tout en conservant l’expression condensée du texte, qui peut viser les vestiges de la présence ou du culte de Baal.
- source_word: שֵׁם הַכְּמָרִים
  choice: le nom des prêtres idolâtres
  rationale: « Le nom » maintient l’image hébraïque d’un effacement complet, tandis que « prêtres idolâtres » communique le sens de כְּמָרִים sans recourir à une translittération obscure.
- source_word: עִם הַכֹּהֲנִים
  choice: avec les prêtres
  rationale: Rend simplement עִם et maintient la distinction lexicale entre les כְּמָרִים et les כֹּהֲנִים.
theological_decisions:
- issue: Distinction entre כְּמָרִים et כֹּהֲנִים
  choice: Traduire כְּמָרִים par « prêtres idolâtres » et כֹּהֲנִים par « prêtres ».
  alternative: Traduire les deux termes par « prêtres », ou translittérer כְּמָרִים.
  rationale: Le texte emploie intentionnellement deux termes. La traduction retenue préserve le contraste entre les ministres d’un culte païen ou syncrétique et les prêtres désignés par le terme hébreu ordinaire, sans préciser au-delà du texte la culpabilité exacte de chaque groupe.
- issue: Portée de « le nom »
  choice: Conserver « le nom » dans le texte principal.
  alternative: Paraphraser par « le souvenir » ou « toute trace ».
  rationale: La formulation hébraïque évoque une élimination si complète que le nom lui-même disparaît. La note en explicite l’idiome sans supprimer l’image ni résoudre sa force rhétorique dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la formulation dense du texte hébreu ainsi que sa ponctuation ouverte vers le verset suivant. « Retrancher » et « étendre la main » maintiennent les images judiciaires du texte source sans les paraphraser excessivement.
