base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/017.yaml
  text: And I will bring distress on mankind[a], and they will walk like the blind, because they have sinned against Yahweh; their blood will be poured out like dust[b], and their flesh like dung.
translation:
  language: fr
  text: Je plongerai les humains[a] dans la détresse ; ils marcheront comme des aveugles, parce qu’ils ont péché contre Yahweh ; leur sang sera répandu comme de la poussière, et leur chair[b] comme des excréments.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le nom אָדָם (« être humain ») au singulier, avec un sens collectif : l’humanité.'
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs entrailles » ou « leurs intestins » ; le sens précis du terme hébreu est incertain.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וַהֲצֵרֹתִי
  choice: Je plongerai … dans la détresse
  rationale: Le hifil de צרר exprime ici l’action de mettre quelqu’un dans l’angoisse ou la détresse. Cette formulation française conserve l’initiative divine et la force du jugement.
- source_word: לָאָדָם
  choice: les humains
  rationale: אָדָם est au singulier, mais possède ici un sens collectif. « Les humains » rend naturellement cette portée générale sans la limiter aux hommes de sexe masculin.
- source_word: וְהָלְכוּ כַּעִוְרִים
  choice: ils marcheront comme des aveugles
  rationale: La traduction garde le verbe concret « marcher » et l’image de personnes aveugles avançant sans repères.
- source_word: כִּי לַיהוָה חָטָאוּ
  choice: parce qu’ils ont péché contre Yahweh
  rationale: כִּי introduit la cause du jugement, et חטא construit avec ל désigne ici une faute commise contre Yahweh.
- source_word: וְשֻׁפַּךְ דָּמָם כֶּעָפָר
  choice: Leur sang sera répandu comme de la poussière
  rationale: Le passif de שפך est conservé, ainsi que la comparaison frappante avec la poussière, qui suggère abondance et absence de valeur accordée au sang versé.
- source_word: וּלְחֻמָם
  choice: leur chair
  rationale: Le terme est rare et discuté ; « chair » convient au parallélisme avec « sang » tout en laissant en note les lectures anatomiques plus précises.
- source_word: כַּגְּלָלִים
  choice: comme des excréments
  rationale: גְּלָלִים désigne les déjections ou le fumier. « Excréments » est direct, clair en français international et ne réduit pas la rudesse de l’image.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée collective de אָדָם
  choice: les humains
  alternative: l’humanité / l’être humain
  rationale: Le singulier hébreu est collectif dans ce contexte, comme le confirme la reprise au pluriel « ils marcheront ». La traduction choisie transmet cette portée sans imposer une restriction de genre.
- issue: Sens du terme rare לְחֻמָם
  choice: leur chair
  alternative: leurs entrailles / leurs intestins
  rationale: Le sens exact demeure incertain. « Chair » préserve le parallélisme général avec le sang, tandis qu’une note maintient les compréhensions plus spécifiques sans trancher abusivement.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme judiciaire et les images concrètes, volontairement dures, sont conservés. La ponctuation distingue l’annonce du jugement de sa cause et de ses effets.
