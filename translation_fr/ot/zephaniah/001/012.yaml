source:
  edition: WLC
  text: וְ/הָיָה֙ בָּ/עֵ֣ת הַ/הִ֔יא אֲחַפֵּ֥שׂ אֶת יְרוּשָׁלִַ֖ם בַּ/נֵּר֑וֹת וּ/פָקַדְתִּ֣י עַל הָ/אֲנָשִׁ֗ים הַ/קֹּֽפְאִים֙ עַל שִׁמְרֵי/הֶ֔ם הָ/אֹֽמְרִים֙ בִּ/לְבָבָ֔/ם לֹֽא יֵיטִ֥יב יְהוָ֖ה וְ/לֹ֥א יָרֵֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/012.yaml
  text: 'And it will happen at that time: I will search Jerusalem with lamps, and I will punish the men who have grown thick on their dregs, who say in their hearts, ''The LORD will not do good, nor will he do harm.'''
translation:
  language: fr
  text: 'En ce temps-là, je fouillerai Jérusalem à la lumière des lampes et j’interviendrai contre les hommes qui se figent sur leur lie[a], ceux qui se disent dans leur cœur : « Le SEIGNEUR ne fera ni bien ni mal. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui se figent sur leur lie ». L’image est celle d’un vin laissé sur sa lie sans être transvasé ; elle évoque ici des hommes installés dans une suffisance inerte.'
    reason: La métaphore hébraïque est peu familière en français moderne et peut nécessiter une brève explication sans être remplacée dans le texte.
lexical_decisions:
- source_word: אֲחַפֵּשׂ
  choice: je fouillerai
  rationale: Le verbe exprime une recherche minutieuse. « Fouiller » convient naturellement à l’image des lampes et suggère qu’aucun recoin de Jérusalem n’échappera à l’examen.
- source_word: וּפָקַדְתִּי עַל
  choice: j’interviendrai contre
  rationale: פקד avec עַל peut désigner une intervention punitive. Cette formulation préserve l’idée de jugement sans réduire le verbe au seul sens lexical de « punir ».
- source_word: הַקֹּפְאִים עַל שִׁמְרֵיהֶם
  choice: qui se figent sur leur lie
  rationale: L’expression reprend l’image du vin laissé sur sa lie, qui s’épaissit ou se fige. Une traduction imagée conserve la métaphore et l’état de suffisance stagnante visé par le contexte.
- source_word: בִּלְבָבָם
  choice: dans leur cœur
  rationale: Conserve l’anthropologie hébraïque et indique une conviction intérieure, non nécessairement prononcée à voix haute.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rendu français conventionnel du tétragramme, en petites capitales typographiques simulées par les capitales.
- source_word: לֹא יֵיטִיב ... וְלֹא יָרֵעַ
  choice: ne fera ni bien ni mal
  rationale: 'Reproduit le parallélisme et l’ambiguïté voulue : ces hommes nient que le SEIGNEUR agisse favorablement ou défavorablement.'
theological_decisions:
- issue: Nature de l’intervention divine exprimée par פקד על
  choice: j’interviendrai contre
  alternative: je punirai
  rationale: Le contexte annonce clairement un jugement, mais le choix retenu garde l’étendue sémantique de פקד tout en marquant son orientation hostile par « contre ».
- issue: Description spirituelle des hommes par la métaphore de la lie
  choice: 'conserver la métaphore : « qui se figent sur leur lie »'
  alternative: 'expliciter : « qui vivent dans une tranquille indifférence »'
  rationale: Le texte source décrit leur complaisance au moyen d’une image œnologique. La conserver évite d’imposer une interprétation psychologique unique.
- issue: Portée de « faire du bien / faire du mal »
  choice: ne fera ni bien ni mal
  alternative: n’accordera aucune faveur et n’enverra aucun malheur
  rationale: La formulation littérale maintient la tension théologique et la portée générale de l’affirmation déiste ou indifférentiste attribuée aux hommes.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve l’image prophétique vive et le parallélisme final. « En ce temps-là » est plus idiomatique que « Et il arrivera en ce temps-là » tout en rendant la formule temporelle וְהָיָה בָּעֵת הַהִיא.
