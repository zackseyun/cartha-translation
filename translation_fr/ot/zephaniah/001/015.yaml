id: ZEP.1.15
reference: Zephaniah 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: י֥וֹם עֶבְרָ֖ה הַ/יּ֣וֹם הַ/ה֑וּא י֧וֹם צָרָ֣ה וּ/מְצוּקָ֗ה י֤וֹם שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה י֥וֹם חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/015.yaml
  text: That day is a day of wrath[a], a day of distress and anguish, a day of ruin and devastation, a day of darkness and gloom[c][b], a day of clouds and thick darkness.
translation:
  language: fr
  text: Ce jour-là est un jour de fureur[a], un jour de détresse et d’angoisse, un jour de ruine et de dévastation[b], un jour de ténèbres et d’obscurité, un jour de nuée et d’obscurité profonde[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un jour de colère ».
    reason: lexical_alternative
  - marker: b
    text: « Ruine et dévastation » peut aussi se traduire par « désolation et destruction ».
    reason: lexical_alternative
  - marker: c
    text: Ou « un jour de nuage et d’épaisse obscurité »; l’hébreu emploie des noms au singulier dans cette suite poétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם עֶבְרָ֖ה
  choice: un jour de fureur
  rationale: עֶבְרָה désigne une colère débordante et intense. « Fureur » conserve cette force dans un registre prophétique naturel; « colère » demeure une possibilité.
- source_word: הַ/יּ֣וֹם הַ/ה֑וּא
  choice: Ce jour-là
  rationale: La construction démonstrative désigne avec insistance le jour précis déjà évoqué; « ce jour-là » est l’équivalent idiomatique français.
- source_word: צָרָ֣ה וּ/מְצוּקָ֗ה
  choice: détresse et angoisse
  rationale: Le premier terme évoque la détresse ou l’adversité, et le second la pression, l’étau ou l’angoisse. Le binôme français préserve le parallélisme et son intensification.
- source_word: שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה
  choice: ruine et dévastation
  rationale: Ces termes proches accumulent les images de destruction catastrophique. Deux noms distincts maintiennent l’effet poétique au lieu de les fondre en une seule idée.
- source_word: חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה
  choice: ténèbres et obscurité
  rationale: חֹשֶׁךְ signifie directement « ténèbres », tandis qu’אֲפֵלָה évoque une obscurité profonde. La formulation garde deux termes parallèles sans surinterpréter leur nuance.
- source_word: עָנָ֖ן וַ/עֲרָפֶֽל
  choice: nuée et obscurité profonde
  rationale: עָנָן est ici au singulier et se prête au terme poétique « nuée ». עֲרָפֶל peut désigner une obscurité dense ou une masse nuageuse sombre; « obscurité profonde » conserve sa force et son ambiguïté atmosphérique.
theological_decisions:
- issue: Portée du « jour » dans le langage prophétique du jugement
  choice: Conserver la répétition « un jour de… » sans préciser si ce jugement a un accomplissement uniquement historique ou uniquement eschatologique.
  alternative: Identifier explicitement ce jour soit au seul jugement historique de Juda, soit au seul jugement eschatologique final.
  rationale: L’hébreu accumule des descriptions poétiques sans trancher lui-même entre une portée proche, typologique ou finale. La traduction doit préserver cette tension.
translation_notes:
  register: Français international actuel, solennel et poétique. La répétition anaphorique de « un jour de » reproduit la structure insistante de l’hébreu. « Nuée » apporte une dignité prophétique tout en restant compréhensible; les couples synonymiques sont maintenus pour préserver l’accumulation sonore et sémantique.
