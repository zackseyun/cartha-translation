base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/009.yaml
  text: And on that day I will punish all who leap over the threshold[b][a], who fill their masters’ house with violence and deceit.
translation:
  language: fr
  text: En ce jour-là, je punirai tous ceux qui sautent par-dessus le seuil[a] et qui remplissent la maison de leurs maîtres[b] de violence et de tromperie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui bondissent par-dessus le seuil ». L’expression peut désigner une pratique rituelle ou superstitieuse connue, peut-être en écho au tabou du seuil évoqué en 1 Samuel 5.5; d’autres y voient une image d’intrus agressifs.
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : « la maison de leurs maîtres ». Certaines traductions comprennent « la maison de leur seigneur » ou « la maison de leur maître ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: j’interviendrai contre
  rationale: Dans ce contexte prophétique de jugement, פקד exprime une intervention pour demander des comptes et punir. « J’interviendrai contre » conserve cette force judiciaire sans réduire le verbe à la seule exécution d’une peine.
- source_word: הַדּוֹלֵג עַל הַמִּפְתָּן
  choice: ceux qui sautent par-dessus le seuil
  rationale: La formulation garde l’image concrète et l’opacité du texte hébreu, sans décider s’il s’agit d’un rite, d’une superstition ou d’une intrusion violente.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule prophétique naturelle en français, qui conserve la référence au jour annoncé du jugement.
- source_word: הַמְמַלְאִים
  choice: ceux qui remplissent
  rationale: Le participe substantivé désigne les personnes caractérisées par cette conduite; la reprise par « ceux qui » rend clairement cette valeur.
- source_word: בֵּית אֲדֹנֵיהֶם
  choice: la maison de leurs maîtres
  rationale: Le pluriel « leurs maîtres » reflète la morphologie hébraïque et évite d’introduire sans fondement un référent divin singulier.
- source_word: חָמָס
  choice: violence
  rationale: Équivalent direct qui peut englober ici la brutalité, l’oppression et l’injustice violente.
- source_word: מִרְמָה
  choice: tromperie
  rationale: Terme français courant et digne qui conserve la portée générale de fraude, ruse ou duplicité.
theological_decisions:
- issue: Sens de « sauter par-dessus le seuil »
  choice: Conserver littéralement l’action concrète dans le texte principal.
  alternative: Y voir explicitement un rite superstitieux lié au seuil, une allusion à 1 Samuel 5.5, ou l’image d’intrus violents.
  rationale: Le texte ne précise pas la nature de la pratique; la traduction préserve donc son ambiguïté historique et interprétative.
- issue: Référent de « la maison de leurs maîtres »
  choice: Rendre le pluriel hébreu par « leurs maîtres ».
  alternative: « la maison de leur maître » ou « la maison de leur Seigneur »
  rationale: La forme hébraïque favorise le pluriel possessif, probablement dans un cadre social. Employer « Seigneur » orienterait indûment le passage vers un référent divin.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la reprise participiale du texte hébreu. « J’interviendrai contre » exprime le jugement tout en maintenant la largeur sémantique de פקד; l’expression énigmatique concernant le seuil reste non résolue dans le corps du verset.
