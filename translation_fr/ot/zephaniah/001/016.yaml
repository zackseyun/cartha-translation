id: ZEP.1.16
reference: Zephaniah 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: י֥וֹם שׁוֹפָ֖ר וּ/תְרוּעָ֑ה עַ֚ל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וְ/עַ֖ל הַ/פִּנּ֥וֹת הַ/גְּבֹהֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/016.yaml
  text: a day of trumpet and battle cry against the fortified cities and against the high battlements[a][b].
translation:
  language: fr
  text: un jour de sonnerie de trompette et de cri de guerre contre les villes fortifiées et contre les hautes fortifications d’angle[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sonnerie de trompette et de signal d’alarme », ou « de sonnerie de trompette et de clameur ». Le terme hébreu traduit par « cri de guerre » peut désigner une forte clameur, un signal d’alarme ou un cri guerrier ; le sens militaire est privilégié en raison du contexte d’attaque contre des villes fortifiées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les angles élevés ». Il s’agit probablement des ouvrages défensifs élevés situés aux angles des murailles d’une ville, peut-être des tours d’angle.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹם
  choice: un jour de
  rationale: Cette formulation poursuit naturellement la série de descriptions apposées du jour de l’Éternel dans le contexte immédiat.
- source_word: שׁוֹפָר
  choice: sonnerie de trompette
  rationale: Le terme désigne ici l’instrument à vent employé pour donner un signal ou l’alarme. « Sonnerie de trompette » exprime naturellement en français le son entendu ce jour-là.
- source_word: תְרוּעָה
  choice: cri de guerre
  rationale: Le mot peut désigner une clameur, un signal d’alarme ou un cri guerrier. Le contexte d’une attaque contre des villes fortifiées favorise le sens militaire.
- source_word: עַל
  choice: contre
  rationale: Dans cette scène d’assaut, « contre » rend clairement la valeur hostile de la préposition.
- source_word: הֶעָרִים הַבְּצֻרוֹת
  choice: les villes fortifiées
  rationale: Rendu direct et idiomatique de villes rendues sûres par des ouvrages défensifs.
- source_word: הַפִּנּוֹת הַגְּבֹהוֹת
  choice: les hautes fortifications d’angle
  rationale: Littéralement « les angles élevés ». Dans le contexte militaire, les angles désignent vraisemblablement, par métonymie, les ouvrages défensifs élevés situés aux angles des murailles, sans qu’il soit nécessaire de préciser qu’il s’agit de tours.
theological_decisions: []
