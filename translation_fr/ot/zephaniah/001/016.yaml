  register: Français international moderne, digne et accessible. La cadence nominale de l’hébreu est conservée, tandis que « sonnerie de trompette » et « fortifications d’angle » rendent l’image militaire intelligible sans supprimer les ambiguïtés lexicales, lesquelles sont signalées en notes.
