language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל צְפַנְיָה֙ בֶּן כּוּשִׁ֣י בֶן גְּדַלְיָ֔ה בֶּן אֲמַרְיָ֖ה בֶּן חִזְקִיָּ֑ה בִּ/ימֵ֛י יֹאשִׁיָּ֥הוּ בֶן אָמ֖וֹן מֶ֥לֶךְ יְהוּדָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/001.yaml
  text: 'The word of Yahweh that came to Zephaniah son of Cushi[a], son of Gedaliah, son of Amariah, son of Hezekiah, in the days of Josiah son of Amon[b], king of Judah:'
translation:
  language: fr
  text: 'La parole de Yahweh qui fut adressée à Sophonie, fils de Koushi[a], fils de Guedalia, fils d’Amaria, fils d’Ézéchias[b], au temps de Josias, fils d’Amon, roi de Juda :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Koushi peut aussi être compris comme « Koushite » ; il est rendu ici comme un nom propre au sein de la généalogie.
    reason: lexical_alternative
  - marker: b
    text: Ézéchias désigne peut-être le roi Ézéchias, ce qui ferait de Sophonie un descendant de la famille royale, mais le texte ne l’identifie pas explicitement comme roi.
    reason: cross_reference
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: Parole de Yahweh
  rationale: Conserve la formule prophétique hébraïque et rend le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: qui fut adressée à
  rationale: Expression française naturelle pour la formule prophétique indiquant qu’une parole divine est parvenue au prophète.
- source_word: צְפַנְיָה
  choice: Sophonie
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom du prophète.
- source_word: בֶּן
  choice: fils de
  rationale: Reproduit sans l’élargir la formule généalogique répétée du texte hébreu.
- source_word: כּוּשִׁי
  choice: Koushi
  rationale: Le mot occupe ici la place d’un nom propre dans la généalogie; la possibilité d’un sens ethnique est maintenue en note.
- source_word: גְּדַלְיָה
  choice: Guedalia
  rationale: Forme française courante du nom propre hébreu.
- source_word: אֲמַרְיָה
  choice: Amaria
  rationale: Transcription française courante du nom propre hébreu.
- source_word: חִזְקִיָּה
  choice: Ézéchias
  rationale: Forme française traditionnelle du nom, sans ajouter le titre de roi absent du texte.
- source_word: בִּימֵי
  choice: au temps de
  rationale: Rend naturellement l’expression temporelle hébraïque « dans les jours de » sans présumer qu’elle désigne uniquement la durée du règne.
- source_word: יֹאשִׁיָּהוּ
  choice: Josias
  rationale: Forme française traditionnelle du nom royal.
- source_word: אָמֹון
  choice: Amon
  rationale: Forme française usuelle du nom propre.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Traduction directe et idiomatique du titre et du territoire.
theological_decisions:
- issue: Identification possible d’Ézéchias avec le roi Ézéchias
  choice: Garder simplement « Ézéchias » dans le texte principal.
  alternative: Préciser « le roi Ézéchias » et présenter Sophonie comme membre de la lignée royale.
  rationale: Le personnage peut être le roi bien connu, mais le texte hébreu ne lui attribue ici aucun titre. La note conserve la possibilité sans transformer une déduction historique en affirmation du texte.
translation_notes:
  register: Français moderne, clair et digne. La tournure d’ouverture conserve la solennité concise d’un titre prophétique. Les noms suivent leurs formes françaises bibliques usuelles, tandis que Yahweh est maintenu comme nom divin.
