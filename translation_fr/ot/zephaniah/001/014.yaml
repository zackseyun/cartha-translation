source:
  edition: WLC
  text: קָר֤וֹב יוֹם יְהוָה֙ הַ/גָּד֔וֹל קָר֖וֹב וּ/מַהֵ֣ר מְאֹ֑ד ק֚וֹל י֣וֹם יְהוָ֔ה מַ֥ר צֹרֵ֖חַ שָׁ֥ם גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/014.yaml
  text: 'The great day of Yahweh is near—near and coming very quickly. The sound of the day of Yahweh: there the warrior cries out bitterly.'
translation:
  language: fr
  text: 'Le grand jour de Yahweh est proche — il est proche et vient très vite. Le bruit[a] du jour de Yahweh : là, le guerrier pousse des cris amers.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le son », « la voix » ou « le fracas » ; le mot hébreu peut désigner un son, une voix ou un bruit.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Le guerrier crie là avec amertume. »'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרוֹב
  choice: est proche
  rationale: L’adjectif prédicatif exprime l’imminence. Sa répétition en français conserve l’insistance de l’hébreu.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: Cette formulation conserve l’expression prophétique et la relation génitivale du texte hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte plutôt que de lui substituer un titre.
- source_word: הַגָּדוֹל
  choice: grand
  rationale: L’adjectif signifie « grand » ; la traduction n’ajoute pas ici une qualification telle que « terrible ».
- source_word: וּמַהֵר מְאֹד
  choice: et vient très vite
  rationale: Cette tournure française naturelle rend à la fois le mouvement implicite et la forte idée de rapidité.
- source_word: קוֹל
  choice: le fracas
  rationale: Dans cette scène de jugement, « fracas » rend naturellement le bruit saisissant évoqué par קוֹל, tout en signalant en note l’éventail lexical possible.
- source_word: מַר
  choice: amers
  rationale: L’adjectif hébreu qualifie ici la manière ou la nature du cri ; « des cris amers » est idiomatique en français et en conserve la charge émotionnelle.
- source_word: צֹרֵחַ
  choice: pousse des cris
  rationale: Le participe désigne un cri intense et prolongé ; cette expression est naturelle et digne en français moderne.
- source_word: שָׁם
  choice: là
  rationale: Le sens spatial ordinaire de l’adverbe est maintenu sans le transformer en indication temporelle.
- source_word: גִּבּוֹר
  choice: même le guerrier
  rationale: '« Guerrier » convient au combattant puissant évoqué. « Même » explicite avec retenue l’effet contextuel : celui qui est normalement fort crie lui aussi, sans modifier l’identité du personnage.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel divin. « Yahweh » le représente directement et distingue le nom d’un titre.
- issue: Interprétation de גִּבּוֹר dans la dernière proposition
  choice: même le guerrier pousse des cris amers
  alternative: l’homme puissant crie là avec amertume
  rationale: « Guerrier » conserve l’image martiale probable. L’ajout discret de « même » fait ressortir le contraste contextuel sans imposer une affirmation théologique supplémentaire ; la note garde une traduction plus formelle de la proposition.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de « proche » reproduit l’urgence du texte, tandis que le point d’exclamation rend la brusquerie de la proposition nominale hébraïque. Les marqueurs [a] et [b] figurent dans le texte principal.
