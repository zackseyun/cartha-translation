  source_fidelity: Le texte rend avec fidélité les deux groupes visés par l’accusatif hébreu, les prosternations sur les toits devant « l’armée du ciel », puis la double prestation de serment. « Se prosterner devant » exprime naturellement en français l’orientation cultuelle de ל sans réduire le geste à une simple inclinaison. La répétition de « se prosternent » et de « jurent » conserve la structure participiale et l’insistance du verset.
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. « Sur les toits », « l’armée du ciel » et « jurer par » sont idiomatiques dans ce contexte. La reprise « ceux qui se prosternent, qui jurent » est un peu solennelle, mais elle est naturelle et justifiée par le parallélisme de l’original.
  terminology: « Yahvé » est une forme française établie du tétragramme. « Milkom » est une translittération recevable du nom divin ammonite et la note conserve correctement les lectures concurrentes « leur roi » et « Molek » (Moloch), sans les confondre ni les imposer. L’ancre [a] est placée sur Milkom, le terme concerné.
