source:
  edition: WLC
  text: וְ/אֶת הַ/מִּשְׁתַּחֲוִ֥ים עַל הַ/גַּגּ֖וֹת לִ/צְבָ֣א הַ/שָּׁמָ֑יִם וְ/אֶת הַ/מִּֽשְׁתַּחֲוִים֙ הַ/נִּשְׁבָּעִ֣ים לַֽ/יהוָ֔ה וְ/הַ/נִּשְׁבָּעִ֖ים בְּ/מַלְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/005.yaml
  text: those who bow down on the rooftops to the host of heaven[a], and those who bow down, who swear by Yahweh and swear by Milcom.
translation:
  language: fr
  text: ceux qui se prosternent sur les toits devant l’armée du ciel, et ceux qui se prosternent, qui jurent par Yahvé et jurent par Milkom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur roi » ; certains comprennent ici le nom « Molek » (Moloch).
    reason: La forme hébraïque מַלְכָּם peut être analysée de plusieurs manières ; la note préserve les principales lectures sans masquer l’ambiguïté textuelle et interprétative.
lexical_decisions:
- source_word: הַמִּשְׁתַּחֲוִים
  choice: ceux qui se prosternent
  rationale: Le participe de שׁחה désigne l’action de s’incliner ou de se prosterner dans un acte cultuel. « Se prosternent » conserve à la fois le geste concret et sa portée religieuse.
- source_word: עַל הַגַּגּוֹת
  choice: sur les toits
  rationale: Traduction locative directe, naturelle en français moderne, qui conserve le cadre des pratiques cultuelles accomplies sur les toits.
- source_word: לִצְבָא הַשָּׁמָיִם
  choice: devant l’armée du ciel
  rationale: L’expression désigne l’ensemble ordonné des corps ou puissances célestes. « L’armée du ciel » demeure proche de l’hébreu et constitue une expression biblique intelligible, sans réduire explicitement le référent aux seules étoiles.
- source_word: הַנִּשְׁבָּעִים לַיהוָה
  choice: qui jurent par Yahvé
  rationale: Dans ce parallélisme, נשׁבע avec ל exprime un serment invoquant Yahvé ou affirmant une allégeance envers lui. « Jurer par » rend naturellement en français l’invocation d’un nom dans un serment et correspond à la construction parallèle suivante.
- source_word: יהוה
  choice: Yahvé
  rationale: La translittération française traditionnelle « Yahvé » représente ici explicitement le nom divin et suit la couche de consultation fournie.
- source_word: בְּמַלְכָּם
  choice: par Milkom
  rationale: Dans cette dénonciation du syncrétisme, la forme consonantique est comprise comme le nom de la divinité ammonite Milkom. Le parallélisme oppose ainsi deux objets d’allégeance invoqués dans des serments, tandis que les autres analyses possibles sont signalées en note.
theological_decisions:
- issue: Identification de מַלְכָּם
  choice: Milkom, divinité étrangère, dans le texte principal
  alternative: « leur roi » ; certains rapprochent aussi la forme de « Molek » (Moloch)
  rationale: 'Le contexte condamne une allégeance religieuse partagée : les mêmes personnes jurent par Yahvé et par une autre puissance. La lecture « Milkom » rend bien ce parallélisme et la polémique contre l’idolâtrie, mais la forme hébraïque permet aussi l’analyse « leur roi » et a été rapprochée de Molek ; ces possibilités sont donc conservées en note.'
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « ceux qui se prosternent » ainsi que le double « jurent » reproduisent l’insistance et le parallélisme de l’hébreu. « Sur les toits » reste concret, tandis que « l’armée du ciel » conserve l’expression collective sans l’identifier de façon trop restrictive.
