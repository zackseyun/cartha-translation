  source_fidelity: Le texte rend fidèlement la répétition emphatique de אָסֵף par « je ferai disparaître », les catégories créées (humains, bêtes, oiseaux, poissons), puis le retranchement final de l’humanité. « Les causes de chute avec les méchants » maintient avec prudence la relation syntaxiquement condensée et discutée entre הַמַּכְשֵׁלוֹת et הָרְשָׁעִים, sans la résoudre de manière interprétative. « De la surface du sol » rend bien אַדָמָה, distinct de « terre » au sens plus large.
