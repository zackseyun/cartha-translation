  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָסֵ֨ף אָדָ֜ם וּ/בְהֵמָ֗ה אָסֵ֤ף עוֹף הַ/שָּׁמַ֨יִם֙ וּ/דְגֵ֣י הַ/יָּ֔ם וְ/הַ/מַּכְשֵׁל֖וֹת אֶת הָ/רְשָׁעִ֑ים וְ/הִכְרַתִּ֣י אֶת הָ/אָדָ֗ם מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/003.yaml
  text: I will sweep away man and beast[a]; I will sweep away the birds of the heavens and the fish of the sea, and the stumbling blocks with the wicked[d][c][b]. And I will cut off man from the face of the ground,” declares Yahweh.
translation:
  language: fr
  text: « Je ferai disparaître les humains et les bêtes[a] ; je ferai disparaître les oiseaux du ciel et les poissons de la mer, ainsi que les causes de chute avec les méchants[b]. J’exterminerai les humains de la surface du sol[c] — déclaration de Yahvé. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici des noms au sens collectif : « l’être humain et la bête » ; il s’agit de l’humanité et des animaux.'
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se traduire par « les obstacles avec les méchants » ou être comprise comme rapprochant plus étroitement les causes de chute des méchants. La syntaxe hébraïque est condensée.
    reason: textual_ambiguity
  - marker: c
    text: Ou « de la surface de la terre ». Le mot hébreu désigne proprement le sol et peut faire écho à d’anciens récits de jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֵף
  choice: je ferai disparaître
  rationale: Dans ce contexte de jugement, le hiphil de אסף exprime l’enlèvement total plutôt qu’un simple rassemblement. « Faire disparaître » rend naturellement cette force en français et permet de conserver la répétition.
- source_word: אָדָם / הָאָדָם
  choice: les humains
  rationale: אָדָם a ici un sens collectif désignant l’humanité. « Les humains » est clair en français moderne et évite que « l’homme » soit compris comme ne visant que le sexe masculin.
- source_word: בְהֵמָה
  choice: les bêtes
  rationale: Le terme désigne collectivement les animaux terrestres, en contraste avec les oiseaux et les poissons. « Bêtes » convient au registre prophétique et à l’ampleur cosmique de l’énumération.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: Expression française naturelle qui conserve la catégorie des créatures aériennes et l’écho au langage de la création.
- source_word: דְגֵי הַיָּם
  choice: les poissons de la mer
  rationale: Traduction directe qui maintient la progression terre-ciel-mer.
- source_word: הַמַּכְשֵׁלוֹת
  choice: les causes de chute
  rationale: Le nom désigne ce qui fait trébucher, concrètement ou moralement. « Causes de chute » reste intelligible sans préciser indûment s’il s’agit d’objets, d’idoles ou d’occasions de péché.
- source_word: אֶת הָרְשָׁעִים
  choice: avec les méchants
  rationale: La construction est condensée et son rapport avec « les causes de chute » demeure incertain. « Avec les méchants » conserve cette association sans imposer une apposition ou une identification.
- source_word: וְהִכְרַתִּי
  choice: j’exterminerai
  rationale: Le hiphil de כרת signifie ici retrancher ou supprimer par le jugement. « Exterminer » exprime clairement la gravité de la menace en français courant et soutenu.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface du sol
  rationale: Cette formulation rend l’idiome hébreu tout en distinguant אֲדָמָה, le sol ou la terre ferme, du terme plus général pour le monde. Elle peut aussi laisser percevoir un écho aux récits anciens de jugement.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahvé
  rationale: La formule nominale conserve la solennité de l’oracle prophétique, tandis que « Yahvé » représente en français le nom divin יהוה.
theological_decisions:
- issue: Sens collectif de אָדָם
  choice: les humains
  alternative: l’homme
  rationale: Le mot désigne ici toute l’humanité sous le jugement. Le pluriel français communique ce sens collectif sans restreindre la référence aux hommes de sexe masculin.
- issue: Rapport entre הַמַּכְשֵׁלוֹת et הָרְשָׁעִים
  choice: les causes de chute avec les méchants
  alternative: les causes de chute, c’est-à-dire les méchants
  rationale: La syntaxe hébraïque est serrée et permet plusieurs analyses. La traduction ne fait pas des méchants l’explication certaine des causes de chute et préserve donc la tension du texte.
- issue: Transcription du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. Sa transcription permet de conserver le caractère personnel du nom d’alliance plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « je ferai disparaître » reproduit la cadence hébraïque. Le point-virgule organise la longue énumération, et le tiret introduit naturellement la formule prophétique finale.
