  text: וְ/אֶת הַ/נְּסוֹגִ֖ים מֵ/אַחֲרֵ֣י יְהוָ֑ה וַ/אֲשֶׁ֛ר לֹֽא בִקְשׁ֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א דְרָשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/006.yaml
  text: and those who turn back from following Yahweh[c][b][a], and who do not seek Yahweh or inquire of him.
translation:
  language: fr
  text: et ceux qui se détournent de suivre Yahweh[a], et ceux qui ne cherchent pas Yahweh ni ne le consultent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh est la transcription du nom divin YHWH.
    reason: alternative_reading
  - marker: b
    text: Le dernier verbe peut aussi être rendu par « ne le recherchent pas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּסוֹגִים
  choice: ceux qui se détournent
  rationale: Le participe de סוג évoque le fait de reculer, de se retirer ou de revenir en arrière. « Ceux qui se détournent » exprime naturellement en français l’abandon de la fidélité à Yahweh, sans recourir au terme ecclésiastique plus marqué « apostats ».
- source_word: מֵאַחֲרֵי יְהוָה
  choice: de Yahweh
  rationale: Littéralement « de derrière Yahweh », cette tournure désigne ceux qui cessent de le suivre. Avec « se détournent », le complément « de Yahweh » rend l’expression idiomatique sans répéter artificiellement l’idée de mouvement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בִקְשׁוּ
  choice: cherchent
  rationale: בקש signifie couramment « chercher ». La formule « chercher Yahweh » garde ici sa portée relationnelle et religieuse.
- source_word: דְרָשֻׁהוּ
  choice: le consultent
  rationale: דרש peut signifier chercher, rechercher ou consulter. Après בקש, « le consultent » préserve un terme distinct et fait ressortir l’idée de recourir à Yahweh pour obtenir sa direction, sans nier le chevauchement sémantique des deux verbes.
- source_word: וַאֲשֶׁר לֹא... וְלֹא
  choice: ceux qui ne… pas… et ne… pas
  rationale: La seconde proposition relative coordonne un autre groupe ou une autre caractérisation dans l’énumération. La reprise de « ceux qui » est naturelle en français et les deux négations sont maintenues.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » en préserve le caractère personnel sans remplacer le nom par un titre.
- issue: Rapport entre בקש et דרש
  choice: chercher et consulter
  alternative: chercher et rechercher
  rationale: Les deux verbes ont des sens voisins et renforcent ensemble l’accusation de négligence envers Dieu. Les distinguer en français conserve la richesse rhétorique du texte, sans en faire deux démarches théologiquement séparées.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation évite le terme confessionnel « apostats » et conserve la coordination ainsi que la proximité de sens des deux derniers verbes.
