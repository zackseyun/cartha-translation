revisions:
- from: Ni leur argent ni leur or ne pourront les délivrer au jour de la fureur de Yahweh. Toute la terre[a] sera dévorée par le feu de sa jalousie[b], car il anéantira tous les habitants de la terre, entièrement et soudainement[c].
  to: Ni leur argent ni leur or ne pourront les délivrer au jour de la fureur de Yahweh. Toute la terre[a] sera consumée par le feu de sa jalousie[b], car il fera subir à tous les habitants de la terre une destruction totale, oui, soudaine[c].
  rationale: La révision maintient tous les choix lexicaux principaux tout en rétablissant, dans la dernière proposition, la destruction complète comme complément mis en relief plutôt que comme une simple manière d’« anéantir ». « Soudaine » reste un choix prudent pour le terme difficile נִבְהָלָה, et les autres possibilités demeurent explicitement signalées en note.
