  text: גַּם כַּסְפָּ֨/ם גַּם זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה וּ/בְ/אֵשׁ֙ קִנְאָת֔/וֹ תֵּאָכֵ֖ל כָּל הָ/אָ֑רֶץ כִּֽי כָלָ֤ה אַךְ נִבְהָלָה֙ יַֽעֲשֶׂ֔ה אֵ֥ת כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/018.yaml
  text: Neither their silver nor their gold will be able to deliver them on the day of Yahweh’s wrath[a], and in the fire of his jealousy all the earth will be consumed; for he will make a complete, indeed sudden[c][b], end of all the inhabitants of the earth.
translation:
  language: fr
  text: Ni leur argent ni leur or ne pourront les délivrer au jour de la fureur de Yahweh. Toute la terre[a] sera consumée par le feu de sa jalousie[b], car il fera subir à tous les habitants de la terre une destruction totale, oui, soudaine[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le pays » et, plus loin, « tous les habitants du pays ». Le mot hébreu peut désigner un pays particulier ou la terre entière.
    reason: alternative_reading
  - marker: b
    text: Ou « le feu de son zèle ». Le terme hébreu peut exprimer la jalousie ou le zèle.
    reason: lexical_alternative
  - marker: c
    text: 'L’expression hébraïque est difficile. Elle évoque une destruction complète, intensifiée par un terme qui peut aussi suggérer ce qui est terrifiant ou précipité. Autres traductions possibles : « une destruction totale, oui, terrifiante » ou « une fin complète, oui, effroyable ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: גַּם ... גַּם ... לֹא
  choice: Ni… ni… ne
  rationale: Avec la négation, la construction coordonnée exclut avec insistance l’argent comme l’or; « ni… ni… ne » est la tournure française naturelle.
- source_word: כַּסְפָּם / זְהָבָם
  choice: leur argent / leur or
  rationale: Associé à l’or, כֶּסֶף désigne ici l’argent comme métal précieux et, avec זָהָב, représente leurs richesses.
- source_word: יוּכַל לְהַצִּילָם
  choice: ne pourront les délivrer
  rationale: La formulation exprime l’incapacité de leurs richesses à les soustraire au jugement; « délivrer » conserve la portée concrète du verbe.
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: au jour de la fureur de Yahweh
  rationale: עֶבְרָה désigne une colère intense; « fureur » convient au registre prophétique, tandis que le nom divin est translittéré « Yahweh ».
- source_word: וּבְאֵשׁ קִנְאָתוֹ
  choice: par le feu de sa jalousie
  rationale: קִנְאָה peut exprimer la jalousie ou le zèle. « Jalousie » maintient ici la dimension relationnelle et exclusive de l’alliance.
- source_word: תֵּאָכֵל
  choice: sera dévorée
  rationale: Le passif hébreu prolonge l’image du feu qui consume; « dévorée » en garde la vigueur en français.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: אֶרֶץ peut désigner le pays ou la terre entière. La portée englobante de la déclaration favorise « terre », sans effacer l’autre lecture possible.
- source_word: כָּלָה אַךְ נִבְהָלָה
  choice: entièrement et soudainement
  rationale: L’expression hébraïque difficile annonce une fin complète et intensifiée. La formulation adverbiale française s’intègre naturellement au verbe « anéantira », tandis qu’une note conserve les autres analyses possibles de נִבְהָלָה.
- source_word: יַעֲשֶׂה אֵת כָּל יֹשְׁבֵי הָאָרֶץ
  choice: il anéantira tous les habitants de la terre
  rationale: Littéralement, Yahweh « fera une fin » des habitants. « Anéantira » exprime idiomatiquement en français cette destruction complète.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le langage totalisant et la répétition de « tous les habitants » favorisent une portée universelle, tout en laissant ouverte dans la note la lecture régionale liée au contexte immédiat de Juda.
- issue: Sens de קִנְאָה appliqué à Dieu
  choice: jalousie
  alternative: zèle
  rationale: « Jalousie » préserve la tension relationnelle et l’exclusivité de l’alliance; « zèle » demeure lexicalement possible et figure en note.
- issue: Interprétation de נִבְהָלָה
  choice: soudainement
  alternative: d’une manière terrifiante
  rationale: Le mot difficile peut évoquer la précipitation ou l’effroi. Le texte principal retient l’idée d’une fin soudaine sans exclure l’autre nuance, signalée en note.
translation_notes:
  register: Français international moderne, digne et direct. La structure est légèrement réorganisée pour éviter une coordination lourde, tout en conservant les images du jour de fureur, du feu et de l’anéantissement. Les ambiguïtés réelles de אֶרֶץ, קִנְאָה et נִבְהָלָה sont maintenues dans les notes.
