review_pass:
  verdict: revise
  source_fidelity: La première partie rend fidèlement l’incapacité des richesses à sauver, le jour de la fureur de Yahweh et la terre consumée par le feu de sa jalousie. La dernière proposition, toutefois, réduit la construction קשה כָּלָה אַךְ נִבְהָלָה ... יַעֲשֶׂה à de simples adverbes qualifiant « anéantira ». Le texte hébreu met plutôt en avant une « fin/destruction complète », intensifiée par un terme disputé; cette structure et cette difficulté doivent être mieux préservées.
  naturalness: Le français est globalement clair et de registre approprié. « Sera consumée » est un peu plus idiomatique et plus proche de l’image passive du feu que « sera dévorée ». Une formulation explicite de la destruction finale rend aussi la clausule plus lisible sans effacer sa construction emphatique.
  terminology: « Yahweh », « fureur », « jalousie », « terre » et « habitants » sont cohérents avec la source et avec les choix signalés. La note sur אֶרֶץ et celle sur קִנְאָה sont bien ancrées. La note finale doit décrire la difficulté sans présenter « il anéantira totalement » comme si elle reproduisait exactement la structure nominale du texte.
  issues:
  - severity: medium
    issue: La clausule finale ne conserve pas suffisamment l’expression nominale « une fin/destruction complète, oui, ... ».
    rationale: כָּלָה est mis en relief avant le verbe « il fera »; « il anéantira ... entièrement et soudainement » en donne le sens général, mais aplatit la syntaxe et l’emphase du texte, particulièrement importante puisque נִבְהָלָה est disputé.
  - severity: low
    issue: « Sera dévorée » est plus interprétatif que nécessaire.
    rationale: Le passif de אכל avec le feu évoque naturellement ce qui est consumé. « Sera consumée » conserve l’image avec une formulation française plus sobre.
