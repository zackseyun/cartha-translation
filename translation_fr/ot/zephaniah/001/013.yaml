review_pass:
  verdict: revise
  source_fidelity: Le sens matériel de חֵילָם (« richesses ») convient au contexte, et « livrées au pillage » rend bien לִמְשִׁסָּה. La suite prospective est fidèlement rendue. En revanche, « n’en boiront pas le vin » introduit une construction française lourde et détourne légèrement le possessif explicite de יֵינָם (« leur vin »).
  naturalness: Le français est globalement digne et clair. « Leurs maisons à la dévastation » est un calque nominal abrupt, moins naturel en français moderne que la formulation verbale proposée. « Ne boiront pas leur vin » est à la fois plus idiomatique et plus proche de l’hébreu.
  terminology: « Richesses », « pillage », « habiter », « vignes » et « vin » sont appropriés au registre biblique moderne. « Désolation » conserve la force de שְׁמָמָה; « seront réduites à la désolation » exprime explicitement le résultat indiqué par le lamed hébreu.
  issues:
  - severity: medium
    issue: Construction « n’en boiront pas le vin »
    rationale: La tournure est maladroite en français moderne, puisque « en » reprend déjà les vignes et que « le vin » est ensuite exprimé. Le possessif hébreu est rendu plus directement et plus naturellement par « ne boiront pas leur vin ».
  - severity: low
    issue: Calque nominal « leurs maisons à la dévastation »
    rationale: Bien que calqué sur la concision hébraïque, ce groupe elliptique est peu idiomatique en français international moderne. Une formulation verbale conserve le sens résultatif sans obscurité.
