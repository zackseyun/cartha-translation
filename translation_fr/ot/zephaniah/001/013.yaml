  text: וְ/הָיָ֤ה חֵילָ/ם֙ לִ/מְשִׁסָּ֔ה וּ/בָתֵּי/הֶ֖ם לִ/שְׁמָמָ֑ה וּ/בָנ֤וּ בָתִּים֙ וְ/לֹ֣א יֵשֵׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/לֹ֥א יִשְׁתּ֖וּ אֶת יֵינָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/013.yaml
  text: Their wealth will become plunder[a], and their houses a desolation; they will build houses but not inhabit them[b], and plant vineyards but not drink their wine.
translation:
  language: fr
  text: Leurs richesses seront livrées au pillage[a], et leurs maisons seront réduites à la désolation[b] ; ils bâtiront des maisons, mais ne les habiteront pas ; ils planteront des vignes, mais ne boiront pas leur vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs biens » ; le mot hébreu peut aussi signifier « leur force » ou « leur armée », sens moins probable ici.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie une expression nominale très concise, littéralement « leurs maisons pour la désolation », indiquant qu’elles deviendront dévastées et désertées.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: leurs richesses
  rationale: חַיִל peut désigner la force, les ressources, les biens ou une armée. Le parallèle avec les maisons et les vignes favorise ici le sens matériel de « richesses » ou « biens ».
- source_word: לִמְשִׁסָּה
  choice: livrées au pillage
  rationale: Le nom désigne ce qui est pris par pillage. Cette tournure française exprime naturellement le résultat annoncé par la préposition לְ.
- source_word: וּבָתֵּיהֶם לִשְׁמָמָה
  choice: et leurs maisons à la dévastation
  rationale: La formulation nominale conserve la structure ramassée et le parallélisme de l’hébreu, tout en indiquant que les maisons seront dévastées et désertées.
- source_word: וּבָנוּ בָתִּים
  choice: ils bâtiront des maisons
  rationale: Dans la suite prophétique, la forme décrit une action à venir. « Bâtiront » convient au registre biblique moderne sans être archaïque.
- source_word: וְלֹא יֵשֵׁבוּ
  choice: mais ne les habiteront pas
  rationale: ישׁב signifie ici habiter ou demeurer. Le pronom « les », explicité d’après le contexte, produit un français naturel.
- source_word: וְנָטְעוּ כְרָמִים
  choice: ils planteront des vignes
  rationale: « Vignes » est la désignation française naturelle de כְּרָמִים dans ce contexte agricole.
- source_word: וְלֹא יִשְׁתּוּ אֶת יֵינָם
  choice: mais n’en boiront pas le vin
  rationale: La tournure rattache clairement le vin aux vignes plantées et préserve l’idée qu’ils ne jouiront pas de leur récolte.
