source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה ק֤וֹל צְעָקָה֙ מִ/שַּׁ֣עַר הַ/דָּגִ֔ים וִֽ/ילָלָ֖ה מִן הַ/מִּשְׁנֶ֑ה וְ/שֶׁ֥בֶר גָּד֖וֹל מֵ/הַ/גְּבָעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/010.yaml
  text: And on that day[a], declares Yahweh, there will be the sound of a cry from the Fish Gate, and a wail from the Second Quarter[c][b], and a great crash from the hills.
translation:
  language: fr
  text: En ce jour-là, oracle de Yahweh, il y aura des cris venant de la porte des Poissons, une lamentation venant du Deuxième Quartier[a], et un grand fracas venant des collines.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le « Deuxième Quartier » était probablement un quartier de Jérusalem. Hébreu : Mishné, « le second » ou « la seconde partie ».'
    reason: cultural_note
  - marker: b
    text: 'Ou : « une grande destruction » ou « un grand brisement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: En ce jour-là… on entendra
  rationale: La formule prophétique annonce ce qui se produira; « on entendra » rend naturellement la suite de manifestations sonores sans ajouter un événement distinct.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Rend la formule prophétique nominale avec dignité et conserve le nom divin.
- source_word: קוֹל צְעָקָה
  choice: un cri
  rationale: En français, « on entendra un cri » exprime naturellement le sens littéral de « voix/bruit d’un cri » sans lourdeur.
- source_word: מִשַּׁעַר הַדָּגִים
  choice: venant de la porte des Poissons
  rationale: Traite l’expression comme le nom d’une porte de Jérusalem et conserve le pluriel collectif naturel de דָּגִים.
- source_word: וִילָלָה
  choice: un hurlement
  rationale: Évoque un cri prolongé de détresse, conformément au contexte de jugement.
- source_word: מִן הַמִּשְׁנֶה
  choice: venant du Quartier-Neuf
  rationale: Dans ce contexte, הַמִּשְׁנֶה désigne vraisemblablement un quartier de Jérusalem; « Quartier-Neuf » est l’appellation française traditionnelle et intelligible, tout en étant signalée en note.
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: un grand fracas
  rationale: Dans une série de bruits entendus, « fracas » préserve la dimension sonore de שֶׁבֶר tout en suggérant rupture et destruction.
- source_word: מֵהַגְּבָעוֹת
  choice: venant des collines
  rationale: Rend le sens ordinaire du nom et laisse ouverte la question de savoir s’il s’agit des hauteurs urbaines ou du relief environnant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Portée de שֶׁבֶר dans la séquence
  choice: fracas
  alternative: destruction / effondrement
  rationale: Le parallélisme sonore favorise « fracas », mais le terme peut aussi désigner le brisement ou la ruine; cette tension est conservée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation met en relief la formule prophétique sans archaïsme. Les trois éléments sonores sont rendus de façon parallèle.
