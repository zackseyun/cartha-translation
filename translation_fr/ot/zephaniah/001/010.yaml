revisions:
- from: En ce jour-là — déclaration de Yahweh —, on entendra un cri venant de la porte des Poissons, un hurlement venant du Quartier-Neuf[a] et un grand fracas venant des collines.[b]
  to: En ce jour-là, oracle de Yahweh, il y aura des cris venant de la porte des Poissons, une lamentation venant du Deuxième Quartier[a], et un grand fracas venant des collines.[b]
  rationale: La révision corrige le faux sens majeur de « Quartier-Neuf » en « Deuxième Quartier », conserve l'incertitude sur l'identification géographique en note, et emploie une formule prophétique française plus naturelle. « Il y aura » suit de près l'introduction וְהָיָה sans restreindre שֶׁבֶר à un bruit, tandis que « grand fracas » et sa note préservent la nuance de brisement ou de ruine.
