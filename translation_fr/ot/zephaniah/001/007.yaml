source:
  edition: WLC
  text: הַ֕ס מִ/פְּנֵ֖י אֲדֹנָ֣/י יְהוִ֑ה כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה כִּֽי הֵכִ֧ין יְהוָ֛ה זֶ֖בַח הִקְדִּ֥ישׁ קְרֻאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/007.yaml
  text: Be silent before the Lord GOD[a], for the day of Yahweh is near; for Yahweh has prepared a sacrifice; he has consecrated his invited ones.
translation:
  language: fr
  text: Silence devant le Seigneur Yahweh, car le jour de Yahweh est proche ! Car Yahweh a préparé un sacrifice, il a consacré ceux qu’il a invités[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses convives », « ceux qu’il a convoqués » ou « ceux qu’il a appelés ». Dans ce contexte, il s’agit probablement de ceux que Yahweh a convoqués pour le jugement présenté comme un sacrifice.
    reason: Alternative lexicale et ambiguïté contextuelle de קְרֻאָיו.
lexical_decisions:
- source_word: הַס
  choice: Silence
  rationale: L’interjection impose le silence avec une force solennelle et urgente. « Silence » est idiomatique en français et plus direct que « Gardez le silence ».
- source_word: מִפְּנֵי
  choice: devant
  rationale: Dans ce contexte, l’expression signifie « devant » ou « en présence de ». « Devant » est concis et naturel.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יְהוִה et évite l’expression redondante « le Seigneur, le SEIGNEUR ».
- source_word: כִּי
  choice: car
  rationale: Dans les deux occurrences, la conjonction introduit une justification. La répétition de « car » conserve la structure insistante de l’hébreu.
- source_word: קָרוֹב
  choice: est proche
  rationale: Cette formulation simple exprime directement l’imminence annoncée par le texte.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: La traduction maintient l’expression prophétique reconnue tout en rendant explicitement le nom divin.
- source_word: הֵכִין
  choice: a préparé
  rationale: L’accompli hébreu présente la préparation comme déjà réalisée ou certaine, et le verbe convient directement à l’image sacrificielle.
- source_word: זֶבַח
  choice: un sacrifice
  rationale: Le terme cultuel fondamental préserve la métaphore sombre du jugement sans l’expliciter davantage.
- source_word: הִקְדִּישׁ
  choice: a consacré
  rationale: « Consacré » conserve le registre cultuel du verbe, qui signifie rendre saint ou mettre à part.
- source_word: קְרֻאָיו
  choice: ceux qu’il a invités
  rationale: Le participe passif peut désigner des invités, des convoqués ou des appelés. Cette formulation maintient l’image d’un sacrifice pouvant comporter un repas, sans déterminer leur rôle précis.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh, y compris dans le titre composé « le Seigneur Yahweh »
  alternative: le SEIGNEUR ; l’Éternel ; le Seigneur DIEU
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » rend le nom divin sans le remplacer par un titre ; dans אֲדֹנָי יְהוִה, « Seigneur » traduit séparément אֲדֹנָי.
- issue: Interprétation de l’image sacrificielle
  choice: Conserver l’image d’un sacrifice et de personnes invitées et consacrées sans préciser leur identité ni leur rôle
  alternative: Identifier explicitement le sacrifice au massacre de Juda ou les invités à des nations étrangères chargées d’exécuter le jugement
  rationale: Le verset reste délibérément concis. L’identification des participants dépend du contexte et ne doit pas être imposée dans le corps du texte.
translation_notes:
  register: Français international moderne, solennel et direct. L’exclamation après « proche » marque l’urgence prophétique sans ajouter de contenu. La répétition de « car » reflète celle de כִּי et maintient la progression rhétorique du verset.
