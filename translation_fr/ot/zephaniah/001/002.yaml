  text: I will utterly sweep away everything from the face of the earth[a], declares Yahweh.
translation:
  language: fr
  text: « Je balaierai absolument tout de la surface de la terre[a], déclare Yahweh. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Je retirerai complètement toute chose de la surface du sol [ou : du pays] ». L’hébreu emploie une construction verbale emphatique; littéralement : « Rassembler, je rassemblerai. »'
    reason: Alternative lexicale pour l’action de jugement, préservation de l’ambiguïté de אֲדָמָה et explication exacte de la construction emphatique אָסֹף אָסֵף.
lexical_decisions:
- source_word: אָסֹף אָסֵף
  choice: je balaierai entièrement
  rationale: L’infinitif absolu suivi du verbe conjugué de la même racine exprime une action certaine et intensive. Dans cette annonce de jugement, « balaierai entièrement » rend naturellement l’idée d’un enlèvement total, tout en laissant en note le sens plus littéral de « rassembler/enlever ».
- source_word: כֹּל
  choice: tout
  rationale: Employé absolument, le terme exprime ici une totalité sans restriction explicite.
- source_word: מֵעַל פְּנֵי
  choice: de la surface de
  rationale: Cette formulation française restitue clairement l’expression hébraïque désignant ce qui est retiré de dessus la surface de quelque chose.
- source_word: הָאֲדָמָה
  choice: la terre
  rationale: Le contexte d’ouverture et la portée totale de l’annonce favorisent « terre », tout en conservant en note les sens possibles « sol » et « pays ».
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » conserve le caractère solennel et autoritatif de la formule prophétique, et « Yahweh » représente directement le nom divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le translittère au lieu de lui substituer un titre.
- issue: Portée de הָאֲדָמָה
  choice: la terre
  alternative: le sol ; le pays
  rationale: « Terre » convient à l’ampleur apparemment universelle de l’annonce, mais le terme hébreu peut aussi désigner le sol ou un pays; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Balaierai » exprime idiomatiquement le jugement et l’enlèvement total; la note conserve la formulation plus littérale et les principales possibilités lexicales.
