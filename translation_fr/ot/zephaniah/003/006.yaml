  source_fidelity: 'Le texte rend fidèlement la séquence et le parallélisme hébreux : élimination des nations, désolation des « angles »/ouvrages d’angle, rues sans passants, puis villes entièrement dépeuplées. Les parfaits divins sont bien rendus par des passés composés. « Tours d’angle » constitue une interprétation contextuellement plausible de פִּנּוֹתָם et la note conserve explicitement le littéral et l’incertitude. « Sont en ruine » pour le rare נִצְדּוּ est prudent et adéquat.'
