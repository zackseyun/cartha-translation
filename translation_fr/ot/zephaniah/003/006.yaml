  variant: modern international French
source:
  edition: WLC
  text: הִכְרַ֣תִּי גוֹיִ֗ם נָשַׁ֨מּוּ֙ פִּנּוֹתָ֔/ם הֶחֱרַ֥בְתִּי חֽוּצוֹתָ֖/ם מִ/בְּלִ֣י עוֹבֵ֑ר נִצְדּ֧וּ עָרֵי/הֶ֛ם מִ/בְּלִי אִ֖ישׁ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/006.yaml
  text: I have cut off nations[a]; their corner towers are laid waste. I have made their streets desolate, with no one passing through. Their cities are devastated, without a man[c][b], with no inhabitant.
translation:
  language: fr
  text: 'J’ai retranché des nations ; leurs tours d’angle[a] sont dévastées. J’ai rendu leurs rues[b] désertes : personne n’y passe. Leurs villes sont en ruine, sans un homme[c], sans aucun habitant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs angles » ; il pourrait s’agir des fortifications ou des tours situées aux angles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leurs places », « leurs espaces publics ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit « sans un homme » ; l’expression décrit ici une dépopulation complète.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְרַתִּי
  choice: J’ai retranché
  rationale: Le hiphil de כרת exprime ici l’élimination ou la destruction. « Retranché » conserve l’image hébraïque tout en convenant au jugement prononcé par Dieu.
- source_word: גוֹיִם
  choice: des nations
  rationale: גוי désigne couramment des nations ou des peuples ; « nations » convient aux collectivités frappées par le jugement.
- source_word: נָשַׁמּוּ
  choice: sont dévastées
  rationale: Le verbe שמם décrit un état de désolation résultant d’une destruction.
- source_word: פִּנּוֹתָם
  choice: leurs tours d’angle
  rationale: Le mot signifie littéralement « leurs angles » ; dans le cadre de villes détruites, il peut désigner des ouvrages défensifs situés aux angles. La note préserve l’incertitude.
- source_word: הֶחֱרַבְתִּי
  choice: J’ai rendu … désertes
  rationale: Le hiphil de חרב signifie rendre désert ou dévaster. Avec les rues pour complément, cette formulation souligne leur abandon.
- source_word: חוּצוֹתָם
  choice: leurs rues
  rationale: Le pluriel de חוץ peut désigner les rues, les places ou les espaces publics d’une ville. « Rues » est clair en français moderne, avec l’autre possibilité en note.
- source_word: מִבְּלִי עוֹבֵר
  choice: personne n’y passe
  rationale: Cette tournure naturelle exprime l’absence totale de passants et rend la valeur du participe עבר.
- source_word: נִצְדּוּ
  choice: sont en ruine
  rationale: Ce verbe rare est difficile, mais le contexte et le parallélisme indiquent clairement la ruine ou la dévastation des villes ; la traduction évite une précision injustifiée.
- source_word: עָרֵיהֶם
  choice: leurs villes
  rationale: Équivalent courant de עיר dans ce contexte urbain.
- source_word: מִבְּלִי אִישׁ
  choice: sans un homme
  rationale: La traduction garde le masculin singulier explicite de אִישׁ, tandis que la note précise sa portée idiomatique dans cette description d’une dépopulation totale.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sans aucun habitant
  rationale: La formule renforce l’image de villes entièrement dépeuplées ; « aucun habitant » est concis et naturel.
theological_decisions:
- issue: Le terme masculin אִישׁ dans une formule de dépopulation
  choice: sans un homme
  alternative: sans personne
  rationale: Le texte hébreu emploie le nom masculin singulier אִישׁ. Le conserver respecte la forme du texte, sans restreindre indûment le sens puisque la clause suivante, « sans aucun habitant », indique qu’il s’agit d’une absence totale de population.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme en propositions brèves conserve le parallélisme et l’intensification du texte hébreu. Les ambiguïtés de פִּנּוֹתָם et חוּצוֹתָם sont signalées sans alourdir le corps du verset.
