reference: Zephaniah 3:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנְ/נִ֥י עֹשֶׂ֛ה אֶת כָּל מְעַנַּ֖יִ/ךְ בָּ/עֵ֣ת הַ/הִ֑יא וְ/הוֹשַׁעְתִּ֣י אֶת הַ/צֹּלֵעָ֗ה וְ/הַ/נִּדָּחָה֙ אֲקַבֵּ֔ץ וְ/שַׂמְתִּי/ם֙ לִ/תְהִלָּ֣ה וּ/לְ/שֵׁ֔ם בְּ/כָל הָ/אָ֖רֶץ בָּשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/019.yaml
  text: Behold[a], at that time I will deal with all your oppressors, and I will save the lame and gather the outcast[d][c][b], and I will make them a praise and a name in every land where they were put to shame.
translation:
  language: fr
  text: Voici[a], en ce temps-là, j’agirai contre tous ceux qui t’oppriment. Je sauverai celle qui boite et je rassemblerai celle qui a été chassée[b] ; je ferai d’elles un objet de louange et de renom dans tous les pays où elles ont connu la honte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Vois ». Cette formule introduit solennellement une déclaration divine.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la boiteuse » et « celle qui a été chassée ». L’hébreu emploie deux formes féminines singulières, qui personnifient probablement la communauté affligée.
    reason: lexical_alternative
  - marker: c
    text: Ou « sur toute la terre, dans leur honte ». La fin de la phrase hébraïque est difficile ; la traduction principale en donne le sens contextuel probable.
    reason: textual_difficulty
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Cette formule introduit avec solennité une annonce divine. « Voici » en conserve la force prophétique dans un français digne et courant.
- source_word: עֹשֶׂה אֶת כָּל מְעַנַּיִךְ
  choice: j’agirai contre tous ceux qui t’oppriment
  rationale: Le participe עֹשֶׂה signifie littéralement « faisant », mais, avec ces personnes pour objet, l’expression annonce une intervention décisive contre elles. La proposition relative rend naturellement le participe מְעַנַּיִךְ et maintient l’adresse féminine singulière à Sion.
- source_word: בָּעֵת הַהִיא
  choice: en ce temps-là
  rationale: Rendu direct de la formule temporelle prophétique, sans la remplacer par la formule distincte « en ce jour-là ».
- source_word: וְהוֹשַׁעְתִּי
  choice: Je sauverai
  rationale: Le verbe ישׁע exprime ici le salut ou la délivrance dans le cadre du rétablissement du peuple.
- source_word: הַצֹּלֵעָה
  choice: celle qui boite
  rationale: Le féminin singulier est conservé afin de respecter l’image concrète et la personnification probable de la communauté affligée.
- source_word: הַנִּדָּחָה
  choice: celle qui a été chassée
  rationale: Cette formulation garde le féminin singulier et la valeur passive de נדח, qui évoque une personne repoussée, dispersée ou bannie.
- source_word: אֲקַבֵּץ
  choice: je rassemblerai
  rationale: Ce verbe courant du vocabulaire du rétablissement désigne le rassemblement de ceux qui ont été dispersés.
- source_word: וְשַׂמְתִּים לִתְהִלָּה וּלְשֵׁם
  choice: je ferai d’elles un objet de louange et de renom
  rationale: « Faire de » exprime naturellement l’idiome hébreu. « Renom » communique le sens idiomatique de שֵׁם, littéralement « nom », tandis qu’« objet de louange » précise sans surinterpréter la fonction de לִתְהִלָּה.
- source_word: בְּכָל הָאָרֶץ
  choice: dans tous les pays
  rationale: Dans le contexte de dispersion et de rétablissement, הָאָרֶץ peut désigner les différents pays. Une note conserve l’autre lecture possible, « sur toute la terre ».
- source_word: בָּשְׁתָּם
  choice: où elles ont connu la honte
  rationale: La formulation française exprime le sens contextuel probable de la phrase finale difficile, littéralement « dans leur honte », sans en masquer l’incertitude, signalée en note.
theological_decisions:
- issue: Identification de « celle qui boite » et de « celle qui a été chassée »
  choice: Conserver les deux féminins singuliers comme personnifications possibles de la communauté affligée
  alternative: 'Employer des pluriels collectifs : « les boiteux » et « les exilés »'
  rationale: Les formes hébraïques sont au féminin singulier et peuvent personnifier Sion ou désigner collectivement son peuple. Les conserver maintient à la fois l’image individuelle et la portée communautaire sans imposer une identification doctrinale.
- issue: Portée géographique du rétablissement
  choice: dans tous les pays
  alternative: sur toute la terre
  rationale: Le contexte permet une référence distributive aux lieux de dispersion, mais le substantif הָאָרֶץ peut aussi désigner toute la terre. La traduction principale suit le contexte et la note préserve l’ampleur possible de l’autre lecture.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement singulier féminin reflète l’adresse à Sion. La ponctuation répartit les actions divines en deux phrases pour assurer la clarté tout en gardant leur enchaînement. Les images concrètes et les ambiguïtés de la fin du verset sont conservées ou explicitement signalées en notes.
