source:
  edition: WLC
  text: הֵסִ֤יר יְהוָה֙ מִשְׁפָּטַ֔יִ/ךְ פִּנָּ֖ה אֹֽיְבֵ֑/ךְ מֶ֣לֶךְ יִשְׂרָאֵ֤ל יְהוָה֙ בְּ/קִרְבֵּ֔/ךְ לֹא תִֽירְאִ֥י רָ֖ע עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/015.yaml
  text: Yahweh has taken away your judgments[a]; he has turned away your enemy. The King of Israel, Yahweh, is in your midst[b]; you will fear evil no more.
translation:
  language: fr
  text: Yahweh a retiré les jugements prononcés contre toi[a] ; il a écarté ton ennemi. Le roi d’Israël, Yahweh, est au milieu de toi ; tu ne craindras plus le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tes jugements » ; le sens peut aussi être « ta condamnation » ou « les sentences prononcées contre toi ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « le mal » peut désigner le malheur, le désastre ou la calamité.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: a retiré
  rationale: Le hiphil de סור exprime ici l’action d’enlever ou de faire disparaître. Le passé composé convient à cette proclamation prophétique d’une action divine présentée comme accomplie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: מִשְׁפָּטַיִךְ
  choice: les jugements prononcés contre toi
  rationale: Dans cet oracle de restauration adressé à Sion, le terme désigne vraisemblablement les décisions judiciaires défavorables qui pesaient sur elle. Cette formulation explicite la relation implicite en hébreu sans réduire le mot à la seule notion de châtiment.
- source_word: פִּנָּה
  choice: a écarté
  rationale: Le verbe évoque le fait de détourner, dégager ou enlever. Avec « ton ennemi » comme complément, « écarter » rend naturellement l’idée de sa mise à distance.
- source_word: אֹיְבֵךְ
  choice: ton ennemi
  rationale: Le singulier du texte massorétique est conservé, même s’il peut avoir une valeur collective.
- source_word: בְּקִרְבֵּךְ
  choice: au milieu de toi
  rationale: Cette expression conserve l’image spatiale de la présence de Yahweh au sein de Sion, destinataire féminine personnifiée.
- source_word: לֹא תִירְאִי רָע עוֹד
  choice: tu ne craindras plus le mal
  rationale: Le futur rend l’imparfait hébreu dans cette promesse. « Le mal » maintient l’étendue sémantique de רָע, qui peut désigner aussi bien le mal que le malheur ou la calamité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de lui substituer un titre.
- issue: Portée de מִשְׁפָּטַיִךְ dans l’oracle de salut
  choice: les jugements prononcés contre toi
  alternative: tes jugements ; ta condamnation
  rationale: Le contexte indique des décisions judiciaires défavorables désormais retirées, mais le pluriel « jugements » préserve mieux l’ampleur du terme hébreu que le singulier plus interprétatif « condamnation ».
- issue: Sens de רָע dans la dernière proposition
  choice: le mal
  alternative: le malheur ; la calamité
  rationale: Le contexte favorise le sens de malheur subi, mais le mot hébreu reste plus large. Le texte principal conserve cette ambiguïté et la note signale le sens contextuel probable.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement féminin singulier correspond à Sion personnifiée dans le contexte. La syntaxe reste proche du parallélisme hébreu tout en étant naturelle en français.
