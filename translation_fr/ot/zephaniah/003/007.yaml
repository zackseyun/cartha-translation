review_pass:
  verdict: revise
  source_fidelity: Le texte conserve fidèlement l’adresse au féminin singulier à Jérusalem personnifiée, suivie du pluriel pour ses habitants. « Tu me craindras » et « tu accepteras la correction » rendent bien les deux verbes hébreux. La construction difficile relative à ce qui a été décidé contre elle demeure présentée comme telle, et l’alternative concessive est correctement conservée en note.
  naturalness: 'L’ensemble est clair et d’un registre biblique moderne approprié. Toutefois, « corrompre toutes leurs actions » est peu idiomatique en français : on corrompt plus naturellement des personnes, des institutions ou des mœurs. « Pervertir toutes leurs actions » rend naturellement la dégradation active exprimée par le hifil de שחת.'
  terminology: « Correction », « demeure » et « retranchée » sont recevables et maintiennent le registre sans imposer une lecture confessionnelle. « Certainement » convient à la force d’attente de אך. Le changement de nombre entre « sa demeure » et « ils » est préservé.
  issues:
  - severity: medium
    issue: 'Collocation française peu naturelle : « ont corrompu toutes leurs actions ».'
    rationale: Le hifil de שחת exige ici un verbe français qui puisse prendre « actions » comme objet tout en exprimant leur perversion ou leur ruine. « Ont perverti toutes leurs actions » est plus idiomatique et fidèle.
