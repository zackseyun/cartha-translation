  to: 'J’ai dit : « Certainement, tu me craindras, tu accepteras la correction. Alors sa demeure ne serait pas retranchée, conformément à tout ce que j’avais décidé contre elle[a]. » Mais au contraire, ils se sont levés de bon matin[b] et ont perverti toutes leurs actions.'
  rationale: La seule révision nécessaire remplace « ont corrompu » par « ont perverti », afin d’obtenir une collocation française naturelle tout en conservant le sens causatif et moralement négatif de הִשְׁחִיתוּ. Le texte et les notes maintiennent l’ambiguïté syntaxique de la proposition concernant le jugement.
