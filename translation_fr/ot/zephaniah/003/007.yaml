language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָמַ֜רְתִּי אַךְ תִּירְאִ֤י אוֹתִ/י֙ תִּקְחִ֣י מוּסָ֔ר וְ/לֹֽא יִכָּרֵ֣ת מְעוֹנָ֔/הּ כֹּ֥ל אֲשֶׁר פָּקַ֖דְתִּי עָלֶ֑י/הָ אָכֵן֙ הִשְׁכִּ֣ימוּ הִשְׁחִ֔יתוּ כֹּ֖ל עֲלִילוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/007.yaml
  text: I said[a], ‘Surely you will fear me; you will accept correction. Then her dwelling would not be cut off, according to all that I had appointed against her.’ But instead, they rose early[b]; they corrupted all their deeds.
translation:
  language: fr
  text: 'J’ai dit : « Certainement, tu me craindras, tu accepteras la correction. Alors sa demeure ne serait pas retranchée, conformément à tout ce que j’avais décidé contre elle[a]. » Mais au contraire, ils se sont levés de bon matin[b] et ont perverti toutes leurs actions.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « sa demeure ne serait pas retranchée, malgré tout ce que j’avais décidé contre elle ».'
    reason: alternative_reading
  - marker: b
    text: « Se lever de bon matin » est une expression hébraïque qui peut évoquer l’empressement ou la persistance.
    reason: cultural_note
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: J’ai dit
  rationale: Rend directement le parfait à la première personne et conserve l’introduction de la parole divine.
- source_word: אַךְ
  choice: Certainement
  rationale: Exprime ici l’attente assurée de Dieu plutôt qu’une restriction.
- source_word: תִּירְאִי אוֹתִי
  choice: tu me craindras
  rationale: Préserve le sens direct de la crainte de Dieu, qui peut inclure le respect révérencieux, sans l’atténuer.
- source_word: תִּקְחִי מוּסָר
  choice: tu accepteras la correction
  rationale: Formulation française naturelle qui garde la dimension morale et disciplinaire de מוּסָר.
- source_word: וְלֹא יִכָּרֵת
  choice: ne serait pas retranchée
  rationale: Conserve l’image de כרת et exprime la conséquence conditionnelle devenue irréelle dans le contexte.
- source_word: מְעוֹנָהּ
  choice: sa demeure
  rationale: Rend le lieu d’habitation avec le suffixe féminin renvoyant à la ville personnifiée.
- source_word: כֹּל אֲשֶׁר פָּקַדְתִּי עָלֶיהָ
  choice: conformément à tout ce que j’avais décidé contre elle
  rationale: Conserve l’idée d’une décision judiciaire divine sans affirmer que le châtiment avait déjà été exécuté; la syntaxe hébraïque demeure toutefois ambiguë.
- source_word: אָכֵן
  choice: Mais au contraire
  rationale: Marque nettement le contraste entre la réaction attendue et la conduite réelle.
- source_word: הִשְׁכִּימוּ
  choice: ils se sont levés de bon matin
  rationale: Préserve l’expression hébraïque concrète, dont la valeur d’empressement ou de persistance est expliquée en note.
- source_word: הִשְׁחִיתוּ
  choice: ont corrompu
  rationale: Rend la forme causative transitive et la dégradation morale de leurs actes.
- source_word: כֹּל עֲלִילוֹתָם
  choice: toutes leurs actions
  rationale: Expression claire et actuelle qui conserve la portée morale du contexte.
theological_decisions:
- issue: Référent du féminin singulier et passage ultérieur au pluriel
  choice: Le féminin désigne Jérusalem personnifiée, puis le pluriel ses habitants pris collectivement.
  alternative: Le féminin peut désigner plus largement la nation ou la cité sans personnification marquée.
  rationale: La traduction maintient « sa demeure », puis « ils », afin de préserver le changement grammatical du texte hébreu au lieu de l’uniformiser.
- issue: Fonction de la proposition relative au jugement
  choice: 'La proposition est rattachée au résultat conditionnel non réalisé : si la ville avait craint Dieu et accepté la correction, sa demeure n’aurait pas été retranchée conformément aux jugements décidés contre elle.'
  alternative: 'La proposition peut être concessive : « sa demeure ne serait pas retranchée, malgré tout ce que j’avais décidé contre elle ».'
  rationale: L’hébreu est condensé et permet plusieurs analyses. La lecture retenue suit l’enchaînement entre l’attente divine et son démenti, tandis que l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier conserve l’adresse à Jérusalem personnifiée; le passage au pluriel reste visible. « Retranchée » garde l’image judiciaire et biblique de l’hébreu, tandis que la note préserve l’ambiguïté syntaxique de la proposition sur le jugement.
