revisions:
- from: Ses prophètes sont téméraires, hommes perfides ; ses prêtres profanent ce qui est saint[a] et font violence à la loi[b].
  to: Ses prophètes sont des hommes téméraires et perfides ; ses prêtres ont profané ce qui est saint[a] et ont fait violence à la loi[b].
  rationale: La révision améliore la correspondance des formes verbales hébraïques et la fluidité française, sans réduire l’ambiguïté de קֹדֶשׁ ni modifier la référence de תּוֹרָה. L’alternative de la note b est reformulée comme un groupe nominal complet, plutôt que « à l’instruction », puisque la note indique une substitution à « la loi ».
