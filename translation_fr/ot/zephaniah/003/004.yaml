source:
  edition: WLC
  text: נְבִיאֶ֨י/הָ֙ פֹּֽחֲזִ֔ים אַנְשֵׁ֖י בֹּֽגְד֑וֹת כֹּהֲנֶ֨י/הָ֙ חִלְּלוּ קֹ֔דֶשׁ חָמְס֖וּ תּוֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/004.yaml
  text: Her prophets are reckless[a], treacherous men; her priests have profaned the holy[b]; they have done violence to the law.
translation:
  language: fr
  text: Ses prophètes sont des hommes téméraires et perfides ; ses prêtres ont profané ce qui est saint[a] et ont fait violence à la loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire » ou « les choses saintes ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « l’instruction » (hébreu : torah).'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֶיהָ
  choice: ses prophètes
  rationale: Le pluriel construit avec suffixe féminin singulier renvoie à la ville personnifiée ; « ses prophètes » exprime naturellement cette relation.
- source_word: פֹּחֲזִים
  choice: téméraires
  rationale: Le terme évoque une conduite irréfléchie, débridée et moralement instable. « Téméraires » conserve cette idée sans réduire le sens à l’orgueil.
- source_word: אַנְשֵׁי בֹּגְדוֹת
  choice: hommes perfides
  rationale: Littéralement « hommes de trahisons » ; cette formulation française naturelle garde le masculin explicite et caractérise une conduite habituelle de déloyauté.
- source_word: כֹּהֲנֶיהָ
  choice: ses prêtres
  rationale: Le pluriel construit avec suffixe féminin singulier est rendu directement, en parallèle avec « ses prophètes ».
- source_word: חִלְּלוּ
  choice: profanent
  rationale: Au piel et dans ce contexte cultuel, le verbe signifie rendre profane, profaner ou désacraliser.
- source_word: קֹדֶשׁ
  choice: ce qui est saint
  rationale: Le substantif peut désigner la sainteté, les choses saintes ou le sanctuaire. Cette traduction préserve l’étendue de la référence sans la limiter au bâtiment du sanctuaire.
- source_word: חָמְסוּ
  choice: font violence à
  rationale: La tournure conserve l’image forte de violence, de tort et de violation appliquée à la loi, plutôt que de l’aplatir en simple désobéissance.
- source_word: תּוֹרָה
  choice: la loi
  rationale: Dans ce contexte sacerdotal et prophétique, « la loi » exprime bien la référence institutionnelle et covenantale, tandis que « l’instruction » demeure une possibilité lexicale.
theological_decisions:
- issue: Portée de קֹדֶשׁ dans l’accusation contre les prêtres
  choice: référence large à ce qui est saint
  alternative: le sanctuaire ; les choses saintes
  rationale: L’hébreu ne précise pas qu’il s’agit uniquement du bâtiment du sanctuaire. La formulation retenue préserve cette ambiguïté réelle.
- issue: Portée de תּוֹרָה
  choice: la loi
  alternative: l’instruction
  rationale: Le contexte sacerdotal favorise « la loi », mais le terme hébreu peut aussi désigner l’instruction ; cette latitude est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux accusations est conservé ; le présent français donne à l’énoncé une force directe sans imposer une valeur temporelle étrangère au parfait hébreu.
