  timestamp: '2026-07-15T08:53:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les principaux choix lexicaux sont justes : « ses prophètes », « ses prêtres », « ce qui est saint », « faire violence à la loi » rendent bien l’hébreu et préservent la portée non spécifiée de קֹדֶשׁ. Toutefois, les deux verbes appliqués aux prêtres (חִלְּלוּ, חָמְסוּ) sont des parfaits hébreux ; le passé composé français les rend plus directement que le présent, sans surinterpréter leur valeur discursive.'
  naturalness: « Ses prophètes sont téméraires, hommes perfides » est compréhensible mais l’apposition sans déterminant est raide en français international moderne. « Ses prophètes sont des hommes téméraires et perfides » est plus idiomatique et conserve les deux caractérisations.
  terminology: « Profané », « ce qui est saint » et « la loi » sont appropriés dans ce contexte cultuel et juridique. Les notes conservent correctement les alternatives « sanctuaire / choses saintes » et « instruction ».
  issues:
  - severity: medium
    issue: Temps des verbes concernant les prêtres
    rationale: Le projet emploie « profanent » et « font violence », alors que les deux formes hébraïques sont des parfaits. Le passé composé français (« ont profané », « ont fait violence ») reflète mieux l’accusation formulée au parfait, comme le fait aussi la piste d’audit anglaise.
  - severity: low
    issue: Construction appositive après « sont »
    rationale: « Sont téméraires, hommes perfides » est plus littéraire et moins naturel que nécessaire. Une formulation avec « des hommes » rend explicitement אַנְשֵׁי tout en restant fluide.
  revised_text: Ses prophètes sont des hommes téméraires et perfides ; ses prêtres ont profané ce qui est saint[a] et ont fait violence à la loi[b].
  revised_footnotes:
