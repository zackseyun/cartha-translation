id: ZEP.3.2
reference: Zephaniah 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֤א שָֽׁמְעָה֙ בְּ/ק֔וֹל לֹ֥א לָקְחָ֖ה מוּסָ֑ר בַּֽ/יהוָה֙ לֹ֣א בָטָ֔חָה אֶל אֱלֹהֶ֖י/הָ לֹ֥א קָרֵֽבָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/002.yaml
  text: She did not obey the voice[a]; she did not accept correction. She did not trust in Yahweh[d][c][b]; she did not draw near to her God.
translation:
  language: fr
  text: Elle n’a pas obéi à la voix[a], elle n’a pas accepté la correction[b]. Elle n’a pas mis sa confiance en Yahweh[c], elle ne s’est pas approchée de son Dieu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle n’a pas écouté la voix » ou « elle n’a pas tenu compte de la voix ». L’expression hébraïque peut désigner une écoute qui conduit à l’obéissance.
    reason: lexical_alternative
  - marker: b
    text: Ou « elle n’a pas reçu la discipline » ou « elle n’a pas accueilli l’instruction ».
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « YHWH », le nom personnel de Dieu, rendu ici par « Yahweh ».'
    reason: alternative_reading
  - marker: d
    text: Ou « elle ne s’est pas avancée vers son Dieu ». Le verbe peut avoir des résonances à la fois relationnelles et cultuelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה בְּקוֹל
  choice: n’a pas obéi à la voix
  rationale: Avec בְּקוֹל, שׁמע exprime couramment une écoute qui se traduit par l’obéissance. « Obéir à la voix » conserve à la fois la force idiomatique et le complément implicite du texte hébreu.
- source_word: לָקְחָה מוּסָר
  choice: n’a pas accepté la correction
  rationale: L’expression signifie recevoir ou accepter une instruction corrective. « Accepter la correction » est naturel en français actuel et convient au reproche prophétique.
- source_word: בַּיהוָה לֹא בָטָחָה
  choice: n’a pas mis sa confiance en Yahweh
  rationale: בטח désigne la confiance ou l’assurance placée en quelqu’un. Cette formulation rend naturellement en français l’objet introduit par ב et maintient le nom divin.
- source_word: אֶל אֱלֹהֶיהָ לֹא קָרֵבָה
  choice: ne s’est pas approchée de son Dieu
  rationale: קרב avec אֶל exprime ici le fait de s’approcher de Dieu, avec de possibles dimensions relationnelle et cultuelle. Le singulier « son Dieu » correspond à l’usage d’אֱלֹהִים dans ce contexte.
theological_decisions:
- issue: Référent du sujet féminin singulier
  choice: Employer « elle » sans expliciter l’antécédent dans ce verset.
  alternative: « Jérusalem » ou « la ville »
  rationale: Les verbes hébreux sont au féminin singulier et renvoient à la ville personnifiée dans le contexte. Le pronom préserve cette personnification sans ajouter un nom absent du verset.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de l’approche de Dieu
  choice: Conserver la formulation générale « s’est approchée de son Dieu ».
  alternative: « est venue adorer son Dieu »
  rationale: Le verbe peut évoquer aussi bien la proximité relationnelle que l’accès cultuel. Une explicitation par « adorer » réduirait l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination répétée garde le rythme accusateur du texte hébreu. « Mis sa confiance » évite une tournure raide, tandis que « s’est approchée » préserve sans la surinterpréter la portée religieuse du dernier membre.
