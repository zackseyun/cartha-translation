id: ZEP.3.5
reference: Zephaniah 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֤ה צַדִּיק֙ בְּ/קִרְבָּ֔/הּ לֹ֥א יַעֲשֶׂ֖ה עַוְלָ֑ה בַּ/בֹּ֨קֶר בַּ/בֹּ֜קֶר מִשְׁפָּט֨/וֹ יִתֵּ֤ן לָ/אוֹר֙ לֹ֣א נֶעְדָּ֔ר וְ/לֹֽא יוֹדֵ֥עַ עַוָּ֖ל בֹּֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/005.yaml
  text: Yahweh is righteous in her midst; he does no injustice[a]. Morning by morning he brings his justice to light; it does not fail. But the unjust knows no shame.
translation:
  language: fr
  text: Yahweh est juste au milieu d’elle ; il ne commet aucune injustice. Matin après matin, il met sa justice[a] en lumière ; elle ne fait jamais défaut. Mais celui qui est injuste ne connaît pas la honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son jugement ».'
    reason: Alternative lexicale possible pour מִשְׁפָּטוֹ.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: צַדִּיק
  choice: juste
  rationale: Exprime naturellement en français le caractère moralement droit de Yahweh et convient au champ judiciaire dominant dans le verset.
- source_word: בְּקִרְבָּהּ
  choice: au milieu d’elle
  rationale: Conserve le suffixe féminin qui renvoie à la ville personnifiée, Jérusalem.
- source_word: לֹא יַעֲשֶׂה עַוְלָה
  choice: il ne commet aucune injustice
  rationale: Rend clairement la négation absolue de toute conduite injuste de la part de Yahweh.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Matin après matin
  rationale: Reproduit la répétition distributive de l’hébreu et souligne la régularité de l’action.
- source_word: מִשְׁפָּטוֹ
  choice: sa justice
  rationale: Dans ce contexte, le terme désigne l’exercice manifeste de la justice de Yahweh et fait écho à « juste » et « injustice ».
- source_word: יִתֵּן לָאוֹר
  choice: il met sa justice en lumière
  rationale: Préserve l’image hébraïque tout en exprimant naturellement l’idée de rendre manifeste.
- source_word: לֹא נֶעְדָּר
  choice: elle ne fait jamais défaut
  rationale: Rend l’idée d’une justice qui n’est jamais absente et dont la manifestation ne manque pas.
- source_word: וְלֹא יוֹדֵעַ עַוָּל בֹּשֶׁת
  choice: Mais celui qui est injuste ne connaît pas la honte
  rationale: Conserve le contraste avec Yahweh et rend de façon idiomatique l’absence de honte chez l’injuste.
theological_decisions:
- issue: Référent et genre du suffixe dans בְּקִרְבָּהּ
  choice: « au milieu d’elle », en référence à Jérusalem personnifiée
  alternative: « en son sein »
  rationale: Le suffixe hébreu est féminin et le contexte présente la ville comme une personne ; la traduction conserve cette personnification.
- issue: Sens de מִשְׁפָּטוֹ dans le contexte
  choice: « sa justice »
  alternative: « son jugement »
  rationale: « Justice » met en relief le contraste avec l’injustice et le caractère juste de Yahweh, sans exclure la nuance judiciaire signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « Matin après matin » conserve le rythme hébraïque ; la personnification féminine de Jérusalem est maintenue.
