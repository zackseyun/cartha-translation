id: ZEP.3.12
reference: Zephaniah 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִשְׁאַרְתִּ֣י בְ/קִרְבֵּ֔/ךְ עַ֥ם עָנִ֖י וָ/דָ֑ל וְ/חָס֖וּ בְּ/שֵׁ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/012.yaml
  text: But I will leave in your midst a people humble and lowly[a], and they will take refuge in the name of Yahweh.
translation:
  language: fr
  text: Mais je laisserai au milieu de toi un peuple humble et démuni[a], et ils chercheront refuge dans le nom de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un peuple affligé et pauvre » ou « un peuple pauvre et faible ». Les termes hébreux peuvent évoquer l’affliction et la pauvreté sociales aussi bien que l’humilité et une condition modeste.
    reason: 'Alternative lexicale : les deux adjectifs hébreux ont une gamme de sens à la fois sociale et spirituelle.'
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Mais je laisserai
  rationale: Le hiphil de שׁאר exprime le fait de laisser subsister. « Mais » rend le contraste contextuel introduit par le waw, tout en maintenant clairement l’action divine.
- source_word: בְקִרְבֵּךְ
  choice: au milieu de toi
  rationale: L’expression situe le peuple au sein de Sion/Jérusalem, interpellée au féminin singulier.
- source_word: עַם
  choice: un peuple
  rationale: עַם désigne ici une collectivité plutôt qu’une entité politique, ce que rend naturellement « un peuple ».
- source_word: עָנִי
  choice: humble
  rationale: עָנִי peut évoquer l’affliction, la pauvreté ou l’humilité. « Humble » convient au contexte de dépendance envers Yahweh sans exclure la précarité sociale.
- source_word: וָדָל
  choice: et démuni
  rationale: דַּל peut signifier pauvre, faible ou de condition modeste. « Démuni » exprime une situation de faiblesse et de dépendance sans réduire le terme à la seule pauvreté matérielle.
- source_word: וְחָסוּ
  choice: et ils chercheront refuge
  rationale: חסה conserve ici l’image concrète de personnes qui cherchent protection. Le pluriel français reproduit le passage hébreu du collectif singulier « un peuple » au verbe pluriel.
- source_word: בְּשֵׁם
  choice: dans le nom de
  rationale: La formule exprime le recours au caractère, à l’autorité et à la protection associés au nom divin; « dans le nom de » reste transparente et proche de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la politique du projet.
theological_decisions:
- issue: Portée de עָנִי וָדָל dans la description du reste
  choice: « humble et démuni »
  alternative: « affligé et pauvre » ou « pauvre et faible »
  rationale: Le couple de termes peut décrire à la fois une condition sociale pénible et une attitude de dépendance. La traduction principale garde ces deux dimensions en tension, tandis que la note signale les autres lectures possibles.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ou l’Éternel
  rationale: La translittération préserve le nom personnel présent dans le texte hébreu sans lui substituer un titre.
translation_notes:
  register: Français international moderne, sobre et digne. « Au milieu de toi » conserve l’adresse directe à Sion/Jérusalem. La reprise par « ils » maintient le changement de nombre de l’hébreu, qui passe du collectif singulier au pluriel.
