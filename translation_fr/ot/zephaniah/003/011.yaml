source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא לֹ֤א תֵב֨וֹשִׁי֙ מִ/כֹּ֣ל עֲלִילֹתַ֔יִ/ךְ אֲשֶׁ֥ר פָּשַׁ֖עַתְּ בִּ֑/י כִּי אָ֣ז אָסִ֣יר מִ/קִּרְבֵּ֗/ךְ עַלִּיזֵי֙ גַּאֲוָתֵ֔/ךְ וְ/לֹֽא תוֹסִ֧פִי לְ/גָבְהָ֛ה ע֖וֹד בְּ/הַ֥ר קָדְשִֽׁ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/011.yaml
  text: On that day you will not be put to shame because of all your deeds by which you rebelled against me[a], for then I will remove from your midst those who exult in your pride[b], and you will no longer be haughty on my holy mountain.
translation:
  language: fr
  text: En ce jour-là, tu ne seras pas déshonorée à cause de tous les actes par lesquels tu t’es révoltée contre moi[a]. Car alors, j’écarterai de ton milieu ceux qui jubilent de ton orgueil[b], et tu ne t’élèveras plus avec arrogance sur ma montagne sainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu n’auras pas honte ». Le verbe hébreu peut désigner soit le sentiment de honte, soit l’état de déshonneur ou de disgrâce.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux des tiens qui exultent avec orgueil ». L’expression hébraïque désigne des personnes caractérisées par une joie arrogante, mais le rapport exact entre leur exultation et « ton orgueil » reste condensé.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵבֹושִׁי
  choice: tu ne seras pas couverte de honte
  rationale: Le verbe בושׁ peut désigner le fait d’éprouver de la honte ou de subir la honte et le déshonneur. Cette formulation française exprime le résultat objectif dans le contexte du rétablissement de Sion, tout en signalant l’autre nuance en note.
- source_word: מִכֹּל עֲלִילֹתַיִךְ
  choice: à cause de tous les actes
  rationale: Après le verbe de honte, מִן indique ici la cause. « Actes » conserve la portée large de עֲלִילָה, dont la coloration coupable est précisée par la proposition suivante.
- source_word: פָּשַׁעַתְּ בִּי
  choice: par lesquels tu t’es révoltée contre moi
  rationale: פשע exprime une rébellion ou une rupture volontaire, plus précisément qu’un terme générique comme « pécher ». Le féminin s’adresse à Sion ou Jérusalem personnifiée.
- source_word: אָסִיר
  choice: j’ôterai
  rationale: La forme causative exprime l’action d’écarter ou d’enlever. « J’ôterai » est naturel et soutenu dans ce contexte de purification.
- source_word: מִקִּרְבֵּךְ
  choice: du milieu de toi
  rationale: Cette tournure conserve l’image de personnes retirées de la communauté personnifiée, sans réduire le référent à l’intériorité d’un individu.
- source_word: עַלִּיזֵי גַּאֲוָתֵךְ
  choice: ceux qui exultent dans ton orgueil
  rationale: עַלִּיזֵי désigne ceux qui exultent ou jubilent, et גַּאֲוָה porte ici une valeur négative. La formulation garde le rapport construit quelque peu ambigu entre ces personnes et l’orgueil attribué à Sion.
- source_word: וְלֹא תוֹסִפִי לְגָבְהָה עוֹד
  choice: et tu ne t’élèveras plus avec arrogance
  rationale: La construction « ne plus ajouter/continuer à » est rendue idiomatiquement par « ne… plus ». גבה évoque ici l’élévation orgueilleuse plutôt que la hauteur physique.
- source_word: בְּהַר קָדְשִׁי
  choice: sur ma montagne sainte
  rationale: La préposition « sur » convient naturellement à l’image topographique de Sion, montagne consacrée à Dieu.
theological_decisions:
- issue: La promesse initiale nie-t-elle tout sentiment de honte, ou annonce-t-elle la fin du déshonneur lié aux rébellions passées après la purification divine ?
  choice: Le texte annonce que Sion ne restera pas couverte de honte à cause de ses rébellions passées, sans nier leur culpabilité.
  alternative: « Tu n’auras pas honte », compris principalement comme l’absence d’un sentiment intérieur de honte.
  rationale: Les actes de rébellion restent explicitement réels, tandis que la proposition introduite par « car alors » rattache la fin de la honte à l’action purificatrice de Dieu. La traduction maintient ensemble culpabilité passée et rétablissement.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement féminin reflète l’adresse hébraïque à Sion ou Jérusalem personnifiée. Les images de la communauté (« du milieu de toi ») et de l’élévation arrogante sont conservées.
