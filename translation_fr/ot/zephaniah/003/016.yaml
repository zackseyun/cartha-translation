  text: בַּ/יּ֣וֹם הַ/ה֔וּא יֵאָמֵ֥ר לִ/ירֽוּשָׁלִַ֖ם אַל תִּירָ֑אִי צִיּ֖וֹן אַל יִרְפּ֥וּ יָדָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/016.yaml
  text: On that day it will be said to Jerusalem[a], “Do not fear”; to Zion, “Do not let your hands grow weak.”
translation:
  language: fr
  text: 'En ce jour-là, on dira à Jérusalem : « N’aie pas peur ! Sion, que tes mains ne faiblissent pas[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « que tes mains ne retombent pas » ou « que tes mains ne restent pas inertes ». L’expression hébraïque évoque la perte de force, de courage ou de détermination.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Expression temporelle prophétique usuelle, rendue dans un français moderne et digne.
- source_word: יֵאָמֵר
  choice: on dira
  rationale: Le niphal exprime ici une parole dont l’auteur humain n’est pas précisé. Le pronom indéfini « on » conserve naturellement cette indétermination en français.
- source_word: לִירוּשָׁלַם
  choice: à Jérusalem
  rationale: La préposition ל désigne la destinataire de la parole.
- source_word: אַל תִּירָאִי
  choice: N’aie pas peur
  rationale: La forme féminine singulière s’adresse à Jérusalem personnifiée. Cette formulation garde la force de l’exhortation dans un français courant.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Le nom est conservé comme adresse directe, sans ajouter de préposition absente de l’hébreu; la ponctuation française rend clairement le parallélisme avec Jérusalem.
- source_word: אַל יִרְפּוּ יָדַיִךְ
  choice: que tes mains ne faiblissent pas
  rationale: La traduction conserve l’image des mains tout en exprimant l’idée idiomatique de perte de force, de courage ou de résolution.
theological_decisions:
- issue: Personnification féminine singulière de Jérusalem/Sion
  choice: Maintenir l’adresse directe aux villes personnifiées
  alternative: Expliciter « habitants de Jérusalem/Sion »
  rationale: L’hébreu s’adresse directement à Jérusalem et à Sion au féminin singulier. Ne pas remplacer les villes par leurs habitants préserve l’image et évite une expansion interprétative.
- issue: Sujet non exprimé de יֵאָמֵר
  choice: « on dira » sans identifier le locuteur
  alternative: « ils diront » ou désigner explicitement Dieu comme locuteur
  rationale: Le passif hébreu laisse le locuteur indéterminé; la traduction ne doit pas résoudre ce silence.
translation_notes:
  register: Français international moderne, naturel et digne. Tutoiement singulier maintenu pour refléter la personnification féminine de Jérusalem/Sion; image corporelle des mains conservée.
