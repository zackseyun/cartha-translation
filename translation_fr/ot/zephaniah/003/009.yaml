  text: כִּֽי אָ֛ז אֶהְפֹּ֥ךְ אֶל עַמִּ֖ים שָׂפָ֣ה בְרוּרָ֑ה לִ/קְרֹ֤א כֻלָּ/ם֙ בְּ/שֵׁ֣ם יְהוָ֔ה לְ/עָבְד֖/וֹ שְׁכֶ֥ם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/009.yaml
  text: For then I will change the speech of the peoples to a pure speech[c][b][a], so that all of them may call on the name of Yahweh and serve him with one accord.
translation:
  language: fr
  text: Car alors je changerai la langue des peuples en une langue pure[a], afin que tous invoquent le nom de Yahweh[b] et le servent d’un commun accord[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je tournerai vers les peuples une lèvre pure ». L’expression peut désigner des lèvres purifiées, une parole pure ou une langue redevenue pure.'
    reason: lexical_alternative
  - marker: b
    text: Le nom hébreu est YHWH, rendu ici par « Yahweh »; il est traditionnellement rendu en français par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « d’une seule épaule », image d’un service accompli dans l’unité, ou épaule contre épaule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְפֹּךְ
  choice: je donnerai
  rationale: Le verbe signifie littéralement « tourner, changer ». Avec la construction אֶל עַמִּים שָׂפָה בְרוּרָה, « je donnerai aux peuples » exprime naturellement en français l’action divine qui fait passer leur parole à un état pur, sans suggérer la destruction.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel désigne divers groupes humains. « Peuples » conserve mieux cette pluralité que « nations », qui peut évoquer surtout des États.
- source_word: שָׂפָה בְרוּרָה
  choice: des lèvres pures
  rationale: שָׂפָה signifie littéralement « lèvre » et, par métonymie, « parole » ou « langue ». La formulation retient l’image hébraïque tout en indiquant la purification de ce que les peuples prononcent; la note conserve les autres compréhensions possibles.
- source_word: לִקְרֹא ... בְּשֵׁם
  choice: afin qu’ils invoquent ... le nom
  rationale: Avec le nom divin, קרא בְשֵׁם désigne couramment l’invocation cultuelle. « Invoquer le nom » est naturel, précis et garde cette portée religieuse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer silencieusement par un titre.
- source_word: לְעָבְדוֹ
  choice: et le servent
  rationale: עבד peut englober le service et le culte. « Servir » maintient cette amplitude sans réduire le terme aux seuls actes liturgiques.
- source_word: שְׁכֶם אֶחָד
  choice: d’un commun accord
  rationale: L’expression signifie littéralement « d’une seule épaule » et évoque une action unie. L’équivalent français communique clairement cette unité, tandis que l’image originale est signalée en note.
theological_decisions:
- issue: Nature de la transformation promise
  choice: je donnerai aux peuples des lèvres pures
  alternative: je purifierai la parole des peuples; je rendrai aux peuples une langue pure
  rationale: L’hébreu peut viser les lèvres, la parole ou la langue. Le texte principal conserve l’image corporelle sans décider qu’il s’agit du rétablissement d’une langue historique unique; la note rend explicite l’ambiguïté.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » préserve dans le corps du texte le nom propre de l’hébreu. La convention française traditionnelle fondée sur un titre est indiquée en note.
- issue: Portée de שְׁכֶם אֶחָד
  choice: d’un commun accord
  alternative: d’une seule épaule; épaule contre épaule
  rationale: La traduction exprime l’unité du service sans imposer si l’image souligne surtout une intention commune ou un effort collectif concret.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide, tandis que « lèvres pures » garde l’image poétique hébraïque. « D’un commun accord » évite un calque obscur, explicité en note.
