  text: יְהוָ֧ה אֱלֹהַ֛יִ/ךְ בְּ/קִרְבֵּ֖/ך גִּבּ֣וֹר יוֹשִׁ֑יעַ יָשִׂ֨ישׂ עָלַ֜יִ/ךְ בְּ/שִׂמְחָ֗ה יַחֲרִישׁ֙ בְּ/אַ֣הֲבָת֔/וֹ יָגִ֥יל עָלַ֖יִ/ךְ בְּ/רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/017.yaml
  text: Yahweh your God is in your midst[a], a mighty one who saves; he will rejoice over you with gladness; he will be quiet in his love; he will exult over you with singing.
translation:
  language: fr
  text: Yahvé, ton Dieu, est au milieu de toi, puissant pour sauver. Il se réjouira de toi avec joie ; il gardera le silence dans son amour[a] ; il exultera à ton sujet avec des chants de joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il t’apaisera par son amour ». Une autre interprétation, moins probable, est : « il te renouvellera dans son amour ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que son remplacement par un titre.
- source_word: אֱלֹהַיִךְ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne féminine singulière s'adresse collectivement à Sion/Jérusalem ; le singulier français en conserve la forme.
- source_word: בְּקִרְבֵּךְ
  choice: au milieu de toi
  rationale: Conserve la présence localisée de Dieu au cœur de Sion et reste naturel en français biblique moderne.
- source_word: גִּבּוֹר יוֹשִׁיעַ
  choice: puissant pour sauver
  rationale: Rend la force exprimée par גבור et la valeur verbale de יושיע sans imposer plus précisément l'image du guerrier.
- source_word: יָשִׂישׂ עָלַיִךְ בְּשִׂמְחָה
  choice: il se réjouira à ton sujet avec joie
  rationale: Préserve le mouvement de joie dirigé vers Sion et l'expression explicite בשמחה, malgré une légère répétition naturelle au texte.
- source_word: יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: il gardera le silence dans son amour
  rationale: Suit le sens direct de la racine חרש sans ajouter d'objet absent du texte hébreu et maintient la tension de l'expression.
- source_word: יָגִיל עָלַיִךְ בְּרִנָּה
  choice: il exultera à ton sujet avec des chants de joie
  rationale: « Exultera » distingue גיל du verbe précédent, tandis que « chants de joie » rend la dimension vocale et joyeuse de רנה.
theological_decisions:
- issue: Sens de יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: il gardera le silence dans son amour
  alternative: 'il t’apaisera par son amour ; autre interprétation, moins probable : il te renouvellera dans son amour'
  rationale: Le texte hébreu ne donne aucun complément d'objet à יחריש. Le sens intransitif « garder le silence » est donc retenu dans le texte, tandis que les lectures interprétatives connues sont signalées en note.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement singulier conserve l'adresse féminine singulière à Sion/Jérusalem. La formulation maintient les parallélismes et distingue les deux verbes hébreux de réjouissance.
