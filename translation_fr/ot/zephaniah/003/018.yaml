base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/018.yaml
  text: I have gathered those grieving over the appointed festival from you[a]; they were a reproach upon her[c][b], a burden.
translation:
  language: fr
  text: J’ai rassemblé d’auprès de toi ceux qui étaient dans le deuil à cause de la fête solennelle[a] ; ils étaient un fardeau qui pesait sur elle[c], un opprobre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui étaient affligés, loin de l’assemblée festive ». L’hébreu est difficile : il peut s’agir de personnes en deuil parce qu’elles étaient privées de la fête, ou de personnes éloignées de l’assemblée festive.'
    reason: alternative_reading
  - marker: b
    text: 'Le verbe traduit par « j’ai rassemblé » peut avoir le sens de « je rassemblerai » dans ce contexte prophétique. La fin du verset peut aussi se comprendre ainsi : « la honte qui pesait sur elle était un fardeau pour eux ».'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: Le pronom « elle » renvoie vraisemblablement à Sion ou à Jérusalem.
    reason: cross_reference
lexical_decisions:
- source_word: נוּגֵי
  choice: ceux qui étaient dans le deuil
  rationale: Le terme désigne vraisemblablement des personnes endeuillées ou affligées. Cette formulation garde la référence personnelle et la force émotionnelle sans préciser indûment la cause.
- source_word: מִמּוֹעֵד
  choice: à cause de la fête fixée
  rationale: מוֹעֵד peut désigner un moment fixé, une fête ou une assemblée cultuelle. Ici, la restauration de Sion favorise une référence à la fête dont ces personnes étaient privées, mais la préposition reste ambiguë.
- source_word: אָסַפְתִּי
  choice: J’ai rassemblé
  rationale: Le qatal à la première personne du singulier est formellement perfectif. Le passé composé en rend directement la forme, tout en laissant la note signaler la possible valeur future du parfait prophétique.
- source_word: מִמֵּךְ
  choice: loin de toi
  rationale: Le suffixe féminin singulier s’adresse vraisemblablement à Sion/Jérusalem. Avec le deuil lié à la fête, « loin de toi » exprime naturellement l’éloignement sans effacer l’ambiguïté syntaxique.
- source_word: מַשְׂאֵת
  choice: un fardeau
  rationale: Dans ce contexte, le nom évoque une charge ou un poids plutôt qu’un oracle.
- source_word: עָלֶיהָ
  choice: pour elle
  rationale: Le pronom féminin renvoie vraisemblablement à Sion/Jérusalem. « Pour elle » forme en français une relation naturelle avec « un fardeau », tandis que la note identifie prudemment le référent.
- source_word: חֶרְפָּה
  choice: un sujet de honte
  rationale: חֶרְפָּה désigne la honte, l’opprobre ou le déshonneur public. « Un sujet de honte » convient à la construction nominale et conserve sa dimension sociale.
theological_decisions:
- issue: Syntaxe très condensée et rapport entre les personnes endeuillées, Sion et la honte
  choice: Le verset parle de personnes endeuillées à cause de leur éloignement de la fête, que Dieu rassemble ; elles étaient pour Sion un fardeau et un sujet de honte.
  alternative: Le texte peut parler de personnes affligées qui ont été éloignées de l’assemblée festive ; la dernière proposition peut aussi signifier que la honte pesant sur Sion était un fardeau pour elles.
  rationale: L’hébreu est difficile et admet plusieurs répartitions syntaxiques. Le texte principal conserve l’action centrale de rassembler et la séquence nominale sans expliquer davantage la nature de la honte ; la note maintient les autres lectures plausibles.
- issue: Valeur temporelle de אָסַפְתִּי
  choice: 'Passé composé : « J’ai rassemblé »'
  alternative: 'Futur prophétique : « Je rassemblerai »'
  rationale: La forme est un qatal, mais le contexte prophétique de restauration permet une valeur future. La traduction principale suit la morphologie, et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Fête fixée » rend le caractère cultuel et déterminé de מוֹעֵד sans employer le plus technique « solennité ». La ponctuation maintient les deux groupes nominaux de la proposition finale tout en produisant une phrase française lisible.
