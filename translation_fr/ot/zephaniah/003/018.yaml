  source_fidelity: La traduction de l’action centrale et du deuil associé au מועֵד est globalement défendable, mais « loin de toi » interprète plus fortement מִמֵּךְ que ne le fait le texte, et « pour elle » ne rend pas suffisamment la relation exprimée par עָלֶיהָ. La proposition finale demeure syntaxiquement difficile ; une formulation qui indique qu’un fardeau pesait sur elle préserve mieux l’image hébraïque sans lever toute l’ambiguïté.
  naturalness: « Fête fixée » est compréhensible, mais « fête solennelle » est plus idiomatique en français biblique moderne et rend naturellement le cadre cultuel de מוֹעֵד. « Un fardeau qui pesait sur elle » est plus naturel et plus proche de l’image que « ils étaient pour elle un fardeau ».
  terminology: « Fête solennelle », « fardeau » et « opprobre » conservent un registre digne et accessible. « Opprobre » rend bien חרפה comme déshonneur public ; une note maintient l’analyse syntaxique concurrente.
