revisions:
- from: J’ai rassemblé ceux qui étaient dans le deuil à cause de la fête fixée, loin de toi[a] ; ils étaient pour elle[c] un fardeau, un sujet de honte[b].
  to: J’ai rassemblé d’auprès de toi ceux qui étaient dans le deuil à cause de la fête solennelle[a] ; ils étaient un fardeau qui pesait sur elle[c], un opprobre[b].
  rationale: La révision évite de transformer « de toi » en un éloignement explicite, rend plus fidèlement l’image de ce qui « pèse sur elle », et adopte une expression française plus naturelle pour le contexte festif. Les notes conservent les ambiguïtés textuelles et temporelles sans leur imposer une interprétation doctrinale.
