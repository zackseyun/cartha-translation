  text: שָׂרֶ֣י/הָ בְ/קִרְבָּ֔/הּ אֲרָי֖וֹת שֹֽׁאֲגִ֑ים שֹׁפְטֶ֨י/הָ֙ זְאֵ֣בֵי עֶ֔רֶב לֹ֥א גָרְמ֖וּ לַ/בֹּֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/003.yaml
  text: Her officials within her are roaring lions[a]; her judges are evening wolves that leave nothing for the morning.
translation:
  language: fr
  text: Ses dirigeants, en son sein, sont des lions rugissants ; ses juges sont des loups du soir qui ne laissent rien pour le matin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici une expression difficile, traditionnellement comprise comme l’image de prédateurs qui ont tout dévoré avant le matin, jusqu’aux os.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: ses dirigeants
  rationale: שַׂר peut désigner des princes, des chefs ou des responsables investis d’autorité. « Dirigeants » exprime clairement ici les autorités civiles sans suggérer nécessairement des membres de la famille royale.
- source_word: בְקִרְבָּהּ
  choice: au milieu d’elle
  rationale: L’expression situe ces dirigeants au cœur même de la ville personnifiée ; cette formulation est naturelle en français et conserve l’image spatiale.
- source_word: אֲרָיוֹת שֹׁאֲגִים
  choice: des lions rugissants
  rationale: Le participe שֹׁאֲגִים décrit des lions qui rugissent. « Lions rugissants » restitue avec concision leur caractère menaçant et prédateur.
- source_word: שֹׁפְטֶיהָ
  choice: ses juges
  rationale: Le terme désigne directement les autorités judiciaires ; « juges » en est l’équivalent français le plus précis.
- source_word: זְאֵבֵי עֶרֶב
  choice: des loups du soir
  rationale: La construction signifie littéralement « loups du soir ». Cette expression concise conserve la métaphore des prédateurs qui sortent à la tombée du jour.
- source_word: לֹא גָרְמוּ לַבֹּקֶר
  choice: qui ne laissent rien pour le matin
  rationale: La tournure hébraïque, liée à l’image de loups dévorant jusqu’aux os, évoque une consommation totale. La traduction choisie en communique clairement le sens tout en signalant en note l’image plus concrète.
