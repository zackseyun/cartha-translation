source:
  edition: WLC
  text: מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כ֑וּשׁ עֲתָרַ/י֙ בַּת פוּצַ֔/י יוֹבִל֖וּ/ן מִנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/010.yaml
  text: From beyond the rivers of Cush, my worshipers, the daughter of my dispersed ones, will bring my offering.
translation:
  language: fr
  text: D’au-delà des fleuves de Koush[c], ceux qui me supplient[a], la fille de mes dispersés[b], m’apporteront mon offrande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes adorateurs ». Le mot hébreu désigne probablement ceux qui prient ou supplient et, par extension, ceux qui rendent un culte.
    reason: lexical_alternative
  - marker: b
    text: Ou « la fille de ceux que j’ai dispersés ». L’expression hébraïque est très condensée et peut servir de titre poétique à une communauté dispersée. Le possessif peut désigner ceux qui appartiennent au locuteur ou, selon une autre lecture, ceux qu’il a dispersés.
    reason: alternative_reading
  - marker: c
    text: Koush désigne une région antique située au sud de l’Égypte; elle ne correspond pas exactement à l’Éthiopie actuelle.
    reason: cultural_note
lexical_decisions:
- source_word: מֵעֵבֶר
  choice: D’au-delà
  rationale: Rend l’origine située de l’autre côté d’une limite géographique, sans préciser indûment la distance.
- source_word: לְנַהֲרֵי כוּשׁ
  choice: des fleuves de Koush
  rationale: Conserve le nom de la région antique, distincte de l’Éthiopie moderne, et rend naturellement le pluriel construit.
- source_word: עֲתָרַי
  choice: ceux qui me supplient
  rationale: Le terme dérivé de עתר désigne vraisemblablement ceux qui adressent des supplications ou des prières; cette formulation garde ce sens plus précis sans exclure le cadre du culte.
- source_word: בַּת
  choice: la fille de
  rationale: Maintient l’image collective et personnifiée du texte hébreu au lieu de la réduire à une simple désignation abstraite.
- source_word: פוּצַי
  choice: ceux que j’ai dispersés
  rationale: Exprime clairement le rapport au locuteur suggéré par le suffixe et le sens de dispersion, tout en signalant en note l’autre formulation possible, moins explicitement agentive.
- source_word: יוֹבִלוּן
  choice: m’apporteront
  rationale: Avec « mon offrande » pour objet, le hiphil de יבל se rend naturellement par « apporter »; le pronom indirect évite en français la tournure ambiguë « apporteront mon offrande » sans destinataire exprimé.
- source_word: מִנְחָתִי
  choice: mon offrande
  rationale: Préserve la valeur religieuse probable de מִנְחָה sans la limiter à un type précis de sacrifice ni privilégier le sens politique de tribut.
theological_decisions:
- issue: Interprétation de עֲתָרַי בַּת פוּצַי
  choice: 'Les deux expressions sont conservées en apposition poétique : « ceux qui me supplient, la fille de ceux que j’ai dispersés ».'
  alternative: Comprendre deux groupes distincts, ou paraphraser « la fille » comme la communauté issue des dispersés.
  rationale: La séquence hébraïque est compacte et difficile. La traduction garde sa tension syntaxique et son image collective sans imposer une identification doctrinale ou une paraphrase explicative.
- issue: Agent implicite de la dispersion dans פוּצַי
  choice: « ceux que j’ai dispersés »
  alternative: « ceux qui m’appartiennent et qui sont dispersés » ou « mes dispersés »
  rationale: Le possessif peut marquer l’appartenance ou suggérer l’action du locuteur. Le choix retenu est idiomatique et correspond à une lecture reconnue, tandis que la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et lisible. La structure appositionnelle et l’image de « la fille » sont conservées malgré leur caractère inhabituel afin de respecter la poésie et l’ambiguïté de l’hébreu.
