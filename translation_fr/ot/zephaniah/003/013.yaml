  text: שְׁאֵרִ֨ית יִשְׂרָאֵ֜ל לֹֽא יַעֲשׂ֤וּ עַוְלָה֙ וְ/לֹא יְדַבְּר֣וּ כָזָ֔ב וְ/לֹֽא יִמָּצֵ֥א בְּ/פִי/הֶ֖ם לְשׁ֣וֹן תַּרְמִ֑ית כִּֽי הֵ֛מָּה יִרְע֥וּ וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/013.yaml
  text: The remnant of Israel will do no wrong and speak no lies[a], and no deceitful tongue will be found in their mouth; for they will graze and lie down[b], with no one to make them afraid.
translation:
  language: fr
  text: Le reste d’Israël ne fera aucun mal et ne dira aucun mensonge ; il ne se trouvera dans leur bouche aucune langue trompeuse. Car ils paîtront et se coucheront[a], sans que personne les effraie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les verbes « paître » et « se coucher » décrivent un troupeau qui vit en sécurité.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: Le reste d’Israël
  rationale: « Le reste » rend naturellement le groupe subsistant ou préservé évoqué par שְׁאֵרִית, tout en conservant sa portée prophétique.
- source_word: יַעֲשׂוּ עַוְלָה
  choice: ne commettra pas d’injustice
  rationale: עַוְלָה désigne l’injustice ou le mal commis. « Commettre une injustice » est idiomatique et garde ici la dimension morale du terme.
- source_word: יְדַבְּרוּ כָזָב
  choice: ne dira pas de mensonges
  rationale: כָזָב signifie mensonge ou fausseté. Cette formulation est directe et naturelle en français.
- source_word: יִמָּצֵא בְּפִיהֶם
  choice: ne se trouvera dans leur bouche
  rationale: La formulation conserve l’image concrète de l’hébreu et son emploi collectif du singulier « bouche » avec un possesseur pluriel.
- source_word: לְשׁוֹן תַּרְמִית
  choice: aucune langue trompeuse
  rationale: Ce choix préserve l’image corporelle de la langue comme instrument d’une parole qui trompe, sans l’aplatir en une abstraction.
- source_word: כִּי
  choice: Car
  rationale: כִּי introduit ici l’assurance explicative qui conduit à la scène finale de sécurité.
- source_word: יִרְעוּ
  choice: ils paîtront
  rationale: Le verbe décrit littéralement l’action de paître et maintient l’image pastorale du troupeau.
- source_word: וְרָבְצוּ
  choice: et se coucheront
  rationale: רבץ est employé pour un animal qui se couche. La traduction conserve cette image plutôt que de la réduire à l’idée générale de repos.
- source_word: אֵין מַחֲרִיד
  choice: sans personne pour les effrayer
  rationale: Le participe désigne ce qui ou celui qui provoque la peur. « Personne » exprime naturellement l’absence de toute menace active dans ce contexte.
theological_decisions:
- issue: Image pastorale dans la dernière proposition
  choice: Conserver « ils paîtront et se coucheront »
  alternative: « ils se nourriront et se reposeront » ou « ils vivront en sécurité »
  rationale: L’hébreu présente concrètement Israël comme un troupeau en sûreté. Garder cette image respecte la texture prophétique sans ajouter d’interprétation doctrinale.
- issue: Désignation du groupe subsistant
  choice: « Le reste d’Israël »
  alternative: « Les survivants d’Israël » ou « ce qui restera d’Israël »
  rationale: « Le reste » est compréhensible en français biblique moderne et conserve la nuance prophétique d’un peuple subsistant, sans préciser indûment comment ce groupe a été préservé.
- issue: Portée de עַוְלָה
  choice: « injustice »
  alternative: « mal » ou « iniquité »
  rationale: « Injustice » rend une valeur centrale du terme tout en restant moderne. Le contexte associe actes injustes, mensonges et tromperie, sans exiger une lecture exclusivement judiciaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier collectif est maintenu dans « Le reste… ne commettra… ne dira », puis l’hébreu passe au pluriel avec « leur bouche » et « ils paîtront » ; ce glissement est conservé. L’image pastorale et la métaphore de la langue sont également préservées.
