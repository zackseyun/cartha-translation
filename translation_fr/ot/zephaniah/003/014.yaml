  text: רָנִּי֙ בַּת צִיּ֔וֹן הָרִ֖יעוּ יִשְׂרָאֵ֑ל שִׂמְחִ֤י וְ/עָלְזִי֙ בְּ/כָל לֵ֔ב בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/014.yaml
  text: Sing for joy[a], daughter Zion; shout aloud, Israel! Rejoice and exult with all your heart, daughter Jerusalem!
translation:
  language: fr
  text: Pousse des cris de joie, fille de Sion[a] ! Poussez des acclamations, Israël ! Réjouis-toi et exulte de tout ton cœur, fille de Jérusalem !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fille de Sion » et, à la fin du verset, « fille de Jérusalem » ; l’hébreu emploie une expression qui personnifie la ville.
    reason: Clarifie l’expression hébraïque personnifiante sans ajouter d’interprétation sur son référent.
lexical_decisions:
- source_word: רָנִּי
  choice: Pousse des cris de joie
  rationale: L’impératif féminin singulier de רנן exprime une manifestation vocale et jubilante. Cette formulation française rend clairement la joie proclamée sans imposer que le cri soit nécessairement chanté.
- source_word: בַּת צִיּוֹן
  choice: fille de Sion
  rationale: La formule hébraïque personnifie la ville et sa population. La tournure française traditionnelle et intelligible « fille de Sion » conserve cette image ainsi que la valeur d’interpellation.
- source_word: הָרִיעוּ
  choice: Acclame
  rationale: L’impératif pluriel de ריע désigne ici une clameur publique et joyeuse. « Acclame » en restitue la force célébrative et s’accorde naturellement avec le collectif « Israël ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé sous sa forme française usuelle et fonctionne ici comme une apostrophe collective.
- source_word: שִׂמְחִי
  choice: Réjouis-toi
  rationale: L’impératif de שמח appelle directement à la joie. « Réjouis-toi » est naturel, digne et garde la forme verbale du texte.
- source_word: וְעָלְזִי
  choice: et exulte
  rationale: Le verbe עלז exprime une joie intense et débordante. « Exulte » maintient cette nuance renforcée et évite de répéter « réjouis-toi ».
- source_word: בְּכָל לֵב
  choice: de tout ton cœur
  rationale: Cette expression idiomatique indique une joie entière, engageant tout l’être intérieur. La formulation française conserve le cœur au singulier et s’adresse directement à la ville personnifiée.
- source_word: בַּת יְרוּשָׁלִָם
  choice: fille de Jérusalem
  rationale: Cette formule parallèle à « fille de Sion » personnifie Jérusalem et maintient la symétrie poétique de l’hébreu.
