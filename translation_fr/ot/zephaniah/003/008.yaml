source:
  edition: WLC
  text: לָ/כֵ֤ן חַכּוּ לִ/י֙ נְאֻם יְהוָ֔ה לְ/י֖וֹם קוּמִ֣/י לְ/עַ֑ד כִּ֣י מִשְׁפָּטִ/י֩ לֶ/אֱסֹ֨ף גּוֹיִ֜ם לְ/קָבְצִ֣/י מַמְלָכ֗וֹת לִ/שְׁפֹּ֨ךְ עֲלֵי/הֶ֤ם זַעְמִ/י֙ כֹּ֚ל חֲר֣וֹן אַפִּ֔/י כִּ֚י בְּ/אֵ֣שׁ קִנְאָתִ֔/י תֵּאָכֵ֖ל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/008.yaml
  text: Therefore wait for me[a], declares Yahweh, for the day when I rise up for plunder; for my judgment is to gather nations, to assemble kingdoms, to pour out on them my indignation, all my burning anger[c][b]; for in the fire of my jealousy all the earth will be consumed.
translation:
  language: fr
  text: C’est pourquoi, attendez-moi — déclaration de Yahweh — jusqu’au jour où je me lèverai pour le butin[a]. Car ma décision est de rassembler les nations, de réunir les royaumes, afin de déverser sur eux mon indignation, toute l’ardeur de ma colère. Car, par le feu de ma jalousie[b], toute la terre[c] sera consumée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu est difficile. On peut aussi comprendre : « comme témoin » ou « pour témoigner ».'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « jalousie » peut aussi signifier « zèle ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tout le pays ». Le contexte, qui mentionne les nations et les royaumes, favorise ici le sens plus large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le lien logique avec le contexte précédent.
- source_word: חַכּוּ לִי
  choice: attendez-moi
  rationale: Rend directement l’impératif pluriel et l’attente tournée vers Yahweh.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Conserve la formule prophétique solennelle et rend explicitement le nom divin.
- source_word: לְיוֹם קוּמִי
  choice: jusqu’au jour où je me lèverai
  rationale: Formulation française naturelle pour l’attente orientée vers un jour futur, tout en maintenant l’image du lever divin.
- source_word: לְעַד
  choice: pour le butin
  rationale: Dans ce contexte de jugement des nations, עַד peut désigner le butin ou la proie. La difficulté réelle du terme est signalée en note.
- source_word: מִשְׁפָּטִי
  choice: ma décision
  rationale: Le terme désigne ici la décision judiciaire de Yahweh, explicitée par les infinitifs qui suivent. « Décision » s’insère plus naturellement que « jugement » dans cette construction française.
- source_word: לֶאֱסֹף גּוֹיִם / לְקָבְצִי מַמְלָכוֹת
  choice: rassembler les nations, réunir les royaumes
  rationale: Préserve le parallélisme synonymique sans répétition lourde en français.
- source_word: לִשְׁפֹּךְ עֲלֵיהֶם זַעְמִי
  choice: déverser sur eux mon indignation
  rationale: Maintient l’image concrète de l’effusion et distingue זַעַם de l’expression intensive suivante.
- source_word: כֹּל חֲרוֹן אַפִּי
  choice: toute l’ardeur de ma colère
  rationale: Rend l’intensité et la métaphore de la chaleur contenues dans l’expression hébraïque.
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: par le feu de ma jalousie
  rationale: Conserve à la fois la métaphore du feu et la nuance relationnelle de קִנְאָה, sans exclure le sens possible de zèle.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: Le contexte universel des nations et des royaumes favorise « terre » au sens large, bien que « pays » reste lexicalement possible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La translittération communique le nom propre du Dieu d’Israël sans le remplacer par un titre.
- issue: Sens du terme difficile לְעַד
  choice: pour le butin
  alternative: comme témoin / pour témoigner
  rationale: Le sens de butin ou proie convient à la scène où Yahweh rassemble les royaumes pour exercer son jugement. La lecture judiciaire liée au témoignage demeure ancienne et plausible; elle est donc conservée en note.
- issue: Portée de כָּל הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: La mention des nations et des royaumes soutient une portée mondiale, mais l’ambiguïté lexicale est indiquée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe garde la progression solennelle de l’hébreu; les tirets isolent la formule prophétique et « Oui » marque la dernière proposition causale sans alourdir la répétition de « Car ».
