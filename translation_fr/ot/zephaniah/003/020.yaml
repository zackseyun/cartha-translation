  to: En ce temps-là, je vous ferai venir, au temps même où je vous rassemblerai. Car je vous donnerai renom et louange parmi tous les peuples de la terre, quand je rétablirai votre situation sous vos propres yeux, dit Yahvé.
  rationale: La révision restitue la valeur explicative de כִּי par « Car », affine la relation temporelle entre l’arrivée et le rassemblement, et corrige la présentation de l’alternative lexicale en note. Elle conserve l’ambiguïté voulue de l’idiome de restauration sans restreindre la promesse au retour d’exil ni à la prospérité matérielle.
