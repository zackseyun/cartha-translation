base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/020.yaml
  text: At that time I will bring you in[a], and at that time I will gather you; for I will make you a name and a praise among all the peoples of the earth, when I restore your fortunes before your eyes, says Yahweh.
translation:
  language: fr
  text: En ce temps-là, je vous ferai venir, au temps même où je vous rassemblerai. Car je vous donnerai renom et louange parmi tous les peuples de la terre, quand je rétablirai votre situation sous vos propres yeux, dit Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: En ce temps-là
  rationale: Formule temporelle prophétique rendue dans un français naturel et digne.
- source_word: אָבִיא אֶתְכֶם
  choice: je vous ferai venir
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Le lieu d’arrivée n’étant pas exprimé, la traduction évite d’ajouter explicitement « ici » ou « revenir ».
- source_word: וּבָעֵת קַבְּצִי אֶתְכֶם
  choice: au temps où je vous rassemblerai
  rationale: L’infinitif construit avec suffixe a une valeur temporelle. Cette formulation garde l’écho de בָּעֵת tout en restant lisible en français.
- source_word: כִּי
  choice: Alors
  rationale: Dans l’enchaînement de la promesse, כִּי peut introduire ou souligner ce qui adviendra. « Alors » exprime ici naturellement cette progression, sans imposer une causalité forte.
- source_word: אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה
  choice: je vous donnerai renommée et louange
  rationale: Rend l’expression littérale « vous donner pour un nom et pour une louange » par un idiome français clair, tout en conservant les deux idées de renommée et d’éloge.
- source_word: בְּכֹל עַמֵּי הָאָרֶץ
  choice: parmi tous les peuples de la terre
  rationale: « Peuples » conserve le pluriel hébreu, et « terre » convient à la portée universelle de l’oracle.
- source_word: בְּשׁוּבִי אֶת שְׁבוּתֵיכֶם
  choice: quand je rétablirai votre situation
  rationale: L’expression idiomatique שׁוב שׁבות désigne largement le relèvement après l’exil ou le malheur. Cette formulation française ne la réduit ni aux biens matériels ni au seul retour géographique.
- source_word: לְעֵינֵיכֶם
  choice: sous vos propres yeux
  rationale: Expression française vivante qui souligne que les destinataires assisteront eux-mêmes au rétablissement annoncé.
- source_word: אָמַר יְהוָה
  choice: dit Yahvé
  rationale: La formule prophétique est rendue au présent de discours, et le nom divin est translittéré sous sa forme française usuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahvé » en est une forme française courante et permet de le distinguer du titre « Seigneur ».
- issue: Portée de l’expression שׁוּב שְׁבוּת
  choice: rétablir votre situation
  alternative: ramener vos captifs / mettre fin à votre captivité
  rationale: L’hébreu peut évoquer le retour des captifs ou, plus largement, le rétablissement après une catastrophe. Le texte principal conserve cette largeur de sens et la note signale les lectures plus littérales.
translation_notes:
  register: Français international moderne, accessible et solennel. Le parallélisme temporel de l’hébreu est maintenu sans alourdir excessivement la phrase; l’ambiguïté de la formule de rétablissement est conservée grâce à une traduction large et à une note.
