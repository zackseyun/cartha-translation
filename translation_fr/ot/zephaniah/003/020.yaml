    rationale: Cette formulation explicite une conséquence possible de l’idiome, mais elle n’est pas une traduction plus littérale de שוב שבות. La note doit distinguer l’alternative « ramènerai vos captifs » et l’étendue idiomatique du rétablissement.
  revised_text: En ce temps-là, je vous ferai venir, au temps même où je vous rassemblerai. Car je vous donnerai renom et louange parmi tous les peuples de la terre, quand je rétablirai votre situation sous vos propres yeux, dit Yahvé.
