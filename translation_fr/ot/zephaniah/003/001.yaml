  yaml_path: translation/ot/zephaniah/003/001.yaml
  text: Woe to the rebellious and defiled city[b][a], the oppressing one!
translation:
  language: fr
  text: Malheur à la ville rebelle et souillée[a], à celle qui opprime[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « polluée ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu הַיּוֹנָה peut aussi se lire littéralement « la colombe » ; dans ce contexte, il est souvent compris comme une description figurée de la ville qui opprime.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule rend la force de l’interjection prophétique, qui exprime ici à la fois lamentation et condamnation.
- source_word: מֹרְאָה
  choice: rebelle
  rationale: Le terme est rattaché à la racine מרה, « se rebeller » ; « rebelle » conserve directement l’accusation de résistance à l’autorité et à la correction.
- source_word: וְנִגְאָלָה
  choice: et souillée
  rationale: Dans cette dénonciation, la forme est comprise au sens d’« être souillé, pollué », et non selon le sens habituel de la racine גאל, « racheter », qui ne convient pas au contexte.
- source_word: הָעִיר
  choice: la ville
  rationale: Équivalent français courant et direct de עִיר.
- source_word: הַיּוֹנָה
  choice: à celle qui opprime
  rationale: La lecture contextuelle traditionnelle y voit une qualification de la ville comme oppressive. La tournure verbale est naturelle en français et garde la valeur active de l’expression.
