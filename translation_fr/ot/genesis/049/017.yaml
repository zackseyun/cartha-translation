  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: fr
  text: 'Que Dan soit un serpent sur le chemin,

    une vipère[a] sur le sentier,

    qui mord les talons du cheval,

    si bien que son cavalier tombe à la renverse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aspic ». Le mot hébreu שְׁפִיפֹן est rare ; l’espèce exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Que … soit
  rationale: Le jussif qal de היה convient à la forme de souhait ou de proclamation propre à la bénédiction de Jacob. « Que Dan soit » en conserve la nuance volitive sans la réduire à un simple futur.
- source_word: דָן
  choice: Dan
  rationale: Nom propre du fils de Jacob et de la tribu issue de lui, conservé sous sa forme française traditionnelle.
- source_word: נָחָשׁ
  choice: serpent
  rationale: Terme générique désignant un serpent. Ce choix garde le registre poétique et prépare le terme plus précis, mais incertain, du vers suivant.
- source_word: עֲלֵי דֶרֶךְ
  choice: au bord de la route
  rationale: La tournure situe le serpent près de la route, dans une position propice à l'embuscade. Cette formulation est naturelle en français.
- source_word: שְׁפִיפֹן
  choice: vipère
  rationale: Ce mot rare désigne une espèce de serpent dangereuse, sans que son identification zoologique soit certaine. « Vipère » communique clairement le danger sans prétendre déterminer l'espèce exacte.
- source_word: עֲלֵי אֹרַח
  choice: au bord du sentier
  rationale: La formulation reste parallèle à « au bord de la route », tout en préservant la variation poétique entre דֶרֶךְ et אֹרַח.
- source_word: הַנֹּשֵׁךְ
  choice: qui mord
  rationale: Le participe décrit le serpent par son action. La proposition relative est fluide en français et maintient cette valeur descriptive.
- source_word: עִקְּבֵי סוּס
  choice: les talons du cheval
  rationale: La construction désigne littéralement la partie arrière, les talons, d'un cheval pris au sens générique. Le choix conserve l'image concrète de l'hébreu.
- source_word: וַיִּפֹּל
  choice: si bien que … tombe
  rationale: La séquence présente la chute comme le résultat de la morsure. « Si bien que » rend naturellement ce lien consécutif en français.
- source_word: רֹכְבוֹ
  choice: son cavalier
  rationale: Le suffixe renvoie le plus naturellement au cheval. En français, « son cavalier » exprime ce rapport sans lourdeur.
- source_word: אָחוֹר
  choice: à la renverse
  rationale: Cette expression française décrit naturellement une chute vers l'arrière et conserve la force visuelle de l'image.
theological_decisions: []
