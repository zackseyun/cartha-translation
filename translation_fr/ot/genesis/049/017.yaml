    issue: « au bord de la route / du sentier » précise la localisation.
    rationale: עֲלֵי signifie plus directement « sur » (ou, selon le contexte, près de). « Sur » préserve mieux l’ambiguïté spatiale et le parallélisme poétique.
  - severity: low
    issue: La note affirme que le terme désigne « manifestement un serpent dangereux ».
    rationale: Le mot rare désigne bien un type de serpent, possiblement une vipère, mais l’espèce et les implications exactes ne doivent pas être surdéterminées.
