  verdict: revise
  source_fidelity: La formulation « au bord de » interprète de façon un peu trop précise les deux occurrences de עֲלֵי. Dans ce parallélisme, « sur le chemin / sur le sentier » rend plus directement la localisation exprimée par l’hébreu sans exclure l’image d’une attaque à l’affût. Le reste reproduit bien le jussif, les deux termes pour serpent, la morsure des talons, la conséquence et la chute vers l’arrière.
  naturalness: Le français est fluide, poétique et adapté à un registre moderne international. « Tombe à la renverse » est idiomatique et restitue bien אָחוֹר.
  terminology: « Dan », « serpent » et « vipère » sont appropriés. Puisque שְׁפִיפֹן est rare et que l’identification zoologique reste discutée, la note doit présenter l’alternative comme telle sans affirmer au-delà du texte que l’animal est « manifestement » dangereux.
  issues:
