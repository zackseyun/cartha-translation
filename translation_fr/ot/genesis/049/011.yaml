  text: אֹסְרִ֤י לַ/גֶּ֨פֶן֙ עיר/ה וְ/לַ/שֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑/וֹ כִּבֵּ֤ס בַּ/יַּ֨יִן֙ לְבֻשׁ֔/וֹ וּ/בְ/דַם עֲנָבִ֖ים סות/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: fr
  text: 'Il attache son ânon à la vigne[a],

    et le petit de son ânesse à la vigne de choix[b].

    Il lave son vêtement dans le vin,

    et sa robe dans le sang des raisins[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son jeune âne » ; le mot hébreu peut désigner un jeune âne ou un ânon.
    reason: lexical_alternative
  - marker: b
    text: Ou « à une vigne noble » ; le terme hébreu désigne une vigne sélectionnée, de qualité.
    reason: lexical_alternative
  - marker: c
    text: « Le sang des raisins » est une image poétique hébraïque désignant le jus de raisin ou le vin.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: Il attache
  rationale: Le participe qal masculin singulier dépeint une action caractéristique dans ce tableau poétique. Le présent français en restitue naturellement la vivacité.
- source_word: לַגֶּפֶן
  choice: à la vigne
  rationale: Le nom גפן désigne la vigne; l’article hébreu est conservé, avec une valeur qui peut être générique en français.
- source_word: עִירֹה
  choice: son ânon
  rationale: עַיִר désigne un jeune âne. « Ânon » est précis et naturel, tandis que la note signale l’autre rendu possible.
- source_word: וְלַשֹּׂרֵקָה
  choice: et … à un cep de choix
  rationale: שֹׂרֵקָה désigne une vigne sélectionnée ou noble. « Cep de choix » exprime la qualité tout en évitant la répétition immédiate de « vigne ».
- source_word: בְּנִי אֲתֹנוֹ
  choice: le petit de son ânesse
  rationale: Littéralement « le fils de son ânesse ». Ce rendu idiomatique conserve à la fois la relation filiale et la mention explicite de l’ânesse.
- source_word: כִּבֵּס
  choice: Il lave
  rationale: Dans cette poésie prophétique, l’accompli peut peindre vivement une action caractéristique ou envisagée. Le présent maintient le tableau sans trancher entre valeur présente et future.
- source_word: בַּיַּיִן
  choice: dans le vin
  rationale: La préposition ב est rendue concrètement par « dans », conformément à l’image d’une abondance telle que le vin sert de liquide de lavage.
- source_word: לְבֻשׁוֹ
  choice: son vêtement
  rationale: Le singulier morphologique est conservé. « Vêtement » est courant, digne et forme un parallélisme naturel avec « robe ».
- source_word: וּבְדַם עֲנָבִים
  choice: et … dans le sang des raisins
  rationale: L’image hébraïque est conservée littéralement plutôt que réduite à « jus de raisin » ou « vin », afin de préserver sa force poétique.
- source_word: סוּתוֹ
  choice: sa robe
  rationale: Ce terme vestimentaire, parallèle à לְבֻשׁוֹ, est rendu par « robe », terme digne qui n’impose pas une identification trop précise du vêtement.
theological_decisions:
- issue: Portée messianique ou tribale de l’image dans la bénédiction de Juda
  choice: Conserver l’image poétique d’une abondance extraordinaire sans expliciter une lecture messianique dans le texte.
  alternative: Présenter le verset soit comme une prophétie messianique directe, soit comme une simple description historique de la prospérité de Juda.
  rationale: Le contexte plus large a reçu des lectures messianiques et tribales, mais ce verset exprime directement son propos par des images de vigne, de vin et de dignité. La traduction ne doit pas résoudre cette tension interprétative.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le verset est disposé en quatre lignes pour rendre son parallélisme. Le présent donne au tableau sa vivacité sans enfermer les formes hébraïques dans une chronologie trop précise. Les images concrètes, notamment « le sang des raisins », sont conservées.
