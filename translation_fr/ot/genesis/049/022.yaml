  variant: modern international French
source:
  edition: WLC
  text: בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: fr
  text: Joseph est un fils fécond[a], un fils fécond près d’une source ; des filles[b] s’avancent par-dessus le mur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Joseph est un rameau fertile, un rameau fertile près d’une source. » L’hébreu est poétique et condensé ; la traduction traditionnelle par « rameau » explicite davantage l’image végétale.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « filles ». Le mot peut désigner métaphoriquement des branches ou des pousses qui s’étendent par-dessus un mur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: fils
  rationale: Le sens premier est « fils ». Ce choix conserve la formulation hébraïque et sa métaphore poétique condensée, sans la transformer directement en image végétale.
- source_word: פֹּרָת
  choice: fécond
  rationale: Le terme est lié à la racine פרה, « porter du fruit, être fécond ». « Fécond » convient à Joseph tout en maintenant l’écho avec l’image végétale du vers.
- source_word: בֵּן פֹּרָת
  choice: un fils fécond
  rationale: Cette traduction garde la valeur lexicale des deux mots et reste naturelle en français. « Un rameau fertile » explicite davantage l’image, mais constitue une interprétation.
- source_word: עֲלֵי עָיִן
  choice: près d’une source
  rationale: עַיִן peut désigner un œil ou une source. Dans cette bénédiction marquée par la fécondité, le sens « source » est contextuellement naturel ; la préposition est rendue par une expression française de localisation.
- source_word: בָּנוֹת
  choice: des filles
  rationale: Le mot signifie littéralement « filles ». Le conserver préserve l’image poétique énigmatique, au lieu de l’identifier sans réserve à des branches ou à des pousses.
- source_word: צָעֲדָה
  choice: s’avancent
  rationale: Le verbe exprime l’action de marcher à grands pas ou de s’avancer. « S’avancent » donne en français un mouvement naturel sans préciser excessivement la manière.
- source_word: עֲלֵי שׁוּר
  choice: par-dessus le mur
  rationale: שׁוּר désigne ici un mur. « Par-dessus » rend l’idée d’un mouvement qui franchit ou dépasse cette limite, tout en convenant à l’imagerie d’une croissance abondante.
