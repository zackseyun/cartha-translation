  text: וַֽ/יְמָרֲרֻ֖/הוּ וָ/רֹ֑בּוּ וַֽ/יִּשְׂטְמֻ֖/הוּ בַּעֲלֵ֥י חִצִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/023.yaml
  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: fr
  text: Ils lui ont rendu la vie amère[a], ils ont tiré sur lui et l’ont pris en haine — les archers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Ils l’ont accablé d’amertume, ils ont lutté contre lui et l’ont pris en haine — les archers. » Le verbe hébreu rendu par « ils ont tiré sur lui » est difficile ; il peut aussi avoir un sens plus général : « ils ont lutté contre lui » ou « ils l’ont assailli ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: Ils l’ont harcelé avec acharnement
  rationale: Le piel de מרר avec suffixe objet peut signifier « rendre amer », « aigrir » ou « traiter avec amertume ». Dans cette suite d’actions hostiles, « harceler avec acharnement » exprime naturellement en français une hostilité persistante tout en conservant la nuance d’intensité amère.
- source_word: וָרֹבּוּ
  choice: ils ont tiré sur lui
  rationale: La forme hébraïque est difficile et pourrait évoquer le fait de lutter ou d’assaillir. Toutefois, la mention finale des « archers » soutient fortement ici le sens traditionnel d’un tir dirigé contre lui.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: l’ont pris en haine
  rationale: Le verbe שטם désigne une hostilité profonde, de la haine ou une rancune. « Prendre en haine » rend clairement cette inimitié et convient au registre poétique.
- source_word: בַּעֲלֵי חִצִּים
  choice: les archers
  rationale: Littéralement « maîtres/possesseurs de flèches » ; l’expression désigne idiomatiquement des archers. Le tiret conserve l’apposition emphatique placée à la fin du vers.
