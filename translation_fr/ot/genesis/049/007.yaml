  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: fr
  text: 'Maudite soit leur colère[a], car elle est violente,

    et leur fureur, car elle est cruelle !

    Je les diviserai au sein de Jacob

    et je les disperserai au sein d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Maudite est leur colère »'
    reason: Le participe passif hébreu peut être rendu comme une déclaration formulée à l’indicatif plutôt que comme une imprécation au subjonctif.
lexical_decisions:
- source_word: אָרוּר
  choice: Maudite soit
  rationale: Le participe passif employé comme prédicat exprime ici une déclaration de malédiction. « Maudite soit » en restitue naturellement la force tout en gardant la colère, et non les hommes eux-mêmes, comme objet de la malédiction.
- source_word: אַפָּם
  choice: leur colère
  rationale: Bien que le nom soit lié au nez ou aux narines, il désigne idiomatiquement la colère dans ce contexte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit dans les deux propositions le motif de la malédiction et convient au registre poétique.
- source_word: עָז
  choice: violente
  rationale: L’adjectif évoque la force et l’intensité. Appliqué à la colère de Siméon et Lévi, « violente » exprime clairement son caractère destructeur.
- source_word: וְעֶבְרָתָם
  choice: et leur fureur
  rationale: עֶבְרָה désigne une rage débordante. « Fureur » conserve l’intensité du terme et se distingue naturellement de « colère ».
- source_word: קָשָׁתָה
  choice: elle est cruelle
  rationale: Le terme exprime ici la dureté ou la sévérité. Dans le contexte de la violence dénoncée, « cruelle » rend cette dureté morale avec force et naturel.
- source_word: אֲחַלְּקֵם
  choice: Je les diviserai
  rationale: Le piel à la première personne annonce la division de Siméon et Lévi au sein du peuple et maintient la distinction avec le verbe « disperser » du membre parallèle.
- source_word: בְּיַעֲקֹב
  choice: au sein de Jacob
  rationale: Jacob désigne collectivement le peuple issu du patriarche. « Au sein de » rend la valeur locative de la préposition dans un français naturel sans effacer le nom poétique Jacob.
- source_word: וַאֲפִיצֵם
  choice: et je les disperserai
  rationale: Le hiphil exprime l’action de faire se disperser. « Disperser » restitue directement cette image de jugement.
- source_word: בְּיִשְׂרָאֵל
  choice: au sein d’Israël
  rationale: La formulation parallèle à « au sein de Jacob » conserve les deux noms employés poétiquement pour le peuple.
theological_decisions:
- issue: Objet de la malédiction
  choice: La malédiction porte explicitement sur la colère et la fureur de Siméon et Lévi.
  alternative: Comprendre que Siméon et Lévi eux-mêmes sont directement maudits.
  rationale: Le texte hébreu place « leur colère » et « leur fureur » comme sujets de la déclaration. La traduction préserve cette distinction sans reporter la malédiction sur les personnes.
- issue: Nature de la dispersion annoncée
  choice: Conserver la déclaration à la première personne sans préciser explicitement qui en est l’agent ultime.
  alternative: Identifier explicitement Jacob ou Dieu comme celui qui divisera et dispersera les tribus.
  rationale: La forme hébraïque dit simplement « je diviserai… je disperserai ». La traduction garde cette formulation et son éventuelle tension prophétique sans ajouter une identification absente du verset.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux lignes de dénonciation puis les deux lignes de jugement font ressortir le parallélisme hébreu. « Au sein de » évite l’expression peu naturelle « dans Jacob » tout en conservant Jacob et Israël comme désignations collectives parallèles.
