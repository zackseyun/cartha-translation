  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: fr
  text: D’Aser viendra une nourriture riche[a], et il fournira des mets de roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « D’Aser viendra un pain gras » ; le mot traduit par « nourriture » signifie littéralement « pain », et « riche » peut aussi se rendre par « gras » ou « abondant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: D’Aser vient
  rationale: La préposition מִן indique ici la provenance. Le verbe « vient » est ajouté naturellement en français dans cette proposition hébraïque sans verbe.
- source_word: שְׁמֵנָה
  choice: riche
  rationale: L’adjectif exprime littéralement l’idée de graisse, donc d’abondance et de qualité. « Riche » convient à la nourriture en français moderne.
- source_word: לַחְמוֹ
  choice: une nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais peut désigner plus largement la nourriture ou les vivres. Le possessif est implicitement rattaché à Aser par la tournure de provenance.
- source_word: וְהוּא
  choice: et lui
  rationale: Le pronom indépendant est conservé sous une forme emphatique, reprenant Aser comme sujet.
- source_word: יִתֵּן
  choice: fournira
  rationale: Le sens premier est « donnera » ; dans le contexte de denrées produites ou procurées, « fournira » est idiomatique.
- source_word: מַעֲדַנֵּי
  choice: des mets
  rationale: Le terme désigne des délices ou des aliments raffinés. « Mets » convient au contexte alimentaire et au registre poétique.
- source_word: מֶלֶךְ
  choice: dignes d’un roi
  rationale: La construction signifie littéralement « délices d’un roi ». Cette formulation française naturelle garde l’idée d’aliments de qualité royale sans préciser s’ils sont destinés au roi ou simplement comparables à ceux de sa table.
