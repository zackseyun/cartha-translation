  source_fidelity: 'Le sens général est bien rendu : la première proposition évoque les ressources abondantes provenant d’Aser, et la seconde les mets propres à une table royale. Toutefois, « lui fournira » ne peut pas reprendre Aser comme sujet en français : « lui » est ici un pronom complément. Le pronom indépendant hébreu וְהוּא doit être rendu par « il ».'
