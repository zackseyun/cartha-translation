base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: fr
  text: Benjamin est un loup qui déchire ; le matin, il dévore la proie[a], et le soir, il répartit le butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « proie » peut aussi désigner un butin, une prise ou un pillage.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: Benjamin
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: זְאֵב יִטְרָף
  choice: un loup qui déchire
  rationale: Cette formulation conserve le loup comme nom et rend explicitement l’action prédatrice du verbe טרף, tout en gardant la concision poétique de l’hébreu.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Équivalent temporel naturel en français, mis en parallèle avec « le soir ».
- source_word: יֹאכַל
  choice: il dévore
  rationale: Le verbe signifie littéralement « manger », mais « dévorer » convient au contexte du loup et restitue la vigueur de l’image.
- source_word: עַד
  choice: sa proie
  rationale: Dans l’image animale, le mot désigne naturellement ce que le loup mange. Le possessif est idiomatique en français sans modifier le sens.
- source_word: וְלָעֶרֶב
  choice: et le soir
  rationale: Rend simplement la coordination et le parallélisme temporel avec « le matin ».
- source_word: יְחַלֵּק
  choice: il partage
  rationale: Le piel de חלק exprime ici la répartition. « Partage » est naturel avec « butin » et peut désigner sa distribution en parts.
- source_word: שָׁלָל
  choice: le butin
  rationale: Terme français courant et précis pour les biens pris lors d’un conflit.
theological_decisions:
- issue: Portée métaphorique de la bénédiction prononcée sur Benjamin
  choice: Conserver l’image vive du loup prédateur qui consomme sa proie puis partage le butin, sans identifier un accomplissement historique particulier.
  alternative: Expliciter une allusion à l’histoire guerrière ultérieure de la tribu de Benjamin.
  rationale: Le texte hébreu formule une caractérisation poétique, sans nommer d’événement ni d’accomplissement. La traduction doit préserver cette ouverture interprétative.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme en deux propositions temporelles respecte le parallélisme poétique. « Un loup qui déchire » reste proche de la structure hébraïque et évite de réduire יִטְרָף à un simple adjectif.
