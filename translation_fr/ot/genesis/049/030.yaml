  text: בַּ/מְּעָרָ֞ה אֲשֶׁ֨ר בִּ/שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה אֲשֶׁ֥ר עַל פְּנֵי מַמְרֵ֖א בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁר֩ קָנָ֨ה אַבְרָהָ֜ם אֶת הַ/שָּׂדֶ֗ה מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: fr
  text: dans la grotte située dans le champ de Makpéla, en face de Mamré[a], au pays de Canaan, ce champ qu’Abraham avait acheté à Éfron le Hittite comme propriété funéraire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Mamré » ; l’expression hébraïque indique la situation du lieu par rapport à Mamré.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme propriété destinée à la sépulture ». L’hébreu souligne qu’il s’agissait d’un bien possédé et réservé à l’inhumation.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: dans la grotte située dans le champ de Makpéla
  rationale: La formulation conserve le rapport spatial entre la grotte et le champ, tout en rendant naturellement en français la proposition relative hébraïque.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: en face de Mamré
  rationale: L’expression situe le champ par rapport à Mamré. « En face de » préserve cette relation spatiale sans la réduire à une simple proximité.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: au pays de Canaan
  rationale: Traduction géographique française courante et fidèle.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: ce champ qu’Abraham avait acheté
  rationale: Le champ est explicitement l’objet direct du verbe « acheter ». La reprise par « ce champ » clarifie en français la longue chaîne de relatives sans transformer אֶת הַשָּׂדֶה en complément d’accompagnement.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: à Éfron le Hittite
  rationale: Dans une transaction, מֵאֵת indique ici le vendeur auprès de qui Abraham a acheté le bien; « acheter à » est idiomatique en français.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: comme propriété funéraire
  rationale: « Propriété » rend la dimension de possession légalement détenue portée par אֲחֻזָּה, tandis que « funéraire » indique sa destination comme lieu de sépulture.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset étant syntaxiquement rattaché au précédent, la traduction conserve son caractère de complément continu. La reprise « ce champ » évite une ambiguïté française tout en respectant le fait que le champ, et non une expression implicite « avec le champ », est l’objet grammatical de l’achat.
