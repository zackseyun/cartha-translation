  yaml_path: translation/ot/genesis/049/014.yaml
  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: fr
  text: Issacar est un âne robuste, couché entre les enclos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre les sacoches ». Le terme hébreu est rare et son sens est discuté; « enclos » correspond à l’interprétation traditionnelle dans ce contexte pastoral.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: חֲמֹר
  choice: âne
  rationale: Rend directement le nom hébreu, sans expliciter inutilement le sexe de l’animal.
- source_word: גָּרֶם
  choice: robuste
  rationale: Le terme lié à l’idée d’« os » décrit vraisemblablement la solide constitution de l’âne. « Robuste » communique naturellement ce sens en français, sans suggérer à tort un animal maigre ou décharné.
- source_word: רֹבֵץ
  choice: couché
  rationale: Le participe représente un animal étendu ou accroupi au repos; « couché » convient naturellement à l’image.
- source_word: בֵּין
  choice: entre
  rationale: Correspondance directe avec la préposition hébraïque.
- source_word: הַמִּשְׁפְּתָיִם
  choice: les enclos
  rationale: Ce terme rare et discuté désigne traditionnellement des parcs ou enclos destinés au bétail. « Enclos » conserve le cadre pastoral sans préciser plus que ne le permet l’hébreu.
