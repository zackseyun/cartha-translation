  text: כָּל אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠/זֹאת אֲשֶׁר דִּבֶּ֨ר לָ/הֶ֤ם אֲבִי/הֶם֙ וַ/יְבָ֣רֶךְ אוֹתָ֔/ם אִ֛ישׁ אֲשֶׁ֥ר כְּ/בִרְכָת֖/וֹ בֵּרַ֥ךְ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: fr
  text: 'Tous ceux-là sont les douze tribus d’Israël. C’est ce que leur père leur dit en les bénissant : il bénit chacun selon sa bénédiction.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun selon sa bénédiction, il les bénit ».'
    reason: La note signale la tournure distributive et la répétition du verbe « bénir » dans l’hébreu, tandis que le texte conserve « selon sa bénédiction ».
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Rend directement le démonstratif collectif et renvoie naturellement, en français, aux fils qui viennent d’être nommés.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: les douze tribus d’Israël
  rationale: Formulation française consacrée et naturelle, qui conserve le rapport de construction et le nombre.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: Voilà ce que leur père leur dit
  rationale: « Voilà ce que » résume le discours précédent; « dit » rend דִּבֶּר de façon idiomatique sans suggérer qu’il aurait parlé au-dessus d’eux.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: en les bénissant
  rationale: Exprime naturellement le lien explicatif entre les paroles du père et l’acte de bénir, sans faire de la bénédiction un épisode distinct.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif désigne ici chacun des fils; « chacun » est précis et naturel.
- source_word: כְּבִרְכָתוֹ
  choice: d’une bénédiction qui lui convenait
  rationale: Le כ comparatif/normatif signifie littéralement « selon sa bénédiction »; la formulation choisie communique en français une bénédiction propre et adaptée à chacun.
- source_word: בֵּרַךְ אֹתָם
  choice: il bénit
  rationale: Conserve le verbe central ברך et la fonction récapitulative de la clause finale.
theological_decisions:
- issue: Nature des paroles adressées aux fils
  choice: Les présenter comme une bénédiction propre à chacun, sans en gommer le contenu parfois sévère ou prophétique
  alternative: Employer « selon sa bénédiction » de manière strictement littérale
  rationale: Le texte qualifie l’ensemble de bénédiction tout en rapportant des paroles diverses. La traduction préserve cette tension sans définir théologiquement la nature de chaque oracle.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en évidence le résumé narratif. Le marqueur [a] figure dans le texte principal et renvoie à une note explicitant la formulation hébraïque.
