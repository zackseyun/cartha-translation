  text: נַפְתָּלִ֖י אַיָּלָ֣ה שְׁלֻחָ֑ה הַ/נֹּתֵ֖ן אִמְרֵי שָֽׁפֶר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: fr
  text: Nephtali est une biche en liberté[a] ; il prononce de belles paroles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une biche relâchée » ; l’image hébraïque est celle d’un cervidé femelle laissé libre de courir.'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition a reçu diverses interprétations, anciennes et modernes. Le participe masculin peut se rapporter à Nephtali : « il prononce de belles paroles ». Certains rattachent autrement la proposition à l’image de la biche ou, en donnant un autre sens aux derniers mots, y voient « de beaux faons ».'
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: אַיָּלָה
  choice: biche
  rationale: Le nom désigne un cervidé femelle ; « biche » conserve naturellement l’image féminine en français.
- source_word: שְׁלֻחָה
  choice: en liberté
  rationale: Le participe passif évoque ici une biche relâchée, libre de courir ; cette formulation est concise et idiomatique.
- source_word: הַנֹּתֵן
  choice: il prononce
  rationale: Le participe masculin singulier renvoie vraisemblablement à Nephtali plutôt qu’au nom féminin « biche ». Une proposition distincte préserve ce changement grammatical sans lourdeur.
- source_word: אִמְרֵי
  choice: paroles
  rationale: Le pluriel construit désigne des paroles ou des propos ; « paroles » convient au registre poétique.
- source_word: שָׁפֶר
  choice: belles
  rationale: Le terme exprime la beauté ou l’agrément ; « belles » est clair, naturel et digne.
theological_decisions:
- issue: Référent du participe masculin dans la dernière proposition
  choice: « il prononce de belles paroles », avec Nephtali comme sujet
  alternative: Rattacher la proposition à l’image de la biche ou comprendre les derniers mots comme une allusion à de beaux faons.
  rationale: Le texte hébreu est elliptique. Le masculin הַנֹּתֵן s’accorde naturellement avec Nephtali, tandis que la vocalisation massorétique אִמְרֵי שָׁפֶר appuie le sens de « belles paroles ». La note conserve toutefois l’ambiguïté ancienne de l’image.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le point-virgule et le pronom masculin rendent perceptible le passage de l’image féminine de la biche à Nephtali comme sujet possible de la dernière proposition.
