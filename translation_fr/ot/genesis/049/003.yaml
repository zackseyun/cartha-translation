  text: רְאוּבֵן֙ בְּכֹ֣רִ/י אַ֔תָּה כֹּחִ֖/י וְ/רֵאשִׁ֣ית אוֹנִ֑/י יֶ֥תֶר שְׂאֵ֖ת וְ/יֶ֥תֶר עָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: fr
  text: Ruben, tu es mon premier-né, ma force et les prémices de ma vigueur[a], supérieur en dignité et supérieur en puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le commencement de ma force »; l’expression hébraïque évoque la première manifestation de la vigueur génératrice d’un père.
    reason: lexical_alternative
  - marker: b
    text: Ou « prééminent en dignité et prééminent en puissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: mon premier-né
  rationale: Le terme désigne le fils né le premier tout en évoquant son rang familial et ses droits; « mon premier-né » conserve ces deux dimensions.
- source_word: כֹּחִי
  choice: ma force
  rationale: כֹּחַ signifie couramment « force » ou « puissance ». « Ma force » est naturel dans l’adresse poétique et maintient le parallélisme du verset.
- source_word: רֵאשִׁית אוֹנִי
  choice: les prémices de ma vigueur[a]
  rationale: L’expression désigne la première manifestation de la vigueur génératrice du père. « Les prémices » exprime la primauté, tandis que « vigueur » préserve la portée physique et potentiellement sexuelle de אוֹן sans devenir clinique.
- source_word: יֶתֶר שְׂאֵת
  choice: supérieur en dignité
  rationale: יֶתֶר exprime ici la supériorité ou la prééminence; שְׂאֵת évoque l’élévation, le rang ou la dignité. La formulation garde cette force comparative.
- source_word: יֶתֶר עָז
  choice: supérieur en puissance
  rationale: יֶתֶר conserve le même sens comparatif que dans le membre précédent, et עָז désigne la force ou la puissance. La répétition de « supérieur » reproduit le parallélisme hébreu.
- source_word: אַתָּה
  choice: tu es
  rationale: Le pronom indépendant est explicite et emphatique; « tu es » rend clairement l’adresse directe en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse directe d’un père à son fils. « Prémices » conserve la densité de l’image hébraïque, éclairée par une note; la répétition de « supérieur » restitue le parallélisme sans atténuer la comparaison.
