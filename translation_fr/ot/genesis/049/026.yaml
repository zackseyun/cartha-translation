source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: fr
  text: Les bénédictions de ton père surpassent celles de mes ancêtres[a], jusqu’aux confins des collines antiques[b]. Qu’elles reposent sur la tête de Joseph, sur le sommet de la tête de celui qui a été mis à part de ses frères[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de mes parents » ; l’hébreu peut aussi désigner des ancêtres ou des progéniteurs.
    reason: Portée lexicale de הוֹרַי.
  - marker: b
    text: 'Expression hébraïque difficile. On peut aussi comprendre : « jusqu’au désir des collines éternelles » ; ou « collines éternelles » plutôt que « collines antiques ».'
    reason: Préserver l’ambiguïté de תַּאֲוַת et la nuance de עוֹלָם.
  - marker: c
    text: Ou « le prince parmi ses frères » ; le terme hébreu désigne fondamentalement une personne consacrée ou mise à part.
    reason: Autre interprétation possible de נְזִיר אֶחָיו.
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: les bénédictions de ton père
  rationale: Le pluriel exprime l’ensemble des bienfaits accordés, et le suffixe de deuxième personne désigne Jacob comme le père de Joseph.
- source_word: גָּבְרוּ עַל
  choice: surpassent
  rationale: Le verbe גבר suivi de עַל marque ici la supériorité ; « surpassent » rend clairement et naturellement cette comparaison.
- source_word: בִּרְכֹת הוֹרַי
  choice: celles de ceux qui m’ont engendré
  rationale: הוֹרַי désigne littéralement ceux qui ont engendré Jacob. Cette formulation conserve le pluriel et évite de limiter nécessairement le sens à ses seuls père et mère.
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: elles s’étendent jusqu’aux richesses des collines antiques
  rationale: La proposition explicite naturellement l’étendue des bénédictions. Dans cette expression poétique difficile, תַּאֲוַת est compris comme les biens désirables ou les richesses, et עוֹלָם comme l’ancienneté immémoriale des collines.
- source_word: תִּהְיֶיןָ לְרֹאשׁ
  choice: Qu’elles reposent sur la tête
  rationale: Dans le contexte d’une bénédiction, l’imparfait a une valeur de souhait ou de proclamation. « Reposent sur » rend l’image de bénédictions placées sur la tête.
- source_word: קָדְקֹד
  choice: le sommet de la tête
  rationale: Le terme désigne le haut ou la couronne de la tête ; cette expression française reste claire et maintient le parallélisme avec רֹאשׁ.
- source_word: נְזִיר אֶחָיו
  choice: celui qui a été mis à part de ses frères
  rationale: נְזִיר évoque fondamentalement une personne séparée ou consacrée. Ce rendu convient à l’histoire de Joseph sans introduire anachroniquement l’institution ultérieure du naziréat ni réduire le terme à un titre politique.
theological_decisions:
- issue: Sens du titre נְזִיר אֶחָיו appliqué à Joseph
  choice: celui qui a été mis à part de ses frères
  alternative: le prince parmi ses frères ; celui qui est consacré parmi ses frères
  rationale: « Mis à part » préserve à la fois la séparation vécue par Joseph et son statut distinctif, sans trancher indûment entre consécration religieuse et prééminence sociale.
- issue: Portée de הוֹרַי
  choice: ceux qui m’ont engendré
  alternative: mes parents ; les montagnes antiques selon une autre tradition textuelle ancienne
  rationale: Le texte massorétique fourni porte « ceux qui m’ont engendré ». La variante liée aux montagnes est signalée sans remplacer silencieusement la lecture hébraïque reçue.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible tout en conservant le parallélisme de la bénédiction. Les notes rendent visibles les difficultés textuelles et lexicales sans surcharger le verset.
