    reason: Préserver l’ambiguïté de תַּאֲוַת et la nuance de עוֹלָם.
  - marker: c
    text: Ou « le prince parmi ses frères » ; le terme hébreu désigne fondamentalement une personne consacrée ou mise à part.
    reason: Autre interprétation possible de נְזִיר אֶחָיו.
  revision_rationale: La révision supprime une assertion textuelle non étayée, remplace une interprétation trop déterminée de l’expression poétique par un rendu spatial idiomatique, et améliore la naturalité de la référence aux ancêtres de Jacob. Les alternatives importantes demeurent signalées en notes, sans résoudre indûment l’ambiguïté du texte.
