  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: fr
  text: 'Puis il leur donna cet ordre et leur dit : « Je vais être réuni aux miens.[a] Enterrez-moi auprès de mes pères dans la grotte qui se trouve dans le champ d’Éfrôn le Hittite, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis sur le point d’être réuni aux miens. » L’expression hébraïque désigne la mort imminente et le fait de rejoindre les siens, notamment les ancêtres, dans la mort.'
    reason: Alternative lexicale et explication d’un idiome hébreu.
lexical_decisions:
- source_word: וַיְצַו אֹותָם
  choice: il leur donna cet ordre
  rationale: Le verbe צוה exprime un ordre ou une directive solennelle. Cette formulation est naturelle en français moderne et conserve sa force.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: introduit par les deux-points
  rationale: Après « il leur donna cet ordre », rendre séparément « et il leur dit » serait lourd en français. Les deux-points introduisent naturellement les paroles sans perte de contenu communicatif.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: Je vais être réuni aux miens
  rationale: Le passif préserve l’image hébraïque, tandis que « je vais » exprime l’imminence indiquée par le contexte. « Aux miens » rend naturellement l’appartenance familiale et collective de עַמִּי.
- source_word: קִבְרוּ אֹתִי
  choice: Enterrez-moi
  rationale: L’impératif pluriel est rendu directement et avec naturel.
- source_word: אֶל־אֲבֹתָי
  choice: auprès de mes pères
  rationale: « Auprès de » convient au contexte d’ensevelissement tout en conservant « mes pères », qui désigne les ancêtres patriarcaux.
- source_word: הַמְּעָרָה אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: la grotte qui se trouve dans le champ d’Éfrôn
  rationale: Cette traduction conserve la proposition relative et le sens spatial précis sans ajouter « funéraire », absent du texte.
- source_word: הַחִתִּי
  choice: le Hittite
  rationale: Désignation ethnique conventionnelle et claire en français.
theological_decisions:
- issue: Sens de « être réuni aux siens »
  choice: Conserver l’expression imagée « être réuni aux miens »
  alternative: « Je vais mourir »
  rationale: L’idiome évoque la mort et le fait de rejoindre son peuple ou ses ancêtres, sans définir plus précisément l’état après la mort. Le conserver maintient la portée familiale et théologique du texte sans la réduire ni la systématiser.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « il leur donna cet ordre » évite la redondance peu naturelle de « il leur donna cet ordre et leur dit ». « Éfrôn » suit une translittération française lisible. La virgule finale est maintenue puisque la phrase se poursuit au verset suivant.
