    rationale: Le שתי-points introduisent certes le discours de façon idiomatique, mais le מקור comporte explicitement וַיֹּאמֶר אֲלֵהֶם après וַיְצַו אֹתָם. Dans une traduction d’équivalence optimale, il est préférable de rendre les deux verbes narratifs.
