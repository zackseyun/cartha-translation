  to: 'Puis il leur donna cet ordre et leur dit : « Je vais être réuni aux miens.[a] Enterrez-moi auprès de mes pères dans la grotte qui se trouve dans le champ d’Éfrôn le Hittite, »'
  rationale: La révision rétablit la coordination explicite entre le commandement et la parole rapportée, sans modifier le sens du passage. Elle conserve l’idiome de la réunion « aux miens », ainsi que la virgule finale requise par la continuité syntaxique avec le verset suivant.
