  text: דָּ֖ן יָדִ֣ין עַמּ֑/וֹ כְּ/אַחַ֖ד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: fr
  text: Dan jugera son peuple comme l’une des tribus d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dan défendra les droits de son peuple » ; le verbe hébreu peut évoquer le fait de défendre quelqu’un ou de lui faire justice, et non seulement celui de prononcer un jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: Dan
  rationale: Nom propre du fils de Jacob et de la tribu issue de lui, selon la forme française traditionnelle. Le nom fait écho au verbe יָדִין (« jugera »), jeu de mots que le français ne peut reproduire pleinement.
- source_word: יָדִין
  choice: jugera
  rationale: Imparfait qal à valeur prédictive de דין. « Jugera » conserve le sens courant d’exercer le jugement ou l’autorité, tout en maintenant autant que possible le lien lexical avec le nom Dan. Le verbe peut aussi évoquer le fait de défendre les droits ou de rendre justice.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Traduction directe de עם avec suffixe masculin singulier. Dans le contexte, l’expression désigne vraisemblablement ceux qui appartiennent à la tribu de Dan, sans qu’il soit nécessaire de l’expliciter dans le texte.
- source_word: כְּאַחַד
  choice: comme l’une
  rationale: Le כ comparatif suivi de אחד établit une comparaison. L’accord au féminin avec « tribus » produit une formulation française naturelle et exprime que Dan compte parmi les tribus d’Israël.
- source_word: שִׁבְטֵי
  choice: des tribus
  rationale: Le pluriel construit de שֵׁבֶט désigne ici sans ambiguïté les tribus, et non des sceptres.
- source_word: יִשְׂרָאֵל
  choice: d’Israël
  rationale: Forme française établie du nom propre désignant ici le peuple constitué des tribus d’Israël.
theological_decisions:
- issue: Nature du rôle attribué à Dan dans la bénédiction
  choice: Dan exercera le jugement ou l’autorité comme une tribu à part entière d’Israël.
  alternative: Dan défendra son peuple ou lui fera justice.
  rationale: דין peut signifier juger et, selon le contexte, défendre les droits ou rendre justice. La comparaison avec les tribus d’Israël favorise « jugera » dans le texte principal, tandis que la note préserve les autres nuances possibles sans trancher au-delà de l’hébreu.
translation_notes:
  register: Français moderne, sobre et digne. « Comme l’une des tribus » est naturel tout en restant proche de la construction hébraïque. Le jeu de mots entre Dan et le verbe hébreu traduit par « jugera » demeure perceptible seulement de façon limitée en français.
