  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: fr
  text: 'par le Dieu de ton père[a], qui t’aidera, et par le Tout-Puissant, qui te bénira : bénédictions du ciel, là-haut, bénédictions de l’abîme qui repose en bas[b], bénédictions des seins et de la matrice.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la part du Dieu de ton père… et avec le Tout-Puissant ». Les prépositions hébraïques et la particule placée devant « le Tout-Puissant » forment une construction condensée, qui peut exprimer la source, l’action ou une apposition étroite.
    reason: alternative_reading
  - marker: b
    text: Ou « de l’abîme tapi en bas ». Le verbe hébreu peut décrire ce qui est couché, reposant ou tapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: par le Dieu de ton père
  rationale: La préposition מִן est syntaxiquement difficile ici. « Par » exprime naturellement l’action ou la source de l’aide, tout en conservant le parallélisme avec le titre divin qui suit.
- source_word: יַעְזְרֶךָ
  choice: qui t’aidera
  rationale: La proposition relative explicite naturellement en français que Dieu est le sujet du verbe, sans modifier la portée prospective de l’imparfait hébreu dans cette bénédiction.
- source_word: וְאֵת שַׁדַּי
  choice: et par le Tout-Puissant
  rationale: La particule אֵת est inhabituelle dans cette construction condensée. « Et par » maintient la coordination et le parallélisme, sans imposer une apposition certaine.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Ce rendu français usuel traduit le titre divin au lieu de le translittérer et convient au registre solennel de la bénédiction.
- source_word: וִיבָרְכֶךָ
  choice: qui te bénira
  rationale: La relative produit une syntaxe française claire et conserve Dieu comme sujet ainsi que la valeur prospective du verbe.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: bénédictions du ciel, là-haut
  rationale: Ce choix conserve le groupe construit et l’image verticale, tout en donnant au parallélisme poétique une formulation naturelle en français.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: les profondeurs étendues en bas
  rationale: « Les profondeurs » évoque les eaux profondes souterraines de תְּהוֹם. « Étendues » rend l’état de repos exprimé par רֹבֶצֶת, tandis que la note conserve l’image possible de l’accroupissement.
- source_word: שָׁדַיִם
  choice: les seins
  rationale: Le pluriel concret désigne la source de nourriture et l’image de fécondité; il est conservé sans euphémisme.
- source_word: רָחַם
  choice: le ventre maternel
  rationale: Dans son association avec les seins, le terme désigne la matrice comme lieu de fécondité. « Ventre maternel » est naturel et digne en français courant.
theological_decisions:
- issue: Rendu du titre divin שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Traduire le titre communique sa valeur traditionnelle en français sans ajouter de précision doctrinale absente du texte.
- issue: Rapport syntaxique entre « le Dieu de ton père » et « le Tout-Puissant »
  choice: deux expressions coordonnées par « par »
  alternative: une source exprimée par « de la part du Dieu de ton père », suivie d’un accompagnement ou d’une apposition avec le Tout-Puissant
  rationale: L’hébreu est fortement condensé. Le texte principal donne une syntaxe française lisible, tandis que la note signale les principales relations possibles sans trancher au-delà des données.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe de Jacob à Joseph. Le parallélisme vertical « là-haut / en bas » et les images concrètes de fécondité sont conservés.
