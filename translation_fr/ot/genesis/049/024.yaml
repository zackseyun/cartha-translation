  source_fidelity: 'La première ligne rend correctement וַתֵּשֶׁב בְּאֵיתָן (« son arc demeura ferme/solide »). En revanche, וַיָּפֹזּוּ exprime plus naturellement un changement produit par l’action des « mains du Puissant de Jacob » qu’un simple état durable : « sont demeurés agiles » affaiblit ce rapport. La finale מִשָּׁם רֹעֶה אֶבֶן יִשְׂרָאֵל est syntaxiquement difficile ; la traduction doit conserver cette difficulté sans imposer l’identification des titres.'
