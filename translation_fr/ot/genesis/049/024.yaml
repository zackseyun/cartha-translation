base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: fr
  text: 'Mais son arc est resté ferme,

    et ses bras ont été rendus agiles

    sous l’action des mains du Puissant de Jacob ;

    c’est de là que viennent le Berger, la Pierre d’Israël.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La fonction de l’expression hébraïque traduite par « c’est de là que viennent » est incertaine. Elle peut être rattachée de diverses façons aux titres qui suivent ; le texte ne précise pas explicitement le rapport entre le Puissant de Jacob, le Berger et la Pierre d’Israël.
    reason: Signaler la difficulté syntaxique réelle de מִשָּׁם sans introduire une explication de l’« aide » ni trancher l’identification ou le rapport des titres.
lexical_decisions:
- source_word: וַתֵּשֶׁב בְּאֵיתָן קַשְׁתּוֹ
  choice: son arc est resté ferme
  rationale: L’expression dit littéralement que son arc « demeura dans la fermeté ». La formulation française conserve l’image de stabilité et de résistance sans devenir obscure.
- source_word: וַיָּפֹזּוּ זְרֹעֵי יָדָיו
  choice: ses bras sont demeurés agiles
  rationale: Le verbe rare évoque ici l’agilité ou la souplesse. « Ses bras » rend naturellement l’expression hébraïque littérale « les bras de ses mains ».
- source_word: אֲבִיר יַעֲקֹב
  choice: le Puissant de Jacob
  rationale: Titre divin traditionnel qui exprime la puissance sans préciser davantage la métaphore.
- source_word: רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: le Berger, la Pierre d’Israël
  rationale: Les deux titres imagés sont conservés directement, avec leur parallélisme et leur densité théologique.
theological_decisions:
- issue: Rapport syntaxique de מִשָּׁם avec les titres « Berger » et « Pierre d’Israël »
  choice: de là vient le Berger, la Pierre d’Israël
  alternative: par le Berger, la Pierre d’Israël
  rationale: Le texte massorétique porte littéralement « de là », mais sa fonction syntaxique est difficile. Le texte principal maintient cette lecture sans identifier explicitement le référent ni harmoniser la construction.
- issue: Identification du « Berger » et de la « Pierre »
  choice: conserver les titres sans explicitation
  alternative: les développer en une désignation interprétative de Dieu ou d’un descendant à venir
  rationale: Le verset laisse subsister une tension quant au rapport précis entre ces titres, le Puissant de Jacob et Joseph. Une explicitation doctrinale dépasserait le texte.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme du verset est rendu en lignes brèves ; les métaphores de l’arc, des mains, du Berger et de la Pierre sont préservées.
