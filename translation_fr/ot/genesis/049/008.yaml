source:
  edition: WLC
  text: יְהוּדָ֗ה אַתָּה֙ יוֹד֣וּ/ךָ אַחֶ֔י/ךָ יָדְ/ךָ֖ בְּ/עֹ֣רֶף אֹיְבֶ֑י/ךָ יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֥י אָבִֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: fr
  text: Juda[a], tes frères te loueront ; ta main sera sur la nuque de tes ennemis ; les fils de ton père se prosterneront devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « te rendront grâce » ou « te reconnaîtront ». Il forme ici un jeu de mots avec le nom de Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Juda
  rationale: Nom propre rendu selon la forme française traditionnelle et courante.
- source_word: יוֹדוּךָ
  choice: te loueront
  rationale: Le hiphil de ידה exprime ici la louange ou la reconnaissance honorifique. « Te loueront » convient à la bénédiction et préserve le jeu étymologique perceptible en hébreu avec le nom Juda, signalé en note.
- source_word: אַחֶיךָ
  choice: tes frères
  rationale: Le masculin pluriel avec suffixe de deuxième personne du singulier désigne ici les fils de Jacob, frères de Juda.
- source_word: יָדְךָ
  choice: ta main
  rationale: L’image concrète de la main, exprimant la puissance et la maîtrise, est conservée.
- source_word: בְּעֹרֶף אֹיְבֶיךָ
  choice: sur la nuque de tes ennemis
  rationale: עֹרֶף désigne la nuque, et la formulation garde l’image de victoire et de domination sans l’expliciter.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: se prosterneront devant toi
  rationale: Le verbe décrit ici un geste d’hommage et de soumission. « Se prosterner devant » en conserve la force sans lui imposer le sens cultuel d’« adorer ».
- source_word: בְּנֵי אָבִיךָ
  choice: les fils de ton père
  rationale: Traduction formellement proche de l’hébreu, qui désigne les frères de Juda tout en préservant la formulation solennelle de la bénédiction.
theological_decisions:
- issue: Portée de l’hommage exprimé par יִשְׁתַּחֲווּ לְךָ
  choice: Un geste humain de soumission et d’honneur envers Juda
  alternative: Une adoration au sens cultuel
  rationale: Dans la bénédiction adressée à Juda, le contexte familial et royal appelle le sens d’hommage. La traduction conserve toutefois la force du geste sans développer ses possibles prolongements théologiques.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme poétique et les images concrètes de l’hébreu sont conservés. Le futur rend naturellement la portée prophétique de la bénédiction.
