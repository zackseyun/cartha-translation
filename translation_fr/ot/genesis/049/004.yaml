  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: fr
  text: Impétueux comme les eaux[a], tu n’auras pas la prééminence, car tu es monté sur le lit de ton père. Alors tu l’as profané — il est monté sur ma couche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait traduire plus librement la fin : « alors tu as profané ma couche — tu y es monté ». Dans la dernière proposition, l’hébreu passe brusquement à la troisième personne : « il est monté »; il peut s’agir d’une reprise exclamative au sujet de Ruben.'
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: Impétueux
  rationale: Le nom évoque une fougue incontrôlée, l’instabilité ou la témérité. « Impétueux » s’accorde naturellement avec l’image des eaux et conserve la portée morale du reproche.
- source_word: כַּמַּיִם
  choice: comme les eaux
  rationale: Le pluriel collectif « les eaux » rend naturellement מַיִם en français et suggère leur mouvement impossible à contenir.
- source_word: אַל תּוֹתַר
  choice: tu n’auras pas la prééminence
  rationale: Dans le contexte des privilèges du premier-né, יתר désigne ici la supériorité ou le rang prééminent que Ruben ne conservera pas.
- source_word: כִּי עָלִיתָ
  choice: car tu es monté
  rationale: Cette formulation maintient la valeur causale de כִּי et l’euphémisme transparent du verbe עלה sans expliciter davantage l’acte.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: sur le lit de ton père
  rationale: Le pluriel morphologique hébreu désigne ici la couche conjugale du père; le singulier est idiomatique en français.
- source_word: אָז
  choice: Alors
  rationale: Le terme marque de manière concise la suite et la conséquence de l’acte.
- source_word: חִלַּלְתָּ
  choice: tu l’as profané
  rationale: חלל signifie profaner ou souiller. « Profané » conserve la gravité de l’atteinte portée à la couche du père, sans ajouter une explicitation absente de l’hébreu.
- source_word: יְצוּעִי
  choice: ma couche
  rationale: « Ma couche » rend le suffixe de première personne et distingue naturellement ce terme du précédent « lit ».
- source_word: עָלָה
  choice: il est monté
  rationale: La forme massorétique est à la troisième personne masculine du singulier. La conserver préserve la rupture abrupte et l’ambiguïté rhétorique du texte.
theological_decisions:
- issue: Euphémisme sexuel et condamnation morale de l’acte de Ruben
  choice: Conserver l’expression « tu es monté sur le lit de ton père » et rendre חלל par « profané »
  alternative: Expliciter par « tu as couché avec la concubine de ton père » ou employer « souillé »
  rationale: L’hébreu formule une accusation intelligible mais euphémistique. La traduction garde ce registre et sa gravité sans importer dans le verset les précisions narratives de Genèse 35.22.
- issue: Rupture de personne dans la proposition finale עָלָה
  choice: 'Maintenir la troisième personne : « il est monté sur ma couche »'
  alternative: 'Lisser à la deuxième personne : « tu es monté sur ma couche »'
  rationale: La forme hébraïque est abruptement à la troisième personne. Le texte principal la respecte, tandis que la note indique la lecture française plus fluide sans résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme oraculaire est conservé, ainsi que l’euphémisme sexuel et la rupture syntaxique finale. « Prééminence » exprime précisément la perte du rang du premier-né, malgré son registre légèrement soutenu.
