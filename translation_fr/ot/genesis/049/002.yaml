  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: fr
  text: Rassemblez-vous et écoutez, fils de Jacob ; écoutez Israël, votre père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: Rassemblez-vous
  rationale: L’impératif nifal pluriel de קבץ appelle les fils à se réunir. « Rassemblez-vous » conserve la nuance réfléchie et reste naturel en français moderne.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: Dans ce contexte d’exhortation, l’impératif demande une écoute attentive plutôt que la simple perception auditive. « Écoutez » rend cette force naturellement.
- source_word: בְּנֵי יַעֲקֹב
  choice: fils de Jacob
  rationale: L’hébreu désigne explicitement les fils de Jacob, réunis ici pour recevoir ses paroles ; le masculin est donc conservé.
- source_word: שִׁמְעוּ אֶל
  choice: écoutez
  rationale: La construction avec אֶל introduit la personne à laquelle il faut prêter attention. En français, « écoutez Israël » est idiomatique et préserve la répétition du commandement.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé. Son emploi en parallèle avec « Jacob » maintient la structure poétique et la portée du double nom.
- source_word: אֲבִיכֶם
  choice: votre père
  rationale: La construction possessive est rendue directement et placée en apposition après « Israël », conformément à l’ordre et au sens de l’hébreu.
theological_decisions:
- issue: Rendu des noms parallèles Jacob et Israël
  choice: 'Conserver distinctement les deux noms : « fils de Jacob … Israël, votre père »'
  alternative: Uniformiser les deux occurrences sous un seul nom pour fluidifier le texte
  rationale: Le texte hébreu emploie délibérément les deux noms dans une construction parallèle. Les conserver évite d’effacer leur résonance poétique et théologique.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « écoutez » est maintenue comme procédé d’insistance. La virgule après « Israël » clarifie l’apposition « votre père ».
