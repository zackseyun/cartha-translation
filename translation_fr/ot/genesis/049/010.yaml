id: GEN.49.10
reference: Genesis 49:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: fr
  text: 'Le sceptre ne s’éloignera pas de Juda,

    ni le bâton de commandement d’entre ses pieds,

    jusqu’à ce que vienne Shilo[a] ;

    et les peuples lui obéiront[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce que vienne celui à qui il appartient ». L’hébreu Shilo est difficile ; il a aussi été compris comme un titre, un nom de lieu ou une allusion à un tribut.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « et à lui se rassembleront les peuples », ou « et à lui sera la soumission des peuples ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: sceptre
  rationale: Dans ce contexte royal et en parallèle avec מְחֹקֵק, le mot désigne l’emblème de l’autorité plutôt qu’une simple verge ou la tribu elle-même.
- source_word: מִיהוּדָה
  choice: de Juda
  rationale: 'La préposition exprime ici l’éloignement ou la séparation : le sceptre ne s’éloignera pas de Juda.'
- source_word: מְחֹקֵק
  choice: bâton de commandement
  rationale: Le terme peut désigner celui qui décrète ou l’insigne de son autorité. Le parallélisme avec « sceptre » et la mention « d’entre ses pieds » favorisent ici le sens concret d’un bâton symbolisant le pouvoir.
- source_word: מִבֵּין רַגְלָיו
  choice: d’entre ses pieds
  rationale: La formulation concrète de l’hébreu est conservée sans la remplacer par une interprétation telle que « parmi ses descendants ».
- source_word: עַד כִּי
  choice: jusqu’à ce que
  rationale: Cette tournure introduit naturellement en français le terme de la situation décrite auparavant.
- source_word: שילה
  choice: Shilo
  rationale: La forme hébraïque est particulièrement difficile. La translittération préserve la lecture traditionnelle comme nom propre sans trancher dans le texte principal entre les diverses analyses possibles.
- source_word: וְלוֹ
  choice: lui
  rationale: Dans la lecture principale où Shilo renvoie à une personne, le pronom est rendu personnellement, sans préciser davantage son identité.
- source_word: יִקְּהַת
  choice: obéiront
  rationale: Ce mot rare et discuté évoque ici, dans un cadre royal, l’obéissance ou la soumission des peuples. La tournure verbale donne un français naturel tout en laissant les autres possibilités en note.
- source_word: עַמִּים
  choice: les peuples
  rationale: « Peuples » rend directement le pluriel hébreu et conserve sa vaste portée collective sans le préciser en « nations ».
theological_decisions:
- issue: Identité et interprétation de שילה dans un passage traditionnellement lu comme messianique
  choice: Conserver « Shilo » comme nom translittéré dans le texte principal, sans identifier explicitement son référent.
  alternative: « celui à qui il appartient » ; « jusqu’à ce que le tribut lui soit apporté » ; « jusqu’à ce qu’il vienne à Shilo »
  rationale: Cette solution respecte la difficulté réelle du texte hébreu et maintient sa tension théologique. Elle permet une lecture messianique dans le cadre canonique sans l’inscrire explicitement dans la traduction elle-même.
- issue: Portée royale ou messianique du verset
  choice: Employer un vocabulaire royal — « sceptre », « bâton de commandement », obéissance des peuples — sans paraphrase doctrinale.
  alternative: Une lecture uniquement dynastique et politique, ou une paraphrase explicitement messianique.
  rationale: Les images royales appartiennent clairement au texte. Les reproduire sans nommer le personnage préserve à la fois leur force et l’ambiguïté du verset.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme du vers hébreu est conservé, tandis que la dernière proposition est formulée verbalement pour rester naturelle et immédiatement compréhensible.
