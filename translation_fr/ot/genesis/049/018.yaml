  text: For your salvation I wait[a], O Yahweh.
translation:
  language: fr
  text: J’attends ton salut[a], Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai attendu ta délivrance, Yahweh. » Le mot hébreu peut désigner le salut ou la délivrance, et la forme verbale peut aussi être rendue par un passé composé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: ton salut
  rationale: Le nom יְשׁוּעָה désigne le salut ou la délivrance. « Salut » conserve ici la portée large de cette brève déclaration poétique, sans la limiter à un secours militaire. La préposition ל est rendue naturellement par la construction française « attendre » avec un complément direct.
- source_word: קִוִּיתִי
  choice: j’attends
  rationale: Le verbe קוה exprime une attente confiante, orientée vers l’espoir. Le présent français rend cette attente actuelle et continue; « j’ai attendu » reste possible en raison de la forme accomplie hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme YHWH. « Yahweh » préserve le nom propre présent dans l’hébreu sans le remplacer par un titre.
- issue: Portée de יְשׁוּעָה
  choice: salut
  alternative: délivrance
  rationale: « Salut » garde la portée existentielle et théologique du terme, tandis que « délivrance » mettrait davantage l’accent sur un secours concret. Le contexte très bref ne permet pas de restreindre davantage le sens.
translation_notes:
  register: Français moderne, sobre et poétique. La syntaxe naturelle « J’attends ton salut » est préférée à une antéposition plus marquée, tout en conservant la brièveté et la tension d’attente du texte hébreu.
