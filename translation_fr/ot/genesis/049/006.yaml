  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: fr
  text: Que mon âme n’entre pas dans leur conseil[a] ! Que mon honneur[b] ne se joigne pas à leur assemblée ! Car, dans leur colère, ils ont tué un homme, et, selon leur bon plaisir, ils ont coupé les jarrets d’un bœuf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leur conseil secret » ; סוֹד peut désigner un cercle intime ou confidentiel réuni en conseil.
    reason: lexical_alternative
  - marker: b
    text: Ou « que ma gloire ne s’unisse pas à leur assemblée ».
    reason: lexical_alternative
  - marker: c
    text: 'Le texte hébreu massorétique porte « bœuf ». Selon une autre lecture, on pourrait traduire : « ils ont démoli un mur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: dans leur conseil
  rationale: סוֹד désigne ici un cercle intime ou confidentiel réuni pour délibérer. « Conseil » convient au parallélisme avec קָהָל sans imposer l’idée de secret, qui demeure signalée en note.
- source_word: תָּבֹא נַפְשִׁי
  choice: que mon âme n’entre pas
  rationale: La tournure avec אַל exprime un souhait négatif. Le maintien de « mon âme » conserve l’image et la force poétique de l’hébreu.
- source_word: בִּקְהָלָם
  choice: leur assemblée
  rationale: קָהָל désigne un groupe rassemblé. « Assemblée » est naturel en français et préserve le parallélisme avec « conseil ».
- source_word: תֵּחַד כְּבֹדִי
  choice: que mon honneur ne se joigne pas
  rationale: Le verbe exprime ici l’union ou l’association. « Mon honneur » rend כְּבוֹדִי comme la dignité ou la réputation personnelle de Jacob, tandis que « ma gloire » reste une possibilité lexicale signalée en note.
- source_word: בְאַפָּם
  choice: dans leur colère
  rationale: אַף a ici son sens idiomatique de colère. La formulation française est directe et conserve la construction du texte.
- source_word: הָרְגוּ אִישׁ
  choice: ils ont tué un homme
  rationale: Le singulier אִישׁ est conservé plutôt que généralisé, ce qui respecte la formulation poétique et son probable renvoi aux événements de Sichem.
- source_word: וּבִרְצֹנָם
  choice: selon leur bon plaisir
  rationale: רָצוֹן peut désigner la volonté ou le plaisir. Dans ce contexte négatif, « selon leur bon plaisir » exprime une action délibérée et arbitraire sans ajouter un motif absent de l’hébreu.
- source_word: עִקְּרוּ
  choice: ils ont coupé les jarrets
  rationale: Avec un bovin pour objet, עקר décrit vraisemblablement l’action de rendre l’animal infirme en lui coupant les tendons des jarrets. Cette expression est plus claire en français courant que le verbe technique « éjarreter ».
- source_word: שׁוֹר
  choice: un bœuf
  rationale: Le texte massorétique vocalise le terme comme שׁוֹר, « bœuf » ou « taureau ». « Bœuf » est le terme français général et traditionnel qui convient à la collocation avec l’action de couper les jarrets.
theological_decisions:
- issue: Sens de כְּבוֹדִי dans la formule poétique par laquelle Jacob se désolidarise de la violence
  choice: mon honneur
  alternative: ma gloire
  rationale: « Mon honneur » communique naturellement la dignité et la réputation personnelles de Jacob sans charger le mot d’un sens théologique ultérieur. L’autre sens courant de כָּבוֹד, « gloire », est conservé en note.
- issue: Interprétation de שׁוֹר dans le dernier membre du verset
  choice: un bœuf
  alternative: un mur
  rationale: La vocalisation massorétique donne « bœuf », et son association avec עקר soutient l’idée de mutiler un animal. Une lecture menant à « mur » est néanmoins assez ancienne et notable pour être signalée sans remplacer le texte massorétique.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux souhaits négatifs gardent leur parallélisme et leur intensité grâce à la tournure « Que… ne… pas ! ». « Couper les jarrets » privilégie la clarté concrète sur le terme rare « éjarreter ».
