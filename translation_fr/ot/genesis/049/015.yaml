  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: fr
  text: Il vit que le lieu de repos était bon[a] et que le pays était agréable. Alors il courba l’épaule pour porter le fardeau et fut astreint au travail forcé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le repos était bon ». Le mot hébreu peut désigner soit le repos, soit un lieu de repos.
    reason: lexical_alternative
  - marker: b
    text: Ou « devint un serviteur soumis à la corvée » ; selon une autre interprétation, « devint tributaire ». L’expression hébraïque désigne une forme de service imposé, mais sa nuance sociale exacte est discutée.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: le lieu de repos
  rationale: Le nom peut désigner le repos ou un lieu de repos. Le parallélisme avec « le pays » favorise ici le sens concret, tout en maintenant l’autre possibilité en note.
- source_word: טוֹב
  choice: bon
  rationale: Ce terme positif général est rendu simplement, sans confondre sa nuance avec celle de נָעֵמָה dans le membre parallèle.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans le contexte de la bénédiction tribale, il s’agit du territoire habité plutôt que de la terre au sens cosmique.
- source_word: נָעֵמָה
  choice: agréable
  rationale: Le mot décrit le caractère plaisant et désirable du pays dans une langue française naturelle et sobre.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: il courba l’épaule
  rationale: Cette formulation conserve l’image corporelle hébraïque d’une personne qui se soumet à une charge.
- source_word: לִסְבֹּל
  choice: pour porter le fardeau
  rationale: Le verbe signifie porter ou supporter une charge. L’ajout explicite de « le fardeau » rend l’image idiomatique et intelligible en français.
- source_word: לְמַס עֹבֵד
  choice: fut astreint au travail forcé
  rationale: מַס désigne couramment une corvée ou une levée de main-d’œuvre. Cette tournure française exprime naturellement la sujétion au travail imposé sans affirmer plus précisément l’esclavage mobilier.
theological_decisions:
- issue: Nature de la sujétion d’Issacar dans le dernier membre
  choice: fut astreint au travail forcé
  alternative: devint un serviteur soumis à la corvée ; devint tributaire
  rationale: Le contexte poétique permet plusieurs nuances sociales, mais מַס désigne le plus naturellement une corvée ou un travail imposé. La traduction principale retient ce sens sans trancher excessivement, et la note conserve les autres lectures possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme poétique et l’image de l’épaule ont été conservés, tandis que le dernier membre a été formulé idiomatiquement. Tous les marqueurs de notes figurent dans le texte.
