  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: fr
  text: 'Juda[b] est un lionceau. Tu es remonté de ta proie, mon fils. Il s’est accroupi, il s’est couché comme un lion, comme une lionne[a] : qui le fera se lever ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un lion puissant ». Le mot hébreu employé ici diffère du terme précédent traduit par « lion »; il peut désigner un lion adulte et vigoureux, et il est aussi traditionnellement rendu par « lionne ».
    reason: lexical_alternative
  - marker: b
    text: L’image du lion appliquée à Juda est souvent mise en relation, dans une lecture typologique, avec les espérances royales et messianiques ultérieures. Dans ce verset, elle concerne directement Juda au sein de la bénédiction de Jacob.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: lionceau
  rationale: L’expression désigne le petit d’un lion. « Lionceau » est naturel en français moderne et conserve l’image animale avec concision.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom personnel et tribal.
- source_word: מִטֶּרֶף
  choice: loin de ta proie
  rationale: טֶרֶף désigne la proie saisie ou déchirée par un prédateur. La préposition מִן marque ici l’éloignement depuis la proie; « loin de » rend clairement ce mouvement sans expliciter davantage la scène.
- source_word: בְּנִי
  choice: mon fils
  rationale: Conservé comme apostrophe directe de Jacob à Juda, sans ajouter d’interjection absente de l’hébreu.
- source_word: עָלִיתָ
  choice: tu es remonté
  rationale: Le verbe exprime un mouvement ascendant accompli. « Es remonté » préserve ce mouvement et le parfait hébreu sans préciser la destination.
- source_word: כָּרַע רָבַץ
  choice: il s’est accroupi, il s’est couché
  rationale: Dans l’image du lion, les deux verbes décrivent l’animal qui s’abaisse puis demeure étendu. La traduction maintient leur distinction ainsi que le passage poétique de la deuxième à la troisième personne.
- source_word: כְּאַרְיֵה
  choice: comme un lion
  rationale: Comparaison directe avec le terme courant pour « lion ».
- source_word: וּכְלָבִיא
  choice: comme une lionne
  rationale: לָבִיא peut désigner un lion adulte et puissant, parfois compris comme une lionne. « Lionne » préserve en français la variation lexicale par rapport à אַרְיֵה, tandis qu’une note signale l’autre possibilité.
- source_word: מִי יְקִימֶנּוּ
  choice: qui le fera se lever ?
  rationale: La forme causative de קום signifie littéralement faire lever. Cette formulation garde l’image du lion couché et évite d’ajouter l’idée interprétative de défi contenue dans « qui osera ».
theological_decisions:
- issue: Portée tribale ou messianique de l’image du lion appliquée à Juda
  choice: Le texte principal présente directement Juda dans la bénédiction de Jacob, sans rendre explicite une interprétation messianique.
  alternative: Lire typologiquement l’image comme annonçant les espérances royales et messianiques ultérieures liées à Juda.
  rationale: Le verset lui-même attribue à Juda la force et l’assurance du lion. Les développements royaux ou messianiques possibles appartiennent à la lecture canonique et ne doivent pas être introduits dans la formulation du texte hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation conserve l’apostrophe « mon fils », le mouvement ascendant, la succession des deux verbes de posture et le changement de personne du texte hébreu. Les répétitions de « lion » sont maintenues pour porter l’image, avec une variation lexicale signalée en note.
