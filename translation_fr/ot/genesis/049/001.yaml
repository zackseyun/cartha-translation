source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: fr
  text: 'Alors Jacob appela ses fils et dit : « Rassemblez-vous, et je vous annoncerai ce qui vous arrivera dans les temps à venir[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la fin des jours ». Selon le contexte, l’expression hébraïque peut aussi avoir une portée eschatologique.
    reason: Préserver la traduction plus littérale et l’ambiguïté théologique de l’expression hébraïque.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Dans ce contexte narratif, קרא signifie appeler ou convoquer. « Appela » est naturel en français et convient avec le complément « ses fils ».
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme désigne ici les fils de Jacob, futurs ancêtres des tribus nommées dans la suite du passage.
- source_word: הֵאָסְפוּ
  choice: Rassemblez-vous
  rationale: L’impératif nifal de אסף invite les fils à se réunir. La forme pronominale française conserve la valeur réfléchie et le ton solennel.
- source_word: וְאַגִּידָה לָכֶם
  choice: et je vous annoncerai
  rationale: Le cohortatif exprime l’intention de Jacob à la suite de l’impératif. « Annoncerai » rend le caractère solennel de cette déclaration sans être archaïque.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: ce qui vous arrivera
  rationale: L’expression avec קרה signifie ce qui arrivera ou surviendra à quelqu’un. Cette formulation est claire et idiomatique en français moderne.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: dans les temps à venir
  rationale: L’expression hébraïque vise ici l’avenir des fils de Jacob et des tribus issues d’eux. Cette traduction garde une portée future générale sans imposer dans le texte principal une interprétation exclusivement eschatologique.
theological_decisions:
- issue: La portée éventuellement eschatologique de בְּאַחֲרִית הַיָּמִים
  choice: dans les temps à venir
  alternative: à la fin des jours
  rationale: L’expression peut désigner simplement une époque future ou prendre, selon le contexte, une portée eschatologique plus marquée. Le contexte immédiat concerne l’avenir des fils et des tribus de Jacob ; le texte principal retient donc une formulation ouverte, tandis que la note conserve la traduction plus littérale et sa possible nuance eschatologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Alors » assure la continuité narrative ; « je vous annoncerai » maintient la solennité du discours. Le marqueur de note est placé immédiatement après l’expression qu’il explique.
