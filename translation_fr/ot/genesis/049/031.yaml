  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: fr
  text: C’est là qu’on a enterré Abraham et sa femme Sara ; c’est là qu’on a enterré Isaac et sa femme Rébecca ; et c’est là que j’ai enterré Léa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: c’est là
  rationale: L’adverbe renvoie au lieu de sépulture décrit précédemment. La tournure « c’est là » est naturelle en français et préserve son insistance par trois répétitions.
- source_word: קָבְרוּ
  choice: on a enterré
  rationale: Le qal accompli à la 3e personne du pluriel a un sujet humain non précisé. Le pronom indéfini « on » conserve cette indétermination sans transformer la construction en passif.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Le nom avec suffixe masculin singulier désigne respectivement la femme d’Abraham et celle d’Isaac ; « sa femme » est l’expression française naturelle.
- source_word: קָבַרְתִּי
  choice: j’ai enterré
  rationale: Le qal accompli à la 1re personne du singulier désigne l’action passée de Jacob. Le passé composé convient au français moderne.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: on a enterré ... on a enterré ... j’ai enterré
  rationale: La répétition du même verbe français reproduit celle de קבר et souligne le lien entre les trois inhumations.
- source_word: שָׂרָה / רִבְקָה / לֵאָה
  choice: Sara / Rébecca / Léa
  rationale: Ces formes correspondent aux graphies bibliques françaises courantes et restent immédiatement reconnaissables.
