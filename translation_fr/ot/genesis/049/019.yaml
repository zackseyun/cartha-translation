  yaml_path: translation/ot/genesis/049/019.yaml
  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: fr
  text: Gad, une bande de pillards l’attaquera ; mais lui les attaquera par-derrière.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, il y a un jeu de mots entre le nom Gad et des mots apparentés signifiant « bande de pillards » et « attaquer » (gad / gedoud / yagoud).
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au talon ». L’expression peut désigner une attaque par-derrière ou une poursuite serrée.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: Gad
  rationale: Nom propre du fils de Jacob et de la tribu issue de lui ; la translittération française traditionnelle est conservée.
- source_word: גְּדוּד
  choice: une bande de pillards
  rationale: Le nom désigne une troupe organisée pour mener des incursions. Cette formulation explicite la nature hostile du groupe, même si le jeu sonore hébreu avec Gad et le verbe גדד ne peut être reproduit naturellement en français.
- source_word: יְגוּדֶנּוּ
  choice: l’attaquera
  rationale: Le verbe décrit ici l’action hostile d’une troupe qui mène une incursion. « Attaquer » exprime clairement l’action réciproque et convient mieux en français que « piller quelqu’un ».
- source_word: וְהוּא
  choice: mais lui, il
  rationale: 'Le waw prend ici une valeur adversative naturelle : Gad, d’abord attaqué, retourne ensuite l’attaque. La dislocation met en relief ce renversement.'
- source_word: יָגֻד
  choice: l’attaquera
  rationale: Le même verbe français est repris afin de rendre la répétition du même radical hébreu et la réciprocité de l’action.
- source_word: עָקֵב
  choice: sur ses arrières
  rationale: Le mot signifie littéralement « talon » et peut évoquer une attaque menée derrière l’adversaire ou à sa poursuite. « Sur ses arrières » conserve cette image tactique sans trancher entièrement entre ces nuances.
