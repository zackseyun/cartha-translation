revisions:
- from: Gad, une bande de pillards l’attaquera ; mais lui, il l’attaquera sur ses arrières.[a][b]
  to: Gad, une bande de pillards l’attaquera ; mais lui les attaquera par-derrière.[a][b]
  rationale: La révision clarifie l’antécédent collectif des pillards au moyen de « les » et remplace « sur ses arrières » par « par-derrière », formulation plus naturelle dans cette construction. La note sur « au talon » préserve explicitement la possibilité que l’image exprime plutôt une poursuite rapprochée. La note lexicale décrit plus exactement la paronomase hébraïque.
