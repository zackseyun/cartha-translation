    text: En hébreu, il y a un jeu de mots entre le nom Gad et des mots apparentés signifiant « bande de pillards » et « attaquer » (gad / gedoud / yagoud).
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au talon ». L’expression peut désigner une attaque par-derrière ou une poursuite serrée.'
    reason: alternative_reading
  revision_rationale: La révision clarifie l’antécédent collectif des pillards au moyen de « les » et remplace « sur ses arrières » par « par-derrière », formulation plus naturelle dans cette construction. La note sur « au talon » préserve explicitement la possibilité que l’image exprime plutôt une poursuite rapprochée. La note lexicale décrit plus exactement la paronomase hébraïque.
