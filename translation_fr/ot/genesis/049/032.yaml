  source_fidelity: Le texte hébreu est une proposition nominale centrée sur מִקְנֵה, « l’acquisition / le bien acquis », suivie de « du champ et de la grotte qui s’y trouve » et de l’indication de provenance « de la part des fils de Heth ». La formulation verbale française est recevable, mais le plus-que-parfait (« avaient été achetés ») ajoute inutilement une antériorité que le verset ne marque pas lui-même.
