  text: The field and the cave that is in it were purchased from the sons of Heth[a][b].
translation:
  language: fr
  text: Le champ et la grotte qui s’y trouve ont été acquis auprès des fils de Heth[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès des Hittites ». L’hébreu dit littéralement « auprès des fils de Heth ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « L’acquisition du champ et de la grotte qui s’y trouve a été faite auprès des fils de Heth. »'
    reason: previous_rendering
lexical_decisions:
- source_word: מִקְנֵה
  choice: avaient été achetés
  rationale: Le nom מִקְנֵה désigne ici ce qui a été acquis par achat. Une tournure verbale au plus-que-parfait rend naturellement en français la proposition nominale hébraïque et rappelle l’achat déjà raconté.
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: Équivalent français courant et précis dans ce contexte foncier.
- source_word: וְהַמְּעָרָה
  choice: et la grotte
  rationale: Traduction directe qui conserve la coordination des deux biens acquis.
- source_word: אֲשֶׁר בּוֹ
  choice: qui s’y trouve
  rationale: La relative situe la grotte dans le champ. Le présent français convient pour décrire cette relation spatiale toujours valable dans le cadre du récit.
- source_word: מֵאֵת
  choice: aux
  rationale: 'Avec le verbe « acheter », le français idiomatique indique le vendeur par « à » : « achetés aux fils de Heth ».'
- source_word: בְּנֵי חֵת
  choice: les fils de Heth
  rationale: Cette formulation conserve l’expression familiale et l’ethnonyme du texte hébreu; « les Hittites » est donné en note comme équivalent contextuel.
