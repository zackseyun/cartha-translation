  text: שִׁמְע֥וֹן וְ/לֵוִ֖י אַחִ֑ים כְּלֵ֥י חָמָ֖ס מְכֵרֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/005.yaml
  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: fr
  text: Siméon et Lévi sont frères ; leurs armes sont des instruments de violence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens du mot hébreu traduit par « leurs armes » est incertain. On pourrait aussi comprendre : « leurs instruments sont des instruments de violence » ; des traductions anciennes ont « leurs demeures ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: Siméon et Lévi
  rationale: Les noms propres suivent leur forme française biblique usuelle, et la conjonction est rendue directement.
- source_word: אַחִים
  choice: sont frères
  rationale: Le nom désigne ici des frères au sens propre, tout en soulignant leur solidarité dans l’action ; le verbe « sont » explicite naturellement la proposition nominale hébraïque.
- source_word: כְּלֵי חָמָס
  choice: leurs armes sont des instruments de violence
  rationale: כְּלֵי peut désigner des objets, des instruments ou des armes. La formulation française conserve à la fois le sens hostile suggéré par חָמָס et le caractère général du terme.
- source_word: מְכֵרֹתֵיהֶם
  choice: leurs armes
  rationale: Ce mot très rare et incertain semble, dans le parallélisme, désigner leurs armes ou instruments. Le choix évite de préciser « épées » au-delà de ce que permet sûrement l’hébreu, tandis que la note signale les autres analyses.
