  yaml_path: translation/ot/genesis/049/012.yaml
  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: fr
  text: Ses yeux sont rouges de vin, et ses dents blanches de lait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ses yeux sont plus sombres que le vin, et ses dents plus blanches que le lait. » L’adjectif hébreu traduit par « rouges » est rare, et la préposition peut exprimer soit la cause (« de »), soit la comparaison (« plus… que »).
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: rougis
  rationale: Cet adjectif rare évoque vraisemblablement la rougeur ou l’éclat sombre des yeux. Dans le contexte de l’abondance de vin au verset précédent et avec un מִן causal, « rougis » rend naturellement l’image en français sans la réduire à l’ivresse.
- source_word: עֵינַיִם
  choice: yeux
  rationale: Traduction directe du nom duel désignant les yeux.
- source_word: מִיָּיִן
  choice: par le vin
  rationale: Le מִן est compris ici comme indiquant la cause. Cette lecture s’accorde avec le contexte immédiat d’une surabondance de vin et avec l’image parallèle du lait.
- source_word: וּלְבֶן
  choice: et … blanchies
  rationale: L’adjectif « blanc » est rendu sous une forme verbale parallèle à « rougis », afin d’exprimer en français naturel l’effet attribué au lait.
- source_word: שִׁנַּיִם
  choice: dents
  rationale: Traduction directe du nom duel désignant les dents.
- source_word: מֵחָלָב
  choice: par le lait
  rationale: Comme dans le premier membre, מִן est compris comme causal, ce qui forme un parallélisme entre les deux signes d’abondance.
