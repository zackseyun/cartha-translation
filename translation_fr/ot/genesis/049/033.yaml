id: GEN.49.33
reference: Genesis 49:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְכַ֤ל יַעֲקֹב֙ לְ/צַוֺּ֣ת אֶת בָּנָ֔י/ו וַ/יֶּאֱסֹ֥ף רַגְלָ֖י/ו אֶל הַ/מִּטָּ֑ה וַ/יִּגְוַ֖ע וַ/יֵּאָ֥סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: fr
  text: Quand Jacob eut fini de donner ses instructions à ses fils, il ramena ses pieds sur le lit, rendit son dernier souffle et fut réuni aux siens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « fut réuni aux siens » est associée à la mort et au fait de rejoindre son peuple ou ses ancêtres; elle ne désigne pas simplement l’ensevelissement.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: eut fini
  rationale: Le verbe כלה marque ici l’achèvement des paroles et directives de Jacob; le passé antérieur exprime naturellement en français l’antériorité immédiate dans le récit.
- source_word: לְצַוֹּת
  choice: de donner ses instructions
  rationale: צוה peut signifier commander, ordonner ou donner des directives. Dans le contexte des dernières paroles de Jacob, cette formulation actuelle conserve l’idée d’autorité sans suggérer que toutes les paroles précédentes étaient uniquement des ordres.
- source_word: בָּנָיו
  choice: à ses fils
  rationale: Le texte hébreu désigne explicitement les fils de Jacob.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: il ramena ses pieds sur le lit
  rationale: Cette formulation rend naturellement le mouvement exprimé par l’hébreu, littéralement « rassembler ses pieds vers le lit », après que Jacob s’était redressé sur le lit (Genèse 48.2).
- source_word: הַמִּטָּה
  choice: le lit
  rationale: מִטָּה peut désigner un lit ou une couche; « lit » est le terme français le plus direct dans cette scène.
- source_word: וַיִּגְוַע
  choice: rendit son dernier souffle
  rationale: גוע décrit le fait d’expirer. Cette expression française en garde la nuance sans la confondre avec la proposition suivante.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: fut réuni aux siens
  rationale: La tournure conserve l’image passive du rassemblement et l’expression hébraïque liée à la mort, tout en restant idiomatique en français. « Aux siens » exprime ici l’appartenance au peuple et aux ancêtres de Jacob.
theological_decisions:
- issue: Sens de « fut réuni aux siens »
  choice: Conserver l’expression idiomatique sans la réduire à l’ensevelissement.
  alternative: « fut enterré avec ses ancêtres » ou « rejoignit ses ancêtres »
  rationale: Jacob n’est enseveli qu’au chapitre suivant. La formule ne peut donc pas être ramenée à une simple mention de sa sépulture; elle laisse ouverte la portée du rassemblement après la mort.
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme séquentiel des trois derniers actes est préservé. « Donner ses instructions » évite le caractère trop administratif de « commander à ses fils », tandis que « fut réuni aux siens » maintient l’ambiguïté théologique de l’idiome hébraïque.
