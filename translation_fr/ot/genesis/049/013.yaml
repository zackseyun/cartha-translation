  text: זְבוּלֻ֕ן לְ/ח֥וֹף יַמִּ֖ים יִשְׁכֹּ֑ן וְ/הוּא֙ לְ/ח֣וֹף אֳנִיּ֔וֹת וְ/יַרְכָת֖/וֹ עַל צִידֹֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: fr
  text: Zabulon habitera au bord des mers[a] ; il sera sur la côte des navires[b], et son flanc[c] sera tourné vers Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le pluriel : « les mers » ; on peut aussi comprendre, de façon idiomatique, « la mer ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « près d’un havre pour les navires ». Littéralement, « sur la côte des navires ».
    reason: lexical_alternative
  - marker: c
    text: Ou « son côté », « sa frontière » ou « son extrémité ». Le terme hébreu peut désigner le côté, le flanc ou la partie la plus éloignée d’un territoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: לְחוֹף יַמִּים
  choice: au bord des mers
  rationale: Conserve le pluriel hébreu יַמִּים et le sens spatial de חוֹף, dans un français naturel.
- source_word: יִשְׁכֹּן
  choice: habitera
  rationale: Rend simplement l’idée de demeurer ou de s’établir, avec la valeur prospective de l’imparfait hébreu dans la bénédiction.
- source_word: לְחוֹף אֳנִיּוֹת
  choice: au bord où viennent les navires
  rationale: Exprime naturellement la relation entre le rivage et les navires sans imposer le terme interprétatif « port » ; l’hébreu dit littéralement « au bord des navires ».
- source_word: וְיַרְכָתוֹ
  choice: son flanc
  rationale: Préserve la métaphore concrète de יַרְכָה, qui peut désigner un côté, une extrémité ou, géographiquement, une partie reculée d’un territoire.
- source_word: עַל צִידֹן
  choice: s’étendra vers Sidon
  rationale: Dans ce contexte géographique, עַל indique probablement l’orientation ou l’extension ; l’ajout verbal « s’étendra » explicite en français la relation elliptique sans la réduire à une frontière technique.
- source_word: צִידֹן
  choice: Sidon
  rationale: Forme française usuelle du nom de lieu.
