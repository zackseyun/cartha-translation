  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיוֹתָ֣/ם כֹּֽאֲבִ֗ים וַ/יִּקְח֣וּ שְׁנֵֽי בְנֵי יַ֠עֲקֹב שִׁמְע֨וֹן וְ/לֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔/וֹ וַ/יָּבֹ֥אוּ עַל הָ/עִ֖יר בֶּ֑טַח וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: fr
  text: Le troisième jour[a], tandis qu’ils souffraient, deux des fils de Jacob, Siméon et Lévi, les frères de Dina, prirent chacun leur épée, s’avancèrent contre la ville alors qu’elle se croyait en sécurité[b] et tuèrent tous les mâles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et il arriva, le troisième jour, alors qu’ils souffraient, que… »'
    reason: previous_rendering
  - marker: b
    text: Ou « s’avancèrent contre la ville avec assurance » ou « en sécurité ». Le mot hébreu peut décrire soit la confiance des assaillants, soit l’état d’une ville qui se croit en sécurité et ne se méfie pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: La tournure française place naturellement le complément temporel en tête et rend la progression narrative de וַיְהִי sans formule archaïque. La formulation hébraïque plus explicite est signalée en note.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: tandis qu’ils souffraient
  rationale: Exprime la circonstance simultanée et la douleur liée au contexte, sans en préciser explicitement la cause.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: deux des fils de Jacob
  rationale: 'Conserve le sens partitif : il s’agit de deux membres du groupe des fils de Jacob.'
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: Siméon et Lévi
  rationale: Formes françaises traditionnelles et largement reconnues de ces noms propres.
- source_word: אֲחֵי דִינָה
  choice: les frères de Dina
  rationale: Rend l’apposition qui précise le lien de Siméon et Lévi avec Dina.
- source_word: אִישׁ חַרְבּוֹ
  choice: prirent chacun leur épée
  rationale: Le distributif אִישׁ indique que chacun prit sa propre épée ; cette formulation est idiomatique en français.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: marchèrent contre la ville
  rationale: La préposition עַל marque ici un mouvement hostile. « Marchèrent contre » conserve cette image sans expliciter davantage l’attaque.
- source_word: בֶּטַח
  choice: alors qu’elle se croyait en sécurité
  rationale: Dans le contexte, l’adverbe peut décrire la ville comme confiante et sans méfiance. La note conserve l’autre rattachement possible, selon lequel il décrit la manière d’avancer des assaillants.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: et tuèrent tous les mâles
  rationale: Rend directement הָרַג, « tuer », et conserve la portée précise de כָּל זָכָר, « tout mâle », sans la limiter aux seuls hommes adultes.
