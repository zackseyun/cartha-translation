source:
  edition: WLC
  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: fr
  text: Dina, la fille de Léa, que Léa avait mise au monde pour Jacob, sortit pour voir les filles du pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour rendre visite aux femmes du pays ». L’hébreu dit littéralement « pour voir les filles du pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: sortit
  rationale: Le qal wayyiqtol de יצא exprime simplement le fait de sortir. « Sortit » rend naturellement le mouvement narratif sans ajouter de lieu de départ.
- source_word: דִינָה
  choice: Dina
  rationale: Forme française courante du nom propre hébreu.
- source_word: בַּת לֵאָה
  choice: fille de Léa
  rationale: Rend directement la construction hébraïque qui identifie Dina par sa mère, dans une apposition naturelle en français.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: que celle-ci avait donnée à Jacob
  rationale: « Celle-ci » lève l’ambiguïté grammaticale que créerait « elle » en français et renvoie clairement à Léa. « Donner un enfant à quelqu’un » est une manière française naturelle et digne d’exprimer ici l’enfantement en relation avec le père; le plus-que-parfait marque l’arrière-plan narratif.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: L’infinitif de ראה signifie littéralement « voir ». La traduction principale conserve ce sens sans imposer l’interprétation sociale possible de « rendre visite ».
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: les filles du pays
  rationale: Cette expression conserve l’image hébraïque de « filles du pays ». Selon le contexte, elle peut désigner plus généralement les jeunes femmes ou les femmes du pays, possibilité signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de l’hébreu tout en évitant une relative française maladroite ou ambiguë. Le marqueur de note est placé après l’expression qu’il explique.
