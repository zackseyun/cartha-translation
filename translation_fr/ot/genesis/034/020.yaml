source:
  edition: WLC
  text: וַ/יָּבֹ֥א חֲמ֛וֹר וּ/שְׁכֶ֥ם בְּנ֖/וֹ אֶל שַׁ֣עַר עִירָ֑/ם וַֽ/יְדַבְּר֛וּ אֶל אַנְשֵׁ֥י עִירָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: fr
  text: 'Hamor et son fils Sichem se rendirent à la porte de leur ville et parlèrent aux hommes de leur ville[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit vraisemblablement des hommes de la ville réunis à la porte pour délibérer des affaires publiques.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: se rendirent
  rationale: Le singulier hébreu ouvre un sujet composé, tandis que la suite emploie le pluriel. « Se rendirent » exprime naturellement le déplacement vers la porte sans imposer le point de vue de « vinrent » ou « allèrent ».
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Le nom propre est translittéré selon une forme française transparente.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: et son fils Sichem
  rationale: Cette formulation française naturelle conserve explicitement le lien filial.
- source_word: אֶל שַׁעַר עִירָם
  choice: à la porte de leur ville
  rationale: Rend littéralement le groupe construit hébreu et son suffixe possessif; la porte est aussi le lieu public où se traitaient les affaires de la ville.
- source_word: וַיְדַבְּרוּ
  choice: parlèrent
  rationale: דבר avec אֶל signifie couramment « parler à » ou « s’adresser à »; « parlèrent » reste proche de la forme hébraïque.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: aux hommes de leur ville
  rationale: אַנְשֵׁי signifie littéralement « hommes de ». Dans ce cadre civique, il s’agit vraisemblablement des hommes de la ville réunis pour délibérer.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: Cette tournure introduit naturellement en français le discours direct qui suit, sans le calque pesant « en disant ».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Se rendirent » évite l’ambiguïté de perspective entre « vinrent » et « allèrent ». La répétition « leur ville » est maintenue pour refléter celle de l’hébreu; « en ces termes » prépare naturellement la citation du verset suivant.
