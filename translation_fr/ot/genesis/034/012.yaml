  text: הַרְבּ֨וּ עָלַ֤/י מְאֹד֙ מֹ֣הַר וּ/מַתָּ֔ן וְ/אֶ֨תְּנָ֔ה כַּ/אֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑/י וּ/תְנוּ לִ֥/י אֶת הַֽ/נַּעֲרָ֖ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: fr
  text: Exigez de moi un paiement matrimonial[a] et un cadeau aussi élevés que vous le voudrez ; je donnerai tout ce que vous me demanderez. Donnez-moi la jeune femme pour épouse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne le paiement matrimonial versé par le futur époux ou sa famille à la famille de la jeune femme, et non les biens apportés par celle-ci au mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: Exigez de moi… aussi élevés que vous voudrez
  rationale: L’impératif pluriel de רבה, accompagné de עָלַי et de מְאֹד, invite les interlocuteurs à fixer une exigence très élevée. Cette formulation française exprime naturellement la force transactionnelle et prépare la proposition suivante.
- source_word: מֹהַר
  choice: dot
  rationale: Le terme désigne ici le paiement matrimonial versé par le futur époux ou sa famille à la famille de la jeune femme. « Dot » est courant en français, mais sa possible ambiguïté est explicitée en note.
- source_word: וּמַתָּן
  choice: et un cadeau
  rationale: מַתָּן désigne un don ou présent ajouté au paiement matrimonial ; le singulier hébreu est conservé.
- source_word: וְאֶתְּנָה
  choice: je donnerai
  rationale: La forme cohortative exprime la volonté résolue du locuteur ; le futur français la rend clairement dans ce discours direct.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: tout ce que vous me demanderez
  rationale: Dans ce contexte de négociation, le verbe « demander » rend naturellement l’idée des conditions ou du montant que les interlocuteurs fixeront.
- source_word: וּתְנוּ לִי
  choice: Donnez-moi seulement
  rationale: Le waw introduit la requête culminante. « Seulement » en explicite sobrement la force discursive sans modifier le contenu de la demande.
- source_word: הַנַּעֲרָ
  choice: la jeune femme
  rationale: Le nom désigne une jeune femme en âge de se marier ; cette expression moderne évite à la fois le caractère potentiellement infantilisant de « fille » et l’archaïsme de « jeune fille » dans certains contextes.
- source_word: לְאִשָּׁה
  choice: pour épouse
  rationale: Formule française concise et naturelle correspondant à l’expression matrimoniale hébraïque.
theological_decisions: []
