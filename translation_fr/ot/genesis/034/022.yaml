source:
  edition: WLC
  text: אַךְ בְּ֠/זֹאת יֵאֹ֨תוּ לָ֤/נוּ הָ/אֲנָשִׁים֙ לָ/שֶׁ֣בֶת אִתָּ֔/נוּ לִ/הְי֖וֹת לְ/עַ֣ם אֶחָ֑ד בְּ/הִמּ֥וֹל לָ֨/נוּ֙ כָּל זָכָ֔ר כַּ/אֲשֶׁ֖ר הֵ֥ם נִמֹּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: fr
  text: 'Les hommes ne consentiront à habiter avec nous et à devenir un seul peuple qu’à cette condition : que tout mâle parmi nous soit circoncis, comme ils sont eux-mêmes circoncis[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « consentiront à notre proposition » ou « se montreront disposés envers nous » ; le verbe hébreu exprime l’accord ou le consentement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: C’est seulement à cette condition
  rationale: La combinaison a ici une valeur restrictive et introduit l’unique condition requise; cette formulation est naturelle en français moderne.
- source_word: יֵאֹתוּ לָנוּ
  choice: accepteront
  rationale: Le nifal de אוה exprime le consentement ou la disposition favorable dans le cadre d’une négociation. « Accepteront » rend ce sens sans préciser davantage l’objet que ne le fait l’hébreu.
- source_word: הָאֲנָשִׁים
  choice: ces hommes
  rationale: Le nom désigne les hommes du groupe dont il vient d’être question; le démonstratif implicite dans le contexte rend la référence claire en français.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: d’habiter avec nous
  rationale: « Habiter avec nous » conserve l’idée de résidence commune et reste courant et digne.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: de devenir un seul peuple
  rationale: La construction exprime l’entrée dans une identité collective unifiée; « peuple » convient mieux que « nation » au contexte clanique.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: que tout mâle parmi nous soit circoncis
  rationale: L’infinitif avec בְּ introduit ici la condition. « Tout mâle » respecte la portée de זָכָר, qui ne se limite pas aux adultes.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: comme ils le sont eux-mêmes
  rationale: Cette formulation préserve la comparaison et l’insistance portée par le pronom הֵם, tout en évitant une répétition lourde de « circoncis ».
