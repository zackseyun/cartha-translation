  text: וַ/יַּעֲנ֨וּ בְנֵֽי יַעֲקֹ֜ב אֶת שְׁכֶ֨ם וְ/אֶת חֲמ֥וֹר אָבִ֛י/ו בְּ/מִרְמָ֖ה וַ/יְדַבֵּ֑רוּ אֲשֶׁ֣ר טִמֵּ֔א אֵ֖ת דִּינָ֥ה אֲחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: fr
  text: Les fils de Jacob répondirent avec ruse à Sichem et à son père Hamor. Ils parlèrent ainsi parce que Sichem avait souillé Dina, leur sœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait violé Dina, leur sœur ». L’hébreu dit littéralement « avait souillé », expression qui conserve le langage moral et rituel du texte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: répondirent
  rationale: Dans ce contexte narratif, le verbe introduit la réponse des fils de Jacob à la proposition précédente.
- source_word: בְנֵי יַעֲקֹב
  choice: Les fils de Jacob
  rationale: Rendu direct et naturel de la construction hébraïque.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: à Sichem et à son père Hamor
  rationale: Le suffixe « son » renvoie à Sichem; cette formulation française identifie clairement Hamor comme son père.
- source_word: בְּמִרְמָה
  choice: avec ruse
  rationale: Le nom מִרְמָה, précédé de ב, a ici une valeur adverbiale et désigne la tromperie ou la ruse.
- source_word: וַיְדַבֵּרוּ
  choice: Ils parlèrent ainsi
  rationale: Cette formulation conserve l'idée distincte de « parler » après « répondre », tout en reliant naturellement le verbe aux paroles du verset suivant.
- source_word: אֲשֶׁר
  choice: parce que
  rationale: Dans la syntaxe et le contexte, la particule introduit la raison de leur réponse trompeuse.
- source_word: טִמֵּא
  choice: avait souillé
  rationale: Le piel de טמא signifie rendre impur ou souiller; « souillé » préserve le champ moral et rituel du terme hébreu.
- source_word: אֲחֹתָם
  choice: leur sœur
  rationale: Rendu direct du nom accompagné du suffixe possessif pluriel.
theological_decisions:
- issue: Portée morale et rituelle de טִמֵּא dans le contexte de violence sexuelle
  choice: avait souillé
  alternative: avait violé
  rationale: « Souillé » maintient la métaphore d'impureté du texte hébreu sans nier la gravité de l'acte; « violé » explicite davantage le contexte, mais déplace le champ lexical.
translation_notes:
  register: Français moderne, international et digne. La division en deux phrases évite une coordination lourde et prépare naturellement les paroles rapportées au verset suivant. « Avec ruse » conserve la forme nominale de l’hébreu tout en restant idiomatique.
