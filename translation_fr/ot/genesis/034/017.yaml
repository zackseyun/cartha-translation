  text: וְ/אִם לֹ֧א תִשְׁמְע֛וּ אֵלֵ֖י/נוּ לְ/הִמּ֑וֹל וְ/לָקַ֥חְנוּ אֶת בִּתֵּ֖/נוּ וְ/הָלָֽכְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: fr
  text: Mais si vous ne nous écoutez pas et ne vous faites pas circoncire[a], nous prendrons notre fille et nous partirons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « si vous ne nous écoutez pas, pour vous faire circoncire ». L’infinitif hébreu peut exprimer le contenu de ce qu’ils demandent d’écouter, c’est-à-dire l’action exigée pour tenir compte de leur demande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Mais si
  rationale: La conjonction relie cette proposition à l’offre précédente tout en introduisant l’éventualité contraire.
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: vous ne nous écoutez pas
  rationale: שׁמע construit avec אֶל signifie ici « écouter » au sens de prêter attention ou tenir compte; « obéir » serait plus fort que la formulation hébraïque.
- source_word: לְ/הִמּוֹל
  choice: et ne vous faites pas circoncire
  rationale: L’infinitif nifal exprime l’action demandée comme contenu concret de l’écoute. La coordination donne en français actuel une formulation naturelle sans transformer la circoncision en simple moyen instrumental.
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: nous prendrons notre fille
  rationale: Le parfait précédé de waw prend ici une valeur future dans la conséquence de la condition. « Prendrons » reste proche de לקח sans préciser davantage la situation de Dina.
- source_word: וְ/הָלָכְנוּ
  choice: et nous partirons
  rationale: Dans ce contexte, הלך indique qu’ils s’en iront; « partirons » est plus naturel en français que le calque « irons ».
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La coordination rend la relation entre « écouter » et « se faire circoncire » de manière idiomatique, tandis que la note conserve l’ambiguïté syntaxique de l’hébreu.
