base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: fr
  text: Le jeune homme ne tarda pas à faire ce qui était demandé[a], car il désirait la fille de Jacob[b], et il était le plus estimé de toute la maison de son père[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à faire la chose ». Autre traduction : « n’hésita pas à le faire ».'
    reason: Le premier rendu explique l’idiome hébraïque; le second signale une nuance contextuelle possible, bien que le verbe désigne principalement le fait de tarder.
  - marker: b
    text: 'Autres traductions : « il prenait plaisir en la fille de Jacob » ou « la fille de Jacob lui plaisait ».'
    reason: Le verbe חָפֵץ couvre le désir, le plaisir et la satisfaction; le contexte ne contraint pas à une seule nuance française.
  - marker: c
    text: 'Ou : « il était plus estimé que tous ceux de la maison de son père ».'
    reason: La construction hébraïque peut être rendue soit par un superlatif, soit par un comparatif explicite.
lexical_decisions:
- source_word: אֵחַר
  choice: ne tarda pas
  rationale: Le verbe exprime d’abord un retard ou une attente; la tournure française indique donc qu’il agit promptement, sans déplacer le sens vers une hésitation intérieure.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: Cette désignation convient à Sichem dans le contexte narratif et reste naturelle en français actuel.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: à faire ce qui avait été demandé
  rationale: Littéralement «faire la chose»; la formulation française explicite sobrement le renvoi à la condition formulée dans les versets précédents, tout en évitant l’expression peu naturelle «faire la chose».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la cause de son empressement; «car» relie naturellement les deux propositions dans ce registre narratif.
- source_word: חָפֵץ
  choice: désirait
  rationale: Le verbe peut exprimer le plaisir, l’attachement ou le désir. Dans ce contexte matrimonial, «désirait» rend nettement sa forte inclination sans préciser davantage sa nature.
- source_word: בְּבַת יַעֲקֹב
  choice: la fille de Jacob
  rationale: Avec חָפֵץ, le complément se rend naturellement sans préposition en français.
- source_word: נִכְבָּד
  choice: le plus estimé
  rationale: Le participe désigne une personne honorée, considérée ou de haut rang. «Estimé» est naturel et conserve la dimension sociale du terme.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: de toute la maison de son père
  rationale: Avec l’adjectif au superlatif, la préposition מן introduit le groupe de comparaison. «Maison de son père» préserve l’expression familiale et sociale hébraïque.
