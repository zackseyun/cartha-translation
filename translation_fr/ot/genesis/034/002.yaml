source:
  edition: WLC
  text: וַ/יַּ֨רְא אֹתָ֜/הּ שְׁכֶ֧ם בֶּן חֲמ֛וֹר הַֽ/חִוִּ֖י נְשִׂ֣יא הָ/אָ֑רֶץ וַ/יִּקַּ֥ח אֹתָ֛/הּ וַ/יִּשְׁכַּ֥ב אֹתָ֖/הּ וַ/יְעַנֶּֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: fr
  text: Sichem, fils de Hamor le Hivvite, chef du pays, la vit, la prit, coucha avec elle et lui fit violence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « l’humilia » ou « la viola ». Dans ce contexte, il désigne une violence sexuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: la vit
  rationale: Rend directement le sens narratif courant de ראה et conserve l’enchaînement verbal du texte hébreu.
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: Sichem, fils de Hamor le Hivvite
  rationale: Emploie les formes françaises traditionnelles des noms bibliques et rend naturellement la filiation ainsi que l’appartenance ethnique.
- source_word: נְשִׂיא הָאָרֶץ
  choice: chef du pays
  rationale: נָשִׂיא désigne ici un dirigeant ou notable de premier rang. « Chef » préserve ce statut politique sans suggérer une royauté héréditaire que le texte ne précise pas.
- source_word: וַיִּקַּח אֹתָהּ
  choice: la prit
  rationale: Conserve le sens de base de לקח et la progression sobre du récit; la violence sexuelle est explicitée par la proposition finale.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: coucha avec elle
  rationale: Expression française naturelle et grave correspondant à l’idiome hébreu désignant une relation sexuelle.
- source_word: וַיְעַנֶּהָ
  choice: lui fit violence
  rationale: Dans ce contexte sexuel, le piel de ענה exprime l’affliction, l’humiliation ou la violation. « Lui fit violence » communique clairement la contrainte et l’atteinte sexuelle tout en conservant une part de l’étendue sémantique du verbe.
theological_decisions:
- issue: Exprimer sans euphémisme la violence sexuelle tout en évitant de réduire la portée du verbe ענה à une seule glose
  choice: « la prit, coucha avec elle et lui fit violence »
  alternative: « la saisit et la viola »; « la prit, coucha avec elle et l’humilia »
  rationale: La séquence hébraïque distingue l’action de prendre, le rapport sexuel et l’acte d’abaissement ou de violation. La formulation retenue maintient cette progression, indique nettement la contrainte et ne fait pas de לקח lui-même un verbe explicitement violent.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe coordonnée reproduit le rythme narratif hébreu. « Lui fit violence » est intelligible aujourd’hui, évite l’euphémisme et préserve mieux que le seul verbe « violer » la tension lexicale entre humiliation, affliction et violation.
