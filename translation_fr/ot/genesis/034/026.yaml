base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: fr
  text: Ils tuèrent aussi Hamor et son fils Sichem à coups d’épée[a], puis ils prirent Dina de la maison de Sichem et sortirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « par la bouche de l’épée », une expression qui signifie tuer au moyen de l’épée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: Ils tuèrent aussi Hamor et son fils Sichem
  rationale: Les marques d’objet ne se traduisent pas directement. « aussi » relie ces morts à celles du verset précédent, tandis que l’ordre français naturel conserve explicitement la relation filiale.
- source_word: הָרְגוּ
  choice: tuèrent
  rationale: Rendu direct et courant de הרג dans un récit au passé simple.
- source_word: לְפִי חָרֶב
  choice: par l’épée
  rationale: Cette expression signifie littéralement « par la bouche de l’épée ». Le texte principal en donne le sens idiomatique naturel, et la note conserve l’image hébraïque.
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: puis ils prirent Dina
  rationale: לקח a ici son sens général de « prendre ». « Puis » exprime naturellement la progression narrative sans renforcer le verbe en « saisir » ou « enlever ».
- source_word: מִבֵּית שְׁכֶם
  choice: dans la maison de Sichem
  rationale: Avec « prendre », le français indique naturellement le lieu d’où Dina est retirée par « dans ». בית désigne vraisemblablement ici l’habitation concrète de Sichem.
- source_word: וַיֵּצֵאוּ
  choice: et sortirent
  rationale: Rendu direct de יצא, qui préserve le mouvement hors de la maison sans préciser une destination absente du texte.
