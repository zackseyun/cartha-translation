- from: Ils tuèrent aussi Hamor et son fils Sichem par l’épée[a], puis ils prirent Dina dans la maison de Sichem et sortirent.
  to: Ils tuèrent aussi Hamor et son fils Sichem à coups d’épée[a], puis ils prirent Dina de la maison de Sichem et sortirent.
  rationale: La correction essentielle remplace « dans la maison » par « de la maison » afin de rendre la préposition hébraïque מן. La formulation concernant l’épée est légèrement idiomatisée en français, et la note conserve l’image lexicale hébraïque.
