  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: fr
  text: Leurs troupeaux, leurs biens et toutes leurs bêtes ne seront-ils pas à nous ? Mettons-nous seulement d’accord avec eux[a], et ils habiteront avec nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Consentons-leur » ; littéralement, « consentons à eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: leurs troupeaux
  rationale: מִקְנֶה désigne collectivement le bétail ou les animaux d’élevage acquis; « troupeaux » est naturel en français et convient au contexte économique.
- source_word: קִנְיָנָם
  choice: leurs biens
  rationale: קִנְיָן désigne ce qui est acquis, donc les biens ou possessions; « biens » conserve la portée matérielle sans restriction excessive.
- source_word: כָל בְּהֶמְתָּם
  choice: toutes leurs bêtes
  rationale: בְּהֵמָה est un terme large pour les animaux, souvent domestiques; « bêtes » évite de répéter « troupeaux » tout en gardant la généralité de כָל.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: ne seront-ils pas à nous ?
  rationale: הֲלוֹא introduit une question rhétorique appelant l’assentiment; le futur français rend ici la conséquence escomptée de l’accord.
- source_word: אַךְ
  choice: seulement
  rationale: אַךְ marque ici une restriction et introduit l’unique condition avancée.
- source_word: נֵאֹותָה לָהֶם
  choice: Acceptons leur proposition
  rationale: La forme exprime l’idée de consentir ou de se montrer disposé envers eux. Dans ce contexte de négociation, « accepter leur proposition » est idiomatique, tout en signalant en note l’expression plus littérale.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: et ils habiteront avec nous
  rationale: יָשַׁב signifie habiter, vivre ou s’établir; « habiter avec nous » conserve le sens spatial et communautaire sans préciser davantage.
theological_decisions: []
