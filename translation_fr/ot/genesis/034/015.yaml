    issue: « Tous les hommes parmi vous » restreint potentiellement la portée de כָּל־זָכָר aux adultes.
    rationale: Le terme hébreu זָכָר désigne le sexe masculin et ne comporte pas en lui-même une limitation d’âge. Une formulation française explicitant « personne de sexe masculin » préserve mieux cette extension.
  - severity: low
    issue: La note emploie elle aussi « tout homme », qui présente la même imprécision potentielle.
    rationale: La variante doit conserver la portée distributive de « chaque mâle » sans risquer de limiter le référent aux hommes adultes.
