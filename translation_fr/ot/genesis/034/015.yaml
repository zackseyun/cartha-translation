source:
  edition: WLC
  text: אַךְ בְּ/זֹ֖את נֵא֣וֹת לָ/כֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔/נוּ לְ/הִמֹּ֥ל לָ/כֶ֖ם כָּל זָכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: fr
  text: 'Nous ne donnerons notre accord qu’à cette condition : que vous deveniez comme nous en faisant circoncire toute personne de sexe masculin parmi vous.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Nous consentirons à votre demande seulement ainsi : si vous devenez comme nous, en faisant circoncire toute personne de sexe masculin parmi vous. »'
    reason: La formulation plus formelle conserve de plus près les valeurs possibles de בְּזֹאת et de נֵאוֹת לָכֶם, tout en maintenant la portée distributive de כָּל זָכָר.
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: qu’à cette condition
  rationale: אַךְ a ici une valeur restrictive, et בְּזֹאת introduit la condition précise de l’accord. La tournure française exprime naturellement l’exclusivité.
- source_word: נֵאוֹת לָכֶם
  choice: Nous ne donnerons notre accord
  rationale: Le niphal de אוה exprime le consentement ou la disposition à accepter. « Donner notre accord » convient au contexte de négociation; le complément « avec vous » peut rester implicite en français.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: que vous deveniez comme nous
  rationale: Après l’expression française « à cette condition », « que » introduit idiomatiquement la condition. היה désigne ici l’entrée dans un nouvel état ou une nouvelle pratique.
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: en faisant circoncire tous les hommes parmi vous
  rationale: L’infinitif niphal indique le moyen par lequel ils deviendraient semblables aux fils de Jacob. La construction causative française évite de laisser entendre que les destinataires accompliraient eux-mêmes la circoncision sur leur propre personne. כָּל זָכָר est distributif et vise chaque personne de sexe masculin de leur groupe.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Tous les hommes parmi vous » est naturel dans ce contexte collectif, tandis que la note offre le singulier distributif plus formel.
