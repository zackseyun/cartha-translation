  text: וַ/יִּֽיטְב֥וּ דִבְרֵי/הֶ֖ם בְּ/עֵינֵ֣י חֲמ֑וֹר וּ/בְ/עֵינֵ֖י שְׁכֶ֥ם בֶּן חֲמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/018.yaml
  text: Their words seemed good to Hamor and to Shechem son of Hamor[a].
translation:
  language: fr
  text: Leurs paroles plurent à Hamor et à Sichem, fils de Hamor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Leurs paroles parurent bonnes à Hamor et à Sichem, fils de Hamor. »'
    reason: Alternative lexicale reflétant plus explicitement l’idiome hébreu « être bon aux yeux de ».
lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: plurent
  rationale: Dans la tournure avec בְּעֵינֵי, le verbe יטב exprime ici une appréciation favorable. « Plurent à » rend naturellement en français moderne le sens de « furent jugées bonnes/agréables ».
- source_word: דִבְרֵיהֶם
  choice: leurs paroles
  rationale: Le pluriel de דָּבָר avec suffixe de troisième personne du masculin pluriel signifie littéralement « leurs paroles ». Cette formulation préserve la portée du terme sans le réduire à « proposition ».
- source_word: בְּעֵינֵי
  choice: à
  rationale: L’expression hébraïque signifie littéralement « aux yeux de ». Avec « plurent », le complément introduit par « à » transmet avec naturel le jugement favorable exprimé par l’idiome.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Nom propre transcrit selon sa forme traditionnellement reçue en français biblique.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Nom propre rendu par la forme française biblique traditionnelle et largement reconnue.
- source_word: בֶּן חֲמוֹר
  choice: fils de Hamor
  rationale: Expression filiale directe qui conserve l’ordre et l’identification du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Leurs paroles » maintient la formulation concrète de l’hébreu, tandis que « plurent à » restitue sans lourdeur l’idiome évaluatif.
