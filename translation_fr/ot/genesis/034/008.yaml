  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: fr
  text: 'Hamor leur parla en ces termes : « Mon fils Sichem désire ardemment votre fille[a]. Je vous prie, donnez-la-lui pour femme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’âme de mon fils Sichem s’est attachée à votre fille » ; autre traduction possible : « est profondément épris de votre fille ».'
    reason: L’hébreu חָשְׁקָה נַפְשׁוֹ associe l’idée d’un profond attachement à celle d’un désir intense; le contexte ne permet pas de réduire avec certitude l’expression à un seul de ces aspects.
lexical_decisions:
- source_word: וַיְדַבֵּר חֲמוֹר אִתָּם לֵאמֹר
  choice: Hamor leur parla en ces termes
  rationale: Cette formulation française rend naturellement l’introduction du discours, tout en reflétant à la fois le verbe « parler », le destinataire pluriel et l’infinitif « en disant ».
- source_word: שְׁכֶם בְּנִי
  choice: Mon fils Sichem
  rationale: L’ordre est naturel en français et conserve la relation d’apposition du texte hébreu.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: désire ardemment
  rationale: L’expression signifie littéralement que son être est fortement attaché à elle ou la désire. « Désire ardemment » préserve l’intensité sans imposer une interprétation exclusivement affective.
- source_word: בְּבִתְּכֶם
  choice: votre fille
  rationale: Le nom est singulier et désigne Dina, tandis que le suffixe pluriel s’adresse collectivement aux membres de sa famille.
- source_word: תְּנוּ נָא
  choice: Je vous prie, donnez-la-lui
  rationale: L’impératif pluriel accompagné de נָא exprime une demande courtoise ou pressante; cette tournure est digne et naturelle en français moderne.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: Cette expression française concise rend la formule hébraïque usuelle du don en mariage.
theological_decisions: []
