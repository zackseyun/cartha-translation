id: GEN.34.28
reference: Genesis 34:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶת צֹאנָ֥/ם וְ/אֶת בְּקָרָ֖/ם וְ/אֶת חֲמֹרֵי/הֶּ֑ם וְ/אֵ֧ת אֲשֶׁר בָּ/עִ֛יר וְ/אֶת אֲשֶׁ֥ר בַּ/שָּׂדֶ֖ה לָקָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: fr
  text: Ils prirent leur petit bétail, leur gros bétail, leurs ânes, tout ce qui se trouvait dans la ville et tout ce qui se trouvait dans les champs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la campagne ».
    reason: שָׂדֶה peut désigner soit les champs, soit plus largement la campagne ou les terres ouvertes.
lexical_decisions:
- source_word: צֹאנָם
  choice: leur petit bétail
  rationale: צֹאן est un nom collectif désignant surtout les moutons et les chèvres. « Petit bétail » conserve cette valeur collective sans limiter le terme à une seule espèce.
- source_word: בְּקָרָם
  choice: leur gros bétail
  rationale: בָּקָר désigne collectivement les bovins. « Gros bétail » forme un parallèle naturel avec « petit bétail » et convient au contexte d'une razzia.
- source_word: חֲמֹרֵיהֶם
  choice: leurs ânes
  rationale: Le terme hébreu désigne les ânes; c'est le mot courant et précis en français moderne.
- source_word: אֲשֶׁר בָּעִיר
  choice: tout ce qui se trouvait dans la ville
  rationale: La construction relative employée comme complément de לָקָחוּ a ici une portée globale. Cette formulation est naturelle en français et exprime l'étendue du butin.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: tout ce qui se trouvait dans les champs
  rationale: שָׂדֶה peut désigner un champ ou, collectivement, les terres ouvertes autour de la ville. Le pluriel français « les champs » rend naturellement cette portée collective.
- source_word: לָקָחוּ
  choice: Ils prirent
  rationale: לָקַח signifie fondamentalement « prendre ». Le contexte indique déjà qu'il s'agit de butin, sans qu'il soit nécessaire d'expliciter par « pillèrent » ou « emportèrent ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les termes collectifs « petit bétail » et « gros bétail » préservent la structure hébraïque tout en restant compréhensibles; la répétition de « tout ce qui se trouvait » restitue l'ampleur du pillage.
