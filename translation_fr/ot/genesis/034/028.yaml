  source_fidelity: 'Le texte rend fidèlement la liste des biens et la double expression relative hébraïque : le petit bétail (צֹאן), le gros bétail/bovins (בָּקָר), les ânes, puis ce qui était dans la ville et dans les champs. « Ils prirent » conserve la sobriété de לָקָחוּ sans introduire une qualification interprétative supplémentaire.'
