  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: fr
  text: 'Établissez avec nous des liens de mariage : donnez-nous vos filles en mariage, et prenez nos filles pour épouses.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: Unissez-vous à nous par des mariages
  rationale: Le hitpael de חתן exprime ici l’établissement réciproque de liens matrimoniaux. Cette formulation naturelle en français conserve la réciprocité sans suggérer que les interlocuteurs doivent s’épouser directement entre eux.
- source_word: בְּנֹתֵיכֶם
  choice: vos filles
  rationale: Rend directement le pluriel construit avec suffixe de deuxième personne du masculin pluriel.
- source_word: תִּתְּנוּ לָנוּ
  choice: donnez-nous vos filles en mariage
  rationale: Dans ce contexte, נתן désigne le fait de donner des filles en mariage. L’ajout explicite « en mariage » évite en français moderne une formulation pouvant paraître transactionnelle ou ambiguë.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: et prenez nos filles pour vous-mêmes
  rationale: Préserve le verbe לקח et la structure réciproque de l’hébreu. Le sens matrimonial est établi par la proposition précédente, sans ajouter ici « pour femmes ».
