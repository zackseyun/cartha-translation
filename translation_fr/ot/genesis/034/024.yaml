  text: וַ/יִּשְׁמְע֤וּ אֶל חֲמוֹר֙ וְ/אֶל שְׁכֶ֣ם בְּנ֔/וֹ כָּל יֹצְאֵ֖י שַׁ֣עַר עִיר֑/וֹ וַ/יִּמֹּ֨לוּ֙ כָּל זָכָ֔ר כָּל יֹצְאֵ֖י שַׁ֥עַר עִירֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: fr
  text: Tous ceux qui sortaient par la porte de sa ville[a] écoutèrent Hamor et son fils Sichem. Tous les hommes, tous ceux qui sortaient par la porte de sa ville, furent circoncis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « ceux qui sortaient par la porte de sa ville » désigne ici les hommes de la ville qui participaient à la vie publique.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: écoutèrent
  rationale: La construction שׁמע אל signifie ici écouter quelqu’un en donnant une suite favorable à ses paroles. « Écoutèrent » conserve cette nuance sans imposer le sens plus fort d’« obéirent ».
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: tous ceux qui sortaient par la porte de sa ville
  rationale: Cette formulation préserve l’expression concrète et répétée de l’hébreu. Dans ce contexte, elle désigne les hommes de la ville qui prenaient part à la vie publique.
- source_word: בְּנוֹ
  choice: son fils
  rationale: 'Le suffixe renvoie à Hamor : Sichem est explicitement présenté comme son fils. L’ordre français naturel est « Hamor et son fils Sichem ».'
- source_word: וַיִּמֹּלוּ
  choice: se firent circoncire
  rationale: Le nifal pluriel peut exprimer ici une action passive ou à valeur réfléchie. « Se firent circoncire » rend naturellement le fait que les hommes acceptèrent de subir la circoncision, sans suggérer qu’ils l’accomplirent eux-mêmes.
- source_word: כָּל זָכָר
  choice: tous les hommes
  rationale: Littéralement « tout mâle ». Dans ce récit civique, le français naturel « tous les hommes » désigne clairement la population masculine concernée, tandis que « tous les mâles » serait inutilement clinique.
- source_word: שַׁעַר עִירוֹ
  choice: la porte de sa ville
  rationale: La traduction conserve l’image de la porte de la ville, lieu de passage, d’assemblée et de décision publique dans le monde ancien.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La répétition de l’expression concernant la porte est maintenue parce qu’elle structure le verset hébreu. « Se firent circoncire » est plus idiomatique que le passif en français tout en respectant la valeur passive ou réfléchie du nifal.
