  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: fr
  text: Son âme[a] s’attacha à Dina, fille de Jacob ; il aima la jeune femme et parla au cœur de la jeune femme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Son âme ». Le mot hébreu peut aussi désigner la vie, la personne ou l’être intérieur.'
    reason: lexical_alternative
  - marker: b
    text: « Parler au cœur de quelqu’un » est une expression hébraïque qui peut évoquer des paroles tendres, bienveillantes ou rassurantes.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: Son être s’attacha
  rationale: Le tour conserve l’idée hébraïque de la נֶפֶשׁ comme personne intérieure ou être vivant, ainsi que la force relationnelle de דבק, tout en évitant en français moderne l’ambiguïté possible de « son âme s’attacha ».
- source_word: בְּדִינָה בַּת יַעֲקֹב
  choice: à Dina, fille de Jacob
  rationale: La préposition avec דבק se rend naturellement par « à »; l’apposition sans article est idiomatique en français.
- source_word: וַיֶּאֱהַב
  choice: Il aima
  rationale: אהב est le verbe courant pour aimer. Ce choix rapporte l’affection attribuée à Sichem sans la transformer en simple désir ni la romantiser davantage.
- source_word: הַנַּעֲרָ
  choice: la jeune femme
  rationale: נַעֲרָה désigne ici une fille ou jeune femme; « jeune femme » est actuel, digne et non diminutif.
- source_word: וַיְדַבֵּר עַל לֵב
  choice: parla à son cœur
  rationale: Cette formulation préserve l’image de l’idiome hébreu, qui peut évoquer des paroles tendres, bienveillantes ou rassurantes, sans imposer une seule nuance.
theological_decisions:
- issue: Langage affectif après la violence racontée dans le contexte immédiat
  choice: Conserver sans ajout les termes d’attachement et d’amour employés par le narrateur
  alternative: Introduire dans le verset une qualification morale négative, ou au contraire accentuer la tonalité romantique
  rationale: Le texte décrit ici les sentiments et les paroles de Sichem sans effacer ni excuser ce qui précède. La traduction ne doit ni atténuer la violence du contexte ni ajouter à ce verset un jugement absent de sa formulation.
translation_notes:
  register: Français international moderne, sobre et digne. « Son être s’attacha » garde l’intensité de l’hébreu sans donner à « âme » un sens technique étranger au contexte. La seconde note est placée sur l’expression qu’elle explique; les deux marqueurs figurent dans le texte.
