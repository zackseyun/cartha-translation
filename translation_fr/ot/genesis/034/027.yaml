  text: בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל הַ֣/חֲלָלִ֔ים וַ/יָּבֹ֖זּוּ הָ/עִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: fr
  text: Les fils de Jacob arrivèrent auprès des hommes tués et pillèrent la ville, parce qu’on y avait souillé leur sœur.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vinrent contre les hommes tués ». L’expression hébraïque peut décrire un mouvement sur ou contre ceux qui avaient été tués.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu a une formulation condensée, littéralement : « la ville qu’ils avaient souillé leur sœur ». Le verbe est au pluriel, mais son sujet n’est pas exprimé par un nom; dans le contexte, la clause renvoie à la souillure subie par leur sœur dans cette ville.'
    reason: textual_clarity
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: Les fils de Jacob
  rationale: Reproduit directement le groupe construit hébreu et maintient l’accent narratif sur les fils de Jacob comme groupe.
- source_word: בָּאוּ עַל הַחֲלָלִים
  choice: vinrent parmi les morts
  rationale: Dans ce contexte d’après-massacre, עַל avec le verbe « venir » décrit leur arrivée au milieu ou auprès des victimes. « Parmi les morts » est naturel en français et évite de suggérer qu’ils attaquent ceux qui sont déjà tués.
- source_word: וַיָּבֹזּוּ הָעִיר
  choice: et pillèrent la ville
  rationale: בזז désigne la prise de butin; « piller » est le terme français courant, précis et adapté au contexte violent.
- source_word: אֲשֶׁר
  choice: parce que… y
  rationale: Le relatif hébreu introduit ici une proposition comprimée rattachée à la ville. La formulation française exprime sa valeur explicative probable tout en reliant le déshonneur au lieu.
- source_word: טִמְּאוּ
  choice: avait déshonoré
  rationale: Le piel de טמא signifie rendre impur ou souiller. Dans ce contexte de violence sexuelle, « déshonorer » conserve la dimension sociale et morale sans imposer ici un vocabulaire rituel moins naturel.
- source_word: אֲחוֹתָם
  choice: leur sœur
  rationale: Traduction directe du nom avec suffixe possessif, qui maintient au premier plan le lien familial.
theological_decisions:
- issue: Identification du sujet implicite de טִמְּאוּ
  choice: 'Formulation impersonnelle : « on y avait déshonoré leur sœur »'
  alternative: « ils avaient déshonoré leur sœur »
  rationale: Le verbe hébreu est à la troisième personne du pluriel, mais son sujet n’est pas exprimé. En français, « ils » renverrait spontanément aux fils de Jacob et produirait un contresens narratif. La tournure impersonnelle préserve l’indétermination grammaticale tout en évitant cette fausse identification; « y » rattache l’acte à la ville désignée par אֲשֶׁר.
translation_notes:
  register: Français international moderne, narratif et digne. « Morts » est plus immédiatement compréhensible que « tués » employé substantivement; « pillèrent » garde la force du contexte. La construction impersonnelle évite que le pronom français désigne à tort les fils de Jacob.
