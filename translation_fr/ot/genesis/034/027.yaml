revisions:
- from: Les fils de Jacob vinrent parmi les morts et pillèrent la ville, parce qu’on y avait déshonoré leur sœur.[a][b]
  to: Les fils de Jacob arrivèrent auprès des hommes tués et pillèrent la ville, parce qu’on y avait souillé leur sœur.[a][b]
  rationale: La révision rétablit le sens de « souiller » pour טִמְּאוּ, améliore le rendu de בָּאוּ עַל, et conserve la tournure impersonnelle avec « y », nécessaire en français pour éviter que « ils » ne désigne faussement les fils de Jacob. Les notes sont harmonisées avec le texte et avec la syntaxe hébraïque.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:10:50Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation impersonnelle évite à juste titre le contresens que produirait un « ils » français renvoyant aux fils de Jacob. Toutefois, « déshonoré » atténue et interprète le verbe טִמְּאוּ (« souiller, rendre impur »), tandis que « parmi les morts » rend insuffisamment la direction exprimée par בָּאוּ עַל.
  naturalness: Le texte est globalement naturel, mais « arrivèrent auprès des hommes tués » rend plus clairement et plus idiomatiquement l’arrivée des fils de Jacob sur les lieux du massacre. « Souillé leur sœur » demeure un français narratif moderne et rend le terme-source avec davantage de précision.
  terminology: '« Souiller » préserve la portée morale et sociale de טמא sans imposer une lecture confessionnelle. La note b doit aussi corriger sa paraphrase du littéral : le sujet est grammaticalement pluriel mais n’est pas exprimé par un nom dans la clause, et le français ne peut reproduire littéralement sa syntaxe sans devenir agrammatical.'
  issues:
  - severity: medium
    issue: « parmi les morts » affaiblit la valeur directionnelle de בָּאוּ עַל.
    rationale: La préposition עַל peut indiquer qu’ils vinrent sur/contre les personnes tuées; « auprès des hommes tués » exprime l’arrivée sur les lieux sans introduire l’idée plus spécifique d’être au milieu d’eux.
  - severity: medium
    issue: « déshonoré » ne rend pas pleinement טִמְּאוּ.
    rationale: Dans ce contexte, טמא signifie « souiller/défiler » et porte une coloration d’impureté ainsi que de violation. « Déshonorer » est plus euphémisant et déplace le sens vers l’honneur social.
  - severity: low
    issue: La note b décrit de façon imprécise la syntaxe hébraïque.
    rationale: Le verbe est bien à la troisième personne du pluriel; c’est son sujet nominal qui n’est pas exprimé. La citation dite littérale doit être présentée comme une structure hébraïque non reproductible telle quelle en français.
  revised_text: Les fils de Jacob arrivèrent auprès des hommes tués et pillèrent la ville, parce qu’on y avait souillé leur sœur.[a][b]
  revised_footnotes:
