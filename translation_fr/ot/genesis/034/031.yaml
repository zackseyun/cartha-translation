  edition: WLC
  text: וַ/יֹּאמְר֑וּ הַ/כְ/זוֹנָ֕ה יַעֲשֶׂ֖ה אֶת אֲחוֹתֵֽ/נוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: fr
  text: 'Mais ils répondirent[a] : « Devait-il traiter notre sœur comme une prostituée ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais ils dirent ».'
    reason: La forme hébraïque emploie le verbe courant « dire » ; « répondirent » explicite sa fonction dans le dialogue sans changer le sens.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mais ils répondirent
  rationale: Le wayyiqtol de אמר introduit ici la réplique des frères à la remontrance de Jacob. « Mais » rend la valeur adversative du contexte, et « répondirent » exprime naturellement en français la fonction du verbe dans cet échange.
- source_word: הַכְזוֹנָה
  choice: comme une prostituée
  rationale: L’interrogatif ה, suivi de כ et de זונה, forme la comparaison « comme une prostituée ? ». « Prostituée » est actuel, clair et non archaïque.
- source_word: יַעֲשֶׂה
  choice: Devait-il traiter
  rationale: עשה signifie largement « faire » ou « agir ». Avec une personne comme objet, le contexte favorise le sens idiomatique « traiter ». L’imparfait prend ici la force d’une question rhétorique indignée.
- source_word: אֶת אֲחוֹתֵנוּ
  choice: notre sœur
  rationale: אֶת marque l’objet direct et ne se traduit pas séparément ; אֲחוֹתֵנוּ signifie directement « notre sœur », en conservant l’enjeu familial du propos.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La question rhétorique et l’indignation des frères sont conservées. Le choix « traiter » rend le sens contextuel de עשה, tandis que la comparaison « comme une prostituée » reste explicite.
