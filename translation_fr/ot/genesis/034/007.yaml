  terminology: « Infamie », « en Israël », « couchant avec la fille de Jacob » et « ne doit pas se faire » conviennent au registre et conservent la condamnation morale et normative du texte sans ajouter d’interprétation. L’explicitation de Sichem est contextuellement sûre.
