  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: fr
  text: Les fils de Jacob revinrent des champs lorsqu’ils l’apprirent. Ils furent peinés et très en colère, car Sichem avait commis une infamie en Israël en couchant avec la fille de Jacob. Une chose pareille ne doit pas se faire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: furent profondément peinés
  rationale: Le verbe exprime ici la peine, l’affliction ou la blessure intérieure; « profondément » rend l’intensité du contexte sans confondre ce sentiment avec la colère mentionnée ensuite.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: se mirent dans une grande colère
  rationale: L’expression idiomatique décrit une colère qui s’enflamme fortement; cette formulation est naturelle en français moderne et conserve l’intensité de מְאֹד.
- source_word: נְבָלָה
  choice: une infamie
  rationale: Le terme désigne un acte outrageant, honteux et moralement scandaleux; « infamie » restitue sa forte condamnation sans ajouter une qualification juridique absente du texte.
- source_word: לִשְׁכַּב אֶת
  choice: en couchant avec
  rationale: Rend directement l’euphémisme sexuel hébreu dans un registre courant mais digne.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: Une chose pareille ne doit pas se faire
  rationale: Conserve la portée normative de la tournure impersonnelle tout en restant idiomatique en français.
- source_word: כְּשָׁמְעָם
  choice: dès qu’ils apprirent ce qui s’était passé
  rationale: Le suffixe n’explicite pas son objet; le contexte fournit l’événement appris. Cette formulation française évite un pronom sans antécédent clair.
theological_decisions:
- issue: Emploi anachronique apparent du nom « Israël » avant la constitution nationale
  choice: conserver « en Israël »
  alternative: « contre la famille d’Israël » ou « parmi les Israélites »
  rationale: Le texte massorétique emploie explicitement בְיִשְׂרָאֵל. La traduction préserve cette formulation narrative et sa tension chronologique sans l’interpréter ni la développer.
- issue: Force normative de la proposition finale
  choice: « ne doit pas se faire »
  alternative: « ne se fait pas »
  rationale: La tournure hébraïque porte naturellement une condamnation normative. Le français choisi maintient cette force sans préciser une source légale ou confessionnelle.
- issue: Référent implicite du sujet de « avait commis »
  choice: expliciter « Sichem »
  alternative: maintenir « il »
  rationale: Le sujet masculin singulier renvoie contextuellement à Sichem. Son nom évite une ambiguïté artificielle en français et n’ajoute aucune interprétation doctrinale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase a été légèrement segmentée pour la lisibilité. Le vocabulaire conserve la gravité morale et l’intensité affective de l’hébreu sans archaïsme inutile.
