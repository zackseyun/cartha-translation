source:
  edition: WLC
  text: וְ/נָתַ֤נּוּ אֶת בְּנֹתֵ֨י/נוּ֙ לָ/כֶ֔ם וְ/אֶת בְּנֹתֵי/כֶ֖ם נִֽקַּֽח לָ֑/נוּ וְ/יָשַׁ֣בְנוּ אִתְּ/כֶ֔ם וְ/הָיִ֖ינוּ לְ/עַ֥ם אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: fr
  text: alors nous vous donnerons nos filles, nous prendrons vos filles pour nous, nous habiterons avec vous et nous deviendrons un seul peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous serons un seul peuple ». L’hébreu dit littéralement « nous serons pour un seul peuple »; la formule peut indiquer l’entrée dans cet état (« nous deviendrons ») ou être rendue plus formellement (« nous serons »).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: alors nous vous donnerons
  rationale: Dans cette négociation conditionnelle, le parfait qal avec waw exprime la conséquence future de la condition énoncée auparavant. « Alors » rend naturellement ce lien en français.
- source_word: אֶת־בְּנֹתֵינוּ לָכֶם
  choice: nous vous donnerons nos filles
  rationale: La tournure française avec pronom objet indirect rend naturellement לָכֶם tout en conservant le terme familial concret « nos filles ».
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ
  choice: nous prendrons vos filles pour nous
  rationale: לקח signifie littéralement « prendre ». Le contexte matrimonial en précise le sens sans qu’il soit nécessaire d’ajouter explicitement « pour épouses »; לָנוּ est conservé par « pour nous ».
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: nous habiterons avec vous
  rationale: ישׁב peut signifier habiter, demeurer ou s’établir. « Habiter avec vous » est actuel, clair et proche de la formulation hébraïque.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: nous deviendrons un seul peuple
  rationale: Dans ce contexte, היה suivi de לְ peut exprimer l’entrée dans un état. « Devenir un seul peuple » rend cette conséquence, tandis que « être un seul peuple » demeure une possibilité formelle signalée en note. עַם désigne ici un peuple, non un État-nation moderne.
