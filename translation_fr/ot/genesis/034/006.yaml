  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: fr
  text: Alors Hamor, père de Sichem, sortit pour aller trouver Jacob et lui parler.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Alors … sortit pour aller trouver
  rationale: Le wayyiqtol fait avancer le récit, et יצא signifie littéralement « sortir ». En français, « sortit pour aller trouver » conserve ce mouvement tout en exprimant naturellement le déplacement vers une personne.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: אֲבִי שְׁכֶם
  choice: père de Sichem
  rationale: Cette formulation rend directement la chaîne construite hébraïque, avec l’article omis de façon naturelle en apposition française.
- source_word: אֶל יַעֲקֹב
  choice: pour aller trouver Jacob
  rationale: אֶל indique un mouvement en direction de Jacob. « Aller trouver » est idiomatique en français dans le contexte d’une démarche visant un entretien.
- source_word: לְדַבֵּר אִתּוֹ
  choice: et lui parler
  rationale: L’infinitif préfixé par לְ exprime ici le but. Le complément אִתּוֹ suggère un échange avec Jacob; « lui parler » le rend naturellement sans alourdir la phrase.
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif marque la progression séquentielle du récit; « Alors » en restitue clairement la fonction en français moderne.
