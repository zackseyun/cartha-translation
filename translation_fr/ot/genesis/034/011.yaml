base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: fr
  text: 'Puis Sichem dit au père et aux frères de Dina : « Que je trouve grâce à vos yeux, et je donnerai tout ce que vous me direz.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce que vous me demanderez ».'
    reason: alternative_contextual_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis ... dit
  rationale: Le waw consécutif fait avancer le récit ; « Puis » en restitue naturellement la progression.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: au père et aux frères de Dina
  rationale: Le français exige ici une référence explicite plus naturelle que la répétition de « son/ses » ; le contexte identifie clairement Dina comme l'antécédent. Le pluriel masculin אַחֶיהָ signifie « ses frères ».
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: Accordez-moi votre faveur
  rationale: Cette formulation française naturelle exprime la demande d'accueil favorable portée par l'idiome hébreu « trouver grâce/faveur à vos yeux », sans conserver une métaphore moins courante.
- source_word: וַאֲשֶׁר תֹּאמְרוּ אֵלַי אֶתֵּן
  choice: et je donnerai ce que vous me demanderez
  rationale: Dans cette négociation matrimoniale, « dire à » a pragmatiquement le sens de fixer ou demander quelque chose. « Donnerai » conserve le sens général de נָתַן sans le réduire à « paierai ».
