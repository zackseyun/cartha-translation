  text: וְ/אִתָּ֖/נוּ תֵּשֵׁ֑בוּ וְ/הָ/אָ֨רֶץ֙ תִּהְיֶ֣ה לִ/פְנֵי/כֶ֔ם שְׁבוּ֙ וּ/סְחָר֔וּ/הָ וְ/הֵֽאָחֲז֖וּ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: fr
  text: Vous pouvez habiter avec nous, et le pays sera à votre disposition[a]. Installez-vous-y, faites-y du commerce et acquérez-y des propriétés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays sera devant vous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « prenez-y possession » ou « obtenez-y des biens ». L’hébreu peut évoquer l’acquisition d’un bien foncier ou de droits de propriété.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: Vous pouvez habiter avec nous
  rationale: Le verbe יָשַׁב peut signifier « habiter », « vivre » ou « s’installer ». Dans cette invitation, « pouvez » exprime naturellement la permission offerte plutôt qu’une simple prédiction.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: et le pays sera à votre disposition
  rationale: Littéralement, le pays « sera devant vous ». Ici, cette expression indique qu’il leur sera accessible et disponible; la traduction française en explicite naturellement le sens.
- source_word: שְׁבוּ
  choice: Installez-vous-y
  rationale: L’impératif de יָשַׁב invite les destinataires à établir leur résidence dans le pays. Le pronom « y » reprend clairement « le pays ».
- source_word: וּסְחָרוּהָ
  choice: faites-y du commerce
  rationale: Le verbe סחר désigne l’activité commerciale. Cette formulation est claire et idiomatique en français moderne.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: et acquérez-y des propriétés
  rationale: Le niphal de אָחַז renvoie vraisemblablement ici à l’acquisition de biens fonciers ou de droits de propriété, plutôt qu’à une simple saisie physique.
