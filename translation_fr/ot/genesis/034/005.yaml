  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: fr
  text: Jacob apprit qu’il avait souillé Dina, sa fille[a]. Mais ses fils étaient avec son bétail dans les champs. Jacob garda le silence jusqu’à leur arrivée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’avait rendue impure ». Le verbe hébreu signifie littéralement « souiller » ou « rendre impur »; dans ce contexte, il évoque l’atteinte sexuelle et le déshonneur subis par Dina.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: apprit
  rationale: Dans ce récit, Jacob reçoit une information; « apprit » est plus naturel en français que le calque « entendit » tout en conservant le sens de שׁמע.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Jacob apprend.
- source_word: טִמֵּא
  choice: avait déshonoré
  rationale: Le piel de טמא signifie littéralement « rendre impur, souiller ». Dans ce contexte sexuel, « déshonorer » exprime naturellement l’atteinte faite à Dina sans substituer au verbe hébreu un terme juridique plus précis.
- source_word: בִתּוֹ
  choice: sa fille
  rationale: Rend directement le nom avec son suffixe possessif; l’apposition après « Dina » est idiomatique en français.
- source_word: וּבָנָיו
  choice: Mais ses fils
  rationale: '« Mais » explicite le léger contraste narratif: les fils de Jacob sont absents lorsqu’il apprend la nouvelle.'
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: étaient aux champs avec son bétail
  rationale: La formulation conserve l’indication de lieu et la présence auprès du bétail sans ajouter explicitement qu’ils le gardaient.
- source_word: מִקְנֵהוּ
  choice: son bétail
  rationale: מִקְנֶה désigne ici l’ensemble des animaux domestiques de Jacob; « bétail » est courant et suffisamment large.
- source_word: וְהֶחֱרִשׁ
  choice: garda donc le silence
  rationale: Le hiphil exprime le fait de ne pas parler ou réagir. « Garda le silence » suggère justement une retenue prolongée; « donc » rend le lien circonstanciel avec l’absence des fils.
- source_word: עַד בֹּאָם
  choice: jusqu’à leur arrivée
  rationale: Rend idiomatiquement « jusqu’à ce qu’ils viennent », sans ajouter l’idée de retour, absente du verbe hébreu.
