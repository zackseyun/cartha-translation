base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: fr
  text: 'Alors Jacob dit à Siméon et à Lévi : « Vous m’avez attiré le malheur en me rendant odieux[a] aux habitants du pays, aux Cananéens et aux Perizzites. Nous sommes peu nombreux. Ils se rassembleront contre moi et me frapperont, et je serai exterminé, moi et ma maisonnée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en me faisant puer » auprès des habitants du pays.'
    reason: 'L’image concrète de l’hébreu est métaphorique : Jacob affirme que ses fils lui ont donné une réputation odieuse.'
lexical_decisions:
- source_word: עֲכַרְתֶּם
  choice: vous m’avez attiré le malheur
  rationale: Le verbe exprime le fait d’attirer le trouble ou le malheur sur quelqu’un. Cette tournure française est naturelle et conserve la force de l’accusation de Jacob.
- source_word: לְהַבְאִישֵׁנִי
  choice: en me rendant odieux
  rationale: Le sens littéral est « en me faisant puer », employé métaphoriquement pour une réputation devenue détestable. Le texte principal rend clairement le sens social, tandis que la note conserve l’image hébraïque.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: aux habitants du pays
  rationale: Le participe singulier a une valeur collective et désigne la population établie dans le pays.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: aux Cananéens et aux Perizzites
  rationale: Ces deux peuples précisent quels habitants du pays sont concernés. La préposition française « à », intégrée à « aux », convient au complément de « rendre odieux ».
- source_word: מְתֵי מִסְפָּר
  choice: Mes hommes sont peu nombreux
  rationale: L’expression idiomatique désigne un groupe humain numériquement faible. Cette formulation explicite naturellement en français que Jacob dispose de peu d’hommes.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: ils se rassembleront contre moi
  rationale: Le nifal décrit des adversaires qui se regroupent en vue d’une action hostile. La forme pronominale française restitue cette nuance sans lourdeur.
- source_word: וְהִכּוּנִי
  choice: me frapperont
  rationale: Le verbe נכה signifie frapper, abattre ou vaincre. « Frapper » reste proche du texte et prend ici naturellement un sens violent dans le contexte d’une attaque collective.
- source_word: וְנִשְׁמַדְתִּי
  choice: je serai exterminé
  rationale: Le verbe exprime une destruction complète. « Exterminé » en conserve la gravité et convient à la disparition redoutée de Jacob et de sa maisonnée.
- source_word: בֵּיתִי
  choice: toute ma maisonnée
  rationale: Le mot désigne ici l’ensemble familial et domestique de Jacob, et non son bâtiment. « Maisonnée » en restitue la portée sociale; « toute » rend explicite la totalité impliquée par la menace d’extermination.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. Le discours direct garde la progression de l’hébreu : accusation, constat de faiblesse numérique, rassemblement hostile, attaque et destruction redoutée. L’image olfactive, peu naturelle dans le corps du texte français, est conservée en note.'
