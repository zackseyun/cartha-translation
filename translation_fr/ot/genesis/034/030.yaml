- from: 'Alors Jacob dit à Siméon et à Lévi : « Vous m’avez attiré le malheur en me rendant odieux[a] aux habitants du pays, aux Cananéens et aux Perizzites. Mes hommes sont peu nombreux. Ils se rassembleront contre moi et me frapperont, et je serai exterminé, moi et toute ma maisonnée. »'
  to: 'Alors Jacob dit à Siméon et à Lévi : « Vous m’avez attiré le malheur en me rendant odieux[a] aux habitants du pays, aux Cananéens et aux Perizzites. Nous sommes peu nombreux. Ils se rassembleront contre moi et me frapperont, et je serai exterminé, moi et ma maisonnée. »'
  rationale: La révision évite de limiter la faiblesse numérique de Jacob à ses seuls « hommes » et supprime l’intensif non explicite « toute ». Elle maintient l’accusation, l’image métaphorique attestée en note, les ethnonymes et la progression du discours hébreu.
