  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: fr
  text: 'Ils leur dirent : « Nous ne pouvons pas faire cela : donner notre sœur à un homme incirconcis[a], car c’est un déshonneur pour nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à un homme qui a un prépuce ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: Ils leur dirent
  rationale: Le verbe אמר introduit directement la prise de parole; « dirent » convient au récit et « leur » préserve le complément pluriel.
- source_word: לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: Nous ne pouvons pas faire une chose pareille
  rationale: יכל exprime la capacité. Cette formulation française naturelle conserve l'idée de דבר tout en rendant la forte désapprobation impliquée par « cette chose » dans le contexte.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: donner notre sœur
  rationale: La traduction garde le sens simple de נתן sans ajouter explicitement « en mariage », déjà évident dans le contexte.
- source_word: לְאִישׁ אֲשֶׁר לוֹ עָרְלָה
  choice: à un homme incirconcis
  rationale: La tournure idiomatique française exprime clairement le référent de l'hébreu littéral « un homme qui a un prépuce »; la formulation littérale est conservée en note.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: Ce serait un déshonneur pour nous
  rationale: חרפה désigne la honte, l'opprobre ou le déshonneur social. Le conditionnel s'accorde naturellement en français avec l'acte envisagé sans effacer la valeur évaluative de l'hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Une chose pareille » évite le calque raide « faire cette chose », tandis que « homme incirconcis » est intelligible dans le corps du texte; la forme concrète et inhabituelle de l'hébreu est signalée en note.
