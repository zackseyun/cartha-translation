review_pass:
  verdict: revise
  source_fidelity: La formulation actuelle fait dépendre grammaticalement « toutes leurs richesses » de « emmenèrent en captivité ». Or שָׁבָה vise la capture de personnes, tandis que les richesses relèvent naturellement de בזז, « piller ». Bien que l’hébreu présente une série d’objets avant les deux verbes, le français doit lever cette association trompeuse sans perdre aucun élément.
  naturalness: « Petits enfants » peut se lire comme « petits-enfants » en français courant, même si le contexte favorise le sens d’enfants en bas âge. « Jeunes enfants » est plus net et idiomatique. La redistribution des compléments entre les deux verbes rend la phrase naturelle et non ambiguë.
  terminology: « Emmenèrent en captivité » rend bien שָׁבָה; « pillèrent » rend bien בזז. « Femmes » conserve la possibilité de « femmes/épouses » de נְשֵׁיהֶם sans imposer davantage. « Richesses » est recevable pour חֵילָם dans ce contexte.
