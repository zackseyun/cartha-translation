  rationale: La révision associe explicitement la captivité aux enfants et aux femmes, et le pillage aux richesses et à ce qui se trouvait dans la maison. Elle conserve les deux actions, tous les groupes et les biens mentionnés par l’hébreu, tout en évitant une construction française qui attribuait la captivité aux richesses. Les notes sont maintenues avec un français plus directement aligné sur les possibilités sémantiques du texte source.
