  - severity: medium
    issue: Ambiguïté de « petits enfants »
    rationale: En français moderne, l’expression peut désigner des petits-enfants (descendants de la deuxième génération). « Jeunes enfants » rend plus clairement טַף, qui vise les enfants en bas âge, avec une note pour l’extension possible aux dépendants.
