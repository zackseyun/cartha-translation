  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: fr
  text: Ils emmenèrent en captivité tous leurs jeunes enfants[a] et leurs femmes, et pillèrent toutes leurs richesses ainsi que tout ce qui se trouvait dans la maison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous leurs enfants » ; le mot hébreu désigne souvent les jeunes enfants, mais peut aussi englober les personnes dépendantes du foyer.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout ce qui se trouvait dans le foyer » ; en hébreu, « maison » peut aussi désigner le foyer et ses biens.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: toutes leurs richesses
  rationale: חַיִל peut désigner les biens, les ressources ou la fortune. « Richesses » conserve ici une portée large, sans limiter le terme au bétail ni lui donner un sens militaire.
- source_word: טַפָּם
  choice: tous leurs petits enfants
  rationale: טַף désigne souvent les jeunes enfants ou, plus largement, les personnes dépendantes d’un foyer. « Petits enfants » exprime naturellement ici l’idée des enfants en bas âge, sans employer « petits-enfants », qui signifierait les descendants de la deuxième génération.
- source_word: נְשֵׁיהֶם
  choice: leurs femmes
  rationale: אִשָּׁה peut signifier « femme » ou « épouse ». Dans cette liste concernant les membres des foyers, « leurs femmes » rend naturellement la relation exprimée par le suffixe possessif tout en gardant la légère latitude du français.
- source_word: שָׁבוּ
  choice: emmenèrent en captivité
  rationale: שָׁבָה signifie prendre ou emmener captif. Cette formulation garde explicitement la notion de captivité et permet de reproduire l’enchaînement des objets du texte hébreu.
- source_word: וַיָּבֹזּוּ
  choice: pillèrent
  rationale: בזז désigne l’action de piller ou de prendre comme butin. « Pillèrent » est actuel, clair et conserve la violence de l’action.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: tout ce qui se trouvait dans la maison
  rationale: Le singulier בַּבַּיִת peut désigner la maison concrète ou, par extension, le foyer et ses biens. La traduction principale reste proche du sens spatial immédiat.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. L’ordre inhabituel de l’hébreu est conservé : « richesses » figure parmi les compléments de « emmenèrent en captivité », avant le verbe « pillèrent ». Cette tension syntaxique est maintenue plutôt que résolue par une redistribution interprétative des objets.'
