  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: fr
  text: Ces hommes sont en paix avec nous[a]. Qu’ils habitent dans le pays et y fassent du commerce[b], car, voyez, le pays est assez vaste pour eux[c]. Nous prendrons leurs filles pour femmes, et nous leur donnerons nos filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont bien disposés envers nous » ou « sont en bons termes avec nous ».
    reason: lexical_alternative
  - marker: b
    text: Ou « fassent du commerce à travers le pays » ; l’hébreu peut désigner une activité commerciale dans le pays ou le passage à travers son territoire pour commercer.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « le pays, voyez, est large d’étendue devant eux » ; cette expression signifie qu’il y a largement assez d’espace pour eux.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: en paix avec nous
  rationale: L’expression décrit ici des relations pacifiques ou sans hostilité; elle n’implique pas nécessairement une amitié personnelle.
- source_word: וְיֵשְׁבוּ
  choice: Qu’ils habitent
  rationale: 'Dans ce discours persuasif, l’imparfait a une valeur exhortative: les habitants sont invités à permettre leur installation.'
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: y fassent du commerce
  rationale: Le verbe désigne l’activité commerciale, tandis que le pronom féminin renvoie au pays; la préposition implicite peut évoquer le commerce dans le pays ou à travers celui-ci.
- source_word: הִנֵּה
  choice: voyez
  rationale: Cette forme attire l’attention sur l’argument qui suit; « voyez » est actuel et digne, sans l’archaïsme de « voici » dans cet emploi.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: le pays est assez vaste pour eux
  rationale: Littéralement « vaste des deux mains devant eux », l’expression idiomatique signifie que le pays offre largement assez d’espace.
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: Nous prendrons leurs filles pour femmes
  rationale: Le futur français exprime naturellement la proposition ou l’intention; « pour femmes » conserve l’idiome matrimonial sans alourdir la phrase par un « pour nous-mêmes » redondant.
- source_word: נִתֵּן לָהֶם
  choice: nous leur donnerons nos filles
  rationale: Cette formulation conserve le parallélisme et l’idiome social du texte ancien, sans l’approuver ni le moderniser.
