  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: fr
  text: 'Il eut un rêve : voici qu’une échelle[a] était dressée sur la terre, et son sommet atteignait le ciel. Et voici que les anges de Dieu montaient et descendaient sur elle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner plus généralement une structure permettant de monter, par exemple un escalier ou une rampe.
    reason: lexical_alternative
  - marker: b
    text: Ou peut-être « sur lui »; toutefois, dans le contexte immédiat, le référent le plus naturel est l’échelle.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: Il eut un rêve
  rationale: Le wayyiqtol fait progresser le récit. Cette formulation est naturelle en français et présente clairement l’expérience onirique.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: La particule introduit avec vivacité ce qui apparaît dans le rêve; « voici que » en conserve la force présentative dans un registre digne et actuel.
- source_word: סֻלָּם
  choice: échelle
  rationale: « Échelle » est la désignation française traditionnelle et immédiatement compréhensible, mais le terme hébreu peut désigner plus largement une construction permettant de monter; cette latitude est signalée en note.
- source_word: מֻצָּב אַרְצָה
  choice: était dressée sur la terre
  rationale: Le participe passif décrit la structure comme placée ou établie, tandis que אַרְצָה la situe du côté de la terre. « Dressée sur la terre » restitue naturellement sa position verticale et le contraste avec le ciel.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: et son sommet atteignait le ciel
  rationale: « Sommet » rend idiomatiquement la « tête » d’un objet, et « atteignait » exprime son extension jusqu’au ciel sans suggérer nécessairement un contact matériel.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: les anges de Dieu
  rationale: Dans cette vision, מַלְאָךְ désigne des êtres célestes; « anges de Dieu » est donc plus précis ici que le sens général « messagers ».
- source_word: עֹלִים וְיֹרְדִים
  choice: montaient et descendaient
  rationale: Les participes décrivent une action en cours dans la scène vue en rêve; l’imparfait français en rend naturellement le déroulement.
- source_word: בּוֹ
  choice: le long d’elle
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à סֻלָּם, nom masculin en hébreu. Le français emploie le féminin conformément à « échelle »; « le long d’elle » exprime le mouvement effectué sur cette structure.
theological_decisions:
- issue: Image évoquée par סֻלָּם
  choice: échelle
  alternative: escalier, rampe ou autre structure permettant de monter
  rationale: Le mot hébreu ne permet pas de déterminer précisément la forme de la structure. Le texte principal retient le terme français traditionnel et naturel, tandis que la note préserve l’indétermination lexicale sans imposer une reconstruction architecturale.
- issue: Référent de בּוֹ
  choice: le long d’elle, en référence à l’échelle
  alternative: sur lui, en référence à Jacob
  rationale: L’antécédent immédiat et le plus naturel est סֻלָּם. Toutefois, la forme hébraïque peut grammaticalement se comprendre comme « sur lui »; la note conserve cette possibilité sans introduire dans le texte principal une interprétation théologique ultérieure.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » conserve la vivacité de la vision sans archaïsme excessif. La ponctuation distingue les deux tableaux introduits par וְהִנֵּה.
