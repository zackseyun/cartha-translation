    issue: « le long d’elle » pour בּוֹ
    rationale: Cette expression peut évoquer un déplacement à côté de l’échelle plutôt que sur elle. « Sur elle » rend directement la préposition hébraïque et conserve l’image sans explicitation supplémentaire.
  - severity: low
    issue: La note b identifie « sur lui » à Jacob.
    rationale: L’alternative pronominale peut être signalée, mais l’identification à Jacob relève d’une interprétation et n’est pas exprimée par le suffixe seul. La note devrait préserver cette ambiguïté.
