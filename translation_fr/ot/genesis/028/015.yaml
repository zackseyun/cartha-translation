source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: fr
  text: Et voici, je suis avec toi. Je te garderai[a] partout où tu iras et je te ramènerai dans ce pays. Car je ne t’abandonnerai[b] pas jusqu’à ce que j’aie accompli ce que je t’ai dit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je veillerai sur toi » ou « je te protégerai ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je ne te quitterai pas » ou « je ne te délaisserai pas ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ce que je t’ai dit » ; on peut comprendre, d’après le contexte, « ce que je t’ai promis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Conserve la fonction de mise en relief et la vivacité du marqueur discursif hébreu, dans une tournure française digne et intelligible.
- source_word: אָנֹכִי עִמָּךְ
  choice: je suis avec toi
  rationale: Rend directement la présence personnelle affirmée par le pronom indépendant et la préposition, sans alourdir par « moi-même ».
- source_word: וּשְׁמַרְתִּיךָ
  choice: Je te garderai
  rationale: « Garder » préserve l’éventail de sens de שׁמר — protéger, veiller sur — tout en restant concis et naturel dans ce contexte.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: partout où tu iras
  rationale: Expression française idiomatique qui communique l’étendue indéfinie des déplacements de Jacob.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: je te ramènerai
  rationale: Le hiphil de שוב est causatif ; « ramener » en restitue naturellement la force.
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: dans ce pays
  rationale: Dans le contexte de la promesse patriarcale, אֲדָמָה désigne ici le territoire où se trouve Jacob plutôt que la matière du sol ; « pays » rend clairement cette portée géographique.
- source_word: לֹא אֶעֱזָבְךָ
  choice: je ne t’abandonnerai pas
  rationale: « Abandonner » exprime naturellement la rupture de présence ou de soutien que Dieu exclut ici ; « quitter » demeure une possibilité plus littérale.
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: jusqu’à ce que j’aie accompli
  rationale: La tournure française rend l’achèvement futur marqué par la construction hébraïque, sans reproduire artificiellement ses particules.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: ce que je t’ai dit
  rationale: Le verbe hébreu signifie littéralement « parler/dire ». Cette formulation conserve le sens explicite sans remplacer celui-ci par l’interprétation « promis ».
theological_decisions:
- issue: Présence, protection et fidélité de Dieu envers Jacob
  choice: Formuler directement les assurances de présence, de protection, de retour et d’accomplissement de la parole divine.
  alternative: Employer un vocabulaire plus traditionnel tel que « je ne te délaisserai pas », ou expliciter « ce que je t’ai promis ».
  rationale: Le texte unit la présence personnelle de Dieu à des engagements concrets. La traduction conserve cette portée sans l’élargir par des formulations doctrinales ultérieures ni réduire « dit » à « promis ».
- issue: Portée de « jusqu’à ce que »
  choice: 'Conserver la limite formulée par le texte : « jusqu’à ce que j’aie accompli ».'
  alternative: Reformuler pour préciser que Dieu ne quittera jamais Jacob, même après l’accomplissement.
  rationale: La construction assure la présence divine au moins jusqu’à l’accomplissement annoncé ; elle n’affirme pas que cette présence cessera ensuite. La traduction maintient la formulation et sa tension sans ajouter une conclusion absente du verset.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement convient au discours direct adressé à Jacob. Les phrases brèves conservent la solennité de l’assurance divine sans archaïsmes inutiles.
