  text: וַ/יִּקְרָ֥א יִצְחָ֛ק אֶֽל יַעֲקֹ֖ב וַ/יְבָ֣רֶךְ אֹת֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ וַ/יֹּ֣אמֶר ל֔/וֹ לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: fr
  text: 'Isaac appela Jacob, le bénit et lui donna cet ordre : « Tu ne prendras pas pour femme une des filles de Canaan.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « filles de Canaan » désigne les femmes cananéennes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Avec אֶל suivi d’une personne, קרא signifie ici appeler quelqu’un auprès de soi. « Appela » est naturel en français narratif et n’ajoute pas la solennité de « convoqua ».
- source_word: וַיְבָרֶךְ
  choice: le bénit
  rationale: ברך est le verbe courant pour « bénir » ; le pronom objet renvoie explicitement à Jacob.
- source_word: וַיְצַוֵּהוּ
  choice: lui donna cet ordre
  rationale: צוה exprime un commandement autoritatif. Cette tournure française introduit naturellement le discours direct tout en conservant la force de l’ordre.
- source_word: וַיֹּאמֶר לוֹ
  choice: « … »
  rationale: La formule « et lui dit » est intégrée à l’introduction « lui donna cet ordre », ce qui évite une répétition lourde sans perdre la fonction d’introduction du discours direct.
- source_word: לֹא תִקַּח
  choice: Tu ne prendras pas
  rationale: L’imparfait hébreu précédé de לֹא a ici une valeur prohibitive. Le futur français exprime un ordre ferme dans un registre digne et courant.
- source_word: אִשָּׁה
  choice: pour femme
  rationale: Dans ce contexte matrimonial, אִשָּׁה désigne une épouse. L’expression « prendre pour femme » rend clairement l’idée d’épouser.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: une des filles de Canaan
  rationale: La traduction conserve l’expression hébraïque « filles de Canaan », qui désigne les femmes cananéennes, tout en rendant naturellement la construction partitive introduite par מִן.
- source_word: וַ
  choice: enchaînement narratif sans connecteur initial explicite
  rationale: Le français peut marquer naturellement la succession par le passé simple, sans imposer « alors » ou « puis » là où le waw narratif assure surtout la continuité du récit.
