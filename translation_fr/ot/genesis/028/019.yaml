lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: Il donna … le nom de
  rationale: La construction hébraïque signifie qu’il nomma le lieu. Cette tournure française naturelle conserve la mention explicite du « nom » sans reproduire maladroitement l’idiome hébreu.
- source_word: הַמָּקוֹם הַהוּא
  choice: ce lieu
  rationale: Le démonstratif renvoie au lieu où Jacob vient de vivre l’événement; « ce lieu » est naturel et précis en français.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Le nom propre est translittéré selon l’usage français biblique courant; sa signification est indiquée en note.
- source_word: וְאוּלָם
  choice: mais
  rationale: La particule introduit une précision contrastive sur le nom antérieur de la ville.
- source_word: לוּז
  choice: Louz
  rationale: Translittération française traditionnelle du nom propre hébreu.
- source_word: שֵׁם הָעִיר לָרִאשֹׁנָה
  choice: auparavant la ville s’appelait
  rationale: Cette formulation idiomatique exprime clairement que Louz était le nom antérieur de la ville, tout en évitant une syntaxe française pesante.
