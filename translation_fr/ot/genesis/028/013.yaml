source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: fr
  text: 'Et voici que Yahweh se tenait au-dessus d’elle[a] et dit : « Je suis Yahweh, le Dieu d’Abraham, ton père, et le Dieu d’Isaac. La terre sur laquelle tu es couché, je te la donnerai, ainsi qu’à ta descendance[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de lui » ou « au-dessus de lui », si le pronom renvoie à Jacob plutôt qu’à l’échelle ou à la rampe.
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : « ta semence » ; le mot est ici un nom collectif désignant la descendance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la fonction de mise en relief et la vivacité de la particule hébraïque dans un français actuel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: נִצָּב
  choice: se tenait
  rationale: Le participe décrit une posture continue dans la vision; l’imparfait français rend naturellement cet aspect.
- source_word: עָלָיו
  choice: au-dessus d’elle
  rationale: Le pronom est rapporté à l’échelle ou rampe mentionnée immédiatement auparavant; l’ambiguïté quant à un possible renvoi à Jacob est signalée en note.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: le Dieu d’Abraham, ton père
  rationale: Suit la construction hébraïque tout en indiquant naturellement qu’Abraham est appelé le père de Jacob au sens ancestral.
- source_word: הָאָרֶץ
  choice: La terre
  rationale: Dans le contexte de la promesse patriarcale, « terre » désigne à la fois le territoire promis et le sol sur lequel Jacob repose.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: sur laquelle tu es couché
  rationale: Rend l’action en cours exprimée par le participe et conserve la relation spatiale marquée par עַל.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: je la donnerai à toi
  rationale: Le futur convient à la promesse; la reprise pronominale et le détachement gardent l’emphase hébraïque sur le bénéficiaire.
- source_word: וּלְזַרְעֶךָ
  choice: et à ta descendance
  rationale: « Descendance » rend naturellement en français le nom collectif singulier זֶרַע sans le réduire à un seul individu ni employer le littéral ambigu « semence ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le nom personnel divin; sa translittération le distingue d’un titre et respecte la donnée hébraïque.
- issue: Référent de עָלָיו dans la vision
  choice: au-dessus d’elle, en référence à l’échelle ou rampe
  alternative: près de lui / au-dessus de lui, en référence à Jacob
  rationale: L’antécédent immédiat est l’objet reliant terre et ciel, mais la morphologie permet également un renvoi masculin à Jacob; la note préserve cette ambiguïté réelle.
- issue: Portée de זֶרַע
  choice: ta descendance
  alternative: ta semence / ton descendant
  rationale: Le terme hébreu est un collectif singulier. « Descendance » maintient sa portée collective dans ce contexte sans exclure les développements théologiques ultérieurs.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » maintient la solennité vive de la scène sans archaïsme excessif. Les temps verbaux français distinguent la posture continue (« se tenait »), la parole ponctuelle (« dit ») et la promesse (« donnerai »).
