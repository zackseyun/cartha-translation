base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: fr
  text: Isaac fit partir Jacob. Celui-ci se rendit à Paddân-Aram, chez Laban, fils de Betouel l’Araméen et frère de Rébecca, la mère de Jacob et d’Ésaü.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: fit donc partir
  rationale: Dans ce contexte, שׁלח signifie envoyer quelqu’un en le faisant partir. « Fit partir » exprime naturellement en français le départ voulu par Isaac sans suggérer nécessairement un renvoi hostile.
- source_word: וַיֵּלֶךְ
  choice: Celui-ci se rendit
  rationale: הלך est le verbe courant « aller ». « Celui-ci » désambiguïse le sujet après la mention d’Isaac et de Jacob, tandis que « se rendit » convient à un déplacement vers une destination précise.
- source_word: פַּדֶּנָה אֲרָם
  choice: à Paddân-Aram
  rationale: Le nom de lieu est translittéré, et le suffixe directionnel de פַּדֶּנָה est rendu naturellement par « à ».
- source_word: אֶל לָבָן
  choice: chez Laban
  rationale: La préposition אֶל indique ici le mouvement vers la personne auprès de laquelle Jacob doit séjourner. « Chez Laban » est l’expression française la plus naturelle.
- source_word: בֶּן בְּתוּאֵל
  choice: fils de Betouel
  rationale: La construction filiale hébraïque est rendue directement et idiomatiquement.
- source_word: הָאֲרַמִּי
  choice: l’Araméen
  rationale: אֲרַמִּי désigne précisément un Araméen. Ce terme est historiquement plus exact que l’ancien équivalent traditionnel « Syrien ».
- source_word: אֲחִי רִבְקָה
  choice: frère de Rébecca
  rationale: La construction conserve clairement l’identification de Laban comme frère de Rébecca tout en restant naturelle en français.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: la mère de Jacob et d’Ésaü
  rationale: L’apposition explicative de l’hébreu est conservée. La répétition de « de » devant Ésaü respecte l’usage français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase est divisée en deux pour éviter une longue chaîne syntaxique et pour rendre sans ambiguïté le sujet de וַיֵּלֶךְ. Les noms propres suivent une translittération française courante.
