  text: וַ/יֵּצֵ֥א יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֖לֶךְ חָרָֽנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/010.yaml
  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: fr
  text: Jacob partit de Bersabée et se rendit à Harrân[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte une terminaison indiquant un mouvement en direction de Harrân.
    reason: La note conserve la nuance morphologique de la terminaison directionnelle attachée au nom du lieu.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: partit
  rationale: Le verbe יצא exprime ici le fait de quitter un lieu. « Partit de » est naturel en français et rend clairement le point de départ.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle et courante du nom יעקב.
- source_word: מִבְּאֵר שָׁבַע
  choice: de Bersabée
  rationale: La préposition מִן indique la provenance. « Bersabée » est la forme française traditionnelle du nom de lieu בְּאֵר שֶׁבַע.
- source_word: וַיֵּלֶךְ
  choice: se rendit
  rationale: הלך est le verbe courant signifiant aller. Dans ce récit de déplacement, « se rendit » donne un français naturel sans ajouter l'idée plus précise d'un voyage prolongé.
- source_word: חָרָנָה
  choice: à Harrân
  rationale: La terminaison directionnelle -ה indique un mouvement en direction de Harrân. En français idiomatique, « à Harrân » exprime naturellement cette destination; la note signale la forme hébraïque.
