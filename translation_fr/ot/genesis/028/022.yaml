  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: fr
  text: Cette pierre, que j’ai dressée en stèle, sera la maison de Dieu[a], et, de tout ce que tu me donneras, je t’en donnerai assurément le dixième[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera une maison de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je t’en donnerai assurément la dîme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצֵּבָה
  choice: stèle
  rationale: Le terme désigne une pierre dressée servant de monument ou de marqueur. « Stèle » conserve cette image concrète et convient au registre narratif sans préciser indûment sa fonction.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: sera la maison de Dieu
  rationale: Cette formulation rend directement le groupe construit hébreu et demeure naturelle en français. Elle préserve l’affirmation concernant ce lieu sacré sans y importer une théologie ultérieure du temple.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte du vœu de Jacob et de la rencontre relatée auparavant, le mot renvoie au Dieu qui lui est apparu, et non à une divinité indéterminée.
- source_word: תִּתֶּן לִי
  choice: tu me donneras
  rationale: Le futur français exprime naturellement l’imparfait hébreu dans le cadre de ce vœu et conserve l’idée simple de ce que Dieu accordera à Jacob.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: je t’en donnerai certainement le dixième
  rationale: La tournure rend à la fois l’idée de consacrer un dixième et l’intensification produite par l’infinitif absolu suivi du verbe conjugué. Elle reste transparente pour un lectorat moderne.
- source_word: לָךְ
  choice: je t’en donnerai
  rationale: Le pronom destinataire est intégré idiomatiquement à la construction française et indique clairement que le dixième est destiné à Dieu.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: Cette pierre que j’ai dressée
  rationale: « Dressée » convient au geste d’ériger la pierre et évite la formulation plus lourde « que j’ai placée comme stèle ».
theological_decisions:
- issue: Nature du vœu de Jacob concernant la pierre
  choice: Conserver l’affirmation selon laquelle la pierre sera « la maison de Dieu », comprise dans son contexte comme désignant un lieu consacré lié à la rencontre divine.
  alternative: Préciser que la pierre devient elle-même un sanctuaire, ou présenter le passage comme une annonce directe du temple ultérieur.
  rationale: L’hébreu affirme simplement que cette pierre sera la maison de Dieu. La traduction maintient cette tension concrète sans ajouter une explication architecturale ou prophétique absente du verset.
- issue: Portée du dixième promis
  choice: Exprimer une promesse emphatique de donner à Dieu le dixième de tout ce qu’il accordera à Jacob.
  alternative: Employer exclusivement le vocabulaire institutionnel de la dîme et y associer les prescriptions cultuelles ultérieures.
  rationale: Le verset décrit le vœu personnel de Jacob. Il convient d’en préserver la force sans projeter rétroactivement sur lui les structures de la loi mosaïque ou d’une pratique ecclésiale.
translation_notes:
  register: Français international moderne, digne et accessible. « Stèle » rend avec concision la pierre dressée; « le dixième » est plus immédiatement compréhensible que le seul terme cultuel « dîme ». Les deux notes signalent les principales possibilités de formulation sans résoudre abusivement l’ambiguïté.
