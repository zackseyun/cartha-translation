  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: fr
  text: et que je revienne en paix à la maison de mon père[a], et Yahweh sera mon Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et que je revienne sain et sauf à la maison de mon père ». L’expression hébraïque traduite par « en paix » peut aussi insister sur la sécurité et le bien-être au retour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: et que je revienne
  rationale: Le verbe שׁוב signifie « revenir ». Le subjonctif français poursuit naturellement la série de conditions du vœu commencé au verset précédent, tout en gardant l’orientation future de l’hébreu.
- source_word: בְשָׁלוֹם
  choice: en paix
  rationale: שָׁלוֹם peut évoquer la paix, l’intégrité, le bien-être et la sécurité. « En paix » en conserve l’ampleur, tandis qu’une note signale le sens possible de retour sain et sauf.
- source_word: אֶל בֵּית אָבִי
  choice: à la maison de mon père
  rationale: Cette formulation rend directement le groupe construit hébreu et conserve à la fois l’idée du domicile et celle de la maisonnée paternelle.
- source_word: וְהָיָה
  choice: et ... sera
  rationale: La coordination et le futur rendent la forme hébraïque sans ajouter explicitement « alors ». Le lien avec la séquence conditionnelle demeure perceptible sans que son interprétation soit surdéterminée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin personnel préserve le tétragramme au lieu de lui substituer un titre.
- source_word: לִי לֵאלֹהִים
  choice: sera mon Dieu
  rationale: Littéralement, l’expression signifie « sera pour moi comme Dieu / sera Dieu pour moi ». « Sera mon Dieu » en rend naturellement la relation d’appartenance et d’allégeance.
theological_decisions:
- issue: La déclaration de Jacob constitue-t-elle l’aboutissement conditionnel de son vœu ou une simple affirmation coordonnée ?
  choice: Conserver la coordination « et » tout en maintenant la phrase dans la série conditionnelle par « que je revienne ».
  alternative: « alors Yahweh sera mon Dieu »
  rationale: La syntaxe du passage permet de comprendre cette proposition comme l’aboutissement des conditions précédentes, mais le texte hébreu emploie simplement la conjonction וְ. La formulation retenue préserve cette tension sans transformer l’implicite en conclusion explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise initiale « et que » assume que le verset poursuit la phrase et le vœu commencés au verset précédent. « Maison de mon père » conserve la portée familiale de l’expression hébraïque.
