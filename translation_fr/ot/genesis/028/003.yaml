  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: fr
  text: Que le Dieu tout-puissant[a] te bénisse, qu’il te rende fécond et te multiplie, afin que tu deviennes une communauté de peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « El Shaddaï ». Traduction traditionnelle : « le Dieu tout-puissant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: le Dieu tout-puissant
  rationale: Cette traduction française établie rend le titre divin plutôt que de le translittérer; l’article défini convient à l’usage idiomatique français.
- source_word: יְבָרֵךְ
  choice: Que… te bénisse
  rationale: Dans ce contexte de bénédiction, l’imparfait hébreu a une valeur volitive; le subjonctif introduit par « que » exprime naturellement ce souhait en français.
- source_word: וְיַפְרְךָ
  choice: qu’il te rende fécond
  rationale: Le hifil de פרה est causatif. Cette formulation conserve explicitement l’idée de fécondité accordée par Dieu.
- source_word: וְיַרְבֶּךָ
  choice: et te multiplie
  rationale: Le hifil de רבה évoque l’accroissement numérique, notamment par une nombreuse descendance. « Te multiplie » préserve cette formulation concise sans préciser davantage que l’hébreu.
- source_word: וְהָיִיתָ
  choice: afin que tu deviennes
  rationale: Dans la suite de la bénédiction, cette forme exprime naturellement l’aboutissement visé ou attendu des actions précédentes.
- source_word: לִקְהַל עַמִּים
  choice: une communauté de peuples
  rationale: « Communauté » rend קהל comme groupe constitué, tandis que le pluriel « peuples » conserve עַמִּים et son horizon collectif.
theological_decisions:
- issue: Traduction du titre divin אֵל שַׁדַּי
  choice: le Dieu tout-puissant
  alternative: El Shaddaï
  rationale: Le texte principal traduit le titre selon son équivalent français traditionnel, sans faire de la translittération une interprétation doctrinale. La forme hébraïque est conservée en note.
- issue: Portée de l’accroissement promis
  choice: te multiplie
  alternative: te donne de nombreux descendants
  rationale: Le contexte patriarcal suggère la descendance, mais l’hébreu ne la nomme pas explicitement dans ce membre de phrase. La traduction garde donc cette légère ouverture.
- issue: Relation exprimée par וְהָיִיתָ
  choice: afin que tu deviennes
  alternative: et tu deviendras
  rationale: Dans cette bénédiction, la proposition se comprend comme l’aboutissement attendu des demandes précédentes. « Afin que » rend ce lien sans transformer la bénédiction en simple prédiction catégorique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « que » clarifie la portée du souhait de bénédiction; « communauté de peuples » reste naturelle tout en conservant le pluriel du texte hébreu.
