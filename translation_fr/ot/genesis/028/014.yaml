  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: fr
  text: Ta descendance sera comme la poussière de la terre. Tu t’étendras vers l’ouest et vers l’est, vers le nord et vers le sud. En toi et en ta descendance, toutes les familles de la terre seront bénies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les familles de la terre se béniront par toi et par ta descendance ». Le verbe hébreu peut aussi être compris dans un sens réfléchi ou moyen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: Le parfait qal précédé de la conjonction a ici une valeur future dans le contexte de la promesse.
- source_word: זַרְעֲךָ / וּבְזַרְעֶךָ
  choice: ta descendance / en ta descendance
  rationale: « Descendance » exprime naturellement en français la valeur collective de זֶרַע, sans recourir à l’archaïsme « semence » ni imposer un pluriel explicatif.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: comme la poussière de la terre
  rationale: Cette formulation conserve l’image hébraïque d’une multitude impossible à compter et s’accorde avec le vocabulaire de la promesse patriarcale.
- source_word: וּפָרַצְתָּ
  choice: tu t’étendras
  rationale: Le verbe évoque l’action de faire irruption ou de déborder; dans cette énumération géographique, « s’étendre » rend clairement l’idée d’expansion sans lourdeur.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: vers l’ouest et vers l’est, vers le nord et vers le sud
  rationale: Les terminaisons directionnelles indiquent un mouvement. Dans cette série, נֶגֶב désigne clairement le sud plutôt que la région du Néguev.
- source_word: וְנִבְרֲכוּ
  choice: seront bénies
  rationale: Le nifal de ברך se comprend naturellement au passif dans cette promesse, tout en permettant une lecture réfléchie ou moyenne signalée en note.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: en toi et en ta descendance
  rationale: La traduction conserve la préposition ב et la formulation dense de la promesse, sans préciser de manière interprétative « par ton intermédiaire ».
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: toutes les familles de la terre
  rationale: « Familles » rend naturellement les groupes de parenté désignés par מִשְׁפָּחוֹת; « terre » exprime ici la portée universelle de la promesse.
theological_decisions:
- issue: Sens de ברך au nifal dans la formule de bénédiction patriarcale
  choice: 'Lecture passive : « toutes les familles de la terre seront bénies »'
  alternative: 'Lecture réfléchie ou moyenne : « toutes les familles de la terre se béniront »'
  rationale: Le passif convient directement au contexte de promesse et à l’usage de la formule patriarcale. Comme la forme hébraïque peut aussi recevoir un sens réfléchi ou moyen, cette possibilité réelle est conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du rythme de la promesse hébraïque, avec des phrases séparées pour une lecture naturelle. Le marqueur de note est placé après la proposition concernée, celle dont le verbe admet une autre lecture.
