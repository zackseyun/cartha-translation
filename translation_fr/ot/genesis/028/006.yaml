  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: fr
  text: 'Ésaü vit qu’Isaac avait béni Jacob et l’avait envoyé à Paddân-Aram pour y prendre une femme, et qu’en le bénissant, il lui avait donné cet ordre : « Tu ne prendras pas de femme parmi les filles de Canaan[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « parmi les femmes cananéennes ». Littéralement : « parmi les filles de Canaan ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: Ésaü vit
  rationale: Le wayyiqtol de ראה fait progresser le récit. Le passé simple convient au registre narratif français sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: כִּי בֵרַךְ יִצְחָק אֶת יַעֲקֹב
  choice: qu’Isaac avait béni Jacob
  rationale: Le plus-que-parfait indique naturellement que la bénédiction précède le constat d’Ésaü.
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: et l’avait envoyé à Paddân-Aram
  rationale: Le plus-que-parfait coordonne cet acte avec la bénédiction antérieure. Le nom géographique est translittéré selon l’usage français.
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: pour y prendre une femme
  rationale: La proposition infinitive exprime le but. « y » rend מִשָּׁם de façon idiomatique, et « prendre une femme » conserve la formulation matrimoniale du texte.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: qu’en le bénissant
  rationale: Le gérondif rend naturellement la circonstance ou concomitance marquée par ב, sans trancher plus précisément entre valeur temporelle et circonstancielle.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: il lui avait donné cet ordre
  rationale: Cette tournure française rend clairement צוה et introduit naturellement le discours direct; le plus-que-parfait maintient la perspective rétrospective dépendant de « vit ».
- source_word: לֹא תִקַּח
  choice: Tu ne prendras pas
  rationale: Le futur négatif français exprime avec dignité et force la défense adressée directement à Jacob.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: parmi les filles de Canaan
  rationale: La formulation conserve l’expression hébraïque « filles de Canaan » tout en utilisant « parmi », naturel en français après « prendre une femme ».
