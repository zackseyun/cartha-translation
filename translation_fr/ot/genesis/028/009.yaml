revisions:
- from: Ésaü se rendit donc auprès d’Ismaël et prit pour femme Mahalath, fille d’Ismaël, fils d’Abraham, et sœur de Nebayoth, en plus des femmes qu’il avait déjà[a].
  to: Ésaü se rendit auprès d’Ismaël et prit pour femme Mahalath, fille d’Ismaël, fils d’Abraham, et sœur de Nebayoth, en plus de ses femmes[a].
  rationale: La révision retire l’inférence non exprimée par « donc » et remplace la formulation explicative intégrée « des femmes qu’il avait déjà » par la tournure plus directe « de ses femmes ». La note conserve l’explication nécessaire de la valeur additive de עַל נָשָׁיו, dans une formulation française claire et fidèle.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:16:26Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la séquence narrative, les liens généalogiques, le mariage et le sens additif de עַל נָשָׁיו. Toutefois, « donc » introduit une inférence absente de l’hébreu, dont le wayyiqtol marque simplement la suite du récit.
  naturalness: La formulation est naturelle en français moderne. La suppression de « donc » la rend plus exacte sans nuire à la fluidité. « En plus de ses femmes » est concis et fidèle; « qu’il avait déjà » est explicatif mais n’est pas nécessaire dans le texte courant.
  terminology: Les formes Ésaü, Ismaël et Abraham sont établies en français. Mahalath et Nebayoth sont des translittérations cohérentes avec le projet. « Prendre pour femme » rend adéquatement l’idiome matrimonial.
  issues:
  - severity: low
    issue: Ajout de « donc »
    rationale: Le texte hébreu ne fournit pas de connecteur causal ou conclusif. Le waw narratif introduit l’action suivante; « donc » risque de renforcer une relation logique qui doit plutôt rester implicite.
  - severity: low
    issue: Note proposant « à côté de ses autres femmes »
    rationale: « À côté de » est moins idiomatique et moins précis pour la valeur additive de עַל dans ce contexte. La note peut expliquer directement qu’il s’agit d’une épouse supplémentaire, sans présenter cette formulation comme alternative.
  revised_text: Ésaü se rendit auprès d’Ismaël et prit pour femme Mahalath, fille d’Ismaël, fils d’Abraham, et sœur de Nebayoth, en plus de ses femmes[a].
  revised_footnotes:
  - marker: a
    text: L’expression hébraïque indique que Mahalath fut prise comme épouse supplémentaire, et non à la place des femmes qu’Ésaü avait déjà.
    reason: lexical_alternative
  revision_rationale: La révision retire l’inférence non exprimée par « donc » et remplace la formulation explicative intégrée « des femmes qu’il avait déjà » par la tournure plus directe « de ses femmes ». La note conserve l’explication nécessaire de la valeur additive de עַל נָשָׁיו, dans une formulation française claire et fidèle.
