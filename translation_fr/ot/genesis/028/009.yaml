  text: וַ/יֵּ֥לֶךְ עֵשָׂ֖ו אֶל יִשְׁמָעֵ֑אל וַ/יִּקַּ֡ח אֶֽת מָחֲלַ֣ת בַּת יִשְׁמָעֵ֨אל בֶּן אַבְרָהָ֜ם אֲח֧וֹת נְבָי֛וֹת עַל נָשָׁ֖י/ו ל֥/וֹ לְ/אִשָּֽׁה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: fr
  text: Ésaü se rendit auprès d’Ismaël et prit pour femme Mahalath, fille d’Ismaël, fils d’Abraham, et sœur de Nebayoth, en plus de ses femmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque indique que Mahalath fut prise comme épouse supplémentaire, et non à la place des femmes qu’Ésaü avait déjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל
  choice: Ésaü se rendit donc auprès d’Ismaël
  rationale: Le wayyiqtol fait progresser le récit; « se rendit auprès de » exprime naturellement le déplacement vers une personne sans ajouter l’idée qu’Ésaü serait simplement allé dans un lieu.
- source_word: וַיִּקַּח ... לְאִשָּׁה
  choice: prit pour femme
  rationale: Cette tournure française naturelle conserve l’image de לקח tout en rendant explicite le sens matrimonial indiqué par לְאִשָּׁה.
- source_word: מָחֲלַת
  choice: Mahalath
  rationale: Le nom propre est translittéré sans chercher à en traduire l’étymologie.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: fille d’Ismaël, fils d’Abraham
  rationale: La chaîne généalogique est conservée clairement et sans ambiguïté en français.
- source_word: אֲחוֹת נְבָיוֹת
  choice: sœur de Nebayoth
  rationale: L’apposition identificatrice de l’hébreu est reproduite directement.
- source_word: עַל נָשָׁיו
  choice: en plus des femmes qu’il avait déjà
  rationale: 'Dans ce contexte, עַל exprime l’ajout: Mahalath devient une épouse supplémentaire, et non la remplaçante des épouses précédentes. L’ajout de « qu’il avait déjà » rend cette relation claire en français courant.'
- source_word: לוֹ
  choice: pour femme
  rationale: Le bénéfice ou l’intérêt personnel marqué par לוֹ est naturellement inclus dans l’expression française « prendre pour femme », sans lourdeur réflexive.
theological_decisions:
- issue: Statut de Mahalath par rapport aux épouses précédentes d’Ésaü
  choice: La présenter comme une épouse supplémentaire
  alternative: Comprendre עַל dans un sens spatial ou comme indiquant un remplacement
  rationale: L’emploi contextuel de עַל נָשָׁיו indique l’addition aux femmes qu’Ésaü avait déjà; la traduction ne porte aucun jugement théologique sur cette situation matrimoniale.
translation_notes:
  register: Français international actuel, narratif et digne. Les noms bibliques couramment établis en français sont conservés (« Ésaü », « Ismaël », « Abraham »), tandis que « Mahalath » et « Nebayoth » suivent de près les formes hébraïques. La syntaxe reste fluide malgré la double précision généalogique.
