  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: fr
  text: que Jacob avait écouté son père et sa mère[a] et qu’il était allé à Paddân-Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait obéi à son père et à sa mère ». Dans ce contexte, le verbe hébreu peut exprimer à la fois le fait d’écouter et celui de tenir compte de ce qui est dit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: avait écouté
  rationale: Avec אֶל, le verbe שׁמע exprime ici le fait d’écouter en tenant compte de ce qui est dit. Le plus-que-parfait convient à la syntaxe française dans la série de faits constatés par Ésaü au verset précédent et préserve la nuance entre entendre et obéir.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: son père et sa mère
  rationale: Cette coordination est naturelle en français; le possessif singulier placé devant chaque terme n’est pas nécessaire pour rendre clairement les deux suffixes hébreux.
- source_word: וַיֵּלֶךְ
  choice: était allé
  rationale: הלך est le verbe courant signifiant « aller ». Le plus-que-parfait exprime naturellement l’antériorité dans la construction dépendant du contexte précédent.
- source_word: פַּדֶּנָה אֲרָם
  choice: à Paddân-Aram
  rationale: Le nom géographique est translittéré; la finale directionnelle ה est rendue par « à ». L’accent circonflexe aide à représenter la voyelle longue de la forme hébraïque dans la graphie française.
- source_word: וַ
  choice: que… et que
  rationale: Les waw poursuivent une série narrative syntaxiquement rattachée au verset précédent. En français, la répétition de « que » rend clairement cette dépendance et la coordination des deux faits.
