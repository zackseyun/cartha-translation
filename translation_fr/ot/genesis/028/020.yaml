base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: fr
  text: 'Alors Jacob fit un vœu en disant : « Si Dieu est avec moi, me protège sur ce chemin que je parcours et me donne du pain à manger et un vêtement pour me vêtir, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: Jacob fit un vœu
  rationale: L’expression française naturelle « faire un vœu » rend l’association du verbe נדר et du nom נֶדֶר tout en conservant le caractère solennel de l’acte.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule française courante pour introduire le contenu du vœu.
- source_word: אִם
  choice: Si
  rationale: Conserve sans l’atténuer la forme conditionnelle du texte hébreu.
- source_word: אֱלֹהִים עִמָּדִי
  choice: Dieu est avec moi
  rationale: Rend directement la présence divine; le présent français convient dans la proposition introduite par « si » et porte sur la situation à venir sans employer un futur non standard après « si ».
- source_word: וּשְׁמָרַנִי
  choice: s’il veille sur moi
  rationale: שׁמר exprime ici la protection attentive de Dieu; « veiller sur moi » est naturel et précis en français moderne.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: pendant ce voyage que je fais
  rationale: Dans ce contexte de déplacement, דֶּרֶךְ désigne le trajet ou voyage. Cette formulation conserve la proposition relative tout en restant idiomatique.
- source_word: וְנָתַן לִי לֶחֶם לֶאֱכֹל
  choice: s’il me donne du pain à manger
  rationale: Conserve le terme concret « pain », qui peut aussi avoir le sens plus large de nourriture, ainsi que l’infinitif complémentaire.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: et des vêtements pour me vêtir
  rationale: Rend le nom collectif בֶּגֶד de façon naturelle en français et préserve le lien explicite avec l’action de se vêtir.
theological_decisions:
- issue: Nature conditionnelle du vœu de Jacob
  choice: « Si Dieu est avec moi »
  alternative: « Quand Dieu sera avec moi » ou « Puisque Dieu sera avec moi »
  rationale: La particule אִם marque normalement la condition. La traduction maintient la tension du texte quant à l’assurance ou à l’incertitude de Jacob, sans la trancher.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « s’il » clarifie la longue protase hébraïque. Le verset demeure syntaxiquement ouvert, puisque la suite et l’apodose du vœu se trouvent dans les versets suivants.
