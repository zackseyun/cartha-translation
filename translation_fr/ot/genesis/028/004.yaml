source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: fr
  text: Qu’il te donne la bénédiction d’Abraham, à toi et à ta descendance[a] avec toi, afin que tu prennes possession[b] du pays de tes séjours, que Dieu a donné à Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ta semence » ; le nom hébreu est au singulier, mais il a ici un sens collectif.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin que tu hérites du pays de tes séjours » .
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Qu’il te donne
  rationale: Dans le contexte de la bénédiction prononcée par Isaac, la forme volitive exprime un souhait ou une prière. Le français « Qu’il te donne » rend naturellement cette valeur.
- source_word: בִּרְכַּת אַבְרָהָם
  choice: la bénédiction d’Abraham
  rationale: Cette formulation reproduit clairement la chaîne construite et conserve le lien explicite avec les promesses faites à Abraham.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: à toi et à ta descendance avec toi
  rationale: « Descendance » rend naturellement le nom collectif זֶרַע. L’expression « avec toi », présente dans l’hébreu, est maintenue malgré sa légère étrangeté afin de ne pas effacer le rapport entre Jacob et sa lignée.
- source_word: לְרִשְׁתְּךָ
  choice: afin que tu prennes possession
  rationale: L’infinitif précédé de לְ exprime ici le but ou le résultat. « Prendre possession » convient au pays promis sans imposer exclusivement la nuance d’héritage, qui reste possible.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: du pays où tu séjournes
  rationale: Cette tournure française naturelle conserve l’idée d’un séjour dans un pays où le patriarche ne possède pas encore de demeure permanente. « Le pays de tes séjours » serait plus formel, mais peu idiomatique.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: que Dieu a donné à Abraham
  rationale: La proposition relative est rendue directement, et אֱלֹהִים est traduit ici par « Dieu ».
theological_decisions:
- issue: Portée de la bénédiction abrahamique
  choice: Conserver « la bénédiction d’Abraham » et le don concret du pays
  alternative: Expliciter « la bénédiction promise à Abraham » ou généraliser en parlant de prospérité
  rationale: Le texte relie directement la bénédiction de Jacob aux promesses faites à Abraham. Il ne faut ni rendre implicite ce lien d’alliance ni réduire la bénédiction à une prospérité abstraite.
- issue: Possession ou héritage du pays
  choice: afin que tu prennes possession
  alternative: afin que tu hérites
  rationale: Le verbe ירש peut évoquer l’héritage aussi bien que la prise de possession. La traduction principale garde le sens concret dans ce contexte foncier, tandis que la note préserve l’autre nuance légitime.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de bénédiction « Qu’il te donne » est naturelle dans un registre biblique actuel. La formulation conserve « avec toi », légèrement inhabituelle mais significative dans l’hébreu, et évite le terme vieilli « postérité ».
