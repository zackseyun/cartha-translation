  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: fr
  text: Ésaü vit que les filles de Canaan déplaisaient à Isaac, son père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « étaient mauvaises aux yeux d’Isaac, son père ». Dans ce contexte, l’adjectif hébreu traduit par « mauvaises » indique probablement qu’Isaac les jugeait défavorablement comme épouses.'
    reason: Alternative lexicale et conservation de l’expression idiomatique hébraïque.
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה garde son sens courant « voir » tout en permettant au contexte de suggérer qu’Ésaü prend conscience de l’opinion de son père; le récit progresse naturellement sans qu’il soit nécessaire de rendre explicitement le waw.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce qu’Ésaü constate, plutôt qu’une proposition causale.
- source_word: רָעוֹת
  choice: déplaisaient
  rationale: L’adjectif signifie littéralement « mauvaises »; associé à « aux yeux de », il exprime ici le jugement défavorable d’Isaac sur ces femmes, dans le contexte du mariage.
- source_word: בְּנוֹת כְּנָעַן
  choice: les filles de Canaan
  rationale: Cette formulation conserve l’expression familiale et géographique de l’hébreu tout en restant intelligible en français.
- source_word: בְּעֵינֵי
  choice: à
  rationale: Avec « déplaire », le français exprime naturellement par le complément indirect le jugement que l’hébreu formule littéralement par « aux yeux de ».
- source_word: יִצְחָק אָבִיו
  choice: Isaac, son père
  rationale: La ponctuation rend clairement l’apposition et conserve l’ordre hébreu sans produire une tournure française raide.
