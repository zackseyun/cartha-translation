base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: fr
  text: Lève-toi, va à Paddân-Aram, à la maison de Betouel, le père de ta mère[a], et prends pour toi, de là, une femme parmi les filles de Laban, le frère de ta mère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « ton grand-père maternel ». Le texte conserve l’expression de parenté de l’hébreu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus simplement : « ton oncle maternel ». Le texte conserve l’expression de parenté de l’hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Lève-toi
  rationale: L’impératif de קום signifie « se lever ». « Lève-toi » est naturel en français actuel et conserve la succession des deux impératifs.
- source_word: לֵךְ֙
  choice: va
  rationale: L’impératif courant de הלך est rendu simplement et directement par « va ».
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: à Paddân-Aram
  rationale: Le nom de lieu est translittéré selon l’usage français, et le hé directionnel est rendu par « à ».
- source_word: בֵּ֥יתָה בְתוּאֵ֖ל
  choice: à la maison de Betouel
  rationale: Le nom בַּיִת suivi du nom de Betouel et muni d’une terminaison directionnelle désigne le lieu vers lequel Jacob doit aller. Cette formulation conserve explicitement l’image de la maison ou maisonnée.
- source_word: אֲבִ֣י אִמֶּ֑ךָ
  choice: le père de ta mère
  rationale: Cette traduction reproduit l’expression de parenté hébraïque sans la remplacer dans le texte par le terme relationnel plus synthétique « grand-père maternel ».
- source_word: וְ/קַח לְ/ךָ֤
  choice: et prends pour toi
  rationale: « Prends » rend לקח, tandis que « pour toi » conserve le datif d’intérêt exprimé par לְךָ.
- source_word: מִ/שָּׁם֙
  choice: là-bas
  rationale: Dans ce contexte de déplacement vers un lieu éloigné, « là-bas » restitue naturellement en français le point de provenance désigné par מִשָּׁם, littéralement « de là ».
- source_word: אִשָּׁ֔ה
  choice: une femme
  rationale: Le contexte indique une épouse à prendre en mariage. La tournure française « prendre pour toi une femme » garde le nom courant tout en laissant le contexte matrimonial explicite.
- source_word: מִ/בְּנ֥וֹת לָבָ֖ן
  choice: parmi les filles de Laban
  rationale: 'La préposition מן a ici une valeur partitive : la femme doit être choisie parmi les filles de Laban.'
- source_word: אֲחִ֥י אִמֶּֽ/ךָ
  choice: le frère de ta mère
  rationale: Cette formulation suit directement l’expression de parenté hébraïque et évite de la condenser silencieusement en « oncle ».
theological_decisions: []
