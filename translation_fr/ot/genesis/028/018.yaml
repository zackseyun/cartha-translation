source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יַעֲקֹ֜ב בַּ/בֹּ֗קֶר וַ/יִּקַּ֤ח אֶת הָ/אֶ֨בֶן֙ אֲשֶׁר שָׂ֣ם מְרַֽאֲשֹׁתָ֔י/ו וַ/יָּ֥שֶׂם אֹתָ֖/הּ מַצֵּבָ֑ה וַ/יִּצֹ֥ק שֶׁ֖מֶן עַל רֹאשָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: fr
  text: Jacob se leva de bon matin, prit la pierre qu’il avait placée près de sa tête, la dressa comme une stèle[a] et versa de l’huile sur son sommet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierre dressée ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur sa tête ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם יַעֲקֹב בַּבֹּקֶר
  choice: Jacob se leva de bon matin
  rationale: « Se leva de bon matin » exprime naturellement en français moderne l’idée de se lever tôt le matin, sans alourdir la phrase.
- source_word: הָאֶבֶן
  choice: la pierre
  rationale: Le nom hébreu est défini et singulier ; la traduction directe convient.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: qu’il avait placée près de sa tête
  rationale: « Près de sa tête » respecte l’expression hébraïque sans préciser abusivement que la pierre était directement sous sa tête.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: la dressa comme une stèle
  rationale: Le verbe et le nom décrivent une pierre mise debout. « Stèle » désigne en français une pierre dressée et convient au contexte, tandis que la note conserve une formulation plus concrète.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: versa de l’huile
  rationale: La traduction rend directement l’action exprimée, sans introduire le verbe interprétatif « oindre ».
- source_word: עַל רֹאשָׁהּ
  choice: sur son sommet
  rationale: Littéralement « sur sa tête » ; « sur son sommet » est idiomatique pour une pierre tout en conservant l’image spatiale.
theological_decisions:
- issue: Portée cultuelle possible de מַצֵּבָה et du versement d’huile
  choice: Décrire l’action sans en donner d’emblée une évaluation théologique
  alternative: Traduire par « pierre commémorative » ou dire qu’il « l’oignit »
  rationale: Le texte raconte que Jacob dresse la pierre et y verse de l’huile. Une formulation descriptive évite de juger cette pratique à partir d’autres passages ou d’ajouter une interprétation rituelle non explicitée ici.
translation_notes:
  register: Français international moderne, narratif et digne. La série verbale sans répétition du sujet restitue le rythme rapide de la chaîne d’actions hébraïque. Les notes portent seulement sur les deux expressions dont la traduction idiomatique masque légèrement la forme concrète de l’hébreu.
