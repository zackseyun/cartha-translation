  text: וַ/יִּירָא֙ וַ/יֹּאמַ֔ר מַה נּוֹרָ֖א הַ/מָּק֣וֹם הַ/זֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם בֵּ֣ית אֱלֹהִ֔ים וְ/זֶ֖ה שַׁ֥עַר הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: fr
  text: 'Il eut peur et dit : « Comme ce lieu est redoutable[a] ! Ce n’est autre que la maison de Dieu, et c’est la porte des cieux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme ce lieu inspire la crainte ! » Le terme hébreu peut exprimer la peur, l’effroi ou une profonde révérence.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « la porte du ciel ». L’hébreu emploie ici une forme traditionnellement rendue par « les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: Il eut peur
  rationale: Le verbe ירא décrit ici la réaction immédiate de Jacob. « Il eut peur » est naturel en français moderne et conserve la dimension de crainte sans la réduire à la seule révérence.
- source_word: מַה נּוֹרָא
  choice: Comme ce lieu est redoutable
  rationale: נוֹרָא désigne ce qui suscite crainte, effroi ou révérence. « Redoutable » garde cette tension dans un registre digne; la note signale la nuance d’émerveillement sacré.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ce lieu
  rationale: Traduction directe et naturelle du groupe démonstratif, avec « lieu » convenant au registre solennel du passage.
- source_word: אֵין זֶה כִּי אִם
  choice: Ce n’est rien de moins que
  rationale: Cette tournure rend l’identification restrictive et emphatique de l’idiome hébreu sans l’aplatir en un simple « seulement ».
- source_word: בֵּית אֱלֹהִים
  choice: la maison de Dieu
  rationale: La traduction transparente du groupe construit préserve l’image sacrée sans supposer qu’un sanctuaire matériel existe déjà à cet endroit.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: la porte des cieux
  rationale: Le pluriel français reflète la forme hébraïque שָׁמַיִם et conserve l’image cosmologique, tout en restant intelligible.
theological_decisions:
- issue: Rendu de אֱלֹהִים dans un contexte de référent singulier
  choice: Dieu
  alternative: les dieux
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici le Dieu unique qui vient de se révéler à Jacob; le contexte narratif impose le singulier.
- issue: Nuance de נוֹרָא dans un cadre de présence divine
  choice: redoutable
  alternative: impressionnant / digne d’effroi
  rationale: « Redoutable » maintient ensemble la crainte et la révérence suscitées par la présence divine, sans ramener le terme à la terreur seule ni à une admiration familière.
- issue: Nombre de שָׁמַיִם
  choice: les cieux
  alternative: le ciel
  rationale: « Les cieux » suit plus étroitement la forme hébraïque et conserve l’imagerie du texte; « le ciel » serait également idiomatique en français pour le domaine divin.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme, l’exclamation et la tension entre peur et révérence. Tous les marqueurs de notes figurent dans le texte.
