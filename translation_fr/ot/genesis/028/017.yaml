revisions:
- from: 'Il eut peur et dit : « Comme ce lieu est redoutable[a] ! Ce n’est rien de moins que la maison de Dieu, et c’est ici la porte des cieux[b]. »'
  to: 'Il eut peur et dit : « Comme ce lieu est redoutable[a] ! Ce n’est autre que la maison de Dieu, et c’est la porte des cieux[b]. »'
  rationale: La révision remplace une locution française potentiellement non exclusive par « Ce n’est autre que », qui rend avec précision l’emphase restrictive de l’hébreu. Elle ôte aussi « ici », ajout non requis, tout en préservant le sens, le registre et les deux ancres de note.
