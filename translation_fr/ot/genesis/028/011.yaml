  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: fr
  text: Il arriva en un certain lieu et y passa la nuit, car le soleil s’était couché. Il prit l’une des pierres du lieu[a], la plaça près de sa tête[b], puis se coucha en ce lieu-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il prit quelques pierres du lieu ». La construction hébraïque peut se comprendre comme désignant une seule pierre ou plusieurs pierres.
    reason: alternative_reading
  - marker: b
    text: Ou « sous sa tête » ou « comme appui pour sa tête ». Le terme hébreu désigne l’endroit de la tête ou ce qui lui sert d’appui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: Il arriva en un certain lieu
  rationale: Avec un lieu comme complément, פגע exprime ici le fait d’atteindre un endroit. « Un certain lieu » rend naturellement la première mention tout en signalant l’importance narrative du lieu.
- source_word: וַיָּלֶן שָׁם
  choice: y passa la nuit
  rationale: לון désigne le fait de séjourner quelque part pour la nuit; cette formulation est naturelle en français moderne.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: car le soleil s’était couché
  rationale: Avec « le soleil » pour sujet, בוא décrit idiomatiquement son coucher. Le plus-que-parfait explicite l’antériorité qui motive l’arrêt.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: Il prit l’une des pierres du lieu
  rationale: La préposition מִן devant le pluriel a naturellement une valeur partitive. Le singulier est probable dans le contexte, mais une compréhension collective ou plurielle reste possible et est signalée en note.
- source_word: מְרַאֲשֹׁתָיו
  choice: près de sa tête
  rationale: Le terme désigne l’endroit où repose la tête ou ce qui se trouve à son chevet. « Près de sa tête » préserve cette latitude sans imposer que la pierre ait été directement sous sa tête.
- source_word: וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא
  choice: puis se coucha en ce lieu-là
  rationale: שכב décrit ici l’action de se coucher, sans anticiper explicitement le sommeil. La répétition de « lieu » conserve l’insistance du récit sur l’endroit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition du mot « lieu » est maintenue en raison de son importance littéraire. Les notes conservent l’ambiguïté concernant le nombre de pierres et leur position exacte.
