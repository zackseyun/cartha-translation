  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: fr
  text: 'Alors Jacob se réveilla de son sommeil et dit : « Vraiment, Yahweh est présent en ce lieu, et moi, je ne le savais pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: se réveilla
  rationale: Le verbe désigne le fait de sortir du sommeil. Le passé simple convient au récit et reste naturel dans une narration biblique française.
- source_word: מִשְּׁנָתוֹ
  choice: de son sommeil
  rationale: Traduction directe et idiomatique du complément indiquant l’état dont Jacob sort en se réveillant.
- source_word: אָכֵן
  choice: Vraiment
  rationale: La particule exprime ici une constatation soudaine et assurée. « Vraiment » restitue cette prise de conscience sans ajouter de nuance absente du texte.
- source_word: יֵשׁ
  choice: est présent
  rationale: La particule existentielle affirme ici la présence de Yahweh dans ce lieu. « Est présent » rend ce sens clairement et naturellement en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin, et non un titre. La translittération « Yahweh » préserve ce nom personnel.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: en ce lieu
  rationale: Cette expression désigne l’endroit précis où Jacob a dormi et reçu le rêve. « En ce lieu » est clair, digne et naturel dans ce contexte.
- source_word: וְאָנֹכִי
  choice: et moi
  rationale: Le pronom indépendant est emphatique. « Et moi » maintient le contraste entre la présence de Yahweh et l’ignorance antérieure de Jacob.
- source_word: לֹא יָדָעְתִּי
  choice: je ne le savais pas
  rationale: Le passé exprime l’ignorance de Jacob jusqu’à son réveil; le pronom « le » reprend naturellement en français le fait que Yahweh était présent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement le tétragramme. « Yahweh » conserve le nom divin plutôt que de lui substituer un titre.
- issue: Nature de la présence affirmée par יֵשׁ
  choice: est présent en ce lieu
  alternative: est en ce lieu
  rationale: Le rendu explicite la valeur existentielle et locale de יֵשׁ sans préciser la manière de cette présence, que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif. La formulation « et moi » conserve l’insistance du pronom hébreu sans alourdir la phrase.
