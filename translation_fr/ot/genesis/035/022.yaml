source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: fr
  text: Or, pendant qu’Israël habitait dans ce pays, Ruben alla coucher avec Bilha, la concubine de son père, et Israël l’apprit[a]. Les fils de Jacob étaient au nombre de douze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et Israël entendit ». Le complément n’est pas exprimé en hébreu, mais il renvoie manifestement à l’acte de Ruben.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « Et les fils de Jacob étaient douze. » Cette phrase sert probablement de transition vers la liste des fils dans les versets suivants.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: Or, pendant que … habitait
  rationale: La construction introduit un nouvel événement tout en donnant comme arrière-plan une situation en cours. « Or, pendant que » restitue naturellement cette fonction narrative sans archaïsme.
- source_word: בָּאָרֶץ הַהִוא
  choice: dans ce pays
  rationale: Dans ce contexte, אֶרֶץ désigne la contrée où Israël séjournait, non la terre entière. « Ce pays » est idiomatique en français et reprend le lieu déjà évoqué.
- source_word: וַיֵּלֶךְ רְאוּבֵן וַיִּשְׁכַּב אֶת
  choice: Ruben alla coucher avec
  rationale: Le texte enchaîne explicitement « alla » et l’expression sexuelle « coucha avec ». La formulation française conserve le mouvement narratif et exprime l’acte sans l’atténuer ni devenir clinique.
- source_word: פִּילֶגֶשׁ
  choice: concubine
  rationale: « Concubine » est le terme français établi pour une femme ayant dans le foyer antique un statut conjugal reconnu mais secondaire; une paraphrase dans le texte principal serait plus interprétative.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: Israël l’apprit
  rationale: L’hébreu dit littéralement qu’Israël « entendit », sans complément exprimé. En français, « l’apprit » renvoie clairement et naturellement à l’acte qui vient d’être rapporté.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: Les fils de Jacob étaient au nombre de douze
  rationale: Cette phrase sert de transition vers l’énumération suivante. « Étaient au nombre de douze » rend clairement la formulation numérique hébraïque sans lui attribuer une portée théologique supplémentaire.
theological_decisions:
- issue: Rendre l’expression sexuelle sans euphémisme ni explicitation excessive
  choice: alla coucher avec
  alternative: eut des relations sexuelles avec; coucha avec
  rationale: Cette expression française est directe et intelligible, demeure proche de l’idiome hébreu et ne minimise pas la gravité de l’acte.
- issue: Ne pas déduire une réaction d’Israël de la simple mention qu’il apprit l’acte
  choice: et Israël l’apprit
  alternative: et Israël l’apprit, mais ne fit rien; et Israël fut indigné
  rationale: Le texte massorétique indique seulement qu’Israël entendit ou apprit ce qui s’était passé. Toute réaction morale, judiciaire ou affective ajoutée résoudrait abusivement le silence du récit.
- issue: Comprendre la dernière proposition comme une transition vers la liste des fils
  choice: 'Phrase distincte et sobre : « Les fils de Jacob étaient au nombre de douze. »'
  alternative: Relier étroitement cette proposition à l’inconduite de Ruben ou lui attribuer une signification doctrinale
  rationale: La proposition introduit naturellement l’énumération des fils dans les versets suivants; la traduction ne doit pas lui imposer de lien théologique non formulé.
translation_notes:
  register: Français international moderne, narratif et digne. Le nom « Ruben » suit l’usage biblique français courant. La formulation reste sobre et directe, sans archaïsme (« il advint ») ni ajout concernant la réaction d’Israël.
