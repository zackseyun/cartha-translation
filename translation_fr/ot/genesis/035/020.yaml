  source_fidelity: 'Le texte rend correctement l’action d’ériger, la pierre dressée, la relation avec la sépulture et la formule temporelle. Toutefois, « sur sa tombe » peut suggérer une position matériellement au-dessus de la tombe; « auprès de sa tombe » rend plus prudemment le עַל spatial dans ce contexte. La note alternative actuelle mêle aussi les référents : « une pierre marquant la tombe de Rachel » ne correspond pas exactement à la première occurrence, dont le référent possessif est implicite dans le contexte.'
  naturalness: « Pierre levée » est compréhensible, mais « pierre dressée » est plus naturel en français international contemporain pour une pierre érigée comme repère. « Jusqu’à ce jour » est idiomatique et convient au registre biblique moderne.
  terminology: « Pierre dressée » conserve le caractère concret de מַצֵּבָה sans imposer « stèle », qui peut évoquer une inscription, ni « monument », plus interprétatif. La répétition du même terme dans la seconde phrase reflète utilement le texte hébreu.
