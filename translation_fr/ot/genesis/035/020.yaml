  text: וַ/יַּצֵּ֧ב יַעֲקֹ֛ב מַצֵּבָ֖ה עַל קְבֻרָתָ֑/הּ הִ֛וא מַצֶּ֥בֶת קְבֻֽרַת רָחֵ֖ל עַד הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: fr
  text: Jacob dressa une pierre dressée auprès de sa tombe[a]. C’est la pierre dressée de la tombe de Rachel, jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une stèle » ou « un monument de pierre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: dressa
  rationale: Le hifil de נצב exprime ici l’action de mettre debout ou d’ériger. « Dressa » convient naturellement à une pierre levée.
- source_word: מַצֵּבָה
  choice: une pierre levée
  rationale: Le nom désigne une pierre dressée, servant souvent de marque ou de monument. « Pierre levée » conserve l’image concrète sans préciser une fonction que le terme seul n’impose pas.
- source_word: עַל קְבֻרָתָהּ
  choice: sur sa tombe
  rationale: La préposition עַל indique ici la position de la pierre par rapport au lieu d’inhumation, et קְבֻרָה désigne la tombe ou le lieu de sépulture.
- source_word: הִוא
  choice: C’est
  rationale: Le pronom reprend la pierre levée et l’identifie dans une phrase explicative; « C’est » est naturel en français.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: la pierre levée de la tombe de Rachel
  rationale: Cette formulation rend explicitement la chaîne construite hébraïque tout en conservant le même terme concret que dans la première proposition.
- source_word: עַד הַיּוֹם
  choice: jusqu’à ce jour
  rationale: Expression française traditionnelle et intelligible qui rend la continuité jusqu’au présent du narrateur.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Pierre levée » préserve l’image matérielle de מַצֵּבָה; la note propose « stèle », plus concise mais susceptible d’évoquer une pierre portant une inscription, ainsi qu’une formulation fonctionnelle plus explicite.
