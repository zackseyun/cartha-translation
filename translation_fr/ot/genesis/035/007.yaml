    issue: Ajout de « loin de »
    rationale: Le syntagme מִפְּנֵי אָחִיו exprime celui devant qui/de qui Jacob fuyait. « Loin de » explicite une distance ou un résultat qui n’est pas formulé dans l’hébreu; « fuyait son frère » est idiomatique et préserve mieux la concision et l’ambiguïté du texte source.
  revised_text: Là, il construisit un autel et appela ce lieu El-Béthel[a], car c’était là que Dieu s’était révélé à lui lorsqu’il fuyait son frère.
