base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: fr
  text: Là, il construisit un autel et appela ce lieu El-Béthel[a], car c’était là que Dieu s’était révélé à lui lorsqu’il fuyait son frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El-Béthel signifie probablement « Dieu de Béthel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Là, il construisit un autel
  rationale: Le verbe בנה signifie couramment « construire » ou « bâtir ». « Construisit » est naturel en français narratif et שָׁם est conservé en tête de phrase.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: appela ce lieu
  rationale: Dans un contexte d’attribution de nom, קרא avec לְ se rend naturellement par « appeler ». Le démonstratif « ce » convient mieux que l’article défini en français.
- source_word: אֵל בֵּית אֵל
  choice: El-Béthel
  rationale: La formule fonctionne ici comme le nom donné au lieu. Elle est donc translittérée, tandis que son sens probable est indiqué en note.
- source_word: כִּי שָׁם
  choice: car c’était là que
  rationale: כִּי introduit la raison du nom donné. Cette tournure française préserve aussi la seconde occurrence emphatique de שָׁם.
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: Dieu s’était révélé à lui
  rationale: Le nifal de גלה exprime ici une manifestation divine. Le plus-que-parfait situe naturellement cette révélation avant la construction de l’autel. Malgré les formes grammaticalement plurielles, le contexte désigne le Dieu unique rencontré par Jacob.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: lorsqu’il fuyait loin de son frère
  rationale: L’infinitif construit avec בְּ marque la circonstance temporelle. מִפְּנֵי, dans ce contexte de fuite, signifie s’éloigner de la présence ou de la menace de quelqu’un; « loin de » explicite naturellement ce mouvement en français.
theological_decisions:
- issue: Formes plurielles אֱלֹהִים et נִגְלוּ désignant le Dieu d’Israël
  choice: Dieu s’était révélé à lui
  alternative: les dieux s’étaient révélés à lui / Dieu lui était apparu
  rationale: Le contexte renvoie à la rencontre de Jacob avec le Dieu d’Israël à Béthel. Le singulier français évite de suggérer à tort plusieurs divinités, tandis que « s’était révélé » conserve l’idée de manifestation personnelle portée par le nifal.
- issue: Traduction ou translittération de אֵל בֵּית אֵל
  choice: El-Béthel dans le texte, avec explication en note
  alternative: Dieu de Béthel
  rationale: Puisque Jacob donne ici un nom au lieu, la translittération respecte sa fonction de nom propre. La note conserve le sens lexical probable sans l’imposer dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le registre narratif biblique sans archaïsme excessif; le plus-que-parfait clarifie l’antériorité de la révélation.
