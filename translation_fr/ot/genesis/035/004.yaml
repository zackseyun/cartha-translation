base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: fr
  text: Ils donnèrent donc à Jacob tous les dieux étrangers qu’ils avaient en leur possession, ainsi que les anneaux qu’ils avaient aux oreilles. Jacob les cacha sous le térébinthe qui était près de Sichem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: Ils donnèrent donc à Jacob
  rationale: Le wayyiqtol fait progresser le récit; « donc » exprime naturellement ici la conséquence de l’ordre donné au verset précédent, tandis que « à Jacob » rend explicitement le destinataire.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: tous les dieux étrangers
  rationale: Expression française claire et usuelle pour les divinités étrangères au culte du Dieu de Jacob, sans préciser la nature matérielle des objets au-delà du texte.
- source_word: אֲשֶׁר בְּיָדָם
  choice: qu’ils avaient en leur possession
  rationale: Littéralement « qui étaient dans leur main »; l’expression idiomatique française transmet ici le sens de possession sans suggérer nécessairement qu’ils les tenaient physiquement à cet instant.
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: les anneaux qu’ils portaient aux oreilles
  rationale: נְזָמִים désigne des anneaux pouvant être portés au nez ou aux oreilles; la proposition locative précise ici qu’ils étaient aux oreilles. « Portaient » donne en français le sens naturel sans transformer la phrase en indication explicite de provenance.
- source_word: וַיִּטְמֹן אֹתָם
  choice: Jacob les cacha
  rationale: טמן signifie cacher ou dissimuler et peut, selon le contexte, impliquer l’enfouissement. « Cacha » conserve cette amplitude sans imposer « enterra ».
- source_word: תַּחַת הָאֵלָה
  choice: sous le térébinthe
  rationale: אֵלָה désigne vraisemblablement le térébinthe; ce choix est botaniquement plus précis que la traduction traditionnelle « chêne ».
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: qui était près de Sichem
  rationale: Avec un nom de lieu, עִם exprime ici la proximité. « Près de Sichem » est naturel et fidèle en français.
theological_decisions:
- issue: Rapport entre les anneaux et le culte étranger
  choice: Mentionner séparément les dieux étrangers et les anneaux, sans expliquer la fonction religieuse de ces derniers.
  alternative: Présenter les anneaux comme des amulettes ou des objets intrinsèquement idolâtres.
  rationale: Le texte associe les deux catégories dans l’acte de remise, mais ne dit pas explicitement si les anneaux avaient une fonction cultuelle, amulétique ou simplement ornementale.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible, évite les archaïsmes et conserve la retenue du texte hébreu. Aucun appel de note n’est nécessaire, car les choix retenus peuvent être rendus clairement dans le corps du verset.
