base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: fr
  text: Ils partirent ensuite de Béthel. Il restait encore une certaine distance avant d’arriver à Éphrata[a] lorsque Rachel accoucha, et son accouchement fut difficile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Éphrath ».
    reason: Variante de transcription du nom hébreu, dont la forme du verset peut être rendue « Éphrata » ou ramenée au nom de lieu « Éphrath ».
lexical_decisions:
- source_word: וַיִּסְעוּ מִבֵּית אֵל
  choice: Ils partirent ensuite de Béthel
  rationale: Le verbe נסע, dans la suite narrative, exprime le départ et la poursuite du voyage. « Partirent » est naturel en français moderne, tandis que « ensuite » rend la progression narrative du wayyiqtol.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: Il restait encore une certaine distance
  rationale: L’expression rare כִּבְרַת הָאָרֶץ désigne une étendue ou distance indéterminée. Cette formulation conserve cette imprécision sans introduire d’unité de mesure absente de l’hébreu.
- source_word: לָבוֹא אֶפְרָתָה
  choice: avant d’arriver à Éphrata
  rationale: L’infinitif avec ל indique ici l’arrivée encore à venir à destination. « Avant d’arriver » s’accorde naturellement avec l’idée de distance restante. « Éphrata » est la forme française traditionnelle correspondant à la forme hébraïque du verset.
- source_word: וַתֵּלֶד רָחֵל
  choice: Rachel accoucha
  rationale: Avec un sujet féminin, ילד au qal signifie « donner naissance, accoucher ». Le passé simple convient au registre narratif français et reste immédiatement compréhensible.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: son accouchement fut difficile
  rationale: Le verbe קשה exprime ici la difficulté éprouvée dans l’enfantement. La formulation est directe, digne et n’ajoute aucun détail médical absent du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La division en deux phrases évite une coordination lourde tout en conservant l’enchaînement des actions. L’expression de la distance reste volontairement indéterminée, conformément à l’hébreu rare.
