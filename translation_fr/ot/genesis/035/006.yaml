  text: וַ/יָּבֹ֨א יַעֲקֹ֜ב ל֗וּזָ/ה אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן הִ֖וא בֵּֽית אֵ֑ל ה֖וּא וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: fr
  text: Jacob arriva à Louz, c’est-à-dire Béthel[a], au pays de Canaan, lui et tous ceux qui étaient avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu « Louz… c’est-à-dire Béthel » conserve à la fois l’ancien nom du lieu et son identification plus connue.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Le qal wayyiqtol de בוא exprime ici l’arrivée à destination. « Arriva » est naturel dans le récit français et plus précis que « vint » sans point de repère déictique.
- source_word: לוּזָה
  choice: à Louz
  rationale: Le ה directionnel indique un mouvement vers le lieu. Il est rendu par « à », tandis que le nom propre est transcrit sous sa forme française usuelle « Louz ».
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: au pays de Canaan
  rationale: La proposition relative situe Louz. En français, l’incise « au pays de Canaan » rend clairement et naturellement cette indication géographique.
- source_word: הִוא בֵּית אֵל
  choice: c’est-à-dire Béthel
  rationale: Le pronom suivi du nom de lieu identifie Louz à Béthel. « C’est-à-dire » conserve explicitement cette identification appositionnelle.
- source_word: הוּא
  choice: lui
  rationale: Le pronom reprend Jacob avec une valeur appositionnelle avant la mention de ses accompagnateurs. « Lui et… » reproduit cette structure sans lui donner une emphase excessive.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: et tous ceux qui étaient avec lui
  rationale: Dans ce contexte, עָם désigne l’ensemble des personnes accompagnant Jacob plutôt qu’un peuple au sens ethnique. Cette formulation est idiomatique et inclusive.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve l’identification des deux noms du lieu ainsi que la reprise appositionnelle finale, tout en évitant une tournure française pesante.
