base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: fr
  text: Puis Isaac rendit son dernier souffle et mourut. Il fut réuni aux siens[a], âgé et rassasié de jours. Ésaü et Jacob, ses fils, l’ensevelirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « auprès de son peuple ». Cette formule funéraire hébraïque peut aussi se comprendre comme une réunion avec ses ancêtres ou sa parenté ; elle peut évoquer davantage que la seule mise au tombeau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: rendit son dernier souffle
  rationale: Cette expression française naturelle rend le verbe גוע dans une notice de décès et le distingue du verbe explicite « mourut » qui suit.
- source_word: וַיָּמָת
  choice: mourut
  rationale: מות est le verbe courant signifiant mourir; cette traduction simple conserve la succession des deux verbes hébreux.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: fut réuni aux siens
  rationale: La formule conserve sa portée familiale et son ambiguïté concernant l’ensevelissement ou une réunion après la mort, tout en restant naturelle en français moderne.
- source_word: זָקֵן
  choice: âgé
  rationale: « Âgé » restitue directement la description du patriarche dans un registre digne et courant.
- source_word: וּשְׂבַע יָמִים
  choice: rassasié de jours
  rationale: Cette formulation préserve l’image hébraïque traditionnelle et la notion d’une vie menée à sa pleine mesure, sans la réduire à « avancé en âge ».
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: l’ensevelirent
  rationale: « Ensevelir » exprime clairement l’action de mettre en terre et convient au registre narratif solennel du verset.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: Ésaü et Jacob, ses fils
  rationale: L’ordre et l’apposition de l’hébreu sont conservés dans un français naturel.
theological_decisions:
- issue: Sens de la formule funéraire « fut réuni aux siens »
  choice: Conserver une formule littérale sans préciser la nature de cette réunion.
  alternative: Comprendre exclusivement l’expression comme une mise au tombeau familial, ou explicitement comme une réunion avec les ancêtres après la mort.
  rationale: La formule hébraïque peut évoquer les proches ou les ancêtres et semble dépasser la simple mention de la mort, mais le texte n’en définit pas le mécanisme. La traduction maintient donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La cadence de la notice funéraire et le parallélisme des verbes sont préservés; « rassasié de jours » maintient volontairement la texture de l’idiome hébreu.
