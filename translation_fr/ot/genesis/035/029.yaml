  source_fidelity: 'Le texte traduit avec fidélité la succession des trois formules de décès : « rendit son dernier souffle », « mourut », puis « fut réuni aux siens ». « Âgé et rassasié de jours » rend bien la double caractérisation hébraïque, et les deux fils sont correctement identifiés comme les agents de l’ensevelissement. Toutefois, la note qualifie à tort de littéral « à ses peuples » : עַמָּיו signifie ici « son peuple » (nom collectif avec suffixe possessif), non « ses peuples ».'
