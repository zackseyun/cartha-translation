  text: And the days of Isaac were one hundred and eighty years[a].
translation:
  language: fr
  text: La durée de la vie d’Isaac fut de cent quatre-vingts ans.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Les jours d’Isaac furent de cent quatre-vingts ans » ; « les jours » est une expression hébraïque qui désigne la durée de la vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי
  choice: La durée de la vie … fut de
  rationale: L’expression hébraïque « les jours de » désigne ici l’ensemble de la vie. Cette formulation française naturelle en restitue clairement le sens sans suggérer qu’il s’agit seulement de jours au sens littéral.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: cent quatre-vingts ans
  rationale: Le français regroupe naturellement les deux nombres et emploie le pluriel « ans », alors que l’hébreu présente littéralement « cent année et quatre-vingts année ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La tournure « durée de la vie » rend explicitement l’idiome hébreu, tandis que la note conserve sa forme littérale.
