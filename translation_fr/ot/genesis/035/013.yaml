  yaml_path: translation/ot/genesis/035/013.yaml
  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: fr
  text: Puis Dieu s’éleva d’auprès de lui, à l’endroit où il lui avait parlé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « monta d’auprès de lui ». L’hébreu conserve l’idée d’un mouvement vers le haut lorsque Dieu met fin à cette rencontre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: s’éleva
  rationale: Le qal de עלה exprime concrètement un mouvement ascendant. « S’éleva » conserve cette image sans la réduire au sens plus interprétatif de « partit ».
- source_word: מֵעָלָיו
  choice: d’auprès de lui
  rationale: La préposition exprime littéralement un départ depuis ce qui est au-dessus ou auprès de Jacob. « D’auprès de lui » reste naturel en français et marque la séparation sans suggérer que Dieu se trouvait physiquement sur lui.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu unique et commande un verbe au singulier.
- source_word: בַּמָּקוֹם
  choice: à l’endroit
  rationale: Le ב locatif peut se rendre par « dans » ou « à ». « À l’endroit » est idiomatique en français pour situer l’événement tout en conservant la référence précise au lieu.
- source_word: אֲשֶׁר
  choice: où
  rationale: Avec un antécédent locatif, le relatif français naturel est « où ».
- source_word: דִּבֶּר אִתּוֹ
  choice: il lui avait parlé
  rationale: Le plus-que-parfait indique naturellement que la parole précède l’élévation de Dieu. En français courant, « parler à quelqu’un » se construit avec le pronom indirect « lui »; le contexte garde néanmoins la dimension de rencontre.
theological_decisions:
- issue: Description spatiale du départ de Dieu
  choice: Conserver le mouvement ascendant par « s’éleva d’auprès de lui ».
  alternative: Puis Dieu quitta Jacob / se retira d’auprès de lui.
  rationale: L’hébreu emploie le verbe ordinaire de la montée. La traduction maintient l’imagerie théophanique sans expliquer ni atténuer la manière dont la présence divine est décrite.
translation_notes:
  register: Français international moderne, sobre et narratif. « S’éleva » est digne et naturel tout en préservant l’image verticale; « d’auprès de lui » évite une formulation excessivement matérielle. Le référent de « lui » demeure Jacob selon le contexte immédiat.
