id: GEN.35.5
reference: Genesis 35:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: fr
  text: Ils partirent, et une terreur venant de Dieu[a] s’abattit sur les villes qui les entouraient, si bien qu’elles ne poursuivirent pas les fils de Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « la terreur de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: Ils partirent
  rationale: Dans ce contexte de déplacement, נסע signifie se mettre en route ou partir. « Ils partirent » est naturel en français moderne et fait progresser le récit.
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל
  choice: une terreur venant de Dieu s’abattit sur
  rationale: La tournure française « s’abattit sur » rend naturellement la valeur événementielle de היה avec עַל. « Venant de Dieu » exprime la lecture probable du complément construit sans effacer l’autre possibilité.
- source_word: הֶעָרִים אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: les villes qui les entouraient
  rationale: Cette formulation claire et concise désigne les villes situées tout autour du groupe de Jacob.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: si bien qu’elles ne poursuivirent pas
  rationale: Le lien de conséquence avec la terreur précédente est rendu explicitement. Le pronom féminin reprend « les villes », comme le fait par métonymie le texte hébreu.
- source_word: בְּנֵי יַעֲקֹב
  choice: les fils de Jacob
  rationale: Le syntagme hébreu désigne explicitement les descendants masculins de Jacob; « les fils de Jacob » en conserve le sens et la forme familiale.
theological_decisions:
- issue: Sens du construit חִתַּת אֱלֹהִים
  choice: une terreur venant de Dieu
  alternative: la terreur de Dieu; une immense terreur
  rationale: Le contexte favorise une terreur dont Dieu est la source, assurant ainsi la protection du groupe de Jacob. La formulation plus formelle « la terreur de Dieu » reste possible et est signalée en note; la lecture intensive « une immense terreur » est moins précise quant à l’action divine.
- issue: Référence de בְּנֵי יַעֲקֹב
  choice: les fils de Jacob
  alternative: les enfants de Jacob
  rationale: Le masculin pluriel vise ici les fils de Jacob dans le récit; il n’est donc pas neutralisé.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La phrase conserve la métonymie des « villes » qui ne poursuivent pas les voyageurs.
