  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: fr
  text: 'Et les fils de Bilha[a], la servante de Rachel : Dan et Nephtali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esclave de Rachel ». Le terme hébreu désigne une servante de statut social inférieur et peut, selon le contexte, désigner une esclave.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Et les fils de
  rationale: Le pluriel construit בְנֵי introduit un nouveau groupe dans la liste généalogique. « Et » rend le waw préfixé et conserve l’enchaînement de la liste.
- source_word: בִלְהָה
  choice: Bilha
  rationale: Nom propre rendu selon sa forme française biblique courante.
- source_word: שִׁפְחַת
  choice: la servante de
  rationale: שִׁפְחָה désigne une femme en situation de service et de statut social inférieur, parfois une esclave. « Servante » est naturel en français moderne tout en laissant une note préciser l’éventail social du terme.
- source_word: רָחֵל
  choice: Rachel
  rationale: Nom propre rendu selon sa forme française courante; la relation construite avec שִׁפְחַת est exprimée naturellement par « de Rachel ».
- source_word: דָּן
  choice: Dan
  rationale: Transcription française traditionnelle du nom propre.
- source_word: וְ/נַפְתָּלִי
  choice: et Nephtali
  rationale: Le nom propre est rendu selon sa forme française biblique courante, précédé de « et » pour conserver la coordination hébraïque.
