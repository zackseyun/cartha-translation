  text: וַ/יֵּרָ֨א אֱלֹהִ֤ים אֶֽל יַעֲקֹב֙ ע֔וֹד בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יְבָ֖רֶךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: fr
  text: Dieu apparut de nouveau à Jacob[a] lorsqu’il revint de Paddân-Aram, et il le bénit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu se manifesta de nouveau à Jacob. » Le verbe hébreu peut désigner le fait d’apparaître ou de se rendre visible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le nifal de ראה exprime ici une manifestation perceptible de Dieu. « Apparut » est naturel en français et ne précise pas indûment la manière de cette manifestation.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: L’accord verbal au singulier et le contexte narratif désignent le Dieu unique.
- source_word: עוֹד
  choice: de nouveau
  rationale: Dans ce contexte, l’adverbe marque la répétition d’une manifestation divine antérieure.
- source_word: בְּבֹאוֹ
  choice: lorsqu’il revint
  rationale: La préposition ב avec l’infinitif construit et son suffixe a une valeur temporelle. « Revint » rend naturellement le déplacement depuis Paddân-Aram dans ce contexte, sans altérer le sens fondamental de « venir ».
- source_word: מִפַּדַּן אֲרָם
  choice: de Paddân-Aram
  rationale: Il s’agit d’un nom de lieu, translittéré en français; la préposition מִן indique la provenance.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: et il le bénit
  rationale: Le piel de ברך signifie « bénir ». Les deux pronoms sont conservés afin de rendre explicites le sujet et l’objet.
theological_decisions:
- issue: Nature de l’apparition divine
  choice: 'Présenter directement l’événement comme une apparition de Dieu : « Dieu apparut de nouveau à Jacob »'
  alternative: « Dieu se manifesta de nouveau à Jacob » ou « Dieu se fit de nouveau voir à Jacob »
  rationale: Le verset rapporte une manifestation réelle de Dieu sans en préciser le mécanisme. « Apparut » maintient cette indétermination sans réduire l’événement à une vision intérieure ni en définir la forme.
translation_notes:
  register: Français international moderne, sobre et digne. « Lorsqu’il revint » est idiomatique dans le récit; « Paddân-Aram » suit une translittération française accentuée. Le pronom « il » dans la dernière proposition reprend Dieu, comme en hébreu.
