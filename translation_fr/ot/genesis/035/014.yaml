  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: fr
  text: Jacob dressa une stèle à l’endroit où Dieu avait parlé avec lui, une stèle de pierre. Il y versa une libation[a] et y répandit de l’huile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une offrande liquide ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: dressa
  rationale: Le hiphil de נצב exprime ici le fait de mettre debout. « Dressa » est naturel en français et convient à l’érection d’une stèle.
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: une stèle / une stèle de pierre
  rationale: מַצֵּבָה désigne une pierre dressée servant de monument. « Stèle » rend précisément l’objet, et l’apposition « une stèle de pierre » conserve l’indication explicite du matériau.
- source_word: בַּמָּקוֹם
  choice: à l’endroit
  rationale: Cette formulation locative est idiomatique en français moderne et introduit naturellement la proposition relative.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: où Dieu avait parlé avec lui
  rationale: Le contexte immédiat identifie Dieu comme sujet de דִּבֶּר. Le plus-que-parfait marque l’antériorité de cette parole par rapport à l’érection de la stèle, tandis que « avec lui » préserve la réciprocité possible de אִתּוֹ.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: y versa une offrande de vin
  rationale: Le verbe et son complément décrivent une libation rituelle. « Offrande de vin » est immédiatement compréhensible; dans ce contexte cultuel, נֶסֶךְ désigne normalement une offrande liquide, typiquement du vin.
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: répandit de l’huile dessus
  rationale: « Répandit » distingue ce second verbe du premier tout en exprimant concrètement l’application d’huile. Le texte dit simplement « huile », sans permettre d’ajouter « d’olive ».
theological_decisions:
- issue: Nature du geste de Jacob envers la stèle
  choice: Décrire simplement l’érection de la stèle, l’offrande liquide et l’huile répandue.
  alternative: Présenter explicitement le geste comme une consécration ou comme l’établissement d’un mémorial.
  rationale: Le verset rapporte les gestes rituels sans en formuler lui-même la signification théologique; la traduction n’ajoute donc aucune interprétation.
- issue: Sujet implicite de « avait parlé »
  choice: Expliciter « Dieu » d’après le contexte immédiat.
  alternative: Conserver le pronom ambigu « il », comme dans la formulation hébraïque prise isolément.
  rationale: Au verset précédent, le sujet explicite est Dieu, et celui-ci demeure naturellement le sujet de la relative. L’explicitation évite en français une ambiguïté artificielle qui ferait de Jacob celui qui se serait parlé à lui-même.
translation_notes:
  register: Français international moderne, narratif et digne. « Stèle » est précis sans être excessivement technique; la note donne le terme cultuel traditionnel « libation ». La répétition « une stèle… une stèle de pierre » conserve l’apposition emphatique de l’hébreu.
