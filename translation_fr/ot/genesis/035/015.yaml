source:
  edition: WLC
  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: fr
  text: Jacob donna au lieu où Dieu lui avait parlé le nom de Béthel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Béthel signifie « maison de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: donna ... le nom de
  rationale: Dans ce contexte, קרא avec שֵׁם exprime l’acte de nommer. « Donner le nom de » conserve explicitement la notion de nom tout en étant idiomatique en français.
- source_word: הַמָּקוֹם
  choice: le lieu
  rationale: Traduction directe et naturelle du nom défini הַמָּקוֹם.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: où Dieu lui avait parlé
  rationale: Le relatif « où » rend naturellement la construction אֲשֶׁר ... שָׁם et englobe la valeur locative de שָׁם sans la redondance peu naturelle « où... là ». Le plus-que-parfait situe la parole divine avant l’attribution du nom. « Lui avait parlé » est le tour français courant pour דִּבֶּר אִתּוֹ.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte et la syntaxe désignent ici le Dieu unique au singulier.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Le toponyme est translittéré selon sa forme française traditionnelle; sa signification est donnée en note.
theological_decisions:
- issue: Valeur grammaticale et référentielle de אֱלֹהִים
  choice: Dieu
  alternative: des dieux
  rationale: Dans ce récit, אֱלֹהִים est le sujet singulier qui a parlé à Jacob; une traduction au pluriel fausserait le sens contextuel.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe place « le nom de Béthel » en fin de phrase, conformément au mouvement du texte hébreu, tout en évitant un calque lourd de l’expression « appeler le nom du lieu ».
