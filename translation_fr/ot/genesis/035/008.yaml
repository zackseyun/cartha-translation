base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: fr
  text: Débora, la nourrice de Rébecca, mourut et fut enterrée en contrebas de Béthel, sous le chêne[a]. On donna à ce chêne le nom d’Allôn-Bakouth[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu אַלּוֹן peut désigner un chêne ou un térébinthe; l’espèce exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Allôn-Bakouth signifie probablement « Chêne des pleurs »; si אַלּוֹן désigne ici un térébinthe, « Térébinthe des pleurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: nourrice
  rationale: Le nom désigne une femme qui allaite et prend soin d’un enfant. « Nourrice » est naturel en français et convient au rôle durable que Débora semble avoir exercé auprès de Rébecca, sans imposer ici la formulation plus explicite « nourrice au sein ».
- source_word: מִתַּחַת לְבֵית אֵל
  choice: en contrebas de Béthel
  rationale: La construction situe la sépulture plus bas que Béthel. « En contrebas de » conserve cette relation topographique sans la transformer en indication cardinale.
- source_word: תַּחַת הָאַלּוֹן
  choice: sous le chêne
  rationale: תַּחַת signifie « sous ». אַלּוֹן désigne un grand arbre, traditionnellement compris comme un chêne, mais l’identification au térébinthe reste possible et est signalée en note.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: On l’appela donc
  rationale: Le verbe hébreu est actif à la troisième personne masculine du singulier, mais son sujet n’est pas exprimé. Le pronom indéfini « on » évite d’identifier arbitrairement celui qui nomme; « l’ » peut naturellement renvoyer au lieu ou à l’arbre nommé.
- source_word: אַלּוֹן בָּכוּת
  choice: Allôn-Bakouth
  rationale: Le nom propre est translittéré dans le texte. Son sens transparent, « Chêne des pleurs », est donné en note, avec l’alternative botanique possible.
- source_word: וַתִּקָּבֵר
  choice: fut enterrée
  rationale: Le nifal est rendu au passif sans introduire les personnes qui procédèrent à l’enterrement.
- source_word: וַתָּמָת
  choice: mourut
  rationale: Rend directement le verbe hébreu, sans euphémisme.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au registre biblique digne tout en restant largement compréhensible. La formulation impersonnelle « On l’appela » préserve l’absence de sujet explicite dans l’hébreu.
