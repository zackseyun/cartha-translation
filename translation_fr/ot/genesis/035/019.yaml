source:
  edition: WLC
  text: וַ/תָּ֖מָת רָחֵ֑ל וַ/תִּקָּבֵר֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔תָה הִ֖וא בֵּ֥ית לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/019.yaml
  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
translation:
  language: fr
  text: Rachel mourut et fut enterrée sur le chemin d’Éphrata[a] (c’est-à-dire Bethléem).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éphrata peut aussi être rendu par « Éphrath ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: mourut
  rationale: Le verbe מות désigne directement la mort physique. « Mourut » est simple, précis et sans euphémisme.
- source_word: רָחֵל
  choice: Rachel
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַתִּקָּבֵר
  choice: fut enterrée
  rationale: Le nifal de קבר appelle ici une tournure passive. Aucun adverbe correspondant à « là » n’est explicite dans l’hébreu.
- source_word: בְּדֶרֶךְ
  choice: sur le chemin
  rationale: Avec la préposition ב, le terme indique l’emplacement le long de l’itinéraire. « Sur le chemin » est naturel en français moderne et convient au contexte du voyage.
- source_word: אֶפְרָתָה
  choice: Éphrata
  rationale: « Éphrata » reproduit naturellement en français la forme hébraïque du nom de lieu; la variante traditionnelle « Éphrath » est signalée en note.
- source_word: הִוא
  choice: c’est-à-dire
  rationale: Le pronom a une fonction explicative et identifie Éphrata à Bethléem. La locution « c’est-à-dire » rend clairement cette apposition.
- source_word: בֵּית לָחֶם
  choice: Bethléem
  rationale: Forme française traditionnelle et usuelle du nom de lieu.
theological_decisions: []
