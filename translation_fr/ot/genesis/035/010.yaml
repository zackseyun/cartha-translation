  source_fidelity: 'La traduction rend fidèlement la déclaration de renommage : « ton nom est Jacob », l’interdiction prospective de l’appeler encore Jacob, et l’attribution d’Israël comme nouveau nom. « On ne t’appellera plus » restitue naturellement en français le passif hébreu עם עוֹד (« encore / désormais »), sans atténuer ni harmoniser la tension avec les emplois ultérieurs de « Jacob ». La dernière proposition, « Et il lui donna le nom d’Israël », exprime idiomatiquement l’acte de nomination contenu dans la formule hébraïque littérale « il appela son nom Israël ».'
  naturalness: Le français est moderne, international, clair et d’un registre biblique sobre sans archaïsme. La répétition de « nom » est justement conservée dans la parole divine. « Israël sera ton nom » est naturel et garde la mise en relief du nouveau nom.
  terminology: « Dieu », « Jacob » et « Israël » sont les formes françaises standard. Le traitement de la formule de nomination ne comporte aucune surcharge doctrinale ou interprétative.
