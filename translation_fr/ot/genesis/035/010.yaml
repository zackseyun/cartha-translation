source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ אֱלֹהִ֖ים שִׁמְ/ךָ֣ יַעֲקֹ֑ב לֹֽא יִקָּרֵא֩ שִׁמְ/ךָ֨ ע֜וֹד יַעֲקֹ֗ב כִּ֤י אִם יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔/ךָ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: fr
  text: 'Dieu lui dit : « Ton nom est Jacob. On ne t’appellera plus Jacob, mais Israël sera ton nom. » Et il lui donna le nom d’Israël.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il appela son nom Israël » ; on peut aussi traduire : « il l’appela Israël ».'
    reason: L’expression hébraïque de nomination est plus littérale que la formulation naturelle retenue dans le texte.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu unique et s’accorde avec un verbe au singulier.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Rend directement le nom hébreu muni du suffixe masculin singulier et conserve la répétition significative du texte.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: on ne t’appellera plus
  rationale: Cette tournure française naturelle exprime le passif hébreu de dénomination ainsi que la cessation marquée par la négation avec עוֹד.
- source_word: כִּי אִם
  choice: mais
  rationale: 'La construction oppose ici l’ancien nom au nouveau : non pas Jacob, mais Israël.'
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israël sera ton nom
  rationale: Conserve l’accent placé sur le nouveau nom tout en restant idiomatique en français.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: Et il lui donna le nom d’Israël
  rationale: Formulation française naturelle de l’acte de nomination ; la note conserve la forme plus littérale de l’expression hébraïque.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française traditionnelle et standard du nom propre.
theological_decisions:
- issue: Portée de la déclaration selon laquelle Jacob ne sera plus appelé Jacob
  choice: On ne t’appellera plus Jacob, mais Israël sera ton nom.
  alternative: Ton nom ne sera désormais plus Jacob, mais Israël.
  rationale: La traduction maintient toute la force de la déclaration divine sans prétendre résoudre le fait que le récit ultérieur continue aussi d’employer le nom Jacob.
translation_notes:
  register: Français international moderne, clair et digne. Le futur remplace toute tournure archaïsante ; « on ne t’appellera plus » rend naturellement le passif hébreu. La coordination finale par « Et » suit sobrement la progression du texte source.
