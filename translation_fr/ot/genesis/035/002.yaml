  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: fr
  text: 'Alors Jacob dit aux gens de sa maison et à tous ceux qui étaient avec lui : « Enlevez les dieux étrangers[a] qui se trouvent parmi vous, purifiez-vous[b] et changez de vêtements. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dieux de l’étranger » ; l’expression désigne des divinités étrangères.
    reason: lexical_alternative
  - marker: b
    text: « Purifiez-vous » peut désigner une purification rituelle en préparation pour s’approcher de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: aux gens de sa maison
  rationale: Le mot « maison » désigne ici le groupe familial et domestique de Jacob, et non un bâtiment. Cette formulation exprime ce sens collectif sans le limiter à la seule famille proche.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: à tous ceux qui étaient avec lui
  rationale: La phrase désigne l’ensemble des personnes qui accompagnaient Jacob et suit naturellement le premier groupe mentionné.
- source_word: הָסִרוּ
  choice: Enlevez
  rationale: L’impératif demande le retrait concret des objets de culte étrangers. « Enlevez » conserve la force directe du commandement sans préciser un mode de destruction absent du texte.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: les dieux étrangers
  rationale: L’expression désigne des divinités étrangères ou associées à des étrangers. Cette traduction est claire en français moderne et préserve la portée polémique du texte.
- source_word: בְּתֹכְכֶם
  choice: qui se trouvent parmi vous
  rationale: La formule garde l’idée de présence au sein du groupe sans décider si ces dieux sont portés, possédés ou installés dans le camp.
- source_word: וְהִטַּהֲרוּ
  choice: purifiez-vous
  rationale: La forme verbale est réfléchie et peut évoquer une purification rituelle en vue de s’approcher de Dieu. « Purifiez-vous » conserve cette nuance sans détailler un rite non précisé.
- source_word: וְהַחֲלִיפוּ
  choice: changez
  rationale: Avec les vêtements comme complément, « changez » rend directement et naturellement l’idée de remplacer ce que l’on porte.
- source_word: שִׂמְלֹתֵיכֶם
  choice: de vêtements
  rationale: Le terme hébreu désigne les habits, notamment les vêtements portés à l’extérieur. « Vêtements » convient à un registre courant et digne.
theological_decisions:
- issue: Nature de l’ordre de purification
  choice: Conserver une formulation pouvant désigner une purification rituelle ou cultuelle
  alternative: Traduire plus généralement par « nettoyez-vous » ou « lavez-vous »
  rationale: Le retrait des idoles et la préparation à la rencontre avec Dieu donnent probablement au commandement une dimension rituelle. Le texte ne précise toutefois ni geste ni cérémonie ; « purifiez-vous » maintient donc cette portée sans ajouter de prescription.
translation_notes:
  register: Français international moderne, direct et digne. « Les gens de sa maison » est plus transparent que « sa maisonnée » et inclut le groupe domestique au-delà de la famille proche. Les impératifs restent brefs pour préserver la force de l’hébreu.
