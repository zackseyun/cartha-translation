base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: fr
  text: Le pays que j’ai donné à Abraham et à Isaac, je te le donnerai ; et je donnerai le pays à ta descendance après toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Descendance » traduit un singulier collectif, qui peut aussi être rendu par « semence » ou « descendants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Dans le contexte de la promesse patriarcale, אֶרֶץ désigne le territoire promis. « Le pays » est naturel en français et plus précis ici que « la terre », qui pourrait évoquer le sol ou la planète.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif français « que » introduit naturellement la proposition déterminant « le pays ».
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Le qatal renvoie à un don antérieur fait à Abraham et à Isaac. Le passé composé est le temps narratif courant en français moderne et laisse subsister le contraste avec les futurs qui suivent.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: à Abraham et à Isaac
  rationale: La répétition de la préposition hébraïque est conservée sans lourdeur et marque chacun des deux bénéficiaires.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: je te le donnerai
  rationale: Le suffixe féminin singulier renvoie à אֶרֶץ. Le pronom « le » reprend grammaticalement « le pays » dans la traduction française et rend explicitement ce lien.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: זֶרַע est un singulier collectif. « Descendance » en conserve la valeur collective et appartient au français moderne naturel, contrairement au calque « semence ».
- source_word: אַחֲרֶיךָ
  choice: après toi
  rationale: Cette formulation garde simplement la relation temporelle et générationnelle de l’hébreu.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: je donnerai ce pays
  rationale: La répétition du verbe et du nom est maintenue. « Ce pays » reprend naturellement le territoire déjà déterminé dans la première proposition, sans modifier la référence.
theological_decisions:
- issue: Rapport entre le don passé et le don futur dans la promesse du pays
  choice: Traduire נָתַתִּי au passé (« j’ai donné »), puis les deux autres verbes au futur (« je te le donnerai », « je donnerai »).
  alternative: Employer « j’avais donné » ou comprendre le premier verbe comme un parfait à portée actuelle.
  rationale: L’hébreu juxtapose le don déjà accordé à Abraham et Isaac et sa future attribution à Jacob puis à sa descendance. La traduction conserve cette tension temporelle et théologique sans l’harmoniser.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la reprise emphatique du pays et du verbe « donner ». « Descendance » maintient le collectif singulier de זֶרַע sans imposer une lecture strictement individuelle ou plurielle.
