  to: 'Dieu lui dit : « Je suis le Dieu tout-puissant[a]. Sois fécond et multiplie-toi. Une nation et une assemblée de nations[b] seront issues de toi, et des rois sortiront de tes reins[c]. »'
  rationale: La révision rétablit dans le texte principal l’image des « reins » et le verbe « sortir », qui correspondent directement à l’expression hébraïque désignant la descendance physique. Elle corrige également l’incohérence de personne dans la note, sans modifier le sens de la promesse ni imposer une interprétation doctrinale.
