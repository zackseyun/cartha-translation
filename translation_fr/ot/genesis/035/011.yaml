  source_fidelity: 'Le sens global est fidèlement rendu : Dieu s’adresse à Jacob, l’impératif double est conservé, et la promesse porte sur une nation, une assemblée de nations et des rois issus de sa lignée. Toutefois, « naîtront de ton propre corps » remplace trop librement l’image précise de מֵחֲלָצֶיךָ (« de tes reins »).'
  naturalness: Le français est dans l’ensemble moderne, clair et solennel. « Des rois sortiront de tes reins » est une tournure biblique élevée mais intelligible, plus idiomatique dans ce registre que « naîtront de ton propre corps », tout en préservant l’image généalogique du texte.
  terminology: « Le Dieu tout-puissant » rend de façon traditionnelle אֵל שַׁדַּי; la note signale à juste titre la forme hébraïque et l’incertitude de son sens exact. « Assemblée de nations » respecte la valeur collective de קְהַל sans réduire l’expression à une simple multitude.
