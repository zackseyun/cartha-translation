source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: fr
  text: 'Dieu lui dit : « Je suis le Dieu tout-puissant[a]. Sois fécond et multiplie-toi. Une nation et une assemblée de nations[b] seront issues de toi, et des rois sortiront de tes reins[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « El Shaddaï ». « Dieu tout-puissant » est la traduction traditionnelle ; le sens exact de Shaddaï est incertain.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « une communauté de nations » ou « un rassemblement de nations ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « de tes reins », image désignant des descendants issus de ton propre corps.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le verbe au singulier et le contexte indiquent que la forme désigne ici le Dieu d’Israël, non plusieurs dieux.
- source_word: אֵל שַׁדַּי
  choice: le Dieu tout-puissant
  rationale: Cette traduction traditionnelle rend le titre divin en français clair et solennel; la forme hébraïque est signalée en note puisque le sens exact de שַׁדַּי demeure discuté.
- source_word: פְּרֵה וּרְבֵה
  choice: Sois fécond et multiplie-toi
  rationale: Cette formulation établie conserve les deux impératifs au masculin singulier et leur écho à la bénédiction de la création.
- source_word: גּוֹי
  choice: une nation
  rationale: Dans cette promesse patriarcale, le terme désigne un groupe humain constitué en nation.
- source_word: קְהַל גּוֹיִם
  choice: une assemblée de nations
  rationale: « Assemblée » rend le sens collectif de קָהָל sans transformer l’expression en simple idée de grand nombre.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: seront issues de toi
  rationale: Le français exprime ainsi naturellement l’origine généalogique indiquée littéralement par « sera de toi ».
- source_word: מְלָכִים
  choice: des rois
  rationale: Le terme signifie directement « rois » et n’exige aucune explicitation.
- source_word: מֵחֲלָצֶיךָ
  choice: de ton propre corps
  rationale: Cette expression française actuelle communique la descendance physique évoquée par l’image hébraïque des reins; l’image littérale est conservée en note.
- source_word: יֵצֵאוּ
  choice: naîtront
  rationale: Dans ce contexte généalogique, « naîtront » exprime naturellement la venue de descendants issus du corps de Jacob.
theological_decisions:
- issue: Sens et traduction du titre אֵל שַׁדַּי
  choice: le Dieu tout-puissant
  alternative: El Shaddaï
  rationale: Le titre est traduit selon son rendu traditionnel, tout en signalant la forme hébraïque et l’incertitude lexicale afin de ne pas présenter l’étymologie comme assurée.
- issue: Caractère physique de la descendance promise
  choice: des rois naîtront de ton propre corps
  alternative: des rois sortiront de tes reins
  rationale: Le texte principal garde clairement la dimension corporelle et généalogique de la promesse dans un français naturel; la note préserve l’image concrète de l’hébreu.
- issue: Rapport entre la nation et l’assemblée de nations
  choice: Une nation et une assemblée de nations seront issues de toi
  alternative: Une nation, une communauté de nations, sera issue de toi
  rationale: La coordination est maintenue sans identifier ni fusionner les deux expressions; le pluriel français permet une lecture naturelle, tandis que l’hébreu emploie un verbe au singulier.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le rythme solennel de la promesse patriarcale, tout en remplaçant dans le texte principal l’expression aujourd’hui peu naturelle « sortir de tes reins » par une formulation corporelle claire. Tous les marqueurs de note sont placés immédiatement après l’expression concernée.
