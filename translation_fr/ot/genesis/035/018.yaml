  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: fr
  text: Au moment où la vie la quittait — car elle était en train de mourir —, elle l’appela Ben-Oni[a] ; mais son père l’appela Benjamin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ben-Oni signifie probablement « fils de ma douleur » ou « fils de mon affliction ».
    reason: lexical_alternative
  - marker: b
    text: Benjamin signifie probablement « fils de la main droite » ; certains comprennent « fils du sud ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: Au moment où la vie la quittait
  rationale: Dans ce contexte de mort, נֶפֶשׁ désigne naturellement la vie ou le souffle vital. « La vie la quittait » rend l’expression temporelle sans imposer une conception technique de l’âme.
- source_word: כִּי מֵתָה
  choice: car elle était en train de mourir
  rationale: La proposition explique l’expression précédente et présente la mort comme contemporaine de l’attribution du nom.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: elle l’appela
  rationale: Cette formulation française exprime naturellement l’acte de donner un nom tout en maintenant le parallèle avec le père.
- source_word: בֶּן אוֹנִי
  choice: Ben-Oni
  rationale: Le nom propre est translittéré dans le texte ; sa signification probable, importante pour le récit, est indiquée en note.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: mais son père l’appela
  rationale: Le waw est rendu par « mais » afin d’exprimer le contraste contextuel entre le nom donné par la mère et celui retenu par le père.
- source_word: בִנְיָמִין
  choice: Benjamin
  rationale: La forme française traditionnelle du nom propre est conservée ; ses principales interprétations étymologiques sont signalées en note.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ dans un contexte de mort
  choice: « la vie » dans le texte principal
  alternative: « l’âme »
  rationale: Le mot hébreu peut désigner la vie ou l’être vivant sans formuler nécessairement une affirmation technique sur une âme immatérielle quittant le corps. « La vie » préserve ce champ de sens et évite de trancher la question théologique.
translation_notes:
  register: Français international moderne, naturel et digne. L’incise conserve la force explicative de l’hébreu ; les noms sont donnés sous leurs formes usuelles et leur portée étymologique est réservée aux notes.
