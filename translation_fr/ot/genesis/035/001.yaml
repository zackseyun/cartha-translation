  naturalness: Le français est moderne, clair et d’un registre convenable. La formulation « lorsque tu fuyais Ésaü, ton frère » est idiomatique et plus exacte que « lorsque tu fuyais loin d’Ésaü, ton frère ».
  terminology: « Dieu », « Béthel », « autel » et « t’est apparu » sont appropriés. « au Dieu qui t’est apparu » conserve correctement la valeur déterminative de l’article et du participe hébreux.
