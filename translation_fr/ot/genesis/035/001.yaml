source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: fr
  text: 'Alors Dieu dit à Jacob : « Lève-toi, monte à Béthel et installe-toi là. Là, fais un autel au Dieu qui t’est apparu lorsque tu fuyais Ésaü, ton frère. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit; « Alors » exprime naturellement cette succession en français.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom régit ici un verbe au singulier et désigne Dieu.
- source_word: קוּם
  choice: Lève-toi
  rationale: Impératif courant et digne, plus naturel en français moderne que « Debout » ou « Élève-toi ».
- source_word: עֲלֵה
  choice: monte
  rationale: Conserve la valeur directionnelle et probablement géographique du verbe.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Translittération française traditionnelle du nom de lieu, plutôt que traduction de son sens littéral.
- source_word: וְשֶׁב שָׁם
  choice: et installe-toi là
  rationale: ישב peut exprimer le fait de demeurer ou de s’établir; cette formulation est naturelle et rend ici l’idée de résidence.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: Là, fais un autel
  rationale: « Faire » reste proche du verbe général עשה; la reprise de « là » conserve l’insistance spatiale de l’hébreu.
- source_word: לָאֵל
  choice: au Dieu
  rationale: La préposition marque le destinataire ou la dédicace de l’autel, et l’article est justifié par la proposition relative qui identifie Dieu.
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: qui t’est apparu
  rationale: Rend directement le niphal de ראה dans un contexte d’apparition divine.
- source_word: בְּבָרְחֲךָ
  choice: lorsque tu fuyais
  rationale: L’infinitif construit précédé de ב exprime la circonstance temporelle; l’imparfait français présente naturellement l’action en cours.
- source_word: מִפְּנֵי
  choice: loin de
  rationale: L’expression signifie littéralement « de devant la face de », mais indique idiomatiquement ici la fuite pour échapper à quelqu’un.
- source_word: עֵשָׂו אָחִיךָ
  choice: Ésaü, ton frère
  rationale: Suit l’ordre hébreu tout en employant une apposition naturelle en français.
theological_decisions:
- issue: Référence de אֱלֹהִים
  choice: Le Dieu unique parle à Jacob
  alternative: des dieux
  rationale: L’accord verbal au singulier et le contexte narratif identifient clairement Dieu.
- issue: Traitement de בֵּית אֵל
  choice: Béthel
  alternative: Maison de Dieu
  rationale: Le terme fonctionne ici comme nom propre de lieu; sa signification étymologique n’a pas à remplacer le toponyme dans le texte.
- issue: Identification exprimée par לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: « au Dieu qui t’est apparu »
  alternative: « à Dieu, qui t’est apparu »
  rationale: La construction hébraïque comporte l’article devant אֵל et une proposition participiale déterminative; la traduction conserve cette identification sans suggérer plusieurs dieux.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs sont directs sans archaïsme. La coordination hébraïque est légèrement restructurée en deux phrases à l’intérieur du discours pour assurer une lecture naturelle, tout en conservant les deux occurrences de « là ».
