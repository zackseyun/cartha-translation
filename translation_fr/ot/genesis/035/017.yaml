base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: fr
  text: 'Alors qu’elle avait du mal à accoucher, la sage-femme lui dit : « N’aie pas peur, car tu as encore un fils[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « celui-ci aussi est pour toi un fils ».
    reason: La traduction principale privilégie un français naturel ; la formulation littérale conserve le démonstratif זֶה et la construction לָךְ בֵּן.
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: Comme son accouchement était difficile
  rationale: La construction situe la parole de la sage-femme au moment où Rachel éprouve de grandes difficultés à accoucher. Cette formulation rend naturellement en français la circonstance temporelle et la dureté de l’accouchement.
- source_word: הַמְיַלֶּדֶת
  choice: la sage-femme
  rationale: Le participe féminin désigne la femme qui assiste l’accouchement ; « sage-femme » est l’équivalent français courant et précis.
- source_word: אַל תִּירְאִי
  choice: N’aie pas peur
  rationale: Cette défense directe au féminin singulier est rendue dans un français moderne et naturel, sans atténuer la parole rassurante.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’encouragement donné à Rachel.
- source_word: גַּם זֶה לָךְ בֵּן
  choice: tu as encore un fils
  rationale: La formulation idiomatique exprime que cet enfant s’ajoute au fils que Rachel avait déjà. « Encore » rend la valeur additive de גַּם, tandis que la note conserve la structure démonstrative plus littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le discours direct emploie le tutoiement exigé par la forme hébraïque féminine singulière ; la tournure archaïque « ne crains pas » est évitée.
