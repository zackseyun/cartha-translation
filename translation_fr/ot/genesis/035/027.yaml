base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: fr
  text: Jacob arriva auprès d’Isaac, son père, à Mamré, à Qiryath-Arba — c’est-à-dire Hébron —, où Abraham et Isaac avaient séjourné[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avaient résidé comme étrangers ». Le verbe hébreu peut évoquer le séjour d’un résident temporaire ou étranger, plutôt que le simple fait d’habiter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva auprès de
  rationale: Le verbe בוא exprime ici l’arrivée de Jacob au lieu où se trouve Isaac. « Arriva auprès de » est naturel en français et rend à la fois le déplacement et la rencontre.
- source_word: אָבִיו
  choice: son père
  rationale: Le lien de parenté explicite dans l’hébreu est conservé.
- source_word: מַמְרֵא
  choice: Mamré
  rationale: Nom de lieu translittéré selon l’usage français courant.
- source_word: קִרְיַת הָאַרְבַּע
  choice: Qiryath-Arba
  rationale: Le toponyme est translittéré plutôt que traduit, tandis que la proposition suivante l’identifie à Hébron.
- source_word: הִוא חֶבְרוֹן
  choice: c’est-à-dire Hébron
  rationale: Cette formulation française naturelle rend l’identification explicative introduite par le pronom hébreu.
- source_word: אֲשֶׁר
  choice: où
  rationale: Le relatif a pour antécédent un lieu ; « où » est la tournure française idiomatique.
- source_word: גָּר
  choice: avaient séjourné
  rationale: Le verbe גור désigne le fait de résider dans un lieu sans y être pleinement établi, souvent comme étranger. Le plus-que-parfait situe ce séjour avant l’arrivée de Jacob.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abraham et Isaac
  rationale: Les noms personnels suivent leurs formes françaises usuelles.
theological_decisions: []
