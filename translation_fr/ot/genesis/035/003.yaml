  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: fr
  text: Levons-nous et montons à Béthel. Là, je dresserai un autel au Dieu qui m’a répondu[a] au jour de ma détresse et qui a été avec moi sur le chemin que j’ai parcouru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui me répond », si le participe hébreu décrit Dieu de manière générale ou continue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: Levons-nous
  rationale: Le cohortatif à la première personne du pluriel exprime une exhortation. « Levons-nous » en conserve la force volontaire dans un français naturel et digne.
- source_word: וְנַעֲלֶה
  choice: et montons
  rationale: Le verbe עלה indique une montée vers la destination; « montons » préserve cette nuance spatiale sans lourdeur.
- source_word: בֵּית אֵל
  choice: Béthel
  rationale: Il s’agit d’un nom de lieu, rendu selon sa forme française traditionnelle plutôt que traduit par « maison de Dieu ».
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: Là, je dresserai un autel
  rationale: Bien que עשה signifie littéralement « faire », « dresser un autel » est idiomatique en français et décrit naturellement son établissement sans ajouter l’idée particulière d’une construction monumentale.
- source_word: לָאֵל
  choice: au Dieu
  rationale: L’article et la proposition participiale qui suit désignent précisément Dieu par son action envers Jacob; « au Dieu qui… » conserve cette identification.
- source_word: הָעֹנֶה אֹתִי
  choice: qui m’a répondu
  rationale: Le participe hébreu peut décrire une action caractéristique ou rappeler un fait passé. Le contexte rétrospectif favorise ici le passé composé, tandis qu’une note préserve l’autre possibilité.
- source_word: בְּיוֹם צָרָתִי
  choice: au jour de ma détresse
  rationale: Cette formulation conserve l’image hébraïque du « jour » et rend צָרָה par « détresse », terme approprié à l’affliction évoquée.
- source_word: וַיְהִי עִמָּדִי
  choice: et qui a été avec moi
  rationale: Le passé composé exprime naturellement en français la présence de Dieu au cours du voyage passé, encore pertinente dans le témoignage de Jacob.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: sur le chemin que j’ai parcouru
  rationale: « Chemin » garde l’image concrète de דרך, tandis que « que j’ai parcouru » rend l’idée de הלך dans un français plus naturel que le calque « où je suis allé ».
theological_decisions:
- issue: Référence de אֵל dans les paroles de Jacob
  choice: au Dieu
  alternative: à Dieu
  rationale: L’hébreu emploie אֵל avec l’article et le définit par l’action qui suit. « Au Dieu qui… » maintient la précision confessionnelle de la phrase sans lui imposer une formulation doctrinale extérieure.
- issue: Valeur temporelle du participe הָעֹנֶה
  choice: qui m’a répondu
  alternative: qui me répond
  rationale: Le contexte rappelle une intervention précise de Dieu dans la détresse passée de Jacob, mais le participe peut aussi exprimer une conduite caractéristique ou continue. La traduction principale suit le contexte narratif et la note conserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. « Dresser un autel » et « parcourir un chemin » assurent une expression naturelle tout en gardant les images concrètes de l’hébreu. Le marqueur [a] est placé immédiatement après la proposition concernée.
