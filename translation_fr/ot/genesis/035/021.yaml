  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: fr
  text: Puis Israël poursuivit son voyage et dressa sa tente au-delà de Migdal-Éder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-Éder signifie « tour du troupeau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: poursuivit son voyage
  rationale: Dans cette séquence narrative, נסע indique qu’Israël lève le camp et continue sa route. Cette formulation rend naturellement en français le déplacement et sa continuité.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie ici le nom Israël; il est conservé sans harmonisation avec Jacob.
- source_word: וַיֵּט
  choice: dressa
  rationale: Avec « tente » pour complément, נטה signifie idiomatiquement installer ou dresser une tente.
- source_word: אָהֳלֹה
  choice: sa tente
  rationale: Le nom אֹהֶל signifie « tente » et porte un suffixe possessif masculin singulier.
- source_word: מֵהָלְאָה
  choice: au-delà de
  rationale: L’adverbe indique une position plus loin qu’un point de repère; « au-delà de » exprime clairement ce rapport spatial.
- source_word: לְמִגְדַּל עֵדֶר
  choice: Migdal-Éder
  rationale: L’expression fonctionne ici comme un nom de lieu. La translittération préserve ce statut, tandis que son sens est indiqué en note.
