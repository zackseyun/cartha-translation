  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: fr
  text: 'Et les fils de Zilpa[a], la servante de Léa : Gad et Asher[b]. Tels sont les fils de Jacob qui lui naquirent à Paddân-Aram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi se traduire par « femme esclave » ou « esclave », ce qui exprime plus nettement le statut social de Zilpa.
    reason: lexical_alternative
  - marker: b
    text: Bien que le verset dise que ces fils naquirent à Jacob « à Paddân-Aram », Benjamin naquit plus tard en Canaan (versets 16–18). Cette phrase récapitule les fils rattachés à la période araméenne de la maison de Jacob, sans appliquer à Benjamin cette indication de lieu.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: Le pluriel construit בְּנֵי désigne ici précisément les fils et poursuit la liste généalogique.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Translittération française usuelle du nom propre.
- source_word: שִׁפְחַת
  choice: la servante de
  rationale: « Servante » est naturel en français moderne et indique la condition subordonnée de Zilpa; une note signale que le terme hébreu peut désigner plus nettement une esclave.
- source_word: לֵאָה
  choice: Léa
  rationale: Forme française usuelle du nom propre; la relation construite est rendue par « de Léa ».
- source_word: גָּד וְאָשֵׁר
  choice: Gad et Asher
  rationale: Formes françaises usuelles des noms propres, avec restitution de la conjonction.
- source_word: אֵלֶּה
  choice: Tels sont
  rationale: Formulation française naturelle et digne pour introduire la récapitulation généalogique.
- source_word: בְּנֵי יַעֲקֹב
  choice: les fils de Jacob
  rationale: Le texte hébreu parle spécifiquement des fils de Jacob.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: qui lui naquirent
  rationale: Cette tournure conserve le passif et le point de vue de Jacob sans ajouter une mère comme sujet explicite.
- source_word: בְּפַדַּן אֲרָם
  choice: à Paddân-Aram
  rationale: Le toponyme est translittéré plutôt qu'interprété étymologiquement; l'accent circonflexe aide à représenter la voyelle longue selon un usage français établi.
theological_decisions:
- issue: Portée géographique de l'affirmation finale
  choice: Conserver sans correction « qui lui naquirent à Paddân-Aram »
  alternative: Reformuler pour exclure explicitement Benjamin de l'indication géographique
  rationale: Le verset formule une récapitulation générale alors que Benjamin est né en Canaan selon les versets 16–18. La traduction préserve cette tension textuelle et l'explique en note plutôt que de la résoudre dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve la forme de liste puis la récapitulation de l'hébreu. « Servante » évite l'archaïsme tout en laissant une note préciser la réalité sociale potentiellement plus dure du terme source.
