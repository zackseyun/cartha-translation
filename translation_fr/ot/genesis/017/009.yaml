  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם וְ/אַתָּ֖ה אֶת בְּרִיתִ֣/י תִשְׁמֹ֑ר אַתָּ֛ה וְ/זַרְעֲ/ךָ֥ אַֽחֲרֶ֖י/ךָ לְ/דֹרֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: fr
  text: 'Dieu dit à Abraham : « Quant à toi, tu garderas mon alliance, toi et ta descendance après toi, de génération en génération. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français et rend naturellement l’enchaînement sans qu’il soit nécessaire d’ajouter « et ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: C’est l’équivalent français direct et usuel dans ce contexte.
- source_word: וְאַתָּה
  choice: Quant à toi
  rationale: La formule rend la mise en relief du pronom antéposé et le passage des promesses divines à l’obligation d’Abraham.
- source_word: אֶת־בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français établi pour בְּרִית et conserve pleinement le vocabulaire central du passage.
- source_word: תִשְׁמֹר
  choice: tu garderas
  rationale: Le verbe שׁמר signifie garder, observer ou respecter. « Garder » préserve l’image et le caractère direct de l’obligation d’alliance.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: toi et ta descendance
  rationale: Dans ce contexte généalogique, le collectif singulier זֶרַע désigne la postérité d’Abraham. « Descendance » est naturel en français, reste collectif et évite l’ambiguïté moderne de « semence ».
- source_word: אַחֲרֶיךָ
  choice: après toi
  rationale: Cette traduction directe exprime la succession de la lignée.
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Cette expression française idiomatique traduit la continuité à travers les générations successives, le suffixe renvoyant à la descendance collective.
theological_decisions:
- issue: Formulation de l’obligation liée à l’alliance
  choice: tu garderas mon alliance
  alternative: tu observeras mon alliance
  rationale: « Garderas » conserve le champ sémantique de שׁמר et la formulation solennelle de l’injonction, sans préciser davantage la nature juridique, rituelle ou sacramentelle de cette fidélité.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif biblique naturel sans archaïsme marqué. La répétition « Quant à toi… toi et ta descendance » conserve l’insistance présente dans l’hébreu.
