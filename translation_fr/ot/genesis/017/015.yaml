  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: fr
  text: 'Puis Dieu dit à Abraham : « Quant à Saraï, ta femme, tu ne l’appelleras pas du nom de Saraï, car son nom est Sara[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « tu ne l’appelleras plus Saraï ; elle s’appellera Sara. »'
    reason: Alternative lexicale et syntaxique rendant explicitement en français la portée du changement de nom.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait progresser le récit. « Puis » exprime naturellement cette succession en français moderne.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne au singulier le Dieu qui parle à Abraham.
- source_word: שָׂרַי
  choice: Saraï
  rationale: La translittération distingue clairement l’ancien nom du nouveau.
- source_word: אִשְׁתְּךָ
  choice: ta femme
  rationale: La forme avec suffixe de deuxième personne identifie directement Saraï par rapport à Abraham.
- source_word: לֹא תִקְרָא אֶת שְׁמָהּ שָׂרָי
  choice: tu ne l’appelleras pas du nom de Saraï
  rationale: Cette formulation conserve la prohibition solennelle et la répétition de l’idée de nom, tout en restant intelligible en français.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication de la nouvelle désignation.
- source_word: שָׂרָה שְׁמָהּ
  choice: son nom est Sara
  rationale: La proposition nominale hébraïque énonce directement le nouveau nom sans auxiliaire futur explicite.
theological_decisions:
- issue: Formule de changement de nom
  choice: 'Une interdiction suivie d’une déclaration directe : « tu ne l’appelleras pas du nom de Saraï, car son nom est Sara »'
  alternative: « tu ne l’appelleras plus Saraï ; elle s’appellera Sara »
  rationale: Le choix principal préserve la solennité de la formule, la répétition relative au nom et le caractère non verbal de la dernière proposition, sans ajouter explicitement « plus » ni transformer la déclaration en futur.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond au discours direct adressé à Abraham. « Saraï » et « Sara » suivent les formes françaises traditionnelles tout en maintenant nettement le contraste entre les deux noms.
