revisions:
- from: Quand il eut fini de parler avec lui, Dieu monta d’auprès d’Abraham.[a]
  to: Lorsque Dieu eut fini de parler avec Abraham, il s’éleva au-dessus de lui.[a]
  rationale: La révision remplace une collocation peu naturelle par « s’éleva au-dessus de lui », qui conserve le mouvement ascendant et la relation spatiale du texte hébreu. Elle explicite les référents là où la syntaxe française l’exige pour une lecture claire, sans interpréter théologiquement la description narrative.
