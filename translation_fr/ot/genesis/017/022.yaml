  text: וַ/יְכַ֖ל לְ/דַבֵּ֣ר אִתּ֑/וֹ וַ/יַּ֣עַל אֱלֹהִ֔ים מֵ/עַ֖ל אַבְרָהָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: fr
  text: Lorsque Dieu eut fini de parler avec Abraham, il s’éleva au-dessus de lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le verbe « monter / s’élever » et décrit la fin de la manifestation divine en termes spatiaux. Littéralement, Dieu « monta de dessus / d’au-dessus d’Abraham »; on peut aussi traduire : « Dieu monta en s’éloignant d’Abraham. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Quand il eut fini
  rationale: Le verbe כלה au wayyiqtol exprime ici l’achèvement de l’action. La tournure temporelle française relie naturellement cette action à la montée de Dieu.
- source_word: לְדַבֵּר
  choice: de parler
  rationale: Après « finir », l’infinitif français rend naturellement l’expression hébraïque signifiant « finir de parler ».
- source_word: אִתּוֹ
  choice: avec lui
  rationale: La préposition אֵת marque ici l’interaction. « Avec lui » conserve la réciprocité suggérée par l’hébreu sans remplacer le pronom par son référent contextuel, Abraham.
- source_word: וַיַּעַל
  choice: monta
  rationale: עלה désigne concrètement un mouvement vers le haut. « Monta » préserve cette image spatiale, contrairement à « partit » ou « se retira », qui l’effaceraient.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom commande ici un verbe au singulier et désigne Dieu.
- source_word: מֵעַל
  choice: d’auprès d’Abraham
  rationale: מֵעַל signifie littéralement « de dessus/de par-dessus ». Dans ce récit de manifestation divine, « d’auprès d’Abraham » reste compréhensible en français tout en conservant l’idée que Dieu quitte la proximité d’Abraham.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
theological_decisions:
- issue: Description spatiale du départ de Dieu
  choice: Dieu monta d’auprès d’Abraham
  alternative: Dieu se retira d’auprès d’Abraham
  rationale: Le texte hébreu décrit la fin de la manifestation divine par un mouvement ascendant concret. La traduction conserve cette représentation sans la réduire à une formulation abstraite.
- issue: Identité des pronoms dans « il eut fini de parler avec lui »
  choice: Conserver les pronoms
  alternative: Quand Dieu eut fini de parler avec Abraham
  rationale: Le contexte permet d’identifier les référents, mais l’hébreu emploie d’abord des formes pronominales avant de nommer Dieu dans la proposition suivante. Les conserver évite d’expliciter dans le texte principal ce qui demeure implicite dans la syntaxe source.
translation_notes:
  register: Français moderne, sobre et digne. Le passé antérieur après « quand » marque clairement l’action achevée antérieure à la proposition principale. « Monta d’auprès de » est volontairement plus concret qu’une simple formulation de départ et conserve l’image hébraïque.
