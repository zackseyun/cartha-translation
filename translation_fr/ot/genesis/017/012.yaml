base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: fr
  text: À l’âge de huit jours[a], tout mâle parmi vous sera circoncis, de génération en génération, qu’il soit né dans la maisonnée ou acquis à prix d’argent[b] auprès de tout étranger qui n’est pas de ta descendance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils de huit jours ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « acheté avec de l’argent ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « auprès de tout fils d’étranger qui n’est pas de ta semence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: À l’âge de huit jours
  rationale: L’expression hébraïque signifie littéralement « fils de huit jours ». Cette formulation française naturelle conserve précisément l’âge prescrit.
- source_word: יִמּוֹל
  choice: sera circoncis
  rationale: La forme hébraïque est passive dans ce contexte et exprime une prescription. Le futur français garde le ton juridique et solennel du passage.
- source_word: לָכֶם כָּל זָכָר
  choice: tout mâle parmi vous
  rationale: « Tout mâle » traduit directement כָּל זָכָר, tandis que « parmi vous » rend לָכֶם de façon idiomatique et indique la communauté concernée.
- source_word: לְדֹרֹתֵיכֶם
  choice: de génération en génération
  rationale: Cette tournure française courante exprime l’application durable de la prescription au fil des générations.
- source_word: יְלִיד בָּיִת
  choice: celui qui est né dans la maison
  rationale: La traduction reste proche de l’image hébraïque tout en désignant clairement une personne née au sein de la maisonnée.
- source_word: וּמִקְנַת כֶּסֶף
  choice: celui qui a été acheté à prix d’argent
  rationale: La formulation rend l’acquisition d’une personne et conserve la mention concrète de l’argent, כֶּסֶף, sans l’atténuer en simple échange financier.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: à n’importe quel étranger
  rationale: Littéralement « de tout fils d’un étranger », l’expression désigne idiomatiquement un étranger. « N’importe quel » conserve la portée générale de כֹּל.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: qui n’est pas de ta descendance
  rationale: « Descendance » transmet ici le sens généalogique de זֶרַע. Le singulier « ta » préserve l’adresse personnelle à Abraham, après le pluriel « parmi vous ».
theological_decisions:
- issue: Étendue de l’ordre de circoncision dans la maison d’Abraham
  choice: Le texte inclut tout mâle de la maisonnée, qu’il y soit né ou qu’il ait été acheté à un étranger, et pas seulement les descendants biologiques d’Abraham.
  alternative: Limiter principalement cet ordre aux descendants physiques d’Abraham.
  rationale: L’hébreu mentionne explicitement les personnes nées dans la maison et celles acquises auprès d’étrangers qui ne sont pas de la descendance d’Abraham. La traduction conserve cette portée sans tirer de conclusion théologique ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. Le futur passif maintient le caractère prescriptif du verset. La structure « celui… comme celui… » rend explicite l’inclusion des deux catégories sans ajouter de distinction absente du texte. L’alternance entre « vous » et « ta » reproduit le passage de l’adresse collective à l’adresse singulière à Abraham.
