revisions:
- from: 'À l’âge de huit jours[a], tout mâle parmi vous sera circoncis, de génération en génération : celui qui est né dans la maison comme celui qui a été acheté à prix d’argent[b] à n’importe quel étranger qui n’est pas de ta descendance[c].'
  to: À l’âge de huit jours[a], tout mâle parmi vous sera circoncis, de génération en génération, qu’il soit né dans la maisonnée ou acquis à prix d’argent[b] auprès de tout étranger qui n’est pas de ta descendance[c].
  rationale: La révision clarifie la relation d’acquisition marquée par מִן, améliore la fluidité du français international moderne et précise le cadre domestique de יְלִיד בָּיִת. Elle conserve l’adresse collective (« parmi vous ») puis singulière (« ta descendance »), la portée inclusive du commandement et le langage concret de l’argent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:50:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : l’obligation concerne chaque mâle à huit jours et s’étend aux personnes nées dans la maisonnée comme à celles acquises hors de la descendance d’Abraham. Toutefois, « acheté … à n’importe quel étranger » est moins précis et moins naturel pour rendre la provenance exprimée par מִן ; « auprès de tout étranger » rend mieux le rapport d’acquisition sans modifier le sens.'
  naturalness: « À prix d’argent à n’importe quel étranger » est lourd et peut se lire comme si l’étranger recevait le prix plutôt que comme l’indication de provenance. « Acquis à prix d’argent auprès de tout étranger » est idiomatique dans un registre biblique moderne et explicite la relation syntaxique.
  terminology: « Maisonnée » exprime plus exactement יְלִיד בָּיִת, né au sein du foyer domestique, que « dans la maison », sans effacer l’image du texte. « Descendance » conserve adéquatement le sens généalogique de זֶרַע. Les termes concernant l’acquisition sont conservés sans atténuation.
  issues:
  - severity: medium
    issue: Formulation de l’acquisition auprès de l’étranger
    rationale: Le syntagme « acheté à prix d’argent à n’importe quel étranger » est syntaxiquement pesant et « n’importe quel » est plus conversationnel que le registre du passage. Le texte hébreu indique une personne acquise « de/auprès de tout fils d’étranger » ; « acquis à prix d’argent auprès de tout étranger » est plus clair et fidèle.
  - severity: low
    issue: Rendu de יְלִיד בָּיִת
    rationale: « Né dans la maison » est compréhensible, mais « né dans la maisonnée » rend plus nettement l’appartenance au foyer domestique désigné par l’hébreu.
  revised_text: À l’âge de huit jours[a], tout mâle parmi vous sera circoncis, de génération en génération, qu’il soit né dans la maisonnée ou acquis à prix d’argent[b] auprès de tout étranger qui n’est pas de ta descendance[c].
