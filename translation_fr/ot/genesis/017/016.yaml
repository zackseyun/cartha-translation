id: GEN.17.16
reference: Genesis 17:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: fr
  text: Je la bénirai et, de plus, je te donnerai par elle un fils. Je la bénirai, et elle donnera naissance à des nations[a] ; des rois de peuples seront issus d’elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elle deviendra des nations ». On peut aussi comprendre : « elle deviendra la mère de nations ».'
    reason: La formulation hébraïque est concise et saisissante ; la note en conserve la littéralité ainsi que l’explicitation possible du rapport généalogique.
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: Je la bénirai / Je la bénirai
  rationale: « Bénir » conserve le poids théologique et l’ancrage dans l’alliance du verbe ברך. La répétition de la promesse est maintenue.
- source_word: וְגַם
  choice: et, de plus
  rationale: Cette formulation rend la valeur additive et emphatique de la particule, au-delà d’une simple coordination.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: je te donnerai par elle un fils
  rationale: Dans ce contexte de promesse, le qatal a une valeur future. « Par elle » préserve le lien explicite entre le fils promis et Sara sans ajouter qu’elle en sera la mère, même si cela est impliqué.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: elle donnera naissance à des nations
  rationale: Le rendu idiomatique exprime naturellement en français que plusieurs nations seront issues de Sara. Une note conserve la formulation hébraïque plus saisissante, littéralement « elle deviendra des nations ».
- source_word: גוֹיִם
  choice: nations
  rationale: « Nations » est le correspondant direct et usuel de גוֹיִם dans les promesses patriarcales.
- source_word: מַלְכֵי עַמִּים
  choice: des rois de peuples
  rationale: Ce rendu garde « peuples » pour עַמִּים, distinct de « nations » pour גוֹיִם, et respecte la construction hébraïque.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: seront issus d’elle
  rationale: Cette expression française naturelle rend l’idée d’origine et de descendance portée par l’hébreu, littéralement « seront d’elle ».
theological_decisions:
- issue: La promesse concernant les descendants de Sara
  choice: elle donnera naissance à des nations ; des rois de peuples seront issus d’elle
  alternative: elle deviendra des nations ; des rois de peuples seront issus d’elle
  rationale: Le texte annonce collectivement des nations et des lignées royales issues de Sara. Le texte principal emploie une tournure française intelligible sans réduire la portée de la promesse, tandis que la note préserve l’expression hébraïque inhabituelle et son ambiguïté.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de « Je la bénirai » et la distinction entre « nations » et « peuples » sont conservées. La syntaxe est fluide sans effacer l’étrangeté de l’hébreu, signalée en note.
