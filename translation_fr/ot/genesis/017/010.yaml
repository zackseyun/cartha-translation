source:
  edition: WLC
  text: זֹ֣את בְּרִיתִ֞/י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֥ין זַרְעֲ/ךָ֖ אַחֲרֶ֑י/ךָ הִמּ֥וֹל לָ/כֶ֖ם כָּל זָכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: fr
  text: 'Voici mon alliance, que vous devrez respecter, entre moi et vous, et entre moi et ta descendance[a] après toi : tout mâle parmi vous devra être circoncis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta postérité après toi ». Le mot hébreu זֶרַע est un nom collectif qui peut désigner la descendance ou les descendants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: Voici mon alliance
  rationale: « Voici » introduit naturellement en français la stipulation qui définit l’alliance, tandis que « alliance » est le terme établi et précis pour בְּרִית dans ce contexte.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: que vous observerez
  rationale: Le verbe שׁמר appliqué à une alliance exprime le fait d’en respecter les obligations. Le futur français conserve ici la valeur prescriptive de l’imparfait hébreu et le ton solennel du passage.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: entre moi et vous et ta descendance après toi
  rationale: La formulation maintient le passage du pluriel « vous » au singulier « ta… toi », qui s’adresse de nouveau à Abraham. « Descendance » rend le sens collectif de זֶרַע sans réduire le terme à un seul enfant.
- source_word: הִמּוֹל
  choice: sera circoncis
  rationale: L’infinitif absolu exprime ici l’exigence de l’alliance. La tournure passive convient à כָּל זָכָר et reste naturelle dans une prescription solennelle.
- source_word: לָכֶם
  choice: parmi vous
  rationale: Dans ce contexte, le pronom prépositionnel désigne le groupe au sein duquel l’exigence s’applique; « parmi vous » en explicite clairement la portée distributive.
- source_word: כָּל זָכָר
  choice: tout mâle
  rationale: Cette expression conserve sans généralisation la portée explicitement masculine de l’exigence hébraïque.
theological_decisions:
- issue: Portée masculine du signe de l’alliance
  choice: tout mâle parmi vous sera circoncis
  alternative: vous serez tous circoncis
  rationale: Le texte hébreu précise כָּל זָכָר, « tout mâle ». La traduction garde cette restriction explicite au lieu de la transformer en prescription indifférenciée.
- issue: Alternance entre destinataires pluriels et adresse singulière à Abraham
  choice: entre moi et vous et ta descendance après toi
  alternative: entre moi, toi et tes descendants après toi
  rationale: Le texte passe réellement du pluriel תִּשְׁמְרוּ / בֵּינֵיכֶם au singulier זַרְעֲךָ / אַחֲרֶיךָ. Conserver cette tension grammaticale évite d’uniformiser silencieusement les destinataires.
translation_notes:
  register: Français international moderne, digne et accessible. La structure solennelle de l’énoncé d’alliance est conservée, ainsi que l’alternance significative entre le pluriel « vous » et le singulier « ta… toi ».
