source:
  edition: WLC
  text: אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖/י אִתָּ֑/ךְ וְ/הָיִ֕יתָ לְ/אַ֖ב הֲמ֥וֹן גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: fr
  text: Quant à moi[a], voici que mon alliance est avec toi, et tu deviendras le père d’une multitude de nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Moi, voici que mon alliance est avec toi. » Le pronom et la particule qui ouvrent la phrase sont emphatiques en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant est emphatique. « Quant à moi » restitue naturellement en français la mise en relief qui ouvre la déclaration divine.
- source_word: הִנֵּה
  choice: voici
  rationale: La particule attire solennellement l’attention sur ce qui suit. « Voici » conserve cette force déictique dans un français actuel et digne.
- source_word: בְרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français établi pour בְּרִית dans le récit d’Abraham et en préserve la portée relationnelle et théologique.
- source_word: אִתָּךְ
  choice: avec toi
  rationale: Cette expression traduit directement la préposition et son suffixe, sans développer le texte en « entre moi et toi ».
- source_word: וְהָיִיתָ
  choice: et tu deviendras
  rationale: Dans cette déclaration de promesse, la forme verbale a une valeur future et résultative. « Tu deviendras » souligne le passage au rôle annoncé.
- source_word: לְאָב
  choice: le père de
  rationale: La construction signifie littéralement « pour père de ». En français, « devenir le père de » est idiomatique et exprime le rôle déterminant attribué à Abram.
- source_word: הֲמוֹן
  choice: une multitude de
  rationale: Le mot désigne une masse nombreuse. « Une multitude de » conserve sa force quantitative ainsi que son importance pour l’explication du nouveau nom au verset suivant.
- source_word: גּוֹיִם
  choice: nations
  rationale: Le terme désigne ici largement des nations ou des peuples issus d’Abraham, sans le sens technique ultérieur de « païens ».
theological_decisions:
- issue: Formulation de l’alliance et rôle d’Abraham
  choice: « mon alliance est avec toi, et tu deviendras le père d’une multitude de nations »
  alternative: « j’établis mon alliance avec toi » ou « tu seras l’ancêtre de nombreuses nations »
  rationale: La formulation retenue préserve la déclaration relationnelle et la promesse du texte hébreu sans expliciter une action d’établissement ni remplacer l’image théologique de la paternité par une paraphrase.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » garde la solennité de הִנֵּה sans recourir à l’archaïque « voici que » dans le texte principal. La ponctuation rend perceptible l’emphase de l’ouverture hébraïque.
