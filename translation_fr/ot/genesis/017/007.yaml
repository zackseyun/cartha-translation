  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: fr
  text: J’établirai mon alliance entre moi et toi, et entre moi et ta descendance après toi, de génération en génération, comme une alliance éternelle, afin d’être ton Dieu et le Dieu de ta descendance après toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: J’établirai
  rationale: Le hifil de קום avec בְּרִית exprime ici l’établissement ou la confirmation ferme d’une alliance. « J’établirai » convient naturellement au contexte.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: Rend directement le nom בְּרִית et son suffixe possessif.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: entre moi et toi, ainsi qu’avec
  rationale: La formulation française évite la lourdeur d’une répétition littérale de « entre », tout en distinguant clairement les parties de l’alliance.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: זֶרַע est un singulier collectif pouvant désigner la postérité ou les descendants. « Descendance » conserve en français cette valeur collective sans imposer un pluriel individualisant ni l’expression archaïque « semence ».
- source_word: אַחֲרֶיךָ
  choice: après toi
  rationale: Expression temporelle et généalogique directe, reprise aux deux occurrences.
- source_word: לְדֹרֹתָם
  choice: de génération en génération
  rationale: Cette expression française naturelle communique la continuité de l’alliance au fil des générations successives.
- source_word: לִבְרִית עוֹלָם
  choice: ce sera une alliance éternelle
  rationale: La proposition française explicite naturellement la valeur prédicative de לְ. עוֹלָם décrit ici une durée permanente ou indéfiniment durable; « éternelle » est la formulation biblique française courante et accessible.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: Je serai ton Dieu
  rationale: L’infinitif de but est rendu comme le contenu promis de l’alliance. « Être ton Dieu » est l’équivalent idiomatique français de la construction hébraïque « être Dieu pour toi ».
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: et celui de ta descendance après toi
  rationale: « Celui de » évite de répéter « Dieu » tout en conservant clairement l’application de la promesse à la descendance.
theological_decisions:
- issue: Portée collective de זֶרַע dans la promesse faite à Abraham
  choice: ta descendance
  alternative: ta postérité; ta semence; tes descendants
  rationale: « Descendance » garde la valeur collective du singulier hébreu et n’impose ni une lecture strictement plurielle ni une lecture exclusivement individuelle ou typologique.
- issue: Formule relationnelle de l’alliance
  choice: Je serai ton Dieu et celui de ta descendance
  alternative: pour être Dieu pour toi et pour ta descendance
  rationale: La formulation choisie est naturelle en français et conserve la relation d’alliance exprimée par l’hébreu, sans lui ajouter de précision doctrinale.
- issue: Durée exprimée par עוֹלָם
  choice: alliance éternelle
  alternative: alliance perpétuelle; alliance durable
  rationale: « Éternelle » préserve la force traditionnelle et solennelle du terme sans préciser au-delà du texte la manière dont cette durée doit être comprise théologiquement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement lissée pour éviter une répétition peu naturelle de « entre » et pour rendre la formule d’alliance idiomatique, tout en conservant le rythme solennel, la portée collective de « descendance » et la répétition d’« après toi ».
