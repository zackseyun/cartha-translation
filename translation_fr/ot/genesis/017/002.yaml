  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: fr
  text: J’établirai mon alliance entre moi et toi[a], et je te multiplierai à l’extrême.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Je donnerai, ou je mettrai, mon alliance entre moi et toi. »'
    reason: Alternative lexicale conservant le sens concret du verbe נתן.
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: J’établirai
  rationale: Le verbe נתן signifie littéralement « donner, mettre, placer ». Avec בְּרִית dans ce contexte, « établir » exprime naturellement en français l’acte par lequel Dieu met son alliance en vigueur, tandis qu’une note conserve le sens plus littéral.
- source_word: בְרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français courant qui conserve la portée relationnelle et théologique de בְּרִית ; le suffixe de première personne est rendu par « mon ».
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre moi et toi
  rationale: Cette formulation reproduit directement la relation exprimée par la construction hébraïque répétant בֵּין.
- source_word: וְאַרְבֶּה אֹתְךָ
  choice: et je te rendrai … nombreux
  rationale: Le hiphil de רבה exprime ici une augmentation causée par Dieu. Le pronom « te » maintient l’adresse directe à Abram sans remplacer explicitement celui-ci par sa descendance.
- source_word: בִּמְאֹד מְאֹד
  choice: extrêmement
  rationale: L’adverbe intensif rend avec naturel le redoublement de מְאֹד, littéralement « beaucoup, beaucoup ».
theological_decisions:
- issue: Expression d’alliance avec נתן + בְּרִית
  choice: J’établirai mon alliance
  alternative: Je donnerai / placerai mon alliance
  rationale: « Établir une alliance » communique clairement en français l’acte souverain décrit ici sans faire de l’alliance un simple objet transféré. La note signale toutefois la formulation hébraïque plus concrète afin de ne pas masquer l’ambiguïté lexicale.
- issue: Portée du pronom singulier אֹתְךָ
  choice: je te rendrai extrêmement nombreux
  alternative: je multiplierai ta descendance
  rationale: Le texte s’adresse directement à Abram au masculin singulier. Même si la promesse implique ses descendants, le texte principal n’explicite pas ce que l’hébreu laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe « entre moi et toi » conserve la forme relationnelle de l’hébreu, tandis que « extrêmement nombreux » restitue l’intensité sans la répétition peu naturelle « très, très ».
