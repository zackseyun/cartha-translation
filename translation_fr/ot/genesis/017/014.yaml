  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: fr
  text: 'Tout mâle incirconcis qui ne sera pas circoncis dans la chair de son prépuce sera retranché de son peuple[a] : il a rompu mon alliance.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « sera retranché » désigne une grave sanction liée à l’alliance. Selon les contextes, elle peut évoquer l’exclusion de la communauté ou la mort ; ce verset ne précise pas davantage.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: Quant au mâle incirconcis
  rationale: « Mâle incirconcis » conserve la précision de זָכָר et le marqueur d’alliance exprimé par עָרֵל. La tournure introductive rend naturellement la valeur casuelle de la disposition légale.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: qui n’aura pas été circoncis
  rationale: Le niphal de מול a ici un sens passif. Le futur antérieur convient à une règle juridique portant sur le cas où la circoncision prescrite n’a pas été accomplie.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: dans la chair de son prépuce
  rationale: La formulation garde la précision anatomique concrète de l’hébreu au lieu de la réduire à une simple répétition d’« incirconcis ».
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: cette personne sera retranchée
  rationale: Dans ce contexte juridique, נֶפֶשׁ désigne la personne concernée plutôt qu’une composante immatérielle appelée « âme ». « Sera retranchée » conserve sans l’expliciter l’expression hébraïque de sanction d’alliance.
- source_word: מֵעַמֶּיהָ
  choice: de son peuple
  rationale: Le suffixe féminin s’accorde grammaticalement avec נֶפֶשׁ, mais renvoie au mâle incirconcis. « Son peuple » restitue naturellement עַם comme communauté du peuple de l’alliance.
- source_word: אֶת בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français établi qui conserve le poids théologique et la cohérence lexicale de בְּרִית dans Genèse 17.
- source_word: הֵפַר
  choice: elle a rompu
  rationale: Le verbe הפר signifie rompre, violer ou rendre nul. « Rompre une alliance » est une expression française claire et idiomatique. Le pronom féminin reprend grammaticalement « cette personne » sans modifier le référent masculin.
theological_decisions:
- issue: Sens de la sanction d’alliance exprimée par כרת (« retrancher »)
  choice: Conserver « sera retranchée » sans préciser davantage la nature de la sanction.
  alternative: « sera exclue de la communauté » ou « sera mise à mort »
  rationale: Le verset ne détermine pas explicitement si la sanction désigne l’exclusion, la mort ou un jugement divin plus largement compris. L’expression traditionnelle « retranchée de son peuple » maintient cette tension.
- issue: Traduction de נֶפֶשׁ
  choice: « personne »
  alternative: « âme »
  rationale: Ici, נֶפֶשׁ désigne l’individu soumis à la sanction de l’alliance. « Personne » évite d’introduire une conception anthropologique plus étroite que celle qu’impose le texte.
- issue: Responsabilité exprimée par הֵפַר
  choice: « elle a rompu mon alliance »
  alternative: « il a violé mon alliance »
  rationale: Le parfait présente la rupture de l’alliance comme le fondement de la sanction. Le féminin grammatical reprend « personne » tout en laissant clair, par la première proposition, que le référent est masculin.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère juridique du verset, sa précision anatomique et l’ambiguïté de la sanction. Le terme « âme » est évité ici, car il risquerait de suggérer une distinction anthropologique absente du contexte.
