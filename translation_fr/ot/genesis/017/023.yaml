- from: Abraham prit donc son fils Ismaël, tous ceux qui étaient nés dans sa maison et tous ceux qu’il avait achetés avec son argent, bref, tous les hommes de la maisonnée d’Abraham, et il circoncit la chair de leur prépuce ce jour-là même[a], comme Dieu le lui avait dit[b].
  to: Abraham prit son fils Ismaël, tous ceux qui étaient nés dans sa maison et tous ceux qu’il avait achetés avec son argent, tous les mâles de la maisonnée d’Abraham, et il circoncit la chair de leur prépuce en ce jour même[a], comme Dieu le lui avait dit[b].
  rationale: La révision retire deux connecteurs absents du texte source, rend explicitement la portée de זָכָר par « tous les mâles », et corrige la note relative à דבר איתו afin de ne pas introduire un complément non exprimé. Le reste de la formulation est conservé, car il est fidèle, clair et adapté au français international moderne.
