source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: fr
  text: Abraham prit son fils Ismaël, tous ceux qui étaient nés dans sa maison et tous ceux qu’il avait achetés avec son argent, tous les mâles de la maisonnée d’Abraham, et il circoncit la chair de leur prépuce en ce jour même[a], comme Dieu le lui avait dit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en ce jour même »; cette expression souligne qu’Abraham agit ce jour-là, sans délai.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme Dieu avait parlé avec lui » ou « comme Dieu lui avait parlé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit donc
  rationale: Le verbe לקח signifie couramment « prendre » dans le récit. « Donc » rend ici la continuité logique avec l’ordre divin précédent sans ajouter de contenu substantiel.
- source_word: יְלִידֵי בֵיתוֹ
  choice: ceux qui étaient nés dans sa maison
  rationale: Cette formulation conserve l’image concrète de l’hébreu sans préciser davantage que le texte le statut de ces personnes.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: ceux qu’il avait achetés avec son argent
  rationale: La locution désigne des personnes acquises par achat. Cette traduction est claire en français moderne et garde la dimension économique du texte.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: bref, tous les hommes de la maisonnée d’Abraham
  rationale: « Tous les hommes » exprime naturellement la totalité des personnes de sexe masculin visées; « maisonnée » rend בית comme groupe domestique. « Bref » marque la valeur récapitulative de la proposition.
- source_word: וַיָּמָל
  choice: il circoncit
  rationale: « Circoncire » est le terme français précis et conventionnel pour ce geste.
- source_word: בְּשַׂר עָרְלָתָם
  choice: la chair de leur prépuce
  rationale: La formulation conserve le caractère corporel et concret de l’expression hébraïque ainsi que son vocabulaire d’alliance.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ce jour-là même
  rationale: Cette tournure française idiomatique restitue l’insistance sur le fait qu’Abraham agit exactement le jour indiqué, sans délai.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: comme Dieu le lui avait dit
  rationale: Dans ce contexte, דבר avec אֵת se rend naturellement par « dire à ». Le plus-que-parfait respecte l’antériorité de la parole divine.
theological_decisions:
- issue: Rendu de אֱלֹהִים
  choice: Dieu
  alternative: le dieu
  rationale: Dans Genèse 17, le référent est sans ambiguïté le Dieu qui établit son alliance avec Abraham; le français exige ici le nom propre usuel « Dieu ».
- issue: Description sexuée des membres de la maison
  choice: tous les hommes de la maisonnée d’Abraham
  alternative: tous les membres de la maisonnée d’Abraham
  rationale: Le texte précise explicitement כָּל זָכָר, « tout mâle ». Le rendu masculin conserve cette donnée au lieu de la neutraliser.
- issue: Relation entre la parole divine et l’acte d’Abraham
  choice: comme Dieu le lui avait dit
  alternative: comme Dieu avait parlé avec lui
  rationale: La traduction choisie exprime naturellement l’obéissance à la parole reçue. L’alternative, possible lexicalement, mettrait davantage l’accent sur l’échange dialogué, mais paraît moins idiomatique dans cette proposition.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase reste proche de la structure hébraïque tout en évitant la redondance peu naturelle « tout mâle parmi les hommes ». « Maisonnée » désigne ici l’ensemble des personnes rattachées à la maison d’Abraham, et non seulement sa famille proche.
