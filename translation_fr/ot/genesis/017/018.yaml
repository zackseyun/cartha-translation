  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: fr
  text: 'Abraham dit à Dieu : « Ah ! Qu’Ismaël vive devant toi[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si seulement Ismaël pouvait vivre en ta présence ! » L’expression peut aussi suggérer : « sous ta faveur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw consécutif fait avancer le récit. En français narratif, le passé simple exprime naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: אֶל הָאֱלֹהִים
  choice: à Dieu
  rationale: Avec un verbe de parole, אֶל se rend naturellement par « à ». Malgré l’article hébreu, le français désigne ici le Dieu connu du contexte simplement par « Dieu ».
- source_word: לוּ
  choice: Ah ! Qu’…
  rationale: La particule introduit ici un souhait pressant, non une condition. Cette tournure française restitue sa valeur optative et son intensité affective.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: Forme française courante du nom propre biblique.
- source_word: יִחְיֶה
  choice: vive
  rationale: Après la tournure optative « Ah ! Que », le subjonctif présent exprime naturellement le souhait qu’Ismaël continue à vivre et à prospérer.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Rendu direct de l’expression « devant ta face », qui conserve sans la préciser excessivement sa portée relationnelle et potentiellement favorable.
theological_decisions:
- issue: Portée du souhait d’Abraham concernant Ismaël devant Dieu
  choice: devant toi
  alternative: en ta présence ; sous ton regard favorable
  rationale: L’hébreu peut évoquer la vie en présence de Dieu et sous sa faveur, mais il n’explicite pas ici tout le statut théologique souhaité pour Ismaël. Le rendu concis préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit. L’exclamation garde l’émotion du souhait sans recourir à la tournure vieillie « Plût à Dieu ».
