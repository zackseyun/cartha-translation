  text: וְ/הִפְרֵתִ֤י אֹֽתְ/ךָ֙ בִּ/מְאֹ֣ד מְאֹ֔ד וּ/נְתַתִּ֖י/ךָ לְ/גוֹיִ֑ם וּ/מְלָכִ֖ים מִמְּ/ךָ֥ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: fr
  text: Je te rendrai extrêmement fécond[a], je ferai de toi des nations[b], et des rois sortiront de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « très, très » ou « beaucoup, beaucoup » ; le redoublement exprime ici une très forte intensité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je te donnerai pour nations » ; dans le contexte, Abraham est présenté comme celui dont seront issues des nations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: Je te rendrai … fécond
  rationale: 'Le hifil de פרה exprime la causalité : Dieu fera porter du fruit à Abraham ou le rendra fécond. Cette formulation conserve ce sens tout en étant naturelle en français.'
- source_word: בִּמְאֹד מְאֹד
  choice: extrêmement
  rationale: Le redoublement de מְאֹד marque une forte intensification. « Extrêmement » la restitue en français courant sans lourdeur.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: je ferai de toi des nations
  rationale: 'Dans ce contexte de promesse de descendance, נתן avec ל indique le résultat : Abraham sera à l’origine de plusieurs nations. La formulation française reste proche de la construction hébraïque et préserve l’image collective.'
- source_word: לְגוֹיִם
  choice: des nations
  rationale: גּוֹיִם désigne ici plusieurs collectivités nationales issues d’Abraham, sans connotation spécifique de « non-Juifs ».
- source_word: וּמְלָכִים
  choice: et des rois
  rationale: מְלָכִים désigne précisément des rois, plutôt que des dirigeants au sens large.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: sortiront de toi
  rationale: Cette traduction conserve l’image concrète de יצא et demeure intelligible en français comme expression de l’origine généalogique.
theological_decisions:
- issue: Portée de la promesse concernant la descendance d’Abraham
  choice: Le verset promet qu’Abraham sera à l’origine de plusieurs nations et de rois.
  alternative: La formule pourrait être comprise plus abstraitement comme l’attribution à Abraham d’un statut en relation avec les nations.
  rationale: Le contexte immédiat de l’alliance met l’accent sur la fécondité, la descendance et la lignée. La traduction garde cette orientation généalogique sans lui imposer un développement théologique ultérieur.
translation_notes:
  register: Français international moderne, digne et accessible. « Fécond » convient au registre de la promesse de descendance ; « sortiront de toi » conserve l’image hébraïque sans devenir obscur.
