  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: fr
  text: 'Dieu dit : « Non, mais Sara, ta femme, te donnera un fils, et tu l’appelleras Isaac[a]. J’établirai mon alliance avec lui comme une alliance perpétuelle pour sa descendance après lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Isaac évoque en hébreu le verbe qui signifie « il rit » ou « il rira ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Non.
  rationale: Dans le contexte, Dieu corrige directement la demande précédente d’Abraham au sujet d’Ismaël. « Non » rend cette force corrective; la suite en français n’exige pas l’ajout peu naturel de « mais ».
- source_word: יֹלֶדֶת לְךָ בֵּן
  choice: te donnera un fils
  rationale: Le participe a ici une valeur future et prédictive. Cette formulation française naturelle exprime que Sara enfantera pour Abraham sans lourdeur.
- source_word: וְקָרָאתָ אֶת־שְׁמוֹ
  choice: tu l’appelleras
  rationale: Rend naturellement la formule hébraïque d’attribution du nom tout en conservant son caractère prescriptif et futur.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu; la note en signale le jeu sonore.
- source_word: וַהֲקִמֹתִי
  choice: J’établirai
  rationale: Dans le langage d’alliance, le verbe exprime le fait de mettre fermement en vigueur ou de confirmer l’alliance.
- source_word: בְּרִיתִי אִתּוֹ
  choice: mon alliance avec lui
  rationale: Préserve la relation d’alliance explicitement établie avec Isaac.
- source_word: לִבְרִית עוֹלָם
  choice: comme une alliance perpétuelle
  rationale: « Comme » rend la désignation ou le résultat exprimé par לְ; « perpétuelle » est idiomatique en français dans ce contexte et préserve la portée durable de עוֹלָם sans surdéfinition philosophique.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: pour sa descendance après lui
  rationale: « Descendance » rend le collectif singulier זֶרַע de manière claire et naturelle, sans réduire sa portée à un individu ni expliciter au-delà du texte.
theological_decisions:
- issue: Portée et continuité de la promesse d’alliance
  choice: Présenter simplement l’alliance établie avec Isaac et destinée à sa descendance après lui.
  alternative: Définir cette promesse soit exclusivement comme ethnique et nationale, soit directement selon une construction théologique chrétienne ultérieure.
  rationale: Le verset affirme l’alliance avec Isaac et sa descendance sans préciser ici toutes ses implications ultérieures; la traduction conserve cette portée et cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, le vocabulaire d’alliance est conservé, et le futur simple rend les formes prédictives sans archaïsme.
