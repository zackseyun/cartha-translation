id: GEN.17.8
reference: Genesis 17:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: fr
  text: Je te donnerai, à toi et à ta descendance après toi, le pays où tu séjournes en étranger[a], tout le pays de Canaan, comme propriété perpétuelle[b], et je serai leur Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays de tes séjours »; il s’agit de séjours en tant qu’étranger.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour propriété perpétuelle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Je donnerai
  rationale: Dans ce discours d’alliance, le parfait avec waw exprime naturellement une promesse à venir en français.
- source_word: לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: à toi et à ta descendance après toi
  rationale: « Descendance » rend le nom collectif זֶרַע sans le réduire à un individu ni l’expliciter par un pluriel; « après toi » conserve l’idée de succession.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: le pays où tu séjournes en étranger
  rationale: Cette formulation naturelle conserve à la fois le séjour et le statut d’étranger impliqués par מְגוּרִים.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: tout le pays de Canaan
  rationale: L’apposition précise le pays évoqué juste avant, tandis que « tout » rend la portée globale de כָּל.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: comme propriété perpétuelle
  rationale: אֲחֻזָּה désigne une propriété ou possession, notamment foncière, et עוֹלָם lui attribue ici une durée permanente dans le cadre de l’alliance.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: et je serai leur Dieu
  rationale: Cette tournure française idiomatique restitue la formule d’alliance sans suggérer un changement dans la nature de Dieu.
theological_decisions:
- issue: Rendre la formule d’alliance sans lui imposer une nuance doctrinale ultérieure
  choice: et je serai leur Dieu
  alternative: et je serai Dieu pour eux
  rationale: La formulation choisie exprime la relation d’alliance indiquée par l’hébreu et conserve sa résonance biblique, sans développer davantage son contenu théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise « à toi » met en relief le destinataire personnel de la promesse; « descendance » préserve la valeur collective du terme hébreu. Les notes maintiennent les principales possibilités lexicales sans alourdir le texte.
