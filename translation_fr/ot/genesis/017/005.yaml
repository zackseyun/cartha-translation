  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: fr
  text: On ne t’appellera plus Abram ; ton nom sera Abraham, car j’ai fait de toi le père d’une multitude de nations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je t’ai donné comme père d’une multitude de nations » (ou : « je t’ai établi père d’une multitude de nations »).'
    reason: Alternative lexicale pour נְתַתִּיךָ, dont le sens premier est « je t’ai donné », employé ici dans une construction prédicative.
lexical_decisions:
- source_word: יִקָּרֵא
  choice: on ne t’appellera
  rationale: Le nifal de קרא exprime ici la désignation par un nom. La tournure française impersonnelle « on t’appellera » rend naturellement ce passif hébreu.
- source_word: עוֹד
  choice: plus
  rationale: 'Avec la négation, עוֹד indique que l’ancien nom cessera d’être employé : « ne… plus » est l’équivalent idiomatique en français.'
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Traduction directe du nom avec suffixe masculin singulier.
- source_word: אַבְרָם
  choice: Abram
  rationale: Translittération française traditionnelle du nom propre hébreu.
- source_word: וְהָיָה שִׁמְךָ
  choice: ton nom sera
  rationale: Cette formulation naturelle conserve la déclaration de changement de nom ; le point-virgule suffit à marquer le contraste sans ajouter un « mais » absent du texte.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Translittération française traditionnelle du nom propre hébreu.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison explicative du nouveau nom dans un registre digne et courant.
- source_word: אַב
  choice: le père
  rationale: « Père » garde le sens ordinaire du terme et convient au contexte généalogique et à l’explication du nom.
- source_word: הֲמוֹן
  choice: une multitude
  rationale: Le substantif exprime l’abondance ou le grand nombre ; « multitude » en conserve la force nominale ainsi que l’écho verbal lié au nouveau nom.
- source_word: גּוֹיִם
  choice: nations
  rationale: Dans ce contexte, le mot désigne largement des nations ou des peuples. « Nations » est précis et évite l’anachronisme de « païens ».
- source_word: נְתַתִּיךָ
  choice: j’ai fait de toi
  rationale: Littéralement « je t’ai donné », le verbe a ici une construction prédicative que le français rend naturellement par « faire de quelqu’un ». Le passé composé préserve l’aspect accompli de la déclaration divine.
theological_decisions:
- issue: Aspect accompli de la déclaration divine
  choice: car j’ai fait de toi le père d’une multitude de nations
  alternative: car je ferai de toi le père d’une multitude de nations
  rationale: Le parfait hébreu נְתַתִּיךָ présente l’acte comme accompli. Le passé composé maintient la tension entre cette déclaration déjà établie et sa réalisation historique encore à venir.
- issue: Valeur de נְתַתִּיךָ dans la construction prédicative
  choice: j’ai fait de toi le père
  alternative: je t’ai donné comme père
  rationale: « J’ai fait de toi » communique idiomatiquement le sens de désignation ou d’établissement sans transformer le parfait en futur ; la traduction plus formelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la formule hébraïque de changement de nom, tandis que « j’ai fait de toi » évite une littéralité peu naturelle. Le marqueur de note est placé après la proposition qu’il explique.
