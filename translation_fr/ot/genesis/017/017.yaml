base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: fr
  text: 'Alors Abraham tomba face contre terre et rit. Il se dit en son cœur : « Un fils naîtra-t-il à un homme de cent ans ? Et Sara, âgée de quatre-vingt-dix ans, donnera-t-elle naissance à un enfant ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: Abraham tomba face contre terre
  rationale: La tournure exprime une chute ou prosternation sur le visage. « Tomba face contre terre » conserve le mouvement et la posture dans un français naturel.
- source_word: וַיִּצְחָק
  choice: rit
  rationale: Le verbe צחק signifie directement « rire » et maintient le lien narratif avec le nom d’Isaac, sans préciser la motivation du rire.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: Il se dit en son cœur
  rationale: Cette formulation garde l’image hébraïque du cœur tout en indiquant clairement qu’il s’agit de paroles intérieures.
- source_word: הַלְּבֶן
  choice: Un fils naîtra-t-il
  rationale: Le nom בֵּן signifie normalement « fils ». Le conserver respecte la formulation sexuée explicite de l’hébreu et le contexte de la promesse d’Isaac.
- source_word: יִוָּלֵד
  choice: naîtra-t-il
  rationale: Le niphal de ילד exprime normalement le fait de naître; le futur interrogatif français rend bien la question rhétorique.
- source_word: מֵאָה שָׁנָה
  choice: à un homme de cent ans
  rationale: L’hébreu dit littéralement « à celui qui a cent ans »; « un homme de cent ans » explicite naturellement le référent masculin suggéré par לְבֶן sans attribuer directement cet âge à Abraham dans la grammaire de la question.
- source_word: וְאִם שָׂרָה
  choice: Et Sara… donnera-t-elle
  rationale: Dans cette paire de questions rhétoriques, וְאִם introduit le second membre; « et » restitue naturellement la coordination.
- source_word: הֲבַת תִּשְׁעִים שָׁנָה
  choice: âgée de quatre-vingt-dix ans
  rationale: L’expression littérale « fille de quatre-vingt-dix ans » est un idiome d’âge; la formulation française en transmet exactement le sens.
- source_word: תֵּלֵד
  choice: donnera-t-elle naissance à un enfant
  rationale: Le qal de ילד avec Sara pour sujet signifie enfanter. Le complément « à un enfant » rend l’expression complète et idiomatique en français sans présumer ici le sexe de l’enfant.
theological_decisions:
- issue: Nuance du rire d’Abraham
  choice: Employer simplement « rit »
  alternative: « rit d’incrédulité » ou « rit de joie »
  rationale: Le texte rapporte le rire et les questions intérieures d’Abraham, mais n’en qualifie pas explicitement la valeur morale ou émotionnelle. La traduction préserve donc cette tension.
- issue: Valeur des questions rhétoriques
  choice: Conserver la forme interrogative avec le futur
  alternative: Les reformuler comme des affirmations d’impossibilité
  rationale: L’hébreu pose deux questions et laisse leur nuance précise au contexte. Les convertir en affirmations trancherait indûment le degré d’étonnement ou d’incrédulité.
translation_notes:
  register: Français international moderne, digne et accessible. « Face contre terre » est plus idiomatique que le calque « sur son visage »; « en son cœur » conserve volontairement l’image biblique tout en restant intelligible. Le rythme en deux questions parallèles est maintenu.
