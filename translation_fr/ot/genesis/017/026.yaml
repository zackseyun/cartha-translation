lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Ce jour-là même
  rationale: 'Cette tournure française naturelle conserve l’insistance temporelle de l’expression hébraïque : il s’agit précisément de ce jour-là.'
- source_word: נִמּוֹל
  choice: furent circoncis
  rationale: Le verbe hébreu est passif et morphologiquement au singulier avant un sujet composé. Le français exige ici le pluriel, tout en conservant la valeur passive.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וְיִשְׁמָעֵאל
  choice: et Ismaël
  rationale: La conjonction est rendue directement, avec la forme française traditionnelle du nom propre.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le nom muni du suffixe masculin singulier présente Ismaël comme le fils d’Abraham ; « son fils » rend naturellement cette relation.
