source:
  edition: WLC
  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: fr
  text: Mais j’établirai mon alliance avec Isaac[a], que Sara mettra au monde pour toi à cette même époque, l’année prochaine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et j’établirai mon alliance avec Isaac. » La conjonction hébraïque peut se traduire simplement par « et », mais le contexte favorise un contraste avec la promesse faite au sujet d’Ismaël au verset précédent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mais
  rationale: Le waw peut se traduire simplement par « et », mais le contexte marque ici un contraste avec la bénédiction annoncée pour Ismaël au verset précédent.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: Traduction usuelle de בְּרִית dans le contexte des engagements divins de la Genèse; le suffixe de première personne est rendu par « mon ».
- source_word: אָקִים
  choice: j’établirai
  rationale: Le hiphil de קום exprime ici l’action de rendre ferme ou d’établir; « établir une alliance » est naturel et conserve la portée formelle du terme.
- source_word: אֶת יִצְחָק
  choice: avec Isaac
  rationale: Bien que אֶת soit le marqueur de l’objet direct, le français construit naturellement « établir une alliance » avec la préposition « avec » pour désigner le partenaire de l’alliance.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: que Sara te donnera
  rationale: Dans ce contexte de naissance, « te donnera » exprime naturellement en français la relation indiquée par לְךָ, tout en identifiant Isaac comme le fils que Sara mettra au monde.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: à cette même époque, l’année prochaine
  rationale: מוֹעֵד désigne un temps fixé ou déterminé. L’ensemble de l’expression indique le moment correspondant de l’année suivante; cette formulation est précise et idiomatique en français.
theological_decisions:
- issue: La lignée de l’alliance passe par Isaac plutôt que par Ismaël
  choice: Le verset affirme que Dieu établira son alliance avec Isaac.
  alternative: Comprendre que la bénédiction d’Ismaël au verset précédent lui confère le même rôle dans l’alliance.
  rationale: Le contraste contextuel distingue la bénédiction accordée à Ismaël de l’établissement de l’alliance avec Isaac, sans tirer de conclusions théologiques dépassant le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « À cette même époque, l’année prochaine » évite une formulation excessivement technique tout en conservant l’idée d’un moment déterminé.
