id: GEN.17.11
reference: Genesis 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: fr
  text: Vous circoncirez la chair de votre prépuce, et ce sera un signe de l’alliance entre moi et vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: Vous circoncirez
  rationale: Le qal avec waw prend ici, dans l’instruction relative à l’alliance, une valeur directive tournée vers l’avenir. Le futur français conserve à la fois la forme solennelle et la force du commandement.
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: la chair de votre prépuce
  rationale: בָּשָׂר signifie concrètement « chair », et עָרְלָה désigne ici le prépuce. Le singulier français à valeur collective suit la formulation hébraïque tout en restant compréhensible dans cette adresse au groupe.
- source_word: וְהָיָה
  choice: et ce sera
  rationale: Le pronom démonstratif « ce » reprend naturellement en français la circoncision qui vient d’être prescrite, sans ajouter d’interprétation.
- source_word: לְאוֹת
  choice: un signe
  rationale: אוֹת désigne couramment un signe ou une marque. « Un signe » est le terme français le plus transparent dans le contexte de l’alliance.
- source_word: בְּרִית
  choice: l’alliance
  rationale: Le contexte renvoie à l’alliance précise que Dieu établit avec Abraham ; l’article défini est donc naturel en français.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: entre moi et vous
  rationale: La traduction rend directement les deux parties exprimées par l’hébreu et conserve la portée plurielle possible de « vous » sans explicitation supplémentaire.
theological_decisions:
- issue: Nature de la circoncision comme signe de l’alliance
  choice: un signe de l’alliance
  alternative: une marque de l’alliance
  rationale: La formulation maintient la portée théologique de אוֹת בְּרִית sans préciser si le signe est sacramentel, purement symbolique ou autre, puisque le verset ne tranche pas cette question.
translation_notes:
  register: 'Français moderne, digne et direct. Le futur « vous circoncirez » convient au registre prescriptif de l’alliance. La formulation anatomique reste littérale sans devenir technique. Aucune note n’est retenue : « signe » rend adéquatement אוֹת, et la note anglaise fournie semble rattachée par erreur à « foreskin » alors qu’elle concerne « sign/token ».'
