  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: fr
  text: Et tous les hommes de sa maisonnée, ceux qui étaient nés dans sa maison et ceux qui avaient été achetés avec de l’argent à un étranger[a], furent circoncis avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils d’un étranger », expression qui désigne ici un étranger ou une personne extérieure au groupe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אַנְשֵׁי בֵיתוֹ
  choice: Et tous les hommes de sa maisonnée
  rationale: La conjonction rattache le verset au récit précédent, כָּל exprime la totalité, et « maisonnée » rend ici le sens collectif de בַּיִת. « Hommes » traduit explicitement אַנְשֵׁי dans le contexte de la circoncision.
- source_word: יְלִיד בָּיִת
  choice: ceux qui étaient nés dans sa maison
  rationale: L’expression désigne les personnes nées au sein de la maison au sens domestique et social. Cette formulation reste claire en français moderne.
- source_word: וּמִקְנַת כֶּסֶף
  choice: et ceux qui avaient été achetés
  rationale: Le syntagme désigne des personnes acquises par paiement. « Achetés » conserve sans l’atténuer la dimension transactionnelle du texte; la notion d’argent est déjà inhérente au verbe français dans ce contexte.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: à un étranger[a]
  rationale: מֵאֵת indique ici la personne auprès de laquelle l’achat a été fait. בֶּן נֵכָר est littéralement « fils d’un étranger/de l’étranger », mais fonctionne comme une désignation idiomatique d’un étranger ou d’une personne extérieure au groupe.
- source_word: נִמֹּלוּ
  choice: furent circoncis
  rationale: Le nifal est rendu naturellement au passif et s’accorde avec la narration de l’acte accompli sur toute la maisonnée.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: La locution exprime l’association avec Abraham, dans le même épisode de circoncision, sans préciser davantage si elle vise strictement la simultanéité.
