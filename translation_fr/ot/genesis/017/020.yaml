base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: fr
  text: 'Quant à Ismaël, je t’ai entendu. Oui, je l’ai béni : je le rendrai fécond et je multiplierai très abondamment sa descendance. Il engendrera douze princes, et je ferai de lui une grande nation.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל
  choice: Quant à Ismaël
  rationale: 'La construction avec לְ marque ici le changement de thème : Dieu répond maintenant à la demande d’Abraham concernant Ismaël.'
- source_word: הִנֵּה
  choice: Oui
  rationale: Dans ce contexte, la particule attire l’attention et souligne l’assurance de la promesse. « Oui » restitue naturellement cette force en français moderne sans lourdeur archaïque.
- source_word: בִּמְאֹד מְאֹד
  choice: à l’extrême
  rationale: La répétition intensive exprime un degré exceptionnel. Cette tournure conserve l’emphase tout en restant idiomatique.
- source_word: נְשִׂיאִם
  choice: princes
  rationale: Le terme désigne des chefs ou dirigeants de groupes tribaux. « Princes » convient au contexte des douze descendants d’Ismaël et préserve la formulation traditionnelle sans impliquer nécessairement une monarchie.
- source_word: וּנְתַתִּיו לְגוֹי גָּדוֹל
  choice: je ferai de lui une grande nation
  rationale: La tournure française exprime naturellement l’effet du verbe hébreu « donner/établir » dans cette construction.
theological_decisions:
- issue: Portée de « je t’ai entendu »
  choice: je t’ai entendu
  alternative: j’ai exaucé ta demande
  rationale: Le texte dit littéralement que Dieu a entendu Abraham. La traduction conserve cette formulation et n’explicite pas davantage la nature de l’exaucement.
- issue: Référent de la multiplication
  choice: je multiplierai sa descendance
  alternative: je le multiplierai
  rationale: En français, « multiplier quelqu’un » est peu naturel. La descendance est l’objet implicite de la promesse de fécondité et de multiplication, mais la formulation évite d’ajouter une précision doctrinale étrangère au contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme de la série de promesses est conservé, avec des futurs simples et sans archaïsmes comme « voici » ou « à l’extrême extrême ».
