  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: fr
  text: Abraham avait quatre-vingt-dix-neuf ans lorsque la chair de son prépuce fut circoncise.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: Le waw assure ici la continuité narrative; en français, il peut rester implicite dans ce verset sans perte de sens ni rupture de style.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: avait quatre-vingt-dix-neuf ans
  rationale: Cette tournure française idiomatique restitue exactement l’expression hébraïque d’âge, littéralement « fils de quatre-vingt-dix-neuf ans ».
- source_word: בְּ/הִמֹּל/וֹ
  choice: lorsque … fut circoncise
  rationale: La préposition ב avec l’infinitif construit et son suffixe exprime une circonstance temporelle. Le passif conserve la forme du texte, dont le sujet grammatical est « la chair de son prépuce ».
- source_word: בְּשַׂר
  choice: la chair
  rationale: Le terme concret est conservé afin de respecter la formulation corporelle explicite de l’hébreu.
- source_word: עָרְלָת/וֹ
  choice: de son prépuce
  rationale: Cette formulation rend directement la chaîne construite בשר ערלתו, sans la simplifier en « il fut circoncis ».
