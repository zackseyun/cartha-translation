language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: fr
  text: 'Abram était âgé de quatre-vingt-dix-neuf ans lorsque Yahweh lui apparut et lui dit : « Je suis le Dieu Tout-Puissant[a]. Marche devant moi et sois intègre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : El Shaddaï. La nuance exacte de Shaddaï est discutée ; ce titre est aussi traditionnellement translittéré plutôt que traduit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Quand ... eut
  rationale: La construction narrative introduit ici le cadre temporel. « Quand Abram eut… » est naturel en français moderne et évite le calque archaïque « il arriva que ».
- source_word: בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: quatre-vingt-dix-neuf ans
  rationale: Il s’agit de la tournure hébraïque normale pour indiquer l’âge; le français exprime celui-ci avec le verbe avoir.
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Dans ce contexte narratif, le niphal de ראה avec Yahweh pour sujet signifie naturellement qu’il apparut à Abram.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: אֵל שַׁדַּי
  choice: le Dieu Tout-Puissant
  rationale: Cette formulation française claire rend le titre divin, tout en signalant en note la forme hébraïque et l’incertitude entourant la nuance exacte de שַׁדַּי.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: Marche devant moi
  rationale: Cette traduction conserve la métaphore hébraïque de la marche comme conduite de vie et son registre d’alliance.
- source_word: וֶהְיֵה תָמִים
  choice: et sois intègre
  rationale: תָמִים exprime ici l’intégrité, l’entier dévouement ou le caractère irréprochable, sans imposer l’idée d’une perfection absolue. « Intègre » garde la force morale et la notion de totalité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de le remplacer par le titre « le SEIGNEUR ».
- issue: Traduction de אֵל שַׁדַּי
  choice: le Dieu Tout-Puissant
  alternative: El Shaddaï
  rationale: Le texte principal traduit le titre de manière intelligible, tandis que la note conserve la forme traditionnelle et reconnaît que la nuance exacte de Shaddaï reste discutée.
- issue: Portée de תָמִים
  choice: intègre
  alternative: irréprochable; entier; parfait
  rationale: « Intègre » maintient l’exigence éthique et l’idée de totalité sans résoudre le terme en perfection absolue ou en absence totale de péché.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique soutenu sans être archaïque. La métaphore « Marche devant moi » est conservée, et « sois intègre » reste accessible tout en respectant l’étendue sémantique de תָמִים.
