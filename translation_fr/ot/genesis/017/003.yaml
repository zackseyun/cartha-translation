  text: וַ/יִּפֹּ֥ל אַבְרָ֖ם עַל פָּנָ֑י/ו וַ/יְדַבֵּ֥ר אִתּ֛/וֹ אֱלֹהִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: fr
  text: 'Alors Abram tomba face contre terre, et Dieu parla avec lui en ces termes :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: tomba
  rationale: Le qal wayyiqtol de נפל présente une action passée dans la séquence narrative. « Tomba » conserve le sens lexical sans expliciter davantage la prosternation, déjà exprimée par la suite.
- source_word: עַל פָּנָיו
  choice: face contre terre
  rationale: Cette expression idiomatique décrit une posture de prosternation. « Face contre terre » est naturel en français moderne et conserve l’image corporelle.
- source_word: אַבְרָם
  choice: Abram
  rationale: Le nom est conservé sous sa forme traditionnelle française, puisqu’il n’est changé en Abraham que plus loin dans le récit.
- source_word: וַיְדַבֵּר
  choice: parla
  rationale: Le piel wayyiqtol de דבר signifie couramment « parler ». Ce choix distingue le verbe de parole de la formule introductive לֵאמֹר.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: La préposition אֵת avec suffixe signifie ici « avec lui ». Cette formulation, naturelle en français, préserve la nuance relationnelle du texte hébreu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu unique et s’inscrit dans une syntaxe au singulier.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: L’infinitif construit de אמר introduit les paroles directes qui suivent. « En ces termes » restitue cette fonction sans employer le calque peu naturel « disant ».
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif marque ici la progression du récit. « Alors » rend clairement cette succession en français moderne.
theological_decisions:
- issue: Référent et nombre de אֱלֹהִים
  choice: Dieu au singulier
  alternative: des dieux
  rationale: Le contexte désigne le Dieu de l’alliance qui s’adresse à Abram, et le verbe est au singulier. Un pluriel serait contraire à la syntaxe et au contexte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « face contre terre » exprime naturellement la prosternation; « parla avec lui » maintient la formulation relationnelle de l’hébreu; les deux-points préparent le discours direct du verset suivant.
