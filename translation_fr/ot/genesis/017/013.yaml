  text: הִמּ֧וֹל יִמּ֛וֹל יְלִ֥יד בֵּֽיתְ/ךָ֖ וּ/מִקְנַ֣ת כַּסְפֶּ֑/ךָ וְ/הָיְתָ֧ה בְרִיתִ֛/י בִּ/בְשַׂרְ/כֶ֖ם לִ/בְרִ֥ית עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: fr
  text: Celui qui est né dans ta maison et celui qui a été acheté avec ton argent[b][c] devront absolument être circoncis[a], et mon alliance sera dans votre chair comme alliance perpétuelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront bel et bien circoncis ». L’hébreu emploie un infinitif absolu avec un verbe conjugué pour marquer l’insistance.'
    reason: lexical_alternative
  - marker: b
    text: Les expressions hébraïques « né dans la maison » et « acheté à prix d’argent » désignent des membres de la maisonnée d’Abraham, notamment ceux qui y étaient nés et ceux qui avaient été acquis par achat.
    reason: cultural_note
  - marker: c
    text: 'Autre formulation, plus littérale : « Celui qui est né dans ta maison et celui qui est acheté avec ton argent ».'
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: devront absolument être circoncis
  rationale: La construction associant l’infinitif absolu au verbe conjugué renforce l’idée verbale. « devront absolument » exprime à la fois l’obligation imposée dans le contexte et l’insistance de l’hébreu, dans un français naturel.
- source_word: יְלִיד בֵּיתְךָ
  choice: celui qui est né dans ta maison
  rationale: Littéralement « né de ta maison » ou « né dans la maison ». La formulation conserve la référence personnelle sans ajouter explicitement un statut servile que cette expression, prise isolément, ne nomme pas.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: celui qui a été acheté avec ton argent
  rationale: L’expression désigne une personne acquise par achat. « Argent » rend naturellement le sens économique de כֶּסֶף en français moderne, sans imposer ici le sens matériel « argent métal ».
- source_word: בְרִיתִי
  choice: mon alliance
  rationale: Traduction directe de בְּרִית avec le suffixe de première personne ; le vocabulaire explicite de l’alliance est essentiel dans ce passage.
- source_word: בִּבְשַׂרְכֶם
  choice: dans votre chair
  rationale: La préposition ב est rendue directement par « dans ». Le pluriel « votre » reproduit le passage de l’adresse singulière à Abraham aux personnes concernées collectivement.
- source_word: לִבְרִית עוֹלָם
  choice: une alliance perpétuelle
  rationale: Dans la proposition « mon alliance sera dans votre chair une alliance perpétuelle », l’attribut français exprime naturellement la fonction ou le statut marqué par לִ. « Perpétuelle » conserve la portée temporelle de עוֹלָם sans préciser davantage sa modalité.
theological_decisions:
- issue: Rapport entre le signe corporel et l’alliance
  choice: Conserver l’affirmation directe selon laquelle l’alliance sera dans leur chair, sans expliquer si le signe symbolise l’alliance ou la réalise d’une manière plus forte.
  alternative: Interpréter explicitement la circoncision soit comme un simple symbole de l’appartenance à l’alliance, soit comme une identification sacramentelle du signe et de l’alliance.
  rationale: L’hébreu affirme que « mon alliance sera dans votre chair » et laisse subsister la tension entre signe corporel et réalité de l’alliance. La traduction ne tranche pas cette question par un ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche de l’hébreu tout en évitant une tournure excessivement calquée. Le passage de « ta » à « votre » est maintenu, car il correspond au changement du singulier au pluriel dans le texte source.
