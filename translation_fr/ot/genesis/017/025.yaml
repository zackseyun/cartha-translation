lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל בְּנ/וֹ
  choice: Ismaël, son d’Abraham
  rationale: Le nom propre est rendu selon sa forme française usuelle. Le possessif hébreu renvoie clairement à Abraham dans le contexte immédiat; le nom explicite évite en français une tournure maladroite ou une référence équivoque.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: avait treize ans
  rationale: Expression française naturelle correspondant à la formule hébraïque usuelle indiquant l’âge.
- source_word: בְּ/הִמֹּל/וֹ
  choice: lorsque … fut circoncise
  rationale: La préposition avec l’infinitif construit exprime ici le moment de l’action. Le passif français respecte la forme passive du verbe hébreu.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: la chair de son prépuce
  rationale: Cette formulation conserve l’expression concrète et explicite du texte hébreu plutôt que de la réduire à « lorsqu’il fut circoncis ».
- source_word: וְ
  choice: '[non rendu séparément]'
  rationale: Dans ce verset étroitement lié au précédent, la simple juxtaposition française assure naturellement la continuité narrative sans qu’un « et » initial soit nécessaire.
- source_word: אֵת
  choice: '[non rendu séparément]'
  rationale: La particule hébraïque marque l’objet direct défini et n’a pas d’équivalent lexical autonome en français.
