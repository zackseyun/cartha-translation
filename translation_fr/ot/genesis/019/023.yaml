  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: fr
  text: Le soleil s’était levé sur le pays[a], et Loth était arrivé à Tsoar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la terre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Le soleil se leva sur le pays, et Loth arriva à Tsoar. » Les verbes hébreux à l’accompli peuvent aussi être rendus ici au passé simple.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: le soleil
  rationale: Nom défini avec l’article ; traduction française courante et directe.
- source_word: יָצָא
  choice: s’était levé
  rationale: Le qal accompli de יצא signifie littéralement « était sorti », mais, avec le soleil pour sujet, désigne idiomatiquement son lever. Le plus-que-parfait situe naturellement l’action avant la suite du récit.
- source_word: עַל הָאָרֶץ
  choice: sur le pays
  rationale: עַל signifie ici « sur », et אֶרֶץ peut désigner le pays ou la terre. Dans cette scène locale, « le pays » convient le mieux sans exclure l’autre possibilité, signalée en note.
- source_word: וְלוֹט
  choice: et Loth
  rationale: La conjonction est rendue simplement par « et » ; « Loth » est la forme française traditionnelle et largement reconnue du nom.
- source_word: בָּא
  choice: était arrivé
  rationale: Le qal accompli de בוא exprime la venue ou l’arrivée. « Était arrivé » est naturel en français et indique qu’il avait atteint Tsoar avant les événements suivants.
- source_word: צֹעֲרָה
  choice: à Tsoar
  rationale: Le nom propre porte le hé directionnel, qui marque un mouvement vers ce lieu. « à Tsoar » rend naturellement cette direction en français.
