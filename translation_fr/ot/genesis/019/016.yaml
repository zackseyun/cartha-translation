base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: fr
  text: Mais comme il tardait, les hommes[a] saisirent sa main, celle de sa femme et celles de ses deux filles, par compassion de Yahweh pour lui ; ils le firent sortir et le placèrent hors de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, ces hommes sont les messagers célestes venus auprès de Lot ; l’hébreu dit ici simplement « les hommes ».
    reason: Clarification contextuelle sans remplacer la désignation du texte source.
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: comme il tardait
  rationale: Le verbe exprime le fait de s’attarder ou de différer dans un contexte d’urgence, sans imposer l’idée plus psychologique d’une hésitation intérieure.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le verset emploie le terme ordinaire « hommes ». Cette désignation narrative est conservée, même si le contexte les présente comme des messagers célestes.
- source_word: וַיַּחֲזִקוּ
  choice: saisirent
  rationale: Le verbe indique ici une prise ferme. « Saisirent » rend l’urgence et la vigueur du geste de sauvetage.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: sa main, celle de sa femme et celles de ses deux filles
  rationale: Cette formulation française conserve la triple référence à la main tout en évitant une répétition lourde.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: car Yahweh avait compassion de lui
  rationale: La préposition a ici une valeur causale, et חֶמְלָה désigne la compassion ou la pitié. La formulation explicite naturellement le motif divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le distinguer du titre « Seigneur ».
- source_word: וַיֹּצִאֻהוּ
  choice: ils le firent sortir
  rationale: La forme causative de יצא signifie qu’ils l’amenèrent à sortir; « firent sortir » en conserve directement la valeur.
- source_word: וַיַּנִּחֻהוּ
  choice: le placèrent
  rationale: La forme causative de נוח signifie ici mettre ou déposer quelqu’un en un lieu. « Placèrent » évite la possible idée d’abandon portée par « laissèrent ».
- source_word: מִחוּץ לָעִיר
  choice: hors de la ville
  rationale: L’expression indique un emplacement au-delà des limites de la ville; « hors de la ville » est naturel et précis en français.
theological_decisions:
- issue: Identification narrative des sauveteurs
  choice: les hommes
  alternative: les anges / les messagers
  rationale: Même si le contexte identifie ces personnages comme des messagers célestes, l’hébreu de ce verset les appelle « les hommes ». Le texte principal conserve cette désignation sans résoudre implicitement la tension narrative.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe demeure fluide tout en gardant l’urgence de la scène, la répétition sémantique de « main » et la désignation littérale des sauveteurs.
