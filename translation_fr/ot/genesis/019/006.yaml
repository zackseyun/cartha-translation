  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: fr
  text: Lot sortit vers eux à l’entrée et ferma la porte derrière lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers l’entrée ». L’hébreu distingue l’entrée ou l’ouverture (פֶּתַח) de la porte elle-même (דֶּלֶת).'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le wayyiqtol de יצא fait progresser le récit par une action passée simple. « Sortit » est naturel et conserve le mouvement vers l’extérieur.
- source_word: אֲלֵהֶם
  choice: vers eux
  rationale: La préposition אֶל avec le suffixe de troisième personne du masculin pluriel exprime un mouvement en direction des hommes qui se trouvent dehors.
- source_word: לוֹט
  choice: Lot
  rationale: Forme française traditionnelle et courante de ce nom propre biblique.
- source_word: הַפֶּתְחָה
  choice: à l’entrée
  rationale: פֶּתַח désigne l’ouverture ou l’entrée, tandis que le ה directionnel indique un mouvement vers celle-ci. Cette formulation évite de confondre l’entrée avec la porte matérielle mentionnée ensuite.
- source_word: וְהַדֶּלֶת
  choice: la porte
  rationale: דֶּלֶת désigne ici la porte elle-même, distincte de פֶּתַח, l’entrée ou l’ouverture.
- source_word: סָגַר
  choice: ferma
  rationale: Le passé simple convient au registre narratif français et « fermer la porte » est l’expression idiomatique actuelle.
- source_word: אַחֲרָיו
  choice: derrière lui
  rationale: 'Le sens est spatial : Lot ferme la porte une fois sorti, de sorte qu’elle se trouve derrière lui.'
theological_decisions: []
