  source_fidelity: 'Le sens essentiel est bien rendu : Lot se dirige vers les hommes, sort à l’entrée et ferme la porte derrière lui. Toutefois, « à l’entrée » après « vers eux » est syntaxiquement un peu heurté et rend moins clairement la valeur directionnelle du -ה final de הַפֶּתְחָה.'
