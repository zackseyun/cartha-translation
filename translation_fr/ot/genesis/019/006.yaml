    issue: Ponctuation et articulation de « vers eux, à l’entrée »
    rationale: La virgule isole maladroitement le complément de lieu/direction et peut faire paraître « à l’entrée » apposé plutôt qu’intégré à l’action. La suppression de la virgule améliore la lisibilité sans modifier le sens.
  - severity: low
    issue: Formulation de l’alternative de note
    rationale: « Vers l’entrée » correspond plus directement à la direction exprimée par la terminaison directive de הַפֶּתְחָה que « jusqu’à l’entrée », qui peut suggérer une borne ou un trajet achevé plus fortement que le texte ne l’exige.
