source:
  edition: WLC
  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: fr
  text: « Dépêche-toi, réfugie-toi là-bas, car je ne peux rien faire jusqu’à ce que tu y arrives. » C’est pourquoi la ville fut appelée[a] Tsoar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il appela le nom de la ville » ; le sujet de « il appela » n’est pas précisé.'
    reason: lexical_alternative
  - marker: b
    text: Tsoar évoque en hébreu ce qui est « petit » ou « insignifiant » ; voir Genèse 19.20.
    reason: cross_reference
lexical_decisions:
- source_word: מַהֵר
  choice: Dépêche-toi
  rationale: L’impératif exprime une urgence immédiate. Cette formulation est naturelle en français moderne et en conserve toute la force.
- source_word: הִמָּלֵט
  choice: réfugie-toi
  rationale: Le nifal de מלט signifie se sauver, s’échapper ou gagner un lieu sûr. Dans ce contexte, où Loth doit atteindre la petite ville désignée, « réfugie-toi » exprime naturellement la fuite vers un abri sans ajouter d’explication théologique.
- source_word: שָׁמָּה
  choice: là-bas / y
  rationale: L’adverbe directionnel désigne le lieu vers lequel Loth doit aller. « Là-bas » convient après « réfugie-toi », puis le pronom « y » évite une répétition pesante.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’ordre et maintient un registre narratif digne mais accessible.
- source_word: לֹא אוּכַל
  choice: je ne peux
  rationale: La forme exprime directement l’incapacité. Le présent français restitue la contrainte immédiate sans l’atténuer en obligation ou en interdiction.
- source_word: לַעֲשׂוֹת דָּבָר
  choice: rien faire
  rationale: Littéralement « faire une chose » sous la négation ; « ne rien faire » est l’équivalent idiomatique français et conserve la portée générale de l’expression.
- source_word: עַד בֹּאֲךָ
  choice: jusqu’à ce que tu y sois arrivé
  rationale: Cette tournure rend l’idée de la limite temporelle fixée par l’arrivée de Loth. Le passé du subjonctif composé présente naturellement l’arrivée comme devant être accomplie avant l’action annoncée.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Formule causale naturelle en français pour introduire l’explication du nom du lieu.
- source_word: קָרָא שֵׁם הָעִיר
  choice: la ville fut appelée
  rationale: L’hébreu dit littéralement « il appela le nom de la ville ». Le passif français est plus naturel et évite d’identifier le sujet masculin singulier, que le texte ne nomme pas explicitement dans cette proposition.
- source_word: צֹעַר
  choice: Tsoar
  rationale: Translittération française usuelle du nom propre hébreu, qui permet aussi de signaler en note son jeu sonore avec le terme signifiant « petit ».
theological_decisions:
- issue: Déclaration d’incapacité dans le contexte du jugement
  choice: « je ne peux rien faire »
  alternative: « je ne dois rien faire » ou « je ne peux pas faire cela »
  rationale: לֹא אוּכַל affirme littéralement une incapacité et דָּבָר reste général. La traduction conserve donc la tension narrative et théologique sans expliquer s’il s’agit d’une limitation angélique, d’un décret divin ou d’une autre contrainte.
- issue: Sujet non exprimé de קָרָא
  choice: 'Tournure passive : « la ville fut appelée »'
  alternative: 'Tournure littérale : « il appela le nom de la ville »'
  rationale: Le verbe est au masculin singulier, mais son sujet n’est pas explicitement identifié ici. Le passif préserve cette indétermination au lieu d’attribuer arbitrairement l’acte de nommer à un personnage précis.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs gardent l’urgence du discours direct ; le passif final est naturel en français tout en laissant indéterminé l’auteur de la dénomination.
