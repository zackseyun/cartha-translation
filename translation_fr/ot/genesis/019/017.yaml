base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: fr
  text: 'Lorsqu’ils les eurent fait sortir, il dit : « Sauve-toi, il y va de ta vie ! Ne regarde pas derrière toi et ne t’arrête nulle part dans la plaine. Sauve-toi vers la montagne[a], de peur d’être emporté[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers la région montagneuse » ou « vers les collines ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de peur d’être détruit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: dehors
  rationale: L’adverbe directionnel indique le mouvement hors de la ville ; dans la construction « faire sortir », le français exprime naturellement cette idée sans calquer la forme hébraïque.
- source_word: הִמָּלֵט
  choice: Sauve-toi
  rationale: L’impératif niphal exprime ici une fuite urgente en vue d’échapper au danger. « Sauve-toi » est naturel en français et permet de conserver la répétition du commandement.
- source_word: עַל נַפְשֶׁךָ
  choice: il y va de ta vie
  rationale: Cette tournure idiomatique rend l’enjeu vital de l’expression hébraïque avec force et clarté, sans réduire נֶפֶשׁ à une notion abstraite d’âme.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: Ne regarde pas derrière toi
  rationale: La formulation reste proche de l’image spatiale de l’hébreu tout en étant parfaitement naturelle en français ; « Ne regarde pas en arrière » serait également possible.
- source_word: וְאַל תַּעֲמֹד
  choice: et ne t’arrête
  rationale: Dans ce contexte de fuite, עמד signifie s’immobiliser ou rester sur place plutôt que simplement se tenir debout.
- source_word: בְּכָל הַכִּכָּר
  choice: nulle part dans la plaine
  rationale: כִּכָּר désigne ici la région plane du Jourdain ; la tournure négative distributive « nulle part » rend idiomatiquement בְּכָל après l’interdiction.
- source_word: הָהָרָה
  choice: vers la montagne
  rationale: La forme directionnelle de הַר est singulière et peut désigner une montagne ou, collectivement, la région montagneuse. Le texte principal conserve le singulier et une note signale l’autre portée possible.
- source_word: פֶּן תִּסָּפֶה
  choice: de peur d’être emporté
  rationale: Le niphal de ספה peut évoquer le fait d’être entraîné dans une destruction collective. « Emporté » préserve cette nuance, tandis que la note indique le sens plus général.
theological_decisions:
- issue: Identification de celui qui parle
  choice: « il dit »
  alternative: « ils dirent » par accord de sens avec les messagers, ou « l’ange dit » en explicitant son identité
  rationale: Le verbe hébreu est au singulier. La traduction conserve ce détail grammatical sans préciser davantage l’identité du locuteur, que le verset ne résout pas explicitement.
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs brefs maintiennent l’urgence du récit ; le tutoiement correspond aux formes hébraïques singulières. La répétition de « Sauve-toi » est volontairement conservée.
