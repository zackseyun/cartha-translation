  text: וְ/הַ/צְּעִירָ֤ה גַם הִוא֙ יָ֣לְדָה בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי עַמּ֖וֹן עַד הַ/יּֽוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: fr
  text: La plus jeune, elle aussi, mit au monde un fils et l’appela Ben-Ammi[a]. Il est l’ancêtre des Ammonites[b] jusqu’à ce jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ben-Ammi signifie probablement « fils de mon peuple » ou « fils de l’un des miens ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils d’Ammon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: La plus jeune
  rationale: L’adjectif défini est employé comme substantif et renvoie, dans le contexte, à la fille cadette de Loth. Cette formulation est concise et naturelle.
- source_word: גַם הִוא
  choice: elle aussi
  rationale: 'La tournure conserve l’insistance de l’hébreu : la fille cadette enfanta, comme l’aînée.'
- source_word: יָלְדָה בֵּן
  choice: mit au monde un fils
  rationale: Expression française courante et digne correspondant naturellement à la formule narrative hébraïque.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: l’appela
  rationale: Rend idiomatiquement la formule hébraïque « elle appela son nom », sans lourdeur en français moderne.
- source_word: בֶּן עַמִּי
  choice: Ben-Ammi
  rationale: Le nom propre est translittéré; son sens narrativement significatif est indiqué en note.
- source_word: הוּא אֲבִי
  choice: C’est l’ancêtre
  rationale: Dans ce cadre généalogique, « père » désigne le fondateur ou ancêtre d’un peuple; « ancêtre » exprime clairement ce sens en français.
- source_word: בְנֵי עַמּוֹן
  choice: des Ammonites
  rationale: Équivalent français naturel du gentilé hébreu, littéralement « fils d’Ammon »; la forme littérale est conservée en note.
- source_word: עַד הַיּוֹם
  choice: jusqu’à aujourd’hui
  rationale: Formule narrative française usuelle qui marque la continuité jusqu’à l’époque du narrateur.
