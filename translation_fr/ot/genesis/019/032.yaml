  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: fr
  text: Viens, faisons boire du vin à notre père et couchons avec lui, afin de préserver une descendance issue de notre père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une semence venant de notre père ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: Viens
  rationale: Cette forme de הלך sert ici d’interjection exhortative. « Viens » rend naturellement l’appel à agir adressé par l’aînée à sa sœur.
- source_word: נַשְׁקֶה אֶת־אָבִינוּ יַיִן
  choice: faisons boire du vin à notre père
  rationale: 'Le hiphil de שקה a un sens causatif : il s’agit de faire boire le père, et non simplement de boire avec lui.'
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: et couchons avec lui
  rationale: שכב avec עם est ici un euphémisme sexuel. « Coucher avec » est clair en français moderne tout en conservant la retenue de l’hébreu.
- source_word: וּנְחַיֶּה
  choice: afin de préserver
  rationale: Le piel cohortatif de חיה exprime l’idée de maintenir en vie ou de préserver. Avec זרע, il vise la continuation d’une lignée.
- source_word: מֵאָבִינוּ זָרַע
  choice: une descendance issue de notre père
  rationale: זרע désigne ici la progéniture, tandis que מן marque son origine. Cette formulation française exprime clairement les deux éléments sans rendre la phrase artificiellement littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La coordination des deux cohortatifs est rendue sans répéter « faisons », ce qui reste naturel tout en conservant l’exhortation collective. Le caractère sexuel de l’expression est préservé sans explicitation supplémentaire.
