    issue: Nuance additive de עוֹד
    rationale: « Qui as-tu encore ici ? » peut se comprendre comme « qui as-tu toujours ici ? ». « Qui d'autre as-tu ici ? » rend plus directement la question portant sur d'autres personnes liées à Lot.
  - severity: medium
    issue: Restriction de כֹּל אֲשֶׁר לְךָ à des personnes
    rationale: « Tous ceux qui sont à toi » limite le référent à des humains. L'hébreu dit littéralement « tout ce qui est à toi »; le contexte rend une référence aux proches probable, mais le texte principal devrait conserver cette ouverture.
