  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: fr
  text: 'Alors les hommes dirent à Lot : « Qui d''autre as-tu ici ? Un gendre[a], tes fils, tes filles, et tout ce qui t''appartient dans la ville : fais-les sortir de cet endroit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un futur gendre » ou « un fiancé ». Le terme hébreu peut désigner un homme lié à une famille par mariage; dans ce contexte, « gendre » est le sens le plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le nom hébreu désigne ici littéralement des hommes. Même si le contexte narratif les identifie comme des anges, cette identification n’est pas introduite dans le texte principal.
- source_word: עֹד מִי לְךָ פֹה
  choice: Qui as-tu encore ici ?
  rationale: Cette formulation française naturelle conserve à la fois l’idée de personnes liées à Lot et la nuance de « encore / d’autre » portée par עֹד.
- source_word: חָתָן
  choice: un gendre
  rationale: Dans ce contexte familial, le mot désigne très probablement un gendre, qu’il s’agisse d’un mari ou d’un futur mari d’une fille de Lot. Le singulier hébreu est maintenu sans exclure un emploi catégoriel.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: tes fils, tes filles
  rationale: Traduction directe des pluriels possessifs hébreux.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: tous ceux qui sont à toi dans la ville
  rationale: La tournure garde la portée relationnelle et légèrement ouverte de l’hébreu, tandis que le contexte montre qu’il s’agit des personnes rattachées à Lot.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: fais-les sortir de cet endroit
  rationale: L’impératif masculin singulier s’adresse à Lot. Le pronom « les » reprend naturellement les personnes énumérées ; « cet endroit » rend idiomatiquement le lieu défini par le contexte.
theological_decisions:
- issue: Identification des hommes comme des anges
  choice: Conserver « les hommes »
  alternative: les anges / les messagers
  rationale: Le contexte permet l’identification angélique, mais le verset emploie le terme hébreu ordinaire signifiant « hommes ». La traduction préserve cette formulation narrative sans explicitation théologique.
- issue: Statut des gendres de Lot
  choice: Employer le terme relationnel neutre « un gendre »
  alternative: un fiancé / un futur gendre
  rationale: חָתָן peut désigner un gendre ou un époux lié par mariage, et le récit laisse discuter si le mariage était déjà consommé. « Gendre » conserve mieux cette tension que « fiancé ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe interrogative suivie de l’énumération reproduit la structure abrupte et urgente de l’hébreu sans devenir artificielle.
