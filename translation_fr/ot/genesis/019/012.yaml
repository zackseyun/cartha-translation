  rationale: La révision remplace « encore » par « d'autre » afin de rendre la valeur de עוֹד sans ambiguïté, et remplace « tous ceux qui sont à toi » par « tout ce qui t'appartient » pour préserver la portée grammaticalement ouverte de כֹּל אֲשֶׁר לְךָ. Une note à l'ancre « gendre » signale sobrement l'alternative lexicale sans imposer une lecture du statut matrimonial.
