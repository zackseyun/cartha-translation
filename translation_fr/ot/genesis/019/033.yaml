  text: וַ/תַּשְׁקֶ֧יןָ אֶת אֲבִי/הֶ֛ן יַ֖יִן בַּ/לַּ֣יְלָה ה֑וּא וַ/תָּבֹ֤א הַ/בְּכִירָה֙ וַ/תִּשְׁכַּ֣ב אֶת אָבִ֔י/הָ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קׄוּמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: fr
  text: Elles firent boire du vin à leur père cette nuit-là, et l’aînée entra et coucha avec son père. Il ne se rendit compte ni du moment où elle se coucha ni du moment où elle se leva.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Il ne sut rien dans son coucher ni dans son lever. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: Elles firent donc boire du vin
  rationale: Le hifil de שׁקה exprime l’action de faire boire ou de donner à boire. Cette tournure française conserve clairement le causatif et le sujet féminin pluriel.
- source_word: יַיִן
  choice: du vin
  rationale: Équivalent français courant et direct de יַיִן dans ce contexte.
- source_word: בַּלַּיְלָה הוּא
  choice: cette nuit-là
  rationale: Expression temporelle naturelle en français, qui maintient la référence définie du texte hébreu.
- source_word: הַבְּכִירָה
  choice: l’aînée
  rationale: Le terme désigne ici la fille première-née. « L’aînée » est idiomatique en français et conserve l’accent sur l’ordre de naissance sans ajouter le nom « fille ».
- source_word: וַתָּבֹא
  choice: entra
  rationale: Le verbe בוא signifie venir ou entrer selon le point de vue. Dans cette scène, « entra » rend naturellement le déplacement vers l’endroit où se trouve le père.
- source_word: וַתִּשְׁכַּב אֶת
  choice: coucha avec
  rationale: Cette construction est un euphémisme sexuel. « Coucher avec » en restitue le sens en français actuel sans crudité supplémentaire.
- source_word: וְלֹא יָדַע
  choice: Il ne se rendit compte
  rationale: ידע exprime ici la conscience ou la perception. « Ne se rendit compte » communique ce sens plus naturellement que le calque « ne sut pas ».
- source_word: בְּשִׁכְבָהּ
  choice: du moment où elle se coucha
  rationale: L’infinitif construit précédé de ב marque la circonstance temporelle. La traduction n’ajoute pas « avec lui », absent de cette proposition.
- source_word: וּבְקוּמָהּ
  choice: du moment où elle se leva
  rationale: Rend la construction temporelle parallèle et conserve l’équilibre avec la proposition précédente.
