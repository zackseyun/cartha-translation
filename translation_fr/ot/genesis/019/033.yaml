  to: Elles firent boire du vin à leur père cette nuit-là, et l’aînée entra et coucha avec son père. Il ne se rendit compte ni du moment où elle se coucha ni du moment où elle se leva.[a]
  rationale: La révision retire l’inférence ajoutée par « donc » et corrige la note afin qu’elle présente véritablement la construction plus littérale de l’hébreu. Le texte principal, naturel en français moderne, conserve l’interprétation temporelle contextuelle sans ajouter « avec lui » dans la dernière proposition.
