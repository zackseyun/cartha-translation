  text: וַ/תַּבֵּ֥ט אִשְׁתּ֖/וֹ מֵ/אַחֲרָ֑י/ו וַ/תְּהִ֖י נְצִ֥יב מֶֽלַח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: fr
  text: Mais sa femme, derrière lui, regarda en arrière[a], et elle devint une colonne de sel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit plus littéralement : « regarda de derrière lui »; l’expression peut indiquer sa position derrière son mari ou la direction de son regard.'
    reason: ambiguïté lexicale et syntaxique
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: regarda en arrière
  rationale: Le verbe signifie « regarder, porter le regard ». Dans ce contexte, « regarda en arrière » exprime naturellement le mouvement du regard sans préciser son intention.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Le nom muni du suffixe masculin singulier signifie directement « sa femme » et renvoie, dans le contexte, à la femme de Loth.
- source_word: מֵאַחֲרָיו
  choice: derrière lui
  rationale: L’expression indique littéralement une position ou un regard « de derrière lui ». La formulation retenue préserve la position de la femme par rapport à son mari sans surcharger la phrase.
- source_word: וַתְּהִי
  choice: elle devint
  rationale: Dans cette séquence narrative, היה décrit le passage à un nouvel état; « devint » convient mieux qu’un simple « fut ».
- source_word: נְצִיב מֶלַח
  choice: une colonne de sel
  rationale: נְצִיב désigne ici quelque chose de dressé ou établi; « colonne de sel » est une expression française naturelle qui conserve l’affirmation concrète du texte.
theological_decisions:
- issue: Nature de la transformation de la femme de Loth
  choice: « elle devint une colonne de sel »
  alternative: « elle devint comme une colonne de sel » ou « elle resta là telle une colonne de sel »
  rationale: L’hébreu affirme directement qu’elle devint une colonne de sel et ne comporte aucun marqueur de comparaison. La traduction ne transforme donc pas le récit en simile et n’ajoute aucune explication sur le mécanisme de l’événement.
- issue: Rapport entre le regard et la position de la femme
  choice: Distinguer sa position (« derrière lui ») de son action (« regarda en arrière »)
  alternative: 'Comprendre מֵאַחֲרָיו uniquement comme la direction du regard: « regarda derrière lui »'
  rationale: La construction hébraïque peut évoquer sa position derrière son mari tout en décrivant son regard. Le texte principal adopte une formulation française claire, tandis que la note signale la tournure plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, sobre et narratif. « Mais » rend le contraste implicite dans la séquence; la ponctuation isole naturellement l’indication de position. Le vocabulaire traditionnel « colonne de sel » reste immédiatement compréhensible.
