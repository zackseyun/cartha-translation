id: GEN.19.25
reference: Genesis 19:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: fr
  text: Il renversa ces villes[a], toute la plaine[b], tous les habitants des villes et la végétation du sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retourna ». Le verbe hébreu peut souligner un renversement catastrophique.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « la plaine » désigne le district de la plaine du Jourdain.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: Il renversa
  rationale: Le verbe הפך évoque ici un renversement catastrophique. « Renversa » conserve cette image concrète, contrairement à « détruisit », plus général. Le pronom maintient le sujet implicite du texte hébreu.
- source_word: הֶעָרִים הָאֵל
  choice: ces villes
  rationale: Le démonstratif renvoie aux villes précises déjà évoquées; « ces villes » est naturel dans la continuité du récit.
- source_word: כָּל הַכִּכָּר
  choice: toute la plaine
  rationale: Dans ce contexte de la Genèse, כִּכָּר désigne la plaine ou le district du Jourdain. « Toute la plaine » est clair et idiomatique.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: tous les habitants des villes
  rationale: Le participe de ישב désigne ceux qui résident dans les villes; « habitants » est précis, concis et naturel.
- source_word: צֶמַח הָאֲדָמָה
  choice: la végétation du sol
  rationale: צֶמַח désigne ce qui pousse, la végétation, tandis que אֲדָמָה désigne ici le sol ou la terre cultivable. Cette formulation conserve le caractère concret de l'expression.
theological_decisions:
- issue: Sujet implicite du verbe au singulier
  choice: « Il » sans nommer explicitement le sujet
  alternative: « Le Seigneur » ou « Dieu » comme sujet explicite
  rationale: Le verset hébreu emploie un verbe au singulier sans sujet nominal exprimé; le contexte précédent permet d'identifier l'acteur. Le pronom préserve la formulation du verset sans ajouter un nom absent de cette proposition.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe coordonnée reproduit l'accumulation de l'hébreu tout en restant fluide; « végétation du sol » garde la précision concrète du texte source.
