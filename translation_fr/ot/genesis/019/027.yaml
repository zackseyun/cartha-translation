  text: וַ/יַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּ/בֹּ֑קֶר אֶל הַ֨/מָּק֔וֹם אֲשֶׁר עָ֥מַד שָׁ֖ם אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: fr
  text: Abraham se leva de bon matin et se rendit à l’endroit où il s’était tenu devant Yahvé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant la face de Yahvé », expression qui signifie « devant Yahvé » ou « en présence de Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: se leva de bon matin
  rationale: Le hiphil de שׁכם signifie couramment « se lever tôt ». « Se leva de bon matin » exprime naturellement en français l’idée d’un lever matinal, sans inclure à lui seul le déplacement.
- source_word: בַּבֹּקֶר
  choice: de bon matin
  rationale: בֹּקֶר désigne le matin. Avec וַיַּשְׁכֵּם, l’expression souligne que l’action a lieu tôt le matin ; « de bon matin » restitue naturellement cette insistance.
- source_word: אֶל הַמָּקוֹם
  choice: et se rendit à l’endroit
  rationale: La préposition אֶל indique la direction vers le lieu. En français, après « se leva », l’ajout explicite du verbe de déplacement « se rendit » est nécessaire pour exprimer naturellement la construction hébraïque, tandis que « l’endroit » renvoie clairement au lieu déjà mentionné dans le récit.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: où il s’était tenu
  rationale: La proposition relative renvoie à une scène antérieure ; le plus-que-parfait marque ce retour en arrière. שָׁם est naturellement intégré à « où » plutôt que rendu séparément.
- source_word: אֶת־פְּנֵי
  choice: devant
  rationale: Dans la construction עמד אֶת־פְּנֵי, l’expression signifie se tenir devant quelqu’un, en sa présence. « Devant » conserve la forme concise de l’idiome, tandis que la note en précise le sens littéral.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française usuelle du nom divin, « Yahvé », plutôt que par un titre de substitution.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Yahweh ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » préserve le nom propre et correspond à sa forme traditionnelle et intelligible en français moderne, sans le remplacer par un titre.
- issue: Sens de l’expression אֶת־פְּנֵי יְהוָה
  choice: devant Yahvé
  alternative: en présence de Yahvé ; devant la face de Yahvé
  rationale: « Devant Yahvé » garde l’idiome biblique naturel et laisse subsister sa dimension relationnelle et cultuelle, sans surinterpréter la posture d’Abraham.
translation_notes:
  register: Français international moderne, narratif et digne. « De bon matin » évite la lourdeur de « se leva tôt le matin ». La coordination « et se rendit » rend explicite en français le mouvement impliqué par אֶל après le verbe de lever, sans l’attribuer au seul verbe hébreu. Le nom divin est donné sous la forme française « Yahvé ».
