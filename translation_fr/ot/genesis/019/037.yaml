source:
  edition: WLC
  text: וַ/תֵּ֤לֶד הַ/בְּכִירָה֙ בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי מוֹאָ֖ב עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: fr
  text: L’aînée mit au monde un fils et l’appela Moab. Il est l’ancêtre des Moabites jusqu’à aujourd’hui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le père de Moab jusqu’à aujourd’hui ». Le nom de l’ancêtre désigne ici le peuple qui descend de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: mit au monde
  rationale: Le qal de ילד signifie ici « enfanter, mettre au monde ». Cette tournure est naturelle et digne en français moderne.
- source_word: הַבְּכִירָה
  choice: L’aînée
  rationale: Le féminin substantivé désigne la fille première-née, c’est-à-dire l’aînée des deux filles de Loth. « L’aînée » est clair dans le contexte et naturel en français.
- source_word: בֵּן
  choice: un fils
  rationale: Complément direct indéfini du verbe exprimant l’accouchement.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: l’appela
  rationale: Littéralement « elle appela son nom ». En français actuel, « elle l’appela » restitue naturellement la formule de nomination sans lourdeur.
- source_word: מוֹאָב
  choice: Moab
  rationale: Transcription française traditionnelle du nom propre hébreu.
- source_word: הוּא
  choice: Il
  rationale: Le pronom indépendant reprend le fils qui vient d’être nommé.
- source_word: אֲבִי מוֹאָב
  choice: l’ancêtre des Moabites
  rationale: Littéralement « le père de Moab » ; Moab désigne ici le peuple issu de cet ancêtre. « L’ancêtre des Moabites » communique clairement la relation généalogique tout en signalant en note la formulation hébraïque.
- source_word: עַד הַיּוֹם
  choice: jusqu’à aujourd’hui
  rationale: Équivalent idiomatique de la formule hébraïque indiquant que la situation perdure jusqu’au temps du narrateur.
