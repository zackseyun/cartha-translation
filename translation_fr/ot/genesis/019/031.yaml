base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: fr
  text: 'Alors l’aînée dit à la plus jeune : « Notre père est vieux, et il n’y a pas d’homme dans le pays pour s’unir à nous[a], selon l’usage de toute la terre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour venir vers nous ». Dans ce contexte, l’expression est un euphémisme pour des relations sexuelles.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon la voie de toute la terre ». L’expression désigne la pratique ou l’usage humain ordinaire ; le contexte concerne l’union sexuelle et la continuation de la famille.'
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: l’aînée
  rationale: Le terme désigne la première-née ou l’aînée. Dans la paire avec « la plus jeune », « l’aînée » est naturel en français tout en conservant l’ordre de naissance.
- source_word: הַצְּעִירָה
  choice: la plus jeune
  rationale: L’adjectif signifie « plus jeune » ou « plus petite » et forme ici un contraste direct avec l’aînée.
- source_word: אָבִינוּ זָקֵן
  choice: Notre père est vieux
  rationale: Cette formulation directe rend naturellement la proposition nominale hébraïque sans ajouter l’idée d’un processus implicite.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: il n’y a pas d’homme dans le pays
  rationale: « Homme » préserve la référence masculine explicite de אִישׁ, importante dans ce contexte de relations sexuelles et de descendance; « dans le pays » reflète directement בָאָרֶץ.
- source_word: לָבוֹא עָלֵינוּ
  choice: pour s’unir à nous
  rationale: L’expression hébraïque, littéralement « venir sur/vers nous », est un euphémisme sexuel. « S’unir à nous » restitue clairement et dignement le sens contextuel en français moderne; la note conserve l’image littérale.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: comme cela se fait partout sur la terre
  rationale: Cette formulation idiomatique exprime la coutume ou la pratique humaine générale visée par « selon la voie de toute la terre », sans limiter abusivement la portée au seul territoire local.
theological_decisions:
- issue: Portée de « comme cela se fait partout sur la terre »
  choice: Conserver une formulation générale évoquant la pratique humaine ordinaire
  alternative: Préciser dans le texte « selon la coutume du mariage » ou « pour assurer une descendance »
  rationale: Le contexte suggère les relations sexuelles et la continuation de la famille, mais l’hébreu ne mentionne explicitement ni le mariage ni la descendance dans ce verset. La traduction évite donc d’inscrire cette interprétation directement dans le texte.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation privilégie la clarté de l’euphémisme sexuel tout en donnant sa forme littérale en note; elle conserve aussi l’ambiguïté relative de la formule générale sur la pratique de « toute la terre ».
