  - severity: low
    issue: La formulation « comme cela se fait partout sur la terre » est un peu plus paraphrastique que nécessaire.
    rationale: Elle exprime bien le sens, mais « selon l’usage de toute la terre » conserve plus visiblement le vocabulaire de la “voie/manière” et sa portée générale.
