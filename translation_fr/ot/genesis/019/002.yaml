  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: fr
  text: 'Il dit : « Je vous en prie, mes seigneurs[a], entrez dans la maison de votre serviteur, passez-y la nuit et lavez-vous les pieds. Vous vous lèverez de bon matin, puis vous reprendrez votre route. » Mais ils répondirent : « Non, nous passerons plutôt la nuit sur la place[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon seigneur », si אֲדֹנַי est compris comme un singulier honorifique. Dans ce contexte, le pluriel convient mieux puisque Lot s’adresse aux deux visiteurs.
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu désigne un espace public ouvert de la ville, tel qu’une place ou une esplanade.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: Je vous en prie
  rationale: Dans ce contexte, ces mots introduisent une demande courtoise et insistante plutôt qu’un ordre littéral de regarder.
- source_word: אֲדֹנַי
  choice: mes seigneurs
  rationale: Lot s’adresse respectueusement aux deux visiteurs. Le pluriel convient aux verbes et pronoms pluriels qui suivent, sans introduire ici le titre divin « Seigneur ».
- source_word: סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם
  choice: entrez dans la maison de votre serviteur
  rationale: Le verbe invite les voyageurs à quitter leur trajet pour entrer chez Lot. Cette formulation française naturelle conserve aussi la manière humble dont Lot parle de lui-même.
- source_word: וְלִינוּ / נָלִין
  choice: passez-y la nuit / nous passerons… la nuit
  rationale: La répétition du même verbe hébreu est maintenue par la même expression française.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: lavez-vous les pieds
  rationale: La traduction directe conserve la pratique d’hospitalité évoquée dans le texte.
- source_word: וְהִשְׁכַּמְתֶּם
  choice: vous vous lèverez de bon matin
  rationale: L’expression indique qu’ils se lèveront tôt le lendemain, dans la suite de l’invitation de Lot.
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: vous reprendrez votre route
  rationale: Cette expression idiomatique française rend naturellement l’idée de repartir et de poursuivre son chemin.
- source_word: כִּי
  choice: plutôt
  rationale: Après la négation, la particule introduit ici l’option contraire choisie par les visiteurs ; « plutôt » rend cette opposition naturellement en français.
- source_word: בָרְחוֹב
  choice: sur la place
  rationale: Le mot désigne un espace public ouvert de la ville, comme une place, et non nécessairement une simple rue.
theological_decisions:
- issue: אֲדֹנַי désigne-t-il ici un titre divin ou une adresse humaine respectueuse ?
  choice: 'Adresse humaine au pluriel : « mes seigneurs »'
  alternative: « mon seigneur », comme singulier honorifique
  rationale: Lot parle aux deux visiteurs, et les formes verbales et pronominales du verset sont au pluriel. Le texte principal conserve donc l’adresse plurielle, tandis qu’une note signale l’ambiguïté formelle possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste courtois sans archaïsme. La répétition de « passer la nuit » reflète celle du verbe hébreu, et « votre serviteur » conserve la formule d’humilité de Lot.
