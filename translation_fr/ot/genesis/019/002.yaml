  source_fidelity: 'Le texte rend fidèlement l’invitation de Lot : l’adresse respectueuse au pluriel, l’entrée chez « votre serviteur », l’hébergement, le lavage des pieds, le départ matinal et la décision des visiteurs de passer la nuit dans l’espace public. « Plutôt » exprime de manière recevable l’opposition introduite après « Non » par כִּי. La légère explicitation d’« entrez » pour סוּרוּ ... אֶל־בֵּית est naturelle dans ce contexte d’invitation à l’hospitalité et ne modifie pas le sens.'
  naturalness: Le français est moderne, fluide et d’un registre narratif digne sans archaïsme. « Je vous en prie, mes seigneurs » restitue bien la politesse insistante sans reproduire lourdement les deux particules d’insistance hébraïques. « Passez-y la nuit » et « reprendrez votre route » sont idiomatiques.
  terminology: « Mes seigneurs » conserve l’adresse humaine respectueuse sans introduire indûment le titre divin. « Votre serviteur » préserve la formule d’humilité de Lot. « La place » et sa note rendent correctement רְחוֹב comme espace public ouvert plutôt qu’une simple rue.
