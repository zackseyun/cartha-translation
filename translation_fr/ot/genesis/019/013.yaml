language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: fr
  text: Car nous sommes sur le point de détruire ce lieu[a], parce que leur cri est devenu immense devant Yahweh, et Yahweh nous a envoyés pour le détruire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le cri contre eux est devenu immense devant Yahweh ». La forme hébraïque signifie littéralement « leur cri », mais, dans ce contexte, beaucoup comprennent qu’il s’agit du cri élevé contre les habitants de ce lieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: sommes sur le point de détruire
  rationale: Le participe hiphil masculin pluriel peut exprimer une action imminente. Dans cette annonce de jugement, cette formulation française rend clairement l’imminence sans transformer le participe en simple futur.
- source_word: הַמָּקוֹם הַזֶּה
  choice: ce lieu
  rationale: « Ce lieu » rend naturellement le sens déictique de l’expression hébraïque dans un registre digne et courant.
- source_word: גָדְלָה
  choice: est devenu grand
  rationale: Le parfait qal décrit ici un accroissement arrivé à son résultat. La formulation conserve cette valeur résultative et l’image hébraïque.
- source_word: צַעֲקָתָם
  choice: leur cri
  rationale: Le nom désigne un cri de détresse, de plainte ou de protestation, et le suffixe masculin pluriel signifie formellement « leur ». La traduction principale préserve cette ambiguïté, tandis que la note signale le sens contextuel possible de cri élevé contre eux.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: devant Yahweh
  rationale: L’expression idiomatique signifie que le cri est parvenu en présence de Yahweh; « devant » est naturel en français et conserve la portée relationnelle et judiciaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom propre présent dans le texte hébreu.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: nous a envoyés
  rationale: Le passé composé relie naturellement en français l’envoi déjà accompli à la mission que les messagers vont maintenant exécuter.
- source_word: לְשַׁחֲתָהּ
  choice: pour le détruire
  rationale: L’infinitif exprime le but de l’envoi. Le pronom féminin hébreu renvoie vraisemblablement à la ville ou au lieu; en français, « le » reprend naturellement « ce lieu ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Sens de צַעֲקָתָם
  choice: leur cri
  alternative: le cri qui s’élève contre eux
  rationale: La forme hébraïque signifie le plus directement « leur cri », mais le contexte peut désigner le cri de plainte élevé contre les habitants du lieu. Le texte principal conserve la forme et la note maintient l’autre lecture significative.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; l’ambiguïté de « leur cri » est conservée et explicitée en note.
