base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: fr
  text: 'Comme l’aube se levait, les anges pressèrent Lot : « Lève-toi, prends ta femme et tes deux filles qui sont ici, de peur que tu ne sois emporté dans le châtiment[a] de la ville. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la faute de la ville » ou « à cause de la culpabilité de la ville ». Le mot hébreu peut désigner la faute, la culpabilité ou le châtiment qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: Comme l’aube se levait
  rationale: Rend naturellement la valeur temporelle de כְמוֹ et conserve l’image de l’aube qui se lève.
- source_word: וַיָּאִיצוּ
  choice: pressèrent
  rationale: Le verbe exprime une vive insistance visant à faire agir Lot sans délai ; « pressèrent » restitue cette urgence.
- source_word: הַמַּלְאָכִים
  choice: les anges
  rationale: Dans ce contexte, les messagers sont des êtres célestes ; « anges » désigne clairement leur identité narrative.
- source_word: קוּם קַח
  choice: Lève-toi, prends
  rationale: Les deux impératifs sont maintenus séparément, dans un français actuel et énergique.
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת
  choice: ta femme et tes deux filles qui sont ici
  rationale: « Qui sont ici » rend idiomatiquement le participe « trouvées/présentes » et distingue les filles présentes auprès de Lot.
- source_word: פֶּן תִּסָּפֶה
  choice: de peur que tu ne sois emporté
  rationale: La forme passive exprime le risque de périr avec les autres ; « emporté » préserve cette dimension collective.
- source_word: בַּעֲוֺן הָעִיר
  choice: dans le châtiment de la ville
  rationale: Dans ce contexte de jugement imminent, עָוֹן peut désigner la conséquence punitive de la faute. La formulation garde l’idée que Lot risque d’être emporté avec la ville, tandis que les autres valeurs du terme sont signalées en note.
theological_decisions:
- issue: Sens de עָוֹן dans un contexte de jugement
  choice: châtiment de la ville
  alternative: faute de la ville ; culpabilité de la ville
  rationale: Le nom hébreu peut désigner la faute, la culpabilité qu’elle entraîne ou le châtiment qui en résulte. Le contexte immédiat favorise ici la conséquence judiciaire, sans éliminer l’ambiguïté lexicale, conservée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct conserve l’urgence des impératifs. Le marqueur de note est placé sur « châtiment », le terme auquel se rapporte l’alternative lexicale.
