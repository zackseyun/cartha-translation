  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: fr
  text: '« Vois, je te prie : ton serviteur a trouvé grâce à tes yeux, et tu as fait preuve envers moi d’une grande bonté fidèle[a] en me gardant en vie. Mais moi, je ne peux pas fuir vers la montagne, de peur que le malheur[b] ne m’atteigne et que je ne meure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une grande bonté », « d’une grande miséricorde » ou « d’un grand amour fidèle ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le mal » ; ici, le mot désigne la calamité qui menace Lot.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Vois, je te prie
  rationale: « Vois » attire l’attention, tandis que « je te prie » restitue la nuance pressante et déférente de נָא dans un français actuel et digne.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: a trouvé grâce à tes yeux
  rationale: Cette formulation française naturelle conserve l’image de l’expression idiomatique hébraïque et son sens d’accueil favorable.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans cette adresse déférente à un supérieur, le mot fonctionne comme une humble désignation de soi plutôt que comme l’indication précise d’un statut servile.
- source_word: וַתַּגְדֵּל חַסְדְּךָ ... עִמָּדִי
  choice: tu as fait preuve envers moi d’une grande bonté fidèle
  rationale: La tournure exprime naturellement en français l’idée causative d’une bonté rendue grande ou manifestée avec grandeur, tout en conservant la richesse relationnelle de חֶסֶד.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: en me conservant la vie
  rationale: Le syntagme désigne ici le maintien en vie de Lot; cette traduction évite de charger le passage d’un vocabulaire sotériologique absent du contexte immédiat.
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: Mais moi, je ne peux pas
  rationale: « Mais » marque le contraste et « moi » préserve l’emphase portée par אָנֹכִי.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: me réfugier dans la montagne
  rationale: Dans ce contexte de fuite vers un lieu sûr, « se réfugier » rend idiomatiquement le nifal de מלט; « dans la montagne » exprime la destination indiquée par la finale directionnelle.
- source_word: פֶּן תִּדְבָּקַנִי
  choice: risquerait de m’atteindre
  rationale: פֶּן introduit la conséquence redoutée, et דבק signifie ici que le désastre le rattraperait ou l’atteindrait.
- source_word: הָרָעָה
  choice: le malheur
  rationale: Dans le contexte, רָעָה désigne la calamité destructrice qui menace Lot, non le mal moral abstrait.
theological_decisions:
- issue: Traduction de חֶסֶד dans une supplication adressée aux messagers divins
  choice: bonté fidèle
  alternative: bonté; miséricorde; amour fidèle
  rationale: « Bonté fidèle » maintient ensemble la bienveillance concrète et la dimension de loyauté relationnelle du terme sans imposer ici une formule technique d’alliance.
- issue: Référent de la deuxième personne du singulier
  choice: maintien du singulier sans explicitation du destinataire
  alternative: expliciter Dieu ou les messagers
  rationale: L’hébreu emploie le singulier dans une scène impliquant des messagers agissant sous l’autorité divine. La traduction conserve cette tension narrative au lieu de trancher explicitement l’identité du destinataire.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement correspond au singulier hébreu. La ponctuation rend la supplication pressante de Lot, et les notes préservent l’étendue sémantique de חֶסֶד et de רָעָה.
