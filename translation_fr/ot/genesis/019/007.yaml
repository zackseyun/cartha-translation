  text: 'Il dit : « Je vous en prie, mes frères, ne faites pas le mal. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל־נָא
  choice: Je vous en prie, ne… pas
  rationale: La particule נָא renforce ici l’interdiction par une supplication pressante ; cette tournure est naturelle et digne en français.
- source_word: אַחַי
  choice: mes frères
  rationale: Traduction directe de l’expression d’adresse ; elle conserve l’appel conciliant de Lot envers les hommes de la ville sans préciser davantage la nature de la relation.
- source_word: תָּרֵעוּ
  choice: faites le mal
  rationale: Le verbe רעע à cette forme signifie agir mal ou faire le mal. Cette formulation simple préserve la portée morale générale de l’hébreu.
theological_decisions:
- issue: Portée de l’interdiction
  choice: ne faites pas le mal
  alternative: n’agissez pas avec méchanceté
  rationale: La formulation retenue ne réduit pas l’interdiction à une disposition intérieure ni à un acte trop précisément défini ; elle conserve la généralité et la force morale du texte.
translation_notes:
  register: Français moderne, clair et digne. L’ordre des propositions reste proche de l’hébreu, tandis que « Je vous en prie » restitue naturellement la supplication exprimée par נָא.
