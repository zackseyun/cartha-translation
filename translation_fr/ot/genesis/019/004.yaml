  text: טֶרֶם֮ יִשְׁכָּבוּ֒ וְ/אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל הַ/בַּ֔יִת מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן כָּל הָ/עָ֖ם מִ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: fr
  text: 'Ils ne s’étaient pas encore couchés que les hommes de la ville, les hommes de Sodome, encerclèrent la maison : du plus jeune au plus vieux[a], tout le peuple, venu de tous les quartiers[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « du jeune au vieux » : cette expression réunit les deux extrêmes pour désigner tous les âges.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « depuis l’extrémité »; dans ce contexte, l’expression peut désigner toutes les parties ou tous les quartiers de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: Ils ne s’étaient pas encore couchés que
  rationale: 'Cette tournure française rend naturellement la relation temporelle : l’attroupement survient avant que les hôtes soient couchés, tout en conservant le sens concret de שׁכב dans ce contexte nocturne.'
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: les hommes de la ville, les hommes de Sodome
  rationale: La répétition appositionnelle de l’hébreu est conservée, ainsi que la référence explicitement masculine de אַנְשֵׁי.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: encerclèrent la maison
  rationale: נסב avec עַל exprime ici le fait de se placer tout autour; « encerclèrent » restitue clairement le caractère enveloppant de la foule sans expliciter davantage ses intentions.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: du jeune au vieux
  rationale: Formule mérismatique qui conserve les deux pôles d’âge et exprime l’ensemble de la tranche d’âge masculine évoquée.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Rend directement le collectif עָם et préserve le passage des « hommes » au terme collectif plus large employé par le texte.
- source_word: מִקָּצֶה
  choice: venu de tous les quartiers
  rationale: Dans ce contexte, l’expression elliptique « depuis l’extrémité » indique une provenance couvrant les différentes parties de la ville. L’ajout de « venu » clarifie en français le lien syntaxique sans changer le référent.
theological_decisions:
- issue: Étendue et genre du groupe décrit
  choice: Conserver « les hommes de la ville, les hommes de Sodome », puis « tout le peuple »
  alternative: Uniformiser en « les habitants de la ville » ou rendre partout le groupe par « les hommes »
  rationale: L’hébreu commence par le terme masculin אַנְשֵׁי, puis emploie le collectif עָם. Maintenir cette variation respecte la formulation de la source sans neutraliser ni restreindre artificiellement le second terme.
- issue: Valeur exhaustive de « tout le peuple »
  choice: Préserver la formulation absolue du narrateur
  alternative: Atténuer en « des gens de tous les quartiers »
  rationale: Le texte présente la foule de manière rhétoriquement exhaustive au moyen de כָּל et du mérisme des âges. La traduction ne doit ni réduire cette affirmation ni déterminer si elle doit être comprise comme une exhaustivité strictement numérique.
translation_notes:
  register: Français international actuel, narratif et digne. La construction « ne… pas encore… que » est idiomatique; « encerclèrent » garde la force concrète de l’action. La répétition appositionnelle et l’amplification rhétorique de l’hébreu sont volontairement conservées.
