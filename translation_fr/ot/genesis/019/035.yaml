  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: fr
  text: Cette nuit-là encore, elles firent boire du vin à leur père. Puis la plus jeune se leva et coucha avec lui ; il ne se rendit compte ni du moment où elle se coucha ni du moment où elle se leva.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: elles firent boire
  rationale: Le hifil de שׁקה exprime le fait de donner ou de faire boire. « Firent boire du vin à leur père » conserve cette valeur causative sans ajouter explicitement qu’elles l’enivrèrent.
- source_word: גַּם בַּלַּיְלָה הַהוּא
  choice: Cette nuit-là encore
  rationale: גַּם marque ici la répétition par rapport à la nuit précédente ; « encore » rend naturellement cette continuité narrative.
- source_word: אֶת אֲבִיהֶן יָיִן
  choice: du vin à leur père
  rationale: Cette tournure française exprime naturellement la personne que l’on fait boire et la boisson donnée.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: la plus jeune se leva
  rationale: Le féminin substantivé הַצְּעִירָה désigne la plus jeune des deux filles ; le contexte rend inutile la répétition de « fille ».
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: coucha avec lui
  rationale: « Coucher avec » est l’expression française courante correspondant à l’emploi sexuel de שׁכב עם, sans atténuer le récit.
- source_word: וְלֹא יָדַע
  choice: il ne se rendit compte
  rationale: ידע indique ici la conscience ou la perception. Cette formulation évite en français une possible confusion avec l’emploi sexuel du verbe « connaître ».
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: ni du moment où elle se coucha ni du moment où elle se leva
  rationale: Les deux constructions en בְּ sont temporelles et parallèles. La traduction maintient leur symétrie tout en restant idiomatique.
