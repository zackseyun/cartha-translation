source:
  edition: WLC
  text: וַ/יַּעַל֩ ל֨וֹט מִ/צּ֜וֹעַר וַ/יֵּ֣שֶׁב בָּ/הָ֗ר וּ/שְׁתֵּ֤י בְנֹתָי/ו֙ עִמּ֔/וֹ כִּ֥י יָרֵ֖א לָ/שֶׁ֣בֶת בְּ/צ֑וֹעַר וַ/יֵּ֨שֶׁב֙ בַּ/מְּעָרָ֔ה ה֖וּא וּ/שְׁתֵּ֥י בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: fr
  text: Lot quitta Tsoar et monta dans la montagne, où il habita avec ses deux filles, car il avait peur d’habiter à Tsoar. Il habita donc dans une grotte[a], lui et ses deux filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « dans la grotte ». L’article défini peut simplement désigner la grotte précise qu’ils occupaient, même si le français emploie naturellement « dans une grotte » lors de sa première mention.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִצּוֹעַר
  choice: quitta Tsoar et monta
  rationale: Le verbe עלה exprime un mouvement ascendant, tandis que מִן marque le point de départ. Cette formulation française naturelle conserve à la fois le départ de Tsoar et la montée topographique.
- source_word: וַיֵּשֶׁב
  choice: habita
  rationale: Dans ce contexte, ישב désigne le fait de résider. « Habita » est actuel et digne, sans suggérer aussi fortement que « s’installa » un établissement permanent.
- source_word: בָּהָר
  choice: dans la montagne
  rationale: Le singulier hébreu הַר désigne ici la zone montagneuse. « Dans la montagne » en conserve le nombre tout en restant idiomatique en français.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: avec ses deux filles
  rationale: La proposition nominale indique que ses filles se trouvaient avec lui. Son intégration à la relative produit une phrase française fluide sans perdre cette information.
- source_word: כִּי יָרֵא
  choice: car il avait peur
  rationale: כִּי introduit ici la cause, et יָרֵא décrit l’état de crainte de Lot. « Car il avait peur » rend clairement ce rapport causal.
- source_word: לָשֶׁבֶת בְּצֹעַר
  choice: d’habiter à Tsoar
  rationale: L’infinitif de ישב reprend l’idée de résidence. La préposition « à » convient naturellement à un nom de ville en français.
- source_word: בַּמְּעָרָה
  choice: dans une grotte
  rationale: L’hébreu porte l’article défini, mais la grotte n’a pas été identifiée auparavant. L’indéfini est donc plus naturel lors de sa première mention en français; la forme littérale est signalée en note.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: lui et ses deux filles
  rationale: Cette reprise appositionnelle est conservée afin de respecter l’insistance finale de l’hébreu sur les occupants de la grotte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite « demeura », plus soutenu ou vieilli, et conserve la répétition finale intentionnelle de l’hébreu.
