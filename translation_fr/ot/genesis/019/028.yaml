  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: fr
  text: Il porta son regard sur Sodome et Gomorrhe et sur toute l’étendue du pays de la plaine. Il vit, et voici que la fumée du pays montait comme la fumée d’une fournaise[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme la fumée d’un four ».
    reason: Variante lexicale pour כִּבְשָׁן, qui peut désigner une fournaise ou un four.
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: Il porta son regard sur
  rationale: Le verbe évoque un regard porté depuis un point élevé. Cette formulation française naturelle conserve l’idée d’observer une région étendue sans préciser excessivement la direction verticale.
- source_word: עַל פְּנֵי
  choice: sur
  rationale: Dans ce contexte spatial, « sur » rend simplement l’idée d’un regard embrassant les lieux, sans reproduire littéralement l’expression hébraïque « sur la face de ».
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodome et Gomorrhe
  rationale: Formes françaises traditionnelles et largement reconnues de ces noms de lieux.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: toute l’étendue du pays de la plaine
  rationale: « Toute l’étendue » exprime naturellement כָּל פְּנֵי, tandis que « pays de la plaine » conserve la désignation géographique sans la réduire à une vallée précise.
- source_word: וַיַּרְא
  choice: Il vit
  rationale: Rendu direct de ראה, qui maintient la succession narrative et l’acte de perception.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure conserve la vivacité du marqueur hébreu, qui attire l’attention sur le spectacle soudainement constaté.
- source_word: עָלָה
  choice: montait
  rationale: L’imparfait décrit naturellement en français le mouvement ascendant en cours au moment où il l’observe.
- source_word: קִיטֹר
  choice: fumée
  rationale: « Fumée » correspond au sens de base du nom sans ajouter une densité ou une forme que le texte ne précise pas.
- source_word: הָאָרֶץ
  choice: du pays
  rationale: Le contexte vise la région observée, et non la terre entière ; « pays » convient à cette portée locale.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: comme la fumée d’une fournaise
  rationale: כִּבְשָׁן peut désigner une fournaise ou un four de cuisson. « Fournaise » produit en français une comparaison claire et forte, tandis que l’autre possibilité est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « fumée » et la formule « et voici que » sont conservées afin de respecter la structure et la vivacité de l’hébreu. Le marqueur de note est placé après « fournaise », terme auquel porte réellement la variante lexicale.
