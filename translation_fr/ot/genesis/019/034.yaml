    issue: Le verbe exprimant le but final est affaibli.
    rationale: וּנְחַיֶּה est un piel de חיה, « garder en vie, préserver, conserver ». « Ayons une descendance » exprime le résultat recherché, mais ne reflète pas explicitement cette notion de préservation présente dans le texte source et confirmée par la piste d’audit anglaise.
