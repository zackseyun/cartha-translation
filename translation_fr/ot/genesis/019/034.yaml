  source_fidelity: La traduction restitue fidèlement la succession narrative, l’opposition entre l’aînée et la plus jeune, le causatif « faire boire », ainsi que l’euphémisme sexuel. Toutefois, « afin que nous ayons une descendance » atténue le piel נְחַיֶּה, qui exprime l’idée de maintenir/conserver une postérité, plutôt que simplement en obtenir une.
  naturalness: Le français est moderne, clair et d’un registre narratif approprié. « Faisons-lui boire » et « va coucher avec lui » sont naturels dans ce contexte.
  terminology: « L’aînée », « la plus jeune », « coucher avec », et « descendance » conviennent. « Conservions une descendance » rend plus exactement le verbe hébreu tout en restant intelligible.
  issues:
