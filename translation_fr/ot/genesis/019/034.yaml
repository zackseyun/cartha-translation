  to: 'Le lendemain, l’aînée dit à la plus jeune : « Écoute, la nuit dernière, j’ai couché avec mon père. Faisons-lui boire du vin encore cette nuit ; puis va coucher avec lui, afin que nous conservions une descendance de notre père. »'
  rationale: La seule modification remplace « ayons » par « conservions », afin de rendre la valeur du piel נְחַיֶּה sans introduire d’interprétation morale ou doctrinale. Le reste du texte est conservé.
