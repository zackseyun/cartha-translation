base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: fr
  text: 'Le lendemain, l’aînée dit à la plus jeune : « Écoute, la nuit dernière, j’ai couché avec mon père. Faisons-lui boire du vin encore cette nuit ; puis va coucher avec lui, afin que nous conservions une descendance de notre père. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Le lendemain
  rationale: Rend naturellement en français moderne la transition narrative et la référence au jour suivant, sans la formule lourde « il arriva que ».
- source_word: הַבְּכִירָה ... הַצְּעִירָה
  choice: l’aînée ... la plus jeune
  rationale: Conserve le contraste d’ordre de naissance entre les deux filles ; le féminin est clairement indiqué par les formes hébraïques et le contexte.
- source_word: הֵן
  choice: Écoute
  rationale: Marque l’appel à l’attention de manière naturelle dans ce dialogue, sans l’archaïsme de « voici ».
- source_word: שָׁכַבְתִּי אֶת אָבִי
  choice: j’ai couché avec mon père
  rationale: « Coucher avec » est l’euphémisme sexuel français courant correspondant à l’expression hébraïque.
- source_word: אֶמֶשׁ
  choice: la nuit dernière
  rationale: Exprime clairement la nuit précédente dans le contexte.
- source_word: נַשְׁקֶנּוּ יַיִן גַּם הַלַּיְלָה
  choice: Faisons-lui boire du vin encore cette nuit
  rationale: Préserve le causatif de שׁקה et la valeur additive de גַּם, qui indique la répétition de l’action.
- source_word: וּבֹאִי שִׁכְבִי עִמּוֹ
  choice: puis va coucher avec lui
  rationale: Rend la succession des actions et l’euphémisme sexuel ; en français, « va coucher » est plus naturel ici que le littéral « viens, couche ».
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: afin que nous ayons une descendance de notre père
  rationale: Rend le sens contextuel de « maintenir en vie une semence issue de notre père » dans un français clair, tout en conservant la provenance exprimée par מִן.
theological_decisions:
- issue: Nature du projet exprimé par וּנְחַיֶּה ... זָרַע
  choice: afin que nous ayons une descendance de notre père
  alternative: afin que nous préservions une descendance de notre père
  rationale: La formulation choisie exprime le but reproductif sans suggérer qu’une descendance existe déjà et doit être maintenue en vie ; elle n’ajoute aucune évaluation morale absente de la phrase.
translation_notes:
  register: Français international moderne, narratif et digne. Les euphémismes sexuels du texte hébreu sont conservés par « coucher avec ». Le dialogue reste direct, sans archaïsmes ni explicitation morale ajoutée.
