  text: וַ/יִּפְצַר בָּ֣/ם מְאֹ֔ד וַ/יָּסֻ֣רוּ אֵלָ֔י/ו וַ/יָּבֹ֖אוּ אֶל בֵּית֑/וֹ וַ/יַּ֤עַשׂ לָ/הֶם֙ מִשְׁתֶּ֔ה וּ/מַצּ֥וֹת אָפָ֖ה וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: fr
  text: Mais il insista vivement auprès d’eux[a]. Alors ils firent un détour pour aller chez lui et entrèrent dans sa maison. Il leur prépara un festin et fit cuire des pains sans levain[b], puis ils mangèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il les pressa avec beaucoup d’insistance ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des pains sans levain »; il peut aussi s’agir de galettes préparées sans levain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: il insista vivement auprès d’eux
  rationale: פצר exprime une insistance pressante, et מְאֹד en renforce l’intensité. Cette formulation est naturelle en français moderne tout en préservant la force de l’hébreu.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: ils firent un détour pour aller chez lui
  rationale: סור signifie fondamentalement « se détourner » ou « faire un détour ». La formulation conserve l’image du changement de direction et rend אֵלָיו de manière idiomatique dans ce contexte d’hospitalité.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: entrèrent dans sa maison
  rationale: « Entrèrent » exprime clairement et avec concision le déplacement vers l’intérieur de la maison.
- source_word: מִשְׁתֶּה
  choice: un festin
  rationale: Le terme désigne un repas de fête ou banquet, souvent accompagné de boisson, sans que le contexte impose de mettre l’alcool au premier plan.
- source_word: מַצּוֹת אָפָה
  choice: fit cuire des pains sans levain
  rationale: מַצּוֹת est un pluriel désignant des pains ou galettes sans levain. « Fit cuire » rend אָפָה sans suggérer inutilement une technique de cuisson moderne précise.
- source_word: וַיֹּאכֵלוּ
  choice: puis ils mangèrent
  rationale: Cette conclusion narrative simple conserve la succession des actions exprimée par le waw hébreu.
