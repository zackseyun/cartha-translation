  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: fr
  text: Lorsque Dieu détruisit les villes de la plaine, Dieu se souvint d’Abraham[a] et fit sortir Loth du milieu de la catastrophe[b], quand il renversa les villes où Loth avait habité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans cet idiome hébreu, Dieu « se souvient » lorsqu’il porte une attention fidèle à quelqu’un et agit en sa faveur ; cela ne signifie pas qu’il avait oublié Abraham.
    reason: cultural_note
  - marker: b
    text: 'Le nom hébreu traduit par « catastrophe » est apparenté au verbe rendu ensuite par « renversa ». On pourrait aussi traduire : « du milieu du bouleversement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּשַׁחֵת
  choice: Or, lorsque … détruisit
  rationale: La construction narrative introduit la circonstance temporelle. « Or, lorsque » en rend la fonction sans recourir au tour lourd « il arriva que ».
- source_word: עָרֵי הַכִּכָּר
  choice: les villes de la plaine
  rationale: Dans le contexte de Genèse 13 et 19, כִּכָּר désigne la plaine ou le district du Jourdain. « Plaine » est naturel et traditionnel sans préciser davantage que l’hébreu.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת־אַבְרָהָם
  choice: Dieu se souvint d’Abraham
  rationale: Cette formulation conserve l’idiome biblique de la mémoire divine et sa portée relationnelle, tandis qu’une note prévient le contresens d’un oubli préalable.
- source_word: וַיְשַׁלַּח אֶת־לוֹט
  choice: fit sortir Loth
  rationale: Dans ce contexte de délivrance, cette tournure française exprime naturellement le mouvement causé par Dieu. « Envoya Loth hors de » serait plus formellement proche, mais nettement moins idiomatique en français.
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: du milieu de la catastrophe
  rationale: « Du milieu de » rend תּוֹךְ, et « catastrophe » exprime ici le renversement destructeur sans produire une formulation française artificielle.
- source_word: בַּהֲפֹךְ אֶת־הֶעָרִים
  choice: quand il renversa les villes
  rationale: Le verbe « renversa » garde l’image concrète de הפך et laisse perceptible, grâce à la note, son lien étymologique avec le nom précédent.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: où Loth avait habité
  rationale: Le plus-que-parfait situe naturellement en français la résidence de Loth avant la destruction, sans ajouter d’information.
theological_decisions:
- issue: Sens de « Dieu se souvint d’Abraham »
  choice: Conserver littéralement l’idiome dans le texte principal.
  alternative: Dieu agit en considération d’Abraham.
  rationale: Le récit associe la mémoire divine à une action fidèle en faveur d’Abraham, mais une paraphrase causale explicite irait au-delà de la formulation hébraïque. La note éclaire l’idiome sans résoudre excessivement sa portée.
translation_notes:
  register: Français international actuel, sobre et digne. Le passé simple convient au registre narratif biblique écrit. La répétition de « Dieu » est conservée comme dans l’hébreu, et « Loth » suit la forme française biblique usuelle du nom.
