  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: fr
  text: Ainsi, les deux filles de Loth devinrent enceintes de leur père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de leur père »; l’expression hébraïque indique que leur père est le père de leurs enfants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: tombèrent enceintes
  rationale: Le verbe הרה au wayyiqtol, troisième personne du féminin pluriel, indique qu’elles devinrent enceintes. « Tombèrent enceintes » est une formulation française courante et naturelle; « conçurent » serait possible, mais plus littéraire.
- source_word: שְׁתֵּי
  choice: les deux
  rationale: Le numéral construit précise que les deux filles sont concernées. « Les deux filles » restitue directement et naturellement cette portée en français.
- source_word: בְנוֹת לוֹט
  choice: filles de Loth
  rationale: La chaîne construite hébraïque se rend naturellement en français par un complément introduit par « de ».
- source_word: מֵאֲבִיהֶן
  choice: de leur père
  rationale: La préposition מִן exprime ici la source ou la paternité. « Enceintes de leur père » est idiomatique en français et conserve ce rapport sans ajouter d’explication.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste explicite comme l’hébreu, sans atténuer le caractère incestueux du récit.
