  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: fr
  text: Ils frappèrent les hommes qui se trouvaient à l’entrée de la maison d’aveuglement[a], du plus petit au plus grand, si bien que ceux-ci s’épuisèrent à chercher l’entrée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’éblouissement » ou « de confusion visuelle » ; le terme hébreu, rare, peut évoquer davantage qu’une cécité ordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: frappèrent
  rationale: Le hifil de נכה signifie couramment « frapper ». Avec le complément « d’aveuglement », cette formulation française conserve l’image d’une atteinte soudaine sans employer un tour archaïque.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le pluriel masculin אֲנָשִׁים désigne ici les hommes rassemblés devant la maison de Loth.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: qui se trouvaient à l’entrée de la maison
  rationale: La proposition situe les hommes. « Se trouvaient » explicite naturellement en français la relation locative implicite en hébreu.
- source_word: בַּסַּנְוֵרִים
  choice: d’aveuglement
  rationale: סַנְוֵרִים est un terme rare désignant une incapacité visuelle infligée. « Aveuglement » en donne le sens principal tout en laissant une note signaler la nuance possible d’éblouissement ou de confusion visuelle.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: du plus petit au plus grand
  rationale: Cette formulation conserve le mérisme hébreu et n’impose pas l’interprétation plus précise « du plus jeune au plus âgé ».
- source_word: וַיִּלְאוּ
  choice: s’épuisèrent
  rationale: Le verbe לָאָה exprime la fatigue résultant d’un effort prolongé; « s’épuisèrent » restitue avec concision cette intensité.
- source_word: לִמְצֹא
  choice: à chercher
  rationale: Dans ce contexte d’effort infructueux, « chercher » rend naturellement la tentative de trouver exprimée par l’infinitif.
- source_word: הַפָּתַח
  choice: l’entrée
  rationale: פֶּתַח désigne l’ouverture ou l’accès à la maison. La répétition de « l’entrée » reflète la répétition du même mot hébreu dans le verset.
theological_decisions:
- issue: Nature de l’atteinte exprimée par סַנְוֵרִים
  choice: un aveuglement infligé surnaturellement
  alternative: un éblouissement ou une confusion visuelle
  rationale: Le récit présente une atteinte qui empêche les hommes de localiser l’entrée, mais le terme hébreu rare ne permet pas d’en préciser exactement le mécanisme. Le texte principal donne le sens le plus transparent et la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche de la progression hébraïque. « Ceux-ci » lève naturellement l’ambiguïté du sujet après la mention des anges au contexte immédiat, tandis que la répétition de « l’entrée » conserve le lien lexical du texte source.
