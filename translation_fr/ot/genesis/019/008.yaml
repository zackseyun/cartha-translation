source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: fr
  text: Voyez, je vous en prie, j’ai deux filles qui n’ont pas connu d’homme[a]. Laissez-moi, je vous en prie, vous les amener dehors, et faites-leur ce qui est bon à vos yeux. Seulement, ne faites rien à ces hommes, car ils sont venus à l’ombre de mon toit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement dit, elles n’ont pas eu de relations sexuelles avec un homme; traditionnellement : « qui sont vierges ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « à l’ombre de mon toit » évoque l’abri et la protection dus aux hôtes accueillis dans une maison.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Voici, je vous en prie
  rationale: « Voici » attire vivement l’attention, tandis que נָא exprime ici la supplication. Cette formulation reste actuelle tout en conservant le ton pressant de Lot.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: qui n’ont pas connu d’homme
  rationale: La traduction conserve l’idiome hébreu de la connaissance pour les relations sexuelles; une note en explicite le sens sans remplacer l’image du texte.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: Permettez-moi, je vous en prie, de vous les faire sortir
  rationale: Le cohortatif exprime la volonté ou l’offre de Lot, et le second נָא maintient son ton suppliant.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: et faites-leur ce qui est bon à vos yeux
  rationale: Cette formulation garde l’image hébraïque et la brutalité troublante de la proposition, sans l’atténuer ni lui donner une approbation morale.
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: Seulement, ne faites rien à ces hommes
  rationale: « Seulement » rend la restriction forte introduite par רַק, et la suite exprime clairement l’interdiction totale.
- source_word: בְּצֵל קֹרָתִי
  choice: à l’ombre de mon toit
  rationale: La formulation préserve l’image littérale de l’ombre et du toit ainsi que son évocation de l’abri et de la protection accordés aux hôtes.
theological_decisions:
- issue: Faut-il atténuer l’offre choquante de Lot pour des raisons de sensibilité morale?
  choice: Conserver sans euphémisme la force directe de l’hébreu
  alternative: Employer une formule adoucie telle que « traitez-les comme bon vous semblera »
  rationale: Le récit présente une proposition profondément troublante sans demander au traducteur de l’approuver. La traduction doit donc en préserver la gravité et ne pas résoudre la tension morale par une reformulation atténuée.
translation_notes:
  register: Français international moderne, digne et intelligible. Les tournures « connu d’homme », « bon à vos yeux » et « à l’ombre de mon toit » conservent volontairement les images hébraïques, avec des notes là où leur sens pourrait ne pas être immédiatement évident.
