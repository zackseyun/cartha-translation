review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement les principaux éléments de l’hébreu : la supplication de נָא, l’idiome « connaître un homme », l’offre cohortative, la formule « bon à vos yeux », la restriction introduite par רַק et l’image protectrice de « l’ombre de mon toit ». Toutefois, « de vous les faire sortir » est syntaxiquement ambigu en français et peut suggérer qu’elles sortent les destinataires plutôt que d’être amenées dehors auprès d’eux.'
  naturalness: Le registre est globalement digne et compréhensible. « Voici, je vous en prie » demeure possible dans une diction biblique, mais « Voyez, je vous en prie » est plus naturel en français moderne tout en conservant l’appel pressant. La reformulation de l’offre élimine une ambiguïté réelle.
  terminology: « Connu d’homme » conserve volontairement l’idiome hébreu, avec une note explicative adéquate. « À l’ombre de mon toit » et sa note rendent bien l’image de l’abri et l’obligation d’hospitalité, sans imposer une interprétation doctrinale.
  issues:
