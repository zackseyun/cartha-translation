  to: Voyez, je vous en prie, j’ai deux filles qui n’ont pas connu d’homme[a]. Laissez-moi, je vous en prie, vous les amener dehors, et faites-leur ce qui est bon à vos yeux. Seulement, ne faites rien à ces hommes, car ils sont venus à l’ombre de mon toit[b].
  rationale: La révision remplace une construction française ambiguë par « vous les amener dehors », qui rend clairement l’idée de les faire sortir pour les présenter aux interlocuteurs. « Voyez » est également plus idiomatique que « Voici » dans cette introduction verbale, sans modifier la force d’appel de הִנֵּה. Le reste du texte et les deux notes sont conservés, car ils reflètent avec justesse le texte source.
