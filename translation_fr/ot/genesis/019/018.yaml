  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: fr
  text: 'Mais Lot leur dit : « Non, je vous en prie, mes seigneurs[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Non, je t’en prie, mon Seigneur ! » La forme hébraïque אֲדֹנָי peut, selon la lecture, être comprise comme une adresse respectueuse au singulier ; toutefois, le pluriel « leur » dans le contexte favorise ici « mes seigneurs ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais … dit
  rationale: Le waw consécutif fait progresser le récit, tandis que « Mais » rend ici l’opposition de Lot à l’instruction qui vient de lui être donnée.
- source_word: לוֹט
  choice: Lot
  rationale: Forme française traditionnelle du nom propre.
- source_word: אֲלֵהֶם
  choice: leur
  rationale: Le pronom masculin pluriel renvoie directement aux deux visiteurs, sans expliciter davantage le référent.
- source_word: אַל
  choice: Non
  rationale: Dans cette supplication sans verbe exprimé, la particule négative rejette la proposition précédente.
- source_word: נָא
  choice: je vous en prie
  rationale: Cette formule naturelle et respectueuse rend la valeur de supplication de la particule נָא.
- source_word: אֲדֹנָי
  choice: mes seigneurs
  rationale: Le contexte pluriel, notamment אֲלֵהֶם (« leur »), favorise une adresse aux deux visiteurs. « Mes seigneurs » conserve le sens lexical et le nombre.
theological_decisions:
- issue: אֲדֹנָי peut-il désigner ici le Seigneur au singulier ou les visiteurs au pluriel ?
  choice: 'Adresse plurielle : « mes seigneurs »'
  alternative: 'Adresse singulière, éventuellement divine : « mon Seigneur »'
  rationale: La syntaxe immédiate présente plusieurs destinataires (« leur »), ce qui favorise le pluriel. Toutefois, la forme hébraïque permet une lecture singulière respectueuse ou divine dans certaines interprétations ; cette ambiguïté est donc signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Je vous en prie » exprime une supplication respectueuse sans archaïsme ; « mes seigneurs » conserve la teneur formelle de l’adresse hébraïque.
