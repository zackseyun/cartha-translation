base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: fr
  text: 'Ils appelèrent Loth et lui dirent : « Où sont les hommes qui sont venus chez toi cette nuit ? Fais-les sortir vers nous, pour que nous les connaissions[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement dans ce contexte : « pour que nous ayons des relations sexuelles avec eux ». L’hébreu dit « que nous les connaissions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Ils appelèrent
  rationale: Le verbe קרא signifie ici appeler quelqu’un. Cette formulation conserve la sobriété du récit sans ajouter l’intensité de « crier ».
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: אֲנָשִׁים désigne ici précisément les visiteurs masculins.
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: qui sont venus chez toi cette nuit
  rationale: « Chez toi » rend naturellement le mouvement vers Loth dans ce contexte d’accueil, et « cette nuit » correspond au repère temporel du récit.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: Fais-les sortir vers nous
  rationale: Le hifil de יצא exprime le fait de faire sortir. « Vers nous » maintient explicitement אֵלֵינוּ et le mouvement demandé.
- source_word: וְנֵדְעָה אֹתָם
  choice: pour que nous les connaissions
  rationale: Le texte emploie le verbe ordinaire ידע, « connaître ». La traduction conserve cette formulation et son ambiguïté lexicale, tandis qu’une note indique le sens sexuel suggéré par le contexte.
theological_decisions:
- issue: Faut-il expliciter dans le texte principal l’intention sexuelle de וְנֵדְעָה אֹתָם ?
  choice: Conserver « pour que nous les connaissions » dans le texte principal et signaler en note le sens sexuel contextuel.
  alternative: Traduire explicitement « pour que nous ayons des relations sexuelles avec eux » ou « pour que nous les agressions sexuellement ».
  rationale: Le contexte indique fortement une intention sexuelle hostile, mais l’hébreu dit littéralement « connaître ». Garder ce mot dans le texte préserve la forme littéraire et la tension du passage sans transformer une implication contextuelle en explicitation.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient à la narration biblique écrite sans être archaïque. La formulation demeure directe et compréhensible, avec l’explicitation interprétative placée en note.
