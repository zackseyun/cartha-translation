id: GEN.19.1
reference: Genesis 19:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: fr
  text: Les deux anges arrivèrent à Sodome le soir. Loth était assis à la porte de Sodome[a]. Quand il les vit, il se leva pour aller à leur rencontre et se prosterna, le visage contre terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « porte » désigne ici l’espace aménagé à l’entrée de la ville, lieu public où se déroulaient notamment les affaires de la cité.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « il se prosterna, face contre terre »; l’hébreu décrit un profond geste d’abaissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: arrivèrent
  rationale: Le verbe בוא décrit ici l’arrivée des visiteurs à Sodome; « arrivèrent » convient naturellement au récit français.
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: les deux anges
  rationale: מַלְאָךְ peut désigner un messager, mais le contexte identifie ces visiteurs comme des êtres célestes; « anges » rend clairement ce référent.
- source_word: סְדֹמָה
  choice: à Sodome
  rationale: Le hé directionnel marque le mouvement vers Sodome; la préposition française « à » exprime idiomatiquement la destination.
- source_word: בָּעֶרֶב
  choice: le soir
  rationale: Cette expression temporelle situe simplement leur arrivée; « le soir » est naturel en français moderne.
- source_word: יֹשֵׁב
  choice: était assis
  rationale: Le participe donne un arrière-plan duratif et décrit la position de Loth au moment de l’arrivée.
- source_word: בְּשַׁעַר סְדֹם
  choice: à la porte de Sodome
  rationale: La formule désigne l’espace de la porte de la ville; « à la porte » est naturel, tandis qu’une note précise sa portée culturelle.
- source_word: וַיַּרְא לוֹט
  choice: Quand il les vit
  rationale: L’objet est implicite en hébreu mais repris explicitement en français; « quand » rend avec fluidité la succession narrative.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: il se leva pour aller à leur rencontre
  rationale: La tournure exprime à la fois le fait de se lever et de s’avancer vers les visiteurs; cette formulation française conserve les deux aspects.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna
  rationale: Le verbe décrit un profond geste d’abaissement, sans imposer ici le sens théologique plus précis d’« adorer ».
- source_word: אַפַּיִם אָרְצָה
  choice: le visage contre terre
  rationale: Cette expression idiomatique décrit une prosternation complète; la formulation est concise et naturelle en français.
theological_decisions:
- issue: Le geste exprimé par וַיִּשְׁתַּחוּ relève-t-il de l’adoration ou d’une marque profonde de respect ?
  choice: « se prosterna », formulation qui décrit le geste sans affirmer explicitement un acte d’adoration
  alternative: « adora » ou « s’inclina »
  rationale: שׁחה peut décrire l’adoration ou l’hommage respectueux selon le contexte. Ici, traduire par « adora » ajouterait une affirmation théologique que le verset ne tranche pas, tandis que « s’inclina » pourrait atténuer la profondeur du geste.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, et les termes culturels ou potentiellement ambigus sont explicités sans alourdir le verset.
