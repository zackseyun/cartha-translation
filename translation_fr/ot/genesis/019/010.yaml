  source_fidelity: La désignation « les hommes », l’opposition introduite par « Mais », et la succession des actions correspondent bien à l’hébreu. « Firent rentrer » suggère toutefois que Loth était précédemment à l’intérieur ; le verbe causatif exprime seulement qu’ils le font venir/entrer dans la maison.
  naturalness: La formulation révisée est plus directe et idiomatique en français narratif. « Dans la maison avec eux » rend clairement la destination et le fait qu’il les rejoint.
  terminology: « Loth », « les hommes », « maison » et « porte » conviennent. Il ne faut pas substituer « anges » à « hommes » dans le texte principal.
  issues:
