  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: fr
  text: Mais les hommes tendirent les mains, firent entrer Loth dans la maison avec eux et fermèrent la porte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le nom hébreu signifie littéralement « les hommes ». Bien que le contexte les identifie comme des messagers angéliques, le texte de ce verset conserve cette désignation ordinaire.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: tendirent les mains
  rationale: L’expression désigne le geste physique d’étendre la main. « Tendre les mains » est naturel en français et garde le pluriel collectif de l’hébreu.
- source_word: וַיָּבִיאוּ אֶת לוֹט
  choice: firent rentrer Loth
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Dans cette scène, « faire rentrer » exprime naturellement le mouvement de Loth de l’extérieur vers l’intérieur sans ajouter l’idée plus interprétative de le tirer.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: auprès d’eux dans la maison
  rationale: Cette formulation préserve à la fois le mouvement vers les hommes et sa destination à l’intérieur de la maison.
- source_word: הַדֶּלֶת
  choice: la porte
  rationale: דֶּלֶת est le terme courant pour désigner une porte; aucune précision supplémentaire n’est nécessaire.
- source_word: סָגָרוּ
  choice: fermèrent
  rationale: « Fermer » est l’équivalent français direct et idiomatique du verbe hébreu dans ce contexte.
- source_word: וַ
  choice: Mais / puis
  rationale: Le premier waw marque ici le contraste avec l’action menaçante du verset précédent, tandis que la suite fait progresser rapidement la narration.
theological_decisions:
- issue: Faut-il identifier explicitement הָאֲנָשִׁים comme des anges ?
  choice: Conserver « les hommes » dans le texte principal
  alternative: les anges ; les visiteurs
  rationale: Le contexte narratif révèle leur identité angélique, mais ce verset les appelle simplement « les hommes ». La traduction respecte cette désignation sans expliciter une interprétation contextuelle.
translation_notes:
  register: Français international moderne, narratif et digne. La succession « tendirent…, firent rentrer…, puis fermèrent… » restitue le rythme rapide de l’hébreu. Aucun appel de note n’est nécessaire, car les principales nuances peuvent être rendues directement et naturellement dans le texte.
