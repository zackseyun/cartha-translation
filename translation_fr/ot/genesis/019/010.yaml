    issue: « firent rentrer Loth »
    rationale: « Rentrer » présuppose ou suggère un retour vers un lieu où Loth se trouvait déjà. L’hébreu ויביאו indique qu’ils le font entrer dans la maison ; « firent entrer » est plus exact et ne crée pas cette nuance.
  - severity: low
    issue: « auprès d’eux dans la maison »
    rationale: La tournure est compréhensible, mais elle alourdit la phrase et rend moins nettement le mouvement d’entrée. « dans la maison avec eux » est plus fluide tout en conservant l’idée qu’il entre dans leur compagnie.
  revised_text: Mais les hommes tendirent les mains, firent entrer Loth dans la maison avec eux et fermèrent la porte.
