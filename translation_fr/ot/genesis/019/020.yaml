  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: fr
  text: 'Regarde, je t’en prie : cette ville est assez proche pour que je puisse m’y réfugier, et elle est petite. Laisse-moi, je t’en prie, m’y réfugier — n’est-elle pas petite ? — afin que je reste en vie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « et que mon être vive » ; l’expression hébraïque signifie ici : « afin que je reste en vie ».'
    reason: La note signale l’expression idiomatique avec נֶפֶשׁ sans imposer au texte français un calque peu naturel ni une lecture spiritualisante de « âme ».
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Regarde, je t’en prie
  rationale: הִנֵּה attire vivement l’attention, tandis que נָא donne à l’appel le ton d’une supplication urgente. Cette formulation est naturelle et digne en français moderne.
- source_word: הָעִיר הַזֹּאת
  choice: cette ville
  rationale: Rend directement le nom et le démonstratif, sans réduire arbitrairement עִיר à « village ».
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: est assez proche pour que je puisse m’y réfugier
  rationale: La proximité est présentée comme permettant la fuite. « M’y réfugier » exprime ici naturellement la fuite vers un lieu sûr, avec שָׁמָּה repris par « y ».
- source_word: וְהִיא מִצְעָר
  choice: et elle est petite
  rationale: Préserve le sens de petitesse ou de faible importance de מִצְעָר et prépare sa répétition dans la question rhétorique.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: Laisse-moi, je t’en prie, m’y échapper
  rationale: Le cohortatif avec נָא exprime une requête pressante. « Laisse-moi » en marque la force volitive, et « m’y échapper » conserve l’idée de délivrance par la fuite.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: n’est-elle pas petite ?
  rationale: Conserve la question rhétorique et la répétition de מִצְעָר, élément central de l’argument de Lot.
- source_word: וּתְחִי נַפְשִׁי
  choice: afin que je reste en vie
  rationale: נֶפֶשׁ désigne ici la personne elle-même, et la proposition coordonnée exprime le résultat ou le but recherché. Le français idiomatique évite le calque obscur « que ma vie vive ».
theological_decisions: []
translation_notes:
  register: Français international moderne, oral mais digne, adapté à une supplication urgente. La répétition de « petite » est maintenue pour reproduire l’insistance du texte hébreu. Le tutoiement convient au discours direct singulier dans le contexte narratif.
