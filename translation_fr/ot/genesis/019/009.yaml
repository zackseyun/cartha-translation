revisions:
- from: 'Ils dirent : « Écarte-toi ! »[a] Puis ils ajoutèrent : « Cet individu est venu habiter ici en étranger, et le voilà qui veut faire le juge ![b] Maintenant, nous allons te faire plus de mal qu’à eux. »[c] Ils poussèrent alors Lot avec une grande violence[d] et s’avancèrent pour enfoncer la porte.'
  to: 'Ils dirent : « Écarte-toi ! »[a] Puis ils ajoutèrent : « Cet individu est venu s’installer comme étranger, et voilà qu’il fait le juge ! »[b] Maintenant, nous allons te faire plus de mal qu’à eux. »[c] Ils se pressèrent alors très fortement contre l’homme, contre Lot,[d] et s’avancèrent pour enfoncer la porte.'
  rationale: La révision conserve le sens, le ton hostile et l’ambiguïté contrôlée du texte hébreu, tout en corrigeant la relation syntaxique de la foule à Lot. Elle évite d’ajouter l’idée explicite de violence ou une intention que le texte ne formule pas, sans atténuer la scène.
