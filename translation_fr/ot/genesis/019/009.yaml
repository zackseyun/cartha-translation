base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: fr
  text: 'Ils dirent : « Écarte-toi ! »[a] Puis ils ajoutèrent : « Cet individu est venu s’installer comme étranger, et voilà qu’il fait le juge ! »[b] Maintenant, nous allons te faire plus de mal qu’à eux. »[c] Ils se pressèrent alors très fortement contre l’homme, contre Lot,[d] et s’avancèrent pour enfoncer la porte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Recule ! »'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « et maintenant il se met vraiment à juger ! » La tournure hébraïque renforce le verbe « juger ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « nous te ferons du mal plus qu’à eux » ; ils menacent Lot d’un sort pire que celui qu’ils réservent à ses visiteurs.'
    reason: idiom_explanation
  - marker: d
    text: 'Littéralement, la phrase répète : « contre l’homme, contre Lot ». Cette répétition met Lot personnellement en relief ; « très fortement » rend l’intensité exprimée par l’hébreu.'
    reason: literal_rendering
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: Écarte-toi !
  rationale: Dans ce contexte hostile, l’expression ordonne à Lot de quitter le passage. « Écarte-toi ! » est naturel en français et conserve la force de l’impératif.
- source_word: הָאֶחָד
  choice: Cet individu
  rationale: L’expression désigne Lot avec mépris. « Cet individu » rend ce ton dédaigneux sans introduire une familiarité excessive.
- source_word: בָּא לָגוּר
  choice: est venu habiter ici en étranger
  rationale: Le verbe גור évoque la résidence d’un non-autochtone bénéficiant du statut social d’étranger. Cette formulation moderne exprime clairement cette situation.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: le voilà qui veut faire le juge
  rationale: La construction avec infinitif absolu renforce l’accusation. En français, « le voilà qui veut faire le juge » conserve l’emphase, le mépris et l’idée que Lot s’arroge une fonction de juge, sans imposer une valeur strictement itérative.
- source_word: נָרַע לְךָ מֵהֶם
  choice: nous allons te faire plus de mal qu’à eux
  rationale: 'Le hiphil de רעע signifie ici faire du mal. La comparaison explicite la menace : Lot subira un mal pire que celui prévu pour ses visiteurs.'
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: Ils poussèrent alors Lot avec une grande violence
  rationale: פצר décrit ici une forte pression physique, intensifiée par מְאֹד. La formulation française est naturelle tout en conservant l’intensité de l’agression.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: s’avancèrent pour enfoncer la porte
  rationale: נגשׁ avec l’infinitif exprime une avancée intentionnelle, et « enfoncer la porte » rend naturellement la destruction forcée indiquée par שׁבר dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours des hommes conserve son hostilité et son mépris. La traduction évite le terme vieilli « séjourner » et préserve l’emphase de la construction hébraïque sans la réduire à une action nécessairement répétée.
