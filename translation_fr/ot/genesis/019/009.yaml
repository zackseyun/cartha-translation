  - severity: low
    issue: « Avec une grande violence » interprète plus fortement l’adverbe מְאֹד.
    rationale: מְאֹד intensifie l’action (« très fortement ») ; le contexte est agressif, mais le mot lui-même ne signifie pas « violence ».
  - severity: low
