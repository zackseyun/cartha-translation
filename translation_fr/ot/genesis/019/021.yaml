  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: fr
  text: 'Il lui dit : « Eh bien, je t’accorde aussi cette demande[a] : je ne renverserai pas la ville dont tu as parlé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque : « J’ai relevé ton visage », c’est-à-dire « Je t’ai montré ma faveur » ou « Je t’accorde ta demande ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eh bien
  rationale: Marque ici l’attention et introduit la réponse. « Eh bien » remplit naturellement cette fonction en français moderne sans l’archaïsme de « voici » dans cet emploi.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: je t’accorde
  rationale: L’expression signifie littéralement « relever/porter le visage » et, en contexte, accueillir favorablement la requête de quelqu’un. Le présent français convient à l’annonce performative de la concession.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: aussi cette demande
  rationale: דָּבָר désigne ici l’affaire que Lot vient de soumettre; « demande » explicite naturellement le référent tout en conservant la valeur additive de גַּם.
- source_word: לְבִלְתִּי הָפְכִּי
  choice: je ne renverserai pas
  rationale: La formulation exprime le résultat concret de la faveur accordée. « Renverser » maintient le lien avec la racine הפך et son image de bouleversement catastrophique, plutôt que de généraliser par « détruire ».
- source_word: הָעִיר אֲשֶׁר דִּבַּרְתָּ
  choice: la ville dont tu as parlé
  rationale: Rendu direct, naturel et suffisamment solennel de la ville mentionnée par Lot.
