  text: וַֽ/יהוָ֗ה הִמְטִ֧יר עַל סְדֹ֛ם וְ/עַל עֲמֹרָ֖ה גָּפְרִ֣ית וָ/אֵ֑שׁ מֵ/אֵ֥ת יְהוָ֖ה מִן הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: fr
  text: Alors Yahweh fit pleuvoir sur Sodome et Gomorrhe du soufre et du feu, venant de Yahweh des cieux[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu גָּפְרִית désigne le soufre. Certaines traductions anglaises traditionnelles disent « brimstone » (« soufre » dans un emploi ancien).
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « venant de Yahweh des cieux ». La répétition du nom divin est conservée plutôt que simplifiée.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin et conserve ses deux occurrences explicites dans l’hébreu.
- source_word: הִמְטִיר
  choice: fit pleuvoir
  rationale: Rend naturellement en français la forme causative du verbe tout en préservant l’image de ce qui tombe du ciel.
- source_word: גָּפְרִית
  choice: soufre
  rationale: Équivalent moderne et précis du nom hébreu; « soufre » est préférable à l’ancien « brimstone » des versions anglaises traditionnelles.
- source_word: אֵשׁ
  choice: feu
  rationale: Équivalent direct, coordonné à « soufre » comme second élément de ce que Yahweh fait pleuvoir.
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: sur Sodome et Gomorrhe
  rationale: Formulation française naturelle avec les formes usuelles des deux noms de lieux; la répétition hébraïque de la préposition n’est pas nécessaire en français.
- source_word: מֵאֵת יְהוָה
  choice: venant de Yahweh
  rationale: Marque explicitement l’origine et permet de conserver sans l’effacer la seconde occurrence du nom divin.
- source_word: מִן הַשָּׁמָיִם
  choice: depuis les cieux
  rationale: Conserve le pluriel hébreu et l’idée d’une provenance céleste, dans une formulation française intelligible.
- source_word: וַ
  choice: Alors
  rationale: Exprime la progression du récit de manière idiomatique en français moderne.
theological_decisions:
- issue: Répétition du nom divin dans « Yahweh… venant de Yahweh »
  choice: Conserver les deux occurrences dans le texte principal.
  alternative: « Alors Yahweh fit pleuvoir… depuis les cieux », sans répéter le nom divin.
  rationale: L’hébreu répète explicitement יהוה. La traduction ne simplifie pas cette formulation inhabituelle et ne tranche pas les questions possibles concernant l’agent ou la référence divine.
- issue: Sens de « les cieux »
  choice: Conserver le pluriel concret « les cieux ».
  alternative: « du ciel » ou « du haut du ciel ».
  rationale: Le pluriel reflète la forme hébraïque sans imposer une cosmologie ou une interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant un calque opaque; « venant de Yahweh » clarifie le rattachement de la provenance sans supprimer la répétition remarquable du nom divin.
