base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: fr
  text: 'Lot sortit donc parler à ses gendres[a], qui devaient épouser ses filles. Il leur dit : « Levez-vous ! Sortez de cet endroit, car Yahweh va détruire la ville. » Mais ses gendres crurent qu’il plaisantait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ses gendres, qui avaient épousé ses filles » ; l’expression hébraïque peut désigner soit des hommes déjà mariés aux filles de Lot, soit ceux qui allaient les épouser.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲתָנָיו
  choice: ses gendres
  rationale: חָתָן peut désigner un gendre ou un futur gendre. « Gendres » est le terme français naturel, tandis que la proposition suivante précise ici la relation sans trancher silencieusement l’ambiguïté.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: qui devaient épouser ses filles
  rationale: Le participe לֹקְחֵי, littéralement « prenant », désigne la prise en mariage. Le contexte narratif favorise des hommes promis aux filles de Lot, mais l’hébreu peut aussi s’entendre d’hommes les ayant déjà épousées; cette possibilité est signalée en note.
- source_word: קוּמוּ צְּאוּ
  choice: Levez-vous ! Sortez
  rationale: Les deux impératifs successifs expriment une urgence brusque. Deux phrases impératives brèves en conservent la vigueur dans un français naturel.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: de cet endroit
  rationale: Cette formulation restitue directement la préposition מן et le démonstratif הזה, tout en restant idiomatique après « Sortez ».
- source_word: מַשְׁחִית
  choice: va détruire
  rationale: Le participe hiphil décrit ici une destruction imminente qui n’a pas encore commencé. « Va détruire » exprime naturellement cette imminence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה; sa translittération préserve le nom propre plutôt que de lui substituer un titre.
- source_word: הָעִיר
  choice: la ville
  rationale: Traduction directe du nom défini, qui renvoie à la ville dont il est question dans le récit.
- source_word: כִּמְצַחֵק
  choice: crurent qu’il plaisantait
  rationale: L’expression indique que Lot leur parut agir comme quelqu’un qui plaisante. Cette formulation française rend leur perception sans imposer le sens plus fort de « se moquer ».
- source_word: בְּעֵינֵי חֲתָנָיו
  choice: ses gendres crurent
  rationale: Littéralement « aux yeux de ses gendres », l’idiome exprime leur appréciation. La tournure choisie est naturelle en français et conserve le point de vue des gendres.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Puisque le texte hébreu emploie directement le Tétragramme, « Yahweh » en conserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Statut matrimonial des hommes appelés חֲתָנָיו
  choice: des futurs gendres, avec l’ambiguïté indiquée en note
  alternative: des gendres déjà mariés aux filles de Lot
  rationale: Le participe לֹקְחֵי peut se rapporter à un mariage projeté ou déjà contracté. Le contexte immédiat favorise les fiancés, mais ne justifie pas d’effacer l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs brefs conservent l’urgence du discours. La dernière proposition privilégie un idiome français clair tout en maintenant l’idée hébraïque d’une apparence de plaisanterie.
