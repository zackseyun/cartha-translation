  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: fr
  text: 'Alors Juda dit à ses frères : « Que gagnerons-nous à tuer notre frère et à cacher son sang[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « cacher son sang » signifie dissimuler le meurtre ou la culpabilité qui en découle.
    reason: Explication de l’idiome hébraïque sans effacer son image dans le texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » rend naturellement cette succession en français moderne.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶל אֶחָיו
  choice: à ses frères
  rationale: Le masculin pluriel désigne ici les frères de Joseph présents dans le récit.
- source_word: מַה בֶּצַע
  choice: Que gagnerons-nous
  rationale: בֶּצַע évoque le gain, le profit ou l’avantage, souvent intéressé. Cette formulation idiomatique conserve le calcul pragmatique de Juda.
- source_word: כִּי נַהֲרֹג
  choice: à tuer
  rationale: Dans la question rhétorique, l’infinitif après « gagner » exprime naturellement en français l’éventualité envisagée, sans ajouter de nuance d’obligation.
- source_word: אָחִינוּ
  choice: notre frère
  rationale: Traduction directe qui maintient la force morale du lien familial.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: et à cacher son sang
  rationale: La formulation garde l’image hébraïque du sang tout en employant un verbe français naturel ; l’expression évoque la dissimulation du meurtre ou de la culpabilité.
