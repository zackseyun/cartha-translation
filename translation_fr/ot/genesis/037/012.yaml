  yaml_path: translation/ot/genesis/037/012.yaml
  text: His brothers went to pasture their father's flock at Shechem[a].
translation:
  language: fr
  text: Ses frères allèrent faire paître le troupeau de leur père à Sichem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans Sichem ». La préposition hébraïque peut situer l’action à l’intérieur de la localité, ou à cet endroit et dans ses environs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: allèrent
  rationale: Le wayyiqtol de הלך fait avancer le récit. Le passé simple convient au registre narratif français et n’ajoute aucun marqueur temporel absent de l’hébreu.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le nom désigne ici, dans le contexte, les frères de Joseph.
- source_word: לִרְעוֹת
  choice: faire paître
  rationale: L’infinitif de רעה exprime le but du déplacement et désigne l’action de conduire et nourrir le petit bétail; « faire paître » est naturel avec « troupeau ».
- source_word: אֶת
  choice: '[marque de l’objet direct non traduite]'
  rationale: אֵת introduit l’objet direct défini et n’a normalement pas d’équivalent lexical en français.
- source_word: צֹאן
  choice: le troupeau
  rationale: צֹאן est un collectif désignant le petit bétail, notamment les moutons et les chèvres. « Troupeau » évite de préciser indûment l’espèce.
- source_word: אֲבִיהֶם
  choice: de leur père
  rationale: La forme construite avec suffixe pronominal exprime la possession; cette tournure est idiomatique en français.
- source_word: בִּשְׁכֶם
  choice: à Sichem
  rationale: Le nom de lieu est translittéré selon son usage français traditionnel. La préposition ב peut situer l’action dans la localité ou à cet endroit et dans ses environs; « à Sichem » conserve naturellement cette latitude.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif écrit de la Genèse; aucun connecteur tel que « or » ou « alors » n’est ajouté.
