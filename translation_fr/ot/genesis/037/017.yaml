source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: fr
  text: 'L’homme lui dit : « Ils sont partis d’ici, car je les ai entendus dire : “Allons à Dotân[a].” » Joseph partit donc à la recherche de ses frères et les trouva à Dotân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le nom Dotân porte ici une terminaison indiquant la direction, littéralement « vers Dotân ».
    reason: cultural_note
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: Ils sont partis d’ici
  rationale: נסע évoque souvent le fait de lever le camp et de poursuivre sa route. « Sont partis d’ici » est naturel en français et conserve l’idée de départ sans ajouter explicitement l’image du campement.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison qui permet à l’homme d’indiquer la destination des frères de Joseph. « Car » convient au registre narratif digne et courant.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: je les ai entendus dire
  rationale: Le participe « disant » est rendu par la construction française idiomatique « entendre quelqu’un dire ». Le pronom « les », implicite en hébreu, renvoie naturellement aux frères de Joseph.
- source_word: נֵלְכָה
  choice: Allons
  rationale: Le cohortatif à la première personne du pluriel exprime une exhortation collective, directement rendue par « Allons ».
- source_word: דֹּתָיְנָה
  choice: à Dotân
  rationale: Le suffixe directionnel indique un mouvement vers la localité. En français, la préposition « à » exprime naturellement cette destination; une note signale la forme hébraïque.
- source_word: אַחַר אֶחָיו
  choice: à la recherche de ses frères
  rationale: Littéralement « après ses frères », l’expression décrit ici Joseph qui suit leur trace afin de les retrouver. « À la recherche de » rend clairement cette valeur contextuelle en français naturel.
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: les trouva à Dotân
  rationale: מצא signifie simplement « trouver » dans ce récit, et בְּ marque le lieu où Joseph les retrouve.
