base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: fr
  text: 'Puis ils le prirent et le jetèrent dans la fosse[a]. La fosse était vide : elle ne contenait pas d’eau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « citerne ». Le terme hébreu bor peut désigner une fosse ou une citerne ; la mention de l’absence d’eau s’accorde avec ce dernier sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: Puis ils le prirent
  rationale: Le waw consécutif fait progresser le récit. « Prirent » rend simplement לקח sans ajouter l’idée plus forte de saisir de force.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: et le jetèrent
  rationale: השליך signifie couramment « jeter ». Cette formulation moderne et naturelle conserve la violence de l’action sans l’intensifier.
- source_word: הַבֹּרָה
  choice: dans la fosse
  rationale: בּוֹר peut désigner une fosse, une citerne ou une cavité. « Fosse » préserve l’étendue du terme hébreu, tandis que « citerne » est signalé en note puisque l’absence d’eau favorise cette compréhension.
- source_word: וְהַבּוֹר רֵק
  choice: La fosse était vide
  rationale: La proposition fournit une précision explicative. En français, une nouvelle phrase sans conjonction rend naturellement cette fonction, et רֵק signifie « vide ».
- source_word: אֵין בּוֹ מָיִם
  choice: il n’y avait pas d’eau dedans
  rationale: Cette proposition précise en quel sens la fosse était vide et conserve la mention explicite de l’eau. « Dedans » est naturel et renvoie clairement à la fosse.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme bref de l’hébreu est conservé, avec deux phrases et une ponctuation explicative naturelle.
