  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: fr
  text: 'Ses frères lui dirent : « Est-ce que tu vas vraiment régner sur nous ? Est-ce que tu vas vraiment nous gouverner ? » Et ils le haïrent encore plus à cause de ses rêves et de ses paroles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: Est-ce que tu vas vraiment régner
  rationale: La construction hébraïque associe l’infinitif absolu au verbe conjugué pour renforcer la question. « Vraiment » restitue naturellement cette insistance en français moderne.
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: Est-ce que tu vas vraiment nous dominer
  rationale: Le second verbe exprime l’exercice de l’autorité ou de la maîtrise. « Dominer » maintient la nuance plus dure et le parallélisme contrasté avec « régner ».
- source_word: דְּבָרָיו
  choice: ses paroles
  rationale: דְּבָרִים peut désigner des paroles, des propos ou des choses. Ici, « ses paroles » renvoie naturellement à ce que Joseph a raconté au sujet de ses rêves, sans ajouter une interprétation.
theological_decisions:
- issue: Portée prophétique des rêves de Joseph
  choice: Conserver la réaction interrogative et hostile des frères sans qualifier ici les rêves de prophéties
  alternative: Expliciter que Joseph annonce son autorité future
  rationale: Le verset rapporte les paroles des frères et leur haine, mais ne formule pas encore explicitement un jugement théologique sur l’accomplissement des rêves.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions gardent l’insistance de l’hébreu et son parallélisme, tandis que « régner » et « dominer » préservent la distinction lexicale des deux verbes.
