base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: fr
  text: 'Puis il fit un autre rêve et le raconta à ses frères. Il dit : « Voici, j’ai encore fait un rêve : le soleil, la lune et onze étoiles se prosternaient devant moi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’inclinaient profondément devant moi ». Le verbe hébreu peut désigner une prosternation exprimant l’hommage ; ici, il ne s’agit pas nécessairement d’adoration divine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: Puis il fit encore un autre rêve
  rationale: Le wayyiqtol fait progresser le récit, rendu naturellement par « Puis ». La combinaison עוֹד…אַחֵר souligne qu’il s’agit d’un rêve supplémentaire; « encore un autre rêve » en conserve l’insistance.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: et le raconta à ses frères
  rationale: סִפֵּּר signifie raconter ou rapporter. « Le raconta » convient au registre narratif et reprend clairement le rêve.
- source_word: הִנֵּה
  choice: Écoutez
  rationale: Dans le discours direct, הִנֵּה attire l’attention des interlocuteurs. « Écoutez » est naturel en français moderne puisque Joseph annonce oralement son rêve, sans l’archaïsme de « voici » ou « voici que ».
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: j’ai encore fait un rêve
  rationale: Le français idiomatique dit « faire un rêve » plutôt que « rêver un rêve ». « Encore » maintient la répétition exprimée par עוֹד.
- source_word: וְהִנֵּה
  choice: ':'
  rationale: Le second הִנֵּה introduit la scène vue en rêve. Les deux-points rendent naturellement cette fonction présentative sans répéter un marqueur d’attention.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: le soleil, la lune et onze étoiles
  rationale: Traduction directe et idiomatique des astres et du nombre.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: se prosternaient devant moi
  rationale: Le participe décrit une action en cours dans la scène du rêve. « Se prosternaient devant moi » exprime l’hommage profond sans imposer l’idée d’un culte divin.
theological_decisions:
- issue: Sens de מִשְׁתַּחֲוִים dans le rêve de Joseph
  choice: hommage non cultuel (« se prosternaient devant moi »)
  alternative: « m’adoraient »
  rationale: Le contexte immédiat concerne la soumission et l’hommage au sein de la famille, puis leur accomplissement narratif, et non un culte rendu à Joseph. « Se prosterner » conserve néanmoins la force du geste sans effacer son ambiguïté lexicale générale.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste oral et accessible. La répétition de « rêve » et de « encore » reflète l’insistance de l’hébreu, tandis que les deux-points introduisent naturellement la scène du rêve.
