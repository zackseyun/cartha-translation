  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: fr
  text: Joseph fit un rêve[a], le raconta à ses frères, et ils le détestèrent encore davantage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Joseph rêva un rêve ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: Joseph fit un rêve
  rationale: La construction hébraïque associe le verbe חלם et le nom apparenté חֲלוֹם, littéralement « rêva un rêve ». En français moderne, « fit un rêve » exprime naturellement le même événement; la répétition étymologique est signalée en note.
- source_word: וַיַּגֵּד
  choice: le raconta
  rationale: Le verbe נגד signifie ici faire connaître ou raconter. Le pronom « le » reprend naturellement « un rêve »; « raconta » convient au contexte narratif.
- source_word: לְאֶחָיו
  choice: à ses frères
  rationale: Le nom masculin pluriel muni du suffixe de troisième personne du masculin singulier désigne directement les frères de Joseph.
- source_word: וַיּוֹסִפוּ עוֹד
  choice: encore davantage
  rationale: L’association de יסף et עוֹד marque une intensification supplémentaire. « Encore davantage » rend clairement l’escalade de leur haine.
- source_word: שְׂנֹא אֹתוֹ
  choice: ils le détestèrent
  rationale: Après יסף, l’infinitif exprime littéralement qu’ils ajoutèrent encore à leur haine. Une forme verbale conjuguée est nécessaire en français naturel; « détester » rend ici la forte hostilité exprimée par שׂנא.
- source_word: וַ
  choice: et / alors
  rationale: Les waw consécutifs font progresser le récit. Le premier est rendu par « et »; le second par « Alors » afin de marquer naturellement en français la réaction qui suit le récit du rêve, sans introduire un adverbe temporel absent de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation idiomatique « fit un rêve » évite une répétition peu naturelle, tandis que la note conserve la construction apparentée de l’hébreu. Deux phrases allègent la succession de propositions coordonnées sans modifier leur ordre logique.
