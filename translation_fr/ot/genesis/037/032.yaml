base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: fr
  text: 'Ils envoyèrent alors la tunique à manches longues[a] et l’apportèrent à leur père. Ils dirent : « Voici ce que nous avons trouvé. Reconnais, je te prie[b], si c’est la tunique de ton fils ou non. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tunique ornée », « la tunique richement décorée » ; traditionnellement, « la tunique multicolore ». Le sens de l’expression hébraïque est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « Identifie, je te prie ». Le verbe employé est significatif dans l’ensemble du récit, où reviennent les thèmes de la reconnaissance et de la méprise.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Ils envoyèrent alors
  rationale: Le piel de שלח signifie ici naturellement « envoyer ». « Alors » rend l’enchaînement narratif du waw sans alourdir le récit.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: la tunique à manches longues
  rationale: כְּתֹנֶת désigne une tunique ou un vêtement de type robe. Le sens de פַּסִּים est incertain, mais il peut évoquer un vêtement allant jusqu’aux paumes ou aux extrémités. Cette traduction retient un sens probable sans reprendre comme certaine la tradition des « nombreuses couleurs ».
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: et l’apportèrent à leur père
  rationale: Le pronom « l’ » reprend naturellement la tunique. « Leur père » suit le texte hébreu sans ajouter le nom de Jacob.
- source_word: זֹאת מָצָאנוּ
  choice: Voici ce que nous avons trouvé
  rationale: Cette formulation française naturelle conserve la simplicité calculée de la déclaration des frères. Le démonstratif זֹאת reste explicitement représenté par « voici ce que ».
- source_word: הַכֶּר נָא
  choice: Reconnais donc
  rationale: Le hiphil de נכר signifie « reconnaître, identifier ». « Reconnais » préserve le motif narratif important de la reconnaissance, tandis que « donc » rend ici la particule de sollicitation נָא de façon naturelle.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: si c’est la tunique de ton fils ou non
  rationale: La formulation conserve la question indirecte hébraïque et surtout l’expression distante « ton fils », par laquelle les frères évitent de nommer Joseph comme leur frère.
