  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: fr
  text: 'Il lui dit : « Va donc voir si tes frères vont bien et si le troupeau va bien, puis rapporte-moi des nouvelles. » Il l’envoya ainsi de la vallée d’Hébron, et Joseph arriva à Sichem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Va donc
  rationale: L’impératif לֶךְ est rendu directement par « va » ; « donc » donne naturellement en français la nuance d’encouragement ou d’insistance légère portée par נָא.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: voir si … vont bien
  rationale: La tournure française exprime naturellement l’idée de s’informer de l’état de quelqu’un tout en conservant le verbe concret « voir » et le sens contextuel de שָׁלוֹם.
- source_word: אַחֶיךָ
  choice: tes frères
  rationale: Le masculin pluriel désigne ici les frères de Joseph ; il n’y a pas lieu d’élargir la référence.
- source_word: הַצֹּאן
  choice: le troupeau
  rationale: צֹאן désigne collectivement le petit bétail, notamment les moutons et les chèvres ; « troupeau » reste naturel sans préciser indûment les espèces.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: puis rapporte-moi des nouvelles
  rationale: Cette expression signifie revenir avec une information ou faire un rapport. « Rapporte-moi des nouvelles » est idiomatique et maintient l’idée du retour d’information.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: de la vallée d’Hébron
  rationale: La traduction conserve explicitement עֵמֶק, « vallée », ainsi que sa relation avec Hébron.
- source_word: שְׁכֶמָה
  choice: à Sichem
  rationale: Le ה directionnel indique un mouvement vers Sichem, rendu normalement en français par la préposition « à ».
- source_word: וַיָּבֹא
  choice: Joseph arriva
  rationale: La répétition du nom en français lève sans lourdeur une possible hésitation créée par les deux pronoms masculins successifs, sans ajouter de contenu au récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition exacte de שְׁלוֹם est reflétée par « vont bien » dans les deux membres de la phrase. « Sichem » et « Hébron » suivent les formes françaises bibliques usuelles.
