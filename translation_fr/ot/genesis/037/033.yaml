  text: וַ/יַּכִּירָ֤/הּ וַ/יֹּ֨אמֶר֙ כְּתֹ֣נֶת בְּנִ֔/י חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ טָרֹ֥ף טֹרַ֖ף יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: fr
  text: 'Il la reconnut et dit : « C’est la tunique de mon fils. Une bête sauvage[a] l’a dévoré. Yosef[b] a certainement été déchiqueté[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une bête mauvaise » ; dans ce contexte, une bête dangereuse ou féroce.'
    reason: lexical_alternative
  - marker: b
    text: 'Forme française traditionnelle : « Joseph ». Hébreu : « Yosef ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu renforce le verbe par une répétition : « déchiqueté, oui, déchiqueté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: Il la reconnut
  rationale: Le hifil de נכר signifie « reconnaître, identifier ». Le pronom féminin renvoie à כְּתֹנֶת, « tunique », qui est également féminin en français.
- source_word: כְּתֹנֶת בְּנִי
  choice: la tunique de mon fils
  rationale: כְּתֹנֶת désigne un vêtement long de type tunique. Cette formulation rend naturellement la construction possessive en français.
- source_word: חַיָּה רָעָה
  choice: une bête sauvage
  rationale: Dans ce contexte, חַיָּה désigne une bête, et רָעָה la caractérise comme dangereuse ou féroce. « Bête sauvage » exprime clairement l’idée sans attribuer à l’animal une qualité morale.
- source_word: אֲכָלָתְהוּ
  choice: l’a dévoré
  rationale: « Dévorer » convient au contexte d’une attaque animale et rend le verbe plus naturellement que le simple « manger ».
- source_word: טָרֹף טֹרַף
  choice: a certainement été déchiqueté
  rationale: L’infinitif absolu suivi de la forme verbale passive intensifie l’affirmation. « Certainement » en marque la force, tandis que « déchiqueté » rend le sens violent de טרף dans ce contexte.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: La translittération « Yosef » reflète directement la forme hébraïque du nom, plutôt que sa forme française traditionnelle « Joseph ».
