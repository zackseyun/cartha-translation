  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: fr
  text: Jacob s’établit dans le pays où son père avait séjourné, au pays de Canaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Jacob s’établit
  rationale: Le verbe יׁשב au wayyiqtol fait avancer le récit et désigne ici le fait de résider ou de s’établir. « S’établit » est naturel en français et conserve davantage la nuance du verbe que le simple « habita », sans nécessairement impliquer une installation définitive.
- source_word: בְּאֶרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici un territoire. « Pays » convient au contexte géographique et reste idiomatique en français moderne.
- source_word: מְגוּרֵי אָבִיו
  choice: où son père avait séjourné
  rationale: מְגוּרֵי, construit avec אָבִיו, évoque les séjours ou la résidence de son père en tant qu’étranger. La proposition relative rend naturellement en français cette construction nominale hébraïque tout en préservant la nuance de séjour non autochtone.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: au pays de Canaan
  rationale: La seconde occurrence de בְּאֶרֶץ est conservée afin de respecter la répétition et l’apposition explicative de l’hébreu, tout en employant la contraction française naturelle « au ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « pays » reflète celle de l’hébreu. Aucun connecteur comme « maintenant » n’est ajouté, puisque le waw narratif ne contient pas à lui seul cet adverbe explicite.
