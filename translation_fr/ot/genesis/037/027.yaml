base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: fr
  text: « Allons, vendons-le aux Ismaélites et ne portons pas la main sur lui, car il est notre frère, notre propre chair. » Et ses frères l’écoutèrent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « suivirent son avis » ou « l’approuvèrent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Allons
  rationale: L’impératif pluriel de הלך sert ici à exhorter le groupe à agir; « Allons » est naturel dans une délibération et conserve cet élan.
- source_word: וְנִמְכְּרֶנּוּ
  choice: vendons-le
  rationale: La forme volitive à la première personne du pluriel exprime une proposition pressante; l’impératif français inclusif en rend clairement la force.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: aux Ismaélites
  rationale: Rend directement l’ethnonyme défini précédé de la préposition.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: et ne portons pas la main sur lui
  rationale: Cette formulation française naturelle conserve l’image hébraïque de la main tout en exprimant l’idée de ne pas lui faire violence directement.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison donnée à l’appui de la proposition de Juda, dans un registre narratif digne et courant.
- source_word: אָחִינוּ
  choice: notre frère
  rationale: Traduction directe du terme de parenté, sans l’atténuer.
- source_word: בְשָׂרֵנוּ
  choice: notre propre chair
  rationale: Préserve l’expression concrète hébraïque de la parenté étroite; « propre » explicite naturellement sa valeur en français.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: Et ses frères l’écoutèrent
  rationale: שמע peut signifier entendre, écouter ou suivre un avis. « L’écoutèrent » préserve cette amplitude sémantique sans imposer trop explicitement « acceptèrent ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’expression « porter la main sur » conserve l’image de l’hébreu tout en restant idiomatique. La note maintient l’ambiguïté contextuelle de שמע.
