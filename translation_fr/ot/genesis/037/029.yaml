  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: fr
  text: Ruben revint à la fosse[a], et voici que Joseph n’était pas dans la fosse. Alors il déchira ses vêtements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la citerne » (hébreu : bor).'
    reason: lexical_alternative
  - marker: b
    text: Déchirer ses vêtements était une manière habituelle d’exprimer le deuil, le bouleversement ou la détresse.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le verbe שׁוב exprime ici le retour de Ruben à un lieu où il s’était déjà trouvé. « Revint » est naturel et conserve ce mouvement sans en préciser davantage les circonstances.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: la fosse / dans la fosse
  rationale: Le nom בּוֹר peut désigner une fosse ou une citerne. « Fosse » est clair, idiomatique et convient à la fonction de ce lieu dans le récit; « citerne » reste une possibilité lexicale signalée en note.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: הִנֵּה attire brusquement l’attention sur la découverte de Ruben. « Et voici que » en préserve la force narrative dans un registre digne, sans supprimer ce marqueur de surprise.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: Joseph n’était pas dans la fosse
  rationale: אֵין indique l’absence. Cette formulation française rend directement le constat, sans ajouter que Joseph était « parti » ni expliquer comment il avait disparu.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: Alors il déchira ses vêtements
  rationale: L’expression décrit le geste conventionnel de déchirer ses vêtements sous le coup du deuil ou de la détresse. « Vêtements » est plus courant en français moderne que « habits » ou « vêtements de dessus », et « alors » marque naturellement la réaction successive exprimée par la narration hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « et voici que » conserve l’effet soudain du marqueur narratif hébreu, tandis que « fosse » privilégie la compréhension immédiate; l’autre sens possible est maintenu en note.
