  text: וַ/יֹּ֨אמֶר יִשְׂרָאֵ֜ל אֶל יוֹסֵ֗ף הֲ/ל֤וֹא אַחֶ֨י/ךָ֙ רֹעִ֣ים בִּ/שְׁכֶ֔ם לְכָ֖/ה וְ/אֶשְׁלָחֲ/ךָ֣ אֲלֵי/הֶ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ הִנֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: fr
  text: 'Israël dit à Joseph : « Tes frères ne font-ils pas paître les troupeaux[a] à Sichem ? Va, je vais t’envoyer vers eux. » Joseph lui répondit : « Me voici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne gardent-ils pas les troupeaux » ; le verbe peut désigner le fait de mener les bêtes au pâturage ou, plus largement, d’en prendre soin.
    reason: alternative lexicale
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie ici le nom Israël, et non Jacob ; la forme française traditionnelle est conservée.
- source_word: הֲלוֹא
  choice: ne… pas ?
  rationale: La tournure interrogative française préserve la question rhétorique qui appelle une réponse affirmative.
- source_word: אַחֶיךָ
  choice: tes frères
  rationale: Le pluriel masculin muni du suffixe de deuxième personne désigne directement les frères de Joseph.
- source_word: רֹעִים
  choice: font paître les troupeaux
  rationale: Le participe de רעה décrit l’activité pastorale. Cette formulation est naturelle en français et rend explicite l’objet sous-entendu par le contexte, sans préciser une espèce animale.
- source_word: בִּשְׁכֶם
  choice: à Sichem
  rationale: La préposition ב indique ici le lieu ; « à » est l’usage français naturel devant un nom de ville.
- source_word: לְכָה
  choice: Va
  rationale: Dans ce contexte d’envoi vers des personnes absentes, l’impératif idiomatique se rend naturellement par « Va » en français.
- source_word: וְאֶשְׁלָחֲךָ
  choice: je vais t’envoyer
  rationale: La formulation exprime naturellement en français l’intention immédiate du locuteur après l’impératif.
- source_word: אֲלֵיהֶם
  choice: vers eux
  rationale: Le pronom renvoie aux frères ; « vers eux » conserve la direction exprimée par la préposition hébraïque.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: Cette formule française traditionnelle et toujours intelligible restitue la réponse de disponibilité exprimée par l’hébreu.
