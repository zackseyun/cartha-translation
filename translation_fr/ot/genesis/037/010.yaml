  text: וַ/יְסַפֵּ֣ר אֶל אָבִי/ו֮ וְ/אֶל אֶחָי/ו֒ וַ/יִּגְעַר בּ֣/וֹ אָבִ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָ֛ה הַ/חֲל֥וֹם הַ/זֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲ/ב֣וֹא נָב֗וֹא אֲנִי֙ וְ/אִמְּ/ךָ֣ וְ/אַחֶ֔י/ךָ לְ/הִשְׁתַּחֲוֺ֥ת לְ/ךָ֖ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: fr
  text: 'Il raconta son rêve à son père et à ses frères. Son père le réprimanda et lui dit : « Qu’est-ce que ce rêve que tu as fait ? Allons-nous vraiment venir, moi, ta mère et tes frères, nous prosterner devant toi jusqu’à terre[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous incliner profondément devant toi ». Le verbe hébreu décrit ici un geste de soumission ou de profonde déférence, pas nécessairement un acte d’adoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Il raconta son rêve
  rationale: Le piel de ספר signifie « raconter, relater ». L’objet, non exprimé en hébreu, est clairement le rêve dans le contexte ; le préciser donne un français naturel.
- source_word: וַיִּגְעַר בּוֹ
  choice: le réprimanda
  rationale: גער désigne une réprimande verbale énergique. « Réprimanda » conserve cette force dans un registre digne et courant.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: Qu’est-ce que ce rêve que tu as fait ?
  rationale: Cette formulation garde la question rhétorique et la reprise du nom et du verbe apparentés en hébreu, tout en employant l’expression française idiomatique « faire un rêve ».
- source_word: הֲבוֹא נָבוֹא
  choice: Faudra-t-il vraiment que nous venions
  rationale: L’infinitif absolu associé au verbe conjugué renforce l’action. « Vraiment » restitue cette insistance, tandis que « faudra-t-il » rend bien la question indignée dans ce contexte sans la transformer en simple prédiction.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: moi, ta mère et tes frères
  rationale: La liste des sujets est conservée dans un ordre proche de l’hébreu, avec une syntaxe française naturelle.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה
  choice: nous prosterner devant toi jusqu’à terre
  rationale: השתחוה exprime ici une profonde marque de soumission ou de déférence, et אָרְצָה en précise le mouvement vers le sol. « Se prosterner… jusqu’à terre » rend les deux éléments sans introduire l’idée cultuelle d’adoration.
theological_decisions:
- issue: Sens de השתחוה dans un contexte familial non cultuel
  choice: nous prosterner devant toi jusqu’à terre
  alternative: t’adorer
  rationale: Le verbe peut désigner l’adoration dans d’autres contextes, mais il évoque ici un geste de profonde déférence et de soumission devant Joseph. La traduction retenue préserve le geste sans lui attribuer nécessairement une portée religieuse.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve l’indignation du père ainsi que l’insistance de la construction hébraïque, sans lourdeur littérale.
