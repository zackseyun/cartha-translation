  to: 'Il raconta son rêve à son père et à ses frères. Son père le réprimanda et lui dit : « Qu’est-ce que ce rêve que tu as fait ? Allons-nous vraiment venir, moi, ta mère et tes frères, nous prosterner devant toi jusqu’à terre[a] ? »'
