  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: fr
  text: Des hommes madianites, des marchands, passèrent par là. Ils[b] tirèrent Joseph vers le haut et le sortirent de la citerne, puis vendirent Joseph aux Ismaélites pour vingt pièces d’argent[a]. Ils l’emmenèrent en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour vingt d’argent »; l’unité n’est pas précisée dans le texte hébreu.'
    reason: lexical_alternative
  - marker: b
    text: Les verbes hébreux sont au pluriel (« ils tirèrent », « ils sortirent », « ils vendirent », « ils emmenèrent »). Puisque le verset mentionne des marchands madianites et des Ismaélites, l’identité précise des acteurs à chaque étape demeure quelque peu ambiguë.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: passèrent par là
  rationale: Le verbe עבר décrit ici le passage des marchands près du lieu; « passèrent par là » est naturel en français et ne transforme pas ce passage en simple arrivée.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: des hommes madianites, des marchands
  rationale: Cette formulation conserve à la fois אֲנָשִׁים, le gentilé « madianites » et l’apposition « marchands », sans alourdir excessivement la phrase.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: tirèrent Joseph vers le haut et le sortirent
  rationale: La traduction maintient les deux verbes successifs, l’un exprimant l’action de tirer et l’autre le mouvement ascendant hors de la citerne, tout en restant idiomatique en français.
- source_word: מִן הַבּוֹר
  choice: de la citerne
  rationale: Dans ce récit, בּוֹר désigne une cavité qui pouvait servir de citerne; le contexte immédiat précise qu’elle ne contenait pas d’eau. « Citerne » est donc concret et historiquement approprié.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: aux Ismaélites
  rationale: Le complément introduit par ל est explicite et le texte distingue ainsi les Ismaélites des marchands madianites mentionnés auparavant.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: pour vingt pièces d’argent
  rationale: L’hébreu dit littéralement « pour vingt d’argent » sans nommer l’unité. « Pièces » rend la somme compréhensible sans préciser indûment qu’il s’agissait de sicles.
- source_word: וַיָּבִיאוּ אֶת יוֹסֵף מִצְרָיְמָה
  choice: Ils l’emmenèrent en Égypte
  rationale: Le verbe causatif de mouvement et la terminaison directionnelle de מִצְרָיְמָה indiquent que Joseph fut conduit jusqu’en Égypte; « emmenèrent en Égypte » est naturel en français narratif.
theological_decisions:
- issue: Référent des verbes au pluriel après la mention des Madianites et des Ismaélites
  choice: Conserver le pronom pluriel « ils » sans identifier davantage ses référents
  alternative: Attribuer toutes les actions aux marchands madianites, ou attribuer la vente et le transport aux Ismaélites
  rationale: La suite hébraïque emploie des verbes au pluriel alors que deux groupes sont nommés dans le verset. La traduction ne tranche pas une tension narrative que le texte hébreu laisse ouverte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant la répétition du nom de Joseph lors de la vente et la distinction entre Madianites et Ismaélites. Les notes signalent uniquement les précisions que le français courant oblige à fournir ou les ambiguïtés réelles de l’hébreu.
