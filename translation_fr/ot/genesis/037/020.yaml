source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: fr
  text: 'Allons, tuons-le et jetons-le dans l’une des fosses[a]. Nous dirons : « Une bête sauvage l’a dévoré. » Nous verrons ce que deviendront ses rêves.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’une des citernes ». Le mot hébreu peut désigner une fosse, une citerne ou une cavité semblable à un puits, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois le lien avec ce qui précède et l’urgence temporelle de la proposition.
- source_word: לְכוּ
  choice: venez
  rationale: L’impératif pluriel fonctionne ici comme une exhortation idiomatique qui introduit l’action proposée.
- source_word: וְנַהַרְגֵהוּ
  choice: tuons-le
  rationale: Le cohortatif exprime une proposition d’action collective.
- source_word: וְנַשְׁלִכֵהוּ
  choice: jetons-le
  rationale: Traduction directe, naturelle et actuelle du verbe « jeter ».
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: dans l’une de ces citernes
  rationale: Dans le contexte du récit, בּוֹר désigne vraisemblablement une citerne creusée; « ces » rend naturellement l’article défini hébreu avec « l’une de ».
- source_word: וְאָמַרְנוּ
  choice: Nous dirons
  rationale: Le parfait avec waw présente l’étape suivante du projet formulé par les frères.
- source_word: חַיָּה רָעָה
  choice: une bête féroce
  rationale: « Bête » convient au contexte sauvage, tandis que « féroce » exprime la dangerosité portée par רָעָה sans suggérer une espèce précise.
- source_word: אֲכָלָתְהוּ
  choice: l’a dévoré
  rationale: Bien que le verbe signifie littéralement « manger », « dévorer » est l’expression française naturelle lorsqu’une bête sauvage tue et mange une personne.
- source_word: וְנִרְאֶה
  choice: Nous verrons alors
  rationale: Conserve l’ambiguïté entre la nuance volitive et le futur tout en faisant ressortir la conséquence ironique du complot.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: ce que deviendront ses rêves
  rationale: Formulation française idiomatique qui conserve l’idée de l’issue future des rêves de Joseph et le ton de défi.
theological_decisions:
- issue: Portée de la dernière proposition
  choice: La phrase « Nous verrons alors… » reste dans les paroles des frères.
  alternative: La traiter comme un commentaire du narrateur.
  rationale: La syntaxe et la dynamique du discours présentent toute la proposition, y compris la raillerie finale, comme les paroles des frères.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Les deux-points marquent l’exhortation qui suit « venez »; le point d’exclamation final rend le ton provocateur sans ajouter de contenu lexical. Le marqueur [a] figure immédiatement après le terme annoté.
