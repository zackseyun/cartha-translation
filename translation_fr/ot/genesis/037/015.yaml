  text: וַ/יִּמְצָאֵ֣/הוּ אִ֔ישׁ וְ/הִנֵּ֥ה תֹעֶ֖ה בַּ/שָּׂדֶ֑ה וַ/יִּשְׁאָלֵ֧/הוּ הָ/אִ֛ישׁ לֵ/אמֹ֖ר מַה תְּבַקֵּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: fr
  text: 'Un homme le trouva errant dans la campagne et lui demanda : « Que cherches-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: le trouva
  rationale: Le qal de מצא signifie couramment « trouver ». La tournure française conserve le sens direct du récit.
- source_word: אִישׁ
  choice: un homme
  rationale: איש désigne ici un individu masculin non identifié ; « un homme » en garde la référence concrète.
- source_word: וְהִנֵּה תֹעֶה
  choice: errant
  rationale: תעה évoque le fait de s'égarer ou d'errer. « Errant » préserve cette nuance sans affirmer explicitement qu'il était entièrement perdu. La valeur présentative de הנה est rendue naturellement par la construction descriptive, plutôt que par le littéral et peu idiomatique « voici ».
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שדה peut désigner un champ ou les terres ouvertes. Ici, Joseph cherche ses frères dans une zone de pâturage ; « dans la campagne » est naturel et évite de suggérer nécessairement une parcelle cultivée précise.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: lui demanda
  rationale: שאל signifie demander ou interroger. « Lui demanda » introduit naturellement la question directe.
- source_word: לֵאמֹר
  choice: —
  rationale: La formule hébraïque introduisant le discours direct n'a pas besoin d'un équivalent lexical distinct en français ; les deux-points remplissent cette fonction avec naturel.
- source_word: מַה תְּבַקֵּשׁ
  choice: Que cherches-tu ?
  rationale: בקש signifie « chercher ». Cette formulation est concise, actuelle et conserve l'objet interrogatif indéfini מַה.
