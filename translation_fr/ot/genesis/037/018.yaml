source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אֹת֖/וֹ מֵ/רָחֹ֑ק וּ/בְ/טֶ֨רֶם֙ יִקְרַ֣ב אֲלֵי/הֶ֔ם וַ/יִּֽתְנַכְּל֥וּ אֹת֖/וֹ לַ/הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: fr
  text: Ils le virent de loin et, avant qu’il ne s’approche d’eux, ils complotèrent[a] contre lui pour le faire mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tramèrent un mauvais coup contre lui ». Le verbe hébreu peut évoquer une manœuvre trompeuse ou un complot; ici, la suite précise que leur intention était de le tuer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: Ils le virent de loin
  rationale: Le qal narratif de ראה exprime une action passée dans la suite du récit. « De loin » rend naturellement מֵרָחֹק en français moderne.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: et, avant qu’il ne s’approche d’eux
  rationale: בְּטֶרֶם introduit l’antériorité temporelle, et קרב signifie « s’approcher ». Le « ne » est explétif et ne donne pas à la proposition un sens négatif.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: ils complotèrent contre lui
  rationale: Le hitpael de נכל désigne ici une manœuvre hostile ou trompeuse dirigée contre Joseph; le contexte suivant précise qu’il s’agit d’un complot meurtrier.
- source_word: לַהֲמִיתוֹ
  choice: pour le faire mourir
  rationale: L’infinitif hiphil de מות avec suffixe masculin singulier exprime le but du complot. « Faire mourir » conserve la valeur causative du hiphil tout en restant clair.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La coordination hébraïque est conservée sans alourdir la phrase. Le marqueur de note est placé sur le verbe concerné plutôt qu’après « de loin », conformément à la question lexicale réelle.
