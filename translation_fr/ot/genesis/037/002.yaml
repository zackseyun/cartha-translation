translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la valeur structurante de תֹּלְדוֹת, la difficulté syntaxique de la proposition sur les fils de Bilha et de Zilpa, ainsi que le pluriel explicite de « leur père », tout en évitant un calque excessivement lourd.
