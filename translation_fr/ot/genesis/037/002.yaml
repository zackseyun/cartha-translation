  naturalness: L’ensemble est clair et de registre moderne. « Joseph apporta à leur père un mauvais rapport à leur sujet » est cependant un calque peu idiomatique en français courant ; « fit à leur père un rapport défavorable sur eux » est plus naturel tout en conservant le caractère non spécifié du rapport.
  terminology: « Faisait paître », « encore jeune », « femmes de son père » et « leur père » sont appropriés. Les noms Bilha et Zilpa sont conservés de manière cohérente. « Rapport défavorable » évite de décider si l’accusation était mensongère, malveillante ou fondée.
