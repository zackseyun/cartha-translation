base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: fr
  text: Voici l’histoire de Jacob[a]. Joseph, âgé de dix-sept ans, faisait paître le troupeau avec ses frères. Encore jeune, il était avec les fils de Bilha et les fils de Zilpa, femmes de son père[c]. Joseph fit à leur père[b] un rapport défavorable sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Voici la descendance de Jacob ». Le mot hébreu peut introduire une nouvelle section de la Genèse et désigner ce qui procède d’une personne, et pas seulement ses descendants biologiques.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit « leur père » : Jacob est présenté comme le père commun de Joseph et de ses frères.'
    reason: lexical_alternative
  - marker: c
    text: 'La construction hébraïque est difficile. On peut aussi comprendre : « Il faisait paître le troupeau avec ses frères — lui qui était encore jeune —, avec les fils de Bilha et les fils de Zilpa, femmes de son père. »'
    reason: textual_syntax
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: descendance
  rationale: Le terme sert de formule structurante dans la Genèse et désigne ce qui procède de Jacob, notamment l’histoire de sa lignée. « Descendance » conserve ce sens technique, tandis qu’une note signale les autres valeurs possibles.
- source_word: הָיָה רֹעֶה
  choice: faisait paître
  rationale: La construction exprime une activité en cours. « Faisait paître » est naturel en français et conserve l’image pastorale.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: le troupeau avec ses frères
  rationale: La formulation indique que Joseph participait au travail du troupeau en compagnie de ses frères, et non qu’il faisait paître ses frères.
- source_word: נַעַר
  choice: encore jeune
  rationale: Joseph vient d’être présenté comme âgé de dix-sept ans. Cette formulation rend son jeune âge sans le faire passer pour un petit enfant et s’intègre naturellement à la proposition circonstancielle difficile.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: avec les fils de Bilha et les fils de Zilpa
  rationale: La syntaxe hébraïque est difficile, mais l’association de Joseph à ces demi-frères est la lecture la moins interprétative. La répétition de « les fils » reflète celle du texte source.
- source_word: נְשֵׁי אָבִיו
  choice: femmes de son père
  rationale: « Femmes » est ici le terme biblique naturel pour désigner Bilha et Zilpa comme épouses ou compagnes reconnues de Jacob, sans ajouter une précision de statut absente de cette expression.
- source_word: דִּבָּתָם רָעָה
  choice: un mauvais rapport à leur sujet
  rationale: Cette traduction garde ouverte la question de savoir si le rapport était véridique, malveillant ou simplement défavorable; elle n’introduit donc pas l’idée plus précise de calomnie.
- source_word: אֶל אֲבִיהֶם
  choice: à leur père
  rationale: Le suffixe hébreu est au pluriel et présente Jacob comme le père commun de Joseph et de ses frères; cette forme est conservée malgré la possibilité d’une tournure française plus attendue au singulier possessif.
