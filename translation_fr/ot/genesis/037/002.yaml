  to: Voici l’histoire de Jacob[a]. Joseph, âgé de dix-sept ans, faisait paître le troupeau avec ses frères. Encore jeune, il était avec les fils de Bilha et les fils de Zilpa, femmes de son père[c]. Joseph fit à leur père[b] un rapport défavorable sur eux.
