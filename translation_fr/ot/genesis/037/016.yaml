  text: וַ/יֹּ֕אמֶר אֶת אַחַ֖/י אָנֹכִ֣י מְבַקֵּ֑שׁ הַגִּֽידָ/ה נָּ֣א לִ֔/י אֵיפֹ֖ה הֵ֥ם רֹעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: fr
  text: 'Il dit : « Je cherche mes frères. Dis-moi, s’il te plaît, où ils font paître[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « où ils gardent les troupeaux » ou « où ils font paître les bêtes ». Le participe hébreu désigne l’activité de faire paître ou de garder des animaux; aucun complément n’est exprimé dans ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Le wayyiqtol de אמר poursuit le récit. Dans ce contexte de dialogue, « répondit » rend naturellement la prise de parole de Joseph en réaction à la question précédente, sans conserver mécaniquement le waw narratif.
- source_word: אֶת אַחַי
  choice: mes frères
  rationale: אֶת marque le complément d’objet direct défini, et אַחַי désigne les frères de Joseph.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: Je cherche
  rationale: Le pronom indépendant suivi du participe exprime une action en cours. En français moderne, le présent « je cherche » restitue naturellement cette valeur progressive.
- source_word: הַגִּידָה נָּא לִי
  choice: Dis-moi, s’il te plaît
  rationale: L’impératif hiphil de נגד, accompagné de נָא, formule une demande polie. Cette tournure conserve à la fois l’impératif et la courtoisie.
- source_word: אֵיפֹה הֵם
  choice: où ils
  rationale: L’adverbe interrogatif demande le lieu, tandis que le pronom explicite הֵם fournit le sujet du participe suivant.
- source_word: רֹעִים
  choice: font paître le troupeau
  rationale: Le participe qal de רעה désigne ici l’activité pastorale des frères. Le français requiert plus naturellement un complément ; « le troupeau » reste générique et découle clairement du contexte, tout en évitant l’ambiguïté de « où ils paissent ».
