  naturalness: « Je cherche mes frères. Dis-moi, s’il te plaît, où ils font paître » est une formulation moderne et intelligible en français international. L’emploi absolu de « faire paître » évite l’ajout d’un objet tout en conservant l’activité de pâturage; la note explicite les possibilités françaises plus développées.
