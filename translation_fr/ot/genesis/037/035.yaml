  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: fr
  text: 'Alors tous ses fils et toutes ses filles se levèrent pour le consoler. Mais il refusa de se laisser consoler et dit : « Car je descendrai au Shéol, vers mon fils, en deuil. » Et son père le pleura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le verbe קום marque ici l’action de se lever pour intervenir; cette formulation conserve le mouvement narratif sans le surinterpréter.
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: tous ses fils et toutes ses filles
  rationale: L’hébreu distingue explicitement les fils et les filles; la traduction maintient cette distinction.
- source_word: לְנַחֲמוֹ
  choice: pour le consoler
  rationale: Dans ce contexte de deuil, le piel de נחם désigne l’action d’apporter consolation et réconfort.
- source_word: וַיְמָאֵן לְהִתְנַחֵם
  choice: il refusa de se laisser consoler
  rationale: Cette tournure française naturelle rend à la fois le refus exprimé par מאן et la valeur médio-passive du hitpael de נחם.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication donnée par Jacob pour justifier son refus d’être consolé.
- source_word: אֵרֵד
  choice: je descendrai
  rationale: La traduction conserve le mouvement descendant de ירד, qui accompagne couramment l’évocation du Shéol.
- source_word: אֶל־בְּנִי
  choice: vers mon fils
  rationale: La préposition אֶל exprime le mouvement en direction de quelqu’un; « vers mon fils » conserve cette formulation sans ajouter que Joseph serait dans une tombe précise.
- source_word: אָבֵל
  choice: en deuil
  rationale: Le terme décrit Jacob dans son état de personne endeuillée et se rattache naturellement en français à sa descente annoncée.
- source_word: שְׁאֹלָה
  choice: au Shéol
  rationale: La translittération préserve le terme hébreu et son champ de sens, plus large et moins précis qu’une simple tombe; une note en donne une explication accessible.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: Et son père le pleura
  rationale: La formulation conserve le sujet « son père » et l’objet pronominal renvoyant à Joseph, tout en restant concise et naturelle en français.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: Shéol
  alternative: le séjour des morts; la tombe
  rationale: Le mot hébreu évoque le domaine des morts sans définir ici avec précision la condition de Joseph ni développer une doctrine de l’au-delà. Le conserver évite de le réduire à la seule tombe ou de lui imposer une conception théologique ultérieure.
- issue: Relation entre Jacob et son fils dans l’expression אֶל־בְּנִי
  choice: vers mon fils
  alternative: auprès de mon fils
  rationale: « Vers mon fils » suit la préposition hébraïque et préserve la tension du propos de Jacob, qui croit rejoindre son fils au Shéol, sans préciser davantage la nature de cette réunion.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « tous ses fils et toutes ses filles » est maintenue parce qu’elle est explicite en hébreu. La place de « en deuil » préserve son lien avec la descente annoncée tout en évitant une syntaxe française trop lourde.
