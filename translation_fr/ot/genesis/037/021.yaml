  text: וַ/יִּשְׁמַ֣ע רְאוּבֵ֔ן וַ/יַּצִּלֵ֖/הוּ מִ/יָּדָ֑/ם וַ/יֹּ֕אמֶר לֹ֥א נַכֶּ֖/נּוּ נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: fr
  text: 'Mais Ruben entendit cela ; il le délivra de leurs mains et dit : « Ne lui ôtons pas la vie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne le frappons pas à mort. » L’hébreu dit littéralement : « Ne le frappons pas quant à la vie », expression qui désigne un coup mortel.'
    reason: La tournure hébraïque est idiomatique et permet une traduction qui conserve davantage l’image du verbe « frapper ».
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: entendit cela
  rationale: Le verbe שׁמע signifie d’abord « entendre ». « Cela » explicite naturellement en français le contenu entendu, à savoir le projet exprimé au verset précédent, sans en préciser davantage la nature.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et courante du nom propre hébreu רְאוּבֵן.
- source_word: וַיַּצִּלֵהוּ
  choice: il le délivra
  rationale: Au hiphil, נצל signifie « délivrer, arracher au danger ». « Délivra » convient au registre narratif et indique l’intervention de Ruben en faveur de Joseph.
- source_word: מִיָּדָם
  choice: de leurs mains
  rationale: Cette formulation conserve l’image hébraïque de la main comme expression du pouvoir exercé sur quelqu’un, tout en employant le pluriel naturel en français.
- source_word: וַיֹּאמֶר
  choice: et dit
  rationale: Formule narrative française simple correspondant à l’introduction hébraïque du discours direct.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: Ne lui ôtons pas la vie
  rationale: L’expression associe נכה, « frapper », à נֶפֶשׁ, « vie, personne », pour désigner un coup mortel. La traduction exprime clairement le sens idiomatique tout en conservant l’idée de la vie comme objet de l’acte.
