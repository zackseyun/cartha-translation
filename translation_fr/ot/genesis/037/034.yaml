  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: fr
  text: Alors Jacob déchira ses vêtements, mit une toile de sac autour de sa taille[a] et porta le deuil de son fils pendant de nombreux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « sur ses reins » ; c’est-à-dire à la taille.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: déchira
  rationale: Dans un contexte de deuil, קרע désigne l’action de déchirer ses vêtements en signe d’affliction. « Déchira » conserve cette action concrète et conventionnelle.
- source_word: שִׂמְלֹתָיו
  choice: ses vêtements
  rationale: שִׂמְלָה désigne de manière générale les vêtements. « Ses vêtements » est naturel en français moderne et évite la précision injustifiée de « robes ».
- source_word: שַׂק
  choice: une toile de sac
  rationale: שַׂק désigne une étoffe grossière portée en signe de deuil. « Toile de sac » est l’expression biblique française usuelle tout en restant compréhensible.
- source_word: בְּמָתְנָיו
  choice: autour de sa taille
  rationale: מָתְנַיִם renvoie à la région des reins ou de la taille. « Autour de sa taille » exprime naturellement la position en français moderne; la formulation plus littérale est signalée en note.
- source_word: וַיִּתְאַבֵּל
  choice: porta le deuil
  rationale: La forme verbale de אבל évoque le fait de prendre le deuil et d’en observer les manifestations. « Porta le deuil » rend ici cette dimension mieux que le seul sentiment de tristesse.
- source_word: עַל־בְּנוֹ
  choice: de son fils
  rationale: Avec le vocabulaire du deuil, עַל introduit la personne pour laquelle on mène deuil. En français, « porter le deuil de son fils » est l’expression idiomatique.
- source_word: יָמִים רַבִּים
  choice: pendant de nombreux jours
  rationale: La locution signifie littéralement « de nombreux jours » et indique la durée. L’ajout de « pendant » est nécessaire à une syntaxe française naturelle.
theological_decisions: []
