  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: fr
  text: Israël aima Joseph plus que tous ses autres fils, parce qu’il était le fils de sa vieillesse ; et il lui fit une tunique richement ornée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « une tunique de plusieurs couleurs ». Le sens de l’expression hébraïque est incertain ; elle peut désigner une tunique richement ornée ou un vêtement descendant jusqu’aux poignets et aux chevilles, sans faire nécessairement référence à ses couleurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: Israël
  rationale: Le nom personnel employé dans l’hébreu est conservé. Le וְ narratif n’exige pas ici un « et » en tête de phrase en français.
- source_word: אָהַב
  choice: aimait
  rationale: Le verbe hébreu signifie directement « aimer » ; le contexte implique une préférence, mais celle-ci n’est pas substituée au sens lexical.
- source_word: מִכָּל בָּנָיו
  choice: plus que tous ses autres fils
  rationale: La construction exprime la comparaison. « autres » rend explicite en français que Joseph appartient lui-même au groupe des fils sans modifier le sens.
- source_word: כִּי בֶן זְקֻנִים הוּא לוֹ
  choice: parce qu’il était le fils de sa vieillesse
  rationale: Cette formulation conserve l’image et l’ambiguïté relative de l’expression hébraïque, plutôt que de préciser qu’il serait nécessairement né dans la vieillesse d’Israël.
- source_word: וְעָשָׂה לוֹ
  choice: Il lui avait fait
  rationale: Le plus-que-parfait exprime naturellement en français l’action antérieure dont le vêtement est ensuite un élément établi du récit ; le pronom indirect rend לוֹ.
- source_word: כְּתֹנֶת פַּסִּים
  choice: une tunique d’apparat
  rationale: כְּתֹנֶת désigne une tunique ou robe, tandis que פַּסִּים est incertain. « d’apparat » évoque un vêtement distinctif et ouvragé sans affirmer qu’il était multicolore ou précisément à manches longues.
