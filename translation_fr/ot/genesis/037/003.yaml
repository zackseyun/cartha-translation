  - severity: low
    issue: « Tunique d’apparat » est trop spécifique
    rationale: Cette expression peut évoquer un vêtement cérémoniel. Le texte hébreu décrit un type de tunique dont la qualification est disputée, sans indiquer explicitement un usage d’apparat.
