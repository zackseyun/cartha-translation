  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: fr
  text: Ses frères furent jaloux de lui, mais son père garda cette parole en mémoire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « garda la chose présente à l’esprit » ou « retint l’affaire » : il n’oublia pas le récit de Joseph et continua à y réfléchir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ בֹו
  choice: furent jaloux de lui
  rationale: Le verbe קנא avec ב désigne ici la jalousie ou l'envie suscitée par Joseph et ses rêves. « Être jaloux de lui » est naturel en français et convient au contexte.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le masculin pluriel désigne explicitement les frères de Joseph dans ce récit.
- source_word: וְאָבִיו
  choice: mais son père
  rationale: Bien que ו soit normalement rendu par « et », les réactions du père et des frères sont mises en contraste; « mais » exprime naturellement ce rapport discursif.
- source_word: שָׁמַר
  choice: garda … en mémoire
  rationale: שׁמר signifie fondamentalement « garder »; dans ce contexte, Jacob retient attentivement ce qui a été dit et continue d'y réfléchir.
- source_word: אֶת־הַדָּבָר
  choice: cette parole
  rationale: דבר peut désigner une parole, une chose ou une affaire. « Cette parole » conserve le lien avec le récit du rêve tout en laissant ouverte la portée de son contenu.
