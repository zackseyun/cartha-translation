base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: fr
  text: 'Ruben leur dit : « Ne versez pas de sang. Jetez-le dans cette citerne[a] qui se trouve dans la région désertique, mais ne portez pas la main sur lui », afin de le délivrer de leurs mains et de le ramener à son père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fosse ». Le mot hébreu peut désigner une fosse ou une citerne.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: Ne versez pas de sang
  rationale: Conserve l’expression hébraïque relative au sang versé et à la culpabilité qui en découle, sans la réduire à l’interprétation « ne le tuez pas ».
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: Jetez-le
  rationale: Rend directement et naturellement l’impératif causatif de שלך dans ce contexte.
- source_word: הַבּוֹר
  choice: citerne
  rationale: Dans le cadre du récit, בּוֹר désigne vraisemblablement une excavation servant de citerne; ce choix est précis et courant en français biblique moderne, tandis que « fosse » reste signalé en note.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: qui est dans le désert
  rationale: Représente explicitement אֲשֶׁר et rend מִדְבָּר par le terme français naturel dans ce contexte, sans impliquer nécessairement un désert de sable.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: mais ne portez pas la main sur lui
  rationale: Expression française idiomatique proche de l’image hébraïque et indiquant l’interdiction de lui faire personnellement violence.
- source_word: לְמַעַן הַצִּיל אֹתוֹ מִיָּדָם
  choice: Il disait cela afin de le délivrer de leurs mains
  rationale: La formulation explicite le passage de la parole directe au commentaire narratif et conserve l’image hébraïque des « mains », qui exprime ici le pouvoir exercé sur Joseph.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: et de le ramener à son père
  rationale: Rend naturellement en français le causatif de שׁוּב et coordonne les deux objectifs du commentaire narratif.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La ponctuation sépare nettement les paroles de Ruben du commentaire du narrateur sur son intention cachée. « Il disait cela » est une explicitation minimale de la relation de but portée par לְמַעַן; elle évite une tournure française ambiguë ou maladroite.
