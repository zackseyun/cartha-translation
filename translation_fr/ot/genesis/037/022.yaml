revisions:
- from: 'Ruben leur dit : « Ne versez pas de sang. Jetez-le dans cette citerne[a], qui est dans le désert, mais ne portez pas la main sur lui. » Il disait cela afin de le délivrer de leurs mains et de le ramener à son père.'
  to: 'Ruben leur dit : « Ne versez pas de sang. Jetez-le dans cette citerne[a] qui se trouve dans la région désertique, mais ne portez pas la main sur lui », afin de le délivrer de leurs mains et de le ramener à son père.'
  rationale: La révision supprime l'imparfait explicatif et rattache directement la proposition de but au discours de Ruben, tout en maintenant clairement son statut de commentaire narratif. Elle rend la relative déterminative et emploie « région désertique » pour préserver la souplesse sémantique de במדבר. La note conserve l'ambiguïté lexicale de בור.
