  text: And he said to them[a], “Please listen to this dream that I dreamed.”
translation:
  language: fr
  text: 'Il leur dit : « Écoutez, je vous prie, ce rêve que j’ai fait. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Il leur dit
  rationale: Le waw consécutif fait avancer le récit; en français, la simple succession verbale rend naturellement cette continuité. « Leur » exprime la préposition et le suffixe pronominal.
- source_word: שִׁמְעוּ נָא
  choice: Écoutez, je vous prie
  rationale: L’impératif pluriel demande une écoute attentive, tandis que נָא nuance la demande. « Je vous prie » conserve cette valeur d’insistance polie dans un registre digne et naturel.
- source_word: הַחֲלוֹם הַזֶּה
  choice: le rêve
  rationale: Dans ce tour présentatif après « écoutez », le français naturel peut rendre le démonstratif hébreu par l’article défini sans perte du référent immédiatement annoncé.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: que j’ai fait
  rationale: Le français idiomatique dit « faire un rêve ». Cette formulation traduit clairement le verbe cognat חָלַם, même si elle ne reproduit pas la répétition lexicale de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure « je vous prie » évite à la fois l’archaïsme appuyé et la familiarité, tout en restituant la particule נָא.
