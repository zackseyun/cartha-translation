base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: fr
  text: Et voilà que nous étions en train de lier des gerbes au milieu du champ ; et voilà que ma gerbe s’est levée et s’est aussi tenue debout ; et voilà que vos gerbes se sont placées autour de la mienne et se sont prosternées devant elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « vos gerbes ont tourné autour de la mienne et se sont inclinées devant elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voilà que
  rationale: La répétition de ce marqueur narratif donne au récit du rêve son caractère vif et immédiat. « Et voilà que » est naturel en français moderne et conserve cet effet sans archaïsme.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: lier des gerbes
  rationale: Le verbe et le nom apparenté décrivent la mise des céréales en gerbes. Cette formulation conserve l’image agricole ainsi que, dans la mesure du possible, la construction idiomatique hébraïque.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: au milieu du champ
  rationale: Cette traduction rend la nuance spatiale de בְּתוֹךְ plus précisément qu’un simple « dans le champ ».
- source_word: קָמָה וְגַם נִצָּבָה
  choice: s’est dressée et est restée debout
  rationale: La formulation distingue le mouvement initial de la gerbe qui se lève de sa position ensuite maintenue. Elle rend aussi la valeur additive de וְגַם sans lourdeur excessive.
- source_word: תְסֻבֶּינָה
  choice: se sont placées tout autour
  rationale: Le verbe exprime l’idée de tourner ou de se disposer autour. Cette traduction préserve le mouvement d’encerclement sans imposer l’idée potentiellement hostile de « cerner ».
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: se sont prosternées devant
  rationale: Le verbe désigne ici un abaissement corporel marqué. « Se prosterner devant » conserve la force visuelle et la portée symbolique du rêve, sans préciser à tort s’il s’agit d’adoration ou d’hommage politique.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: ma gerbe / vos gerbes / la mienne
  rationale: « Gerbe » convient au cadre agricole. La reprise pronominale finale « la mienne » évite une répétition peu naturelle tout en gardant la référence parfaitement claire.
theological_decisions:
- issue: Portée de l’inclination des gerbes
  choice: se sont prosternées devant
  alternative: se sont inclinées devant
  rationale: Le texte décrit un geste d’abaissement sans en expliciter ici la signification théologique ou politique. « Se sont prosternées » en conserve l’intensité, tandis que « devant » évite de présenter ce geste comme un acte explicite d’adoration.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « Et voilà que » maintient la vivacité du récit de rêve. Le premier וְהִנֵּה n’est pas traduit séparément avant « Nous étions », afin d’éviter une ouverture artificielle en français, tandis que les deux occurrences qui structurent les événements extraordinaires sont conservées. Le marqueur [a] est placé après l’ensemble de la proposition concernée.
