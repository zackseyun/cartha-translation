base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: fr
  text: Quand ses frères virent que leur père l’aimait plus que tous ses autres frères, ils le prirent en haine et ne purent pas lui parler en paix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lui parler amicalement » ; littéralement « lui parler en paix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Quand ses frères virent
  rationale: Le wayyiqtol fait avancer le récit, tandis que « Quand » exprime naturellement le lien temporel avec la réaction qui suit.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que les frères constatent.
- source_word: אָהַב
  choice: aimait
  rationale: Le verbe signifie ordinairement « aimer »; la comparaison qui suit fait ressortir le favoritisme sans remplacer le terme hébreu par une interprétation.
- source_word: מִכָּל אֶחָיו
  choice: plus que tous ses frères
  rationale: Cette formulation suit de près la comparaison hébraïque et conserve le possessif rattaché à Joseph, sans ajouter « autres », qui reste implicite.
- source_word: וַיִּשְׂנְאוּ אֹתוֹ
  choice: ils le prirent en haine
  rationale: Cette expression française naturelle rend la haine suscitée dans le déroulement narratif, sans en atténuer la force.
- source_word: וְלֹא יָכְלוּ דַּבְּרוֹ
  choice: et ne pouvaient pas lui parler
  rationale: Le français emploie naturellement le pronom indirect « lui » pour désigner Joseph comme destinataire de leurs paroles.
- source_word: לְשָׁלֹם
  choice: en paix
  rationale: La tournure conserve l’image hébraïque de la paix et sa possible portée relationnelle, plutôt que de la réduire d’emblée à « aimablement ».
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Le passé simple convient au premier plan du récit, tandis que l’imparfait exprime l’état antérieur du père et l’incapacité durable des frères. La formulation « en paix » préserve l’idiome hébreu, explicité en note.
