revisions:
- from: Quand ses frères virent que leur père l’aimait plus que tous ses frères, ils le prirent en haine et ne pouvaient pas lui parler en paix.[a]
  to: Quand ses frères virent que leur père l’aimait plus que tous ses autres frères, ils le prirent en haine et ne purent pas lui parler en paix.[a]
  rationale: La révision aligne le dernier verbe sur la narration au passé simple et clarifie le référent de la comparaison. La note est conservée avec une ponctuation typographique française normalisée ; elle continue de signaler l’alternative relationnelle de l’expression hébraïque.
