  yaml_path: translation/ot/genesis/037/019.yaml
  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: fr
  text: 'Ils se dirent l’un à l’autre : « Regardez ! Voilà ce rêveur[a] qui arrive ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « le maître » ou « le propriétaire des rêves ». L’expression désigne ici Joseph sur un ton moqueur, comme quelqu’un caractérisé par ses rêves.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils se dirent
  rationale: Le wayyiqtol de אמר poursuit la séquence narrative. Le passé simple convient au récit soutenu en français et la forme pronominale prépare naturellement l’expression réciproque.
- source_word: אִישׁ אֶל־אָחִיו
  choice: l’un à l’autre
  rationale: Littéralement « un homme à son frère », cette tournure a ici un sens réciproque. « L’un à l’autre » reste naturel tout en conservant la formulation au singulier du texte hébreu.
- source_word: הִנֵּה
  choice: Regardez ! Voilà
  rationale: הִנֵּה attire vivement l’attention sur Joseph qui approche. La combinaison idiomatique « Regardez ! Voilà… » restitue cette force déictique dans un français moderne.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: le maître des rêves
  rationale: La traduction conserve l’image hébraïque frappante, dans laquelle בַּעַל signifie « maître » ou désigne celui qui est caractérisé par quelque chose. Dans la bouche des frères, cette désignation a une portée moqueuse.
- source_word: הַלָּזֶה
  choice: voilà le maître des rêves
  rationale: Le démonstratif rare הַלָּזֶה désigne Joseph avec une nuance potentiellement méprisante. En français, « voilà le… » le montre du doigt de façon naturelle; traduire explicitement par « ce » alourdirait la phrase.
- source_word: בָּא
  choice: qui arrive
  rationale: Le participe de בוא présente l’approche en cours. « Qui arrive » convient à la scène où les frères aperçoivent Joseph venir vers eux.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image hébraïque de « maître des rêves » et laisse le contexte porter l’ironie des frères. L’exclamation rend la vivacité de leur réaction.
