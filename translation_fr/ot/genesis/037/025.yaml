  text: וַ/יֵּשְׁבוּ֮ לֶֽ/אֱכָל לֶחֶם֒ וַ/יִּשְׂא֤וּ עֵֽינֵי/הֶם֙ וַ/יִּרְא֔וּ וְ/הִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִ/גִּלְעָ֑ד וּ/גְמַלֵּי/הֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּ/צְרִ֣י וָ/לֹ֔ט הוֹלְכִ֖ים לְ/הוֹרִ֥יד מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: fr
  text: 'Puis ils s’assirent pour manger. Ils levèrent les yeux et virent : voici qu’une caravane d’Ismaélites arrivait de Galaad ; ses chameaux transportaient de la gomme aromatique, du baume et du ladanum[a], que les caravaniers acheminaient vers l’Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et de la myrrhe ». L’identification précise du produit hébreu est incertaine ; il s’agit probablement du ladanum, une résine aromatique.'
    reason: Signaler l’incertitude botanique et la traduction traditionnelle sans identifier avec certitude לֹט à la myrrhe.
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: pour manger
  rationale: Littéralement « pour manger du pain » ; en hébreu, l’expression désigne naturellement le fait de prendre un repas. Le français courant préfère ici « manger ».
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: une caravane d’Ismaélites
  rationale: אֹרְחָה désigne une troupe de voyageurs, ici marchands avec des chameaux ; « caravane » restitue précisément la scène.
- source_word: נְכֹאת
  choice: de la gomme aromatique
  rationale: Le produit exact demeure incertain ; il s’agit vraisemblablement d’une gomme ou résine aromatique. Cette formulation évite une identification botanique trop assurée.
- source_word: צְרִי
  choice: du baume
  rationale: Terme traditionnellement rendu par « baume », désignant une résine aromatique ou médicinale, notamment associée à Galaad.
- source_word: לֹט
  choice: du ladanum
  rationale: Le terme désigne probablement le ladanum, résine aromatique du ciste. « Myrrhe » confondrait ce produit avec un autre aromate biblique généralement nommé מֹר.
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: qu’ils allaient descendre en Égypte
  rationale: Préserve le verbe causatif « faire descendre » et l’orientation géographique conventionnelle vers l’Égypte.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. L’enchaînement hébraïque « ils levèrent les yeux, regardèrent, et voici » est rendu naturellement par « Levant les yeux, ils virent », tandis que l’irruption visuelle de la caravane reste nette. Le nom Galaad suit l’usage biblique français courant.
