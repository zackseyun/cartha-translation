  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: fr
  text: Pendant ce temps, les Médanites[a] le vendirent en Égypte à Potiphar, haut fonctionnaire[b] du pharaon et chef des gardes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Médanites ». Dans ce contexte, ils sont traditionnellement identifiés aux « Madianites », comme dans le récit environnant et dans certaines versions anciennes.
    reason: alternative_reading
  - marker: b
    text: Ou « eunuque » ou « dignitaire de la cour ». Le terme hébreu peut désigner soit un eunuque au sens propre, soit un officier royal.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « chef des abatteurs » ; dans le contexte de la cour royale, il s’agit probablement du chef de la garde ou de la garde personnelle, possiblement chargée des exécutions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: Cependant, les Médanites
  rationale: Le texte massorétique porte « Médanites ». « Cependant » rend naturellement le changement de scène marqué par וְ sans effacer la valeur de liaison narrative.
- source_word: מָכְרוּ אֹתוֹ
  choice: le vendirent
  rationale: Le parfait qal poursuit ici le récit au passé; le pronom renvoie à Joseph.
- source_word: אֶל מִצְרָיִם
  choice: en Égypte
  rationale: En français, après « vendre », « en Égypte » exprime idiomatiquement la destination ou le lieu du transfert; la préposition hébraïque אֶל garde une nuance directionnelle.
- source_word: לְפוֹטִיפַר
  choice: à Potiphar
  rationale: La préposition לְ désigne l’acquéreur, dont le nom est translittéré sous sa forme française usuelle.
- source_word: סְרִיס פַרְעֹה
  choice: haut fonctionnaire du pharaon
  rationale: סָרִיס peut désigner un eunuque au sens propre ou, plus largement, un dignitaire de la cour. « Haut fonctionnaire » conserve la fonction officielle sans imposer le sens physiologique.
- source_word: שַׂר הַטַּבָּחִים
  choice: chef des gardes
  rationale: Littéralement, le titre désigne le chef des « abatteurs » ou « exécuteurs »; dans le cadre royal, il renvoie vraisemblablement au commandement de la garde chargée de la sécurité ou des exécutions.
