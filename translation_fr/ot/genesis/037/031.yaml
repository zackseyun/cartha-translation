  text: וַ/יִּקְח֖וּ אֶת כְּתֹ֣נֶת יוֹסֵ֑ף וַֽ/יִּשְׁחֲטוּ֙ שְׂעִ֣יר עִזִּ֔ים וַ/יִּטְבְּל֥וּ אֶת הַ/כֻּתֹּ֖נֶת בַּ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/031.yaml
  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: fr
  text: Ils prirent alors la tunique de Joseph[a], égorgèrent un bouc et trempèrent la tunique dans le sang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vêtement » ou « robe » ; le terme hébreu désigne un vêtement de type tunique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils prirent alors
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement en français moderne cette succession narrative sans alourdir la phrase par une répétition de « et ».
- source_word: כְּתֹנֶת יוֹסֵף
  choice: la tunique de Joseph
  rationale: כְּתֹנֶת désigne un vêtement de type tunique. « Tunique » reste proche du sens hébreu et évite l’image moderne que pourrait suggérer « manteau ».
- source_word: וַיִּשְׁחֲטוּ
  choice: égorgèrent
  rationale: Le verbe désigne l’abattage d’un animal, souvent par égorgement. « Égorgèrent » convient précisément au contexte et demeure naturel en français.
- source_word: שְׂעִיר עִזִּים
  choice: un bouc
  rationale: L’expression désigne un caprin mâle. « Bouc » rend clairement et simplement cette précision en français.
- source_word: וַיִּטְבְּלוּ
  choice: trempèrent
  rationale: Le verbe signifie plonger ou tremper dans un liquide. « Trempèrent » est le terme français le plus naturel pour le vêtement placé dans le sang.
- source_word: הַכֻּתֹּנֶת
  choice: la tunique
  rationale: Le même équivalent est conservé à la seconde occurrence afin d’assurer la cohérence lexicale du verset.
- source_word: בַּדָּם
  choice: dans le sang
  rationale: La préposition avec l’article renvoie naturellement au sang du bouc qui vient d’être égorgé.
