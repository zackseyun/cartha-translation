  yaml_path: translation/ot/genesis/037/030.yaml
  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: fr
  text: 'Il retourna auprès de ses frères et dit[a] : « Le garçon n’est plus là. Et moi, où vais-je aller ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Le garçon n’est pas là, et moi, où dois-je aller ? » L’hébreu emploie littéralement le verbe « venir », dans une expression qui signifie « Où puis-je aller ? » ou « Que vais-je faire ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Il retourna
  rationale: Le verbe שׁוב au wayyiqtol exprime le retour et poursuit naturellement la séquence narrative.
- source_word: אֶל אֶחָיו
  choice: auprès de ses frères
  rationale: אֶל indique le mouvement vers les frères de Ruben ; « auprès de » est naturel ici après « retourner ».
- source_word: הַיֶּלֶד
  choice: le garçon
  rationale: יֶלֶד désigne ici Joseph comme un jeune garçon ; ce choix est courant, précis et sans archaïsme.
- source_word: אֵינֶנּוּ
  choice: n’est plus là
  rationale: La tournure exprime l’absence. « N’est plus là » la rend naturellement sans affirmer que Joseph est mort.
- source_word: וַאֲנִי
  choice: Et moi
  rationale: Le pronom explicite est emphatique et marque le passage abrupt à la détresse personnelle de Ruben.
- source_word: אָנָה אֲנִי בָא
  choice: où vais-je aller ?
  rationale: Littéralement proche de « où est-ce que je viens ? », la construction interrogative avec un verbe de mouvement demande idiomatiquement quelle destination ou quelle issue reste à Ruben.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’exclamation après la constatation rend la détresse immédiate de Ruben, tandis que la formulation garde l’ambiguïté de אֵינֶנּוּ en parlant d’absence plutôt que de mort.
