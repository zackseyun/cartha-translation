  text: וַֽ/יְהִ֕י כַּֽ/אֲשֶׁר בָּ֥א יוֹסֵ֖ף אֶל אֶחָ֑י/ו וַ/יַּפְשִׁ֤יטוּ אֶת יוֹסֵף֙ אֶת כֻּתָּנְתּ֔/וֹ אֶת כְּתֹ֥נֶת הַ/פַּסִּ֖ים אֲשֶׁ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: fr
  text: Lorsque Joseph arriva auprès de ses frères, ils le dépouillèrent de sa tunique, la tunique ornée[a] qu’il portait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tunique à manches longues », « la tunique richement ornée » ou « la tunique multicolore ». Le sens de l’expression hébraïque כְּתֹנֶת הַפַּסִּים est incertain; la traduction traditionnelle « tunique multicolore » est possible, mais moins probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La formule narrative introduit l’événement suivant. « Lorsque » en exprime naturellement la valeur temporelle sans reproduire lourdement l’idiome hébreu.
- source_word: בָּא ... אֶל אֶחָיו
  choice: arriva auprès de ses frères
  rationale: Le verbe décrit la venue de Joseph jusqu’à ses frères. « Arriva auprès de » convient au contexte et évite l’ambiguïté que pourrait avoir « vint à » en français moderne.
- source_word: וַיַּפְשִׁיטוּ אֶת יוֹסֵף
  choice: ils le dépouillèrent
  rationale: Le verbe désigne l’action d’ôter à quelqu’un ses vêtements. « Dépouillèrent » conserve la force de l’action subie par Joseph.
- source_word: כֻּתָּנְתּוֹ
  choice: de sa tunique
  rationale: כֻּתֹּנֶת désigne un vêtement de type tunique; « tunique » est précis et courant dans ce contexte ancien.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: la tunique ornée
  rationale: Le sens exact de פַּסִּים est incertain. « Ornée » exprime le caractère distinctif du vêtement sans réduire nécessairement l’expression à ses couleurs; une note conserve les autres interprétations possibles.
- source_word: אֲשֶׁר עָלָיו
  choice: qu’il portait
  rationale: Cette formulation française naturelle rend la proposition qui précise que la tunique était sur Joseph à ce moment-là.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La répétition de « tunique » est conservée parce qu’elle met en relief le vêtement distinctif, tandis que le second « Joseph » de l’hébreu est rendu par le pronom « le » pour éviter une lourdeur peu naturelle en français.
