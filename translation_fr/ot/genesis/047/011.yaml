base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: fr
  text: Joseph installa son père et ses frères, et leur donna un domaine en Égypte, dans la meilleure partie du pays, dans le territoire de Ramsès[a], comme le pharaon l’avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « dans le pays de Ramsès ».
    reason: La traduction principale emploie « territoire » pour exprimer naturellement le sens régional du mot hébreu אֶרֶץ dans ce contexte.
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: installa
  rationale: Le hiphil de ישׁב exprime ici l’action de faire habiter ou d’établir quelqu’un. « Installa » rend naturellement ce sens causatif en français.
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: son père et ses frères
  rationale: La traduction conserve les liens de parenté explicitement nommés dans l’hébreu, sans les généraliser en « famille ».
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: leur donna un domaine
  rationale: אֲחֻזָּה désigne une possession foncière ou une terre détenue. « Domaine » exprime ici une propriété territoriale sans introduire les connotations théologiques possibles d’« héritage ».
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: dans la meilleure partie du pays
  rationale: מֵיטַב désigne ce qu’un territoire a de meilleur ou sa partie la plus avantageuse. Cette formulation est claire, naturelle et fidèle à la construction hébraïque.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: sur le territoire de Ramsès
  rationale: Le second emploi de אֶרֶץ désigne vraisemblablement ici une région ou un district. « Territoire » évite une répétition lourde tout en conservant le sens géographique.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: conformément à l’ordre du pharaon
  rationale: La proposition indique que Joseph agit en accord avec l’ordre déjà donné par le pharaon. La tournure nominale est idiomatique en français narratif.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la structure hébraïque tout en évitant les calques peu naturels; « pharaon » prend ici l’article conformément à l’usage français courant.
