review_pass:
  verdict: revise
  source_fidelity: 'La proposition rend correctement les principaux éléments du texte hébreu : Joseph fait résider son père et ses frères, leur donne une possession foncière en Égypte, dans la meilleure partie du pays, dans la région de Ramsès. Toutefois, « donc » n’est pas porté par le waw narratif et introduit une inférence absente du texte. La formule finale nominale (« conformément à l’ordre ») est acceptable, mais « comme le pharaon l’avait ordonné » restitue plus directement le verbe hébreu « ordonner » et son antériorité narrative.'
