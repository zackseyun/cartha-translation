  terminology: « Domaine » rend bien אֲחֻזָּה comme possession foncière, sans imposer le sens théologique d’« héritage ». « Ramsès » et « le pharaon » sont conformes à l’usage français. La note explicite utilement le littéral « pays de Ramsès ».
