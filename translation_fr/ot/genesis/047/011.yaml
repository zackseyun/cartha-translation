    rationale: « Conformément à l’ordre du pharaon » préserve le sens général, mais remplace le verbe explicite « avait ordonné ». Une formulation verbale rend plus exactement la syntaxe et la temporalité narrative.
  revised_text: Joseph installa son père et ses frères, et leur donna un domaine en Égypte, dans la meilleure partie du pays, dans le territoire de Ramsès[a], comme le pharaon l’avait ordonné.
