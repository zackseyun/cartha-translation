  text: וַ/יְחִ֤י יַעֲקֹב֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם שְׁבַ֥ע עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יְהִ֤י יְמֵֽי יַעֲקֹב֙ שְׁנֵ֣י חַיָּ֔י/ו שֶׁ֣בַע שָׁנִ֔ים וְ/אַרְבָּעִ֥ים וּ/מְאַ֖ת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: fr
  text: Jacob vécut dix-sept ans dans le pays d’Égypte. La durée de la vie de Jacob[a] fut de cent quarante-sept ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les jours de Jacob, les années de sa vie ».'
    reason: L’hébreu emploie un idiome appositionnel pour désigner la durée totale de sa vie.
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Le verbe חיה exprime ici le fait que Jacob continua à vivre pendant la période indiquée; « vécut » est le rendu narratif naturel en français.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: dans le pays d’Égypte
  rationale: Ce choix conserve explicitement אֶרֶץ (« pays ») tout en restant idiomatique en français.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: dix-sept ans
  rationale: Rendu français standard de la durée indiquée.
- source_word: יְמֵי יַעֲקֹב שְׁנֵי חַיָּיו
  choice: La durée de la vie de Jacob
  rationale: Littéralement, l’hébreu dit « les jours de Jacob, les années de sa vie ». Le français naturel exprime cet idiome par « la durée de la vie », tandis qu’une note conserve la forme de l’original.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: cent quarante-sept ans
  rationale: Le nombre hébreu est réordonné selon l’usage français, sans modification de sa valeur.
