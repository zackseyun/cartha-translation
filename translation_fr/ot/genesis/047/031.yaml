revisions:
- from: 'Il dit : « Jure-le-moi. » Et il le lui jura. Puis Israël s’inclina au chevet du lit[a].'
  to: 'Il dit : « Jure-moi. » Et il lui prêta serment. Puis Israël s’inclina sur le chevet du lit[a].'
  rationale: La révision conserve la lecture massorétique « lit » et l’ambiguïté textuelle attestée par la Septante et Hébreux 11.21. Elle remplace une expression spatiale française pouvant évoquer la présence au chevet d’un malade par une formulation qui rend plus directement le geste situé sur le chevet du lit. Elle simplifie aussi la formule du serment afin d’éviter un objet pronominal absent de l’hébreu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:12:11Z'
review_pass:
  verdict: revise
  source_fidelity: La vocalisation massorétique porte « lit » et doit rester dans le texte principal. « Au chevet du lit » décrit normalement, en français, la présence auprès d’un lit plutôt que le chevet comme partie supérieure du lit ; « sur le chevet du lit » rend mieux עַל רֹאשׁ הַמִּטָּה. L’alternative « bâton » est correctement signalée en note.
  naturalness: « Jure-le-moi » et surtout « il le lui jura » sont lourds et introduisent un pronom objet non exprimé en hébreu. « Jure-moi » / « il lui prêta serment » est idiomatique, direct et conserve la relation dative du texte.
  terminology: « Israël », « s’inclina » et « lit » conviennent. « Prêter serment » conserve le registre solennel sans imposer un sens cultuel à וַיִּשְׁתַּחוּ.
  issues:
  - severity: medium
    issue: Rendu spatial « au chevet du lit »
    rationale: En français courant, « au chevet du lit » signifie généralement « auprès du lit ». Il ne rend pas clairement la préposition עַל (« sur ») ni le sens de « tête/chevet » comme extrémité du lit. « Sur le chevet du lit » est plus précis.
  - severity: low
    issue: Pronoms dans « Jure-le-moi » / « il le lui jura »
    rationale: Le texte hébreu demande simplement de jurer « à moi », puis dit qu’il jura « à lui » ; il n’exprime pas l’objet « le ». Une formulation sans cet objet ajouté est plus nette et plus naturelle.
  revised_text: 'Il dit : « Jure-moi. » Et il lui prêta serment. Puis Israël s’inclina sur le chevet du lit[a].'
  revised_footnotes:
  - marker: a
    text: 'Ou : « sur l’extrémité du bâton ». Les consonnes hébraïques peuvent aussi être vocalisées dans ce sens ; c’est la lecture reflétée par la Septante et par Hébreux 11.21.'
    reason: alternative_reading
  revision_rationale: La révision conserve la lecture massorétique « lit » et l’ambiguïté textuelle attestée par la Septante et Hébreux 11.21. Elle remplace une expression spatiale française pouvant évoquer la présence au chevet d’un malade par une formulation qui rend plus directement le geste situé sur le chevet du lit. Elle simplifie aussi la formule du serment afin d’éviter un objet pronominal absent de l’hébreu.
