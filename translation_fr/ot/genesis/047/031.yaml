base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: fr
  text: 'Il dit : « Jure-moi. » Et il lui prêta serment. Puis Israël s’inclina sur le chevet du lit[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur l’extrémité du bâton ». Les consonnes hébraïques peuvent aussi être vocalisées dans ce sens ; c’est la lecture reflétée par la Septante et par Hébreux 11.21.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: Jure-le-moi
  rationale: Cette formulation concise et naturelle conserve la force de l’impératif et l’idée d’un serment demandé par Jacob.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: il le lui jura
  rationale: La reprise du verbe « jurer » maintient le lien lexical avec l’ordre précédent; les pronoms rendent explicite en français qu’il prêta à Jacob le serment demandé.
- source_word: וַיִּשְׁתַּחוּ
  choice: s’inclina
  rationale: Le verbe décrit ici un geste d’inclination sans nommer explicitement son destinataire ni imposer dans le texte principal le sens cultuel possible de « se prosterner » ou « adorer ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom employé par le texte hébreu est conservé plutôt que remplacé par « Jacob ».
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: au chevet du lit
  rationale: « Au chevet du lit » exprime naturellement en français la position indiquée par l’expression hébraïque, littéralement liée à la « tête » du lit.
- source_word: הַמִּטָּה
  choice: lit
  rationale: La vocalisation massorétique lit mittāh, « lit », ce qui convient au contexte immédiat.
theological_decisions:
- issue: La Septante et Hébreux 11.21 reflètent la lecture « bâton », tandis que la vocalisation massorétique donne « lit ».
  choice: lit
  alternative: bâton
  rationale: Le texte principal suit la vocalisation du texte hébreu massorétique fourni. Comme les mêmes consonnes peuvent recevoir la vocalisation signifiant « bâton » et que cette lecture est attestée par la Septante puis Hébreux 11.21, elle est conservée en note afin de ne pas effacer la tension textuelle et canonique.
translation_notes:
  register: Français international moderne, sobre et digne. Le dialogue reste direct; « au chevet du lit » évite le calque peu naturel « sur la tête du lit », tandis que la note préserve l’autre lecture ancienne.
