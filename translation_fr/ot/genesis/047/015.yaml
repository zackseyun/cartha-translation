source:
  edition: WLC
  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: fr
  text: 'Quand il n’y eut plus d’argent[a] dans le pays d’Égypte ni dans le pays de Canaan, tous les Égyptiens[b] vinrent trouver Joseph et lui dirent : « Donne-nous du pain[c] ! Pourquoi devrions-nous mourir sous tes yeux ? Il n’y a plus d’argent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’argent métal » ; le mot hébreu peut désigner aussi bien l’argent métal que la monnaie.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toute l’Égypte ».'
    reason: lexical_alternative
  - marker: c
    text: Ici, le « pain » peut désigner plus largement la nourriture nécessaire pendant la famine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם הַכֶּסֶף
  choice: il n’y eut plus d’argent
  rationale: Le verbe תמם exprime ici l’épuisement complet des ressources monétaires. Cette tournure est naturelle en français et rend clairement le résultat.
- source_word: הַכֶּסֶף / כָּסֶף
  choice: l’argent
  rationale: כֶּסֶף peut désigner l’argent métal ou la monnaie. Dans ce contexte d’achat de nourriture, « argent » exprime naturellement les moyens de paiement tout en conservant la polysémie française.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: dans le pays d’Égypte ni dans le pays de Canaan
  rationale: Avec l’idée d’épuisement, le français idiomatique situe l’absence d’argent dans les deux pays. La coordination « ni… ni… » découle naturellement de « ne… plus ».
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: tous les Égyptiens vinrent
  rationale: Littéralement « toute l’Égypte vint » ; le collectif désigne la population égyptienne. La formulation choisie évite une personnification peu naturelle en français.
- source_word: לֵאמֹר
  choice: et lui dirent
  rationale: L’infinitif introduit le discours direct. Une coordination avec un verbe conjugué est plus naturelle dans le récit français.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: Donne-nous du pain
  rationale: « Pain » conserve le terme concret לֶחֶם, qui peut aussi désigner plus largement la nourriture dans ce contexte de famine.
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: Pourquoi devrions-nous mourir sous tes yeux ?
  rationale: La question rhétorique exprime un appel pressant. « Sous tes yeux » rend la présence et la perception impliquées par נֶגְדֶּךָ avec une expression française naturelle et vive.
- source_word: כִּי אָפֵס כָּסֶף
  choice: Il n’y a plus d’argent
  rationale: אָפֵס indique qu’il ne reste rien. Cette formulation concise reprend l’idée de la proposition initiale sans donner à כִּי une valeur causale artificiellement appuyée.
