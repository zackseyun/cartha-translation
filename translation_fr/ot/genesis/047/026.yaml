base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: fr
  text: 'Joseph en fit une loi, valable jusqu’à ce jour, pour les terres d’Égypte : le cinquième revient à Pharaon[a]. Seules les terres des prêtres ne devinrent pas la propriété de Pharaon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le cinquième est pour Pharaon », c’est-à-dire 20 %.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ יוֹסֵף לְחֹק
  choice: Joseph en fit une loi
  rationale: Avec לְחֹק, le verbe שׂוּם exprime ici l’établissement d’une règle légale. « En fit une loi » reprend naturellement en français la mesure exposée au verset précédent.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: qui reste en vigueur jusqu’à aujourd’hui
  rationale: L’expression indique que la loi demeurait valide à l’époque du narrateur. Cette formulation rattache clairement la durée à la loi plutôt qu’au seul acte de l’établir.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: pour les terres d’Égypte
  rationale: Dans ce contexte juridique et agricole, עַל marque le domaine d’application de la loi. Le pluriel français « terres » évoque naturellement les biens fonciers cultivables.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: un cinquième revient au pharaon
  rationale: חֹמֶשׁ désigne une part d’un cinquième, et לְפַרְעֹה en indique le bénéficiaire. La formulation française explicite sobrement la relation dans cette proposition nominale hébraïque.
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: Seules les terres des prêtres
  rationale: רַק et לְבַדָּם renforcent ensemble l’exception. « Seules » en rend la valeur emphatique sans la redondance peu naturelle de « seulement… seules ».
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: ne devinrent pas la propriété du pharaon
  rationale: Dans le récit du transfert des terres à Pharaon, היה + ל décrit ici l’état de possession qui en résulte. « Devenir la propriété de » conserve cette dimension résultative.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Pharaon » est rendu avec l’article lorsqu’il désigne le souverain comme titre commun. La formulation conserve le caractère légal et fiscal du verset sans ajouter d’interprétation confessionnelle.
