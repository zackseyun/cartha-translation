base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: fr
  text: '« Quand je reposerai avec mes pères[a], emporte-moi hors d’Égypte et enterre-moi dans leur lieu de sépulture[b]. » Joseph répondit : « Je ferai ce que tu as dit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec mes ancêtres ». L’expression hébraïque, littéralement « me coucher avec mes pères », est une formule liée à la mort et à l’ensevelissement.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans leur tombeau » ou « dans leur tombe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: Quand je reposerai
  rationale: Le verbe שׁכב signifie littéralement « se coucher » et fonctionne ici comme une expression liée à la mort. « Reposer » conserve l’image sans rendre abruptement par « mourir » ; la conjonction est comprise dans un sens temporel naturel en français.
- source_word: עִם אֲבֹתַי
  choice: avec mes pères
  rationale: « Mes pères » préserve la formulation familiale traditionnelle et peut désigner les ancêtres de Jacob ; une note donne l’équivalent français plus explicite.
- source_word: וּנְשָׂאתַנִי
  choice: emporte-moi
  rationale: Dans ce contexte funéraire, נשׂא désigne le transport du corps. « Emporte-moi » exprime clairement son déplacement hors d’Égypte.
- source_word: מִמִּצְרַיִם
  choice: hors d’Égypte
  rationale: La préposition מן marque ici la sortie du territoire égyptien ; « hors d’Égypte » rend explicitement ce mouvement.
- source_word: וּקְבַרְתַּנִי
  choice: enterre-moi
  rationale: קבר signifie directement « enterrer ».
- source_word: בִּקְבֻרָתָם
  choice: dans leur tombeau
  rationale: Le nom קְבֻרָה désigne ici le lieu où les pères sont ensevelis. « Tombeau » est naturel dans le contexte du tombeau familial des patriarches, tout en laissant « lieu de sépulture » comme possibilité lexicale en note.
- source_word: וַיֹּאמַר
  choice: Joseph répondit
  rationale: Le sujet implicite est Joseph d’après le contexte immédiat. « Répondit » rend naturellement la fonction de cette parole dans le dialogue, sans modifier son contenu.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: Je ferai
  rationale: Le pronom indépendant אָנֹכִי apporte une légère insistance au sujet. En français, « Je ferai » reste naturel et suffisamment ferme dans cette promesse.
- source_word: כִדְבָרֶךָ
  choice: ce que tu as dit
  rationale: Littéralement « selon ta parole » ; cette formulation française exprime clairement l’engagement à exécuter la demande de Jacob.
theological_decisions:
- issue: Sens de « reposer avec mes pères »
  choice: Conserver l’image de repos associée aux pères
  alternative: Rendre explicitement par « quand je mourrai »
  rationale: L’hébreu associe la mort, l’ensevelissement et l’appartenance aux ancêtres sans en préciser davantage la portée. La traduction conserve donc cette tension au lieu de la réduire à une simple paraphrase biologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct conserve la solennité de la demande de Jacob. « Mes pères » maintient l’imagerie hébraïque, tandis que la note éclaire son sens pour le lecteur contemporain.
