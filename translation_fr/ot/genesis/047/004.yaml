  text: וַ/יֹּאמְר֣וּ אֶל פַּרְעֹ֗ה לָ/ג֣וּר בָּ/אָרֶץ֮ בָּאנוּ֒ כִּי אֵ֣ין מִרְעֶ֗ה לַ/צֹּאן֙ אֲשֶׁ֣ר לַ/עֲבָדֶ֔י/ךָ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/עַתָּ֛ה יֵֽשְׁבוּ נָ֥א עֲבָדֶ֖י/ךָ בְּ/אֶ֥רֶץ גֹּֽשֶׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: fr
  text: 'Ils dirent au pharaon : « Nous sommes venus séjourner dans le pays[a], car il n’y a pas de pâturages pour les troupeaux de tes serviteurs : la famine est sévère au pays de Canaan. À présent, nous t’en prions, permets à tes serviteurs d’habiter dans le pays de Goshen. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vivre dans le pays comme résidents étrangers ».'
    reason: 'Alternative lexicale qui explicite la nuance de גור : résider en étranger, sans pleine appartenance au pays.'
lexical_decisions:
- source_word: לָגוּר
  choice: séjourner
  rationale: Le verbe גור désigne le fait de résider dans un lieu où l’on est étranger, sans impliquer un établissement pleinement permanent. « Séjourner » conserve cette nuance avec concision; la note explicite l’autre formulation possible.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici le territoire égyptien. « Pays » est naturel en français dans ce contexte géographique.
- source_word: מִרְעֶה לַצֹּאן
  choice: des pâturages pour les troupeaux
  rationale: מִרְעֶה désigne les espaces où paît le bétail, tandis que צֹאן est un collectif pour le petit bétail, notamment moutons et chèvres. Le pluriel « troupeaux » rend naturellement cette valeur collective sans préciser indûment les espèces.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: les troupeaux de tes serviteurs
  rationale: La construction exprime la possession. Le complément « de tes serviteurs » est idiomatique et maintient l’autodésignation déférente des frères devant le pharaon.
- source_word: כָבֵד הָרָעָב
  choice: la famine est sévère
  rationale: כָבֵד signifie littéralement « lourd », mais qualifie ici l’intensité de la famine. « Sévère » en transmet clairement le sens idiomatique.
- source_word: יֵשְׁבוּ נָא
  choice: nous t’en prions, permets à tes serviteurs d’habiter
  rationale: Le jussif accompagné de נָא formule une requête polie. « Nous t’en prions, permets… » rend cette déférence, et « habiter » traduit ישב sans affirmer un établissement juridiquement permanent.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans cette adresse de cour, עבד fonctionne comme autodésignation respectueuse. « Tes serviteurs » convient mieux que « tes esclaves », qui imposerait ici un statut de servitude non affirmé par le contexte.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: le pays de Goshen
  rationale: Cette formulation conserve explicitement le nom géographique אֶרֶץ et suit l’usage français courant du toponyme Goshen.
theological_decisions: []
