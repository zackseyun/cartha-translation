lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français moderne.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Titre usuel du souverain égyptien ; l’article défini est idiomatique en français.
- source_word: אֶל יוֹסֵף
  choice: à Joseph
  rationale: La préposition marque le destinataire de la parole, et le nom reçoit sa forme française traditionnelle.
- source_word: לֵאמֹר
  choice: omis comme formule introductive
  rationale: Après « dit », rendre littéralement « en disant » serait redondant en français courant ; sa fonction d’introduction du discours direct est portée par la ponctuation.
- source_word: אָבִיךָ
  choice: ton père
  rationale: Le possessif de deuxième personne du singulier s’adresse directement à Joseph.
- source_word: וְאַחֶיךָ
  choice: et tes frères
  rationale: Le nom désigne les frères ; il n’est pas généralisé en « famille ».
- source_word: בָּאוּ
  choice: sont venus
  rationale: L’accompli hébreu présente une venue achevée dont le résultat vaut dans la situation présente ; le passé composé convient naturellement.
- source_word: אֵלֶיךָ
  choice: auprès de toi
  rationale: La préposition exprime un mouvement en direction de Joseph. « Auprès de toi » rend ici la venue jusqu’à lui sans ajouter explicitement « ici ».
