  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: fr
  text: 'Alors le pharaon dit à Joseph[a] : « Ton père et tes frères sont venus auprès de toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Et le pharaon dit à Joseph en disant : “Ton père et tes frères sont venus vers toi.” »'
