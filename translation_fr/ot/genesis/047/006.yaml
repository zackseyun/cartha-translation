  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: fr
  text: Le pays d’Égypte est devant toi[a]. Installe ton père et tes frères dans la meilleure partie du pays ; qu’ils habitent dans le pays de Goshen. Et si tu sais qu’il y a parmi eux des hommes compétents[b], établis-les comme responsables de mes troupeaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « est devant toi » indique ici que le pays est à ta disposition et que tu peux choisir où installer ta famille.
    reason: cultural_note
  - marker: b
    text: Ou « des hommes capables », « des hommes de valeur » ; littéralement « des hommes de force/capacité ». Ici, l’expression ne désigne pas nécessairement la vaillance militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: Le pays d’Égypte est devant toi
  rationale: Rend directement l’image de l’idiome hébreu לְפָנֶיךָ tout en signalant en note son sens contextuel de disponibilité et de liberté de choix.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: dans la meilleure partie du pays
  rationale: מֵיטַב désigne la portion la meilleure ou la plus fertile ; « meilleure partie » est naturel en français et évite l’expression moins idiomatique « le meilleur du pays ».
- source_word: הוֹשֵׁב
  choice: Installe
  rationale: 'L’impératif hiphil de ישׁב a une valeur causative : Joseph doit faire habiter sa famille à cet endroit. « Installe » l’exprime clairement.'
- source_word: יֵשְׁבוּ
  choice: qu’ils habitent
  rationale: Le qal de ישׁב exprime ici la résidence. « Habiter » convient au registre narratif digne et actuel.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: dans le pays de Goshen
  rationale: Conserve explicitement אֶרֶץ, « pays », et la forme française traditionnelle et intelligible du toponyme.
- source_word: וְאִם יָדַעְתָּ וְיֶשׁ בָּם
  choice: Et si tu sais qu’il y a parmi eux
  rationale: Reproduit sans l’aplanir la construction conditionnelle fondée sur ce que Joseph connaît des compétences de ses frères.
- source_word: אַנְשֵׁי חַיִל
  choice: des hommes compétents
  rationale: חַיִל peut évoquer la force, la valeur ou la capacité. Dans ce contexte de gestion des troupeaux, « compétents » exprime l’aptitude plutôt qu’une valeur militaire.
- source_word: וְשַׂמְתָּם
  choice: établis-les
  rationale: Dans un contexte d’attribution de fonction, שׂים signifie placer ou désigner. « Établis-les » garde cette nuance sans langage administratif excessif.
- source_word: שָׂרֵי מִקְנֶה
  choice: responsables de mes troupeaux
  rationale: שָׂרֵי désigne des chefs ou responsables, et מִקְנֶה le bétail ou les troupeaux. La formulation française est claire et adaptée à la fonction confiée.
- source_word: עַל אֲשֶׁר לִי
  choice: de mes troupeaux
  rationale: Le littéral « sur ce qui est à moi » renvoie ici au bétail de Pharaon. L’intégration possessive donne un français naturel sans modifier le référent.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe de Pharaon à Joseph. L’image hébraïque « devant toi » est conservée dans le texte et expliquée en note ; le vocabulaire de la compétence et de la responsabilité reste non militaire et accessible.
