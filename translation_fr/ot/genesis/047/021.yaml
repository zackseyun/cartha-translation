source:
  edition: WLC
  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: fr
  text: Quant au peuple[a], il le transféra dans les villes, d’une extrémité du territoire de l’Égypte à l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il déplaça le peuple vers les villes ». Certaines traductions, suivant une autre compréhension du texte, disent que Joseph réduisit le peuple en servitude; l’hébreu employé ici parle plus directement de son déplacement.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: le peuple
  rationale: Le nom collectif désigne ici la population égyptienne touchée par la politique de Joseph. « Le peuple » est naturel, digne et conserve le singulier collectif de l’hébreu.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: il le transféra
  rationale: Le hifil de עבר exprime le fait de faire passer, déplacer ou transférer. « Transféra » rend le déplacement sans préciser abusivement ses modalités; le pronom singulier reprend le collectif « peuple ».
- source_word: לֶעָרִים
  choice: dans les villes
  rationale: La préposition ל indique ici la destination. « Dans les villes » exprime naturellement en français l’installation ou le déplacement vers les villes, tout en laissant ouverte l’interprétation exacte de la mesure administrative.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: d’une extrémité du territoire de l’Égypte à l’autre
  rationale: Cette formulation conserve le mérisme hébreu et rend גְבוּל par « territoire », sens contextuellement préférable à la seule ligne frontalière.
theological_decisions:
- issue: Nature de l’action exercée sur la population égyptienne
  choice: il le transféra dans les villes
  alternative: il réduisit le peuple en servitude; il le déplaça de ville en ville
  rationale: Le texte massorétique décrit directement un transfert ou déplacement. Il ne dit pas explicitement ici que Joseph réduisit la population en servitude. La traduction suit donc la formulation hébraïque sans importer une conclusion théologique ou sociale issue d’une autre lecture textuelle.
translation_notes:
  register: Français international moderne, sobre et narratif. « Quant au peuple » marque la reprise thématique de וְאֶת־הָעָם; le passé simple convient au registre narratif biblique sans être archaïque. La note préserve l’existence d’une autre lecture sans l’introduire dans le corps du texte.
