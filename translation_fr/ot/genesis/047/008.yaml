lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple exprime naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française traditionnelle et courante du titre royal égyptien.
- source_word: אֶל יַעֲקֹב
  choice: à Jacob
  rationale: La préposition אֶל désigne ici l’interlocuteur; « à Jacob » est l’équivalent français naturel.
- source_word: כַּמָּה
  choice: Quel est le nombre
  rationale: Dans cette question quantitative, cette formulation permet de conserver la structure développée de l’hébreu tout en restant intelligible en français.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: des jours des années de ta vie
  rationale: La traduction maintient l’expression hébraïque superposant « jours », « années » et « vie », au lieu de la réduire dans le texte principal à une simple demande d’âge.
