  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶֽל יַעֲקֹ֑ב כַּ/מָּ֕ה יְמֵ֖י שְׁנֵ֥י חַיֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: fr
  text: 'Pharaon dit à Jacob : « Combien sont les jours des années de ta vie[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression hébraïque formelle ; plus idiomatiquement : « Quel âge as-tu ? »'
