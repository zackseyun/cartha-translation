  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: fr
  text: 'Pourquoi mourrions-nous sous tes yeux, nous et nos terres ? Achète-nous, nous et nos terres, contre du pain[a] : nous deviendrons esclaves du pharaon, et nos terres lui appartiendront[b]. Donne-nous des semences, afin que nous vivions et ne mourions pas, et que la terre ne soit pas dévastée[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « contre du pain » ou « pour du pain ». Dans ce contexte, « pain » peut aussi désigner la nourriture.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu rendu par « esclaves » peut aussi être traduit par « serviteurs ». Il désigne ici une condition de dépendance économique envers le pharaon; les terres sont comprises comme passant sous son autorité.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ne devienne pas désolée ». Le verbe peut évoquer une terre abandonnée et laissée à l’état de désolation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: Pourquoi mourrions-nous
  rationale: Le conditionnel présent rend naturellement en français la force de cette question rhétorique et de cet appel pressant.
- source_word: לְעֵינֶיךָ
  choice: sous tes yeux
  rationale: 'Expression française actuelle qui conserve l''image vive de l''hébreu : mourir en présence de Joseph, alors qu''il le voit.'
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: nous et nos terres
  rationale: La coordination simple est naturelle en français et maintient les deux éléments concernés. Le pluriel « terres » convient aux propriétés agricoles des locuteurs.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: Achète-nous, nous et nos terres
  rationale: « Acheter » exprime sans atténuation l'acquisition commerciale des personnes et de leurs terres; la reprise pronominale rend la construction claire en français.
- source_word: בַּלָּחֶם
  choice: en échange de nourriture
  rationale: Le beth indique ici le prix ou le moyen d'échange. Dans ce contexte de famine, לֶחֶם désigne la nourriture au sens large, bien que son sens concret soit « pain ».
- source_word: וְנִהְיֶה ... עֲבָדִים לְפַרְעֹה
  choice: nous et nos terres serons au service du pharaon
  rationale: Cette formulation conserve l'étrange inclusion des terres dans le statut exprimé par עֲבָדִים et évite de qualifier littéralement les terres d'« esclaves », tournure peu intelligible en français. La note explicite la dureté du statut humain.
- source_word: וְתֶן זֶרַע
  choice: Donne-nous des semences
  rationale: Le contexte agricole indique des grains destinés aux semailles. L'ajout de « nous », implicite en hébreu, est nécessairement compris et rend la demande naturelle en français.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: et que les terres ne deviennent pas désolées
  rationale: Le verbe שׁמם évoque la désolation, l'abandon ou la dévastation; « deviennent désolées » préserve cette image sans la réduire au seul fait de rester incultes.
theological_decisions:
- issue: Nature du statut exprimé par עֲבָדִים
  choice: au service du pharaon, avec une note précisant « esclaves »
  alternative: esclaves du pharaon
  rationale: Le contexte décrit une sujétion économique réelle et une perte de liberté, mais la phrase applique aussi le prédicat aux terres. Le corps du texte reste naturel et conserve cette coordination, tandis que la note ne masque pas la force du terme pour les personnes.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l'adresse au singulier de l'hébreu. « Pharaon » prend ici l'article selon l'usage français courant du titre. Les marqueurs de notes figurent tous dans le texte principal.
