base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: fr
  text: Puis Joseph fit entrer Jacob, son père, et le présenta devant Pharaon. Jacob bénit Pharaon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Bénit » peut désigner une bénédiction prononcée solennellement, y compris sous la forme d’une formule de salutation, et non une simple politesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: fit entrer
  rationale: Le hifil de בוא a une valeur causative. « Fit entrer » exprime naturellement que Joseph introduit Jacob dans la présence royale.
- source_word: אָבִיו
  choice: son père Jacob
  rationale: Le suffixe de troisième personne renvoie à Joseph. L’ordre français « son père Jacob » est naturel et garde l’identification explicite.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: le présenta devant
  rationale: Le hifil de עמד signifie littéralement « le fit se tenir ». Dans le cadre d’une audience royale, « le présenta devant » en rend le sens de façon idiomatique et digne.
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: ברך signifie normalement « bénir ». Ce choix conserve l’action forte et la tension narrative d’un patriarche bénissant le souverain égyptien, sans la réduire à une simple salutation.
- source_word: פַרְעֹה
  choice: le pharaon
  rationale: En français courant, le titre prend normalement l’article défini lorsqu’il désigne le souverain d’Égypte.
- source_word: וַ
  choice: Puis
  rationale: Le waw narratif fait progresser le récit. « Puis » marque clairement la succession sans alourdir la phrase par des « et » répétés.
theological_decisions:
- issue: Sens de l’action de Jacob envers le pharaon
  choice: Jacob bénit réellement le pharaon
  alternative: Jacob se contente de saluer poliment le pharaon
  rationale: Le sens ordinaire de ברך est « bénir ». La traduction garde donc la portée théologique et sociale surprenante de la scène au lieu de l’atténuer en simple formule de politesse.
translation_notes:
  register: Français international moderne, narratif et digne. « Fit entrer » et « présenta devant » rendent les formes causatives hébraïques sans littéralisme pesant. L’article dans « le pharaon » suit l’usage français naturel.
