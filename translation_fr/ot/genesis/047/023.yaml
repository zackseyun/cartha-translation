  source_fidelity: Le texte rend fidèlement la progression narrative de וַיֹּאמֶר, l’interpellation emphatique הֵן, l’acquisition explicite des personnes et de leurs terres par/au bénéfice de Pharaon, la présentation de la semence et l’instruction finale de semer la terre. « Je vous ai achetés » conserve, sans l’atténuer, la portée économique et juridique de קָנִיתִי.
