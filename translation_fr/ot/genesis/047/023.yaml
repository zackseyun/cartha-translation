id: GEN.47.23
reference: Genesis 47:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: fr
  text: 'Joseph dit alors au peuple : « Voyez, aujourd’hui je vous ai achetés[a], vous et vos terres, pour Pharaon. Voici de la semence pour vous, et vous ensemencerez la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « acquis ». Le verbe hébreu peut désigner un achat ou, plus généralement, une acquisition.
    reason: Alternative lexicale préservant l’étendue de sens de קנה.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait avancer le récit ; « alors » exprime naturellement la succession en français.
- source_word: הָעָם
  choice: au peuple
  rationale: Le nom désigne ici collectivement la population égyptienne à laquelle Joseph s’adresse.
- source_word: הֵן
  choice: Voyez
  rationale: La particule introduit une déclaration appuyée et attire l’attention des auditeurs sans recourir à l’archaïsme « voici que ».
- source_word: קָנִיתִי
  choice: je vous ai achetés
  rationale: Dans ce contexte économique et juridique, le verbe קנה exprime directement l’achat, tout en pouvant désigner plus largement l’acquisition ; cette nuance est signalée en note.
- source_word: אֶתְכֶם
  choice: vous
  rationale: Le pronom désigne les personnes elles-mêmes, désormais au service de Pharaon ; la formulation directe conserve la force du texte.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’indication temporelle de la transaction présente.
- source_word: אַדְמַתְכֶם
  choice: vos terres
  rationale: Le pluriel français désigne naturellement les propriétés agricoles des habitants pris collectivement.
- source_word: לְפַרְעֹה
  choice: pour Pharaon
  rationale: La préposition indique que Joseph effectue l’acquisition au bénéfice de Pharaon.
- source_word: הֵא
  choice: Voici
  rationale: La particule présente concrètement ce que Joseph met à leur disposition.
- source_word: זֶרַע
  choice: de la semence
  rationale: Le nom désigne ici les grains destinés aux semailles ; « semence » convient au contexte agricole.
- source_word: וּזְרַעְתֶּם
  choice: et vous ensemencerez
  rationale: Le futur français conserve la coordination et la valeur injonctive ou prospective de la forme verbale dans ce contexte.
- source_word: הָאֲדָמָה
  choice: la terre
  rationale: Le terme désigne le sol cultivable ; « la terre » est naturel et maintient le lien lexical avec les terres déjà mentionnées.
theological_decisions:
- issue: Statut des Égyptiens acquis par Pharaon
  choice: Conserver l’énoncé direct « je vous ai achetés »
  alternative: Atténuer en « je vous ai pris à son service »
  rationale: Le texte présente explicitement les personnes comme objet de l’acquisition avec leurs terres. La traduction ne doit ni adoucir ni préciser davantage la nature juridique de leur statut.
translation_notes:
  register: Français international moderne, courant et digne. « Voyez » garde la force d’interpellation de הֵן ; « Pharaon » est employé sans article selon l’usage biblique français habituel. La syntaxe demeure claire tout en conservant la dureté et l’ambiguïté juridique de la transaction.
