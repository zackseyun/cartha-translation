  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: fr
  text: Puis Jacob bénit le pharaon et sortit de la présence du pharaon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « salua le pharaon » ou « prit congé de lui » ; le verbe hébreu signifie habituellement « bénir », mais, dans le contexte d’une audience royale, il peut aussi évoquer une salutation officielle ou une prise de congé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Le verbe ברך signifie normalement « bénir ». Dans le cadre d’une audience royale, il peut aussi désigner une salutation officielle ou une prise de congé, mais le sens lexical premier convient ici et fait écho à son emploi au verset 7.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle et courante du nom יעקב.
- source_word: אֶת
  choice: '[marqueur de l’objet direct, non traduit]'
  rationale: Ce marqueur grammatical hébreu n’a pas d’équivalent à rendre en français.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Le titre royal est rendu naturellement avec l’article défini en français.
- source_word: וַיֵּצֵא
  choice: se retira
  rationale: Le verbe יצא exprime ici la sortie de l’audience royale. « Se retira » est naturel en français dans ce contexte et conserve l’idée de départ.
- source_word: מִלִּפְנֵי
  choice: de devant lui
  rationale: L’expression signifie littéralement « de devant ». Le pronom évite une répétition lourde de « pharaon » tout en gardant l’image spatiale de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Puis » assure une transition narrative naturelle ; « se retira de devant lui » conserve l’expression concrète de l’hébreu sans lourdeur excessive.
