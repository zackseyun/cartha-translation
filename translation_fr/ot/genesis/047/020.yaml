base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: fr
  text: Joseph acheta pour le pharaon toute la terre d’Égypte[a], car les Égyptiens vendirent chacun leur champ, tant la famine pesait lourdement sur eux[b] ; et la terre devint la propriété du pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « acquit pour le pharaon toute la terre d’Égypte ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la famine était forte sur eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: acheta
  rationale: Dans ce contexte de vente des champs, le verbe קנה désigne une acquisition commerciale. « Acheta » est direct et naturel.
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: toutes les terres d’Égypte
  rationale: אַדְמָה désigne ici les biens fonciers agricoles. Le pluriel français convient au contexte distributif des champs vendus et s’accorde avec la reprise finale.
- source_word: לְפַרְעֹה
  choice: pour le pharaon
  rationale: La préposition ל indique que Joseph réalise l’achat au profit du pharaon.
- source_word: מָכְרוּ מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: les Égyptiens vendirent chacun leur champ
  rationale: Cette formulation restitue le sujet collectif suivi de la précision distributive אִישׁ, tout en restant idiomatique en français.
- source_word: כִּי חָזַק עֲלֵהֶם הָרָעָב
  choice: tant la famine pesait lourdement sur eux
  rationale: La tournure exprime naturellement en français la force accablante de la famine, tout en maintenant l’image portée par עַל.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: Ainsi, les terres devinrent la propriété du pharaon
  rationale: La clause exprime le résultat juridique du transfert. « Devinrent la propriété du pharaon » est explicite et naturel.
