base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: fr
  text: Joseph recueillit tout l’argent qui se trouvait dans le pays d’Égypte et dans le pays de Canaan, en échange du grain que les gens achetaient, puis Joseph apporta l’argent dans la maison de Pharaon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « maison de Pharaon » peut désigner la résidence royale, mais aussi, plus largement, la maison royale ou le trésor de Pharaon.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: recueillit
  rationale: Le verbe לקט exprime ici l’action de rassembler progressivement les sommes provenant des transactions; « recueillit » est naturel et digne dans ce contexte.
- source_word: כָּל הַכֶּסֶף
  choice: tout l’argent
  rationale: כֶּסֶף désigne littéralement l’argent métal, mais aussi couramment la monnaie. En français, « tout l’argent » conserve à la fois le lien avec le métal et la fonction monétaire sans ambiguïté gênante.
- source_word: הַנִּמְצָא
  choice: qui se trouvait
  rationale: Cette tournure rend naturellement en français la valeur du participe passif, c’est-à-dire l’argent présent ou disponible dans les deux pays.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: dans le pays d’Égypte et dans le pays de Canaan
  rationale: La répétition de « dans le pays de » reflète la formulation hébraïque et maintient son insistance géographique.
- source_word: בַּשֶּׁבֶר
  choice: en paiement du grain
  rationale: Dans le récit de Joseph, שֶׁבֶר désigne le grain vendu durant la famine. « En paiement du grain » explicite sobrement la relation transactionnelle portée par la préposition ב.
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: que les gens achetaient
  rationale: Le verbe שבר signifie ici acheter du grain, et le participe indique une action en cours ou répétée. Le pronom hébreu ne renvoie pas à un groupe explicitement nommé dans ce verset; « les gens » est plus clair en français qu’un « ils » sans antécédent immédiat.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: il fit entrer cet argent dans la maison de Pharaon
  rationale: La terminaison directive de בֵּיתָה marque un mouvement vers l’intérieur. « Fit entrer » restitue cette nuance, tandis que « maison de Pharaon » préserve l’expression hébraïque sans la réduire d’office au palais ou au trésor.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Argent » est préféré à « argent métal », trop lourd dans le corps du texte. La coordination finale est rendue par « puis » afin d’éviter une répétition pesante de « et Joseph » tout en conservant la succession des actions.
