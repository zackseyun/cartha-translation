  source_fidelity: La traduction de « Donnez votre bétail » et de « en échange de votre bétail » rend fidèlement l’impératif et la valeur transactionnelle de l’hébreu. En revanche, « de quoi vivre » explicite et élargit l’objet elliptique de וְאֶתְּנָה לָכֶם; le contexte permet de comprendre qu’il s’agit de provisions, mais le texte ne le dit pas. « Puisque » tranche aussi la valeur de אִם, qui signifie formellement « si », même si le contexte peut lui donner une nuance causale.
  naturalness: Le français révisé demeure naturel, concis et adapté à un registre narratif sobre. L’ellipse après « je vous donnerai » est intelligible dans le contexte immédiat et évite d’ajouter un objet absent du texte source.
  terminology: « Bétail » est un équivalent juste et usuel de מִקְנֶה dans ce contexte. « Argent » et « épuisé » rendent adéquatement כָּסֶף et אָפֵס.
