  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵי/כֶ֔ם וְ/אֶתְּנָ֥ה לָ/כֶ֖ם בְּ/מִקְנֵי/כֶ֑ם אִם אָפֵ֖ס כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: fr
  text: 'Joseph dit : « Donnez votre bétail, et je vous donnerai en échange de votre bétail, si l’argent est épuisé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: Donnez
  rationale: L’impératif pluriel demande ici de remettre le bétail à Joseph. « Donnez » suit directement le sens de l’hébreu et convient à l’échange proposé.
- source_word: מִקְנֵיכֶם
  choice: votre bétail
  rationale: מִקְנֶה désigne collectivement les animaux d’élevage possédés; « bétail » est naturel et suffisamment large en français.
- source_word: וְאֶתְּנָה לָכֶם
  choice: et je vous donnerai de quoi vivre
  rationale: Le texte hébreu ne précise pas l’objet donné. Le contexte immédiat indique des vivres; « de quoi vivre » rend cette ellipse sans limiter indûment le don au seul pain.
- source_word: בְּמִקְנֵיכֶם
  choice: en échange de votre bétail
  rationale: La préposition ב marque ici la contrepartie de la transaction; cette formulation explicite naturellement le rapport d’échange.
- source_word: אִם
  choice: puisque
  rationale: Bien que אִם signifie ordinairement « si », la proposition explique ici pourquoi le paiement doit prendre la forme d’un troc; « puisque » rend cette valeur contextuelle.
- source_word: אָפֵס כָּסֶף
  choice: l’argent est épuisé
  rationale: אָפֵס exprime l’épuisement ou la disparition complète d’une ressource. La formulation conserve l’image de fonds arrivés à leur terme.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « votre bétail » est maintenue pour refléter la structure transactionnelle de l’hébreu. L’objet implicite du verbe « donner » est rendu par « de quoi vivre » en raison du contexte de famine.
