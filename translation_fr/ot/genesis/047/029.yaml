  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: fr
  text: 'Quand le moment de la mort d’Israël approcha, il appela son fils Joseph et lui dit : « Si j’ai trouvé grâce à tes yeux, je t’en prie, mets ta main sous ma cuisse[a] et agis envers moi avec bonté et fidélité[b]. Je t’en prie, ne m’enterre pas en Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mettre la main sous la cuisse était un geste lié à un serment solennel dans les récits patriarcaux ; voir aussi Genèse 24.2.
    reason: cultural_note
  - marker: b
    text: 'Ou : « avec amour fidèle et loyauté ». L’expression hébraïque associe une bonté loyale à une fidélité digne de confiance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: Quand le temps où Israël devait mourir approcha
  rationale: Cette formulation française naturelle rend l’idiome hébreu selon lequel les jours d’Israël « approchaient » de la mort, sans donner à entendre que sa mort était déjà survenue.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte source emploie Israël plutôt que Jacob; ce nom est donc conservé.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: son fils Joseph
  rationale: Joseph est la forme française traditionnelle et immédiatement reconnaissable du nom hébreu יוֹסֵף.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Si j’ai trouvé grâce à tes yeux
  rationale: Cette tournure conserve l’image et la formule de politesse hébraïques tout en restant idiomatique en français biblique moderne.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: je t’en prie, mets ta main sous ma cuisse
  rationale: La demande polie marquée par נָא est exprimée par « je t’en prie », tandis que le geste concret du serment est conservé et expliqué en note.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: agis envers moi avec bonté et fidélité
  rationale: « Agis envers moi » rend l’expression idiomatique avec עִם. « Bonté et fidélité » restitue de façon concise le couple חֶסֶד וֶאֱמֶת, qui évoque une bienveillance loyale et un engagement digne de confiance.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: Je t’en prie, ne m’enterre pas en Égypte
  rationale: La formulation rend la supplication négative avec נָא dans un français naturel et conserve le nom géographique usuel.
theological_decisions:
- issue: Portée de חֶסֶד וֶאֱמֶת dans le contexte d’un engagement familial solennel
  choice: bonté et fidélité
  alternative: amour fidèle et loyauté; bienveillance et vérité
  rationale: Le couple hébreu associe la bonté loyale à la fiabilité. « Bonté et fidélité » préserve cette tension sans ajouter explicitement le mot « alliance », absent du verset, ni réduire חֶסֶד à un simple sentiment.
- issue: Geste de la main placée sous la cuisse
  choice: Conserver littéralement le geste dans le texte et l’expliquer en note
  alternative: Paraphraser par « prête-moi serment »
  rationale: Le geste appartient au caractère concret du récit patriarcal. Le paraphraser effacerait un élément culturel du texte; une note permet d’en indiquer la fonction sans spéculation supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient au dialogue entre père et fils. Les répétitions de « je t’en prie » rendent les deux occurrences de נָא et soulignent le ton pressant sans l’alourdir excessivement.
