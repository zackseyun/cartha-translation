  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: fr
  text: Il prit cinq hommes parmi ses frères et les présenta devant le pharaon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « parmi ceux qui étaient à l’extrémité du groupe de ses frères » ou « parmi les meilleurs de ses frères ». L’expression hébraïque évoque littéralement « l’extrémité » ou « le bord », mais elle a probablement ici un sens partitif : Joseph choisit cinq de ses frères.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: parmi
  rationale: 'L’expression signifie littéralement « depuis l’extrémité de », mais fonctionne vraisemblablement ici de manière partitive : Joseph prend cinq hommes au sein du groupe de ses frères.'
- source_word: אֶחָיו
  choice: ses frères
  rationale: Dans le contexte immédiat, il s’agit bien des frères de Joseph, et non de parents au sens large.
- source_word: לָקַח
  choice: il prit
  rationale: Le verbe signifie normalement « prendre ». Cette formulation conserve le terme hébreu tout en laissant le contexte exprimer l’idée de sélection.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: cinq hommes
  rationale: Traduction directe et naturelle de la construction formée du nombre et du nom.
- source_word: וַיַּצִּגֵם
  choice: les présenta
  rationale: La forme causative signifie placer ou faire comparaître quelqu’un devant une autre personne ; « présenta » convient au cadre de la cour.
- source_word: לִפְנֵי פַרְעֹה
  choice: devant le pharaon
  rationale: לִפְנֵי signifie « devant » ou « en présence de ». L’article français est naturel avec le titre royal employé ici.
