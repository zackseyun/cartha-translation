revisions:
- from: 'Jacob répondit au pharaon : « Les jours des années de mon séjour comme étranger[a] sont de cent trente ans. Peu nombreux et pénibles ont été les jours des années de ma vie[b], et ils n’ont pas atteint les jours des années de la vie de mes pères, durant leur séjour comme étrangers. »'
  to: 'Jacob dit au pharaon : « Les jours des années de mon séjour d’étranger[a] sont au nombre de cent trente ans. Peu nombreux et pénibles ont été les jours des années de ma vie[b], et ils n’ont pas atteint les jours des années de la vie de mes pères, durant leur séjour d’étrangers. »'
  rationale: La révision corrige la syntaxe française du premier énoncé, emploie le verbe source « dit » et resserre l’expression du séjour étranger. Elle conserve la répétition délibérée « les jours des années », l’ordre emphatique de la qualification des jours, le sens non moral de רָעִים et les deux notes existantes.
