  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: fr
  text: 'Jacob dit au pharaon : « Les jours des années de mon séjour d’étranger[a] sont au nombre de cent trente ans. Peu nombreux et pénibles ont été les jours des années de ma vie[b], et ils n’ont pas atteint les jours des années de la vie de mes pères, durant leur séjour d’étrangers. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de mon pèlerinage ». Le terme hébreu désigne le fait de vivre temporairement dans un pays comme résident étranger.
    reason: lexical_alternative
  - marker: b
    text: Ou « Les jours des années de ma vie ont été peu nombreux et pénibles ».
    reason: alternative_word_order
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: mon séjour comme étranger / leur séjour comme étrangers
  rationale: Le terme désigne le fait de résider temporairement dans un pays où l’on est étranger. Cette formulation française conserve le statut concret des patriarches sans introduire la notion plus spirituelle de pèlerinage.
- source_word: יְמֵי שְׁנֵי
  choice: les jours des années de
  rationale: La répétition solennelle de l’hébreu est conservée, malgré son caractère marqué en français, afin de préserver la texture et le rythme de la déclaration de Jacob.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: cent trente ans
  rationale: Formulation numérique naturelle en français moderne, équivalente à l’ordre hébreu.
- source_word: מְעַט
  choice: peu nombreux
  rationale: L’adjectif évalue la durée de la vie de Jacob par comparaison avec celle de ses pères. « Peu nombreux » s’accorde clairement avec les jours et préserve l’idée quantitative.
- source_word: רָעִים
  choice: pénibles
  rationale: Dans ce contexte, le mot qualifie les jours marqués par l’adversité plutôt que par le mal moral. « Pénibles » rend ce sens naturellement, tout en laissant entendre la souffrance de Jacob.
- source_word: חַיַּי / חַיֵּי אֲבֹתַי
  choice: ma vie / la vie de mes pères
  rationale: Ces formes désignent la vie ou sa durée. Le singulier collectif « la vie de mes pères » est idiomatique en français tout en restant proche de la construction hébraïque.
- source_word: הָיוּ
  choice: ont été
  rationale: Le passé composé convient à la rétrospective de Jacob sur sa vie jusqu’au moment où il parle.
- source_word: הִשִּׂיגוּ
  choice: n’ont pas atteint
  rationale: 'Le verbe signifie atteindre, rejoindre ou rattraper. Cette traduction maintient l’image comparative : les années de Jacob restent en deçà de celles de ses pères.'
- source_word: אֲבֹתַי
  choice: mes pères
  rationale: Jacob vise ici ses pères patriarcaux. La traduction directe préserve la continuité familiale sans élargir explicitement le référent à tous ses ancêtres.
theological_decisions:
- issue: Auto-description patriarcale comme résident étranger
  choice: séjour comme étranger
  alternative: pèlerinage
  rationale: Le texte évoque d’abord la condition historique des patriarches, résidents étrangers dans le pays. « Pèlerinage » pourrait spiritualiser le terme au-delà de ce que dit explicitement l’hébreu.
- issue: Qualification des jours par רָעִים
  choice: pénibles
  alternative: mauvais
  rationale: Le contexte porte sur les épreuves vécues par Jacob, non sur une faute morale attribuée à ses jours. « Pénibles » préserve cette distinction sans supprimer la force négative du terme.
translation_notes:
  register: Français international moderne, digne et légèrement soutenu. La répétition « les jours des années » et l’ordre marqué « Peu nombreux et pénibles ont été… » conservent la solennité et l’insistance de l’hébreu, tandis que « séjour comme étranger » explicite naturellement une notion sans équivalent français simple.
