review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est fidèle : Jacob indique cent trente ans, décrit sa vie comme brève en comparaison et pénible, puis la compare à celle de ses pères. « Pénibles » rend bien רָעִים dans son sens contextuel d’éprouvé. Une légère révision est nécessaire, car « sont de cent trente ans » n’est pas idiomatique en français et « répondit » est plus spécifique que le וַיֹּאמֶר (« dit ») hébreu.'
  naturalness: La formulation révisée maintient la solennité volontaire de « les jours des années », mais emploie « sont au nombre de » pour une construction française correcte. « Séjour d’étranger » est plus naturel et plus concis que « séjour comme étranger », sans perdre le sens de résidence temporaire en terre étrangère.
  terminology: « Séjour d’étranger / séjour d’étrangers » conserve la portée historique de מְגוּרִים sans spiritualiser le terme par « pèlerinage » dans le texte principal. « Mes pères » convient au référent patriarcal. Les ancres de notes sont conservées et placées sur les expressions auxquelles elles se rapportent.
  issues:
  - severity: medium
    issue: « Les jours des années de mon séjour comme étranger sont de cent trente ans »
    rationale: En français, des jours ou des années ne « sont » pas d’un certain nombre d’années. « Sont au nombre de cent trente ans » rend le comptage exprimé par l’hébreu tout en restant idiomatique.
  - severity: low
    issue: « Jacob répondit »
    rationale: Le texte hébreu dit simplement « Jacob dit ». Le contexte permet de comprendre qu’il répond à Pharaon, mais « dit » évite d’ajouter cette nuance au verbe.
  - severity: low
    issue: « séjour comme étranger »
    rationale: La formulation est compréhensible, mais « séjour d’étranger » est une expression plus naturelle en français moderne et conserve le même statut de résident étranger.
