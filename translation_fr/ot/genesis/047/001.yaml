base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: fr
  text: 'Joseph alla trouver Pharaon et lui dit : « Mon père et mes frères sont arrivés du pays de Canaan avec leur petit et leur gros bétail et tout ce qui leur appartient. Les voici sur le territoire de Gosen. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: alla trouver
  rationale: Dans le cadre d’une audience royale, cette formulation française exprime naturellement le déplacement de Joseph jusqu’auprès de Pharaon, sans imposer le point de vue spatial de « vint ».
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: lui dit
  rationale: Les deux verbes hébreux introduisent le discours direct selon une tournure narrative courante. Un seul verbe introducteur évite en français la redondance peu naturelle de « l’informa et dit » sans retrancher le contenu du message.
- source_word: אָבִי וְאַחַי
  choice: Mon père et mes frères
  rationale: Traduction directe des possessifs et des liens familiaux exprimés par l’hébreu.
- source_word: וְצֹאנָם וּבְקָרָם
  choice: avec leur petit et leur gros bétail
  rationale: Cette expression conserve la distinction entre les ovins-caprins et les bovins ou autres bêtes de troupeau, sans préciser des espèces que le texte ne nomme pas.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: et tout ce qui leur appartient
  rationale: Formulation française naturelle et proche de l’expression hébraïque désignant l’ensemble de leurs biens.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: sont arrivés du pays de Canaan
  rationale: Le passé composé souligne une arrivée accomplie dont le résultat est actuel au moment où Joseph parle.
- source_word: וְהִנָּם
  choice: Les voici
  rationale: « Les voici » restitue avec naturel la valeur présentative et déictique de הִנֵּה muni du suffixe pronominal.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: dans la région de Goshen
  rationale: « Région » rend ici אֶרֶץ comme désignation territoriale et évite de suggérer que Goshen serait un pays souverain.
