base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: fr
  text: 'Au moment de la récolte, vous donnerez un cinquième à Pharaon, et les quatre cinquièmes[a] vous appartiendront : ils serviront de semence pour les champs et de nourriture pour vous, pour les personnes qui vivent dans vos maisons et pour vos jeunes enfants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « les quatre mains », expression qui désigne les quatre parts restantes sur cinq, c’est-à-dire les quatre cinquièmes.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: Au moment de la récolte
  rationale: תְּבוּאָה désigne ici la production agricole ou la récolte. Avec la préposition בְּ dans ce contexte administratif, la tournure temporelle « au moment de la récolte » exprime naturellement le moment où la part due doit être remise.
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: vous donnerez un cinquième à Pharaon
  rationale: חֲמִישִׁית désigne un cinquième. Le futur français convient à la prescription formulée par Joseph tout en restant proche de la construction hébraïque.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: les quatre cinquièmes
  rationale: L’expression littérale « les quatre mains » est un idiome de partage désignant les quatre parts restantes sur cinq. « Les quatre cinquièmes » en restitue clairement le sens en français.
- source_word: יִהְיֶה לָכֶם
  choice: vous appartiendront
  rationale: La formule indique que la part restante sera laissée aux cultivateurs. L’accord au pluriel suit naturellement « les quatre cinquièmes » en français.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: de semence pour les champs
  rationale: 'Le לְ est final : une partie de la récolte sera réservée afin d’ensemencer les terres. Le pluriel « les champs » est idiomatique en français dans ce contexte collectif.'
- source_word: וּלְאָכְלְכֶם
  choice: de nourriture pour vous
  rationale: La forme issue de אכל désigne ce qui est destiné à leur consommation. Cette formulation française est naturelle et s’intègre à l’énumération des usages de la récolte.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: pour les personnes qui vivent dans vos maisons
  rationale: La proposition relative renvoie vraisemblablement aux personnes présentes dans leurs maisons. Cette traduction explicite le référent humain sans employer le terme plus technique « maisonnée ».
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: pour vos jeunes enfants
  rationale: טַף désigne couramment les petits enfants, parfois plus largement les personnes à charge. « Jeunes enfants » conserve ici le sens familial sans l’ambiguïté française de « petits-enfants », qui pourrait signifier les descendants de la deuxième génération.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le caractère administratif de l’instruction tout en rendant explicitement l’idiome hébreu du partage. Le deux-points clarifie que les éléments suivants indiquent l’usage réservé aux quatre cinquièmes.
