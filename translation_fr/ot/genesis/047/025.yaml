  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: fr
  text: 'Ils dirent : « Tu nous as gardés en vie. Puissions-nous trouver grâce aux yeux de mon seigneur[a], et nous serons esclaves de Pharaon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « trouver grâce aux yeux de » introduit ici une demande formulée avec déférence.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le waw narratif introduit ici la prise de parole; le passé simple convient au récit biblique en français actuel et soutenu.
- source_word: הֶחֱיִתָנוּ
  choice: Tu nous as gardés en vie
  rationale: Le hifil de חיה exprime le fait de faire vivre ou de préserver en vie, sans ajouter la connotation spirituelle que pourrait avoir « sauver ».
- source_word: נִמְצָא חֵן
  choice: Puissions-nous trouver grâce
  rationale: 'L’imparfait hébreu de première personne du pluriel a ici une valeur volitive: les locuteurs formulent avec déférence une demande, et non un simple constat.'
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: aux yeux de mon seigneur
  rationale: La formulation conserve l’expression idiomatique hébraïque tout en restant claire en français. Le singulier « mon seigneur » respecte le suffixe hébreu et désigne Joseph avec déférence.
- source_word: וְהָיִינוּ
  choice: et nous serons
  rationale: Dans ce contexte, la forme exprime l’engagement qui résultera de la faveur demandée; le futur français rend naturellement cette promesse.
- source_word: עֲבָדִים
  choice: esclaves
  rationale: Dans ce contexte économique, עֲבָדִים désigne une condition d’asservissement envers Pharaon; « esclaves » en préserve la force sans l’atténuer en simple service volontaire.
- source_word: לְפַרְעֹה
  choice: de Pharaon
  rationale: Avec « esclaves », le complément introduit par « de » exprime naturellement en français l’appartenance et la sujétion marquées par לְ.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif; « Puissions-nous » conserve la nuance de souhait respectueux, tandis que « esclaves » rend explicitement la condition de dépendance économique.
