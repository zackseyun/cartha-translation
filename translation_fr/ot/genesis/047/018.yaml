base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: fr
  text: 'Cette année-là prit fin. Ils vinrent le trouver la deuxième année et lui dirent : « Nous ne le cacherons pas à mon seigneur : l’argent[a] est épuisé, et le bétail est passé à mon seigneur. Il ne reste plus devant mon seigneur que nos corps[b] et notre terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’argent-métal ». En hébreu, le mot désignant l’argent-métal sert couramment à parler de la monnaie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nos personnes ». L’hébreu dit littéralement « nos corps » et souligne ici qu’ils n’ont plus qu’eux-mêmes et leur terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: Cette année-là prit fin
  rationale: תמם exprime l’achèvement. Cette formulation naturelle conserve la proposition temporelle hébraïque sans la fondre dans la suivante.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: la deuxième année
  rationale: Rend formellement l’expression hébraïque et préserve son repérage chronologique plutôt que de l’expliciter par « l’année suivante ».
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: Nous ne le cacherons pas à mon seigneur
  rationale: Le piel de כחד signifie cacher ou dissimuler. Le singulier « mon seigneur » respecte le suffixe hébreu de politesse malgré le groupe de locuteurs.
- source_word: תַּם הַכֶּסֶף
  choice: l’argent est épuisé
  rationale: Dans ce contexte économique, כֶּסֶף désigne l’argent comme moyen de paiement; תם indique qu’il a été entièrement consommé.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: et le bétail est passé à mon seigneur
  rationale: מִקְנֵה הַבְּהֵמָה désigne les biens en bétail. La préposition אֶל marque ici le transfert à Joseph; « est passé à » le rend sans ajouter une notion juridique trop précise de propriété.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: Il ne reste devant mon seigneur
  rationale: La tournure conserve l’image hébraïque de ce qui demeure « devant » le seigneur, tout en restant intelligible en français.
- source_word: בִּלְתִּי אִם
  choice: que
  rationale: Après la négation, « ne… que » exprime naturellement l’exception introduite par cette locution.
- source_word: גְּוִיָּתֵנוּ
  choice: nos corps
  rationale: Le terme désigne concrètement le corps ou la personne physique; « nos corps » garde cette force dans le contexte où les habitants n’ont plus qu’eux-mêmes à céder.
- source_word: אַדְמָתֵנוּ
  choice: notre terre
  rationale: Le singulier collectif hébreu est conservé et désigne leur sol ou domaine agricole.
