source:
  edition: WLC
  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: fr
  text: Israël s’établit dans le pays d’Égypte, dans la région de Gochèn. Ils y acquirent des biens[a], furent féconds et se multiplièrent considérablement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils s’y établirent solidement ». Le verbe hébreu peut évoquer l’acquisition de possessions dans le pays ou le fait de s’y implanter fermement.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: s’établit
  rationale: Le verbe ישׁב désigne ici une résidence durable plutôt qu’un séjour passager. « S’établit » rend naturellement cette nuance.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte nomme Israël au singulier, puis passe au pluriel pour parler de sa famille. Conserver « Israël » préserve ce mouvement représentatif.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: en Égypte
  rationale: En français courant, « en Égypte » exprime pleinement la localisation territoriale sans la lourdeur de « dans le pays d’Égypte ».
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: dans la région de Gochèn
  rationale: « Région » indique clairement que Gochèn est un territoire situé en Égypte, tout en évitant la répétition peu naturelle de « pays ».
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: ils y acquirent des terres
  rationale: Le niphal de אחז peut évoquer l’obtention d’une possession foncière ou un établissement ferme. Dans ce contexte, « acquirent des terres » rend bien la probable idée de possessions territoriales, tandis qu’une note conserve l’ambiguïté lexicale.
- source_word: וַיִּפְרוּ
  choice: furent féconds
  rationale: Cette formulation conserve le vocabulaire récurrent de la fécondité dans la Genèse et son lien avec la bénédiction.
- source_word: וַיִּרְבּוּ
  choice: se multiplièrent
  rationale: Le choix préserve la formule biblique récurrente associant fécondité et multiplication.
- source_word: מְאֹד
  choice: considérablement
  rationale: Cet adverbe rend l’intensité de מְאֹד dans un français moderne et digne.
theological_decisions:
- issue: Sens représentatif d’« Israël »
  choice: Maintenir « Israël » au singulier, puis le pluriel « ils » pour sa famille.
  alternative: Uniformiser en « les Israélites » ou remplacer « Israël » par « Jacob ».
  rationale: L’hébreu commence par un sujet singulier, Israël, puis emploie des verbes au pluriel. Cette transition présente le patriarche comme représentant de sa famille et doit rester visible.
- issue: Résonance du langage de bénédiction
  choice: Traduire וַיִּפְרוּ וַיִּרְבּוּ par « furent féconds et se multiplièrent ».
  alternative: Rendre simplement par « devinrent très nombreux ».
  rationale: La formulation retenue conserve l’écho des bénédictions de la Genèse sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Gochèn » suit une translittération française courante. Le passage du singulier « Israël » au pluriel « ils » est volontairement conservé, et la note rend l’ambiguïté de וַיֵּאָחֲזוּ בָהּ.
