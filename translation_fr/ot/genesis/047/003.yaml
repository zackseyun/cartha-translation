translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement adressé à Pharaon suit l’usage courant des traductions bibliques françaises, tandis que « Tes serviteurs » maintient la déférence de la formule de cour. Le marqueur [a] est placé après « métier », là où porte effectivement la variante lexicale.
