base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: fr
  text: 'Pharaon dit à ses frères : « Quel est votre métier[a] ? » Ils répondirent à Pharaon : « Tes serviteurs sont bergers de troupeaux[b], nous comme nos pères. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quel est votre travail ? »
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « bergers de petit bétail », c’est-à-dire des hommes qui gardent des moutons et des chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Quel est votre métier ?
  rationale: מַעֲשֶׂה désigne ici l’activité ou le travail. Dans l’entretien avec Pharaon, la question porte sur leur profession ; « métier » est naturel en français moderne et conserve ce sens professionnel.
- source_word: רֹעֵה צֹאן
  choice: bergers de petit bétail
  rationale: Le participe רֹעֵה associé à צֹאן décrit ceux qui gardent le petit bétail, notamment les moutons et les chèvres. Cette formulation reflète les deux termes hébreux sans réduire indûment צֹאן aux seuls moutons.
- source_word: עֲבָדֶיךָ
  choice: Tes serviteurs
  rationale: Dans cette adresse à Pharaon, עבד est une formule de déférence par laquelle les frères parlent d’eux-mêmes. « Serviteurs » convient mieux au contexte que « esclaves », bien que le terme hébreu puisse avoir ce dernier sens ailleurs.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: nous comme nos pères
  rationale: La répétition de גַּם souligne la continuité entre les générations. « Nous comme nos pères » est concise, naturelle et conserve le parallélisme.
- source_word: אֶל אֶחָיו
  choice: à ses frères
  rationale: Le suffixe possessif renvoie, dans le contexte, à Joseph. La traduction conserve l’expression hébraïque sans ajouter son nom dans le texte.
