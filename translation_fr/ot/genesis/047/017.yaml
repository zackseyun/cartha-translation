  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: fr
  text: Ils amenèrent donc leur bétail à Joseph, et Joseph leur donna du pain en échange des chevaux, des troupeaux de petit bétail, des troupeaux de gros bétail et des ânes. Cette année-là, il pourvut à leurs besoins en leur donnant du pain en échange de tout leur bétail.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il les conduisit avec du pain ». Le verbe hébreu peut signifier « conduire, guider, administrer »; ici, il désigne probablement le fait de les faire subsister pendant la famine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: leur bétail / tout leur bétail
  rationale: Le terme désigne collectivement les animaux domestiques possédés, et non seulement les bovins.
- source_word: לֶחֶם
  choice: du pain
  rationale: Le sens premier « pain » convient au contexte de famine et peut désigner par métonymie la nourriture de base; la répétition du mot hébreu est conservée.
- source_word: בַּסּוּסִים
  choice: en échange des chevaux
  rationale: La préposition ב marque ici le bien remis en contrepartie; expliciter l’échange est nécessaire en français.
- source_word: מִקְנֵה הַצֹּאן
  choice: des troupeaux de petit bétail
  rationale: צֹאן englobe les ovins et les caprins; « petit bétail » préserve cette extension mieux que « moutons ».
- source_word: מִקְנֵה הַבָּקָר
  choice: des troupeaux de gros bétail
  rationale: L’expression désigne principalement les bovins et contraste avec le petit bétail.
- source_word: חֲמֹרִים
  choice: des ânes
  rationale: Équivalent français moderne, direct et naturel.
- source_word: וַיְנַהֲלֵם
  choice: il pourvut à leurs besoins
  rationale: Le verbe נהל signifie littéralement conduire ou mener, mais, avec le pain comme moyen dans ce contexte, il exprime l’entretien et la subsistance du peuple.
- source_word: בַּלֶּחֶם
  choice: en leur donnant du pain
  rationale: La préposition indique le moyen par lequel Joseph subvient à leurs besoins; cette formulation évite une tournure française maladroite.
- source_word: בְּכָל מִקְנֵהֶם
  choice: en échange de tout leur bétail
  rationale: La phrase récapitule l’ensemble du troc; le sens d’échange est explicité.
- source_word: בַּשָּׁנָה הַהִוא
  choice: Cette année-là
  rationale: Rendu temporel naturel qui situe toute l’opération pendant l’année en question.
