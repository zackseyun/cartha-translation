  text: וַ/יְכַלְכֵּ֤ל יוֹסֵף֙ אֶת אָבִ֣י/ו וְ/אֶת אֶחָ֔י/ו וְ/אֵ֖ת כָּל בֵּ֣ית אָבִ֑י/ו לֶ֖חֶם לְ/פִ֥י הַ/טָּֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: fr
  text: Joseph procura de la nourriture[a] à son père, à ses frères et à toute la maison de son père, en fonction du nombre des enfants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pain ». Le mot hébreu signifie souvent « pain », mais désigne probablement ici les vivres en général.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « selon la bouche des enfants » ; c’est-à-dire en fonction de leur nombre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: procura
  rationale: Le piel de כלכל exprime ici le fait d’entretenir matériellement ou de pourvoir aux besoins. « Procura » s’emploie naturellement avec « de la nourriture » et convient au contexte de famine.
- source_word: לֶחֶם
  choice: de la nourriture
  rationale: לֶחֶם signifie souvent littéralement « pain », mais désigne ici plus largement les vivres nécessaires à la subsistance.
- source_word: כָּל בֵּית אָבִיו
  choice: toute la maisonnée de son père
  rationale: בַּיִת désigne ici le groupe familial et domestique, non le bâtiment. « Maisonnée » conserve cette dimension collective.
- source_word: לְפִי
  choice: en proportion de
  rationale: L’expression signifie littéralement « selon la bouche de » et indique ici une mesure ou une répartition proportionnée, sans trancher entre le nombre des enfants et leurs besoins.
- source_word: הַטָּף
  choice: les jeunes enfants
  rationale: טַף désigne les petits enfants du groupe familial. « Jeunes enfants » est clair et naturel en français actuel.
- source_word: אָבִיו ... אֶחָיו
  choice: son père ... ses frères
  rationale: Ces termes de parenté sont rendus directement; dans le récit, les frères sont les fils mâles de Jacob.
theological_decisions: []
