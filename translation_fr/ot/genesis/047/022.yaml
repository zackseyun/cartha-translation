base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: fr
  text: Les terres des prêtres furent les seules que Joseph n’acheta pas, car les prêtres recevaient de Pharaon une ration[a] et mangeaient la ration que Pharaon leur donnait. C’est pourquoi ils ne vendirent pas leurs terres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une allocation fixe », « une part attribuée » ou « une provision ». Ici, le mot hébreu חֹק désigne ce qui est officiellement accordé aux prêtres plutôt qu’une prescription légale au sens premier.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Cependant
  rationale: Marque l’exception à l’affirmation générale précédente sans donner à entendre que Joseph n’aurait acheté que ces terres.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: les terres des prêtres
  rationale: Désigne les propriétés foncières appartenant collectivement aux prêtres; le pluriel est naturel en français dans ce contexte.
- source_word: לֹא קָנָה
  choice: Joseph n’acheta pas
  rationale: Le sujet implicite est Joseph, clairement établi par le contexte. « Acheter » rend directement l’opération économique décrite.
- source_word: חֹק / חֻקָּם
  choice: une ration / la ration
  rationale: Dans ce passage, le terme désigne une provision officiellement attribuée plutôt qu’une loi abstraite. « Ration » convient au contexte de famine et au verbe « se nourrir ».
- source_word: מֵאֵת פַּרְעֹה
  choice: de Pharaon
  rationale: Exprime simplement la source de la provision.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: et se nourrissaient de la ration
  rationale: Rend le sens concret du verbe « manger » dans un français naturel, en indiquant que cette provision assurait leur subsistance.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Introduit clairement la conséquence de la provision accordée par Pharaon.
- source_word: לֹא מָכְרוּ אֶת אַדְמָתָם
  choice: ils ne vendirent pas leurs terres
  rationale: Rend directement la conclusion économique du verset dans un français narratif naturel.
