source:
  edition: WLC
  text: וְ/לֶ֤חֶם אֵין֙ בְּ/כָל הָ/אָ֔רֶץ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב מְאֹ֑ד וַ/תֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/אֶ֣רֶץ כְּנַ֔עַן מִ/פְּנֵ֖י הָ/רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: fr
  text: Il n’y avait pas de nourriture dans tout le pays[a], car la famine était très grave. Le pays d’Égypte et le pays de Canaan dépérissaient[b] à cause de la famine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pain »; le mot désigne probablement ici la nourriture en général.
    reason: lexical_alternative
  - marker: b
    text: Ou « étaient épuisés » ou « défaillaient ». Le verbe hébreu décrit figurativement l’effet accablant de la famine sur l’Égypte et Canaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: nourriture
  rationale: Le mot signifie littéralement « pain », mais désigne ici, par métonymie et dans un contexte de famine, la nourriture en général.
- source_word: אֵין
  choice: il n’y avait plus de
  rationale: La tournure existentielle négative est rendue au passé, conformément au récit. « Plus de » exprime naturellement l’épuisement des vivres dans le contexte immédiat.
- source_word: בְּכָל הָאָרֶץ
  choice: dans tout le pays
  rationale: Dans ce contexte, הָאָרֶץ désigne le territoire touché par la famine, et non nécessairement la terre entière.
- source_word: כִּי כָבֵד הָרָעָב מְאֹד
  choice: car la famine était très grave
  rationale: כָבֵד signifie littéralement « lourd », mais décrit ici la gravité extrême de la famine; « très grave » est idiomatique en français moderne.
- source_word: וַתֵּלַהּ
  choice: dépérissaient
  rationale: Le verbe rare décrit figurativement l’affaiblissement profond ou l’épuisement causé par la famine. « Dépérissaient » convient à des pays envisagés avec leurs populations et préserve l’image sans la surinterpréter.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: le pays d’Égypte et le pays de Canaan
  rationale: La répétition de « pays » maintient l’accent géographique de la formulation hébraïque.
- source_word: מִפְּנֵי הָרָעָב
  choice: à cause de la famine
  rationale: Rendu causal naturel de la locution prépositionnelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée en deux pour éviter une coordination lourde. Le marqueur [b] est placé après le terme qu’il explique.
