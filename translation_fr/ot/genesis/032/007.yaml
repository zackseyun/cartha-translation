  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: fr
  text: 'Les messagers revinrent auprès de Jacob[a] et dirent : « Nous sommes arrivés auprès de ton frère, Ésaü. Lui aussi vient à ta rencontre, et quatre cents hommes sont avec lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement dans ce contexte : « les anges revinrent auprès de Jacob ». Le mot hébreu מַלְאָכִים peut désigner des « messagers » ou des « anges », mais il renvoie ici aux envoyés que Jacob avait dépêchés auprès d’Ésaü.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: revinrent
  rationale: 'Le wayyiqtol de שוב exprime ici une action passée achevée : les envoyés reviennent vers Jacob après leur mission.'
- source_word: הַמַּלְאָכִים
  choice: les messagers
  rationale: מַלְאָכִים peut désigner des messagers ou des anges. Dans ce contexte immédiat, il s’agit des envoyés humains que Jacob a dépêchés auprès d’Ésaü.
- source_word: לֵאמֹר
  choice: et dirent
  rationale: L’infinitif introduit le discours direct. La coordination avec un verbe conjugué est plus naturelle en français narratif moderne.
- source_word: בָּאנוּ אֶל
  choice: nous sommes allés chez
  rationale: בוא signifie fondamentalement entrer ou venir, mais, dans le récit rétrospectif d’une mission auprès d’Ésaü, « sommes allés chez » est idiomatique en français et évite l’étrange « sommes venus chez ».
- source_word: אָחִיךָ אֶל עֵשָׂו
  choice: ton frère, chez Ésaü
  rationale: La répétition de אֶל présente Ésaü en apposition à « ton frère ». La formulation conserve cette identification et son insistance rhétorique.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: Lui aussi vient à ta rencontre
  rationale: Le participe הֹלֵךְ indique une action en cours, et גַם ajoute le fait marquant qu’Ésaü lui-même se dirige vers Jacob. « Vient à ta rencontre » est naturel et reste neutre quant à ses intentions.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: accompagné de quatre cents hommes
  rationale: Cette formulation française exprime naturellement que les quatre cents hommes sont avec Ésaü, tout en conservant le nombre et le terme masculin du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit, tandis que le passé composé rend naturellement le compte rendu direct des messagers. La formulation ne précise pas si la venue d’Ésaü est amicale ou hostile.
