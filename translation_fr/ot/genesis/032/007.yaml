  - severity: low
    issue: « Accompagné de quatre cents hommes » explicite légèrement la relation exprimée par « quatre cents hommes sont avec lui ».
    rationale: Le sens est juste, mais une proposition coordonnée préserve mieux la structure et l’assertion explicite du texte source.
