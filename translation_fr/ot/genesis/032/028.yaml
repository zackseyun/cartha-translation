  text: 'Il lui dit : « Quel est ton nom ? » Il dit : « Jacob. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il lui dit
  rationale: Le wayyiqtol de אמר fait progresser le récit. « Il lui dit » conserve le verbe courant de parole et rend explicitement le complément אֵלָיו en français naturel.
- source_word: מַה שְּׁמֶךָ
  choice: Quel est ton nom ?
  rationale: La tournure hébraïque signifie directement « Quel est ton nom ? ». Le tutoiement convient à l’adresse personnelle au singulier et au registre du récit.
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: אמר signifie littéralement « dire », mais, dans cet échange, le second emploi introduit manifestement la réponse. « Il répondit » évite une répétition peu naturelle sans ajouter de contenu.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est conservé sous sa forme française traditionnelle et largement reconnue.
