  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: fr
  text: 'Il dit[a] : « Laisse-moi partir, car l’aurore s’est levée[b]. » Mais il dit[c] : « Je ne te laisserai pas partir tant que tu ne m’auras pas béni. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Relâche-moi » ou « Renvoie-moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car le jour se lève ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu n’identifie pas explicitement les interlocuteurs dans ce verset ; leur identité se déduit du récit environnant.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Laisse-moi partir
  rationale: L’impératif de שׁלח avec suffixe de première personne peut signifier « renvoie-moi » ou « relâche-moi ». Dans le contexte d’une lutte, « laisse-moi partir » est naturel et conserve la demande sans la surinterpréter.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: car l’aurore s’est levée
  rationale: La traduction conserve la valeur causale de כִּי et l’image de l’aurore qui « monte » ou « se lève », tout en restant idiomatique dans un registre narratif digne.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: Je ne te laisserai pas partir
  rationale: Le futur négatif exprime ici un refus ferme. La reprise de « laisser partir » préserve le jeu de répétition avec la demande précédente.
- source_word: כִּי אִם
  choice: tant que ... ne ... pas
  rationale: Dans ce contexte, la locution introduit la condition préalable à la libération. « Tant que tu ne m’auras pas béni » rend naturellement en français l’idée de « pas avant que / à moins que ».
- source_word: בֵּרַכְתָּנִי
  choice: tu ne m’auras pas béni
  rationale: Le parfait hébreu présente la bénédiction comme devant être accomplie avant la libération. Le futur antérieur français exprime clairement cette antériorité sans transformer la bénédiction en action déjà passée.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Il dit ... Mais il répondit
  rationale: « Mais » marque l’opposition implicite entre la demande et le refus. « Répondit » est naturel dans l’échange, sans ajouter l’identité des interlocuteurs.
theological_decisions:
- issue: Identité des interlocuteurs
  choice: 'Conserver des sujets pronominaux non identifiés : « Il dit » et « il répondit »'
  alternative: Nommer explicitement le premier interlocuteur « l’homme », « l’ange » ou Dieu, et le second Jacob
  rationale: L’hébreu n’explicite pas les sujets dans ce verset. Ne pas les nommer préserve l’ambiguïté narrative et la tension théologique du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct, la répétition du verbe שׁלח est préservée, et aucun nom n’est ajouté pour identifier les interlocuteurs.
