  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: fr
  text: C’est pourquoi, jusqu’à ce jour, les Israélites[a] ne mangent pas le tendon de la hanche[b], qui se trouve à l’articulation de la hanche, parce qu’il avait touché l’articulation de la hanche de Jacob, au tendon de la hanche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Israël ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne traditionnellement un tendon situé près de la hanche; son identification anatomique précise est incertaine. Certains y voient le nerf sciatique ou un tendon voisin.
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Expression causale et consécutive naturelle en français, qui rattache explicitement la coutume à l’événement précédent.
- source_word: לֹא יֹאכְלוּ
  choice: ne mangent pas
  rationale: Le présent français exprime naturellement une pratique coutumière qui se poursuit « jusqu’à ce jour ».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les Israélites
  rationale: Formulation courante et immédiatement compréhensible en français moderne; le sens littéral est signalé en note.
- source_word: גִּיד הַנָּשֶׁה
  choice: le tendon de la hanche
  rationale: « Tendon » conserve l’idée générale d’un tissu fibreux sans imposer l’identification plus précise et incertaine au nerf sciatique; « de la hanche » rend le terme difficile הַנָּשֶׁה dans son contexte anatomique.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: qui se trouve sur l’articulation de la cuisse
  rationale: Rend la localisation anatomique concrète de כַּף הַיָּרֵךְ tout en conservant la distinction entre l’articulation et la cuisse.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Équivalent français consacré et naturel de l’expression temporelle hébraïque.
- source_word: כִּי נָגַע
  choice: parce qu’il avait touché
  rationale: Le plus-que-parfait situe correctement le geste antérieur à la coutume expliquée; « touché » respecte le sens ordinaire de נגע sans amplifier le verbe en « frappé ».
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב בְּגִיד הַנָּשֶׁה
  choice: l’articulation de la cuisse de Jacob à l’endroit de ce tendon
  rationale: La reformulation évite une répétition pesante tout en conservant le lieu du contact et le rapport avec le tendon déjà nommé.
