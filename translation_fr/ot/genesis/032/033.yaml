  to: C’est pourquoi, jusqu’à ce jour, les Israélites[a] ne mangent pas le tendon de la hanche[b], qui se trouve à l’articulation de la hanche, parce qu’il avait touché l’articulation de la hanche de Jacob, au tendon de la hanche.
