  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: fr
  text: 'Vous direz aussi : « Voici, ton serviteur Jacob est derrière nous. » Car Jacob se disait : « Je l’apaiserai[a] par le présent qui me précède ; ensuite, je verrai son visage. Peut-être m’accueillera-t-il favorablement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « j’apaiserai son visage ». Le verbe appartient aussi au vocabulaire de l’expiation, mais il désigne ici le fait de calmer Ésaü au moyen d’un présent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il relèvera mon visage », expression hébraïque signifiant qu’Ésaü acceptera Jacob ou lui témoignera de la faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Cette particule attire l’attention. « Voici » reste naturel dans un récit solennel et convient mieux ici que le très oral « regarde ».
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Jacob adopte un langage diplomatique d’humilité envers Ésaü. « Serviteur » exprime cette position subordonnée sans suggérer nécessairement l’esclavage.
- source_word: אַחֲרֵינוּ
  choice: est derrière nous
  rationale: L’expression situe Jacob à la suite des messagers et des troupeaux envoyés devant lui.
- source_word: אֲכַפְּרָה פָנָיו
  choice: Je l’apaiserai
  rationale: Dans ce contexte interpersonnel et non cultuel, כפר désigne l’action de calmer ou de se concilier Ésaü. Une note conserve la formulation imagée avec « face ».
- source_word: מִנְחָה
  choice: le présent
  rationale: Il s’agit du don conciliatoire envoyé à Ésaü. « Présent » convient au registre diplomatique et évite la connotation cultuelle possible d’« offrande ».
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: qui me précède
  rationale: Cette formulation française concise rend le mouvement du présent envoyé en avant de Jacob.
- source_word: אֶרְאֶה פָנָיו
  choice: je verrai son visage
  rationale: La traduction garde ici l’image explicite du visage, compréhensible en français, et préserve une partie du jeu de répétition hébreu.
- source_word: אוּלַי יִשָּׂא פָנָי
  choice: Peut-être m’accueillera-t-il favorablement
  rationale: L’idiome signifie accorder un accueil favorable ou accepter la personne. La traduction naturelle maintient l’incertitude exprimée par אוּלַי.
theological_decisions:
- issue: Sens de כפר dans une rencontre humaine
  choice: Je l’apaiserai
  alternative: Je ferai l’expiation devant lui
  rationale: Le moyen employé est un présent destiné à calmer Ésaü ; le passage ne décrit pas un rite sacrificiel. Le choix évite donc d’introduire artificiellement une doctrine cultuelle tout en signalant en note le lien lexical avec le vocabulaire de l’expiation.
- issue: Idiome יִשָּׂא פָנָי
  choice: m’accueillera-t-il favorablement
  alternative: relèvera-t-il mon visage
  rationale: Le sens contextuel est qu’Ésaü pourrait accepter Jacob ou lui témoigner sa faveur. L’idiome littéral est conservé en note afin de ne pas effacer le motif du visage.
translation_notes:
  register: Français international actuel, digne et accessible. Le discours direct conserve la déférence de Jacob. « Présent » maintient un léger registre diplomatique, tandis que les deux notes rendent visible le triple motif hébreu du visage sans imposer au texte principal des idiomes peu naturels en français.
