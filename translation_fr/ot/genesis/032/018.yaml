  text: וַ/יְצַ֥ו אֶת הָ/רִאשׁ֖וֹן לֵ/אמֹ֑ר כִּ֣י יִֽפְגָּשְׁ/ךָ֞ עֵשָׂ֣ו אָחִ֗/י וִ/שְׁאֵֽלְ/ךָ֙ לֵ/אמֹ֔ר לְ/מִי אַ֨תָּה֙ וְ/אָ֣נָה תֵלֵ֔ךְ וּ/לְ/מִ֖י אֵ֥לֶּה לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: fr
  text: 'Il donna cet ordre au premier : « Quand mon frère Ésaü te rencontrera et te demandera : “À qui appartiens-tu ? Où vas-tu ? Et ces bêtes qui sont devant toi, à qui appartiennent-elles ?”... »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: le premier
  rationale: Désigne naturellement le premier des serviteurs ou groupes envoyés en avant, sans ajouter un référent absent de l’hébreu.
- source_word: לְמִי אַתָּה
  choice: À qui appartiens-tu ?
  rationale: Rend littéralement la question d’appartenance, comprise dans ce contexte comme une demande d’identifier le maître du serviteur.
- source_word: וְאָנָה תֵלֵךְ
  choice: Où vas-tu ?
  rationale: Équivalent français direct et naturel de la question de destination.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: Et à qui appartient ce troupeau devant toi ?
  rationale: Le pluriel démonstratif « ceux-ci/ces choses » renvoie contextuellement aux animaux conduits en avant ; « ce troupeau » explicite ce référent sans changer le sens.
- source_word: וַיְצַו
  choice: Il donna cet ordre
  rationale: Expression française idiomatique qui conserve la force directive du verbe צוה.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la question d’appartenance de l’hébreu, tandis que « ce troupeau » évite en français l’expression obscure « ceux-ci devant toi ». Les points de suspension signalent que les instructions se poursuivent au verset suivant, conformément au texte de consultation.
