  text: וַ/יְצַ֞ו גַּ֣ם אֶת הַ/שֵּׁנִ֗י גַּ֚ם אֶת הַ/שְּׁלִישִׁ֔י גַּ֚ם אֶת כָּל הַ/הֹ֣לְכִ֔ים אַחֲרֵ֥י הָ/עֲדָרִ֖ים לֵ/אמֹ֑ר כַּ/דָּבָ֤ר הַ/זֶּה֙ תְּדַבְּר֣וּ/ן אֶל עֵשָׂ֔ו בְּ/מֹצַאֲ/כֶ֖ם אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: fr
  text: 'Il donna aussi cet ordre au deuxième, au troisième et à tous ceux qui marchaient derrière les troupeaux : « Vous parlerez ainsi[a] à Ésaü quand vous le rencontrerez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Selon cette parole, vous parlerez » ; autrement : « Voici ce que vous direz ».'
    reason: La tournure hébraïque peut souligner soit la conformité aux paroles prescrites, soit, plus idiomatiquement, la manière ou le contenu de ce qu’ils doivent dire.
lexical_decisions:
- source_word: וַיְצַו
  choice: Il donna cet ordre
  rationale: Le piel de צוה exprime une directive ferme. « Donner cet ordre » garde cette force tout en s’intégrant naturellement à la phrase française.
- source_word: הַשֵּׁנִי / הַשְּׁלִישִׁי
  choice: au deuxième, au troisième
  rationale: Les ordinaux sont employés comme substantifs dans l’hébreu. Le français peut faire de même sans ajouter « serviteur », nom que le verset ne formule pas explicitement.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: à tous ceux qui marchaient derrière les troupeaux
  rationale: Cette formulation conserve le participe et la position derrière les groupes d’animaux. « Troupeaux » est ici plus courant et immédiatement intelligible que « hardes ».
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  choice: Vous parlerez ainsi
  rationale: L’expression signifie littéralement « selon cette parole, vous parlerez ». « Vous parlerez ainsi » restitue naturellement en français l’instruction de reprendre le message prescrit, tout en conservant le verbe « parler ».
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: quand vous le rencontrerez
  rationale: מצא signifie fondamentalement « trouver », mais, dans cette situation où les serviteurs doivent arriver auprès d’Ésaü, « rencontrer » exprime idiomatiquement le sens contextuel sans ajouter d’idée étrangère.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition hébraïque de « aussi » devant le deuxième et le troisième est allégée afin d’éviter une lourdeur artificielle, tandis que l’énumération et la portée collective de l’ordre sont conservées.
