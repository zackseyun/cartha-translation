  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: fr
  text: 'Il confia à ses serviteurs chaque troupeau séparément[a] et leur dit : « Passez devant moi et laissez un espace entre chaque troupeau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il mit chaque troupeau séparément dans la main de ses serviteurs » ; cette expression signifie qu’il le leur confia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד עֲבָדָיו
  choice: Il confia à ses serviteurs
  rationale: L’expression littérale « mettre/donner dans la main de » signifie ici remettre à la garde ou au contrôle de quelqu’un. « Confier à » restitue naturellement cet idiome en français.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte domestique, le terme désigne les personnes chargées d’exécuter les instructions de Jacob ; « serviteurs » convient sans préciser un statut que le verset ne met pas en avant.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: chaque troupeau séparément
  rationale: La répétition de עֵדֶר a une valeur distributive, et לְבַדּוֹ souligne la séparation de chaque groupe. Cette formulation française rend clairement les deux éléments.
- source_word: עִבְרוּ לְפָנַי
  choice: Passez devant moi
  rationale: עבר exprime ici le déplacement vers l’avant, tandis que לְפָנַי situe les serviteurs devant Jacob. La formulation conserve le mouvement sans supposer un franchissement précis.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: et laissez un espace
  rationale: רֶוַח désigne un espace ou un intervalle. En français, « laisser un espace » est plus naturel dans cette consigne que le calque « mettre un espace ».
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: entre chaque troupeau
  rationale: 'Cette tournure française exprime naturellement la séparation distributive voulue par la répétition hébraïque : un intervalle doit séparer chaque groupe du suivant.'
