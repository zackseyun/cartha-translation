  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: fr
  text: 'Il passa cette nuit-là à cet endroit, puis prit de ce qu’il avait sous la main[a] un présent pour Ésaü, son frère :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de ce qui venait à sa main » ; autre traduction possible : « de ce qu’il avait avec lui » ou « de ce qui était à sa disposition ».'
    reason: L’expression hébraïque désigne idiomatiquement les biens dont Jacob disposait alors ; la note conserve la formulation plus proche de l’hébreu et fournit des équivalents français naturels.
lexical_decisions:
- source_word: וַיָּלֶן
  choice: Il passa … la nuit
  rationale: Le verbe לון désigne le fait de rester ou de loger quelque part pour la nuit. « Passer la nuit » est naturel en français moderne et conserve pleinement le sens temporel.
- source_word: שָׁם
  choice: à cet endroit
  rationale: L’adverbe locatif signifie « là ». Dans cette phrase, « à cet endroit » évite une succession moins naturelle de « cette nuit-là là-bas » tout en gardant la référence au lieu déjà mentionné.
- source_word: בַּלַּיְלָה הַהוּא
  choice: cette nuit-là
  rationale: La tournure rend directement la nuit précise désignée par l’hébreu et convient au récit narratif français.
- source_word: וַיִּקַּח
  choice: Puis il prit
  rationale: לקח signifie normalement « prendre ». « Puis » marque naturellement la progression du récit portée par le wayyiqtol sans surcharger la coordination.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: parmi ce qu’il avait sous la main
  rationale: L’expression hébraïque est littéralement proche de « ce qui venait dans sa main » et désigne ici ce dont Jacob disposait. La formulation française est claire et idiomatique, sans préciser davantage la provenance des biens.
- source_word: מִנְחָה
  choice: un présent
  rationale: Dans ce contexte interpersonnel, מִנְחָה désigne un don destiné à honorer ou à apaiser Ésaü, non une offrande cultuelle. « Présent » convient au registre narratif et annonce naturellement l’énumération qui suit.
- source_word: לְעֵשָׂו אָחִיו
  choice: pour son frère Ésaü
  rationale: La préposition לְ marque le destinataire. L’ordre français « son frère Ésaü » est naturel et maintient explicitement le lien familial.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Deux phrases remplacent la longue coordination hébraïque afin d’assurer une lecture fluide. Le deux-points final est conservé parce que le verset suivant énumère le présent.
