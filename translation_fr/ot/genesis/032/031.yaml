source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: fr
  text: Jacob donna à ce lieu le nom de Peniel[a], car j’ai vu Dieu[b] face à face, et ma vie a été sauvée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Peniel évoque en hébreu l’expression « face de Dieu », en accord avec l’explication de Jacob : « j’ai vu Dieu face à face ».'
    reason: cultural_note
  - marker: b
    text: Le mot traduit par « Dieu » peut aussi, dans certains contextes, désigner « un être divin » ; ici, le contexte favorise « Dieu ».
    reason: alternative_reading
  - marker: c
    text: L’hébreu dit littéralement « ma vie a été délivrée » ; le mot peut aussi désigner la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: donna à ce lieu le nom de
  rationale: Cette tournure française exprime naturellement la formule hébraïque de dénomination tout en conservant explicitement les éléments « lieu » et « nom ».
- source_word: פְּנִיאֵל
  choice: Peniel
  rationale: Le nom est translittéré selon sa forme dans ce verset et conserve le lien sonore avec l’explication « face de Dieu ».
- source_word: כִּי
  choice: car
  rationale: « Car » introduit directement l’explication donnée au nom du lieu et respecte la valeur causale de la conjonction.
- source_word: רָאִיתִי אֱלֹהִים
  choice: j’ai vu Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le plus naturellement Dieu, tout en laissant en note l’autre possibilité lexicale.
- source_word: פָּנִים אֶל פָּנִים
  choice: face à face
  rationale: Cette locution française usuelle rend la rencontre directe et préserve le jeu de mots avec Peniel.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: j’ai eu la vie sauve
  rationale: Cette expression idiomatique rend clairement le fait que Jacob a survécu. נֶפֶשׁ désigne ici sa vie ou sa personne, plutôt qu’une âme immatérielle.
theological_decisions:
- issue: Sens de אֱלֹהִים dans la déclaration de Jacob
  choice: Dieu
  alternative: un être divin
  rationale: Le contexte immédiat présente l’interprétation que Jacob donne lui-même de la rencontre. « Dieu » en conserve la force théologique sans préciser davantage l’identité de celui qu’il a affronté.
- issue: Survie après avoir vu Dieu face à face
  choice: j’ai eu la vie sauve
  alternative: mon âme a été délivrée
  rationale: 'Le français retenu exprime le paradoxe narratif : Jacob affirme avoir vu Dieu directement et avoir pourtant survécu, sans tenter de résoudre cette tension.'
translation_notes:
  register: Français international moderne, simple et digne. La transition abrupte de la narration à la première personne après « car » est maintenue, puisqu’aucune formule comme « il dit » ne figure dans l’hébreu. L’expression idiomatique « avoir la vie sauve » évite le contresens moderne que pourrait suggérer « sauver l’âme ».
