  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: fr
  text: 'Jacob dit : « Dieu de mon père Abraham et Dieu de mon père Isaac, Yahweh, toi qui m’as dit : “Retourne dans ton pays et vers ta parenté[a], et je te ferai du bien[b]”, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers ton lieu d’origine ». Le mot hébreu peut désigner la parenté ou le milieu d’origine.
    reason: ambiguïté_lexicale
  - marker: b
    text: 'Autre traduction possible : « et j’agirai avec bonté envers toi ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: Jacob dit
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français et la conjonction initiale n’est pas nécessaire pour rendre naturellement l’enchaînement.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: Dieu de mon père Abraham et Dieu de mon père Isaac
  rationale: La formulation conserve les deux constructions hébraïques et le sens ancestral, sans corriger « père » en « grand-père ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: הָאֹמֵר אֵלַי
  choice: toi qui m’as dit
  rationale: Le participe hébreu qualifie Yahweh comme celui qui a parlé à Jacob. « Toi qui » marque naturellement l’adresse directe en français.
- source_word: שׁוּב לְאַרְצְךָ
  choice: Retourne dans ton pays
  rationale: שׁוּב exprime le retour, et אֶרֶץ désigne ici le pays ou la terre de Jacob. « Dans ton pays » est idiomatique pour un déplacement vers l’intérieur d’un territoire.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: et vers ta parenté
  rationale: מוֹלֶדֶת peut désigner le groupe familial ou le milieu d’origine. « Parenté » convient au contexte tout en laissant l’autre nuance en note.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: et je te ferai du bien
  rationale: Cette tournure française naturelle exprime l’action bienfaisante promise par le hiphil de יטב avec עִם, sans reproduire servilement la préposition hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » en conserve le caractère de nom propre, tandis que « le SEIGNEUR » est une substitution traditionnelle par un titre.
- issue: Portée de l’expression אֱלֹהֵי אָבִי appliquée à Abraham
  choice: mon père Abraham
  alternative: mon ancêtre Abraham
  rationale: « Père » préserve la formulation et la conception généalogique large de l’hébreu biblique; « ancêtre » expliciterait la relation au prix d’un aplatissement du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient la tonalité narrative; la prière reste directe sans ajout d’une interjection absente de l’hébreu. La ponctuation finale conserve le caractère inachevé de la phrase, qui se poursuit au verset suivant.
