source:
  edition: WLC
  text: וַ/יִּקָּחֵ֔/ם וַ/יַּֽעֲבִרֵ֖/ם אֶת הַ/נָּ֑חַל וַֽ/יַּעֲבֵ֖ר אֶת אֲשֶׁר ל/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/024.yaml
  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: fr
  text: Il les prit et leur fit traverser le torrent[a], puis il fit passer ce qui lui appartenait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cours d’eau », « l’oued » ou « le ravin ». Le mot hébreu נחל peut désigner un cours d’eau, un ravin ou un lit de rivière saisonnier.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce qui était à lui », c’est-à-dire ce qui lui appartenait ou ses biens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: Il les prit
  rationale: Le verbe לקח signifie ici simplement « prendre ». Cette formulation directe n’ajoute pas l’idée, seulement implicite dans le contexte, de les emmener avec lui.
- source_word: וַיַּעֲבִרֵם
  choice: leur fit passer
  rationale: 'La forme hiphil de עבר a une valeur causative : Jacob fait passer les personnes mentionnées. « Leur fit passer » conserve cette valeur tout en restant naturel en français.'
- source_word: הַנָּחַל
  choice: le torrent
  rationale: נחל peut désigner un cours d’eau, un ravin ou un lit de rivière saisonnier. « Torrent » convient au franchissement d’un cours d’eau et demeure accessible, sans imposer la technicité de « oued ».
- source_word: וַיַּעֲבֵר
  choice: il fit passer
  rationale: La seconde forme hiphil de עבר est également causative. La répétition française reflète celle de l’hébreu, cette fois avec les biens de Jacob comme objet.
- source_word: אֲשֶׁר לוֹ
  choice: ce qui lui appartenait
  rationale: Cette expression signifie littéralement « ce qui était à lui ». La traduction retenue restitue naturellement l’idée de ses biens sans remplacer la tournure générale de l’hébreu par un terme plus précis.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La construction causative et la répétition de « fit passer » suivent de près l’hébreu sans lourdeur excessive. Les notes conservent l’étendue sémantique de נחל et la formulation concrète de אֲשֶׁר לוֹ.
