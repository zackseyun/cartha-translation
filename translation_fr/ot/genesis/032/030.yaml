base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: fr
  text: 'Alors Jacob demanda : « S’il te plaît, dis-moi ton nom. » Il répondit : « Pourquoi me demandes-tu mon nom ? » Et il le bénit là.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: Alors Jacob demanda
  rationale: La tournure narrative hébraïque « demanda et dit » est rendue naturellement en français par « demanda », la citation exprimant déjà l’acte de parole.
- source_word: הַגִּידָה נָּא
  choice: S’il te plaît, dis-moi
  rationale: L’impératif hiphil de נגד signifie « dire, faire connaître » ; נָא adoucit la demande. Cette formulation conserve son caractère direct et courtois.
- source_word: שְׁמֶךָ
  choice: ton nom
  rationale: Traduction directe qui préserve la portée identitaire possible de « nom » sans l’expliciter dans le texte.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: Pourquoi me demandes-tu mon nom ?
  rationale: Formulation française naturelle de l’expression hébraïque. Le démonstratif זֶה renforce ici l’interrogation, mais une traduction plus littérale serait lourde en français.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: Et là, il le bénit
  rationale: « Bénit » rend ברך, tandis que « là » garde l’accent porté par שָׁם sur le lieu. Les pronoms maintiennent les référents implicites du texte hébreu.
theological_decisions:
- issue: Identité de celui qui refuse de révéler son nom et bénit Jacob
  choice: Conserver le pronom « il » sans identifier explicitement le personnage
  alternative: « l’homme », « Dieu » ou « l’ange »
  rationale: Dans ce verset, le sujet demeure implicite. Le contexte plus large nourrit son identification théologique, mais la traduction ne doit pas résoudre ce que la formulation hébraïque laisse ici implicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier hébreu et convient au dialogue direct. La coordination finale « Et là » conserve le mouvement narratif et l’insistance locale sans lourdeur.
