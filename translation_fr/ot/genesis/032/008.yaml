  text: וַ/יִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַ/יֵּ֣צֶר ל֑/וֹ וַ/יַּ֜חַץ אֶת הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ וְ/אֶת הַ/צֹּ֧אן וְ/אֶת הַ/בָּקָ֛ר וְ/הַ/גְּמַלִּ֖ים לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: fr
  text: Alors Jacob eut très peur et fut dans l’angoisse. Il divisa en deux camps[a] les gens qui étaient avec lui, le petit bétail, le gros bétail et les chameaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « deux groupes ». Le mot hébreu peut désigner un camp ou un groupe organisé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא יַעֲקֹב מְאֹד
  choice: Jacob eut très peur
  rationale: Le verbe ירא exprime la peur, intensifiée par מְאֹד. « Eut très peur » est naturel en français moderne et conserve pleinement cette intensité.
- source_word: וַיֵּצֶר לוֹ
  choice: fut dans l’angoisse
  rationale: Cette tournure idiomatique exprime une détresse intérieure ou une vive angoisse. La formulation française évite un calque maladroit tout en maintenant cet état distinct de la peur déjà mentionnée.
- source_word: וַיַּחַץ
  choice: divisa
  rationale: Le verbe חצה signifie partager ou diviser. « Divisa » rend clairement l’action délibérée de Jacob.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: les gens qui étaient avec lui
  rationale: Dans ce contexte, עָם désigne les personnes du groupe qui accompagne Jacob, et non un peuple au sens ethnique ou national.
- source_word: הַצֹּאן
  choice: le petit bétail
  rationale: צֹאן est un collectif désignant principalement les moutons et les chèvres. « Le petit bétail » en conserve la portée générique.
- source_word: הַבָּקָר
  choice: le gros bétail
  rationale: בָּקָר désigne collectivement les bovins. « Le gros bétail » forme un parallèle précis avec « le petit bétail ».
- source_word: הַגְּמַלִּים
  choice: les chameaux
  rationale: Traduction directe du pluriel גְּמַלִּים.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: en deux camps
  rationale: מַחֲנוֹת peut désigner des camps ou les groupes qui les constituent. « Deux camps » préserve le terme narratif repris dans le contexte immédiat.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La première phrase conserve la distinction entre la peur et l’angoisse, tandis que l’énumération reste concise et naturelle.
