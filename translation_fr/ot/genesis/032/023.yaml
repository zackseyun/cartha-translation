base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: fr
  text: Cette nuit-là, il se leva, prit ses deux épouses, ses deux servantes[a] et ses onze enfants, puis traversa le gué du Yabboq.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses deux femmes esclaves ». Le mot hébreu שִׁפְחֹתָיו désigne des femmes de statut domestique subordonné et peut impliquer l’esclavage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: il se leva
  rationale: Le qal de קום exprime ici le fait de se lever; cette formulation est naturelle et conserve le registre narratif.
- source_word: בַּלַּיְלָה הוּא
  choice: Cette nuit-là
  rationale: Cette tournure idiomatique rend la valeur temporelle de l’expression hébraïque et l’insistance apportée par le pronom.
- source_word: וַיִּקַּח
  choice: prit
  rationale: לקח signifie couramment « prendre »; dans le contexte, Jacob rassemble les membres de sa maisonnée et les emmène, sans qu’il soit nécessaire d’expliciter davantage.
- source_word: שְׁתֵּי נָשָׁיו
  choice: ses deux femmes
  rationale: נָשִׁים désigne ici sans ambiguïté les deux épouses de Jacob; « femmes » est une désignation naturelle des épouses en français contemporain.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: ses deux servantes[a]
  rationale: שִׁפְחָה désigne une femme de statut domestique subordonné, pouvant relever de l’esclavage. « Servantes » convient au texte principal, tandis qu’une note préserve l’autre rendu possible.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: ses onze enfants
  rationale: יְלָדִים signifie « enfants » ou « descendants », et non spécifiquement « fils »; le rendu suit donc la forme lexicale sans harmonisation interprétative.
- source_word: וַיַּעֲבֹר
  choice: traversa
  rationale: Dans ce contexte de déplacement, עבר désigne l’action de franchir ou traverser.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: le gué du Yabboq
  rationale: מַעֲבַר désigne un lieu de passage, ici le gué du cours d’eau nommé Yabboq.
- source_word: יַבֹּק
  choice: Yabboq
  rationale: Translittération française proche de la forme hébraïque du nom propre יַבֹּק.
