id: GEN.32.13
reference: Genesis 32:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: fr
  text: 'Mais toi, tu as dit : « Je te ferai certainement du bien[a], et je rendrai ta descendance[b] pareille au sable de la mer, qu’on ne peut compter[c] tant il est abondant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne manquerai pas de te faire du bien. » L’hébreu renforce le verbe au moyen d’un infinitif absolu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ta semence ». Le mot hébreu est un singulier collectif désignant la postérité dans son ensemble.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qu’on ne peut dénombrer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: 'Le pronom indépendant donne de l’emphase, et la conjonction prend ici une valeur adversative dans l’appel de Jacob : la promesse divine contraste avec le danger présent.'
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: Je te ferai certainement du bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Certainement » restitue cette insistance, tandis que « faire du bien à » rend naturellement l’expression hébraïque sans la limiter à la prospérité matérielle.
- source_word: וְשַׂמְתִּי
  choice: et je rendrai
  rationale: Dans ce contexte, שׂים signifie faire devenir ou rendre d’une certaine manière, plutôt que poser au sens matériel.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: Le nom hébreu est un singulier collectif. « Descendance » conserve cette valeur collective en français moderne.
- source_word: כְּחוֹל הַיָּם
  choice: pareille au sable de la mer
  rationale: Cette formulation conserve l’image hébraïque et s’accorde naturellement avec le nom féminin « descendance ».
- source_word: אֲשֶׁר לֹא יִסָּפֵר
  choice: qu’on ne peut compter
  rationale: Le niphal exprime ici l’impossibilité pratique de dénombrer le sable. La tournure impersonnelle française est naturelle et fidèle.
- source_word: מֵרֹב
  choice: tant il est abondant
  rationale: 'La préposition מן avec רֹב indique la cause : le sable ne peut être compté en raison de sa très grande quantité. Cette formulation française explicite naturellement ce rapport.'
