base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: fr
  text: Je suis indigne de toutes tes bontés et de toute la fidélité dont tu as fait preuve envers ton serviteur[a], car c’est avec mon bâton que j’ai traversé ce Jourdain[b], et maintenant je forme deux camps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Je suis petit par rapport à toutes les bontés et à toute la fidélité. » Cette tournure hébraïque exprime l’humilité devant la générosité de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec mon bâton, j’ai traversé ce Jourdain ». Le contexte suggère que Jacob souligne qu’il possédait alors très peu.'
    reason: literal_rendering
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: Je suis indigne
  rationale: Le verbe signifie littéralement « être petit », mais, dans cette comparaison avec les bienfaits reçus de Dieu, il exprime l’humilité et le sentiment de ne pas les mériter. « Je suis indigne » transmet naturellement cette valeur en français.
- source_word: הַחֲסָדִים
  choice: toutes tes bontés
  rationale: Le pluriel renvoie aux manifestations répétées de la bonté loyale de Dieu. Le pluriel français « bontés » conserve cette dimension concrète sans alourdir le verset.
- source_word: הָאֱמֶת
  choice: toute la fidélité
  rationale: Associé à חֲסָדִים, אֱמֶת désigne ici la constance et la fiabilité de Dieu plutôt que la vérité abstraite.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: dont tu as fait preuve envers ton serviteur
  rationale: Cette tournure française naturelle rend l’action bienveillante exercée envers Jacob tout en conservant son auto-désignation comme serviteur.
- source_word: בְמַקְלִי
  choice: Je n’avais que mon bâton
  rationale: L’hébreu dit formellement « avec mon bâton ». Dans le contraste avec les deux camps actuels, cette expression souligne le dénuement de Jacob lors de son premier passage; la formulation française explicite sobrement cette implication, signalée en note.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: quand j’ai traversé ce Jourdain
  rationale: « Ce Jourdain » maintient le démonstratif hébreu et l’immédiateté géographique du propos.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: maintenant je suis devenu deux camps
  rationale: Cette formulation conserve l’image concrète et quelque peu frappante de l’hébreu, selon laquelle Jacob et les siens constituent désormais deux camps.
theological_decisions:
- issue: Sens du couple חֲסָדִים / אֱמֶת dans l’action de Dieu envers Jacob
  choice: « bontés » et « fidélité »
  alternative: « amour constant » et « fidélité »; « bienfaits de l’amour fidèle » et « fidélité »
  rationale: Le choix distingue la bonté loyale manifestée dans des actes répétés de la constance fiable de Dieu. Il préserve la portée relationnelle du couple sans introduire explicitement une terminologie d’alliance absente de la phrase.
- issue: Portée de l’humilité exprimée par קָטֹנְתִּי
  choice: « Je suis indigne »
  alternative: « Je suis trop petit »; « Je suis moindre que »
  rationale: Le texte exprime l’abaissement de Jacob devant la générosité divine. « Indigne » communique cette tension sans en faire une déclaration doctrinale plus générale sur sa condition.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe de Jacob à Dieu. La formulation conserve l’image finale des « deux camps » et explique en notes les deux idiomes hébreux principaux.
