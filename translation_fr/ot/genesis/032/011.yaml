  naturalness: Le français est globalement moderne et digne. « Je forme maintenant deux camps » rend plus naturellement en français l’expression hébraïque volontairement frappante « je suis devenu deux camps », sans introduire l’idée supplémentaire que Jacob en serait simplement le chef.
  terminology: « Bontés » et « fidélité » distinguent bien les deux termes hébreux et conviennent au registre. « Ton serviteur » maintient correctement l’auto-désignation de Jacob. « Indigne » est une interprétation idiomatique défendable de « je suis petit », et la note en donne l’alternative littérale.
