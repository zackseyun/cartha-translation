revisions:
- from: Je suis indigne de toutes tes bontés et de toute la fidélité dont tu as fait preuve envers ton serviteur[a]. Je n’avais que mon bâton quand j’ai traversé ce Jourdain[b], et maintenant je suis devenu deux camps.
  to: Je suis indigne de toutes tes bontés et de toute la fidélité dont tu as fait preuve envers ton serviteur[a], car c’est avec mon bâton que j’ai traversé ce Jourdain[b], et maintenant je forme deux camps.
  rationale: La révision retire du texte principal l’ajout interprétatif « que » et restitue directement « avec mon bâton ». Elle remplace également le calque français abrupt « je suis devenu deux camps » par « je forme deux camps », qui reste fidèle au sens de l’hébreu tout en étant plus idiomatique. Les notes conservent l’explication de l’humilité exprimée par קָטֹנְתִּי et l’implication contextuelle du bâton.
