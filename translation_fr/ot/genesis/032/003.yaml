  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: fr
  text: 'Quand Jacob les vit, il dit : « C’est le camp de Dieu. » Il donna à ce lieu le nom de Mahanaïm[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom « Mahanaïm » évoque en hébreu « deux camps » ou « double camp », en écho aux paroles de Jacob : « C’est le camp de Dieu. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאָם
  choice: Quand Jacob les vit
  rationale: כַּאֲשֶׁר a ici une valeur temporelle naturelle, et le suffixe masculin pluriel de רָאָם renvoie aux anges de Dieu mentionnés dans le contexte précédent.
- source_word: מַחֲנֵה אֱלֹהִים
  choice: le camp de Dieu
  rationale: Cette traduction directe du groupe construit conserve le sens ordinaire de מַחֲנֶה et prépare le jeu de mots avec Mahanaïm.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: Il donna donc à cet endroit le nom de
  rationale: Cette formulation française naturelle rend l’expression hébraïque « appeler le nom de ce lieu » sans produire un calque peu idiomatique.
- source_word: מַחֲנָיִם
  choice: Mahanaïm
  rationale: Le nom propre est translittéré selon l’usage français; sa forme évoque vraisemblablement « deux camps » ou « double camp », nuance indiquée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La syntaxe narrative reste concise; « donna… le nom de » évite un calque artificiel tout en conservant l’acte de nomination. Le marqueur de note est placé après « Mahanaïm », puisque la note explique ce nom.
