  text: וַ/יִּשְׁלַ֨ח יַעֲקֹ֤ב מַלְאָכִים֙ לְ/פָנָ֔י/ו אֶל עֵשָׂ֖ו אָחִ֑י/ו אַ֥רְצָ/ה שֵׂעִ֖יר שְׂדֵ֥ה אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: fr
  text: Jacob envoya devant lui des messagers à son frère Ésaü, au pays de Séir, territoire d’Édom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le champ d’Édom » ; l’expression désigne probablement la région ou le territoire d’Édom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya
  rationale: Le wayyiqtol de שלח exprime simplement l’action passée dans le récit; « envoya » est l’équivalent français naturel.
- source_word: מַלְאָכִים
  choice: des messagers
  rationale: Le contexte désigne des représentants humains envoyés par Jacob, et non des anges; « messagers » conserve le sens courant sans la nuance diplomatique plus marquée d’« émissaires ».
- source_word: לְפָנָיו
  choice: devant lui
  rationale: L’expression signifie qu’ils sont envoyés en avant de Jacob; « devant lui » reste naturelle et proche de l’image hébraïque.
- source_word: עֵשָׂו אָחִיו
  choice: son frère Ésaü
  rationale: Cette tournure française naturelle conserve le nom propre et le lien de parenté exprimés par l’hébreu.
- source_word: אַרְצָה שֵׂעִיר
  choice: au pays de Séir
  rationale: La terminaison directionnelle indique un mouvement vers le pays de Séir; « au pays de Séir » rend explicitement אֶרֶץ tout en restant idiomatique.
- source_word: שְׂדֵה אֱדֹם
  choice: dans le territoire d’Édom
  rationale: Littéralement « le champ d’Édom », la locution fonctionne ici comme une désignation régionale; « territoire » communique ce sens géographique en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne international, narratif et digne. La phrase privilégie une syntaxe fluide tout en conservant les deux désignations géographiques et en signalant en note la formulation concrète de l’hébreu.
