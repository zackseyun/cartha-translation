  text: וַ/יֹּ֕אמֶר אִם יָב֥וֹא עֵשָׂ֛ו אֶל הַ/מַּחֲנֶ֥ה הָ/אַחַ֖ת וְ/הִכָּ֑/הוּ וְ/הָיָ֛ה הַ/מַּחֲנֶ֥ה הַ/נִּשְׁאָ֖ר לִ/פְלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: fr
  text: 'Il dit : « Si Ésaü vient vers l’un des camps et le frappe, le camp qui restera échappera[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sera pour l’échappée », c’est-à-dire qu’il survivra ou échappera à la destruction.'
    reason: L’hébreu emploie une tournure nominale qui peut mettre l’accent soit sur la fuite, soit sur la survie.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol de אמר poursuit le récit au passé. En français, « Il dit » est naturel sans rendre systématiquement la conjonction initiale.
- source_word: אִם
  choice: Si
  rationale: La conjonction introduit une hypothèse et préserve le caractère conditionnel du raisonnement de Jacob.
- source_word: יָבוֹא עֵשָׂו אֶל
  choice: Ésaü vient vers
  rationale: בוא garde son sens simple de « venir », et אֶל est rendu par « vers » ; l’action hostile est exprimée par le verbe suivant.
- source_word: הַמַּחֲנֶה הָאַחַת
  choice: l’un des camps
  rationale: Cette formulation française naturelle désigne l’un des deux camps constitués dans le contexte immédiat, sans les confondre.
- source_word: וְהִכָּהוּ
  choice: et le frappe
  rationale: נכה signifie couramment « frapper ». Le pronom masculin singulier reprend collectivement le camp.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: le camp qui restera
  rationale: נשאר désigne ce qui subsiste ou reste après l’action envisagée.
- source_word: לִפְלֵיטָה
  choice: échappera
  rationale: Le nom פְלֵיטָה exprime l’échappée ou la survie. La verbalisation en français rend naturellement le résultat de l’expression hébraïque.
