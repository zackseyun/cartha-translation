  text: וַ/יִּוָּתֵ֥ר יַעֲקֹ֖ב לְ/בַדּ֑/וֹ וַ/יֵּאָבֵ֥ק אִישׁ֙ עִמּ֔/וֹ עַ֖ד עֲל֥וֹת הַ/שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: fr
  text: Jacob resta seul, et un homme[b] lutta avec lui jusqu’au lever de l’aurore[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’au point du jour »; littéralement : « jusqu’au lever de l’aurore ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « un homme »; la suite du récit et Osée 12.4 apportent d’autres éléments sur son identité.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: resta
  rationale: Le nifal peut exprimer que Jacob « fut laissé » seul, mais en français narratif « resta seul » est plus naturel et conserve le fait qu’il se retrouve isolé après le passage des autres.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: Équivalent français direct et idiomatique, qui souligne l’isolement de Jacob.
- source_word: וַיֵּאָבֵק
  choice: lutta
  rationale: Le verbe rare désigne ici une lutte physique au corps à corps. « Lutta » convient au registre narratif biblique; la note précise la nuance possible de « combattit corps à corps ».
- source_word: אִישׁ
  choice: un homme
  rationale: L’hébreu présente d’abord le personnage comme « un homme ». Cette formulation maintient le mystère narratif sans anticiper son identification ultérieure.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Rend directement la relation entre l’homme et Jacob dans la lutte.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: jusqu’au lever de l’aurore
  rationale: Rend de près l’image hébraïque de la montée ou du lever de l’aurore, dans un français naturel et digne.
theological_decisions:
- issue: Identité de אִישׁ dans la scène de lutte
  choice: un homme
  alternative: un ange; Dieu ou le SEIGNEUR apparaissant sous forme humaine
  rationale: Ce verset nomme seulement le personnage « un homme ». Le contexte ultérieur et Osée 12.4 éclairent son identité, mais la traduction conserve ici la progression et la tension du récit.
translation_notes:
  register: Français international moderne, sobre et narratif. « Au lever de l’aurore » conserve l’image poétique de l’hébreu sans archaïsme marqué. Les appels de notes suivent les expressions qu’ils éclairent.
