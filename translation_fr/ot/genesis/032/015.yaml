- source_word: עִזִּים
  choice: chèvres
  rationale: Dans cet inventaire où le terme est opposé à תְיָשִׁים, « chèvres » désigne naturellement les femelles en français courant.
- source_word: מָאתַיִם
  choice: deux cents
  rationale: Rendu direct du nombre cardinal; « cents » prend ici la marque du pluriel puisqu’il n’est pas suivi d’un autre nombre.
- source_word: תְיָשִׁים
  choice: boucs
  rationale: Terme français courant et précis pour les chèvres mâles.
- source_word: עֶשְׂרִים
  choice: vingt
  rationale: Rendu direct du nombre cardinal.
- source_word: רְחֵלִים
  choice: brebis
  rationale: Le mot hébreu désigne des moutons femelles; « brebis » conserve clairement la distinction avec les béliers.
- source_word: אֵילִים
  choice: béliers
  rationale: Équivalent français usuel et précis pour les moutons mâles dans ce contexte d’élevage.
