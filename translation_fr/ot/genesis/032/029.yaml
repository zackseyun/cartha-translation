  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: fr
  text: 'Il dit : « On ne t’appellera plus Jacob, mais Israël, car tu as lutté avec Dieu[a] et avec des hommes[b], et tu l’as emporté. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un être divin » ou « des êtres divins ». Selon le contexte, le mot hébreu אֱלֹהִים peut désigner Dieu, des dieux ou des êtres célestes. Ici, le texte principal retient « Dieu » en raison du contexte du récit.
    reason: Lecture alternative préservant l’ambiguïté du terme hébreu et de l’identité mystérieuse de l’adversaire.
  - marker: b
    text: Ou « des êtres humains » ou « des gens ».
    reason: Autres équivalents possibles du pluriel hébreu אֲנָשִׁים.
lexical_decisions:
- source_word: יֵאָמֵר
  choice: on ne t’appellera
  rationale: Dans cette formule d’attribution d’un nom, le passif hébreu se rend naturellement en français par la tournure impersonnelle « on t’appellera », qui conserve le sens déclaratif.
- source_word: עוֹד
  choice: plus
  rationale: Avec la négation, « ne… plus » exprime clairement la cessation de l’ancien nom.
- source_word: כִּי אִם
  choice: mais
  rationale: 'La locution établit ici l’opposition propre à une formule de changement de nom : non plus Jacob, mais Israël.'
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est translittéré selon son usage français traditionnel; le jeu de mots est suggéré par le verbe qui suit.
- source_word: שָׂרִיתָ
  choice: tu as lutté
  rationale: Le verbe évoque l’idée de lutter ou de combattre et participe au jeu de mots expliquant le nom Israël. « Lutter » est clair, actuel et suffisamment large pour ne pas limiter le propos à un affrontement uniquement physique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte narratif, le singulier « Dieu » rend le mieux le référent visé, tout en laissant la note signaler l’amplitude sémantique du terme hébreu.
- source_word: אֲנָשִׁים
  choice: des hommes
  rationale: Le nom hébreu est un pluriel masculin et forme ici un contraste avec Dieu. « Des hommes » en garde la précision formelle, tandis que la note présente les lectures plus générales.
- source_word: וַתּוּכָל
  choice: tu l’as emporté
  rationale: Dans le contexte de la lutte, le verbe יכל indique que Jacob a réussi à tenir tête et à obtenir l’issue recherchée. « L’emporter » exprime cette réussite sans suggérer nécessairement une victoire absolue sur Dieu.
theological_decisions:
- issue: Référent de אֱלֹהִים dans l’explication du nom
  choice: Dieu
  alternative: un être divin / des êtres divins
  rationale: Le récit présente mystérieusement la lutte comme une rencontre avec Dieu, bien que l’adversaire ait une apparence humaine. Le texte principal conserve cette force théologique, et la note maintient l’ambiguïté lexicale possible.
- issue: Portée de אֲנָשִׁים
  choice: des hommes
  alternative: des êtres humains / des gens
  rationale: Le pluriel masculin du texte source et le contraste rhétorique avec Dieu justifient « des hommes ». Les équivalents plus généraux restent possibles et sont indiqués en note.
- issue: Sens de la réussite exprimée par וַתּוּכָל
  choice: tu l’as emporté
  alternative: tu as prévalu / tu as été capable de tenir bon
  rationale: La formulation exprime une issue favorable pour Jacob sans transformer la scène en affirmation simpliste d’une domination totale sur Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « On ne t’appellera plus » est idiomatique tout en gardant la solennité de la déclaration. « Tu l’as emporté » évite l’archaïsme de « tu as prévalu » et préserve la tension du récit.
