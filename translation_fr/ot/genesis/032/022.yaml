  text: וַ/תַּעֲבֹ֥ר הַ/מִּנְחָ֖ה עַל פָּנָ֑י/ו וְ/ה֛וּא לָ֥ן בַּ/לַּֽיְלָה הַ/ה֖וּא בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: fr
  text: Ainsi, le cadeau passa devant lui[a], mais lui-même passa la nuit dans le camp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le présent ». Le mot hébreu מִנְחָה peut désigner un cadeau, un tribut ou une offrande ; ici, il s’agit du cadeau que Jacob a envoyé devant lui à Ésaü.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: passa
  rationale: Le verbe עבר au wayyiqtol décrit ici la progression du cadeau envoyé en avant. « Passa » conserve le mouvement narratif sans introduire explicitement la traversée d’un cours d’eau, absente de cette proposition.
- source_word: הַמִּנְחָה
  choice: le cadeau
  rationale: Dans ce contexte, מִנְחָה désigne ce que Jacob envoie à Ésaü pour gagner sa faveur, et non une offrande cultuelle. « Cadeau » est clair et courant en français moderne.
- source_word: עַל־פָּנָיו
  choice: devant lui
  rationale: L’expression signifie littéralement « devant sa face » et indique ici que le cadeau précède Jacob. « Devant lui » préserve l’image hébraïque tout en restant naturel en français.
- source_word: וְהוּא
  choice: mais lui-même
  rationale: Le pronom indépendant met Jacob en contraste avec le cadeau parti devant lui. « Mais lui-même » rend explicitement cette valeur contrastive.
- source_word: לָן
  choice: passa cette nuit-là
  rationale: Le verbe לון/לין signifie loger ou passer la nuit. Avec le complément temporel, « passa cette nuit-là » est idiomatique et précis.
- source_word: בַּמַּחֲנֶה
  choice: dans le camp
  rationale: מַחֲנֶה désigne un camp ou un campement; « camp » est l’équivalent français moderne le plus direct.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La structure contrastive entre le cadeau qui précède Jacob et Jacob qui reste au camp est conservée.
