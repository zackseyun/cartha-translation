base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: fr
  text: Laban se leva de bon matin, embrassa ses fils et ses filles[a], et les bénit. Puis il s’en alla et retourna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ses fils et ses filles ». Dans ce contexte, ces termes peuvent inclure ses descendants, notamment ses petits-enfants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: se leva de bon matin
  rationale: Cette tournure française naturelle exprime à la fois l’idée de se lever tôt portée par שׁכם et la mention du matin.
- source_word: וַיְנַשֵּׁק
  choice: embrassa
  rationale: Dans ce contexte d’adieux familiaux, le verbe désigne le fait de donner des baisers; « embrassa » est direct et idiomatique en français.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: ses fils et ses filles
  rationale: La traduction conserve les deux termes de parenté genrés du texte hébreu, sans les réduire à « ses enfants » ni trancher dans le corps du texte la question de leur portée générationnelle.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: et les bénit
  rationale: ברך signifie ici bénir; le contexte permet d’y voir une bénédiction d’adieu, mais ne justifie pas de remplacer le sens lexical par une simple formule d’adieu.
- source_word: וַיֵּלֶךְ
  choice: il s’en alla
  rationale: Cette expression rend naturellement le départ de Laban tout en maintenant la succession des deux verbes de mouvement.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: retourna chez lui
  rationale: שׁוב exprime le retour. « Chez lui » rend idiomatiquement לִמְקֹמוֹ dans ce contexte, où « à son lieu » serait peu naturel en français.
theological_decisions:
- issue: Portée des termes de parenté genrés
  choice: ses fils et ses filles
  alternative: ses enfants / ses petits-enfants
  rationale: L’hébreu distingue explicitement les fils et les filles. Ces mots peuvent toutefois avoir une portée familiale plus large et inclure des descendants; cette ambiguïté est signalée en note plutôt que résolue dans le texte.
translation_notes:
  register: Français international moderne, fluide et digne. « De bon matin » est courant sans être familier; « chez lui » évite le calque peu naturel « à son lieu ». Le nom de Laban n’est pas répété dans la dernière phrase, puisque le pronom français identifie clairement le même sujet.
