  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: fr
  text: Le soleil se leva sur lui lorsqu’il passa Penouel[a], et il boitait de la cuisse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom du lieu est écrit ici « Penouel » en hébreu ; ailleurs, il apparaît aussi sous la forme « Peniel ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur sa cuisse ». Dans le contexte immédiat, il est question de l’articulation de la hanche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח
  choice: se leva
  rationale: Avec « le soleil » pour sujet, le verbe זרח désigne naturellement le lever ou l’apparition du soleil.
- source_word: לוֹ
  choice: sur lui
  rationale: Cette formulation conserve la perspective de l’hébreu, où le soleil se lève sur Jacob, sans introduire la nuance potentiellement bénéfactive de « pour lui ».
- source_word: כַּאֲשֶׁר עָבַר
  choice: au moment où il passait
  rationale: Rend clairement la relation temporelle entre le lever du soleil et le passage de Jacob à Penouel, sans préciser indûment qu’il traversait un cours d’eau ou une frontière.
- source_word: פְּנוּאֵל
  choice: Penouel
  rationale: Translittération française usuelle de la forme précise פְּנוּאֵל présente dans ce verset; la variante Peniel est signalée en note.
- source_word: צֹלֵעַ
  choice: il boitait
  rationale: Le participe décrit l’état ou l’action continue de Jacob après sa blessure; l’imparfait français exprime naturellement cette durée.
- source_word: עַל יְרֵכוֹ
  choice: à cause de sa cuisse
  rationale: Le sens causal de עַל donne une phrase française claire, tandis que « cuisse » garde le terme anatomique du verset sans importer automatiquement la précision « articulation de la hanche » du contexte précédent.
theological_decisions:
- issue: Nuance possible de לוֹ dans l’expression du lever du soleil
  choice: sur lui
  alternative: pour lui
  rationale: « Sur lui » maintient l’image spatiale et évite de présenter explicitement le lever du soleil comme un bienfait providentiel, nuance que l’hébreu ne tranche pas nécessairement.
- issue: Rapport entre la boiterie et יְרֵכוֹ
  choice: à cause de sa cuisse
  alternative: sur sa cuisse
  rationale: La traduction principale explicite le rapport causal requis par le français courant; une note conserve la formulation plus littérale et l’ambiguïté anatomique du mot hébreu.
translation_notes:
  register: Français international moderne, sobre et narratif. « Se leva sur lui » garde l’image hébraïque tout en restant intelligible; « au moment où » fluidifie la relation temporelle. Les notes préservent la variante du toponyme et l’ambiguïté anatomique.
