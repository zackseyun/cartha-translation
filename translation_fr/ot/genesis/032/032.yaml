    issue: Rendu causal trop explicatif de עַל יְרֵכוֹ
    rationale: « À cause de sa cuisse » explicite une causalité et sous-entend une blessure non nommée dans le verset. « Il boitait de la cuisse » conserve plus naturellement en français la référence à la partie affectée tout en restant proche de l’hébreu.
  - severity: low
    issue: Aspect de « au moment où il passait »
    rationale: L’imparfait introduit une durée/simultanéité plus marquée que nécessaire. « Lorsqu’il passa » rend simplement la circonstance temporelle exprimée par כַּאֲשֶׁר עָבַר.
