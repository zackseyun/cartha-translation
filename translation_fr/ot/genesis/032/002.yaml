  text: וְ/יַעֲקֹ֖ב הָלַ֣ךְ לְ/דַרְכּ֑/וֹ וַ/יִּפְגְּעוּ ב֖/וֹ מַלְאֲכֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: fr
  text: Jacob poursuivit son chemin, et des anges de Dieu vinrent à sa rencontre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rencontrèrent » ou « tombèrent sur lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲקֹב
  choice: Jacob
  rationale: Le waw assure ici la continuité narrative. En français, cette continuité est rendue naturellement sans ajouter nécessairement « Et » en tête de phrase.
- source_word: הָלַךְ לְדַרְכּוֹ
  choice: poursuivit son chemin
  rationale: Littéralement proche de « alla sur son chemin », l’expression indique que Jacob continue sa route. « Poursuivit son chemin » est naturel en français et conserve ce mouvement continu.
- source_word: וַיִּפְגְּעוּ בוֹ
  choice: vinrent à sa rencontre
  rationale: Le verbe פגע construit avec ב peut signifier rencontrer, croiser ou tomber sur quelqu’un. Cette formulation demeure naturelle et ne précise ni hostilité ni caractère fortuit.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: des anges de Dieu
  rationale: מַלְאָךְ peut désigner un messager humain ou un ange. Le contexte immédiat du « camp de Dieu » au verset suivant favorise ici des êtres célestes, tandis que « de Dieu » reproduit clairement la relation du groupe construit hébreu.
theological_decisions:
- issue: Référent de מַלְאֲכֵי אֱלֹהִים
  choice: des anges de Dieu
  alternative: des messagers de Dieu
  rationale: Le nom מַלְאָךְ reste lexicalement susceptible de désigner des messagers humains, mais l’identification du lieu comme « camp de Dieu » au verset suivant soutient fortement le sens surnaturel. Le texte principal retient donc « anges » sans développer davantage leur nature.
translation_notes:
  register: Français international moderne, sobre et narratif. « Poursuivit son chemin » évite un calque maladroit, tandis que « vinrent à sa rencontre » préserve l’amplitude de פגע sans suggérer une attaque. Le déterminant indéfini « des » convient à la première introduction de ces anges en français.
