  to: 'Délivre-moi, je t’en prie, de la main de mon frère, de la main d’Ésaü, car j’ai peur de lui : de peur qu’il ne vienne me frapper, moi, la mère avec les enfants[a].'
  rationale: '« De peur qu’il ne vienne » reproduit naturellement la crainte exprimée par פֶּן. L’ajout de « moi » rend la juxtaposition hébraïque intelligible en français : Jacob redoute d’être frappé, lui-même, ainsi que la mère avec les enfants. La note conserve l’image littérale et explique l’idiome sans imposer « tuer » ou « massacrer ».'
