base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: fr
  text: 'Délivre-moi, je t’en prie, de la main de mon frère, de la main d’Ésaü, car j’ai peur de lui : de peur qu’il ne vienne me frapper, moi, la mère avec les enfants[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « mère sur enfants » : expression désignant une mère frappée avec ses enfants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: Délivre-moi, je t’en prie
  rationale: L’impératif hiphil de נצל exprime la demande d’être arraché au danger; נָא adoucit la requête. Cette formulation garde le ton suppliant et digne de la prière.
- source_word: מִיַּד
  choice: de la main de
  rationale: L’image hébraïque désigne le pouvoir ou l’emprise de quelqu’un. Elle reste transparente en français et sa répétition est conservée.
- source_word: אָחִי ... עֵשָׂו
  choice: mon frère, de la main d’Ésaü
  rationale: La répétition souligne que l’ennemi redouté est précisément le frère de Jacob et renforce la tension du récit.
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: car j’ai peur de lui
  rationale: Formulation naturelle en français moderne qui rend l’état présent de crainte et la valeur causale de כִּי.
- source_word: פֶּן יָבוֹא
  choice: il pourrait venir
  rationale: פֶּן introduit une éventualité redoutée. Le conditionnel exprime naturellement cette crainte en français sans présenter l’attaque comme certaine.
- source_word: וְהִכַּנִי
  choice: et me frapper
  rationale: Le hiphil de נכה signifie ici frapper ou abattre. « Frapper » préserve l’étendue sémantique du terme sans préciser à tort « tuer ».
- source_word: אֵם עַל בָּנִים
  choice: mère et enfants
  rationale: La formule évoque une mère frappée avec ses enfants lors d’un massacre sans distinction. Le tour français concis garde l’image familiale tout en évitant une apposition qui identifierait Jacob à la mère.
theological_decisions:
- issue: Portée de l’expression violente אֵם עַל בָּנִים
  choice: mère et enfants
  alternative: la mère avec les enfants; une mère avec ses enfants
  rationale: L’hébreu conserve une formulation condensée et idiomatique. Le texte principal en reproduit la tension sans ajouter explicitement « tuer » ou « massacrer »; la note explique la portée collective probable.
translation_notes:
  register: Français international moderne, digne et accessible. La prière conserve une légère solennité avec « je t’en prie » et l’image biblique « de la main de ». La ponctuation clarifie que « mère et enfants » étend la portée de l’attaque redoutée.
