  text: וַ/יַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔/וֹ וַ/יִּגַּ֖ע בְּ/כַף יְרֵכ֑/וֹ וַ/תֵּ֨קַע֙ כַּף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/הֵֽאָבְק֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: fr
  text: Quand il vit qu’il ne pouvait pas l’emporter sur lui[a], il toucha l’articulation de sa hanche[b][c], et l’articulation de la hanche de Jacob se déboîta pendant qu’il luttait avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne pouvait pas le vaincre ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « le creux de sa cuisse » ; traditionnellement : « le creux de sa cuisse ».'
    reason: lexical_alternative
  - marker: c
    text: 'Les pronoms hébreux restent ambigus : le verset ne nomme pas de nouveau l’adversaire de Jacob.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quand il vit
  rationale: Le waw consécutif fait progresser le récit, tandis que le contexte donne à la proposition une valeur temporelle naturelle en français.
- source_word: לֹא יָכֹל לוֹ
  choice: il ne pouvait pas l’emporter sur lui
  rationale: La construction יכל + ל exprime l’incapacité à prendre l’avantage sur l’adversaire. Cette formulation convient au combat sans suggérer une incapacité absolue.
- source_word: וַיִּגַּע
  choice: il toucha
  rationale: נגע signifie normalement « toucher ». Malgré l’effet produit, le verbe volontairement sobre du texte hébreu est conservé.
- source_word: בְּכַף יְרֵכוֹ
  choice: l’articulation de sa hanche
  rationale: Dans ce contexte, כף ירך désigne le creux ou l’emboîture de la région de la hanche. « L’articulation de la hanche » est clair et naturel en français moderne.
- source_word: וַתֵּקַע
  choice: se démit
  rationale: Le verbe indique ici que l’articulation est sortie de sa position. « Se démit » exprime précisément ce résultat et permet une phrase française fluide.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: l’articulation de la hanche de Jacob
  rationale: La formulation reprend le même choix lexical que dans la proposition précédente et conserve la mention explicite de Jacob dans l’hébreu.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: pendant qu’il luttait avec lui
  rationale: L’infinitif construit précédé de בְּ marque une action simultanée. La formulation française conserve aussi l’ambiguïté des pronoms hébreux.
theological_decisions:
- issue: Référents des pronoms « il », « lui » et « sa » dans la scène du combat
  choice: Conserver les pronoms ambigus du récit hébreu sans nommer explicitement l’adversaire de Jacob.
  alternative: Identifier expressément le sujet comme l’homme, l’ange ou Dieu, et préciser que c’est lui qui touche Jacob.
  rationale: Le verset hébreu n’énonce de nouveau ni l’identité du sujet ni celle de chaque référent pronominal. Le passage dévoile progressivement la portée de cette figure ; la traduction ne doit donc pas résoudre ici cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative reste fluide, le verbe « toucher » conserve la retenue frappante de l’hébreu, et les pronoms ne lèvent pas l’ambiguïté voulue par le texte source.
