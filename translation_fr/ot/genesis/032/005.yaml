base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: fr
  text: 'Il leur donna cet ordre : « Voici ce que vous direz à mon seigneur Ésaü : “Ainsi parle ton serviteur Jacob : J’ai vécu comme étranger chez Laban et j’y suis resté jusqu’à présent.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Il leur donna cet ordre
  rationale: Le verbe צוה exprime ici une consigne ayant force d’ordre. Cette tournure est naturelle en français tout en conservant la valeur directive.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Après « donna cet ordre », les deux-points introduisent naturellement le contenu de la parole sans reproduire lourdement l’hébraïsme « en disant ».
- source_word: כֹּה תֹאמְרוּן
  choice: Vous parlerez ainsi
  rationale: כֹּה introduit le message précis à transmettre, et la forme verbale porte ici une valeur injonctive.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: à mon seigneur Ésaü
  rationale: « Seigneur » rend le titre social respectueux adressé à Ésaü; il ne s’agit pas ici d’un titre divin.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formule française actuelle restitue naturellement la formule de messager hébraïque.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans ce contexte diplomatique, עבד est une autodésignation déférente et n’affirme pas nécessairement une servitude littérale.
- source_word: גַּרְתִּי
  choice: J’ai vécu en étranger
  rationale: גור désigne le fait de résider comme étranger ou résident non établi; cette traduction conserve cette nuance mieux que le simple « habiter ».
- source_word: וָאֵחַר
  choice: j’y suis resté
  rationale: Le verbe indique ici la prolongation du séjour jusqu’au moment présent plutôt que le seul fait d’être en retard.
- source_word: עַד עָתָּה
  choice: jusqu’à présent
  rationale: Équivalent français naturel de l’expression temporelle hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve les deux formules de transmission du message, tandis que la ponctuation évite un empilement artificiel de verbes introducteurs. « Mon seigneur » et « ton serviteur » gardent le registre de déférence sociale du dialogue.
