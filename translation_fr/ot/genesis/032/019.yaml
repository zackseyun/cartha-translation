  text: וְ/אָֽמַרְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו וְ/הִנֵּ֥ה גַם ה֖וּא אַחֲרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: fr
  text: 'Tu diras alors : « C’est un présent[a] envoyé à mon seigneur Ésaü par ton serviteur Jacob. Et voici : lui aussi est derrière nous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cadeau » ou « tribut ». Le mot hébreu minḥah désigne ici un don destiné à apaiser Ésaü.
    reason: lexical_alternative
  - marker: b
    text: Ou « vient après nous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Tu diras alors
  rationale: Le waw suivi du parfait poursuit ici les instructions de Jacob. « Alors » exprime naturellement la succession, tandis que le futur garde la force directive de la forme hébraïque.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: de ton serviteur Jacob
  rationale: La formule présente Jacob avec déférence comme le serviteur d’Ésaü. En français, « de ton serviteur Jacob » rattache naturellement le présent à son expéditeur sans effacer la formule d’humilité.
- source_word: מִנְחָה
  choice: présent
  rationale: Dans ce contexte narratif, le terme désigne un don destiné à apaiser Ésaü, et non une offrande cultuelle. « Présent » convient au registre digne et souligne qu’il s’agit d’un cadeau envoyé solennellement.
- source_word: שְׁלוּחָה
  choice: envoyé
  rationale: Le participe passif décrit le présent comme expédié. « Envoyé » conserve clairement cette valeur passive.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: à mon seigneur, à Ésaü
  rationale: « Seigneur » rend le titre social respectueux employé par Jacob. La reprise « à Ésaü » et la virgule préservent l’apposition du texte hébreu.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: Ce marqueur attire l’attention sur la présence prochaine de Jacob. « Voici » est courant dans le registre biblique français sans être difficile à comprendre.
- source_word: גַם הוּא
  choice: lui aussi
  rationale: 'Cette tournure conserve l’accent additif : Jacob lui-même suit le présent et les serviteurs.'
- source_word: אַחֲרֵינוּ
  choice: est derrière nous
  rationale: La formulation rend directement la position de Jacob à la suite des serviteurs, tout en laissant en note la nuance dynamique possible.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au discours adressé à Ésaü tel que Jacob le fait formuler par ses serviteurs. L’apposition « à mon seigneur, à Ésaü » et la formule « ton serviteur Jacob » maintiennent la déférence marquée de l’hébreu.
