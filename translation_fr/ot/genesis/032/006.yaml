  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְהִי לִ/י֙ שׁ֣וֹר וַ/חֲמ֔וֹר צֹ֖אן וְ/עֶ֣בֶד וְ/שִׁפְחָ֑ה וָֽ/אֶשְׁלְחָ/ה֙ לְ/הַגִּ֣יד לַֽ/אדֹנִ֔/י לִ/מְצֹא חֵ֖ן בְּ/עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: fr
  text: J’ai des bovins et des ânes, du petit bétail, des serviteurs et des servantes[a]. J’ai envoyé des messagers en informer mon seigneur, afin de trouver grâce à tes yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des esclaves, hommes et femmes ». Les termes hébreux peuvent désigner des membres de la maisonnée en condition de servitude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: J’ai
  rationale: La construction היה + ל exprime la possession. Le présent français rend naturellement les biens que Jacob possède actuellement.
- source_word: שׁוֹר
  choice: des bovins
  rationale: Le nom collectif désigne ici des animaux de l’espèce bovine sans préciser leur sexe; « bovins » évite de réduire le sens aux seuls bœufs châtrés.
- source_word: חֲמוֹר
  choice: des ânes
  rationale: Le singulier collectif hébreu désigne ici une catégorie de biens; le pluriel est naturel en français.
- source_word: צֹאן
  choice: du petit bétail
  rationale: Le terme collectif englobe principalement les moutons et les chèvres. « Petit bétail » conserve cette étendue mieux que « troupeaux », qui est moins précis.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: des serviteurs et des servantes
  rationale: Cette formulation conserve la distinction de genre et reste naturelle, tandis qu’une note signale que les termes peuvent désigner des personnes en servitude.
- source_word: וָאֶשְׁלְחָה
  choice: J’ai envoyé des messagers
  rationale: Le verbe signifie littéralement « j’ai envoyé »; l’objet implicite renvoie aux messagers du contexte immédiat et doit être exprimé en français pour que « en informer » soit grammaticalement clair.
- source_word: לְהַגִּיד לַאדֹנִי
  choice: en informer mon seigneur
  rationale: « Mon seigneur » est ici une marque de déférence envers Ésaü, non un titre divin. Le pronom « en » reprend naturellement l’inventaire annoncé.
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: afin de trouver grâce à tes yeux
  rationale: La traduction conserve l’image de l’idiome hébreu tout en restant intelligible et digne en français moderne.
theological_decisions:
- issue: Statut exprimé par עֶבֶד et שִׁפְחָה dans une liste de possessions
  choice: serviteurs et servantes, avec une note
  alternative: esclaves et femmes esclaves
  rationale: Le contexte de maisonnée et de propriété laisse ouverte une condition servile réelle, mais les termes hébreux couvrent plusieurs formes de dépendance. Le texte principal ne tranche donc pas plus précisément que la source, et la note préserve l’alternative.
translation_notes:
  register: Français international moderne, clair et digne. La déférence de Jacob est conservée par « mon seigneur » et le tutoiement cohérent de la formule « à tes yeux ». Le rythme de l’inventaire hébreu est maintenu sans archaïsmes.
