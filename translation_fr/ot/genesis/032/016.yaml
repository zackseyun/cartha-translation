  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: fr
  text: trente chamelles allaitantes et leurs petits, quarante vaches et dix taureaux, vingt ânesses et dix ânons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dix ânes mâles »; le terme hébreu peut désigner un jeune âne, souvent mâle. Dans cette liste de bétail, il peut aussi souligner le contraste avec les ânesses.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: chamelles allaitantes
  rationale: Le participe féminin indique des chamelles qui allaitent. Cette formulation française est naturelle et prépare la mention de leurs petits.
- source_word: וּבְנֵיהֶם
  choice: avec leurs petits
  rationale: Littéralement « et leurs fils », mais, à propos d’animaux, « leurs petits » est l’expression idiomatique. « Avec » rend clairement le regroupement des mères et de leur progéniture dans l’inventaire.
- source_word: פָּרוֹת
  choice: vaches
  rationale: Le nom désigne ici des bovins femelles; « vaches » est précis et courant.
- source_word: וּפָרִים
  choice: et dix taureaux
  rationale: Le terme désigne des bovins mâles; « taureaux » maintient la distinction de sexe avec les vaches.
- source_word: אֲתֹנֹת
  choice: ânesses
  rationale: Le terme hébreu désigne explicitement des ânes femelles; le français dispose du nom naturel et précis « ânesses ».
- source_word: וַעְיָרִם
  choice: et dix ânons[a]
  rationale: עַיִר désigne couramment un jeune âne, souvent mâle. « Ânons » rend naturellement l’âge probable, tandis que la note conserve la possibilité contextuelle d’ânes mâles.
