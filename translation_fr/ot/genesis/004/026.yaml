  text: וּ/לְ/שֵׁ֤ת גַּם הוּא֙ יֻלַּד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ אֱנ֑וֹשׁ אָ֣ז הוּחַ֔ל לִ/קְרֹ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: fr
  text: Seth eut lui aussi un fils, qu’il appela Énosh. C’est alors que l’on commença à invoquer le nom de Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Alors on commença à invoquer le nom de Yahweh. »'
    reason: La forme hébraïque הוּחַל est passive (« il fut commencé »), mais la construction impersonnelle française rend le sens de façon idiomatique sans imposer un sujet.
  - marker: b
    text: 'Selon une interprétation minoritaire : « C’est alors que l’on commença à profaner le nom de Yahweh. »'
    reason: Cette lecture rattache הוּחַל au sens « profaner » de la racine חלל plutôt qu’à son emploi inchoatif, « commencer ».
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: Il naquit aussi un fils à Seth
  rationale: Cette formulation conserve la valeur passive de יֻלַּד et l’idée d’ajout exprimée par גַּם, tout en suivant un ordre naturel en français.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: et celui-ci l’appela Énosh
  rationale: « Appeler » reflète directement l’idiome hébreu « appeler son nom », tandis que le pronom « celui-ci » identifie naturellement Seth comme sujet en français.
- source_word: אֱנוֹשׁ
  choice: Énosh
  rationale: Le nom propre est translittéré selon une forme adaptée au français. Son éventuel écho au nom commun signifiant « homme » ou « mortel » n’est pas explicité dans le corps du texte.
- source_word: אָז
  choice: C’est alors que
  rationale: Cette tournure rend clairement la valeur temporelle de אָז dans un français courant et soutenu.
- source_word: הוּחַל
  choice: l’on commença
  rationale: Le hophal est compris dans son sens inchoatif et rendu par une construction impersonnelle naturelle. La forme passive plus transparente ainsi que l’analyse minoritaire « profaner » sont signalées en notes.
- source_word: לִקְרֹא בְּשֵׁם
  choice: à invoquer le nom
  rationale: Dans ce contexte, l’expression désigne vraisemblablement le fait de faire appel à Yahweh dans le culte ou la prière. « Invoquer le nom » rend cet idiome sans surinterprétation confessionnelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par le titre « le Seigneur ».
theological_decisions:
- issue: Sens de הוּחַל לִקְרֹא בְּשֵׁם יְהוָה
  choice: l’on commença à invoquer le nom de Yahweh
  alternative: on commença à profaner le nom de Yahweh
  rationale: La lecture inchoative de הוּחַל et le sens cultuel de קרא בשם correspondent à l’usage biblique le plus probable. Toutefois, la racine peut être comprise au sens de « profaner »; cette lecture minoritaire est conservée en note afin de ne pas effacer une ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans reproduire ses tournures de manière artificielle; « l’on » maintient un registre soutenu mais accessible.
