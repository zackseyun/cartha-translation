id: GEN.4.21
reference: Genesis 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: fr
  text: Son frère s’appelait Youbal. Il fut le père[a] de tous ceux qui jouent de la lyre et de la flûte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « père » peut désigner l’ancêtre, le précurseur ou le fondateur de tous ceux qui pratiquent cet art, et non leur père biologique direct.
    reason: cultural_note
  - marker: b
    text: Le terme hébreu désigne un instrument à vent ancien dont la nature précise est incertaine; on pourrait aussi traduire par « pipeau » ou « flûte de roseau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: Son frère s’appelait
  rationale: Cette formulation rend naturellement en français moderne la tournure hébraïque « et le nom de son frère [était] », tout en maintenant le lien avec Yabal au verset précédent.
- source_word: יוּבָל
  choice: Youbal
  rationale: Translittération française usuelle du nom hébreu יוּבָל.
- source_word: הוּא הָיָה
  choice: Il fut
  rationale: Rend la prédication hébraïque de manière concise dans ce récit des origines; le contexte ne requiert pas le sens « il devint ».
- source_word: אֲבִי
  choice: le père de
  rationale: Conserve l’image hébraïque, qui peut ici désigner l’ancêtre, le précurseur ou le fondateur d’une catégorie de praticiens.
- source_word: כָּל תֹּפֵשׂ
  choice: tous ceux qui jouent
  rationale: Le participe תֹּפֵשׂ signifie littéralement « saisir, manier »; associé à des instruments, il désigne naturellement le fait d’en jouer.
- source_word: כִּנּוֹר
  choice: lyre
  rationale: « Lyre » désigne plus précisément que le traditionnel « harpe » le type général d’instrument à cordes évoqué.
- source_word: עוּגָב
  choice: flûte
  rationale: Le mot désigne un instrument à vent ancien dont l’identification précise demeure incertaine; « flûte » est clair et naturel sans prétendre identifier exactement l’instrument.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure hébraïque est légèrement réorganisée pour produire une phrase idiomatique. Les deux instruments restent distingués comme instrument à cordes et instrument à vent, tandis que l’incertitude organologique de עוּגָב est signalée en note.
