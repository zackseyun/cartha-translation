  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: fr
  text: Et maintenant, tu es maudit à l’égard du sol[a], qui a ouvert sa bouche pour recevoir de ta main le sang[b] de ton frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens de la préposition hébraïque : « loin du sol » ou « par le sol ». Elle peut exprimer la source ou le domaine de la malédiction, ou l’éloignement d’avec le sol.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu emploie le pluriel « les sangs », expression pouvant évoquer le sang versé ou le meurtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Désormais
  rationale: La conjonction et l’adverbe introduisent la conséquence immédiate et durable du meurtre. « Désormais » l’exprime naturellement en français.
- source_word: אָרוּר אָתָּה
  choice: tu es maudit
  rationale: Cette formulation française directe conserve l’état de malédiction exprimé par le prédicat hébreu.
- source_word: מִן הָאֲדָמָה
  choice: à cause du sol
  rationale: Le choix donne un sens français intelligible à la relation exprimée par מִן, sans faire explicitement du sol l’auteur personnel de la malédiction. Comme la préposition peut aussi marquer l’éloignement ou la provenance, l’ambiguïté est signalée en note.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: qui a ouvert sa bouche
  rationale: Le sol est personnifié dans le texte hébreu. Le passé composé convient au récit et maintient le lien avec la situation présente de Caïn.
- source_word: לָקַחַת
  choice: pour recevoir
  rationale: Dans l’image du sol qui absorbe le sang répandu, « recevoir » est naturel tout en restant proche du sens de « prendre ».
- source_word: דְּמֵי אָחִיךָ
  choice: le sang de ton frère
  rationale: Le pluriel hébreu « sangs » désigne ici le sang versé, voire le meurtre. Le singulier est l’expression française idiomatique; la forme hébraïque est indiquée en note.
- source_word: מִיָּדֶךָ
  choice: de ta main
  rationale: La tournure conserve l’image concrète de la main et souligne la responsabilité directe de Caïn.
theological_decisions:
- issue: Rapport entre la malédiction de Caïn et le sol
  choice: Traduire principalement par « à cause du sol », avec une note qui maintient l’éventualité d’un éloignement du sol.
  alternative: « loin du sol », « chassé du sol » ou « maudit par le sol »
  rationale: La préposition מִן peut exprimer la provenance, la cause ou la séparation. Le contexte personnifie le sol, mais le verset suivant développe aussi l’éloignement de Caïn et la perte de la fécondité du sol. La traduction et la note évitent de réduire le texte à une seule de ces dimensions.
translation_notes:
  register: Français international moderne, sobre et digne. « Sol » est retenu plutôt que « terre » afin de conserver le lien lexical et concret avec l’adamah des versets voisins. La personnification « a ouvert sa bouche » est maintenue.
