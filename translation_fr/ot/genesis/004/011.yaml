  source_fidelity: La traduction principale « à cause du sol » impose une relation causale que מִן ne précise pas. Dans ce contexte, la préposition peut marquer notamment la source/le domaine de la malédiction ou l’éloignement d’avec le sol. Une formulation relationnelle permet de ne pas trancher indûment. Le reste rend fidèlement la personnification du sol, la réception du sang et la responsabilité de Caïn (« de ta main »).
  naturalness: « Et maintenant » restitue explicitement la conjonction et l’adverbe hébreux dans un français moderne naturel. « Maudit à l’égard du sol » est sobre et intelligible dans un registre scripturaire moderne; il évite le causal « à cause de » et le plus archaïsant « maudit du sol ».
  terminology: « Sol » est un bon choix pour אַדָמָה et maintient une expression concrète. « Sang » est idiomatique en français; la note rend compte du pluriel hébreu et de sa valeur liée au sang versé.
