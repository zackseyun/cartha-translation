revisions:
- from: Désormais, tu es maudit à cause du sol[a], qui a ouvert sa bouche pour recevoir de ta main le sang[b] de ton frère.
  to: Et maintenant, tu es maudit à l’égard du sol[a], qui a ouvert sa bouche pour recevoir de ta main le sang[b] de ton frère.
  rationale: La révision remplace le causal explicite « à cause du sol » par « à l’égard du sol », qui conserve la relation volontairement peu déterminée exprimée par מִן. La note expose les principales lectures sans transformer l’éloignement possible en expulsion explicitement énoncée. Les autres éléments du verset et la note sur « sangs » sont conservés.
