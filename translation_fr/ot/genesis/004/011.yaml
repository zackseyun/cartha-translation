  - severity: low
    issue: La note a présente « chassé du sol » comme alternative.
    rationale: « Chassé » explicite davantage que le seul מִן dans ce verset. Il vaut mieux parler d’éloignement ou de séparation possible, sans introduire directement l’acte de chasser.
