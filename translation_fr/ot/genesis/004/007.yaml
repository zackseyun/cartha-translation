source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: fr
  text: Si tu agis bien, ne seras-tu pas accepté[a] ? Mais si tu n’agis pas bien, le péché est tapi à la porte[b] ; son désir se porte vers toi[c], mais toi, tu dois le dominer[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « relèvement » ou « élévation ». Il peut s’agir du visage de Caïn qui se relève ou du fait qu’il soit accepté.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un sacrifice pour le péché est couché à la porte ». Cependant, dans le contexte immédiat, l’image évoque plus naturellement le péché personnifié comme une bête tapie.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « son aspiration » ou « son élan ». Comparer la formulation semblable en Genèse 3:16.'
    reason: cross_reference
  - marker: d
    text: 'Ou : « tu le domineras » ou « tu peux le dominer ». L’hébreu peut se comprendre comme une exhortation, une prédiction ou l’expression d’une possibilité.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: agis bien
  rationale: Le hifil de יטב désigne ici une conduite bonne ou juste. « Agir bien » est naturel en français et conserve la structure conditionnelle concise.
- source_word: שְׂאֵת
  choice: seras-tu accepté
  rationale: Le terme signifie littéralement « élévation » ou « relèvement ». Dans ce contexte, il peut évoquer le visage de Caïn qui se relève ou l’accueil favorable de sa personne et de son offrande. Le texte principal exprime l’acceptation, tandis que la note maintient l’image et l’ambiguïté.
- source_word: לַפֶּתַח
  choice: à la porte
  rationale: Cette expression locative simple préserve l’image vive d’une menace présente sur le seuil.
- source_word: חַטָּאת
  choice: le péché
  rationale: חַטָּאת peut aussi désigner un sacrifice pour le péché, mais le participe « tapi » et la suite de la phrase favorisent ici la personnification du péché comme une bête prête à bondir.
- source_word: רֹבֵץ
  choice: est tapi
  rationale: Le participe évoque un animal couché ou accroupi à l’affût. « Tapi » rend de façon concise la menace latente de cette image.
- source_word: תְּשׁוּקָתוֹ
  choice: son désir se porte vers toi
  rationale: תְּשׁוּקָה exprime le désir ou l’élan vers quelqu’un. Cette formulation conserve le lien verbal avec Genèse 3:16 sans préciser abusivement la nature du désir.
- source_word: תִּמְשָׁל בּוֹ
  choice: tu dois le dominer
  rationale: L’imparfait hébreu peut exprimer l’exhortation, la prédiction ou la possibilité. Dans cet avertissement, « tu dois » communique bien l’exhortation, tout en signalant les autres lectures en note.
theological_decisions:
- issue: La dernière proposition commande-t-elle à Caïn de dominer le péché, lui prédit-elle cette domination ou affirme-t-elle qu’il en a la capacité ?
  choice: '« tu dois le dominer » : exhortation'
  alternative: « tu le domineras » ou « tu peux le dominer »
  rationale: La forme verbale hébraïque admet ces diverses nuances. Le contexte d’avertissement favorise l’exhortation, sans transformer la phrase en promesse certaine ni en affirmation doctrinale développée sur la capacité humaine.
- issue: חַטָּאת désigne-t-il le péché personnifié ou un sacrifice pour le péché ?
  choice: « le péché » personnifié comme une bête tapie
  alternative: « un sacrifice pour le péché est couché à la porte »
  rationale: Le mouvement du désir vers Caïn et l’appel à le dominer prolongent naturellement l’image d’une puissance hostile. La valeur sacrificielle du nom reste toutefois lexicalement possible et est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme conditionnel, l’image animale du péché et l’ambiguïté modale de la conclusion au moyen d’une note. Les pronoms masculins « le/son » reprennent grammaticalement « le péché » en français sans lui attribuer un sexe.
