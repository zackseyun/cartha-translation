  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: The man knew Eve his wife[a], and she conceived and bore Cain, and said[b], “I have acquired a man with Yahweh.”
translation:
  language: fr
  text: 'L’homme connut Ève, sa femme ; elle devint enceinte, donna naissance à Caïn[b] et dit : « J’ai acquis un homme avec Yahweh[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec Yahweh ». L’expression peut être comprise comme « avec l’aide de Yahweh » ou « de la part de Yahweh » ; moins probablement : « J’ai acquis un homme — Yahweh. »'
    reason: alternative_reading
  - marker: b
    text: Le nom Caïn évoque en hébreu le verbe traduit par « j’ai acquis » (qaniti).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: L’homme
  rationale: Dans ce contexte, אָדָם désigne l’homme déjà présenté, et non l’humanité en général. Le וְ narratif n’exige pas ici un adverbe temporel ajouté.
- source_word: יָדַע
  choice: connut
  rationale: Le verbe signifie littéralement « connaître » et sert ici d’euphémisme pour les relations sexuelles. Le conserver respecte l’idiome et la dignité littéraire de l’hébreu.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: Ève, sa femme
  rationale: Cette formulation rend le nom suivi de l’indication de relation, tout en étant naturelle en français.
- source_word: וַתַּהַר
  choice: Elle devint enceinte
  rationale: Expression française actuelle et claire correspondant au verbe הרה dans un récit de naissance.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: et donna naissance à Caïn
  rationale: Rend précisément l’accouchement dans un français naturel, sans archaïsme inutile.
- source_word: קַיִן
  choice: Caïn
  rationale: Forme française traditionnelle du nom propre; son rapprochement sonore avec קָנִיתִי est signalé en note.
- source_word: קָנִיתִי
  choice: J’ai acquis
  rationale: Le verbe קנה signifie couramment « acquérir, obtenir ». « Acquis » permet de faire percevoir autant que possible le jeu de mots avec Caïn.
- source_word: אִישׁ
  choice: un homme
  rationale: L’hébreu emploie אִישׁ, « homme », même si le référent est un nouveau-né; la traduction conserve cette formulation frappante.
- source_word: אֶת יְהוָה
  choice: avec Yahweh
  rationale: La construction est difficile et ambiguë. Une traduction resserrée par « avec » préserve l’association exprimée sans introduire dans le texte principal l’explication « avec l’aide de ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par le titre « le Seigneur ».
theological_decisions:
- issue: Sens de אֶת יְהוָה dans la déclaration d’Ève
  choice: avec Yahweh
  alternative: avec l’aide de Yahweh; de la part de Yahweh; un homme — Yahweh
  rationale: La syntaxe hébraïque admet plusieurs analyses. Le texte principal conserve la formulation compacte et son ambiguïté, tandis que la note présente les principales compréhensions sans imposer une identification ontologique de Caïn à Yahweh.
translation_notes:
  register: "Français international moderne, digne et accessible. « Conn \x7Fut » conserve l’euphémisme littéraire hébreu; « donna naissance » évite un tour archaïque. La ponctuation segmente naturellement les actions successives. Les deux appels de note figurent dans le texte principal."
