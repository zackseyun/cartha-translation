  text: וַ/יֵּ֥צֵא קַ֖יִן מִ/לִּ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ נ֖וֹד קִדְמַת עֵֽדֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: fr
  text: Alors Caïn s’éloigna de la présence de Yahweh et s’établit dans le pays de Nod[a], à l’est d’Éden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Nod » évoque le mot hébreu signifiant « errance », faisant écho au jugement prononcé plus tôt dans ce chapitre contre Caïn.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא exprime concrètement un mouvement vers l’extérieur. « Sortit » conserve ce sens direct sans préciser davantage la manière du départ.
- source_word: מִלִּפְנֵי
  choice: de devant
  rationale: Cette expression rend littéralement l’idée de quitter la face ou le devant de quelqu’un. « De devant » préserve ici la formulation spatiale et relationnelle de l’hébreu, ainsi que sa tension narrative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le conserver comme nom propre plutôt que de lui substituer un titre.
- source_word: וַיֵּשֶׁב
  choice: s’établit
  rationale: ישב peut signifier s’asseoir, habiter ou s’établir. Dans ce contexte géographique, « s’établit » exprime naturellement le fait de prendre résidence.
- source_word: בְּאֶרֶץ נוֹד
  choice: dans le pays de Nod
  rationale: Nod fonctionne comme un nom de lieu et est donc translittéré. Son lien sonore avec l’idée d’errance est signalé en note plutôt qu’introduit dans le texte.
- source_word: קִדְמַת עֵדֶן
  choice: à l’est d’Éden
  rationale: Cette tournure française concise et naturelle rend l’orientation à l’est par rapport à Éden.
- source_word: עֵדֶן
  choice: Éden
  rationale: Nom propre de lieu, rendu selon sa forme française usuelle.
theological_decisions:
- issue: La manière de décrire le départ de Caïn par rapport à Dieu
  choice: Caïn sortit de devant Yahweh
  alternative: Caïn s’éloigna de la présence de Yahweh
  rationale: « De devant » reste proche de l’idiome hébreu et maintient la tension entre localisation et éloignement relationnel, sans transformer explicitement le récit en affirmation métaphysique sur la présence divine.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu là où elle porte une nuance narrative ou théologique, tout en demeurant intelligible pour un lectorat général.
