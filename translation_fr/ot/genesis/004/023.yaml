  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: fr
  text: 'Lémek dit à ses femmes : « Ada et Tsilla, écoutez ma voix ! Femmes de Lémek, prêtez l’oreille à ma parole ! Car j’ai tué un homme pour m’avoir blessé, un jeune homme pour m’avoir meurtri.[a][b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut traduire plus littéralement : « J’ai tué un homme pour ma blessure, un jeune homme pour ma meurtrissure. » L’hébreu emploie les noms « blessure » et « meurtrissure » plutôt que des expressions verbales.'
    reason: lexical_alternative
  - marker: b
    text: 'Certains comprennent les paroles de Lémek comme une menace ou une vantardise générale : « Je tuerais un homme… », plutôt que comme le récit d’un meurtre déjà commis.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: à ses femmes
  rationale: Dans ce contexte, le pluriel de אִשָּׁה avec suffixe désigne les épouses de Lémek. En français biblique courant, « ses femmes » est naturel puisque leurs noms suivent immédiatement.
- source_word: שְׁמַעַן קוֹלִי
  choice: écoutez ma voix
  rationale: L’impératif féminin pluriel s’adresse à Ada et Tsilla. « Ma voix » conserve l’expression concrète de l’hébreu et le parallélisme poétique.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: prêtez l’oreille à ma parole
  rationale: Le hiphil de אזן appelle une écoute attentive. Cette formulation française distingue le second impératif du premier tout en conservant le parallélisme et le singulier « parole ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le contenu explicatif ou le fondement de la déclaration de Lémek, sans préciser davantage le rapport logique.
- source_word: אִישׁ הָרַגְתִּי
  choice: j’ai tué un homme
  rationale: Le qatal se prête naturellement au passé composé français et présente, dans la lecture la plus directe, un acte accompli. אִישׁ est rendu par « homme ».
- source_word: לְפִצְעִי
  choice: pour m’avoir blessé
  rationale: Littéralement, la construction associe la préposition לְ au nom « blessure » muni du suffixe de première personne. La formulation verbale exprime naturellement en français la cause ou l’occasion de la riposte, sans en faire explicitement de la légitime défense.
- source_word: יֶלֶד
  choice: un jeune homme
  rationale: יֶלֶד peut désigner un enfant, un garçon ou un jeune. En parallèle avec אִישׁ, « jeune homme » préserve ici la nuance d’âge sans imposer l’idée d’un petit enfant.
- source_word: לְחַבֻּרָתִי
  choice: pour m’avoir meurtri
  rationale: חַבּוּרָה désigne une meurtrissure, une marque de coup ou une blessure. Le verbe « meurtrir » maintient le rapport avec ce nom et distingue légèrement ce membre de « blessé ».
theological_decisions:
- issue: 'Parole de Lémek : récit d’un meurtre, menace ou vantardise générale'
  choice: 'La traduction principale présente les verbes comme le récit d’actes accomplis : « j’ai tué »'
  alternative: « Je tuerais un homme… », en comprenant le parfait comme modal ou proverbial
  rationale: La forme qatal rapporte le plus directement un acte accompli, mais l’emploi menaçant ou vantard demeure possible dans ce chant; cette possibilité est signalée en note plutôt que supprimée.
- issue: 'Motif de l’homicide : représailles ou légitime défense'
  choice: « pour m’avoir blessé… pour m’avoir meurtri »
  alternative: « parce qu’il m’avait blessé », formulation susceptible de suggérer plus fortement une circonstance défensive
  rationale: La traduction exprime le lien causal ou la rétribution porté par les groupes en לְ, sans ajouter une justification morale absente de l’hébreu.
- issue: Un ou deux morts dans le parallélisme
  choice: Conserver « un homme… un jeune homme » sans préciser s’il s’agit d’une seule personne ou de deux
  alternative: Reformuler explicitement comme un seul homme ou comme deux victimes
  rationale: Le parallélisme poétique peut reprendre le même référent, mais la syntaxe ne tranche pas explicitement; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. Le parallélisme et les répétitions du poème sont conservés. « Prêtez l’oreille » apporte une dignité poétique tout en restant aisément compréhensible; la ponctuation exclamative fait entendre l’adresse solennelle de Lémek.
