  text: כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם קָ֑יִן וְ/לֶ֖מֶךְ שִׁבְעִ֥ים וְ/שִׁבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: fr
  text: Car Caïn sera vengé sept fois[a], et Lémek soixante-dix-sept fois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est vengé » ; l’inaccompli hébreu peut aussi exprimer une vengeance tenue pour certaine.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « soixante-dix et sept » ; c’est-à-dire « soixante-dix-sept fois », et non « soixante-dix fois sept ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison qui fonde la déclaration vantarde de Lémek au verset précédent. « Car » en conserve clairement la valeur explicative.
- source_word: שִׁבְעָתַיִם
  choice: sept fois
  rationale: Employée adverbialement, cette forme exprime une mesure septuple. « Sept fois » est naturel en français et maintient le parallélisme numérique du vers.
- source_word: יֻקַּם
  choice: sera vengé
  rationale: 'Le hofal de נקם est passif : « être vengé ». Dans cette parole poétique, l''inaccompli peut exprimer un avenir tenu pour certain; le futur français rend naturellement cette nuance sans préciser qui exerce la vengeance.'
- source_word: קָיִן
  choice: Caïn
  rationale: Forme française courante du nom propre.
- source_word: וְלֶמֶךְ
  choice: et Lémek
  rationale: La conjonction relie les deux membres de la comparaison; « Lémek » suit la forme française usuelle du nom.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: soixante-dix-sept fois
  rationale: L'expression signifie littéralement « soixante-dix et sept ». Dans ce contexte d'escalade de la vengeance, « soixante-dix-sept fois » est clair, idiomatique et parallèle à « sept fois ».
theological_decisions:
- issue: Valeur temporelle de יֻקַּם
  choice: sera vengé
  alternative: est vengé
  rationale: L'inaccompli hébreu peut présenter une vengeance future comme certaine ou formuler une vérité générale. Le futur est le plus naturel ici en français, tandis qu'une note conserve la possibilité d'une formulation au présent.
- issue: Valeur numérique de la formule concernant Lémek
  choice: soixante-dix-sept fois
  alternative: soixante-dix fois sept
  rationale: La construction hébraïque שִׁבְעִים וְשִׁבְעָה signifie le plus naturellement « soixante-dix-sept », et non « soixante-dix fois sept ». Ce choix préserve le parallélisme poétique avec les sept fois de Caïn sans importer dans la Genèse la formulation ultérieure de Matthieu 18.22.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « fois » rend le parallélisme immédiatement perceptible, tandis que le passif conserve l'absence d'agent explicite dans l'hébreu.
