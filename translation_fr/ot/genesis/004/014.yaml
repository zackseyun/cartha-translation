review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle. Toutefois, « loin de » explicite une distance qui n’est pas exprimée par la préposition hébraïque מן (« de, hors de »), et la note qualifie à tort « loin de ta face » de formulation littérale. Le nifal אֶסָּתֵר garde une nuance passive ou réflexive que le français ne peut reproduire parfaitement; « je serai caché de devant ta face » conserve le passif et l’image de la face sans ajouter la notion de distance.
  naturalness: Le texte est clair et de registre moderne et digne. « Je serai caché de devant ta face » est légèrement soutenu, mais intelligible et approprié dans une parole adressée à Dieu; il est plus exact que « loin de ta face ».
  terminology: « Sol » rend bien אֲדָמָה dans ce contexte, tandis que « terre » rend de façon recevable אֶרֶץ avec une note pour « pays ». « Errant et fugitif » et « quiconque me trouvera me tuera » sont naturels et fidèles. « Vois » rend correctement la particule d’appel הֵן.
  issues:
  - severity: medium
    issue: Ajout de « loin de » dans la proposition relative à la face de Dieu.
    rationale: וּמִפָּנֶיךָ signifie littéralement « et de devant ta face » / idiomatiquement « loin de ta présence », mais ne comporte pas le terme « loin ». Cette précision spatiale doit être évitée dans le texte principal afin de ne pas restreindre indûment l’ambiguïté de l’expression.
  - severity: medium
    issue: La note a indique incorrectement que « loin de ta face » est littéral.
    rationale: La formule littérale hébraïque est « de devant ta face » (ou, plus littéralement encore, « de ta face » selon l’analyse de la préposition), non « loin de ta face ». La note doit distinguer la formulation littérale des rendus idiomatiques par « présence ».
  revised_text: Vois, aujourd’hui tu me chasses de la surface du sol, et je serai caché de devant ta face[a]. Je serai errant et fugitif sur la terre[b], et quiconque me trouvera me tuera.
  revised_footnotes:
