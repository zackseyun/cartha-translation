revisions:
- from: Vois, aujourd’hui tu me chasses de la surface du sol, et je serai caché loin de ta face[a]. Je serai errant et fugitif sur la terre[b], et quiconque me trouvera me tuera.
  to: Vois, aujourd’hui tu me chasses de la surface du sol, et je serai caché de devant ta face[a]. Je serai errant et fugitif sur la terre[b], et quiconque me trouvera me tuera.
  rationale: La révision retire l’ajout de distance contenu dans « loin de » et corrige la glose littérale de la note. Elle maintient le passif français pour refléter, autant que possible, l’ambiguïté passive/réflexive du nifal, tout en conservant l’image hébraïque de la face divine. Le reste du texte et la note sur אֶרֶץ sont retenus.
