  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: fr
  text: Vois, aujourd’hui tu me chasses de la surface du sol, et je serai caché de devant ta face[a]. Je serai errant et fugitif sur la terre[b], et quiconque me trouvera me tuera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je me cacherai de ta présence » ou « je serai caché de ta présence ». Littéralement, l’hébreu dit « de devant ta face ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vois
  rationale: Cette particule attire l’attention et souligne la plainte de Caïn. « Vois » est direct, actuel et digne, sans l’archaïsme de « voici » dans cet emploi.
- source_word: גֵּרַשְׁתָּ אֹתִי
  choice: tu me chasses
  rationale: Le verbe גרשׁ exprime l’expulsion. Le présent français convient à l’acte déclaré comme effectif « aujourd’hui » et donne à la plainte son immédiateté.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface du sol
  rationale: Cette formulation conserve l’image de la « face » ou surface du sol tout en restant naturelle en français; « sol » maintient le lien contextuel entre אֲדָמָה, le travail de Caïn et la malédiction précédente.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: je serai caché loin de ta face
  rationale: Le nifal permet un sens passif ou réfléchi. Cette traduction garde le passif et l’image concrète de la face divine, sans réduire silencieusement l’expression à la seule notion de présence.
- source_word: נָע וָנָד
  choice: errant et fugitif
  rationale: Les deux termes décrivent une existence instable et déplacée. Deux adjectifs coordonnés préservent leur dualité et font écho au jugement du verset précédent.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre ou un pays. Le sens large convient au cadre primordial, tandis que l’autre possibilité est signalée en note.
- source_word: כָל מֹצְאִי
  choice: quiconque me trouvera
  rationale: Cette tournure française rend naturellement la valeur universelle indéfinie de כָל suivi du participe.
- source_word: יַהַרְגֵנִי
  choice: me tuera
  rationale: Le verbe הרג signifie couramment « tuer ». Ce choix est clair, moderne et conserve la force directe de la crainte exprimée.
theological_decisions:
- issue: Expression de la présence divine dans וּמִפָּנֶיךָ אֶסָּתֵר
  choice: je serai caché loin de ta face
  alternative: je me cacherai loin de ta présence / je serai caché loin de ta présence
  rationale: Le texte hébreu emploie concrètement « ta face » et une forme verbale susceptible d’une nuance passive ou réfléchie. Le texte principal préserve donc l’image relationnelle et l’ambiguïté grammaticale autant que le permet le français; la note donne les lectures idiomatiques possibles sans trancher la tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le rythme de la plainte de Caïn ainsi que les images hébraïques lorsqu’elles restent intelligibles. Les marqueurs [a] et [b] figurent dans le texte principal.
