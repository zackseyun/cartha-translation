  text: וַ/יִּוָּלֵ֤ד לַֽ/חֲנוֹךְ֙ אֶת עִירָ֔ד וְ/עִירָ֕ד יָלַ֖ד אֶת מְחֽוּיָאֵ֑ל וּ/מְחִיּיָאֵ֗ל יָלַד֙ אֶת מְת֣וּשָׁאֵ֔ל וּ/מְתוּשָׁאֵ֖ל יָלַ֥ד אֶת לָֽמֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: fr
  text: À Hanok naquit Irad, Irad engendra Mehouyaël[a], Mehouyaël engendra Metoushaël, et Metoushaël engendra Lémek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans ce verset, l’hébreu présente deux graphies du même nom : Mehouyaël et Mehiyaël.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ
  choice: À Hanok naquit
  rationale: Le nifal de ילד exprime ici la naissance, et le ל préfixé indique le parent auquel l’enfant naît. Cette tournure conserve la forme passive du premier membre tout en restant digne et compréhensible en français.
- source_word: עִירָד
  choice: Irad
  rationale: Translittération directe du nom propre hébreu.
- source_word: יָלַד
  choice: engendra
  rationale: Dans cette généalogie, le qal de ילד désigne l’action d’engendrer. « Engendra » est concis, exact et adapté au registre généalogique biblique.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: Mehouyaël
  rationale: Les deux graphies hébraïques désignent le même personnage. Une seule forme française est retenue dans le texte pour la fluidité, tandis que la variation est signalée en note.
- source_word: מְתוּשָׁאֵל
  choice: Metoushaël
  rationale: Translittération française fondée sur la forme hébraïque, avec « sh » pour rendre distinctement שׁ.
- source_word: לָמֶךְ
  choice: Lémek
  rationale: Translittération française proche de la forme hébraïque, plutôt que reprise automatique d’une forme anglaise.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La première proposition conserve le passif hébreu; les suivantes emploient le verbe généalogique « engendrer ». Les noms sont translittérés à partir de l’hébreu selon des conventions lisibles en français.
