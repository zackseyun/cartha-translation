id: GEN.4.5
reference: Genesis 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶל קַ֥יִן וְ/אֶל מִנְחָת֖/וֹ לֹ֣א שָׁעָ֑ה וַ/יִּ֤חַר לְ/קַ֨יִן֙ מְאֹ֔ד וַֽ/יִּפְּל֖וּ פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: fr
  text: Mais il ne regarda pas Caïn et son offrande avec faveur[a]. Caïn entra alors dans une grande colère, et son visage s’assombrit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : il ne prêta attention ni à Caïn ni à son offrande.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son visage tomba », expression indiquant qu’il prit un air abattu ou renfrogné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל … וְאֶל
  choice: Caïn et son offrande
  rationale: La préposition répétée désigne les deux objets du regard divin. En français, la coordination simple est naturelle et conserve le fait que la réaction concerne à la fois Caïn et son offrande.
- source_word: מִנְחָה
  choice: offrande
  rationale: Dans ce contexte de présentation à Dieu, « offrande » exprime clairement la valeur cultuelle du terme, sans la réduire à un simple cadeau.
- source_word: לֹא שָׁעָה
  choice: il ne regarda pas … avec faveur
  rationale: Le verbe évoque ici un regard attentif et favorable. Cette formulation française rend le refus de faveur sans préciser le motif ni transformer explicitement le geste en verdict d’acceptation ou de rejet.
- source_word: וַיִּחַר … מְאֹד
  choice: entra alors dans une grande colère
  rationale: L’expression hébraïque présente littéralement une colère qui s’enflamme. La tournure choisie est actuelle et naturelle, tout en conservant l’intensité marquée par מְאֹד.
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: son visage s’assombrit
  rationale: Littéralement, « son visage tomba ». L’expression décrit une mine abattue ou renfrognée ; « son visage s’assombrit » restitue naturellement en français ce changement visible sans imposer une émotion plus précise.
theological_decisions:
- issue: Nature de la réaction divine envers Caïn et son offrande
  choice: Exprimer l’absence de regard favorable sans en donner la raison
  alternative: Traduire plus explicitement par « il n’accepta pas Caïn ni son offrande »
  rationale: Le texte affirme que Dieu ne porta pas un regard favorable sur Caïn et son offrande, mais ce verset n’en explique pas la cause. La traduction évite donc d’ajouter une justification doctrinale ou de remplacer l’image du regard par une formulation plus catégorique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’ordre narratif hébreu et la retenue du texte quant au motif de la réaction divine.
