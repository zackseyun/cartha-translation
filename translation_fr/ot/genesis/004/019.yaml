  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: fr
  text: Lémek prit deux femmes pour épouses[a]. L’une s’appelait Ada, et l’autre[b] Tsilla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « Lémek épousa deux femmes. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la seconde ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: prit pour lui
  rationale: Conserve l’expression hébraïque avec le verbe « prendre » et la nuance d’intérêt personnel portée par לוֹ, tandis que « deux femmes » rend le contexte matrimonial explicite.
- source_word: שְׁתֵּי נָשִׁים
  choice: deux femmes
  rationale: En français, « prendre pour lui deux femmes » indique ici qu’il s’agit d’épouses, sans recourir au terme plus marqué « épouses »; la note donne la formulation idiomatique explicite.
- source_word: שֵׁם הָאַחַת
  choice: L’une s’appelait
  rationale: Rend naturellement en français la formule hébraïque « le nom de l’une », sans en modifier le sens.
- source_word: עָדָה
  choice: Ada
  rationale: Translittération française courante du nom hébreu.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: et l’autre
  rationale: Dans un ensemble de deux, « l’autre » est plus naturel en français que « la seconde », tout en désignant sans ambiguïté le second membre de la paire; la note conserve l’alternative formelle.
- source_word: צִלָּה
  choice: Tsilla
  rationale: Translittération française qui représente le tsadé initial par « Ts » et la consonne redoublée par « ll ».
theological_decisions:
- issue: Faut-il expliciter ou évaluer la polygynie de Lémek ?
  choice: Présenter simplement le fait qu’il prit deux femmes, sans commentaire moral.
  alternative: Dire explicitement « Lémek épousa deux femmes » ou ajouter une appréciation morale.
  rationale: Le verset rapporte l’union de Lémek avec deux femmes sans porter lui-même de jugement moral. La traduction préserve ce constat et la tension narrative sans ajouter d’évaluation.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche de l’hébreu dans la première phrase, tandis que la formule des noms est rendue idiomatiquement. Tous les marqueurs de note figurent dans le texte.
