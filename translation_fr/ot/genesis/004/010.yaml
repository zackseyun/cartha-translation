  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: fr
  text: 'Il dit : « Qu’as-tu fait ? La voix du sang[a] de ton frère crie vers moi du sol. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les sangs ». Ce pluriel hébreu est notamment employé à propos du sang versé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple rend naturellement cette succession narrative sans devoir expliciter un lien temporel par « alors ».
- source_word: מֶה עָשִׂיתָ
  choice: Qu’as-tu fait ?
  rationale: Cette question directe a valeur d’accusation divine. Le passé composé français exprime un acte accompli dont les conséquences demeurent présentes.
- source_word: קוֹל דְּמֵי אָחִיךָ
  choice: Le sang de ton frère
  rationale: Littéralement, l’hébreu évoque « la voix des sangs de ton frère ». En français, avec le verbe « crier », le sang lui-même peut être le sujet sans perdre la personnification; traduire « la voix du sang… crie » serait lourd et moins naturel.
- source_word: דְּמֵי
  choice: sang
  rationale: Le pluriel hébreu « sangs » est idiomatique, notamment dans un contexte de sang versé. Le nom massif singulier « sang » est l’équivalent français naturel; une note signale la forme source.
- source_word: צֹעֲקִים
  choice: crie
  rationale: Le participe pluriel s’accorde en hébreu avec דְּמֵי, « sangs ». Puisque le français emploie le singulier collectif « sang », l’accord au singulier est naturel. Le présent conserve la vigueur et l’aspect actuel du cri.
- source_word: אֵלַי
  choice: vers moi
  rationale: « Vers moi » rend la direction du cri adressé à Dieu et s’associe naturellement au verbe « crier ».
- source_word: מִן הָאֲדָמָה
  choice: depuis le sol
  rationale: אֲדָמָה désigne ici le sol, en continuité avec l’imagerie terrestre du récit de Caïn. « Depuis » indique clairement que le cri monte du lieu où le sang a été versé.
theological_decisions:
- issue: Personnification du sang versé d’Abel
  choice: Conserver l’image du sang qui crie vers Dieu.
  alternative: Reformuler abstraitement en disant que le meurtre ou la culpabilité appelle la justice.
  rationale: L’hébreu attribue au sang une action saisissante. Maintenir cette personnification préserve la force morale et théologique du texte sans la réduire à une seule interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe au singulier. Le passé simple convient au récit écrit, tandis que la question au passé composé et le cri au présent gardent leur portée immédiate.
