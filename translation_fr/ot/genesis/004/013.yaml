  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: fr
  text: 'Caïn dit à Yahweh[a] : « Ma faute est trop grande pour que je la supporte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Ma culpabilité est trop lourde à supporter » ou « Ma peine est trop lourde à porter » ; autre traduction possible : « Ma faute est trop grande pour être pardonnée. » Le mot hébreu peut désigner la faute, la culpabilité ou la peine qui en résulte, et le verbe peut signifier « porter », « supporter » ou, dans certains contextes, « pardonner ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit le récit. En français, le passé simple exprime naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: קַיִן
  choice: Caïn
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: אֶל
  choice: à
  rationale: Préposition naturelle en français pour introduire le destinataire du verbe « dire ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui conserve ici sa valeur de nom propre plutôt que de lui substituer un titre.
- source_word: גָּדוֹל
  choice: trop grande
  rationale: Avec מִן suivi de l’infinitif, l’adjectif exprime ici un degré dépassant ce qui peut être supporté; « trop grande pour » rend naturellement cette construction.
- source_word: עֲוֺנִי
  choice: ma faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou la peine qui en résulte. « Faute » conserve dans le texte principal le sens moral direct sans exclure le poids de ses conséquences; l’ambiguïté est explicitée en note.
- source_word: מִנְּשֹׂא
  choice: pour être portée
  rationale: L’infinitif de נָשָׂא peut signifier porter, supporter ou, dans certains contextes, pardonner. La tournure passive sans agent exprimé reste proche de la formulation hébraïque et préserve une part de son ambiguïté.
theological_decisions:
- issue: Ambiguïté de עֲוֺנִי מִנְּשֹׂא
  choice: « Ma faute est trop grande pour être portée. »
  alternative: « Ma culpabilité / ma peine est trop lourde à supporter » ou « Ma faute est trop grande pour être pardonnée. »
  rationale: עָוֹן peut désigner la faute, la culpabilité ou la peine encourue, tandis que נָשָׂא peut signifier porter et, dans certains emplois, pardonner. Le contexte du jugement favorise la notion d’un fardeau à supporter, mais le texte permet aussi d’entendre un aveu de culpabilité ou une allusion au pardon. La note conserve cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Être portée » maintient une formulation concise et laisse ouverte la question de celui qui porte la faute ou ses conséquences.
