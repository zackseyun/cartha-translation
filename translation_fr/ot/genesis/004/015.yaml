  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: fr
  text: 'Alors Yahweh lui dit : « C’est pourquoi, quiconque tuera Caïn, une vengeance au septuple sera exercée contre lui[a]. » Et Yahweh plaça un signe sur Caïn[b], pour que personne qui le trouverait ne le frappe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il sera vengé sept fois ». Le passif hébreu est concis; dans le contexte, la vengeance vise celui qui tuerait Caïn.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une marque ». Le mot hébreu peut désigner un signe ou une marque distinctive; le texte n’en précise pas la forme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin sous une forme française courante de translittération, conformément au choix éditorial du projet.
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence introduite par la réponse divine.
- source_word: כָּל הֹרֵג קַיִן
  choice: si quelqu’un tue Caïn
  rationale: Rend la portée générique et indéfinie de la construction hébraïque dans une formulation française idiomatique.
- source_word: שִׁבְעָתַיִם
  choice: au septuple
  rationale: Rend de façon concise la mesure septuple exprimée par la forme hébraïque.
- source_word: יֻקָּם
  choice: il subira une vengeance
  rationale: Clarifie que le meurtrier de Caïn est la cible de la vengeance, tout en conservant l’agent implicite du passif hébreu.
- source_word: אוֹת
  choice: signe
  rationale: Le terme hébreu désigne largement un signe distinctif sans en préciser la forme; « signe » évite de suggérer nécessairement une marque corporelle.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ
  choice: afin que … ne le frappe pas
  rationale: Reproduit la valeur préventive de la construction et le sens direct de נכה sans limiter explicitement l’action au meurtre.
- source_word: כָּל מֹצְאוֹ
  choice: quiconque le trouverait
  rationale: Préserve la portée indéfinie et universelle de l’expression participiale dans un français naturel.
theological_decisions:
- issue: Nature du signe protecteur donné à Caïn
  choice: « signe » sans précision sur sa forme
  alternative: « marque » ou description physique du signe
  rationale: Le texte hébreu ne définit ni l’aspect ni la nature exacte de l’אוֹת; la traduction n’importe donc aucune spéculation ultérieure.
- issue: Personne visée par la vengeance au septuple
  choice: Le meurtrier éventuel de Caïn subira la vengeance
  alternative: « il sera vengé au septuple », formulation plus littérale mais ambiguë en français
  rationale: Le contexte présente une mise en garde contre celui qui tuerait Caïn. La formulation française identifie clairement la personne visée sans préciser l’agent de la vengeance, que le passif hébreu laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu sans calque artificiel; « quiconque le trouverait » conserve la portée générale, tandis que « ne le frappe pas » maintient l’étendue lexicale du verbe hébreu.
