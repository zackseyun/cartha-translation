- from: 'Alors Yahweh lui dit[a] : « C’est pourquoi, si quelqu’un tue Caïn, il subira une vengeance au septuple. » Et Yahweh mit un signe sur Caïn[b], afin que quiconque le trouverait ne le frappe pas.'
  to: 'Alors Yahweh lui dit : « C’est pourquoi, quiconque tuera Caïn, une vengeance au septuple sera exercée contre lui[a]. » Et Yahweh plaça un signe sur Caïn[b], pour que personne qui le trouverait ne le frappe.'
  rationale: La révision améliore la syntaxe française, replace la note relative au passif sur le segment pertinent et conserve les ambiguïtés du texte concernant l’agent de la vengeance et la nature du signe. « Une vengeance au septuple sera exercée contre lui » explicite seulement la cible contextuelle de l’avertissement, sans identifier l’agent de la vengeance.
