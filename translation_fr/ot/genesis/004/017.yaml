  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֤דַע קַ֨יִן֙ אֶת אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד אֶת חֲנ֑וֹךְ וַֽ/יְהִי֙ בֹּ֣נֶה עִ֔יר וַ/יִּקְרָא֙ שֵׁ֣ם הָ/עִ֔יר כְּ/שֵׁ֖ם בְּנ֥/וֹ חֲנֽוֹךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: fr
  text: Caïn connut sa femme[a] ; elle devint enceinte et mit au monde Hénoc. Il était en train de bâtir une ville[b] et donna à la ville le nom de son fils Hénoc[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « connut sa femme ». En hébreu, « connaître » est ici un idiome courant pour désigner les relations sexuelles.'
    reason: cultural_note
  - marker: b
    text: 'La construction hébraïque peut présenter une action en cours : « il était en train de bâtir une ville », plutôt que simplement : « il bâtit une ville ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il appela le nom de la ville selon le nom de son fils, Hénoc ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: connut
  rationale: Le verbe signifie littéralement « connaître » et constitue ici un idiome hébreu désignant les relations sexuelles. « Conn 한ut » préserve cet idiome et le registre littéraire, tandis que la note en explicite le sens.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: אִשָּׁה peut signifier « femme » ou « épouse » ; avec le suffixe possessif et dans ce contexte conjugal, « sa femme » est naturel et exact.
- source_word: וַתַּהַר
  choice: elle devint enceinte
  rationale: Cette formulation française actuelle exprime clairement l'entrée dans la grossesse et convient mieux au registre courant que « elle conçut ».
- source_word: וַתֵּלֶד
  choice: mit au monde
  rationale: Le verbe יָלַד signifie ici enfanter ou donner naissance. « Mit au monde » est naturel, digne et immédiatement compréhensible.
- source_word: חֲנוֹךְ
  choice: Hénoc
  rationale: La forme française biblique usuelle du nom est « Hénoc ».
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: Il était en train de bâtir une ville
  rationale: La construction היה suivie du participe בֹּנֶה présente vraisemblablement l'action comme en cours. Cette traduction conserve cette valeur progressive sans la réduire à un accompli simple.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: donna à la ville le nom de son fils Hénoc
  rationale: La formulation rend naturellement l'idiome littéral « appeler le nom de la ville selon le nom de son fils », tout en conservant l'idée explicite de correspondance entre les noms.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le texte conserve l'idiome « connut » avec une explication en note, rend explicitement l'aspect progressif probable de la construction verbale et reformule naturellement l'idiome hébreu de dénomination.
