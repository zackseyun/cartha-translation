  text: וַ/תֹּ֣סֶף לָ/לֶ֔דֶת אֶת אָחִ֖י/ו אֶת הָ֑בֶל וַֽ/יְהִי הֶ֨בֶל֙ רֹ֣עֵה צֹ֔אן וְ/קַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: fr
  text: Elle mit encore au monde son frère Abel[a]. Abel devint gardien de troupeaux[b], tandis que Caïn cultivait le sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Elle continua à enfanter ». L’expression hébraïque emploie littéralement le verbe « ajouter » avec un infinitif pour exprimer la répétition ou la continuation.
    reason: lexical_alternative
  - marker: b
    text: Le terme « troupeaux » désigne ici collectivement le petit bétail, surtout les moutons et les chèvres.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: Elle mit encore au monde
  rationale: L’expression יסף suivie de l’infinitif indique la répétition ou la continuation. « Mit encore au monde » rend naturellement ici la succession des naissances.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: son frère Abel
  rationale: Le double marqueur d’objet présente l’enfant puis l’identifie en apposition comme le frère de Caïn, Abel. Le pronom « son » renvoie à Caïn, mentionné au verset précédent.
- source_word: הֶבֶל
  choice: Abel
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַיְהִי
  choice: devint
  rationale: היה introduit ici l’état ou l’activité d’Abel. « Devint » conserve la progression narrative, bien que « était » reste possible.
- source_word: רֹעֵה צֹאן
  choice: berger de petit bétail
  rationale: רעה désigne l’action de faire paître ou de garder, tandis que צאן est un terme collectif visant surtout les moutons et les chèvres. « Petit bétail » évite de réduire le sens aux seuls moutons.
- source_word: קַיִן
  choice: Caïn
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: cultivait le sol
  rationale: עבד avec אֲדָמָה signifie travailler ou cultiver le sol. Cette formulation est naturelle en français et conserve le terme « sol », important dans le contexte de la Genèse.
- source_word: אֲדָמָה
  choice: sol
  rationale: « Sol » rend concrètement la terre cultivable et permet de préserver la continuité thématique avec les passages voisins de la Genèse.
- source_word: וְ
  choice: tandis que
  rationale: La conjonction relie deux activités distinctes. « Tandis que » marque clairement ce contraste descriptif sans suggérer une opposition morale.
theological_decisions:
- issue: Présentation narrative des métiers des deux frères
  choice: Décrire simplement leurs activités différentes sans leur attribuer de valeur morale.
  alternative: Employer une formulation qui valoriserait implicitement l’une des activités au détriment de l’autre.
  rationale: Dans ce verset, l’hébreu présente les occupations d’Abel et de Caïn de façon descriptive, sans établir entre elles de hiérarchie morale ou théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Mettre au monde » convient au récit de naissance; « berger de petit bétail » reste précis sans archaïsme; « cultivait le sol » est plus idiomatique que le calque « travaillait la terre » tout en maintenant le motif du sol dans la Genèse.
