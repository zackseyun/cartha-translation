base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: fr
  text: Caïn dit à son frère Abel[a]. Or, pendant qu’ils étaient dans le champ, Caïn se dressa contre son frère Abel et le tua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu massorétique porte seulement : « Caïn dit à son frère Abel », sans indiquer ce qu’il lui dit. Plusieurs témoins anciens, notamment la Septante, le Pentateuque samaritain et la Vulgate, ajoutent une parole équivalant à : « Allons au champ. »'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe אמר signifie normalement « dire ». Le texte massorétique ne donne toutefois pas le contenu des paroles, d’où la formulation abrupte conservée dans le texte principal.
- source_word: אֶל הֶבֶל אָחִיו
  choice: à son frère Abel
  rationale: אֶל marque ici le destinataire. Cet ordre des mots est naturel en français tout en conservant l’insistance narrative sur le lien fraternel.
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: Or, pendant qu’ils étaient
  rationale: La construction introduit le cadre temporel de l’action suivante. « Pendant que » exprime clairement la simultanéité, et « Or » assure une transition narrative digne et naturelle.
- source_word: בַּשָּׂדֶה
  choice: dans les champs
  rationale: שָׂדֶה peut désigner un champ ou la campagne. Le pluriel français « dans les champs » est idiomatique pour un lieu ouvert hors de l’habitation.
- source_word: וַיָּקָם ... אֶל
  choice: se dressa contre
  rationale: Cette expression conserve l’image et l’hostilité de l’idiome hébreu sans la réduire au verbe plus interprétatif « attaqua ».
- source_word: וַיַּהַרְגֵהוּ
  choice: le tua
  rationale: הרג signifie directement « tuer ». « Assassina » ajouterait une qualification juridique ou morale qui n’est pas portée à elle seule par ce verbe.
theological_decisions:
- issue: Présence ou absence des paroles adressées par Caïn à Abel
  choice: Conserver dans le texte principal la leçon courte et abrupte du texte massorétique, avec une note signalant la leçon longue.
  alternative: 'Insérer dans le texte principal : « Allons dans les champs. »'
  rationale: Le texte hébreu fourni ne contient aucun discours après « Caïn dit à son frère Abel ». Plusieurs témoins anciens attestent cependant une proposition qui rend la narration plus fluide et pourrait préserver le texte original. La note maintient cette donnée textuelle importante sans l’introduire silencieusement dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « son frère Abel » est maintenue afin de préserver l’insistance du récit sur le fratricide. La brusquerie de la première phrase reflète délibérément la leçon massorétique.
