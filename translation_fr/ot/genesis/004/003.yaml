id: GEN.4.3
reference: Genesis 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: fr
  text: Au bout d’un certain temps[a], Caïn apporta à Yahweh une offrande tirée des produits du sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la fin de jours », c’est-à-dire après un certain temps.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « du fruit du sol ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[intégré à la tournure temporelle]'
  rationale: La forme narrative introduit l’événement suivant. En français moderne, elle n’exige pas le calque lourd « et il arriva ».
- source_word: מִקֵּץ יָמִים
  choice: Au bout d’un certain temps
  rationale: Cette locution indique ici qu’une période s’est écoulée, sans connotation eschatologique. La note conserve son expression hébraïque plus littérale.
- source_word: וַיָּבֵא
  choice: apporta
  rationale: Le hiphil de בוא signifie ici faire venir, donc apporter quelque chose en offrande.
- source_word: קַיִן
  choice: Caïn
  rationale: Forme française courante du nom propre.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: tirée des produits du sol
  rationale: פְּרִי désigne ici ce que le sol produit; « produits du sol » est naturel en français et préserve le lien agricole avec אֲדָמָה.
- source_word: מִנְחָה
  choice: une offrande
  rationale: Le terme peut désigner un don, un tribut ou une offrande. Dans ce contexte cultuel, « offrande » rend le sens sans préciser indûment sa nature.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La translittération rend directement le nom divin יהוה présent dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère propre du nom plutôt que de le remplacer par un titre.
- issue: Sens de מִקֵּץ יָמִים
  choice: Au bout d’un certain temps
  alternative: À la fin des jours
  rationale: Dans ce récit, la formule marque l’écoulement d’une période; une traduction littérale par « fin des jours » risquerait de suggérer à tort une portée eschatologique.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe évite l’archaïsme « il arriva que », tandis que « apporta » et « offrande » conservent la sobriété narrative et cultuelle du texte.
