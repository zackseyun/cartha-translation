source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: fr
  text: Quand tu cultiveras le sol[a], il ne te donnera plus sa force[b]. Tu seras errant et fugitif[c] sur la terre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Car, lorsque tu cultiveras le sol » ou « Si tu cultives le sol ». La conjonction hébraïque peut recevoir une valeur causale, temporelle ou conditionnelle selon l’analyse de la phrase.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il ne continuera pas à te donner sa force ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « sans repos, toujours errant ». Les deux termes hébreux ont des sens proches et renforcent l’idée d’une existence instable; le second peut aussi évoquer le fait d’être poussé à l’errance.
    reason: lexical_alternative
  - marker: d
    text: Ou « dans le pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: La conjonction introduit ici naturellement la circonstance future dans laquelle la sentence se réalisera. « Car » et « si » restent possibles selon l’analyse du lien syntaxique.
- source_word: תַעֲבֹד אֶת הָאֲדָמָה
  choice: tu cultiveras le sol
  rationale: Dans ce contexte agricole, עבד désigne le travail de la terre. « Cultiver » est naturel et précis, tandis que « le sol » maintient le lien avec l’אֲדָמָה des versets précédents.
- source_word: לֹא תֹסֵף תֵּת
  choice: il ne te donnera plus
  rationale: 'La construction יסף suivie de l’infinitif exprime la cessation : le sol ne continuera plus à donner. Cette formulation conserve aussi le verbe concret « donner » du texte hébreu.'
- source_word: כֹּחָהּ
  choice: sa force
  rationale: La traduction littérale préserve la métaphore de la force productive du sol, sans la réduire explicitement à « ses produits » ou à « sa fertilité ».
- source_word: נָע וָנָד
  choice: errant et vagabond
  rationale: Les deux termes se recouvrent et se renforcent pour décrire une existence instable et sans établissement durable. La paire française garde ce redoublement sans fusionner les deux mots.
- source_word: בָאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre ou un pays. Dans le cadre universel des premiers chapitres de la Genèse, « sur la terre » convient bien, tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Portée de la sentence prononcée contre Caïn
  choice: Une privation concrète de la productivité du sol, accompagnée d’une vie instable et sans établissement durable.
  alternative: Une agitation purement intérieure, ou seulement un exil géographiquement limité.
  rationale: Le verset associe explicitement le refus du sol de donner sa force et la condition d’errant de Caïn. La traduction maintient ensemble les dimensions matérielle et sociale de la sentence sans importer de catégories doctrinales ultérieures.
translation_notes:
  register: Français international moderne, sobre et digne. « Cultiver le sol » est accessible et agricole; « sa force » conserve l’image hébraïque. La paire « errant et vagabond » garde le parallélisme intensif, même si « vagabond » possède une légère coloration traditionnelle.
