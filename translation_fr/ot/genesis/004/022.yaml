    rationale: כָּל appelle « tous les » ou « tout », et la lecture retenue par l’audit anglais comprend חֹרֵשׁ comme un instrument coupant/taillant. La difficulté textuelle peut être signalée en note, mais le texte principal doit exprimer cette lecture de manière plus précise.
  - severity: low
    issue: La note alternative dit « pour tous les artisans », relation absente de la formulation hébraïque.
    rationale: L’analyse alternative rattache plutôt le terme à « tout artisan », non à une activité exercée « pour » eux. Une formulation plus neutre préserve mieux l’ambiguïté syntaxique.
