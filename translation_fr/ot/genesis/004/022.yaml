  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: fr
  text: Tsilla, elle aussi, mit au monde Toubal-Caïn[a], qui forgeait tous les instruments tranchants en bronze et en fer[b]. La sœur de Toubal-Caïn s’appelait Naama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « qui aiguisait ou martelait tout artisan travaillant le bronze et le fer ». La formulation hébraïque qui suit « Toubal-Caïn » est difficile : elle peut décrire soit un fabricant d’instruments métalliques, soit un artisan travaillant les métaux.'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « bronze » peut aussi désigner le cuivre.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: elle aussi
  rationale: Cette tournure française exprime naturellement la valeur additive de l’hébreu tout en conservant le pronom emphatique.
- source_word: יָלְדָה
  choice: mit au monde
  rationale: Expression française courante et digne pour l’action d’enfanter dans un récit généalogique.
- source_word: תּוּבַל קַיִן
  choice: Toubal-Caïn
  rationale: Translittération française usuelle de ce nom propre composé.
- source_word: לֹטֵשׁ כָּל חֹרֵשׁ
  choice: qui forgeait toutes sortes d’outils
  rationale: Le groupe hébreu est difficile. Cette formulation rend le travail du métal suggéré par לֹטֵשׁ et comprend חֹרֵשׁ comme désignant les objets façonnés, sans limiter indûment le texte aux seuls outils tranchants. Une autre analyse possible est signalée en note.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: « Bronze » est la désignation conventionnelle dans ce contexte ancien, bien que le mot puisse aussi désigner le cuivre.
- source_word: בַרְזֶל
  choice: fer
  rationale: Équivalent français direct du nom de ce métal.
- source_word: אֲחוֹת
  choice: sœur
  rationale: Traduction directe du terme de parenté.
- source_word: נַעֲמָה
  choice: Naama
  rationale: Translittération française claire du nom propre hébreu.
theological_decisions: []
translation_notes:
