  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: fr
  text: 'Adam connut encore sa femme. Elle mit au monde un fils et l’appela Seth[a], car elle dit : « Dieu m’a accordé un autre enfant à la place d’Abel, puisque Caïn l’a tué. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Seth » fait écho au verbe hébreu traduit ici par « a accordé », dont le sens premier est « a placé » ou « a établi ».
    reason: Le jeu de mots hébreu entre שֵׁת et שָׁת ne peut être reproduit directement en français.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: connut
  rationale: Le verbe יָדַע employé avec l’épouse est l’euphémisme hébreu traditionnel pour les relations sexuelles. « Conn دut » conserve cette expression littéraire, compréhensible dans le registre biblique français.
- source_word: אָדָם
  choice: Adam
  rationale: Le contexte vise ici le nom propre, selon sa forme française usuelle.
- source_word: עוֹד
  choice: encore
  rationale: L’adverbe indique la répétition de l’union conjugale ; « encore » est naturel et proche de l’hébreu.
- source_word: וַתֵּלֶד בֵּן
  choice: elle mit au monde un fils
  rationale: Formulation française actuelle et digne qui rend directement la naissance d’un fils.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: elle l’appela
  rationale: « Elle l’appela » rend naturellement la formule hébraïque de nomination sans calquer l’expression « elle appela son nom ».
- source_word: שֵׁת
  choice: Seth
  rationale: Forme française traditionnelle du nom propre hébreu.
- source_word: שָׁת
  choice: m’a accordé
  rationale: Le verbe signifie fondamentalement « placer, mettre ». Dans cette parole, « accorder » exprime naturellement le don providentiel, tandis que la note conserve le sens concret et le jeu de mots avec Seth.
- source_word: זֶרַע
  choice: descendance
  rationale: זֶרַע signifie littéralement « semence » et peut désigner la progéniture ou la lignée. « Descendance » préserve mieux cette portée potentiellement collective que le seul mot « enfant ».
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans ce contexte, la préposition marque la substitution ou le remplacement.
- source_word: הֲרָגוֹ
  choice: l’a tué
  rationale: Le verbe הרג est le terme courant signifiant « tuer » ; il ne convient pas de le préciser lexicalement en « assassiner ».
theological_decisions:
- issue: Explication donnée au nom de Seth
  choice: Dieu m’a accordé une autre descendance
  alternative: Dieu a placé pour moi une autre semence
  rationale: La formulation principale exprime naturellement que Dieu est reconnu comme l’auteur de ce don après la mort d’Abel. La note signale le sens concret du verbe et le jeu sonore que le français ne peut reproduire pleinement.
- issue: Caractère explicite de l’euphémisme sexuel
  choice: Adam connut encore sa femme
  alternative: Adam eut de nouveau des relations avec sa femme
  rationale: Le texte source emploie l’euphémisme conventionnel « connaître ». Le conserver respecte sa texture littéraire sans expliciter davantage que l’hébreu.
- issue: Portée de זֶרַע
  choice: descendance
  alternative: enfant
  rationale: « Descendance » laisse subsister la portée procréative et éventuellement collective du terme hébreu, tout en désignant ici le fils nouvellement né.
translation_notes:
  register: Français international moderne, digne et lisible. L’euphémisme « connut » conserve le registre littéraire biblique ; « mit au monde » et « l’appela » évitent des calques peu naturels. Le marqueur [a] figure immédiatement après le nom concerné.
