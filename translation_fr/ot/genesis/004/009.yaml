  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: fr
  text: 'Alors Yahweh dit à Caïn : « Où est Abel, ton frère ? » Il répondit : « Je ne sais pas[a]. Suis-je le gardien de mon frère ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je ne savais pas ». Le parfait hébreu peut être compris comme une dénégation au passé, même si, dans ce contexte, il exprime naturellement une prétention actuelle à l’ignorance.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: וַיֹּאמֶר
  choice: Alors … dit / Il répondit
  rationale: La première forme fait progresser le récit; dans la seconde proposition, « répondit » exprime naturellement en français la réponse de Caïn sans modifier le contenu de ses paroles.
- source_word: אֵי
  choice: Où est
  rationale: L’interrogatif porte sur le lieu; le français exige naturellement le verbe « être » dans cette question.
- source_word: הֶבֶל אָחִיךָ
  choice: Abel, ton frère
  rationale: Le nom propre et le nom masculin singulier avec suffixe de deuxième personne sont conservés; la virgule rend l’apposition naturelle en français.
- source_word: לֹא יָדַעְתִּי
  choice: Je ne sais pas
  rationale: Bien que la forme soit un parfait hébreu, dans ce dialogue elle exprime naturellement une prétention actuelle à l’ignorance; l’alternative passée est signalée en note.
- source_word: הֲשֹׁמֵר
  choice: le gardien
  rationale: Le participe de שׁמר désigne celui qui garde ou veille sur quelqu’un; « gardien » conserve la concision et la portée de la question rhétorique.
- source_word: אָחִי אָנֹכִי
  choice: Suis-je … de mon frère ?
  rationale: Le lien fraternel et la première personne emphatique sont préservés dans une tournure interrogative française naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Portée de la question de Caïn
  choice: Suis-je le gardien de mon frère ?
  alternative: Est-ce à moi de veiller sur mon frère ?
  rationale: Le rendu retenu conserve la métaphore du gardien et l’ambiguïté rhétorique du texte, sans expliciter davantage la responsabilité morale implicite.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement reflète les formes hébraïques au singulier. « Gardien » maintient l’expression concise et mémorable sans ajouter d’interprétation.
