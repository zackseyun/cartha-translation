  text: וַ/תֵּ֥לֶד עָדָ֖ה אֶת יָבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י יֹשֵׁ֥ב אֹ֖הֶל וּ/מִקְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: fr
  text: Ada donna naissance à Yabal[a] ; il fut le père de ceux qui habitent sous des tentes et ont des troupeaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le père de ceux qui vivent sous des tentes et ont du bétail ». En hébreu, « père de » peut désigner un ancêtre, un fondateur ou l’initiateur emblématique d’un mode de vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: donna naissance à
  rationale: Le qal narratif de ילד exprime ici l’enfantement dans une notice généalogique ; cette tournure est naturelle et digne en français moderne.
- source_word: עָדָה
  choice: Ada
  rationale: Translittération française usuelle du nom propre.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule désigne יבל comme objet direct et n’a pas d’équivalent lexical autonome en français.
- source_word: יָבָל
  choice: Yabal
  rationale: Translittération qui représente directement la consonne initiale hébraïque et convient aux usages français modernes.
- source_word: הוּא הָיָה
  choice: il fut
  rationale: La construction identifie Yabal et énonce son rôle dans le récit. Le passé simple convient à la narration concise, sans imposer le sens plus évolutif de « devint ».
- source_word: אֲבִי
  choice: le père de
  rationale: La traduction conserve la métaphore hébraïque, qui peut désigner le géniteur, l’ancêtre ou l’initiateur emblématique d’un mode de vie.
- source_word: יֹשֵׁב אֹהֶל
  choice: ceux qui vivent sous des tentes
  rationale: Le participe singulier a une valeur collective et décrit une catégorie de personnes caractérisée par la vie sous la tente.
- source_word: וּמִקְנֶה
  choice: et possèdent du bétail
  rationale: מִקְנֶה désigne collectivement les animaux domestiques ou les troupeaux. Le verbe « possèdent » explicite sobrement la relation sous-entendue par la coordination nominale hébraïque, sans la limiter aux bovins.
theological_decisions:
- issue: Portée de l’expression « père de »
  choice: Conserver « le père de » dans le texte et expliquer sa portée possible en note.
  alternative: Traduire directement par « l’ancêtre de » ou « l’initiateur de ».
  rationale: L’hébreu laisse ouverte la nuance exacte entre ascendance, fondation et origine emblématique d’un mode de vie ; conserver la métaphore évite de trancher indûment.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La formulation conserve la concision généalogique du verset et la métaphore culturellement chargée de « père de ».
