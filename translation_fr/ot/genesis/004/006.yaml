  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל קָ֑יִן לָ֚/מָּה חָ֣רָה לָ֔/ךְ וְ/לָ֖/מָּה נָפְל֥וּ פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: fr
  text: 'Alors Yahweh dit à Caïn : « Pourquoi es-tu en colère, et pourquoi as-tu le visage abattu[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pourquoi ton visage est-il tombé ? »'
    reason: La note conserve la formulation imagée de l’hébreu derrière l’expression française idiomatique « avoir le visage abattu ».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait avancer le récit. « Alors » marque naturellement la succession en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que par un titre substitutif.
- source_word: אֶל קָיִן
  choice: à Caïn
  rationale: La préposition אֶל introduit ici le destinataire de la parole; « à Caïn » est l’expression française naturelle.
- source_word: לָמָּה חָרָה לָךְ
  choice: Pourquoi es-tu en colère
  rationale: L’expression hébraïque évoque littéralement quelque chose qui brûle pour quelqu’un, mais constitue ici un idiome clair désignant la colère.
- source_word: וְלָמָּה נָפְלוּ פָנֶיךָ
  choice: et pourquoi ton visage est-il abattu
  rationale: L’hébreu dit littéralement que le visage de Caïn « est tombé ». « Visage abattu » restitue en français courant son expression découragée ou sombre tout en conservant l’image corporelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. Employer « Yahweh » préserve le nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe interrogative avec inversion convient à une parole directe soutenue sans être archaïque.
