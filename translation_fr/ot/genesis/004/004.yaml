id: GEN.4.4
reference: Genesis 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: fr
  text: Abel, lui aussi, apporta quelques-uns des premiers-nés de son troupeau, ainsi que leurs parties grasses[a]. Yahweh regarda favorablement Abel et son offrande[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de leur graisse ». Il s’agit vraisemblablement des parties grasses de choix des animaux offerts.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « porta son regard sur Abel et son offrande ». Le verbe hébreu indique ici un regard favorable, sans préciser comment cette faveur s’est manifestée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: Abel
  rationale: Le waw poursuit simplement le récit. En français, la juxtaposition après le verset précédent rend naturellement cet enchaînement sans qu’il soit nécessaire d’ajouter « et ».
- source_word: הֵבִיא
  choice: apporta
  rationale: Le hiphil de בוא signifie ici « apporter » dans le contexte d’une offrande; ce choix reste direct et moins interprétatif que « présenta ».
- source_word: גַם הוּא
  choice: lui aussi
  rationale: Cette tournure restitue l’insistance du pronom et indique qu’Abel, comme Caïn, apporta une offrande.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: quelques-uns des premiers-nés de son troupeau
  rationale: 'La préposition מן a ici une valeur partitive : Abel apporta des animaux pris parmi les premiers-nés, sans que le texte affirme qu’il les apporta tous.'
- source_word: וּמֵחֶלְבֵהֶן
  choice: ainsi que leurs parties grasses
  rationale: חֵלֶב désigne littéralement la graisse et peut viser les portions grasses offertes. Cette formulation conserve l’image concrète et sa portée sacrificielle sans la remplacer par l’interprétation « les meilleurs morceaux ».
- source_word: וַיִּשַׁע
  choice: regarda favorablement
  rationale: Le verbe exprime le fait de tourner son regard vers quelqu’un ou de lui prêter attention; dans ce contexte, ce regard est favorable. La formulation exprime cette orientation positive sans préciser comment elle s’est manifestée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: Abel et son offrande
  rationale: Avec « regarder favorablement », le français emploie naturellement un complément direct. Les deux occurrences de אֶל distinguent néanmoins Abel de son offrande; cette double visée demeure claire.
- source_word: מִנְחָתוֹ
  choice: son offrande
  rationale: מִנְחָה peut désigner un don, un présent ou une offrande. « Offrande » convient au contexte cultuel tout en restant assez large.
theological_decisions:
- issue: Nature de la réponse divine exprimée par וַיִּשַׁע
  choice: « regarda favorablement » indique une réponse positive envers Abel et son offrande sans en préciser le signe ni le mécanisme.
  alternative: « porta son regard sur » ou « agréa »
  rationale: La première possibilité préserverait davantage le mouvement littéral du regard mais risquerait de masquer sa valeur favorable dans ce contexte; « agréa » rendrait l’acceptation plus explicite que le verbe hébreu. Le choix retenu conserve la réponse positive sans introduire de manifestation non mentionnée.
translation_notes:
  register: Français international moderne, courant et digne. « Lui aussi » conserve l’emphase hébraïque; « parties grasses » garde le caractère concret et sacrificiel du vocabulaire. La virgule finale maintient le lien syntaxique et narratif avec le contraste du verset suivant.
