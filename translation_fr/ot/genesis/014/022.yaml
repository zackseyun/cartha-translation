  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: fr
  text: 'Mais Abram dit au roi de Sodome : « J’ai levé ma main vers Yahweh, le Dieu Très-Haut, possesseur[a] du ciel et de la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « créateur ». Le participe hébreu peut désigner celui qui possède ou acquiert et peut, dans ce contexte, être compris au sens de « créateur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais … dit
  rationale: Le waw narratif fait progresser le récit. « Mais » exprime naturellement le contraste entre l’offre du roi de Sodome et la réponse d’Abram.
- source_word: הֲרִימֹתִי יָדִי
  choice: J’ai levé la main
  rationale: Cette traduction conserve l’image concrète du geste hébreu par lequel on prête serment; une note en explicite la portée culturelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֵל עֶלְיוֹן
  choice: le Dieu Très-Haut
  rationale: Formulation française établie, claire et digne pour ce titre divin.
- source_word: קֹנֵה
  choice: maître
  rationale: Dans ce contexte, « maître » exprime la possession et la souveraineté sans exclure la nuance possible de création. Le mot hébreu peut aussi se comprendre comme « créateur » ou « possesseur ».
- source_word: שָׁמַיִם וָאָרֶץ
  choice: du ciel et de la terre
  rationale: Expression française naturelle correspondant au mérisme hébreu qui désigne l’ensemble du monde créé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens de קֹנֵה שָׁמַיִם וָאָרֶץ
  choice: maître du ciel et de la terre
  alternative: créateur du ciel et de la terre; possesseur du ciel et de la terre
  rationale: Le participe קֹנֵה peut évoquer la possession ou, dans ce contexte, la création. « Maître » est idiomatique en français et maintient une certaine ouverture sémantique; la note conserve l’autre lecture importante.
translation_notes:
  register: Français international moderne, naturel et digne. L’image du serment est conservée littéralement dans le corps du verset; la syntaxe reste fluide et le titre divin est rendu selon l’usage biblique français.
