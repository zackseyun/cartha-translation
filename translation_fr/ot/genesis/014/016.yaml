  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: fr
  text: Il ramena tous les biens[a] ; il ramena aussi Lot, son proche parent[b], et ses biens, ainsi que les femmes[c] et le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les possessions » ou « tous les avoirs ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son frère ». En hébreu, le mot peut aussi désigner un proche parent ; dans le récit, Lot est le neveu d’Abram.
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, « les femmes » peut inclure les épouses, mais le terme hébreu a un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: il ramena
  rationale: Les deux formes hiphil de שׁוב expriment ici le fait de faire revenir ou de rapporter des personnes et des biens récupérés. « Ramena » est naturel en français et conserve la répétition verbale de l’hébreu.
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: tous les biens / ses biens
  rationale: רְכוּשׁ désigne les possessions ou biens matériels. « Biens » convient aux deux occurrences et maintient la cohérence lexicale.
- source_word: וְגַם
  choice: aussi / ainsi que
  rationale: La particule additive est rendue de façon idiomatique tout en conservant son rôle d’ajout dans les deux parties du verset.
- source_word: לוֹט אָחִיו
  choice: Lot, son parent
  rationale: אָחִיו signifie littéralement « son frère », mais peut désigner un membre de la parenté au sens large. Le récit présente Lot comme le neveu d’Abram ; « son parent » restitue donc ici le sens contextuel sans préciser davantage le lien dans le texte principal.
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Le nom désigne les femmes en général et n’impose pas le sens plus étroit d’« épouses » dans ce contexte.
- source_word: הָעָם
  choice: le peuple
  rationale: עָם désigne collectivement les personnes emmenées captives. « Le peuple » préserve cette portée générale sans la limiter aux hommes.
