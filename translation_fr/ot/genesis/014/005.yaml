review_pass:
  verdict: revise
  source_fidelity: Le sens de la séquence militaire et les trois groupes avec leurs lieux respectifs sont bien rendus. « Vainquirent » est une traduction contextuellement juste de וַיַּכּוּ. La ponctuation proposée en deux phrases est possible, mais la coordination unique du récit hébreu se rend plus fidèlement et plus fluidement en une seule phrase.
  naturalness: « ZouZites » n’est ni une graphie française naturelle ni une translittération cohérente, notamment en raison de la majuscule interne. Le maintien des ethnonymes sous les formes translittérées « Rephaïm », « Zuzim » et « Émim » est plus clair, plus sobre et évite une francisation artificielle.
  terminology: Les noms de peuples doivent rester des ethnonymes non interprétés. « Rephaïm » est préférable à « Refaïtes », forme qui peut suggérer un gentilé français reconstruit. Les notes conservent à juste titre l’alternative interprétative « géants » et l’ambiguïté de Shavé-Qiryataïm.
  issues:
  - severity: medium
    issue: Graphie « ZouZites »
    rationale: La majuscule médiane est injustifiée et la forme hybride n’est pas idiomatique. « Zuzim » restitue le nom de peuple sans ajouter de morphologie française incertaine.
  - severity: low
    issue: Ethnonymes inutilement francisés
    rationale: « Refaïtes » et « Émites » sont possibles en théorie, mais « Rephaïm » et « Émim » maintiennent plus nettement le statut de noms propres collectifs du texte source et assurent une présentation cohérente de la liste.
  - severity: low
    issue: Coordination narrative scindée en deux phrases
    rationale: La scission ne change pas le sens, mais une phrase unique rend mieux le lien syntaxique entre la venue de Kedorlaomer avec ses alliés et leur action commune.
