id: GEN.14.5
reference: Genesis 14:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: fr
  text: La quatorzième année, Kedorlaomer vint avec les rois qui étaient avec lui et ils vainquirent les Rephaïm[a] à Ashteroth-Qarnaïm, les Zuzim à Ham et les Émim à Shavé-Qiryataïm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Rephaïm » est parfois traduit par « géants » ; il est conservé ici comme nom d’un peuple.
    reason: lexical_alternative
  - marker: b
    text: « Shavé-Qiryataïm » peut aussi être compris comme « la plaine de Qiryataïm ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: La quatorzième année
  rationale: La locution ouvre une indication temporelle. En français narratif, la conjonction initiale peut rester implicite sans rompre l’enchaînement du récit.
- source_word: בָּא
  choice: vint
  rationale: Le verbe בוא signifie d’abord « venir » ou « arriver ». « Vint » conserve sa portée générale sans ajouter explicitement l’idée de marche militaire.
- source_word: כְדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Cette translittération suit assez directement la forme hébraïque tout en restant lisible en français.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: avec les rois qui étaient avec lui
  rationale: La formulation conserve à la fois la coordination et l’accompagnement exprimé par אִתּוֹ.
- source_word: וַיַּכּוּ
  choice: Ils vainquirent
  rationale: Dans cette énumération militaire, נכה décrit des peuples frappés et défaits ; « vainquirent » rend naturellement le résultat sans employer l’archaïque « frappèrent ».
- source_word: רְפָאִים
  choice: les Refaïtes
  rationale: Il s’agit ici d’un nom de peuple. La forme française « Refaïtes » le traite comme un ethnonyme plutôt que de l’interpréter comme « géants ».
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: à Ashteroth-Qarnaïm
  rationale: La préposition indique le lieu du combat. Le toponyme est translittéré ; « Qarnaïm » rend le qoph initial et la terminaison du duel hébreu.
- source_word: הַזּוּזִים
  choice: les ZouZites
  rationale: Le terme est conservé comme ethnonyme et adapté à la morphologie française. La graphie interne signale les deux éléments consonantiques z de la forme hébraïque.
- source_word: בְּהָם
  choice: à Ham
  rationale: Dans la série géographique, הָם est compris comme un nom de lieu, sans tentative d’en traduire le sens.
- source_word: הָאֵימִים
  choice: les Émites
  rationale: Le nom du peuple est translittéré et francisé, sans le rattacher dans le corps du texte à un sens étymologique conjectural.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: à Shavé-Qiryataïm
  rationale: Le parallélisme avec les autres lieux favorise la conservation du groupe comme toponyme composé, tout en laissant en note l’autre analyse possible de שָׁוֵה.
theological_decisions:
- issue: Identification des רְפָאִים
  choice: 'Nom de peuple : « les Refaïtes »'
  alternative: « les géants »
  rationale: Le contexte syntaxique énumère des peuples et ne contraint pas à traduire l’ethnonyme par une caractérisation physique ou mythologique.
- issue: Analyse de שָׁוֵה קִרְיָתָיִם
  choice: 'Toponyme translittéré : « Shavé-Qiryataïm »'
  alternative: « la plaine de Qiryataïm »
  rationale: La structure de la liste favorise un nom de lieu, mais la valeur lexicale possible de שָׁוֵה demeure authentiquement ambiguë et est signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres sont translittérés de l’hébreu et les ethnonymes sont adaptés à l’usage français. La ponctuation en deux phrases allège une longue coordination sans modifier la progression des événements.
