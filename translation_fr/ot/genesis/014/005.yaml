revisions:
- from: La quatorzième année, Kedorlaomer vint avec les rois qui étaient avec lui. Ils vainquirent les Refaïtes[a] à Ashteroth-Qarnaïm, les ZouZites à Ham et les Émites à Shavé-Qiryataïm[b].
  to: La quatorzième année, Kedorlaomer vint avec les rois qui étaient avec lui et ils vainquirent les Rephaïm[a] à Ashteroth-Qarnaïm, les Zuzim à Ham et les Émim à Shavé-Qiryataïm[b].
  rationale: La révision corrige la graphie non naturelle de « ZouZites », uniformise les ethnonymes en translittérations non interprétatives, et restitue la coordination continue du texte hébreu. Les deux notes restent correctement ancrées et préservent les ambiguïtés lexicales pertinentes.
