  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: fr
  text: Ils emmenèrent Lot[a], le neveu d’Abram, avec ses biens, puis repartirent[b]. Lot habitait alors à Sodome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fils du frère d’Abram », c’est-à-dire son neveu.'
    reason: lexical_alternative
  - marker: b
    text: L’ordre des mots en hébreu place l’expression « le fils du frère d’Abram » après « ses biens ».
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils emmenèrent
  rationale: Le qal narratif de לקח signifie « prendre ». Comme Lot est une personne capturée et emmenée, « emmenèrent » exprime naturellement le sens contextuel sans la force excessive de « saisirent ».
- source_word: רְכֻשׁוֹ
  choice: ses biens
  rationale: רְכוּשׁ désigne les possessions ou biens matériels, notamment les biens transportables. « Ses biens » est clair et idiomatique en français moderne.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: le neveu d’Abram
  rationale: L’hébreu dit littéralement « le fils du frère d’Abram ». « Le neveu d’Abram » en donne le sens exact et naturel; la formulation littérale est conservée en note.
- source_word: וַיֵּלֵכוּ
  choice: puis repartirent
  rationale: הלך signifie normalement « aller ». Dans ce contexte, après la prise des personnes et des biens, « repartirent » indique idiomatiquement qu’ils quittèrent les lieux, sans ajouter l’idée plus forte de fuite.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: Lot habitait alors à Sodome
  rationale: Le participe יֹשֵׁב présente une situation de fond. Répéter « Lot » lève naturellement en français l’ambiguïté du pronom et « alors » rend la valeur explicative de la proposition.
