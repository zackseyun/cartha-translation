source:
  edition: WLC
  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: fr
  text: La vallée de Siddim était pleine de puits de bitume[a]. Les rois de Sodome et de Gomorrhe prirent la fuite et tombèrent là[b], tandis que les autres s’enfuirent vers la région montagneuse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « puits de goudron » ou « puits d’asphalte » ; l’hébreu désigne des puits de bitume.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tombèrent là », c’est-à-dire dans la vallée de Siddim, probablement dans les puits de bitume.
    reason: lexical_alternative
  - marker: c
    text: Ou « vers les montagnes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: la vallée de Siddim
  rationale: עֵמֶק désigne une vallée, et הַשִּׂדִּים en précise le nom. La construction française est naturelle et conserve le toponyme.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: était pleine de puits de bitume
  rationale: La répétition de בֶּאֱרֹת souligne l’abondance des puits. « Bitume » rend précisément חֵמָר, matériau naturel proche de l’asphalte ou du goudron.
- source_word: וַיָּנֻסוּ
  choice: prirent la fuite
  rationale: Rend naturellement le verbe נוס dans ce récit tout en évitant une répétition stylistiquement lourde avec le second emploi du même verbe.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: les rois de Sodome et de Gomorrhe
  rationale: Malgré la forme singulière מֶלֶךְ, les verbes au pluriel et le contexte indiquent les deux rois, celui de Sodome et celui de Gomorrhe.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: tombèrent là
  rationale: Cette traduction conserve le sens ordinaire de נפל et l’indétermination de l’hébreu, qui ne nomme pas explicitement ce dans quoi ils tombèrent.
- source_word: וְהַנִּשְׁאָרִים
  choice: les autres
  rationale: Désigne ceux qui restaient; « les autres » est clair et idiomatique dans le contexte sans imposer le sens plus précis de « survivants ».
- source_word: הֶרָה
  choice: vers la région montagneuse
  rationale: La forme directionnelle issue de הַר indique un mouvement vers les hauteurs ou le pays montagneux.
- source_word: נָסוּ
  choice: s’enfuirent
  rationale: Rend le même verbe נוס de façon naturelle dans la seconde proposition.
theological_decisions: []
