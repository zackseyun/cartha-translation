language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: fr
  text: Alors le roi de Sodome, le roi de Gomorrhe, le roi d’Adma, le roi de Tseboïm et le roi de Béla (c’est-à-dire Tsoar) sortirent. Ils se rangèrent en ordre de bataille contre eux[a], dans la vallée de Siddim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec eux ». Dans ce contexte militaire, cette expression signifie qu’ils se disposèrent à les affronter.'
    reason: La préposition hébraïque est formellement « avec », alors que le français idiomatique explicite ici la relation hostile par « contre ».
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Alors ... sortirent
  rationale: Le waw consécutif fait avancer le récit. Bien que le verbe hébreu soit au singulier avant le sujet composé, le français demande naturellement le pluriel avec la série de cinq rois.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Titre ordinaire de chaque souverain; sa répétition conserve la cadence solennelle de l’hébreu.
- source_word: סְדֹם
  choice: Sodome
  rationale: Forme française traditionnelle et couramment reconnue du nom de lieu.
- source_word: עֲמֹרָה
  choice: Gomorrhe
  rationale: Forme française traditionnelle et couramment reconnue du nom de lieu.
- source_word: אַדְמָה
  choice: Adma
  rationale: Transcription française usuelle de ce nom de lieu.
- source_word: צביים
  choice: Tseboïm
  rationale: Transcription qui représente distinctement les consonnes et les voyelles du nom hébreu tout en restant lisible en français.
- source_word: בֶּלַע הִוא צֹעַר
  choice: Béla (c’est-à-dire Tsoar)
  rationale: La parenthèse restitue clairement la précision appositive qui identifie Béla à Tsoar.
- source_word: וַיַּעַרְכוּ
  choice: Ils se rangèrent en ordre de bataille
  rationale: Dans un contexte militaire, ערך évoque la disposition ordonnée des forces; cette tournure française est précise, naturelle et plus évocatrice que le simple verbe « se préparer ».
- source_word: אִתָּם מִלְחָמָה
  choice: en ordre de bataille contre eux
  rationale: Le contexte indique l’affrontement. « Contre eux » exprime naturellement en français la relation hostile, tandis qu’une note signale que la construction hébraïque emploie littéralement « avec eux » et permet de conserver cette particularité.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: dans la vallée de Siddim
  rationale: « Vallée » est l’équivalent français actuel de עֵמֶק; Siddim est conservé comme nom propre translittéré.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La longue série des rois est conservée, mais la seconde proposition forme une nouvelle phrase afin d’éviter une période trop lourde. Les noms bibliques largement établis suivent l’usage français; les autres sont translittérés de manière cohérente.
