  text: וַ֠/יִּקְחוּ אֶת כָּל רְכֻ֨שׁ סְדֹ֧ם וַ/עֲמֹרָ֛ה וְ/אֶת כָּל אָכְלָ֖/ם וַ/יֵּלֵֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: fr
  text: Ils prirent alors tous les biens de Sodome et de Gomorrhe, ainsi que toute leur nourriture[a], et s’en allèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous leurs vivres ». Le terme hébreu peut désigner la nourriture en général ou des provisions destinées à un voyage ou à une campagne militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: ils prirent
  rationale: Le verbe לקח au qal exprime simplement l’action de prendre. « Ils prirent » reste direct et naturel, sans ajouter la nuance plus interprétative de « saisirent » ou « emportèrent ».
- source_word: כָּל רְכֻשׁ
  choice: tous les biens
  rationale: רְכֻשׁ désigne les possessions ou les biens matériels, notamment ceux qui peuvent être emportés comme butin. « Tous les biens » restitue aussi la portée globale de כָּל.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodome et Gomorrhe
  rationale: Formes françaises usuelles et reconnues de ces noms de lieux bibliques.
- source_word: כָּל אָכְלָם
  choice: toute leur nourriture
  rationale: Le nom dérivé de אכל désigne ce qui se mange, avec un suffixe pluriel signifiant « leur ». « Toute leur nourriture » est la formulation la plus directe, tandis que « tous leurs vivres » demeure une possibilité contextuelle.
- source_word: וַיֵּלֵכוּ
  choice: et s’en allèrent
  rationale: Dans ce contexte de pillage suivi d’un départ, « s’en allèrent » rend naturellement le mouvement d’éloignement exprimé par הלך.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La coordination « ainsi que » évite une répétition lourde tout en conservant l’étendue totale du butin. Le marqueur de note est placé après « nourriture », le mot auquel porte l’alternative lexicale.
