base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: fr
  text: Alors le roi de Sodome sortit à la rencontre d’Abram, après le retour de celui-ci, après qu’il eut vaincu Kedorlaomer et les rois qui étaient avec lui, vers la vallée de Shavé (c’est-à-dire la vallée du Roi).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Alors … sortit
  rationale: Le wayyiqtol fait progresser le récit; « Alors » exprime naturellement la succession narrative.
- source_word: מֶלֶךְ סְדֹם
  choice: le roi de Sodome
  rationale: Le groupe construit est rendu directement, avec la forme française usuelle du nom de lieu.
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: Expression française naturelle correspondant au mouvement effectué pour rencontrer quelqu’un; le pronom demeure ambigu comme dans l’hébreu immédiat.
- source_word: אַחֲרֵי שׁוּבוֹ מֵהַכּוֹת
  choice: après qu’il fut revenu de sa victoire sur
  rationale: Cette formulation restitue le retour consécutif à une victoire militaire sans suggérer nécessairement que tous les adversaires furent tués.
- source_word: כְּדָרלָעֹמֶר
  choice: Kedorlaomer
  rationale: Translittération proche de la forme consonantique hébraïque, préférable à une forme héritée par l’intermédiaire d’autres langues.
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: et sur les rois qui étaient avec lui
  rationale: La relative hébraïque est conservée clairement; « lui » renvoie contextuellement à Kedorlaomer.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: dans la vallée de Shavé
  rationale: Dans ce contexte de rencontre, « dans » indique naturellement le lieu atteint, tout en restant compatible avec la valeur directionnelle de אֶל.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: (c’est-à-dire la vallée du Roi)
  rationale: La parenthèse rend clairement l’identification explicative du toponyme.
