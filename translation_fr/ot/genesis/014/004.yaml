  text: שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ אֶת כְּדָרְלָעֹ֑מֶר וּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: fr
  text: Pendant douze ans, ils avaient été soumis à Kedorlaomer[a] ; mais la treizième année, ils se révoltèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « Kedor-Laomer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Pendant douze ans
  rationale: L’expression hébraïque indique une durée. « Pendant douze ans » est naturel en français et prépare le contraste temporel avec la treizième année.
- source_word: עָבְדוּ
  choice: ils avaient été soumis à
  rationale: Dans ce contexte politique, עבד désigne le service imposé à des vassaux, donc leur assujettissement à un souverain. Le plus-que-parfait situe cette période avant la révolte.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Le nom propre est translittéré d’après sa forme consonantique hébraïque, avec une graphie aisément lisible en français.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: mais la treizième année
  rationale: Littéralement, le texte porte « et treize ans », mais le contexte indique l’année qui suit les douze années de soumission. « Mais » exprime naturellement le tournant narratif sans changer le sens.
- source_word: מָרָדוּ
  choice: ils se révoltèrent
  rationale: מרד signifie se rebeller ou se révolter. « Se révoltèrent » convient au contexte politique et militaire et forme un contraste clair avec la soumission antérieure.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation politique « avaient été soumis à » explicite la valeur contextuelle de « servir » sans ajouter de précision absente du texte. Le passé simple maintient un registre narratif biblique naturel sans archaïsme lexical.
