  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: fr
  text: 'Je ne prendrai rien, sauf ce que les jeunes gens ont mangé[a] et la part des hommes qui sont allés avec moi : Aner, Eshkol et Mamré. Qu’ils prennent leur part[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les serviteurs ». Le mot hébreu peut désigner des jeunes gens ou des serviteurs attachés à un chef.
    reason: lexical_alternative
  - marker: b
    text: Ou « Ils prendront leur part ». La forme hébraïque peut exprimer un futur simple, mais le contexte favorise ici une permission.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: Je ne prendrai rien, sauf
  rationale: L’expression exceptive dépend du refus formulé au verset précédent. Le français naturel demande de reprendre l’idée verbale sous-entendue. « Sauf » exprime la restriction renforcée par רַק sans produire le pléonasme peu naturel « sauf seulement ».
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: ce que les jeunes gens ont mangé
  rationale: נְעָרִים peut désigner des jeunes gens ou des serviteurs attachés à un chef. « Jeunes gens » reste transparent et préserve l’ambiguïté sociale du terme, signalée en note.
- source_word: וְחֵלֶק
  choice: et la part
  rationale: חֵלֶק désigne ici la part de butin revenant aux alliés. « Part » est précis et idiomatique en français moderne.
- source_word: הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי
  choice: des hommes qui sont allés avec moi
  rationale: Cette formulation conserve simplement l’image de déplacement du verbe הלך, sans interpréter davantage la nature de leur alliance.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: Aner, Eshkol et Mamré
  rationale: Les noms propres sont translittérés en français de manière cohérente avec leurs formes hébraïques.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: Qu’ils prennent leur part
  rationale: 'Dans ce contexte, l’imparfait hébreu a vraisemblablement une valeur permissive : Abram laisse ses alliés recevoir ce qui leur revient. La note conserve la possibilité d’un futur simple.'
theological_decisions:
- issue: Reprise implicite du refus formulé au verset précédent
  choice: Expliciter « Je ne prendrai rien »
  alternative: 'Conserver un fragment : « sauf ce que les jeunes gens ont mangé… »'
  rationale: Le début hébreu est une expression exceptive syntaxiquement rattachée au verset précédent. L’explicitation produit une phrase française complète sans ajouter une affirmation doctrinale.
- issue: Valeur de l’imparfait יִקְחוּ
  choice: 'Permission : « Qu’ils prennent »'
  alternative: 'Futur simple : « Ils prendront »'
  rationale: Le contexte de renoncement au butin favorise une concession concernant la part des alliés, tout en laissant possible sur le plan grammatical une lecture au futur.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est naturelle tout en restant proche de la structure hébraïque; les ambiguïtés lexicales et modales significatives sont conservées en notes.
