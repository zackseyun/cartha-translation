  source_fidelity: Le texte rend fidèlement l’exception introduite par בִּלְעָדַי רַק en reprenant explicitement le refus implicite du verset précédent. « Ce que les jeunes gens ont mangé » correspond à אֲשֶׁר אָכְלוּ הַנְּעָרִים, et la note conserve de façon appropriée l’alternative contextuelle « serviteurs ». « La part des hommes qui sont allés avec moi » rend correctement וְחֵלֶק הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי. Les noms et la conclusion « Qu’ils prennent leur part » respectent le sens concessif plausible de הֵם יִקְחוּ חֶלְקָם, sans effacer la possibilité du futur, signalée en note.
