  terminology: « Part » convient au contexte du partage du butin. « Jeunes gens » demeure une traduction transparente de נְעָרִים sans imposer l’interprétation plus spécifique de serviteurs ou de combattants; la note fournit utilement cette possibilité. Les formes Aner, Eshkol et Mamré sont cohérentes avec une translittération française internationale.
