  text: וַ/יְהִ֗י בִּ/ימֵי֙ אַמְרָפֶ֣ל מֶֽלֶךְ שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדָרְלָעֹ֨מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְ/תִדְעָ֖ל מֶ֥לֶךְ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: fr
  text: 'Voici ce qui arriva à l’époque d’Amraphel, roi de Shinéar, d’Ariok, roi d’Ellasar, de Kedorlaomer, roi d’Élam, et de Tidéal, roi de Goyim[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « roi des nations ». Le mot hébreu goyim signifie habituellement « nations », mais il peut ici fonctionner comme un nom de lieu ou une désignation territoriale, à l’instar des autres désignations associées aux rois dans ce verset.'
    reason: Préserver l’ambiguïté lexicale entre le sens commun « nations » et l’emploi possible comme nom propre ou désignation territoriale.
lexical_decisions:
- source_word: וַיְהִי בִּימֵי
  choice: Voici ce qui arriva à l’époque de
  rationale: La formule ouvre le cadre narratif. Cette tournure restitue l’introduction hébraïque sans l’archaïsme « il advint aux jours de » et reste naturelle en français moderne.
- source_word: אַמְרָפֶל מֶלֶךְ שִׁנְעָר
  choice: Amraphel, roi de Shinéar
  rationale: Le nom personnel et le toponyme sont translittérés selon des formes françaises claires; la relation construite est rendue directement par « roi de ».
- source_word: אַרְיוֹךְ מֶלֶךְ אֶלָּסָר
  choice: Ariok, roi d’Ellasar
  rationale: Translittération française du nom personnel et du lieu, avec restitution directe du titre royal.
- source_word: כְּדָרְלָעֹמֶר מֶלֶךְ עֵילָם
  choice: Kedorlaomer, roi d’Élam
  rationale: « Kedorlaomer » suit de près les consonnes hébraïques et demeure identifiable; « Élam » est la forme française usuelle du toponyme.
- source_word: וְתִדְעָל מֶלֶךְ גּוֹיִם
  choice: et Tideal, roi de Goyim
  rationale: Dans la série parallèle des titres royaux, גּוֹיִם peut fonctionner comme une désignation géographique ou ethnique. La translittération « Goyim » préserve cette possibilité, tandis que le sens lexical courant est signalé en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La ponctuation finale indique que la phrase se poursuit au verset suivant. Les noms propres sont translittérés dans des formes françaises lisibles, sans imposer une identification historique incertaine.
