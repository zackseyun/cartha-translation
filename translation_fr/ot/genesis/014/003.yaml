  yaml_path: translation/ot/genesis/014/003.yaml
  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: fr
  text: Tous ceux-là se rassemblèrent dans la vallée de Siddim, c’est-à-dire la mer Salée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Appelée plus tard la mer Morte.
    reason: Indique le nom ultérieur et aujourd’hui familier du lieu sans le substituer au nom hébreu dans le texte.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: L’expression collective est rendue sans ajouter « rois », nom fourni par le contexte mais absent de l’hébreu.
- source_word: חָבְרוּ
  choice: se rassemblèrent
  rationale: Le qal de חבר exprime ici le fait de se joindre ou de se réunir. « Se rassemblèrent » convient au contexte tout en évitant de préciser qu’ils conclurent une alliance.
- source_word: אֶל
  choice: dans
  rationale: Avec un verbe de rassemblement et un lieu, « dans » exprime naturellement en français l’endroit où ils se réunirent.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: la vallée de Siddim
  rationale: עֵמֶק désigne une vallée, et le nom de lieu שִׂדִּים est translittéré sous la forme usuelle « Siddim ».
- source_word: הוּא
  choice: c’est-à-dire
  rationale: Le pronom introduit une identification explicative du lieu sous un autre nom.
- source_word: יָם הַמֶּלַח
  choice: la mer Salée
  rationale: Cette formulation traduit directement le nom hébreu tout en restant idiomatique en français; le nom moderne « mer Morte » est indiqué en note.
