  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ סְדֹ֖ם אֶל אַבְרָ֑ם תֶּן לִ֣/י הַ/נֶּ֔פֶשׁ וְ/הָ/רְכֻ֖שׁ קַֽח לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: fr
  text: 'Alors le roi de Sodome dit à Abram : « Donne-moi les personnes[a], et prends les biens pour toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la personne » ou « l’être vivant » (au singulier), expression employée ici collectivement pour désigner les personnes récupérées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » en restitue naturellement la succession en français moderne.
- source_word: מֶלֶךְ סְדֹם
  choice: le roi de Sodome
  rationale: La chaîne construite est rendue directement, avec la forme française traditionnelle du nom de lieu.
- source_word: אֶל אַבְרָם
  choice: à Abram
  rationale: La préposition אֶל introduit ici le destinataire de la parole ; « Abram » est la forme française usuelle.
- source_word: תֶּן לִי
  choice: Donne-moi
  rationale: L’impératif accompagné du pronom de première personne se rend idiomatiquement ainsi.
- source_word: הַנֶּפֶשׁ
  choice: les personnes
  rationale: Le singulier נֶפֶשׁ est employé collectivement pour les êtres humains récupérés. « Les personnes » préserve plus nettement que « les gens » le contraste avec les biens.
- source_word: וְהָרְכֻשׁ
  choice: et ... les biens
  rationale: רְכוּשׁ désigne les biens matériels ou possessions ; « les biens » est naturel et précis dans ce contexte.
- source_word: קַח לָךְ
  choice: prends ... pour toi
  rationale: Le לָךְ exprime le bénéfice ou l’appropriation personnelle ; « pour toi » conserve cette nuance sans ajouter de pronom objet absent de l’hébreu.
