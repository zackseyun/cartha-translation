  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: fr
  text: et les Horites dans leur région montagneuse de Séir, jusqu’à El-Parân[a], qui est près du désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « El Parân » ; si le nom est compris d’après son étymologie plutôt que comme un nom de lieu figé, il pourrait signifier « le chêne de Parân » ou « le térébinthe de Parân ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: ainsi que
  rationale: La conjonction et le marqueur d’objet poursuivent la liste des peuples frappés au verset précédent. « Ainsi que » rattache naturellement ce complément à la phrase précédente sans répéter le verbe sous-entendu.
- source_word: הַחֹרִי
  choice: les Horites
  rationale: Le terme désigne collectivement le peuple connu sous le nom de Horites ; la translittération traditionnelle est claire et naturelle en français biblique moderne.
- source_word: בְּהַרְרָם
  choice: dans leurs montagnes
  rationale: Cette formulation conserve le pluriel et le suffixe possessif du texte hébreu, tout en restant idiomatique en français.
- source_word: שֵׂעִיר
  choice: à Séir
  rationale: Séir est un nom de lieu. La préposition « à » présente naturellement le territoire où se trouvent leurs montagnes, sans imposer une relation génitivale plus précise que l’hébreu.
- source_word: עַד
  choice: jusqu’à
  rationale: Le mot marque ici la limite géographique atteinte par la campagne.
- source_word: אֵיל פָּארָן
  choice: El-Parân
  rationale: La translittération traite l’expression comme un toponyme et évite de trancher dans le texte principal entre un nom propre figé et son éventuel sens étymologique lié à un grand arbre.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: qui se trouve au bord du désert
  rationale: Dans ce contexte géographique, « au bord du désert » exprime clairement la proximité ou la limite suggérée par עַל, sans donner à entendre que le lieu est au milieu du désert.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le verset demeure syntaxiquement lié au précédent, comme dans l’hébreu. Les accents de « Séir » et « Parân » facilitent la prononciation française ; le trait d’union d’« El-Parân » présente l’ensemble comme un toponyme composé.
