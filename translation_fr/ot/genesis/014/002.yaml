  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: fr
  text: Ils firent la guerre à Béra, roi de Sodome, à Birscha, roi de Gomorrhe, à Schineab, roi d’Adma, à Schémeéber, roi de Tseboïm, et au roi de Béla (c’est-à-dire Tsoar).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: Ils firent la guerre
  rationale: Cette formulation française naturelle conserve de près l’idiome hébreu, qui associe le verbe « faire » au nom « guerre ».
- source_word: אֶת ... וְאֶת
  choice: à
  rationale: Dans la construction française « faire la guerre à », la préposition « à » désigne naturellement les adversaires. Elle régit ici l’ensemble des cinq membres de la liste.
- source_word: בֶּרַע
  choice: Béra
  rationale: Translittération française du nom propre, avec accent indiquant la prononciation usuelle.
- source_word: מֶלֶךְ סְדֹם
  choice: roi de Sodome
  rationale: Le groupe construit hébreu est rendu directement par le titre suivi du nom de lieu français consacré.
- source_word: בִּרְשַׁע
  choice: Birsha
  rationale: Translittération française transparente du nom propre.
- source_word: עֲמֹרָה
  choice: Gomorrhe
  rationale: Forme française consacrée du nom de lieu biblique.
- source_word: שִׁנְאָב
  choice: Shineab
  rationale: Translittération française lisible du nom propre, sans tenter d’en traduire une étymologie incertaine.
- source_word: אַדְמָה
  choice: Adma
  rationale: Forme française courante du nom de lieu biblique.
- source_word: שֶׁמְאֵבֶר
  choice: Sheméber
  rationale: Translittération française lisible qui représente les éléments principaux de la forme hébraïque.
- source_word: צביים
  choice: Tseboïm
  rationale: Translittération adaptée au français, où « ts » représente naturellement le son initial et le tréma distingue les voyelles finales.
- source_word: מֶלֶךְ בֶּלַע
  choice: le roi de Béla
  rationale: Le texte ne donne pas le nom personnel de ce roi, mais seulement son titre et sa ville; cette distinction est conservée.
- source_word: הִיא צֹעַר
  choice: c’est-à-dire Tsoar
  rationale: Le pronom suivi du nom de lieu identifie Béla à Tsoar; « c’est-à-dire » restitue clairement cette valeur explicative.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La répétition de « à » devant chaque adversaire clarifie que les cinq rois sont tous les objets de l’action, sans alourdir excessivement l’énumération. Les noms suivent des formes françaises ou des translittérations adaptées à la lecture francophone.
