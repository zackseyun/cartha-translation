revisions:
- from: Quand Abram apprit que son frère avait été emmené captif[a], il mobilisa ses hommes entraînés, nés dans sa maison, au nombre de trois cent dix-huit[b], et poursuivit les ravisseurs jusqu’à Dan.
  to: Quand Abram apprit que son frère avait été fait prisonnier[a], il mobilisa ses hommes entraînés, nés dans sa maisonnée, au nombre de trois cent dix-huit[b], et se lança à leur poursuite jusqu’à Dan.
  rationale: La révision remplace une expression française maladroite par « avait été fait prisonnier », rend ביתו par « sa maisonnée », et évite l’ajout interprétatif de « les ravisseurs » en conservant l’antécédent contextuel par « leur ». Les deux notes restent correctement ancrées et reflètent les ambiguïtés lexicales pertinentes.
