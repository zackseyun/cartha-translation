  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: fr
  text: Quand Abram apprit que son frère avait été fait prisonnier[a], il mobilisa ses hommes entraînés, nés dans sa maisonnée, au nombre de trois cent dix-huit[b], et se lança à leur poursuite jusqu’à Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « son frère » ; le mot peut aussi désigner un proche parent masculin, comme ici un neveu.
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « mobilisa » peut aussi être compris comme « fit sortir », « mena dehors » ou, peut-être, « arma ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: avait été emmené captif
  rationale: Le nifal de שׁבה désigne le fait d’être fait captif, notamment dans un contexte de guerre. Cette formulation conserve clairement la dimension militaire.
- source_word: אָחִיו
  choice: son frère
  rationale: Le texte hébreu dit littéralement « son frère ». אָח peut aussi désigner un proche parent masculin, ici Lot, neveu d’Abram; cette extension de sens est signalée en note plutôt qu’intégrée silencieusement au texte.
- source_word: וַיָּרֶק
  choice: il mobilisa
  rationale: Le verbe est difficile et peut évoquer le fait de faire sortir, de rassembler ou éventuellement d’armer des hommes. « Mobilisa » convient au contexte militaire sans trancher excessivement entre ces nuances.
- source_word: חֲנִיכָיו
  choice: ses hommes entraînés
  rationale: Le terme désigne des hommes formés ou initiés placés sous l’autorité d’Abram. Cette traduction est naturelle et adaptée à l’action militaire.
- source_word: יְלִידֵי בֵיתוֹ
  choice: nés dans sa maison
  rationale: L’expression désigne des membres de la maisonnée nés chez Abram. « Dans sa maison » reste proche de l’image hébraïque tout en étant intelligible en français moderne.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: au nombre de trois cent dix-huit
  rationale: La tournure française précise naturellement que le nombre se rapporte aux hommes mobilisés; « cent » demeure invariable puisqu’il est suivi d’un autre nombre.
- source_word: וַיִּרְדֹּף
  choice: poursuivit les ravisseurs
  rationale: רדף exprime ici une poursuite militaire. L’objet, implicite en hébreu, est explicité par « les ravisseurs » afin d’éviter en français une ambiguïté sur les personnes poursuivies.
- source_word: עַד דָּן
  choice: jusqu’à Dan
  rationale: עַד marque la limite atteinte par la poursuite; « jusqu’à Dan » l’exprime directement.
theological_decisions:
- issue: Terme de parenté appliqué à Lot
  choice: Conserver « son frère » dans le texte principal
  alternative: son parent / son proche parent
  rationale: Même si Lot est le neveu d’Abram, l’hébreu emploie אָחִיו. Garder « son frère » préserve la formulation et la souplesse sémantique du texte source; une note explique l’usage élargi du terme.
- issue: Nuance du verbe וַיָּרֶק
  choice: mobilisa
  alternative: fit sortir / mena dehors / arma
  rationale: Le sens exact du verbe est discuté. « Mobilisa » rend la préparation et le déploiement des hommes dans ce contexte sans imposer la seule idée de les armer ou de les faire sortir.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant le terme de parenté littéral et l’incertitude lexicale du verbe militaire. Les marqueurs [a] et [b] figurent dans le texte principal.
