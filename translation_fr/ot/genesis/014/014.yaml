  source_fidelity: Le texte conserve correctement « son frère » pour אָחִיו, avec une note qui rend compte de son emploi étendu pour un proche parent. « Mobilisa » constitue une solution prudente pour le verbe difficile וַיָּרֶק. En revanche, « les ravisseurs » explicite plus que ne le fait l’hébreu l’objet implicite de la poursuite.
  naturalness: « Avait été emmené captif » est compréhensible, mais peu idiomatique en français international moderne. « Avait été fait prisonnier » est plus naturel et conserve le sens de captivité dans un contexte guerrier. La formulation révisée évite également de qualifier explicitement les poursuivis de « ravisseurs ».
  terminology: « Frère », « hommes entraînés », « nés dans sa maisonnée », « mobilisa » et « Dan » conviennent au registre narratif et à la fidélité lexicale. « Maisonnée » rend plus précisément ביתו dans ce contexte social que « maison » au sens du bâtiment.
