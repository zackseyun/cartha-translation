  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: fr
  text: Pendant la nuit, lui et ses serviteurs se répartirent pour les attaquer. Il les frappa, puis les poursuivit jusqu’à Hoba, au nord de Damas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: se répartirent pour les attaquer
  rationale: La tournure hébraïque exprime une division tactique dirigée contre l’ennemi. « Se répartirent » conserve l’idée de division, tandis que « pour les attaquer » rend naturellement la valeur hostile de עֲלֵיהֶם.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Le terme עֶבֶד peut désigner des serviteurs ou des esclaves. Dans ce contexte de maisonnée armée, « serviteurs » reste naturel sans préciser davantage leur statut.
- source_word: וַיַּכֵּם
  choice: Il les frappa
  rationale: « Frapper » conserve la formulation concise et la portée potentiellement large du verbe נכה, sans expliciter qu’ils furent tous tués.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: au nord de Damas
  rationale: Littéralement « à la gauche de Damas »; dans l’orientation sémitique tournée vers l’est, la gauche correspond au nord. La formulation géographique explicite est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La phrase est scindée après l’attaque afin d’éviter une accumulation lourde, tout en conservant la succession des actions et le singulier du sujet dans « Il les frappa ».
