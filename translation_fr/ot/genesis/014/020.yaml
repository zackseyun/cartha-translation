  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: fr
  text: Et béni soit le Dieu Très-Haut, qui a livré tes ennemis entre tes mains ! Et il lui donna le dixième de tout.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu ne répète pas le sujet du verbe « donna ». Le contexte indique très probablement qu’Abram donna à Melchisédek le dixième de tout ; Melchisédek peut aussi être compris comme sujet. On peut aussi traduire « une dîme de tout ».
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Béni soit
  rationale: La formule participiale de bénédiction est rendue par une tournure française naturelle et solennelle. La coordination hébraïque est intégrée au déroulement de la bénédiction plutôt que traduite mécaniquement.
- source_word: אֵל עֶלְיוֹן
  choice: le Dieu Très-Haut
  rationale: אֵל est compris comme la désignation de Dieu et עֶלְיוֹן comme l'épithète « Très-Haut » ; l'article donne en français une formulation naturelle du titre.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le relatif introduit une proposition décrivant le Dieu Très-Haut.
- source_word: מִגֵּן
  choice: a livré
  rationale: Le verbe signifie ici « livrer, remettre », dans un contexte militaire, et non « protéger ».
- source_word: צָרֶיךָ
  choice: tes ennemis
  rationale: Traduction claire et actuelle du pluriel désignant les adversaires hostiles d'Abram.
- source_word: בְּיָדֶךָ
  choice: entre tes mains
  rationale: Cette expression française conserve l'image concrète de l'idiome hébreu tout en communiquant l'idée de mise au pouvoir d'Abram.
- source_word: וַיִּתֶּן
  choice: Et il donna
  rationale: Le passé simple convient au récit écrit et préserve la succession narrative sans nommer un sujet que l'hébreu laisse implicite.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom indirect renvoie le plus naturellement à Melchisédek, sans expliciter son nom dans le corps du texte.
- source_word: מַעֲשֵׂר
  choice: le dixième
  rationale: Rend directement la proportion exprimée par l'hébreu et évite les connotations institutionnelles ultérieures que peut porter « dîme ».
- source_word: מִכֹּל
  choice: de tout
  rationale: Formulation française concise qui exprime que le dixième fut prélevé sur l'ensemble concerné.
theological_decisions:
- issue: Sujet implicite de וַיִּתֶּן (« il donna »)
  choice: Conserver le pronom « il » dans le texte, avec Abram comme référent contextuel le plus naturel.
  alternative: Comprendre Melchisédek comme sujet du verbe.
  rationale: L'hébreu ne répète pas le sujet. Le contexte favorise Abram donnant à Melchisédek, mais la traduction n'insère pas son nom et la note signale l'ambiguïté grammaticale authentique.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. L'exclamation clôt naturellement la bénédiction ; l'ambiguïté du sujet de « donna » est préservée dans le texte et expliquée en note.
