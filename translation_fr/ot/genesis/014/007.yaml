  source_fidelity: 'Le sens du verset est fidèlement rendu : le retour, l’arrivée à la source/lieu identifié à Qadesh, l’action militaire sans surinterprétation, l’étendue géographique associée aux Amalécites et l’ajout des Amorites résidant à Hatsatsôn-Tamar sont conservés. La translittération « En-Mishpath » doit toutefois être corrigée : le nom hébreu עֵין מִשְׁפָּט se termine par ט (t), non par une consonne justifiant « th ».'
  naturalness: Le français est naturel, sobre et adapté au récit. Le maintien de la coordination en une seule phrase rend mieux la progression narrative du wayyiqtol que la coupure après la parenthèse.
  terminology: « Qadesh », « Amalécites », « Amorites » et « Hatsatsôn-Tamar » sont cohérents avec un français biblique moderne. « Territoire » est une bonne solution contextuelle pour שָׂדֶה; la note conserve à juste titre l’alternative littérale « champ ».
