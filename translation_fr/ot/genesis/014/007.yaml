    rationale: « En-Mishpath » introduit un h final sans appui dans le texte hébreu. « En-Mishpat » reflète correctement la consonne finale ט et est plus cohérent avec une translittération française lisible.
  - severity: low
    issue: Coupure de la phrase après la parenthèse
    rationale: Elle n’altère pas le sens, mais une virgule conserve plus directement l’enchaînement narratif « ils revinrent, arrivèrent ... et frappèrent ».
