  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: fr
  text: Puis ils rebroussèrent chemin et arrivèrent à En-Mishpat (c’est-à-dire Qadesh), et frappèrent tout le territoire des Amalécites[b], ainsi que les Amorites qui habitaient à Hatsatsôn-Tamar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « tout le champ des Amalécites ». L’hébreu dit littéralement « tout le champ de l’Amalécite », expression qui désigne probablement la région occupée par les Amalécites.
    reason: lexical_alternative
  - marker: c
    text: Hatsatsôn-Tamar est identifié à En-Guédi en 2 Chroniques 20.2.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Puis ils rebroussèrent chemin
  rationale: Le wayyiqtol marque la progression du récit, tandis que שוב exprime ici un retour avec changement de direction. « Rebrousser chemin » est naturel et précis en français.
- source_word: וַיָּבֹאוּ אֶל
  choice: et arrivèrent à
  rationale: בוא suivi de אֶל indique le déplacement jusqu’au lieu nommé. « Arrivèrent à » s’enchaîne naturellement après « rebroussèrent chemin ».
- source_word: עֵין מִשְׁפָּט
  choice: En-Mishpath
  rationale: Le syntagme fonctionne comme un nom de lieu. Il est donc translittéré plutôt que traduit dans le corps du verset; sa signification est donnée en note.
- source_word: הִוא קָדֵשׁ
  choice: (c’est-à-dire Qadesh)
  rationale: Le pronom suivi du nom propre identifie En-Mishpath à Qadesh. La parenthèse restitue clairement la valeur explicative de l’hébreu.
- source_word: וַיַּכּוּ
  choice: Ils frappèrent
  rationale: נכה signifie ici porter un coup militaire ou attaquer. « Frappèrent » reste proche du texte sans préciser indûment qu’il s’agit d’une défaite totale.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: tout le territoire des Amalécites
  rationale: שׂדה signifie littéralement « champ », mais désigne vraisemblablement ici la région occupée par les Amalécites. Le gentilé hébreu singulier a une valeur collective.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: ainsi que les Amorites
  rationale: « Ainsi que » rend l’ajout marqué par וְגַם. Le gentilé singulier est collectif et se traduit naturellement au pluriel en français.
- source_word: הַיֹּשֵׁב בְּחַצְצֹן תָּמָר
  choice: qui habitaient à Hatsatsôn-Tamar
  rationale: Le participe ישׁב décrit les Amorites comme résidents du lieu. L’imparfait « habitaient » exprime cet état continu dans le cadre du récit.
