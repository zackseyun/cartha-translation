  to: Puis ils rebroussèrent chemin et arrivèrent à En-Mishpat (c’est-à-dire Qadesh), et frappèrent tout le territoire des Amalécites[b], ainsi que les Amorites qui habitaient à Hatsatsôn-Tamar[c].
  rationale: Correction sûre de la translittération En-Mishpath en En-Mishpat et restauration de la continuité syntaxique narrative. Les notes sont conservées; la note a demeure informative, bien qu’aucun appel de note ne soit nécessaire dans le texte puisque le sens du toponyme n’est pas requis pour comprendre le verset.
