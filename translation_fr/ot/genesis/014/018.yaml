id: GEN.14.18
reference: Genesis 14:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: fr
  text: Melkisédek, roi de Salem, apporta[a] du pain et du vin. Il était prêtre du Dieu Très-Haut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sortit »; littéralement : « fit sortir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « El Elyon », c’est-à-dire « Dieu Très-Haut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: Melkisédek
  rationale: Translittération française traditionnelle du nom propre, sans en introduire dans le texte le sens étymologique possible (« mon roi est justice » ou « roi de justice »).
- source_word: מֶלֶךְ שָׁלֵם
  choice: roi de Salem
  rationale: Rend directement le titre royal et conserve la forme française établie du nom de lieu.
- source_word: הוֹצִיא
  choice: apporta
  rationale: Le hiphil de יצא exprime ici l’action de faire sortir ou d’apporter. « Apporta » est naturel en français moderne tout en conservant l’action concrète; la nuance causative possible est signalée en note.
- source_word: לֶחֶם וָיָיִן
  choice: du pain et du vin
  rationale: Traduction directe et idiomatique des deux denrées mentionnées, sans développer d’association sacramentelle ultérieure.
- source_word: כֹהֵן
  choice: prêtre
  rationale: Terme français usuel pour un officiant cultuel, sans projeter sur le récit les structures sacerdotales israélites postérieures.
- source_word: אֵל עֶלְיוֹן
  choice: Dieu Très-Haut
  rationale: Traduit la désignation divine plutôt que de la laisser sous la forme sémitique opaque « El Elyon »; « Très-Haut » conserve la force du titre.
- source_word: וְהוּא
  choice: Il était
  rationale: L’ouverture d’une nouvelle phrase met naturellement en relief l’identité de Melkisédek; le verbe copule est ajouté conformément à la syntaxe française.
theological_decisions:
- issue: Éventuelles associations sacramentelles du pain et du vin
  choice: Conserver la simple indication narrative « apporta du pain et du vin »
  alternative: Employer une formulation évoquant explicitement une préfiguration eucharistique
  rationale: Le verset rapporte seulement l’action de Melkisédek et son statut de prêtre. La traduction ne doit pas intégrer au texte une interprétation doctrinale ultérieure.
- issue: Statut de אֵל עֶלְיוֹן comme nom propre ou titre divin
  choice: Traduire par « Dieu Très-Haut »
  alternative: Translittérer « El Elyon » ou traduire « Dieu, le Très-Haut »
  rationale: La traduction du titre rend son sens immédiatement accessible, tandis que la note conserve la forme hébraïque pour le lecteur.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation en deux phrases rend naturellement le changement de proposition hébraïque. Les noms propres suivent les formes françaises bibliques courantes.
