base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: fr
  text: Un rescapé vint informer Abram l’Hébreu. Abram habitait alors près des chênes de Mamré[a], l’Amorite, frère d’Eshkol et frère d’Aner[b]. Ceux-ci étaient les alliés d’Abram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près des térébinthes de Mamré ». Le terme hébreu désigne de grands arbres, souvent identifiés comme des chênes ou des térébinthes.
    reason: lexical_alternative
  - marker: b
    text: Ou « parent d’Eshkol et parent d’Aner ». Le mot hébreu traduit par « frère » peut aussi désigner un lien de parenté plus large.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « détenteurs d’une alliance » avec Abram, c’est-à-dire des hommes liés à lui par un pacte.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: un rescapé
  rationale: Le nom désigne quelqu’un qui a échappé au combat ou au danger. « Rescapé » exprime naturellement en français à la fois la survie et l’évasion, sans suggérer nécessairement une fuite hors la loi comme pourrait le faire « fugitif ».
- source_word: וַיַּגֵּד
  choice: vint annoncer la nouvelle
  rationale: Le verbe signifie annoncer, raconter ou rapporter. Dans ce contexte narratif, « annoncer la nouvelle » rend clairement l’idée d’un rapport concernant les événements précédents.
- source_word: הָעִבְרִי
  choice: l’Hébreu
  rationale: Il s’agit de la désignation ethnique ou sociale traditionnelle appliquée ici à Abram; la traduction directe conserve cette identification.
- source_word: שֹׁכֵן
  choice: habitait alors
  rationale: Le participe décrit la résidence d’Abram au moment des faits. L’imparfait français restitue naturellement cet aspect duratif, et « alors » explicite sobrement la simultanéité narrative.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: près des chênes de Mamré
  rationale: אֵלֹנֵי désigne de grands arbres et peut être compris comme des chênes ou des térébinthes. « Chênes » est courant et intelligible; l’autre identification est conservée en note.
- source_word: הָאֱמֹרִי
  choice: l’Amorite
  rationale: La désignation ethnique qualifie Mamré et est rendue directement.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: frère d’Eshkol et frère d’Aner
  rationale: La répétition de « frère » suit la structure hébraïque et laisse entendre le lien de Mamré avec chacun. Le sens plus large de parenté reste possible et figure en note.
- source_word: בַּעֲלֵי בְרִית
  choice: les alliés
  rationale: L’expression signifie littéralement « détenteurs/maîtres d’une alliance » et désigne ici des hommes liés à Abram par un pacte. « Alliés » en transmet clairement la portée relationnelle et politique en français actuel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « frère… frère… » conserve la forme du texte hébreu; « Abram » remplace le pronom hébreu dans la deuxième phrase afin d’éviter en français une ambiguïté artificielle sur son antécédent.
