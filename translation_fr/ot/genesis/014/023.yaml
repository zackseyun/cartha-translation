    text: 'L’hébreu emploie une formule de serment elliptique, littéralement : « si, d’un fil jusqu’à une lanière de sandale, et si je prends quoi que ce soit de ce qui est à toi… » Le sens est celui d’un refus juré.'
    reason: La note signale la formule de serment elliptique et explique la négation explicitée en français; elle préserve aussi l’expression d’étendue « d’un fil jusqu’à une lanière de sandale ».
  revision_rationale: La révision restitue l’étendue exprimée par מן ... ועד, améliore le terme français pour l’attache de sandale et harmonise la note avec le texte. Le sens du serment, le refus absolu et le motif du refus restent inchangés.
