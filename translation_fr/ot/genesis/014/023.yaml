  to: 'Je ne prendrai rien de ce qui t’appartient, pas même d’un fil jusqu’à une lanière de sandale, afin que tu ne dises pas : « C’est moi qui ai enrichi Abram. »'
  rationale: La révision restitue l’étendue exprimée par מן ... ועד, améliore le terme français pour l’attache de sandale et harmonise la note avec le texte. Le sens du serment, le refus absolu et le motif du refus restent inchangés.
