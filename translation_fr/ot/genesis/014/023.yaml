source:
  edition: WLC
  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: fr
  text: 'Je ne prendrai rien de ce qui t’appartient, pas même d’un fil jusqu’à une lanière de sandale, afin que tu ne dises pas : « C’est moi qui ai enrichi Abram. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: je ne prendrai pas… ni
  rationale: Dans le contexte du serment commencé au verset 22, אִם introduit une formule de serment elliptique exprimant ici un refus catégorique. Le français explicite naturellement la négation sous-entendue.
- source_word: מִחוּט
  choice: pas même un fil
  rationale: חוּט désigne un fil ou une ficelle. « Pas même » fait ressortir la valeur minimale de cet objet dans le refus solennel.
- source_word: וְעַד שְׂרֹוךְ נַעַל
  choice: ou une courroie de sandale
  rationale: שְׂרוֹךְ נַעַל désigne la lanière qui attache une sandale. « Courroie de sandale » est clair, actuel et adapté au contexte ancien.
- source_word: אֶקַּח
  choice: je ne prendrai
  rationale: Le verbe est intégré à la formule de serment elliptique ; le futur français exprime naturellement l’engagement ferme d’Abram.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: quoi que ce soit qui t’appartienne
  rationale: Cette formulation française conserve la portée exhaustive de כָּל et la relation de possession exprimée par לָךְ.
- source_word: וְלֹא תֹאמַר
  choice: pour que tu ne dises pas
  rationale: La proposition indique le but du refus d’Abram, sans ajouter l’idée de capacité qu’introduirait « pour que tu ne puisses pas dire ».
- source_word: הֶעֱשַׁרְתִּי
  choice: j’ai enrichi
  rationale: Le hiphil de עשר signifie « rendre riche, enrichir ». La tournure clivée « C’est moi qui ai enrichi » rend naturellement l’insistance implicite du pronom אֲנִי.
- source_word: אַבְרָם
  choice: Abram
  rationale: Le nom propre est conservé sous sa forme française conventionnelle.
theological_decisions:
- issue: Formule de serment elliptique
  choice: 'Expliciter le sens comme un refus juré : « je ne prendrai pas »'
  alternative: 'Reproduire littéralement la condition : « si [je prends] depuis un fil… et si je prends… »'
  rationale: En lien avec le geste et le serment du verset 22, la construction avec אִם est une formule imprécatoire elliptique. Une condition littérale serait obscure en français et masquerait le refus solennel, tandis que l’explicitation n’en résout pas abusivement le contenu théologique.
- issue: Motif du refus d’Abram
  choice: « pour que tu ne dises pas »
  alternative: « et tu ne diras pas » ou « de peur que tu ne dises »
  rationale: La construction négative présente le propos potentiel du roi comme ce qu’Abram veut empêcher. La traduction retient cette relation de but sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase s’enchaîne au serment commencé au verset précédent. « Courroie de sandale » garde la couleur concrète du texte ancien, tandis que « pas même » communique clairement l’idée du plus petit objet refusé.
