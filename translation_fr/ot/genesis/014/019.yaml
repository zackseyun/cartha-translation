  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: fr
  text: 'Il le bénit et dit : « Béni soit Abram par le Dieu Très-Haut, maître[a] du ciel et de la terre[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « créateur ». Le participe hébreu peut signifier « possesseur », « propriétaire » ou, dans ce contexte, « créateur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des cieux et de la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: Il le bénit
  rationale: Le wayyiqtol avec suffixe objet de troisième personne masculine du singulier exprime l’action narrative suivante; cette formulation française est directe et naturelle.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: La coordination conserve l’enchaînement narratif explicite de l’hébreu sans transformer le verbe en simple participe.
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Cette formule française rend la force solennelle et bénédictive du participe passif employé comme prédicat.
- source_word: אַבְרָם
  choice: Abram
  rationale: Le nom est conservé sous sa forme à ce stade du récit, avant son changement en Abraham.
- source_word: לְאֵל
  choice: par le Dieu
  rationale: Dans cette formule de bénédiction, la préposition לְ peut indiquer celui dont vient la bénédiction; « par » exprime clairement cette relation en français.
- source_word: אֵל עֶלְיוֹן
  choice: le Dieu Très-Haut
  rationale: Cette tournure naturelle en français conserve le titre divin formé de אֵל et עֶלְיוֹן.
- source_word: קֹנֵה
  choice: maître
  rationale: Le participe de קנה peut évoquer la possession, la propriété ou, dans ce contexte, la création. « Maître » exprime naturellement la souveraine possession en français, tandis que « créateur » est conservé en note afin de ne pas supprimer l’ambiguïté.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: du ciel et de la terre
  rationale: Cette expression française consacrée rend le mérisme désignant l’ensemble du monde créé; la forme plus littérale au pluriel est signalée en note.
theological_decisions:
- issue: Sens de קֹנֵה dans le titre divin
  choice: maître du ciel et de la terre
  alternative: créateur du ciel et de la terre
  rationale: קנה peut signifier posséder ou acquérir et, dans certains contextes, créer. Le texte principal garde l’idée de possession souveraine dans une formulation française naturelle, tandis que la note préserve explicitement l’interprétation créatrice possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe coordonnée suit la narration hébraïque, et la parole de bénédiction garde une tonalité solennelle sans archaïsme excessif.
