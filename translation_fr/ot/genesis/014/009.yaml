source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: fr
  text: 'Kedorlaomer, roi d’Élam, Tidal, roi de Goïm[a], Amraphel, roi de Shinéar, et Ariok, roi d’Ellasar : quatre rois contre les cinq.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Tidal, roi des nations ». Le mot hébreu גּוֹיִם peut désigner les « nations », mais il peut aussi être ici un nom de lieu : « Goïm ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: contre
  rationale: Dans cette liste de combattants, la construction marque idiomatiquement l’opposition entre les deux groupes de rois ; « contre » l’exprime naturellement en français.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Translittération française du nom propre, sans le traduire.
- source_word: מֶלֶךְ עֵילָם
  choice: roi d’Élam
  rationale: Rendu direct de la chaîne construite hébraïque.
- source_word: תִדְעָל
  choice: Tidal
  rationale: Translittération usuelle et lisible du nom propre.
- source_word: גּוֹיִם
  choice: Goïm
  rationale: Le contexte d’un titre royal permet de comprendre le terme comme un nom de lieu ; la translittération conserve cette possibilité sans l’identifier davantage.
- source_word: אַמְרָפֶל
  choice: Amraphel
  rationale: Translittération française traditionnelle du nom propre.
- source_word: שִׁנְעָר
  choice: Shinéar
  rationale: Le toponyme hébreu est conservé plutôt que remplacé par une identification historique telle que la Babylonie.
- source_word: אַרְיוֹךְ
  choice: Ariok
  rationale: Translittération adaptée aux conventions phonographiques françaises.
- source_word: אֶלָּסָר
  choice: Ellasar
  rationale: Le nom de lieu est translittéré sans identification géographique conjecturale.
- source_word: אַרְבָּעָה מְלָכִים
  choice: quatre rois
  rationale: Traduction directe du groupe formé par le numéral et le nom.
- source_word: הַחֲמִשָּׁה
  choice: les cinq
  rationale: L’hébreu dit littéralement « les cinq » ; le mot « rois » reste clairement sous-entendu en français.
