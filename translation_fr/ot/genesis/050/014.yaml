  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: fr
  text: Puis Joseph retourna en Égypte, lui, ses frères et tous ceux qui étaient montés avec lui pour enterrer son père, après qu’il eut enterré son père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: retourna
  rationale: Le verbe שׁוב décrit le retour de Joseph au lieu d’où il était parti; le passé simple convient au récit suivi en français.
- source_word: מִצְרַיְמָה
  choice: en Égypte
  rationale: Le ה directionnel indique un mouvement vers l’Égypte; après «retourner», «en Égypte» est la tournure française naturelle.
- source_word: הוּא וְאֶחָיו
  choice: lui, ses frères
  rationale: Le pronom הוּא reprend Joseph avec une valeur appositive et légèrement emphatique; «lui, ses frères» conserve cette structure sans lourdeur.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: et tous ceux qui étaient montés avec lui
  rationale: Le participe עֹלִים évoque le voyage antérieur d’Égypte en Canaan selon l’idiome biblique de la montée; le plus-que-parfait marque clairement l’antériorité.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: pour enterrer son père
  rationale: L’infinitif construit précédé de ל exprime ici le but du voyage.
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: après qu’il eut enterré son père
  rationale: אַחֲרֵי exprime la postériorité, et le sujet implicite de קָבְרוֹ renvoie naturellement à Joseph. Le passé antérieur situe l’ensevelissement avant le retour.
