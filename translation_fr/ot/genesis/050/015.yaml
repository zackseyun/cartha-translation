  rationale: Révision limitée de la seconde proposition afin d’obtenir un français moderne naturel tout en préservant la crainte hypothétique des frères, l’hostilité possible de Joseph et l’idée qu’il pourrait leur faire payer intégralement le mal commis contre lui.
