  text: וַ/יִּרְא֤וּ אֲחֵֽי יוֹסֵף֙ כִּי מֵ֣ת אֲבִי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ ל֥וּ יִשְׂטְמֵ֖/נוּ יוֹסֵ֑ף וְ/הָשֵׁ֤ב יָשִׁיב֙ לָ֔/נוּ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר גָּמַ֖לְנוּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: fr
  text: 'Quand les frères de Joseph virent que leur père était mort, ils se dirent : « Et si Joseph nous gardait rancune et nous faisait payer tout le mal que nous lui avons fait ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂטְמֵנוּ
  choice: nous gardait rancune
  rationale: Le verbe שׂטם exprime ici une hostilité persistante ou de la rancune. Cette formulation française est naturelle et convient mieux au contexte que le simple « nous haïssait ».
- source_word: הָשֵׁב יָשִׁיב
  choice: nous rendait pleinement
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie ou confirme l’action. « pleinement » restitue cette insistance sans alourdir la phrase.
- source_word: גָּמַלְנוּ אֹתוֹ
  choice: nous lui avons fait
  rationale: Dans ce contexte, גמל désigne le mal infligé à Joseph. « Faire du mal à quelqu’un » est l’expression française naturelle, tout en conservant l’idée de rétribution dans « rendre ».
theological_decisions:
- issue: La crainte des frères exprimée par לוּ
  choice: Et si Joseph… ?
  alternative: Peut-être Joseph…
  rationale: La particule introduit ici une éventualité redoutée. La question « Et si… ? » préserve la crainte et l’incertitude sans affirmer que Joseph nourrit effectivement de la rancune.
translation_notes:
  register: Français international moderne, narratif et digne. « Ils se dirent » rend naturellement une délibération entre les frères; le discours direct conserve leur inquiétude.
