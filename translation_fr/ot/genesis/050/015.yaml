review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : les frères constatent la mort de leur père et redoutent que Joseph leur garde une hostilité durable puis leur fasse subir en retour le mal qu’ils lui ont infligé. La tournure hypothétique « Et si » rend bien la particule לוּ et le futur redouté. Toutefois, « nous rendait pleinement tout le mal » est peu idiomatique en français et ne rend pas avec netteté l’idée de rétribution exprimée par l’infinitif absolu suivi du verbe (הָשֵׁב יָשִׁיב).'
  naturalness: 'Le registre narratif est bon et « ils se dirent » convient au contexte. « Garder rancune » est naturel. En revanche, « rendre pleinement tout le mal » est lourd et ambigu : en français, « faire payer tout le mal » exprime plus clairement la rétribution redoutée.'
  terminology: Aucun terme théologique ou nom propre ne pose problème. « Joseph » et « leur père » sont correctement rendus.
  issues:
  - severity: medium
    issue: « nous rendait pleinement tout le mal »
    rationale: Cette expression est maladroite en français moderne et peut suggérer qu’on leur restitue le mal comme un objet. « nous ferait payer tout le mal » rend naturellement la rétribution et conserve l’insistance de הָשֵׁב יָשִׁיב.
