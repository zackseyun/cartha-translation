  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: fr
  text: 'Mais Joseph leur dit : « N’ayez pas peur, car suis-je à la place de Dieu[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Suis-je sous Dieu ? » L’expression hébraïque est idiomatique ; ici, elle signifie très probablement : « Suis-je à la place de Dieu ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: leur dit
  rationale: La tournure narrative avec אמר et אֶל désigne naturellement l’acte de parler à ces destinataires; « leur dit » est idiomatique et concis en français.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אַל תִּירָאוּ
  choice: N’ayez pas peur
  rationale: La négation אַל avec ירא exprime ici une défense ou une exhortation rassurante adressée à plusieurs personnes. Cette formulation est plus naturelle en français moderne que « Ne craignez pas ».
- source_word: כִּי
  choice: '[non traduit séparément]'
  rationale: כִּי introduit la raison de l’exhortation. En français, l’enchaînement direct avec la question rhétorique exprime naturellement ce lien; traduire mécaniquement par « car » alourdirait la réplique.
- source_word: הֲתַחַת אֱלֹהִים אָֽנִי
  choice: Suis-je à la place de Dieu ?
  rationale: Dans ce contexte, תַּחַת אֱלֹהִים évoque le fait de prendre la place ou la prérogative de Dieu. La construction interrogative et l’emphase portée par אֲנִי sont conservées dans la question rhétorique.
theological_decisions:
- issue: Portée de la question rhétorique concernant la prérogative divine
  choice: Joseph nie être à la place de Dieu, notamment comme juge ou auteur de la rétribution.
  alternative: « Suis-je sous Dieu ? », lecture plus littérale de תַּחַת comme position de subordination.
  rationale: La crainte des frères face à d’éventuelles représailles et la suite du discours favorisent le sens idiomatique « à la place de Dieu ». La note conserve toutefois l’autre possibilité lexicale sans résoudre davantage la tension.
translation_notes:
  register: Français international moderne, naturel et digne. « N’ayez pas peur » privilégie la clarté courante; la question rhétorique reste brève et conserve la distinction entre le rôle de Joseph et celui de Dieu.
