  to: 'Lorsque les jours de deuil furent écoulés[a], Joseph parla aux membres de la maison de Pharaon en disant : « Si j’ai trouvé grâce à vos yeux, je vous en prie, veuillez parler à Pharaon[b] en ces termes : »'
