  source_fidelity: 'Le sens général est fidèle : la période de lamentation est achevée, Joseph s’adresse à l’entourage royal et demande qu’on transmette son message à Pharaon. Toutefois, « furent passés » est peu idiomatique en français actuel pour une durée écoulée, et la formulation peut mieux préserver les deux particules de requête נא.'
  naturalness: « Lorsque les jours de deuil furent écoulés » est plus naturel et soutenu sans être archaïque. « Les membres de la maison de Pharaon » identifie clairement les personnes de la cour. La phrase directe conserve le caractère indirect de l’accès de Joseph à Pharaon.
  terminology: « Deuil » convient au contexte funéraire, avec une note qui maintient « pleurs » et l’ambiguïté du suffixe. « Trouver grâce à vos yeux » est un idiome français établi. La majuscule à « Pharaon » traite le titre comme la désignation royale du personnage dans ce contexte biblique.
