  - severity: low
    issue: La première particule de requête נא n’est pas explicitement rendue.
    rationale: « Veuillez » restitue bien la requête associée à l’impératif, mais « je vous en prie » permet de conserver aussi la déférence de la première requête, sans surcharger le français.
  - severity: low
    issue: « aux gens de la maison du pharaon »
    rationale: La formulation est compréhensible, mais « aux membres de la maison de Pharaon » est plus fluide tout en désignant clairement l’entourage/cour royale plutôt qu’un édifice.
