  text: וַ/יַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔/וֹ וַ/יְדַבֵּ֣ר יוֹסֵ֔ף אֶל בֵּ֥ית פַּרְעֹ֖ה לֵ/אמֹ֑ר אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵ֣ינֵי/כֶ֔ם דַּבְּרוּ נָ֕א בְּ/אָזְנֵ֥י פַרְעֹ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: fr
  text: 'Lorsque les jours de deuil furent écoulés[a], Joseph parla aux membres de la maison de Pharaon en disant : « Si j’ai trouvé grâce à vos yeux, je vous en prie, veuillez parler à Pharaon[b] en ces termes : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les jours de ses pleurs » ; on peut aussi comprendre « les jours où l’on pleura pour lui ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « aux oreilles de Pharaon », expression qui signifie « de façon que Pharaon l’entende ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: furent passés
  rationale: Le verbe עבר décrit ici l’écoulement et l’achèvement d’une période. Le passé antérieur marque naturellement que le deuil s’achève avant la prise de parole de Joseph.
- source_word: יְמֵי בְכִיתוֹ
  choice: les jours de deuil
  rationale: בכי désigne littéralement les pleurs, mais, dans ce contexte funéraire, « deuil » exprime naturellement la période de lamentation. Une note conserve la formulation plus littérale et la valeur possible du suffixe.
- source_word: אֶל בֵּית פַּרְעֹה
  choice: aux gens de la maison du pharaon
  rationale: בית désigne ici l’entourage ou le personnel de la maison royale, et non simplement un bâtiment. Cette formulation garde l’image de la « maison » tout en rendant clair que Joseph s’adresse à des personnes.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: Si j’ai trouvé grâce à vos yeux
  rationale: Cette expression française conserve l’image de l’idiome hébreu et son ton respectueux. La nuance de supplication portée par נָא est rendue dans la demande suivante par « veuillez ».
- source_word: דַּבְּרוּ נָא
  choice: veuillez parler
  rationale: L’impératif pluriel accompagné de נָא exprime une requête polie. « Veuillez » en rend naturellement la déférence.
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: au pharaon
  rationale: L’expression littérale « aux oreilles du pharaon » signifie que les paroles doivent lui être communiquées. Le français courant exprime cet idiome par « parler au pharaon »; la métaphore hébraïque est signalée en note.
- source_word: לֵאמֹר
  choice: en ces termes
  rationale: 'Le second infinitif de citation introduit le message qui se poursuit au verset suivant. « En ces termes : » rend clairement cette fonction sans répétition pesante.'
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve l’idiome « trouver grâce aux yeux de » tout en explicitant que la « maison du pharaon » désigne les personnes de son entourage. Les deux marqueurs de note sont placés auprès des expressions qu’ils expliquent.
