    issue: Rendu de כַּיּוֹם הַזֶּה
    rationale: « Ce qui se réalise aujourd’hui » peut décrire ce qui est actuellement en train d’arriver, tandis que l’idiome vise le résultat ou la situation désormais manifeste « aujourd’hui ». Joint à « accomplir », il est en outre stylistiquement redondant.
  - severity: low
    issue: Rendu de עַם רָב
    rationale: « Un peuple nombreux » est possible, mais peut faire entendre un peuple unique au sens ethnique ou national. Dans ce contexte, « un grand nombre de personnes » conserve plus nettement l’idée de nombreuses vies préservées.
