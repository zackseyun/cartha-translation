  rationale: La révision conserve le plus-que-parfait et le parallélisme intentionnel de « projeter » dans les deux propositions, sans résoudre la tension entre l’action mauvaise des frères et le dessein bon de Dieu. Elle rend plus précisément la valeur déictique de כַּיּוֹם הַזֶּה et évite de restreindre עַם רָב à un seul peuple au sens ethnique.
