source:
  edition: WLC
  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: fr
  text: 'Vous aviez projeté de me faire du mal, mais Dieu avait projeté que cela serve au bien, afin de réaliser ce qui est aujourd’hui manifeste[a] : maintenir en vie un grand nombre de personnes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « comme en ce jour ». L’expression hébraïque désigne le résultat présent, désormais manifeste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: aviez projeté / avait projeté
  rationale: Le même verbe français est conservé dans les deux propositions afin de reproduire le parallélisme intentionnel de l’hébreu. « Projeter » exprime ici un dessein délibéré plutôt qu’une simple pensée.
- source_word: עָלַי רָעָה
  choice: de me faire du mal
  rationale: La préposition a ici une valeur hostile. Cette formulation française naturelle conserve la portée morale de רָעָה sans réduire la phrase à un simple malheur subi.
- source_word: לְטֹבָה
  choice: que cela serve au bien
  rationale: Cette tournure rend la destination positive exprimée par לְ et maintient le contraste net entre le mal voulu par les frères et le bien visé par Dieu.
- source_word: לְמַעַן עֲשֹׂה
  choice: afin d’accomplir
  rationale: לְמַעַן introduit le but, tandis que עשה désigne ici la réalisation effective d’un résultat historique.
- source_word: כַּיּוֹם הַזֶּה
  choice: ce qui se réalise aujourd’hui
  rationale: L’expression déictique renvoie à l’issue présente, désormais visible, plutôt qu’à une simple date du calendrier.
- source_word: לְהַחֲיֹת
  choice: maintenir en vie
  rationale: Le hiphil de חיה exprime ici la préservation de la vie.
- source_word: עַם רָב
  choice: un peuple nombreux
  rationale: La traduction garde le nom collectif עַם et l’idée d’un grand nombre, sans préciser une identité ethnique que le verset ne formule pas.
theological_decisions:
- issue: Providence divine et intention humaine dans le double emploi de חשב
  choice: Conserver le même verbe « projeter » pour les frères et pour Dieu
  alternative: Employer « vouloir » pour les frères et « tirer » ou « transformer » pour Dieu
  rationale: Le texte met délibérément en parallèle le dessein mauvais des frères et le dessein bon de Dieu. Employer le même verbe préserve cette tension sans nier la responsabilité humaine ni suggérer que leurs intentions morales étaient identiques.
- issue: Portée morale de רָעָה
  choice: Rendre l’expression par « faire du mal »
  alternative: « causer du tort » ou « provoquer un malheur »
  rationale: Le contexte présente une action humaine coupable. « Faire du mal » en conserve clairement la dimension morale tout en restant naturel en français contemporain.
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait situe les projets antérieurs des frères et de Dieu par rapport au résultat visible au moment où Joseph parle. Le parallélisme verbal est maintenu, tandis que la formulation reste idiomatique pour un lectorat général.
