  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: fr
  text: Alors Joseph se jeta sur le visage de son père, pleura sur lui et l’embrassa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: se jeta
  rationale: Le verbe נפל décrit ici le mouvement physique de Joseph vers le corps de son père. « Se jeta » restitue naturellement en français l’élan exprimé par « tomber sur », sans suggérer une perte de connaissance.
- source_word: עַל פְּנֵי אָבִיו
  choice: sur le visage de son père
  rationale: Cette formulation conserve l’image concrète et saisissante de l’hébreu, qui mentionne explicitement le visage du père.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: pleura sur lui
  rationale: בכה signifie « pleurer » ; avec עַל, « sur lui » exprime à la fois la proximité physique et le deuil devant le corps de Jacob.
- source_word: וַיִּשַּׁק לוֹ
  choice: l’embrassa
  rationale: Le qal de נשק signifie couramment « embrasser, donner un baiser ». « L’embrassa » est direct, naturel et digne en français.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
