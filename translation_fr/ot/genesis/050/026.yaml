  text: וַ/יָּ֣מָת יוֹסֵ֔ף בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִ֑ים וַ/יַּחַנְט֣וּ אֹת֔/וֹ וַ/יִּ֥ישֶׂם בָּ/אָר֖וֹן בְּ/מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: fr
  text: Joseph mourut à l’âge de cent dix ans. On l’embauma et on le déposa dans un cercueil en Égypte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « cercueil » désigne ailleurs un coffre ou une arche; dans ce contexte funéraire, il s’agit d’un cercueil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות désigne directement la mort. « Mourut » est précis, naturel et sans euphémisme.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: à l’âge de cent dix ans
  rationale: L’expression hébraïque emploie littéralement « fils de » pour indiquer l’âge; cette formulation rend naturellement l’idiome en français.
- source_word: וַיַּחַנְטוּ אֹתוֹ
  choice: On l’embauma
  rationale: Le verbe חנט renvoie à l’embaumement, notamment dans le contexte égyptien. « Embaumer » reste plus proche du verbe que « momifier ».
- source_word: וַיִּישֶׂם
  choice: on le déposa
  rationale: Le verbe שׂים signifie mettre, placer ou déposer. « Déposa » convient au contexte funéraire et au registre solennel.
- source_word: בָּאָרוֹן
  choice: dans un cercueil
  rationale: אָרוֹן peut désigner un coffre, une arche ou un cercueil. Le contexte de l’embaumement impose ici le sens de « cercueil »; l’indéfini est idiomatique en français lors de sa première mention.
- source_word: בְּמִצְרָיִם
  choice: en Égypte
  rationale: Rendu français standard du nom de lieu.
- source_word: וַ
  choice: enchaînement par juxtaposition
  rationale: Le waw narratif relie cette conclusion au récit précédent. En français moderne, la juxtaposition après la mort de Joseph produit un enchaînement naturel sans alourdir le verset par des « et » répétés.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient à la narration biblique littéraire sans être archaïque. L’impersonnel « on » rend naturellement les verbes hébreux au pluriel dont les agents ne sont pas nommés.
