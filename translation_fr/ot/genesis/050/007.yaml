base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: fr
  text: Joseph monta pour enterrer son père[a]. Avec lui montèrent tous les serviteurs de Pharaon, les anciens de la maison de Pharaon et tous les anciens du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « monta ». En hébreu, on décrivait habituellement ainsi le voyage de l’Égypte vers Canaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עָלָה signifie « monter ». « Monta » conserve l’idiome géographique hébreu décrivant le voyage de l’Égypte vers Canaan.
- source_word: לִקְבֹּר
  choice: pour enterrer
  rationale: L’infinitif de קָבַר signifie directement « enterrer ». Cette formulation est naturelle en français moderne.
- source_word: אָבִיו
  choice: son père
  rationale: Le possessif simple correspond au suffixe hébreu sans ajouter d’emphase.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: Avec lui montèrent
  rationale: Cette formulation conserve la répétition du verbe עָלָה et le rythme du récit, tout en restant digne et intelligible en français.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: tous les serviteurs de Pharaon
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce contexte de cour royale, « serviteurs » garde la portée générale du terme sans préciser indûment leur rang.
- source_word: זִקְנֵי בֵיתוֹ
  choice: les anciens de sa maison
  rationale: « Anciens » rend littéralement זִקְנֵי, et « maison » conserve l’expression hébraïque qui peut désigner ici la maison ou la cour de Pharaon.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: et tous les anciens du pays d’Égypte
  rationale: Cette traduction préserve à la fois זִקְנֵי, « anciens », et אֶרֶץ, « pays », en distinguant les responsables du pays de ceux de la maison royale.
