  source_fidelity: Le projet rend correctement la double occurrence de וַיַּעַל / וַיַּעֲלוּ par « monta / montèrent », ainsi que « enterrer son père », « tous les serviteurs de Pharaon » et les deux groupes d’anciens. « Donc » n’est pas exprimé dans l’hébreu et peut être supprimé sans perte. Le possessif de « sa maison » renvoie à Pharaon dans le texte source, mais il est légèrement moins net en français après « Joseph » ; l’explicitation est sûre.
  naturalness: Le registre est digne et compréhensible. « Joseph monta pour enterrer son père » est acceptable, et la note explique utilement l’idiome géographique. « Les anciens de la maison de Pharaon » est plus clair et demeure naturel en français international moderne.
  terminology: « Anciens » préserve la portée volontairement générale de זִקְנֵי sans imposer un rang administratif précis. « Maison de Pharaon » rend ביתו dans son sens de maison royale ou d’entourage, sans interprétation confessionnelle.
