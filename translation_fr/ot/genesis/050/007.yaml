  rationale: La révision supprime une nuance logique ajoutée et clarifie le référent de « maison » sans modifier le sens. Elle conserve la répétition de « monta / montèrent », l’ambiguïté institutionnelle de « anciens » et la note culturelle sur l’idiome géographique.
