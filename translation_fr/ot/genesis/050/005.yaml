base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: fr
  text: 'Mon père m’a fait prêter serment en disant : « Voici, je vais mourir. Tu m’enterreras là, dans le tombeau que je me suis creusé au pays de Canaan. » Maintenant donc, permets-moi, je te prie, de monter enterrer mon père ; puis je reviendrai.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: m’a fait prêter serment
  rationale: Le hifil de שׁבע exprime le fait d’imposer ou de faire prononcer un serment.
- source_word: הִנֵּה אָנֹכִי מֵת
  choice: Je vais mourir
  rationale: Dans ce contexte, le participe מֵת annonce une mort imminente ; cette formulation est naturelle en français et conserve la portée prospective.
- source_word: כָּרִיתִי לִי
  choice: que je me suis creusé
  rationale: Le sens premier de כרה est « creuser » ; le pronom réfléchi לִי indique que Jacob l’a préparé pour lui-même.
- source_word: אֶעֱלֶה נָּא
  choice: permets-moi, je te prie, de monter
  rationale: « Monter » préserve l’expression géographique hébraïque, tandis que נָּא marque une demande polie.
- source_word: וְאָשׁוּבָה
  choice: puis je reviendrai
  rationale: La forme cohortative exprime ici l’engagement de Joseph à revenir après l’ensevelissement.
