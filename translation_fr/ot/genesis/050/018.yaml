  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: fr
  text: 'Puis ses frères vinrent eux aussi, se prosternèrent devant lui et dirent : « Nous voici, nous sommes tes esclaves[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot hébreu peut désigner des serviteurs ou des esclaves ; ici, « esclaves » souligne la soumission complète exprimée par les frères.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: vinrent
  rationale: Le verbe הלך signifie fondamentalement « aller, marcher », mais le mouvement est ici dirigé vers Joseph ; en français narratif, « vinrent » exprime naturellement cette perspective contextuelle.
- source_word: גַּם אֶחָיו
  choice: ses frères vinrent eux aussi
  rationale: גַּם marque l’ajout et souligne que les frères se présentent maintenant eux-mêmes ; la tournure « eux aussi » rend cette nuance clairement.
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: se prosternèrent devant lui
  rationale: Dans ce contexte de soumission, נפל devant quelqu’un décrit une prosternation, et non une chute accidentelle. Cette formulation conserve à la fois le geste physique et sa portée sociale.
- source_word: הִנֶּנּוּ
  choice: Nous voici
  rationale: Formule naturelle de présentation et de disponibilité, sans recourir à l’archaïsme « voici que nous ».
- source_word: לְךָ לַעֲבָדִים
  choice: nous sommes tes esclaves
  rationale: La construction exprime leur mise à la disposition de Joseph dans une position de dépendance complète. « Tes esclaves » conserve ici la force de עֲבָדִים, tandis que « serviteurs » reste lexicalement possible.
theological_decisions:
- issue: Portée de עֲבָדִים dans cette déclaration de soumission
  choice: esclaves
  alternative: serviteurs
  rationale: Le mot peut désigner des serviteurs ou des esclaves. La prosternation et l’offre explicite de soi à Joseph favorisent ici le terme plus fort, sans toutefois effacer l’autre possibilité lexicale, signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Se prosternèrent » explicite naturellement le geste de soumission implicite dans l’expression hébraïque, et « nous sommes » complète en français la proposition nominale hébraïque.
