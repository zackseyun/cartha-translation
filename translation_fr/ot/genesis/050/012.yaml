  text: וַ/יַּעֲשׂ֥וּ בָנָ֖י/ו ל֑/וֹ כֵּ֖ן כַּ/אֲשֶׁ֥ר צִוָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: fr
  text: Ses fils firent pour lui comme il le leur avait ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: firent
  rationale: Le verbe עשה signifie largement « faire ». Ici, il décrit l’exécution des dispositions funéraires et se rend naturellement par « firent ».
- source_word: בָנָיו
  choice: ses fils
  rationale: Le texte hébreu désigne précisément les fils de Jacob, et non ses enfants de manière générale.
- source_word: לוֹ
  choice: pour lui
  rationale: Dans ce contexte, la préposition ל indique que l’action est accomplie pour Jacob, conformément à ses volontés.
- source_word: כֵּן
  choice: donc
  rationale: כֵּן renvoie à la manière prescrite et relie l’action à l’ordre qui suit. En français, « donc » exprime naturellement ici la conséquence pratique des instructions données.
- source_word: כַּאֲשֶׁר
  choice: ce que
  rationale: La tournure idiomatique « faire ce que quelqu’un a ordonné » exprime clairement la conformité de l’action au commandement, sans alourdir la phrase.
- source_word: צִוָּם
  choice: il leur avait ordonné
  rationale: צוה exprime un ordre explicite. Le plus-que-parfait marque naturellement en français l’antériorité de l’ordre de Jacob par rapport à son exécution.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve « ses fils » et la notion d’ordre, tout en privilégiant une syntaxe française naturelle.
