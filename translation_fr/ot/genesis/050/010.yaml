  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: fr
  text: Lorsqu’ils arrivèrent à l’aire de battage d’Atad[a], qui se trouve de l’autre côté du Jourdain[b], ils s’y livrèrent à une lamentation très grande et très poignante[c]. Joseph[d] porta le deuil de son père pendant sept jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Atad peut évoquer un « buisson épineux », mais il sert ici de nom de lieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « au-delà du Jourdain ». L’expression hébraïque ne précise pas à elle seule le point de vue géographique.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « une lamentation grande et très lourde » ; cette expression décrit un deuil d’une intensité extrême.'
    reason: cultural_note
  - marker: d
    text: 'L’hébreu emploie ici un verbe au singulier, après les verbes précédents au pluriel. Le sujet est probablement Joseph ; certaines traductions conservent toutefois le pluriel collectif : « ils portèrent le deuil ».'
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן הָאָטָד
  choice: l’aire de battage d’Atad
  rationale: גֹּרֶן désigne normalement une aire où l’on bat les céréales. הָאָטָד fonctionne ici comme un nom de lieu, malgré son sens lexical possible de « buisson épineux ».
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: Cette expression rend naturellement l’idée du côté situé au-delà du Jourdain sans déterminer davantage le point de vue géographique, qui demeure ambigu dans l’hébreu.
- source_word: וַיִּסְפְּדוּ שָׁם מִסְפֵּד
  choice: ils y prononcèrent une lamentation
  rationale: Le verbe ספד et le nom apparenté מִסְפֵּד évoquent une lamentation funèbre publique. « Prononcer une lamentation » restitue cette dimension sans reproduire lourdement la construction étymologique hébraïque.
- source_word: גָּדוֹל וְכָבֵד מְאֹד
  choice: très grande et poignante
  rationale: « Très grande » traduit l’intensité de גָּדוֹל et מְאֹד, tandis que « poignante » exprime naturellement en français le poids et la gravité de כָבֵד dans un contexte de deuil.
- source_word: וַיַּעַשׂ לְאָבִיו אֵבֶל
  choice: Joseph porta le deuil de son père
  rationale: עשה avec אֵבֶל signifie idiomatiquement observer ou accomplir un deuil. « Porter le deuil » est une formulation française naturelle. Le nom « Joseph » explicite le sujet singulier probable sans laisser un pronom équivoque après le pluriel précédent.
- source_word: שִׁבְעַת יָמִים
  choice: pendant sept jours
  rationale: La préposition « pendant » exprime clairement la durée indiquée par l’hébreu.
theological_decisions:
- issue: Sujet du verbe singulier וַיַּעַשׂ après les verbes au pluriel
  choice: Joseph porta le deuil
  alternative: Ils portèrent le deuil
  rationale: Le texte massorétique passe explicitement du pluriel au singulier. Joseph est le référent singulier le plus vraisemblable dans le contexte. Le nom est employé dans le texte pour préserver ce changement de nombre tout en évitant l’ambiguïté du pronom français « il ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la solennité funèbre du passage, évite un calque maladroit de l’hébreu et signale les ambiguïtés géographique et grammaticale en notes.
