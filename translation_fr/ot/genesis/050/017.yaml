  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: fr
  text: 'Voici ce que vous direz à Joseph : « Je t’en prie, pardonne la faute de tes frères et leur péché, car ils t’ont rendu le mal. Maintenant, je t’en prie, pardonne la faute des serviteurs du Dieu de ton père. » Joseph pleura lorsqu’ils lui parlèrent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: je t’en prie, pardonne
  rationale: Littéralement « porte, je te prie » ; dans ce contexte, l’expression idiomatique demande de remettre une faute. La supplication répétée dans l’hébreu est conservée.
- source_word: פֶּשַׁע
  choice: faute
  rationale: Désigne une transgression ou rébellion ; « faute » reste naturel en français tout en conservant la gravité morale du terme.
- source_word: וְחַטָּאתָם
  choice: et leur péché
  rationale: Rend distinctement חטאת sans fusionner les deux termes moraux coordonnés.
- source_word: כִּי רָעָה גְמָלוּךָ
  choice: car ils t’ont fait du mal
  rationale: Rend naturellement l’idée qu’ils ont traité Joseph d’une manière mauvaise, sans surinterpréter גמל comme une stricte rétribution.
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: les serviteurs du Dieu de ton père
  rationale: Traduction formellement proche qui conserve l’appel à leur identité religieuse commune.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: lorsqu’ils lui parlèrent ainsi
  rationale: Le suffixe pluriel renvoie naturellement aux frères comme locuteurs ; « ainsi » reprend le message rapporté.
theological_decisions:
- issue: Nature de la demande de pardon
  choice: pardonne la faute
  alternative: enlève / porte la faute
  rationale: Le sens idiomatique contextuel est le pardon, tout en évitant d’ajouter une théorie particulière de l’expiation.
- issue: Désignation religieuse des frères
  choice: serviteurs du Dieu de ton père
  alternative: adorateurs du Dieu de ton père
  rationale: « Serviteurs » conserve le langage d’allégeance du texte sans réduire עבד à la seule pratique cultuelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement est écarté puisque les frères s’adressent à Joseph dans une relation familiale et que l’hébreu emploie le singulier. La répétition suppliante de נָא est maintenue.
