    issue: Nuance de rétribution dans גמלו־ך atténuée
    rationale: Le verbe גמל exprime ici qu’ils ont rendu ou fait subir le mal à Joseph, et non seulement qu’ils lui ont fait du mal.
  - severity: low
    issue: Ajout de « ainsi » dans la clause finale
    rationale: בְּדַבְּרָם אֵלָיו signifie simplement « lorsqu’ils lui parlèrent » ; « ainsi » est explicatif mais n’est pas requis.
