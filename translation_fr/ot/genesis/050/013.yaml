    text: 'Littéralement : « comme propriété de sépulture ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vis-à-vis de Mamré ».'
    reason: lexical_alternative
  revision_rationale: La phrase est rétablie de façon à ce que « le champ » soit clairement l’objet de l’achat et que « en face de Mamré » localise ce champ, conformément à la syntaxe et au sens du texte hébreu. Les deux ancres de note demeurent placées sur les expressions auxquelles elles se rapportent.
