base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: fr
  text: Ses fils le transportèrent au pays de Canaan et l’ensevelirent dans la grotte du champ de Makpéla, le champ qu’Abraham avait acheté à Éphrôn le Hittite comme propriété funéraire[a], en face de Mamré[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme propriété de sépulture ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vis-à-vis de Mamré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ בָנָיו
  choice: Ses fils le transportèrent
  rationale: נשׂא désigne ici le transport du corps de Jacob. « Transportèrent » est naturel en français moderne et évite l’ambiguïté possible de « portèrent ».
- source_word: אַרְצָה כְּנַעַן
  choice: au pays de Canaan
  rationale: La finale directionnelle exprime le mouvement vers le pays de Canaan; « au pays de Canaan » restitue ce mouvement dans un français idiomatique.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: l’ensevelirent
  rationale: « Ensevelir » rend dignement l’action funéraire de קבר et convient au registre narratif biblique sans être archaïque.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: dans la grotte du champ de Makpéla
  rationale: Cette formulation conserve la chaîne construite hébraïque tout en restant claire et naturelle.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: Abraham avait acheté ce champ
  rationale: L’hébreu emploie une construction relative avec reprise explicite de « le champ ». Une nouvelle phrase restitue clairement que le champ est l’objet de l’achat, sans suggérer à tort qu’il aurait servi de moyen de paiement.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: pour en faire une propriété funéraire
  rationale: אֲחֻזָּה désigne une propriété détenue durablement et קֶבֶר en précise la destination. Cette expression communique à la fois l’acquisition et l’usage funéraire.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: à Éphrôn le Hittite
  rationale: Avec le verbe « acheter », le français indique idiomatiquement le vendeur par « à ». « Hittite » est la désignation moderne habituelle.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: en face de Mamré
  rationale: La locution situe le champ par rapport à Mamré et peut exprimer l’idée d’être devant ou vis-à-vis de ce lieu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe hébraïque à reprise (« qu’Abraham avait acheté, le champ ») est restructurée en deux phrases pour éviter toute ambiguïté sur l’objet de l’achat, sans supprimer aucun élément du texte source.
