  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: fr
  text: « À présent, n’ayez pas peur. C’est moi qui pourvoirai à vos besoins et à ceux de vos jeunes enfants. » Il les réconforta et parla à leur cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur parla avec bienveillance » ou « leur parla de manière rassurante » ; littéralement, « parla à leur cœur » (idiome hébreu).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Cette tournure naturelle conserve à la fois la transition marquée par וְ et la valeur temporelle et conclusive de עַתָּה.
- source_word: אַל תִּירָאוּ
  choice: n’ayez pas peur
  rationale: Formule française courante de réassurance qui rend fidèlement l’interdiction exprimée par la construction hébraïque.
- source_word: אָנֹכִי
  choice: C’est moi qui
  rationale: La construction clivée fait ressortir l’insistance portée par le pronom indépendant hébreu.
- source_word: אֲכַלְכֵּל
  choice: pourvoirai à vos besoins
  rationale: Le verbe désigne le fait d’entretenir matériellement et de fournir de quoi vivre, notamment la nourriture; cette formulation convient au contexte sans le limiter artificiellement.
- source_word: טַפְּכֶם
  choice: vos jeunes enfants
  rationale: טַף désigne ici les petits ou jeunes enfants. Cette expression préserve la nuance d’âge tout en évitant l’ambiguïté française de « petits-enfants », qui désigne normalement les descendants de la deuxième génération.
- source_word: וַיְנַחֵם אֹתָם
  choice: Ainsi, il les réconforta
  rationale: נחם au piel exprime ici l’action d’apaiser et de consoler; « ainsi » relie naturellement le résumé narratif aux paroles précédentes.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: et parla à leur cœur
  rationale: La traduction conserve l’image de l’idiome hébreu, qui évoque des paroles bienveillantes et rassurantes, sans en réduire le sens à une seule paraphrase.
