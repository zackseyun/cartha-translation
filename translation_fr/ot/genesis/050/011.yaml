  text: וַ/יַּ֡רְא יוֹשֵׁב֩ הָ/אָ֨רֶץ הַֽ/כְּנַעֲנִ֜י אֶת הָ/אֵ֗בֶל בְּ/גֹ֨רֶן֙ הָֽאָטָ֔ד וַ/יֹּ֣אמְר֔וּ אֵֽבֶל כָּבֵ֥ד זֶ֖ה לְ/מִצְרָ֑יִם עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ אָבֵ֣ל מִצְרַ֔יִם אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: fr
  text: 'Quand les habitants du pays, les Cananéens, virent le deuil à l’aire de battage d’Atad, ils dirent : « C’est un grand deuil pour les Égyptiens. » C’est pourquoi on donna à ce lieu le nom d’Abel-Mitsraïm[a]. Il se trouve de l’autre côté du Jourdain[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abel-Mitsraïm évoque en hébreu l’expression « deuil de l’Égypte » et reprend ainsi les paroles des Cananéens.
    reason: lexical_alternative
  - marker: b
    text: Ou « au-delà du Jourdain » ; l’expression dépend du point de vue géographique adopté.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: les habitants du pays, les Cananéens
  rationale: Le participe singulier a une valeur collective, et « les Cananéens » conserve l’identification en apposition sans transformer implicitement « le pays » en « pays de Canaan ».
- source_word: הָאֵבֶל
  choice: le deuil célébré
  rationale: אֵבֶל désigne ici le deuil funéraire, observable dans ses manifestations et ses rites; l’ajout idiomatique « célébré » précise naturellement en français qu’il s’agit du deuil tenu en ce lieu.
- source_word: בְּגֹרֶן הָאָטָד
  choice: sur l’aire de battage d’Atad
  rationale: Une aire de battage est une surface sur laquelle se déroule l’action; « sur » est donc le français locatif naturel.
- source_word: אֵבֶל כָּבֵד
  choice: un deuil accablant
  rationale: כָּבֵד signifie littéralement « lourd » et exprime ici une grande intensité. « Accablant » garde l’image du poids tout en restant idiomatique.
- source_word: לְמִצְרָיִם
  choice: pour les Égyptiens
  rationale: Le nom géographique « Égypte » désigne ici le groupe égyptien engagé dans le deuil; le gentilé exprime clairement cette valeur contextuelle.
- source_word: עַל כֵּן קָרָא שְׁמָהּ
  choice: C’est pourquoi on donna à ce lieu le nom
  rationale: Cette formulation française naturelle conserve le lien étiologique et ne précise pas l’identité du sujet indéterminé de קָרָא. « À ce lieu » explicite seulement le référent féminin du suffixe.
- source_word: אָבֵל מִצְרַיִם
  choice: Abel-Mitsraïm
  rationale: Le nom propre est translittéré; sa proximité sonore et sémantique avec אֵבֶל, « deuil », est expliquée en note.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: de l’autre côté du Jourdain
  rationale: L’expression indique le côté opposé du Jourdain depuis un point de vue implicite; la note signale que ce repérage dépend de la perspective géographique.
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et lisible. La phrase conserve l’apposition « les Cananéens », le langage funéraire et le jeu de mots du toponyme en note. Le découpage final en deux phrases évite une relative française dont l’antécédent pourrait sembler être le nom plutôt que le lieu.
