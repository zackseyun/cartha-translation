revisions:
- from: 'Quand les habitants du pays, les Cananéens, virent le deuil célébré sur l’aire de battage d’Atad, ils dirent : « C’est un deuil accablant pour les Égyptiens. » C’est pourquoi on donna à ce lieu le nom d’Abel-Mitsraïm[a]. Il se trouve de l’autre côté du Jourdain[b].'
  to: 'Quand les habitants du pays, les Cananéens, virent le deuil à l’aire de battage d’Atad, ils dirent : « C’est un grand deuil pour les Égyptiens. » C’est pourquoi on donna à ce lieu le nom d’Abel-Mitsraïm[a]. Il se trouve de l’autre côté du Jourdain[b].'
  rationale: La révision retire une précision non exprimée par l’hébreu et emploie « grand deuil », rendu français naturel de l’intensité indiquée par כָּבֵד. Le reste du texte et les notes sont conservés, car ils rendent fidèlement l’apposition, le jeu de mots toponymique et l’ambiguïté de perspective liée au Jourdain.
