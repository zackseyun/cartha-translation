base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: fr
  text: ainsi que toute la maisonnée de Joseph[a], ses frères et la maisonnée de son père ; ils ne laissèrent au pays de Gosen que leurs jeunes enfants[b], leur petit bétail[c] et leurs bovins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la maison de Joseph […] la maison de son père ». Ici, le mot hébreu traduit par « maisonnée » désigne la famille et les personnes qui lui sont rattachées, et non seulement un bâtiment.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des enfants encore jeunes.
    reason: lexical_clarification
  - marker: c
    text: L’expression hébraïque désigne collectivement le petit bétail, notamment les moutons et les chèvres.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכֹל
  choice: ainsi que toute
  rationale: La conjonction ajoute ce groupe à l’énumération du verset précédent, tandis que « toute » conserve l’idée de totalité.
- source_word: בֵּית יוֹסֵף
  choice: la maisonnée de Joseph
  rationale: Dans ce contexte, בַּיִת désigne le groupe familial et domestique rattaché à Joseph, non un bâtiment.
- source_word: וְאֶחָיו
  choice: ses frères
  rationale: Le pluriel renvoie ici aux frères de Joseph.
- source_word: וּבֵית אָבִיו
  choice: la maisonnée de son père
  rationale: La même acception sociale et familiale de בַּיִת est maintenue dans les deux expressions parallèles.
- source_word: רַק
  choice: ne… que
  rationale: Cette tournure française naturelle exprime précisément la restriction introduite par רַק.
- source_word: טַפָּם
  choice: leurs jeunes enfants
  rationale: טַף désigne les enfants en bas âge ou trop jeunes pour participer au voyage ; « jeunes enfants » évite l’ambiguïté française de « petits-enfants », qui peut signifier descendants de la deuxième génération.
- source_word: וְצֹאנָם
  choice: leurs moutons et leurs chèvres
  rationale: צֹאן est un collectif désignant le petit bétail, principalement les ovins et les caprins ; l’explicitation est claire en français courant.
- source_word: וּבְקָרָם
  choice: leurs bovins
  rationale: בָּקָר désigne collectivement le gros bétail, particulièrement les bovins. Ce choix distingue clairement ce groupe des moutons et des chèvres.
- source_word: עָזְבוּ
  choice: ils laissèrent
  rationale: Le verbe indique qu’ils les laissèrent sur place, sans la connotation négative d’un abandon.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: au pays de Goshen
  rationale: La traduction conserve explicitement אֶרֶץ tout en employant une formulation géographique idiomatique en français.
