  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: fr
  text: Quarante jours s’écoulèrent pour lui, car c’est ainsi que s’accomplissent les jours de l’embaumement[a]. Puis l’Égypte le pleura pendant soixante-dix jours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction plus littérale : « car ainsi s’accomplissent les jours de l’embaumement ».'
    reason: alternative_reading
  - marker: b
    text: « L’Égypte » désigne ici collectivement les Égyptiens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: Quarante jours s’écoulèrent ainsi pour lui
  rationale: מלא appliqué à une période indique que celle-ci arrive à son terme. « S’écoulèrent » exprime naturellement en français la durée accomplie, tandis que « pour lui » conserve le complément hébreu renvoyant à Jacob.
- source_word: כִּי כֵן יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: car telle est la durée habituelle de l’embaumement
  rationale: La proposition explique les quarante jours comme la durée normalement requise pour l’embaumement. Cette formulation française rend le sens contextuel du participe חֲנֻטִים sans reproduire une tournure hébraïque obscure.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: le pleura
  rationale: בכה désigne l’action de pleurer. « Pleurer quelqu’un » est une construction française naturelle qui conserve l’objet direct hébreu sans élargir explicitement le sens à tous les rites de deuil.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Le nom du pays est employé collectivement pour ses habitants. Le maintien de « l’Égypte » préserve l’image et la formulation hébraïques.
- source_word: שִׁבְעִים יוֹם
  choice: pendant soixante-dix jours
  rationale: L’ajout idiomatique de « pendant » précise en français qu’il s’agit de la durée des pleurs, sans modifier le sens.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. Le texte privilégie une équivalence optimale : il clarifie l’expression temporelle hébraïque tout en conservant « pour lui » et l’emploi collectif de « l’Égypte ». Tous les marqueurs de notes figurent dans le texte.'
