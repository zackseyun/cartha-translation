revisions:
- from: Quarante jours s’écoulèrent ainsi pour lui, car telle est la durée habituelle de l’embaumement[a]. Puis l’Égypte le pleura pendant soixante-dix jours[b].
  to: Quarante jours s’écoulèrent pour lui, car c’est ainsi que s’accomplissent les jours de l’embaumement[a]. Puis l’Égypte le pleura pendant soixante-dix jours[b].
  rationale: La révision corrige la légère redondance et le déplacement de « ainsi », en rendant explicitement la construction explicative כִּי כֵן. Elle évite aussi d’ajouter « habituelle », tout en conservant les choix justifiés d’« embaumement », de « pour lui », de « l’Égypte » et de la durée de soixante-dix jours. Les deux appels de note restent correctement ancrés.
