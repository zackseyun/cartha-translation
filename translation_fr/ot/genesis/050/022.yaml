  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: fr
  text: Joseph resta en Égypte[a], lui et la maisonnée de son père. Joseph vécut 110 ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Joseph habita en Égypte, lui et la maison de son père ».'
    reason: Alternative lexicale pour וַיֵּשֶׁב (« habita ») et formulation plus littérale de בֵית אָבִיו (« la maison de son père »).
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: resta
  rationale: Le verbe יׁשב peut signifier « habiter », « demeurer » ou « rester ». Dans ce résumé qui suit la mort de Jacob, « resta » exprime naturellement la continuité du séjour de Joseph en Égypte et évite de répéter « vécut » dans la phrase suivante.
- source_word: בְּמִצְרַיִם
  choice: en Égypte
  rationale: Expression locative directe et idiomatique en français.
- source_word: הוּא וּבֵית אָבִיו
  choice: lui et toute la maisonnée de son père
  rationale: Le nom בַּיִת à l’état construit désigne ici le groupe familial ou domestique plutôt qu’un bâtiment. « Maisonnée » conserve cette portée plus large; « toute » rend naturellement en français l’idée collective sans ajouter de groupe distinct.
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans une indication d’âge, חיה signifie naturellement « vivre ». Le passé simple convient au récit récapitulatif et distingue ce verbe de וַיֵּשֶׁב rendu par « resta ».
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 110 ans
  rationale: Rend exactement l’âge indiqué, en chiffres pour une lecture moderne et immédiate.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre.
