  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: fr
  text: 'Joseph fit prêter serment aux fils d’Israël en disant : « Dieu interviendra certainement en votre faveur, et vous emporterez mes ossements d’ici. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת
  choice: fit prêter serment à
  rationale: La construction causative signifie que Joseph impose un serment aux fils d’Israël ; cette tournure française est naturelle et précise.
- source_word: פָּקֹד יִפְקֹד
  choice: interviendra certainement en votre faveur
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude. Dans ce contexte, פקד désigne l’intervention attentive et favorable de Dieu, plutôt qu’une simple visite.
- source_word: וְהַעֲלִתֶם
  choice: vous emporterez
  rationale: Le verbe signifie littéralement « faire monter ». Ici, il s’agit d’emporter les ossements hors d’Égypte vers le pays promis ; « emporterez » exprime naturellement l’action sans ajouter une modalité absente du verbe lui-même.
- source_word: עַצְמֹתַי
  choice: mes ossements
  rationale: « Ossements » convient au contexte funéraire et au registre biblique digne.
- source_word: מִזֶּה
  choice: d’ici
  rationale: Rend directement l’indication du lieu de départ.
theological_decisions:
- issue: Nature de l’action divine exprimée par פקד
  choice: interviendra certainement en votre faveur
  alternative: vous visitera certainement
  rationale: Le choix conserve l’idée d’une action divine assurée et bienveillante dans le contexte de la délivrance, sans suggérer une simple présence ni préciser indûment la manière de cette intervention.
- issue: Force de וְהַעֲלִתֶם après le serment
  choice: vous emporterez
  alternative: vous devrez emporter
  rationale: Le contexte du serment donne à l’énoncé une force d’obligation, mais la forme hébraïque est un accompli coordonné pouvant exprimer l’action future attendue. Le futur français préserve cette tension sans introduire explicitement un auxiliaire modal.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la solennité du serment et l’emphase hébraïque sur la certitude de l’intervention divine, sans archaïsme inutile.
