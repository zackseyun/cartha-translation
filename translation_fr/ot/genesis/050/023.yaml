id: GEN.50.23
reference: Genesis 50:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: fr
  text: Joseph vit les descendants d’Éphraïm jusqu’à la troisième génération[a]. Les enfants de Makir, fils de Manassé, naquirent eux aussi sur les genoux de Joseph[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Joseph vécut assez longtemps pour voir les descendants d’Éphraïm jusqu’à la troisième génération ». L’hébreu dit littéralement « Joseph vit ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « naquirent sur les genoux de Joseph » peut évoquer la reconnaissance familiale, l’accueil ou une acceptation particulière de ces enfants.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Rend directement le verbe hébreu « voir » tout en restant naturel dans ce contexte généalogique; l’idée qu’il vécut assez longtemps pour les voir demeure implicite.
- source_word: לְאֶפְרַיִם
  choice: d’Éphraïm
  rationale: Le ל dans cette formule de descendance se rend naturellement en français par un complément possessif exprimant la lignée.
- source_word: בְּנֵי שִׁלֵּשִׁים
  choice: les descendants jusqu’à la troisième génération
  rationale: « Descendants » exprime clairement la portée généalogique de בְּנֵי, tandis que « jusqu’à la troisième génération » conserve l’étendue indiquée sans préciser davantage les liens familiaux.
- source_word: גַּם
  choice: eux aussi
  rationale: Marque naturellement en français l’ajout parallèle de la seconde lignée.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Les enfants de Makir, fils de Manassé
  rationale: « Enfants » convient au contexte immédiat de la naissance; l’apposition identifie Makir comme fils de Manassé.
- source_word: יֻלְּדוּ
  choice: naquirent
  rationale: Rend simplement et précisément le passif hébreu de ילד dans un français fluide.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: sur les genoux de Joseph
  rationale: Préserve l’image concrète et l’ambiguïté de l’expression hébraïque plutôt que d’imposer dans le texte une interprétation sociale précise.
theological_decisions:
- issue: Portée de l’expression « sur les genoux de Joseph »
  choice: Conserver littéralement l’image dans le texte et signaler ses implications possibles en note
  alternative: Paraphraser par « furent reconnus comme siens », « furent accueillis dans sa famille » ou une formule d’adoption
  rationale: L’expression peut évoquer la reconnaissance familiale, l’accueil ou une acceptation particulière, mais le texte ne tranche pas explicitement entre ces nuances.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit biblique écrit. « Descendants » évite l’ambiguïté française de « enfants jusqu’à la troisième génération », tandis que l’image culturelle des genoux est conservée et expliquée en note.
