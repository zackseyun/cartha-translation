source:
  edition: WLC
  text: וַ/יַּ֣עַל עִמּ֔/וֹ גַּם רֶ֖כֶב גַּם פָּרָשִׁ֑ים וַ/יְהִ֥י הַֽ/מַּחֲנֶ֖ה כָּבֵ֥ד מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: fr
  text: Des chars et des cavaliers montèrent aussi avec lui, et le cortège était très imposant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le camp était très lourd », c’est-à-dire très considérable ou imposant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: montèrent
  rationale: Le verbe עלה signifie couramment « monter ». Dans ce récit de déplacement, « montèrent » conserve l’expression directionnelle hébraïque tout en restant naturelle en français.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Rend directement la préposition et le suffixe pronominal, qui renvoie à Joseph dans le contexte.
- source_word: גַּם ... גַּם
  choice: Des chars et des cavaliers ... aussi
  rationale: La construction répétée associe les deux contingents tout en les ajoutant aux personnes déjà mentionnées. En français, la coordination des deux noms suivie de « aussi » exprime naturellement cette valeur.
- source_word: רֶכֶב
  choice: chars
  rationale: Le singulier hébreu est collectif et désigne ici les chars comme contingent. Le pluriel français est la formulation la plus naturelle.
- source_word: פָּרָשִׁים
  choice: cavaliers
  rationale: Le mot désigne des hommes montés. « Cavaliers » est clair, digne et moins marqué par la terminologie militaire moderne que « cavalerie ».
- source_word: הַמַּחֲנֶה
  choice: le cortège
  rationale: Dans le contexte de ce déplacement funéraire, le terme désigne l’ensemble du groupe en marche plutôt qu’un campement fixe. « Cortège » rend précisément cette réalité contextuelle.
- source_word: כָּבֵד מְאֹד
  choice: était extrêmement imposant
  rationale: Littéralement « était très lourd ». Appliqué à un groupe, l’adjectif évoque son importance, son ampleur ou son caractère impressionnant. « Extrêmement imposant » conserve cette richesse mieux qu’une simple indication de nombre.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Cortège » convient au déplacement funéraire sans suggérer un campement stationnaire; « imposant » préserve l’image de poids et d’importance portée par l’hébreu.
