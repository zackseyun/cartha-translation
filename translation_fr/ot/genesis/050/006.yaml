    issue: « répondit » au lieu de « dit »
    rationale: Le wayyiqtol ויאמר introduit la parole de Pharaon sans marquer explicitement qu’il répond. Employer « dit » évite cet ajout discursif mineur.
  - severity: medium
    issue: « comme il te l’a fait jurer »
    rationale: La reprise pronominale « l’ » n’a pas d’antécédent textuel dans le verset et peut rendre la portée du serment moins claire. « Comme il t’a fait prêter serment » traduit directement le causatif hébreu.
