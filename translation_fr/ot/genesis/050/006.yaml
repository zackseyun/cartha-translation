review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu dit simplement « Pharaon dit » ; « répondit » est contextuellement possible, mais ajoute une nuance de réplique qui n’est pas exprimée. « Monte et enterre ton père » rend bien les impératifs עלה וקבר et conserve le mouvement ascendant. Le hiphil הִשְׁבִּיעֶךָ exige l’idée que le père a fait prêter un serment à Joseph.
  naturalness: « Il te l’a fait jurer » se comprend, mais l’antécédent de « l’ » est implicite et la construction est moins nette en français international. « Il t’a fait prêter serment » est idiomatique, explicite et garde la force causative sans expliciter indûment le contenu du serment.
  terminology: « Pharaon », « monte », « enterre » et « ton père » conviennent au registre moderne et au vocabulaire usuel. « Prêter serment » est ici préférable à « jurer » pour exprimer clairement l’engagement solennel indiqué par le verbe hébreu.
  issues:
