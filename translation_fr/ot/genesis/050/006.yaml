  yaml_path: translation/ot/genesis/050/006.yaml
  text: And Pharaoh said[a], “Go up and bury your father, as he made you swear.”
translation:
  language: fr
  text: 'Pharaon dit : « Monte et enterre ton père, comme il t’a fait prêter serment. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: répondit
  rationale: Dans ce contexte de dialogue, le wayyiqtol fait avancer le récit et introduit la réponse de Pharaon. « Répondit » est naturel en français et explicite sans excès la fonction contextuelle de la parole.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Titre traditionnel et usuel en français pour le souverain égyptien.
- source_word: עֲלֵה
  choice: Monte
  rationale: Le verbe עלה signifie littéralement « monter ». Ici, il désigne le déplacement de l’Égypte vers Canaan; conserver cette orientation respecte l’expression hébraïque tout en restant idiomatique.
- source_word: וּקְבֹר
  choice: et enterre
  rationale: קבר signifie directement « enterrer ». Ce terme courant convient mieux au registre visé que « ensevelir » ou « inhumer ».
- source_word: אֶת אָבִיךָ
  choice: ton père
  rationale: Le syntagme est l’objet direct de « enterrer » et porte un suffixe masculin singulier de deuxième personne; « ton père » est la formulation française naturelle.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: 'La conjonction exprime ici la conformité à l’engagement imposé auparavant : « comme » rend ce rapport de manière concise.'
- source_word: הִשְׁבִּיעֶךָ
  choice: il te l’a fait jurer
  rationale: 'Le hiphil de שׁבע est causatif : le père de Joseph lui a fait prêter serment. Le pronom « l’ » reprend naturellement en français l’obligation de l’enterrer, connue par le contexte.'
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La tournure directe conserve la brièveté de l’hébreu. « Monte » maintient l’orientation géographique et narrative, tandis que « il te l’a fait jurer » préserve la valeur causative du verbe sans recourir au plus soutenu « t’a fait prêter serment ».
