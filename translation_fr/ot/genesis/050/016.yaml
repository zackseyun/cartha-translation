  yaml_path: translation/ot/genesis/050/016.yaml
  text: So they sent word to Joseph[a], saying, “Your father commanded before his death, saying,”
translation:
  language: fr
  text: 'Ils envoyèrent donc dire à Joseph[a] : « Ton père a donné cet ordre avant sa mort :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ils ordonnèrent à Joseph ». Le verbe hébreu signifie habituellement « ordonner », mais il semble désigner ici la transmission d’un message à Joseph.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: ils firent transmettre ce message
  rationale: Le verbe צוה signifie habituellement « ordonner », mais la construction avec אֶל־יוֹסֵף et le discours rapporté indique ici que les frères font parvenir un message à Joseph. Cette formulation française exprime naturellement cet emploi contextuel.
- source_word: אֶל יוֹסֵף
  choice: à Joseph
  rationale: La préposition introduit le destinataire du message; le nom propre reçoit sa forme française usuelle.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le premier infinitif introducteur de parole est rendu naturellement en français par les deux-points, sans alourdir la narration avec « en disant ».
- source_word: אָבִיךָ
  choice: Ton père
  rationale: Rend directement le nom avec le suffixe possessif de deuxième personne du masculin singulier.
- source_word: צִוָּה
  choice: a donné cet ordre
  rationale: Conserve le sens courant et la force de צוה tout en annonçant naturellement le contenu de l'ordre cité au verset suivant.
- source_word: לִפְנֵי מוֹתוֹ
  choice: avant sa mort
  rationale: La préposition a ici son sens temporel et indique que l'ordre a été donné antérieurement au décès de Jacob.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le second introducteur de parole annonce la citation qui suit au verset 17; les deux-points en reproduisent la fonction dans un français idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition hébraïque des deux introducteurs de parole est représentée par la ponctuation française. Le premier emploi de צוה est explicité selon son sens contextuel, tandis que le second garde sa valeur d’ordre.
