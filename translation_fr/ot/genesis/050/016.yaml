  source_fidelity: 'Le premier וַיְצַוּוּ est lexicalement ambigu dans cette construction : son sens usuel est « ordonner », mais le contexte immédiat favorise l’idée de faire parvenir une parole à Joseph. « Envoyèrent dire à Joseph » rend cette fonction contextuelle sans prétendre résoudre définitivement la valeur du verbe. Le second צִוָּה est correctement rendu par « a donné cet ordre »; « avant sa mort » rend précisément לִפְנֵי מוֹתוֹ.'
