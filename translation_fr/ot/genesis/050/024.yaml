base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: fr
  text: 'Joseph dit à ses frères : « Je vais mourir, mais Dieu s’occupera certainement de vous[a] et vous fera monter de ce pays vers le pays qu’il a juré de donner à Abraham, à Isaac et à Jacob. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu vous visitera certainement ». La répétition du verbe hébreu exprime une forte certitude; dans ce contexte, elle peut désigner l’attention efficace de Dieu et son action en faveur de son peuple.'
    reason: alternative lexicale et explication de l’idiome hébraïque
lexical_decisions:
- source_word: אֶחָיו
  choice: ses frères
  rationale: Le masculin pluriel désigne ici les frères de Joseph dans le contexte de la Genèse.
- source_word: אָנֹכִי מֵת
  choice: Je vais mourir
  rationale: La tournure exprime la mort imminente de Joseph; cette formulation est naturelle en français moderne.
- source_word: פָּקֹד יִפְקֹד
  choice: interviendra certainement en votre faveur
  rationale: L’infinitif absolu suivi de l’imparfait marque la certitude avec insistance. Dans ce contexte d’alliance, פקד désigne l’attention décisive de Dieu se traduisant par une action en faveur de son peuple.
- source_word: וֵאלֹהִים
  choice: mais Dieu
  rationale: La conjonction introduit ici un contraste naturel entre la mort prochaine de Joseph et l’action certaine de Dieu.
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: et vous fera monter
  rationale: Le causatif de עלה conserve l’image directionnelle de la montée depuis l’Égypte vers le pays promis.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: de ce pays
  rationale: Rendu direct et idiomatique; « ce pays » désigne l’Égypte.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: vers le pays qu’il a juré
  rationale: Le texte dit littéralement que Dieu a juré relativement à ce pays, sans exprimer le verbe « donner »; la formulation française maintient cette ellipse solennelle, malgré sa légère tension syntaxique.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: à Abraham, à Isaac et à Jacob
  rationale: La répétition de « à » reflète celle des prépositions hébraïques et préserve la solennité de la formule patriarcale.
theological_decisions:
- issue: Nature de l’action divine exprimée par פָּקֹד יִפְקֹד
  choice: Dieu interviendra certainement en faveur des descendants de Joseph
  alternative: Dieu vous visitera certainement / Dieu s’occupera certainement de vous
  rationale: La construction affirme avec force que Dieu portera une attention décisive à son peuple et agira pour lui. « Interviendra en votre faveur » rend ce sens d’alliance sans évoquer une simple visite physique.
- issue: Contenu implicite du serment concernant le pays
  choice: ne pas ajouter explicitement « donner »
  alternative: le pays qu’il a juré de donner à Abraham, à Isaac et à Jacob
  rationale: Le don est clairement impliqué par le contexte, mais le verbe correspondant n’apparaît pas dans ce verset; conserver l’ellipse évite de résoudre silencieusement ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Vous fera monter » conserve l’image spatiale hébraïque; « interviendra certainement en votre faveur » explicite sobrement la portée contextuelle de l’idiome tout en signalant le rendu littéral en note.
