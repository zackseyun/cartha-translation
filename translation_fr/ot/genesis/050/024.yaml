review_pass:
  verdict: revise
  source_fidelity: Le sens de אָנֹכִי מֵת (« je vais mourir ») est bien rendu, de même que le contraste introduit par « mais », l’insistance de פָּקֹד יִפְקֹד et l’image causative de « fera monter ». Toutefois, « le pays qu’il a juré à Abraham » n’est pas une construction française recevable. Le texte hébreu laisse sous-entendu le contenu du serment; en français, « qu’il a juré de donner » est la manière naturelle de rendre cette ellipse sans en modifier le sens contextuel.
  naturalness: La formulation générale est digne et accessible. « Interviendra certainement en votre faveur » est possible, mais explicite davantage l’action que ne le fait le verbe hébreu. « S’occupera certainement de vous » conserve mieux la portée large de l’idiome tout en restant naturel. La correction de la relative finale est nécessaire.
  terminology: « Frères », « Dieu », « pays » et les noms des patriarches sont appropriés. La répétition de « à » dans la formule patriarcale est naturelle et reflète bien l’emphase de la source. La note doit présenter « visitera » comme une option de rendu de l’idiome, non comme un littéral strict.
  issues:
  - severity: high
    issue: 'Construction fautive ou elliptique de manière non idiomatique : « le pays qu’il a juré à Abraham ».'
    rationale: En français, on ne peut pas normalement « jurer un pays à quelqu’un ». L’hébreu emploie une ellipse après « jurer », mais le français exige de préciser le contenu du serment ou de reformuler la relation au pays.
  - severity: medium
    issue: La note qualifie « vous visitera certainement » de rendu « littéral ».
    rationale: פקד est polysémique et « visiter » est un rendu traditionnel possible, mais non un équivalent littéral univoque dans ce contexte. Une note d’alternative idiomatique est plus exacte.
  - severity: low
    issue: « Interviendra certainement en votre faveur » restreint légèrement l’idiome.
    rationale: Le contexte implique bien l’action favorable de Dieu, mais פקד conserve l’idée plus large d’attention efficace. « S’occupera certainement de vous » maintient cette latitude.
  revised_text: 'Joseph dit à ses frères : « Je vais mourir, mais Dieu s’occupera certainement de vous[a] et vous fera monter de ce pays vers le pays qu’il a juré de donner à Abraham, à Isaac et à Jacob. »'
  revised_footnotes:
