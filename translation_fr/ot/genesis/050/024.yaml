revisions:
- from: 'Joseph dit à ses frères : « Je vais mourir, mais Dieu interviendra certainement en votre faveur[a] et vous fera monter de ce pays vers le pays qu’il a juré à Abraham, à Isaac et à Jacob. »'
  to: 'Joseph dit à ses frères : « Je vais mourir, mais Dieu s’occupera certainement de vous[a] et vous fera monter de ce pays vers le pays qu’il a juré de donner à Abraham, à Isaac et à Jacob. »'
  rationale: 'La révision résout la construction française défectueuse concernant le serment, tout en rendant explicite seulement ce que le contexte et la syntaxe hébraïque impliquent nécessairement : le pays est celui que Dieu a juré de donner aux patriarches. Elle adopte pour פקד יפקד un verbe français large et naturel, puis conserve « visitera » comme alternative en note avec une explication non réductrice de l’idiome.'
