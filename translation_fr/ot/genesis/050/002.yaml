id: GEN.50.2
reference: Genesis 50:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְצַ֨ו יוֹסֵ֤ף אֶת עֲבָדָי/ו֙ אֶת הָ/רֹ֣פְאִ֔ים לַ/חֲנֹ֖ט אֶת אָבִ֑י/ו וַ/יַּחַנְט֥וּ הָ/רֹפְאִ֖ים אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: fr
  text: Puis Joseph ordonna à ses serviteurs[a], les médecins, d’embaumer son père[b], et les médecins embaumèrent Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves »; le terme hébreu peut désigner des serviteurs ou des esclaves selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte « Israël », c’est-à-dire Jacob.
    reason: clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: ordonna
  rationale: Le verbe צוה exprime ici une directive donnée avec autorité; « ordonna » en conserve clairement la force.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עבד peut désigner des serviteurs ou des esclaves. Dans ce contexte administratif, leur fonction auprès de Joseph est au premier plan; « serviteurs » convient donc, avec une note signalant l’autre possibilité.
- source_word: הָרֹפְאִים
  choice: les médecins
  rationale: Le participe de רפא désigne ceux qui pratiquent l’art de guérir; « médecins » est naturel en français et convient au cadre de la cour égyptienne.
- source_word: לַחֲנֹט
  choice: d’embaumer
  rationale: Dans ce contexte égyptien, חנט désigne précisément l’embaumement d’un corps.
- source_word: אָבִיו
  choice: son père
  rationale: Traduction directe du nom avec suffixe possessif.
- source_word: וַיַּחַנְטוּ
  choice: embaumèrent
  rationale: La répétition de חנט est maintenue afin de préserver la structure et la progression du texte hébreu.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie explicitement « Israël » plutôt que « Jacob »; ce choix de nom est conservé.
theological_decisions:
- issue: Traduction de עבד dans le cadre de la maison de Joseph
  choice: serviteurs
  alternative: esclaves
  rationale: Le statut de dépendance est lexicalement possible, mais le verset met surtout l’accent sur la fonction de ces hommes, identifiés comme médecins. La note préserve l’ambiguïté sociale du terme.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La répétition de « les médecins » et du verbe « embaumer » suit délibérément la formulation hébraïque.
