revisions:
- from: 'Alors Abimélek appela Abraham et lui dit : « Qu’est-ce que tu nous as fait ? En quoi ai-je péché contre toi[a], pour que tu aies fait venir sur moi et sur mon royaume un si grand péché ? Tu as commis envers moi des actes qui ne doivent pas se faire[b]. »'
  to: 'Alors Abimélek appela Abraham et lui dit : « Qu’est-ce que tu nous as fait ? En quoi ai-je péché contre toi[a], pour que tu aies fait venir sur moi et sur mon royaume un grand péché ? Tu as agi envers moi d’une manière qui ne se fait pas[b]. »'
  rationale: La révision supprime l’intensification non requise de « si » et remplace une expression française maladroite par une tournure idiomatique qui rend l’idiome hébreu « faire/agir avec quelqu’un », sans affaiblir la portée normative de la proposition finale. Les ancres et le contenu des notes restent correctement alignés sur les éléments concernés.
