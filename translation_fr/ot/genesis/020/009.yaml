base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: fr
  text: 'Alors Abimélek appela Abraham et lui dit : « Qu’est-ce que tu nous as fait ? En quoi ai-je péché contre toi[a], pour que tu aies fait venir sur moi et sur mon royaume un grand péché ? Tu as agi envers moi d’une manière qui ne se fait pas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quel péché ai-je commis contre toi ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des actes qui ne se font pas » ; la tournure peut désigner ce qui est socialement et moralement inadmissible.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Avec לְ devant la personne appelée, קרא peut signifier « appeler » ou « convoquer ». « Appela » garde le mouvement narratif sans donner à la scène un caractère officiel excessif.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: Qu’est-ce que tu nous as fait ?
  rationale: Traduction directe et naturelle de l’interrogation, qui exprime aussi les conséquences présentes de l’acte d’Abraham.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: En quoi ai-je péché contre toi
  rationale: « En quoi » rend idiomatiquement מֶה dans cette question, tandis que « péché contre toi » conserve la portée morale et religieuse de חטא.
- source_word: כִּי
  choice: pour que
  rationale: 'Dans cette plainte rhétorique, כִּי introduit la conséquence de l’offense supposée : l’action d’Abraham a exposé Abimélek et son royaume à un grand péché.'
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: tu aies fait venir sur moi et sur mon royaume
  rationale: Le hifil de בוא exprime ici le fait de provoquer la venue d’un mal ou d’une faute sur quelqu’un.
- source_word: חֲטָאָה גְדֹלָה
  choice: un si grand péché
  rationale: « Péché » préserve le poids moral de חטאה et fait écho au verbe חטא de la question précédente. « Si grand » convient à l’intensité de l’accusation en français.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: des actes qui ne doivent pas se faire
  rationale: La tournure passive exprime vraisemblablement une norme sociale et morale, et non seulement une constatation d’usage.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: Tu as commis envers moi
  rationale: La construction עשה עם décrit la manière d’agir envers quelqu’un. Avec « des actes » placé comme complément, « commis envers moi » donne une accusation naturelle et ferme.
theological_decisions:
- issue: Sens de חֲטָאָה dans la menace pesant sur le roi et son royaume
  choice: péché
  alternative: faute grave / culpabilité
  rationale: Le contexte associe l’acte envisagé à une transgression morale devant Dieu. « Péché » conserve cette dimension sans préciser davantage la nature ou le mode de la culpabilité collective.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle entre les deux protagonistes. La répétition de « péché » est conservée afin de refléter le lien lexical et rhétorique du texte hébreu.
