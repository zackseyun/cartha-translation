review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au texte hébreu : Abimélek interroge Abraham sur le tort subi, nie avoir péché contre lui, puis l’accuse d’avoir exposé le roi et son royaume à « un grand péché ». La valeur normative de מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ est bien conservée. Toutefois, « un si grand péché » ajoute une nuance intensive-déictique que גְדֹלָה n’exprime pas nécessairement ; « un grand péché » est plus exact.'
  naturalness: Le texte est globalement naturel et d’un registre approprié. En revanche, « Tu as commis envers moi des actes » est une collocation lourde et peu idiomatique en français moderne. « Tu m’as fait subir des actes » serait également maladroit ; la formulation « Tu as agi envers moi d’une manière qui ne se fait pas » est naturelle, garde l’accusation, et rend convenablement l’idiome עשה עם.
  terminology: « Péché » est un choix justifié pour חטא / חֲטָאָה et préserve le lien rhétorique du verset. « Royaume » convient à מַמְלַכְתִּי. « Abimélek » est une graphie française moderne recevable et cohérente.
  issues:
  - severity: low
    issue: « un si grand péché »
    rationale: L’adverbe « si » renforce le qualificatif et peut suggérer une comparaison ou un degré déjà établi. L’hébreu porte simplement « un grand péché ».
  - severity: medium
    issue: « Tu as commis envers moi des actes »
    rationale: La construction est peu naturelle en français moderne. Elle rend de façon trop littérale l’idiome עָשָׂה עִם (« agir envers / traiter ») et alourdit inutilement la dernière accusation.
