  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: fr
  text: 'Alors Dieu lui dit dans le rêve[a] : « Oui, je sais que tu as agi ainsi dans l’intégrité de ton cœur. Moi aussi, je t’ai retenu de pécher contre moi. C’est pourquoi je ne t’ai pas laissé la toucher[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un rêve ». L’hébreu peut être compris de manière indéfinie, bien que l’article favorise ici « dans le rêve ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « la toucher » est une expression retenue qui désigne un contact sexuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: dans le rêve
  rationale: L’article préfixé favorise le défini et renvoie au rêve précis dans lequel Dieu s’adresse déjà à Abimélek ; la possibilité d’un sens indéfini est signalée en note.
- source_word: גַּם אָנֹכִי
  choice: Oui, je / Moi aussi, je
  rationale: La première occurrence souligne l’acquiescement et la connaissance de Dieu ; la seconde conserve la reprise emphatique et met en relief l’intervention divine.
- source_word: בְתָם לְבָבְךָ
  choice: dans l’intégrité de ton cœur
  rationale: תֹּם exprime l’intégrité ou la droiture intérieure sans imposer l’idée plus forte d’une innocence juridique absolue.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: je t’ai retenu
  rationale: חָשַׂךְ indique ici que Dieu a empêché ou retenu Abimélek d’accomplir l’acte envisagé.
- source_word: מֵחֲטוֹא לִי
  choice: de pécher contre moi
  rationale: La construction avec מִן exprime l’action empêchée, tandis que לִי présente Dieu comme celui contre qui la faute aurait été commise.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette expression introduit naturellement en français la conséquence concrète de l’intervention divine.
- source_word: לֹא נְתַתִּיךָ
  choice: je ne t’ai pas laissé
  rationale: Avec l’infinitif qui suit, נָתַן a ici le sens idiomatique de permettre ou laisser faire.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: la toucher
  rationale: La traduction conserve l’expression sobre de l’hébreu, qui désigne dans ce contexte un contact sexuel.
theological_decisions:
- issue: Sens de « pécher contre moi » dans la parole divine
  choice: La faute envisagée est explicitement présentée comme un péché contre Dieu.
  alternative: 'Comprendre plus généralement : « m’offenser » ou « devenir coupable devant moi ».'
  rationale: Le pronom לִי rattache directement la faute à Dieu, sans nier ses torts envers Sara et Abraham ni développer une doctrine au-delà de ce qu’affirme le verset.
- issue: Rapport entre l’intégrité d’Abimélek et l’intervention de Dieu
  choice: Conserver côte à côte la sincérité reconnue d’Abimélek et l’action préventive de Dieu.
  alternative: Faire de l’une la cause exclusive de l’absence de faute ou atténuer l’intervention divine.
  rationale: Le texte affirme à la fois l’intégrité du cœur d’Abimélek et le fait que Dieu l’a retenu ; la traduction ne résout pas artificiellement cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse directe au singulier. La formulation conserve la sobriété narrative, la répétition emphatique de גַּם אָנֹכִי et l’euphémisme du texte source.
