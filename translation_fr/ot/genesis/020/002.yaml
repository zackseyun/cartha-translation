  text: וַ/יֹּ֧אמֶר אַבְרָהָ֛ם אֶל שָׂרָ֥ה אִשְׁתּ֖/וֹ אֲחֹ֣תִ/י הִ֑וא וַ/יִּשְׁלַ֗ח אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַ/יִּקַּ֖ח אֶת שָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: fr
  text: 'Abraham dit au sujet de Sara, sa femme[a] : « C’est ma sœur. » Alors Abimélek, roi de Guérar, envoya chercher Sara et la prit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à Sara, sa femme ». La préposition hébraïque peut avoir ce sens plus habituel, mais le contexte favorise l’idée qu’Abraham parlait au sujet de Sara, puisque la déclaration rapportée est : « C’est ma sœur. »'
    reason: lexical_alternative
  - marker: b
    text: 'C’est-à-dire qu’Abimélek fit amener Sara auprès de lui ; l’hébreu dit simplement : « envoya et prit Sara » et ne précise pas ici qu’il la prit pour femme.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe אמר au wayyiqtol est le verbe narratif courant pour introduire une parole ; « dit » est son équivalent français naturel.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: au sujet de Sara, sa femme
  rationale: Même si אֶל signifie habituellement « à », la déclaration à la troisième personne (« C’est ma sœur ») favorise ici le sens de paroles prononcées au sujet de Sara. La note conserve l’autre lecture possible.
- source_word: אֲחֹתִי הִוא
  choice: C’est ma sœur
  rationale: Cette formulation française rend naturellement la proposition nominale hébraïque et le suffixe de première personne sur « sœur ».
- source_word: וַיִּשְׁלַח
  choice: envoya chercher
  rationale: Le verbe signifie littéralement « envoya ». Comme aucun objet n’est exprimé et que l’action suivante est de prendre Sara, « envoya chercher » restitue en français l’action implicite sans préciser l’identité des envoyés.
- source_word: מֶלֶךְ גְּרָר
  choice: roi de Guérar
  rationale: Le groupe construit indique la fonction royale d’Abimélek et le territoire sur lequel il règne.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: la prit
  rationale: Le verbe לקח signifie simplement « prendre ». La traduction n’ajoute ni « pour femme » ni « dans sa maison », afin de ne pas préciser davantage que le texte hébreu.
theological_decisions:
- issue: Portée de l’action d’Abimélek envers Sara
  choice: la prit
  alternative: la prit pour femme
  rationale: Le contexte laisse entendre qu’Abimélek fait amener Sara auprès de lui, mais ce verset ne dit pas explicitement qu’il la prend pour femme. La formulation sobre maintient cette réserve du texte.
- issue: Destinataire ou objet des paroles d’Abraham
  choice: au sujet de Sara, sa femme
  alternative: à Sara, sa femme
  rationale: La préposition hébraïque permet formellement la lecture « à Sara », mais la parole citée est à la troisième personne et s’adresse vraisemblablement à d’autres. Le texte principal retient donc le sens contextuellement le plus probable, tout en signalant l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises courantes « Sara », « Abimélek » et « Guérar ». La ponctuation française introduit naturellement la citation, tandis que les notes préservent l’ambiguïté de la préposition et la sobriété du verbe « prendre ».
