  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין יִרְאַ֣ת אֱלֹהִ֔ים בַּ/מָּק֖וֹם הַ/זֶּ֑ה וַ/הֲרָג֖וּ/נִי עַל דְּבַ֥ר אִשְׁתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: fr
  text: 'Abraham dit : « Car je me suis dit : “Il n’y a certainement pas de crainte de Dieu dans cet endroit, et ils me tueront à cause de ma femme.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: C’est que
  rationale: Introduit naturellement en français l’explication donnée par Abraham, avec une valeur causale adaptée au dialogue.
- source_word: אָמַרְתִּי
  choice: je me suis dit
  rationale: Le verbe signifie littéralement « dire », mais le contexte présente le raisonnement intérieur d’Abraham ; cette tournure française le rend clairement sans en modifier le sens.
- source_word: רַק
  choice: certainement
  rationale: Rend ici la force emphatique de l’adverbe dans l’hypothèse arrêtée d’Abraham, plutôt que son sens restrictif littéral « seulement ».
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: il n’y a certainement aucune crainte de Dieu
  rationale: Conserve l’expression biblique « crainte de Dieu » et sa portée morale et religieuse ; « aucune » s’accorde naturellement avec l’emphase portée par רַק.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: dans cet endroit
  rationale: Traduction directe et naturelle de la locution, sans élargir arbitrairement le référent à toute une région.
- source_word: וַהֲרָגוּנִי
  choice: et ils me tueront
  rationale: Le futur exprime l’issue qu’Abraham anticipait dans son discours intérieur.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: à cause de ma femme
  rationale: 'Rend clairement l’expression causale : Abraham craignait d’être tué en raison de son lien avec sa femme.'
theological_decisions:
- issue: Sens de יִרְאַת אֱלֹהִים
  choice: crainte de Dieu
  alternative: respect pour Dieu
  rationale: Le choix maintient l’image et la tension propres à l’hébreu, où la « crainte de Dieu » désigne une conscience religieuse et morale qui retient de commettre le mal, sans réduire le terme à la seule terreur.
translation_notes:
  register: Français international moderne, naturel et digne. « Répondit » convient au tour narratif וַיֹּאמֶר dans cet échange. Les guillemets imbriqués distinguent la réponse d’Abraham de son raisonnement antérieur.
