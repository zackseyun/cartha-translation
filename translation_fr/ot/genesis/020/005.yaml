base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: fr
  text: 'Ne m’a-t-il pas dit lui-même : « C’est ma sœur » ? Et elle aussi a dit : « C’est mon frère. » C’est avec un cœur intègre et des mains innocentes que j’ai fait cela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « J’ai fait cela dans l’intégrité de mon cœur et la pureté de mes mains. » L’hébreu emploie des expressions morales et juridiques qui évoquent la sincérité des intentions et l’innocence des actes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne… pas ?
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative ; la tournure négative française en préserve la force.
- source_word: הוּא אָמַר לִי
  choice: m’a-t-il pas dit lui-même
  rationale: Le pronom indépendant הוּא porte une emphase rendue par « lui-même », tandis que אמר לי est naturellement traduit par « m’a dit ».
- source_word: אֲחֹתִי הִוא
  choice: C’est ma sœur
  rationale: Cette formulation française naturelle exprime directement la relation de parenté affirmée en hébreu.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: Et elle aussi a dit elle-même
  rationale: « aussi » rend גם et « elle-même » conserve l’emphase du pronom indépendant, sans supprimer leur effet cumulatif.
- source_word: אָחִי הוּא
  choice: C’est mon frère
  rationale: Équivalent français direct et idiomatique de la déclaration de parenté.
- source_word: בְּתָם לְבָבִי
  choice: avec un cœur intègre
  rationale: תָם désigne ici l’intégrité ou la droiture de l’intention ; la formulation conserve l’image du cœur tout en restant naturelle.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: et des mains innocentes
  rationale: נִקְיֹן exprime la pureté ou l’absence de culpabilité ; les « mains » représentent les actes et la responsabilité morale.
- source_word: עָשִׂיתִי זֹאת
  choice: j’ai fait cela
  rationale: Le passé composé convient à cette défense portant sur un acte accompli dont les conséquences sont encore présentes.
theological_decisions:
- issue: Portée de la revendication morale et juridique d’Abimélek
  choice: Présenter l’intégrité du cœur et l’innocence des mains comme sa défense concernant cet acte précis.
  alternative: Employer des termes pouvant suggérer une perfection morale absolue, comme « un cœur irréprochable » et « des mains pures ».
  rationale: Dans le contexte, Abimélek plaide sa sincérité et son absence de culpabilité dans cette affaire ; le texte ne formule pas une doctrine de son impeccabilité générale.
translation_notes:
  register: Français international moderne, digne et accessible. Les répétitions emphatiques de l’hébreu sont conservées malgré une légère lourdeur voulue, et les images du cœur et des mains restent visibles.
