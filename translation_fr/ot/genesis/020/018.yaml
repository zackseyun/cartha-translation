  text: כִּֽי עָצֹ֤ר עָצַר֙ יְהוָ֔ה בְּעַ֥ד כָּל רֶ֖חֶם לְ/בֵ֣ית אֲבִימֶ֑לֶךְ עַל דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: fr
  text: Car Yahweh avait complètement fermé toute matrice dans la maison d’Abimélek, à cause de Sara[a], femme d’Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce le verbe « fermer » par un infinitif absolu; on pourrait aussi traduire : « avait bel et bien fermé ».'
    reason: Signaler l’emphase de la construction hébraïque sans remplacer dans le texte principal l’image de la matrice fermée.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de ce qui précède et assure naturellement le lien discursif en français.
- source_word: עָצֹר עָצַר
  choice: avait rendu totalement stériles
  rationale: La construction avec infinitif absolu intensifie l’action; cette formulation exprime clairement en français l’empêchement complet de concevoir, implicite dans l’image hébraïque de la fermeture des matrices.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: בְּעַד כָּל רֶחֶם
  choice: toutes les femmes
  rationale: L’hébreu dit littéralement « toute matrice »; la métonymie désigne ici les femmes susceptibles d’enfanter. La formulation retenue est naturelle et évite l’étrangeté de « fermer toute matrice » en français courant.
- source_word: לְבֵית אֲבִימֶלֶךְ
  choice: de la maison d’Abimélek
  rationale: « Maison » désigne la maisonnée ou le foyer d’Abimélek, non seulement un bâtiment.
- source_word: עַל דְּבַר שָׂרָה
  choice: à cause de Sara
  rationale: Dans ce contexte, la locution indique la cause du jugement.
- source_word: אֵשֶׁת אַבְרָהָם
  choice: femme d’Abraham
  rationale: Rend simplement la relation exprimée par la chaîne construite hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Nature de l’empêchement touchant la maison d’Abimélek
  choice: avait rendu totalement stériles toutes les femmes
  alternative: avait complètement fermé toute matrice
  rationale: Le rendu idiomatique explicite l’effet reproductif de l’image hébraïque sans préciser au-delà du texte la durée ou le mécanisme de cette stérilité.
translation_notes:
  register: Français international moderne, clair et digne. Le corps du verset privilégie une expression idiomatique immédiatement compréhensible; la note conserve l’image littérale et l’intensité de l’hébreu.
