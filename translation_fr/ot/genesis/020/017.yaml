base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: fr
  text: Alors Abraham pria Dieu, et Dieu guérit Abimélec, sa femme et ses servantes[a], et elles enfantèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner des femmes esclaves.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et elles enfantèrent ». Le contexte immédiat relie cet événement à la guérison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: pria
  rationale: Le hitpael de פלל signifie couramment « prier ». Le contexte implique une intercession, sans que le verbe exige de l’expliciter.
- source_word: אֶל הָאֱלֹהִים
  choice: Dieu
  rationale: 'En français naturel, la préposition « à » appelée par « prier » est omise devant le complément direct : « prier Dieu ».'
- source_word: וַיִּרְפָּא
  choice: guérit
  rationale: רפא signifie directement « guérir » ; ce choix n’impose pas une description plus précise du mal.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Transcription française courante du nom propre hébreu.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Équivalent direct et naturel du syntagme possessif.
- source_word: אַמְהֹתָיו
  choice: ses servantes
  rationale: אָמָה désigne des femmes en situation de service et peut aussi désigner des esclaves. « Servantes » reste naturel et concis, tandis qu’une note conserve la nuance sociale possible.
- source_word: וַיֵּלֵדוּ
  choice: elles purent de nouveau avoir des enfants
  rationale: Le verbe ילד signifie « enfanter ». Dans le contexte immédiat de la guérison et de la fermeture des matrices explicitée au verset suivant, cette formulation française exprime la reprise de la capacité d’enfanter sans suggérer nécessairement un accouchement instantané.
theological_decisions:
- issue: Rapport entre la guérison et le dernier verbe
  choice: Conserver la coordination « et », tout en rendant contextuellement la restauration de la capacité d’avoir des enfants.
  alternative: « et elles enfantèrent »
  rationale: Le waw hébreu marque formellement la suite du récit, tandis que le verset 18 montre que l’effet de la guérison concerne la capacité d’enfanter. La traduction évite de transformer explicitement la coordination en proposition de but ou de résultat.
- issue: Nuance de statut social de אָמָה
  choice: « servantes » dans le texte principal
  alternative: « femmes esclaves »
  rationale: Le terme peut couvrir le service domestique et l’esclavage. Le texte principal garde une formulation française fluide, et la note signale la portée sociale plus forte possible.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique. « Abimélek » suit une transcription française usuelle. Les deux marqueurs de note figurent dans le texte principal.
