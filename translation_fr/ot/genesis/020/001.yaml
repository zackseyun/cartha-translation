  text: וַ/יִּסַּ֨ע מִ/שָּׁ֤ם אַבְרָהָם֙ אַ֣רְצָ/ה הַ/נֶּ֔גֶב וַ/יֵּ֥שֶׁב בֵּין קָדֵ֖שׁ וּ/בֵ֣ין שׁ֑וּר וַ/יָּ֖גָר בִּ/גְרָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: fr
  text: De là, Abraham partit en direction du Néguev[a] et s’établit entre Qadesh et Shour ; il séjourna comme étranger à Guérar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers le sud ». Le terme hébreu peut désigner soit la région méridionale appelée le Néguev, soit plus généralement une direction vers le sud ; le texte retient ici la référence géographique probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: partit
  rationale: Le verbe נסע au qal exprime ici le départ et la mise en route. « Partit » rend naturellement le mouvement narratif en français moderne.
- source_word: מִשָּׁם
  choice: De là
  rationale: Cette expression déictique renvoie au lieu précédent ; « De là » est la formulation française la plus directe.
- source_word: אַרְצָה הַנֶּגֶב
  choice: en direction du Néguev
  rationale: Le hé directionnel de אַרְצָה indique un mouvement vers une région. הַנֶּגֶב désigne vraisemblablement ici la région méridionale appelée le Néguev, tout en permettant le sens plus général « vers le sud », conservé en note.
- source_word: וַיֵּשֶׁב
  choice: s’établit
  rationale: ישב peut signifier habiter ou s’établir. Ici, « s’établit » convient à la résidence d’Abraham dans la zone située entre deux lieux nommés.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: entre Qadesh et Shour
  rationale: La construction situe simplement Abraham entre deux lieux. Les toponymes sont translittérés selon des formes françaises reconnaissables.
- source_word: וַיָּגָר
  choice: séjourna comme étranger
  rationale: גור ne signifie pas seulement habiter, mais résider sans être autochtone ni pleinement établi. « Séjourna comme étranger » préserve explicitement cette nuance dans un français compréhensible.
- source_word: בִּגְרָר
  choice: à Guérar
  rationale: La préposition locative devant le nom de ville se rend naturellement en français par « à ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation distingue l’établissement dans une région du séjour à Guérar en qualité d’étranger, sans effacer la nuance juridique et sociale de גור.
