  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל אֲבִימֶ֖לֶךְ בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִנְּ/ךָ֥ מֵת֙ עַל הָ/אִשָּׁ֣ה אֲשֶׁר לָקַ֔חְתָּ וְ/הִ֖וא בְּעֻ֥לַת בָּֽעַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: fr
  text: 'Mais Dieu vint trouver Abimélek dans un rêve, pendant la nuit, et lui dit : « Tu vas mourir[a] à cause de la femme que tu as prise, car elle est mariée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Te voilà mort » ou « Tu es mort ». L’hébreu annonce ici une mort certaine et imminente.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle est possédée par un mari », c’est-à-dire qu’elle a déjà un mari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint trouver
  rationale: Le verbe בוא marque ici la venue de Dieu auprès d’Abimélek dans le cadre d’un rêve. « Vint trouver » est naturel en français et n’implique pas une entrée physique dans un lieu.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: dans un rêve, pendant la nuit
  rationale: Cette formulation rend clairement le caractère nocturne du rêve tout en conservant les deux éléments de l’expression hébraïque.
- source_word: הִנְּךָ מֵת
  choice: Tu vas mourir
  rationale: La construction présente la mort comme un jugement certain et imminent. En français moderne, « Tu vas mourir » restitue cette force sans prétendre qu’Abimélek est déjà mort.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  choice: à cause de la femme que tu as prise
  rationale: « À cause de » exprime le motif du jugement, et « prise » reste proche de לקח sans introduire une violence que le verbe ne précise pas.
- source_word: בְּעֻלַת בָּעַל
  choice: elle est mariée
  rationale: L’expression indique qu’elle est liée à un mari. « Elle est mariée » est la formulation française la plus naturelle et préserve l’essentiel de son statut conjugal existant.
theological_decisions:
- issue: Valeur temporelle et judiciaire de הִנְּךָ מֵת
  choice: Tu vas mourir
  alternative: Te voilà mort / Tu es un homme mort
  rationale: L’hébreu peut se formuler littéralement au présent tout en annonçant une mort certaine et imminente. Le futur proche français communique naturellement cette menace sans en atténuer la certitude.
- issue: Portée de בְּעֻלַת בָּעַל
  choice: elle est mariée
  alternative: elle a un mari / elle appartient à un mari
  rationale: Le contexte exige de rendre le lien conjugal déjà existant. « Elle est mariée » évite de transformer l’idiome ancien en affirmation générale de propriété, tout en conservant le fondement moral et relationnel de l’avertissement.
translation_notes:
  register: Français international moderne, sobre et narratif. « Abimélek » suit une translittération française courante. Le discours direct demeure solennel sans employer l’archaïsant « Voici, tu es mort ».
