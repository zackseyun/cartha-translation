  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה רָאִ֔יתָ כִּ֥י עָשִׂ֖יתָ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/010.yaml
  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: fr
  text: 'Puis Abimélek dit à Abraham : « Qu’as-tu vu[a], pour que tu aies fait cela ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’avais-tu en tête, pour que tu aies fait cela ? » L’hébreu dit littéralement : « Qu’as-tu vu… ? » Ici, « voir » peut désigner ce qu’Abraham avait perçu ou envisagé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » en restitue naturellement la succession en français moderne.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Translittération française courante du nom propre hébreu.
- source_word: אֶל־אַבְרָהָם
  choice: à Abraham
  rationale: La préposition introduit ici le destinataire de la parole ; les deux-points rendent naturellement le discours direct.
- source_word: מָה רָאִיתָ
  choice: Qu’as-tu vu
  rationale: 'Cette formulation conserve l’image hébraïque de la vision tout en laissant ouverte sa valeur idiomatique : ce qu’Abraham avait perçu, envisagé ou à l’esprit.'
- source_word: כִּי עָשִׂיתָ
  choice: pour agir
  rationale: Dans cette question portant sur le motif, « pour » établit en français un lien naturel entre ce qu’Abraham avait en vue et son comportement, sans remplacer l’image de « voir » par une explication.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ainsi
  rationale: L’expression signifie littéralement « cette chose ». Dans ce contexte, « agir ainsi » est une tournure française naturelle qui renvoie clairement à l’acte reproché sans lui ajouter une qualification morale.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La question demeure vive et directe. L’image hébraïque « voir » est conservée dans le texte, tandis que la note explicite son emploi idiomatique.
