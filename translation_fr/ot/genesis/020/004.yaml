source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: fr
  text: 'Abimélek ne s’était pas approché d’elle[a]. Il dit donc : « Seigneur, vas-tu tuer même une nation juste[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « s’approcher d’elle » signifie ici avoir des relations sexuelles avec elle.
    reason: cultural_note
  - marker: b
    text: Ou « un peuple juste » ; dans ce contexte, « juste » peut aussi avoir le sens d’« innocent ». Le mot hébreu traduit par « nation » désigne collectivement un peuple ou une nation.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: ne s’était pas approché d’elle
  rationale: La formulation conserve l’image hébraïque « s’approcher d’elle », qui, dans ce contexte, désigne implicitement des relations sexuelles. Une note explicite l’idiome sans remplacer dans le texte son expression concrète.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Abimélek s’adresse à Dieu dans le rêve. « Seigneur » rend naturellement le titre sans ajouter « Dieu », absent de l’hébreu.
- source_word: גּוֹי
  choice: nation
  rationale: Le nom collectif désigne une nation ou un peuple. « Nation » préserve ici la portée collective de la supplication d’Abimélek sans la réduire à sa seule personne ou à sa maisonnée.
- source_word: גַּם
  choice: même
  rationale: Dans cette question rhétorique, « même » restitue la valeur emphatique de גַּם.
- source_word: צַדִּיק
  choice: juste
  rationale: « Juste » maintient le lien lexical avec le vocabulaire biblique de la justice, tout en pouvant exprimer ici l’absence de culpabilité dans l’affaire évoquée.
- source_word: תַּהֲרֹג
  choice: vas-tu tuer
  rationale: Cette formulation directe et actuelle rend bien l’imparfait hébreu dans la question rhétorique, sans recourir au plus littéraire « feras-tu périr ».
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: Abimélek… Il dit donc
  rationale: La succession narrative est exprimée sans ajouter un marqueur temporel absent du texte. « Donc » fait ressortir le lien logique entre l’absence de relations et la protestation d’Abimélek.
theological_decisions:
- issue: Portée collective de גּוֹי dans la supplication d’Abimélek
  choice: une nation juste
  alternative: un peuple juste ; une nation innocente
  rationale: Le texte présente l’entité menacée comme une collectivité et non comme le roi seul. La traduction conserve cette portée ainsi que la tension entre la justice revendiquée par Abimélek et la menace divine, sans préciser au-delà du texte l’étendue politique ou familiale du groupe.
- issue: Sens de צַדִּיק dans ce contexte
  choice: juste
  alternative: innocente
  rationale: Le terme peut désigner la justice morale ou l’innocence relativement à une faute précise. « Juste » préserve l’éventail théologique du mot, tandis que la note signale le sens contextuel possible d’« innocente ».
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste accessible, et le discours direct conserve la force de la question rhétorique. Les marqueurs [a] et [b] correspondent au contenu réel des notes plutôt qu’à l’ordre incohérent des notes de la couche anglaise fournie.
