source:
  edition: WLC
  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: fr
  text: 'D’ailleurs[a], elle est vraiment ma sœur : elle est la fille de mon père, mais non la fille de ma mère, et elle est devenue ma femme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Et de fait, elle est ma sœur, fille de mon père, mais non fille de ma mère. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: D’ailleurs
  rationale: La conjonction accompagnée de la particule additive introduit un argument supplémentaire dans la défense d’Abraham ; « D’ailleurs » rend naturellement cette fonction discursive.
- source_word: אָמְנָה
  choice: vraiment
  rationale: L’adverbe affirme la véracité de la déclaration ; « vraiment » convient à un discours explicatif en français moderne.
- source_word: אֲחֹתִי
  choice: ma sœur
  rationale: Rend directement le terme de parenté avec le suffixe de première personne.
- source_word: בַת אָבִי
  choice: la fille de mon père
  rationale: Cette apposition précise en quel sens Sara est la sœur d’Abraham et conserve la formulation familiale explicite de l’hébreu.
- source_word: הִוא
  choice: elle est
  rationale: La proposition nominale hébraïque appelle naturellement le présent en français.
- source_word: אַךְ לֹא
  choice: mais pas
  rationale: La particule apporte ici une restriction à l’affirmation précédente ; « mais pas » exprime clairement cette qualification sans la surinterpréter.
- source_word: בַת אִמִּי
  choice: celle de ma mère
  rationale: La reprise pronominale évite une lourdeur en français tout en maintenant le parallélisme et le sens exact de « fille de ma mère ».
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: Puis elle est devenue ma femme
  rationale: La construction avec היה et לְאִשָּׁה décrit l’entrée dans la relation matrimoniale ; « est devenue ma femme » en préserve la valeur événementielle, tandis que « Puis » rend la progression narrative du wayyiqtol.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’affirmation d’Abraham et sa qualification familiale sans tenter de résoudre les questions historiques, morales ou théologiques que soulève le passage.
