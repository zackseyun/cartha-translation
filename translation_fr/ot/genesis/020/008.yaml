  text: וַ/יַּשְׁכֵּ֨ם אֲבִימֶ֜לֶךְ בַּ/בֹּ֗קֶר וַ/יִּקְרָא֙ לְ/כָל עֲבָדָ֔י/ו וַ/יְדַבֵּ֛ר אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/אָזְנֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/אֲנָשִׁ֖ים מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: fr
  text: Abimélek se leva de bon matin, appela tous ses serviteurs et leur dit toutes ces choses. Ces hommes furent très effrayés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: se leva de bon matin
  rationale: Le verbe שׁכם au hifil exprime le fait de se lever tôt; « de bon matin » restitue naturellement en français l’expression hébraïque complète.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: appela tous ses serviteurs
  rationale: קרא avec ל signifie ici appeler ou convoquer. Dans ce cadre royal, עֲבָדָיו désigne vraisemblablement les serviteurs ou officiers d’Abimélek, sans mettre l’accent sur leur statut juridique d’esclaves.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה בְּאָזְנֵיהֶם
  choice: leur rapporta tout ce qui s’était passé
  rationale: Littéralement, Abimélek « dit toutes ces choses à leurs oreilles ». Dans le contexte, il leur communique les événements et paroles précédents; cette formulation française rend l’idiome sans lourdeur.
- source_word: וַיִּירְאוּ ... מְאֹד
  choice: eurent très peur
  rationale: ירא désigne ici la peur suscitée par le récit d’Abimélek, et מְאֹד en marque l’intensité. Le passé simple convient au récit français.
- source_word: הָאֲנָשִׁים
  choice: ces hommes
  rationale: Le nom hébreu est explicitement masculin pluriel et renvoie aux serviteurs qui viennent d’être mentionnés; le démonstratif rend cette reprise clairement en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement dépliée pour éviter la répétition pesante des coordinations hébraïques, tout en conservant la succession des actions et la désignation masculine du groupe.
