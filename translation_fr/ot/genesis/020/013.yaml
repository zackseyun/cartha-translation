  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: fr
  text: 'Lorsque Dieu m’a fait errer loin de la maison de mon père[a], je lui ai dit : « Voici la bonté que tu me feras[b] : partout où nous arriverons, dis à mon sujet : “C’est mon frère.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se traduire : « lorsque les dieux m’ont fait errer loin de la maison de mon père ». Le nom אֱלֹהִים peut désigner Dieu ou des dieux, et le verbe est ici au pluriel ; le contexte favorise cependant « Dieu ». Le verbe causatif évoque l’errance ou le fait d’aller çà et là, sans impliquer nécessairement un égarement moral.'
    reason: ambiguïté grammaticale et lexicale
  - marker: b
    text: Le mot hébreu traduit par « bonté » (ḥèsèd) peut aussi exprimer une bonté fidèle, la loyauté ou un amour constant, selon le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: הִתְעוּ אֹתִי
  choice: m’a fait mener une vie errante
  rationale: Cette formulation conserve la valeur causative du hifil de תעה tout en évitant que « égarer » suggère nécessairement une faute morale ou une tromperie.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte du récit et du discours d’Abraham, le référent le plus probable est le Dieu d’Abraham. L’accord verbal pluriel inhabituel est toutefois signalé en note afin de ne pas effacer l’ambiguïté formelle de l’hébreu.
- source_word: מִבֵּית אָבִי
  choice: loin de la maison de mon père
  rationale: « Maison » conserve à la fois l’idée du foyer familial et, par extension, celle de la maisonnée. « Loin de » exprime ici naturellement l’éloignement depuis le foyer paternel.
- source_word: חַסְדֵּךְ
  choice: la bonté dont tu devras faire preuve envers moi
  rationale: חסד désigne ici une bonté concrète attendue de Sara, avec une nuance possible de fidélité loyale. La tournure française exprime naturellement la demande insistante portée par le contexte.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: partout où nous arriverons
  rationale: 'Cette formulation idiomatique rend la portée distributive de l’expression hébraïque : chaque lieu où Abraham et Sara viendront.'
- source_word: אִמְרִי לִי
  choice: dis à mon sujet
  rationale: Bien que la préposition hébraïque signifie littéralement « à/pour moi », le contexte exige que Sara parle d’Abraham à d’autres personnes.
- source_word: אָחִי הוּא
  choice: C’est mon frère
  rationale: La traduction conserve explicitement « frère », affirmation sur laquelle repose l’épisode, sans la généraliser en « parent ».
theological_decisions:
- issue: L’agent des déplacements d’Abraham et l’accord pluriel de l’hébreu
  choice: Dieu m’a fait mener une vie errante
  alternative: les dieux m’ont fait errer
  rationale: Le contexte identifie très probablement אֱלֹהִים au Dieu d’Abraham, mais le texte massorétique emploie ici un verbe au pluriel. Le texte principal suit la lecture contextuelle sans atténuer la causalité divine; la note conserve l’alternative grammaticalement possible.
- issue: Portée de la causalité divine
  choice: a fait mener une vie errante
  alternative: a permis que je mène une vie errante
  rationale: La construction causative hébraïque attribue directement à Dieu le départ et la vie itinérante d’Abraham. La traduction ne transforme donc pas cette causalité en simple permission, tout en évitant un terme qui impliquerait nécessairement un égarement moral.
translation_notes:
  register: Français international moderne, naturel et digne. « Mener une vie errante » garde la force causative sans connotation morale indue; « partout où nous arriverons » allège la syntaxe tout en conservant le sens distributif.
