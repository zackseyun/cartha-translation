  naturalness: Le français révisé est moderne et naturel. « Je lui ai dit » respecte le pronom du texte source sans introduire le nom de Sara, et « la bonté que tu me feras » est plus direct et plus proche de la construction hébraïque que « dont tu devras faire preuve envers moi ».
  terminology: « Bonté » convient bien pour ḥèsèd dans cette demande interpersonnelle; la note conserve à juste titre les nuances de loyauté et d’amour constant. « Frère » est maintenu explicitement. Les guillemets français et la formulation de la note sont harmonisés.
