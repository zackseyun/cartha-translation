  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ הִנֵּ֥ה אַרְצִ֖/י לְ/פָנֶ֑י/ךָ בַּ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ שֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/015.yaml
  text: And Abimelech said, “Look, my land is before you; settle wherever seems good in your eyes.”
translation:
  language: fr
  text: 'Abimélek dit : « Regarde, mon pays est devant toi ; installe-toi là où bon te semble. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Regarde
  rationale: Marque naturellement en français l’appel à l’attention introduisant l’offre d’Abimélek.
- source_word: אַרְצִי
  choice: mon pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire placé sous l’autorité d’Abimélek plutôt que la matière du sol.
- source_word: לְפָנֶיךָ
  choice: est devant toi
  rationale: Conserve l’image hébraïque tout en exprimant que le territoire est mis à la disposition d’Abraham.
- source_word: שֵׁב
  choice: installe-toi
  rationale: Le verbe יָשַׁב peut signifier habiter ou s’établir ; ici, l’impératif autorise Abraham à choisir son lieu de résidence.
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: là où bon te semble
  rationale: Expression française courante et digne qui rend l’idiome hébreu « dans ce qui est bon à tes yeux » sans lourdeur.
