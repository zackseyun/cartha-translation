base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: fr
  text: 'À Sara, il dit : « Voici, j’ai donné mille pièces d’argent à ton frère. Voici, c’est pour toi une couverture des yeux[a], pour tous ceux qui sont avec toi ; et, auprès de tous, tu es rétablie dans ton droit[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une couverture des yeux ». L’expression désigne probablement une compensation publique qui couvre le tort et rétablit l’honneur de Sara.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « tu es disculpée », « l’affaire est réglée devant tous » ou « tu es reprise ». La dernière proposition hébraïque est difficile et a reçu plusieurs interprétations.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: mille pièces d’argent
  rationale: L’hébreu dit littéralement « mille d’argent » sans nommer explicitement une unité. « Pièces d’argent » exprime naturellement un paiement en argent sans préciser indûment « sicles ».
- source_word: לְאָחִיךְ
  choice: à ton frère
  rationale: Le terme signifie bien « frère » et renvoie à la manière dont Abraham avait été présenté. Le conserver maintient l’ironie et le lien narratif.
- source_word: כְּסוּת עֵינַיִם
  choice: comme une couverture des yeux
  rationale: L’expression est obscure. Une traduction proche de la métaphore hébraïque préserve son ambiguïté au lieu de la réduire à la seule idée de compensation ou de justification.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: devant tous ceux qui sont avec toi
  rationale: Bien que לְ puisse se rendre formellement par « pour/à », le contexte indique la portée publique du geste ; « devant » donne en français naturel cette dimension sociale.
- source_word: וְאֵת כֹּל
  choice: ainsi, devant tous
  rationale: La construction est elliptique et difficile. Cette formulation étend à tous la dimension publique déjà exprimée, tout en signalant par « ainsi » le lien avec la proposition finale.
- source_word: וְנֹכָחַת
  choice: tu es rétablie dans ton droit
  rationale: Le niphal de יכח peut évoquer le fait d’être reconnue juste, disculpée ou reprise. Dans ce contexte de réparation publique, cette formulation exprime la restauration du droit de Sara sans effacer l’incertitude, laquelle est signalée en note.
theological_decisions:
- issue: Sens de la déclaration finale concernant Sara
  choice: tu es rétablie dans ton droit
  alternative: tu es disculpée ; l’affaire est réglée ; tu es reprise
  rationale: Le contexte favorise une reconnaissance publique du droit et de l’honneur de Sara, mais la difficulté grammaticale et lexicale interdit de présenter cette interprétation comme certaine.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » conserve la force déictique répétée de הִנֵּה. La métaphore inhabituelle de « couverture des yeux » est maintenue dans le texte afin de préserver l’ambiguïté de l’hébreu, avec une explication en note.
