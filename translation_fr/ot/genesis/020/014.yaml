base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: fr
  text: Alors Abimélek prit du petit bétail[a] et du gros bétail, des esclaves, hommes et femmes[b], et les donna à Abraham. Puis il lui rendit Sara, sa femme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut désigner collectivement les moutons et les chèvres.
    reason: lexical_alternative
  - marker: b
    text: Les termes hébreux peuvent aussi être traduits par « serviteurs et servantes », mais le fait que ces personnes soient données avec le bétail met ici en relief leur condition d’esclaves.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « il restitua Sara, sa femme, à Abraham ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח signifie normalement « prendre » ; « prit » conserve la succession narrative sans ajouter l’idée de faire venir.
- source_word: צֹאן
  choice: petit bétail
  rationale: צֹאן désigne collectivement les ovins et caprins. « Petit bétail » préserve cette étendue mieux que le seul terme « moutons » et forme une paire naturelle avec « gros bétail ».
- source_word: בָקָר
  choice: gros bétail
  rationale: בָקָר désigne le bétail bovin ; « gros bétail » convient à l’opposition traditionnelle et intelligible avec « petit bétail ».
- source_word: עֲבָדִים
  choice: esclaves
  rationale: עֲבָדִים peut désigner des serviteurs ou des esclaves. Ici, ces personnes sont données avec du bétail, ce qui rend leur condition servile et leur transfert particulièrement saillants.
- source_word: שְׁפָחוֹת
  choice: servantes esclaves
  rationale: שְׁפָחוֹת désigne des femmes en condition servile dans la maisonnée. « Servantes esclaves » explicite à la fois leur fonction domestique et leur statut, tout en marquant le féminin du terme hébreu.
- source_word: וַיִּתֵּן
  choice: les donna
  rationale: Le pronom « les » reprend naturellement en français l’ensemble du bétail et des personnes énumérés.
- source_word: וַיָּשֶׁב
  choice: rendit
  rationale: La forme causative de שוב signifie faire revenir ou restituer. Dans ce contexte, « rendit » est naturel et conserve l’idée de restitution.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Le suffixe renvoie à Abraham. Placé en apposition après Sara, « sa femme » reproduit clairement la relation exprimée par l’hébreu.
- source_word: לּוֹ
  choice: lui
  rationale: Le pronom renvoie à Abraham ; « lui » est idiomatique et sans ambiguïté dans la phrase française.
