  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: fr
  text: Maintenant, rends à cet homme sa femme, car il est prophète. Il priera pour toi, et tu vivras. Mais si tu ne la rends pas, sache que tu mourras certainement, toi et tout ce qui t’appartient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est large et peut inclure les membres de la maisonnée d’Abimélek, aussi bien que ses biens.
    reason: Précise sans la restreindre la portée possible de l’expression hébraïque « tout ce qui t’appartient ».
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Cette formule marque à la fois la transition et l’urgence de l’ordre. « Maintenant donc » restitue naturellement ses valeurs temporelle et déductive.
- source_word: הָשֵׁב אֵשֶׁת הָאִישׁ
  choice: rends à cet homme sa femme
  rationale: Le hifil impératif de שוב demande de restituer la femme à son mari. Cette formulation française est naturelle tout en conservant explicitement la relation conjugale exprimée en hébreu.
- source_word: כִּי נָבִיא הוּא
  choice: car il est prophète
  rationale: כִּי introduit ici la raison de l’ordre. « Prophète » est l’équivalent direct et usuel de נָבִיא.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: Il priera pour toi
  rationale: Le yiqtol annonce l’action qui suivra la restitution. « Prier pour » exprime clairement la portée intercessoire de בְּעַד sans recourir à un vocabulaire plus technique.
- source_word: וֶחְיֵה
  choice: et tu vivras
  rationale: Bien que la forme soit impérative, elle exprime dans cet enchaînement le résultat de la prière d’Abraham. Le futur français communique ce sens naturellement.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: Mais si tu ne la rends pas
  rationale: La négation avec le participe décrit le refus ou l’absence de restitution. Le pronom « la », exigé par le français, reprend sans ambiguïté la femme mentionnée auparavant.
- source_word: דַּע כִּי מוֹת תָּמוּת
  choice: sache que tu mourras certainement
  rationale: « Sache » conserve l’impératif solennel. L’infinitif absolu suivi du verbe conjugué renforce la certitude de la mort, rendue par « certainement ».
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: toi et tous ceux qui t’appartiennent
  rationale: Dans ce contexte de jugement touchant la maison d’Abimélek, cette formulation met au premier plan les membres de sa maisonnée, tout en accompagnant d’une note la portée plus large possible de l’expression hébraïque.
theological_decisions:
- issue: Étendue du jugement annoncé dans « toi et tout ce qui est à toi »
  choice: toi et tous ceux qui t’appartiennent
  alternative: toi et tout ce qui t’appartient ; toi et tout ce que tu possèdes
  rationale: Le contexte immédiat présente un jugement qui atteint la maison d’Abimélek. La traduction principale fait donc ressortir les personnes de sa maisonnée, tandis que la note préserve l’amplitude de l’hébreu, qui peut aussi englober ses biens.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases sont légèrement segmentées pour rendre l’avertissement divin avec netteté, sans archaïsme ni ajout doctrinal.
