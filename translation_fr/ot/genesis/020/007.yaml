  to: Maintenant, rends à cet homme sa femme, car il est prophète. Il priera pour toi, et tu vivras. Mais si tu ne la rends pas, sache que tu mourras certainement, toi et tout ce qui t’appartient[a].
  rationale: La révision restitue dans le texte principal l’étendue non spécifiée de l’expression hébraïque, conformément à la source et à l’ambiguïté relevée dans l’audit anglais. La note conserve l’éclairage contextuel sur l’inclusion possible de la maisonnée. La ponctuation initiale est légèrement simplifiée pour un français international plus fluide.
