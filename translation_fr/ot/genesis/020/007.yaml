review_pass:
  verdict: revise
  source_fidelity: La restitution de l’ordre, du motif (« car il est prophète »), de la prière en faveur d’Abimélek, de la conséquence de vie et de l’avertissement renforcé « tu mourras certainement » est fidèle au texte hébreu. En revanche, « tous ceux qui t’appartiennent » restreint dans le texte principal l’expression très large וְכָל אֲשֶׁר לָךְ (« tout ce qui est à toi / tout ce qui t’appartient »), même si la note signale cette possibilité.
  naturalness: Le français est moderne, clair et d’un registre narratif approprié. « Maintenant donc » et « rends à cet homme sa femme » sont recevables; une légère révision en « Maintenant, rends à cet homme sa femme » est plus fluide sans perdre la transition discursive.
  terminology: « Prophète », « priera pour toi », « vivras » et « mourras certainement » sont justes et naturels. La note doit accompagner une formulation principale sémantiquement large, plutôt que corriger après coup une restriction aux personnes.
  issues:
  - severity: medium
    issue: Restriction de « tout ce qui t’appartient » à des personnes
    rationale: אַתָּה וְכָל אֲשֶׁר לָךְ emploie une relative neutre et englobante (« tout ce qui est à toi »). Le contexte peut inclure la maisonnée, comme l’indique l’audit anglais, mais le texte hébreu ne limite pas explicitement le référent aux seules personnes. Une formulation large dans le texte et une note sur l’inclusion possible de la maisonnée préservent l’ambiguïté.
  revised_text: Maintenant, rends à cet homme sa femme, car il est prophète. Il priera pour toi, et tu vivras. Mais si tu ne la rends pas, sache que tu mourras certainement, toi et tout ce qui t’appartient[a].
