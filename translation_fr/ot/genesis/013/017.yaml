source:
  edition: WLC
  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: fr
  text: Lève-toi, parcours le pays dans toute sa longueur et toute sa largeur, car je te le donnerai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּם
  choice: Lève-toi
  rationale: L’impératif de קום commande de se mettre debout et d’agir. « Lève-toi » est naturel, direct et digne en français moderne.
- source_word: הִתְהַלֵּ֣ךְ
  choice: parcours
  rationale: Le hitpael impératif de הלך exprime ici le fait de circuler ou de marcher à travers un territoire. « Parcours » rend clairement l’idée de traverser le pays dans son étendue sans imposer le moyen de déplacement.
- source_word: בָּאָרֶץ
  choice: le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire montré à Abram, non la terre entière. « Le pays » convient naturellement à ce sens territorial.
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: dans toute sa longueur et toute sa largeur
  rationale: Les deux dimensions forment une expression de totalité spatiale. La répétition de « toute » explicite naturellement en français l’idée de parcourir l’étendue du pays, sans modifier le référent.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du commandement. « Car » conserve ce lien explicatif dans un registre soutenu mais courant.
- source_word: לְךָ
  choice: te
  rationale: Le pronom marque Abram comme destinataire du don; le pronom indirect français avec « donner » en est l’équivalent direct.
- source_word: אֶתְּנֶנָּה
  choice: je te le donnerai
  rationale: L’imparfait hébreu a ici une valeur de promesse future. Le pronom « le » reprend « le pays », masculin en français, bien que le suffixe hébreu soit féminin en accord avec אֶרֶץ.
theological_decisions:
- issue: Référent du suffixe féminin dans אֶתְּנֶנָּה
  choice: Le pronom français « le » renvoie au pays promis à Abram.
  alternative: Traduire sans pronom par « je te donnerai ce pays ».
  rationale: Le suffixe féminin singulier renvoie naturellement à אֶרֶץ. Le genre grammatical change en français puisque « pays » est masculin; aucun ajout interprétatif n’est nécessaire.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la vigueur des impératifs et la portée promissoire de la dernière proposition. « Dans toute sa longueur et toute sa largeur » restitue naturellement l’étendue complète exprimée par la paire hébraïque.
