base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: fr
  text: Abram habita dans le pays de Canaan, et Lot habita dans les villes de la plaine et dressa ses tentes jusqu’à Sodome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « déplaça sa tente en direction de Sodome ». Le verbe hébreu peut évoquer le fait de dresser une tente ou de déplacer un campement ; Lot étend son campement vers Sodome, sans que le verset affirme nécessairement qu’il habite déjà dans la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: habita
  rationale: Le verbe désigne ici le fait de demeurer ou de résider. « Habita » est naturel en français et permet de conserver la répétition hébraïque appliquée à Abram puis à Lot.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: dans le pays de Canaan
  rationale: Cette formulation conserve le nom explicite אֶרֶץ, « pays », tout en restant idiomatique.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: dans les villes de la plaine
  rationale: Dans ce contexte, כִּכָּר désigne la plaine ou le bassin du Jourdain. « Les villes de la plaine » rend clairement la construction au pluriel.
- source_word: וַיֶּאֱהַל
  choice: dressa ses tentes
  rationale: Le verbe dérivé de אהל évoque l’installation sous tente ou le déplacement d’un campement. « Dressa ses tentes » exprime naturellement le mode de vie pastoral, sans affirmer que Lot résidait déjà dans Sodome.
- source_word: עַד סְדֹם
  choice: jusqu’à Sodome
  rationale: עַד indique une limite ou une extension spatiale. « Jusqu’à Sodome » conserve cette valeur sans nécessairement signifier que Lot entra dans la ville.
- source_word: אַבְרָם
  choice: Abram
  rationale: Transcription française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: לוֹט
  choice: Lot
  rationale: Transcription française traditionnelle du nom propre.
- source_word: סְדֹם
  choice: Sodome
  rationale: Forme française traditionnelle du nom de lieu.
