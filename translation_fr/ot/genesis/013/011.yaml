  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: fr
  text: Lot choisit pour lui-même toute la plaine du Jourdain, et Lot partit vers l’est[a]. Ils se séparèrent l’un de l’autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis l’est ». L’expression hébraïque peut indiquer soit la direction du déplacement, soit son point de départ.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: choisit donc pour lui
  rationale: Le verbe בחר signifie « choisir » et le datif לוֹ souligne que Lot fait ce choix pour lui-même. « Pour lui » conserve cette nuance sans alourdir la phrase.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: toute la plaine du Jourdain
  rationale: כִּכָּר désigne ici la région plane formant le district du Jourdain. « Plaine » est naturel en français et convient au contexte géographique.
- source_word: וַיִּסַּע
  choice: partit
  rationale: נסע évoque la levée du camp et le départ. Dans ce récit, « partit » exprime clairement et naturellement le déplacement.
- source_word: מִקֶּדֶם
  choice: vers l’est
  rationale: La locution peut indiquer soit la direction vers l’est, soit une provenance depuis l’est. Le contexte favorise ici la direction, tandis que l’autre possibilité est conservée en note.
- source_word: וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִיו
  choice: Ils se séparèrent ainsi l’un de l’autre
  rationale: Le nifal de פרד exprime une séparation réciproque. La formule distributive hébraïque avec « frère » désigne ici les deux parents qui se séparent; « l’un de l’autre » en restitue naturellement le sens en français.
theological_decisions:
- issue: Langage masculin de parenté dans אִישׁ מֵעַל אָחִיו
  choice: l’un de l’autre
  alternative: chacun de son frère
  rationale: L’hébreu emploie littéralement une tournure distributive masculine avec « frère », mais son sens idiomatique est la séparation mutuelle d’Abram et de Lot. La formulation française retenue conserve cette réciprocité sans suggérer à tort qu’ils sont frères au sens strict.
- issue: Ambiguïté directionnelle de מִקֶּדֶם
  choice: vers l’est
  alternative: depuis l’est
  rationale: Le contexte géographique rend le mouvement vers l’est plus probable, mais la forme hébraïque permet aussi une indication de provenance. La note maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. La coordination narrative hébraïque est rendue avec fluidité; « donc » et « ainsi » marquent la progression du récit sans en modifier le contenu.
