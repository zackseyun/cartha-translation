  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: fr
  text: Abram déplaça son campement, vint s’établir près des chênes de Mamré[a], qui sont à Hébron, et là il bâtit un autel à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des térébinthes de Mamré » ; le terme hébreu peut désigner de grands arbres, tels que des chênes ou des térébinthes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: leva ses tentes
  rationale: Le verbe dérivé de אהל exprime le déplacement ou l’installation avec la tente. « Leva ses tentes » rend naturellement ici le départ du campement, sans anticiper l’établissement exprimé par וַיֵּשֶׁב.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: puis il vint s’établir
  rationale: 'Cette formulation conserve la succession des deux verbes hébreux tout en restant idiomatique en français moderne : venue au lieu, puis établissement durable.'
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: près des chênes de Mamré
  rationale: אֵלֹנֵי désigne de grands arbres, compris notamment comme des chênes ou des térébinthes. « Chênes » est clair et traditionnel, tandis que l’incertitude botanique est signalée en note.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: qui sont à Hébron
  rationale: La proposition relative localise les arbres de Mamré. Le présent convient à une identification géographique en français.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: et là il bâtit un autel
  rationale: La formulation garde l’adverbe שָׁם et le sens cultuel ordinaire de מִזְבֵּחַ.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément à sa présence explicite dans le texte hébreu, plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre et suit la décision éditoriale fournie, sans le remplacer par un titre.
- issue: Identification des arbres אֵלֹנֵי
  choice: chênes dans le texte, avec variante en note
  alternative: térébinthes ; grands arbres
  rationale: L’espèce précise demeure incertaine. Le texte principal retient une traduction française établie et la note préserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est légèrement structurée par « donc » et « puis » pour assurer une lecture fluide sans effacer la succession des actions. « Bâtit » conserve une tonalité biblique encore courante, tandis que « leva ses tentes » convient au contexte nomade.
