source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: fr
  text: Les hommes de Sodome étaient extrêmement méchants et pécheurs contre Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Yahweh ».
    reason: Alternative lexicale possible pour לַיהוָה.
lexical_decisions:
- source_word: וְ/אַנְשֵׁי
  choice: Les hommes de
  rationale: אַנְשֵׁי est le pluriel construit de אִישׁ et désigne ici les hommes de Sodome. Le וְ initial relie la phrase au contexte, mais n’a pas besoin d’être rendu par un marqueur discursif explicite en français.
- source_word: סְדֹם
  choice: Sodome
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: רָעִים
  choice: mauvais
  rationale: Dans ce contexte moral, רָעִים qualifie une conduite mauvaise, et non simplement désagréable ou malheureuse.
- source_word: וְ/חַטָּאִים
  choice: et pécheurs
  rationale: Le terme forme un prédicat parallèle à רָעִים et décrit ces hommes comme caractérisés par le péché. « Pécheurs » conserve directement la forme nominale/adjectivale du texte hébreu.
- source_word: לַ/יהוָה
  choice: contre Yahweh
  rationale: Avec le vocabulaire du péché, לְ peut désigner celui envers qui la faute est commise. « Contre Yahweh » exprime naturellement cette portée relationnelle et morale en français.
- source_word: מְאֹד
  choice: extrêmement
  rationale: מְאֹד renforce fortement l’ensemble de la qualification; « extrêmement » en conserve l’intensité dans un français actuel.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre divin plutôt que de le remplacer par un titre.
- issue: Valeur de לַיהוָה avec חַטָּאִים
  choice: contre Yahweh
  alternative: devant Yahweh
  rationale: La préposition peut présenter Yahweh comme celui contre qui le péché est commis, ou situer la conduite des hommes devant lui, sous son regard. Le texte principal retient la première lecture, tandis que la note conserve l’autre possibilité authentique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche du parallélisme hébreu et évite d’ajouter un marqueur comme « Or » ou « Maintenant ».
