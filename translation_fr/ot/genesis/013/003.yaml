base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: fr
  text: Il alla par étapes, du Néguev jusqu’à Béthel, jusqu’à l’endroit où sa tente se trouvait au début, entre Béthel et Aï.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Il poursuivit son voyage
  rationale: Dans ce récit de déplacement, le verbe הלך décrit naturellement le fait de voyager. « Poursuivit » rend la continuité narrative du retour d’Abram depuis l’Égypte, sans ajouter de détail géographique.
- source_word: לְמַסָּעָיו
  choice: par étapes
  rationale: Le pluriel מַסָּעִים évoque des étapes successives, liées aux déplacements et aux campements; cette formulation française est concise et idiomatique.
- source_word: מִנֶּגֶב
  choice: du Néguev
  rationale: Dans ce contexte patriarcal, נֶגֶב désigne la région géographique du Néguev plutôt que le simple point cardinal « sud ».
- source_word: וְעַד בֵּית אֵל
  choice: jusqu’à Béthel
  rationale: עַד indique ici la limite ou le terme du déplacement.
- source_word: עַד הַמָּקוֹם
  choice: jusqu’à l’endroit
  rationale: La répétition de עַד précise la destination exacte; la conserver respecte l’insistance et la structure de l’hébreu.
- source_word: אֲשֶׁר הָיָה שָׁם אָהֳלֹה
  choice: où sa tente se trouvait
  rationale: « Où » intègre naturellement שָׁם en français, tandis que l’imparfait présente l’emplacement antérieur de la tente sans lourdeur.
- source_word: בַּתְּחִלָּה
  choice: au commencement
  rationale: L’expression renvoie au premier séjour d’Abram dans cette région et conserve la formulation temporelle du texte.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: entre Béthel et Aï
  rationale: La construction בֵּין…וּבֵין situe clairement l’endroit entre les deux localités; l’article hébreu de הָעָי n’est pas rendu dans la forme française usuelle du toponyme.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition de « jusqu’à » est maintenue pour refléter la progression syntaxique de l’hébreu. Les toponymes suivent les graphies françaises courantes « Néguev », « Béthel » et « Aï ».
