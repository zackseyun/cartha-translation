id: GEN.13.7
reference: Genesis 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: fr
  text: Il y eut un conflit entre les gardiens des troupeaux d’Abram et les gardiens des troupeaux de Loth. À cette époque, les Cananéens et les Perizzites[a] habitaient le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie les noms de ces deux peuples au singulier, avec un sens collectif : « le Cananéen et le Perizzite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Il y eut
  rationale: Cette tournure introduit naturellement en français l’apparition d’une situation dans le récit, tout en conservant la valeur existentielle de היה.
- source_word: רִיב
  choice: un conflit
  rationale: Le nom désigne une querelle ou un différend réel entre les deux groupes. « Conflit » est clair, actuel et suffisamment fort sans préciser indûment sa forme.
- source_word: רֹעֵי מִקְנֵה
  choice: les gardiens des troupeaux
  rationale: רֹעֵי désigne ceux qui prennent soin des animaux, tandis que מִקְנֶה englobe le bétail, les troupeaux et les cheptels. Cette expression évite de limiter les animaux aux seuls moutons.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et
  rationale: La construction hébraïque distingue nettement les deux parties opposées; la structure française la reproduit directement.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: les Cananéens et les Perizzites
  rationale: Les ethnonymes hébreux sont morphologiquement singuliers mais ont ici une valeur collective. Le pluriel est la formulation naturelle et non ambiguë en français.
- source_word: אָז
  choice: À cette époque
  rationale: L’expression situe clairement la présence de ces peuples au moment des événements racontés et rend naturellement l’adverbe temporel אָז.
- source_word: יֹשֵׁב
  choice: habitaient
  rationale: Le participe exprime une présence durable dans le pays. L’imparfait français convient à cet arrière-plan narratif.
- source_word: בָּאָרֶץ
  choice: le pays
  rationale: « Le pays » est une désignation géographique naturelle en français et conserve la possible résonance plus large du terme dans le récit de la Genèse.
theological_decisions:
- issue: Possible portée géographique et liée à la promesse de הָאָרֶץ
  choice: le pays
  alternative: la contrée / la terre
  rationale: « Le pays » convient au contexte géographique tout en évitant d’effacer la résonance que ce terme peut acquérir dans le récit de la Genèse. La traduction n’explicite toutefois aucune interprétation théologique absente de ce verset.
translation_notes:
  register: Français international moderne, sobre et narratif. La répétition de « les gardiens des troupeaux » préserve la symétrie des deux groupes et évite une formulation susceptible de faire croire que les troupeaux eux-mêmes se querellaient. « À cette époque » est placé en tête de phrase pour rendre l’arrière-plan temporel avec naturel.
