  text: כִּ֧י אֶת כָּל הָ/אָ֛רֶץ אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֖ עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: fr
  text: Car tout le pays que tu vois, je te le donnerai, à toi et à ta descendance[a], pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ta semence ». Le mot hébreu זֶרַע est un nom collectif qui peut désigner la semence, la descendance ou les descendants.'
    reason: Alternative lexicale préservant la portée collective et l’ambiguïté du terme hébreu.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication et la promesse divines qui suivent l’ordre de regarder le pays, sans renforcer indûment une relation de cause.
- source_word: כָּל הָאָרֶץ
  choice: tout le pays
  rationale: Rend l’ensemble du territoire visible et convient naturellement au contexte de la promesse territoriale.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: que tu vois
  rationale: Expression française directe et naturelle correspondant au participe hébreu dans ce contexte.
- source_word: לְךָ
  choice: à toi
  rationale: Avec le verbe « donner », la préposition marque clairement le bénéficiaire.
- source_word: אֶתְּנֶנָּה
  choice: je le donnerai
  rationale: L’imparfait hébreu exprime ici une promesse à venir; le pronom « le » reprend naturellement « le pays ».
- source_word: וּלְזַרְעֲךָ
  choice: et à ta descendance
  rationale: « Descendance » conserve la valeur collective de זֶרַע tout en restant idiomatique en français moderne.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Rend naturellement la durée durable ou perpétuelle exprimée par la locution hébraïque, sans en imposer une interprétation eschatologique particulière.
theological_decisions:
- issue: Durée de la promesse du pays exprimée par עַד עוֹלָם
  choice: pour toujours
  alternative: à perpétuité; pour une durée indéfinie
  rationale: La traduction retient le sens simple et fort de la locution dans ce contexte de promesse, tout en laissant au contexte biblique plus large la question de ses modalités d’accomplissement.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient au discours direct de Dieu à Abram. « Pays » est préféré à « terre » pour désigner sans ambiguïté le territoire promis; « descendance » préserve la valeur collective du terme hébreu.
