  yaml_path: translation/ot/genesis/013/005.yaml
  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: fr
  text: Lot, qui accompagnait Abram, avait lui aussi du petit bétail[a], du gros bétail et des tentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne le petit bétail en général, surtout les moutons et les chèvres; « gros bétail » désigne ici les bovins.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: lui aussi
  rationale: La combinaison de la conjonction et de l’adverbe ajoute Lot au récit et souligne que lui aussi possédait des biens; en français, « lui aussi » rend naturellement cette valeur additive.
- source_word: לְלוֹט ... הָיָה
  choice: Lot ... avait
  rationale: Le ל marque ici le possesseur dans une construction existentielle, rendue idiomatiquement en français par le verbe « avoir ».
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: qui accompagnait Abram
  rationale: Le participe désigne Lot comme celui qui allait avec Abram. L’imparfait « accompagnait » conserve la nuance durative dans un français naturel.
- source_word: צֹאן
  choice: du petit bétail
  rationale: Le terme désigne collectivement les petits animaux d’élevage, surtout les moutons et les chèvres. « Petit bétail » est précis et évite de réduire le mot aux seuls moutons.
- source_word: וּבָקָר
  choice: du gros bétail
  rationale: Le nom désigne les bovins; « gros bétail » forme avec « petit bétail » une paire collective claire et naturelle.
- source_word: וְאֹהָלִים
  choice: et des tentes
  rationale: Le pluriel désigne simplement des tentes, qui faisaient partie du campement et des possessions de Lot.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure « avait lui aussi » préserve l’insistance additive de l’hébreu, tandis que « accompagnait » restitue la valeur continue du participe.
