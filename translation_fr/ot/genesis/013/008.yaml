  source_fidelity: 'Le sens est bien rendu : Abram adresse à Lot une demande polie d’éviter une querelle, tant entre eux qu’entre leurs gardiens de troupeaux, au motif de leur parenté. « Proches parents » traduit justement la valeur large de אַחִים dans ce contexte, où Lot est le neveu d’Abram. La périphrase pour רֹעַי / רֹעֶיךָ est fidèle et ne restreint pas indûment le bétail aux moutons.'
  naturalness: Le français est naturel, clair et de registre approprié. Toutefois, « donc » donne au waw narratif une nuance déductive plus marquée que nécessaire ; « alors » est plus neutre et idiomatique dans le déroulement du récit. La formulation de la note, « des hommes frères », n’est pas du français naturel et ne constitue pas une bonne présentation d’un littéralisme.
  terminology: « Querelle », « troupeaux » et « proches parents » conviennent au français international moderne. La note doit expliquer que l’expression hébraïque comporte « hommes » et « frères », sans faire passer « hommes frères » pour une formulation française littérale satisfaisante.
