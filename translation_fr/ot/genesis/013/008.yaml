  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: fr
  text: 'Abram dit alors à Lot : « Je t’en prie, qu’il n’y ait pas de querelle entre moi et toi, ni entre ceux qui gardent mes troupeaux et ceux qui gardent les tiens, car nous sommes proches parents[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie les mots « hommes » et « frères ». Ici, « frères » peut désigner des membres d’une même famille au sens large, et non seulement des fils des mêmes parents.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Abram dit donc
  rationale: Le waw consécutif fait avancer le récit. « Donc » relie naturellement cette parole au conflit décrit juste avant.
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: Je t’en prie, qu’il n’y ait pas de querelle
  rationale: אַל avec le jussif exprime une demande négative, et נָא en adoucit le ton. « Querelle » rend le conflit interpersonnel désigné par מְרִיבָה dans un français courant.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: entre moi et toi
  rationale: Cette formulation conserve la structure répétée et l’insistance personnelle de l’hébreu, plutôt que de la réduire à « entre nous ».
- source_word: רֹעַי ... רֹעֶיךָ
  choice: ceux qui gardent mes troupeaux ... ceux qui gardent les tiens
  rationale: Le participe de רעה désigne les personnes chargées de faire paître ou de garder le bétail. La périphrase convient aux différents troupeaux du contexte et évite de limiter le sens aux seuls moutons.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Abram pour prévenir la querelle.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: nous sommes proches parents
  rationale: Dans ce contexte, אַחִים désigne une parenté familiale plus large que celle de frères issus des mêmes parents. Cette traduction idiomatique exprime correctement le lien entre Abram et Lot sans imposer au français le tour appositionnel hébreu.
theological_decisions:
- issue: Portée du terme אַחִים appliqué à Abram et Lot
  choice: proches parents
  alternative: frères ; des hommes frères
  rationale: Lot étant le neveu d’Abram, « frères » serait facilement compris à tort au sens strict en français. L’hébreu peut employer אַחִים pour des membres de la même parenté ; la note conserve toutefois l’image littérale et sa force fraternelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à une conversation entre proches. La répétition « entre moi et toi » maintient l’insistance de l’original, tandis que la seconde paire est légèrement allégée sans perdre son parallélisme.
