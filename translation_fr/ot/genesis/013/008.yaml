  rationale: La révision remplace « donc » par le marqueur narratif plus neutre « alors » et reformule la note afin de conserver l’information lexicale de l’hébreu sans produire un faux littéralisme maladroit en français. Le sens de parenté élargie reste explicitement préservé.
