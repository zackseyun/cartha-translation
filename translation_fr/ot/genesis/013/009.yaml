  text: הֲ/לֹ֤א כָל הָ/אָ֨רֶץ֙ לְ/פָנֶ֔י/ךָ הִפָּ֥רֶד נָ֖א מֵ/עָלָ֑/י אִם הַ/שְּׂמֹ֣אל וְ/אֵימִ֔נָה וְ/אִם הַ/יָּמִ֖ין וְ/אַשְׂמְאִֽילָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: fr
  text: Tout le pays n’est-il pas devant toi ? Sépare-toi de moi, je t’en prie. Si tu vas à gauche[a], j’irai à droite ; et si tu vas à droite, j’irai à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu formule les deux propositions conditionnelles de manière elliptique : littéralement, « Si la gauche, alors j’irai à droite ; et si la droite, alors j’irai à gauche. » Le verbe « vas » est ajouté pour que le sens soit clair en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: n’est-il pas
  rationale: Introduit une question rhétorique qui appelle une réponse affirmative ; cette tournure en conserve la force dans un français digne et naturel.
- source_word: כָל הָאָרֶץ
  choice: tout le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire qui s’étend devant Abram et Loth, non la terre entière. « Tout le pays » rend clairement cette portée.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Conserve l’image spatiale de l’hébreu tout en restant idiomatique en français.
- source_word: הִפָּרֶד נָא מֵעָלָי
  choice: Sépare-toi de moi, je t’en prie
  rationale: Le nifal impératif de פרד se rend naturellement par la forme pronominale « sépare-toi » ; « je t’en prie » exprime la nuance courtoise de נָא.
- source_word: אִם הַשְּׂמֹאל
  choice: Si tu vas à gauche
  rationale: L’hébreu est elliptique. Le verbe de mouvement est explicité en français pour rendre la proposition compréhensible sans imposer l’idée plus précise d’un choix.
- source_word: וְאֵימִנָה
  choice: j’irai à droite
  rationale: La forme directionnelle dérivée de ימין indique un mouvement vers la droite ; le futur français convient à la conséquence envisagée.
- source_word: וְאִם הַיָּמִין
  choice: et si tu vas à droite
  rationale: Explicite de la même manière l’ellipse hébraïque et maintient le parallélisme.
- source_word: וְאַשְׂמְאִילָה
  choice: j’irai à gauche
  rationale: Rend le mouvement correspondant vers la gauche et préserve la structure équilibrée de la proposition d’Abram.
