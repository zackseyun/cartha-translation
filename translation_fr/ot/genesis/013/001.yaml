base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: fr
  text: Abram remonta d’Égypte vers le Néguev[a], avec sa femme, tout ce qui lui appartenait et Loth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le sud ». Le mot hébreu néguev peut désigner soit la région méridionale appelée le Néguev, soit plus généralement le sud ou le pays du Sud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: remonta
  rationale: Le verbe עלה signifie « monter ». « Remonta » conserve l’image géographique biblique d’une montée depuis l’Égypte vers le pays, tout en étant naturel en français.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: Rend directement la préposition מן et le nom de lieu מִצְרַיִם.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: avec sa femme
  rationale: Dans l’énumération française, cette formulation exprime naturellement qu’Abram lui-même voyage avec sa femme, sans donner au pronom indépendant une lourdeur artificielle.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: tout ce qui lui appartenait
  rationale: Cette formulation reste assez large pour inclure les biens, les troupeaux et les personnes de sa maison, sans limiter le sens aux seules possessions matérielles.
- source_word: וְלוֹט עִמּוֹ
  choice: et Loth
  rationale: Le complément collectif introduit par « avec » s’étend naturellement à Loth en français; l’ordre final conserve sa mention ajoutée dans le texte hébreu.
- source_word: הַנֶּגְבָּה
  choice: vers le Néguev
  rationale: נֶגֶב peut désigner la région méridionale appelée le Néguev. « Vers » rend la valeur directionnelle du suffixe hébreu sans imposer l’idée d’une entrée ou d’une arrivée achevée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Remonta » préserve l’idiome spatial de l’hébreu; « Néguev » suit l’orthographe française courante. La phrase est légèrement réorganisée pour une énumération naturelle sans perdre les éléments ni l’ambiguïté géographique du texte source.
