source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: fr
  text: 'Lot leva les yeux et vit toute la plaine du Jourdain[a] : elle était tout entière bien arrosée, avant que Yahweh détruise Sodome et Gomorrhe, comme le jardin de Yahweh[b], comme le pays d’Égypte, en direction de Tsoar[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la vallée du Jourdain » ; plus littéralement, « tout le district circulaire du Jourdain ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « le jardin de Yahweh » évoque probablement la fertilité luxuriante du jardin d’Éden.
    reason: cross_reference
  - marker: c
    text: Ou « à l’approche de Tsoar ». L’expression hébraïque indique la direction de Tsoar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: leva les yeux
  rationale: Cette expression française naturelle conserve l’image de l’idiome hébreu qui décrit le geste de diriger son regard.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: toute la plaine du Jourdain
  rationale: כִּכָּר désigne ici la région basse et étendue du Jourdain. « Plaine » exprime clairement le sens géographique, tandis qu’une note conserve les autres possibilités lexicales.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: elle était tout entière bien arrosée
  rationale: מַשְׁקֶה décrit une région abondamment alimentée en eau ou irriguée. La reprise par « elle » rend clairement en français le rapport avec la plaine.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: avant que Yahweh détruise
  rationale: לִפְנֵי a ici une valeur temporelle, et שׁחת désigne la destruction ultérieure des villes.
- source_word: כְּגַן יְהוָה
  choice: comme le jardin de Yahweh
  rationale: La formulation préserve la comparaison et son évocation probable du jardin d’Éden sans l’expliciter dans le corps du verset.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: comme le pays d’Égypte
  rationale: « Pays » rend אֶרֶץ et maintient la portée géographique et agricole de la comparaison.
- source_word: בֹּאֲכָה צֹעַר
  choice: en direction de Tsoar
  rationale: L’expression hébraïque conventionnelle indique l’approche ou la direction. Cette formulation française évite un « tu » artificiel tout en conservant la valeur directionnelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Allusion possible à Éden dans כְּגַן יְהוָה
  choice: le jardin de Yahweh, avec explication en note
  alternative: le jardin d’Éden
  rationale: Le texte dit littéralement « le jardin de Yahweh ». La traduction ne remplace pas cette expression par une identification interprétative, même si l’allusion à Éden est probable.
translation_notes:
  register: Français international moderne, narratif et digne. La structure garde les deux comparaisons successives et la précision temporelle du texte hébreu, tout en employant une ponctuation qui rend la longue phrase lisible.
