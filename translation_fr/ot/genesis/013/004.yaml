    issue: Rendu de בָּרִאשֹׁנָה par « la première fois »
    rationale: L’expression hébraïque désigne l’antériorité de la construction au même endroit. « La première fois » peut suggérer une opposition explicite à une deuxième occurrence et alourdit la relative; « auparavant » rend plus directement la valeur contextuelle.
  - severity: medium
    issue: « fit appel au nom de Yahweh »
    rationale: Cette tournure est inhabituelle en français et atténue l’idiome cultuel. « invoqua le nom de Yahweh » est naturel, fidèle à la construction avec « nom », et suffisamment large pour que la note signale l’alternative « proclama ».
  revised_text: jusqu’à l’endroit de l’autel qu’il avait fait là auparavant. Là, Abram invoqua le nom de Yahweh[a][b].
