  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: fr
  text: jusqu’à l’endroit de l’autel qu’il avait fait là auparavant. Là, Abram invoqua le nom de Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « YHWH », traditionnellement rendu par « le SEIGNEUR » ; on rencontre aussi « Yahvé » et « Jéhovah ».
    reason: alternative_reading
  - marker: b
    text: Ou « proclama le nom de Yahweh » ou « invoqua Yahweh ». L’expression hébraïque peut désigner à la fois l’invocation et la proclamation.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: l’endroit de l’autel
  rationale: Rend directement le groupe locatif hébreu tout en s’insérant naturellement dans la phrase commencée au verset précédent.
- source_word: אֲשֶׁר עָשָׂה שָׁם
  choice: qu’il avait fait là
  rationale: Le plus-que-parfait marque l’antériorité de la fabrication de l’autel; « fait » reste proche du verbe עשה, et « là » conserve la répétition hébraïque.
- source_word: בָּרִאשֹׁנָה
  choice: la première fois
  rationale: Dans ce contexte de retour au même lieu, cette expression française indique clairement la première visite d’Abram sans suggérer le commencement absolu.
- source_word: וַיִּקְרָא שָׁם
  choice: Là, Abram fit appel
  rationale: « Fit appel » exprime l’invocation cultuelle portée par l’idiome, tandis que « là » conserve l’insistance spatiale du texte.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: Cette formulation garde le mot « nom » et rend le tétragramme comme un nom propre plutôt que de lui substituer un titre.
- source_word: אַבְרָם
  choice: Abram
  rationale: Translittération française conventionnelle du nom personnel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; YHWH
  rationale: Le texte hébreu porte le tétragramme, nom divin personnel. « Yahweh » le représente dans le texte principal, tandis que la note signale la convention traditionnelle et la forme consonantique.
- issue: Portée de l’idiome קרא בשם יהוה
  choice: fit appel au nom de Yahweh
  alternative: proclama le nom de Yahweh; invoqua Yahweh par son nom
  rationale: L’idiome peut évoquer l’invocation, la proclamation ou un acte d’adoration. Le choix principal est naturel en français et la note préserve les autres nuances possibles sans trancher excessivement.
translation_notes:
  register: Français international actuel, digne et accessible. Le verset commence par une minuscule parce qu’il poursuit syntaxiquement la phrase du verset 3. La répétition de « là » est conservée pour refléter l’insistance du texte hébreu.
