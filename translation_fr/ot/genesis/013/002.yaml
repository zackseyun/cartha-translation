  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: fr
  text: Abram était très riche en troupeaux, en argent et en or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abram
  rationale: Le nom est translittéré selon l’usage français. Le וְ assure ici la continuité narrative; il peut rester implicite en français sans qu’on ajoute un « maintenant » temporel absent de l’hébreu.
- source_word: כָּבֵד
  choice: riche
  rationale: Littéralement « lourd », l’adjectif exprime idiomatiquement ici l’importance de la fortune d’Abram. « Riche » est naturel, clair et fidèle au contexte.
- source_word: מְאֹד
  choice: très
  rationale: L’adverbe intensifie l’idée de richesse; « très » en donne l’équivalent français courant.
- source_word: בַּ/מִּקְנֶה
  choice: en troupeaux
  rationale: מִקְנֶה désigne les biens acquis, particulièrement le bétail, les troupeaux et les animaux domestiques. « Troupeaux » convient au cadre pastoral et évite de restreindre le terme aux bovins.
- source_word: בַּ/כֶּסֶף
  choice: en argent
  rationale: La préposition בְּ marque la catégorie dans laquelle consiste la richesse. « En argent » préserve cette structure et désigne ici le métal précieux.
- source_word: וּ/בַ/זָּהָב
  choice: et en or
  rationale: La traduction conserve le parallélisme de l’énumération hébraïque et sa dernière conjonction.
