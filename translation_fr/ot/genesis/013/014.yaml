  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: fr
  text: 'Yahweh dit à Abram, après que Loth se fut séparé de lui : « Lève donc les yeux et, de l’endroit où tu es, regarde vers le nord et vers le sud, vers l’est et vers l’ouest. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu directement par « Yahweh ». Le waw narratif n’exige pas ici un « et » en français moderne, puisque la continuité du récit est naturellement portée par l’ordre des phrases.
- source_word: אָמַר אֶל אַבְרָם
  choice: dit à Abram
  rationale: Formulation narrative française directe et naturelle; le nom אַבְרָם est transcrit selon l’usage français « Abram ».
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: après que Loth se fut séparé de lui
  rationale: La tournure marque l’antériorité de la séparation de Loth. Le plus-que-parfait du subjonctif après « après que » est grammaticalement conforme et convient au registre biblique digne, sans rendre le français obscur.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Lève donc les yeux
  rationale: « Lève les yeux » conserve l’image hébraïque. La particule נָא adoucit l’impératif; « donc » en restitue ici la nuance d’invitation avec plus de naturel que « s’il te plaît » dans une parole divine solennelle.
- source_word: וּרְאֵה
  choice: et ... regarde
  rationale: « Regarde » exprime l’orientation volontaire du regard demandée par l’impératif, tandis que « vois » serait moins idiomatique dans cette construction.
- source_word: מִן הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: de l’endroit où tu es
  rationale: Cette formulation rend le point d’observation sans ajouter l’idée de se tenir debout, absente de l’hébreu.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: vers le nord et vers le sud, vers l’est et vers l’ouest
  rationale: Les formes directionnelles en -ה sont rendues par « vers ». La répétition conserve l’ampleur de l’énumération tout en restant naturelle en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le présente comme un nom propre et suit la décision doctrinale fournie, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la cadence solennelle de l’énumération des quatre directions sans calquer lourdement l’hébreu.
