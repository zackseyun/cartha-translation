id: GEN.13.16
reference: Genesis 13:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: fr
  text: 'Je rendrai ta descendance[a] aussi nombreuse que la poussière de la terre : si quelqu’un[b] peut compter la poussière de la terre, alors ta descendance pourra, elle aussi, être comptée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ta semence »; le mot hébreu est un nom collectif désignant ici la postérité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un homme »; l’expression a ici une portée générique.
    reason: source_form
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Je rendrai
  rationale: Le verbe שׂוּם signifie fondamentalement « placer, établir », mais, avec un objet suivi d’une comparaison, il exprime ici le fait de rendre la descendance comparable à la poussière. « Je rendrai » est naturel en français et conserve cette valeur factitive.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: זֶרַע est un nom collectif qui peut désigner la semence ou la postérité. « Descendance » exprime clairement le sens humain collectif dans ce contexte, sans imposer une lecture exclusivement singulière.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: aussi nombreuse que la poussière de la terre
  rationale: L’hébreu dit littéralement « comme la poussière de la terre ». La proposition qui suit explicite que la comparaison porte sur l’impossibilité de compter; « aussi nombreuse que » rend cette relation naturellement en français tout en conservant l’image.
- source_word: אֲשֶׁר אִם
  choice: si
  rationale: La tournure introduit l’hypothèse qui développe la comparaison. En français, les deux-points suivis de « si » rendent clairement et sans lourdeur cette articulation.
- source_word: אִישׁ
  choice: quelqu’un
  rationale: Bien que le nom hébreu soit masculin singulier (« un homme »), il a ici une portée générique. « Quelqu’un » restitue cette portée en français moderne; la forme littérale est signalée en note.
- source_word: לִמְנוֹת
  choice: compter
  rationale: Le verbe מנה désigne ici l’action de dénombrer. « Compter » est le terme français le plus direct et le plus idiomatique.
- source_word: גַּם
  choice: elle aussi
  rationale: גַּם établit la correspondance entre la poussière et la descendance. La reprise pronominale « elle aussi » rend cette insistance avec naturel.
- source_word: יִמָּנֶה
  choice: pourra être comptée
  rationale: Le niphal imparfait se trouve dans la conséquence d’une hypothèse. « Pourra être comptée » exprime la possibilité conditionnelle plutôt qu’une prédiction certaine.
theological_decisions:
- issue: Traduction du nom collectif זֶרַע dans la promesse faite à Abram
  choice: ta descendance
  alternative: ta semence; tes descendants
  rationale: Le verset présente la postérité d’Abram comme une collectivité innombrable. « Descendance » conserve la valeur collective sans introduire dans ce verset une interprétation messianique exclusivement singulière; une note préserve la métaphore littérale de la « semence ».
- issue: Portée générique du masculin אִישׁ
  choice: quelqu’un
  alternative: un homme
  rationale: Dans ce contexte, אִישׁ ne limite pas réellement l’action de compter aux hommes, mais désigne une personne quelconque. Le français générique « quelqu’un » communique cette portée, tandis que la note documente la forme masculine du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « aussi nombreuse que » explicite la dimension quantitative rendue certaine par la proposition sur le dénombrement, tout en conservant l’image biblique de la poussière de la terre.
