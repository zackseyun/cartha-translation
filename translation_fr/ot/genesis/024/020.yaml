base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: fr
  text: Elle se dépêcha de vider sa cruche dans l’abreuvoir[a], puis courut de nouveau au puits pour puiser de l’eau. Elle en puisa pour tous ses chameaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « versa le contenu de sa cruche dans l’abreuvoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Elle se dépêcha
  rationale: Le verbe exprime l’empressement et la rapidité; cette tournure est naturelle en français et conserve l’action verbale.
- source_word: וַתְּעַר
  choice: de vider
  rationale: Le verbe désigne ici l’action de vider le contenu de la cruche, vraisemblablement en le versant; « vider » s’accorde naturellement avec le complément « sa cruche ».
- source_word: כַּדָּהּ
  choice: sa cruche
  rationale: כַּד désigne un récipient servant à transporter de l’eau; « cruche » est courant et adapté au contexte du puits.
- source_word: הַשֹּׁקֶת
  choice: l’abreuvoir
  rationale: Le nom désigne un récipient où l’on met de l’eau pour les animaux; « abreuvoir » rend clairement cette fonction dans le contexte des chameaux.
- source_word: וַתָּרָץ עוֹד
  choice: courut de nouveau
  rationale: « Courut » rend le verbe, et « de nouveau » exprime la répétition indiquée par עוֹד sans préciser abusivement qu’elle revint en arrière.
- source_word: הַבְּאֵר
  choice: au puits
  rationale: בְּאֵר désigne normalement un puits dans ce récit.
- source_word: לִשְׁאֹב
  choice: pour puiser de l’eau
  rationale: Le verbe signifie puiser; l’ajout explicite de « de l’eau » est idiomatique en français et découle directement du contexte.
- source_word: וַתִּשְׁאַב
  choice: Elle en puisa
  rationale: Cette formulation reprend naturellement l’eau déjà mentionnée et conserve l’action narrative, sans imposer grammaticalement une valeur progressive.
- source_word: לְכָל גְּמַלָּיו
  choice: pour tous ses chameaux
  rationale: La traduction préserve la totalité exprimée par כָּל et le possessif masculin singulier renvoyant au serviteur.
