  yaml_path: translation/ot/genesis/024/059.yaml
  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: fr
  text: Ils firent partir Rébecca, leur sœur, sa nourrice, le serviteur d’Abraham et ses hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Ils laissèrent donc partir
  rationale: Le piel de שׁלח exprime ici le fait de faire partir quelqu’un ou de lui donner congé pour le voyage. « Laissèrent partir » est naturel en français et convient au consentement donné dans le contexte; « donc » rend la progression narrative de וַ.
- source_word: רִבְקָה
  choice: Rébecca
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: אֲחֹתָם
  choice: leur sœur
  rationale: אָחוֹת signifie directement « sœur »; le contexte familial immédiat ne demande pas d’élargir le sens à « parente ».
- source_word: מֵנִקְתָּהּ
  choice: sa nourrice
  rationale: Le participe dérivé de ינק désigne la femme qui a allaité un enfant. « Nourrice » est la formulation française naturelle, tandis qu’une note précise le sens historique.
- source_word: עֶבֶד אַבְרָהָם
  choice: le serviteur d’Abraham
  rationale: La construction d’annexion se rend naturellement ainsi. עֶבֶד peut aussi désigner un esclave, mais le rôle de représentant et de serviteur est ici au premier plan.
- source_word: אֲנָשָׁיו
  choice: ses hommes
  rationale: Le suffixe renvoie au serviteur d’Abraham. « Ses hommes » reflète le terme général אֲנָשִׁים sans préciser indûment leur statut.
