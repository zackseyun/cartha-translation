- from: Ils laissèrent donc partir Rébecca, leur sœur, avec sa nourrice[a], ainsi que le serviteur d’Abraham et ses hommes.
  to: Ils firent partir Rébecca, leur sœur, sa nourrice, le serviteur d’Abraham et ses hommes.
  rationale: La révision rétablit l’énumération coordonnée du texte hébreu, sans rattacher les accompagnateurs à Rébecca par « avec » ni ajouter l’inférence de « donc ». « Firent partir » rend clairement le piel de שׁלח. La note conserve la précision lexicale de מֵנִקְתָּהּ dans une formulation non restrictive.
  reviewer_model: gpt-5.6-terra
