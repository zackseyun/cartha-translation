base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: fr
  text: 'Alors Laban et Betouel répondirent et dirent : « Cette affaire vient de Yahweh ; nous ne pouvons te dire ni du mal ni du bien.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nous ne pouvons te parler mal ou bien ». Cette formule polaire peut indiquer qu’ils ne sont pas en mesure de formuler une réponse défavorable ou favorable ; dans ce contexte, elle suggère qu’ils ne peuvent s’opposer à ce qui vient de Yahweh ni en disposer autrement.'
    reason: idiome hébraïque
lexical_decisions:
- source_word: וַיַּעַן … וַיֹּאמְרוּ
  choice: répondirent en disant
  rationale: Cette formulation conserve les deux verbes de la formule narrative hébraïque tout en restant naturelle dans un registre biblique français actuel.
- source_word: מֵיְהוָה
  choice: vient de Yahweh
  rationale: La préposition מִן marque ici l’origine, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: יָצָא הַדָּבָר
  choice: Cette affaire vient
  rationale: דָּבָר désigne ici l’affaire matrimoniale en discussion plutôt qu’une simple parole. Le verbe יָצָא exprime son origine.
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: nous ne pouvons rien te dire
  rationale: La tournure française exprime naturellement l’incapacité de prendre position dans les termes qui suivent.
- source_word: רַע אוֹ טוֹב
  choice: ni en mal ni en bien
  rationale: Cette expression garde l’ordre hébreu « mal ou bien » et préserve la polarité de l’idiome sans la réduire explicitement à une approbation ou à un refus.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve ici le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de « ni en mal ni en bien »
  choice: Conserver l’idiome dans le texte et l’expliquer en note
  alternative: nous ne pouvons ni nous y opposer ni rien y changer
  rationale: L’explicitation proposée comme alternative est plausible dans le contexte, mais elle résout davantage que le texte hébreu. La formulation retenue maintient sa tension et sa forme polaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Betouel » suit une translittération française courante. La répétition hébraïque de la formule de réponse est conservée sans lourdeur excessive.
