base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: fr
  text: Isaac la fit entrer dans la tente de Sara, sa mère[a]. Il prit Rébecca, et elle devint sa femme. Il l’aima. Ainsi, Isaac fut consolé après la mort de sa mère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « dans la tente de sa mère Sara ». Les deux formulations ont le même sens essentiel.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « après sa mère ». Dans le contexte, il s’agit de la période suivant la mort de sa mère, bien que le mot « mort » ne figure pas dans cette expression hébraïque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: la fit entrer
  rationale: Le hifil de בוא avec suffixe féminin signifie qu’Isaac la fait venir ou entrer. « La fit entrer » rend à la fois l’action causative et la direction vers l’intérieur de la tente.
- source_word: הָאֹהֱלָה
  choice: dans la tente
  rationale: Le hé directionnel indique un mouvement vers la tente, compris ici comme une entrée; « dans la tente » est naturel en français.
- source_word: שָׂרָה אִמּוֹ
  choice: de Sara, sa mère
  rationale: L’apposition identifie Sara comme la mère d’Isaac tout en rattachant la tente à Sara. Cette formulation reste proche de l’ordre hébreu sans être obscure.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: Il prit Rébecca
  rationale: לקח signifie littéralement « prendre ». Le maintien de ce verbe évite de fondre cette proposition dans la suivante, qui énonce explicitement qu’elle devint sa femme.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: elle devint sa femme
  rationale: La construction היה + ל + אשה exprime ici l’établissement du lien conjugal; « elle devint sa femme » en rend clairement la progression narrative.
- source_word: וַיֶּאֱהָבֶהָ
  choice: Il l’aima
  rationale: אהב est le verbe courant pour aimer; le français direct conserve la sobriété du texte.
- source_word: וַיִּנָּחֵם
  choice: fut consolé
  rationale: Le nifal de נחם exprime ici le fait de recevoir une consolation, et non le repentir.
- source_word: אַחֲרֵי אִמּוֹ
  choice: après la mort de sa mère
  rationale: L’hébreu dit elliptiquement « après sa mère ». Le contexte de Genèse 23 indique qu’il s’agit de la période suivant sa mort; l’explicitation est nécessaire pour un français naturel, tout en étant signalée en note.
