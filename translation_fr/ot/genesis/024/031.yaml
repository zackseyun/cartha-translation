  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: fr
  text: 'Il lui dit : « Entre, béni par Yahweh[a] ! Pourquoi restes-tu dehors ? J’ai fait de la place dans la maison et un emplacement pour les chameaux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. « béni de Yahweh ». Ou : « ô toi que Yahweh a béni ».'
    reason: La formule hébraïque d’adresse est concise; la note signale une traduction plus littérale et une formulation vocative explicite.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il lui dit
  rationale: Le wayyiqtol fait avancer le récit. En français, « Il lui dit » rend naturellement la prise de parole; le complément « lui » est implicite dans le contexte.
- source_word: בּוֹא
  choice: Entre
  rationale: Dans cette invitation hospitalière, l’impératif de בוא appelle l’interlocuteur à entrer dans la demeure.
- source_word: בְּרוּךְ יְהוָה
  choice: béni de Yahweh
  rationale: Le participe passif suivi du nom divin fonctionne comme une apostrophe. Cette formulation concise reste proche de l’hébreu sans préciser davantage la relation exprimée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément à sa présence explicite dans le texte hébreu.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: Pourquoi restes-tu dehors ?
  rationale: Dans ce contexte, עמד ne décrit pas seulement la posture, mais le fait de demeurer à l’extérieur; « restes-tu » est naturel en français.
- source_word: פִּנִּיתִי הַבַּיִת
  choice: J’ai préparé la maison
  rationale: פּנה signifie ici dégager ou faire de la place. « Préparé » exprime clairement le résultat attendu dans une scène d’accueil tout en évitant une image artificielle en français.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: et une place pour les chameaux
  rationale: La traduction directe conserve sans l’expliciter la nature exacte de l’emplacement aménagé pour les animaux.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de בְּרוּךְ יְהוָה
  choice: béni de Yahweh
  alternative: béni par Yahweh / toi que Yahweh a béni
  rationale: La construction peut être comprise comme désignant celui qui est béni par Yahweh ou comme une formule d’adresse plus compacte. Le texte principal garde la concision et la tension de l’hébreu; la note donne les formulations françaises plus explicites.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse individuelle du récit. La phrase conserve la vivacité de l’invitation et n’ajoute aucun détail sur l’aménagement destiné aux chameaux.
