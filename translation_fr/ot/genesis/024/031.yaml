    issue: Formulation principale « béni de Yahweh »
    rationale: Cette tournure est littéraire et peu usuelle en français moderne international. « Béni par Yahweh » exprime naturellement la relation que le génitif hébreu peut véhiculer dans cette formule d’adresse.
  - severity: medium
    issue: « J’ai préparé la maison » affaiblit פִּנִּיתִי
    rationale: Le verbe indique l’action de dégager ou de faire de la place. « Préparer » peut suggérer une préparation générale et ne rend pas aussi clairement cette nuance spatiale.
