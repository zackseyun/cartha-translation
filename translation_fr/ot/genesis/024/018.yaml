  text: וַ/תֹּ֖אמֶר שְׁתֵ֣ה אֲדֹנִ֑/י וַ/תְּמַהֵ֗ר וַ/תֹּ֧רֶד כַּדָּ֛/הּ עַל יָדָ֖/הּ וַ/תַּשְׁקֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: fr
  text: 'Elle répondit : « Bois, mon seigneur[a]. » Puis elle s’empressa d’abaisser sa cruche sur sa main et lui donna à boire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « monsieur ». Le terme hébreu signifie littéralement « mon seigneur » et sert ici de formule respectueuse pour s’adresser à un homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: Bois
  rationale: Impératif masculin singulier de שׁתה. « Bois » rend directement et sobrement l’invitation, conformément à la concision de l’hébreu.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Dans ce contexte, il s’agit d’une formule de respect adressée à un homme, et non d’un titre divin. « Mon seigneur » conserve la déférence et le sens littéral, tandis que la note signale l’équivalent français plus courant « monsieur ».
- source_word: וַתְמַהֵר
  choice: elle s’empressa
  rationale: Le verbe exprime la rapidité et l’empressement. Cette tournure est naturelle en français narratif et maintient l’accent mis sur sa réaction immédiate.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: d’abaisser sa cruche
  rationale: Le verbe ירד décrit ici le mouvement de la cruche vers le bas depuis sa position de transport. « Abaisser sa cruche » restitue précisément ce geste.
- source_word: עַל יָדָהּ
  choice: sur sa main
  rationale: Cette traduction conserve l’expression concrète de l’hébreu, littéralement « sur sa main », sans introduire la mention de l’épaule, absente de ce verset.
- source_word: וַתַּשְׁקֵהוּ
  choice: lui donna à boire
  rationale: La forme causative de שׁקה signifie faire boire ou donner à boire. « Lui donna à boire » est idiomatique en français et exprime clairement ce sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste concise et conserve la répétition des actions ainsi que le détail concret, quelque peu inhabituel en français, de la cruche abaissée « sur sa main ».
