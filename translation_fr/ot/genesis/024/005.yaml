  source_fidelity: 'Le sens général est fidèle : le serviteur envisage que la femme refuse de le suivre vers le pays où Abraham se trouve et demande s’il faut y ramener le fils d’Abraham. Toutefois, « Devrai-je » tend à exprimer une nécessité plus marquée que l’interrogation délibérative hébraïque ; « Devrais-je » la rend plus justement. « Dans ce pays-ci » rend explicitement le déictique de « cette terre-ci » sans ajouter l’idée d’arrivée contenue dans « jusqu’ici ».'
