base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: fr
  text: 'Le serviteur lui dit : « Peut-être que la femme ne voudra pas me suivre[a] dans ce pays-ci. Devrais-je donc vraiment ramener[b] ton fils dans le pays d’où tu es parti ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aller après moi ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu associe ici l’infinitif absolu au verbe conjugué pour souligner l’action de ramener.
    reason: source_form
lexical_decisions:
- source_word: הָעֶבֶד
  choice: le serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce récit, « serviteur » exprime naturellement sa position subordonnée au sein de la maison d’Abraham sans préciser davantage son statut.
- source_word: אוּלַי
  choice: peut-être
  rationale: Rend directement l’éventualité envisagée par le serviteur dans un registre courant et digne.
- source_word: לֹא תֹאבֶה
  choice: ne voudra-t-elle pas
  rationale: Le verbe אָבָה exprime la volonté ou le consentement. Cette tournure conserve ici la valeur future et hypothétique de l’imparfait hébreu.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: L’hébreu dit simplement « la femme »; il ne convient pas d’expliciter ici « future épouse » ni de lui attribuer un âge.
- source_word: לָלֶכֶת אַחֲרַי
  choice: me suivre
  rationale: Littéralement « aller après moi ». « Me suivre » en donne le sens naturel tout en conservant l’image directionnelle.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: jusqu’ici, dans ce pays
  rationale: Cette formulation française naturelle conserve la destination et la valeur déictique de « ce pays-ci », le locuteur se trouvant dans le pays désigné.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: Devrai-je alors vraiment ramener
  rationale: La construction avec infinitif absolu et verbe conjugué met l’action de ramener en relief. « Vraiment » en marque l’insistance, tandis que « devrai-je » convient à la question délibérative sans transformer celle-ci en obligation affirmée.
- source_word: אֶת בִּנְךָ
  choice: ton fils
  rationale: Rendu direct du syntagme hébreu, sans explicitation nécessaire.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: dans le pays d’où tu es parti
  rationale: Conserve explicitement la proposition relative et le mouvement de départ exprimé par יָצָא.
theological_decisions: []
