  register: Français international moderne, naturel et digne. L’inversion « ne voudra-t-elle pas » et la question « Devrai-je » maintiennent la tenue narrative sans archaïsme. Le tutoiement correspond au dialogue personnel et à l’usage français habituel dans ce contexte ancien.
