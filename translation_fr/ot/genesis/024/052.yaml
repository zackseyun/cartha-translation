id: GEN.24.52
reference: Genesis 24:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת דִּבְרֵי/הֶ֑ם וַ/יִּשְׁתַּ֥חוּ אַ֖רְצָ/ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: fr
  text: Quand le serviteur d’Abraham entendit leurs paroles, il se prosterna jusqu’à terre devant Yahvé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « il s’inclina jusqu’à terre devant Yahvé ». Le verbe hébreu désigne une profonde inclinaison ou une prosternation, souvent en signe d’adoration.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quand
  rationale: La formule narrative introduit l’événement suivant. En français, « Quand » en restitue naturellement la valeur temporelle et séquentielle sans reproduire lourdement l’idiome « et il arriva que ».
- source_word: שָׁמַע
  choice: entendit
  rationale: Le verbe désigne ici le fait d’entendre les paroles qui viennent d’être prononcées.
- source_word: עֶבֶד אַבְרָהָם
  choice: le serviteur d’Abraham
  rationale: Cette formulation naturelle rend fidèlement le groupe construit. « Esclave » est lexicalement possible, mais le contexte met surtout en avant sa fonction de représentant de la maison d’Abraham.
- source_word: דִּבְרֵיהֶם
  choice: leurs paroles
  rationale: Ce choix conserve le sens concret de דְּבָרִים tout en restant idiomatique et digne en français.
- source_word: וַיִּשְׁתַּחוּ
  choice: il se prosterna
  rationale: Le verbe exprime un profond abaissement corporel, souvent chargé de révérence. « Se prosterner » préserve ici à la fois le geste et sa portée sans expliciter excessivement par « adorer ».
- source_word: אַרְצָה
  choice: jusqu’à terre
  rationale: La forme directionnelle indique un mouvement vers le sol. « Jusqu’à terre » rend clairement l’ampleur du geste en français.
- source_word: לַיהוָה
  choice: devant Yahvé
  rationale: Avec le verbe de prosternation, « devant » exprime naturellement en français l’orientation révérencielle du geste. Le nom divin est translittéré « Yahvé », forme française courante de יְהוָה.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le Tétragramme. « Yahvé » conserve le caractère de nom propre et correspond à l’usage français courant, sans le remplacer par un titre.
- issue: Portée cultuelle de וַיִּשְׁתַּחוּ
  choice: il se prosterna jusqu’à terre devant Yahvé
  alternative: il adora Yahvé
  rationale: Le contexte implique une profonde révérence envers Dieu, mais la mention « jusqu’à terre » met explicitement en relief le geste corporel. La traduction le conserve sans réduire l’expression à la seule notion abstraite d’adoration.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide, et « se prosterna jusqu’à terre » conserve la force physique et révérencielle de l’hébreu.
