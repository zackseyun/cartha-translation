  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: fr
  text: 'Mais il leur dit : « Ne me retardez pas, puisque Yahweh a fait réussir mon voyage[a]. Laissez-moi partir, afin que j’aille vers mon maître. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon chemin » ; il s’agit ici du voyage ou de la mission du serviteur.'
    reason: Préciser le sens contextuel de דַּרְכִּי tout en signalant son sens littéral.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Mais il leur dit
  rationale: Le waw narratif fait progresser le récit, tandis que « Mais » rend le contraste avec la proposition précédente de retenir Rébecca quelques jours.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: Ne me retardez pas
  rationale: La construction prohibitive avec le hifil de אחר signifie « retarder » ou « retenir ». Cette formulation reste proche de l’hébreu et convient au contexte.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Le texte porte explicitement le nom divin יהוה ; la translittération « Yahweh » le distingue du titre אֲדֹנִי employé plus loin pour le maître humain.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: a fait réussir mon voyage
  rationale: Le hifil de צלח exprime la réussite causée par Dieu. דֶּרֶךְ signifie littéralement « chemin », mais désigne ici le voyage ou la mission du serviteur.
- source_word: שַׁלְּחוּנִי
  choice: Laissez-moi partir
  rationale: L’impératif piel de שלח demande ici qu’on autorise le serviteur à repartir. « Laissez-moi partir » est plus idiomatique en français que le calque « Envoyez-moi ».
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: afin que j’aille vers mon maître
  rationale: Le cohortatif exprime l’intention du serviteur après son départ. אֲדֹנִי désigne Abraham, son maître humain, et non Dieu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le verset emploie le tétragramme comme nom propre. « Yahweh » préserve cette valeur et évite de le confondre avec le terme désignant le maître humain dans la même phrase.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve la fermeté polie du serviteur. La formulation privilégie une équivalence optimale sans effacer l’action causative attribuée à Yahweh.
