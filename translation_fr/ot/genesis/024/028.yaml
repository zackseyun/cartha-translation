  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: fr
  text: Alors la jeune femme courut raconter ces choses à la maison de sa mère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux gens de la maison de sa mère ». L’expression hébraïque peut désigner soit la demeure elle-même, soit la maisonnée ou la famille liée à sa mère.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: courut
  rationale: Le verbe רוץ exprime ici un déplacement rapide. « Courut » rend directement la succession narrative du wayyiqtol.
- source_word: הַנַּעֲרָ
  choice: la jeune femme
  rationale: נַעֲרָה désigne une jeune personne de sexe féminin. « Jeune femme » est naturel en français moderne et convient à Rébecca dans ce contexte.
- source_word: וַתַּגֵּד
  choice: raconter
  rationale: Le hiphil de נגד signifie faire savoir, annoncer ou rapporter. Après une expérience à relater, « raconter » exprime naturellement la transmission de ce qui vient de se passer.
- source_word: לְבֵית אִמָּהּ
  choice: à la maison de sa mère
  rationale: בַּיִת peut désigner aussi bien la demeure que les personnes qui la composent. La traduction conserve l'expression concrète et son ambiguïté possible, expliquée en note.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ces choses
  rationale: דְּבָרִים peut signifier paroles, affaires ou choses. Ici, « ces choses » désigne naturellement l'ensemble de ce que Rébecca vient de vivre et d'entendre.
