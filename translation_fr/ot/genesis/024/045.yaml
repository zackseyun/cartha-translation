  rationale: La révision améliore la syntaxe et l’enchaînement des temps, tout en conservant la vivacité de וְהִנֵּה par « voilà que ». Elle maintient la distinction lexicale entre source et puits et rend la demande avec une politesse naturelle. La note sur la parole intérieure est neutralisée afin de ne pas réduire indûment l’ambiguïté de l’hébreu.
