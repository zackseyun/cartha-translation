    issue: Construction temporelle et aspect verbal maladroits
    rationale: « Je n’avais pas encore fini ... que, voici, Rébecca sortait » est syntaxiquement heurté et l’imparfait « sortait » affaiblit l’irruption narrative. Une formulation avec « que voilà que » et le passé composé rend plus naturellement l’événement qui survient avant l’achèvement de la parole intérieure.
  - severity: low
    issue: Note a légèrement trop explicative
    rationale: Le contexte peut évoquer une prière, mais l’expression hébraïque signifie littéralement « parler à mon cœur » et peut désigner une parole intérieure. La note doit préserver cette nuance sans l’identifier exclusivement à une prière.
