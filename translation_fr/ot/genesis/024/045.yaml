  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: fr
  text: 'Je n’avais pas encore fini de parler en mon cœur[a] que voilà que Rébecca est sortie, sa cruche sur son épaule. Elle est descendue à la source[b] et a puisé de l’eau. Je lui ai dit : « Je t’en prie, donne-moi à boire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parler à mon cœur » ; expression désignant une parole intérieure.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne une source, et non le terme habituel pour un puits.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: Je n’avais pas encore fini
  rationale: Cette formulation naturelle en français exprime une action qui n’était pas encore achevée au moment où survient l’événement suivant.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: de parler dans mon cœur
  rationale: La formulation conserve l’image hébraïque du cœur tout en exprimant clairement une parole intérieure, ici dans le contexte d’une prière.
- source_word: וְהִנֵּה
  choice: que, voici
  rationale: « Voici » maintient l’effet de soudaineté et la présentation vive produits par la particule hébraïque.
- source_word: רִבְקָה
  choice: Rébecca
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: יֹצֵאת
  choice: sortait
  rationale: L’imparfait rend la valeur visuelle et immédiate du participe après « voici », comme une scène qui se présente au regard.
- source_word: כַדָּהּ
  choice: sa cruche
  rationale: כַּד désigne un récipient servant notamment à puiser et transporter de l’eau ; « cruche » est précis, courant et adapté au contexte.
- source_word: עַל־שִׁכְמָהּ
  choice: sur l’épaule
  rationale: Traduction directe et idiomatique de l’expression spatiale hébraïque.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: Elle est descendue à la source
  rationale: עַיִן désigne ici une source naturelle, et non le terme hébreu habituel pour un puits. Le passé composé convient à un récit oral en français moderne.
- source_word: וַתִּשְׁאָב
  choice: a puisé de l’eau
  rationale: Le complément « de l’eau », implicite dans le verbe et évident dans le contexte, rend l’action naturelle et explicite en français.
- source_word: הַשְׁקִינִי נָא
  choice: S’il te plaît, donne-moi à boire
  rationale: « Donne-moi à boire » rend la valeur causative de l’impératif, tandis que « s’il te plaît » représente la particule de requête נָא.
theological_decisions:
- issue: Nature de la parole intérieure
  choice: Maintenir « parler dans mon cœur » sans préciser davantage
  alternative: « prier intérieurement » ou « me parler à moi-même »
  rationale: Le contexte évoque une prière, mais l’hébreu dit littéralement « parler à mon cœur ». La traduction préserve donc l’ambiguïté entre prière intérieure et pensée formulée.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé soutient le caractère oral du récit rapporté, tandis que « voici » conserve la vivacité narrative de l’hébreu. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
