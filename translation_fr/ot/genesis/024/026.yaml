  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: fr
  text: Alors l’homme s’inclina et se prosterna devant Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « adora Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: s’inclina
  rationale: Le verbe קָדַד décrit le fait de courber le corps. « S’inclina » rend naturellement ce geste tout en le distinguant du verbe suivant.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: L’hébreu dit explicitement « l’homme ». Même si le contexte l’identifie comme le serviteur d’Abraham, la traduction conserve ici le nom employé par le texte.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna devant
  rationale: La forme verbale exprime une prosternation révérencieuse. Cette traduction conserve à la fois le geste corporel et, puisque Yahweh en est l’objet, sa portée cultuelle, sans réduire le terme au seul concept abstrait d’adoration.
- source_word: לַיהוָה
  choice: devant Yahweh
  rationale: La préposition ל marque ici la personne à laquelle la prosternation est adressée; « devant » est idiomatique en français. Le tétragramme est translittéré « Yahweh » afin de conserver le nom divin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme. « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- issue: 'Valeur de וַיִּשְׁתַּחוּ : geste de prosternation ou adoration'
  choice: se prosterna devant
  alternative: adora
  rationale: Le verbe désigne concrètement le fait de se prosterner et, lorsqu’il est dirigé vers Dieu, implique l’adoration. Le rendu retenu préserve le geste explicite et sa portée religieuse sans choisir exclusivement l’un des deux aspects.
translation_notes:
  register: Français international moderne, simple et digne. La coordination des deux gestes de l’hébreu est conservée; « alors » rend la progression narrative.
