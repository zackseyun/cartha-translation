  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: fr
  text: L’homme entra donc dans la maison. Il déchargea les chameaux[a] et leur donna de la paille et du fourrage, ainsi que de l’eau pour laver les pieds de l’homme et ceux des hommes qui l’accompagnaient.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « ouvrit les chameaux », expression qui peut signifier qu’il les débarrassa de leur chargement ou qu’il détacha leur équipement.
    reason: lexical_alternative
  - marker: b
    text: Le sujet des verbes « déchargea » et « donna » n’est pas nommé en hébreu. Il peut s’agir de l’homme mentionné au début du verset ou, d’après le contexte, de Laban agissant en qualité d’hôte.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: L’homme entra donc dans la maison
  rationale: Le verbe בוא accompagné du hé directionnel indique ici l’entrée dans la maison. « L’homme » conserve la désignation explicite du texte sans remplacer celle-ci par « le serviteur ».
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: Il déchargea les chameaux
  rationale: Littéralement, le texte dit qu’il « ouvrit » les chameaux, expression qui désigne vraisemblablement le fait de desserrer ou d’enlever leur équipement et leur chargement après le voyage. « Déchargea » est naturel et adapté au contexte.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: de la paille et du fourrage
  rationale: תֶּבֶן désigne la paille ou le chaume, tandis que מִסְפּוֹא désigne la nourriture destinée aux animaux. « Fourrage » est précis et courant en français.
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו
  choice: de l’eau pour se laver les pieds
  rationale: L’infinitif exprime le but. La tournure pronominale française rattache naturellement le lavage à l’homme mentionné.
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: lui et les hommes qui l’accompagnaient
  rationale: Cette formulation française fluide conserve l’homme comme référent ainsi que le groupe masculin pluriel qui était avec lui.
theological_decisions:
- issue: Identité du sujet de « déchargea » et « donna »
  choice: Conserver le pronom « il » sans introduire le nom de Laban
  alternative: « Laban déchargea les chameaux et leur donna… » ou une construction impersonnelle avec « on »
  rationale: Les verbes hébreux sont au masculin singulier, mais leur sujet n’est pas nommé. La continuité grammaticale peut renvoyer à « l’homme », tandis que le contexte d’hospitalité permet d’y voir Laban. Introduire explicitement « Laban » résoudrait une ambiguïté que le texte hébreu laisse ouverte ; la note la signale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La traduction suit la forme masculine singulière de l’hébreu tout en signalant l’ambiguïté discursive concernant l’agent des gestes d’hospitalité.
