  source_fidelity: Le texte rend correctement l’entrée dans la maison, le déchargement ou desserrement des chameaux, la paille et le fourrage, ainsi que l’eau destinée au lavage des pieds. Le sujet lexical des deux verbes suivants n’est pas exprimé en hébreu ; conserver « il » maintient la continuité grammaticale avec « l’homme », tandis que la note signale avec justesse l’autre lecture contextuelle possible (Laban).
  naturalness: Le récit est d’un français moderne, clair et d’un registre biblique approprié. Toutefois, « pour se laver les pieds, lui et les hommes qui l’accompagnaient » est une coordination pronominale un peu lourde et peut faire porter inutilement sur les bénéficiaires l’action de laver. Une formulation nominale est plus idiomatique et reproduit mieux la construction hébraïque « pour laver ses pieds et les pieds des hommes ».
  terminology: « L’homme », « maison », « déchargea les chameaux », « paille » et « fourrage » conviennent. « Fourrage » est précis et actuel. La note sur « ouvrit les chameaux » explique correctement l’idiome sans trancher de façon excessive entre déchargement et desserrement de l’équipement.
