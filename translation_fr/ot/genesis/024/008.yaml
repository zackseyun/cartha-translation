  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: fr
  text: Mais si la femme ne veut pas partir avec toi[a], tu seras libéré de ce serment que tu m’as prêté[b]. Seulement, tu ne ramèneras pas mon fils là-bas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aller après toi »; on peut aussi traduire : « te suivre » ou « aller avec toi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu seras dégagé de ce serment ». Littéralement : « de ce serment qui est le mien ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: Introduit une éventualité qui contraste avec la mission exposée auparavant; « Mais si » est naturel en français et conserve cette nuance.
- source_word: לֹא תֹאבֶה
  choice: ne veut pas
  rationale: Exprime l’absence de volonté ou de consentement sans durcir le sens en un refus ouvert.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Il s’agit encore d’une future épouse non identifiée; « la femme » évite de l’appeler prématurément « l’épouse ».
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: partir avec toi[a]
  rationale: Dans ce contexte de voyage, « partir avec toi » rend naturellement l’idée de se mettre en route à la suite du serviteur. La note conserve l’image hébraïque littérale et les autres possibilités.
- source_word: וְנִקִּיתָ
  choice: tu seras dégagé
  rationale: Le nifal de נקה exprime ici le fait d’être libéré d’une obligation. « Dégagé » convient idiomatiquement à un serment.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: de ce serment que tu m’as fait[b]
  rationale: Rend le démonstratif et la relation personnelle du suffixe. En français, cette formulation exprime naturellement qu’il s’agit du serment exigé par Abraham, sans attribuer le serment à Abraham lui-même.
- source_word: רַק
  choice: Seulement
  rationale: Marque la restriction ferme qui subsiste même si le serviteur est libéré du serment.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: tu ne ramèneras pas mon fils là-bas
  rationale: Le hifil de שוב est causatif; « ramener » conserve cette valeur, tandis que le futur à valeur injonctive exprime dignement l’interdiction.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation privilégie la clarté du contexte de voyage tout en signalant en note l’expression hébraïque littérale. Le futur injonctif final garde la solennité de l’interdiction.
