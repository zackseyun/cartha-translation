- from: Mais si la femme ne veut pas partir avec toi[a], tu seras dégagé de ce serment que tu m’as fait[b]. Seulement, tu ne ramèneras pas mon fils là-bas.
  to: Mais si la femme ne veut pas partir avec toi[a], tu seras libéré de ce serment que tu m’as prêté[b]. Seulement, tu ne ramèneras pas mon fils là-bas.
  rationale: La révision corrige la relation personnelle exprimée par le suffixe de « mon serment » en la formulant, conformément au contexte, comme le serment prêté par le serviteur à Abraham. Les notes conservent les alternatives lexicales et la littéralité pertinente, sans imposer d’interprétation doctrinale.
