  source_fidelity: La formulation « fais réussir aujourd’hui ce que j’entreprends » interprète trop explicitement l’objet non exprimé de הַקְרֵה et efface l’image de l’événement qui doit survenir « devant moi ». Le texte révisé conserve l’indétermination de la demande tout en rendant le causatif et le cadre temporel et spatial.
  naturalness: « Fais que cela se produise aujourd’hui devant moi » est un français moderne, clair et digne dans une prière. « Manifeste ta bonté fidèle envers » est plus idiomatique et direct que « témoigne de ta fidèle bonté à ».
  terminology: « Yahweh » rend explicitement le Tétragramme. « Mon maître Abraham » convient à אֲדֹנִי dans la bouche du serviteur. « Bonté fidèle » rend sobrement חֶסֶד sans restreindre le terme à une catégorie doctrinale particulière.
