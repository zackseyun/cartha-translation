  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: fr
  text: 'Il dit : « Yahweh, Dieu de mon maître Abraham, je t’en prie, fais que cela se produise aujourd’hui devant moi[a], et manifeste ta bonté fidèle envers mon maître Abraham[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fais que cela arrive aujourd’hui devant moi ». Le verbe hébreu demande à Dieu de faire providentiellement survenir l’événement recherché.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « bonté fidèle » rend l’hébreu ḥésed, qui peut aussi évoquer la bonté loyale, l’amour fidèle ou la fidélité dans une relation.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription directe du nom divin, conformément au texte hébreu et au choix éditorial du projet.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Dieu de mon maître Abraham
  rationale: « Maître » exprime naturellement en français la relation du serviteur à Abraham, sans donner à אֲדֹנִי une portée divine.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: je t’en prie, fais réussir aujourd’hui ce que j’entreprends
  rationale: Le hiphil impératif de קרה demande à Dieu de faire providentiellement survenir une issue favorable. La formulation française rend le sens contextuel sans le réduire à une réussite abstraite.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: témoigne de ta fidèle bonté
  rationale: Cette expression conserve les dimensions de bonté, de loyauté et de fidélité portées par חֶסֶד, dans un français naturel et digne.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: à mon maître Abraham
  rationale: Bien que עִם signifie formellement « avec », la construction française idiomatique avec « témoigner de la bonté » appelle « à ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme; « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- issue: Portée de חֶסֶד dans la prière
  choice: fidèle bonté
  alternative: amour fidèle
  rationale: « Fidèle bonté » garde ensemble la bienveillance et la loyauté relationnelle du terme, sans imposer dans le corps du texte une interprétation technique exclusivement liée à l’alliance.
- issue: Sens de הַקְרֵה dans ce contexte
  choice: fais réussir aujourd’hui ce que j’entreprends
  alternative: fais que cela arrive aujourd’hui devant moi
  rationale: Le choix principal explicite l’issue favorable demandée par le serviteur, tandis que la note maintient visible l’image et l’indétermination plus formelles de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La prière garde sa déférence grâce à « je t’en prie ». Les notes préservent la formulation plus littérale et l’étendue sémantique de חֶסֶד.
