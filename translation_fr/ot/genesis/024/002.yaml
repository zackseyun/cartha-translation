  text: וַ/יֹּ֣אמֶר אַבְרָהָ֗ם אֶל עַבְדּ/וֹ֙ זְקַ֣ן בֵּית֔/וֹ הַ/מֹּשֵׁ֖ל בְּ/כָל אֲשֶׁר ל֑/וֹ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֥חַת יְרֵכִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: fr
  text: 'Abraham dit à son serviteur, le plus âgé de sa maison, qui avait autorité sur tout ce qui lui appartenait[b] : « Pose, je te prie, ta main sous ma cuisse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mettre la main sous la cuisse était un ancien geste accompagnant un serment; il exprimait vraisemblablement un engagement solennel.
    reason: cultural_note
  - marker: b
    text: 'Ou, de façon plus idiomatique : « qui était chargé de tous ses biens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Abraham dit
  rationale: Le passé simple convient au récit biblique en français écrit et rend naturellement la forme narrative hébraïque sans surcharger le texte d’un connecteur.
- source_word: עַבְדּוֹ
  choice: à son serviteur
  rationale: עֶבֶד peut désigner un esclave ou un serviteur. Ici, les responsabilités confiées à cet homme mettent en avant sa fonction de serviteur et d’intendant; « serviteur » préserve aussi l’indétermination de son statut juridique.
- source_word: זְקַן בֵּיתוֹ
  choice: le plus âgé de sa maison
  rationale: La formulation rend le sens premier de זָקֵן et son rôle appositionnel. « Maison » conserve la portée large du foyer hébraïque, qui comprend davantage que la seule famille proche.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר לוֹ
  choice: qui avait autorité sur tout ce qui lui appartenait
  rationale: מֹשֵׁל exprime l’exercice d’une autorité ou d’une direction. Cette traduction conserve cette force tout en restant naturelle en français; une formulation plus idiomatique est signalée en note.
- source_word: שִׂים נָא
  choice: Pose, je te prie
  rationale: L’impératif שִׂים est rendu naturellement par « pose », tandis que נָא marque ici une demande polie ou insistante, exprimée par « je te prie ».
- source_word: יָדְךָ
  choice: ta main
  rationale: Traduction directe du syntagme hébreu.
- source_word: תַּחַת יְרֵכִי
  choice: sous ma cuisse
  rationale: La traduction littérale maintient l’expression culturellement particulière et évite d’imposer une interprétation anatomique ou symbolique dans le texte principal.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif écrit. « Je te prie » conserve la politesse de נָא sans donner à la demande un ton familier; l’expression culturellement obscure « sous ma cuisse » reste dans le texte et reçoit une explication en note.
