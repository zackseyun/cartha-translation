  yaml_path: translation/ot/genesis/024/017.yaml
  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: fr
  text: 'Le serviteur courut à sa rencontre et lui dit : « S’il te plaît, laisse-moi boire un peu d’eau de ta cruche. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרָץ
  choice: courut
  rationale: Le verbe רוץ exprime directement l’action de courir; le passé simple convient au registre narratif soutenu et naturel du récit biblique.
- source_word: הָעֶבֶד
  choice: le serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, il s’agit du serviteur de confiance d’Abraham agissant comme son représentant; « serviteur » convient au contexte sans surinterpréter son statut.
- source_word: לִקְרָאתָהּ
  choice: à sa rencontre
  rationale: La construction exprime un mouvement vers une personne afin de la rencontrer. « Courut à sa rencontre » est idiomatique en français.
- source_word: וַיֹּאמֶר
  choice: et lui dit
  rationale: La formule narrative introduit le discours direct; le pronom complément « lui » explicite naturellement la destinataire déjà indiquée par le contexte.
- source_word: הַגְמִיאִינִי
  choice: laisse-moi boire
  rationale: L’impératif causatif de גמא avec suffixe de première personne signifie « fais-moi boire » ou « laisse-moi boire ». Cette formulation naturelle conserve l’idée d’une demande d’accès à l’eau sans imposer un geste précis.
- source_word: נָא
  choice: s’il te plaît
  rationale: La particule נָא adoucit la demande et marque la politesse; « s’il te plaît » est son équivalent courant en français moderne.
- source_word: מְעַט מַיִם
  choice: un peu d’eau
  rationale: La formulation rend précisément la petite quantité demandée et demeure naturelle en français.
- source_word: מִכַּדֵּךְ
  choice: de ta cruche
  rationale: כַּד désigne un récipient servant notamment à puiser et transporter l’eau. « Cruche » est clair et idiomatique, et « ta » conserve le suffixe féminin singulier.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la cadence narrative; le tutoiement correspond à l’adresse singulière. Aucune note n’est nécessaire, car « laisse-moi boire » restitue naturellement l’impératif hébreu tout en en préservant la portée.
