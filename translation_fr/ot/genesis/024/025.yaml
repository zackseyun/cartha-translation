  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: fr
  text: 'Puis elle lui dit : « Nous avons de la paille et du fourrage en abondance, ainsi qu’un endroit où passer la nuit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Puis elle lui dit
  rationale: Le waw consécutif fait avancer le récit ; « Puis » rend naturellement la succession en français.
- source_word: אֵלָיו
  choice: lui
  rationale: Rend directement la préposition avec son suffixe pronominal dans la tournure française « lui dit ».
- source_word: גַּם ... גַּם ... גַּם
  choice: de la paille et du fourrage ... ainsi qu’un endroit
  rationale: Cette coordination cumulative restitue naturellement en français l’addition répétée marquée par גַּם.
- source_word: תֶּבֶן
  choice: paille
  rationale: Dans ce contexte d’accueil et de soin des animaux, « paille » est le terme courant et précis.
- source_word: מִסְפּוֹא
  choice: fourrage
  rationale: Désigne la nourriture destinée aux animaux ; « fourrage » est précis, actuel et naturel.
- source_word: רַב
  choice: en abondance
  rationale: Exprime clairement la grande quantité disponible sans alourdir la phrase.
- source_word: עִמָּנוּ
  choice: nous avons
  rationale: Littéralement « avec nous » ; en contexte possessif, « nous avons » est l’équivalent idiomatique naturel en français.
- source_word: מָקוֹם
  choice: un endroit
  rationale: Préserve le sens général de « lieu » sans suggérer nécessairement une chambre.
- source_word: לָלוּן
  choice: où passer la nuit
  rationale: Rend de façon actuelle et naturelle l’idée de loger ou demeurer pour la nuit.
