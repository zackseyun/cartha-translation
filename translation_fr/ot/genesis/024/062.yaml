source:
  edition: WLC
  text: וְ/יִצְחָק֙ בָּ֣א מִ/בּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְ/ה֥וּא יוֹשֵׁ֖ב בְּ/אֶ֥רֶץ הַ/נֶּֽגֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: fr
  text: Isaac était venu de Béer-Lahaï-Roï[a][b] et il habitait dans le pays du Néguev.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Isaac vint de Béer-Lahaï-Roï. » La construction hébraïque peut aussi se rendre par un temps du passé plus simple plutôt que par le plus-que-parfait.'
    reason: lexical_alternative
  - marker: b
    text: Béer-Lahaï-Roï est un lieu précédemment associé à Agar (voir Genèse 16.14).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא
  choice: était venu
  rationale: Le qatal de בוא présente un déplacement accompli. Le plus-que-parfait situe naturellement cette venue à l’arrière-plan de la scène suivante, sans exclure la possibilité d’un passé composé ou simple.
- source_word: מִבּוֹא
  choice: de
  rationale: La construction condensée מִן + infinitif construit de בוא est comprise ici comme indiquant la provenance du déplacement. La formulation française « était venu de » reste proche de cette lecture sans ajouter l’idée explicite d’un retour.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Béer-Lahaï-Roï
  rationale: Le nom géographique est translittéré plutôt que traduit. Les traits d’union rendent visible son caractère composé, et les trémas guident la lecture française.
- source_word: יוֹשֵׁב
  choice: habitait
  rationale: Le participe exprime une situation durable ou habituelle. L’imparfait français restitue naturellement cette valeur continue.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: dans le pays du Néguev
  rationale: « Pays » rend explicitement אֶרֶץ, tandis que « Néguev » conserve la désignation géographique de la région méridionale aride.
- source_word: וְהוּא
  choice: et il
  rationale: Le pronom hébreu explicite accompagne une coordination. « Et il » la conserve sans introduire un marqueur temporel absent du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le plus-que-parfait fournit l’arrière-plan discursif, tandis que l’imparfait exprime la résidence continue. Aucun « Or » ou « Maintenant » n’est ajouté en tête, puisque l’hébreu ne comporte pas ici de marqueur temporel explicite.
