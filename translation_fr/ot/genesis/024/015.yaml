base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: fr
  text: Il n’avait pas encore fini de parler que voici que Rébecca sortait, née de Betouel, fils de Milka, femme de Nahor, frère d’Abraham, sa cruche sur l’épaule.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הוּא טֶרֶם כִּלָּה לְדַבֵּר
  choice: Il n’avait pas encore fini de parler que
  rationale: Cette tournure française naturelle rend la séquence narrative introduite par וַיְהִי ainsi que l’antériorité inachevée exprimée par טֶרֶם et l’idée d’achèvement portée par כִּלָּה.
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » conserve la fonction déictique et vivifiante de la formule hébraïque dans un registre digne sans recourir à l’archaïsme « voici que » après un premier « que ».
- source_word: יֹצֵאת
  choice: sortait
  rationale: L’imparfait rend l’action en cours exprimée par le participe féminin au moment où le serviteur l’aperçoit.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: Elle était née de Betouel
  rationale: Le plus-que-parfait et la formulation passive préservent l’antériorité et la forme de יֻלְּדָה, qui identifie Rébecca par son ascendance.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: fils de Milka, femme de Nahor, le frère d’Abraham
  rationale: 'La chaîne d’appositions généalogiques est maintenue : Betouel est fils de Milka, Milka est femme de Nahor, et Nahor est frère d’Abraham.'
- source_word: כַדָּהּ עַל שִׁכְמָהּ
  choice: sa cruche sur l’épaule
  rationale: « Cruche » désigne naturellement le récipient servant à puiser et transporter l’eau, sans ajouter « d’eau », absent du verset; la localisation est rendue directement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase est légèrement restructurée pour rester naturelle tout en conservant la soudaineté de l’apparition de Rébecca, l’aspect progressif de sa sortie et toute l’information généalogique.
