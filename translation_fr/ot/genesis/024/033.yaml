base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: fr
  text: 'On plaça devant lui de quoi manger, mais il dit : « Je ne mangerai pas avant d’avoir dit ce que j’ai à dire[a]. » On lui dit alors : « Parle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à ce que j’aie prononcé mes paroles ».'
    reason: La note conserve la tournure concrète de l’hébreu derrière l’expression française idiomatique.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: On plaça
  rationale: Le verbe שׂים signifie « placer, mettre ». Le sujet n’étant pas exprimé ni important dans le contexte immédiat, le pronom indéfini « on » évite de l’identifier arbitrairement.
- source_word: לְפָנָיו לֶאֱכֹל
  choice: devant lui de quoi manger
  rationale: Cette formulation française rend naturellement l’idée littérale de quelque chose placé devant lui pour qu’il mange, sans ajouter le nom « nourriture », absent du texte hébreu.
- source_word: לֹא אֹכַל
  choice: Je ne mangerai pas
  rationale: L’imparfait hébreu exprime ici une résolution ferme orientée vers l’avenir.
- source_word: עַד אִם
  choice: avant d’avoir
  rationale: Dans cette construction, עַד אִם marque la limite préalable à l’action de manger. En français, « avant d’avoir » exprime idiomatiquement le rapport temporel voulu.
- source_word: דִּבַּרְתִּי דְּבָרָי
  choice: avoir dit ce que j’ai à dire
  rationale: Littéralement, « avoir prononcé mes paroles ». L’expression choisie transmet en français courant l’idée de présenter son message ou l’objet de sa venue, tout en signalant la formulation littérale en note.
- source_word: דַּבֵּר
  choice: Parle
  rationale: L’impératif bref conserve la simplicité et la force de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. « L’autre répondit » maintient la distinction entre les deux interlocuteurs sans répéter un nom absent du verset ni laisser croire que le serviteur se répond à lui-même.
