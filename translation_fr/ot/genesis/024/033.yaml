    rationale: Le texte hébreu conserve un sujet non identifié (« et il dit »). Le contexte permet de comprendre qu’un interlocuteur parle, mais « l’autre » ajoute une désignation absente du verset. Une tournure impersonnelle française préserve mieux cette absence d’identification.
  - severity: low
    issue: La note littérale emploie « avoir prononcé mes paroles ».
    rationale: Après « avant d’avoir dit », cette indication ne reproduit pas très exactement la construction hébraïque complète. « Jusqu’à ce que j’aie prononcé mes paroles » restitue plus fidèlement la proposition verbale.
