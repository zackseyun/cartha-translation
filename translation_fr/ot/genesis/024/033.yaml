  to: 'On plaça devant lui de quoi manger, mais il dit : « Je ne mangerai pas avant d’avoir dit ce que j’ai à dire[a]. » On lui dit alors : « Parle. »'
  rationale: La révision conserve l’équivalence idiomatique réussie de la première réplique et de l’objet implicite (« de quoi manger »), tout en évitant d’identifier ou de caractériser plus précisément le second locuteur que ne le fait le texte hébreu. La note est reformulée pour rendre la construction littérale complète.
