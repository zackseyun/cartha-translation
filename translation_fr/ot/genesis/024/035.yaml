    issue: « celui-ci est devenu très puissant » pour וַיִּגְדַּל
    rationale: Le terme hébreu signifie qu’Abraham est devenu grand, important ou prospère. « Puissant » peut suggérer une autorité politique ou militaire absente du texte. Un rendu plus large préserve mieux la portée du terme dans le contexte de richesse.
  revised_text: Yahvé a comblé mon maître de bénédictions, et il est devenu très important. Il lui a donné du petit et du gros bétail, de l’argent et de l’or, des serviteurs et des servantes[a], des chameaux et des ânes.
