  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: fr
  text: Yahvé a comblé mon maître de bénédictions, et il est devenu très important. Il lui a donné du petit et du gros bétail, de l’argent et de l’or, des serviteurs et des servantes[a], des chameaux et des ânes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des esclaves, hommes et femmes ». Les termes hébreux peuvent désigner des serviteurs domestiques ou des esclaves, selon le contexte.'
    reason: Alternative lexicale préservant l’ambiguïté du statut social.
lexical_decisions:
- source_word: יהוה
  choice: Yahvé
  rationale: Transcription française traditionnelle et immédiatement reconnaissable du nom divin YHWH; elle conserve ici le nom propre plutôt que de le remplacer par un titre.
- source_word: בֵּרַךְ ... מְאֹד
  choice: a comblé ... de bénédictions
  rationale: Expression française naturelle qui rend à la fois l’action de bénir et la forte intensité marquée par מְאֹד.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Dans ce contexte, le serviteur désigne Abraham, son supérieur humain; « maître » évite toute confusion avec un titre divin.
- source_word: וַיִּגְדָּל
  choice: est devenu très puissant
  rationale: Le verbe signifie littéralement devenir grand; dans cette énumération de richesses, « puissant » conserve une portée plus large que la seule richesse tout en étant naturel en français.
- source_word: צֹאן וּבָקָר
  choice: du petit et du gros bétail
  rationale: Ces collectifs désignent respectivement les ovins/caprins et les bovins. La formulation française exprime précisément les deux catégories.
- source_word: כֶסֶף וְזָהָב
  choice: de l’argent et de l’or
  rationale: Rend directement les deux métaux précieux sans réduire כֶסֶף au sens abstrait de monnaie.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: des serviteurs et des servantes
  rationale: Les termes peuvent désigner des domestiques ou des esclaves selon le contexte. Le texte principal emploie une formulation courante, tandis que la note préserve l’autre possibilité.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: des chameaux et des ânes
  rationale: Équivalents français directs et usuels des deux noms d’animaux.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: L’hébreu porte explicitement le tétragramme comme nom propre. « Yahvé » le distingue du titre אֲדֹנָי et suit une forme française établie.
- issue: Statut social exprimé par עֲבָדִים / שְׁפָחֹת
  choice: serviteurs et servantes dans le texte, avec une note
  alternative: esclaves, hommes et femmes
  rationale: Le vocabulaire hébreu couvre divers degrés de dépendance et le contexte ne permet pas d’en préciser entièrement le statut juridique. La note maintient cette ambiguïté historique et lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste accessible, avec un vocabulaire agricole précis. Le passé composé présente les bénédictions reçues comme expliquant la situation actuelle d’Abraham.
