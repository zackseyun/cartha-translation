  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: fr
  text: Je te ferai jurer par Yahweh, le Dieu du ciel et le Dieu de la terre, que tu ne prendras pas pour mon fils une femme parmi les filles des Cananéens, au milieu desquels j’habite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: Je te ferai jurer
  rationale: 'Le hifil de שׁבע a une valeur causative : faire prêter serment à quelqu’un. Cette formulation est naturelle et conserve cette force.'
- source_word: בַּיהוָה
  choice: par Yahweh
  rationale: La préposition ב marque ici celui par qui le serment est prêté; le nom divin יהוה est translittéré « Yahweh ».
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: le Dieu du ciel et le Dieu de la terre
  rationale: La répétition de אֱלֹהֵי est maintenue, ainsi que la portée cosmique de l’association du ciel et de la terre.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: que tu ne prendras pas
  rationale: La proposition énonce le contenu solennel du serment. Le futur français convient à l’engagement exigé sans ajouter une modalité absente du texte.
- source_word: אִשָּׁה לִבְנִי
  choice: pour mon fils une femme
  rationale: Dans ce contexte matrimonial, אִשָּׁה désigne une épouse potentielle; la construction française « prendre une femme pour » préserve l’expression du texte.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: parmi les filles des Cananéens
  rationale: L’image sémitique des « filles » d’un peuple est conservée tout en rendant explicite le groupe ethnique visé.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: au milieu desquels j’habite
  rationale: יוֹשֵׁב avec בְּקִרְבּוֹ exprime la résidence au sein de ce peuple. « J’habite » est idiomatique en français et garde le sens duratif du participe.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve sa fonction de nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe solennelle du serment et la répétition « le Dieu du ciel et le Dieu de la terre » sont conservées; aucun archaïsme inutile n’est introduit.
