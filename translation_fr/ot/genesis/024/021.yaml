reference: Genesis 24:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: fr
  text: L’homme l’observait en silence[a], pour savoir si Yahweh avait fait réussir son voyage ou non.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’homme la regardait avec étonnement, sans rien dire, pour découvrir si Yahweh avait fait réussir son entreprise ou non. »'
    reason: 'Le sens précis de מִשְׁתָּאֵה est discuté : le mot peut évoquer une observation attentive ou un regard étonné. דֶּרֶךְ peut également désigner ici l’entreprise ou la mission plutôt que le seul voyage.'
lexical_decisions:
- source_word: הָאִישׁ
  choice: L’homme
  rationale: Le nom אִישׁ signifie ici « homme ». Même si le contexte l’identifie comme le serviteur d’Abraham, la traduction conserve le terme effectivement employé dans le texte hébreu.
- source_word: מִשְׁתָּאֵה
  choice: l’observait
  rationale: Le participe exprime une observation soutenue, avec une possible nuance d’étonnement. « L’observait » rend naturellement l’action en cours sans imposer cette nuance affective incertaine.
- source_word: לָהּ
  choice: l’
  rationale: La préposition avec suffixe féminin désigne la jeune femme comme l’objet de son attention. Le pronom complément « l’ » est idiomatique en français.
- source_word: מַחֲרִישׁ
  choice: en silence
  rationale: Le participe de חרשׁ indique qu’il se taisait. « En silence » exprime clairement la manière dont il observait.
- source_word: לָדַעַת
  choice: pour savoir
  rationale: L’infinitif précédé de ל exprime ici le but. « Pour savoir » en donne une traduction directe.
- source_word: הַהִצְלִיחַ
  choice: avait fait réussir
  rationale: 'La forme hiphil de צלח est causative : faire réussir. Cette formulation conserve explicitement cette valeur causative.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: דַּרְכּוֹ
  choice: son voyage
  rationale: דֶּרֶךְ signifie littéralement « chemin, voie », mais désigne ici le déplacement entrepris par l’homme. « Son voyage » communique naturellement ce sens contextuel.
- source_word: אִם לֹא
  choice: ou non
  rationale: Dans cette interrogation indirecte, l’expression complète idiomatiquement l’idée de savoir si l’action a réussi ou non.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin. « Yahweh » en préserve le caractère de nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait rend les deux participes hébreux comme une scène en cours. La formulation conserve la causalité de הַהִצְלִיחַ et l’incertitude narrative de la question indirecte.
