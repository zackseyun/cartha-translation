  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: fr
  text: Rébecca leva les yeux et vit Isaac, puis elle descendit du chameau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et elle tomba de dessus le chameau ». Ici, le verbe « tomber » désigne probablement le fait de descendre de sa monture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ
  choice: leva les yeux
  rationale: Cette expression française conserve l’image de l’idiome hébreu tout en restant naturelle et immédiatement compréhensible.
- source_word: וַתֵּרֶא
  choice: vit
  rationale: Le verbe exprime ici simplement la perception visuelle dans la succession du récit.
- source_word: אֶת יִצְחָק
  choice: Isaac
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: elle descendit du chameau
  rationale: Bien que נפל signifie ordinairement « tomber », l’expression désigne vraisemblablement ici le fait de descendre de sa monture. La traduction principale exprime ce sens probable sans suggérer une chute accidentelle.
