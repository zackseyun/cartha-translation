translation_notes:
  register: Français international moderne, simple et digne. « Leva les yeux » préserve la couleur narrative de l’hébreu; « descendit du chameau » évite l’impression trompeuse d’un accident, tandis que la note conserve la formulation littérale et son ambiguïté.
