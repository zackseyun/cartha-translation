base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: fr
  text: Rébecca et ses jeunes femmes[a] se levèrent, montèrent sur les chameaux et suivirent l’homme. Le serviteur prit Rébecca et partit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses jeunes servantes » ou « les jeunes femmes qui l’accompagnaient ». Le terme hébreu désigne de jeunes femmes et, dans ce contexte, probablement des accompagnatrices ou des servantes de Rébecca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: se levèrent
  rationale: Le qatal narratif de קום exprime le fait de se lever. L’accord au pluriel rend naturellement en français le sujet composé « Rébecca et ses jeunes servantes », sans surinterpréter le départ lui-même.
- source_word: נַעֲרֹתֶיהָ
  choice: ses jeunes servantes
  rationale: נַעֲרָה désigne fondamentalement une jeune femme; le contexte indique vraisemblablement les femmes attachées au service de Rébecca. « Jeunes servantes » rend à la fois l’âge et la fonction contextuelle, tandis que la note signale l’alternative plus littérale.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: montèrent sur les chameaux
  rationale: רכב avec עַל peut décrire le fait de monter sur une monture ou de la chevaucher. Ici, l’action précède le déplacement; « montèrent sur » conserve cette valeur initiale.
- source_word: אַחֲרֵי הָאִישׁ
  choice: suivirent l’homme
  rationale: אַחֲרֵי signifie « derrière/après ». Dans ce contexte de voyage, « suivirent l’homme » est idiomatique et indique qu’elles avançaient à sa suite.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le texte hébreu emploie explicitement « l’homme », bien que le référent soit le serviteur d’Abraham. Le conserver respecte la variation narrative de la source.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: Le serviteur prit Rébecca avec lui
  rationale: לקח signifie « prendre ». En français, « prit Rébecca » seul pourrait suggérer une saisie ou une possession; « avec lui » explicite sobrement le sens contextuel d’emmener ou d’accompagner sans modifier le rôle du serviteur.
- source_word: הָעֶבֶד
  choice: le serviteur
  rationale: עֶבֶד peut désigner un esclave ou un serviteur. Ici, il s’agit de l’intendant de confiance chargé d’une mission; « serviteur » convient au contexte sans trancher plus précisément son statut juridique.
- source_word: וַיֵּלַךְ
  choice: partit
  rationale: הלך signifie aller ou marcher. Après « prit Rébecca avec lui », « partit » rend naturellement la reprise du voyage et évite la lourdeur de « s’en alla ».
