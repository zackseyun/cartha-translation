  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: fr
  text: 'Il dit : « Béni soit Yahweh, le Dieu de mon maître Abraham, qui n’a pas retiré à mon maître son amour fidèle ni sa fidélité[a]. Quant à moi, Yahweh m’a conduit en chemin jusqu’à la maison des frères[b] de mon maître. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa bonté et sa vérité ». Ensemble, les deux mots hébreux évoquent souvent un amour loyal et une fidélité digne de confiance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « frères » ; ici, le mot désigne les hommes de la parenté ou de la lignée familiale d’Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Cette formule française naturelle conserve la valeur d’acclamation et de louange de l’adjectif prédicatif hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, sans le remplacer par un titre.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: le Dieu de mon maître Abraham
  rationale: La chaîne construite est rendue directement, en conservant la manière dont le serviteur désigne Abraham.
- source_word: לֹא עָזַב … מֵעִם אֲדֹנִי
  choice: qui n’a pas retiré à mon maître
  rationale: Cette tournure française exprime naturellement l’idée de ne pas priver quelqu’un de sa bonté et de sa fidélité, tout en respectant la construction négative hébraïque.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: sa bonté fidèle et sa fidélité
  rationale: Le couple exprime une bienveillance loyale et une fiabilité durable. La formulation reste compréhensible sans réduire חֶסֶד à une simple gentillesse ni אֱמֶת à la seule vérité propositionnelle.
- source_word: אָנֹכִי
  choice: Quant à moi
  rationale: Le pronom indépendant antéposé est emphatique; « Quant à moi » en conserve la mise en relief.
- source_word: בַּדֶּרֶךְ נָחַנִי
  choice: m’a conduit en chemin
  rationale: La formulation garde à la fois la notion de déplacement et celle de direction providentielle sans transformer la route en destination.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: jusqu’à la maison des frères de mon maître
  rationale: « Maison » et « frères » conservent les termes concrets du texte; le contexte permet toutefois à « frères » de désigner plus largement la parenté masculine d’Abraham.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Nuance du couple חֶסֶד וֶאֱמֶת
  choice: bonté fidèle et fidélité
  alternative: amour loyal et vérité; bonté et vérité
  rationale: Le choix garde la dimension relationnelle de loyauté et de fiabilité sans imposer explicitement une lecture technique de l’alliance que le verset ne formule pas.
- issue: Portée de אֲחֵי
  choice: frères
  alternative: parents; membres de la parenté
  rationale: Le masculin pluriel concret est maintenu dans le texte, tandis qu’une note signale que son référent contextuel est plus large que des frères germains.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La bénédiction garde une solennité liturgique naturelle. La syntaxe est légèrement explicitée par « jusqu’à », exigé par l’usage français pour marquer la destination implicite en hébreu.
