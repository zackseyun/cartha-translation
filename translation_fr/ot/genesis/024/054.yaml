  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֗וּ ה֛וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר עִמּ֖/וֹ וַ/יָּלִ֑ינוּ וַ/יָּק֣וּמוּ בַ/בֹּ֔קֶר וַ/יֹּ֖אמֶר שַׁלְּחֻ֥/נִי לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: fr
  text: 'Puis lui et les hommes qui l’accompagnaient mangèrent et burent, et ils passèrent la nuit là. Quand ils se levèrent le matin, il dit : « Laissez-moi repartir chez mon maître[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers mon seigneur ». Le mot hébreu peut désigner un seigneur ou un maître; ici, il renvoie à Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: mangèrent et burent
  rationale: Les deux verbes narratifs sont rendus simplement et dans leur ordre, en conservant la concision de l’hébreu.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: lui et les hommes qui l’accompagnaient
  rationale: « Lui » maintient le pronom hébreu explicite, tandis que « qui l’accompagnaient » exprime naturellement en français les hommes qui étaient avec lui.
- source_word: וַיָּלִינוּ
  choice: ils passèrent la nuit là
  rationale: Le verbe לון/לין désigne le fait de rester pour la nuit; « là » explicite naturellement le lieu déjà établi par le contexte.
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: Quand ils se levèrent le matin
  rationale: Cette formulation française naturelle conserve la succession narrative et le sujet pluriel de l’hébreu.
- source_word: שַׁלְּחֻנִי
  choice: Laissez-moi repartir
  rationale: Dans ce contexte de départ après une nuit passée sur place, l’impératif de שׁלח demande qu’on permette au serviteur de reprendre sa route; cette tournure est plus idiomatique que le littéral « envoyez-moi ».
- source_word: לַאדֹנִי
  choice: chez mon maître
  rationale: La préposition marque ici la destination vers Abraham. « Chez mon maître » rend naturellement le retour auprès de lui et « maître » exprime la relation sociale sans connotation divine.
theological_decisions:
- issue: Sens de אָדוֹן appliqué à Abraham
  choice: mon maître
  alternative: mon seigneur
  rationale: Le référent est Abraham, supérieur humain du serviteur. « Mon maître » indique clairement cette relation et évite que « Seigneur » soit compris comme un titre divin.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme marqué. « Laissez-moi repartir » privilégie l’idiome français tout en conservant la demande de congé et de départ.
