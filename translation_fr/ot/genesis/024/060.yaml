base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: fr
  text: 'Ils bénirent Rébecca et lui dirent : « Notre sœur, puisses-tu devenir l’ancêtre de milliers de myriades[a] ! Que ta descendance prenne possession de la porte de ceux qui la haïssent[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour des milliers de dix milliers »; expression hyperbolique évoquant une descendance extrêmement nombreuse. On peut aussi traduire : « d’innombrables multitudes ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « la porte de ceux qui le haïssent », avec un pronom masculin singulier renvoyant à « descendance », collectif en hébreu. La porte représente ici la place forte et, par extension, le contrôle de la ville.'
    reason: grammar_and_cultural_image
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: Ils bénirent
  rationale: Le piel de ברך désigne ici l’action de prononcer une bénédiction sur Rébecca. « Ils bénirent » est direct, naturel et fidèle.
- source_word: רִבְקָה
  choice: Rébecca
  rationale: Forme française traditionnelle et courante du nom hébreu רִבְקָה.
- source_word: אֲחֹתֵנוּ אַתְּ
  choice: Toi, notre sœur
  rationale: La dislocation avec « toi » rend l’insistance de אַתְּ tout en conservant l’adresse familiale.
- source_word: הֲיִי
  choice: deviens
  rationale: L’impératif prend ici la valeur d’un souhait dans une formule de bénédiction; en français, l’impératif exclamatif le restitue naturellement.
- source_word: לְאַלְפֵי רְבָבָה
  choice: des milliers de myriades
  rationale: Cette formulation conserve les deux éléments numériques de l’hébreu, אֶלֶף (« millier ») et רְבָבָה (« myriade, dix mille »), ainsi que leur portée hyperbolique.
- source_word: וְיִירַשׁ
  choice: prenne possession de
  rationale: ירש exprime ici la prise de possession et la domination victorieuse plutôt qu’un simple héritage juridique.
- source_word: זַרְעֵךְ
  choice: ta descendance
  rationale: « Descendance » est un collectif singulier naturel en français et rend le sens généalogique de זֶרַע sans l’ambiguïté moderne de « semence ».
- source_word: שַׁעַר
  choice: la porte
  rationale: Le terme conserve l’image concrète de la porte fortifiée, qui représente aussi l’accès, la force et le contrôle de la ville.
- source_word: שֹׂנְאָיו
  choice: ceux qui la haïssent
  rationale: Le participe signifie littéralement « ceux qui le/la haïssent ». Le féminin singulier reprend naturellement le collectif « descendance » en français, tandis que la note signale la forme grammaticale hébraïque.
theological_decisions:
- issue: Référence pronominale au collectif « descendance »
  choice: ta descendance… ceux qui la haïssent
  alternative: ta postérité… ceux qui le haïssent; tes descendants… leurs ennemis
  rationale: L’hébreu emploie זֶרַע, nom collectif singulier, puis un suffixe masculin singulier. En français, « descendance » est féminin; « la » respecte donc l’accord français sans imposer une lecture strictement individuelle ou plurielle. La note préserve la donnée grammaticale de l’original.
translation_notes:
  register: Français moderne, international et digne. La formulation garde la solennité poétique de la bénédiction, l’hyperbole numérique et l’image ancienne de la porte, tout en évitant un calque grammatical peu naturel.
