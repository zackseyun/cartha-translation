  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: fr
  text: 'Elle lui dit : « Je suis la fille de Betouel, fils de Milka, que Milka avait mis au monde pour Nahor[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que Milka avait enfanté à Nahor ». Dans les formules généalogiques hébraïques, la préposition peut désigner le père de l’enfant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Elle lui répondit
  rationale: Le verbe אמר signifie littéralement « dire », mais dans cet échange de questions et de réponses, « répondit » exprime naturellement en français la fonction de la parole sans en modifier le contenu. Le wayyiqtol est rendu par un passé simple narratif.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: Je suis la fille de Betouel
  rationale: La proposition nominale hébraïque place le prédicat « fille de Betouel » avant le pronom explicite ; l’ordre français naturel restitue l’identification complète.
- source_word: בֶּן מִלְכָּה
  choice: fils de Milka
  rationale: La relation construite identifie Betouel comme fils de Milka. L’apposition sans article est concise et naturelle en français.
- source_word: אֲשֶׁר יָלְדָה לְנָחוֹר
  choice: qu’elle avait donné à Nahor
  rationale: Dans cette formule généalogique, ילד avec ל indique que Milka a mis Betouel au monde pour Nahor. L’expression française « donner [un fils] à » conserve cette relation et l’antériorité est naturellement marquée par le plus-que-parfait.
- source_word: בְּתוּאֵל / מִלְכָּה / נָחוֹר
  choice: Betouel / Milka / Nahor
  rationale: Les noms propres sont translittérés selon leurs formes françaises bibliques courantes.
