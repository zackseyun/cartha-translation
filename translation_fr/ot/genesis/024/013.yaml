  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וּ/בְנוֹת֙ אַנְשֵׁ֣י הָ/עִ֔יר יֹצְאֹ֖ת לִ/שְׁאֹ֥ב מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: fr
  text: Me voici, debout près de la source[a], et les filles des hommes de la ville[b] sortent pour puiser de l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de la fontaine ». Le mot hébreu désigne ici une source d’eau, et non le terme habituel pour un puits.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les jeunes femmes de la ville ; littéralement « les filles des hommes de la ville ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה אָנֹכִי נִצָּב
  choice: Me voici debout
  rationale: « Me voici » rend naturellement la particule présentative הִנֵּה avec le pronom explicite אָנֹכִי, tandis que « debout » conserve la posture exprimée par le participe נִצָּב.
- source_word: עַל עֵין הַמָּיִם
  choice: près de la source
  rationale: Dans ce contexte, עַל indique la proximité. עֵין הַמָּיִם désigne une source d’eau naturelle plutôt qu’un puits, lequel serait normalement désigné par בְּאֵר.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: et les filles des hommes de la ville
  rationale: Cette formulation conserve l’expression sociale et familiale précise de l’hébreu. Une note indique le sens contextuel plus naturel en français.
- source_word: יֹצְאֹת
  choice: sortent
  rationale: Le participe féminin pluriel présente l’action en cours ou imminente. Le présent français convient à la scène observée depuis la source.
- source_word: לִשְׁאֹב מָיִם
  choice: pour puiser de l’eau
  rationale: Expression française courante et précise pour l’action de prendre de l’eau à une source.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « Me voici debout » garde la vivacité du présentatif hébreu sans employer l’archaïque « Voici que ». L’expression familiale littérale est maintenue dans le texte et clarifiée en note.
