  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: fr
  text: Quand les chameaux eurent fini de boire, l’homme prit un anneau d’or[a] pesant un béqa[b], ainsi que deux bracelets pour ses poignets, pesant dix sicles d’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « un anneau d’or pour le nez » ; le terme hébreu peut désigner un anneau porté au nez ou à l’oreille.
    reason: lexical_alternative
  - marker: b
    text: Le béqa était une unité de poids équivalant à un demi-sicle.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: Quand les chameaux eurent fini de boire
  rationale: La construction temporelle situe l’action suivante après l’achèvement de l’abreuvement; le passé antérieur rend naturellement cette succession dans un récit français au passé simple.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: L’hébreu dit simplement « l’homme »; bien que le contexte l’identifie comme le serviteur d’Abraham, il convient de conserver ici la désignation du texte.
- source_word: נֶזֶם זָהָב
  choice: un anneau d’or
  rationale: נֶזֶם peut désigner un anneau porté au nez ou à l’oreille. « Anneau » préserve cette indétermination lexicale, explicitée en note.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: pesant un béqa
  rationale: Le terme ancien de mesure est conservé plutôt que remplacé dans le texte par son équivalent interprétatif; une note indique sa valeur.
- source_word: וּשְׁנֵי צְמִידִים
  choice: ainsi que deux bracelets
  rationale: La traduction conserve le nombre explicite et emploie le terme français courant pour ces bijoux.
- source_word: עַל יָדֶיהָ
  choice: pour les poignets de la jeune femme
  rationale: Littéralement « sur/pour ses mains »; en français actuel, les bracelets se portent aux poignets. Le nom explicite le référent du pronom sans ambiguïté dans un verset isolé.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: pesant dix sicles d’or
  rationale: Le sicle est l’unité implicitement comprise dans cette indication de poids; l’ajout rend la mesure intelligible sans en changer le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé antérieur s’accorde au récit biblique au passé simple. Les unités antiques sont conservées, avec explication en note; l’ambiguïté concernant le type d’anneau n’est pas résolue dans le texte principal.
