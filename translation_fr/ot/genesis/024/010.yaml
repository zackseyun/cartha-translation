  text: וַ/יִּקַּ֣ח הָ֠/עֶבֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִ/גְּמַלֵּ֤י אֲדֹנָי/ו֙ וַ/יֵּ֔לֶךְ וְ/כָל ט֥וּב אֲדֹנָ֖י/ו בְּ/יָד֑/וֹ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אֶל אֲרַ֥ם נַֽהֲרַ֖יִם אֶל עִ֥יר נָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: fr
  text: Le serviteur prit dix chameaux parmi ceux de son maître et partit, avec tous les biens précieux de son maître dont il avait la charge.[a] Puis il se mit en route et alla en Aram-Naharaïm,[b] à la ville de Nahor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et tous les biens précieux de son maître étaient dans sa main ». L’expression hébraïque peut indiquer la possession, le contrôle ou la charge; il s’agit probablement ici de biens précieux qu’il emportait comme présents.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Aram-Naharaïm »; traditionnellement « Mésopotamie » ou « Aram des Deux Fleuves ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: le serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce contexte domestique, « serviteur » est naturel sans trancher plus précisément son statut juridique.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: dix chameaux parmi ceux de son maître
  rationale: La préposition מִן exprime ici une sélection au sein des chameaux du maître; cette formulation française garde le sens partitif sans répéter inutilement « chameaux ».
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Dans ce récit de voyage, « partit » exprime naturellement le mouvement initial de הלך tout en maintenant la succession narrative.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: avec toutes sortes de biens appartenant à son maître sous sa responsabilité
  rationale: טוּב désigne ici vraisemblablement des biens de valeur destinés notamment aux présents. L’expression בְּיָדוֹ, littéralement « dans sa main », indique la possession, le contrôle ou la responsabilité; la traduction conserve cette portée sans suggérer qu’il tenait matériellement tous ces biens dans une seule main.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Puis il se mit en route et alla
  rationale: קום suivi de הלך marque le début résolu du voyage. « Se mit en route » rend cette valeur, tandis que « alla » maintient le second verbe et introduit la destination.
- source_word: אֲרַם נַהֲרַיִם
  choice: Aram-Naharaïm
  rationale: La translittération préserve le nom hébreu et évite d’imposer l’identification traditionnelle « Mésopotamie » ou la traduction interprétative « Aram des Deux Fleuves ».
- source_word: עִיר נָחוֹר
  choice: la ville de Nahor
  rationale: Cette traduction naturelle de la chaîne construite laisse ouverte la nature exacte du lien entre Nahor et la ville.
theological_decisions: []
