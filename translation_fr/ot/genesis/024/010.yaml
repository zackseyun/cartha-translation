revisions:
- from: Le serviteur prit dix chameaux parmi ceux de son maître et partit, avec toutes sortes de biens appartenant à son maître sous sa responsabilité.[a] Puis il se mit en route et alla en Aram-Naharaïm,[b] à la ville de Nahor.
  to: Le serviteur prit dix chameaux parmi ceux de son maître et partit, avec tous les biens précieux de son maître dont il avait la charge.[a] Puis il se mit en route et alla en Aram-Naharaïm,[b] à la ville de Nahor.
  rationale: La révision remplace une expression française qui ajoutait l’idée de diversité (« toutes sortes ») par une expression correspondant plus étroitement à la valeur de טוּב dans ce contexte. Elle conserve le partitif des chameaux, la double progression narrative et l’ambiguïté contrôlée de l’idiome בְּיָדוֹ.
