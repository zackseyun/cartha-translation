source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: fr
  text: 'Yahweh, le Dieu du ciel, qui m’a fait quitter la maison de mon père et le pays où je suis né, qui m’a parlé et qui m’a fait ce serment : « Je donnerai ce pays à ta descendance », lui-même enverra son ange[a] devant toi, et tu prendras pour mon fils une femme de là-bas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son messager ». Le mot hébreu מַלְאָךְ peut désigner un messager humain ou un ange ; dans ce contexte, un messager céleste est plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: le Dieu du ciel
  rationale: Expression française naturelle qui conserve le rapport de dépendance de l’hébreu.
- source_word: לְקָחַנִי
  choice: m’a fait quitter
  rationale: Dans ce contexte, לקח décrit l’action par laquelle Dieu a retiré Abraham de son milieu d’origine; cette formulation est naturelle en français sans surinterpréter la manière de son départ.
- source_word: מִבֵּית אָבִי
  choice: la maison de mon père
  rationale: Conserve l’expression familiale et domestique de l’hébreu.
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: et le pays où je suis né
  rationale: Rend le sens de terre natale sans préciser indûment qu’il s’agit du groupe de parenté.
- source_word: דִּבֶּר לִי
  choice: m’a parlé
  rationale: Maintient le verbe général « parler » sans l’assimiler à la promesse qui suit.
- source_word: נִשְׁבַּע לִי
  choice: m’a fait ce serment
  rationale: Formulation idiomatique en français pour le verbe employé dans un contexte de serment.
- source_word: לְזַרְעֲךָ
  choice: à ta descendance
  rationale: Préserve le sens collectif de זֶרַע dans un français moderne et accessible.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: Je donnerai ce pays
  rationale: Rend directement la formule de promesse; « pays » convient ici à la terre désignée.
- source_word: הוּא
  choice: lui-même
  rationale: Marque l’insistance portée par le pronom hébreu autonome.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: enverra son ange devant toi
  rationale: « Ange » est le sens le plus probable dans ce contexte d’assistance divine, tandis que « devant toi » reste proche de l’expression hébraïque.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: et tu prendras là-bas une femme pour mon fils
  rationale: Conserve la forme de mission et le lien explicite entre le lieu d’origine et le choix de l’épouse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; la translittération préserve le nom personnel au lieu de lui substituer un titre.
- issue: Sens de מַלְאָכוֹ dans ce contexte
  choice: son ange
  alternative: son messager
  rationale: Le contexte de conduite providentielle favorise un messager céleste, mais le terme hébreu permet lexicalement les deux sens; l’autre possibilité est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe ample de la déclaration d’Abraham est conservée, tout en employant des tournures françaises naturelles. Le pronom « lui-même » restitue l’emphase de הוּא.
