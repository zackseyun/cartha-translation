  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: fr
  text: Sara, la femme de mon maître, lui a donné un fils alors qu’elle était déjà âgée. Et mon maître a donné à ce fils tout ce qu’il possédait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: a donné un fils
  rationale: Le qal wayyiqtol de ילד exprime l’accouchement. En français courant, « donner un fils à » est naturel ici et conserve le lien avec לַאדֹנִי.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: la femme de mon maître
  rationale: Rend directement la construction possessive hébraïque et maintient le langage respectueux du serviteur.
- source_word: בֵן לַאדֹנִי
  choice: un fils à mon maître
  rationale: L’indéfini convient à l’annonce de la naissance, tandis que « à mon maître » conserve la relation marquée par ל.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: alors qu’elle était déjà âgée
  rationale: Littéralement « après sa vieillesse », expression temporelle difficile à reproduire telle quelle en français. Cette formulation naturelle communique son âge avancé sans suggérer que sa vieillesse était terminée.
- source_word: וַיִּתֶּן לוֹ
  choice: Et mon maître a donné à ce fils
  rationale: Le sujet implicite est Abraham et le bénéficiaire est le fils qui vient d’être mentionné. Les expliciter évite une suite de pronoms ambiguë en français.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: tout ce qu’il possédait
  rationale: Rend naturellement la formule hébraïque de totalité des biens.
theological_decisions:
- issue: Portée de la déclaration sur les biens d’Abraham
  choice: a donné à ce fils tout ce qu’il possédait
  alternative: a fait de ce fils l’héritier de tous ses biens
  rationale: La traduction conserve l’affirmation concrète du texte sans la transformer en terminologie juridique ni chercher à l’harmoniser avec d’autres passages.
translation_notes:
  register: Français international moderne, digne et narratif. Les référents des pronoms hébreux sont explicités pour assurer la clarté, sans ajouter d’information étrangère au contexte immédiat.
