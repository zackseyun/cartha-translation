  variant: modern international French
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל הָ/עֶ֗בֶד מִֽי הָ/אִ֤ישׁ הַלָּזֶה֙ הַ/הֹלֵ֤ךְ בַּ/שָּׂדֶה֙ לִ/קְרָאתֵ֔/נוּ וַ/יֹּ֥אמֶר הָ/עֶ֖בֶד ה֣וּא אֲדֹנִ֑/י וַ/תִּקַּ֥ח הַ/צָּעִ֖יף וַ/תִּתְכָּֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: fr
  text: 'Elle demanda au serviteur[a] : « Qui est cet homme-là qui marche dans le champ à notre rencontre ? » Le serviteur répondit : « C’est mon maître[b]. » Alors elle prit le voile et s’en couvrit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’esclave ». Le terme hébreu peut désigner un serviteur ou une personne en condition d’esclavage.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon seigneur ». Il s’agit ici du maître humain du serviteur, non d’un titre divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: le serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce récit, l’homme agit comme l’intendant de confiance d’Abraham ; « serviteur » est donc naturel, tout en signalant l’autre possibilité en note.
- source_word: הָאִישׁ הַלָּזֶה
  choice: cet homme-là
  rationale: Cette formulation française désigne naturellement un homme visible à une certaine distance et rend la valeur déictique marquée de הַלָּזֶה.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: qui marche dans le champ à notre rencontre
  rationale: La traduction conserve le sens participial de הֹלֵךְ, la valeur locative de בַּשָּׂדֶה et le mouvement exprimé par לִקְרָאתֵנוּ.
- source_word: הוּא אֲדֹנִי
  choice: C’est mon maître
  rationale: Dans la relation sociale décrite ici, אֲדֹנִי désigne le maître humain du serviteur. « C’est » constitue une réponse idiomatique en français à la question d’identification.
- source_word: הַצָּעִיף
  choice: le voile
  rationale: צָעִיף désigne ici une pièce d’étoffe féminine servant à se couvrir ; « voile » est le terme français le plus clair dans cette scène.
- source_word: וַתִּתְכָּס
  choice: et s’en couvrit
  rationale: La forme verbale est réfléchie. Le pronom « en » rattache explicitement l’action au voile qui vient d’être pris, sans ajouter une partie du corps absente de l’hébreu.
theological_decisions:
- issue: Sens de אֲדֹנִי
  choice: mon maître
  alternative: mon seigneur
  rationale: Le mot exprime ici l’autorité sociale d’Isaac sur le serviteur et non un titre divin. « Maître » évite une association théologique étrangère au contexte, tandis que l’alternative littérale est conservée en note.
translation_notes:
  register: Français international actuel, narratif et digne. Les deux répliques sont formulées de manière naturelle, tandis que « cet homme-là » préserve la désignation visible et distante du texte hébreu. « S’en couvrit » rend clairement le réfléchi sans préciser au-delà du texte comment le voile était porté.
