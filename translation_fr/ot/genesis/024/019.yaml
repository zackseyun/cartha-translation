base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: fr
  text: 'Quand elle eut fini de lui donner à boire, elle dit : « Je vais aussi puiser de l’eau pour tes chameaux, jusqu’à ce qu’ils aient fini de boire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: Quand elle eut fini de lui donner à boire
  rationale: Le verbe כלה suivi de l’infinitif marque l’achèvement de l’action précédente. Le plus-que-parfait antérieur français exprime naturellement cette succession, et « donner à boire » rend clairement le hiphil de שקה avec son suffixe masculin singulier.
- source_word: וַתֹּאמֶר
  choice: elle dit
  rationale: Formule narrative standard. Le français n’a pas besoin de reproduire systématiquement le waw initial par « et ».
- source_word: גַּם לִגְמַלֶּיךָ
  choice: aussi … pour tes chameaux
  rationale: « Aussi » conserve la valeur additive de גַּם, tandis que « pour tes chameaux » exprime le bénéficiaire et maintient le suffixe possessif.
- source_word: אֶשְׁאָב
  choice: je vais … puiser de l’eau
  rationale: שאב désigne l’action de puiser. « De l’eau » est explicité par le contexte; le futur proche convient à l’offre suivie d’une action immédiate.
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: jusqu’à ce qu’ils aient fini de boire
  rationale: עַד אִם introduit ici le terme de l’action. Le subjonctif passé après « jusqu’à ce que » rend en français l’achèvement envisagé exprimé par כִּלּוּ et son complément infinitif.
