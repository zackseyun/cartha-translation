source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: fr
  text: 'Il me répondit : « Yahweh, devant qui j’ai marché, enverra son ange avec toi, fera réussir ton voyage[a], et tu prendras pour mon fils une femme de mon clan[b] et de la maison de mon père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fera réussir ton chemin » ou « fera prospérer ta voie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de ma famille » ; le terme hébreu peut désigner un groupe de parenté étendu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: devant qui j’ai marché
  rationale: Conserve l’image hébraïque d’une vie menée devant Dieu, sans expliciter abusivement l’idée de fidélité.
- source_word: מַלְאָכוֹ
  choice: son ange
  rationale: Dans ce contexte, il s’agit du messager céleste envoyé par Dieu pour accompagner la mission.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: fera réussir ton voyage
  rationale: Exprime clairement le sens causatif du verbe et applique « chemin » au déplacement entrepris par le serviteur.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: tu prendras … une femme
  rationale: Maintient l’expression matrimoniale du texte tout en précisant naturellement en français qu’elle est destinée au fils.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: de mon clan
  rationale: Rend le groupe de parenté plus large que la seule famille immédiate.
- source_word: וּמִבֵּית אָבִי
  choice: et de la maison de mon père
  rationale: Préserve l’expression hébraïque désignant la maisonnée ou la lignée paternelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le nom personnel est conservé par translittération, sans le remplacer par un titre ni privilégier une forme confessionnelle traditionnelle.
- issue: Sens de « marcher devant » Dieu
  choice: conserver l’image « devant qui j’ai marché »
  alternative: devant qui j’ai vécu fidèlement / en présence de qui j’ai vécu
  rationale: La formulation garde l’idée d’une vie menée sous le regard de Dieu et sa portée relationnelle, sans ajouter explicitement une évaluation morale absente des mots eux-mêmes.
translation_notes:
  register: Français international actuel, clair et digne. L’ordre des propositions et l’image de la marche devant Dieu restent proches de l’hébreu, tandis que « voyage » explicite naturellement la valeur contextuelle de « chemin ». Les marqueurs de notes ont été placés sur les expressions auxquelles les variantes se rapportent.
