source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ בַּת מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑/י הֲ/יֵ֧שׁ בֵּית אָבִ֛י/ךְ מָק֥וֹם לָ֖/נוּ לָ/לִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: fr
  text: 'Il lui demanda : « De qui es-tu la fille ? Dis-le-moi, je te prie. Y a-t-il, dans la maison de ton père, de la place[a] pour que nous y passions la nuit ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un endroit où loger ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il lui demanda
  rationale: Le verbe signifie littéralement « il dit », mais il introduit ici deux questions adressées à la jeune femme ; « demanda » rend naturellement sa fonction dans le contexte sans modifier le contenu.
- source_word: בַּת מִי אַתְּ
  choice: De qui es-tu la fille ?
  rationale: Cette formulation française naturelle conserve la question hébraïque sur l’identité familiale de la jeune femme.
- source_word: הַגִּידִי נָא לִי
  choice: Dis-le-moi, je te prie
  rationale: L’impératif féminin singulier est adouci par נָא ; « je te prie » en restitue la politesse dans un registre actuel et digne.
- source_word: הֲיֵשׁ
  choice: Y a-t-il
  rationale: Cette tournure rend directement la particule existentielle qui introduit la question.
- source_word: בֵּית אָבִיךְ
  choice: dans la maison de ton père
  rationale: Le choix conserve l’image concrète de la maison paternelle ainsi que sa dimension de maisonnée.
- source_word: מָקוֹם
  choice: de la place
  rationale: Dans ce contexte d’hospitalité, le mot désigne l’espace disponible pour accueillir les voyageurs ; « de la place » est idiomatique en français.
- source_word: לָנוּ
  choice: pour que nous
  rationale: 'Le pluriel est maintenu : le serviteur parle pour lui-même et pour les personnes qui l’accompagnent.'
- source_word: לָלִין
  choice: y passions la nuit
  rationale: L’infinitif exprime le fait de loger pour une nuit ; cette formulation est claire et naturelle en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe interrogative reste fluide, et la formule « je te prie » préserve la politesse de נָא sans donner au propos un ton autoritaire.
