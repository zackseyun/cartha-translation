base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: fr
  text: Rébecca avait un frère, nommé Laban. Laban courut dehors vers l’homme, près de la source.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers l’homme, dehors, vers la source ».'
    reason: La syntaxe hébraïque enchaîne deux compléments introduits par אֶל (« vers »), ce qui permet aussi de comprendre que Laban courut vers l’homme puis vers la source.
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: Rébecca avait un frère
  rationale: La construction לְ suivie d’un nom exprime ici la possession. En français courant, « Rébecca avait » rend naturellement cet idiome, sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: nommé Laban
  rationale: Cette formulation française concise et naturelle transmet la formule hébraïque « et son nom était Laban » sans en modifier le sens.
- source_word: וַ/יָּרָץ
  choice: courut
  rationale: Le verbe רוץ signifie directement « courir »; le passé simple convient au registre narratif biblique moderne et soutenu.
- source_word: אֶל הָ/אִישׁ
  choice: vers l’homme
  rationale: אֶל indique le mouvement en direction de quelqu’un. « L’homme » préserve la désignation générique du texte hébreu sans expliciter qu’il s’agit du serviteur d’Abraham.
- source_word: הַ/חוּצָ/ה
  choice: dehors
  rationale: La forme directionnelle signifie « vers l’extérieur/dehors »; en français, « courut dehors » en rend clairement la valeur adverbiale.
- source_word: אֶל הָ/עָיִן
  choice: près de la source
  rationale: עַיִן désigne précisément une source plutôt qu’un puits. Dans l’enchaînement de deux groupes introduits par אֶל, « près de » exprime naturellement le lieu où se trouve l’homme, tout en laissant en note la construction plus littérale.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. Le passé simple maintient un registre narratif soigné. La phrase est scindée en deux pour éviter l’accumulation de « et » propre à l’hébreu tout en préservant la progression du récit.
