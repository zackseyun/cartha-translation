lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Il dit
  rationale: Le waw consécutif avec אמר fait avancer le récit. En français, « Il dit » rend naturellement cette succession sans surcharger la liaison.
- source_word: עֶבֶד
  choice: serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, l’homme se présente selon sa fonction dans la maison d’Abraham ; « serviteur » convient au contexte, tandis qu’une note conserve l’autre valeur lexicale possible.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: אָנֹכִי
  choice: Je suis
  rationale: Le pronom indépendant marque explicitement l’identité du locuteur. La copule est nécessaire en français dans cette phrase nominale.
