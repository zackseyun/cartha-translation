  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: fr
  text: mais tu iras dans mon pays, auprès de ma parenté[a], et tu prendras une femme pour mon fils Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans mon lieu d’origine ». Le terme hébreu peut désigner soit le lieu dont une personne est originaire, soit son groupe familial; ici, le contexte favorise le sens de « parenté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: mais
  rationale: 'Dans le contexte, la particule introduit l’instruction qui s’oppose à l’interdiction du verset précédent : la femme ne devra pas venir des Cananéens, mais du pays et de la parenté d’Abraham.'
- source_word: אֶל אַרְצִי
  choice: dans mon pays
  rationale: « Pays » exprime ici le territoire d’origine d’Abraham sans évoquer nécessairement un État moderne; avec le verbe « aller », la préposition « dans » est naturelle en français.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: auprès de ma parenté
  rationale: Le nom hébreu peut désigner le groupe familial ou le lieu d’origine. Le contexte matrimonial favorise ici le sens collectif de « parenté »; « auprès de » convient naturellement à des personnes tout en distinguant ce complément de « dans mon pays ».
- source_word: תֵּלֵךְ
  choice: tu iras
  rationale: L’imparfait hébreu a ici une valeur directive. Le futur français transmet naturellement l’ordre donné dans le cadre du serment.
- source_word: וְלָקַחְתָּ
  choice: et tu prendras
  rationale: Le verbe signifie littéralement « prendre » et, avec « une femme » comme complément, exprime naturellement le fait de la choisir en vue du mariage.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Dans ce contexte matrimonial, « une femme » désigne celle qui deviendra l’épouse d’Isaac; la construction française « prendre une femme pour » rend ce sens sans ajouter un verbe absent du texte.
- source_word: לִבְנִי לְיִצְחָק
  choice: pour mon fils Isaac
  rationale: La répétition de la préposition hébraïque marque l’apposition. Le français naturel réunit le titre familial et le nom propre sans répéter « pour ».
