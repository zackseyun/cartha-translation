  rationale: La révision remplace l’interprétation temporelle de נָא par une formulation de requête polie, sans trancher au-delà de la syntaxe conditionnelle et inachevée de l’hébreu. Elle rétablit aussi explicitement le possessif de « mon chemin » et ajuste la note correspondante.
