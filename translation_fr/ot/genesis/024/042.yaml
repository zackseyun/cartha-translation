source:
  edition: WLC
  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: fr
  text: 'Aujourd’hui, je suis arrivé à la source[a] et j’ai dit : « Yahweh, Dieu de mon maître Abraham, si tu veux bien faire réussir mon chemin, sur lequel je marche[b]… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au point d’eau ». Le mot hébreu désigne plus précisément une source ou un endroit d’où jaillit l’eau.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « mon chemin, sur lequel je marche »; il s’agit ici du voyage ou de la mission du serviteur.
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: Aujourd’hui, je suis arrivé
  rationale: Le waw narratif présente une action passée, tandis que הַיּוֹם souligne que l’arrivée a eu lieu ce même jour. Cette formulation est naturelle en français moderne et conserve cette mise en relief temporelle.
- source_word: הָעָיִן
  choice: la source
  rationale: עַיִן désigne ici une source ou un point d’eau naturel. « Source » est plus précis que « puits » dans ce verset.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel employé dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Dieu de mon maître Abraham
  rationale: אֲדֹנִי désigne Abraham en tant que maître humain du serviteur. « Mon maître » exprime clairement cette relation en français contemporain.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: si tu fais maintenant réussir
  rationale: La construction est elliptique et introduit une demande conditionnelle. Le participe hiphil de צלח exprime le fait de faire réussir; נָא, rendu ici par « maintenant », conserve la nuance pressante sans transformer la phrase en affirmation.
- source_word: דַּרְכִּי אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: le chemin que je suis en train de suivre
  rationale: « Le chemin » conserve l’image et le sens de דֶּרֶךְ, tandis que la tournure progressive rend le participe הֹלֵךְ. Le possessif hébreu est naturellement exprimé par la relative en français; une note signale la forme littérale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Valeur de la proposition conditionnelle inachevée
  choice: si tu fais maintenant réussir…
  alternative: si tu veux bien faire réussir…
  rationale: La phrase demeure suspendue jusqu’au verset suivant. Le rendu choisi préserve cette syntaxe ouverte et l’ambiguïté entre constat conditionnel et requête polie.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conditionnelle reste volontairement inachevée, comme dans l’hébreu, et se poursuit au verset suivant.
