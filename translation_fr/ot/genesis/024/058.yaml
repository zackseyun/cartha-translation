base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: fr
  text: 'Ils appelèrent Rébecca et lui dirent : « Iras-tu avec cet homme ? » Elle dit : « J’irai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: Ils appelèrent Rébecca
  rationale: קרא signifie ici appeler quelqu’un afin qu’il prenne part à la discussion. « Appelèrent » est naturel et ne suggère pas l’autorité plus forte de « convoquèrent ».
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: lui dirent
  rationale: La formulation conserve le verbe courant אמר, « dire », plutôt que de l’expliciter par « lui demandèrent », bien que les paroles qui suivent soient une question.
- source_word: הֲתֵלְכִי
  choice: Veux-tu partir
  rationale: Dans ce contexte, la question porte sur la décision de Rébecca d’accompagner l’homme et de quitter sa famille. « Veux-tu » rend naturellement en français la valeur volitive de la question, tandis que « partir » convient au mouvement envisagé depuis son lieu actuel sans ajouter de destination.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: avec cet homme
  rationale: אִישׁ signifie explicitement « homme ». Même si le personnage est le serviteur d’Abraham, le texte ne le désigne pas ici comme serviteur.
- source_word: וַתֹּאמֶר
  choice: Elle répondit
  rationale: Le verbe hébreu est littéralement « elle dit », mais « elle répondit » restitue avec naturel la fonction du propos dans ce bref échange, sans en modifier le contenu.
- source_word: אֵלֵךְ
  choice: Je partirai
  rationale: La forme exprime une décision ferme en réponse à la question. La répétition de « partir » assure la cohérence idiomatique du dialogue en français; « j’irai » serait également possible, mais paraît moins naturel après « partir avec ».
