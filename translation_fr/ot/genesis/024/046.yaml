  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: fr
  text: 'Elle s’empressa d’abaisser sa cruche de son épaule[a] et dit : « Bois, et je donnerai aussi à boire à tes chameaux. » Je bus donc, et elle donna aussi à boire aux chameaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’au-dessus d’elle ». Le contexte général laisse penser que la cruche était portée sur son épaule, mais cette partie du corps n’est pas précisée ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Elle s’empressa
  rationale: Le verbe מהר exprime la rapidité ou l’empressement. Cette tournure française naturelle conserve l’accent narratif sur la promptitude de Rébecca.
- source_word: וַתּוֹרֶד
  choice: d’abaisser
  rationale: La forme causative de ירד signifie ici « faire descendre ». « Abaisser » décrit naturellement le mouvement de la cruche sans alourdir la phrase.
- source_word: כַּדָּהּ
  choice: sa cruche
  rationale: כד désigne un récipient servant notamment à puiser et transporter de l’eau. « Cruche » est courant et précis dans ce contexte.
- source_word: מֵעָלֶיהָ
  choice: de son épaule[a]
  rationale: L’hébreu dit littéralement « de dessus elle » sans nommer la partie du corps. Le contexte de Genèse 24 indique vraisemblablement l’épaule; cette précision naturelle est signalée par une note afin de préserver l’indétermination formelle du verset.
- source_word: שְׁתֵה
  choice: Bois
  rationale: L’impératif direct restitue la brièveté de l’hébreu.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: et je donnerai aussi à boire à tes chameaux
  rationale: Le causatif de שקה signifie fournir à boire. Cette formulation est idiomatique en français et conserve explicitement l’idée de donner de l’eau.
- source_word: וָאֵשְׁתְּ
  choice: Je bus donc
  rationale: Le passé simple convient au récit suivi et « donc » rend naturellement la progression consécutive après l’invitation.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: et elle donna aussi à boire aux chameaux
  rationale: Cette formulation reprend le même verbe français que dans la parole de Rébecca et reflète le causatif de שקה.
