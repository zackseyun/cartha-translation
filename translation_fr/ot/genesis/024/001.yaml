  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: fr
  text: Abraham était vieux, avancé en âge[a], et Yahweh avait béni Abraham en tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « venu dans les jours », expression hébraïque signifiant qu’il était d’un âge avancé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: Le waw ouvre ici une nouvelle unité narrative. En français, il n’est pas nécessaire de le rendre explicitement en tête de phrase.
- source_word: זָקֵן
  choice: était vieux
  rationale: Rendu direct et naturel de l’état d’Abraham, sans atténuer le sens.
- source_word: בָּא בַּ/יָּמִים
  choice: avancé en âge
  rationale: Cette expression idiomatique, littéralement « venu dans les jours », indique un âge avancé. Le français retenu préserve le sens et la dignité du registre.
- source_word: וַֽ/יהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu comme un nom propre, conformément à sa présence explicite dans le texte hébreu.
- source_word: בֵּרַךְ
  choice: avait béni
  rationale: Le plus-que-parfait présente la bénédiction comme un état déjà établi à l’arrière-plan du récit.
- source_word: בַּ/כֹּל
  choice: en toutes choses
  rationale: Cette formulation exprime la portée globale de la bénédiction tout en restant proche de l’hébreu et naturelle dans un registre biblique moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le Tétragramme. « Yahweh » préserve ici le caractère de nom propre sans substituer un titre.
- issue: Portée de בַּכֹּל
  choice: en toutes choses
  alternative: à tous égards
  rationale: L’hébreu affirme une bénédiction globale sans en préciser les domaines. Le rendu choisi conserve cette ampleur et cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. La répétition du nom « Abraham » est conservée afin de refléter la structure hébraïque. La note est placée après « avancé en âge », expression qu’elle explique directement.
