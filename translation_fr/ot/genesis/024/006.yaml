  yaml_path: translation/ot/genesis/024/006.yaml
  text: Abraham said to him[a], “Be careful that you do not take my son back there.”
translation:
  language: fr
  text: 'Abraham lui dit : « Garde-toi bien de ramener mon fils là-bas.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « faire retourner mon fils là-bas ». Le verbe hébreu est causatif : « faire revenir » ou « faire retourner ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Abraham lui dit
  rationale: Le wayyiqtol de אמר appelle un passé simple narratif en français, et אֵלָיו est naturellement rendu par le pronom indirect « lui ».
- source_word: הִשָּׁמֶר לְךָ
  choice: Garde-toi bien
  rationale: L’impératif nifal de שׁמר accompagné du datif éthique exprime une mise en garde appuyée. « Garde-toi bien » est naturel, digne et plus précis ici qu’un simple « Fais attention ».
- source_word: פֶּן
  choice: de
  rationale: Après « Garde-toi bien », la préposition « de » introduit idiomatiquement l’action interdite et transmet la valeur négative de פֶּן sans archaïsme.
- source_word: תָּשִׁיב אֶת־בְּנִי
  choice: ramener mon fils
  rationale: Le hifil de שוב est causatif, littéralement « faire revenir ». « Ramener » exprime naturellement le déplacement causé du fils vers un lieu antérieur, tout en laissant la note signaler une autre formulation possible.
- source_word: שָׁמָּה
  choice: là-bas
  rationale: L’adverbe directionnel désigne le lieu évoqué dans le contexte. « Là-bas » rend clairement l’éloignement spatial en français courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « Garde-toi bien de » conserve la force de l’avertissement sans recourir à une formulation archaïque. Le marqueur de note est placé après la proposition concernée.
