source:
  edition: WLC
  text: וַ/יְסַפֵּ֥ר הָ/עֶ֖בֶד לְ/יִצְחָ֑ק אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: fr
  text: Le serviteur raconta à Isaac tout ce qu’il avait fait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui s’était passé ». Le terme hébreu peut désigner des paroles, des faits, des affaires ou des événements.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: raconta
  rationale: Le piel de ספר exprime ici le récit détaillé de la mission accomplie. « Raconta » est naturel en français et convient mieux au contexte que le simple « dit ».
- source_word: הָעֶבֶד
  choice: le serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce récit, le personnage est surtout présenté selon sa fonction au service d’Abraham; « serviteur » rend ce rôle sans nier la gamme sémantique du terme hébreu.
- source_word: לְיִצְחָק
  choice: à Isaac
  rationale: Le nom propre est rendu selon sa forme française traditionnelle; la préposition לְ marque ici le destinataire du récit.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: tout ce que
  rationale: דְּבָרִים peut signifier paroles, affaires, faits ou choses. Dans ce contexte, l’expression vise globalement les actes et événements de la mission; « tout ce que » donne une formulation française naturelle avec le verbe « faire ».
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait fait
  rationale: Le plus-que-parfait indique naturellement en français que les actes du serviteur ont précédé le moment où il les raconte.
theological_decisions:
- issue: Référent du sujet de עָשָׂה
  choice: « il » renvoie au serviteur
  alternative: Le pronom pourrait être laissé formellement sans référent explicité, comme en hébreu.
  rationale: Le sujet implicite se rapporte le plus naturellement au serviteur qui vient de rentrer de sa mission et qui en fait le récit à Isaac; la traduction française conserve néanmoins le pronom plutôt que de répéter le nom.
translation_notes:
  register: Français moderne, courant et digne. « Raconta » restitue le caractère récapitulatif du verbe hébreu. Une seule note signale l’étendue sémantique de דְּבָרִים sans alourdir ce verset bref.
