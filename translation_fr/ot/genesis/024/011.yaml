  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: fr
  text: Il fit agenouiller les chameaux hors de la ville, près du puits, vers le soir, au moment où les femmes sortaient pour puiser de l’eau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ הַגְּמַלִּים
  choice: Il fit agenouiller les chameaux
  rationale: La forme causative du verbe ברך décrit ici l’action de faire mettre les chameaux à genoux. Cette formulation est concrète et naturelle en français.
- source_word: מִחוּץ לָעִיר
  choice: hors de la ville
  rationale: Rend directement la localisation extérieure à l’agglomération dans un registre narratif digne et courant.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: près du puits
  rationale: אֶל indique l’approche ou la direction vers le puits; dans le contexte du stationnement des chameaux, le français exprime naturellement la position résultante par « près du puits ». Le complément « d’eau », implicite en français dans « puits », n’est pas répété.
- source_word: לְעֵת עֶרֶב
  choice: vers le soir
  rationale: Cette expression française situe naturellement la scène au temps du soir sans lourdeur.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: au moment où les femmes sortaient pour puiser de l’eau
  rationale: Le participe hébreu est féminin pluriel et désigne donc des femmes. La tournure française exprime clairement leur sortie habituelle pour aller puiser.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque de לְעֵת est partiellement conservée par « vers le soir, au moment où », tout en évitant une formulation pesante. Aucun appel de note n’est nécessaire.
