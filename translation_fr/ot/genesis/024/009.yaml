  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: fr
  text: Alors le serviteur mit sa main sous la cuisse d’Abraham, son maître, et lui prêta serment au sujet de cette affaire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sous la cuisse » traduit littéralement une expression hébraïque décrivant un geste solennel de serment. Certains y voient un symbole lié aux reins ou à la descendance.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: le serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, le récit met surtout en avant sa fonction et sa responsabilité au sein de la maison d’Abraham; « serviteur » conserve la hiérarchie sociale sans alourdir le texte.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: mit sa main
  rationale: שׂוּם signifie couramment « mettre, placer ». « Mit sa main » est naturel en français et reste proche de la formulation hébraïque.
- source_word: תַּחַת יֶרֶךְ
  choice: sous la cuisse
  rationale: יָרֵךְ désigne littéralement la cuisse, tout en pouvant évoquer les reins ou la descendance dans certains contextes. Le texte principal conserve le geste concret sans imposer une interprétation symbolique.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: d’Abraham, son maître
  rationale: Dans ce rapport humain et domestique, אֲדוֹן exprime l’autorité du maître. Cette formulation évite la confusion que pourrait créer « seigneur » avec un titre divin.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: et lui prêta serment
  rationale: Le niphal de שׁבע signifie « jurer, prêter serment », et לוֹ indique que le serment est prêté à Abraham. « Lui prêta serment » est idiomatique et solennel en français.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: au sujet de cette affaire
  rationale: דָּבָר peut signifier « parole », « chose » ou « affaire ». Ici, il renvoie à la mission et aux conditions qu’Abraham vient d’énoncer.
theological_decisions:
- issue: Traduction littérale du geste de serment ou interprétation de son symbolisme
  choice: Conserver « sous la cuisse » dans le texte et expliquer brièvement le geste en note.
  alternative: Traduire de manière interprétative par une allusion aux reins, aux organes génitaux ou à la descendance de l’alliance.
  rationale: L’hébreu décrit le geste sans en expliquer explicitement la portée. Une traduction concrète préserve l’ambiguïté historique et théologique au lieu d’imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, naturel et digne. « Prêta serment » maintient le caractère solennel de la scène; la syntaxe reste fluide tout en suivant de près l’ordre et le contenu de l’hébreu.
