  text: וָ/אֹמַ֖ר אֶל אֲדֹנִ֑/י אֻלַ֛י לֹא תֵלֵ֥ךְ הָ/אִשָּׁ֖ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/039.yaml
  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: fr
  text: 'J’ai dit à mon maître : « Peut-être que la femme ne me suivra pas[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « n’ira pas après moi » ou « ne viendra pas à ma suite ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: J’ai dit
  rationale: Le wayyiqtol de אמר fait progresser le récit. Dans ce discours rapporté, le passé composé est naturel en français moderne, sans qu’il soit nécessaire de rendre explicitement la coordination initiale.
- source_word: אֶל אֲדֹנִי
  choice: à mon maître
  rationale: אָדוֹן avec le suffixe de première personne désigne ici Abraham comme supérieur humain du serviteur. « Mon maître » exprime naturellement cette relation et évite toute confusion avec un titre divin.
- source_word: אֻלַי
  choice: Peut-être que
  rationale: La particule exprime une possibilité incertaine. Cette tournure est claire et naturelle en français moderne.
- source_word: לֹא תֵלֵךְ
  choice: ne me suivra pas
  rationale: הלך signifie fondamentalement « aller, marcher », mais avec אַחֲרַי l’ensemble signifie idiomatiquement « suivre ». Le futur convient à la perspective du discours rapporté.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le nom signifie simplement « la femme ». Même si le contexte concerne une future épouse, le texte ne la désigne pas encore ainsi.
- source_word: אַחֲרָי
  choice: me suivra
  rationale: L’expression signifie littéralement « ira après moi », mais « me suivra » en communique naturellement le sens en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient au récit oral du serviteur; la formulation conserve l’incertitude exprimée par אֻלַי et évite de préciser au-delà de l’hébreu le statut de la femme.
