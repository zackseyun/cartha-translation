  variant: modern international French
source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה וְ/אִ֖ישׁ לֹ֣א יְדָעָ֑/הּ וַ/תֵּ֣רֶד הָ/עַ֔יְנָ/ה וַ/תְּמַלֵּ֥א כַדָּ֖/הּ וַ/תָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: fr
  text: La jeune femme était très belle, vierge, et aucun homme ne l’avait connue[a]. Elle descendit à la source[b], remplit sa cruche et remonta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire : aucun homme n’avait eu de relations sexuelles avec elle. Littéralement, l’hébreu dit : « aucun homme ne l’avait connue ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu désigne ici une source ; certaines traductions emploient « puits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: la jeune femme
  rationale: נַעֲרָה désigne ici une jeune personne de sexe féminin, vraisemblablement en âge de se marier. « Jeune femme » est naturel en français moderne, contrairement à « jeune fille », qui pourrait suggérer un âge trop tendre, ou à « jeune vierge », plus archaïque et redondant ici.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: très belle
  rationale: L’expression qualifie littéralement son apparence de très belle. « Très belle » rend naturellement en français la beauté visible exprimée par l’hébreu, sans le tour pesant « très belle d’apparence ».
- source_word: בְּתוּלָה
  choice: vierge
  rationale: Dans ce récit, בְּתוּלָה désigne directement une femme vierge. Le terme français conserve le sens et la sobriété de l’original.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: et aucun homme ne l’avait connue
  rationale: יָדַע, « connaître », sert ici d’euphémisme hébreu pour les relations sexuelles. La formulation littéraire est conservée dans le texte, et son sens est explicité en note.
- source_word: הָעַיְנָה
  choice: à la source
  rationale: עַיִן désigne une source ou un point d’eau naturel. « Source » est plus précis que « puits », lequel correspond généralement à un autre mot hébreu.
- source_word: כַדָּהּ
  choice: sa cruche
  rationale: כַּד désigne un récipient servant notamment à puiser et transporter l’eau. « Cruche » est un équivalent français courant et concret.
- source_word: וַתָּעַל
  choice: et remonta
  rationale: עָלָה exprime un mouvement ascendant. « Remonta » fait naturellement écho à la descente vers la source et conserve le contraste spatial du récit.
theological_decisions:
- issue: Rapport entre « vierge » et « aucun homme ne l’avait connue »
  choice: Conserver les deux affirmations et l’euphémisme « connaître »
  alternative: Fusionner les deux en une seule affirmation explicite sur l’absence de relations sexuelles
  rationale: L’hébreu juxtapose intentionnellement le terme בְּתוּלָה et la précision qu’aucun homme ne l’avait connue. Les maintenir respecte l’insistance du texte sans réduire sa formulation ni lui imposer une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, fluide et digne. Le récit reste concis ; le passé simple convient à la progression narrative, tandis que l’imparfait et le plus-que-parfait décrivent la jeune femme et sa situation antérieure. Aucun connecteur tel que « Or » ou « Maintenant » n’a été ajouté en tête, puisque l’hébreu ne comporte pas de marqueur temporel explicite.
