reference: Genesis 24:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: fr
  text: 'Que la jeune femme à qui je dirai : « Penche, je te prie, ta cruche pour que je boive », et qui répondra : « Bois, et je donnerai aussi à boire à tes chameaux », soit celle que tu as désignée pour ton serviteur Isaac[a]. Par elle[b], je saurai que tu as manifesté ta bonté fidèle envers mon maître.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour ton serviteur, pour Isaac ». L’hébreu peut être compris comme deux expressions distinctes, mais il se lit naturellement aussi avec « Isaac » en apposition à « ton serviteur ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Par ce signe ». L’hébreu dit littéralement « par elle », ce qui renvoie naturellement à la jeune femme et peut aussi désigner son rôle de signe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Que… soit
  rationale: La tournure optative française intègre naturellement la demande exprimée dans la prière, sans reproduire lourdement la formule hébraïque mot à mot.
- source_word: הַנַּעֲרָ
  choice: la jeune femme
  rationale: Le terme désigne ici une personne de sexe féminin en âge de se marier. « Jeune femme » est actuel et n’implique pas qu’il s’agisse d’une enfant.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: Baisse, je te prie, ta cruche
  rationale: « Baisse » exprime clairement le mouvement demandé; « je te prie » rend la particule polie נָא dans un registre digne et naturel.
- source_word: וְאֶשְׁתֶּה
  choice: pour que je boive
  rationale: Cette formulation rend la valeur volitive du verbe et son lien logique avec la demande précédente.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: et je donnerai aussi à boire à tes chameaux
  rationale: Le causatif de שׁקה signifie faire boire ou donner à boire. Cette expression est plus naturelle en français que « abreuver » dans une réplique spontanée.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: celle que tu as désignée
  rationale: Dans ce contexte, le verbe indique que Dieu fait reconnaître ou détermine la femme choisie. « Désignée » conserve ce sens sans expliciter outre mesure le mécanisme du signe.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: pour ton serviteur, pour Isaac
  rationale: La répétition de « pour » et la ponctuation préservent la séquence hébraïque ainsi que la possibilité de distinguer le serviteur qui prie d’Isaac, tout en signalant en note la lecture appositionnelle courante.
- source_word: וּבָהּ אֵדַע
  choice: Par elle, je saurai
  rationale: Le suffixe féminin renvoie le plus directement à la jeune femme, qui servira de signe. Une note conserve l’autre compréhension possible, centrée sur l’événement ou le signe.
- source_word: כִּי עָשִׂיתָ חֶסֶד
  choice: que tu as témoigné un amour fidèle
  rationale: « Amour fidèle » rend la bonté loyale et durable exprimée par חֶסֶד, sans réduire le terme à une simple gentillesse ni lui imposer ici un sens technique.
- source_word: עִם אֲדֹנִי
  choice: à mon maître
  rationale: Avec « témoigner un amour fidèle », la préposition « à » est idiomatique en français tout en rendant la relation exprimée par עִם.
theological_decisions:
- issue: Référent de « ton serviteur » dans לְעַבְדְּךָ לְיִצְחָק
  choice: « pour ton serviteur, pour Isaac », où les deux groupes peuvent être entendus séparément
  alternative: « pour ton serviteur Isaac », où « Isaac » est en apposition à « ton serviteur »
  rationale: L’hébreu permet une lecture appositionnelle, très naturelle, mais sa répétition de la préposition autorise aussi de distinguer les deux expressions. Le texte principal conserve cette structure et la note présente explicitement l’autre lecture, sans trancher silencieusement l’ambiguïté.
- issue: Référent du suffixe féminin dans וּבָהּ
  choice: « Par elle », en référence à la jeune femme
  alternative: « Par ce signe » ou « À cela »
  rationale: Le suffixe grammaticalement féminin renvoie naturellement à la jeune femme; il est toutefois possible de comprendre plus largement que la circonstance servira de signe. La note maintient cette possibilité.
- issue: Portée de חֶסֶד
  choice: « amour fidèle »
  alternative: « bonté », « bienveillance fidèle »
  rationale: Cette traduction garde la dimension relationnelle et loyale du terme sans en faire nécessairement une formule technique d’alliance.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe optative « Que… soit » rend la prière sans lourdeur. Les paroles directes restent naturelles, tandis que « je te prie » et « amour fidèle » maintiennent un registre biblique accessible.
