  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: fr
  text: Maintenant, si vous comptez agir avec bonté et fidélité envers mon maître[a], dites-le-moi. Sinon, dites-le-moi, pour que je puisse me tourner à droite ou à gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec amour constant et fidélité ». L’expression hébraïque évoque souvent une bonté loyale et digne de confiance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Introduit la conclusion pratique immédiate du discours; le français moderne n’exige pas de rendre la conjonction initiale.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: si vous comptez agir
  rationale: L’idiome associant « il y a en vous » à un participe exprime ici la disposition et l’action envisagée; « comptez agir » conserve cette orientation volontaire et future.
- source_word: חֶסֶד וֶאֱמֶת
  choice: avec bonté et fidélité
  rationale: Ce couple désigne une bienveillance loyale qui se manifeste par une conduite fiable. Cette formulation claire conserve les deux composantes sans imposer un vocabulaire technique d’alliance.
- source_word: אֶת אֲדֹנִי
  choice: envers mon maître
  rationale: « Envers » exprime naturellement la personne à l’égard de laquelle cette bonté fidèle doit être exercée.
- source_word: הַגִּידוּ לִי
  choice: dites-le-moi
  rationale: Impératif direct demandant une réponse explicite; le pronom « le » reprend naturellement la décision sollicitée.
- source_word: וְאִם לֹא
  choice: Sinon
  rationale: Rend de façon concise et naturelle l’autre branche de l’alternative.
- source_word: וְאֶפְנֶה
  choice: afin que je me tourne
  rationale: Le cohortatif exprime l’action que le serviteur entend entreprendre en conséquence de leur réponse; « afin que » en préserve la nuance de visée ou de résultat.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: à droite ou à gauche
  rationale: Conserve l’image directionnelle hébraïque, compréhensible comme la recherche d’une autre voie.
theological_decisions:
- issue: Portée relationnelle de חֶסֶד וֶאֱמֶת
  choice: bonté et fidélité
  alternative: amour constant et fidélité
  rationale: Le contexte concerne la loyauté bienveillante envers Abraham, mais le verset ne précise pas explicitement une alliance formelle; la traduction évite donc de surdéterminer la formule tout en signalant l’alternative en note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « dites-le-moi » est conservée, et « aussi » souligne sans lourdeur que le serviteur demande une réponse dans les deux cas.
