base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: fr
  text: 'Mon maître m’a fait prêter serment en ces termes : « Tu ne prendras pas une femme pour mon fils parmi les filles des Cananéens, dans le pays desquels je réside[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « parmi lesquels je réside ». L’hébreu dit littéralement : « le Cananéen, dans son pays je réside » ; le singulier a ici un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: m’a fait prêter serment
  rationale: Le hiphil de שׁבע signifie ici faire jurer quelqu’un ou lui imposer un serment. Cette formulation est naturelle en français moderne et conserve la force de l’engagement solennel.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Le serviteur parle de son supérieur humain, Abraham. « Mon maître » exprime clairement cette relation sans suggérer qu’il s’agit de Dieu.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule française courante pour introduire les paroles rapportées, correspondant à l’infinitif hébreu.
- source_word: לֹא תִקַּח
  choice: Tu ne prendras pas
  rationale: Le contexte du serment donne à l’imparfait une valeur prohibitive solennelle. Le futur français conserve bien ce ton.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Dans la construction « prendre une femme pour quelqu’un », le sens matrimonial est clair en français. Cette formulation reste proche de l’expression hébraïque sans devoir ajouter « comme épouse ».
- source_word: לִבְנִי
  choice: pour mon fils
  rationale: Rend exactement le texte sans ajouter le nom d’Isaac, fourni seulement par le contexte.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: parmi les filles des Cananéens
  rationale: « Filles des Cananéens » conserve l’expression familiale et ethnique de l’hébreu; « parmi » rend naturellement la sélection au sein du groupe.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: dont j’habite le pays
  rationale: Cette formulation conserve la mention explicite du pays et rend idiomatiquement la construction singulière collective de l’hébreu.
theological_decisions: []
