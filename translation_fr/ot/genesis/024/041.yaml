base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: fr
  text: Alors tu seras dégagé de mon serment lorsque tu te rendras auprès de ma famille. Et s’ils ne te la donnent pas, tu seras dégagé de mon serment.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ma malédiction » ; le terme hébreu peut désigner un serment assorti d’une malédiction ou d’une sanction.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: tu seras dégagé
  rationale: Dans ce contexte de serment, les deux formes de נקה expriment l’exemption d’une obligation, non l’innocence morale abstraite. La même traduction conserve le parallélisme du verset.
- source_word: מֵאָלָתִי
  choice: du serment que je t’ai fait prêter
  rationale: אָלָה désigne ici l’engagement sous serment imposé par Abraham au serviteur, avec une sanction implicite. Cette formulation française explicite naturellement la relation exprimée par le suffixe « mon ».
- source_word: כִּי
  choice: lorsque
  rationale: La conjonction introduit ici la circonstance temporelle dans laquelle le serviteur sera dégagé de son obligation; « lorsque » préserve cette valeur sans exclure toute nuance conditionnelle.
- source_word: תָבֹא אֶל מִשְׁפַּחְתִּי
  choice: tu te rendras auprès de ma famille
  rationale: Le mouvement est exprimé naturellement en français du point de vue du serviteur. מִשְׁפָּחָה désigne ici la famille élargie, sans qu’il soit nécessaire d’employer le terme plus marqué « clan ».
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: et s’ils ne te la donnent pas
  rationale: Le complément féminin, absent en hébreu mais évident dans le contexte, est rétabli en français pour éviter une construction incomplète; il renvoie à la femme recherchée comme épouse.
theological_decisions:
- issue: Sens de אָלָה dans le contexte du serment
  choice: serment
  alternative: imprécation / malédiction
  rationale: Le récit met au premier plan l’obligation jurée dont le serviteur peut être dégagé. Le mot peut aussi évoquer la malédiction ou sanction attachée au serment; cette nuance est conservée en note sans être suraccentuée dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Dégagé du serment » relève d’un registre juridique courant et convient à l’obligation en cause. La répétition est conservée pour respecter la structure emphatique de l’hébreu.
