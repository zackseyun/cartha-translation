    issue: Explicitation de « mon serment »
    rationale: « Que je t’ai fait prêter » correspond au contexte narratif, mais ajoute au libellé source une causation absente de l’expression מֵאָלָתִי (« de mon serment / de ma malédiction »). Une formulation plus directe préserve mieux la concision et l’ambiguïté du texte.
  - severity: low
    issue: Formulation de l’alternative en note
    rationale: La note actuelle décrit une nuance théologique et juridique possible, mais ne donne pas l’alternative lexicale la plus directe. « De ma malédiction » reflète plus exactement l’autre emploi possible de אָלָה; l’explication peut ensuite signaler le lien avec le serment.
  revised_text: Alors tu seras dégagé de mon serment lorsque tu te rendras auprès de ma famille. Et s’ils ne te la donnent pas, tu seras dégagé de mon serment.[a]
