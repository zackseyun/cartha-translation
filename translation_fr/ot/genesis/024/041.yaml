revisions:
- from: Alors tu seras dégagé du serment que je t’ai fait prêter lorsque tu te rendras auprès de ma famille. Et s’ils ne te la donnent pas, tu seras dégagé du serment que je t’ai fait prêter.[a]
  to: Alors tu seras dégagé de mon serment lorsque tu te rendras auprès de ma famille. Et s’ils ne te la donnent pas, tu seras dégagé de mon serment.[a]
  rationale: La révision rend מֵאָלָתִי par « mon serment », sans ajouter l’idée explicite qu’Abraham l’a fait prêter au serviteur. Elle conserve « dégagé » pour les deux occurrences de נקה, maintient l’objet féminin implicite rendu nécessaire par le français (« la »), et reformule la note afin qu’elle fournisse l’alternative lexicale directe tout en expliquant la nuance de serment sanctionné.
