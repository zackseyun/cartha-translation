  text: וַ/יּוֹצֵ֨א הָ/עֶ֜בֶד כְּלֵי כֶ֨סֶף וּ/כְלֵ֤י זָהָב֙ וּ/בְגָדִ֔ים וַ/יִּתֵּ֖ן לְ/רִבְקָ֑ה וּ/מִ֨גְדָּנֹ֔ת נָתַ֥ן לְ/אָחִ֖י/הָ וּ/לְ/אִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: fr
  text: Puis le serviteur tira des objets d’argent, des objets d’or et des vêtements, et les donna à Rébecca. Il donna aussi des présents de choix à son frère et à sa mère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de précieux cadeaux »; le terme hébreu peut désigner des présents particulièrement précieux et, dans certains contextes, des mets délicats.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: sortit
  rationale: Le hiphil de יצא signifie ici « faire sortir »; en français, « sortit des objets » exprime naturellement le fait de les tirer de ses bagages ou réserves.
- source_word: הָעֶבֶד
  choice: le serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce récit, « serviteur » est naturel et conforme à son rôle de représentant de son maître.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: des objets en argent, des objets en or
  rationale: כְּלִי est un terme large pouvant désigner divers objets, ustensiles ou récipients; « objets » évite de préciser indûment leur nature, et « en argent/or » indique leur matière.
- source_word: וּבְגָדִים
  choice: et des vêtements
  rationale: בְּגָדִים désigne des vêtements; le terme français est courant, digne et précis.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: et les donna à Rébecca
  rationale: Le pronom « les » reprend naturellement en français les objets et les vêtements qui viennent d’être mentionnés.
- source_word: וּמִגְדָּנֹת
  choice: de précieux cadeaux
  rationale: מִגְדָּנוֹת désigne des présents de choix ou précieux; cette formulation convient au contexte matrimonial sans réduire le mot à des mets délicats.
- source_word: נָתַן לְאָחִיהָ וּלְאִמָּהּ
  choice: Il donna aussi ... à son frère et à sa mère
  rationale: « Aussi » rend clairement la valeur additive de la nouvelle distribution; les possessifs renvoient à Rébecca.
