  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: fr
  text: 'et qui me dira : « Bois, toi aussi, et je puiserai aussi de l’eau pour tes chameaux » — c’est elle, la femme que Yahweh a désignée pour le fils de mon maître.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que Yahweh a préparée » ou « choisie » pour le fils de mon maître.'
    reason: Alternative lexicale pour le hiphil de יכח, qui peut exprimer la préparation, la décision ou la désignation.
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: et qui me dira
  rationale: Le parfait qal 3fs s’inscrit dans le signe formulé par le serviteur. En français, le futur après la tournure relative rend naturellement cette situation envisagée tout en conservant la valeur prospective du discours.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: Bois, toi aussi
  rationale: L’impératif est conservé, et « toi aussi » restitue l’insistance de גַּם avec le pronom indépendant אַתָּה.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: et je puiserai aussi de l’eau pour tes chameaux
  rationale: Le verbe שׁאב signifie « puiser »; « de l’eau » est explicité conformément au contexte et à l’usage français. « aussi » rend וְגַם.
- source_word: הִוא הָאִשָּׁה
  choice: que ce soit la femme
  rationale: Dans le cadre de la prière et du signe demandé, cette formulation française exprime la portée volitive de la proposition nominale sans transformer אִשָּׁה en « épouse ».
- source_word: אֲשֶׁר הֹכִיחַ
  choice: que … a destinée
  rationale: Le hiphil de יכח peut ici exprimer le fait de désigner ou de destiner quelqu’un. « Destinée » est naturel dans ce contexte matrimonial et conserve l’idée d’une détermination divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְבֶן אֲדֹנִי
  choice: au fils de mon maître
  rationale: La préposition לְ marque ici la relation ou la destination; la formulation est idiomatique en français et préserve le rapport possessif.
theological_decisions:
- issue: Portée de הִוא הָאִשָּׁה dans la prière
  choice: que ce soit la femme
  alternative: c’est elle, la femme
  rationale: Le contexte immédiat est celui d’un signe demandé à Dieu; la lecture volitive est donc exprimée, tout en signalant en note que l’hébreu peut aussi se lire comme une identification directe.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme comme nom propre. Sa translittération préserve cette donnée du texte source.
translation_notes:
  register: Français international moderne, courant et digne. L’ordre « Bois, toi aussi » garde l’emphase hébraïque sans raideur. La répétition de « aussi » reflète le parallélisme du texte source. Le marqueur [a] figure dans le texte principal.
