base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: fr
  text: '« Voici, je me tiens près de la source d’eau. Que la jeune femme[a] qui sortira pour puiser et à qui je dirai : “S’il te plaît, donne-moi à boire un peu d’eau de ta cruche”, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jeune fille ». Le mot hébreu désigne une jeune femme en âge de se marier, sans signifier explicitement par lui-même « vierge ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה אָנֹכִי נִצָּב
  choice: Me voici debout
  rationale: « Me voici » restitue la présentation vive introduite par הִנֵּה avec le pronom explicite אָנֹכִי, tandis que « debout » rend l’état continu exprimé par le participe נִצָּב.
- source_word: עַל עֵין הַמָּיִם
  choice: près de la source d’eau
  rationale: עֵין désigne ici une source naturelle plutôt qu’un puits. « Près de » exprime naturellement la position indiquée par עַל dans ce contexte.
- source_word: וְהָיָה
  choice: Que
  rationale: Dans cette prière rapportée, la forme introduit le signe souhaité. La tournure optative française en « Que… » en conserve la valeur sans alourdir la phrase.
- source_word: הָעַלְמָה
  choice: la jeune femme
  rationale: עַלְמָה désigne une jeune femme en âge de se marier, sans affirmer lexicalement à lui seul sa virginité. Une note conserve l’autre formulation française possible.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: qui sortira pour puiser
  rationale: Le futur français convient au scénario envisagé, et « puiser » suffit puisque la source d’eau vient d’être mentionnée.
- source_word: וְאָמַרְתִּי אֵלֶיהָ
  choice: et à qui je dirai
  rationale: Cette construction relative est naturelle en français et maintient la relation entre la jeune femme envisagée et la demande qui lui sera adressée.
- source_word: הַשְׁקִינִי נָא מְעַט מַיִם מִכַּדֵּךְ
  choice: S’il te plaît, donne-moi à boire un peu d’eau de ta cruche
  rationale: « Donne-moi à boire » rend la valeur causative de הַשְׁקִינִי; « s’il te plaît » traduit la particule polie נָא. L’ordre retenu reste idiomatique tout en conservant tous les éléments de la demande.
theological_decisions:
- issue: Sens de עַלְמָה
  choice: jeune femme
  alternative: jeune fille; vierge
  rationale: Le nom hébreu indique ici une jeune femme en âge de se marier, mais ne signifie pas explicitement « vierge » par lui-même. Le texte principal évite donc de renforcer indûment le sens, tandis que la note signale une autre formulation française possible.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste volontairement inachevée à la fin du verset, car elle se poursuit au verset suivant. Les guillemets français encadrent le discours rapporté, avec des guillemets anglais doubles pour la demande intérieure.
