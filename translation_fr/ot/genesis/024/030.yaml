base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: fr
  text: 'Quand il vit l’anneau de nez[a] et les bracelets aux poignets de sa sœur, et qu’il entendit les paroles de sa sœur Rébecca, qui disait : « Voici ce que cet homme m’a dit », il alla trouver l’homme. Et voici qu’il se tenait près des chameaux, à la source[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’anneau ». Le mot hébreu peut désigner un anneau en général ; « anneau de nez » est retenu ici parce que Genèse 24.47 précise que le bijou avait été placé au nez de Rébecca.
    reason: lexical_alternative
  - marker: b
    text: Ou « au point d’eau ». Le mot hébreu désigne une source ou un lieu d’où jaillit l’eau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: construction temporelle intégrée
  rationale: Dans cette longue phrase narrative, וַיְהִי introduit les circonstances puis l’action principale. Une reprise littérale par « Il arriva que » alourdirait le français ; la structure « Quand… il… » en conserve naturellement la fonction.
- source_word: הַנֶּזֶם
  choice: l’anneau de nez
  rationale: נֶזֶם peut désigner un anneau de façon générale, mais Genèse 24.47 précise que le bijou a été placé au nez de Rébecca.
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: les bracelets aux poignets de sa sœur
  rationale: יָד signifie littéralement « main », mais le contexte de bracelets appelle en français naturel « poignets », sans modifier la nature des bijoux.
- source_word: דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: sa sœur Rébecca raconter
  rationale: Cette formulation restitue le fait que Laban entend le récit de Rébecca et introduit directement ses paroles, tout en évitant la redondance peu naturelle « les paroles… disant ».
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: Voici ce que cet homme m’a dit
  rationale: כֹּה introduit la teneur des paroles rapportées. « Voici ce que… » est idiomatique et conserve sa valeur démonstrative ; « cet homme » convient au renvoi de Rébecca à l’homme rencontré.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: il alla trouver l’homme
  rationale: בוא avec אֶל exprime ici le déplacement de Laban vers l’homme. « Alla trouver » est clair dans la perspective narrative française.
- source_word: וְהִנֵּה עֹמֵד
  choice: Or celui-ci se tenait
  rationale: הִנֵּה présente vivement la scène constatée à l’arrivée. « Or » assure ici une transition narrative digne et naturelle, tandis que l’imparfait rend l’état en cours exprimé par le participe.
- source_word: עַל הַגְּמַלִּים
  choice: près des chameaux
  rationale: La préposition עַל indique ici la proximité ou la position auprès des animaux, et non une position sur eux.
- source_word: עַל הָעָיִן
  choice: à la source
  rationale: עַיִן désigne ici une source ou un point d’eau ; « source » est le sens précis dans ce contexte.
