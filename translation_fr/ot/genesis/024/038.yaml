  text: אִם לֹ֧א אֶל בֵּית אָבִ֛/י תֵּלֵ֖ךְ וְ/אֶל מִשְׁפַּחְתִּ֑/י וְ/לָקַחְתָּ֥ אִשָּׁ֖ה לִ/בְנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: fr
  text: Mais tu iras dans la maison de mon père et auprès de mon clan[a], et tu prendras une épouse pour mon fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma famille » ou « ma parenté ». Le terme hébreu désigne un groupe familial étendu, et non seulement la famille immédiate.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Mais
  rationale: Dans ce contexte de serment, l’expression introduit une opposition corrective à l’interdiction précédente. « Mais » rend naturellement cette valeur sans transformer la tournure en condition explicite.
- source_word: בֵּית אָבִי
  choice: la maison de mon père
  rationale: La formule conserve l’image hébraïque de la « maison » tout en pouvant évoquer, selon le contexte, la maisonnée paternelle.
- source_word: תֵּלֵךְ
  choice: tu iras
  rationale: Le futur français exprime ici l’instruction ferme donnée au serviteur avec un ton digne et naturel.
- source_word: מִשְׁפַּחְתִּי
  choice: mon clan
  rationale: Le terme désigne un groupe familial étendu, plus large que la famille immédiate; « clan » préserve cette portée.
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: et tu prendras une femme
  rationale: Dans ce contexte matrimonial, אִשָּׁה désigne une épouse à prendre pour le fils; la formulation française conserve la construction de la source sans ambiguïté dans le contexte.
- source_word: לִבְנִי
  choice: pour mon fils
  rationale: La préposition indique ici le bénéficiaire ou le but de la démarche matrimoniale; « pour mon fils » est idiomatique et précis.
