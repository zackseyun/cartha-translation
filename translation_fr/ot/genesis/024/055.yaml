  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: fr
  text: 'Mais son frère et sa mère dirent : « Que la jeune femme reste avec nous quelques jours, ou dix[a] ; après quoi, elle pourra partir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des jours, ou dix ». L’expression signifie probablement « quelques jours, ou dix jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais ... dirent
  rationale: Le verbe hébreu est formellement au singulier devant un sujet composé, tournure courante en hébreu biblique. Le français exige ici le pluriel. « Mais » exprime naturellement le contraste avec la demande pressante du serviteur au verset précédent.
- source_word: אָחִיהָ וְאִמָּהּ
  choice: son frère et sa mère
  rationale: Conserve le singulier « frère », les suffixes féminins renvoyant à Rébecca, ainsi que l’ordre des deux membres en hébreu.
- source_word: תֵּשֵׁב
  choice: Que ... reste
  rationale: Dans ce contexte de départ différé, « rester » rend naturellement le sens de ישב et la nuance volitive de la forme verbale.
- source_word: הַנַּעֲרָ
  choice: la jeune femme
  rationale: Désignation moderne, précise et digne d’une jeune femme, sans l’archaïsme de « jeune fille » au sens ancien ou de « demoiselle ».
- source_word: אִתָּנוּ
  choice: avec nous
  rationale: Rend directement l’idée de présence auprès de la famille.
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: quelques jours, ou dix
  rationale: La formulation hébraïque est littéralement « des jours, ou dix ». « Quelques jours » exprime l’usage idiomatique probable de יָמִים, tandis que « ou dix » préserve la concision et l’ambiguïté relative de la formulation source.
- source_word: אַחַר
  choice: après quoi
  rationale: Marque clairement la succession temporelle en français naturel.
- source_word: תֵּלֵךְ
  choice: elle pourra partir
  rationale: Le contexte impose Rébecca comme sujet féminin. « Pourra partir » rend la permission ou l’assentiment implicite mieux qu’un simple futur catégorique.
