  text: וָ/אֶקֹּ֥ד וָֽ/אֶשְׁתַּחֲוֶ֖ה לַ/יהוָ֑ה וָ/אֲבָרֵ֗ךְ אֶת יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲשֶׁ֤ר הִנְחַ֨/נִי֙ בְּ/דֶ֣רֶךְ אֱמֶ֔ת לָ/קַ֛חַת אֶת בַּת אֲחִ֥י אֲדֹנִ֖/י לִ/בְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: fr
  text: Alors je me suis incliné et j’ai adoré Yahweh, puis j’ai béni Yahweh, le Dieu de mon maître Abraham, qui m’avait conduit sur un chemin de vérité[a] afin de prendre pour son fils la fille du frère de mon maître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur un chemin de vérité ». L’expression peut aussi désigner un chemin sûr ou fiable et souligner la fidélité de la direction donnée par Yahweh.'
    reason: Alternative lexicale destinée à préserver les nuances de vérité, de sûreté et de fidélité portées par אֱמֶת.
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: je me suis incliné
  rationale: Le verbe décrit le geste corporel de se courber; cette formulation reste naturelle sans préciser indûment qu’il s’est agenouillé.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: j’ai adoré Yahweh
  rationale: Le verbe désigne une prosternation révérencieuse et, lorsqu’il a Dieu pour destinataire, se rend naturellement par « adorer »; le geste physique vient déjà d’être exprimé par « je me suis incliné ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: j’ai béni Yahweh
  rationale: Quand Dieu est l’objet de ברך, le verbe signifie le bénir ou proclamer sa louange. « Bénir » conserve le lien lexical et l’expression biblique naturelle en français.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: le Dieu de mon maître Abraham
  rationale: אֲדֹנִי désigne ici Abraham comme supérieur humain du serviteur; « maître » évite de le confondre avec un titre divin.
- source_word: הִנְחַנִי
  choice: m’avait conduit
  rationale: Le hiphil de נחה exprime l’action de guider ou conduire. Le plus-que-parfait convient au regard rétrospectif du serviteur sur la conduite qui l’a mené jusque-là.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: par un chemin de vérité
  rationale: Cette formulation proche de l’hébreu maintient la portée de אֱמֶת, qui peut évoquer à la fois la vérité, la sûreté et la fidélité, sans réduire l’expression à la seule idée de direction correcte.
- source_word: לָקַחַת
  choice: afin de prendre
  rationale: L’infinitif exprime le but. « Prendre » conserve le verbe général du texte sans ajouter explicitement « comme épouse », bien que le contexte matrimonial l’indique.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: la fille du frère de mon maître
  rationale: La formulation reproduit clairement la relation familiale exprimée par la chaîne construite hébraïque.
- source_word: לִבְנוֹ
  choice: pour son fils
  rationale: Le suffixe renvoie naturellement à Abraham, le maître du serviteur, et la formulation reste concise.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
- issue: Portée de בְּדֶרֶךְ אֱמֶת
  choice: par un chemin de vérité
  alternative: par le bon chemin / par un chemin sûr
  rationale: אֱמֶת peut qualifier le chemin comme vrai, sûr ou marqué par la fidélité. Le texte principal conserve cette tension sémantique et la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La succession « je me suis incliné et j’ai adoré » distingue le geste corporel de l’acte religieux. « Puis » allège l’enchaînement sans effacer la progression narrative. La tournure « prendre pour son fils » demeure volontairement proche de l’hébreu et laisse le contexte préciser qu’il s’agit d’un mariage.
