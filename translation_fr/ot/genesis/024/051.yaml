base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: fr
  text: Voici Rébecca devant toi. Prends-la et pars. Qu’elle devienne la femme du fils de ton maître, comme Yahweh l’a dit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Particule déictique attirant l’attention sur la situation immédiate ; « Voici » est naturel et digne en français.
- source_word: רִבְקָה
  choice: Rébecca
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Conserve l’image hébraïque tout en exprimant naturellement la présence et la disponibilité de Rébecca.
- source_word: קַח וָלֵךְ
  choice: Prends-la et pars
  rationale: Les deux impératifs successifs sont maintenus ; le pronom « la », implicite en hébreu, est nécessaire en français.
- source_word: וּתְהִי אִשָּׁה
  choice: Qu’elle devienne la femme
  rationale: Le jussif exprime ici l’assentiment à l’établissement du mariage ; « devienne » rend clairement cette transition sans en faire une prédiction.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: du fils de ton maître
  rationale: La formulation française idiomatique « la femme de » rend la relation matrimoniale, tandis que « maître » correspond au contexte serviteur-maître.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: comme ... l’a dit
  rationale: Exprime la conformité à la parole divine accomplie ; le pronom « l’ » reprend naturellement le contenu de cette parole en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel au lieu de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » en préserve le caractère de nom propre.
- issue: Valeur du jussif וּתְהִי
  choice: Qu’elle devienne la femme
  alternative: Qu’elle soit la femme
  rationale: Le contexte est celui de l’assentiment au mariage ; « devienne » exprime l’entrée dans cette relation, tout en conservant la valeur volitive du jussif.
translation_notes:
  register: Français international moderne, simple et digne. Tutoiement conservé puisque les interlocuteurs s’adressent à un serviteur individuel. La division en trois phrases rend clairement les injonctions successives sans modifier leur enchaînement.
