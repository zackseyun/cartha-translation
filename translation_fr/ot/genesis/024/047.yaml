base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: fr
  text: 'Alors je lui demandai[a] : « De qui es-tu la fille ? » Elle répondit : « Je suis la fille de Betouël, fils de Nahor, que Milka avait mis au monde pour Nahor. » Puis je lui mis l’anneau[b] au nez et les bracelets aux poignets[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je l’interrogeai et je dis ».'
    reason: source_form
  - marker: b
    text: 'Ou : « l’anneau de nez ». Le terme hébreu peut désigner un anneau en général ; la suite précise qu’il est placé au nez.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « sur ses mains » ; dans ce contexte, il s’agit vraisemblablement des poignets.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: Alors je lui demandai
  rationale: La formulation française exprime naturellement l’acte de poser la question, tandis qu’une note conserve la tournure hébraïque plus développée, littéralement « je l’interrogeai et je dis ».
- source_word: בַּת מִי אַתְּ
  choice: De qui es-tu la fille ?
  rationale: Cette formulation française naturelle conserve explicitement le lien filial exprimé par בַּת et l’interrogatif מִי.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: Je suis la fille de Betouel, fils de Nahor
  rationale: La structure généalogique de l’hébreu est maintenue dans une apposition claire en français.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: que Milka avait mis au monde pour lui
  rationale: « Mettre au monde » rend naturellement le verbe ילד. Le pronom « lui » conserve la référence à Nahor sans ajouter une identification absente du texte.
- source_word: הַנֶּזֶם עַל אַפָּהּ
  choice: l’anneau au nez
  rationale: נֶזֶם peut désigner un anneau, et le complément « au nez » précise ici où il est porté sans créer de redondance.
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: les bracelets aux poignets
  rationale: « Aux poignets » est l’expression française idiomatique pour des bracelets; une note signale que l’hébreu dit plus littéralement « sur ses mains ».
