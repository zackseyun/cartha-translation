  text: וַ/יֹּאמְר֖וּ נִקְרָ֣א לַֽ/נַּעֲרָ֑ וְ/נִשְׁאֲלָ֖ה אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/057.yaml
  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: fr
  text: 'Ils dirent : « Appelons la jeune femme et interrogeons-la[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « interrogeons sa bouche », c’est-à-dire entendons directement sa propre réponse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le wayyiqtol poursuit naturellement le récit. En français, le passé simple rend ce mouvement narratif sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: נִקְרָא
  choice: Appelons
  rationale: La forme cohortative exprime une proposition collective. « Appelons » est direct et naturel.
- source_word: לַנַּעֲרָ
  choice: la jeune femme
  rationale: נַעֲרָה désigne ici Rébecca, une jeune femme en âge de se marier. Ce choix évite le sens potentiellement enfantin de « jeune fille » et le registre vieilli de « jeune fille à marier ».
- source_word: וְנִשְׁאֲלָה
  choice: et demandons-lui
  rationale: Le second cohortatif prolonge la proposition. En français, « demander à quelqu’un son avis » exprime clairement l’idée de solliciter sa propre réponse.
- source_word: אֶת־פִּיהָ
  choice: son avis
  rationale: Littéralement « sa bouche », cette expression renvoie à la réponse donnée personnellement par Rébecca. « Son avis » restitue naturellement l’enjeu décisionnel du contexte, tout en signalant le tour littéral en note.
theological_decisions:
- issue: Participation personnelle de Rébecca à la décision
  choice: « demandons-lui son avis » souligne qu’on sollicite directement sa réponse
  alternative: « demandons-lui »
  rationale: Le complément idiomatique אֶת־פִּיהָ ne désigne pas simplement la personne interrogée, mais ce qu’elle dira de sa propre bouche. La traduction conserve cette dimension sans extrapoler sur la portée juridique ou théologique de son consentement.
translation_notes:
  register: Français international moderne, narratif et digne. « Appelons » et « demandons-lui son avis » sont courants sans être familiers. La note préserve l’image hébraïque inhabituelle.
