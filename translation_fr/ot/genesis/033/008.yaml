  text: וַ/יֹּ֕אמֶר מִ֥י לְ/ךָ֛ כָּל הַ/מַּחֲנֶ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַ/יֹּ֕אמֶר לִ/מְצֹא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: fr
  text: 'Ésaü demanda : « Que signifie toute cette troupe que j’ai rencontrée ? » Jacob répondit : « C’est pour trouver grâce aux yeux de mon seigneur. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour trouver grâce aux yeux de mon seigneur ». Jacob s’adresse ici avec déférence à Ésaü.'
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: Que signifie
  rationale: Dans ce contexte, l’expression interroge la raison d’être ou l’intention de la troupe envoyée par Jacob, et non son identité. Cette formulation est naturelle en français tout en gardant la question assez ouverte.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: toute cette troupe
  rationale: מַחֲנֶה peut désigner un camp, mais renvoie ici au groupe organisé — serviteurs et troupeaux — qu’Ésaü a rencontré. « Troupe » conserve le sens collectif sans suggérer seulement un lieu de campement.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: que j’ai rencontrée
  rationale: Rend directement le verbe פּגשׁ et s’accorde naturellement avec « troupe ».
- source_word: לִמְצֹא חֵן
  choice: pour trouver grâce
  rationale: L’infinitif exprime le but. « Trouver grâce » est l’équivalent français traditionnel et encore intelligible de l’idiome hébreu.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Conserve l’image idiomatique de l’hébreu, naturelle en français.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit ici de l’adresse déférente de Jacob à Ésaü, non d’un titre divin. « Mon seigneur » préserve ce rapport social et le ton respectueux.
- source_word: וַיֹּאמֶר … וַיֹּאמֶר
  choice: Ésaü demanda … Jacob répondit
  rationale: Les noms, clairs dans le contexte narratif, remplacent les pronoms ambigus en français; « demanda » et « répondit » rendent naturellement la fonction des deux prises de parole.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La structure hébraïque est légèrement explicitée par les noms des interlocuteurs. L’idiome « trouver grâce aux yeux de » est conservé; la note précise la valeur sociale de « mon seigneur ».
