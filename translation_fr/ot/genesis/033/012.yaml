lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis Ésaü dit
  rationale: Le wayyiqtol fait progresser le récit. Le sujet est explicité d’après le contexte immédiat pour produire un français naturel et lever une ambiguïté pronominale absente en hébreu.
- source_word: נִסְעָה
  choice: Mettons-nous en route
  rationale: Le cohortatif à la première personne du pluriel exprime ici une proposition pressante de départ. Cette tournure est actuelle et convient au contexte de voyage.
- source_word: וְנֵלֵכָה
  choice: et partons
  rationale: Le second cohortatif coordonné renforce la proposition de se mettre en chemin. « Partons » rend naturellement le mouvement sans le réduire à la marche à pied.
- source_word: וְאֵלְכָה
  choice: je marcherai
  rationale: La première personne du singulier exprime l’action qu’Ésaü propose d’accomplir. Le futur français restitue naturellement cette offre dans le contexte.
- source_word: לְנֶגְדֶּךָ
  choice: à tes côtés
  rationale: נגד peut indiquer une position en face, devant ou en correspondance avec quelqu’un. Ici, « à tes côtés » exprime l’offre d’accompagnement sans imposer l’idée qu’Ésaü prendra nécessairement la tête ; l’autre lecture plausible est conservée en note.
