  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: fr
  text: 'Puis Ésaü dit : « Mettons-nous en route et partons ; je marcherai devant toi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à tes côtés ».'
