  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: fr
  text: Accepte, je t’en prie, le présent qui t’a été apporté, car Dieu m’a accordé sa faveur et je ne manque de rien. Jacob insista auprès de lui, et Ésaü accepta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: le présent
  rationale: Littéralement « ma bénédiction », mais dans ce contexte le mot désigne le don offert à Ésaü; « présent » restitue naturellement cette valeur concrète en français sans suggérer que Jacob confère une bénédiction formelle.
- source_word: חַנַּנִי
  choice: m’a accordé sa faveur
  rationale: Le verbe חנן exprime l’action de faire grâce ou d’accorder sa faveur; cette formulation conserve la dimension de grâce divine.
- source_word: יֶשׁ לִי כֹל
  choice: je ne manque de rien
  rationale: Littéralement « j’ai tout »; l’expression idiomatique française rend l’idée que Jacob possède tout ce dont il a besoin, sans revendiquer une possession universelle.
- source_word: וַיִּפְצַר בּוֹ
  choice: Jacob insista auprès de lui
  rationale: פצר indique une insistance pressante. Les noms explicites clarifient les référents pronominaux dans un français naturel.
- source_word: וַיִּקָּח
  choice: Ésaü accepta
  rationale: Le verbe signifie littéralement « il prit »; dans le contexte d’un présent offert avec insistance, « accepta » exprime l’acte visé tout en clarifiant le sujet.
theological_decisions:
- issue: Sens de בִּרְכָתִי dans l’offre de Jacob
  choice: le présent
  alternative: ma bénédiction
  rationale: Le sens lexical « bénédiction » reste sous-jacent, mais le référent immédiat est le troupeau offert (33.8-10). « Présent » évite d’imposer ici une lecture doctrinale ou une allusion explicite au droit de bénédiction, que le verset ne développe pas.
- issue: Portée de « j’ai tout »
  choice: je ne manque de rien
  alternative: j’ai tout
  rationale: Cette traduction préserve l’affirmation de suffisance due à la faveur divine sans lui donner une portée absolue étrangère à l’usage idiomatique.
translation_notes:
  register: Français international moderne, digne et fluide. « Je t’en prie » conserve la particule de politesse נָא. Les noms Jacob et Ésaü remplacent les pronoms ambigus de la dernière proposition pour assurer une compréhension immédiate.
