  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: fr
  text: Ésaü courut à sa rencontre, le serra dans ses bras, se jeta à son cou, l’embrassa[a] et ils pleurèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le texte massorétique, le mot traduit par « l’embrassa » porte des points inhabituels au-dessus de ses lettres. Certains y voient l’indication d’un doute ou d’une insistance, mais le sens direct de l’hébreu est bien « l’embrassa ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: courut
  rationale: Le verbe רוץ désigne directement l’action de courir et exprime ici la rapidité du mouvement.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: לִקְרָאתוֹ
  choice: à sa rencontre
  rationale: Cette tournure rend naturellement l’idée de sortir ou d’aller vers quelqu’un pour le rencontrer.
- source_word: וַיְחַבְּקֵהוּ
  choice: le serra dans ses bras
  rationale: Rend חבק dans un français actuel, naturel et digne, tout en exprimant clairement le geste d’affection.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: se jeta à son cou
  rationale: Expression française idiomatique qui conserve l’image vive de l’hébreu et sa forte charge émotionnelle.
- source_word: וַיִּשָּׁקֵהוּ
  choice: l’embrassa
  rationale: Le verbe נשק signifie ici « embrasser » au sens de donner un baiser. La formulation demeure distincte du geste précédent.
- source_word: וַיִּבְכּוּ
  choice: ils pleurèrent
  rationale: Le verbe est au pluriel et indique que les deux hommes pleurent; « pleurèrent » convient au registre narratif.
theological_decisions:
- issue: Interprétation des gestes d’Ésaü envers Jacob
  choice: Présenter sans réserve ajoutée la succession de gestes affectueux et réconciliateurs.
  alternative: Donner au baiser une nuance suspecte ou ironique en s’appuyant sur des traditions interprétatives ultérieures.
  rationale: Le sens direct de la narration hébraïque décrit une rencontre affectueuse. La ponctuation extraordinaire du texte massorétique mérite une note, mais ne justifie pas de modifier le sens explicite du verbe dans le corps du texte.
translation_notes:
  register: Français international moderne, narratif et digne. « Se jeta à son cou » conserve l’image hébraïque sous une forme française idiomatique; « le serra dans ses bras » évite la répétition avec « l’embrassa ».
