  terminology: « Sichem », « Canaan » et « Paddân-Aram » sont cohérents avec l’usage biblique français. « Sain et sauf » est une bonne solution pour la lecture adverbiale de שָׁלֵם, sans exclure en note la lecture toponymique « Salem ».
