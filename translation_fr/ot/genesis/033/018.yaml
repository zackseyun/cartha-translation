  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: fr
  text: Jacob arriva sain et sauf à la ville de Sichem[a], dans le pays de Canaan, en venant de Paddân-Aram, et il campa devant la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Jacob arriva à Salem, ville de Sichem. » Le mot hébreu שָׁלֵם (shalem) peut signifier « sain et sauf, en paix » ou être lu comme le nom de lieu « Salem ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Le wayyiqtol de בוא décrit l’arrivée de Jacob; « arriva » convient naturellement au récit français.
- source_word: שָׁלֵם
  choice: sain et sauf
  rationale: Pris comme adjectif à valeur adverbiale, le terme indique que Jacob est arrivé indemne, en sécurité. Cette formulation française rend clairement ce sens tout en laissant l’autre analyse en note.
- source_word: עִיר שְׁכֶם
  choice: la ville de Sichem
  rationale: La chaîne construite désigne naturellement la ville appelée Sichem; « Sichem » est la forme française traditionnelle et intelligible du nom.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: dans le pays de Canaan
  rationale: Le groupe situe géographiquement Sichem. En français, l’apposition sans pronom relatif est plus fluide et conserve toute l’information.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: alors qu’il venait de Paddân-Aram
  rationale: La préposition ב avec l’infinitif construit exprime ici la circonstance temporelle. Cette tournure évite une répétition lourde de « arriver » sans ajouter l’idée non explicite d’un retour.
- source_word: פַּדַּן אֲרָם
  choice: Paddân-Aram
  rationale: Translittération française claire du nom de lieu, avec accent circonflexe pour signaler la voyelle longue.
- source_word: וַיִּחַן
  choice: il campa
  rationale: Le qal de חנה signifie établir son camp; « campa » est direct, courant et adapté à la narration.
- source_word: אֶת־פְּנֵי הָעִיר
  choice: en face de la ville
  rationale: L’expression idiomatique désigne l’espace situé devant la ville; « en face de » en rend naturellement la valeur spatiale.
theological_decisions:
- issue: Interprétation de שָׁלֵם
  choice: Le comprendre comme indiquant que Jacob arriva « sain et sauf »
  alternative: Le lire comme le nom de lieu « Salem »
  rationale: La lecture adverbiale s’accorde bien avec la syntaxe et le contexte du voyage, mais l’hébreu permet aussi une analyse comme toponyme; cette ambiguïté textuelle est donc conservée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase privilégie des formulations courantes (« arriva », « campa », « en face de ») sans affaiblir la précision géographique ni supprimer l’ambiguïté de שָׁלֵם.
