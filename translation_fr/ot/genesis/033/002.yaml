  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: fr
  text: Il plaça les servantes[a] et leurs enfants en premier, Léa et ses enfants derrière eux, et Rachel et Joseph en dernier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « femmes esclaves » ; le terme hébreu peut désigner des servantes du foyer de statut inférieur et, dans certains contextes, recouvrir la notion de femmes esclaves.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Il plaça
  rationale: Le verbe שׂוּם signifie couramment « mettre, placer, disposer ». « Plaça » convient naturellement à l’organisation spatiale des groupes.
- source_word: הַשְּׁפָחוֹת
  choice: les servantes
  rationale: שִׁפְחָה désigne une femme au service d’un foyer, possiblement de condition servile. « Servantes » reste clair et digne sans préciser excessivement le statut juridique.
- source_word: יַלְדֵיהֶן
  choice: leurs enfants
  rationale: Le terme יֶלֶד a ici un sens général et ne se limite pas aux fils.
- source_word: רִאשֹׁנָה
  choice: devant
  rationale: La forme adverbiale indique la première position dans cette disposition. « Devant » exprime clairement l’ordre spatial dans le contexte de la rencontre.
- source_word: לֵאָה
  choice: Léa
  rationale: Forme française usuelle du nom propre.
- source_word: וִילָדֶיהָ
  choice: et ses enfants
  rationale: La coordination hébraïque est conservée, et « enfants » rend le sens général du nom.
- source_word: אַחֲרֹנִים
  choice: derrière eux
  rationale: Pour le groupe intermédiaire, le mot indique une position postérieure au premier groupe, sans signifier qu’il est absolument le dernier.
- source_word: רָחֵל
  choice: Rachel
  rationale: Forme française usuelle du nom propre.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française usuelle du nom propre.
- source_word: אַחֲרֹנִים
  choice: en dernier
  rationale: Dans le troisième membre de la série, le terme désigne naturellement la dernière position.
