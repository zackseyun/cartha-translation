base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: fr
  text: 'Il leva les yeux, vit les femmes et les enfants, et demanda : « Qui sont ces gens qui t’accompagnent[a] ? » Jacob répondit : « Ce sont les enfants que Dieu a accordés dans sa grâce à ton serviteur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qui sont ceux-ci pour toi ? » L’expression peut demander leur identité ou leur lien avec Jacob.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « les enfants que Dieu a donnés à ton serviteur ». Le verbe hébreu comporte toutefois l’idée de faveur ou de grâce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת־עֵינָיו
  choice: Il leva les yeux
  rationale: Cette expression hébraïque signifie qu’il porte ou relève son regard. La formulation française conserve l’image narrative tout en restant naturelle.
- source_word: הַנָּשִׁים
  choice: les femmes
  rationale: Le terme hébreu désigne ici les femmes sans préciser lexicalement leur relation avec Jacob; « femmes » évite donc d’ajouter « épouses » au texte.
- source_word: הַיְלָדִים
  choice: les enfants
  rationale: « Enfants » rend naturellement le terme dans ce contexte familial et convient à ses deux emplois dans le verset.
- source_word: מִי אֵלֶּה לָּךְ
  choice: Qui sont tous ceux qui sont avec toi ?
  rationale: La construction signifie littéralement « Qui sont ceux-là pour toi ? ». En contexte, elle demande l’identité ou le lien avec Jacob des personnes qui l’accompagnent. « Tous ceux » reprend naturellement en français le groupe visible de femmes et d’enfants sans modifier le sens de la question.
- source_word: חָנַן
  choice: dans sa grâce, a accordés
  rationale: Le verbe exprime une faveur gracieusement consentie, et non un simple don. Cette formulation préserve cette nuance sans lui imposer un développement doctrinal.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Il s’agit ici d’une manière déférente pour Jacob de parler de lui-même devant Ésaü; « serviteur » rend mieux cette politesse sociale que « esclave ».
theological_decisions:
- issue: La faveur divine exprimée par חָנַן
  choice: Les enfants sont présentés comme accordés par Dieu dans sa grâce.
  alternative: « Les enfants que Dieu a donnés à ton serviteur. »
  rationale: Le verbe חָנַן comporte l’idée de faveur ou de grâce. La traduction la conserve sans ajouter de contenu théologique étranger au verset.
- issue: Identification explicite du second locuteur
  choice: « Jacob répondit »
  alternative: « Il répondit »
  rationale: Le texte hébreu emploie simplement une forme verbale signifiant « il dit », dont le sujet se déduit du dialogue. Nommer Jacob évite une ambiguïté artificielle en français et ne tranche aucune ambiguïté réelle du récit.
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue demeure direct et accessible. « Dans sa grâce » conserve la nuance du verbe hébreu sans employer une tournure archaïque; « ton serviteur » maintient la déférence de Jacob envers Ésaü.
