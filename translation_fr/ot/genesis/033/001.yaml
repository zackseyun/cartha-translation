base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: fr
  text: 'Jacob leva les yeux et vit : voici qu’Ésaü arrivait, accompagné de quatre cents hommes. Alors il répartit les enfants entre Léa, Rachel et les deux servantes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב עֵינָיו וַיַּרְא
  choice: Jacob leva les yeux et regarda
  rationale: La formulation conserve l’image idiomatique hébraïque tout en restant naturelle dans un récit français actuel. « Regarda » rend l’action qui introduit ce qui apparaît à sa vue.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: « Voici que » restitue la fonction présentative et vive de הִנֵּה sans recourir à l’archaïsme « voici, voici » ou au plus solennel « et voici ».
- source_word: עֵשָׂו בָּא
  choice: Ésaü arrivait
  rationale: 'L’imparfait traduit la valeur progressive du participe : Ésaü est aperçu en train d’approcher.'
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: accompagné de quatre cents hommes
  rationale: Cette tournure française naturelle exprime clairement qu’Ésaü vient avec un groupe nombreux.
- source_word: וַיַּחַץ אֶת הַיְלָדִים עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: il répartit les enfants entre Léa, Rachel et les deux servantes
  rationale: « Répartit… entre » rend ici la distribution des enfants en groupes associés aux différentes femmes. « Servantes » traduit שְׁפָחוֹת de façon claire sans préciser davantage que ne le fait le contexte immédiat le statut social ou juridique.
