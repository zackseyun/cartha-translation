  text: וַ/יִּ֜קֶן אֶת חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה שָׁם֙ אָהֳל֔/וֹ מִ/יַּ֥ד בְּנֵֽי חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּ/מֵאָ֖ה קְשִׂיטָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: fr
  text: Il acheta aux fils de Hamor, père de Sichem, la parcelle du champ où il avait dressé sa tente, pour cent qesitas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : qesita, unité ou objet de paiement ancien dont la valeur exacte est inconnue ; le terme est traditionnellement rendu de diverses manières, notamment par « pièces de monnaie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: Il acheta
  rationale: Dans le contexte d’une transaction foncière suivie de l’indication du prix, קנה signifie naturellement « acheter ».
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: la parcelle de champ
  rationale: חֶלְקָה désigne une portion délimitée ou une parcelle; cette formulation reste précise sans ajouter de détail absent de l’hébreu.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: où il avait dressé sa tente
  rationale: נטה avec אֹהֶל est l’expression usuelle pour dresser une tente; le plus-que-parfait marque naturellement l’antériorité par rapport à l’achat.
- source_word: מִיַּד
  choice: aux
  rationale: Littéralement « de la main de », l’expression indique ici les vendeurs ou détenteurs; « acheter à quelqu’un » est l’équivalent idiomatique naturel en français.
- source_word: בְּנֵי חֲמוֹר
  choice: les fils de Hamor
  rationale: Rendu direct de la chaîne construite hébraïque, sans préciser davantage leur statut collectif.
- source_word: אֲבִי שְׁכֶם
  choice: père de Sichem
  rationale: L’apposition identifie Hamor comme le père de Sichem, conformément au contexte narratif.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: pour cent qesitas
  rationale: קְשִׂיטָה désigne une unité ou un objet de paiement ancien dont la valeur exacte est inconnue; la translittération évite une précision trompeuse.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe place les vendeurs près du verbe pour éviter la tournure peu idiomatique « de la main de », tout en conservant toutes les données du texte. Le terme rare « qesitas » est explicité en note.
