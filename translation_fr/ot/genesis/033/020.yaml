  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: fr
  text: Là, il érigea un autel et l’appela El-Elohé-Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres lectures possibles : « Là, il érigea un autel et invoqua : “Dieu, le Dieu d’Israël” », ou « et proclama à son sujet : “Dieu, le Dieu d’Israël.” » L’hébreu peut désigner soit le nom donné à l’autel, soit une invocation ou une proclamation concernant Dieu.'
    reason: alternative_reading
  - marker: b
    text: El-Elohé-Israël signifie « Dieu, le Dieu d’Israël » ou « El, Dieu d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: érigea
  rationale: Le hifil de נצב signifie ici « dresser, ériger ». « Érigea » convient naturellement à l’établissement d’un autel et garde la force concrète du verbe.
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe indique directement le lieu mentionné dans le contexte. « Là » est bref et idiomatique.
- source_word: מִזְבֵּחַ
  choice: un autel
  rationale: « Autel » est l’équivalent français habituel de מִזְבֵּחַ.
- source_word: וַיִּקְרָא לוֹ
  choice: l’appela
  rationale: La construction קרא + ל peut exprimer l’attribution d’un nom. Après l’érection d’un autel, cette lecture est naturelle, sans toutefois exclure une invocation ou une proclamation, signalée en note.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: El-Elohé-Israël
  rationale: Puisque la lecture principale comprend la formule comme le nom donné à l’autel, sa translittération préserve sa fonction onomastique. La note en donne le sens et maintient la possibilité d’une formule déclarative.
theological_decisions:
- issue: La formule finale est-elle le nom de l’autel, ou une invocation/déclaration concernant Dieu ?
  choice: Elle est présentée dans le texte principal comme le nom donné par Jacob à l’autel.
  alternative: 'Jacob invoqua Dieu en disant : « Dieu, le Dieu d’Israël », ou proclama sur l’autel : « Dieu est le Dieu d’Israël. »'
  rationale: La succession « érigea un autel » puis « l’appela » favorise une formule de dénomination, comparable à d’autres récits de nomination dans la Genèse. Toutefois, la syntaxe hébraïque concise permet aussi une invocation ou une proclamation ; la note conserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Érigea » conserve la précision du geste sans archaïsme excessif. La translittération « El-Elohé-Israël » marque clairement un nom propre, tandis que les notes en explicitent le sens et l’ambiguïté syntaxique.
