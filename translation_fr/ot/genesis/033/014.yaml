base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: fr
  text: Que mon seigneur veuille passer devant son serviteur. Quant à moi, j’avancerai doucement[a], au rythme du bétail[b] qui est devant moi et au rythme des enfants, jusqu’à ce que j’arrive auprès de mon seigneur, à Séir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « je conduirai lentement » ou « je progresserai avec précaution » ; le verbe hébreu peut décrire une marche prudente aussi bien que la conduite du groupe.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « bétail » signifie souvent « travail », « biens » ou « possessions » ; dans ce contexte, il désigne vraisemblablement les animaux que Jacob fait avancer.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « jusqu’à ce que je vienne vers mon seigneur, à Séir » ; la forme hébraïque de « Séir » exprime la destination. On peut aussi traduire : « jusqu’à ce que j’arrive à Séir auprès de mon seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: Que ... veuille passer
  rationale: Le jussif accompagné de נָא exprime ici une demande polie. Cette tournure française conserve la déférence de Jacob sans donner l’impression d’un ordre.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Jacob s’adresse à Ésaü avec déférence. « Mon seigneur » maintient ce rapport social et fait écho à « son serviteur », sans désigner ici Dieu.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: devant son serviteur
  rationale: La formulation conserve à la fois le sens spatial de לִפְנֵי et l’auto-désignation respectueuse de Jacob à la troisième personne.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: j’avancerai doucement
  rationale: La forme du verbe נהל peut évoquer le fait de progresser avec précaution ou de conduire le groupe. « J’avancerai doucement » rend naturellement l’allure mesurée sans préciser plus que l’hébreu qui conduit qui.
- source_word: לְרֶגֶל
  choice: au rythme de
  rationale: L’expression signifie littéralement « selon le pied de » et indique que Jacob réglera sa marche sur l’allure des animaux et des enfants.
- source_word: הַמְּלָאכָה
  choice: le bétail
  rationale: Bien que le nom désigne souvent le travail, les biens ou ce qui relève d’une activité, le contexte pastoral renvoie vraisemblablement ici aux animaux placés devant Jacob.
- source_word: הַיְלָדִים
  choice: les enfants
  rationale: Le terme désigne les enfants de Jacob qui voyagent avec le groupe. « Les enfants » est exact, courant et moins interprétatif que « les petits ».
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: jusqu’à ce que j’arrive auprès de mon seigneur, à Séir
  rationale: La traduction respecte le mouvement vers Ésaü et la valeur directionnelle de שֵׂעִירָה, tout en produisant une phrase française naturelle.
