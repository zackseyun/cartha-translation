base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: fr
  text: 'Mais il lui répondit : « Mon seigneur sait que les enfants sont fragiles et que les bêtes allaitantes du petit et du gros bétail sont à ma charge[a]. Si on les pousse trop durement pendant un seul jour, tout le petit bétail mourra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « le petit et le gros bétail, avec leurs petits, est à ma charge ». L’expression hébraïque est idiomatique : elle évoque des bêtes allaitantes et la responsabilité qui repose sur Jacob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Mon seigneur
  rationale: Dans cette adresse à Ésaü, le terme est un titre humain déférent. « Mon seigneur » conserve la politesse et la hiérarchie sociale sans en faire un titre divin.
- source_word: הַיְלָדִים רַכִּים
  choice: les enfants sont fragiles
  rationale: רַכִּים exprime ici la délicatesse et la vulnérabilité des enfants pendant le voyage. « Fragiles » est naturel et ne suppose pas qu’ils soient malades.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: les brebis et les vaches
  rationale: Dans le contexte des bêtes qui allaitent, ces termes collectifs désignent concrètement les femelles du petit et du gros bétail. Cette formulation est plus naturelle en français que « le petit et le gros bétail allaitants ».
- source_word: עָלוֹת עָלָי
  choice: qui allaitent sont à ma charge
  rationale: La formule hébraïque associe vraisemblablement l’état des femelles qui allaitent à la responsabilité qui pèse sur Jacob. La traduction communique ces deux éléments tout en signalant l’incertitude idiomatique dans une note.
- source_word: וּדְפָקוּם
  choice: Si on les pousse trop durement
  rationale: Le verbe décrit une conduite excessive ou brutale des animaux. Le sujet indéfini est rendu naturellement par « on », et « trop durement » exprime l’excès impliqué.
- source_word: יוֹם אֶחָד
  choice: ne serait-ce qu’un seul jour
  rationale: Cette formulation idiomatique souligne qu’une seule journée à ce rythme suffirait à entraîner la catastrophe.
- source_word: וָמֵתוּ כָּל הַצֹּאן
  choice: tout le petit bétail mourra
  rationale: צֹאן est un collectif désignant le petit bétail, notamment ovins et caprins. « Tout le petit bétail » garde cette valeur collective sans réduire explicitement le groupe aux seuls moutons.
