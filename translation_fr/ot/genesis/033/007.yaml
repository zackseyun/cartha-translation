  naturalness: « Léa et ses enfants s’approchèrent aussi » et « Puis Joseph et Rachel s’approchèrent » sont naturels, clairs et d’un registre narratif moderne et digne. « S’inclinèrent » rend sobrement l’acte d’obéissance.
