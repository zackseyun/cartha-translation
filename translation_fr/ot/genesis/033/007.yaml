  text: וַ/תִּגַּ֧שׁ גַּם לֵאָ֛ה וִ/ילָדֶ֖י/הָ וַ/יִּֽשְׁתַּחֲו֑וּ וְ/אַחַ֗ר נִגַּ֥שׁ יוֹסֵ֛ף וְ/רָחֵ֖ל וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: fr
  text: Léa et ses enfants s’approchèrent aussi[a], et ils s’inclinèrent[b]. Puis Joseph et Rachel s’approchèrent, et ils s’inclinèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’avancèrent ». Le même verbe hébreu est employé dans les deux propositions.
    reason: lexical_alternative
  - marker: b
    text: Ou « se prosternèrent » ; le verbe hébreu peut désigner un geste de profonde déférence.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: s’approcha
  rationale: 'Le verbe נגשׁ exprime le fait de s’avancer ou de venir près de quelqu’un. « S’approcha » est naturel en français et conserve le mouvement vers Ésaü. Le singulier est maintenu dans chaque proposition : Léa, puis Joseph, sont les sujets grammaticaux du verbe.'
- source_word: גַּם
  choice: aussi
  rationale: גַּם ajoute Léa et ses enfants aux groupes qui se présentent successivement devant Ésaü.
- source_word: וִילָדֶיהָ
  choice: ainsi que ses enfants
  rationale: יְלָדִים désigne ici les enfants de Léa sans limiter explicitement le groupe aux garçons. « Ainsi que » rend leur association avec Léa tout en préservant le verbe hébreu au singulier.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: ils s’inclinèrent
  rationale: Le verbe שׁחה décrit un geste de profond respect. « S’inclinèrent » est idiomatique et digne, sans imposer avec certitude une posture corporelle entièrement étendue au sol.
- source_word: וְאַחַר
  choice: Ensuite
  rationale: L’expression marque l’étape suivante dans l’ordre de présentation des groupes.
- source_word: יוֹסֵף וְרָחֵל
  choice: Joseph s’approcha avec Rachel
  rationale: Cette formulation conserve l’ordre hébreu, qui nomme Joseph avant Rachel, ainsi que le singulier du verbe נִגַּשׁ, dont Joseph est le sujet grammatical principal.
theological_decisions:
- issue: Nature exacte du geste exprimé par שׁחה
  choice: ils s’inclinèrent
  alternative: ils se prosternèrent
  rationale: Le contexte indique un hommage respectueux devant Ésaü, mais le verbe ne permet pas toujours de déterminer avec précision l’amplitude du geste. Le texte principal conserve cette latitude, tandis que la note signale la traduction plus forte.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite les tours archaïques. Elle conserve l’ordre Joseph–Rachel et les verbes d’approche au singulier, particularités grammaticales du texte hébreu.
