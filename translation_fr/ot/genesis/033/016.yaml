  text: Ésaü retourna ce jour-là sur son chemin vers Séïr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: reprit le chemin
  rationale: Le verbe שׁוב indique qu’Ésaü repart ou revient. Associé à לְדַרְכּוֹ, « reprit le chemin » rend naturellement en français l’idée qu’il se remet en route.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle française naturelle et fidèle au sens littéral « en ce jour-là ».
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: לְדַרְכּוֹ
  choice: le chemin
  rationale: Dans la tournure « reprit le chemin », le nom דֶּרֶךְ désigne l’itinéraire ou la route suivie; le possessif hébreu est rendu implicitement par l’expression idiomatique française.
- source_word: שֵׂעִירָה
  choice: de Séïr
  rationale: Le hé directionnel indique un mouvement vers Séïr. Après « reprendre le chemin », le français idiomatique emploie « le chemin de Séïr », où « de » désigne la destination.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation concise conserve l’indication temporelle et le mouvement vers Séïr sans lourdeur littérale.
