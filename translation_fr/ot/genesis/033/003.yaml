source:
  edition: WLC
  text: וְ/ה֖וּא עָבַ֣ר לִ/פְנֵי/הֶ֑ם וַ/יִּשְׁתַּ֤חוּ אַ֨רְצָ/ה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד גִּשְׁתּ֖/וֹ עַד אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: fr
  text: Lui-même passa devant eux et se prosterna jusqu’à terre sept fois[a], jusqu’à ce qu’il se soit approché de son frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’inclina jusqu’à terre » ; le verbe hébreu peut désigner une prosternation complète en signe d’hommage.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Lui-même
  rationale: Le pronom indépendant met Jacob en relief; « Lui-même » conserve cette insistance sans alourdir la phrase.
- source_word: עָבַר לִפְנֵיהֶם
  choice: passa devant eux
  rationale: Dans le contexte, Jacob prend les devants par rapport à sa famille. Cette formulation naturelle conserve à la fois le mouvement et sa position en tête.
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: se prosterna jusqu’à terre
  rationale: Le verbe désigne ici un geste marqué d’abaissement ou d’hommage, tandis que la forme directionnelle אַרְצָה indique le mouvement vers le sol. La traduction décrit le geste sans en faire nécessairement un acte de culte.
- source_word: שֶׁבַע פְּעָמִים
  choice: sept fois
  rationale: Rendu direct de l’expression numérique hébraïque.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: jusqu’à ce qu’il se soit approché de son frère
  rationale: L’infinitif construit avec suffixe marque le terme de la série de prosternations. La répétition de עַד appartient à la construction hébraïque et n’exige pas une répétition artificielle de « jusqu’à » en français.
theological_decisions:
- issue: Nature du geste exprimé par וַיִּשְׁתַּחוּ
  choice: se prosterna
  alternative: adora / rendit hommage
  rationale: Le contexte décrit l’attitude de Jacob devant Ésaü, mais le verbe peut désigner la prosternation physique, l’hommage ou l’adoration selon le contexte. « Se prosterna » préserve le geste concret sans imposer une interprétation cultuelle ni réduire le geste à sa seule portée sociale.
translation_notes:
  register: Français international moderne, naturel et digne. « Lui-même » garde l’emphase hébraïque; « se prosterna jusqu’à terre » restitue clairement le geste sans surinterprétation théologique.
