  source_fidelity: Le pronom emphatique « Lui-même » rend היטוא de façon adéquate. « passa devant eux » correspond à עָבַר לִפְנֵיהֶם et convient au contexte où Jacob se place en tête. « se prosterna jusqu’à terre » restitue le geste exprimé par וַיִּשְׁתַּחוּ אַרְצָה sans lui attribuer un sens cultuel. Le nombre et la borne temporelle (« sept fois », « jusqu’à ce qu’il se soit approché de son frère ») sont fidèlement rendus.
