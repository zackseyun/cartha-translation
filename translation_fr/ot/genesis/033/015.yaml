  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו אַצִּֽיגָה נָּ֣א עִמְּ/ךָ֔ מִן הָ/עָ֖ם אֲשֶׁ֣ר אִתִּ֑/י וַ/יֹּ֨אמֶר֙ לָ֣/מָּה זֶּ֔ה אֶמְצָא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: fr
  text: 'Ésaü dit alors : « Permets-moi, je te prie, de laisser avec toi quelques-uns des hommes qui m’accompagnent. » Jacob répondit : « Pourquoi cela ? Que je trouve grâce aux yeux de mon seigneur ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: Permets-moi, je te prie, de laisser
  rationale: Le cohortatif accompagné de נָא exprime ici une proposition courtoise; cette formulation française en conserve la déférence sans lourdeur.
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: quelques-uns des hommes qui m’accompagnent
  rationale: מִן est partitif, et הָעָם désigne dans ce contexte les hommes de la troupe d’Ésaü plutôt qu’un peuple au sens national.
- source_word: לָמָּה זֶּה
  choice: Pourquoi cela ?
  rationale: Rend littéralement et naturellement la question elliptique de Jacob, sans préciser davantage le motif implicite.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: Que je trouve grâce aux yeux de mon seigneur !
  rationale: Conserve l’expression idiomatique hébraïque et le titre déférent employé par Jacob à l’égard d’Ésaü.
theological_decisions:
- issue: Valeur de la réponse finale de Jacob
  choice: 'Conserver la formulation volitive et ambiguë : « Que je trouve grâce… »'
  alternative: « Il me suffit de trouver grâce… » ou « Puisque j’ai trouvé grâce… »
  rationale: L’hébreu אֶמְצָא est formellement un imparfait à valeur contextuelle discutée. La traduction retenue évite d’expliciter une relation logique que le texte ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le nom « Jacob » est explicité dans l’incise afin d’éviter l’ambiguïté naturelle de deux « il » successifs; aucun élément interprétatif supplémentaire n’est ajouté au discours.
