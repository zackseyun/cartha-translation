  text: וַ/תִּגַּ֧שְׁןָ הַ/שְּׁפָח֛וֹת הֵ֥נָּה וְ/יַלְדֵי/הֶ֖ן וַ/תִּֽשְׁתַּחֲוֶֽיןָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/006.yaml
  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: fr
  text: Alors les servantes et leurs enfants s’approchèrent et se prosternèrent[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « femmes esclaves » : le terme hébreu désigne des femmes de condition servile.'
    reason: lexical_alternative
  - marker: b
    text: Ou « s’inclinèrent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: s’approchèrent
  rationale: Le wayyiqtol féminin pluriel de נגשׁ exprime l’action narrative successive et un mouvement vers Ésaü. « S’approchèrent » est naturel et précis en français moderne.
- source_word: הַשְּׁפָחוֹת
  choice: les servantes
  rationale: שִׁפְחָה désigne des femmes de condition servile. « Servantes » conserve ici la référence féminine sans archaïsme; « femmes esclaves » rendrait plus explicitement leur statut social.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: et leurs enfants
  rationale: Le pronom indépendant הֵנָּה reprend avec emphase les servantes dans une construction appositionnelle, littéralement « les servantes, elles et leurs enfants ». La coordination française transmet naturellement que les deux groupes accomplissent ensemble les actions.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: se prosternèrent
  rationale: La forme de חוה/שׁחה décrit un geste corporel d’hommage. « Se prosternèrent » en exprime clairement l’ampleur, tandis que « s’inclinèrent » demeure une traduction possible, moins explicite.
