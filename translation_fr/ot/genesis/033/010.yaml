  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: fr
  text: 'Jacob dit : « Non, je t’en prie ! Si j’ai trouvé grâce à tes yeux, accepte de ma main ce présent. Car voir ton visage, c’est comme voir le visage de Dieu[a], et tu m’as accueilli favorablement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, éventuellement, « le visage d’un dieu ». Dans le contexte, « Dieu » correspond mieux à l’épisode récent de Peniel (Genèse 32.31).
    reason: alternative_reading
  - marker: b
    text: Ou « tu m’as accepté » ou « tu as été bien disposé envers moi ». Le verbe hébreu exprime un accueil favorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן
  choice: grâce
  rationale: Dans l’expression française consacrée « trouver grâce aux yeux de quelqu’un », « grâce » exprime naturellement l’accueil favorable sans imposer ici un sens doctrinal technique.
- source_word: בְּעֵינֶיךָ
  choice: à tes yeux
  rationale: Cette formulation française naturelle conserve l’image concrète de l’hébreu.
- source_word: מִנְחָתִי
  choice: mon présent
  rationale: Dans ce contexte, il s’agit du don conciliatoire offert par Jacob à Ésaü. « Présent » évite la connotation cultuelle que pourrait avoir « offrande ».
- source_word: מִיָּדִי
  choice: de ma main
  rationale: La formulation conserve l’expression concrète de l’hébreu et souligne la remise personnelle du présent.
- source_word: כִּי עַל כֵּן
  choice: Car
  rationale: La locution introduit ici le motif de la demande de Jacob. « Car » en restitue clairement la fonction sans reproduire une tournure hébraïque pesante.
- source_word: רָאִיתִי פָנֶיךָ כִּרְאֹת
  choice: j’ai vu ton visage comme on voit
  rationale: Cette formulation suit de près la syntaxe et l’aspect accompli de l’hébreu tout en restant naturelle en français.
- source_word: פְּנֵי אֱלֹהִים
  choice: le visage de Dieu
  rationale: Le contexte narratif, notamment l’épisode de Peniel, favorise la référence au Dieu unique, tout en maintenant la comparaison saisissante de Jacob.
- source_word: וַתִּרְצֵנִי
  choice: tu m’as accueilli favorablement
  rationale: Le verbe exprime l’agrément et l’acceptation bienveillante. Cette traduction garde la dimension relationnelle de l’accueil d’Ésaü.
- source_word: אַל נָא אִם נָא
  choice: Non, je t’en prie ! Si
  rationale: La formule rend le refus insistant mais courtois de Jacob, puis introduit son appel conditionnel dans un français actuel.
theological_decisions:
- issue: Référence de אֱלֹהִים dans la comparaison
  choice: Dieu
  alternative: un dieu
  rationale: Bien que אֱלֹהִים puisse avoir une portée plus large dans certains contextes, le récit de Jacob et l’écho immédiat de Peniel favorisent nettement « Dieu ». Une note conserve néanmoins l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit la relation directe entre les deux frères. « Trouver grâce à tes yeux » conserve une expression biblique encore intelligible, tandis que la syntaxe générale reste fluide.
