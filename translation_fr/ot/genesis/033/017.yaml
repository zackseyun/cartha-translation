base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: fr
  text: Jacob partit pour Soukkoth[a]. Il s’y construisit une maison et fit des abris pour ses troupeaux. C’est pourquoi il donna à ce lieu le nom de Soukkoth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Soukkoth évoque le mot hébreu qui signifie « abris » ou « abris temporaires ».
    reason: Le récit établit un jeu étymologique entre le nom du lieu et les abris construits pour les troupeaux.
lexical_decisions:
- source_word: נָסַע
  choice: partit
  rationale: Le verbe décrit le fait de lever le camp et de se mettre en route. « Partit pour » rend naturellement le mouvement vers la destination dans ce récit.
- source_word: סֻכֹּתָה
  choice: pour Soukkoth
  rationale: Le hé directionnel indique un mouvement vers ce lieu. Le nom propre est translittéré sous la forme française « Soukkoth ».
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: Il s’y construisit une maison
  rationale: Cette formulation rend le bénéficiaire exprimé par לוֹ et ajoute « y » pour situer naturellement la construction au lieu atteint, sans modifier le sens.
- source_word: מִקְנֵהוּ
  choice: ses troupeaux
  rationale: Le terme désigne ici les animaux possédés par Jacob. « Troupeaux » est idiomatique en français et convient à l’ensemble de son bétail.
- source_word: עָשָׂה סֻכֹּת
  choice: fit des abris
  rationale: Le nom pluriel désigne des constructions protectrices temporaires. « Abris » convient particulièrement aux animaux et maintient le lien sémantique expliqué en note avec le nom Soukkoth.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette tournure française actuelle exprime clairement le rapport causal introduisant l’explication du nom du lieu.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: il donna à ce lieu le nom de
  rationale: Cette expression française naturelle restitue l’acte de nommer contenu dans l’idiome hébreu « appeler le nom du lieu ».
- source_word: סֻכּוֹת
  choice: Soukkoth
  rationale: Le nom du lieu est translittéré plutôt que traduit. Son rapport avec le nom commun hébreu rendu par « abris » est signalé en note.
