  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: fr
  text: 'Mais Ésaü dit : « J’ai beaucoup[a], mon frère ; que ce qui est à toi soit à toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « assez ».'
    reason: Variante lexicale contextuellement possible pour רָב, sans préciser un objet absent du texte hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais ... dit
  rationale: Le waw consécutif fait avancer le récit. Dans ce contexte, « Mais » exprime naturellement le léger contraste introduit par le refus courtois d’Ésaü.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: יֶשׁ לִי רָב
  choice: J’ai beaucoup de biens
  rationale: L’expression idiomatique signifie littéralement qu’Ésaü a « beaucoup ». L’ajout de « biens », implicite dans le contexte du présent offert, donne en français une phrase naturelle tout en conservant l’idée d’abondance plutôt que la seule suffisance.
- source_word: אָחִי
  choice: mon frère
  rationale: Le vocatif avec suffixe de première personne conserve la chaleur relationnelle de l’adresse d’Ésaü à Jacob.
- source_word: יְהִי לְךָ אֲשֶׁר לָךְ
  choice: Garde ce qui est à toi
  rationale: Le jussif de היה a ici une valeur permissive et revient, dans le contexte, à inviter Jacob à conserver ses possessions. Cette formulation française naturelle rend le sens sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Beaucoup de biens » évite le tour peu naturel « j’ai beaucoup » et situe l’abondance dans le contexte matériel. La ponctuation en deux phrases rend clairement le refus courtois.
