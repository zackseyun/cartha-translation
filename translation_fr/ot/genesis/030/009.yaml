source:
  edition: WLC
  text: וַ/תֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִ/לֶּ֑דֶת וַ/תִּקַּח֙ אֶת זִלְפָּ֣ה שִׁפְחָתָ֔/הּ וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/יַעֲקֹ֖ב לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: fr
  text: Lorsque Léa vit qu’elle avait cessé d’avoir des enfants[a], elle prit Zilpa, sa servante[b], et la donna pour femme à Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avait arrêté d’enfanter »; littéralement en hébreu « s’était arrêtée d’enfanter ».
    reason: lexical_alternative
  - marker: b
    text: Ou « son esclave ». Le terme hébreu peut désigner une servante de condition servile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Lorsque Léa vit
  rationale: Le waw consécutif fait avancer le récit; « lorsque » exprime naturellement le lien temporel avec l’action principale.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Léa constate, plutôt qu’une proposition causale.
- source_word: עָמְדָה מִלֶּדֶת
  choice: avait cessé d’avoir des enfants
  rationale: La construction עמד + מן + infinitif signifie cesser de faire quelque chose. Cette formulation française rend clairement le contexte de procréation sans reproduire littéralement l’idiome hébreu.
- source_word: שִׁפְחָתָהּ
  choice: sa servante
  rationale: שִׁפְחָה désigne une femme placée au service d’une maîtresse et peut aussi impliquer une condition servile. « Servante » est actuel et naturel, tandis qu’une note conserve l’autre nuance possible.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: La formule נתן ל... לאשה est une expression matrimoniale; « donner pour femme » en préserve le sens formel sans introduire la catégorie non exprimée de concubine.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Forme française usuelle du nom propre biblique.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: Rendu naturel du complément introduit par ל dans cette construction.
theological_decisions:
- issue: Statut de Zilpa dans la maisonnée et portée du langage matrimonial
  choice: Conserver à la fois « sa servante » et « pour femme ».
  alternative: Employer « esclave » ou « concubine ».
  rationale: Le texte présente explicitement Zilpa comme la שִׁפְחָה de Léa, puis utilise la formule matrimoniale לְאִשָּׁה. La traduction ne doit ni effacer sa condition subordonnée ni remplacer le terme matrimonial du verset par une catégorie différente.
translation_notes:
  register: Français international moderne, fluide et digne. « Lorsque » assure la continuité narrative; « avoir des enfants » est idiomatique, tandis que la note donne une formulation plus proche de l’hébreu. Les deux marqueurs de note figurent dans le texte principal.
