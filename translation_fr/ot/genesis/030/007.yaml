  text: וַ/תַּ֣הַר ע֔וֹד וַ/תֵּ֕לֶד בִּלְהָ֖ה שִׁפְחַ֣ת רָחֵ֑ל בֵּ֥ן שֵׁנִ֖י לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: fr
  text: Bilha, l’esclave de Rachel, devint de nouveau enceinte et donna à Jacob un second fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Le verbe הרה exprime ici le fait de concevoir ou de devenir enceinte. « Devint enceinte » est naturel en français moderne et convient à la narration.
- source_word: עוֹד
  choice: de nouveau
  rationale: Dans ce récit de naissances, עוֹד indique la répétition de la grossesse.
- source_word: וַתֵּלֶד
  choice: donna … un fils
  rationale: Le verbe ילד signifie « enfanter, donner naissance ». La tournure « donna à Jacob un deuxième fils » rend naturellement en français la construction avec לְיַעֲקֹב.
- source_word: שִׁפְחַת
  choice: la servante
  rationale: שִׁפְחָה désigne une femme de condition servile. « Servante » est clair et digne en français courant, tout en permettant de préciser son statut dans une note si nécessaire.
- source_word: בֵּן שֵׁנִי
  choice: un deuxième fils
  rationale: Cette expression signifie littéralement « un second/deuxième fils »; « un deuxième fils » est idiomatique et conserve l'ordre de naissance.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: La préposition לְ marque ici la relation au père; « donna à Jacob » reproduit naturellement cette nuance sans la réduire à une simple indication biologique.
- source_word: בִּלְהָה ... רָחֵל
  choice: Bilha, la servante de Rachel
  rationale: La mise en apposition conserve l'identification de Bilha par sa relation sociale à Rachel et reste fluide en français.
