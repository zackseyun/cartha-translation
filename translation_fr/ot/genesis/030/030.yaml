base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: fr
  text: Car le peu que tu avais avant que je ne vienne s’est considérablement accru, et Yahweh t’a béni à mon arrivée[a]. Et maintenant, quand vais-je, moi aussi, subvenir aux besoins de ma maisonnée[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à mon pied » ; l’expression peut signifier « à mon arrivée » ou « à cause de moi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « faire quelque chose, moi aussi, pour ma maisonnée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ
  choice: le peu que tu avais
  rationale: Exprime naturellement la faible quantité de biens que Laban possédait.
- source_word: לְפָנַי
  choice: avant moi
  rationale: Conserve la formulation concise de l’hébreu; dans le contexte, elle signifie avant l’arrivée ou le service de Jacob.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: s’est accru jusqu’à devenir une abondance
  rationale: Rend à la fois l’idée d’une croissance vigoureuse portée par פרץ et le résultat abondant exprimé par לָרֹב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: לְרַגְלִי
  choice: à mon arrivée
  rationale: Rend en français l’emploi idiomatique de l’expression littérale « à mon pied », qui peut associer l’arrivée de Jacob à la bénédiction reçue par Laban.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: quand vais-je, moi aussi, pourvoir aux besoins de ma propre maison ?
  rationale: Exprime idiomatiquement l’action en faveur de sa maisonnée tout en maintenant l’insistance de גַם אָנֹכִי sur Jacob lui-même.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa transcription évite de le confondre avec un titre.
- issue: Portée de לְרַגְלִי dans le rapport entre Jacob et la bénédiction
  choice: à mon arrivée
  alternative: à cause de moi
  rationale: La formulation retenue préserve le lien temporel explicite avec l’arrivée de Jacob sans imposer exclusivement une causalité, même si celle-ci demeure possible.
translation_notes:
  register: Français international moderne, naturel et digne. « Maison » garde le sens de maisonnée; « pourvoir aux besoins » explicite avec mesure l’idée économique suggérée par le contexte.
