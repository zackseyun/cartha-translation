  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: fr
  text: 'Alors Laban lui dit : « Si j’ai trouvé grâce à tes yeux, reste[a], je t’en prie. J’ai appris par divination[b] que Yahweh m’a béni à cause de toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « reste » n’est pas exprimé en hébreu, où la demande demeure inachevée ; il est suppléé d’après le contexte.
    reason: supplied_text
  - marker: b
    text: Ou « J’ai reconnu par les présages ». Le verbe hébreu désigne la divination ou l’interprétation de présages ; certains proposent toutefois « J’ai appris par expérience ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Si j’ai trouvé grâce à tes yeux, reste, je t’en prie
  rationale: « Trouver grâce aux yeux de quelqu’un » conserve l’image et l’idiome hébreux dans un français naturel. La particule נָא exprime ici la supplication et est rendue par « je t’en prie ». « Reste » est suppléé d’après le contexte, car la demande demeure elliptique en hébreu.
- source_word: נִחַשְׁתִּי
  choice: J’ai appris par divination
  rationale: Au piel, נחשׁ désigne normalement la divination ou l’interprétation de présages. Cette formulation exprime à la fois le moyen employé et la conclusion à laquelle Laban est parvenu, sans atténuer le sens en simple expérience.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin plutôt que remplacé par un titre.
- source_word: וַיְבָרֲכֵנִי
  choice: m’a béni
  rationale: Le passé composé exprime naturellement en français l’action passée dont Laban constate le résultat présent.
- source_word: בִּגְלָלֶךָ
  choice: à cause de toi
  rationale: Cette expression rend directement la valeur causale de la locution hébraïque.
- source_word: לָבָן
  choice: Laban
  rationale: Translittération française traditionnelle du nom propre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Divination pratiquée par Laban
  choice: J’ai appris par divination
  alternative: J’ai appris par expérience
  rationale: Le sens lexical fort de נִחַשְׁתִּי est conservé. Le texte attribue cette affirmation à Laban sans approuver ni expliquer théologiquement sa pratique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à la relation directe entre Laban et Jacob. La tournure biblique courante « trouver grâce à tes yeux » conserve l’image hébraïque sans devenir obscure.
