  yaml_path: translation/ot/genesis/030/011.yaml
  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: fr
  text: 'Léa dit[a] : « Quelle chance ! » Et elle l’appela Gad.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu בגד est difficile. Il peut se comprendre comme une exclamation signifiant « Quelle chance ! » ; selon une interprétation traditionnelle, on peut aussi traduire : « Une troupe ! » Le nom Gad fait écho au mot hébreu employé dans ce jeu de mots.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol de אמר poursuit la séquence narrative ; en français, le passé simple exprime naturellement cette progression sans devoir ajouter systématiquement « et ».
- source_word: לֵאָה
  choice: Léa
  rationale: Forme française usuelle du nom personnel.
- source_word: בגד
  choice: Quelle chance !
  rationale: La forme hébraïque est difficile, mais elle est probablement une exclamation liée à גד, « chance, bonne fortune », et prépare le jeu sonore avec le nom Gad. Cette formulation est idiomatique en français tout en gardant la valeur exclamative.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: Et elle l’appela
  rationale: Dans ce contexte d’attribution d’un nom, « elle l’appela » rend naturellement la formule hébraïque « elle appela son nom », tout en conservant la progression narrative.
- source_word: גָּד
  choice: Gad
  rationale: Translittération française traditionnelle du nom ; elle préserve autant que possible le jeu sonore avec le terme hébreu relatif à la chance.
