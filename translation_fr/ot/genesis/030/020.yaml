  text: וַ/תֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨/נִי אֱלֹהִ֥ים אֹתִ/י֮ זֵ֣בֶד טוֹב֒ הַ/פַּ֨עַם֙ יִזְבְּלֵ֣/נִי אִישִׁ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שִׁשָּׁ֣ה בָנִ֑ים וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ זְבֻלֽוּן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: fr
  text: 'Léa dit : « Dieu m’a fait un beau don. Cette fois, mon mari m’honorera[a], car je lui ai donné six fils. » Elle l’appela donc Zabulon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « habitera avec moi ». Le verbe hébreu est rare et forme un jeu de mots avec le nom Zabulon ; son sens pourrait associer l’idée d’honneur à celle d’habiter ou de rester avec Léa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: m’a fait un beau don
  rationale: Rend naturellement l’idée d’un don accordé par Dieu et maintient en français la répétition lexicale de la racine זבד autant que possible, sans imposer le sens plus précis de « dot ».
- source_word: הַפַּעַם
  choice: Cette fois
  rationale: Expression française idiomatique qui correspond au contexte des déclarations de Léa après chaque naissance.
- source_word: יִזְבְּלֵנִי
  choice: m’honorera
  rationale: Le verbe rare peut exprimer l’honneur ou la considération que Léa espère recevoir de son mari. L’autre compréhension possible, « habitera avec moi », est conservée en note en raison de l’incertitude lexicale et du jeu de mots avec Zabulon.
- source_word: אִישִׁי
  choice: mon mari
  rationale: Équivalent clair et naturel dans ce contexte conjugal.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: je lui ai donné six fils
  rationale: Formulation française naturelle qui conserve le complément לוֹ et le motif du don dans la phrase, bien que le verbe hébreu signifie littéralement « enfanter ».
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: Elle l’appela donc Zabulon
  rationale: Rend de manière idiomatique la formule hébraïque d’attribution du nom; « donc » explicite sobrement le lien avec la parole précédente.
- source_word: זְבֻלוּן
  choice: Zabulon
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
theological_decisions:
- issue: Sens du verbe rare יִזְבְּלֵנִי
  choice: m’honorera
  alternative: habitera avec moi
  rationale: Le contexte appuie l’espoir d’une meilleure considération de la part de Jacob, mais la possibilité d’une habitation ou d’un attachement demeure réelle; la note préserve cette ambiguïté sans trancher au-delà des données.
translation_notes:
  register: Français international moderne, simple et digne. La formulation évite « dot », trop spécifique, et conserve par une note l’ambiguïté du verbe rare ainsi que le jeu de mots lié au nom de Zabulon.
