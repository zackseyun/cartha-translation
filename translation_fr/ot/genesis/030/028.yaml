  text: וַ/יֹּאמַ֑ר נָקְבָ֧/ה שְׂכָרְ/ךָ֛ עָלַ֖/י וְ/אֶתֵּֽנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/028.yaml
  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: fr
  text: 'Il dit alors : « Fixe-moi[a] ton salaire, et je te le donnerai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Indique-moi le salaire que tu veux. »'
    reason: Alternative lexicale pour נקב et formulation possible de l’idiome עָלַי.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Il dit alors
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: נָקְבָה
  choice: Fixe
  rationale: Dans ce contexte, le verbe נקב signifie désigner ou préciser explicitement. « Fixe » convient naturellement à la détermination d’un salaire.
- source_word: שְׂכָרְךָ
  choice: ton salaire
  rationale: שָׂכָר désigne ici la rémunération d’un travail. Le singulier « salaire » correspond à la forme hébraïque et à l’usage français.
- source_word: עָלַי
  choice: -moi
  rationale: Littéralement « sur moi », l’expression indique ici que le salaire doit être fixé à la charge du locuteur. Le pronom de « fixe-moi » restitue cet idiome sans lourdeur.
- source_word: וְאֶתֵּנָה
  choice: et je te le donnerai
  rationale: Le verbe נתן signifie « donner ». Les pronoms « te » et « le », nécessaires en français, rendent explicites le bénéficiaire et le salaire déjà mentionnés sans remplacer le verbe par « payer ».
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve le langage concret de « donner » plutôt que de paraphraser par « payer ».
