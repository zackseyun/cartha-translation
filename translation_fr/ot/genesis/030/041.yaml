  text: וְ/הָיָ֗ה בְּ/כָל יַחֵם֮ הַ/צֹּ֣אן הַ/מְקֻשָּׁרוֹת֒ וְ/שָׂ֨ם יַעֲקֹ֧ב אֶת הַ/מַּקְל֛וֹת לְ/עֵינֵ֥י הַ/צֹּ֖אן בָּ/רֳהָטִ֑ים לְ/יַחְמֵ֖/נָּה בַּ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: fr
  text: Chaque fois que les bêtes les plus vigoureuses[a] du troupeau étaient en chaleur, Jacob plaçait les baguettes sous leurs yeux, dans les abreuvoirs[b], afin qu’elles s’accouplent en présence des baguettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bêtes robustes » ou « les bêtes fortes » ; le terme hébreu désigne ici les animaux les plus résistants, par opposition aux faibles du verset suivant.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les auges » ou « dans les rigoles » ; le terme hébreu désigne les installations où les animaux venaient boire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל
  choice: Chaque fois que
  rationale: La construction introduit une circonstance habituelle et répétée dans le récit ; « Chaque fois que » en rend naturellement la valeur itérative.
- source_word: יַחֵם
  choice: étaient en chaleur
  rationale: Le verbe désigne ici l’état reproductif des animaux. « Étaient en chaleur » est précis et idiomatique en français.
- source_word: הַצֹּאן
  choice: le troupeau
  rationale: Le nom collectif peut englober les ovins et les caprins ; « troupeau » évite de préciser indûment l’espèce.
- source_word: הַמְקֻשָּׁרוֹת
  choice: les bêtes les plus vigoureuses
  rationale: Dans le contexte, le terme s’oppose aux bêtes faibles du verset suivant et désigne les animaux robustes. L’ajout de « bêtes » clarifie le référent collectif en français.
- source_word: וְשָׂם
  choice: Jacob plaçait
  rationale: L’imparfait exprime l’action coutumière et répétée dans ce contexte.
- source_word: הַמַּקְלוֹת
  choice: les baguettes
  rationale: Il s’agit des morceaux de bois préparés par Jacob dans le contexte précédent. « Baguettes » est naturel et maintient le lien avec ce matériel.
- source_word: לְעֵינֵי הַצֹּאן
  choice: sous leurs yeux
  rationale: Cette expression conserve l’accent visuel de l’hébreu tout en étant idiomatique en français.
- source_word: בָּרֳהָטִים
  choice: dans les abreuvoirs
  rationale: Le terme désigne les auges ou canaux où les animaux venaient boire ; « abreuvoirs » exprime clairement leur fonction.
- source_word: לְיַחְמֶנָּה
  choice: afin qu’elles s’accouplent
  rationale: Le לְ exprime le but, et le féminin pluriel renvoie collectivement aux bêtes du troupeau. Cette formulation rend l’intention de Jacob sans affirmer que les baguettes produisaient elles-mêmes l’effet.
- source_word: בַּמַּקְלוֹת
  choice: devant les baguettes
  rationale: Dans ce contexte, la préposition décrit la circonstance de l’accouplement avec les baguettes disposées sous les yeux des animaux. « Devant » rend cette relation plus naturellement que le littéral « parmi ».
theological_decisions: []
