revisions:
- from: Chaque fois que les bêtes les plus vigoureuses[a] du troupeau étaient en chaleur, Jacob plaçait les baguettes sous leurs yeux, dans les abreuvoirs[b], afin qu’elles s’accouplent devant les baguettes.
  to: Chaque fois que les bêtes les plus vigoureuses[a] du troupeau étaient en chaleur, Jacob plaçait les baguettes sous leurs yeux, dans les abreuvoirs[b], afin qu’elles s’accouplent en présence des baguettes.
  rationale: 'La révision se limite à la dernière expression : « en présence des baguettes » rend de façon naturelle la relation circonstancielle exprimée par בַּמַּקְלוֹת, sans surdéterminer sa nuance spatiale ni modifier le sens du passage. Les ancres et le contenu des notes sont conservés.'
