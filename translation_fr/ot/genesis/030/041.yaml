    issue: Rendre בַּמַּקְלוֹת par « devant les baguettes »
    rationale: La préposition ב décrit plus prudemment la circonstance ou le cadre de l’accouplement en rapport avec les baguettes. « Devant » peut imposer une relation spatiale spécifique et répète l’idée déjà rendue par לְעֵינֵי (« sous leurs yeux »). « En présence des baguettes » conserve l’ambiguïté pertinente dans un français naturel.
