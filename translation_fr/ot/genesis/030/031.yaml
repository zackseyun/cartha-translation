  to: 'Il demanda : « Que te donnerai-je ? » Jacob répondit : « Tu ne me donneras rien. Si tu fais cela pour moi, je recommencerai[a] à faire paître ton troupeau et à le garder. »'
  rationale: La révision remplace la paraphrase prospective « ce que je vais te proposer » par « cela », qui rend plus directement le démonstratif hébreu tout en restant naturel en français. Le reste du texte et la note conservent fidèlement le sens et l’ambiguïté lexicale du verset.
