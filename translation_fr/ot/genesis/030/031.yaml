  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: fr
  text: 'Il demanda : « Que te donnerai-je ? » Jacob répondit : « Tu ne me donneras rien. Si tu fais cela pour moi, je recommencerai[a] à faire paître ton troupeau et à le garder. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je retournerai faire paître ton troupeau et le garder ». Le verbe hébreu peut évoquer soit un retour, soit la reprise du travail.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: Que te donnerai-je ?
  rationale: Cette question rend directement l’offre de rémunération exprimée par מָה avec la première personne de נתן, dans un français naturel et digne.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: Tu ne me donneras rien.
  rationale: La négation avec מְאוּמָה exprime un refus direct de recevoir quoi que ce soit; le futur français conserve la forme de l’hébreu sans l’alourdir.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Si tu fais pour moi ce que je vais te proposer
  rationale: Littéralement « si tu fais pour moi cette chose ». Le contexte montre que Jacob va préciser l’arrangement; cette formulation française rend naturellement la référence anticipée sans ajouter le contenu de la proposition.
- source_word: אָשׁוּבָה
  choice: je recommencerai
  rationale: שׁוב peut indiquer ici soit un retour, soit la reprise du travail. « Je recommencerai » exprime naturellement la reprise du service, tandis que la note conserve l’autre lecture possible.
- source_word: אֶרְעֶה צֹאנְךָ
  choice: à faire paître ton troupeau
  rationale: רעה désigne l’action de mener et de nourrir le petit bétail; « faire paître » garde l’image pastorale concrète, et « troupeau » rend le collectif צֹאן.
- source_word: אֶשְׁמֹר
  choice: et à le garder
  rationale: שׁמר complète l’action de faire paître par l’idée de surveillance et de protection. « Garder » convient naturellement au soin d’un troupeau.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et narratif. Les pronoms familiers au singulier (« te », « tu », « ton ») correspondent au dialogue entre deux individus. La formulation reste digne sans archaïsmes; l’ambiguïté de אָשׁוּבָה est signalée en note.
