  text: וַ/יֵּ֨לֶךְ רְאוּבֵ֜ן בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּמְצָ֤א דֽוּדָאִים֙ בַּ/שָּׂדֶ֔ה וַ/יָּבֵ֣א אֹתָ֔/ם אֶל לֵאָ֖ה אִמּ֑/וֹ וַ/תֹּ֤אמֶר רָחֵל֙ אֶל לֵאָ֔ה תְּנִי נָ֣א לִ֔/י מִ/דּוּדָאֵ֖י בְּנֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: fr
  text: 'À l’époque de la moisson du blé, Ruben alla dans le champ et y trouva des mandragores[a]. Il les apporta à Léa, sa mère. Rachel dit alors à Léa : « Donne-moi, s’il te plaît, quelques-unes des mandragores de ton fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « pommes d’amour ». Le mot hébreu דּוּדָאִים désigne une plante traditionnellement identifiée à la mandragore et associée, dans la suite du récit, à la fécondité.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: À l’époque de la moisson du blé
  rationale: La tournure situe le récit pendant la période de la récolte du blé. Cette formulation rend naturellement l’expression temporelle hébraïque sans l’alourdir.
- source_word: וַיֵּלֶךְ
  choice: alla
  rationale: Le verbe הלך fait progresser le récit et signifie simplement que Ruben alla dans le champ; le texte n’exige pas l’ajout de « sortit ».
- source_word: דּוּדָאִים
  choice: mandragores
  rationale: « Mandragores » est l’identification traditionnelle et la plus largement reconnue, même si l’identification botanique exacte reste discutée.
- source_word: בַּשָּׂדֶה
  choice: dans le champ
  rationale: שָׂדֶה désigne ici un champ ou la campagne. « Dans le champ » reste proche de la forme du texte hébreu et convient au cadre agricole.
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: Il les apporta à Léa, sa mère
  rationale: Le hiphil de בוא signifie « apporter », et le pronom pluriel renvoie aux mandragores. La reprise du sujet par « il » produit une narration française claire.
- source_word: תְּנִי נָא לִי
  choice: Donne-moi, s’il te plaît
  rationale: L’impératif est conservé, tandis que נָא est rendu par la formule de demande polie « s’il te plaît ».
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: quelques-unes des mandragores de ton fils
  rationale: La préposition מִן a ici un sens partitif; « quelques-unes des » l’exprime naturellement en français. « De ton fils » conserve le rapport possessif du texte.
