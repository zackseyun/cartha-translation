source:
  edition: WLC
  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: fr
  text: Ce jour-là, il retira les boucs rayés[a] et tachetés, ainsi que toutes les chèvres mouchetées et tachetées — toutes celles qui avaient du blanc sur elles —, et tous les agneaux de couleur sombre[b]. Il les confia à ses fils[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « annelés »; le terme hébreu évoque des marques en bandes sur les animaux.
    reason: lexical_alternative
  - marker: b
    text: Ou « bruns »; le terme hébreu désigne une coloration brune ou foncée. On peut aussi traduire « parmi les moutons » plutôt que « les agneaux ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il les donna dans la main de ses fils », expression hébraïque signifiant qu’il les plaça sous leur autorité ou leur garde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: il retira
  rationale: Le hifil de סור exprime ici le fait d’écarter ces animaux du troupeau; « retira » est naturel et conserve l’action de séparation.
- source_word: הַתְּיָשִׁים
  choice: les boucs
  rationale: תיש désigne précisément un bouc; ce terme courant préserve la distinction de sexe avec les chèvres mentionnées ensuite.
- source_word: הָעֲקֻדִּים
  choice: rayés
  rationale: Le mot désigne des marques en bandes; « rayés » est clair en français moderne, sans préciser excessivement leur forme.
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: tachetés / tachetées
  rationale: Le terme évoque une robe marquée de taches ou de plaques; la même traduction maintient la répétition hébraïque.
- source_word: הַנְּקֻדּוֹת
  choice: mouchetées
  rationale: Le mot désigne de petites marques ponctuelles; « mouchetées » le distingue de טלאות, rendu par « tachetées ».
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: toutes celles qui avaient du blanc sur elles
  rationale: Cette formulation rend la valeur distributive de כֹּל et la présence de blanc sur la robe des animaux.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: et tous les agneaux de couleur sombre
  rationale: חוּם indique une teinte brune ou foncée, tandis que כְּשָׂבִים peut désigner de jeunes ovins; la formulation reste lisible tout en signalant l’alternative lexicale en note.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: Il les confia à ses fils
  rationale: L’expression idiomatique « donner dans la main de » signifie placer sous l’autorité ou la garde de quelqu’un; « confia » en transmet naturellement le sens.
