  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: fr
  text: Jacob sépara les agneaux[a]. Il plaça le troupeau face aux bêtes rayées[b] et à toutes celles de couleur sombre[c] dans le troupeau de Laban[d]. Il plaça à part des troupeaux pour lui-même et ne les plaça pas avec le troupeau de Laban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les jeunes moutons ».
    reason: lexical_alternative
  - marker: b
    text: Ou « marquées de bandes ».
    reason: lexical_alternative
  - marker: c
    text: Ou « brunes ».
    reason: lexical_alternative
  - marker: d
    text: Ou « provenant du troupeau de Laban ». La préposition hébraïque peut être comprise comme indiquant soit la présence dans le troupeau, soit la provenance.
    reason: source_ambiguity
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: les agneaux
  rationale: Le terme désigne ici de jeunes ovins; « agneaux » conserve cette précision mieux que le terme général « moutons ».
- source_word: הִפְרִיד
  choice: sépara
  rationale: Le hiphil de פרד exprime directement l’action de séparer ou de mettre à part.
- source_word: פְּנֵי הַצֹּאן
  choice: le troupeau face à
  rationale: La tournure hébraïque signifie littéralement « la face du troupeau » et décrit son orientation; cette formulation française en garde l’image concrète sans être artificielle.
- source_word: עָקֹד
  choice: les bêtes rayées
  rationale: Le mot qualifie des animaux portant des bandes ou des rayures; « rayées » est clair et actuel.
- source_word: כָל חוּם
  choice: toutes celles de couleur sombre
  rationale: חוּם peut désigner une couleur brune ou plus largement foncée; « de couleur sombre » évite une précision chromatique incertaine.
- source_word: בְּצֹאן לָבָן
  choice: dans le troupeau de Laban
  rationale: Le sens locatif ordinaire de בְּ est retenu dans le texte; l’interprétation indiquant la provenance demeure possible et est signalée en note.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: Il se constitua des troupeaux à part, pour lui-même
  rationale: La formulation rend à la fois l’établissement des troupeaux, leur séparation et l’intérêt propre de Jacob, sans identifier à tort לוֹ et לְבַדּוֹ.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: et ne les mêla pas au troupeau de Laban
  rationale: Dans ce contexte de gestion des troupeaux, עַל exprime leur association; « ne les mêla pas » transmet naturellement l’idée qu’ils restèrent séparés.
