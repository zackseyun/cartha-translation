    issue: « Il se constitua des troupeaux à part » rend le verbe וַיָּשֶׁת de manière trop active et constitutive.
    rationale: שׁית signifie d’abord « placer, mettre, établir ». « Il plaça à part » conserve l’action de disposition et fait mieux écho au même verbe dans la proposition finale.
  - severity: low
    issue: « ne les mêla pas » interprète le verbe שָׁתָם comme un mélange effectif.
    rationale: Le texte dit littéralement qu’il ne les plaça pas « sur/avec » le troupeau de Laban. « Ne les plaça pas avec » est aussi naturel en français et plus proche de la formulation hébraïque.
