  to: Jacob sépara les agneaux[a]. Il plaça le troupeau face aux bêtes rayées[b] et à toutes celles de couleur sombre[c] dans le troupeau de Laban[d]. Il plaça à part des troupeaux pour lui-même et ne les plaça pas avec le troupeau de Laban.
