  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: fr
  text: Cet homme devint extrêmement prospère et en vint à posséder de nombreux troupeaux, des femmes et des hommes esclaves, des chameaux et des ânes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les termes hébreux peuvent aussi être rendus par « servantes et serviteurs » ou, plus généralement, « domestiques ». Dans ce contexte, leur présence dans l’énumération des biens de Jacob fait ressortir leur condition servile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹץ
  choice: devint extrêmement prospère
  rationale: Le verbe פרץ évoque littéralement une expansion qui fait irruption; dans ce contexte, il décrit l’accroissement spectaculaire de la richesse de Jacob. Cette formulation française en exprime naturellement le résultat.
- source_word: הָאִישׁ
  choice: Cet homme
  rationale: Le nom commun désigne Jacob dans le contexte. Le démonstratif assure une reprise naturelle en français sans remplacer le terme source par le nom propre.
- source_word: מְאֹד מְאֹד
  choice: extrêmement
  rationale: Le redoublement de מְאֹד marque une forte intensité, rendue de façon concise et naturelle.
- source_word: וַיְהִי לוֹ
  choice: en vint à posséder
  rationale: La construction indique une possession acquise au terme du développement raconté, plutôt qu’un simple état statique.
- source_word: צֹאן רַבּוֹת
  choice: de nombreux troupeaux
  rationale: צֹאן désigne collectivement le petit bétail, surtout les moutons et les chèvres; רַבּוֹת souligne l’abondance.
- source_word: שְׁפָחוֹת וַעֲבָדִים
  choice: des esclaves femmes et hommes
  rationale: Les deux termes désignent respectivement des femmes et des hommes en condition servile. La formulation conserve la distinction de sexe et la réalité sociale sans la tempérer par « domestiques ».
- source_word: גְמַלִּים
  choice: des chameaux
  rationale: Équivalent français courant du terme animalier.
- source_word: חֲמֹרִים
  choice: des ânes
  rationale: Équivalent français moderne et usuel.
theological_decisions:
- issue: Rendre les termes désignant les personnes de condition servile par « esclaves » ou par « serviteurs »
  choice: esclaves femmes et hommes
  alternative: servantes et serviteurs; domestiques femmes et hommes
  rationale: L’association de שְׁפָחוֹת et עֲבָדִים aux biens acquis par Jacob rend ici la condition servile saillante. « Esclaves » préserve cette réalité sociale, tandis que « serviteurs » pourrait l’atténuer. La note signale néanmoins l’étendue lexicale possible.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde l’effet cumulatif de l’énumération hébraïque tout en évitant une coordination excessivement lourde. « Cet homme » reprend Jacob de façon idiomatique; « en vint à posséder » marque l’aboutissement narratif.
