  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶל לֵאָ֑ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד לְ/יַעֲקֹ֖ב בֵּ֥ן חֲמִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: fr
  text: Dieu écouta Léa[a]. Elle devint enceinte et donna à Jacob un cinquième fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu entendit Léa. »'
    reason: Alternative lexicale plus formelle pour שׁמע, qui laisse davantage implicite la nuance de réponse favorable.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: écouta
  rationale: Avec אֶל, le verbe שׁמע exprime ici une écoute attentive et favorable, au-delà de la simple perception auditive.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce récit, le terme désigne le Dieu unique.
- source_word: אֶל לֵאָה
  choice: Léa
  rationale: En français, le complément du verbe « écouter » se construit directement, sans préposition.
- source_word: וַתַּהַר
  choice: elle devint enceinte
  rationale: Formulation naturelle et actuelle qui exprime clairement la conception sans alourdir le récit.
- source_word: וַתֵּלֶד לְיַעֲקֹב
  choice: donna à Jacob
  rationale: La tournure « donner un fils à quelqu’un » rend naturellement en français ילד avec ל et conserve le rapport exprimé par le datif hébreu.
- source_word: בֵּן חֲמִישִׁי
  choice: un cinquième fils
  rationale: Rend directement le nom et l’adjectif ordinal tout en préservant l’idée qu’il s’agit d’un fils supplémentaire pour Jacob.
theological_decisions:
- issue: Réponse divine impliquée par שׁמע אֶל
  choice: Dieu écouta Léa
  alternative: Dieu entendit Léa
  rationale: L’expression hébraïque suggère une attention favorable suivie d’une réponse. « Écouta » communique cette nuance sans préciser davantage que le texte la nature de la requête de Léa.
translation_notes:
  register: Français moderne, international et digne. Deux phrases évitent une coordination lourde et gardent une narration claire. Le passé simple convient au registre narratif biblique sans être archaïque.
