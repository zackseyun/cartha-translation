  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: fr
  text: 'Elle lui donna le nom de Joseph[a], en disant : « Que Yahweh m’ajoute un autre fils ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Joseph évoque en hébreu le verbe qui signifie « qu’il ajoute » ou « il ajoute ».
    reason: Explique le jeu de mots entre יוֹסֵף, Joseph, et יֹסֵף, « qu’il ajoute ».
lexical_decisions:
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: Elle lui donna le nom de
  rationale: Cette tournure française naturelle exprime fidèlement la formule hébraïque littérale « elle appela son nom », qui désigne l’acte de nommer.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle du nom hébreu יוֹסֵף, conservant le lien avec le jeu de mots expliqué en note.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rend l’infinitif quotatif qui introduit l’explication donnée par Rachel.
- source_word: יֹסֵף
  choice: Que … m’ajoute
  rationale: Le hifil de יסף signifie « ajouter ». Dans ce contexte de nomination, la forme exprime naturellement un souhait ou une prière, sans transformer celui-ci en affirmation certaine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: לִי
  choice: m’
  rationale: Le pronom complément dans « m’ajoute » rend naturellement en français la relation exprimée par לִי.
- source_word: בֵּן אַחֵר
  choice: un autre fils
  rationale: בן désigne précisément un fils et אַחֵר un autre; la formulation est exacte et idiomatique.
theological_decisions:
- issue: Valeur de יֹסֵף dans la parole de Rachel
  choice: Que Yahweh m’ajoute
  alternative: Yahweh m’ajoutera
  rationale: Le contexte permet de comprendre la forme comme un souhait ou une prière. La tournure optative française préserve cette nuance sans en faire une prédiction assurée.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un simple titre.
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation rend la force d’un souhait-prière; la note conserve le jeu de mots hébreu impossible à reproduire pleinement en français.
