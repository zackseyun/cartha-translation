  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: fr
  text: 'Alors Léa dit : « Quel bonheur pour moi ! Car les femmes me diront heureuse[a]. » Et elle l’appela Aser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Aser rappelle en hébreu les mots traduits ici par « bonheur » et « diront heureuse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: Quel bonheur pour moi !
  rationale: Cette exclamation naturelle rend l’idée de bonheur ou de félicité ainsi que le suffixe de première personne, tout en préparant le jeu de mots avec Asher.
- source_word: אִשְּׁרוּנִי
  choice: me diront heureuse
  rationale: Le piel de אשר signifie déclarer ou dire quelqu’un heureux. Cette formulation conserve le lien lexical avec le bonheur exprimé juste avant et avec le nom Asher.
- source_word: בָּנוֹת
  choice: les femmes
  rationale: Le sens lexical premier est « filles », mais le pluriel peut ici désigner les femmes en général. « Les femmes » est clair et naturel dans ce contexte.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: Et elle l’appela Asher
  rationale: Cette formulation française naturelle rend fidèlement la formule hébraïque d’attribution du nom sans calquer lourdement « elle appela son nom ».
- source_word: אָשֵׁר
  choice: Asher
  rationale: Le nom propre est translittéré selon sa forme usuelle en français; son rapport sonore avec les mots hébreux évoquant le bonheur est expliqué en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le jeu de mots hébreu est suggéré dans le verset puis explicité en note; le genre féminin de « heureuse » correspond à Léa.
