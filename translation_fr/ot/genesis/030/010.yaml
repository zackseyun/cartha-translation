  yaml_path: translation/ot/genesis/030/010.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a son.
translation:
  language: fr
  text: Zilpa, la servante[a] de Léa, mit au monde un fils de Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « femme esclave ». Le terme hébreu désigne une femme de statut subordonné au service d’une maisonnée.
    reason: nuance lexicale et statut social de שִׁפְחָה
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: donna
  rationale: Le wayyiqtol de ילד poursuit la succession narrative. Avec « un fils à Jacob », le français idiomatique emploie naturellement « donner un fils à quelqu’un »; la naissance demeure explicite dans le contexte.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Transcription française courante du nom propre hébreu.
- source_word: שִׁפְחַת
  choice: la servante
  rationale: שִׁפְחָה désigne une femme au service d’une maisonnée, de statut subordonné. « Servante » est naturel en français et conserve cette dimension sans préciser abusivement son âge.
- source_word: לֵאָה
  choice: de Léa
  rationale: Le rapport construit est rendu naturellement par le complément d’appartenance « la servante de Léa ».
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: Dans cette construction avec ילד, ל marque le père ou bénéficiaire; « donna un fils à Jacob » restitue idiomatiquement ce rapport.
- source_word: בֵּן
  choice: un fils
  rationale: Le nom commun singulier indéfini appelle naturellement l’article « un » en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve l’ordre informatif de l’hébreu tout en adoptant une tournure française naturelle.
