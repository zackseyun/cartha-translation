  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַתָּ֣ה יָדַ֔עְתָּ אֵ֖ת אֲשֶׁ֣ר עֲבַדְתִּ֑י/ךָ וְ/אֵ֛ת אֲשֶׁר הָיָ֥ה מִקְנְ/ךָ֖ אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/029.yaml
  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: fr
  text: 'Il lui dit : « Tu sais toi-même comment je t’ai servi et dans quel état se trouvait ton troupeau avec moi.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ce que ton troupeau était avec moi ». La tournure hébraïque peut désigner l’état du troupeau lorsqu’il était avec Jacob, probablement sous sa responsabilité, plutôt que sa simple présence auprès de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Il lui dit
  rationale: Rend naturellement la succession narrative du wayyiqtol; le contexte identifie le locuteur.
- source_word: אַתָּה יָדַעְתָּ
  choice: Tu sais toi-même
  rationale: Le pronom indépendant אַתָּה placé avant le verbe marque une légère insistance, que « toi-même » conserve en français naturel.
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: comment je t’ai servi
  rationale: עבד exprime ici le service ou le travail accompli pour Laban; « servi » maintient les deux nuances.
- source_word: מִקְנְךָ
  choice: ton troupeau
  rationale: מִקְנֶה désigne collectivement les animaux domestiques, notamment les troupeaux; le singulier collectif est idiomatique en français.
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: ce que ton troupeau est devenu sous mes soins
  rationale: La formulation française exprime probablement l’état ou l’évolution favorable du troupeau lorsqu’il était confié à Jacob, tout en signalant en note la tournure hébraïque plus littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond au dialogue familial et professionnel du récit. « Troupeau » est employé comme collectif; la note préserve l’ambiguïté de la construction hébraïque.
