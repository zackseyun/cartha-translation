base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: fr
  text: Il plaça les bâtons qu’il avait écorcés dans les rigoles, dans les abreuvoirs[a] où le troupeau venait boire, devant le troupeau. Celui-ci entrait en chaleur quand il venait boire.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les deux expressions hébraïques traduites par « rigoles » et « abreuvoirs » sont proches par le sens. Elles peuvent décrire plus précisément une même installation destinée à abreuver les animaux, plutôt que deux lieux entièrement distincts.
    reason: lexical_alternative
  - marker: b
    text: Ou « il s’accouplait quand il venait boire ». Le verbe hébreu signifie plus littéralement que le troupeau entrait en chaleur ; dans ce contexte, l’accouplement peut être sous-entendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: Il plaça
  rationale: Le verbe désigne l’action de mettre quelque chose en position. « Plaça » est concret, naturel et fidèle.
- source_word: הַמַּקְלוֹת
  choice: les bâtons
  rationale: Le terme renvoie ici aux morceaux de bois préparés par Jacob. « Bâtons » convient mieux en français courant que « verges » et reste plus précis que « branches ».
- source_word: אֲשֶׁר פִּצֵּל
  choice: qu’il avait écorcés
  rationale: Dans le contexte, Jacob a retiré par endroits l’écorce afin de faire apparaître des bandes claires. « Écorcés » exprime naturellement l’action sans répéter les détails du verset précédent.
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: dans les rigoles, dans les abreuvoirs
  rationale: Les deux expressions voisines décrivent l’installation où les animaux s’abreuvaient. La répétition est conservée afin de ne pas trancher entre apposition explicative et désignation de deux éléments étroitement liés.
- source_word: הַצֹּאן
  choice: le troupeau / les bêtes
  rationale: צֹאן désigne collectivement le petit bétail, qui peut comprendre moutons et chèvres. « Troupeau » préserve cette portée, tandis que « les bêtes » évite une répétition française pesante dans la proposition suivante.
- source_word: לְנֹכַח הַצֹּאן
  choice: juste devant les bêtes
  rationale: לְנֹכַח indique une position directement en face ou devant le troupeau. « Juste devant » rend clairement cette disposition spatiale.
- source_word: וַיֵּחַמְנָה
  choice: Celles-ci entraient en chaleur
  rationale: Le verbe signifie littéralement devenir chaudes, ici au sens reproductif d’entrer en chaleur. Cette formulation conserve mieux la valeur propre du terme que « s’accouplaient », tout en laissant le contexte suggérer l’accouplement.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: quand elles venaient boire
  rationale: La construction infinitive exprime une circonstance temporelle. Cette tournure est claire et idiomatique en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le choix de « petit bétail » est évité dans le corps du verset au profit de « troupeau », plus fluide, sans réduire צֹאן aux seuls moutons. La répétition spatiale de l’hébreu est maintenue, tandis que la seconde occurrence du collectif est rendue par « les bêtes » pour assurer une lecture naturelle.
