  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: fr
  text: 'Alors Rachel dit : « Dieu m’a rendu justice[a] ; il a aussi entendu ma voix et m’a donné un fils. » C’est pourquoi elle l’appela Dan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Dan évoque en hébreu le verbe qui signifie « juger » ou « rendre justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּנַנִּי
  choice: m’a rendu justice
  rationale: Le verbe דין, avec le suffixe de première personne, présente ici Dieu comme intervenant en faveur de Rachel. « M’a rendu justice » conserve la métaphore judiciaire et reste idiomatique en français, sans renforcer le propos jusqu’à une pleine notion de justification théologique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu d’Israël et commande un verbe au singulier.
- source_word: שָׁמַע בְּקֹלִי
  choice: a aussi entendu ma voix
  rationale: Cette formulation garde l’expression hébraïque avec « ma voix » tout en restant naturelle et compréhensible en français.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: m’a donné un fils
  rationale: Rend directement le verbe נתן, le complément indirect et בֵּן, qui désigne précisément un fils.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Expression française naturelle marquant la conséquence et introduisant l’explication du nom.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: elle l’appela Dan
  rationale: Rend naturellement en français l’idiome hébreu « elle appela son nom Dan », sans perdre la fonction de nomination.
- source_word: דָּן
  choice: Dan
  rationale: Translittération française traditionnelle du nom, dont le lien avec le verbe דין est signalé en note.
theological_decisions:
- issue: Sens judiciaire de l’action divine dans la parole de Rachel
  choice: Dieu m’a rendu justice
  alternative: Dieu m’a jugée
  rationale: Le contexte de nomination suggère une décision ou intervention judiciaire favorable à Rachel. « M’a rendu justice » exprime ce sens probable tout en évitant que « m’a jugée » soit compris en français comme une condamnation; la note préserve le lien lexical avec le nom Dan.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours de Rachel reste direct et personnel; la tournure « C’est pourquoi » offre une transition naturelle vers la nomination.
