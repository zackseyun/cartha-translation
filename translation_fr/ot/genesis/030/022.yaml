  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: fr
  text: Alors Dieu se souvint de Rachel[a] ; il l’écouta[b] et ouvrit sa matrice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porta son attention sur Rachel » ou « fut attentif à Rachel ». Dans cet idiome biblique, le fait que Dieu « se souvienne » signifie qu’il accorde une attention favorable qui conduit à une intervention, et non qu’il avait oublié Rachel.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’entendit » ou « prêta attention à elle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: se souvint
  rationale: 'Conserve l’idiome biblique de זכר : Dieu porte à Rachel une attention favorable qui débouche sur une action, sans suggérer qu’il l’avait oubliée.'
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Les verbes au singulier montrent qu’il s’agit ici du Dieu unique.
- source_word: אֶת רָחֵל
  choice: de Rachel
  rationale: Avec le verbe pronominal français « se souvenir de », Rachel est naturellement introduite par « de », bien que l’hébreu la marque comme objet direct.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: il l’écouta
  rationale: שׁמע avec אֶל exprime ici une écoute attentive et effective. « Écouta » préserve cette nuance sans expliciter davantage par « exauça ».
- source_word: וַיִּפְתַּח
  choice: ouvrit
  rationale: Rend directement le verbe concret פתח et maintient l’image hébraïque.
- source_word: רַחְמָהּ
  choice: lui ouvrit le sein
  rationale: רֶחֶם désigne l’utérus ou le sein maternel. Cette tournure biblique, compréhensible en français, conserve l’idiome signifiant que Dieu lui permit de concevoir.
- source_word: וַ
  choice: Alors ; il… et
  rationale: « Alors » fait avancer naturellement le récit ; la coordination des propositions suivantes évite une répétition lourde de « Dieu » tout en gardant la séquence hébraïque.
theological_decisions:
- issue: Langage anthropomorphique selon lequel Dieu « se souvint » de Rachel
  choice: Maintenir « se souvint » dans le texte principal.
  alternative: « porta son attention sur Rachel » ou « se préoccupa de Rachel »
  rationale: L’hébreu n’implique pas que Dieu avait oublié Rachel. Il emploie un idiome biblique où le souvenir divin désigne une attention favorable suivie d’une intervention ; les propositions suivantes en montrent l’effet.
translation_notes:
  register: Français international moderne, naturel et digne. « Se souvint » et « ouvrit le sein » conservent les images bibliques ; les notes éclairent leur sens sans les remplacer par une paraphrase interprétative.
