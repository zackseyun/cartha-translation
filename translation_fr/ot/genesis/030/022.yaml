    issue: « lui ouvrit le sein »
    rationale: En français actuel, « sein » renvoie normalement au sein/à la poitrine et peut donc évoquer l’allaitement plutôt que l’utérus. « Matrice » rend précisément רֶחֶם et maintient le registre biblique.
