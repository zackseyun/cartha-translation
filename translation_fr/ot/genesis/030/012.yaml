  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: fr
  text: Zilpa[a], l’esclave de Léa, donna à Jacob un deuxième fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la servante de Léa ». Le terme hébreu désigne une femme esclave attachée à Léa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: donna… un fils
  rationale: Le wayyiqtol de ילד fait avancer le récit. La tournure française « donner un fils à quelqu’un » est naturelle dans ce contexte de naissance et rend aussi la relation marquée par לְיַעֲקֹב.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: שִׁפְחַת לֵאָה
  choice: la servante de Léa
  rationale: Le syntagme construit désigne le statut de Zilpa par rapport à Léa. « Servante » est clair, actuel et digne; une note conserve la possibilité plus explicite de comprendre un statut servile.
- source_word: בֵּן שֵׁנִי
  choice: un deuxième fils
  rationale: Rend littéralement l’idée d’un fils qui est le second, ici le deuxième fils que Zilpa donne à Jacob.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: Le לְ marque ici le père ou bénéficiaire dans une formule de naissance; « donna à Jacob un deuxième fils » en restitue naturellement la fonction.
