  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: fr
  text: 'Alors elle dit : « Voici Bilha, ma servante. Va vers elle, afin qu’elle enfante sur mes genoux[a] et que moi aussi, grâce à elle, j’aie des enfants[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’elle enfante sur mes genoux ». Cette expression renvoie probablement à une coutume selon laquelle Rachel recevrait symboliquement comme sien l’enfant mis au monde par sa servante.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « que je sois, moi aussi, bâtie grâce à elle », métaphore évoquant ici le fait d’obtenir une descendance ou de fonder une famille.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: ma servante
  rationale: Le terme désigne une femme en position servile. « Ma servante » est clair, actuel et conforme au contexte social, sans recourir à une formulation archaïque.
- source_word: בֹּא אֵלֶיהָ
  choice: Va vers elle
  rationale: Cette expression est un euphémisme hébreu désignant des relations sexuelles. La traduction conserve ici la formulation indirecte du texte source; le contexte immédiat en éclaire le sens.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: afin qu’elle enfante sur mes genoux
  rationale: La formulation concrète et culturellement marquée de l’hébreu est conservée dans le texte; une note explique son probable sens symbolique.
- source_word: וְאִבָּנֶה
  choice: j’aie des enfants
  rationale: Dans ce contexte, le passif de « bâtir » exprime l’idée d’être constituée ou établie par une descendance. Une traduction idiomatique rend le sens en français, tandis que la note conserve la métaphore hébraïque.
- source_word: מִמֶּנָּה
  choice: grâce à elle
  rationale: La préposition présente Bilha comme l’intermédiaire par lequel Rachel espère obtenir une descendance. « Grâce à elle » exprime naturellement ce rapport en français.
- source_word: גַם אָנֹכִי
  choice: moi aussi
  rationale: La tournure préserve l’insistance du texte sur Rachel, qui espère participer elle aussi à la maternité malgré sa stérilité.
theological_decisions:
- issue: Statut de l’enfant mis au monde par Bilha
  choice: Conserver l’image « sur mes genoux » et expliquer prudemment sa portée probable
  alternative: 'Paraphraser directement : « afin que l’enfant soit reconnu comme le mien »'
  rationale: Le texte ne formule pas explicitement un acte juridique d’adoption. Maintenir l’image évite d’imposer une interprétation plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste fluide tout en conservant l’euphémisme « Va vers elle » et l’image culturellement marquée des genoux. La métaphore hébraïque de la construction, peu naturelle en français courant, est signalée en note.
