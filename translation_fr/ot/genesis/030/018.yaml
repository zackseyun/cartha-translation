  text: וַ/תֹּ֣אמֶר לֵאָ֗ה נָתַ֤ן אֱלֹהִים֙ שְׂכָרִ֔/י אֲשֶׁר נָתַ֥תִּי שִׁפְחָתִ֖/י לְ/אִישִׁ֑/י וַ/תִּקְרָ֥א שְׁמ֖/וֹ יִשָּׂשכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: fr
  text: 'Léa dit : « Dieu m’a donné mon salaire, parce que j’ai donné ma servante à mon mari. » Et elle l’appela Issacar[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Issacar fait écho en hébreu au mot traduit par « salaire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: Dieu m’a donné
  rationale: Le parfait hébreu décrit un acte accompli dont Léa constate le résultat; le passé composé est naturel dans ce discours en français moderne.
- source_word: שְׂכָרִי
  choice: mon salaire
  rationale: שָׂכָר désigne un salaire, une rétribution ou une récompense. « Mon salaire » conserve le caractère concret et transactionnel de la déclaration ainsi que l’écho avec le nom Issacar.
- source_word: אֲשֶׁר
  choice: parce que
  rationale: Dans cette construction, le relatif introduit le motif que Léa donne à la rétribution divine; « parce que » exprime clairement cette valeur causale.
- source_word: נָתַתִּי שִׁפְחָתִי
  choice: j’ai donné ma servante
  rationale: Le passé composé marque naturellement en français l’action antérieure invoquée par Léa. « Servante » rend le statut de שִׁפְחָה sans ajouter une précision d’âge absente du texte.
- source_word: לְאִישִׁי
  choice: à mon mari
  rationale: Dans ce contexte conjugal, אִישִׁי signifie clairement « mon mari » plutôt que simplement « mon homme ».
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Et elle l’appela
  rationale: Cette tournure française rend naturellement l’acte de donner un nom tout en maintenant la succession narrative.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forme française traditionnelle et courante du nom biblique, dont le lien sonore avec שָׂכָר est signalé en note.
theological_decisions:
- issue: L’interprétation par Léa de l’action divine
  choice: Rapporter directement l’affirmation selon laquelle Dieu lui a donné un salaire.
  alternative: Employer « récompense » pour atténuer la nuance transactionnelle.
  rationale: Le verset présente l’interprétation de Léa sans l’approuver ni la critiquer explicitement. « Salaire » préserve la tension théologique et l’image de rétribution présente dans ses paroles.
translation_notes:
  register: Français international moderne, simple et digne. « Servante » reste intelligible et convient au registre narratif biblique; la note explique le jeu de mots que la traduction du nom ne peut reproduire.
