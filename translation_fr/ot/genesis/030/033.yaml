base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: fr
  text: 'Ainsi, mon honnêteté répondra pour moi à l’avenir[a], lorsque tu viendras examiner mon salaire : toute chèvre qui ne sera ni mouchetée ni tachetée, et tout mouton qui ne sera pas de couleur sombre[b], seront considérés comme volés s’ils se trouvent chez moi.


    [a] Littéralement « au jour de demain » ; l’expression peut désigner le lendemain ou, plus généralement, un moment ultérieur où Laban examinera le troupeau. Le mot traduit par « honnêteté » peut aussi être rendu par « justice » ou « intégrité ».


    [b] Ou « brun ». Le terme hébreu désigne un animal de couleur sombre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « au jour de demain » ; l’expression peut désigner le lendemain ou, plus généralement, un moment ultérieur où Laban examinera le troupeau. Le mot traduit par « honnêteté » peut aussi être rendu par « justice » ou « intégrité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « brun ». Le terme hébreu désigne un animal de couleur sombre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: répondra pour moi
  rationale: Conserve l’image hébraïque d’une qualité morale qui répond ou témoigne en faveur de Jacob, tout en restant intelligible en français.
- source_word: צִדְקָתִי
  choice: mon honnêteté
  rationale: Dans le cadre concret de l’accord salarial, le terme désigne la conduite droite et vérifiable de Jacob. « Honnêteté » exprime naturellement ce sens, tandis que les possibilités « justice » et « intégrité » sont signalées en note.
- source_word: בְּיוֹם מָחָר
  choice: à l’avenir
  rationale: Littéralement « au jour de demain » ; dans ce contexte, la formule vise le contrôle ultérieur du salaire de Jacob, sans imposer nécessairement le lendemain immédiat.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: lorsque tu viendras examiner mon salaire
  rationale: Rend la portée pratique de la venue de Laban au sujet du salaire. Sa présence et son jugement sont déjà exprimés par « tu viendras examiner », sans ajout français redondant pour לְפָנֶיךָ.
- source_word: נָקֹד וְטָלוּא
  choice: mouchetée ni tachetée
  rationale: Distingue les petites marques ou mouchetures des taches plus larges. La coordination négative française énonce naturellement les deux types de marques.
- source_word: חוּם
  choice: de couleur sombre
  rationale: Le mot peut désigner une teinte brune ou plus largement foncée ; la formulation choisie évite une précision excessive.
- source_word: בַּכְּשָׂבִים
  choice: tout mouton
  rationale: Le terme désigne ici les ovins du troupeau ; « mouton » est plus sûr et plus général que « agneau » dans ce contexte.
- source_word: גָּנוּב הוּא אִתִּי
  choice: sera considéré comme volé s’il se trouve chez moi
  rationale: 'Explicite sobrement le sens judiciaire de la formule hébraïque concise : tout animal non conforme trouvé en possession de Jacob comptera comme volé.'
