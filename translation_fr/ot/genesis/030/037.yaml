translation_notes:
  register: Français international moderne, simple et digne. « Baguettes » convient au contexte pastoral et « fraîchement coupées » rend explicitement l’état encore vert du bois. La seconde phrase garde la répétition du blanc présente en hébreu, tout en adoptant une syntaxe française naturelle.
