  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: fr
  text: Jacob prit des baguettes fraîchement coupées de peuplier[a], d’amandier[b] et de platane[c]. Il y fit des bandes blanches en mettant à nu le blanc des baguettes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « styrax » ; l’identification exacte de לִבְנֶה est incertaine, bien que « peuplier » soit une traduction courante.
    reason: lexical_alternative
  - marker: b
    text: Certaines traductions anciennes ont « noisetier », mais « amandier » est plus probable.
    reason: lexical_alternative
  - marker: c
    text: Certaines traductions anciennes ont « châtaignier », mais « platane » est plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: baguettes
  rationale: Le terme désigne ici des branches coupées utilisées par Jacob. « Baguettes » évoque naturellement en français des morceaux de bois longs et relativement minces, sans suggérer des bâtons servant d’appui.
- source_word: לִבְנֶה לַח
  choice: baguettes fraîchement coupées de peuplier
  rationale: לַח signifie « frais, encore vert ou humide » ; dans ce contexte, « fraîchement coupées » en exprime clairement le sens. L’identification de לִבְנֶה comme peuplier est courante, mais demeure incertaine et fait donc l’objet d’une note.
- source_word: לוּז
  choice: amandier
  rationale: L’identification comme amandier est lexicalement plus probable que l’ancienne traduction « noisetier ».
- source_word: עֶרְמוֹן
  choice: platane
  rationale: « Platane » est l’identification botanique généralement retenue ; « châtaignier », fréquent dans des traductions anciennes, est moins probable.
- source_word: וַיְפַצֵּל
  choice: pela
  rationale: Le verbe décrit l’enlèvement partiel de l’écorce afin de faire apparaître le bois clair qui se trouve dessous.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: des bandes blanches
  rationale: L’expression désigne les marques claires produites par l’écorçage. « Bandes blanches » rend naturellement leur aspect visible.
- source_word: מַחְשֹׂף הַלָּבָן
  choice: mettant ainsi à nu le blanc
  rationale: Cette formulation conserve l’idée d’exposition ou de mise à découvert et le substantif « le blanc », sans préciser au-delà de l’hébreu qu’il s’agit du bois intérieur.
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: des baguettes
  rationale: Le complément français rattache naturellement le blanc aux baguettes. Une traduction mécanique par « qui était sur les baguettes » serait maladroite et pourrait donner l’impression que le blanc se trouvait déjà à leur surface avant l’écorçage.
