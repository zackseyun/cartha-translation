  text: וַ/תֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים נִפְתַּ֛לְתִּי עִם אֲחֹתִ֖/י גַּם יָכֹ֑לְתִּי וַ/תִּקְרָ֥א שְׁמ֖/וֹ נַפְתָּלִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: fr
  text: 'Alors Rachel dit : « J’ai mené avec ma sœur des luttes de Dieu[a], et je l’ai même emporté. » Elle lui donna le nom de Nephtali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se comprendre comme « des luttes divines » ou, si le mot « Dieu » a ici une valeur intensive, « de puissantes luttes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: des luttes de Dieu
  rationale: Cette traduction conserve la construction hébraïque difficile et sa possible référence directe à Dieu, sans exclure l’emploi intensif possible d’אֱלֹהִים. La note explicite l’ambiguïté.
- source_word: נִפְתַּלְתִּי
  choice: j’ai mené … des luttes
  rationale: Cette formulation française naturelle conserve l’image de la lutte et le lien étymologique avec le nom Nephtali, même si la répétition exacte du radical hébreu ne peut être reproduite élégamment.
- source_word: עִם אֲחֹתִי
  choice: avec ma sœur
  rationale: Le sens ordinaire de עִם est « avec ». Dans ce contexte de rivalité, « avec » peut naturellement désigner la personne avec laquelle Rachel lutte, sans imposer le plus explicite « contre ».
- source_word: גַּם יָכֹלְתִּי
  choice: et je l’ai même emporté
  rationale: Le verbe exprime ici la réussite ou l’avantage obtenu dans une lutte. « L’emporter » rend clairement ce sens, tandis que « même » restitue la valeur contextuelle de גַּם.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: Elle lui donna donc le nom de Nephtali
  rationale: Cette formulation française actuelle restitue la formule de nomination et relie explicitement la déclaration de Rachel au nom de l’enfant.
- source_word: נַפְתָּלִי
  choice: Nephtali
  rationale: Forme française biblique usuelle du nom hébreu, qui maintient autant que possible son lien sonore avec le vocabulaire de la lutte.
theological_decisions:
- issue: Sens de l’expression נַפְתּוּלֵי אֱלֹהִים
  choice: Conserver « des luttes de Dieu » dans le texte
  alternative: « de puissantes luttes » ou « des luttes extraordinaires »
  rationale: L’hébreu peut faire directement référence à Dieu ou employer אֱלֹהִים comme intensif. Le texte principal conserve cette tension au lieu de trancher, et la note présente l’autre lecture possible.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure légèrement inhabituelle « des luttes de Dieu » est volontaire afin de préserver l’ambiguïté de l’hébreu ; la phrase reste accessible grâce au verbe naturel « mener » et à la note.
