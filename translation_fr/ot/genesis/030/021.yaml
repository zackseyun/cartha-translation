source:
  edition: WLC
  text: וְ/אַחַ֖ר יָ֣לְדָה בַּ֑ת וַ/תִּקְרָ֥א אֶת שְׁמָ֖/הּ דִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/021.yaml
  text: Afterward she bore a daughter and called her name Dinah.
translation:
  language: fr
  text: Après cela, elle mit au monde une fille et l’appela Dina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Après cela
  rationale: Marque la succession temporelle après les naissances précédentes. « Après cela » est naturel en français moderne et conserve la progression du récit.
- source_word: יָלְדָה
  choice: elle mit au monde
  rationale: Le qal accompli, troisième personne du féminin singulier de ילד, exprime ici l’accouchement avec pour objet « une fille ». « Mit au monde » est idiomatique, clair et digne en français courant.
- source_word: בַּת
  choice: une fille
  rationale: Nom féminin singulier indéfini, objet du verbe. En contexte de naissance, « une fille » est la formulation française naturelle.
- source_word: וַ/תִּקְרָא
  choice: et l’appela
  rationale: Le wayyiqtol poursuit la chaîne narrative. Avec le nom qui suit, « l’appela Dina » rend naturellement l’acte de donner un nom.
- source_word: אֶת שְׁמָהּ
  choice: l’
  rationale: L’hébreu dit littéralement « appela son nom », mais le français idiomatique emploie « l’appela ». Le sens est conservé sans calque maladroit.
- source_word: דִּינָה
  choice: Dina
  rationale: Transcription française traditionnelle et courante du nom propre hébreu דִּינָה.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, simple et digne. La formulation privilégie l’équivalence optimale : elle conserve l’ordre narratif et tout le contenu de l’hébreu, tout en évitant le calque peu naturel « appela son nom ».'
