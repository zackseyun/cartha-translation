base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/025.yaml
  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: fr
  text: 'Après que Rachel eut donné naissance à Joseph, Jacob dit à Laban : « Laisse-moi partir, afin que je retourne chez moi, dans mon pays. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Laisse-moi partir
  rationale: Dans ce contexte, le piel impératif de שׁלח exprime la demande faite à Laban de permettre à Jacob de s’en aller; cette tournure est naturelle en français sans suggérer nécessairement un renvoi hostile.
- source_word: מְקוֹמִי וּלְאַרְצִי
  choice: chez moi, dans mon pays
  rationale: « Chez moi » rend idiomatiquement « mon lieu » comme le lieu où Jacob appartient, tandis que « dans mon pays » conserve la seconde désignation et la nuance d’appartenance portée par les suffixes possessifs.
- source_word: כַּאֲשֶׁר יָלְדָה רָחֵל אֶת־יוֹסֵף
  choice: Après que Rachel eut donné naissance à Joseph
  rationale: La proposition temporelle situe la demande de Jacob à la suite de la naissance de Joseph. Le passé antérieur marque clairement l’antériorité dans un registre narratif digne.
