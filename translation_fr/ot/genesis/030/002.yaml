id: GEN.30.2
reference: Genesis 30:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: fr
  text: 'Alors Jacob se mit en colère contre Rachel et dit[a] : « Suis-je à la place de Dieu, lui qui t’a privée du fruit de ton ventre[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « sa colère s’enflamma contre Rachel ».'
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque désignant les enfants ou la descendance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: se mit en colère
  rationale: Cette formulation française naturelle exprime l’entrée dans la colère et conserve la force de l’idiome hébreu, littéralement lié à une colère qui brûle.
- source_word: בְּרָחֵל
  choice: contre Rachel
  rationale: Avec un verbe de colère, la préposition désigne la personne vers qui celle-ci est dirigée. « Contre Rachel » est idiomatique et précis en français.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: Suis-je à la place de Dieu
  rationale: תַּחַת exprime ici la substitution ou la position occupée à la place d’un autre, et non une simple localisation sous Dieu.
- source_word: אֲשֶׁר מָנַע מִמֵּךְ
  choice: lui qui t’a privée
  rationale: Le verbe présente Dieu comme celui qui a refusé à Rachel la fécondité. « Priver quelqu’un de » rend naturellement en français la séparation ou la privation marquée par מִן.
- source_word: פְּרִי בָטֶן
  choice: le fruit de ton ventre
  rationale: La traduction conserve la métaphore concrète de l’hébreu pour la descendance, tout en employant une expression française compréhensible.
theological_decisions:
- issue: Rôle de Dieu dans la stérilité de Rachel
  choice: Jacob attribue explicitement à Dieu le fait que Rachel n’ait pas d’enfant.
  alternative: Comprendre la phrase comme une simple question rhétorique ne formulant aucune affirmation sur l’action divine.
  rationale: La proposition relative אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן identifie directement Dieu comme celui qui a privé Rachel du fruit du ventre. La traduction préserve cette affirmation sans l’atténuer.
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « se mit en colère » évite un calque maladroit, tandis que « fruit de ton ventre » maintient l’image biblique. Les deux marqueurs de note figurent dans le texte.
