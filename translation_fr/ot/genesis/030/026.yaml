  - severity: low
    issue: « Puis laisse-moi partir » est plus explicite que le cohortatif hébreu.
    rationale: Le texte hébreu enchaîne la demande de remettre la famille et le souhait résolu de partir. « Afin que je parte » restitue plus directement cette valeur volitive sans ajouter explicitement l’impératif « laisse-moi ».
