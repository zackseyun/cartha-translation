base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: fr
  text: Donne-moi mes femmes et mes enfants[a], pour qui j’ai travaillé chez toi, afin que je parte ; car tu sais quel travail j’ai fait pour toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le relatif hébreu est au féminin pluriel et peut renvoyer plus précisément aux femmes plutôt qu’à l’ensemble de la famille mentionnée. La formulation française « pour qui » laisse cette question ouverte.
    reason: lexical_alternative
  - marker: b
    text: Les verbes traduits par « travaillé » et « fait », ainsi que le nom « travail », rendent des formes de la même racine hébraïque, qui peut évoquer le service, le travail ou le labeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: Donne-moi
  rationale: L’impératif de נתן s’adresse à Laban. Le complément « moi », implicite dans le contexte, est nécessaire en français naturel.
- source_word: נָשַׁי
  choice: mes femmes
  rationale: Le pluriel de אִשָּׁה avec suffixe de première personne désigne ici sans ambiguïté les femmes de Jacob.
- source_word: יְלָדַי
  choice: mes enfants
  rationale: Terme familial courant qui rend naturellement יְלָדַי dans ce contexte.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָהֵן
  choice: pour lesquels je t’ai servi
  rationale: Cette formulation rattache naturellement la proposition à l’ensemble de la famille mentionnée, tout en signalant en note que le pronom hébreu féminin pluriel peut viser plus précisément les femmes.
- source_word: וְאֵלֵכָה
  choice: puis laisse-moi partir
  rationale: Le cohortatif exprime le désir et la demande de Jacob de pouvoir partir. Cette tournure est plus naturelle en français actuel que « et que je parte ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la justification de la demande et conserve un registre digne sans être archaïque.
- source_word: יָדַעְתָּ
  choice: tu sais
  rationale: 'Le parfait hébreu a ici une valeur présente : Laban connaît la réalité du travail accompli par Jacob.'
- source_word: עֲבֹדָתִי
  choice: quel travail
  rationale: « Travail » exprime clairement l’activité soutenue de Jacob au service de Laban. L’ajout idiomatique de « quel » rend la construction française fluide.
- source_word: אֲשֶׁר עֲבַדְתִּיךָ
  choice: j’ai accompli à ton service
  rationale: Cette expression restitue le rapport de service envers Laban et évite en français la lourdeur d’une répétition telle que « le service par lequel je t’ai servi ».
