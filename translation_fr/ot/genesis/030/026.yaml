- from: Donne-moi mes femmes et mes enfants[a], pour lesquels je t’ai servi, puis laisse-moi partir, car tu sais quel travail j’ai accompli à ton service[b].
  to: Donne-moi mes femmes et mes enfants[a], pour qui j’ai travaillé chez toi, afin que je parte ; car tu sais quel travail j’ai fait pour toi[b].
  rationale: La correction résout la discordance structurelle entre le masculin français « lesquels » et le féminin pluriel hébreu signalé en note, tout en ne tranchant pas indûment l’antécédent de בָהֵן. Elle rend aussi le cohortatif par une tournure volitive plus proche du texte source et aligne la note sur les choix lexicaux réellement employés.
