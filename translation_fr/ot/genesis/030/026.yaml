  naturalness: La révision proposée emploie un français international moderne et fluide. « Pour qui » évite une concordance française artificiellement masculine tout en laissant ouverte la portée du relatif. « Quel travail j’ai fait pour toi » est idiomatique et rend l’insistance sur le travail accompli.
  terminology: « Femmes », « enfants », « travaillé » et « travail » conviennent au contexte. La répétition française entre « travaillé » et « travail » reflète raisonnablement la répétition de la racine hébraïque עבד, sans produire une formulation lourde.
