  yaml_path: translation/ot/genesis/030/019.yaml
  text: Leah conceived again and bore Jacob a sixth son.
translation:
  language: fr
  text: Léa conçut encore et donna à Jacob un sixième fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: conçut
  rationale: Le verbe הרה désigne ici la conception. « Conçut » est concis, naturel dans un récit de naissance et plus proche de la formulation hébraïque que « tomba enceinte ».
- source_word: עוֹד
  choice: encore
  rationale: 'Dans cette suite narrative, עוֹד marque la répétition : Léa conçut une nouvelle fois.'
- source_word: וַתֵּלֶד
  choice: donna … un fils
  rationale: Le verbe ילד signifie ici « donner naissance ». La construction « donner à quelqu’un un fils » restitue naturellement en français la relation exprimée par לְיַעֲקֹב.
- source_word: בֵּן
  choice: fils
  rationale: Le nom signifie directement « fils » ; une formulation comme « enfant mâle » serait inutilement clinique.
- source_word: שִׁשִּׁי
  choice: un sixième
  rationale: L’ordinal indique qu’il s’agit du sixième fils que Léa donne à Jacob. L’article indéfini convient à la syntaxe française.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: La préposition לְ marque ici la relation dans l’expression « enfanter un fils à/pour Jacob ». « Donna à Jacob » est idiomatique et conserve cette nuance.
