  text: Bilha devint enceinte et donna un fils à Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Le verbe הרה désigne le fait de devenir enceinte. Cette formulation moderne restitue directement le début de la grossesse et convient à la progression narrative.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Le nom propre est translittéré selon sa forme française courante.
- source_word: וַתֵּלֶד
  choice: donna un fils
  rationale: Le verbe ילד signifie enfanter ou donner naissance. Avec le complément introduit par לְ, « donna un fils à Jacob » est naturel en français et conserve l'idée relationnelle du texte hébreu.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: La préposition לְ marque ici le rapport entre la naissance et Jacob; « à Jacob » en donne une expression française concise sans effacer entièrement sa présence dans le texte source.
- source_word: בֵּן
  choice: un fils
  rationale: בֵּן signifie « fils »; l'article indéfini est requis dans cette construction française.
