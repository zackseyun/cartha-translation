  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: fr
  text: 'Aujourd’hui, laisse-moi passer au milieu de tout ton troupeau et en retirer toute bête mouchetée et tachetée, tout mouton de couleur sombre parmi les moutons, ainsi que toute chèvre tachetée et mouchetée : ce sera mon salaire.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: laisse-moi passer
  rationale: L’imparfait qal à la première personne peut être futur ou volitif. Dans cette proposition faite à Laban, la tournure permissive et volitive est naturelle.
- source_word: בְּכָל צֹאנְךָ
  choice: au milieu de tout ton troupeau
  rationale: צֹאן désigne collectivement le petit bétail, notamment les moutons et les chèvres. « Troupeau » conserve ce sens collectif.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’adverbe temporel hébreu.
- source_word: הָסֵר מִשָּׁם
  choice: en retirer
  rationale: La forme de סור exprime ici l’action de séparer et d’enlever certaines bêtes du troupeau.
- source_word: כָּל שֶׂה
  choice: toute bête / tout mouton / toute chèvre
  rationale: שֶׂה peut désigner une tête de petit bétail de manière générique. Le français précise ensuite l’espèce selon les groupes explicitement distingués dans le verset.
- source_word: נָקֹד
  choice: moucheté
  rationale: Le terme évoque de petites marques ou taches; « moucheté » le distingue convenablement de טָלוּא.
- source_word: טָלוּא
  choice: tacheté
  rationale: Le mot décrit une robe marquée de taches ou de plaques. « Tacheté » est naturel sans imposer une distinction trop précise.
- source_word: חוּם
  choice: de couleur sombre
  rationale: L’adjectif désigne une teinte sombre ou brune. Cette formulation évite de préciser excessivement la nuance exacte.
- source_word: בַּכְּשָׂבִים
  choice: mouton
  rationale: Dans ce contexte de troupeau, כְּשָׂבִים désigne les ovins en contraste avec les chèvres; « mouton » est plus naturel ici que « agneau ».
- source_word: בָּעִזִּים
  choice: chèvre
  rationale: עִזִּים désigne les caprins; « chèvre » est la désignation française courante dans ce contexte.
- source_word: וְהָיָה שְׂכָרִי
  choice: ce sera mon salaire
  rationale: שָׂכָר désigne le salaire ou la rémunération; la formulation convient à la relation de travail entre Jacob et Laban.
theological_decisions: []
