    issue: Les deux occurrences de la paire de termes de robe sont coordonnées par « ou ».
    rationale: 'L’hébreu emploie וְ (« et ») : נָקֹד וְטָלוּא, puis טָלוּא וְנָקֹד. Même si le recouvrement sémantique des termes est possible, le texte les associe plutôt qu’il ne présente explicitement une alternative.'
  revised_text: 'Aujourd’hui, laisse-moi passer au milieu de tout ton troupeau et en retirer toute bête mouchetée et tachetée, tout mouton de couleur sombre parmi les moutons, ainsi que toute chèvre tachetée et mouchetée : ce sera mon salaire.'
  revised_footnotes:
