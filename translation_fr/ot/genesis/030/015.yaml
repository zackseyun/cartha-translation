  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: fr
  text: 'Mais Léa lui répondit : « N’était-ce pas assez que tu m’aies pris mon mari ? Et tu veux prendre aussi les mandragores de mon fils ? » Rachel dit : « Dans ce cas, il couchera avec toi cette nuit en échange des mandragores de ton fils. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: Est-ce peu de chose
  rationale: Conserve la tournure rhétorique hébraïque tout en restant naturelle et intelligible en français moderne.
- source_word: קַחְתֵּךְ אֶת אִישִׁי
  choice: que tu aies pris mon mari
  rationale: Rend directement l’accusation de Léa sans en atténuer la force ni préciser au-delà du texte la nature de cette « prise ».
- source_word: דּוּדָאֵי
  choice: mandragores
  rationale: Équivalent botanique traditionnel et probable de l’hébreu, sans expliciter ici les associations anciennes de fécondité ou d’aphrodisiaque.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: il couchera avec toi
  rationale: Reproduit l’euphémisme sexuel clair de l’hébreu avec une expression française courante et digne.
- source_word: תַּחַת
  choice: en échange de
  rationale: Exprime ici la substitution ou contrepartie négociée entre Rachel et Léa.
theological_decisions:
- issue: Identification de la première locutrice
  choice: Mais Léa lui répondit
  alternative: Mais elle lui répondit
  rationale: Le contexte immédiat identifie Léa comme locutrice; expliciter son nom évite une ambiguïté pronominale artificielle en français sans ajouter d’interprétation doctrinale.
- issue: Portée de l’accusation « prendre mon mari »
  choice: Maintien littéral de l’accusation
  alternative: « m’avoir enlevé mon mari » ou une paraphrase expliquant la rivalité conjugale
  rationale: Le texte présente le jugement de Léa sans arbitrer la responsabilité morale ou juridique de Rachel.
- issue: Nature de l’accord concernant Jacob
  choice: « il couchera avec toi cette nuit »
  alternative: « tu passeras la nuit avec lui »
  rationale: La formulation garde Jacob comme sujet grammatical, conformément à l’hébreu, et préserve la tension narrative de la négociation.
translation_notes:
  register: Français international moderne, direct et digne. Le dialogue conserve l’âpreté de l’échange. « Eh bien » rend naturellement לָכֵן dans ce contexte de conclusion transactionnelle.
