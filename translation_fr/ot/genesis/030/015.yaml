- from: 'Mais Léa lui répondit : « Est-ce peu de chose que tu aies pris mon mari ? Veux-tu aussi prendre les mandragores de mon fils ? » Rachel dit : « Eh bien, il couchera avec toi cette nuit en échange des mandragores de ton fils. »'
