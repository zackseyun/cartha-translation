  text: וַ/תֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְ/יַעֲקֹ֔ב וַ/תְּקַנֵּ֥א רָחֵ֖ל בַּ/אֲחֹתָ֑/הּ וַ/תֹּ֤אמֶר אֶֽל יַעֲקֹב֙ הָֽבָ/ה לִּ֣/י בָנִ֔ים וְ/אִם אַ֖יִן מֵתָ֥ה אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: fr
  text: 'Quand Rachel vit qu’elle n’avait pas donné d’enfants à Jacob, elle devint jalouse de sa sœur et dit à Jacob : « Donne-moi des enfants, sinon je meurs ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל
  choice: Quand Rachel vit
  rationale: Le waw narratif fait progresser le récit, tandis que « quand » exprime naturellement en français le lien temporel et causal avec la réaction qui suit.
- source_word: כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: qu’elle ne donnait pas d’enfants à Jacob
  rationale: Au qal, יָלַד appliqué à une femme signifie « enfanter, mettre au monde ». Cette formulation française courante garde la relation marquée par לְ et explicite l’objet sous-entendu par le contexte.
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: elle devint jalouse de sa sœur
  rationale: קנא désigne ici la jalousie ou l’envie suscitée par la fécondité de sa sœur. « Devint jalouse » rend le mouvement narratif, et le pronom évite une répétition du nom peu naturelle en français sans créer d’ambiguïté.
- source_word: הָבָה לִּי בָנִים
  choice: Donne-moi des enfants
  rationale: בָּנִים signifie formellement « fils », mais peut désigner la descendance ou les enfants dans ce contexte de stérilité. « Enfants » transmet naturellement la demande sans préciser indûment le sexe.
- source_word: וְאִם אַיִן
  choice: sinon
  rationale: L’expression introduit l’autre issue envisagée. « Sinon » en restitue avec concision la force d’ultimatum.
- source_word: מֵתָה אָנֹכִי
  choice: je meurs
  rationale: La forme exprime avec intensité un état ou une issue imminente. Le présent français conserve la parole abrupte et désespérée de Rachel, sans décider s’il s’agit d’une mort littérale annoncée ou d’une hyperbole.
theological_decisions:
- issue: Portée de בָּנִים dans la demande de Rachel
  choice: enfants
  alternative: fils
  rationale: Dans ce contexte, Rachel réclame une descendance face à sa stérilité. Le terme hébreu peut avoir une portée collective, et « enfants » évite d’imposer que seuls des garçons soient visés.
- issue: Valeur de מֵתָה אָנֹכִי
  choice: je meurs
  alternative: je mourrai
  rationale: Le présent garde l’intensité et l’ambiguïté de la formulation hébraïque entre état désespéré, imminence et conséquence redoutée, sans l’expliquer psychologiquement.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la vigueur émotionnelle et l’ultimatum de Rachel, tout en évitant une répétition de son nom qui serait lourde en français.
