id: GEN.30.42
reference: Genesis 30:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: fr
  text: Mais quand les bêtes du troupeau étaient faibles[a], Jacob ne plaçait pas les baguettes devant elles[b]. Ainsi, les faibles revenaient à Laban, et les robustes[c] à Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étaient chétives ». Le terme hébreu peut désigner des animaux faibles; certains y voient plus précisément une allusion à une période de reproduction tardive ou moins favorable.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les baguettes mentionnées dans les versets précédents. En hébreu, l’objet du verbe n’est pas exprimé.
    reason: cross_reference
  - marker: c
    text: Ou « les fortes » ou « les vigoureuses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף
  choice: quand … étaient faibles
  rationale: La préposition בְּ avec l’infinitif construit introduit une proposition temporelle. Dans ce contexte d’accouplement, עטף désigne vraisemblablement les bêtes faibles, par opposition aux animaux robustes mentionnés ensuite, sans qu’il soit nécessaire de préciser une reproduction tardive.
- source_word: הַצֹּאן
  choice: les bêtes du troupeau
  rationale: צֹאן est un collectif désignant le petit bétail, notamment les moutons et les chèvres. Cette formulation française rend clairement le sens collectif tout en permettant l’accord avec « faibles ».
- source_word: לֹא יָשִׂים
  choice: Jacob ne plaçait pas les baguettes devant elles
  rationale: Le verbe שׂים signifie « mettre, placer ». Son objet est sous-entendu en hébreu et renvoie, d’après les versets précédents, aux baguettes que Jacob disposait devant les bêtes. Le nom de Jacob et le complément sont explicités pour assurer une lecture naturelle et non ambiguë en français.
- source_word: וְהָיָה
  choice: Ainsi, … revenaient à
  rationale: La construction exprime ici le résultat ou la répartition obtenue. « Ainsi » rend ce lien, et « revenaient à » exprime naturellement l’attribution ou l’appartenance en français.
- source_word: הָעֲטֻפִים
  choice: les faibles
  rationale: Cette forme issue de עטף reprend la catégorie des animaux faibles déjà évoquée et conserve la cohésion lexicale du verset.
- source_word: לְלָבָן
  choice: revenaient à Laban
  rationale: Le לְ marque ici l’appartenance ou l’attribution. « Revenir à » convient naturellement à la répartition des troupeaux.
- source_word: וְהַקְּשֻׁרִים
  choice: les robustes
  rationale: Dans l’opposition contextuelle avec הָעֲטֻפִים, ce terme inhabituel désigne les bêtes vigoureuses ou fortes. « Robustes » exprime nettement ce contraste sans ajouter une précision physiologique.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: Comme pour Laban, le לְ indique l’appartenance ou l’attribution; l’ellipse du verbe dans le second membre est naturelle en français.
