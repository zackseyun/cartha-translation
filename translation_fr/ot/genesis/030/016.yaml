base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: fr
  text: 'Quand Jacob revint du champ le soir, Léa sortit à sa rencontre et lui dit : « Tu viendras à moi, car je t’ai bel et bien loué en échange des mandragores de mon fils[a]. » Et cette nuit-là, il coucha avec elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit avec insistance : « car te louer, je t’ai loué avec les mandragores de mon fils »; la préposition peut présenter les mandragores comme le moyen ou le prix de l’accord.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  choice: revint du champ
  rationale: Le verbe בוא indique ici l’arrivée de Jacob depuis le champ. « Revint » exprime naturellement son retour au campement ou au foyer, tandis que « du champ » conserve le singulier hébreu.
- source_word: בָּעֶרֶב
  choice: le soir
  rationale: Expression temporelle naturelle en français moderne, fidèle au sens de l’hébreu.
- source_word: וַתֵּצֵא ... לִקְרָאתוֹ
  choice: sortit à sa rencontre
  rationale: Rend directement le mouvement de Léa vers Jacob dans un français idiomatique.
- source_word: אֵלַי תָּבוֹא
  choice: Tu viendras à moi
  rationale: Conserve la formulation directe et insistante de Léa ainsi que l’euphémisme sexuel du texte, sans l’expliciter davantage.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: je t’ai bel et bien loué
  rationale: « Loué » préserve le caractère transactionnel et la racine שׂכר. « Bel et bien » rend l’insistance produite par l’infinitif absolu associé au verbe conjugué.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: en échange des mandragores de mon fils
  rationale: La préposition בְּ marque ici le moyen ou le prix de l’accord. « En échange de » rend clairement ce rapport sans supprimer la référence précise aux mandragores.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: il coucha avec elle
  rationale: Équivalent français courant de l’euphémisme biblique désignant une relation sexuelle; il demeure sobre et digne.
- source_word: בַּלַּיְלָה הוּא
  choice: cette nuit-là
  rationale: Restitue naturellement la valeur démonstrative de הוּא dans l’expression temporelle.
