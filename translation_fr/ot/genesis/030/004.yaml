    issue: La note traduit inexactement le tour hébreu par « entra vers elle ».
    rationale: Le verbe בוא suivi de אֶל signifie ici littéralement « venir/aller vers ». Dans ce contexte narratif, le tour est bien un euphémisme pour l’union sexuelle, mais « entrer » ne correspond pas au libellé hébreu.
  revised_text: Alors elle lui donna Bilha, sa servante, pour femme, et Jacob s’unit à elle[a].
