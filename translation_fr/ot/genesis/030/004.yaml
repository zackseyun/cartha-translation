  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: fr
  text: Alors elle lui donna Bilha, sa servante, pour femme, et Jacob s’unit à elle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « vint vers elle », expression discrète désignant ici l’union sexuelle.
    reason: idiomatic_clarification
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Alors elle donna
  rationale: Le waw consécutif fait progresser le récit; « Alors » exprime naturellement cette succession en français.
- source_word: לּוֹ
  choice: lui
  rationale: Le pronom prépositionnel marque le destinataire du don et se rend naturellement par « lui ».
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Translittération française usuelle du nom hébreu.
- source_word: שִׁפְחָתָהּ
  choice: sa servante
  rationale: שִׁפְחָה désigne une femme de condition servile et subordonnée; « servante » est clair, naturel et n’ajoute aucune précision d’âge.
- source_word: לְאִשָּׁה
  choice: pour femme
  rationale: La construction exprime ici une union conjugale ou concubinaire; « pour femme » conserve le langage relationnel du texte sans déterminer davantage son statut juridique.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: s’unit à elle
  rationale: L’expression hébraïque est un euphémisme conventionnel pour l’union sexuelle. Cette formulation française reste digne et compréhensible tout en explicitant modérément le sens idiomatique.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle et courante du nom.
theological_decisions:
- issue: Statut exact de Bilha dans l’expression לְאִשָּׁה
  choice: pour femme
  alternative: comme épouse / pour concubine
  rationale: L’hébreu emploie אִשָּׁה, « femme/épouse », tout en maintenant Bilha dans une condition servile. La traduction conserve cette tension sans imposer la catégorie plus précise de « concubine ».
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement narratif hébreu; l’euphémisme sexuel est rendu par une expression française naturelle, avec le tour littéral signalé en note.
