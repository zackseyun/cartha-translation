  source_fidelity: 'Le texte rend correctement la progression narrative, le don de Bilha à Jacob « pour femme », et l’euphémisme hébreu désignant l’union sexuelle. Toutefois, la note présente à tort le verbe hébreu comme signifiant littéralement « entra vers elle » : וַיָּבֹא אֵלֶיהָ signifie littéralement « vint vers elle » (ou « alla vers elle »), dans un emploi euphémistique contextuel.'
  naturalness: « Alors elle lui donna Bilha, sa servante, pour femme, et Jacob s’unit à elle » est un français moderne, clair et de registre digne. Le déplacement de l’appel de note avant le point suit l’usage typographique français courant.
  terminology: « Servante » et « pour femme » préservent convenablement, sans surinterprétation, le statut subordonné de Bilha et la formulation relationnelle du texte. « S’unit à elle » rend naturellement l’euphémisme sans imposer une qualification juridique ou doctrinale.
  issues:
