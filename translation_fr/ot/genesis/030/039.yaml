  text: וַ/יֶּחֱמ֥וּ הַ/צֹּ֖אן אֶל הַ/מַּקְל֑וֹת וַ/תֵּלַ֣דְןָ הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/טְלֻאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: fr
  text: Le troupeau s’accoupla devant les baguettes et mit bas des petits rayés[a], mouchetés et tachetés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « annelés »; certaines traductions traditionnelles ont « rayés de bandes ».
    reason: lexical_alternative
  - marker: b
    text: La distinction entre « mouchetés » (נְקֻדִּים) et « tachetés » (טְלֻאִים) est approximative; ce dernier terme peut aussi se rendre par « marbrés », « bigarrés » ou « tachés par plaques ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: s’accoupla
  rationale: Le verbe יחם évoque littéralement le fait d’entrer en chaleur; dans ce contexte d’élevage, « s’accoupler » exprime naturellement l’action reproductive sans confondre celle-ci avec la conception.
- source_word: הַצֹּאן
  choice: le troupeau
  rationale: צאן est un collectif désignant le petit bétail, notamment les moutons et les chèvres. « Le troupeau » en conserve le sens collectif et convient au verbe au singulier en français.
- source_word: אֶל הַמַּקְלוֹת
  choice: devant les baguettes
  rationale: אֶל signifie normalement « vers » ou « à », mais, dans le dispositif visuel décrit par le contexte, « devant les baguettes » rend clairement la relation spatiale sans affirmer un mécanisme causal.
- source_word: וַתֵּלַדְןָ
  choice: mit bas des petits
  rationale: ילד signifie « enfanter, mettre bas ». Le nom « petits », implicite en hébreu devant les adjectifs substantivés, est ajouté pour produire un français clair et naturel.
- source_word: עֲקֻדִּים
  choice: rayés
  rationale: Le terme décrit des marques en bandes ou en raies. « Rayés » est courant et compréhensible; « annelés » demeure une possibilité.
- source_word: נְקֻדִּים
  choice: mouchetés
  rationale: Le mot désigne des marques fines, en points ou petites taches. « Mouchetés » permet de le distinguer approximativement du terme suivant.
- source_word: וּטְלֻאִים
  choice: tachetés
  rationale: Le terme évoque des marques plus étendues, irrégulières ou en plaques. « Tachetés » est naturel, mais la distinction précise avec נְקֻדִּים reste incertaine.
theological_decisions:
- issue: Rapport entre les baguettes et l’accouplement
  choice: devant les baguettes
  alternative: près des baguettes / vers les baguettes
  rationale: La traduction conserve la scène décrite sans présenter les baguettes comme la cause explicitement affirmée de la reproduction ou des marques du pelage.
translation_notes:
  register: Français international actuel, sobre et narratif. Le singulier collectif « le troupeau » évite une formulation lourde, tandis que « mettre bas » appartient au vocabulaire courant de la reproduction animale. Les trois qualificatifs conservent autant que possible la succession des catégories de pelage en hébreu.
