  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֹּ֕אמֶר אָסַ֥ף אֱלֹהִ֖ים אֶת חֶרְפָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: fr
  text: 'Elle devint enceinte et mit au monde un fils. Elle dit : « Dieu a enlevé ma honte.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon déshonneur » ou « mon opprobre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: Elle devint enceinte
  rationale: Le verbe הרה exprime le fait de concevoir ou de devenir enceinte. Cette formulation est naturelle en français moderne et maintient la progression narrative.
- source_word: וַתֵּלֶד בֵּן
  choice: et mit au monde un fils
  rationale: ילד suivi de בֵּן indique qu’elle donne naissance à un fils. « Mit au monde » est actuel, digne et idiomatique.
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le wayyiqtol poursuit le récit. Une nouvelle phrase avec le pronom explicite est naturelle en français.
- source_word: אָסַף
  choice: a enlevé
  rationale: Dans ce contexte, אסף signifie faire disparaître ou ôter. Le passé composé conserve la portée résultative de l’action divine.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים est ici le sujet d’un verbe au singulier et désigne Dieu.
- source_word: חֶרְפָּתִי
  choice: ma honte
  rationale: חֶרְפָּה peut désigner la honte, le déshonneur ou l’opprobre. « Ma honte » est immédiatement compréhensible et convient à la dimension personnelle et sociale du contexte.
theological_decisions:
- issue: Sens singulier de אֱלֹהִים
  choice: Dieu
  alternative: les dieux
  rationale: L’accord verbal au singulier et le contexte imposent un référent singulier, sans qu’il soit nécessaire d’ajouter une précision théologique.
- issue: Dimension sociale de חֶרְפָּה
  choice: ma honte
  alternative: mon déshonneur / mon opprobre
  rationale: « Honte » rend clairement l’expérience vécue, tandis que la note signale des équivalents qui mettent davantage en relief le discrédit public lié à la stérilité dans le récit.
translation_notes:
  register: Français international moderne, narratif et digne. « Mit au monde » évite le tour plus littéraire « enfanta », et « honte » reste plus courant que « opprobre » tout en préservant le poids social du terme hébreu.
