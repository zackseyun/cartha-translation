  yaml_path: translation/ot/genesis/046/014.yaml
  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: fr
  text: 'Les fils de Zabulon : Séred, Élon et Yahleel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Yahleel est aussi transcrit Jahleel ou Jachleel.
    reason: Variantes de translittération du nom hébreu יַחְלְאֵל.
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Fils de
  rationale: Dans cette liste généalogique, le pluriel construit בְנֵי se rend naturellement par « fils de ». La conjonction initiale וּ relie l’entrée au contexte, mais n’exige pas ici un « et » en français, où l’enchaînement de la liste reste clair sans lui.
- source_word: זְבוּלֻן
  choice: Zabulon
  rationale: Nom propre rendu selon la forme biblique française usuelle.
- source_word: סֶרֶד
  choice: Séred
  rationale: Translittération française naturelle du nom propre hébreu, avec accents pour guider la prononciation.
- source_word: וְ/אֵלוֹן
  choice: Élon
  rationale: Le terme fonctionne ici comme nom de personne et non comme le nom commun « chêne ». La conjonction est rendue dans la coordination française finale.
- source_word: וְ/יַחְלְאֵל
  choice: Yahléel
  rationale: Translittération proche de l’hébreu, où le yod initial correspond naturellement à « Y » en français; la conjonction préfixée est rendue par « et ».
