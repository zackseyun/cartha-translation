  text: אֵ֚לֶּה בְּנֵ֣י זִלְפָּ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/לֵאָ֣ה בִתּ֑/וֹ וַ/תֵּ֤לֶד אֶת אֵ֨לֶּה֙ לְ/יַעֲקֹ֔ב שֵׁ֥שׁ עֶשְׂרֵ֖ה נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: fr
  text: 'Voici les fils de Zilpa, que Laban avait donnée à sa fille Léa. Elle les mit au monde pour Jacob : seize personnes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seize âmes ». En hébreu, le mot néfèsh est employé ici de manière idiomatique pour compter des personnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Le démonstratif introduit ici le récapitulatif d’une liste généalogique; « Voici » est naturel et fidèle à cette fonction présentative.
- source_word: בְּנֵי זִלְפָּה
  choice: les fils de Zilpa
  rationale: « Fils » rend directement בְּנֵי et conserve la formulation généalogique du texte hébreu; le nom propre est translittéré sous sa forme française courante.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: que Laban avait donnée à sa fille Léa
  rationale: Le relatif renvoie à Zilpa. Le plus-que-parfait clarifie naturellement en français que ce don avait précédé les naissances, sans ajouter d’information au texte.
- source_word: וַתֵּלֶד אֶת אֵלֶּה
  choice: Elle mit au monde … ces
  rationale: « Mettre au monde » exprime clairement le sens de ילד avec un sujet féminin. Le démonstratif reprend les personnes précédemment énumérées.
- source_word: לְיַעֲקֹב
  choice: pour Jacob
  rationale: Dans cette formule de naissance, la préposition לְ indique Jacob comme père; « pour Jacob » préserve cette relation sans suggérer que les enfants lui auraient été remis comme un don.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: ces seize personnes
  rationale: Dans un dénombrement généalogique, נֶפֶשׁ désigne idiomatiquement des personnes. Cette formulation est claire en français moderne, tandis que la traduction plus littérale est signalée en note.
