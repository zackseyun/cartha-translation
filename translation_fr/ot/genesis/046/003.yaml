  text: וַ/יֹּ֕אמֶר אָנֹכִ֥י הָ/אֵ֖ל אֱלֹהֵ֣י אָבִ֑י/ךָ אַל תִּירָא֙ מֵ/רְדָ֣ה מִצְרַ֔יְמָ/ה כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִֽׂימְ/ךָ֥ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: fr
  text: 'Il dit : « Je suis Dieu, le Dieu de ton père. N’aie pas peur de descendre en Égypte[a], car c’est là que je ferai de toi une grande nation. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne crains pas de descendre en Égypte. » L’hébreu emploie le verbe « craindre » avec un infinitif.'
    reason: alternative lexicale et précision syntaxique
lexical_decisions:
- source_word: הָאֵל
  choice: Dieu
  rationale: Dans l’affirmation « Je suis Dieu », cette formulation française rend naturellement l’identification solennelle et emphatique du locuteur, tandis que « le Dieu » serait peu idiomatique après « je suis ».
- source_word: אֱלֹהֵי אָבִיךָ
  choice: le Dieu de ton père
  rationale: Cette traduction suit directement la chaîne construite hébraïque et conserve le singulier « ton père », qui rattache la parole divine à la lignée ancestrale de Jacob.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Cette tournure courante et digne exprime naturellement en français moderne l’interdiction de craindre.
- source_word: מֵרְדָה
  choice: de descendre
  rationale: Le verbe « descendre » préserve l’expression géographique hébraïque liée au déplacement vers l’Égypte, sans la réduire au simple fait d’y aller.
- source_word: מִצְרַיְמָה
  choice: en Égypte
  rationale: La terminaison directionnelle marque un mouvement vers l’Égypte ; après « descendre », « en Égypte » est la formulation française idiomatique.
- source_word: לְגוֹי גָּדוֹל
  choice: une grande nation
  rationale: 'Avec le verbe שׂים et la préposition לְ, l’expression indique le résultat : Jacob sera constitué en grande nation.'
- source_word: אֲשִׂימְךָ
  choice: je ferai de toi
  rationale: Dans cette construction résultative, « faire de quelqu’un » rend clairement le sens de constituer ou transformer, plutôt que le sens concret de placer.
- source_word: שָׁם
  choice: c’est là que
  rationale: La tournure met naturellement en relief le lieu indiqué, l’Égypte, comme l’endroit où la promesse s’accomplira.
theological_decisions:
- issue: Désignation ancestrale dans l’auto-identification divine
  choice: le Dieu de ton père
  alternative: le Dieu de tes pères
  rationale: Le singulier du texte hébreu est conservé afin de ne pas élargir interprétativement la référence et de maintenir le lien ancestral immédiat donné dans la parole adressée à Jacob.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse divine singulière. « Descendre en Égypte » conserve l’image géographique de l’hébreu, tandis que « c’est là que » restitue clairement l’accent porté sur le lieu de l’accomplissement.
