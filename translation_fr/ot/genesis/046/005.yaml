  text: וַ/יָּ֥קָם יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יִּשְׂא֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת יַעֲקֹ֣ב אֲבִי/הֶ֗ם וְ/אֶת טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם בָּ/עֲגָל֕וֹת אֲשֶׁר שָׁלַ֥ח פַּרְעֹ֖ה לָ/שֵׂ֥את אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: fr
  text: Jacob partit donc de Beer-Shéba[a], et les fils d’Israël transportèrent Jacob, leur père, ainsi que leurs jeunes enfants et leurs femmes, dans les chariots que le pharaon avait envoyés pour le transporter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « se leva de Beer-Shéba »; dans ce contexte de voyage, l’expression signifie qu’il en partit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: partit
  rationale: Le verbe signifie littéralement « se leva », mais avec מִן suivi d’un lieu, il marque idiomatiquement le départ. « Partit » est naturel et précis en français moderne.
- source_word: מִבְּאֵר שָׁבַע
  choice: de Beer-Shéba
  rationale: La préposition מִן indique le point de départ; « Beer-Shéba » est une graphie française courante du toponyme.
- source_word: וַיִּשְׂאוּ
  choice: transportèrent
  rationale: נשׂא signifie porter ou transporter. Puisque les personnes voyagent dans des chariots, « transportèrent » évite de suggérer qu’elles étaient portées à bras.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Dans ce contexte immédiat, l’expression désigne les fils masculins de Jacob, appelé Israël, et non l’ensemble du peuple.
- source_word: אֲבִיהֶם
  choice: leur père
  rationale: Traduction directe de la construction possessive renvoyant à Jacob.
- source_word: טַפָּם
  choice: leurs jeunes enfants
  rationale: טַף désigne particulièrement les petits enfants, parfois plus largement les personnes à charge. « Jeunes enfants » conserve ici la nuance familiale sans archaïsme.
- source_word: נְשֵׁיהֶם
  choice: leurs femmes
  rationale: Dans ce contexte familial, le terme désigne les épouses; « leurs femmes » est idiomatique en français international.
- source_word: בָּעֲגָלוֹת
  choice: dans les chariots
  rationale: עֲגָלוֹת désigne des chariots ou voitures destinés au transport. « Dans les chariots » rend naturellement la préposition et la scène.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: que le pharaon avait envoyés
  rationale: Le plus-que-parfait explicite naturellement en français que l’envoi des chariots précède leur utilisation, sans ajouter de contenu.
- source_word: לָשֵׂאת אֹתוֹ
  choice: pour le transporter
  rationale: L’infinitif exprime le but; le pronom masculin singulier renvoie le plus naturellement à Jacob.
theological_decisions: []
