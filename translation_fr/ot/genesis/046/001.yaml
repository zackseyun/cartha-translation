id: GEN.46.1
reference: Genesis 46:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּסַּ֤ע יִשְׂרָאֵל֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּבֹ֖א בְּאֵ֣רָ/ה שָּׁ֑בַע וַ/יִּזְבַּ֣ח זְבָחִ֔ים לֵ/אלֹהֵ֖י אָבִ֥י/ו יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: fr
  text: Israël partit avec tout ce qui lui appartenait[a] et arriva à Beer-Shéba. Là, il offrit des sacrifices au Dieu de son père Isaac.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec tout ce qu’il avait ». L’expression hébraïque peut désigner largement tout ce qui relevait de lui, y compris sa maisonnée et ses biens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: partit
  rationale: Dans ce récit de voyage, נסע désigne le fait de lever le camp et de se mettre en route. « Partit » l’exprime naturellement en français moderne.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie ici le nom Israël, qui est conservé plutôt que remplacé par Jacob.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: avec tout ce qui lui appartenait
  rationale: La formule a une portée large et peut englober la maisonnée aussi bien que les biens. Cette traduction préserve cette ampleur sans préciser davantage que l’hébreu.
- source_word: וַיָּבֹא
  choice: arriva
  rationale: Avec un lieu de destination, « arriva à » rend naturellement בוא et marque l’aboutissement de cette étape du voyage.
- source_word: בְּאֵרָה שָּׁבַע
  choice: à Beer-Shéba
  rationale: La terminaison directionnelle est rendue par la préposition « à ». « Beer-Shéba » est une translittération française courante du nom de lieu.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: il offrit des sacrifices
  rationale: La construction hébraïque associe un verbe et un nom de même racine. « Offrit des sacrifices » en restitue le sens de manière idiomatique sans reproduire lourdement la répétition.
- source_word: לֵאלֹהֵי
  choice: au Dieu de
  rationale: La préposition ל marque ici le destinataire des sacrifices ; « au Dieu de » convient naturellement au contexte cultuel.
- source_word: אָבִיו יִצְחָק
  choice: son père Isaac
  rationale: La construction identifie précisément Isaac comme le père d’Israël, sans nécessiter d’ajout explicatif.
theological_decisions:
- issue: La désignation précise « le Dieu de son père Isaac »
  choice: Conserver la référence spécifique à Isaac
  alternative: le Dieu de ses pères
  rationale: L’hébreu nomme expressément Isaac et non l’ensemble des patriarches. Cette formulation maintient le lien narratif particulier avec Isaac et Beer-Shéba sans généralisation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Là » est ajouté comme articulation idiomatique pour éviter une coordination pesante, sans modifier le lieu ni la succession des actions. Le nom divin et la désignation patriarcale restent aussi précis que dans l’hébreu.
