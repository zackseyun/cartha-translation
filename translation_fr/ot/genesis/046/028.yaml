  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: fr
  text: Il envoya Juda en avant de lui, auprès de Joseph, pour lui indiquer le chemin vers Goshen[a]. Puis ils arrivèrent au pays de Goshen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé et la construction est ambiguë. On peut aussi comprendre : « afin d’obtenir de lui des indications pour l’arrivée à Goshen » ou « afin de préparer, avant son arrivée, le chemin vers Goshen ».'
    reason: 'La construction לְהוֹרֹת לְפָנָיו est disputée : le verbe peut signifier instruire, diriger ou indiquer, et les rôles implicites ainsi que la fonction de « devant lui » ne sont pas explicités.'
lexical_decisions:
- source_word: שָׁלַח
  choice: envoya
  rationale: Le verbe courant « envoyer » rend naturellement le qal dans ce récit.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Dans ce contexte, l’expression indique que Juda part en avant de Jacob; la formulation conserve aussi l’image spatiale de l’hébreu.
- source_word: לְהוֹרֹת
  choice: indiquer le chemin
  rationale: Le hifil de ירה peut signifier « instruire », « diriger » ou « indiquer ». Dans le contexte d’un déplacement vers Goshèn, « indiquer le chemin » exprime concrètement cette orientation sans introduire l’idée plus précise de préparatifs.
- source_word: גֹּשְׁנָה
  choice: vers Goshèn
  rationale: Le hé directionnel marque un mouvement en direction de Goshèn; « vers » le rend clairement en français.
- source_word: וַיָּבֹאוּ
  choice: Puis ils arrivèrent
  rationale: « Arrivèrent » exprime idiomatiquement l’aboutissement du déplacement marqué par בוא, tandis que « puis » assure l’enchaînement narratif.
- source_word: אַרְצָה גֹּשֶׁן
  choice: au pays de Goshèn
  rationale: La formulation conserve la désignation territoriale אֶרֶץ et rend naturellement le mouvement jusqu’à cette région.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: Juda / Joseph / Goshèn
  rationale: Les noms de personnes et de lieu sont translittérés selon les formes françaises usuelles du projet.
