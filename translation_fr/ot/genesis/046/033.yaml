  text: וְ/הָיָ֕ה כִּֽי יִקְרָ֥א לָ/כֶ֖ם פַּרְעֹ֑ה וְ/אָמַ֖ר מַה מַּעֲשֵׂי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/033.yaml
  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: fr
  text: 'Quand le pharaon vous appellera et vous dira : « Quel est votre métier ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette tournure hébraïque introduit ici une éventualité future attendue. « Quand » la rend naturellement en français sans conserver artificiellement « il arrivera que ».
- source_word: יִקְרָא לָכֶם
  choice: vous appellera
  rationale: Le verbe קרא construit avec ל peut signifier appeler ou convoquer. « Vous appellera » reste proche de l’hébreu et convient au contexte de la cour.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: En français courant, le titre prend normalement l’article défini lorsqu’il désigne le souverain égyptien.
- source_word: וְאָמַר
  choice: et vous demandera
  rationale: Le sens lexical premier est « dire », mais la parole qui suit est explicitement interrogative. « Demandera » produit un français naturel tout en exprimant fidèlement l’acte de parole dans ce contexte.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Quel est votre métier ?
  rationale: Littéralement, l’expression porte sur le travail ou l’activité des interlocuteurs. Dans ce contexte, « métier » désigne clairement leur occupation professionnelle en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le futur simple conserve la perspective future du discours de Joseph. La formulation est concise et directement compréhensible.
