  text: וּ/בְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֧ל וְ/יָמִ֛ין וְ/אֹ֖הַד וְ/יָכִ֣ין וְ/צֹ֑חַר וְ/שָׁא֖וּל בֶּן הַֽ/כְּנַעֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: fr
  text: 'Les fils de Siméon : Yemouel[a], Yamin, Ohad, Yakin, Tsohar et Shaoul, fils de la Cananéenne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits samaritains et 1 Chroniques 4.24 portent « Nemouel »; voir aussi Nombres 26.12.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le waw coordonne cet élément au reste de la généalogie; en français, la continuité de la liste est naturellement portée par le contexte sans qu’il soit nécessaire d’ajouter « Et ».
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française biblique usuelle du nom propre.
- source_word: יְמוּאֵל
  choice: Yemouel
  rationale: Translittération française transparente du nom hébreu, notamment de sa consonne initiale.
- source_word: וְיָמִין
  choice: Yamin
  rationale: Translittération naturelle en français du nom propre hébreu.
- source_word: וְאֹהַד
  choice: Ohad
  rationale: Translittération directe du nom propre.
- source_word: וְיָכִין
  choice: Yakin
  rationale: Translittération française lisible qui représente la consonne initiale hébraïque sans recourir au « J » anglais.
- source_word: וְצֹחַר
  choice: Tsohar
  rationale: La graphie « Ts » rend naturellement en français la consonne צ et distingue ce nom d’une translittération fondée sur l’usage anglais.
- source_word: וְשָׁאוּל
  choice: et Shaoul
  rationale: « Shaoul » reflète directement la forme hébraïque שָׁאוּל et se lit naturellement en français.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: fils de la Cananéenne
  rationale: Le gentilé hébreu est féminin singulier et défini. « La Cananéenne » préserve clairement ce genre dans une formulation française concise et naturelle.
