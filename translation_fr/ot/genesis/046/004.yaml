  text: אָנֹכִ֗י אֵרֵ֤ד עִמְּ/ךָ֙ מִצְרַ֔יְמָ/ה וְ/אָנֹכִ֖י אַֽעַלְ/ךָ֣ גַם עָלֹ֑ה וְ/יוֹסֵ֕ף יָשִׁ֥ית יָד֖/וֹ עַל עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: fr
  text: Moi-même, je descendrai avec toi en Égypte, et moi-même, je te ferai aussi assurément remonter ; Joseph posera sa main sur tes yeux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement dit, probablement : « Joseph te fermera les yeux », geste accompli après la mort.'
    reason: Explication de l’expression concrète hébraïque désignant probablement la fermeture des yeux d’un défunt.
lexical_decisions:
- source_word: אָנֹכִי
  choice: Moi-même, je
  rationale: Le pronom indépendant, répété dans le verset, est emphatique. « Moi-même, je » en conserve naturellement l’insistance en français.
- source_word: אֵרֵד
  choice: je descendrai
  rationale: Le verbe ירד exprime la descente. Le français biblique courant emploie naturellement « descendre » pour le voyage vers l’Égypte.
- source_word: עִמְּךָ
  choice: avec toi
  rationale: La préposition comitative avec suffixe masculin singulier est rendue directement.
- source_word: מִצְרַיְמָה
  choice: en Égypte
  rationale: Le ה directionnel indique un mouvement vers l’Égypte ; « en Égypte » est la tournure française naturelle après « descendre ».
- source_word: אַעַלְךָ
  choice: je te ferai … remonter
  rationale: Le hiphil de עלה est causatif. « Faire remonter » maintient à la fois la causalité et le mouvement ascendant sans préciser la manière dont la promesse s’accomplira.
- source_word: גַם עָלֹה
  choice: assurément
  rationale: L’infinitif absolu renforce la promesse, tandis que גם ajoute une valeur de confirmation ou d’addition dans le contexte. « Assurément », avec la coordination précédente, restitue l’insistance sans produire une tournure française pesante.
- source_word: וְיוֹסֵף
  choice: Joseph
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: posera sa main sur tes yeux
  rationale: La formulation conserve l’image concrète de l’hébreu et la préposition « sur », tout en laissant la note expliquer l’usage lié à la mort.
theological_decisions:
- issue: Portée de la promesse « je te ferai remonter »
  choice: La traduction garde une promesse concise adressée personnellement à Jacob sans en préciser le mode d’accomplissement.
  alternative: Expliciter soit le retour du corps de Jacob pour son ensevelissement en Canaan, soit la remontée future de ses descendants lors de l’exode.
  rationale: L’hébreu peut évoquer plusieurs dimensions de l’accomplissement. Les préciser dans le texte résoudrait une tension que la formulation source laisse ouverte.
- issue: Sens du geste de Joseph sur les yeux de Jacob
  choice: Conserver l’image littérale dans le texte et expliquer en note qu’elle désigne vraisemblablement la fermeture des yeux après la mort.
  alternative: Traduire directement « Joseph te fermera les yeux ».
  rationale: Le rendu concret respecte la forme hébraïque, tandis que la note donne au lecteur le sens idiomatique probable sans l’imposer comme seule formulation possible.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse divine singulière à Jacob. La répétition « Moi-même, je » préserve l’emphase du pronom hébreu ; le point-virgule maintient la progression solennelle de la promesse.
