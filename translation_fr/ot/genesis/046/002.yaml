  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: fr
  text: 'Dieu parla à Israël dans des visions de la nuit et dit : « Jacob, Jacob. » Il dit : « Me voici. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: parla / dit / répondit
  rationale: Le verbe אמר signifie fondamentalement « dire ». « Parla » convient naturellement à la première proposition en français, « dit » introduit l’appel direct, et « répondit » explicite la fonction du dernier emploi dans le dialogue sans en modifier le sens.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le Dieu unique et s’emploie avec un sens singulier.
- source_word: לְיִשְׂרָאֵל
  choice: à Israël
  rationale: Le texte nomme explicitement le patriarche « Israël » dans la narration; ce nom est conservé plutôt que remplacé par « Jacob ».
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: dans des visions de la nuit
  rationale: Cette formulation conserve le pluriel de מַרְאֹת et le complément הַלַּיְלָה, tout en restant claire et digne en français moderne.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: Jacob ! Jacob !
  rationale: La répétition du nom est intégralement conservée; les points d’exclamation rendent naturellement l’appel direct en français sans ajouter de contenu.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: « Me voici » est l’équivalent français usuel de cette formule de disponibilité et de réponse à un appel.
theological_decisions:
- issue: Alternance entre les noms Israël et Jacob
  choice: Conserver « Israël » dans la narration et « Jacob » dans l’appel divin
  alternative: Uniformiser le nom en employant uniquement « Jacob » ou uniquement « Israël »
  rationale: L’alternance appartient au texte hébreu et peut avoir une portée littéraire ou théologique; la traduction la préserve sans l’expliquer ni l’harmoniser.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination « parla… et dit » maintient les deux emplois successifs de וַיֹּאמֶר sans effacer la structure du texte source.
