- from: 'Ce sont là les fils de Bilha, que Laban avait donnée à Rachel, sa fille. Elle donna ces fils à Jacob : sept personnes en tout[a].'
  to: 'Ce sont les fils de Bilha, que Laban avait donnée à sa fille Rachel. Bilha les enfanta à Jacob : sept personnes en tout[a].'
  rationale: La révision restitue directement le verbe hébreu de naissance, clarifie que Bilha est la mère, et conserve le total de sept personnes. La note explique l’idiome de dénombrement tout en respectant le singulier grammatical de נֶפֶשׁ.
