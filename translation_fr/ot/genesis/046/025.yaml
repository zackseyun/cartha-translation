  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: fr
  text: 'Ce sont les fils de Bilha, que Laban avait donnée à sa fille Rachel. Bilha les enfanta à Jacob : sept personnes en tout[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « toute personne : sept »; expression de dénombrement signifiant qu’elles étaient sept en tout.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: Ce sont là les fils de Bilha
  rationale: La tournure identificatrice française restitue naturellement le démonstratif אֵלֶּה; « fils » correspond au masculin בְּנֵי dans cette liste généalogique.
- source_word: אֲשֶׁר נָתַן לָבָן
  choice: que Laban avait donnée
  rationale: Le relatif renvoie à Bilha. Le plus-que-parfait présente naturellement en français cette information d’arrière-plan; le participe passé féminin s’accorde avec Bilha.
- source_word: לְרָחֵל בִּתּוֹ
  choice: à Rachel, sa fille
  rationale: La préposition לְ marque ici le destinataire du don, et le suffixe de בִּתּוֹ renvoie à Laban.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: Elle donna ces fils à Jacob
  rationale: Cette formulation française courante conserve Bilha comme sujet maternel et Jacob comme père, tout en explicitant le référent masculin pluriel de אֵלֶּה.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: sept personnes en tout
  rationale: נֶפֶשׁ désigne ici des personnes comptées; la formulation rend l’idiome hébreu sans suggérer que seules des âmes désincarnées seraient concernées.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. Deux phrases évitent que le sujet féminin de « elle donna » puisse être confondu avec Rachel, nom immédiatement précédent. Le marqueur de note est placé sur l’expression qu’il explique.
