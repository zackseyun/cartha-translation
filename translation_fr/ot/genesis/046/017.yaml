base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: fr
  text: 'Les fils d’Aser : Yimna[a], Yishva, Yishvi et Beria ; et Sérah[b], leur sœur. Les fils de Beria : Héber et Malkiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yimna est aussi traditionnellement transcrit « Jimna » dans certaines traductions.
    reason: lexical_alternative
  - marker: b
    text: Sérah peut aussi être transcrit « Sérach » dans certaines traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: Les fils d’Aser
  rationale: Dans cette généalogie, בְּנֵי désigne les fils. La conjonction initiale peut naturellement rester implicite en français dans une entrée de liste.
- source_word: יִמְנָה
  choice: Yimna
  rationale: Translittération française proche de la forme hébraïque, avec yod initial rendu par « Y ».
- source_word: וְיִשְׁוָה
  choice: Yishva
  rationale: Translittération directe adaptée aux conventions graphiques françaises ; la conjonction est intégrée à l’énumération.
- source_word: וְיִשְׁוִי
  choice: Yishvi
  rationale: Translittération directe du nom hébreu, distincte de Yishva.
- source_word: וּבְרִיעָה
  choice: et Beria
  rationale: Le nom est translittéré sans h final non prononcé ; la conjonction marque naturellement le dernier élément de la série.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: et leur sœur Sérah
  rationale: Rend littéralement l’apposition hébraïque « et Sérah, leur sœur », sans ajouter de copule absente du texte.
- source_word: וּבְנֵי בְרִיעָה
  choice: Les fils de Beria
  rationale: Ouvre clairement la sous-liste généalogique. La coordination hébraïque est rendue par l’enchaînement naturel de deux phrases françaises.
- source_word: חֶבֶר
  choice: Héber
  rationale: Forme française traditionnelle et reconnaissable de ce nom propre.
- source_word: וּמַלְכִּיאֵל
  choice: et Malkiel
  rationale: Translittération proche de l’hébreu מַלְכִּיאֵל ; la conjonction est conservée entre les deux noms.
