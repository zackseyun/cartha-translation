  text: וְ/אֵ֨לֶּה שְׁמ֧וֹת בְּנֵֽי יִשְׂרָאֵ֛ל הַ/בָּאִ֥ים מִצְרַ֖יְמָ/ה יַעֲקֹ֣ב וּ/בָנָ֑י/ו בְּכֹ֥ר יַעֲקֹ֖ב רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: fr
  text: 'Voici les noms des fils d’Israël qui vinrent en Égypte : Jacob et ses fils[a]. Le premier-né de Jacob était Ruben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La formulation hébraïque peut aussi être ponctuée comme une apposition : « qui vinrent en Égypte, Jacob et ses fils »; l’hébreu ancien ne comporte pas la ponctuation moderne.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Dans une introduction généalogique, « Voici » rend naturellement la valeur présentative de l’expression hébraïque. La conjonction וְ n’a pas besoin d’être traduite séparément en français courant.
- source_word: שְׁמוֹת
  choice: les noms
  rationale: Traduction directe du pluriel construit, qui introduit ici une liste généalogique.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Le contexte immédiat énumère les fils de Jacob; « fils » est donc plus précis que « enfants » ou « descendants ». « Israël » désigne ici Jacob sous son autre nom.
- source_word: הַבָּאִים
  choice: qui vinrent
  rationale: Le participe désigne ceux qui se rendirent en Égypte. Le passé simple convient au registre narratif et généalogique tout en restant clair.
- source_word: מִצְרַיְמָה
  choice: en Égypte
  rationale: La terminaison directionnelle exprime un mouvement vers l’Égypte; en français, « venir en Égypte » est idiomatique.
- source_word: יַעֲקֹב וּבָנָיו
  choice: Jacob et ses fils
  rationale: L’expression précise, en apposition, l’identité du groupe arrivé en Égypte. Les deux-points rendent cette précision lisible sans la transformer en proposition indépendante.
- source_word: בְּכֹר יַעֲקֹב
  choice: Le premier-né de Jacob
  rationale: La construction marque le rang de naissance. « Premier-né » conserve la formulation généalogique et sa portée potentielle au-delà de la simple chronologie.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française usuelle du nom biblique.
