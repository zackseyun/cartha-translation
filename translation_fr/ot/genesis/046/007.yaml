base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: fr
  text: Ses fils et ses petits-fils avec lui, ses filles et ses petites-filles[a], ainsi que toute sa descendance, il les emmena avec lui en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de ses fils » et « les filles de ses fils ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le terme désigne ici les descendants masculins, distingués ensuite des filles.
- source_word: וּבְנֵי בָנָיו
  choice: et ses petits-fils
  rationale: Littéralement « les fils de ses fils » ; « petits-fils » en donne naturellement le sens généalogique en français.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: Rend directement l’idée d’accompagnement.
- source_word: בְּנֹתָיו
  choice: ses filles
  rationale: Traduction précise des descendantes féminines, mises en parallèle avec les fils.
- source_word: וּבְנוֹת בָּנָיו
  choice: et ses petites-filles
  rationale: Littéralement « les filles de ses fils » ; « petites-filles » est l’équivalent français naturel.
- source_word: וְכָל זַרְעוֹ
  choice: ainsi que toute sa descendance
  rationale: Dans ce contexte familial, זֶרַע désigne collectivement l’ensemble de ses descendants ; « descendance » est naturel et digne.
- source_word: הֵבִיא
  choice: il les emmena
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Avec un déplacement dont le sujet fait lui-même partie, « emmener » est idiomatique en français ; le pronom « les » explicite l’objet antéposé déjà présent en hébreu.
- source_word: מִצְרָיְמָה
  choice: en Égypte
  rationale: La terminaison directive marque le mouvement vers l’Égypte ; « en Égypte » est la formulation française habituelle avec un verbe de déplacement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La reprise par « il les emmena » conserve la structure emphatique de l’hébreu, où toute la famille est énumérée avant le verbe.
