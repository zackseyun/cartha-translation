  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: fr
  text: 'Et les fils de Gad : Tsiphion[a], Hagui, Shouni, Etsbôn, Éri, Arodi et Areéli.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici Tsiphion ; en Nombres 26.15, le nom apparaît sous la forme Tsephôn.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le pluriel construit בְּנֵי désigne ici les « fils de » dans une liste généalogique. Le ו initial relie ce verset à la liste précédente, mais il n’est pas nécessaire de le rendre par « et » en tête de phrase en français courant.
- source_word: גָד
  choice: Gad
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: צִפְיוֹן
  choice: Tsiphion
  rationale: Translittération française de la forme massorétique propre à ce verset, qui comporte une syllabe médiane absente de la forme צְפוֹן en Nombres 26.15.
- source_word: וְחַגִּי
  choice: Hagui
  rationale: Translittération adaptée à l’orthographe française ; « gu » préserve le son dur de ג devant i.
- source_word: שׁוּנִי
  choice: Shouni
  rationale: Translittération française directe du nom hébreu.
- source_word: וְאֶצְבֹּן
  choice: Etsbôn
  rationale: Translittération française du nom propre, avec « ts » pour צ et l’accent circonflexe marquant la voyelle longue conventionnelle.
- source_word: עֵרִי
  choice: Éri
  rationale: Translittération française naturelle du nom propre.
- source_word: וַאֲרוֹדִי
  choice: Arodi
  rationale: Translittération directe du nom hébreu ; la conjonction est rendue par la ponctuation de la liste.
- source_word: וְאַרְאֵלִי
  choice: Areéli
  rationale: Translittération française reflétant les voyelles de la forme hébraïque ; la conjonction est rendue par « et » avant le dernier élément.
theological_decisions: []
translation_notes:
  register: Phrase généalogique concise, en français moderne et digne. Les noms sont translittérés selon des conventions françaises plutôt que repris sous leurs graphies anglaises. La ponctuation rend naturellement les conjonctions répétées de l’hébreu.
