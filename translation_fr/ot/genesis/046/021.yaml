base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: fr
  text: 'Les fils de Benjamin : Béla, Béker, Ashbel, Guéra, Naamân, Éhi[a], Rosh, Mouppim[b], Houppim et Ard[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En Nombres 26.38, une généalogie parallèle de Benjamin donne « Ahiram » là où ce verset porte « Éhi ».
    reason: cross_reference
  - marker: b
    text: Certaines traditions généalogiques parallèles présentent une variante, telle que « Shouppim », au lieu de « Mouppim » ; la traduction suit ici le texte massorétique.
    reason: textual_variant
  - marker: c
    text: En 1 Chroniques 8.3, une généalogie de Benjamin présente la forme apparentée « Addar » ; ce verset porte « Ard ».
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: Les fils de Benjamin étaient
  rationale: Le construit pluriel introduit les membres de la liste. En français, « étaient » permet d’intégrer naturellement l’énumération, tandis que l’absence de « et » initial évite une coordination lourde sans perdre la continuité généalogique du contexte.
- source_word: בֶּלַע
  choice: Béla
  rationale: Transcription française usuelle du nom propre, avec accents facilitant une prononciation proche de l’hébreu.
- source_word: בֶּכֶר
  choice: Béker
  rationale: Transcription directe de la forme hébraïque, conforme aux conventions phonétiques du français.
- source_word: אַשְׁבֵּל
  choice: Ashbel
  rationale: Transcription du nom propre conservant clairement ses consonnes hébraïques.
- source_word: גֵּרָא
  choice: Guéra
  rationale: Transcription française qui maintient le g dur devant é.
- source_word: נַעֲמָן
  choice: Naamân
  rationale: Forme française reconnaissable qui distingue les deux voyelles et marque l’accentuation traditionnelle.
- source_word: אֵחִי
  choice: Éhi
  rationale: La forme du texte massorétique est transcrite telle quelle plutôt que remplacée par le nom différent d’une généalogie parallèle.
- source_word: רֹאשׁ
  choice: Rosh
  rationale: Dans cette liste, le terme fonctionne comme un nom propre; il est donc transcrit et non traduit par « tête » ou « chef ».
- source_word: מֻפִּים
  choice: Mouppim
  rationale: Transcription française de la forme précise du texte massorétique; les variantes des listes parallèles ne sont pas introduites dans le corps du texte.
- source_word: חֻפִּים
  choice: Houppim
  rationale: Transcription française de la forme massorétique.
- source_word: אָרְדְּ
  choice: Ard
  rationale: Transcription de la leçon du présent verset, sans l’harmoniser avec une forme apparentée dans une autre généalogie.
