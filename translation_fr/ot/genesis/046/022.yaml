  text: 'These were the sons of Rachel who were born to Jacob: fourteen persons in all[a].'
translation:
  language: fr
  text: 'Voici les fils de Rachel qui naquirent à Jacob : quatorze personnes en tout[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « toute personne, quatorze » ; cette tournure indique que le nombre total de personnes était de quatorze.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Tels furent
  rationale: Introduit naturellement en français une récapitulation généalogique dans un récit au passé, tout en conservant la valeur démonstrative de l’hébreu.
- source_word: בְּנֵי רָחֵל
  choice: les fils de Rachel
  rationale: Reproduit le sens direct du syntagme construit hébreu et sa forme masculine dans cette généalogie.
- source_word: אֲשֶׁר יֻלַּד
  choice: qui naquirent
  rationale: Rend idiomatiquement en français moderne le passif de ילד; l’accord au pluriel suit le sujet collectif « les fils ».
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: La préposition לְ exprime ici la relation de filiation; « naître à quelqu’un » est une formulation généalogique française digne et intelligible.
- source_word: כָּל נֶפֶשׁ
  choice: personnes en tout
  rationale: Dans ce contexte de dénombrement, נֶפֶשׁ désigne des personnes. Cette formulation transmet clairement la valeur totalisante sans suggérer un sens technique de « l’âme ».
- source_word: אַרְבָּעָה עָשָׂר
  choice: quatorze
  rationale: Rend directement le nombre cardinal hébreu.
