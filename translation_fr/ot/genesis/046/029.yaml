base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: fr
  text: Alors Joseph attela son char et monta à la rencontre d’Israël, son père, en Goshèn. Il se présenta devant lui[a], se jeta à son cou et y pleura longtemps[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il lui apparut » ou « il se montra à lui ». Le verbe hébreu peut être traduit plus formellement, mais il indique probablement ici que Joseph se présenta devant son père lors de leurs retrouvailles.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il pleura encore à son cou ». Le dernier mot hébreu peut signifier « encore », « toujours » ou « davantage » ; dans ce contexte, il suggère que Joseph continua de pleurer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: attela
  rationale: Le verbe signifie fondamentalement « lier » ; avec un char pour complément, il désigne le fait de l’atteler ou de le préparer pour le déplacement. « Attela » conserve concrètement l’image hébraïque.
- source_word: מֶרְכַּבְתּוֹ
  choice: son char
  rationale: Le nom désigne ici le char de Joseph ; « son char » est la formulation française directe et naturelle.
- source_word: וַיַּעַל
  choice: monta
  rationale: Le verbe עלה signifie couramment « monter ». Cette traduction préserve le mouvement exprimé par l’hébreu, même si le récit ne précise pas le relief concerné.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: La construction exprime le but du déplacement de Joseph. « Aller à la rencontre de » est idiomatique en français et convient à cette scène de retrouvailles.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: Israël, son père
  rationale: Le texte emploie le nom Israël, qui doit être conservé plutôt que remplacé par Jacob. L’apposition française explicite naturellement la relation.
- source_word: גֹּשְׁנָה
  choice: en Goshèn
  rationale: Le suffixe directionnel indique un mouvement vers Goshèn, tandis que l’ensemble de la proposition situe la rencontre dans cette région. « En Goshèn » donne en français une localisation naturelle sans nier le déplacement.
- source_word: וַיֵּרָא אֵלָיו
  choice: Il se présenta devant lui
  rationale: Le nifal de ראה signifie ici que Joseph se rend visible à son père. « Se présenta devant lui » exprime clairement la rencontre personnelle, tout en laissant en note la traduction plus formelle.
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: se jeta à son cou
  rationale: Cette expression hébraïque décrit une étreinte chargée d’émotion. « Se jeter au cou de quelqu’un » est son équivalent français naturel et vivant.
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו
  choice: y pleura
  rationale: Le pronom « y » reprend « à son cou » sans une répétition pesante, tout en maintenant le lien physique entre l’étreinte et les pleurs.
- source_word: עוֹד
  choice: longtemps
  rationale: Dans ce contexte, l’adverbe indique que Joseph continua de pleurer. « Longtemps » rend naturellement en français la durée suggérée, tandis que la note conserve les possibilités plus littérales.
theological_decisions: []
