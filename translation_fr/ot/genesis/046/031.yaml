base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: fr
  text: 'Alors Joseph dit à ses frères et à la maisonnée de son père[a] : « Je vais monter auprès du pharaon pour l’informer, et je lui dirai : “Mes frères et la maisonnée de mon père, qui étaient au pays de Canaan, sont venus auprès de moi.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison de son père ». Ici, cette expression désigne la maisonnée, le groupe familial, plutôt que l’habitation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors Joseph dit
  rationale: Le waw consécutif fait progresser le récit; « Alors » exprime naturellement cette succession en français.
- source_word: אֶל אֶחָיו
  choice: à ses frères
  rationale: Dans le contexte, אַח désigne précisément les frères de Joseph.
- source_word: וְאֶל בֵּית אָבִיו
  choice: et à toute la famille de son père
  rationale: בֵּית אָב désigne ici le groupe familial plutôt qu’un bâtiment; « toute la famille » rend ce sens collectif en français courant.
- source_word: אֶעֱלֶה
  choice: Je vais monter
  rationale: Le verbe עלה signifie littéralement « monter »; cette orientation est conservée sans lourdeur en français.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: informer le pharaon
  rationale: Le hiphil de נגד signifie faire savoir, annoncer ou informer; « informer » convient à l’entretien officiel envisagé.
- source_word: וְאֹמְרָה אֵלָיו
  choice: et lui dire
  rationale: La formulation conserve l’action distincte que Joseph projette d’accomplir après avoir informé le pharaon.
- source_word: אַחַי
  choice: Mes frères
  rationale: Le terme renvoie aux frères de Joseph et se traduit directement ainsi.
- source_word: וּבֵית אָבִי
  choice: et toute la famille de mon père
  rationale: Comme dans la première occurrence, בֵּית אָבִי désigne l’unité familiale; la même traduction maintient la cohérence.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: qui étaient au pays de Canaan
  rationale: L’hébreu n’exprime pas la copule; l’imparfait français situe naturellement leur résidence antérieure par rapport à leur arrivée.
- source_word: בָּאוּ אֵלַי
  choice: sont venus me rejoindre
  rationale: Le parfait décrit une arrivée accomplie et pertinente au moment où Joseph parle. « Me rejoindre » rend idiomatiquement la venue auprès de lui sans changer le mouvement exprimé.
