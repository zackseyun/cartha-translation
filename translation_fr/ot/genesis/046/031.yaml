    text: 'Littéralement : « la maison de son père ». Ici, cette expression désigne la maisonnée, le groupe familial, plutôt que l’habitation.'
    reason: lexical_alternative
  revision_rationale: La révision retire l’ajout non justifié de « toute », emploie « maisonnée » pour préserver le sens social de בית אב, et remplace « me rejoindre » par une formulation plus directement équivalente à « venir à moi ». La syntaxe de la première personne est également rendue plus naturelle en français tout en gardant « monter ».
