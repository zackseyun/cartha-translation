  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: fr
  text: 'Et les fils de Naphtali : Yahtséel[a], Gouni, Yétser et Shillem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce nom est aussi écrit « Jahtseel » ou « Jahtséel » dans les traductions françaises. Les noms « Yétser » et « Shillem » connaissent également les graphies traditionnelles « Jetser » et « Schillem ».
    reason: Variantes de translittération des noms propres hébreux.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Et les fils de
  rationale: Le pluriel construit בְּנֵי désigne ici les « fils de » dans une liste généalogique. Le ו initial est rendu par « Et » afin de conserver l’enchaînement de la liste.
- source_word: נַפְתָּלִי
  choice: Naphtali
  rationale: Nom propre rendu selon sa forme française biblique courante.
- source_word: יַחְצְאֵל
  choice: Yahtséel
  rationale: 'Translittération adaptée au français moderne : y pour le yod initial, h pour signaler la consonne ח et ts pour צ.'
- source_word: וְגוּנִי
  choice: Gouni
  rationale: Translittération française naturelle du nom propre ; la conjonction est exprimée par la ponctuation de l’énumération.
- source_word: וְיֵצֶר
  choice: Yétser
  rationale: Translittération adaptée au français, avec y initial et ts pour la consonne צ.
- source_word: וְשִׁלֵּם
  choice: Shillem
  rationale: La graphie conserve le son sh de שׁ et le redoublement consonantique indiqué par le texte hébreu.
