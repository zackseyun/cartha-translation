lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Forme construite plurielle de בֵּן. Dans cette liste généalogique, « les fils de » désigne directement les deux fils de Rachel et reste plus précis que « les enfants de » ou « les descendants de ».
- source_word: רָחֵל
  choice: Rachel
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: אֵשֶׁת
  choice: femme
  rationale: Dans la construction « femme de Jacob », le français biblique courant exprime naturellement la relation conjugale. « Épouse » serait également possible, mais légèrement plus soutenu.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Nom propre rendu selon sa forme française traditionnelle; le rapport construit hébreu est exprimé par « de Jacob ».
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: וּבִנְיָמִן
  choice: et Benjamin
  rationale: La conjonction וּ est rendue simplement par « et », suivie de la forme française traditionnelle du nom propre.
