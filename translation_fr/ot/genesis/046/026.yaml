  text: כָּל הַ֠/נֶּפֶשׁ הַ/בָּאָ֨ה לְ/יַעֲקֹ֤ב מִצְרַ֨יְמָ/ה֙ יֹצְאֵ֣י יְרֵכ֔/וֹ מִ/לְּ/בַ֖ד נְשֵׁ֣י בְנֵי יַעֲקֹ֑ב כָּל נֶ֖פֶשׁ שִׁשִּׁ֥ים וָ/שֵֽׁשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: fr
  text: Toutes les personnes venues en Égypte avec Jacob[a], ses descendants, à l’exclusion des femmes des fils de Jacob, étaient au nombre de soixante-six[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rattachées à Jacob qui vinrent en Égypte » ; la construction hébraïque peut exprimer l’accompagnement ou l’appartenance à son groupe familial.
    reason: textual_ambiguity
  - marker: c
    text: 'L’hébreu répète ici le mot נֶפֶשׁ, « être vivant » ou « personne » : « en tout, soixante-six personnes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: Toutes les personnes
  rationale: Dans ce contexte généalogique et numérique, נֶפֶשׁ désigne des individus. « Personnes » exprime naturellement cet emploi collectif en français.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: venues en Égypte avec Jacob
  rationale: La tournure française rend le sens contextuel de personnes qui se rendent en Égypte en relation avec Jacob, tout en signalant en note l’ambiguïté possible de לְיַעֲקֹב.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: issues de lui
  rationale: L’expression hébraïque désigne les descendants biologiques de Jacob. « Issues de lui » reste concise, digne et compréhensible, tandis qu’une note conserve l’image littérale de la cuisse.
- source_word: מִלְּבַד
  choice: sans compter
  rationale: Cette formulation indique clairement que les femmes des fils de Jacob sont exclues du total.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: les femmes des fils de Jacob
  rationale: Rendu direct et naturel du groupe nominal hébreu.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: étaient au total soixante-six
  rationale: Cette formulation française donne clairement le total, sans répéter lourdement « personnes »; la note indique que l’hébreu reprend נֶפֶשׁ.
theological_decisions:
- issue: Relation exprimée par לְיַעֲקֹב
  choice: avec Jacob
  alternative: appartenant à Jacob / de Jacob
  rationale: Dans le récit du déplacement vers l’Égypte, « avec Jacob » est le rendu contextuel le plus naturel. La construction hébraïque peut toutefois marquer l’appartenance ou le rattachement à Jacob; cette possibilité est conservée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure de dénombrement du texte hébreu tout en évitant le calque obscur « sorties de sa cuisse » dans le corps du verset. Les ambiguïtés lexicales pertinentes sont maintenues dans les notes.
