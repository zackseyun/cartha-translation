  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: fr
  text: 'Ils prirent leur bétail et les biens qu’ils avaient acquis au pays de Canaan, puis ils vinrent en Égypte : Jacob et toute sa descendance[a] avec lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « semence » ; le mot hébreu peut désigner la progéniture ou les descendants d’une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Ils prirent
  rationale: Le qatal narratif précédé de וַ exprime l’étape suivante du récit. « Ils prirent » est direct et naturel en français.
- source_word: מִקְנֵיהֶם
  choice: leur bétail
  rationale: מִקְנֶה désigne collectivement les animaux possédés. « Leur bétail » est plus englobant que « leurs troupeaux ».
- source_word: רְכוּשָׁם
  choice: les biens
  rationale: רְכוּשׁ désigne les possessions ou biens matériels. « Les biens » évite une répétition lourde après « leur bétail ».
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: qu’ils avaient acquis
  rationale: Le plus-que-parfait marque naturellement en français que l’acquisition avait précédé le départ.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: au pays de Canaan
  rationale: Cette formulation conserve la référence explicite au territoire tout en restant idiomatique en français moderne.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: puis ils vinrent en Égypte
  rationale: La terminaison directive de מִצְרָיְמָה indique un mouvement vers l’Égypte. « Vinrent en Égypte » reste proche de בוא, tandis que « puis » rend avec naturel la progression narrative.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: Jacob et toute sa descendance avec lui
  rationale: זֶרַע signifie littéralement « semence » et, appliqué à une personne, sa progéniture ou sa descendance. « Descendance » convient ici à l’ensemble de la lignée familiale qui accompagne Jacob.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le deux-points conserve l’effet d’explicitation finale de l’hébreu, qui nomme Jacob et toute sa descendance après le verbe au pluriel.
