base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: fr
  text: Les fils de Juda étaient Er, Onân, Shéla, Pérets et Zérah. Er et Onân moururent[a] au pays de Canaan. Les fils de Pérets étaient Hetsron et Hamoul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le verbe est au singulier devant le sujet composé « Er et Onân », une construction normale dans cette langue ; le sens est bien pluriel.
    reason: La note signale une particularité grammaticale du texte source que le français ne peut reproduire naturellement.
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: Les fils de Juda
  rationale: La construction généalogique est rendue directement et naturellement. Le ו initial relie ce groupe à la liste précédente, mais n’exige pas un « et » en tête de phrase en français.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: Er, Onân, Shéla, Pérets et Zérah
  rationale: Les noms propres sont translittérés selon des formes françaises bibliques courantes, avec une coordination naturelle en français.
- source_word: וַיָּמָת
  choice: moururent
  rationale: Bien que le verbe hébreu soit morphologiquement au singulier parce qu’il précède un sujet composé, son sujet sémantique est « Er et Onân » ; le pluriel est donc requis en français.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: au pays de Canaan
  rationale: Cette formulation conserve le nom explicite אֶרֶץ, « pays/terre », tout en étant idiomatique en français.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: Les fils de Pérets étaient
  rationale: Dans cette notice généalogique, היה sert à identifier les fils de Pérets ; « étaient » exprime clairement cette relation sans élargir le sens à l’ensemble de ses descendants.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: Hetsron et Hamoul
  rationale: Translittérations françaises usuelles des deux noms propres.
