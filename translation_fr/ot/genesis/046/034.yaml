  terminology: « Tes serviteurs » maintient la formule de déférence. « Pays de Goshen », « éleveurs de bétail » et « bergers » sont appropriés. « Abomination » restitue mieux la vigueur lexicale de תּוֹעֵבָה que « considérés comme abominables », tout en conservant explicitement le point de vue des Égyptiens.
