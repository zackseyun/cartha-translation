  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: fr
  text: 'vous direz : « Tes serviteurs ont été des éleveurs de bétail depuis notre jeunesse jusqu’à présent, nous comme nos pères », afin que vous puissiez vous établir dans le pays de Goshen ; car tout berger est une abomination pour les Égyptiens.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « car tout berger de petit bétail est une abomination pour les Égyptiens ». L’hébreu emploie une construction qui associe l’aversion à l’Égypte; elle désigne ici les Égyptiens.
    reason: Conserve la mention explicite de צֹאן (« petit bétail ») et explicite la construction de תּוֹעֲבַת מִצְרַיִם, sans affaiblir sa valeur forte.
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: vous répondrez
  rationale: Dans le contexte d’un entretien annoncé avec le pharaon, le waw suivi de l’accompli poursuit l’instruction; « vous répondrez » est naturel en français et rend la valeur séquentielle sans lourdeur.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: élèvent du bétail
  rationale: L’expression désigne des hommes dont l’activité est l’élevage d’animaux domestiques. La formulation verbale est plus idiomatique en français moderne que « hommes de bétail ».
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Il s’agit ici d’une formule de déférence adressée au pharaon, non d’une affirmation explicite de statut servile.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: depuis leur jeunesse jusqu’à maintenant
  rationale: Cette formulation exprime clairement une activité commencée tôt dans la vie et poursuivie jusqu’au présent. La troisième personne s’accorde avec « tes serviteurs », tout en étant explicitée ensuite par « nous ».
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: aussi bien nous que nos pères
  rationale: La corrélation restitue la répétition de גַּם et souligne la continuité de l’activité entre les générations.
- source_word: בַּעֲבוּר
  choice: ainsi
  rationale: Dans ce contexte, le terme introduit le résultat recherché par la réponse prescrite; « ainsi » conserve naturellement cette relation de finalité ou de conséquence.
- source_word: תֵּשְׁבוּ
  choice: vous pourrez vous établir
  rationale: Le verbe ישב peut signifier habiter ou s’établir. Ici, il est question de l’installation durable de la famille dans une région précise.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: dans le pays de Goshen
  rationale: La traduction conserve explicitement אֶרֶץ, « pays/terre », et la forme française traditionnelle du toponyme.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: sont considérés comme abominables par les Égyptiens
  rationale: La construction nominale exprime une forte répulsion du point de vue égyptien. L’ajout de « considérés comme » évite d’endosser ce jugement tout en maintenant la force de תּוֹעֵבָה.
- source_word: כָּל רֹעֵה צֹאן
  choice: tous les bergers
  rationale: Le singulier distributif hébreu se rend naturellement par le pluriel générique français. « Berger » implique déjà la garde d’un troupeau, de sorte que צֹאן n’a pas besoin d’être explicité dans le texte principal.
theological_decisions:
- issue: Portée du jugement exprimé par תוֹעֲבַת מִצְרַיִם
  choice: présenter l’aversion comme le point de vue des Égyptiens
  alternative: « tout berger est une abomination pour les Égyptiens »
  rationale: La formulation retenue conserve la forte valeur négative du terme tout en indiquant clairement que le texte rapporte une attitude culturelle égyptienne plutôt qu’un jugement moral du narrateur.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement du pharaon est retenu conformément à l’usage biblique français courant pour le singulier; le discours cité emploie une formule de déférence. La syntaxe reste accessible sans effacer la force du jugement culturel rapporté.
