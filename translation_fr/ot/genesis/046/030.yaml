  text: וַ/יֹּ֧אמֶר יִשְׂרָאֵ֛ל אֶל יוֹסֵ֖ף אָמ֣וּתָה הַ/פָּ֑עַם אַחֲרֵי֙ רְאוֹתִ֣/י אֶת פָּנֶ֔י/ךָ כִּ֥י עוֹדְ/ךָ֖ חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: fr
  text: 'Alors Israël dit à Joseph[a] : « Maintenant, je peux mourir, puisque j’ai vu ton visage et que je sais que tu es encore en vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Maintenant, je mourrai, après avoir vu ton visage, car tu es encore en vie. » La formulation hébraïque est concise et idiomatique ; le texte principal en exprime le sens dans un français naturel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » en restitue naturellement la valeur séquentielle.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie explicitement le nom Israël ; il n’est pas harmonisé avec Jacob.
- source_word: אָמ֣וּתָה
  choice: je peux mourir
  rationale: 'Le cohortatif exprime ici une disposition personnelle chargée d’émotion : Israël peut désormais mourir comblé. « Que je meure » risquerait de suggérer une demande ou un souhait de mort plus marqué.'
- source_word: הַפָּעַם
  choice: Maintenant
  rationale: L’expression signifie littéralement « cette fois » mais désigne ici le moment présent, après une longue période de deuil.
- source_word: אַחֲרֵי רְאוֹתִי
  choice: puisque j’ai vu
  rationale: La construction est formellement temporelle, « après avoir vu », mais elle présente aussi la circonstance qui fonde la déclaration. « Puisque » en communique naturellement la portée contextuelle.
- source_word: אֶת פָּנֶיךָ
  choice: ton visage
  rationale: La traduction conserve l’image hébraïque concrète et personnelle plutôt que de la réduire à « toi ».
- source_word: כִּי
  choice: et que je sais que
  rationale: כִּי relie ici la vue du visage de Joseph au constat qu’il est vivant. L’ajout explicite de « je sais » rend ce rapport intelligible en français, sans changer le sens contextuel.
- source_word: עוֹדְךָ חָי
  choice: tu es encore en vie
  rationale: 'La tournure exprime la continuité : Joseph demeure vivant. « Encore en vie » est l’équivalent français courant.'
