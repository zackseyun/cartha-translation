lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Les fils de
  rationale: Le syntagme construit בְנֵי signifie « fils de ». Dans cette suite généalogique, l’article défini et la ponctuation française rendent naturellement l’enchaînement introduit par ו sans imposer un « et » initial peu idiomatique.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: « Ruben » est la forme française traditionnelle et courante du nom hébreu.
- source_word: חֲנוֹךְ
  choice: Hénok
  rationale: « Hénok » est la forme française usuelle de ce nom hébreu; une note signale sa forme plus directement translittérée.
- source_word: וּ/פַלּוּא
  choice: Pallou
  rationale: « Pallou » suit l’usage français courant; la conjonction préfixée est rendue par la structure de l’énumération.
- source_word: וְ/חֶצְרוֹן
  choice: Hetsron
  rationale: « Hetsron » représente clairement le nom hébreu חֶצְרוֹן selon une translittération française courante.
- source_word: וְ/כַרְמִי
  choice: Karmi
  rationale: « Karmi » transcrit directement le nom hébreu; la conjonction est rendue par « et » devant le dernier élément de la liste.
