  text: וּ/בְנֵ֥י יוֹסֵ֛ף אֲשֶׁר יֻלַּד ל֥/וֹ בְ/מִצְרַ֖יִם נֶ֣פֶשׁ שְׁנָ֑יִם כָּל הַ/נֶּ֧פֶשׁ לְ/בֵֽית יַעֲקֹ֛ב הַ/בָּ֥אָה מִצְרַ֖יְמָ/ה שִׁבְעִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: fr
  text: Les fils de Joseph qui étaient nés de lui en Égypte étaient au nombre de deux[a]. Toutes les personnes de la maison de Jacob qui vinrent en Égypte étaient au nombre de soixante-dix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mot à mot, le terme hébreu est « âme » ; ici, il désigne une personne dans un dénombrement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: Les fils de Joseph
  rationale: בֵּן au pluriel construit désigne ici précisément les fils de Joseph déjà nommés dans le contexte. La coordination initiale n’a pas besoin d’être rendue par « Et » dans ce verset récapitulatif en français.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: qui lui étaient nés
  rationale: Le passif de ילד avec ל et suffixe signifie naturellement « naître à quelqu’un ». Le plus-que-parfait situe ces naissances avant le dénombrement raconté.
- source_word: בְמִצְרַיִם
  choice: en Égypte
  rationale: Emploi locatif direct de la préposition ב.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: deux personnes
  rationale: Dans ce contexte généalogique et censitaire, נֶפֶשׁ désigne des individus comptés. « Personnes » restitue cet emploi sans introduire les connotations anthropologiques de « âmes ».
- source_word: כָּל הַנֶּפֶשׁ
  choice: Toutes les personnes
  rationale: Le singulier collectif hébreu après כָּל se rend naturellement par un pluriel en français dans un dénombrement.
- source_word: לְבֵית יַעֲקֹב
  choice: de la maison de Jacob
  rationale: La formule conserve le sens familial et collectif de בֵּית tout en restant traditionnelle et transparente en français.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: qui vinrent en Égypte
  rationale: Le participe substantivé collectif est rendu par une proposition relative. Le ה directionnel de מִצְרַיְמָה exprime le mouvement vers l’Égypte.
- source_word: שִׁבְעִים
  choice: étaient au nombre de soixante-dix
  rationale: La proposition nominale donne le total. Cette tournure française explicite naturellement le dénombrement sans en modifier le sens.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans un dénombrement généalogique
  choice: personnes
  alternative: âmes
  rationale: Le passage compte les membres de la maison de Jacob et ne formule pas une doctrine sur la composition de l’être humain. « Personnes » préserve le sens contextuel, tandis que « âmes » pourrait suggérer à tort une affirmation anthropologique.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde le registre généalogique du texte tout en évitant une littéralité trompeuse. « Étaient deux personnes » est conservé pour refléter explicitement נֶפֶשׁ, malgré une légère raideur voulue du style de dénombrement.
