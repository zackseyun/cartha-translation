base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: fr
  text: Voici les fils de Léa, qu’elle donna à Jacob en Paddân-Aram, ainsi que Dina, la fille de Jacob. Ses fils et ses filles étaient en tout trente-trois personnes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute personne de ses fils et de ses filles ». Le texte hébreu donne le total de trente-trois ; le décompte précis à partir de la liste soulève une difficulté, pour laquelle diverses explications ont été proposées.'
    reason: textual_counting_difficulty
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: les fils de Léa
  rationale: Le texte emploie explicitement le masculin pluriel « fils » comme rubrique généalogique; il ne faut pas l’élargir en « enfants », même si Dina est ensuite mentionnée.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: qu’elle mit au monde pour Jacob
  rationale: Avec un sujet féminin, ילד au qal signifie « enfanter, mettre au monde ». Cette formulation française conserve le rôle maternel et la relation exprimée par לְ.
- source_word: בְּפַדַּן אֲרָם
  choice: en Paddân-Aram
  rationale: Il s’agit d’un nom de lieu, translittéré selon un usage français clair.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: ainsi que Dina, sa fille
  rationale: « Ainsi que » rend naturellement l’ajout de Dina après la rubrique consacrée aux fils, sans effacer la formulation du texte.
- source_word: כָּל נֶפֶשׁ
  choice: étaient en tout … personnes
  rationale: Dans ce contexte de dénombrement, נֶפֶשׁ désigne des personnes, non l’« âme » au sens théologique; la tournure française exprime l’idiome de totalisation.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: ses fils et ses filles
  rationale: La traduction maintient la distinction explicite entre les deux termes hébreux plutôt que de les regrouper sous « enfants ».
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: trente-trois
  rationale: Rendu direct du nombre cardinal hébreu.
theological_decisions:
- issue: Écart apparent entre le total annoncé et les personnes nommées dans la liste immédiate
  choice: Conserver « trente-trois » dans le texte et signaler sobrement la difficulté en note
  alternative: Harmoniser implicitement le total avec un recomptage de la liste
  rationale: Le texte massorétique donne sans ambiguïté le nombre trente-trois. La manière précise d’obtenir ce total est discutée; la traduction ne doit ni corriger le texte ni imposer une harmonisation.
translation_notes:
  register: Français international moderne, naturel et digne. « Mit au monde » est clair pour un large lectorat; « Paddân-Aram » conserve le toponyme. La dernière phrase privilégie une tournure idiomatique tout en gardant « fils », « filles » et « personnes ».
