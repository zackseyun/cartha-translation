  text: וַ/יִּוָּלֵ֣ד לְ/יוֹסֵף֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֣ן אֹ֑ן אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: fr
  text: En Égypte, Joseph eut pour fils Manassé et Éphraïm, qu’Asnath, fille de Poti-Phéra, prêtre d’On[a], mit au monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On est la ville égyptienne appelée plus tard Héliopolis en grec.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: Joseph eut
  rationale: Le niphal exprime la naissance des enfants « à Joseph ». La tournure française « Joseph eut » rend naturellement cette relation sans imposer le singulier morphologique du verbe hébreu aux deux noms qui suivent.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: En Égypte
  rationale: Le français courant désigne naturellement le pays par « en Égypte » ; traduire אֶרֶץ par « pays » ou « terre » serait ici plus lourd sans apporter de précision nécessaire.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: qu’… mit au monde pour lui
  rationale: Cette formulation conserve l’action maternelle explicite de ילד ainsi que la relation marquée par לּוֹ, tout en restant claire en français moderne.
- source_word: אָסְנַת
  choice: Asnath
  rationale: Forme française traditionnelle et reconnaissable du nom propre égyptien.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: fille de Poti-Phéra
  rationale: Rend directement la construction nominale et emploie la graphie française usuelle du nom.
- source_word: כֹּהֵן אֹן
  choice: prêtre d’On
  rationale: « Prêtre » est le sens direct de כֹּהֵן ; le toponyme hébreu est translittéré dans le texte plutôt que remplacé par son nom grec ultérieur.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Manassé et Éphraïm
  rationale: Les marqueurs d’objet direct ne sont pas traduits ; les noms suivent leurs formes françaises usuelles.
