    issue: « mit au monde pour lui »
    rationale: La préposition « pour » peut communiquer l’idée de but ou de bénéfice. Le texte dit qu’Asnath les enfanta « à/lui », c’est-à-dire comme enfants de Joseph, non qu’elle les mit au monde à son intention.
  - severity: low
    issue: « Joseph eut Manassé et Éphraïm »
    rationale: La formule ne marque pas explicitement qu’il s’agit de ses fils et rend moins nettement la naissance passive des deux enfants à Joseph.
