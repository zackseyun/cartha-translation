  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: fr
  text: 'Et les fils d’Issacar : Tola, Pouva[a], Job[b] et Shimron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Pouva est aussi écrit « Poua » dans certaines traditions françaises.
    reason: lexical_alternative
  - marker: b
    text: En 1 Chroniques 7.1, on lit « Yashoub » au lieu de « Job ».
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Et les fils de
  rationale: Le pluriel construit בְּנֵי signifie directement « les fils de » dans cette liste généalogique; la conjonction וּ est conservée par « Et ».
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Nom propre rendu selon sa forme française traditionnelle et courante.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Translittération française usuelle de ce nom propre dans un contexte généalogique.
- source_word: וּ/פֻוָּה
  choice: Pouva
  rationale: La forme consonantique et vocalisée פֻוָּה est représentée de manière naturelle en français par « Pouva »; la variante traditionnelle « Poua » est signalée en note.
- source_word: וְ/י֥וֹב
  choice: Job
  rationale: Le texte massorétique de ce verset porte יוֹב, correspondant au nom français « Job »; la leçon différente de 1 Chroniques 7.1 est conservée en note.
- source_word: וְ/שִׁמְרֽוֹן
  choice: et Shimron
  rationale: Nom propre translittéré, avec la conjonction rendue par « et ».
