  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: fr
  text: Ces hommes sont bergers, car ils sont éleveurs de bétail[a]. Ils ont amené leur petit bétail, leurs bovins et tout ce qui leur appartient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car ils étaient éleveurs de bétail ». La forme verbale hébraïque peut décrire leur métier comme une situation passée ou comme une activité établie dans le contexte présent.'
    reason: ambiguïté temporelle
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Ces hommes
  rationale: Le démonstratif reprend naturellement en français les frères de Joseph dont il vient de parler; la conjonction initiale n’a pas besoin d’être exprimée dans cette déclaration rapportée.
- source_word: רֹעֵי צֹאן
  choice: bergers
  rationale: Équivalent français idiomatique du groupe construit désignant ceux qui font paître le petit bétail.
- source_word: כִּי
  choice: car
  rationale: Introduit l’explication de leur désignation comme bergers.
- source_word: אַנְשֵׁי מִקְנֶה הָיוּ
  choice: ils ont toujours été éleveurs de bétail
  rationale: La tournure nominale hébraïque désigne leur activité habituelle; le passé composé avec « toujours » exprime une occupation établie qui se poursuit jusqu’à leur arrivée, sans limiter מִקְנֶה aux seuls bovins.
- source_word: וְצֹאנָם
  choice: leur petit bétail
  rationale: צֹאן désigne collectivement surtout les moutons et les chèvres; « petit bétail » conserve cette catégorie sans la réduire aux moutons.
- source_word: וּבְקָרָם
  choice: leurs bovins
  rationale: בָּקָר désigne le gros bétail bovin; « bovins » distingue clairement cette catégorie du petit bétail.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: tout ce qui leur appartient
  rationale: Formulation française naturelle et proche de l’expression hébraïque de possession.
- source_word: הֵבִיאוּ
  choice: Ils ont amené
  rationale: Le passé composé rend l’action accomplie dont le résultat demeure pertinent au moment de l’arrivée en Égypte.
