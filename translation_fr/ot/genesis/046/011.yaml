  language: fr
  text: 'Les fils de Lévi : Guershon, Kehath et Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Les fils de
  rationale: בְנֵי est le pluriel construit de « fils », formule généalogique explicite. Le ו initial assure ici la continuité de la liste; en français, cette continuité ressort naturellement du contexte sans qu’un « Et » initial soit nécessaire.
- source_word: לֵוִי
  choice: Lévi
  rationale: Forme française traditionnelle et immédiatement reconnaissable de ce nom propre.
- source_word: גֵּרְשׁוֹן
  choice: Guershon
  rationale: Transcription française usuelle de גֵּרְשׁוֹן, distinct de Guershom, qui correspond à un autre nom hébreu.
- source_word: קְהָת
  choice: Qehath
  rationale: Transcription française qui conserve la consonne initiale ק et distingue clairement ce nom des formes commençant par כ; elle demeure lisible dans un registre biblique moderne.
- source_word: וּ/מְרָרִי
  choice: et Merari
  rationale: Le ו préfixé est rendu par « et » devant le dernier élément de l’énumération; Merari est la forme française traditionnelle du nom.
