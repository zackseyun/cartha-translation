source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: fr
  text: 'Mais l’ange[a] de Yahweh l’appela du ciel[b] et lui dit : « Abraham ! Abraham ! » Il répondit : « Me voici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager ». Le mot hébreu מַלְאָךְ peut désigner un « messager » ou un « ange » ; ici, le fait qu’il parle depuis le ciel favorise « ange ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des cieux » ; « du ciel » est l’expression française usuelle dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֵלָיו
  choice: l’appela
  rationale: Dans ce récit, קרא désigne un appel vocal adressé à Abraham. Le pronom objet français rend naturellement אֵלָיו.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste ; ici, l’appel venant du ciel favorise « ange ». Le nom divin יהוה est translittéré « Yahweh ».
- source_word: מִן הַשָּׁמַיִם
  choice: du ciel
  rationale: Bien que שָׁמַיִם ait une forme plurielle en hébreu, « du ciel » est l’expression française naturelle pour désigner ici le domaine céleste.
- source_word: וַיֹּאמֶר
  choice: et lui dit / Il répondit
  rationale: אמר est le verbe courant de parole. Dans la seconde occurrence, « répondit » explicite naturellement la fonction de la réplique d’Abraham sans en modifier le sens.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: Abraham ! Abraham !
  rationale: La répétition du nom est conservée ; les points d’exclamation rendent l’urgence et l’intensité de l’appel.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: « Me voici » est la formule française consacrée et naturelle exprimant à la fois la présence et la disponibilité du locuteur.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Identification de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh ; une manifestation de Yahweh lui-même
  rationale: La traduction conserve la désignation du texte sans identifier plus précisément cet être sur le plan théologique. Le cadre céleste favorise « ange », tandis qu’une note maintient l’autre valeur lexicale possible.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition solennelle du nom et la réponse brève « Me voici » sont conservées. Les marqueurs de note sont placés immédiatement après les expressions qu’ils expliquent.
