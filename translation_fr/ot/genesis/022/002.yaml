base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: fr
  text: 'Il dit : « Prends, je te prie, ton fils, ton unique[a], celui que tu aimes, Isaac, et va au pays de Moria. Là, offre-le en holocauste sur l’une des montagnes que je t’indiquerai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton fils unique ». Le mot hébreu יְחִידְךָ peut désigner un être unique ou sans pareil ; ici, il souligne la place singulière d’Isaac dans cet ordre.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: je te prie
  rationale: La particule adoucit l’impératif par une nuance de demande instante; « je te prie » reste naturel et digne en français, sans lui donner le sens temporel de « maintenant ».
- source_word: בִּנְךָ
  choice: ton fils
  rationale: Équivalent direct de בֵּן avec suffixe masculin singulier.
- source_word: יְחִידְךָ
  choice: ton unique
  rationale: יָחִיד désigne l’être unique ou sans pareil. La formulation conserve le statut singulier d’Isaac sans nier implicitement l’existence d’Ismaël; l’ambiguïté est explicitée en note.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: celui que tu aimes
  rationale: Le parfait exprime ici un état reconnu et durable; le présent français restitue naturellement l’amour d’Abraham pour Isaac.
- source_word: וְלֶךְ לְךָ
  choice: et va
  rationale: L’expression idiomatique peut marquer l’engagement personnel ou l’insistance, mais l’impératif simple est son équivalent français le plus naturel dans ce contexte.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: au pays de Moriya
  rationale: « Pays » rend אֶרֶץ de façon directe et usuelle; « Moriya » suit une translittération française transparente.
- source_word: וְהַעֲלֵהוּ
  choice: offre-le
  rationale: Avec לְעֹלָה, le hiphil de עָלָה appartient au langage sacrificiel et signifie faire monter, donc offrir en sacrifice.
- source_word: לְעֹלָה
  choice: en holocauste
  rationale: « Holocauste » est le terme biblique français établi pour l’offrande entièrement brûlée; la construction « offrir en holocauste » est concise et claire.
- source_word: עַל אַחַד הֶהָרִים
  choice: sur l’une des montagnes
  rationale: La formulation indique une montagne encore non précisée parmi plusieurs; הַר est rendu normalement par « montagne ».
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: que je t’indiquerai
  rationale: Littéralement « que je te dirai »; dans ce contexte de destination, « indiquer » exprime naturellement l’acte verbal sans importer l’idée visuelle de « montrer ».
theological_decisions:
- issue: Sens de יְחִידְךָ appliqué à Isaac malgré l’existence d’Ismaël
  choice: ton unique
  alternative: ton fils unique; ton fils sans pareil
  rationale: '« Ton unique » maintient la tension du texte: Isaac occupe ici une place singulière dans la relation d’Abraham et dans la promesse, sans que la traduction décide si cette singularité est biologique, covenantale ou affective.'
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’accumulation solennelle « ton fils, ton unique, celui que tu aimes, Isaac ». « Je te prie » rend la nuance de נָא sans rendre l’ordre moins grave.
