  text: אֶת ע֥וּץ בְּכֹר֖/וֹ וְ/אֶת בּ֣וּז אָחִ֑י/ו וְ/אֶת קְמוּאֵ֖ל אֲבִ֥י אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: fr
  text: Uts, son premier-né, Buz, son frère, et Kemuel, père d’Aram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ancêtre d’Aram ». Dans les généalogies, « père » peut parfois désigner un ancêtre ou un fondateur plutôt que le père immédiat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וּץ
  choice: Outs
  rationale: Nom propre transcrit selon une forme française courante, qui rend approximativement la prononciation hébraïque.
- source_word: בְּכֹר֖וֹ
  choice: son premier-né
  rationale: Le terme désigne le fils né le premier et peut aussi comporter une notion de rang; «premier-né» en conserve la portée généalogique.
- source_word: בּ֣וּז
  choice: Bouz
  rationale: Transcription française naturelle du nom propre hébreu.
- source_word: אָחִ֑יו
  choice: son frère
  rationale: Traduction directe du terme de parenté avec suffixe masculin singulier; le français conserve la référence pronominale du texte hébreu.
- source_word: קְמוּאֵ֖ל
  choice: Qemouel
  rationale: Transcription française du nom propre, avec Q pour représenter la consonne hébraïque initiale et «ou» pour la voyelle.
- source_word: אֲבִ֥י
  choice: père de
  rationale: C’est le sens direct dans cette formule généalogique, sans exclure l’emploi plus large de «père» pour un ancêtre ou un fondateur.
- source_word: אֲרָֽם
  choice: Aram
  rationale: Nom propre transcrit sans préciser s’il désigne ici uniquement une personne ou aussi l’ancêtre éponyme d’un peuple.
theological_decisions:
- issue: Portée généalogique de אֲבִי אֲרָם
  choice: Qemouel, père d’Aram
  alternative: Qemouel, ancêtre d’Aram
  rationale: «Père d’Aram» suit directement l’hébreu. La note signale que, dans une généalogie, «père» peut parfois désigner plus largement un ancêtre ou un fondateur, sans imposer cette interprétation dans le texte.
translation_notes:
  register: Français international actuel, sobre et digne. La structure énumérative de l’hébreu est conservée, avec des noms propres adaptés aux conventions phonétiques françaises. Le marqueur de note est placé après «Aram», là où se trouve l’expression concernée.
