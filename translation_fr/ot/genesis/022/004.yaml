  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: fr
  text: Le troisième jour, Abraham leva les yeux et vit le lieu au loin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de loin » / « à distance ».
    reason: Alternative lexicale pour מֵרָחֹק, qui indique l’éloignement sans imposer une formulation française unique.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: Rend directement la locution temporelle définie, sans ajouter « du voyage », qui n’est pas explicite dans l’hébreu.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: leva les yeux
  rationale: Conserve l’image de l’expression hébraïque tout en restant naturelle et digne en français moderne.
- source_word: וַיַּרְא
  choice: et vit
  rationale: Exprime simplement la progression du récit au passé; le sujet Abraham reste celui des deux verbes coordonnés.
- source_word: הַמָּקוֹם
  choice: le lieu
  rationale: Correspond au nom défini ordinaire employé en hébreu, sans préciser davantage la nature de la destination.
- source_word: מֵרָחֹק
  choice: au loin
  rationale: Rend naturellement l’idée d’une perception à distance; « de loin » demeure une variante française également possible.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
