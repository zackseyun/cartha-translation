source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: fr
  text: 'Abraham leva les yeux et regarda : voici qu’il y avait derrière lui[a] un bélier retenu par les cornes dans un fourré. Abraham alla prendre le bélier et l’offrit en holocauste à la place de son fils[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « derrière », sans « lui » explicite; l’hébreu אַחַר est compris ici par beaucoup comme un adverbe de lieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « au lieu de son fils ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: leva les yeux
  rationale: Cette expression française naturelle conserve l’image de l’idiome hébreu, qui décrit Abraham relevant son regard.
- source_word: וַיַּרְא
  choice: regarda
  rationale: Avec « leva les yeux », ce verbe rend la succession des gestes sans absorber le marqueur d’attention qui suit.
- source_word: וְהִנֵּה
  choice: voici qu’il y avait
  rationale: Cette tournure actuelle conserve la fonction présentative et l’effet de découverte du marqueur narratif hébreu.
- source_word: אַיִל
  choice: bélier
  rationale: C’est le terme français précis et usuel pour un mouton mâle adulte, notamment dans un contexte sacrificiel.
- source_word: אַחַר
  choice: derrière lui
  rationale: Le contexte favorise le sens spatial « derrière ». Le pronom « lui », absent du texte consonantique, est explicité en français pour rendre la scène naturelle; cette explicitation est signalée en note.
- source_word: נֶאֱחַז
  choice: retenu
  rationale: Le participe passif décrit l’animal pris et maintenu dans la végétation; « retenu » exprime clairement cet état résultant.
- source_word: בַּסְּבַךְ
  choice: dans un fourré
  rationale: « Fourré » désigne naturellement une végétation dense où les cornes du bélier peuvent s’accrocher.
- source_word: בְּקַרְנָיו
  choice: par les cornes
  rationale: Cette formulation indique précisément la partie du corps par laquelle le bélier est retenu.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: l’offrit en holocauste
  rationale: Dans ce contexte sacrificiel, la combinaison du verbe עלה et de עֹלָה désigne l’offrande entièrement consumée; « holocauste » est le terme biblique français établi et précis.
- source_word: תַּחַת בְּנוֹ
  choice: à la place de son fils
  rationale: 'Ici, תַּחַת exprime sans ambiguïté immédiate le remplacement: le bélier est offert là où le fils devait l’être.'
theological_decisions:
- issue: Portée substitutive de תַּחַת בְּנוֹ
  choice: à la place de son fils
  alternative: au lieu de son fils
  rationale: La traduction exprime la substitution présente dans la scène elle-même, sans lui ajouter une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe reste fluide pour un lectorat général tout en conservant l’enchaînement visuel du récit et le terme sacrificiel précis « holocauste ».
