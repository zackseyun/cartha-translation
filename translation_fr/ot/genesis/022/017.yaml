  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: fr
  text: Oui, je te bénirai certainement et je multiplierai abondamment ta descendance[a], comme les étoiles du ciel et comme le sable qui est au bord de la mer ; ta descendance prendra possession de la porte de ses ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ta semence ». Le mot hébreu est un nom collectif singulier qui peut désigner l’ensemble des descendants.
    reason: lexical_alternative
  - marker: b
    text: Ou « héritera de la porte de ses ennemis ». En hébreu, « descendance » est au singulier collectif, et le suffixe dans « ses ennemis » est également au singulier. La « porte » peut désigner celle d’une ville et, par métonymie, le pouvoir exercé sur elle.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: oui
  rationale: Dans le contexte du serment divin commencé au verset précédent, כִּי renforce solennellement la déclaration. « Oui » convient à ce début de fragment en français, tandis que l’emphase des deux constructions suivantes est rendue séparément.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: je te bénirai certainement
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie et garantit l’action. « Certainement » en restitue l’emphase dans un français naturel.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: et je multiplierai abondamment
  rationale: La même construction intensive exprime ici une multiplication considérable. « Abondamment » communique à la fois l’intensité et l’idée d’un très grand nombre.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: זֶרַע est un nom collectif grammaticalement singulier. « Descendance » reste collectif et singulier, sans réduire le référent à un individu ni le pluraliser explicitement.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: comme les étoiles du ciel
  rationale: Formulation française courante et digne qui conserve l’image comparative; le pluriel morphologique de שָׁמַיִם ne requiert pas le peu naturel « des cieux » dans cette expression.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: et comme le sable qui est au bord de la mer
  rationale: La relative rend explicitement אֲשֶׁר, et « au bord de la mer » restitue naturellement l’expression littérale « sur la lèvre de la mer ».
- source_word: וְיִרַשׁ
  choice: prendra possession de
  rationale: יָרַשׁ peut signifier hériter, posséder ou déposséder. Avec la porte des ennemis, le sens actif de maîtrise ou de contrôle est le plus probable; « prendra possession de » le rend sans effacer l’autre possibilité.
- source_word: שַׁעַר
  choice: la porte
  rationale: Le terme concret est conservé, avec sa valeur possible de symbole du pouvoir et de l’accès à la ville.
- source_word: אֹיְבָיו
  choice: ses ennemis
  rationale: Le suffixe hébreu est au singulier et reprend le collectif זֶרַע. Le français « ses » s’accorde naturellement avec « descendance » sans imposer un référent seulement individuel ou seulement pluriel.
theological_decisions:
- issue: Le singulier collectif de זֶרַע et le suffixe singulier dans אֹיְבָיו
  choice: « ta descendance… ses ennemis »
  alternative: « tes descendants… leurs ennemis »
  rationale: La formulation choisie maintient le caractère collectif et grammaticalement singulier du texte hébreu. Elle ne tranche pas artificiellement entre une lecture corporative et une éventuelle référence individualisée.
- issue: Le sens de יָרַשׁ devant « la porte de ses ennemis »
  choice: « prendra possession de »
  alternative: « héritera de »
  rationale: Le contexte d’ennemis et de porte favorise l’idée de conquête ou de maîtrise. Une note signale néanmoins l’autre valeur lexicale réelle du verbe.
translation_notes:
  register: Français international moderne, solennel mais accessible. Les deux constructions hébraïques emphatiques sont rendues par « certainement » et « abondamment » afin d’éviter une répétition artificielle tout en conservant leur force. « Descendance » maintient la tension du collectif singulier.
