source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא יְהוָ֣ה יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַ/יּ֔וֹם בְּ/הַ֥ר יְהוָ֖ה יֵרָאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: fr
  text: 'Abraham donna à ce lieu le nom de « Le SEIGNEUR verra »[a]. C’est pourquoi l’on dit encore aujourd’hui : « Sur la montagne du SEIGNEUR, il se fera voir »[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le SEIGNEUR pourvoira ». Littéralement, le nom signifie : « Le SEIGNEUR verra ». Dans le contexte, « voir » peut évoquer le fait de prendre connaissance d’un besoin et d’y pourvoir.'
    reason: Préserve le sens lexical de יִרְאֶה tout en indiquant l’interprétation contextuelle traditionnelle.
  - marker: b
    text: 'L’hébreu peut aussi se comprendre : « Sur la montagne du SEIGNEUR, il sera vu » ou « il apparaîtra ». Le sujet de cette forme passive/réfléchie n’est pas précisé. La traduction traditionnelle « il sera pourvu » reflète une interprétation contextuelle.'
    reason: Préserve l’ambiguïté réelle du nifal יֵרָאֶה sans imposer un sujet ni une interprétation de provision.
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם הַהוּא
  choice: Abraham appela ce lieu
  rationale: Formulation française naturelle qui exprime l’acte de donner un nom au lieu sans reproduire lourdement l’idiome hébreu « appela le nom de ce lieu ».
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, tout en le distinguant typographiquement du titre ordinaire « Seigneur ».
- source_word: יִרְאֶה
  choice: pourvoira
  rationale: Le sens littéral est « verra », mais dans ce récit voir implique prendre connaissance du besoin et y pourvoir; « pourvoira » restitue cette portée contextuelle et le jeu de sens traditionnel.
- source_word: יֵרָאֶה
  choice: il sera pourvu
  rationale: Le nifal signifie littéralement « sera vu/apparaîtra ». La traduction retient ici la valeur contextuelle de provision, en parallèle avec יִרְאֶה, tout en signalant l’ambiguïté en note.
- source_word: אֲשֶׁר יֵאָמֵר הַיּוֹם
  choice: C’est pourquoi l’on dit encore aujourd’hui
  rationale: Rend naturellement l’usage proverbial durable indiqué par la tournure hébraïque, sans identifier précisément les locuteurs.
theological_decisions:
- issue: Relation entre la vision divine et la provision
  choice: « pourvoira » / « il sera pourvu » dans le texte, avec le sens littéral en notes
  alternative: « verra » / « il sera vu »
  rationale: Le contexte immédiat du bélier fourni pour le sacrifice soutient la notion de provision, mais la formulation hébraïque conserve un jeu sur la racine « voir »; les notes préservent cette tension sans l’effacer.
- issue: Voix et sujet de יֵרָאֶה
  choice: « il sera pourvu », formulation impersonnelle passive
  alternative: « le SEIGNEUR apparaîtra » ou « on verra »
  rationale: La forme hébraïque est passive/réfléchie et son sujet reste ambigu. La formulation impersonnelle évite d’imposer que le SEIGNEUR soit explicitement le sujet, tout en suivant la lecture contextuelle de la provision.
translation_notes:
  register: Français international moderne, digne et accessible. « Pourvoir » est légèrement soutenu mais courant dans le registre biblique et permet de conserver le lien traditionnel entre le nom du lieu et le proverbe. Les petites capitales simulées par « SEIGNEUR » marquent le nom divin.
