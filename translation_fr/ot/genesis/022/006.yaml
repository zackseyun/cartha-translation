  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: fr
  text: Abraham prit le bois pour l’holocauste et le mit sur Isaac, son fils. Il prit dans sa main le feu et le couteau, et ils allèrent tous deux ensemble.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: le bois destiné à l’holocauste
  rationale: Le construit hébreu signifie littéralement « le bois de l’holocauste ». En français actuel, « destiné à l’holocauste » exprime naturellement la fonction du bois tout en conservant le terme sacrificiel.
- source_word: וַיָּשֶׂם עַל
  choice: le chargea sur
  rationale: La tournure rend concrètement l’action de placer le bois sur Isaac et fait ressortir, sans ajout interprétatif, qu’il en porte la charge.
- source_word: יִצְחָק בְּנוֹ
  choice: son fils Isaac
  rationale: Cet ordre est plus naturel en français que le calque « Isaac, son fils », tout en conservant explicitement la relation filiale.
- source_word: בְּיָדוֹ
  choice: dans sa main
  rationale: Traduction directe du singulier hébreu, qui indique ce qu’Abraham porte lui-même.
- source_word: הָאֵשׁ
  choice: le feu
  rationale: Le texte ne précise ni récipient ni moyen d’allumage. « Le feu » préserve cette indétermination.
- source_word: הַמַּאֲכֶלֶת
  choice: le couteau
  rationale: Le nom peut désigner un couteau servant à l’abattage, mais le contexte sacrificiel suffit à en suggérer l’usage ; « couteau » reste clair et sobre.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: puis tous deux continuèrent leur chemin ensemble
  rationale: Cette formulation rend le mouvement narratif continu de הלך ainsi que l’insistance de שְׁנֵיהֶם יַחְדָּו sur les deux personnages avançant ensemble.
theological_decisions:
- issue: Terminologie sacrificielle de עֹלָה
  choice: holocauste
  alternative: offrande entièrement brûlée
  rationale: Dans ce contexte, עֹלָה désigne l’offrande consumée entièrement par le feu. « Holocauste » est le terme biblique français établi et concis, sans expliciter davantage que l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un large lectorat, tout en préservant le feu non spécifié, la relation père-fils et l’insistance finale sur leur marche commune.
