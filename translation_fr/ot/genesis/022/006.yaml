  to: Abraham prit le bois pour l’holocauste et le mit sur Isaac, son fils. Il prit dans sa main le feu et le couteau, et ils allèrent tous deux ensemble.
  rationale: 'La révision retire l’inférence causale non exprimée, remplace une tournure ambiguë par l’équivalent français direct de « mit sur », et rend le dernier membre de phrase de façon plus littérale et fluide. Aucun appel de note n’est requis : les termes retenus préservent les indéterminations du texte source.'
