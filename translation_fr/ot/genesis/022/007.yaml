  text: וַ/יֹּ֨אמֶר יִצְחָ֜ק אֶל אַבְרָהָ֤ם אָבִי/ו֙ וַ/יֹּ֣אמֶר אָבִ֔/י וַ/יֹּ֖אמֶר הִנֶּ֣נִּֽ/י בְנִ֑/י וַ/יֹּ֗אמֶר הִנֵּ֤ה הָ/אֵשׁ֙ וְ/הָ֣/עֵצִ֔ים וְ/אַיֵּ֥ה הַ/שֶּׂ֖ה לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: fr
  text: 'Isaac dit à Abraham, son père : « Mon père ! » Abraham répondit : « Me voici, mon fils. » Isaac reprit : « Voici le feu et le bois, mais où est l’animal du troupeau[a] pour l’holocauste ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner un petit animal du troupeau, par exemple un agneau, un mouton ou un chevreau.
    reason: Préciser l’étendue sémantique de שֶׂה, que le français ne peut reproduire avec un seul nom usuel exact.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit / répondit / reprit
  rationale: Le verbe אמר introduit chaque prise de parole. La variation française évite une répétition lourde tout en rendant clairement la progression du dialogue, sans ajouter de contenu substantiel.
- source_word: אָבִיו
  choice: son père
  rationale: Rend explicitement le lien de parenté marqué par le suffixe hébreu et convient au registre narratif solennel.
- source_word: אָבִי
  choice: Mon père !
  rationale: Le suffixe de première personne est conservé dans cette interpellation directe et chargée d’émotion.
- source_word: הִנֶּנִי
  choice: Me voici
  rationale: Formule française naturelle et consacrée qui préserve la disponibilité personnelle exprimée par l’hébreu.
- source_word: בְּנִי
  choice: mon fils
  rationale: Conserve le suffixe possessif et la tonalité affectueuse de la réponse.
- source_word: הִנֵּה
  choice: Voici
  rationale: Particule déictique attirant l’attention sur les objets présents; « Voici » est naturel et digne en français actuel.
- source_word: הָאֵשׁ וְהָעֵצִים
  choice: le feu et le bois
  rationale: Les articles sont conservés; le pluriel hébreu עֵצִים se rend idiomatiquement par le nom collectif français « bois ».
- source_word: אַיֵּה
  choice: où est
  rationale: Rend directement l’interrogatif de localisation.
- source_word: הַשֶּׂה
  choice: la bête du troupeau
  rationale: שֶׂה désigne un petit animal du troupeau, ovin ou caprin, sans préciser nécessairement l’espèce ni l’âge. Cette formulation préserve l’étendue lexicale de l’hébreu.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: « Holocauste » est le terme français biblique usuel pour l’offrande entièrement brûlée; la préposition « pour » rend naturellement לְ dans la question.
theological_decisions:
- issue: Identification de l’animal sacrificiel désigné par הַשֶּׂה
  choice: la bête du troupeau
  alternative: l’agneau / le mouton
  rationale: Le texte hébreu ne limite pas le référent à un agneau ni même exclusivement à un ovin. Le choix retenu évite de préciser ce que le texte laisse ouvert et ne projette pas rétrospectivement une identification théologique plus étroite.
translation_notes:
  register: Français international moderne, narratif et digne. Les répétitions hébraïques de « il dit » sont légèrement modulées en « répondit » et « reprit » pour un dialogue naturel, sans modifier les locuteurs ni la logique de l’échange. L’expression « bête du troupeau » est moins conventionnelle que « agneau », mais elle préserve l’ambiguïté réelle du terme source.
