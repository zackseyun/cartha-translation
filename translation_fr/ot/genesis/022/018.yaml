id: GEN.22.18
reference: Genesis 22:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: fr
  text: Et en ta descendance, toutes les nations de la terre seront bénies[a], parce que tu as obéi à ma voix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se béniront ». Le verbe hébreu peut ici être compris dans un sens réfléchi.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: seront bénies
  rationale: Le hitpael de ברך dans cette formule de promesse peut avoir une valeur passive ou réfléchie. « Seront bénies » exprime naturellement en français la réception de la bénédiction, tandis que la lecture réfléchie est conservée en note.
- source_word: בְזַרְעֲךָ
  choice: en ta descendance
  rationale: זֶרַע est un nom collectif pouvant désigner la descendance. « En ta descendance » préserve la préposition hébraïque et son ambiguïté, sans imposer une valeur instrumentale comme le ferait « par ta descendance ».
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: toutes les nations de la terre
  rationale: Traduction directe et naturelle qui maintient la portée universelle de l'expression hébraïque.
- source_word: עֵקֶב אֲשֶׁר
  choice: parce que
  rationale: Cette formulation française concise rend clairement la relation causale introduite par l'expression hébraïque.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: tu as obéi à ma voix
  rationale: L'expression idiomatique hébraïque signifie écouter de manière à se conformer. « Obéir à ma voix » en rend la force tout en conservant l'image de la voix.
theological_decisions:
- issue: Sens du hitpael de ברך dans la promesse faite à Abraham
  choice: 'Les nations reçoivent la bénédiction dans la descendance d''Abraham : « seront bénies ».'
  alternative: Les nations se béniront elles-mêmes en prenant cette descendance comme formule ou modèle de bénédiction.
  rationale: Le contexte de la promesse favorise une valeur passive ou résultative, sans qu'il soit nécessaire d'importer dans le verset une interprétation doctrinale ultérieure. La valeur réfléchie possible de la forme hébraïque est explicitement préservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au discours direct de Dieu à Abraham. La formulation conserve l'expression biblique naturelle « obéi à ma voix » ainsi que l'ambiguïté collective de « descendance ».
