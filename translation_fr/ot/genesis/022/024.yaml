  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: fr
  text: Et sa concubine[a], qui s’appelait Réouma, enfanta elle aussi Téba, Gaham, Tahash et Maaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa femme de second rang ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Sa concubine
  rationale: פִּילֶגֶשׁ désigne une concubine ou épouse de rang secondaire. « Concubine » maintient sobrement la distinction sociale exprimée par l’hébreu. Dans la continuité immédiate de la généalogie, le ו initial n’a pas besoin d’être rendu par « et » en français.
- source_word: וּשְׁמָהּ רְאוּמָה
  choice: qui s’appelait Réouma
  rationale: Littéralement « et son nom [était] Réouma ». Cette formulation est naturelle en français et rattache clairement le nom à la femme mentionnée.
- source_word: וַתֵּלֶד
  choice: enfanta
  rationale: Dans cette liste généalogique, ילד signifie mettre au monde ou enfanter. « Enfanta » est concis, digne et adapté au registre biblique.
- source_word: גַּם הִוא
  choice: elle aussi
  rationale: Cette expression contient un pronom explicite et met Réouma en parallèle avec Milka au verset précédent. « Elle aussi » en conserve naturellement l’emphase.
- source_word: טֶבַח וְגַחַם וְתַחַשׁ וּמַעֲכָה
  choice: Téba, Gaham, Tahash et Maaka
  rationale: Les noms propres sont translittérés selon des formes françaises lisibles, sans chercher à leur attribuer ici une signification interprétative.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « elle aussi » préserve l’insistance de גַּם הִוא, tandis que « qui s’appelait » rend idiomatiquement la coordination hébraïque.
