  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/הָ֣/אֱלֹהִ֔ים נִסָּ֖ה אֶת אַבְרָהָ֑ם וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַבְרָהָ֖ם וַ/יֹּ֥אמֶר הִנֵּֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: fr
  text: 'Après ces événements[a], Dieu mit Abraham à l’épreuve. Il lui dit : « Abraham ! » Celui-ci répondit : « Me voici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après ces choses » ou « après ces paroles » ; le terme hébreu peut désigner largement ce qui précède.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: וַיְהִי introduit ici une nouvelle étape du récit et n’a pas besoin d’être rendu séparément en français. « Après ces événements » exprime naturellement le lien temporel, tandis que la note conserve la formulation plus large et littérale de דְּבָרִים.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte narratif, le nom désigne Dieu. L’article hébreu n’appelle pas l’expression peu idiomatique « le Dieu » en français.
- source_word: נִסָּה
  choice: mit … à l’épreuve
  rationale: Le piel de נסה signifie ici soumettre quelqu’un à une épreuve afin de le tester. Cette formulation française est claire et évite le sens trompeur de « tenter », qui pourrait suggérer une incitation au mal.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Il lui dit
  rationale: Rendu naturel de la formule narrative hébraïque, avec Dieu comme sujet explicite par continuité.
- source_word: אַבְרָהָם
  choice: Abraham !
  rationale: Le nom est employé comme interpellation directe ; le point d’exclamation restitue l’appel sans lui ajouter de contenu.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: Cette formule idiomatique exprime à la fois la présence et la disponibilité de celui qui répond. « Me voici » en est l’équivalent français courant et digne.
theological_decisions:
- issue: Sens de נסה lorsque Dieu est le sujet
  choice: Dieu mit Abraham à l’épreuve
  alternative: Dieu tenta Abraham
  rationale: Dans ce passage, le verbe évoque la mise à l’épreuve ou la vérification, non une incitation au mal. Le choix retient le sens contextuel sans développer une explication doctrinale absente du verset.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide sans reproduire mécaniquement les nombreux « et » de l’hébreu. « Celui-ci répondit » clarifie le changement de locuteur sans altérer le sens.
