  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: fr
  text: 'Et il dit : « Ne porte pas la main sur le garçon et ne lui fais rien, car maintenant je sais que tu crains Dieu : tu ne m’as pas refusé ton fils, ton unique[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « ton fils, ton unique ». Le terme peut signifier « unique » ou « seul » ; il désigne ici Isaac de manière emphatique dans ce contexte.'
    reason: Clarifie l’apposition hébraïque marquée et le sens contextuel de יְחִידְךָ, sans prétendre qu’Abraham n’a pas d’autre fils.
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: porte pas la main sur
  rationale: « Porter la main sur quelqu’un » est un idiome français naturel qui exprime ici l’action violente interdite, tout en restant proche de l’image hébraïque.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נַעַר peut désigner un garçon, un jeune homme ou un serviteur selon le contexte. « Le garçon » convient à cette scène et reste accessible en français moderne.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: ne lui fais aucun mal
  rationale: Littéralement, la formule signifie « ne lui fais quoi que ce soit ». Dans ce contexte de mise à mort imminente, « ne lui fais aucun mal » rend naturellement la portée absolue de l’interdiction sans ambiguïté pragmatique.
- source_word: עַתָּה יָדַעְתִּי
  choice: maintenant je sais
  rationale: Cette traduction directe conserve la formulation temporelle et la tension théologique du texte hébreu.
- source_word: יְרֵא אֱלֹהִים
  choice: tu crains Dieu
  rationale: La formulation directe préserve le langage biblique de la crainte de Dieu, qui inclut ici révérence et obéissance, sans le réduire à une simple émotion.
- source_word: חָשַׂכְתָּ
  choice: tu ne m’as pas refusé
  rationale: חשׂך signifie retenir, refuser ou épargner. Avec מִמֶּנִּי, « ne pas refuser à quelqu’un » constitue une construction française naturelle et conserve l’idée de ne pas garder son fils loin de Dieu.
- source_word: בִּנְךָ אֶת יְחִידְךָ
  choice: ton fils, ton unique
  rationale: La juxtaposition « ton fils, ton unique » reproduit l’apposition emphatique de l’hébreu et évite d’ajouter lexicalement « bien-aimé ». Une note explicite ce tour volontairement marqué.
- source_word: מִמֶּנִּי
  choice: m’as
  rationale: Le complément « à moi/de moi » est rendu idiomatiquement par le pronom indirect dans « tu ne m’as pas refusé », équivalent naturel de l’idée hébraïque de retenir loin de Dieu.
theological_decisions:
- issue: La connaissance divine dans « maintenant je sais »
  choice: Conserver « maintenant je sais » sans atténuation.
  alternative: « maintenant je vois » ou « maintenant il est manifeste »
  rationale: L’hébreu affirme explicitement « maintenant je sais ». La traduction préserve cette expression relationnelle ou anthropomorphique et sa tension théologique, sans l’expliquer à la place du texte.
- issue: Le statut d’Isaac comme « unique »
  choice: Rendre יְחִידְךָ par « ton unique » et préciser en note le sens contextuel.
  alternative: « ton fils unique » ou « ton bien-aimé »
  rationale: Abraham a aussi Ismaël ; « unique » est donc conservé comme désignation emphatique d’Isaac dans ce contexte particulier, sans résoudre l’expression par un ajout doctrinal ou affectif.
translation_notes:
  register: Français international moderne, simple et digne. Le discours garde la solennité narrative sans archaïsmes. « Porter la main sur » est idiomatique ; « maintenant je sais » demeure volontairement littéral afin de préserver la tension du texte.
