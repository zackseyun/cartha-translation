  text: Késed[a], Hazo, Pildash, Yidlaph et Bethouel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi les translittérations « Kesed », « Chazo » et « Yidlaf ».
    reason: Variantes de translittération des noms hébreux; la note préserve les principales possibilités sans modifier leur statut de noms propres.
lexical_decisions:
- source_word: כֶּשֶׂד
  choice: Késed
  rationale: Nom propre translittéré selon l’usage français; l’accent aigu aide à indiquer naturellement la voyelle initiale sans traduire le nom.
- source_word: חֲזוֹ
  choice: Hazo
  rationale: Nom propre translittéré sous une forme simple et lisible en français; le h représente la consonne hébraïque sans imposer une prononciation savante.
- source_word: פִּלְדָּשׁ
  choice: Pildash
  rationale: Translittération directe du nom propre, avec « sh », graphie largement compréhensible en français international pour le son final.
- source_word: יִדְלָף
  choice: Yidlaph
  rationale: Le y initial rend directement le yod hébreu; « ph » conserve la forme biblique française traditionnelle du son final.
- source_word: בְּתוּאֵל
  choice: Bethouel
  rationale: Forme française biblique usuelle du nom, naturelle pour le lectorat francophone.
- source_word: וְאֶת / וְאֵת
  choice: et
  rationale: La particule d’objet direct n’est pas exprimée en français; les waw répétés sont rendus par une énumération idiomatique avec « et » avant le dernier nom.
