  text: וַ/יֹּ֨אמֶר אַבְרָהָ֜ם אֶל נְעָרָ֗י/ו שְׁבוּ לָ/כֶ֥ם פֹּה֙ עִֽם הַ/חֲמ֔וֹר וַ/אֲנִ֣י וְ/הַ/נַּ֔עַר נֵלְכָ֖ה עַד כֹּ֑ה וְ/נִֽשְׁתַּחֲוֶ֖ה וְ/נָשׁ֥וּבָה אֲלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: fr
  text: 'Abraham dit à ses jeunes gens : « Restez ici avec l’âne. Le garçon et moi, nous irons là-bas ; nous adorerons[a], puis nous reviendrons vers vous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous nous prosternerons » ; le verbe hébreu désigne plus littéralement le fait de s’incliner profondément ou de se prosterner, souvent dans l’adoration.
    reason: lexical_alternative
  - marker: b
    text: 'Abraham dit littéralement : « nous reviendrons vers vous ». Le texte ne précise pas s’il dissimule ainsi son intention, s’il s’attend à revenir avec Isaac ou s’il exprime sa confiance dans l’intervention de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: נְעָרָיו
  choice: ses jeunes gens
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un accompagnateur. « Jeunes gens » convient aux deux hommes qui accompagnent Abraham, sans leur attribuer un statut plus précis que ne le fait le texte.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: Restez ici
  rationale: Le verbe יָשַׁב peut signifier s’asseoir, demeurer ou rester. Dans cet ordre donné à ceux qui ne doivent pas poursuivre le chemin, « Restez ici » est le français naturel.
- source_word: עִם הַחֲמוֹר
  choice: avec l’âne
  rationale: חֲמוֹר est le terme courant pour l’âne ; cette traduction est précise et usuelle.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: Le garçon et moi
  rationale: נַעַר désigne ici Isaac vu dans sa relation avec Abraham. « Garçon » conserve cette perspective sans trancher plus précisément son âge ; l’ordre des éléments est adapté à l’usage naturel du français.
- source_word: נֵלְכָה עַד כֹּה
  choice: nous irons jusque là-bas
  rationale: La forme volitive et l’expression déictique indiquent le déplacement projeté vers un lieu distinct. « Jusque là-bas » rend à la fois le mouvement et עַד כֹּה.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: nous adorerons
  rationale: שָׁחָה signifie littéralement se courber ou se prosterner et, dans ce contexte sacrificiel, désigne un acte d’adoration. Le sens physique est signalé en note.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: puis nous reviendrons vers vous
  rationale: שׁוּב signifie revenir. Le pluriel de la forme hébraïque est maintenu explicitement. « Puis » rend naturellement en français la succession portée par l’enchaînement des verbes, sans expliquer l’intention d’Abraham.
theological_decisions:
- issue: Le pluriel dans l’annonce du retour d’Abraham
  choice: 'Conserver le pluriel : « nous reviendrons vers vous »'
  alternative: Comprendre ces paroles soit comme une dissimulation, soit comme l’expression de la confiance d’Abraham que lui et Isaac reviendront
  rationale: L’hébreu emploie la première personne du pluriel aussi bien pour l’adoration que pour le retour. La traduction conserve cette formulation sans décider si Abraham dissimule son projet, exprime une attente confiante ou parle de manière intentionnellement ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste simple et oral. Les marqueurs de note sont placés sur les expressions qu’ils expliquent, et l’ambiguïté théologique du pluriel est préservée.
