  text: וַ/יַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּ/בֹּ֗קֶר וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י נְעָרָי/ו֙ אִתּ֔/וֹ וְ/אֵ֖ת יִצְחָ֣ק בְּנ֑/וֹ וַ/יְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ אֶל הַ/מָּק֖וֹם אֲשֶׁר אָֽמַר ל֥/וֹ הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: fr
  text: Abraham se leva de bon matin, sella son âne, prit avec lui ses deux jeunes gens[a] ainsi que son fils Isaac, fendit du bois pour un holocauste, puis se leva et partit vers le lieu que Dieu lui avait indiqué.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses deux serviteurs » ou « ses deux accompagnateurs » ; le mot hébreu peut désigner de jeunes hommes ou des hommes attachés au service de quelqu’un, selon le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: Abraham se leva de bon matin
  rationale: « Se lever de bon matin » exprime naturellement en français le fait de se lever tôt, tout en conservant l’accent narratif sur l’empressement d’Abraham.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: sella son âne
  rationale: Dans ce contexte de voyage, חבש désigne la préparation de l’âne, notamment le fait de le seller ou d’y fixer son équipement.
- source_word: שְׁנֵי נְעָרָיו
  choice: ses deux jeunes gens[a]
  rationale: נְעָרִים peut désigner de jeunes hommes, mais aussi des serviteurs ou des accompagnateurs. Le texte principal conserve le sens lexical large, et la note signale les autres possibilités contextuelles.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: Rend directement l’idée d’accompagnement.
- source_word: וְאֵת יִצְחָק בְּנוֹ
  choice: ainsi que son fils Isaac
  rationale: Cette formulation française naturelle maintient au premier plan la relation filiale explicitée par l’hébreu.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: fendit du bois pour l’holocauste
  rationale: בקע signifie fendre ou débiter en fendant. « Du bois » convient à l’absence d’article dans le groupe hébreu, et « pour l’holocauste » exprime sa destination.
- source_word: עֹלָה
  choice: holocauste
  rationale: Dans le français biblique, « holocauste » est le terme consacré pour cette offrande entièrement consumée, sans nécessiter une paraphrase explicative dans le corps du verset.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: puis se leva et partit
  rationale: La traduction conserve les deux verbes successifs et leur rythme, malgré la répétition de « se leva » au début du verset.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: vers le lieu que Dieu lui avait indiqué
  rationale: Le plus-que-parfait situe naturellement l’indication divine avant le départ. « Indiqué » rend idiomatiquement אמר לוֹ lorsqu’il s’agit d’un lieu communiqué auparavant.
theological_decisions:
- issue: Traduction du terme sacrificiel עֹלָה
  choice: holocauste
  alternative: offrande entièrement brûlée
  rationale: « Holocauste » est l’équivalent français traditionnel et précis de cette catégorie sacrificielle. Il nomme l’offrande consumée sur l’autel sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « se leva » est maintenue parce qu’elle correspond aux deux emplois distincts du verbe dans le récit hébreu. L’ordre « son fils Isaac » est idiomatique en français tout en soulignant le lien filial.
