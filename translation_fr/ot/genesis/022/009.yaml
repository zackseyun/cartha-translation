    rationale: L’hébreu אֲשֶׁר אָמַר־לוֹ signifie littéralement, de façon elliptique en français, « que Dieu lui avait dit »; dans le contexte, il s’agit du lieu que Dieu lui avait indiqué/désigné. « Dont Dieu lui avait parlé » modifie la relation exprimée et n’est pas littéral.
