  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: fr
  text: Ils arrivèrent à l’endroit que Dieu lui avait indiqué[a]. Là, Abraham construisit l’autel[b] et disposa le bois. Il ligota Isaac, son fils, et le plaça sur l’autel, par-dessus le bois[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que Dieu lui avait dit », c’est-à-dire qu’il lui avait indiqué.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « un autel ». L’hébreu porte toutefois l’article défini : « l’autel ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « au-dessus du bois », c’est-à-dire sur le bois qui avait été disposé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils arrivèrent
  rationale: Le pluriel désigne Abraham et Isaac, et le passé simple fait progresser naturellement le récit en français.
- source_word: אֶל הַמָּקוֹם
  choice: à l’endroit
  rationale: « L’endroit » est ici plus naturel que « le lieu » en français courant, tout en conservant la précision spatiale du nom hébreu défini.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: que Dieu lui avait indiqué
  rationale: Dans ce contexte, אָמַר avec le lieu pour antécédent renvoie à l’indication divine antérieure. Le plus-que-parfait marque cette antériorité; une traduction plus formelle est conservée en note.
- source_word: וַיִּבֶן שָׁם אַבְרָהָם אֶת הַמִּזְבֵּחַ
  choice: Là, Abraham construisit l’autel
  rationale: La formulation respecte l’article défini hébreu et présente l’autel précis préparé pour le sacrifice, sans ajouter de symbolisme.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: et disposa le bois
  rationale: ערך exprime l’action de mettre en ordre ou de disposer, notamment dans un contexte sacrificiel.
- source_word: וַיַּעֲקֹד
  choice: Il ligota
  rationale: Le verbe désigne spécifiquement l’action de lier. « Ligota » est direct, actuel et concret, sans atténuer la scène.
- source_word: יִצְחָק בְּנוֹ
  choice: Isaac, son fils
  rationale: Cette tournure suit l’ordre hébreu tout en employant la ponctuation naturelle du français.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: et le plaça sur l’autel
  rationale: שׂים est un verbe général de placement; « plaça » en restitue le sens sans préciser indûment la manière.
- source_word: מִמַּעַל לָעֵצִים
  choice: par-dessus le bois
  rationale: La locution exprime clairement que le corps d’Isaac se trouve sur l’autel, au-dessus du bois qui y a été disposé.
theological_decisions:
- issue: Caractère défini de la structure sacrificielle
  choice: l’autel
  alternative: un autel
  rationale: L’hébreu porte l’article défini. Le texte présente donc l’autel précis construit pour l’acte en cours, sans imposer une interprétation théologique ultérieure.
- issue: Description de l’action de lier Isaac
  choice: Il ligota Isaac, son fils
  alternative: Il attacha Isaac, son fils
  rationale: « Ligota » préserve la force spécifique de עקד et la gravité de l’action, sans l’adoucir ni développer la tradition interprétative de la ligature.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme excessif. Les phrases restent courtes et concrètes, et les notes préservent les ambiguïtés lexicales réelles de l’hébreu.
