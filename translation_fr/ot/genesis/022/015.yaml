  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: fr
  text: L’ange de Yahweh appela Abraham une seconde fois depuis le ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le messager de Yahweh ».'
    reason: 'Variante lexicale : l’hébreu מַלְאָךְ peut signifier « ange » ou « messager ».'
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Le wayyiqtol fait progresser le récit et prend ici naturellement la valeur d’un passé simple. Dans ce contexte d’adresse directe, « appela » rend קרא sans ajouter l’intensité de « cria » ni la solennité de « proclama ».
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager ou un ange. Dans cette formule récurrente de la Genèse désignant un être céleste, « ange » est le choix français le plus naturel, tout en signalant l’autre possibilité en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par le titre traditionnel « le SEIGNEUR », afin de conserver son caractère de nom propre.
- source_word: אֶל אַבְרָהָם
  choice: Abraham
  rationale: Avec le verbe français « appeler » au sens d’adresser la parole à quelqu’un, le complément direct est plus idiomatique que le calque « appela à Abraham ».
- source_word: שֵׁנִית
  choice: une seconde fois
  rationale: Cette formulation conserve la nuance ordinale explicite de שֵׁנִית, plus précisément que le simple « de nouveau ».
- source_word: מִן הַשָּׁמַיִם
  choice: du haut des cieux
  rationale: Cette tournure française naturelle indique l’origine céleste de l’appel et respecte la forme plurielle de שָׁמַיִם sans la réduire au ciel visible.
theological_decisions:
- issue: Interprétation de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: La traduction retient l’expression française habituelle pour un être céleste, sans déterminer s’il s’agit d’un être créé ou d’une manifestation particulière de Dieu. La variante lexicale est conservée en note.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. « Du haut des cieux » est idiomatique et préserve la coloration céleste du texte hébreu.
