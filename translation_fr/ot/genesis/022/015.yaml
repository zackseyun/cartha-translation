  - severity: medium
    issue: La note propose une explication syntaxique non pertinente.
    rationale: שֵׁנִית signifie « une seconde fois » et porte sur l’action d’appeler ; la note sur un placement en tête de phrase et sur l’ordre des appels n’est ni une variante lexicale de מַלְאָךְ ni une ambiguïté utile du verset.
  revised_text: L’ange de Yahweh appela Abraham une seconde fois depuis le ciel.[a]
