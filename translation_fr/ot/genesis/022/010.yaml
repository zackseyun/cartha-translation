  text: וַ/יִּשְׁלַ֤ח אַבְרָהָם֙ אֶת יָד֔/וֹ וַ/יִּקַּ֖ח אֶת הַֽ/מַּאֲכֶ֑לֶת לִ/שְׁחֹ֖ט אֶת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/010.yaml
  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: fr
  text: Alors Abraham tendit la main et prit le couteau pour égorger son fils[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu traduit par « égorger » est plus précis qu’un terme général comme « tuer » et peut avoir une connotation sacrificielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: tendit
  rationale: Dans la construction avec « la main », le verbe décrit le geste d’étendre la main. « Tendit la main » est naturel en français et reste proche de l’image hébraïque.
- source_word: יָדוֹ
  choice: la main
  rationale: 'Le possessif est exprimé idiomatiquement en français par l’article défini après le sujet nommé : « Abraham tendit la main ».'
- source_word: וַיִּקַּח
  choice: prit
  rationale: Rend directement le verbe courant « prendre » sans préciser indûment la manière du geste.
- source_word: הַמַּאֲכֶלֶת
  choice: le couteau
  rationale: Désigne un instrument tranchant employé pour l’abattage. « Couteau » est l’équivalent français le plus clair et le plus naturel dans le fil du récit.
- source_word: לִשְׁחֹט
  choice: pour égorger
  rationale: « Égorger » exprime l’abattage par incision de la gorge et conserve la précision ainsi que les résonances sacrificielles du verbe hébreu, contrairement au terme général « tuer ».
- source_word: בְּנוֹ
  choice: son fils
  rationale: Traduction directe du nom avec suffixe possessif.
- source_word: וַ
  choice: Alors
  rationale: Le waw narratif fait progresser la séquence. « Alors » marque naturellement cette avancée en français moderne.
theological_decisions:
- issue: Faut-il rendre שָׁחַט par un terme à résonance sacrificielle ?
  choice: pour égorger
  alternative: pour tuer
  rationale: Le verbe est plus précis qu’un verbe général signifiant « tuer » et s’emploie notamment pour l’abattage sacrificiel. « Égorger » préserve la force concrète et rituelle de la scène sans imposer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe narrative est fluide, tandis que « égorger » conserve la violence concrète et la possible portée sacrificielle du texte source.
