source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: fr
  text: 'et il dit : « J’ai juré par moi-même — déclaration de Yahweh — : puisque tu as fait cela et que tu n’as pas retenu[a] ton fils, ton fils unique[b], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu n’as pas refusé ton fils » ou « tu n’as pas épargné ton fils ». Le verbe hébreu signifie retenir, garder en réserve ou, dans ce contexte, épargner.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner un enfant « unique » ou quelqu’un qui est unique, sans pareil.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: et il dit
  rationale: Le waw narratif poursuit le récit. Le pronom explicite est naturel en français et renvoie au locuteur identifié dans le contexte précédent.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: J’ai juré par moi-même
  rationale: La formule exprime un serment prêté par le locuteur sur sa propre personne. Le passé composé conserve l’aspect accompli du parfait hébreu et sa portée présente.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Cette formulation garde le caractère solennel de la formule déclarative tout en rendant directement le nom divin יהוה par « Yahweh ».
- source_word: כִּי יַעַן אֲשֶׁר
  choice: puisque
  rationale: La conjonction française exprime naturellement la cause déjà établie sur laquelle repose la promesse qui suit.
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: tu as fait cela
  rationale: « Cela » restitue avec naturel la référence à l’acte qu’Abraham vient d’accomplir, sans le calque pesant « cette chose ».
- source_word: וְלֹא חָשַׂכְתָּ
  choice: et tu ne m’as pas refusé
  rationale: En contexte, le verbe signifie ne pas retenir ou garder pour soi. L’ajout idiomatique de « m’ » rend en français le bénéficiaire implicite sans changer le sens de l’acte décrit.
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: ton fils, ton fils unique
  rationale: La répétition de « fils » est naturelle en français et fait ressortir l’apposition emphatique. « Unique » conserve la valeur d’unicité ou de caractère sans pareil de יָחִיד.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom personnel divin. Sa translittération le distingue du titre אֲדֹנָי et préserve sa fonction dans la déclaration solennelle.
- issue: Portée de יְחִידְךָ appliqué à Isaac
  choice: ton fils unique
  alternative: ton fils, celui qui est unique pour toi
  rationale: Le choix conserve l’expression appositionnelle du texte sans expliquer comment cette unicité s’articule avec l’existence d’Ismaël. Une note signale la nuance possible de « sans pareil » afin de préserver la tension du récit.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe garde le ton solennel du serment tout en évitant les calques peu naturels. Le verset demeure syntaxiquement ouvert, comme l’hébreu, puisque la déclaration se poursuit au verset suivant.
