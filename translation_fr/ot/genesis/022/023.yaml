  - severity: medium
    issue: « Milka donna à Nahor »
    rationale: Dans ce contexte, « donner [des enfants] à » est possible, mais l’objet « ces huit enfants » et la formulation peuvent évoquer un don plutôt que l’acte d’enfanter. « Enfanta à Nahor » reflète plus exactement ילד et le registre généalogique.
