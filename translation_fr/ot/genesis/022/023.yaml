  text: וּ/בְתוּאֵ֖ל יָלַ֣ד אֶת רִבְקָ֑ה שְׁמֹנָ֥ה אֵ֨לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְ/נָח֖וֹר אֲחִ֥י אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/023.yaml
  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: fr
  text: Betouel eut pour fille Rébecca. Ces huit, Milka les enfanta à Nahor[a], frère d’Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Milka enfanta ces huit enfants à Nahor, frère d’Abraham. »'
    reason: La note signale une formulation française plus linéaire tout en préservant le sens de la construction généalogique hébraïque.
lexical_decisions:
- source_word: וּ/בְתוּאֵל
  choice: Betouel
  rationale: Le waw poursuit la généalogie sans qu’un « et » soit nécessaire en français; le nom suit la forme française courante.
- source_word: יָלַד אֶת רִבְקָה
  choice: eut pour fille Rébecca
  rationale: Avec un sujet masculin, la formule exprime la paternité. Cette tournure française naturelle évite l’archaïsme « engendra » et précise le lien indiqué par le contexte.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: ces huit enfants
  rationale: L’hébreu met en relief le nombre et le démonstratif; « enfants » explicite sobrement le référent fourni par la généalogie.
- source_word: יָלְדָה מִלְכָּה
  choice: que Milka donna
  rationale: La formule « donner des enfants à » rend naturellement dans ce contexte généalogique le verbe ילד avec un sujet féminin, tout en restant concise.
- source_word: לְ/נָחוֹר
  choice: à Nahor
  rationale: La préposition ל indique ici le père auquel Milka donna ces enfants.
- source_word: אֲחִי אַבְרָהָם
  choice: frère d’Abraham
  rationale: L’apposition identifie Nahor par son lien de parenté avec Abraham; l’article n’est pas nécessaire en français.
