  source_fidelity: 'Le texte hébreu dit littéralement : « Et Bethuel engendra Rébecca. Ces huit, Milka les enfanta à Nahor, frère d’Abraham. » Le sens généalogique est globalement rendu, mais « Ce sont ces huit enfants » introduit une construction explicative (« ce sont ») absente de l’original, et « donna à Nahor » est moins directement fidèle à ילד que « enfanta à Nahor ».'
  naturalness: « Bethuel eut pour fille Rébecca » est un français moderne et naturel. « Ces huit, Milka les enfanta à Nahor » conserve l’emphase hébraïque tout en restant intelligible dans un registre biblique sobre. « Milka enfanta ces huit enfants à Nahor » serait également fluide, mais atténuerait légèrement la dislocation emphatique.
  terminology: Les formes Betouel, Rébecca, Milka, Nahor et Abraham sont cohérentes avec l’usage biblique français. « Enfanta » convient au registre généalogique et rend explicitement le verbe de naissance avec Milka comme sujet. Aucune question théologique n’est en jeu.
