  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֻּגַּ֥ד לְ/אַבְרָהָ֖ם לֵ/אמֹ֑ר הִ֠נֵּה יָלְדָ֨ה מִלְכָּ֥ה גַם הִ֛וא בָּנִ֖ים לְ/נָח֥וֹר אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: fr
  text: 'Après ces événements, on informa Abraham en ces termes : « Voici que Milka, elle aussi, a donné des fils à ton frère Nahor : »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: Dans ce contexte narratif, דְּבָרִים désigne les faits ou événements précédents plutôt que des paroles.
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: on informa Abraham en ces termes
  rationale: Le passif impersonnel hébreu et לֵאמֹר sont rendus par une formulation française naturelle qui introduit directement le contenu du message.
- source_word: הִנֵּה
  choice: non rendu séparément
  rationale: La particule attire l’attention sur la nouvelle annoncée; en français, cette fonction est suffisamment portée par l’introduction directe du message, sans imposer un « voici » peu naturel ici.
- source_word: גַם הִוא
  choice: elle aussi
  rationale: Conserve l’insistance explicite sur Milka, vraisemblablement en parallèle avec Sara, sans expliciter ce rapprochement.
- source_word: יָלְדָה ... בָּנִים
  choice: a donné des fils
  rationale: Rend l’accompli hébreu et le pluriel masculin בָּנִים dans une tournure française idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles « Milka » et « Nahor ». Le deux-points final est conservé, puisque le verset introduit la liste qui suit.
