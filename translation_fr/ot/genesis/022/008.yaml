  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: fr
  text: 'Abraham dit : « Dieu se pourvoira de l’agneau pour l’holocauste[a], mon fils. » Et tous deux poursuivirent ensemble leur chemin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Dieu verra pour lui-même l’agneau pour l’holocauste. » Le verbe hébreu peut signifier « voir » ou, dans cette expression idiomatique, « pourvoir » ou « veiller à » ce qui est nécessaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Abraham dit
  rationale: Le waw consécutif fait avancer le récit. « Dit » rend simplement le verbe sans préciser davantage s’il s’agit d’une réponse, même si le contexte est dialogué.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Équivalent français naturel du terme hébreu désignant ici Dieu dans les paroles d’Abraham.
- source_word: יִרְאֶה לּוֹ
  choice: se pourvoira lui-même de
  rationale: Le verbe ראה signifie littéralement « voir », mais prend ici le sens idiomatique de « voir à, pourvoir ». La tournure pronominale avec « lui-même » conserve la nuance de לּוֹ, selon laquelle Dieu veillera personnellement à ce qui est nécessaire pour lui.
- source_word: הַשֶּׂה
  choice: l’agneau
  rationale: שֶׂה désigne une tête de petit bétail, mouton ou chèvre, souvent jeune. « Agneau » est naturel dans ce contexte sacrificiel et correspond à la question d’Isaac au verset précédent.
- source_word: לְעֹלָה
  choice: pour l’holocauste
  rationale: עֹלָה est le terme sacrificiel consacré pour une offrande entièrement brûlée. « Holocauste » demeure le terme biblique français précis et concis.
- source_word: בְּנִי
  choice: mon fils
  rationale: Cette apostrophe directe conserve le lien familial et la charge affective de la scène.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: Et tous deux poursuivirent ensemble leur chemin
  rationale: La formulation préserve l’insistance hébraïque sur les deux personnages avançant ensemble, tout en étant idiomatique en français.
theological_decisions:
- issue: Sens de l’affirmation d’Abraham concernant l’action de Dieu
  choice: Dieu se pourvoira lui-même de l’agneau pour l’holocauste
  alternative: Dieu verra lui-même l’agneau pour l’holocauste / Dieu veillera lui-même à l’agneau pour l’holocauste
  rationale: Le contexte favorise le sens idiomatique de provision, tandis que la note conserve le sens littéral « voir ». La traduction ne décide pas si Abraham parle de manière évasive, prophétique, ou à la fois évasive et prophétique.
translation_notes:
  register: Français international moderne, digne et narratif. « Se pourvoir de » est légèrement soutenu, mais naturel dans ce contexte solennel et particulièrement apte à conserver la nuance du pronom hébreu. La répétition de « tous deux » et « ensemble » maintient l’insistance émotive du texte source.
