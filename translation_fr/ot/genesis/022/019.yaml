  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: fr
  text: Abraham revint vers ses jeunes gens[a]. Ils se levèrent et allèrent ensemble à Beer-Shéba. Abraham habita à Beer-Shéba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « Abraham revint vers ses jeunes gens. » Isaac n’est pas mentionné dans cette proposition, bien qu’il soit présent dans le récit précédent.'
    reason: Préserver le silence et la tension narrative du texte source sans ajouter Isaac au texte principal.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: revint
  rationale: Le qal de שׁוב exprime ici directement le retour dans la suite du récit; « revint » est naturel et précis.
- source_word: נְעָרָיו
  choice: ses jeunes gens
  rationale: נַעַר peut désigner un jeune homme, un serviteur ou un assistant. « Jeunes gens » conserve le sens lexical sans préciser plus que l’hébreu leur statut, déjà discernable dans le contexte.
- source_word: וַיָּקֻמוּ
  choice: ils se levèrent
  rationale: קום marque ici le commencement de l’action suivante. « Se levèrent » convient au registre narratif digne sans être archaïque.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: partirent ensemble
  rationale: הלך avec יַחְדָּו indique un déplacement accompli en commun; « partirent ensemble » est idiomatique et n’ajoute pas l’idée spécifique de marcher.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-Shéba
  rationale: Le nom de lieu est translittéré selon une forme française courante.
- source_word: וַיֵּשֶׁב
  choice: habita
  rationale: ישׁב peut signifier s’asseoir, demeurer ou habiter. Avec un lieu de résidence, « habita » rend naturellement le sens sans impliquer nécessairement une nouvelle installation.
theological_decisions:
- issue: Seul Abraham est explicitement nommé comme revenant de la montagne, alors qu’Isaac était présent auparavant dans le récit.
  choice: Ne nommer qu’Abraham dans le texte principal, conformément à l’hébreu.
  alternative: Préciser qu’Isaac revint lui aussi, en supposant qu’il est inclus implicitement.
  rationale: L’hébreu dit explicitement qu’Abraham revint vers ses jeunes gens et ne mentionne pas Isaac dans cette proposition. La traduction ne doit ni combler ce silence ni résoudre la tension narrative.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases ont été légèrement segmentées pour une lecture naturelle, tout en conservant la succession narrative de l’hébreu.
