  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: fr
  text: Dans la corbeille du haut se trouvaient toutes sortes de mets pour le pharaon[a], préparés par un boulanger, et les oiseaux les mangeaient de la corbeille au-dessus de ma tête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « œuvre d’un boulanger », c’est-à-dire des produits préparés par un boulanger pour le pharaon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: Dans la corbeille du haut
  rationale: « Du haut » rend naturellement le sens spatial de עֶלְיוֹן dans la série des trois corbeilles.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: toutes sortes de mets pour le pharaon
  rationale: מִכֹּל associé au nom collectif מַאֲכַל exprime ici la variété. « Mets » convient à de la nourriture destinée à la table royale.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: préparés par un boulanger
  rationale: Littéralement « ouvrage d’un boulanger » ; la formulation française explicite naturellement qu’il s’agit de produits préparés par celui-ci sans préciser davantage leur nature.
- source_word: וְהָעוֹף
  choice: et les oiseaux
  rationale: עוֹף est un collectif désignant les oiseaux ou créatures volantes ; le pluriel français convient au contexte.
- source_word: אֹכֵל
  choice: mangeaient
  rationale: Le participe présente une action en cours dans la scène du rêve ; l’imparfait français en restitue l’aspect.
- source_word: אֹתָם
  choice: les
  rationale: Le suffixe masculin pluriel renvoie aux divers mets ou produits alimentaires.
- source_word: מִן הַסַּל
  choice: dans la corbeille
  rationale: Avec un verbe de consommation, le français dit idiomatiquement « manger dans la corbeille » pour exprimer la provenance, tout en conservant l’idée de מן.
- source_word: מֵעַל רֹאשִׁי
  choice: au-dessus de ma tête
  rationale: Cette expression préserve la relation spatiale sans imposer l’idée d’un contact direct avec la tête.
