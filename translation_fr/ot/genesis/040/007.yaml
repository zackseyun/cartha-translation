  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: fr
  text: 'Il demanda alors aux fonctionnaires de Pharaon[a] qui étaient avec lui, en détention dans la maison de son maître : « Pourquoi avez-vous le visage abattu aujourd’hui ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux eunuques de Pharaon »; le terme hébreu peut désigner aussi bien des eunuques au sens propre que, plus généralement, des fonctionnaires de la cour royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Il demanda donc
  rationale: Le wayyiqtol fait avancer le récit; « donc » marque naturellement en français le lien avec la scène précédente sans alourdir la narration.
- source_word: סְרִיסֵי פַרְעֹה
  choice: aux fonctionnaires de Pharaon
  rationale: סָרִיס peut désigner des eunuques au sens propre ou, plus largement, des hauts fonctionnaires de cour. Le contexte met surtout en avant leur fonction royale; l’autre sens est signalé en note.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui étaient avec lui
  rationale: La formulation conserve le pronom hébreu, dont le référent contextuel est Joseph.
- source_word: בְמִשְׁמַר בֵּית אֲדֹנָיו
  choice: sous garde dans la maison de son maître
  rationale: « Sous garde » exprime l’état de détention, tandis que « dans la maison de son maître » conserve le lieu indiqué par la construction hébraïque.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles directes sans reproduire artificiellement le participe quotatif « disant ».
- source_word: מַדּוּעַ פְּנֵיכֶם רָעִים
  choice: Pourquoi avez-vous le visage abattu
  rationale: Littéralement, les « visages » sont « mauvais »; il s’agit d’un idiome décrivant une mine triste ou sombre. Le singulier distributif français est naturel pour s’adresser à plusieurs personnes.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français direct et idiomatique de l’expression temporelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en évitant le calque peu naturel « disant ». « Avoir le visage abattu » préserve l’image corporelle de l’expression hébraïque.
