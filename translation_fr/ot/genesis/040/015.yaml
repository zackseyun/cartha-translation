  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: fr
  text: Car j’ai bel et bien été enlevé[a] du pays des Hébreux ; et même ici, je n’ai rien fait qui justifie qu’on me mette dans la fosse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autrement : « j’ai vraiment été volé » ou « j’ai été emporté ». L’hébreu répète le verbe « voler » au moyen d’un infinitif absolu et d’un verbe conjugué afin d’en renforcer l’affirmation.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « fosse » peut désigner un cachot ou une cellule de prison.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication que Joseph donne à l’échanson ; « car » rend naturellement la valeur causale du terme.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: j’ai bel et bien été enlevé
  rationale: La construction associant l’infinitif absolu au verbe conjugué renforce l’affirmation. Pour une personne, « enlevé » exprime naturellement l’idée d’avoir été emporté de force, tandis que « bel et bien » conserve l’emphase hébraïque.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: du pays des Hébreux
  rationale: Rend directement le groupe nominal sans transformer la désignation ethnique en entité géopolitique plus précise que ne le permet le texte.
- source_word: וְגַם פֹּה
  choice: et même ici
  rationale: 'Conserve la valeur additive et emphatique : après avoir été enlevé de son pays, Joseph affirme également son innocence en Égypte.'
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: je n’ai rien fait
  rationale: Expression française idiomatique qui rend la négation absolue de מְאוּמָה, « quoi que ce soit ».
- source_word: כִּי שָׂמוּ אֹתִי
  choice: qui justifie qu’on me mette
  rationale: Dans ce contexte, la proposition exprime l’absence de motif à l’emprisonnement. Cette formulation est naturelle en français tout en conservant le lien entre l’innocence affirmée et la mise en détention.
- source_word: בַּבּוֹר
  choice: dans la fosse
  rationale: « Fosse » préserve l’image concrète de בּוֹר et sa continuité avec les récits d’enfermement de Joseph, sans effacer son emploi contextuel pour un cachot.
