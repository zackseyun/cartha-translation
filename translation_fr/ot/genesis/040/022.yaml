  text: וְ/אֵ֛ת שַׂ֥ר הָ/אֹפִ֖ים תָּלָ֑ה כַּ/אֲשֶׁ֥ר פָּתַ֛ר לָ/הֶ֖ם יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/022.yaml
  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: fr
  text: Mais il pendit le chef des boulangers[a], comme Joseph le leur avait interprété.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le suspendit ». Le verbe hébreu désigne le fait de pendre ou de suspendre quelqu’un; selon le contexte, il peut désigner une mise à mort, un empalement ou l’exposition d’un corps après l’exécution.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Mais
  rationale: La conjonction introduit ici un contraste avec le rétablissement du chef des échansons au verset précédent; le marqueur d’objet direct n’est pas rendu séparément en français.
- source_word: שַׂר הָאֹפִים
  choice: le chef des boulangers
  rationale: שַׂר désigne le responsable d’un groupe ou un haut fonctionnaire; cette formulation est naturelle dans le contexte de la cour.
- source_word: תָּלָה
  choice: fit pendre
  rationale: Le verbe signifie « suspendre, pendre ». La tournure causative convient puisque le pharaon ordonne l’exécution sans nécessairement l’accomplir lui-même; une note préserve l’incertitude sur la forme précise du supplice ou de l’exposition.
- source_word: כַּאֲשֶׁר
  choice: exactement comme
  rationale: Cette expression marque la correspondance entre l’événement et l’interprétation antérieure de Joseph.
- source_word: פָּתַר
  choice: avait annoncé en interprétant leurs rêves
  rationale: פתר signifie interpréter, particulièrement un rêve. En français, l’explicitation « leurs rêves » fournit naturellement le complément sous-entendu, tandis que « annoncé » exprime que le sort des deux hommes leur avait été communiqué par cette interprétation.
- source_word: לָהֶם
  choice: le leur
  rationale: Le pronom pluriel renvoie aux deux fonctionnaires; « leur » conserve ce référent collectif.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et usuelle du nom יוֹסֵף.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Chef des boulangers » reste accessible tout en conservant le cadre officiel de la cour. La formulation explicite le contexte onirique sans prétendre préciser la méthode d’exécution, qui demeure signalée comme incertaine dans la note.
