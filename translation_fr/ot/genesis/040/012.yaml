- source_word: שְׁלֹשֶׁת הַשָּׂרִגִים
  choice: les trois sarments
  rationale: Dans le contexte d’une vigne, « sarments » est le terme français courant et précis pour ses rameaux, sans qu’une note soit nécessaire.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: trois jours
  rationale: La répétition du nombre est maintenue et le nom temporel est traduit littéralement.
- source_word: הֵם
  choice: représentent
  rationale: Dans une explication symbolique de rêve, « représentent » rend clairement et naturellement l’équation exprimée par le pronom indépendant hébreu.
