revisions:
- from: Sur la vigne, il y avait trois sarments[a]. À peine avait-elle bourgeonné que ses fleurs apparurent[b] et que ses grappes mûrirent en raisins.
  to: Et la vigne avait trois sarments[a]. Elle bourgeonnait, ses fleurs apparurent[b], et ses grappes donnèrent des raisins mûrs.
