  text: and on the vine were three branches[a]. As it was budding, its blossoms came up[b], and its clusters ripened into grapes.
translation:
  language: fr
  text: Et la vigne avait trois sarments[a]. Elle bourgeonnait, ses fleurs apparurent[b], et ses grappes donnèrent des raisins mûrs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trois pousses » ou « trois rameaux ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et elle, comme fleurissante, sa fleur monta ». La phrase décrit la progression rapide de la vigne, du bourgeonnement à la floraison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: Sur la vigne
  rationale: La préposition ב avec l’article situe naturellement les sarments sur la vigne en français; la coordination initiale peut être omise dans ce fragment sans perte de sens.
- source_word: שָׂרִיגִם
  choice: sarments
  rationale: « Sarments » est le terme français précis et courant pour les rameaux de la vigne; « pousses » reste une autre possibilité.
- source_word: כְפֹרַחַת
  choice: À peine avait-elle bourgeonné
  rationale: Cette formulation rend la valeur temporelle du participe précédé de כ et souligne l’enchaînement rapide des stades de croissance.
- source_word: עָלְתָה נִצָּהּ
  choice: ses fleurs apparurent
  rationale: Le singulier collectif hébreu désigne la floraison; le pluriel français est naturel, tandis qu’« apparurent » exprime clairement son émergence.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: ses grappes mûrirent en raisins
  rationale: Cette tournure conserve l’emploi prédicatif de « raisins » et la progression condensée de la vigne jusqu’au fruit mûr.
theological_decisions: []
