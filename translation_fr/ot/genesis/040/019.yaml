base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: fr
  text: Dans trois jours encore, le pharaon t’enlèvera la tête[a], puis il te pendra à un arbre[b], et les oiseaux mangeront ta chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « élèvera ta tête de dessus toi ». C’est vraisemblablement un jeu de mots macabre sur la même expression, employée dans un sens favorable au verset 13 ; ici, elle implique l’enlèvement de la tête.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à du bois », voire « à un poteau ». Le mot hébreu signifie littéralement « arbre » ou « bois » et ne précise pas la forme exacte de l’instrument.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: D’ici trois jours
  rationale: Cette tournure française naturelle exprime le délai restant avant l’événement sans archaïsme.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: enlèvera ta tête de dessus toi
  rationale: « Enlèvera » conserve l’écho avec l’idée de relever ou d’élever la tête tout en rendant perceptible, grâce à « de dessus toi », le sens sinistre de décapitation dans ce contexte.
- source_word: וְתָלָה אוֹתְךָ עַל עֵץ
  choice: puis il te pendra à un arbre
  rationale: תלה signifie « pendre » et עֵץ « arbre » ou « bois ». « À un arbre » préserve l’image concrète et les résonances intertextuelles sans trancher la forme exacte de l’instrument d’exécution.
- source_word: וְאָכַל הָעוֹף
  choice: et les oiseaux mangeront
  rationale: Le singulier hébreu a une valeur collective ; le pluriel est idiomatique en français. « Mangeront » restitue sobrement le sens ordinaire de אכל.
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: ta chair sur toi
  rationale: « Chair » garde la force concrète de בשר. La formulation conserve aussi, autant que le permet le français, la répétition de מֵעָלֶיךָ et l’image de la chair dévorée sur le corps exposé.
theological_decisions:
- issue: Conserver le jeu de mots macabre et la violence de l’oracle d’exécution
  choice: 'Maintenir une formulation proche de l’hébreu : « enlèvera ta tête de dessus toi » et « te pendra à un arbre »'
  alternative: 'Expliciter : « te fera décapiter et suspendra ton corps à un poteau »'
  rationale: L’explicitation communiquerait clairement le résultat, mais supprimerait l’écho littéraire avec la même expression employée favorablement pour l’échanson. Le texte retenu préserve l’ironie narrative sans atténuer le jugement.
- issue: Nature exacte de l’exposition du condamné
  choice: Ne pas préciser si le condamné est pendu vivant, exécuté autrement puis exposé, ou empalé
  alternative: Traduire explicitement par « empalera » ou « suspendra ton cadavre »
  rationale: Le contexte indique une exécution et l’exposition du corps, mais les mots hébreux ne déterminent pas à eux seuls toute la procédure. La traduction conserve donc cette ambiguïté.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe demeure volontairement légèrement heurtée dans « de dessus toi » et « sur toi » afin de préserver la répétition hébraïque, le jeu de mots et la violence concrète de l’image.
