  source_fidelity: Le projet rend correctement l’annonce d’exécution, la suspension à un עֵץ et les oiseaux mangeant la chair. Toutefois, « D’ici trois jours » peut signifier « dans un délai maximal de trois jours » et ne restitue pas aussi nettement la valeur de « encore » de בְּעוֹד. Les formulations « de dessus toi » et surtout « ta chair sur toi » ne sont ni idiomatiques ni sémantiquement naturelles en français.
  naturalness: Une correction est nécessaire pour un français international actuel. « Pharaon t’enlèvera la tête » est une expression française claire, tout en laissant la note signaler l’idiome hébreu et son jeu littéraire. « Les oiseaux mangeront ta chair » est naturel et conserve la force concrète de l’hébreu sans introduire l’image fautive de chair « sur » la personne.
  terminology: « Pharaon », « arbre », « oiseaux » et « chair » conviennent. « Pendra à un arbre » maintient l’ambiguïté du mode précis d’exécution et d’exposition; la note offre les possibilités « bois » et « poteau » sans les imposer.
