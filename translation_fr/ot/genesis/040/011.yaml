base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: fr
  text: La coupe de Pharaon était dans ma main. J’ai pris les raisins, j’en ai pressé le jus dans la coupe de Pharaon, puis j’ai mis la coupe dans la main de Pharaon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la paume de Pharaon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: coupe
  rationale: « Coupe » désigne naturellement un récipient à boire et convient au contexte de la cour royale.
- source_word: בְּיָדִי
  choice: dans ma main
  rationale: Cette formulation concrète et idiomatique conserve l’image vive du récit du rêve.
- source_word: וָאֶקַּח
  choice: j’ai pris
  rationale: Équivalent narratif simple et direct du verbe לקח.
- source_word: הָעֲנָבִים
  choice: les raisins
  rationale: Équivalent lexical direct, avec maintien de l’article défini.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: je les ai pressés dans la coupe de Pharaon
  rationale: Le verbe שׂחט exprime ici l’action de presser pour faire sortir le liquide. La formulation française rend clairement le geste sans ajouter explicitement « le jus », absent du texte.
- source_word: וָאֶתֵּן
  choice: j’ai mis
  rationale: Dans ce contexte concret, נתן décrit le fait de remettre ou placer la coupe dans la main de Pharaon ; « mis » est naturel et précis.
- source_word: עַל כַּף פַּרְעֹה
  choice: dans la main de Pharaon
  rationale: Littéralement « sur la paume de Pharaon ». L’expression idiomatique française décrit naturellement le fait de lui remettre la coupe, tandis qu’une note conserve l’image hébraïque.
