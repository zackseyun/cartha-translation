source:
  edition: WLC
  text: וַ/יָּ֛שֶׁב אֶת שַׂ֥ר הַ/מַּשְׁקִ֖ים עַל מַשְׁקֵ֑/הוּ וַ/יִּתֵּ֥ן הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: fr
  text: Il rétablit le chef des échansons dans sa fonction[a], et celui-ci plaça la coupe dans la main du pharaon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à son service d’échanson ».'
    reason: Précise l’image professionnelle concrète de l’expression hébraïque rendue par « fonction ».
  - marker: b
    text: L’hébreu dit simplement « et il plaça » ; d’après le contexte, le sujet est le chef des échansons.
    reason: Signale l’implicite grammatical du texte source et explique l’explicitation du sujet en français.
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: Il rétablit
  rationale: Le hiphil de שׁוב exprime ici le fait de faire revenir quelqu’un à sa position antérieure. « Rétablir » rend naturellement cette réintégration dans une fonction.
- source_word: שַׂר הַמַּשְׁקִים
  choice: le chef des échansons
  rationale: שַׂר désigne le responsable ou chef, et הַמַּשְׁקִים les serviteurs chargés des boissons. « Chef des échansons » est précis, concis et adapté au contexte de cour.
- source_word: עַל מַשְׁקֵהוּ
  choice: dans sa fonction
  rationale: L’expression désigne concrètement le service des boissons qui lui était confié. Le français « dans sa fonction » communique clairement la reprise de sa charge, tandis qu’une note conserve l’image professionnelle de l’hébreu.
- source_word: וַיִּתֵּן
  choice: plaça
  rationale: נתן signifie couramment « donner », mais avec la coupe et la main comme complément, « placer » exprime naturellement le geste accompli.
- source_word: הַכּוֹס
  choice: la coupe
  rationale: Équivalent direct du nom concret, approprié au service royal des boissons.
- source_word: עַל כַּף פַּרְעֹה
  choice: dans la main du pharaon
  rationale: כַּף désigne littéralement la paume, mais l’expression française idiomatique est « dans la main ». Le titre « le pharaon » convient ici au souverain égyptien.
theological_decisions:
- issue: Sujet implicite de וַיִּתֵּן dans la seconde proposition
  choice: celui-ci, renvoyant au chef des échansons
  alternative: il, grammaticalement susceptible de renvoyer au pharaon
  rationale: L’hébreu ne répète pas le sujet nominal, mais le contexte immédiat et Genèse 40:13 indiquent que le chef des échansons reprend son service en plaçant la coupe dans la main du pharaon. « Celui-ci » explicite le référent sans ajouter un nom absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Chef des échansons » conserve le vocabulaire de cour traditionnel tout en restant compréhensible. La syntaxe évite un pronom ambigu qui pourrait faire du pharaon l’auteur du second geste.
