  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: fr
  text: Le chef des gardes affecta Joseph auprès d’eux[a], et celui-ci s’occupa d’eux. Ils restèrent quelque temps en détention.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chargea Joseph de les assister » ou « plaça Joseph auprès d’eux ». Le verbe hébreu peut désigner l’attribution d’une responsabilité, sans préciser à lui seul si Joseph devait principalement les servir ou les superviser.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: confia
  rationale: Dans ce contexte, פקד exprime l’attribution d’une responsabilité. « Confia Joseph à leur service » rend cette désignation sans imposer l’idée plus forte qu’il aurait été placé à leur tête.
- source_word: שַׂר הַטַּבָּחִים
  choice: le chef des gardes
  rationale: Le titre désigne ici un haut responsable de la sécurité royale. « Chef des gardes » est naturel en français et convient à son rôle dans le récit.
- source_word: אֶת יוֹסֵף אִתָּם
  choice: Joseph à leur service
  rationale: La construction place Joseph auprès des deux détenus dans le cadre d’une responsabilité. Cette formulation s’accorde avec le verbe suivant tout en préservant en note la possibilité d’une fonction de surveillance.
- source_word: וַיְשָׁרֶת אֹתָם
  choice: et celui-ci s’occupa d’eux
  rationale: שרת signifie servir ou assister. « S’occupa d’eux » exprime ici un service personnel dans un français courant, sans connotation cultuelle.
- source_word: וַיִּהְיוּ יָמִים
  choice: Ils restèrent quelque temps
  rationale: L’expression littérale « ils furent des jours » est un idiome indiquant une durée indéterminée.
- source_word: בְּמִשְׁמָר
  choice: sous bonne garde
  rationale: מִשְׁמָר évoque la garde ou la détention surveillée. « Sous bonne garde » conserve cette idée sans réduire nécessairement le terme au bâtiment d’une prison.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La coordination hébraïque est conservée sans lourdeur excessive. Le verset évite le religieux « les servir » et rend l’idiome temporel de manière naturelle.
