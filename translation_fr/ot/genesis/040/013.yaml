  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: fr
  text: Encore trois jours, et le pharaon relèvera ta tête[a] et te rétablira dans ta fonction. Tu mettras la coupe du pharaon dans sa main, selon l’usage d’autrefois, quand tu étais son échanson.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « relever la tête » indique ici que le pharaon lui accordera une attention favorable et le rétablira dans sa fonction ; sa reprise au verset 19 introduit toutefois un dénouement opposé.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Encore trois jours, et
  rationale: Cette tournure française naturelle exprime le délai restant avant l’événement et conserve la valeur prospective de l’expression hébraïque.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: relèvera ta tête
  rationale: La formulation concrète de l’hébreu est conservée afin de préserver l’image et son lien littéraire avec l’emploi contrasté de la même expression au verset 19. La proposition suivante en indique ici le sens favorable.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: te rétablira dans ta fonction
  rationale: כֵּן désigne ici la place ou la charge établie du serviteur à la cour. « Fonction » est précis et naturel dans ce contexte.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: Tu mettras la coupe du pharaon dans sa main
  rationale: Cette traduction garde le geste concret exprimé par נתן et convient au service officiel de l’échanson.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: selon l’usage d’autrefois
  rationale: מִשְׁפָּט désigne ici la pratique ou la manière établie selon laquelle il servait auparavant le pharaon.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: quand tu étais son échanson
  rationale: מַשְׁקֶה désigne la charge officielle de celui qui présente la boisson au souverain ; « échanson » est le terme français précis et consacré.
theological_decisions:
- issue: Sens de l’expression « relever la tête »
  choice: Conserver l’expression imagée dans le texte et en expliciter le sens contextuel en note.
  alternative: Traduire directement par « te fera grâce » ou « te réhabilitera ».
  rationale: Le texte annonce ici une restauration favorable sans abandonner une expression qui recevra une extension funeste au verset 19. La conserver respecte la tension littéraire du récit.
translation_notes:
  register: Français international moderne, clair et digne. L’article est employé devant « pharaon » comme titre dans l’usage français courant. « Échanson » est maintenu malgré son caractère légèrement historique, car il désigne précisément la charge de cour concernée.
