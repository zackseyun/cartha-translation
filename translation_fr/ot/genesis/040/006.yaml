  text: וַ/יָּבֹ֧א אֲלֵי/הֶ֛ם יוֹסֵ֖ף בַּ/בֹּ֑קֶר וַ/יַּ֣רְא אֹתָ֔/ם וְ/הִנָּ֖/ם זֹעֲפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: fr
  text: 'Joseph vint auprès d’eux le matin et les vit : voici qu’ils étaient troublés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « abattus », « sombres » ou « renfrognés ». Le terme hébreu décrit un état de trouble visible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: vint auprès d’eux
  rationale: Cette formulation rend le mouvement vers les deux prisonniers sans préciser indûment que Joseph entra dans un lieu.
- source_word: בַּבֹּקֶר
  choice: le matin
  rationale: Expression temporelle naturelle en français moderne, fidèle à la tournure hébraïque.
- source_word: וַיַּרְא אֹתָם
  choice: les vit
  rationale: Le verbe ראה avec complément d’objet exprime ici la perception directe; « les vit » conserve la simplicité du récit.
- source_word: וְהִנָּם
  choice: voici qu’ils
  rationale: « Voici que » restitue la valeur présentative de הִנֵּה, qui attire l’attention sur l’état que Joseph remarqua.
- source_word: זֹעֲפִים
  choice: troublés
  rationale: Le participe décrit un état émotionnel visiblement perturbé. « Troublés » en préserve l’étendue sans le réduire à la colère ou à la tristesse.
