  text: וַ/יְסַפֵּ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת חֲלֹמ֖/וֹ לְ/יוֹסֵ֑ף וַ/יֹּ֣אמֶר ל֔/וֹ בַּ/חֲלוֹמִ֕/י וְ/הִנֵּה גֶ֖פֶן לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: fr
  text: 'Le chef des échansons raconta donc son rêve à Joseph et lui dit : « Dans mon rêve, voici qu’une vigne était devant moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: raconta
  rationale: Au piel, ספר signifie ici raconter ou relater. « Raconta » convient naturellement au récit d’un rêve et conserve l’idée d’un exposé suivi.
- source_word: שַׂר הַמַּשְׁקִים
  choice: le chef des échansons
  rationale: La locution désigne le haut fonctionnaire responsable des boissons du souverain. « Chef des échansons » est précis, digne et bien établi en français biblique, sans le confondre avec un domestique ordinaire.
- source_word: אֶת חֲלֹמוֹ
  choice: son rêve
  rationale: Le nom חֲלוֹם muni du suffixe masculin singulier signifie directement « son rêve ».
- source_word: לְיוֹסֵף
  choice: à Joseph
  rationale: La préposition לְ marque ici le destinataire du récit.
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: Cette formulation française restitue explicitement le pronom לוֹ tout en évitant la tournure plus lourde « dit à lui ».
- source_word: בַּחֲלוֹמִי
  choice: Dans mon rêve
  rationale: La préposition בְּ et le suffixe de première personne sont rendus directement par une expression idiomatique en français.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: « Voici que » conserve la fonction présentative et la vivacité de הִנֵּה dans la vision, avec un registre narratif naturel et digne en français moderne.
- source_word: גֶפֶן
  choice: une vigne
  rationale: גֶּפֶן désigne la plante qui porte le raisin. « Une vigne » est l’équivalent français direct dans ce contexte.
- source_word: לְפָנָי
  choice: était devant moi
  rationale: La locution signifie littéralement « devant moi »; le verbe « était » est ajouté comme copule nécessaire en français, sans introduire l’idée plus spécifique qu’elle se tenait debout.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Échanson » est un terme historique précis; le pluriel dans « chef des échansons » rend naturellement le groupe nominal hébreu. La tournure « voici qu’ » préserve l’effet d’apparition soudaine de l’image du rêve sans recourir à l’archaïsme « voici » isolé ou à « behold » calqué.
