source:
  edition: WLC
  text: וַ/יִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑י/ו עַ֚ל שַׂ֣ר הַ/מַּשְׁקִ֔ים וְ/עַ֖ל שַׂ֥ר הָ/אוֹפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: fr
  text: 'Le pharaon se mit en colère contre ses deux hauts fonctionnaires[a] : contre le chef des échansons et contre le chef des boulangers.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses deux dignitaires de cour » ; le terme hébreu peut aussi désigner des eunuques dans certains contextes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: se mit en colère
  rationale: Le verbe קצף exprime la colère. Dans cette séquence narrative, « se mit en colère » rend naturellement la progression portée par le wayyiqtol sans en exagérer l’intensité.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Titre royal établi en français ; l’article défini convient à l’usage narratif français.
- source_word: שְׁנֵי סָרִיסָיו
  choice: ses deux hauts fonctionnaires
  rationale: סָרִיס peut désigner un eunuque ou un fonctionnaire de cour. Ici, les fonctions royales précisées ensuite favorisent le sens de hauts fonctionnaires, sans rien affirmer de leur condition physique.
- source_word: שַׂר הַמַּשְׁקִים
  choice: le chef des échansons
  rationale: שַׂר désigne le responsable, et מַשְׁקִים ceux qui servent à boire. « Chef des échansons » est un titre français précis et traditionnel.
- source_word: שַׂר הָאֹפִים
  choice: le chef des boulangers
  rationale: La formulation rend directement le responsable du groupe des boulangers et conserve le pluriel hébreu.
- source_word: עַל ... עַל ... וְעַל
  choice: 'contre… : contre… et contre…'
  rationale: Après un verbe de colère, « contre » est idiomatique en français. La répétition préserve la structure hébraïque, tandis que les deux-points rendent explicite que les deux titres identifient les deux fonctionnaires.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les deux-points clarifient l’apposition sans effacer la répétition de la préposition dans l’hébreu. « Échansons » est un terme historique précis, légèrement soutenu mais largement intelligible dans le contexte biblique.
