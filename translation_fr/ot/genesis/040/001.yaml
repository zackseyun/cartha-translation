  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: fr
  text: Après ces événements[a], l’échanson du roi d’Égypte et le boulanger péchèrent contre leur maître, le roi d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Après ces choses. » La formule narrative hébraïque peut se rendre plus littéralement : « Et il arriva, après ces choses… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: Cette formule narrative introduit une nouvelle étape du récit. « Après ces événements » est naturel en français moderne tout en conservant le lien avec ce qui précède; la forme plus littérale est signalée en note.
- source_word: חָטְאוּ
  choice: péchèrent contre
  rationale: Le verbe חטא, construit ici avec ל pour désigner la personne lésée, exprime une faute commise contre quelqu’un. « Péchèrent contre » en préserve la portée morale et relationnelle sans la réduire au simple fait de déplaire.
- source_word: מַשְׁקֵה
  choice: l’échanson
  rationale: Le terme désigne le serviteur chargé des boissons du roi. « Échanson » est le terme français précis et traditionnel pour cette fonction de cour, sans ajouter le rang de chef, absent du verset.
- source_word: הָאֹפֶה
  choice: le boulanger
  rationale: La forme définie signifie directement « le boulanger ». Cette traduction évite d’introduire un possessif ou un rang qui ne sont pas explicitement présents.
- source_word: לַאֲדֹנֵיהֶם
  choice: contre leur maître
  rationale: אדון désigne ici leur supérieur humain. « Maître » convient au rapport entre des serviteurs de cour et le roi, sans suggérer un titre divin.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: le roi d’Égypte
  rationale: L’apposition identifie leur maître. La répétition de « roi d’Égypte » suit l’insistance du texte hébreu et demeure claire en français.
theological_decisions:
- issue: Portée morale du verbe חטא dans un contexte de cour royale
  choice: péchèrent contre
  alternative: offensèrent / commirent une faute envers
  rationale: Le français « pécher contre » conserve la force morale possible du verbe et la relation à la personne lésée, sans préciser la nature de la faute que le texte laisse indéterminée.
translation_notes:
  register: Français international moderne, sobre et digne. « Échanson » est un terme de fonction historique précis; le reste de la phrase privilégie une syntaxe directe. Le passé simple convient au registre narratif biblique écrit sans être archaïque.
