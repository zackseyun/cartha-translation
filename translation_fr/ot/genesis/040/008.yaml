review_pass:
  verdict: revise
  source_fidelity: La source hébraïque dit littéralement « un rêve, nous avons rêvé » et emploie ensuite un objet implicite au singulier dans l’invitation de Joseph. Le singulier doit être préservé sans tirer du contexte ultérieur la conclusion explicite que chacun a fait un rêve distinct. Le waw coordonnant est mieux rendu par « et » que par « mais ».
  naturalness: « Faire un rêve », « personne pour l’interpréter » et la question rhétorique négative sont naturels en français moderne. « Racontez-le-moi, je vous prie » rend idiomatiquement l’invitation polie, tout en conservant le singulier du texte.
  terminology: « Joseph », « Dieu » et « interprétations » conviennent. « Appartiennent à Dieu » respecte la formulation de possession/autorité ou de provenance sans la réduire à une interprétation théologique plus étroite.
  issues:
  - severity: medium
    issue: « vos rêves » explicite un pluriel absent du texte source.
    rationale: Le contexte montrera que les deux hommes racontent chacun un rêve, mais le discours rapporté ici emploie חֲלוֹם au singulier et l’objet de « racontez » reste implicite. « Vos rêves » harmonise prématurément le verset avec le contexte et modifie le nombre exprimé.
  - severity: low
    issue: « mais » remplace la coordination simple de וּ.
    rationale: La seconde proposition décrit la difficulté consécutive au rêve, sans opposition marquée dans l’hébreu. « Et » est plus fidèle tout en restant naturel.
  - severity: low
    issue: « donc » ne rend pas précisément la particule polie נָא.
    rationale: נָא exprime une requête ou invitation polie (« je vous prie ») plutôt qu’une conséquence argumentative.
  revised_text: 'Ils lui répondirent : « Nous avons fait un rêve, et il n’y a personne pour l’interpréter. » Joseph leur dit : « Les interprétations n’appartiennent-elles pas à Dieu ? Racontez-le-moi, je vous prie. »'
