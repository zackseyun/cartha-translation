  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: fr
  text: 'Ils lui répondirent : « Nous avons fait un rêve, et il n’y a personne pour l’interpréter. » Joseph leur dit : « Les interprétations n’appartiennent-elles pas à Dieu ? Racontez-le-moi, je vous prie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: Nous avons fait un rêve
  rationale: Le français idiomatique dit « faire un rêve ». Cette formulation rend naturellement l’accusatif interne hébreu, littéralement « un rêve, nous avons rêvé », tout en gardant l’idée d’un rêve communément rapporté par les deux hommes.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: mais il n’y a personne pour l’interpréter
  rationale: Le participe actif פֹתֵר désigne celui qui interprète. La tournure verbale française est naturelle et conserve l’absence d’un interprète disponible, sans affirmer que personne n’en serait capable.
- source_word: הֲלוֹא
  choice: n’… pas
  rationale: La forme interrogative négative rend la question rhétorique qui attend une réponse affirmative.
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: Les interprétations n’appartiennent-elles pas à Dieu ?
  rationale: La construction avec ל exprime ici l’appartenance ou la provenance. « Appartiennent à Dieu » préserve cette formulation sans expliciter davantage le mécanisme de l’interprétation.
- source_word: פִּתְרֹנִים
  choice: les interprétations
  rationale: Le pluriel hébreu est conservé et peut désigner les interprétations en général ou celles des différents rêves.
- source_word: סַפְּרוּ נָא לִי
  choice: Racontez-moi donc vos rêves
  rationale: סִפֵּר signifie raconter ou rapporter, et נָא apporte ici une invitation polie. Le complément, implicite en hébreu, est explicité par « vos rêves » d’après le contexte où chacun des deux hommes a fait son propre rêve.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom biblique.
theological_decisions:
- issue: Référent de אֱלֹהִים dans la déclaration de Joseph
  choice: Dieu
  alternative: un dieu / les dieux
  rationale: Dans le récit de Joseph, celui-ci attribue à Dieu l’interprétation des rêves. Le contexte soutient le référent singulier « Dieu », sans imposer ici une précision doctrinale supplémentaire.
- issue: Nature du lien entre Dieu et les interprétations
  choice: appartiennent à Dieu
  alternative: viennent de Dieu
  rationale: « Appartiennent à Dieu » suit de près la construction hébraïque avec ל et préserve une légère ouverture entre possession, autorité et provenance, plutôt que de la réduire à la seule idée de source.
translation_notes:
  register: 'Français moderne, international et digne. Le passé simple convient au registre narratif biblique, tandis que les paroles restent directes et naturelles. Aucune note n’est nécessaire : les particularités hébraïques sont rendues clairement dans le corps du verset.'
