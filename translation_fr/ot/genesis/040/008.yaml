  to: 'Ils lui répondirent : « Nous avons fait un rêve, et il n’y a personne pour l’interpréter. » Joseph leur dit : « Les interprétations n’appartiennent-elles pas à Dieu ? Racontez-le-moi, je vous prie. »'
  rationale: La révision conserve le singulier de « rêve » et de son référent implicite, remplace la coordination contrastive non marquée par une coordination neutre, et rend explicitement la politesse de נָא. Elle maintient le pluriel « interprétations », la question rhétorique et le registre narratif moderne.
