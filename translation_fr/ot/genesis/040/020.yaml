base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: fr
  text: Le troisième jour, jour de l’anniversaire de Pharaon, celui-ci donna un banquet à tous ses serviteurs. Parmi eux, il leva la tête[a] du chef des échansons et celle du chef des boulangers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « il leva la tête de ». L’expression peut signifier ici qu’il les fit comparaître ou qu’il s’occupa de leur cas. Le sens littéral est conservé parce que le récit joue sur cette même expression, avec une issue différente pour chacun des deux responsables.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: La formule narrative introduit l’événement suivant. En français actuel, l’indication temporelle suffit sans rendre lourdement וַיְהִי par « il arriva que ».
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: jour de l’anniversaire de Pharaon
  rationale: L’expression désigne le jour de la naissance de Pharaon, donc son anniversaire. Cette formulation reste naturelle tout en conservant la répétition de « jour » présente dans l’hébreu.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: donna un banquet
  rationale: מִשְׁתֶּה désigne un festin ou banquet, souvent associé à la boisson. « Donner un banquet » est l’équivalent idiomatique français du tour verbal hébreu.
- source_word: לְכָל עֲבָדָיו
  choice: à tous ses serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs, agents ou dignitaires de la cour. « Serviteurs » garde l’étendue du terme sans préciser un statut servile que le contexte n’impose pas.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: il releva la tête de
  rationale: Le rendu littéral préserve le jeu narratif avec les deux accomplissements opposés annoncés aux versets 13 et 19. Une paraphrase comme « il distingua » ou « il passa en revue » effacerait ce lien.
- source_word: שַׂר הַמַּשְׁקִים
  choice: le chef des échansons
  rationale: Titre de cour désignant le responsable de ceux qui servent les boissons. « Échanson » est précis et demeure intelligible dans un récit royal.
- source_word: שַׂר הָאֹפִים
  choice: le chef des boulangers
  rationale: Rendu direct du titre parallèle désignant le responsable des boulangers.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: Au milieu d’eux
  rationale: Le pronom reprend naturellement « tous ses serviteurs » et exprime que l’action se déroule publiquement parmi eux, sans répétition pesante.
