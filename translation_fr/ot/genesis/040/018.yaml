  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: fr
  text: 'Joseph répondit : « Voici son interprétation : les trois paniers sont trois jours. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: En français narratif, « répondit » rend naturellement la formule hébraïque double introduisant la réplique; ajouter « et dit » serait lourd et redondant.
- source_word: פִּתְרֹנוֹ
  choice: son interprétation
  rationale: Dans le contexte d’un rêve, פִּתְרוֹן désigne précisément l’interprétation; le possessif renvoie au rêve raconté.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: les trois paniers
  rationale: « Paniers » est l’équivalent français courant de סַל et conserve l’article défini du texte hébreu.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: sont trois jours
  rationale: Cette formulation conserve l’identification directe de la proposition nominale hébraïque plutôt que de l’expliciter par « représentent » ou « signifient ».
