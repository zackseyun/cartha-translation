  text: כִּ֧י אִם זְכַרְתַּ֣/נִי אִתְּ/ךָ֗ כַּ/אֲשֶׁר֙ יִ֣יטַב לָ֔/ךְ וְ/עָשִֽׂיתָ נָּ֥א עִמָּדִ֖/י חָ֑סֶד וְ/הִזְכַּרְתַּ֨/נִי֙ אֶל פַּרְעֹ֔ה וְ/הוֹצֵאתַ֖/נִי מִן הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: fr
  text: 'Mais souviens-toi de moi quand tout ira bien pour toi[a]. Je t’en prie, agis avec bonté envers moi : parle de moi au pharaon et fais-moi sortir de cette maison[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La locution hébraïque peut aussi souligner la restriction : « Seulement, souviens-toi de moi… »'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Littéralement : « de cette maison »; le mot « maison » désigne ici le lieu où Joseph est détenu.'
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: Dans ce contexte, la locution introduit l’appel pressant de Joseph en contraste avec ce qui précède. « Mais » donne une phrase française naturelle, tandis que la possibilité d’une lecture conditionnelle est signalée en note.
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: souviens-toi de moi
  rationale: Le verbe signifie « se souvenir ». Le complément אִתְּךָ, littéralement « avec toi », renforce ici l’idée de garder Joseph présent à l’esprit, sans appeler une traduction séparée et peu idiomatique en français.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: quand tout ira bien pour toi
  rationale: La proposition vise le rétablissement prochain de l’échanson. Cette formulation conserve le sens temporel et exprime naturellement en français l’amélioration de sa situation.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: Je t’en prie, agis avec bonté envers moi
  rationale: נָא marque la supplication polie. Dans cette demande interpersonnelle, חֶסֶד désigne une bonté concrète et loyale, sans qu’il soit nécessaire d’introduire explicitement une notion d’alliance.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: parle de moi au pharaon
  rationale: Le hifil de זכר demande ici que Joseph soit porté à l’attention du pharaon. « Parle de moi » est direct, courant et fidèle à cette fonction causative.
- source_word: וְהוֹצֵאתַנִי
  choice: fais-moi sortir
  rationale: Le hifil de יצא a un sens causatif. « Fais-moi sortir » le préserve plus précisément que le simple « sors-moi ».
- source_word: מִן הַבַּיִת הַזֶּה
  choice: de cette maison
  rationale: Le texte hébreu emploie littéralement « maison », ici pour le lieu de détention. Le conserver dans le texte principal évite de remplacer le terme source par l’interprétation explicite « prison ».
theological_decisions:
- issue: Force de כִּי אִם et relation entre le souvenir demandé et le rétablissement de l’échanson
  choice: 'Une exhortation principale : « Mais… souviens-toi de moi »'
  alternative: 'Une condition : « Mais si tu te souviens de moi quand tout ira bien pour toi… »'
  rationale: La construction peut être comprise comme un appel restrictif ou pressant, mais sa forme exacte demeure discutée. Le texte principal privilégie une demande française cohérente; la note conserve la lecture conditionnelle sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La supplication est rendue sans archaïsme; « pharaon » porte l’article selon l’usage français courant. Les deux-points relient naturellement la bonté demandée aux actes concrets qui la manifesteront.
