  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: fr
  text: 'Quand le chef des boulangers vit que Joseph avait donné une bonne interprétation, il lui dit : « Moi aussi, j’ai eu un rêve : voici que trois corbeilles de pain blanc[a] étaient sur ma tête. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « trois corbeilles de pâtisseries ». Le sens du mot hébreu est incertain : il peut désigner du pain ou des gâteaux blancs, ou qualifier les corbeilles comme ajourées ou tressées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: le chef des boulangers
  rationale: שַׂר désigne ici le responsable ou haut fonctionnaire des boulangers; cette formulation est naturelle et précise en français moderne.
- source_word: כִּי טוֹב פָּתָר
  choice: qu’il avait donné une bonne interprétation
  rationale: La tournure conserve l’évaluation positive exprimée par טוֹב sans la réduire à une interprétation favorable, même si le contexte explique probablement la réaction du boulanger.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: Moi aussi, dans mon rêve
  rationale: Cette formulation respecte l’ajout emphatique « moi aussi » et l’expression elliptique hébraïque, tout en introduisant naturellement le contenu du rêve.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Ce marqueur rend la vivacité de la scène onirique dans un registre français actuel et digne.
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  choice: trois corbeilles de pain blanc
  rationale: חֹרִי est incertain. « pain blanc » retient une compréhension ancienne et contextuellement cohérente, tandis que les autres analyses sont signalées en note.
- source_word: עַל רֹאשִׁי
  choice: sur ma tête
  rationale: Rendu direct et idiomatique de la relation spatiale.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: « Joseph » est la forme française courante et immédiatement reconnaissable du nom hébreu יוֹסֵף.
