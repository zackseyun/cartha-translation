review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : le responsable des boulangers constate le caractère positif/de qualité de l’interprétation de Joseph, puis rapporte son propre rêve, avec trois corbeilles sur sa tête. La difficulté lexicale de חֹרִי est correctement signalée. Toutefois, « Moi aussi, dans mon rêve » ne rend pas avec assez de naturel l’ellipse « moi aussi, dans mon rêve » introduisant un nouveau récit onirique ; « j’ai eu un rêve » explicite sobrement l’ellipse sans ajouter de contenu.'
  naturalness: « Moi aussi, j’ai eu un rêve » est plus idiomatique en français international moderne que l’attaque nominale « Moi aussi, dans mon rêve », tout en conservant l’enchaînement du discours direct. « Voici que » maintient heureusement la vivacité de וְהִנֵּה.
  terminology: '« Le chef des boulangers », « Joseph », « bonne interprétation », « corbeilles » et « sur ma tête » conviennent au registre narratif moderne. La note doit préserver explicitement les deux grandes possibilités : un terme relatif au pain/gâteaux blancs ou une qualification des corbeilles.'
  issues:
  - severity: low
    issue: Formulation elliptique française insuffisamment naturelle pour l’introduction du rêve
    rationale: '« Moi aussi, dans mon rêve, voici qu’il y avait… » est compréhensible, mais la construction sonne calquée. Le français rend naturellement cette ellipse hébraïque par « Moi aussi, j’ai eu un rêve : voici que… ».'
  revised_text: 'Quand le chef des boulangers vit que Joseph avait donné une bonne interprétation, il lui dit : « Moi aussi, j’ai eu un rêve : voici que trois corbeilles de pain blanc[a] étaient sur ma tête. »'
  revised_footnotes:
  - marker: a
    text: 'Ou « trois corbeilles de pâtisseries ». Le sens du mot hébreu est incertain : il peut désigner du pain ou des gâteaux blancs, ou qualifier les corbeilles comme ajourées ou tressées.'
    reason: lexical_alternative
  revision_rationale: La révision remplace une ellipse française quelque peu calquée par une formulation idiomatique qui exprime le fait que le boulanger rapporte lui aussi un rêve. Elle conserve le marqueur de vivacité « voici que », la localisation des trois corbeilles sur sa tête et la note qui préserve l’incertitude de חֹרִי.
