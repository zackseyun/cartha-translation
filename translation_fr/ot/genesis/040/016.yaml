revisions:
- from: 'Quand le chef des boulangers vit que Joseph avait donné une bonne interprétation, il lui dit : « Moi aussi, dans mon rêve, voici qu’il y avait trois corbeilles de pain blanc[a] sur ma tête. »'
  to: 'Quand le chef des boulangers vit que Joseph avait donné une bonne interprétation, il lui dit : « Moi aussi, j’ai eu un rêve : voici que trois corbeilles de pain blanc[a] étaient sur ma tête. »'
  rationale: La révision remplace une ellipse française quelque peu calquée par une formulation idiomatique qui exprime le fait que le boulanger rapporte lui aussi un rêve. Elle conserve le marqueur de vivacité « voici que », la localisation des trois corbeilles sur sa tête et la note qui préserve l’incertitude de חֹרִי.
