  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: fr
  text: Il les plaça sous garde dans la maison du chef des gardes[a], dans la prison[b], là où Joseph était détenu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque rendue par « chef des gardes » peut signifier plus littéralement « chef des exécuteurs » ou « chef des bouchers ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à la maison de l’enfermement ». On peut aussi comprendre : « dans la maison du chef des gardes, dans la prison ».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: Il les plaça sous garde
  rationale: Dans ce contexte, נָתַן signifie « placer » plutôt que simplement « donner », et מִשְׁמָר désigne la garde ou la détention. « Plaça sous garde » restitue naturellement l’action et la situation carcérale.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: dans la maison du chef des gardes
  rationale: Cette expression désigne la résidence ou l’établissement relevant de l’officier qui commande les gardes. Le sens littéral de טַבָּחִים est signalé en note sans imposer une fonction précise incertaine dans le corps du texte.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: à la prison
  rationale: בֵּית הַסֹּהַר désigne le lieu d’enfermement. « À la prison » est idiomatique en français et conserve la précision locative ajoutée après la mention de la maison du chef des gardes.
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: là où Joseph était détenu
  rationale: אָסוּר peut signifier « lié », « emprisonné » ou « détenu ». « Détenu » convient au contexte et « là où » rend ensemble מְקוֹם, אֲשֶׁר et שָׁם sans lourdeur.
