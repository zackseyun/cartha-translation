base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: fr
  text: 'Tous deux firent un rêve la même nuit, chacun son propre rêve, et chacun de ces rêves avait son interprétation[a] : l’échanson et le boulanger du roi d’Égypte, qui étaient détenus dans la prison.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chacun selon l’interprétation de son rêve ». Le texte souligne que chaque rêve avait une interprétation qui lui correspondait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם שְׁנֵיהֶם
  choice: Tous deux firent un rêve
  rationale: « Faire un rêve » est l’expression française naturelle. « Tous deux » rend explicitement שְׁנֵיהֶם sans reproduire artificiellement la construction apparentée hébraïque.
- source_word: אִישׁ חֲלֹמוֹ
  choice: chacun son propre rêve
  rationale: Conserve la valeur distributive et précise que chacun des deux hommes eut un rêve distinct.
- source_word: בְּלַיְלָה אֶחָד
  choice: la même nuit
  rationale: Dans ce contexte où deux hommes rêvent, cette formulation française exprime naturellement la simultanéité visée par l’hébreu, littéralement « en une nuit ».
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: chacun de ces rêves avait son interprétation
  rationale: Rend la distribution répétée de אִישׁ et le rapport de correspondance marqué par כְּ, tout en restant intelligible en français courant.
- source_word: הַמַּשְׁקֶה
  choice: l’échanson
  rationale: Terme français précis pour l’officier royal chargé de servir les boissons; le texte de ce vers ne précise pas qu’il était chef.
- source_word: הָאֹפֶה
  choice: le boulanger
  rationale: Équivalent direct du nom participial; le qualificatif « chef » n’est pas exprimé dans ce vers.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: du roi d’Égypte
  rationale: Le complément français exprime sobrement leur rattachement officiel au roi sans imposer la notion plus forte de propriété personnelle.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: qui étaient détenus dans la prison
  rationale: Dans ce contexte carcéral, « détenus » rend le participe passif אֲסוּרִים; « prison » est plus naturel en français moderne que le calque « maison de détention ».
