source:
  edition: WLC
  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שְׁלִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: fr
  text: 'Il y eut un soir et il y eut un matin : ce fut le troisième jour.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Il y eut un soir et il y eut un matin : troisième jour. »'
    reason: La formulation française ajoute « ce fut le » pour rendre naturellement la construction nominale concise de l’hébreu.
lexical_decisions:
- source_word: וַיְהִי
  choice: il y eut
  rationale: Cette tournure narrative rend naturellement l’hébreu וַיְהִי dans la formule récurrente du récit, tout en conservant l’idée d’un événement qui advient et la répétition de la structure.
- source_word: עֶרֶב
  choice: un soir
  rationale: עֶרֶב désigne le soir ou la tombée du jour. « Un soir » est ici la formulation française habituelle et transparente.
- source_word: בֹּקֶר
  choice: un matin
  rationale: בֹּקֶר désigne le matin. « Un matin » maintient le parallélisme de la formule avec « un soir ».
- source_word: יוֹם
  choice: jour
  rationale: Dans ce refrain, יוֹם désigne le jour numéroté dans la succession du récit de la création.
- source_word: שְׁלִישִׁי
  choice: troisième
  rationale: L’adjectif ordinal signifie directement « troisième » et qualifie « jour ».
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Il y eut un soir et il y eut un matin
  rationale: La répétition de « il y eut » conserve le rythme et la structure de la formule hébraïque, dans un français naturel et digne.
theological_decisions:
- issue: Rendre le refrain du jour de création sans imposer une interprétation chronologique particulière
  choice: ce fut le troisième jour
  alternative: troisième jour
  rationale: La formulation française identifie clairement le troisième jour dans la séquence narrative sans trancher les débats sur la durée ou la fonction littéraire des jours. La note signale que « ce fut le » explicite une relation laissée plus concise en hébreu.
translation_notes:
  register: Français international moderne, simple et solennel. La répétition de « il y eut » préserve la cadence liturgique et littéraire du refrain hébreu.
