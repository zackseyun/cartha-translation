  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: fr
  text: Et la terre était informe et vide, et les ténèbres étaient à la surface de l’abîme, et l’Esprit de Dieu[a] planait au-dessus de la surface des eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un vent venant de Dieu planait au-dessus de la surface des eaux » ou « le vent de Dieu planait au-dessus de la surface des eaux ».'
    reason: 'Lecture alternative : רוּחַ peut désigner l’esprit, le vent ou le souffle; dans cette construction, « Esprit de Dieu », « un vent venant de Dieu » et « le vent de Dieu » restent des lectures possibles.'
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Et la terre
  rationale: Le nom désigne ici la terre, et le ו préfixé relie cette proposition à la précédente. « Et la terre » garde ce lien sans ajouter un marqueur discursif comme « Or ».
- source_word: הָיְתָה
  choice: était
  rationale: Le qal accompli de היה fonctionne naturellement ici comme copule stative. « Était » décrit l’état de la terre sans imposer l’idée d’un changement d’état.
- source_word: תֹהוּ וָבֹהוּ
  choice: informe et vide
  rationale: Cette paire évoque une réalité non organisée et déserte. « Informe et vide » est une formulation française claire, actuelle et proche des deux éléments hébreux.
- source_word: וְחֹשֶׁךְ
  choice: les ténèbres
  rationale: « Les ténèbres » est l’équivalent français naturel du nom hébreu dans ce contexte cosmique.
- source_word: עַל־פְּנֵי
  choice: la surface de / au-dessus de la surface de
  rationale: L’expression signifie littéralement « sur la face de ». La formulation retenue conserve l’image spatiale dans un français naturel, avec une légère adaptation syntaxique selon le verbe.
- source_word: תְהוֹם
  choice: l’abîme
  rationale: Le terme désigne la masse d’eaux profonde ou l’océan primordial. « L’abîme » rend cette profondeur sans développer des éléments mythologiques absents du texte.
- source_word: וְרוּחַ אֱלֹהִים
  choice: et l’Esprit de Dieu
  rationale: רוּחַ peut signifier « esprit », « vent » ou « souffle ». Le texte principal retient la lecture personnelle, bien attestée, tandis qu’une note préserve la lecture météorologique réellement possible.
- source_word: מְרַחֶפֶת
  choice: planait
  rationale: Le participe décrit une action continue. « Planait » exprime un mouvement maintenu au-dessus des eaux et reste naturel en français.
- source_word: הַמָּיִם
  choice: les eaux
  rationale: Le pluriel français conserve la forme hébraïque et l’image des eaux cosmiques.
theological_decisions:
- issue: Faut-il comprendre הָיְתָה comme un état (« était ») ou un changement d’état (« devint ») ?
  choice: était
  alternative: devint
  rationale: Le passage décrit naturellement l’état de la terre à ce point du récit. Le verbe hébreu n’exige pas l’idée d’un changement; « était » évite donc d’introduire une reconstruction théologique non explicitée.
- issue: וְרוּחַ אֱלֹהִים désigne-t-il l’Esprit de Dieu ou un vent venant de Dieu ?
  choice: l’Esprit de Dieu
  alternative: un vent venant de Dieu / le vent de Dieu
  rationale: L’hébreu permet réellement les deux interprétations. La lecture « l’Esprit de Dieu » figure dans le texte principal, tandis que la note conserve explicitement la lecture météorologique afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination initiale est conservée. Le texte évite le tour traditionnel mais moins courant « sans forme et vide » ainsi que le mot « chaos », qui pourrait préciser excessivement תֹהוּ וָבֹהוּ. La note est placée après « Dieu » pour signaler exactement le syntagme ambigu.
