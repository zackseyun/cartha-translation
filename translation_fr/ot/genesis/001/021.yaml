base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: fr
  text: Dieu créa les grandes créatures marines[a], ainsi que tout être vivant qui se déplace et dont les eaux grouillèrent, selon leurs espèces, et tout oiseau ailé selon son espèce. Dieu vit que c’était bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les grands monstres marins » ou « les grands dragons ». Le mot hébreu tanninim peut désigner de grandes créatures serpentines ou monstrueuses ; ici, le contexte aquatique favorise « créatures marines ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: créa
  rationale: Le verbe ברא est rendu par « créer » afin de conserver le choix lexical distinctif et le registre élevé du récit.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom commande ici un verbe au singulier et désigne Dieu.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: les grands animaux marins
  rationale: תנינים peut désigner de grandes créatures serpentines ou redoutables. Dans ce contexte aquatique, « animaux marins » est clair et naturel sans effacer les autres possibilités, signalées en note.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: tout être vivant
  rationale: נפש חיה désigne ici un être animé, et non l’« âme » au sens théologique courant.
- source_word: הָרֹמֶשֶׂת
  choice: qui se déplace
  rationale: Le participe רמש décrit largement ce qui se meut; cette formulation évite de limiter le sens aux animaux qui rampent.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: dont les eaux foisonnèrent
  rationale: Le verbe שרץ exprime la multiplication abondante et grouillante; « foisonner » en restitue le sens tout en gardant la relation syntaxique avec les êtres vivants.
- source_word: לְמִינֵהֶם
  choice: selon leur espèce
  rationale: מין exprime ici une classification des êtres créés; le singulier collectif « espèce » est idiomatique après « leur ».
- source_word: כָּל עוֹף כָּנָף
  choice: tout oiseau ailé
  rationale: La formulation conserve à la fois la catégorie עוף et la mention explicite des ailes, tout en restant naturelle en français.
- source_word: לְמִינֵהוּ
  choice: selon son espèce
  rationale: Le suffixe singulier correspond au collectif « tout oiseau ailé ».
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Dieu vit que c’était bon
  rationale: Cette traduction naturelle préserve la formule évaluative récurrente de Genèse 1.
theological_decisions:
- issue: Traduction de תַּנִּינִם dans un contexte de création pouvant comporter des résonances mythiques
  choice: les grands animaux marins
  alternative: les grands monstres marins; les grands dragons
  rationale: Le contexte immédiat présente ces êtres comme des créatures aquatiques faites par Dieu. Le texte principal évite donc d’imposer une lecture mythologique, tandis que la note conserve l’étendue sémantique et la tension du terme hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La structure cumulative du verset et la formule finale du récit de la création sont conservées, sans lourdeur excessive.
