source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֹתָ֛/ם אֱלֹהִ֖ים בִּ/רְקִ֣יעַ הַ/שָּׁמָ֑יִם לְ/הָאִ֖יר עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: fr
  text: Dieu les plaça dans l’étendue du ciel pour éclairer la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le firmament du ciel ».'
    reason: Alternative lexicale traditionnelle pour בִּרְקִיעַ הַשָּׁמַיִם.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: plaça
  rationale: Le verbe נָתַן signifie fondamentalement « donner, mettre ». Dans ce contexte, « plaça » exprime naturellement en français la disposition intentionnelle des luminaires.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux luminaires mentionnés au verset précédent ; le pronom français « les » conserve cette référence.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans Genèse 1, אֱלֹהִים commande ici un verbe au singulier et désigne le Créateur ; « Dieu » est l’équivalent français usuel.
- source_word: בִּרְקִיעַ
  choice: dans l’étendue
  rationale: רָקִיעַ désigne ce qui est étendu ou déployé. « Étendue » reste intelligible en français moderne et évite aussi bien l’archaïsme de « firmament » qu’une précision cosmologique ajoutée au texte.
- source_word: הַשָּׁמַיִם
  choice: du ciel
  rationale: Bien que le nom hébreu ait une forme plurielle, « le ciel » est ici la tournure française naturelle dans le syntagme « l’étendue du ciel » et conserve le sens spatial du passage.
- source_word: לְהָאִיר
  choice: pour éclairer
  rationale: 'L’infinitif au hiphil de אוֹר a une valeur causative : faire venir la lumière sur quelque chose. « Pour éclairer » rend clairement la fonction assignée aux luminaires.'
- source_word: עַל הָאָרֶץ
  choice: la terre
  rationale: Après le verbe transitif français « éclairer », la préposition עַל n’a pas besoin d’être reproduite séparément ; « éclairer la terre » exprime naturellement la destination de la lumière.
theological_decisions:
- issue: Le terme cosmologique רָקִיעַ dans le récit de la création
  choice: l’étendue
  alternative: le firmament ; la voûte du ciel
  rationale: « L’étendue » préserve le caractère spatial assez large du terme hébreu sans imposer au texte une reconstruction cosmologique ancienne ni une reformulation scientifique moderne. La variante « firmament » est signalée en note en raison de son importance traditionnelle et lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise comme l’hébreu. « Étendue du ciel » conserve une tonalité élevée sans employer un vocabulaire inutilement archaïque.
