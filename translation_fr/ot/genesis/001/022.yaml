source:
  edition: WLC
  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: fr
  text: 'Dieu les bénit en disant : « Soyez féconds, multipliez-vous et remplissez les eaux des mers ; que les oiseaux[a] se multiplient sur la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les êtres ailés » ; le mot hébreu עוֹף peut désigner plus largement les créatures qui volent.
    reason: Alternative lexicale préservant l’étendue sémantique possible du terme hébreu.
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Le piel de ברך exprime ici l’octroi d’une bénédiction. « Bénit » est direct, naturel et conserve la portée forte de l’action divine.
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie aux créatures marines et aux êtres ailés du verset précédent. Le pronom français « les » rend ce renvoi sans explicitation superflue.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans Genèse 1, ce nom accompagné d’un verbe au singulier désigne le Créateur unique ; « Dieu » est l’équivalent français établi.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Cette formule introduit le discours direct. « En disant » est idiomatique et maintient explicitement l’acte de parole.
- source_word: פְּרוּ
  choice: Soyez féconds
  rationale: L’impératif de פרה concerne la fécondité. « Soyez féconds » est naturel en français moderne et ne réduit pas l’expression à une simple augmentation numérique.
- source_word: וּרְבוּ
  choice: multipliez-vous
  rationale: L’impératif de רבה exprime l’accroissement en nombre. La forme pronominale est l’expression française habituelle dans ce contexte.
- source_word: וּמִלְאוּ
  choice: remplissez
  rationale: L’impératif de מלא signifie « remplir » ; cette traduction directe n’ajoute aucune intensification absente de l’hébreu.
- source_word: אֶת־הַמַּיִם
  choice: les eaux
  rationale: Le pluriel « les eaux » reflète la forme hébraïque מַיִם et convient au registre élevé mais accessible du récit de la création.
- source_word: בַּיַּמִּים
  choice: des mers
  rationale: Le pluriel traduit fidèlement יַמִּים. Dans « les eaux des mers », la préposition hébraïque בְּ indique le domaine que les créatures doivent remplir, rendu naturellement en français par ce complément.
- source_word: וְהָעוֹף
  choice: les oiseaux
  rationale: עוֹף peut désigner plus largement ce qui vole, mais « les oiseaux » est le choix le plus naturel dans ce contexte. Une note conserve la portée lexicale plus large.
- source_word: יִרֶב
  choice: que … se multiplient
  rationale: Cette tournure rend la valeur volitive du jussif sans l’aplatir en simple futur. L’accord au pluriel suit le collectif français « les oiseaux ».
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: « Sur la terre » rend directement le domaine terrestre où les oiseaux doivent se multiplier et s’accorde avec le vocabulaire cosmologique du chapitre.
theological_decisions:
- issue: Nature de la parole prononcée dans la bénédiction
  choice: Conserver les impératifs puis rendre le jussif par « que les oiseaux se multiplient » afin de présenter la bénédiction sous une forme qui a aussi valeur d’injonction.
  alternative: Tout rendre comme des ordres directs, ou traduire la dernière proposition par le simple futur « les oiseaux se multiplieront ».
  rationale: L’hébreu associe explicitement la bénédiction divine à des formes impératives et volitives. La traduction préserve la tension entre bénédiction, mandat et parole efficace, sans la réduire à un ordre ou à une prédiction.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue les deux volets de la bénédiction sans alourdir la phrase ; le point-virgule rend clairement le passage des créatures marines aux oiseaux.
