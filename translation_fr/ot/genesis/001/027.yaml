source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: fr
  text: Dieu créa l’être humain à son image[a] ; à l’image de Dieu, il le créa ; homme et femme, il les créa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme ». Le mot hébreu adam est ici au singulier, mais il représente l’humanité tout entière.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: créa
  rationale: Le verbe ברא désigne ici l’acte créateur de Dieu. La répétition de « créa » conserve la triple reprise et la solennité de l’hébreu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom s’accorde ici avec un verbe au singulier et désigne Dieu.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: 'Le singulier hébreu est représentatif : la suite passe de « le » au pluriel « les » et précise « homme et femme ». « L’être humain » garde le singulier tout en exprimant la portée collective de אָדָם.'
- source_word: בְּצַלְמוֹ
  choice: à son image
  rationale: Cette formulation française naturelle rend ב + צלם et le suffixe masculin singulier renvoyant à Dieu.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: à l’image de Dieu
  rationale: La reprise explicite préserve le parallélisme et l’accent théologique du texte hébreu.
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom masculin singulier reprend « l’être humain » et maintient le mouvement voulu du singulier représentatif vers le pluriel.
- source_word: זָכָר וּנְקֵבָה
  choice: homme et femme
  rationale: Dans ce contexte humain, « homme et femme » exprime naturellement en français la distinction sexuée portée par זכר ונקבה, sans employer le couple relationnel « mari et femme ».
- source_word: אֹתָם
  choice: les
  rationale: Le pronom pluriel marque le passage de l’humanité représentée au singulier à sa pluralité comme homme et femme.
theological_decisions:
- issue: Rendu de אָדָם dans un contexte d’humanité représentative
  choice: l’être humain
  alternative: l’homme
  rationale: « L’être humain » préserve le singulier grammatical et la valeur représentative, tandis que « les » dans le dernier membre conserve le passage délibéré au pluriel. Une note signale l’autre rendu français traditionnel sans limiter le référent au sexe masculin.
- issue: Passage du singulier au pluriel
  choice: « il le créa » puis « il les créa »
  alternative: 'uniformiser au pluriel : « il les créa »'
  rationale: Le changement pronominal reproduit la tension grammaticale de l’hébreu entre l’humanité collective au singulier et les humains dans leur pluralité sexuée.
translation_notes:
  register: Français international moderne, naturel et digne. La structure en trois membres et la triple répétition de « créa » conservent le rythme solennel de l’hébreu. Le point-virgule met en valeur le parallélisme.
