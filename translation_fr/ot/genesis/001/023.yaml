  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם חֲמִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: fr
  text: 'Il y eut un soir[a] et il y eut un matin : le cinquième jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Et il y eut un soir, et il y eut un matin : jour cinquième. »'
    reason: La note signale la coordination répétée et l’ellipse de la désignation finale dans l’hébreu.
lexical_decisions:
- source_word: וַיְהִי
  choice: il y eut
  rationale: Dans cette formule narrative répétée, וַיְהִי exprime la survenue ou l’existence. « Il y eut » est naturel en français et conserve la cadence solennelle du récit.
- source_word: עֶרֶב
  choice: un soir
  rationale: עֶרֶב désigne le soir. L’article indéfini convient à la formule française et n’ajoute aucune précision interprétative.
- source_word: בֹּקֶר
  choice: un matin
  rationale: בֹּקֶר désigne le matin. « Un matin » forme un parallèle naturel avec « un soir ».
- source_word: יוֹם
  choice: jour
  rationale: יוֹם désigne ici le jour numéroté du récit de la création. « Jour » en est l’équivalent direct, sans déterminer sa durée.
- source_word: חֲמִישִׁי
  choice: cinquième
  rationale: L’adjectif ordinal חֲמִישִׁי qualifie « jour » ; « cinquième » en est l’équivalent exact.
theological_decisions:
- issue: Nature de la formule des jours de la création
  choice: Conserver la succession « un soir… un matin » et la désignation « cinquième jour », sans préciser la durée ou la nature du jour.
  alternative: Employer une formulation interprétative suggérant soit une journée de vingt-quatre heures, soit une époque.
  rationale: L’hébreu présente la formule soir-matin et le jour ordinal, mais la traduction ne doit pas trancher les débats ultérieurs sur la durée ou la fonction littéraire des jours.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « il y eut » préserve le refrain narratif ; « puis » et « ce fut » rendent la progression et l’identification du jour de manière idiomatique, tandis que la note donne une forme plus littérale.
