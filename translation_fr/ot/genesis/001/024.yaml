source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: fr
  text: 'Dieu dit : « Que la terre fasse surgir des êtres vivants[a] selon leurs espèces : les animaux domestiques, les animaux qui se déplacent sur le sol et les animaux sauvages de la terre, selon leurs espèces. » Et il en fut ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des créatures vivantes » ; littéralement « un être vivant » (hébreu : néfèsh).'
    reason: Alternative lexicale et indication de la forme littérale collective.
lexical_decisions:
- source_word: תּוֹצֵא
  choice: Que ... fasse surgir
  rationale: Le hifil jussif exprime l’ordre divin donné à la terre de faire apparaître les êtres vivants. Cette tournure naturelle conserve la nuance causative.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans le contexte de la création, le mot désigne le domaine terrestre dans son ensemble plutôt qu’un territoire particulier.
- source_word: נֶפֶשׁ חַיָּה
  choice: des êtres vivants
  rationale: L’expression désigne ici la vie animale. Le pluriel français explicite naturellement la valeur collective précisée par les catégories qui suivent, sans introduire les connotations doctrinales modernes du mot « âme ».
- source_word: לְמִינָהּ
  choice: selon leurs espèces
  rationale: Bien que la forme hébraïque soit singulière, sa portée est collective et distributive. Le pluriel est idiomatique en français et s’applique aux groupes d’animaux énumérés.
- source_word: בְּהֵמָה
  choice: les animaux domestiques
  rationale: Le terme désigne ici la classe des grands animaux terrestres, notamment ceux qui sont domestiqués, par contraste avec les animaux sauvages.
- source_word: רֶמֶשׂ
  choice: les animaux qui se déplacent sur le sol
  rationale: Cette formulation couvre les petites créatures terrestres qui rampent ou se meuvent près du sol, sans les réduire aux seuls reptiles.
- source_word: חַיְתוֹ אֶרֶץ
  choice: les animaux sauvages de la terre
  rationale: L’expression désigne les animaux terrestres non domestiqués et maintient leur contraste avec בְּהֵמָה.
- source_word: וַיְהִי כֵן
  choice: Et il en fut ainsi
  rationale: Formule française concise et solennelle qui correspond au refrain d’accomplissement de Genèse 1.
theological_decisions:
- issue: Rendre נֶפֶשׁ par un terme théologiquement chargé ou contextuel
  choice: êtres vivants
  alternative: âmes vivantes
  rationale: Dans ce contexte, l’expression hébraïque désigne les créatures animales vivantes sans formuler une doctrine sur leur constitution métaphysique. « Êtres vivants » préserve le sens et évite d’importer un débat ultérieur sur l’âme.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence solennelle du récit est conservée, tandis que « animaux qui se déplacent sur le sol » évite l’ambiguïté moderne de « reptiles » et l’aspect vieilli de « choses rampantes ».
