source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: fr
  text: 'Dieu les bénit et leur dit : « Soyez féconds, multipliez-vous, remplissez la terre et soumettez-la. Dominez[a] les poissons de la mer, les oiseaux du ciel et tout animal qui se déplace[b] sur la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Exercez votre autorité sur ».'
    reason: Alternative lexicale pour רדה, applicable à l’ensemble des animaux énumérés.
  - marker: b
    text: 'Ou : « qui rampe » sur la terre.'
    reason: רמש peut décrire plus précisément le déplacement rampant de petites créatures, tout en ayant ici une portée potentiellement plus large.
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Le piel de ברך exprime ici l’octroi effectif d’une bénédiction. « Bénit » est direct, naturel et conforme au caractère performatif du contexte.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom s’accorde ici avec des verbes au singulier et désigne le Dieu unique dans le récit.
- source_word: פְּרוּ
  choice: Soyez féconds
  rationale: L’impératif concerne la fécondité et la procréation. Cette formulation française conserve l’image de la racine hébraïque sans paraphrase excessive.
- source_word: וּרְבוּ
  choice: multipliez-vous
  rationale: Le verbe רבה appelle à devenir nombreux. La forme pronominale est idiomatique en français et s’accorde naturellement avec « soyez féconds ».
- source_word: וּמִלְאוּ
  choice: remplissez
  rationale: Le verbe מלא signifie remplir; la traduction conserve son sens simple et sa force impérative.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans le cadre universel du récit de la création, le terme désigne la terre entière plutôt qu’un territoire particulier.
- source_word: וְכִבְשֻׁהָ
  choice: soumettez-la
  rationale: כבש exprime l’action de placer sous son contrôle ou sa sujétion. « Soumettez-la » en préserve la force sans ajouter une interprétation sur la manière d’exercer cette autorité.
- source_word: וּרְדוּ
  choice: Dominez
  rationale: רדה désigne l’exercice d’une domination ou d’une autorité. « Dominez » est concis, actuel et conserve la vigueur du mandat hébreu.
- source_word: בִּדְגַת הַיָּם
  choice: les poissons de la mer
  rationale: Le syntagme désigne précisément les poissons, plutôt que l’ensemble plus large des créatures marines.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: עוֹף peut englober les êtres volants, mais « oiseaux » convient naturellement ici. En français moderne, « du ciel » rend idiomatiquement le domaine aérien exprimé par הַשָּׁמַיִם.
- source_word: בְכָל חַיָּה
  choice: tout animal
  rationale: חַיָּה désigne ici une créature vivante, plus précisément un animal dans l’énumération. « Tout animal » est clair sans restreindre le référent aux seules bêtes sauvages.
- source_word: הָרֹמֶשֶׂת
  choice: qui se déplace
  rationale: Le participe רמש décrit le mouvement sur la terre, souvent celui de petites créatures. « Se déplace » conserve la portée générale, tandis que « rampe » demeure une possibilité plus concrète signalée en note.
theological_decisions:
- issue: Force du mandat humain exprimé par כבש et רדה
  choice: Conserver les termes forts « soumettez-la » et « dominez »
  alternative: « prenez-en soin » ou « soyez-en les intendants »
  rationale: Les verbes hébreux expriment davantage qu’une simple responsabilité de soin. La traduction maintient leur force sans présenter cette autorité comme nécessairement abusive ni la reformuler selon une doctrine particulière de la gestion de la création.
- issue: Portée de הָאָרֶץ
  choice: « la terre »
  alternative: « le pays » ou « le territoire »
  rationale: Le contexte cosmique et universel de Genèse 1 indique la terre entière, non un espace territorial limité.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs restent brefs et solennels. La coordination est légèrement allégée par rapport à l’hébreu afin d’obtenir une phrase naturelle en français, sans perdre les éléments du mandat.
