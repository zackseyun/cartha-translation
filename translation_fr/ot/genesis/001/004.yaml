source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: fr
  text: Dieu vit que la lumière était bonne, et Dieu sépara[a] la lumière des ténèbres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « distingua la lumière des ténèbres » ; le verbe hébreu peut aussi exprimer l’établissement d’une distinction entre deux réalités.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה désigne ici naturellement la perception de Dieu. « Vit » conserve à la fois le sens concret et la portée évaluative du contexte sans l’expliciter davantage.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce passage, le nom de forme plurielle commande un verbe au singulier et désigne le Créateur unique ; « Dieu » est donc la traduction française usuelle.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Cette particule marque le complément d’objet direct en hébreu et n’a pas d’équivalent lexical nécessaire en français.
- source_word: הָאוֹר
  choice: la lumière
  rationale: L’article défini hébreu renvoie à la lumière qui vient d’être appelée à l’existence.
- source_word: כִּי
  choice: que
  rationale: 'כִּי introduit ici le contenu de la perception divine : Dieu vit que la lumière était bonne.'
- source_word: טוֹב
  choice: bonne
  rationale: טוֹב est le terme évaluatif courant signifiant « bon ». L’accord au féminin avec « lumière » exige « bonne » en français.
- source_word: וַיַּבְדֵּל
  choice: sépara
  rationale: בדל peut signifier séparer, diviser ou établir une distinction. « Sépara » est naturel en français et préserve l’indétermination quant à la nature précise de cette séparation.
- source_word: בֵּין ... וּבֵין
  choice: la lumière des ténèbres
  rationale: Après « séparer », la construction idiomatique française « séparer X de Y » rend naturellement la tournure hébraïque « entre X et entre Y ».
- source_word: הַחֹשֶׁךְ
  choice: les ténèbres
  rationale: « Les ténèbres » est l’équivalent français idiomatique et traditionnel du nom hébreu défini désignant l’obscurité déjà mentionnée dans le récit.
theological_decisions:
- issue: Répétition du sujet אֱלֹהִים dans les deux propositions
  choice: 'Répéter « Dieu » : « Dieu vit… et Dieu sépara… »'
  alternative: 'Employer un pronom dans la seconde proposition : « et il sépara… »'
  rationale: L’hébreu répète explicitement le sujet divin. La traduction conserve cette cadence et cette insistance sans ajouter d’interprétation doctrinale.
- issue: Nature de la séparation entre la lumière et les ténèbres
  choice: Employer « sépara » sans préciser s’il s’agit d’une séparation spatiale, temporelle ou conceptuelle
  alternative: « divisa » ou « distingua »
  rationale: Le texte affirme la séparation sans en expliquer le mécanisme. Cette formulation maintient l’ouverture cosmologique et théologique du texte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et narrative. La répétition de « Dieu » reproduit le rythme hébreu ; « les ténèbres » est retenu comme tournure française naturelle pour l’obscurité primordiale.
