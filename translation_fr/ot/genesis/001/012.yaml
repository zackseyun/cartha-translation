  source_fidelity: 'Le texte rend fidèlement la progression de l’hébreu : la terre fait pousser la végétation, puis sont distinguées les plantes produisant de la semence et les arbres portant du fruit avec la semence en lui. Le pluriel français (« plantes », « arbres », « leur semence », « leur sorte ») reflète de manière idiomatique la valeur collective des singuliers hébreux. « Selon leur sorte » conserve la portée classificatoire de לְמִינֵהוּ sans la confondre avec une taxonomie scientifique moderne.'
  naturalness: Le français est moderne, clair et d’un registre approprié au récit. Le deux-points introduit naturellement les composantes de la végétation. « Du fruit dans lequel se trouve leur semence » est un peu soutenu, mais reste grammatical, naturel et proche de la construction relative hébraïque.
  terminology: « Végétation », « plantes », « semence », « fruit » et « sorte » sont des choix précis et accessibles. « Dieu » restitue sobrement אֱלֹהִים. Les notes évitent avec justesse d’imposer au mot מין le sens technique moderne d’« espèce » et signalent l’ambiguïté formelle possible du rattachement de la relative.
