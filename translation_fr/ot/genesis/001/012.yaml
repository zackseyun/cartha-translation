id: GEN.1.12
reference: Genesis 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: fr
  text: 'La terre fit pousser de la végétation : des plantes produisant de la semence selon leur sorte, et des arbres portant du fruit dans lequel se trouve leur semence[b], selon leur sorte[a]. Dieu vit que c’était bon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie « selon sa/leur sorte ». Elle désigne des catégories sans employer le terme scientifique moderne « espèce ».
    reason: lexical_alternative
  - marker: b
    text: 'La construction hébraïque peut aussi se comprendre : « des arbres dont la semence se trouve en eux ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: fit pousser
  rationale: Le hiphil de יצא présente la terre comme faisant sortir la végétation. « Fit pousser » exprime naturellement en français cette causalité dans le contexte végétal.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le cadre cosmique de Genèse 1 favorise « la terre » plutôt que « le pays » ou « le sol ».
- source_word: דֶּשֶׁא
  choice: de la végétation
  rationale: דֶּשֶׁא désigne largement la verdure ou la croissance végétale, et non seulement l’herbe.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: des plantes produisant de la semence
  rationale: Cette formulation rend la catégorie végétale et sa capacité continue de produire de la semence, sans l’archaïsme ni l’étroitesse possible de « herbes ».
- source_word: לְמִינֵהוּ
  choice: selon leur sorte
  rationale: מין indique une catégorie ou sorte créée. « Sorte » reste intelligible et évite d’introduire le terme scientifique moderne « espèce ».
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: et des arbres portant du fruit
  rationale: Le singulier hébreu a ici une valeur collective. « Des arbres portant du fruit » est naturel et conserve l’image de la fructification.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: dans lequel se trouve leur semence
  rationale: La relative hébraïque est conservée avec un antécédent français naturel, « du fruit », tandis que « leur » s’accorde selon le sens avec les arbres pris collectivement.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Dieu vit que c’était bon
  rationale: Cette formulation française naturelle restitue fidèlement le refrain évaluatif du récit.
theological_decisions:
- issue: Rendre les catégories de la création sans importer la taxonomie biologique moderne
  choice: selon leur sorte
  alternative: selon leur espèce
  rationale: Le mot hébreu מין désigne une sorte ou catégorie dans le cadre conceptuel du texte ancien, sans correspondre nécessairement au rang taxonomique moderne d’« espèce ».
- issue: Identifier ce qui contient la semence
  choice: du fruit dans lequel se trouve leur semence
  alternative: des arbres dont la semence se trouve en eux
  rationale: Les formes hébraïques permettent grammaticalement de rattacher la relative au fruit ou à l’arbre. Le contexte immédiat favorise le fruit comme contenant de la semence, mais une note conserve l’ambiguïté formelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points explicite naturellement que les plantes et les arbres détaillent la « végétation ». Le vocabulaire évite à la fois l’archaïsme de « herbes » et la précision scientifique anachronique d’« espèces ».
