  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: fr
  text: Dieu fit l’étendue[a] et sépara les eaux qui étaient sous l’étendue des eaux qui étaient au-dessus de l’étendue. Et il en fut ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le firmament » (terme traditionnel) ; autre traduction possible : « la voûte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie couramment « faire ». Le passé simple convient au registre narratif digne du récit de la création sans ajouter la nuance plus précise de « façonner ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans Genèse 1, אֱלֹהִים commande ici un verbe au singulier et désigne le Dieu créateur ; « Dieu » est l’équivalent français naturel.
- source_word: הָרָקִיעַ
  choice: l’étendue
  rationale: רָקִיעַ évoque ce qui est étendu ou déployé. « L’étendue » garde cette image spatiale tout en évitant de préciser indûment sa forme ou sa constitution.
- source_word: וַיַּבְדֵּל
  choice: sépara
  rationale: בדל exprime l’action de séparer ou de distinguer. « Sépara » restitue directement l’organisation du monde décrite dans le passage.
- source_word: בֵּין ... וּבֵין
  choice: sépara … des …
  rationale: La construction hébraïque établit une distinction entre deux ensembles. Après « séparer », la tournure française « séparer X de Y » en donne l’équivalent idiomatique.
- source_word: הַמַּיִם
  choice: les eaux
  rationale: « Les eaux » reflète la forme hébraïque et conserve le style solennel et imagé du récit, tout en restant courant en français biblique moderne.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: qui étaient au-dessous de l’étendue
  rationale: La formulation rend le rapport spatial vertical de מִתַּחַת et prépare le contraste exact avec « au-dessus ».
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: qui étaient au-dessus de l’étendue
  rationale: « Au-dessus » rend clairement מֵעַל et maintient le parallélisme spatial du texte hébreu.
- source_word: וַיְהִי כֵן
  choice: Et il en fut ainsi
  rationale: Cette formule française naturelle et digne conserve le refrain récurrent qui constate l’accomplissement de la parole divine.
theological_decisions:
- issue: Traduction de רָקִיעַ et ses implications cosmologiques
  choice: l’étendue
  alternative: le firmament ; la voûte
  rationale: « L’étendue » rend l’idée de quelque chose de déployé sans imposer une reconstruction cosmologique précise. « Firmament » est traditionnel mais peut suggérer une structure ferme par son histoire lexicale ; « voûte » précise davantage une forme que le terme hébreu ne l’exige à lui seul.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le registre narratif. La répétition de « l’étendue » et de « les eaux » est maintenue afin de préserver le parallélisme et la structure du texte hébreu.
