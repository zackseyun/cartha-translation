  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לָ/אוֹר֙ י֔וֹם וְ/לַ/חֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם אֶחָֽד׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: fr
  text: 'Dieu appela la lumière « jour » ; il appela les ténèbres « nuit ». Il y eut un soir, il y eut un matin : ce fut le premier jour[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « jour un ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Le verbe קרא suivi du nom attribué signifie ici « appeler » ou « nommer ». « Appela » conserve la formulation hébraïque et le caractère solennel de l’acte de désignation.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans Genèse 1, ce nom de forme plurielle s’accorde avec un verbe au singulier et désigne le Créateur unique ; « Dieu » est le rendu français usuel.
- source_word: לָאוֹר
  choice: la lumière
  rationale: La préposition ל appartient ici à la construction de désignation ; en français idiomatique, le terme désigné se construit directement avec « appeler ».
- source_word: יוֹם
  choice: « jour »
  rationale: Le mot est le nom attribué à la lumière. Les guillemets signalent clairement la désignation ; la minuscule respecte l’usage typographique français pour les noms communs.
- source_word: וְלַחֹשֶׁךְ
  choice: les ténèbres
  rationale: Le pluriel lexical français « les ténèbres » rend naturellement le singulier collectif hébreu חֹשֶׁךְ dans ce contexte.
- source_word: קָרָא
  choice: il les appela
  rationale: La répétition du verbe est maintenue afin de préserver le parallélisme hébreu. Le pronom « les » reprend grammaticalement « les ténèbres ».
- source_word: לָיְלָה
  choice: « nuit »
  rationale: « Nuit » est le nom attribué aux ténèbres ; les guillemets marquent l’acte de désignation.
- source_word: וַיְהִי
  choice: il y eut
  rationale: Cette tournure existentielle, répétée deux fois, est naturelle en français narratif et reproduit la cadence de l’hébreu.
- source_word: עֶרֶב
  choice: un soir
  rationale: « Soir » exprime le sens ordinaire du terme sans le restreindre au seul coucher du soleil.
- source_word: בֹקֶר
  choice: un matin
  rationale: « Matin » rend le sens courant du terme sans imposer le sens plus étroit d’« aube ».
- source_word: יוֹם אֶחָד
  choice: le premier jour
  rationale: L’hébreu emploie littéralement le cardinal « un », mais dans l’ouverture d’une série numérotée, « le premier jour » est la formulation française la plus naturelle. La forme littérale est signalée en note.
theological_decisions:
- issue: Rendu de יוֹם אֶחָד à la fin de la formule du jour de création
  choice: le premier jour
  alternative: jour un ; un jour
  rationale: Le cardinal אֶחָד signifie littéralement « un », et non l’ordinal « premier ». Toutefois, la phrase introduit une séquence de jours, et « le premier jour » en communique naturellement la fonction en français. La note conserve la forme hébraïque afin de ne pas effacer une nuance à laquelle certains lecteurs peuvent accorder une portée interprétative.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme et la répétition de l’hébreu sont conservés sans produire une syntaxe artificielle. Les noms attribués sont placés entre guillemets français plutôt que dotés de majuscules, conformément à l’usage typographique français.
