  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: fr
  text: 'Puis Dieu dit : « Faisons l’être humain[a] à notre image, selon notre ressemblance[b], et qu’ils dominent les poissons de la mer, les oiseaux du ciel, le bétail, toute la terre et toute créature qui se meut sur la terre[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’homme », « l’humanité ». Le mot hébreu ʼadam est ici un singulier collectif : il désigne l’ensemble des êtres humains comme une seule espèce, ce qui explique la reprise au pluriel dans « qu’ils dominent ».'
    reason: lexical_alternative
  - marker: b
    text: Les pluriels « Faisons », « notre image » et « notre ressemblance » reproduisent l’hébreu. Ils ont notamment été compris comme une délibération divine, une adresse à la cour céleste ou, dans la lecture canonique chrétienne, comme une formulation compatible avec la révélation trinitaire ultérieure.
    reason: alternative_reading
  - marker: c
    text: Ou « toute créature rampante ». L’hébreu désigne une catégorie large de créatures qui se déplacent sur la terre ; il ne se limite pas aux reptiles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis ... dit
  rationale: Le waw consécutif fait progresser le récit. « Puis » exprime naturellement cette succession en français moderne.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom désigne ici le Dieu unique et s’accorde avec un verbe au singulier.
- source_word: נַעֲשֶׂה
  choice: Faisons
  rationale: La forme à la première personne du pluriel a une valeur délibérative ou cohortative. « Faisons » conserve le pluriel sans en imposer l’interprétation.
- source_word: אָדָם
  choice: l’être humain
  rationale: Ici, אָדָם est un singulier collectif désignant l’humanité comme espèce. « L’être humain » conserve le singulier représentatif tout en incluant clairement les deux sexes; le pluriel « qu’ils dominent » manifeste ensuite sa portée collective.
- source_word: בְּצַלְמֵנוּ
  choice: à notre image
  rationale: Cette formulation française consacrée rend naturellement la préposition ב et le nom צֶלֶם, qui évoque une image ou représentation.
- source_word: כִּדְמוּתֵנוּ
  choice: selon notre ressemblance
  rationale: La préposition כ exprime ici la correspondance. Le choix maintient la distinction lexicale entre « image » et « ressemblance » sans préciser leur rapport théologique.
- source_word: וְיִרְדּוּ
  choice: et qu’ils dominent
  rationale: La forme verbale à la troisième personne du pluriel a ici une valeur jussive. « Qu’ils dominent » la conserve et rend le passage du collectif singulier au pluriel.
- source_word: בִדְגַת הַיָּם
  choice: sur les poissons de la mer
  rationale: Rendu direct et idiomatique de la construction hébraïque.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: sur les oiseaux du ciel
  rationale: Dans ce contexte, שָׁמַיִם désigne l’étendue céleste où volent les oiseaux; « ciel » est naturel en français.
- source_word: וּבַבְּהֵמָה
  choice: sur le bétail
  rationale: בְּהֵמָה désigne ici les animaux domestiques terrestres comme catégorie; « bétail » est précis et courant.
- source_word: וּבְכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: Dans Genèse 1, אֶרֶץ a une portée terrestre globale plutôt que locale.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: sur tout animal qui se déplace à ras de terre
  rationale: רֶמֶשׂ et le participe apparenté désignent les petites créatures se mouvant près du sol. Cette formulation moderne évite que « reptile » ne restreigne indûment la catégorie.
theological_decisions:
- issue: 'Le discours divin au pluriel : « Faisons ... notre image ... notre ressemblance »'
  choice: Conserver toutes les formes plurielles sans identifier l’interlocuteur dans le texte principal.
  alternative: Comprendre ces pluriels comme une délibération divine, une adresse à la cour céleste ou, dans une lecture canonique chrétienne, une indication compatible avec la révélation trinitaire ultérieure.
  rationale: L’hébreu emploie explicitement la première personne du pluriel, mais le verset ne tranche pas à lui seul entre les principales interprétations. La traduction doit préserver cette tension.
- issue: Le singulier collectif אָדָם suivi du pluriel וְיִרְדּוּ
  choice: Traduire par « l’être humain », puis conserver le pluriel « qu’ils dominent ».
  alternative: « l’homme », « les humains » ou « l’humanité ».
  rationale: Le texte présente l’humanité comme une réalité collective au singulier, puis reprend ce référent au pluriel. Le rendu choisi reproduit ce mouvement sans limiter אָדָם au sexe masculin.
- issue: La fonction humaine exprimée par רדה
  choice: Employer « dominer » sans développer dans le texte la nature morale de cette autorité.
  alternative: « régner sur », « exercer son autorité sur » ou « gouverner ».
  rationale: רדה exprime une domination ou autorité réelle. Le contexte canonique peut en préciser l’exercice, mais la traduction de ce verset ne doit ni l’atténuer ni en imposer une interprétation éthique détaillée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le rythme solennel de la déclaration divine, les pluriels énigmatiques de l’hébreu et le passage intentionnel du singulier collectif au pronom pluriel. « À ras de terre » traduit de façon concrète et actuelle la catégorie des créatures qui se meuvent près du sol.
