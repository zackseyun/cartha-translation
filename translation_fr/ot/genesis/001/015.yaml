source:
  edition: WLC
  text: וְ/הָי֤וּ לִ/מְאוֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הָאִ֖יר עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: fr
  text: Qu’ils soient des luminaires[a] dans l’étendue du ciel[b], pour éclairer la terre. Et ce fut ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des sources de lumière ». Le mot hébreu désigne des corps qui donnent de la lumière, et non la lumière en tant que telle.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le firmament des cieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Qu’ils servent
  rationale: Dans ce discours créateur, la forme poursuit la valeur volitive du verset précédent. « Qu’ils servent » exprime naturellement en français leur fonction assignée, sans la réduire à une simple prédiction.
- source_word: לִמְאוֹרֹת
  choice: de luminaires
  rationale: מָאוֹר désigne des corps ou objets qui donnent de la lumière, et non la lumière abstraite. « Luminaires » conserve précisément cette distinction dans un registre digne et courant.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: dans l’étendue du ciel
  rationale: « Étendue » rend רָקִיעַ sans l’archaïsme de « firmament ». Le singulier collectif français « ciel » traduit naturellement הַשָּׁמַיִם dans cette expression, tout en laissant une variante plus formelle en note.
- source_word: לְהָאִיר
  choice: pour éclairer
  rationale: L’infinitif hiphil de אור a une valeur causative. « Éclairer » restitue ce sens de manière concise et idiomatique.
- source_word: עַל הָאָרֶץ
  choice: la terre
  rationale: Avec « éclairer », le français emploie naturellement un complément direct; le rapport exprimé par עַל est ainsi rendu sans lourdeur.
- source_word: וַיְהִי כֵן
  choice: Et ce fut ainsi
  rationale: Cette formule restitue la formule récurrente d’accomplissement en Genèse 1 dans un français naturel, solennel et cohérent.
theological_decisions:
- issue: Valeur volitive de וְהָיוּ dans la parole créatrice
  choice: 'Traduire comme la continuation d’un ordre : « Qu’ils servent »'
  alternative: 'Traduire comme un futur simple : « Ils serviront »'
  rationale: Le contexte immédiat maintient la proposition dans la parole divine qui assigne une fonction aux luminaires. La tournure volitive préserve la structure littéraire ordre-accomplissement sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe volitive maintient le mouvement de la parole créatrice; « luminaires » préserve la précision concrète du terme hébreu. Les marqueurs [a] et [b] figurent immédiatement après les expressions concernées.
