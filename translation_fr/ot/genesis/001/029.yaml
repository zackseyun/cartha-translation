  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: fr
  text: 'Dieu dit : « Voici, je vous ai donné toute plante[a] qui produit de la semence sur toute la surface de la terre, ainsi que tout arbre dont le fruit porte de la semence. Cela vous servira de nourriture. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute végétation ». Le mot hébreu peut désigner largement les plantes qui poussent, et pas seulement les herbes au sens culinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque naturellement en français l’appel à l’attention exprimé par la particule hébraïque, dans un registre digne sans archaïsme excessif.
- source_word: נָתַתִּי
  choice: je vous ai donné
  rationale: Le passé composé rend l’accompli hébreu comme un don déjà accordé et dont la validité demeure présente.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: toute plante qui produit de la semence
  rationale: « Plante » rend la portée générale de עֵשֶׂב, tandis que « produit de la semence » exprime clairement le participe זֹרֵעַ sans limiter le sens aux herbes culinaires.
- source_word: אֲשֶׁר עַל פְּנֵי כָל הָאָרֶץ
  choice: sur toute la surface de la terre
  rationale: Cette formulation conserve l’image spatiale de l’hébreu tout en restant naturelle en français moderne.
- source_word: כָּל הָעֵץ
  choice: tout arbre
  rationale: Le singulier précédé de כָּל a ici une valeur distributive, que « tout arbre » reproduit directement.
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: dont le fruit porte de la semence
  rationale: La formulation restitue le lien entre l’arbre, son fruit et la semence, tout en évitant un calque obscur de la syntaxe hébraïque.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: Cela vous servira de nourriture
  rationale: Le pronom collectif singulier correspond au verbe hébreu singulier et renvoie naturellement à l’ensemble des végétaux mentionnés.
