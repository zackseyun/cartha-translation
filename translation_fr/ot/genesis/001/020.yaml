id: GEN.1.20
reference: Genesis 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: fr
  text: 'Et Dieu dit : « Que les eaux foisonnent d’êtres vivants[a], et que les oiseaux[b] volent au-dessus de la terre, à travers l’étendue[c] du ciel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que les eaux grouillent d’un grouillement d’êtres vivants. » L’hébreu emploie un verbe et un nom de même racine pour souligner l’abondance de la vie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les êtres volants ». Le mot hébreu peut avoir un sens plus large que le seul terme « oiseaux ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « firmament » ou « voûte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et Dieu dit
  rationale: Le waw consécutif poursuit le récit. « Et Dieu dit » conserve la cadence séquentielle de Genèse 1 sans surinterpréter le lien logique.
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: Que les eaux foisonnent
  rationale: Le verbe et le nom apparenté évoquent une vie abondante et grouillante. La formulation française naturelle « foisonnent d’êtres vivants » restitue cette profusion, tandis qu’une note signale la répétition expressive de l’hébreu.
- source_word: נֶפֶשׁ חַיָּה
  choice: êtres vivants
  rationale: Dans ce contexte, l’expression désigne des créatures animées. « Êtres vivants » est clair et n’introduit pas dans le verset une conception technique de l’âme.
- source_word: וְעוֹף
  choice: et que les oiseaux
  rationale: « Oiseaux » est le terme français courant dans ce contexte, bien que le mot hébreu puisse désigner plus largement les êtres ailés ou volants; cette latitude est conservée en note.
- source_word: יְעוֹפֵף
  choice: volent
  rationale: Le subjonctif après « que » rend naturellement la valeur jussive du verbe hébreu et exprime simplement le mouvement de vol.
- source_word: עַל הָאָרֶץ
  choice: au-dessus de la terre
  rationale: Avec un verbe de vol, la préposition situe les oiseaux au-dessus de la terre, sans suggérer qu’ils sont en contact avec le sol.
- source_word: עַל פְּנֵי רְקִיעַ הַשָּׁמָיִם
  choice: devant l’étendue du ciel
  rationale: « Devant » conserve l’image spatiale de עַל פְּנֵי, littéralement « sur la face de / devant », tandis que « l’étendue du ciel » rend l’expression de façon intelligible et digne en français moderne.
- source_word: רְקִיעַ
  choice: étendue
  rationale: « Étendue » garde l’image d’un espace déployé sans imposer un modèle cosmologique précis. Les équivalents traditionnels ou plus interprétatifs sont signalés en note.
- source_word: הַשָּׁמָיִם
  choice: du ciel
  rationale: En français, le singulier collectif « ciel » est ici plus idiomatique que « cieux » et désigne naturellement l’espace céleste où volent les oiseaux.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le récit de la création
  choice: êtres vivants
  alternative: âmes vivantes
  rationale: L’expression qualifie ici la vie animale et ne formule pas une doctrine technique sur l’âme. « Êtres vivants » préserve le sens contextuel sans exclure les autres emplois du terme ailleurs.
- issue: Représentation cosmologique de רְקִיעַ
  choice: étendue
  alternative: firmament ou voûte
  rationale: Le mot possède une portée cosmologique discutée. « Étendue » conserve l’image spatiale du texte tout en évitant d’imposer soit le vocabulaire traditionnel de « firmament », soit la forme plus interprétative de « voûte ».
translation_notes:
  register: Français international moderne, naturel et soutenu, adapté à la lecture publique. La phrase conserve la cadence solennelle du récit et ses deux injonctions parallèles, tout en évitant les archaïsmes. Les notes rendent visibles le jeu de mots hébreu et les principales ambiguïtés lexicales.
