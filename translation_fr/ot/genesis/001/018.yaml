  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: fr
  text: pour gouverner le jour et la nuit, et pour séparer[a] la lumière des ténèbres. Et Dieu vit que cela était bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « faire la distinction entre la lumière et les ténèbres ».'
    reason: 'Alternative lexicale pour לְהַבְדִּיל : le verbe peut souligner la distinction établie plutôt que la séparation.'
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: pour gouverner
  rationale: L’infinitif construit précédé de ל exprime ici la fonction assignée aux luminaires dans la continuité du verset précédent. « Gouverner » rend naturellement משל sans suggérer qu’ils seraient des divinités autonomes.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: le jour et la nuit
  rationale: Les prépositions hébraïques dépendent du verbe משל. En français, « gouverner le jour et la nuit » restitue clairement la construction et conserve le parallélisme des deux périodes.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: et pour séparer
  rationale: בדל désigne dans Genèse 1 l’établissement d’une séparation ou distinction. « Séparer » conserve le motif concret de l’organisation de la création; « distinguer » reste une possibilité lexicale signalée en note.
- source_word: בֵּין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ
  choice: la lumière des ténèbres
  rationale: Après « séparer », la construction française idiomatique est « séparer X de Y ». Les articles définis et l’opposition lumière-ténèbres sont conservés.
- source_word: וַ/יַּ֥רְא אֱלֹהִ֖ים
  choice: Dieu vit
  rationale: Le passé simple convient au récit soutenu en français et rend l’avancement narratif du wayyiqtol. L’absence de « et » évite une coordination lourde tout en maintenant la succession des actes.
- source_word: כִּי טֽוֹב
  choice: que c’était bon
  rationale: « Bon » préserve l’étendue sémantique de טוב — bonté, convenance et juste ordonnance — ainsi que le refrain caractéristique de Genèse 1.
theological_decisions:
- issue: Fonction des luminaires dans la création
  choice: Les luminaires gouvernent le jour et la nuit en remplissant la fonction que Dieu leur assigne.
  alternative: Une formulation plus personnifiante pourrait laisser entendre qu’ils exercent une domination propre, comme des êtres divins.
  rationale: Le verbe משל est rendu sans l’affaiblir, tandis que le contexte maintient Dieu comme celui qui établit et évalue l’ordre créé. Aucune autonomie divine des luminaires n’est ajoutée au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset commence par « pour » parce qu’il poursuit syntaxiquement l’énumération des fonctions des luminaires amorcée au verset précédent. Le passé simple maintient un registre narratif biblique accessible sans archaïsme.
