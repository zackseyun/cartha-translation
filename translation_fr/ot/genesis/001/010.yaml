id: GEN.1.10
reference: Genesis 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: fr
  text: Dieu appela la terre ferme « Terre »[a], et il appela « Mers » l’amas des eaux. Dieu vit que c’était bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « terre », sans majuscule. Le mot hébreu אֶרֶץ peut être un nom commun signifiant « terre » ou, dans cette formule de dénomination, le nom donné à la terre ferme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: appela
  rationale: Dans ce contexte, le verbe désigne l’acte de donner un nom. « Appeler » est naturel en français et permet de conserver la répétition du texte hébreu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans Genèse 1, ce nom de forme plurielle régit des verbes au singulier et désigne le Créateur unique.
- source_word: לַיַּבָּשָׁה
  choice: la terre ferme
  rationale: Le nom désigne l’étendue sèche par opposition aux eaux rassemblées. « La terre ferme » est une expression française claire et idiomatique.
- source_word: אֶרֶץ
  choice: « Terre »
  rationale: Le mot est ici attribué comme nom à la terre ferme. La majuscule et les guillemets signalent cet acte de dénomination sans imposer le sens scientifique moderne de planète.
- source_word: מִקְוֵה הַמַּיִם
  choice: l’ensemble des eaux
  rationale: מִקְוֵה désigne ce qui est rassemblé ou la masse ainsi réunie. « L’ensemble des eaux » rend naturellement en français la totalité des eaux rassemblées.
- source_word: יַמִּים
  choice: « Mers »
  rationale: Le pluriel hébreu est conservé. La majuscule et les guillemets marquent le nom donné dans la formule parallèle.
- source_word: וַיַּרְא
  choice: vit
  rationale: « Voir » est l’équivalent direct et convient à la formule d’évaluation récurrente de Genèse 1.
- source_word: כִּי טוֹב
  choice: que c’était bon
  rationale: Cette formulation conserve la simplicité et l’ampleur de טוֹב sans en réduire le sens à la beauté, à l’utilité ou à l’agrément.
theological_decisions:
- issue: Faut-il comprendre אֶרֶץ comme un nom commun ou comme le nom attribué dans la formule de dénomination ?
  choice: Le rendre comme le nom « Terre »
  alternative: Le rendre par le nom commun « terre » ou « pays » sans majuscule
  rationale: Le contexte présente explicitement un acte de dénomination. La typographie française signale cette fonction littéraire, tandis qu’une note préserve l’ambiguïté lexicale et évite d’assimiler nécessairement le terme à la planète au sens moderne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du parallélisme hébreu, tout en évitant une tournure artificielle. Les guillemets français rendent explicite l’acte de nommer.
