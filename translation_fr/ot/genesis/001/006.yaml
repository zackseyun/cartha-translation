  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: fr
  text: 'Dieu dit : « Qu’il y ait une étendue[a] au milieu des eaux, et qu’elle sépare les eaux d’avec les eaux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « firmament », « voûte » ou « dôme ». Le mot hébreu רָקִיעַ désigne quelque chose d’étendu ou de déployé ; les traductions varient selon la manière dont elles représentent la conception ancienne du monde.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « séparant entre des eaux et les eaux », c’est-à-dire établissant une séparation entre une masse d’eau et une autre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dieu dit
  rationale: Le waw consécutif fait progresser le récit. En français, la simple succession des phrases suffit naturellement à exprimer cet enchaînement, sans qu’il soit nécessaire d’ajouter systématiquement « et » ou « puis ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans Genèse 1, ce nom de forme plurielle régit ici un verbe au singulier et désigne le Créateur unique.
- source_word: יְהִי
  choice: Qu’il y ait
  rationale: Le jussif de היה exprime la parole créatrice de Dieu. « Qu’il y ait » en restitue clairement la force performative en français moderne.
- source_word: רָקִיעַ
  choice: étendue
  rationale: Le terme désigne ce qui est étendu ou déployé. « Étendue » conserve cette image sans imposer dans le texte principal une reconstitution cosmologique plus précise; les possibilités plus concrètes sont signalées en note.
- source_word: בְּתוֹךְ הַמָּיִם
  choice: au milieu des eaux
  rationale: Cette formulation rend directement la position de l’étendue au sein des eaux primordiales et préserve l’image collective portée par le pluriel hébreu מַיִם.
- source_word: וִיהִי מַבְדִּיל
  choice: et qu’elle sépare
  rationale: Le second jussif prolonge la parole de commandement, tandis que le participe hiphil de בדל exprime l’action de causer une séparation. Le pronom féminin reprend naturellement « étendue ».
- source_word: בֵּין מַיִם לָמָיִם
  choice: les eaux en deux
  rationale: Cette expression française naturelle communique la séparation entre une masse d’eau et une autre. Une note conserve la tournure hébraïque plus littérale sans alourdir le texte principal.
theological_decisions:
- issue: Interprétation cosmologique de רָקִיעַ
  choice: étendue
  alternative: firmament, voûte ou dôme
  rationale: Le verset présente le רָקִיעַ comme ce que Dieu place au milieu des eaux pour les séparer. « Étendue » garde l’idée de quelque chose de déployé tout en évitant de trancher dans le texte principal entre diverses reconstructions du monde ancien. La note préserve les lectures plus concrètes.
- issue: Identification des deux ensembles d’eaux
  choice: ne pas les identifier dans ce verset
  alternative: les eaux d’en haut et les eaux d’en bas
  rationale: Le texte hébreu parle simplement d’une séparation entre des eaux et des eaux. Leur position respective n’est explicitée qu’au verset suivant; elle n’est donc pas anticipée ici.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe de la parole créatrice reste solennelle sans archaïsme. « Étendue » conserve l’ouverture sémantique du terme hébreu, tandis que « les eaux en deux » évite la tournure vieillie « les eaux d’avec les eaux ».
