  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: fr
  text: 'Dieu fit les deux grands luminaires : le plus grand pour gouverner le jour, le plus petit pour gouverner la nuit, et les étoiles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie couramment « faire ». Le passé simple convient au registre narratif biblique soutenu sans suggérer, comme « établit », une fonction qui relève plutôt du contexte.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Avec le verbe au singulier dans Genèse 1, אֱלֹהִים désigne ici le Dieu unique ; « Dieu » est le rendu français usuel et exact.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: les deux grands luminaires
  rationale: מָאוֹר désigne ce qui émet ou porte la lumière. « Luminaires » conserve cette désignation concrète sans introduire les mots « soleil » et « lune », absents de l’hébreu.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: le plus grand
  rationale: Dans l’opposition avec הַמָּאוֹר הַקָּטֹן, le français exprime naturellement la comparaison par « le plus grand » et « le plus petit ». Le nom « luminaire », immédiatement présent, peut être omis sans perte de sens.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: pour gouverner le jour
  rationale: מֶמְשֶׁלֶת exprime l’exercice d’une autorité ou d’un gouvernement. « Gouverner » est naturel en français et conserve l’image de la souveraineté sans la connotation souvent négative de « dominer sur ».
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: le plus petit
  rationale: קָטֹן signifie « petit » et forme ici un contraste avec גָּדוֹל. Le superlatif relatif français rend clairement cette opposition au sein de la paire.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: pour gouverner la nuit
  rationale: La traduction reprend la même construction que pour le jour afin de conserver le parallélisme hébreu.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: ainsi que les étoiles
  rationale: La conjonction et le marqueur d’objet direct ajoutent les étoiles aux objets que Dieu a faits. « Ainsi que » rend explicite ce rattachement en français tout en conservant l’effet d’ajout final ; la formulation plus littérale est signalée en note.
theological_decisions:
- issue: Désignation des corps célestes sans nommer le soleil ni la lune
  choice: Conserver « le plus grand » et « le plus petit » en référence aux deux luminaires.
  alternative: Traduire par « le soleil » et « la lune ».
  rationale: L’hébreu emploie מָאוֹר (« luminaire ») et non les termes ordinaires désignant le soleil et la lune. La traduction respecte cette diction et n’introduit pas de noms absents du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient la tenue narrative du contexte. Le parallélisme entre le jour et la nuit est conservé, tout comme l’absence volontaire des mots « soleil » et « lune ».
