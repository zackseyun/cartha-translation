  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽ/יְהִי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: fr
  text: 'Et Dieu dit : « Qu’il y ait[a] de la lumière ! » Et il y eut de la lumière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que la lumière soit. » L’hébreu emploie un jussif exprimant la volonté ou le commandement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et … dit
  rationale: Le wayyiqtol de אמר fait progresser le récit. « Et … dit » conserve l’enchaînement narratif hébreu dans un français naturel, sans préciser davantage la valeur de la conjonction.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans Genèse 1, ce nom de forme plurielle s’accorde avec un verbe au singulier et désigne le Créateur unique ; « Dieu » est l’équivalent français usuel.
- source_word: יְהִי
  choice: Qu’il y ait
  rationale: Le jussif de היה exprime ici la volonté ou l’ordre divin. « Qu’il y ait » est une formulation française idiomatique et solennelle qui convient à cette parole créatrice.
- source_word: אוֹר
  choice: de la lumière
  rationale: Le sens lexical de base est « lumière ». L’article partitif est naturel en français dans cette tournure existentielle, sans restreindre le référent à une source lumineuse particulière.
- source_word: וַיְהִי
  choice: Et il y eut
  rationale: Le wayyiqtol de היה rapporte l’accomplissement immédiat de la parole divine. « Et il y eut » est concis, naturel et garde la correspondance formelle avec « Qu’il y ait ».
- source_word: אוֹר
  choice: de la lumière
  rationale: La répétition du nom est conservée afin de refléter l’hébreu et de souligner l’accomplissement exact de la parole prononcée.
theological_decisions:
- issue: Rendu de l’ordre créateur divin
  choice: Qu’il y ait de la lumière !
  alternative: Que la lumière soit ! / Puisse-t-il y avoir de la lumière !
  rationale: Le jussif hébreu exprime une volonté ou un ordre efficace. « Qu’il y ait de la lumière ! » préserve la nuance existentielle de היה et la force solennelle de la parole créatrice, sans transformer le verset en explication théologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe brève reproduit le rythme de l’hébreu. Le point d’exclamation rend la force de l’ordre créateur sans ajouter de contenu ; le marqueur [a] est placé immédiatement après le verbe concerné.
