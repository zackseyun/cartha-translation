  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: fr
  text: À tous les animaux de la terre, à tous les oiseaux du ciel et à tout ce qui se déplace sur la terre et qui a vie, je donne toute plante verte comme nourriture. Et il en fut ainsi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: animaux de la terre
  rationale: Dans ce contexte, חַיָּה désigne les animaux terrestres. « Animaux de la terre » est naturel et n’impose pas la nuance de « sauvages », absente du terme lui-même.
- source_word: עוֹף הַשָּׁמַיִם
  choice: oiseaux du ciel
  rationale: עוֹף peut englober les créatures volantes, mais « oiseaux du ciel » est l’expression française courante et convient aux catégories du récit.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: tout ce qui se déplace sur la terre
  rationale: רמשׂ exprime un mouvement au ras du sol ou, plus largement, le fait de se mouvoir. Cette formulation française inclut les petites créatures concernées sans suggérer qu’elles rampent toutes.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: et qui est un être vivant
  rationale: נֶפֶשׁ חַיָּה signifie ici « être/créature vivante », et non « souffle de vie », qui traduirait une autre expression hébraïque. La formulation rattache naturellement la relative à l’ensemble distributif.
- source_word: אֶת כָּל יֶרֶק עֵשֶׂב
  choice: toute plante verte
  rationale: Le groupe désigne la végétation verte ou les plantes vertes données comme nourriture. « Toute plante verte » reste concret et compréhensible.
- source_word: לְאָכְלָה
  choice: servira de nourriture
  rationale: Le lamed exprime la destination ou l’usage alimentaire. Le futur français complète naturellement la proposition nominale elliptique de l’hébreu, sans réintroduire un verbe divin absent de ce verset.
- source_word: וַיְהִי כֵן
  choice: Et il en fut ainsi
  rationale: Formule française consacrée, digne et fidèle à la formule d’accomplissement répétée en Genèse 1.
theological_decisions:
- issue: Sens de נֶפֶשׁ חַיָּה appliqué aux animaux
  choice: être vivant
  alternative: âme vivante
  rationale: « Être vivant » rend le sens concret de l’expression dans le récit sans confondre נֶפֶשׁ avec une doctrine particulière de l’âme et sans le remplacer par « souffle de vie », expression correspondant à un autre syntagme hébreu.
- issue: Verbe sous-entendu dans la proposition alimentaire
  choice: servira de nourriture
  alternative: je donne comme nourriture
  rationale: Le texte du verset 30 ne répète pas נָתַתִּי, présent au verset 29. La traduction conserve l’ellipse tout en produisant une phrase française complète; elle évite donc d’insérer explicitement « je donne » dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La coordination distributive de l’hébreu est conservée, tout en évitant les tours archaïques. « Se déplace » est préféré à « rampe » pour ne pas restreindre indûment רמשׂ; « être vivant » préserve la terminologie du récit de création.
