revisions:
- from: À tous les animaux de la terre, à tous les oiseaux du ciel et à tout ce qui se déplace sur la terre et qui est un être vivant, toute plante verte servira de nourriture.[a] Et il en fut ainsi.
  to: À tous les animaux de la terre, à tous les oiseaux du ciel et à tout ce qui se déplace sur la terre et qui a vie, je donne toute plante verte comme nourriture. Et il en fut ainsi.
  rationale: La révision explicite en français le verbe de don sous-entendu et repris du verset 29, sans prétendre qu’il est répété dans l’hébreu de 1:30. Elle remplace également « qui est un être vivant » par « qui a vie », formulation plus idiomatique qui conserve le sens de נֶפֶשׁ חַיָּה sans import doctrinal.
