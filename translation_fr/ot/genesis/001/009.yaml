  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: fr
  text: 'Et Dieu dit : « Que les eaux qui sont sous les cieux[a] se rassemblent en un seul lieu, et que la terre ferme apparaisse. » Et il en fut ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous le ciel ». Le mot hébreu שָׁמַיִם peut désigner le ciel ou les cieux, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et … dit
  rationale: Le waw consécutif fait progresser le récit. « Et … dit » conserve l’enchaînement sobre et solennel de l’hébreu sans préciser davantage la relation temporelle.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans Genèse 1, le nom est accompagné d’un verbe au singulier et désigne le Dieu créateur ; « Dieu » est l’équivalent français naturel.
- source_word: יִקָּווּ
  choice: Que … se rassemblent
  rationale: Le jussif exprime l’ordre divin. La tournure pronominale rend naturellement en français le rassemblement des eaux sans imposer un agent distinct non exprimé.
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le pluriel « les eaux » correspond à la forme hébraïque et au registre élevé du récit de la création.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: qui sont sous les cieux
  rationale: Cette formulation française explicite naturellement la localisation marquée par la construction hébraïque. « Les cieux » préserve le vocabulaire cosmologique du passage, tandis qu’une note signale l’autre sens possible.
- source_word: אֶל מָקוֹם אֶחָד
  choice: en un seul lieu
  rationale: « En » exprime le mouvement vers le lieu de rassemblement ; « un seul » rend explicitement אֶחָד et souligne l’unification spatiale sans ajout interprétatif.
- source_word: וְתֵרָאֶה
  choice: et que … apparaisse
  rationale: Le nifal jussif poursuit la série des ordres divins. « Apparaître » rend naturellement le fait que le sol sec devient visible.
- source_word: הַיַּבָּשָׁה
  choice: la terre ferme
  rationale: L’expression désigne l’étendue sèche opposée aux eaux. « La terre ferme » est idiomatique en français et prépare la dénomination du verset suivant.
- source_word: וַיְהִי כֵן
  choice: Et il en fut ainsi
  rationale: Cette formule française, naturelle et digne, restitue le refrain d’accomplissement répété dans Genèse 1.
theological_decisions:
- issue: Sens cosmologique de שָׁמַיִם dans le récit de la création
  choice: les cieux
  alternative: le ciel
  rationale: Le mot hébreu peut désigner le ciel visible ou les cieux. Le pluriel traditionnel et littéraire « les cieux » respecte ici la forme et le registre du récit sans définir un modèle cosmologique précis ; la note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La coordination répétée et les jussifs conservent la cadence solennelle du récit, tout en employant des formulations idiomatiques pour un lectorat général.
