source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: fr
  text: Au commencement, lorsque Dieu créa les cieux et la terre[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On traduit traditionnellement ce verset comme une phrase complète : « Au commencement, Dieu créa les cieux et la terre. » Toutefois, l’hébreu — בְּרֵאשִׁית sans article, suivi du verbe conjugué בָּרָא — se lit plus naturellement comme une proposition temporelle dépendante, comparable à Genèse 2.4b. La proposition principale arrive au verset 3 : « Dieu dit : “Que la lumière soit !” »'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Au commencement, lorsque … créa
  rationale: L’absence d’article devant רֵאשִׁית et la présence immédiate du verbe conjugué בָּרָא favorisent une proposition temporelle dépendante. Cette formulation conserve aussi la valeur lexicale de « commencement » et fait entendre le titre hébreu du livre, Bereshit.
- source_word: בָּרָא
  choice: créa
  rationale: Le verbe בָּרָא est le terme hébreu courant pour l’action créatrice de Dieu. « Créa » en est l’équivalent français direct et traditionnel, sans préciser indûment le procédé de création.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Bien que sa forme soit morphologiquement plurielle, אֱלֹהִים est ici sujet d’un verbe au singulier et désigne donc Dieu au singulier.
- source_word: אֵת
  choice: '[non traduit : marqueur du complément d’objet direct défini]'
  rationale: אֵת marque en hébreu les compléments d’objet direct définis et n’a pas d’équivalent lexical à rendre en français.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: « Les cieux » reflète la forme plurielle hébraïque. Avec « la terre », l’expression désigne l’ensemble de l’ordre créé.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: אָרֶץ peut signifier « terre » ou « pays » ; dans l’expression cosmique « les cieux et la terre », le sens « la terre » s’impose.
theological_decisions:
- issue: Syntaxe de la proposition d’ouverture
  choice: 'Proposition temporelle dépendante : « Au commencement, lorsque Dieu créa les cieux et la terre — »'
  alternative: 'Phrase principale indépendante : « Au commencement, Dieu créa les cieux et la terre. »'
  rationale: L’absence d’article devant בְּרֵאשִׁית, son association immédiate avec le verbe conjugué בָּרָא et les ouvertures comparables de Genèse 2.4b et d’Osée 1.2 favorisent la lecture dépendante. Le tiret signale que la construction se poursuit jusqu’à la proposition principale du verset 3. La lecture traditionnelle demeure indiquée en note afin de préserver l’ambiguïté réelle du texte sans faire dépendre une doctrine de ce seul choix syntaxique.
translation_notes:
  register: Français international moderne, naturel et digne. « Lorsque » marque clairement le lien temporel, tandis que le passé simple « créa » convient au registre narratif biblique sans être archaïque. « Les cieux et la terre » conserve la forme et la portée globale de l’expression hébraïque.
