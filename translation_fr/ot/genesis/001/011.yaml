id: GEN.1.11
reference: Genesis 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: fr
  text: 'Et Dieu dit : « Que la terre fasse pousser de la végétation : des plantes produisant de la semence et des arbres fruitiers portant du fruit selon leur espèce[a], avec leur semence en eux[b], sur la terre. » Et ce fut ainsi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « selon son espèce »; le singulier hébreu a ici une valeur distributive.
    reason: lexical_alternative
  - marker: b
    text: Ou « dont la semence est en lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: Que la terre fasse pousser
  rationale: Le hiphil à valeur jussive exprime ici une action causative demandée à la terre. « Fasse pousser » restitue cette valeur et l’image de la végétation qui sort du sol.
- source_word: דֶּשֶׁא
  choice: végétation
  rationale: Le nom collectif désigne largement la jeune croissance végétale; « végétation » évite de le réduire à l’herbe.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: des plantes produisant de la semence
  rationale: « Plantes » rend naturellement le collectif עֵשֶׂב, tandis que le participe décrit leur capacité caractéristique à produire de la semence.
- source_word: עֵץ פְּרִי עֹשֶׂה פְּרִי
  choice: des arbres fruitiers portant du fruit
  rationale: Cette formulation française courante conserve le lien lexical entre l’arbre fruitier et son action caractéristique.
- source_word: לְמִינוֹ
  choice: selon leur espèce
  rationale: Le suffixe hébreu est singulier, mais sa portée est distributive. Le pluriel français renvoie naturellement aux arbres considérés collectivement, tandis que « espèce » demeure au singulier pour chaque arbre ou classe.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: avec leur semence en eux
  rationale: La formulation conserve l’idée que la semence se trouve dans les fruits ou arbres concernés, sans préciser davantage un antécédent que l’hébreu laisse au singulier distributif.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Équivalent locatif direct et idiomatique dans le contexte de la création.
- source_word: וַיְהִי כֵן
  choice: Et ce fut ainsi
  rationale: Formule française concise et solennelle qui rend la formule d’accomplissement récurrente du récit.
theological_decisions:
- issue: Portée des catégories végétales créées
  choice: Conserver les catégories générales de végétation, de plantes produisant de la semence et d’arbres fruitiers.
  alternative: Réduire דֶּשֶׁא à « herbe » ou généraliser l’ensemble en « toutes sortes de plantes ».
  rationale: Le texte emploie un langage phénoménologique et ordonné, sans taxonomie botanique moderne. La traduction maintient ses distinctions sans leur imposer une précision scientifique anachronique.
translation_notes:
  register: Français international moderne, clair et digne. La cadence narrative est préservée; les termes botaniques restent généraux et accessibles. Les accords au pluriel rendent naturellement en français les collectifs et le singulier distributif de l’hébreu.
