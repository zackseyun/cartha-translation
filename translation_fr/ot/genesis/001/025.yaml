  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: fr
  text: Dieu fit les animaux sauvages de la terre selon leurs sortes[a], les animaux domestiques selon leurs sortes, et toutes les petites créatures qui se déplacent sur le sol[c], selon leurs sortes[b]. Dieu vit que cela était bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bêtes de la terre ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « selon son espèce » ou « selon leurs espèces », selon la catégorie concernée. Le mot désigne ici des catégories de créatures et ne doit pas être assimilé automatiquement aux espèces de la taxonomie scientifique moderne.
    reason: cultural_note
  - marker: c
    text: Ou « toutes les créatures qui rampent sur le sol ». L’hébreu emploie ici le mot « sol », distinct du mot « terre » utilisé plus tôt dans le verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie couramment « faire ». « Fit » exprime directement l’acte créateur sans ajouter l’idée plus précise de façonner.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Bien que le nom ait une forme plurielle, il commande ici un verbe au singulier et désigne l’unique Créateur.
- source_word: חַיַּת הָאָרֶץ
  choice: les animaux sauvages de la terre
  rationale: Dans cette énumération, l’expression désigne les animaux terrestres non domestiques, distincts des בהמה et des petites créatures qui se déplacent près du sol.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: selon leur espèce
  rationale: מין désigne une sorte ou une catégorie de créatures. « Espèce » est naturel dans ce contexte en français, mais ne doit pas être compris comme un terme technique de la taxonomie moderne.
- source_word: הַבְּהֵמָה
  choice: les animaux domestiques
  rationale: Dans le contraste de ce verset, בהמה renvoie principalement aux grands animaux vivant auprès des humains. Cette traduction est plus large et plus exacte que « le bétail », qui peut paraître limité aux animaux d’élevage considérés comme biens.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: toutes les petites bêtes qui se déplacent sur le sol
  rationale: רמש désigne les petites créatures qui se meuvent près du sol, sans nécessairement limiter leur mouvement à la reptation. « Sur le sol » rend naturellement la relation tout en préservant la distinction entre אֶרֶץ, « terre », et אֲדָמָה, « sol ».
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Dieu vit que cela était bon
  rationale: Cette formulation française naturelle restitue le refrain d’évaluation de Genèse 1; « cela » reprend l’ensemble de l’œuvre qui vient d’être décrite.
theological_decisions:
- issue: Rendre les catégories de la création sans importer la taxonomie scientifique moderne
  choice: selon leur espèce
  alternative: selon leur sorte
  rationale: Ici, מין indique des catégories de créatures sans les définir selon la notion biologique moderne d’espèce. Le choix français reste idiomatique, et une note prévient une lecture anachronique.
- issue: Maintenir la distinction entre הָאָרֶץ et הָאֲדָמָה
  choice: terre … sol
  alternative: terre … terre
  rationale: Employer deux termes français distincts reflète la variation lexicale intentionnelle de l’hébreu au sein du même verset.
- issue: Portée de בהמה dans la classification du verset
  choice: animaux domestiques
  alternative: bétail
  rationale: Le contexte oppose cette catégorie aux animaux sauvages et aux petites créatures du sol. « Animaux domestiques » rend cette opposition sans réduire la catégorie aux seuls bovins.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la progression ternaire de l’hébreu et son refrain final. « Petites bêtes qui se déplacent » évite le caractère excessivement restrictif de « reptiles » et l’impression que toutes ces créatures rampent au sens strict.
