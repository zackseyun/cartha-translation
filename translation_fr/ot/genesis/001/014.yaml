language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: fr
  text: 'Dieu dit : « Qu’il y ait des luminaires dans l’étendue du ciel pour séparer le jour de la nuit. Qu’ils servent de signes et qu’ils marquent les temps fixés[a], les jours et les années. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « saisons ». Le mot hébreu peut désigner plus largement des temps déterminés et, dans d’autres contextes, des fêtes fixées.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: luminaires
  rationale: Le nom désigne des sources ou porteurs de lumière. « Luminaires » est précis, courant dans ce contexte et évite de confondre ces objets avec la lumière elle-même.
- source_word: רָקִיעַ
  choice: étendue
  rationale: « Étendue » rend l’idée de ce qui est déployé sans imposer plus précisément l’image d’une voûte matérielle ; « firmament » serait plus traditionnel, mais aussi plus archaïque.
- source_word: הַשָּׁמַיִם
  choice: le ciel
  rationale: Dans ce contexte, le terme désigne l’espace céleste où se trouvent les luminaires. Le singulier collectif « le ciel » est l’expression française la plus naturelle.
- source_word: לְהַבְדִּיל
  choice: pour séparer
  rationale: L’infinitif exprime ici le but et reprend le motif des séparations qui structurent le récit de la création.
- source_word: לְאֹתֹת
  choice: servent de signes
  rationale: Le terme peut désigner des signes, marques ou indicateurs. Cette formulation conserve sa portée générale sans préciser indûment la nature de ces signes.
- source_word: לְמוֹעֲדִים
  choice: marquent les temps fixés
  rationale: מֹועֲדִים désigne des temps déterminés ou assignés et peut, selon le contexte, inclure les fêtes fixées. Le verbe « marquent » explicite naturellement en français la fonction temporelle des luminaires sans restreindre le terme aux seules saisons.
- source_word: לְיָמִים וְשָׁנִים
  choice: les jours et les années
  rationale: Traduction directe des unités temporelles nommées dans le texte.
- source_word: יְהִי ... וְהָיוּ
  choice: Qu’il y ait… Qu’ils servent…
  rationale: Ces tournures rendent naturellement en français l’ordre créateur, puis la fonction assignée aux luminaires.
theological_decisions:
- issue: Portée de מוֹעֲדִים dans le cadre de la création
  choice: temps fixés
  alternative: saisons ; fêtes fixées
  rationale: Le contexte concerne l’organisation cosmique du temps. « Temps fixés » préserve cette portée large ainsi que la possibilité d’une résonance avec les fêtes prescrites ailleurs, sans limiter le sens aux saisons climatiques ni importer explicitement le calendrier cultuel d’Israël.
- issue: Rapport syntaxique entre les signes et les indications temporelles
  choice: 'deux fonctions coordonnées : servir de signes et marquer les temps fixés, les jours et les années'
  alternative: être des signes servant à marquer toutes les unités temporelles qui suivent
  rationale: La répétition de la préposition hébraïque devant « signes » et « temps fixés » permet de les entendre comme des fonctions coordonnées. La formulation française reste fluide tout en évitant de réduire entièrement les « signes » aux seuls repères calendaires.
translation_notes:
  register: Français moderne, international et digne. « Luminaires » et « étendue du ciel » conservent le registre élevé du récit sans archaïsme marqué. La seconde phrase explicite légèrement la relation fonctionnelle afin d’éviter une construction française artificielle.
