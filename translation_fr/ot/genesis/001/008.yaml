  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: fr
  text: 'Dieu appela l’étendue[a] « ciel »[b]. Et il y eut un soir, et il y eut un matin : le deuxième jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « firmament » (terme traditionnel) ou « voûte ». Le mot hébreu רָקִיעַ désigne quelque chose d’étendu ou de déployé ; « étendue » évite de préciser davantage sa forme ou sa constitution.
    reason: lexical_alternative
  - marker: b
    text: Ou « cieux ». Le mot hébreu שָׁמַיִם peut désigner le ciel ou les cieux ; il est ici le nom que Dieu donne à l’étendue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Avec la préposition ל, קרא exprime ici l’acte de nommer. « Appela » conserve la formulation sobre et répétitive du récit.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, elle régit ici un verbe au singulier et désigne le Créateur unique.
- source_word: לָרָקִיעַ
  choice: l’étendue
  rationale: רָקִיעַ désigne ce qui est étendu ou déployé. « Étendue » reste accessible et évite aussi bien l’archaïsme de « firmament » que la précision interprétative de « voûte ».
- source_word: שָׁמָיִם
  choice: « ciel »
  rationale: Le mot est ici le nom donné par Dieu à l’étendue. Le singulier français « ciel » convient naturellement au ciel visible tout en préservant la portée élevée du récit.
- source_word: וַיְהִי
  choice: il y eut
  rationale: Cette tournure française rend naturellement la formule narrative récurrente et en conserve le rythme.
- source_word: עֶרֶב
  choice: soir
  rationale: « Soir » est le sens courant du terme dans la formule qui clôt chaque journée de création.
- source_word: בֹקֶר
  choice: matin
  rationale: « Matin » est le sens courant du terme dans la formule récurrente.
- source_word: יוֹם שֵׁנִי
  choice: deuxième jour
  rationale: Cette formulation garde le caractère bref de l’étiquette ordinale hébraïque. L’absence d’article en français reflète aussi la concision de l’original sans ajouter « ce fut ».
theological_decisions:
- issue: Sens de שָׁמָיִם comme nom donné au רָקִיעַ
  choice: « ciel »
  alternative: « cieux » ou « voûte céleste »
  rationale: « Ciel » peut désigner naturellement l’espace visible au-dessus de la terre sans imposer qu’il soit exclusivement le lieu de la demeure divine ni fixer un modèle cosmologique particulier.
- issue: Nature du רָקִיעַ
  choice: « étendue »
  alternative: « firmament » ou « voûte »
  rationale: Le texte évoque quelque chose de déployé, mais n’en explicite pas ici la constitution. « Étendue » préserve cette relative indétermination.
translation_notes:
  register: Français international moderne, sobre et soutenu. La répétition « et il y eut » conserve le rythme liturgique et narratif de l’hébreu. Les guillemets signalent clairement que « ciel » est le nom attribué à l’étendue.
