  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: fr
  text: 'Il y eut un soir, et il y eut un matin : ce fut le quatrième jour.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Il y eut un soir et il y eut un matin : un quatrième jour. »'
    reason: Alternative lexicale et syntaxique reflétant plus directement l’absence d’article explicite en hébreu.
lexical_decisions:
- source_word: וַיְהִי
  choice: il y eut
  rationale: Le wayyiqtol de היה a ici une valeur existentielle dans la formule narrative récurrente. « Il y eut » est naturel en français et évite de surinterpréter le verbe comme « devint ».
- source_word: עֶרֶב
  choice: un soir
  rationale: Le nom désigne le soir. L’article indéfini convient à la formule française et conserve le sens direct du terme.
- source_word: וַיְהִי
  choice: il y eut
  rationale: La répétition est maintenue afin de préserver la cadence et le parallélisme de la formule hébraïque.
- source_word: בֹקֶר
  choice: un matin
  rationale: Le nom désigne le matin. « Un matin » est l’équivalent direct et naturel dans ce refrain.
- source_word: יוֹם רְבִיעִי
  choice: le quatrième jour
  rationale: L’expression hébraïque associe « jour » à un ordinal. « Le quatrième jour » est la formulation française habituelle; l’article défini est fourni par l’idiome français.
theological_decisions:
- issue: Rendre le refrain des jours de la création sans imposer une chronologie ni une interprétation de leur durée
  choice: 'Il y eut un soir, et il y eut un matin : ce fut le quatrième jour.'
  alternative: 'Il y eut un soir et il y eut un matin : un quatrième jour.'
  rationale: La traduction conserve les éléments et le rythme du refrain hébreu sans préciser la nature ou la durée du « jour ». « Le quatrième jour » est retenu pour son naturel en français, tandis que la note signale la construction plus formelle et son indétermination grammaticale.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « il y eut » préserve la solennité et la structure du refrain hébreu; les termes « soir », « matin » et « jour » restent volontairement non interprétés.
