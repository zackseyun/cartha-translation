  text: וַ/יְהִי֙ כִּֽי זָקֵ֣ן יִצְחָ֔ק וַ/תִּכְהֶ֥יןָ עֵינָ֖י/ו מֵ/רְאֹ֑ת וַ/יִּקְרָ֞א אֶת עֵשָׂ֣ו בְּנ֣/וֹ הַ/גָּדֹ֗ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ בְּנִ֔/י וַ/יֹּ֥אמֶר אֵלָ֖י/ו הִנֵּֽנִ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: fr
  text: 'Alors qu’Isaac était devenu vieux et que ses yeux s’étaient affaiblis au point de ne plus voir, il appela Ésaü, son fils aîné[a], et lui dit : « Mon fils ! » Ésaü lui répondit : « Me voici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son fils le plus âgé ».
    reason: Variante lexicale permettant de rendre הַגָּדֹל de manière comparative plutôt que par le terme familial « aîné ».
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Alors que
  rationale: La formule ouvre une nouvelle scène et introduit ici les circonstances temporelles. « Alors que » restitue cette fonction dans un français actuel sans recourir au tour plus archaïque « Il arriva que ».
- source_word: זָקֵן
  choice: était devenu vieux
  rationale: Le contexte présente l’âge avancé d’Isaac comme une situation désormais établie. Le plus-que-parfait convient aux circonstances antérieures à l’appel d’Ésaü.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: ses yeux s’étaient affaiblis au point de ne plus voir
  rationale: Le verbe décrit l’affaiblissement des yeux, et l’infinitif exprime l’incapacité qui en résulte. Cette formulation conserve l’image concrète des yeux et le rapport de conséquence.
- source_word: וַיִּקְרָא
  choice: il appela
  rationale: Dans ce contexte, קרא signifie appeler quelqu’un auprès de soi ou s’adresser à lui. « Appela » reste naturel sans ajouter la formalité de « convoqua ».
- source_word: אֶת עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: Ésaü, son fils aîné
  rationale: הַגָּדֹל distingue Ésaü comme le fils plus âgé. « Fils aîné » est l’expression française idiomatique, tandis que « fils le plus âgé » demeure une traduction possible.
- source_word: בְּנִי
  choice: Mon fils !
  rationale: Le suffixe possessif est rendu explicitement, et le point d’exclamation fait entendre l’interpellation sans en modifier le contenu.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: Formule de réponse qui exprime à la fois la présence et la disponibilité; « Me voici » en est l’équivalent français traditionnel et toujours intelligible.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe temporelle reste fluide, tandis que « ses yeux » conserve l’image hébraïque. Les répétitions hébraïques de « il lui dit » sont légèrement explicitées par le nom « Ésaü » afin d’éviter toute ambiguïté de locuteur.
