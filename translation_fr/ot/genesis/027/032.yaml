base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: fr
  text: 'Son père Isaac[a] lui dit : « Qui es-tu ? » Il dit : « Je suis ton fils, ton premier-né[b], Ésaü. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Isaac, son père » ; rendu idiomatiquement par « Son père Isaac ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ton fils aîné ». « Premier-né » conserve l’accent mis sur l’ordre de naissance, important dans le récit environnant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: lui dit
  rationale: Le verbe אמר est le verbe courant de parole, et לֹו en indique le destinataire. « Lui dit » restitue directement et naturellement l’hébreu.
- source_word: יִצְחָק אָבִיו
  choice: Isaac, son père
  rationale: L’ordre hébreu est littéralement « Isaac, son père ». Cette formulation française reste naturelle et conserve Isaac comme sujet explicite ainsi que son lien avec Ésaü.
- source_word: מִי אָתָּה
  choice: Qui es-tu ?
  rationale: Équivalent français direct et idiomatique de la question hébraïque.
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Bien que אמר signifie littéralement « dire », « répondit » exprime naturellement en français la fonction de cette prise de parole après une question, sans modifier son contenu.
- source_word: אֲנִי בִּנְךָ
  choice: Je suis ton fils
  rationale: La proposition nominale hébraïque n’exprime pas la copule; le français exige ici « suis ».
- source_word: בְכֹרְךָ
  choice: ton premier-né
  rationale: בכור désigne le fils né le premier et porte, dans ce récit, l’enjeu du droit d’aînesse. « Premier-né » préserve mieux cette portée que le seul adjectif « aîné ».
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
theological_decisions:
- issue: Portée narrative et juridique de בְכֹרְךָ
  choice: ton premier-né
  alternative: ton fils aîné
  rationale: « Premier-né » maintient l’accent sur l’ordre de naissance et sa portée dans le conflit relatif au droit d’aînesse, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation française du dialogue est employée. « Il répondit » évite la répétition peu naturelle de « dit » tout en rendant la fonction discursive du second וַיֹּאמֶר.
