base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: fr
  text: 'Ésaü prit Jacob en haine à cause de la bénédiction dont son père l’avait béni. Ésaü se dit en son cœur : « Les jours de deuil pour mon père approchent[a] ; alors je tuerai mon frère Jacob. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les jours de deuil de mon père approchent. » L’hébreu peut désigner soit le deuil qui suivra la mort d’Isaac, soit une période de chagrin vécue par Isaac lui-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: prit … en haine
  rationale: Le verbe שׂטם exprime une hostilité persistante plutôt qu’une émotion passagère. « Prendre en haine » est naturel en français, marque le développement d’une inimitié durable et convient à la résolution meurtrière qui suit.
- source_word: עַל הַבְּרָכָה
  choice: à cause de la bénédiction
  rationale: La préposition עַל a ici une valeur causale ; cette formulation française est claire et directe.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: dont son père l’avait béni
  rationale: Cette formulation conserve la répétition hébraïque entre « bénédiction » et « béni », tout en employant le plus-que-parfait adapté à l’antériorité de l’action.
- source_word: בְּלִבּוֹ
  choice: se dit en son cœur
  rationale: La tournure conserve l’image hébraïque du cœur comme lieu de la délibération intérieure, tout en étant compréhensible en français biblique moderne.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: Les jours de deuil pour mon père approchent
  rationale: Cette traduction rend l’interprétation contextuellement probable d’un deuil qui suivrait la mort d’Isaac, sans effacer l’autre analyse possible du groupe construit hébreu, signalée en note.
- source_word: וְאַהַרְגָה
  choice: alors je tuerai
  rationale: Le futur rend la résolution exprimée par la forme cohortative, et « alors » explicite la succession temporelle impliquée dans le contexte.
- source_word: אָחִי
  choice: mon frère Jacob
  rationale: Le possessif explicite est conservé ; placer « mon frère » avant le nom est idiomatique en français et souligne la gravité du projet fratricide.
theological_decisions:
- issue: Ambiguïté de יְמֵי אֵבֶל אָבִי
  choice: le deuil célébré pour Isaac après sa mort
  alternative: la période de deuil éprouvée par Isaac lui-même
  rationale: Le projet d’Ésaü d’attendre avant de tuer Jacob favorise la première lecture, mais la syntaxe hébraïque permet la seconde ; celle-ci est donc préservée en note plutôt qu’exclue.
translation_notes:
  register: Français international moderne, digne et accessible. « Prit … en haine » évite à la fois la faiblesse de « en voulut à » et une formulation savante. L’idiome « en son cœur » est maintenu en raison de sa clarté et de sa portée anthropologique dans le texte biblique.
