  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: fr
  text: 'Isaac fut pris d’un tremblement extrêmement violent et dit : « Qui donc était-ce qui avait chassé du gibier et m’en avait apporté, et que j’ai béni après avoir mangé de tout, avant ton arrivée ? Oui, il sera béni[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Assurément, il sera béni. »'
    reason: Cette variante fait ressortir plus explicitement la valeur emphatique de גַּם ; « Oui » reste toutefois plus naturel dans le dialogue.
lexical_decisions:
- source_word: וַיֶּחֱרַד יִצְחָק חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: Isaac fut saisi d’un immense tremblement
  rationale: La tournure conserve l’intensification produite en hébreu par le verbe et son nom apparenté, tout en évitant en français la lourdeur de « trembla d’un très grand tremblement ». Elle exprime à la fois la réaction physique et le bouleversement profond.
- source_word: מִי אֵפוֹא הוּא
  choice: Qui donc était-ce
  rationale: « donc » rend la valeur inférentielle et emphatique de אֵפוֹא. L’imparfait s’accorde naturellement en français avec la recherche de l’identité de la personne venue auparavant.
- source_word: הַצָּד צַיִד
  choice: celui qui avait chassé du gibier
  rationale: « gibier » garde le sens général de צַיִד sans le limiter à la venaison. Le plus-que-parfait situe naturellement cette chasse avant la scène présente.
- source_word: וַיָּבֵא לִי
  choice: et m’en avait apporté
  rationale: Le pronom « en » reprend clairement le gibier sans ajouter un objet absent de l’hébreu.
- source_word: וָאֹכַל מִכֹּל
  choice: J’ai mangé de tout
  rationale: Cette formulation préserve la nuance partitive de מִכֹּל et reste naturelle en français; dans le contexte, « tout » renvoie aux mets apportés.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: avant que tu arrives
  rationale: La proposition temporelle est rendue directement, dans un français actuel et oralement intelligible.
- source_word: וָאֲבָרֲכֵהוּ
  choice: et je l’ai béni
  rationale: Le sujet à la première personne et le complément masculin sont explicitement conservés, comme l’exige naturellement la syntaxe française.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: Oui, il sera béni
  rationale: « Oui » rend ici la confirmation emphatique portée par גַּם, tandis que le futur conserve la force de יִהְיֶה sans expliquer davantage la nature de l’efficacité de la bénédiction.
theological_decisions:
- issue: Portée de la déclaration finale d’Isaac après la bénédiction
  choice: Une confirmation ferme que l’homme déjà béni restera béni
  alternative: Une simple constatation résignée, ou une formule explicitant une doctrine de l’irrévocabilité absolue de toute bénédiction patriarcale
  rationale: L’énoncé emphatique גַּם בָּרוּךְ יִהְיֶה affirme que la bénédiction prononcée demeure. La traduction en garde le poids narratif et théologique sans définir le mécanisme ni importer une doctrine ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition intensive hébraïque est rendue par « immense tremblement » plutôt que reproduite littéralement. La ponctuation répartit en français la question d’identité et le récit des actes accomplis, sans modifier leur enchaînement. Le marqueur de note [a] est placé sur la déclaration qu’il commente.
