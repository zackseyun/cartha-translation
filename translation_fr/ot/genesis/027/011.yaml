  text: וַ/יֹּ֣אמֶר יַעֲקֹ֔ב אֶל רִבְקָ֖ה אִמּ֑/וֹ הֵ֣ן עֵשָׂ֤ו אָחִ/י֙ אִ֣ישׁ שָׂעִ֔ר וְ/אָנֹכִ֖י אִ֥ישׁ חָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: fr
  text: 'Mais Jacob dit à Rébecca, sa mère : « Voici[a], Ésaü, mon frère, est un homme velu, tandis que moi, je suis un homme à la peau lisse[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Regarde » ou « Vois » ; la particule hébraïque attire l’attention et introduit l’objection de Jacob.
    reason: lexical_alternative
  - marker: b
    text: L’expression « à la peau lisse » indique ici que Jacob n’était pas velu, par contraste avec Ésaü.
    reason: clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Jacob dit
  rationale: Le waw consécutif fait avancer le récit, mais le contexte donne à la parole de Jacob la valeur d’une objection; « mais » rend naturellement cette relation en français.
- source_word: אִמּוֹ
  choice: sa mère
  rationale: L’apposition identifie la relation de Rébecca avec Jacob; le nom et le lien familial sont tous deux conservés.
- source_word: הֵן
  choice: Regarde
  rationale: La particule attire l’attention et introduit l’objection de Jacob. « Regarde » est actuel et idiomatique, sans l’archaïsme de « voici » dans cet emploi oral.
- source_word: אִישׁ שָׂעִר
  choice: un homme velu
  rationale: Cette formulation naturelle conserve le substantif אִישׁ et décrit l’abondante pilosité d’Ésaü.
- source_word: וְאָנֹכִי
  choice: tandis que moi, je suis
  rationale: Le pronom indépendant אָנֹכִי marque l’emphase et le contraste avec Ésaü; « tandis que moi » explicite cette opposition sans modifier le contenu.
- source_word: אִישׁ חָלָק
  choice: un homme à la peau lisse
  rationale: Dans le contraste avec « velu », חָלָק désigne ici l’absence relative de poils corporels. La formulation évite l’ambiguïté peu naturelle de « un homme lisse » en français tout en gardant le mot « homme ».
