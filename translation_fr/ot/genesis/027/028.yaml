  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: fr
  text: Que Dieu te donne de la rosée du ciel[a], de la richesse de la terre, ainsi que des céréales et du vin nouveau en abondance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La préposition hébraïque peut exprimer une part prélevée sur ces biens ou leur provenance. L’expression évoque, avec la « richesse de la terre », la fertilité et l’abondance agricoles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Que … donne
  rationale: Dans le contexte de la bénédiction prononcée par Isaac, la forme verbale exprime naturellement un souhait. La tournure française « Que Dieu te donne » en restitue la valeur de bénédiction plutôt qu’une simple prédiction.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article en hébreu, le terme fonctionne ici comme le titre défini désignant Dieu ; « Dieu » est l’équivalent français naturel.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: de la rosée du ciel
  rationale: La préposition מִן peut avoir ici une nuance partitive ou indiquer la provenance. « De la rosée du ciel » conserve cette souplesse sans ajouter un quantificateur absent du texte.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: de la richesse de la terre
  rationale: Le mot hébreu évoque littéralement la « graisse », image traditionnelle de fertilité et d’abondance. « Richesse » transmet clairement cette image agricole en français moderne.
- source_word: וְרֹב
  choice: en abondance
  rationale: רֹב désigne une grande quantité. Placé après les deux produits agricoles, « en abondance » est naturel et conserve la portée commune du terme.
- source_word: דָּגָן
  choice: céréales
  rationale: דָּגָן est un terme général pour les productions céréalières. « Céréales » évite de le restreindre au seul blé et demeure clair en français contemporain.
- source_word: וְתִירֹשׁ
  choice: vin nouveau
  rationale: תִּירוֹשׁ désigne généralement le produit récent de la vigne, distinct du terme plus général pour le vin. « Vin nouveau » maintient cette distinction lexicale.
theological_decisions:
- issue: Nature de la parole prononcée
  choice: 'Une bénédiction exprimée comme un souhait : « Que Dieu te donne »'
  alternative: 'Une prédiction au futur : « Dieu te donnera »'
  rationale: La forme verbale et le contexte immédiat favorisent une parole de bénédiction à valeur volitive. Cette traduction en préserve la force performative sans ajouter d’affirmation théologique étrangère au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure garde le rythme de la bénédiction tout en évitant le littéralisme obscur de « graisse de la terre ». « Ainsi que » clarifie la coordination des dons sans modifier leur contenu.
