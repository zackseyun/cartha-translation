  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: fr
  text: Que des peuples te servent et que des nations se prosternent devant toi.[a] Sois le maître de tes frères, et que les fils de ta mère se prosternent devant toi. Maudits soient ceux qui te maudissent, et bénis soient ceux qui te bénissent.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te rendent hommage ». Le verbe hébreu désigne le fait de s’incliner profondément ou de se prosterner devant un supérieur, humain ou divin ; ici, le contexte évoque l’hommage rendu à un être humain plutôt que l’adoration.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie des formes plurielles pour « ceux qui te maudissent » et « ceux qui te bénissent », mais un prédicat singulier pour « maudit » et « béni ». Le français accorde ici le prédicat au pluriel avec son sujet.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: te servent
  rationale: Le qal de עבד avec suffixe objet exprime ici le service et la sujétion envers le bénéficiaire de la bénédiction. « Te servent » reste naturel tout en conservant cette amplitude.
- source_word: עַמִּים
  choice: des peuples
  rationale: Le pluriel désigne des collectivités humaines ou ethniques et se distingue avec naturel du terme parallèle rendu par « nations ».
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: se prosternent devant toi
  rationale: Le verbe désigne l’action de s’incliner profondément ou de se prosterner devant un supérieur humain ou divin. Ici, la formulation concrète préserve le geste sans imposer l’idée de culte.
- source_word: לְאֻמִּים
  choice: des nations
  rationale: Ce terme poétique parallèle à עַמִּים évoque de grands groupes humains. « Nations » maintient le parallélisme avec une variation française lisible.
- source_word: הֱוֵה גְבִיר
  choice: Sois le maître
  rationale: הֱוֵה formule l’injonction ou le souhait de la bénédiction, tandis que גְבִיר désigne celui qui exerce l’autorité. « Maître » convient à la domination familiale sans employer un titre divin.
- source_word: לְאַחֶיךָ
  choice: de tes frères
  rationale: Avec גְבִיר, la préposition ל marque les personnes sur lesquelles s’exerce l’autorité. En français, « le maître de tes frères » rend naturellement cette relation.
- source_word: בְּנֵי אִמֶּךָ
  choice: les fils de ta mère
  rationale: La traduction directe conserve l’expression familiale précise du texte et son parallélisme avec « tes frères ».
- source_word: אֹרְרֶיךָ אָרוּר
  choice: Maudit soit celui qui te maudit
  rationale: Le participe pluriel est suivi d’un prédicat morphologiquement singulier, probablement distributif ou collectif. Le singulier français conserve cette tension grammaticale et rappelle la formule de Genèse 12.3.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: et béni soit celui qui te bénit
  rationale: Comme dans le membre précédent, le participe pluriel associé à un prédicat singulier se prête à une lecture distributive. Le singulier garde le parallélisme exact de la formule.
theological_decisions:
- issue: Sens de la prosternation devant un bénéficiaire humain
  choice: se prosternent devant toi
  alternative: te rendent hommage ; t’adorent
  rationale: Le verbe peut désigner la prosternation devant Dieu ou devant un supérieur humain. Le contexte immédiat porte sur la prééminence politique et familiale de Jacob ; la traduction décrit donc le geste sans le qualifier explicitement de culte.
- issue: Valeur de גְבִיר dans la bénédiction
  choice: le maître de tes frères
  alternative: le seigneur de tes frères ; celui qui domine tes frères
  rationale: « Maître » exprime l’autorité visée sans confondre ce statut humain avec le titre divin « Seigneur ».
- issue: Nombre dans les formules de malédiction et de bénédiction
  choice: celui qui te maudit / celui qui te bénit
  alternative: ceux qui te maudissent / ceux qui te bénissent
  rationale: Les formes hébraïques désignant les auteurs sont plurielles, mais chacun des prédicats est singulier. Une formulation distributive au singulier préserve cette particularité plutôt que de la régulariser silencieusement.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. Les subjonctifs « Que… » et les inversions « Maudit soit… / béni soit… » gardent la solennité poétique de la bénédiction. « Se prosterner devant » est concret et intelligible ; « maître » évite l’ambiguïté créée par « Seigneur » comme titre divin.
