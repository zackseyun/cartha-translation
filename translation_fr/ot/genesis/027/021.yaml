  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶֽל יַעֲקֹ֔ב גְּשָׁ/ה נָּ֥א וַ/אֲמֻֽשְׁ/ךָ֖ בְּנִ֑/י הַֽ/אַתָּ֥ה זֶ֛ה בְּנִ֥/י עֵשָׂ֖ו אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: fr
  text: 'Isaac dit alors à Jacob : « Approche, je te prie, pour que je te touche, mon fils, pour voir si tu es bien mon fils Ésaü ou non. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Isaac dit alors
  rationale: Le waw narratif fait avancer le récit ; « alors » restitue naturellement la succession des actions.
- source_word: גְּשָׁה נָּא
  choice: Approche, je te prie
  rationale: L’impératif גְּשָׁה signifie « approche », tandis que נָא nuance la demande avec politesse ou insistance. « Je te prie » convient au registre digne du récit.
- source_word: וַאֲמֻשְׁךָ
  choice: pour que je te touche
  rationale: Le verbe מושׁ désigne ici le fait de palper ou toucher afin de vérifier l’identité. La tournure finale rend la fonction contextuelle de la proposition sans surcharger le texte.
- source_word: בְּנִי
  choice: mon fils
  rationale: Le vocatif avec suffixe de première personne est conservé, car il contribue à la tonalité relationnelle de la scène.
- source_word: הַאַתָּה זֶה
  choice: afin de savoir si tu es bien
  rationale: La formulation française explicite naturellement l’objet de la vérification tactile. « Bien » préserve l’incertitude et l’insistance de l’interrogation hébraïque.
- source_word: בְּנִי עֵשָׂו
  choice: mon fils Ésaü
  rationale: Cette apposition française naturelle conserve à la fois le lien filial et l’identité précise mise à l’épreuve.
- source_word: אִם לֹא
  choice: ou non
  rationale: 'La locution clôt l’interrogation indirecte alternative : « si… ou non ».'
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve l’hésitation d’Isaac sans préciser au-delà du texte la manière exacte dont il compte reconnaître Jacob.
