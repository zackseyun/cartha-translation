  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: fr
  text: Prépare-moi des mets savoureux[a], comme je les aime, et apporte-les-moi, et je les mangerai, afin que mon âme te bénisse[b] avant que je meure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des plats délicieux » ou « des mets de choix ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « que mon âme te bénisse ». Ici, « mon âme » désigne Isaac lui-même dans tout son être.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Prépare-moi
  rationale: Dans ce contexte culinaire, « préparer » exprime naturellement le sens général de עשה (« faire ») sans ajouter d’idée étrangère.
- source_word: מַטְעַמִּים
  choice: des mets savoureux
  rationale: Le nom pluriel désigne des aliments spécialement préparés et agréables au goût. « Mets savoureux » garde le pluriel et convient au registre digne du récit.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: comme je les aime
  rationale: Cette formulation française naturelle conserve l’idée de la préférence personnelle d’Isaac.
- source_word: וְהָבִיאָה לִּי
  choice: et apporte-les-moi
  rationale: Le verbe ordonne d’apporter la nourriture au locuteur; le pronom pluriel reprend naturellement « mets » en français.
- source_word: וְאֹכֵלָה
  choice: pour que j’en mange
  rationale: La forme cohortative exprime ici l’action voulue à la suite de l’ordre. « Pour que j’en mange » rend cette orientation sans la transformer en simple futur.
- source_word: בַּעֲבוּר
  choice: afin que
  rationale: La préposition introduit le but ultime de la demande, à savoir la bénédiction.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: que mon âme te bénisse
  rationale: La traduction conserve explicitement נַפְשִׁי, sujet grammatical de « bénir », et préserve ainsi la force personnelle et l’éventuelle tension de l’expression hébraïque.
- source_word: בְּטֶרֶם אָמוּת
  choice: avant que je meure
  rationale: Cette proposition temporelle traduit directement l’hébreu dans un français naturel et soutenu.
theological_decisions:
- issue: Portée de נַפְשִׁי (« mon âme ») dans la bénédiction
  choice: Conserver « mon âme » dans le texte principal
  alternative: « que je te bénisse de toute mon âme » ou simplement « que je te bénisse »
  rationale: L’hébreu fait explicitement de « mon âme » le sujet du verbe. La conserver évite de résoudre silencieusement l’expression en intensité (« de toute mon âme ») ou de l’omettre comme simple pronom personnel.
translation_notes:
  register: Français international moderne, clair et digne. Le tour « avant que je meure » maintient une légère solennité adaptée au contexte. Le parallélisme « pour que… afin que… » distingue l’action intermédiaire de manger du but final de bénir.
