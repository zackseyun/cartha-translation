translation_notes:
  register: Français international moderne, simple et digne. L’impératif « Reste » prolonge naturellement les instructions de Rébecca dans le contexte. La formulation conserve le caractère temporaire de « quelques jours » et l’intensité de la colère d’Ésaü.
