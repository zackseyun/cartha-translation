  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: fr
  text: Reste avec lui quelques jours, jusqu’à ce que la fureur de ton frère retombe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « revienne » ou « fasse demi-tour » ; ici, la fureur s’apaise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Reste
  rationale: Le verbe יָשַׁב peut signifier « s’asseoir », « habiter » ou « rester ». Dans cette instruction adressée à Jacob, « reste » exprime naturellement un séjour temporaire auprès de Laban.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: La préposition עִם avec le suffixe masculin singulier signifie directement « avec lui » et renvoie à Laban dans le contexte immédiat.
- source_word: יָמִים אֲחָדִים
  choice: quelques jours
  rationale: L’expression signifie littéralement « des jours, quelques-uns ». « Quelques jours » conserve l’estimation modeste formulée par Rébecca, sans l’ajuster à la durée réelle du séjour racontée ensuite.
- source_word: עַד אֲשֶׁר
  choice: jusqu’à ce que
  rationale: Cette locution introduit normalement le moment qui marque la fin de l’action précédente.
- source_word: תָּשׁוּב
  choice: retombe
  rationale: שׁוּב signifie littéralement « revenir » ou « faire demi-tour ». Avec la fureur pour sujet, « retombe » rend en français actuel l’idée idiomatique de son apaisement, tandis que la note conserve l’image hébraïque.
- source_word: חֲמַת אָחִיךָ
  choice: la fureur de ton frère
  rationale: חֵמָה désigne une colère ardente ou violente. « Fureur » en préserve l’intensité, et le complément possessif est rendu naturellement par « de ton frère ».
