base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: fr
  text: 'Isaac répondit à Ésaü : « Vois, je l’ai établi maître sur toi et je lui ai donné tous ses frères comme serviteurs.[a] Je l’ai pourvu de céréales et de vin nouveau.[b] Que puis-je donc faire pour toi, mon fils ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme esclaves ». Le mot hébreu peut désigner des serviteurs ou des esclaves selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « Je l’ai soutenu avec des céréales et du vin nouveau ». Le verbe hébreu peut mettre l’accent sur le soutien ou sur les ressources fournies.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: La formule narrative hébraïque introduit une réponse. En français, « répondit » rend naturellement l’ensemble sans reproduire le pléonasme sémitique « répondit et dit ».
- source_word: הֵן
  choice: Vois
  rationale: Interjection attirant l’attention sur un fait décisif; « Vois » conserve sa force tout en restant digne et compréhensible.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: je l’ai établi maître sur toi
  rationale: La construction exprime l’attribution d’un statut d’autorité. « Maître » convient à la hiérarchie familiale sans évoquer un titre divin.
- source_word: כָּל אֶחָיו
  choice: tous ses frères
  rationale: Rendu direct du terme familial, sans l’élargir inutilement à toute la parenté.
- source_word: לַעֲבָדִים
  choice: comme serviteurs
  rationale: עבד peut désigner des serviteurs ou des esclaves; ici, « serviteurs » exprime la subordination annoncée par la bénédiction sans préciser davantage le statut social.
- source_word: דָגָן
  choice: blé
  rationale: Dans ce couple agricole traditionnel, « blé » est naturel en français et désigne les céréales nourricières, bien que l’hébreu puisse avoir le sens plus large de « grain ».
- source_word: תִּירֹשׁ
  choice: vin nouveau
  rationale: Le terme désigne le produit récent de la vigne; « vin nouveau » en conserve la nuance agricole.
- source_word: סְמַכְתִּיו
  choice: je l’ai pourvu
  rationale: Le verbe signifie soutenir ou étayer; avec le blé et le vin nouveau, il évoque concrètement les ressources accordées pour assurer la subsistance.
- source_word: וּלְכָה אֵפוֹא מָה אֶעֱשֶׂה
  choice: Que puis-je donc faire pour toi
  rationale: Cette formulation française restitue le tournant conséquentiel et la question rhétorique exprimant les possibilités désormais limitées d’Isaac.
- source_word: בְּנִי
  choice: mon fils
  rationale: L’adresse filiale et affectueuse est conservée directement.
theological_decisions:
- issue: Portée de la bénédiction déjà prononcée
  choice: Conserver la question rhétorique sans expliquer pourquoi Isaac ne peut revenir sur sa bénédiction
  alternative: Expliciter l’irrévocabilité juridique ou divine de la bénédiction
  rationale: Le verset présente les conséquences de la bénédiction donnée, mais n’en formule pas explicitement la théorie. La traduction ne doit pas résoudre cette tension théologique à la place du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative est allégée selon l’usage français, tandis que l’autorité familiale, la subordination et la question rhétorique restent explicites. Les variantes lexicales réellement ouvertes sont signalées en notes.
