base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: fr
  text: 'Ésaü dit à son père[a] : « N’as-tu qu’une seule bénédiction, mon père ? Bénis-moi, moi aussi, mon père ! » Puis Ésaü éleva la voix et pleura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « La bénédiction est-elle une pour toi, mon père ? » L’hébreu exprime l’angoisse d’Ésaü devant le fait qu’Isaac semble n’avoir qu’une seule bénédiction à donner.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: N’as-tu qu’une seule bénédiction
  rationale: La proposition hébraïque sans verbe est littéralement proche de « La bénédiction est-elle une pour toi ? ». Dans le contexte, cette question rhétorique exprime l’angoisse d’Ésaü devant ce qui semble être l’unique bénédiction dont Isaac dispose. La formulation française reste naturelle tout en conservant cette force.
- source_word: אָבִי
  choice: mon père
  rationale: Le suffixe de première personne du singulier exprime explicitement la possession. La répétition de « mon père » est conservée pour rendre l’insistance affective de l’appel d’Ésaü.
- source_word: בָּרֲכֵנִי
  choice: Bénis-moi
  rationale: Impératif direct de ברך accompagné du suffixe de première personne du singulier ; cette traduction est à la fois concise et formellement fidèle.
- source_word: גַּם אָֽנִי
  choice: moi aussi
  rationale: L’expression demande qu’Ésaü soit inclus, lui aussi, dans la bénédiction. « Moi aussi » est idiomatique en français et garde l’accent porté sur sa personne.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: éleva la voix
  rationale: L’expression signifie littéralement « lever sa voix ». « Éleva la voix » conserve l’image hébraïque et, avec « pleura », évoque clairement une lamentation audible plutôt qu’un simple ton plus fort.
- source_word: וַיֵּבְךְּ
  choice: pleura
  rationale: Le verbe désigne le fait de pleurer. « Pleura » est précis et naturel dans ce récit.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Transcription française conventionnelle du nom propre biblique.
