  text: וְ/עַתָּה֙ שָׂא נָ֣א כֵלֶ֔י/ךָ תֶּלְיְ/ךָ֖ וְ/קַשְׁתֶּ֑/ךָ וְ/צֵא֙ הַ/שָּׂדֶ֔ה וְ/צ֥וּדָ/ה לִּ֖/י צידה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: fr
  text: Et maintenant, je te prie, prends ton équipement — ton carquois et ton arc — et va dans la campagne chasser pour moi du gibier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la valeur conjonctive et la transition immédiate vers l'instruction suivante.
- source_word: שָׂא נָא
  choice: je te prie, prends
  rationale: Dans ce contexte, שָׂא signifie idiomatiquement « prendre »; נָא apporte une nuance de requête polie ou pressante, rendue dignement par « je te prie ».
- source_word: כֵלֶיךָ
  choice: ton équipement
  rationale: Terme générique désignant ici le matériel, ensuite précisé par le carquois et l'arc; « équipement » reste naturel sans réduire le mot aux seules armes.
- source_word: תֶּלְיְךָ
  choice: ton carquois
  rationale: Désigne l'étui porté ou suspendu qui contient les flèches; « carquois » est le terme français précis dans ce contexte.
- source_word: וְקַשְׁתֶּךָ
  choice: et ton arc
  rationale: Équivalent direct et usuel du terme hébreu.
- source_word: וְצֵא הַשָּׂדֶה
  choice: va dans la campagne
  rationale: שָׂדֶה peut désigner un champ ou le pays découvert; la chasse avec arc appelle ici naturellement « la campagne », sans suggérer un champ cultivé particulier.
- source_word: וְצוּדָה לִּי צידה
  choice: et chasse-moi du gibier
  rationale: Le verbe exprime l'action de chasser ou capturer, et le nom désigne ici la nourriture obtenue par la chasse. La construction française avec « chasse-moi » conserve le bénéficiaire exprimé par לִּי.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Je te prie » convient à la requête d'un père âgé sans donner à נָא une solennité excessive. Les tirets mettent en apposition les deux éléments qui précisent « équipement ».
