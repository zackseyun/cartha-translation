  rationale: Dans ce contexte interrogatif, « demanda » rend naturellement le verbe אמר sans modifier sa fonction discursive.
- source_word: אַתָּה זֶה
  choice: Es-tu vraiment
  rationale: La combinaison du pronom indépendant et du démonstratif marque ici une identification appuyée ; « vraiment » en restitue la force en français idiomatique.
- source_word: בְּנִי
  choice: mon fils
  rationale: Le nom avec suffixe possessif de première personne du singulier est rendu directement.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Bien que le verbe hébreu signifie littéralement « il dit », « répondit » explicite naturellement sa fonction dans ce bref échange.
- source_word: אָֽנִי
  choice: Oui, c’est moi
  rationale: Le pronom indépendant constitue une réponse affirmative et une auto-identification très brève ; cette formulation est naturelle en français tout en conservant les deux valeurs.
