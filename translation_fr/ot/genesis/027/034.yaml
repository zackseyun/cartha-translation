base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: fr
  text: 'Quand Ésaü entendit les paroles de son père, il poussa un cri très fort et amer[a], puis dit à son père : « Bénis-moi, moi aussi, mon père ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il cria un cri grand et amer, extrêmement ». La tournure verbe-nom et la place finale de l’intensif sont particulièrement marquées en hébreu.'
    reason: La note signale la construction étymologique et l’ordre intensif particulièrement marqués de l’hébreu.
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Quand ... entendit
  rationale: L’infinitif construit avec כִּי exprime ici la circonstance temporelle. « Quand » rend naturellement la succession sans imposer une immédiateté plus forte que le texte.
- source_word: דִּבְרֵי אָבִיו
  choice: les paroles de son père
  rationale: דָּבָר désigne ici les paroles prononcées. Cette formulation conserve la valeur lexicale et le registre narratif du texte.
- source_word: וַיִּצְעַק צְעָקָה
  choice: il poussa un cri
  rationale: Le français ne reproduit pas naturellement la construction étymologique « crier un cri ». « Pousser un cri » maintient l’expression verbale et nominale ainsi que sa force.
- source_word: גְּדֹלָה וּמָרָה עַד מְאֹד
  choice: extrêmement grand et amer
  rationale: La traduction conserve les deux adjectifs, « grand » et « amer », ainsi que l’intensification עַד מְאֹד, malgré le caractère volontairement marqué de l’expression.
- source_word: בָּרֲכֵנִי גַם אָנִי
  choice: Bénis-moi, moi aussi
  rationale: L’impératif direct et la répétition de « moi » rendent l’urgence de la demande et l’accent porté par גַם אָנִי.
- source_word: אָבִי
  choice: mon père
  rationale: Le suffixe possessif est explicite et contribue à la force pathétique de l’appel d’Ésaü.
