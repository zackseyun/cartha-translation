  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: fr
  text: Tu vivras de ton épée et tu serviras ton frère. Mais, lorsque tu t’agiteras[a], tu briseras son joug de ton cou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsque tu t’affranchiras ». Le sens du verbe hébreu תָּרִיד est incertain; il peut évoquer l’agitation ou l’inquiétude. La rupture du joug dans la proposition suivante soutient aussi le sens de s’affranchir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: Tu vivras de ton épée
  rationale: La préposition עַל exprime ici le moyen ou le mode de subsistance. « Vivre de son épée » est naturel en français et conserve l’image concrète de l’hébreu.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: et tu serviras ton frère
  rationale: Le verbe עבד signifie directement « servir » et laisse ouverte la forme précise de cette sujétion.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Mais lorsque
  rationale: Cette formulation rend la circonstance future tout en marquant le retournement introduit par la dernière partie de l’oracle.
- source_word: תָּרִיד
  choice: tu t’affranchiras
  rationale: Le verbe est difficile. Dans le contexte immédiat du joug brisé, « t’affranchiras » exprime une libération active sans préciser davantage sa forme politique ou historique.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: tu briseras son joug
  rationale: פרק évoque une rupture ou un arrachement, tandis que עֹל désigne littéralement un joug, image de domination qu’il convient de conserver.
- source_word: מֵעַל צַוָּארֶךָ
  choice: de dessus ton cou
  rationale: Cette tournure garde l’insistance spatiale de מֵעַל et la vigueur de l’image physique, dans un registre biblique encore compréhensible.
theological_decisions:
- issue: Nature de la relation future d’Ésaü avec Jacob
  choice: Présenter une sujétion suivie d’un affranchissement possible, sans en fixer l’accomplissement historique ou doctrinal.
  alternative: Comprendre la servitude comme permanente, ou la réduire à une simple déférence familiale.
  rationale: Le verset associe le service du frère à la rupture ultérieure de son joug. La traduction maintient cette tension sans importer une interprétation plus large concernant Édom.
translation_notes:
  register: Français international moderne, digne et direct. Le futur conserve la portée oraculaire du discours, tandis que les images concrètes de l’épée, du joug et du cou sont maintenues.
