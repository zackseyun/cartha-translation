  terminology: « Yahweh », « bénit », « vêtements », « odeur » et « champ » rendent correctement les termes pertinents. L’impératif hébreu רְאֵה est singulier ; « Voyez ! » introduit à tort un pluriel de politesse ou d’adresse collective.
