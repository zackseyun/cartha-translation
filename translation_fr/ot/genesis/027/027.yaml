base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: fr
  text: 'Il s’approcha donc et l’embrassa. Isaac sentit l’odeur de ses vêtements, puis il le bénit en disant : « Vois ! L’odeur de mon fils est comme celle d’un champ que Yahweh a béni. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Il s’approcha donc
  rationale: Le wayyiqtol de נגשׁ marque la progression du récit et le mouvement vers Isaac ; « donc » rend naturellement ici la conséquence de l’invitation précédente.
- source_word: וַיִּשַּׁק לוֹ
  choice: et l’embrassa
  rationale: נשׁק avec le pronom objet signifie simplement « l’embrassa », sans qu’il soit nécessaire d’ajouter une nuance affective absente du texte.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: Isaac respira l’odeur de ses vêtements
  rationale: « Respirer l’odeur » rend la construction hébraïque avec ריח de façon naturelle en français. Le nom « Isaac » explicite le sujet afin d’éviter l’ambiguïté créée par deux pronoms masculins successifs.
- source_word: בְּגָדָיו
  choice: ses vêtements
  rationale: « Vêtements » est le pluriel concret, courant et digne correspondant à בְּגָדִים.
- source_word: וַיְבָרֲכֵהוּ
  choice: puis il le bénit
  rationale: Traduction directe de ברך avec suffixe objet ; « puis » marque clairement la séquence narrative.
- source_word: רְאֵה
  choice: Voyez !
  rationale: L’impératif sert d’interjection attirant l’attention. « Voyez ! » conserve l’image de la perception tout en restant compréhensible ; le pluriel de portée générale convient mieux en français que « vois » dans cette exclamation sans destinataire explicite.
- source_word: רֵיחַ בְּנִי
  choice: L’odeur de mon fils
  rationale: « Odeur » reprend le même nom employé plus tôt, préservant la répétition rhétorique de רֵיחַ.
- source_word: כְּרֵיחַ שָׂדֶה
  choice: est comme celle d’un champ
  rationale: Le pronom « celle » évite une répétition pesante en français tout en renvoyant sans ambiguïté à « l’odeur » ; שָׂדֶה garde son sens ordinaire de « champ ».
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: que Yahweh a béni
  rationale: La relative et l’accompli sont rendus directement ; le passé composé exprime l’acte antérieur dont le champ porte le résultat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin, non le titre אֲדֹנָי ; « Yahweh » préserve cette distinction lexicale sans ajouter une interprétation confessionnelle.
- issue: Identité du sujet qui respire l’odeur
  choice: Isaac respira
  alternative: il respira
  rationale: La grammaire et la scène indiquent qu’Isaac est le sujet. L’explicitation en français évite de faire croire que Jacob respire ses propres vêtements, sans modifier le sens.
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « odeur » est conservée entre la narration et la bénédiction, tandis que « celle » allège le troisième emploi sans effacer le lien lexical. Aucune note n’est nécessaire pour ce verset.
