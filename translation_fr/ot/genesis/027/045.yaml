base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: fr
  text: jusqu’à ce que la colère de ton frère se détourne de toi[a] et qu’il oublie ce que tu lui as fait. Alors, j’enverrai quelqu’un te chercher et te ferai venir de là[b]. Pourquoi perdrais-je mes deux fils le même jour[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « jusqu’à ce que la colère de ton frère revienne de toi ». Avec « colère », le verbe hébreu « revenir, se détourner » exprime idiomatiquement l’apaisement ou l’éloignement de la colère.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « j’enverrai et je te prendrai de là ». La formulation française explicite qu’une personne sera envoyée pour faire venir Jacob de son lieu de refuge.'
    reason: lexical_alternative
  - marker: c
    text: Rébecca craint de perdre ses deux fils à cause des conséquences de leur conflit, sans nécessairement supposer qu’ils mourront de la même manière.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: jusqu’à ce que la colère de ton frère se détourne de toi
  rationale: La construction marque une limite temporelle. Avec אַף, le verbe שׁוב exprime idiomatiquement l’éloignement de la colère; « se détourne de toi » conserve néanmoins l’image hébraïque du mouvement.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: et qu’il oublie ce que tu lui as fait
  rationale: Formulation française naturelle qui rend directement l’action antérieure de Jacob envers Ésaü.
- source_word: וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם
  choice: Alors, je te ferai chercher et ramener de là
  rationale: Le premier verbe implique que Rébecca enverra quelqu’un, et לקח signifie fondamentalement « prendre ». La tournure causative française explicite naturellement l’agent sous-entendu et le retour de Jacob depuis son refuge sans ajouter « chez moi ».
- source_word: לָמָה אֶשְׁכַּל
  choice: Pourquoi serais-je privée
  rationale: שׁכל évoque la perte d’enfants. « Être privée de » garde la force maternelle tout en étant plus courant en français actuel que « être endeuillée de ».
- source_word: גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: de vous deux en un seul jour
  rationale: Rend l’idée emphatique d’une double perte survenant dans la même journée.
theological_decisions:
- issue: Nature de la perte des deux fils
  choice: Le texte principal conserve la formulation générale « privée de vous deux »
  alternative: Préciser qu’Ésaü mourrait en représailles après avoir tué Jacob
  rationale: Le verset ne précise pas par quels moyens Rébecca pourrait perdre chacun de ses fils. Il convient de préserver cette indétermination narrative.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct de Rébecca reste affectif sans devenir soutenu à l’excès. « En un seul jour » maintient l’emphase de l’hébreu.
