review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu. Toutefois, « ramener » introduit plus explicitement l'idée de retour que le לקח (« prendre, emmener ») hébreu; le contexte permet cette nuance, mais le texte principal peut rester plus près de l'original. La question finale doit mieux rendre שכל, terme de deuil ou de perte d'enfants.
  naturalness: Le français est globalement naturel et adapté à un registre narratif moderne. « J’enverrai quelqu’un te chercher et te ferai venir de là » rend clairement la succession des deux verbes et demeure fluide.
  terminology: « Colère », « oublier » et « perdre mes deux fils » sont justes. La note a est à corriger, car « revienne loin de toi » n'est ni une formulation française naturelle ni une explication exacte de l'idiome.
  issues:
  - severity: medium
    issue: « te ferai chercher et ramener » explicite un retour par « ramener ».
    rationale: לקח signifie fondamentalement « prendre/emmener »; le retour est contextuellement probable, mais n'est pas exprimé par le verbe lui-même. Une formulation qui indique l'envoi d'un messager et la venue de Jacob évite de surtraduire.
  - severity: medium
    issue: La note a contient « revienne loin de toi ».
    rationale: Cette paraphrase est maladroite et ne reflète pas précisément le mouvement de la colère « loin de toi ». La note doit expliquer l'emploi idiomatique de שוב avec אַף sans produire un faux littéral.
  - severity: low
    issue: « privée de vous deux » atténue le lexique spécifique de la perte d'enfants.
    rationale: שכל évoque le fait d'être privé de ses enfants par la mort. « Perdre mes deux fils » est naturel en français et conserve mieux la force maternelle, sans préciser le mécanisme de la perte.
