  yaml_path: translation/ot/genesis/027/014.yaml
  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: fr
  text: Il partit donc, prit les chevreaux et les apporta à sa mère. Sa mère prépara des mets savoureux, comme son père les aimait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Il partit donc
  rationale: Le wayyiqtol fait progresser le récit. « donc » marque naturellement en français que Jacob exécute l’instruction précédente, tandis que « partit » convient au mouvement impliqué.
- source_word: וַיִּקַּח
  choice: prit les chevreaux
  rationale: Le complément n’est pas exprimé dans ce verset, mais il est clairement fourni par le contexte immédiat (les deux chevreaux de 27.9). Le reprendre évite une tournure française incomplète.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: les apporta à sa mère
  rationale: Le pronom « les » reprend les chevreaux du contexte. « apporter à » rend simplement le mouvement vers la mère.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: Sa mère prépara
  rationale: Avec un aliment pour complément, « préparer » est l’équivalent français naturel de עשה, plus précis ici que le générique « faire ».
- source_word: מַטְעַמִּים
  choice: un plat savoureux
  rationale: Le nom désigne un mets spécialement préparé et agréable au goût. « un plat savoureux » est actuel, clair et digne; il évite le caractère parfois recherché de « mets délicats ».
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: comme son père l’aimait
  rationale: « comme » conserve la comparaison, et « aimait » traduit directement אהב sans réduire la préférence exprimée à un simple goût passager. Le pronom reprend le plat.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et sobre. La succession rapide des actions est conservée sans reproduire mécaniquement chaque waw par « et ». Aucun terme technique ni tournure confessionnelle.
