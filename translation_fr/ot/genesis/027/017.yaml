  text: וַ/תִּתֵּ֧ן אֶת הַ/מַּטְעַמִּ֛ים וְ/אֶת הַ/לֶּ֖חֶם אֲשֶׁ֣ר עָשָׂ֑תָה בְּ/יַ֖ד יַעֲקֹ֥ב בְּנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/017.yaml
  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: fr
  text: Puis elle mit les plats savoureux et le pain qu’elle avait préparés entre les mains de son fils Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Puis elle mit
  rationale: Le waw consécutif fait avancer le récit. Avec בְּיַד, le verbe נתן décrit ici le fait de remettre ou de placer quelque chose entre les mains de quelqu’un.
- source_word: הַמַּטְעַמִּים
  choice: les plats savoureux
  rationale: Le pluriel désigne des mets spécialement préparés pour leur goût. « Plats savoureux » est naturel en français moderne et n’en précise pas indûment la nature.
- source_word: הַלֶּחֶם
  choice: le pain
  rationale: Traduction directe et usuelle de לֶחֶם dans ce contexte.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: qu’elle avait préparés
  rationale: Le plus-que-parfait marque naturellement l’antériorité de la préparation. « Préparés » convient à la fois aux plats et au pain et restitue ici le sens contextuel de עשה.
- source_word: בְּיַד
  choice: entre les mains de
  rationale: Cette expression française conserve l’image concrète de la remise directe, tout en étant plus idiomatique que le singulier littéral « dans la main de » lorsque plusieurs objets sont concernés.
- source_word: יַעֲקֹב בְּנָהּ
  choice: son fils Jacob
  rationale: Cet ordre est naturel en français moderne et rend sans ambiguïté le lien familial exprimé par l’hébreu.
theological_decisions: []
