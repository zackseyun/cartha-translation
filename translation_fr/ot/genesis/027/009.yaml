- from: Va donc au troupeau et prends-moi là deux bons chevreaux. J’en ferai pour ton père un plat savoureux, comme il l’aime.
  to: Va donc au troupeau et prends-m’en deux bons chevreaux. J’en ferai des mets savoureux pour ton père, comme il les aime.
