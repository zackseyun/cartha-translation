  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: fr
  text: Va donc au troupeau et prends-m’en deux bons chevreaux. J’en ferai des mets savoureux pour ton père, comme il les aime.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Va donc
  rationale: L’impératif לֶךְ est accompagné de נָא, particule qui adoucit ou rend pressante la demande. « Va donc » exprime ici une invitation insistante et naturelle en français, sans la dureté d’un ordre abrupt.
- source_word: הַצֹּאן
  choice: au troupeau
  rationale: צֹאן désigne le petit bétail, notamment les moutons et les chèvres. « Le troupeau » est naturel et reste assez large, tandis que la suite précise qu’il faut prendre des chevreaux.
- source_word: וְקַח לִי מִשָּׁם
  choice: et prends-moi là
  rationale: לקח signifie couramment « prendre ». Le pronom datif לִי indique que les animaux sont pris pour Rébecca, et מִשָּׁם renvoie à l’endroit mentionné, le troupeau.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: deux chevreaux
  rationale: La construction signifie littéralement « deux petits de chèvres ». « Deux chevreaux » rend clairement et idiomatiquement l’espèce et le jeune âge des animaux.
- source_word: טֹבִים
  choice: bons
  rationale: טֹבִים qualifie ici la qualité ou l’aptitude des chevreaux. « Bons » en conserve la simplicité, sans ajouter l’idée plus interprétative de bêtes spécialement sélectionnées.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: J’en ferai … un plat savoureux
  rationale: מַטְעַמִּים désigne des mets agréables au goût, souvent préparés selon la préférence de quelqu’un. Le singulier collectif « un plat savoureux » est naturel en français; « en » reprend les deux chevreaux comme matière de la préparation.
- source_word: לְאָבִיךָ
  choice: pour ton père
  rationale: Cette traduction conserve directement la relation familiale et le registre digne du récit.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: comme il l’aime
  rationale: La proposition signifie « comme il aime ». Le pronom « l’ » reprend naturellement le plat en français et exprime la préférence habituelle d’Isaac sans préciser davantage ce que l’hébreu laisse implicite.
