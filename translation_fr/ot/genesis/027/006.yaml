  yaml_path: translation/ot/genesis/027/006.yaml
  text: And Rebekah said to Jacob her son[a], “Look, I heard your father speaking to Esau your brother, saying,”
translation:
  language: fr
  text: 'Rébecca dit à Jacob, son fils : « Écoute, j’ai entendu ton père dire à Ésaü, ton frère :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרִבְקָה אָמְרָה
  choice: Rébecca dit
  rationale: Le waw poursuit naturellement le récit et n’a pas besoin d’être rendu séparément en français; le passé simple convient au registre narratif.
- source_word: אֶל יַעֲקֹב בְּנָהּ
  choice: à son fils Jacob
  rationale: Cette formulation française naturelle conserve l’apposition qui identifie Jacob comme le fils de Rébecca.
- source_word: הִנֵּה
  choice: Écoute
  rationale: Dans ce contexte oral, l’interjection attire l’attention de Jacob sur ce que Rébecca vient d’entendre; « Écoute » est actuel et naturel sans l’archaïsme de « Voici » pris comme interjection.
- source_word: שָׁמַעְתִּי אֶת אָבִיךָ מְדַבֵּר
  choice: j’ai entendu ton père parler
  rationale: Le passé composé est naturel dans le dialogue français, tandis que l’infinitif après « entendre » exprime idiomatiquement l’action perçue sans nier la valeur durative du participe hébreu.
- source_word: אֶל עֵשָׂו אָחִיךָ
  choice: à ton frère Ésaü
  rationale: L’ordre français naturel conserve l’identification d’Ésaü comme frère de Jacob et rend אֶל par « à ».
- source_word: לֵאמֹר
  choice: 'Il lui disait :'
  rationale: Une nouvelle proposition évite le lourd « parler… en disant » tout en représentant explicitement l’introduction de la citation qui suit au verset 7.
