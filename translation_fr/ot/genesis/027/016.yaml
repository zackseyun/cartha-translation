lexical_decisions:
- source_word: עֹרֹת
  choice: les peaux
  rationale: Le pluriel construit désigne les peaux des animaux utilisées ici comme revêtement. « Peaux » est le terme français naturel et précis dans ce contexte.
- source_word: גְּדָיֵי הָעִזִּים
  choice: des chevreaux
  rationale: L’expression désigne les petits des chèvres. « Chevreaux » rend ce sens directement et naturellement en français moderne.
- source_word: הִלְבִּישָׁה
  choice: mit ... sur
  rationale: Le hifil de לבש signifie faire porter ou revêtir quelqu’un. Avec des parties du corps comme compléments, « mit ... sur » exprime clairement et naturellement l’action concrète.
- source_word: עַל יָדָיו
  choice: sur ses mains
  rationale: Traduction directe de la préposition et du nom avec suffixe masculin singulier ; « sur » convient au fait de couvrir les mains.
- source_word: חֶלְקַת צַוָּארָיו
  choice: la partie lisse de son cou
  rationale: חֶלְקַת désigne ici la partie lisse ou dépourvue de poils. Cette formulation concrète préserve le contraste narratif avec la pilosité d’Ésaü.
