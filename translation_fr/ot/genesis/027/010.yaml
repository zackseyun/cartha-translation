  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: fr
  text: Tu l’apporteras à ton père, et il mangera, afin qu’il te bénisse avant sa mort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Tu l’apporteras
  rationale: Le parfait qal à la 2e personne masculine singulière, précédé de la conjonction, poursuit ici une suite d’instructions. Le futur français exprime naturellement l’action prescrite dans le déroulement du plan; le pronom « l’ » reprend le plat à préparer dans le verset précédent.
- source_word: לְאָבִיךָ
  choice: à ton père
  rationale: Traduction directe de אָב avec suffixe de 2e personne masculine singulière, dans un registre narratif digne et courant.
- source_word: וְאָכָל
  choice: et il mangera
  rationale: La forme verbale coordonnée présente l’action attendue après que le plat aura été apporté. Le futur conserve la progression du projet sans transformer explicitement cette proposition en proposition de but.
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: afin que
  rationale: L’expression composée introduit ici le but recherché. « Afin que » rend clairement cette valeur finale dans un français naturel et soutenu sans lourdeur.
- source_word: יְבָרֶכְךָ
  choice: il te bénisse
  rationale: Le piel inaccompli à la 3e personne masculine singulière avec suffixe objet de 2e personne masculine singulière signifie ici qu’Isaac prononcera sa bénédiction sur Jacob. Le subjonctif est requis après « afin que ».
- source_word: לִפְנֵי מוֹתוֹ
  choice: avant sa mort
  rationale: La formulation nominale reproduit directement l’hébreu et préserve la solennité de la scène.
