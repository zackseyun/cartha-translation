base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: fr
  text: 'Sa mère lui dit : « Que ta malédiction soit sur moi, mon fils. Écoute seulement ma voix[a] ; va me chercher les chevreaux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « écoute ma voix » ; cette expression peut aussi signifier « obéis-moi ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu ne répète pas ici le complément, sous-entendu d’après le verset précédent : les deux chevreaux.'
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol narratif de אמר appelle le passé simple dans un récit français de registre digne et courant.
- source_word: אִמּוֹ
  choice: sa mère
  rationale: Rend directement le nom de parenté avec le suffixe masculin singulier.
- source_word: עָלַי קִלְלָתְךָ
  choice: Que ta malédiction retombe sur moi
  rationale: Cette formulation française naturelle conserve la relation littérale entre « ta malédiction » et « sur moi », tout en exprimant clairement la prise en charge de ses conséquences par la mère.
- source_word: בְּנִי
  choice: mon fils
  rationale: Conserve le vocatif affectif et le suffixe possessif.
- source_word: אַךְ
  choice: seulement
  rationale: Marque ici la restriction et insiste sur ce que Jacob doit faire.
- source_word: שְׁמַע בְּקֹלִי
  choice: écoute ma voix
  rationale: Préserve l'expression hébraïque, qui reste intelligible en français, sans effacer sa possible valeur idiomatique d'obéissance.
- source_word: וְלֵךְ
  choice: va
  rationale: Rend simplement l'impératif et la progression vers l'ordre suivant.
- source_word: קַח לִי
  choice: me chercher les chevreaux
  rationale: Dans le contexte, l'objet sous-entendu renvoie aux deux chevreaux du verset précédent. « Aller chercher » traduit naturellement en français la séquence וְלֵךְ קַח, tandis que « me » rend לִי.
