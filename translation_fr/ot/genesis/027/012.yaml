  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: fr
  text: Peut-être que mon père me tâtera[a], et je passerai à ses yeux pour un trompeur[b] ; j’attirerai sur moi une malédiction, et non une bénédiction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « me touchera ». Le verbe hébreu désigne le fait de reconnaître ou d’examiner quelqu’un par le toucher.
    reason: lexical_alternative
  - marker: b
    text: Ou « quelqu’un qui se moque » ou « qui égare ». Le terme hébreu peut désigner une personne qui trompe ou qui tourne quelqu’un en dérision.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Peut-être que
  rationale: Introduit naturellement en français la possibilité redoutée par Jacob, sans atténuer l’incertitude.
- source_word: יְמֻשֵּׁנִי
  choice: me touchera pour vérifier
  rationale: Le verbe משש désigne l’examen par le toucher; l’ajout « pour vérifier » explicite naturellement la fonction du geste dans ce contexte.
- source_word: אָבִי
  choice: mon père
  rationale: Traduction directe du nom avec son suffixe possessif.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: je passerai à ses yeux pour
  rationale: Rend de façon idiomatique l’évaluation exprimée par l’hébreu « être à ses yeux », tout en conservant l’image des yeux.
- source_word: כִּמְתַעְתֵּעַ
  choice: quelqu’un qui le trompe
  rationale: Le participe peut évoquer celui qui égare, trompe ou tourne quelqu’un en dérision. Cette formulation convient à la scène sans réduire le mot au simple mensonge.
- source_word: וְהֵבֵאתִי עָלַי
  choice: J’attirerai alors sur moi
  rationale: Expression française naturelle pour le causatif « faire venir sur moi »; « alors » marque la conséquence implicite de la découverte.
- source_word: קְלָלָה
  choice: une malédiction
  rationale: Équivalent usuel, placé en opposition directe avec la bénédiction recherchée.
- source_word: וְלֹא בְרָכָה
  choice: et non une bénédiction
  rationale: Préserve avec dignité et concision le contraste explicite de l’hébreu.
theological_decisions: []
