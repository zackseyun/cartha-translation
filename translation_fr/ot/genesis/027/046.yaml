  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: fr
  text: 'Alors Rébecca dit à Isaac : « Je suis dégoûtée de la vie à cause des filles de Heth.[a] Si Jacob prend pour femme l’une des filles de Heth, comme celles-ci, l’une des filles du pays, à quoi bon vivre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des femmes hittites » ou « des filles des Hittites ».
    reason: Alternative lexicale pour la désignation ethnique littérale « filles de Heth ».
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: Je suis dégoûtée de la vie
  rationale: L’expression associe le dégoût ou l’accablement au fait même de vivre. Cette formulation française est naturelle et conserve la forte charge affective du verbe קוץ.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition a ici une valeur causale, clairement rendue en français courant.
- source_word: בְּנוֹת חֵת
  choice: les filles de Heth
  rationale: Le rendu littéral préserve à la fois le nom Heth et la manière familiale ou ethnique dont l’hébreu désigne ces femmes.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: Si Jacob prend pour femme
  rationale: Cette tournure exprime naturellement le mariage tout en restant proche de la construction hébraïque « prendre une femme ».
- source_word: כָּאֵלֶּה
  choice: comme celles-ci
  rationale: Le démonstratif renvoie à des femmes déjà présentes dans le contexte, vraisemblablement les épouses d’Ésaü, sans qu’il soit nécessaire de les nommer.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: l’une des filles du pays
  rationale: Le singulier distributif s’accorde naturellement en français avec « prend pour femme l’une des… », tout en conservant l’expression hébraïque « filles du pays ».
- source_word: לָמָּה לִּי חַיִּים
  choice: à quoi bon vivre ?
  rationale: Cette question rhétorique française exprime avec naturel l’idée que la vie ne vaudrait plus la peine d’être vécue, sans en faire une déclaration explicite de désir de mort.
theological_decisions:
- issue: Désignation ethnique חֵת
  choice: Conserver « filles de Heth » dans le texte principal
  alternative: « femmes hittites » ou « filles des Hittites »
  rationale: Le rendu principal respecte la formulation généalogique de l’hébreu et translittère le nom propre; la note fournit l’équivalent ethnique usuel.
- issue: Portée de la question finale
  choice: « à quoi bon vivre ? »
  alternative: « que serait pour moi la vie ? »
  rationale: La formulation choisie restitue la force idiomatique et rhétorique de l’hébreu en français actuel. L’alternative est plus formelle, mais moins naturelle et peut obscurcir le sens.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours direct garde l’intensité émotionnelle de Rébecca sans devenir familier. Le marqueur [a] est placé immédiatement après la première occurrence de « filles de Heth ».
