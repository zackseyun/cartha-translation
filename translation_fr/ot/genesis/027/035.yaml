  text: וַ/יֹּ֕אמֶר בָּ֥א אָחִ֖י/ךָ בְּ/מִרְמָ֑ה וַ/יִּקַּ֖ח בִּרְכָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: fr
  text: 'Il répondit : « Ton frère est venu par tromperie[a] et il a pris ta bénédiction. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec tromperie » ou « en trompant ». L’hébreu emploie le nom « tromperie » avec une préposition, expression qui peut se rendre naturellement de plusieurs manières en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Dans ce dialogue, le verbe אמר introduit la réponse d’Isaac. « Il répondit » rend naturellement la fonction discursive du wayyiqtol sans ajouter de contenu.
- source_word: בָּא
  choice: est venu
  rationale: Le qatal de בוא décrit ici une action accomplie dont le résultat concerne directement la situation présente ; le passé composé est naturel en français moderne.
- source_word: אָחִיךָ
  choice: ton frère
  rationale: Rend directement le nom avec suffixe masculin singulier et conserve la force rhétorique du lien familial, sans remplacer le terme par le nom propre.
- source_word: בְּמִרְמָה
  choice: par tromperie
  rationale: La préposition ב avec le nom מִרְמָה peut exprimer le moyen ou la manière. « Par tromperie » conserve la forme nominale et reste idiomatique en français.
- source_word: וַיִּקַּח
  choice: et il a pris
  rationale: Le wayyiqtol de לקח poursuit la séquence des faits. « A pris » est le sens courant et n’accentue pas indûment la violence de l’action.
- source_word: בִּרְכָתֶךָ
  choice: ta bénédiction
  rationale: Traduction directe du nom avec suffixe. La formulation préserve à la fois le sens lexical et la portée narrative de la bénédiction paternelle destinée à Ésaü.
theological_decisions: []
