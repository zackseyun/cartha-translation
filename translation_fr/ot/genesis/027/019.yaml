base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: fr
  text: 'Jacob dit à son père : « Je suis Ésaü, ton fils aîné. J’ai fait ce que tu m’as dit. Je t’en prie, lève-toi, assieds-toi et mange de mon gibier, afin que tu me bénisses[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que ton âme me bénisse »; ici, le mot hébreu traduit par « âme » désigne idiomatiquement la personne elle-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל אָבִיו
  choice: Jacob dit à son père
  rationale: Le waw consécutif fait avancer le récit; en français, la simple succession des phrases suffit généralement, sans imposer « et » ou « alors ». אֶל אָבִיו est rendu directement par « à son père ».
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: Je suis Ésaü, ton fils aîné
  rationale: La proposition nominale identifie mensongèrement Jacob à Ésaü, puis précise son statut d’aîné. La virgule rend naturellement l’apposition en français.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: J’ai fait ce que tu m’as dit
  rationale: Formulation française courante et fidèle à l’idée d’avoir exécuté l’instruction donnée.
- source_word: קוּם נָא
  choice: Je t’en prie, lève-toi
  rationale: קוּם signifie ici « se lever » et נָא marque une demande polie. « Je t’en prie » conserve cette nuance dans un registre naturel et digne.
- source_word: שְׁבָה
  choice: assieds-toi
  rationale: Impératif direct de ישׁב. Malgré la succession surprenante « lève-toi, assieds-toi », la traduction la conserve sans la corriger.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: et mange de mon gibier
  rationale: צַיִד désigne ici le gibier destiné au repas; « manger de mon gibier » rend naturellement la construction avec מִן.
- source_word: בַּעֲבוּר
  choice: afin que
  rationale: La locution introduit le but recherché. « Afin que » convient au registre biblique moderne sans être archaïque.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: que tu me bénisses
  rationale: נֶפֶשׁ fonctionne ici comme une désignation idiomatique de la personne elle-même. Le français naturel emploie donc le pronom sujet; la formulation littérale est signalée en note.
theological_decisions:
- issue: Valeur de נַפְשֶׁךָ dans תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: afin que tu me bénisses
  alternative: afin que ton âme me bénisse / afin que toi-même tu me bénisses
  rationale: Le terme désigne idiomatiquement la personne, sans formuler ici une doctrine particulière de l’âme. La traduction idiomatique évite une lecture anthropologique indue, tandis que la note conserve la forme hébraïque.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à la relation familiale et aux formes hébraïques de deuxième personne du singulier. La séquence volontairement abrupte « lève-toi, assieds-toi » est préservée.
