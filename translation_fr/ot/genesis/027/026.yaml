  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: fr
  text: 'Alors son père Isaac lui dit : « Approche, s’il te plaît, et embrasse-moi, mon fils. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait avancer le récit ; « Alors » exprime naturellement cette progression en français.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom indirect français rend naturellement la préposition אֶל avec son suffixe.
- source_word: יִצְחָק אָבִיו
  choice: son père Isaac
  rationale: Cette formulation conserve l’apposition hébraïque et l’accent relationnel sans lourdeur.
- source_word: גְּשָׁה־נָּא
  choice: Approche, s’il te plaît
  rationale: « Approche » exprime le mouvement physique vers Isaac, tandis que « s’il te plaît » rend la particule de politesse נָא.
- source_word: וּשְׁקָה־לִּי
  choice: et embrasse-moi
  rationale: En français moderne, « embrasse-moi » rend naturellement le verbe נשׁק accompagné de לִי, qui désigne ici la personne recevant le baiser.
- source_word: בְּנִי
  choice: mon fils
  rationale: Le vocatif est conservé afin de maintenir la relation familiale et le ton affectueux de la parole.
