  yaml_path: translation/ot/genesis/027/008.yaml
  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: fr
  text: Et maintenant, mon fils, écoute-moi dans ce que je te commande.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Le marqueur discursif וְעַתָּה introduit l’instruction immédiate; « Et maintenant » conserve à la fois la conjonction et la valeur temporelle.
- source_word: בְּנִי
  choice: mon fils
  rationale: Vocatif avec suffixe de première personne; « mon fils » est naturel et préserve l’adresse maternelle.
- source_word: שְׁמַע בְּקֹלִי
  choice: écoute-moi
  rationale: L’expression idiomatique signifie écouter avec attention et implique qu’on tienne compte de la parole. « Écoute-moi » est plus naturel en français que le calque « écoute ma voix », sans expliciter excessivement par « obéis-moi ».
- source_word: לַאֲשֶׁר
  choice: et fais ce que
  rationale: Dans cette construction, le syntagme précise le contenu auquel Jacob doit prêter attention. En français courant, la coordination rend clairement la portée pratique de l’écoute, implicite dans l’idiome hébreu.
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: je vais te commander
  rationale: Le participe exprime ici une instruction imminente dans le fil du discours. « Je vais te commander » restitue cette immédiateté et maintient la force de צוה.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La formulation privilégie l’idiome naturel « écoute-moi » plutôt que le calque hébraïque « écoute ma voix »; elle conserve néanmoins la force directive de la parole de Rébecca sans la durcir en « obéis-moi ».
