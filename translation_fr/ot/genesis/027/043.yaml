  text: וְ/עַתָּ֥ה בְנִ֖/י שְׁמַ֣ע בְּ/קֹלִ֑/י וְ/ק֧וּם בְּרַח לְ/ךָ֛ אֶל לָבָ֥ן אָחִ֖/י חָרָֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: fr
  text: Maintenant[a], mon fils, écoute ma voix. Lève-toi et fuis chez mon frère Laban, à Harân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et maintenant ».'
    reason: Le וְ initial peut être rendu explicitement par « Et », mais le français peut aussi l’absorber dans le marqueur discursif « Maintenant ».
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Ce marqueur introduit une consigne immédiate. En français actuel, « Maintenant » rend naturellement la transition; le וְ initial peut aussi être explicité par « Et maintenant ».
- source_word: בְּנִי
  choice: mon fils
  rationale: Cette adresse maternelle à Jacob conserve le lien familial et la valeur masculine du terme hébreu.
- source_word: שְׁמַע בְּקֹלִי
  choice: écoute ma voix
  rationale: La formulation conserve l’image hébraïque littérale. L’expression implique qu’il faut tenir compte de la parole et lui obéir, sans rendre cette implication plus explicite que le texte.
- source_word: וְקוּם
  choice: Lève-toi
  rationale: L’impératif de קום appelle Jacob à se mettre immédiatement en mouvement; « Lève-toi » est naturel, actuel et direct.
- source_word: בְּרַח לְךָ
  choice: fuis
  rationale: ברח exprime la fuite. Le pronom datif לְךָ renforce ici l’implication personnelle sans exiger une traduction distincte en français.
- source_word: אֶל לָבָן אָחִי
  choice: chez mon frère Laban
  rationale: « Chez » exprime naturellement en français le déplacement vers la personne auprès de laquelle Jacob doit se réfugier, tout en conservant le lien familial.
- source_word: חָרָנָה
  choice: à Harrân
  rationale: Le ה directionnel indique un mouvement vers Harrân. Après « chez mon frère Laban », « à Harrân » précise naturellement le lieu de destination sans répéter une préposition de mouvement.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation répartit la séquence urgente en deux phrases tout en maintenant l’enchaînement des impératifs. « Écoute ma voix » garde la formulation concrète de l’hébreu plutôt que de la réduire à « obéis-moi ».
