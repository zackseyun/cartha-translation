  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: fr
  text: « Apporte-moi du gibier et prépare-moi des plats délicieux[a], afin que je mange et que je te bénisse devant Yahvé[b] avant de mourir. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des mets savoureux ». Le terme hébreu désigne des plats spécialement préparés et agréables au goût.'
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte le nom divin YHWH, souvent rendu traditionnellement par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: הָבִיאָה
  choice: Apporte-moi
  rationale: L’impératif causatif de בוא demande de faire venir la chose jusqu’au locuteur. « Apporte-moi » est naturel en français et rend aussi le pronom de première personne.
- source_word: צַיִד
  choice: du gibier
  rationale: Le nom désigne ici le produit de la chasse. « Gibier » convient au contexte sans limiter le sens au cerf.
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: et prépare-moi des plats délicieux
  rationale: Dans ce contexte culinaire, עשה se rend naturellement par « préparer ». Le pluriel מַטְעַמִּים désigne des mets spécialement préparés et agréables au goût.
- source_word: וְאֹכֵלָה
  choice: afin que je mange
  rationale: La forme cohortative exprime ici le but ou l’intention qui suit les impératifs.
- source_word: וַאֲבָרֶכְכָה
  choice: et que je te bénisse
  rationale: 'Le cohortatif poursuit la proposition de but : Isaac veut manger, puis bénir son fils.'
- source_word: לִפְנֵי יְהוָה
  choice: devant Yahvé
  rationale: לִפְנֵי signifie « devant, en présence de ». « Yahvé » représente en français le nom divin יהוה plutôt que de le remplacer silencieusement par un titre.
- source_word: לִפְנֵי מוֹתִי
  choice: avant de mourir
  rationale: Cette formulation idiomatique française exprime exactement la relation temporelle du texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. La traduction principale le représente sous sa forme française courante « Yahvé », tandis qu’une note signale la convention traditionnelle « le SEIGNEUR ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la progression du texte hébreu — apporter, préparer, manger, bénir — sans alourdir la phrase. Le discours direct est conservé.
