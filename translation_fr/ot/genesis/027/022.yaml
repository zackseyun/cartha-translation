  text: וַ/יִּגַּ֧שׁ יַעֲקֹ֛ב אֶל יִצְחָ֥ק אָבִ֖י/ו וַ/יְמֻשֵּׁ֑/הוּ וַ/יֹּ֗אמֶר הַ/קֹּל֙ ק֣וֹל יַעֲקֹ֔ב וְ/הַ/יָּדַ֖יִם יְדֵ֥י עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: fr
  text: 'Jacob s’approcha de son père Isaac, qui le tâta et dit : « La voix est celle de Jacob, mais les mains sont celles d’Ésaü. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Le qal de נגשׁ exprime ici le fait de s’avancer ou de venir près de quelqu’un. « S’approcha » rend naturellement le mouvement narratif.
- source_word: וַיְמֻשֵּׁהוּ
  choice: le tâta
  rationale: Le verbe מושׁ désigne ici un examen tactile destiné à vérifier l’identité de Jacob. « Le tâta » est plus précis que « le toucha » et convient à la scène.
- source_word: הַקֹּל
  choice: La voix
  rationale: קול peut signifier « voix » ou « son » ; ici, Isaac reconnaît l’identité vocale du locuteur, d’où « la voix ».
- source_word: ק֣וֹל יַעֲקֹב
  choice: celle de Jacob
  rationale: Cette formulation française évite une répétition pesante tout en conservant clairement le rapport possessif de la construction hébraïque.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: mais les mains sont celles d’Ésaü
  rationale: Le waw relie deux indices opposés. « Mais » explicite naturellement ce contraste en français, tandis que « les mains sont celles d’Ésaü » préserve la structure emphatique de la proposition nominale.
- source_word: אָבִיו
  choice: son père Isaac
  rationale: La désignation filiale est explicitement conservée, avec l’ordre naturel du français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste proche de la structure hébraïque sans lourdeur ; le contraste entre la voix et les mains est conservé explicitement.
