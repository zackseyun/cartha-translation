translation_notes:
  register: Français international moderne, narratif et digne. La tournure corrélative « À peine… que » évite un empilement maladroit de conjonctions tout en conservant la rapidité dramatique de la scène. « Quitter la présence de » garde une légère solennité appropriée au récit biblique.
