  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְ/בָרֵ֣ךְ אֶֽת יַעֲקֹב֒ וַ/יְהִ֗י אַ֣ךְ יָצֹ֤א יָצָא֙ יַעֲקֹ֔ב מֵ/אֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑י/ו וְ/עֵשָׂ֣ו אָחִ֔י/ו בָּ֖א מִ/צֵּידֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: fr
  text: Isaac venait à peine de finir de bénir Jacob[a], et Jacob venait tout juste de quitter la présence d’Isaac, son père[b], lorsqu’Ésaü, son frère, revint de la chasse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Dès qu’Isaac eut fini de bénir Jacob ».'
    reason: La construction temporelle hébraïque peut être rendue de plusieurs manières ; le texte principal privilégie une tournure française qui souligne l’enchaînement immédiat.
  - marker: b
    text: 'L’hébreu renforce le verbe « sortir » par un infinitif absolu, littéralement : « sortir, il était sorti ». Dans ce contexte, cette insistance souligne que Jacob était tout juste parti.'
    reason: La note signale la forme emphatique de l’hébreu et l’immédiateté du départ dans le contexte.
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: À peine… que
  rationale: Cette construction française naturelle rend la succession narrative et l’enchaînement extrêmement rapide des actions sans reproduire lourdement les deux וַיְהִי.
- source_word: כַּאֲשֶׁר כִּלָּה
  choice: avait-il fini
  rationale: כלה exprime l’achèvement; le plus-que-parfait situe cet achèvement immédiatement avant le retour d’Ésaü.
- source_word: לְבָרֵךְ
  choice: de bénir
  rationale: Après « finir », l’infinitif français rend naturellement l’expression hébraïque.
- source_word: אַךְ יָצֹא יָצָא
  choice: venait-il tout juste de quitter
  rationale: La tournure rend l’immédiateté renforcée par אַךְ et par l’infinitif absolu associé au verbe conjugué, tout en restant idiomatique en français.
- source_word: מֵאֵת פְּנֵי
  choice: la présence de
  rationale: Cette expression conserve l’idée personnelle et spatiale de se retirer de devant Isaac.
- source_word: אָבִיו
  choice: son père
  rationale: Le lien familial explicitement exprimé en hébreu est maintenu.
- source_word: אָחִיו
  choice: son frère
  rationale: Le lien familial est conservé, car il contribue à la tension narrative.
- source_word: בָּא
  choice: revint
  rationale: Dans le contexte, Ésaü arrive auprès d’Isaac après être parti chasser; « revint » exprime naturellement ce mouvement en français.
- source_word: מִצֵּידוֹ
  choice: de la chasse
  rationale: ציד désigne ici le fait ou l’expédition de chasser plutôt que nécessairement le gibier rapporté.
