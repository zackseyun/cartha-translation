id: GEN.27.23
reference: Genesis 27:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: fr
  text: Il ne le reconnut pas, car ses mains étaient velues comme celles de son frère Ésaü. Alors il le bénit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il le bénit. » La forme narrative hébraïque peut indiquer une simple succession, bien qu’elle puisse aussi suggérer ici une conséquence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: ne le reconnut pas
  rationale: Le hifil de נכר signifie ici « reconnaître, identifier ». Isaac ne parvient pas à identifier Jacob par le toucher.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison pour laquelle Isaac ne reconnut pas Jacob. « Car » exprime naturellement ce rapport causal dans un récit au registre digne.
- source_word: יָדָיו
  choice: ses mains
  rationale: Traduction directe du pluriel muni du suffixe masculin singulier, qui renvoie aux mains de Jacob.
- source_word: כִּידֵי עֵשָׂו אָחִיו
  choice: comme celles de son frère Ésaü
  rationale: Le préfixe כ marque la comparaison. Le pronom « celles » évite en français une répétition lourde de « mains » tout en conservant le sens exact.
- source_word: שְׂעִרֹת
  choice: velues
  rationale: L’adjectif décrit la pilosité des mains telle qu’Isaac la perçoit au toucher. « Velues » est précis et idiomatique.
- source_word: וַיְבָרְכֵהוּ
  choice: Alors il le bénit
  rationale: La forme narrative fait progresser la séquence et, dans ce contexte, peut suggérer une conséquence. « Alors » conserve les deux nuances sans rendre le lien causal trop explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de la syntaxe et du mouvement narratif hébreux, avec une légère adaptation idiomatique (« celles »).
