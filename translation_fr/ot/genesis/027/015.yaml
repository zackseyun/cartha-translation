source:
  edition: WLC
  text: וַ/תִּקַּ֣ח רִ֠בְקָה אֶת בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤/הּ הַ/גָּדֹל֙ הַ/חֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖/הּ בַּ/בָּ֑יִת וַ/תַּלְבֵּ֥שׁ אֶֽת יַעֲקֹ֖ב בְּנָ֥/הּ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: fr
  text: Alors Rébecca prit les vêtements précieux d’Ésaü, son fils aîné[a], qu’elle avait avec elle dans la maison[b], et elle en habilla Jacob, son fils cadet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les plus beaux vêtements d’Ésaü, son fils aîné ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit plus littéralement : « qui étaient avec elle dans la maison ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Alors ... prit
  rationale: Le waw consécutif fait progresser le récit; « Alors » exprime naturellement cette succession en français moderne.
- source_word: בִּגְדֵי
  choice: les vêtements
  rationale: Le pluriel construit désigne des articles d’habillement; « vêtements » convient au registre narratif et reste courant.
- source_word: הַחֲמֻדֹת
  choice: précieux
  rationale: Le terme qualifie ce qui est désirable, apprécié ou de valeur. « Précieux » préserve cette nuance sans imposer qu’il s’agisse nécessairement de ses meilleurs vêtements.
- source_word: בְּנוֹ הַגָּדֹל
  choice: son fils aîné
  rationale: Dans ce contexte familial, גָּדוֹל marque l’antériorité d’âge et contraste avec קָטָן; « aîné » est idiomatique en français.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: qu’elle avait avec elle dans la maison
  rationale: Cette formulation conserve à la fois la relation exprimée par « avec elle » et la localisation dans la maison, sans ajouter l’idée qu’elle les y gardait habituellement.
- source_word: וַתַּלְבֵּשׁ
  choice: elle en habilla
  rationale: Le verbe signifie vêtir quelqu’un. Le pronom « en » reprend naturellement les vêtements déjà mentionnés et évite une répétition lourde.
- source_word: בְּנוֹ הַקָּטָן
  choice: son fils cadet
  rationale: קָטָן s’oppose ici à גָּדוֹל selon l’âge; « cadet » forme en français un parallèle naturel avec « aîné ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en étant fluide; « précieux » maintient l’ambiguïté entre des vêtements appréciés, recherchés ou particulièrement beaux.
