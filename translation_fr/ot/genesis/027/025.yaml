base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: fr
  text: 'Il dit : « Apporte-moi cela, et je mangerai du gibier de mon fils, afin que mon âme te bénisse[a]. » Jacob le lui apporta, et il mangea. Il lui apporta du vin, et il but.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « afin que je te bénisse ». Littéralement : « afin que mon âme te bénisse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישָׁה לִּי
  choice: Apporte-moi cela
  rationale: L’impératif causatif de נגשׁ signifie faire approcher ou présenter. En français, « apporte-moi cela » exprime naturellement le mouvement vers Isaac; « cela » explicite l’objet sous-entendu par le contexte.
- source_word: וְאֹכְלָה
  choice: et je mangerai
  rationale: Le cohortatif exprime ici l’intention d’Isaac après l’impératif. Le futur français rend naturellement cette progression.
- source_word: מִצֵּיד בְּנִי
  choice: du gibier de mon fils
  rationale: צַיִד désigne le produit de la chasse, et מִן a ici une valeur partitive. « Du gibier de mon fils » est précis et idiomatique.
- source_word: לְמַעַן
  choice: afin que
  rationale: La locution marque explicitement le but. « Afin que » convient au registre digne du récit sans être archaïque.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: mon âme te bénisse
  rationale: Le texte hébreu fait explicitement de נֶפֶשׁ, « âme », le sujet. La traduction conserve cette tournure solennelle et personnelle plutôt que de la réduire silencieusement à « je te bénisse ».
- source_word: וַיַּגֶּשׁ לוֹ
  choice: Jacob le lui apporta
  rationale: Le verbe reprend נגשׁ employé dans l’ordre précédent. « Apporta » maintient le lien lexical en français; le nom Jacob clarifie naturellement le sujet dans le contexte, et « le » reprend le mets ou gibier sous-entendu.
- source_word: יַיִן
  choice: du vin
  rationale: יַיִן signifie normalement « vin »; l’article partitif est requis dans cette construction française.
- source_word: וַיֵּשְׁתְּ
  choice: et il but
  rationale: Le passé simple rend sobrement la succession narrative du wayyiqtol.
theological_decisions:
- issue: La formule « mon âme te bénisse »
  choice: Conserver l’âme comme sujet dans le texte
  alternative: « afin que je te bénisse »
  rationale: La formulation littérale porte une intensité personnelle et solennelle réelle. Elle reste intelligible en français et évite d’effacer une nuance anthropologique du texte, tandis qu’une note donne l’équivalent idiomatique.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. La tournure hébraïque « mon âme te bénisse » est conservée dans le corps du texte, avec une note idiomatique. L’ajout contextuel de « Jacob » évite une succession ambiguë de pronoms sans modifier le référent.
