id: GEN.27.5
reference: Genesis 27:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/רִבְקָ֣ה שֹׁמַ֔עַת בְּ/דַבֵּ֣ר יִצְחָ֔ק אֶל עֵשָׂ֖ו בְּנ֑/וֹ וַ/יֵּ֤לֶךְ עֵשָׂו֙ הַ/שָּׂדֶ֔ה לָ/צ֥וּד צַ֖יִד לְ/הָבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: fr
  text: Rébecca écoutait pendant qu’Isaac parlait à Ésaü, son fils[a]. Ésaü alla dans la campagne pour chasser du gibier et le rapporter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Rébecca entendit Isaac parler à Ésaü, son fils ». Le participe hébreu associé à la construction temporelle peut être rendu soit comme une action en cours, soit de façon plus ponctuelle.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « pour chasser du gibier afin de le rapporter ». Les deux infinitifs hébreux peuvent aussi être rendus comme deux actions coordonnées.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: Rébecca
  rationale: Le waw relie cette phrase au récit précédent, mais le français n’exige pas ici de connecteur initial. Ne pas ajouter « Or » ou « Maintenant » évite d’introduire une nuance absente du mot hébreu lui-même.
- source_word: שֹׁמַעַת
  choice: écoutait
  rationale: Le participe présente l’action comme en cours et en arrière-plan pendant qu’Isaac parle. « Écoutait » rend naturellement cet aspect duratif; « entendit » demeure possible.
- source_word: בְּ/דַבֵּר
  choice: pendant qu’Isaac parlait
  rationale: La préposition בְּ avec l’infinitif construit exprime ici la simultanéité. Cette formulation française rend clairement le chevauchement des deux actions.
- source_word: אֶל־עֵשָׂו בְּנוֹ
  choice: à Ésaü, son fils
  rationale: La préposition indique le destinataire de la parole, et le suffixe de בֵּן désigne Ésaü comme le fils d’Isaac. L’apposition suit de près l’ordre et le sens de l’hébreu.
- source_word: וַ/יֵּלֶךְ
  choice: alla
  rationale: Dans cette séquence narrative, הלך décrit simplement le déplacement d’Ésaü, sans impliquer nécessairement un départ solennel.
- source_word: הַ/שָּׂדֶה
  choice: dans la campagne
  rationale: שָׂדֶה peut désigner un champ ou l’espace ouvert. Dans un contexte de chasse, « la campagne » est plus naturel et moins étroit que « le champ ».
- source_word: לָ/צוּד צַיִד
  choice: pour chasser du gibier
  rationale: צוד désigne l’action de chasser ou capturer, et ציד le gibier. Cette expression française reste générale et n’impose aucune espèce particulière.
- source_word: לְ/הָבִיא
  choice: et le rapporter
  rationale: Le second infinitif exprime le but de rapporter le gibier. La coordination est fluide en français et le pronom « le » reprend explicitement « gibier ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. L’imparfait installe l’action de Rébecca à l’arrière-plan; le passé simple fait avancer le récit avec le déplacement d’Ésaü. « Campagne » convient au contexte de chasse sans restreindre שָׂדֶה à une parcelle cultivée.
