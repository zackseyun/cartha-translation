  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: fr
  text: 'Il entra chez son père[a] et dit : « Mon père ! » Celui-ci répondit : « Me voici. Qui es-tu, mon fils ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Il vint vers son père. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Il entra donc
  rationale: Le verbe בוא au wayyiqtol fait avancer le récit. Dans ce contexte, Jacob pénètre dans l’espace où se trouve Isaac ; « entra » exprime naturellement ce mouvement, tandis que « donc » marque l’enchaînement narratif.
- source_word: אֶל אָבִיו
  choice: chez son père
  rationale: La préposition אֶל indique ici le mouvement vers la personne et le lieu où elle se trouve. En français, « entrer chez son père » est plus idiomatique que « entrer vers son père », sans ajouter le nom d’Isaac absent de l’hébreu.
- source_word: וַיֹּאמֶר
  choice: et dit / répondit
  rationale: La première occurrence introduit directement la parole de Jacob. Pour la seconde, « répondit » rend naturellement l’échange en français, bien que l’hébreu emploie dans les deux cas le verbe général « dire ».
- source_word: אָבִי
  choice: Mon père !
  rationale: Le nom porte le suffixe de première personne du singulier et sert d’interpellation ; « Mon père ! » conserve explicitement cette forme filiale.
- source_word: הִנֶּנִּי
  choice: Me voici
  rationale: Cette formule hébraïque de réponse signale la présence et la disponibilité du locuteur. « Me voici » en est l’équivalent français traditionnel, naturel et concis.
- source_word: מִי אַתָּה
  choice: Qui es-tu
  rationale: L’interrogatif מִי suivi du pronom masculin singulier demande directement l’identité de l’interlocuteur.
- source_word: בְּנִי
  choice: mon fils
  rationale: Le nom avec suffixe de première personne du singulier est employé comme vocatif ; « mon fils » en préserve le caractère personnel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « entra chez son père » privilégie l’idiome français tout en conservant en note le mouvement plus générique du verbe hébreu. Les répétitions hébraïques de « il dit » sont légèrement variées pour fluidifier le dialogue sans modifier les locuteurs ni le contenu.
