  text: וַ/יַּ֛עַן יִצְחָ֥ק אָבִ֖י/ו וַ/יֹּ֣אמֶר אֵלָ֑י/ו הִנֵּ֞ה מִ/שְׁמַנֵּ֤י הָ/אָ֨רֶץ֙ יִהְיֶ֣ה מֽוֹשָׁבֶ֔/ךָ וּ/מִ/טַּ֥ל הַ/שָּׁמַ֖יִם מֵ/עָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: fr
  text: 'Alors Isaac, son père, lui répondit : « Voici, ta demeure sera loin des terres fertiles et loin de la rosée qui vient d’en haut[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Voici, ta demeure sera dans les terres fertiles et sous la rosée qui vient d’en haut. » La préposition hébraïque peut exprimer soit la provenance ou la participation (« de »), soit l’éloignement ou la privation (« loin de »).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le verbe ענה introduit ici la réponse d’Isaac dans le dialogue; « répondit » est naturel et fidèle au récit.
- source_word: אָבִיו
  choice: son père
  rationale: Conserve l’accent relationnel de l’hébreu tout en intégrant naturellement l’apposition avec Isaac.
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque solennellement l’attention portée à la déclaration qui suit, sans archaïsme excessif.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: loin des terres fertiles
  rationale: שְׁמַנִּים évoque littéralement la « richesse » ou la « graisse » du sol, donc sa fertilité. מִן est compris ici au sens privatif ou séparatif; la formulation française exprime naturellement l’éloignement de cette fertilité.
- source_word: מוֹשָׁבֶךָ
  choice: ton lieu d’habitation
  rationale: מוֹשָׁב désigne le lieu où l’on demeure; cette expression garde le sens locatif avec clarté.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: et loin de la rosée du ciel
  rationale: Le second מִן est lu parallèlement au premier dans un sens privatif ou séparatif.
- source_word: מֵעָל
  choice: là-haut
  rationale: Rend l’expression spatiale « au-dessus » en français naturel tout en la rattachant au ciel.
theological_decisions:
- issue: Sens de la préposition מִן dans la déclaration d’Isaac à Ésaü
  choice: 'Sens privatif ou séparatif : « loin des » terres fertiles et « loin de » la rosée du ciel'
  alternative: 'Sens de provenance ou de participation : « des terres fertiles » et « de la rosée du ciel »'
  rationale: Le contexte, en contraste avec la bénédiction accordée à Jacob au verset 28, favorise une déclaration de privation ou d’éloignement. Toutefois, la préposition hébraïque permet aussi la lecture positive traditionnelle; cette ambiguïté réelle est donc signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » conserve la solennité du discours. « Terres fertiles » rend idiomatiquement l’image hébraïque de la « richesse » ou de la « graisse » de la terre; la note préserve l’ambiguïté déterminante de la préposition.
