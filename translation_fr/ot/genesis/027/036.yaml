base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: fr
  text: 'Il dit : « N’est-ce pas à juste titre qu’il s’appelle Jacob[a] ? Voilà deux fois qu’il m’a supplanté : il a pris mon droit d’aînesse et maintenant, voilà qu’il a pris ma bénédiction ! » Puis il dit : « Ne m’as-tu pas réservé une bénédiction ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, il y a un jeu de mots entre le nom « Jacob » et le verbe traduit par « il m’a supplanté ». Ce verbe peut aussi se traduire par « il m’a trompé » ou « il a pris l’avantage sur moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: N’est-ce pas à juste titre qu’on l’appelle Jacob ?
  rationale: La question rhétorique exprime l’amertume d’Ésaü et introduit le jeu de mots avec le nom Jacob. Cette formulation est naturelle en français tout en gardant le lien explicite avec le nom.
- source_word: וַיַּעְקְבֵנִי
  choice: il me supplante
  rationale: « Supplanter » rend l’idée de prendre la place ou l’avantage sur quelqu’un et permet de signaler en note le jeu de mots hébreu avec « Jacob », sans réduire le verbe au seul sens de tromper.
- source_word: זֶה פַעֲמַיִם
  choice: Voilà deux fois
  rationale: Cette tournure française conserve la valeur emphatique de l’expression hébraïque et convient au reproche passionné d’Ésaü.
- source_word: בְּכֹרָתִי
  choice: mon droit d’aînesse
  rationale: Expression française usuelle et précise pour les droits et privilèges attachés au statut de premier-né.
- source_word: וְהִנֵּה עַתָּה
  choice: et maintenant, regarde
  rationale: « Regarde » restitue dans une langue actuelle la force déictique et émotionnelle de הִנֵּה, plutôt que le plus archaïque « voici » ou « voilà » dans cette position.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: Ne m’as-tu pas réservé une bénédiction ?
  rationale: « Réserver » exprime naturellement l’idée de garder en retrait ou de mettre de côté une bénédiction encore disponible.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde l’intensité du reproche d’Ésaü. Le présent « il me supplante » rend le parfait hébreu dans une plainte récapitulative, tandis que les deux actes sont ensuite exprimés au passé composé.
