  to: 'Il dit : « N’est-ce pas à juste titre qu’il s’appelle Jacob[a] ? Voilà deux fois qu’il m’a supplanté : il a pris mon droit d’aînesse et maintenant, voilà qu’il a pris ma bénédiction ! » Puis il dit : « Ne m’as-tu pas réservé une bénédiction ? »'
  rationale: La révision rend le verbe de plainte au passé composé, rattache la note à « Jacob » et remplace « regarde » par la tournure française plus naturelle « voilà qu’ ». Elle ne modifie ni le sens des griefs d’Ésaü ni l’ambiguïté du verbe hébreu, explicitée en note.
