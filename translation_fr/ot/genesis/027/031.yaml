base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: fr
  text: 'Lui aussi prépara des mets savoureux et les apporta à son père. Il dit à son père : « Que mon père se lève et mange du gibier de son fils, afin que ton âme me bénisse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque « ton âme me bénisse » peut aussi se comprendre idiomatiquement : « que tu me bénisses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטְעַמִּים
  choice: un plat savoureux
  rationale: Le pluriel hébreu désigne ici des mets spécialement préparés et goûteux. Le singulier collectif « un plat savoureux » est naturel en français dans ce contexte.
- source_word: גַּם הוּא
  choice: Lui aussi
  rationale: Cette formulation conserve l’insistance additive et établit le parallèle avec l’action précédente de Jacob.
- source_word: יָקֻם אָבִי
  choice: Que mon père se lève
  rationale: Le jussif exprime une demande respectueuse. La troisième personne employée dans l’adresse est conservée, conformément au registre filial du texte.
- source_word: מִצֵּיד בְּנוֹ
  choice: du gibier de son fils
  rationale: צַיִד désigne ici le produit de la chasse. La formulation préserve aussi la désignation de soi à la troisième personne.
- source_word: בַּעֲבוּר
  choice: afin que
  rationale: Cette locution exprime clairement le but tout en convenant au registre digne du passage.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: que ton âme me bénisse
  rationale: La traduction maintient l’expression explicite « ton âme » et la tension entre sa valeur littérale et son emploi idiomatique pour la personne elle-même.
- source_word: וַיָּבֵא לְאָבִיו
  choice: l’apporta à son père
  rationale: Le pronom « l’ » reprend naturellement en français le plat préparé, objet implicite du verbe hébreu.
theological_decisions:
- issue: Valeur de נַפְשֶׁךָ dans la formule de bénédiction
  choice: ton âme me bénisse
  alternative: tu me bénisses
  rationale: Le français permet de conserver l’expression hébraïque intelligiblement. Cela évite de réduire silencieusement נֶפֶשׁ à un simple pronom personnel et préserve la solennité de la scène, sans lui imposer une définition doctrinale de l’âme.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe respectueuse « Que mon père… son fils » conserve la manière dont Ésaü s’adresse à Isaac à la troisième personne. L’expression « ton âme » est maintenue dans le texte et explicitée en note.
