  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: fr
  text: 'Isaac dit à son fils : « Comment as-tu fait pour trouver si vite, mon fils ? » Il répondit : « C’est que Yahweh, ton Dieu, l’a fait se présenter à moi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh, ton Dieu, a fait en sorte que cela se présente à moi » ; littéralement : « a fait arriver devant moi ». Selon l’idiome, on peut aussi comprendre : « m’a accordé de réussir ».'
    reason: 'Le groupe הִקְרָה ... לְפָנַי exprime une action causative de Dieu : il fait survenir ou se présenter la chose devant Jacob. La note indique la formulation littérale et l’interprétation idiomatique possible sans les confondre.'
lexical_decisions:
- source_word: מַה זֶּה
  choice: Comment se fait-il que
  rationale: Cette tournure française naturelle exprime à la fois l’interrogation et l’étonnement d’Isaac.
- source_word: מִהַרְתָּ לִמְצֹא
  choice: tu aies trouvé si vite
  rationale: Rend naturellement l’idée littérale de « te hâter de trouver » tout en conservant l’accent sur la rapidité inattendue.
- source_word: בְּנִי
  choice: mon fils
  rationale: Conserve le possessif et la forme affectueuse d’adresse directe.
- source_word: כִּי
  choice: C’est que
  rationale: Introduit naturellement en français l’explication donnée en réponse à la question d’Isaac.
- source_word: הִקְרָה ... לְפָנַי
  choice: l’a fait venir à ma rencontre
  rationale: Exprime le causatif du verbe et l’image de ce qui survient devant Jacob, sans réduire le sens à la seule idée de réussite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: 'Préserve la deuxième personne du singulier, importante dans la tension narrative : Jacob dit « ton Dieu », non « mon Dieu ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom divin personnel ; sa transcription le distingue d’un simple titre.
- issue: Portée providentielle de הִקְרָה
  choice: l’a fait venir à ma rencontre
  alternative: m’a accordé de réussir
  rationale: La formulation retenue conserve l’action causative attribuée à Dieu et l’image spatiale de לְפָנַי, sans expliciter davantage que le texte la notion de succès.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue conserve l’étonnement d’Isaac ainsi que le « ton Dieu » narrativement significatif de Jacob.
