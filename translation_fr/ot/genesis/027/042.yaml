base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: fr
  text: 'On rapporta à Rébecca les paroles d’Ésaü, son fils aîné. Elle fit alors appeler Jacob, son fils cadet, et lui dit : « Écoute, ton frère Ésaü se console à ton sujet en projetant de te tuer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי
  choice: les paroles
  rationale: Le terme renvoie ici aux propos ou au dessein exprimé par Ésaü au verset précédent ; « paroles » conserve le lien verbal avec le contexte.
- source_word: בְּנָהּ הַגָּדֹל / בְּנָהּ הַקָּטָן
  choice: son fils aîné / son fils cadet
  rationale: Dans ce contexte de deux frères, ces expressions françaises rendent naturellement le contraste littéral entre le grand et le petit.
- source_word: הִנֵּה
  choice: Écoute
  rationale: L’interjection attire fortement l’attention de Jacob ; « Écoute » est idiomatique dans cet avertissement oral, sans ajouter de contenu.
- source_word: מִתְנַחֵם לְךָ
  choice: se console à ton sujet
  rationale: Cette formulation garde l’image surprenante et sombre du verbe réfléchi, selon laquelle Ésaü trouve une forme de consolation dans son projet contre Jacob.
- source_word: לְהָרְגֶךָ
  choice: en projetant de te tuer
  rationale: L’infinitif exprime ici le moyen ou le contenu concret de cette consolation. « En projetant » explicite le dessein meurtrier sans présenter le meurtre comme déjà accompli.
theological_decisions:
- issue: Nature de la « consolation » d’Ésaü
  choice: Conserver l’idée qu’Ésaü « se console » en projetant le meurtre
  alternative: « veut se venger de toi et te tuer »
  rationale: Le texte hébreu emploie un verbe lié à la consolation ; le remplacer entièrement par « se venger » effacerait l’image psychologique et la tension propres au passage.
translation_notes:
  register: Français international moderne, narratif et digne. « On rapporta » évite un passif lourd ; « elle fit alors appeler » rend naturellement les deux verbes successifs d’envoi et d’appel. La formulation inhabituelle « se console à ton sujet » est volontairement conservée pour respecter l’expression hébraïque.
