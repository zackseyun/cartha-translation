  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: fr
  text: 'Il lui dit : « Procure-moi[a] une génisse de trois ans[b], une chèvre de trois ans, un bélier de trois ans, une tourterelle et un jeune pigeon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prends pour moi ». Dans ce contexte, il s’agit de se procurer les animaux destinés au rite d’alliance.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu répété pour les trois premiers animaux est traditionnellement compris ici comme indiquant qu’ils ont trois ans ; il peut aussi, selon son sens formel, évoquer ce qui est triple ou divisé en trois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Il lui dit
  rationale: Rend simplement la progression narrative du wayyiqtol et le complément pronominal, dont l’antécédent contextuel est Abram.
- source_word: קְחָה לִי
  choice: Procure-moi
  rationale: L’expression signifie littéralement « prends pour moi », mais, dans ce contexte, Dieu demande à Abram de se procurer les animaux en vue du rite d’alliance. « Procure-moi » exprime naturellement cette idée sans préciser davantage la manière de les obtenir.
- source_word: עֶגְלָה
  choice: génisse
  rationale: Désigne un jeune bovin femelle ; « génisse » est le terme français précis et usuel.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: de trois ans
  rationale: Dans cette liste d’animaux, la compréhension traditionnelle et contextuellement probable est qu’il s’agit de leur âge. La note conserve la possibilité d’une autre analyse du terme hébreu.
- source_word: עֵז
  choice: chèvre
  rationale: Le nom désigne ici une femelle de l’espèce caprine ; « chèvre » est précis et naturel en français.
- source_word: אַיִל
  choice: bélier
  rationale: Équivalent français courant du mâle adulte de l’espèce ovine, notamment dans les contextes rituels.
- source_word: תֹר
  choice: tourterelle
  rationale: Le terme hébreu désigne spécifiquement une tourterelle plutôt qu’un oiseau ou une colombe au sens générique.
- source_word: גוֹזָל
  choice: jeune pigeon
  rationale: Dans cette association rituelle avec la tourterelle, le terme est traditionnellement compris comme un jeune pigeon, sens plus précis que « oisillon ».
