  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: fr
  text: Mais je jugerai aussi la nation qu’ils serviront[a] ; après cela, ils sortiront avec de grandes richesses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à laquelle ils seront asservis ». Le verbe hébreu signifie littéralement « servir », mais le contexte évoque un service imposé sous la domination d’une nation étrangère.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec de nombreux biens » ou « avec des possessions abondantes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Mais… aussi
  rationale: La combinaison poursuit le discours tout en marquant un contraste avec l’oppression annoncée et en conservant la valeur additive de גַם.
- source_word: הַגּוֹי
  choice: la nation
  rationale: גּוֹי désigne ici la puissance nationale étrangère au service de laquelle se trouveront les descendants d’Abram.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: qu’ils serviront
  rationale: Cette traduction conserve le sens explicite du qal de עבד, « servir, travailler pour », sans expliciter dans le texte principal la contrainte que le contexte implique.
- source_word: דָּן אָנֹכִי
  choice: je jugerai
  rationale: Le participe דָּן accompagné du pronom emphatique אָנֹכִי a ici une portée future. « Juger » préserve la nuance judiciaire sans la réduire à « punir ».
- source_word: וְאַחֲרֵי כֵן
  choice: après cela
  rationale: Expression temporelle naturelle en français, elle marque clairement la succession annoncée.
- source_word: יֵצְאוּ
  choice: ils sortiront
  rationale: יצא signifie « sortir ». Le français « ils sortiront » reste direct et laisse le contexte préciser qu’il s’agit de quitter le pays d’oppression.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: avec de grands biens
  rationale: רְכוּשׁ désigne des biens, des possessions ou des richesses matérielles. « De grands biens » conserve ce caractère concret ainsi que l’idée d’importance ou d’abondance portée par גָּדוֹל.
theological_decisions:
- issue: Nature du jugement divin contre la nation oppressive
  choice: je jugerai
  alternative: je punirai
  rationale: Le verbe דָּן relève du langage judiciaire. « Juger » maintient la portée morale et juridique de l’énoncé sans déterminer à l’avance la forme ou l’issue précise du jugement.
- issue: Condition des descendants au service de la nation
  choice: qu’ils serviront
  alternative: à laquelle ils seront asservis
  rationale: Le verbe hébreu dit littéralement « servir ». Le contexte indique une servitude imposée, mais le texte principal conserve la formulation source tandis que la note explicite cette implication.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation demeure proche de la structure hébraïque tout en évitant les tournures archaïques. Les deux marqueurs de note figurent dans le texte principal et suivent les expressions qu’ils éclairent.
