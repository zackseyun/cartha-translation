  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: fr
  text: 'Puis Abram dit : « Voici, tu ne m’as donné aucune descendance[a], et voici qu’un membre de ma maisonnée sera mon héritier[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Descendance » traduit l’hébreu zéraʿ, littéralement « semence », qui désigne ici la progéniture ou les descendants.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « un fils de ma maison hérite de moi ». L’expression désigne une personne de la maisonnée ; ou « héritera de moi », c’est-à-dire de mes biens ou de ma succession.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis Abram dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » exprime naturellement cette succession en français.
- source_word: הֵן
  choice: Voici
  rationale: La particule attire l’attention et souligne la plainte d’Abram. « Voici » en conserve la force dans un registre digne.
- source_word: לִי לֹא נָתַתָּה
  choice: tu ne m’as donné aucune
  rationale: Cette formulation française naturelle conserve le bénéficiaire explicite et présente l’absence de don jusqu’au moment où Abram parle.
- source_word: זָרַע
  choice: descendance
  rationale: Le nom hébreu signifie littéralement « semence », mais désigne ici la progéniture de manière collective.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: La seconde particule déictique renforce la conclusion d’Abram et maintient le parallélisme emphatique avec הֵן.
- source_word: בֶן בֵּיתִי
  choice: un fils de ma maison
  rationale: Cette traduction conserve l’image familiale et domestique de l’hébreu sans préciser indûment qu’il s’agit d’un esclave.
- source_word: יוֹרֵשׁ אֹתִי
  choice: héritera de moi
  rationale: Le participe désigne celui qui hérite, et le complément « moi » est conservé afin de ne pas réduire silencieusement la formulation à « sera mon héritier ».
theological_decisions:
- issue: Identité et statut de l’héritier évoqué par Abram
  choice: un fils de ma maison
  alternative: un serviteur né dans ma maison ; un membre de ma maisonnée
  rationale: Le verset ne nomme pas explicitement un esclave. La traduction garde donc l’expression du texte et laisse le contexte préciser l’identité de cette personne.
- issue: Objet de l’héritage
  choice: héritera de moi
  alternative: sera mon héritier ; héritera de mes biens
  rationale: L’hébreu a littéralement Abram lui-même comme complément. La formulation retenue préserve cette tension et permet la compréhension métonymique habituelle sans l’imposer dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « voici » est conservée pour rendre les deux particules emphatiques de l’hébreu. « Fils de ma maison » maintient l’image du texte source, tandis que les notes expliquent les deux expressions susceptibles de paraître inhabituelles.
