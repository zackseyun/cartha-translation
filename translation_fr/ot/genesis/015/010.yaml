base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: fr
  text: Il prit donc tous ces animaux et les apporta à Dieu[a], les coupa en deux et plaça chaque partie en face de l’autre[b] ; mais il ne coupa pas les oiseaux en deux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prit pour lui ». Dans le contexte, le pronom hébreu renvoie probablement à Dieu, qui vient de demander à Abram de prendre ces animaux pour lui.'
    reason: ambiguïté grammaticale et référentielle
  - marker: b
    text: 'Littéralement : « chaque morceau en face de son compagnon ».'
    reason: rendu idiomatique d’une expression distributive hébraïque
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: Il prit donc tous ces animaux pour lui
  rationale: Le verbe narratif est rendu par « prit donc ». Le pronom לוֹ est conservé par « pour lui », dont le référent naturel dans le contexte est Dieu, conformément à l’ordre du verset précédent. « Animaux » explicite sobrement le référent de « tous ceux-ci » en français.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: les partagea par le milieu
  rationale: « Partager par le milieu » restitue concrètement בתר et בַּתָּוֶךְ sans ajouter au texte une explication du rite d’alliance.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: plaça chaque morceau en face de l’autre
  rationale: La tournure distributive אִישׁ…רֵעֵהוּ est rendue naturellement par « chaque… l’autre » ; « morceau » conserve le sens concret de la partie découpée sans imposer qu’il s’agisse exactement de deux moitiés égales.
- source_word: וְאֶת הַצִּפֹּר לֹא בָתָר
  choice: mais il ne partagea pas les oiseaux
  rationale: Le singulier collectif הַצִּפֹּר renvoie aux deux oiseaux du verset précédent ; le pluriel français rend ce référent clairement. La reprise de « partagea » maintient le lien lexical avec l’action précédente.
theological_decisions:
- issue: Langage du rite de conclusion d’alliance
  choice: Décrire concrètement les animaux découpés et les morceaux disposés face à face
  alternative: Ajouter une explication explicite du rite d’alliance dans le corps du verset
  rationale: Le contexte donne à la scène sa portée d’alliance, mais le verset lui-même décrit les gestes sans les interpréter. La traduction préserve cette retenue.
- issue: Référent de לוֹ
  choice: « pour lui », référant contextuellement à Dieu
  alternative: « pour lui-même », référant à Abram
  rationale: La forme hébraïque peut être entendue de plusieurs façons, mais l’ordre divin du verset 9 (« Prends pour moi ») favorise nettement Dieu comme référent. Une note conserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concrète et accessible, sans archaïsme ni développement doctrinal. Les marqueurs [a] et [b] figurent dans le texte aux endroits concernés.
