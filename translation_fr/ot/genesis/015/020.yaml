id: GEN.15.20
reference: Genesis 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: fr
  text: les Hittites, les Perizzites et les Rephaïm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les géants ». Dans certains contextes, le terme hébreu Rephaïm peut être compris comme une désignation descriptive; ici, il désigne très probablement un peuple du pays.
    reason: alternative lexicale
lexical_decisions:
- source_word: וְאֶת
  choice: et / coordination de la liste
  rationale: La conjonction וְ poursuit l’énumération commencée au verset précédent, tandis que le marqueur d’objet אֵת ne se traduit pas directement en français. Dans la formulation française, la coordination est rendue naturellement, avec « et » devant le dernier élément.
- source_word: הַחִתִּי
  choice: les Hittites
  rationale: Bien que le gentilé hébreu soit morphologiquement au singulier, il a ici un sens collectif. Le pluriel français désigne naturellement le peuple.
- source_word: הַפְּרִזִּי
  choice: les Perizzites
  rationale: Le singulier collectif hébreu désigne un groupe humain; le pluriel est donc idiomatique en français. La forme « Perizzites » est une translittération française courante.
- source_word: הָרְפָאִים
  choice: les Rephaïm
  rationale: Dans cette liste des peuples du pays, le terme fonctionne très probablement comme un nom ethnique. La translittération préserve cette valeur de nom propre sans imposer dans le texte l’interprétation « géants ».
theological_decisions:
- issue: Faut-il rendre רְפָאִים comme un nom de peuple ou comme une description?
  choice: Nom ethnique « Rephaïm » dans le texte
  alternative: « géants »
  rationale: Genèse 15.19-21 énumère les peuples qui occupent le pays promis à Abram; le sens ethnique est donc le plus probable ici. La note conserve néanmoins l’autre compréhension attestée sans trancher silencieusement l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. Les gentilés sont rendus au pluriel selon l’usage français. La ponctuation clôt le verset tout en reconnaissant qu’il achève une liste commencée aux versets précédents.
