base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: fr
  text: 'Mais Abram dit : « Seigneur Yahweh, que me donneras-tu ? Je vais mourir sans enfant, et l’héritier de ma maison[a], c’est Éliézer de Damas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fils de possession de ma maison », expression hébraïque inhabituelle dont le sens est incertain ; elle peut désigner l’intendant, le possesseur ou l’héritier de la maison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais Abram dit
  rationale: Le waw narratif fait progresser le récit, tandis que « mais » marque naturellement l’objection inquiète d’Abram à la promesse précédente.
- source_word: אֲדֹנָי יֱהוִה
  choice: Seigneur Yahweh
  rationale: « Seigneur » rend le titre אֲדֹנָי et « Yahweh » conserve distinctement le nom divin יֱהוִה, sans produire l’expression maladroite « Seigneur le Seigneur ».
- source_word: מַה תִּתֶּן לִי
  choice: que me donneras-tu ?
  rationale: L’imparfait hébreu prend ici naturellement une valeur future. Cette formulation française est directe et idiomatique.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: Je m’en vais sans enfant
  rationale: La formulation conserve l’image de la marche vers la fin de la vie sans expliciter « mourir », que le texte ne dit pas directement, et rend עֲרִירִי par l’expression naturelle « sans enfant ».
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: l’héritier de ma maison
  rationale: L’expression hébraïque est rare et obscure. Dans le contexte, elle désigne vraisemblablement celui qui recevrait les biens d’Abram. Le sens probable est donné dans le texte, tandis que la tournure littérale et les autres possibilités sont signalées en note.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: Éliézer de Damas
  rationale: Cette formulation française naturelle identifie Éliézer par son origine ou son association avec Damas.
theological_decisions:
- issue: Traduction du nom divin יֱהוִה dans l’adresse אֲדֹנָי יֱהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le choix maintient à la fois le titre divin et le nom propre de l’alliance présents dans l’hébreu, sans les confondre.
- issue: Statut d’Éliézer dans la maison d’Abram
  choice: l’héritier de ma maison
  alternative: l’intendant de ma maison
  rationale: Le contexte successoral favorise « héritier », mais l’expression hébraïque demeure incertaine. La note préserve donc les autres analyses possibles sans transformer l’une d’elles en affirmation théologique certaine.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’adresse biblique directe à Dieu. « Je m’en vais » préserve l’image hébraïque et sa possible allusion à la mort sans la rendre explicite.
