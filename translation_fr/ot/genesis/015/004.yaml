  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: fr
  text: 'Or voici que la parole du SEIGNEUR lui fut adressée : « Ce n’est pas cet homme qui sera ton héritier ; c’est celui qui sera issu de toi qui sera ton héritier. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Mais voici que
  rationale: « Voici que » restitue la particule de mise en relief ; « mais » marque naturellement le contraste avec la crainte exprimée par Abram au verset précédent.
- source_word: דְבַר יְהוָה אֵלָיו
  choice: la parole du SEIGNEUR lui fut adressée
  rationale: Formulation française idiomatique pour la venue d’une parole divine, tout en conservant le tétragramme selon la convention « SEIGNEUR ».
- source_word: זֶה
  choice: cet homme
  rationale: Le démonstratif renvoie à Éliézer mentionné précédemment ; « cet homme » rend ce référent humain sans répéter son nom.
- source_word: יִירָשְׁךָ
  choice: héritera de toi
  rationale: Cette construction conserve la relation exprimée par le suffixe hébreu et convient au contexte de succession.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: celui qui sortira de ton propre corps
  rationale: Rend l’image corporelle de l’hébreu de manière claire et digne, sans préciser davantage le lien biologique que ne le fait le texte.
theological_decisions:
- issue: Identité précise de l’héritier promis
  choice: « celui qui sortira de ton propre corps »
  alternative: « ton propre fils »
  rationale: Le texte affirme une descendance corporelle directe, mais n’emploie pas ici le mot « fils » ; la traduction préserve donc sa formulation et sa progression narrative.
- issue: Rendu du nom divin יהוה
  choice: SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La convention française en petites capitales signale le tétragramme tout en restant naturelle dans une Bible destinée au grand public.
translation_notes:
  register: Français international moderne, naturel et digne. La construction traditionnelle « la parole du SEIGNEUR lui fut adressée » est immédiatement compréhensible ; le parallélisme de la déclaration divine est conservé.
