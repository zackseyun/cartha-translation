id: GEN.15.8
reference: Genesis 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: fr
  text: 'Il dit : « Seigneur Yahweh, comment saurai-je que j’en prendrai possession[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que j’en hériterai » ou « que je la posséderai ».'
    reason: Le verbe hébreu ירשׁ peut signifier hériter, posséder ou prendre possession selon le contexte.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Il dit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple rend naturellement cette progression sans qu’il soit nécessaire d’ajouter « et ».
- source_word: אֲדֹנָי יֱהוִה
  choice: Seigneur Yahweh
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יהוה et représente directement les deux éléments de l’adresse.
- source_word: בַּמָּה אֵדַע
  choice: comment saurai-je
  rationale: בַּמָּה signifie littéralement « par quoi », mais introduit ici le moyen d’obtenir une assurance; « comment saurai-je » est idiomatique et conserve la portée future de l’imparfait אֵדַע.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qu’Abram veut savoir.
- source_word: אִירָשֶׁנָּה
  choice: j’en prendrai possession
  rationale: Le verbe ירשׁ peut exprimer l’héritage ou la prise de possession. Dans le contexte de la terre promise au verset précédent, cette formulation exprime clairement l’entrée effective en possession tout en laissant l’autre nuance en note.
theological_decisions:
- issue: Traduction de l’adresse divine אֲדֹנָי יֱהוִה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: « Seigneur Yahweh » préserve à la fois le titre et le nom divin présents dans l’hébreu, sans les fusionner ni substituer un titre au Tétragramme.
- issue: Nuance de ירשׁ appliqué à la terre promise
  choice: j’en prendrai possession
  alternative: j’en hériterai
  rationale: Le contexte porte sur la possession future du pays. La traduction principale évite d’imposer exclusivement la catégorie juridique ou familiale de l’héritage, tandis que la note conserve cette nuance covenantale possible.
translation_notes:
  register: Français international moderne, sobre et digne. L’inversion « saurai-je » convient à une adresse solennelle tout en restant courante; le pronom « en » reprend naturellement le pays mentionné au verset précédent.
