  text: the Kenites[a], the Kenizzites, and the Kadmonites—
translation:
  language: fr
  text: les Qénites, les Qenizzites et les Qadmonites[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu קַדְמֹנִי (qadmoni) est apparenté aux termes désignant l’« est » ou ce qui est « oriental ». Il est rendu ici par le nom ethnique « Qadmonites », puisqu’il figure dans une liste de peuples.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct, sans équivalent lexical autonome en français; sa fonction ressort de la liste intégrée à la phrase précédente.
- source_word: הַקֵּינִי
  choice: les Qénites
  rationale: Ethnonyme collectif avec article. Le pluriel français désigne naturellement l’ensemble du peuple.
- source_word: וְאֶת
  choice: '[non traduit séparément]'
  rationale: La conjonction hébraïque participe à l’énumération, mais le français réserve normalement « et » au dernier élément; le marqueur d’objet n’est pas rendu séparément.
- source_word: הַקְּנִזִּי
  choice: les Qenizzites
  rationale: Ethnonyme collectif dans une liste de peuples; le pluriel français en préserve la valeur collective.
- source_word: וְאֵת
  choice: et
  rationale: La conjonction introduit le dernier élément de l’énumération; le marqueur d’objet direct est absorbé par la syntaxe française.
- source_word: הַקַּדְמֹנִי
  choice: les Qadmonites
  rationale: Bien que le terme soit apparenté à l’idée d’« est » ou d’« oriental », son parallélisme avec les autres noms de peuples favorise ici sa transcription comme ethnonyme.
