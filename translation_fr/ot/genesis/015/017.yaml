revisions:
- from: Quand le soleil fut couché et que l’obscurité fut venue, voici qu’un four fumant[a] et une torche enflammée passèrent entre ces morceaux[b].
  to: Lorsque le soleil se fut couché et qu’il faisait sombre, voici qu’un four fumant[a] et une torche enflammée passèrent entre ces morceaux[b].
  rationale: La révision remplace deux tours pesants et vieillissants par une formulation narrative moderne et naturelle. Elle maintient le passé antérieur pour le coucher du soleil, puis emploie l’imparfait d’état pour l’obscurité, conformément à la proposition nominale hébraïque. Les images, le pluriel interprétatif déjà suivi par la traduction anglaise, les repères de notes et l’ambiguïté quant à la nature des signes sont conservés.
