  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: fr
  text: Lorsque le soleil se fut couché et qu’il faisait sombre, voici qu’un four fumant[a] et une torche enflammée passèrent entre ces morceaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fournaise fumante » ou « un brasero fumant ». Le terme hébreu désigne principalement un four ou un récipient où brûle un feu.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit des morceaux des animaux découpés en deux lors de la préparation de l’alliance (voir Genèse 15.10).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  choice: Quand le soleil fut couché
  rationale: Avec le soleil pour sujet, בוא désigne idiomatiquement son coucher. Le passé antérieur marque naturellement en français littéraire l’action accomplie avant la scène principale.
- source_word: וַעֲלָטָה הָיָה
  choice: et que l’obscurité fut venue
  rationale: עֲלָטָה désigne l’obscurité ou les ténèbres. Cette formulation conserve l’idée dynamique de sa venue sans ajouter l’intensification « épaisse ».
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure attire vivement l’attention sur l’apparition tout en restant naturelle et digne en français moderne.
- source_word: תַנּוּר עָשָׁן
  choice: un four fumant
  rationale: תַנּוּר désigne un four ou un récipient à feu. « Four fumant » rend directement l’image sans lui donner la connotation industrielle possible de « fournaise ».
- source_word: לַפִּיד אֵשׁ
  choice: une torche enflammée
  rationale: לַפִּיד désigne une torche, et אֵשׁ en souligne le caractère ardent. « Torche enflammée » est idiomatique et visuel.
- source_word: אֲשֶׁר עָבַר
  choice: passèrent
  rationale: Le relatif hébreu introduit l’action attribuée à l’ensemble des deux signes. Le pluriel français s’accorde naturellement avec « un four » et « une torche », tout en conservant leur présentation conjointe.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: entre ces morceaux
  rationale: גְּזָרִים renvoie aux parties découpées des animaux mentionnées au verset 10. « Morceaux » est clair et n’alourdit pas le texte.
theological_decisions:
- issue: Nature des objets de feu dans la scène de conclusion de l’alliance
  choice: Décrire le four fumant et la torche enflammée sans les identifier explicitement à Dieu dans le corps du texte.
  alternative: Les présenter comme une manifestation de la présence du SEIGNEUR passant entre les morceaux.
  rationale: Le contexte invite fortement à comprendre une manifestation divine, mais le verset lui-même ne nomme que les signes visibles. La traduction préserve cette retenue et la tension théologique du texte.
translation_notes:
  register: Français international moderne, avec une dignité narrative sobre. « Voici que » conserve la force de présentation de הִנֵּה. Le passé antérieur donne à l’ouverture une cadence littéraire adaptée sans recourir à une formulation archaïque.
