base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: fr
  text: 'Puis il le fit sortir et dit : « Regarde donc vers les cieux et compte les étoiles, si tu peux les compter. » Il lui dit alors : « Ainsi sera ta descendance[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta semence » ; le nom hébreu est singulier dans sa forme, mais collectif dans son sens, et peut désigner l’ensemble des descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: il le fit sortir
  rationale: Le hifil de יצא exprime le fait de faire sortir quelqu’un. Cette formulation française conserve clairement la valeur causative et rend inutile l’ajout redondant de « dehors ».
- source_word: הַבֶּט נָא
  choice: Regarde donc
  rationale: L’impératif הבט signifie « regarde » ; la particule נא apporte ici une nuance d’invitation ou d’insistance douce, naturellement rendue par « donc ».
- source_word: הַשָּׁמַיְמָה
  choice: vers les cieux
  rationale: La terminaison directionnelle indique l’orientation du regard, et « les cieux » préserve le pluriel hébreu dans un registre digne et intelligible.
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: et compte les étoiles
  rationale: ספר désigne ici l’action de dénombrer ; « compter » est l’équivalent français direct et courant.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: si tu peux les compter
  rationale: La proposition conditionnelle porte sur la capacité. Cette tournure est naturelle et conserve le défi implicite sans l’expliciter davantage.
- source_word: כֹּה יִהְיֶה
  choice: Ainsi sera
  rationale: כֹּה introduit une comparaison entre les étoiles innombrables et la descendance promise. « Ainsi sera » en restitue la concision et la solennité.
- source_word: זַרְעֶךָ
  choice: ta descendance
  rationale: זֶרַע est singulier dans sa forme mais collectif dans cet emploi. « Descendance » exprime naturellement ce sens collectif sans imposer un pluriel grammatical.
theological_decisions:
- issue: Rendu de זַרְעֶךָ dans la promesse faite à Abram, avec sa résonance singulière et collective
  choice: ta descendance
  alternative: ta semence ; tes descendants
  rationale: « Descendance » est naturel en français moderne et demeure un nom singulier à portée collective. Il évite le caractère aujourd’hui étrange de « semence » pour des personnes et ne transforme pas explicitement le terme hébreu en un pluriel comme le ferait « descendants ». Une note conserve l’information lexicale utile aux lectures théologiques ultérieures.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression hébraïque, notamment par la répétition de la prise de parole, tout en évitant les formulations inutilement archaïques.
