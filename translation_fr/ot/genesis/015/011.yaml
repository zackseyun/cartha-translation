  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: fr
  text: Les oiseaux de proie descendirent sur les carcasses[a], et Abram les chassa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l''oiseau de proie descendit sur les carcasses ». Le nom hébreu est au singulier, mais peut être compris ici dans un sens collectif : des oiseaux charognards.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: descendirent
  rationale: Le verbe ירד exprime un mouvement vers le bas. Avec le collectif « les oiseaux de proie », le pluriel français est naturel.
- source_word: הָעַיִט
  choice: les oiseaux de proie
  rationale: עַיִט est morphologiquement singulier, mais peut avoir ici un sens collectif. Cette traduction évite la précision excessive de « vautours » tout en convenant à des oiseaux qui viennent sur des carcasses.
- source_word: הַפְּגָרִים
  choice: les carcasses
  rationale: פֶּגֶר désigne un cadavre ou une carcasse. Dans le contexte des animaux abattus, « carcasses » est précis et naturel.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: les chassa
  rationale: Le hiphil de שוב signifie ici faire retourner ou éloigner. « Les chassa » rend clairement et sobrement l'action d'Abram.
- source_word: אַבְרָם
  choice: Abram
  rationale: Le nom est conservé sous la forme Abram, conformément à ce stade du récit.
