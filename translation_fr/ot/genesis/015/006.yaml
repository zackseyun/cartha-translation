  text: וְ/הֶאֱמִ֖ן בַּֽ/יהוָ֑ה וַ/יַּחְשְׁבֶ֥/הָ לּ֖/וֹ צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: fr
  text: Il eut foi dans le SEIGNEUR[a], et le SEIGNEUR compta cela pour lui comme justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il fit confiance au SEIGNEUR. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est généralement compris ainsi : le SEIGNEUR compta la foi d’Abram comme justice. Une lecture moins probable prend Abram pour sujet de « compta ». On peut aussi traduire : « le SEIGNEUR le lui imputa comme justice » ou « le SEIGNEUR le porta à son compte comme justice ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: Il mit sa foi
  rationale: Le hiphil de אמן avec ב exprime ici le fait de croire en quelqu’un ou de lui faire confiance. « Mit sa foi » est naturel en français et conserve la portée relationnelle du verbe.
- source_word: בַּיהוָה
  choice: dans le SEIGNEUR
  rationale: La préposition ב marque l’objet de la foi ou de la confiance. Le tétragramme est rendu selon la convention française courante par « le SEIGNEUR ».
- source_word: וַיַּחְשְׁבֶהָ
  choice: qui la lui compta
  rationale: חשב signifie ici compter, tenir pour ou porter au compte de quelqu’un. Le pronom féminin « la » reprend naturellement « sa foi » en français, tandis que la relative explicite sans lourdeur le sujet le plus probable, le SEIGNEUR.
- source_word: לּוֹ
  choice: lui
  rationale: Le pronom avec ל désigne la personne au compte de laquelle la chose est portée.
- source_word: צְדָקָה
  choice: comme justice
  rationale: צדקה désigne ici la justice, au sens de qualité ou statut conforme à ce qui est juste. « Justice » est le terme biblique français traditionnel et conserve les échos intertextuels du verset.
theological_decisions:
- issue: Sujet de « compta »
  choice: 'Le SEIGNEUR est le sujet : il compta la foi d’Abram comme justice.'
  alternative: Abram serait le sujet et tiendrait le SEIGNEUR, ou cela, pour justice.
  rationale: La lecture où le SEIGNEUR est sujet convient le mieux au contexte et à la réception biblique ultérieure. Comme l’hébreu n’explicite pas de nouveau le sujet, l’autre analyse reste signalée en note.
- issue: Référent du suffixe féminin dans וַיַּחְשְׁבֶהָ
  choice: Il renvoie à l’acte de croire, exprimé en français par « sa foi » puis repris par « la ».
  alternative: Il peut viser plus largement la réponse confiante d’Abram; une traduction par « cela » laisserait davantage le référent ouvert.
  rationale: L’hébreu peut employer le suffixe féminin pour reprendre abstraitement l’action précédente. La formulation française rend cette reprise clairement sans développer une doctrine au-delà du texte.
translation_notes:
  register: Français moderne, digne et accessible. « Mettre sa foi dans » rend l’idée de confiance tout en préservant les échos théologiques du passage. La relative « qui la lui compta » évite l’ambiguïté pronominale peu naturelle en français, tandis qu’une note conserve l’alternative syntaxique de l’hébreu.
