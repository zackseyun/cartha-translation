  terminology: « Justice » est un rendu français bibliquement établi et recevable pour צְדָקָה dans ce contexte. « SEIGNEUR » conserve la convention du projet pour le tétragramme. Le pronom neutre « cela » évite de présenter « la foi » comme un nom explicitement présent dans l’hébreu.
