id: GEN.15.1
reference: Genesis 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: fr
  text: 'Après ces événements, la parole de Yahweh fut adressée à Abram dans une vision : « N’aie pas peur, Abram. Je suis un bouclier pour toi ; ta récompense sera très grande[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je suis ton bouclier, ta très grande récompense. »'
    reason: La construction hébraïque permet aussi de comprendre « ta très grande récompense » comme une seconde désignation de celui qui parle, plutôt que comme une promesse distincte.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: Dans cette formule temporelle, דְּבָרִים renvoie largement aux faits racontés précédemment. « Événements » est naturel en français et évite de suggérer qu’il s’agit seulement de paroles.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: Cette formulation conserve l’expression hébraïque caractéristique d’une révélation divine et rend directement le nom divin.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: fut adressée à Abram
  rationale: Littéralement, la parole « fut vers » Abram. La tournure française choisie exprime naturellement la communication révélée sans donner à entendre un déplacement physique.
- source_word: בַּמַּחֲזֶה
  choice: dans une vision
  rationale: Le nom désigne ici une révélation visionnaire ; l’article hébreu se rend idiomatiquement par l’indéfini en français.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Cette défense directe est claire, actuelle et naturelle en français moderne, tout en conservant sa force rassurante.
- source_word: מָגֵן לָךְ
  choice: un bouclier pour toi
  rationale: L’hébreu dit littéralement « un bouclier pour toi », sans suffixe possessif sur « bouclier ». Cette formulation naturelle préserve cette structure.
- source_word: שְׂכָרְךָ
  choice: ta récompense
  rationale: Le terme peut désigner un salaire, une rétribution ou une récompense. Dans cette promesse, « récompense » garde la portée générale du mot.
- source_word: הַרְבֵּה מְאֹד
  choice: sera très grande
  rationale: La proposition hébraïque est elliptique. Le futur explicite en français la portée promissive du contexte, tandis que « très grande » rend l’intensification sans lourdeur.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Rapport syntaxique entre מָגֵן לָךְ et שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: Je suis un bouclier pour toi ; ta récompense sera très grande.
  alternative: Je suis ton bouclier, ta très grande récompense.
  rationale: La lecture principale comprend deux affirmations et respecte étroitement לָךְ, « pour toi ». Une lecture ancienne et théologiquement significative fait cependant de Dieu lui-même la récompense ; elle est conservée en note plutôt qu’écartée.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué ; le discours direct reste courant et chaleureux. Le marqueur [a] est placé après la proposition concernée par l’ambiguïté.
