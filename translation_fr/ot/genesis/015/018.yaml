language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: fr
  text: 'Ce jour-là, Yahweh conclut une alliance avec Abram[a] en disant : « À ta descendance, j’ai donné ce pays, depuis le fleuve d’Égypte[b] jusqu’au grand fleuve, l’Euphrate. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « coupa une alliance », expression qui signifie « conclure une alliance » et qui renvoie probablement au rite d’alliance impliquant le partage d’animaux dans le contexte immédiat.
    reason: lexical_alternative
  - marker: b
    text: Ou « le torrent d’Égypte » ou « l’oued d’Égypte ». L’hébreu dit « le fleuve d’Égypte », mais l’identification géographique précise est discutée.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Expression temporelle naturelle en français moderne, désignant une occasion précise.
- source_word: כָּרַת ... בְּרִית
  choice: conclut une alliance
  rationale: Rend naturellement l’idiome hébreu signifiant littéralement « couper une alliance », tout en conservant ce sens littéral en note en raison du rite décrit dans le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶת אַבְרָם
  choice: avec Abram
  rationale: Le français exprime idiomatiquement la relation établie par l’alliance au moyen de « avec ».
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule française courante introduisant les paroles constitutives de l’alliance.
- source_word: לְזַרְעֲךָ
  choice: À ta descendance
  rationale: « Descendance » rend le nom collectif singulier זֶרַע de manière naturelle et inclusive, sans imposer ici une lecture exclusivement individuelle.
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Le passé composé conserve la forme accomplie de l’hébreu et la certitude solennelle du don déclaré, sans la convertir silencieusement en simple futur.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Dans cette promesse territoriale, « pays » est plus naturel que « terre » et désigne clairement le territoire promis.
- source_word: מִנְּהַר מִצְרַיִם
  choice: depuis le fleuve d’Égypte
  rationale: נָהָר signifie normalement « fleuve » ou « rivière » ; le texte principal garde ce sens direct, tandis qu’une note signale l’identification géographique discutée.
- source_word: עַד הַנָּהָר הַגָּדֹל
  choice: jusqu’au grand fleuve
  rationale: « Jusqu’à » exprime clairement la limite territoriale marquée par עַד.
- source_word: נְהַר פְּרָת
  choice: l’Euphrate
  rationale: Désignation française usuelle, placée en apposition à « grand fleuve ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Valeur aspectuelle de נָתַתִּי dans la déclaration d’alliance
  choice: j’ai donné
  alternative: je donne ; je donnerai
  rationale: La forme accomplie présente le don comme établi et certain. Le passé composé conserve cette tension sans transformer explicitement la déclaration en promesse future.
- issue: Portée de זֶרַע
  choice: ta descendance
  alternative: ta postérité ; ta semence
  rationale: Le terme hébreu est un collectif singulier pouvant viser la lignée issue d’Abram. « Descendance » préserve cette portée collective sans exclure les résonances ultérieures du singulier.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe demeure solennelle sans archaïsmes. Les notes préservent l’idiome hébreu de l’alliance et l’incertitude géographique.
