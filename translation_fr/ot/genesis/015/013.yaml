base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: fr
  text: 'Alors il dit à Abram : « Sache avec certitude que tes descendants séjourneront comme étrangers[a] dans un pays qui ne sera pas le leur ; on les asservira[b] et on les maltraitera pendant quatre cents ans. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « étrangers » ou « résidents venus d’ailleurs ». Le terme hébreu désigne une personne qui réside dans un pays qui n’est pas le sien.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « on les fera servir ». Le sujet des verbes hébreux n’est pas exprimé ; le contexte suggère les habitants du pays étranger.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: Il dit à Abram
  rationale: Le wayyiqtol fait avancer le récit. Le passé simple convient au registre narratif français et le référent du sujet demeure fourni par le contexte.
- source_word: יָדֹעַ תֵּדַע
  choice: Sache avec certitude
  rationale: L’infinitif absolu suivi de l’imparfait intensifie le verbe ידע. Cette formulation naturelle restitue l’insistance de l’hébreu.
- source_word: גֵר יִהְיֶה זַרְעֲךָ
  choice: tes descendants séjourneront comme étrangers
  rationale: זֶרַע est un collectif désignant ici la postérité d’Abram. Le pluriel « descendants » est naturel en français, tandis que « séjourneront comme étrangers » exprime la résidence en terre étrangère impliquée par גֵר.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: dans un pays qui ne sera pas le leur
  rationale: La formulation rend directement l’idée de non-possession et d’appartenance étrangère sans préciser l’identité du pays.
- source_word: וַעֲבָדוּם
  choice: on les asservira
  rationale: Le verbe עבד à cette forme peut signifier faire servir ou soumettre au travail servile. L’indéfini « on » évite en français une ambiguïté pronominale trompeuse tout en ne nommant pas des oppresseurs que le verset n’identifie pas explicitement.
- source_word: וְעִנּוּ אֹתָם
  choice: et on les maltraitera
  rationale: Au piel, ענה exprime l’affliction, l’oppression ou les mauvais traitements. « Maltraitera » est clair, courant et suffisamment large.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: pendant quatre cents ans
  rationale: Le français exige naturellement une préposition pour indiquer la durée, bien que l’hébreu place simplement le groupe temporel en fin de proposition.
theological_decisions:
- issue: Référent du sujet pluriel de וַעֲבָדוּם וְעִנּוּ אֹתָם
  choice: Sujet indéfini rendu par « on », les descendants étant l’objet
  alternative: « Ils les asserviront et les maltraiteront », où « ils » renverrait aux habitants du pays étranger
  rationale: Les verbes hébreux ont un sujet pluriel non exprimé et des suffixes objets pluriels. Le contexte suggère les habitants du pays comme agents, mais le texte ne les nomme pas dans ce verset. « On » conserve cette indétermination tout en empêchant de comprendre à tort que les descendants s’asserviraient eux-mêmes.
- issue: Portée des quatre cents ans
  choice: La durée est laissée en fin de la proposition sur l’asservissement et les mauvais traitements
  alternative: Présenter explicitement les quatre cents ans comme la durée totale du séjour en terre étrangère
  rationale: La syntaxe place « quatre cents ans » après les deux verbes sans expliciter davantage sa portée. La traduction conserve cette tension au lieu d’imposer une harmonisation chronologique.
translation_notes:
  register: Français international moderne, narratif et digne. « Sache avec certitude » maintient l’emphase solennelle sans archaïsme ; « séjourneront comme étrangers » et « asservira » restent accessibles tout en conservant la portée historique et sociale du texte.
