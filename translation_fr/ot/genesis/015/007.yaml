  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אֲנִ֣י יְהוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֨י/ךָ֙ מֵ/א֣וּר כַּשְׂדִּ֔ים לָ֧/תֶת לְ/ךָ֛ אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: fr
  text: 'Il lui dit : « Je suis Yahweh, qui t’a fait sortir d’Our des Chaldéens pour te donner ce pays afin que tu en prennes possession[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que tu en hérites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Il lui dit
  rationale: Le wayyiqtol fait progresser le récit et se rend naturellement au passé simple dans ce registre narratif; אֵלָיו indique le destinataire.
- source_word: אֲנִי יְהוָה
  choice: Je suis Yahweh
  rationale: La proposition nominale hébraïque appelle la copule « suis » en français; le nom divin est translittéré « Yahweh ».
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: moi qui t’ai fait sortir
  rationale: La tournure « moi qui » maintient le locuteur à la première personne et rend naturellement le relatif אֲשֶׁר; le hiphil de יצא exprime le fait de faire sortir.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: d’Our des Chaldéens
  rationale: Rendu français traditionnel et transparent du nom de lieu suivi de sa désignation géographique ou ethnique.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: pour te donner ce pays
  rationale: L’infinitif avec ל exprime ici le but; הָאָרֶץ désigne dans ce contexte le territoire montré et promis à Abram.
- source_word: לְרִשְׁתָּהּ
  choice: afin que tu en prennes possession
  rationale: ירשׁ peut exprimer l’héritage ou la prise de possession. Cette formulation française conserve ici l’idée de recevoir et posséder le pays sans imposer exclusivement la nuance successorale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le caractère de nom propre de l’appellation divine.
- issue: Portée de ירשׁ concernant le pays promis
  choice: prendre possession
  alternative: hériter
  rationale: Le contexte affirme que Dieu donne le pays à Abram, mais le verbe peut évoquer aussi bien l’entrée en possession que l’héritage. Le texte principal retient l’expression française la plus large, et la note conserve l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « moi qui » évite une construction relative maladroite après « Je suis Yahweh » et conserve la perspective à la première personne. « Pays » est plus naturel ici que « terre » pour un territoire promis.
