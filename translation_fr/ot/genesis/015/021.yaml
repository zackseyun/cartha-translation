  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: fr
  text: les Amorites, les Cananéens, les Guirgasiens et les Jébusites.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: et
  rationale: וְ poursuit l’énumération, tandis que אֶת marque chaque complément d’objet direct défini. En français, ce marqueur n’a pas d’équivalent exprimé; la coordination est rendue naturellement par « et » devant le dernier élément.
- source_word: הָאֱמֹרִי
  choice: les Amorites
  rationale: Le singulier morphologique hébreu est un ethnonyme collectif; le pluriel français désigne naturellement ce peuple.
- source_word: הַכְּנַעֲנִי
  choice: les Cananéens
  rationale: Le singulier collectif hébreu est rendu par le nom de peuple français usuel au pluriel.
- source_word: הַגִּרְגָּשִׁי
  choice: les Guirgasiens
  rationale: Le singulier collectif hébreu est rendu par l’ethnonyme français traditionnel au pluriel.
- source_word: הַיְבוּסִי
  choice: les Jébusites
  rationale: Le singulier collectif hébreu est rendu par le nom de peuple français usuel au pluriel.
