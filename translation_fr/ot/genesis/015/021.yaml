  register: Formulation sobre et digne, conforme à une énumération en français moderne. L’article défini est répété devant chaque peuple, mais « et » n’apparaît que devant le dernier élément selon l’usage français naturel. Le verset poursuit grammaticalement la liste commencée au verset précédent.
