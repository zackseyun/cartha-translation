reference: Genesis 15:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ לָ/ב֔וֹא וְ/תַרְדֵּמָ֖ה נָפְלָ֣ה עַל אַבְרָ֑ם וְ/הִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: fr
  text: Au moment où le soleil allait se coucher, un profond sommeil[a] tomba sur Abram. Et voici qu’une grande et sombre terreur[b] s’abattait sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une transe ». Le terme hébreu peut désigner un sommeil exceptionnellement profond, peut-être provoqué par Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « une grande terreur des ténèbres » ou « une grande terreur obscure ». L’hébreu associe de manière très condensée les idées de terreur et d’obscurité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: Au moment où le soleil allait se coucher
  rationale: La construction introduit la scène et situe l’action à l’approche du coucher du soleil. Cette formulation rend naturellement en français la valeur temporelle et progressive de l’hébreu, sans ajouter un « maintenant » absent du texte.
- source_word: תַרְדֵּמָה
  choice: un profond sommeil
  rationale: Le nom désigne un sommeil particulièrement lourd, parfois provoqué par Dieu. « Profond sommeil » est le sens lexical le plus direct; « transe » serait plus interprétatif.
- source_word: נָפְלָה עַל אַבְרָם
  choice: tomba sur Abram
  rationale: Cette tournure conserve l’image hébraïque de quelque chose qui tombe sur une personne, tout en gardant un registre narratif digne.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Cette expression attire vivement l’attention sur ce qui suit et restitue la force dramatique de הִנֵּה dans un français biblique actuel.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: une grande et sombre terreur
  rationale: La formulation garde ensemble les idées de terreur, d’obscurité et d’intensité sans imposer une seule analyse syntaxique à l’expression hébraïque condensée.
- source_word: נֹפֶלֶת עָלָיו
  choice: s’abattait sur lui
  rationale: L’imparfait restitue la valeur vivante ou progressive du participe hébreu; « s’abattait » conserve l’image de la chute tout en étant idiomatique en français.
- source_word: אַבְרָם
  choice: Abram
  rationale: Le nom propre suit sa forme française biblique usuelle à ce stade du récit.
theological_decisions:
- issue: Nature de תַרְדֵּמָה dans ce contexte de révélation
  choice: un profond sommeil
  alternative: une transe
  rationale: Le contexte peut suggérer un état surnaturellement provoqué, mais le nom hébreu désigne d’abord un sommeil profond. La traduction principale ne tranche donc pas au-delà du lexème; l’autre possibilité est signalée en note.
- issue: Rapport entre la terreur et l’obscurité dans אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: une grande et sombre terreur
  alternative: une grande terreur des ténèbres
  rationale: L’hébreu juxtapose de façon dense la terreur, l’obscurité et la grandeur. La traduction choisie préserve cette association imagée sans déterminer que les ténèbres sont nécessairement la cause ou l’objet de la terreur.
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici que » maintient la vivacité narrative sans archaïsme excessif. L’alternance entre « tomba » et « s’abattait » reflète la différence d’aspect entre le verbe accompli et le participe hébreux.
