base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: fr
  text: Quant à toi, tu rejoindras tes pères[a] dans la paix ; tu seras enterré dans une belle vieillesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes ancêtres ». L’hébreu dit littéralement « tes pères », formule qui évoque la mort et le fait de rejoindre les générations précédentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Quant à toi
  rationale: La conjonction suivie du pronom indépendant signale un changement de thème et un contraste avec la descendance d’Abram évoquée auparavant.
- source_word: תָּב֥וֹא
  choice: tu rejoindras
  rationale: Avec « tes pères », le verbe de mouvement appartient ici à une formule évoquant la mort. « Rejoindre » rend naturellement cette relation en français sans préciser davantage l’état après la mort.
- source_word: אֶל אֲבֹתֶיךָ
  choice: tes pères
  rationale: Cette traduction conserve l’image familiale littérale de l’hébreu et sa formule traditionnelle, tandis qu’une note indique l’équivalent plus explicite « tes ancêtres ».
- source_word: בְּשָׁלוֹם
  choice: dans la paix
  rationale: Cette formulation garde l’étendue de שָׁלוֹם — paix, intégrité et bien-être — et convient au contexte d’une mort paisible.
- source_word: תִּקָּבֵר
  choice: tu seras enterré
  rationale: Le nifal de קבר exprime simplement l’action passive d’être mis au tombeau ; « enterré » est courant et clair.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: à un âge avancé, après une belle vieillesse
  rationale: L’expression associe les cheveux gris ou la vieillesse à une appréciation positive. Cette formulation française naturelle exprime à la fois l’âge avancé et le caractère heureux ou accompli de cette vieillesse.
theological_decisions:
- issue: Sens de « rejoindre tes pères »
  choice: Conserver une formule désignant la mort et le fait de rejoindre les générations précédentes, sans définir précisément l’au-delà.
  alternative: Comprendre l’expression comme une référence concrète à l’ensevelissement auprès des ancêtres, ou comme l’affirmation explicite d’une communion consciente avec eux après la mort.
  rationale: Abram ne sera pas enterré avec ses pères immédiats ; la formule dépasse donc la seule sépulture familiale. Toutefois, le verset ne développe pas une doctrine précise de l’état après la mort. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Quant à toi » marque le changement de thème. La formulation évite un tour archaïque tout en conservant l’image hébraïque des « pères » et son ambiguïté théologique.
