id: GEN.15.16
reference: Genesis 15:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: fr
  text: À la quatrième génération, ils reviendront ici, car la faute des Amorites[a] n’a pas encore atteint sa pleine mesure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « de l’Amorite »; le singulier désigne collectivement le peuple amorite.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « jusqu’ici ». Dans ce contexte, l’expression signifie que leur faute n’a pas encore atteint sa pleine mesure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/ד֥וֹר רְבִיעִ֖י
  choice: À la quatrième génération
  rationale: דּוֹר désigne une « génération » et רְבִיעִי est l’adjectif ordinal « quatrième ». En français, la tournure temporelle avec « à » exprime naturellement le moment du retour; la conjonction initiale n’a pas besoin d’être rendue séparément dans ce verset isolé.
- source_word: יָשׁ֣וּבוּ
  choice: ils reviendront
  rationale: Le verbe שׁוּב exprime ici un retour vers le pays évoqué. « Reviendront » conserve à la fois le mouvement et la valeur future.
- source_word: הֵ֑נָּה
  choice: ici
  rationale: Cet adverbe déictique indique le lieu vers lequel s’effectuera le retour. « Ici » est direct et naturel.
- source_word: כִּ֧י
  choice: car
  rationale: La conjonction introduit la raison du délai. « Car » en garde clairement la fonction explicative dans un registre digne.
- source_word: לֹא שָׁלֵ֛ם
  choice: n’a pas encore atteint sa pleine mesure
  rationale: שָׁלֵם exprime ici ce qui est complet ou arrivé à son plein degré. Cette formulation française rend naturellement l’image d’une mesure qui n’est pas encore pleine.
- source_word: עֲוֺ֥ן
  choice: faute
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. Dans ce contexte, « faute » exprime le mal moral sans imposer le sens plus étroit de culpabilité subjective ou de châtiment.
- source_word: הָ/אֱמֹרִ֖י
  choice: des Amorites
  rationale: La forme hébraïque est morphologiquement singulière, mais l’ethnonyme peut avoir une valeur collective. Le pluriel est la manière naturelle de désigner ce peuple en français.
- source_word: עַד הֵֽנָּה
  choice: encore
  rationale: Littéralement « jusqu’ici », l’expression fixe une limite non encore atteinte. Son sens temporel est intégré naturellement à « n’a pas encore atteint », tandis que la formulation littérale est signalée en note.
theological_decisions:
- issue: Le délai du retour et le jugement des Amorites
  choice: Le retour est présenté comme différé parce que la faute des Amorites n’a pas encore atteint sa pleine mesure.
  alternative: Préciser que le délai manifeste avant tout la patience de Dieu envers les Amorites, ou qu’il sert principalement à former Israël en Égypte.
  rationale: Le texte relie explicitement le calendrier du retour à la faute des Amorites, sans exposer une théorie plus générale de la providence. La traduction conserve cette relation et la tension qu’elle implique sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international actuel, clair et digne. « Faute » est plus immédiatement compréhensible qu’« iniquité », tandis que « atteindre sa pleine mesure » préserve l’idée hébraïque d’un mal qui n’est pas encore complet.
