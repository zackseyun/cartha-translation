  terminology: « Amorites » est la forme française habituelle de l’ethnonyme. « Faute » est un rendu moderne possible de עָוֹן dans ce contexte moral; il reste suffisamment général pour ne pas trancher entre faute, culpabilité et ses conséquences. La note a signale correctement le singulier collectif hébreu, et la note b préserve utilement le littéral « jusqu’ici ».
