  source_fidelity: 'Le texte rend fidèlement la structure et le sens de l’hébreu : le retour à la quatrième génération, le repère déictique « ici », et la raison donnée, à savoir que la faute des Amorites n’est pas encore parvenue à son plein accomplissement. « N’a pas encore atteint sa pleine mesure » exprime de façon idiomatique la valeur de לֹא שָׁלֵם … עַד הֵנָּה, sans imposer une interprétation doctrinale supplémentaire.'
