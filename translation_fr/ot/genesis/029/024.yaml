  text: וַ/יִּתֵּ֤ן לָבָן֙ לָ֔/הּ אֶת זִלְפָּ֖ה שִׁפְחָת֑/וֹ לְ/לֵאָ֥ה בִתּ֖/וֹ שִׁפְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/024.yaml
  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: fr
  text: Laban donna Zilpa, sa servante, à sa fille Léa pour être sa servante[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclave » ; le terme hébreu désigne une femme de condition dépendante, probablement asservie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן signifie ici simplement « donner ». « Donna » convient au récit et conserve la dimension de transfert sans ajouter d’interprétation.
- source_word: לָהּ ... לְלֵאָה בִתּוֹ
  choice: à sa fille Léa
  rationale: Le pronom « à elle » est explicité par l’apposition qui suit dans l’hébreu, « à Léa, sa fille ». L’ordre français retenu identifie clairement la destinataire.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Le nom propre est transcrit selon sa forme française usuelle.
- source_word: שִׁפְחָתוֹ
  choice: sa servante
  rationale: שִׁפְחָה désigne une femme de condition dépendante, probablement asservie. « Servante » est naturel en français moderne tout en laissant une note préciser la portée sociale du terme.
- source_word: שִׁפְחָה
  choice: pour être sa servante
  rationale: Le dernier substantif indique la fonction dans laquelle Zilpa est donnée. Cette formulation française naturelle préserve cette attribution de rôle sans alourdir la phrase.
