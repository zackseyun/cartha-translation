  source_fidelity: La proposition de Jacob porte sur sept années de service rendues à Laban « pour/en échange de Rachel ». Le projet d’épouser Rachel est implicite dans le contexte, mais אינו exprimé par le verset lui-même; « afin d’épouser » ajoute donc une explicitation interprétative évitable.
  naturalness: « Je travaillerai sept ans pour toi, en échange de Rachel » est idiomatique dans le cadre d’une négociation matrimoniale antique. La formulation conserve une dignité narrative moderne sans euphémiser ni surinterpréter le texte.
  terminology: « Fille cadette » rend précisément הַקְּטַנָּה dans le contraste familial. « Travailler ... en échange de » communique à la fois le service/labeur (עבד) et la valeur d’échange de בְּ dans ce contexte.
