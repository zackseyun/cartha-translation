base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: fr
  text: 'Jacob aimait Rachel[a]. Il dit : « Je travaillerai sept ans pour toi, en échange de Rachel, ta fille cadette. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Et Jacob aimait Rachel. » La conjonction initiale poursuit simplement le récit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: aimait
  rationale: Le verbe אָהַב exprime directement l’amour. L’imparfait français décrit naturellement le sentiment durable de Jacob dans ce récit, sans ajouter la nuance plus interprétative de « était amoureux de ».
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le verbe courant אמר introduit ici le discours direct; « dit » en est le rendu simple et précis.
- source_word: אֶעֱבָדְךָ
  choice: Je travaillerai sept ans pour toi
  rationale: Dans ce contexte, עבד désigne le travail accompli au service de Laban. « Travailler pour toi » est plus naturel en français moderne que « te servir » et conserve le sens concret de la proposition.
- source_word: שֶׁבַע שָׁנִים
  choice: sept ans
  rationale: Rendu direct et non ambigu du nombre et du nom.
- source_word: בְּרָחֵל
  choice: afin d’épouser Rachel
  rationale: La préposition בְּ marque ici ce en vue de quoi Jacob offre son travail. Le contexte matrimonial rend explicite en français ce que « pour Rachel » pourrait laisser obscur ou faire paraître transactionnel.
- source_word: בִּתְּךָ
  choice: ta fille
  rationale: Rendu direct de la forme construite munie du suffixe masculin singulier de deuxième personne.
- source_word: הַקְּטַנָּה
  choice: cadette
  rationale: L’adjectif signifie littéralement « petite », mais, dans la comparaison familiale avec Léa, il désigne naturellement la fille plus jeune; « cadette » est idiomatique et précis.
- source_word: וַ
  choice: enchaînement sans conjonction explicite
  rationale: Le waw narratif poursuit le récit. En français moderne, la continuité est naturelle sans « et » au début de la phrase; la note signale le rendu plus formel.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Travailler pour toi » évite la possible connotation domestique de « te servir », tandis que « afin d’épouser » rend clairement la finalité matrimoniale portée par le contexte.
