    issue: « afin d’épouser Rachel » explicite un élément absent de la formulation hébraïque.
    rationale: Le texte dit littéralement que Jacob servira sept ans « pour Rachel », la préposition marquant ici la contrepartie de son service. Même si le contexte établit qu’il s’agit du mariage, la traduction doit conserver cette expression plutôt que transformer la contrepartie en finalité explicitement formulée.
