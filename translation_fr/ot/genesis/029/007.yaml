  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: fr
  text: 'Alors il dit : « Voyez, il fait encore grand jour[a] ; ce n’est pas le moment de rassembler le bétail. Abreuvez le troupeau[b], puis allez le faire paître. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le jour est encore grand ». Cette expression signifie qu’il reste encore beaucoup de temps avant la fin de la journée.'
    reason: lexical_alternative
  - marker: b
    text: « Le bétail » traduit un terme collectif général pour les animaux domestiques d’élevage, tandis que « le troupeau » traduit un terme désignant plus précisément le petit bétail, comme les moutons et les chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: L’interjection attire l’attention des interlocuteurs. « Voyez » conserve cette fonction dans un français actuel et digne.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: il fait encore grand jour
  rationale: L’expression hébraïque signifie littéralement que « le jour est encore grand/long » et indique qu’il reste beaucoup de lumière ou de temps dans la journée. L’expression française choisie rend naturellement cet idiome.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: ce n’est pas le moment de rassembler le bétail
  rationale: עֵת désigne le moment approprié, הֵאָסֵף exprime le rassemblement, et מִקְנֶה est un collectif général pour les animaux domestiques d’élevage.
- source_word: הַשְׁקוּ
  choice: Abreuvez
  rationale: L’impératif causatif signifie donner à boire. « Abreuvez » est précis et naturel pour des animaux.
- source_word: הַצֹּאן
  choice: le troupeau
  rationale: צֹאן désigne collectivement le petit bétail, notamment les moutons et les chèvres. « Le troupeau » maintient cette portée sans la limiter aux seuls moutons.
- source_word: וּלְכוּ רְעוּ
  choice: puis allez le faire paître
  rationale: La formulation rend la succession des impératifs et le sens de רעה, conduire ou laisser les animaux paître.
