  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: fr
  text: Jacob travailla sept ans pour Rachel, et ils ne lui parurent que quelques jours, tant il l’aimait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: travailla
  rationale: Le verbe עבד peut signifier « servir » ou « travailler ». Dans ce contexte, il désigne le travail fourni par Jacob selon l’accord conclu pour épouser Rachel. « Travailla » est naturel en français moderne et exprime clairement ce labeur sans suggérer que Rachel elle-même serait sa maîtresse.
- source_word: בְּרָחֵל
  choice: pour Rachel
  rationale: La préposition ב indique ici que le service est accompli en vue d’obtenir Rachel en mariage. « Pour Rachel » conserve la concision et l’ambiguïté relationnelle de l’hébreu sans développer en « en échange de Rachel ».
- source_word: שֶׁבַע שָׁנִים
  choice: sept ans
  rationale: Rendu direct de l’expression numérique hébraïque.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: ils ne lui parurent
  rationale: Littéralement, les sept ans « furent à ses yeux ». Le verbe « paraître » restitue naturellement en français cette perception subjective; la négation appartient à la tournure française « ne… que ».
- source_word: כְּיָמִים אֲחָדִים
  choice: que quelques jours
  rationale: L’expression signifie littéralement « comme quelques jours ». La construction française « ne… que quelques jours » rend clairement l’impression de brièveté sans ajouter l’adverbe « seulement ».
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: tant il l’aimait
  rationale: Le syntagme signifie « à cause de son amour pour elle ». La tournure causale « tant il l’aimait » est actuelle, concise et conserve la force affective du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la simplicité narrative et le contraste entre la durée objective de sept ans et sa brièveté dans la perception de Jacob.
