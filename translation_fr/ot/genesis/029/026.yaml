  text: וַ/יֹּ֣אמֶר לָבָ֔ן לֹא יֵעָשֶׂ֥ה כֵ֖ן בִּ/מְקוֹמֵ֑/נוּ לָ/תֵ֥ת הַ/צְּעִירָ֖ה לִ/פְנֵ֥י הַ/בְּכִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: fr
  text: 'Laban dit : « Chez nous, cela ne se fait pas de donner la plus jeune avant l’aînée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la première-née ». Le mot hébreu souligne le rang lié à l’ordre de naissance. « Donner » signifie ici donner en mariage, ce que l’hébreu laisse implicite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: répondit
  rationale: Dans cet échange avec Jacob, אמר introduit la réplique de Laban. « Répondit » rend naturellement la fonction discursive sans modifier le contenu.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: cela ne se fait pas
  rationale: La tournure impersonnelle française exprime clairement une coutume sociale, comme le nifal de עשה accompagné de כֵן.
- source_word: בִּמְקוֹמֵנוּ
  choice: chez nous
  rationale: Littéralement « dans notre lieu »; dans ce contexte, l’expression désigne l’usage de la communauté locale. « Chez nous » est naturel et reste suffisamment ouvert quant à l’étendue géographique.
- source_word: לָתֵת
  choice: donner
  rationale: Le texte hébreu dit simplement « donner »; le contexte indique qu’il s’agit de donner une fille en mariage, sans que cette précision soit explicitée.
- source_word: הַצְּעִירָה
  choice: la plus jeune
  rationale: L’adjectif féminin substantivé désigne la fille la plus jeune. Cette formulation française est naturelle et conserve la comparaison d’âge.
- source_word: לִפְנֵי
  choice: avant
  rationale: Ici, לִפְנֵי indique une priorité dans l’ordre, rendue directement par « avant ».
- source_word: הַבְּכִירָה
  choice: l’aînée
  rationale: Le féminin בְּכִירָה désigne celle qui a le rang de première-née. « L’aînée » est idiomatique en français et maintient l’opposition avec « la plus jeune ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formule « chez nous, cela ne se fait pas » rend idiomatiquement l’appel de Laban à la coutume locale, tandis que « donner » conserve l’implicite de l’hébreu.
