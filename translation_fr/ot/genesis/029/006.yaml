  yaml_path: translation/ot/genesis/029/006.yaml
  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: fr
  text: 'Il leur demanda : « Va-t-il bien[a] ? » Ils répondirent : « Il va bien. Voici Rachel, sa fille, qui arrive avec le troupeau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout va-t-il bien pour lui ? » Le mot hébreu shalom désigne ici le bien-être d’une personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: Va-t-il bien ?
  rationale: L’expression demande si Laban se porte bien. Cette formulation est naturelle en français moderne et rend ici la valeur de bien-être de שָׁלוֹם.
- source_word: שָׁלוֹם
  choice: Il va bien
  rationale: La réponse reprend elliptiquement le terme de la question et confirme que Laban se porte bien.
- source_word: וְהִנֵּה
  choice: Regarde
  rationale: הִנֵּה attire l’attention sur Rachel, visible au moment où ils parlent. « Regarde » en conserve la force déictique dans un français courant.
- source_word: רָחֵל
  choice: Rachel
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: בִּתּוֹ
  choice: sa fille
  rationale: Le suffixe renvoie à Laban, dont les interlocuteurs viennent de parler.
- source_word: בָּאָה
  choice: arrive
  rationale: La forme décrit une action en cours dans la scène présente; « arrive » est idiomatique après l’appel à regarder.
- source_word: עִם הַצֹּאן
  choice: avec le troupeau
  rationale: צֹאן désigne collectivement le petit bétail, potentiellement des moutons et des chèvres; « troupeau » évite de restreindre indûment le sens aux seuls moutons.
