  source_fidelity: 'Le sens est fidèlement rendu : la question et la réponse portent sur le bien-être de Laban, et Rachel est présentée comme sa fille arrivant avec le troupeau. Toutefois, « Regarde » est au singulier alors que Jacob s’adresse à plusieurs personnes, et son impératif introduit une discordance absente de l’hébreu.'
