  text: וּ/לְ/לָבָ֖ן שְׁתֵּ֣י בָנ֑וֹת שֵׁ֤ם הַ/גְּדֹלָה֙ לֵאָ֔ה וְ/שֵׁ֥ם הַ/קְּטַנָּ֖ה רָחֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: fr
  text: 'Laban avait deux filles[a] : l’aînée s’appelait Léa, et la plus jeune s’appelait Rachel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « À Laban [étaient] deux filles », tournure qui signifie « Laban avait deux filles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְלָבָן
  choice: Laban avait
  rationale: La construction hébraïque de possession, littéralement « à Laban [étaient] », signifie naturellement que Laban avait deux filles. Le waw initial assure ici une liaison narrative sans exiger un mot de liaison explicite en français.
- source_word: שְׁתֵּי בָנוֹת
  choice: deux filles
  rationale: Rendu direct et naturel du groupe numéral suivi du nom.
- source_word: שֵׁם הַגְּדֹלָה לֵאָה
  choice: l’aînée s’appelait Léa
  rationale: La formule hébraïque « le nom de la grande était Léa » désigne, entre deux sœurs, la plus âgée. « S’appelait » restitue naturellement en français la formule d’identification par le nom.
- source_word: וְשֵׁם הַקְּטַנָּה רָחֵל
  choice: et la plus jeune Rachel
  rationale: Dans ce contexte familial, קְטַנָּה indique la plus jeune des deux, non une moindre taille. L’ellipse de « s’appelait » est naturelle en français et conserve le parallélisme concis.
- source_word: לֵאָה
  choice: Léa
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: רָחֵל
  choice: Rachel
  rationale: Forme française traditionnelle et courante du nom hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation idiomatique « s’appelait » évite le calque lourd « le nom de… était », tandis que les termes « l’aînée » et « la plus jeune » rendent explicitement la relation d’âge entre les deux sœurs.
