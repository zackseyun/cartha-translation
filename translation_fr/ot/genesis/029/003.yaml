  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: fr
  text: Tous les troupeaux s’y rassemblaient. On roulait alors la pierre pour dégager l’ouverture du puits, on abreuvait le petit bétail, puis on remettait la pierre à sa place sur l’ouverture du puits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: s’y rassemblaient
  rationale: Le niphal à l’imparfait décrit ici une action habituelle dans le cadre narratif; l’imparfait français l’exprime naturellement.
- source_word: כָל הָעֲדָרִים
  choice: tous les troupeaux
  rationale: עֲדָרִים désigne les groupes de bétail conduits au puits; « troupeaux » convient au contexte pastoral sans limiter indûment l’espèce.
- source_word: וְגָלֲלוּ
  choice: on roulait alors
  rationale: Le parfait coordonné poursuit la description de la pratique habituelle. « Rouler » conserve l’image concrète du déplacement de la pierre.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: qui couvrait l’ouverture du puits
  rationale: פִּי הַבְּאֵר signifie littéralement « la bouche du puits », idiome désignant son ouverture; la formulation française explicite naturellement la position de la pierre.
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: on faisait boire le petit bétail
  rationale: Le hiphil de שׁקה signifie « faire boire, abreuver ». צֹאן est un collectif pouvant inclure ovins et caprins; « petit bétail » préserve cette étendue sémantique.
- source_word: וְהֵשִׁיבוּ
  choice: on remettait
  rationale: Le hiphil de שוב exprime le fait de faire revenir quelque chose; pour une pierre, « remettre » est idiomatique.
- source_word: לִמְקֹמָהּ
  choice: à sa place
  rationale: Le syntagme indique le retour de la pierre à son emplacement propre.
- source_word: עַל פִּי הַבְּאֵר
  choice: sur l’ouverture du puits
  rationale: עַל marque ici la position de la pierre sur ou au-dessus de l’ouverture; « sur » est naturel et précis en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait rend la coutume répétée. Le pronom indéfini « on » évite un sujet pluriel ambigu après « tous les troupeaux » et désigne naturellement les bergers, agents implicites des actions.
