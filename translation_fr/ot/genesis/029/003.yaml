revisions:
- from: Tous les troupeaux s’y rassemblaient. On roulait alors la pierre qui couvrait l’ouverture du puits, on faisait boire le petit bétail, puis on remettait la pierre à sa place sur l’ouverture du puits.
  to: Tous les troupeaux s’y rassemblaient. On roulait alors la pierre pour dégager l’ouverture du puits, on abreuvait le petit bétail, puis on remettait la pierre à sa place sur l’ouverture du puits.
  rationale: La révision explicite, sans surinterprétation, que la pierre est déplacée afin de libérer l’ouverture du puits, conformément à מֵעַל. Elle emploie également le verbe pastoral français usuel « abreuver » tout en conservant « petit bétail » pour le collectif צֹאן.
