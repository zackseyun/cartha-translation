  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: fr
  text: Le soir venu, il prit sa fille Léa et l’amena à Jacob, et Jacob s’unit à elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entra auprès d’elle » ; expression hébraïque conventionnelle désignant des relations sexuelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Le soir venu
  rationale: Cette tournure française naturelle exprime le cadre temporel et la progression narrative sans reproduire lourdement la formule hébraïque.
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: il prit sa fille Léa
  rationale: « Prendre » conserve le sens simple de לקח; l’ordre français « sa fille Léa » rend naturellement l’apposition hébraïque.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: l’amena à Jacob
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Le référent du pronom est explicité par « Jacob » pour éviter une ambiguïté peu naturelle en français.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: qui s’unit à elle
  rationale: L’expression hébraïque est un euphémisme conventionnel désignant l’union sexuelle. « S’unir à » reste digne et euphémique tout en étant intelligible en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’euphémisme de l’hébreu sans employer le calque français obscur « entra vers elle » dans le corps du texte.
