  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב אֶל לָבָן֙ הָבָ֣/ה אֶת אִשְׁתִּ֔/י כִּ֥י מָלְא֖וּ יָמָ֑/י וְ/אָב֖וֹאָה אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: fr
  text: 'Alors Jacob dit à Laban : « Donne-moi ma femme, puisque le temps fixé est arrivé à son terme, afin que je m’unisse à elle[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que j’aille vers elle » ; expression hébraïque employée ici pour parler avec pudeur de la consommation du mariage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Donne-moi
  rationale: Cette formule de demande adressée à Laban appelle ici un complément indirect implicite. « Donne-moi » est naturel en français et convient au contexte du mariage convenu.
- source_word: אֶת אִשְׁתִּי
  choice: ma femme
  rationale: אִשָּׁה peut signifier « femme » ou « épouse ». Ici, Rachel est la partenaire promise à Jacob au terme de son service ; « ma femme » conserve la formulation directe de l’hébreu.
- source_word: כִּי מָלְאוּ יָמָי
  choice: puisque le temps fixé est arrivé à son terme
  rationale: Littéralement, « mes jours sont remplis/accomplis ». Dans le contexte, il s’agit de la période de service convenue, non de la fin de la vie de Jacob. Cette formulation rend clairement l’idiome sans ajouter une durée absente du verset.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: afin que je m’unisse à elle
  rationale: בוא אל est ici un euphémisme hébreu désignant la consommation du mariage. « S’unir à elle » en restitue avec pudeur le sens dans un français naturel ; « afin que » rend la valeur volitive et finale de la forme hébraïque.
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et digne. La tournure littérale « mes jours sont accomplis » a été évitée parce qu’elle évoquerait naturellement en français la fin de la vie plutôt que l’achèvement de la période de service convenue.
