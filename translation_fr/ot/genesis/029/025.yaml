revisions:
- from: 'Au matin, voilà que c’était Léa ! Jacob dit à Laban : « Qu’est-ce que tu m’as fait ? N’est-ce pas pour Rachel que j’ai travaillé chez toi ? Alors pourquoi m’as-tu trompé ? »'
  to: 'Au matin, voilà que c’était Léa. Jacob dit à Laban : « Qu’est-ce que vous m’avez fait ? N’est-ce pas pour Rachel que j’ai travaillé pour vous ? Alors pourquoi m’avez-vous trompé ? »'
  rationale: La révision conserve la découverte soudaine, l’accusation et la force interrogative du texte hébreu, tout en remplaçant une formulation spatiale imprécise par une expression française naturelle qui rend le service accompli pour Laban. Elle évite aussi de surinterpréter la surprise par une exclamation.
