translation_notes:
  register: Français moderne, international et digne. L’exclamation après « Léa » restitue la surprise marquée par וְהִנֵּה. Le nom « Jacob », implicite dans la continuité narrative hébraïque, est explicité pour éviter une ambiguïté peu naturelle en français.
