review_pass:
  verdict: revise
  source_fidelity: La découverte matinale de Léa et les trois questions accusatrices sont bien rendues. Toutefois, « chez toi » réduit le sens de עָבַדְתִּי עִמָּךְ à un lieu, alors que Jacob évoque le travail/service accompli pour Laban. « Pour vous » rend plus directement cette relation de service.
  naturalness: Le français est globalement fluide. Le vouvoiement convient mieux à un échange tendu avec le beau-père de Jacob, dans un registre narratif moderne et digne, sans que l’hébreu impose une familiarité.
  terminology: Les noms Léa, Laban, Jacob et Rachel sont corrects. « Trompé » rend naturellement רִמִּיתָנִי (« tu m’as dupé/trompé »).
  issues:
  - severity: medium
    issue: « j’ai travaillé chez toi »
    rationale: Cette expression localise le travail mais n’exprime pas clairement que Jacob a travaillé au service de Laban. Le sens relationnel de עָבַד ... עִם est mieux préservé par « travaillé pour vous ».
  - severity: low
    issue: Ponctuation exclamative après « Léa »
    rationale: La particule הנה marque bien la surprise, déjà rendue par « voilà que »; l’exclamation ajoute une intensité éditoriale qui n’est pas nécessaire.
  revised_text: 'Au matin, voilà que c’était Léa. Jacob dit à Laban : « Qu’est-ce que vous m’avez fait ? N’est-ce pas pour Rachel que j’ai travaillé pour vous ? Alors pourquoi m’avez-vous trompé ? »'
