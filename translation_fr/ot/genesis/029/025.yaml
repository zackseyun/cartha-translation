base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: fr
  text: 'Au matin, voilà que c’était Léa. Jacob dit à Laban : « Qu’est-ce que vous m’avez fait ? N’est-ce pas pour Rachel que j’ai travaillé pour vous ? Alors pourquoi m’avez-vous trompé ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: voilà que
  rationale: Conserve la particule de découverte soudaine et l’effet de surprise du récit, dans un français naturel.
- source_word: עָבַדְתִּי עִמָּךְ
  choice: j’ai travaillé chez toi
  rationale: Dans ce contexte de service auprès de Laban, « chez toi » exprime naturellement la relation sans surcharger le texte.
- source_word: רִמִּיתָנִי
  choice: m’as-tu trompé
  rationale: Rend directement l’idée de tromperie ou de duperie portée par le verbe hébreu.
