base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: fr
  text: 'Laban lui dit alors : « Assurément, tu es de mes os et de ma chair[a]. » Et Jacob resta chez lui pendant un mois[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression hébraïque désignant un parent proche, un membre de la même famille.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « un mois de jours » ; expression désignant une période d’un mois, possiblement un mois complet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit ; « alors » exprime naturellement cette succession en français.
- source_word: אַךְ
  choice: Oui
  rationale: 'La particule a ici une valeur affirmative et emphatique : Laban reconnaît réellement leur parenté. « Oui » convient au discours direct sans introduire une nuance restrictive.'
- source_word: עַצְמִי וּבְשָׂרִי
  choice: de mes os et de ma chair
  rationale: La formulation conserve l’image hébraïque de la parenté de sang et ses résonances bibliques, tout en étant idiomatique en français avec la préposition « de ».
- source_word: וַיֵּשֶׁב עִמּוֹ
  choice: Et Jacob resta chez lui
  rationale: Dans ce contexte temporaire, ישׁב signifie demeurer ou rester. Le nom « Jacob » lève naturellement l’ambiguïté pronominale possible en français, et « chez lui » rend עִמּוֹ selon le contexte d’hébergement.
- source_word: חֹדֶשׁ יָמִים
  choice: pendant un mois
  rationale: Cette expression idiomatique désigne une durée d’un mois, possiblement un mois complet. La traduction naturelle française évite le calque peu idiomatique « un mois de jours ».
