  text: וַ/יַּ֤עַשׂ יַעֲקֹב֙ כֵּ֔ן וַ/יְמַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וַ/יִּתֶּן ל֛/וֹ אֶת רָחֵ֥ל בִּתּ֖/וֹ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: fr
  text: Jacob fit ainsi et acheva cette semaine[a]. Puis Laban lui donna sa fille Rachel pour femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette semaine de noces » ; l’hébreu désigne littéralement une période de sept jours, ici probablement la semaine des festivités du mariage.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: Jacob fit donc ce qui avait été convenu
  rationale: La tournure renvoie à la demande de Laban au verset précédent. Cette formulation française rend naturellement la valeur anaphorique de כֵּן sans détailler davantage l’action.
- source_word: וַיְמַלֵּא
  choice: acheva
  rationale: Le piel de מלא exprime ici l’accomplissement intégral d’une période de temps.
- source_word: שְׁבֻעַ זֹאת
  choice: cette semaine
  rationale: שְׁבֻעַ désigne une période de sept jours et, dans ce contexte, probablement la semaine des noces. Le texte garde l’expression concise, tandis que la note explicite le contexte culturel.
- source_word: וַיִּתֶּן לוֹ
  choice: Puis Laban lui donna
  rationale: Le sujet implicite est Laban, repris du contexte antérieur. Le nom est explicité pour éviter toute ambiguïté en français, et « Puis » marque la succession narrative.
- source_word: אֶת רָחֵל בִּתּוֹ לוֹ לְאִשָּׁה
  choice: lui donna pour femme sa fille Rachel
  rationale: Cette formulation idiomatique rend la construction hébraïque du don en mariage tout en conservant clairement la relation familiale.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La syntaxe narrative reste concise; « pour femme » est naturel dans le contexte biblique sans être archaïque.
