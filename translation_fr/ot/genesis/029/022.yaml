id: GEN.29.22
reference: Genesis 29:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֥ף לָבָ֛ן אֶת כָּל אַנְשֵׁ֥י הַ/מָּק֖וֹם וַ/יַּ֥עַשׂ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: fr
  text: Laban rassembla donc tous les hommes du lieu et donna un festin[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les gens du lieu ». L’hébreu dit plus littéralement « tous les hommes du lieu » ; la traduction conserve la forme masculine, qui désigne probablement les hommes de l’endroit invités aux noces.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « festin » désigne souvent un banquet festif où l’on boit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: rassembla
  rationale: Le verbe אסף exprime ici l’action de réunir des personnes. « Rassembla » est naturel en français et reste proche de l’image hébraïque.
- source_word: לָבָן
  choice: Laban
  rationale: Le nom propre est rendu selon sa forme française biblique usuelle.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: tous les hommes du lieu
  rationale: אַנְשֵׁי est le pluriel construit masculin de אִישׁ. « Les hommes du lieu » conserve cette forme masculine et ne précise pas « ville » au-delà de l’hébreu.
- source_word: וַיַּעַשׂ
  choice: donna
  rationale: Avec מִשְׁתֶּה, le verbe général עשה se rend idiomatiquement en français par « donner un festin ». Cette formulation exprime l’organisation de l’événement sans ajouter de détail.
- source_word: מִשְׁתֶּה
  choice: un festin
  rationale: מִשְׁתֶּה désigne un repas de fête, souvent associé à la consommation de boissons. « Festin » convient au contexte nuptial et demeure concis.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Donna un festin » privilégie l’usage idiomatique français tout en reflétant la construction hébraïque avec עשה. Les deux appels de note figurent dans le texte.
