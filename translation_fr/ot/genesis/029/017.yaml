  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: fr
  text: Les yeux de Léa étaient doux[a], mais Rachel était belle de silhouette et d’apparence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tendres », « délicats » ou « faibles ». L’adjectif hébreu peut évoquer la douceur ou la délicatesse ; sa nuance exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: les yeux
  rationale: Le pluriel construit désigne directement les yeux de Léa plutôt que son regard ou son apparence générale.
- source_word: רַכּוֹת
  choice: doux
  rationale: L’adjectif évoque fondamentalement la douceur ou la délicatesse. « Doux » reste peu interprétatif; l’incertitude sur la nuance exacte est signalée en note.
- source_word: יְפַת תֹּאַר
  choice: avait une belle silhouette
  rationale: L’expression décrit la forme ou la constitution physique. « Une belle silhouette » est idiomatique en français moderne et maintient la distinction avec l’apparence visible exprimée ensuite.
- source_word: וִיפַת מַרְאֶה
  choice: un beau visage
  rationale: מַרְאֶה désigne ce qui est visible et peut ici évoquer l’aspect ou le visage. Dans cette paire descriptive, « beau visage » offre une formulation française naturelle sans fusionner les deux qualités.
- source_word: וְ
  choice: mais
  rationale: La conjonction coordonne formellement les propositions, mais le contexte établit un contraste entre Léa et Rachel; « mais » le rend clairement en français.
