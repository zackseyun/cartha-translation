revisions:
- from: Quand Laban entendit parler de Jacob[a], le fils de sa sœur, il courut à sa rencontre, le serra dans ses bras, l’embrassa et le conduisit chez lui. Jacob raconta alors à Laban tout ce qui s’était passé.
  to: Quand Laban apprit la nouvelle au sujet de Jacob[a], le fils de sa sœur, il courut à sa rencontre, le serra dans ses bras, l’embrassa et le conduisit chez lui. Jacob raconta alors à Laban tout cela.
  rationale: La révision explicite la valeur de « nouvelle/rapport » de שֵׁמַע et évite de préciser indûment que le contenu raconté consistait exclusivement en événements passés. Elle maintient le français international moderne, la distinction entre l’étreinte et le baiser, ainsi que l’identification non ambiguë de Jacob comme sujet de la dernière proposition.
