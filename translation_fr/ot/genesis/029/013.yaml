  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: fr
  text: Quand Laban apprit la nouvelle au sujet de Jacob[a], le fils de sa sœur, il courut à sa rencontre, le serra dans ses bras, l’embrassa et le conduisit chez lui. Jacob raconta alors à Laban tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le récit concernant Jacob ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ לָבָן אֶת שֵׁמַע יַעֲקֹב
  choice: Quand Laban entendit parler de Jacob
  rationale: La construction introduit une proposition temporelle, et שֵׁמַע désigne ici une nouvelle ou un récit concernant Jacob. « Entendit parler de » est naturel en français et n’ajoute pas explicitement l’idée de son arrivée, que le contexte permet seulement d’inférer.
- source_word: בֶּן אֲחֹתוֹ
  choice: le fils de sa sœur
  rationale: Cette formulation conserve le lien de parenté explicite de l’hébreu plutôt que de le généraliser par « son neveu ».
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: il courut à sa rencontre
  rationale: Cette expression rend directement le mouvement de Laban vers Jacob afin de le rencontrer.
- source_word: וַיְחַבֶּק לוֹ
  choice: le serra dans ses bras
  rationale: Formulation française naturelle et digne pour l’action d’embrasser au sens d’enlacer, distincte du verbe suivant qui signifie donner un baiser.
- source_word: וַיְנַשֶּׁק לוֹ
  choice: l’embrassa
  rationale: Dans ce contexte familial, « embrasser » exprime naturellement le fait de donner un baiser.
- source_word: וַיְבִיאֵהוּ אֶל בֵּיתוֹ
  choice: le conduisit chez lui
  rationale: Le causatif de בוא signifie faire venir ou amener. « Conduisit chez lui » est idiomatique et conserve la destination indiquée par le texte.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: Jacob raconta alors à Laban
  rationale: Le sujet implicite est contextuellement Jacob, puisque Laban est le destinataire marqué par לְ. Le nom explicite évite une ambiguïté momentanée après la série d’actions dont Laban était le sujet.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: tout ce qui s’était passé
  rationale: דְּבָרִים peut désigner des paroles, des faits ou des événements. Ici, Jacob raconte manifestement les faits qui l’ont conduit jusque-là; cette formulation est plus naturelle que « toutes ces choses » tout en gardant une portée générale.
