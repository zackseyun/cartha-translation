  variant: modern international French
source:
  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר כִּֽי שָׁמַ֤ע יְהוָה֙ כִּֽי שְׂנוּאָ֣ה אָנֹ֔כִי וַ/יִּתֶּן לִ֖/י גַּם אֶת זֶ֑ה וַ/תִּקְרָ֥א שְׁמ֖/וֹ שִׁמְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: fr
  text: 'Puis elle fut de nouveau enceinte et donna naissance à un fils. Elle dit : « Puisque Yahweh a entendu que je suis détestée[a], il m’a aussi donné celui-ci. » Elle l’appela donc Siméon[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que je ne suis pas aimée » ou « que je suis moins aimée ». Le mot hébreu signifie littéralement « détestée », mais il peut ici exprimer le rejet ou le fait d’être moins aimée qu’une autre.
    reason: lexical_alternative
  - marker: b
    text: Le nom Siméon évoque en hébreu le verbe traduit par « a entendu ».
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Puis elle fut de nouveau enceinte
  rationale: Le waw narratif fait avancer le récit et עוֹד marque la répétition. Cette formulation est naturelle en français moderne.
- source_word: וַתֵּלֶד בֵּן
  choice: et donna naissance à un fils
  rationale: Rend directement l’expression hébraïque dans un français actuel et digne.
- source_word: כִּי שָׁמַע יְהוָה
  choice: Puisque Yahweh a entendu
  rationale: כִּי introduit ici la raison donnée par Léa; le passé composé exprime l’action accomplie dont la naissance présente le résultat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: que je suis détestée
  rationale: Préserve le sens lexical fort du participe passif שְׂנוּאָה sans ajouter explicitement Jacob ni réduire silencieusement l’expression à une préférence comparative.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: il m’a aussi donné celui-ci
  rationale: Conserve la valeur additive de גַּם et le démonstratif זֶה, qui désigne le fils nouveau-né.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Elle l’appela donc
  rationale: Restitue naturellement en français la formule hébraïque de nomination; « donc » explicite le lien narratif avec l’explication précédente.
- source_word: שִׁמְעוֹן
  choice: Siméon
  rationale: Forme française traditionnelle du nom, accompagnée d’une note signalant le jeu sonore avec le verbe « entendre ».
theological_decisions:
- issue: Description par Léa de sa situation auprès de Jacob
  choice: je suis détestée
  alternative: je ne suis pas aimée / je suis moins aimée
  rationale: Le terme hébreu est fort et signifie littéralement « détestée »; le contexte peut indiquer un rejet ou un amour moindre, mais le texte principal conserve la tension du terme source.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le Tétragramme; « Yahweh » en préserve le caractère de nom personnel.
translation_notes:
  register: Français international moderne, fluide et digne. La formulation conserve la force du terme hébreu שְׂנוּאָה, tandis que la note indique les nuances contextuelles possibles. Le jeu de mots étymologique est signalé sans être artificiellement reproduit dans le texte.
