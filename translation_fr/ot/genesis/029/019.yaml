base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: fr
  text: 'Laban dit : « Il vaut mieux que je te la donne plutôt que de la donner à un autre homme. Reste avec moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Formule narrative courante introduisant le discours direct ; « dit » est l’équivalent français naturel.
- source_word: טוֹב
  choice: il vaut mieux
  rationale: Dans la construction comparative avec מִן, cette tournure exprime naturellement en français l’idée de « mieux… que ».
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: que je te la donne
  rationale: L’infinitif construit avec suffixe de première personne est rendu par une proposition verbale française claire, sans changer le sens.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: plutôt que de la donner à un autre homme
  rationale: Cette formulation rend le second terme de la comparaison tout en évitant une répétition lourde de « je ».
- source_word: אִישׁ אַחֵר
  choice: un autre homme
  rationale: Traduction directe qui préserve le terme explicite du texte sans introduire « mari », seulement implicite dans le contexte.
- source_word: שְׁבָה
  choice: reste
  rationale: Dans ce contexte, l’impératif de ישׁב invite Jacob à demeurer auprès de Laban ; « reste » est actuel et naturel.
- source_word: עִמָּדִי
  choice: avec moi
  rationale: Rend directement l’idée de présence continue auprès de Laban.
theological_decisions: []
