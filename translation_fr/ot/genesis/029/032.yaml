  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: fr
  text: 'Léa devint enceinte et mit au monde un fils[a]. Elle l’appela Ruben, car elle dit : « Yahweh a vu ma détresse ; maintenant, mon mari m’aimera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom Ruben évoque en hébreu les mots « voyez, un fils » et est rapproché ici des paroles de Léa : « Yahweh a vu ma détresse ».'
    reason: Signaler le jeu de mots hébreu qui ne peut être reproduit directement en français.
lexical_decisions:
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Rend naturellement en français moderne le fait de concevoir, sans registre médical ni archaïque.
- source_word: וַתֵּלֶד בֵּן
  choice: mit au monde un fils
  rationale: Expression française courante et digne pour l’idiome hébreu de l’accouchement.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: elle l’appela
  rationale: Préserve la formule de nomination tout en restant idiomatique en français.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française usuelle du nom biblique ; le jeu de mots hébreu est signalé en note.
- source_word: כִּי אָמְרָה
  choice: car elle dit
  rationale: Introduit clairement l’explication donnée par Léa au choix du nom.
- source_word: כִּי רָאָה יְהוָה
  choice: Yahweh a vu
  rationale: Le premier כִּי peut être compris comme emphatique ou explicatif dans le discours direct ; une traduction sans conjonction évite une tournure française lourde tout en conservant le lien avec le nom.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: בְּעָנְיִי
  choice: ma détresse
  rationale: Exprime ici la souffrance personnelle et relationnelle de Léa dans un français actuel.
- source_word: כִּי עַתָּה
  choice: maintenant
  rationale: Marque l’attente que Léa rattache à la naissance de son fils ; le כִּי peut soutenir l’enchaînement logique sans devoir être rendu séparément.
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: mon mari m’aimera
  rationale: Rend directement le sens conjugal de אִישִׁי et conserve la force affective du verbe aimer.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa transcription préserve cette distinction sans introduire une interprétation confessionnelle.
- issue: Force des deux occurrences de כִּי dans les paroles de Léa
  choice: 'enchaînement explicatif implicite : « Yahweh a vu… ; maintenant… »'
  alternative: « Parce que Yahweh a vu ma détresse, maintenant mon mari m’aimera »
  rationale: L’hébreu permet une nuance causale ou emphatique. La ponctuation française conserve le raisonnement de Léa sans imposer une syntaxe artificielle ni trancher excessivement la nuance.
translation_notes:
  register: Français international moderne, narratif et digne. « Devint enceinte » et « mit au monde » sont naturels et accessibles ; « détresse » rend la gravité de la situation sans archaïsme. Le marqueur [a] est placé après « fils », là où le jeu de mots lié au nom et à la naissance est le plus immédiatement pertinent.
