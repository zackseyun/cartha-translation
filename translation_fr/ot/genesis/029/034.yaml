  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: fr
  text: 'Elle conçut de nouveau et mit au monde un fils. Elle dit : « À présent, cette fois-ci, mon mari s’attachera à moi[a], car je lui ai donné trois fils. » C’est pourquoi on l’appela Lévi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’unira à moi » ou « se joindra à moi ». En hébreu, le verbe employé fait écho au nom Lévi.
    reason: Préserver le champ de sens du verbe לוה et rendre perceptible le jeu de mots hébreu avec le nom Lévi.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Elle fut encore enceinte
  rationale: Le verbe הרה exprime le fait de concevoir ou de devenir enceinte, et עוֹד indique la répétition. Cette formulation est naturelle dans un récit français.
- source_word: וַתֵּלֶד בֵּן
  choice: et mit au monde un fils
  rationale: Cette expression française courante rend fidèlement l’idée de donner naissance à un fils.
- source_word: עַתָּה הַפַּעַם
  choice: À présent, cette fois-ci
  rationale: La formulation conserve les deux éléments hébreux et leur effet d’insistance sans les fondre en une seule expression.
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: mon mari s’attachera à moi
  rationale: Le nifal de לוה peut évoquer le fait de se joindre ou de s’attacher à quelqu’un. « S’attachera à moi » exprime naturellement l’espoir de proximité conjugale de Léa tout en permettant de signaler le jeu de mots avec Lévi.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: car je lui ai donné trois fils
  rationale: « Car » introduit la raison donnée par Léa; « je lui ai donné » est une manière naturelle en français de rendre l’expression hébraïque qui signifie littéralement qu’elle lui a enfanté trois fils.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution introduit clairement et naturellement l’explication du nom.
- source_word: קָרָא שְׁמוֹ
  choice: on l’appela
  rationale: Le verbe hébreu est au masculin singulier, mais son sujet n’est pas exprimé. Le pronom indéfini français évite d’identifier arbitrairement la personne qui donne le nom.
- source_word: לֵוִי
  choice: Lévi
  rationale: Forme française conventionnelle du nom biblique, avec accent conforme à l’usage moderne.
theological_decisions:
- issue: Jeu de mots entre יִלָּוֶה et לֵוִי
  choice: Employer « s’attachera à moi » dans le texte et expliquer en note le sens alternatif ainsi que le jeu sonore hébreu.
  alternative: « s’unira à moi » ou « se joindra à moi »
  rationale: Le texte relie l’espoir de Léa au nom Lévi par le son et le sens. Aucun équivalent français ne peut reproduire pleinement ce lien; la note le rend donc explicite sans imposer une interprétation plus étroite.
- issue: Sujet non exprimé de קָרָא
  choice: Traduire par « on l’appela »
  alternative: « il l’appela » ou « elle l’appela »
  rationale: Bien que la forme verbale soit masculine singulière, le texte ne nomme pas le sujet. La tournure indéfinie préserve cette absence plutôt que d’attribuer explicitement le nom à Jacob ou à Léa.
translation_notes:
  register: Français international moderne, narratif et digne. « Mettre au monde » et « donner trois fils » restent accessibles sans être familiers. La ponctuation française et l’accent conventionnel de « Lévi » sont employés.
