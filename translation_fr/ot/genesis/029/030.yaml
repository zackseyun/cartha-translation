  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: fr
  text: Il s’unit aussi à Rachel, l’aima plus que Léa[a] et travailla encore sept années de plus auprès de Laban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plutôt que Léa ». La préposition hébraïque peut exprimer un contraste, mais elle marque ici plus naturellement une comparaison : « plus que Léa ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: Il s’unit aussi à Rachel
  rationale: Dans ce contexte matrimonial, בוא אל est un idiome qui implique la consommation du mariage. « S’unir à » en transmet naturellement le sens sexuel en français moderne sans être inutilement explicite; « aussi » rend גַּם et rappelle l’union précédente avec Léa.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: et il aima Rachel
  rationale: אָהַב est le verbe courant pour « aimer ». Le second גַּם contribue ici à l’enchaînement additif; une répétition de « aussi » serait lourde en français et risquerait d’obscurcir la comparaison qui suit.
- source_word: מִלֵּאָה
  choice: plus que Léa
  rationale: Après un verbe d’affection, מִן marque ici le plus naturellement une comparaison. La formulation française exprime clairement cette valeur tout en signalant en note l’autre lecture possible.
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: Il travailla … auprès de Laban
  rationale: עבד désigne ici le travail ou service accompli dans la maisonnée de Laban. עִמּוֹ signifie littéralement « avec lui »; « auprès de Laban » en conserve la relation sans suggérer à tort un travail entre partenaires égaux. Le nom explicite l’antécédent en français.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: encore sept autres années
  rationale: עוֹד et אֲחֵרוֹת soulignent ensemble qu’une nouvelle période de sept ans s’ajoute à la première. Cette légère redondance reste naturelle et reproduit l’insistance de l’hébreu.
theological_decisions:
- issue: Nature de la préférence exprimée envers Rachel
  choice: '« plus que Léa » : amour comparativement plus grand'
  alternative: '« plutôt que Léa » : amour de Rachel à l’exclusion de Léa'
  rationale: La préposition מִן permet formellement les deux nuances, mais le contexte immédiat et l’usage comparatif après un verbe d’affection favorisent « plus que ». La note préserve l’autre possibilité sans trancher davantage que le texte.
translation_notes:
  register: Français international moderne, narratif et digne. « S’unir à » rend avec discrétion l’idiome sexuel hébreu; « travailler auprès de Laban » est plus naturel que le calque « servir avec lui ». Le nom de Laban remplace le pronom afin d’éviter une ambiguïté française.
