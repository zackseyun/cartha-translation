base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: fr
  text: 'Elle devint de nouveau enceinte et mit au monde un fils. Elle dit : « Cette fois, je louerai Yahweh. » C’est pourquoi elle l’appela Juda[a]. Puis elle cessa d’enfanter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le nom Juda fait écho au verbe traduit par « louer » et qui peut aussi signifier « rendre grâce ».
    reason: Le jeu de mots motivant le nom n’est pas perceptible en français.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Elle fut encore enceinte
  rationale: Le verbe הרה indique qu’elle devient enceinte, et עוֹד marque ici la répétition dans la suite des naissances.
- source_word: וַתֵּלֶד בֵּן
  choice: mit au monde un fils
  rationale: Formulation française naturelle et digne pour l’expression hébraïque courante désignant l’accouchement.
- source_word: הַפַּעַם
  choice: Cette fois
  rationale: Conserve le contraste déictique avec les naissances précédentes sans ajouter une nuance émotionnelle absente du texte.
- source_word: אוֹדֶה
  choice: je louerai
  rationale: Le hifil de ידה peut exprimer la louange ou l’action de grâce. « Louerai » maintient clairement le jeu étymologique avec Juda.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Rend clairement et naturellement le lien causal introduisant l’attribution du nom.
- source_word: קָרְאָה שְׁמוֹ
  choice: elle l’appela
  rationale: Équivalent idiomatique français de la formule hébraïque littérale « elle appela son nom ».
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle du nom, accompagnée d’une note qui explicite le jeu de mots hébreu.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: Puis elle cessa d’avoir des enfants
  rationale: Rend naturellement la construction signifiant cesser d’enfanter, sans suggérer nécessairement une cessation définitive.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; la transcription « Yahweh » préserve le caractère de nom propre.
- issue: Valeur de אוֹדֶה
  choice: je louerai
  alternative: je rendrai grâce
  rationale: Les deux sens sont possibles pour ידה. « Je louerai » convient au contexte et rend plus perceptible le lien avec le nom Juda, tandis que la note signale la proximité avec l’idée de remercier.
translation_notes:
  register: Français international moderne, narratif et digne. Ponctuation française et passé simple évité au profit d’un récit accessible au passé composé; la formulation conserve la brièveté de l’hébreu et son jeu de mots au moyen d’une note.
