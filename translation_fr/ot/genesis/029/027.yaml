  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: fr
  text: Achève la semaine nuptiale de celle-ci[a], et nous te donnerons aussi l’autre[b] en échange du travail que tu feras pour moi[c] encore sept ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Achève la semaine de celle-ci. » Il s’agit de la semaine nuptiale coutumière de Léa.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « celle-ci aussi ». Le démonstratif désigne Rachel, l’autre fille de Laban.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « du service que tu accompliras auprès de moi ». Le verbe hébreu peut signifier « travailler » ou « servir » selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Achève
  rationale: L’impératif de מלא demande à Jacob de mener jusqu’à son terme une période déterminée. « Achève » est naturel et conserve la force du commandement.
- source_word: שְׁבֻעַ זֹאת
  choice: la semaine nuptiale de celle-ci
  rationale: שְׁבֻעַ désigne ici la semaine des noces, tandis que le démonstratif féminin renvoie à Léa. Cette formulation garde le démonstratif sans introduire un nom absent de l’hébreu et explicite sobrement le cadre culturel.
- source_word: וְנִתְּנָה לְךָ
  choice: et l’on te donnera
  rationale: La forme est à la troisième personne du féminin singulier et peut recevoir ici une valeur passive ou indéfinie. Le tour français « l’on te donnera » reste naturel tout en préservant cette particularité, au lieu de transformer explicitement le sujet en « nous ».
- source_word: גַּם אֶת זֹאת
  choice: aussi l’autre
  rationale: Le second démonstratif féminin désigne Rachel. En français, « l’autre » distingue clairement Rachel de « celle-ci », qui désigne Léa, sans répéter une formule artificielle.
- source_word: בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי
  choice: en échange du travail que tu feras pour moi
  rationale: Le nom et le verbe de la racine עבד décrivent le travail ou service convenu. « En échange » rend la valeur conditionnelle ou transactionnelle de la préposition, et « pour moi » exprime idiomatiquement en français la relation de travail indiquée par עִמָּדִי dans ce contexte.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: pendant encore sept années
  rationale: Cette expression rend l’idée d’une nouvelle période de sept ans, ajoutée à la précédente.
