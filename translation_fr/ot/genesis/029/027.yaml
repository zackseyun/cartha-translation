translation_notes:
  register: Français international moderne, clair et digne. Le texte conserve les deux démonstratifs féminins en les distinguant naturellement (« celle-ci », puis « l’autre »), et maintient l’indétermination grammaticale de וְנִתְּנָה au moyen de « l’on te donnera ». Les marqueurs de notes sont placés au point précis qu’ils éclairent.
