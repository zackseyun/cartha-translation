  text: וַ/יֹּ֤אמֶר לָבָן֙ לְ/יַעֲקֹ֔ב הֲ/כִי אָחִ֣/י אַ֔תָּה וַ/עֲבַדְתַּ֖/נִי חִנָּ֑ם הַגִּ֥ידָ/ה לִּ֖/י מַה מַּשְׂכֻּרְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: fr
  text: 'Laban dit à Jacob[a] : « Parce que tu es mon parent, devrais-tu travailler gratuitement pour moi ? Dis-moi quel doit être ton salaire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon frère » ; le mot hébreu désigne ici plus largement un membre de la parenté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: Es-tu mon parent pour autant que
  rationale: 'La combinaison interrogative הֲכִי introduit ici une question rhétorique fondée sur le lien de parenté. Cette tournure française conserve la portée argumentative : la parenté ne justifie pas un travail non rémunéré.'
- source_word: אָחִי
  choice: mon parent
  rationale: אָחִי signifie littéralement « mon frère », mais peut désigner un membre de la parenté au sens large. Jacob étant le neveu de Laban, « mon parent » évite de suggérer à tort qu’ils sont frères.
- source_word: וַעֲבַדְתַּנִי
  choice: que tu doives travailler pour moi
  rationale: עבד désigne ici le travail accompli au service de Laban. Le subjonctif dans la construction rhétorique exprime naturellement en français l’idée qu’un lien familial ne saurait imposer ce travail.
- source_word: חִנָּם
  choice: gratuitement
  rationale: Le terme indique un travail sans rémunération. « Gratuitement » est clair, naturel et prépare la mention du salaire.
- source_word: הַגִּידָה לִּי
  choice: Dis-moi
  rationale: L’impératif hébreu suivi du complément indirect reçoit son équivalent direct et idiomatique en français.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: quel doit être ton salaire
  rationale: מַשְׂכֻּרֶת désigne la rémunération ou le salaire. « doit être » convient au contexte où Laban demande à Jacob de fixer les conditions de son travail.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la question rhétorique de Laban et rend explicite sans la surinterpréter la négociation d’un travail rémunéré.
