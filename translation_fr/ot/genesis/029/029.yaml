translation_notes:
  register: Français international moderne, simple et digne. L’ordre des constituants a été légèrement adapté pour éviter l’ambiguïté de « Rachel, sa fille » et rendre clairement que Rachel est la fille de Laban. La répétition hébraïque de שִׁפְחָה est conservée.
