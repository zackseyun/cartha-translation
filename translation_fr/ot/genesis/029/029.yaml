  yaml_path: translation/ot/genesis/029/029.yaml
  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: fr
  text: Laban donna à sa fille Rachel sa servante Bilha, pour qu’elle soit sa servante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: 'Le wayyiqtol de נתן exprime simplement l’action narrative passée : « donna ».'
- source_word: לָבָן
  choice: Laban
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: לְרָחֵל בִּתּוֹ
  choice: à sa fille Rachel
  rationale: Cette formulation française naturelle conserve Rachel comme bénéficiaire et בִּתּוֹ comme apposition indiquant sa relation avec Laban.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Forme française courante du nom propre, sans h final non prononcé.
- source_word: שִׁפְחָתוֹ
  choice: sa servante
  rationale: שִׁפְחָה désigne ici une femme en condition de service ou de dépendance. « Servante » est actuel, clair et marqué au féminin, tout en évitant d’ajouter une indication d’âge.
- source_word: לָהּ לְשִׁפְחָה
  choice: pour qu’elle soit sa servante
  rationale: La tournure exprime naturellement en français la destination ou la fonction assignée à Bilha auprès de Rachel, tout en conservant la répétition de « servante ».
