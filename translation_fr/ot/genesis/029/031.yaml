source:
  edition: WLC
  text: וַ/יַּ֤רְא יְהוָה֙ כִּֽי שְׂנוּאָ֣ה לֵאָ֔ה וַ/יִּפְתַּ֖ח אֶת רַחְמָ֑/הּ וְ/רָחֵ֖ל עֲקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: fr
  text: Quand le SEIGNEUR vit que Léa était haïe, il la rendit féconde, tandis que Rachel était stérile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: haïe
  rationale: Le terme hébreu signifie littéralement « haïe ». Le contexte peut impliquer qu’elle était moins aimée, mais le français conserve ici la force et la tension du texte source.
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: il la rendit féconde
  rationale: L’expression idiomatique signifie littéralement « il ouvrit son sein/utérus ». « Il la rendit féconde » exprime naturellement en français l’action divine permettant la conception, sans employer une formulation anatomique peu idiomatique.
- source_word: עֲקָרָה
  choice: stérile
  rationale: Équivalent français direct indiquant l’incapacité à avoir des enfants dans ce récit.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rendu traditionnel français du tétragramme, en petites capitales conventionnelles, distinct du titre ordinaire « Seigneur ».
theological_decisions:
- issue: Intensité de la description de la situation de Léa
  choice: haïe
  alternative: mal aimée / moins aimée
  rationale: Le texte emploie le terme fort שְׂנוּאָה. Même si le contexte de comparaison amoureuse peut soutenir « moins aimée », traduire « haïe » préserve l’ambiguïté et la dureté théologique et narrative sans les atténuer.
- issue: Action divine sur la fécondité
  choice: il la rendit féconde
  alternative: il ouvrit son sein
  rationale: La traduction conserve explicitement Dieu comme agent de la fécondité, tout en rendant l’idiome hébreu dans un français naturel.
translation_notes:
  register: Français moderne, courant et digne. La coordination adversative est rendue par « tandis que », qui marque le contraste entre la fécondité accordée à Léa et la stérilité de Rachel.
