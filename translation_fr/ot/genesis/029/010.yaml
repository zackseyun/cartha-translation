base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: fr
  text: Lorsque Jacob vit Rachel, fille de Laban, frère de la mère de Jacob[a], ainsi que le troupeau de Laban, frère de la mère de Jacob, Jacob s’approcha, roula la pierre qui couvrait l’ouverture du puits et donna à boire au troupeau de Laban, frère de la mère de Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète trois fois dans ce verset « le frère de sa mère », soulignant ainsi le lien familial de Jacob avec Laban.
    reason: La répétition, importante sur le plan littéraire, peut sembler inhabituelle en français ; la note précise qu’elle appartient au texte hébreu.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Lorsque
  rationale: La formule narrative introduit l’événement suivant avec une valeur temporelle. « Lorsque » rend cette valeur naturellement sans reproduire lourdement « et il arriva que ».
- source_word: רָאָה
  choice: vit
  rationale: Le verbe désigne ici simplement la perception visuelle; « vit » est direct et naturel.
- source_word: בַּת לָבָן
  choice: fille de Laban
  rationale: Cette apposition identifie Rachel par son lien familial. L’absence d’article devant « fille » est idiomatique en français.
- source_word: אֲחִי אִמּוֹ
  choice: le frère de sa mère
  rationale: Cette formulation explicite conserve les trois répétitions hébraïques et souligne le lien familial, contrairement au plus concis « son oncle maternel ».
- source_word: צֹאן
  choice: le troupeau
  rationale: צֹאן désigne collectivement le petit bétail, sans imposer qu’il s’agisse uniquement de moutons. « Le troupeau » préserve cette généralité.
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Le verbe exprime le mouvement de Jacob vers le puits et l’action; « s’approcha » est précis et idiomatique.
- source_word: וַיָּגֶל
  choice: roula
  rationale: Le verbe גלל évoque concrètement l’action de faire rouler la pierre plutôt que de simplement l’enlever.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: qui se trouvait sur l’ouverture du puits
  rationale: « Ouverture du puits » rend clairement l’image hébraïque de la « bouche » du puits, tandis que la relative permet d’exprimer naturellement la position initiale de la pierre et son déplacement.
- source_word: וַיַּשְׁקְ
  choice: donna à boire
  rationale: Le hiphil de שׁקה signifie faire boire ou donner de l’eau. « Donner à boire au troupeau » est plus naturel en français moderne que « abreuver » dans ce registre.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition volontaire de « le frère de sa mère » est maintenue malgré sa lourdeur relative, car elle met en relief le lien de parenté. « L’ouverture du puits » privilégie la clarté courante tout en conservant le sens de l’image hébraïque.
