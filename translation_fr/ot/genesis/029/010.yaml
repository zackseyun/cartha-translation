  to: Lorsque Jacob vit Rachel, fille de Laban, frère de la mère de Jacob[a], ainsi que le troupeau de Laban, frère de la mère de Jacob, Jacob s’approcha, roula la pierre qui couvrait l’ouverture du puits et donna à boire au troupeau de Laban, frère de la mère de Jacob.
