  text: וַ/יַּגֵּ֨ד יַעֲקֹ֜ב לְ/רָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֨י/הָ֙ ה֔וּא וְ/כִ֥י בֶן רִבְקָ֖ה ה֑וּא וַ/תָּ֖רָץ וַ/תַּגֵּ֥ד לְ/אָבִֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: fr
  text: Jacob dit à Rachel qu’il était un parent de son père et qu’il était le fils de Rébecca[a]. Alors elle courut l’annoncer à son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « frère de son père ». Le mot « frère » peut désigner ici un proche parent masculin ; Jacob est précisément le neveu de Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: apprit à
  rationale: Le hifil de נגד signifie « faire savoir, annoncer ». La tournure « apprit à Rachel » est naturelle en français narratif et introduit clairement le contenu rapporté.
- source_word: כִּי
  choice: que
  rationale: Les deux occurrences introduisent ici le contenu de ce que Jacob fait savoir à Rachel.
- source_word: אֲחִי אָבִיהָ
  choice: un parent de son père
  rationale: Littéralement « frère de son père » ; אָח peut désigner plus largement un proche parent masculin. Jacob étant le neveu de Laban, « un parent de son père » transmet le sens contextuel sans lui attribuer à tort la qualité de frère.
- source_word: בֶן רִבְקָה
  choice: le fils de Rébecca
  rationale: Rendu direct et idiomatique de la relation filiale ; l’article convient puisque Jacob se présente lui-même comme ce fils.
- source_word: וַתָּרָץ
  choice: elle courut
  rationale: רץ désigne l’action de courir. Le passé simple conserve la vivacité et le registre digne du récit.
- source_word: וַתַּגֵּד
  choice: l’annoncer
  rationale: 'Le même verbe נגד est rendu selon sa construction française : Rachel va annoncer à son père la nouvelle qu’elle vient d’apprendre.'
- source_word: לְאָבִיהָ
  choice: à son père
  rationale: Rendu direct de la destination de l’annonce.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit. La répétition hébraïque de נגד est modulée en « apprit » puis « annoncer » pour une expression française naturelle, sans changement de sens.
