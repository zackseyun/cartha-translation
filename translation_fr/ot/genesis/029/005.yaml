  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם הַ/יְדַעְתֶּ֖ם אֶת לָבָ֣ן בֶּן נָח֑וֹר וַ/יֹּאמְר֖וּ יָדָֽעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/005.yaml
  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: fr
  text: 'Il leur dit : « Connaissez-vous Laban, fils de Nahor ? » Ils répondirent : « Nous le connaissons[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Nous connaissons » ; « le » est sous-entendu par le contexte.'
    reason: Préciser que le pronom objet est explicité en français alors qu’il n’apparaît pas dans le texte hébreu.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Il leur dit
  rationale: Le waw consécutif fait progresser le récit sans devoir être rendu systématiquement par « et ». Le complément pronominal לָהֶם est naturellement rendu par « leur ».
- source_word: הֲיְדַעְתֶּם
  choice: Connaissez-vous
  rationale: Dans ce contexte, יָדַע désigne le fait de connaître personnellement quelqu’un. Le présent français exprime naturellement cette relation.
- source_word: לָבָן
  choice: Laban
  rationale: Translittération française traditionnelle du nom propre.
- source_word: בֶּן נָחוֹר
  choice: fils de Nahor
  rationale: בֶּן signifie directement « fils ». Cette identification généalogique est conservée sans l’élargir à « descendant ».
- source_word: וַיֹּאמְרוּ
  choice: Ils répondirent
  rationale: Le verbe signifie littéralement « ils dirent », mais, dans cet échange, « répondirent » rend naturellement sa fonction discursive sans ajouter de contenu.
- source_word: יָדָעְנוּ
  choice: Nous le connaissons
  rationale: La traduction reprend le verbe « connaître » employé dans la question. Le pronom objet « le », absent en hébreu mais clairement sous-entendu, est nécessaire en français courant.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La tournure interrogative avec inversion convient au dialogue narratif. « Ils répondirent » évite la répétition peu naturelle de « dirent » tout en conservant le sens.
