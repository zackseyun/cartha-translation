base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: fr
  text: 'Jacob leur dit : « Mes frères[a], d’où venez-vous ? » Ils répondirent : « Nous sommes de Harrân. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Mes frères » est ici une formule d’adresse fraternelle et courtoise; Jacob ne dit pas nécessairement que ces hommes sont ses frères au sens propre.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Jacob leur dit
  rationale: Le verbe אמר est le verbe courant de parole, rendu par « dit » sans expliciter davantage la valeur interrogative de la réplique; לָהֶם est naturellement exprimé par « leur ».
- source_word: אַחַי
  choice: Mes frères
  rationale: La traduction conserve le sens littéral et le possessif de l’hébreu. Ici, il s’agit vraisemblablement d’une adresse fraternelle et courtoise à des hommes inconnus, comme l’indique la note.
- source_word: מֵאַיִן אַתֶּם
  choice: d’où venez-vous ?
  rationale: La préposition מ־ avec l’interrogatif אַיִן demande le lieu d’origine. « D’où venez-vous ? » est l’expression idiomatique en français moderne.
- source_word: וַיֹּאמְרוּ
  choice: Ils répondirent
  rationale: אמר signifie littéralement « dire », mais, dans cet échange question-réponse, « répondirent » exprime naturellement la fonction contextuelle sans modifier le contenu.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: Nous sommes de Harrân
  rationale: La préposition מ־ indique l’origine; le français exige ici la copule « sommes », absente mais implicite dans la phrase nominale hébraïque. « Harrân » suit une forme française usuelle du nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. Le dialogue conserve la simplicité du récit hébreu. « Mes frères » est maintenu dans le texte malgré sa possible coloration religieuse en français contemporain, car la note en précise la fonction sociale.
