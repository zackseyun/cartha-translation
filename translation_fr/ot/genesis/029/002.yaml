base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: fr
  text: Il vit[a], et voici qu’il y avait un puits dans la campagne ; et voici[b] que trois troupeaux[c] étaient couchés là, près du puits[d], car c’est de ce puits qu’on abreuvait les troupeaux. Et une grande pierre était sur l’ouverture du puits[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il regarda ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu répète « voici » deux fois pour rendre la scène plus vivante.
    reason: discourse_feature
  - marker: c
    text: Le terme hébreu désigne le petit bétail, notamment les moutons et les chèvres.
    reason: lexical_scope
  - marker: d
    text: Littéralement « sur lui » ; dans ce contexte, « près du puits » ou « autour du puits ».
    reason: lexical_alternative
  - marker: e
    text: Littéralement « sur la bouche du puits », c’est-à-dire sur son ouverture.
    reason: idiom
lexical_decisions:
- source_word: וַיַּרְא
  choice: Il regarda
  rationale: Le wayyiqtol de ראה fait progresser le récit et introduit la scène observée. « Il regarda » convient au contexte, tandis que « il vit » demeure possible.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: et voici que ... et voici que
  rationale: La répétition de הִנֵּה attire deux fois l’attention sur ce que Jacob découvre et donne de la vivacité à la scène ; elle est conservée malgré son caractère marqué en français.
- source_word: בְאֵר
  choice: un puits
  rationale: « Puits » est le sens courant et rien dans le verset n’exige une désignation plus précise.
- source_word: בַּשָּׂדֶה
  choice: dans la campagne
  rationale: שָׂדֶה peut désigner un champ ou la campagne ouverte. Ici, « dans la campagne » évite de suggérer nécessairement une parcelle cultivée.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: trois troupeaux de moutons
  rationale: עֵדֶר désigne un troupeau et צֹאן le petit bétail. « Troupeaux de moutons » est naturel dans la scène pastorale, sans exclure dans le texte source la portée plus large du terme.
- source_word: רֹבְצִים
  choice: étaient couchés
  rationale: Le participe de רבץ décrit des animaux couchés ou au repos ; « étaient couchés » en conserve directement l’image.
- source_word: עָלֶיהָ
  choice: près de lui
  rationale: L’expression signifie littéralement « sur lui/elle », avec le puits pour référent, mais elle indique ici naturellement la proximité des troupeaux autour du puits.
- source_word: יַשְׁקוּ
  choice: on abreuvait
  rationale: Le hiphil de שׁקה signifie « faire boire, abreuver ». Le pluriel sans sujet exprimé a ici une valeur indéfinie ou coutumière, rendue naturellement en français par « on » et l’imparfait.
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: Une grosse pierre se trouvait sur l’ouverture du puits
  rationale: La formulation française restitue la présence d’une pierre de grande taille au-dessus de l’orifice, sans donner à « bouche du puits » une tournure inutilement littérale.
