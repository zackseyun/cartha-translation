source:
  edition: WLC
  text: וַ/יִּשַּׁ֥ק יַעֲקֹ֖ב לְ/רָחֵ֑ל וַ/יִּשָּׂ֥א אֶת קֹל֖/וֹ וַ/יֵּֽבְךְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/011.yaml
  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: fr
  text: Alors Jacob embrassa Rachel[a], puis il éleva la voix et pleura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « salua Rachel en l’embrassant ». Le verbe hébreu signifie normalement « embrasser », mais, dans ce contexte, le geste peut aussi être compris comme une salutation familiale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: embrassa
  rationale: Le qal de נשׁק signifie normalement « embrasser ». Le contexte peut évoquer une salutation familiale, mais le geste concret doit rester explicite.
- source_word: לְרָחֵל
  choice: Rachel
  rationale: Après le verbe « embrasser », le français emploie naturellement un complément d’objet direct, sans rendre littéralement la préposition לְ.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: il éleva la voix
  rationale: Cette expression hébraïque indique que Jacob se mit à pleurer de manière audible. La formulation conserve l’image et la tonalité narrative de l’original tout en restant claire en français moderne.
- source_word: וַיֵּבְךְּ
  choice: pleura
  rationale: Le verbe בכה signifie « pleurer ». « Pleura » convient au registre narratif digne et s’enchaîne naturellement avec « éleva la voix ».
- source_word: וַ
  choice: Alors / puis
  rationale: Les formes narratives en wayyiqtol font progresser la succession des actions. « Alors » et « puis » rendent cet enchaînement avec naturel, sans accumuler les « et ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La traduction conserve l’expression imagée « éleva la voix » sans la réduire à une simple indication d’intensité, et la note préserve la portée possible du baiser comme salutation familiale.
