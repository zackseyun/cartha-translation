lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Il parlait encore avec eux lorsque
  rationale: La construction avec עוֹדֶנּוּ et le participe exprime une action toujours en cours au moment où Rachel arrive. Cette formulation française rend naturellement la simultanéité.
- source_word: וְרָחֵל בָּאָה
  choice: Rachel arriva
  rationale: Dans ce récit, le parfait de בוא fait progresser l’action. Le passé simple convient au registre narratif français et « arriva » exprime clairement l’entrée en scène de Rachel.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: avec le troupeau de son père
  rationale: La formulation réunit naturellement en français le troupeau et la relation d’appartenance exprimée par la proposition relative hébraïque.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication de la présence de Rachel avec le troupeau.
- source_word: רֹעָה הִוא
  choice: elle était bergère
  rationale: Le participe féminin désigne Rachel comme celle qui garde le troupeau. « Bergère » restitue avec concision le rôle et la forme féminine de l’hébreu.
