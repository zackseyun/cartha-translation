revisions:
- from: 'Ils répondirent : « Nous ne pouvons pas le faire avant que tous les troupeaux soient rassemblés et qu’on roule la pierre qui couvre l’ouverture du puits. Alors, nous abreuvons le petit bétail[a]. »'
  to: 'Ils répondirent : « Nous ne pouvons pas le faire avant que tous les troupeaux soient rassemblés et qu’on ait roulé la pierre à l’écart de l’ouverture du puits. Alors, nous abreuvons le petit bétail[a]. »'
  rationale: La révision conserve les choix lexicaux justifiés du projet, mais explicite le déplacement de la pierre hors de l’ouverture, élément porté par מֵעַל. Le subjonctif passé (« qu’on ait roulé ») exprime naturellement en français l’antériorité de cette action avant l’abreuvement, sans déterminer davantage l’identité des agents.
