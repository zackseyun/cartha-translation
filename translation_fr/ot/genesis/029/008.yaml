  text: וַ/יֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל הָ֣/עֲדָרִ֔ים וְ/גָֽלֲלוּ֙ אֶת הָ/אֶ֔בֶן מֵ/עַ֖ל פִּ֣י הַ/בְּאֵ֑ר וְ/הִשְׁקִ֖ינוּ הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: fr
  text: 'Ils répondirent : « Nous ne pouvons pas le faire avant que tous les troupeaux soient rassemblés et qu’on ait roulé la pierre à l’écart de l’ouverture du puits. Alors, nous abreuvons le petit bétail[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le troupeau ». Le mot hébreu peut désigner collectivement le petit bétail, en particulier les moutons et les chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוּכַל
  choice: nous ne pouvons pas le faire
  rationale: Le verbe exprime l’incapacité. L’ajout idiomatique de « le faire » rend en français naturel l’ellipse présente en hébreu sans préciser davantage l’action.
- source_word: יֵאָסְפוּ
  choice: soient rassemblés
  rationale: Le niphal exprime ici le rassemblement des troupeaux; le subjonctif convient après « avant que ».
- source_word: הָעֲדָרִים
  choice: les troupeaux
  rationale: עדר désigne un troupeau, notamment de petit bétail; « troupeaux » reste naturel et ne précise pas indûment l’espèce.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: qu’on roule la pierre
  rationale: גלל signifie « rouler ». Le pronom indéfini « on » restitue naturellement en français le sujet pluriel non précisé dans ce contexte.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: qui couvre l’ouverture du puits
  rationale: Littéralement « de dessus la bouche du puits ». « L’ouverture du puits » transmet clairement l’image, tandis que « qui couvre » explicite la position indiquée par מֵעַל dans un français naturel.
- source_word: וְהִשְׁקִינוּ
  choice: alors, nous abreuvons
  rationale: Le hiphil de שקה signifie « donner à boire, abreuver ». « Alors » rend la succession des actions.
- source_word: הַצֹּאן
  choice: le petit bétail
  rationale: צאן est un collectif qui peut englober les moutons et les chèvres. « Petit bétail » préserve cette extension sans la réduire aux seuls moutons.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La tournure « nous ne pouvons pas le faire » conserve l’ellipse sémantique de l’hébreu tout en évitant une phrase peu naturelle. « Ouverture du puits » est préféré au calque « bouche du puits ».
