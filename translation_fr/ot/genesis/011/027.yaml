  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: fr
  text: 'Voici la descendance de Térah : Térah fut le père d’Abram, de Nahor et de Harân, et Harân fut le père de Loth.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule présente et ouvre une nouvelle section généalogique. « Voici » rend naturellement cette fonction en français sans ajouter un adverbe temporel absent de l’hébreu.
- source_word: תּוֹלְדֹת
  choice: la lignée de
  rationale: Dans la formule structurante de la Genèse, le terme désigne ce qui procède d’une personne, notamment sa ligne familiale. « La lignée de » est naturel et compréhensible, tout en restant assez large pour introduire le récit familial qui suit.
- source_word: תֶּרַח
  choice: Térah
  rationale: Translittération française courante du nom hébreu.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le hiphil de ילד exprime ici l’engendrement dans un cadre généalogique. « Engendra » est concis, digne et précis, sans être aussi archaïque que « procréa » ou aussi périphrastique que « fut le père de ».
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: Abram, Nahor et Harân
  rationale: Les marqueurs d’objet direct ne se traduisent pas. Les noms sont rendus selon des formes françaises bibliques reconnaissables.
- source_word: וְהָרָן הוֹלִיד אֶת לוֹט
  choice: Harân engendra Loth
  rationale: La coordination hébraïque est rendue par la juxtaposition après le point-virgule, naturelle en français, et le verbe généalogique est traduit de manière constante.
