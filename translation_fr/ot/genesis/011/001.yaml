  text: The whole earth had one language and the same words[a].
translation:
  language: fr
  text: Toute la terre avait une seule langue et les mêmes mots[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un même ensemble de mots » ou « une même manière de parler ». Littéralement, l’hébreu dit : « et des mots, un/les mêmes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: avait
  rationale: La forme narrative de היה introduit ici une situation de fond. L’imparfait français exprime naturellement cet état sans ajouter un marqueur temporel absent du texte.
- source_word: כָל הָאָרֶץ
  choice: toute la terre
  rationale: אָרֶץ peut désigner la terre ou un pays; dans le contexte du récit de Babel, la portée générale visant l’humanité favorise « toute la terre ».
- source_word: שָׂפָה אֶחָת
  choice: une seule langue
  rationale: שָׂפָה signifie littéralement « lèvre », mais désigne idiomatiquement la langue parlée. « Une seule langue » rend clairement l’unité exprimée par אֶחָת.
- source_word: וּדְבָרִים אֲחָדִים
  choice: et les mêmes mots
  rationale: דְּבָרִים signifie couramment « mots » ou « paroles ». La formulation conserve cette valeur lexicale ainsi que l’idée d’uniformité portée par אֲחָדִים, sans la confondre avec la première expression.
