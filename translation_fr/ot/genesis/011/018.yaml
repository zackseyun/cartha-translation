  text: Peleg lived thirty years and fathered Reu.
translation:
  language: fr
  text: Péleg vécut trente ans, puis il eut pour fils Réou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe חיה indique le nombre d’années vécues avant la naissance mentionnée ensuite. « Vécut » est naturel et fidèle.
- source_word: פֶלֶג
  choice: Péleg
  rationale: Le nom propre est translittéré selon sa forme française courante.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: trente ans
  rationale: L’expression hébraïque indique ici l’âge de Péleg; « trente ans » reproduit naturellement la tournure généalogique sans explicitation superflue.
- source_word: וַיּוֹלֶד
  choice: eut pour fils
  rationale: Dans une généalogie masculine, ילד désigne le fait d’engendrer. « Eut pour fils » est clair en français moderne, conserve la relation paternelle et évite l’archaïsme de « engendra ».
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Cette particule signale le complément d’objet direct défini et n’a pas d’équivalent lexical en français.
- source_word: רְעוּ
  choice: Réou
  rationale: Le nom propre est rendu selon sa translittération française courante.
