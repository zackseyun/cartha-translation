  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: fr
  text: Alors, Yahweh les dispersa de là sur toute la terre[a], et ils cessèrent de bâtir la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à travers toute la terre » ou « partout sur la terre »; littéralement, « sur la face de toute la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: dispersa
  rationale: Le verbe פוץ exprime ici l’action de répandre un groupe en différents lieux. « Dispersa » est naturel en français et convient au contexte où Yahweh met fin au projet collectif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מִשָּׁם
  choice: de là
  rationale: Cette expression locative renvoie directement au lieu de Babel; « de là » est précis et idiomatique.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: sur toute la surface de la terre
  rationale: Cette formulation française restitue l’étendue géographique et conserve l’image hébraïque de la « face » de la terre sous une forme naturelle. « Terre » convient mieux que « pays » à la portée générale du récit.
- source_word: וַיַּחְדְּלוּ
  choice: ils cessèrent
  rationale: Le verbe חדל signifie cesser ou s’arrêter. « Ils cessèrent » est clair, digne et s’emploie naturellement avec l’infinitif qui suit.
- source_word: לִבְנֹת
  choice: de bâtir
  rationale: L’infinitif בנה désigne ici la poursuite des travaux. « Bâtir » convient particulièrement à l’édification d’une ville et suit naturellement « cessèrent de ».
- source_word: הָעִיר
  choice: la ville
  rationale: Le nom défini renvoie à la ville dont la construction est racontée dans le contexte immédiat.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte explicitement le tétragramme. La forme « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit; « bâtir » garde une légère élévation de registre sans être archaïque. La structure coordonnée suit de près la progression de l’hébreu.
