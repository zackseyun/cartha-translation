  text: Réou vécut trente-deux ans, puis il engendra Seroug.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe חיה indique que Réou atteignit l’âge mentionné; le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: רְעוּ
  choice: Réou
  rationale: Cette forme française usuelle du nom propre conserve de façon lisible les voyelles de l’hébreu.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: trente-deux ans
  rationale: Le français moderne place les dizaines avant les unités, tout en conservant exactement la valeur numérique de l’hébreu.
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: À la forme causative, ילד désigne ici l’action masculine de procréer dans une généalogie. « Engendra » est précis, concis et adapté au registre biblique français.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu du complément d’objet direct défini, rendu implicitement par la syntaxe française.
- source_word: שְׂרוּג
  choice: Seroug
  rationale: Translittération française lisible du nom hébreu, avec « ou » pour la voyelle /u/.
