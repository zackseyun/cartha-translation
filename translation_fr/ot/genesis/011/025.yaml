  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir eu Térah, Nahor vécut encore cent dix-neuf ans et eut des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, חיה indique la durée de vie qui se poursuit après la naissance du fils nommé. « Vécut encore » rend explicitement cette continuation en français naturel.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת תֶּרַח
  choice: Après la naissance de Térah
  rationale: La tournure française exprime naturellement la période suivant l’engendrement de Térah, sans recourir à « engendrer », aujourd’hui soutenu ou archaïsant. Le rapport père-fils demeure clair dans le contexte généalogique.
- source_word: תֶּרַח
  choice: Térah
  rationale: Le nom propre suit la forme française biblique courante, avec accent pour guider la prononciation.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: cent dix-neuf ans
  rationale: Le français ordonne naturellement la centaine avant les dizaines et unités; le nombre est écrit en toutes lettres conformément au registre biblique.
- source_word: וַיּוֹלֶד
  choice: eut
  rationale: Dans une notice généalogique, « eut des fils et des filles » est actuel, clair et idiomatique. Il conserve l’idée de descendance sans employer l’archaïsme « engendra ».
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: La traduction conserve la mention explicite des descendants masculins et féminins plutôt que de la généraliser en « enfants ».
