- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Dans une généalogie avec un sujet masculin, ילד désigne l’action de procréer. « Engendra » est précis, concis et bien établi dans le registre généalogique biblique sans être obscur.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d’objet direct défini en hébreu; sa fonction est rendue par la syntaxe française.
- source_word: פָּלֶג
  choice: Péleg
  rationale: Transcription française usuelle du nom hébreu.
