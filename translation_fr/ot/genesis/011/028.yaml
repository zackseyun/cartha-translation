id: GEN.11.28
reference: Genesis 11:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֣מָת הָרָ֔ן עַל פְּנֵ֖י תֶּ֣רַח אָבִ֑י/ו בְּ/אֶ֥רֶץ מוֹלַדְתּ֖/וֹ בְּ/א֥וּר כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: fr
  text: Harân mourut en présence de son père Térah[a], dans son pays natal, à Our des Chaldéens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avant son père Térah », c’est-à-dire du vivant de son père. L’expression hébraïque signifie littéralement « sur la face de ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מות rapporte simplement un événement passé dans le récit ; le passé simple « mourut » convient au registre narratif français.
- source_word: עַל פְּנֵי
  choice: en présence de
  rationale: Cette formulation conserve le caractère concret de l’expression hébraïque et son ambiguïté possible entre la présence personnelle et l’antériorité du décès par rapport à celui du père.
- source_word: תֶּרַח אָבִיו
  choice: son père Térah
  rationale: Cette construction identifie clairement Térah comme le père de Harân et suit l’ordre naturel du français.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: dans son pays natal
  rationale: מוֹלֶדֶת désigne ici le pays d’origine ou de naissance ; « pays natal » est naturel, précis et accessible en français moderne.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: à Our des Chaldéens
  rationale: Our est un nom de lieu, et כַּשְׂדִּים est l’ethnonyme « Chaldéens » ; la préposition « à » est idiomatique en français devant le nom d’une ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsme excessif. La note préserve l’ambiguïté réelle de l’expression hébraïque עַל פְּנֵי.
