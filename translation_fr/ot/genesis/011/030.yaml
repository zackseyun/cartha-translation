  text: וַ/תְּהִ֥י שָׂרַ֖י עֲקָרָ֑ה אֵ֥ין לָ֖/הּ וָלָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: fr
  text: Saraï était stérile ; elle n’avait pas d’enfant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: était
  rationale: La forme narrative de היה introduit ici un état. En français, l’imparfait « était » l’exprime naturellement sans ajouter un marqueur temporel absent du texte hébreu.
- source_word: שָׂרַי
  choice: Saraï
  rationale: Forme française traditionnelle et clairement identifiable du nom personnel שָׂרַי.
- source_word: עֲקָרָה
  choice: stérile
  rationale: L’adjectif désigne l’incapacité d’avoir des enfants. « Stérile » est précis, concis et naturel en français, tandis que « sans enfant » ferait double emploi avec la proposition suivante.
- source_word: אֵין לָהּ
  choice: elle n’avait pas
  rationale: La négation existentielle avec ל et le suffixe féminin exprime idiomatiquement la possession niée ; l’imparfait s’accorde au cadre narratif.
- source_word: וָלָד
  choice: d’enfant
  rationale: Le nom désigne ce qui est né, ici un enfant. Après la négation française, le singulier avec « de » rend naturellement l’énoncé hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le point-virgule conserve le lien explicatif étroit entre la stérilité de Saraï et l’absence d’enfant.
