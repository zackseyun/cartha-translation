  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: fr
  text: Éber vécut encore quatre cent trente ans après avoir engendré Péleg, et il engendra des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, חיה indique qu’Éber continua de vivre après la naissance de Péleg. « Vécut encore » exprime naturellement en français cette durée postérieure.
- source_word: עֵבֶר
  choice: Éber
  rationale: « Éber » est la translittération française usuelle de ce nom propre biblique.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: après avoir engendré Péleg
  rationale: Le hifil de ילד désigne ici l’engendrement paternel. Cette formulation reste précise, concise et adaptée au registre généalogique.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: quatre cent trente ans
  rationale: Le français énonce naturellement les centaines avant les dizaines, sans modifier la durée totale donnée par l’hébreu.
- source_word: וַיּוֹלֶד
  choice: il engendra
  rationale: La répétition de « engendra » conserve le lien lexical avec la première occurrence de ילד et la précision de la formule généalogique.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: L’hébreu mentionne explicitement les descendants des deux sexes; la traduction conserve cette distinction.
