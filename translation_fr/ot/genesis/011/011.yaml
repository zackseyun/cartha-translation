  text: וַֽ/יְחִי שֵׁ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אַרְפַּכְשָׁ֔ד חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Arpakshad, Sem vécut encore cinq cents ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe חיה indique la durée de vie qui suit la naissance mentionnée; le passé simple convient au registre narratif écrit.
- source_word: שֵׁם
  choice: Sem
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת אַרְפַּכְשָׁד
  choice: Après la naissance d’Arpakshad
  rationale: Cette formulation française naturelle exprime exactement la période postérieure à l’engendrement, sans alourdir la phrase par « après qu’il eut engendré ».
- source_word: אַרְפַּכְשָׁד
  choice: Arpakshad
  rationale: Translittération française claire du nom hébreu, avec « sh » pour rendre שׁ et sans graphie anglaise en « ph ».
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: cinq cents ans
  rationale: Expression française usuelle de cette durée.
- source_word: וַיּוֹלֶד
  choice: et eut
  rationale: Dans une généalogie, « eut » rend naturellement l’idée qu’il engendra d’autres enfants; « engendra » serait plus formel mais moins courant en français moderne.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Conserve la mention explicite des descendants masculins et féminins au lieu de la généraliser en « enfants ».
