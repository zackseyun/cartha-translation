source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: fr
  text: Abram et Nahor prirent chacun une femme.[a] La femme d’Abram s’appelait Saraï, et celle de Nahor s’appelait Milka. Milka était fille de Harân, qui était le père de Milka et de Yiska.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prirent pour eux des femmes » ; autrement dit, ils se marièrent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... לָהֶם נָשִׁים
  choice: prirent chacun une femme
  rationale: La tournure conserve l’image hébraïque de « prendre » une femme tout en exprimant naturellement la valeur distributive et personnelle de לָהֶם en français.
- source_word: שֵׁם אֵשֶׁת ...
  choice: la femme de ... s’appelait
  rationale: Cette formulation française naturelle rend fidèlement l’expression hébraïque littérale « le nom de la femme de ... était », sans lourdeur.
- source_word: שָׂרָי
  choice: Saraï
  rationale: Translittération française traditionnelle du nom personnel hébreu.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Translittération usuelle en français, distinguée du nom ultérieur de la reine Milka selon la forme hébraïque.
- source_word: בַּת הָרָן
  choice: fille de Harân
  rationale: Rend directement le lien filial exprimé par בַּת.
- source_word: אֲבִי מִלְכָּה וַאֲבִי יִסְכָּה
  choice: le père de Milka et de Yiska
  rationale: Préserve la répétition sémantique de la filiation et l’identification explicite de Harân comme père des deux femmes.
- source_word: יִסְכָּה
  choice: Yiska
  rationale: Translittération transparente et actuelle du nom hébreu, plutôt que la forme traditionnelle moins proche « Yiska/Isca » selon les éditions.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La première phrase garde l’idiome hébreu « prendre une femme », encore compréhensible en français, avec une note qui en explicite le sens. La seconde évite la répétition pesante de « le nom de la femme de » tout en conservant tous les rapports généalogiques.
