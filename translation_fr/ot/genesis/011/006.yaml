  to: 'Yahweh dit : « Voici : ils forment un seul peuple et parlent tous une seule langue. Voilà ce qu’ils ont commencé à faire. Et maintenant, rien de ce qu’ils projettent de faire ne leur sera impossible[a]. »'
  rationale: 'Révision minimale : « Et maintenant » rend directement וְעַתָּה et maintient la relation logique avec l’observation précédente. Le reste du texte et la note sont conservés, car ils sont fidèles au texte hébreu et idiomatiques en français international moderne.'
