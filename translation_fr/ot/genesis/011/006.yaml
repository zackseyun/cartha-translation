source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: fr
  text: 'Yahweh dit : « Voici : ils forment un seul peuple et parlent tous une seule langue. Voilà ce qu’ils ont commencé à faire. Et maintenant, rien de ce qu’ils projettent de faire ne leur sera impossible[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rien de ce qu’ils projettent de faire ne pourra leur être refusé ».'
    reason: Le verbe hébreu peut évoquer soit l’impossibilité ou l’inaccessibilité, soit ce qui est retenu ou refusé.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin comme un nom propre et suit la couche de consultation du projet, sans le remplacer par un titre.
- source_word: הֵן
  choice: Voici
  rationale: Conserve la fonction présentative et emphatique de la particule dans un français actuel mais digne.
- source_word: עַם אֶחָד
  choice: un seul peuple
  rationale: עַם désigne ici un groupe humain uni plutôt qu’une nation au sens politique; « un seul » souligne l’unité exprimée par אֶחָד.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: parlent tous une seule langue
  rationale: שָׂפָה signifie littéralement « lèvre », mais désigne idiomatiquement la langue; la formulation verbale est naturelle en français et maintient l’accent sur la totalité du groupe.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: Voilà ce qu’ils ont commencé à faire
  rationale: Rend directement l’infinitif avec le hiphil de חלל, « commencer à faire », sans expliciter davantage que l’hébreu la portée future de ce commencement.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: ne leur sera impossible
  rationale: Le niphal de בצר peut exprimer ce qui est inaccessible ou impossible. Cette tournure convient au contexte des capacités rendues possibles par leur unité, tout en signalant en note l’autre nuance lexicale.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: rien de ce qu’ils projettent de faire
  rationale: יזם évoque le fait de concevoir ou de projeter une action; « projeter » est précis et naturel dans ce contexte.
theological_decisions:
- issue: Portée de l’affirmation concernant les capacités humaines
  choice: Présenter, dans le cadre narratif, l’absence d’impossibilité pour les projets d’une humanité unifiée.
  alternative: Comprendre que rien de ce qu’ils projettent ne pourra leur être refusé ou soustrait.
  rationale: La traduction conserve la force de l’affirmation sans en faire une déclaration d’omnipotence humaine, sans approuver leur entreprise et sans résoudre la tension narrative par une précision doctrinale ajoutée.
translation_notes:
  register: Français international moderne, clair et soutenu. Les phrases restent proches de la structure hébraïque, avec une légère reformulation idiomatique pour « une seule langue pour eux tous ». Le nom divin est conservé sous la forme « Yahweh ».
