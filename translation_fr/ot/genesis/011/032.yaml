  text: Térah vécut deux cent cinq ans, puis il mourut à Harân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: Térah vécut
  rationale: L’expression hébraïque « les jours de Térah furent » résume la durée de sa vie. « Térah vécut » rend cet idiome naturellement en français sans en modifier le sens.
- source_word: תֶרַח
  choice: Térah
  rationale: Transcription française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: deux cent cinq ans
  rationale: L’ordre des éléments du nombre hébreu est adapté à l’usage français. « Cent » reste invariable puisqu’il est suivi d’un autre nombre.
- source_word: וַיָּמָת
  choice: puis il mourut
  rationale: Le verbe מות signifie directement « mourir »; le passé simple convient au registre narratif biblique moderne. « Puis » exprime la succession portée par la forme narrative sans surinterpréter le lien temporel.
- source_word: בְּחָרָן
  choice: à Harrân
  rationale: Avec un nom de ville, le français emploie naturellement « à ». La graphie « Harrân » distingue le nom de lieu de celui d’un personnage.
