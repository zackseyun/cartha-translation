  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: fr
  text: 'Ils se dirent les uns aux autres : « Allons ! Faisons des briques et faisons-les cuire à fond. » La brique leur tint lieu de pierre, et le bitume[a] leur tint lieu de mortier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne ici du bitume, une substance naturelle semblable au goudron, utilisée comme liant dans la construction.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: Ils se dirent les uns aux autres
  rationale: Cette tournure française rend naturellement l’expression distributive hébraïque, littéralement « un homme à son prochain », sans laisser entendre que seuls deux individus parlent.
- source_word: הָבָה
  choice: Allons !
  rationale: La particule introduit une exhortation collective. « Allons ! » est idiomatique, actuel et conserve son élan incitatif.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: Faisons des briques
  rationale: Le verbe dénominatif signifie fabriquer des briques. La formulation est précise et naturelle en français.
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: et faisons-les cuire à fond
  rationale: Dans le contexte de la fabrication des briques, « cuire » est plus exact que le simple « brûler » ; « à fond » restitue l’intensification produite par l’infinitif apparenté.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: La brique leur tint lieu de pierre
  rationale: La construction היה + ל exprime ici une substitution fonctionnelle. « Tenir lieu de » préserve le contraste entre la brique fabriquée et la pierre naturelle.
- source_word: הַחֵמָר
  choice: le bitume
  rationale: Le terme désigne ici une substance naturelle goudronneuse ou asphaltique employée dans la construction ; « bitume » est le terme français moderne le plus précis.
- source_word: לַחֹמֶר
  choice: de mortier
  rationale: Dans ce contexte, חֹמֶר désigne la fonction de liant normalement remplie par le mortier, plutôt que la matière précise « argile ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct conserve la vigueur de l’exhortation, tandis que « tint lieu de » exprime avec naturel la substitution des matériaux décrite par l’hébreu.
