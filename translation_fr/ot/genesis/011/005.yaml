  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: fr
  text: Alors Yahweh descendit pour voir la ville et la tour qu’avaient bâties les êtres humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « les fils de l’homme » ; l’expression hébraïque désigne collectivement les êtres humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Alors Yahweh descendit
  rationale: Le verbe ירד signifie « descendre ». Le passé simple convient au récit suivi en français et « alors » rend naturellement la progression narrative du wayyiqtol, sans atténuer l’anthropomorphisme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לִרְאֹת
  choice: pour voir
  rationale: Le verbe ראה signifie directement « voir ». Cette formulation conserve le but exprimé par l’infinitif sans ajouter l’idée plus précise d’une inspection.
- source_word: הָעִיר
  choice: la ville
  rationale: Équivalent français direct et courant de עִיר.
- source_word: הַמִּגְדָּל
  choice: la tour
  rationale: Équivalent français usuel de מִגְדָּל dans ce contexte.
- source_word: אֲשֶׁר בָּנוּ
  choice: qu’avaient bâties
  rationale: Le plus-que-parfait situe naturellement l’activité de construction avant la descente de Yahweh. L’accord au féminin pluriel reprend ensemble « la ville et la tour ».
- source_word: בְּנֵי הָאָדָם
  choice: les fils de l’homme
  rationale: Cette formulation reproduit la forme masculine de l’expression hébraïque et maintient le contraste littéraire entre Yahweh et l’humanité, tandis que la note en explicite la portée collective.
theological_decisions:
- issue: Description anthropomorphique de la descente de Yahweh
  choice: 'Conserver le mouvement concret : « Yahweh descendit »'
  alternative: « Yahweh regarda d’en haut » ou « Yahweh porta son attention sur »
  rationale: L’hébreu décrit concrètement Yahweh comme descendant. La traduction préserve cette tension littéraire et théologique au lieu de la réduire à une abstraction.
- issue: Portée de בְּנֵי הָאָדָם
  choice: « les fils de l’homme » dans le texte principal
  alternative: « les êtres humains », « l’humanité » ou « les hommes »
  rationale: L’expression est masculine dans sa forme, mais collective dans sa portée. Le texte principal en conserve la forme imagée, et la note précise son sens inclusif sans effacer l’expression source.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au registre biblique littéraire sans archaïsme marqué. « Bâtir » maintient une légère élévation de registre tout en restant courant.
