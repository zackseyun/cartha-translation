  yaml_path: translation/ot/genesis/011/022.yaml
  text: Serug lived thirty years and fathered Nahor.
translation:
  language: fr
  text: Seroug vécut trente ans, puis il eut pour fils Nahor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Le verbe חיה au wayyiqtol introduit ici l’indication d’âge dans une généalogie. « Vécut » restitue naturellement la formule hébraïque.
- source_word: שְׂרוּג
  choice: Seroug
  rationale: Nom propre translittéré selon une forme française courante, qui représente la voyelle longue de la première syllabe.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: trente ans
  rationale: Expression hébraïque idiomatique indiquant l’âge ; « trente ans » est naturel et suffisamment clair dans cette formule généalogique.
- source_word: וַיּוֹלֶד
  choice: puis il eut pour fils
  rationale: Le hiphil de ילד exprime ici la paternité dans une généalogie. Cette tournure française actuelle conserve ce rapport sans recourir à l’archaïsme « engendra ».
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct sans équivalent lexical autonome en français ; sa fonction est rendue par la syntaxe.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Nom propre translittéré selon la forme française biblique usuelle.
theological_decisions: []
