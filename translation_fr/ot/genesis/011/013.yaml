  text: וַֽ/יְחִ֣י אַרְפַּכְשַׁ֗ד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֶׁ֔לַח שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Shélah, Arpakshad vécut encore 403 ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, le verbe indique la durée de vie qui se poursuit après la naissance du fils nommé. « Vécut encore » explicite naturellement cette continuité en français.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshad
  rationale: Translittération française proche de la forme hébraïque, sans passer par la forme traditionnelle influencée par le grec « Arphaxad ».
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Après avoir engendré
  rationale: La tournure marque le temps postérieur à la procréation du fils nommé. « Engendré » conserve le sens masculin et généalogique du hiphil de ילד.
- source_word: שֶׁלַח
  choice: Shélah
  rationale: Translittération française de la forme hébraïque, avec un accent facilitant la prononciation de la première syllabe.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 ans
  rationale: L’ordre numérique hébraïque est rendu selon l’usage français, tout en conservant exactement la durée indiquée.
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Dans ce contexte généalogique, le verbe désigne la procréation par le sujet masculin. « Engendra » est précis, digne et cohérent avec la première proposition.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Le français conserve la mention explicite des descendants masculins et féminins plutôt que de la réduire au terme générique « enfants ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe française place la proposition temporelle en tête et ajoute « encore » afin de rendre sans lourdeur l’idée d’une durée de vie postérieure à la naissance de Shélah. Les verbes « engendrer » maintiennent la précision généalogique du texte hébreu.
