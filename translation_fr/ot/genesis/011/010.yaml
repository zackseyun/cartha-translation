  text: אֵ֚לֶּה תּוֹלְדֹ֣ת שֵׁ֔ם שֵׁ֚ם בֶּן מְאַ֣ת שָׁנָ֔ה וַ/יּ֖וֹלֶד אֶת אַרְפַּכְשָׁ֑ד שְׁנָתַ֖יִם אַחַ֥ר הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: fr
  text: Voici la descendance de Sem. Sem avait cent ans lorsqu’il engendra Arpakshad[a], deux ans après le déluge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est aussi traditionnellement transcrit « Arpacshad » ou, d’après sa forme grecque, « Arphaxad ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Voici la descendance de
  rationale: Cette formule structure le livre de la Genèse et introduit ici la lignée issue de Sem. « Voici la descendance de » est naturel en français tout en conservant le sens généalogique.
- source_word: שֵׁם
  choice: Sem
  rationale: Forme française traditionnelle et courante du nom hébreu שֵׁם.
- source_word: בֶּן מְאַת שָׁנָה
  choice: avait cent ans
  rationale: Rend naturellement l’expression hébraïque d’âge, littéralement « fils de cent ans ».
- source_word: וַיּוֹלֶד
  choice: lorsqu’il engendra
  rationale: Le hiphil de ילד désigne ici l’engendrement paternel dans une généalogie. « Engendra » est précis, concis et adapté au registre biblique français.
- source_word: אַרְפַּכְשָׁד
  choice: Arpakshad
  rationale: Translittération directe de la forme hébraïque, avec « sh » pour rendre שׁ de manière immédiatement lisible en français.
- source_word: שְׁנָתַיִם
  choice: deux ans
  rationale: Rend directement la forme duelle hébraïque de « année ».
- source_word: אַחַר הַמַּבּוּל
  choice: après le déluge
  rationale: « Le déluge » est l’expression française courante et reconnue pour le cataclysme raconté en Genèse 6–9.
