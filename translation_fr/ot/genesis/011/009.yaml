id: GEN.11.9
reference: Genesis 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: fr
  text: C’est pourquoi on l’appela Babel[a], car c’est là que Yahweh brouilla la langue de toute la terre, et c’est de là que Yahweh les dispersa sur toute la surface de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Babel évoque en hébreu le verbe balal, qui signifie « brouiller » ou « mélanger » ; ce rapprochement explique ici le nom de la ville.
    reason: Jeu de mots étymologique intraduisible directement en français.
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette tournure française naturelle conserve la valeur déductive et explicative de l’expression hébraïque.
- source_word: קָרָא שְׁמָהּ
  choice: on l’appela
  rationale: Le sujet du verbe n’est pas exprimé en hébreu. Le pronom indéfini « on » préserve cette absence de sujet explicite tout en rendant naturellement la formule de dénomination.
- source_word: בָּבֶל
  choice: Babel
  rationale: Le nom propre traditionnel est conservé. Le jeu de mots hébreu avec בָּלַל ne peut être pleinement reproduit en français et est expliqué en note.
- source_word: כִּי שָׁם
  choice: car c’est là que
  rationale: Cette formulation introduit clairement le motif du nom et met en relief le lieu, comme l’hébreu.
- source_word: בָּלַל
  choice: brouilla
  rationale: Dans ce contexte, le verbe désigne l’action de rendre le langage confus. « Brouilla » est idiomatique et permet de faire légèrement entendre l’effet sonore du jeu de mots avec « Babel ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: la langue de toute la terre
  rationale: שָׂפָה signifie littéralement « lèvre », mais désigne ici la langue ou le langage. Le singulier « la langue » respecte la forme hébraïque et le contexte de 11.1.
- source_word: וּמִשָּׁם
  choice: et c’est de là que
  rationale: Cette tournure reprend l’accent spatial de שָׁם et établit nettement le lien narratif.
- source_word: הֱפִיצָם
  choice: les dispersa
  rationale: Le hiphil de פוץ exprime ici le fait de répandre géographiquement les humains. « Dispersa » est précis et naturel en français.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: sur toute la surface de la terre
  rationale: Cette traduction conserve l’image concrète de la « face » de la terre dans une expression française actuelle, ainsi que la répétition de « toute la terre ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la répétition intentionnelle de « là » et de « toute la terre », tandis que « on l’appela » évite d’ajouter un sujet absent de l’hébreu.
