  text: וַֽ/יְהִ֖י בְּ/נָסְעָ֣/ם מִ/קֶּ֑דֶם וַֽ/יִּמְצְא֥וּ בִקְעָ֛ה בְּ/אֶ֥רֶץ שִׁנְעָ֖ר וַ/יֵּ֥שְׁבוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/002.yaml
  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: fr
  text: Lorsqu’ils partirent de l’est[a], ils trouvèrent une plaine dans le pays de Shinéar et s’y installèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se dirigeaient vers l’est ». L’expression hébraïque peut indiquer soit le lieu d’origine (« de l’est »), soit la direction du déplacement (« vers l’est »).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: Lorsqu’ils partirent
  rationale: La construction introduit la circonstance temporelle, tandis que נסע évoque la levée du camp et le départ. Cette formulation est naturelle en français moderne sans conserver une tournure hébraïque artificielle.
- source_word: מִקֶּדֶם
  choice: de l’est
  rationale: La préposition מן indique le plus naturellement la provenance, mais l’expression peut aussi marquer une direction vers l’est; cette ambiguïté est conservée en note.
- source_word: וַיִּמְצְאוּ
  choice: ils trouvèrent
  rationale: Rendu direct et courant de מצא dans ce contexte.
- source_word: בִקְעָה
  choice: une plaine
  rationale: Le nom désigne une vaste dépression, vallée ou plaine; «plaine» convient au cadre géographique de Shinéar.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: dans le pays de Shinéar
  rationale: «Pays» rend naturellement אֶרֶץ comme désignation géographique, et le toponyme est translittéré.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: et s’y installèrent
  rationale: Dans le contexte d’un déplacement, ישב exprime ici l’établissement durable plutôt que le simple fait de s’asseoir ou d’habiter.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. L’ambiguïté géographique de מִקֶּדֶם est explicitement préservée.
