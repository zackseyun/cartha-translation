  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Réou, Péleg vécut encore deux cent neuf ans et eut des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, חיה indique la durée de vie qui suit l’événement nommé. « Vécut encore » exprime naturellement en français la poursuite de la vie de Péleg après la naissance de Réou.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: Après la naissance de Réou
  rationale: Le hiphil de ילד désigne l’engendrement par le père. La tournure nominale française est naturelle, conserve le rapport temporel et évite le verbe « engendrer », devenu peu courant, sans effacer la place de Péleg dans la formule généalogique.
- source_word: רְעוּ
  choice: Réou
  rationale: Translittération française usuelle du nom hébreu רְעוּ, avec accents facilitant la prononciation.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: deux cent neuf ans
  rationale: L’ordre des éléments numériques est adapté à l’usage français. « Cent » reste invariable puisqu’il est suivi de « neuf ».
- source_word: וַיּוֹלֶד
  choice: eut
  rationale: Dans la seconde partie de la formule généalogique, « eut des fils et des filles » est une expression française actuelle et digne qui communique naturellement la paternité sans recourir à l’archaïsme « engendra ».
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Le français conserve les deux catégories explicitement nommées par l’hébreu plutôt que de les généraliser en « enfants ».
