  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Seroug, Réou vécut encore deux cent sept ans et eut des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, חיה indique que Réou continua de vivre après la naissance mentionnée. « Vécut encore » rend naturellement cette relation temporelle en français.
- source_word: רְעוּ
  choice: Réou
  rationale: Cette forme française traditionnelle et transparente représente le nom hébreu רְעוּ.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: Après la naissance de Seroug
  rationale: Le hiphil de ילד avec un sujet masculin signifie littéralement qu’il engendra Seroug. La tournure nominale française évite le verbe aujourd’hui soutenu « engendrer » tout en conservant clairement le rapport généalogique.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: deux cent sept ans
  rationale: L’ordre numérique est adapté à l’usage français. « Cent » reste invariable puisqu’il est suivi d’un autre nombre.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: eut des fils et des filles
  rationale: Dans ce contexte généalogique, « eut » est une expression française naturelle de la paternité; « fils et filles » préserve les deux catégories explicitement nommées en hébreu.
