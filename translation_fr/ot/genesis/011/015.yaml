  text: וַֽ/יְחִי שֶׁ֗לַח אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת עֵ֔בֶר שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Éber, Shélah vécut encore 403 ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, חיה indique la durée de vie qui suit la naissance mentionnée. « Vécut encore » exprime clairement cette continuation en français naturel.
- source_word: שֶׁלַח
  choice: Shélah
  rationale: Translittération proche de la forme hébraïque, avec des accents facilitant la prononciation française.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: Après avoir engendré Éber
  rationale: Cette formulation conserve le rapport temporel et le sens généalogique causatif de הוליד, tout en restant fluide en français.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 ans
  rationale: L’expression hébraïque signifie littéralement « trois ans et quatre cents ans » ; l’ordre numérique français usuel en donne naturellement le sens.
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Avec un sujet masculin dans une généalogie, ילד désigne le fait d’avoir une descendance. « Engendra » est précis, digne et intelligible.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: La traduction conserve la mention explicite des deux sexes plutôt que de la généraliser en « enfants ».
