  edition: WLC
  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: fr
  text: 'Ils dirent : « Allons ! Bâtissons-nous une ville et une tour dont le sommet est dans le ciel[a], et faisons-nous un nom, de peur que nous ne soyons dispersés sur toute la surface de la terre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dont le sommet atteigne le ciel ». Littéralement : « dont le sommet est dans le ciel ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « éparpillés sur toute la surface de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Allons !
  rationale: Interjection exhortative qui invite à une action commune ; « Allons ! » est naturel en français et conserve la vigueur de l’hébreu.
- source_word: נִבְנֶה לָּנוּ
  choice: bâtissons-nous
  rationale: Le cohortatif pluriel exprime une résolution commune, tandis que לָּנוּ a ici une valeur d’intérêt ou réflexive. « Bâtissons-nous » rend les deux éléments avec concision.
- source_word: עִיר וּמִגְדָּל
  choice: une ville et une tour
  rationale: Ces équivalents usuels ne précisent ni la taille de la ville ni une éventuelle fonction militaire de la tour, que le texte ne donne pas.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: dont le sommet soit dans le ciel
  rationale: La formulation conserve l’image littérale du sommet « dans le ciel » sans ajouter explicitement l’idée d’atteindre le ciel. Le singulier collectif « le ciel » est idiomatique en français.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: et faisons-nous un nom
  rationale: L’expression française maintient l’image hébraïque et sa portée littéraire, plutôt que de la réduire à « acquérons une réputation ».
- source_word: פֶּן נָפוּץ
  choice: de peur que nous ne soyons dispersés
  rationale: פֶּן introduit ici un résultat redouté. La tournure avec « de peur que » et le ne explétif est claire et digne ; le passif rend bien la dispersion subie ou redoutée.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: sur toute la surface de la terre
  rationale: Cette formulation rend l’idiome spatial עַל־פְּנֵי et comprend הָאָרֶץ comme la terre entière dans le cadre universel du récit primordial.
theological_decisions:
- issue: Portée de הָאָרֶץ dans le récit de Babel
  choice: la terre
  alternative: le pays
  rationale: Le contexte primordial de Genèse 11 concerne la dispersion de l’humanité dans le monde habité, plutôt qu’un territoire local précis.
- issue: Image cosmologique de וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: dont le sommet soit dans le ciel
  alternative: dont le sommet atteigne le ciel
  rationale: L’hébreu affirme littéralement que le sommet est « dans le ciel » sans employer de verbe signifiant « atteindre ». La traduction principale préserve cette image et la note signale l’explicitation idiomatique possible.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme marqué. « Allons ! » restitue l’exhortation ; « bâtissons-nous » et « faisons-nous un nom » conservent le parallélisme et la réflexivité du texte. Les deux marqueurs de note figurent dans le corps du verset.
