lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpakshad
  rationale: Le nom propre est translittéré d’après l’hébreu. La conjonction וְ est rendue implicitement par l’enchaînement de la généalogie, conformément à l’usage naturel du français.
- source_word: חַי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe indique l’âge atteint avant la naissance du descendant mentionné; « vécut » reste proche de la forme hébraïque.
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: trente-cinq ans
  rationale: L’ordre numérique hébreu est littéralement « cinq et trente »; l’ordre français courant transmet naturellement la même valeur.
- source_word: וַ/יּוֹלֶד
  choice: puis il engendra
  rationale: La forme causative de ילד signifie ici « devenir le père de / engendrer ». « Engendra » est précis, concis et adapté au registre généalogique; « puis » exprime la succession portée par וַ.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d’objet direct défini et n’a pas d’équivalent lexical nécessaire en français.
- source_word: שָׁלַח
  choice: Shélah
  rationale: Cette forme française translittère le nom hébreu שָׁלַח et rend explicitement la première voyelle; d’autres traditions emploient « Salah ».
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve la cadence généalogique tout en évitant l’ordre numérique sémitique peu naturel en français. Le terme « engendra » est courant dans le registre biblique sans être archaïque au point de nuire à la compréhension.
