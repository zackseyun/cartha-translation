source:
  edition: WLC
  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: fr
  text: Allons ! Descendons là-bas et brouillons leur langue, afin que nul ne comprenne la langue de son prochain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: Allons !
  rationale: Cette interjection exhortative introduit naturellement en français une proposition à la première personne du pluriel.
- source_word: נֵרְדָה
  choice: Descendons
  rationale: Rend directement le cohortatif hébreu et conserve le mouvement vertical du récit.
- source_word: וְנָבְלָה
  choice: et brouillons
  rationale: « Brouiller » exprime ici l’action de rendre la communication confuse ou inintelligible, sans ajouter une interprétation technique.
- source_word: שְׂפָתָם
  choice: leur langage
  rationale: שָׂפָה signifie littéralement « lèvre », mais désigne idiomatiquement la langue ou le langage; « langage » convient au contexte de compréhension mutuelle.
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: ils ne se comprennent plus les uns les autres
  rationale: Cette formulation française idiomatique restitue la construction distributive « un homme [ne comprendra pas] le langage de son prochain » sans employer le masculin marqué « un homme » là où אִישׁ a une valeur distributive.
theological_decisions:
- issue: Le pluriel divin dans « descendons » et « brouillons »
  choice: Conserver la première personne du pluriel sans explication dans le texte
  alternative: Reformuler au singulier ou préciser l’identité des interlocuteurs
  rationale: L’hébreu emploie explicitement des cohortatifs pluriels; le passage ne précise pas ici à qui Dieu s’adresse, et la traduction ne doit pas résoudre cette ambiguïté.
translation_notes:
  register: Français moderne, international et digne. La tournure « les uns les autres » privilégie la fluidité naturelle tout en conservant le sens distributif de l’hébreu.
