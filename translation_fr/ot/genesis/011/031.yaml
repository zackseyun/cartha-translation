  naturalness: Le français est globalement naturel et de registre biblique moderne. « Ils partirent avec eux » demeure volontairement étrange, mais la note explique cette étrangeté qui reflète le texte massorétique. Retirer « avec lui » après « prit » rend la première proposition plus sobre et plus proche de la syntaxe source.
  terminology: Les noms Térah, Abram, Harân, Saraï, Our des Chaldéens et Canaan sont cohérents avec l’usage biblique français. « Belle-fille », « petit-fils » et « s’y établirent » rendent correctement les termes et relations en jeu.
