  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: fr
  text: Térah prit son fils Abram, Lot, fils de Harân et petit-fils de Térah[a], ainsi que sa belle-fille Saraï, femme de son fils Abram. Ils partirent avec eux[b] d’Our des Chaldéens pour se rendre au pays de Canaan. Ils arrivèrent jusqu’à Harân et s’y établirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Lot, fils de Harân, fils de son fils » ; Lot était donc le petit-fils de Térah.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils sortirent avec eux ». Dans le texte hébreu, les référents de « ils » et de « eux » sont difficiles à distinguer.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit avec lui
  rationale: Cette tournure conserve le sens fondamental de « prendre » tout en exprimant naturellement en français qu’il rassemble des membres de sa famille pour le voyage.
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: Lot, fils de Harân et petit-fils de Térah
  rationale: L’hébreu dit littéralement « Lot, fils de Harân, fils de son fils ». La formulation française explicite naturellement le lien avec Térah sans supprimer la filiation par Harân.
- source_word: כַּלָּתוֹ
  choice: sa belle-fille
  rationale: Dans ce contexte, le terme désigne précisément la femme du fils de Térah.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: Ils partirent avec eux
  rationale: Le verbe est au pluriel et le suffixe pronominal signifie « avec eux ». La formulation conserve la difficulté référentielle du texte massorétique plutôt que de la résoudre silencieusement par « ensemble ».
- source_word: מֵאוּר כַּשְׂדִּים
  choice: d’Our des Chaldéens
  rationale: Forme française courante du nom de lieu et du gentilé.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: pour se rendre au pays de Canaan
  rationale: Exprime naturellement le but et la destination indiqués par l’infinitif et le suffixe directionnel.
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: Ils arrivèrent jusqu’à Harân
  rationale: « Jusqu’à » rend la valeur de עַד et souligne que Harân constitue le point atteint.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: s’y établirent
  rationale: Le verbe ישב peut désigner une installation durable; « s’établir » convient au contexte migratoire.
theological_decisions:
- issue: Référents de « ils » et « eux » dans וַיֵּצְאוּ אִתָּם
  choice: Conserver « Ils partirent avec eux » et signaler la difficulté en note
  alternative: « Ils partirent ensemble » ou une formulation où Térah seul emmène le groupe
  rationale: Le texte massorétique présente un verbe pluriel suivi de « avec eux », dont les référents semblent se chevaucher. Une reformulation fluide résoudrait une ambiguïté réelle du texte source.
translation_notes:
  register: Français international moderne, clair et digne. Les noms propres suivent les formes françaises usuelles. La syntaxe est rendue naturelle sans effacer la difficulté pronominale de l’hébreu.
