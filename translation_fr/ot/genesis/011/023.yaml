  text: וַ/יְחִ֣י שְׂר֗וּג אַחֲרֵ֛י הוֹלִיד֥/וֹ אֶת נָח֖וֹר מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: fr
  text: Après être devenu père de Nahor, Seroug vécut encore deux cents ans. Il eut des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, חיה indique la durée de vie qui suit la naissance mentionnée; « vécut encore » rend naturellement cette continuation en français.
- source_word: שְׂרוּג
  choice: Seroug
  rationale: Translittération française traditionnelle et intelligible du nom hébreu.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־נָחוֹר
  choice: Après la naissance de Nahor
  rationale: Le hiphil de ילד exprime ici la paternité de Seroug. La formulation nominale française est naturelle dans une généalogie et n'implique pas que Seroug ait lui-même enfanté.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Translittération française courante du nom hébreu.
- source_word: מָאתַיִם שָׁנָה
  choice: deux cents ans
  rationale: Rend directement la durée exprimée par le nombre cardinal et שָׁנָה.
- source_word: וַיּוֹלֶד
  choice: Il eut
  rationale: Dans la formule généalogique, le hiphil de ילד peut se rendre idiomatiquement par « avoir » des enfants; ce choix évite le terme vieilli « engendra » tout en conservant le sens de paternité.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Préserve la mention explicite des descendants masculins et féminins, plutôt que de la généraliser en « enfants ».
