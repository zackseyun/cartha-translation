  text: Nahor lived twenty-nine years and fathered Terah.
translation:
  language: fr
  text: Nahor vécut vingt-neuf ans, puis il engendra Térah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe חיה indique la durée écoulée avant l’événement suivant; « vécut » en donne une traduction directe et naturelle.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Le nom propre est translittéré selon sa forme française courante.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: vingt-neuf ans
  rationale: L’ordre des nombres est adapté à l’usage français moderne, et le singulier hébreu שָׁנָה après le nombre composé est naturellement rendu par le pluriel « ans ».
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Le hiphil de ילד, dans une généalogie, signifie qu’un homme devient le père de quelqu’un. « Engendra » est concis, digne et précis dans ce contexte.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d’objet direct et n’a pas d’équivalent lexical autonome en français.
- source_word: תָּרַח
  choice: Térah
  rationale: Le nom propre est rendu selon sa forme française biblique courante, avec un accent qui guide la prononciation.
