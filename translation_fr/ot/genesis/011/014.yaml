lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: Shélah
  rationale: Translittération française directe du nom hébreu שֶׁלַח, avec accents facilitant une prononciation naturelle.
- source_word: חַי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe indique la durée vécue avant la naissance mentionnée; le passé simple convient au registre narratif biblique français.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: trente ans
  rationale: Rend directement l’expression hébraïque de durée et indique naturellement l’âge de Shélah lors de l’événement suivant.
- source_word: וַ/יּוֹלֶד
  choice: puis il engendra
  rationale: Le hiphil de ילד exprime ici la paternité dans une généalogie. « Engendra » est concis, précis et reste intelligible en français biblique moderne; « puis » explicite la succession portée par le wayyiqtol.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Marqueur du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: עֵבֶר
  choice: Éber
  rationale: Translittération française usuelle et directe du nom hébreu עֵבֶר.
