  source_fidelity: La formulation « vécut soixante-dix ans, puis » risque en français de présenter soixante-dix ans comme la durée complète de la vie de Térah, alors que l’hébreu indique l’âge atteint avant la notice généalogique. « Avait soixante-dix ans lorsqu’il engendra » rend cette relation plus clairement sans résoudre la question de l’ordre ou de l’espacement des naissances.
