  terminology: « Engendra » convient au registre généalogique et rend היטב ילד dans ce contexte. Les formes « Térah », « Abram », « Nahor » et « Harân » sont cohérentes avec l’usage français biblique. La note est élargie aux trois noms, puisque l’alternative porte sur toute l’énumération.
