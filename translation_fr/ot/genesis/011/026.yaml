  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: fr
  text: Térah avait soixante-dix ans lorsqu’il engendra Abram[a], Nahor et Harân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « devint père d’Abram, de Nahor et de Harân ». Le verbe hébreu employé dans les généalogies n’implique pas que les fils soient nés exactement dans l’ordre où ils sont énumérés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, חיה indique que Térah atteignit l’âge mentionné. « Vécut » reste proche de l’hébreu et convient au registre narratif biblique.
- source_word: שִׁבְעִים שָׁנָה
  choice: soixante-dix ans
  rationale: L’hébreu dit littéralement « soixante-dix ans ». En français, la construction « vécut soixante-dix ans, puis » peut évoquer à tort la durée totale de sa vie; la succession narrative et la note sur le verbe généalogique permettent toutefois de comprendre qu’il s’agit ici de l’âge atteint.
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Dans une généalogie, ילד signifie qu’un homme devient père ou a pour descendants les personnes nommées. « Engendra » est précis et concis, sans décrire un acte maternel d’accouchement.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: Abram, Nahor et Harân
  rationale: Les marqueurs répétés individualisent chaque nom; une énumération française ordinaire en rend naturellement la structure.
- source_word: אַבְרָם
  choice: Abram
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הָרָן
  choice: Harân
  rationale: Translittération française usuelle permettant de distinguer ce nom de personne d’autres formes proches; le ה initial appartient au nom et n’est pas un article à traduire séparément.
theological_decisions:
- issue: Ordre généalogique et portée de l’âge indiqué
  choice: Le texte présente Térah comme ayant atteint soixante-dix ans avant de mentionner qu’il engendra Abram, Nahor et Harân, sans affirmer que l’ordre de la liste est celui des naissances.
  alternative: Comprendre qu’Abram, Nahor et Harân sont énumérés dans leur strict ordre de naissance, ou qu’ils sont tous nés lorsque Térah avait exactement soixante-dix ans.
  rationale: L’hébreu juxtapose l’âge de Térah et la mention des trois fils, mais ne tranche pas à lui seul les questions chronologiques soulevées par les versets suivants. La traduction conserve cette tension sans harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. « Engendra » appartient au registre généalogique biblique sans être archaïque au point d’être obscur. « Puis » explicite la progression du wayyiqtol, tout en évitant d’imposer un ordre de naissance entre les trois fils.
