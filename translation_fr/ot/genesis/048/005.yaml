  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: fr
  text: 'Et maintenant, tes deux fils que tu as eus au pays d’Égypte avant mon arrivée auprès de toi en Égypte sont à moi : Éphraïm et Manassé seront à moi, comme Ruben et Siméon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Autrement dit, Éphraïm et Manassé seront comptés parmi les propres fils de Jacob, avec un statut comparable à celui de Ruben et Siméon.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve le lien avec le discours précédent et introduit avec solennité la nouvelle disposition annoncée par Jacob.
- source_word: שְׁנֵי בָנֶיךָ הַנּוֹלָדִים לְךָ
  choice: tes deux fils qui te sont nés
  rationale: Rend directement le nombre, la possession et le participe passif attributif dans un français naturel et digne.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: au pays d’Égypte
  rationale: Maintient le substantif explicite אֶרֶץ, « pays », sans le réduire au seul nom géographique.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרָיְמָה
  choice: avant mon arrivée auprès de toi en Égypte
  rationale: Dans ce contexte, עַד délimite les fils nés antérieurement à l’arrivée de Jacob. La formulation nominale évite une ambiguïté française sur le sujet de « venir » tout en conservant explicitement le second « Égypte » de l’hébreu.
- source_word: לִי הֵם
  choice: sont à moi
  rationale: Préserve la formulation sobre de l’hébreu et exprime l’intégration des deux fils à la lignée de Jacob sans introduire de terme juridique absent du texte.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: Éphraïm et Manassé
  rationale: Emploie les formes françaises bibliques usuelles des noms propres.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן יִהְיוּ לִי
  choice: seront à moi, comme Ruben et Siméon
  rationale: Rend la comparaison marquée par כ et le caractère déclaratif de l’imparfait יִהְיוּ, sans expliciter au-delà du texte la nature juridique de ce statut.
theological_decisions:
- issue: Nature de la revendication de Jacob sur Éphraïm et Manassé
  choice: Traduire littéralement leur statut par « sont à moi » et « seront à moi »
  alternative: 'Expliciter : « je les adopte comme mes propres fils »'
  rationale: Le verset établit clairement pour Éphraïm et Manassé un statut comparable à celui de Ruben et Siméon, mais n’emploie aucun terme technique pour l’adoption. La traduction conserve donc la portée filiale et successorale implicite sans préciser artificiellement son mécanisme.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition « au pays d’Égypte… en Égypte » est conservée parce qu’elle correspond à la répétition explicite du texte hébreu. La syntaxe reste accessible tout en maintenant la déclaration formelle de Jacob.
