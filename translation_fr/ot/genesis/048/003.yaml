  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל יוֹסֵ֔ף אֵ֥ל שַׁדַּ֛י נִרְאָֽה אֵלַ֥/י בְּ/ל֖וּז בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יְבָ֖רֶךְ אֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: fr
  text: 'Jacob dit à Joseph : « Le Dieu Tout-Puissant[a] m’est apparu à Louz, dans le pays de Canaan, et il m’a béni. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « El Shaddaï ». Traditionnellement traduit par « le Dieu Tout-Puissant » ; la nuance exacte de Shaddaï est discutée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit la séquence narrative. Le passé simple convient au registre narratif français et rend inutile un « et » initial peu naturel ici.
- source_word: אֶל יוֹסֵף
  choice: à Joseph
  rationale: La préposition אֶל introduit naturellement le destinataire du discours.
- source_word: אֵל שַׁדַּי
  choice: le Dieu Tout-Puissant
  rationale: Cette traduction traditionnelle et intelligible rend le titre divin en français; l’article défini convient à l’emploi référentiel. La nuance exacte de שַׁדַּי restant discutée, la forme hébraïque est signalée en note.
- source_word: נִרְאָה אֵלַי
  choice: m’est apparu
  rationale: Le niphal de ראה désigne ici une manifestation visible. Cette formulation française est naturelle sans ajouter l’idée plus interprétative de révélation.
- source_word: בְּלוּז
  choice: à Louz
  rationale: La préposition locative avec un nom de ville se rend idiomatiquement par « à »; « Louz » est la forme française traditionnelle du toponyme.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: dans le pays de Canaan
  rationale: Cette formulation conserve explicitement אֶרֶץ et la précision géographique du texte hébreu.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: et il m’a béni
  rationale: Le sujet demeure Dieu. Le pronom explicite « il » est nécessaire à la fluidité et à la clarté en français.
theological_decisions:
- issue: Traduction du titre divin אֵל שַׁדַּי
  choice: le Dieu Tout-Puissant
  alternative: El Shaddaï
  rationale: Le texte principal traduit le titre afin qu’il soit immédiatement compréhensible, sans prétendre trancher l’étymologie ni la nuance exacte de שַׁדַּי. La translittération est conservée en note pour préserver cette incertitude réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre biblique narratif courant sans archaïsme; la citation reste directe et fluide.
