  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: fr
  text: 'Il m’a dit : « Voici, je te rendrai fécond et je te multiplierai ; je ferai de toi une assemblée de peuples, et je donnerai ce pays à ta descendance après toi, en possession perpétuelle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici, je
  rationale: La formule attire solennellement l’attention sur l’engagement divin à venir ; « Voici, je » conserve cette force tout en restant idiomatique dans un registre biblique digne.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: je te rendrai fécond et je te multiplierai
  rationale: Conserve les deux verbes distincts et leur écho aux bénédictions patriarcales, sans réduire le second à une simple paraphrase démographique.
- source_word: לִקְהַל עַמִּים
  choice: une assemblée de peuples
  rationale: Rend קהל par « assemblée » et maintient le pluriel « peuples », sans préciser artificiellement la nature politique, cultuelle ou ethnique du groupement.
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: à ta descendance après toi
  rationale: « Descendance » rend naturellement le collectif זרע et « après toi » préserve la succession générationnelle exprimée par l’hébreu.
- source_word: אֲחֻזַּת עוֹלָם
  choice: en possession perpétuelle
  rationale: « Possession » exprime le bien détenu durablement ; « perpétuelle » conserve la portée temporelle forte de עוֹלָם sans la commenter.
theological_decisions:
- issue: Portée de la promesse foncière
  choice: « en possession perpétuelle »
  alternative: « comme propriété pour toujours »
  rationale: La traduction conserve telle quelle la force de la promesse, sans en définir ici les modalités, les conditions ou l’accomplissement théologique.
- issue: Identité de l’« assemblée de peuples »
  choice: formulation collective laissée ouverte
  alternative: « une communauté de nations »
  rationale: Le texte ne précise pas davantage la composition ni le statut de cette assemblée ; la traduction évite donc une interprétation confessionnelle ou historique ajoutée.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe parallèle de la promesse est préservée, avec une ponctuation qui facilite la lecture sans effacer la structure hébraïque.
