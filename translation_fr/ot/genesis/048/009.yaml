base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: fr
  text: 'Joseph dit à son père : « Ce sont mes fils, que Dieu m’a donnés ici[a]. » Son père dit : « Amène-les-moi, je te prie[b], et je les bénirai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ce lieu ». L’expression hébraïque peut désigner plus précisément l’endroit où Joseph se trouve.
    reason: lexical_alternative
  - marker: b
    text: Ou « Prends-les pour me les amener, je te prie ». Le verbe hébreu peut aussi être rendu par « prendre » dans cette demande de les conduire auprès de Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אָבִיו
  choice: Joseph dit à son père
  rationale: Le passé simple convient au récit suivi en français et rend naturellement le waw narratif sans lui imposer une nuance temporelle supplémentaire.
- source_word: בָּנַי הֵם
  choice: Ce sont mes fils
  rationale: « Fils » conserve le masculin pluriel précis de l’hébreu, et la tournure présentative est idiomatique en français.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: que Dieu m’a donnés
  rationale: Le passé composé exprime naturellement en français le don passé dont le résultat demeure présent. L’accord « donnés » se fait avec l’antécédent « fils ».
- source_word: בָּזֶה
  choice: ici
  rationale: L’adverbe rend avec concision la valeur déictique de l’expression, qui peut désigner plus explicitement le lieu où se trouve Joseph.
- source_word: קָחֶם נָא אֵלַי
  choice: Amène-les-moi, s’il te plaît
  rationale: Bien que לָקַח puisse signifier « prendre », le mouvement demandé va vers Jacob ; « amène-les-moi » est donc naturel dans ce contexte. « S’il te plaît » rend la particule polie נָא.
- source_word: וַאֲבָרֲכֵם
  choice: afin que je les bénisse
  rationale: Cette proposition exprime naturellement le but de la demande et préserve la nuance volitive de la forme hébraïque.
theological_decisions:
- issue: Référence de אֱלֹהִים dans la déclaration de Joseph
  choice: « Dieu », au singulier, désignant le Dieu d’Israël qui a donné ses fils à Joseph
  alternative: « un dieu » ou « des dieux »
  rationale: Dans le contexte immédiat du récit patriarcal, Joseph attribue la naissance de ses fils à Dieu. Le singulier avec majuscule reflète ce sens contextuel sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Son père dit » explicite le changement de locuteur, là où l’hébreu emploie simplement « il dit », afin d’éviter une ambiguïté référentielle involontaire en français. Les deux marqueurs de note figurent dans le texte.
