  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: fr
  text: Alors Israël étendit sa main droite et la posa sur la tête d’Éphraïm, qui était pourtant le plus jeune, et sa main gauche sur la tête de Manassé. Il croisa ses mains[a], car Manassé était le premier-né.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il dirigea ses mains avec discernement ». L’expression hébraïque peut souligner un positionnement intentionnel et habile ; le contexte indique qu’il s’agissait de les croiser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: étendit
  rationale: Dans ce contexte gestuel, le verbe signifie étendre la main; ce choix est naturel et précis en français.
- source_word: וַיָּשֶׁת
  choice: la posa
  rationale: Le verbe décrit le fait de placer délibérément la main sur la tête.
- source_word: וְהוּא הַצָּעִיר
  choice: qui était pourtant le plus jeune
  rationale: « Pourtant » rend la valeur concessive suggérée par le contexte, où le plus jeune reçoit la main droite.
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: Il croisa ainsi ses mains
  rationale: L’expression hébraïque est difficile, mais la disposition décrite implique un positionnement intentionnel des mains, concrètement leur croisement.
- source_word: כִּי מְנַשֶּׁה הַבְּכֹר
  choice: bien que Manassé soit le premier-né
  rationale: Dans la logique de la phrase, כִּי introduit ici la circonstance qui rend ce geste remarquable. La concession exprime clairement cette relation sans effacer l’ambiguïté lexicale de l’expression précédente.
theological_decisions:
- issue: Sens de שִׂכֵּל אֶת יָדָיו
  choice: Israël croisa intentionnellement ses mains.
  alternative: Israël dirigea ses mains avec discernement ou de manière délibérée.
  rationale: Le contexte immédiat montre que la main droite va vers Éphraïm et la gauche vers Manassé. Le texte souligne ainsi une inversion volontaire de l’ordre attendu, sans lui imposer une interprétation doctrinale ultérieure.
- issue: Relation exprimée par כִּי
  choice: 'Valeur concessive en français : « bien que Manassé soit le premier-né ».'
  alternative: 'Valeur explicative ou causale : « car Manassé était le premier-né ».'
  rationale: La syntaxe hébraïque permet une nuance contextuelle. Ici, la primogéniture de Manassé rend paradoxal le placement des mains plutôt qu’elle ne le motive directement; une note n’est pas nécessaire, car la tension essentielle demeure visible.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « main » conserve le parallélisme hébreu. « Premier-né » préserve la portée culturelle et narrative du droit d’aînesse.
