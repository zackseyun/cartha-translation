  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: fr
  text: Quand Joseph vit que son père avait posé sa main droite sur la tête d’Éphraïm, cela lui déplut[a]. Il saisit alors la main de son père pour la déplacer de la tête d’Éphraïm sur celle de Manassé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cela fut mauvais à ses yeux ».'
    reason: L’hébreu emploie une expression imagée indiquant que le geste déplut à Joseph; la traduction principale privilégie une formulation française naturelle.
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: Quand Joseph vit que
  rationale: La proposition temporelle introduit naturellement la réaction de Joseph, tandis que כִּי présente le contenu de ce qu’il voit.
- source_word: יָשִׁית
  choice: avait posé
  rationale: Le plus-que-parfait exprime clairement que Joseph constate la position déjà donnée à la main; « poser » convient au geste concret.
- source_word: יַד יְמִינוֹ
  choice: sa main droite
  rationale: Rend naturellement le syntagme hébreu tout en conservant l’importance de la main droite dans le geste de bénédiction.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: cela lui déplut
  rationale: Expression française naturelle qui transmet ici le jugement défavorable de Joseph sans suggérer que le geste était moralement mauvais.
- source_word: וַיִּתְמֹךְ
  choice: il saisit
  rationale: Dans ce contexte, תמך désigne le fait de prendre physiquement la main pour la réorienter; « saisit » est précis sans imposer une violence excessive.
- source_word: לְהָסִיר אֹתָהּ
  choice: pour la déplacer
  rationale: Le but n’est pas seulement d’enlever la main, mais de la faire passer d’une tête à l’autre; « déplacer » rend clairement l’ensemble du mouvement.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: de la tête d’Éphraïm sur celle de Manassé
  rationale: La formulation conserve le mouvement depuis Éphraïm vers une position sur la tête de Manassé, tout en évitant une répétition lourde.
