base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: fr
  text: 'Mais son père refusa et dit : « Je le sais, mon fils, je le sais. Lui aussi deviendra un peuple, et lui aussi deviendra grand. Toutefois, son frère cadet deviendra plus grand que lui, et sa descendance deviendra la plénitude des nations[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une multitude de nations ». L’hébreu dit plus littéralement « la plénitude des nations ».
    reason: Alternative lexicale et explicitation de la tournure hébraïque inhabituelle.
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: refusa
  rationale: Le verbe מאן exprime un refus délibéré, et non une simple hésitation ; « refusa » convient au rejet par Jacob du geste de Joseph.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: Je le sais, mon fils, je le sais
  rationale: La répétition emphatique de l’hébreu est conservée ; l’ajout idiomatique de « le » rend la phrase naturelle en français sans préciser davantage l’objet sous-entendu.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: Lui aussi deviendra un peuple
  rationale: « Peuple » rend directement עָם et conserve sa valeur collective, tandis que « deviendra » exprime la perspective future.
- source_word: וְגַם הוּא יִגְדָּל
  choice: et lui aussi deviendra grand
  rationale: La formulation garde le parallélisme et la progression exprimée par גדל.
- source_word: וְאוּלָם
  choice: Toutefois
  rationale: Ce connecteur marque nettement le contraste sans alourdir le registre.
- source_word: אָחִיו הַקָּטֹן
  choice: son frère cadet
  rationale: Dans ce contexte familial, קָטֹן désigne le plus jeune ; « frère cadet » est naturel et précis.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: deviendra plus grand que lui
  rationale: Le comparatif מן indique la supériorité future d’Éphraïm sur Manassé, tout en maintenant la cohérence avec « deviendra grand ».
- source_word: וְזַרְעוֹ
  choice: et sa descendance
  rationale: « Descendance » restitue naturellement en français la valeur collective singulière de זֶרַע.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: deviendra la plénitude des nations
  rationale: Cette traduction conserve le sens lexical inhabituel de מְלֹא (« plénitude ») et l’article de הַגּוֹיִם, sans réduire la formule à l’interprétation plus explicite « multitude de nations ».
theological_decisions:
- issue: Sens de מְלֹא הַגּוֹיִם
  choice: la plénitude des nations
  alternative: une multitude de nations
  rationale: La formulation principale préserve l’expression hébraïque et ses éventuelles résonances intertextuelles sans trancher en faveur d’une simple idée de nombre. Une note donne l’interprétation idiomatique courante.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition emphatique est maintenue, ainsi que le parallélisme des annonces. « Frère cadet » évite l’ambiguïté de « petit frère », et « plénitude des nations » conserve volontairement la tension de l’expression hébraïque.
