  text: וַ/יִּקַּ֣ח יוֹסֵף֮ אֶת שְׁנֵי/הֶם֒ אֶת אֶפְרַ֤יִם בִּֽ/ימִינ/וֹ֙ מִ/שְּׂמֹ֣אל יִשְׂרָאֵ֔ל וְ/אֶת מְנַשֶּׁ֥ה בִ/שְׂמֹאל֖/וֹ מִ/ימִ֣ין יִשְׂרָאֵ֑ל וַ/יַּגֵּ֖שׁ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: fr
  text: 'Joseph les prit tous les deux : tenant Éphraïm de sa main droite, à la gauche d’Israël, et Manassé de sa main gauche, à la droite d’Israël. Puis il les fit approcher d’Israël.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Rend simplement le verbe לקח dans ce geste de placement des deux fils.
- source_word: בִּימִינוֹ / בִשְׂמֹאלוֹ
  choice: de sa main droite / de sa main gauche
  rationale: Le français idiomatique emploie « de sa main » pour indiquer la main avec laquelle Joseph tient ou guide chacun de ses fils.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: à la gauche d’Israël / à la droite d’Israël
  rationale: Le מִן spatial indique ici le côté où chacun est placé par rapport à Israël; « à la gauche/droite » évite le contresens directionnel de « depuis ».
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: Puis il les approcha de lui
  rationale: Le verbe נגש au causatif exprime le fait de faire avancer ou d’amener près; le pronom « lui » renvoie naturellement à Israël.
theological_decisions:
- issue: Disposition d’Éphraïm et de Manassé avant la bénédiction
  choice: Conserver explicitement le croisement des positions selon les mains de Joseph et les côtés d’Israël
  alternative: Simplifier en disant seulement que Joseph plaça les fils devant Israël
  rationale: La disposition précise prépare le geste volontaire d’Israël au verset suivant et doit être préservée sans interprétation ajoutée.
translation_notes:
  register: Français moderne, clair et digne. Deux phrases remplacent une longue coordination afin de conserver la lisibilité tout en maintenant exactement l’ordre des gestes et la disposition spatiale.
