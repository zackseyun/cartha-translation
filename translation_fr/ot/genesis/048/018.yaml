  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: fr
  text: 'Joseph dit à son père : « Pas ainsi, mon père, car celui-ci est le premier-né. Pose ta main droite sur sa tête. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. En français narratif, le passé simple rend naturellement cette succession sans qu’il soit nécessaire de traduire systématiquement le waw par « et ».
- source_word: אֶל אָבִיו
  choice: à son père
  rationale: Rend directement la construction אֶל suivie du nom portant le suffixe de troisième personne du masculin singulier.
- source_word: לֹא כֵן
  choice: Non
  rationale: Dans ce contexte de correction immédiate d’un geste, « Non » est naturel en français moderne. L’adresse « mon père » maintient le respect de Joseph malgré sa protestation.
- source_word: אָבִי
  choice: mon père
  rationale: Le suffixe de première personne du singulier est rendu explicitement, en conservant la forme d’adresse respectueuse.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée par Joseph pour corriger le geste de son père.
- source_word: זֶה
  choice: celui-ci
  rationale: Le démonstratif désigne l’un des deux fils présents et conserve la valeur déictique du geste.
- source_word: הַבְּכֹר
  choice: le premier-né
  rationale: Ce terme indique à la fois l’ordre de naissance et le statut familial associé; « premier-né » préserve mieux cette portée que « l’aîné » seul.
- source_word: שִׂים
  choice: Pose
  rationale: L’impératif concerne le placement de la main sur la tête. « Pose » est direct, naturel et précis dans ce contexte gestuel.
- source_word: יְמִינְךָ
  choice: ta main droite
  rationale: Le contexte exige le sens concret de la main droite; la possession de deuxième personne du masculin singulier est rendue par « ta ».
- source_word: עַל רֹאשׁוֹ
  choice: sur sa tête
  rationale: Expression française courante et exacte pour le geste de bénédiction décrit.
theological_decisions:
- issue: Terme de statut dans le contexte de la bénédiction
  choice: le premier-né
  alternative: l’aîné
  rationale: « Premier-né » conserve la dimension de statut familial et successoral de בְּכוֹר, sans réduire le terme à une simple différence d’âge ni préciser davantage que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. Le tutoiement reflète naturellement la relation filiale et les formes hébraïques de deuxième personne du singulier.
