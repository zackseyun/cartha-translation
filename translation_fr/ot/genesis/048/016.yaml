  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: fr
  text: Que l’ange qui m’a racheté de tout mal[a] bénisse ces garçons ! Qu’ils portent mon nom et le nom de mes pères, Abraham et Isaac[b] ! Qu’ils se multiplient en abondance[c] au milieu du pays[d] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tout malheur », « de tout danger ». Le mot hébreu peut désigner aussi bien le mal que l’adversité ou le tort subi.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Que mon nom et le nom de mes pères, Abraham et Isaac, soient appelés sur eux. » L’expression indique que ces garçons sont rattachés à cette lignée et en portent l’identité.'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu est rare et évoque une croissance très abondante, peut-être à la manière des poissons.
    reason: lexical_alternative
  - marker: d
    text: Ou « au milieu de la terre ». Le mot hébreu peut désigner le pays aussi bien que la terre.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: l’ange
  rationale: מַלְאָךְ peut désigner un messager ou un ange. Dans ce contexte où Jacob évoque la protection divine, « l’ange » est naturel et traditionnel, sans trancher son identité.
- source_word: הַגֹּאֵל אֹתִי
  choice: qui m’a racheté
  rationale: Le participe de גאל présente l’ange comme celui qui agit en rédempteur ou libérateur. Le passé composé convient au regard rétrospectif de Jacob, tandis que « racheté » conserve la nuance propre à la racine.
- source_word: מִכָּל רָע
  choice: de tout mal
  rationale: רָע peut désigner le mal moral, le malheur ou le danger. « Tout mal » maintient cette étendue sémantique.
- source_word: יְבָרֵךְ
  choice: bénisse
  rationale: Dans cette bénédiction, le yiqtol a une valeur jussive, naturellement rendue en français par « que… bénisse ».
- source_word: הַנְּעָרִים
  choice: ces garçons
  rationale: Le terme désigne ici Éphraïm et Manassé. Le démonstratif rend la référence immédiate naturelle en français.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: Que mon nom et le nom de mes pères… soient attachés à eux
  rationale: L’expression hébraïque signifie littéralement que les noms sont « appelés sur eux » et marque leur rattachement à la lignée. « Soient attachés à eux » garde l’image des noms attribués aux descendants tout en restant intelligible.
- source_word: וְיִדְגּוּ לָרֹב
  choice: qu’ils se multiplient en abondance
  rationale: Le verbe rare דגה évoque une multiplication très abondante, probablement avec une résonance liée aux poissons. La formulation française transmet clairement le sens sans imposer une image opaque dans le texte principal.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: au milieu du pays
  rationale: אֶרֶץ peut signifier « pays », « terre » ou « monde ». Le contexte patriarcal et territorial favorise « pays », tout en laissant « terre » comme possibilité.
theological_decisions:
- issue: Identité de « l’ange » dans la bénédiction de Jacob
  choice: Conserver « l’ange » sans préciser son identité ontologique.
  alternative: Comprendre l’ange comme une manifestation de Dieu, ou comme un messager créé agissant en son nom.
  rationale: Le verset associe étroitement Dieu et l’ange dans une même bénédiction, mais ne définit pas explicitement l’identité de l’ange. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases optatives marquées par « Que… ! » rendent le rythme solennel de la bénédiction. Le texte conserve « l’ange » et « tout mal » afin de ne pas résoudre les ambiguïtés théologiques et lexicales de l’hébreu.
