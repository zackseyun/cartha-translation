base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: fr
  text: 'Il les bénit ce jour-là en disant : « C’est par toi[a] qu’Israël bénira en disant : “Que Dieu te rende semblable à Éphraïm et à Manassé !” » Il plaça Éphraïm avant Manassé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est en toi qu’Israël bénira » ; l’expression indique qu’Israël emploiera Éphraïm et Manassé comme modèles dans une formule de bénédiction.'
    reason: Alternative lexicale pour la préposition ב et clarification de l’idiome de bénédiction.
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: Il les bénit
  rationale: Le piel de ברך signifie couramment « bénir » ; le suffixe objet pluriel renvoie ensemble à Éphraïm et Manassé.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle française naturelle qui conserve la précision de l’hébreu.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Formule hébraïque habituelle introduisant des paroles rapportées directement.
- source_word: בְּךָ
  choice: C’est par toi
  rationale: 'La préposition ב avec suffixe singulier exprime ici le moyen ou la référence : la personne désignée sert de modèle à une formule de bénédiction. La note conserve l’autre traduction formellement possible.'
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: qu’Israël bénira
  rationale: L’imparfait hébreu peut décrire un usage futur ou habituel. « Israël » est conservé sans explicitation afin de ne pas restreindre son sens ancestral ou collectif.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: Que Dieu te rende semblable
  rationale: Dans cette formule de bénédiction, la forme verbale exprime un souhait. « Rendre semblable à » restitue naturellement le sens idiomatique de שׂים suivi de la comparaison.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: à Éphraïm et à Manassé
  rationale: Les deux noms servant conjointement de modèles à la comparaison, la coordination française évite une répétition lourde tout en conservant les deux références.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: Il plaça Éphraïm avant Manassé
  rationale: שׂים avec לִפְנֵי indique ici que Jacob accorde à Éphraïm la préséance sur Manassé. « Plaça… avant » garde à la fois l’image de l’ordre et l’idée de priorité.
theological_decisions:
- issue: Référent d’« Israël » dans la formule de bénédiction
  choice: Conserver simplement « Israël »
  alternative: « Jacob » ou « le peuple d’Israël »
  rationale: Le texte hébreu dit seulement « Israël ». Dans le contexte, le mot peut évoquer Jacob et, prophétiquement, le peuple issu de lui. La traduction ne tranche pas cette tension.
- issue: Portée du singulier בְּךָ (« par toi ») après la bénédiction des deux fils
  choice: Conserver le singulier « par toi »
  alternative: Expliciter « par vous » ou « par vos noms »
  rationale: L’hébreu passe du pluriel désignant les deux fils à un suffixe singulier. La traduction maintient cette forme au lieu d’harmoniser silencieusement le nombre, tandis que la formule citée montre qu’Éphraïm et Manassé servent tous deux de modèles.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe solennelle de la formule de bénédiction est conservée sans archaïsmes ; les noms propres suivent les formes françaises usuelles.
