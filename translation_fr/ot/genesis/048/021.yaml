  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: fr
  text: 'Puis Israël dit à Joseph : « Voici, je vais mourir, mais Dieu sera avec vous[a] et vous ramènera au pays de vos pères. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans « avec vous », « vous ramènera » et « vos pères », les formes hébraïques sont au pluriel. Elles peuvent donc viser, au-delà de Joseph seul, sa famille ou ses descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » en restitue naturellement la succession en français moderne.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie ici le nom Israël, qui est conservé plutôt que remplacé par Jacob.
- source_word: הִנֵּה
  choice: Voici
  rationale: Ce marqueur attire l’attention sur la déclaration qui suit ; « Voici » garde une dignité biblique sans être obscur.
- source_word: אָנֹכִי מֵת
  choice: je vais mourir
  rationale: La construction participiale exprime ici une mort imminente, non une mort déjà accomplie.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: mais Dieu sera avec vous
  rationale: Bien que וְ soit formellement conjonctif, le contexte établit un contraste entre la mort prochaine d’Israël et la présence durable de Dieu.
- source_word: עִמָּכֶם
  choice: avec vous
  rationale: Le suffixe hébreu est pluriel ; le français « vous » conserve cette pluralité, précisée en note.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: et vous ramènera
  rationale: 'Le hiphil de שׁוב a un sens causatif : Dieu fera revenir les destinataires.'
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: dans le pays de vos pères
  rationale: Cette formulation suit de près l’expression hébraïque et désigne le pays ancestral promis aux patriarches.
theological_decisions:
- issue: Référent des pronoms pluriels dans la promesse
  choice: Conserver le pluriel « vous » et signaler qu’il dépasse Joseph seul.
  alternative: Comprendre l’adresse comme visant seulement Joseph et ne pas rendre perceptible la pluralité.
  rationale: Les suffixes de « avec vous », « vous ramènera » et « vos pères » sont tous au pluriel ; la traduction préserve ainsi la portée familiale ou collective de la promesse.
- issue: Valeur discursive de וְ devant « Dieu sera avec vous »
  choice: Traduire par l’adversatif « mais ».
  alternative: Traduire formellement par « et ».
  rationale: 'Le simple connecteur hébreu permet ici une valeur contrastive : Israël va mourir, tandis que Dieu demeurera avec les siens. La note n’est pas nécessaire, puisque « mais » exprime clairement le rapport contextuel sans supprimer une ambiguïté théologique substantielle.'
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » conserve la fonction solennelle du marqueur hébreu ; « je vais mourir » exprime clairement l’imminence. Le tutoiement attendu dans la relation familiale reste compatible avec le pluriel « vous », dont la portée est explicitée en note.
