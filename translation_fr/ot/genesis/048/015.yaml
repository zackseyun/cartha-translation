base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: fr
  text: 'Il bénit Joseph et dit : « Le Dieu devant qui mes pères, Abraham et Isaac, ont marché, le Dieu qui est mon berger[a] depuis que j’existe[b] jusqu’à ce jour, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui me fait paître » ou « qui m’a nourri ». Le verbe hébreu évoque les soins, la conduite et la sollicitude continus d’un berger.
    reason: lexical_alternative
  - marker: b
    text: Ou « toute ma vie » ou « depuis ma jeunesse ». L’expression hébraïque remonte aux premiers temps de l’existence de Jacob et souligne que Dieu a pris soin de lui dès le commencement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: Il bénit Joseph
  rationale: Conserve l’objet explicite du texte hébreu, Joseph, sans l’harmoniser avec le contexte où ses fils reçoivent la bénédiction.
- source_word: הָאֱלֹהִים
  choice: Le Dieu
  rationale: L’article hébreu et la construction d’invocation justifient la forme définie et solennelle « Le Dieu ».
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: devant qui ont marché mes pères
  rationale: Préserve l’image biblique d’une vie menée devant Dieu, sous son regard, sans la réduire à la seule idée d’obéissance.
- source_word: הָרֹעֶה אֹתִי
  choice: qui a pris soin de moi comme un berger
  rationale: Exprime en français naturel l’action continue du berger — conduite, protection et subsistance — tout en maintenant explicitement l’image pastorale.
- source_word: מֵעוֹדִי
  choice: depuis le commencement de mon existence
  rationale: Rend l’idée d’une sollicitude divine remontant aux tout premiers temps de la vie de Jacob sans limiter arbitrairement l’expression à sa jeunesse.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: jusqu’à ce jour
  rationale: Équivalent français idiomatique qui marque la continuité jusqu’au moment présent.
theological_decisions:
- issue: L’image patriarcale de la marche devant Dieu
  choice: devant qui ont marché mes pères Abraham et Isaac
  alternative: en présence de qui ont vécu mes pères Abraham et Isaac
  rationale: La formulation retenue garde la métaphore relationnelle et conventionnelle de l’hébreu, sans l’interpréter exclusivement comme obéissance ou fidélité.
- issue: La métaphore de Dieu berger
  choice: le Dieu qui a pris soin de moi comme un berger
  alternative: le Dieu qui a été mon berger
  rationale: La formulation conserve l’image théologiquement significative du berger et met en relief son action continue, sans réduire celle-ci à la seule alimentation.
translation_notes:
  register: Français international actuel, digne et accessible. L’ordre solennel de l’invocation et la métaphore de la marche devant Dieu sont conservés. La virgule finale signale que la bénédiction se poursuit au verset suivant.
