  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֹּ֣אמֶר לְ/יוֹסֵ֔ף הִנֵּ֥ה אָבִ֖י/ךָ חֹלֶ֑ה וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י בָנָי/ו֙ עִמּ֔/וֹ אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: fr
  text: 'Après ces événements, on dit à Joseph[a] : « Voici que ton père est malade. » Il prit alors avec lui ses deux fils, Manassé et Éphraïm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il dit à Joseph » ; le texte hébreu ne précise pas qui parle.'
    reason: La note signale l’indétermination réelle du sujet hébreu, rendue dans le texte par « on ».
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: La formule introduit la suite du récit. « Après ces événements » restitue le lien temporel sans employer une tournure française archaïque telle que « il arriva que ».
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: on dit à Joseph
  rationale: Le verbe hébreu a un sujet masculin singulier non identifié. Le pronom indéfini « on » conserve naturellement en français l’anonymat du locuteur sans en inventer l’identité.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette tournure attire l’attention sur l’état présent du père de Joseph et conserve la force présentative de la particule hébraïque dans un registre digne mais actuel.
- source_word: אָבִיךָ חֹלֶה
  choice: ton père est malade
  rationale: Traduction directe du syntagme nominal décrivant l’état actuel du père de Joseph.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: Il prit alors avec lui ses deux fils
  rationale: « Alors » marque la progression narrative du waw consécutif, tandis que « avec lui » rend explicitement עִמּוֹ.
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Manassé et Éphraïm
  rationale: Formes françaises usuelles des deux noms propres bibliques.
