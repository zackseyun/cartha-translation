  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: fr
  text: Et moi, je te donne une part de plus que tes frères[a], celle que j’ai prise de la main de l’Amorite avec mon épée et mon arc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu שְׁכֶם (shekhem) peut désigner une « épaule », une hauteur ou une part, et faire écho au nom de Sichem ; la phrase peut ainsi évoquer à la fois une part supplémentaire et le lieu qui sera plus tard associé à Joseph.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Et moi
  rationale: Le pronom indépendant renforce le sujet déjà exprimé par le verbe. « Et moi » conserve cette insistance de façon naturelle en français.
- source_word: נָתַתִּי
  choice: je te donne
  rationale: 'Bien que la forme hébraïque soit un accompli, elle peut avoir ici une valeur performative dans la déclaration testamentaire de Jacob : il attribue solennellement cette part à Joseph.'
- source_word: שְׁכֶם אַחַד
  choice: une part
  rationale: Dans ce contexte d’héritage, « une part » exprime le sens le plus probable. Le mot שְׁכֶם garde toutefois des sens concrets et peut faire écho au nom de Sichem ; cette ambiguïté est signalée en note.
- source_word: עַל אַחֶיךָ
  choice: de plus qu’à tes frères
  rationale: 'La préposition marque ici un avantage ou un supplément : Joseph reçoit une part supplémentaire par rapport à ses frères.'
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: celle que j’ai prise
  rationale: Cette formulation rend directement la proposition relative et le verbe לקח sans préciser davantage la nature de l’acquisition.
- source_word: מִיַּד הָאֱמֹרִי
  choice: de la main de l’Amorite
  rationale: La traduction conserve l’image hébraïque de la « main », qui évoque le pouvoir ou la possession, ainsi que le singulier collectif « l’Amorite ».
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: avec mon épée et mon arc
  rationale: La formulation maintient explicitement les deux armes et l’image martiale du texte hébreu.
theological_decisions:
- issue: Sens de שְׁכֶם et rapport possible avec Sichem et la part supplémentaire de Joseph
  choice: Traduire par « une part » dans le texte et signaler en note les sens concrets ainsi que l’écho possible au nom de Sichem.
  alternative: « une hauteur » ou « Sichem, comme part supplémentaire »
  rationale: Le contexte favorise l’idée d’une part d’héritage supplémentaire, mais l’hébreu peut jouer sur les sens de שְׁכֶם et sur le nom de Sichem. La note préserve cette pluralité sans imposer le nom propre dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Et moi » garde l’emphase initiale sans lourdeur ; « de la main de l’Amorite » conserve volontairement l’image et le singulier collectif de l’hébreu.
