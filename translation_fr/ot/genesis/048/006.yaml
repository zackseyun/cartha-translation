    issue: Temps de « que tu engendreras »
    rationale: Le verbe הוֹלַדְתָּ est un parfait (« que tu as engendrés »). Un futur français est possible dans certaines traductions contextuelles, mais il ne reflète pas aussi précisément la forme source et introduit une projection temporelle non explicitement exprimée.
  - severity: low
    issue: « Ils porteront le nom » pour יִקָּרְאוּ
    rationale: La tournure est idiomatique, mais le niphal de קרא est passif (« ils seront appelés »). Employer le passif conserve mieux la formulation et l’ambiguïté du texte source.
  - severity: low
