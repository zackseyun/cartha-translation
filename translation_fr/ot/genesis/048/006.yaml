  verdict: revise
  source_fidelity: La traduction restitue bien l’opposition entre les enfants ultérieurs de Joseph, qui restent à lui, et Éphraïm et Manassé. Toutefois, le parfait hébreu הוֹלַדְתָּ est mieux rendu par « tu as engendrés » que par un futur simple (« tu engendreras »). Le passif « seront appelés » reproduit aussi plus directement יִקָּרְאוּ que « porteront le nom ».
  naturalness: Le français est globalement clair et digne. « Seront appelés du nom de leurs frères » est naturel dans un registre biblique moderne et rend la formulation source plus précisément. La note explicative est reformulée pour éviter l’expression peu idiomatique « sous Éphraïm et Manassé ».
  terminology: « Descendance » rend adéquatement מוֹלַדְתְּךָ sans restreindre indûment le terme; « engendrés » conserve la perspective paternelle; « héritage » convient à נַחֲלָה. Les noms Éphraïm et Manassé sont correctement orthographiés.
  issues:
