  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: fr
  text: Mais ta descendance, que tu as engendrée après eux, sera à toi[a] ; ils seront appelés du nom de leurs frères dans leur héritage.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les enfants que tu as engendrés après eux ». Littéralement : « ta descendance que tu as engendrée après eux ».'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire qu’ils ne recevraient pas de territoire tribal distinct, mais seraient rattachés à Éphraïm et à Manassé pour l’héritage.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: les enfants
  rationale: Dans ce contexte, le terme désigne ceux qui naîtront de Joseph après Éphraïm et Manassé. « Les enfants » est naturel en français et convient mieux ici que le plus large « descendants ».
- source_word: הוֹלַדְתָּ
  choice: que tu engendreras
  rationale: Le hiphil de ילד, adressé à Joseph, exprime le fait d’avoir des enfants. « Engendrer » conserve la perspective paternelle et le registre digne du passage.
- source_word: אַחֲרֵיהֶם
  choice: après eux
  rationale: Le pronom renvoie directement à Éphraïm et Manassé et indique des enfants nés après eux.
- source_word: לְךָ יִהְיוּ
  choice: seront à toi
  rationale: Cette formulation directe exprime leur appartenance familiale à Joseph, par contraste avec Éphraïm et Manassé que Jacob vient de reconnaître comme siens.
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: ils porteront le nom de leurs frères
  rationale: Cette tournure française naturelle conserve l’idée d’être désignés ou comptés sous le nom de leurs frères.
- source_word: אֲחֵיהֶם
  choice: leurs frères
  rationale: Le lien familial littéral est préservé sans expliciter dans le texte les noms d’Éphraïm et de Manassé.
- source_word: יִקָּרְאוּ
  choice: ils porteront le nom
  rationale: Le niphal de קרא signifie littéralement « être appelés ». En français, « porter le nom de » rend naturellement la construction avec עַל שֵׁם tout en gardant son sens d’identification.
- source_word: בְּנַחֲלָתָם
  choice: dans leur héritage
  rationale: נַחֲלָה désigne ici la part territoriale reçue en héritage. La traduction garde la formulation concise et l’ambiguïté du possessif pluriel.
theological_decisions:
- issue: Statut des enfants que Joseph aurait après Éphraïm et Manassé
  choice: Conserver « seront à toi » dans le texte et expliquer en note qu’ils seront rattachés à leurs frères pour l’héritage.
  alternative: Paraphraser dans le texte qu’ils ne formeront pas de tribus distinctes.
  rationale: L’hébreu oppose leur appartenance à Joseph au statut accordé à Éphraïm et Manassé, sans formuler explicitement toutes les conséquences tribales. La note éclaire le contexte sans l’introduire dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Engendrer » maintient la perspective paternelle du verbe hébreu sans employer l’archaïque « procréer ». La tournure « porter le nom de » est idiomatique tout en préservant l’idée juridique et familiale d’être rattaché au nom des frères.
