base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: fr
  text: Quant à moi, lorsque je revenais de Paddân[a], Rachel est morte alors que j’étais auprès d’elle[b], au pays de Canaan, en chemin, alors qu’il restait encore une certaine distance[c] à parcourir avant d’arriver à Éphrata. Je l’ai enterrée là, sur le chemin d’Éphrata, c’est-à-dire Bethléem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte simplement « Paddân » ; « Paddân-Aram », présent dans des passages apparentés, n’est pas écrit ici.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Rachel est morte sur moi ». Cette expression hébraïque peut évoquer sa mort auprès de Jacob aussi bien que le poids personnel de cette perte pour lui.'
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque désigne une étendue de chemin restante, mais ne permet pas d’en préciser exactement la distance.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant précédé de la conjonction marque un changement de thème et met en relief le souvenir personnel de Jacob.
- source_word: בְּבֹאִי מִפַּדָּן
  choice: lorsque je revenais de Paddân
  rationale: L’infinitif construit avec suffixe a ici une valeur temporelle. « Revenais » exprime naturellement le déplacement depuis Paddân sans ajouter « Paddân-Aram », absent du texte hébreu.
- source_word: מֵתָה עָלַי
  choice: Rachel m’est morte
  rationale: Cette tournure française, sobre et personnelle, conserve quelque chose de l’expression hébraïque littérale « est morte sur moi », qui peut évoquer à la fois la proximité de Jacob et le poids de cette mort pour lui, sans trancher entièrement entre les deux.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: au pays de Canaan
  rationale: Cette formulation suit la désignation géographique complète de l’hébreu tout en restant naturelle en français.
- source_word: בַּדֶּרֶךְ
  choice: en chemin
  rationale: Rendu idiomatique de דרך dans un contexte de voyage.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: alors qu’il restait encore une certaine distance à parcourir avant d’arriver à Éphrata
  rationale: כברת ארץ désigne une étendue ou distance indéterminée. La traduction évite de lui attribuer une mesure précise et rend clairement la circonstance temporelle.
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: Je l’ai enterrée là
  rationale: La succession narrative est rendue naturellement en français, et l’adverbe locatif est conservé.
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: sur le chemin d’Éphrata
  rationale: La formulation indique le lieu de l’ensevelissement par rapport à l’itinéraire menant à Éphrata.
- source_word: הִוא בֵּית לָחֶם
  choice: c’est-à-dire Bethléem
  rationale: La proposition explicative identifie Éphrata à Bethléem pour le lecteur.
theological_decisions:
- issue: Portée de l’expression מֵתָה עָלַי
  choice: 'Conserver dans le texte une formulation personnelle mais non exclusivement émotionnelle : « Rachel m’est morte »'
  alternative: « Rachel est morte à mes côtés » ou « Rachel est morte pour mon malheur »
  rationale: L’hébreu peut souligner la proximité de la mort ou son poids personnel pour Jacob. Une traduction exclusivement spatiale ou affective résoudrait une ambiguïté réelle que le texte laisse ouverte.
translation_notes:
  register: 'Français international moderne, digne et accessible. « Rachel m’est morte » est volontairement plus soutenu que la langue courante afin de préserver la densité personnelle et l’ambiguïté de l’idiome hébreu. Les noms propres suivent les formes françaises usuelles : Paddân, Éphrata, Bethléem.'
