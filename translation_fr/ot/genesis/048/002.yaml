  text: וַ/יַּגֵּ֣ד לְ/יַעֲקֹ֔ב וַ/יֹּ֕אמֶר הִנֵּ֛ה בִּנְ/ךָ֥ יוֹסֵ֖ף בָּ֣א אֵלֶ֑י/ךָ וַ/יִּתְחַזֵּק֙ יִשְׂרָאֵ֔ל וַ/יֵּ֖שֶׁב עַל הַ/מִּטָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: fr
  text: 'On informa Jacob en ces termes : « Voici que ton fils Joseph vient auprès de toi. » Israël rassembla ses forces et s’assit sur le lit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: On informa Jacob en ces termes
  rationale: Le sujet de וַיַּגֵּד et de וַיֹּאמֶר n’est pas précisé. La tournure impersonnelle avec « on » le laisse indéterminé, tandis que « en ces termes » représente naturellement en français les deux verbes introducteurs sans lourdeur.
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette formule attire l’attention sur la nouvelle annoncée tout en conservant un registre narratif digne et actuel.
- source_word: בִּנְךָ יוֹסֵף
  choice: ton fils Joseph
  rationale: Traduction directe de la construction possessive et du nom propre.
- source_word: בָּא אֵלֶיךָ
  choice: est venu te voir
  rationale: Le parfait de בוא présente ici une arrivée accomplie et pertinente au moment du récit. « Venir te voir » exprime naturellement en français la venue de Joseph auprès de Jacob dans ce contexte.
- source_word: וַיִּתְחַזֵּק
  choice: rassembla ses forces
  rationale: Le hitpael de חזק décrit l’effort de Jacob malade pour reprendre assez de force afin de se redresser. Cette expression française est plus idiomatique que le calque « se fortifia ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le changement de nom par rapport à « Jacob » est conservé exactement, sans harmonisation.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: s’assit sur le lit
  rationale: La traduction rend directement l’action et son emplacement. Le contexte de maladie permet de comprendre qu’il se redresse pour s’asseoir, sans devoir l’expliciter davantage.
theological_decisions:
- issue: Alternance entre « Jacob » et « Israël » dans le même verset
  choice: Conserver les deux noms dans leur ordre
  alternative: Employer « Jacob » dans tout le verset pour uniformiser le récit
  rationale: L’alternance appartient au texte hébreu et peut avoir une portée littéraire ou théologique. La traduction la préserve sans chercher à l’interpréter.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite à la fois l’archaïsme (« voici, ton fils… » isolé) et les calques hébraïques pesants, tout en conservant le sujet humain indéterminé et le changement intentionnel de nom.
