source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: fr
  text: 'Israël dit à Joseph : « Je ne pensais pas voir ton visage[a], et voici que Dieu m’a fait voir même ta descendance. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque « voir ton visage » signifie ici te voir en personne. On pourrait aussi traduire le début de la phrase : « Je ne m’attendais pas à voir ton visage. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le passé simple fait avancer naturellement le récit en français tout en rendant le wayyiqtol hébreu.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie ici le nom Israël; il n’est donc pas remplacé par Jacob.
- source_word: רְאֹה פָנֶיךָ
  choice: voir ton visage
  rationale: Cette formulation conserve l’image concrète et affective de l’expression hébraïque, qui signifie voir Joseph en personne.
- source_word: לֹא פִלָּלְתִּי
  choice: Je ne pensais pas
  rationale: Dans ce contexte, le verbe exprime ce qu’Israël envisageait ou s’attendait à vivre, et non la prière au sens étroit.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: Cette tournure française rend le marqueur de surprise et le retournement emphatique introduit par l’hébreu.
- source_word: הֶרְאָה אֹתִי
  choice: m’a fait voir
  rationale: La construction causative du verbe ראה est conservée de façon claire et naturelle.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Il s’agit du titre divin courant, distinct du nom propre YHWH.
- source_word: גַּם
  choice: même
  rationale: Le terme souligne que la bénédiction reçue dépasse l’espoir de revoir Joseph.
- source_word: זַרְעֶךָ
  choice: ta descendance
  rationale: Le nom collectif français préserve le caractère collectif singulier de זרע et inclut ici les enfants de Joseph sans limiter artificiellement la portée du terme.
theological_decisions:
- issue: Traduction de אֱלֹהִים dans le récit patriarcal
  choice: Dieu
  alternative: le Seigneur
  rationale: Le texte attribue cette faveur providentielle à Dieu au moyen du titre אֱלֹהִים; employer « le Seigneur » introduirait un autre titre absent de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à la relation entre Israël et son fils Joseph. « Voici que » préserve la surprise du texte sans recourir à une tournure archaïque, tandis que « descendance » garde la valeur collective du terme hébreu.
