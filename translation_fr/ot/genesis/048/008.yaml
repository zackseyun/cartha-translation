  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: fr
  text: 'Quand Israël vit les fils de Joseph, il dit : « Qui sont ceux-ci ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quand … vit
  rationale: Le waw consécutif fait avancer le récit et introduit ici naturellement la parole qui suit; « Quand … vit » en restitue la relation temporelle en français courant.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie « Israël », et non « Jacob »; ce nom est donc conservé.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Il s’agit de la marque de l’objet direct, qui n’a pas d’équivalent autonome en français.
- source_word: בְּנֵי יוֹסֵף
  choice: les fils de Joseph
  rationale: Cette chaîne construite signifie littéralement « les fils de Joseph »; la formulation est également naturelle en français moderne.
- source_word: וַיֹּאמֶר
  choice: il demanda
  rationale: Le verbe signifie littéralement « il dit », mais comme il introduit une question directe, « il demanda » exprime naturellement sa fonction dans ce contexte sans modifier le contenu.
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif porte sur l’identité des personnes présentes.
- source_word: אֵלֶּה
  choice: ceux-ci
  rationale: Le démonstratif pluriel désigne des personnes présentes; « ceux-ci » rend explicitement cette référence personnelle en français.
