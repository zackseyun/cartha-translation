  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: fr
  text: La vue d’Israël était affaiblie par l’âge[a] ; il ne pouvait pas voir. Joseph les fit donc approcher de lui[b]. Israël les embrassa et les serra dans ses bras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Les yeux d’Israël étaient lourds à cause de la vieillesse. » Cette expression signifie que sa vue s’était affaiblie.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit simplement : « il les fit approcher de lui » ; le contexte indique que Joseph fait approcher ses fils d’Israël.'
    reason: source_ambiguity
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: Les yeux d’Israël
  rationale: Le nom « Israël » est conservé comme dans le texte hébreu, plutôt que remplacé par « Jacob ».
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: s’étaient affaiblis avec l’âge
  rationale: Littéralement, les yeux étaient « lourds à cause de la vieillesse » ; en contexte, l’expression décrit une vue fortement diminuée. La formulation française en transmet naturellement le sens tout en signalant l’image littérale en note.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: il ne pouvait plus voir
  rationale: Rend directement l’incapacité visuelle résultant de l’âge ; « plus » exprime naturellement en français la perte de la vue indiquée par le contexte.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: Joseph les fit donc approcher de lui
  rationale: Le verbe au hiphil signifie « faire approcher ». L’hébreu laisse le sujet sous-entendu, mais le contexte immédiat du verset 9 identifie Joseph comme celui qui amène ses fils à Israël. Nommer Joseph évite qu’en français le pronom « il » soit attribué à Israël.
- source_word: וַיִּשַּׁק לָהֶם
  choice: Israël les embrassa
  rationale: Dans ce contexte, « embrasser » rend naturellement l’action de donner un baiser. Le sujet est explicité pour éviter toute confusion après la mention de Joseph.
- source_word: וַיְחַבֵּק לָהֶם
  choice: et les serra dans ses bras
  rationale: Cette expression française actuelle et digne distingue clairement l’étreinte du baiser exprimé par le verbe précédent.
theological_decisions:
- issue: Identité du sujet de וַיַּגֵּשׁ
  choice: Joseph
  alternative: Israël
  rationale: La forme verbale hébraïque ne nomme pas son sujet. Cependant, au verset précédent, Israël demande explicitement à Joseph de lui amener les garçons ; « vers lui » désigne donc Israël, tandis que Joseph accomplit la demande. Une note conserve la particularité formelle de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Les sujets « Joseph » et « Israël » sont explicités là où une succession de pronoms français créerait une ambiguïté trompeuse ; la formulation plus implicite de l’hébreu est conservée en note.
