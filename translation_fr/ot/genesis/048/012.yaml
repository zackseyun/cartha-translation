  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: fr
  text: Puis Joseph les retira d’auprès des genoux de Jacob[a] et se prosterna, le visage contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’avec ses genoux ». Le suffixe renvoie probablement à Jacob dans le contexte. L’expression peut aussi être rendue par « de près de ses genoux »; elle ne précise pas nécessairement que les garçons étaient entre ses genoux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: retira
  rationale: 'Le hiphil de יצא a ici un sens causatif : Joseph fait sortir ses fils de la position qu’ils occupaient près de Jacob. « Les retira » rend naturellement ce mouvement sans en préciser excessivement les modalités.'
- source_word: אֹתָם
  choice: les
  rationale: Le pronom objet renvoie à Éphraïm et Manassé.
- source_word: מֵעִם בִּרְכָּיו
  choice: d’entre les genoux de Jacob
  rationale: L’expression situe les garçons tout près de Jacob dans la scène de bénédiction. « D’entre les genoux » en donne la lecture contextuelle la plus probable; le nom « Jacob » explicite sobrement le référent du suffixe hébreu, ambigu en lui-même.
- source_word: וַיִּשְׁתַּחוּ
  choice: se prosterna
  rationale: La forme de שׁחה désigne un geste profond de révérence. En français, « se prosterna » convient à la posture précisée par la suite.
- source_word: לְאַפָּיו אָרְצָה
  choice: le visage contre terre
  rationale: Cette tournure française naturelle rend l’orientation du visage vers le sol exprimée par l’hébreu, sans atténuer le geste de révérence.
theological_decisions:
- issue: Référent du possessif dans « ses genoux »
  choice: Jacob
  alternative: Joseph
  rationale: Dans le contexte, Joseph éloigne ses fils de Jacob après que celui-ci les a approchés et embrassés. Jacob est donc le référent contextuel le plus naturel, mais l’hébreu emploie seulement un suffixe masculin singulier; la note signale l’explicitation.
translation_notes:
  register: Français international moderne, naturel et digne. « Se prosterna, le visage contre terre » conserve la solennité du geste; la note préserve l’ambiguïté lexicale et pronominale de l’hébreu.
