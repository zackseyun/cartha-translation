base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: fr
  text: Puis il prit du lait caillé[a], du lait et le veau qu’il avait préparé, et les posa devant eux. Il se tenait près d’eux[b], sous l’arbre, tandis qu’ils mangeaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « crème » ou « beurre ». Le terme hébreu désigne un produit laitier épais ; son sens précis varie selon le contexte.
    reason: alternative lexicale
  - marker: b
    text: Littéralement, « au-dessus d’eux ». Ici, l’expression signifie probablement qu’Abraham restait à proximité pour les servir en hôte attentif.
    reason: alternative lexicale
lexical_decisions:
- source_word: חֶמְאָה
  choice: lait caillé
  rationale: Le terme désigne un produit laitier épais, probablement du lait caillé, de la crème ou du beurre selon le contexte. « Lait caillé » convient bien au cadre pastoral ancien et évite d’évoquer trop précisément le beurre de table moderne.
- source_word: חָלָב
  choice: lait
  rationale: Équivalent direct et naturel du nom hébreu courant désignant le lait.
- source_word: וּבֶן הַבָּקָר
  choice: le veau
  rationale: 'Littéralement « fils du gros bétail » : cette expression désigne un jeune bovin. « Le veau » reprend naturellement l’animal précis du verset précédent.'
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’on avait préparé
  rationale: Dans ce contexte alimentaire, עשה signifie préparer. La forme française impersonnelle respecte le fait que, d’après le verset précédent, le serviteur a exécuté la préparation, même si Abraham en est l’initiateur.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: et les plaça devant eux
  rationale: L’expression hébraïque signifie présenter ou déposer les aliments devant les convives. Le pluriel « les » reprend naturellement les différents mets.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: Il se tenait près d’eux
  rationale: Littéralement, Abraham se tient « sur/au-dessus d’eux » ; dans la scène d’hospitalité, l’expression indique vraisemblablement qu’il reste à proximité pour servir ses hôtes, sans suggérer une position dominatrice.
- source_word: תַּחַת הָעֵץ
  choice: sous l’arbre
  rationale: Traduction directe, idiomatique et précise de la locution.
- source_word: וַיֹּאכֵלוּ
  choice: tandis qu’ils mangeaient
  rationale: Cette formulation rend clairement la simultanéité entre la présence attentive d’Abraham et le repas des visiteurs, portée par l’enchaînement narratif hébreu.
theological_decisions:
- issue: Faut-il faire ressortir une interprétation théologique ultérieure de l’identité des visiteurs ?
  choice: Traduire la scène dans ses termes narratifs ordinaires, comme un acte d’hospitalité d’Abraham.
  alternative: Employer un langage plus solennel ou chargé théologiquement afin de suggérer explicitement le statut divin des visiteurs.
  rationale: Le verset décrit directement le service offert aux visiteurs. La traduction ne doit pas introduire une lecture christologique ou trinitaire que cette phrase, prise isolément, n’explicite pas.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple porte les actions successives du récit, tandis que l’imparfait décrit la posture continue d’Abraham et le déroulement du repas. « Lait caillé » conserve la couleur pastorale sans imposer une identification trop étroite du produit laitier.
