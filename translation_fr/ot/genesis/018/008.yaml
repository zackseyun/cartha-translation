  source_fidelity: La traduction rend correctement la succession narrative, les aliments, le jeune bovin, la présentation devant les visiteurs, la posture d’Abraham sous l’arbre et leur repas. Toutefois, « qu’on avait préparé » efface le sujet singulier implicite du verbe hébreu, Abraham. Le contexte précédent peut expliquer matériellement l’intervention d’un serviteur, mais ne justifie pas de neutraliser le sujet que le texte attribue à Abraham.
  naturalness: Le français est globalement naturel et de registre approprié. « Il se tenait près d’eux » et « tandis qu’ils mangeaient » sont fluides. « Il avait préparé » est également idiomatique dans ce contexte alimentaire.
  terminology: « Lait caillé » est un choix défendable pour חֶמְאָה, à condition de signaler que le référent exact demeure discuté (crème, beurre ou produit laitier épais). « Veau » convient à בֶן־הַבָּקָר. La note sur עֲלֵיהֶם préserve utilement le sens littéral sans imposer une lecture dominante.
