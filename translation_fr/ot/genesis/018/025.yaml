  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: fr
  text: 'Loin de toi l’idée de faire une chose pareille : faire mourir le juste avec le méchant, si bien que le juste serait comme le méchant ! Loin de toi ! Le Juge de toute la terre ne rendra-t-il pas justice ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לְּךָ
  choice: Loin de toi l’idée
  rationale: Expression française idiomatique et digne qui rend la vive répudiation exprimée par l’interjection hébraïque, sans suggérer une simple distance physique.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: d’agir ainsi
  rationale: Rend naturellement « faire une chose pareille » dans ce contexte, tout en conservant la condamnation de l’acte envisagé.
- source_word: לְהָמִית
  choice: faire mourir
  rationale: Reflète la valeur causative du hifil de מות et convient au cadre judiciaire du passage.
- source_word: צַדִּיק ... רָשָׁע
  choice: le juste ... le méchant
  rationale: Conserve le contraste moral et judiciaire des deux termes hébreux au singulier représentatif.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: en traitant le juste comme le méchant
  rationale: 'Explicite naturellement en français le résultat implicite : le même sort serait réservé au juste et au méchant. La comparaison et la protestation morale restent intactes.'
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: Le Juge de toute la terre
  rationale: Le participe substantivé fonctionne ici comme un titre divin, et « toute la terre » en préserve la portée universelle.
- source_word: מִשְׁפָּט
  choice: ce qui est juste
  rationale: Dans cette question rhétorique, le terme désigne l’action conforme à la justice, et non seulement l’acte de prononcer un jugement.
theological_decisions:
- issue: La hardiesse de l’appel d’Abraham à la justice de Dieu
  choice: Le Juge de toute la terre ne fera-t-il pas ce qui est juste ?
  alternative: Le Juge de toute la terre n’exercera-t-il pas la justice ?
  rationale: La formulation conserve la question rhétorique, qui appelle une réponse affirmative, ainsi que l’appel direct au caractère juste de Dieu, sans atténuer la hardiesse d’Abraham.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La répétition de « Loin de toi » reproduit l’insistance de l’hébreu. « Faire mourir » et « ce qui est juste » maintiennent le registre judiciaire tout en restant accessibles.
