  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: fr
  text: 'Ils lui demandèrent : « Où est Sara, ta femme ? » Il répondit : « Là, dans la tente. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils lui demandèrent
  rationale: Le verbe אָמַר signifie littéralement « dire », mais il introduit ici une question directe. « Demandèrent » est donc naturel en français et exprime fidèlement la fonction de la parole, tandis que le passé simple convient au récit suivi.
- source_word: אֵלָיו
  choice: lui
  rationale: La préposition אֶל avec le suffixe masculin singulier indique que les interlocuteurs s’adressent à Abraham.
- source_word: אַיֵּה
  choice: Où est
  rationale: Cet adverbe interrogatif porte sur le lieu ; le français exige ici le verbe « être ».
- source_word: שָׂרָה
  choice: Sara
  rationale: Forme française courante du nom propre biblique.
- source_word: אִשְׁתֶּךָ
  choice: ta femme
  rationale: Le nom אִשָּׁה avec le suffixe masculin singulier de deuxième personne désigne sans ambiguïté l’épouse d’Abraham. Le tutoiement correspond à l’adresse directe au singulier.
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Littéralement « il dit » ; dans cet échange question-réponse, « répondit » est l’équivalent français le plus naturel sans ajouter de contenu.
- source_word: הִנֵּה
  choice: Là
  rationale: La particule déictique attire l’attention sur la localisation. Dans cette réponse brève à « Où est… ? », « Là » conserve sa force mieux qu’une phrase explicitée comme « Elle est », tandis que « Voici » serait peu idiomatique pour une personne située dans la tente.
- source_word: בָאֹהֶל
  choice: dans la tente
  rationale: La préposition בְּ et le nom défini אֹהֶל indiquent simplement l’intérieur de la tente.
theological_decisions:
- issue: Alternance entre le sujet pluriel de וַיֹּאמְרוּ et le sujet singulier de וַיֹּאמֶר
  choice: Conserver « Ils… Il… »
  alternative: Harmoniser les deux prises de parole au singulier ou au pluriel
  rationale: Le texte hébreu passe réellement du pluriel au singulier. La traduction maintient cette tension narrative sans préciser lequel des visiteurs répond ni imposer une interprétation théologique de leur identité.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple donne au récit écrit une fluidité naturelle. La réponse elliptique « Là, dans la tente » reproduit la brièveté et la valeur déictique de l’hébreu sans tournure archaïque.
