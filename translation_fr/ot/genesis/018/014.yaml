  variant: modern international French
source:
  edition: WLC
  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: fr
  text: Y a-t-il quoi que ce soit de trop difficile pour Yahweh ? Au temps fixé, je reviendrai vers toi, à la même époque l’année prochaine[a], et Sara aura un fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression hébraïque difficile, littéralement « comme au temps de la vie ». Elle désigne vraisemblablement la même époque l’année suivante.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: de trop difficile
  rationale: Le niphal de פלא peut désigner ce qui est extraordinaire, merveilleux ou hors de portée. Dans cette question rhétorique, « trop difficile » exprime naturellement l’idée de ce qui dépasserait la capacité de Yahweh, sans renforcer le texte jusqu’à « impossible ».
- source_word: מֵיְהוָה
  choice: pour Yahweh
  rationale: Avec פלא, la préposition מן marque ici la limite ou la comparaison. Le français idiomatique demande « trop difficile pour Yahweh ».
- source_word: דָּבָר
  choice: quoi que ce soit
  rationale: דָּבָר peut signifier une chose, une affaire ou une parole. Dans cette interrogation générale, « quoi que ce soit » en conserve la portée large et sonne naturellement en français.
- source_word: לַמּוֹעֵד
  choice: Au temps fixé
  rationale: מוֹעֵד désigne un moment déterminé ou fixé. Cette formulation concise préserve l’idée d’une échéance établie.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: je reviendrai vers toi
  rationale: שׁוב exprime ici le retour, et אֵלֶיךָ vise Abraham au masculin singulier. « Vers toi » rend explicitement la préposition directionnelle sans alourdir la phrase.
- source_word: כָּעֵת חַיָּה
  choice: à la même époque l’année prochaine
  rationale: L’expression hébraïque, littéralement liée au « temps de la vie », est difficile. Le contexte indique la même saison au retour de l’année; la traduction idiomatique est éclairée par une note.
- source_word: וּלְשָׂרָה בֵן
  choice: et Sara aura un fils
  rationale: La proposition hébraïque est sans verbe exprimé, mais le contexte prospectif appelle naturellement le futur possessif en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin et suit la convention fournie, sans le remplacer par un titre.
- issue: Portée de la question rhétorique
  choice: Y a-t-il quoi que ce soit de trop difficile pour Yahweh ?
  alternative: Y a-t-il quoi que ce soit de trop merveilleux pour Yahweh ?
  rationale: « Trop difficile » met en relief la capacité de Yahweh à accomplir la promesse sans transformer le propos en l’énoncé plus absolu « rien n’est impossible ». La nuance « merveilleux/extraordinaire » reste authentiquement possible et mérite d’être signalée.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique reste directe; « temps fixé » garde une légère solennité biblique sans archaïsme. La variante lexicale de פלא est conservée dans les décisions plutôt que multipliée dans le texte; l’unique appel de note [a] éclaire l’idiome temporel obscur.
