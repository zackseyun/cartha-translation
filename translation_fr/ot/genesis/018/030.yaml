  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: fr
  text: 'Alors Abraham dit : « Je t’en prie, mon Seigneur[a], ne te mets pas en colère, et permets-moi de parler. Peut-être s’en trouvera-t-il trente là-bas. » Le Seigneur répondit : « Je ne le ferai pas si j’en trouve trente là-bas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon seigneur ». Le titre hébreu est une adresse respectueuse; la majuscule est employée ici parce que le contexte identifie le destinataire au Seigneur.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: Que mon Seigneur ne se mette pas en colère, je t’en prie
  rationale: La tournure rend à la fois la défense אַל, la particule de politesse נָא et l’idiome חרה exprimant la colère, dans un français naturel et respectueux.
- source_word: לַאדֹנָי
  choice: mon Seigneur
  rationale: Le titre porte le suffixe de première personne (« mon »). Dans ce contexte théophanique, Abraham s’adresse à l’interlocuteur divin; la majuscule indique ce référent sans substituer le nom divin au titre hébreu.
- source_word: וַאֲדַבֵּרָה
  choice: si je parle encore
  rationale: Le cohortatif exprime ici une demande déférente de poursuivre la parole. La proposition avec « si » restitue naturellement en français la prudence d’Abraham; « encore » explicite la continuité évidente du dialogue.
- source_word: אוּלַי יִמָּצְאוּן שָׁם שְׁלֹשִׁים
  choice: Peut-être s’en trouvera-t-il trente là-bas
  rationale: « Peut-être » conserve la valeur tentative de אוּלַי; la construction impersonnelle pronominale rend naturellement le niphal passif de מצא, tandis que « en » renvoie aux justes recherchés dans le contexte.
- source_word: לֹא אֶעֱשֶׂה
  choice: Je ne le ferai pas
  rationale: L’objet demeure implicite en hébreu et renvoie à l’action destructrice envisagée; le pronom « le » produit une phrase française idiomatique sans préciser davantage cette action.
- source_word: אִם אֶמְצָא שָׁם שְׁלֹשִׁים
  choice: si j’en trouve trente là-bas
  rationale: La condition simple est conservée. Le pronom « en » reprend les personnes justes visées par la négociation sans ajouter le substantif au texte.
theological_decisions:
- issue: Référent et graphie de אֲדֹנָי dans l’adresse d’Abraham
  choice: mon Seigneur
  alternative: mon seigneur
  rationale: Le contexte présente Abraham s’adressant à l’interlocuteur divin. La majuscule française signale ce référent, tout en conservant le titre et sans introduire le nom d’alliance absent de la forme hébraïque.
- issue: Identification des deux locuteurs dans la narration
  choice: Abraham dit / Le Seigneur répondit
  alternative: il dit / il répondit
  rationale: Le sujet des deux verbes est seulement pronominal en hébreu, mais les référents sont établis par le contexte immédiat. Les noms évitent en français une ambiguïté artificielle entre les interlocuteurs, sans modifier le contenu du dialogue.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le ton suppliant d’Abraham est préservé, de même que la brièveté de la réponse divine. Aucun vocabulaire confessionnel spécialisé n’est ajouté.
