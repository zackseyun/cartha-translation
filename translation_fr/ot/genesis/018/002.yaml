base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: fr
  text: 'Il leva les yeux et regarda : voici que trois hommes se tenaient près de lui[a]. Lorsqu’il les vit, il courut de l’entrée de la tente à leur rencontre et se prosterna jusqu’à terre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à côté de lui » ; la préposition hébraïque peut indiquer une très grande proximité.
    reason: lexical_alternative
  - marker: b
    text: Le geste décrit une profonde prosternation jusqu’à terre ; le verbe ne signifie pas nécessairement, à lui seul, « adorer ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Il leva les yeux
  rationale: Cette formulation française naturelle conserve l’image concrète de l’idiome hébreu sans la réduire au simple verbe « regarder ».
- source_word: וַיַּרְא
  choice: et regarda / Dès qu’il les vit
  rationale: Le premier emploi exprime l’attention visuelle après qu’Abraham a levé les yeux; le second introduit naturellement sa réaction immédiate, tout en conservant le jeu de répétition du verbe hébreu par deux verbes français apparentés dans le sens.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Ce marqueur présente vivement ce qui apparaît au regard d’Abraham; « voici que » garde cette force narrative dans un français actuel et digne.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: trois hommes
  rationale: Le nom hébreu désigne explicitement des hommes; cette traduction préserve la présentation narrative du verset.
- source_word: נִצָּבִים עָלָיו
  choice: se tenaient près de lui
  rationale: Le participe indique une position debout et la préposition peut marquer une grande proximité. « Près de lui » évite de suggérer sans nécessité qu’ils le dominaient physiquement.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: il courut … à leur rencontre
  rationale: Le verbe désigne bien le fait de courir et souligne l’empressement concret d’Abraham.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: depuis l’entrée de la tente
  rationale: « Entrée » rend naturellement le terme hébreu désignant l’ouverture de la tente; « depuis » marque clairement le point de départ.
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: se prosterna jusqu’à terre
  rationale: La formule restitue le geste physique d’abaissement profond sans décider qu’il s’agit nécessairement d’un acte cultuel.
theological_decisions:
- issue: Le geste d’Abraham constitue-t-il explicitement une adoration adressée à une figure divine ?
  choice: se prosterna jusqu’à terre
  alternative: adora
  rationale: Le verbe hébreu peut décrire une prosternation respectueuse devant des humains aussi bien qu’un geste d’adoration devant Dieu. Puisque le verset présente d’abord « trois hommes », traduire par « adora » trancherait prématurément une tension interprétative que le texte laisse encore ouverte.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » conserve la vivacité du récit biblique sans archaïsme excessif. La syntaxe reste fluide pour un lectorat général, tandis que les notes préservent les ambiguïtés lexicales et théologiques du texte hébreu.
