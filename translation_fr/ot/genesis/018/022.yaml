  text: וַ/יִּפְנ֤וּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּלְכ֖וּ סְדֹ֑מָ/ה וְ/אַ֨בְרָהָ֔ם עוֹדֶ֥/נּוּ עֹמֵ֖ד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: fr
  text: Alors les hommes se détournèrent et partirent vers Sodome[a], mais Abraham se tenait encore devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins anciens lisent : « et Yahweh se tenait encore devant Abraham ». Le texte hébreu massorétique lit : « mais Abraham se tenait encore devant Yahweh ».'
    reason: Variante textuelle concernant le sujet et le complément de la proposition finale.
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: se détournèrent
  rationale: Le verbe פנה indique ici un changement de direction suivi d’un départ. « Se détournèrent » rend naturellement ce mouvement sans ajouter d’interprétation.
- source_word: מִשָּׁם
  choice: de là
  rationale: Cette expression locative rend directement et idiomatiquement l’hébreu.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le récit les désigne simplement comme des « hommes ». Cette formulation préserve la désignation de surface sans préciser leur identité céleste dans le texte.
- source_word: וַיֵּלְכוּ
  choice: allèrent
  rationale: הלך est le verbe courant pour aller ou marcher ; « allèrent » convient au mouvement narratif vers Sodome.
- source_word: סְדֹמָה
  choice: en direction de Sodome
  rationale: Le hé directionnel attaché au nom de lieu exprime le mouvement vers Sodome. « En direction de » en conserve explicitement la nuance.
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: se tenait encore
  rationale: Le participe avec עוֹדֶנּוּ décrit une situation qui se prolonge. « Se tenait encore » est naturel en français et conserve l’idée de continuité.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » garde à la fois la valeur spatiale et la notion de présence exprimées par לִפְנֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve sa fonction de nom propre sans importer une substitution traditionnelle par un titre.
- issue: Forme textuelle de la proposition finale
  choice: Abraham se tenait encore devant Yahweh
  alternative: Yahweh se tenait encore devant Abraham
  rationale: Le texte massorétique fourni place Abraham comme sujet devant Yahweh. Une tradition textuelle ancienne conserve l’ordre inverse ; cette variante importante est signalée en note sans remplacer le texte source retenu.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « tandis que » marque le contraste entre le départ des hommes et la présence persistante d’Abraham. Le nom « hommes » et la variante textuelle sont conservés sans résolution interprétative.
