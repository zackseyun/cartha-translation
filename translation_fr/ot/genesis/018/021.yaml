revisions:
- from: Je vais donc descendre pour voir s’ils ont agi en tout conformément à la clameur qui m’est parvenue à son sujet[a]. Sinon, je le saurai.
  to: Je vais maintenant descendre et voir s’ils ont agi tout à fait conformément à la clameur[a] qui m’est parvenue ; sinon, je le saurai.
  rationale: La révision remplace l’inférentiel « donc » par « maintenant », rend l’enchaînement verbal hébreu sans expliciter davantage l’enquête, et évite un pronom français sans antécédent. La note, ancrée à « clameur », préserve explicitement l’ambiguïté référentielle et explique l’idiome de complétude sans imposer une lecture doctrinale ou judiciaire.
