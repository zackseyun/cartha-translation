  text: אֵֽרֲדָה נָּ֣א וְ/אֶרְאֶ֔ה הַ/כְּ/צַעֲקָתָ֛/הּ הַ/בָּ֥אָה אֵלַ֖/י עָשׂ֣וּ כָּלָ֑ה וְ/אִם לֹ֖א אֵדָֽעָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: fr
  text: Je vais maintenant descendre et voir s’ils ont agi tout à fait conformément à la clameur[a] qui m’est parvenue ; sinon, je le saurai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon sa clameur qui est venue jusqu’à moi ». Le suffixe féminin (« sa ») renvoie probablement à la ville évoquée dans le contexte ; la construction peut désigner soit la clameur qui monte de la ville, soit celle qui s’élève contre elle. L’expression hébraïque rendue par « ils ont agi tout à fait conformément à » demande si les faits correspondent pleinement à cette clameur.'
    reason: Ambiguïté du suffixe et idiome hébreu
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: Je vais donc descendre
  rationale: Le cohortatif exprime la résolution du locuteur. « Je vais descendre » la rend naturellement en français ; « donc » donne ici à נָא une valeur discursive sans en faire une demande polie.
- source_word: וְאֶרְאֶה
  choice: pour voir
  rationale: Dans ce contexte, ראה signifie voir afin de vérifier. La tournure finale « pour voir » est naturelle en français et conserve l’image narrative de l’examen.
- source_word: הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי
  choice: conformément à la clameur qui m’est parvenue à son sujet
  rationale: צעקה désigne une clameur suscitée par une injustice grave. Le suffixe féminin peut être compris comme renvoyant à la ville et, dans ce contexte, comme indiquant la clameur à son sujet ; la note signale que la construction hébraïque demeure plus ambiguë.
- source_word: עָשׂוּ כָּלָה
  choice: ils ont agi en tout conformément à
  rationale: L’expression associe le verbe « faire » à l’idée d’achèvement. Cette formulation française indique que les faits correspondraient pleinement à la clameur, tout en conservant le sujet pluriel indéfini.
- source_word: וְאִם לֹא אֵדָעָה
  choice: Sinon, je le saurai
  rationale: La formule rend directement le contraste conditionnel et le cohortatif de ידע, sans expliciter la manière dont Dieu acquerra cette connaissance.
theological_decisions:
- issue: Présentation anthropomorphique de l’enquête divine
  choice: Conserver que Dieu « descend » pour « voir » et qu’ensuite il « saura »
  alternative: Paraphraser par « j’examinerai » ou « je jugerai », afin d’écarter l’anthropomorphisme
  rationale: Le récit emploie délibérément un langage humain à propos de l’action divine. La traduction maintient cette tension au lieu de l’harmoniser avec une formulation doctrinale sur l’omniscience.
translation_notes:
  register: Français international actuel, digne et accessible. « Clameur » conserve la gravité judiciaire de צעקה ; la syntaxe a été légèrement réorganisée pour être idiomatique en français sans atténuer le caractère anthropomorphique du récit.
