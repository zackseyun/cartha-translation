id: GEN.18.1
reference: Genesis 18:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: fr
  text: Yahweh lui apparut près des grands arbres de Mamré[a], tandis qu’il était assis à l’entrée de la tente, dans la chaleur du jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près des chênes de Mamré » ou « près des térébinthes de Mamré ». Le terme hébreu désigne de grands arbres, mais l’espèce exacte est incertaine.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה exprime ici une manifestation visible. « Apparut » reste concret et naturel, sans expliciter davantage le mode de cette manifestation.
- source_word: אֵלָיו
  choice: lui
  rationale: Rend directement la préposition avec suffixe masculin singulier, qui renvoie à Abraham dans le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: בְּאֵלֹנֵי
  choice: près des grands arbres
  rationale: Le terme peut désigner des chênes ou des térébinthes. Une formulation générique dans le texte principal préserve l’incertitude botanique réelle de l’hébreu.
- source_word: מַמְרֵא
  choice: Mamré
  rationale: Translittération française usuelle du nom propre.
- source_word: וְהוּא יֹשֵׁב
  choice: tandis qu’il était assis
  rationale: La proposition participiale pose l’arrière-plan de l’apparition; cette tournure le rend naturellement en français.
- source_word: פֶּתַח הָאֹהֶל
  choice: à l’entrée de la tente
  rationale: Traduction concrète et idiomatique de l’ouverture ou de l’entrée de la tente.
- source_word: כְּחֹם הַיּוֹם
  choice: dans la chaleur du jour
  rationale: Conserve l’expression temporelle imagée sans préciser indûment qu’il s’agit exactement de midi ou du moment le plus chaud.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la sobriété de l’hébreu et son ambiguïté botanique; la note présente les identifications traditionnelles possibles.
