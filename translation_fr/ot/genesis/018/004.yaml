  text: יֻקַּֽח נָ֣א מְעַט מַ֔יִם וְ/רַחֲצ֖וּ רַגְלֵי/כֶ֑ם וְ/הִֽשָּׁעֲנ֖וּ תַּ֥חַת הָ/עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/004.yaml
  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: fr
  text: Qu’on apporte, je vous prie, un peu d’eau ; lavez-vous les pieds et reposez-vous sous l’arbre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « installez-vous sous l’arbre ». Le verbe hébreu peut signifier plus littéralement « s’appuyer » ou « s’étendre » ; ici, il désigne le fait de se reposer à l’ombre dans le cadre de l’hospitalité.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: Qu’on apporte, je vous prie
  rationale: Le passif jussif accompagné de la particule de requête exprime une demande polie. Cette formulation conserve le passif tout en restant naturelle et digne en français.
- source_word: מְעַט מַיִם
  choice: un peu d’eau
  rationale: Rend directement la petite quantité proposée et le ton modeste de l’hospitalité d’Abraham.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: lavez-vous les pieds
  rationale: Le français emploie naturellement la construction pronominale pour l’action de se laver une partie du corps ; le pluriel des destinataires est respecté.
- source_word: וְהִשָּׁעֲנוּ
  choice: reposez-vous
  rationale: Le nifal de שען évoque le fait de s’appuyer ou de s’étendre. Dans cette scène d’hospitalité, « reposez-vous » transmet naturellement l’action sans imposer une posture précise.
- source_word: תַּחַת הָעֵץ
  choice: sous l’arbre
  rationale: Traduction directe qui conserve l’article défini et désigne l’arbre précis situé près du campement.
