  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: fr
  text: 'Peut-être manquera-t-il cinq justes sur les cinquante. Détruiras-tu toute la ville pour cinq justes de moins ? Il répondit : « Je ne la détruirai pas si j’y trouve quarante-cinq justes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: Peut-être
  rationale: Introduit avec naturel l’hypothèse prudente d’Abraham sans lui donner une certitude absente de l’hébreu.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: manquera-t-il cinq justes sur les cinquante
  rationale: Exprime clairement en français que le nombre de cinquante serait déficitaire de cinq, tout en évitant de suggérer simplement l’absence temporaire de cinq individus déterminés.
- source_word: הַצַּדִּיקִם
  choice: justes
  rationale: Terme français courant qui conserve ici la portée morale et judiciaire de צַדִּיקִים.
- source_word: הֲתַשְׁחִית
  choice: Détruiras-tu
  rationale: Rend directement le hiphil de שׁחת et maintient sa répétition avec la réponse divine.
- source_word: בַּחֲמִשָּׁה
  choice: à cause de ces cinq personnes
  rationale: Le ב indique ici la cause ou le motif. L’explicitation « personnes » rend le référent naturel en français.
- source_word: אֶת כָּל הָעִיר
  choice: toute la ville
  rationale: Équivalent français idiomatique qui conserve l’idée de totalité.
- source_word: לֹא אַשְׁחִית
  choice: Je ne la détruirai pas
  rationale: Le pronom féminin reprend clairement « la ville » et conserve le même verbe que dans la question.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: si j’y trouve quarante-cinq justes
  rationale: Ordre naturel en français; « y » rend שָׁם, et « justes » est repris explicitement pour éviter toute ambiguïté sur ce qui doit être trouvé.
theological_decisions:
- issue: Traduction de צַדִּיקִים
  choice: justes
  alternative: personnes qui agissent avec justice
  rationale: « Justes » est bref, traditionnel mais toujours intelligible, et préserve la portée à la fois morale et judiciaire du terme sans imposer une définition doctrinale particulière.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond au discours direct adressé à Dieu dans ce contexte. La première proposition conserve la formulation hypothétique et le raisonnement numérique d’Abraham, tandis que la répétition de « détruire » reflète celle de la racine hébraïque.
