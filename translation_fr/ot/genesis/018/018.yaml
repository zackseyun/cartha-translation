id: GEN.18.18
reference: Genesis 18:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: fr
  text: Abraham deviendra certainement une nation grande et puissante, et toutes les nations de la terre seront bénies en lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les nations de la terre se béniront par lui ». La forme hébraïque peut être comprise ainsi, bien que le texte principal la prenne au passif : « seront bénies en lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: deviendra certainement
  rationale: L’infinitif absolu suivi de l’imparfait intensifie le verbe. « Deviendra certainement » exprime naturellement en français la valeur future et l’insistance, tandis que « devenir » convient à la construction avec לְגוֹי.
- source_word: לְגוֹי
  choice: une … nation
  rationale: גוי désigne couramment une nation ou un peuple. « Nation » convient à la promesse faite à Abraham et maintient le lien lexical avec les nations mentionnées ensuite.
- source_word: גָּדוֹל
  choice: grande
  rationale: « Grande » conserve la portée quantitative et qualitative du terme dans le langage de la promesse.
- source_word: וְעָצוּם
  choice: et puissante
  rationale: עצום peut évoquer la force, la puissance ou l’importance. « Puissante » forme en français une association naturelle avec « grande » sans réduire le sens au seul nombre.
- source_word: וְנִבְרְכוּ
  choice: seront bénies
  rationale: 'Le nifal de ברך peut plausiblement être compris comme un passif : les nations reçoivent la bénédiction en relation avec Abraham. La possibilité d’un sens réfléchi est conservée en note.'
- source_word: בּוֹ
  choice: en lui
  rationale: 'La préposition ב exprime ici naturellement la sphère ou l’association : la bénédiction advient en Abraham, c’est-à-dire en lien avec lui. « Par lui » serait possible, mais plus interprétatif.'
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: toutes les nations de la terre
  rationale: Cette formule a une portée universelle dans la Genèse. « Nations » assure la cohérence avec גוי au début du verset, et « terre » convient mieux que « pays » à cette portée.
theological_decisions:
- issue: Interprétation de la formule de bénédiction liée à Abraham
  choice: 'Les nations sont présentées comme recevant la bénédiction en relation avec Abraham : « seront bénies en lui ».'
  alternative: Les nations « se béniront par lui », en prenant Abraham comme formule ou modèle de bénédiction.
  rationale: Le nifal de ברך dans les promesses patriarcales admet les deux analyses. Le passif convient bien au contexte général de la promesse, mais le sens réfléchi demeure lexicalement possible et est donc signalé en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « deviendra certainement » rend l’emphase hébraïque sans calque, tandis que « grande et puissante » conserve le ton élevé de la promesse.
