id: GEN.18.20
reference: Genesis 18:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: fr
  text: 'Alors Yahweh dit : « Le cri qui s’élève contre Sodome et Gomorrhe est grand[a], et leur péché est extrêmement grave[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le cri de Sodome et Gomorrhe est grand ». L’hébreu peut se traduire plus littéralement ainsi; le texte principal explicite que le cri s’élève contre ces villes.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement que leur péché « est très lourd », image exprimant son extrême gravité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit; « Alors » en restitue naturellement la succession en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, conformément au texte source, plutôt que substitution par un titre.
- source_word: זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: Le cri qui s’élève contre Sodome et Gomorrhe
  rationale: זַעֲקָה désigne un cri de détresse ou de protestation suscité par une injustice. La construction hébraïque peut formellement se lire « le cri de », mais le contexte permet de comprendre qu’il s’agit d’un cri dirigé contre ces villes.
- source_word: כִּי רָבָּה
  choice: est grand
  rationale: רבה qualifie ici l’ampleur du cri; « est grand » conserve simplement l’image et l’accord avec « cri ».
- source_word: וְחַטָּאתָם
  choice: et leur péché
  rationale: Le singulier חַטָּאת avec suffixe pluriel désigne collectivement la conduite coupable des habitants.
- source_word: כִּי כָבְדָה מְאֹד
  choice: est extrêmement grave
  rationale: כבד signifie littéralement « être lourd » et exprime ici la gravité morale; מאד renforce fortement le qualificatif.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve sans le remplacer par un titre.
- issue: Orientation du cri concernant Sodome et Gomorrhe
  choice: cri qui s’élève contre Sodome et Gomorrhe
  alternative: cri de Sodome et Gomorrhe
  rationale: Le sens contextuel vraisemblable est celui d’une plainte provoquée par leur mal, mais la note préserve l’ambiguïté formelle de la construction hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde l’intensité judiciaire du verset sans archaïsme; les notes signalent l’ambiguïté syntaxique et l’image hébraïque.
