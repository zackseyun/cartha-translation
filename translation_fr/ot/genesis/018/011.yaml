lexical_decisions:
- source_word: זְקֵנִים
  choice: vieux
  rationale: Rend directement l’âge avancé d’Abraham et de Sara dans un français courant et digne.
- source_word: בָּאִים בַּיָּמִים
  choice: avancés en âge
  rationale: Restitue naturellement l’idiome hébreu « venus dans les jours » sans répéter lourdement « vieux ».
- source_word: חָדַל לִהְיוֹת
  choice: n’avait plus
  rationale: Exprime clairement la cessation antérieure indiquée par חָדַל avec l’infinitif לִהְיוֹת.
- source_word: אֹרַח כַּנָּשִׁים
  choice: ce que les femmes ont habituellement
  rationale: Conserve la pudeur de l’idiome hébreu tout en donnant en français une formulation compréhensible; la note en précise le référent.
- source_word: לְשָׂרָה
  choice: Sara n’avait plus
  rationale: Transpose la relation marquée par לְ dans une construction française naturelle.
