base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: fr
  text: 'Puis il dit : « Je t’en prie, que mon seigneur ne se mette pas en colère, et je parlerai encore une seule fois. Peut-être s’en trouvera-t-il dix là-bas. » Et il dit : « Je ne détruirai pas à cause des dix. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: Je t’en prie, que mon seigneur ne se mette pas en colère
  rationale: La tournure conserve la forme indirecte de l’hébreu, où la colère est attribuée à « mon seigneur », tout en exprimant נָא par une supplication naturelle en français. « Mon seigneur » reste un titre respectueux sans l’identifier explicitement au nom divin.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: et je parlerai encore cette seule fois
  rationale: Le cohortatif exprime la volonté ou la demande de poursuivre la parole, tandis que אַךְ הַפַּעַם limite cette intervention à une dernière fois dans le contexte.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: Peut-être s’en trouvera-t-il dix là-bas
  rationale: « Peut-être » préserve l’éventualité exprimée par אוּלַי, et la construction pronominale rend naturellement le niphal passif de מצא en français.
- source_word: לֹא אַשְׁחִית
  choice: Je ne détruirai pas la ville
  rationale: Le hiphil de שׁחת signifie ici « détruire ». L’objet, absent en hébreu mais compris d’après le contexte, est explicité par « la ville » pour la clarté.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: à cause de ces dix-là
  rationale: בַּעֲבוּר indique le motif qui détourne la destruction. « Ces dix-là » reprend de manière spécifique les dix personnes qui viennent d’être évoquées.
theological_decisions:
- issue: Référent et présentation de לַאדֹנָי dans l’adresse d’Abraham
  choice: mon seigneur
  alternative: le Seigneur
  rationale: Même si le contexte narratif est celui d’une apparition divine, le terme employé ici n’est pas le nom YHWH. La minuscule et le possessif préservent la forme d’adresse respectueuse et l’ambiguïté du texte sans imposer une identification typographique.
- issue: Objet implicite de « je ne détruirai pas »
  choice: la ville, ajouté dans le texte avec une note
  alternative: ne pas exprimer l’objet
  rationale: Le français courant appelle ici un complément, mais l’hébreu le laisse implicite. La note signale explicitement cet ajout contextuel afin de ne pas masquer la forme du texte source.
translation_notes:
  register: Français moderne, digne et accessible. La formulation garde la déférence insistante d’Abraham sans employer un tour excessivement archaïque. Le futur et la reprise de « il dit » suivent la progression sobre du récit hébreu.
