  to: 'Puis il dit : « Je t’en prie, que mon seigneur ne se mette pas en colère, et je parlerai encore une seule fois. Peut-être s’en trouvera-t-il dix là-bas. » Et il dit : « Je ne détruirai pas à cause des dix. »'
