revisions:
- from: Car je l’ai connu[a], afin qu’il donne ses ordres à ses fils[b] et à sa maisonnée après lui, pour qu’ils gardent la voie de Yahweh[c] en pratiquant la justice et le droit, afin que Yahweh accomplisse en faveur d’Abraham ce qu’il a déclaré à son sujet[d].
  to: Car je l’ai connu[a], afin qu’il ordonne à ses fils[b] et à sa maisonnée après lui de garder la voie de Yahweh[c], en pratiquant la justice et le droit, afin que Yahweh fasse venir sur Abraham ce qu’il a déclaré à son sujet[d].
  rationale: La révision remplace une explicitation favorable non exprimée par « fasse venir sur Abraham », qui reflète la construction hébraïque tout en laissant le contexte déterminer la nature de ce qui est annoncé. Elle emploie aussi « ordonne à … de garder » pour une formulation française plus naturelle et plus étroitement liée à la syntaxe du verset. Les notes et leurs ancres sont conservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:50:08Z'
