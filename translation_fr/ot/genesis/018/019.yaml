id: GEN.18.19
reference: Genesis 18:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: fr
  text: Car je l’ai connu[a], afin qu’il ordonne à ses fils[b] et à sa maisonnée après lui de garder la voie de Yahweh[c], en pratiquant la justice et le droit, afin que Yahweh fasse venir sur Abraham ce qu’il a déclaré à son sujet[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je l’ai choisi ». Le verbe hébreu signifie ordinairement « connaître », mais il peut ici exprimer une relation particulière impliquant le choix ou la faveur.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit littéralement « ses fils ». La mention de « sa maisonnée » étend toutefois la portée à l’ensemble de ceux qui dépendent d’Abraham.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire la manière de vivre conforme à ce que Yahweh demande.
    reason: cultural_note
  - marker: d
    text: 'Ou : « ce qu’il lui a promis ». L’hébreu dit plus littéralement : « ce qu’il a déclaré à son sujet ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la déclaration précédente et conserve naturellement la valeur explicative de l’hébreu.
- source_word: יְדַעְתִּיו
  choice: je l’ai connu
  rationale: Traduit directement le sens ordinaire de ידע tout en laissant ouverte sa nuance relationnelle et élective dans ce contexte.
- source_word: לְמַעַן אֲשֶׁר
  choice: afin que
  rationale: Exprime la finalité, avec une tournure française naturelle et digne.
- source_word: יְצַוֶּה
  choice: il donne ses ordres à
  rationale: Rend la force du piel de צוה sans la tournure moins naturelle « commande ses fils » en français.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Conserve le masculin pluriel explicite du texte hébreu; la mention de la maisonnée élargit ensuite le groupe concerné.
- source_word: בֵּיתוֹ
  choice: sa maisonnée
  rationale: Désigne ici l’ensemble domestique et familial d’Abraham, et non le bâtiment.
- source_word: וְשָׁמְרוּ
  choice: pour qu’ils gardent
  rationale: Avec « voie », שׁמר exprime l’observance fidèle d’une manière de vivre.
- source_word: דֶּרֶךְ יְהוָה
  choice: la voie de Yahweh
  rationale: Conserve l’image hébraïque d’une conduite prescrite par Yahweh ainsi que le nom divin.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: en pratiquant la justice et le droit
  rationale: « En pratiquant » explicite la valeur instrumentale de l’infinitif; « justice et droit » maintient la distinction entre les deux termes coordonnés dans un français idiomatique.
- source_word: הָבִיא ... עַל אַבְרָהָם
  choice: accomplisse en faveur d’Abraham
  rationale: Dans ce contexte de promesse, rend naturellement l’idée que Yahweh fera venir sur Abraham ce qu’il a annoncé, sans suggérer un malheur.
- source_word: אֲשֶׁר דִּבֶּר עָלָיו
  choice: ce qu’il a déclaré à son sujet
  rationale: Reste proche de la formulation hébraïque et ne remplace pas implicitement « déclaré » par « promis ».
theological_decisions:
- issue: 'La portée de ידע : connaissance relationnelle ou choix divin'
  choice: je l’ai connu
  alternative: je l’ai choisi
  rationale: Le contexte permet une nuance de choix et de faveur, mais le verbe signifie formellement « connaître ». Le texte principal préserve cette donnée et la note signale l’interprétation possible.
- issue: Le rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération le distingue d’un titre.
- issue: Le rapport entre צדקה et משפט
  choice: la justice et le droit
  alternative: ce qui est juste et équitable
  rationale: Le choix retenu garde deux substantifs distincts et évite de fondre la tension sémantique du binôme en une paraphrase unique.
- issue: La valeur de הָבִיא עַל dans le contexte de la parole divine
  choice: accomplisse en faveur d’Abraham
  alternative: fasse venir sur Abraham
  rationale: La formulation française choisie communique l’accomplissement bienfaisant attendu sans transformer explicitement דִּבֶּר, « parler/déclarer », en « promettre ».
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe conserve les deux propositions finales de l’hébreu. « Maisonnée » exprime le cadre familial et domestique ancien; « donner ses ordres » garde l’autorité de צוה dans une tournure française naturelle.
