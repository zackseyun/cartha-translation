  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: fr
  text: 'Alors Abraham répondit : « Voici, je te prie, j’ai osé parler à mon Seigneur[a], moi qui ne suis que poussière et cendre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon seigneur ». La forme hébraïque peut servir d’adresse respectueuse ; la majuscule est employée ici parce que le contexte identifie l’interlocuteur d’Abraham au SEIGNEUR.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן אַבְרָהָם וַיֹּאמַר
  choice: Alors Abraham répondit
  rationale: La formule narrative hébraïque associe littéralement « répondit » et « dit ». En français moderne, « répondit » introduit naturellement les paroles et rend la fonction de l’ensemble sans la lourdeur de « répondit et dit ».
- source_word: הִנֵּה נָא
  choice: Voici, je te prie
  rationale: « Voici » conserve la fonction d’appel à l’attention de הִנֵּה, tandis que « je te prie » exprime la déférence ajoutée par נָא dans un registre digne.
- source_word: הוֹאַלְתִּי
  choice: j’ai osé
  rationale: Dans cette prise de parole déférente, le verbe exprime le fait de se risquer à parler ou d’en prendre l’initiative. « J’ai osé » fait entendre à la fois la hardiesse d’Abraham et son humilité.
- source_word: לְדַבֵּר
  choice: parler
  rationale: Le verbe דבר désigne ici l’acte de prendre la parole devant son interlocuteur; « parler » en est l’équivalent français direct et naturel.
- source_word: אֶל אֲדֹנָי
  choice: à mon Seigneur
  rationale: Le contexte présente Abraham s’adressant au visiteur divin associé au SEIGNEUR. La majuscule signale cette identification contextuelle sans remplacer le terme hébreu par le nom divin.
- source_word: וְאָנֹכִי
  choice: moi qui ne suis que
  rationale: La conjonction introduit ici un contraste entre l’audace de parler et l’insignifiance reconnue par Abraham. Cette formulation explicite naturellement en français la valeur concessive du contexte.
- source_word: עָפָר וָאֵפֶר
  choice: poussière et cendre
  rationale: Cette expression évoque la fragilité, la mortalité et l’insignifiance humaines. Le singulier collectif est idiomatique en français.
theological_decisions:
- issue: Sens et capitalisation de אֲדֹנָי dans l’adresse d’Abraham
  choice: mon Seigneur
  alternative: mon seigneur
  rationale: La forme constitue une adresse honorifique, mais le contexte immédiat identifie l’interlocuteur au SEIGNEUR. La majuscule reflète cette identification tout en maintenant en note l’autre lecture formellement possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici, je te prie » garde une légère solennité adaptée au dialogue sans recourir à une tournure archaïque. La redondance de la formule narrative hébraïque a été allégée conformément à l’usage naturel du français.
