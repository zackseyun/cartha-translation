  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: fr
  text: 'Il lui parla encore et dit : « Peut-être s’en trouvera-t-il quarante là. » Il répondit : « Je ne le ferai pas à cause de ces quarante. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: Il lui parla encore
  rationale: L’expression יסף + עוד + infinitif marque la répétition ou la poursuite. « Parla encore » en restitue naturellement ici la valeur itérative.
- source_word: אֵלָיו
  choice: lui
  rationale: La préposition אֶל indique la direction de la parole vers l’interlocuteur ; le pronom indirect français est idiomatique.
- source_word: אוּלַי
  choice: Peut-être
  rationale: אוּלַי introduit une possibilité envisagée avec réserve dans l’intercession d’Abraham.
- source_word: יִמָּצְאוּן שָׁם אַרְבָּעִים
  choice: s’en trouvera-t-il quarante là-bas
  rationale: Le niphal de מצא est rendu par la tournure française « s’en trouver », qui conserve l’idée d’être trouvé tout en évitant une construction passive pesante. « Là-bas » reprend le lieu visé.
- source_word: לֹא אֶעֱשֶׂה
  choice: Je ne le ferai pas
  rationale: L’hébreu laisse l’objet de l’action sous-entendu. Le pronom « le » maintient cette ellipse de manière intelligible en français.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: à cause de ces quarante
  rationale: בַּעֲבוּר exprime ici le motif pour lequel l’action sera épargnée. « Ces quarante » désigne naturellement les quarante personnes justes envisagées.
theological_decisions:
- issue: Objet implicite de l’action divine dans לֹא אֶעֱשֶׂה
  choice: Maintenir l’objet implicite avec « Je ne le ferai pas »
  alternative: « Je ne détruirai pas la ville » ou « Je ne la détruirai pas »
  rationale: Le texte hébreu dit littéralement que Dieu ne « fera » pas, l’action étant comprise par le contexte. Ne pas expliciter la destruction préserve l’ellipse et évite d’ajouter un objet absent du verset.
translation_notes:
  register: 'Français moderne, digne et accessible. La reprise des deux verbes de parole est conservée sans lourdeur : « parla encore et dit », puis « répondit » distingue clairement le second locuteur. L’inversion « s’en trouvera-t-il » convient au ton respectueux de la supplication.'
