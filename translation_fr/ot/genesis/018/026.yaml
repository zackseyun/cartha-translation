  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: fr
  text: 'Yahweh dit : « Si je trouve cinquante personnes justes dans la ville de Sodome, j’épargnerai[a] tout ce lieu à cause d’elles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je pardonnerai tout ce lieu ». Le verbe hébreu peut évoquer le fait de porter ou d’enlever la culpabilité et, par conséquent, de pardonner ; dans ce contexte, il peut aussi exprimer le fait de ne pas exécuter le jugement. « J’épargnerai » convient ici au contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol poursuit ici le récit. En français moderne, « dit » assure naturellement l’enchaînement sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: אִם אֶמְצָא
  choice: Si je trouve
  rationale: Cette formulation rend directement et naturellement la condition exprimée en hébreu.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: cinquante personnes justes
  rationale: Le pluriel désigne des êtres humains caractérisés comme justes sans imposer un référent exclusivement masculin.
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: dans Sodome, au milieu de la ville
  rationale: Cette traduction conserve les deux indications locatives de l’hébreu et leur légère redondance expressive.
- source_word: וְנָשָׂאתִי
  choice: j’épargnerai
  rationale: Dans ce contexte de jugement annoncé, le verbe נשׂא exprime le fait de ne pas infliger la destruction au lieu tout entier. « Épargner » en communique clairement la portée, tandis que la note signale l’autre nuance possible.
- source_word: לְכָל הַמָּקוֹם
  choice: tout le lieu
  rationale: Cette formulation conserve la portée globale de כָּל et le terme général מָקוֹם, sans réduire arbitrairement le référent à la seule population.
- source_word: בַּעֲבוּרָם
  choice: à cause d’elles
  rationale: L’expression indique que les personnes justes seraient la raison pour laquelle le lieu serait épargné. Le pronom féminin reprend naturellement « personnes » en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel présent dans la source sans le remplacer par un titre.
- issue: Portée de וְנָשָׂאתִי dans un contexte de jugement
  choice: j’épargnerai
  alternative: je pardonnerai
  rationale: « Épargner » décrit avec clarté le retrait du jugement visant tout le lieu, tandis que « pardonner » mettrait davantage en avant la remise de culpabilité. L’ambiguïté lexicale est conservée dans la note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la répétition locative de l’hébreu (« dans Sodome, au milieu de la ville ») et emploie « personnes justes » pour éviter de masculiniser indûment le groupe.
