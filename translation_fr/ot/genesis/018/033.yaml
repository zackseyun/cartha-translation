  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: fr
  text: Puis Yahweh[a] s’en alla lorsqu’il eut fini de parler à Abraham, et Abraham retourna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». On trouve aussi les transcriptions « Yahvé » et « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et d’autres transcriptions françaises.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: s’en alla
  rationale: Dans ce récit, הלך marque le départ. « S’en alla » exprime naturellement en français le mouvement par lequel Yahweh met fin à la rencontre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: כַּאֲשֶׁר
  choice: lorsque
  rationale: La conjonction introduit ici la circonstance temporelle du départ.
- source_word: כִּלָּה לְדַבֵּר
  choice: eut fini de parler
  rationale: La construction exprime l’achèvement de l’action de parler; le passé antérieur convient à la succession narrative en français soutenu mais courant.
- source_word: אֶל אַבְרָהָם
  choice: à Abraham
  rationale: 'La préposition אֶל conserve son orientation simple : Yahweh parle à Abraham.'
- source_word: שָׁב
  choice: retourna
  rationale: שוב indique ici le retour d’Abraham après l’entretien.
- source_word: לִמְקֹמוֹ
  choice: chez lui
  rationale: Littéralement « à son lieu »; en français moderne, « chez lui » rend naturellement l’idée de retour à l’endroit propre à Abraham sans préciser qu’il s’agit d’une maison.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans remplacer celui-ci par un titre.
translation_notes:
  register: Français international moderne, narratif et digne. « Puis » assure la continuité du récit; « s’en alla » et « chez lui » évitent un calque peu naturel tout en préservant le sens du texte hébreu.
