    text: 'Hébreu : « YHWH ». On trouve aussi les transcriptions « Yahvé » et « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et d’autres transcriptions françaises.
  revision_rationale: La révision conserve le sens narratif et le registre du projet, replace l’appel de note sur le nom divin qu’il explique et remplace « chez lui » par « à sa place », formulation qui préserve la portée non spécifiée de לִמְקֹמוֹ.
