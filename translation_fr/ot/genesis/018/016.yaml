  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: fr
  text: Puis les hommes se levèrent de là et regardèrent en contrebas vers Sodome[a], tandis qu’Abraham marchait avec eux pour les reconduire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « regardèrent du côté de Sodome ». Le verbe hébreu suggère un regard porté depuis un lieu élevé.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne le fait d’accompagner des hôtes qui repartent et de les mettre en chemin.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levèrent
  rationale: Le qal narratif de קום signifie ici qu’ils se lèvent; cette formulation conserve le mouvement du récit sans l’interpréter d’emblée comme leur départ.
- source_word: מִשָּׁם
  choice: de là
  rationale: Rendu direct et naturel de l’adverbe de lieu, qui marque la transition spatiale.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le texte emploie le nom courant « hommes ». Ce choix préserve la formulation et la tension narrative sans les désigner prématurément comme des anges.
- source_word: וַיַּשְׁקִפוּ
  choice: regardèrent en contrebas
  rationale: Le verbe שׁקף évoque souvent un regard porté depuis un point élevé; « en contrebas » restitue cette nuance topographique probable.
- source_word: עַל־פְּנֵי סְדֹם
  choice: vers Sodome
  rationale: Dans ce contexte, l’expression indique la direction du regard; la nuance de hauteur est déjà exprimée par « en contrebas ».
- source_word: הֹלֵךְ
  choice: marchait
  rationale: Le participe présente une action en cours et concomitante; l’imparfait français en rend naturellement l’aspect duratif.
- source_word: עִמָּם
  choice: avec eux
  rationale: Traduction directe de la préposition accompagnée de son suffixe pronominal.
- source_word: לְשַׁלְּחָם
  choice: pour les accompagner à leur départ
  rationale: Dans le cadre de l’hospitalité, l’expression désigne l’action d’accompagner des hôtes qui repartent et de les mettre en chemin; ce rendu est naturel en français et n’implique pas qu’Abraham les renvoie.
theological_decisions:
- issue: Identité de הָאֲנָשִׁים dans le contexte
  choice: Traduire par « les hommes » dans le texte principal
  alternative: « les visiteurs » ou « les anges »
  rationale: Le verset les appelle simplement « hommes ». La traduction conserve cette désignation et ne résout pas avant le récit la question de leur identité.
translation_notes:
  register: Français international moderne, narratif et digne. « Puis » assure une transition naturelle; « tandis que » rend la concomitance du participe sans alourdir la phrase. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
