  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: fr
  text: 'Il dit : « Mon seigneur[a], si j’ai trouvé grâce à tes yeux, je t’en prie, ne passe pas sans t’arrêter chez ton serviteur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Seigneur », si l’on comprend qu’Abraham s’adresse ici directement à Dieu plutôt qu’à l’un des visiteurs avec une formule de respect.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Il dit
  rationale: Le wayyiqtol introduit ici la parole d’Abraham dans le fil du récit. « Il dit » est naturel en français narratif et n’explicite pas davantage la succession.
- source_word: אֲדֹנָי
  choice: Mon seigneur
  rationale: L’adresse respectueuse au singulier convient au visiteur pris comme interlocuteur principal et maintient dans le texte la possibilité d’une adresse au Seigneur, sans trancher par la majuscule.
- source_word: אִם נָא
  choice: si
  rationale: La condition appartient à une formule de requête polie. La nuance suppliante de נָא est rendue plus loin par « je t’en prie », ce qui évite une répétition pesante.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: j’ai trouvé grâce à tes yeux
  rationale: Cette formulation conserve l’image de l’idiome hébreu tout en restant claire et digne en français actuel. Ici, « grâce » désigne l’accueil favorable et n’impose pas un sens doctrinal technique.
- source_word: אַל נָא
  choice: je t’en prie, ne
  rationale: La tournure rend à la fois la défense et l’insistance courtoise exprimée par נָא.
- source_word: תַעֲבֹר מֵעַל
  choice: passe pas loin de
  rationale: Cette expression garde l’idée concrète de poursuivre son chemin en s’éloignant d’auprès d’Abraham. Elle est plus proche de מֵעַל que le simple « passe pas devant ».
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans cette formule de déférence, « serviteur » rend naturellement l’auto-désignation humble d’Abraham sans suggérer à tort que son statut d’esclave est au premier plan.
theological_decisions:
- issue: Faut-il comprendre אֲדֹנָי comme le titre divin « Seigneur » ou comme l’adresse respectueuse « mon seigneur » ?
  choice: mon seigneur
  alternative: Seigneur
  rationale: Le contexte global présente l’apparition de l’Éternel, mais Abraham s’adresse ici au singulier à un interlocuteur parmi les visiteurs. Le texte principal conserve donc l’adresse respectueuse sans majuscule, tandis que la note signale explicitement la lecture comme adresse directe à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit les formes hébraïques de deuxième personne du singulier et convient au registre biblique français. L’expression « grâce à tes yeux » conserve volontairement l’image sémitique.
