source:
  edition: WLC
  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: fr
  text: 'Alors Sara rit en elle-même en se disant : « Maintenant que je suis usée, aurai-je du plaisir[a], alors que mon seigneur est vieux ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du délice » ; le terme peut évoquer le plaisir conjugal ou un regain de vigueur.
    reason: Le nom rare עֶדְנָה possède une portée large que le seul mot « plaisir » ne restitue pas entièrement.
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: rit
  rationale: Le qal de צחק signifie couramment « rire ». Le contexte décrit la réaction intérieure de Sara, sans imposer l’idée de moquerie.
- source_word: בְּקִרְבָּהּ
  choice: en elle-même
  rationale: Cette expression rend directement l’hébreu « en son intérieur » et indique que le rire et les paroles de Sara restent intérieurs.
- source_word: לֵאמֹר
  choice: en se disant
  rationale: L’infinitif introduit le discours cité. En français, « en se disant » s’accorde naturellement avec le caractère intérieur de la réaction.
- source_word: אַחֲרֵי בְלֹתִי
  choice: Maintenant que je suis usée
  rationale: בלה évoque ce qui est usé ou dépéri. Cette formulation conserve l’image corporelle tout en produisant une question naturelle en français.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: connaîtrai-je encore le plaisir
  rationale: La tournure française exprime l’éventualité d’un plaisir désormais inattendu. « Encore » rend implicitement le contraste temporel marqué par אַחֲרֵי sans restreindre le sens du nom rare עֶדְנָה.
- source_word: עֶדְנָה
  choice: plaisir
  rationale: Le mot rare peut évoquer le plaisir, notamment conjugal, ou un regain de vigueur. « Plaisir » conserve cette amplitude sémantique sans explicitation excessive.
- source_word: וַאדֹנִי
  choice: mon seigneur
  rationale: Sara emploie ici une appellation respectueuse pour Abraham, et non un titre divin. La minuscule évite cette confusion.
- source_word: זָקֵן
  choice: est vieux
  rationale: Rendu simple et direct de l’adjectif hébreu, approprié au français contemporain.
theological_decisions:
- issue: Portée de עֶדְנָה dans la question de Sara
  choice: « le plaisir », formulation large
  alternative: « le plaisir conjugal » ou « une nouvelle vigueur »
  rationale: Le contexte suggère des dimensions corporelles, conjugales et fécondes, mais le terme hébreu ne permet pas de les réduire avec certitude à une seule. Le texte principal conserve donc cette ambiguïté, tandis que la note signale les nuances possibles.
- issue: Valeur de la conjonction ו devant וַאדֹנִי
  choice: « alors que »
  alternative: « et »
  rationale: La simple coordination hébraïque peut ici prendre une nuance circonstancielle ou contrastive. « Alors que » exprime naturellement le fait que l’âge d’Abraham renforce l’étonnement de Sara, sans modifier le fond de son propos.
translation_notes:
  register: Français international moderne, naturel et digne. « En elle-même » préserve l’intériorité du texte ; « usée » maintient l’image forte de בלה. La syntaxe interrogative reste fluide tout en conservant l’ambiguïté du terme central.
