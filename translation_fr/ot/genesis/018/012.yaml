  terminology: « Sara », « mon seigneur » et « plaisir » conviennent. La minuscule à « seigneur » évite à juste titre d’en faire un titre divin. La note maintient utilement l’amplitude de עֶדְנָה, sans imposer une lecture sexuelle ou physiologique précise.
