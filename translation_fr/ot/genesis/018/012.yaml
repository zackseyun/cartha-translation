  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Sara rit intérieurement, évoque son état de dépérissement et l’âge d’Abraham. Toutefois, « encore » introduit plus explicitement l’idée d’un retour à un plaisir antérieur, alors que le terme hébreu exprime la question de savoir si le plaisir lui adviendra dans son état présent, sans marquer directement la répétition.'
