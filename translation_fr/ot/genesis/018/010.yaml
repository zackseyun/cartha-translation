  text: וַ/יֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֨י/ךָ֙ כָּ/עֵ֣ת חַיָּ֔ה וְ/הִנֵּה בֵ֖ן לְ/שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וְ/שָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָ/אֹ֖הֶל וְ/ה֥וּא אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: fr
  text: 'Il dit : « Je reviendrai certainement vers toi à pareille époque, l’an prochain[a], et voici que Sara, ta femme, aura un fils. » Sara écoutait à l’entrée de la tente, qui était derrière lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « au temps vivant », expression qui désigne ici vraisemblablement la même période l’année suivante.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « et il était derrière lui ». Le pronom masculin renvoie vraisemblablement à « l’entrée » (masculin en hébreu) ; la formulation est toutefois très concise.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol introduit ici la parole directe dans le fil narratif. Le sujet reste le simple pronom masculin implicite du texte hébreu.
- source_word: שׁוֹב אָשׁוּב
  choice: Je reviendrai certainement
  rationale: L’infinitif absolu suivi de l’imparfait du même verbe exprime une forte insistance, rendue naturellement en français par « certainement ».
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: Le complément indique la personne auprès de laquelle le locuteur reviendra, sans qu’il soit nécessaire d’ajouter le nom d’Abraham.
- source_word: כָּעֵת חַיָּה
  choice: à pareille époque, l’an prochain
  rationale: Dans ce contexte, l’expression idiomatique désigne le retour de la même période ou saison l’année suivante. Cette formulation française est claire tout en conservant la notion de période correspondante.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: « Voici que » conserve la fonction d’appel à l’attention de la particule hébraïque dans un registre français naturel et digne.
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: Sara, ta femme, aura un fils
  rationale: La construction avec לְ présente le fils comme appartenant à Sara ou lui étant accordé. La restructuration choisie exprime naturellement en français l’annonce d’une naissance.
- source_word: שָׂרָה שֹׁמַעַת
  choice: Sara écoutait
  rationale: Le participe décrit une action en cours au moment de la scène ; l’imparfait français en rend la valeur durative.
- source_word: פֶּתַח הָאֹהֶל
  choice: à l’entrée de la tente
  rationale: La locution construite indique le lieu où Sara se tient et écoute.
- source_word: וְהוּא אַחֲרָיו
  choice: derrière lui
  rationale: La formulation concise conserve l’information spatiale sans imposer en français un antécédent explicite au pronom hébreu, dont le renvoi est discuté.
theological_decisions:
- issue: Identité du locuteur
  choice: Conserver le sujet sous la forme non précisée « il »
  alternative: « Le Seigneur dit » ou « l’un des hommes dit »
  rationale: Dans ce verset, le verbe hébreu a seulement un sujet masculin singulier implicite. Préciser l’identité du locuteur résoudrait une question que la formulation immédiate laisse au contexte.
- issue: Référent de וְהוּא dans la dernière proposition
  choice: Rendre seulement la relation spatiale par « derrière lui » et signaler l’ambiguïté en note
  alternative: « et l’entrée était derrière lui » ou, très littéralement, « et il était derrière lui »
  rationale: Le pronom masculin peut renvoyer à פֶּתַח (« l’entrée », masculin en hébreu), mais la formulation hébraïque reste très resserrée. Le texte principal donne le sens spatial probable sans effacer la difficulté grammaticale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste fluide pour une lecture publique, tandis que les notes préservent l’idiome temporel et l’ambiguïté de la dernière proposition.
