source:
  edition: WLC
  text: וַ/יְמַהֵ֧ר אַבְרָהָ֛ם הָ/אֹ֖הֱלָ/ה אֶל שָׂרָ֑ה וַ/יֹּ֗אמֶר מַהֲרִ֞י שְׁלֹ֤שׁ סְאִים֙ קֶ֣מַח סֹ֔לֶת ל֖וּשִׁי וַ/עֲשִׂ֥י עֻגֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: fr
  text: 'Abraham se hâta d’entrer dans la tente auprès de Sara et lui dit : « Vite ! Prends trois séas[a][b] de farine fine, pétris-la et fais-en des galettes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le séa était une ancienne mesure de capacité pour les matières sèches. Trois séas correspondent approximativement à 20–22 litres.
    reason: cultural_note
  - marker: b
    text: 'Ou : « trois mesures » de farine fine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: se hâta
  rationale: Le verbe exprime une action rapide et entretient l’urgence du récit dans un registre français naturel et digne.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: d’entrer dans la tente auprès de Sara
  rationale: Le hé directionnel indique un mouvement vers la tente, que le contexte permet naturellement de rendre comme une entrée; « auprès de Sara » conserve le lien avec אֶל שָׂרָה.
- source_word: מַהֲרִי
  choice: Vite !
  rationale: L’impératif féminin singulier s’adresse à Sara. Cette formulation brève restitue l’urgence sans alourdir le dialogue.
- source_word: שְׁלֹשׁ סְאִים
  choice: trois séas
  rationale: Le séa est une mesure sèche précise de l’Antiquité. La translittération préserve l’unité concrète du texte, expliquée en note.
- source_word: קֶמַח סֹלֶת
  choice: farine fine
  rationale: La combinaison désigne une farine de qualité, finement moulue; « farine fine » en restitue clairement le sens.
- source_word: לוּשִׁי
  choice: pétris-la
  rationale: Le verbe désigne spécifiquement le pétrissage. Le pronom renvoie naturellement à la farine comprise comme pâte à préparer.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: et fais-en des galettes
  rationale: עֻגוֹת désigne des pains ronds ou galettes. « Galettes » évite le sens pâtissier moderne que pourrait suggérer « gâteaux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’ajout explicite de « Prends » rend en français l’ordre elliptique de l’hébreu. « Galettes » évoque ici des pains plats ou ronds, non des pâtisseries sucrées.
