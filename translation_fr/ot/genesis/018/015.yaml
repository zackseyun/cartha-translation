id: GEN.18.15
reference: Genesis 18:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: fr
  text: 'Sara le nia[a] en disant : « Je n’ai pas ri », car elle avait peur. Mais il dit : « Si[b], tu as bien ri. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sara mentit », ou simplement : « Sara nia ». Le verbe hébreu peut évoquer le déni ou la fausseté ; ici, il désigne son refus d’admettre qu’elle a ri.'
    reason: lexical_alternative
  - marker: b
    text: Le locuteur n’est pas nommé explicitement dans cette proposition ; le contexte du récit l’identifie à l’Éternel.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: le nia
  rationale: Le piel de כחש peut exprimer le déni ou la fausseté. Ici, Sara nie ce qui vient d’être affirmé à son sujet. « Le nia » est naturel en français et n’explicite pas davantage que l’hébreu le jugement moral impliqué par « mentit ».
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif introduit directement les paroles de Sara ; « en disant » convient au registre narratif.
- source_word: לֹא צָחַקְתִּי
  choice: Je n’ai pas ri
  rationale: Rend directement la négation et l’accompli à la première personne du singulier dans un français moderne.
- source_word: כִּי יָרֵאָה
  choice: car elle avait peur
  rationale: כִּי introduit ici la raison de son déni. « Car » conserve une narration digne et fluide.
- source_word: וַיֹּאמֶר
  choice: Mais il dit
  rationale: Le verbe fait progresser le récit, tandis que « Mais » marque naturellement l’opposition entre le déni de Sara et la réplique.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: Si, tu as bien ri
  rationale: En français, « Si » réfute précisément une proposition négative ; « bien » restitue l’insistance de la réplique sans transformer כִּי en lien causal.
theological_decisions:
- issue: Identité du locuteur dans וַיֹּאמֶר
  choice: « il dit », sans nommer explicitement le locuteur
  alternative: « l’Éternel dit » ou « l’un des hommes dit »
  rationale: Le sujet masculin singulier n’est pas répété dans cette proposition. Le contexte environnant permet de l’associer à l’Éternel, mais la formulation conserve l’implicite du verset lui-même.
translation_notes:
  register: Français international moderne, narratif et digne. « Si » rend idiomatiquement la réfutation d’une négation, et « tu as bien ri » en conserve l’insistance. Tous les marqueurs de notes figurent dans le texte.
