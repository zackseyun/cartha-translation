    rationale: La note donne des équivalents du verbe hébreu תספה ; l’ancre doit donc suivre « faire périr » afin de correspondre précisément à son objet.
  - severity: low
    issue: « Supprimer » et « exterminer » sont des alternatives peu appropriées dans cette note française.
    rationale: « Supprimer » est trop vague dans cet emploi, tandis qu’« exterminer » est plus marqué et peut suggérer une précision absente du texte. « Balayer » et « anéantir » conservent mieux la portée lexicale sans modifier le sens.
