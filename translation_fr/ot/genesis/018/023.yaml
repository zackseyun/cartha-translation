  source_fidelity: Le sens de l’interrogation renforcée est bien rendu, de même que le singulier générique « le juste » / « le méchant ». Toutefois, « emporter » reste trop indéterminé en français et n’exprime pas assez clairement l’idée de faire périr ou d’éliminer dans le jugement portée par ספה dans ce contexte.
  naturalness: « Vas-tu vraiment faire périr le juste avec le méchant ? » est naturel, clair et conserve le ton direct et pressant de l’intercession. Le singulier générique est idiomatique dans ce registre.
  terminology: « Juste » et « méchant » rendent fidèlement les catégories morales et judiciaires צדّיק et רשע sans les réduire à l’innocence ou à la culpabilité légale. La note est déplacée sur le verbe auquel elle se rapporte et ses variantes sont formulées plus naturellement.
