  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: fr
  text: 'Alors Abraham s’approcha et dit : « Vas-tu vraiment faire périr[a] le juste avec le méchant ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « balayer » ou « anéantir » ; le verbe hébreu désigne le fait de faire disparaître dans le jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: s’approcha
  rationale: Le verbe נגשׁ exprime le fait de s’avancer ou de s’approcher. « S’approcha » rend naturellement le mouvement physique et rhétorique d’Abraham qui se présente pour intercéder.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: וַיֹּאמַר
  choice: dit
  rationale: Le verbe narratif courant אמר se traduit naturellement par « dit ».
- source_word: הַאַף
  choice: vraiment
  rationale: La particule interrogative jointe à אַף renforce la question. « Vraiment » exprime l’étonnement et l’appel pressant d’Abraham sans surinterpréter.
- source_word: תִּסְפֶּה
  choice: emporter
  rationale: Le verbe ספה évoque ici le fait d’enlever dans un jugement destructeur. « Emporter » conserve l’image d’un même sort qui saisit les deux catégories, tout en restant naturel en français.
- source_word: צַדִּיק
  choice: le juste
  rationale: Le singulier hébreu a une valeur générique. « Le juste » conserve cette forme représentative et la catégorie morale ou judiciaire du texte.
- source_word: עִם
  choice: avec
  rationale: La préposition signifie directement « avec » et souligne le sort commun envisagé.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le singulier est générique et s’oppose à « le juste ». « Le méchant » est une formulation biblique claire en français moderne.
theological_decisions:
- issue: Catégories morales exprimées au singulier générique
  choice: Conserver « le juste » et « le méchant » au singulier.
  alternative: Employer les pluriels « les justes » et « les méchants », ou expliciter « l’homme juste » et « l’homme méchant ».
  rationale: L’hébreu emploie deux singuliers génériques pour énoncer un principe de justice divine. Le français permet le même usage, qui préserve la forme et la portée représentative du texte sans limiter la question à deux individus précis.
translation_notes:
  register: Français international moderne, naturel et digne. La question directe conserve la hardiesse respectueuse de l’intercession d’Abraham. « Emporter » maintient l’image du jugement sans imposer un mode précis de destruction.
