base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: fr
  text: Abraham courut vers le troupeau, prit un veau tendre et de bonne qualité, et le donna au jeune homme[a], qui se hâta de le préparer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au serviteur » ou « au garçon ». Le terme hébreu peut désigner un garçon, un jeune homme ou, selon le contexte, un serviteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: le troupeau
  rationale: Le nom désigne ici collectivement le gros bétail parmi lequel Abraham choisit un animal; « le troupeau » est naturel en français dans ce contexte.
- source_word: רָץ
  choice: courut
  rationale: Le verbe signifie directement « courir » et conserve la vivacité ainsi que l'empressement de l'hospitalité d'Abraham.
- source_word: בֶּן־בָּקָר
  choice: un veau
  rationale: L'expression hébraïque désigne idiomatiquement un jeune bovin; « un veau » convient naturellement au contexte de préparation d'un repas.
- source_word: רַךְ וָטוֹב
  choice: tendre et de bonne qualité
  rationale: « Tendre » rend רַךְ, tandis que « de bonne qualité » exprime ici la valeur qualitative de טוֹב sans suggérer que l'animal est déjà préparé.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: Le terme peut désigner un garçon, un jeune homme ou un serviteur. « Le jeune homme » préserve son sens lexical sans imposer dans le texte principal la fonction plus interprétative de serviteur.
- source_word: וַיְמַהֵר
  choice: se hâta
  rationale: Le verbe marque l'empressement. La proposition relative française indique naturellement que le sujet est le jeune homme, sujet le plus proche en hébreu.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: de le préparer
  rationale: Bien que עשה signifie largement « faire », il prend ici, dans le contexte alimentaire, le sens idiomatique de préparer l'animal pour le repas.
