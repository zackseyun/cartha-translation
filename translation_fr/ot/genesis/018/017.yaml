  text: וַֽ/יהֹוָ֖ה אָמָ֑ר הַֽ/מְכַסֶּ֤ה אֲנִי֙ מֵֽ/אַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: fr
  text: 'Yahweh dit[a] : « Cacherai-je à Abraham ce que je fais ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Suis-je en train de cacher à Abraham ce que je fais ? » Dans ce contexte, « ce que je fais » peut aussi se comprendre comme « ce que je vais faire ».'
    reason: alternative lexicale et nuance aspectuelle
lexical_decisions:
- source_word: וַֽיהֹוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de représenter directement le nom divin présent dans le texte hébreu.
- source_word: אָמָר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit et appelle naturellement le passé simple en français narratif.
- source_word: הַֽמְכַסֶּה אֲנִי
  choice: Cacherai-je
  rationale: L’interrogation avec participe exprime ici une délibération rhétorique. Le futur interrogatif français la rend avec naturel, sans transformer la question en affirmation.
- source_word: מֵֽאַבְרָהָם
  choice: à Abraham
  rationale: En français, la construction idiomatique est « cacher quelque chose à quelqu’un » ; elle correspond au rôle de la préposition hébraïque מִן après le verbe.
- source_word: אֲשֶׁר
  choice: ce que
  rationale: « Ce que » restitue naturellement le relatif hébreu employé avec pour antécédent implicite l’action divine.
- source_word: אֲנִי עֹשֶׂה
  choice: je fais
  rationale: Cette formulation rend directement le participe hébreu au présent et conserve son ouverture contextuelle, sans imposer explicitement la nuance prospective « je vais faire ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom propre divin. « Yahweh » le préserve plutôt que de le remplacer par un titre.
- issue: Valeur temporelle de אֲנִי עֹשֶׂה
  choice: ce que je fais
  alternative: ce que je vais faire
  rationale: Le participe peut viser l’action en cours ou envisagée dans le dessein divin. Le texte principal suit sa forme directe et la note signale la lecture prospective permise par le contexte.
translation_notes:
  register: Français international moderne, digne et naturel. Le passé simple convient à la narration biblique écrite ; l’inversion « Cacherai-je » conserve la forme délibérative et solennelle de la question sans archaïsme excessif.
