  text: וְ/אֶקְחָ֨ה פַת לֶ֜חֶם וְ/סַעֲד֤וּ לִבְּ/כֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי עַל כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל עַבְדְּ/כֶ֑ם וַ/יֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: fr
  text: 'Je vais chercher un morceau de pain[a], afin que vous repreniez des forces[b]. Après cela, vous pourrez poursuivre votre route, puisque c’est pour cela que vous êtes passés près de votre serviteur. Ils répondirent : « Oui, fais comme tu l’as dit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne modestement une petite quantité de pain dans ce contexte d’hospitalité.
    reason: cultural_clarification
  - marker: b
    text: 'Littéralement : « soutenez votre cœur » ou « fortifiez votre cœur »; cette expression évoque les forces rendues par la nourriture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: Je vais chercher
  rationale: Le cohortatif exprime ici l’offre courtoise d’Abraham. « Je vais chercher » rend naturellement cette valeur volontaire dans le contexte de l’hospitalité.
- source_word: פַת לֶחֶם
  choice: un morceau de pain
  rationale: L’expression désigne une petite quantité de pain et constitue une formulation modeste, alors qu’Abraham offrira en réalité un repas abondant.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: afin que vous repreniez des forces
  rationale: Littéralement, il s’agit de soutenir ou fortifier le cœur. L’expression idiomatique française rend clairement le réconfort procuré par la nourriture.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: Après cela, vous pourrez poursuivre votre route
  rationale: Le verbe עבר évoque ici la continuation du voyage; « pourrez » conserve la nuance de permission contenue dans l’offre hospitalière.
- source_word: כִּי עַל כֵּן
  choice: puisque c’est pour cela que
  rationale: Cette formulation conserve le lien explicatif de l’hébreu sans en préciser davantage la logique, qui reste quelque peu rhétorique.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: vous êtes passés auprès de votre serviteur
  rationale: « Passés auprès de » suit directement le mouvement exprimé par עבר, tandis que « votre serviteur » préserve l’autodésignation déférente d’Abraham.
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: D’accord, fais comme tu l’as dit
  rationale: La réponse exprime un assentiment bref. « D’accord » est naturel en français moderne, et le tutoiement correspond à la deuxième personne du singulier hébraïque adressée à Abraham.
