id: GEN.18.24
reference: Genesis 18:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: fr
  text: Peut-être y a-t-il cinquante justes au milieu de la ville. Vas-tu vraiment la balayer et ne pas épargner ce lieu à cause des cinquante justes qui s’y trouvent ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: Peut-être
  rationale: Introduit naturellement en français l’hypothèse prudente avancée par Abraham, sans lui donner une certitude absente de l’hébreu.
- source_word: יֵשׁ
  choice: y a-t-il
  rationale: Rend de façon idiomatique la construction existentielle hébraïque dans la proposition introduite par « Peut-être ».
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: cinquante justes
  rationale: « Justes » désigne ici des personnes reconnues comme justes, sans ajouter une précision de genre que l’hébreu contextuel n’exige pas.
- source_word: בְּתוֹךְ הָעִיר
  choice: au milieu de la ville
  rationale: Préserve l’expression spatiale forte de l’hébreu tout en restant naturelle et claire en français.
- source_word: הַאַף
  choice: vraiment
  rationale: Marque l’intensité rhétorique de la question d’Abraham sans la surcharger.
- source_word: תִּסְפֶּה
  choice: la balayer
  rationale: Conserve l’image vive d’une ville emportée dans le jugement; le pronom féminin renvoie naturellement à la ville.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: et ne pas épargner ce lieu
  rationale: Dans ce contexte, נשא exprime le fait de laisser subsister le lieu plutôt que de le détruire; « épargner » rend clairement ce contraste.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Exprime que la présence des justes constitue le motif envisagé pour épargner le lieu.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: qui s’y trouvent
  rationale: Rend explicitement la proposition relative et la localisation des justes dans la ville, dans un français fluide.
theological_decisions:
- issue: Sens de נשא dans « ne pas épargner ce lieu »
  choice: épargner
  alternative: pardonner
  rationale: Le contraste immédiat porte sur la destruction ou la préservation de la ville. « Épargner » garde cette portée judiciaire et narrative sans réduire le verbe à la seule notion de pardon moral.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La question conserve l’audace respectueuse de l’intercession d’Abraham. « Balayer » maintient l’image hébraïque du jugement, tandis que « ce lieu » évite une répétition pesante de « ville ».
