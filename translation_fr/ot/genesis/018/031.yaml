  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: fr
  text: 'Il dit : « Eh bien, j’ai osé parler à mon Seigneur. Peut-être s’en trouvera-t-il vingt là. » Il répondit : « Je ne détruirai pas à cause des vingt. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Voici
  rationale: Dans cette intervention déférente, les deux particules attirent poliment l’attention. « Voici » conserve cette fonction avec une dignité naturelle, sans le tour peu idiomatique « Vois, je te prie ».
- source_word: הוֹאַלְתִּי
  choice: j’ai osé
  rationale: Le verbe exprime ici le fait de prendre sur soi, avec hardiesse et humilité, de parler au Seigneur. « J’ai osé » rend naturellement cette nuance dans le contexte de l’intercession.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: parler à mon Seigneur
  rationale: Traduction directe de la construction. La majuscule à « Seigneur » marque que le titre désigne ici l’interlocuteur divin, sans le confondre avec le nom divin YHWH.
- source_word: אוּלַי
  choice: Peut-être
  rationale: Ce terme restitue la supposition prudente et respectueuse d’Abraham.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: s’en trouvera-t-il vingt là-bas
  rationale: La tournure impersonnelle française conserve la valeur passive du niphal de מצא tout en restant idiomatique.
- source_word: לֹא אַשְׁחִית
  choice: Je ne détruirai pas la ville
  rationale: L’objet n’est pas exprimé en hébreu mais se comprend d’après le contexte. « La ville » explicite discrètement le référent en français et évite un pronom ambigu.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: à cause de ces vingt-là
  rationale: Le syntagme donne les vingt comme motif de l’épargne. Le démonstratif restitue naturellement en français l’article hébreu qui renvoie au nombre précis venant d’être évoqué.
theological_decisions:
- issue: Valeur de אֲדֹנָי dans l’adresse d’Abraham
  choice: mon Seigneur
  alternative: mon seigneur
  rationale: Le contexte immédiat identifie l’interlocuteur au Seigneur. La majuscule signale le titre divin sans remplacer la forme présente par le nom YHWH.
- issue: Objet sous-entendu de לֹא אַשְׁחִית
  choice: la ville
  alternative: la détruire / détruire
  rationale: Le français demande utilement un objet explicite. « La ville » renvoie au lieu discuté dans le contexte sans modifier la logique de la réponse divine.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste concis; « j’ai osé » préserve la déférence d’Abraham, tandis que l’inversion « s’en trouvera-t-il » convient au registre soutenu sans archaïsme.
