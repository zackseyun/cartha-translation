  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: fr
  text: 'Le SEIGNEUR dit à Abraham : « Pourquoi Sara a-t-elle ri en se disant : “Est-ce que je vais vraiment avoir un enfant, maintenant que je suis vieille ?” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, avec les capitales signalant le nom divin.
- source_word: צָחֲקָה
  choice: a-t-elle ri
  rationale: Traduction directe et naturelle du verbe « rire ».
- source_word: הַאַף אֻמְנָם
  choice: Est-ce que… vraiment
  rationale: La combinaison interrogative et emphatique exprime l'étonnement incrédule de Sara; « vraiment » conserve cette force en français courant.
- source_word: אֵלֵד
  choice: je vais… avoir un enfant
  rationale: Rend idiomatiquement le verbe « enfanter » dans un registre moderne et accessible, sans modifier le sens.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: maintenant que je suis vieille
  rationale: Exprime naturellement la circonstance mise en avant par Sara, à savoir sa propre vieillesse.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: La forme traditionnelle française reste intelligible et digne, tout en distinguant typographiquement le nom divin du titre ordinaire « Seigneur ».
- issue: Nature de la question de Sara
  choice: Conserver une question marquée par « vraiment »
  alternative: Formulation affirmative ou résolution explicite en incrédulité
  rationale: Le texte exprime l'étonnement et le doute sans exiger une qualification théologique supplémentaire; la traduction préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours rapporté est formulé idiomatiquement; « avoir un enfant » évite le caractère plus soutenu ou clinique de « enfanter ».
