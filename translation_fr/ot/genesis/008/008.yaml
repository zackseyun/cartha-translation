revisions:
- from: Puis il lâcha la colombe loin de lui pour voir si les eaux avaient baissé à la surface du sol[a].
  to: Puis il lâcha la colombe d’auprès de lui pour voir si les eaux avaient diminué sur la surface du sol[a].
  rationale: La révision remplace l’idée additionnelle de distance par « d’auprès de lui », plus fidèle à מֵאִתּוֹ, et clarifie le rapport des eaux à la surface du sol. Elle maintient le sens non technique de la diminution des eaux et conserve l’ancrage de note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:48:40Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la progression narrative, la colombe, le but (« pour voir ») et la diminution des eaux. Toutefois, « loin de lui » ajoute l’idée de distance, absente de מֵאִתּוֹ, qui signifie plutôt « d’auprès de lui / de sa présence ». De plus, « avaient baissé à la surface du sol » ne rend pas clairement le complément hébreu « de dessus la surface du sol » et risque de situer la baisse à cette surface plutôt que d’indiquer que les eaux y avaient diminué.
  naturalness: « Il lâcha la colombe d’auprès de lui » est naturel dans un registre biblique moderne et conserve la précision du texte sans introduire l’arche. « Les eaux avaient diminué sur la surface du sol » est une formulation claire et idiomatique dans ce contexte.
  terminology: « Colombe », « eaux » et « sol » conviennent au contexte et au registre. « Diminué » rend sobrement le sens de קלל sans imposer une nuance plus forte de retrait complet.
  issues:
  - severity: medium
    issue: « loin de lui » traduit מֵאִתּוֹ de manière trop forte.
    rationale: L’hébreu indique le point de départ auprès de Noé, non une distance déterminée. « D’auprès de lui » préserve cette nuance.
  - severity: medium
    issue: « avaient baissé à la surface du sol » rend le complément spatial de façon ambiguë.
    rationale: Le texte indique que les eaux avaient diminué de dessus la surface du sol. La formulation proposée peut être comprise comme une baisse localisée « à la surface ».
  revised_text: Puis il lâcha la colombe d’auprès de lui pour voir si les eaux avaient diminué sur la surface du sol[a].
  revised_footnotes:
  - marker: a
    text: 'Littéralement : « de dessus la face du sol ».'
    reason: lexical_alternative
  revision_rationale: La révision remplace l’idée additionnelle de distance par « d’auprès de lui », plus fidèle à מֵאִתּוֹ, et clarifie le rapport des eaux à la surface du sol. Elle maintient le sens non technique de la diminution des eaux et conserve l’ancrage de note.
