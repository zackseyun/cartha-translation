  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: fr
  text: Puis il lâcha la colombe d’auprès de lui pour voir si les eaux avaient diminué sur la surface du sol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de dessus la face du sol ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Puis il lâcha
  rationale: Le wayyiqtol fait progresser le récit. « Puis » marque naturellement la succession, et « lâcha » convient au fait de laisser partir un oiseau tout en restant fidèle à l’idée d’envoyer.
- source_word: הַיּוֹנָה
  choice: la colombe
  rationale: יוֹנָה peut désigner une colombe ou un pigeon; « colombe » est le terme français établi et naturel dans ce récit.
- source_word: מֵאִתּוֹ
  choice: loin de lui
  rationale: La préposition exprime un mouvement à partir de la personne ou de la présence de Noé. « Loin de lui » conserve cette indication, sans substituer explicitement « de l’arche », qui n’est pas dans le texte hébreu.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: L’infinitif exprime le but; « pour voir » en donne une traduction directe et naturelle.
- source_word: הֲקַלּוּ
  choice: avaient baissé
  rationale: Dans ce contexte, קלל indique que les eaux ont diminué. « Avaient baissé » est courant en français et convient particulièrement au niveau des eaux.
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le pluriel hébreu est conservé par la tournure française biblique, mais toujours actuelle, « les eaux ».
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: à la surface du sol
  rationale: Cette formulation rend clairement l’image spatiale de l’hébreu. « Sol » convient ici à אֲדָמָה, qui désigne la terre ferme ou le terrain plutôt que le globe terrestre.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La syntaxe suit le mouvement narratif de l’hébreu. « Loin de lui » conserve la précision מֵאִתּוֹ, un peu inhabituelle en français, plutôt que de l’effacer ou de la remplacer par une mention explicite de l’arche.
