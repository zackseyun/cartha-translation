  text: וּ/בַ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָ֧ה וְ/עֶשְׂרִ֛ים י֖וֹם לַ/חֹ֑דֶשׁ יָבְשָׁ֖ה הָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: fr
  text: Et le vingt-septième jour du deuxième mois, la terre était sèche[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays était sec » ou « le sol était sec ». Le mot hébreu אֶרֶץ peut désigner la terre, un pays ou le sol ; « la terre » est retenu ici en raison de la portée générale donnée au déluge dans le récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ
  choice: Et au … mois
  rationale: La conjonction וּ et la préposition בַ introduisent une nouvelle indication temporelle dans la suite du récit. « Et au » conserve ce lien narratif sans l’alourdir.
- source_word: הַשֵּׁנִי
  choice: deuxième
  rationale: L’adjectif ordinal qualifie « mois » ; « au deuxième mois » est naturel et fidèle en français moderne.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: le vingt-septième jour du mois
  rationale: Il s’agit de la formule hébraïque habituelle pour dater un événement. Cette tournure en restitue clairement tous les éléments en français courant.
- source_word: יָבְשָׁה
  choice: était sèche
  rationale: Le qal parfait féminin singulier de יבש décrit ici l’état atteint à ce moment du récit. « Était sèche » rend bien cette valeur stative.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre, un pays ou le sol. « La terre » convient au cadre global du récit du déluge, tout en laissant les autres sens possibles dans la note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « mois » est conservée pour refléter la formule de datation hébraïque, et le « Et » initial maintient l’enchaînement narratif.
