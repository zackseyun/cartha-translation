  terminology: « Colombe » est exact et naturel. « Envoya » rend directement שׁלח et conserve la sobriété du texte source. « Ne revint plus vers lui » rend de façon naturelle la construction négative hébraïque, qui peut aussi se comprendre comme « ne revint pas de nouveau ».
