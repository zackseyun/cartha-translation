  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: fr
  text: Il attendit sept autres jours, puis il envoya la colombe, et elle ne revint plus vers lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: Il attendit
  rationale: Dans cette séquence narrative, le verbe יחל exprime l’attente. Le passé simple convient au registre narratif soutenu et naturel.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: encore sept autres jours
  rationale: L’expression indique une nouvelle période de sept jours. « Encore sept autres jours » conserve explicitement les deux éléments hébreux marquant l’addition et la répétition.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: puis il lâcha la colombe
  rationale: שׁלח signifie envoyer ou laisser partir. Dans le contexte concret d’un oiseau envoyé hors de l’arche, « lâcha » est idiomatique sans impliquer nécessairement une libération définitive.
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  choice: mais elle ne revint plus vers lui
  rationale: La construction négative יסף + infinitif, renforcée par עוֹד, signifie qu’une action ne se reproduit plus. « Ne revint plus » rend naturellement cette cessation en français; le féminin « elle » reprend « la colombe ».
