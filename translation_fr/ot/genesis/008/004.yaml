  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: fr
  text: Le septième mois, le dix-septième jour du mois, l’arche se posa sur les montagnes d’Ararat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit « les montagnes d’Ararat » : il désigne une région montagneuse, et non nécessairement un sommet précis tel que le mont Ararat.'
    reason: Précision lexicale et géographique destinée à préserver le pluriel de l’original.
lexical_decisions:
- source_word: וַתָּנַח
  choice: se posa
  rationale: Le verbe נוח au wayyiqtol décrit l’arrivée de l’arche à son lieu d’immobilisation. « Se posa » exprime naturellement cet aboutissement en français, sans suggérer un simple repos passager.
- source_word: הַתֵּבָה
  choice: l’arche
  rationale: « Arche » est l’équivalent français consacré et précis dans le récit de Noé, même si תֵּבָה peut désigner plus largement un coffre ou un contenant.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: Le septième mois
  rationale: Cette formulation temporelle est naturelle dans l’enchaînement d’une date en français et traduit fidèlement le repère donné par le texte.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: le dix-septième jour du mois
  rationale: Rendu clair et idiomatique de la formule hébraïque de datation.
- source_word: עַל
  choice: sur
  rationale: Préposition locative française la plus directe dans ce contexte.
- source_word: הָרֵי אֲרָרָט
  choice: les montagnes d’Ararat
  rationale: הָרֵי est un pluriel à l’état construit. Le rendu conserve donc plusieurs montagnes liées à la région d’Ararat, plutôt que de désigner un sommet unique.
theological_decisions:
- issue: Portée géographique de הָרֵי אֲרָרָט
  choice: les montagnes d’Ararat
  alternative: le mont Ararat
  rationale: L’hébreu emploie le pluriel « montagnes ». Le singulier traditionnel préciserait indûment un sommet particulier que le texte ne nomme pas.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe conserve la formule de datation solennelle du récit tout en restant immédiatement compréhensible. Le marqueur de note est placé après « Ararat », là où porte réellement l’explication.
