base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: fr
  text: Mais la colombe ne trouva aucun endroit où poser la plante de sa patte[a]. Elle revint donc vers lui, à l’arche, car les eaux couvraient toute la surface de la terre[b]. Il tendit alors la main, la prit et la fit entrer auprès de lui dans l’arche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un lieu de repos pour la plante de sa patte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les eaux étaient sur la face de toute la terre ».'
    reason: literal_rendering
  - marker: c
    text: 'Littéralement : « il la fit venir vers lui, dans l’arche ».'
    reason: literal_rendering
lexical_decisions:
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: endroit où poser la plante de sa patte
  rationale: Cette formulation naturelle en français exprime concrètement le lieu de repos recherché et conserve l’image précise de la plante du pied; pour une colombe, «patte» est idiomatique.
- source_word: וַתָּשָׁב אֵלָיו אֶל הַתֵּבָה
  choice: Elle revint donc vers lui, à l’arche
  rationale: «Revint» rend שׁוב, tandis que «donc» explicite sobrement la conséquence narrative. Les deux compléments, vers Noé et vers l’arche, sont conservés.
- source_word: מַיִם עַל פְּנֵי כָל הָאָרֶץ
  choice: les eaux couvraient encore toute la surface de la terre
  rationale: «Toute la surface de la terre» préserve l’image de פְּנֵי כָל־הָאָרֶץ. «Couvraient» donne en français naturel le sens contextuel de la présence des eaux sur cette surface; «encore» est contextuellement implicite dans la situation persistante.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: tendit alors la main
  rationale: Il s’agit de l’équivalent idiomatique français de l’expression hébraïque littéralement «envoya sa main».
- source_word: וַיִּקָּחֶהָ
  choice: la prit
  rationale: Traduction directe et naturelle du qal de לקח dans ce contexte.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל הַתֵּבָה
  choice: la fit entrer auprès de lui dans l’arche
  rationale: La formulation conserve à la fois אֵלָיו, «auprès de lui», et אֶל הַתֵּבָה, compris ici comme un mouvement vers l’intérieur de l’arche, tout en restant fluide en français.
theological_decisions:
- issue: Portée de כָל הָאָרֶץ
  choice: toute la surface de la terre
  alternative: toute la surface du pays
  rationale: Le texte garde l’expression hébraïque ample sans trancher ici la question de la portée géographique de אֶרֶץ.
translation_notes:
  register: Français international moderne, narratif et digne. Le nom «Noé» est explicité dans la seconde phrase pour éviter une succession de pronoms ambigus en français. Les images hébraïques essentielles sont conservées dans le texte ou signalées en note.
