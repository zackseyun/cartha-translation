source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: fr
  text: Tant que la terre durera[a], semailles et moisson, froid et chaleur, été et hiver, jour et nuit ne cesseront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « encore, tous les jours de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: Tant que la terre durera
  rationale: La tournure exprime la durée future de l’ordre terrestre. Cette formulation française naturelle rend le sens temporel tout en conservant la limite inhérente aux « jours de la terre ».
- source_word: זֶרַע וְקָצִיר
  choice: semailles et moisson
  rationale: Dans cette paire agricole, זֶרַע désigne l’activité ou le temps des semailles plutôt que la semence comme objet, et קָצִיר la moisson.
- source_word: קֹר וָחֹם
  choice: froid et chaleur
  rationale: Cette paire de contraires climatiques est rendue directement et naturellement.
- source_word: קַיִץ וָחֹרֶף
  choice: été et hiver
  rationale: Ces équivalents usuels préservent la paire saisonnière; dans le contexte levantin, les termes peuvent aussi évoquer les saisons sèche et pluvieuse.
- source_word: יוֹם וָלַיְלָה
  choice: jour et nuit
  rationale: La paire fixe désigne le cycle continuel du temps et se traduit directement en français.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: ne cesseront pas
  rationale: Le verbe שׁבת signifie ici cesser ou s’interrompre. Le pluriel renvoie naturellement à l’ensemble des cycles énumérés.
theological_decisions:
- issue: Portée et durée de la promesse concernant les cycles de la création
  choice: La stabilité des cycles ordinaires est promise tant que la terre durera.
  alternative: Une promesse absolue selon laquelle ces cycles se poursuivraient éternellement, sans aucune limite.
  rationale: L’expression כָּל יְמֵי הָאָרֶץ limite naturellement l’affirmation à la durée des « jours de la terre »; la traduction ne transforme donc pas cette promesse en déclaration métaphysique illimitée.
translation_notes:
  register: Français international moderne, clair et digne. La série nominale sans articles conserve le rythme solennel et équilibré de l’hébreu.
