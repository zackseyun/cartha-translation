id: GEN.8.13
reference: Genesis 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: fr
  text: La six cent unième année[a], le premier jour du premier mois, les eaux avaient séché à la surface de la terre. Noé enleva alors la couverture de l’arche[b]. Il regarda, et voici que la surface du sol était sèche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le contexte indique vraisemblablement la six cent unième année de la vie de Noé, mais l’hébreu ne le précise pas ici.
    reason: contextual_clarification
  - marker: b
    text: 'Ou : « le toit de l’arche ». Le mot hébreu désigne une couverture sans en préciser davantage la forme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: La six cent unième année
  rationale: La formule narrative introduit ici une indication temporelle. En français, l’intégrer directement à la date évite le lourd « Et il arriva que » tout en conservant la progression du récit.
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: la six cent unième année
  rationale: Rend naturellement l’ordinal hébreu sans préciser qu’il s’agit de l’âge de Noé, élément implicite dans le contexte mais non exprimé dans ce verset.
- source_word: בָּרִאשׁוֹן
  choice: au premier mois
  rationale: Le nom « mois », sous-entendu en hébreu, est explicité en français à partir du contexte calendaire.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: le premier jour du mois
  rationale: Formulation française claire de la date exprimée littéralement par « le un du mois ».
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: les eaux qui couvraient la terre s’étaient asséchées
  rationale: « S’étaient asséchées » exprime l’état atteint dans le récit; la relative rend idiomatiquement מֵעַל, qui situe les eaux au-dessus de la terre.
- source_word: וַיָּסַר
  choice: enleva
  rationale: Rend simplement et précisément la forme causative de סור, « retirer, enlever ».
- source_word: מִכְסֵה
  choice: la couverture
  rationale: Conserve le sens général de l’hébreu sans imposer l’interprétation architecturale plus précise « toit ».
- source_word: הַתֵּבָה
  choice: l’arche
  rationale: Terme français traditionnel, clair et contextuellement établi pour l’embarcation de Noé.
- source_word: וַיַּרְא
  choice: Il regarda
  rationale: Dans la séquence suivant l’enlèvement de la couverture, « regarda » exprime l’acte d’observer.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Préserve la fonction présentative et l’effet de découverte de הִנֵּה dans un registre narratif digne mais actuel.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: la surface du sol était sèche
  rationale: « Surface » rend naturellement פְּנֵי et « sol » distingue הָאֲדָמָה de הָאָרֶץ dans la première proposition.
theological_decisions:
- issue: Référent de la « six cent unième année »
  choice: Le texte ne précise pas « de la vie de Noé »
  alternative: la six cent unième année de la vie de Noé
  rationale: Le contexte suggère le décompte de l’âge de Noé, mais le verset laisse le référent implicite; l’ajout dans le texte résoudrait une donnée que l’hébreu n’explicite pas.
translation_notes:
  register: 'Français international moderne, narratif et digne. La syntaxe évite l’archaïsme « il arriva que »; « voici que » maintient toutefois l’effet de découverte de l’hébreu. Les deux emplois de חרב sont différenciés naturellement : les eaux « s’étaient asséchées », tandis que la surface du sol « était sèche ».'
