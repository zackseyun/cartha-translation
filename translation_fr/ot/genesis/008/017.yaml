base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: fr
  text: 'Fais sortir avec toi tous les êtres vivants de toute espèce qui sont avec toi : les oiseaux, le bétail et tout ce qui rampe sur la terre. Qu’ils foisonnent[a] sur la terre, qu’ils soient féconds et se multiplient sur la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pullulent ». Le verbe hébreu exprime l’idée d’un foisonnement abondant.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה אֲשֶׁר אִתְּךָ
  choice: tous les êtres vivants qui sont avec toi
  rationale: « Êtres vivants » rend la portée collective de חַיָּה sans la limiter aux animaux sauvages; la relative est conservée simplement.
- source_word: מִכָּל בָּשָׂר
  choice: parmi toutes les créatures
  rationale: Dans le récit du déluge, בָּשָׂר désigne collectivement les êtres animés. Cette formulation transmet le sens en français naturel sans imposer l’expression peu claire « de toute chair ».
- source_word: בָּעוֹף וּבַבְּהֵמָה
  choice: les oiseaux, le bétail
  rationale: « Oiseaux » convient ici à עוֹף, tandis que « bétail » rend la catégorie habituelle désignée par בְּהֵמָה dans cette énumération.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: et toutes les petites bêtes qui se déplacent sur la terre
  rationale: רֶמֶשׂ désigne les petites créatures qui se meuvent près du sol. « Se déplacent » évite de limiter indûment la catégorie aux seuls animaux qui rampent, bien que le jeu de mots hébreu soit moins directement reproduit.
- source_word: הוֹצֵא אִתָּךְ
  choice: Fais sortir avec toi
  rationale: La forme causative de יצא commande à Noé de faire sortir les créatures; « fais sortir » en conserve précisément la force.
- source_word: וְשָׁרְצוּ
  choice: Qu’ils foisonnent
  rationale: Le verbe שׁרץ évoque une prolifération abondante et rappelle le vocabulaire de la création. La tournure injonctive française respecte la coordination hébraïque sans la réduire explicitement à un simple but.
- source_word: וּפָרוּ וְרָבוּ
  choice: qu’ils soient féconds et se multiplient
  rationale: Cette formulation maintient l’écho délibéré à la bénédiction créatrice de la Genèse.
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: sur la terre
  rationale: Dans le contexte universel qui suit le déluge, אָרֶץ désigne ici la terre plutôt qu’un territoire local.
theological_decisions:
- issue: Écho de la bénédiction créatrice après le déluge
  choice: Conserver « foisonnent », « soient féconds » et « se multiplient »
  alternative: Employer une formulation générale telle que « deviennent très nombreux »
  rationale: Le verset reprend intentionnellement le vocabulaire de la création et présente ainsi le repeuplement après le jugement, sans qu’il soit nécessaire d’ajouter une interprétation doctrinale.
- issue: Rapport logique de וְשָׁרְצוּ avec l’ordre précédent
  choice: 'Le rendre par une injonction coordonnée : « Qu’ils foisonnent »'
  alternative: 'Le rendre explicitement comme un but : « afin qu’ils foisonnent »'
  rationale: La forme hébraïque permet d’entendre la prolifération comme la suite voulue de la sortie, tout en gardant une force injonctive. La formulation choisie préserve mieux cette légère ouverture.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire de la fécondité conserve les échos internes à la Genèse; « petites bêtes qui se déplacent » privilégie l’intelligibilité actuelle sans registre familier.
