  text: וַ/יָּשֻׁ֧בוּ הַ/מַּ֛יִם מֵ/עַ֥ל הָ/אָ֖רֶץ הָל֣וֹךְ וָ/שׁ֑וֹב וַ/יַּחְסְר֣וּ הַ/מַּ֔יִם מִ/קְצֵ֕ה חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: fr
  text: Les eaux se retirèrent progressivement de la surface de la terre et, au bout de cent cinquante jours, les eaux avaient diminué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: se retirèrent
  rationale: Le verbe שׁוב signifie fondamentalement « revenir » ou « retourner »; appliqué aux eaux qui couvraient la terre, « se retirer » exprime naturellement leur reflux.
- source_word: מֵעַל הָאָרֶץ
  choice: de la surface de la terre
  rationale: Cette formulation conserve l’image spatiale d’eaux étendues au-dessus du sol tout en restant idiomatique en français moderne.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: progressivement
  rationale: La construction associant deux infinitifs absolus décrit ici un mouvement continu et progressif. La rendre littéralement par « allant et revenant » pourrait suggérer à tort une simple oscillation.
- source_word: וַיַּחְסְרוּ
  choice: avaient baissé
  rationale: חסר indique que les eaux diminuent. « Avaient baissé » distingue cette diminution du retrait exprimé dans la première proposition et convient naturellement au contexte.
- source_word: מִקְצֵה
  choice: au bout de
  rationale: Dans cet emploi temporel, l’expression marque l’achèvement de la période indiquée; « au bout de » est précis et courant.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: cent cinquante jours
  rationale: Rendu cardinal direct et idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le verset conserve les deux aspects du texte hébreu — retrait progressif puis diminution constatée après la période indiquée — sans reproduire une tournure hébraïque qui évoquerait en français un va-et-vient ambigu.
