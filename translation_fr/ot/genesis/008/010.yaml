  yaml_path: translation/ot/genesis/008/010.yaml
  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: fr
  text: Il attendit encore sept jours[a], puis il envoya de nouveau la colombe hors de l’arche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il commença une nouvelle attente de sept jours » ; le verbe hébreu peut signifier plus littéralement « commencer », mais, dans ce contexte, il s’emploie idiomatiquement au sens d’« attendre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: il attendit
  rationale: Avec l’expression de durée qui suit, le verbe s’emploie ici idiomatiquement au sens d’attendre avant d’agir de nouveau; « il attendit » est naturel en français et convient à la progression du récit.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: encore sept jours
  rationale: עוֹד et אֲחֵרִים signalent ensemble une période supplémentaire. « Encore sept jours » rend cette idée sans la lourdeur de « sept autres jours supplémentaires ».
- source_word: וַיֹּסֶף שַׁלַּח
  choice: puis il envoya de nouveau
  rationale: La construction exprime la répétition de l’action. « De nouveau » préserve ce sens, tandis que « puis » marque naturellement la succession narrative.
- source_word: הַיּוֹנָה
  choice: la colombe
  rationale: Le nom défini désigne la colombe déjà mentionnée dans le récit.
- source_word: מִן הַתֵּבָה
  choice: hors de l’arche
  rationale: La préposition indique le point de départ, et « hors de l’arche » exprime clairement le mouvement vers l’extérieur impliqué par l’envoi.
