  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: fr
  text: Les sources de l’abîme et les fenêtres du ciel[a] furent fermées, et la pluie venant du ciel fut retenue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vannes du ciel ». Le mot hébreu désigne littéralement des ouvertures ou des fenêtres.
    reason: lexical_alternative
  - marker: b
    text: Ou « la pluie venant du ciel cessa ». Le verbe hébreu peut souligner que la pluie fut empêchée de continuer, ce qui entraîna son arrêt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: furent fermées
  rationale: Le nifal exprime ici la fermeture des deux sujets, les sources et les fenêtres. La tournure passive respecte la forme hébraïque et reste naturelle en français.
- source_word: מַעְיְנֹת
  choice: les sources
  rationale: Le mot désigne des points d'où jaillit l'eau. « Sources » est clair et idiomatique en français moderne, sans l'ambiguïté contemporaine de « fontaines ».
- source_word: תְּהוֹם
  choice: des profondeurs
  rationale: Dans ce contexte, le terme évoque la masse d'eaux profondes ou l'abîme primordial. « Des profondeurs » forme en français l'expression naturelle « les sources des profondeurs » tout en maintenant l'imagerie cosmique.
- source_word: אֲרֻבֹּת
  choice: les fenêtres
  rationale: Le sens concret est celui d'ouvertures ou de fenêtres. Cette traduction préserve l'image hébraïque plutôt que de l'interpréter d'emblée comme des vannes.
- source_word: הַשָּׁמַיִם
  choice: le ciel
  rationale: Bien que le nom hébreu ait une forme plurielle, « le ciel » est l'équivalent cosmologique naturel en français moderne et conserve l'image d'ouvertures célestes.
- source_word: וַיִּכָּלֵא
  choice: fut retenue
  rationale: Le verbe indique que la pluie est empêchée de continuer, plutôt que de simplement constater qu'elle cesse. « Fut retenue » garde cette nuance et la voix passive.
- source_word: הַגֶּשֶׁם
  choice: la pluie
  rationale: Équivalent français direct et naturel dans le récit.
- source_word: מִן הַשָּׁמָיִם
  choice: venant du ciel
  rationale: Cette formulation conserve l'origine céleste de la pluie et la répétition du mot « ciel », tout en évitant l'enchaînement peu naturel « la pluie du ciel fut retenue ».
