base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: fr
  text: Tous les animaux, toutes les bêtes qui rampent et tous les oiseaux — tout ce qui se déplace sur la terre — sortirent de l’arche selon leurs familles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par familles ». L’expression hébraïque évoque des groupes apparentés ou des divisions parmi les animaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: Tous les animaux
  rationale: Dans cette énumération, חַיָּה désigne les animaux terrestres, distingués des bêtes qui rampent et des oiseaux. « Animaux » est naturel en français moderne et n’impose pas la distinction entre animaux sauvages et domestiques.
- source_word: כָּל הָרֶמֶשׂ
  choice: toutes les bêtes qui rampent
  rationale: רֶמֶשׂ désigne de petites créatures qui se déplacent près du sol. Cette formulation reste compréhensible et conserve la catégorie propre au récit de la Genèse.
- source_word: וְכָל הָעוֹף
  choice: et tous les oiseaux
  rationale: Dans cette série, « oiseaux » rend naturellement עוֹף, sans élargir inutilement le terme à toute créature volante.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: tout ce qui se déplace sur la terre
  rationale: Le participe רוֹמֵשׂ appartient au même champ lexical que רֶמֶשׂ. « Se déplace » évite une répétition lourde de « ramper » tout en gardant le sens général du mouvement à la surface de la terre.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: selon leurs familles
  rationale: מִשְׁפָּחָה signifie normalement « famille » ou « clan ». Dans ce contexte animal, l’expression évoque des groupes apparentés ou des divisions, sans imposer le terme plus interprétatif « espèces ».
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: sortirent de l’arche
  rationale: Le verbe יָצְאוּ exprime simplement la sortie. « Sortirent de l’arche » est direct, idiomatique et conserve le terme traditionnel pour תֵּבָה dans le récit de Noé.
