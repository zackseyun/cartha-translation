  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: fr
  text: Noé sortit donc, avec ses fils, sa femme et les femmes de ses fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit donc
  rationale: Le wayyiqtol fait avancer le récit et, dans ce contexte, présente la sortie comme la suite immédiate de l’ordre divin précédent. « Sortit donc » est naturel en français sans expliciter davantage le rapport logique.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: וּבָנָיו
  choice: avec ses fils
  rationale: בָּנִים désigne ici les fils de Noé. La préposition « avec », placée devant l’ensemble de l’énumération, rend naturellement en français la relation exprimée à la fin par אִתּוֹ.
- source_word: וְאִשְׁתּוֹ
  choice: sa femme
  rationale: Le nom singulier muni du suffixe masculin singulier signifie directement « sa femme ».
- source_word: וּנְשֵׁי בָנָיו
  choice: les femmes de ses fils
  rationale: Cette formulation suit de près l’expression hébraïque et évite de substituer le terme relationnel plus interprétatif « belles-filles ».
- source_word: אִתּוֹ
  choice: avec
  rationale: L’hébreu clôt la liste par « avec lui ». En français, rattacher « avec » au début de l’énumération évite une reprise finale lourde tout en conservant exactement le rapport d’accompagnement.
