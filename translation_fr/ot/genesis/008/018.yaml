translation_notes:
  register: 'Français moderne, international et digne. La syntaxe a été légèrement réorganisée pour obtenir une phrase naturelle : l’hébreu place « avec lui » à la fin, tandis que le français introduit normalement l’énumération par « avec ». Aucun marqueur de note n’est requis.'
