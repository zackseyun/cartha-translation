source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: fr
  text: Mais Dieu se souvint de Noé[a], ainsi que de tous les animaux sauvages et de tous les animaux domestiques qui étaient avec lui dans l’arche. Dieu fit passer un vent[b] sur la terre, et les eaux s’apaisèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu porta son attention sur Noé ». En hébreu, « se souvenir » implique souvent une intervention fidèle, et non un simple rappel à la mémoire.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu רוּחַ peut signifier « vent », « souffle » ou « esprit ». Ici, « vent » convient le mieux au contexte, mais l’expression peut faire écho au souffle ou à l’Esprit au-dessus des eaux en Genèse 1.2.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: se souvint
  rationale: 'Conserve l’idiome hébreu et sa portée narrative : il ne s’agit pas d’un simple souvenir mental, mais d’une attention fidèle qui se manifeste par l’action.'
- source_word: כָּל הַחַיָּה
  choice: tous les animaux sauvages
  rationale: Dans son association avec בְּהֵמָה, חַיָּה désigne vraisemblablement les animaux sauvages; cette traduction maintient la distinction entre les deux catégories.
- source_word: כָּל הַבְּהֵמָה
  choice: tous les animaux domestiques
  rationale: Le terme désigne ici les animaux domestiqués, par contraste avec חַיָּה. Cette formulation est claire en français international moderne.
- source_word: בַּתֵּבָה
  choice: dans l’arche
  rationale: « Arche » est le terme français établi et immédiatement reconnaissable dans le récit de Noé.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: fit passer un vent
  rationale: Le sens météorologique de רוּחַ convient le mieux à l’action exercée sur les eaux, tandis que « fit passer » reflète la forme causative du verbe עבר.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays; dans le cadre général du déluge, « la terre » convient au contexte sans préciser davantage son étendue.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: les eaux s’apaisèrent
  rationale: Le verbe exprime l’apaisement ou la diminution des eaux. « S’apaisèrent » rend l’image hébraïque sans ajouter explicitement une baisse de niveau.
- source_word: וַ
  choice: Mais
  rationale: À l’ouverture du verset, la conjonction marque ici le tournant du récit, du jugement vers l’intervention salvatrice de Dieu; « Mais » rend naturellement cette fonction discursive.
theological_decisions:
- issue: Langage anthropomorphique dans « Dieu se souvint de Noé »
  choice: Conserver « Dieu se souvint de Noé »
  alternative: « Dieu pensa à Noé » ou « Dieu porta son attention sur Noé »
  rationale: La formulation hébraïque est maintenue sans laisser entendre que Dieu aurait auparavant oublié Noé. Dans ce contexte, le souvenir divin débouche sur une intervention fidèle.
- issue: Sens de רוּחַ dans le récit du déluge
  choice: Traduire par « vent » dans le texte principal
  alternative: « souffle » ou « esprit »
  rationale: L’effet exercé sur les eaux favorise le sens concret de « vent ». La note conserve toutefois la polysémie du mot et le possible écho de Genèse 1.2.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsmes lexicaux. La distinction entre animaux sauvages et domestiques est explicitement maintenue, ainsi que les ambiguïtés théologiques de « se souvenir » et de רוּחַ.
