  to: 'Le SEIGNEUR sentit l’agréable odeur[a], et le SEIGNEUR se dit en lui-même[b] : « Je ne maudirai plus jamais le sol à cause de l’être humain, car l’inclination du cœur de l’être humain est mauvaise dès sa jeunesse[c]. Je ne frapperai plus jamais toute créature vivante, comme je l’ai fait. »'
  rationale: La révision corrige le verbe de perception, rétablit la valeur non interprétative de « car », respecte le singulier de יֵצֶר et le collectif singulier de כָּל־חַי. Elle maintient le registre moderne et digne, l’anthropomorphisme du texte et les ancres de notes, tout en réservant la possible nuance concessive à une note plutôt qu’au texte traduit.
