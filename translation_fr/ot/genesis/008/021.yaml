  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: fr
  text: 'Le SEIGNEUR sentit l’agréable odeur[a], et le SEIGNEUR se dit en lui-même[b] : « Je ne maudirai plus jamais le sol à cause de l’être humain, car l’inclination du cœur de l’être humain est mauvaise dès sa jeunesse[c]. Je ne frapperai plus jamais toute créature vivante, comme je l’ai fait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, une expression telle que « l’odeur apaisante » ou « l’odeur de repos » ; il s’agit d’une formule hébraïque désignant une odeur qui plaît.
    reason: Signale la nuance idiomatique de רֵיחַ הַנִּיחֹחַ sans faire de son étymologie une interprétation déterminante.
  - marker: b
    text: 'Littéralement : « dit à son cœur ».'
    reason: Conserve l’image hébraïque derrière l’expression française d’une parole intérieure.
  - marker: c
    text: 'Le mot rendu par « car » peut, selon le contexte, recevoir une nuance concessive : Dieu fait cette promesse alors même que l’inclination humaine demeure mauvaise.'
    reason: Le texte principal conserve la valeur causale usuelle de כִּי, tandis que la note indique sobrement la nuance contextuelle possible.
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, tout en le distinguant d’un simple titre.
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: l’odeur agréable
  rationale: Expression naturelle qui conserve l’idée d’une odeur suscitant l’agrément ou l’apaisement.
- source_word: אֶל־לִבּוֹ
  choice: en lui-même
  rationale: L’expression idiomatique signifie que le propos est intérieur; la note conserve l’image littérale du cœur.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: les penchants du cœur humain
  rationale: יֵצֶר désigne ce qui se forme ou s’oriente intérieurement; le pluriel français exprime naturellement les dispositions du cœur sans réduire le terme à une intention ponctuelle.
- source_word: מִנְּעֻרָיו
  choice: dès sa jeunesse
  rationale: Conserve la portée temporelle de la préposition מִן dans une formulation française courante.
- source_word: כָּל־חַי
  choice: tous les êtres vivants
  rationale: Formulation inclusive et naturelle pour tout ce qui vit dans le contexte du déluge.
theological_decisions:
- issue: Lien logique de כִּי entre la promesse et le mal du cœur humain
  choice: même si
  alternative: car
  rationale: Le contexte présente la persistance du mal humain comme une réalité reconnue malgré laquelle Dieu promet de ne plus maudire ainsi le sol. « Même si » rend cette valeur concessive plausible sans faire du mal humain la cause positive de la clémence; une note signale l’ambiguïté de la conjonction.
- issue: Anthropomorphisme de l’odeur du sacrifice
  choice: respira l’odeur agréable
  alternative: agréa le parfum du sacrifice
  rationale: Conserve l’image concrète du texte hébreu sans la remplacer par une interprétation théologique explicative.
- issue: Parole divine intérieure
  choice: se dit en lui-même
  alternative: dit dans son cœur
  rationale: Rend clairement la délibération intérieure en français moderne, tout en maintenant l’hébraïsme dans une note.
translation_notes:
  register: Français international moderne, digne et accessible. « L’être humain » et « le cœur humain » évitent que אָדָם soit compris comme le seul individu Adam ou exclusivement comme le sexe masculin. La répétition « plus jamais » restitue l’insistance des deux engagements divins.
