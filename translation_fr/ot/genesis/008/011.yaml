  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: fr
  text: La colombe vint vers lui vers le soir[a]. Et voici qu’elle avait dans le bec une feuille d’olivier fraîchement arrachée[b]. Noé sut alors que les eaux avaient baissé sur la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vint vers lui »; le contexte peut impliquer un retour.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne quelque chose d’arraché ou de cueilli, ce qui suggère que la feuille venait d’être prise sur un olivier vivant.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « avaient diminué sur la terre »; le verbe indique que les eaux avaient décru ou s’étaient retirées de dessus la terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: revint vers lui
  rationale: Le verbe בוא signifie littéralement « venir », mais le contexte indique que la colombe revient auprès de Noé. « Revint vers lui » exprime naturellement ce mouvement en français; la valeur littérale est signalée en note.
- source_word: לְעֵת עֶרֶב
  choice: au moment du soir
  rationale: Cette formulation actuelle et digne rend la désignation temporelle hébraïque sans préciser davantage si la scène se situe au début ou au cours de la soirée.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la fonction présentative et la vivacité de הִנֵּה, qui attire l’attention sur la découverte inattendue.
- source_word: עֲלֵה זַיִת
  choice: une feuille d’olivier
  rationale: Équivalent français naturel du groupe construit signifiant littéralement « feuille d’olivier ».
- source_word: טָרָף
  choice: fraîchement arrachée
  rationale: Le terme évoque quelque chose d’arraché ou de cueilli; « fraîchement arrachée » conserve à la fois l’acte physique et l’indice d’une végétation vivante.
- source_word: בְּפִיהָ
  choice: dans le bec
  rationale: Pour un oiseau, « dans le bec » est le français idiomatique correspondant à l’expression hébraïque littérale « dans sa bouche ».
- source_word: וַיֵּדַע נֹחַ
  choice: Noé sut alors
  rationale: « Alors » relie naturellement le signe observé à la conclusion qu’en tire Noé, tout en faisant progresser le récit.
- source_word: קַלּוּ הַמַּיִם
  choice: les eaux avaient baissé
  rationale: Le verbe indique que les eaux avaient diminué ou décru. « Avaient baissé » est clair et naturel en français moderne.
- source_word: מֵעַל הָאָרֶץ
  choice: à la surface de la terre
  rationale: Cette expression rend la relation spatiale de מֵעַל, les eaux diminuant de dessus la terre, sans le tour français lourd « de dessus la terre ».
