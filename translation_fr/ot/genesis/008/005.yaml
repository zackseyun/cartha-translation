  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: fr
  text: Les eaux continuèrent à baisser jusqu’au dixième mois. Le premier jour du dixième mois, les sommets des montagnes devinrent visibles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « apparurent » ou « furent vus ».
    reason: Le verbe hébreu permet une traduction plus formellement passive ou le sens d’une apparition dans le champ de vision.
lexical_decisions:
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le pluriel français « les eaux » convient au récit du déluge et conserve la valeur collective du nom hébreu.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: continuèrent à baisser
  rationale: La construction exprime une diminution progressive et continue; cette formulation est naturelle en français et adaptée au mouvement des eaux.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: jusqu’au dixième mois
  rationale: חֹדֶשׁ désigne ici le mois dans la chronologie narrative.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: Le dixième mois, le premier jour du mois
  rationale: La formulation développe naturellement l’expression elliptique hébraïque tout en conservant la date exacte.
- source_word: נִרְאוּ
  choice: devinrent visibles
  rationale: Le nifal de ראה peut exprimer l’entrée dans le champ de vision; cette traduction évite de supposer un observateur précis.
- source_word: רָאשֵׁי הֶהָרִים
  choice: les sommets des montagnes
  rationale: Dans ce contexte topographique, « sommets » rend naturellement l’image littérale des « têtes » des montagnes.
