id: GEN.8.20
reference: Genesis 8:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: fr
  text: Noé bâtit alors un autel pour Yahweh[a]. Il prit de chaque espèce d’animal pur et de chaque espèce d’oiseau pur, et offrit des holocaustes sur l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le SEIGNEUR ». L’hébreu porte le nom divin YHWH, traditionnellement représenté par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: bâtit
  rationale: Le verbe בנה signifie directement « bâtir » ou « construire » ; « bâtit » convient au récit et au registre biblique moderne.
- source_word: מִזְבֵּחַ
  choice: autel
  rationale: Équivalent français usuel de מזבח, lieu où sont offerts les sacrifices.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque ici le destinataire ou le bénéficiaire de l’autel. La forme « Yahweh » représente explicitement le nom divin יהוה.
- source_word: מִכֹּל
  choice: de chaque espèce de
  rationale: La construction est littéralement « de tout/de chaque ». Dans le contexte, elle indique un prélèvement parmi chacune des catégories pures, non le sacrifice de tous les individus ; « de chaque espèce de » exprime naturellement cette valeur partitive sans ajouter « quelques-uns ».
- source_word: הַבְּהֵמָה
  choice: animal
  rationale: בהמה désigne ici les animaux terrestres, notamment domestiques ; le terme général « animal » reste clair sans restreindre indûment la catégorie.
- source_word: הַטְּהוֹרָה / הַטָּהֹר
  choice: pur
  rationale: טהור distingue les animaux rituellement aptes au sacrifice. « Pur » est la formulation biblique française concise et établie.
- source_word: הָעוֹף
  choice: oiseau
  rationale: Dans ce contexte sacrificiel, « oiseau » est l’équivalent français naturel de עוף.
- source_word: וַיַּעַל
  choice: offrit
  rationale: Le hiphil de עלה, avec un sacrifice pour complément, signifie idiomatiquement « offrir » sur l’autel.
- source_word: עֹלֹת
  choice: holocaustes
  rationale: עֹלָה désigne un sacrifice entièrement consumé. « Holocaustes » est le terme cultuel français précis et traditionnel, employé ici au pluriel.
- source_word: בַּמִּזְבֵּחַ
  choice: sur l’autel
  rationale: La préposition ב est naturellement rendue ici par « sur », indiquant le lieu de l’offrande.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » conserve le caractère propre du nom divin, tandis que « le SEIGNEUR » suit la convention de substitution attestée dans de nombreuses traductions.
- issue: Valeur partitive de מִכֹּל
  choice: de chaque espèce d’animal pur et de chaque espèce d’oiseau pur
  alternative: de tout animal pur et de tout oiseau pur
  rationale: Le contexte implique que Noé prélève des représentants parmi les catégories pures plutôt qu’il ne sacrifie tous les animaux purs. L’ajout de « espèce » explicite sobrement cette valeur contextuelle, tout en évitant de fixer un nombre absent de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été répartie en deux phrases pour une lecture naturelle. « Holocaustes » conserve la précision cultuelle du terme hébreu ; « de chaque espèce » rend la portée partitive du contexte sans suggérer que tous les animaux purs furent sacrifiés.
