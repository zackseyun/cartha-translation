    issue: « lâcha » pour וַיְשַׁלַּח
    rationale: Le verbe signifie envoyer ou dépêcher. « Lâcha » peut convenir à un oiseau libéré, mais il est plus familier et atténue l’acte délibéré d’envoi.
  - severity: medium
    issue: « se soient retirées » pour יְבֹשֶׁת
    rationale: Le verbe hébreu est « sécher ». Le retrait des eaux est une conséquence plausible dans le récit, mais n’est pas le lexème employé ici.
  - severity: low
    issue: La sortie initiale du corbeau n’apparaît que dans la note
    rationale: וַיֵּצֵא est un verbe fini distinct avant l’expression intensive « allant et revenant »; il convient de l’exprimer dans le texte principal.
  revised_text: Puis il envoya le corbeau; celui-ci sortit, allant et revenant, jusqu’à ce que les eaux aient séché sur la terre.
