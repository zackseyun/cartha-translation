- from: Puis il lâcha le corbeau, qui allait et revenait[a] jusqu’à ce que les eaux se soient retirées de dessus la terre.
  to: Puis il envoya le corbeau; celui-ci sortit, allant et revenant, jusqu’à ce que les eaux aient séché sur la terre.
  rationale: La révision rend explicitement l’envoi et la sortie du corbeau, conserve l’aspect itératif de l’expression hébraïque et traduit le verbe « sécher » sans imposer l’interprétation selon laquelle les eaux se retirent. La note documente la forme intensive sans ajouter de sens doctrinal ou narratif.
