  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: fr
  text: Puis il envoya le corbeau; celui-ci sortit, allant et revenant, jusqu’à ce que les eaux aient séché sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Puis il lâcha
  rationale: Le wayyiqtol fait progresser le récit. « Puis » marque naturellement la succession, et « lâcha » convient à l’envoi d’un oiseau depuis l’arche sans ajouter l’idée explicite de vol.
- source_word: הָעֹרֵב
  choice: le corbeau
  rationale: Nom défini désignant sans ambiguïté le corbeau.
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: qui allait et revenait
  rationale: La combinaison du verbe fini et des infinitifs absolus décrit un mouvement répété. Cette formulation française est naturelle et conserve le va-et-vient sans la lourdeur de « sortit, sortant et revenant ».
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Introduit le terme temporel du mouvement répété.
- source_word: יְבֹשֶׁת הַמַּיִם
  choice: les eaux se soient retirées
  rationale: Le verbe יבשׁ signifie littéralement « sécher, être à sec ». Avec les eaux comme sujet, « se retirer » exprime naturellement en français leur disparition par assèchement; la note conserve la formulation plus littérale.
- source_word: מֵעַל הָאָרֶץ
  choice: de dessus la terre
  rationale: Rend directement l’image spatiale de מֵעַל, « de dessus, d’au-dessus de », tout en restant compréhensible en français moderne.
