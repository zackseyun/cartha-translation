  text: צֵ֖א מִן הַ/תֵּבָ֑ה אַתָּ֕ה וְ/אִשְׁתְּ/ךָ֛ וּ/בָנֶ֥י/ךָ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: fr
  text: Toi, sors de l’arche avec ta femme, tes fils et les femmes de tes fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: Sors
  rationale: Impératif masculin singulier de יצא. « Sors » exprime directement et naturellement en français le mouvement hors d’un espace fermé.
- source_word: מִן הַתֵּבָה
  choice: de l’arche
  rationale: La préposition מן indique un mouvement depuis l’intérieur vers l’extérieur. Avec « sortir », le français idiomatique emploie « de ». תֵּבָה désigne ici l’arche de Noé.
- source_word: אַתָּה
  choice: toi
  rationale: Le pronom indépendant explicite et met légèrement en relief le destinataire, déjà inclus dans l’impératif. Dans l’énumération française, « toi » conserve cette présence explicite.
- source_word: וְאִשְׁתְּךָ
  choice: ta femme
  rationale: Dans ce contexte possessif, אִשָּׁה désigne l’épouse. « Ta femme » est naturel en français moderne et adapté au registre du passage.
- source_word: וּבָנֶיךָ
  choice: tes fils
  rationale: בָּנִים désigne ici les fils, comme le confirme la mention parallèle de leurs femmes.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: les femmes de tes fils
  rationale: Rendu proche de la structure hébraïque, littéralement « les femmes de tes fils ». Il est clair et naturel, sans remplacer la formulation par le terme relationnel « belles-filles ».
- source_word: אִתָּךְ
  choice: avec toi
  rationale: La locution marque l’accompagnement de tout le groupe familial avec Noé.
theological_decisions: []
