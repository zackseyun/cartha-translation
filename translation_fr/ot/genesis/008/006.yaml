  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: fr
  text: Au bout de quarante jours[a], Noé ouvrit la fenêtre de l’arche qu’il avait faite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après quarante jours ». L’expression hébraïque peut désigner le terme de cette période ou, plus idiomatiquement, le temps qui la suit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Au bout de… Noé ouvrit
  rationale: La formule narrative introduit ici l’événement suivant. En français moderne, elle est rendue naturellement par le complément temporel initial et le verbe principal, sans le lourd « Il arriva que ».
- source_word: מִקֵּץ
  choice: Au bout de
  rationale: L’expression indique que la période mentionnée est arrivée à son terme. « Au bout de » est naturel en français et conserve cette valeur temporelle.
- source_word: אַרְבָּעִים יוֹם
  choice: quarante jours
  rationale: Équivalent français direct et idiomatique du cardinal suivi du nom.
- source_word: וַיִּפְתַּח
  choice: ouvrit
  rationale: Le verbe פתח signifie ici ouvrir; le passé simple convient au récit suivi dans un registre français digne.
- source_word: חַלּוֹן
  choice: la fenêtre
  rationale: Le nom désigne normalement une fenêtre ou une ouverture comparable; « fenêtre » est le terme traditionnel et contextuellement probable.
- source_word: הַתֵּבָה
  choice: l’arche
  rationale: Dans Genèse 6–9, תֵּבָה désigne conventionnellement l’arche de Noé.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait faite
  rationale: Le plus-que-parfait indique naturellement que la fabrication de la fenêtre précédait son ouverture. L’accord féminin de « faite » renvoie à « fenêtre », antécédent immédiat de la relative dans l’hébreu.
