    issue: Ajout explicatif dans « pour qu’il soit emmené en Égypte »
    rationale: Le texte source dit littéralement que Joseph a été vendu avec l’Égypte comme destination. Il ne formule pas explicitement « pour qu’il soit emmené »; cette précision doit donc être évitée dans le texte courant.
  - severity: low
    issue: Note de bas de page devenue inutilement interprétative
    rationale: La note propose une paraphrase interprétative (« pour l’Égypte ») et justifie l’ajout du transport. Une traduction directe par « à destination de l’Égypte » rend déjà la valeur directionnelle sans note.
  revised_text: 'Alors Joseph dit à ses frères : « Approchez-vous de moi, je vous prie. » Ils s’approchèrent. Il dit : « Je suis Joseph, votre frère, que vous avez vendu à destination de l’Égypte. »'
