  text: וַ/יֹּ֨אמֶר יוֹסֵ֧ף אֶל אֶחָ֛י/ו גְּשׁוּ נָ֥א אֵלַ֖/י וַ/יִּגָּ֑שׁוּ וַ/יֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִי/כֶ֔ם אֲשֶׁר מְכַרְתֶּ֥ם אֹתִ֖/י מִצְרָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: fr
  text: 'Alors Joseph dit à ses frères : « Approchez-vous de moi, je vous prie. » Ils s’approchèrent. Il dit : « Je suis Joseph, votre frère, que vous avez vendu à destination de l’Égypte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors Joseph dit / Il dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque naturellement la première transition; la seconde occurrence reste sobre pour éviter une répétition pesante en français.
- source_word: גְּשׁוּ נָא אֵלַי
  choice: Approchez-vous de moi, je vous prie
  rationale: « Approchez-vous » rend directement נגשׁ, tandis que « je vous prie » exprime la nuance d’invitation ou de requête portée par נָא dans un registre digne et actuel.
- source_word: וַיִּגָּשׁוּ
  choice: Ils s’approchèrent
  rationale: La reprise du même radical français conserve la répétition hébraïque entre l’invitation et la réponse.
- source_word: אֲנִי יוֹסֵף אֲחִיכֶם
  choice: Je suis Joseph, votre frère
  rationale: Cette formulation française naturelle conserve l’identification directe et la relation fraternelle mise en relief.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: celui que vous avez vendu
  rationale: « Celui que » rattache clairement la relative à Joseph et maintient la force personnelle et accusatrice de l’hébreu.
- source_word: מִצְרָיְמָה
  choice: pour qu’il soit emmené en Égypte
  rationale: La terminaison directionnelle indique le mouvement vers l’Égypte. Dans le contexte d’une vente de personne, cette formulation évite l’impression française peu naturelle que Joseph aurait été vendu directement à un pays, tout en explicitant minimalement le résultat du mouvement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition d’« approcher » est volontaire afin de reproduire l’écho lexical de l’hébreu. « Je vous prie » conserve la politesse de נָא sans donner à la demande un ton excessivement cérémonieux.
