  rationale: La révision remplace l’explicitation « pour qu’il soit emmené » par « à destination de l’Égypte », qui exprime la direction portée par מִצְרָיְמָה sans ajouter un procès non formulé. Le reste est conservé, y compris la répétition entre l’invitation à approcher et la réponse des frères.
