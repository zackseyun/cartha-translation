- from: 'Alors Joseph dit à ses frères : « Approchez-vous de moi, je vous prie. » Ils s’approchèrent. Il dit : « Je suis Joseph, votre frère, celui que vous avez vendu pour qu’il soit emmené en Égypte.[a] »'
