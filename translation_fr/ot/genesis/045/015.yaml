  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: fr
  text: Il embrassa tous ses frères et pleura sur eux. Après cela, ses frères parlèrent avec lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: Il embrassa
  rationale: Le piel de נשׁק désigne ici le fait de donner des baisers en signe d’affection et de réconciliation. En français courant, « embrasser » exprime naturellement ce geste sans imposer une nuance répétitive.
- source_word: לְכָל אֶחָיו
  choice: tous ses frères
  rationale: כָּל avec le pluriel englobe l’ensemble des frères de Joseph; « tous ses frères » est naturel et fidèle.
- source_word: וַיֵּבְךְּ
  choice: et pleura
  rationale: בכה signifie pleurer; ce choix conserve la tonalité solennelle et émotive de la scène.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: La préposition עַל peut évoquer ici la position de Joseph penché contre ou sur ses frères tandis qu’il pleure. « Sur eux » préserve l’image de l’hébreu sans l’expliciter davantage.
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: L’expression marque clairement la succession temporelle des actions.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: ses frères parlèrent avec lui
  rationale: דבר construit avec אֵת peut exprimer une parole échangée avec quelqu’un. « Parlèrent avec lui » rend naturellement la réciprocité probable de la conversation.
theological_decisions: []
