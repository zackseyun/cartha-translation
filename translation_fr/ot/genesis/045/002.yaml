  yaml_path: translation/ot/genesis/045/002.yaml
  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: fr
  text: Il pleura à grands cris[a]. Les Égyptiens l’entendirent[b], et la maison de Pharaon l’entendit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il donna de la voix en pleurant », expression hébraïque indiquant qu’il pleura bruyamment.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’Égypte entendit ». Le verbe au pluriel favorise toutefois « les Égyptiens » comme sujet.'
    reason: lexical_alternative
  - marker: c
    text: « La maison de Pharaon » peut désigner sa maisonnée, son entourage ou sa cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: Il éclata en sanglots
  rationale: L’expression signifie littéralement qu’il « donna de la voix en pleurant » et décrit des pleurs bruyants. « Éclater en sanglots » restitue naturellement en français le caractère soudain et audible de ces pleurs.
- source_word: וַיִּשְׁמְעוּ
  choice: l’entendirent
  rationale: שׁמע exprime ici la perception d’un son. Le pronom « l’ » renvoie naturellement à Joseph en train de sangloter.
- source_word: מִצְרַיִם
  choice: Les Égyptiens
  rationale: 'Bien que le mot puisse désigner l’Égypte, le verbe au pluriel favorise un sens collectif personnel : les Égyptiens.'
- source_word: וַיִּשְׁמַע
  choice: l’apprit
  rationale: Dans le second membre, le sujet collectif « la maison du pharaon » reçoit vraisemblablement la nouvelle de la scène. « L’apprit » est naturel en français tout en gardant la possibilité d’une transmission au-delà de l’audition directe.
- source_word: בֵּית פַּרְעֹה
  choice: la maison du pharaon
  rationale: 'La formulation proche de l’hébreu conserve l’étendue sémantique de « maison » : maisonnée, entourage royal ou cour, sans réduire le référent au bâtiment.'
