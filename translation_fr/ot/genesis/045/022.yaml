  text: לְ/כֻלָּ֥/ם נָתַ֛ן לָ/אִ֖ישׁ חֲלִפ֣וֹת שְׂמָלֹ֑ת וּ/לְ/בִנְיָמִ֤ן נָתַן֙ שְׁלֹ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/חָמֵ֖שׁ חֲלִפֹ֥ת שְׂמָלֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: fr
  text: À chacun d’eux, il donna une tenue de rechange ; mais à Benjamin, il donna trois cents pièces d’argent[a] et cinq tenues de rechange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trois cents d’argent » ; l’unité monétaire n’est pas précisée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: À chacun d’eux
  rationale: Cette formulation française naturelle réunit les deux expressions distributives hébraïques, « à eux tous » et « à chaque homme », sans lourdeur.
- source_word: נָתַן
  choice: il donna
  rationale: Sens courant du verbe dans ce récit de remise de présents.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: vêtement(s) de rechange
  rationale: Rend naturellement l’idée de vêtements destinés à remplacer ceux que l’on porte. Le singulier dans la première proposition découle de la distribution à chacun, tandis que le pluriel est conservé pour les cinq donnés à Benjamin.
- source_word: וּלְבִנְיָמִן
  choice: mais à Benjamin
  rationale: Le « mais » exprime en français le contraste contextuel entre le don commun et le don exceptionnel fait à Benjamin.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: trois cents pièces d’argent
  rationale: L’hébreu ne nomme aucune unité monétaire. « Pièces d’argent » garde le caractère monétaire sans introduire indûment les sicles.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: et cinq vêtements de rechange
  rationale: Conserve le nombre et traduit de manière cohérente la même expression vestimentaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le point-virgule clarifie le contraste sans alourdir la phrase. « Vêtement de rechange » est plus naturel ici que « change de vêtements » et évite de suggérer plusieurs tenues pour chaque frère.
