  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: fr
  text: Alors Joseph se jeta au cou de son frère Benjamin et pleura[a] ; Benjamin pleura à son cou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « il tomba sur les cous de Benjamin, son frère […] et Benjamin pleura sur ses cous ». Les formes plurielles de « cou » appartiennent ici à une tournure hébraïque décrivant une étreinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: Alors Joseph se jeta
  rationale: Le waw consécutif fait progresser le récit. « Se jeta » rend naturellement en français le geste concret exprimé par נפל dans cette scène d'étreinte ; le nom « Joseph » explicite le sujet implicite sans ambiguïté.
- source_word: עַל צַוְּארֵי / עַל צַוָּארָיו
  choice: au cou / à son cou
  rationale: La tournure française « se jeter au cou de quelqu’un » correspond naturellement à l’idiome hébreu de l’étreinte. La forme hébraïque au pluriel dans la première occurrence est signalée en note plutôt que reproduite de manière peu naturelle.
- source_word: בִנְיָמִן אָחִיו
  choice: son frère Benjamin
  rationale: Cette formulation conserve l’identification familiale explicite et l’ordre naturel du français.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: pleura
  rationale: Le verbe בכה désigne l’action de pleurer. « Pleura » convient au registre narratif digne et garde le même terme pour les deux occurrences.
- source_word: וּבִנְיָמִן
  choice: Benjamin, lui aussi
  rationale: Le français idiomatique emploie « lui aussi » pour exprimer la réciprocité de l’action coordonnée, sans modifier le contenu de la scène.
