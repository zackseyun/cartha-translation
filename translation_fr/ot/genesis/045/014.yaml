  source_fidelity: 'Le texte traduit fidèlement la scène d’étreinte et les deux verbes de pleurs. « Joseph » explicite sans risque le sujet implicite. Toutefois, la note qualifie à tort « se jeta » de littéral : וַיִּפֹּל signifie littéralement « il tomba / il se laissa tomber », même si « se jeter au cou » est l’équivalent idiomatique approprié en français. Les formes de « cou » sont morphologiquement plurielles dans les deux expressions hébraïques, quoique l’idiome désigne naturellement le cou en français.'
