  yaml_path: translation/ot/genesis/045/025.yaml
  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: fr
  text: Ils remontèrent d’Égypte et arrivèrent au pays de Canaan, auprès de leur père Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Ils remontèrent
  rationale: Le verbe עלה signifie littéralement « monter ». Dans l’itinéraire de l’Égypte vers Canaan, « remonter » conserve naturellement en français la nuance géographique et l’idée de départ depuis l’Égypte.
- source_word: מִמִּצְרָיִם
  choice: d’Égypte
  rationale: La préposition מִן indique ici le point de départ; « d’Égypte » est l’équivalent français direct et idiomatique.
- source_word: וַיָּבֹאוּ
  choice: arrivèrent
  rationale: Le verbe בוא peut signifier « venir », « entrer » ou « arriver ». Dans cette séquence de déplacement, « arrivèrent » est naturel en français et exprime l’aboutissement sans surinterpréter le mode d’entrée.
- source_word: אֶרֶץ כְּנַעַן
  choice: au pays de Canaan
  rationale: Cette formulation conserve le nom אֶרֶץ, « pays/terre », tout en employant l’expression française courante « le pays de Canaan ».
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: auprès de leur père Jacob
  rationale: אֶל marque le mouvement vers Jacob. « Auprès de » exprime naturellement l’arrivée auprès d’une personne, tandis que l’ordre « leur père Jacob » est idiomatique en français et préserve clairement la relation familiale.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « remontèrent d’Égypte » préserve l’orientation géographique hébraïque sans paraître archaïque; « auprès de leur père Jacob » évite la formulation moins naturelle « vers Jacob, leur père ».
