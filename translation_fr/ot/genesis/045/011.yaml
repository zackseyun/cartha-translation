source:
  edition: WLC
  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: fr
  text: Là, je pourvoirai à tes besoins, car il reste encore cinq années de famine, de peur que tu ne tombes dans la misère, toi, ta famille et tout ce qui t’appartient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: je pourvoirai à tes besoins
  rationale: Le verbe כּוּל au piel exprime ici l’action d’entretenir ou de fournir le nécessaire. Cette formulation française est naturelle et conserve l’idée de prise en charge matérielle.
- source_word: כִּי
  choice: car
  rationale: 'La conjonction introduit la raison de la prise en charge promise par Joseph : cinq années de famine restent à venir.'
- source_word: פֶּן
  choice: afin que… ne
  rationale: פֶּן marque le résultat redouté que l’action vise à éviter. « Afin que… ne » rend clairement cette nuance préventive.
- source_word: תִּוָּרֵשׁ
  choice: tu ne tombes pas dans la misère
  rationale: La forme peut évoquer l’appauvrissement, la privation ou la ruine. « Tomber dans la misère » transmet ce sens sans surspécifier le mécanisme de la perte.
- source_word: בֵיתְךָ
  choice: ta famille
  rationale: Dans ce contexte, « maison » désigne la maisonnée de Jacob, c’est-à-dire les personnes à sa charge, plutôt que le bâtiment.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: et tout ce qui t’appartient
  rationale: Rend directement l’ensemble des biens et possessions de Jacob.
theological_decisions:
- issue: Nuance de פֶּן et relation entre la providence promise et le danger de ruine
  choice: afin que tu ne tombes pas dans la misère
  alternative: de peur que tu ne tombes dans la misère
  rationale: Les deux formulations expriment l’évitement d’un résultat redouté. « Afin que… ne » est plus direct en français moderne et ne transforme pas la parole de Joseph en simple expression de crainte.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond au discours direct de Joseph à son père. La phrase reste accessible tout en conservant le lien causal et la portée collective du texte hébreu.
