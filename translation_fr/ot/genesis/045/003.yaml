  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ אֲנִ֣י יוֹסֵ֔ף הַ/ע֥וֹד אָבִ֖/י חָ֑י וְ/לֹֽא יָכְל֤וּ אֶחָי/ו֙ לַ/עֲנ֣וֹת אֹת֔/וֹ כִּ֥י נִבְהֲל֖וּ מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: fr
  text: 'Alors Joseph dit à ses frères : « Je suis Joseph. Mon père est-il encore en vie ? » Mais ses frères ne purent lui répondre, car ils étaient bouleversés[a] devant lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terrifiés », « consternés » ou « saisis d’effroi ». Le verbe hébreu exprime un trouble soudain et intense.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant sa face ». Cette expression hébraïque peut aussi se rendre par « en sa présence » ou « à sa vue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement la succession narrative en français moderne.
- source_word: אֶל אֶחָיו
  choice: à ses frères
  rationale: Rend directement le complément de la parole et désigne naturellement les frères de Joseph.
- source_word: אֲנִי יוֹסֵף
  choice: Je suis Joseph
  rationale: Conserve l’identification explicite et soudaine de Joseph.
- source_word: הַעוֹד אָבִי חָי
  choice: Mon père est-il encore en vie ?
  rationale: « Encore » exprime la continuation interrogée par הַעוֹד, tandis que « en vie » est idiomatique en français.
- source_word: וְלֹא יָכְלוּ … לַעֲנוֹת אֹתוֹ
  choice: Mais ses frères ne purent lui répondre
  rationale: « Mais » marque clairement le contraste; « ne purent » conserve la notion d’incapacité portée par יכל dans un registre narratif digne.
- source_word: נִבְהֲלוּ
  choice: étaient bouleversés
  rationale: Le niphal de בהל décrit un profond trouble pouvant aller de la consternation à l’effroi. « Bouleversés » préserve cette étendue sans imposer le degré maximal de peur.
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: Rend de près l’expression hébraïque « de devant sa face/sa présence » tout en restant intelligible en français; une note explicite sa portée possible.
theological_decisions: []
