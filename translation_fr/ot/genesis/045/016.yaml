base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: fr
  text: 'La nouvelle fut entendue dans la maison de Pharaon : « Les frères de Joseph sont arrivés. » Elle plut à Pharaon et à ses serviteurs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: La nouvelle se répandit
  rationale: Littéralement, « le bruit/la voix fut entendu(e) ». Avec la proposition qui en donne le contenu, l’expression désigne une nouvelle qui parvient à être connue. « Se répandit » restitue naturellement en français le passif hébreu sans suggérer un simple bruit matériel.
- source_word: בֵּית פַּרְעֹה
  choice: dans la maison de Pharaon
  rationale: Traduction directe de l’expression hébraïque. Dans ce contexte, la « maison » peut inclure la cour royale, mais « cour » préciserait davantage que le texte source.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points introduit naturellement en français moderne le contenu de la nouvelle. Traduire mécaniquement par « disant » produirait ici une tournure peu idiomatique.
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: Les frères de Joseph sont arrivés
  rationale: Le parfait indique un fait accompli ayant une pertinence présente. « Sont arrivés » exprime clairement leur présence désormais effective.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: Cela plut à
  rationale: Cette formulation rend idiomatiquement la locution hébraïque « cela fut bon aux yeux de ». Elle conserve le sens favorable sans imposer en français la répétition lourde de l’image.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: עֶבֶד peut désigner des serviteurs, des fonctionnaires ou des gens de cour. « Serviteurs » demeure le choix lexical le plus direct et évite de préciser leur rang.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est naturelle tout en conservant « la maison de Pharaon » et « ses serviteurs », proches des termes hébreux. Aucun enjeu théologique particulier n’exige une note.
