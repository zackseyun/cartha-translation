  naturalness: Le français est fluide, moderne et d’un registre narratif biblique approprié. « Prenez avec vous » et « venez auprès de moi » sont naturels dans ce contexte. La ponctuation clarifie utilement les deux mouvements de l’injonction et de la promesse.
