source:
  edition: WLC
  text: וּ/קְח֧וּ אֶת אֲבִי/כֶ֛ם וְ/אֶת בָּתֵּי/כֶ֖ם וּ/בֹ֣אוּ אֵלָ֑/י וְ/אֶתְּנָ֣ה לָ/כֶ֗ם אֶת טוּב֙ אֶ֣רֶץ מִצְרַ֔יִם וְ/אִכְל֖וּ אֶת חֵ֥לֶב הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: fr
  text: Prenez avec vous votre père et vos familles, et venez auprès de moi. Je vous donnerai ce que le pays d’Égypte a de meilleur, et vous mangerez les produits les plus riches du pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la graisse du pays ». Cette expression hébraïque désigne ce que le pays produit de plus riche et de meilleur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: Prenez avec vous
  rationale: L’impératif de לקח signifie fondamentalement « prendre ». L’ajout de « avec vous » exprime naturellement en français le fait d’emmener le père et les familles sans remplacer le verbe par « amenez ».
- source_word: אֲבִיכֶם
  choice: votre père
  rationale: Rendu direct du nom singulier muni du suffixe de deuxième personne du pluriel ; il désigne Jacob.
- source_word: בָּתֵּיכֶם
  choice: vos familles
  rationale: Le pluriel de בית, littéralement « vos maisons », désigne ici les maisonnées, c’est-à-dire les membres des familles et les personnes à charge. « Vos familles » est le rendu courant le plus clair en français moderne.
- source_word: וּבֹאוּ אֵלַי
  choice: et venez auprès de moi
  rationale: L’expression rend l’impératif de בוא suivi de אֶל sans ajouter l’idée de retour, qui n’est pas explicitement exprimée.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Je vous donnerai
  rationale: La forme volitive de נתן à la suite des impératifs a ici valeur de promesse ou d’assurance ; le futur français la restitue naturellement.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: ce que le pays d’Égypte a de meilleur
  rationale: טוּב peut désigner la bonté, l’abondance ou ce qu’il y a de meilleur. Cette formulation française conserve l’idée d’un accès privilégié aux meilleures ressources du pays.
- source_word: וְאִכְלוּ
  choice: et vous mangerez
  rationale: L’impératif coordonné prend, dans la suite de la promesse, une valeur résultative ou future. Le futur français convient au déroulement de l’énoncé.
- source_word: חֵלֶב הָאָרֶץ
  choice: les produits les plus riches du pays
  rationale: חֵלֶב signifie littéralement « graisse » et, dans cette expression imagée, la part la plus riche ou la meilleure production. Le texte principal en donne le sens idiomatique, tandis que la note conserve l’image hébraïque.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. La phrase suit étroitement la progression de l’hébreu tout en explicitant deux métonymies qui seraient opaques ou trompeuses en traduction strictement littérale : « maisons » pour les familles et « graisse » pour les produits les plus riches.'
