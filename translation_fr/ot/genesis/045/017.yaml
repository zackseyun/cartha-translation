  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אֱמֹ֥ר אֶל אַחֶ֖י/ךָ זֹ֣את עֲשׂ֑וּ טַֽעֲנוּ֙ אֶת בְּעִ֣ירְ/כֶ֔ם וּ/לְכוּ בֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: fr
  text: 'Alors le pharaon dit à Joseph : « Dis à tes frères : “Faites ceci : chargez vos bêtes, partez et rendez-vous au pays de Canaan.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors… dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » marque naturellement la succession en français.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Titre royal usuel, rendu avec l’article défini conformément à l’usage français moderne.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: Dis à tes frères
  rationale: Rend directement l’injonction faite à Joseph d’adresser ces paroles à ses frères.
- source_word: זֹאת עֲשׂוּ
  choice: Faites ceci
  rationale: Équivalent direct et naturel du démonstratif suivi de l’impératif pluriel.
- source_word: טַעֲנוּ אֶת בְּעִירְכֶם
  choice: chargez vos bêtes
  rationale: בְּעִיר désigne ici les animaux domestiques servant au transport ; « bêtes » conserve cette valeur contextuelle sans préciser une espèce absente du texte.
- source_word: וּלְכוּ בֹאוּ
  choice: partez et rendez-vous
  rationale: Les deux impératifs expriment le départ puis le déplacement jusqu’à destination. Cette formulation française maintient les deux mouvements sans la lourdeur de « allez, venez ».
- source_word: אַרְצָה כְּנָעַן
  choice: au pays de Canaan
  rationale: Rend le nom אֶרֶץ avec sa terminaison directionnelle et le nom propre Canaan dans une tournure française idiomatique.
