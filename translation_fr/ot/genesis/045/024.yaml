  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: fr
  text: 'Puis il renvoya ses frères, et ils partirent. Il leur dit : « Ne vous querellez pas en chemin. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne vous agitez pas en chemin », « Ne vous mettez pas en colère en chemin » ou « N’ayez pas peur en chemin ». Le verbe hébreu peut exprimer diverses formes de trouble émotionnel ; « ne vous querellez pas » convient au contexte immédiat, où les frères voyagent ensemble après que Joseph s’est fait reconnaître.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: laissa partir
  rationale: Le piel de שׁלח indique ici que Joseph renvoie ses frères de sa présence. « Laissa partir » exprime naturellement leur congé et prépare leur départ effectif.
- source_word: אֶת־אֶחָיו
  choice: ses frères
  rationale: Le terme familial est conservé littéralement et correspond aux frères de Joseph dans le récit.
- source_word: וַיֵּלֵכוּ
  choice: ils s’en allèrent
  rationale: הלך signifie couramment « aller » ; après « laissa partir », cette formulation rend clairement et naturellement le mouvement narratif.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Il leur dit
  rationale: Formulation française directe et naturelle de la formule hébraïque d’introduction au discours.
- source_word: אַל
  choice: Ne… pas
  rationale: Rend la particule négative אַל employée avec une valeur prohibitive.
- source_word: תִּרְגְּזוּ
  choice: vous querellez
  rationale: רגז peut désigner divers types d’agitation, notamment la colère, la peur ou le trouble. Dans le contexte de frères voyageant ensemble après la révélation de Joseph, « vous querellez » est une interprétation contextuelle naturelle, sans masquer les autres sens possibles, signalés en note.
- source_word: בַּדָּרֶךְ
  choice: en chemin
  rationale: Expression française idiomatique qui désigne le trajet de retour vers Canaan tout en restant proche de l’hébreu.
