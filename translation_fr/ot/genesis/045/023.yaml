  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: fr
  text: 'À son père, il envoya ceci : dix ânes portant de ce que l’Égypte avait de meilleur[a], et dix ânesses portant du grain, du pain et des provisions pour son père, pour le voyage.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des meilleurs biens d’Égypte » ou « de l’abondance de l’Égypte ».
    reason: La tournure hébraïque מִטּוּב מִצְרַיִם peut désigner une part des meilleurs biens ou de l’abondance d’Égypte, sans préciser leur nature.
lexical_decisions:
- source_word: כְּזֹאת
  choice: ceci
  rationale: Cette expression récapitulative introduit naturellement en français la liste de ce qui fut envoyé.
- source_word: חֲמֹרִים
  choice: ânes
  rationale: Terme courant et naturel en français moderne.
- source_word: נֹשְׂאִים / נֹשְׂאֹת
  choice: portant
  rationale: Le participe décrit directement ce que transportaient les animaux, sans ajouter l’idée plus interprétative d’une charge complète.
- source_word: מִטּוּב מִצְרָיִם
  choice: quelques-uns des meilleurs produits d’Égypte
  rationale: « Quelques-uns de » rend la valeur partitive de מִן, tandis que « meilleurs produits » exprime ici טוּב sans préciser indûment la nature des biens.
- source_word: אֲתֹנֹת
  choice: ânesses
  rationale: Le féminin lexicalement marqué en hébreu est conservé par le terme français précis et naturel.
- source_word: בָּר
  choice: grain
  rationale: Le mot désigne ici les céréales de manière générale, sans permettre de préciser qu’il s’agit de blé.
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens concret ordinaire convient à cette liste et doit être distingué des provisions plus générales.
- source_word: מָזוֹן
  choice: provisions
  rationale: Dans le contexte du déplacement, ce terme désigne adéquatement la nourriture ou les vivres préparés pour le trajet.
- source_word: לַדָּרֶךְ
  choice: pendant le voyage
  rationale: Formulation française naturelle indiquant que ces provisions étaient destinées au trajet du père.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’énumération hébraïque et la distinction entre ânes et ânesses, tout en employant un vocabulaire naturel.
