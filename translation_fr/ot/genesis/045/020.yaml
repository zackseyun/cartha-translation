id: GEN.45.20
reference: Genesis 45:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: fr
  text: Et ne vous souciez pas de vos biens[a], car ce qu’il y a de meilleur dans tout le pays d’Égypte est à vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que votre œil n’épargne pas vos biens » ; autre traduction possible : « ne regrettez pas vos biens ».'
    reason: L’expression hébraïque associe l’« œil » au verbe « épargner, prendre en pitié » et peut évoquer le souci ou le regret de laisser ses possessions.
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: Et ne vous souciez pas
  rationale: Littéralement, l’hébreu dit que leur « œil » ne doit pas épargner ou prendre en pitié leurs biens. Dans ce contexte, l’expression leur demande de ne pas s’en préoccuper ni de regretter de les laisser. La formulation française rend naturellement cet idiome, tandis que la note en conserve l’image.
- source_word: עַל־כְּלֵיכֶם
  choice: de vos biens
  rationale: כְּלִי peut désigner des objets, des ustensiles, du matériel ou des possessions. « Biens » convient au contexte du déménagement de toute une maisonnée et reste suffisamment général.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée pour ne pas se préoccuper des biens laissés derrière eux.
- source_word: טוּב כָּל־אֶרֶץ מִצְרַיִם
  choice: ce qu’il y a de meilleur dans tout le pays d’Égypte
  rationale: טוּב désigne ici les meilleures ressources ou richesses qu’offre l’Égypte plutôt qu’une bonté abstraite. Cette tournure française exprime naturellement le superlatif contextuel tout en conservant la portée de כָּל, « tout ».
- source_word: לָכֶם הוּא
  choice: est à vous
  rationale: Le lamed avec le pronom, renforcé par הוּא, exprime ici la possession ou la mise à disposition. « Est à vous » conserve la forme présente et l’assurance emphatique de la déclaration.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le texte principal privilégie une expression idiomatique naturelle ; la note préserve l’image concrète de l’hébreu et signale la nuance possible de regret.
