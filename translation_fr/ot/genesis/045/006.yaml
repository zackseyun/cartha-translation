  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: fr
  text: Car cela fait deux ans que la famine sévit dans le pays[a], et il reste encore cinq années pendant lesquelles il n’y aura ni labour ni moisson.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au milieu du pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication donnée par Joseph et marque naturellement le lien causal avec ce qui précède.
- source_word: זֶה שְׁנָתַיִם
  choice: cela fait deux ans
  rationale: Rend idiomatiquement en français la durée de deux années déjà écoulées, indiquée par le démonstratif et la forme duelle.
- source_word: הָרָעָב
  choice: la famine
  rationale: Désigne la famine précise déjà présente dans le récit.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: dans le pays
  rationale: Formulation française naturelle dans ce contexte local; la nuance littérale de בְּקֶרֶב est signalée en note.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: et il reste encore cinq années
  rationale: Exprime clairement que cinq années sont encore à venir à partir du moment où Joseph parle.
- source_word: אֲשֶׁר אֵין
  choice: pendant lesquelles il n’y aura ni
  rationale: La relative porte sur les cinq années à venir; le futur est donc explicité en français.
- source_word: חָרִישׁ
  choice: labour
  rationale: Désigne l’action ou la période du labour agricole; le nom conserve le parallélisme avec « moisson ».
- source_word: קָצִיר
  choice: moisson
  rationale: Terme courant pour la récolte ou la saison de récolte, formant une paire agricole naturelle avec « labour ».
