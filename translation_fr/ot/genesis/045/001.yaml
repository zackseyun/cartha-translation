  text: וְ/לֹֽא יָכֹ֨ל יוֹסֵ֜ף לְ/הִתְאַפֵּ֗ק לְ/כֹ֤ל הַ/נִּצָּבִים֙ עָלָ֔י/ו וַ/יִּקְרָ֕א הוֹצִ֥יאוּ כָל אִ֖ישׁ מֵ/עָלָ֑/י וְ/לֹא עָ֤מַד אִישׁ֙ אִתּ֔/וֹ בְּ/הִתְוַדַּ֥ע יוֹסֵ֖ף אֶל אֶחָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: fr
  text: 'Alors Joseph ne put plus se contenir devant tous ceux qui se tenaient auprès de lui[a]. Il s’écria : « Faites sortir tout le monde d’auprès de moi ! » Personne ne resta avec lui lorsque Joseph se fit connaître à ses frères.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en présence de tous ceux qui se tenaient près de lui ».'
    reason: Alternative plus formelle pour la construction לְכֹל הַנִּצָּבִים עָלָיו, dont la relation exacte peut se rendre par « devant » ou « en présence de ».
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: put ... se contenir
  rationale: La négation de יכל avec l’infinitif exprime l’incapacité, et le hitpael התאפק désigne ici l’action de se maîtriser ou de se retenir. « Ne put plus se contenir » est naturel en français et respecte le sens réflexif sans préciser indûment l’émotion.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: devant tous ceux qui se tenaient auprès de lui
  rationale: Le participe de נצב évoque les personnes présentes, debout ou postées près de Joseph. Cette formulation conserve l’image du texte tout en restant compréhensible; elle évite le terme plus interprétatif « serviteurs ».
- source_word: וַיִּקְרָא
  choice: Il s’écria
  rationale: קרא signifie ici appeler à haute voix. « S’écria » convient à l’intensité de la scène sans réduire le verbe au simple « dit ».
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: Faites sortir tout le monde d’auprès de moi
  rationale: L’impératif pluriel causatif demande aux personnes présentes de faire sortir chacun. « Tout le monde » rend idiomatiquement כָל אִישׁ, tandis que « d’auprès de moi » garde la relation spatiale exprimée par מֵעָלָי.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: Personne ne resta donc avec lui
  rationale: Pris littéralement, עמד signifie « se tenir debout », mais il exprime ici le fait de demeurer présent. « Resta avec lui » donne clairement ce sens contextuel. « Donc » marque la conséquence immédiate de l’ordre sans en faire une relation théologique.
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: lorsque Joseph se fit connaître à ses frères
  rationale: Le hitpael de ידע signifie ici se faire connaître ou révéler son identité. La tournure française conserve la valeur réflexive et ne surinterprète pas la manière dont Joseph se révèle.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. Le récit garde son intensité par « ne put plus se contenir » et « s’écria », tout en évitant d’identifier les personnes présentes comme des serviteurs, précision que l’hébreu n’impose pas.
