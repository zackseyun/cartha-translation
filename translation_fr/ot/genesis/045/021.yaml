  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתֵּ֨ן לָ/הֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל פִּ֣י פַרְעֹ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם צֵדָ֖ה לַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: fr
  text: Les fils d’Israël firent ainsi. Joseph leur donna des chariots conformément à l’ordre de Pharaon[a], et il leur donna des provisions pour le voyage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon la bouche de Pharaon », expression hébraïque signifiant « conformément à l’ordre de Pharaon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: firent ainsi
  rationale: Rend directement l’expression hébraïque indiquant qu’ils agirent comme il venait d’être dit, dans un français naturel et digne.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Dans ce contexte immédiat, l’expression désigne précisément les fils de Jacob, appelé Israël, et non l’ensemble ultérieur du peuple.
- source_word: עֲגָלוֹת
  choice: des chariots
  rationale: Désigne ici des véhicules à roues destinés au transport de personnes et de biens; « chariots » convient au contexte narratif.
- source_word: עַל פִּי פַרְעֹה
  choice: conformément à l’ordre de Pharaon
  rationale: L’expression idiomatique, littéralement « selon la bouche de Pharaon », indique que les chariots furent donnés sur son ordre.
- source_word: צֵדָה
  choice: des provisions
  rationale: Le terme désigne les vivres ou fournitures nécessaires au déplacement; « provisions » conserve cette portée sans la limiter excessivement.
- source_word: לַדָּרֶךְ
  choice: pour le voyage
  rationale: Dans ce contexte, le mot indique la destination pratique des provisions et se rend naturellement par « pour le voyage ».
