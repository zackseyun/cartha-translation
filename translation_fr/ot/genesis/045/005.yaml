  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: fr
  text: Et maintenant, ne soyez pas attristés et ne vous en voulez pas[a] de m’avoir vendu, ce qui m’a fait venir ici ; car c’est pour préserver la vie[b] que Dieu m’a envoyé devant vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que cela ne brûle pas à vos yeux », expression pouvant signifier : « ne soyez pas irrités » ou « ne vous en voulez pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour la préservation de la vie » ou « afin de maintenir en vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la continuité marquée par וְ et la transition temporelle introduite par עַתָּה.
- source_word: אַל תֵּעָצְבוּ
  choice: ne soyez pas affligés
  rationale: Le verbe exprime ici la peine ou le chagrin; « affligés » convient au registre digne du passage sans exagérer l’émotion.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: et ne vous en veuillez pas
  rationale: Cette formulation française naturelle rend l’idiome de ce qui « brûle à vos yeux » et, dans le contexte, le reproche que les frères s’adressent à eux-mêmes.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: de m’avoir vendu pour que je sois amené ici
  rationale: La construction française rattache naturellement la cause aux deux interdictions. Elle explicite le mouvement impliqué par הֵנָּה sans laisser entendre que la vente elle-même aurait eu lieu en Égypte.
- source_word: לְמִחְיָה
  choice: pour préserver la vie
  rationale: Rend la finalité et le sens de conservation de la vie, tout en laissant ouverte la question des personnes dont la vie sera préservée.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: Dieu m’a envoyé
  rationale: Le passé composé est naturel en français actuel et exprime l’action passée dont les conséquences structurent la situation présente.
- source_word: לִפְנֵיכֶם
  choice: devant vous
  rationale: Traduction directe qui conserve les dimensions spatiale et temporelle de l’expression hébraïque; « avant vous » serait également possible.
theological_decisions:
- issue: Providence divine et responsabilité humaine
  choice: Maintenir ensemble « vous m’avez vendu » et « Dieu m’a envoyé »
  alternative: Atténuer l’action des frères ou présenter l’action divine comme une simple permission
  rationale: L’hébreu juxtapose explicitement l’acte coupable des frères et l’action providentielle de Dieu; la traduction ne résout ni n’affaiblit cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset garde le mouvement discursif de « Et maintenant », évite une lecture géographique trompeuse de « vendu ici » et préserve sans l’expliquer la tension entre l’action humaine et l’envoi divin.
