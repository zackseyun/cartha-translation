revisions:
- from: Et maintenant, ne soyez pas affligés et ne vous en veuillez pas[a] de m’avoir vendu pour que je sois amené ici, car c’est pour préserver la vie[b] que Dieu m’a envoyé devant vous.
  to: Et maintenant, ne soyez pas attristés et ne vous en voulez pas[a] de m’avoir vendu, ce qui m’a fait venir ici ; car c’est pour préserver la vie[b] que Dieu m’a envoyé devant vous.
  rationale: La révision corrige la locution française et remplace la proposition finale ajoutée par une conséquence explicative. Elle garde le sens contextuel de הֵנָּה, selon lequel la vente a abouti à la présence de Joseph en Égypte, tout en évitant de présenter cette arrivée comme le but grammatical de la vente. Les ancres et les deux notes demeurent correctement rattachées.
