  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: fr
  text: Racontez à mon père tout le prestige dont je jouis en Égypte[a], ainsi que tout ce que vous avez vu. Dépêchez-vous de faire descendre mon père ici.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute ma gloire en Égypte ». Le mot hébreu peut désigner l’honneur, la gloire, le prestige ou la splendeur ; ici, il renvoie au rang élevé de Joseph en Égypte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתֶּם
  choice: Racontez
  rationale: Le hiphil de נגד signifie ici « faire connaître, raconter ». « Racontez à mon père » convient naturellement au compte rendu détaillé demandé aux frères.
- source_word: כָּל כְּבוֹדִי
  choice: toute la considération dont je jouis
  rationale: כבוד désigne ici l’honneur, le prestige et le rang élevé de Joseph à la cour d’Égypte. Cette formulation française exprime son statut reconnu sans donner au terme une connotation exclusivement théologique.
- source_word: בְּמִצְרַיִם
  choice: en Égypte
  rationale: Rendu locatif direct et naturel.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: tout ce que vous avez vu
  rationale: La proposition englobe les preuves concrètes dont les frères ont été témoins, au-delà du seul rang de Joseph.
- source_word: מִהַרְתֶּם
  choice: Dépêchez-vous
  rationale: Le contexte donne à cette forme verbale une valeur impérative et urgente, bien rendue en français courant par « Dépêchez-vous ».
- source_word: הוֹרַדְתֶּם
  choice: faire descendre
  rationale: Le hiphil de ירד signifie « faire descendre ». Le français conserve ainsi la représentation géographique traditionnelle du déplacement vers l’Égypte comme une descente.
- source_word: הֵנָּה
  choice: jusqu’ici
  rationale: L’adverbe déictique indique un mouvement vers le lieu où se trouve Joseph ; « jusqu’ici » exprime clairement cette destination.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Considération dont je jouis » explicite naturellement le statut social exprimé par כבוד. La tournure « faire descendre » conserve la nuance directionnelle du texte hébreu, même si « faire venir » serait plus idiomatique en français contemporain.
