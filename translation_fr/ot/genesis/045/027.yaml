  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו אֵ֣ת כָּל דִּבְרֵ֤י יוֹסֵף֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֲלֵ/הֶ֔ם וַ/יַּרְא֙ אֶת הָ֣/עֲגָל֔וֹת אֲשֶׁר שָׁלַ֥ח יוֹסֵ֖ף לָ/שֵׂ֣את אֹת֑/וֹ וַ/תְּחִ֕י ר֖וּחַ יַעֲקֹ֥ב אֲבִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: fr
  text: Et ils lui rapportèrent toutes les paroles que Yossef leur avait dites. Puis il vit les chariots[a] que Yossef avait envoyés pour le transporter, et l’esprit de Yaakov, leur père, reprit vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les charrettes ». Le terme hébreu désigne des véhicules servant au transport.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « l’esprit de Yaakov, leur père, vécut ». Cette expression évoque un retour de vitalité, de courage ou d’espérance.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: Ils lui rapportèrent
  rationale: Dans ce contexte, le verbe introduit le compte rendu fait à Yaakov. « Rapportèrent » exprime naturellement cet acte de communication sans ajouter de contraste.
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: toutes les paroles que Yossef leur avait dites
  rationale: Cette formulation conserve le nom concret « paroles » et le lien lexical avec le verbe « dire »; le plus-que-parfait situe correctement les paroles de Yossef avant le récit des frères.
- source_word: הָעֲגָלוֹת
  choice: les chariots
  rationale: Le terme désigne des véhicules de transport. « Chariots » convient au contexte ancien et reste immédiatement compréhensible en français.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: que Yossef avait envoyés pour le transporter
  rationale: « Transporter » rend clairement la fonction des véhicules tout en reflétant le sens de נשׂא, « porter, emporter ».
- source_word: וַתְּחִי רוּחַ
  choice: l’esprit … reprit vie
  rationale: La formulation garde l’image hébraïque de la vie retrouvée et laisse ouverte la nuance entre regain de vitalité, courage et réconfort.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Yaakov, leur père
  rationale: L’apposition suit de près l’ordre et le sens de l’hébreu; le nom personnel est translittéré conformément à la politique du projet.
theological_decisions:
- issue: Sens de רוּחַ dans l’expression וַתְּחִי רוּחַ
  choice: l’esprit de Yaakov … reprit vie
  alternative: Yaakov, leur père, retrouva courage
  rationale: Le texte conserve le terme « esprit » et l’image de la vie sans réduire l’expression à une seule interprétation psychologique.
- issue: Forme française des noms יוסף et יעקב
  choice: Yossef et Yaakov
  alternative: Joseph et Jacob
  rationale: Les noms sont translittérés depuis l’hébreu plutôt que remplacés par leurs formes françaises traditionnelles, conformément à la politique signalée du projet.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase hébraïque est répartie en deux phrases françaises pour améliorer la lisibilité, tandis que « Puis » rend la progression du récit sans introduire de lien causal. Les noms sont translittérés sous les formes Yossef et Yaakov.
