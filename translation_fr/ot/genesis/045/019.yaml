revisions:
- from: 'Quant à toi, voici l’ordre qui t’est donné : « Faites ceci : prenez en Égypte des chariots[a] pour vos jeunes enfants[b] et vos femmes ; transportez votre père et venez[c]. »'
  to: 'Et toi, tu as reçu cet ordre : « Faites ceci : prenez du pays d’Égypte des chariots[a] pour vos jeunes enfants[b] et vos épouses ; emmenez votre père et venez[c]. »'
  rationale: La révision rend explicitement « du pays d’Égypte », remplace une formulation initiale plus indirecte par un parfait passif français naturel, précise le sens conjugal de נשים dans ce contexte, et corrige les notes pour ne pas introduire l’idée non exprimée de retour. Elle conserve l’ambiguïté directionnelle de « venez ».
