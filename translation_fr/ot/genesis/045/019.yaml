  text: וְ/אַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ לָ/כֶם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְ/טַפְּ/כֶם֙ וְ/לִ/נְשֵׁי/כֶ֔ם וּ/נְשָׂאתֶ֥ם אֶת אֲבִי/כֶ֖ם וּ/בָאתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: fr
  text: 'Et toi, tu as reçu cet ordre : « Faites ceci : prenez du pays d’Égypte des chariots[a] pour vos jeunes enfants[b] et vos épouses ; emmenez votre père et venez[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « charrettes », pour des véhicules destinés au transport.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne plus précisément les petits enfants.
    reason: lexical_clarification
  - marker: c
    text: Le contexte implique une venue en Égypte, mais l’hébreu dit simplement « venez ».
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: voici l’ordre qui t’est donné
  rationale: Le passif singulier indique que Joseph reçoit un ordre, vraisemblablement de Pharaon. Cette formulation française garde le passif et introduit naturellement les impératifs qui suivent.
- source_word: זֹאת עֲשׂוּ
  choice: Faites ceci
  rationale: Rend directement et naturellement la formule directive hébraïque au pluriel.
- source_word: קְחוּ לָכֶם
  choice: prenez
  rationale: Le pronom datif marque l’intérêt des destinataires, nuance que le contexte français exprime suffisamment sans le lourd « prenez pour vous ».
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: en Égypte
  rationale: Le point de départ des véhicules est exprimé naturellement en français par « en Égypte » après « prenez »; « du pays d’Égypte » serait possible mais plus lourd ici.
- source_word: עֲגָלוֹת
  choice: chariots
  rationale: Désigne des véhicules servant au transport de personnes et de biens. « Chariots » convient au cadre ancien sans suggérer spécialement des chars de guerre.
- source_word: לְטַפְּכֶם
  choice: pour vos jeunes enfants
  rationale: טַף vise particulièrement les enfants en bas âge ou les petits, plutôt que l’ensemble indifférencié des descendants.
- source_word: וְלִנְשֵׁיכֶם
  choice: et vos femmes
  rationale: Dans ce contexte familial, נָשִׁים désigne les épouses des frères.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: transportez votre père
  rationale: נשא signifie porter ou emporter. « Transportez » conserve cette force concrète tout en restant naturel dans le contexte des chariots.
- source_word: וּבָאתֶם
  choice: et venez
  rationale: Le verbe hébreu dit simplement « venez ». Le retour en Égypte est implicite dans le contexte, sans être lexicalement exprimé.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passage du singulier (« toi », Joseph) au pluriel (« faites », les frères concernés par les instructions) est conservé. La ponctuation rend explicite l’introduction de l’ordre sans atténuer sa force.
