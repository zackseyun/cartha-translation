source:
  edition: WLC
  text: וְ/הִנֵּ֤ה עֵֽינֵי/כֶם֙ רֹא֔וֹת וְ/עֵינֵ֖י אָחִ֣/י בִנְיָמִ֑ין כִּי פִ֖/י הַֽ/מְדַבֵּ֥ר אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: fr
  text: 'Et voici[a] : vos yeux le voient, ainsi que les yeux de mon frère Benjamin, c’est bien ma bouche qui vous parle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Et voici, vos yeux voient, ainsi que les yeux de mon frère Benjamin, que c’est ma bouche qui vous parle. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: La formule attire vivement l’attention sur une preuve immédiatement perceptible. « Et voici » conserve la valeur présentative et emphatique de l’hébreu dans un registre biblique encore naturel en français.
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: vos yeux le voient
  rationale: Le maintien de « vos yeux » préserve l’image concrète et l’insistance sur la constatation directe. Le pronom « le » permet une construction française naturelle tout en annonçant le contenu qui suit.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: ainsi que les yeux de mon frère Benjamin
  rationale: Cette formulation conserve le parallélisme avec « vos yeux » et l’identification explicite de Benjamin comme frère de Joseph.
- source_word: כִּי
  choice: c’est bien
  rationale: Dans ce contexte, כִּי introduit ce que les yeux constatent. La tournure clivée française rend clairement cette relation et « bien » restitue l’insistance probante sans transformer כִּי en simple causal.
- source_word: פִּי
  choice: ma bouche
  rationale: La traduction concrète maintient l’expression hébraïque, qui souligne que Joseph leur parle personnellement, sans interprète ni intermédiaire.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: qui vous parle
  rationale: 'Le participe substantivé décrit l’action présente. La relative « qui vous parle » est idiomatique en français et conserve l’accent de la construction hébraïque : « ma bouche, celle qui vous parle ».'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde l’image corporelle et l’emphase de l’hébreu sans archaïsme excessif ; le deux-points après « voici » marque naturellement l’appel à l’attention.
