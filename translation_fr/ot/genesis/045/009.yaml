source:
  edition: WLC
  text: מַהֲרוּ֮ וַ/עֲל֣וּ אֶל אָבִ/י֒ וַ/אֲמַרְתֶּ֣ם אֵלָ֗י/ו כֹּ֤ה אָמַר֙ בִּנְ/ךָ֣ יוֹסֵ֔ף שָׂמַ֧/נִי אֱלֹהִ֛ים לְ/אָד֖וֹן לְ/כָל מִצְרָ֑יִם רְדָ֥/ה אֵלַ֖/י אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: fr
  text: 'Dépêchez-vous de monter chez mon père et dites-lui : « Voici ce que dit ton fils Joseph : Dieu m’a établi maître de toute l’Égypte. Descends auprès de moi, ne tarde pas.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne t’attarde pas »; plus littéralement, « ne reste pas là ».
    reason: Alternative lexicale pour אַל תַּעֲמֹד, dont le sens littéral implique le fait de rester debout ou sur place.
lexical_decisions:
- source_word: מַהֲרוּ
  choice: Dépêchez-vous
  rationale: L’impératif pluriel exprime l’urgence; cette tournure est naturelle en français moderne.
- source_word: וַעֲלוּ אֶל אָבִי
  choice: de monter chez mon père
  rationale: Le verbe עלה conserve le mouvement ascendant traditionnellement associé au trajet vers Canaan; « chez mon père » rend naturellement la destination personnelle.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: et dites-lui
  rationale: L’impératif français restitue naturellement la suite des instructions.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formule actuelle et digne rend la formule hébraïque du messager sans archaïsme.
- source_word: בִּנְךָ יוֹסֵף
  choice: ton fils Joseph
  rationale: La formulation suit l’ordre hébreu et souligne le lien filial.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: Dieu m’a établi
  rationale: שׂים désigne ici l’installation ou la nomination dans une fonction; « établir » exprime clairement cette nuance.
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: maître de toute l’Égypte
  rationale: « Maître » rend l’autorité exprimée par אָדוֹן sans imposer un titre politique plus précis; « de » est idiomatique en français.
- source_word: רְדָה אֵלַי
  choice: Descends auprès de moi
  rationale: Le choix conserve le mouvement géographique vers l’Égypte et indique que Joseph est la destination.
- source_word: אַל תַּעֲמֹד
  choice: ne tarde pas
  rationale: Dans ce contexte, עמד signifie idiomatiquement ne pas rester ou s’attarder; la traduction maintient l’urgence.
theological_decisions:
- issue: Sens de אֱלֹהִים dans la déclaration de Joseph
  choice: Dieu
  alternative: un dieu
  rationale: La syntaxe a un sens singulier et Joseph attribue son élévation à Dieu; la majuscule identifie naturellement le référent sans ajout doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. Le vouvoiement s’adresse aux frères au pluriel dans les instructions, puis le tutoiement à Jacob est conservé dans le message cité. Les verbes de mouvement « monter » et « descendre » préservent la géographie narrative.
