  text: וַ/יִּשְׁלָחֵ֤/נִי אֱלֹהִים֙ לִ/פְנֵי/כֶ֔ם לָ/שׂ֥וּם לָ/כֶ֛ם שְׁאֵרִ֖ית בָּ/אָ֑רֶץ וּ/לְ/הַחֲי֣וֹת לָ/כֶ֔ם לִ/פְלֵיטָ֖ה גְּדֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: fr
  text: Dieu m’a envoyé avant votre arrivée pour vous préserver un reste sur la terre[a], et pour vous maintenir en vie en vue d’une grande délivrance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour vous préserver des survivants dans le pays ». Le mot hébreu peut désigner un reste, des survivants ou une postérité.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour qu’il y ait beaucoup de survivants ». L’expression hébraïque peut mettre l’accent soit sur la délivrance, soit sur ceux qui en réchappent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: m’a envoyé
  rationale: Le wayyiqtol fait avancer le récit passé; dans ce discours rétrospectif, le passé composé est naturel en français moderne.
- source_word: לִפְנֵיכֶם
  choice: avant vous
  rationale: L’expression signifie littéralement « devant vous », mais elle marque ici l’antériorité de l’envoi de Joseph en Égypte.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: pour préserver pour vous un reste
  rationale: שׂים signifie fondamentalement « placer, établir »; avec שְׁאֵרִית, le contexte indique que Dieu assure la subsistance de ce qui reste, sans effacer le motif lexical du « reste ».
- source_word: שְׁאֵרִית
  choice: un reste
  rationale: Le terme désigne ce qui demeure après une catastrophe et peut viser des survivants ou une postérité. « Un reste » conserve sa portée biblique tout en laissant le contexte préciser qu’il s’agit de personnes.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner la terre entière ou un pays; le cadre égyptien favorise ici le sens local.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: et pour vous maintenir en vie
  rationale: Le hifil de חיה exprime le fait de garder ou maintenir quelqu’un en vie, sens directement adapté au contexte de famine.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: en vue d’une grande délivrance
  rationale: פְּלֵיטָה peut désigner l’évasion, la délivrance ou les survivants qui en résultent. « En vue de » rend la valeur possible de but ou de résultat du ל sans imposer un sens instrumental.
theological_decisions:
- issue: Faut-il rendre שְׁאֵרִית par le terme bibliquement évocateur « reste » ou expliciter « survivants » / « postérité » ?
  choice: un reste
  alternative: des survivants; une postérité
  rationale: « Reste » correspond directement au champ lexical hébreu et préserve sa résonance canonique sans lui imposer une doctrine ultérieure; une note signale les sens contextuels possibles.
- issue: לִפְלֵיטָה גְּדֹלָה désigne-t-il une grande délivrance ou un grand nombre de rescapés ?
  choice: en vue d’une grande délivrance
  alternative: pour une grande évasion; afin de laisser de nombreux survivants
  rationale: La construction peut viser l’acte ou le résultat du salut aussi bien que les personnes rescapées. Le texte principal retient l’issue salvatrice, tandis que la note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme des deux propositions de but et l’ambiguïté des deux noms hébreux au moyen de notes, sans ajouter de précision géographique absente du texte.
