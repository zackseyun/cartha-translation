  source_fidelity: La structure de but est bien rendue. « Avant votre arrivée » explicite fidèlement l’antériorité contextuelle de לִפְנֵיכֶם. Pour בָּאָרֶץ, « sur la terre » évite de restreindre sans nécessité le terme à un pays particulier et conserve la portée possible de « terre/pays ». « En vue d’une grande délivrance » maintient de façon recevable la valeur de but ou de résultat de לִפְלֵיטָה גְּדֹלָה, sans la transformer en moyen instrumental.
  naturalness: Le double « pour préserver pour vous » est lourd en français moderne, et « avant vous » est moins idiomatique dans ce contexte temporel. La révision allège la phrase tout en préservant son registre biblique accessible.
  terminology: « Reste » conserve le champ lexical de שְׁאֵרִית; la note documente correctement « survivants » et « postérité ». « Délivrance » convient pour פְּלֵיטָה, tandis que la note conserve l’autre possibilité, celle des survivants.
