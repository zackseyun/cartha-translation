base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: fr
  text: 'Ils lui annoncèrent : « Joseph est encore en vie, et il gouverne tout le pays d’Égypte ! » Mais son cœur s’engourdit[a], car il ne les croyait pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son cœur défaillit ». L’expression hébraïque décrit la réaction intérieure de Jacob, comme affaiblie ou engourdie, devant cette nouvelle qu’il ne pouvait croire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: 'Ils lui annoncèrent :'
  rationale: Le hiphil de נגד exprime ici l’annonce d’une nouvelle. En français, les deux-points introduisent naturellement les paroles et rendent inutile le calque lourd « en disant ».
- source_word: עוֹד יוֹסֵף חַי
  choice: Joseph est encore en vie
  rationale: 'עוֹד marque la persistance de l’état : contrairement à ce que Jacob croyait, Joseph vit toujours. « Encore en vie » est naturel et clair en français actuel.'
- source_word: וְכִי הוּא מֹשֵׁל
  choice: et il gouverne
  rationale: Le participe מֹשֵׁל désigne l’exercice effectif du pouvoir sans préciser un titre administratif égyptien. Le verbe « gouverner » préserve cette portée générale.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: tout le pays d’Égypte
  rationale: Avec מֹשֵׁל, la préposition בְּ marque le domaine sur lequel s’exerce l’autorité. La construction française « gouverner tout le pays » l’exprime sans lourdeur.
- source_word: וַיָּפָג לִבּוֹ
  choice: son cœur resta figé
  rationale: Le verbe פוג peut évoquer l’affaiblissement, l’engourdissement ou la défaillance. « Son cœur resta figé » conserve l’image intérieure et traduit naturellement le choc incrédule de Jacob sans imposer une réaction physiologique précise.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: car il ne les croyait pas
  rationale: כִּי introduit la cause de sa réaction. L’imparfait convient à l’état d’incrédulité suscité par l’annonce, et « car » maintient explicitement le lien causal.
