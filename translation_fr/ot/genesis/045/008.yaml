id: GEN.45.8
reference: Genesis 45:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: fr
  text: Ainsi donc, ce n’est pas vous qui m’avez envoyé ici, mais Dieu. Il a fait de moi un père pour Pharaon[a], le maître de toute sa maison et celui qui gouverne tout le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un père pour Pharaon », c’est-à-dire un protecteur, un conseiller de premier rang ou un bienfaiteur.
    reason: La construction hébraïque et la métaphore de « père » permettent de comprendre une fonction comparable à celle d’un père plutôt qu’un lien familial littéral.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ainsi donc
  rationale: Cette expression rend à la fois le lien avec les paroles précédentes et la fonction conclusive de עַתָּה dans un français naturel.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: ce n’est pas vous qui m’avez envoyé ici
  rationale: La tournure clivée restitue l’insistance portée par le pronom explicite אַתֶּם et conserve la référence déictique de הֵנָּה à l’Égypte.
- source_word: כִּי הָאֱלֹהִים
  choice: mais Dieu
  rationale: 'Après la négation, כִּי introduit ici le terme opposé : non pas les frères, mais Dieu.'
- source_word: וַיְשִׂימֵנִי
  choice: Il a fait de moi
  rationale: Le passé composé exprime l’action divine dont la situation présente de Joseph est le résultat, sans réduire le verbe à une nomination officielle.
- source_word: לְאָב לְפַרְעֹה
  choice: un père pour Pharaon
  rationale: La métaphore de אָב est conservée, car elle peut évoquer un protecteur, un bienfaiteur ou un conseiller de premier rang sans se limiter à une seule de ces fonctions.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: le maître de toute sa maison
  rationale: '« Maître » exprime l’autorité déléguée indiquée par אָדוֹן. « Maison » garde l’étendue possible du terme : maisonnée, cour et domaine.'
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: et celui qui gouverne tout le pays d’Égypte
  rationale: Cette formulation rend le participe מֹשֵׁל comme une fonction durable d’autorité, sans imposer le titre administratif plus précis de « gouverneur ».
- source_word: אֶרֶץ מִצְרָיִם
  choice: le pays d’Égypte
  rationale: En français moderne, « pays d’Égypte » exprime naturellement la portée territoriale de אֶרֶץ sans la lourdeur de « terre d’Égypte » dans ce contexte.
theological_decisions:
- issue: Souveraineté divine et responsabilité humaine
  choice: Maintenir le contraste appuyé « ce n’est pas vous… mais Dieu »
  alternative: Atténuer le rôle des frères ou expliciter une doctrine particulière de la providence
  rationale: Joseph souligne ici le dessein souverain de Dieu sans nier, dans l’ensemble du récit, l’action réelle et coupable de ses frères. La traduction préserve cette tension sans la résoudre par une explication doctrinale ajoutée.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore « un père pour Pharaon » est conservée dans le texte, tandis que la note en précise la portée possible. La seconde phrase coordonne les trois fonctions de Joseph sans reproduire mécaniquement les prépositions hébraïques au détriment du naturel français.
