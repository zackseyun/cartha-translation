  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל רַ֛ב עוֹד יוֹסֵ֥ף בְּנִ֖/י חָ֑י אֵֽלְכָ֥ה וְ/אֶרְאֶ֖/נּוּ בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: fr
  text: 'Alors Israël dit[a] : « Cela me suffit ! Mon fils Joseph est encore en vie. J’irai le voir avant de mourir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est assez ! » Le mot hébreu רַב exprime ici la suffisance sous forme d’exclamation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait avancer le récit. « Alors » rend naturellement cette progression en français sans surinterpréter la relation logique.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie explicitement « Israël » ; ce nom est conservé plutôt que remplacé par « Jacob ».
- source_word: רַב
  choice: Cela me suffit !
  rationale: 'Dans ce contexte exclamatif, רַב exprime la suffisance : la nouvelle que Joseph vit suffit à Israël. Cette formulation française conserve la force émotive tout en précisant naturellement le point de vue du locuteur.'
- source_word: עוֹד
  choice: encore
  rationale: Associé à חָי, le terme indique que Joseph demeure en vie ; « encore » est l’équivalent français idiomatique.
- source_word: בְּנִי
  choice: mon fils
  rationale: Rend directement la construction possessive et conserve l’accent familial et affectif.
- source_word: חָי
  choice: est … en vie
  rationale: Adjectif prédicatif signifiant « vivant » ; « être en vie » est naturel dans cette exclamation.
- source_word: אֵלְכָה
  choice: J’irai
  rationale: La forme cohortative exprime une résolution ferme. Le futur français transmet cette détermination sans ajouter une obligation absente du texte.
- source_word: וְאֶרְאֶנּוּ
  choice: le voir
  rationale: Le verbe signifie simplement voir, avec un suffixe masculin singulier ; « le voir » est direct et naturel.
- source_word: בְּטֶרֶם
  choice: avant de
  rationale: Introduit un événement non encore accompli. Devant un infinitif de même sujet, « avant de » est la tournure française normale.
- source_word: אָמוּת
  choice: mourir
  rationale: Le qal imperfectif de מות désigne ici la mort future d’Israël ; l’infinitif est requis par la syntaxe française après « avant de ».
