source:
  edition: WLC
  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: fr
  text: Tu habiteras dans le pays de Goshen et tu seras près de moi, toi, tes fils et tes petits-fils, ton petit et ton gros bétail, ainsi que tout ce qui t’appartient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Tu habiteras
  rationale: Le verbe ישׁב désigne ici une résidence durable. « Habiter » est naturel en français et conserve cette idée sans surinterpréter l'installation.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: dans le pays de Goshèn
  rationale: « Pays » rend אֶרֶץ dans son sens géographique régional, tandis que « Goshèn » transcrit le nom propre hébreu selon l'usage français.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: et tu seras près de moi
  rationale: La tournure rend directement היה avec l'adjectif קָרוֹב et garde à la fois la proximité géographique et la nuance relationnelle possible.
- source_word: אַתָּה
  choice: toi
  rationale: Le pronom indépendant est repris par « toi » en apposition, ce qui préserve son relief emphatique dans l'énumération.
- source_word: וּבָנֶיךָ
  choice: tes fils
  rationale: Le masculin pluriel est conservé, notamment parce que la proposition suivante mentionne explicitement les fils des fils.
- source_word: וּבְנֵי בָנֶיךָ
  choice: tes petits-fils
  rationale: Cette formulation française naturelle rend littéralement l'idée des « fils de tes fils » tout en conservant la référence masculine.
- source_word: וְצֹאנְךָ
  choice: ton petit bétail
  rationale: צֹאן est un collectif couvrant principalement les moutons et les chèvres. « Petit bétail » rend précisément cette catégorie et forme une paire claire avec « gros bétail ».
- source_word: וּבְקָרְךָ
  choice: ton gros bétail
  rationale: בָּקָר désigne les bovins ou le gros bétail. Ce choix conserve le contraste avec צֹאן sans réduire nécessairement le terme à un seul type d'animal.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: ainsi que tout ce qui t’appartient
  rationale: La formule exprime de manière idiomatique et complète l'ensemble des biens de Jacob.
theological_decisions: []
