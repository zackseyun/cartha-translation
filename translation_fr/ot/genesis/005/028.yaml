  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: fr
  text: Lémek vécut cent quatre-vingt-deux ans, puis il eut un fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans la formule généalogique, le verbe חיה indique la durée vécue avant l’événement suivant; le passé simple convient au registre narratif français.
- source_word: לֶמֶךְ
  choice: Lémek
  rationale: Translittération française courante du nom hébreu, avec accent pour guider la prononciation.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: cent quatre-vingt-deux ans
  rationale: L’ordre numérique hébreu est rendu selon l’usage français naturel, avec «ans» au pluriel.
- source_word: וַיּוֹלֶד
  choice: eut
  rationale: Avec un sujet masculin et «un fils» comme complément, le hiphil de ילד exprime ici qu’il engendra ou devint père. «Eut un fils» est naturel, actuel et suffisamment précis dans cette généalogie.
- source_word: בֵּן
  choice: un fils
  rationale: Le nom signifie «fils»; l’article indéfini convient puisque celui-ci n’est pas encore nommé dans ce verset.
