  text: וַֽ/יְחִי שֵׁ֕ת חָמֵ֥שׁ שָׁנִ֖ים וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת אֱנֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/006.yaml
  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: fr
  text: À l’âge de 105 ans, Seth devint le père d’Énosh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « engendra Énosh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: À l’âge de
  rationale: Dans cette formule généalogique, le verbe « vivre » suivi d’un nombre indique l’âge atteint avant la naissance mentionnée. La tournure française « À l’âge de » restitue naturellement cette relation temporelle.
- source_word: שֵׁת
  choice: Seth
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 ans
  rationale: L’expression hébraïque, littéralement « cinq ans et cent ans », désigne sans ambiguïté 105 ans; les chiffres conviennent à une généalogie en français moderne.
- source_word: וַיּוֹלֶד
  choice: devint le père de
  rationale: Le verbe ילד à la forme causative exprime ici l’engendrement dans une généalogie. « Devint le père de » est naturel, digne et évite l’archaïsme de « engendra », tout en laissant le lien généalogique explicite.
- source_word: אֶת אֱנוֹשׁ
  choice: Énosh
  rationale: La particule אֶת marque le complément d’objet direct et ne se traduit pas. « Énosh » translittère directement le nom hébreu tout en employant l’accent attendu en français.
