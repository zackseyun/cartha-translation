  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: fr
  text: Mâle et femelle, il les créa; il les bénit et leur donna le nom d’« être humain »[a], le jour où ils furent créés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : adam. Ce mot peut désigner l’être humain ou l’humanité dans un sens collectif; c’est aussi le nom propre Adam.'
    reason: Préserver la double possibilité lexicale du terme hébreu אָדָם dans le contexte de la généalogie.
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: mâle et femelle
  rationale: Ces deux termes désignent explicitement les deux sexes et forment en hébreu une paire symétrique. Cette traduction directe conserve cette symétrie.
- source_word: בְּרָאָם
  choice: Il les créa
  rationale: Le parfait qal de ברא, muni du suffixe pluriel, résume l’acte créateur de Dieu à l’égard des deux êtres humains.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: les bénit
  rationale: Traduction française concise et habituelle de ברך, qui conserve clairement Dieu comme sujet de la bénédiction.
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: leur donna le nom de
  rationale: Cette formulation naturelle en français préserve l’idée explicite d’un seul « nom » attribué à tous deux, plutôt que de réduire l’expression à une simple désignation individuelle.
- source_word: אָדָם
  choice: Homme
  rationale: Dans ce contexte, le mot désigne collectivement le couple humain, mâle et femelle. La majuscule signale ici l’emploi collectif sans effacer le lien lexical avec le nom propre Adam; une note expose l’ambiguïté réelle de l’hébreu.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: le jour où ils furent créés
  rationale: Cette traduction conserve le cadre temporel ainsi que la forme passive du niphal hébreu.
theological_decisions:
- issue: Sens collectif ou nom propre de אָדָם
  choice: Homme
  alternative: Adam; humanité; être humain
  rationale: Puisque le nom est donné ensemble au mâle et à la femelle, le sens collectif est prioritaire. Toutefois, la forme hébraïque est identique au nom propre Adam, notamment employé dans la généalogie environnante; la note maintient donc cette tension sans la résoudre silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique. Les guillemets et la majuscule à « Homme » mettent en relief le nom collectif sans en faire sans explication un simple nom individuel.
