  naturalness: '« Il les créa mâle et femelle » est peu idiomatique en français moderne : après un pronom pluriel, les deux noms nus se lisent difficilement. La construction antéposée « Mâle et femelle, il les créa » est à la fois naturelle dans un registre biblique sobre et proche de l’ordre emphatique de l’hébreu. « Être humain » rend plus clairement le collectif que « Homme », dont la majuscule ne suffit pas à éviter l’association première avec le sexe masculin en français contemporain.'
