  text: So all the days of Kenan were nine hundred and ten years[b][a], and he died.
translation:
  language: fr
  text: La durée totale de la vie de Kénan fut donc de neuf cent dix ans, puis il mourut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les jours de Kénan »; cette formule généalogique désigne la durée entière de sa vie. La forme hébraïque du nom est « Kénan »; certaines traditions emploient « Caïnan ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי קֵינָן
  choice: La durée totale de la vie de Kénan fut donc
  rationale: La formule hébraïque signifie littéralement « tous les jours de Kénan furent ». Cette formulation française naturelle en exprime le sens — toute la durée de sa vie — tandis que « donc » assure la continuité du résumé généalogique.
- source_word: קֵינָן
  choice: Kénan
  rationale: Translittération française directe de la forme hébraïque, avec un accent facilitant la prononciation; elle évite la forme traditionnelle « Caïnan », influencée par la tradition grecque.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: neuf cent dix ans
  rationale: L’ordre des nombres est adapté à l’usage naturel du français. « Cent » reste invariable puisqu’il est suivi de « dix ».
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: « Puis » rend la progression narrative portée par le waw consécutif; le passé simple conserve le ton sobre et digne de la formule généalogique.
