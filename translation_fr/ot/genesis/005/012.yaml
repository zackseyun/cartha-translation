  text: וַֽ/יְחִ֥י קֵינָ֖ן שִׁבְעִ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת מַֽהֲלַלְאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/012.yaml
  text: Kenan lived seventy years and fathered Mahalalel[a].
translation:
  language: fr
  text: Qénân vécut soixante-dix ans, puis il engendra Mahalalel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus courante : « il devint père de Mahalalel ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe חיה indique la durée de vie écoulée avant la naissance du descendant nommé. Le passé simple convient au registre narratif biblique sans être obscur.
- source_word: קֵינָן
  choice: Qénân
  rationale: Translittération française directe du nom hébreu, avec accents facilitant une prononciation proche de la forme source.
- source_word: שִׁבְעִים שָׁנָה
  choice: soixante-dix ans
  rationale: L’expression marque l’âge de Qénân au moment où il engendra Mahalalel; la formulation reste concise et naturelle en français.
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Dans une généalogie masculine, la forme causative de ילד exprime le fait de procréer ou d’avoir pour descendant direct la personne nommée. « Engendra » conserve cette précision et le registre généalogique.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Cette particule signale le complément d’objet direct défini en hébreu et n’a pas d’équivalent lexical autonome en français.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Translittération directe de la forme hébraïque, conforme à un usage français clair et reconnaissable.
