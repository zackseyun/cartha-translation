lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: la durée totale de la vie … fut
  rationale: Cette formulation française naturelle exprime la totalité indiquée par כָּל et rend l’idiome hébreu « tous les jours de » sans suggérer une simple succession de journées.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Translittération française courante du nom hébreu, cohérente avec l’usage biblique francophone.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: huit cent quatre-vingt-quinze ans
  rationale: Le nombre hébreu est réordonné selon l’usage naturel du français. « Cent » et « vingt » restent invariables puisqu’ils sont suivis d’un autre nombre.
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: « Puis » restitue la progression narrative du wayyiqtol, tandis que le passé simple convient au registre narratif biblique soutenu et préserve la solennité de la formule répétée.
