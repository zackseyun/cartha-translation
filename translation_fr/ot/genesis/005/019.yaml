  text: וַֽ/יְחִי יֶ֗רֶד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת חֲנ֔וֹךְ שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Hanok[a], Yéred vécut huit cents ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les formes françaises traditionnelles de ces noms sont « Jéred » et « Hénoc ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, חיה indique la durée de vie qui suit la naissance mentionnée; le passé simple convient au registre narratif biblique en français.
- source_word: יֶרֶד
  choice: Yéred
  rationale: Translittération française proche de la forme hébraïque, avec accents facilitant une prononciation naturelle.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת חֲנוֹךְ
  choice: Après la naissance de Hénok
  rationale: Cette formulation française naturelle rend la relation temporelle et la causalité du hiphil de ילד sans l’expression lourde «après qu’il eut engendré».
- source_word: חֲנוֹךְ
  choice: Hénok
  rationale: Translittération adaptée au français et proche de la forme hébraïque, plutôt que la forme française traditionnelle «Hénoc».
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: huit cents ans
  rationale: Rendu idiomatique exact de la durée exprimée par le groupe numéral hébreu.
- source_word: וַיּוֹלֶד
  choice: eut
  rationale: Dans le contexte généalogique, «eut des fils et des filles» est plus naturel en français moderne que «engendra», tout en exprimant clairement la paternité.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Conserve la mention explicite des descendants masculins et féminins au lieu de la généraliser en «enfants».
