base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Lémek, Mathusalem vécut 782 ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe חיה indique la durée de vie qui suit la naissance du fils nommé; « vécut » est naturel et précis en français.
- source_word: מְתוּשֶׁלַח
  choice: Mathusalem
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: Après avoir engendré Lémek
  rationale: Cette formulation rend clairement le rapport temporel et attribue à Mathusalem l’action causative exprimée par le hiphil de ילד.
- source_word: לֶמֶךְ
  choice: Lémek
  rationale: Transcription française courante du nom hébreu, avec accent pour guider la prononciation.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 ans
  rationale: L’ordre numérique hébreu correspond à un total de sept cent quatre-vingt-deux ans; les chiffres assurent une lecture immédiate sans perte de sens.
- source_word: וַיּוֹלֶד
  choice: et engendra
  rationale: « Engendra » conserve le sens masculin et généalogique de ילד tout en maintenant la répétition lexicale du verset.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Le français conserve la distinction explicite entre descendants masculins et féminins présente dans l’hébreu.
