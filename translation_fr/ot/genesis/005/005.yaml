  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: fr
  text: La durée totale de la vie d’Adam fut de neuf cent trente ans[a], et il mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, Adam peut aussi signifier « homme » ou « humanité » selon le contexte, mais il désigne ici l’individu Adam dans la généalogie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי אָדָם אֲשֶׁר חַי
  choice: La durée totale de la vie d’Adam fut donc
  rationale: Cette formulation française naturelle rend la formule hébraïque « tous les jours d’Adam qu’il vécut » sans en reproduire la lourdeur, tout en conservant l’idée du total de sa vie. « Donc » marque ici la récapitulation introduite par le waw narratif.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וּשְׁלֹשִׁים שָׁנָה
  choice: neuf cent trente ans
  rationale: Le nombre est écrit en toutes lettres pour correspondre au registre littéraire de la généalogie; « cent » reste invariable puisqu’il est suivi d’un autre nombre.
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: Le passé simple convient au récit biblique écrit et préserve la formule finale, brève et solennelle. « Puis » exprime la succession narrative sans atténuer l’affirmation de la mort.
- source_word: אָדָם
  choice: Adam
  rationale: Dans cette généalogie, le mot désigne l’individu nommé Adam, bien qu’il puisse signifier « homme » ou « humanité » dans d’autres contextes.
theological_decisions:
- issue: Sens de אָדָם
  choice: Adam comme nom propre
  alternative: l’homme ou l’humanité
  rationale: Le cadre généalogique et la mention d’une durée de vie individuelle imposent ici la lecture comme nom propre, sans nier la portée lexicale plus large du terme ailleurs.
- issue: Formule de mortalité
  choice: puis il mourut
  alternative: et il mourut
  rationale: La conclusion répétitive et abrupte de la généalogie est maintenue. « Puis » offre un enchaînement idiomatique en français tout en conservant le poids théologique de la mortalité.
translation_notes:
  register: Français international moderne, clair et digne. La formule hébraïque littérale sur « tous les jours » est rendue par l’expression idiomatique « durée totale de la vie », tandis que la conclusion conserve sa sobriété solennelle.
