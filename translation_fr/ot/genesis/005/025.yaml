  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: fr
  text: Mathusalem vécut cent quatre-vingt-sept ans et eut pour fils Lémek[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « il engendra Lémek ».'
    reason: Alternative lexicale reflétant plus directement la formulation généalogique hébraïque.
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe חיה indique l’âge atteint avant la naissance du fils nommé; « vécut » est naturel et fidèle.
- source_word: מְתוּשֶׁלַח
  choice: Mathusalem
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: cent quatre-vingt-sept ans
  rationale: Restitution idiomatique en français du nombre hébreu, littéralement ordonné « sept et quatre-vingts… et cent ».
- source_word: וַיּוֹלֶד
  choice: eut pour fils
  rationale: Le hifil de ילד, dans une généalogie masculine, signifie qu’il engendra ou devint le père de quelqu’un. « Eut pour fils » est clair, actuel et digne, sans l’archaïsme d’« engendra ».
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu de l’objet direct, rendu par la syntaxe française.
- source_word: לָמֶךְ
  choice: Lémek
  rationale: Translittération française proche de la forme hébraïque, avec accent pour guider la prononciation.
