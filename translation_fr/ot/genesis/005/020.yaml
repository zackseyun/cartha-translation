  text: La durée totale de la vie de Yéred fut de neuf cent soixante-deux ans, et il mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: furent donc
  rationale: Le wayyiqtol de היה introduit le bilan récapitulatif de la vie dans la généalogie. « Donc » rend la progression vers ce bilan, tandis que « furent » conserve la formulation comptable de l’hébreu.
- source_word: כָּל יְמֵי
  choice: Tous les jours de
  rationale: Cette expression généalogique désigne la durée totale de la vie. La traduction littérale reste naturelle en français biblique moderne et préserve la répétition structurante du chapitre.
- source_word: יֶרֶד
  choice: Yéred
  rationale: Cette translittération rend directement la forme hébraïque et convient aux conventions phonétiques françaises.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: neuf cent soixante-deux ans
  rationale: L’ordre des éléments numériques hébreux est réorganisé selon l’usage français moderne, sans modifier le total. Les deux occurrences de « année » sont représentées naturellement par un seul « ans ».
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: « Puis » exprime clairement la succession narrative du wayyiqtol; le pronom explicite est requis en français. Le passé simple maintient le registre narratif digne et la formule récurrente du chapitre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’idiome généalogique « tous les jours de » plutôt que de le remplacer par « toute la durée de sa vie », afin de respecter la structure répétitive de Genèse 5. Le nom est translittéré directement de l’hébreu; aucune note n’est nécessaire puisque l’alternative anglaise « Jared » ne constitue pas une variante traditionnelle propre au français.
