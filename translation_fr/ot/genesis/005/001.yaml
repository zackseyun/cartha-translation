  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: fr
  text: Voici le livre de la descendance[a] d’Adam. Le jour où[b] Dieu créa l’être humain[c], il le fit à la ressemblance de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut désigner les « générations », la descendance ou le récit de cette lignée.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Lorsque ». L’expression hébraïque « le jour où » peut servir simplement à introduire le moment d’un événement.'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu emploie ici le même mot que le nom « Adam », mais avec le sens possible d’« homme » ou d’« humanité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: Voici le livre
  rationale: La proposition nominale hébraïque introduit solennellement un document. « Voici le livre » est naturel en français et conserve la forme d’un titre.
- source_word: תּוֹלְדֹת
  choice: descendance
  rationale: Dans ce titre généalogique, le terme désigne les générations issues d’Adam ou le récit qui les concerne. « Descendance » est plus clair en français moderne que le calque « générations », tout en gardant la portée généalogique.
- source_word: אָדָם (première occurrence)
  choice: Adam
  rationale: Le contexte introduit la généalogie de l’ancêtre nommé Adam; la valeur de nom propre est donc la plus probable ici.
- source_word: בְּיוֹם בְּרֹא
  choice: Le jour où … créa
  rationale: Cette formulation conserve l’image temporelle de l’hébreu tout en donnant une phrase française fluide. L’idiome peut aussi avoir le sens plus général de « lorsque ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est associé ici à des verbes au singulier; « Dieu » est la traduction française usuelle.
- source_word: אָדָם (seconde occurrence)
  choice: l’être humain
  rationale: Dans l’évocation de la création, אָדָם a une valeur générique et désigne l’humanité représentée dans un être humain. Ce choix évite de faire indûment de cette occurrence le seul nom propre « Adam ».
- source_word: בִּדְמוּת אֱלֹהִים
  choice: à la ressemblance de Dieu
  rationale: דְּמוּת signifie « ressemblance » ou « similitude ». Le choix conserve le terme précis du texte sans l’harmoniser avec « image » (צֶלֶם).
- source_word: עָשָׂה אֹתוֹ
  choice: il le fit
  rationale: Le verbe עשה signifie ici « faire » et se distingue de ברא, « créer ». Le pronom masculin singulier reprend naturellement « l’être humain » en français.
theological_decisions:
- issue: Les deux emplois de אָדָם dans le même verset
  choice: « Adam » comme nom propre dans le titre, puis « l’être humain » au sens générique
  alternative: « Adam » aux deux endroits, ou « l’homme » dans la proposition sur la création
  rationale: La première occurrence ouvre une généalogie personnelle, tandis que la seconde reprend le langage général du récit de la création. La différence de traduction rend cette variation contextuelle sans nier que le mot hébreu est le même.
- issue: Rapport avec le vocabulaire de la création en Genèse 1
  choice: Conserver « ressemblance »
  alternative: Harmoniser en « image de Dieu »
  rationale: Le verset emploie דְּמוּת et non צֶלֶם. Garder « ressemblance » respecte la distinction lexicale et n’efface pas la nuance du texte.
- issue: Valeur temporelle de בְּיוֹם
  choice: « Le jour où » dans le texte, avec l’alternative « lorsque » en note
  alternative: Traduire directement par « Lorsque »
  rationale: La formulation retenue garde l’expression concrète de l’hébreu, tandis que la note signale que l’idiome ne doit pas nécessairement être compris comme une précision chronologique stricte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Voici le livre » garde la solennité du titre; « descendance » et « l’être humain » rendent immédiatement intelligibles les valeurs contextuelles des termes hébreux sans effacer leurs autres sens, indiqués en notes.
