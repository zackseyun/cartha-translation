  text: La durée totale de la vie de Mathusalem fut de neuf cent soixante-neuf ans, et il mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: La durée totale de la vie … fut
  rationale: Cette formulation française naturelle exprime la totalité des « jours » de Mathusalem, c’est-à-dire la durée de sa vie, tout en conservant la formule récapitulative de la généalogie.
- source_word: מְתוּשֶׁלַח
  choice: Mathusalem
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת
  choice: neuf cent soixante-neuf
  rationale: L’ordre des éléments est adapté à l’usage numérique naturel du français moderne.
- source_word: שָׁנָה ... שָׁנָה
  choice: ans
  rationale: Le français emploie naturellement « ans » pour indiquer l’âge ou la durée d’une vie après ce nombre.
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: « Puis » rend la progression narrative du wayyiqtol et « il mourut » préserve avec dignité la formule finale récurrente de Genèse 5.
