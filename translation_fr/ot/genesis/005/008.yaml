  text: Le total des jours de Seth fut de neuf cent douze ans, et il mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: furent donc de
  rationale: Dans cette formule généalogique récapitulative, le verbe היה sert de copule. « Furent donc de » exprime naturellement en français le total de la durée de vie tout en marquant la continuité narrative du waw.
- source_word: כָּל יְמֵי
  choice: tous les jours de
  rationale: Cette tournure conserve l’idiome hébreu récurrent de Genèse 5 et reste intelligible en français comme désignation de la totalité de la vie.
- source_word: שֵׁת
  choice: Seth
  rationale: Le nom propre suit sa forme française traditionnelle et largement reconnue.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: neuf cent douze ans
  rationale: L’hébreu énonce littéralement douze ans puis neuf cents ans; l’ordre français usuel donne clairement le même total, 912 ans.
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: « Puis » rend la succession narrative, tandis que le passé simple maintient le caractère sobre et solennel de la formule généalogique répétée.
