source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: fr
  text: Lorsque Noé avait cinq cents ans, il engendra[a] Sem, Cham et Japhet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu répète le nom de Noé : « Noé engendra ».'
    reason: La reprise nominale appartient au style narratif hébreu; le pronom donne ici une phrase française plus fluide sans changer le référent.
  - marker: b
    text: L’ordre « Sem, Cham et Japhet » suit le texte hébreu; il n’indique pas nécessairement l’ordre des naissances ni que les trois fils soient nés la même année.
    reason: Cette note préserve l’ambiguïté chronologique du texte et évite d’introduire une harmonisation dans la traduction.
lexical_decisions:
- source_word: וַיְהִי
  choice: Quand … eut
  rationale: La forme narrative introduit ici la circonstance temporelle. Cette tournure est naturelle en français et évite le calque archaïque « Et il arriva que ».
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: eut cinq cents ans
  rationale: L’expression hébraïque בן + nombre + שנה indique l’âge. La formulation française exprime cet idiome clairement.
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Le hiphil de ילד avec un sujet masculin signifie « engendrer, devenir père de ». « Engendra » est précis, digne et intelligible, tandis que « eut » serait moins explicite.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et couramment reconnue du nom propre.
- source_word: שֵׁם
  choice: Sem
  rationale: Forme française courante du nom propre hébreu.
- source_word: חָם
  choice: Cham
  rationale: Forme française courante du nom propre hébreu.
- source_word: יָפֶת
  choice: Japhet
  rationale: Forme française courante du nom propre hébreu.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Cham et Japhet
  rationale: Les marques hébraïques de l’objet direct ne se traduisent pas; la liste suit la syntaxe française normale tout en conservant l’ordre du texte hébreu.
theological_decisions:
- issue: Portée chronologique et ordre de naissance des trois fils
  choice: Conserver l’ordre hébreu des noms sans préciser leur ordre de naissance ni affirmer explicitement qu’ils sont tous nés la même année.
  alternative: Réorganiser les noms selon un ordre de naissance supposé, ou expliciter que les trois fils seraient nés durant la cinq-centième année de Noé.
  rationale: Le verset associe l’âge de cinq cents ans de Noé au commencement de cette descendance, mais la formulation et le contexte plus large ne permettent pas d’imposer que la liste donne strictement l’ordre des naissances ou que les trois fils soient nés la même année.
translation_notes:
  register: Français international moderne, clair et digne. « Engendra » conserve la précision généalogique du verbe hébreu sans recourir à une périphrase lourde. La reprise de Noé par « il » allège naturellement la phrase française.
