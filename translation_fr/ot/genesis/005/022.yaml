id: GEN.5.22
reference: Genesis 5:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת הָֽ/אֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Mathusalem, Hénok marcha avec Dieu[a] pendant trois cents ans, et il engendra des fils et des filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vécut en communion avec Dieu ». L’expression hébraïque signifie littéralement « marcha avec Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: marcha
  rationale: Le hitpael de הלך décrit ici la manière de vivre d’Hénok. « Marcha » conserve la métaphore hébraïque, son relief littéraire et sa portée relationnelle.
- source_word: אֶת הָאֱלֹהִים
  choice: avec Dieu
  rationale: Dans cette expression, אֶת a une valeur relationnelle. « Avec Dieu » rend directement l’idiome sans le réduire à une explication particulière.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: Après avoir engendré
  rationale: La tournure française indique clairement que la naissance de Mathusalem précède les trois cents années durant lesquelles Hénok marche avec Dieu.
- source_word: מְתוּשֶׁלַח
  choice: Mathusalem
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: pendant trois cents ans
  rationale: « Pendant » exprime naturellement en français la durée portée par le groupe nominal hébreu et évite de rattacher par erreur les trois cents ans à l’engendrement de Mathusalem.
- source_word: וַיּוֹלֶד
  choice: et il engendra
  rationale: Le hifil de ילד présente Hénok comme père. « Engendra » est précis, digne et permet de conserver le lien lexical avec הוֹלִידוֹ.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: L’hébreu nomme explicitement les descendants des deux sexes; la traduction maintient cette précision.
theological_decisions:
- issue: Nature de la relation d’Hénok avec Dieu dans l’expression « marcher avec Dieu »
  choice: Conserver la métaphore relationnelle « marcha avec Dieu » dans le texte principal
  alternative: vécut en communion avec Dieu
  rationale: La métaphore hébraïque est théologiquement évocatrice sans définir entièrement la nature de cette relation. La conserver évite d’imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe place d’abord la naissance de Mathusalem afin que « pendant trois cents ans » modifie sans ambiguïté « marcha avec Dieu ». « Engendrer » garde ici la précision paternelle du hifil de ילד et convient au registre généalogique.
