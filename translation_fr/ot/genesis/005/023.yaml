  yaml_path: translation/ot/genesis/005/023.yaml
  text: So all the days of Enoch were three hundred sixty-five years.
translation:
  language: fr
  text: Ainsi, la durée totale de la vie d’Hénoc fut de trois cent soixante-cinq ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ainsi, ... fut
  rationale: Le wayyiqtol de היה introduit la récapitulation généalogique. « Ainsi » marque naturellement en français l’aboutissement du calcul précédent, tandis que « fut » porte la formule récapitulative.
- source_word: כָּל יְמֵי
  choice: la durée totale de la vie de
  rationale: Littéralement « tous les jours de ». Dans cette formule généalogique, l’expression désigne l’ensemble de la vie; cette formulation actuelle en restitue clairement le sens sans lourdeur.
- source_word: חֲנוֹךְ
  choice: Hénoc
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: trois cent soixante-cinq
  rationale: Le français ordonne naturellement les nombres en commençant par les centaines, contrairement à l’ordre hébreu qui place ici soixante-cinq avant trois cents.
- source_word: שָׁנָה ... שָׁנָה
  choice: ans
  rationale: L’hébreu répète le singulier « année » dans la construction numérique; le français idiomatique regroupe l’expression et emploie le pluriel « ans » pour l’âge ou la durée d’une vie.
