lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans la formule généalogique, le verbe חיה indique la durée de vie écoulée jusqu’à la naissance mentionnée. « Vécut » est la formulation française naturelle et traditionnelle.
- source_word: חֲנוֹךְ
  choice: Hénoc
  rationale: Forme française conventionnelle du nom propre hébreu.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: soixante-cinq ans
  rationale: Rend le nombre hébreu selon l’ordre idiomatique du français moderne.
- source_word: וַיּוֹלֶד
  choice: il engendra
  rationale: Avec un sujet masculin dans une généalogie, ילד signifie « engendrer ». Cette formulation concise conserve le lien biologique direct exprimé par l’hébreu.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu du complément d’objet direct, rendu implicitement par la syntaxe française.
- source_word: מְתוּשָׁלַח
  choice: Mathusalem
  rationale: Forme française conventionnelle du nom propre hébreu.
