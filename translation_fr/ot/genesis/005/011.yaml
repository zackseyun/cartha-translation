lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: Tous les jours… furent donc de
  rationale: La formule généalogique indique la durée totale de la vie. Cette formulation conserve l’image hébraïque des « jours » tout en restant intelligible en français.
- source_word: אֱנוֹשׁ
  choice: Énosh
  rationale: Cette translittération représente directement la forme hébraïque et l’accent initial guide la prononciation française.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: neuf cent cinq ans
  rationale: Le français ordonne naturellement le nombre de la plus grande unité à la plus petite ; « cent » reste invariable puisqu’il est suivi de « cinq ».
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: « Puis » rend la progression narrative du wayyiqtol, tandis que le passé simple convient au registre narratif biblique, actuel et digne.
