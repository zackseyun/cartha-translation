  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Noé, Lémek vécut encore cinq cent quatre-vingt-quinze ans et eut des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans la formule généalogique de Genèse 5, le verbe indique la durée de vie postérieure à l’événement nommé. « Vécut encore » exprime naturellement cette continuation en français.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־נֹחַ
  choice: Après la naissance de Noé
  rationale: Le hiphil de ילד signifie littéralement que Lémek engendra Noé. La tournure nominale est idiomatique en français et conserve clairement le repère temporel sans lourdeur.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: cinq cent quatre-vingt-quinze ans
  rationale: L’hébreu donne 95 + 500; l’ordre français usuel exprime le même total sous la forme 595.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: et eut des fils et des filles
  rationale: « Eut » est la formulation généalogique naturelle en français; « des fils et des filles » préserve la mention explicite des descendants masculins et féminins.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase suit l’ordre temporel naturel en français et évite l’archaïsme « engendra » tout en conservant le sens généalogique.
