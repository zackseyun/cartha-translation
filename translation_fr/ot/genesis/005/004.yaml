  text: וַ/יִּֽהְי֣וּ יְמֵי אָדָ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֵׁ֔ת שְׁמֹנֶ֥ה מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Seth[a], Adam vécut encore huit cents ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Les jours d’Adam, après qu’il eut engendré Seth, furent de huit cents ans. »'
    reason: 'La note signale la construction idiomatique hébraïque, rendue naturellement dans le texte par « Adam vécut encore huit cents ans ». '
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: Adam vécut encore
  rationale: L’expression hébraïque signifie littéralement « les jours d’Adam furent ». En français courant, « Adam vécut encore » exprime naturellement la durée de sa vie après la naissance de Seth; « encore » marque clairement qu’il s’agit des années suivantes.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֵׁת
  choice: Après la naissance de Seth
  rationale: Cette formulation française naturelle rend la relation temporelle et le fait qu’Adam est le père de Seth sans employer le tour plus lourd « après avoir engendré Seth ».
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: huit cents ans
  rationale: Rendu direct de l’expression numérique indiquant une durée.
- source_word: וַיּוֹלֶד
  choice: et engendra
  rationale: Le hiphil de ילד désigne ici l’action masculine de procréer. « Engendra » convient au registre généalogique biblique tout en restant intelligible et plus précis que « eut ».
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: L’hébreu nomme explicitement les descendants masculins et féminins; cette précision est conservée plutôt que généralisée en « enfants ».
theological_decisions:
- issue: Sens de אָדָם
  choice: Adam, nom propre
  alternative: l’homme
  rationale: Dans cette généalogie, אָדָם désigne l’individu nommé Adam, et non l’humanité en général.
translation_notes:
  register: Français international moderne, clair et digne. « Engendra » conserve la précision généalogique et le lien lexical avec ילד, tandis que la première proposition est reformulée idiomatiquement pour éviter un calque peu naturel.
