  yaml_path: translation/ot/genesis/005/007.yaml
  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Énosh, Seth vécut encore huit cent sept ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, le verbe indique la durée de vie qui suit la naissance déjà mentionnée. « Vécut encore » rend naturellement en français cette continuation sans modifier le sens.
- source_word: אֲחֲרֵי הוֹלִידוֹ אֶת אֱנוֹשׁ
  choice: après avoir engendré Énosh
  rationale: Cette tournure française fluide conserve le rapport temporel et le sens généalogique du hiphil de ילד. Le nom propre est translittéré « Énosh ».
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: huit cent sept ans
  rationale: Le français place normalement les centaines avant les unités. « Cent » reste invariable puisqu’il est suivi d’un autre nombre.
- source_word: וַיּוֹלֶד
  choice: et engendra
  rationale: « Engendra » restitue précisément le verbe généalogique, dans un registre digne et encore clair, tout en assurant la cohérence avec « engendré » dans la proposition précédente.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: La traduction conserve la mention explicite des descendants masculins et féminins plutôt que de la généraliser en « enfants ».
