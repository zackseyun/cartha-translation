  text: Yéred vécut cent soixante-deux ans et eut pour fils Hénok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans la formule généalogique, le verbe חיה introduit naturellement en français l’indication de l’âge par « vécut ».
- source_word: יֶרֶד
  choice: Yéred
  rationale: Translittération française usuelle du nom hébreu, permettant de le distinguer clairement tout en restant proche de sa forme source.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: cent soixante-deux ans
  rationale: L’ordre numérique hébreu est rendu selon l’usage naturel du français moderne.
- source_word: וַיּוֹלֶד
  choice: puis il eut pour fils
  rationale: Dans cette généalogie, ילד à la forme causative exprime la paternité. « Il eut pour fils » est naturel, digne et plus précis ici que le simple « engendra », aujourd’hui plus soutenu ou archaïsant.
- source_word: אֶת חֲנוֹךְ
  choice: Hénok
  rationale: La particule אֶת marque le complément d’objet direct et ne se traduit pas; « Hénok » est une translittération française courante du nom.
