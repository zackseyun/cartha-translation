base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: fr
  text: Ainsi, la durée totale de la vie de Lémek fut de sept cent soixante-dix-sept ans[a], puis il mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ordonne littéralement le nombre ainsi : « sept et soixante-dix ans, et sept cents ans », soit 777 ans.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ainsi, ... fut
  rationale: Le wayyiqtol de היה introduit le récapitulatif de la durée de vie de Lémek. « Ainsi » rend naturellement la progression narrative, tandis que « fut » s’accorde avec le sujet français singulier « la durée totale ».
- source_word: כָּל יְמֵי
  choice: la durée totale de la vie de
  rationale: L’expression hébraïque signifie littéralement « tous les jours de », mais désigne ici l’ensemble de la vie. Cette formulation française actuelle et digne en transmet clairement le sens.
- source_word: לֶמֶךְ
  choice: Lémek
  rationale: Le nom est translittéré sous la forme française courante, proche de l’hébreu לֶמֶךְ.
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: sept cent soixante-dix-sept
  rationale: L’hébreu énumère les unités, les dizaines, puis les centaines, pour un total de 777. Le français ordonne naturellement ce nombre des centaines aux unités.
- source_word: שָׁנָה
  choice: ans
  rationale: Dans une indication d’âge ou de durée de vie, le français idiomatique emploie « ans ».
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: Cette formule conclusive récurrente de Genèse 5 est rendue sobrement. « Puis » marque la succession narrative portée par le waw consécutif, et le passé simple convient au récit biblique français sans être archaïque.
theological_decisions:
- issue: Formule généalogique de durée de vie en Genèse 5
  choice: Présenter sans réserve interprétative la durée de vie chiffrée et la mort de Lémek.
  alternative: Introduire dans la traduction une lecture symbolique du nombre.
  rationale: Le texte hébreu formule directement une durée de vie numérique suivie d’un avis de décès. La traduction doit conserver cette présentation sans lui ajouter une interprétation symbolique, apologétique ou sceptique.
translation_notes:
  register: Français international moderne, clair et digne. « La durée totale de la vie » traduit naturellement l’idiome hébreu tout en évitant le calque moins courant « tous les jours de ». Le passé simple maintient la cadence solennelle et répétitive de la généalogie.
