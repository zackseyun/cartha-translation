  text: וַֽ/יְחִ֣י מַֽהֲלַלְאֵ֗ל אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת יֶ֔רֶד שְׁלֹשִׁ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Yéred, Mahalalel vécut huit cent trente ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique, le verbe חיה indique la durée de vie qui suit la naissance du fils nommé. Le passé simple convient au registre narratif digne et courant de la Genèse.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: Après avoir engendré Yéred
  rationale: Cette tournure rend clairement le rapport temporel et conserve le sens causatif masculin du hiphil de ילד sans alourdir la phrase.
- source_word: יֶרֶד
  choice: Yéred
  rationale: Translittération française courante, qui représente la consonne initiale hébraïque par Y et aide à prononcer le nom.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: huit cent trente ans
  rationale: L’ordre des éléments est adapté à l’usage français tout en conservant exactement le total de 830 ans. « Cent » reste invariable puisqu’il est suivi de « trente ».
- source_word: וַיּוֹלֶד
  choice: et engendra
  rationale: Le même verbe ילד est rendu de manière cohérente par « engendrer », terme précis et encore intelligible dans un contexte généalogique.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: La traduction conserve la mention explicite des descendants masculins et féminins plutôt que de la généraliser en « enfants ».
