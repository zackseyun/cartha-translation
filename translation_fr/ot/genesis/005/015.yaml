  text: Mahalalel lived sixty-five years and fathered Jared.
translation:
  language: fr
  text: Mahalalel vécut soixante-cinq ans, puis il engendra Yéred.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans la formule généalogique, le verbe חיה indique la durée vécue avant l’événement suivant; le passé simple convient au registre narratif biblique en français.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Le nom propre est translittéré plutôt que traduit; cette forme reste proche de l’hébreu et correspond à un usage français attesté.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: soixante-cinq ans
  rationale: L’ordre numérique hébreu, littéralement « cinq ans et soixante ans », est rendu selon l’ordre idiomatique du français moderne sans modifier la valeur.
- source_word: וַיּוֹלֶד
  choice: puis il engendra
  rationale: Dans cette généalogie, ילד à la forme causative désigne le fait, pour un homme, d’avoir un descendant. « Engendra » préserve ce sens précis et « puis » rend naturellement la succession narrative portée par וַ־.
- source_word: אֶת יָרֶד
  choice: Yéred
  rationale: La particule אֶת marque l’objet direct et ne se traduit pas. « Yéred » translittère directement le nom hébreu יָרֶד dans une graphie lisible en français.
