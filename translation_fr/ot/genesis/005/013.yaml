  text: וַ/יְחִ֣י קֵינָ֗ן אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מַֽהֲלַלְאֵ֔ל אַרְבָּעִ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré Mahalalel, Qénân vécut encore huit cent quarante ans et engendra des fils et des filles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, le verbe indique la durée de vie qui suit la naissance mentionnée; « encore » rend naturellement en français cette période subséquente sans ajouter une nouvelle donnée.
- source_word: קֵינָן
  choice: Qénân
  rationale: Transcription française moderne de la forme hébraïque קֵינָן, distincte de la forme gréco-latine Caïnan.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מַהֲלַלְאֵל
  choice: Après avoir engendré Mahalalel
  rationale: Rend la relation temporelle et le hiphil de ילד avec un sujet masculin, dans un ordre naturel en français.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: huit cent quarante ans
  rationale: Le français exprime naturellement la somme dans l'ordre centaines puis dizaines; « cent » reste invariable puisqu'il est suivi de « quarante ».
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Conserve le sens causatif et masculin de ילד ainsi que la cohérence lexicale avec la première occurrence.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Préserve la mention explicite des descendants masculins et féminins plutôt que de la généraliser en « enfants ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Engendrer » est conservé pour refléter précisément et de manière cohérente le verbe généalogique hébreu, tandis que la note propose une formulation plus courante. L'ordre de la phrase privilégie la fluidité française sans modifier le rapport temporel.
