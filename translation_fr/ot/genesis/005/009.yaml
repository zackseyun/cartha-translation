  text: וַֽ/יְחִ֥י אֱנ֖וֹשׁ תִּשְׁעִ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת קֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: fr
  text: Énosh vécut quatre-vingt-dix ans, puis il engendra Qénân[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On traduit aussi traditionnellement : « il eut pour fils Qénân ». Le verbe hébreu signifie ici qu’Énosh devint son père, dans le cadre de la généalogie.'
    reason: lexical_alternative
  - marker: b
    text: Certaines traditions écrivent « Caïnan », d’après la forme grecque ; le texte hébreu porte Qénân.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans cette formule généalogique suivie d’un âge, חיה signifie naturellement « vivre » ; le passé simple convient au registre narratif biblique en français.
- source_word: אֱנוֹשׁ
  choice: Énosh
  rationale: Translittération française proche de la forme hébraïque, avec un accent facilitant la prononciation.
- source_word: תִּשְׁעִים שָׁנָה
  choice: quatre-vingt-dix ans
  rationale: Rendu idiomatique de l’indication d’âge en français moderne.
- source_word: וַיּוֹלֶד
  choice: engendra
  rationale: Dans une généalogie où le sujet est masculin, le hiphil de ילד indique qu’il devient le père d’un descendant. « Engendra » est précis, concis et demeure intelligible, tandis que « eut pour fils » préciserait une relation que le verbe généalogique peut parfois laisser plus large.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marque de l’objet direct sans équivalent lexical autonome en français ; sa fonction est exprimée par la syntaxe.
- source_word: קֵינָן
  choice: Qénân
  rationale: Translittération française directe de la forme massorétique קֵינָן, distinguée de la forme grecque traditionnelle « Caïnan ».
