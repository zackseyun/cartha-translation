  text: וַֽ/יְחִ֣י אֱנ֗וֹשׁ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת קֵינָ֔ן חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: fr
  text: Après avoir engendré[a] Kénan[b], Énosh vécut encore huit cent quinze ans[c], et il engendra des fils et des filles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après être devenu père de Kénan ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Kénan »; la forme traditionnelle « Caïnan » est surtout influencée par le grec.'
    reason: alternative_reading
  - marker: c
    text: 'Plus littéralement : « Énosh vécut, après avoir engendré Kénan, huit cent quinze ans ».'
    reason: source_word_order
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Dans cette formule généalogique, חיה indique la durée de vie qui suit la naissance mentionnée. « Vécut encore » exprime naturellement en français que les huit cent quinze ans commencent après la naissance de Kénan.
- source_word: אֱנוֹשׁ
  choice: Énosh
  rationale: Transcription française moderne qui reflète directement la forme hébraïque, plutôt que la forme traditionnelle « Énos ».
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: après avoir engendré
  rationale: La construction temporelle et le hiphil de ילד indiquent ici qu'Énosh a engendré Kénan. Cette formulation reste concise et conserve la perspective généalogique masculine du texte.
- source_word: קֵינָן
  choice: Kénan
  rationale: Transcription fondée sur l'hébreu; « Caïnan » vient surtout de la tradition grecque.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: huit cent quinze ans
  rationale: Le texte hébreu donne quinze plus huit cents; l'ordre français usuel exprime naturellement le même total.
- source_word: וַיּוֹלֶד
  choice: il engendra
  rationale: Le même verbe généalogique ילד est rendu de manière cohérente par « engendrer », terme précis et encore intelligible en français courant soutenu.
- source_word: בָּנִים וּבָנוֹת
  choice: des fils et des filles
  rationale: Cette formulation conserve la mention explicite des descendants masculins et féminins, que le terme générique « enfants » effacerait.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Engendrer » préserve la précision de la formule généalogique sans recourir à une tournure excessivement archaïque. L'ordre des groupes est adapté au français naturel, tandis que la note [c] signale la syntaxe hébraïque plus directe.
