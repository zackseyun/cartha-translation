  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: fr
  text: Adam vécut cent trente ans, puis il engendra un fils à sa ressemblance, selon son image[a], et il l’appela Seth.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « à sa ressemblance, selon son image » fait écho à Genèse 1.26-27.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut
  rationale: Dans la formule généalogique, חיה indique l’âge atteint au moment de l’engendrement; « vécut » rend directement cette construction.
- source_word: אָדָם
  choice: Adam
  rationale: Le terme fonctionne ici comme le nom propre du premier homme dans la généalogie.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: cent trente ans
  rationale: Rendu français naturel et exact du nombre hébreu.
- source_word: וַיּוֹלֶד
  choice: engendra un fils
  rationale: Le hiphil de ילד avec un sujet masculin désigne l’action d’engendrer. « Un fils » explicite en français l’objet sous-entendu, identifié ensuite comme Seth.
- source_word: בִּדְמוּתוֹ
  choice: à sa ressemblance
  rationale: דמות exprime la ressemblance; cette formulation conserve l’écho de Genèse 1.26 tout en restant naturelle.
- source_word: כְּצַלְמוֹ
  choice: selon son image
  rationale: « Image » rend צלם et « selon » maintient la nuance propre à la préposition כ ainsi que le parallélisme avec « ressemblance ».
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: et il l’appela Seth
  rationale: Rend naturellement en français l’idiome hébreu littéral « il appela son nom Seth », sans en changer le sens.
- source_word: שֵׁת
  choice: Seth
  rationale: Transcription française conventionnelle du nom propre.
theological_decisions:
- issue: Rapport du fils d’Adam à la ressemblance et à l’image d’Adam
  choice: Conserver explicitement les deux termes, appliqués à la ressemblance avec Adam.
  alternative: Interpréter l’expression comme indiquant soit une diminution de l’image divine après la chute, soit une simple répétition stylistique sans portée théologique.
  rationale: Le texte fait écho à Genèse 1.26-27, mais n’explique pas lui-même les conséquences doctrinales de cet écho. La traduction préserve donc la formulation et sa tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Engendra » est retenu pour la précision du terme de filiation masculine et convient au registre généalogique biblique; l’idiome de nomination est naturalisé en « il l’appela Seth ».
