    rationale: Cette formulation interprète le dernier complément comme modifiant seulement « le labeur pénible ». En hébreu, מִן־הָאֲדָמָה suit l’ensemble « notre travail et le labeur pénible de nos mains » et peut exprimer la source ou la cause de ces réalités. « À cause du sol » préserve mieux cette portée sans modifier le sens contextuel.
