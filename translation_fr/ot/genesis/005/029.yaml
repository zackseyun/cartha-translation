  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: fr
  text: 'Il lui donna le nom de Noé[a], en disant : « Celui-ci nous consolera de notre travail et du labeur pénible de nos mains, à cause du sol que Yahweh a maudit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « consolera » fait écho au nom Noé, qui sonne comme un mot évoquant le repos ou le soulagement.
    reason: Explique le jeu de mots hébreu sans présenter Noé et le verbe comme issus exactement de la même racine.
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: Il lui donna le nom de
  rationale: Cette tournure française rend naturellement la formule hébraïque de nomination tout en conservant la mention explicite du nom.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: זֶה
  choice: Celui-ci
  rationale: Conserve la force démonstrative de l’hébreu et la désignation solennelle de l’enfant.
- source_word: יְנַחֲמֵנוּ
  choice: nous consolera
  rationale: Rend directement le sens habituel de נחם. La note signale le jeu sonore avec le nom Noé, lié à l’idée de repos ou de soulagement.
- source_word: מִמַּעֲשֵׂנוּ
  choice: de notre travail
  rationale: Dans ce contexte, מַעֲשֶׂה désigne l’activité laborieuse plutôt que des actes au sens moral.
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: et du labeur pénible de nos mains
  rationale: Cette formulation restitue à la fois la peine exprimée par עִצָּבוֹן et l’image concrète du travail manuel.
- source_word: מִן־הָאֲדָמָה
  choice: causé par le sol
  rationale: Le second מן peut exprimer ici la source de la peine. Cette formulation française rattache clairement le labeur pénible au sol maudit, sans donner à entendre que l’enfant consolera les humains 'loin du sol'.
- source_word: אֲשֶׁר אֵרְרָהּ
  choice: que ... a maudit
  rationale: Rend simplement la proposition relative qui qualifie le sol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel au lieu de le remplacer par un titre.
theological_decisions:
- issue: Jeu de mots entre Noé (נֹחַ) et יְנַחֲמֵנוּ
  choice: Le texte principal traduit le verbe par « nous consolera » et la note explicite l’association sonore avec le repos et le soulagement.
  alternative: « nous apportera du soulagement » ou « nous donnera du repos »
  rationale: Le verbe hébreu signifie normalement consoler, tandis que le nom Noé évoque par le son le repos. La formulation retenue respecte le sens lexical sans transformer le rapprochement sonore en étymologie stricte.
- issue: Portée de מִן־הָאֲדָמָה
  choice: « causé par le sol » se rattache au labeur pénible.
  alternative: « provenant du sol » ou une répétition de « de » coordonnée avec le travail et le labeur
  rationale: La syntaxe hébraïque permet une relation de provenance ou de cause. Le contexte de Genèse 3 favorise l’idée que le sol maudit est la source du labeur pénible, tout en laissant la note inutile puisque l’ambiguïté n’a pas d’incidence doctrinale majeure.
translation_notes:
  register: Français international moderne, narratif et digne. « Donner le nom de » est plus idiomatique que le calque « appeler son nom ». « Labeur pénible » conserve l’écho à la peine liée au sol maudit en Genèse 3.
