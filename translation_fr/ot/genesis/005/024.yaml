base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: fr
  text: Hénok marcha avec Dieu ; puis il ne fut plus[a], car Dieu le prit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il n’était plus ». L’expression hébraïque indique qu’Hénok n’était plus présent, sans préciser ce qui lui était arrivé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: marcha
  rationale: Le hitpael de הלך décrit ici une conduite durable, et non un simple déplacement. « Marcha » conserve l’image hébraïque et sa portée relationnelle.
- source_word: אֶת הָאֱלֹהִים
  choice: avec Dieu
  rationale: Avec הלך, אֶת exprime l’accompagnement. « Avec Dieu » rend directement cette relation sans l’interpréter comme « devant Dieu ».
- source_word: וְאֵינֶנּוּ
  choice: puis il ne fut plus là
  rationale: L’expression signifie littéralement « et il n’était plus ». L’ajout idiomatique de « là » exprime en français son absence sans préciser ce qui lui est arrivé; « puis » marque naturellement la progression du récit.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de l’absence d’Hénok. « Car » maintient clairement ce rapport causal dans un registre narratif digne.
- source_word: לָקַח אֹתוֹ
  choice: Dieu le prit
  rationale: לקח signifie couramment « prendre ». Cette formulation conserve la sobriété de l’hébreu sans expliciter une destination ni le mode de cette intervention divine.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte narratif, le nom désigne le Dieu unique.
theological_decisions:
- issue: Faut-il préciser qu’Hénok ne mourut pas ou que Dieu l’emmena au ciel ?
  choice: 'Conserver la formulation sobre : « il ne fut plus là, car Dieu le prit ».'
  alternative: « il ne mourut pas » ou « Dieu l’emmena au ciel »
  rationale: Le verset suggère une intervention divine extraordinaire, mais l’hébreu ne nie pas explicitement la mort et ne mentionne aucune destination. La traduction préserve donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, simple et digne. L’expression traditionnelle « marcha avec Dieu » est conservée parce qu’elle reste compréhensible et restitue l’image relationnelle de l’hébreu; « ne fut plus là » rend l’absence de manière naturelle sans surinterprétation.
