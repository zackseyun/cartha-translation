  naturalness: « Hénok marcha avec Dieu » appartient à un registre biblique encore clair et convient à une traduction d’équivalence optimale. « Il ne fut plus » est volontairement elliptique, comme l’hébreu; dans ce contexte narratif solennel, cette formulation est recevable. Le point-virgule évite de surcharger la progression par « puis » tout en conservant la coordination narrative.
  terminology: « Dieu » et « le prit » sont justes et ne précisent ni destination céleste ni absence de mort. L’orthographe « Hénok » est conservée telle qu’elle figure dans le projet.
