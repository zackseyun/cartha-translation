source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: fr
  text: Il bâtit là un autel et invoqua le nom de Yahweh[a]. Il y dressa sa tente, et les serviteurs d’Isaac y creusèrent un puits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « proclama le nom de Yahweh ». L’expression hébraïque peut désigner l’invocation ou la proclamation; ici, le contexte de l’autel favorise l’invocation.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Il bâtit là un autel
  rationale: « Bâtir » est le verbe français courant pour la construction d’un autel et conserve l’indication de lieu répétée dans l’hébreu.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: invoqua le nom de Yahweh
  rationale: Dans ce contexte cultuel, après la construction d’un autel, l’expression désigne le plus naturellement une invocation adressée à Yahweh, tout en laissant en note la possibilité d’une proclamation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel porté par le tétragramme plutôt que de lui substituer un titre.
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: Il y dressa sa tente
  rationale: « Dresser sa tente » est une expression française naturelle correspondant à l’emploi idiomatique de נטה avec « tente »; « y » rend שָׁם sans lourdeur.
- source_word: עַבְדֵי יִצְחָק
  choice: les serviteurs d’Isaac
  rationale: Dans ce récit, le terme désigne les membres de la maison d’Isaac chargés de creuser; « serviteurs » convient sans préciser un statut juridique que le contexte ne met pas en avant.
- source_word: וַיִּכְרוּ שָׁם ... בְּאֵר
  choice: y creusèrent un puits
  rationale: Rendu direct et idiomatique de l’action; le second « y » préserve l’insistance géographique de שָׁם.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; « Yahweh » en conserve la fonction de nom propre au lieu de le remplacer par un titre.
- issue: Sens de קרא בשם יהוה
  choice: invoqua le nom de Yahweh
  alternative: proclama le nom de Yahweh
  rationale: L’expression hébraïque peut évoquer l’invocation ou la proclamation. La présence immédiate de l’autel favorise ici l’acte d’invocation cultuelle, sans supprimer l’autre possibilité, signalée en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide tout en conservant la succession narrative et la répétition hébraïque de l’indication de lieu au moyen de « là » puis de « y ».
