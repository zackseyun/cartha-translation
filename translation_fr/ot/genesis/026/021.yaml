  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: fr
  text: Puis ils creusèrent un autre puits, et ils se disputèrent aussi à son sujet. Il lui donna le nom de Sitna[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Sitna évoque en hébreu l’hostilité ou l’opposition.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: ils creusèrent
  rationale: Le qal narratif pluriel de חפר désigne simplement l’action de creuser. Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: בְּאֵר אַחֶרֶת
  choice: un autre puits
  rationale: בְּאֵר signifie « puits » et אַחֶרֶת, qui s’accorde avec lui en hébreu, indique qu’il s’agit d’un puits supplémentaire et distinct du précédent.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: ils se disputèrent aussi à son sujet
  rationale: ריב exprime ici un conflit ou une contestation. « Se disputèrent » est naturel et accessible; « aussi » rend גַּם, tandis que « à son sujet » rend clairement עַל avec le pronom renvoyant au puits.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: il lui donna le nom de
  rationale: La formule hébraïque signifie littéralement « il appela son nom ». « Il lui donna le nom de » conserve explicitement l’acte de nomination dans un français naturel et digne.
- source_word: שִׂטְנָה
  choice: Sitna
  rationale: Le nom propre du puits est translittéré plutôt que traduit. Sa parenté avec un terme évoquant l’hostilité ou l’opposition est signalée en note afin de préserver le jeu de sens.
