  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: fr
  text: Elles furent pour Isaac et Rébecca une source d’amertume[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Elles furent une amertume d’esprit pour Isaac et pour Rébecca. » L’expression hébraïque évoque une vive contrariété ou une profonde affliction.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « Elles devinrent pour Isaac et Rébecca une source d’amertume. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: Elles causèrent
  rationale: Le féminin pluriel renvoie aux deux femmes d’Ésaü mentionnées au verset précédent. Avec le complément « amertume », cette tournure rend naturellement en français l’état ou l’effet exprimé par היה, sans exclure la nuance possible de devenir.
- source_word: מֹרַת רוּחַ
  choice: une profonde amertume
  rationale: L’expression nominale hébraïque signifie littéralement « amertume d’esprit » et désigne une vive contrariété, une affliction intérieure. « Profonde amertume » conserve l’image centrale tout en étant naturel en français moderne.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: à Isaac et à Rébecca
  rationale: Les deux prépositions ל désignent les personnes affectées. En français, la répétition de « à » devant Rébecca est naturelle et met clairement les deux parents sur le même plan.
