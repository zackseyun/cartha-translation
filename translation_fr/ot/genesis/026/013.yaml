  yaml_path: translation/ot/genesis/026/013.yaml
  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: fr
  text: L’homme devint grand[a] et continua de grandir jusqu’à devenir très grand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devint prospère ». Le terme hébreu évoque une grandeur ou une importance croissante; dans ce contexte, celle-ci inclut la prospérité d’Isaac.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: devint puissant
  rationale: Le verbe גדל exprime ici un accroissement en grandeur, importance ou prospérité. « Devint puissant » conserve une portée plus large que « s’enrichit » et convient au contexte matériel sans s’y limiter.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: איש désigne simplement « l’homme » et renvoie ici à Isaac.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: continua de grandir
  rationale: La construction hébraïque cumulative exprime une progression persistante. « Continua de grandir » la rend naturellement en français tout en maintenant l’idée d’accroissement.
- source_word: עַד כִּי
  choice: jusqu’à
  rationale: La locution introduit ici le point culminant de la progression.
- source_word: גָדַל מְאֹד
  choice: devenir extrêmement puissant
  rationale: Cette formulation reprend l’idée de גדל et rend l’intensité de מאוד, sans réduire explicitement la grandeur à la seule richesse.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de la racine hébraïque גדל est partiellement conservée par « grandir » et « puissant », tandis que la tournure idiomatique évite un calque obscur de l’expression verbale hébraïque.
