  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: fr
  text: 'Yahvé lui apparut cette nuit-là et dit : « Je suis le Dieu d’Abraham, ton père. N’aie pas peur, car je suis avec toi. Je te bénirai et je multiplierai ta descendance[a] à cause d’Abraham, mon serviteur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ta semence »; le terme hébreu a ici un sens collectif et désigne la descendance.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, et conserve ici un nom propre plutôt que de le remplacer par un titre.
- source_word: וַיֵּרָא אֵלָיו
  choice: lui apparut
  rationale: Le nifal de ראה exprime ici une manifestation visible; cette formulation est directe, naturelle et adaptée au récit théophanique.
- source_word: בַּלַּיְלָה הַהוּא
  choice: cette nuit-là
  rationale: Cette tournure française idiomatique conserve la valeur démonstrative de l’hébreu.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Je suis le Dieu d’Abraham, ton père
  rationale: La formulation suit de près l’ordre et la relation syntaxique de l’hébreu, tout en restant naturelle en français.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Cette expression rend clairement l’interdiction et la consolation divines dans un français actuel; « Ne crains pas » serait plus traditionnel et soutenu.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: car je suis avec toi
  rationale: « Car » marque que la présence divine constitue le motif de ne pas avoir peur.
- source_word: וּבֵרַכְתִּיךָ
  choice: Je te bénirai
  rationale: Dans ce contexte de promesse, la forme verbale se rend naturellement par le futur français.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: et je multiplierai ta descendance
  rationale: La formulation conserve le sens causatif de רבה et la valeur collective de זרע, sans employer le littéral « semence », peu naturel ici en français moderne.
- source_word: בַּעֲבוּר
  choice: à cause de
  rationale: La locution exprime sobrement le motif ou fondement de la bénédiction, sans préciser davantage la nature du lien.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte d’alliance, « serviteur » exprime mieux la relation et le statut d’Abraham que « esclave ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin; la traduction le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Fondement de la promesse dans בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: à cause d’Abraham, mon serviteur
  alternative: pour l’amour d’Abraham, mon serviteur
  rationale: « À cause de » préserve le lien causal ou motivant avec Abraham sans introduire explicitement une nuance affective absente de la préposition hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le discours divin emploie le tutoiement, naturel dans le contexte biblique français. La ponctuation distingue nettement l’apposition « ton père » et les différentes promesses.
