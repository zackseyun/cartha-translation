  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יִצְחָ֔ק מַדּ֖וּעַ בָּאתֶ֣ם אֵלָ֑/י וְ/אַתֶּם֙ שְׂנֵאתֶ֣ם אֹתִ֔/י וַ/תְּשַׁלְּח֖וּ/נִי מֵ/אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: fr
  text: 'Isaac leur dit[a] : « Pourquoi êtes-vous venus vers moi, alors que vous me détestiez et que vous m’avez renvoyé loin de vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et vous me détestiez et m’avez renvoyé loin de vous ». La conjonction hébraïque signifie littéralement « et », mais elle peut ici exprimer un contraste ou une circonstance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: Isaac leur dit
  rationale: Formulation narrative française naturelle, qui conserve le verbe courant « dire » et indique clairement les destinataires.
- source_word: מַדּוּעַ
  choice: Pourquoi
  rationale: Équivalent interrogatif direct, naturel et fidèle au sens causal.
- source_word: בָּאתֶם אֵלָי
  choice: êtes-vous venus me voir
  rationale: Le passé composé convient à une arrivée récente dont le résultat est présent. « Me voir » exprime ici naturellement le mouvement intentionnel vers Isaac.
- source_word: וְאַתֶּם
  choice: alors que vous
  rationale: 'La conjonction introduit vraisemblablement une circonstance contrastive : leur venue surprend au regard de leur hostilité passée. La note conserve la coordination plus formelle.'
- source_word: שְׂנֵאתֶם אֹתִי
  choice: vous me détestiez
  rationale: « Détester » rend la force ordinaire de שׂנא sans l’atténuer; l’imparfait présente l’hostilité comme la situation qui formait l’arrière-plan de leur expulsion d’Isaac.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: vous m’avez renvoyé
  rationale: « Renvoyer » exprime clairement le fait de faire partir quelqu’un, sans renforcer indûment le verbe en « chasser ».
- source_word: מֵאִתְּכֶם
  choice: loin de vous
  rationale: Cette expression française rend la séparation d’avec leur présence ou leur groupe de manière idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct et conserve la vigueur du reproche d’Isaac sans amplifier la violence de l’expulsion.
