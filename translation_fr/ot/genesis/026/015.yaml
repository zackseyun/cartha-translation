id: GEN.26.15
reference: Genesis 26:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל הַ/בְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔י/ו בִּ/ימֵ֖י אַבְרָהָ֣ם אָבִ֑י/ו סִתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים וַ/יְמַלְא֖וּ/ם עָפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: fr
  text: Tous les puits que les serviteurs[a] de son père avaient creusés du temps d’Abraham, son père, les Philistins les bouchèrent et les remplirent de terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves ». Le mot hébreu peut désigner des serviteurs ou des esclaves.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi désigner de la poussière ou de la terre meuble.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: Tous les puits
  rationale: « Tous les puits » restitue la totalité exprimée par כָל et désigne naturellement les בְּאֵרֹת. La coordination initiale וְ est laissée implicite, comme le permet le français narratif dans ce contexte.
- source_word: אֲשֶׁר חָפְרוּ
  choice: que … avaient creusés
  rationale: Le plus-que-parfait situe clairement le creusement avant l’action ultérieure des Philistins.
- source_word: עַבְדֵי אָבִיו
  choice: les serviteurs de son père
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. « Serviteurs » convient au contexte sans préciser un statut servile que le verset ne met pas au premier plan.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: du temps d’Abraham, son père
  rationale: Cette formulation française naturelle conserve le cadre temporel et la répétition explicite de la relation paternelle dans l’hébreu.
- source_word: סִתְּמוּם
  choice: les bouchèrent
  rationale: Le verbe désigne l’obstruction des puits ; « boucher » est le terme français courant et précis dans ce contexte.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française traditionnelle et standard de ce peuple.
- source_word: וַיְמַלְאוּם עָפָר
  choice: et les remplirent de terre
  rationale: Le pronom objet « les » reflète le suffixe hébreu renvoyant aux puits. « Terre » rend עָפָר dans un registre digne et concret.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « Abraham, son père » est conservée parce qu’elle appartient au relief du texte hébreu, malgré sa légère redondance en français.
