source:
  edition: WLC
  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: fr
  text: Isaac sema dans ce pays et, cette année-là, il obtint une récolte au centuple[a]. Yahweh le bénit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement qu’il « trouva cent שְׂעָרִים ». Cette expression rare est généralement comprise comme l’indication d’un rendement exceptionnellement abondant; elle peut aussi se comprendre comme « cent mesures ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: sema
  rationale: Dans ce contexte agricole, זרע désigne l’action de semer; « sema » conserve directement cette image.
- source_word: בָּאָרֶץ הַהִוא
  choice: dans ce pays
  rationale: אֶרֶץ peut désigner une terre ou un pays. Ici, « ce pays » est naturel en français et renvoie au territoire où Isaac séjournait.
- source_word: וַיִּמְצָא
  choice: récolta
  rationale: Le sens premier est « trouver », mais, associé ici au rendement de la semence, le verbe exprime idiomatiquement le résultat obtenu lors de la récolte.
- source_word: בַּשָּׁנָה הַהִוא
  choice: cette année-là
  rationale: Cette formulation française rend naturellement et précisément l’expression temporelle hébraïque.
- source_word: מֵאָה שְׁעָרִים
  choice: cent fois ce qu’il avait semé
  rationale: L’expression rare décrit un rendement agricole exceptionnel. Cette formulation en explicite naturellement le sens probable sans supposer une unité de mesure déterminée.
- source_word: וַיְבָרֲכֵהוּ
  choice: le bénit
  rationale: ברך est le verbe usuel pour « bénir »; cette traduction maintient l’attribution explicite de la prospérité à l’action divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte source.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie explicitement le tétragramme; « Yahweh » préserve le nom propre au lieu de lui substituer un titre.
- issue: Expression du rendement agricole d’Isaac
  choice: il récolta cent fois ce qu’il avait semé
  alternative: il trouva cent mesures
  rationale: La formulation retenue communique le sens agricole probable en français moderne, tandis que la note conserve l’ambiguïté lexicale de l’expression hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. La rareté de מֵאָה שְׁעָרִים est signalée en note afin de ne pas masquer l’ambiguïté du texte hébreu.
