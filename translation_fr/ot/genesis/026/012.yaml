    rationale: « Cent fois ce qu’il avait semé » impose explicitement une lecture de rendement proportionnel à la semence. Bien que cette lecture soit probable, le syntagme hébreu rare demeure lexicalement incertain et la note reconnaît l’alternative « cent mesures ». Une formulation moins analytique préserve mieux cette marge d’ambiguïté.
