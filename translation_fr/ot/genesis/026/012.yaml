  source_fidelity: La traduction rend correctement la semence, le cadre territorial, la date, la bénédiction et le nom divin. Toutefois, « cent fois ce qu’il avait semé » explicite le rapport entre semence et produit plus directement que ne le fait l’hébreu, dont l’expression מֵאָה שְׂעָרִים est rare et discutée. « Une récolte au centuple » restitue le sens agricole probable sans fixer une unité ni développer excessivement l’idiome.
  naturalness: Le français est naturel, clair et adapté au récit biblique moderne. Le passé simple convient. « Obtenir une récolte au centuple » est idiomatique et plus souple que « récolter cent fois ce qu’il avait semé ».
