source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ מִ/שָּׁ֖ם יִצְחָ֑ק וַ/יִּ֥חַן בְּ/נַֽחַל גְּרָ֖ר וַ/יֵּ֥שֶׁב שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: fr
  text: Isaac partit donc de là. Il dressa son camp dans la vallée de Guérar[a] et s’y installa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le ravin de Guérar » ou « dans le lit du cours d’eau de Guérar ». Le terme hébreu peut désigner une vallée, un ravin ou le lit d’un cours d’eau saisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: partit donc de là
  rationale: Le verbe הלך, avec מִשָּׁם, exprime ici le départ du lieu précédent. « Partit de là » est naturel en français et le connecteur « donc » inscrit ce déplacement dans la suite du récit.
- source_word: וַיִּחַן
  choice: dressa son camp
  rationale: Le verbe חנה désigne l’action de camper. « Dressa son camp » rend clairement l’établissement du campement dans un français courant et digne.
- source_word: בְּנַחַל גְּרָר
  choice: dans la vallée de Guérar
  rationale: נַחַל peut désigner une vallée, un ravin ou le lit d’un cours d’eau saisonnier. « Vallée » reste immédiatement compréhensible, tandis qu’une note conserve l’éventail géographique du terme hébreu.
- source_word: וַיֵּשֶׁב שָׁם
  choice: s’y installa
  rationale: ישב peut signifier habiter, demeurer ou s’établir. Après l’action de camper, « s’y installa » restitue naturellement la progression narrative sans imposer l’idée d’une résidence nécessairement permanente.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le découpage en deux phrases allège la coordination hébraïque sans modifier la succession des actions. Le marqueur [a] figure dans le texte principal.
