base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: fr
  text: Isaac creusa de nouveau[a] les puits d’eau qui avaient été creusés du temps de son père Abraham et que les Philistins avaient bouchés après la mort d’Abraham. Il leur donna les mêmes noms que son père leur avait donnés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Isaac revint et creusa. » Le verbe hébreu peut désigner explicitement un retour, mais, dans cette construction, il marque probablement la reprise de l’action : Isaac se remit à creuser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: creusa de nouveau
  rationale: La construction avec שוב suivi d’un second verbe exprime ici naturellement la reprise de l’action. « Creusa de nouveau » rend cette valeur sans suggérer à tort un déplacement, tout en gardant l’idée concrète de creuser des puits antérieurs qui avaient été bouchés.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: les puits d’eau
  rationale: Cette formulation française claire conserve l’expression hébraïque et son insistance sur les puits comme sources d’eau.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: qui avaient été creusés du temps de son père Abraham
  rationale: Le pluriel hébreu a un sujet non précisé; le passif français le préserve sans inventer d’acteurs. « Du temps de » rend naturellement בימי, et l’ordre « son père Abraham » est idiomatique en français.
- source_word: וַיְסַתְּמוּם
  choice: avaient bouchés
  rationale: « Boucher » est le terme courant pour rendre סתם à propos de puits, sans préciser indûment la matière employée.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française conventionnelle de ce peuple.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: après la mort d’Abraham
  rationale: Rendu français direct et naturel de la relation temporelle.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת
  choice: Il leur donna ... noms
  rationale: En français, « donner un nom » exprime naturellement l’acte de nommer indiqué par קרא avec ל et שֵׁמוֹת.
- source_word: כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: les mêmes noms que son père leur avait donnés
  rationale: Le כ marque la correspondance avec les noms antérieurs. « Les mêmes noms » rend explicitement cette identité et évite une tournure française lourde calquée sur l’hébreu.
