  yaml_path: translation/ot/genesis/026/033.yaml
  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: fr
  text: Il l’appela Shib'a[a]. C’est pourquoi la ville porte encore aujourd’hui le nom de Beer-Shéba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shib'a correspond au mot hébreu pour « sept » et se rattache au jeu de mots contenu dans Beer-Shéba, nom qui peut être compris comme « puits des sept » ou « puits du serment ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: Il l’appela
  rationale: Dans ce contexte de dénomination, קרא signifie « appeler » ou « nommer ». Le pronom féminin renvoie au puits mentionné au verset précédent; l’élision française « l’ » garde cette référence sans lourdeur.
- source_word: שִׁבְעָה
  choice: Shibéa
  rationale: Le terme fonctionne ici comme le nom donné au puits. La translittération préserve le nom hébreu et permet d’expliquer en note son jeu de mots avec « sept » et « serment ».
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution introduit naturellement en français la conséquence explicative qui relie le nom du puits à celui de la ville.
- source_word: שֵׁם הָעִיר בְּאֵר שֶׁבַע
  choice: la ville porte encore aujourd’hui le nom de Beer-Shéba
  rationale: Cette formulation française naturelle exprime fidèlement que le nom de la ville est Beer-Shéba, tout en intégrant l’expression temporelle qui suit.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: encore aujourd’hui
  rationale: Équivalent idiomatique moderne de « jusqu’à ce jour », adapté au registre narratif sans modifier le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres sont translittérés sous les formes Shibéa et Beer-Shéba; le jeu de mots hébreu, impossible à reproduire entièrement dans le texte courant, est conservé en note.
