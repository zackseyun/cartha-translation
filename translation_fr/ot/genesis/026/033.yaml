  text: וַ/יִּקְרָ֥א אֹתָ֖/הּ שִׁבְעָ֑ה עַל כֵּ֤ן שֵׁם הָ/עִיר֙ בְּאֵ֣ר שֶׁ֔בַע עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
