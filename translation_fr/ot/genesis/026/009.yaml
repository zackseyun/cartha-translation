base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: fr
  text: 'Abimélek fit appeler Isaac et lui dit : « Elle est bel et bien ta femme ! Comment as-tu pu dire : “C’est ma sœur” ? » Isaac lui répondit : « Car je me suis dit : “Je pourrais mourir à cause d’elle.” »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « J’avais peur qu’on me tue à cause d’elle. »'
    reason: Le texte hébreu dit littéralement qu’Isaac pourrait « mourir à cause d’elle » ; le contexte permet de comprendre qu’il craignait que des hommes le tuent pour prendre sa femme.
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: fit donc appeler Isaac
  rationale: Avec לְ suivi de la personne, קרא signifie ici faire appeler ou convoquer. « Fit appeler » est naturel en français et convient à l’action d’un roi, sans ajouter la nuance plus formelle de « convoqua ».
- source_word: אַךְ הִנֵּה
  choice: bel et bien
  rationale: Les deux particules soulignent avec force la constatation d’Abimélek. « Bel et bien » rend cette insistance en français idiomatique sans transformer l’affirmation en question.
- source_word: אִשְׁתְּךָ הִוא
  choice: Elle est ... ta femme
  rationale: La formulation directe conserve la conclusion factuelle et emphatique du roi.
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: Comment as-tu pu dire
  rationale: L’interrogation exprime ici le reproche et l’incrédulité, bien rendus par « as-tu pu ».
- source_word: אֲחֹתִי הִוא
  choice: C’est ma sœur
  rationale: אחות désigne simplement la sœur dans cette déclaration. La tournure présentative est naturelle dans une citation française.
- source_word: כִּי אָמַרְתִּי
  choice: Je me suis dit
  rationale: אמר peut décrire une parole intérieure. Dans ce contexte, « je me suis dit » introduit naturellement le motif qu’Isaac avait envisagé.
- source_word: פֶּן אָמוּת
  choice: Je risque de mourir
  rationale: Après פן, l’imparfait hébreu exprime un résultat redouté. Cette formulation française actuelle préserve la possibilité crainte sans affirmer que la mort était certaine.
- source_word: עָלֶיהָ
  choice: à cause d’elle
  rationale: 'La préposition exprime ici la cause ou l’occasion du danger : Isaac craint d’être tué en raison de Rébecca.'
theological_decisions: []
translation_notes:
  register: Français international actuel, digne et narratif. « Bel et bien » restitue l’emphase de אַךְ הִנֵּה sans archaïsme ; « je risque de mourir » rend la crainte exprimée par פן dans une langue naturelle. Le marqueur de note est placé après la réponse complète d’Isaac.
