revisions:
- from: 'Abimélek fit donc appeler Isaac et lui dit : « Elle est bel et bien ta femme ! Comment as-tu pu dire : “C’est ma sœur” ? » Isaac lui répondit : « Je me suis dit : “Je risque de mourir à cause d’elle.” »[a]'
  to: 'Abimélek fit appeler Isaac et lui dit : « Elle est bel et bien ta femme ! Comment as-tu pu dire : “C’est ma sœur” ? » Isaac lui répondit : « Car je me suis dit : “Je pourrais mourir à cause d’elle.” »[a]'
  rationale: La révision remplace la formulation de risque au présent par une éventualité redoutée, plus fidèle à פֶּן suivi de l’imparfait. Elle supprime aussi « donc », qui n’est pas nécessaire à la simple succession narrative du texte source. Le reste du texte et l’ancrage de note sont conservés.
  reviewer_model: gpt-5.6-terra
