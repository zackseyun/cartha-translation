  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: fr
  text: Ils se levèrent de bon matin et se prêtèrent serment l’un à l’autre[a]. Isaac les renvoya, et ils s’en allèrent d’auprès de lui en paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « un homme à son frère » ; cet idiome exprime ici un serment réciproque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Ils se levèrent de bon matin
  rationale: Le verbe שׁכם au hiphil exprime le fait de se lever tôt; « de bon matin » rend naturellement en français son association avec בַבֹּקֶר.
- source_word: וַיִּשָּׁבְעוּ
  choice: prêta serment
  rationale: Le niphal de שׁבע signifie « jurer » ou « prêter serment ». Cette formulation conserve le caractère formel de l’engagement sans en préciser indûment le contenu.
- source_word: אִישׁ לְאָחִיו
  choice: chacun … à son frère
  rationale: Cette formulation garde l’image masculine et relationnelle de l’hébreu, littéralement « un homme à son frère », tout en faisant comprendre la réciprocité du serment.
- source_word: וַיְשַׁלְּחֵם
  choice: Isaac les laissa ensuite partir
  rationale: Dans cette scène, le piel de שׁלח indique qu’Isaac les renvoie ou leur donne congé. « Les laissa partir » est naturel et n’implique aucune hostilité.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: ils le quittèrent
  rationale: הלך avec מֵאֵת exprime ici l’éloignement d’auprès d’Isaac. « Ils le quittèrent » rend ce mouvement avec concision.
- source_word: בְּשָׁלוֹם
  choice: en paix
  rationale: שָׁלוֹם évoque à la fois des rapports pacifiés et un départ sans danger; « en paix » préserve cette amplitude de sens.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La tournure « de bon matin » reste courante; « prêter serment » maintient le registre formel de la scène. L’idiome hébreu masculin est conservé dans le texte et expliqué en note.
