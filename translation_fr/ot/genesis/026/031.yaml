review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est juste : lever matinal, serment réciproque, départ accordé par Isaac et séparation en paix. Toutefois, « chacun prêta serment à son frère » est une restitution trop littérale et peu claire en français : elle peut suggérer des frères au sens familial et rend moins nettue la réciprocité idiomatique de אִישׁ לְאָחִיו.'
  naturalness: « Ils se prêtèrent serment l’un à l’autre » est plus idiomatique en français moderne tout en restant formel. « Isaac les renvoya » rend directement le piel de שׁלח sans connotation nécessairement hostile dans ce contexte.
  terminology: « Prêter serment », « renvoya » et « en paix » conviennent au registre narratif solennel et conservent respectivement la formalité du serment, l’initiative d’Isaac dans le départ, et la portée relationnelle de בְּשָׁלוֹם.
  issues:
  - severity: medium
    issue: Formulation littérale ambiguë de l’idiome du serment
    rationale: « Chacun prêta serment à son frère » n’est pas naturel et peut être compris comme un serment prêté à un frère biologique. L’hébreu emploie ici un idiome de réciprocité, qu’il vaut mieux rendre dans le texte et documenter en note.
  - severity: low
    issue: Rendu affaibli de וַיְשַׁלְּחֵם
    rationale: « Les laissa partir » peut exprimer une simple permission, alors que le verbe indique qu’Isaac les renvoya/envoya partir. « Les renvoya » est plus direct et reste neutre.
  revised_text: Ils se levèrent de bon matin et se prêtèrent serment l’un à l’autre[a]. Isaac les renvoya, et ils s’en allèrent d’auprès de lui en paix.
  revised_footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « un homme à son frère » ; cet idiome exprime ici un serment réciproque.'
    reason: lexical_alternative
  revision_rationale: La révision rend l’idiome hébreu selon son sens contextuel de réciprocité, sans effacer sa formulation littérale, qui est conservée en note. Elle restitue aussi plus directement l’action d’Isaac dans le renvoi des visiteurs.
