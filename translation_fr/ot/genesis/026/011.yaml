  text: וַ/יְצַ֣ו אֲבִימֶ֔לֶךְ אֶת כָּל הָ/עָ֖ם לֵ/אמֹ֑ר הַ/נֹּגֵ֜עַ בָּ/אִ֥ישׁ הַ/זֶּ֛ה וּ/בְ/אִשְׁתּ֖/וֹ מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: fr
  text: 'Alors Abimélek donna cet ordre à tout le peuple : « Quiconque touche à cet homme ou à sa femme[a] sera certainement mis à mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « celui qui touche à cet homme ou à sa femme ».'
    reason: alternative lexicale reflétant la forme participiale hébraïque
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le piel de צוה exprime un commandement faisant autorité. « Donna cet ordre » est naturel en français et conserve cette force.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: עם désigne ici l’ensemble des personnes placées sous l’autorité d’Abimélek, sans impliquer nécessairement une nation au sens ethnique.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif quotatif introduit le contenu de l’ordre. En français moderne, les deux-points rendent cette fonction plus naturellement qu’un calque tel que « en disant ».
- source_word: הַנֹּגֵעַ
  choice: quiconque touche
  rationale: 'Le participe avec article a une valeur générique : « celui qui touche » ou « quiconque touche ». « Touche » préserve le sens simple de נגע sans renforcer indûment l’expression.'
- source_word: בָּאִישׁ הַזֶּה
  choice: à cet homme
  rationale: Avec נגע, la préposition ב marque la personne touchée. Le français idiomatique emploie ici « toucher à quelqu’un », expression qui peut aussi convenir au contexte menaçant sans préciser la nature de l’atteinte.
- source_word: וּבְאִשְׁתּוֹ
  choice: ou à sa femme
  rationale: Bien que ו soit formellement additif, « ou » exprime naturellement en français que l’atteinte à l’une ou l’autre des deux personnes entraîne la peine. אשה avec le suffixe signifie ici « sa femme ».
- source_word: מוֹת יוּמָת
  choice: sera certainement mis à mort
  rationale: L’infinitif absolu suivi de la forme passive intensive souligne la certitude de la peine. « Mis à mort » conserve le caractère passif et judiciaire de la formulation.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La construction directe avec deux-points évite le calque « en disant », tandis que « sera certainement mis à mort » conserve l’intensité et la voix passive de l’hébreu.
