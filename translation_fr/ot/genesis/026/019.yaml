  text: וַ/יַּחְפְּר֥וּ עַבְדֵֽי יִצְחָ֖ק בַּ/נָּ֑חַל וַ/יִּ֨מְצְאוּ שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: fr
  text: Les serviteurs d’Isaac creusèrent dans le lit du torrent[a] et y trouvèrent un puits d’eau vive[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la vallée » ou « dans le lit du cours d’eau »; le terme hébreu désigne souvent un oued, c’est-à-dire un cours d’eau saisonnier.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « eau vivante », c’est-à-dire de l’eau fraîche ou courante provenant d’une source, plutôt que de l’eau stagnante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: creusèrent
  rationale: Le qal de חפר est le verbe courant pour l’action de creuser; le passé simple convient au registre narratif biblique en français.
- source_word: עַבְדֵי יִצְחָק
  choice: les serviteurs d’Isaac
  rationale: La construction désigne les personnes au service d’Isaac. « Serviteurs » reste naturel dans ce contexte sans préciser un statut juridique que le verset ne met pas en avant.
- source_word: בַּנָּחַל
  choice: dans le lit du torrent
  rationale: נחל désigne souvent un cours d’eau saisonnier ou son lit. « Lit du torrent » est immédiatement compréhensible en français international et rend ici le lieu où l’on creuse.
- source_word: וַיִּמְצְאוּ שָׁם
  choice: y trouvèrent
  rationale: Le pronom adverbial « y » restitue naturellement שָׁם, « là », en renvoyant au lit du torrent.
- source_word: בְּאֵר
  choice: un puits
  rationale: באר désigne un puits; le groupe qui suit en précise la nature de l’eau.
- source_word: מַיִם חַיִּים
  choice: eau vive
  rationale: L’expression hébraïque signifie littéralement « eau vivante » et désigne de l’eau fraîche ou courante provenant d’une source. « Eau vive » conserve l’image et les résonances bibliques tout en étant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le passé simple soutient la narration écrite; « lit du torrent » évite l’emprunt géographique « oued » dans le corps du texte, tandis que « eau vive » préserve l’image hébraïque.
