base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: fr
  text: 'Quand les hommes de l’endroit l’interrogèrent au sujet de sa femme, il répondit : « C’est ma sœur. » Il avait peur de dire : « C’est ma femme », de peur que les hommes de l’endroit ne le tuent à cause de Rébecca, parce qu’elle était belle à voir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: l’interrogèrent
  rationale: Le qal de שׁאל désigne ici une demande de renseignements. « Interroger au sujet de » est naturel en français et rend clairement l’objet de la question.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: les hommes de l’endroit
  rationale: אַנְשֵׁי désigne précisément les hommes, et non la population en général. « De l’endroit » conserve la référence locale sans lourdeur.
- source_word: לְאִשְׁתּוֹ
  choice: au sujet de sa femme
  rationale: Avec שׁאל, la préposition ל introduit ici le sujet de la question.
- source_word: אֲחֹתִי הִוא
  choice: C’est ma sœur
  rationale: Cette formulation idiomatique conserve l’identification catégorique exprimée par l’hébreu.
- source_word: כִּי יָרֵא
  choice: Il avait peur
  rationale: כִּי introduit la raison de la réponse d’Isaac, et יָרֵא exprime sa crainte.
- source_word: לֵאמֹר אִשְׁתִּי
  choice: 'de dire : « C’est ma femme »'
  rationale: Le français explicite la copule sous-entendue devant « ma femme » et conserve le discours direct.
- source_word: פֶּן יַהַרְגֻנִי
  choice: de peur que … ne le tuent
  rationale: פֶּן introduit une conséquence redoutée. Le passage à la troisième personne est nécessaire en français hors du discours direct et ne modifie pas le référent.
- source_word: עַל רִבְקָה
  choice: à cause de Rébecca
  rationale: עַל marque ici le motif ou l’occasion du meurtre redouté.
- source_word: טוֹבַת מַרְאֶה
  choice: elle était belle
  rationale: L’expression décrit une apparence agréable ou belle. La formulation simple est naturelle et restitue le sens sans archaïsme.
- source_word: רִבְקָה
  choice: Rébecca
  rationale: « Rébecca » est la forme française courante du nom hébreu רִבְקָה.
