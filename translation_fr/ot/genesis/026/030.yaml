  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: fr
  text: Il leur prépara un festin[a], puis ils mangèrent et burent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « banquet » ; le terme hébreu peut désigner un festin où la boisson tient une place notable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: prépara
  rationale: Avec מִשְׁתֶּה comme complément, « prépara » exprime naturellement en français l’organisation et l’offre du repas, plutôt que le calque « fit ».
- source_word: לָהֶם
  choice: leur
  rationale: 'Le pronom français « leur » rend ici le ל bénéficiaire : le festin est préparé à leur intention.'
- source_word: מִשְׁתֶּה
  choice: festin
  rationale: Le terme désigne un repas de fête ou banquet où la boisson tient souvent une place notable. « Festin » est naturel et digne, tandis que la mention explicite qu’ils burent conserve cette nuance.
- source_word: וַיֹּאכְלוּ
  choice: ils mangèrent
  rationale: Rendu direct du verbe אכל au passé simple, adapté au registre narratif biblique moderne.
- source_word: וַיִּשְׁתּוּ
  choice: et burent
  rationale: Rendu direct de שתה ; le sujet n’est pas répété en français afin de garder une coordination naturelle.
