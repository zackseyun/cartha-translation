base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: fr
  text: 'Il partit de là et creusa un autre puits ; on ne se disputa pas à son sujet. Il l’appela Rehoboth[a], en disant : « Maintenant, Yahweh nous a fait de la place, et nous porterons du fruit dans le pays. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le nom Rehoboth évoque en hébreu de vastes espaces ; l’explication d’Isaac joue sur cette idée : « Yahweh nous a fait de la place. »'
    reason: Jeu de mots lexical entre רְחֹבוֹת et הִרְחִיב.
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: Il partit de là
  rationale: Le verbe décrit le déplacement d’Isaac vers un autre lieu. Cette formulation est naturelle en français et n’ajoute pas de précision absente du texte.
- source_word: בְּאֵר אַחֶרֶת
  choice: un autre puits
  rationale: Équivalent direct et idiomatique du groupe nominal hébreu.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: Cette fois, on ne lui chercha pas querelle
  rationale: Le verbe ריב exprime la querelle ou la contestation. La tournure impersonnelle française rend naturellement le sujet indéfini pluriel du contexte, tandis que « cette fois » explicite sobrement le contraste narratif porté par la coordination.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: Il l’appela Rehoboth
  rationale: Cette formule de dénomination est naturelle en français; le pronom renvoie au puits.
- source_word: רְחֹבוֹת
  choice: Rehoboth
  rationale: Le nom propre est translittéré; sa relation avec l’idée d’espace est expliquée en note afin de conserver le jeu de mots.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: 'car il dit : « Maintenant, Yahweh nous a fait de la place »'
  rationale: « Faire de la place » exprime idiomatiquement le causatif de רחב et maintient le jeu lexical avec Rehoboth. כִּי introduit ici l’explication du nom et se rend naturellement par « car ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte source.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: et nous porterons du fruit dans le pays
  rationale: « Porter du fruit » conserve le sens concret et les résonances de fécondité de פרה, sans réduire l’expression à la seule prospérité matérielle. « Le pays » désigne ici le territoire où séjourne Isaac.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin; sa translittération le distingue d’un titre tout en préservant son caractère de nom propre.
- issue: Portée de וּפָרִינוּ
  choice: nous porterons du fruit
  alternative: nous nous multiplierons / nous prospérerons
  rationale: Le choix conserve l’image et l’ambivalence de פרה, qui peut évoquer la fécondité, l’accroissement et, dans ce contexte, la réussite dans le pays, sans trancher plus étroitement.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste accessible, le nom propre est translittéré, et le jeu de mots hébreu est signalé sans alourdir le corps du verset.
