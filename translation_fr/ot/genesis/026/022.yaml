    issue: « on ne lui chercha pas querelle »
    rationale: 'Le suffixe de עָלֶיהָ renvoie au puits : les protagonistes ne se querellèrent pas à son sujet. En français, chercher querelle « à un puits » suggère de lui chercher dispute, ce qui ne rend ni la construction ni le sens contextuel de ריב על.'
  - severity: low
    issue: Ajout de « Cette fois »
    rationale: Le contraste avec les puits précédents est narrativement compréhensible, mais « cette fois » n’est pas exprimé dans le verset. Le retirer permet une équivalence plus resserrée sans nuire à la fluidité.
