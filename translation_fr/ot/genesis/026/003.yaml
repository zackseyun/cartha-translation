source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: fr
  text: Reste dans ce pays[a] ; je serai avec toi et je te bénirai, car je te donnerai, à toi et à ta descendance[b], tous ces pays, et je confirmerai le serment[c] que j’ai prêté à Abraham, ton père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Séjourne dans ce pays ». Le verbe hébreu peut désigner le fait de résider quelque part à titre temporaire ou comme étranger.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « semence » ; le terme hébreu a ici un sens collectif.
    reason: lexical_alternative
  - marker: c
    text: Ou « j’établirai le serment » ou « j’accomplirai le serment ».
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: Reste
  rationale: Dans ce contexte, le verbe demande à Isaac de demeurer dans le pays plutôt que de descendre en Égypte. « Reste » est naturel en français moderne; la nuance de résidence temporaire ou étrangère est signalée en note.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: dans ce pays
  rationale: אֶרֶץ désigne ici le territoire où se trouve Isaac. « Pays » convient au cadre géographique et reste naturel, tandis que la reprise au pluriel demeure visible dans « tous ces pays ».
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: Je serai avec toi
  rationale: Cette formulation directe conserve sans développement la promesse de présence divine.
- source_word: וַאֲבָרְכֶךָ
  choice: et je te bénirai
  rationale: Le verbe poursuit la série des promesses divines; la répétition de « je » est idiomatique et claire en français.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le fondement de l’ordre et de la promesse, dans un registre digne mais courant.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: à toi et à ta descendance
  rationale: זֶרַע est un nom collectif. « Descendance » exprime naturellement en français la lignée promise, sans imposer un singulier individuel.
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: Le futur rend directement la promesse divine.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: tous ces pays
  rationale: Le pluriel désigne les différents territoires en vue et maintient le lien lexical avec « ce pays ».
- source_word: וַהֲקִמֹתִי
  choice: je confirmerai
  rationale: Le hiphil de קום appliqué à un serment peut exprimer le fait de le confirmer, de l’établir ou de l’accomplir. « Confirmerai » rend la validation durable d’un engagement déjà juré sans anticiper entièrement son accomplissement.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: le serment que j’ai prêté
  rationale: « Serment » conserve la précision et la solennité du nom hébreu; en français, on dit naturellement « prêter serment ».
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: à Abraham, ton père
  rationale: La formulation identifie Abraham comme le père d’Isaac et souligne la continuité de la promesse sans ajout interprétatif.
theological_decisions:
- issue: Rendre la confirmation du serment sans ajouter une terminologie technique de l’alliance
  choice: je confirmerai le serment que j’ai prêté à Abraham, ton père
  alternative: j’établirai / j’accomplirai le serment que j’ai prêté à Abraham, ton père
  rationale: Le texte parle du maintien effectif d’un serment déjà prêté. « Confirmerai » préserve cette portée sans introduire explicitement une notion technique de renouvellement d’alliance ni réduire le verbe au seul accomplissement final.
- issue: Préserver la valeur collective de זֶרַע
  choice: ta descendance
  alternative: ta semence / ta postérité
  rationale: Dans le contexte immédiat, la promesse vise collectivement la lignée d’Isaac. « Descendance » est clair et naturel, tandis que la traduction littérale est conservée en note afin de ne pas masquer la forme du terme hébreu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression hébraïque tout en employant des tournures françaises naturelles. Les notes préservent les nuances lexicales de résidence étrangère, de collectivité de la descendance et de confirmation ou accomplissement du serment.
