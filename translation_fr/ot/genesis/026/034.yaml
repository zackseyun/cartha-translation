  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: fr
  text: Quand Ésaü eut quarante ans, il prit pour femmes[a] Judith, fille de Beéri le Hittite, et Basmath, fille d’Élon le Hittite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il prit une femme : Judith… et Basmath… ». L’hébreu emploie le singulier « femme » avant de nommer deux femmes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עֵשָׂו בֶּן אַרְבָּעִים שָׁנָה
  choice: Quand Ésaü eut quarante ans
  rationale: La tournure hébraïque fixe un cadre temporel et emploie l’expression idiomatique « fils de quarante ans ». Cette formulation française naturelle conserve la transition narrative.
- source_word: וַיִּקַּח אִשָּׁה
  choice: il prit pour femmes
  rationale: Le texte porte littéralement le singulier « une femme », mais nomme ensuite deux femmes. Le pluriel rend clairement le sens matrimonial tout en signalant en note la discordance grammaticale de l’hébreu.
- source_word: יְהוּדִית
  choice: Judith
  rationale: Forme française traditionnelle et aisément reconnaissable du nom hébreu.
- source_word: בַּת
  choice: fille de
  rationale: Équivalent français naturel de la relation généalogique exprimée par l’état construit.
- source_word: בְּאֵרִי
  choice: Beéri
  rationale: Translittération française usuelle qui rend perceptible la succession vocalique du nom.
- source_word: הַחִתִּי
  choice: le Hittite
  rationale: Le gentilé hébreu est défini et se trouve en apposition aux noms de Beéri et d’Élon.
- source_word: בָּשְׂמַת
  choice: Basmath
  rationale: Forme française biblique traditionnelle du nom propre.
- source_word: אֵילֹן
  choice: Élon
  rationale: Translittération française usuelle du nom propre.
