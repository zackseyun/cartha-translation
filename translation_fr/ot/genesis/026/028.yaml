source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: fr
  text: 'Ils dirent : « Nous avons clairement vu que Yahweh a été avec toi. Nous avons donc dit : “Qu’il y ait, s’il te plaît, un serment[a] entre nous, entre toi et nous[b], et que nous concluions une alliance avec toi.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner un serment assorti d’une malédiction appelée sur celui qui le violerait.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « entre nous, entre nous et toi ».'
    reason: source_repetition
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le waw consécutif fait avancer le récit. Le passé simple convient au registre narratif français sans surinterpréter le lien temporel.
- source_word: רָאוֹ רָאִינוּ
  choice: Nous avons clairement vu
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation ; « clairement » rend cette insistance en français naturel.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: que Yahweh est avec toi
  rationale: Le parfait הָיָה décrit une présence constatée par ses effets et pertinente au moment où les interlocuteurs parlent. Le présent français exprime naturellement cette conclusion, sans nier la dimension passée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: וַנֹּאמֶר
  choice: Nous nous sommes donc dit
  rationale: « Donc » fait ressortir le lien logique entre leur constat et leur proposition ; la tournure pronominale est naturelle en français pour une délibération collective.
- source_word: תְּהִי נָא
  choice: Qu’il y ait, s’il te plaît
  rationale: Le jussif accompagné de נָא exprime une demande courtoise. Cette formulation en garde la nuance volitive.
- source_word: אָלָה
  choice: un serment
  rationale: Dans ce contexte d’accord formel, « serment » est clair et exact. La possible valeur imprécatoire du terme est conservée en note.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: entre nous, entre toi et nous
  rationale: La formulation garde la répétition solennelle de l’hébreu tout en adoptant un ordre idiomatique en français.
- source_word: וְנִכְרְתָה בְרִית
  choice: et concluons une alliance
  rationale: Littéralement, l’hébreu dit « couper une alliance ». « Conclure une alliance » rend cette expression consacrée de façon naturelle et digne en français.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: La préposition et le pronom singulier désignent directement Isaac.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » en conserve la fonction et distingue le nom divin d’un simple titre.
- issue: Portée temporelle de הָיָה עִמָּךְ
  choice: est avec toi
  alternative: était avec toi / a été avec toi
  rationale: Les interlocuteurs tirent des événements observés une conclusion qui demeure actuelle. Le présent français exprime bien cette pertinence, tandis que l’hébreu permet aussi une formulation orientée vers le passé.
translation_notes:
  register: Français international moderne, narratif et digne. Le verset conserve la répétition formelle de la proposition d’alliance sans reproduire une lourdeur excessive. Le tutoiement correspond à l’adresse singulière à Isaac.
