  to: 'Ils dirent : « Nous avons clairement vu que Yahweh a été avec toi. Nous avons donc dit : “Qu’il y ait, s’il te plaît, un serment[a] entre nous, entre toi et nous[b], et que nous concluions une alliance avec toi.” »'
