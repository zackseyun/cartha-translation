  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: fr
  text: que tu ne nous feras aucun mal[a], tout comme nous ne t’avons pas touché, ne t’avons fait que du bien et t’avons renvoyé en paix. Maintenant, tu es béni par Yahweh. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si tu nous fais du mal ». L’hébreu emploie littéralement « si », formule qui peut introduire ici le contenu du serment demandé à Isaac.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: que… ne… aucun
  rationale: Dans le contexte du serment demandé au verset précédent, אִם introduit vraisemblablement l’engagement exigé plutôt qu’une simple condition. La tournure française poursuit naturellement « Jure… que ».
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: tu ne nous feras aucun mal
  rationale: Cette formulation actuelle et idiomatique exprime clairement l’idée de causer du tort dans ce contexte de pacte de non-agression.
- source_word: לֹא נְגַעֲנוּךָ
  choice: nous ne t’avons pas touché
  rationale: Le sens concret de נגע est conservé, tout en signalant en note que le verbe peut ici évoquer le fait de faire du mal.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: nous n’avons fait que du bien à ton égard
  rationale: « Ne… que » rend l’insistance de רַק et produit une expression française naturelle sans atténuer leur affirmation.
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: nous t’avons renvoyé en paix
  rationale: « Renvoyé » conserve l’idée qu’ils l’ont fait partir, tandis que « en paix » maintient les dimensions relationnelle et sécuritaire de שָׁלוֹם.
- source_word: בְּרוּךְ יְהוָה
  choice: béni par Yahweh
  rationale: Le participe passif בָּרוּךְ est rendu directement par « béni », et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom divin personnel sans le remplacer par un titre.
- issue: Appréciation morale de la conduite d’Abimélek et de ses hommes
  choice: conserver leur affirmation sans la valider ni la corriger
  alternative: reformuler de façon à signaler leur expulsion antérieure comme hostile
  rationale: Le verset rapporte leur propre présentation des faits. La traduction préserve la tension narrative avec leur conduite antérieure sans ajouter de jugement absent de cette phrase.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le début en minuscule marque la continuité syntaxique avec le verset précédent. Les répétitions structurantes de leur plaidoyer sont maintenues, tandis que « ne… que » rend naturellement l’emphase hébraïque.
