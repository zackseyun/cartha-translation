  naturalness: Le français est naturel et convient à un registre narratif moderne. « Vinrent lui parler du puits » est idiomatique et conserve suffisamment l’idée de rapport ; la coordination en deux phrases est fluide.
  terminology: « Serviteurs », « puits », « creusé » et « de l’eau » sont des choix exacts et idiomatiques. Pour חפר, « creusé » est le rendu principal approprié ; « foré » peut être proposé comme possibilité contextuelle, mais ne doit pas recevoir une importance excessive. La note sur עבד doit être ancrée à « serviteurs ».
