base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: fr
  text: 'Ce jour-là[a], les serviteurs[b] d’Isaac vinrent lui parler du puits qu’ils avaient creusé. Ils lui dirent : « Nous avons trouvé de l’eau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce même jour-là », soulignant que ce rapport est arrivé le jour même des événements précédents.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « serviteurs » peut aussi désigner des esclaves ; ici, le contexte ne met pas particulièrement en avant cette nuance sociale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: La formule situe directement l’événement dans la continuité narrative. Cette tournure française naturelle conserve la référence au jour précis des événements précédents sans reproduire lourdement la formule hébraïque וַיְהִי.
- source_word: עַבְדֵי יִצְחָק
  choice: les serviteurs d’Isaac
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Ici, le récit présente surtout ces hommes comme des membres de la maison d’Isaac chargés de travaux; « serviteurs » convient au contexte, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: וַיַּגִּדוּ לוֹ
  choice: vinrent lui parler
  rationale: Le hiphil de נגד exprime l’action d’annoncer ou de rapporter. En combinaison avec וַיָּבֹאוּ, « vinrent lui parler » rend naturellement en français leur arrivée suivie de leur rapport, sans anticiper le contenu de la citation.
- source_word: עַל אֹדוֹת הַבְּאֵר
  choice: du puits
  rationale: La locution עַל אֹדוֹת signifie « au sujet de » ou « concernant ». Après « parler », le complément « du puits » est l’équivalent français le plus fluide.
- source_word: אֲשֶׁר חָפָרוּ
  choice: qu’ils avaient creusé
  rationale: Le plus-que-parfait explicite naturellement en français que le creusement précède le rapport, sans modifier la chronologie du texte.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Ils lui dirent
  rationale: Cette formulation garde l’introduction explicite du discours direct en hébreu tout en évitant une coordination française trop chargée.
- source_word: מָצָאנוּ מָיִם
  choice: Nous avons trouvé de l’eau
  rationale: Le passé composé exprime une découverte récente dont le résultat demeure pertinent. Le partitif « de l’eau » est requis par l’usage français et n’ajoute aucune indication de quantité.
theological_decisions: []
