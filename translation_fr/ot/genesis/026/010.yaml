  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: fr
  text: 'Abimélec dit : « Qu’est-ce que tu nous as fait là ? Quelqu’un du peuple aurait facilement pu coucher avec ta femme[a], et tu aurais fait retomber la culpabilité sur nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Peu s’en est fallu que quelqu’un du peuple couche avec ta femme. »'
    reason: La valeur de כִּמְעַט peut exprimer une éventualité facile à réaliser ou, plus littéralement, un acte qui a failli se produire.
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Qu’est-ce que tu nous as fait là ?
  rationale: La tournure exclamative avec « là » restitue מַה זֹּאת de façon naturelle en français, tandis que « nous » conserve l’objet collectif לָּנוּ.
- source_word: כִּמְעַט
  choice: aurait facilement pu
  rationale: Dans ce contexte, l’expression présente l’acte comme une éventualité qui a été évitée de peu. Cette formulation française exprime clairement le risque réel, tout en signalant en note la lecture plus littérale « peu s’en est fallu ».
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: coucher avec ta femme
  rationale: « Coucher avec » est l’équivalent français courant, clair et digne de l’idiome hébreu désignant des relations sexuelles.
- source_word: אַחַד הָעָם
  choice: quelqu’un du peuple
  rationale: Cette formulation conserve le caractère indéfini de אַחַד et le nom collectif הָעָם, sans préciser « un homme » au-delà de ce qu’énonce explicitement l’hébreu.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: et tu aurais fait retomber la culpabilité sur nous
  rationale: La formulation garde l’image d’une culpabilité amenée sur la collectivité et rend אָשָׁם comme une culpabilité objective, plutôt que comme un simple reproche social.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: Abimélek dit
  rationale: Le passé simple convient au récit français et restitue sobrement le wayyiqtol narratif sans surinterpréter le lien temporel.
theological_decisions:
- issue: Nature de אָשָׁם dans ce contexte
  choice: culpabilité
  alternative: faute ; tort
  rationale: Le terme désigne ici la responsabilité morale qui aurait pesé sur Abimélek et son peuple à cause d’un acte sexuel commis sans connaître le véritable statut de Rébecca. « Culpabilité » préserve cette portée morale et religieuse sans introduire explicitement le sens sacrificiel que le mot peut avoir ailleurs.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier. « Abimélek » suit une translittération française claire du nom hébreu.
