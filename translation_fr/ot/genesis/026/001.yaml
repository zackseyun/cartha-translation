  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: fr
  text: Il y eut une famine dans le pays, outre la première famine qui avait eu lieu au temps d’Abraham. Isaac se rendit auprès d’Abimélek, roi des Philistins, à Guérar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers Guérar ». En hébreu, la forme du nom Guérar comporte une terminaison qui peut indiquer explicitement un mouvement en direction de cette ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: Il y eut une famine dans le pays
  rationale: La formule narrative introduit une nouvelle circonstance. « Il y eut » est naturel et digne en français, tandis que « le pays » désigne ici la région concernée plutôt que la terre entière.
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: en plus de la première famine
  rationale: מִלְּבַד distingue cette famine de celle qui l’a précédée, et רִאשׁוֹן conserve ici son sens ordinal.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: qui avait eu lieu au temps d’Abraham
  rationale: Le plus-que-parfait situe clairement cette famine avant les événements racontés, et « au temps d’Abraham » rend idiomatiquement l’expression hébraïque.
- source_word: וַיֵּלֶךְ יִצְחָק אֶל אֲבִימֶּלֶךְ
  choice: Isaac se rendit donc auprès d’Abimélek
  rationale: Le verbe fait progresser le récit; « donc » exprime le lien contextuel avec la famine sans imposer une causalité trop forte. « Auprès de » convient au complément personnel introduit par אֶל.
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: roi des Philistins
  rationale: Cette formulation rend directement la chaîne construite et conserve la désignation ethnique traditionnelle en français.
- source_word: גְּרָרָה
  choice: à Guérar
  rationale: La forme porte le suffixe directionnel -ה, mais après « se rendit auprès d’Abimélek », « à Guérar » peut naturellement désigner soit le lieu où se trouve le roi, soit la destination; une note conserve explicitement l’autre analyse.
theological_decisions:
- issue: Désignation historique et ethnique פְּלִשְׁתִּים
  choice: Philistins
  alternative: peuple philistin
  rationale: Il s’agit d’une désignation ethno-politique ordinaire et non d’un titre théologique; la forme française conventionnelle est claire.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent les formes françaises usuelles « Abimélek » et « Guérar ». La note préserve la valeur directionnelle possible de גְּרָרָה sans alourdir le texte principal.
