  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: fr
  text: 'Les bergers de Guérar se disputèrent avec les bergers d’Isaac, en disant : « L’eau est à nous. » Isaac nomma le puits Ések[a], parce qu’ils s’étaient disputés avec lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Ések est lié au mot hébreu qui signifie « dispute » ou « contestation ».
    reason: Signale le jeu lexical entre le nom du puits et le verbe hébreu employé pour le conflit.
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: se querellèrent
  rationale: Le verbe ריב exprime ici une dispute au sujet du droit sur l’eau. « Se quereller » est naturel en français et conserve la dimension interpersonnelle du conflit.
- source_word: רֹעֵי גְרָר עִם רֹעֵי יִצְחָק
  choice: Les bergers de Guérar se querellèrent avec ceux d’Isaac
  rationale: « Bergers » rend directement רֹעִים dans ce contexte pastoral. La reprise par « ceux d’Isaac » évite une répétition lourde sans perdre le parallélisme ni l’identité des deux groupes.
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: 'en disant : « L’eau est à nous ! »'
  rationale: La proposition hébraïque, littéralement « à nous l’eau », formule une revendication de possession. « L’eau est à nous » la restitue clairement et avec la vigueur adaptée à la dispute.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: Isaac donna donc au puits le nom de
  rationale: L’expression hébraïque « appeler le nom du puits » est rendue idiomatiquement. Le sujet implicite est explicité par « Isaac » pour assurer la clarté en français; « donc » marque le lien narratif avec le conflit.
- source_word: עֵשֶׂק
  choice: Ések
  rationale: Le nom du puits est translittéré plutôt que traduit. Son rapport avec l’idée de dispute est expliqué en note afin de préserver le nom propre et le jeu lexical.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: parce qu’ils lui avaient cherché querelle
  rationale: Le verbe התעשק est apparenté au nom עֵשֶׂק. « Chercher querelle à quelqu’un » exprime naturellement le conflit dirigé contre Isaac et permet un écho sémantique avec « se querellèrent », même si le jeu sonore hébreu ne peut être entièrement reproduit.
theological_decisions:
- issue: Référent du suffixe singulier dans עִמּוֹ (« avec lui »)
  choice: « lui » renvoie à Isaac
  alternative: Comprendre le conflit comme visant seulement les bergers d’Isaac
  rationale: Le suffixe hébreu est masculin singulier et renvoie le plus naturellement à Isaac, propriétaire du camp et du puits dans le récit, tandis que les bergers sont au pluriel.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. « Guérar » et « Ések » suivent une translittération française usuelle; le marqueur [a] est placé immédiatement après le nom concerné.
