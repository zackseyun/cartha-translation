  yaml_path: translation/ot/genesis/026/014.yaml
  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: fr
  text: Il avait des troupeaux de petit bétail et de gros bétail, ainsi qu’une importante main-d’œuvre[a], et les Philistins l’enviaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un service ou travail abondant » ; l’expression peut désigner une importante main-d’œuvre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Il possédait
  rationale: La construction existentielle היה + ל exprime ici la possession. « Il possédait » convient naturellement à l’énumération de ses biens et de ses ressources.
- source_word: מִקְנֵה צֹאן
  choice: des troupeaux de petit bétail
  rationale: צֹאן désigne collectivement les ovins et les caprins; « petit bétail » préserve cette portée mieux que « moutons » seul.
- source_word: וּמִקְנֵה בָקָר
  choice: des troupeaux de gros bétail
  rationale: בָקָר désigne ici les bovins; l’expression française s’accorde avec le parallélisme entre petit et gros bétail.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: une main-d’œuvre nombreuse
  rationale: עֲבֻדָּה peut désigner le travail, le service ou, concrètement dans ce contexte économique, l’ensemble des travailleurs. Cette formulation reste plus proche de cette ambiguïté que « une grande maison » ou « beaucoup de serviteurs ».
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: se mirent à l’envier
  rationale: קנא exprime ici l’envie suscitée par la prospérité d’Isaac. La forme narrative française rend la progression du récit.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française courante de ce peuple.
