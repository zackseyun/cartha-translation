id: GEN.26.4
reference: Genesis 26:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: fr
  text: Je rendrai ta descendance aussi nombreuse que les étoiles du ciel et je donnerai à ta descendance tous ces pays. En ta descendance, toutes les nations de la terre seront bénies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Par ta descendance, toutes les nations de la terre se béniront. » Le verbe hébreu peut avoir un sens réflexif, bien que le sens passif convienne bien au contexte de la promesse d’alliance.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Je rendrai … aussi nombreuse
  rationale: Le hiphil de רבה exprime ici l’accroissement causé par Dieu. Cette tournure française naturelle s’accorde avec la comparaison introduite par כְּ.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: זֶרַע est un singulier collectif. « Descendance » en conserve la portée collective et convient aux trois occurrences du verset sans l’archaïsme de « semence ».
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: aussi nombreuse que les étoiles du ciel
  rationale: La comparaison est explicite. En français, « les étoiles du ciel » est naturel, digne et fidèle à l’image hébraïque; l’ajout de « nombreuse » explicite idiomatiquement la multiplication annoncée.
- source_word: וְנָתַתִּי
  choice: et je donnerai
  rationale: נתן signifie directement « donner »; ce choix garde la simplicité et la force de la promesse.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: tous ces pays
  rationale: Le pluriel אֲרָצוֹת désigne ici les territoires promis, tandis que הָאֵל est déictique. « Pays » est plus naturel en français moderne que « terres » dans cette formulation.
- source_word: וְהִתְבָּרֲכוּ
  choice: seront bénies
  rationale: Le hitpael peut recevoir une valeur passive dans cette formule patriarcale. La possibilité réflexive demeure réelle et est signalée en note.
- source_word: בְזַרְעֲךָ
  choice: En ta descendance
  rationale: « En » reproduit sobrement la préposition בְּ et évite de trancher entre une relation locative, instrumentale ou médiatrice.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: toutes les nations de la terre
  rationale: גּוֹיִם désigne les nations ou peuples; cette formulation française traditionnelle reste claire et exacte.
theological_decisions:
- issue: Sens de la formule וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  choice: En ta descendance, toutes les nations de la terre seront bénies
  alternative: Par ta descendance, toutes les nations de la terre se béniront / souhaiteront être bénies
  rationale: La lecture passive s’intègre bien au contexte de la promesse d’alliance, mais la morphologie hébraïque permet aussi une compréhension réflexive. La traduction principale conserve « en » afin de ne pas imposer une médiation plus précise que le texte, et la note maintient l’autre lecture.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le parallélisme de la promesse tout en évitant des formulations archaïques. Le futur simple restitue les actes divins annoncés.
