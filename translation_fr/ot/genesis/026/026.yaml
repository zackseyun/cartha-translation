  text: וַ/אֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖י/ו מִ/גְּרָ֑ר וַ/אֲחֻזַּת֙ מֵֽרֵעֵ֔/הוּ וּ/פִיכֹ֖ל שַׂר צְבָאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: fr
  text: Puis Abimélek partit de Guérar pour aller le trouver, accompagné d’Ahouzzath, son ami[a], et de Pikol, chef de son armée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son compagnon » ou « son associé ». Le terme hébreu peut désigner un ami personnel aussi bien qu’un compagnon ou associé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבִימֶלֶךְ
  choice: Puis Abimélek
  rationale: Le waw narratif est rendu par « Puis », qui marque naturellement la progression du récit. Le nom propre suit une translittération française courante.
- source_word: הָלַךְ אֵלָיו מִגְּרָר
  choice: partit de Guérar pour aller le trouver
  rationale: Cette formulation française naturelle conserve à la fois le point de départ exprimé par מִן, Guérar, et le mouvement vers Isaac exprimé par אֵלָיו, sans remplacer explicitement le pronom par son référent.
- source_word: וַאֲחֻזַּת מֵרֵעֵהוּ
  choice: accompagné d’Ahouzzath, son ami
  rationale: Le waw introduit ici une personne accompagnant Abimélek. מֵרֵעֵהוּ désigne son ami, compagnon ou proche associé; « son ami » est le sens lexical direct, tandis que l’ambiguïté liée à une éventuelle fonction de cour est signalée en note.
- source_word: וּפִיכֹל שַׂר צְבָאוֹ
  choice: et de Pikol, chef de son armée
  rationale: שַׂר désigne un chef ou commandant et צְבָאוֹ ses forces militaires. « chef de son armée » est clair, actuel et fidèle au contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La phrase explicite naturellement le trajet de Guérar vers Isaac et emploie « accompagné de » pour rendre la relation syntaxique des deux hommes avec Abimélek.
