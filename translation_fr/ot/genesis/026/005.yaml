source:
  edition: WLC
  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: fr
  text: parce qu’Abraham a obéi à ma voix[a] et a observé mes consignes[b], mes commandements, mes prescriptions et mes lois[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a écouté ma voix ». L’expression hébraïque « écouter la voix de quelqu’un » implique souvent une écoute obéissante.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut désigner une charge, une obligation ou ce qui est confié à quelqu’un pour qu’il le garde.
    reason: lexical_clarification
  - marker: c
    text: Ou « mes instructions » ou « mes enseignements ». Le mot hébreu torah peut désigner une loi, une instruction ou un enseignement selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: parce que
  rationale: Dans le contexte, le terme introduit la raison de la bénédiction annoncée. « Parce que » exprime directement et naturellement cette valeur causale.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: a écouté ma voix
  rationale: Cette tournure conserve l’image auditive de l’hébreu tout en évoquant, dans ce contexte, une écoute qui se traduit par l’obéissance.
- source_word: וַיִּשְׁמֹר
  choice: a observé
  rationale: Avec une série de termes à portée normative, « observer » rend naturellement l’idée de garder et de respecter fidèlement.
- source_word: מִשְׁמַרְתִּי
  choice: mes consignes
  rationale: Le mot désigne ce qui est confié à quelqu’un pour qu’il le garde ou l’accomplisse. « Mes consignes » reste compréhensible en français moderne et distingue ce terme des commandements, prescriptions et lois qui suivent.
- source_word: מִצְוֺתַי
  choice: mes commandements
  rationale: « Commandements » est la désignation française courante et transparente dans un contexte d’obéissance à Dieu.
- source_word: חֻקּוֹתַי
  choice: mes prescriptions
  rationale: « Prescriptions » exprime le caractère normatif du terme et permet de le distinguer des commandements et des lois.
- source_word: וְתוֹרֹתָי
  choice: et mes lois
  rationale: Dans cette accumulation de termes normatifs, « lois » communique clairement la portée juridique de תּוֹרָה, tout en laissant en note l’autre sens important d’« instructions » ou d’« enseignements ».
theological_decisions:
- issue: Accumulation de catégories normatives avant le Sinaï
  choice: 'Conserver quatre termes distincts : « consignes, commandements, prescriptions et lois »'
  alternative: Réduire l’énumération à une formule générale telle que « toutes mes exigences »
  rationale: L’hébreu souligne l’obéissance complète d’Abraham par une accumulation volontaire de termes proches. La traduction maintient cette insistance et ne tranche pas la question théologique du rapport entre cette obéissance antérieure au Sinaï et les catégories ultérieures de la Torah.
translation_notes:
  register: Français international moderne, clair et digne. L’image « écouter ma voix » est conservée sans devenir obscure; « observer » maintient un registre biblique courant sans archaïsme. L’énumération juridique reste délibérément ample.
