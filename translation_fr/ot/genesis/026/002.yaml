  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: fr
  text: 'Alors Yahweh lui apparut et dit : « Ne descends pas en Égypte. Habite dans le pays que je t’indiquerai.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « dans le pays que je te dirai ».'
    reason: La formulation hébraïque emploie le verbe אָמַר, « dire » ; le texte principal adopte « indiquer » pour exprimer naturellement en français la direction promise, tout en signalant la formulation plus littérale.
lexical_decisions:
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה exprime ici une manifestation perceptible de Dieu. « Apparut » est naturel en français et ne précise pas indûment la manière de cette manifestation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אַל תֵּרֵד
  choice: Ne descends pas
  rationale: אַל suivi de l’inaccompli formule une interdiction. Le verbe « descendre » préserve aussi l’expression géographique hébraïque employée pour un déplacement vers l’Égypte.
- source_word: מִצְרָיְמָה
  choice: en Égypte
  rationale: Le suffixe directionnel indique un mouvement vers l’Égypte ; « en Égypte » est la formulation française idiomatique après « descendre ».
- source_word: שְׁכֹן
  choice: Habite
  rationale: L’impératif de שכן demande à Isaac de demeurer ou de résider dans un lieu. « Habite » est courant, digne et plus précis ici que le simple « reste ».
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ désigne ici le territoire où Isaac doit résider, et non la terre entière. « Pays » convient naturellement à ce contexte.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: que je t’indiquerai
  rationale: La tournure hébraïque emploie littéralement le verbe « dire », mais elle annonce ici une directive divine concernant le pays. « Que je t’indiquerai » rend clairement cette fonction en français tout en conservant la portée future de l’inaccompli.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Nature de l’apparition divine
  choice: lui apparut
  alternative: se révéla à lui
  rationale: « Apparut » suit sobrement le niphal de ראה sans définir la forme ou le mode de la manifestation, que le verset ne précise pas.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La syntaxe brève conserve la succession des actions et la force directe des deux impératifs.
