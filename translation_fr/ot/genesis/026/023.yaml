lexical_decisions:
- source_word: וַיַּעַל
  choice: il monta
  rationale: Le verbe עלה signifie couramment « monter ». Dans ce récit de déplacement, « il monta » conserve à la fois l’idiome hébreu et la possible indication d’un changement d’altitude, tout en restant naturel en français.
- source_word: מִשָּׁם
  choice: De là
  rationale: Cette expression indique simplement le point de départ. « De là » est concis, idiomatique et fidèle à l’hébreu.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-Shéba
  rationale: Le nom de lieu est translittéré plutôt que traduit. « Beer-Shéba » est une forme française courante et reconnaissable.
