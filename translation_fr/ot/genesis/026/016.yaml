base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: fr
  text: 'Alors Abimélek dit à Isaac : « Éloigne-toi de nous, car tu es devenu beaucoup plus puissant que nous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu es devenu très puissant par rapport à nous. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors … dit » en restitue naturellement la progression en français moderne.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: אֶל יִצְחָק
  choice: à Isaac
  rationale: La préposition introduit le destinataire des paroles ; « Isaac » est la forme française consacrée du nom.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: Éloigne-toi de nous
  rationale: L’impératif לֵךְ, complété par מֵעִמָּנוּ, commande à Isaac de partir de leur voisinage. Cette formulation française est naturelle et conserve explicitement l’idée de séparation.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’ordre. « Car » convient au discours direct et garde un registre digne sans être archaïque.
- source_word: עָצַמְתָּ
  choice: tu es devenu … plus puissant
  rationale: Le verbe exprime ici le fait d’être devenu fort ou puissant. « Puissant » convient à la situation globale d’Isaac, dont les biens et la maisonnée se sont considérablement accrus.
- source_word: מִמֶּנּוּ
  choice: que nous
  rationale: La préposition מִן a ici une valeur comparative après עָצַם ; le français exprime naturellement cette comparaison par « plus … que nous ».
- source_word: מְאֹד
  choice: beaucoup
  rationale: L’adverbe intensifie la comparaison ; « beaucoup plus puissant » en rend clairement la force.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La traduction conserve la comparaison explicite du texte hébreu sans l’interpréter comme « trop puissant pour nous ». Le marqueur de note est placé après l’expression concernée.
