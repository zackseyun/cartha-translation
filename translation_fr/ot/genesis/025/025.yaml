  source_fidelity: 'Le texte rend fidèlement les éléments hébreux : l’ordre de naissance (« Le premier »), la sortie lors de la naissance, l’apparence אדמוני (« roux »), l’insistance de כֻּלּוֹ (« tout entier »), l’image comparative d’un manteau de poils, et la formule de dénomination. « Roux » maintient utilement l’ambiguïté entre une apparence rougeâtre et une coloration liée à la pilosité, sans la résoudre artificiellement.'
