id: GEN.25.25
reference: Genesis 25:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א הָ/רִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖/וֹ כְּ/אַדֶּ֣רֶת שֵׂעָ֑ר וַ/יִּקְרְא֥וּ שְׁמ֖/וֹ עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: fr
  text: Le premier sortit, roux[a], tout entier comme un manteau de poils[b], et on l’appela Ésaü.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rougeâtre ». L’adjectif hébreu décrit une apparence tirant sur le rouge.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « comme un manteau de poils » ; on peut aussi comprendre « comme un vêtement en poil ». L’hébreu conserve une comparaison avec un manteau et des poils.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe courant « sortir » décrit concrètement la venue au monde et convient naturellement au récit d’un accouchement.
- source_word: הָרִאשׁוֹן
  choice: le premier
  rationale: Désigne le premier des jumeaux selon l’ordre de naissance, de manière concise et idiomatique.
- source_word: אַדְמוֹנִי
  choice: roux
  rationale: L’adjectif indique une apparence tirant sur le rouge. « Roux » reste naturel en français et ne précise pas abusivement s’il s’agit du teint ou de la pilosité.
- source_word: כֻּלּוֹ
  choice: tout entier
  rationale: Conserve l’insistance du texte sur l’ensemble de son corps.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: comme un manteau de poils
  rationale: Préserve la comparaison frappante avec une אַדֶּרֶת, manteau ou ample vêtement, et maintient la mention explicite des poils sans réduire l’image à une simple paraphrase.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: on l’appela
  rationale: Rend naturellement en français la formule hébraïque de dénomination, dont le sujet pluriel n’est pas identifié.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Emploie la forme française traditionnelle et largement reconnue du nom biblique.
