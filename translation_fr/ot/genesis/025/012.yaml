  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: fr
  text: Voici la descendance d’Ismaël[a], fils d’Abraham, qu’Agar l’Égyptienne, esclave de Sara[b], donna à Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et voici la lignée d’Ismaël ». Le mot hébreu תּוֹלְדוֹת (toledot) sert régulièrement de titre dans la Genèse et peut, selon le contexte, désigner la descendance, la lignée ou l’histoire familiale.
    reason: lexical_alternative
  - marker: b
    text: Ou « servante de Sara ». Le mot hébreu שִׁפְחָה désigne une femme esclave ou servante ; « esclave » rend ici plus explicitement sa condition servile.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Cette formule introduit naturellement en français une nouvelle section généalogique. Le וְ de liaison n’a pas besoin d’être rendu séparément dans ce titre, mais la variante « Et voici » reste possible.
- source_word: תֹּלְדֹת
  choice: la descendance
  rationale: Dans ce contexte, le terme désigne principalement la lignée issue d’Ismaël. « Descendance » est naturel en français tout en conservant la fonction généalogique de la formule récurrente de la Genèse.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: בֶּן אַבְרָהָם
  choice: fils d’Abraham
  rationale: Rend directement et naturellement la relation exprimée par l’état construit hébreu.
- source_word: אֲשֶׁר יָלְדָה
  choice: qu’… avait mis au monde
  rationale: Le verbe a pour sujet Agar et pour complément Ismaël. Le plus-que-parfait convient au retour narratif vers une naissance antérieure, et « mettre au monde » est actuel et explicite.
- source_word: הָגָר הַמִּצְרִית
  choice: Agar l’Égyptienne
  rationale: La forme française du nom et le gentilé rendent l’apposition hébraïque avec concision.
- source_word: שִׁפְחַת שָׂרָה
  choice: esclave de Sara
  rationale: שִׁפְחָה désigne une femme en condition servile. « Esclave » préserve clairement ce statut juridique et social, que « servante » pourrait atténuer en français moderne.
- source_word: לְאַבְרָהָם
  choice: pour Abraham
  rationale: Avec le verbe de naissance, la préposition לְ présente Abraham comme le père auquel Agar donne cet enfant; « pour Abraham » conserve cette relation sans transformer la tournure en voix passive.
