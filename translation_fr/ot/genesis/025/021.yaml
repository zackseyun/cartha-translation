  source_fidelity: 'Le sens général est bien rendu : Isaac prie Yahweh à cause de la stérilité de Rébecca, Yahweh répond favorablement, puis Rébecca devient enceinte. Toutefois, « Yahweh accueillit sa prière » transforme le complément hébreu direct (« Yahweh se laissa implorer par lui / l’exauça ») en objet « sa prière ». « Yahweh l’exauça » est à la fois plus direct, idiomatique et fidèle.'
  naturalness: Le français est naturel, clair et de registre biblique moderne. « Devint enceinte » convient bien. « Pour sa femme » est idiomatique dans ce contexte; la note explicite utilement l’ambiguïté de la locution hébraïque.
  terminology: « Yahweh », « stérile » et « Rébecca » sont appropriés en français international. La formulation de la note sur le jeu verbal doit éviter « se laisse fléchir », qui peut suggérer indûment que Dieu cède sous pression; le passif hébreu peut être expliqué par « se laisse implorer » et son sens contextuel, « exauça Isaac ».
