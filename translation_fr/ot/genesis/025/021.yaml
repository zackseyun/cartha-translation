base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: fr
  text: Isaac pria Yahweh pour sa femme[a], car elle était stérile. Yahweh l’exauça[b], et Rébecca, sa femme, devint enceinte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en face de sa femme »; l’expression hébraïque peut indiquer qu’Isaac priait en sa présence ou en sa faveur.
    reason: lexical_alternative
  - marker: b
    text: 'Le même radical hébreu est repris dans les deux propositions : Isaac « supplie », et Yahweh « se laisse supplier » par lui, c’est-à-dire l’exauce.'
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: pria / accueillit sa prière
  rationale: Le même radical hébreu est employé dans les deux propositions, d’abord à l’actif puis au passif, créant un écho délibéré entre la supplication d’Isaac et la réponse favorable de Yahweh. La formulation française reste naturelle tout en signalant cet écho dans une note.
- source_word: לַיהוָה / יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin יהוה, qui conserve ici le nom propre présent dans le texte hébreu.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: pour sa femme
  rationale: Dans ce contexte de prière, la locution indique que la prière est faite en faveur de sa femme. Son sens spatial plus littéral, « en face de sa femme », est conservé en note comme possibilité réelle.
- source_word: עֲקָרָה
  choice: stérile
  rationale: Terme français courant et précis pour désigner l’incapacité à concevoir; il exprime la condition plutôt que le seul fait de ne pas avoir d’enfant.
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Expression française naturelle et immédiatement compréhensible pour l’entrée dans la grossesse.
- source_word: רִבְקָה
  choice: Rébecca
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu רִבְקָה.
theological_decisions:
- issue: Rendre la répétition du radical עתר sans suggérer une causalité mécanique
  choice: Isaac « pria » et Yahweh « accueillit sa prière »
  alternative: Isaac « supplia » Yahweh, et Yahweh « se laissa fléchir par lui »
  rationale: La formulation retenue exprime une réponse divine favorable sans laisser entendre que la prière contraint mécaniquement Dieu; la note préserve la construction passive et le jeu lexical hébreux.
- issue: Rendre le nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie explicitement le tétragramme; « Yahweh » en conserve la valeur de nom propre sans importer une substitution confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. « Stérile » convient au registre narratif biblique sans être archaïque; « devint enceinte » est plus courant que « conçut ». Les deux notes maintiennent l’ambiguïté spatiale de לְנֹכַח et l’écho lexical de עתר.
