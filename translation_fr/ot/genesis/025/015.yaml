lexical_decisions:
- source_word: חֲדַד
  choice: Hadad
  rationale: Nom propre translittéré d’après les consonnes du texte hébreu massorétique.
- source_word: תֵימָא
  choice: Téma
  rationale: Nom propre translittéré sous une forme naturelle en français; l’accent rend clairement la voyelle initiale longue, et l’aleph final n’exige pas de « h ».
- source_word: יְטוּר
  choice: Yetour
  rationale: Nom propre translittéré en suivant la prononciation hébraïque, avec « y » pour le yod initial et « ou » pour la voyelle longue.
- source_word: נָפִישׁ
  choice: Nafish
  rationale: Nom propre translittéré; « f » rend naturellement en français la spirantisation du pé, et « sh » représente le shin de façon accessible.
- source_word: קֵדְמָה
  choice: Qédéma
  rationale: Nom propre translittéré; « q » distingue le qof hébreu, tandis que les accents facilitent une prononciation française proche de la forme source.
- source_word: וְ / וָ
  choice: et
  rationale: Les conjonctions préfixées relient les noms; en français naturel, des virgules séparent la liste et « et » précède le dernier élément.
