id: GEN.25.17
reference: Genesis 25:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: fr
  text: 'Voici quelle fut la durée de la vie d’Ismaël : cent trente-sept ans. Il rendit son dernier souffle[a] et mourut, puis fut réuni aux siens[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « expira ». Le verbe hébreu employé ici est distinct du verbe suivant, « mourut » ; les deux sont donc conservés dans la traduction.
    reason: lexical_alternative
  - marker: b
    text: « Être réuni aux siens » est une expression hébraïque employée dans les notices de décès. Elle peut évoquer la réunion avec ses ancêtres, l’ensevelissement parmi les membres de sa parenté, ou les deux.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: Voici quelle fut la durée de la vie d’Ismaël
  rationale: Cette formulation française naturelle introduit le récapitulatif de la durée de vie, tout en rendant l’expression hébraïque littérale « les années de la vie d’Ismaël ».
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: cent trente-sept ans
  rationale: Le nombre hébreu est regroupé selon l’usage courant du français, sans modifier sa valeur exacte.
- source_word: וַיִּגְוַע
  choice: Il rendit son dernier souffle
  rationale: Cette expression rend le sens de גוע dans une notice de décès et permet de le distinguer du verbe suivant, « mourut ».
- source_word: וַיָּמָת
  choice: et mourut
  rationale: Le second verbe de mort est conservé afin de ne pas effacer le redoublement intentionnel de l’hébreu.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: puis fut réuni aux siens
  rationale: « Réuni aux siens » conserve l’image de la formule funéraire hébraïque dans un français digne et compréhensible, sans en limiter le sens à l’ensevelissement.
theological_decisions:
- issue: Sens de la formule funéraire « fut réuni aux siens »
  choice: Conserver une formulation idiomatique ouverte
  alternative: Préciser soit qu’il fut enseveli auprès de sa parenté, soit qu’il rejoignit ses ancêtres après la mort
  rationale: L’hébreu peut évoquer l’ensevelissement avec les membres du groupe familial, la réunion aux ancêtres après la mort, ou les deux. La traduction ne tranche pas ce que le texte laisse ouvert.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Le redoublement des verbes de mort est volontairement maintenu, et la formule finale reste ouverte sur le plan théologique.
