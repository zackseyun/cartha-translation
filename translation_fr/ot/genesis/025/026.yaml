base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: fr
  text: Après cela, son frère sortit, la main tenant le talon d’Ésaü ; on l’appela donc Jacob[a]. Isaac avait soixante ans lorsqu’ils naquirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, le nom Jacob (Yaʿaqov) fait écho au mot ʿaqev, « talon » ; plus loin, le récit l’associe aussi à l’idée de supplanter (27.36).
    reason: Le jeu de mots reliant le nom au talon n’est pas perceptible dans la forme française « Jacob ».
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette expression marque simplement la succession des deux naissances et se rend naturellement ainsi en français moderne.
- source_word: יָצָא
  choice: sortit
  rationale: Le verbe décrit littéralement la sortie de l’enfant et conserve ici l’image vive de l’hébreu, plutôt que de l’expliciter par « naquit ».
- source_word: אָחִיו
  choice: son frère
  rationale: L’hébreu dit seulement « son frère » ; le fait qu’il s’agit de jumeaux ressort déjà du contexte.
- source_word: וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו
  choice: et sa main tenait le talon d’Ésaü
  rationale: Cette formulation suit la construction hébraïque et décrit l’action concomitante sans ajouter de précision. « Tenait » est naturel et exprime l’idée de saisir ou de retenir.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: On l’appela donc
  rationale: Le singulier hébreu ne nomme pas explicitement celui qui donne le nom. Le pronom indéfini français préserve cette absence d’identification, tandis que « donc » rend le lien narratif avec le talon saisi.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: La forme française traditionnelle du nom est conservée ; une note signale le jeu de mots hébreu, qui n’est pas perceptible en français.
- source_word: בֶּן שִׁשִּׁים שָׁנָה
  choice: avait soixante ans
  rationale: C’est l’équivalent idiomatique français de la formule hébraïque exprimant l’âge.
- source_word: בְּלֶדֶת אֹתָם
  choice: lorsqu’ils naquirent
  rationale: La tournure exprime le moment de leur naissance sans introduire un sujet maternel qui n’est pas formulé dans ce membre de phrase.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en évitant les calques peu naturels. Le point sépare clairement la sortie et la nomination, tandis que « donc » en conserve le lien explicatif.
