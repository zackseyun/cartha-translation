  text: וַֽ/יִּגְדְּלוּ֙ הַ/נְּעָרִ֔ים וַ/יְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְ/יַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: fr
  text: Lorsque les garçons eurent grandi, Ésaü devint un habile chasseur, un homme des champs[a], tandis que Jacob était un homme tranquille[b], habitant sous des tentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi désigner un homme vivant dans les espaces ouverts.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi signifier « intègre », « irréprochable », « simple » ou « innocent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: Lorsque les garçons eurent grandi
  rationale: Dans ce contexte, le verbe décrit le passage des deux fils à l’âge adulte. La tournure française marque naturellement l’antériorité par rapport aux descriptions qui suivent.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: un chasseur habile
  rationale: L’expression désigne quelqu’un qui connaît et maîtrise la chasse; cette formulation est claire et naturelle en français.
- source_word: אִישׁ שָׂדֶה
  choice: un homme de plein air
  rationale: Littéralement «un homme des champs», l’expression caractérise ici la vie d’Ésaü dans les espaces ouverts et contraste avec celle de Jacob sous les tentes. «De plein air» évite de présenter à tort Ésaü comme un cultivateur.
- source_word: אִישׁ תָּם
  choice: un homme tranquille
  rationale: תָּם peut évoquer la simplicité, l’intégrité, l’innocence ou un caractère paisible. Dans le contraste immédiat avec le chasseur vivant au-dehors, «tranquille» rend avec retenue un trait de caractère et de mode de vie, sans imposer un jugement moral.
- source_word: יֹשֵׁב אֹהָלִים
  choice: qui vivait sous les tentes
  rationale: Le participe exprime une manière de vivre habituelle. «Vivre sous les tentes» est une expression française naturelle qui conserve le contraste avec la vie de plein air d’Ésaü.
theological_decisions:
- issue: Sens de תָּם appliqué à Jacob
  choice: un homme tranquille
  alternative: un homme intègre, irréprochable, simple ou innocent
  rationale: Le terme hébreu permet une nuance morale, mais le contexte immédiat oppose surtout deux tempéraments et deux modes de vie. Le texte principal retient donc une formulation non surchargée, tandis que la note conserve l’éventail sémantique et la tension possible.
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve le parallélisme entre Ésaü et Jacob ainsi que le contraste entre les espaces ouverts et les tentes; les notes signalent les deux principales nuances lexicales sans alourdir le texte.
