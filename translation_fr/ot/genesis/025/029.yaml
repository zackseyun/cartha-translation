  text: וַ/יָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַ/יָּבֹ֥א עֵשָׂ֛ו מִן הַ/שָּׂדֶ֖ה וְ/ה֥וּא עָיֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: fr
  text: Jacob faisait cuire un ragoût[a], et Ésaü arriva du champ, épuisé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faisait bouillir un mets ». Le verbe hébreu désigne précisément une cuisson par ébullition.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: faisait cuire
  rationale: Le verbe זיד désigne ici une cuisson par ébullition. « Faisait cuire » exprime naturellement en français l’action en cours, tandis que la note conserve la précision du mode de cuisson.
- source_word: נָזִיד
  choice: un ragoût
  rationale: נָזִיד désigne un mets cuit, notamment un ragoût. Ce terme est actuel, concret et naturel en français.
- source_word: וַיָּבֹא
  choice: arriva
  rationale: בוא signifie venir ou arriver. « Arriva » rend clairement le déplacement d’Ésaü depuis l’extérieur sans ajouter explicitement l’idée d’un retour.
- source_word: מִן הַשָּׂדֶה
  choice: des champs
  rationale: שׂדה peut désigner un champ ou l’espace rural et ouvert. L’expression française « arriver des champs » convient au cadre et reste proche de l’image hébraïque.
- source_word: עָיֵף
  choice: épuisé
  rationale: עָיֵף exprime une grande fatigue, voire l’épuisement. « Épuisé » rend l’intensité qui prépare la demande d’Ésaü au verset suivant.
- source_word: וְהוּא
  choice: épuisé
  rationale: La proposition hébraïque « et lui, [était] fatigué » est rendue par une apposition adjectivale naturelle en français, sans perte de son attribution explicite à Ésaü.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Quand » relie naturellement les deux actions successives dans la scène; l’apposition « épuisé » évite une coordination lourde tout en conservant l’état d’Ésaü. Aucun marqueur temporel équivalent à « or » ou « alors » n’a été ajouté en tête de verset.
