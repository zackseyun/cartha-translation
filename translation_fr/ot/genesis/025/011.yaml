  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַ/יְבָ֥רֶךְ אֱלֹהִ֖ים אֶת יִצְחָ֣ק בְּנ֑/וֹ וַ/יֵּ֣שֶׁב יִצְחָ֔ק עִם בְּאֵ֥ר לַחַ֖י רֹאִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: fr
  text: Après la mort d’Abraham, Dieu bénit Isaac, son fils, et Isaac habita près de Béer-Lahaï-Roï[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Béer-Lahaï-Roï est le nom d’un puits, déjà mentionné en Genèse 16.14.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם
  choice: Après la mort d’Abraham
  rationale: La formule narrative situe simplement l’événement suivant dans le temps. En français moderne, « Après la mort d’Abraham » restitue naturellement cette transition sans le tour lourd « il arriva que ».
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: Dieu bénit
  rationale: Le verbe ברך signifie ici « bénir », et אֱלֹהִים désigne Dieu dans ce récit.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: Isaac, son fils
  rationale: L’apposition conserve l’ordre hébreu et identifie explicitement Isaac comme le fils d’Abraham, tout en restant idiomatique en français.
- source_word: וַיֵּשֶׁב
  choice: habita
  rationale: ישב exprime ici le fait de demeurer ou de résider. « Habita » convient au résumé narratif et garde un registre digne et courant.
- source_word: עִם
  choice: près de
  rationale: Devant ce nom de lieu, עִם exprime la proximité plutôt que l’accompagnement; « près de » évite le trompeur « avec ».
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Béer-Lahaï-Roï
  rationale: Le nom propre déjà introduit en Genèse 16.14 est translittéré, avec des accents qui guident la prononciation française.
theological_decisions:
- issue: Sens de אֱלֹהִים dans ce récit
  choice: Dieu
  alternative: la divinité
  rationale: Le contexte désigne sans ambiguïté le Dieu qui a conduit et béni Abraham; « Dieu » est la formulation française normale et n’ajoute aucune précision confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La transition hébraïque est rendue sans archaïsme; le nom du puits est translittéré conformément à son introduction antérieure.
