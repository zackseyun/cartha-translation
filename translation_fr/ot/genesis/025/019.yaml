  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: fr
  text: 'Voici les générations d’Isaac[a], fils d’Abraham : Abraham engendra Isaac.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’histoire » ou « la lignée familiale » d’Isaac. Le mot hébreu toledot est un terme récurrent qui sert de titre aux grandes sections de la Genèse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule introduit une nouvelle section. « Voici » rend naturellement en français le démonstratif hébreu et sa fonction présentative, sans ajouter une valeur temporelle absente du texte.
- source_word: תּוֹלְדֹת
  choice: descendance
  rationale: Dans la Genèse, ce terme récurrent structure le livre et peut désigner ce qui procède d’une personne, notamment sa lignée et le récit qui s’y rapporte. « Descendance » conserve ici la dimension généalogique, tandis qu’une note signale l’étendue possible du terme.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: בֶּן אַבְרָהָם
  choice: fils d’Abraham
  rationale: Rendu direct du groupe construit hébreu, qui maintient l’identification généalogique explicite.
- source_word: הוֹלִיד
  choice: engendra
  rationale: Le hifil de ילד exprime ici le fait d’engendrer. « Engendra » est précis dans une formule généalogique et demeure intelligible en français actuel soutenu.
- source_word: אֶת יִצְחָק
  choice: Isaac
  rationale: La particule אֶת marque le complément d’objet direct et ne se traduit pas séparément en français.
theological_decisions:
- issue: Rendu de la formule structurante תולדות dans la Genèse
  choice: « descendance », avec une note indiquant « histoire » ou « lignée »
  alternative: « générations », « histoire familiale » ou « lignée »
  rationale: Le mot hébreu sert de titre récurrent et possède une portée plus large qu’une simple liste de descendants. « Descendance » est naturel dans ce contexte généalogique, tandis que la note préserve l’ambiguïté littéraire sans réduire la section à la seule biographie ni à la seule généalogie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe brève conserve la forme de titre du verset. « Engendra » relève du registre généalogique traditionnel sans être obscur; « Voici » évite d’ajouter un marqueur temporel.
