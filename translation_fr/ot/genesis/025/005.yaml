lexical_decisions:
- source_word: וַיִּתֵּן
  choice: donna
  rationale: Le verbe נתן signifie fondamentalement « donner » ; dans cette forme narrative, le passé simple convient au récit biblique en français.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct sans équivalent lexical autonome en français ; sa fonction est rendue par la syntaxe.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tout ce qui lui appartenait
  rationale: Cette formulation naturelle demeure proche du sens littéral, « tout ce qui était à lui », et exprime l’ensemble des biens d’Abraham.
- source_word: לְיִצְחָק
  choice: à Isaac
  rationale: La préposition לְ indique ici le destinataire du don.
