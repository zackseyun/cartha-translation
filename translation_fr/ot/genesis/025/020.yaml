  text: וַ/יְהִ֤י יִצְחָק֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/קַחְתּ֣/וֹ אֶת רִבְקָ֗ה בַּת בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י מִ/פַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָ/אֲרַמִּ֖י ל֥/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: fr
  text: Isaac avait quarante ans lorsqu’il prit pour femme Rébecca[a], fille de Betouel l’Araméen, originaire de Paddân-Aram, et sœur de Laban l’Araméen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus couramment : « lorsqu’il épousa Rébecca ». L’hébreu dit littéralement : « lorsqu’il prit Rébecca… pour femme ».'
    reason: lexical_alternative
  - marker: b
    text: « Araméen » est plus précis que l’ancienne traduction traditionnelle « Syrien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: Isaac avait quarante ans
  rationale: La formule hébraïque exprime idiomatiquement l’âge d’Isaac au moment de son mariage. Cette tournure est naturelle en français moderne.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: lorsqu’il prit pour femme
  rationale: Cette formulation conserve l’image du verbe לקח, « prendre », tout en rendant clairement la formule matrimoniale complète.
- source_word: רִבְקָה
  choice: Rébecca
  rationale: Forme française traditionnelle, courante et immédiatement reconnaissable du nom hébreu.
- source_word: בַּת בְּתוּאֵל
  choice: fille de Betouel
  rationale: Rend directement l’expression généalogique hébraïque dans un français naturel.
- source_word: הָאֲרַמִּי
  choice: l’Araméen
  rationale: « Araméen » correspond précisément à l’ethnonyme hébreu, contrairement au rendu traditionnel plus ancien « Syrien ».
- source_word: מִפַּדַּן אֲרָם
  choice: originaire de Paddân-Aram
  rationale: La préposition מן indique ici la provenance de Betouel. « Originaire de » évite une liaison française momentanément ambiguë avec Rébecca tout en conservant le toponyme.
- source_word: אֲחוֹת לָבָן
  choice: sœur de Laban
  rationale: Rend simplement et fidèlement la seconde indication de parenté.
