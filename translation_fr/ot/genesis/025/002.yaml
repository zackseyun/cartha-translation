  yaml_path: translation/ot/genesis/025/002.yaml
  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: fr
  text: Elle lui donna pour fils Zimran, Yoqshân, Medân, Madiân, Yishbaq et Shouah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Elle donna pour fils
  rationale: Le qal wayyiqtol à la 3e personne du féminin singulier rapporte l'enfantement de Qetoura. Cette formulation française est naturelle dans une généalogie et n'ajoute rien au nombre ni au statut des enfants.
- source_word: לוֹ
  choice: lui
  rationale: La préposition ל avec suffixe désigne ici le père. « Elle lui donna pour fils » exprime clairement et naturellement ce rapport en français.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Particule introduisant chacun des compléments d'objet directs ; la syntaxe française suffit à en rendre la fonction.
- source_word: זִמְרָן
  choice: Zimran
  rationale: Transcription française transparente du nom propre hébreu.
- source_word: יָקְשָׁן
  choice: Yoqshân
  rationale: Transcription qui représente le yod initial par Y, le qof par q et la voyelle longue finale par â, conformément à une forme française lisible et proche de l'hébreu.
- source_word: מְדָן
  choice: Medân
  rationale: Transcription française du nom propre, distinguant sa voyelle initiale de celle de Madiân.
- source_word: מִדְיָן
  choice: Madiân
  rationale: Forme française biblique bien établie, immédiatement reconnaissable, pour le nom מִדְיָן.
- source_word: יִשְׁבָּק
  choice: Yishbaq
  rationale: 'Transcription proche de l''hébreu : Y pour le yod initial, sh pour שׁ et q pour ק.'
- source_word: שׁוּחַ
  choice: Shouah
  rationale: Forme française usuelle et lisible, avec « ou » pour /u/ et « sh » pour שׁ.
theological_decisions: []
