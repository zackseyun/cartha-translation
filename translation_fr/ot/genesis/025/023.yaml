base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: fr
  text: 'Yahweh lui dit : « Deux nations sont dans ton ventre, et deux peuples seront séparés dès tes entrailles. Un peuple sera plus fort que l’autre, et l’aîné servira le cadet[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le plus grand servira le plus petit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver sa fonction de nom propre dans le texte hébreu.
- source_word: שְׁנֵי גיים
  choice: deux nations
  rationale: גּוֹי désigne ici des groupes ethniques appelés à devenir des nations; ce choix maintient aussi le parallélisme avec « deux peuples ».
- source_word: בְּבִטְנֵךְ
  choice: dans ton ventre
  rationale: Dans le contexte de la grossesse, « ventre » est naturel en français moderne et rend directement le lieu où se trouvent les jumeaux.
- source_word: שְׁנֵי לְאֻמִּים
  choice: deux peuples
  rationale: לְאֹם désigne un peuple ou une communauté ethnique; « peuples » préserve la variation poétique avec « nations ».
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: se sépareront au sortir de ton sein
  rationale: Cette formulation française rend le mouvement de séparation provenant de l’intérieur de Rébecca, tout en conservant la valeur pronominale ou passive du verbe hébreu.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: Un peuple sera plus fort que l’autre
  rationale: La construction oppose les deux peuples et le verbe exprime la force ou la supériorité; le comparatif est naturel en français.
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: l’aîné servira le cadet
  rationale: Dans le contexte de jumeaux, רַב et צָעִיר peuvent désigner respectivement l’aîné et le plus jeune; « cadet » offre un contraste idiomatique et digne avec « aîné ».
theological_decisions:
- issue: Portée de וְרַב יַעֲבֹד צָעִיר
  choice: l’aîné servira le cadet
  alternative: le plus grand servira le plus petit
  rationale: Le contexte immédiat favorise une lecture selon l’ordre de naissance, mais les adjectifs hébreux peuvent aussi exprimer la grandeur et la petitesse en rang ou en importance. La note conserve cette ambiguïté sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le parallélisme « nations / peuples » est conservé, ainsi que le contraste prophétique entre les deux descendants.
