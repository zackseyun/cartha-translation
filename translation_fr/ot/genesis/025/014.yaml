lexical_decisions:
- source_word: מִשְׁמָע
  choice: Mishma
  rationale: Nom propre dans une liste généalogique; il est translittéré plutôt que traduit. La forme française « Mishma » est naturelle et courante, tandis que « Mishmah » rend plus explicitement la consonne hébraïque finale.
- source_word: דוּמָה
  choice: Douma
  rationale: Nom propre translittéré selon les conventions françaises, où « ou » représente naturellement le son /u/. La consonne finale ה n'est pas reproduite par un h dans la forme principale.
- source_word: מַשָּׂא
  choice: Massa
  rationale: Le contexte généalogique indique un nom propre, malgré le rapprochement possible avec le nom commun hébreu signifiant « charge » ou « oracle ». La translittération évite de transformer indûment le nom en terme commun.
