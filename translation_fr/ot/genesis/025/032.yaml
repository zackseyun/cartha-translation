  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָ/מ֑וּת וְ/לָ/מָּה זֶּ֥ה לִ֖/י בְּכֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: fr
  text: 'Ésaü dit : « Regarde, je suis sur le point de mourir ! À quoi me sert donc ce droit d’aînesse ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol narratif de אמר se rend naturellement par le passé simple en français, sans qu’il soit nécessaire d’expliciter la conjonction.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הִנֵּה
  choice: Regarde
  rationale: L’interjection attire vivement l’attention sur ce qu’Ésaü affirme; « Regarde » en conserve la force dans un français moderne, contrairement à l’archaïque « Voici » dans cet emploi.
- source_word: אָנֹכִי
  choice: je
  rationale: Le pronom indépendant porte une certaine emphase, mais le français naturel l’exprime suffisamment ici par « je », renforcé par l’interjection et la ponctuation.
- source_word: הוֹלֵךְ לָמוּת
  choice: suis sur le point de mourir
  rationale: La construction הלך avec l’infinitif présente la mort comme imminente; cette formulation idiomatique évite de suggérer un déplacement physique.
- source_word: וְלָמָּה זֶּה לִי
  choice: À quoi me sert donc
  rationale: La question rhétorique demande quelle utilité ce droit peut avoir pour Ésaü dans la situation qu’il décrit. « donc » rend le lien conclusif avec l’affirmation précédente.
- source_word: בְּכֹרָה
  choice: droit d’aînesse
  rationale: Expression française consacrée pour le statut et les prérogatives attachés au fils premier-né.
theological_decisions:
- issue: Portée de l’affirmation d’Ésaü concernant sa mort
  choice: Présenter sa mort comme imminente selon ses propres paroles, sans préciser s’il parle littéralement ou de manière hyperbolique.
  alternative: « Je vais mourir », formulation qui peut également exprimer une destinée générale ou une exagération liée à sa faim.
  rationale: L’hébreu rapporte l’affirmation d’Ésaü sans trancher entre danger de mort réel et plainte exagérée. La traduction préserve cette tension narrative.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve le ton brusque et rhétorique d’Ésaü sans archaïsme ni ajout interprétatif.
