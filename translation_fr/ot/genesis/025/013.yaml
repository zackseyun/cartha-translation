  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׁמָעֵ֔אל בִּ/שְׁמֹתָ֖/ם לְ/תוֹלְדֹתָ֑/ם בְּכֹ֤ר יִשְׁמָעֵאל֙ נְבָיֹ֔ת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: fr
  text: 'Voici les noms des fils d’Ismaël, selon leurs noms et leurs lignées[a] : le premier-né d’Ismaël était Nebayoth, puis Qédar, Adbéel et Mibsam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs générations » ou « selon leurs lignes de descendance ». Le terme hébreu désigne ici des générations ou des lignes de descendance dans un cadre généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement une liste en français moderne; la continuité portée par וְ est rendue par le contexte plutôt que par un « Et » peu idiomatique ici.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: les noms des fils d’Ismaël
  rationale: Rend directement la chaîne construite et conserve le style généalogique.
- source_word: בִּשְׁמֹתָם לְתוֹלְדֹתָם
  choice: chacun selon son nom et sa lignée
  rationale: Formulation française intelligible qui conserve les deux éléments hébreux, les noms et l’appartenance généalogique, sans réduire תוֹלְדוֹת à une simple génération chronologique.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: le premier-né d’Ismaël
  rationale: Rend formellement le rapport de filiation et indique que Nebayoth est le fils aîné.
- source_word: נְבָיֹת
  choice: Nebayoth
  rationale: Translittération française courante qui distingue clairement le nom propre.
- source_word: קֵדָר
  choice: Qédar
  rationale: Translittération adaptée aux conventions phonétiques et bibliques françaises.
- source_word: אַדְבְּאֵל
  choice: Adbéel
  rationale: Translittération française lisible, proche des consonnes et des voyelles du texte hébreu.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Translittération directe et usuelle en français.
- source_word: וְקֵדָר וְאַדְבְּאֵל וּמִבְשָׂם
  choice: puis Qédar, Adbéel et Mibsam
  rationale: « Puis » clarifie que la liste se poursuit après l’identification du premier-né, tandis que la coordination française évite une répétition lourde de « et ».
