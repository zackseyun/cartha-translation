  text: 'These are the days of the years of Abraham’s life that he lived: one hundred seventy-five years[a].'
translation:
  language: fr
  text: 'Voici la durée de la vie d’Abraham : cent soixante-quinze ans[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Voici les jours des années de la vie d’Abraham qu’il vécut : cent ans, soixante-dix ans et cinq ans. »'
