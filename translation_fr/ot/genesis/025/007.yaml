lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français le récapitulatif qui suit; la conjonction hébraïque n’a pas besoin d’être rendue séparément.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם אֲשֶׁר חָי
  choice: la durée de la vie d’Abraham
  rationale: Littéralement, l’hébreu parle des « jours des années de la vie d’Abraham qu’il vécut ». Cette formule récapitule sa durée de vie; la traduction choisie en communique le sens avec naturel, tandis que la note conserve la forme hébraïque.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: cent soixante-quinze ans
  rationale: L’hébreu additionne 100, 70 et 5; le français exprime naturellement le total ainsi.
