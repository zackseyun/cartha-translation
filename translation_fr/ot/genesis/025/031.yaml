  text: וַ/יֹּ֖אמֶר יַעֲקֹ֑ב מִכְרָ֥/ה כַ/יּ֛וֹם אֶת בְּכֹֽרָתְ/ךָ֖ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/031.yaml
  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: fr
  text: 'Jacob dit : « Vends-moi aujourd’hui ton droit d’aînesse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vends-moi ton droit d’aînesse dès aujourd’hui » ou « en ce jour », ce qui souligne le caractère immédiat et contraignant de la transaction.'
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit ; le passé simple convient au registre narratif français, sans rendre mécaniquement le waw par « et ».
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle et courante du nom personnel.
- source_word: מִכְרָה
  choice: Vends
  rationale: Impératif direct du verbe מכר, « vendre ». Le hé paragogique n’exige pas ici de rendu français distinct.
- source_word: כַיּוֹם
  choice: aujourd’hui
  rationale: Rendu naturel de l’expression, qui souligne ici le caractère immédiat de la transaction ; la nuance possible « dès aujourd’hui » est signalée en note.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Particule introduisant le complément d’objet direct défini, sans équivalent lexical autonome en français.
- source_word: בְּכֹרָתְךָ
  choice: ton droit d’aînesse
  rationale: L’expression désigne les droits et privilèges attachés au statut de premier-né ; « droit d’aînesse » est le terme français établi et précis.
- source_word: לִי
  choice: -moi
  rationale: Le pronom marque le bénéficiaire ou destinataire de la vente. La construction française naturelle est « vends-moi ».
