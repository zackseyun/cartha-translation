  source_fidelity: La séquence « expira et mourut » rend bien la distinction entre וַיִּגְוַע et וַיָּמָת. En revanche, « après une heureuse vieillesse » place la mort après la vieillesse, alors que בְּ indique la circonstance ou l’état dans lequel Abraham mourut. « Rassasié » rend plus directement שָׂבֵעַ que « comblé », sans ajouter « de jours » absent de l’hébreu. La formule « fut réuni aux siens » préserve convenablement l’ambiguïté de וַיֵּאָסֶף אֶל־עַמָּיו.
  naturalness: « Dans une heureuse vieillesse » est une formulation française sobre et littéraire, naturelle dans ce registre scripturaire. La coordination « et » reflète mieux la succession coordonnée du texte que « Puis », sans alourdir la phrase.
  terminology: « Rassasié » conserve le sens de plénitude/satiété de שָׂבֵעַ sans interpréter l’objet de cette satiété. « Aux siens » est un équivalent français idiomatique et suffisamment ouvert pour « à son peuple / à ses gens ».
