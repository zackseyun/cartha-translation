  rationale: La révision corrige la relation exprimée par la préposition בְּ, en remplaçant « après » par « dans ». Elle emploie « rassasié », rendu plus proche de שָׂבֵעַ et non interprétatif, et ajuste la note correspondante. La formule finale et sa note conservent l’ambiguïté du texte concernant le fait d’être réuni à son peuple.
