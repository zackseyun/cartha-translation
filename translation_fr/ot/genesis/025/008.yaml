  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: fr
  text: Abraham expira et mourut dans une heureuse vieillesse, âgé et rassasié[a], et il fut réuni aux siens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comblé » ou « satisfait ». L’hébreu dit littéralement « âgé et rassasié », sans préciser « de jours ».
    reason: lexical_alternative
  - marker: b
    text: « Fut réuni aux siens » est une formule hébraïque traditionnelle liée à la mort. Elle peut évoquer la réunion avec les membres décédés de sa famille, mais n’en précise pas les modalités.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: expira
  rationale: Le verbe גוע décrit ici le dernier souffle. « Expira » est concis, naturel dans un récit de décès et reste distinct du verbe suivant, « mourut ».
- source_word: וַיָּמָת
  choice: mourut
  rationale: מות est le verbe ordinaire signifiant mourir. La traduction directe évite tout euphémisme.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: après une heureuse vieillesse
  rationale: Cette formulation française rend l’état favorable évoqué par « une bonne vieillesse » sans produire le tour peu naturel « dans une bonne vieillesse ».
- source_word: זָקֵן
  choice: âgé
  rationale: Le qualificatif est conservé séparément afin de reproduire l’accumulation descriptive de l’hébreu.
- source_word: וְשָׂבֵעַ
  choice: et comblé
  rationale: שָׂבֵעַ signifie « rassasié, comblé, satisfait ». « Comblé » reste intelligible sans ajouter « de jours », absent de l’hébreu, tout en suggérant une vie arrivée à sa plénitude.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: Puis il fut réuni aux siens
  rationale: La tournure passive conserve la formule hébraïque de décès et son ambiguïté, tandis que « aux siens » exprime naturellement en français le lien collectif et familial de עַמָּיו.
- source_word: עַמָּיו
  choice: aux siens
  rationale: « Les siens » garde une portée familiale et collective sans réduire le sens aux seuls ancêtres ni à un groupe ethnique.
theological_decisions:
- issue: Sens de « il fut réuni aux siens »
  choice: Conserver la formule traditionnelle de décès sans en préciser le mécanisme.
  alternative: L’interpréter explicitement soit comme une mise au tombeau familial, soit comme une réunion consciente avec les ancêtres après la mort.
  rationale: Le texte peut évoquer la réunion avec les proches décédés, mais il ne définit pas précisément la nature de cette réunion. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « expira et mourut » ainsi que l’enchaînement « âgé et comblé » conservent l’accumulation intentionnelle de l’hébreu. « Puis » allège la coordination répétée sans modifier la succession narrative.
