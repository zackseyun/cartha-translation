base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: fr
  text: Ils habitèrent de Havila à Shur, qui se trouve en face de l’Égypte quand on va vers Assur[a]. Il s’établit en face de tous ses frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Assur peut aussi être rendu par « l’Assyrie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Il s’établit en opposition à tous ses frères » ; littéralement, la dernière proposition peut aussi se comprendre comme « il tomba devant tous ses frères ». L’expression hébraïque est difficile et peut indiquer une situation géographique ou une relation hostile.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: Ils habitèrent
  rationale: Le qal au pluriel de שׁכן désigne le fait d’habiter ou de s’établir. « Habitèrent » convient à la description de l’étendue du territoire sans suggérer nécessairement une installation initiale.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: depuis Havila jusqu’à Shour
  rationale: Cette formule indique les deux limites de la région habitée par les descendants d’Ismaël.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: qui se trouve en face de l’Égypte
  rationale: עַל־פְּנֵי signifie littéralement « devant la face de » et peut, dans une indication géographique, se rendre par « en face de », sans préciser une direction que l’hébreu n’explicite pas.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: quand on va vers Assour
  rationale: La construction exprime un déplacement en direction d’Assour. La translittération maintient le nom propre sans imposer l’identification plus interprétative avec l’Assyrie.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Il s’établit en face de tous ses frères
  rationale: Le singulier renvoie vraisemblablement à Ismaël comme représentant de sa descendance. « S’établit en face de » conserve la dimension spatiale et l’ambiguïté possible de l’idiome, plutôt que d’affirmer explicitement une hostilité.
theological_decisions:
- issue: Sens de l’idiome עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Il s’établit en face de tous ses frères
  alternative: Il s’établit en opposition à tous ses frères / Il tomba devant tous ses frères
  rationale: Le rapprochement avec Genèse 16.12 peut suggérer une relation conflictuelle, mais la formulation hébraïque peut aussi décrire une position géographique. Le texte principal préserve cette ambiguïté, tandis que la note signale les autres compréhensions possibles.
translation_notes:
  register: Français international moderne, naturel et digne. Les noms propres suivent des formes françaises transparentes. La répétition « en face de » est conservée parce qu’elle reflète celle de l’hébreu et relie les deux indications géographiques, tout en maintenant l’ambiguïté du dernier membre.
