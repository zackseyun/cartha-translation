base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: fr
  text: Les fils de Madian furent Épha, Épher, Hanok[a], Abida et Eldaa. Tous ceux-là étaient fils de Ketura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement « Hénok » dans certaines traductions françaises.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Les fils de Madian
  rationale: Le pluriel construit de בֵּן désigne précisément les fils dans cette généalogie. « Madian » est la forme française consacrée du nom propre.
- source_word: עֵיפָה
  choice: Épha
  rationale: Translittération française usuelle de ce nom propre hébreu.
- source_word: וָעֵפֶר
  choice: Épher
  rationale: Forme française qui représente naturellement le nom hébreu עֵפֶר.
- source_word: וַחֲנֹךְ
  choice: Hanok[a]
  rationale: Cette forme suit de près la prononciation du nom hébreu חֲנֹךְ et le distingue clairement de sa forme française traditionnelle « Hénok ».
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Translittération simple et naturelle du nom hébreu.
- source_word: וְאֶלְדָּעָה
  choice: Eldaa
  rationale: Translittération française lisible du nom propre, sans ajouter un h final qui ne se prononcerait pas en français.
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Cette expression reprend collectivement les hommes qui viennent d’être nommés et restitue la valeur récapitulative de l’hébreu.
- source_word: בְּנֵי קְטוּרָה
  choice: étaient fils de Ketura
  rationale: La répétition de « fils » conserve la formule généalogique hébraïque. « Ketura » est une translittération française claire du nom קְטוּרָה.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure généalogique et la répétition de « fils » sont conservées, tandis que les copules nécessaires en français sont explicitées. Le marqueur de note est placé après Hanok, le nom auquel la variante se rapporte.
