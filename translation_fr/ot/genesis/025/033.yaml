  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: fr
  text: 'Jacob dit : « Prête-moi serment aujourd’hui[a]. » Ésaü lui prêta serment et vendit son droit d’aînesse à Jacob[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce jour même » ou « dès aujourd’hui ».'
    reason: lexical_alternative
  - marker: b
    text: Le droit d’aînesse comprenait le statut et les prérogatives qui revenaient au fils premier-né.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: Jure-le-moi
  rationale: L’impératif exprime l’exigence d’un serment prêté à Jacob. En français naturel, le pronom « le » reprend implicitement l’engagement demandé dans le contexte.
- source_word: כַּיּוֹם
  choice: aujourd’hui
  rationale: L’expression temporelle signifie « aujourd’hui / ce jour même » et souligne que l’engagement doit prendre effet sans délai.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: Ésaü le lui jura
  rationale: Le sujet implicite est Ésaü d’après le contexte. Cette formulation conserve le lien verbal avec l’ordre de Jacob et rend explicitement les référents pour éviter une ambiguïté artificielle en français.
- source_word: וַיִּמְכֹּר
  choice: vendit
  rationale: Le verbe מכר désigne clairement une vente et conserve la force transactionnelle de l’acte.
- source_word: בְּכֹרָתוֹ
  choice: son droit de fils premier-né
  rationale: בכורה désigne le statut et les prérogatives attachés à la qualité de premier-né. Cette expression française est plus immédiatement compréhensible que « droit d’aînesse » pour un lectorat international.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: La préposition indique ici le bénéficiaire de la vente.
theological_decisions:
- issue: Nature du transfert de la בְּכֹרָה d’Ésaü
  choice: vendit à Jacob son droit de fils premier-né
  alternative: vendit à Jacob son droit d’aînesse
  rationale: Le texte présente une transaction concrète portant sur le statut et les prérogatives du premier-né, sans préciser ici toutes ses conséquences ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe narrative reste concise. Les noms des deux protagonistes sont explicités là où les pronoms hébreux deviendraient inutilement ambigus en français.
