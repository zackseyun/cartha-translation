  source_fidelity: 'Le sens fondamental est rendu correctement : Jacob exige un serment immédiat, Ésaü le prête, puis vend à Jacob sa prérogative de premier-né. La révision conserve la succession narrative et la portée transactionnelle de מכר.'
  naturalness: « Jure-le-moi » et « Ésaü le lui jura » sont compréhensibles, mais leur double pronom est lourd et l’antécédent de « le » n’est pas exprimé dans le texte source. « Prête-moi serment » / « lui prêta serment » est plus idiomatique, clair et d’un registre narratif digne en français moderne.
  terminology: « Droit d’aînesse » est le terme français usuel et précis pour בְּכֹרָה dans ce contexte. La note culturelle en explicite utilement le contenu sans surinterpréter le verset.
