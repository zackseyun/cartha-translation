  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: fr
  text: Yoqshan engendra Saba et Dedân. Les fils de Dedân furent Ashourim[a], Letoushim et Léoumim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peut-être des noms de clans, transcrits aussi « Assourim », « Lethoushim » et « Leoumim ».
    reason: Préserve la possibilité que les noms désignent des groupes plutôt que des fils individuels et présente les formes concurrentes comme des translittérations, non comme des variantes du texte hébreu.
lexical_decisions:
- source_word: יָקְשָׁן
  choice: Yoqshan
  rationale: Nom propre translittéré selon une forme française moderne qui distingue la consonne initiale hébraïque et rend שׁ par « sh ».
- source_word: יָלַד
  choice: engendra
  rationale: Dans cette généalogie, le verbe exprime la paternité ou la descendance masculine; « engendra » est concis, précis et demeure courant dans le registre généalogique biblique.
- source_word: שְׁבָא
  choice: Saba
  rationale: Forme française conventionnelle de ce nom propre biblique.
- source_word: דְּדָן
  choice: Dedân
  rationale: Translittération française conventionnelle du nom propre.
- source_word: בְנֵי
  choice: les fils de
  rationale: Reproduit directement le masculin pluriel hébreu; dans ce contexte, les noms peuvent aussi représenter des descendants ou des clans, possibilité signalée en note.
- source_word: הָיוּ
  choice: furent
  rationale: Rend simplement la copule hébraïque qui introduit la liste, dans un style généalogique naturel.
- source_word: אַשּׁוּרִם
  choice: Ashourim
  rationale: Translittération d'un nom probablement ethnique ou clanique, sans lui imposer une traduction interprétative.
- source_word: לְטוּשִׁים
  choice: Letoushim
  rationale: Translittération française d'un nom de groupe dont l'étymologie n'est pas assez sûre pour être traduite.
- source_word: לְאֻמִּים
  choice: Léoumim
  rationale: Le terme fonctionne ici comme un nom propre de groupe; il est donc translittéré plutôt que rendu par un nom commun tel que « peuples ».
