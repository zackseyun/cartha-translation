  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: fr
  text: 'Le champ qu’Abraham avait acheté aux fils de Heth : c’est là qu’Abraham fut enterré, ainsi que Sara, sa femme[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux Hittites » pour « aux fils de Heth ». L’expression hébraïque, littéralement familiale ou ethnique, peut désigner le peuple hittite.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Là fut enterré Abraham, et Sara sa femme » ; en hébreu, le verbe au singulier précède Abraham, puis Sara est ajoutée par coordination.'
    reason: source_structure
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: Le nom défini désigne le terrain funéraire déjà mentionné; « le champ » est direct et naturel en français.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif introduit la proposition qui précise « le champ ».
- source_word: קָנָה
  choice: avait acheté
  rationale: Dans le contexte d’une transaction foncière, « acheter » exprime clairement le sens commercial; le plus-que-parfait situe naturellement l’achat avant l’ensevelissement.
- source_word: מֵאֵת
  choice: aux
  rationale: Avec « acheter », le français emploie naturellement « acheter quelque chose à quelqu’un » pour indiquer le vendeur.
- source_word: בְּנֵי חֵת
  choice: fils de Heth
  rationale: Cette traduction conserve l’expression familiale et ethnique littérale ainsi que le lien avec le nom propre Heth; « Hittites » reste indiqué en note.
- source_word: שָׁמָּה
  choice: c’est là
  rationale: Cette tournure locative reprend clairement le champ comme lieu de sépulture et rend naturellement la structure thématique de l’hébreu.
- source_word: קֻבַּר
  choice: furent enterrés
  rationale: Le passif signifie « être enterré ». Le pluriel français rend explicite que l’ensevelissement concerne Abraham et Sara, bien que le verbe hébreu soit morphologiquement singulier avant le sujet composé.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: et sa femme Sara
  rationale: Cette formulation est idiomatique en français tout en conservant les deux éléments, le nom de Sara et sa relation à Abraham.
