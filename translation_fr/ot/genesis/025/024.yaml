  text: When her days to give birth were fulfilled, behold, there were twins in her womb.
translation:
  language: fr
  text: Quand le moment où elle devait accoucher arriva, voici qu’il y avait des jumeaux dans son ventre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת
  choice: Quand le moment où elle devait accoucher arriva
  rationale: L’expression hébraïque dit littéralement que « ses jours pour enfanter furent remplis ». Cette formulation française naturelle exprime l’achèvement du temps de la grossesse sans reproduire un idiome qui semblerait artificiel.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: « Voici que » conserve la fonction du marqueur discursif, qui attire l’attention sur le fait significatif et quelque peu surprenant qui suit, dans un registre actuel et digne.
- source_word: תוֹמִם
  choice: des jumeaux
  rationale: Le nom pluriel désigne directement des jumeaux ; c’est l’équivalent français précis et courant.
- source_word: בְּבִטְנָהּ
  choice: dans son ventre
  rationale: בטן désigne ici le ventre maternel. « Dans son ventre » est naturel en français et correspond au point de vue narratif à l’approche immédiate de l’accouchement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « le moment où elle devait accoucher arriva » privilégie la clarté naturelle tout en conservant l’idée hébraïque d’un temps arrivé à son terme ; « voici que » maintient l’emphase du récit.
