  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Isaac et Ismaël, fils d’Abraham, l’ensevelissent dans la grotte, située dans le champ d’Éphron. Toutefois, la relative finale hébraïque qualifie grammaticalement le « champ » (שָׂדֶה), non Éphron ou Tsohar; la formulation actuelle laisse ce rattachement ambigu. La désignation « le Hittite » qualifie Éphron dans cette construction et doit également être rendue sans ambiguïté.'
  naturalness: Le français est fluide et d’un registre narratif approprié. Une légère réorganisation rend la chaîne généalogique et la précision topographique plus nettes. « Macpéla » et « Éphron » sont les graphies françaises bibliques usuelles et favorisent l’intercompréhension.
  terminology: « Grotte », « champ », « Hittite » et « en face de » sont des équivalents justes. « En face de » préserve prudemment la portée géographique de עַל־פְּנֵי sans introduire une direction cardinale.
  issues:
  - severity: medium
    issue: Antécédent ambigu de « qui se trouve en face de Mamré »
    rationale: En hébreu, אֲשֶׁר est au singulier et reprend le champ (שָׂדֶה). Dans la phrase française, la relative suit « le Hittite » et peut se lire comme qualifiant une personne. Il convient d’expliciter que le champ est situé en face de Mamré.
  - severity: medium
    issue: Portée ambiguë de « le Hittite »
    rationale: « Éfron, fils de Tsohar le Hittite » peut en français faire de Tsohar le Hittite. Dans le texte hébreu, הַחִתִּי désigne Éphron; l’ordre doit l’indiquer clairement.
  - severity: low
    issue: Graphies des noms non conformes aux usages français bibliques les plus répandus
    rationale: « Macpéla » et « Éphron » sont préférables à « Makpéla » et « Éfron » dans une traduction française internationale, tout en restant des transcriptions fidèles.
  revised_text: Ses fils, Isaac et Ismaël, l’enterrèrent dans la grotte de Macpéla, située dans le champ d’Éphron le Hittite, fils de Tsohar, en face de Mamré.[a]
