- from: Ses fils Isaac et Ismaël l’enterrèrent dans la grotte de Makpéla, dans le champ d’Éfron, fils de Tsohar le Hittite, qui se trouve en face de Mamré.[a]
  to: Ses fils, Isaac et Ismaël, l’enterrèrent dans la grotte de Macpéla, située dans le champ d’Éphron le Hittite, fils de Tsohar, en face de Mamré.[a]
  rationale: La révision explicite le rattachement de la précision topographique au champ, place « le Hittite » immédiatement après Éphron afin d’en lever l’ambiguïté, et adopte les graphies françaises bibliques usuelles des noms. La note conserve les possibilités sémantiques pertinentes de l’expression hébraïque.
