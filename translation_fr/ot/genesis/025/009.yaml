  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: fr
  text: Ses fils, Isaac et Ismaël, l’enterrèrent dans la grotte de Macpéla, située dans le champ d’Éphron le Hittite, fils de Tsohar, en face de Mamré.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant Mamré » ou « face à Mamré ». L’expression hébraïque peut désigner un lieu situé devant un point de repère ou en face de lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: l’enterrèrent
  rationale: Le wayyiqtol de קבר poursuit le récit par une action passée. Le pronom objet renvoie à Abraham, mentionné au verset précédent.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: Ses fils Isaac et Ismaël
  rationale: Cette formulation française naturelle conserve l’apposition et indique clairement que les deux hommes sont les fils d’Abraham.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: dans la grotte de Makpéla
  rationale: Dans le contexte d’un ensevelissement, « dans » exprime naturellement le lieu où le corps est déposé. Makpéla est conservé comme nom propre translittéré.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: dans le champ d’Éfron
  rationale: Le second אֶל précise l’emplacement de la grotte; la répétition de « dans » est claire et naturelle en français.
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: fils de Tsohar le Hittite
  rationale: La filiation et l’appartenance ethnique sont rendues directement, avec les formes françaises usuelles des noms.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: qui se trouve en face de Mamré
  rationale: L’expression géographique עַל־פְּנֵי peut désigner ce qui est devant, face à ou vis-à-vis d’un repère. « En face de » préserve cette valeur sans imposer une orientation cardinale.
