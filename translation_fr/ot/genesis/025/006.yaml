source:
  edition: WLC
  text: וְ/לִ/בְנֵ֤י הַ/פִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְ/אַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽ/יְשַׁלְּחֵ֞/ם מֵ/עַ֨ל יִצְחָ֤ק בְּנ/וֹ֙ בְּ/עוֹדֶ֣/נּוּ חַ֔י קֵ֖דְמָ/ה אֶל אֶ֥רֶץ קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: fr
  text: Mais Abraham fit des présents aux fils de ses concubines et, alors qu’il était encore en vie, il les envoya loin de son fils Isaac, vers l’est, au pays de l’Orient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « dans la région de l’est ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Mais … aux fils de
  rationale: Dans le contexte, la conjonction introduit un contraste avec Isaac, qui vient d’être désigné comme héritier. « Mais » rend cette valeur contextuelle, tandis que « aux fils de » conserve la relation exprimée par la préposition.
- source_word: הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: ses concubines
  rationale: « Concubines » est le terme français usuel pour des femmes ayant un statut conjugal reconnu mais secondaire. Le possessif rend naturellement la construction hébraïque qui les rattache à Abraham.
- source_word: נָתַן ... מַתָּנֹת
  choice: fit des présents
  rationale: Cette formulation française naturelle conserve le sens concret du verbe et du nom hébreux dans le contexte de la transmission des biens.
- source_word: וַיְשַׁלְּחֵם
  choice: il les envoya
  rationale: Le verbe indique ici qu’Abraham les fit partir. La notion de séparation est précisée par « loin de son fils Isaac ».
- source_word: מֵעַל יִצְחָק בְּנוֹ
  choice: loin de son fils Isaac
  rationale: מֵעַל marque ici l’éloignement et la séparation d’avec Isaac. « Loin de » exprime cette nuance sans ajouter l’idée plus forte d’une expulsion.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: alors qu’il était encore en vie
  rationale: La formulation indique clairement qu’Abraham prit cette mesure avant sa mort et reste naturelle en français moderne.
- source_word: קֵדְמָה
  choice: vers l’est
  rationale: La forme directionnelle hébraïque indique un mouvement en direction de l’est.
- source_word: אֶל אֶרֶץ קֶדֶם
  choice: au pays de l’Orient
  rationale: Cette traduction préserve l’expression géographique hébraïque tout en restant intelligible et digne en français. Une formulation plus idiomatique est signalée en note.
theological_decisions:
- issue: Distinction entre Isaac et les fils des concubines
  choice: Décrire le don de présents et leur éloignement sans qualifier explicitement l’acte de bannissement ou de déshéritement
  alternative: Dire qu’Abraham les chassa ou les déshérita
  rationale: Le contexte établit une distinction successorale, mais ce verset dit seulement qu’Abraham leur donna des présents et les envoya loin d’Isaac. La traduction ne doit pas renforcer cette action au-delà du texte.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. « Fit des présents » convient au contexte patrimonial; « cadeaux » aurait une tonalité plus courante. La répétition « vers l’est, au pays de l’Orient » est conservée parce qu’elle reflète les deux expressions distinctes du texte hébreu.
