  yaml_path: translation/ot/genesis/025/001.yaml
  text: Abraham took another wife[a], and her name was Keturah.
translation:
  language: fr
  text: Abraham prit une autre femme[a], qui s’appelait Qetoura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Abraham prit de nouveau une femme. » L’hébreu dit littéralement : « Abraham ajouta et prit une femme. »'
    reason: Alternative lexicale signalant la tournure additive de l’hébreu.
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: encore
  rationale: Le verbe יסף exprime l’ajout ou la répétition. Dans cette construction, « prit encore une femme » restitue naturellement cette valeur sans calquer l’hébreu « ajouta et prit ».
- source_word: וַיִּקַּח
  choice: prit
  rationale: Avec אִשָּׁה, לקח est l’expression hébraïque habituelle pour prendre une femme pour épouse. « Prit » reste proche de la formulation source, tandis que « femme » porte ici clairement le sens d’épouse.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Dans la construction avec לקח, אִשָּׁה désigne une épouse. En français, « prendre une femme » conserve à la fois la forme du texte et son sens matrimonial.
- source_word: וּשְׁמָהּ
  choice: qui s’appelait
  rationale: Cette formulation rend de manière naturelle en français moderne la proposition nominale hébraïque « et son nom [était] », sans modifier l’identification.
- source_word: קְטוּרָה
  choice: Qetoura
  rationale: Le nom propre est translittéré d’après l’hébreu; « Qetoura » représente le qoph initial et correspond à une forme française claire.
theological_decisions:
- issue: Valeur additive ou répétitive de וַיֹּסֶף dans la prise d’une femme par Abraham
  choice: Abraham prit encore une femme
  alternative: 'Abraham prit une autre femme; littéralement : Abraham ajouta et prit une femme'
  rationale: « Encore » préserve l’ambiguïté relative entre répétition et ajout portée par l’hébreu, sans préciser davantage que le texte le statut chronologique ou matrimonial de Qetoura.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « prit encore une femme » demeure proche de l’idiome hébreu tout en étant intelligible; la note explicite l’expression littérale et l’autre rendu possible.
