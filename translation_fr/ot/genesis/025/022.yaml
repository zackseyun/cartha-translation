base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: fr
  text: 'Les enfants se heurtaient l’un contre l’autre dans son ventre, et elle dit : « S’il en est ainsi, pourquoi suis-je dans cet état[a] ? » Puis elle alla consulter Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « pourquoi suis-je ainsi ? » L’expression hébraïque est elliptique et peut aussi se comprendre plus littéralement : « pourquoi suis-je ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: se heurtaient
  rationale: La forme réciproque et intensive évoque les mouvements conflictuels des enfants à naître. « Se heurtaient » reste naturel tout en conservant cette intensité sans préciser davantage le geste.
- source_word: הַבָּנִים
  choice: les enfants
  rationale: « Enfants » convient naturellement au stade prénatal et ne devance pas l’annonce du verset suivant concernant leur sexe.
- source_word: בְּקִרְבָּהּ
  choice: en elle
  rationale: L’expression signifie littéralement « en son intérieur ». « En elle » garde la référence corporelle sans ajouter explicitement « ventre » ou « sein ».
- source_word: אִם כֵּן
  choice: S’il en est ainsi
  rationale: Cette formulation française naturelle introduit la réaction angoissée de Rébecca à ce qui se passe en elle.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: pourquoi suis-je dans cet état ?
  rationale: L’hébreu est elliptique. Ce rendu relie naturellement la question à la grossesse éprouvante sans transformer celle-ci en interrogation explicitement philosophique sur l’existence.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: consulter Yahweh
  rationale: Dans ce contexte, דרש désigne la recherche d’une réponse ou d’une directive divine. « Consulter » exprime plus précisément cette démarche que le sens plus général de « chercher ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre tout en évitant de le remplacer par un titre.
- issue: Portée de la question elliptique לָמָּה זֶּה אָנֹכִי
  choice: pourquoi suis-je dans cet état ?
  alternative: pourquoi suis-je ainsi ? ; pourquoi suis-je ?
  rationale: Le contexte favorise une plainte au sujet de son état, mais la concision inhabituelle de l’hébreu permet une lecture plus littérale, conservée en note.
translation_notes:
  register: Français international moderne, sobre et narratif. « Se heurtaient » transmet le conflit prénatal sans registre familier ; la question directe conserve l’angoisse et l’ambiguïté de l’hébreu grâce à la note.
