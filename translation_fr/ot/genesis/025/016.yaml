  text: אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְ/אֵ֣לֶּה שְׁמֹתָ֔/ם בְּ/חַצְרֵי/הֶ֖ם וּ/בְ/טִֽירֹתָ֑/ם שְׁנֵים עָשָׂ֥ר נְשִׂיאִ֖ם לְ/אֻמֹּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: fr
  text: 'Voici les fils d’Ismaël, et voici leurs noms, selon leurs villages et leurs campements : douze chefs, selon leurs peuples.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Voici
  rationale: Cette tournure française introduit naturellement une récapitulation généalogique tout en reflétant le démonstratif hébreu.
- source_word: בְּנֵי יִשְׁמָעֵאל
  choice: les fils d’Ismaël
  rationale: Le contexte immédiat désigne les fils nommés d’Ismaël, et non ses descendants au sens large.
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: avec leurs noms
  rationale: Cette formulation évite en français la répétition lourde de « voici » tout en conservant l’idée que leurs noms viennent d’être énumérés.
- source_word: בְּחַצְרֵיהֶם
  choice: selon leurs villages
  rationale: חָצֵר peut désigner un village ou une implantation non fortifiée. « Selon » rend ici la fonction de classement possible de la préposition בְּ sans imposer l’idée qu’ils habitaient personnellement chacun de ces lieux.
- source_word: וּבְטִירֹתָם
  choice: et leurs campements
  rationale: טִירָה peut désigner un campement, éventuellement fortifié. « Campements » préserve le cadre tribal et semi-nomade sans surinterpréter le degré de fortification.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: douze chefs
  rationale: נָשִׂיא désigne un dirigeant ou chef de groupe. « Chefs » est naturel dans un cadre tribal et évite les connotations monarchiques modernes de « princes ».
- source_word: לְאֻמֹּתָם
  choice: selon leurs peuples
  rationale: אֻמָּה désigne ici les groupes humains issus des fils d’Ismaël. « Peuples » reste plus proche du sens lexical que « tribus » et conserve la portée collective.
theological_decisions:
- issue: Statut des douze fils d’Ismaël
  choice: douze chefs
  alternative: douze princes
  rationale: Le texte leur attribue une autorité sur leurs groupes respectifs, sans préciser une royauté dynastique. « Chefs » préserve cette portée sans ajouter un statut monarchique.
translation_notes:
  register: Français international moderne, sobre et digne. La structure est légèrement lissée pour être idiomatique, tandis que « selon » conserve l’ambiguïté entre localisation et classement géographique.
