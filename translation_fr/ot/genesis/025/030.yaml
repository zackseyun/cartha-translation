base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: fr
  text: 'Ésaü dit à Jacob : « Laisse-moi donc engloutir de ce rouge, de ce rouge-là[a], car je suis épuisé. » C’est pourquoi on l’appela Édom[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « de ce rouge, de ce rouge-là », sans nommer la nourriture. On pourrait expliciter : « de ce plat rouge » ou « de ce ragoût rouge ».'
    reason: lexical_alternative
  - marker: b
    text: Le nom Édom fait écho au mot hébreu traduit par « rouge » dans cette phrase.
    reason: wordplay
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: Laisse-moi engloutir
  rationale: Le hiphil de לעט évoque le fait d’avaler avidement ou à grandes bouchées. « Engloutir » restitue l’empressement peu mesuré d’Ésaü mieux que le plus neutre « donne-moi à manger ».
- source_word: נָא
  choice: donc
  rationale: Dans cette demande pressante, la particule נָא adoucit ou renforce l’injonction. « Donc » sonne ici plus spontané que « s’il te plaît », qui risquerait de rendre Ésaü trop courtois.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: de ce rouge, de ce rouge-là
  rationale: L’hébreu répète « le rouge » sans nommer le mets. La traduction conserve cette ellipse frappante et la répétition, tandis que « -là » rend la valeur déictique de הַזֶּה.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: car je suis épuisé
  rationale: עָיֵף désigne la fatigue ou l’épuisement. « Épuisé » rend naturellement l’intensité de la situation sans introduire l’idée plus précise d’un évanouissement.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette tournure française exprime clairement le lien explicatif introduisant l’étiologie du nom.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: on lui donna le nom d’Édom
  rationale: La tournure impersonnelle française est naturelle et ne précise pas l’identité, non exprimée dans le contexte immédiat, de celui ou de ceux qui lui attribuèrent ce nom.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Le nom propre est translittéré selon son usage français traditionnel; une note explicite son jeu sonore avec אָדֹם, « rouge ».
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. La parole d’Ésaü reste brusque et impulsive grâce à « engloutir » et à la répétition inhabituelle de « rouge », sans ajouter dans le texte principal le nom du mets absent de l’hébreu.
