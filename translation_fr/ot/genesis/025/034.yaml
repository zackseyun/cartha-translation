source:
  edition: WLC
  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: fr
  text: Jacob donna à Ésaü du pain et un plat de lentilles[a]. Ésaü mangea et but, se leva et s’en alla. Ainsi, Ésaü méprisa le droit d’aînesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un ragoût de lentilles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: donna
  rationale: Le verbe courant « donner » rend directement l’action, sans ajouter l’idée d’un service ou d’une remise formelle.
- source_word: לֶחֶם
  choice: du pain
  rationale: Le sens concret « pain » convient ici, puisque le terme est associé à un plat de lentilles.
- source_word: נְזִיד עֲדָשִׁים
  choice: un plat de lentilles
  rationale: Cette formulation naturelle désigne une préparation cuite à base de lentilles sans préciser indûment sa consistance.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: mangea et but, se leva et s’en alla
  rationale: La succession brève des verbes conserve le rythme rapide du récit; la répétition du sujet Ésaü lève en français une ambiguïté pronominale peu naturelle.
- source_word: וַיִּבֶז
  choice: méprisa
  rationale: « Mépriser » exprime avec concision le dédain marqué par le verbe hébreu.
- source_word: הַבְּכֹרָה
  choice: le droit d’aînesse
  rationale: Cette expression française courante désigne les droits et privilèges attachés au statut de premier-né.
theological_decisions:
- issue: Évaluation narrative de l’attitude d’Ésaü envers son statut de premier-né
  choice: Ainsi, Ésaü méprisa le droit d’aînesse
  alternative: Ésaü traita donc le droit d’aînesse avec mépris
  rationale: « Ainsi » fait entendre la portée récapitulative et déductive de la dernière proposition, tandis que « méprisa » conserve l’évaluation forte du narrateur sans l’amplifier.
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple maintient le registre biblique digne sans archaïsme; la phrase reste brève pour refléter la succession rapide des actions.
