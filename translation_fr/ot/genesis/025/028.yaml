  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: fr
  text: Isaac aimait Ésaü parce qu’il avait le goût du gibier[a], mais Rébecca aimait Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parce que le gibier était dans sa bouche ». L’expression signifie probablement qu’Isaac appréciait le gibier qu’Ésaü lui procurait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: aimait
  rationale: Le wayyiqtol qal de אָהַב indique ici l'affection d'Isaac dans le récit. L'imparfait français exprime naturellement cet état durable en arrière-plan.
- source_word: אֶת עֵשָׂו
  choice: Ésaü
  rationale: La marque de l'objet direct אֶת n'est pas rendue; le nom propre reçoit sa forme française usuelle.
- source_word: כִּי
  choice: parce que
  rationale: כִּי introduit la raison de la préférence d'Isaac; « parce que » est clair et courant.
- source_word: צַיִד
  choice: le gibier
  rationale: צַיִד désigne le produit de la chasse. « Gibier » conserve cette portée sans la restreindre à la venaison.
- source_word: בְּפִיו
  choice: était dans sa bouche
  rationale: La formulation conserve l'image concrète et ambiguë de l'hébreu, littéralement « dans sa bouche », plutôt que d'expliciter silencieusement qu'Isaac appréciait de manger le gibier d'Ésaü.
- source_word: וְרִבְקָה
  choice: tandis que Rébecca
  rationale: Le waw relie deux préférences parentales mises en contraste. « Tandis que » rend naturellement ce contraste en français.
- source_word: אֹהֶבֶת
  choice: aimait
  rationale: Le participe exprime ici une disposition durable ou caractéristique; l'imparfait français convient au contexte narratif.
- source_word: אֶת יַעֲקֹב
  choice: Jacob
  rationale: La marque de l'objet direct אֶת n'est pas rendue; le nom propre reçoit sa forme française usuelle.
