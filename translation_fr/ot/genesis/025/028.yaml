  naturalness: L'imparfait « aimait » convient bien à des dispositions durables dans le récit. « Mais » est un contraste plus direct et plus courant que « tandis que » ici. La reformulation proposée est naturelle en français international moderne sans transformer le sens probable en détail excessivement précis.
  terminology: Les formes « Isaac », « Ésaü », « Rébecca » et « Jacob » sont les formes françaises usuelles. « Gibier » rend correctement צַיִד sans restreindre le terme à une espèce particulière.
