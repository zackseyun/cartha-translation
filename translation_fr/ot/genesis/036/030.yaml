base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: fr
  text: 'Le chef Dishôn, le chef Étser, le chef Dishân : tels furent les chefs des Horites, selon leurs clans, dans le pays de Séir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: chef
  rationale: Dans cette liste, le terme désigne un dirigeant tribal ou clanique. « Chef » est actuel, clair et permet de conserver la répétition solennelle de l’hébreu.
- source_word: דִּשֹׁן / אֵצֶר / דִּישָׁן
  choice: Dishôn / Étser / Dishân
  rationale: Translittération française des noms propres, en maintenant la distinction entre Dishôn et Dishân et en rendant le tsadé de אֵצֶר par « ts ».
- source_word: אֵלֶּה
  choice: Tels étaient
  rationale: La proposition nominale hébraïque résume la liste précédente. L’imparfait français convient au cadre généalogique narratif.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: les chefs des Horites
  rationale: Le singulier collectif hébreu désigne ici le peuple horite; le pluriel français est naturel.
- source_word: לְאַלֻּפֵיהֶם
  choice: selon leurs chefferies
  rationale: Dans ce contexte classificatoire, le pluriel peut désigner les unités ou territoires relevant de chaque chef. « Chefferies » évite une tautologie tout en restant proche du terme hébreu.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: dans le pays de Séir
  rationale: Rendu naturel de l’expression géographique, avec la forme française traditionnelle du nom propre.
