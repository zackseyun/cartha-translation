  text: אֵ֖לֶּה אַלּוּפֵ֣י הַ/חֹרִ֑י אַלּ֤וּף לוֹטָן֙ אַלּ֣וּף שׁוֹבָ֔ל אַלּ֥וּף צִבְע֖וֹן אַלּ֥וּף עֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: fr
  text: 'Voici les chefs des Horiens : le chef Lotân[a], le chef Shobal, le chef Tsibéon et le chef Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs de clan » ou « chefs de tribu » ; le terme hébreu peut désigner le dirigeant d’un clan ou d’une tribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Le démonstratif pluriel introduit une liste. « Voici » rend naturellement en français cette fonction présentative, sans imposer une distinction temporelle absente de l’hébreu.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: chefs / le chef
  rationale: Dans Genèse 36, le terme désigne des dirigeants de groupes familiaux ou tribaux. « Chef » est moderne et clair. La répétition du singulier devant chaque nom, présente en hébreu, est conservée.
- source_word: הַחֹרִי
  choice: des Horites
  rationale: Le gentilé hébreu morphologiquement singulier a ici une valeur collective; le pluriel français désigne naturellement ce peuple.
- source_word: לוֹטָן
  choice: Lotân
  rationale: Transcription française du nom propre hébreu, avec accent circonflexe indiquant la voyelle longue finale selon une convention biblique française courante.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Transcription française claire et usuelle du nom propre.
- source_word: צִבְעוֹן
  choice: Tsibéon
  rationale: 'Transcription adaptée au français : « Ts » représente le tsadé initial et « éon » reflète la forme hébraïque tout en restant lisible.'
- source_word: עֲנָה
  choice: Ana
  rationale: Transcription française simple du nom propre hébreu; le h final de certaines traditions n’est pas prononcé et n’est pas nécessaire ici.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétitive de l’hébreu est maintenue, tandis que « et » est ajouté avant le dernier élément conformément à l’usage naturel du français.
