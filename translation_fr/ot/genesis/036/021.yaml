base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: fr
  text: Dishôn, Étser et Dishân. Ce sont les chefs[a] des Horiens, fils de Séir, dans le pays d’Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chefs de clan ».'
    reason: Signale que אַלּוּפִים désigne des dirigeants sociopolitiques de groupes ou de clans, et non simplement des personnages importants.
lexical_decisions:
- source_word: דִשׁוֹן
  choice: Dishôn
  rationale: Nom propre translittéré selon les conventions françaises, avec accent circonflexe pour guider la prononciation de la voyelle longue.
- source_word: אֵצֶר
  choice: Étser
  rationale: Nom propre translittéré sous une forme française lisible, ts représentant la consonne צ.
- source_word: דִישָׁן
  choice: Dishân
  rationale: Nom propre translittéré selon les conventions françaises et distingué de Dishôn.
- source_word: אֵלֶּה
  choice: Ce sont
  rationale: Formule française naturelle d’identification correspondant au démonstratif pluriel avec copule sous-entendue.
- source_word: אַלּוּפֵי
  choice: les chefs
  rationale: Le terme désigne ici les dirigeants de groupes horiens; « chefs » est actuel, clair et conserve la notion d’autorité sans employer l’archaïque « ducs ».
- source_word: הַחֹרִי
  choice: des Horiens
  rationale: Le singulier morphologique fonctionne collectivement comme nom ethnique; le pluriel français convient dans ce contexte.
- source_word: בְּנֵי שֵׂעִיר
  choice: fils de Séir
  rationale: Conserve l’expression généalogique formelle et son éventuelle portée collective sans la réduire explicitement à « descendants ».
- source_word: בְּאֶרֶץ אֱדֹום
  choice: dans le pays d’Édom
  rationale: Rend explicitement אֶרֶץ et maintient la précision géographique de l’hébreu.
