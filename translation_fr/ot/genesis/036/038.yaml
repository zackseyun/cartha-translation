  yaml_path: translation/ot/genesis/036/038.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: fr
  text: Shaoul mourut, et Baal-Hanan, fils d’Akbor, régna à sa place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le qatal narratif de מות exprime directement la mort; « mourut » convient au récit et évite tout euphémisme.
- source_word: שָׁאוּל
  choice: Shaoul
  rationale: Cette forme française rend naturellement le nom hébreu et le distingue de la graphie traditionnelle française « Saül », tout en restant proche de sa prononciation.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession royale, le verbe מלך signifie exercer la royauté; « régna » en conserve la concision.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession, תחת avec suffixe indique que le nouveau roi prend la place du précédent.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanân
  rationale: La graphie avec trait d’union reflète les deux éléments du nom hébreu; l’accent circonflexe aide à rendre la voyelle longue du second élément selon un usage français lisible.
- source_word: בֶּן
  choice: fils de
  rationale: Le nom en état construit exprime ici la filiation directe.
- source_word: עַכְבּוֹר
  choice: Akbor
  rationale: Translittération française lisible, proche de la forme hébraïque, sans reprendre la graphie traditionnelle « Acbor ».
