id: GEN.36.17
reference: Genesis 36:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן עֵשָׂ֔ו אַלּ֥וּף נַ֨חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּ/אֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: fr
  text: 'Et voici les fils de Réouel, fils d’Ésaü : le chef[a] Nahath, le chef Zérah, le chef Shamma et le chef Mizza. Ce sont les chefs de Réouel au pays d’Édom. Ce sont les fils de Basmath, femme d’Ésaü.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef de clan »; le terme hébreu désigne ici un dirigeant tribal édomite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Et voici
  rationale: Cette formule conserve le lien avec la généalogie précédente tout en introduisant naturellement une nouvelle liste en français.
- source_word: בְּנֵי
  choice: fils de
  rationale: Le texte énumère des hommes nommés; « fils de » rend directement le terme hébreu et préserve sa répétition dans la dernière phrase.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: Réouel, fils d’Ésaü
  rationale: La construction généalogique est rendue directement, avec une virgule qui clarifie l’apposition en français.
- source_word: אַלּוּף
  choice: chef
  rationale: Dans ce contexte édomite, le terme désigne un dirigeant tribal ou clanique. « Chef » est actuel, clair et moins explicatif que « chef de clan ».
- source_word: נַחַת
  choice: Nahath
  rationale: Transcription française usuelle du nom propre.
- source_word: זֶרַח
  choice: Zérah
  rationale: Transcription française claire du nom propre hébreu.
- source_word: שַׁמָּה
  choice: Shamma
  rationale: Transcription française courante du nom propre, sans ajouter une lettre finale propre à certaines conventions anglaises.
- source_word: מִזָּה
  choice: Mizza
  rationale: Transcription du nom propre qui représente le redoublement consonantique hébreu.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: Ce sont les chefs de Réouel
  rationale: Cette formulation conserve le résumé généalogique et la relation concise, quelque peu ouverte, exprimée par l’état construit hébreu.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: au pays d’Édom
  rationale: Le mot « pays » rend explicitement אֶרֶץ et forme une expression française naturelle.
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: Basmath, femme d’Ésaü
  rationale: L’apposition identifie la lignée maternelle sans ajouter de relation absente du texte.
theological_decisions:
- issue: Portée généalogique de בְּנֵי dans la dernière phrase
  choice: fils de Basmath
  alternative: descendants de Basmath
  rationale: Bien que les hommes énumérés soient les fils de Réouel et donc les petits-fils de Basmath dans la généalogie, le texte hébreu emploie explicitement « fils ». La traduction conserve cette formulation et sa tension généalogique au lieu de l’expliquer dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « chef » et de « fils » est conservée parce qu’elle structure la notice généalogique. Les noms suivent des formes françaises lisibles, et le marqueur de note est placé à la première occurrence du terme concerné.
