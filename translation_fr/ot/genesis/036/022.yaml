lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: Dans cette généalogie, la forme de היה sert de copule simple pour présenter les fils de Lotân ; « étaient » est naturel et fidèle.
- source_word: בְנֵי
  choice: les fils de
  rationale: Le terme désigne ici des enfants de sexe masculin, comme le confirment les deux noms qui suivent.
- source_word: לוֹטָן
  choice: Lotân
  rationale: Translittération française du nom propre, avec accent circonflexe pour signaler la voyelle longue du texte massorétique.
- source_word: חֹרִי
  choice: Hori
  rationale: Le nom propre est translittéré plutôt que traduit.
- source_word: הֵימָם
  choice: Hémam
  rationale: Cette forme représente la vocalisation du texte hébreu de ce verset ; la liste parallèle de 1 Chroniques 1.39 présente une forme différente.
- source_word: וַאֲחוֹת לוֹטָן
  choice: et la sœur de Lotân était
  rationale: Le nom signifie « sœur » ; le verbe « était », repris de la première proposition, donne en français une phrase claire sans modifier le sens.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Translittération du nom personnel selon la forme hébraïque de ce verset.
