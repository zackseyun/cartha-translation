  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: fr
  text: Les fils de Lotân étaient Hori et Hémam[a], et la sœur de Lotân était Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Hémam » ; la liste parallèle en 1 Chroniques 1.39 porte « Homam ».'
