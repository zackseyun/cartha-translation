- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: habitants du pays
  rationale: Le participe construit au pluriel désigne ceux qui résident dans le pays; cette formulation est concise et idiomatique en français.
- source_word: לוֹטָן
  choice: Lotân
  rationale: Transcription française du nom propre, avec accent circonflexe indiquant la voyelle longue finale.
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Transcription claire du nom propre hébreu.
- source_word: צִבְעוֹן
  choice: Tsibéon
  rationale: Transcription française lisible du nom propre hébreu.
- source_word: עֲנָה
  choice: Ana
  rationale: Transcription française usuelle et lisible du nom propre.
