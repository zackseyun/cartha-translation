lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Formule présentative naturelle en français pour introduire une liste généalogique.
- source_word: בְנֵי
  choice: les fils de
  rationale: Conserve le terme généalogique formel; les personnes nommées sont présentées ici comme les fils de Séir.
- source_word: שֵׂעִיר
