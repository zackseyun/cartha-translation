  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: fr
  text: Voici les fils d’Ésaü, et voici leurs chefs[a]. Lui, c’est Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs chefs de clan ». Le mot hébreu désigne les chefs de clans ou de tribus en Édom.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Le démonstratif pluriel introduit ici un résumé généalogique. « Voici » rend naturellement la présentation déictique de la proposition hébraïque sans verbe.
- source_word: בְנֵי
  choice: les fils de
  rationale: Dans cette généalogie, le terme désigne précisément les descendants masculins immédiats d’Ésaü.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: וְאֵלֶּה
  choice: et voici
  rationale: La répétition conserve le parallélisme de l’hébreu tout en restant naturelle en français.
- source_word: אַלּוּפֵיהֶם
  choice: leurs chefs
  rationale: Dans Genèse 36, אַלּוּף désigne les dirigeants de groupes claniques ou tribaux d’Édom. « Chefs » est concis et laisse la nature exacte de leur autorité suffisamment ouverte.
- source_word: הוּא
  choice: Lui, c’est
  rationale: Le pronom reprend Ésaü avec une valeur emphatique et l’identifie à Édom; cette tournure est plus naturelle en français moderne que « Il est Édom ».
- source_word: אֱדוֹם
  choice: Édom
  rationale: Forme française traditionnelle du nom, qui identifie ici Ésaü à Édom, ancêtre éponyme des Édomites.
