source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: fr
  text: 'Voici les fils d’Oholibama, fille d’Ana, fille de Tsibéon, femme d’Ésaü : elle donna à Ésaü Jéoush, Jaalam et Koré.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: Voici
  rationale: Dans une notice généalogique, « Voici » rend naturellement la formule présentative hébraïque en français moderne; la continuité portée par ו est assurée par le contexte.
- source_word: בְּנֵי
  choice: les fils
  rationale: Les personnes nommées sont de sexe masculin; « fils » est donc plus précis que « enfants » ou « descendants ».
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Translittération française usuelle et transparente du nom propre.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: fille d’Ana, fille de Tsibéon
  rationale: La répétition de « fille de » suit l’apposition hébraïque et préserve la formulation généalogique sans l’interpréter explicitement comme « petite-fille ».
- source_word: אֵשֶׁת עֵשָׂו
  choice: femme d’Ésaü
  rationale: Rend directement la relation exprimée par l’état construit, dans un français biblique actuel et naturel.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: elle donna à Ésaü
  rationale: « Donner [des enfants] à » exprime ici idiomatiquement en français le verbe « enfanter » accompagné de la préposition ל, tout en évitant la tournure peu naturelle « elle enfanta pour Ésaü ».
- source_word: יעיש
  choice: Yéoush
  rationale: Translittération adaptée aux conventions phonétiques françaises.
- source_word: יַעְלָם
  choice: Yalam
  rationale: Translittération adaptée au français, conservant la consonne initiale hébraïque.
- source_word: קֹרַח
  choice: Coré
  rationale: Forme française biblique traditionnelle et largement reconnaissable du nom.
