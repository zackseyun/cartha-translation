source:
  edition: WLC
  text: אֵ֖לֶּה אַלּוּפֵ֣י בְנֵֽי עֵשָׂ֑ו בְּנֵ֤י אֱלִיפַז֙ בְּכ֣וֹר עֵשָׂ֔ו אַלּ֤וּף תֵּימָן֙ אַלּ֣וּף אוֹמָ֔ר אַלּ֥וּף צְפ֖וֹ אַלּ֥וּף קְנַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: fr
  text: 'Voici les chefs[a] des fils d’Ésaü : parmi les fils d’Éliphaz, premier-né d’Ésaü, le chef Témân, le chef Omar, le chef Tsepho et le chef Kenaz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs de clan » pour le titre hébreu אַלּוּף.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: chefs / le chef
  rationale: Dans les listes édomites, le terme désigne un dirigeant de clan ou de groupe tribal. « Chef » conserve la fonction de titre sans employer un terme archaïque ni identifier directement la personne au clan.
- source_word: בְנֵי
  choice: fils de / parmi les fils de
  rationale: Le mot signifie littéralement « fils de ». L’ajout contextuel de « parmi » dans la seconde occurrence rend naturelle en français la relation entre le titre général et la sous-liste, sans changer la filiation exprimée.
- source_word: בְּכוֹר
  choice: premier-né
  rationale: « Premier-né » rend précisément l’ordre de naissance tout en conservant les éventuelles implications de statut.
- source_word: אֵלֶּה
  choice: Voici
  rationale: « Voici » introduit naturellement une énumération généalogique en français actuel et correspond à la formule présentative hébraïque.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre.
- source_word: אֱלִיפַז
  choice: Éliphaz
  rationale: Translittération française traditionnelle du nom propre.
- source_word: תֵּימָן
  choice: Témân
  rationale: Translittération française usuelle qui distingue clairement le nom propre.
- source_word: אוֹמָר
  choice: Omar
  rationale: Translittération directe et naturelle en français.
- source_word: צְפוֹ
  choice: Tsepho
  rationale: Cette forme représente les consonnes hébraïques צפו de façon lisible en français; d’autres traditions françaises emploient « Tsepho » ou « Tsepo ».
- source_word: קְנַז
  choice: Kenaz
  rationale: Translittération française courante du nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation maintient le lien entre l’intitulé général et la liste. « Parmi les fils d’Éliphaz » évite en français une succession lourde de deux deux-points tout en préservant la structure généalogique.
