source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: fr
  text: 'Voici les fils de Réouël : Nahath, Zérah, Shamma et Mizza. Ce furent les descendants[a] de Basmath, femme d’Ésaü.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fils »; ici, le mot désigne les descendants de Basmath.'
    reason: Le même mot hébreu בְּנֵי signifie littéralement « fils », mais le contexte généalogique indique que les hommes nommés sont ses petits-fils par Réouël. La note préserve la forme de l’hébreu tout en expliquant le rendu contextuel.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Cette formule introduit naturellement en français moderne un nouvel élément de la généalogie. Le lien avec ce qui précède demeure implicite dans la continuité de la liste.
- source_word: בְּנֵי רְעוּאֵל
  choice: les fils de Réouël
  rationale: Les hommes nommés sont les fils immédiats de Réouël; « fils » rend donc ici précisément בְּנֵי.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: Nahath, Zérah, Shamma et Mizza
  rationale: Les noms propres sont translittérés selon des formes lisibles et usuelles en français, et la dernière conjonction est rendue naturellement par « et ».
- source_word: אֵלֶּה הָיוּ
  choice: Ce furent
  rationale: La formule généalogique au passé est rendue dans un registre digne et concis.
- source_word: בְּנֵי בָשְׂמַת
  choice: les descendants de Basmath
  rationale: 'Dans ce second emploi, בְּנֵי désigne collectivement la postérité de Basmath : les hommes énumérés sont les fils de Réouël et, d’après le contexte, les petits-fils de Basmath. « Descendants » conserve l’extension possible du terme hébreu sans introduire une contradiction en français.'
- source_word: אֵשֶׁת עֵשָׂו
  choice: femme d’Ésaü
  rationale: Cette tournure française concise et naturelle conserve l’identification relationnelle de Basmath.
