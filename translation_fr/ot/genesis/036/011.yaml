  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: fr
  text: Les fils d’Éliphaz furent Témân, Omar, Tsepho[a], Gatam et Qenaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions donnent « Zepo » au lieu de « Tsepho ». Le texte hébreu massorétique vocalise ici le nom « Tsepho ».
    reason: Variante de translittération signalée par la piste d’audit anglaise ; précision sur la vocalisation massorétique.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: furent
  rationale: Dans cette liste généalogique, le verbe היה précédé du waw sert de copule pour présenter les fils d’Éliphaz. « Furent » conserve la forme narrative tout en restant naturel en français biblique moderne.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le masculin pluriel construit désigne explicitement les fils dans ce contexte généalogique; il n’y a pas lieu de le neutraliser en « enfants » ou de l’élargir en « descendants ».
- source_word: אֱלִיפָז
  choice: Éliphaz
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: תֵּימָן
  choice: Témân
  rationale: Le terme fonctionne ici comme un nom de personne; il est donc transcrit plutôt que traduit ou interprété comme un nom de lieu.
- source_word: אוֹמָר
  choice: Omar
  rationale: Transcription française claire du nom propre.
- source_word: צְפוֹ
  choice: Tsepho
  rationale: La transcription reflète les consonnes et la vocalisation du texte massorétique צְפוֹ; elle permet aussi de distinguer cette forme de la variante « Tsephi » attestée ailleurs dans la tradition textuelle.
- source_word: גַעְתָּם
  choice: Gaetam
  rationale: Transcription française lisible du nom propre, où « ae » rend approximativement la séquence gutturale et vocalique hébraïque.
- source_word: קְנַז
  choice: Qenaz
  rationale: La lettre q rend le qof hébreu et distingue celui-ci du kaf; cette transcription reste facilement lisible en français.
