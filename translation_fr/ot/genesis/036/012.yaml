  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: fr
  text: Timna était une concubine d’Éliphaz, fils d’Ésaü, et elle enfanta Amalec à Éliphaz. Ce sont là les fils[a] d’Ada, femme d’Ésaü.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « fils » peut aussi désigner des descendants. Dans ce contexte, il s’agit des petits-fils d’Ada.
    reason: La note préserve la portée généalogique possible du terme hébreu בני sans remplacer dans le texte « fils » par une interprétation plus précise.
lexical_decisions:
- source_word: וְתִמְנַע הָיְתָה
  choice: Timna était
  rationale: Le verbe היה sert ici de copule et décrit la situation de Timna; le ו initial est omis pour une ouverture naturelle en français.
- source_word: פִילֶגֶשׁ
  choice: une concubine
  rationale: Le terme désigne une femme liée à un homme par une union reconnue mais de rang secondaire; « concubine » conserve sobrement cette distinction sociale.
- source_word: לֶאֱלִיפַז בֶּן עֵשָׂו
  choice: d’Éliphaz, fils d’Ésaü
  rationale: La préposition ל exprime ici l’association avec Éliphaz, tandis que la chaîne construite identifie celui-ci comme fils d’Ésaü.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת־עֲמָלֵק
  choice: elle donna à Éliphaz un fils, Amalec
  rationale: Cette formulation française naturelle conserve Éliphaz comme père dans la construction généalogique; « un fils » explicite ce que le contexte de l’accouchement et de la généalogie implique.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: Ce sont là les fils d’Ada
  rationale: La formule généalogique est rendue au plus près. Le mot בנים peut avoir une portée plus large que les seuls fils immédiats, nuance signalée en note.
- source_word: אֵשֶׁת עֵשָׂו
  choice: femme d’Ésaü
  rationale: La chaîne construite identifie Ada par sa relation conjugale avec Ésaü; « femme » est ici naturel et fidèle.
theological_decisions:
- issue: Portée généalogique de בְּנֵי appliqué à Ada
  choice: Maintenir « fils » dans le texte et expliquer sa portée possible en note
  alternative: Traduire directement par « petits-fils » ou « descendants »
  rationale: « Fils » reflète la formulation hébraïque sans résoudre silencieusement la tension; le contexte indique toutefois qu’Amalec et les autres enfants d’Éliphaz sont les petits-fils d’Ada, ce que précise la note.
translation_notes:
  register: 'Français international moderne, clair et digne. Les noms propres suivent les formes françaises bibliques usuelles : Éliphaz, Ésaü, Amalec et Ada. La formulation conserve la concision généalogique du passage sans masquer la portée plus large possible de « fils ».'
