review_pass:
  verdict: revise
  source_fidelity: La phrase « elle donna à Éliphaz un fils, Amalec » ajoute explicitement « un fils », absent du texte hébreu. Même si Amalec est présenté comme un homme dans la généalogie, cette explicitation n’est pas nécessaire ici. La construction ילד + ל peut être rendue en français généalogique par « enfanta Amalec à Éliphaz » sans cet ajout. « Les fils d’Ada » reflète bien בני, dont l’emploi généalogique peut inclure des descendants de génération suivante.
  naturalness: Le français est globalement clair et de registre biblique moderne. « Elle enfanta Amalec à Éliphaz » est une formulation généalogique française concise et plus fidèle que « donna à Éliphaz un fils ».
  terminology: « Concubine », « Éliphaz », « Ésaü », « Amalec » et « Ada » sont appropriés. La note sur « fils » préserve utilement l’ambiguïté sémantique de בני sans imposer « petits-fils » dans le texte.
  issues:
  - severity: medium
    issue: Ajout de « un fils » dans la naissance d’Amalec.
    rationale: Le texte source dit littéralement que Timna enfanta Amalec à/pour Éliphaz; il ne qualifie pas Amalec de « fils » dans cette proposition. L’ajout est évitable et réduit la fidélité formelle.
  - severity: low
    issue: La note a devient inutile après une formulation directe de la construction généalogique.
    rationale: Une fois « enfanta Amalec à Éliphaz » retenu dans le texte, une note donnant essentiellement la même formulation ne fournit plus d’alternative ou d’éclairage nécessaire.
  revised_text: Timna était une concubine d’Éliphaz, fils d’Ésaü, et elle enfanta Amalec à Éliphaz. Ce sont là les fils[a] d’Ada, femme d’Ésaü.
  revised_footnotes:
