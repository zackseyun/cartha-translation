    reason: La note préserve la portée généalogique possible du terme hébreu בני sans remplacer dans le texte « fils » par une interprétation plus précise.
  revision_rationale: La révision supprime l’ajout non exprimé de « un fils » et rend la relation généalogique par « enfanta Amalec à Éliphaz ». Elle conserve « fils » pour traduire בני, avec une note qui explique sobrement que le contexte désigne des petits-fils d’Ada.
