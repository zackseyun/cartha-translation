  text: וַ/יָּ֖מָת חֻשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עֲוִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: fr
  text: Housham mourut, et Hadad, fils de Bedad, régna à sa place, lui qui frappa Madian[a] dans la campagne de Moab[b]. Sa ville s’appelait Avith.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vainquit Madian ». Le participe hébreu signifie littéralement « celui qui frappa Madian ».
    reason: lexical_alternative
  - marker: b
    text: Le terme rendu par « campagne » peut aussi désigner le « pays » ou le « territoire » de Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות désigne simplement la mort. « Mourut » est direct, naturel et sans euphémisme.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: régna à sa place
  rationale: Cette formulation conserve à la fois l’idée du règne exprimée par מלך et celle de succession portée par תַּחְתָּיו.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadad, fils de Bedad
  rationale: Les noms propres sont translittérés, et « fils de » rend directement בֶּן dans cette notice royale.
- source_word: הַמַּכֶּה
  choice: c’est lui qui frappa
  rationale: Le participe hiphil de נכה caractérise Hadad par une action marquante. « Frappa » reste proche du sens lexical sans préciser à tort la nature ou l’ampleur exacte de l’affrontement.
- source_word: אֶת מִדְיָן
  choice: Madian
  rationale: Le texte porte le nom propre מִדְיָן. Le conserver sous la forme française traditionnelle « Madian » évite d’expliciter en « les Madianites » ce que l’hébreu laisse sous forme de nom collectif ou territorial.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: dans la campagne de Moab
  rationale: שָׂדֶה signifie littéralement « champ », mais dans cette expression géographique il peut désigner la campagne, le pays ou le territoire. « Campagne » demeure concret tout en étant naturel en français.
- source_word: וְשֵׁם עִירוֹ
  choice: Sa ville s’appelait
  rationale: Cette tournure française naturelle rend fidèlement la formule hébraïque « et le nom de sa ville était » sans lourdeur.
- source_word: עֲוִית
  choice: Avith
  rationale: Le nom de lieu est translittéré sous une forme française lisible qui conserve les consonnes principales de l’hébreu.
theological_decisions: []
