id: GEN.36.1
reference: Genesis 36:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: fr
  text: Voici la descendance d’Ésaü (c’est-à-dire Édom)[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici la descendance d’Ésaü ; lui, c’est Édom. »'
    reason: La formulation plus littérale conserve le pronom hébreu הוּא (« lui/il »), que le texte principal rend comme une identification explicative.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Dans une formule introductive, « Voici » rend naturellement en français moderne la présentation d’une nouvelle section, sans ajouter une valeur temporelle absente de l’hébreu.
- source_word: תֹּלְדוֹת
  choice: la descendance de
  rationale: Dans ce contexte généalogique, « descendance » est clair et idiomatique. Le terme hébreu sert aussi de formule structurante dans la Genèse et peut, selon le contexte, désigner plus largement l’histoire familiale issue d’une personne.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: הוּא
  choice: c’est-à-dire
  rationale: Le pronom établit ici une identification appositionnelle entre Ésaü et Édom. « C’est-à-dire » l’exprime naturellement, tandis que la note conserve la formulation pronominale plus littérale.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Forme française usuelle du nom propre, qui identifie ici Ésaü à Édom.
theological_decisions:
- issue: Portée de la formule תֹּלְדוֹת
  choice: la descendance de
  alternative: les générations de / l’histoire familiale de
  rationale: « Descendance » convient à la liste généalogique qui suit et reste compréhensible pour le lecteur moderne. Elle ne doit toutefois pas faire oublier que תֹּלְדוֹת est également une formule littéraire récurrente de la Genèse, dont la portée peut dépasser une simple liste biologique.
- issue: Relation entre Ésaü et Édom
  choice: c’est-à-dire Édom
  alternative: lui, c’est Édom
  rationale: Le texte identifie les deux noms sans préciser davantage si Édom désigne ici seulement la personne, le peuple ou le territoire associé. La traduction maintient cette identification concise sans la développer.
translation_notes:
  register: Français international moderne, simple et digne. « Voici » fonctionne comme formule d’introduction; « descendance » évite le caractère vieilli de « postérité » et le calque peu naturel « générations de ». La parenthèse rend clairement l’identification tout en conservant en note la syntaxe hébraïque possible.
