  text: וַ/יָּ֖מָת שַׂמְלָ֑ה וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שָׁא֖וּל מֵ/רְחֹב֥וֹת הַ/נָּהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: fr
  text: Puis Samla mourut, et Shaoul[a] de Rehoboth sur le Fleuve[b] régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Saül », forme française traditionnelle du nom.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « Rehoboth du Fleuve », probablement Rehoboth située près d’un fleuve bien connu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Puis … mourut
  rationale: Le wayyiqtol de מות fait progresser le récit. « Puis » exprime naturellement la succession narrative, et le passé simple convient au registre narratif français.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Translittération française sobre du nom propre hébreu.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession royale, מלך désigne l’exercice de la royauté. « Régna » préserve la formulation concise du texte, tandis que « devint roi » expliciterait seulement l’accession.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: Dans un contexte de succession, תחתיו indique que le nouveau roi prend la place du précédent.
- source_word: שָׁאוּל
  choice: Shaoul
  rationale: « Shaoul » reflète directement la forme hébraïque en translittération française; la forme française traditionnelle « Saül » est signalée en note.
- source_word: מֵרְחֹבוֹת
  choice: de Rehoboth
  rationale: La préposition מִן indique ici l’origine ou le rattachement géographique. Rehoboth est compris comme un nom de lieu.
- source_word: הַנָּהָר
  choice: sur-le-Fleuve
  rationale: L’expression qualifie géographiquement Rehoboth. « Le Fleuve » conserve l’article défini hébreu sans identifier un cours d’eau que le verset ne nomme pas.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient la cadence généalogique. Les noms sont translittérés selon des formes aisément lisibles en français; les traits d’union dans « Rehoboth-sur-le-Fleuve » présentent l’ensemble comme une désignation géographique.
