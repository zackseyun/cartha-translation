source:
  edition: WLC
  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: fr
  text: Chef Magdiel, chef Iram. Tels sont les chefs d’Édom, selon leurs lieux d’habitation dans le pays qu’ils possédaient[a]. C’est Ésaü, le père d’Édom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le pays de leur possession ».'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, Ésaü est l’ancêtre des Édomites.
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוּף
  choice: chef
  rationale: Dans Genèse 36, le terme désigne les chefs de groupes tribaux ou claniques édomites. « Chef » est naturel, digne et conserve le titre sans l’archaïsme de « duc ».
- source_word: מַגְדִּיאֵל
  choice: Magdiel
  rationale: Nom propre translittéré selon l’usage français courant.
- source_word: עִירָם
  choice: Iram
  rationale: Nom propre translittéré selon l’usage français courant.
- source_word: אֵלֶּה אַלּוּפֵי אֱדֹם
  choice: Tels sont les chefs d’Édom
  rationale: Formule récapitulative naturelle en français, qui conserve le présent et reprend de manière cohérente le titre « chef ».
- source_word: לְמֹשְׁבֹתָם
  choice: selon leurs lieux d’habitation
  rationale: Le préfixe ל marque ici le classement ou la répartition. Cette formulation conserve le lien avec les endroits où les groupes étaient établis sans préciser indûment qu’il s’agissait de villes ou de colonies.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: dans le pays qu’ils possédaient
  rationale: אֲחֻזָּה désigne une possession territoriale. La proposition relative est plus idiomatique en français que « le pays de leur possession » tout en gardant le sens.
- source_word: הוּא עֵשָׂו
  choice: C’est Ésaü
  rationale: Cette identification conclusive renvoie à l’ensemble de la généalogie et évite que le pronom français « il » soit compris comme renvoyant au dernier nom, Iram.
- source_word: אֲבִי אֱדֹם
  choice: le père d’Édom
  rationale: La formulation préserve l’idiome généalogique hébreu; « père » désigne ici le fondateur ancestral du peuple d’Édom.
theological_decisions:
- issue: Titre généalogique d’Ésaü comme fondateur ancestral d’Édom
  choice: le père d’Édom
  alternative: l’ancêtre des Édomites
  rationale: « Père d’Édom » préserve la formulation hébraïque et son association entre territoire, peuple et ancêtre, tandis que la note explicite le sens ethnique sans ajouter de portée doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « chef » reproduit la structure de la liste; « lieux d’habitation » évite un terme administratif trop moderne. Les marqueurs [a] et [b] figurent dans le texte principal.
