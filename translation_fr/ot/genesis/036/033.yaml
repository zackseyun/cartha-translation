lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מוּת fait avancer le récit. Le passé simple convient au registre narratif biblique en français et le sujet Béla est exprimé naturellement.
- source_word: בָּלַע
  choice: Béla
  rationale: Translittération française usuelle de ce nom propre.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession royale, מלך désigne l’accession et l’exercice de la royauté ; « régna » est la formulation française la plus concise et naturelle.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: תחת avec suffixe pronominal indique que Jobab succède au roi précédent.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Translittération française traditionnelle et transparente du nom propre.
- source_word: בֶּן זֶרַח
  choice: fils de Zérah
  rationale: Le groupe construit hébreu donne le patronyme de Jobab ; il est rendu directement.
- source_word: מִבָּצְרָה
  choice: venu de Botsra
  rationale: La préposition מִן indique le plus naturellement la provenance. La note conserve la possibilité plus large d’une association avec la ville.
