  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: fr
  text: Béla mourut, et Jobab, fils de Zérah, originaire de Botsra[a], régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Botsra ». La préposition hébraïque peut indiquer l’origine ou, plus largement, une association avec cette ville.
