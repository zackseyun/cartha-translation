  text: כִּֽי הָיָ֧ה רְכוּשָׁ֛/ם רָ֖ב מִ/שֶּׁ֣בֶת יַחְדָּ֑ו וְ/לֹ֨א יָֽכְלָ֜ה אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ לָ/שֵׂ֣את אֹתָ֔/ם מִ/פְּנֵ֖י מִקְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: fr
  text: En effet, leurs biens étaient trop importants pour qu’ils puissent habiter ensemble, et le pays où ils séjournaient[a] ne pouvait pas les faire vivre[b], à cause de leurs troupeaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pays de leurs séjours » ; l’hébreu évoque leur résidence temporaire comme étrangers établis dans le pays.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne pouvait pas les porter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: En effet
  rationale: La conjonction introduit ici l’explication de la séparation rapportée au verset précédent.
- source_word: רְכוּשָׁם
  choice: leurs biens
  rationale: Le terme désigne largement les possessions, notamment les biens meubles; « biens » est naturel et suffisamment englobant en français.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: étaient trop abondants pour qu’ils puissent habiter ensemble
  rationale: La construction exprime une abondance qui rend la cohabitation impraticable. « Habiter ensemble » restitue clairement le sens de l’infinitif שׁבת.
- source_word: אֶרֶץ מְגֽוּרֵיהֶם
  choice: le pays où ils séjournaient
  rationale: Cette formulation française naturelle conserve l’idée d’un séjour non permanent; une note explicite la tournure hébraïque et le statut de résidents temporaires.
- source_word: לָשֵׂאת אֹתָם
  choice: subvenir à leurs besoins
  rationale: נשא signifie littéralement « porter »; avec le pays pour sujet, la locution exprime ici sa capacité à faire vivre les personnes et leurs possessions.
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: à cause de leurs troupeaux
  rationale: מִפְּנֵי marque la cause, et מִקְנֶה désigne collectivement le bétail. « Troupeaux » convient naturellement au contexte pastoral.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « En effet » relie explicitement le verset à la séparation précédente. « Le pays où ils séjournaient » évite l’archaïsme de « pays de leur séjour » tout en maintenant, par la note, le motif du séjour temporaire. Les marqueurs suivent immédiatement les expressions qu’ils expliquent.
