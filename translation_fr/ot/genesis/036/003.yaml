lexical_decisions:
- source_word: וְ/אֶת
  choice: et
  rationale: Dans cette liste, וְ ajoute une autre épouse d’Ésaü, tandis que אֵת est le marqueur du complément d’objet direct et ne se traduit pas en français.
- source_word: בָּשְׂמַת
  choice: Basemath
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: בַּת
  choice: fille de
  rationale: L’état construit exprime la filiation; le français naturel n’exige pas d’article dans cette apposition.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: Forme française usuelle du nom propre hébreu.
- source_word: אֲחוֹת
  choice: sœur de
  rationale: L’état construit exprime le lien de parenté; la coordination avec « et » rend clairement la seconde apposition.
- source_word: נְבָיוֹת
  choice: Nebayoth
  rationale: Translittération proche de l’hébreu, qui conserve la consonne finale du nom; les graphies françaises varient selon les traditions éditoriales.
