  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: fr
  text: 'Et voici les noms des chefs d’Ésaü, selon leurs clans, selon leurs lieux, selon leurs noms : le chef Timna[a], le chef Alva[b], le chef Yéteth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Timna est aussi transcrit « Timnah ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Alva » ; voir la forme apparentée « Alia » en 1 Chroniques 1.51.'
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Dans l’introduction d’une liste, « Voici » rend naturellement la fonction présentative de la formule hébraïque; la continuité assurée par ו n’exige pas nécessairement un « Et » en français moderne.
- source_word: שְׁמוֹת אַלּוּפֵי עֵשָׂו
  choice: les noms des chefs d’Ésaü
  rationale: Le construit hébreu est conservé. « Chefs » exprime le titre tribal ou clanique sans employer le terme historiquement trompeur « ducs ».
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici les groupes de parenté au sein de l’organisation tribale; « clans » convient mieux que « familles » dans ce contexte.
- source_word: לִמְקֹמֹתָם
  choice: selon leurs lieux
  rationale: Cette formulation demeure proche du terme général מָקוֹם et évite de préciser sans certitude s’il s’agit de territoires, de régions ou de localités.
- source_word: בִּשְׁמֹתָם
  choice: d’après leurs noms
  rationale: 'La préposition ב introduit ici le principe d’énumération: les chefs sont indiqués nominalement. Cette tournure distingue naturellement la dernière expression des deux « selon » précédents.'
- source_word: אַלּוּף
  choice: le chef
  rationale: Le titre est répété devant chaque nom comme dans l’hébreu. La minuscule est conforme à l’usage français pour un titre commun.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Transcription française simple de la forme massorétique; le h final rencontré dans certaines traditions de translittération ne représente pas une consonne du texte.
- source_word: עַלְוָה
  choice: Alva
  rationale: Transcription française de la forme massorétique עַלְוָה. Elle n’est pas harmonisée avec la forme apparentée d’1 Chroniques 1.51.
- source_word: יְתֵת
  choice: Yéteth
  rationale: Le yod initial est rendu par Y, conformément à l’usage français, et la vocalisation massorétique est représentée sans harmonisation avec un autre nom semblable.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétitive de la liste et le titre אַלּוּף sont conservés, tandis que l’ordre syntaxique est légèrement naturalisé. Les marqueurs de note sont placés après les noms auxquels leurs notes se rapportent.
