  yaml_path: translation/ot/genesis/036/036.yaml
  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: fr
  text: Hadad mourut, et Samla, de Masréqa[a], régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « originaire de Masréqa ». La préposition hébraïque peut indiquer l’origine ou, plus largement, un lien avec un lieu.
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מות fait avancer le récit; le passé simple convient au style narratif concis de cette liste royale.
- source_word: הֲדָד
  choice: Hadad
  rationale: Le nom propre est translittéré selon l’usage français courant.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession, מלך désigne l’exercice de la royauté; « régna » est précis, concis et naturel.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: תחת avec suffixe marque ici le remplacement dans la succession, et non seulement une postériorité chronologique.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Le nom propre est translittéré sous une forme naturelle en français.
- source_word: מִמַּשְׂרֵקָה
  choice: originaire de Masréqa
  rationale: La préposition מִן indique normalement la provenance, tout en pouvant signaler plus largement un lien avec le lieu; « originaire de » exprime naturellement la provenance en français.
