  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: fr
  text: 'Voici les noms des fils d’Ésaü : Élifaz, fils d’Ada, femme d’Ésaü ; Réouel, fils de Basmath, femme d’Ésaü.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Voici les noms
  rationale: La tournure présentative « Voici » rend naturellement en français la force déictique de אֵלֶּה dans l’introduction de la liste.
- source_word: בְּנֵי עֵשָׂו
  choice: des fils d’Ésaü
  rationale: בְּנֵי désigne ici les fils masculins nommés dans la généalogie ; « fils » est donc plus précis qu’« enfants ».
- source_word: אֱלִיפַז
  choice: Éliphaz
  rationale: Translittération française biblique usuelle du nom hébreu.
- source_word: בֶּן עָדָה
  choice: fils d’Ada
  rationale: בֶּן exprime la filiation directe ; l’apposition sans article est naturelle dans le style généalogique français.
- source_word: אֵשֶׁת עֵשָׂו
  choice: femme d’Ésaü
  rationale: Le syntagme construit signifie « femme d’Ésaü ». Sa répétition après le nom de chaque mère est conservée, conformément au texte hébreu.
- source_word: רְעוּאֵל
  choice: Réouel
  rationale: Translittération française directe et courante de la forme hébraïque רְעוּאֵל.
- source_word: בֶּן בָּשְׂמַת
  choice: fils de Basmath
  rationale: Même construction de filiation que précédemment, rendue de manière cohérente.
- source_word: בָּשְׂמַת
  choice: Basmath
  rationale: Forme française biblique courante du nom propre hébreu.
