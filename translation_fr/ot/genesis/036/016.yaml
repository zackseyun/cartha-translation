base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: fr
  text: 'Le chef Qorah, le chef Gatam, le chef Amalec : voilà les chefs d’Élifaz dans le pays d’Édom; voilà les fils d’Ada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: chef
  rationale: Dans cette généalogie édomite, le terme désigne un dirigeant de clan ou de groupe; « chef » est naturel et conserve la portée institutionnelle sans la préciser excessivement.
- source_word: קֹרַח
  choice: Qorah
  rationale: Translittération française qui distingue la consonne initiale hébraïque qoph.
- source_word: גַּעְתָּם
  choice: Gatam
  rationale: Translittération proche de la forme massorétique Gaʿtam; l’ayn n’est pas représenté afin de garder une forme lisible en français courant.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: בְּנֵי
  choice: fils
  rationale: Rend directement le terme généalogique hébreu; dans ce contexte, il peut désigner les descendants ou membres de la lignée.
theological_decisions:
- issue: Rapport généalogique entre les chefs, Élifaz et Ada
  choice: Conserver littéralement « issus d’Élifaz » puis « fils d’Ada »
  alternative: Expliciter « descendants d’Élifaz » et « petits-fils d’Ada »
  rationale: Le texte emploie d’abord une construction d’appartenance avec Élifaz, puis « fils d’Ada ». La formulation retenue préserve la manière généalogique souple de l’hébreu sans imposer un degré précis de filiation.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « le chef » reproduit la structure de la liste hébraïque. Deux phrases remplacent la ponctuation longue de l’anglais pour une lecture naturelle.
