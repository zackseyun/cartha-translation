source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/מְּלָכִ֔ים אֲשֶׁ֥ר מָלְכ֖וּ בְּ/אֶ֣רֶץ אֱד֑וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: fr
  text: Voici les rois qui régnèrent dans le pays d’Édom avant qu’un roi ne règne sur les fils d’Israël[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avant qu’un roi ne règne sur les Israélites ». L’hébreu dit littéralement : « avant qu’un roi ne règne pour/sur les fils d’Israël ».'
    reason: Alternative lexicale et indication de la formulation littérale hébraïque.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: La formule présente une nouvelle liste. « Voici » rend naturellement cette fonction introductive en français, sans alourdir la phrase par un « et » peu nécessaire.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: les rois qui régnèrent
  rationale: L’article défini est conservé, et le verbe מלך au qal désigne ici l’exercice de la royauté. Le passé simple convient au registre narratif et à une liste de règnes achevés.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: dans le pays d’Édom
  rationale: Cette formulation conserve explicitement אֶרֶץ, « pays/territoire », plutôt que de réduire l’expression à « en Édom ».
- source_word: לִפְנֵי
  choice: avant que
  rationale: La préposition a ici un sens temporel clair; la construction française « avant que » introduit naturellement la proposition suivante.
- source_word: מְלָךְ מֶלֶךְ
  choice: un roi ne règne
  rationale: Le singulier indéfini hébreu est rendu directement par « un roi ». Le « ne » est explétif après « avant que » et n’exprime pas une négation.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sur les fils d’Israël
  rationale: « Fils d’Israël » préserve la forme de l’expression hébraïque, tandis que « sur » explicite la relation de gouvernement naturellement associée au verbe « régner ».
theological_decisions:
- issue: Traduction de בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les Israélites
  rationale: L’expression est un ethnonyme désignant le peuple d’Israël, mais la traduction retenue conserve l’image généalogique et la forme du texte source sans imposer une interprétation confessionnelle.
- issue: Valeur de לְ dans לִבְנֵי יִשְׂרָאֵל
  choice: sur
  alternative: pour
  rationale: Avec « régner », « sur » exprime le plus naturellement en français la relation royale envers le peuple. Une note conserve toutefois l’alternative plus formelle « pour », puisque la préposition hébraïque peut laisser subsister cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple marque le registre narratif biblique sans archaïsme excessif. « Ne règne » contient un ne explétif standard après « avant que ».
