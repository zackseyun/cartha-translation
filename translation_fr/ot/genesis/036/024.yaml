base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: fr
  text: 'Voici les fils de Tsibéon : Aya et Ana. C’est cet Ana qui trouva les yémim[a] dans le désert, alors qu’il faisait paître les ânes de son père Tsibéon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu yémim est incertain. On l’a compris comme désignant des « sources chaudes » ou, dans certaines interprétations anciennes et plus tardives, des « mulets ». Le texte conserve le terme hébreu parce que les données lexicales ne permettent pas de trancher.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: fils de
  rationale: Dans cette généalogie, le terme désigne directement les descendants masculins immédiats.
- source_word: צִבְעוֹן
  choice: Tsibéon
  rationale: Translittération française courante du nom propre hébreu.
- source_word: אַיָּה
  choice: Aya
  rationale: Translittération simple et naturelle en français moderne.
- source_word: עֲנָה
  choice: Ana
  rationale: Translittération française cohérente du nom propre dans la généalogie.
- source_word: הוּא עֲנָה
  choice: C’est cet Ana
  rationale: Cette formulation rend la valeur identificatrice de la construction et distingue cet Ana d’éventuels homonymes.
- source_word: מָצָא
  choice: trouva
  rationale: Équivalent direct du verbe hébreu, sans préciser indûment s’il s’agit d’une découverte.
- source_word: הַיֵּמִם
  choice: les yémim
  rationale: Le mot hébreu rare est de sens incertain; sa translittération préserve cette incertitude dans le texte principal.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: En français biblique moderne, « désert » rend naturellement מִדְבָּר sans nécessairement désigner une étendue entièrement aride.
- source_word: בִּרְעֹתוֹ
  choice: alors qu’il faisait paître
  rationale: La construction indique une action simultanée; « faire paître » convient à la garde des ânes.
- source_word: הַחֲמֹרִים
  choice: les ânes
  rationale: Équivalent français actuel et précis.
- source_word: לְצִבְעוֹן אָבִיו
  choice: de son père Tsibéon
  rationale: Le français exprime naturellement par « de » l’appartenance ou la relation de service indiquée ici par la préposition hébraïque.
theological_decisions:
- issue: Identification des יֵמִם
  choice: Conserver « yémim » dans le texte et signaler l’incertitude en note.
  alternative: Traduire par « sources chaudes » ou « mulets ».
  rationale: Les données lexicales ne permettent pas de trancher avec assurance; choisir une interprétation dans le texte résoudrait indûment une ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit généalogique bref. Les noms sont translittérés selon des formes françaises naturelles, et le terme lexicalement incertain est conservé avec une note explicative.
