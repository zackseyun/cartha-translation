  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: fr
  text: 'Voici les fils de Dishân : Hemdân, Eshbân, Yitrân et Kerân.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Voici
  rationale: Cette tournure introduit naturellement en français moderne une liste généalogique et rend la valeur présentative de la proposition hébraïque sans verbe.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le terme désigne ici les fils immédiats nommés dans la liste; cette traduction reste plus précise et plus proche de l’hébreu que « descendants ».
- source_word: דִישָׁן
  choice: Dishân
  rationale: Le nom propre est translittéré; l’accent circonflexe signale la voyelle longue dans une forme française lisible.
- source_word: חֶמְדָּן
  choice: Hemdân
  rationale: Translittération française directe du nom hébreu.
- source_word: וְ/אֶשְׁבָּן
  choice: Eshbân
  rationale: Le nom est translittéré, tandis que la coordination hébraïque est rendue selon la ponctuation naturelle d’une énumération française.
- source_word: וְ/יִתְרָן
  choice: Yitrân
  rationale: La graphie « Y » représente clairement le yod initial en français et évite une forme traditionnelle moins transparente.
- source_word: וּ/כְרָן
  choice: et Kerân
  rationale: La conjonction est exprimée devant le dernier élément de la liste; « K » rend sans ambiguïté le kaf hébreu en français.
