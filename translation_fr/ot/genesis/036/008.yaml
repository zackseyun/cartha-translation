  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: fr
  text: Ésaü s’établit dans la région montagneuse de Séir[a] ; Ésaü est Édom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les montagnes de Séir » ou « sur le mont Séir ».
    reason: 'Alternative lexicale et géographique : הַר peut désigner une montagne particulière ou une région montagneuse.'
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: s’établit
  rationale: Le verbe ישׁב, sous forme narrative, exprime ici le fait de fixer sa résidence. « S’établit » convient au contexte territorial tout en restant naturel en français moderne.
- source_word: בְּהַר
  choice: dans la région montagneuse de
  rationale: הַר peut désigner une montagne ou une zone montagneuse. Avec Séir comme territoire, « région montagneuse » évite de réduire le lieu à un sommet unique.
- source_word: שֵׂעִיר
  choice: Séir
  rationale: Nom géographique rendu selon sa forme française traditionnelle.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: הוּא אֱדוֹם
  choice: Ésaü, c’est Édom
  rationale: Cette formulation rend directement la proposition nominale d’identification tout en restant idiomatique en français.
