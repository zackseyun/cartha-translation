  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּ/הַ֖ר שֵׂעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: fr
  text: Voici la descendance d’Ésaü, père d’Édom, dans la région montagneuse de Séir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur le mont Séir » ou « dans les montagnes de Séir ».'
    reason: L’hébreu בְּהַר שֵׂעִיר peut évoquer un mont particulier, un massif ou une région montagneuse.
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Voici
  rationale: Dans cette formule structurante de la Genèse, « Voici » rend naturellement l’introduction hébraïque en français. La coordination וְ n’a pas besoin d’être reproduite par « Et » pour conserver le lien avec le contexte.
- source_word: תֹּלְדוֹת
  choice: la descendance
  rationale: Le terme désigne ici la lignée issue d’Ésaü, détaillée dans la section qui suit. « Descendance » est idiomatique en français moderne tout en conservant la fonction généalogique de la formule récurrente.
- source_word: עֵשָׂו
  choice: Ésaü
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֲבִי
  choice: père de
  rationale: Rend directement le rapport de progéniteur exprimé par l’état construit, sans exclure qu’Édom désigne ici le peuple issu d’Ésaü.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Forme française usuelle du nom propre, qui peut désigner le peuple ou le territoire associé aux descendants d’Ésaü.
- source_word: בְּ/הַר
  choice: dans la région montagneuse de
  rationale: Dans cette expression géographique, הַר peut désigner un massif ou une contrée montagneuse plutôt qu’un sommet unique. Cette formulation française exprime naturellement la localisation sans trancher en faveur d’une montagne isolée.
- source_word: שֵׂעִיר
  choice: Séir
  rationale: Forme française usuelle du nom géographique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formule généalogique reste reconnaissable, mais « descendance » est préférée à « générations », moins naturel ici en français. Le marqueur de note est placé après le groupe géographique auquel il se rapporte.
