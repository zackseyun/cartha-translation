  text: וְ/אֵ֥לֶּה בְנֵֽי עֲנָ֖ה דִּשֹׁ֑ן וְ/אָהֳלִיבָמָ֖ה בַּת עֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/025.yaml
  text: 'And these were the sons of Anah: Dishon and Oholibamah daughter of Anah.'
translation:
  language: fr
  text: 'Voici les fils d’Ana : Dishôn et Oholibama, fille d’Ana.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: fils
  rationale: Le nom masculin pluriel signifie ici « fils ». Bien qu’Oholibama soit ensuite appelée « fille », la formulation hébraïque est conservée plutôt que généralisée en « enfants ».
- source_word: דִּשֹׁן
  choice: Dishôn
  rationale: Transcription française du nom hébreu, avec accent circonflexe indiquant la voyelle longue.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Transcription française claire et usuelle du nom hébreu.
- source_word: בַּת
  choice: fille
  rationale: Traduction directe du terme hébreu désignant une fille.
theological_decisions:
- issue: Discordance apparente entre « les fils d’Ana » et la mention d’Oholibama comme « fille d’Ana »
  choice: Conserver littéralement « les fils d’Ana » puis « fille d’Ana »
  alternative: Employer « les enfants d’Ana » pour harmoniser le genre
  rationale: Le texte massorétique porte explicitement בְנֵי (« fils de ») et בַּת (« fille de »). La traduction préserve cette tension textuelle sans la résoudre silencieusement.
translation_notes:
  register: Français moderne, naturel et digne. La construction brève suit étroitement l’hébreu tout en employant une ponctuation française fluide.
