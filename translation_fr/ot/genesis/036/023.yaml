  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: fr
  text: 'Voici les fils de Shobal : Alvan[a], Manahath, Ébal, Shepho[b] et Onam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « Alvan »; la généalogie parallèle en 1 Chroniques 1.40 porte « Alian ».
    reason: alternative_reading
  - marker: b
    text: L’hébreu porte « Shepho »; la généalogie parallèle en 1 Chroniques 1.40 porte « Shephi ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Voici
  rationale: La formule présente naturellement en français moderne le nouvel élément de la généalogie; le waw introductif n’a pas besoin d’être rendu séparément.
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le contexte donne une liste de descendants masculins directs; « fils » est donc plus précis que « enfants » ou « descendants ».
- source_word: שׁוֹבָל
  choice: Shobal
  rationale: Nom propre translittéré d’après la forme hébraïque.
- source_word: עַלְוָן
  choice: Alvan
  rationale: Translittération de la forme du texte massorétique de la Genèse; la variante de 1 Chroniques 1.40 est signalée en note.
- source_word: וּ/מָנַחַת
  choice: Manahath
  rationale: Nom propre translittéré; la conjonction préfixée est rendue par la ponctuation française de l’énumération.
- source_word: וְ/עֵיבָל
  choice: Ébal
  rationale: Nom propre translittéré selon l’usage français, avec accent initial pour guider la prononciation.
- source_word: שְׁפוֹ
  choice: Shepho
  rationale: Translittération de la forme massorétique de ce verset; la forme parallèle de 1 Chroniques 1.40 est conservée en note.
- source_word: וְ/אוֹנָם
  choice: et Onam
  rationale: Le waw est rendu par « et » devant le dernier nom, conformément à l’usage français dans une énumération.
