  text: וְ/אֵ֗לֶּה בְּנֵ֤י אָהֳלִֽיבָמָה֙ אֵ֣שֶׁת עֵשָׂ֔ו אַלּ֥וּף יְע֛וּשׁ אַלּ֥וּף יַעְלָ֖ם אַלּ֣וּף קֹ֑רַח אֵ֣לֶּה אַלּוּפֵ֞י אָֽהֳלִיבָמָ֛ה בַּת עֲנָ֖ה אֵ֥שֶׁת עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: fr
  text: 'Voici les fils d’Oholibama, femme d’Ésaü : le chef Jéoush, le chef Yaelam et le chef Koré. Ce sont là les chefs d’Oholibama, fille d’Anah et femme d’Ésaü.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chefs de clan ». Le terme hébreu désigne les dirigeants de groupes ou de clans édomites.
    reason: alternative lexicale
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le masculin pluriel désigne ici les trois fils nommés; « descendants » serait trop large.
- source_word: אֵשֶׁת עֵשָׂו
  choice: femme d’Ésaü
  rationale: Rendu idiomatique et fidèle du groupe construit, conservé aux deux occurrences.
- source_word: אַלּוּף
  choice: chef
  rationale: Dans le contexte édomite de Genèse 36, le terme désigne le dirigeant d’un groupe ou d’un clan; « chef » reste concis et actuel.
- source_word: יְעוּשׁ
  choice: Yeoush
  rationale: Transcription française destinée à rendre approximativement la forme hébraïque.
- source_word: יַעְלָם
  choice: Yalam
  rationale: Transcription française proche de la forme hébraïque.
- source_word: קֹרַח
  choice: Coré
  rationale: Forme française traditionnelle et intelligible du nom biblique.
- source_word: אֵלֶּה אַלּוּפֵי
  choice: Ce sont là les chefs issus de
  rationale: La formule récapitule les fils précédemment nommés comme chefs rattachés généalogiquement à Oholibama; « issus de » explicite naturellement ce rapport sans l’élargir au-delà du contexte.
- source_word: בַּת עֲנָה
  choice: fille d’Ana
  rationale: Rendu direct du groupe construit hébreu.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: Voici ... Ce sont là
  rationale: Cette reprise conserve l’encadrement démonstratif de la notice généalogique dans un français naturel.
