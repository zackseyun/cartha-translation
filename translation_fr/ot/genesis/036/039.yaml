  text: וַ/יָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן עַכְבּוֹר֒ וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ר וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עוּ וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵֽיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: fr
  text: Baal-Hanân, fils d’Akbor, mourut, et Hadar[a] régna à sa place. Sa ville s’appelait Paou[b], et sa femme s’appelait Mehétabel, fille de Matred, elle-même fille de Mé-Zahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quelques traditions textuelles et 1 Chroniques 1.50 portent « Hadad » au lieu de « Hadar ».
    reason: textual_variant
  - marker: b
    text: En 1 Chroniques 1.50, cette ville est appelée « Paï ».
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le verbe מות désigne directement la mort; « mourut » est sobre, naturel et sans euphémisme.
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: Baal-Hanân, fils d’Akbor
  rationale: Les noms propres sont translittérés, et la relation généalogique exprimée par בן est rendue directement par « fils de ».
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: régna à sa place
  rationale: Cette formulation restitue à la fois l’exercice de la royauté et la succession indiquée par תַּחְתָּיו.
- source_word: הֲדַר
  choice: Hadar
  rationale: Le texte massorétique fourni porte Hadar; la variante Hadad est signalée en note.
- source_word: וְשֵׁם עִירוֹ פָּעוּ
  choice: Sa ville s’appelait Paou
  rationale: Formulation française naturelle qui conserve le sens de la tournure hébraïque « le nom de sa ville était ».
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: sa femme s’appelait Mehétabel
  rationale: Rendu idiomatique de la formule hébraïque tout en conservant explicitement la relation conjugale.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: fille de Matred, fille de Mé-Zahab
  rationale: La répétition de בַּת est préservée afin de ne pas trancher silencieusement la portée syntaxique ou généalogique de la seconde expression.
