translation_notes:
  register: Français international moderne, sobre et digne. Les formules hébraïques relatives aux noms ont été rendues idiomatiquement par « s’appelait ». La chaîne généalogique finale reste formellement proche de l’hébreu, avec une note explicitant l’autre lecture syntaxique.
