  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: fr
  text: Ésaü prit avec lui ses femmes, ses fils, ses filles, toutes les personnes de sa maisonnée, son bétail, toutes ses bêtes et tous les biens qu’il avait acquis au pays de Canaan. Puis il partit vers un pays[a] à cause de son frère Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « vers un pays ». Certains manuscrits et des versions anciennes appuient la leçon « vers le pays de Séir » ; on traduit aussi parfois, d’après le contexte, « vers un autre pays ».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit avec lui
  rationale: Le verbe signifie littéralement « prendre » ; dans ce contexte de déplacement, « prit avec lui » exprime naturellement qu’Ésaü emmena les personnes et les biens énumérés.
- source_word: נָשָׁיו
  choice: ses femmes
  rationale: Le pluriel désigne ici les épouses d’Ésaü. En français biblique courant, « ses femmes » est naturel et non ambigu dans ce contexte.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: ses fils, ses filles
  rationale: L’hébreu distingue explicitement les fils des filles ; la traduction conserve cette distinction.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: toutes les personnes de sa maisonnée
  rationale: Dans cette expression, נֶפֶשׁ désigne des personnes plutôt que des « âmes » au sens théologique. « Maisonnée » inclut tous ceux qui appartiennent à la maison.
- source_word: מִקְנֵהוּ
  choice: son bétail
  rationale: מִקְנֶה désigne ici l’ensemble des animaux domestiques constituant le cheptel d’Ésaü.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: toutes ses bêtes
  rationale: בְּהֵמָה est un terme large pour les animaux. « Bêtes » permet de garder une distinction avec le « bétail » déjà mentionné.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: tous les biens qu’il avait acquis
  rationale: קִנְיָן désigne les biens ou possessions, et רכשׁ souligne leur acquisition. Le plus-que-parfait convient à la séquence narrative.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: au pays de Canaan
  rationale: « Pays de Canaan » rend l’expression géographique avec naturel en français moderne.
- source_word: אֶל אֶרֶץ
  choice: vers un pays
  rationale: Le texte massorétique porte littéralement « vers un pays ». La traduction conserve cette formulation indéfinie plutôt que d’ajouter « un autre » ou d’identifier le pays dans le corps du texte.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: à cause de son frère Jacob
  rationale: מִפְּנֵי peut avoir une valeur spatiale ou causale. Le verset suivant, qui explique que leurs biens empêchaient leur cohabitation, soutient ici la valeur causale sans effacer entièrement la tension du passage.
theological_decisions:
- issue: Valeur de מִפְּנֵי dans le départ d’Ésaü
  choice: à cause de son frère Jacob
  alternative: loin de son frère Jacob
  rationale: La traduction retient la relation causale éclairée par Genèse 36.7. Elle n’implique ni hostilité personnelle ni jugement moral absent du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase hébraïque longue est divisée en deux phrases pour une lecture naturelle. Les termes concrets et les répétitions significatives de l’énumération sont conservés.
