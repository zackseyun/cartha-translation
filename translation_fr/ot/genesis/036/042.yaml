translation:
  language: fr
  text: le chef Qenaz[a], le chef Témân, le chef Mibtsar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef de clan », pour chacune des trois occurrences de « chef » dans ce verset.
