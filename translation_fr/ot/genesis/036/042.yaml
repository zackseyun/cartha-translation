lexical_decisions:
- source_word: אַלּוּף
  choice: chef
  rationale: Dans la liste des chefs édomites de Genèse 36, le terme désigne un dirigeant tribal ou clanique. « Chef » est concis, naturel en français moderne et respecte la structure répétitive de l’hébreu sans préciser plus que le texte.
- source_word: קְנַז
  choice: Qenaz
  rationale: Nom propre transcrit de l’hébreu ; la graphie avec Q rend distinctement la consonne initiale ק et reste conforme à un usage biblique français courant.
- source_word: תֵּימָן
  choice: Témân
  rationale: Ici, le mot fonctionne comme un nom propre dans la liste édomite ; il est donc transcrit plutôt que traduit selon son sens lexical possible (« sud »).
- source_word: מִבְצָר
  choice: Mibtsar
  rationale: Nom propre transcrit de l’hébreu. « ts » représente naturellement en français la consonne צ, sans traduire le nom d’après son sens lexical possible.
