  text: וַ/יָּ֖מָת יוֹבָ֑ב וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו חֻשָׁ֖ם מֵ/אֶ֥רֶץ הַ/תֵּימָנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/034.yaml
  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: fr
  text: Jobab mourut, et Housham, du pays des Témanites[a], régna à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « du pays de Témân » ou « du pays du Témanite ». La forme hébraïque peut désigner soit la région associée à Témân, soit son peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mourut
  rationale: Le wayyiqtol de מות exprime ici un événement passé qui fait avancer la succession narrative; le passé simple convient au registre généalogique et royal.
- source_word: יוֹבָב
  choice: Jobab
  rationale: Nom propre transcrit selon l’usage français courant.
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette formule de succession, מלך désigne l’accession et l’exercice de la royauté; « régna » est concis et naturel.
- source_word: תַּחְתָּיו
  choice: à sa place
  rationale: תחת avec suffixe pronominal marque ici le remplacement dans la fonction royale.
- source_word: חֻשָׁם
  choice: Housham
  rationale: Transcription française du nom propre hébreu, avec « ou » pour la voyelle /u/ et « sh » pour rendre la consonne שׁ de façon accessible.
- source_word: מֵאֶרֶץ
  choice: du pays
  rationale: מן avec אֶרֶץ indique l’origine géographique; « du pays » est naturel en français tout en conservant cette valeur.
- source_word: הַתֵּימָנִי
  choice: des Témanites
  rationale: La forme avec article est un gentilé lié à Témân. Après « pays », le pluriel collectif « des Témanites » donne un français naturel sans effacer l’ambiguïté, signalée en note.
