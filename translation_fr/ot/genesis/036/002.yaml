  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: fr
  text: 'Ésaü prit ses femmes parmi les filles de Canaan : Ada, fille d’Élon le Hittite, et Oholibama, fille d’Ana, fille de Tsibeon le Hivite[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le Hivite ». Certains interprètes harmonisent cette désignation avec des généalogies apparentées et comprennent autrement cette lignée, notamment : « le Horite ».'
    reason: Lecture alternative liée à une tension généalogique entre passages apparentés.
lexical_decisions:
- source_word: לָקַח
  choice: prit
  rationale: Le verbe signifie littéralement « prendre ». Dans ce résumé généalogique, « prit ses femmes » reste proche de l’hébreu sans expliciter davantage par « épousa ».
- source_word: נָשָׁיו
  choice: ses femmes
  rationale: Dans ce contexte, le pluriel d’אִשָּׁה désigne sans ambiguïté les épouses d’Ésaü; « ses femmes » est l’expression française naturelle correspondante.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: parmi les filles de Canaan
  rationale: Cette formulation conserve l’image hébraïque des « filles de Canaan » tout en rendant naturellement la préposition de provenance ou de sélection.
- source_word: בַּת
  choice: fille de
  rationale: Le terme construit exprime directement la filiation et reçoit une traduction uniforme dans les deux généalogies.
- source_word: הַחִתִּי
  choice: le Hittite
  rationale: « Hittite » est l’ethnonyme français courant correspondant au texte massorétique.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Transcription française claire du nom hébreu, conforme à un usage biblique courant.
- source_word: הַחִוִּי
  choice: le Hivite
  rationale: Le texte consonantique et la vocalisation massorétique portent « Hivite ». Cette leçon est donc maintenue dans le texte principal, sans harmonisation avec les notices apparentées.
theological_decisions:
- issue: Désignation ethnique dans la proposition finale
  choice: 'Suivre le texte massorétique : « le Hivite »'
  alternative: « le Horite », selon une harmonisation avec des généalogies apparentées, notamment Genèse 36.20
  rationale: La tension généalogique est réelle, mais le texte hébreu reçu doit rester prioritaire. L’autre compréhension est signalée en note plutôt que substituée silencieusement au texte.
translation_notes:
  register: Français international moderne, sobre et digne. La structure généalogique répétitive est conservée. « Parmi les filles de Canaan » rend l’idiome hébreu avec naturel, et la note est placée après « le Hivite », terme auquel elle se rapporte.
