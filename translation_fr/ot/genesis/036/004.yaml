  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: donna
  rationale: Les deux formes viennent de ילד, « enfanter, donner naissance ». Dans une généalogie, « donna [un fils] à » est une tournure française concise et naturelle qui garde la mère pour sujet.
- source_word: לְעֵשָׂו
  choice: à Ésaü
  rationale: Avec ילד, la préposition ל indique ici le père. « Donna Éliphaz à Ésaü » restitue cette relation sans ajouter d’explication absente de l’hébreu.
- source_word: אֵת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu du complément d’objet direct, représenté en français par la syntaxe.
- source_word: אֱלִיפָז
  choice: Éliphaz
  rationale: Translittération française traditionnelle et aisément reconnaissable du nom hébreu.
- source_word: בָשְׂמַת
  choice: Basmath
  rationale: Forme française traditionnelle du nom propre hébreu.
- source_word: רְעוּאֵל
  choice: Réouel
  rationale: Translittération française qui reflète de près la vocalisation massorétique du nom.
- source_word: וּ
  choice: et
  rationale: Conjonction simple reliant les deux notices de naissance.
