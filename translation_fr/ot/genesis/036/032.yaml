translation:
  language: fr
  text: Béla, fils de Béor, régna en Édom[a], et sa ville s’appelait Dinhaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « régna sur Édom ». L’hébreu dit littéralement « régna en Édom » : la préposition indique le lieu, mais le français peut aussi présenter Édom comme le territoire sur lequel s’exerce la royauté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: régna
  rationale: Dans cette liste royale, le verbe מלך désigne l’exercice de la royauté; « régna » est la formulation française naturelle et concise pour une notice de succession.
- source_word: בֶּאֱדֹום
  choice: en Édom
  rationale: La préposition ב marque directement le lieu. « En Édom » préserve cette valeur locative, tandis que « sur Édom » explicite plutôt le domaine soumis à l’autorité royale.
- source_word: בֶּלַע
  choice: Béla
  rationale: Nom propre transcrit selon l’usage français courant.
- source_word: בֶּן בְּעוֹר
  choice: fils de Béor
  rationale: Cette tournure rend directement la relation généalogique exprimée par le construit hébreu.
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: et sa ville s’appelait Dinhaba
  rationale: Cette formulation française naturelle conserve le possessif explicite et l’identification de la ville, sans alourdir la phrase par le calque « le nom de sa ville était ».
