base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: fr
  text: Des oiseaux selon leurs espèces[a], du bétail selon ses espèces et de tous les animaux qui se déplacent sur le sol selon leurs espèces, deux de chaque viendront vers toi pour les garder en vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par espèces » ; les deux formulations rendent le sens classificatoire de לְמִין.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: les oiseaux
  rationale: Le nom collectif עוֹף désigne les créatures volantes; « oiseaux » est ici le terme français courant et naturel.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: selon leurs espèces / selon ses espèces
  rationale: מִין désigne une catégorie ou une sorte. « Selon leurs espèces » exprime la classification sans faire appel à la taxonomie biologique moderne.
- source_word: הַבְּהֵמָה
  choice: le bétail
  rationale: Dans cette énumération, בְּהֵמָה désigne collectivement les grands animaux terrestres, notamment domestiques. « Bétail » préserve le contraste avec les oiseaux et les bêtes qui se déplacent sur le sol.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: toutes les bêtes qui se déplacent sur le sol
  rationale: רֶמֶשׂ évoque les créatures qui se meuvent près du sol. Cette formulation reste naturelle et évite de limiter indûment la catégorie aux seuls animaux qui rampent au sens strict.
- source_word: שְׁנַיִם מִכֹּל
  choice: deux de chaque
  rationale: 'La formule a une valeur distributive: deux représentants de chacune des catégories précédemment mentionnées.'
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: viendront vers toi
  rationale: La préposition אֶל marque le mouvement en direction de Noé; le texte ne précise pas dans cette proposition qu'ils entreront dans l'arche.
- source_word: לְהַחֲיוֹת
  choice: pour que tu les gardes en vie
  rationale: L'infinitif hiphil de חיה exprime ici le but de préserver la vie des animaux.
theological_decisions: []
