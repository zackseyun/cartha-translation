base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: fr
  text: Tu feras une ouverture pour l’arche[a], et tu l’achèveras à une coudée au sommet[b]. Tu placeras la porte de l’arche sur son côté. Tu la feras avec un niveau inférieur, un deuxième et un troisième[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une fenêtre », « une lucarne » ou « un toit » pour l’arche ; le terme hébreu est rare et son sens précis est incertain.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu de cette proposition est difficile. Il peut décrire la manière dont le haut de l’arche devait être achevé ou se rétrécir jusqu’à une coudée.
    reason: textual_or_syntactical_difficulty
  - marker: c
    text: Ou « avec un étage inférieur, un deuxième et un troisième » ; il s’agit de trois niveaux superposés.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: toit
  rationale: Ce nom rare désigne ici un élément situé en haut de l’arche. « Toit » convient au contexte architectural, tandis que « fenêtre », « ouverture » ou « lucarne » restent possibles et sont signalés en note.
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: et tu l’achèveras à une coudée au sommet
  rationale: Le piel de כלה signifie « achever, terminer ». La formulation hébraïque est difficile; cette traduction suit directement ses éléments sans préciser si la coudée désigne une dimension finale, un écart ou un rétrécissement.
- source_word: פֶּתַח
  choice: porte
  rationale: Dans ces instructions de construction, « porte » désigne naturellement l’accès aménagé dans le côté de l’arche; « ouverture » ou « entrée » seraient aussi possibles.
- source_word: בְּצִדָּהּ
  choice: dans son côté
  rationale: La préposition ב indique ici l’emplacement de la porte dans la paroi latérale de l’arche.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: un niveau inférieur, un deuxième et un troisième
  rationale: Ces formes décrivent trois niveaux superposés. « Niveaux » est clair et neutre en français, sans imposer l’image de ponts de navire ou d’étages de bâtiment.
