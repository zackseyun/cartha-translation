  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: fr
  text: Et moi, voici que je fais venir les eaux du déluge sur la terre afin de détruire toute chair qui, sous le ciel, a en elle le souffle de vie[a]. Tout ce qui est sur la terre périra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit de vie ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit ».
    reason: alternative lexicale
lexical_decisions:
- source_word: וַאֲנִי
  choice: Et moi
  rationale: Le pronom indépendant met le sujet en relief. « Et moi » conserve cette insistance et le contraste discursif sans ajouter d’interprétation.
- source_word: הִנְנִי מֵבִיא
  choice: voici que je fais venir
  rationale: « Voici que » rend l’insistance solennelle et l’immédiateté de הִנְנִי, tandis que le présent « je fais venir » reflète la valeur imminente du participe.
- source_word: הַמַּבּוּל מַיִם
  choice: les eaux du déluge
  rationale: Cette formulation française naturelle conserve à la fois le terme spécifique désignant le Déluge et la mention explicite des eaux qui en sont l’agent.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: « Terre » convient à la portée globale du passage, et « sur » rend simplement la préposition hébraïque.
- source_word: לְשַׁחֵת
  choice: afin de détruire
  rationale: L’infinitif préfixé exprime ici le but. « Afin de détruire » explicite naturellement cette relation en français.
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: Cette expression biblique demeure intelligible en français et préserve la vaste référence aux êtres vivants incarnés sans la limiter aux seuls humains.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: qui a en elle le souffle de vie
  rationale: « Souffle de vie » convient au contexte des créatures animées et maintient l’écho au langage de la création. « En elle » reprend collectivement « toute chair ».
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: sous le ciel
  rationale: L’expression désigne tout le domaine situé sous le ciel. Le français omet naturellement la préposition source מִן lorsqu’elle sert à marquer cette étendue.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: Tout ce qui est sur la terre
  rationale: La formulation conserve la portée récapitulative et totale de l’hébreu.
- source_word: יִגְוָע
  choice: périra
  rationale: Le verbe décrit la mort, souvent le fait d’expirer. « Périra » convient au registre solennel du jugement et exprime clairement l’issue fatale.
theological_decisions:
- issue: Sens de רוּחַ dans רוּחַ חַיִּים
  choice: souffle de vie
  alternative: esprit de vie
  rationale: Dans le contexte du Déluge, l’expression désigne le plus naturellement le souffle qui anime les créatures et fait écho au récit de la création. L’autre sens possible de רוּחַ est conservé en note afin de ne pas effacer l’ambiguïté lexicale.
translation_notes:
  register: Français international actuel, clair et digne. Le tour « Et moi, voici que » conserve l’emphase solennelle de l’hébreu sans archaïsme excessif. Le marqueur de note est placé après « souffle de vie », expression à laquelle la note se rapporte.
