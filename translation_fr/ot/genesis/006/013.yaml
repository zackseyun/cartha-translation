  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: fr
  text: 'Alors Dieu dit à Noé : « La fin de toute chair est venue devant moi[a], car la terre[b] est pleine de violence à cause d’eux. Et voici, je vais les détruire avec la terre[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Une fin pour toute chair est venue devant moi. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le pays » ; de même à la fin du verset.'
    reason: lexical_alternative
  - marker: c
    text: 'La construction hébraïque est difficile : « avec la terre » peut exprimer l’accompagnement, ou « la terre » peut être comprise comme un second complément d’objet : « je les détruirai, eux et la terre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: la fin de toute chair
  rationale: « Fin » exprime la cessation annoncée, tandis que « toute chair » conserve l’étendue du syntagme hébreu, plus large que la seule humanité dans le contexte du déluge.
- source_word: בָּא לְפָנַי
  choice: est venue devant moi
  rationale: 'Cette formulation conserve l’image hébraïque et sa possible nuance judiciaire : l’affaire est parvenue devant Dieu pour qu’il prononce son jugement.'
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: la terre est pleine de violence
  rationale: « Violence » rend directement חָמָס dans ce contexte de brutalité et de corruption. « Terre » convient à la portée générale du récit, sans exclure le sens possible de « pays ».
- source_word: מִפְּנֵיהֶם
  choice: à cause d’eux
  rationale: La locution prépositionnelle a ici une valeur causale et désigne les êtres responsables de la violence qui remplit la terre.
- source_word: וְהִנְנִי
  choice: Voici, je vais
  rationale: « Voici » restitue la mise en relief déictique, et « je vais » exprime naturellement l’imminence suggérée par le participe hébreu.
- source_word: מַשְׁחִיתָם
  choice: les détruire
  rationale: Le hifil de שׁחת signifie ici « détruire ». Ce choix convient à l’annonce du jugement, même si l’écho lexical avec la corruption décrite auparavant est moins perceptible en français.
- source_word: אֶת־הָאָרֶץ
  choice: en même temps que la terre
  rationale: La construction hébraïque est difficile après le pronom objet « les ». La traduction principale exprime que leur destruction et celle de la terre ont lieu ensemble, tandis que la note conserve les autres analyses possibles.
theological_decisions:
- issue: Étendue de « toute chair »
  choice: Conserver une expression large pouvant inclure l’ensemble des êtres vivants soumis au jugement.
  alternative: Limiter l’expression à toute l’humanité.
  rationale: Dans le récit du déluge, כָּל־בָּשָׂר désigne régulièrement une catégorie plus large que les seuls humains. La traduction ne restreint donc pas prématurément sa portée.
- issue: Sens de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: La portée générale du récit favorise « terre », mais le sens « pays » demeure lexicalement possible et est signalé en note.
- issue: Rapport syntaxique de אֶת־הָאָרֶץ avec le verbe
  choice: Comprendre que les êtres visés seront détruits en même temps que la terre.
  alternative: 'Comprendre « je les détruis avec la terre » ou faire de « la terre » un second complément d’objet : « je les détruirai, eux et la terre ».'
  rationale: L’hébreu permet difficilement de trancher entre une valeur d’accompagnement et celle d’un second objet. Le texte principal reste naturel en français et la note préserve l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe solennelle de « est venue devant moi » est volontairement conservée pour maintenir l’image et la nuance judiciaire de l’hébreu. « Toute chair » préserve le langage biblique et la portée du texte source sans explicitation doctrinale.
