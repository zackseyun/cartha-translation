    issue: La formulation principale « en même temps que la terre » impose une nuance temporelle.
    rationale: Le dernier syntagme hébreu peut être compris comme comitatif ou comme un second objet. Il convient de ne pas préciser que les destructions ont lieu « en même temps » ; « avec la terre » maintient plus directement l’ambiguïté.
  - severity: low
