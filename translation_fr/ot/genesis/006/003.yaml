  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: fr
  text: 'Alors Yahweh dit : « Mon Esprit ne luttera pas indéfiniment contre l’être humain[a][b], car il est chair[c] ; ses jours seront de cent vingt ans[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon Esprit ne demeurera pas indéfiniment dans l’être humain ». Le verbe hébreu est difficile et peut exprimer l’idée de demeurer plutôt que celle de lutter.
    reason: alternative_reading
  - marker: b
    text: L’hébreu emploie ici adam, un nom singulier utilisé de manière générique pour l’humanité.
    reason: lexical_alternative
  - marker: c
    text: Ou « car lui aussi est chair ». La forme hébraïque est rare, et la valeur exacte de l’élément traduit par « aussi » est discutée.
    reason: alternative_reading
  - marker: d
    text: Les cent vingt ans peuvent désigner une limite imposée aux jours de l’être humain ou le délai restant avant le jugement du déluge ; le verset ne le précise pas explicitement.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans l’hébreu.
- source_word: יָדוֹן
  choice: ne luttera pas toujours contre
  rationale: Le verbe est difficile. Cette formulation française naturelle retient le sens possible d’opposition ou de lutte, sans masquer dans le texte principal le caractère durable exprimé par לְעֹלָם. L’autre interprétation importante, « demeurer dans », est signalée en note.
- source_word: רוּחִי
  choice: Mon Esprit
  rationale: Le possessif renvoie ici naturellement à l’Esprit de Dieu. La majuscule marque ce référent sans imposer au passage des précisions doctrinales postérieures.
- source_word: בָאָדָם
  choice: contre l’être humain
  rationale: אָדָם est un singulier générique qui désigne ici l’humanité. « L’être humain » garde le singulier représentatif sans donner à entendre qu’il ne s’agit que des hommes de sexe masculin.
- source_word: לְעֹלָם
  choice: toujours
  rationale: Dans une proposition négative, « ne… pas toujours » rend naturellement l’idée de « ne… pas indéfiniment / pour toujours ».
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: puisqu’il est chair
  rationale: La forme rare בְּשַׁגַּם est comprise comme causale. « Chair » conserve l’image anthropologique hébraïque sans la réduire à une simple paraphrase telle que « mortel ».
- source_word: וְהָיוּ יָמָיו
  choice: ses jours seront
  rationale: La coordination hébraïque est conservée sans ajouter explicitement un « donc » absent du texte. L’expression « ses jours » maintient aussi l’ambiguïté sur la nature exacte des cent vingt ans.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: cent vingt ans
  rationale: Rendu français direct et littéraire du nombre écrit en toutes lettres.
theological_decisions:
- issue: Sens de l’Esprit de Dieu en relation avec l’humanité
  choice: « Mon Esprit », au sens général de l’Esprit de Dieu dans l’Ancien Testament
  alternative: « mon souffle » ou « mon souffle de vie »
  rationale: רוּחַ peut signifier esprit, souffle ou vent. Le possessif à la première personne dans la parole divine favorise « Mon Esprit », tout en laissant le passage parler sans lui imposer une formulation trinitaire développée.
- issue: Sens du verbe יָדוֹן
  choice: L’Esprit ne luttera pas toujours contre l’être humain
  alternative: L’Esprit ne demeurera pas toujours dans l’être humain
  rationale: Les deux analyses sont anciennes et plausibles. Le texte principal retient le sens d’opposition, tandis que la note préserve clairement l’autre lecture sans résoudre artificiellement la difficulté.
- issue: Portée de אָדָם
  choice: Singulier générique désignant l’être humain et, par représentation, l’humanité
  alternative: « l’homme » ou « les humains »
  rationale: Le singulier hébreu est conservé, mais une formulation française inclusive évite de restreindre involontairement la portée du terme au sexe masculin.
- issue: Portée des cent vingt ans
  choice: Conserver littéralement « ses jours seront de cent vingt ans »
  alternative: Préciser soit une limite de durée de vie, soit un délai avant le déluge
  rationale: Le verset ne précise pas explicitement laquelle de ces deux interprétations est visée. La traduction maintient donc cette tension et la note l’expose.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, mais évite les tournures artificielles. « L’être humain » rend le singulier générique de אָדָם, et les notes conservent les principales ambiguïtés lexicales et interprétatives du passage.
