source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: fr
  text: 'Alors Yahvé dit : « J’effacerai l’homme[a] que j’ai créé de la surface du sol, de l’homme jusqu’au bétail, jusqu’à tout ce qui rampe et jusqu’aux oiseaux du ciel[b], car je regrette de les avoir faits[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’humanité ». Le mot hébreu ʾadam peut désigner collectivement l’ensemble des êtres humains ; « l’homme » conserve ici la répétition du même mot dans la suite du verset.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les oiseaux des cieux », expression hébraïque courante rendue ici par « les oiseaux du ciel ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je suis affligé de les avoir faits » ou « je suis désolé de les avoir faits ». Le verbe hébreu נחם au niphal exprime ici le regret ou la douleur au sujet d’une action antérieure ; à lui seul, il ne dit pas que Dieu aurait été surpris, qu’il aurait ignoré l’avenir ou qu’il aurait commis une faute morale.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom divin YHWH, adaptée au français international moderne.
- source_word: אֶמְחֶה
  choice: J’effacerai
  rationale: Le verbe מחה évoque l’action d’effacer ou de faire disparaître. « Effacerai » conserve cette image concrète et s’accorde avec « de la surface du sol ».
- source_word: הָאָדָם
  choice: l’homme
  rationale: Dans ce contexte, אָדָם désigne collectivement l’humanité. « L’homme » conserve toutefois la formulation représentative et le lien lexical avec la répétition de אָדָם dans l’énumération suivante.
- source_word: אֲשֶׁר בָּרָאתִי
  choice: que j’ai créé
  rationale: Rend directement l’action créatrice accomplie et son rapport actuel avec son objet collectif.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface du sol
  rationale: « Sol » rend ici אֲדָמָה plus précisément que « terre », tandis que « surface » exprime naturellement l’image hébraïque de la « face » du sol.
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמָיִם
  choice: depuis l’homme jusqu’aux bêtes, jusqu’à tout ce qui rampe et jusqu’aux oiseaux du ciel
  rationale: La formulation conserve la progression répétée de עַד. « Tout ce qui rampe » évite de limiter רֶמֶשׂ aux seuls reptiles, et « oiseaux du ciel » rend idiomatiquement l’expression hébraïque.
- source_word: נִחַמְתִּי
  choice: je regrette
  rationale: Le niphal de נחם, suivi de la mention de l’acte antérieur de Dieu, exprime ici un regret ou une profonde affliction rétrospective. « Je regrette » en conserve directement la tension sans préciser ce que le texte ne dit pas au sujet de la prescience ou d’une faute morale.
- source_word: כִּי עֲשִׂיתִם
  choice: de les avoir faits
  rationale: Le pronom pluriel renvoie aux êtres vivants mentionnés dans l’énumération. L’infinitif passé est naturel après « je regrette » et marque l’action accomplie.
theological_decisions:
- issue: Le regret divin exprimé par נִחַמְתִּי
  choice: car je regrette de les avoir faits
  alternative: car je suis affligé de les avoir faits
  rationale: « Je regrette » exprime le plus directement le regard rétrospectif porté sur l’acte antérieur et préserve la difficulté théologique du texte. Cette formulation n’affirme pas en elle-même que Dieu aurait été surpris, ignorant de l’avenir ou coupable d’une erreur morale.
- issue: La valeur collective de הָאָדָם
  choice: l’homme
  alternative: l’humanité
  rationale: Le référent est collectif, mais « l’homme » préserve la forme représentative masculine de l’hébreu ainsi que la répétition lexicale dans « depuis l’homme jusqu’aux bêtes ». La note explicite le sens collectif.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe conserve l’énumération solennelle et répétitive de l’hébreu sans devenir artificielle. « Yahvé » suit l’usage français traditionnel pour le tétragramme.
