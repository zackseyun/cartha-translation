  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: fr
  text: 'Voici comment tu la feras : l’arche aura trois cents coudées[a] de longueur, cinquante coudées de largeur et trente coudées de hauteur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La coudée était une ancienne unité de longueur correspondant approximativement à la distance entre le coude et le bout des doigts.
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: Voici comment tu la feras
  rationale: Le démonstratif introduit les précisions de construction, et עשה signifie ici « faire, construire ». Le futur français garde naturellement la valeur directive de l’imparfait hébreu.
- source_word: הַתֵּבָה
  choice: l’arche
  rationale: « Arche » est l’équivalent français établi pour תֵּבָה dans le récit de Noé et désigne ici le grand bâtiment flottant à construire.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: trois cents coudées
  rationale: La mesure ancienne est conservée plutôt que convertie, afin de préserver la précision culturelle et textuelle de l’hébreu.
- source_word: אֹרֶךְ הַתֵּבָה
  choice: l’arche aura trois cents coudées de longueur
  rationale: Cette formulation française naturelle exprime fidèlement la première dimension donnée par la proposition nominale hébraïque.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: cinquante coudées de largeur
  rationale: רֹחַב désigne la largeur; la coordination française permet d’éviter une répétition lourde sans perdre le possessif implicite.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: et trente coudées de hauteur
  rationale: Dans ce contexte architectural, קוֹמָה désigne la hauteur plutôt que la stature.
