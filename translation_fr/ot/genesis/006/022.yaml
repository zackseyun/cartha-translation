source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֥ה אֹת֛/וֹ אֱלֹהִ֖ים כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/022.yaml
  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: fr
  text: 'Noé fit ainsi[a] : il fit tout ce que Dieu lui avait ordonné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète le verbe « faire » au début et à la fin du verset, ce qui souligne la conformité de l’action de Noé à l’ordre de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: fit ... il fit
  rationale: Le verbe עשה, « faire », est répété en hébreu. La répétition est conservée afin de souligner l’entière conformité de l’action de Noé à l’ordre reçu.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom propre hébreu נֹחַ.
- source_word: כְּכֹל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure exprime l’étendue complète et la conformité à l’ensemble des commandements. Dans la construction française retenue, « tout ce que » rend naturellement cette totalité.
- source_word: צִוָּה אֹתוֹ
  choice: lui avait ordonné
  rationale: צוה désigne ici un ordre faisant autorité. Le plus-que-parfait français situe naturellement cet ordre avant son exécution, sans modifier le rapport temporel du récit.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le Dieu unique et commande un verbe au singulier.
- source_word: כֵּן
  choice: ainsi
  rationale: « Ainsi » exprime la correspondance exacte entre l’ordre divin et l’action de Noé. Il est placé dans la première proposition pour produire une phrase française naturelle, tandis que la seconde en explicite le sens.
theological_decisions:
- issue: Conserver la répétition de עשה qui met en relief l’obéissance de Noé
  choice: '« Noé fit ainsi : il fit tout ce que Dieu lui avait ordonné. »'
  alternative: « Noé fit tout ce que Dieu lui avait ordonné. »
  rationale: La formulation retenue garde les deux occurrences du verbe et laisse au texte son insistance propre, sans ajouter de qualification théologique à l’obéissance de Noé.
translation_notes:
  register: Français moderne, clair et digne. Les deux propositions conservent l’insistance de l’hébreu, tandis que le déplacement de « ainsi » évite en français la tournure très raide « conformément à tout ce que Dieu lui avait ordonné, ainsi fit-il ».
