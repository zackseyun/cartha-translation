  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: fr
  text: Mais Noé trouva grâce aux yeux de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais Noé obtint la faveur de Yahweh. »'
    reason: Alternative lexicale explicitant le sens de l’expression hébraïque « trouver grâce aux yeux de ».
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Mais Noé
  rationale: La conjonction וְ signifie couramment « et », mais elle marque ici le contraste entre Noé et l’humanité corrompue promise au jugement. « Mais Noé » exprime naturellement ce contraste en français sans expliciter davantage le texte.
- source_word: מָצָא
  choice: trouva
  rationale: Le verbe מָצָא signifie normalement « trouver ». Avec חֵן et בְּעֵינֵי, « trouver grâce aux yeux de » reproduit fidèlement une tournure hébraïque qui demeure idiomatique en français.
- source_word: חֵן
  choice: grâce
  rationale: חֵן peut désigner la grâce, la faveur ou l’accueil favorable. En français, « trouver grâce aux yeux de » est la formulation naturelle correspondant exactement à l’idiome hébreu, sans imposer ici une formulation doctrinale ultérieure.
- source_word: בְּ/עֵינֵי
  choice: aux yeux de
  rationale: Cette locution exprime le regard ou le jugement favorable de quelqu’un. La traduction littérale « aux yeux de » est aussi claire et idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver dans le texte le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens de חֵן dans la disposition de Dieu envers Noé
  choice: grâce
  alternative: faveur
  rationale: « Grâce » est ici retenu à l’intérieur de l’expression française consacrée « trouver grâce aux yeux de ». Le mot communique la disposition favorable de Dieu sans préciser davantage le rapport entre cette faveur et la justice de Noé, abordée au verset suivant.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom divin. « Yahweh » en préserve la fonction de nom propre, tandis que les autres possibilités lui substituent un titre ou une désignation traditionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « trouva grâce aux yeux de » conserve l’image hébraïque tout en restant naturelle. « Mais » rend le contraste discursif avec la corruption et le jugement décrits dans le contexte immédiat.
