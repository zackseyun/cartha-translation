  source_fidelity: Le texte rend correctement la construction temporelle de וַיְהִי כִּי par « Lorsque », de façon idiomatique en français narratif. הָאָדָם a bien une valeur collective dans ce contexte et « les humains » la restitue sans suggérer qu’il s’agit d’Adam. « commencèrent à se multiplier », « à la surface du sol » et « des filles leur naquirent » correspondent fidèlement au sens et à la syntaxe générale de l’hébreu. La phrase laissée ouverte par une virgule respecte la dépendance syntaxique qui se poursuit au verset 2.
