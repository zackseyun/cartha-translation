id: GEN.6.1
reference: Genesis 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: fr
  text: Lorsque les humains commencèrent à se multiplier à la surface du sol et que des filles leur naquirent,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Lorsque
  rationale: La construction narrative introduit ici une proposition temporelle qui se poursuit au verset suivant. « Lorsque » en restitue naturellement la fonction en français, sans calque lourd tel que « il arriva que, lorsque ».
- source_word: הָאָדָם
  choice: les humains
  rationale: Le nom est grammaticalement singulier en hébreu, mais possède ici un sens collectif et désigne l’ensemble de l’humanité, non Adam en particulier. Le pluriel français exprime clairement cette valeur générique.
- source_word: הֵחֵל ... לָרֹב
  choice: commencèrent à se multiplier
  rationale: Le verbe הֵחֵל suivi de l’infinitif indique le commencement, tandis que רבה décrit l’accroissement numérique de la population.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: à la surface du sol
  rationale: Cette formulation conserve l’image spatiale de פני tout en distinguant אֲדָמָה, « sol », du terme plus large désignant la terre ou le monde.
- source_word: וּבָנוֹת יֻלְּדוּ לָהֶם
  choice: et que des filles leur naquirent
  rationale: Le passif de ילד avec ל indique que des filles naissaient à ces humains. La tournure reste concise, digne et naturelle dans le registre narratif biblique.
theological_decisions:
- issue: Valeur collective de הָאָדָם
  choice: les humains
  alternative: l’humanité
  rationale: Le contexte parle de la multiplication générale de la population. « Les humains » conserve la référence concrète aux personnes et s’accorde naturellement avec le pronom pluriel de la proposition suivante, sans limiter le terme aux hommes de sexe masculin.
translation_notes:
  register: Français international moderne, narratif et soutenu sans archaïsme. La phrase demeure ouverte par une virgule, car la construction commencée ici se poursuit au verset 2.
