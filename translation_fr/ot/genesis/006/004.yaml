source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: fr
  text: Les Nephilim[a] étaient sur la terre en ce temps-là — et aussi après —, lorsque les fils de Dieu[b] s’unissaient aux filles des humains[c] et qu’elles leur donnaient des enfants. Ce sont eux qui furent les hommes puissants d’autrefois, les hommes de renom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « les géants ». Le terme hébreu Nephilim est rare, et son sens précis est incertain.'
    reason: alternative_reading
  - marker: b
    text: L’expression « fils de Dieu » peut aussi être comprise comme désignant des êtres divins ou, selon certaines interprétations, des souverains humains ou la lignée pieuse de Seth.
    reason: alternative_reading
  - marker: c
    text: L’hébreu dit littéralement « les filles de l’homme », le mot « homme » désignant ici collectivement l’humanité.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: les Nephilim
  rationale: Le terme hébreu est rare et son sens précis demeure incertain. La translittération évite d’imposer les interprétations « géants » ou « êtres tombés ».
- source_word: בָאָרֶץ
  choice: sur la terre
  rationale: Dans le contexte de l’histoire primitive, « terre » est le sens général le plus naturel, même si « pays » reste lexicalement possible.
- source_word: וְגַם אַחֲרֵי כֵן
  choice: et aussi après
  rationale: Cette formulation conserve à la fois la valeur additive et la valeur temporelle de l’hébreu.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: lorsque ... s’unissaient à
  rationale: Le tour français exprime naturellement l’union sexuelle indiquée par l’idiome hébreu, tandis que l’imparfait rend bien l’aspect répété ou caractéristique que peut porter la forme verbale.
- source_word: בְּנֵי הָאֱלֹהִים
  choice: les fils de Dieu
  rationale: La traduction formellement proche préserve l’ambiguïté quant à l’identité de ces êtres sans retenir d’emblée une interprétation angélique, royale ou séthite.
- source_word: בְּנוֹת הָאָדָם
  choice: les filles des humains
  rationale: אָדָם a ici une valeur collective. « Des humains » rend clairement en français moderne qu’il s’agit de femmes appartenant à l’humanité.
- source_word: וְיָלְדוּ לָהֶם
  choice: elles leur donnaient des enfants
  rationale: Le complément « des enfants », implicite en hébreu, est nécessaire à une expression française naturelle.
- source_word: הַגִּבֹּרִים
  choice: les hommes puissants
  rationale: Cette expression conserve le masculin pluriel et la large portée de גִּבּוֹר sans réduire le mot à « guerriers » ni le valoriser comme « héros ».
- source_word: מֵעוֹלָם
  choice: d’autrefois
  rationale: Rend de manière concise et naturelle la référence à une époque ancienne.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: les hommes de renom
  rationale: Expression française digne et idiomatique qui traduit l’idée de réputation attachée au nom.
theological_decisions:
- issue: Identité des « fils de Dieu »
  choice: Conserver l’expression « les fils de Dieu » sans explication interprétative dans le texte.
  alternative: Des êtres divins, des anges, des souverains humains ou la lignée pieuse de Seth.
  rationale: L’expression hébraïque est débattue; la traduction doit préserver cette tension théologique plutôt que trancher.
- issue: Sens de הַנְּפִלִים
  choice: Translittérer par « Nephilim » dans le texte principal.
  alternative: Les géants; les êtres tombés.
  rationale: L’étymologie et la désignation exacte sont incertaines. La translittération n’impose pas une tradition particulière.
- issue: Rapport temporel exprimé par אֲשֶׁר יָבֹאוּ
  choice: Employer « lorsque ... s’unissaient » pour présenter la circonstance associée à leur présence.
  alternative: « chaque fois que ... s’unissaient » ou « après que ... se furent unis ».
  rationale: Le relatif אֲשֶׁר permet ici plusieurs nuances contextuelles. « Lorsque » conserve une ouverture suffisante sans établir une chronologie plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme narratif reste soutenu sans archaïsmes. Les expressions disputées sont maintenues dans le texte et éclairées en notes plutôt que résolues par paraphrase.
