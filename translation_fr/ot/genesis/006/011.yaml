base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: fr
  text: La terre était corrompue devant Dieu[a], et la terre était remplie de violence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux yeux de Dieu ».
    reason: Alternative lexicale naturelle pour לִפְנֵי הָאֱלֹהִים, mettant plus explicitement l’accent sur l’appréciation divine.
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: s’était corrompue
  rationale: 'Le niphal de שׁחת décrit ici un état résultant : la terre était devenue corrompue. Le plus-que-parfait exprime naturellement en français cet état déjà établi dans le cadre narratif, sans réduire le terme à une destruction matérielle.'
- source_word: הָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre ou un pays. Dans le récit du déluge, « la terre » convient au champ narratif large. La répétition est conservée comme en hébreu.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: devant Dieu
  rationale: Cette formulation reste proche du sens spatial et relationnel de לִפְנֵי, tout en étant naturelle et digne en français. Elle préserve une légère ambiguïté entre présence et appréciation divine.
- source_word: וַתִּמָּלֵא
  choice: était remplie
  rationale: Le niphal de מלא indique l’état résultant d’un remplissage. « Était remplie » rend clairement cette valeur passive et l’état décrit.
- source_word: חָמָס
  choice: violence
  rationale: חָמָס désigne la violence, la brutalité ou le tort violent. « Violence » est ici le rendu direct et usuel, sans ajout interprétatif.
- source_word: וַ
  choice: et
  rationale: Le waw coordonne les deux propositions. « Et » conserve simplement cette coordination sans introduire un marqueur temporel absent de l’hébreu.
theological_decisions:
- issue: Nature de la corruption de la terre
  choice: Une corruption principalement morale, exprimée sans préciser davantage son mécanisme ou ses agents
  alternative: Une dégradation ou destruction matérielle de la terre
  rationale: Le contexte immédiat, notamment la mention de la violence, oriente vers la corruption morale de la société humaine. Toutefois, le texte attribue grammaticalement cet état à « la terre »; la traduction conserve cette formulation au lieu de la remplacer explicitement par « l’humanité ».
- issue: Sens de « devant Dieu »
  choice: Conserver la formulation relationnelle « devant Dieu »
  alternative: Expliciter par « aux yeux de Dieu »
  rationale: « Devant Dieu » demeure proche de לִפְנֵי et laisse subsister les nuances de présence et de jugement divins, tandis que « aux yeux de Dieu » mettrait exclusivement l’accent sur l’évaluation.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « la terre » est volontairement maintenue pour refléter l’insistance de l’hébreu. Aucun « Or » ou « Maintenant » initial n’est ajouté, puisque le waw narratif n’exige pas ici un tel marqueur.
