  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: fr
  text: Voici l'histoire de Noé. Noé était un homme juste et intègre parmi ses contemporains.[a] Noé marchait avec Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans ses générations » ou « à son époque ».'
    reason: La tournure hébraïque בְּדֹרֹתָיו, littéralement « dans ses générations », peut aussi désigner les contemporains ou l'époque de Noé.
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Voici la lignée de
  rationale: La formule introduit une nouvelle section de la Genèse. « Voici la lignée de » reste naturelle en français tout en conservant la dimension généalogique et structurante de תּוֹלְדֹת.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et standard du nom hébreu.
- source_word: אִישׁ צַדִּיק
  choice: un homme juste
  rationale: Rend directement le masculin singulier et le sens moral et relationnel de צַדִּיק sans surcharge doctrinale.
- source_word: תָּמִים
  choice: intègre
  rationale: Dans la description du caractère, le terme exprime la probité et l'intégrité, non une perfection absolue. « Intègre » est idiomatique et évite de suggérer l'absence totale de péché.
- source_word: בְּדֹרֹתָיו
  choice: parmi ses contemporains
  rationale: Le pluriel hébreu peut désigner les générations ou les gens de l'époque de Noé. Cette formulation française naturelle exprime bien le sens contextuel probable, tandis que la note conserve l'autre possibilité.
- source_word: אֶת הָאֱלֹהִים הִתְהַלֶּךְ
  choice: marchait avec Dieu
  rationale: Préserve la métaphore hébraïque consacrée d'une vie menée en relation avec Dieu, ainsi que son lien intertextuel avec Genèse 5.22,24.
theological_decisions:
- issue: Portée de תָּמִים appliqué à Noé
  choice: « intègre », au sens d'une conduite irréprochable et entière
  alternative: « parfait » ou « sans défaut »
  rationale: L'hébreu loue le caractère de Noé sans exiger l'idée d'une perfection morale absolue.
- issue: Sens de בְּדֹרֹתָיו
  choice: « parmi ses contemporains » dans le texte
  alternative: « dans ses générations » ou « à son époque »
  rationale: 'La tournure hébraïque demeure ouverte : elle peut situer Noé parmi les gens de son temps ou dans les générations auxquelles sa vie se rattache. La note signale cette ambiguïté sans en tirer une conclusion théologique.'
translation_notes:
  register: Français international moderne, sobre et digne. La répétition du nom « Noé » et la métaphore « marchait avec Dieu » sont conservées. La note est placée après l'expression qu'elle précise.
