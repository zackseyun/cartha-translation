id: GEN.6.6
reference: Genesis 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: fr
  text: Yahvé regretta[a] d’avoir fait l’être humain[b] sur la terre, et il en éprouva de la douleur au fond du cœur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut désolé d’avoir fait ». Le verbe hébreu exprime ici le regret ou la peine au sujet d’une action antérieure; à lui seul, il ne dit pas que Dieu fut surpris, qu’il ignorait l’avenir ou qu’il avait commis une faute morale.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’humanité » ou « les humains ». Ici, le mot hébreu ʾadam désigne collectivement la race humaine.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « vers son cœur »; l’expression décrit une douleur profondément intérieure.
    reason: source_idiom
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: regretta
  rationale: Au nifal, suivi d’une proposition en כִּי portant sur une action antérieure, נחם exprime ici un regret rétrospectif ou une vive peine. « Regretta » préserve cette force sans attribuer en soi à Yahvé surprise, ignorance préalable ou faute morale. Le verbe suivant exprime séparément la douleur.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante et reconnaissable du nom divin YHWH, adaptée au français international moderne.
- source_word: כִּי עָשָׂה
  choice: d’avoir fait
  rationale: La construction infinitive française exprime naturellement le contenu du regret et l’antériorité de l’acte.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Dans ce contexte, אָדָם désigne collectivement la race humaine, et non le seul individu Adam. « L’être humain » conserve le singulier représentatif de l’hébreu.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: Le contexte vise la terre comme monde habité, non un pays particulier.
- source_word: וַיִּתְעַצֵּב
  choice: éprouva de la douleur
  rationale: Le hitpael de עצב évoque une douleur intérieure. Cette formulation le distingue du regret exprimé par le premier verbe tout en restant naturelle en français.
- source_word: אֶל־לִבּוֹ
  choice: au fond du cœur
  rationale: La tournure idiomatique française rend l’intériorité profonde de l’expression hébraïque, dont la préposition est littéralement « vers ».
theological_decisions:
- issue: Langage anthropopathique appliqué à Dieu
  choice: Conserver l’affirmation directe que Yahvé « regretta » et éprouva de la douleur.
  alternative: « fut attristé d’avoir fait » ou « revint sur sa décision »
  rationale: Le texte présente sans explication le regret de Yahvé au sujet de son acte antérieur et sa douleur intérieure. La traduction ne doit ni ajouter l’idée de surprise ou de faute, ni atténuer la tension théologique en remplaçant le regret par un simple changement de décision.
- issue: Sens collectif de הָאָדָם
  choice: « l’être humain » au singulier collectif
  alternative: « l’humanité » ou « les humains »
  rationale: Le contexte concerne l’ensemble de l’humanité. Le singulier représentatif reflète la forme hébraïque tout en évitant de limiter le propos au seul Adam.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les deux mouvements distincts de l’hébreu — regret rétrospectif, puis douleur intérieure — sans résoudre la tension théologique du passage.
