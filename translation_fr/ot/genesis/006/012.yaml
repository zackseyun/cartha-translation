revisions:
- from: 'Dieu regarda la terre : elle était bel et bien ravagée[a], car toute chair avait perverti sa conduite sur la terre.'
  to: Dieu vit la terre, et voici qu’elle était corrompue[a], car toute chair avait corrompu sa voie sur la terre.
  rationale: La révision conserve en français la répétition de la racine hébraïque שׁחת sans choisir entre une corruption uniquement morale et une destruction uniquement matérielle. Elle préserve aussi la métaphore de « la voie » et la portée non résolue de « toute chair ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:49:10Z'
review_pass:
  verdict: revise
  source_fidelity: La proposition principale rend globalement le texte, mais « ravagée » pour נִשְׁחָתָה et « avait perverti sa conduite » pour הִשְׁחִית ... דַּרְכּוֹ dissocient trop fortement les deux occurrences de שׁחת et réduisent la seconde à une faute morale. Le texte hébreu répète intentionnellement la même racine et conserve une portée qui associe corruption et ruine.
  naturalness: « Dieu vit la terre, et voici qu’elle était corrompue » est un français narratif, moderne et digne. « Toute chair avait corrompu sa voie » garde l’idiome et la métaphore du texte source; son léger caractère biblique convient au registre sans être obscur.
  terminology: « Corrompue / avait corrompu » préserve la répétition de שׁחת. La note explicite que ce terme peut aussi renvoyer à la ruine ou à la dévastation. « Toute chair » demeure volontairement non interprétatif.
  issues:
  - severity: medium
    issue: La répétition lexicale de שׁחת n’est pas conservée.
    rationale: « Ravagée » puis « avait perverti » exprime des aspects possibles du contexte, mais efface le lien verbal que le texte hébreu marque entre l’état de la terre et l’action de toute chair.
  - severity: medium
    issue: « Avait perverti sa conduite » interprète et rétrécit דַּרְכּוֹ.
    rationale: Le terme « conduite » est défendable, mais « perverti » impose une lecture exclusivement morale et la combinaison ne rend plus la métaphore de la « voie ». « Avait corrompu sa voie » est plus fidèle tout en restant intelligible.
  - severity: low
    issue: « Bel et bien » est moins adapté que « et voici que » pour וְהִנֵּה.
    rationale: L’expression française marque une insistance réelle, mais elle a une coloration plus conversationnelle et ne reproduit pas aussi directement la mise en évidence narrative de הִנֵּה.
  revised_text: Dieu vit la terre, et voici qu’elle était corrompue[a], car toute chair avait corrompu sa voie sur la terre.
  revised_footnotes:
  - marker: a
    text: Ou « ravagée » ou « dévastée ». Le verbe hébreu peut évoquer aussi bien la corruption morale que la ruine ou la dévastation.
    reason: lexical_alternative
