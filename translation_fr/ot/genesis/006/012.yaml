  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: fr
  text: Dieu vit la terre, et voici qu’elle était corrompue[a], car toute chair avait corrompu sa voie sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ravagée » ou « dévastée ». Le verbe hébreu peut évoquer aussi bien la corruption morale que la ruine ou la dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: regarda
  rationale: Le verbe ראה indique ici que Dieu porte son regard sur l’état de la terre. « Regarda » convient au récit français sans ajouter de nuance étrangère au texte.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le Dieu unique.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le contexte du déluge favorise « la terre », plus large que « le pays ».
- source_word: וְהִנֵּה
  choice: bel et bien
  rationale: הִנֵּה attire vivement l’attention sur l’état constaté. Après les deux-points, « bel et bien » en rend la force dans un français actuel et digne, sans l’archaïsme de « voici » employé isolément.
- source_word: נִשְׁחָתָה
  choice: était ravagée
  rationale: Le niphal de שׁחת décrit un état de corruption et de ruine. « Ravagée » exprime le résultat désastreux sans le réduire à la seule dépravation morale; une note conserve l’autre valeur majeure.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la cause de l’état constaté. « Car » maintient avec naturel la cadence solennelle du récit.
- source_word: הִשְׁחִית
  choice: avait perverti
  rationale: Le hiphil de שׁחת présente toute chair comme l’agent qui a gâté ou corrompu sa manière de vivre. Avec « conduite », « avait perverti » est idiomatique et rend clairement la portée morale de la proposition explicative.
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: Cette traduction conserve l’idiome hébreu et son amplitude référentielle au lieu de le limiter explicitement à l’humanité ou de l’étendre à chaque créature.
- source_word: דַּרְכּוֹ
  choice: sa conduite
  rationale: דֶּרֶךְ signifie littéralement « chemin » et, figurativement ici, la manière de vivre. « Conduite » communique naturellement ce sens en français. Le singulier collectif « sa » correspond à « toute chair ».
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Traduction directe et naturelle de עַל הָאָרֶץ dans le contexte universel du déluge.
theological_decisions:
- issue: Portée sémantique de שׁחת dans les deux propositions
  choice: Rendre le résultat par « ravagée » et l’action de toute chair par « avait perverti »
  alternative: 'Employer le même terme dans les deux propositions : « corrompue… avait corrompu » ou « dévastée… avait dévasté »'
  rationale: La répétition de la racine relie étroitement l’état de la terre à l’action de toute chair, mais aucun mot français naturel ne couvre également bien la corruption morale et la ruine qui en résulte. La variation rend les nuances contextuelles des deux formes verbales, tandis que la note signale l’étendue sémantique du premier emploi.
- issue: Étendue de כָּל בָּשָׂר
  choice: Conserver « toute chair »
  alternative: « toute l’humanité » ou « tout être vivant »
  rationale: L’expression hébraïque peut avoir une portée plus ou moins large selon le contexte. La conserver évite de trancher dans la traduction une ambiguïté réelle.
translation_notes:
  register: Français international moderne, narratif et digne. Les deux-points rendent naturellement l’effet de וְהִנֵּה; « toute chair » préserve volontairement l’idiome biblique et son ambiguïté. La répétition formelle de la racine שׁחת n’a pas été reproduite par un seul mot français, afin d’éviter une formulation peu naturelle ou un rétrécissement sémantique.
