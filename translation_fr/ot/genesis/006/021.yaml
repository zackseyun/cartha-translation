  text: וְ/אַתָּ֣ה קַח לְ/ךָ֗ מִ/כָּל מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְ/אָסַפְתָּ֖ אֵלֶ֑י/ךָ וְ/הָיָ֥ה לְ/ךָ֛ וְ/לָ/הֶ֖ם לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: fr
  text: Et toi, prends de toutes sortes d’aliments qui peuvent être mangés et rassemble-les auprès de toi. Ils serviront de nourriture pour toi et pour eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לְךָ
  choice: prends
  rationale: L’impératif קַח signifie directement « prends ». En français, le pronom sujet tonique « toi » placé en tête exprime déjà l’insistance personnelle, si bien qu’ajouter « pour toi-même » serait lourd et pourrait suggérer à tort que les vivres sont destinés au seul Noé.
- source_word: מִכָּל מַאֲכָל
  choice: de toutes sortes d’aliments
  rationale: Cette formulation française exprime une sélection couvrant toute la gamme des aliments, sans laisser entendre que Noé doit emporter la totalité de chaque aliment existant.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: qui peuvent être mangés
  rationale: Le nifal imperfectif peut désigner ce qui se mange ou convient à la consommation. Cette tournure naturelle conserve la valeur potentielle du texte sans réduire le sens au seul adjectif « comestibles ».
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: et rassemble-les auprès de toi
  rationale: « Rassembler » rend le sens premier de אָסַף, tandis que « auprès de toi » représente אֵלֶיךָ et situe les provisions avec Noé, dans l’arche.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: Ils serviront de nourriture pour toi et pour eux
  rationale: Le singulier grammatical renvoie collectivement à l’ensemble des vivres. Le pluriel français reprend naturellement « aliments » et « serviront de nourriture » exprime clairement le résultat ou la fonction indiquée par la construction hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La dislocation « Et toi » conserve l’emphase du pronom hébreu אַתָּה. « Aliments » évite la répétition immédiate de « nourriture », et le texte ne requiert aucune note pour être compris.
