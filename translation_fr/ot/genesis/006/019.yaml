  text: וּ/מִ/כָּל הָ֠/חַי מִֽ/כָּל בָּשָׂ֞ר שְׁנַ֧יִם מִ/כֹּ֛ל תָּבִ֥יא אֶל הַ/תֵּבָ֖ה לְ/הַחֲיֹ֣ת אִתָּ֑/ךְ זָכָ֥ר וּ/נְקֵבָ֖ה יִֽהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: fr
  text: Et de tout ce qui vit, de toute chair[a], tu feras entrer dans l’arche deux de chacun, afin de les garder en vie avec toi ; ce seront un mâle et une femelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « toute chair » désigne ici l’ensemble des créatures vivantes pourvues de chair.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי
  choice: Et de tout ce qui vit
  rationale: Cette formulation rend le substantif hébreu de manière large et naturelle, sans le limiter explicitement aux seuls animaux.
- source_word: מִכָּל בָּשָׂר
  choice: de toute chair
  rationale: Le maintien de l’expression hébraïque préserve son ampleur et son lien avec le langage du récit ; une note en explicite le sens idiomatique.
- source_word: שְׁנַיִם מִכֹּל
  choice: deux de chacun
  rationale: Cette tournure française exprime clairement la valeur distributive de l’hébreu sans ajouter le mot « espèce », absent du texte.
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: tu feras entrer dans l’arche
  rationale: Le causatif hébreu est rendu naturellement par « faire entrer », qui exprime le déplacement vers l’intérieur de l’arche et conserve la force directive du contexte.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: afin de les garder en vie avec toi
  rationale: La proposition finale traduit la valeur causative de l’infinitif et l’accompagnement exprimé par אִתָּךְ.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: ce seront un mâle et une femelle
  rationale: Cette formulation française naturelle conserve l’indication explicite du sexe des deux individus.
