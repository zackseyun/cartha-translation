source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֥י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וּ/בָאתָ֙ אֶל הַ/תֵּבָ֔ה אַתָּ֕ה וּ/בָנֶ֛י/ךָ וְ/אִשְׁתְּ/ךָ֥ וּ/נְשֵֽׁי בָנֶ֖י/ךָ אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: fr
  text: Mais j’établirai mon alliance avec toi[a], et tu entreras dans l’arche, toi, tes fils, ta femme et les femmes de tes fils avec toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je confirmerai mon alliance avec toi ». Dans le contexte d’une alliance, le verbe hébreu peut exprimer l’une ou l’autre nuance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Mais j’établirai
  rationale: Le hiphil de קום avec בְּרִית peut signifier « établir » ou « confirmer » une alliance. « J’établirai » convient à la promesse tournée vers l’avenir, tandis que « mais » rend le contraste discursif avec l’annonce précédente de destruction.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est l’équivalent français courant et consacré de בְּרִית dans ce contexte relationnel et théologique.
- source_word: אִתָּךְ
  choice: avec toi
  rationale: Cette expression rend simplement la relation d’alliance et, à la fin du verset, l’accompagnement.
- source_word: וּבָאתָ אֶל הַתֵּבָה
  choice: et tu entreras dans l’arche
  rationale: בוא avec une destination peut se rendre naturellement par « entrer dans ». « Arche » est le terme français établi et contextuellement précis pour תֵּבָה dans le récit de Noé.
- source_word: אַתָּה
  choice: toi
  rationale: Le pronom indépendant est conservé en apposition afin de rendre son emphase sans alourdir la phrase.
- source_word: וּבָנֶיךָ
  choice: tes fils
  rationale: Le texte hébreu désigne précisément les fils, et non les enfants en général.
- source_word: וְאִשְׁתְּךָ
  choice: ta femme
  rationale: Rendu direct et idiomatique dans ce contexte familial.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: les femmes de tes fils
  rationale: Cette formulation suit de près le groupe construit hébreu et évite le terme légèrement plus interprétatif « belles-filles ».
theological_decisions:
- issue: Portée de l’expression relative à l’alliance
  choice: j’établirai mon alliance avec toi
  alternative: je confirmerai mon alliance avec toi
  rationale: L’hébreu permet de comprendre soit l’établissement d’une alliance, soit la confirmation d’un engagement déjà en vigueur. Le texte ne tranche pas explicitement la question; la variante est donc signalée en note sans imposer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve l’emphase de אַתָּה par l’apposition « toi » et reprend littéralement les liens familiaux sans archaïsme.
