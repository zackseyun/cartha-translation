source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: fr
  text: Yahweh vit que la méchanceté de l’humanité était grande sur la terre et que tout ce que son cœur concevait n’était que mauvais, continuellement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « seulement mauvais tout le jour »; l’expression peut aussi se traduire par « jour après jour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le wayyiqtol fait avancer le récit; le passé simple convient au registre narratif français et n’ajoute aucune nuance temporelle étrangère au texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: רָעַת הָאָדָם
  choice: la méchanceté de l’humanité
  rationale: רָעָה désigne ici le mal moral, tandis que אָדָם est collectif et vise l’ensemble des êtres humains; « humanité » l’exprime naturellement en français moderne.
- source_word: רַבָּה
  choice: était grande
  rationale: Avec « méchanceté », l’adjectif indique l’ampleur du mal et conserve la formulation emphatique de l’hébreu.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: Dans le contexte des origines, אֶרֶץ désigne la terre dans son ensemble plutôt qu’un territoire particulier.
- source_word: יֵצֶר
  choice: inclinations
  rationale: Le terme évoque ce qui se forme ou se façonne intérieurement, ici les dispositions ou impulsions qui sous-tendent les pensées.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: des pensées de son cœur
  rationale: Cette formulation préserve l’expression anthropologique hébraïque, où le cœur englobe la pensée, la volonté et le désir.
- source_word: רַק רַע
  choice: uniquement mauvaises
  rationale: רַק a une valeur restrictive forte et רַע désigne ici le mal moral; l’accord au pluriel suit naturellement « inclinations » en français.
- source_word: כָּל הַיּוֹם
  choice: jour après jour
  rationale: L’expression signifie littéralement « tout le jour » mais peut idiomatiquement exprimer la continuité; la note conserve la formulation plus littérale.
theological_decisions:
- issue: Rendu du tétragramme YHWH
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre est conservé afin de distinguer le tétragramme d’un titre divin, sans importer une interprétation confessionnelle.
- issue: Sens collectif de אָדָם
  choice: l’humanité
  alternative: l’homme
  rationale: Dans ce contexte, אָדָם désigne collectivement la race humaine. « L’humanité » transmet clairement cette portée en français actuel sans limiter le propos au sexe masculin.
- issue: Portée de כָּל יֵצֶר מַחְשְׁבֹת לִבּוֹ
  choice: toutes les inclinations des pensées de son cœur
  alternative: tous les desseins des pensées de son cœur
  rationale: La traduction garde la formulation complexe et la portée exhaustive de l’hébreu sans réduire יֵצֶר à une intention consciente ni résoudre la relation précise entre inclination et pensées.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit. « Humanité » rend explicitement la valeur collective de אָדָם; « cœur » est conservé pour préserver l’anthropologie biblique. Le marqueur de note est placé après l’expression qu’il éclaire.
