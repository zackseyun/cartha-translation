  text: 'And Noah fathered three sons: Shem[a], Ham, and Japheth.'
translation:
  language: fr
  text: 'Noé eut trois fils : Sem, Cham et Japhet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: eut
  rationale: Le hiphil narratif de ילד exprime ici la paternité de Noé. « Eut » est naturel en français moderne dans une généalogie et, avec « fils », garde clairement le sens paternel sans la tonalité archaïque d’« engendra ».
- source_word: שְׁלֹשָׁה בָנִים
  choice: trois fils
  rationale: בָנִים désigne explicitement des fils, et non des enfants au sens général.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Cham et Japhet
  rationale: Les particules אֶת marquent les compléments d’objet définis. En français naturel, les trois noms sont énumérés après les deux-points, selon leurs formes françaises bibliques courantes.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française usuelle du nom hébreu נֹחַ.
