  text: וַ/יִּרְא֤וּ בְנֵי הָֽ/אֱלֹהִים֙ אֶת בְּנ֣וֹת הָֽ/אָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַ/יִּקְח֤וּ לָ/הֶם֙ נָשִׁ֔ים מִ/כֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: fr
  text: les fils de Dieu[a] virent que les filles des humains étaient belles, et ils prirent pour femmes toutes celles qu’ils choisirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les êtres divins ». L’identité des « fils de Dieu » est débattue : les principales interprétations y voient des êtres célestes, des dirigeants humains ou la lignée de Seth.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: les fils de Dieu
  rationale: Cette traduction formellement proche conserve l’expression hébraïque et ne tranche pas l’identité controversée de ses référents.
- source_word: בְּנוֹת הָאָדָם
  choice: les filles des humains
  rationale: Le nom collectif הָאָדָם désigne ici l’humanité; « des humains » est naturel en français moderne et maintient le contraste avec « les fils de Dieu ».
- source_word: כִּי טֹבֹת הֵנָּה
  choice: étaient belles
  rationale: Dans ce contexte, טֹבוֹת exprime l’attrait physique constaté; « belles » rend ce sens naturellement sans lui attribuer une valeur morale.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: ils prirent pour femmes
  rationale: Cette tournure française rend l’emploi matrimonial de נָשִׁים et conserve l’idée qu’ils les prirent pour eux-mêmes.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: toutes celles qu’ils choisirent
  rationale: Cette formulation rend la sélection sans restriction exprimée par מִכֹּל, dans un français clair et idiomatique.
theological_decisions:
- issue: Identité des « fils de Dieu »
  choice: Conserver l’expression « les fils de Dieu » sans identifier explicitement ses référents.
  alternative: Les êtres célestes, des dirigeants humains ou la lignée de Seth.
  rationale: Le texte hébreu ne résout pas cette question débattue; la traduction préserve donc l’ambiguïté et la tension interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Prirent pour femmes » conserve la formulation narrative et sa possible dimension de pouvoir sans expliciter davantage que l’hébreu.
