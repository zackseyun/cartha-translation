  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: fr
  text: Fais-toi une arche en bois de gopher[a]. Tu aménageras des compartiments[b] dans l’arche et tu l’enduiras de poix[c], à l’intérieur comme à l’extérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bois de cyprès ». Le mot hébreu traduit par « gopher » n’apparaît qu’ici ; l’essence exacte est donc incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou « cellules » ; littéralement « nids ».
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe traduit par « enduire » et le nom traduit par « poix » sont apparentés en hébreu. On pourrait aussi traduire : « tu la couvriras » ou « tu la rendras étanche » avec du bitume ou du goudron.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּבַת
  choice: arche
  rationale: « Arche » est le terme français consacré pour ce grand vaisseau et maintient le lien avec Genèse 6–9 et Exode 2, où figure le même nom hébreu distinct du mot ordinaire pour « navire ».
- source_word: עֲצֵי גֹפֶר
  choice: bois de gopher
  rationale: Le terme גֹפֶר n’apparaît qu’ici et son identification demeure incertaine. La translittération « gopher » évite d’imposer une essence conjecturale telle que le cyprès.
- source_word: קִנִּים
  choice: compartiments
  rationale: Le mot signifie littéralement « nids », mais désigne ici des espaces séparés dans l’arche. « Compartiments » exprime clairement cette disposition sans conserver une image potentiellement trompeuse.
- source_word: וְכָפַרְתָּ
  choice: tu l’enduiras
  rationale: Dans ce contexte non cultuel, le verbe désigne l’application d’un revêtement. « Enduire » s’accorde naturellement avec la poix et préserve le lien avec le nom apparenté qui désigne le matériau.
- source_word: בַּכֹּפֶר
  choice: de poix
  rationale: « Poix » est le terme français traditionnel et précis pour une substance servant ici de revêtement imperméabilisant, sans affirmer plus exactement qu’il ne faut sa composition.
- source_word: מִבַּיִת וּמִחוּץ
  choice: à l’intérieur comme à l’extérieur
  rationale: Cette formulation française naturelle indique sans ambiguïté que les deux surfaces doivent recevoir le revêtement.
- source_word: עֲשֵׂה לְךָ
  choice: Fais-toi
  rationale: Rend directement l’impératif avec le datif d’intérêt לְךָ, sans préciser « construis », plus étroit que le verbe hébreu עשה.
- source_word: קִנִּים תַּעֲשֶׂה אֶת־הַתֵּבָה
  choice: Tu aménageras des compartiments dans l’arche
  rationale: 'La syntaxe hébraïque est difficile à reproduire littéralement en français. Cette restructuration modeste transmet le sens probable : l’arche doit être divisée en espaces internes.'
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Fais-toi » conserve la concision de l’impératif ; « aménageras des compartiments » clarifie une construction hébraïque elliptique. Les termes techniques ou incertains sont explicités en notes sans résoudre artificiellement l’identification du bois ou du matériau.
