  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: fr
  text: Au septième jour, Dieu avait achevé son œuvre qu’il avait accomplie[a] ; et le septième jour, il se reposa de toute son œuvre qu’il avait accomplie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Au septième jour, Dieu acheva son œuvre qu’il avait accomplie. » Le plus-que-parfait du texte principal exprime le sens probable dans ce contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: avait achevé
  rationale: Le verbe כלה signifie « achever, mener à son terme ». Le plus-que-parfait indique naturellement en français que l’œuvre était achevée au septième jour, tout en conservant la mention temporelle hébraïque.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom commande ici un verbe au singulier et désigne Dieu.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Au septième jour
  rationale: Cette formulation reste proche du sens temporel littéral « au septième jour ». Associée au plus-que-parfait « avait achevé », elle exprime que l’œuvre était alors terminée sans effacer l’ambiguïté formelle de l’hébreu.
- source_word: מְלַאכְתּוֹ
  choice: l’œuvre
  rationale: מְלָאכָה désigne le travail ou l’ouvrage accompli. « L’œuvre » convient au contexte de la création et évite de suggérer une peine physique.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il avait accomplie
  rationale: עשה peut signifier « faire » ou « accomplir ». La tournure choisie est naturelle en français et conserve l’idée générale de l’activité menée à bien, sans la réduire à une fabrication matérielle.
- source_word: וַיִּשְׁבֹּת
  choice: il se reposa
  rationale: שבת signifie fondamentalement « cesser ». « Se reposa » est la formulation française établie dans ce contexte et désigne ici la cessation de l’œuvre, non une récupération due à la fatigue.
- source_word: מִכָּל
  choice: de toute
  rationale: La préposition מן associée à כָּל indique que Dieu cessa toute son œuvre ; « de toute » s’intègre naturellement à « se reposa ».
theological_decisions:
- issue: Le texte implique-t-il que Dieu a travaillé pendant le septième jour ?
  choice: « Au septième jour, Dieu avait achevé » indique qu’à ce moment-là l’œuvre était achevée.
  alternative: « Le septième jour, Dieu acheva son œuvre » reproduit plus directement la suite formelle de l’hébreu et peut laisser entendre que l’achèvement eut lieu pendant ce jour.
  rationale: L’hébreu dit littéralement « au septième jour » tout en affirmant ensuite que Dieu se reposa ce même jour. Le plus-que-parfait rend la relation contextuelle sans remplacer la préposition par « avant » ni trancher plus que ne le permet le texte ; la formulation littérale est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « l’œuvre qu’il avait accomplie » est maintenue pour refléter la structure hébraïque. « Se reposa » conserve la formulation biblique usuelle, tandis que le contexte précise qu’il s’agit de cesser l’œuvre plutôt que de récupérer de la fatigue.
