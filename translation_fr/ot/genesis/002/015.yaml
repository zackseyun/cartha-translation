id: GEN.2.15
reference: Genesis 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: fr
  text: Yahweh Dieu prit l’homme et l’établit dans le jardin d’Éden pour le cultiver et le garder[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour y travailler et veiller sur lui ». Les verbes hébreux peuvent signifier « travailler, cultiver, servir » et « garder, protéger, veiller sur ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « l’établit » peut aussi signifier « le plaça », « l’installa » ou « lui donna du repos ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Conserve le nom divin personnel יהוה sous la forme « Yahweh » et le titre générique אֱלֹהִים sous la forme « Dieu », conformément à l’ordre hébreu.
- source_word: הָאָדָם
  choice: l’homme
  rationale: Dans ce contexte, l’expression désigne l’être humain individuel précédemment façonné, et non l’humanité prise collectivement.
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le verbe לקח décrit simplement l’action de prendre, sans qu’il soit nécessaire d’en préciser davantage la manière.
- source_word: וַיַּנִּחֵהוּ
  choice: l’établit
  rationale: Le hiphil de נוח peut signifier placer, installer ou faire reposer. « L’établit » exprime naturellement ici une installation dans le jardin tout en laissant transparaître une certaine stabilité.
- source_word: בְּגַן עֵדֶן
  choice: dans le jardin d’Éden
  rationale: Rendu français naturel et consacré de la construction hébraïque, avec conservation du nom propre Éden.
- source_word: לְעָבְדָהּ
  choice: pour le cultiver
  rationale: Avec le jardin pour objet, עבד prend naturellement un sens agricole. « Cultiver » est plus idiomatique en français que « travailler le jardin », tout en conservant le sens contextuel.
- source_word: וּלְשָׁמְרָהּ
  choice: et le garder
  rationale: שמר peut signifier garder, protéger, veiller sur ou entretenir. « Garder » préserve cette amplitude sans imposer exclusivement une idée militaire ou horticole.
theological_decisions:
- issue: Nature de la mission de l’homme en Éden
  choice: Le texte présente sa tâche comme celle de cultiver le jardin et de le garder, sans préciser une catégorie théologique spécialisée.
  alternative: Comprendre principalement les deux verbes comme un vocabulaire sacerdotal de service et de garde, ou seulement comme une description agricole.
  rationale: Les verbes עבד et שמר permettent des résonances agricoles et éventuellement cultuelles, mais le verset ne tranche pas explicitement entre elles. La traduction retient leur sens contextuel ordinaire et signale leur étendue dans une note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation est concise, narrative et accessible. « Yahweh » conserve le nom divin; « l’établit » évite une tournure pesante tout en maintenant l’ambivalence partielle de נוח, explicitée en note.
