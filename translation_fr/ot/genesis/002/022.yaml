  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: fr
  text: Le SEIGNEUR Dieu construisit une femme à partir de la côte[a] qu’il avait prise de l’homme, puis il l’amena à l’homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « côté ». Le mot hébreu peut désigner une côte, un côté ou une partie latérale.'
    reason: Préserver l’étendue sémantique de צֵלָע sans alourdir le texte principal ni exclure le sens plus large de « côté ».
lexical_decisions:
- source_word: צֵלָע (tsēlāʿ)
  choice: côte
  rationale: Le mot peut désigner un côté ou un élément latéral, et ailleurs une pièce architecturale. « Côte » conserve ici le sens anatomique traditionnel et convient au prélèvement fait sur l’homme, tout en signalant l’autre possibilité en note.
- source_word: וַיִּבֶן (wayyiḇen)
  choice: construisit
  rationale: Le verbe signifie littéralement « bâtir, construire ». Ce choix préserve l’image marquante du texte hébreu au lieu de la réduire à « fit » ou « forma ».
- source_word: יְהוָה אֱלֹהִים (YHWH ʾĕlōhîm)
  choice: le SEIGNEUR Dieu
  rationale: « SEIGNEUR » en petites capitales typographiques représente le nom divin YHWH selon une convention française largement intelligible, tandis que « Dieu » traduit ʾĕlōhîm.
- source_word: לְאִשָּׁה (ləʾiššāh)
  choice: une femme
  rationale: 'Dans cette construction avec « construire », la préposition ל marque le résultat : la côte est construite pour devenir, ou en tant que, femme. La tournure française « De la côte… construisit une femme » exprime ce résultat naturellement.'
- source_word: וַיְבִאֶהָ אֶל־הָאָדָם (wayəḇiʾehā ʾel-hāʾāḏām)
  choice: puis il l’amena à l’homme
  rationale: Le pronom féminin renvoie à la femme. « Puis » rend la progression narrative du waw consécutif sans alourdir la phrase.
theological_decisions:
- issue: Nature de ce qui est pris à l’homme
  choice: « côte » dans le texte, avec « côté » en note
  alternative: « côté » dans le texte principal
  rationale: Le terme hébreu autorise une certaine ambiguïté. « Côte » est naturel dans le contexte anatomique et solidement établi en français, mais la note empêche d’exclure silencieusement le sens plus large de « côté ».
- issue: Image de l’acte créateur
  choice: conserver le verbe concret « construisit »
  alternative: « forma » ou « fit »
  rationale: Le texte emploie délibérément le vocabulaire de la construction. Le maintenir évite d’aplanir une image susceptible de porter une portée littéraire ou théologique sans imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, sobre et digne. L’inversion initiale « De la côte… » garde la côte au premier plan, comme en hébreu, tandis que « construisit une femme » conserve l’image architecturale inhabituelle mais intentionnelle du texte source.
