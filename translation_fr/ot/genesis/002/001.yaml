source:
  edition: WLC
  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: fr
  text: Ainsi furent achevés le ciel et la terre, et tout ce qui les peuple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et toute leur armée ». Le terme hébreu évoque l’ensemble, ou la multitude ordonnée, de ce qui remplit le ciel et la terre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: furent achevés
  rationale: La forme passive de כלה exprime l’aboutissement de l’œuvre créatrice. « Furent achevés » conserve ce sens résultatif et reste naturel en français.
- source_word: הַשָּׁמַיִם
  choice: le ciel
  rationale: Dans la tournure française consacrée « le ciel et la terre », le singulier collectif désigne le domaine céleste dans son ensemble, et non seulement le ciel visible.
- source_word: וְהָאָרֶץ
  choice: et la terre
  rationale: Dans le contexte de la création, אֶרֶץ désigne le domaine terrestre dans son ensemble, non un territoire particulier.
- source_word: וְכָל צְבָאָם
  choice: avec tout ce qui les peuple
  rationale: צָבָא désigne ici collectivement l’ensemble ordonné de ce qui remplit le ciel et la terre. Cette formulation rend clairement la portée globale de l’expression en français moderne, tandis que la note conserve son image littérale.
theological_decisions:
- issue: Portée de « toute leur armée » (כָל צְבָאָם)
  choice: Une référence globale à tout ce qui peuple ou remplit le ciel et la terre
  alternative: Une référence plus étroite aux astres, ou une métaphore militaire soulignant des rangs ordonnés
  rationale: Le verset récapitule l’achèvement de l’ensemble créé. Le contexte favorise donc une portée globale, sans exclure les connotations d’ordre ou de multitude attachées au terme hébreu; celles-ci sont signalées en note.
translation_notes:
  register: Français international moderne, clair et digne. L’inversion « Ainsi furent achevés » donne au verset sa valeur de conclusion sans archaïsme marqué. « Le ciel et la terre » suit l’usage idiomatique français, tandis que la note préserve l’image collective du texte hébreu.
