source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: fr
  text: C’est pourquoi un homme quittera son père et sa mère, s’attachera à sa femme[a], et ils deviendront une seule chair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « restera fermement attaché à » ou « s’unira à ». Le verbe hébreu exprime un attachement fort, comme une adhésion.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « une seule chair » comprend l’union corporelle ainsi que la formation d’un nouveau lien de parenté.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Introduit la conséquence tirée du récit précédent. Cette tournure est naturelle en français moderne et conserve la valeur explicative de l’hébreu.
- source_word: יַעֲזָב
  choice: quittera
  rationale: Le yiqtol exprime ici un principe général. Le futur français convient à cette portée proverbiale et normative sans transformer la phrase en impératif. « Abandonnera » serait excessivement fort dans ce contexte.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom masculin singulier désigne ici de manière représentative l’homme qui se marie. La traduction conserve cette formulation sexuée sans la neutraliser.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: son père et sa mère
  rationale: L’hébreu nomme explicitement chacun des deux parents; la traduction maintient cette forme plutôt que de réduire l’expression à « ses parents ».
- source_word: וְדָבַק
  choice: s’attachera à
  rationale: Le verbe דבק évoque une adhésion forte et durable. « S’attachera à » est actuel, lisible et moins archaïque que « s’unira à » ou certaines formulations traditionnelles, tout en préservant la force du lien.
- source_word: בְּאִשְׁתּוֹ
  choice: à sa femme
  rationale: Dans ce contexte matrimonial, אִשָּׁה avec suffixe possessif désigne l’épouse, non simplement une femme.
- source_word: וְהָיוּ
  choice: et ils deviendront
  rationale: Avec l’attribut « une seule chair », le verbe exprime l’aboutissement à un nouvel état. « Deviendront » rend clairement cette valeur résultative en français.
- source_word: לְבָשָׂר אֶחָד
  choice: une seule chair
  rationale: Cette formulation conserve l’image hébraïque et ses dimensions corporelle et relationnelle sans en réduire ni en développer artificiellement le sens.
theological_decisions:
- issue: Langage masculin représentatif dans la formulation du mariage
  choice: un homme
  alternative: une personne; quelqu’un
  rationale: L’hébreu emploie explicitement le masculin singulier אִישׁ. Le conserver respecte la forme du texte plutôt que de la neutraliser.
- issue: Nature de l’énoncé
  choice: Principe général rendu au futur (« quittera… s’attachera… deviendront »)
  alternative: Impératif direct; simple description d’une coutume passée
  rationale: Les formes verbales hébraïques énoncent un principe général fondé sur le récit de la création. Le futur français en préserve la portée proverbiale et normative sans introduire un ordre explicite absent du texte.
- issue: Portée de l’expression « une seule chair »
  choice: Conserver l’expression imagée sans l’expliciter dans le corps du texte
  alternative: un seul corps; une seule famille
  rationale: L’hébreu peut évoquer à la fois l’union corporelle et la constitution d’un nouveau lien de parenté. Une explicitation unique dans le texte principal supprimerait cette richesse sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur donne à la phrase sa portée générale sans recourir au tour juridique « devra ». La répétition explicite de « et » avant « ils deviendront » maintient la progression de l’hébreu.
