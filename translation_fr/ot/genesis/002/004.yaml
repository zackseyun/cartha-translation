source:
  edition: WLC
  text: אֵ֣לֶּה תוֹלְד֧וֹת הַ/שָּׁמַ֛יִם וְ/הָ/אָ֖רֶץ בְּ/הִבָּֽרְאָ֑/ם בְּ/י֗וֹם עֲשׂ֛וֹת יְהוָ֥ה אֱלֹהִ֖ים אֶ֥רֶץ וְ/שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: fr
  text: Voici l’histoire[a] des cieux et de la terre lorsqu’ils furent créés, au temps où[b] Yahweh Dieu[c] fit la terre et les cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu toledot, souvent traduit par « générations », peut aussi signifier « histoire », « récit » ou « origines » dans les titres de section de la Genèse.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au jour où »; cette expression hébraïque peut signifier « lorsque » ou « au temps où ».'
    reason: lexical_alternative
  - marker: c
    text: Le texte hébreu porte le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR » ou « l’Éternel »; sa prononciation ancienne exacte est incertaine.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: Voici l’histoire
  rationale: La formule introduit une nouvelle section de la Genèse. « Histoire » exprime ici naturellement le contenu ou le développement issu de ce qui précède, tandis qu’une note conserve les autres valeurs possibles de תוֹלְדוֹת.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: des cieux et de la terre
  rationale: « Cieux » respecte la forme hébraïque et, avec « terre », désigne l’ensemble de l’ordre créé.
- source_word: בְּהִבָּרְאָם
  choice: lorsqu’ils furent créés
  rationale: La préposition suivie de l’infinitif construit et du suffixe a ici une valeur temporelle; le passif rend le niphal de ברא.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: au temps où … fit
  rationale: L’expression littérale « au jour où » fonctionne idiomatiquement au sens de « lorsque » ou « au temps où »; la traduction évite de suggérer nécessairement une seule journée.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: La traduction conserve le nom divin YHWH sous la forme française courante « Yahweh », suivi de אֱלֹהִים, « Dieu ».
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: la terre et les cieux
  rationale: L’ordre inversé par rapport au début du verset est conservé pour respecter l’effet littéraire de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le rend comme un nom propre sans remplacer celui-ci par un titre; la vocalisation exacte de YHWH demeure toutefois incertaine.
- issue: Portée temporelle de בְּיוֹם
  choice: au temps où
  alternative: au jour où
  rationale: Dans cette construction, « au jour où » est un idiome hébreu pouvant désigner le moment ou la période où l’action s’accomplit. La traduction ne tranche donc pas ici la question de la durée de la création.
translation_notes:
  register: Français international moderne, clair et digne. « Voici l’histoire » fonctionne comme un titre de section naturel; les notes préservent l’étendue sémantique de la formule hébraïque, l’idiome temporel et la question du rendu du nom divin.
