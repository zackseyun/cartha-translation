  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: fr
  text: L’or de ce pays est de bonne qualité ; on y trouve le bdellium[a] et la pierre d’onyx[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « résine aromatique » ; la substance exacte désignée par le terme hébreu est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ou peut-être une autre pierre précieuse, comme le béryl ; l’identification exacte du terme hébreu שֹׁהַם est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב הָאָרֶץ הַהִוא
  choice: L’or de ce pays
  rationale: Le groupe désigne l’or du pays évoqué au verset précédent. En français, l’enchaînement est naturel sans rendre explicitement le waw initial, dont la fonction est ici surtout connective.
- source_word: טוֹב
  choice: est de bonne qualité
  rationale: Dans ce contexte, טוֹב qualifie la valeur ou la qualité de l’or. Cette formulation française exprime clairement ce sens sans ajouter de précision étrangère au texte.
- source_word: שָׁם
  choice: on y trouve
  rationale: Cette tournure idiomatique rend la valeur locative de « là » et introduit naturellement les deux substances mentionnées.
- source_word: הַבְּדֹלַח
  choice: le bdellium
  rationale: Le terme traditionnel « bdellium » conserve la spécificité du mot hébreu sans imposer une identification moderne incertaine.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: et la pierre d’onyx
  rationale: « Pierre » rend explicitement אֶבֶן, tandis qu’« onyx » suit l’identification traditionnelle de שֹׁהַם, dont la nature exacte demeure incertaine.
