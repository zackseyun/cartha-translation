revisions:
- from: L’homme donna des noms à tous les animaux domestiques, aux oiseaux du ciel et à tous les animaux sauvages. Mais, pour l’homme, il ne se trouva aucune aide qui lui corresponde[a][b].
  to: L’homme donna des noms à tous les animaux domestiques, aux oiseaux du ciel et à tous les animaux sauvages. Mais l’homme ne trouva aucune aide qui lui corresponde[a][b].
  rationale: La révision rétablit l’expression active de l’hébreu (« l’homme ne trouva »), sans modifier le sens du passage. Les notes sont ajustées pour correspondre exactement au texte révisé et pour préserver, d’une part, la lecture possible « Adam » et, d’autre part, l’alternative lexicale pour כְּנֶגְדּוֹ.
