  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: fr
  text: L’homme donna des noms à tous les animaux domestiques, aux oiseaux du ciel et à tous les animaux sauvages. Mais l’homme ne trouva aucune aide qui lui corresponde[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Adam donna des noms… Mais Adam ne trouva aucune aide qui lui corresponde. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « aucune aide qui lui convienne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: l’homme / pour l’homme
  rationale: Dans le récit, le terme désigne ici l’être humain masculin particulier, tout en gardant son sens de nom commun. « L’homme » convient donc mieux que « l’humanité » et évite de transformer trop tôt le mot en nom propre « Adam ».
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: donna des noms
  rationale: Cette tournure rend naturellement l’expression hébraïque « appeler des noms » et conserve l’idée concrète d’attribuer plusieurs noms.
- source_word: הַבְּהֵמָה
  choice: les animaux domestiques
  rationale: Le mot désigne ici une catégorie d’animaux distincte des animaux sauvages. « Animaux domestiques » est clair en français international et ne restreint pas indûment le sens au seul bétail d’élevage.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: Cette formulation française naturelle conserve l’image hébraïque du ciel et convient au contexte animalier.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: tous les animaux sauvages
  rationale: L’expression désigne les animaux terrestres non domestiques. Cette formulation actuelle fait ressortir leur contraste avec les animaux domestiques.
- source_word: עֵזֶר
  choice: une aide
  rationale: Le nom hébreu peut désigner l’aide ou la personne qui l’apporte. « Une aide » préserve cette amplitude et n’implique par lui-même aucune infériorité.
- source_word: כְּנֶגְדּוֹ
  choice: qui lui corresponde
  rationale: La formule exprime une relation de vis-à-vis et de correspondance. Ce choix conserve cette nuance sans préciser plus que l’hébreu la nature de cette adéquation.
- source_word: לֹא מָצָא
  choice: il ne se trouva
  rationale: Le verbe hébreu est actif, « il ne trouva pas », mais cette tournure impersonnelle française exprime naturellement le résultat de la recherche tout en maintenant l’absence d’une aide correspondante. La forme active est signalée en note.
theological_decisions:
- issue: Valeur de אָדָם dans Genèse 2.20
  choice: l’homme
  alternative: Adam
  rationale: L’article au premier emploi et le développement littéraire favorisent encore le nom commun désignant l’homme du récit. La lecture comme nom propre reste possible et est conservée en note.
- issue: Sens relationnel de כְּנֶגְדּוֹ
  choice: qui lui corresponde
  alternative: qui lui convienne
  rationale: « Qui lui corresponde » garde la tension entre ressemblance, adéquation et position de vis-à-vis, sans réduire l’expression à une simple convenance.
- issue: Voix de לֹא מָצָא
  choice: il ne se trouva aucune aide
  alternative: l’homme ne trouva aucune aide
  rationale: La formulation retenue met l’accent sur le constat d’absence, comme le permet le contexte, tandis que la note conserve explicitement la syntaxe active de l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La phrase évite les archaïsmes, maintient la répétition de « l’homme » présente dans l’hébreu et conserve l’ambiguïté entre nom commun et nom propre ainsi que la nuance de correspondance de כְּנֶגְדּוֹ.
