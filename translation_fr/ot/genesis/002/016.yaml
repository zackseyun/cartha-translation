source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: fr
  text: 'Yahweh Dieu donna cet ordre à l’homme : « Tu peux manger librement[a] de tous les arbres du jardin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu renforce ici le verbe « manger » ; on peut aussi traduire : « tu peux certainement manger ».'
    reason: La construction infinitif absolu + verbe conjugué marque une insistance que le français peut exprimer de plusieurs manières.
lexical_decisions:
- source_word: וַיְצַו
  choice: donna cet ordre
  rationale: Le verbe צוה exprime un commandement formulé avec autorité. « Donna cet ordre » est naturel en français et introduit clairement les paroles qui suivent.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Cette traduction conserve le nom divin יהוה et rend אֱלֹהִים par le terme français courant « Dieu ».
- source_word: עַל הָאָדָם
  choice: à l’homme
  rationale: Avec צוה, la préposition עַל désigne ici le destinataire de l’ordre. Dans ce contexte narratif, הָאָדָם renvoie à l’homme individuellement, et non à l’humanité en général.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le français introduit naturellement le discours direct par deux-points; traduire littéralement par « en disant » alourdirait inutilement la phrase.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: de tous les arbres du jardin
  rationale: Cette formulation française naturelle exprime que la permission s’étend sans exception aux arbres du jardin, avant la restriction énoncée au verset suivant.
- source_word: אָכֹל תֹּאכֵל
  choice: tu peux manger librement
  rationale: La construction associant l’infinitif absolu au verbe conjugué renforce l’idée verbale. Dans ce contexte, elle accorde une permission étendue plutôt qu’elle n’impose l’obligation de manger; « librement » rend cette nuance avec naturel.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte hébreu emploie explicitement le nom personnel יהוה. Sa translittération préserve le nom plutôt que de lui substituer un titre.
- issue: Référence de הָאָדָם
  choice: l’homme
  alternative: l’être humain
  rationale: Dans le récit immédiat, le terme désigne l’individu que Dieu vient de façonner et de placer dans le jardin. « L’homme » conserve cette référence masculine singulière sans l’élargir à toute l’humanité.
- issue: Valeur modale de אָכֹל תֹּאכֵל
  choice: 'permission renforcée : « tu peux manger librement »'
  alternative: 'obligation renforcée : « tu dois absolument manger »'
  rationale: La restriction contrastive du verset suivant montre que cette première parole accorde une permission générale. La traduction garde aussi l’intensification propre à la construction hébraïque.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe du discours direct est idiomatique; « librement » restitue l’emphase hébraïque sans donner à la permission la forme artificielle d’un ordre de manger.
