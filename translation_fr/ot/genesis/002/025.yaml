  text: וַ/יִּֽהְי֤וּ שְׁנֵי/הֶם֙ עֲרוּמִּ֔ים הָֽ/אָדָ֖ם וְ/אִשְׁתּ֑/וֹ וְ/לֹ֖א יִתְבֹּשָֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: fr
  text: L’homme et sa femme étaient tous les deux nus[a], et ils n’en avaient pas honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils étaient tous les deux nus »; la formulation hébraïque souligne que chacun des deux était sans vêtements.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: Dans cette proposition à prédicat adjectival, la forme narrative de היה exprime naturellement un état passé.
- source_word: שְׁנֵיהֶם
  choice: tous les deux
  rationale: Cette expression souligne que l’affirmation vaut pour chacun des deux membres du couple; « tous les deux » est naturel et explicite en français moderne.
- source_word: עֲרוּמִּים
  choice: nus
  rationale: L’adjectif désigne l’absence de vêtements. « Nus » est le terme français courant, direct et digne.
- source_word: הָאָדָם
  choice: l’homme
  rationale: Le référent est ici l’individu masculin mis en relation avec « sa femme », et non l’humanité en général.
- source_word: וְאִשְׁתּוֹ
  choice: et sa femme
  rationale: Le nom אִשָּׁה avec le suffixe masculin singulier exprime ici naturellement la relation conjugale.
- source_word: וְלֹא יִתְבֹּשָׁשׁוּ
  choice: et ils n’en avaient pas honte
  rationale: Le verbe exprime l’expérience de la honte. Le pronom « en » rattache idiomatiquement cette absence de honte à leur nudité sans ajouter d’idée étrangère.
theological_decisions:
- issue: Sens de אָדָם dans ce contexte
  choice: l’homme
  alternative: l’être humain
  rationale: La mention de « sa femme » identifie contextuellement le référent masculin. Ce choix conserve la précision narrative sans tirer de conclusion anthropologique plus large.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste naturelle tout en conservant l’accent de l’hébreu sur les deux membres du couple et la notion forte de honte.
