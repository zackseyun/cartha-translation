  - severity: low
    issue: Note a consacrée à une variante de graphie
    rationale: Après correction du nom en « Gihôn », une note de translittération n’est plus nécessaire. Une note sur « entoure » documente utilement l’alternative lexicale de הַסּוֹבֵב, conformément au texte source et à la piste d’audit anglaise.
