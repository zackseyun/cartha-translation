  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: fr
  text: Et le nom du deuxième fleuve est Gihôn[a] ; c’est celui qui fait le tour de tout le pays de Koush[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui entoure tout le pays de Koush ».
    reason: Alternative lexicale pour le participe hébreu décrivant le cours du fleuve.
  - marker: b
    text: Koush est un ancien nom de lieu traditionnellement associé à des régions situées au sud de l’Égypte ; le texte hébreu conserve le nom ancien lui-même.
    reason: Note culturelle destinée à éviter une identification anachronique avec un État moderne.
lexical_decisions:
- source_word: וְ/שֵׁם הַ/נָּהָר הַ/שֵּׁנִי
  choice: Le deuxième fleuve s’appelle
  rationale: Cette formulation française naturelle rend l’expression hébraïque littéralement construite comme « et le nom du deuxième fleuve », tout en conservant l’enchaînement et l’ordre des fleuves.
- source_word: גִּיחוֹן
  choice: Guihôn
  rationale: Le nom propre hébreu est translittéré selon un usage français reconnaissable plutôt que traduit.
- source_word: הוּא
  choice: c’est celui
  rationale: Le pronom reprend le fleuve avec une valeur d’identification et introduit naturellement sa description en français.
- source_word: הַ/סּוֹבֵב
  choice: qui fait le tour
  rationale: Le participe de סבב peut signifier aller autour, faire le tour ou entourer. « Fait le tour » demeure naturel et évite d’imposer une précision topographique absente de l’hébreu.
- source_word: אֵת כָּל אֶרֶץ
  choice: de tout le pays de
  rationale: Cette formulation rend l’étendue exprimée par כָּל et emploie « pays » au sens géographique ancien, courant et intelligible.
- source_word: כּוּשׁ
  choice: Koush
  rationale: Le toponyme ancien est conservé sous une translittération française ; « Éthiopie » serait une identification interprétative et potentiellement anachronique.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe nominale hébraïque est rendue idiomatiquement par « s’appelle ». « Fait le tour » préserve la latitude sémantique du participe sans trancher entre un parcours autour du pays et son encerclement complet.
