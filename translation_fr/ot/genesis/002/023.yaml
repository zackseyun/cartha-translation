id: GEN.2.23
reference: Genesis 2:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: fr
  text: 'Alors l’homme dit : « Cette fois-ci[a], c’est l’os de mes os et la chair de ma chair ! Celle-ci sera appelée “femme”, car elle a été prise de l’homme[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Enfin, c’est… »'
    reason: L’expression זֹאת הַפַּעַם peut marquer avec force que cette fois est la bonne, d’où la traduction idiomatique « enfin ».
  - marker: b
    text: En hébreu, les mots rendus par « femme » (ishsha) et « homme » (ish) ont une forte ressemblance sonore, sur laquelle repose l’explication donnée ici.
    reason: Le jeu de mots central du texte hébreu n’est que partiellement perceptible en français.
lexical_decisions:
- source_word: הָאָדָם
  choice: l’homme
  rationale: Dans ce contexte, אָדָם désigne l’être humain masculin et prépare le rapprochement entre אִישׁ (« homme ») et אִשָּׁה (« femme »).
- source_word: זֹאת הַפַּעַם
  choice: Cette fois-ci, c’est
  rationale: Cette tournure française conserve la référence à l’occasion présente tout en exprimant naturellement la reconnaissance emphatique portée par l’hébreu.
- source_word: עֶצֶם מֵעֲצָמַי
  choice: l’os de mes os
  rationale: La formule idiomatique française garde l’image corporelle, la structure superlative ou relationnelle de l’expression et son parallélisme avec « la chair de ma chair ».
- source_word: וּבָשָׂר מִבְּשָׂרִי
  choice: et la chair de ma chair
  rationale: Cette formulation naturelle reproduit le parallélisme poétique et exprime l’origine commune indiquée par מִן.
- source_word: לְזֹאת
  choice: Celle-ci
  rationale: Le démonstratif féminin conserve l’insistance de l’hébreu sur la personne qui vient d’être présentée.
- source_word: יִקָּרֵא
  choice: sera appelée
  rationale: Le passif français correspond au niphal de קרא dans cette formule de désignation.
- source_word: אִשָּׁה
  choice: femme
  rationale: « Femme » est le sens contextuel direct et permet de faire partiellement entendre le jeu lexical avec אִישׁ, rendu par « homme ».
- source_word: כִּי
  choice: car
  rationale: « Car » introduit clairement, dans un registre digne et courant, la raison donnée pour cette appellation.
- source_word: מֵאִישׁ לֻקֳחָה זֹאת
  choice: elle a été prise de l’homme
  rationale: La formulation garde le passif, l’idée de provenance exprimée par מִן et la relation lexicale entre « femme » et « homme »; le pronom reprend naturellement le démonstratif final hébreu.
theological_decisions:
- issue: Sens de אָדָם dans ce verset
  choice: l’homme
  alternative: l’être humain
  rationale: Le contexte immédiat distingue le personnage masculin de la femme et conduit au couple lexical אִישׁ / אִשָּׁה. « L’homme » préserve cette articulation sans étendre le propos au-delà du verset.
- issue: Jeu de mots אִישׁ / אִשָּׁה
  choice: femme… homme
  alternative: épouse… mari
  rationale: Le couple « femme / homme » conserve le sens lexical général et un écho sonore partiel. « Épouse / mari » préciserait ici une relation conjugale que ces mots n’expriment pas nécessairement à eux seuls.
- issue: Rapport d’origine exprimé par מִן
  choice: prise de l’homme
  alternative: tirée de l’homme
  rationale: « Prise de » reste proche du verbe לקח et maintient sobrement l’affirmation d’origine, sans ajouter une interprétation sur la manière précise de cette prise.
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation rend l’élan de reconnaissance du discours; les répétitions « os de mes os » et « chair de ma chair » sont conservées pour leur force poétique et leur importance littéraire.
