id: GEN.2.8
reference: Genesis 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: fr
  text: Yahweh Dieu planta un jardin en Éden, à l’est[a], et il y plaça l’homme qu’il avait formé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers l’est ». L’expression hébraïque peut indiquer soit un emplacement à l’est, soit une orientation ou une direction vers l’est.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: planta
  rationale: Le verbe נטע désigne naturellement l’action de planter; « planta » convient au jardin et reste simple et concret.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Le nom divin יהוה est translittéré « Yahweh », tandis que אֱלֹהִים est rendu par « Dieu ».
- source_word: גַּן בְעֵדֶן
  choice: un jardin en Éden
  rationale: גַּן désigne ici un espace cultivé, et עֵדֶן est traité comme un nom de lieu.
- source_word: מִקֶּדֶם
  choice: à l’est
  rationale: Dans ce contexte, l’expression situe probablement le jardin à l’est, tout en gardant en note la possibilité d’une orientation ou d’un mouvement vers l’est.
- source_word: וַיָּשֶׂם שָׁם
  choice: il y plaça
  rationale: « Y plaça » rend naturellement en français le verbe שׂים accompagné de l’adverbe שָׁם, sans lourdeur.
- source_word: הָאָדָם
  choice: l’homme
  rationale: L’article défini et le contexte renvoient à l’être humain particulier précédemment formé, et non à l’humanité en général.
- source_word: אֲשֶׁר יָצָר
  choice: qu’il avait formé
  rationale: יצר signifie « former, façonner »; le plus-que-parfait explicite naturellement en français l’antériorité de cette action dans le récit.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Rendu de הָאָדָם
  choice: l’homme
  alternative: l’être humain
  rationale: Le syntagme désigne ici l’individu précis que Dieu avait formé. « L’homme » préserve ce renvoi narratif, sans généraliser à toute l’humanité.
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation reste proche de la structure hébraïque tout en employant l’élision naturelle « il y plaça » et le plus-que-parfait idiomatique.
