  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: fr
  text: 'Alors Yahweh Dieu dit : « Il n’est pas bon que l’homme soit seul. Je lui ferai une aide qui lui corresponde[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une aide qui lui convienne », « une aide à sa mesure » ou « une aide qui soit son vis-à-vis ». L’expression hébraïque évoque une personne qui lui fait face et lui correspond, et non simplement une aide subalterne.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Conserve le nom divin personnel יהוה sous la forme « Yahweh » et rend אֱלֹהִים par le titre courant « Dieu ».
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le verbe signifie « dire » et le waw narratif fait progresser le récit ; « Puis » restitue naturellement cet enchaînement en français.
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: Il n’est pas bon que l’homme soit seul
  rationale: Cette formulation idiomatique maintient l’évaluation négative, la construction infinitive et la référence à l’individu masculin du récit.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: Je vais lui faire
  rationale: L’imparfait à la première personne exprime ici l’intention divine ; le futur proche est naturel dans ce discours de décision immédiate.
- source_word: עֵזֶר
  choice: une aide
  rationale: Le nom désigne une personne qui apporte du secours. En français, « une aide » reste direct et n’implique par lui-même ni infériorité ni supériorité.
- source_word: כְּנֶגְדּוֹ
  choice: qui lui corresponde
  rationale: Cette expression rend l’idée de vis-à-vis, d’adéquation et de correspondance, sans réduire la personne à une simple assistante subalterne.
theological_decisions:
- issue: Sens contextuel de הָאָדָם
  choice: l’homme
  alternative: l’être humain ; l’humain
  rationale: Le contexte vise ici l’individu masculin déjà formé dans le jardin, tout en laissant intacte sa portée représentative.
- issue: Rapport exprimé par עֵזֶר כְּנֶגְדּוֹ
  choice: une aide qui lui corresponde
  alternative: une aide qui lui convienne ; une aide à sa mesure ; une aide qui soit son vis-à-vis
  rationale: L’hébreu affirme à la fois l’aide apportée et la correspondance avec l’homme, sans énoncer une hiérarchie. La traduction ne doit donc importer ni infériorité ni supériorité.
translation_notes:
  register: Français international moderne, naturel et digne. « Yahweh » conserve le nom divin. « Une aide qui lui corresponde » privilégie la clarté relationnelle tout en préservant la tension et l’ambiguïté légitimes de l’expression hébraïque.
