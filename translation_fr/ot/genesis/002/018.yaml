  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : l’évaluation « il n’est pas bon », la solitude de l’homme, l’intention divine et les deux composantes de עֵזֶר כְּנֶגְדּוֹ (aide et correspondance) sont préservées. « Je vais lui faire » est possible, mais le futur simple rend plus directement l’imparfait d’intention בלי ajouter la nuance française de futur proche.'
