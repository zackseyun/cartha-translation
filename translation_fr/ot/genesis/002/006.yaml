  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: fr
  text: Mais une brume montait de la terre et arrosait toute la surface du sol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cours d’eau » ou « un flot » ; le terme hébreu est rare et peut désigner de l’eau qui jaillit de la terre plutôt qu’une brume dans l’air.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: Mais une brume
  rationale: Le terme אֵד est rare et son sens demeure discuté. « Brume » convient au mouvement ascendant exprimé par יַעֲלֶה, tandis que « mais » marque le contraste avec l’absence de pluie mentionnée au verset précédent.
- source_word: יַעֲלֶה
  choice: montait
  rationale: L’imparfait hébreu, dans ce cadre narratif passé, décrit vraisemblablement une action habituelle ou caractéristique. L’imparfait français rend naturellement cette valeur.
- source_word: מִן הָ/אָ֑רֶץ
  choice: de la terre
  rationale: אֶרֶץ désigne ici la terre dans le cadre général de la création; « de la terre » exprime naturellement l’origine du phénomène.
- source_word: וְ/הִשְׁקָה
  choice: et arrosait
  rationale: Le hiphil de שקה signifie faire boire ou arroser. « Arrosait » est courant et conserve l’aspect descriptif de l’action sans le caractère technique d’« irriguait ».
- source_word: אֶת כָּל פְּנֵי
  choice: toute la surface de
  rationale: Cette formulation française naturelle rend l’expression idiomatique hébraïque désignant toute l’étendue visible.
- source_word: הָֽ/אֲדָמָֽה
  choice: du sol
  rationale: אֲדָמָה désigne le sol ou la terre cultivable. « Sol » maintient la distinction lexicale avec אֶרֶץ, rendu juste avant par « terre ».
theological_decisions:
- issue: Interprétation de אֵד
  choice: brume
  alternative: cours d’eau ou flot
  rationale: Le mouvement ascendant favorise la lecture « brume », mais la rareté du terme ne permet pas d’exclure une eau jaillissant ou s’écoulant depuis le sol. L’alternative est donc conservée en note sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. L’imparfait présente les deux actions comme habituelles ou caractéristiques dans le cadre passé. La distinction entre « terre » (אֶרֶץ) et « sol » (אֲדָמָה) est préservée.
