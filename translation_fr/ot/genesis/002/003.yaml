base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: fr
  text: Dieu bénit le septième jour et le rendit saint[a], car, ce jour-là, il se reposa[b] de toute son œuvre, que Dieu avait créée pour faire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le consacra » ou « le mit à part comme saint ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu traduit par « se reposa » peut aussi signifier « cessa » ou « s’arrêta ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « que Dieu avait créée pour faire ». La tournure hébraïque est difficile ; on peut aussi comprendre : « que Dieu avait créée et faite » ou « que Dieu avait créée en la faisant ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Le piel de ברך exprime ici la bénédiction accordée au septième jour ; « bénit » est direct, naturel et traditionnel sans être archaïque.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom commande ici des verbes au singulier et désigne le Dieu unique dans ce récit.
- source_word: יוֹם הַשְּׁבִיעִי
  choice: le septième jour
  rationale: Traduction formelle et idiomatique du nom accompagné de l’ordinal défini.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: le rendit saint
  rationale: Le piel de קדש signifie consacrer ou mettre à part comme saint. Cette formulation moderne conserve explicitement la notion de sainteté.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle Dieu bénit le jour et le rend saint ; « car » convient au registre narratif soutenu.
- source_word: בּוֹ
  choice: ce jour-là
  rationale: Cette formulation idiomatique française reprend clairement le septième jour comme antécédent.
- source_word: שָׁבַת
  choice: se reposa
  rationale: Le verbe peut signifier cesser ou se reposer. « Se reposa » préserve le lien contextuel avec le sabbat, tandis qu’une note signale l’autre valeur lexicale.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: de toute son œuvre
  rationale: מלאכה désigne le travail ou l’ouvrage accompli. « Œuvre » convient au contexte créateur et le suffixe possessif est conservé.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: que Dieu avait créée pour la faire
  rationale: Cette traduction garde la distinction entre ברא, « créer », et עשה, « faire », ainsi que la construction difficile de l’infinitif, sans la transformer silencieusement en deux verbes coordonnés.
theological_decisions:
- issue: Sens de שָׁבַת et rapport au sabbat
  choice: se reposa
  alternative: cessa
  rationale: « Se reposa » maintient le lien littéraire et théologique avec le septième jour sans affirmer que Dieu aurait éprouvé de la fatigue. La possibilité lexicale « cessa » est conservée en note.
- issue: Portée de וַיְקַדֵּשׁ אֹתוֹ
  choice: le rendit saint
  alternative: le consacra ; le mit à part comme saint
  rationale: Le texte principal conserve le vocabulaire explicite de la sainteté, tandis que les alternatives précisent la dimension de consécration sans imposer une lecture confessionnelle.
- issue: Construction finale אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: que Dieu avait créée pour la faire
  alternative: que Dieu avait créée et faite ; que Dieu avait créée en la faisant
  rationale: La construction hébraïque est difficile. Le texte principal en préserve la tension au lieu de trancher en faveur d’une coordination ou d’une valeur instrumentale ; la note présente les principales compréhensions.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la répétition de « Dieu » présente dans l’hébreu et maintient volontairement l’étrangeté mesurée de la proposition finale, expliquée en note.
