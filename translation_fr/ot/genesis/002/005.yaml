id: GEN.2.5
reference: Genesis 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: fr
  text: Aucun arbuste des champs n’était encore sur la terre[a], et aucune plante des champs n’avait encore poussé, car Yahweh Dieu n’avait pas fait pleuvoir sur la terre, et il n’y avait aucun être humain pour travailler le sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « buisson des champs ».'
    reason: lexical_alternative
  - marker: b
    text: En hébreu, les mots rendus par « être humain » (ʼadam) et « sol » (ʼadamah) sont étroitement apparentés.
    reason: wordplay
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: arbuste des champs
  rationale: « Arbuste » rend le végétal ligneux désigné par שִׂיחַ et maintient la distinction avec עֵשֶׂב, terme plus général pour une plante herbacée.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: n’était encore sur la terre
  rationale: טֶרֶם exprime une situation qui ne s’est pas encore réalisée; « sur la terre » convient au cadre universel du récit de création.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: plante des champs
  rationale: « Plante » rend largement עֵשֶׂב sans le limiter à l’herbe ou aux plantes comestibles, tout en le distinguant d’« arbuste ».
- source_word: טֶרֶם יִצְמָח
  choice: n’avait encore poussé
  rationale: Le verbe צמח évoque le fait de germer ou de sortir de terre; « pousser » est naturel en français et suffisamment large.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici l’explication de l’absence de végétation; « car » relie naturellement les propositions dans un registre narratif digne.
- source_word: הִמְטִיר
  choice: avait fait pleuvoir
  rationale: La forme causative du verbe מטר est conservée explicitement par « faire pleuvoir ».
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: La translittération « Yahweh » représente directement le nom divin יהוה, tandis que אֱלֹהִים est rendu par « Dieu ».
- source_word: וְאָדָם אַיִן
  choice: il n’y avait aucun être humain
  rationale: אָדָם désigne ici l’humain en tant que cultivateur, avant que le récit n’accentue la différenciation sexuelle; « être humain » préserve cette portée sans imposer le sens collectif d’« humanité ».
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: pour travailler le sol
  rationale: עבד signifie ici travailler ou cultiver, et אֲדָמָה désigne le sol arable. La formulation reste claire sans préciser une technique agricole.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: terre / sol
  rationale: Ces choix préservent la distinction entre אֶרֶץ, la terre au sens large, et אֲדָמָה, le sol destiné à être travaillé.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le rend directement plutôt que de lui substituer un titre, tout en laissant possible en note la convention française « le SEIGNEUR ».
- issue: Portée de אָדָם dans ce contexte
  choice: être humain
  alternative: homme
  rationale: Sans nier que le personnage sera ensuite désigné comme l’homme, אָדָם souligne ici l’absence d’un humain pour cultiver אֲדָמָה. « Être humain » conserve la valeur représentative et le jeu lexical est signalé en note.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve l’enchaînement explicatif de l’hébreu, la distinction entre « terre » et « sol », ainsi que celle entre « arbuste » et « plante ». Aucun marqueur discursif absent de la source n’a été ajouté.
