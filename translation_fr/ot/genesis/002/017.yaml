  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: fr
  text: mais de l’arbre de la connaissance du bien et du mal, tu ne mangeras pas, car le jour où tu en mangeras[a], tu mourras à coup sûr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque traduite par « le jour où » peut aussi signifier « quand » ou « lorsque ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: mais de l’arbre
  rationale: La conjonction וּ marque ici le contraste avec la permission générale du verset précédent; « mais » rend naturellement cette fonction, tandis que « de l’arbre » conserve la préposition מן.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: de la connaissance du bien et du mal
  rationale: Cette formulation garde le nom « connaissance » ainsi que le couple hébreu « bien et mal », sans préciser s’il désigne une connaissance morale, une capacité de discernement ou une totalité.
- source_word: לֹא תֹאכַל
  choice: tu ne mangeras pas
  rationale: Le futur français employé comme défense convient au registre solennel du commandement tout en restant naturel et clair.
- source_word: בְּיוֹם אֲכָלְךָ מִמֶּנּוּ
  choice: le jour où tu en mangeras
  rationale: « Le jour où » suit de près l’expression temporelle hébraïque et en préserve la tension; le pronom « en » rend idiomatiquement מן répété en hébreu.
- source_word: מוֹת תָּמוּת
  choice: tu mourras à coup sûr
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la mort. « À coup sûr » exprime cette intensification en français moderne sans reproduire maladroitement « mourir, tu mourras ».
theological_decisions:
- issue: Portée temporelle de בְּיוֹם (« le jour où ») et accomplissement de la mort annoncée
  choice: Conserver « le jour où » dans le texte principal
  alternative: Traduire par « quand » ou interpréter explicitement l’expression comme une mort physique immédiate, l’entrée dans la condition mortelle ou la prononciation d’une sentence de mort
  rationale: L’expression hébraïque peut fonctionner comme une tournure temporelle équivalant à « quand », mais sa forme littérale évoque aussi un jour précis. La traduction maintient cette ambiguïté et ne tranche pas le débat théologique.
translation_notes:
  register: Français international moderne, clair et digne. L’objet placé en tête de phrase conserve l’accent de la construction hébraïque, tandis que l’omission d’un pronom résomptif après « tu ne mangeras pas » évite une répétition peu naturelle en français.
