id: GEN.2.14
reference: Genesis 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: fr
  text: Le troisième fleuve s’appelle le Hiddékel[a] ; c’est celui qui coule à l’est d’Assour[b]. Le quatrième fleuve est l’Euphrate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Hiddékel est traditionnellement identifié au Tigre.
    reason: alternative_reading
  - marker: b
    text: 'Ou « à l’est de l’Assyrie » ; hébreu : « à l’est d’Assour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: s’appelle
  rationale: Dans la formule hébraïque « le nom du… », le français naturel emploie « s’appelle », qui en conserve pleinement le sens.
- source_word: נָּהָר
  choice: fleuve
  rationale: Le contexte décrit de grands cours d’eau nommés ; « fleuve » est idiomatique en français pour le Tigre et l’Euphrate.
- source_word: שְּׁלִישִׁי
  choice: troisième
  rationale: Traduction directe de l’adjectif ordinal.
- source_word: חִדֶּקֶל
  choice: Hiddékel
  rationale: Translittération française proche du nom hébreu, plutôt que substitution silencieuse de l’identification traditionnelle « Tigre ».
- source_word: הוּא הַהֹלֵךְ
  choice: c’est celui qui coule
  rationale: Cette tournure rend la valeur identificatrice du pronom et traduit idiomatiquement le mouvement d’un cours d’eau.
- source_word: קִדְמַת
  choice: à l’est de
  rationale: Le sens géographique oriental convient au contexte, tout en reconnaissant que le terme peut littéralement évoquer l’avant ou le devant.
- source_word: אַשּׁוּר
  choice: Assour
  rationale: Translittération française du nom hébreu ; le référent peut être la région d’Assyrie, possibilité signalée en note.
- source_word: רְבִיעִי
  choice: quatrième
  rationale: Traduction directe de l’adjectif ordinal.
- source_word: פְרָת
  choice: l’Euphrate
  rationale: Nom français traditionnel, établi et immédiatement compréhensible de ce fleuve.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La coordination répétée de l’hébreu est allégée sans perte de contenu. « Coule » est plus idiomatique en français pour un fleuve que le littéral « va ».
