  variant: modern international French
source:
  edition: WLC
  text: שֵׁ֥ם הָֽ/אֶחָ֖ד פִּישׁ֑וֹן ה֣וּא הַ/סֹּבֵ֗ב אֵ֚ת כָּל אֶ֣רֶץ הַֽ/חֲוִילָ֔ה אֲשֶׁר שָׁ֖ם הַ/זָּהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: fr
  text: Le premier s’appelle Pishôn ; c’est celui qui fait le tour[a] de tout le pays de Havila, où il y a de l’or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui entoure tout le pays de Havila ». Le participe hébreu peut signifier « aller autour », « faire le tour » ou « entourer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: Le premier s’appelle
  rationale: La tournure française naturelle « s’appelle » exprime fidèlement la formule hébraïque « le nom du premier », tandis que « le premier » rend la valeur ordinale du contexte.
- source_word: פִּישׁוֹן
  choice: Pishôn
  rationale: Nom propre du fleuve, translittéré en français avec un accent circonflexe pour signaler la voyelle longue.
- source_word: הוּא הַסֹּבֵב
  choice: c’est celui qui fait le tour
  rationale: Le participe de סבב désigne le fait d’aller autour, de contourner ou d’entourer. « Fait le tour » est idiomatique en français et évite d’ajouter explicitement l’idée de couler.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: de tout le pays de Havila
  rationale: « Pays » convient à un territoire nommé, et « tout » conserve la portée de כָּל. Havila est translittéré comme nom de lieu.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: où il y a de l’or
  rationale: Cette formulation française claire conserve la valeur locative de שָׁם et exprime naturellement la présence d’or.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation reste proche de l’hébreu tout en évitant le calque peu naturel « le nom du premier est ». Le point-virgule maintient le lien entre le nom du fleuve et sa description.
