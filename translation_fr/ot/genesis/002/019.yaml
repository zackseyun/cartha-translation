revisions:
- from: Yahvé Dieu avait formé[a], à partir du sol, tous les animaux sauvages et tous les oiseaux du ciel. Il les amena vers l’homme[b] pour voir comment celui-ci les nommerait. Quel que soit le nom que l’homme donnait à chaque être vivant, c’était son nom.
  to: Yahvé Dieu avait formé[a] du sol tous les animaux sauvages et tous les oiseaux du ciel; il les amena à l’homme[b] pour voir quel nom celui-ci leur donnerait. Tout nom que l’homme donnerait à un être vivant serait son nom.
  rationale: La révision resserre les prépositions et harmonise la seconde phrase avec la valeur prospective et distributive de la scène de nomination. Elle conserve le plus-que-parfait contextuel, sans le présenter comme exigé par la forme hébraïque, et maintient les deux notes nécessaires.
