source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: fr
  text: Yahvé Dieu avait formé[a] du sol tous les animaux sauvages et tous les oiseaux du ciel; il les amena à l’homme[b] pour voir quel nom celui-ci leur donnerait. Tout nom que l’homme donnerait à un être vivant serait son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « forma ». Le verbe hébreu peut être traduit par un passé narratif simple; le plus-que-parfait interprète ici la formation comme antérieure au fait d’amener les animaux à l’homme.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Adam ». L’hébreu porte ha’adam, littéralement « l’homme ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: avait formé
  rationale: Le plus-que-parfait exprime naturellement en français une formation antérieure à l’action d’amener les animaux à l’homme. La forme hébraïque peut toutefois se traduire par un passé narratif simple, possibilité signalée en note.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahvé Dieu
  rationale: « Yahvé » représente le nom divin יהוה plutôt que de le remplacer par un titre; l’ensemble rend directement le syntagme hébreu.
- source_word: מִן הָאֲדָמָה
  choice: à partir du sol
  rationale: Cette formulation rend l’origine matérielle indiquée par מִן et אֲדָמָה, tout en conservant le lien lexical avec la formation de l’homme à partir du sol.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: tous les animaux sauvages
  rationale: Le pluriel français rend naturellement la valeur englobante de כָּל avec le nom collectif; « animaux sauvages » communique clairement la référence aux animaux terrestres des espaces non domestiques.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: tous les oiseaux du ciel
  rationale: Rendu français courant et proche de l’expression hébraïque.
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: Il les amena vers l’homme
  rationale: Le pronom « les » explicite l’objet pluriel sous-entendu en hébreu. « L’homme » conserve ici la valeur de nom commun de הָאָדָם.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: pour voir comment celui-ci les nommerait
  rationale: « Pour voir » conserve l’infinitif de but. « Nommer » exprime naturellement en français le sens de קרא dans ce contexte, tandis que « celui-ci » évite toute ambiguïté sur le sujet.
- source_word: וְכֹל אֲשֶׁר יִקְרָא לוֹ הָאָדָם נֶפֶשׁ חַיָּה
  choice: Quel que soit le nom que l’homme donnait à chaque être vivant
  rationale: La tournure rend la portée généralisante de כֹל אֲשֶׁר et la valeur distributive appliquée aux créatures. « Être vivant » évite les connotations théologiques étrangères que pourrait suggérer « âme vivante ».
- source_word: הוּא שְׁמוֹ
  choice: c’était son nom
  rationale: Cette proposition nominale est rendue par une formulation française simple qui conserve l’identification entre le nom donné et le nom de la créature.
theological_decisions:
- issue: Valeur temporelle de וַיִּצֶר par rapport au récit de création précédent
  choice: 'Plus-que-parfait : « avait formé »'
  alternative: 'Passé simple : « forma »'
  rationale: La morphologie hébraïque n’impose pas le plus-que-parfait, mais le contexte permet de comprendre la formation comme antérieure à la présentation des animaux à l’homme. La note maintient explicitement l’autre lecture grammaticale possible sans trancher la tension du récit.
- issue: Valeur de הָאָדָם
  choice: 'Nom commun : « l’homme »'
  alternative: 'Nom propre : « Adam »'
  rationale: L’article défini et le jeu de mots contextuel entre אָדָם et אֲדָמָה favorisent le sens commun « l’homme ». La lecture traditionnelle comme nom propre reste indiquée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait évite une séquence française artificielle tout en laissant le passé simple en note. « Yahvé » translittère le nom divin; « animaux sauvages », « oiseaux du ciel » et « être vivant » privilégient des expressions immédiatement compréhensibles sans archaïsme ni surcharge doctrinale.
