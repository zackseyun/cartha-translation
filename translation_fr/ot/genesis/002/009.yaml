source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: fr
  text: Yahweh Dieu fit pousser du sol tous les arbres agréables à voir et bons à manger, ainsi que l’arbre de vie au milieu du jardin et l’arbre de la connaissance du bien et du mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la connaissance du bien et du mal » est conservée littéralement. Elle peut notamment évoquer le discernement moral, la maturité ou une connaissance englobante.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: fit pousser
  rationale: Le hifil de צמח a ici un sens causatif. « Fit pousser » le rend naturellement en français.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Cette forme conserve le nom divin יהוה et rend אֱלֹהִים par « Dieu ».
- source_word: מִן הָאֲדָמָה
  choice: du sol
  rationale: אֲדָמָה désigne ici le sol d’où poussent les arbres; « du sol » est précis et idiomatique.
- source_word: כָּל עֵץ
  choice: toutes sortes d’arbres
  rationale: Le singulier collectif avec כָּל peut désigner l’ensemble des arbres; cette formulation évite en français l’impression qu’il s’agit de chaque arbre individuellement sans distinction de type.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: agréables à regarder
  rationale: La formule exprime l’attrait visuel. « Agréables à regarder » est moderne, clair et fidèle.
- source_word: וְטוֹב לְמַאֲכָל
  choice: et bons à manger
  rationale: Rend de manière naturelle la qualité des arbres par rapport à la nourriture, dans une coordination cohérente avec le pluriel français.
- source_word: וְעֵץ הַחַיִּים
  choice: ainsi que l’arbre de vie
  rationale: « Arbre de vie » est la traduction directe et consacrée du syntagme construit.
- source_word: בְּתוֹךְ הַגָּן
  choice: au milieu du jardin
  rationale: בְּתוֹךְ indique une position à l’intérieur, possiblement centrale; « au milieu » préserve cette nuance.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: et l’arbre de la connaissance du bien et du mal
  rationale: La formulation reste littérale et conserve l’article de הַדַּעַת, sans trancher le sens débattu de l’expression.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre au lieu de le remplacer par un titre.
- issue: Sens de « la connaissance du bien et du mal »
  choice: Conserver littéralement l’expression
  alternative: la connaissance morale / la connaissance de toutes choses / la faculté de déterminer ce qui est bien et mal
  rationale: L’expression hébraïque admet plusieurs interprétations. Le texte principal n’en impose aucune.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée pour rester naturelle, tout en conservant le mouvement de la phrase hébraïque et ses deux arbres nommés.
