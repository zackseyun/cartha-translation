revisions:
- from: Yahweh Dieu fit pousser du sol toutes sortes d’arbres agréables à regarder et bons à manger, ainsi que l’arbre de vie au milieu du jardin et l’arbre de la connaissance du bien et du mal.[a]
  to: Yahweh Dieu fit pousser du sol tous les arbres agréables à voir et bons à manger, ainsi que l’arbre de vie au milieu du jardin et l’arbre de la connaissance du bien et du mal.[a]
  rationale: La révision remplace seulement « toutes sortes d’arbres » par « tous les arbres », afin de rendre la portée de כָּל sans ajouter une notion de diversité d’espèces. Elle conserve la structure, les termes théologiques et la note qui signale l’ambiguïté interprétative.
