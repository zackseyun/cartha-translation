id: GEN.2.21
reference: Genesis 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: fr
  text: Alors Yahvé Dieu fit tomber un profond sommeil sur l’homme[a], qui s’endormit. Il prit ensuite une de ses côtes et referma la chair à sa place.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un de ses côtés ». Le mot hébreu peut désigner un côté ou une partie latérale aussi bien qu’une côte.
    reason: Alternative lexicale significative pour צֵלָע.
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: fit tomber
  rationale: Le hifil de נפל exprime la causation. « Fit tomber un profond sommeil sur » conserve l’image hébraïque dans un français naturel et soutenu.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahvé Dieu
  rationale: Le nom propre divin יהוה est translittéré sous sa forme française courante « Yahvé », tandis que אֱלֹהִים est rendu par « Dieu ».
- source_word: תַּרְדֵּמָה
  choice: un profond sommeil
  rationale: Le nom désigne un sommeil lourd, ici provoqué par Dieu. « Profond sommeil » en rend clairement la force.
- source_word: הָאָדָם
  choice: l’homme
  rationale: Dans ce contexte narratif immédiat, le terme désigne l’individu masculin dont la femme sera formée, plutôt que l’humanité en général.
- source_word: וַיִּישָׁן
  choice: qui s’endormit
  rationale: Cette formulation évite en français la répétition peu naturelle de « sommeil » et « dormit », tout en exprimant le résultat du sommeil provoqué.
- source_word: וַיִּקַּח
  choice: Il prit ensuite
  rationale: « Ensuite » marque naturellement la progression du récit portée par le wayyiqtol.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: une de ses côtes
  rationale: צֵלָע peut désigner une côte ou un côté. L’imagerie anatomique et la fermeture de la chair favorisent « côte », tandis que l’autre sens est conservé en note.
- source_word: וַיִּסְגֹּר בָּשָׂר
  choice: referma la chair
  rationale: סגר signifie fermer ou refermer. Avec « la chair » comme complément, cette traduction restitue sobrement l’acte de fermeture.
- source_word: תַּחְתֶּנָּה
  choice: à sa place
  rationale: Littéralement « sous elle », l’expression indique ici l’endroit occupé par la côte retirée. « À sa place » transmet ce sens idiomatiquement.
theological_decisions:
- issue: Sens de אָדָם dans ce contexte
  choice: l’homme
  alternative: l’être humain
  rationale: Le récit vise ici un individu masculin précis, dont la femme sera formée au verset suivant. La traduction ne généralise donc pas le référent à l’humanité.
- issue: Sens de צֵלָע
  choice: côte
  alternative: côté
  rationale: Le contexte corporel rend « côte » naturel, mais l’hébreu permet aussi « côté ». Cette ambiguïté significative est explicitement préservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme narratif reste simple; le nom divin est rendu par « Yahvé ». La note conserve l’ambiguïté anatomique réelle du texte hébreu.
