source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: fr
  text: Alors Yahweh Dieu façonna l’homme à partir de la poussière du sol[a]. Il insuffla dans ses narines un souffle de vie, et l’homme devint une créature vivante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec de la poussière provenant du sol ».'
    reason: alternative_syntax
  - marker: b
    text: 'Ou : « un être vivant »; traduction traditionnelle : « une âme vivante ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Conserve le nom divin distinctif יהוה par la forme française usuelle « Yahweh » et rend אֱלֹהִים par le titre commun « Dieu ».
- source_word: וַיִּיצֶר
  choice: façonna
  rationale: Le verbe יצר évoque l’action concrète de former ou de modeler, notamment celle d’un potier. « Façonna » préserve cette image en français naturel.
- source_word: הָאָדָם
  choice: l’homme
  rationale: Dans ce contexte narratif, le terme désigne l’être humain individuel que Dieu forme. « L’homme » respecte ce référent sans réduire ici le mot à l’humanité abstraite.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: à partir de la poussière du sol
  rationale: « Poussière » rend l’image concrète et la fragilité humaine exprimées par עָפָר. « Sol » convient à אֲדָמָה, même si le jeu de mots hébreu entre אָדָם et אֲדָמָה ne peut être reproduit naturellement en français.
- source_word: בְּאַפָּיו
  choice: dans ses narines
  rationale: Cette formulation idiomatique conserve le caractère corporel et concret du geste décrit.
- source_word: נִשְׁמַת חַיִּים
  choice: un souffle de vie
  rationale: Le pluriel hébreu חַיִּים a ici une valeur abstraite ou intensive. « Souffle de vie » transmet naturellement l’expression sans la surinterpréter.
- source_word: וַיְהִי
  choice: devint
  rationale: Avec la préposition לְ, le verbe indique l’entrée dans un nouvel état; « devint » exprime clairement cette transition.
- source_word: לְנֶפֶשׁ חַיָּה
  choice: une créature vivante
  rationale: נֶפֶשׁ désigne ici l’être animé dans son ensemble, non nécessairement une âme immatérielle séparée du corps. « Créature vivante » conserve aussi le lien lexical avec l’emploi de cette expression pour les animaux.
theological_decisions:
- issue: Portée de הָאָדָם
  choice: l’homme
  alternative: l’être humain; l’humanité
  rationale: Le récit présente ici un individu concret. La traduction n’exclut pas sa portée représentative, mais ne transforme pas le référent narratif en abstraction.
- issue: Sens anthropologique de לְנֶפֶשׁ חַיָּה
  choice: une créature vivante
  alternative: un être vivant; une âme vivante
  rationale: Le texte décrit l’homme devenu un être animé tout entier. « Âme vivante » pourrait suggérer une distinction entre corps et âme que l’expression hébraïque n’impose pas; « être vivant » demeure une traduction possible, signalée en note.
translation_notes:
  register: Français international moderne, narratif et digne. « Façonna » maintient l’image artisanale du verbe hébreu; « insuffla » rend le geste avec concision. Les deux phrases évitent une accumulation de coordinations peu naturelle en français tout en conservant la progression du récit.
