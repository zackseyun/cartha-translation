  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: fr
  text: Un fleuve sortait d’Éden pour arroser le jardin ; de là, il se divisait et formait quatre bras[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quatre têtes ». Ici, le mot hébreu désigne les quatre divisions principales du fleuve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: Un fleuve
  rationale: נָהָר désigne un cours d’eau important. « Fleuve » convient au registre biblique français et la conjonction וְ est naturellement rendue par l’enchaînement du récit, sans ajout d’un marqueur temporel.
- source_word: יֹצֵא מֵעֵדֶן
  choice: sortait d’Éden
  rationale: Le participe יֹצֵא présente une action en cours ou habituelle ; l’imparfait français restitue naturellement cette valeur descriptive. מִן indique la provenance.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: pour arroser le jardin
  rationale: L’infinitif construit exprime ici le but. « Arroser » est courant, précis et moins technique qu’« irriguer ».
- source_word: וּמִשָּׁם
  choice: de là
  rationale: Cette expression indique le point à partir duquel le cours d’eau se divise.
- source_word: יִפָּרֵד
  choice: il se divisait
  rationale: Le nifal de פרד peut exprimer la séparation ou la division du sujet. La forme pronominale française conserve cette nuance sans suggérer un agent extérieur.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: et formait quatre bras
  rationale: היה avec לְ décrit l’état résultant. Dans ce contexte fluvial, « bras » exprime naturellement les divisions principales, tandis qu’une note conserve l’image littérale de « têtes ».
