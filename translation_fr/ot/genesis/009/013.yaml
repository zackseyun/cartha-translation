  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: fr
  text: J’ai placé mon arc dans le nuage[a], et il sera un signe de l’alliance entre moi et la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon arc-en-ciel ». L’hébreu dit littéralement « mon arc » et emploie le mot ordinaire désignant un arc ; dans ce contexte, il s’agit de l’arc-en-ciel qui paraît dans le nuage.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: mon arc
  rationale: קֶשֶׁת est le terme ordinaire désignant un arc, notamment comme arme. Dans ce contexte, l’arc placé dans la nuée désigne l’arc-en-ciel. Le texte principal conserve l’image hébraïque, tandis que la note en explicite le référent contextuel.
- source_word: נָתַתִּי
  choice: J’ai placé
  rationale: נתן peut signifier « donner », « mettre » ou « placer ». « J’ai placé » exprime naturellement ici la mise de l’arc dans la nuée et rend l’accompli hébreu avec sa pertinence présente.
- source_word: בֶּעָנָן
  choice: dans la nuée
  rationale: Le nom est au singulier. « La nuée » garde ce singulier et convient au registre biblique digne sans être obscur; elle évoque la masse nuageuse où paraît l’arc-en-ciel.
- source_word: וְהָיְתָה
  choice: et il sera
  rationale: 'Dans le contexte, la forme exprime le résultat ou la fonction future de l’arc désormais placé : il servira de signe.'
- source_word: לְאוֹת
  choice: un signe
  rationale: אוֹת désigne un signe ou un gage. « Un signe » est clair, naturel et fidèle à sa fonction d’attestation de l’alliance.
- source_word: בְּרִית
  choice: l’alliance
  rationale: Bien que le nom hébreu n’ait pas d’article, il renvoie à l’alliance précise établie dans le contexte immédiat; l’article défini est donc naturel en français.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: entre moi et la terre
  rationale: אֶרֶץ peut désigner le pays, le sol ou la terre. La portée universelle du récit du déluge appelle ici « la terre ».
theological_decisions:
- issue: Référent de קַשְׁתִּי dans le contexte de l’alliance
  choice: Conserver « mon arc » dans le texte principal, avec l’arc-en-ciel comme référent contextuel
  alternative: mon arc-en-ciel
  rationale: L’hébreu emploie le mot ordinaire pour « arc », ce qui maintient une image possiblement liée à l’arme déposée ou suspendue. Traduire directement par « arc-en-ciel » clarifierait le phénomène mais effacerait cette tension imagée; la note préserve les deux données.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » est retenu plutôt que « nuage » pour rendre le singulier collectif et la masse nuageuse, tout en restant largement compréhensible. La syntaxe suit de près la structure hébraïque sans devenir artificielle.
