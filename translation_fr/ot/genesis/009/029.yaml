  text: La durée totale de la vie de Noé fut de neuf cent cinquante ans, puis il mourut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: furent donc de
  rationale: Dans cette formule récapitulative, le verbe היה indique la durée totale de la vie. « Furent donc de » rend naturellement cette valeur et marque la conclusion du récit de Noé.
- source_word: כָּל יְמֵי נֹחַ
  choice: Tous les jours de Noé
  rationale: Cette formulation conserve l’idiome hébreu et la cadence généalogique de la Genèse, tout en restant compréhensible en français moderne.
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: neuf cent cinquante ans
  rationale: Le français réunit naturellement les deux éléments coordonnés du nombre hébreu. « Cent » reste invariable puisqu’il est suivi de « cinquante ».
- source_word: וַיָּמֹת
  choice: puis il mourut
  rationale: « Puis » exprime la succession narrative portée par le wayyiqtol sans surcharger la coordination; le pronom explicite reprend naturellement Noé.
