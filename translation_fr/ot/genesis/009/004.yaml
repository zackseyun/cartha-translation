  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: fr
  text: Mais vous ne mangerez pas de chair avec sa vie — son sang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi expliciter l’apposition : « avec sa vie, c’est-à-dire son sang » ou comprendre : « Seulement, vous ne mangerez pas de chair avec sa vie — son sang. »'
    reason: ambiguïté syntaxique et nuance lexicale
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: La particule introduit ici une restriction à la permission donnée au verset précédent. « Mais » exprime naturellement ce contraste en français.
- source_word: בָּשָׂר
  choice: chair
  rationale: « Chair » conserve le terme concret de l’hébreu et maintient le lien étroit entre l’animal, sa vie et son sang.
- source_word: בְּנַפְשׁוֹ
  choice: avec sa vie
  rationale: Dans ce contexte, נֶפֶשׁ désigne la vie qui anime l’être vivant, non une « âme » immatérielle au sens doctrinal plus tardif.
- source_word: דָמוֹ
  choice: son sang
  rationale: Le sens direct est « son sang ». Le conserver distinct de « sa vie » préserve la formulation appositionnelle du texte.
- source_word: לֹא תֹאכֵלוּ
  choice: vous ne mangerez pas
  rationale: Le futur à valeur prescriptive rend dignement et naturellement l’interdiction hébraïque adressée au pluriel.
theological_decisions:
- issue: Sens de נֶפֶשׁ et rapport entre la vie et le sang
  choice: « vie », suivie de l’apposition « son sang »
  alternative: « âme » ou le terme composé « sang vital »
  rationale: Ici, נֶפֶשׁ évoque la vie de la créature. Le tiret conserve l’identification concise et quelque peu elliptique entre la vie et le sang sans importer une conception doctrinale de l’âme ni fondre les deux mots en un seul.
translation_notes:
  register: Français international moderne, sobre et digne. « Chair » maintient la concrétude du texte juridique; le tiret reproduit l’apposition concise de l’hébreu, tandis que la note signale sa forme explicitée et la nuance restrictive possible de אַךְ.
