  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: fr
  text: 'et avec tout être vivant qui est avec vous : les oiseaux, les animaux domestiques et tous les animaux sauvages de la terre qui sont avec vous, parmi tous ceux qui sont sortis de l’arche, pour tous les animaux sauvages de la terre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La fin du verset est difficile en hébreu. Plus littéralement : « parmi tous ceux qui sont sortis de l’arche, pour tous les animaux sauvages de la terre ». La dernière expression peut aussi être comprise comme une reprise qui souligne l’ensemble des animaux sauvages.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: être vivant
  rationale: L’expression désigne ici largement les êtres animés, en particulier les animaux. « Être vivant » est naturel en français et conserve la portée collective de l’hébreu.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: qui est avec vous
  rationale: La relative suit le singulier collectif « tout être vivant », comme en hébreu.
- source_word: בָּעוֹף
  choice: les oiseaux
  rationale: עוֹף peut désigner les créatures volantes en général, mais « les oiseaux » est l’équivalent courant et convient à cette énumération.
- source_word: בַּבְּהֵמָה
  choice: les animaux domestiques
  rationale: בְּהֵמָה désigne ici les animaux terrestres domestiqués; cette formulation est plus précise en français international que « bétail », qui peut paraître plus étroit.
- source_word: חַיַּת הָאָרֶץ
  choice: les animaux sauvages de la terre
  rationale: Cette expression distingue les animaux sauvages des animaux domestiques mentionnés juste avant. « Animaux sauvages » évite l’ambiguïté de « bêtes ».
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: tous ceux qui sont sortis de l’arche
  rationale: Le מִן peut ici préciser l’ensemble envisagé. La tournure française exprime naturellement que ces animaux sont ceux qui sont sortis de l’arche.
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: tous les animaux sauvages de la terre
  rationale: La finale difficile est rendue comme une reprise détachée, sans attribuer au לְ une valeur théologique ou logique trop précise.
theological_decisions:
- issue: Étendue et syntaxe des animaux associés à l’alliance
  choice: Inclure l’ensemble des animaux avec Noé — oiseaux, animaux domestiques et sauvages — et traiter la proposition finale comme une reprise syntaxique.
  alternative: 'Traduire plus formellement la finale : « pour tous les animaux sauvages de la terre ».'
  rationale: L’hébreu est condensé et répétitif. La reprise préserve son caractère sans transformer la finale en proposition de but ni effacer sa difficulté.
translation_notes:
  register: Français moderne, international et digne. Le lexique distingue clairement les animaux domestiques des animaux sauvages. Le tiret signale la reprise finale inhabituelle de l’hébreu sans la lisser entièrement.
