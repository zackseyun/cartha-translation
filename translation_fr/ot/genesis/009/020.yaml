  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: fr
  text: Noé, homme de la terre, commença à planter une vigne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Noé, homme de la terre, fut le premier à planter une vigne. » La formulation hébraïque est condensée; certains comprennent ici « commença » au sens de « fut le premier ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: commença
  rationale: 'Le hiphil de חלל a ici naturellement le sens de « commencer ». La construction est condensée, et le sens se prolonge dans le verbe suivant : « commença à planter ».'
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: אִישׁ הָאֲדָמָה
  choice: homme de la terre
  rationale: Cette formulation conserve l’expression hébraïque appositionnelle et son lien avec אֲדָמָה, la terre ou le sol cultivé, tout en restant naturelle et digne en français.
- source_word: וַיִּטַּע
  choice: planter
  rationale: Le verbe נטע désigne normalement l’action de planter. L’infinitif français dépend naturellement de « commença ».
- source_word: כָּרֶם
  choice: une vigne
  rationale: En français biblique et courant, « une vigne » peut désigner un terrain planté de ceps; ce choix est plus naturel ici que « un vignoble ».
theological_decisions:
- issue: Interprétation de la séquence elliptique וַיָּחֶל ... וַיִּטַּע
  choice: commença à planter une vigne
  alternative: fut le premier à planter une vigne
  rationale: La première lecture suit le sens narratif le plus direct sans ajouter explicitement l’idée de primauté. Une note conserve l’autre compréhension possible de la formulation hébraïque condensée.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La tournure « homme de la terre » préserve l’écho agricole de l’hébreu; « commença à planter » rend naturellement la construction verbale condensée.
