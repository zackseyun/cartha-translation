id: GEN.9.9
reference: Genesis 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: fr
  text: Quant à moi, voici que j’établis mon alliance avec vous et avec votre descendance[a] après vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « postérité ». Le mot hébreu est un nom collectif qui peut désigner les enfants ou les descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant est légèrement emphatique et marque un déplacement du discours vers l’engagement solennel de Dieu.
- source_word: הִנְנִי
  choice: voici que
  rationale: Cette tournure attire solennellement l’attention sur l’action annoncée, tout en étant plus naturelle en français actuel que « voici, moi ».
- source_word: מֵקִים
  choice: j’établis
  rationale: Le participe hiphil de קום exprime ici l’action de mettre en vigueur ou d’établir l’alliance; le présent français convient à la valeur performative de la déclaration.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français consacré et précis pour בְּרִית dans le cadre d’une relation formelle entre Dieu et des êtres humains.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: La préposition indique directement les partenaires humains concernés par l’alliance.
- source_word: וְאֶת זַרְעֲכֶם
  choice: et avec votre descendance[a]
  rationale: זֶרַע est un nom collectif désignant ici les êtres issus des destinataires. « Descendance » garde cette valeur collective; la répétition de « avec » rend clairement le parallélisme en français.
- source_word: אַחֲרֵיכֶם
  choice: après vous
  rationale: L’expression désigne sobrement les générations ultérieures sans développer davantage le texte.
theological_decisions:
- issue: Terminologie de l’alliance entre Dieu et les êtres humains
  choice: mon alliance
  alternative: mon pacte; mon traité
  rationale: « Alliance » préserve la catégorie biblique de בְּרִית sans réduire la relation à un pacte ordinaire ou à un traité politique.
translation_notes:
  register: Français international actuel, digne et solennel. « Quant à moi, voici que » conserve la double emphase de וַאֲנִי הִנְנִי sans recourir à une formulation archaïque. Le marqueur de note est placé après « descendance », le mot auquel la variante se rapporte.
