id: GEN.9.16
reference: Genesis 9:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: fr
  text: L’arc[a] sera dans le nuage, et je le verrai afin de me souvenir de l’alliance perpétuelle entre Dieu et tout être vivant, de toute chair[b] qui est sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’arc-en-ciel ». Le mot hébreu signifie littéralement « arc ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « parmi toute chair ». L’expression précise l’ensemble des êtres vivants concernés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: sera
  rationale: Le parfait qal précédé de la conjonction poursuit ici le discours divin orienté vers l’avenir ; le futur français rend naturellement cette valeur.
- source_word: הַקֶּשֶׁת
  choice: l’arc
  rationale: Le nom hébreu désigne littéralement un arc. Le contexte permet de comprendre l’arc-en-ciel, mais conserver « l’arc » préserve l’image du texte source ; l’interprétation contextuelle figure en note.
- source_word: בֶּעָנָן
  choice: dans le nuage
  rationale: Le singulier défini de l’hébreu est conservé dans un français moderne et naturel.
- source_word: וּרְאִיתִיהָ
  choice: et je le verrai
  rationale: Le pronom suffixe féminin renvoie à קֶשֶׁת, rendu par le masculin français « arc ». La coordination simple respecte la syntaxe hébraïque.
- source_word: לִזְכֹּר
  choice: afin de me souvenir
  rationale: L’infinitif construit avec ל exprime ici le but ou le résultat. « Afin de » explicite naturellement ce rapport sans effacer le langage anthropomorphique.
- source_word: בְּרִית עוֹלָם
  choice: l’alliance perpétuelle
  rationale: « Perpétuelle » exprime la durée indéfinie et durable de עוֹלָם sans imposer une précision métaphysique étrangère au contexte.
- source_word: בֵּין אֱלֹהִים וּבֵין
  choice: entre Dieu et
  rationale: Le français ne répète pas « entre » comme le fait l’idiome hébreu.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: tout être vivant
  rationale: L’expression vise tout être animé et non une « âme » humaine au sens restreint.
- source_word: בְּכָל בָּשָׂר
  choice: de toute chair
  rationale: La formule précise de manière appositionnelle l’ensemble des êtres vivants. Cette formulation conserve le terme concret « chair » et l’ambiguïté de la préposition בְּ ; une autre analyse possible est signalée en note.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: qui est sur la terre
  rationale: Le relatif délimite les êtres vivants concernés ; « sur la terre » convient à la portée universelle du contexte.
theological_decisions:
- issue: Le souvenir attribué à Dieu sous une forme anthropomorphique
  choice: conserver « je le verrai afin de me souvenir »
  alternative: paraphraser par « je le verrai et j’agirai conformément à mon alliance »
  rationale: Le texte présente explicitement Dieu comme voyant le signe afin de se souvenir. La traduction maintient cette tension théologique au lieu de l’expliquer ou de la résoudre.
translation_notes:
  register: Français international moderne, sobre et digne. « Nuage » est préféré à « nuée », plus littéraire. La structure appositionnelle « tout être vivant, de toute chair » reste légèrement marquée afin de préserver la formulation hébraïque sans la normaliser excessivement.
