source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: fr
  text: Oui, je demanderai compte de votre sang, pour vos vies[a]. J’en demanderai compte à tout animal[b], et à l’être humain — à chacun pour la vie de son frère — je demanderai compte de la vie humaine[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « votre sang, pour vos vies ». La formule associe le sang à la vie; on pourrait aussi traduire : « le sang de vos vies ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de la main de tout animal je le demanderai ». « De la main de » désigne ici l’agent tenu pour responsable.'
    reason: source_idiom
  - marker: c
    text: 'Littéralement : « de la main de l’être humain, de la main d’un homme, son frère, je demanderai la vie de l’être humain ». L’expression « un homme, son frère » souligne la responsabilité d’un être humain envers un autre.'
    reason: syntax_ambiguity
lexical_decisions:
- source_word: וְאַךְ
  choice: Oui
  rationale: אַךְ donne ici une forte valeur d’assurance ou d’insistance. « Oui » rend cette force en français actuel sans lourdeur, tandis que l’enchaînement du discours porte déjà la valeur de וְ.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: votre sang, pour vos vies
  rationale: La formulation conserve séparément « sang » et « vies », comme en hébreu, sans la redondance que produirait « sang vital pour vos vies ». La note signale la relation littérale et l’autre formulation possible.
- source_word: אֶדְרֹשׁ / אֶדְרְשֶׁנּוּ
  choice: je réclamerai compte de / j’en réclamerai compte
  rationale: Dans ce contexte judiciaire, דרשׁ exprime l’exigence d’une reddition de comptes. Cette tournure française est plus claire que le seul verbe « réclamer » et maintient la répétition structurante.
- source_word: מִיַּד
  choice: à
  rationale: Littéralement « de la main de », l’expression désigne ici la personne ou l’animal tenu pour responsable. Le français idiomatique « réclamer compte à » communique cette responsabilité; la note conserve l’image hébraïque.
- source_word: כָּל חַיָּה
  choice: tout animal
  rationale: חַיָּה désigne ici l’animal par opposition à l’être humain. « Animal » est naturel, précis et digne en français international.
- source_word: הָאָדָם
  choice: l’être humain / humaine
  rationale: Le terme oppose l’humain à l’animal et possède ici une portée représentative. « L’être humain » évite de restreindre indûment le référent au sexe masculin.
- source_word: אִישׁ אָחִיו
  choice: à chacun pour son frère
  rationale: Cette formulation garde le distributif אִישׁ et le terme de parenté אָחִיו, tout en exprimant que chacun répond de la vie de son frère humain.
- source_word: נֶפֶשׁ הָאָדָם
  choice: la vie humaine
  rationale: נֶפֶשׁ désigne ici la vie concrète, en parallèle avec le sang, et non une âme immatérielle. « La vie humaine » rend naturellement la portée représentative de הָאָדָם.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans un contexte de sang versé
  choice: vie
  alternative: âme
  rationale: Le contexte immédiat associe le sang à la vie et traite de la responsabilité liée à sa suppression. « Âme » introduirait en français moderne une distinction métaphysique qui n’est pas affirmée ici.
- issue: Portée de הָאָדָם
  choice: l’être humain / la vie humaine
  alternative: l’homme / la vie de l’homme
  rationale: Dans l’opposition avec l’animal, הָאָדָם désigne l’humain comme catégorie. La traduction choisie préserve cette portée sans trancher la question du sexe du coupable ou de la victime.
- issue: Rapport syntaxique entre מִיַּד הָאָדָם et מִיַּד אִישׁ אָחִיו
  choice: la seconde expression précise la première entre tirets
  alternative: deux propositions séparées
  rationale: La seconde expression est appositive et précise la responsabilité humaine envers le frère humain; les tirets conservent cette relation sans créer artificiellement deux déclarations.
translation_notes:
  register: Français moderne, international et solennel. La répétition de « réclamer compte » maintient le ton judiciaire du verset. Les formulations inclusives découlent ici de la portée générique de אָדָם, non d’une neutralisation doctrinale. Les tirets rendent l’apposition hébraïque sans fragmenter la phrase.
