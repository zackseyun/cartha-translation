revisions:
- from: Oui, je réclamerai compte de votre sang, pour vos vies[a]. J’en réclamerai compte à tout animal[b], et à l’être humain — à chacun pour son frère — je réclamerai compte de la vie humaine[c].
  to: Oui, je demanderai compte de votre sang, pour vos vies[a]. J’en demanderai compte à tout animal[b], et à l’être humain — à chacun pour la vie de son frère — je demanderai compte de la vie humaine[c].
  rationale: La révision remplace « réclamer compte » par la tournure française plus naturelle « demander compte » et, surtout, précise que chacun doit répondre de la vie de son frère. Elle conserve l’apposition entre les deux expressions introduites par « à », le vocabulaire non confessionnel « être humain / vie humaine », ainsi que l’ambiguïté limitée de la formulation hébraïque. Les notes ont été ajustées pour soutenir le texte sans lui imposer une lecture doctrinale.
