source:
  edition: WLC
  text: שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי נֹ֑חַ וּ/מֵ/אֵ֖לֶּה נָֽפְצָ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: fr
  text: Ces trois-là étaient les fils de Noé, et c’est à partir d’eux que toute la terre s’est peuplée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « s’est dispersée » ou « s’est répandue ».'
    reason: Alternative lexicale reflétant le sens fondamental du verbe hébreu נפץ.
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: Ces trois-là
  rationale: La tournure nominale hébraïque met le groupe en relief. « Ces trois-là » est naturel en français et conserve l’insistance du démonstratif.
- source_word: בְּנֵי נֹחַ
  choice: étaient les fils de Noé
  rationale: L’hébreu ne comporte pas de verbe exprimé. L’imparfait « étaient » convient au récit et rend clairement la relation de filiation.
- source_word: וּמֵאֵלֶּה
  choice: et c’est à partir d’eux que
  rationale: מִן avec le démonstratif indique l’origine. La construction présentative française souligne, comme l’hébreu, que toute la population ultérieure procède de ces trois fils.
- source_word: נָפְצָה
  choice: s’est peuplée
  rationale: Le verbe נפץ a pour sens fondamental la dispersion ou l’expansion. Dans ce résumé généalogique, « s’est peuplée » exprime naturellement le résultat contextuel, tandis que le sens plus littéral est conservé en note.
- source_word: כָל הָאָרֶץ
  choice: toute la terre
  rationale: Dans le contexte universel qui suit le déluge et introduit la table des peuples, אֶרֶץ désigne ici vraisemblablement la terre entière plutôt qu’un territoire particulier.
theological_decisions:
- issue: Portée de הָאָרֶץ dans le contexte postdiluvien
  choice: toute la terre
  alternative: tout le pays / toute la région
  rationale: Le verset résume l’extension de l’humanité issue des fils de Noé. Le sens universel est donc le plus probable, sans transformer ce choix contextuel en affirmation doctrinale supplémentaire.
- issue: Valeur de נָפְצָה
  choice: s’est peuplée
  alternative: s’est dispersée / s’est répandue
  rationale: La traduction principale rend le résultat généalogique en français idiomatique. La note préserve le mouvement de dispersion exprimé plus directement par le verbe hébreu et évite de masquer cette nuance.
translation_notes:
  register: Français international moderne, clair et digne. « Ces trois-là » conserve l’emphase démonstrative sans lourdeur; « c’est à partir d’eux que » assure une liaison naturelle et appuyée entre les deux propositions.
