  text: After the flood, Noah lived three hundred and fifty years.
translation:
  language: fr
  text: Après le déluge, Noé vécut trois cent cinquante ans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: vécut encore
  rationale: Le wayyiqtol de חיה indique ici la durée de la vie de Noé après le déluge. « Vécut encore » exprime naturellement en français que cette période prolonge sa vie, sans lui donner le sens plus marqué de « survécut ».
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom hébreu נֹחַ.
- source_word: אַחַר
  choice: après
  rationale: Préposition temporelle simple indiquant la période qui suit le déluge.
- source_word: הַמַּבּוּל
  choice: le déluge
  rationale: Désigne avec l’article l’événement bien connu du récit. « Le déluge » est la formulation française consacrée, claire et actuelle dans ce contexte biblique.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: trois cent cinquante ans
  rationale: Rend le nombre composé de manière idiomatique en français. « Cent » reste invariable puisqu’il est suivi de « cinquante ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe place le complément temporel en tête, comme dans l’hébreu, tout en employant « encore » pour rendre clairement la continuation de la vie de Noé après le déluge.
