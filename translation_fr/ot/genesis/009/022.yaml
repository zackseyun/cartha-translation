  text: וַ/יַּ֗רְא חָ֚ם אֲבִ֣י כְנַ֔עַן אֵ֖ת עֶרְוַ֣ת אָבִ֑י/ו וַ/יַּגֵּ֥ד לִ/שְׁנֵֽי אֶחָ֖י/ו בַּ/חֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: fr
  text: Cham, père de Canaan, vit la nudité de son père[a] et en informa ses deux frères qui étaient dehors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans certains passages de l’Ancien Testament, l’expression « la nudité de son père » peut servir d’euphémisme sexuel. Ici, la traduction conserve la formulation littérale sans trancher cette question d’interprétation.
    reason: Préserver l’ambiguïté lexicale et interprétative de l’expression hébraïque.
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה, dans cette forme narrative, signifie simplement « voir » ; rien dans le verbe seul ne justifie une formulation plus appuyée.
- source_word: חָם
  choice: Cham
  rationale: Forme française traditionnelle et courante du nom personnel hébreu.
- source_word: אֲבִי כְנַעַן
  choice: père de Canaan
  rationale: La chaîne construite identifie Cham comme le père de Canaan ; l’apposition est conservée naturellement en français.
- source_word: עֶרְוַת אָבִיו
  choice: la nudité de son père
  rationale: Cette traduction formellement proche conserve l’expression hébraïque sans lui imposer ici un sens sexuel plus précis.
- source_word: וַיַּגֵּד
  choice: le raconta
  rationale: Le hiphil de נגד signifie couramment « raconter, déclarer, rapporter ». Le pronom « le » reprend ce que Cham venait de voir et donne une narration française naturelle.
- source_word: לִשְׁנֵי אֶחָיו
  choice: à ses deux frères
  rationale: La traduction conserve explicitement le nombre « deux » et rend naturellement la relation fraternelle.
- source_word: בַּחוּץ
  choice: qui étaient dehors
  rationale: L’expression indique que l’annonce est faite aux frères à l’extérieur, vraisemblablement par contraste avec l’intérieur de la tente. La proposition relative évite une fin de phrase ambiguë ou peu naturelle en français.
theological_decisions:
- issue: Sens de « la nudité de son père » dans ce récit
  choice: Conserver littéralement « la nudité de son père », sans préciser d’acte sexuel au-delà du fait de voir Noé dénudé.
  alternative: Comprendre l’expression comme un euphémisme désignant une faute sexuelle plus grave, éventuellement un inceste maternel par rapprochement avec certains emplois législatifs ultérieurs.
  rationale: Dans certains contextes de l’Ancien Testament, cette expression peut avoir des connotations sexuelles plus larges. Toutefois, le verset dit ici que Cham « vit », puis raconta la chose à ses frères, tandis que le contexte immédiat présente Noé découvert. La formulation littérale maintient ouverte la question d’interprétation.
translation_notes:
  register: Français international moderne, sobre et narratif. La phrase conserve l’apposition « père de Canaan » et l’expression concrète « la nudité de son père », tout en rendant la localisation finale de façon idiomatique.
