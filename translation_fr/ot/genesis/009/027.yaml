source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: fr
  text: Que Dieu donne de l’espace à Japhet, et qu’il habite[a] dans les tentes de Sem ! Que Canaan soit leur esclave !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et que Dieu habite dans les tentes de Sem » ; autre possibilité : « et que Japhet habite dans les tentes de Sem ». En hébreu, le sujet du verbe « habiter » n’est pas exprimé.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: mette … au large
  rationale: Le jussif exprime l’idée de donner de l’espace, d’élargir. « Mettre au large » restitue cette image de façon naturelle et conserve autant que possible le jeu de mots hébreu avec le nom de Japhet.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le contexte verbal est singulier et désigne ici le Dieu unique.
- source_word: לְיֶפֶת
  choice: Japhet
  rationale: Le nom propre est translittéré selon son orthographe française courante. La préposition לְ est rendue idiomatiquement dans la tournure « mettre Japhet au large ».
- source_word: וְיִשְׁכֹּן
  choice: et qu’il habite
  rationale: Le jussif de שכן appelle une formulation optative. Le pronom « il » conserve l’ambiguïté du sujet masculin singulier, qui peut renvoyer à Dieu ou à Japhet.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: dans les tentes de Sem
  rationale: La traduction locative directe conserve l’image concrète des tentes ainsi que ses possibles résonances sociales et théologiques.
- source_word: וִיהִי
  choice: Que … soit
  rationale: Cette tournure rend naturellement en français la valeur volitive du jussif et prolonge la forme solennelle de la bénédiction et de la malédiction.
- source_word: כְנַעַן
  choice: Canaan
  rationale: Le nom propre est conservé sous sa forme française courante et désigne ici la personne ainsi que, par extension possible, sa lignée.
- source_word: עֶבֶד
  choice: esclave
  rationale: Dans cette déclaration de subordination, le statut d’asservissement est central ; « esclave » évite de l’atténuer en choisissant « serviteur ».
- source_word: לָמוֹ
  choice: leur
  rationale: Cette forme pronominale est comprise ici au pluriel et renvoie le plus naturellement à Sem et Japhet dans le déroulement de la déclaration.
theological_decisions:
- issue: Identité du sujet de « qu’il habite dans les tentes de Sem »
  choice: Le texte principal conserve le pronom ambigu « il », sans préciser s’il désigne Dieu ou Japhet.
  alternative: « que Dieu habite dans les tentes de Sem » ou « que Japhet habite dans les tentes de Sem »
  rationale: Le verbe hébreu est au masculin singulier, mais son sujet n’est pas exprimé. Les deux antécédents sont possibles dans le contexte ; la traduction ne tranche donc pas une ambiguïté réelle du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation optative garde le ton solennel de la déclaration de Noé. « Mettre au large » exprime l’élargissement sans paraphrase excessive, tandis que « tentes » préserve l’image du texte hébreu.
