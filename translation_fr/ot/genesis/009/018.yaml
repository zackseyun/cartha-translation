  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: fr
  text: Les fils de Noé qui sortirent de l’arche étaient Sem, Cham et Japhet. Cham était le père de Canaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: étaient
  rationale: La forme narrative de היה sert ici de copule au passé et présente l’identité des fils de Noé, sans suggérer un changement d’état.
- source_word: בְנֵי נֹחַ
  choice: Les fils de Noé
  rationale: Cette formulation naturelle conserve directement la relation familiale exprimée par l’état construit hébreu.
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: qui sortirent de l’arche
  rationale: Le participe déterminé a une valeur attributive et désigne ceux qui sont sortis de l’arche. Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: Sem, Cham et Japhet
  rationale: Ce sont les formes françaises traditionnelles et largement reconnues de ces noms propres.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: Cham était le père de Canaan
  rationale: La proposition nominale identifie explicitement Cham par sa relation à Canaan. Une phrase distincte restitue naturellement en français sa fonction d’information de fond sans l’affaiblir.
theological_decisions:
- issue: La précision généalogique concernant Cham et Canaan
  choice: Conserver dans le texte principal l’affirmation explicite « Cham était le père de Canaan ».
  alternative: Présenter cette précision comme une remarque accessoire ou la reléguer en note.
  rationale: L’hébreu prépare ainsi la suite du récit en soulignant le lien entre Cham et Canaan. La traduction maintient cette fonction narrative sans ajouter d’interprétation théologique ou ethnique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif soutenu du contexte sans archaïsme lexical. La coordination hébraïque précédant la seconde proposition est rendue par une nouvelle phrase, solution idiomatique qui conserve l’information et son relief.
