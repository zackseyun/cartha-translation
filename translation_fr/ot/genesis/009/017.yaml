base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: fr
  text: 'Dieu dit à Noé : « Tel est le signe de l’alliance que j’ai établie entre moi et toute chair[a] qui est sur la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les êtres vivants ». Littéralement « toute chair », expression hébraïque qui désigne largement, dans ce contexte, les êtres terrestres animés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait avancer le récit. En français, le passé simple rend naturellement cette progression sans qu’il soit nécessaire d’ajouter systématiquement « et ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le terme désigne le Dieu unique qui parle à Noé ; « Dieu » est la traduction française usuelle.
- source_word: אֶל נֹחַ
  choice: à Noé
  rationale: La préposition indique le destinataire, et « Noé » est la forme française traditionnelle et courante du nom.
- source_word: זֹאת
  choice: Tel est
  rationale: Le démonstratif introduit une proposition d’identification. « Tel est » est une tournure française naturelle et digne qui renvoie au signe présenté dans le contexte.
- source_word: אוֹת
  choice: signe
  rationale: אוֹת désigne ici un signe visible attestant l’alliance ; « signe » est clair et convient au contexte de l’arc-en-ciel.
- source_word: הַבְּרִית
  choice: l’alliance
  rationale: « Alliance » est le terme français biblique courant pour בְּרִית et préserve sa portée relationnelle et théologique.
- source_word: הֲקִמֹתִי
  choice: j’ai établie
  rationale: Le hiphil de קום avec בְּרִית signifie établir ou confirmer une alliance. Le passé composé exprime une action accomplie dont la validité demeure.
- source_word: בֵּינִי וּבֵין
  choice: entre moi et
  rationale: Cette expression rend directement les deux parties mises en relation par l’alliance.
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: La traduction littérale conserve l’expression biblique volontairement large, qui englobe ici la vie animale terrestre et ne se limite pas à l’humanité.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: qui est sur la terre
  rationale: La relative qualifie « toute chair ». « Sur la terre » respecte la portée universelle du contexte, contrairement à « dans le pays ».
theological_decisions:
- issue: Portée de כָּל בָּשָׂר dans l’alliance avec Noé
  choice: toute chair
  alternative: tous les êtres vivants ; toute l’humanité
  rationale: Dans Genèse 9, l’expression dépasse l’humanité et inclut les animaux. « Toute chair » en préserve l’ampleur et la formulation biblique sans réduire silencieusement le champ de l’alliance.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la narration biblique soutenue sans être archaïque. « Toute chair » conserve l’expression source et son ampleur, tandis que la note en explicite le sens contextuel.
