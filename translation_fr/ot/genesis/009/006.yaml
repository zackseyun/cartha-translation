id: GEN.9.6
reference: Genesis 9:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: fr
  text: Quiconque verse le sang d’un être humain, son sang sera versé par un être humain[a], car Dieu a fait l’être humain à son image[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’humanité ». L’hébreu répète le mot ’adam, qui peut désigner un être humain ou l’humanité en général.'
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « car à l’image de Dieu il a fait l’être humain ».'
    reason: literal_rendering
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Quiconque verse
  rationale: Le participe qal a ici une valeur générale et proverbiale. « Quiconque verse » restitue naturellement cette portée en français et conserve l’expression biblique « verser le sang ».
- source_word: דַּם הָאָדָם
  choice: le sang d’un être humain
  rationale: דָּם désigne ici le sang comme vie ôtée par violence, et אָדָם a un sens générique. « Un être humain » évite de limiter le propos aux hommes de sexe masculin.
- source_word: בָּאָדָם
  choice: par un être humain
  rationale: La préposition בְּ est comprise dans son sens instrumental ou agentif. Cette formulation conserve la répétition de אָדָם et indique l’intervention humaine sans développer davantage le cadre juridique.
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: son sang sera versé
  rationale: Le nifal imparfait est rendu au passif. Le futur français conserve la forme solennelle de l’énoncé sans trancher explicitement entre prédiction et prescription.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le fondement de l’énoncé précédent. « Car » est concis et convient au registre soutenu du passage.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: à son image
  rationale: Avec Dieu comme sujet explicite en français, « à son image » exprime naturellement la relation indiquée par l’hébreu, dont l’ordre littéral est « à l’image de Dieu ».
- source_word: עָשָׂה אֶת הָאָדָם
  choice: Dieu a fait l’être humain
  rationale: עָשָׂה signifie ici « faire » plutôt que le verbe spécifique « créer ». Le singulier collectif « l’être humain » maintient le sens générique de אָדָם.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: être humain
  alternative: homme / humanité
  rationale: « Être humain » exprime clairement que le texte concerne tout membre de l’humanité, tout en conservant le singulier répété dans l’hébreu. « Homme » risquerait en français moderne d’être compris comme exclusivement masculin.
- issue: Agent de l’effusion du sang du meurtrier
  choice: par un être humain
  alternative: par l’humanité / parmi les humains
  rationale: La lecture agentive de בָּאָדָם est syntaxiquement naturelle et correspond au parallélisme. La traduction ne précise toutefois ni l’institution ni les modalités de cette action, que le verset ne développe pas.
- issue: Valeur juridique ou prédictive de יִשָּׁפֵךְ
  choice: sera versé
  alternative: doit être versé
  rationale: Le futur passif préserve la tension entre déclaration solennelle de conséquence et norme juridique. « Doit être versé » imposerait une valeur déontique plus explicite que la forme hébraïque.
- issue: Formulation de l’image de Dieu
  choice: Dieu a fait l’être humain à son image
  alternative: c’est à l’image de Dieu qu’il a fait l’être humain
  rationale: La formulation retenue est naturelle et sans expansion doctrinale. Elle maintient le lien donné par le texte entre la dignité de la vie humaine et l’image de Dieu.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « être humain » reproduit autant que possible celle de אָדָם, tandis que le futur passif conserve la concision et la tension juridique de l’hébreu.
