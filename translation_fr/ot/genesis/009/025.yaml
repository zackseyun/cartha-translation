  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: fr
  text: 'Il dit : « Maudit soit Canaan ! Il sera, pour ses frères, l’esclave des esclaves. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque « esclave des esclaves » est intensive : elle évoque la condition d’esclave la plus basse ou une servitude extrême. Le texte nomme explicitement Canaan, et non Cham.'
    reason: lexical_alternative_and_textual_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol de אמר poursuit le récit et introduit le discours direct. En français, « Il dit » rend naturellement la succession narrative sans surcharger le texte d’un connecteur.
- source_word: אָרוּר
  choice: Maudit soit
  rationale: L’adjectif prédicatif exprime ici une malédiction solennelle. « Maudit soit » en restitue la force performative tout en restant idiomatique en français.
- source_word: כְּנָעַן
  choice: Canaan
  rationale: Le nom propre est conservé. Le texte désigne explicitement Canaan, et non Cham.
- source_word: עֶבֶד עֲבָדִים
  choice: l’esclave des esclaves
  rationale: La répétition hébraïque forme une expression intensive indiquant un état de servitude extrême. La formulation française conserve cette rhétorique plutôt que de la remplacer silencieusement par une paraphrase.
- source_word: יִהְיֶה
  choice: Il sera
  rationale: L’imparfait hébreu exprime ici l’état futur annoncé dans la malédiction. Le futur simple est naturel et solennel en français moderne.
- source_word: לְאֶחָיו
  choice: de ses frères
  rationale: Dans la construction française « l’esclave de », la préposition « de » exprime la relation de dépendance indiquée par לְ. « Ses frères » conserve le masculin pluriel et l’image familiale ou clanique du texte.
theological_decisions:
- issue: Objet de la malédiction de Noé
  choice: Canaan est explicitement nommé comme maudit.
  alternative: Comprendre ou reformuler la malédiction comme visant directement Cham.
  rationale: Le texte hébreu nomme Canaan. La traduction ne déplace donc pas la malédiction sur Cham en fonction d’une tradition interprétative.
- issue: Force du vocabulaire de servitude
  choice: Employer « esclave » et conserver « esclave des esclaves ».
  alternative: Employer « serviteur », ou paraphraser par « le plus humble des esclaves ».
  rationale: Dans ce contexte de malédiction et de soumission extrême, « esclave » préserve mieux la dureté de עֶבֶד. La répétition maintient l’intensité et l’ambiguïté formelle de l’expression hébraïque sans en imposer une seule explication.
translation_notes:
  register: Français moderne, digne et direct. La tournure « Maudit soit » garde le caractère solennel de l’oracle, tandis que « Il sera » évite l’archaïsme de « il sera l’esclave… » avec inversion. La formule hébraïque intensive est maintenue dans le texte et expliquée en note.
