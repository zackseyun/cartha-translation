source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: fr
  text: 'Il dit : « Béni soit le SEIGNEUR, le Dieu de Sem ! Que Canaan soit leur[a] serviteur[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon un emploi poétique possible du pronom hébreu : « son » (c’est-à-dire celui de Sem).'
    reason: Préserve l'ambiguïté réelle de לָמוֹ entre sa valeur plurielle habituelle et un possible emploi poétique singulier.
  - marker: b
    text: Le mot hébreu peut aussi se traduire par « esclave ».
    reason: Signale l'étendue sémantique de עֶבֶד et la dureté possible de la condition annoncée.
lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: le SEIGNEUR
  rationale: Rend le nom divin selon la convention française courante des petites capitales, ici représentées par des capitales, tout en le distinguant du titre ordinaire « Seigneur ».
- source_word: בָּרוּךְ (barukh)
  choice: Béni soit
  rationale: La formule française exprime naturellement l'acclamation adressée à Dieu, sans transformer la bénédiction en simple constat.
- source_word: עֶבֶד (ʿeved)
  choice: serviteur
  rationale: Le terme hébreu couvre les sens de serviteur et d'esclave. « Serviteur » conserve cette étendue sémantique dans le texte, avec une note signalant le sens plus contraignant possible.
- source_word: לָמוֹ (lamo)
  choice: leur
  rationale: La forme est normalement plurielle (« à eux/leur »), comme dans la couche anglaise auditée, mais un emploi poétique singulier est possible; l'ambiguïté est signalée en note.
theological_decisions:
- issue: Référent du pronom לָמוֹ
  choice: leur
  alternative: son
  rationale: Le pluriel morphologique est retenu sans préciser artificiellement l'identité exacte du groupe concerné. La possibilité d'un singulier poétique renvoyant à Sem est conservée en note.
- issue: Statut de Canaan exprimé par עֶבֶד
  choice: serviteur
  alternative: esclave
  rationale: Le contexte annonce une condition de subordination, mais le lexème hébreu n'impose pas partout la même catégorie sociale. Une note préserve la force possible de « esclave » sans surdéterminer le texte.
translation_notes:
  register: Français moderne, international et digne. La ponctuation exclamative restitue la force poétique des deux déclarations. « Il dit » reste sobre, conformément à l'hébreu, sans ajouter explicitement le nom de Noé.
