revisions:
- from: La crainte et la terreur que vous inspirerez pèseront sur tous les animaux de la terre, sur tous les oiseaux du ciel, sur tout ce qui se déplace sur le sol et sur tous les poissons de la mer. Ils sont livrés entre vos mains.[a]
  to: La crainte et la terreur que vous inspirerez seront sur tous les animaux de la terre, sur tous les oiseaux du ciel, sur tout ce qui rampe sur le sol et sur tous les poissons de la mer. Ils sont remis entre vos mains.[a]
  rationale: La révision resserre le rendu de רמשׂ par « rampe », évite la nuance supplémentaire de « pèseront sur » et remplace « livrés » par « remis », plus naturel dans ce contexte. Elle conserve l'ambiguïté grammaticale difficile de la clause hébraïque sans la résoudre par une paraphrase doctrinale, ainsi que l'image idiomatique finale de la main.
