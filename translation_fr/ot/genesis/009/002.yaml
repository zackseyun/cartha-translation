base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: fr
  text: La crainte et la terreur que vous inspirerez seront sur tous les animaux de la terre, sur tous les oiseaux du ciel, sur tout ce qui rampe sur le sol et sur tous les poissons de la mer. Ils sont remis entre vos mains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils sont donnés dans votre main », expression qui indique qu’ils sont placés sous votre pouvoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: La crainte et la terreur que vous inspirerez
  rationale: Les deux noms désignent la peur et l'effroi provoqués par les humains. Cette formulation française rend explicitement, sans changer le sens, le génitif objectif difficile à exprimer naturellement par « votre crainte et votre terreur », tout en conservant l'intensification du doublet.
- source_word: יִהְיֶה עַל
  choice: pèseront sur
  rationale: Le singulier hébreu gouverne le doublet comme une unité, tandis que le français appelle naturellement le pluriel. « Pèseront sur » exprime l'état de crainte qui reposera sur les animaux et garde la force de la préposition עַל.
- source_word: כָּל חַיַּת הָאָרֶץ
  choice: tous les animaux de la terre
  rationale: חַיָּה désigne ici collectivement les animaux terrestres. « Animaux » est actuel et plus transparent que « bêtes », sans limiter indûment l'expression aux seuls animaux sauvages.
- source_word: כָּל עוֹף הַשָּׁמָיִם
  choice: tous les oiseaux du ciel
  rationale: עוֹף est rendu contextuellement par « oiseaux » et שָׁמַיִם par l'idiome français naturel « ciel » dans cette expression.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: sur tout ce qui se déplace sur le sol
  rationale: 'Le texte massorétique est formellement difficile : le verbe paraît faire du sol son sujet grammatical (« tout ce que le sol fait se mouvoir »). La traduction retient le sens collectif contextuel des créatures qui se meuvent au sol, sans les réduire aux seuls reptiles ou animaux rampants.'
- source_word: בְכָל דְּגֵי הַיָּם
  choice: sur tous les poissons de la mer
  rationale: Rendu direct de la construction hébraïque, en maintenant l'étendue universelle de כָּל.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: Ils sont livrés entre vos mains
  rationale: Cette tournure française conserve la métaphore de la main et le passif hébreu, tout en exprimant naturellement la remise sous l'autorité ou au pouvoir des humains.
theological_decisions:
- issue: La domination humaine sur les animaux après le déluge
  choice: Conserver l'image d'animaux livrés entre les mains des humains
  alternative: Expliciter par « ils sont placés sous votre autorité » ou atténuer l'idée de pouvoir
  rationale: L'idiome affirme une réelle remise au pouvoir humain, mais la traduction préserve la métaphore biblique sans développer une doctrine plus large ni atténuer la tension éthique du passage.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en quatre groupes d'animaux est conservé. « Ciel », « sol » et « mer » maintiennent les distinctions spatiales du texte. Le marqueur [a] figure dans le texte principal et explique l'idiome final.
