  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: fr
  text: 'Dieu bénit Noé et ses fils, et leur dit : « Soyez féconds, multipliez-vous et remplissez la terre[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays » ; ici, « la terre » convient mieux au contexte qui suit le déluge et à l’écho de Genèse 1.28.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Le piel de ברך exprime ici l’octroi d’une bénédiction. « Bénit » est naturel, précis et adapté au contexte.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce récit, אֱלֹהִים désigne le Dieu unique.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et usuelle du nom hébreu.
- source_word: בָּנָיו
  choice: ses fils
  rationale: L’hébreu désigne précisément les fils de Noé, et non ses enfants en général.
- source_word: וַיֹּאמֶר לָהֶם
  choice: et leur dit
  rationale: Formulation narrative française naturelle qui conserve l’introduction directe de la parole.
- source_word: פְּרוּ
  choice: Soyez féconds
  rationale: Cette formulation rend l’impératif et préserve l’écho verbal de Genèse 1.28.
- source_word: וּרְבוּ
  choice: multipliez-vous
  rationale: Le verbe exprime l’accroissement numérique; la forme pronominale est idiomatique en français dans cette formule.
- source_word: וּמִלְאוּ
  choice: remplissez
  rationale: Le verbe signifie « remplir », sans qu’il soit nécessaire d’introduire explicitement l’idée de repeuplement.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans le contexte qui suit le déluge et en écho à Genèse 1.28, la portée mondiale convient mieux que celle d’un territoire particulier.
theological_decisions:
- issue: Rapport avec le mandat de création de Genèse 1.28
  choice: Conserver la formule « Soyez féconds, multipliez-vous et remplissez la terre »
  alternative: Employer une paraphrase comme « Ayez beaucoup d’enfants et peuplez la terre »
  rationale: La répétition hébraïque établit une continuité délibérée entre la bénédiction de la création et celle accordée à l’humanité après le déluge. La formulation retenue préserve ce lien sans commentaire ajouté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant naturelle. Le vocabulaire traditionnel de la bénédiction créationnelle est conservé pour maintenir l’intertextualité.
