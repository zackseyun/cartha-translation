    reason: Préserve dans le texte principal la répétition de l’expression hébraïque tout en en clarifiant la portée contextuelle.
  revision_rationale: La révision supprime l’ajout « établie », maintient l’ambiguïté classificatoire de בְּכָל־בָּשָׂר par « parmi toute chair », et conserve « toute chair » à ses deux occurrences. Elle remplace également une tournure française moins naturelle par « se transformer en déluge » et rend la relation finale par « pour détruire », correspondant à l’infinitif de but hébreu.
