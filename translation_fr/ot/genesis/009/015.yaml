source:
  edition: WLC
  text: וְ/זָכַרְתִּ֣י אֶת בְּרִיתִ֗/י אֲשֶׁ֤ר בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה בְּ/כָל בָּשָׂ֑ר וְ/לֹֽא יִֽהְיֶ֨ה ע֤וֹד הַ/מַּ֨יִם֙ לְ/מַבּ֔וּל לְ/שַׁחֵ֖ת כָּל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: fr
  text: Et je me souviendrai de mon alliance, qui est entre moi, vous et tout être vivant parmi toute chair ; les eaux ne se transformeront plus jamais en déluge pour détruire toute chair.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute chair ». Cette expression désigne ici l’ensemble des êtres vivants corporels, humains et animaux.'
    reason: Préserve dans le texte principal la répétition de l’expression hébraïque tout en en clarifiant la portée contextuelle.
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Alors je me souviendrai
  rationale: Le parfait qal à la première personne, relié au contexte par וְ, a ici une valeur future. « Se souvenir » conserve l’idiome d’alliance et le langage anthropomorphique de l’hébreu.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » exprime naturellement en français la relation solennelle et l’engagement promis désignés par בְּרִית.
- source_word: אֲשֶׁר בֵּינִי וּבֵינֵיכֶם וּבֵין כָּל נֶפֶשׁ חַיָּה
  choice: établie entre moi, vous et tout être vivant
  rationale: La formulation rend les parties liées par l’alliance sans alourdir la phrase française. נֶפֶשׁ חַיָּה désigne ici un être animé, humain ou animal.
- source_word: בְּכָל בָּשָׂר
  choice: parmi toutes les créatures
  rationale: Dans ce contexte, בָּשָׂר englobe les êtres corporels vivants, et non les seuls humains. « Parmi » préserve la relation classificatoire possible du préfixe בְּ.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: jamais plus ... ne deviendront
  rationale: La tournure française exprime clairement la non-récurrence définitive portée par לֹא ... עוֹד.
- source_word: הַמַּיִם לְמַבּוּל
  choice: les eaux ne deviendront un déluge
  rationale: 'Le לְ est compris comme indiquant le résultat ou la fonction : les eaux deviennent un déluge.'
- source_word: לְשַׁחֵת
  choice: qui détruise
  rationale: Le subjonctif dans la relative finale rend la visée destructrice du déluge exprimée par l’infinitif hébreu.
- source_word: כָּל בָּשָׂר
  choice: toute créature
  rationale: Cette expression conserve la portée universelle sur les êtres corporels vivants tout en évitant en français l’ambiguïté courante de « toute chair », qui pourrait être comprise comme une matière ou seulement l’humanité.
theological_decisions:
- issue: Langage anthropomorphique du souvenir divin
  choice: je me souviendrai
  alternative: je garderai présente à l’esprit / j’agirai conformément à mon alliance
  rationale: Le texte dit explicitement que Dieu se souviendra. La traduction conserve cette tension théologique sans expliquer ni réduire le sens de ce souvenir.
- issue: Portée de כָּל בָּשָׂר
  choice: toutes les créatures / toute créature
  alternative: tous les humains / toute chair
  rationale: Le contexte de l’alliance inclut explicitement les animaux. Une traduction limitée aux humains serait donc trop étroite, tandis que « créature » communique plus clairement la portée contextuelle en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la solennité de la déclaration divine, l’anthropomorphisme de « je me souviendrai » et l’étendue de l’alliance à tous les êtres vivants. Les notes signalent la répétition de בָּשָׂר et l’ambiguïté de la relation introduite par בְּ.
