source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: fr
  text: 'J’établirai mon alliance avec vous : plus jamais aucun être vivant ne sera retranché par les eaux du déluge[a], et plus jamais il n’y aura de déluge pour détruire la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toute chair ne sera plus retranchée ». Ici, « toute chair » désigne largement les êtres vivants, humains et animaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: J’établis
  rationale: Le hifil de קום, employé avec « alliance », signifie établir ou confirmer. Le présent français à valeur performative et promissive convient au discours solennel de Dieu sans trancher excessivement entre institution et confirmation.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français usuel dans la Genèse et conserve la portée littéraire et théologique de בְּרִית.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: Rend directement l’adresse au groupe, le pluriel étant naturellement inclus dans le pronom français.
- source_word: יִכָּרֵת
  choice: sera retranché
  rationale: Le nifal de כרת signifie littéralement « être retranché ». Ce choix conserve l’image hébraïque tout en exprimant, dans le contexte, la disparition violente causée par le déluge.
- source_word: כָּל־בָּשָׂר
  choice: aucun être vivant
  rationale: Sous la négation, cette formulation française naturelle exprime la totalité de « toute chair » et garde la portée large du syntagme, qui inclut humains et animaux dans ce contexte.
- source_word: עוֹד
  choice: plus jamais
  rationale: Avec la négation et dans cette promesse, עוֹד a le sens idiomatique de « plus jamais ».
- source_word: מִמֵּי הַמַּבּוּל
  choice: par les eaux du déluge
  rationale: La préposition מן indique ici la cause ou le moyen destructeur. « Les eaux du déluge » reste proche de la formulation hébraïque.
- source_word: מַבּוּל
  choice: déluge
  rationale: « Déluge » est le terme français consacré et immédiatement compréhensible pour מַבּוּל dans le récit de Noé.
- source_word: לְשַׁחֵת
  choice: pour détruire
  rationale: שׁחת désigne ici l’action destructrice du jugement; « détruire » en donne le sens direct.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans le cadre universel du récit du déluge et de l’alliance, « la terre » convient mieux que le sens local possible « le pays ».
theological_decisions:
- issue: Portée de כָּל־בָּשָׂר (« toute chair »)
  choice: aucun être vivant
  alternative: aucune chair / tous les êtres vivants
  rationale: Le contexte postérieur au déluge englobe les humains et les animaux. La traduction évite donc de réduire la promesse à l’humanité seule, tout en donnant en français le sens idiomatique de l’expression.
- issue: Nuance de קום dans la formule d’alliance
  choice: J’établis mon alliance
  alternative: Je confirme mon alliance / Je maintiendrai mon alliance
  rationale: « Établir » conserve le registre de l’alliance et laisse ouverte la nuance entre mise en vigueur et confirmation, sans imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la solennité de la promesse divine, avec une syntaxe naturelle. « Retranché » préserve l’image de l’hébreu; la note explique à la fois cette formulation et la portée de « toute chair ».
