source:
  edition: WLC
  text: וְ/הָיָ֕ה בְּ/עַֽנְנִ֥/י עָנָ֖ן עַל הָ/אָ֑רֶץ וְ/נִרְאֲתָ֥ה הַ/קֶּ֖שֶׁת בֶּ/עָנָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: fr
  text: Quand j’amènerai des nuages au-dessus de la terre, l’arc[a] sera visible dans la nuée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’arc-en-ciel ». Le mot hébreu est le terme ordinaire pour un arc; il désigne ici l’arc-en-ciel, signe de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Quand
  rationale: Avec la proposition infinitive qui suit, la tournure introduit une circonstance temporelle future. « Quand » est naturel en français et en conserve la valeur.
- source_word: בְּעַנְנִי עָנָן
  choice: j’amènerai des nuages
  rationale: Le verbe dénominatif à la première personne exprime l’action de couvrir de nuages ou d’en faire venir. Le singulier עָנָן peut avoir un sens collectif, naturellement rendu ici par le pluriel français.
- source_word: עַל הָאָרֶץ
  choice: au-dessus de la terre
  rationale: Cette formulation garde le rapport spatial de עַל et convient à la portée universelle de l’alliance après le déluge.
- source_word: וְנִרְאֲתָה
  choice: sera visible
  rationale: Le niphal de ראה indique que l’arc sera vu ou deviendra visible. « Sera visible » conserve cette nuance sans introduire un observateur absent du texte.
- source_word: הַקֶּשֶׁת
  choice: l’arc
  rationale: קֶשֶׁת est le terme ordinaire désignant un arc. Dans ce contexte, il renvoie à l’arc-en-ciel, mais « l’arc » préserve l’image lexicale hébraïque.
- source_word: בֶּעָנָן
  choice: dans la nuée
  rationale: Le nom est ici au singulier avec l’article. « La nuée » respecte ce nombre et offre un français digne et intelligible, tout en distinguant cette expression du collectif précédent.
theological_decisions:
- issue: Sens de קֶשֶׁת comme signe de l’alliance avec Noé
  choice: l’arc
  alternative: l’arc-en-ciel
  rationale: Le contexte identifie l’arc-en-ciel, mais l’hébreu emploie le mot ordinaire pour l’arme appelée « arc ». Le texte principal conserve donc cette image potentiellement significative, tandis qu’une note explicite le référent.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du mouvement de l’hébreu; « nuée » conserve le singulier final sans produire une tournure obscure.
