source:
  edition: WLC
  text: וְ/אַתֶּ֖ם פְּר֣וּ וּ/רְב֑וּ שִׁרְצ֥וּ בָ/אָ֖רֶץ וּ/רְבוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: fr
  text: Quant à vous, soyez féconds et multipliez-vous ; pullulez[a] sur la terre et multipliez-vous sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « répandez-vous en grand nombre sur la terre ». Le verbe hébreu évoque une prolifération abondante, comparable à un pullulement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Quant à vous
  rationale: La conjonction suivie du pronom indépendant marque une reprise emphatique et un contraste avec le contexte précédent ; « Quant à vous » le rend naturellement en français.
- source_word: פְּרוּ
  choice: soyez féconds
  rationale: Dans cette formule de bénédiction et de commandement, le verbe פרה exprime la fécondité ; cette tournure conserve aussi l’écho de Genèse 1.28.
- source_word: וּרְבוּ
  choice: multipliez-vous
  rationale: Le verbe רבה indique ici l’accroissement numérique. Sa répétition est maintenue afin de préserver l’insistance et le parallélisme de l’hébreu.
- source_word: שִׁרְצוּ
  choice: pullulez
  rationale: שׁרץ évoque une prolifération abondante, voire grouillante. « Pullulez » conserve cette image forte mieux qu’un terme général comme « abondez ».
- source_word: בָאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ désigne ici la terre comme espace où l’humanité doit se répandre après le déluge ; en français, « pulluler sur la terre » est plus idiomatique que « dans la terre ».
- source_word: וּרְבוּ בָהּ
  choice: et multipliez-vous sur elle
  rationale: Le suffixe féminin renvoie à « la terre ». « Sur elle » rend explicitement cette reprise tout en maintenant la répétition du commandement.
theological_decisions:
- issue: Rapport avec le mandat de création et la bénédiction postérieure au déluge
  choice: Conserver la forme d’un commandement-bénédiction renouvelé adressé à Noé et à ses fils, sans explicitation doctrinale ajoutée.
  alternative: Présenter le verset comme une simple répétition de Genèse 1.28 ou développer dans le texte une interprétation exclusivement covenantielle.
  rationale: L’hébreu reprend le langage impératif de Genèse 1.28, mais la traduction doit laisser percevoir cette résonance sans trancher au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Soyez féconds et multipliez-vous » conserve la formulation biblique reconnue ; « pullulez » restitue volontairement la vigueur inhabituelle du verbe hébreu. Le marqueur de note est placé après la phrase entière, à laquelle l’explication lexicale se rapporte.
