  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: fr
  text: 'Dieu dit : « Voici le signe de l’alliance que je donne entre moi et vous, et entre tout être vivant qui est avec vous, pour toutes les générations, à perpétuité[a] : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour des générations perpétuelles » ; autre traduction possible : « de génération en génération, pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple exprime naturellement cette succession sans qu’il soit nécessaire d’ajouter « puis ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le terme désigne le Dieu unique qui parle à Noé.
- source_word: זֹאת
  choice: Voici
  rationale: Le démonstratif présente le signe qui va être identifié. « Voici » est une formulation française naturelle et digne dans ce contexte déclaratif.
- source_word: אוֹת הַבְּרִית
  choice: le signe de l’alliance
  rationale: אוֹת désigne un signe ou un marqueur visible, et בְּרִית est rendu par le terme biblique français usuel « alliance ».
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: que j’établis
  rationale: נֹתֵן signifie formellement « que je donne ». Avec « signe de l’alliance », le français « que j’établis » exprime naturellement la mise en place de ce signe et de la relation correspondante, sans changer le référent.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: entre moi et vous, et
  rationale: Cette formulation conserve les parties successivement reliées par la répétition de בֵּין, tout en restant fluide en français.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: tout être vivant
  rationale: L’expression englobe ici les animaux avec Noé. « Être vivant » restitue la portée large sans importer la notion théologique moderne d’une âme distincte.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: qui est avec vous
  rationale: La proposition relative précise quels êtres vivants sont concernés et suit de près la syntaxe hébraïque.
- source_word: לְדֹרֹת עוֹלָם
  choice: pour toutes les générations à venir
  rationale: Cette expression française actuelle communique la continuité indéfinie de l’alliance de génération en génération, portée par עוֹלָם.
theological_decisions:
- issue: Valeur de נֹתֵן dans la formule d’alliance
  choice: que j’établis
  alternative: que je donne
  rationale: Le sens lexical de base est « donner », mais « établir un signe de l’alliance » est plus idiomatique en français. La variante littérale est signalée afin de préserver la nuance de l’hébreu sans imposer une interprétation doctrinale.
- issue: Portée de נֶפֶשׁ חַיָּה
  choice: tout être vivant
  alternative: toute créature vivante
  rationale: Le contexte inclut la vie animale. Cette traduction garde cette extension et évite que « âme vivante » soit comprise comme une affirmation anthropologique étrangère au passage.
- issue: Durée exprimée par לְדֹרֹת עוֹלָם
  choice: pour toutes les générations à venir
  alternative: pour des générations perpétuelles
  rationale: La formulation retenue exprime une continuité durable et ouverte sans résoudre plus précisément que l’hébreu la portée temporelle de עוֹלָם.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique écrit. « Voici » introduit naturellement le signe, tandis que la note conserve la formulation temporelle plus littérale.
