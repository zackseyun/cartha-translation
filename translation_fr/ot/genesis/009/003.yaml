source:
  edition: WLC
  text: כָּל רֶ֨מֶשׂ֙ אֲשֶׁ֣ר הוּא חַ֔י לָ/כֶ֥ם יִהְיֶ֖ה לְ/אָכְלָ֑ה כְּ/יֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָ/כֶ֖ם אֶת כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: fr
  text: Tout animal qui se déplace et qui vit[a] vous servira de nourriture. Comme les plantes vertes, je vous ai donné tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tout animal rampant qui vit ». Le nom hébreu רֶמֶשׂ désigne souvent des êtres qui rampent ou grouillent, mais il semble avoir ici un sens plus large dans le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: Tout animal qui se déplace
  rationale: רֶמֶשׂ désigne souvent un être qui rampe, grouille ou se déplace près du sol, mais le contexte donne ici à l’expression une portée large. Cette formulation naturelle en français préserve cette ampleur sans réduire le propos aux seuls reptiles ou petits animaux.
- source_word: אֲשֶׁר הוּא חַי
  choice: qui vit
  rationale: La relative qualifie l’animal comme vivant. « Qui vit » est idiomatique et conserve le contraste implicite avec un animal déjà mort.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: vous servira de nourriture
  rationale: Cette tournure rend naturellement la construction prédicative hébraïque et exprime la permission ou la mise à disposition divine.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: De même que je vous avais donné les plantes vertes
  rationale: יֶרֶק עֵשֶׂב désigne collectivement la végétation verte donnée auparavant comme nourriture. Le plus-que-parfait français explicite naturellement l’antériorité de ce don dans la comparaison.
- source_word: נָתַתִּי לָכֶם אֶת־כֹּל
  choice: je vous donne tout
  rationale: Le parfait hébreu présente le don comme accompli et désormais effectif. Le présent français convient à cette déclaration de mise à disposition, tandis que « tout » conserve la force globale de כֹּל.
theological_decisions:
- issue: Portée de l’autorisation alimentaire après le déluge
  choice: Le verset formule largement la mise à disposition des animaux vivants comme nourriture.
  alternative: Limiter רֶמֶשׂ aux seuls animaux rampants ou grouillants.
  rationale: Bien que רֶמֶשׂ puisse avoir un sens plus étroit ailleurs, « tout », le contexte alimentaire et la conclusion « je vous donne tout » favorisent ici une portée générale. La note conserve néanmoins l’alternative lexicale sans trancher au-delà des données du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide tout en conservant la répétition de « tout » et la portée générale de la déclaration.
