base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: fr
  text: Quand Noé se réveilla de son vin, il sut ce que son fils le plus jeune[a] lui avait fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son fils cadet ». L’adjectif hébreu peut signifier « petit », « jeune » ou « le plus jeune », selon le contexte.
    reason: 'Alternative lexicale : le degré exact exprimé par קָטָן dépend du contexte.'
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: se réveilla
  rationale: Le verbe יקץ désigne le réveil après le sommeil. « Se réveilla » en conserve le sens direct, tandis que « retrouva ses esprits » ou « redevint sobre » serait plus interprétatif.
- source_word: מִיֵּינוֹ
  choice: de son vin
  rationale: Cette expression rend littéralement l’hébreu et conserve l’image concise du récit. Dans le contexte, elle évoque le réveil après le sommeil provoqué par le vin, sans remplacer le terme « vin » par « ivresse ».
- source_word: וַיֵּדַע
  choice: il sut
  rationale: ידע signifie couramment « savoir ». Le passé simple « sut » peut ici exprimer qu’après son réveil Noé prit connaissance de ce qui s’était produit, tout en restant proche de la formulation hébraïque.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: ce que … lui avait fait
  rationale: Le plus-que-parfait marque naturellement en français que l’acte avait précédé le réveil et la prise de connaissance de Noé. La formulation ne précise pas la nature de cet acte.
- source_word: בְּנוֹ הַקָּטָן
  choice: son fils le plus jeune
  rationale: קָטָן peut signifier « petit », « jeune » ou « le plus jeune » selon le contexte. Dans une relation familiale, « le plus jeune » est naturel, tout en signalant en note l’autre valeur comparative possible.
theological_decisions:
- issue: Nature de l’acte commis envers Noé
  choice: Conserver la formulation générale « ce que … lui avait fait » sans définir l’acte.
  alternative: Identifier l’acte au fait d’avoir vu et raconté la nudité de Noé, ou à une atteinte sexuelle plus grave.
  rationale: Le verset ne précise pas lui-même la nature de l’acte. La traduction préserve donc l’ambiguïté du texte hébreu sans imposer une interprétation.
- issue: Référent et valeur de « son fils le plus jeune »
  choice: Traduire בְּנוֹ הַקָּטָן par « son fils le plus jeune » dans le texte principal.
  alternative: « son fils plus jeune » ou « son jeune fils »
  rationale: La formulation hébraïque désigne directement le fils de Noé par un qualificatif d’âge, mais le contexte plus large suscite des questions sur l’identité précise visée. La traduction n’ajoute aucune identification absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. L’expression volontairement concise « se réveilla de son vin » suit de près l’image hébraïque, tandis que la note préserve l’incertitude liée à l’âge relatif du fils.
