  text: וַ/יֵּ֥שְׁתְּ מִן הַ/יַּ֖יִן וַ/יִּשְׁכָּ֑ר וַ/יִּתְגַּ֖ל בְּ/ת֥וֹךְ אָהֳלֹֽ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: fr
  text: Il but de ce vin[a], s’enivra et se découvrit à l’intérieur de sa tente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du vin » ; l’expression hébraïque a vraisemblablement un sens partitif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « resta découvert » ou « fut découvert dans sa tente ». Le verbe hébreu peut aussi se comprendre de manière plus stative, mais la forme favorise ici le sens réflexif « se découvrit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: Il but
  rationale: Le wayyiqtol qal de שׁתה exprime l’action narrative successive. En français, le passé simple convient au registre narratif soutenu et naturel de la Genèse.
- source_word: מִן הַיַּיִן
  choice: de ce vin
  rationale: La préposition מִן a ici vraisemblablement un sens partitif. « De ce vin » est idiomatique en français et renvoie naturellement au vin mentionné au verset précédent, sans imposer une quantité précise.
- source_word: וַיִּשְׁכָּר
  choice: s’enivra
  rationale: Le qal de שׁכר indique l’entrée dans l’état d’ivresse. « S’enivra » rend cette valeur ingressive dans un registre digne et courant.
- source_word: וַיִּתְגַּל
  choice: se découvrit
  rationale: Le hitpael de גלה admet ici une lecture réflexive. « Se découvrit » la préserve tout en laissant ouverte la possibilité d’une nuance plus stative, signalée en note.
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: à l’intérieur de sa tente
  rationale: בְּתוֹךְ situe Noé dans l’espace intérieur de sa tente. Cette formulation est claire et naturelle en français moderne.
theological_decisions:
- issue: Portée morale et nature de l’exposition de Noé
  choice: Décrire simplement son ivresse et le fait qu’il se découvre, sans commentaire moral ni précision sexuelle ajoutée.
  alternative: « resta découvert » ou « fut découvert » dans sa tente
  rationale: Le verset rapporte les faits sans formuler explicitement de jugement moral. La traduction réflexive correspond bien à la forme verbale, tandis que la note conserve l’ambiguïté possible et laisse le contexte suivant éclairer la portée de la scène.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif biblique sans archaïsme marqué. Les deux notes rendent les nuances lexicales réelles de l’hébreu sans surinterpréter la scène.
