  text: 'Puis Dieu dit à Noé et à ses fils qui étaient avec lui :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le wayyiqtol fait progresser le récit. « Puis … dit » exprime naturellement en français moderne la succession narrative.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le terme désigne le Dieu unique qui s’adresse à Noé.
- source_word: אֶל־נֹחַ
  choice: à Noé
  rationale: La préposition introduit le destinataire de la parole; le nom est rendu selon sa forme française traditionnelle.
- source_word: וְאֶל־בָּנָיו
  choice: et à ses fils
  rationale: La coordination distingue les fils de Noé comme autres destinataires; בָּנִים désigne ici précisément ses fils.
- source_word: אִתּוֹ
  choice: qui étaient avec lui
  rationale: Cette formulation française explicite naturellement que les fils se trouvaient avec Noé, sans ajouter d’idée absente du texte.
- source_word: לֵאמֹר
  choice: ':'
  rationale: L’infinitif introduit le discours direct qui suit. En français, les deux-points remplissent idiomatiquement cette fonction sans l’artificiel « en disant ».
