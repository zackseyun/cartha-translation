  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: fr
  text: Sem et Japhet prirent alors le vêtement[a], le posèrent sur les épaules de tous deux, puis marchèrent à reculons et couvrirent la nudité de leur père. Leurs visages étaient tournés en arrière, et ils ne virent pas la nudité de leur père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le manteau ». Le terme hébreu désigne un vêtement de dessus, utilisé ici pour couvrir Noé.'
    reason: Alternative lexicale permettant de préciser la nature possible du vêtement sans surinterpréter le texte principal.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prirent alors
  rationale: Le wayyiqtol de לקח poursuit la séquence narrative. Le pluriel français s’accorde naturellement avec le sujet composé, et « alors » marque sobrement l’enchaînement.
- source_word: שֵׁם וָיֶפֶת
  choice: Sem et Japhet
  rationale: Formes françaises traditionnelles et largement reconnues des deux noms propres.
- source_word: הַשִּׂמְלָה
  choice: le vêtement
  rationale: שׂמלה désigne un vêtement, souvent un vêtement de dessus. « Le vêtement » reste concret sans préciser indûment sa forme; « le manteau » est signalé en note.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: le posèrent sur leurs épaules à tous deux
  rationale: Cette formulation naturelle rend l’idée littérale qu’ils placent ensemble le vêtement sur leur épaule afin de le porter.
- source_word: אֲחֹרַנִּית
  choice: à reculons / tourné en arrière
  rationale: L’adverbe décrit d’abord leur déplacement vers l’arrière, puis l’orientation de leur visage. Des formulations françaises adaptées à chaque contexte conservent cette répétition de sens.
- source_word: וַיְכַסּוּ
  choice: couvrirent
  rationale: Équivalent direct de כסה dans cette action concrète.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: la nudité de leur père
  rationale: Rend fidèlement la locution hébraïque tout en conservant sa nuance de honte et la répétition du texte.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: Leur visage était tourné en arrière
  rationale: Le français explicite par « était tourné » la proposition nominale hébraïque, sans ajouter une intention absente du texte.
- source_word: לֹא רָאוּ
  choice: ils ne virent pas
  rationale: Rendu direct du parfait négatif de ראה; il n’ajoute pas la nuance volontaire de « regarder ».
theological_decisions:
- issue: Sens de « la nudité de leur père »
  choice: Conserver l’expression littérale dans le cadre de l’exposition corporelle de Noé, que Sem et Japhet couvrent avec respect
  alternative: Comprendre l’expression comme un euphémisme sexuel analogue à certains emplois lévitiques
  rationale: 'Les gestes décrits dans ce verset sont concrets : les fils prennent un vêtement, avancent à reculons, couvrent leur père et ne voient pas sa nudité. La traduction conserve toutefois l’expression hébraïque sans développer dans le texte une interprétation plus précise.'
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique soutenu sans être archaïque. La répétition de « la nudité de leur père » et l’orientation en arrière sont maintenues pour respecter l’insistance du texte hébreu.
