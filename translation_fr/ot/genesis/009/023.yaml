  source_fidelity: 'Le sens concret du verset est fidèlement rendu : le vêtement est placé sur les épaules des deux fils, ils avancent à reculons, couvrent la nudité de leur père et évitent de la voir. Le texte révisé conserve la répétition de « nudité de leur père » et ne tranche pas en faveur d’une lecture euphémistique. La forme verbale hébraïque au singulier devant « Sem et Japhet » est une irrégularité syntaxique ; le pluriel français est une normalisation idiomatique acceptable, conforme aussi à la piste d’audit anglaise.'
  naturalness: Le passé simple et « à reculons » conviennent à un français biblique moderne et international. « Leurs visages étaient tournés en arrière » respecte le pluriel hébreu et est plus précis que le singulier collectif « leur visage ». Le remplacement de « si bien que » par « et » évite d’expliciter une relation consécutive plus forte que la simple coordination du texte source.
  terminology: « Sem », « Japhet », « vêtement », « manteau » en alternative, et « la nudité de leur père » sont appropriés. La note lexicale est exacte et ne surinterprète pas le terme hébreu.
