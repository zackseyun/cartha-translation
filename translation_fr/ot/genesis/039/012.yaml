base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: fr
  text: 'Alors elle le saisit par son vêtement[a] en disant : « Couche avec moi ! »[b] Mais il laissa son vêtement dans sa main, s’enfuit et sortit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « manteau » ou « robe ». Le terme hébreu désigne de manière générale une pièce d’habillement.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque dit littéralement « couche avec moi » et constitue ici une proposition sexuelle.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: elle le saisit
  rationale: Le verbe תפשׂ exprime ici une prise ferme et soudaine. « Saisit » est naturel, vif et digne en français.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: par son vêtement / son vêtement
  rationale: בגד est un terme général désignant un vêtement, sans permettre de préciser s’il s’agit d’un manteau ou d’une robe. La préposition בְ indique ici ce par quoi elle le saisit.
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif construit introduit les paroles directes. « En disant » conserve cette articulation tout en restant naturel.
- source_word: שִׁכְבָה עִמִּי
  choice: Couche avec moi !
  rationale: שׁכב avec עִם constitue ici une proposition sexuelle. « Couche avec moi » rend directement l’euphémisme hébreu dans un français moderne et clair.
- source_word: וַיַּעֲזֹב
  choice: il laissa
  rationale: עזב signifie couramment laisser ou abandonner. Dans ce contexte, « laissa » exprime naturellement que Joseph renonce au vêtement pour s’échapper.
- source_word: בְּיָדָהּ
  choice: entre ses mains
  rationale: L’hébreu dit littéralement « dans sa main ». Le pluriel idiomatique français « entre ses mains » exprime sans ambiguïté que le vêtement reste en sa possession.
- source_word: וַיָּנָס
  choice: prit la fuite
  rationale: נוס désigne une fuite urgente. « Prit la fuite » en conserve l’intensité et permet de maintenir séparément le verbe suivant, « sortit ».
- source_word: וַיֵּצֵא הַחוּצָה
  choice: sortit dehors
  rationale: יצא suivi de החוצה exprime explicitement le passage de l’intérieur vers l’extérieur. « Sortit dehors » conserve l’insistance directionnelle et la succession des actions du texte hébreu.
