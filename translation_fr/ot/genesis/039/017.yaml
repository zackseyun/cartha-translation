base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/017.yaml
  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: fr
  text: 'Elle lui parla alors en ces termes : « L’esclave hébreu que tu nous as amené est venu vers moi pour se moquer de moi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour s’amuser à mes dépens » ; dans ce contexte, l’expression peut avoir une connotation sexuelle ou abusive.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: Elle lui parla alors
  rationale: Le wayyiqtol fait progresser le récit ; « alors » en rend la succession, tandis que le pronom « lui » conserve la formulation hébraïque sans remplacer son mari par son nom.
- source_word: כַּדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette tournure française naturelle introduit fidèlement la teneur du discours direct sans reproduire lourdement l’expression hébraïque « selon ces paroles, disant ».
- source_word: הָעֶבֶד הָעִבְרִי
  choice: L’esclave hébreu
  rationale: « Esclave » rend le statut de dépendance de Joseph plus précisément que « serviteur » ; « hébreu » conserve la désignation ethnique employée avec mépris dans l’accusation.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: que tu nous as amené
  rationale: La formulation maintient le reproche adressé au mari et le pluriel « nous », qui renvoie vraisemblablement au foyer.
- source_word: בָּא אֵלַי
  choice: est venu vers moi
  rationale: La préposition אֶל exprime ici le mouvement vers elle. Cette traduction évite d’imposer à elle seule une lecture sexuelle que le contexte suggère sans que la construction la formule explicitement.
- source_word: לְצַחֶק בִּי
  choice: pour se moquer de moi
  rationale: Le verbe צחק avec ב peut exprimer la dérision ou le fait de traiter quelqu’un comme un objet d’amusement. Le contexte de l’accusation permet une nuance sexuelle ou abusive, conservée en note sans la rendre certaine dans le texte principal.
