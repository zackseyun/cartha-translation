source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: fr
  text: Personne n’est plus grand que moi dans cette maison[a], et mon maître ne m’a rien refusé, sauf toi, parce que tu es sa femme. Comment donc pourrais-je commettre ce grand mal[b] et pécher contre Dieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’est pas plus grand que moi dans cette maison. » La construction hébraïque se comprend plus probablement comme niant qu’il y ait quelqu’un de plus grand que Joseph dans la maison.'
    reason: ambiguïté_syntaxique
  - marker: b
    text: 'Ou : « une grande perversité » ou « un grave tort ». Le mot hébreu peut désigner le mal, la méchanceté ou le tort.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: Personne n’est plus grand que moi
  rationale: La tournure avec אֵין nie ici l’existence de quelqu’un qui serait plus grand que Joseph dans la maison. Cette formulation française est naturelle et préserve l’affirmation de son rang.
- source_word: בַּבַּיִת הַזֶּה
  choice: dans cette maison
  rationale: בַּיִת peut désigner la maison ou la maisonnée. « Maison » conserve l’image hébraïque tout en pouvant englober ici l’ensemble domestique administré par Joseph.
- source_word: וְלֹא חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: mon maître ne m’a rien refusé
  rationale: חָשַׂךְ signifie retenir ou refuser quelque chose à quelqu’un. Le sujet masculin implicite est explicité par « mon maître » pour éviter en français toute ambiguïté avec « personne » dans la proposition précédente.
- source_word: כִּי אִם אוֹתָךְ
  choice: sauf toi
  rationale: Après une négation, כִּי אִם introduit l’unique exception. « Sauf toi » est concis et idiomatique.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: parce que tu es sa femme
  rationale: La construction donne la raison pour laquelle la femme est exclue de ce qui a été confié à Joseph.
- source_word: וְאֵיךְ
  choice: Comment donc pourrais-je
  rationale: Le waw relie la question à l’argument précédent; « donc » en exprime naturellement la valeur conclusive.
- source_word: אֶעֱשֶׂה הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: commettre un si grand mal
  rationale: עָשָׂה signifie littéralement « faire », mais « commettre un mal » est l’expression française naturelle. « Un si grand mal » restitue la force de l’adjectif et du démonstratif dans cette question fortement déictique.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: et pécher contre Dieu
  rationale: חטא avec ל marque ici la personne offensée. « Pécher contre Dieu » est à la fois idiomatique et fidèle.
theological_decisions:
- issue: Référent de אֱלֹהִים dans les paroles de Joseph
  choice: Dieu
  alternative: un dieu
  rationale: Dans le cadre narratif de la Genèse, Joseph parle du Dieu qu’il reconnaît et sert. La majuscule rend ce référent personnel sans ajouter de précision confessionnelle absente du texte.
- issue: Nature de la faute envisagée
  choice: un si grand mal
  alternative: une si grande perversité
  rationale: רָעָה porte un jugement moral fort, mais peut désigner le mal, la méchanceté ou le tort. « Mal » conserve l’étendue sémantique sans réduire la faute à une catégorie doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le tutoiement correspond aux formes féminines singulières du texte hébreu. « Mon maître » explicite seulement le sujet sous-entendu du verbe afin d’éviter une fausse reprise grammaticale en français.
