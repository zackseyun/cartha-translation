  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: fr
  text: Joseph trouva grâce aux yeux de son maître et le servit. Celui-ci l’établit à la tête de sa maison[a] et remit entre ses mains tout ce qu’il possédait.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « maison » peut désigner toute la maisonnée ou l’ensemble du domaine de son maître.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « donna dans sa main » ; cette expression signifie qu’il plaça tout sous l’autorité et la responsabilité de Joseph.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינָיו
  choice: trouva faveur aux yeux de son maître
  rationale: Conserve l’image de l’expression hébraïque « trouver faveur aux yeux de » tout en précisant naturellement en français que le référent du pronom est le maître de Joseph, établi par le contexte immédiat.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: se mit à son service
  rationale: Exprime ici le service personnel de Joseph auprès de son maître dans un français narratif naturel; « le servit » créerait une suite de pronoms moins claire.
- source_word: וַיַּפְקִדֵהוּ עַל בֵּיתוֹ
  choice: l’établit à la tête de sa maison
  rationale: Le hifil de פקד désigne une nomination à une fonction de surveillance ou de responsabilité. Cette formulation restitue l’autorité confiée à Joseph sans réduire בַּיִת au seul bâtiment.
- source_word: וְכָל יֶשׁ־לוֹ
  choice: tout ce qu’il possédait
  rationale: Rend de façon globale et idiomatique l’ensemble des biens et ressources appartenant au maître.
- source_word: נָתַן בְּיָדוֹ
  choice: remit entre ses mains
  rationale: Préserve la métaphore hébraïque de la main, qui évoque ici la responsabilité, la garde et l’autorité confiées à Joseph.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite une chaîne de pronoms ambigus en nommant d’abord « son maître », puis en reprenant celui-ci par « Celui-ci ». Les images hébraïques des yeux, de la maison et des mains sont conservées autant que le permet un français naturel.
