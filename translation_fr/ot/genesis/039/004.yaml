- from: Joseph trouva faveur aux yeux de son maître et se mit à son service. Celui-ci l’établit à la tête de sa maison[a] et remit entre ses mains tout ce qu’il possédait.[b]
  to: Joseph trouva grâce aux yeux de son maître et le servit. Celui-ci l’établit à la tête de sa maison[a] et remit entre ses mains tout ce qu’il possédait.[b]
  rationale: La révision supprime l’idée non exprimée d’un début de service et adopte la locution française la plus naturelle pour l’idiome « trouver grâce aux yeux de ». Elle maintient la clarification contextuelle du référent (« son maître », « Celui-ci »), le sens de la nomination de Joseph et la métaphore des mains.
