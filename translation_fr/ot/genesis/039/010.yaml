source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: fr
  text: 'Or, comme elle parlait à Joseph jour après jour, il ne l’écoutait pas : il ne couchait ni à côté d’elle[a] ni n’était avec elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coucher avec elle ». L’hébreu peut avoir un sens sexuel; « coucher à côté d’elle » conserve la formulation spatiale tout en laissant à « être avec elle » sa portée propre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Comme elle parlait…
  rationale: Le wayyiqtol de היה sert ici de charnière narrative. En français, une traduction autonome telle que « il arriva » alourdirait la phrase; sa fonction est naturellement intégrée à la proposition temporelle.
- source_word: כְּדַבְּרָהּ
  choice: Comme elle parlait
  rationale: La préposition כְּ introduit une circonstance temporelle; avec « jour après jour », l’imparfait rend naturellement l’action répétée.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: « Joseph » est la forme française traditionnelle, immédiatement reconnaissable, du nom hébreu יוֹסֵף.
- source_word: יוֹם יוֹם
  choice: jour après jour
  rationale: La répétition du nom exprime l’insistance et la continuité; cette tournure française en restitue bien la force.
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: il refusa de l’écouter
  rationale: שמע אל signifie écouter ou prêter attention à quelqu’un. Dans ce contexte répétitif, « refusa de l’écouter » exprime clairement la résistance de Joseph sans réduire le verbe à la seule idée d’obéissance.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: coucher à côté d’elle
  rationale: שכב peut avoir une portée sexuelle, tandis que אֵצֶל signifie littéralement « à côté de ». Cette formulation conserve l’image spatiale et laisse au contexte sa connotation sexuelle.
- source_word: לִהְיוֹת עִמָּהּ
  choice: rester avec elle
  rationale: Littéralement « être avec elle ». « Rester avec elle » est naturel dans ce contexte et préserve l’idée d’éviter également sa compagnie ou une proximité compromettante.
