  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: fr
  text: Joseph avait été emmené en Égypte. Potiphar, un haut fonctionnaire[a] du pharaon, chef des gardes, un Égyptien, l’acheta aux Ismaélites qui l’avaient emmené là-bas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut désigner soit un haut fonctionnaire de la cour, soit un eunuque.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: avait été emmené
  rationale: Le hophal de ירד exprime ici un mouvement causé et subi. Le plus-que-parfait situe naturellement cette action avant l’achat par Potiphar; en français, «emmener» rend plus idiomatiquement le déplacement forcé vers l’Égypte que le littéral «faire descendre».
- source_word: מִצְרָיְמָה
  choice: en Égypte
  rationale: La terminaison directionnelle marque le mouvement vers l’Égypte; «en Égypte» est la formulation française naturelle après «emmener».
- source_word: וַיִּקְנֵהוּ
  choice: l’acheta
  rationale: Dans ce contexte de vente d’une personne réduite en esclavage, קנה désigne directement l’acte d’acheter.
- source_word: סְרִיס פַּרְעֹה
  choice: un haut fonctionnaire du pharaon
  rationale: סְרִיס peut désigner un eunuque ou un dignitaire de cour. «Haut fonctionnaire» convient au contexte administratif sans exclure silencieusement l’autre sens, signalé en note.
- source_word: שַׂר הַטַּבָּחִים
  choice: chef des gardes
  rationale: Le titre désigne vraisemblablement le responsable des gardes royaux, avec une possible fonction d’exécution. «Chef des gardes» reste clair et traditionnel sans préciser indûment une nuance débattue.
- source_word: אִישׁ מִצְרִי
  choice: un Égyptien
  rationale: Cette formulation française naturelle transmet l’identité nationale exprimée par אִישׁ מִצְרִי; traduire explicitement אִישׁ par «homme» serait redondant ici.
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: aux Ismaélites
  rationale: Dans une construction avec «acheter», le français dit naturellement «acheter quelque chose à quelqu’un»; l’image littérale «de la main de» n’ajoute pas ici de contenu pertinent.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: qui l’avaient emmené là-bas
  rationale: La relative renvoie aux Ismaélites et répète le motif de la descente vers l’Égypte. «Là-bas» conserve explicitement שָׁמָּה.
theological_decisions:
- issue: Sens de סְרִיס dans le titre de Potiphar
  choice: «haut fonctionnaire du pharaon» dans le texte principal
  alternative: «eunuque du pharaon»
  rationale: Le mot hébreu peut désigner soit un eunuque au sens physique, soit un officier de la cour. Le récit n’impose pas le premier sens; le sens administratif est donc retenu dans le texte, tandis que l’ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, courant et digne. La phrase a été divisée après «Égypte» afin d’éviter une coordination lourde et de rendre clairement Potiphar sujet de «l’acheta». L’article est omis devant «pharaon», employé ici comme titre, conformément à un usage français naturel.
