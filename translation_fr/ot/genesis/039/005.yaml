revisions:
- from: Dès qu’il l’eut établi responsable de sa maison et de tout ce qui lui appartenait[a], Yahweh bénit la maison de l’Égyptien à cause de Joseph. La bénédiction de Yahweh reposa sur tout ce qui lui appartenait[b], dans la maison comme dans les champs.
  to: À partir du moment où il l’eut établi responsable de sa maison et de tous ses biens[a], Yahweh bénit la maison de l’Égyptien à cause de Joseph, et la bénédiction de Yahweh reposa sur tout ce que possédait l’Égyptien[b], dans la maison et dans les champs.
  rationale: La révision rend la portée temporelle de מֵאָז (« à partir du moment où ») plutôt qu'une simple succession immédiate. Elle conserve l'autorité administrative de Joseph, l'attribution explicite de la bénédiction à Yahweh et les domaines domestique et agricole. Les référents des possessions sont explicités comme étant ceux de l'Égyptien, et les deux notes sont maintenues avec des formulations pertinentes.
