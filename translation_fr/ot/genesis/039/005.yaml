  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: fr
  text: À partir du moment où il l’eut établi responsable de sa maison et de tous ses biens[a], Yahweh bénit la maison de l’Égyptien à cause de Joseph, et la bénédiction de Yahweh reposa sur tout ce que possédait l’Égyptien[b], dans la maison et dans les champs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à partir de ce moment-là, lorsqu’il le chargea de sa maison et de tous ses biens ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sur tous ses biens, dans la maison et dans les champs ».
    reason: previous_rendering
lexical_decisions:
- source_word: מֵאָז
  choice: Dès que
  rationale: Marque le point de départ temporel à partir duquel la bénédiction se manifesta; cette tournure s’accorde naturellement avec le passé antérieur français.
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ לוֹ
  choice: il l’eut établi responsable de sa maison et de tout ce qui lui appartenait
  rationale: Le hiphil de פקד exprime ici l’attribution d’une responsabilité administrative. « Établi responsable » rend l’autorité déléguée sans réduire בְּבֵיתוֹ à une simple localisation.
- source_word: וַיְבָרֶךְ
  choice: bénit
  rationale: Conserve le sens explicite de ברך et l’action divine, plutôt que de ne rendre que son effet matériel par « fit prospérer ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: בֵּית הַמִּצְרִי
  choice: la maison de l’Égyptien
  rationale: Rend naturellement le syntagme construit et peut désigner la maison au sens de maisonnée ou de domaine domestique.
- source_word: בִּגְלַל יוֹסֵף
  choice: à cause de Joseph
  rationale: Expression directe de la cause indiquée par בִּגְלַל.
- source_word: בִּרְכַּת יְהוָה
  choice: La bénédiction de Yahweh
  rationale: Préserve le substantif « bénédiction » et son attribution explicite à Yahweh.
- source_word: בְּכָל אֲשֶׁר יֶשׁ לוֹ
  choice: sur tout ce qui lui appartenait
  rationale: « Sur » exprime idiomatiquement que la bénédiction reposait sur l’ensemble de ses biens, tandis que « appartenait » explicite la possession sans changer le référent.
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: dans la maison comme dans les champs
  rationale: Conserve les deux domaines concrets et leur portée globale; le pluriel français « les champs » est idiomatique pour le domaine agricole représenté par le singulier collectif hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel et ne le remplace pas par un titre.
- issue: Nature de l’action divine exprimée par ברך
  choice: bénit
  alternative: fit prospérer
  rationale: « Bénit » maintient l’affirmation théologique du texte selon laquelle la prospérité vient de la bénédiction de Yahweh, sans réduire celle-ci à son résultat économique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé antérieur après « dès que » situe nettement le commencement de la bénédiction. « Maison » garde la souplesse du terme hébreu, qui peut englober le foyer et le domaine domestique; « dans la maison comme dans les champs » rend le mérisme couvrant les sphères domestique et agricole.
