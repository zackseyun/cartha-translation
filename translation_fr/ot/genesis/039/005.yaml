  naturalness: Le français révisé reste moderne et soutenu sans être archaïque. « À partir du moment où » exprime naturellement la valeur temporelle de l'hébreu; « reposa sur » est une formulation idiomatique pour la présence de la bénédiction.
  terminology: « Yahweh », « bénit » et « bénédiction » rendent explicitement le nom divin et le vocabulaire de ברך. « Maison » conserve la souplesse de בַּיִת, tandis que « champs » est une adaptation française naturelle du domaine agricole exprimé par le singulier hébreu.
