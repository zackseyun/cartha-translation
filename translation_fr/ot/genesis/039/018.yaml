  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: fr
  text: Et quand j’ai élevé la voix et crié, il a laissé son vêtement[a] à côté de moi et s’est enfui à l’extérieur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son manteau ». Le mot hébreu בֶּגֶד est un terme général désignant un vêtement, sans préciser de quelle pièce il s’agit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: Et quand j’ai élevé
  rationale: La construction introduit ici une proposition temporelle. « Et quand » conserve l’enchaînement narratif, tandis que « élevé la voix » rend naturellement en français le causatif de רום avec קוֹלִי.
- source_word: קוֹלִי וָאֶקְרָא
  choice: la voix et crié
  rationale: קוֹל désigne ici la voix, et קרא exprime un appel ou un cri. « Élever la voix et crier » restitue les deux verbes sans préciser indûment les paroles prononcées.
- source_word: וַיַּעֲזֹב
  choice: il a laissé
  rationale: עזב indique que Joseph a laissé le vêtement derrière lui ; « a laissé » est direct et naturel dans ce contexte.
- source_word: בִּגְדוֹ
  choice: son vêtement
  rationale: בֶּגֶד est un terme général désignant un vêtement et ne permet pas d’identifier avec certitude une pièce particulière.
- source_word: אֶצְלִי
  choice: à côté de moi
  rationale: אצל marque la proximité. « À côté de moi » conserve la valeur spatiale sans introduire l’idée plus ambiguë de possession que pourrait suggérer « avec moi ».
- source_word: וַיָּנָס
  choice: s’est enfui
  rationale: נוס signifie fuir ; la forme pronominale française exprime naturellement le départ précipité.
- source_word: הַחוּצָה
  choice: dehors
  rationale: La forme directionnelle indique un mouvement vers l’extérieur. « Dehors » en rend simplement la portée.
