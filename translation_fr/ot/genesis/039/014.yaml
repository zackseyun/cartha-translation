  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: fr
  text: 'Alors elle appela les hommes de sa maison et leur dit : « Regardez ! Il nous a amené un Hébreu pour se jouer de nous.[a] Il est venu vers moi pour coucher avec moi, et j’ai crié à pleine voix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour se moquer de nous » ou « pour faire de nous ses jouets ». Le verbe hébreu peut désigner la moquerie ou un jeu outrageant; dans ce contexte, l’accusation comporte une dimension sexuelle et humiliante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: Alors elle appela les hommes de sa maison
  rationale: Le wayyiqtol fait avancer le récit. « Les hommes de sa maison » conserve le masculin pluriel de אַנְשֵׁי et le sens domestique et social de בֵיתָהּ.
- source_word: וַתֹּאמֶר לָהֶם לֵאמֹר
  choice: et leur dit
  rationale: La formule hébraïque d’introduction du discours est rendue naturellement en français sans reproduire le redondant « en disant ».
- source_word: רְאוּ
  choice: Regardez !
  rationale: L’impératif attire vivement l’attention des hommes de la maison; « Regardez ! » est actuel et naturel.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: Il nous a amené un Hébreu
  rationale: Le hifil de בוא exprime le fait d’amener. Le pronom « nous » préserve l’appel de la femme à la solidarité du groupe; « un Hébreu » rend idiomatiquement אִישׁ עִבְרִי sans perdre l’identification masculine dans ce contexte.
- source_word: לְצַחֶק בָּנוּ
  choice: pour se jouer de nous
  rationale: Cette formulation préserve l’étendue de צחק, qui peut évoquer la moquerie, le fait de faire de quelqu’un son jouet ou un outrage à connotation sexuelle, sans préciser abusivement lequel.
- source_word: בָּא אֵלַי לִשְׁכַּב עִמִּי
  choice: Il est venu vers moi pour coucher avec moi
  rationale: « Venir vers moi » suit בָּא אֵלַי sans ajouter explicitement une intrusion; « coucher avec » est l’expression française naturelle correspondant à l’idiome sexuel hébreu.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: et j’ai crié à pleine voix
  rationale: « Et » conserve la coordination hébraïque; « crier à pleine voix » exprime naturellement l’intensité de בְּקוֹל גָּדוֹל.
theological_decisions:
- issue: Portée de צחק dans l’accusation
  choice: se jouer de nous
  alternative: se moquer de nous; nous outrager
  rationale: Le contexte donne à l’accusation une dimension sexuelle et humiliante, mais le verbe reste polysémique. La traduction retenue conserve cette tension au lieu de réduire le sens à la seule moquerie ou d’expliciter un délit précis.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct demeure vif et accusateur. « À pleine voix » évite une traduction littérale pesante de l’expression hébraïque, tandis que « se jouer de nous » maintient son ambiguïté contextuelle.
