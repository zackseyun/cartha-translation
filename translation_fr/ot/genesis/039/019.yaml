    issue: Temps verbal de « lui adressait »
    rationale: דִּבְּרָה est un accompli et désigne les paroles que la femme avait déjà dites au maître. L’imparfait français donne à tort une valeur durative ou simultanée.
  - severity: medium
    issue: « C’est ainsi » pour כַּדְּבָרִים הָאֵלֶּה
    rationale: Cette formulation exprime surtout la manière (« de cette façon »), tandis que l’hébreu renvoie au contenu des accusations ou à des actes allégués de cette nature. « Voilà ce que » restitue plus clairement la référence démonstrative dans un français idiomatique.
  revised_text: 'Lorsque son maître eut entendu les paroles que sa femme lui avait adressées en disant : « Voilà ce que ton esclave m’a fait », sa colère s’enflamma.'
  revised_footnotes:
