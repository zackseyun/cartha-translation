  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: fr
  text: 'Lorsque son maître eut entendu les paroles que sa femme lui avait adressées en disant : « Voilà ce que ton esclave m’a fait », sa colère s’enflamma.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Lorsque … entendit
  rationale: La construction introduit la circonstance temporelle dans la suite du récit. En français, « Lorsque » rend naturellement cette relation sans alourdir la phrase par un calque de וַיְהִי.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Le terme désigne Potiphar comme maître de Joseph dans le cadre de l’esclavage domestique.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: les paroles que sa femme lui adressait
  rationale: Cette formulation conserve « paroles » et le fait qu’elles sont adressées au maître, tout en restant fluide en français.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: C’est ainsi
  rationale: L’expression renvoie au récit accusateur qui précède et peut évoquer soit des paroles, soit des faits de ce genre. « C’est ainsi » conserve la référence démonstrative dans un discours français naturel; une note signale la formulation plus littérale.
- source_word: עַבְדְּךָ
  choice: ton esclave
  rationale: עבד peut désigner un serviteur ou un esclave; ici, le statut de Joseph dans la maison de Potiphar rend « esclave » plus précis.
- source_word: עָשָׂה לִי
  choice: a agi envers moi
  rationale: Cette expression française rend l’idée de ce que Joseph aurait fait à la femme sans préciser davantage la nature de l’acte allégué.
- source_word: וַיִּחַר אַפּוֹ
  choice: sa colère s’enflamma
  rationale: La traduction conserve l’image hébraïque d’une colère qui brûle, dans une tournure française courante et digne.
theological_decisions:
- issue: Objet exact de la colère du maître
  choice: Ne pas préciser contre qui ni à cause de quoi sa colère s’enflamme
  alternative: Ajouter qu’il se mit en colère contre Joseph
  rationale: Le texte hébreu indique seulement que sa colère s’enflamma; il ne nomme pas explicitement sa cible. La traduction préserve cette indétermination narrative.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe évite un calque pesant de l’hébreu tout en conservant « les paroles », le statut d’« esclave » de Joseph et la métaphore de la colère qui s’enflamme.
