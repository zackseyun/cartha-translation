  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: fr
  text: Le chef de la prison ne se préoccupait de rien de ce qui était confié à Joseph[a], parce que Yahweh était avec Joseph. Et tout ce que Joseph faisait, Yahweh le faisait réussir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de rien de ce qui était dans sa main », c’est-à-dire dans la main de Joseph. Cette expression désigne tout ce qui avait été placé sous l’autorité de Joseph. On peut aussi traduire : « ne surveillait rien » ou « ne s’occupait de rien ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « Yahweh faisait prospérer tout ce qu’il faisait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: le chef de la prison
  rationale: שַׂר désigne ici le responsable ou haut fonctionnaire de la prison, et non un simple gardien.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: ne se préoccupait de rien
  rationale: Dans ce contexte, « voir » exprime le fait de surveiller, d’inspecter ou de s’occuper des affaires confiées à Joseph. Cette formulation française en restitue naturellement la portée fonctionnelle.
- source_word: בְּיָדוֹ
  choice: de ce qui était confié à Joseph
  rationale: L’expression hébraïque « dans sa main » désigne ce qui relevait de l’autorité et de la responsabilité de Joseph. Le nom est explicité afin d’éviter une ambiguïté pronominale en français.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: parce que Yahweh était avec lui
  rationale: בַּאֲשֶׁר a ici une valeur causale et explique la confiance accordée à Joseph.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est translittéré plutôt que remplacé par un titre.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: tout ce que Joseph faisait
  rationale: La construction relative englobe toutes les activités de Joseph. Son nom est répété pour assurer la clarté du référent en français.
- source_word: מַצְלִיחַ
  choice: le faisait réussir
  rationale: 'Le hiphil de צלח est causatif : Yahweh donnait une issue favorable à ce que Joseph accomplissait.'
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Rapport entre la présence divine et la réussite de Joseph
  choice: 'Conserver les deux affirmations du texte : Yahweh était avec Joseph et faisait réussir ce qu’il accomplissait.'
  alternative: Réduire la réussite à la seule compétence de Joseph ou expliciter un mécanisme providentiel absent du verset.
  rationale: La formulation maintient l’attribution théologique explicite du texte sans préciser davantage la manière dont cette réussite s’opérait.
translation_notes:
  register: Français international actuel, digne et accessible. « Se préoccupait de » rend l’idiome contextuel sans donner à entendre que le chef était physiquement incapable de voir. La répétition de « Joseph » clarifie les référents, tandis que « le faisait réussir » conserve la valeur causative du verbe hébreu.
