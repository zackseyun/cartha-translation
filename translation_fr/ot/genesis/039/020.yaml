  text: וַ/יִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗/וֹ וַֽ/יִּתְּנֵ֨/הוּ֙ אֶל בֵּ֣ית הַ/סֹּ֔הַר מְק֕וֹם אֲשֶׁר אסורי הַ/מֶּ֖לֶךְ אֲסוּרִ֑ים וַֽ/יְהִי שָׁ֖ם בְּ/בֵ֥ית הַ/סֹּֽהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: fr
  text: Alors le maître de Joseph le prit et le mit dans la prison[a], le lieu où les prisonniers du roi étaient détenus[b]. Il était là, dans la prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la maison du sohar » ; sohar est probablement un terme égyptien désignant une prison ou un lieu de détention.'
    reason: cultural_note
  - marker: b
    text: 'L’hébreu répète la racine signifiant « lier, emprisonner » : littéralement, « où les prisonniers du roi étaient emprisonnés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: le maître de Joseph
  rationale: Dans ce contexte, אֲדֹנֵי désigne le maître humain de Joseph, et non un titre divin. « Maître » convient au cadre de servitude domestique.
- source_word: וַיִּקַּח
  choice: le prit
  rationale: לקח signifie couramment « prendre ». Le verbe ne requiert pas ici une formulation plus forte comme « saisir ».
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: le mit en
  rationale: נתן avec אֶל exprime ici le placement de quelqu’un dans un lieu. « Mettre en prison » est naturel en français.
- source_word: בֵּית הַסֹּהַר
  choice: la prison
  rationale: L’expression désigne clairement un lieu de détention. « Prison » en donne le sens avec naturel, tandis qu’une traduction littérale serait obscure.
- source_word: מְקוֹם אֲשֶׁר
  choice: à l’endroit où
  rationale: Cette formulation conserve l’apposition explicative du texte hébreu tout en restant idiomatique.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: les prisonniers du roi étaient détenus
  rationale: La traduction exprime le sens de la double occurrence de la racine אסר sans reproduire en français une répétition maladroite.
- source_word: וַיְהִי שָׁם
  choice: Joseph resta là
  rationale: Dans ce contexte de détention, « resta là » rend naturellement la présence résultante de Joseph. La reprise du nom lève l’ambiguïté possible du pronom après la mention du roi et de ses prisonniers.
- source_word: בְּבֵית הַסֹּהַר
  choice: en prison
  rationale: La répétition finale du lieu est conservée conformément à l’insistance du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le nom « Joseph » suit sa forme française usuelle. La répétition finale de « prison » est maintenue pour refléter celle de l’hébreu.
