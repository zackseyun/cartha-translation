  text: וַ/יְהִ֣י כְ/שָׁמְע֔/וֹ כִּֽי הֲרִימֹ֥תִי קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ אֶצְלִ֔/י וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/015.yaml
  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: fr
  text: Quand il a entendu que j’avais élevé la voix et crié[a], il a laissé son vêtement à côté de moi[b], puis il s’est enfui et est sorti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’avais élevé la voix et appelé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: Quand il a entendu
  rationale: La formule narrative suivie de כְּ et de l’infinitif introduit ici naturellement une proposition temporelle; il n’est pas nécessaire de rendre וַיְהִי séparément en français.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit le contenu de ce qu’il a entendu, plutôt qu’une cause.
- source_word: הֲרִימֹתִי קוֹלִי
  choice: j’avais élevé la voix
  rationale: L’expression hébraïque est conservée dans une tournure française courante; le plus-que-parfait marque l’antériorité par rapport au moment où l’homme entend.
- source_word: וָאֶקְרָא
  choice: et crié
  rationale: Dans ce contexte, קרא désigne un cri d’alarme; « crié » en rend la force sans ajouter explicitement un appel au secours absent du texte.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: il a laissé son vêtement
  rationale: Le singulier « vêtement » correspond au singulier hébreu et maintient le détail narratif.
- source_word: אֶצְלִי
  choice: à côté de moi
  rationale: Cette formulation exprime clairement la proximité physique, tout en signalant en note l’autre rendu possible, « avec moi ».
- source_word: וַיָּנָס
  choice: il s’est enfui
  rationale: « S’enfuir » rend directement le mouvement de fuite exprimé par נוס.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: et est sorti dehors
  rationale: La formulation conserve à la fois le verbe de sortie et l’indication directionnelle הַחוּצָה, distincts de la fuite précédente.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. Les deux verbes successifs décrivant la fuite et la sortie sont maintenus, de même que l’ambiguïté de אֶצְלִי au moyen d’une note.
