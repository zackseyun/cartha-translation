source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב כָּל אֲשֶׁר ל/וֹ֮ בְּ/יַד יוֹסֵף֒ וְ/לֹא יָדַ֤ע אִתּ/וֹ֙ מְא֔וּמָה כִּ֥י אִם הַ/לֶּ֖חֶם אֲשֶׁר ה֣וּא אוֹכֵ֑ל וַ/יְהִ֣י יוֹסֵ֔ף יְפֵה תֹ֖אַר וִ/יפֵ֥ה מַרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: fr
  text: Il laissa tout ce qui lui appartenait entre les mains de Joseph et ne se souciait plus de rien[a], sauf de la nourriture qu’il mangeait[b]. Joseph était beau de stature et beau d’apparence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne savait rien avec lui ». Le sens probable est que Potiphar ne suivait plus rien de ce que Joseph gérait.'
    reason: ambiguity
  - marker: b
    text: 'Littéralement : « du pain qu’il mangeait » ; ici, « pain » désigne probablement la nourriture en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: Il laissa
  rationale: Le verbe signifie d’abord « laisser ». Dans ce contexte administratif, il implique que Potiphar confie ses biens à la gestion de Joseph, sans qu’il soit nécessaire d’expliciter davantage.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tout ce qui lui appartenait
  rationale: Cette formulation française naturelle conserve la portée globale de l’expression hébraïque, qui englobe les biens et les affaires de Potiphar.
- source_word: בְּיַד יוֹסֵף
  choice: entre les mains de Joseph
  rationale: L’expression conserve l’image hébraïque de la « main », qui évoque ici la responsabilité et l’autorité confiées à Joseph.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: auprès de lui, il ne s’occupait plus de rien
  rationale: Littéralement, Potiphar « ne savait rien avec lui ». Dans le contexte, l’expression indique qu’en présence de Joseph comme intendant, il ne suivait plus lui-même ses affaires. La note préserve la formulation plus littérale et son ambiguïté.
- source_word: כִּי אִם
  choice: sauf
  rationale: La locution introduit directement l’unique exception.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אוֹכֵל
  choice: la nourriture qu’il mangeait
  rationale: לֶחֶם désigne littéralement le pain, mais peut aussi représenter la nourriture ou le repas en général. « Nourriture » rend naturellement cette valeur contextuelle, tandis que la note signale le sens littéral.
- source_word: יְפֵה תֹאַר
  choice: beau de stature
  rationale: L’expression décrit la forme ou la constitution physique de Joseph. « Stature » maintient la distinction avec son apparence visible dans le membre parallèle.
- source_word: וִיפֵה מַרְאֶה
  choice: beau d’apparence
  rationale: Cette expression porte sur l’aspect visible. La répétition de « beau » conserve le parallélisme appuyé de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image des « mains », le parallélisme final et, en note, l’ambiguïté de לֹא יָדַע אִתּוֹ מְאוּמָה. Le plus-que-présent implicite de la situation administrative est rendu par « ne s’occupait plus », naturellement compris dans la continuité du récit.
