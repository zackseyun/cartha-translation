  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַ/יְהִ֕י בְּ/בֵ֥ית אֲדֹנָ֖י/ו הַ/מִּצְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: fr
  text: Yahvé était avec Joseph. Celui-ci était un homme qui réussissait[a] et il était dans la maison de son maître égyptien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui prospérait ». Le participe hébreu peut désigner quelqu’un qui prospère ou qui réussit.'
    reason: Alternative lexicale permettant de conserver l’étendue sémantique de מַצְלִיחַ.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française usuelle du nom divin, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: אֶת יוֹסֵף
  choice: avec Joseph
  rationale: La construction exprime la présence favorable de Dieu auprès de Joseph; la traduction directe est naturelle en français.
- source_word: אִישׁ מַצְלִיחַ
  choice: un homme qui réussissait
  rationale: Cette formulation conserve אִישׁ et rend le participe מַצְלִיחַ comme une situation durable, sans limiter le sens à la richesse matérielle.
- source_word: בְּבֵית אֲדֹנָיו
  choice: dans la maison de son maître
  rationale: Rend concrètement בְּבֵית et traduit אֲדֹנָיו selon la relation d’autorité propre au contexte.
- source_word: הַמִּצְרִי
  choice: égyptien
  rationale: L’adjectif qualifie naturellement « maître » en français.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: était ... était ... vivait
  rationale: La formulation maintient la progression des trois propositions tout en évitant une répétition excessivement raide; « vivait » exprime naturellement la présence habituelle de Joseph dans la maison.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; sa transcription conserve le nom personnel présent dans la source.
- issue: Nature de la réussite de Joseph
  choice: qui réussissait
  alternative: qui prospérait
  rationale: « Réussissait » garde un sens large et ne réduit pas nécessairement la faveur divine à la prospérité financière.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche de l’hébreu, avec une légère variation verbale pour être naturelle à la lecture.
