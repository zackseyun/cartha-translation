base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: fr
  text: 'Après ces événements, la femme de son maître posa les yeux sur Joseph[a] et lui dit : « Couche avec moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leva les yeux vers Joseph » ; dans ce contexte, cette expression traduit une attention insistante et pleine de désir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: La formule hébraïque introduit un développement ultérieur du récit. Cette traduction est naturelle en français moderne tout en conservant la relation temporelle.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: posa les yeux sur
  rationale: Littéralement, l’hébreu dit « leva les yeux vers ». Dans ce contexte, l’expression marque une attention dirigée et pleine de désir ; « posa les yeux sur » en restitue la force sans expliciter davantage que le texte.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: la femme de son maître
  rationale: Cette formulation française naturelle conserve clairement le rapport entre la femme, le maître et Joseph.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: « Joseph » est la forme française standard du nom hébreu יוֹסֵף, immédiatement reconnaissable dans une Bible destinée au grand public francophone.
- source_word: שִׁכְבָה עִמִּי
  choice: Couche avec moi
  rationale: L’impératif constitue ici une proposition sexuelle directe. « Couche avec moi » est clair, actuel et fidèle à la force de l’hébreu.
theological_decisions: []
