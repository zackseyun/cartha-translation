  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: fr
  text: Mais Yahweh était avec Joseph ; il lui témoigna un amour fidèle[a] et lui fit obtenir la faveur du chef de la prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une bonté constante » ; le mot hébreu peut exprimer l’amour loyal, la bonté et la fidélité durable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu.
- source_word: וַיְהִי ... אֶת
  choice: était avec
  rationale: Cette tournure exprime naturellement la présence et l'accompagnement de Yahweh auprès de Joseph.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: Il lui témoigna un amour fidèle
  rationale: La formulation française rend idiomatiquement l'action de manifester le חֶסֶד, tout en conservant les notions d'amour, de loyauté et de constance sans imposer une alliance formelle non mentionnée dans le verset.
- source_word: חִנּוֹ
  choice: lui accorda la faveur
  rationale: חֵן désigne ici l'accueil favorable dont Joseph bénéficie auprès du responsable de la prison.
- source_word: בְּעֵינֵי
  choice: du
  rationale: Plutôt que de reproduire littéralement « aux yeux de », le français exprime naturellement la même relation par « la faveur de ».
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: chef de la prison
  rationale: Cette expression reste proche de la chaîne construite hébraïque et désigne clairement le responsable de l'établissement pénitentiaire.
- source_word: וַ
  choice: Mais
  rationale: Dans le contexte, la conjonction marque naturellement le contraste entre l'emprisonnement de Joseph et la présence bienveillante de Yahweh.
theological_decisions:
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: fidélité à l'alliance; bonté; amour constant
  rationale: « Amour fidèle » conserve la richesse relationnelle et durable du terme sans rendre explicite une référence à l'alliance que le contexte immédiat ne formule pas.
- issue: Rendu du tétragramme
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le nom personnel est translittéré afin de distinguer יְהוָה d'un simple titre divin.
translation_notes:
  register: Français international moderne, naturel et digne. La première proposition est détachée pour éviter une coordination lourde. « Chef de la prison » conserve la texture du texte source, tandis que « lui accorda la faveur de » rend idiomatiquement חֵן בְּעֵינֵי.
