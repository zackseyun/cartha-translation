  register: Français international moderne, digne et accessible. Le discours direct reste ferme sans archaïsme. « Écoutez » rend la fonction discursive de הֵן; la note sur לֹא יָדַע אִתִּי préserve l’étrangeté et l’ambiguïté réelles de l’hébreu tout en donnant le sens idiomatique probable.
