  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: fr
  text: 'Mais il refusa et dit à la femme de son maître : « Voici, mon maître ne se préoccupe pas de ce qui est dans la maison[a], et il a remis entre mes mains tout ce qui lui appartient[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ne sait pas avec moi ce qui est dans la maison ». Cette expression signifie probablement que le maître laisse à Joseph la gestion de la maison et ne se préoccupe pas de ce qui s’y trouve.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il m’a confié tout ce qui lui appartient ». L’hébreu dit littéralement : « il a mis dans ma main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Mais il refusa
  rationale: Le verbe exprime un refus net; « Mais » rend la valeur adversative du contexte, en réponse à la proposition du verset précédent.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: et dit à la femme de son maître
  rationale: Formulation française naturelle qui conserve explicitement la relation sociale entre Joseph et son maître.
- source_word: הֵן
  choice: Écoutez
  rationale: La particule attire avec insistance l’attention sur l’explication qui suit. Dans cette adresse directe, « Écoutez » est moderne et idiomatique.
- source_word: אֲדֹנִי
  choice: mon maître
  rationale: Dans le cadre domestique et servile du récit, « maître » exprime clairement la relation de Joseph à Potiphar sans connotation théologique indue.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: ne s’occupe de rien dans la maison avec moi
  rationale: Le tour hébreu, littéralement proche de « ne connaît pas avec moi ce qui est dans la maison », indique que le maître laisse à Joseph la gestion des affaires domestiques. Le français garde « avec moi » afin de préserver une part de la structure et de l’ambiguïté du texte source, avec une note explicative.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: tout ce qui lui appartient
  rationale: Cette formulation naturelle exprime l’ensemble des possessions du maître.
- source_word: נָתַן בְּיָדִי
  choice: il a remis entre mes mains
  rationale: Cette expression française conserve l’image concrète de la main tout en communiquant l’idée de responsabilité confiée.
