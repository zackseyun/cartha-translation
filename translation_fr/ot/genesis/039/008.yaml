  source_fidelity: 'Le sens central est bien rendu : Joseph refuse, son maître lui laisse l’administration de la maison, et lui a confié tous ses biens. Toutefois, « avec moi » dans le texte français modifie fautivement « s’occupe » et suggère que le maître s’occupe de la maison conjointement avec Joseph, alors que l’expression hébraïque signifie idiomatiquement qu’il laisse ces affaires sous la responsabilité de Joseph.'
  naturalness: « Ne s’occupe de rien dans la maison avec moi » n’est pas idiomatique et reste ambigu dans un sens contraire au contexte. « Voici » rend naturellement la particule הֵן dans un registre narratif soutenu mais moderne; il évite aussi le pluriel de politesse ou d’adresse collective de « Écoutez » face à une seule interlocutrice.
  terminology: « La femme de son maître », « mon maître », « tout ce qui lui appartient » et « a remis entre mes mains » conviennent au contexte social et conservent l’image d’autorité confiée. La note explicite utilement l’idiome hébreu sans le surinterpréter.
