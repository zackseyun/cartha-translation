  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: fr
  text: Le responsable de la prison confia à Joseph tous les prisonniers qui se trouvaient dans la prison[a]. Tout ce qui s’y faisait, c’était lui qui le faisait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mit dans la main de Joseph », expression qui signifie qu’il les plaça sous son autorité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Tout ce qui s’y faisait, c’est lui qui s’en chargeait. » L’hébreu souligne le rôle effectif de Joseph, sans préciser s’il accomplissait personnellement chaque tâche ou en assumait la responsabilité.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: le responsable de la prison
  rationale: שַׂר désigne ici l’homme chargé de la prison. « Responsable » est naturel en français moderne sans préciser indûment un titre administratif.
- source_word: בְּיַד יוֹסֵף
  choice: confia à Joseph
  rationale: L’expression littérale « mit dans la main de Joseph » est un idiome indiquant que les prisonniers furent placés sous son autorité. « Confia à » en restitue clairement le sens.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: La forme française traditionnelle et immédiatement reconnaissable convient au registre biblique français moderne.
- source_word: כָּל הָאֲסִירִם
  choice: tous les prisonniers
  rationale: אֲסִירִים désigne les personnes détenues; « prisonniers » est précis et naturel dans ce contexte.
- source_word: אֲשֶׁר בְּבֵית הַסֹּהַר
  choice: qui se trouvaient dans la prison
  rationale: Cette formulation rend explicitement la localisation exprimée par la proposition relative, dans un français fluide.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: Tout ce qui s’y faisait
  rationale: Le participe actif pluriel sans sujet exprimé désigne l’ensemble des activités menées sur place. La tournure pronominale française conserve cette indétermination.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: c’était lui qui le dirigeait
  rationale: הוּא est emphatique et היה suivi du participe évoque une responsabilité habituelle ou continue. Dans ce contexte, « dirigeait » exprime l’exercice effectif de la supervision sans suggérer que Joseph accomplissait personnellement chaque tâche.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La traduction privilégie une expression idiomatique dans le corps du texte, tout en conservant en note l’image hébraïque de la main et l’ambiguïté entre exécution personnelle et responsabilité opérationnelle.
