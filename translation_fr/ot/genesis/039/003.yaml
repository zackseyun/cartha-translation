  text: וַ/יַּ֣רְא אֲדֹנָ֔י/ו כִּ֥י יְהוָ֖ה אִתּ֑/וֹ וְ/כֹל֙ אֲשֶׁר ה֣וּא עֹשֶׂ֔ה יְהוָ֖ה מַצְלִ֥יחַ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: fr
  text: Son maître vit que Yahweh était avec lui et que Yahweh faisait réussir tout ce qu’il faisait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans sa main » ; l’expression peut aussi signifier « par son intermédiaire » ou « sous sa direction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה, dans cette forme narrative, signifie simplement « voir » ; en contexte, il implique que le maître constate les effets de la présence divine sans qu’il soit nécessaire d’expliciter davantage.
- source_word: אֲדֹנָיו
  choice: son maître
  rationale: Dans le contexte où Joseph est serviteur dans la maison de Potiphar, « son maître » exprime naturellement le rapport social visé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אִתּוֹ
  choice: était avec lui
  rationale: Cette expression rend directement la présence et l’accompagnement divins auprès de Joseph.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: tout ce qu’il faisait
  rationale: L’imparfait convient au cadre narratif et restitue la portée générale de l’activité habituelle de Joseph.
- source_word: מַצְלִיחַ
  choice: faisait réussir
  rationale: La forme causative de צלח attribue explicitement à Yahweh le succès des activités de Joseph.
- source_word: בְּיָדוֹ
  choice: entre ses mains
  rationale: Cette expression conserve l’image concrète de l’hébreu tout en restant intelligible en français ; une note signale les nuances possibles d’instrumentalité ou de responsabilité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ou le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même. La translittération « Yahweh » le distingue d’un titre et suit la décision terminologique fournie.
- issue: Rapport entre l’action de Yahweh et le succès de Joseph
  choice: Yahweh faisait réussir
  alternative: tout réussissait
  rationale: Le causatif hébreu présente Yahweh comme l’agent du succès ; la traduction maintient cette attribution explicite sans préciser le mécanisme de l’action divine.
- issue: Nuance de בְּיָדוֹ
  choice: entre ses mains
  alternative: par son intermédiaire ou sous sa direction
  rationale: Le texte hébreu permet de comprendre la formule comme sphère d’action, moyen ou responsabilité. Le texte principal garde l’image et la note préserve les lectures possibles.
translation_notes:
  register: Français international moderne, sobre et narratif. La syntaxe demeure légèrement marquée afin de conserver à la fois l’agence causative de Yahweh et l’image hébraïque de la main, dont l’ambiguïté est explicitée en note.
