base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: fr
  text: Or, un jour[a], il entra dans la maison pour faire son travail, et aucun des hommes de la maison ne se trouvait là, dans la maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme ce jour-ci ». L’expression hébraïque peut désigner une occasion de ce genre ou simplement introduire ce qui arriva « un jour ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Or
  rationale: La formule narrative hébraïque introduit l’événement suivant. « Or » assure une transition naturelle et digne en français moderne sans reprendre la tournure archaïque « il arriva que ».
- source_word: כְּהַיּוֹם הַזֶּה
  choice: un jour
  rationale: Dans ce contexte, l’expression désigne vraisemblablement une occasion particulière. « Un jour » rend naturellement sa fonction narrative, tandis qu’une note conserve la formulation plus littérale et son ambiguïté.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: il entra dans la maison
  rationale: Le verbe בוא accompagné du hé directionnel exprime un mouvement vers l’intérieur. « Entra dans la maison » est précis et idiomatique en français.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: pour faire son travail
  rationale: מְלָאכָה désigne ici le travail ou l’activité dont il avait la charge dans la maison. La formulation française est directe et ne précise pas indûment la nature de ce travail.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: et aucun des hommes de la maison ne se trouvait
  rationale: La construction existentielle négative affirme qu’aucun des hommes appartenant à la maison n’était présent. « Hommes » conserve la référence masculine explicite de אִישׁ et אַנְשֵׁי.
- source_word: שָׁם בַּבָּיִת
  choice: là, à l’intérieur
  rationale: « Là » représente שָׁם, et « à l’intérieur » rend בַּבָּיִת sans répéter lourdement « dans la maison » en français. La localisation et l’insistance de l’hébreu sont ainsi maintenues de façon naturelle.
