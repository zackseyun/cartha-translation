  yaml_path: translation/ot/genesis/039/016.yaml
  text: So she kept his garment beside her until his master came home.
translation:
  language: fr
  text: Elle conserva le vêtement de Joseph auprès d’elle jusqu’à ce que son maître rentre chez lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: Elle garda donc
  rationale: Le verbe נוח au hifil signifie ici laisser ou déposer; dans ce contexte, «garda» exprime naturellement qu’elle conserva le vêtement auprès d’elle. «Donc» rend la continuité narrative du waw.
- source_word: בִּגְדוֹ
  choice: le vêtement de Joseph
  rationale: Le texte dit littéralement «son vêtement». Le nom «Joseph» clarifie en français le référent du possessif sans modifier le sens dans ce contexte.
- source_word: אֶצְלָהּ
  choice: auprès d’elle
  rationale: Rend directement l’idée spatiale de אֵצֶל, sans préciser si elle le tenait sur elle ou simplement à proximité.
- source_word: עַד בּוֹא אֲדֹנָיו
  choice: jusqu’à ce que son maître rentre
  rationale: עַד בּוֹא marque la limite temporelle. «Rentre» convient au retour du maître dans sa propre maison.
- source_word: אֶל־בֵּיתוֹ
  choice: chez lui
  rationale: Expression française naturelle pour «dans/vers sa maison», qui présente la maison comme le domicile du maître.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concise et conserve la relation maître-serviteur indiquée par le texte hébreu.
