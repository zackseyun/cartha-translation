  text: וַ/יְהִי֙ כִּ/רְאוֹתָ֔/הּ כִּֽי עָזַ֥ב בִּגְד֖/וֹ בְּ/יָדָ֑/הּ וַ/יָּ֖נָס הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/013.yaml
  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: fr
  text: Or, quand elle vit qu’il avait laissé son vêtement[a] dans sa main et s’était enfui dehors,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne de façon générale un vêtement ou une pièce d’habillement ; il ne précise pas qu’il s’agit d’un manteau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Or
  rationale: Dans cette construction narrative, וַיְהִי introduit la circonstance temporelle dont la suite se poursuit au verset suivant. « Or » conserve cette transition sans produire le tour lourd et incomplet « il arriva que ».
- source_word: כִּרְאוֹתָהּ
  choice: quand elle vit
  rationale: La préposition כ avec l’infinitif construit de ראה et le suffixe féminin singulier exprime ici le temps. « Quand elle vit » est précis et naturel en français moderne.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit le contenu de ce qu’elle constate.
- source_word: עָזַב
  choice: avait laissé
  rationale: Le plus-que-parfait indique naturellement que l’action de laisser le vêtement précède le constat de la femme.
- source_word: בִּגְדוֹ
  choice: son vêtement
  rationale: בֶּגֶד est un terme général désignant un vêtement. Ce choix respecte cette largeur de sens sans préciser indûment qu’il s’agit d’un manteau.
- source_word: בְּיָדָהּ
  choice: dans sa main
  rationale: La formulation concrète du texte hébreu est claire et idiomatique en français.
- source_word: וַיָּנָס
  choice: s’était enfui
  rationale: נוס exprime la fuite. Le plus-que-parfait coordonné à « avait laissé » situe correctement les deux actions avant le constat.
- source_word: הַחוּצָה
  choice: dehors
  rationale: La forme directionnelle indique un mouvement vers l’extérieur. Avec « s’enfuir », « dehors » restitue ce sens de manière concise et naturelle.
