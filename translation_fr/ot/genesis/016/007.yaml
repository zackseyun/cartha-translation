  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: fr
  text: L’ange de Yahvé[a] la trouva près d’une source d’eau dans le désert, près de la source, sur le chemin qui mène à Shour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahvé ». Le mot hébreu peut signifier « ange » ou « messager ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: la trouva
  rationale: Le verbe מצא signifie ici naturellement « trouver »; le suffixe féminin singulier renvoie à Agar.
- source_word: מַלְאַךְ יְהוָה
  choice: L’ange de Yahvé[a]
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans ce contexte de messager divin, « ange » est naturel en français, tandis qu’une note conserve l’autre sens possible. Le nom divin יהוה est translittéré « Yahvé ».
- source_word: עַל עֵין הַמַּיִם
  choice: près d’une source
  rationale: עַיִן désigne ici une source d’eau; « près de » exprime idiomatiquement la localisation marquée par עַל. En français, « source » suffit sans ajouter « d’eau ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région non cultivée ou aride. « Désert » est le terme français courant et n’implique pas nécessairement une étendue de sable.
- source_word: עַל הָעַיִן
  choice: près de la source
  rationale: La répétition de עַיִן renvoie à la même source et est conservée pour respecter la structure topographique de l’hébreu.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: sur le chemin de Shour
  rationale: דֶּרֶךְ peut signifier « chemin » ou « route ». « Sur le chemin de Shour » conserve la possible nuance d’itinéraire ou de direction sans la préciser excessivement.
theological_decisions:
- issue: Sens de מַלְאַךְ dans l’expression מַלְאַךְ יְהוָה
  choice: ange
  alternative: messager
  rationale: « Ange » est la désignation française habituelle d’un envoyé céleste, mais la note maintient l’ambiguïté lexicale réelle entre « ange » et « messager ».
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: La translittération « Yahvé » préserve le caractère personnel du nom divin présent dans le texte hébreu, sans remplacer celui-ci par un titre.
- issue: Identification de l’ange de Yahvé
  choice: ne pas préciser son identité au-delà du texte
  alternative: l’identifier explicitement à Dieu ou à un être créé
  rationale: Le verset appelle simplement le personnage « l’ange de Yahvé »; la traduction conserve cette tension sans imposer une identification doctrinale.
translation_notes:
  register: Français moderne, naturel et digne. La répétition de « source » est maintenue parce qu’elle appartient à la localisation précise du récit. La forme française usuelle « Shour » est retenue pour le nom de lieu.
