revisions:
- from: L’ange de Yahvé[a] la trouva près d’une source dans le désert, près de la source qui se trouve sur le chemin de Shour.
  to: L’ange de Yahvé[a] la trouva près d’une source d’eau dans le désert, près de la source, sur le chemin qui mène à Shour.
  rationale: La révision supprime une relative absente du texte source, rend explicitement « eau » dans la première expression, et clarifie la valeur directionnelle du chemin vers Shour. Elle conserve l’ambiguïté lexicale de מַלְאָךְ dans la note sans déterminer l’identité de l’ange.
