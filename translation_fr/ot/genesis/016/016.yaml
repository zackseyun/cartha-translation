  text: וְ/אַבְרָ֕ם בֶּן שְׁמֹנִ֥ים שָׁנָ֖ה וְ/שֵׁ֣שׁ שָׁנִ֑ים בְּ/לֶֽדֶת הָגָ֥ר אֶת יִשְׁמָעֵ֖אל לְ/אַבְרָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: fr
  text: Abram avait quatre-vingt-six ans quand Agar donna naissance à Ismaël pour Abram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donna naissance à Ismaël à Abram ». La préposition hébraïque peut être rendue par « pour » ou par « à » dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abram
  rationale: Nom propre translittéré selon la forme française traditionnelle.
- source_word: בֶּן
  choice: avait … ans
  rationale: Dans une formule d’âge, בֶּן s’exprime naturellement en français par « avoir … ans ».
- source_word: שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: quatre-vingt-six ans
  rationale: La combinaison des nombres et de « année(s) » constitue la formule hébraïque normale indiquant l’âge.
- source_word: בְּ/לֶדֶת
  choice: quand … donna naissance à
  rationale: La préposition בְּ avec l’infinitif construit introduit ici une circonstance temporelle; cette tournure est naturelle et digne en français moderne.
- source_word: הָגָר
  choice: Agar
  rationale: Forme française traditionnelle du nom propre.
- source_word: אֶת יִשְׁמָעֵאל
  choice: Ismaël
  rationale: La particule אֶת marque le complément d’objet direct et ne se traduit pas; le nom reçoit sa forme française traditionnelle.
- source_word: לְ/אַבְרָם
  choice: pour Abram
  rationale: Dans ce contexte, לְ peut indiquer que l’enfant est donné à Abram ou né pour lui; « pour Abram » reste naturel et conserve cette relation sans faire d’Abram le destinataire littéral de l’accouchement.
