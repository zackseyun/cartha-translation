  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: fr
  text: 'Il dit : « Agar, esclave[a] de Saraï, d’où viens-tu et où vas-tu ? » Elle répondit : « Je fuis la présence de[b] Saraï, ma maîtresse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « servante ». Le mot hébreu désigne ici une femme de condition servile sous l’autorité de Saraï.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant Saraï » ; c’est-à-dire « de la présence de Saraï ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: esclave
  rationale: Le nom שִׁפְחָה désigne ici une femme de condition servile. « Esclave » exprime clairement son statut social sans l’atténuer; le genre féminin ressort naturellement de l’identité d’Agar.
- source_word: אֵי מִזֶּה בָאת
  choice: d’où viens-tu
  rationale: Formulation française naturelle qui rend précisément la question sur le lieu d’origine.
- source_word: וְאָנָה תֵלֵכִי
  choice: et où vas-tu
  rationale: Le présent français convient au déplacement en cours ou envisagé et conserve la question sur la destination.
- source_word: מִפְּנֵי
  choice: loin de
  rationale: Dans ce contexte de fuite, la préposition exprime l’éloignement d’une personne. « Loin de » est idiomatique en français, tandis qu’une note conserve l’image littérale de la présence ou de la face.
- source_word: גְּבִרְתִּי
  choice: ma maîtresse
  rationale: Le féminin גְּבִרָה désigne la femme qui exerce l’autorité sur Agar; « ma maîtresse » maintient cette relation hiérarchique.
- source_word: בֹּרַחַת
  choice: Je fuis
  rationale: Le participe hébreu présente l’action comme en cours. Le présent « je fuis » l’exprime naturellement en français.
- source_word: וַיֹּאמַר
  choice: Il dit
  rationale: Le sujet masculin renvoie au messager de l’Éternel dans le verset précédent, mais le texte de ce verset ne répète pas son titre.
- source_word: וַתֹּאמֶר
  choice: Elle répondit
  rationale: Dans cet échange, « répondit » rend naturellement la prise de parole d’Agar après la question, sans modifier le contenu de sa réponse.
theological_decisions:
- issue: Statut social d’Agar
  choice: esclave
  alternative: servante; servante esclave
  rationale: Le terme hébreu marque une condition servile et ne doit pas être adouci. « Esclave » est à la fois clair, digne et naturel en français contemporain.
- issue: Identification explicite du locuteur
  choice: Il dit
  alternative: Le messager de l’Éternel dit
  rationale: Même si le verset précédent identifie le locuteur, l’hébreu de ce verset emploie seulement le verbe avec un sujet implicite. La traduction n’ajoute donc pas le titre.
- issue: Image de la présence dans מִפְּנֵי
  choice: Je fuis loin de Saraï
  alternative: Je fuis de devant Saraï; je fuis la présence de Saraï
  rationale: La formulation principale exprime idiomatiquement l’éloignement causé par la fuite, tandis que la note préserve l’image hébraïque sans imposer au texte principal une tournure française peu naturelle.
translation_notes:
  register: Français international moderne, direct et digne. Le dialogue reste concis; « esclave » rend sans euphémisme le statut d’Agar, et « loin de » donne un français naturel tout en laissant à la note l’image littérale de מִפְּנֵי.
