id: GEN.16.10
reference: Genesis 16:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: fr
  text: 'Puis l’ange[a] de Yahweh lui dit : « Je multiplierai abondamment ta descendance, au point qu’on ne pourra pas la compter, tant elle sera nombreuse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ».
    reason: 'Alternative lexicale : מַלְאַךְ peut signifier « ange » ou « messager ».'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis … dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » exprime naturellement cette succession en français moderne.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager humain ou un ange ; dans cette formule narrative de la Genèse, « ange » est le choix principal traditionnel et contextuellement approprié, sans trancher son identité précise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé comme nom propre plutôt que remplacé par le titre « le Seigneur ».
- source_word: הַרְבָּה אַרְבֶּה
  choice: Je multiplierai abondamment
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie ici l’ampleur de la multiplication. « Abondamment » restitue cette force sans suggérer principalement une certitude ou un serment.
- source_word: זַרְעֵךְ
  choice: ta descendance
  rationale: זֶרַע est un collectif désignant ici les descendants. « Descendance » est naturel en français et conserve cette valeur collective.
- source_word: וְלֹא יִסָּפֵר
  choice: au point qu’on ne pourra pas la compter
  rationale: Le nifal de ספר exprime le fait d’être compté. La tournure française rend clairement la conséquence et l’idée d’une descendance impossible à dénombrer.
- source_word: מֵרֹב
  choice: tant elle sera nombreuse
  rationale: La construction indique que l’impossibilité de compter vient de la très grande quantité ; cette formulation idiomatique en conserve la cause.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme ; garder « Yahweh » préserve le caractère personnel du nom divin.
- issue: Portée de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: « Ange » convient à l’usage narratif, tandis qu’une note conserve le sens lexical plus large de « messager ». La traduction ne précise pas davantage l’identité de ce personnage et maintient ainsi la tension du récit.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe au singulier féminin. La répétition finale rend explicitement l’idée d’une multitude impossible à compter sans alourdir la syntaxe.
