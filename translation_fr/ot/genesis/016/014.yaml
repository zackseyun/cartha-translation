  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: fr
  text: C’est pourquoi on appela ce puits[a] Béer-Lahaï-Roï[b]. Il se trouve entre Cadès et Béred.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la source »; le mot hébreu peut désigner un puits ou une source.'
    reason: Préserver l’étendue sémantique de בְּאֵר dans ce contexte.
  - marker: b
    text: Béer-Lahaï-Roï signifie probablement « puits du Vivant qui me voit »; la construction peut aussi être comprise comme « puits du Vivant, mon voyant ».
    reason: Expliquer le nom hébreu tout en conservant une ambiguïté grammaticale réelle de sa construction.
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Rend naturellement en français la relation de conséquence avec l’épisode précédent.
- source_word: קָרָא לַבְּאֵר
  choice: on appela ce puits
  rationale: La forme hébraïque peut se comprendre comme un sujet indéfini; le tour français avec « on » reste naturel sans préciser abusivement l’auteur de la dénomination.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Béer-Lahaï-Roï
  rationale: Conserve le nom traditionnel du lieu par translittération; sa portée sémantique est indiquée en note sans imposer une seule analyse grammaticale.
- source_word: הִנֵּה
  choice: Il se trouve
  rationale: Dans cette indication géographique, הִנֵּה attire l’attention sur l’emplacement du puits; une formulation présentative naturelle évite le calque peu idiomatique « Voici ».
- source_word: בֵּין קָדֵשׁ וּבֵין בָּרֶד
  choice: entre Cadès et Béred
  rationale: Reproduit clairement les deux repères géographiques en employant leurs graphies françaises usuelles.
theological_decisions:
- issue: Sens du nom Béer-Lahaï-Roï
  choice: Conserver le nom dans le texte et signaler en note ses traductions possibles
  alternative: Traduire directement le nom par « Puits du Vivant qui me voit »
  rationale: La construction hébraïque permet plusieurs nuances proches; la translittération préserve cette tension et évite de fixer dans le corps du texte une interprétation unique.
translation_notes:
  register: Français international moderne, fluide et digne. Les noms propres suivent les graphies françaises courantes. L’interjection hébraïque est intégrée à une phrase locative naturelle plutôt que rendue par un calque marqué.
