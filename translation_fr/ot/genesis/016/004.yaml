  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: fr
  text: Il s’unit à Agar, et elle devint enceinte. Quand elle vit qu’elle était enceinte, sa maîtresse devint méprisable à ses yeux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle méprisa sa maîtresse ». L’hébreu présente Saraï comme devenue méprisable aux yeux d’Agar, ou peut souligner plus directement le mépris d’Agar envers elle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: Il s’unit à Agar
  rationale: Dans ce contexte, l’expression בוא אל est un euphémisme courant pour l’union sexuelle. « Il s’unit à » en exprime naturellement le sens en français moderne tout en gardant la retenue du récit.
- source_word: וַתַּהַר / הָרָתָה
  choice: elle devint enceinte / elle était enceinte
  rationale: Le verbe הרה peut désigner le fait de concevoir ou l’état de grossesse. Cette formulation française naturelle conserve la progression entre l’entrée dans cet état et sa constatation.
- source_word: וַתֵּרֶא כִּי
  choice: Quand elle vit que
  rationale: La traduction garde le verbe de perception et rend naturellement la relation temporelle dans la suite narrative.
- source_word: וַתֵּקַל
  choice: perdit de sa valeur
  rationale: Le verbe קלל évoque ici le fait de devenir léger, peu estimé ou méprisable. La formulation indique un changement d’estime sans affirmer nécessairement une manifestation active de mépris.
- source_word: גְּבִרְתָּהּ
  choice: sa maîtresse
  rationale: גברת désigne une femme placée en position d’autorité sur une autre; « maîtresse » est le terme social direct et contextuellement approprié.
- source_word: בְּעֵינֶיהָ
  choice: à ses yeux
  rationale: Cette expression idiomatique française correspond directement à l’hébreu et indique qu’il s’agit de l’estimation d’Agar.
