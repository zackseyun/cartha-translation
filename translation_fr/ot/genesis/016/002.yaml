  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: fr
  text: 'Saraï dit à Abram : « Regarde donc, Yahweh m’a empêchée d’avoir des enfants. Va donc vers mon esclave ; peut-être aurai-je par elle une descendance[a]. » Et Abram écouta la voix de Saraï.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « peut-être serai-je bâtie par elle » ou « grâce à elle ». L’expression peut signifier : « peut-être aurai-je des enfants par elle » ou « peut-être ma maison sera-t-elle établie grâce à elle ».'
    reason: Préserver la métaphore hébraïque de la construction ainsi que son ambiguïté familiale et dynastique.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit ; le passé simple convient au registre narratif français sans qu’un connecteur supplémentaire soit nécessaire.
- source_word: הִנֵּה נָא
  choice: Écoute
  rationale: Interpellation naturelle en français moderne, qui conserve la fonction d’appel à l’attention de l’expression hébraïque sans employer l’archaïque « voici donc ».
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: Yahweh m’a empêchée d’avoir des enfants
  rationale: Exprime directement l’empêchement attribué à Yahweh et rend l’infinitif de ילד dans un français courant.
- source_word: בֹּא נָא אֶל
  choice: Va donc vers
  rationale: Conserve l’euphémisme hébraïque désignant l’union sexuelle ; « donc » restitue ici la nuance pressante de נָא de manière naturelle.
- source_word: שִׁפְחָתִי
  choice: mon esclave
  rationale: Préserve le statut servile exprimé par שִׁפְחָה sans l’atténuer par « servante » ; le possessif et le contexte indiquent le féminin.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: peut-être aurai-je par elle une descendance
  rationale: Rend clairement le sens contextuel tout en signalant en note la métaphore littérale de la construction et sa possible portée plus large.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: Et Abram écouta la voix de Saraï
  rationale: Conserve l’expression hébraïque littérale et ses résonances intertextuelles, tout en restant intelligible en français.
theological_decisions:
- issue: Rôle de Yahweh dans l’absence d’enfants de Saraï
  choice: Yahweh m’a empêchée d’avoir des enfants
  alternative: Yahweh ne m’a pas permis d’avoir des enfants
  rationale: Le texte attribue explicitement l’empêchement à l’action divine ; la traduction maintient cette affirmation sans l’expliquer ni l’atténuer.
- issue: Degré d’explicitation de l’union sexuelle
  choice: Va donc vers mon esclave
  alternative: Aie des relations avec mon esclave
  rationale: L’hébreu emploie un euphémisme conventionnel. Le conserver respecte le registre et évite une explicitation absente du texte source.
- issue: Métaphore de la construction en אִבָּנֶה
  choice: aurai-je par elle une descendance, avec note littérale
  alternative: serai-je construite grâce à elle
  rationale: Le corps du texte communique le sens probable en français naturel, tandis que la note préserve la métaphore hébraïque et l’ambiguïté entre obtention d’enfants et édification d’une maison familiale.
translation_notes:
  register: Français international moderne, narratif et digne. Le nom divin est rendu par « Yahweh ». L’euphémisme sexuel et la formule « écouter la voix » sont conservés ; la métaphore peu naturelle de la construction est explicitée en note.
