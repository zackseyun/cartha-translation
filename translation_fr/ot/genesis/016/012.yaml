  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: fr
  text: 'Il sera un homme semblable à un âne sauvage[a] : sa main sera contre tous, et la main de tous sera contre lui. Il habitera en face de tous ses frères[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu le compare littéralement à un âne sauvage (ou onagre), plutôt que de dire simplement qu’il sera « sauvage ».
    reason: lexical_alternative
  - marker: b
    text: « En face de » peut aussi se comprendre « devant », « en présence de » ou « en opposition à ». Ici, « frères » peut désigner plus largement ses proches ou des peuples apparentés.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: comme un âne sauvage parmi les hommes
  rationale: פֶּרֶא désigne l’âne sauvage, ou onagre, et non la sauvagerie au sens abstrait. La tournure française conserve explicitement cette image d’une liberté indomptée tout en rendant naturellement la juxtaposition hébraïque avec אָדָם.
- source_word: יָדוֹ בַכֹּל / וְיַד כֹּל בּוֹ
  choice: sa main sera contre tous, et la main de tous sera contre lui
  rationale: La formulation garde l’image répétée de la « main » et le parallélisme hébreu, tout en exprimant le sens contextuel d’opposition réciproque.
- source_word: וְעַל־פְּנֵי
  choice: en face de
  rationale: Cette expression préserve le sens spatial et relationnel de la locution, qui peut signifier « devant », « en présence de » ou « en opposition à », sans trancher en faveur d’une orientation géographique précise.
- source_word: כָּל־אֶחָיו
  choice: tous ses frères
  rationale: Le sens premier de אָח est « frère »; le terme peut toutefois s’étendre aux proches parents ou aux peuples apparentés, nuance signalée en note.
- source_word: יִשְׁכֹּן
  choice: il habitera
  rationale: Le verbe שׁכן signifie habiter, demeurer ou s’établir. « Habiter » est actuel, naturel et adapté au ton prédictif.
theological_decisions:
- issue: Caractérisation d’Ismaël par la métaphore פֶּרֶא אָדָם
  choice: Conserver explicitement la comparaison avec l’âne sauvage
  alternative: « Ce sera un homme sauvage »
  rationale: L’hébreu présente une image animale précise, évocatrice notamment d’une existence libre et indomptée. La réduire à « sauvage » effacerait cette image et risquerait d’accentuer un jugement moral que le lexème seul n’impose pas.
- issue: Portée de וְעַל־פְּנֵי dans la relation avec ses frères
  choice: « en face de », avec l’ambiguïté expliquée en note
  alternative: « en opposition à » ou « à l’est de »
  rationale: Le contexte permet une nuance spatiale ou relationnelle. Le texte principal ne doit pas résoudre silencieusement cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme parallèle de l’hébreu et l’image répétée de la main sont conservés. Les notes maintiennent les ambiguïtés lexicales sans imposer une lecture confessionnelle.
