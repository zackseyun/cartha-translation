  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: fr
  text: 'L’ange de Yahweh[a] lui dit : « Te voici enceinte, et tu enfanteras un fils. Tu l’appelleras Ismaël, car Yahweh a entendu ta détresse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans ce récit, « ange » exprime naturellement le sens de messager céleste, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: הִנָּךְ הָרָה
  choice: Te voici enceinte
  rationale: Cette formulation française actuelle conserve la force présentative de הִנֵּה et énonce clairement l’état d’Agar.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: et tu enfanteras un fils
  rationale: Le futur rend l’annonce de la naissance; « enfanter » garde un registre biblique digne sans être obscur.
- source_word: וְקָרָאת שְׁמוֹ יִשְׁמָעֵאל
  choice: Tu l’appelleras Ismaël
  rationale: Cette tournure rend naturellement en français la formule hébraïque de nomination, littéralement « tu appelleras son nom ».
- source_word: כִּי שָׁמַע יְהוָה
  choice: car Yahweh a entendu
  rationale: כִּי introduit la raison du nom, et le passé composé donne à l’accompli hébreu sa pertinence immédiate dans la situation d’Agar.
- source_word: עָנְיֵךְ
  choice: ta détresse
  rationale: Le mot désigne l’affliction, la misère ou la condition d’une personne opprimée. « Détresse » est naturel en français et conserve une portée assez large sans réduire le terme à une simple émotion.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: Le rendu principal correspond au sens contextuel probable d’un messager céleste, mais il n’ajoute aucune identification théologique que le verset ne formule pas; la note maintient l’ambivalence lexicale.
translation_notes:
  register: Français international moderne, clair et digne. « Te voici enceinte » préserve la solennité de l’annonce sans recourir à l’archaïsme « voici que ». La ponctuation française distingue l’annonce de la naissance de l’ordre de nomination.
