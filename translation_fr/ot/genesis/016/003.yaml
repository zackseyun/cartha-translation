  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: fr
  text: Saraï, femme d’Abram, prit Agar l’Égyptienne, son esclave, après qu’Abram eut habité dix ans dans le pays de Canaan, et la donna à Abram, son mari, pour femme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקַּח
  choice: prit
  rationale: Le verbe לקח, dans ce récit, indique simplement l’action de prendre; « prit » en conserve la force narrative sans ajouter l’idée de contrainte physique.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Saraï, femme d’Abram,
  rationale: La construction appositionnelle identifie Saraï par son lien conjugal avec Abram; les virgules la rendent naturellement en français.
- source_word: הָגָר הַמִּצְרִית
  choice: Agar l’Égyptienne
  rationale: Le gentilé féminin exprime l’origine d’Agar; « l’Égyptienne » est concis et idiomatique.
- source_word: שִׁפְחָתָהּ
  choice: sa servante esclave
  rationale: שִׁפְחָה désigne une servante de condition servile. « Servante esclave » garde à la fois la fonction domestique et le statut de non-liberté, sans l’atténuer en simple emploi domestique.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: après qu’Abram eut habité dix ans dans le pays de Canaan
  rationale: מִקֵּץ marque l’achèvement d’une période. Cette formulation française rattache clairement les dix ans au séjour d’Abram en Canaan.
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: et elle la donna … à Abram, son mari
  rationale: La reprise de « elle » évite que Saraï cesse d’être clairement le sujet après la longue proposition temporelle; l’apposition rend אִישָׁהּ sans ambiguïté.
- source_word: לוֹ לְאִשָּׁה
  choice: pour femme
  rationale: La formule exprime le statut ou la finalité matrimoniale. « Pour femme » est naturel, proche de l’hébreu et n’introduit pas le terme distinct « concubine ».
theological_decisions:
- issue: Statut d’Agar par rapport à Abram
  choice: Conserver simultanément « sa servante esclave » et « pour femme ».
  alternative: Traduire « comme concubine » ou atténuer שִׁפְחָה en « servante ».
  rationale: Le texte appelle Agar שִׁפְחָה, indiquant sa condition servile, puis emploie אִשָּׁה dans la formule matrimoniale. La traduction préserve cette tension sociale et juridique au lieu de la résoudre par un terme absent de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple maintient le registre du récit biblique, tandis que « après qu’Abram eut habité » exprime clairement l’antériorité. Aucun marqueur de note n’est requis, car les nuances essentielles sont conservées directement dans le texte.
