  text: וְ/שָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑/וֹ וְ/לָ֛/הּ שִׁפְחָ֥ה מִצְרִ֖ית וּ/שְׁמָ֥/הּ הָגָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: fr
  text: Saraï, femme d’Abram, ne lui avait pas donné d’enfant. Elle avait une esclave[a] égyptienne nommée Agar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon une formulation plus traditionnelle, « servante ». Le mot hébreu désigne ici une femme en condition d’esclavage domestique ; « esclave » rend explicite son statut de dépendance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: Saraï
  rationale: Le וְ ouvre ici une nouvelle étape du récit; en français, l’enchaînement se comprend naturellement sans ajouter « et » ou « or ». Le nom est rendu selon sa forme française traditionnelle.
- source_word: אֵשֶׁת אַבְרָם
  choice: femme d’Abram
  rationale: Le groupe construit signifie explicitement que Saraï est la femme d’Abram; cette formulation est naturelle et directe en français.
- source_word: לֹא יָלְדָה לוֹ
  choice: ne lui avait pas donné d’enfant
  rationale: Le verbe יָלַד avec le complément indirect לוֹ exprime ici le fait d’avoir un enfant pour son mari. Le plus-que-parfait présente cette situation comme l’arrière-plan du récit, et le singulier collectif « d’enfant » restitue naturellement l’absence de descendance sans préciser un nombre absent de l’hébreu.
- source_word: וְלָהּ
  choice: Elle avait
  rationale: La construction possessive littérale « à elle [était] » se rend idiomatiquement en français par « elle avait ».
- source_word: שִׁפְחָה
  choice: esclave
  rationale: שִׁפְחָה désigne une femme attachée à une maison dans une condition servile. « Esclave » préserve clairement ce statut social juridiquement contraint, important pour la suite du récit.
- source_word: מִצְרִית
  choice: égyptienne
  rationale: L’adjectif qualifie directement la femme esclave et indique son origine.
- source_word: וּשְׁמָהּ הָגָר
  choice: nommée Agar
  rationale: Cette formulation française concise conserve l’identification explicite de la femme. « Agar » est la forme française traditionnelle du nom.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La première proposition conserve la relation conjugale et l’absence de descendance; la seconde évite une phrase trop chargée. Le terme « esclave » est retenu pour ne pas atténuer la réalité sociale exprimée par l’hébreu.
