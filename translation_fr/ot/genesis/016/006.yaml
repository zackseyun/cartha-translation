id: GEN.16.6
reference: Genesis 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: fr
  text: 'Alors Abram dit à Saraï : « Voici, ton esclave est entre tes mains. Fais-lui ce qui est bon à tes yeux. » Saraï la maltraita[a], et elle s’enfuit loin d’elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’humilia » ou « la traita durement ». Le verbe hébreu peut désigner l’oppression, l’humiliation ou un traitement pénible.'
    reason: Alternative lexicale préservant l’étendue de sens du verbe hébreu.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque naturellement l’attention en français moderne tout en conservant la force déictique de l’hébreu.
- source_word: שִׁפְחָתֵךְ
  choice: ton esclave
  rationale: Rend explicitement la condition servile de Hagar sans l’atténuer en simple service domestique.
- source_word: בְּיָדֵךְ
  choice: entre tes mains
  rationale: Conserve l’image hébraïque tout en exprimant clairement l’autorité et le pouvoir de Saraï sur Hagar.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: Fais-lui ce qui est bon à tes yeux
  rationale: Préserve l’idiome hébraïque et son évaluation subjective sans en expliciter davantage la portée.
- source_word: וַתְּעַנֶּהָ
  choice: la maltraita
  rationale: Exprime en français courant un traitement réellement dur ou oppressif, sans préciser une forme de violence que le texte ne donne pas.
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: elle s’enfuit loin d’elle
  rationale: Rend clairement la fuite hors de la présence de Saraï dans un français naturel et digne.
theological_decisions:
- issue: Statut social de Hagar
  choice: ton esclave
  alternative: ta servante
  rationale: Le rapport de domination au sein de la maisonnée est essentiel à la scène; « esclave » évite d’adoucir la condition de Hagar.
- issue: Gravité du traitement exprimé par וַתְּעַנֶּהָ
  choice: la maltraita
  alternative: l’humilia / la traita durement
  rationale: Le verbe indique une oppression, une humiliation ou un traitement pénible réel, mais la nature précise des sévices reste indéterminée; la note maintient cette latitude sémantique.
translation_notes:
  register: Français international moderne, narratif et digne. Les idiomes « entre tes mains » et « bon à tes yeux » conservent les images de l’hébreu tout en restant compréhensibles; le vocabulaire ne masque ni l’esclavage ni la dureté du traitement.
