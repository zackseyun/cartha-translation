  source_fidelity: 'Le texte rend fidèlement les principaux éléments de l’hébreu : l’attention introductive (« Voici »), le statut servile de Hagar (« ton esclave »), l’idiome d’autorité (« entre tes mains »), l’évaluation subjective (« ce qui est bon à tes yeux »), le traitement dur et non spécifié (« la maltraita ») et la fuite hors de la présence de Saraï (« elle s’enfuit loin d’elle »). « Loin d’elle » exprime naturellement en français la portée de מִפָּנֶיהָ sans imposer de détail supplémentaire.'
