source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: fr
  text: 'Elle donna ce nom à Yahweh, qui lui parlait : « Tu es un Dieu qui me voit[a] », car elle avait dit : « Ai-je donc vraiment vu, ici, après celui qui me voit[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu es le Dieu qui voit » ou « Tu es un Dieu de vision ». Le titre hébreu est difficile.'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est d’un hébreu difficile. Elle peut aussi se comprendre ainsi : « Ai-je donc vu ici celui qui me voyait et suis-je restée en vie ? » Une autre possibilité est : « Ai-je vu ici derrière celui qui me voit ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: Elle appela Yahweh… du nom de
  rationale: Cette tournure française exprime naturellement l’acte de donner à Yahweh un nom ou un titre descriptif, sans laisser croire qu’Agar se contente de prononcer le nom divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: qui lui parlait
  rationale: Le participe hébreu présente Yahweh comme celui qui est en train de s’adresser à Agar; l’imparfait français convient à cette valeur descriptive.
- source_word: אַתָּה אֵל רֳאִי
  choice: Tu es un Dieu qui me voit
  rationale: Cette formulation idiomatique conserve la valeur prédicative de אֵל et comprend la forme difficile רֳאִי comme désignant le Dieu qui voit Agar, conformément au contexte immédiat.
- source_word: הֲגַם הֲלֹם
  choice: Ai-je donc vraiment… ici
  rationale: « donc vraiment » rend l’étonnement et l’insistance des particules interrogatives, tandis que « ici » garde la référence au lieu.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: vu ici après celui qui me voit
  rationale: La formulation reste volontairement proche de l’hébreu difficile et maintient la relation énigmatique entre le fait de voir, « après », et celui qui voit Agar.
theological_decisions:
- issue: Sens du titre divin אֵל רֳאִי
  choice: Tu es un Dieu qui me voit
  alternative: Tu es le Dieu qui voit / Tu es un Dieu de vision
  rationale: Le contexte met en avant l’attention personnelle de Dieu envers Agar, mais la note conserve les autres nuances grammaticalement possibles sans transformer le titre en affirmation doctrinale plus précise que l’hébreu.
- issue: Interprétation de רָאִיתִי אַחֲרֵי רֹאִי
  choice: Ai-je donc vraiment vu ici après celui qui me voit ?
  alternative: Ai-je donc vu ici celui qui me voyait et suis-je restée en vie ?
  rationale: La proposition hébraïque est comprimée et incertaine. Le texte principal en préserve l’étrangeté et l’ambiguïté; la note signale l’interprétation traditionnelle liée à la survie après une rencontre divine.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve ici sa fonction de nom propre.
translation_notes:
  register: Français international actuel, digne et accessible. La première proposition est rendue idiomatiquement; la dernière demeure volontairement inhabituelle afin de ne pas effacer l’ambiguïté réelle de l’hébreu.
