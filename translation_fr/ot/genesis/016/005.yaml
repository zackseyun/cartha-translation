  source_fidelity: 'La dernière proposition centrale est déplacée : וָאֵקַל בְּעֵינֶיהָ signifie littéralement que Saraï est devenue méprisable / de peu de valeur aux yeux d’Agar. « Elle s’est mise à me mépriser » explicite une conséquence possible, mais substitue l’action d’Agar à l’état exprimé par le texte. Le reste rend fidèlement l’accusation, la conception constatée et l’appel jussif à Yahweh. « Mon esclave » rend plus exactement le statut servile de שִׁפְחָתִי que « ma servante ».'
