revisions:
- from: 'Saraï dit à Abram : « Le tort qu’on me fait retombe sur toi ! C’est moi qui ai mis ma servante dans tes bras[a] ; mais quand elle a vu qu’elle était enceinte, elle s’est mise à me mépriser[b]. Que Yahweh juge entre moi et toi ! »'
  to: 'Saraï dit à Abram : « Le tort qu’on me fait retombe sur toi ! C’est moi qui ai mis mon esclave dans tes bras[a] ; mais, quand elle a vu qu’elle était enceinte, je suis devenue méprisable à ses yeux[b]. Que Yahweh juge entre moi et toi ! »'
  rationale: La révision corrige la seule divergence sémantique notable en conservant Saraï comme sujet de « je suis devenue méprisable à ses yeux ». Elle remplace aussi « servante » par « esclave » afin de rendre le statut exprimé par l’hébreu. Les notes restent ancrées aux expressions concernées et expliquent l’euphémisme de « dans tes bras » ainsi que l’idiome d’évaluation.
