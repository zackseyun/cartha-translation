base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: fr
  text: 'Saraï dit à Abram : « Le tort qu’on me fait retombe sur toi ! C’est moi qui ai mis mon esclave dans tes bras[a] ; mais, quand elle a vu qu’elle était enceinte, je suis devenue méprisable à ses yeux[b]. Que Yahweh juge entre moi et toi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « dans ton sein » ou « dans ton giron » : image exprimant ici une relation intime.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « je suis devenue légère ou méprisable à ses yeux » ; le texte décrit l’abaissement de Saraï dans l’estime d’Agar.
    reason: formal_equivalence
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: Le tort qu’on me fait retombe sur toi
  rationale: חָמָס désigne ici le tort ou l’injustice dont Saraï se plaint, tandis que עַל attribue à Abram la responsabilité. Cette formulation française conserve l’accusation sans faire de Saraï l’auteure du tort.
- source_word: שִׁפְחָתִי
  choice: ma servante
  rationale: שִׁפְחָה désigne une femme de condition servile. « Ma servante » est naturel en français biblique moderne ; une note précise le statut afin de ne pas l’atténuer.
- source_word: בְּחֵיקֶךָ
  choice: dans tes bras
  rationale: Littéralement « dans ton sein/giron », expression évoquant ici l’accueil intime. « Dans tes bras » conserve la métaphore avec dignité et naturel.
- source_word: הָרָתָה
  choice: elle était enceinte
  rationale: Dans la construction avec ראה, le parfait décrit l’état constaté résultant de la conception. Le français idiomatique exprime naturellement cet état par « être enceinte ».
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: elle s’est mise à me mépriser
  rationale: Littéralement, Saraï est devenue légère ou méprisable aux yeux d’Agar. La formulation dynamique exprime clairement la dévalorisation relationnelle tout en gardant Agar comme sujet évaluateur.
- source_word: יִשְׁפֹּט יְהוָה
  choice: Que Yahweh juge
  rationale: 'Le yiqtol a ici une valeur jussive : Saraï en appelle à l’arbitrage divin. Le nom propre Yahweh rend directement יהוה.'
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: entre moi et toi
  rationale: La formulation conserve la confrontation directe entre les deux parties plutôt que de la généraliser en « entre nous ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre et correspond à la couche de consultation fournie.
- issue: Responsabilité visée par חֲמָסִי עָלֶיךָ
  choice: Abram est tenu responsable du tort subi par Saraï
  alternative: « Que mon tort soit sur toi », formulation pouvant laisser entendre que Saraï avoue sa propre faute
  rationale: Le possessif hébreu demeure compact et peut se rendre littéralement « mon tort », mais le contexte et עָלֶיךָ donnent à la parole une force accusatrice. La traduction explicite cette force sans déterminer davantage la nature exacte du tort.
translation_notes:
  register: Français international moderne, direct et digne. Le discours conserve la véhémence de Saraï grâce aux exclamations. « Servante » reste fluide dans le corps du texte, tout en étant compris selon le contexte ancien comme une femme de condition servile.
