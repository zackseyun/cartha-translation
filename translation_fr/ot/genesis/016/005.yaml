  terminology: « Yahweh » correspond au tétragramme et à la décision fournie. « Esclave » rend le statut de שִׁפְחָה sans euphémisation. « Tort » convient à חָמָס dans ce contexte accusateur, sans trancher de façon indue entre tort, injustice et violence.
