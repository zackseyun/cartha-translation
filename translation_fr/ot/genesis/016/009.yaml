  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: fr
  text: 'Alors, l’ange de Yahweh lui dit : « Retourne chez ta maîtresse et humilie-toi sous sa main[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « humilie-toi sous sa main ». L’expression « sous sa main » signifie « sous son autorité ». Le verbe peut aussi suggérer l’acceptation d’une condition d’affliction ou de traitement pénible.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאַךְ peut désigner un messager ou un ange. Dans ce récit de rencontre divine, « ange » est le terme français le plus naturel, sans préciser davantage son identité.
- source_word: שׁוּבִי אֶל גְּבִרְתֵּךְ
  choice: Retourne auprès de ta maîtresse
  rationale: L’impératif féminin שׁוּבִי commande un retour. גְּבִרְתֵּךְ désigne la femme placée au-dessus d’Agar dans la hiérarchie domestique ; « maîtresse » conserve cette relation sociale.
- source_word: וְהִתְעַנִּי
  choice: soumets-toi
  rationale: Le hitpael impératif de ענה exprime ici l’acceptation d’une position abaissée ou subordonnée. « Soumets-toi » rend naturellement en français la valeur réfléchie et relationnelle du verbe, tout en laissant une note signaler sa nuance pénible possible.
- source_word: תַּחַת יָדֶיהָ
  choice: à son autorité
  rationale: Littéralement « sous sa main », cette locution hébraïque indique ici l’autorité exercée par la maîtresse. La formulation française explicite l’idiome sans altérer son sens.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin personnel. « Yahweh » le conserve plutôt que de lui substituer un titre.
- issue: Sens de מַלְאַךְ
  choice: ange
  alternative: messager
  rationale: Le mot peut avoir les deux sens, mais le contexte d’une rencontre divine favorise « ange ». Ce choix ne tranche pas la question théologique de l’identité exacte de cet ange.
- issue: Force de וְהִתְעַנִּי
  choice: soumets-toi
  alternative: humilie-toi ; accepte d’être maltraitée
  rationale: Le contexte associe soumission et affliction, mais le verbe ne doit pas être développé comme une approbation générale de la maltraitance. Le texte commande ici à Agar de reprendre une position subordonnée sous l’autorité de sa maîtresse.
translation_notes:
  register: Français international moderne, direct et digne. « Alors » assure la continuité narrative. L’idiome hébreu est rendu par son sens courant dans le texte, tandis que sa forme littérale et l’ambiguïté du verbe sont préservées en note.
