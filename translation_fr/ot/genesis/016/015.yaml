  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: fr
  text: Agar donna un fils à Abram, et Abram donna à son fils, qu’Agar avait mis au monde, le nom d’Ismaël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: donna un fils
  rationale: Avec un sujet féminin, ילד au qal signifie « enfanter, donner naissance ». La tournure « donner un fils à quelqu’un » est naturelle en français et rend aussi le complément לְאַבְרָם.
- source_word: לְאַבְרָם
  choice: à Abram
  rationale: 'La préposition לְ indique ici la relation au père ou au bénéficiaire : Agar enfante un fils pour Abram, reconnu comme son fils.'
- source_word: בֵּן
  choice: un fils
  rationale: Le nom est indéfini en hébreu et appelle naturellement l’article indéfini en français.
- source_word: וַיִּקְרָא ... שֵׁם
  choice: appela Ismaël
  rationale: L’expression hébraïque signifie littéralement « appeler le nom de », mais en français actuel la formulation idiomatique pour attribuer un nom est « appeler [quelqu’un] [nom] ».
- source_word: בְּנוֹ
  choice: le fils
  rationale: Dans « le fils qu’Agar lui avait donné », le pronom indirect « lui » renvoie à Abram et exprime naturellement que cet enfant est son fils.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: qu’Agar lui avait donné
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité de la naissance par rapport à l’attribution du nom; « lui avait donné » reprend sans lourdeur la relation exprimée par לְאַבְרָם.
- source_word: יִשְׁמָעֵאל
  choice: Ismaël
  rationale: « Ismaël » est la forme française traditionnelle et courante de ce nom hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe évite le calque peu naturel « appela le nom de son fils » tout en conservant explicitement Agar, Abram, la filiation et l’attribution du nom.
