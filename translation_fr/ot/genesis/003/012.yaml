source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: fr
  text: 'L’homme répondit : « La femme que tu as donnée pour être avec moi, c’est elle qui m’a donné du fruit de l’arbre[a], et j’en ai mangé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’arbre »; le mot « fruit » est sous-entendu par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: L’homme
  rationale: Dans ce contexte, le terme désigne l’homme individuellement, en contraste avec la femme, et non l’humanité en général.
- source_word: הָאִשָּׁה
  choice: La femme
  rationale: Cette traduction directe conserve la désignation hébraïque; « l’épouse » serait possible dans certains contextes, mais serait ici moins proche du texte.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: que tu as donnée pour être avec moi
  rationale: Cette formulation naturelle exprime la relation de présence et de compagnie indiquée par עִמָּדִי sans atténuer l’allusion au fait que Dieu l’a donnée.
- source_word: הִוא
  choice: c’est elle qui
  rationale: La tournure détachée rend l’insistance du pronom indépendant hébreu de façon idiomatique en français.
- source_word: נָתְנָה לִי
  choice: m’a donné
  rationale: Le passé composé convient au récit français et exprime simplement l’action antérieure.
- source_word: מִן הָעֵץ
  choice: du fruit de l’arbre
  rationale: L’hébreu dit littéralement « de l’arbre », mais l’objet donné est implicite dans le contexte. Le mot « fruit » est explicité pour obtenir une phrase française naturelle, avec une note signalant cet ajout.
- source_word: וָאֹכֵל
  choice: et j’en ai mangé
  rationale: Le pronom « en » reprend naturellement en français ce qui a été donné, tandis que « et » conserve la simple succession du texte hébreu sans introduire une causalité plus forte.
theological_decisions:
- issue: Possible déplacement de la faute vers Dieu dans la réponse de l’homme
  choice: Conserver « la femme que tu as donnée pour être avec moi » sans adoucir ni accentuer la formulation.
  alternative: « la femme que tu m’as donnée » ou « la femme que tu as placée auprès de moi »
  rationale: Le texte laisse entendre que l’homme reporte la responsabilité à la fois sur la femme et, indirectement, sur Dieu. La traduction préserve cette tension sans la commenter dans le corps du verset.
translation_notes:
  register: Français international actuel, naturel et digne. « Répondit » rend ici l’acte de prendre la parole dans un échange. La construction « c’est elle qui » préserve l’emphase hébraïque, et « j’en ai mangé » évite une répétition peu naturelle.
