id: GEN.3.5
reference: Genesis 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: fr
  text: Car Dieu sait que, le jour où vous en mangerez, vos yeux s’ouvriront et vous serez comme Dieu[a], connaissant le bien et le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des dieux » ou « comme des êtres divins ». Dans certains contextes, le mot hébreu אֱלֹהִים peut avoir ces sens.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication donnée par le serpent et relie naturellement ce verset à son affirmation précédente.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: Dieu sait
  rationale: Le présent français rend naturellement le participe hébreu employé avec son sujet.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce que Dieu sait.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Cette tournure conserve l’image temporelle de l’hébreu tout en restant naturelle en français; elle désigne le moment où l’acte aura lieu, sans imposer nécessairement une période de vingt-quatre heures.
- source_word: אֲכָלְכֶם מִמֶּנּוּ
  choice: vous en mangerez
  rationale: Le pronom « en » reprend naturellement en français ce dont les humains mangeront, et le futur convient à la déclaration du serpent.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: vos yeux s’ouvriront
  rationale: La construction pronominale française rend de façon idiomatique le niphal hébreu et préserve la métaphore de l’accès à une perception nouvelle.
- source_word: וִהְיִיתֶם
  choice: vous serez
  rationale: Cette traduction directe met l’accent sur l’état annoncé, sans expliciter davantage l’idée possible de devenir.
- source_word: כֵּאלֹהִים
  choice: comme Dieu
  rationale: Dans le contexte immédiat, אֱלֹהִים désigne probablement Dieu; les autres sens réellement possibles sont toutefois conservés en note.
- source_word: יֹדְעֵי
  choice: connaissant
  rationale: Le participe français conserve la forme compacte du participe hébreu et se rapporte au sujet pluriel « vous ».
- source_word: טוֹב וָרָע
  choice: le bien et le mal
  rationale: Cette expression française établie restitue la portée morale et sapientielle possible de la formule hébraïque.
theological_decisions:
- issue: Référent de אֱלֹהִים dans כֵּאלֹהִים
  choice: comme Dieu
  alternative: comme des dieux; comme des êtres divins
  rationale: Le contexte immédiat parle du Dieu unique et associe la connaissance du bien et du mal à une prérogative divine. Comme le nom hébreu peut néanmoins recevoir d’autres sens, la note maintient l’ambiguïté sans l’effacer.
translation_notes:
  register: Français international moderne, naturel et digne. « Le jour où » garde l’idiome temporel sans suggérer obligatoirement une journée de vingt-quatre heures. La note est placée immédiatement après « Dieu », l’expression qu’elle précise.
