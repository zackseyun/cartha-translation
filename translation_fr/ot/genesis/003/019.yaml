  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: fr
  text: C’est à la sueur de ton visage[a] que tu mangeras du pain, jusqu’à ce que tu retournes au sol, car c’est de lui que tu as été tiré ; car tu es poussière et tu retourneras à la poussière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « à la sueur de ton visage ». L’expression française courante est : « à la sueur de ton front ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: C’est à la sueur de ton visage
  rationale: Cette formulation conserve l’image hébraïque, où אַפֶּיךָ désigne littéralement le visage. La tournure française « à la sueur de » exprime naturellement le moyen et la peine.
- source_word: תֹּאכַל לֶחֶם
  choice: tu mangeras du pain
  rationale: לֶחֶם signifie directement « pain », même s’il peut représenter plus largement la nourriture. Le sens concret est maintenu dans le texte.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: jusqu’à ce que tu retournes au sol
  rationale: אֲדָמָה désigne le sol ou la terre. « Sol » reste naturel et maintient le lien avec l’origine matérielle de l’être humain.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: car c’est de lui que tu as été tiré
  rationale: Le pronom féminin hébreu renvoie à אֲדָמָה. En français, « lui » s’accorde avec « sol ». La forme passive reflète le Pual לֻקָּחְתָּ.
- source_word: כִּי
  choice: car / oui
  rationale: Le premier כִּי introduit clairement la cause. Le second peut avoir une valeur explicative ou emphatique; « oui » donne ici une affirmation solennelle sans alourdir la répétition française.
- source_word: עָפָר
  choice: poussière
  rationale: « Poussière » est l’équivalent direct et traditionnel de עָפָר dans cette formule de mortalité, tout en conservant l’écho entre l’origine terrestre et le retour à la terre.
- source_word: תָּשׁוּב
  choice: tu retourneras
  rationale: L’imparfait hébreu annonce ici une conséquence certaine. Le futur simple français en rend naturellement la solennité.
theological_decisions:
- issue: Mortalité humaine et origine matérielle
  choice: Le verset annonce le retour physique de l’homme au sol et à la poussière dont il a été tiré.
  alternative: Comprendre principalement la poussière comme une image d’humiliation.
  rationale: Le rapprochement explicite entre אֲדָמָה, le fait d’en avoir été tiré, et עָפָר soutient le sens de mort corporelle, sans qu’il soit nécessaire d’ajouter des développements doctrinaux ultérieurs.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et la gravité de l’hébreu. « Visage » maintient volontairement l’image source, tandis que la note fournit l’expression idiomatique française.
