  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: fr
  text: 'Alors Yahvé Dieu dit au serpent : « Puisque tu as fait cela, tu es maudit plus que tout le bétail et plus que toutes les bêtes sauvages. Tu avanceras sur ton ventre[b] et tu mangeras de la poussière tous les jours de ta vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: L’expression « manger de la poussière » peut aussi évoquer l’humiliation et la défaite ; elle ne décrit donc pas nécessairement un régime alimentaire au sens strict.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: Yahvé Dieu
  rationale: « Yahvé » représente le nom divin dans le texte source, tandis que « Dieu » rend אֱלֹהִים; l’ensemble reste naturel en français et correspond à la couche anglaise POB fournie.
- source_word: הַנָּחָשׁ
  choice: le serpent
  rationale: « Serpent » est le terme français courant dans ce récit et conserve son registre littéraire; « le serpent » demeure aussi une traduction possible par « le reptile ophidien / le serpent au sens de snake », signalée en note sans identification théologique ajoutée.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: Puisque tu as fait cela
  rationale: La proposition exprime la cause du jugement. « Puisque » convient au constat solennel d’un fait déjà établi.
- source_word: אָרוּר אַתָּה
  choice: tu es maudit
  rationale: Cette formulation est claire et naturelle en français moderne tout en gardant la force judiciaire du prédicat hébreu.
- source_word: מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: plus que tout le bétail et plus que tous les animaux des champs
  rationale: Le מִן comparatif est rendu par « plus que ». « Bétail » désigne les animaux domestiques, tandis que « animaux des champs » conserve l’expression du texte pour les autres animaux terrestres.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: Tu avanceras sur ton ventre
  rationale: Le verbe signifie littéralement aller ou marcher, sans exprimer à lui seul l’idée de ramper. « Avancer » est idiomatique avec « sur ton ventre » et évite d’ajouter cette précision.
- source_word: וְעָפָר תֹּאכַל
  choice: et tu mangeras de la poussière
  rationale: La traduction conserve l’image concrète sans décider si elle décrit uniquement un régime littéral ou également l’humiliation et la défaite.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: tous les jours de ta vie
  rationale: Cette formulation reproduit pleinement l’expression temporelle hébraïque et sa cadence solennelle.
theological_decisions:
- issue: Nature et identité du serpent
  choice: Traduire l’adresse au serpent selon le référent immédiat du récit, sans l’identifier explicitement à Satan.
  alternative: Introduire dans le texte principal une identification avec Satan à partir de textes bibliques ultérieurs.
  rationale: Genèse 3.14 s’adresse explicitement au serpent et décrit son jugement en termes concrets. La traduction ne doit pas résoudre par anticipation une relation théologique développée ailleurs.
- issue: Portée de l’expression « manger de la poussière »
  choice: Conserver l’image sans choisir entre description concrète et métaphore d’humiliation.
  alternative: Paraphraser exclusivement comme une défaite ou une humiliation.
  rationale: L’expression peut évoquer l’abaissement et la défaite, mais le contexte entretient aussi une représentation physique. Le texte français préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur rend la déclaration de jugement. Les formulations évitent aussi bien l’archaïsme inutile que l’explication doctrinale ajoutée au corps du verset.
