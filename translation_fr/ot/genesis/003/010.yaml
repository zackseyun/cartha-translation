base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: fr
  text: 'Il répondit : « J’ai entendu ta voix[a] dans le jardin. J’ai eu peur, car je suis nu, et je me suis caché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton bruit ». Le mot hébreu peut désigner aussi bien une voix qu’un son ou un bruit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il répondit
  rationale: Le verbe signifie littéralement « il dit », mais, après la question du verset précédent, « il répondit » exprime naturellement sa fonction dans le dialogue sans ajouter de contenu.
- source_word: אֶת קֹלְךָ
  choice: le bruit que tu faisais
  rationale: קוֹל peut désigner un bruit ou une voix. Cette formulation française conserve ici le sens large de ce qui a été entendu, sans présumer qu’il s’agissait de paroles articulées.
- source_word: שָׁמַעְתִּי בַּגָּן
  choice: J’ai entendu … dans le jardin
  rationale: Rendu direct du verbe שמע et du complément de lieu défini.
- source_word: וָאִירָא
  choice: J’ai eu peur
  rationale: Expression idiomatique en français moderne pour la peur éprouvée dans ce récit au passé.
- source_word: כִּי עֵירֹם אָנֹכִי
  choice: car je suis nu
  rationale: כִּי introduit la cause. La proposition nominale hébraïque ne porte pas de temps explicite ; le présent français préserve l’affirmation directe d’Adam et évite d’imposer un passé.
- source_word: וָאֵחָבֵא
  choice: et je me suis caché
  rationale: La forme verbale a un sens réfléchi. La coordination « et » respecte la séquence hébraïque sans rendre explicite une relation de conséquence seulement implicite.
theological_decisions:
- issue: Sens de קוֹל en rapport avec la présence de Dieu
  choice: le bruit que tu faisais
  alternative: ta voix
  rationale: Le nom hébreu peut signifier « bruit », « son » ou « voix ». Le texte n’indique pas explicitement à cet endroit qu’Adam a entendu des paroles ; le texte principal garde donc le sens plus large, tandis que la lecture traditionnelle figure en note.
- issue: Valeur temporelle de עֵירֹם אָנֹכִי
  choice: je suis nu
  alternative: j’étais nu
  rationale: L’hébreu emploie une proposition nominale sans temps marqué. Le présent conserve cette indétermination grammaticale et peut désigner l’état qu’Adam constate encore au moment où il parle.
translation_notes:
  register: Français international actuel, naturel et digne. Le discours direct reste simple, et l’ambiguïté de קוֹל est maintenue dans le texte et explicitée en note.
