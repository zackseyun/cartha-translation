  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: fr
  text: La femme vit que l’arbre était bon à manger, qu’il était un plaisir pour les yeux[a] et qu’il était désirable pour acquérir du discernement[b]. Elle prit de son fruit et en mangea. Elle en donna aussi à son mari, qui était avec elle, et il en mangea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un objet de désir pour les yeux ». L’expression hébraïque souligne l’attrait visuel de l’arbre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour rendre sage » ou « pour devenir avisé ». L’hébreu peut exprimer le fait de devenir avisé ou de rendre avisé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: vit
  rationale: Le verbe narratif courant ראה exprime ici la perception de la femme sans qu’il soit nécessaire d’ajouter une nuance d’examen ou de jugement.
- source_word: טוֹב לְמַאֲכָל
  choice: bon à manger
  rationale: Cette formulation française naturelle exprime l’aptitude de l’arbre à fournir de la nourriture tout en conservant l’adjectif « bon ».
- source_word: תַאֲוָה הוּא לָעֵינַיִם
  choice: il était un plaisir pour les yeux
  rationale: Le nom תַאֲוָה peut désigner le désir ou ce qui suscite le désir. La formulation retenue met en valeur l’attrait visuel sans lui imposer d’emblée une connotation morale négative.
- source_word: נֶחְמָד
  choice: désirable
  rationale: Le terme décrit ce qui attire ou paraît souhaitable. « Désirable » préserve cette évaluation sans renforcer indûment le texte par « convoité ».
- source_word: לְהַשְׂכִּיל
  choice: pour acquérir du discernement
  rationale: L’infinitif hifil de שכל peut évoquer l’accès à la compréhension, à la prudence ou à la sagesse. « Acquérir du discernement » reste naturel et ne précise pas excessivement la nature du savoir recherché.
- source_word: מִפִּרְיוֹ
  choice: de son fruit
  rationale: La formulation suit la préposition מן et garde le singulier collectif « fruit », naturel en français dans ce contexte.
- source_word: וַתִּתֵּן גַּם לְאִישָׁהּ
  choice: Elle en donna aussi à son mari
  rationale: « En » restitue naturellement l’objet sous-entendu, à savoir une partie du fruit, tandis que גַּם est rendu par « aussi ».
- source_word: עִמָּהּ
  choice: qui était avec elle
  rationale: La proposition relative rattache clairement l’expression hébraïque au mari et conserve explicitement ce détail narratif.
theological_decisions:
- issue: Coloration morale de la perception de la femme
  choice: 'Employer des termes descriptifs relativement neutres : « bon », « plaisir » et « désirable ».'
  alternative: Employer des termes explicitement négatifs tels que « convoitise », « tentant » ou « convoité ».
  rationale: L’hébreu rapporte l’évaluation positive que la femme fait de l’arbre sans intégrer dans ces mots eux-mêmes une condamnation morale explicite. La traduction laisse au contexte narratif le soin de porter cette tension.
- issue: Portée de לְהַשְׂכִּיל
  choice: « pour acquérir du discernement »
  alternative: « pour rendre intelligent » ou « pour devenir sage »
  rationale: La construction peut évoquer l’obtention du discernement ou l’effet qui rend avisé. Le texte principal retient une formulation française idiomatique, tandis que la note conserve l’autre possibilité causative.
- issue: Présence du mari
  choice: Rendre explicitement עִמָּהּ par « qui était avec elle ».
  alternative: 'Laisser une construction plus littérale et ambiguë : « à son mari avec elle ».'
  rationale: La relative française clarifie la syntaxe sans supprimer ni amplifier l’indication donnée par l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases sont simples et accessibles; « bon à manger » et la reprise par « en » évitent une littéralité pesante. Aucun vocabulaire confessionnel particulier n’est introduit.
