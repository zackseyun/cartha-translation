source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: fr
  text: 'À Adam, il dit[a] : « Parce que tu as écouté la voix de ta femme et que tu as mangé de l’arbre au sujet duquel je t’avais donné cet ordre : “Tu n’en mangeras pas”, le sol est maudit à cause de toi[b]. C’est à force de peine[c] que tu en tireras ta nourriture tous les jours de ta vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’homme ».
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Maudit est le sol à cause de toi. »'
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu peut aussi évoquer la douleur, le chagrin ou un pénible labeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: À Adam
  rationale: Dans ce contexte narratif, le terme désigne l’homme particulier auquel Dieu s’adresse. Le nom « Adam » convient, tout en signalant en note la traduction possible « l’homme ».
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: tu as écouté la voix de ta femme
  rationale: Cette formulation conserve l’image et la structure de l’idiome hébreu sans imposer l’interprétation plus forte « tu as obéi à ta femme ».
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: tu as mangé de l’arbre
  rationale: Le français biblique courant « manger de l’arbre » rend la préposition מִן et désigne naturellement ce qui provient de l’arbre.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: au sujet duquel je t’avais donné cet ordre
  rationale: La formulation exprime le lien entre l’arbre et le commandement, tandis que les deux-points rendent naturellement l’infinitif hébreu « en disant » qui introduit le contenu de l’ordre.
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: Tu n’en mangeras pas
  rationale: Le futur à valeur injonctive rend sobrement l’interdiction; « en » reprend l’arbre et conserve la relation exprimée par מִן.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: le sol est maudit
  rationale: « Le sol » convient au contexte agricole et maintient le jeu de proximité entre אָדָם et אֲדָמָה sans confondre l’homme avec la terre entière.
- source_word: בַּעֲבוּרֶךָ
  choice: à cause de toi
  rationale: Cette expression rend clairement la causalité ou la responsabilité indiquée par l’hébreu, sans suggérer un but bénéfique comme pourrait le faire « pour toi ».
- source_word: בְּעִצָּבוֹן
  choice: à force de peine
  rationale: Le terme évoque à la fois douleur, pénibilité et labeur. Dans ce contexte de subsistance tirée du sol, « à force de peine » exprime naturellement la dureté durable du travail.
- source_word: תֹּאכֲלֶנָּה
  choice: tu en tireras ta nourriture
  rationale: 'Le suffixe féminin renvoie au sol. Puisqu’il ne s’agit pas de manger littéralement le sol, cette formulation rend explicitement le sens contextuel : se nourrir de ce qu’il produit.'
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: tous les jours de ta vie
  rationale: Cette expression française conserve la plénitude et la solennité de l’idiome hébreu.
theological_decisions:
- issue: Sens de אָדָם dans l’adresse divine
  choice: Adam
  alternative: l’homme
  rationale: Le récit vise ici l’individu précis, mais l’hébreu peut encore être compris comme le nom commun « l’homme ». La note préserve cette possibilité sans transformer le verset en affirmation générale sur toute l’humanité.
- issue: Portée de שׁמע בקול
  choice: écouter la voix de
  alternative: obéir à
  rationale: L’idiome peut impliquer l’obéissance, mais la traduction retenue conserve l’expression source et évite de préciser davantage que le texte la nature de l’acte reproché.
- issue: Nature de la peine exprimée par בְּעִצָּבוֹן
  choice: à force de peine
  alternative: dans un pénible labeur / dans la douleur
  rationale: Le mot relie potentiellement ce jugement à la douleur mentionnée au verset précédent, tout en prenant ici une coloration agricole. La traduction garde cette tension entre douleur et travail pénible.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve la solennité du jugement tout en évitant les tournures inutilement archaïques. Les formulations « écouter la voix » et « tous les jours de ta vie » maintiennent des échos importants de l’hébreu; « tirer sa nourriture du sol » explicite seulement ce que suppose le suffixe hébreu afin d’éviter l’idée absurde de manger le sol lui-même.
