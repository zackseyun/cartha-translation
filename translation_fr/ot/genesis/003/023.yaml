  text: וַֽ/יְשַׁלְּחֵ֛/הוּ יְהוָ֥ה אֱלֹהִ֖ים מִ/גַּן עֵ֑דֶן לַֽ/עֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר לֻקַּ֖ח מִ/שָּֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: fr
  text: Yahweh Dieu le renvoya du jardin d’Éden pour travailler[a] le sol d’où il avait été tiré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour cultiver le sol ». Le verbe hébreu peut signifier « travailler », « servir » ou, dans ce contexte, « cultiver ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: le renvoya
  rationale: Le piel de שׁלח exprime ici l’éloignement hors du jardin. « Le renvoya » conserve l’idée d’envoyer au loin sans anticiper le verbe plus fort גרשׁ, employé au verset suivant.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Cette formulation rend directement le nom divin יהוה et maintient son association avec אֱלֹהִים.
- source_word: מִגַּן עֵדֶן
  choice: du jardin d’Éden
  rationale: La préposition מִן marque la séparation ou la provenance; « du jardin d’Éden » est naturel en français après « renvoya ».
- source_word: לַעֲבֹד
  choice: pour qu’il travaille
  rationale: עבד peut signifier travailler, servir ou cultiver. Avec « le sol » comme complément, « travailler » garde la portée générale du verbe et demeure idiomatique.
- source_word: אֶת הָאֲדָמָה
  choice: le sol
  rationale: אֲדָמָה désigne ici la terre arable ou le sol dont l’être humain a été tiré; « le sol » préserve ce lien narratif.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: d’où il avait été tiré
  rationale: La relative se rapporte au sol. Le plus-que-parfait marque l’antériorité de cette action, et le passif hébreu est conservé.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » le rend comme nom propre sans substituer un titre.
- issue: Lien entre la tâche de l’homme et sa vocation antérieure
  choice: travailler le sol
  alternative: cultiver le sol
  rationale: « Travailler » maintient la continuité lexicale possible avec la tâche antérieure sans préciser au-delà du texte le caractère exact de l’activité agricole.
translation_notes:
  register: Français international moderne, naturel et digne. « Renvoya » distingue ce verbe du geste plus énergique exprimé au verset suivant; la note conserve l’alternative agricole de עבד.
