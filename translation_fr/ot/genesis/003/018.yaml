  text: וְ/ק֥וֹץ וְ/דַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑/ךְ וְ/אָכַלְתָּ֖ אֶת עֵ֥שֶׂב הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: fr
  text: Le sol produira pour toi des épines et des chardons, et tu mangeras les plantes des champs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « la végétation des champs » ou, plus traditionnellement, « l’herbe des champs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹץ וְדַרְדַּר
  choice: des épines et des chardons
  rationale: Cette paire rend deux types de végétation épineuse distincts sans prétendre identifier avec précision une espèce botanique.
- source_word: תַּצְמִיחַ לָךְ
  choice: Il fera pousser pour toi
  rationale: Le causatif de צמח est conservé naturellement en français. Le pronom « Il » reprend « le sol » du verset précédent, nom masculin en français, tandis que « pour toi » maintient explicitement לָךְ et sa nuance ici défavorable.
- source_word: וְאָכַלְתָּ
  choice: et tu mangeras
  rationale: Le futur français exprime naturellement la conséquence annoncée dans ce contexte.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: les plantes des champs
  rationale: « Plantes » garde le sens large de עֵשֶׂב sans le limiter à l’herbe; « des champs » est idiomatique en français moderne et rend le domaine ouvert ou cultivé désigné par הַשָּׂדֶה.
theological_decisions:
- issue: Référent du verbe féminin singulier תַּצְמִיחַ
  choice: Le sujet implicite est le sol mentionné au verset précédent, repris par « Il ».
  alternative: Employer une tournure impersonnelle ou répéter explicitement « le sol ».
  rationale: En hébreu, le féminin singulier renvoie naturellement à הָאֲדָמָה. En français, « le sol » étant masculin, le pronom correspondant est « Il »; cette reprise préserve le lien contextuel sans ajout explicatif dans le texte.
translation_notes:
  register: Français international moderne, simple et digne. « Faire pousser » préserve la valeur causative du verbe hébreu; « produire » serait plus compact, mais rendrait moins visiblement cette nuance. Le singulier collectif hébreu est rendu par des pluriels naturels en français.
