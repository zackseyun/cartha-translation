  text: וַ/יַּעַשׂ֩ יְהוָ֨ה אֱלֹהִ֜ים לְ/אָדָ֧ם וּ/לְ/אִשְׁתּ֛/וֹ כָּתְנ֥וֹת ע֖וֹר וַ/יַּלְבִּשֵֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: fr
  text: Yahweh Dieu fit à l’homme[a] et à sa femme des vêtements de peau[b], et il les en revêtit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Adam et à sa femme ». Le mot hébreu אָדָם peut, selon le contexte, être le nom propre « Adam » ou le nom commun « homme ».
    reason: alternative_reading
  - marker: b
    text: Ou « des tuniques de peau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Conserve le nom divin personnel et rend naturellement en français l’apposition avec אֱלֹהִים.
- source_word: לְאָדָם
  choice: pour l’homme
  rationale: Dans ce contexte, אָדָם désigne l’être humain masculin en contraste avec sa femme; le sens de nom propre reste néanmoins possible et est signalé en note.
- source_word: וּלְאִשְׁתּוֹ
  choice: et pour sa femme
  rationale: Le nom אִשָּׁה muni du suffixe masculin singulier signifie naturellement « sa femme » dans ce contexte conjugal.
- source_word: כָּתְנוֹת עוֹר
  choice: des vêtements de peau
  rationale: Rend clairement la matière sans préciser davantage la forme du vêtement; « tuniques de peau » demeure une possibilité lexicale.
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Équivalent simple et direct du verbe courant עשה.
- source_word: וַיַּלְבִּשֵׁם
  choice: puis il les en revêtit
  rationale: Le hiphil de לבש signifie « faire porter, vêtir ». Le pronom « en » rattache naturellement l’action aux vêtements déjà mentionnés, tandis que « revêtit » maintient un registre digne.
theological_decisions:
- issue: Faut-il comprendre אָדָם comme un nom propre ou comme un nom commun ?
  choice: 'nom commun : « l’homme »'
  alternative: 'nom propre : « Adam »'
  rationale: À ce stade du récit, le contraste avec « sa femme » favorise le sens commun, mais l’hébreu conserve une réelle ambiguïté; l’autre lecture est donc donnée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Revêtit » est légèrement soutenu mais courant dans un contexte biblique; il évite la tournure plus plate « les habilla ». Les marqueurs suivent l’ordre fourni dans le texte anglais audité.
