  source_fidelity: 'Le sens est globalement fidèle : Yahweh Dieu est le sujet, les destinataires sont l’homme et sa femme, les vêtements sont de peau, et Dieu les en revêt. Toutefois, « puis » introduit une nuance de succession plus marquée que le simple waw narratif ; « et » est plus direct.'
