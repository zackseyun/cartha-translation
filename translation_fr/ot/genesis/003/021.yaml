    rationale: Le waw consécutif relie les actions sans exiger l’adverbe « puis ». « Et » conserve mieux la simplicité de l’hébreu.
  - severity: low
    issue: Construction avec « pour » moins naturelle
    rationale: Pour des vêtements confectionnés à l’intention de personnes, « fit à l’homme et à sa femme » est une tournure française plus directe tout en rendant les prépositions לְ.
