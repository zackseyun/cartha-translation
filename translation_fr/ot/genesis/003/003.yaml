    issue: Reprise pronominale dans « vous n’y toucherez pas »
    rationale: Le pronom hébreu בּוֹ renvoie à l’arbre, objet de l’action « toucher ». En français, « y toucher » peut se comprendre, mais « le toucher » est la reprise objet directe la plus précise.
  - severity: low
    issue: Temps de « Dieu a dit »
    rationale: Le passé composé est possible, mais le plus-que-parfait rend plus explicitement l’antériorité de la parole de Dieu par rapport à la réplique de la femme, sans modifier le sens.
  - severity: low
    issue: Formulation de la note lexicale
    rationale: « À l’intérieur du jardin » est possible mais moins idiomatique comme alternative à « au milieu ». « Au cœur du jardin » rend naturellement l’idée de position interne/centrale sans imposer une précision géométrique.
