base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: fr
  text: 'Mais quant au fruit de l’arbre qui est au milieu du jardin[a], Dieu avait dit : « Vous n’en mangerez pas et vous ne le toucherez pas, de peur que vous ne mouriez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui est au cœur du jardin ».'
    reason: Alternative lexicale possible pour בְּתוֹךְ, qui peut désigner l’intérieur aussi bien que le milieu.
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: Mais quant au fruit
  rationale: La conjonction et la construction avec מִן marquent ici le contraste avec le verset précédent. « Mais quant au fruit » rend naturellement ce contraste tout en introduisant l’objet concerné.
- source_word: הָעֵץ
  choice: l’arbre
  rationale: Traduction directe du nom défini.
- source_word: אֲשֶׁר בְּ/תוֹךְ הַ/גָּן
  choice: qui est au milieu du jardin
  rationale: בְּתוֹךְ désigne l’intérieur ou le milieu ; cette formulation est naturelle en français moderne et conserve l’indication spatiale.
- source_word: אָמַר אֱלֹהִים
  choice: Dieu a dit
  rationale: Le qatal rapporte ici une parole antérieure. Le passé composé convient au discours oral rapporté en français moderne.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: Vous n’en mangerez pas
  rationale: Le futur à valeur impérative rend la défense solennelle sans archaïsme excessif. Le pronom « en » exprime naturellement en français la construction avec מִן.
- source_word: וְ/לֹא תִגְּעוּ בּ/וֹ
  choice: et vous n’y toucherez pas
  rationale: נגע signifie couramment « toucher ». Le pronom « y » est la reprise idiomatique de l’arbre en français.
- source_word: פֶּן תְּמֻתוּן
  choice: de peur que vous ne mouriez
  rationale: פֶּן introduit une conséquence redoutée ou à éviter. Cette tournure conserve la nuance modale sans transformer la phrase en affirmation catégorique du résultat.
theological_decisions:
- issue: Les paroles rapportées par la femme ajoutent l’interdiction de toucher à celle de manger, contrairement à la formulation de Genèse 2.17.
  choice: Conserver explicitement « et vous n’y toucherez pas » comme faisant partie de ses paroles.
  alternative: Harmoniser le propos avec Genèse 2.17 en supprimant ou en atténuant cette interdiction supplémentaire.
  rationale: Le texte hébreu présente ainsi les paroles de la femme. La traduction doit préserver cette différence narrative et sa tension théologique sans l’expliquer ni l’harmoniser.
- issue: La portée de פֶּן quant à la conséquence de la désobéissance.
  choice: « de peur que vous ne mouriez »
  alternative: « sinon vous mourrez »
  rationale: La formulation choisie préserve la valeur préventive ou redoutée de פֶּן dans le discours rapporté ; l’alternative risquerait de rendre la conséquence plus catégorique que ne le fait cette construction.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur à valeur impérative maintient la force de la défense. « De peur que vous ne mouriez » est légèrement soutenu mais courant dans un registre biblique contemporain ; le « ne » est explétif et ne nie pas le verbe.
