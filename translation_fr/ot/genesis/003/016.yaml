  rationale: La seule révision nécessaire remplace « il te dominera » par « il dominera sur toi ». Cette formulation rend le sens de יִמְשָׁל de manière plus précise et moins chargée, tout en conservant l’énoncé descriptif du texte. Les ancres et les notes restent correctement placées et pertinentes.
