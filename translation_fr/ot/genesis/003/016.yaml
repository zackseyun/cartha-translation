  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: fr
  text: 'À la femme, il dit : « Je multiplierai grandement ta peine et ta conception[a] ; dans la peine, tu mettras au monde des enfants[b]. Ton désir[c] se portera vers ton mari, et lui dominera sur toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta grossesse ». Le terme hébreu peut désigner la conception ou la grossesse.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des fils » ; le mot désigne vraisemblablement ici les enfants ou la descendance en général.
    reason: lexical_alternative
  - marker: c
    text: Ou « aspiration », « élan ». Ce mot hébreu rare peut exprimer le désir au sens large. Certains y voient un désir de maîtriser (voir Genèse 4.7), d’autres une aspiration relationnelle ou sexuelle.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Dans cette scène, le terme désigne la femme en tant que telle ; « mari » convient ensuite à אִישֵׁךְ, où la relation conjugale est explicite.
- source_word: הַרְבָּה אַרְבֶּה
  choice: je multiplierai grandement
  rationale: La construction avec infinitif absolu intensifie le verbe. Cette formulation en restitue l’emphase sans lourdeur excessive.
- source_word: עִצְּבוֹנֵךְ / בְּעֶצֶב
  choice: ta peine / dans la peine
  rationale: « Peine » conserve l’éventail de sens qui comprend souffrance, douleur et pénible épreuve, tout en maintenant le lien lexical entre les deux expressions hébraïques.
- source_word: וְהֵרֹנֵךְ
  choice: ta conception
  rationale: Le nom peut désigner la conception ou la grossesse. « Conception » reste proche de la forme hébraïque et la distingue de l’accouchement mentionné ensuite.
- source_word: תֵּלְדִי בָנִים
  choice: tu mettras au monde des enfants
  rationale: La tournure est naturelle en français. בָנִים signifie littéralement « fils », mais peut désigner ici la descendance ou les enfants en général.
- source_word: אִישֵׁךְ
  choice: ton mari
  rationale: Dans cette relation avec la femme, אִישׁ désigne naturellement son mari plutôt qu’un homme quelconque.
- source_word: תְּשׁוּקָתֵךְ
  choice: ton désir se portera vers
  rationale: Le nom rare exprime un désir ou un élan sans en préciser la nature. La formulation préserve cette ambiguïté.
- source_word: יִמְשָׁל בָּךְ
  choice: il te dominera
  rationale: Le verbe signifie exercer le pouvoir ou la domination. La formulation énonce ce qui arrivera sans transformer cette conséquence en prescription.
theological_decisions:
- issue: Nature du « désir » de la femme envers son mari
  choice: Conserver le terme général « désir » sans en préciser la nature.
  alternative: Désir sexuel ; aspiration relationnelle ; dépendance ; désir de maîtriser, par rapprochement avec Genèse 4.7.
  rationale: Le mot hébreu est rare et le contexte ne permet pas d’imposer avec certitude une seule nuance. La note rend compte des principales lectures sans trancher.
- issue: Valeur descriptive ou prescriptive de la domination du mari
  choice: 'Traduire comme l’annonce descriptive d’une réalité : « il te dominera ».'
  alternative: Y voir une prescription établissant l’autorité masculine.
  rationale: La forme verbale indique ce qui arrivera, non ce qui devrait moralement arriver. La traduction n’ajoute donc aucune prescription doctrinale.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme lexical de « peine » est conservé, tandis que « mettre au monde » rend l’accouchement de façon naturelle. Les notes signalent les ambiguïtés réelles sans imposer une lecture confessionnelle.
