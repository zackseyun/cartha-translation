base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: fr
  text: Ils entendirent le son[a] de Yahweh Dieu, qui marchait dans le jardin à la brise du jour[b]. L’homme[c] et sa femme se cachèrent de la présence de Yahweh Dieu parmi les arbres du jardin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la voix ». Le mot hébreu peut désigner un son ou une voix.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « à la fraîcheur du jour ». Littéralement : « au vent — ou au souffle — du jour ».'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « l’homme » ; autre traduction possible : « Adam ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: bruit
  rationale: Le nom hébreu peut désigner une voix ou un son. Dans ce contexte, puisque le texte ne rapporte aucune parole et rattache le participe « marchant » à Yahweh Dieu, « bruit » est naturel tout en laissant en note l’autre sens possible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Avec יְהוָה, le terme forme l’appellation « Yahweh Dieu ».
- source_word: מִתְהַלֵּךְ
  choice: qui marchait
  rationale: Le participe hitpael décrit un déplacement dans le jardin. Cette formulation conserve l’image anthropomorphique concrète sans l’expliquer ni l’atténuer.
- source_word: לְרוּחַ הַיּוֹם
  choice: à la brise du jour
  rationale: רוּחַ signifie notamment vent, souffle ou esprit. « À la brise du jour » reste proche de l’expression hébraïque et évite de transformer directement la brise en son effet supposé, la fraîcheur.
- source_word: הָאָדָם
  choice: l’homme
  rationale: La présence de « sa femme » favorise ici la désignation de l’individu masculin, tout en maintenant la portée représentative possible du terme.
- source_word: מִפְּנֵי
  choice: loin de la présence de
  rationale: L’expression hébraïque signifie littéralement « de devant la face de ». La formulation française conserve sa dimension relationnelle et spatiale, tandis que « loin de » rend clairement le mouvement de dissimulation.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: parmi les arbres du jardin
  rationale: Le singulier עֵץ peut avoir un sens collectif. Le contexte de la cachette et l’usage français appellent naturellement le pluriel « arbres ».
theological_decisions:
- issue: Présentation anthropomorphique de Dieu marchant dans le jardin
  choice: Conserver « qui marchait »
  alternative: « qui se déplaçait » ou « dont la présence parcourait le jardin »
  rationale: Le récit hébreu donne une image concrète de Dieu en mouvement. La traduction ne doit ni l’allégoriser ni en atténuer la tension théologique.
- issue: Interprétation de הָאָדָם
  choice: « l’homme »
  alternative: « l’être humain » ou « Adam »
  rationale: Dans le contexte immédiat, « sa femme » désigne un individu masculin précis. « L’homme » garde néanmoins une certaine portée représentative et évite de décider que le terme est déjà un nom propre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide pour un lectorat général, tout en préservant le nom divin Yahweh, l’image concrète de Dieu qui marche et les ambiguïtés lexicales importantes au moyen de notes.
