  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: fr
  text: Alors les yeux de tous deux s’ouvrirent, et ils comprirent qu’ils étaient nus. Ils cousirent donc des feuilles de figuier et s’en firent des ceintures[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des pagnes » ou « des tabliers ». Le mot hébreu désigne quelque chose que l’on attache autour de la taille.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: s’ouvrirent
  rationale: Le niphal de פקח décrit ici l’ouverture des yeux. La tournure pronominale est naturelle en français et conserve l’image hébraïque sans préciser la nature de cette perception nouvelle.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: leurs yeux à tous deux
  rationale: Cette formulation garde l’insistance du texte sur les deux personnes tout en restant fluide en français.
- source_word: וַיֵּדְעוּ
  choice: ils comprirent
  rationale: Dans ce contexte, ידע exprime la prise de conscience d’un état. « Comprirent » est plus naturel que « surent » en français tout en évitant d’ajouter explicitement la honte ou une interprétation morale.
- source_word: כִּי
  choice: qu’
  rationale: La conjonction introduit le contenu de leur prise de conscience.
- source_word: עֵירֻמִּם
  choice: nus
  rationale: Équivalent direct de l’adjectif hébreu, qui maintient le lien narratif avec Genèse 2.25.
- source_word: וַיִּתְפְּרוּ
  choice: ils cousirent ensemble
  rationale: « Cousirent » rend directement l’action, tandis que « ensemble » explicite naturellement l’assemblage des feuilles impliqué par le contexte sans ajouter une idée théologique.
- source_word: עֲלֵה תְאֵנָה
  choice: des feuilles de figuier
  rationale: Expression française idiomatique et précise pour le syntagme construit hébreu.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: s’en firent
  rationale: La construction pronominale rend de façon concise et naturelle le sens de « firent pour eux-mêmes », et « en » renvoie aux feuilles.
- source_word: חֲגֹרֹת
  choice: pagnes
  rationale: Le nom désigne des pièces portées ou attachées autour de la taille. « Pagnes » transmet cette fonction plus précisément que le terme général « couvertures », sans imposer la forme particulière d’un tablier.
theological_decisions:
- issue: Rapport entre la connaissance nouvelle, la honte et la conscience morale
  choice: Décrire seulement l’ouverture des yeux, la prise de conscience de la nudité et la confection de pagnes.
  alternative: Ajouter qu’ils eurent honte ou que leur conscience morale s’éveilla.
  rationale: Le verset suggère un changement de perception et prépare le thème de la honte, mais il ne nomme pas explicitement celle-ci et n’en expose pas le mécanisme théologique.
- issue: Degré de précision de חֲגֹרֹת
  choice: pagnes
  alternative: ceintures, tabliers ou vêtements pour se couvrir
  rationale: Le mot indique quelque chose que l’on attache autour de la taille. « Pagnes » communique cette fonction en français actuel, tandis que la note signale les autres possibilités et préserve l’incertitude quant à la forme exacte.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique littéraire sans être archaïque. Aucun vocabulaire explicite de honte, de culpabilité ou d’éveil de la conscience n’est ajouté.
