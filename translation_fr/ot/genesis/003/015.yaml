  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: fr
  text: Je mettrai l’hostilité[a] entre toi et la femme, entre ta descendance et sa descendance[b]. Il t’écrasera la tête[c][d], et toi, tu le blesseras au talon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’inimitié ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ta semence et sa semence ». Le mot hébreu peut désigner collectivement des descendants ou un individu qui les représente.
    reason: lexical_alternative
  - marker: c
    text: Ou « elle t’écrasera la tête », en rapportant le pronom à « la descendance » dans sa valeur collective. Le pronom hébreu est toutefois masculin singulier.
    reason: alternative_reading
  - marker: d
    text: Le même verbe hébreu rare est employé dans les deux propositions. Il peut aussi être rendu par « frapper » ou « meurtrir » ; « écraser » pour la tête et « blesser » pour le talon expriment la différence de gravité suggérée par les parties du corps visées.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: hostilité
  rationale: Le terme désigne une opposition active et durable. « Hostilité » est naturel en français moderne tout en conservant la force relationnelle de l’hébreu ; « inimitié » reste une possibilité plus littéraire.
- source_word: אָשִׁית
  choice: je mettrai
  rationale: Le qal de שׂים signifie couramment « mettre, placer, établir ». « Je mettrai » suit simplement la formulation hébraïque.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: entre toi et la femme
  rationale: Traduction directe de la relation exprimée, avec reprise de « entre » dans le parallélisme suivant.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: ta descendance ... la sienne
  rationale: זֶרַע, littéralement « semence », est ici un nom collectif désignant la descendance. « Descendance » est clair en français moderne et garde ouverte la portée collective, tandis que la note signale aussi la possibilité d’un représentant individuel.
- source_word: הוּא
  choice: lui, il
  rationale: Le pronom hébreu est masculin singulier après le nom collectif זֶרַע. La tournure détachée « Lui, il » rend visible cette forme masculine sans remplacer la descendance par un individu explicitement défini.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: t’écrasera ... le blesseras
  rationale: Le même verbe rare שׁוּף figure dans les deux propositions. Les objets « tête » et « talon » suggèrent cependant une différence de gravité ; la traduction l’exprime, tandis qu’une note rend transparente la répétition du verbe hébreu.
- source_word: רֹאשׁ
  choice: tête
  rationale: Terme anatomique direct, rendu littéralement.
- source_word: עָקֵב
  choice: talon
  rationale: Terme anatomique direct, rendu littéralement.
theological_decisions:
- issue: Conserver les dimensions collective et individuelle possibles de la descendance de la femme
  choice: Traduire זֶרַע par « descendance » dans les deux membres conceptuels, puis rendre le masculin singulier הוּא par « Lui, il »
  alternative: Employer un pluriel collectif (« ses descendants, ils… ») ou identifier explicitement « un descendant »
  rationale: L’hébreu emploie un nom collectif, puis un pronom masculin singulier. La formulation retenue maintient cette tension sans imposer au texte une interprétation messianique explicite ni effacer la possibilité d’un représentant individuel.
- issue: Déterminer la force de שׁוּף dans chaque proposition
  choice: Employer « écrasera » pour la tête et « blesseras » pour le talon
  alternative: Employer le même verbe, par exemple « frapper », dans les deux propositions
  rationale: Le verbe hébreu est identique et rare dans les deux cas, mais les parties du corps visées impliquent naturellement des conséquences différentes. La note conserve l’information lexicale sans gommer l’asymétrie tête-talon.
translation_notes:
  register: Français international moderne, naturel et digne. « Hostilité » est plus immédiatement intelligible qu’« inimitié ». « Descendance » évite l’ambiguïté moderne de « semence », tout en conservant sa valeur collective ; la reprise masculine « Lui, il » est volontairement marquée afin de refléter le pronom hébreu et son ambiguïté interprétative.
