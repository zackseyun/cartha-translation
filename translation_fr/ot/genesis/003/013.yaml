base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: fr
  text: 'Alors Yahweh Dieu dit à la femme : « Qu’est-ce que tu as fait ? » La femme répondit : « Le serpent m’a trompée[a], et j’ai mangé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a induite en erreur ».'
    reason: Alternative lexicale reflétant l’étendue de sens du verbe hébreu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit « Yahweh » plutôt que remplacé par un titre comme « le Seigneur », afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans l’expression יְהוָה אֱלֹהִים, « Yahweh Dieu » conserve à la fois le nom divin et la désignation אֱלֹהִים dans un français clair.
- source_word: לָאִשָּׁה
  choice: à la femme
  rationale: אִשָּׁה peut désigner une femme ou une épouse. Ici, « la femme » correspond à la désignation narrative immédiate sans mettre au premier plan la nuance conjugale.
- source_word: מַה זֹּאת עָשִׂית
  choice: Qu’est-ce que tu as fait là ?
  rationale: Cette formulation française naturelle conserve la force de מַה ainsi que la nuance démonstrative de זֹאת grâce à « là », sans transformer la question en « Pourquoi as-tu fait cela ? ».
- source_word: הַנָּחָשׁ
  choice: le serpent
  rationale: « Serpent » est précis, naturel dans ce récit et en préserve la portée littéraire, contrairement au terme plus ordinaire « serpent » n’ayant ici pas besoin d’être remplacé par une désignation zoologique différente.
- source_word: הִשִּׁיאַנִי
  choice: m’a trompée
  rationale: Le verbe exprime le fait d’induire en erreur ou de tromper. « M’a trompée » est moderne, clair et conserve la force morale et narrative de l’hébreu.
- source_word: וָאֹכֵל
  choice: et j’ai mangé
  rationale: La coordination simple respecte la succession exprimée par l’hébreu sans ajouter explicitement une relation causale comme le ferait « alors j’ai mangé ».
theological_decisions:
- issue: Sens de l’action attribuée au serpent
  choice: Le serpent m’a trompée
  alternative: Le serpent m’a induite en erreur
  rationale: « Trompée » rend directement l’idée de méprise provoquée par le serpent, sans introduire une nuance de séduction ni préciser davantage la nature de la tromperie que ne le fait l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier. « Qu’est-ce que tu as fait là ? » garde l’intensité de la question hébraïque tout en restant idiomatique.
