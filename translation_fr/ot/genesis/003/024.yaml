base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: fr
  text: Il chassa l’homme, puis il posta à l’est du jardin d’Éden les chérubins et la flamme de l’épée qui tournoie en tous sens[a], pour garder le chemin de l’arbre de la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « l’épée flamboyante qui tournoie ». L’hébreu dit plus littéralement : « la flamme de l’épée qui se retourne », expression pouvant évoquer un mouvement dans toutes les directions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: Il chassa
  rationale: Le verbe גרשׁ exprime une expulsion énergique. « Chassa » en conserve la force sans ajouter la nuance juridique de « bannit ».
- source_word: הָאָדָם
  choice: l’homme
  rationale: Dans ce contexte narratif, אָדָם désigne l’individu précédemment formé et placé dans le jardin, non l’humanité prise collectivement.
- source_word: וַיַּשְׁכֵּן
  choice: il posta
  rationale: Le hiphil de שכן signifie ici faire demeurer ou installer à un endroit. « Posta » convient naturellement à la fonction de garde indiquée ensuite.
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: à l’est du jardin d’Éden
  rationale: Dans ce contexte spatial, l’expression situe les gardiens du côté oriental, ou devant la façade orientale, du jardin.
- source_word: הַכְּרֻבִים
  choice: les chérubins
  rationale: « Chérubins » est le terme biblique français établi pour ces êtres célestes et respecte le pluriel hébreu.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: la flamme de l’épée qui tournoie en tous sens
  rationale: Cette formulation conserve le substantif לַהַט, « flamme », et rend le participe réfléchi ou mobile הַמִּתְהַפֶּכֶת sans le réduire à l’expression traditionnelle « épée flamboyante ».
- source_word: לִשְׁמֹר
  choice: pour garder
  rationale: Dans ce contexte d’accès interdit, שׁמר exprime directement l’action de garder ou de surveiller.
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: le chemin de l’arbre de la vie
  rationale: Le français permet de conserver la relation formelle « chemin de » tout en laissant entendre le chemin qui mène à l’arbre.
theological_decisions:
- issue: Sens de אָדָם dans le récit
  choice: l’homme
  alternative: l’être humain ; l’humanité
  rationale: Le référent immédiat est l’individu expulsé du jardin. La traduction personnelle au singulier correspond donc au contexte sans généraliser à toute l’humanité.
- issue: Nature de לַהַט הַחֶרֶב
  choice: la flamme de l’épée
  alternative: l’épée flamboyante ; l’éclair de l’épée
  rationale: Le texte hébreu distingue formellement la « flamme » et « l’épée ». La traduction retenue préserve cette image inhabituelle et son ambiguïté plutôt que de l’harmoniser avec la formulation traditionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. « Éden » porte l’accent usuel en français. La syntaxe reste fluide tout en préservant l’image singulière de la flamme de l’épée.
