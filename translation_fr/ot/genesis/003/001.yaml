id: GEN.3.1
reference: Genesis 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: fr
  text: 'Le serpent était plus rusé[a] que tous les animaux des champs que Yahweh Dieu avait faits. Il dit à la femme : « Dieu a-t-il vraiment dit[b] : “Vous ne mangerez d’aucun arbre du jardin”[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus avisé » ou « plus subtil ». Le mot hébreu peut désigner la prudence dans d’autres contextes, mais il prend ici une nuance trompeuse.
    reason: lexical_alternative
  - marker: b
    text: Le narrateur dit « Yahweh Dieu », tandis que le serpent dit seulement « Dieu »; la traduction conserve ce changement de désignation présent en hébreu.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement, on peut aussi traduire : « de tout arbre du jardin ». Dans cette question négative, « d’aucun arbre » exprime naturellement l’exagération du commandement de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: Le serpent
  rationale: Le nom défini est rendu directement. Le וְ assure la continuité narrative, que le français peut exprimer naturellement sans ajouter « Or » ou « Maintenant ».
- source_word: עָרוּם מִכֹּל
  choice: plus rusé que tous
  rationale: עָרוּם peut désigner la prudence ou la finesse, mais la parole trompeuse qui suit donne ici à « rusé » une nuance inquiétante. מִכֹּל marque la comparaison.
- source_word: חַיַּת הַשָּׂדֶה
  choice: les animaux des champs
  rationale: Cette expression désigne les animaux terrestres associés aux espaces non cultivés. « Animaux des champs » reste proche de l’hébreu tout en étant intelligible en français moderne.
- source_word: אֲשֶׁר עָשָׂה
  choice: que ... avait faits
  rationale: Le plus-que-parfait situe naturellement cet acte créateur avant la scène racontée; le participe s’accorde avec l’antécédent pluriel placé avant l’auxiliaire.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Le nom divin personnel et le titre אֱלֹהִים sont tous deux conservés, conformément à leur association dans le texte hébreu.
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: Il dit à la femme
  rationale: Le pronom renvoie sans ambiguïté au serpent. « La femme » préserve la désignation du récit sans anticiper le nom Ève.
- source_word: אַף כִּי אָמַר
  choice: a-t-il vraiment dit
  rationale: Cette formulation française rend la question insinuante introduite par אַף כִּי sans transformer celle-ci en affirmation.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le serpent emploie seulement אֱלֹהִים, contrairement au narrateur qui vient de dire « Yahweh Dieu »; cette différence est maintenue.
- source_word: לֹא תֹאכְלוּ
  choice: Vous ne mangerez
  rationale: Le futur français rend avec dignité la prohibition citée et conserve la deuxième personne du pluriel de l’hébreu.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: d’aucun arbre du jardin
  rationale: Sous la négation, « aucun » exprime naturellement la portée de כֹּל et fait ressortir l’exagération insinuée par la question du serpent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel יהוה. « Yahweh » le représente directement et permet aussi de percevoir son absence dans les paroles du serpent.
- issue: Valeur morale de עָרוּם
  choice: rusé
  alternative: avisé / subtil
  rationale: Le terme hébreu peut être favorable ou défavorable selon le contexte. Ici, la question qui suit lui confère une nuance trompeuse, sans que la traduction ajoute une identification théologique absente du verset.
- issue: Portée de la question du serpent
  choice: d’aucun arbre du jardin
  alternative: de tout arbre du jardin
  rationale: La construction hébraïque sous négation peut être représentée formellement par « de tout arbre », mais « d’aucun arbre » communique plus clairement en français la prétention selon laquelle Dieu aurait interdit tous les arbres.
translation_notes:
  register: Français international actuel, narratif et digne. La syntaxe reste fluide pour une lecture publique; le nom divin, le pluriel adressé au couple et la formulation insinuante de la question sont conservés.
