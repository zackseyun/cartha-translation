source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר הָֽ/אִשָּׁ֖ה אֶל הַ/נָּחָ֑שׁ מִ/פְּרִ֥י עֵֽץ הַ/גָּ֖ן נֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: fr
  text: 'La femme répondit au serpent : « Nous pouvons manger du fruit des arbres du jardin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: répondit
  rationale: Le verbe signifie littéralement « dit », mais, dans cet échange, le français naturel emploie « répondit ». Le waw narratif fait progresser le récit sans exiger ici un « et » explicite.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le nom désigne ici le personnage féminin, sans mettre spécialement l’accent sur son statut d’épouse.
- source_word: הַנָּחָשׁ
  choice: le serpent
  rationale: « Serpent » rend נָחָשׁ dans un registre narratif digne et courant, sans modifier le référent.
- source_word: מִפְּרִי
  choice: du fruit
  rationale: Dans cette construction, le français idiomatique « manger du fruit » exprime naturellement la consommation d’une partie du fruit disponible; un calque avec « depuis/de » serait maladroit.
- source_word: עֵץ הַגָּן
  choice: des arbres du jardin
  rationale: Bien que עֵץ soit morphologiquement au singulier, il a ici une valeur collective ou distributive. Le pluriel français évite de suggérer qu’un seul arbre est concerné.
- source_word: נֹאכֵל
  choice: nous pouvons manger
  rationale: Dans le contexte de l’autorisation donnée en Genèse 2.16, l’imparfait exprime ce qui est permis. « Pouvons » transmet naturellement cette permission en français.
theological_decisions:
- issue: Étendue des arbres dont le fruit est permis
  choice: « du fruit des arbres du jardin »
  alternative: « du fruit de l’arbre du jardin »
  rationale: Le singulier hébreu עֵץ peut avoir ici une portée collective ou distributive. Le contexte de Genèse 2.16 et l’exception introduite au verset suivant indiquent une permission générale, sans qu’il soit nécessaire de restreindre la phrase à un seul arbre.
translation_notes:
  register: Français international moderne, naturel et digne. « Répondit » rend explicitement la fonction dialogique de וַתֹּאמֶר; la ponctuation française introduit directement la parole, qui se poursuit au verset suivant.
