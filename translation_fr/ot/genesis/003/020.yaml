source:
  edition: WLC
  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: fr
  text: L’homme donna à sa femme le nom d’Ève[a], parce qu’elle fut la mère de tous les vivants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom « Ève » (hébreu Ḥawwâ) évoque en hébreu le fait de vivre.
    reason: wordplay
  - marker: b
    text: 'Littéralement : « la mère de tout vivant ». On peut aussi comprendre : « la mère de tous les êtres vivants » ou « la mère de quiconque vit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: donna… le nom
  rationale: Dans cette formule de dénomination, le qal wayyiqtol de קרא signifie que l’homme attribue un nom. « Donna… le nom » est idiomatique en français moderne et reste proche de la construction hébraïque.
- source_word: הָאָדָם
  choice: L’homme
  rationale: Le nom אָדָם porte ici l’article défini; la valeur descriptive « l’homme » est donc préférable au nom propre « Adam », sans nier qu’il s’agit du personnage déjà présenté.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Dans ce contexte, אִשָּׁה désigne l’épouse de l’homme. « Sa femme » est la formulation française naturelle et précise.
- source_word: חַוָּה
  choice: Ève
  rationale: « Ève » est la forme française traditionnelle et établie du nom hébreu חַוָּה.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la raison donnée au choix du nom; « parce que » en exprime clairement la valeur causale.
- source_word: הָיְתָה
  choice: fut
  rationale: Le verbe היה exprime ici l’état ou le rôle attribué à Ève. Le passé simple « fut » convient au registre narratif biblique sans suggérer nécessairement une transformation.
- source_word: אֵם כָּל חָי
  choice: la mère de tous les vivants
  rationale: Cette formulation conserve l’expression hébraïque concise, où חָי est substantivé, et maintient ouverte la portée exacte de « tous les vivants ».
theological_decisions:
- issue: Valeur descriptive ou nom propre de הָאָדָם
  choice: L’homme
  alternative: Adam
  rationale: La présence de l’article défini favorise nettement la lecture descriptive « l’homme ». La traduction préserve cette nuance grammaticale plutôt que d’anticiper l’emploi non ambigu du nom propre.
- issue: Portée de « mère de tous les vivants »
  choice: Conserver la formule large sans en préciser la portée
  alternative: mère de tous les êtres vivants / mère de tous les humains
  rationale: L’hébreu ne précise pas explicitement la catégorie visée. La traduction maintient donc l’ambiguïté et évite de trancher entre une portée humaine et une formulation plus générale.
translation_notes:
  register: Français international moderne, naturel et digne. La formule « donna à sa femme le nom de » évite le calque peu idiomatique « appela le nom de sa femme ». Le passé simple s’accorde avec le registre narratif du contexte.
