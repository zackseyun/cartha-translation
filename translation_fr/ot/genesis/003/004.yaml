source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/נָּחָ֖שׁ אֶל הָֽ/אִשָּׁ֑ה לֹֽא מ֖וֹת תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: fr
  text: 'Mais le serpent dit à la femme : « Vous ne mourrez absolument pas[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie une construction emphatique, littéralement proche de « mourir, vous ne mourrez pas » ; le verbe est au pluriel.
    reason: Précision sur l’emphase et le nombre grammatical de l’expression hébraïque.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais … dit
  rationale: 'Le waw narratif fait progresser le récit, tandis que le contexte donne ici à l’enchaînement une valeur adversative : le serpent contredit directement l’avertissement divin précédent.'
- source_word: הַנָּחָשׁ
  choice: le serpent
  rationale: « Serpent » est le terme français traditionnel et toujours courant dans ce récit ; il conserve sa portée littéraire sans ajouter d’identification interprétative.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: אִשָּׁה peut désigner une femme ou une épouse. Ici, « la femme » respecte la désignation récurrente du personnage dans le récit avant qu’elle reçoive le nom d’Ève.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: Vous ne mourrez absolument pas
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation verbale. Sous la négation, l’ensemble exprime un démenti catégorique. « Absolument pas » place clairement l’emphase sur le refus de la mort et évite l’ambiguïté possible de « pas certainement ».
theological_decisions:
- issue: Portée du démenti du serpent
  choice: 'Un démenti catégorique : « Vous ne mourrez absolument pas. »'
  alternative: « Vous ne mourrez pas » ou « Vous ne mourrez certainement pas »
  rationale: La formulation conserve la force emphatique de l’hébreu et la contradiction frontale avec Genèse 2.17, sans trancher par une explication ajoutée la tension entre mort immédiate et mort ultérieure.
- issue: Nombre grammatical de l’interlocuteur
  choice: Maintien de « vous », compatible avec le pluriel hébreu
  alternative: 'Tutoiement singulier : « Tu ne mourras absolument pas »'
  rationale: תְּמֻתוּן est à la deuxième personne du masculin pluriel, bien que le serpent parle à la femme. Le français « vous » permet de préserver ce nombre sans préciser de manière interprétative qui d’autre est inclus.
translation_notes:
  register: Français international moderne, sobre et narratif. « Absolument pas » est courant, ferme et non ambigu ; il restitue le caractère catégorique de la réplique sans archaïsme.
