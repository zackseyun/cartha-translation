  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: fr
  text: 'Alors Yahvé Dieu dit : « Voici que l’homme est devenu comme l’un de nous[a], connaissant le bien et le mal. Et maintenant, de peur qu’il ne tende la main, ne prenne aussi de l’arbre de la vie, n’en mange et ne vive pour toujours — »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pluriel « nous » traduit littéralement l’hébreu. Il est diversement compris comme une allusion au conseil divin, un pluriel de délibération ou une préfiguration d’une pluralité en Dieu.
    reason: Préserver et signaler l’ambiguïté théologique du pronom pluriel.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahvé Dieu
  rationale: « Yahvé » est la forme française courante du nom divin, et « Dieu » rend אֱלֹהִים en apposition.
- source_word: הֵן
  choice: Voici que
  rationale: Cette tournure conserve la force présentative et solennelle de l’interjection hébraïque tout en restant naturelle en français.
- source_word: הָאָדָם
  choice: l’homme
  rationale: Le contexte désigne ici l’être humain individuel dont il vient d’être question, plutôt que l’humanité prise collectivement.
- source_word: הָיָה
  choice: est devenu
  rationale: Le parfait décrit un changement ayant abouti à l’état présent de l’homme.
- source_word: כְּאַחַד מִמֶּנּוּ
  choice: comme l’un de nous
  rationale: Rend directement la comparaison et maintient sans l’expliquer le pronom pluriel du texte hébreu.
- source_word: לָדַעַת טוֹב וָרָע
  choice: connaissant le bien et le mal
  rationale: Le participe français exprime naturellement la caractérisation ou le résultat introduit par l’infinitif hébreu, sans réduire la portée de la formule.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette construction française rend clairement la proposition préventive et son caractère redouté.
- source_word: יִשְׁלַח יָדוֹ
  choice: tende la main
  rationale: Expression française idiomatique qui conserve l’image concrète de l’hébreu.
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: ne prenne aussi du fruit de l’arbre de la vie
  rationale: L’ajout explicatif de « fruit » rend en français l’objet implicite que l’on prend d’un arbre, tandis que « aussi » préserve la valeur additive de גַּם.
- source_word: וְאָכַל וָחַי לְעֹלָם
  choice: n’en mange et ne vive pour toujours
  rationale: « En » reprend naturellement le fruit de l’arbre, et « pour toujours » rend la durée indéfinie de לְעֹלָם.
theological_decisions:
- issue: Le pluriel dans « comme l’un de nous »
  choice: Maintenir « nous » sans développement interprétatif.
  alternative: Conseil divin, pluriel de délibération ou annonce voilée d’une pluralité intradivine.
  rationale: L’hébreu emploie explicitement la première personne du pluriel. La traduction conserve cette tension théologique sans trancher entre les principales interprétations.
- issue: La fin brusquement suspendue de la parole divine
  choice: Conserver la proposition inachevée au moyen d’un tiret.
  alternative: Achever explicitement la conséquence sous-entendue.
  rationale: Le texte hébreu interrompt la proposition préventive avant que le verset suivant ne rapporte l’action de Dieu. Le tiret préserve cette suspension sans ajouter d’apodose.
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « de peur que… ne » donne à la parole divine une solennité mesurée sans archaïsme excessif. Le tiret final maintient l’interruption syntaxique du texte source.
