source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: fr
  text: 'Alors Yahweh Dieu appela l’homme et lui dit : « Où es-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Le qatal narratif avec waw fait avancer le récit. « Appela » rend naturellement קרא sans renforcer indûment le sens en « interpella » ou « convoqua ».
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Le texte porte directement le nom divin יהוה, ici translittéré « Yahweh », suivi de אֱלֹהִים, rendu par « Dieu ».
- source_word: אֶל־הָאָדָם
  choice: l’homme
  rationale: Dans cette scène, הָאָדָם désigne l’homme particulier auquel Dieu s’adresse, et non l’humanité en général. En français, le complément indirect est naturellement intégré au verbe « appeler ».
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: Cette formulation conserve explicitement le pronom לוֹ et reste idiomatique en français.
- source_word: אַיֶּכָּה
  choice: Où es-tu ?
  rationale: L’interrogatif אַיֵּה avec suffixe masculin singulier de deuxième personne exprime directement une question sur le lieu où se trouve l’interlocuteur.
- source_word: וַ
  choice: Alors
  rationale: À l’ouverture du verset, « Alors » marque avec naturel la progression séquentielle du récit portée par le waw narratif.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom propre présent dans le texte hébreu et évite de le remplacer silencieusement par un titre.
- issue: Référent de הָאָדָם
  choice: l’homme
  alternative: l’être humain
  rationale: Le contexte immédiat présente un individu masculin précis auquel Dieu s’adresse; « l’homme » conserve cette référence sans généraliser à toute l’humanité.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe demeure proche de l’hébreu tout en évitant une coordination initiale artificielle et les lourdeurs non idiomatiques.
