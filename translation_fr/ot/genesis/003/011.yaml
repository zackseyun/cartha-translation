base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: fr
  text: 'Il dit : « Qui t’a dit que tu étais nu ? As-tu mangé de l’arbre dont je t’avais ordonné de ne pas manger ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « de lui », c’est-à-dire « de l’arbre », après « manger ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol fait avancer le récit. En français narratif, le passé simple est naturel et conserve le sujet masculin singulier implicite sans ajouter « Dieu ».
- source_word: מִי הִגִּיד לְךָ
  choice: Qui t’a appris
  rationale: Le hiphil de נגד signifie faire savoir, annoncer ou dire. « T’a appris » exprime naturellement ici la révélation d’une information, sans suggérer un enseignement prolongé.
- source_word: כִּי עֵירֹם אָתָּה
  choice: que tu étais nu
  rationale: La proposition donne le contenu de ce qui aurait été appris. L’imparfait français s’accorde naturellement avec le verbe introducteur au passé; עֵירֹם désigne l’état de nudité.
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  choice: As-tu mangé de l’arbre
  rationale: La particule interrogative introduit une question fermée. Le passé composé convient à un acte achevé ayant une portée immédiate; « manger de l’arbre » rend idiomatiquement מן avec l’arbre comme source.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: dont je t’avais ordonné de ne pas manger
  rationale: « Dont » reprend naturellement la relation exprimée par מִמֶּנּוּ. Le plus-que-parfait situe l’ordre avant l’acte interrogé, tandis que « ordonner de ne pas manger » rend la construction prohibitive לְבִלְתִּי avec l’infinitif.
theological_decisions:
- issue: Identification du sujet masculin singulier
  choice: Il dit
  alternative: Le SEIGNEUR Dieu dit
  rationale: Le verset porte seulement un verbe à la troisième personne du masculin singulier; le contexte identifie Dieu, mais son nom n’est pas répété dans cette proposition. La traduction ne l’ajoute donc pas.
- issue: Nature de la question divine
  choice: Conserver une question directe sans expliciter son intention
  alternative: Formuler la question comme une accusation ou une demande rhétorique explicite
  rationale: L’hébreu demande littéralement si l’homme a mangé de l’arbre. La traduction préserve la tension narrative sans préciser si la question vise l’information, l’aveu ou la mise en accusation.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple est réservé à l’avancée narrative; le dialogue emploie des temps usuels. La formulation évite d’ajouter le nom divin absent du verset et conserve la force interrogative de l’hébreu.
