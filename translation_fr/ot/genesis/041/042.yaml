  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: fr
  text: Alors le pharaon retira de sa main son anneau à cachet[a] et le passa au doigt de Joseph. Il le revêtit d’habits de fin lin[b] et lui mit au cou un collier d’or[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son anneau ». Le mot hébreu peut désigner un anneau en général, mais, dans ce contexte royal, il s’agit probablement de l’anneau à cachet du pharaon, symbole de l’autorité qu’il délègue.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu désigne un lin de grande qualité, associé à la richesse et à l’honneur.
    reason: cultural_note
  - marker: c
    text: Ou « une chaîne d’or » ou « un large collier d’or ». La forme exacte de l’ornement de cou désigné par le terme hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: retira
  rationale: Le verbe signifie enlever ou retirer; « retira » convient naturellement au geste par lequel le pharaon ôte son anneau.
- source_word: טַבַּעְתּוֹ
  choice: son anneau à cachet
  rationale: Le nom peut désigner un anneau en général, mais le contexte royal et administratif indique vraisemblablement un anneau servant à authentifier les actes et à déléguer l’autorité.
- source_word: מֵעַל יָדוֹ
  choice: de sa main
  rationale: Cette formulation française restitue simplement l’indication spatiale de l’hébreu.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: et le passa au doigt de Joseph
  rationale: Littéralement, le pharaon le met « sur la main » de Joseph. En français, pour un anneau, « passer au doigt » exprime naturellement ce geste sans suggérer une simple remise en main.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: Il le revêtit
  rationale: « Revêtit » garde la solennité de cette scène d’investiture tout en restant intelligible.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: d’habits de fin lin
  rationale: שֵׁשׁ désigne un lin de grande qualité, associé ici au rang, à la richesse et à l’honneur.
- source_word: רְבִד הַזָּהָב
  choice: un collier d’or
  rationale: Le terme désigne un ornement porté au cou, dont la forme précise est incertaine; « collier » est naturel et suffisamment général.
- source_word: עַל צַוָּארוֹ
  choice: lui mit au cou
  rationale: Cette tournure idiomatique rend l’hébreu « sur son cou » dans le contexte d’un bijou.
