base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: fr
  text: Le pharaon s’est mis en colère contre ses serviteurs et m’a fait mettre en détention[a] dans la maison du chef de la garde[b], moi ainsi que le chef des boulangers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous bonne garde » ; le terme hébreu désigne une détention surveillée, sans nécessairement faire référence à une prison au sens formel.
    reason: lexical_alternative
  - marker: b
    text: Le titre rendu par « chef de la garde » signifie plus littéralement « chef des exécuteurs » ou « chef des hommes chargés de tuer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: s’était mis en colère
  rationale: Le verbe exprime la colère. Cette formulation française est naturelle et ne précise pas une intensité supérieure à celle qu’impose le texte.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte de cour, il s’agit de personnes au service du pharaon. « Serviteurs » conserve le rapport exprimé par עבד sans imposer ici « esclaves » ni réduire leur rôle à celui de simples « fonctionnaires ».
- source_word: בְּמִשְׁמַר
  choice: en détention
  rationale: Le nom désigne le fait d’être gardé ou détenu, sans exiger l’idée d’un bâtiment pénitentiaire formel.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: dans la maison du chef de la garde
  rationale: Cette expression désigne, dans le récit de Joseph, la résidence ou les locaux de l’officier responsable de la garde royale. Le titre hébreu peut se comprendre plus littéralement comme « chef des exécuteurs ».
- source_word: שַׂר הָאֹפִים
  choice: le chef des boulangers
  rationale: La construction désigne celui qui dirige les boulangers; cette traduction est claire et idiomatique en français.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: moi ainsi que le chef des boulangers
  rationale: Cette tournure conserve la reprise emphatique de « moi » dans l’hébreu tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. Le plus-que-parfait situe naturellement ces faits antérieurs dans le récit rétrospectif du serviteur. La répétition « moi » préserve l’accent de l’hébreu sans lourdeur excessive.
