  text: וְ/לֹֽא יִוָּדַ֤ע הַ/שָּׂבָע֙ בָּ/אָ֔רֶץ מִ/פְּנֵ֛י הָ/רָעָ֥ב הַ/ה֖וּא אַחֲרֵי כֵ֑ן כִּֽי כָבֵ֥ד ה֖וּא מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: fr
  text: L’abondance ne sera plus reconnue dans le pays à cause de cette famine qui suivra, car elle sera très grave.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִוָּדַע
  choice: ne se remarquera plus
  rationale: Le niphal de ידע peut signifier « être connu, reconnu, remarqué ». Dans ce contexte, l’idée est que l’abondance antérieure ne sera plus perceptible sous l’effet de la famine. La tournure pronominale est naturelle en français et « plus » explicite la disparition de cette abondance après une période où elle était manifeste.
- source_word: הַשָּׂבָע
  choice: l’abondance
  rationale: Le nom désigne ici l’abondance des récoltes et des vivres durant les années précédentes. « L’abondance » convient au contexte agricole et économique sans ajouter « années », absent de ce verset.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans le contexte de Genèse 41, אֶרֶץ renvoie au territoire concerné, notamment l’Égypte, plutôt qu’à la terre entière.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: 'La préposition exprime ici la cause : la famine rendra l’abondance antérieure imperceptible.'
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: la famine qui viendra ensuite
  rationale: Cette formulation française naturelle conserve la référence à la famine annoncée et la succession temporelle exprimée par אַחֲרֵי כֵן.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: car elle sera extrêmement sévère
  rationale: כבד signifie littéralement « lourd », mais qualifie idiomatiquement une famine accablante ou sévère. « Extrêmement » rend la forte intensité de מְאֹד.
