id: GEN.41.16
reference: Genesis 41:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּ֨עַן יוֹסֵ֧ף אֶת פַּרְעֹ֛ה לֵ/אמֹ֖ר בִּלְעָדָ֑/י אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת שְׁל֥וֹם פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: fr
  text: 'Joseph répondit à Pharaon : « Ce n’est pas moi ! Dieu donnera à Pharaon une réponse favorable.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu répondra au sujet du bien-être de Pharaon ». Le mot traduit par « favorable » peut aussi signifier la paix, le bien-être ou une heureuse issue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Le verbe ענה introduit ici la réponse directe de Joseph dans le récit ; « répondit » est la tournure française habituelle.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: אֶת־פַּרְעֹה
  choice: à Pharaon
  rationale: Le marqueur d’objet accompagne ici la personne à laquelle Joseph répond ; en français, « répondre à Pharaon » est idiomatique.
- source_word: לֵאמֹר
  choice: ponctuation introduisant le discours direct
  rationale: La formule hébraïque « en disant » est naturellement représentée en français par les deux-points, sans lourdeur inutile.
- source_word: בִּלְעָדָי
  choice: Ce n’est pas moi !
  rationale: Cette formulation concise exprime l’exclusion de Joseph comme source de l’interprétation et prépare clairement le contraste avec Dieu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est ici sujet d’un verbe au singulier et désigne Dieu comme source de la réponse.
- source_word: יַעֲנֶה
  choice: donnera … une réponse
  rationale: Cette formulation française naturelle explicite la valeur transitive de l’expression hébraïque tout en conservant le lien sémantique avec « répondit ».
- source_word: אֶת־שְׁלוֹם פַּרְעֹה
  choice: à Pharaon une réponse favorable
  rationale: Dans cette construction, שָׁלוֹם évoque la paix, le bien-être ou une issue favorable. La formulation retenue est naturelle, tout en signalant en note l’autre compréhension possible.
theological_decisions:
- issue: Origine de l’interprétation
  choice: Joseph nie être lui-même la source de la réponse et l’attribue à Dieu.
  alternative: « En dehors de moi, Dieu répondra… »
  rationale: Le contraste entre בִּלְעָדָי et אֱלֹהִים est explicite dans le texte ; la traduction le maintient sans ajouter d’explication doctrinale.
- issue: Portée de שְׁלוֹם appliqué à la réponse divine
  choice: une réponse favorable
  alternative: une réponse concernant le bien-être de Pharaon
  rationale: Le nom שָׁלוֹם peut qualifier la réponse comme favorable ou renvoyer au bien-être de Pharaon. Le texte principal adopte la lecture française la plus naturelle, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, simple et digne. L’exclamation rend la brièveté énergique de בִּלְעָדָי, tandis que les deux-points remplacent naturellement la formule hébraïque « en disant ».
