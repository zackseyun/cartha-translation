  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: fr
  text: Les épis grêles engloutirent les sept beaux épis[a]. J’en parlai alors aux magiciens[b], mais personne ne put m’en donner l’explication[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les sept bons épis ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu traduit par « magiciens » désigne des spécialistes rituels égyptiens, qui pouvaient notamment interpréter les rêves et les signes.
    reason: cultural_note
  - marker: c
    text: 'Ou : « mais personne ne put l’interpréter pour moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: engloutirent
  rationale: Le verbe בלע décrit de façon saisissante les épis qui en avalent d’autres dans le rêve. « Engloutirent » conserve cette image tout en étant naturel en français.
- source_word: שִׁבֳּלִים
  choice: épis
  rationale: Dans ce contexte agricole, שִׁבֳּלִים désigne les épis de céréale. « Épis » est précis, courant et concis.
- source_word: הַדַּקֹּת
  choice: maigres
  rationale: L’adjectif signifie « minces » ou « grêles ». Appliqué à des épis et en contraste avec les beaux épis, « maigres » restitue naturellement leur aspect peu fourni sans surcharger le texte.
- source_word: הַטֹּבוֹת
  choice: beaux
  rationale: טוֹב signifie largement « bon ». Pour des épis bien formés, le français idiomatique dit volontiers « de beaux épis » ; ce choix garde l’évaluation positive du texte sans expliciter davantage par « pleins » ou « sains ».
- source_word: וָאֹמַר אֶל
  choice: J’en parlai alors aux
  rationale: L’hébreu dit littéralement « je dis aux ». Le contexte implique que Pharaon rapporta son rêve. « J’en parlai » rend cette relation implicite sans introduire un objet lourd, et « alors » marque naturellement la succession narrative.
- source_word: הַחַרְטֻמִּים
  choice: magiciens
  rationale: Le terme désigne les spécialistes rituels égyptiens, notamment associés à l’interprétation des rêves et des signes. « Magiciens » est la désignation française traditionnelle et concise, précisée par une note culturelle.
- source_word: וְאֵין מַגִּיד לִי
  choice: mais personne ne put m’en donner l’explication
  rationale: Le participe de נגד exprime ici le fait de faire connaître le sens du rêve. Cette formulation française rend clairement l’échec des spécialistes tout en laissant en note l’autre traduction directe, « l’interpréter pour moi ».
