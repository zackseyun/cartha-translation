  terminology: « Magiciens » est un équivalent usuel de חַרְטֻמִּים; la note culturelle utile le situe comme spécialistes rituels égyptiens sans réduire indûment le terme à la magie de spectacle. La note doit éviter de présenter comme certaine une fonction institutionnelle précise (« chargés de ») que le mot seul n’établit pas.
