source:
  edition: WLC
  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: fr
  text: 'Il y avait là avec nous un jeune Hébreu, esclave du chef des gardes[a]. Nous lui avons raconté nos rêves, et il nous les a interprétés : il a donné à chacun l’interprétation correspondant à son rêve[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se rendre par « chef des exécuteurs » ou « chef de la garde personnelle ».
    reason: Le titre égyptien שַׂר הַטַּבָּחִים est littéralement lié à ceux qui abattent ou exécutent, mais sa fonction exacte peut être comprise de plusieurs manières.
  - marker: b
    text: 'Plus littéralement : « il interpréta pour chacun selon son rêve ».'
    reason: La formulation hébraïque est concise et distributive; la note en préserve la structure sans imposer au texte principal une tournure peu naturelle en français.
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: un jeune Hébreu
  rationale: נַעַר désigne ici un jeune homme, tandis que עִבְרִי est l’appellation ethnique habituelle. « Un jeune Hébreu » est naturel en français et n’évoque pas un enfant.
- source_word: עֶבֶד
  choice: esclave
  rationale: Le terme indique ici une condition de dépendance et d’appartenance à un maître; « esclave » en rend plus nettement la portée que « serviteur ».
- source_word: שַׂר הַטַּבָּחִים
  choice: chef des gardes
  rationale: Dans ce contexte de cour égyptienne, l’expression fonctionne comme un titre officiel. « Chef des gardes » est clair et traditionnel, tout en évitant le littéralisme trompeur « chef des bouchers ».
- source_word: וַנְּסַפֶּר לוֹ
  choice: nous lui avons raconté nos rêves
  rationale: Le complément « nos rêves », explicité par la suite immédiate, est intégré en français pour éviter l’expression incomplète « nous lui avons raconté ».
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: il nous les a interprétés
  rationale: Dans le contexte des rêves, פתר signifie « interpréter ». Le pronom « les » reprend naturellement « nos rêves ».
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: il a donné à chacun l’interprétation correspondant à son rêve
  rationale: Cette formulation conserve la valeur distributive de אִישׁ et le rapport entre chaque rêve et son interprétation, sans reproduire une tournure hébraïque obscure ou lourdement répétitive.
