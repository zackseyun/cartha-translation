  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: fr
  text: 'Joseph dit alors à Pharaon : « Les rêves de Pharaon ne font qu’un[a] : ce que Dieu fait[b], il l’a annoncé à Pharaon. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le rêve de Pharaon est un. » En contexte, Joseph présente les deux rêves de Pharaon comme un tout porteur d’un seul message.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce que Dieu va faire » ou « ce que Dieu est sur le point de faire ». Le participe hébreu peut recevoir ici une valeur prospective en raison du contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw narratif fait avancer le récit ; « alors » en restitue naturellement la succession en français moderne.
- source_word: יוֹסֵף אֶל־פַּרְעֹה
  choice: Joseph dit … au pharaon
  rationale: Cette formulation française introduit naturellement le destinataire du discours ; « pharaon » est traité comme un titre.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: Les rêves du pharaon ne font qu’un
  rationale: Le nom hébreu « rêve » est au singulier, mais il renvoie en contexte aux deux rêves, présentés comme porteurs d’un seul message. La tournure conserve l’idée centrale d’unité sans paraphraser leur signification.
- source_word: אֵת אֲשֶׁר
  choice: ce que
  rationale: Équivalent français idiomatique de la proposition objet introduite en hébreu.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article hébreu, la référence définie se rend naturellement par « Dieu » en français.
- source_word: עֹשֶׂה
  choice: fait
  rationale: Le participe hébreu peut décrire l’action de Dieu sans préciser à lui seul si elle est en cours, habituelle ou imminente. Le présent français préserve mieux cette ouverture qu’une explicitation dans le corps du texte.
- source_word: הִגִּיד
  choice: il l’a annoncé
  rationale: Le hiphil de נגד exprime le fait de communiquer ou de faire connaître. « Annoncé » convient ici à la révélation d’événements et garde un registre digne sans être archaïque.
- source_word: לְפַרְעֹה
  choice: au pharaon
  rationale: Rend directement le complément indirect hébreu tout en conservant la répétition du titre.
theological_decisions:
- issue: Référence de הָאֱלֹהִים
  choice: Dieu
  alternative: le Dieu
  rationale: « Dieu » est la formulation française normale pour cette référence définie et n’ajoute aucune précision doctrinale au texte.
- issue: Valeur temporelle de עֹשֶׂה
  choice: ce que Dieu fait
  alternative: ce que Dieu va faire / est sur le point de faire
  rationale: Le contexte concerne des événements futurs, mais le participe n’explicite pas à lui seul la proximité temporelle. Le texte principal conserve cette tension, tandis que la note signale la lecture prospective.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « pharaon » suit l’hébreu. La ponctuation relie étroitement l’unité des rêves à l’annonce divine, sans effacer l’ambiguïté temporelle du participe.
