  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: fr
  text: 'Alors le chef des échansons parla au pharaon en ces termes : « Aujourd’hui, je rappelle mes fautes[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes péchés » ou « mes torts ». Le terme hébreu peut désigner largement une mauvaise action ou un manquement, d’ordre moral ou lié à une fonction.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Alors ... prit la parole
  rationale: Le waw consécutif fait avancer le récit. « Alors » marque naturellement la progression narrative, et « prit la parole » introduit avec dignité l’intervention de l’officier.
- source_word: שַׂר הַמַּשְׁקִים
  choice: le chef des échansons
  rationale: Ce titre désigne le responsable des serviteurs chargés des boissons royales. « Chef des échansons » est précis et reste compréhensible dans un contexte de cour antique.
- source_word: אֶת־פַּרְעֹה
  choice: devant le pharaon
  rationale: Avec un verbe de parole, le marqueur d’objet peut être rendu idiomatiquement par « devant », ce qui convient à une allocution adressée au souverain dans le cadre de la cour.
- source_word: לֵאמֹר
  choice: '[introduit par les deux-points]'
  rationale: L’infinitif introducteur de discours est rendu naturellement en français par la ponctuation, sans ajouter un « disant » peu idiomatique.
- source_word: אֶת חֲטָאַי
  choice: mes fautes
  rationale: חטא peut désigner des péchés, des torts ou des manquements. « Fautes » conserve ici une portée assez large pour couvrir la dimension morale comme le manquement envers le pharaon.
- source_word: אֲנִי מַזְכִּיר
  choice: je me souviens de
  rationale: Le hiphil de זכר peut signifier faire souvenir, rappeler, mentionner ou évoquer. Dans ce contexte, l’échanson ramène ses fautes passées à sa mémoire et les reconnaît devant le pharaon ; « je me souviens de » est naturel sans exclure cette nuance publique.
- source_word: הַיּוֹם
  choice: Aujourd’hui
  rationale: Cette formulation moderne et idiomatique préserve l’accent temporel placé en tête de la déclaration.
