lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: prirent fin
  rationale: Le wayyiqtol du verbe כלה exprime ici l’achèvement; « prirent fin » est naturel et conserve la valeur narrative du verbe.
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: les sept années d’abondance
  rationale: La construction lie « sept années » à שָׂבָע, qui désigne la période de prospérité et de récoltes abondantes annoncée dans le contexte.
- source_word: אֲשֶׁר הָיָה
  choice: qu’il y avait eues
  rationale: Cette tournure rend la relative hébraïque et son antériorité tout en s’accordant naturellement avec « années » en français.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: La traduction conserve explicitement אֶרֶץ (« pays ») et emploie une formulation française courante et digne.
