id: GEN.41.1
reference: Genesis 41:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּ/פַרְעֹ֣ה חֹלֵ֔ם וְ/הִנֵּ֖ה עֹמֵ֥ד עַל הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: fr
  text: 'Au terme de deux années entières[a], le pharaon fit un rêve : voici qu’il se tenait près du Nil[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « deux années de jours », expression hébraïque désignant une période complète de deux ans.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le fleuve » ; dans ce contexte égyptien, il s’agit du Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Au terme de
  rationale: La formule narrative וַיְהִי, jointe à מִקֵּץ, introduit naturellement en français le nouveau développement au point où la période s’achève. « Au terme de » est précis, fluide et digne.
- source_word: שְׁנָתַיִם יָמִים
  choice: deux années entières
  rationale: L’expression hébraïque, littéralement « deux années de jours », souligne qu’une période complète de deux ans s’est écoulée.
- source_word: פַרְעֹה
  choice: le pharaon
  rationale: Le titre royal est rendu selon l’usage français courant, avec l’article défini.
- source_word: חֹלֵם
  choice: fit un rêve
  rationale: Le participe hébreu situe le rêve comme événement et ouvre la scène onirique. « Fit un rêve » est naturel en français narratif et évite l’ambiguïté possible de « rêvait ».
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette locution conserve la fonction présentative et la vivacité de הִנֵּה sans recourir à l’archaïsme « voici » isolé ou à « et voici » plus lourd.
- source_word: עֹמֵד
  choice: il se tenait
  rationale: Le participe dépeint une posture en cours à l’intérieur du rêve. L’imparfait français rend naturellement cet arrière-plan descriptif.
- source_word: עַל
  choice: près de
  rationale: Dans cette relation spatiale avec un cours d’eau, עַל désigne la proximité ou le bord plutôt qu’une position littéralement « sur » le fleuve.
- source_word: הַיְאֹר
  choice: le Nil
  rationale: Dans le contexte égyptien, יְאֹר désigne le Nil. Le nom propre explicite naturellement le référent en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le deux-points introduit clairement le contenu visuel du rêve. « Le pharaon » suit l’usage français, tandis que « voici que » préserve la mise en relief du texte hébreu.
