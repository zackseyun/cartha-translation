  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: fr
  text: 'Les sept bonnes vaches sont sept années, et les sept bons épis sont sept années : c’est un seul rêve.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹת
  choice: vaches
  rationale: Le terme désigne ici précisément les bovins femelles du rêve de Pharaon ; « vaches » est naturel et exact.
- source_word: הַטֹּבֹת
  choice: bonnes / bons
  rationale: L’adjectif signifie largement « bon » ; ce choix conserve le lien verbal direct avec les images du rêve sans le réduire à l’apparence ou à la santé.
- source_word: שָׁנִים
  choice: années
  rationale: Équivalent direct dans l’interprétation explicite des symboles du rêve.
- source_word: שִׁבֳּלִים
  choice: épis
  rationale: Le mot hébreu désigne la partie supérieure de la céréale qui porte les grains. En français courant, « épis » exprime clairement ce sens dans ce contexte.
- source_word: הֵנָּה
  choice: représentent
  rationale: Le pronom copulatif hébreu établit ici l’équivalence symbolique. « Représentent » rend explicitement et naturellement en français la fonction interprétative de l’énoncé.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: c’est un seul rêve
  rationale: Cette formulation conserve le singulier et l’accent porté sur l’unité des deux séries de symboles.
theological_decisions:
- issue: Unité des deux séries d’images
  choice: « c’est un seul rêve »
  alternative: « le rêve est un »
  rationale: La formulation choisie préserve l’affirmation hébraïque d’une révélation unifiée sans lui ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « représentent sept années » est maintenue afin de reproduire la structure parallèle de l’hébreu. « Épis » est suffisamment précis en français et ne nécessite pas de note lexicale.
