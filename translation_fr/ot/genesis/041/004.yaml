  source_fidelity: 'La structure et les référents sont fidèles : les vaches maigres mangent les sept vaches belles et grasses, puis le pharaon s’éveille. Toutefois, « dévorèrent » renforce le simple verbe hébreu « mangèrent » sans nécessité ; le contexte insolite permet « mangèrent » sans affaiblir le récit. La note fournie n’expose pas l’alternative principale de רָעוֹת (« mauvaises d’apparence »).'
  naturalness: Le français est naturel et narratif. « Alors » puis « Puis » est légèrement redondant ; une seule progression narrative suffit. « Le pharaon se réveilla » est idiomatique.
  terminology: « Vaches », « maigres », « belles » et « grasses » rendent bien les termes et les contrastes physiques du verset. La majuscule à « Pharaon » est recommandée ici comme désignation/titre du souverain dans le récit biblique.
