  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: fr
  text: Les vaches laides et maigres mangèrent les sept vaches belles et grasses[a], puis Pharaon se réveilla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « belles et bien portantes ». Littéralement, pour les deux groupes : « mauvaises/belles d’apparence » ; le mot rendu par « grasses » peut aussi signifier « bien portantes » ou « vigoureuses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: dévorèrent
  rationale: Le verbe signifie littéralement « manger ». Dans cette scène onirique où des vaches en mangent d’autres, « dévorèrent » exprime naturellement l’action en français sans modifier son résultat.
- source_word: הַפָּרוֹת
  choice: les vaches
  rationale: Le nom est un pluriel féminin désignant précisément des vaches, plutôt que le terme plus général « bovins ».
- source_word: רָעוֹת הַמַּרְאֶה
  choice: laides
  rationale: Littéralement « mauvaises d’apparence » ; dans ce contexte physique, « laides » en donne le sens idiomatique et contraste nettement avec « belles ».
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: et maigres
  rationale: Littéralement « minces de chair ». « Maigres » est l’expression française naturelle pour décrire leur manque de chair.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: les sept vaches
  rationale: L’accusatif, le nombre et le substantif désignent directement les sept vaches comme objet de l’action.
- source_word: יְפֹת הַמַּרְאֶה
  choice: belles
  rationale: Littéralement « belles d’apparence » ; « belles » conserve le contraste parallèle avec « laides » sans lourdeur.
- source_word: וְהַבְּרִיאֹת
  choice: et grasses
  rationale: Le terme peut signifier « grasses, bien portantes, vigoureuses ». Le contraste avec les vaches maigres favorise ici la caractéristique corporelle « grasses ».
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: Puis le pharaon se réveilla
  rationale: Le wayyiqtol poursuit la séquence narrative. « Puis » marque naturellement la succession, et « se réveilla » est l’équivalent français courant du verbe.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les descriptions hébraïques littérales « mauvaises/belles d’apparence » et « minces de chair » sont rendues par les adjectifs français naturels « laides », « belles » et « maigres ». L’article devant « pharaon » suit l’usage français courant.
