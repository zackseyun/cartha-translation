source:
  edition: WLC
  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: fr
  text: La famine s’étendait sur toute la surface de la terre. Joseph ouvrit tous les entrepôts[a] et vendit du grain aux Égyptiens. La famine devint de plus en plus sévère dans le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement, de manière elliptique : « ouvrit tout ce qui était en eux ». Il s’agit vraisemblablement des lieux où le grain avait été entreposé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָב
  choice: la famine
  rationale: רָעָב désigne ici une disette généralisée et grave; « famine » convient au contexte de l’ensemble du récit.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: sur toute la surface de la terre
  rationale: Cette formulation conserve l’image hébraïque de la « face » ou surface de la terre. אֶרֶץ peut aussi désigner un pays ou une région, mais le contexte immédiat présente la famine comme largement répandue.
- source_word: וַיִּפְתַּח יוֹסֵף אֶת כָּל אֲשֶׁר בָּהֶם
  choice: Joseph ouvrit tous les entrepôts[a]
  rationale: Le texte hébreu est elliptique et, pris mot à mot, dit approximativement « ouvrit tout ce qui était en eux », sans antécédent exprimé pour « eux ». Le contexte indique les lieux où le grain était stocké; « entrepôts » rend clairement l’action sans préciser indûment leur forme.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: vendit du grain aux Égyptiens
  rationale: Dans ce contexte, שׁבר désigne la vente de céréales ou de provisions. Le complément collectif « à l’Égypte » vise naturellement la population égyptienne en français.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: la famine devint de plus en plus sévère
  rationale: חזק signifie littéralement « devenir fort »; appliqué à la famine, il exprime son aggravation. La tournure choisie est naturelle et restitue cette intensification.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dans le pays d’Égypte
  rationale: Cette expression reproduit la formulation narrative complète de l’hébreu plutôt que de la réduire à « en Égypte ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Les trois propositions hébraïques sont réparties en trois phrases pour une lecture naturelle. L’ambiguïté de la formule concernant les lieux de stockage est signalée en note plutôt que masquée.
