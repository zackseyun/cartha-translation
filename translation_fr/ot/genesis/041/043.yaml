  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: fr
  text: 'Il le fit monter sur le second char qu’il avait, et l’on cria devant lui : « Abrek ! »[a] Puis il l’établit sur tout le pays d’Égypte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Abrek » est un terme difficile dont le sens est incertain, peut-être d’origine égyptienne ou hébraïque. On le comprend souvent dans le sens de « Pliez le genou ! »
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: Il le fit monter
  rationale: 'Le hifil de רכב exprime la causalité : Pharaon fait monter Joseph sur le char. Cette formulation est naturelle en français et conserve ce sens causatif.'
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: sur le second char qu’il avait
  rationale: מִשְׁנֶה indique ici le second rang, vraisemblablement le char venant immédiatement après celui de Pharaon. La relative hébraïque reste explicite sans lever davantage l’ambiguïté.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: et l’on criait devant lui
  rationale: קרא désigne ici une acclamation publique dans le cortège. Le pronom indéfini français rend naturellement le pluriel sans référent exprimé, et l’imparfait représente bien le cri répété pendant la procession.
- source_word: אַבְרֵךְ
  choice: Abrek !
  rationale: Le terme est obscur, peut-être un emprunt égyptien ou une acclamation technique. La translittération évite d’imposer dans le texte une interprétation incertaine.
- source_word: וְנָתוֹן אֹתוֹ
  choice: Ainsi, il l’établit
  rationale: L’infinitif absolu נָתוֹן employé avec une valeur verbale marque ici le résultat ou la conséquence. « L’établit » exprime clairement la mise en autorité de Joseph.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: sur tout le pays d’Égypte
  rationale: עַל marque l’autorité exercée, tandis que אֶרֶץ garde sa portée territoriale avec « pays ».
theological_decisions:
- issue: Sens de l’acclamation אַבְרֵךְ
  choice: Conserver « Abrek ! » dans le texte
  alternative: « À genoux ! » ou « Pliez le genou ! »
  rationale: L’étymologie et le sens précis du mot restent incertains. Le traduire directement trancherait une question lexicale que le texte ne permet pas de résoudre avec assurance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative reste proche de l’hébreu, tandis que l’imparfait « criait » rend naturellement l’acclamation répétée du cortège. Le terme obscur « Abrek » est conservé et expliqué en note.
