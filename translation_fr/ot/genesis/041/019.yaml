  text: וְ/הִנֵּ֞ה שֶֽׁבַע פָּר֤וֹת אֲחֵרוֹת֙ עֹל֣וֹת אַחֲרֵי/הֶ֔ן דַּלּ֨וֹת וְ/רָע֥וֹת תֹּ֛אַר מְאֹ֖ד וְ/רַקּ֣וֹת בָּשָׂ֑ר לֹֽא רָאִ֧יתִי כָ/הֵ֛נָּה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם לָ/רֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: fr
  text: Et voici que sept autres vaches montaient à leur suite. Elles étaient chétives, d’un aspect très laid et maigres de corps. Je n’en avais jamais vu d’aussi laides[a] dans tout le pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans un état aussi misérable » ; l’expression hébraïque peut viser leur apparence ou, plus largement, leur état pitoyable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve le marqueur narratif vif qui introduit un nouvel élément du récit du rêve, dans un français naturel et digne.
- source_word: עֹלֹת אַחֲרֵיהֶן
  choice: montaient à leur suite
  rationale: Le participe décrit le mouvement des vaches venant après les premières; « à leur suite » restitue naturellement אַחֲרֵיהֶן.
- source_word: דַּלּוֹת
  choice: chétives
  rationale: Exprime leur faiblesse et leur état physique misérable sans faire double emploi avec la maigreur mentionnée ensuite.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: d’un aspect très laid
  rationale: Dans ce contexte, רָעוֹת qualifie l’apparence physique et non une qualité morale.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: maigres de corps
  rationale: Rend l’émaciation corporelle exprimée littéralement par « maigres de chair », tout en évitant une tournure trop raide en français moderne.
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: Je n’en avais jamais vu d’aussi
  rationale: Le plus-que-parfait convient au récit rétrospectif du rêve, et « jamais » exprime idiomatiquement la négation renforcée par la comparaison.
- source_word: לָרֹעַ
  choice: pitoyables
  rationale: Résume leur état exceptionnellement mauvais sans suggérer une faute morale et sans limiter entièrement le sens à la seule laideur.
