  text: וַ/יִּשְׁלַ֤ח פַּרְעֹה֙ וַ/יִּקְרָ֣א אֶת יוֹסֵ֔ף וַ/יְרִיצֻ֖/הוּ מִן הַ/בּ֑וֹר וַ/יְגַלַּח֙ וַ/יְחַלֵּ֣ף שִׂמְלֹתָ֔י/ו וַ/יָּבֹ֖א אֶל פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: fr
  text: Alors le pharaon envoya chercher Joseph. On le fit sortir en toute hâte de la fosse[a]. Joseph se rasa, changea de vêtements et vint auprès du pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du cachot ». Le mot hébreu désigne littéralement une fosse et peut évoquer ici une citerne servant de lieu de détention.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת יוֹסֵף
  choice: envoya chercher Joseph
  rationale: Cette tournure française naturelle exprime l’ordre donné par le pharaon de faire venir Joseph et rend ensemble les deux verbes hébreux, sans suggérer deux convocations distinctes.
- source_word: וַיְרִיצֻהוּ
  choice: On le fit sortir en toute hâte
  rationale: La forme causative indique que des agents non nommés firent venir Joseph rapidement. Le pronom indéfini « on » et « en toute hâte » rendent à la fois le sujet implicite et l’urgence.
- source_word: מִן הַבּוֹר
  choice: de la fosse
  rationale: « Fosse » conserve le sens concret de בּוֹר et le lien narratif avec les occurrences antérieures, tout en laissant ouverte la nature exacte de ce lieu de détention.
- source_word: וַיְגַלַּח
  choice: Joseph se rasa
  rationale: Le verbe hébreu est actif. En français, la forme pronominale est la manière naturelle d’exprimer cette action faite sur soi-même.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: changea de vêtements
  rationale: Formulation française courante et fidèle pour le changement de tenue avant la comparution.
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: vint auprès du pharaon
  rationale: Cette traduction reste proche du mouvement exprimé par בוא אל, sans ajouter explicitement l’idée d’une audience officielle ou d’une entrée dans une salle.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et digne. La reprise de « Joseph » dans la troisième phrase évite toute ambiguïté après le « on » indéfini. Le titre « pharaon » est employé avec l’article et sans majuscule, conformément à l’usage français courant.
