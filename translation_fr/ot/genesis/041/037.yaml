  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י פַרְעֹ֑ה וּ/בְ/עֵינֵ֖י כָּל עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: fr
  text: La proposition parut bonne à Pharaon et à tous ses serviteurs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיטַב
  choice: parut bonne
  rationale: Dans la construction avec בְּעֵינֵי, le verbe exprime une appréciation favorable. « Parut bonne à » restitue naturellement cette évaluation sans déplacer le sujet grammatical.
- source_word: הַדָּבָר
  choice: cette proposition
  rationale: Dans le contexte immédiat, דָּבָר renvoie au conseil que Joseph vient d’exposer. « Cette proposition » est précis et idiomatique en français, tandis que « la chose » serait vague et « la parole » trompeur.
- source_word: בְּעֵינֵי
  choice: à
  rationale: L’expression hébraïque signifie littéralement « aux yeux de ». En français courant, « parut bonne à » en transmet naturellement le sens évaluatif sans lourde répétition.
- source_word: פַרְעֹה
  choice: Pharaon
  rationale: Forme française traditionnelle et usuelle du titre royal égyptien.
- source_word: כָּל עֲבָדָיו
  choice: tous ses serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs, des agents royaux ou des fonctionnaires. « Serviteurs » conserve ici l’étendue du terme hébreu sans imposer un statut administratif plus précis.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La répétition littérale « aux yeux de Pharaon et aux yeux de tous ses serviteurs » est allégée, tandis que l’appréciation exprimée par l’idiome hébreu est conservée.
