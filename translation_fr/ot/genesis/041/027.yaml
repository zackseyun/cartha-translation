    issue: « chétives » pour וְהָרָעוֹת
    rationale: Dans cette reprise de la description des vaches du rêve, le terme qualifie défavorablement leur apparence. « Chétives » suggère surtout une faiblesse ou une maigreur et fait en partie double emploi avec « maigres »; « laides » conserve plus nettement le contraste descriptif.
  - severity: low
    issue: « qui sont montées après elles »
    rationale: La montée est présente dans l’hébreu, mais cette formulation est peu idiomatique en français lorsqu’elle s’applique à des vaches dans un rêve. « Qui sont apparues après les premières » exprime naturellement leur apparition successive sans altérer le sens.
  revised_text: Les sept vaches maigres et laides qui sont apparues après les premières représentent sept années, et les sept épis vides, desséchés par le vent d’est, seront sept années de famine.
