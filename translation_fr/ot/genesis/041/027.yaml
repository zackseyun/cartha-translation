base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: fr
  text: Les sept vaches maigres et laides qui sont apparues après les premières représentent sept années, et les sept épis vides, desséchés par le vent d’est, seront sept années de famine.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: maigres
  rationale: Dans le contexte des vaches du rêve, l’adjectif décrit leur manque de chair. « Maigres » est précis, courant et naturel en français moderne.
- source_word: וְהָרָעֹת
  choice: et chétives
  rationale: רַע décrit ici le mauvais état des vaches, non une qualité morale. « Chétives » exprime leur état déficient sans suggérer qu’elles sont moralement mauvaises.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: qui sont montées après elles
  rationale: La formulation conserve le mouvement ascendant du rêve ainsi que l’ordre d’apparition des vaches.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: représentent sept années
  rationale: L’hébreu dit littéralement qu’elles « sont sept années ». En français, « représentent » rend naturellement l’identification symbolique explicitée par Joseph.
- source_word: הַשִׁבֳּלִים
  choice: épis
  rationale: « Épis » est le terme français courant et précis pour les têtes porte-graines des céréales.
- source_word: הָרֵקוֹת
  choice: vides
  rationale: Appliqué aux épis, l’adjectif indique qu’ils sont dépourvus de grains ou de substance. « Vides » préserve directement cette image.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: desséchés par le vent d’est
  rationale: Le participe décrit des épis endommagés par le vent d’est chaud et sec. « Desséchés » convient à l’effet subi par les céréales, tandis que « vent d’est » conserve l’orientation explicitement mentionnée.
- source_word: יִהְיוּ
  choice: seront
  rationale: L’imparfait hébreu a ici une portée prospective dans l’explication du rêve; « seront » en conserve la force prédictive.
- source_word: שְׁנֵי רָעָב
  choice: années de famine
  rationale: Cette expression désigne une période prolongée de pénurie alimentaire; « famine » est le terme français précis dans ce récit.
theological_decisions: []
