  register: 'Français international moderne, clair et digne. La phrase conserve le parallélisme des deux séries de sept tout en exprimant naturellement l’identification symbolique. Aucune note n’est nécessaire : « épis » et « vent d’est » rendent directement les termes hébreux sans ambiguïté importante en français.'
