source:
  edition: WLC
  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: fr
  text: Quant au fait que le rêve ait été répété deux fois à Pharaon, c’est que la chose est fermement établie[a] par Dieu et que Dieu se hâte[b] de l’accomplir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la chose est arrêtée par Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Dieu va l’accomplir rapidement » ou « Dieu est sur le point de l’accomplir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Quant au fait que
  rationale: Introduit une explication concernant la répétition du rêve. Cette tournure restitue naturellement la fonction thématique de l’expression hébraïque.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: le rêve a été répété
  rationale: L’infinitif construit exprime ici la répétition subie par le rêve; le passif français conserve cette valeur.
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: deux fois à Pharaon
  rationale: Rend directement la direction ou le destinataire de la répétition ainsi que le duel «deux fois».
- source_word: כִּי
  choice: c’est que
  rationale: Introduit la raison expliquant pourquoi le rêve a été répété.
- source_word: נָכוֹן הַדָּבָר
  choice: la chose est fermement établie
  rationale: נָכוֹן exprime ici la fermeté, la stabilité ou le caractère arrêté de ce qui doit arriver; «fermement établie» préserve cette portée sans la réduire à une simple certitude subjective.
- source_word: מֵעִם הָאֱלֹהִים
  choice: par Dieu
  rationale: Dans cette construction française, «par Dieu» exprime naturellement que l’établissement de la chose vient de Dieu.
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: et que Dieu se hâte
  rationale: Le participe présente l’action divine comme imminente et prompte; «se hâte» conserve l’image verbale plutôt que de la remplacer par un simple adverbe.
- source_word: לַעֲשֹׂתוֹ
  choice: de l’accomplir
  rationale: Le pronom renvoie à la chose annoncée. «Accomplir» est plus naturel que «faire» en français pour la réalisation d’un événement décidé.
theological_decisions:
- issue: Sens de הָאֱלֹהִים dans l’explication de Joseph
  choice: Dieu
  alternative: les dieux
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu unique dans un contexte et une syntaxe au singulier.
- issue: Portée de נָכוֹן appliqué à la chose
  choice: fermement établie par Dieu
  alternative: certaine de la part de Dieu
  rationale: 'Le texte affirme davantage qu’une conviction humaine: la chose est ferme ou arrêtée en raison de son origine divine. La formulation retenue préserve cette affirmation sans développer une doctrine particulière du décret.'
translation_notes:
  register: Français international moderne, clair et digne. «Quant au fait que» marque le passage à l’explication; «la chose» conserve l’ampleur de דָּבָר, tandis que «se hâte de l’accomplir» garde la vivacité et l’imminence du participe hébreu.
