  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף חֲל֣וֹם חָלַ֔מְתִּי וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/אֲנִ֗י שָׁמַ֤עְתִּי עָלֶ֨י/ךָ֙ לֵ/אמֹ֔ר תִּשְׁמַ֥ע חֲל֖וֹם לִ/פְתֹּ֥ר אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: fr
  text: 'Le pharaon dit à Joseph : « J’ai fait un rêve, et personne ne peut l’interpréter. Mais j’ai entendu dire à ton sujet qu’il te suffit d’entendre un rêve pour l’interpréter. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: J’ai fait un rêve
  rationale: La construction hébraïque associe le nom et le verbe de même racine. Le français naturel exprime cette idée par « faire un rêve », sans reproduire la répétition peu idiomatique « rêver un rêve ».
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: et personne ne peut l’interpréter
  rationale: Littéralement, « il n’y a personne qui l’interprète ». La formulation retenue transmet naturellement l’absence d’un interprète capable, dans ce contexte.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: j’ai entendu dire à ton sujet
  rationale: Cette expression conserve l’idée d’un témoignage rapporté au sujet de Joseph.
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: qu’il te suffit d’entendre un rêve pour l’interpréter
  rationale: L’hébreu est littéralement « tu entends un rêve pour l’interpréter ». La tournure française rend l’aptitude que le pharaon attribue à Joseph tout en gardant le lien entre l’écoute du récit et son interprétation.
theological_decisions:
- issue: Source du pouvoir d’interprétation
  choice: Le pharaon attribue ici directement cette capacité à Joseph
  alternative: Préciser dans ce verset que Dieu donne l’interprétation
  rationale: Le texte rapporte seulement ce que le pharaon a entendu au sujet de Joseph. La réponse de Joseph au verset suivant rectifie cette attribution; anticiper cette précision effacerait la tension narrative.
translation_notes:
  register: Français international moderne, fluide et digne. « Le pharaon » emploie l’article conformément à l’usage français courant; le discours direct reste naturel sans perdre le caractère rapporté de l’information.
