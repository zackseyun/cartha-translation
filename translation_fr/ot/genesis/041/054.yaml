source:
  edition: WLC
  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: fr
  text: Les sept années de famine commencèrent, comme Joseph l’avait annoncé. Il y eut une famine dans tous les pays, mais dans tout le pays d’Égypte, il y avait du pain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la nourriture » ; le mot hébreu traduit par « pain » peut désigner plus largement la nourriture ou les vivres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה שֶׁבַע שְׁנֵי הָרָעָב לָבוֹא
  choice: Les sept années de famine commencèrent
  rationale: Le français exprime naturellement l’entrée dans cette période par « commencèrent ». L’idée hébraïque littérale de « commencer à venir » est conservée sans reproduire une tournure lourde.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: comme Joseph l’avait annoncé
  rationale: כַּאֲשֶׁר marque la conformité entre l’événement et les paroles antérieures de Joseph. « Avait annoncé » convient au contexte prédictif et à l’antériorité narrative.
- source_word: וַיְהִי רָעָב
  choice: Il y eut une famine
  rationale: Cette formulation rend sobrement la construction existentielle hébraïque et convient au récit.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: dans tous les pays
  rationale: « Pays » est ici un équivalent français naturel du pluriel אֲרָצוֹת, sans imposer l’idée moderne d’États-nations.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: mais dans tout le pays d’Égypte
  rationale: La conjonction hébraïque est formellement additive, mais la relation logique oppose la famine générale à la présence de vivres en Égypte ; « mais » rend clairement ce contraste en français.
- source_word: הָיָה לָחֶם
  choice: il y avait du pain
  rationale: Le texte principal conserve le terme concret לֶחֶם, « pain », tandis qu’une note signale son sens possible plus large de nourriture ou de vivres.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation reste proche de la structure hébraïque tout en évitant le calque peu naturel « commencèrent à venir ». Le marqueur de note est placé après « pain », le terme auquel la variante lexicale se rapporte.
