  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: fr
  text: Avant que vienne l’année de la famine[a], Joseph eut deux fils, qu’Asnath, fille de Poti-Phéra, prêtre d’On[b], lui mit au monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avant l’arrivée de l’année de famine ». L’hébreu emploie ici le singulier « année », en référence au début de la période de famine.'
    reason: lexical_alternative
  - marker: b
    text: On était une ville égyptienne, appelée plus tard Héliopolis en grec.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד ... שְׁנֵי בָנִים
  choice: Joseph eut deux fils
  rationale: Cette tournure française rend naturellement la construction passive hébraïque « deux fils naquirent à Joseph », sans en modifier le sens.
- source_word: בְּטֶרֶם תָּבוֹא שְׁנַת הָרָעָב
  choice: Avant que vienne l’année de la famine
  rationale: Conserve le singulier « année » et l’image verbale de sa venue, qui marque le début de la période de famine.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: que lui donna
  rationale: Expression française naturelle pour dire qu’Asnath mit au monde ces fils pour Joseph; elle évite la lourdeur de « qu’elle lui enfanta ».
- source_word: אָסְנַת
  choice: Asnath
  rationale: Translittération française traditionnelle et intelligible du nom propre.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: fille de Poti-Phéra
  rationale: Rend directement la chaîne construite qui précise la filiation d’Asnath.
- source_word: כֹּהֵן אֹון
  choice: prêtre d’On
  rationale: כֹּהֵן désigne un prêtre, et On est conservé comme nom de lieu.
