- from: De toute la terre, on venait en Égypte auprès de Joseph pour acheter du grain[a], car la famine était dure sur toute la terre.
  to: Des gens de toute la terre vinrent en Égypte auprès de Joseph pour acheter du grain[a], car la famine sévissait sur toute la terre.
  rationale: La révision rétablit un temps narratif correspondant au parfait hébreu, conserve la vaste expression « toute la terre » sans la rendre artificiellement sujet d’un verbe de mouvement, et emploie une expression française idiomatique pour l’intensité de la famine. La note est précisée pour refléter l’ellipse lexicale du verbe hébreu sans étendre indûment son sens.
