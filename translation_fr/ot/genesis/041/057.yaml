  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: fr
  text: Des gens de toute la terre vinrent en Égypte auprès de Joseph pour acheter du grain[a], car la famine sévissait sur toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « pour acheter ». Dans ce contexte, le verbe hébreu désigne l’achat ou l’approvisionnement en céréales.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: De toute la terre, on venait
  rationale: Le français ne peut guère faire de « toute la terre » le sujet naturel du verbe « venir ». Cette tournure rend la portée collective et géographique de l’hébreu tout en conservant « terre » et son ampleur narrative.
- source_word: בָּאוּ
  choice: on venait
  rationale: L’imparfait exprime ici le mouvement collectif et continu de populations vers l’Égypte dans le contexte de la famine.
- source_word: מִצְרַיְמָה
  choice: en Égypte
  rationale: Le suffixe directionnel hébreu marque un mouvement vers l’Égypte; « en Égypte » est la formulation française idiomatique après « venir ».
- source_word: לִשְׁבֹּר
  choice: pour acheter du grain
  rationale: Dans ce contexte de famine, שׁבר désigne l’achat ou l’approvisionnement en céréales; préciser « du grain » explicite naturellement l’objet implicite.
- source_word: אֶל יוֹסֵף
  choice: auprès de Joseph
  rationale: La préposition signifie littéralement « vers/auprès de ». Cette traduction conserve Joseph comme personne à laquelle on s’adresse sans transformer explicitement la relation en « acheter à Joseph ».
- source_word: כִּי
  choice: car
  rationale: « Car » introduit clairement la cause dans un registre narratif digne et naturel.
- source_word: חָזַק הָרָעָב
  choice: la famine était dure
  rationale: חזק signifie littéralement que la famine était forte ou avait pris de la force. « Était dure » est idiomatique en français et rend sa gravité sans supprimer entièrement l’image de force.
- source_word: בְּכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: Cette formulation conserve la répétition rhétorique de אֶרֶץ et la vaste portée de l’expression hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « toute la terre » est maintenue afin de respecter l’insistance du texte hébreu; elle peut désigner largement les pays touchés par la famine plutôt que la planète entière au sens géographique moderne.
