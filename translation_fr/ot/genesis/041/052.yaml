source:
  edition: WLC
  text: וְ/אֵ֛ת שֵׁ֥ם הַ/שֵּׁנִ֖י קָרָ֣א אֶפְרָ֑יִם כִּֽי הִפְרַ֥/נִי אֱלֹהִ֖ים בְּ/אֶ֥רֶץ עָנְיִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: fr
  text: Il donna au second le nom d’Éphraïm[a], car, dit-il, « Dieu m’a rendu fécond dans le pays de mon affliction. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Éphraïm fait écho en hébreu à l’expression « m’a rendu fécond ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: Il donna au second le nom de
  rationale: Cette formulation française naturelle rend fidèlement l’idiome hébreu de nomination, tout en maintenant le lien narratif par la suite de la phrase.
- source_word: אֶפְרָיִם
  choice: Éphraïm
  rationale: Translittération française traditionnelle du nom hébreu, avec une note expliquant le jeu sonore.
- source_word: כִּי
  choice: car
  rationale: Introduit l’explication donnée par Joseph pour le choix du nom.
- source_word: הִפְרַנִי
  choice: m’a rendu fécond
  rationale: Le hifil de פרה exprime le fait de rendre fécond ou fructueux. « Rendu fécond » conserve plus directement le jeu de mots avec Éphraïm que « fait prospérer ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le verbe singulier et le contexte désignent Dieu au singulier.
- source_word: בְּאֶרֶץ עָנְיִי
  choice: dans le pays de mon affliction
  rationale: « Pays » convient naturellement au cadre géographique, tandis que « affliction » préserve la gravité et l’étendue non précisée du terme hébreu.
theological_decisions:
- issue: Portée de l’affliction évoquée par Joseph
  choice: Conserver sans précision « le pays de mon affliction »
  alternative: Limiter l’expression aux souffrances antérieures de Joseph, ou l’expliciter comme son exil familial
  rationale: Le texte associe l’action féconde de Dieu et le souvenir de l’affliction sans définir plus précisément celle-ci. La traduction maintient cette tension.
translation_notes:
  register: Français moderne, courant et digne. L’incise « dit-il » clarifie naturellement que les paroles explicatives sont celles de Joseph, implicite dans la construction hébraïque, sans modifier leur sens.
