  text: יַעֲשֶׂ֣ה פַרְעֹ֔ה וְ/יַפְקֵ֥ד פְּקִדִ֖ים עַל הָ/אָ֑רֶץ וְ/חִמֵּשׁ֙ אֶת אֶ֣רֶץ מִצְרַ֔יִם בְּ/שֶׁ֖בַע שְׁנֵ֥י הַ/שָּׂבָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: fr
  text: 'Que le pharaon agisse ainsi : qu’il désigne des administrateurs pour le pays et qu’il prélève un cinquième des récoltes du pays d’Égypte pendant les sept années d’abondance[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il perçoive un cinquième des récoltes du pays d’Égypte ». Le verbe hébreu peut désigner la levée ou le prélèvement d’une part d’un cinquième pendant les années d’abondance.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: Que le pharaon agisse ainsi
  rationale: Le verbe עשה est général (« faire, agir »). Dans ce conseil adressé au pharaon, la tournure exhortative française rend naturellement la valeur jussive, tandis que « ainsi » reprend la proposition qui suit.
- source_word: וְיַפְקֵד
  choice: qu’il nomme
  rationale: Le hiphil de פקד exprime ici l’établissement de personnes dans une fonction administrative. « Nommer » est clair et naturel en français contemporain.
- source_word: פְּקִדִים
  choice: des responsables
  rationale: Le nom désigne des agents investis d’une responsabilité. « Responsables » évite les connotations militaires de « officiers » et reste intelligible sans préciser une fonction que le texte ne détaille pas.
- source_word: עַל הָאָרֶץ
  choice: dans tout le pays
  rationale: Dans ce contexte administratif, אֶרֶץ désigne le territoire égyptien. « Dans tout le pays » rend idiomatiquement la répartition territoriale des responsables, bien que la préposition hébraïque signifie littéralement « sur ».
- source_word: וְחִמֵּשׁ
  choice: qu’il prélève un cinquième
  rationale: Le piel de חמשׁ est compris ici comme l’action de lever ou recueillir une part d’un cinquième. « Prélever » convient au contexte administratif tout en préservant l’idée d’une collecte imposée.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: des récoltes du pays d’Égypte
  rationale: L’objet grammatical est littéralement le pays d’Égypte, mais le contexte de production et de stockage indique que le prélèvement porte sur son rendement. L’ajout de « récoltes » explicite ce référent implicite sans suggérer que le territoire lui-même serait divisé.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: pendant les sept années d’abondance
  rationale: שָׂבָע évoque la satiété ou la profusion et désigne ici les années de récoltes abondantes. Cette formulation est naturelle et cohérente avec le récit.
theological_decisions: []
