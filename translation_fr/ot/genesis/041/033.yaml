  text: וְ/עַתָּה֙ יֵרֶ֣א פַרְעֹ֔ה אִ֖ישׁ נָב֣וֹן וְ/חָכָ֑ם וִ/ישִׁיתֵ֖/הוּ עַל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: fr
  text: Maintenant, que le pharaon cherche un homme perspicace et sage[a], et qu’il l’établisse à la tête du pays d’Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « choisisse un homme perspicace et sage ». Le verbe hébreu peut, selon le contexte, signifier voir, trouver ou choisir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Marque naturellement le passage de l’interprétation du rêve au conseil pratique de Joseph.
- source_word: יֵרֶא
  choice: que le pharaon cherche
  rationale: Dans ce contexte, le jussif de ראה dépasse la simple perception visuelle et suggère la recherche ou le choix d’un candidat; « cherche » reste naturel tout en laissant la sélection implicite.
- source_word: פַרְעֹה
  choice: le pharaon
  rationale: Forme française usuelle du titre royal égyptien; l’article défini convient à l’usage moderne dans ce contexte narratif.
- source_word: אִישׁ
  choice: un homme
  rationale: Reproduit le masculin singulier de l’hébreu et correspond au futur administrateur envisagé dans le contexte.
- source_word: נָבוֹן
  choice: perspicace
  rationale: Exprime la capacité de comprendre et de juger avec justesse dans un cadre administratif, sans faire double emploi avec « sage ».
- source_word: וְחָכָם
  choice: et sage
  rationale: Rend le sens courant de חכם, qui associe sagesse de jugement et compétence pratique.
- source_word: וִישִׁיתֵהוּ
  choice: et qu’il l’établisse
  rationale: Le verbe שׂים signifie littéralement mettre ou placer; « établir » exprime ici naturellement l’attribution officielle d’une autorité.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: à la tête du pays d’Égypte
  rationale: Rend idiomatiquement l’autorité exercée sur le pays, indiquée par עַל, tout en conservant la mention explicite du pays d’Égypte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure jussive est rendue par « que… », et le vocabulaire administratif demeure clair sans perdre la formulation hébraïque.
