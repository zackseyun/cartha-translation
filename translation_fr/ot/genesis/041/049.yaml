id: GEN.41.49
reference: Genesis 41:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּצְבֹּ֨ר יוֹסֵ֥ף בָּ֛ר כְּ/ח֥וֹל הַ/יָּ֖ם הַרְבֵּ֣ה מְאֹ֑ד עַ֛ד כִּי חָדַ֥ל לִ/סְפֹּ֖ר כִּי אֵ֥ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: fr
  text: Joseph amassa du grain en très grande quantité, comme le sable de la mer, jusqu’à ce qu’il cesse de compter, car il était impossible de le dénombrer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car il n’y avait pas de nombre » ; expression signifiant que la quantité dépassait toute possibilité de comptage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: amassa
  rationale: Le verbe צבר évoque l’accumulation en tas ou en réserve. « Amassa » convient au contexte de stockage organisé tout en restant naturel en français.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: « Joseph » est la forme française traditionnelle et immédiatement reconnaissable du nom hébreu יוֹסֵף.
- source_word: בָּר
  choice: du grain
  rationale: בָּר désigne ici les céréales de manière générale, sans permettre de préciser qu’il s’agit de blé.
- source_word: כְּחוֹל הַיָּם
  choice: comme le sable de la mer
  rationale: Cette formulation conserve l’image hébraïque familière d’une quantité immense.
- source_word: הַרְבֵּה מְאֹד
  choice: en très grande quantité
  rationale: La tournure restitue naturellement en français la forte intensification exprimée par הַרְבֵּה מְאֹד.
- source_word: עַד כִּי
  choice: jusqu’à ce que
  rationale: La locution marque le point auquel conduit l’accumulation et se rend naturellement ainsi en français.
- source_word: חָדַל לִסְפֹּר
  choice: il cesse de compter
  rationale: Le verbe au singulier renvoie le plus naturellement à Joseph. Le présent de narration après « jusqu’à ce que » est évité au profit du subjonctif présent, conforme au français courant.
- source_word: כִּי אֵין מִסְפָּר
  choice: car il était impossible de le dénombrer
  rationale: Cette formulation rend clairement l’idiome hébreu « car il n’y avait pas de nombre » sans suggérer que les nombres eux-mêmes auraient cessé d’exister.
