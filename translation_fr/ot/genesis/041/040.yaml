  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: fr
  text: Tu seras à la tête de ma maison, et tout mon peuple obéira à tes ordres.[a] Je ne serai plus grand que toi que par le trône.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et, selon ta bouche, tout mon peuple embrassera ». Le verbe hébreu signifie habituellement « embrasser », mais l’expression est généralement comprise ici au sens d’obéir aux directives de Joseph ou de lui rendre hommage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־בֵּיתִי
  choice: à la tête de ma maison
  rationale: La préposition עַל exprime ici l’autorité exercée sur la maison de Pharaon. Cette formulation française est naturelle et conserve « maison », qui peut désigner à la fois la maisonnée et l’administration du palais.
- source_word: וְעַל־פִּיךָ יִשַּׁק
  choice: se conformera à tes ordres
  rationale: Littéralement, la construction associe « à ta bouche » au verbe « embrasser ». Dans ce contexte de délégation d’autorité, elle indique que le peuple agira selon les directives de Joseph. La traduction rend ce sens administratif sans effacer la formulation littérale, signalée en note.
- source_word: כָּל־עַמִּי
  choice: tout mon peuple
  rationale: Traduction directe et naturelle du collectif עַם.
- source_word: רַק
  choice: seulement
  rationale: Le terme introduit la seule restriction apportée à l’autorité conférée à Joseph.
- source_word: הַכִּסֵּא
  choice: le trône
  rationale: כִּסֵּא désigne littéralement le trône et, par métonymie, la dignité royale de Pharaon.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: je serai plus grand que toi
  rationale: La formulation reste proche de l’hébreu et exprime une supériorité de rang, précisée par la mention du trône.
theological_decisions:
- issue: Étendue de l’autorité de Joseph par rapport à celle de Pharaon
  choice: C’est seulement par le trône que je serai plus grand que toi
  alternative: Seul le trône me placera au-dessus de toi
  rationale: 'La traduction conserve l’image et la tension du texte : Joseph reçoit une autorité très étendue, tandis que Pharaon garde la prééminence attachée au trône, sans préciser davantage la nature institutionnelle de cette distinction.'
translation_notes:
  register: Français international moderne, digne et accessible. « À la tête de » et « se conformera à tes ordres » donnent une lecture naturelle dans un contexte administratif, tandis que la note préserve l’expression hébraïque inhabituelle et son ambiguïté.
