id: GEN.41.35
reference: Genesis 41:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: fr
  text: Qu’ils rassemblent toute la nourriture de ces bonnes années qui viennent, qu’ils amassent le grain sous l’autorité de Pharaon[a], comme vivres dans les villes, et qu’ils le conservent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous la main de Pharaon », expression hébraïque indiquant son autorité ou son contrôle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’ils le gardent » ou « qu’ils le préservent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: Qu’ils rassemblent
  rationale: Dans le contexte de la proposition de Joseph, l’imparfait hébreu a une valeur directive. La tournure française avec « qu’ils » rend naturellement cette nuance.
- source_word: כָּל אֹכֶל
  choice: toute la nourriture
  rationale: אֹכֶל désigne largement la nourriture ou les provisions produites pendant les années d’abondance.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: ces bonnes années qui viennent
  rationale: Cette formulation conserve à la fois la valeur démonstrative de הָאֵלֶּה et celle du participe הַבָּאֹת, dans un français naturel.
- source_word: וְיִצְבְּרוּ
  choice: qu’ils amassent
  rationale: Le verbe évoque l’accumulation en quantité, ici en vue du stockage. « Amasser » garde cette image sans alourdir la phrase.
- source_word: בָר
  choice: le grain
  rationale: בָר désigne ici le grain, notamment le grain battu. « Blé » serait trop précis et « céréales » plus technique.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: sous l’autorité de Pharaon
  rationale: L’expression hébraïque signifie littéralement « sous la main de Pharaon » et indique son autorité ou son contrôle.
- source_word: אֹכֶל בֶּעָרִים
  choice: comme vivres dans les villes
  rationale: La formule présente le grain entreposé comme des provisions placées dans les villes. « Vivres » convient au contexte de réserves administrées.
- source_word: וְשָׁמָרוּ
  choice: et qu’ils le conservent
  rationale: שׁמר peut signifier garder, surveiller ou préserver. « Conserver » exprime ici la mise en réserve du grain pour un usage futur, sans exclure l’idée de le garder en sûreté.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Les directives successives sont rendues par « qu’ils »; le parallélisme de l’hébreu est conservé sans produire une syntaxe artificielle.
