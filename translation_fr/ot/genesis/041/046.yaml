  text: וְ/יוֹסֵף֙ בֶּן שְׁלֹשִׁ֣ים שָׁנָ֔ה בְּ/עָמְד֕/וֹ לִ/פְנֵ֖י פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יֵּצֵ֤א יוֹסֵף֙ מִ/לִּ/פְנֵ֣י פַרְעֹ֔ה וַֽ/יַּעְבֹ֖ר בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: fr
  text: Joseph avait trente ans lorsqu’il se présenta devant le pharaon, roi d’Égypte. Puis il quitta la présence du pharaon et parcourut tout le pays d’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: avait trente ans
  rationale: L’expression hébraïque indiquant l’âge se rend naturellement ainsi en français moderne.
- source_word: בְּעָמְדוֹ לִפְנֵי
  choice: lorsqu’il se présenta devant
  rationale: La construction situe dans le temps la comparution de Joseph à la cour; « se présenta devant » exprime naturellement cette présence officielle.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: le pharaon, roi d’Égypte
  rationale: « Pharaon » est ici un titre royal; l’apposition conserve l’identification donnée par l’hébreu.
- source_word: וַיֵּצֵא ... מִלִּפְנֵי פַרְעֹה
  choice: Puis il quitta la présence du pharaon
  rationale: Cette formulation française idiomatique rend le départ hors de la présence royale sans suggérer seulement la sortie d’un lieu précis.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: et parcourut tout le pays d’Égypte
  rationale: « Parcourut » exprime le déplacement étendu à travers l’ensemble du territoire sans ajouter explicitement un motif administratif absent du verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est rendue par « Puis » pour assurer un enchaînement naturel, sans introduire un marqueur temporel fort. « Pays » convient ici au territoire égyptien et évite la lourdeur de « toute la terre d’Égypte ».
