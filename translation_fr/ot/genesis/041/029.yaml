  text: Voici que viennent sept années de grande abondance dans tout le pays d’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici que
  rationale: Cette tournure attire l’attention sur l’annonce tout en restant naturelle et digne en français moderne.
- source_word: שֶׁבַע שָׁנִים
  choice: sept années
  rationale: Rendu direct de l’expression temporelle; « années » convient au registre narratif et à la période annoncée.
- source_word: בָּאוֹת
  choice: viennent
  rationale: Le participe féminin pluriel présente ces années comme en train d’approcher; le présent français conserve cette vivacité et sa portée future.
- source_word: שָׂבָע גָּדוֹל
  choice: grande abondance
  rationale: Dans ce contexte, שָׂבָע désigne l’abondance des récoltes et des ressources alimentaires; גָּדוֹל en souligne l’ampleur.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: dans tout le pays d’Égypte
  rationale: Cette formulation exprime naturellement l’étendue de l’abondance à l’ensemble du territoire égyptien.
