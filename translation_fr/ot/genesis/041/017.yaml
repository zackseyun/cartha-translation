  text: וַ/יְדַבֵּ֥ר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף בַּ/חֲלֹמִ֕/י הִנְ/נִ֥י עֹמֵ֖ד עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: fr
  text: 'Alors le pharaon dit à Joseph : « Dans mon rêve, je me trouvais debout au bord du Nil[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « le fleuve ». Dans le contexte égyptien de la Genèse, ce terme désigne généralement le Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: dit
  rationale: Dans un récit introduisant un discours direct, « dit » rend naturellement la fonction de וַיְדַבֵּר, bien que le verbe signifie formellement « parler ».
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Le titre royal est couramment précédé de l’article en français moderne lorsqu’il désigne le souverain égyptien dans le récit.
- source_word: בַּחֲלֹמִי
  choice: Dans mon rêve
  rationale: Rend directement la préposition et le suffixe de première personne, dans une formulation française naturelle.
- source_word: הִנְנִי עֹמֵד
  choice: je me tenais
  rationale: Le présentatif הִנְנִי donne de la vivacité à la scène, tandis que le participe עֹמֵד décrit la position de Pharaon. Dans le récit rétrospectif d’un rêve, « je me tenais » est idiomatique et conserve l’aspect visuel sans le lourd « voici, j’étais debout ».
- source_word: עַל שְׂפַת
  choice: au bord de
  rationale: שָׂפָה signifie littéralement « lèvre, bord » ; avec un cours d’eau, « au bord de » est l’équivalent géographique naturel. עַל n’exige pas ici le calque « sur ».
- source_word: הַיְאֹר
  choice: le Nil
  rationale: Dans le contexte égyptien de la Genèse, יְאֹר désigne normalement le Nil. Le nom explicite clairement le référent, tandis qu’une note conserve le sens lexical plus littéral.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. « Le pharaon » suit l’usage français courant ; « je me tenais » restitue naturellement la scène du rêve, sans archaïsme. Le marqueur [a] est placé immédiatement après « Nil », le terme qu’il explique.
