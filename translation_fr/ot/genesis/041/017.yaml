review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le cadre (« dans mon rêve »), l’addressee, le bord du fleuve et l’identification contextuelle du Nil. Toutefois, « je me tenais au bord » n’exprime pas explicitement le participe עֹמֵד (« debout / se tenant debout »), et atténue aussi le caractère présentatif de הִנְנִי.
  naturalness: « Je me trouvais debout au bord du Nil » est une formulation moderne, fluide et narrative en français international. Elle convient au récit rétrospectif d’un rêve sans imposer le calque plus lourd « voici, j’étais debout ».
  terminology: « Le pharaon », « Joseph » et « le Nil » sont les formes françaises usuelles. La note sur « le fleuve » préserve utilement l’alternative lexicale de הַיְאֹר et son ancrage est correctement placé.
  issues:
  - severity: medium
    issue: Le sens de « debout » n’est pas exprimé.
    rationale: עֹמֵד désigne Pharaon dans la position de quelqu’un qui se tient debout. En français, « je me tenais au bord » peut décrire simplement sa présence ou sa position au bord, sans préciser qu’il était debout. « Je me trouvais debout » rend ce trait de manière naturelle.
