  text: וַ/יִּישָׁ֕ן וַֽ/יַּחֲלֹ֖ם שֵׁנִ֑ית וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹל֛וֹת בְּ/קָנֶ֥ה אֶחָ֖ד בְּרִיא֥וֹת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: fr
  text: 'Puis il se rendormit et fit un second rêve : voici que sept épis[a] poussaient sur une seule tige, bien remplis[b] et beaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne la partie de la céréale qui porte les grains.
    reason: lexical_clarification
  - marker: b
    text: Ou « vigoureux » ou « pleins ». L’adjectif hébreu décrit des épis bien développés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: Puis il se rendormit
  rationale: Le wayyiqtol fait progresser le récit. Dans le contexte d’un deuxième rêve, « se rendormit » exprime naturellement la reprise du sommeil sans alourdir la phrase.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: et fit un second rêve
  rationale: שֵׁנִית signifie « une seconde fois ». La tournure française « fit un second rêve » est idiomatique et conserve clairement la succession des deux rêves.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette formule préserve la présentation vive et soudaine de la scène introduite par הִנֵּה.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sept épis
  rationale: שִׁבֳּלִים désigne les parties terminales des céréales qui portent les grains. « Épis » est le terme français courant, précis et naturel.
- source_word: עֹלֹת
  choice: poussaient
  rationale: Le participe présente l’action en cours dans la scène du rêve. « Poussaient » rend naturellement cette progression végétale en français.
- source_word: בְּקָנֶה אֶחָד
  choice: sur une seule tige
  rationale: קָנֶה désigne ici la tige portant les épis. « Sur une seule tige » rend clairement le rapport exprimé par la préposition בְּ.
- source_word: בְּרִיאוֹת
  choice: bien remplis
  rationale: L’adjectif évoque des épis gros, sains ou pleins. « Bien remplis » convient précisément à des épis et explicite leur abondance sans employer l’inadéquat « gras ».
- source_word: וְטֹבוֹת
  choice: et beaux
  rationale: טֹבוֹת peut exprimer la bonne qualité ou la belle apparence. Avec des épis observés dans un rêve, « beaux » est naturel tout en gardant une appréciation générale favorable.
theological_decisions: []
