  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּ/בִלְעָדֶ֗י/ךָ לֹֽא יָרִ֨ים אִ֧ישׁ אֶת יָד֛/וֹ וְ/אֶת רַגְל֖/וֹ בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: fr
  text: 'Le pharaon dit à Joseph : « Je suis le pharaon. Et sans toi[a], personne ne lèvera ni la main ni le pied[b] dans tout le pays d’Égypte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à part toi ». Autrement dit, personne en Égypte ne pourra agir sans l’autorité de Joseph.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ne lèvera ni la main ni le pied », expression imagée signifiant que personne ne pourra entreprendre une action ni faire le moindre mouvement sans l’accord de Joseph.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit ; le passé simple convient au registre narratif français et rend naturellement la succession.
- source_word: אֲנִי פַרְעֹה
  choice: Je suis le pharaon
  rationale: Cette proposition nominale constitue une déclaration solennelle d’identité et d’autorité. La traduction directe en conserve la force sans ajouter « moi-même » ou « en personne ».
- source_word: וּבִלְעָדֶיךָ
  choice: Mais sans toi
  rationale: 'L’expression marque ici l’exclusion : nul ne pourra agir indépendamment de Joseph ou sans son autorisation. « Sans toi » reste proche de l’hébreu, tandis que la note explicite la nuance d’autorité.'
- source_word: אִישׁ
  choice: personne
  rationale: Dans une proposition négative, le singulier אִישׁ a un sens générique. « Personne » est naturel en français moderne et n’en restreint pas indûment la portée aux hommes.
- source_word: לֹא יָרִים
  choice: ne lèvera
  rationale: Le hiphil de רום signifie « lever ». Le futur convient à la portée déclarative du décret et permet de conserver l’image concrète de l’hébreu.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: ni la main ni le pied
  rationale: Sous la négation, la coordination française « ni… ni… » rend naturellement les deux éléments hébreux et préserve l’expression imagée plutôt que de la remplacer dans le texte par son interprétation.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: dans tout le pays d’Égypte
  rationale: Formulation française courante et fidèle à l’expression territoriale hébraïque.
