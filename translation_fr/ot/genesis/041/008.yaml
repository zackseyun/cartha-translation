base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: fr
  text: Au matin, son esprit fut troublé. Il envoya appeler tous les magiciens d’Égypte et tous les sages du pays. Pharaon leur raconta son rêve, mais personne ne put les[a] interpréter pour Pharaon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom objet en hébreu est au pluriel (« les »), bien que le nom précédent, « son rêve », soit au singulier. Il peut renvoyer aux différents éléments du rêve ou considérer l’expérience onirique dans ses diverses parties. Certaines traductions harmonisent en mettant « l’interpréter ».
    reason: Préserver le décalage grammatical et l’ambiguïté du texte hébreu.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Au matin
  rationale: Formulation narrative concise et naturelle qui conserve le repère temporel de l’hébreu.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: son esprit fut troublé
  rationale: « Esprit » rend רוּחַ sans le réduire à la seule pensée, tandis que « fut troublé » exprime l’agitation intérieure indiquée par le verbe.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: Il envoya chercher
  rationale: Cette tournure française idiomatique exprime l’envoi de messagers en vue de faire venir les personnes convoquées, sans reproduire artificiellement les deux verbes hébreux.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: tous les magiciens d’Égypte
  rationale: « Magiciens » est le terme français courant pour ces spécialistes égyptiens des arts secrets et de l’interprétation des rêves.
- source_word: כָּל חֲכָמֶיהָ
  choice: tous les sages du pays
  rationale: Le suffixe renvoie à l’Égypte. « Du pays » évite que le possessif français soit compris comme renvoyant à Pharaon, et « sages » distingue ce groupe des magiciens.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: Pharaon leur raconta son rêve
  rationale: Le nom hébreu est au singulier. « Raconta » convient naturellement à l’exposé détaillé d’un rêve.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: mais personne ne put les interpréter pour lui
  rationale: Le pronom objet hébreu est pluriel malgré le nom « rêve » au singulier. Le pluriel est conservé afin de ne pas effacer cette tension textuelle; « pour lui » rend le bénéficiaire sans répéter lourdement « Pharaon ».
