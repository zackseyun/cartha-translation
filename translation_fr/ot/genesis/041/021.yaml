  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: fr
  text: Elles entrèrent dans le ventre des autres[a], mais on ne voyait pas qu’elles y étaient entrées, et les vaches maigres avaient une apparence aussi mauvaise qu’au début. Alors je me réveillai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans leur intérieur ». Il s’agit du ventre des vaches maigres qui avaient avalé les vaches grasses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל קִרְבֶּנָה
  choice: Elles entrèrent dans le ventre des autres
  rationale: Le verbe בוא exprime ici l’entrée des vaches grasses, avalées au verset précédent, dans l’intérieur des vaches maigres. « Le ventre » rend concrètement קֶרֶב, tandis que « des autres » évite de suggérer en français qu’elles entrent dans leur propre ventre.
- source_word: וְלֹא נוֹדַע כִּי בָאוּ אֶל קִרְבֶּנָה
  choice: mais on ne pouvait pas voir qu’elles y étaient entrées
  rationale: Le niphal de ידע indique que l’ingestion ne se remarquait pas. La tournure française exprime cette imperceptibilité sans alourdir la phrase; « y » reprend le ventre des vaches maigres.
- source_word: וּמַרְאֵיהֶן רַע
  choice: celles-ci avaient aussi mauvaise apparence
  rationale: מַרְאֶה désigne l’aspect visible et רַע son caractère mauvais ou disgracieux. « Celles-ci » clarifie que le suffixe féminin pluriel renvoie aux vaches maigres qui ont mangé les autres.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: qu’au début
  rationale: La comparaison porte sur l’apparence des vaches maigres après avoir mangé, restée identique à leur apparence initiale.
- source_word: וָאִיקָץ
  choice: Alors je me réveillai
  rationale: Le wayyiqtol conclut le récit du rêve par l’action suivante. Le passé simple convient au registre narratif digne et demeure naturel à l’écrit.
