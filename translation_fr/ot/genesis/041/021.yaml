  source_fidelity: 'Le sens central est bien rendu : les vaches grasses avalées entrent dans l’intérieur des vaches maigres, sans que cette ingestion soit perceptible; l’apparence des vaches maigres demeure mauvaise comme auparavant, puis Pharaon se réveille. Toutefois, « on ne pouvait pas voir » ajoute légèrement une idée de capacité, là où le niphal de ידע exprime plus directement le fait que cela n’était pas perceptible ou apparent.'
