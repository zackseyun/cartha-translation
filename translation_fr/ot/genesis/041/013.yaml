  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: fr
  text: 'Et tout s’est passé exactement comme il nous l’avait interprété : moi, il m’a rétabli dans ma fonction, mais lui, il l’a pendu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... כֵּן הָיָה
  choice: Et tout s’est passé exactement comme…
  rationale: Cette formulation française naturelle rend l’accomplissement précis annoncé par l’interprétation, sans reproduire lourdement la répétition hébraïque de היה.
- source_word: פָּתַר לָנוּ
  choice: il nous l’avait interprété
  rationale: Dans ce contexte, פתר désigne l’interprétation des rêves. Le pronom « l’ » reprend naturellement en français le contenu de leurs rêves.
- source_word: אֹתִי הֵשִׁיב עַל־כַּנִּי
  choice: moi, il m’a rétabli dans ma fonction
  rationale: La dislocation « moi, il m’a » conserve l’accent contrastif placé sur אֹתִי. « Dans ma fonction » exprime clairement l’idiome עַל־כַּנִּי, qui évoque le retour à la position officielle antérieure.
- source_word: וְאֹתוֹ תָלָה
  choice: mais lui, il l’a pendu
  rationale: « Mais » explicite le contraste net entre les deux destins. La dislocation conserve l’emphase sur אֹתוֹ, et « pendu » rend le sens judiciaire de תלה dans ce récit.
