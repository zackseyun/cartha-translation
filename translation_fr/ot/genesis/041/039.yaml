id: GEN.41.39
reference: Genesis 41:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: fr
  text: 'Alors Pharaon dit à Joseph : « Puisque[a] Dieu t’a fait connaître tout cela, il n’y a personne d’aussi perspicace et sage que toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Après que Dieu t’a fait connaître tout cela ». La préposition hébraïque signifie plus formellement « après », mais elle exprime ici le fondement de la conclusion de Pharaon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: פַּרְעֹה
  choice: Pharaon
  rationale: Forme française traditionnelle et courante du titre royal égyptien.
- source_word: אַחֲרֵי
  choice: Puisque
  rationale: La préposition signifie formellement « après », mais elle introduit ici le fait sur lequel Pharaon fonde sa conclusion ; « puisque » rend clairement cette valeur logique en français.
- source_word: הוֹדִיעַ
  choice: t’a fait connaître
  rationale: Le hiphil de ידע exprime l’action de faire savoir ou de faire connaître ; cette traduction conserve la nuance causative.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte et la construction verbale indiquent ici un référent singulier.
- source_word: אֶת כָּל זֹאת
  choice: tout cela
  rationale: Expression française concise qui renvoie à l’ensemble de l’interprétation et des explications données par Joseph.
- source_word: אֵין
  choice: il n’y a personne
  rationale: Rendu idiomatique en français moderne de la négation existentielle.
- source_word: נָבוֹן
  choice: perspicace
  rationale: Le terme désigne une personne douée de discernement et d’intelligence ; « perspicace » convient à la capacité que Joseph vient de manifester.
- source_word: וְחָכָם
  choice: et sage
  rationale: Rendu courant de חכם, conservant la coordination avec נָבוֹן.
- source_word: כָּמוֹךָ
  choice: d’aussi … que toi
  rationale: Cette construction comparative est naturelle après « il n’y a personne » et rend fidèlement « comme toi ».
theological_decisions:
- issue: Référent de אֱלֹהִים dans les paroles de Pharaon
  choice: Dieu
  alternative: les dieux
  rationale: Bien que la forme אֱלֹהִים puisse être morphologiquement plurielle dans certains contextes, le contexte immédiat présente Pharaon reconnaissant la divinité qui a révélé ces choses à Joseph ; le singulier « Dieu » correspond le mieux à l’usage hébreu dans ce verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe singulière de Pharaon à Joseph. La formulation conserve les deux qualités distinctes, le discernement et la sagesse.
