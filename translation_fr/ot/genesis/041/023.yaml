  source_fidelity: 'Le texte rend tous les éléments du verset hébreu : l’introduction vivante וְהִנֵּה, les sept épis, les deux qualificatifs distincts צְנֻמוֹת et דַּקּוֹת, l’atteinte causée par le vent d’est, ainsi que la croissance successive « après eux ». « Rabougris » est un choix défendable pour le terme rare et nuancé צְנֻמוֹת; la note signale correctement l’incertitude lexicale sans la résoudre de manière excessive.'
