  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: fr
  text: Et voici que sept épis rabougris[a], maigres et brûlés par le vent d’est poussaient après eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sens du mot hébreu est incertain; on traduit aussi « flétris » ou « desséchés ».
    reason: lexical_uncertainty
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la force déictique et vivante de l’interjection hébraïque tout en restant naturel dans un récit de rêve en français moderne.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sept épis
  rationale: שִׁבֳּלִים désigne ici les épis portant le grain, et non les tiges entières.
- source_word: צְנֻמוֹת
  choice: rabougris
  rationale: Rend l’idée d’épis rétrécis ou flétris sans la confondre avec l’adjectif suivant; le sens précis de ce terme rare demeure toutefois incertain.
- source_word: דַּקּוֹת
  choice: maigres
  rationale: Exprime la faible épaisseur et le manque de substance des épis, tout en distinguant cet adjectif de צְנֻמוֹת.
- source_word: שְׁדֻפוֹת קָדִים
  choice: brûlés par le vent d’est
  rationale: Décrit de façon claire les dégâts causés aux céréales par le vent oriental chaud et desséchant.
- source_word: צֹמְחוֹת
  choice: poussaient
  rationale: L’imparfait français restitue la valeur progressive du participe hébreu dans la scène du rêve.
- source_word: אַחֲרֵיהֶם
  choice: après eux
  rationale: Maintient la succession des nouveaux épis par rapport aux sept épis précédents, auxquels renvoie le masculin pluriel français.
