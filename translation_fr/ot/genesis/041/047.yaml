  text: וַ/תַּ֣עַשׂ הָ/אָ֔רֶץ בְּ/שֶׁ֖בַע שְׁנֵ֣י הַ/שָּׂבָ֑ע לִ/קְמָצִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: fr
  text: Pendant les sept années d’abondance, la terre produisit à pleines poignées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par poignées » ou « en poignées ». Le mot hébreu évoque ce que peut contenir une main fermée et souligne ici l’abondance extraordinaire de la récolte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: produisit
  rationale: Avec « la terre » pour sujet dans ce contexte agricole, עשה (« faire ») désigne naturellement ce que la terre produit.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le terme renvoie ici aux terres cultivées de l’Égypte, sans désigner nécessairement la planète entière.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: pendant les sept années d’abondance
  rationale: Cette formulation exprime clairement la durée et rend שׂבע par le terme courant « abondance ».
- source_word: לִקְמָצִים
  choice: à pleines poignées
  rationale: קְמָץ désigne une poignée ou une pleine main. L’expression française conserve cette image concrète tout en évoquant naturellement une production extrêmement abondante.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. « À pleines poignées » préserve l’image hébraïque dans une tournure française naturelle, sans la remplacer par une interprétation plus abstraite comme « en grande quantité ».
