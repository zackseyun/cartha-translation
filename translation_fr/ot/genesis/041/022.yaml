  text: וָ/אֵ֖רֶא בַּ/חֲלֹמִ֑/י וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹלֹ֛ת בְּ/קָנֶ֥ה אֶחָ֖ד מְלֵאֹ֥ת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: fr
  text: Et dans mon rêve, voici que sept épis[a] montaient sur une seule tige, pleins et beaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne l’épi, la partie supérieure de la céréale qui porte les grains.
    reason: Précision lexicale sur שִׁבֹּלֶת.
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Puis, … j’ai vu
  rationale: Le wayyiqtol poursuit le récit de Pharaon. « Puis » rend l’enchaînement narratif, tandis que le passé composé convient à une narration orale en français moderne.
- source_word: בַּחֲלֹמִי
  choice: dans mon rêve
  rationale: Rend directement la préposition, le nom et le suffixe de première personne, dans une formulation française naturelle.
- source_word: וְהִנֵּה
  choice: 'ceci :'
  rationale: La construction présentative avec deux-points attire vivement l’attention sur la scène découverte, sans recourir au « voici » plus marqué ou moins naturel dans cette phrase.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: sept épis
  rationale: Dans ce contexte agricole, שִׁבֳּלִים désigne les parties de la céréale qui portent les grains. « Épis » est le terme français précis et courant.
- source_word: עֹלֹת
  choice: poussaient
  rationale: Le participe féminin pluriel présente l’action en cours. Pour des épis, « poussaient » exprime naturellement leur montée et leur croissance.
- source_word: בְּקָנֶה אֶחָד
  choice: sur une seule tige
  rationale: קָנֶה désigne ici la tige de la céréale. « Une seule » souligne l’unité exprimée par אֶחָד.
- source_word: מְלֵאֹת
  choice: pleins
  rationale: « Pleins » reste proche du sens de l’adjectif hébreu et décrit des épis bien remplis de grains.
- source_word: וְטֹבוֹת
  choice: et beaux
  rationale: Dans la description visible des épis, « beaux » rend idiomatiquement leur bonne qualité tout en conservant le jugement favorable de טוֹב.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure présentative suivie de deux-points restitue la vivacité de וְהִנֵּה, et l’imparfait conserve l’aspect descriptif du participe hébreu.
