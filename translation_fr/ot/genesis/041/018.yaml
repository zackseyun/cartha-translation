  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִ/יפֹ֣ת תֹּ֑אַר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: fr
  text: Et voici que sept vaches montaient du Nil[a], bien en chair[b] et belles d’aspect ; elles paissaient parmi les roseaux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du fleuve » ; dans ce contexte égyptien, le mot hébreu désigne très probablement le Nil.
    reason: lexical_alternative
  - marker: b
    text: Ou « vigoureuses de corps » ou « grasses » ; l’hébreu les décrit littéralement comme saines ou pleines de chair.
    reason: lexical_alternative
  - marker: c
    text: Ou « dans les herbes du marais » ; le terme hébreu désigne la végétation des zones humides bordant le Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve le marqueur discursif vif qui introduit la scène du rêve, dans une formulation française naturelle et digne.
- source_word: מִן הַיְאֹר
  choice: du Nil
  rationale: Dans le cadre égyptien de la Genèse, יְאֹר désigne naturellement le Nil plutôt qu’un cours d’eau indéterminé.
- source_word: עֹלֹת
  choice: montaient
  rationale: L’imparfait rend la valeur progressive du participe hébreu et présente l’action en cours dans le récit du rêve.
- source_word: שֶׁבַע פָּרוֹת
  choice: sept vaches
  rationale: פָּרוֹת désigne précisément des bovins femelles ; « vaches » est exact et courant.
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: bien en chair
  rationale: Cette expression française naturelle conserve l’idée hébraïque d’un corps plein et vigoureux sans la réduire explicitement à l’embonpoint ou à une bonne alimentation.
- source_word: וִיפֹת תֹּאַר
  choice: belles d’aspect
  rationale: Rend l’apparence agréable ou la belle conformation exprimée par l’hébreu dans un français idiomatique.
- source_word: וַתִּרְעֶינָה
  choice: elles se mirent à paître
  rationale: Le verbe désigne le fait de paître ; le passé simple périphrastique marque naturellement la progression narrative après la scène décrite à l’imparfait.
- source_word: בָּאָחוּ
  choice: parmi les roseaux
  rationale: Le terme renvoie à la végétation humide des bords du Nil ; « parmi les roseaux » communique clairement ce cadre sans employer le trop générique « pré ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » maintient la vivacité du rêve ; l’alternance entre l’imparfait « montaient » et « se mirent à paître » restitue le déroulement de la scène. Les notes préservent les principales possibilités lexicales sans surcharger le verset.
