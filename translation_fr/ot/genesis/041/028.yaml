  text: ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל פַּרְעֹ֑ה אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: fr
  text: 'Voilà ce que j’ai dit à Pharaon : ce que Dieu va faire, il l’a montré à Pharaon[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que Dieu fait ». Le participe hébreu peut désigner une action présente ou imminente ; dans ce contexte d’interprétation des rêves, il renvoie aux événements que Dieu va accomplir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: Voilà ce que
  rationale: Littéralement « c’est la chose/parole » ; cette tournure identificatrice reprend naturellement en français l’explication donnée au verset précédent.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַּרְעֹה
  choice: j’ai dit à Pharaon
  rationale: En français actuel, « dire à » exprime naturellement ici l’acte de parole ; « parler à Pharaon » risquerait de faire attendre un complément supplémentaire.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Malgré l’article hébreu, le terme désigne ici Dieu comme référent personnel déterminé ; le français emploie naturellement « Dieu » sans article.
- source_word: עֹשֶׂה
  choice: est en train de faire
  rationale: Le participe hébreu présente l’action comme en cours ou envisagée dans son déroulement. Cette traduction en conserve la valeur présente, tandis que le contexte peut lui donner une portée imminente.
- source_word: הֶרְאָה אֶת־פַּרְעֹה
  choice: a montré à Pharaon
  rationale: Le hiphil de ראה signifie « faire voir, montrer ». Le passé composé convient à la révélation déjà accordée par les rêves.
theological_decisions:
- issue: Valeur temporelle de עֹשֶׂה dans l’annonce de l’action divine
  choice: ce qu’il est en train de faire
  alternative: ce qu’il va faire / ce qu’il est sur le point de faire
  rationale: Le participe ne marque pas à lui seul un futur explicite. Le texte principal en préserve la forme présente, et la note signale que le contexte prophétique autorise une compréhension imminente.
- issue: Désignation הָאֱלֹהִים dans la bouche de Joseph
  choice: Dieu
  alternative: le Dieu
  rationale: « Dieu » est la formulation française normale pour ce référent, sans ajouter de précision confessionnelle absente du texte.
translation_notes:
  register: Français international moderne, simple et digne. « Voilà ce que j’ai dit » évite le calque lourd « Ceci est la chose dont j’ai parlé », tout en conservant la reprise explicative du texte hébreu.
