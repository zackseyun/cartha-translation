base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: fr
  text: Pharaon donna à Joseph le nom de Tsafnath-Panéah[a]. Il lui donna pour femme Asnath, fille de Potiphéra, prêtre d’On[b]. Puis Joseph parcourut le pays d’Égypte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi la translittération « Tsafnath-Paenéah ». Le sens de ce nom égyptien est incertain, et les traductions proposées varient.
    reason: Variante de translittération et incertitude lexicale.
  - marker: b
    text: On est la ville égyptienne connue plus tard sous le nom grec d’Héliopolis.
    reason: Repère historique et géographique.
  - marker: c
    text: 'Littéralement : « sortit sur le pays d’Égypte »; on peut aussi comprendre : « se rendit dans tout le pays d’Égypte ».'
    reason: Préservation de l’ambiguïté de עַל et de la formulation hébraïque.
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם יוֹסֵף
  choice: Pharaon donna à Joseph le nom de
  rationale: Le verbe קרא employé avec שֵׁם exprime l’acte de nommer. Cette tournure française naturelle conserve explicitement l’idée du nom donné, sans reproduire servilement l’idiome hébreu « appeler le nom de Joseph ».
- source_word: צָפְנַת פַּעְנֵחַ
  choice: Tsafnath-Panéah
  rationale: Ce nom égyptien, transmis par l’hébreu, est d’étymologie incertaine. Il est donc translittéré plutôt que traduit; le trait d’union rend ses deux éléments.
- source_word: וַיִּתֶּן לוֹ ... לְאִשָּׁה
  choice: Il lui donna pour femme
  rationale: La formulation rend directement l’arrangement matrimonial exprimé par נתן et לְאִשָּׁה, dans un français actuel et digne.
- source_word: אָסְנַת
  choice: Asnath
  rationale: Translittération française courante du nom propre.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: fille de Potiphéra
  rationale: La relation filiale est rendue explicitement, et le nom propre suit une translittération française usuelle.
- source_word: כֹּהֵן אֹן
  choice: prêtre d’On
  rationale: כֹּהֵן désigne ici un prêtre; On est conservé sous la forme du texte hébreu plutôt que remplacé dans le corps du verset par son nom grec ultérieur.
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: Puis Joseph parcourut le pays d’Égypte
  rationale: Dans ce contexte, la combinaison de יצא et עַל décrit vraisemblablement le déplacement de Joseph à travers le territoire égyptien. « Parcourut » est idiomatique en français, tandis qu’une note conserve la formulation plus littérale et l’ambiguïté de la préposition.
