  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים דַּקּ֖וֹת וּ/שְׁדוּפֹ֣ת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: fr
  text: Et voici que sept épis maigres et desséchés par le vent d’est[a] poussaient après eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frappés par le vent d’est ».
    reason: La forme hébraïque peut évoquer des épis frappés, brûlés ou desséchés par le vent oriental; la variante conserve cette amplitude lexicale.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve le marqueur narratif vif qui introduit soudain une nouvelle image du rêve, dans une tournure française naturelle et digne.
- source_word: שֶׁבַע
  choice: sept
  rationale: Rend directement le nombre cardinal.
- source_word: שִׁבֳּלִים
  choice: épis
  rationale: Désigne précisément les épis de céréale, plutôt que les tiges entières.
- source_word: דַּקּוֹת
  choice: maigres
  rationale: Décrit des épis peu fournis; « maigres » est naturel dans ce contexte agricole et maintient le contraste avec les beaux épis du verset précédent.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: et desséchés par le vent d’est
  rationale: Le participe évoque les dégâts causés par un vent oriental chaud et destructeur. « Desséchés » exprime clairement cet effet sans surinterpréter sa nature exacte.
- source_word: צֹמְחוֹת
  choice: poussaient
  rationale: L’imparfait rend l’action en cours exprimée par le participe et préserve le caractère visuel de la scène.
- source_word: אַחֲרֵיהֶן
  choice: après eux
  rationale: Renvoie aux sept épis du verset précédent et laisse subsister la nuance à la fois temporelle et spatiale de l’hébreu.
theological_decisions: []
