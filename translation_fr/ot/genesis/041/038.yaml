source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: fr
  text: 'Alors le pharaon dit à ses serviteurs : « Pourrions-nous trouver un homme comme celui-ci, qui ait en lui l’esprit de Dieu[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de Dieu » ou « un esprit divin ». L’expression hébraïque peut se comprendre de plusieurs manières.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français moderne.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Le nom commun avec article est la désignation française usuelle du souverain égyptien.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Rendu lexical direct, approprié au cadre de la cour sans préciser indûment leur rang administratif.
- source_word: הֲנִמְצָא
  choice: Pourrions-nous trouver
  rationale: La question rhétorique à la première personne du pluriel est rendue par une formulation délibérative naturelle.
- source_word: כָזֶה אִישׁ
  choice: un homme comme celui-ci
  rationale: Cette formulation conserve à la fois le substantif masculin singulier, qui désigne Joseph, et la valeur démonstrative de כָזֶה.
- source_word: אֲשֶׁר … בּוֹ
  choice: qui ait en lui
  rationale: La relative française conserve explicitement l’idée locative de בּוֹ (« en lui »), avec le subjonctif attendu après la recherche d’un être présentant cette qualité.
- source_word: רוּחַ אֱלֹהִים
  choice: l’esprit de Dieu
  rationale: Cette traduction rend directement le syntagme construit hébreu. La minuscule à « esprit » évite de trancher typographiquement une identification personnelle que la forme hébraïque n’impose pas ; l’ambiguïté est signalée en note.
theological_decisions:
- issue: Identification précise de רוּחַ אֱלֹהִים
  choice: l’esprit de Dieu
  alternative: un esprit divin
  rationale: Dans le récit, la capacité exceptionnelle de Joseph est rattachée à Dieu, mais les paroles du pharaon et l’absence d’article dans le syntagme hébreu permettent aussi une compréhension moins définie. Le texte principal garde la lecture directe sans majuscule interprétative, et la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. « Pourrions-nous » conserve la délibération collective du pharaon et de ses serviteurs ; « qui ait en lui » maintient la structure locative de l’hébreu sans lourdeur excessive.
