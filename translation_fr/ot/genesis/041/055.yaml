  text: וַ/תִּרְעַב֙ כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּצְעַ֥ק הָ/עָ֛ם אֶל פַּרְעֹ֖ה לַ/לָּ֑חֶם וַ/יֹּ֨אמֶר פַּרְעֹ֤ה לְ/כָל מִצְרַ֨יִם֙ לְכ֣וּ אֶל יוֹסֵ֔ף אֲשֶׁר יֹאמַ֥ר לָ/כֶ֖ם תַּעֲשֽׂוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: fr
  text: 'Toute l’Égypte se mit à souffrir de la faim, et le peuple cria vers le pharaon pour avoir du pain. Le pharaon dit à tous les Égyptiens : « Allez trouver Joseph et faites tout ce qu’il vous dira. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: se mit à souffrir de la faim
  rationale: Le verbe רעב exprime ici l’entrée dans un état de faim. Cette formulation conserve la progression narrative tout en restant naturelle en français.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: toute l’Égypte
  rationale: Littéralement « tout le pays d’Égypte ». En français, « toute l’Égypte » rend naturellement le territoire et sa population dans ce contexte, sans lourdeur.
- source_word: וַיִּצְעַק הָעָם
  choice: le peuple cria vers
  rationale: צעק désigne un cri pressant suscité par la détresse. « Cria vers » conserve à la fois l’intensité et l’orientation de l’appel.
- source_word: לַלָּחֶם
  choice: pour avoir du pain
  rationale: לֶחֶם signifie littéralement « pain » et peut désigner plus largement la nourriture. Le sens concret est conservé, avec « avoir » pour rendre idiomatiquement la demande.
- source_word: לְכָל מִצְרַיִם
  choice: à tous les Égyptiens
  rationale: Le nom du pays désigne collectivement ses habitants. En français moderne, l’explicitation « tous les Égyptiens » évite l’adresse peu naturelle « à toute l’Égypte ».
- source_word: לְכוּ אֶל יוֹסֵף
  choice: Allez trouver Joseph
  rationale: « Allez trouver » exprime naturellement en français le mouvement vers une personne afin de s’adresser à elle.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: faites tout ce qu’il vous dira
  rationale: Cette tournure idiomatique respecte l’ordre donné et la portée ouverte de אֲשֶׁר, sans reproduire une dislocation hébraïque artificielle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’article est omis devant « pharaon », traité comme un titre dans « vers le pharaon » puis naturellement repris dans « Le pharaon ». La formulation privilégie une équivalence optimale, avec une syntaxe française fluide sans effacer les images concrètes du texte hébreu.
