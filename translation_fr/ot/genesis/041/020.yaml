  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: fr
  text: Les vaches maigres et laides mangèrent les sept premières vaches bien portantes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les vaches décharnées et d’aspect repoussant […] les sept premières vaches grasses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: dévorèrent
  rationale: Le verbe אכל signifie « manger ». Dans cette scène de rêve, « dévorèrent » exprime naturellement l’engloutissement complet, sans nécessiter l’ajout d’un adverbe.
- source_word: הַפָּרוֹת
  choice: les vaches
  rationale: Le nom féminin pluriel désigne précisément des bovins femelles; « vaches » est donc plus exact que le terme générique « bétail ».
- source_word: הָרַקּוֹת
  choice: maigres
  rationale: L’adjectif décrit des bêtes décharnées ou sans chair; « maigres » est clair, naturel et convient au contraste avec les vaches bien portantes.
- source_word: וְהָרָעוֹת
  choice: et laides
  rationale: Dans ce contexte, רעות qualifie leur mauvais aspect et non une méchanceté morale. « Laides » rend ce sens visuel en français courant.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: les sept […] vaches
  rationale: Le marqueur de l’objet direct, le nombre et le nom sont rendus directement; l’ordre français place naturellement les qualificatifs autour du groupe nominal.
- source_word: הָרִאשֹׁנוֹת
  choice: premières
  rationale: L’adjectif distingue les sept vaches apparues auparavant dans le rêve; « premières » rend clairement cette succession.
- source_word: הַבְּרִיאֹת
  choice: bien portantes
  rationale: Le terme désigne ici des bêtes robustes, grasses ou en bonne santé. « Bien portantes » conserve cette amplitude mieux que le seul « grasses ».
