  text: וַ/נַּֽחַלְמָ֥/ה חֲל֛וֹם בְּ/לַ֥יְלָה אֶחָ֖ד אֲנִ֣י וָ/ה֑וּא אִ֛ישׁ כְּ/פִתְר֥וֹן חֲלֹמ֖/וֹ חָלָֽמְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: fr
  text: Lui et moi, nous avons fait des rêves la même nuit ; chacun a fait un rêve correspondant à son interprétation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: Nous avons fait un rêve
  rationale: Le français idiomatique dit « faire un rêve » plutôt que « rêver un rêve ». Le passé composé convient au récit oral rétrospectif et rend l’événement narratif introduit par le wayyiqtol.
- source_word: בְּלַיְלָה אֶחָד
  choice: la même nuit
  rationale: Littéralement « en une nuit » ; dans le contexte, אֶחָד souligne que les deux hommes ont rêvé au cours d’une seule et même nuit. « La même nuit » exprime naturellement cette coïncidence temporelle.
- source_word: אֲנִי וָהוּא
  choice: lui et moi
  rationale: Cette tournure française naturelle conserve la mention explicite des deux participants, sans reproduire artificiellement l’ordre hébreu « moi et lui ».
- source_word: אִישׁ
  choice: chacun de nous
  rationale: אִישׁ a ici une valeur distributive. « Chacun de nous » indique clairement que chaque homme a eu son propre rêve.
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: qui correspondait à son interprétation
  rationale: La préposition כְּ exprime une correspondance entre chaque rêve et son interprétation. Cette formulation française préserve le sens sans laisser entendre que l’interprétation aurait causé ou précédé le rêve.
- source_word: חָלָמְנוּ
  choice: a fait un rêve
  rationale: Le verbe final reprend l’action de rêver dans une construction distributive. La répétition française clarifie que chacun a eu un rêve distinct.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe distributive hébraïque est rendue clairement, tout en conservant la relation quelque peu énigmatique entre le rêve et son interprétation.
