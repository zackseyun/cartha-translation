  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: fr
  text: 'Joseph donna à son premier-né le nom de Manassé[a], car, dit-il : « Dieu m’a fait oublier toute ma peine[b] et toute la maison de mon père[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Manassé fait écho, en hébreu, à l’expression « faire oublier ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi se traduire par « souffrance », « malheur » ou « dur labeur ».
    reason: lexical_alternative
  - marker: c
    text: Dans la langue hébraïque, « la maison de mon père » désigne la famille ou le groupe familial rattaché au père.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: donna ... le nom de
  rationale: En français actuel, « donner le nom de » restitue naturellement la construction hébraïque signifiant nommer, sans le calque peu idiomatique « appeler le nom de ».
- source_word: הַבְּכוֹר
  choice: au premier-né
  rationale: Le substantif explicite « premier-né » est conservé, car il peut avoir une portée narrative; le contexte indique qu’il s’agit du fils de Joseph.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu; le jeu sonore avec נַשַּׁנִי est signalé en note.
- source_word: כִּי
  choice: car il dit
  rationale: La conjonction introduit l’explication du nom. « Il dit » explicite sobrement la parole sous-entendue et introduit naturellement la citation.
- source_word: נַשַּׁנִי
  choice: m’a fait oublier
  rationale: Cette tournure exprime le sens causatif du verbe et maintient le lien étymologique narratif avec Manassé.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte et le verbe au singulier indiquent le Dieu unique; « Dieu » est la traduction française usuelle.
- source_word: כָּל עֲמָלִי
  choice: toute ma peine
  rationale: עָמָל peut désigner peine, souffrance, malheur ou labeur. « Toute ma peine » est naturel, digne et assez large pour préserver cette gamme de sens.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: et toute la maison de mon père
  rationale: La formulation conserve l’expression hébraïque de parenté et sa tension, sans la réduire à des individus précis ni la réinterpréter comme le seul souvenir douloureux de la famille.
theological_decisions:
- issue: Portée de l’affirmation selon laquelle Joseph a oublié la maison de son père
  choice: Conserver directement « Dieu m’a fait oublier ... toute la maison de mon père »
  alternative: Paraphraser comme l’oubli de la douleur liée à sa famille ou comme un simple soulagement affectif
  rationale: L’hébreu formule sans atténuation cette explication donnée par Joseph. La traduction garde donc l’ambiguïté et la tension théologique et narrative au lieu de les résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’hébreu là où elle porte un enjeu narratif, tout en évitant les calques maladroits. Les trois appels de note [a], [b] et [c] figurent dans le texte.
