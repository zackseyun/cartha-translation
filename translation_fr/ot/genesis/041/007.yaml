  text: וַ/תִּבְלַ֨עְנָה֙ הַ/שִּׁבֳּלִ֣ים הַ/דַּקּ֔וֹת אֵ֚ת שֶׁ֣בַע הַֽ/שִּׁבֳּלִ֔ים הַ/בְּרִיא֖וֹת וְ/הַ/מְּלֵא֑וֹת וַ/יִּיקַ֥ץ פַּרְעֹ֖ה וְ/הִנֵּ֥ה חֲלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: fr
  text: 'Les épis maigres engloutirent les sept épis vigoureux et pleins. Alors Pharaon se réveilla, et voici : c’était un rêve.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: engloutirent
  rationale: Rend directement l’idée de « mettre en avalant » et conserve l’image vive et surnaturelle du rêve.
- source_word: הַשִּׁבֳּלִים
  choice: les épis
  rationale: Dans ce contexte, le terme désigne la partie de la céréale qui porte les grains, non la tige entière ; « épis » est le terme français naturel et précis.
- source_word: הַדַּקּוֹת
  choice: maigres
  rationale: Le mot signifie « minces ». Pour des épis mal formés, « maigres » est idiomatique et fait écho au contraste narratif, sans les confondre avec les vaches.
- source_word: שֶׁבַע
  choice: sept
  rationale: Rend directement le nombre cardinal.
- source_word: הַבְּרִיאוֹת
  choice: vigoureux
  rationale: L’adjectif évoque un état sain, robuste ou bien nourri. Appliqué aux épis, « vigoureux » est naturel et préserve cette nuance positive.
- source_word: וְהַמְּלֵאוֹת
  choice: et pleins
  rationale: Rend formellement l’adjectif « pleins » sans introduire l’idée distincte de maturité.
- source_word: וַיִּיקַץ
  choice: se réveilla
  rationale: Formulation narrative courante et digne en français moderne.
- source_word: וְהִנֵּה חֲלוֹם
  choice: ce n’était qu’un rêve
  rationale: 'Exprime naturellement en français la prise de conscience soudaine portée par la formule hébraïque elliptique « et voici : un rêve ».'
theological_decisions: []
translation_notes:
  register: Français narratif moderne, clair et digne. L’image étrange des épis qui engloutissent d’autres épis est conservée. L’article devant « pharaon » est maintenu selon l’usage français courant pour le titre dans ce récit.
