source:
  edition: WLC
  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: fr
  text: Puis viendront après elles sept années de famine, et toute l’abondance du pays d’Égypte tombera dans l’oubli ; la famine épuisera le pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détruira le pays ». Le verbe hébreu peut exprimer l’idée d’épuiser entièrement, d’anéantir ou de mener à son terme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: Puis viendront
  rationale: Le parfait qal avec waw prend ici une valeur future dans l’annonce prophétique. « Puis » exprime naturellement la succession, et « viendront » rend en français courant l’apparition des années annoncées.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: sept années de famine
  rationale: Cette formulation française naturelle reproduit précisément la chaîne construite hébraïque ; « famine » convient au contexte national et agricole.
- source_word: אַחֲרֵיהֶן
  choice: après elles
  rationale: Le suffixe féminin pluriel renvoie aux sept années d’abondance du verset précédent ; le pronom en conserve explicitement le genre en français.
- source_word: וְנִשְׁכַּח
  choice: tombera dans l’oubli
  rationale: Le nifal de שׁכח exprime ici le fait d’être oublié. Cette tournure passive de sens est naturelle et digne en français.
- source_word: כָּל הַשָּׂבָע
  choice: toute l’abondance
  rationale: שָׂבָע désigne la satiété, la plénitude ou l’abondance. « Abondance » garde la portée générale du mot sans la limiter aux seules réserves de céréales.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: Avec « toute l’abondance », le complément « du pays d’Égypte » est idiomatique en français et conserve la désignation géographique complète.
- source_word: וְכִלָּה
  choice: épuisera
  rationale: Le piel de כלה peut évoquer l’achèvement, la consommation complète ou la ruine. Appliqué à une famine et à un pays, « épuisera » exprime une dévastation qui consume ses ressources tout en préservant l’ambiguïté sur l’étendue exacte de la destruction.
- source_word: הָרָעָב
  choice: la famine
  rationale: L’article renvoie à la famine déjà annoncée ; la reprise maintient la cohésion du verset.
- source_word: אֶת הָאָרֶץ
  choice: le pays
  rationale: אָרֶץ désigne ici le territoire égyptien. « Pays » évite une répétition lourde de « pays d’Égypte » tout en gardant la portée territoriale.
theological_decisions: []
