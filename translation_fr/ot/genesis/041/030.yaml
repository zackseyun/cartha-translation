  register: Français international moderne, clair et soutenu sans archaïsme. La structure en deux propositions coordonnées suit le mouvement de l’hébreu. Le renvoi pronominal féminin « après elles » conserve le lien avec les sept années d’abondance mentionnées auparavant.
