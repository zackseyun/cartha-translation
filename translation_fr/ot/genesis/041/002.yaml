  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: fr
  text: Et voici que sept vaches montaient du Nil, belles à voir et grasses, et elles paissaient dans les roseaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve le marqueur narratif vif qui attire l’attention sur la scène du rêve, dans un français naturel et digne.
- source_word: הַיְאֹר
  choice: du Nil
  rationale: Dans le contexte égyptien de la Genèse, יְאֹר désigne spécifiquement le Nil plutôt qu’un cours d’eau indéterminé.
- source_word: עֹלֹת
  choice: montaient
  rationale: L’emploi du participe présente l’action en cours; l’imparfait restitue naturellement cet aspect visuel et progressif.
- source_word: פָּרוֹת
  choice: vaches
  rationale: Le terme hébreu désigne des bovins femelles; « vaches » est direct, précis et courant.
- source_word: יְפוֹת מַרְאֶה
  choice: belles à voir
  rationale: Rend simplement et naturellement l’idée d’une apparence agréable, sans alourdir la phrase.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: grasses
  rationale: Le syntagme souligne leur corpulence et leur chair abondante. « Grasses » garde cette image concrète, importante pour le contraste du rêve.
- source_word: וַתִּרְעֶינָה
  choice: puis elles se mirent à brouter
  rationale: La forme narrative fait avancer la scène après leur montée; cette formulation française marque clairement la succession tout en exprimant le pâturage.
- source_word: בָּאָחוּ
  choice: parmi les roseaux
  rationale: Le mot désigne la végétation marécageuse liée aux rives du Nil; « parmi les roseaux » est précis et idiomatique.
