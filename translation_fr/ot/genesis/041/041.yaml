  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְ/ךָ֔ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: fr
  text: 'Le pharaon dit à Joseph : « Vois, je t’ai établi sur tout le pays d’Égypte. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français; il n’est pas nécessaire d’expliciter la coordination par « et ».
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Titre royal usuel en français, employé avec l’article défini dans ce contexte.
- source_word: אֶל יוֹסֵף
  choice: à Joseph
  rationale: Rend directement l’interlocuteur introduit par אֶל et conserve la forme française traditionnelle du nom.
- source_word: רְאֵה
  choice: Regarde
  rationale: L’impératif attire l’attention sur la déclaration solennelle qui suit. « Regarde » reste direct et naturel, sans l’archaïsme de « voici » pris comme interjection.
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: je t’établis sur
  rationale: Littéralement, le verbe signifie « donner », mais avec עַל dans ce contexte d’investiture, l’expression confère une autorité. Le présent français performatif traduit naturellement l’acte officiel accompli par la déclaration, tout en laissant entendre son effet immédiat.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: tout le pays d’Égypte
  rationale: « Tout » préserve l’étendue complète de l’autorité, et « pays d’Égypte » rend naturellement אֶרֶץ מִצְרַיִם en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple porte la narration, tandis que le présent performatif « je t’établis » donne à la proclamation royale sa force immédiate. Aucun marqueur de note n’est requis.
