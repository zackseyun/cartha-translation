source:
  edition: WLC
  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: fr
  text: Cette nourriture servira de réserve au pays pour les sept années de famine qui auront lieu en Égypte, afin que le pays ne soit pas détruit par la famine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement : « ne soit pas retranché » ; dans ce contexte, il s’agit de ne pas être ruiné ou détruit par la famine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: constituera
  rationale: Le parfait avec waw a ici une valeur prospective et exprime le résultat attendu de la mesure proposée par Joseph.
- source_word: הָאֹכֶל
  choice: cette nourriture
  rationale: Le nom désigne la nourriture au sens large et renvoie ici aux denrées recueillies au verset précédent, sans limiter explicitement le sens au seul grain.
- source_word: לְפִקָּדוֹן
  choice: une réserve
  rationale: Le terme désigne ce qui est confié à la garde ou conservé en prévision d’un besoin. « Réserve » convient naturellement au contexte administratif.
- source_word: לָאָרֶץ
  choice: pour le pays
  rationale: אֶרֶץ désigne ici l’Égypte comme territoire ou pays; « pays » est plus naturel en français dans ce contexte.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: pendant les sept années de famine
  rationale: La préposition introduit la période future en vue de laquelle la réserve est constituée. « Pendant » rend clairement sa fonction durant ces sept années déterminées.
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: qui auront lieu en Égypte
  rationale: La relative annonce la survenue future des années de famine. « En Égypte » rend naturellement בְּאֶרֶץ מִצְרָיִם sans perdre la référence géographique.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ
  choice: afin que le pays ne soit pas anéanti
  rationale: Le niphal de כרת signifie littéralement « être retranché/coupé ». Appliqué au pays sous l’effet de la famine, il exprime ici sa ruine ou son anéantissement; la note conserve l’image littérale.
- source_word: בָּרָעָב
  choice: par la famine
  rationale: La préposition indique ici la cause ou le moyen de l’anéantissement redouté.
