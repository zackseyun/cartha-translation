revisions:
- from: Cette nourriture constituera une réserve pour le pays pendant les sept années de famine qui auront lieu en Égypte[a], afin que le pays ne soit pas anéanti par la famine[b].
  to: Cette nourriture servira de réserve au pays pour les sept années de famine qui auront lieu en Égypte, afin que le pays ne soit pas détruit par la famine[b].
  rationale: La révision rend plus explicitement la réserve destinée aux années de famine, améliore légèrement la fluidité et supprime une note non nécessaire. La note restante conserve l’ambiguïté et l’image littérale du niphal de כרת, tandis que le texte principal emploie une formulation française claire et contextuellement fidèle.
