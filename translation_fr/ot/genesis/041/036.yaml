    issue: « pendant les sept années de famine » affaiblit la relation de destination exprimée par לְ.
    rationale: La réserve est constituée en prévision des sept années de famine, non simplement décrite comme existant ou étant utilisée durant cette période. « Pour les sept années » conserve cette orientation et reste idiomatique.
  - severity: low
    issue: La note a ne documente qu’une légère condensation stylistique (« en Égypte » pour « dans le pays d’Égypte »).
    rationale: Cette différence ne nécessite pas de note, puisqu’elle ne modifie ni le référent ni le sens géographique. Sa suppression allège l’appareil de notes.
