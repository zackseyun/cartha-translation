base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: fr
  text: Il rassembla toute la nourriture des sept années qui se déroulèrent en Égypte, et il mit de la nourriture dans les villes. Dans chaque ville, il mit la nourriture provenant des champs qui l’entouraient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « La nourriture du champ de la ville, qui l’entoure, il la mit en son sein. » L’hébreu répète « nourriture » et emploie une construction de reprise qui met l’information en relief.'
    reason: La note rend compte du singulier « champ » et de la reprise emphatique de l’hébreu, tandis que le texte principal emploie une formulation française naturelle.
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: Il rassembla
  rationale: Le verbe קבץ désigne l’action de réunir ou de collecter. « Rassembla » convient au récit et reste proche de la formulation hébraïque.
- source_word: כָּל אֹכֶל שֶׁבַע שָׁנִים
  choice: toute la nourriture produite pendant les sept années
  rationale: אֹכֶל signifie largement « nourriture », sans se limiter aux céréales. « Produite pendant » explicite naturellement en français le rapport condensé entre la nourriture et les sept années, sans changer le référent.
- source_word: אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: en Égypte
  rationale: La relative hébraïque signifie littéralement « qui furent au pays d’Égypte ». Rattachée aux années ou à leur production, elle situe ici la période et la récolte; la formulation française concise évite une tournure maladroite.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: et la déposa dans les villes
  rationale: נתן signifie fondamentalement « mettre, placer, donner ». « Déposa » exprime naturellement le placement de denrées dans les villes sans introduire un terme technique absent du texte.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: la nourriture provenant des champs qui l’entouraient
  rationale: Le syntagme construit associe la nourriture aux terres agricoles de la ville, situées autour d’elle. Le pluriel « champs » est idiomatique en français et le pronom renvoie à chaque ville.
- source_word: נָתַן בְּתוֹכָהּ
  choice: Dans chaque ville, il déposa
  rationale: 'L’hébreu reprend le verbe et conclut par « il mit en son sein ». La formulation distributive française conserve le sens: la production des alentours de chaque ville est placée dans cette ville.'
