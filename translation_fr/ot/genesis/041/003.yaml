  text: וְ/הִנֵּ֞ה שֶׁ֧בַע פָּר֣וֹת אֲחֵר֗וֹת עֹל֤וֹת אַחֲרֵי/הֶן֙ מִן הַ/יְאֹ֔ר רָע֥וֹת מַרְאֶ֖ה וְ/דַקּ֣וֹת בָּשָׂ֑ר וַֽ/תַּעֲמֹ֛דְנָה אֵ֥צֶל הַ/פָּר֖וֹת עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: fr
  text: Et voici que sept autres vaches sortirent du Nil après elles, laides à voir et maigres de corps[a], et elles se tinrent à côté des vaches, sur la rive du Nil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « minces de chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la fonction déictique et la vivacité narrative de הִנֵּה dans le récit du rêve, dans un français digne mais compréhensible.
- source_word: פָּרוֹת
  choice: vaches
  rationale: Le pluriel féminin désigne précisément des bovins femelles; « vaches » est plus exact que le terme générique « bovins ».
- source_word: אֲחֵרוֹת
  choice: autres
  rationale: Marque naturellement qu’il s’agit d’un second groupe de sept vaches, distinct du premier.
- source_word: עֹלוֹת ... מִן הַיְאֹר
  choice: montaient ... hors du Nil
  rationale: Le participe présente les vaches en train d’émerger du fleuve; « hors du Nil » rend clairement le point de départ.
- source_word: אַחֲרֵיהֶן
  choice: derrière elles
  rationale: Préserve l’ambiguïté possible entre succession spatiale et succession dans la scène, plutôt que de réduire l’expression au seul sens temporel.
- source_word: הַיְאֹר
  choice: le Nil
  rationale: Dans le cadre égyptien, יְאֹר désigne ici le Nil; nommer directement le fleuve rend le référent clair.
- source_word: רָעוֹת מַרְאֶה
  choice: laides à voir
  rationale: Exprime une apparence repoussante sans suggérer une qualité morale mauvaise, tout en restant proche de la tournure hébraïque.
- source_word: דַקּוֹת בָּשָׂר
  choice: maigres de corps
  rationale: Rend l’idée de faible épaisseur de chair dans un français naturel, sans la technicité de « maigres de chair ».
- source_word: וַתַּעֲמֹדְנָה
  choice: Elles vinrent se placer
  rationale: Dans ce contexte, le verbe indique qu’elles prennent position près des autres vaches; cette formulation est plus naturelle que le littéral « elles se tinrent ».
- source_word: אֵצֶל
  choice: à côté de
  rationale: Exprime clairement la proximité physique.
- source_word: שְׂפַת הַיְאֹר
  choice: sur la rive du Nil
  rationale: « Rive » est le terme français idiomatique pour le bord d’un fleuve.
theological_decisions: []
