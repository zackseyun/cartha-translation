  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: fr
  text: Alors Abraham s’inclina devant les gens du pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se prosterna devant les gens du pays ».'
    reason: Alternative lexicale reflétant la force possible de וַיִּשְׁתַּחוּ.
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: s’inclina
  rationale: La forme verbale désigne ici un geste corporel de profond respect dans le cadre d’une négociation publique. « S’inclina » rend ce geste sans suggérer un culte rendu à des humains.
- source_word: לִפְנֵי
  choice: devant
  rationale: Cette expression signifie « devant » ou « en présence de ». « Devant » est naturel, concis et conserve la dimension publique de la scène.
- source_word: עַם
  choice: les gens
  rationale: Dans ce contexte, עַם désigne la population locale présente comme corps social. « Les gens » est plus idiomatique en français courant que « le peuple » dans l’expression complète.
- source_word: הָאָרֶץ
  choice: du pays
  rationale: Dans עַם הָאָרֶץ, le terme désigne le territoire dont ces personnes sont les habitants. « Du pays » forme une expression française naturelle sans préciser davantage que l’hébreu.
- source_word: וַ
  choice: Alors
  rationale: Le waw avec le wayyiqtol fait progresser le récit. « Alors » exprime clairement la succession narrative.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Le nom propre suit sa forme française traditionnelle.
theological_decisions:
- issue: Nature du geste d’Abraham
  choice: s’inclina
  alternative: se prosterna
  rationale: Le contexte indique une marque de déférence sociale, non un acte de culte. Le texte peut toutefois désigner une inclinaison très profonde, d’où le maintien de « se prosterna » en note.
translation_notes:
  register: Français international moderne, simple et digne. « Les gens du pays » est retenu comme tournure naturelle pour le groupe local témoin de la transaction. La note préserve la possibilité d’un geste plus profond.
