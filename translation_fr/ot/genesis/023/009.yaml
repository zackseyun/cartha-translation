  text: וְ/יִתֶּן לִ֗/י אֶת מְעָרַ֤ת הַ/מַּכְפֵּלָה֙ אֲשֶׁר ל֔/וֹ אֲשֶׁ֖ר בִּ/קְצֵ֣ה שָׂדֵ֑/הוּ בְּ/כֶ֨סֶף מָלֵ֜א יִתְּנֶ֥/נָּה לִ֛/י בְּ/תוֹכְ/כֶ֖ם לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: fr
  text: qu’il me donne la grotte de Makpéla, qui lui appartient et qui se trouve à l’extrémité de son champ[a]. Qu’il me la donne, contre paiement intégral en argent[b], parmi vous, comme propriété funéraire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au bord de son champ ». Le terme hébreu peut désigner le bout, le bord ou l’extrémité.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « pour de l’argent complet » : il s’agit du paiement de la totalité du prix.'
    reason: lexical_alternative
  - marker: c
    text: Ou « comme possession funéraire ». Le terme hébreu souligne qu’il s’agit d’un bien légalement possédé, et non seulement d’un lieu dont l’usage est accordé pour une sépulture.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: qu’il me donne
  rationale: Dans ce contexte de requête, l’imparfait hébreu a une valeur volitive. « Qu’il me donne » conserve aussi le verbe נתן sans transformer explicitement l’acte en vente.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: la grotte de Makpéla
  rationale: Le syntagme construit associe « grotte » au nom propre Makpéla; cette formulation est naturelle et traditionnelle en français.
- source_word: אֲשֶׁר לוֹ
  choice: qui lui appartient
  rationale: Cette formulation exprime clairement la propriété, élément important dans la négociation juridique du passage.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: qui se trouve à l’extrémité de son champ
  rationale: קָצֶה peut désigner l’extrémité, le bout ou le bord. « À l’extrémité » préserve la portée spatiale sans préciser davantage.
- source_word: בְּכֶסֶף מָלֵא
  choice: au prix intégral en argent
  rationale: Littéralement « pour de l’argent complet », l’expression indique le paiement de la totalité du prix, sans remise ni don.
- source_word: יִתְּנֶנָּה
  choice: qu’il me la donne
  rationale: La reprise de נתן est conservée, ainsi que l’objet féminin renvoyant à la grotte; la mention du prix rend évident qu’il s’agit d’un transfert contre paiement.
- source_word: בְּתוֹכְכֶם
  choice: au milieu de vous
  rationale: La traduction conserve l’image du groupe réuni et laisse ouverte la nuance d’une transaction conclue parmi eux ou en leur présence.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: comme propriété funéraire
  rationale: אֲחֻזָּה désigne un bien possédé de manière établie, avec une portée juridique; « propriété funéraire » exprime à la fois la possession et la destination du lieu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « qu’il me donne » suit celle du verbe hébreu et maintient l’insistance de la demande. « Au milieu de vous » reste proche du texte tout en conservant la dimension publique et communautaire de la transaction.
