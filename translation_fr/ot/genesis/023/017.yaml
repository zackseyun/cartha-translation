base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: fr
  text: Ainsi, le champ d’Éfrôn situé à Makpéla, en face de Mamré — le champ, la grotte qui s’y trouvait et tous les arbres qui étaient dans le champ et dans toutes ses limites alentour — fut légalement transféré[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « fut juridiquement confirmé » ou « fut établi ». Le verbe hébreu a probablement ici un sens juridique : la vente du bien est validée et prend effet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: fut légalement transféré
  rationale: 'Dans le contexte de la vente, קום possède ici une valeur juridique : la transaction concernant le bien est validée et prend effet. Cette formulation française exprime ce sens sans réduire le verbe à l’idée physique de « se lever ».'
- source_word: שְׂדֵה עֶפְרוֹן
  choice: le champ d’Éfrôn
  rationale: Le groupe construit hébreu exprime naturellement l’appartenance ou la possession antérieure du champ.
- source_word: בַּמַּכְפֵּלָה
  choice: situé à Makpéla
  rationale: Makpéla est conservé comme nom de lieu ; « situé à » rend clairement la localisation du champ.
- source_word: לִפְנֵי מַמְרֵא
  choice: en face de Mamré
  rationale: La locution signifie littéralement « devant, en face de » et décrit une relation spatiale sans imposer une orientation cardinale incertaine.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: le champ, la grotte qui s’y trouvait
  rationale: La reprise de « le champ » conserve la forme d’inventaire juridique, tandis que « s’y trouvait » rend naturellement אֲשֶׁר בּוֹ.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: et tous les arbres qui étaient dans le champ
  rationale: Le singulier collectif הָעֵץ peut désigner l’ensemble des arbres ; le pluriel français est ici naturel et maintient l’exhaustivité de la description.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: sur toute l’étendue de ses limites
  rationale: La formulation rend l’idée exhaustive de tout ce qui se trouve à l’intérieur du périmètre du champ, sans alourdir excessivement le style cadastral.
