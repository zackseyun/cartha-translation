revisions:
- from: Ainsi, le champ d’Éfrôn situé à Makpéla, en face de Mamré — le champ, la grotte qui s’y trouvait et tous les arbres qui étaient dans le champ, sur toute l’étendue de ses limites — fut légalement transféré[a].
  to: Ainsi, le champ d’Éfrôn situé à Makpéla, en face de Mamré — le champ, la grotte qui s’y trouvait et tous les arbres qui étaient dans le champ et dans toutes ses limites alentour — fut légalement transféré[a].
  rationale: Révision limitée de la clause finale afin de rendre la portée englobante de « dans toutes ses limites, tout autour » sans suggérer que les arbres se trouvaient uniquement sur la ligne frontière. La traduction principale et la note conservent l’ambiguïté lexicale du verbe hébreu dans son emploi juridique.
