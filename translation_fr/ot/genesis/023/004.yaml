  text: גֵּר וְ/תוֹשָׁ֥ב אָנֹכִ֖י עִמָּ/כֶ֑ם תְּנ֨וּ לִ֤/י אֲחֻזַּת קֶ֨בֶר֙ עִמָּ/כֶ֔ם וְ/אֶקְבְּרָ֥ה מֵתִ֖/י מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: fr
  text: Je suis un étranger et un résident temporaire parmi vous. Accordez-moi parmi vous une propriété pour une sépulture[a], afin que j’enterre mon défunt hors de ma vue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne une possession foncière destinée à servir de lieu de sépulture, et non simplement un endroit où creuser une tombe.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de devant moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: étranger
  rationale: Le terme désigne une personne vivant hors de son groupe et de sa terre d’origine, sans plein statut foncier. « Étranger » est naturel et conserve la position extérieure d’Abraham.
- source_word: וְתוֹשָׁב
  choice: résident temporaire
  rationale: Le mot complète גֵּר en soulignant qu’Abraham réside sur place sans y posséder de terre ni jouir du statut d’un autochtone. La formulation garde les deux termes distincts.
- source_word: עִמָּכֶם
  choice: parmi vous
  rationale: Dans ce contexte social, « parmi vous » exprime naturellement la présence d’Abraham au sein de la population tout en maintenant son statut distinct.
- source_word: תְּנוּ לִי
  choice: Accordez-moi
  rationale: L’impératif de נתן signifie littéralement « donnez-moi ». Dans une demande officielle portant sur un droit foncier, « accordez-moi » est idiomatique sans préciser indûment s’il s’agit d’un don ou d’une vente.
- source_word: אֲחֻזַּת קֶבֶר
  choice: une propriété pour une sépulture
  rationale: אֲחֻזָּה évoque une possession foncière durable, et non seulement l’emplacement matériel d’une tombe. Cette traduction conserve l’enjeu juridique du chapitre tout en évitant « propriété funéraire », qui pourrait évoquer en français moderne une entreprise de pompes funèbres.
- source_word: וְאֶקְבְּרָה
  choice: afin que j’enterre
  rationale: La forme cohortative suivant la demande exprime ici le but recherché. « Afin que » restitue clairement cette relation.
- source_word: מֵתִי
  choice: mon mort
  rationale: L’hébreu emploie une désignation au singulier avec suffixe possessif sans nommer Sarah dans ce verset. « Mon mort » conserve cette sobriété et l’expression concrète du texte, malgré son caractère légèrement marqué en français.
- source_word: מִלְּפָנַי
  choice: loin de ma vue
  rationale: L’expression signifie littéralement « de devant moi ». « Loin de ma vue » en rend l’image et le sens contextuel dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le couple social et juridique גֵּר וְתוֹשָׁב reste exprimé par deux désignations distinctes. La formulation « propriété pour une sépulture » préserve l’importance de la possession foncière dans le récit sans employer un vocabulaire juridique excessivement technique.
