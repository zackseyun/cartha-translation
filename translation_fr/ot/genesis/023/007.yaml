  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: fr
  text: Alors Abraham se leva et s’inclina devant les gens du pays, les fils de Heth[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Hittites ». Hébreu : « les fils de Heth ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Alors Abraham se leva
  rationale: Le qal wayyiqtol de קום exprime le fait de se lever et fait progresser le récit. « Alors » rend naturellement la succession narrative du waw en français moderne.
- source_word: וַיִּשְׁתַּחוּ
  choice: s’inclina
  rationale: La forme de שׁחה désigne un geste d’inclination profonde ou de prosternation. « S’inclina » conserve ici le geste respectueux sans imposer l’idée d’une prosternation complète.
- source_word: לְעַם הָאָרֶץ
  choice: devant les gens du pays
  rationale: La préposition ל marque les destinataires du geste; avec « s’inclina », « devant » est idiomatique. « Les gens du pays » désigne naturellement les habitants locaux dans ce contexte.
- source_word: לִבְנֵי חֵת
  choice: les fils de Heth
  rationale: L’expression signifie littéralement « les fils de Heth » et précise qui sont les gens du pays. La formulation généalogique est conservée dans le texte, tandis que l’équivalent ethnique courant est signalé en note.
- source_word: חֵת
  choice: Heth
  rationale: Le nom propre est translittéré selon sa forme française traditionnelle.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Les gens du pays » est plus courant que « le peuple du pays » tout en restant proche du sens contextuel; l’apposition finale reproduit l’identification donnée par l’hébreu.
