source:
  edition: WLC
  text: וַ/יַּעֲנ֧וּ בְנֵי חֵ֛ת אֶת אַבְרָהָ֖ם לֵ/אמֹ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/005.yaml
  text: The sons of Heth answered Abraham[a], saying to him,
translation:
  language: fr
  text: 'Les fils de Heth[a] répondirent à Abraham en lui disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les Hittites ». Littéralement : « les fils de Heth ».'
    reason: Signaler l’équivalent ethnique possible tout en conservant dans le texte l’expression de filiation de l’hébreu.
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: répondirent
  rationale: Le qal wayyiqtol de ענה introduit la réponse du groupe dans le dialogue ; « répondirent » est naturel et fidèle au déroulement narratif.
- source_word: בְנֵי חֵת
  choice: les fils de Heth
  rationale: Cette traduction conserve l’expression hébraïque de filiation et le nom propre Heth, sans réduire d’emblée le groupe à une désignation ethnique interprétative.
- source_word: אֶת אַבְרָהָם
  choice: à Abraham
  rationale: אֶת marque Abraham comme objet du verbe ; en français, « répondre à quelqu’un » exige la préposition « à ».
- source_word: לֵאמֹר
  choice: en lui disant
  rationale: L’infinitif construit de אמר introduit les paroles qui suivent. Avec לוֹ, « en lui disant » rend explicitement et naturellement l’introduction du discours direct.
- source_word: לוֹ
  choice: lui
  rationale: Le ל préfixé avec suffixe masculin singulier désigne Abraham comme destinataire des paroles.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au récit écrit dignifié ; les deux éléments לֵאמֹר לוֹ sont réunis naturellement dans « en lui disant ». Le deux-points annonce le discours direct du verset suivant.
