  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: fr
  text: à Abraham comme propriété, aux yeux des fils de Heth[a], aux yeux de tous ceux qui entraient à la porte de sa ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Hittites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: à Abraham
  rationale: Le préfixe ל marque ici le bénéficiaire de la cession; « à Abraham » convient au contexte juridique.
- source_word: לְמִקְנָה
  choice: comme propriété
  rationale: מִקְנָה désigne un bien acquis; « comme propriété » exprime le résultat durable de la transaction.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Cette expression conserve l’image hébraïque tout en indiquant le caractère public et attesté de la transaction.
- source_word: בְנֵי חֵת
  choice: les fils de Heth
  rationale: Traduction formellement proche de l’appellation ethnique et généalogique hébraïque; « les Hittites » reste un équivalent contextuel valable.
- source_word: בְּכֹל בָּאֵי
  choice: de tous ceux qui entraient
  rationale: La coordination avec « sous les yeux » rend la présence de l’ensemble des témoins sans alourdir la phrase française.
- source_word: שַׁעַר עִירוֹ
  choice: par la porte de sa ville
  rationale: Dans ce contexte, la porte est à la fois un lieu de passage et le cadre civique des affaires publiques; « par » traduit naturellement l’entrée dans la ville.
