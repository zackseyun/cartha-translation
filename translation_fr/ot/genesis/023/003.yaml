  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: fr
  text: 'Alors Abraham se releva d’auprès de sa défunte et parla aux fils de Heth[a] en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
