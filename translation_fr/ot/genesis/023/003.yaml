lexical_decisions:
- source_word: וַיָּקָם
  choice: Alors Abraham se releva
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, et « se releva » exprime le mouvement d’Abraham quittant sa position auprès du corps.
- source_word: מֵעַל פְּנֵי
  choice: d’auprès de
  rationale: L’expression signifie ici qu’Abraham s’éloigne de la présence immédiate de la défunte. « D’auprès de » est naturel en français tout en restant proche de l’image hébraïque.
- source_word: מֵתוֹ
  choice: sa défunte
  rationale: L’hébreu dit littéralement « son mort / sa morte ». Le contexte désigne Sara ; « sa défunte » conserve la formulation nominale et sobre sans répéter son nom ni ajouter explicitement « épouse ».
- source_word: וַיְדַבֵּר אֶל
  choice: et parla aux
  rationale: Cette tournure rend directement l’idée de parler à des destinataires et maintient la distinction avec l’introduction du discours qui suit.
- source_word: בְּנֵי חֵת
  choice: les fils de Heth
  rationale: Traduction formelle de l’expression hébraïque. La désignation conventionnelle « les Hittites » est indiquée en note.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: 'L’infinitif introduit les paroles rapportées au verset suivant. « En ces termes : » remplit naturellement cette fonction en français et évite le lourd « en disant ».'
