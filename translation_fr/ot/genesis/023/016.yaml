  source_fidelity: La formulation « accepta donc la proposition » explicite plus que l’hébreu וַיִּשְׁמַע אֶל (« écouta / prêta attention à »), qui ne nomme ni une proposition ni une acceptation formelle. Le reste rend correctement la pesée de l’argent, la somme indiquée et la qualification commerciale finale.
  naturalness: « Lui pesa l’argent » est compréhensible, mais moins naturel en français moderne que « pesa à Éfron l’argent ». « Abraham écouta Éfron » est à la fois naturel dans le contexte et plus proche de l’expression source.
  terminology: « Éfron », « fils de Heth », « sicles d’argent » et « ayant cours chez les marchands » sont appropriés. Les notes conservent utilement les alternatives ethnique et commerciale, sans résoudre indûment l’idiome final.
