  text: וַ/יִּשְׁמַ֣ע אַבְרָהָם֮ אֶל עֶפְרוֹן֒ וַ/יִּשְׁקֹ֤ל אַבְרָהָם֙ לְ/עֶפְרֹ֔ן אֶת הַ/כֶּ֕סֶף אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/אָזְנֵ֣י בְנֵי חֵ֑ת אַרְבַּ֤ע מֵאוֹת֙ שֶׁ֣קֶל כֶּ֔סֶף עֹבֵ֖ר לַ/סֹּחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: fr
  text: 'Abraham écouta Éfron et pesa à Éfron l’argent dont il avait parlé devant les fils de Heth[a] : quatre cents sicles d’argent, ayant cours chez les marchands[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Hittites » ; littéralement « les fils de Heth ».
    reason: lexical_alternative
  - marker: b
    text: Ou « accepté par les marchands » ou « selon le poids en usage chez les marchands ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: Abraham accepta donc la proposition d’Éfron
  rationale: L’expression שׁמע אל signifie écouter ou prêter attention à quelqu’un et, dans cette transaction, implique qu’Abraham donne suite au prix énoncé. Cette formulation française rend naturellement le sens contextuel sans introduire une négociation absente du texte.
- source_word: וַיִּשְׁקֹל
  choice: lui pesa
  rationale: Le verbe שקל désigne concrètement l’action de peser le métal servant au paiement, avant l’usage de monnaie frappée. « Pesa » conserve cette réalité historique.
- source_word: הַכֶּסֶף
  choice: l’argent
  rationale: כֶּסֶף désigne l’argent, à la fois le métal et, par extension, le moyen de paiement. En français, « l’argent » conserve ici naturellement les deux dimensions.
- source_word: אֲשֶׁר דִּבֶּר
  choice: dont celui-ci avait parlé
  rationale: Cette traduction reste proche du verbe דבר, « parler », tout en rendant explicite par « celui-ci » qu’Éfron est le sujet implicite dans le contexte.
- source_word: בְּאָזְנֵי
  choice: devant
  rationale: Littéralement « aux oreilles de », l’expression signifie publiquement, en présence et à portée d’oreille des témoins. « Devant » est naturel en français et convient au cadre juridique de la scène.
- source_word: בְנֵי חֵת
  choice: les fils de Heth
  rationale: La traduction littérale préserve la désignation généalogique propre au récit de la Genèse; l’équivalent ethnique plus courant figure en note.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: quatre cents sicles d’argent
  rationale: Cette formulation conserve l’unité pondérale ancienne et la matière pesée.
- source_word: עֹבֵר לַסֹּחֵר
  choice: ayant cours chez les marchands
  rationale: L’expression commerciale semble désigner de l’argent reconnu ou accepté dans les échanges. « Ayant cours » préserve l’image de ce qui passe en commerce, tandis que le pluriel générique « les marchands » est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve le cadre public de la transaction ainsi que la pesée effective de l’argent. « Sicle » est maintenu comme terme historique usuel; l’idiome commercial final reste légèrement imagé, avec des explicitations en note.
