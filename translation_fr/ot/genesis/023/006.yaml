revisions:
- from: '« Écoute-nous, mon seigneur : tu es au milieu de nous un prince de Dieu[a]. Enterre celle qui est morte parmi les meilleurs de nos tombeaux. Aucun de nous ne te refusera son tombeau pour que tu puisses enterrer celle qui est morte. »'
  to: '« Écoute-nous, mon seigneur : tu es parmi nous un prince de Dieu[a]. Enterre la défunte dans le meilleur de nos tombeaux. Aucun de nous ne te refusera son tombeau pour t’empêcher d’enterrer la défunte. »'
  rationale: La révision rétablit le sens de prévention porté par le dernier infinitif hébreu au moyen de « pour t’empêcher de ». Elle allège aussi la désignation de Sara par « la défunte » et rend plus idiomatiquement la sélection des tombeaux, tout en conservant l’ambiguïté de « prince de Dieu » dans le texte et en note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:50:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement l’appel respectueux, « prince de Dieu », l’offre des meilleurs tombeaux et l’assurance qu’aucun membre du groupe ne retiendra son tombeau. Toutefois, « pour que tu puisses enterrer » inverse l’orientation négative du dernier infinitif : l’hébreu indique qu’aucun ne le lui refusera afin de l’empêcher d’enterrer sa morte.'
  naturalness: « Celle qui est morte » est compréhensible, mais sa répétition est lourde dans un discours bref. « La défunte » est idiomatique et convient au contexte immédiat, qui identifie clairement Sara. « Dans le meilleur de nos tombeaux » est une formulation française plus naturelle pour l’expression de sélection en hébreu.
  terminology: « Mon seigneur », « prince de Dieu » et « tombeau » maintiennent un registre solennel approprié. La note préserve, sans la trancher, la valeur intensive possible de נְשִׂיא אֱלֹהִים.
