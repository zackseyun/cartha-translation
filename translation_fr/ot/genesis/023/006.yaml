  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: fr
  text: '« Écoute-nous, mon seigneur : tu es parmi nous un prince de Dieu[a]. Enterre la défunte dans le meilleur de nos tombeaux. Aucun de nous ne te refusera son tombeau pour t’empêcher d’enterrer la défunte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un prince puissant parmi nous ». L’expression hébraïque « prince de Dieu » peut aussi avoir une valeur intensive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: Écoute-nous
  rationale: L’impératif avec suffixe de première personne du pluriel exprime un appel direct. « Écoute-nous » est naturel en français moderne tout en conservant la forme singulière adressée à Abraham.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Formule de déférence sociale envers Abraham. « Mon seigneur » conserve mieux le niveau de respect de l’hébreu que le plus courant mais plus neutre « monsieur ».
- source_word: נְשִׂיא אֱלֹהִים
  choice: un prince de Dieu
  rationale: La traduction formelle maintient le complément אֱלֹהִים et laisse ouverte la possibilité d’un rapport à Dieu ou d’un emploi intensif. L’alternative idiomatique est signalée en note.
- source_word: בְּתוֹכֵנוּ
  choice: au milieu de nous
  rationale: Rend directement l’idée de présence au sein de la communauté, dans une formulation française naturelle et digne.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: parmi les meilleurs de nos tombeaux
  rationale: מִבְחָר désigne ce qui est choisi ou de première qualité. La construction française exprime que tous les tombeaux les plus estimés sont mis à disposition.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: Enterre celle qui est morte
  rationale: Dans le contexte immédiat, מֵתֶךָ désigne Sara. Cette formulation française respecte le référent féminin sans recourir au peu naturel « ta morte ».
- source_word: אִישׁ מִמֶּנּוּ
  choice: Aucun de nous
  rationale: Dans la proposition négative, l’expression distributive signifie qu’il n’y aura pas une seule exception parmi eux.
- source_word: אֶת־קִבְרוֹ לֹא יִכְלֶה מִמְּךָ
  choice: ne te refusera son tombeau
  rationale: Dans ce contexte, כלה avec מִן exprime le fait de retenir ou de refuser quelque chose à quelqu’un. « Refuser » donne un français clair et fidèle à l’offre collective.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: pour que tu puisses enterrer celle qui est morte
  rationale: 'Le מן suivi de l’infinitif exprime ici l’empêchement : personne ne retiendra son tombeau de manière à empêcher Abraham d’accomplir l’ensevelissement. La formulation positive est idiomatique en français et préserve ce rapport logique.'
theological_decisions:
- issue: Sens de נְשִׂיא אֱלֹהִים
  choice: Conserver « un prince de Dieu » dans le texte
  alternative: « un prince puissant » ou « un très grand prince »
  rationale: La construction avec אֱלֹהִים peut désigner un prince associé ou agréé par Dieu, mais elle peut aussi fonctionner comme un intensif. Le texte principal préserve cette tension, et la note donne la lecture superlative.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours conserve la politesse solennelle des Hittites. Le féminin périphrastique « celle qui est morte » identifie naturellement Sara, tandis que « tombeau » convient au contexte d’un lieu funéraire possédé et négocié.
