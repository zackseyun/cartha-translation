base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: fr
  text: 'Il parla à Éphrôn devant les gens du pays et dit : « Si seulement tu voulais m’écouter ! Je donne l’argent pour le champ ; accepte-le de ma part[a], afin que j’y enterre ma défunte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « prends-le de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Il parla
  rationale: Le verbe דבר désigne ici une prise de parole formelle dans le cadre public d’une négociation.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: devant les gens du pays
  rationale: Littéralement « aux oreilles du peuple du pays » ; « devant » exprime naturellement en français que les membres de la communauté locale entendent publiquement l’échange.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: Si seulement tu voulais m’écouter !
  rationale: Cette tournure elliptique exprime une requête insistante mais courtoise. « Écouter » rend ici mieux que « entendre » l’idée d’accueillir favorablement la proposition.
- source_word: נָתַתִּי כֶּסֶף הַשָּׂדֶה
  choice: Je donne le prix du champ en argent
  rationale: 'Le parfait נָתַתִּי a vraisemblablement une valeur performative dans cette transaction : Abraham formule par ces mots son offre ferme. « Le prix du champ en argent » conserve la mention concrète de l’argent tout en produisant un français naturel.'
- source_word: קַח מִמֶּנִּי
  choice: accepte-le de ma part
  rationale: Le verbe signifie littéralement « prends ». Dans le contexte d’une offre de paiement, « accepte-le de ma part » restitue naturellement la demande sans laisser croire qu’Éphrôn doit physiquement prendre l’argent des mains d’Abraham.
- source_word: וְאֶקְבְּרָה
  choice: afin que j’y enterre
  rationale: La forme cohortative exprime le but poursuivi par Abraham dans la transaction.
- source_word: מֵתִי
  choice: ma défunte
  rationale: L’hébreu dit littéralement « mon mort / ma morte ». Le contexte identifie une femme, Sara ; « ma défunte » conserve la retenue solennelle de l’expression sans ajouter son nom.
- source_word: שָׁמָּה
  choice: y
  rationale: Le pronom adverbial renvoie naturellement au champ comme lieu de sépulture.
