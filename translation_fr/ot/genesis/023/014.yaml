  text: וַ/יַּ֧עַן עֶפְר֛וֹן אֶת אַבְרָהָ֖ם לֵ/אמֹ֥ר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/014.yaml
  text: And Ephron answered Abraham, saying to him,
translation:
  language: fr
  text: 'Éphrôn répondit à Abraham :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: répondit
  rationale: Dans un dialogue narratif, la forme wayyiqtol du verbe ענה introduit couramment une réponse. Le passé simple convient au registre narratif français et restitue directement la progression du récit.
- source_word: עֶפְרוֹן
  choice: Éfrôn
  rationale: Le nom propre hébreu est translittéré selon un usage français clair, avec un accent indiquant la voyelle initiale et un circonflexe aidant à représenter la voyelle longue de la seconde syllabe.
- source_word: אֶת אַבְרָהָם
  choice: à Abraham
  rationale: אֵת marque grammaticalement Abraham comme objet du verbe. Avec « répondre », le français idiomatique exige la préposition « à ».
- source_word: לֵאמֹר לוֹ
  choice: ':'
  rationale: La construction hébraïque signifie littéralement « en lui disant ». En français moderne, après « répondit à Abraham », les deux-points introduisent naturellement les paroles qui suivent sans répéter lourdement « en lui disant ».
