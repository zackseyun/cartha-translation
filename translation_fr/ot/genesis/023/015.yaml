  text: אֲדֹנִ֣/י שְׁמָעֵ֔/נִי אֶרֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל כֶּ֛סֶף בֵּינִ֥/י וּ/בֵֽינְ/ךָ֖ מַה הִ֑וא וְ/אֶת מֵתְ/ךָ֖ קְבֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: fr
  text: '« Mon seigneur, écoutez-moi : un terrain valant quatre cents sicles d’argent[a], qu’est-ce que cela entre vous et moi ? Enterrez votre mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « un terrain — quatre cents sicles d’argent — qu’est-ce que cela entre vous et moi ? » L’hébreu est elliptique; la question rhétorique minimise le prix dans le cadre de la négociation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Mon seigneur
  rationale: Formule de déférence adressée à Éphron, sans portée divine. Elle conserve le rapport social exprimé par l’hébreu.
- source_word: שְׁמָעֵנִי
  choice: écoutez-moi
  rationale: L’impératif constitue ici une demande polie. Le vouvoiement convient au ton respectueux de l’échange.
- source_word: אֶרֶץ
  choice: une terre
  rationale: Dans cette négociation, le mot désigne une propriété ou parcelle déterminée, et non la terre au sens abstrait.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: qui vaut quatre cents sicles d’argent
  rationale: L’ajout idiomatique « qui vaut » explicite en français le rapport elliptique entre la terre et la somme, sans ajouter de contenu substantiel.
- source_word: בֵּינִי וּבֵינְךָ
  choice: entre vous et moi
  rationale: Cette formulation conserve les deux personnes singulières et le caractère personnel de l’argument rhétorique.
- source_word: מַה הִוא
  choice: qu’est-ce que cela
  rationale: La question rhétorique minimise la somme entre les deux interlocuteurs sans préciser davantage le sens.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: Enterrez votre morte
  rationale: Le contexte immédiat identifie la défunte comme Sara. Le français exige normalement de marquer son genre; l’impératif direct conserve la conclusion pressante de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue emploie le vouvoiement pour rendre la déférence sociale. « Sicle » conserve l’unité monétaire ancienne; « votre morte » est inhabituel mais intelligible et correspond au féminin imposé par le contexte français.
