id: GEN.23.19
reference: Genesis 23:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: fr
  text: Après cela, Abraham enterra sa femme Sara dans la grotte du champ de Makpéla, en face de Mamré[a] — c’est-à-dire Hébron —, au pays de Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vis-à-vis de Mamré ». L’expression hébraïque situe la grotte devant Mamré ou en face de cette localité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Après cela
  rationale: Cette transition temporelle rend naturellement la succession narrative exprimée par l’hébreu, sans préciser davantage l’antécédent.
- source_word: קָבַר
  choice: enterra
  rationale: Le verbe français courant « enterrer » exprime clairement l’action de mettre un mort au tombeau et convient au registre narratif.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: sa femme Sara
  rationale: Cet ordre est plus idiomatique en français moderne que « Sara, sa femme », tout en conservant explicitement le lien conjugal.
- source_word: אֶל מְעָרַת
  choice: dans la grotte
  rationale: Après « enterrer », le français emploie naturellement « dans » pour le lieu où le corps est déposé, même si אֶל a fondamentalement une valeur directionnelle.
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: la grotte du champ de Makpéla
  rationale: Cette formulation conserve de manière transparente la chaîne construite hébraïque reliant la grotte, le champ et Makpéla.
- source_word: הַמַּכְפֵּלָה
  choice: Makpéla
  rationale: Le toponyme est translittéré selon une forme française claire; l’article hébreu n’a pas à être reproduit devant un nom propre français.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: en face de Mamré
  rationale: L’expression indique une relation spatiale devant ou vis-à-vis de Mamré, sans justifier une orientation cardinale plus précise.
- source_word: הִוא חֶבְרוֹן
  choice: c’est-à-dire Hébron
  rationale: Cette apposition explicative rend naturellement en français l’identification donnée par le pronom hébreu et le nom de lieu.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: au pays de Canaan
  rationale: « Au pays de Canaan » conserve le substantif géographique explicite tout en étant naturel en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la structure hébraïque sans devenir artificielle; les tirets isolent l’identification géographique de manière lisible.
