  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: fr
  text: '« Non, mon seigneur, écoute-moi : je te donne le champ, et je te donne la grotte qui s’y trouve. Je te la donne devant les gens de mon peuple[a]. Enterre ta défunte. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous les yeux des fils de mon peuple » ; c’est-à-dire publiquement, en présence de témoins de sa communauté.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: Non
  rationale: Dans cette négociation, le terme introduit une correction ou un refus poli de la proposition d’Abraham.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Cette formule conserve la déférence sociale de l’adresse sans suggérer nécessairement une relation de servitude.
- source_word: שְׁמָעֵנִי
  choice: écoute-moi
  rationale: Impératif direct, naturel en français moderne, qui garde la force de l’appel.
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: Rend directement le terrain ouvert désigné dans le contexte de la transaction.
- source_word: נָתַתִּי לָךְ
  choice: je te donne
  rationale: 'Le parfait hébreu a ici une valeur performative : Éfron accomplit verbalement l’acte de donation.'
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: la grotte qui s’y trouve
  rationale: Formulation française naturelle qui explicite la localisation de la grotte dans le champ.
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: devant les gens de mon peuple
  rationale: Rend l’idée d’un acte public accompli en présence de témoins de la communauté, tout en évitant le calque peu naturel « les fils de mon peuple ».
- source_word: קְבֹר מֵתֶךָ
  choice: Enterre ta morte
  rationale: Le nom est singulier et renvoie ici précisément à Sara; le féminin français rend explicite ce référent contextuel sans changer le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse interpersonnelle au singulier dans le récit; « mon seigneur » maintient la politesse formelle. La répétition de « je te donne » est conservée pour refléter le caractère solennel et performatif de la déclaration.
