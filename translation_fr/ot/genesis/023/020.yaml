base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: fr
  text: Ainsi, le champ et la grotte qui s’y trouvait furent légalement transférés à Abraham, comme propriété funéraire, par les fils de Heth[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Hittites ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « furent reconnus comme appartenant à Abraham, à titre de propriété funéraire ». Le verbe hébreu souligne ici l’établissement légal de la possession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: furent légalement acquis
  rationale: Dans ce contexte de vente foncière, קום exprime l’établissement juridique du bien au profit d’Abraham. Cette formulation française garde la force légale sans employer le littéralisme obscur « se dressèrent ».
- source_word: הַשָּׂדֶה
  choice: le champ
  rationale: Équivalent direct et naturel du bien foncier acheté.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: et la grotte qui s’y trouvait
  rationale: Conserve la proposition relative et le renvoi au champ, dans un français naturel.
- source_word: לְאַבְרָהָם
  choice: à Abraham
  rationale: Indique Abraham comme bénéficiaire et nouveau détenteur légal du bien.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: comme propriété funéraire
  rationale: אֲחֻזָּה désigne un bien possédé ou un domaine, avec ici une fonction d’ensevelissement; « propriété funéraire » préserve les deux dimensions.
- source_word: מֵאֵת
  choice: auprès de
  rationale: Marque naturellement en français la partie auprès de laquelle le bien est acquis.
- source_word: בְּנֵי חֵת
  choice: les fils de Heth
  rationale: Reproduit formellement l’expression hébraïque tout en laissant en note l’équivalent ethnonymique courant.
