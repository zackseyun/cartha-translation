id: GEN.23.10
reference: Genesis 23:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: fr
  text: 'Éphrôn était assis parmi les fils de Heth[a]. Éphrôn le Hittite répondit à Abraham devant les fils de Heth et tous ceux qui entraient par la porte de sa ville[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Hittites », ici et dans la suite du verset; l’hébreu dit littéralement « les fils de Heth ».
    reason: lexical_alternative
  - marker: b
    text: La porte de la ville était la place publique où les affaires juridiques et commerciales se traitaient devant témoins.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: était assis
  rationale: Le participe décrit la position d’Éphrôn au moment de la scène; l’imparfait français en restitue naturellement la valeur durative.
- source_word: בְּתוֹךְ בְּנֵי חֵת
  choice: parmi les fils de Heth
  rationale: « Parmi » convient à la présence d’Éphrôn au sein de l’assemblée, tandis que « fils de Heth » conserve l’expression hébraïque et la distingue du qualificatif ethnique qui suit.
- source_word: וַיַּעַן
  choice: répondit
  rationale: Traduction directe et courante de ענה dans un échange verbal.
- source_word: הַחִתִּי
  choice: le Hittite
  rationale: L’article hébreu appuie cette désignation ethnique définie.
- source_word: בְּאָזְנֵי
  choice: devant
  rationale: Dans ce contexte public, l’idiome « aux oreilles de » signifie qu’Éphrôn parle en présence et à portée d’audition de l’assemblée; « devant » est naturel en français.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: et tous ceux qui entraient par la porte de sa ville
  rationale: La coordination rend ces personnes comme l’ensemble des témoins présents; « par la porte » exprime naturellement le passage par l’entrée de la ville.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français, les deux-points introduisent avec naturel les paroles directes du verset suivant sans ajouter le calque « en disant ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La répétition du nom Éphrôn et la distinction entre « fils de Heth » et « le Hittite » sont conservées. La phrase est divisée en deux pour éviter une coordination lourde; les deux-points introduisent la réplique du verset suivant.
