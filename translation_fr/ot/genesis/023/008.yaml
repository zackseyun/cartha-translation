  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: fr
  text: 'Puis il leur parla en ces termes : « Si vous consentez à ce que j’ensevelisse ma défunte loin de mes regards, écoutez-moi et faites une démarche pour moi auprès d’Éphrôn, fils de Tsohar[a], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « intercédez pour moi auprès d’Éphrôn, fils de Tsohar » ; le verbe peut désigner une requête adressée à quelqu’un en faveur d’un tiers.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: Puis il leur parla en ces termes
  rationale: Cette formulation française naturelle rend l’acte de parler aux interlocuteurs et introduit clairement le discours direct, sans reproduire lourdement l’hébraïsme « disant ».
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: Si vous consentez
  rationale: L’expression idiomatique avec נֶפֶשׁ désigne ici la volonté ou le désir des interlocuteurs. « Si vous consentez » exprime naturellement cette disposition dans le contexte d’une demande.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: à ce que j’ensevelisse ma défunte
  rationale: Le sujet implicite de l’infinitif est Abraham. « Ma défunte » conserve le singulier et le possessif sans ajouter explicitement « épouse », tout en étant plus naturel et digne en français que « ma morte ».
- source_word: מִלְּפָנַי
  choice: loin de mes regards
  rationale: Littéralement « de devant moi », l’expression désigne ici le fait de soustraire la défunte à sa présence par l’ensevelissement. « Loin de mes regards » préserve l’image sans suggérer du mépris.
- source_word: שְׁמָעוּנִי
  choice: écoutez-moi
  rationale: Impératif direct, clair et courant en français moderne.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: faites une démarche pour moi auprès d’Éphrôn
  rationale: פגע avec ב peut exprimer le fait d’aborder quelqu’un ou de lui adresser une requête. Cette traduction garde volontairement une portée assez large, adaptée à la négociation, sans imposer l’idée technique d’une intercession.
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: Éphrôn, fils de Tsohar
  rationale: Les noms sont translittérés en français, et בֶּן est rendu selon la formule généalogique habituelle « fils de ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours conserve la retenue formelle d’une négociation funéraire. « Ma défunte » évite à la fois la rudesse de « ma morte » et l’ajout interprétatif de « ma femme ». La virgule finale indique que la demande se poursuit au verset suivant.
