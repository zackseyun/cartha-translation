    issue: « célébrer le deuil de Sara »
    rationale: Cette expression peut évoquer la célébration d’une cérémonie ou d’un souvenir, alors que לִסְפֹּד signifie prendre le deuil, se lamenter pour la morte. « Faire le deuil de » rend plus directement et naturellement le français tout en gardant la distinction avec « pleurer ».
  - severity: low
    issue: Ponctuation de l’incise « —, »
    rationale: La succession d’un tiret fermant et d’une virgule est typographiquement et stylistiquement lourde. Une apposition introduite par des virgules est plus nette dans cette phrase.
  revised_text: Sara mourut à Qiryath-Arba, c’est-à-dire à Hébron, dans le pays de Canaan[a]. Abraham vint faire le deuil de Sara et la pleurer.
