revisions:
- from: Sara mourut à Qiryath-Arba — c’est-à-dire Hébron[a] —, dans le pays de Canaan. Abraham vint célébrer le deuil de Sara et pleurer sur elle.
  to: Sara mourut à Qiryath-Arba, c’est-à-dire à Hébron, dans le pays de Canaan[a]. Abraham vint faire le deuil de Sara et la pleurer.
  rationale: La révision remplace une formulation susceptible d’ajouter une connotation cérémonielle par « faire le deuil de », qui rend naturellement la lamentation funèbre, et ajuste la ponctuation de l’apposition. « La pleurer » est idiomatique et conserve le suffixe féminin de l’hébreu.
