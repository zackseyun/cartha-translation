  text: וַ/תָּ֣מָת שָׂרָ֗ה בְּ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יָּבֹא֙ אַבְרָהָ֔ם לִ/סְפֹּ֥ד לְ/שָׂרָ֖ה וְ/לִ/בְכֹּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: fr
  text: Sara mourut à Qiryath-Arba, c’est-à-dire à Hébron, dans le pays de Canaan[a]. Abraham vint faire le deuil de Sara et la pleurer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Qiryath-Arba est ici identifiée à Hébron.
    reason: cross_reference
lexical_decisions:
- source_word: וַתָּמָת
  choice: mourut
  rationale: Le verbe מות désigne directement la mort. « Mourut » conserve la sobriété du récit sans l’atténuer par un euphémisme.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: à Qiryath-Arba
  rationale: Le nom de lieu est translittéré. La préposition française « à » est naturelle avec le nom d’une ville.
- source_word: הִוא חֶבְרוֹן
  choice: c’est-à-dire Hébron
  rationale: Cette formulation rend clairement l’apposition hébraïque qui identifie Qiryath-Arba à Hébron.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: dans le pays de Canaan
  rationale: Le choix maintient le nom אֶרֶץ explicitement présent dans l’hébreu.
- source_word: וַיָּבֹא
  choice: vint
  rationale: בוא peut signifier venir ou aller selon le point de vue. « Vint » convient au mouvement narratif tout en évitant de préciser un lieu de départ absent du texte.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: célébrer le deuil de Sara
  rationale: ספד évoque les manifestations de deuil et la lamentation funèbre. Cette expression française est naturelle, solennelle et plus précise ici que le simple « pleurer », déjà employé pour בכה.
- source_word: וְלִבְכֹּתָהּ
  choice: et pleurer sur elle
  rationale: בכה désigne les pleurs. « Pleurer sur elle » rend le suffixe féminin et distingue cet acte de la lamentation funèbre exprimée auparavant.
