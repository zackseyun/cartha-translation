base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: fr
  text: Abraham prit des moutons et des bovins, et les donna à Abimélec ; tous deux conclurent une alliance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils coupèrent une alliance », expression idiomatique hébraïque désignant la conclusion formelle d’une alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le qatal narratif de לקח exprime ici l’action simple de prendre; « prit » est naturel et fidèle.
- source_word: צֹאן
  choice: des moutons
  rationale: צֹאן désigne le petit bétail, notamment moutons et chèvres. « Moutons » forme ici un couple clair avec les bovins, sans alourdir le texte.
- source_word: וּבָקָר
  choice: et des bovins
  rationale: בָּקָר désigne le gros bétail, particulièrement les bovins. « Bovins » est précis et courant en français international.
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  choice: et les donna à Abimélek
  rationale: נתן a son sens ordinaire de « donner ». Le pronom « les » explicite naturellement en français l’objet déjà nommé.
- source_word: שְׁנֵיהֶם
  choice: tous deux
  rationale: Cette expression conserve l’indication explicite que les deux hommes sont parties à l’alliance.
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: conclurent une alliance
  rationale: Littéralement « coupèrent une alliance », idiome hébreu signifiant établir formellement une alliance. « Conclure une alliance » est idiomatique, digne et précis en français moderne.
theological_decisions:
- issue: Rendu de l’idiome כרת ברית
  choice: conclurent une alliance
  alternative: coupèrent une alliance
  rationale: Le texte principal rend le sens conventionnel de l’idiome sans reproduire une tournure obscure en français; la note conserve sa forme littérale et sa portée culturelle.
translation_notes:
  register: Français moderne international, narratif et digne. Deux phrases favorisent une lecture fluide tout en maintenant la succession des actions. Le terme biblique clé « alliance » est conservé.
