  text: וַ/יִּגְדַּ֥ל הַ/יֶּ֖לֶד וַ/יִּגָּמַ֑ל וַ/יַּ֤עַשׂ אַבְרָהָם֙ מִשְׁתֶּ֣ה גָד֔וֹל בְּ/י֖וֹם הִגָּמֵ֥ל אֶת יִצְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/008.yaml
  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: fr
  text: L’enfant grandit et fut sevré. Abraham donna un grand festin le jour où Isaac fut sevré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: grandit
  rationale: Dans le contexte du développement d’un enfant, le verbe גדל exprime naturellement la croissance.
- source_word: הַיֶּלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon. « L’enfant » est naturel en français et n’impose pas une précision d’âge que le contexte ne fixe pas exactement.
- source_word: וַיִּגָּמַל
  choice: fut sevré
  rationale: Le nifal de גמל désigne ici la fin de l’allaitement; « fut sevré » en est l’équivalent direct et idiomatique.
- source_word: וַיַּעַשׂ
  choice: donna
  rationale: Avec מִשְׁתֶּה pour complément, le français dit naturellement « donner un festin »; cela rend l’action d’organiser ou d’offrir la célébration sans lourdeur littérale.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: un grand festin
  rationale: מִשְׁתֶּה désigne un repas de fête, souvent associé à la boisson et à la célébration; « grand festin » conserve la force de גָדוֹל dans un registre digne et courant.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Cette tournure française rend clairement la valeur temporelle de בְּיוֹם tout en conservant la référence à un jour déterminé.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: où Isaac fut sevré
  rationale: L’infinitif passif avec אֶת et Isaac comme objet logique décrit l’événement du sevrage d’Isaac; une proposition passive est la formulation française la plus claire.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « fut sevré » est conservée parce qu’elle reflète celle de l’hébreu et met en relief l’occasion précise du festin.
