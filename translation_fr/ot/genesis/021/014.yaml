  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: fr
  text: Abraham se leva de bon matin. Il prit du pain et une outre d’eau, les donna à Agar et les plaça sur son épaule ; il lui donna aussi le garçon[a], puis la renvoya. Elle partit et erra dans le désert de Beer-Shéba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte littéralement : « les plaçant sur son épaule, et le garçon ». La syntaxe est condensée. On peut comprendre que les provisions furent placées sur l’épaule d’Agar et que le garçon lui fut confié ; certains comprennent la formulation de façon plus étroite comme incluant aussi le garçon dans ce qui est placé sur son épaule.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: Abraham se leva de bon matin
  rationale: L’expression française naturelle « de bon matin » rend à la fois l’idée de se lever tôt portée par le hifil de שׁכם et la précision temporelle בַּבֹּקֶר.
- source_word: לֶחֶם
  choice: du pain
  rationale: Le sens concret ordinaire est « pain »; le contexte n’impose pas le terme plus général « nourriture ».
- source_word: חֵמַת מַיִם
  choice: une outre d’eau
  rationale: חֵמֶת désigne un récipient en peau destiné aux liquides. « Outre d’eau » est précis, intelligible et sans anachronisme matériel.
- source_word: וַיִּתֵּן אֶל הָגָר שָׂם עַל שִׁכְמָהּ
  choice: les donna à Agar en les plaçant sur son épaule
  rationale: Le pronom « les » reprend naturellement le pain et l’outre. La tournure circonstancielle rend le participe שָׂם et rattache le placement sur l’épaule aux provisions.
- source_word: וְאֶת הַיֶּלֶד
  choice: ainsi que le garçon
  rationale: Cette formulation conserve l’ajout abrupt du garçon tout en évitant d’affirmer sans réserve qu’Abraham l’aurait physiquement placé sur l’épaule d’Agar.
- source_word: וַיְשַׁלְּחֶהָ
  choice: puis il la renvoya
  rationale: « Renvoyer » exprime ici le fait de faire partir Agar et garde la gravité du récit; « puis » marque naturellement la progression narrative.
- source_word: וַתֵּתַע
  choice: erra
  rationale: Le verbe תעה peut signifier errer ou s’égarer. « Erra » préserve cette nuance sans préciser indûment si Agar avait perdu son chemin.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: dans le désert de Beer-Shéba
  rationale: Dans ce contexte géographique, « désert » est naturel en français et n’implique pas nécessairement une étendue de dunes. « Beer-Shéba » est une translittération française courante du toponyme.
theological_decisions:
- issue: Rapport syntaxique entre « le garçon » et le placement sur l’épaule d’Agar
  choice: Le pain et l’outre sont placés sur l’épaule d’Agar; le garçon est ajouté à ce qu’Abraham lui confie avant de la renvoyer.
  alternative: Le texte pourrait se lire plus littéralement comme si Abraham avait placé sur son épaule les provisions et le garçon.
  rationale: La syntaxe hébraïque est condensée et réellement ambiguë. Le corps du texte adopte la lecture contextuellement la moins trompeuse, tandis que la note conserve l’autre possibilité syntaxique sans la supprimer.
translation_notes:
  register: Français moderne, narratif et digne. Les phrases restent simples et accessibles. « De bon matin », « outre » et « erra » conservent une légère solennité biblique sans archaïsme marqué. La note signale l’ambiguïté syntaxique authentique du texte source.
