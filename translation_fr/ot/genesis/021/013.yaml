  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: fr
  text: Je ferai aussi du fils de la femme esclave[a] une nation, car il est de ta descendance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la servante » ; l’hébreu désigne une femme en condition de servitude.
    reason: alternative lexicale et précision du statut social
lexical_decisions:
- source_word: וְגַם
  choice: Je ferai aussi
  rationale: La combinaison de וְ et גַם marque la continuité et l’addition. La place de « aussi » auprès du verbe est naturelle en français et conserve cette valeur additive.
- source_word: אֶת בֶּן הָאָמָה
  choice: du fils de la femme esclave
  rationale: בֶּן signifie « fils » et אָמָה désigne une femme en condition de servitude. « Femme esclave » rend explicitement le statut social sans l’adoucir.
- source_word: לְגוֹי
  choice: une nation
  rationale: 'Avec שׂים, le complément introduit par לְ exprime le résultat : le fils deviendra une nation. La construction française « faire de quelqu’un une nation » rend ce sens avec naturel.'
- source_word: אֲשִׂימֶנּוּ
  choice: Je ferai de lui
  rationale: שׂים peut signifier « placer », « établir » ou « faire ». Ici, il s’agit de constituer la descendance issue de ce fils en nation ; la tournure « faire de… » est idiomatique et fidèle au contexte.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de la promesse. « Car » exprime clairement ce rapport causal dans un registre narratif digne et courant.
- source_word: זַרְעֲךָ
  choice: ta descendance
  rationale: זֶרַע peut désigner la semence, la postérité ou la descendance. Ici, le nom collectif est appliqué au fils d’Abraham ; « descendance » conserve cette portée familiale et potentiellement collective.
- source_word: הוּא
  choice: il est
  rationale: Le pronom explicite souligne que ce fils appartient bien à la descendance d’Abraham. « Il est » préserve l’affirmation sans suraccentuation artificielle.
theological_decisions:
- issue: Rendu de אָמָה et du statut social d’Agar
  choice: femme esclave
  alternative: servante ; femme au service d’une maîtresse
  rationale: Le terme hébreu désigne une femme de statut servile, et la condition d’Agar est importante dans le récit. « Femme esclave » évite d’atténuer cette réalité sociale, sans ajouter d’interprétation confessionnelle.
- issue: Portée de זַרְעֲךָ
  choice: ta descendance
  alternative: ton descendant ; ta postérité
  rationale: Le terme hébreu peut fonctionner collectivement tout en visant ici une personne précise. « Ta descendance » préserve cette tension entre l’individu et la lignée qui procédera de lui.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe « faire de… une nation » suit le mouvement de l’hébreu tout en restant idiomatique. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
