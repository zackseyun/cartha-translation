lexical_decisions:
- source_word: וַיָּגָר
  choice: séjourna
  rationale: Le verbe גּוּר désigne le fait de résider quelque part en tant qu'étranger ou résident non autochtone. « Séjourna » conserve cette nuance avec naturel dans un récit au passé simple.
- source_word: בְּאֶרֶץ
  choice: dans le pays
  rationale: Dans ce contexte territorial, אֶרֶץ se rend naturellement par « pays » en français moderne.
- source_word: פְּלִשְׁתִּים
  choice: des Philistins
  rationale: « Philistins » est la désignation française usuelle de ce peuple; la construction forme l'expression naturelle « le pays des Philistins ».
- source_word: יָמִים רַבִּים
  choice: pendant longtemps
  rationale: L'expression signifie littéralement « de nombreux jours » et désigne idiomatiquement une longue durée. « Pendant longtemps » est plus naturel en français courant, tandis que la forme littérale est signalée en note.
- source_word: וַ
  choice: liaison narrative non explicitée
  rationale: Le waw assure ici la continuité du récit. En français, le passé simple suffit naturellement à marquer cette progression; ajouter « et » serait possible, mais moins fluide dans ce verset isolé.
