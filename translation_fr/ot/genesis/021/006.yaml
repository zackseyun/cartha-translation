    rationale: כָּל־הַשֹּׁמֵעַ signifie littéralement « quiconque entend / tous ceux qui entendent ». « En entendront parler » est naturel en français et plus proche du verbe source.
  - severity: low
    issue: La note rend une nuance possible par « riront à mon sujet ».
    rationale: Cette formulation n’est pas l’équivalent direct de לִי (« pour moi / à moi ») et oriente davantage vers un rire portant sur Sara. Il vaut mieux conserver « riront pour moi » à côté de « riront de moi ».
