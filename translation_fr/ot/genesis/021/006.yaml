base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: fr
  text: 'Sara dit : « Dieu a fait naître le rire pour moi ; tous ceux qui en entendront parler riront avec moi.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi comprendre : « riront de moi » ou « riront pour moi ». L’hébreu permet plusieurs nuances ; dans ce contexte, il s’agit probablement d’un rire joyeux partagé avec Sara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: dit
  rationale: Le passé simple fait avancer naturellement le récit en français ; la coordination hébraïque n’a pas besoin d’être rendue mécaniquement.
- source_word: שָׂרָה
  choice: Sara
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: צְחֹק עָשָׂה לִי
  choice: m’a donné de quoi rire
  rationale: Cette tournure française naturelle conserve l’idée concrète que Dieu a produit pour Sara un motif de rire, tout en évitant le peu idiomatique « a fait du rire pour moi ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le terme désigne ici sans ambiguïté le Dieu unique qui agit en faveur de Sara.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: tous ceux qui l’apprendront
  rationale: Le participe distributif désigne toute personne qui entendra parler de l’événement ; « l’apprendront » explicite naturellement en français l’objet sous-entendu de l’écoute.
- source_word: יִצְחַק
  choice: riront
  rationale: Le verbe reprend la racine de צְחֹק et fait écho au nom d’Isaac ; « rire » préserve ce jeu lexical.
- source_word: לִי
  choice: avec moi
  rationale: Dans ce contexte joyeux, le datif indique probablement que les autres partageront le rire de Sara, sans exclure les autres nuances possibles.
theological_decisions:
- issue: Sens de יִצְחַק לִי dans la proposition finale
  choice: riront avec moi
  alternative: riront de moi ; riront à mon sujet / pour moi
  rationale: La naissance d’Isaac et la déclaration précédente favorisent l’idée d’une joie partagée. Toutefois, le datif hébreu לִי permet plusieurs nuances ; l’ambiguïté réelle est donc signalée en note plutôt que supprimée.
translation_notes:
  register: Français moderne, international et digne. La formulation est naturelle à l’oral comme à l’écrit. La répétition de « rire » préserve le jeu de mots hébreu lié au nom d’Isaac, tandis que la note maintient l’ambiguïté du datif final.
