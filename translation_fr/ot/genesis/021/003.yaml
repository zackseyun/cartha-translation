  source_fidelity: 'Le sens général est conservé : Abraham attribue le nom Isaac au fils né de Sara. Toutefois, « Sara lui avait donné » est plus large et moins explicite que ילד (« enfanter / mettre au monde ») ; il peut évoquer le don de l’enfant plutôt que son acte de naissance.'
