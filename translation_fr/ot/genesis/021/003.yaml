  text: וַ/יִּקְרָ֨א אַבְרָהָ֜ם אֶֽת שֶׁם בְּנ֧/וֹ הַ/נּֽוֹלַד ל֛/וֹ אֲשֶׁר יָלְדָה לּ֥/וֹ שָׂרָ֖ה יִצְחָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: fr
  text: Abraham donna à son fils, qui lui était né et que Sara lui avait enfanté, le nom d’Isaac.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֶׁם
  choice: donna ... le nom de
  rationale: Dans ce contexte, la construction קרא את־שם signifie « donner un nom à ». Cette tournure française reste proche de l’idiome hébreu tout en étant naturelle.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Le suffixe possessif désigne sans ambiguïté le fils d’Abraham.
- source_word: הַנּוֹלַד לוֹ
  choice: celui qui lui était né
  rationale: Cette formulation conserve le participe passif et le datif relationnel לוֹ, tout en marquant naturellement en français l’antériorité de la naissance.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: celui que Sara lui avait donné
  rationale: En français courant, « donner un enfant à quelqu’un » exprime naturellement l’idée de l’hébreu ילד avec le datif לוֹ. La reprise de « celui » clarifie les deux propositions relatives sans supprimer leur parallélisme.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Forme française traditionnelle et standard du nom hébreu יִצְחָק.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Les tirets dégagent les deux précisions relatives et permettent de garder le nom « Isaac » à la fin, conformément à l’effet de la syntaxe hébraïque, sans produire une phrase obscure.
