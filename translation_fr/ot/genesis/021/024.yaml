  yaml_path: translation/ot/genesis/021/024.yaml
  text: And Abraham said[a], “I swear it.”
translation:
  language: fr
  text: 'Abraham dit[a] : « Je prêterai serment. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Abraham répondit »; ou, pour l’engagement : « Je le jure » ou « Je jurerai ».'
    reason: Le verbe narratif peut être rendu contextuellement par « répondit »; l’inaccompli de « jurer » peut aussi être compris comme un présent performatif ou un futur d’engagement.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: répondit
  rationale: Dans ce dialogue, le verbe אמר précédé du waw narratif introduit la réponse d’Abraham. « Répondit » rend naturellement la fonction contextuelle sans ajouter de contenu.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Le nom propre suit sa forme française conventionnelle.
- source_word: אָנֹכִי
  choice: Moi, je
  rationale: Le pronom indépendant explicite et probablement souligne le sujet. « Moi, je » conserve cette mise en relief en français naturel.
- source_word: אִשָּׁבֵעַ
  choice: je le jure
  rationale: Le nifal de שבע signifie « jurer, prêter serment ». Ici, l’inaccompli exprime l’engagement d’Abraham en réponse à la demande précédente; « je le jure » est une formule française directe et idiomatique. Le pronom « le » reprend la teneur du serment demandé dans le contexte.
