  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: fr
  text: Abraham circoncit son fils Isaac alors qu’il avait huit jours[a], comme Dieu le lui avait ordonné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un fils de huit jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: circoncit
  rationale: Le verbe מול désigne précisément la circoncision. « Circoncit » est l’équivalent français direct, exact et naturel dans ce récit.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: son fils Isaac
  rationale: Cette formulation conserve à la fois le nom propre et l’insistance familiale de בְּנוֹ, tout en suivant un ordre naturel en français.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: à l’âge de huit jours
  rationale: L’expression hébraïque signifie littéralement « fils de huit jours ». La formulation retenue restitue naturellement cet idiome d’âge en français moderne.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction marque la conformité de l’acte d’Abraham au commandement divin. « Comme » l’exprime clairement sans suraccentuer le texte.
- source_word: צִוָּה אֹתוֹ
  choice: le lui avait ordonné
  rationale: Les pronoms français explicitent correctement qu’Abraham est le destinataire du commandement, tandis que le plus-que-parfait indique naturellement que celui-ci précédait l’action racontée.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le Dieu unique et s’emploie avec une valeur singulière.
theological_decisions:
- issue: Valeur temporelle du commandement divin antérieur
  choice: avait ordonné
  alternative: ordonna
  rationale: L’hébreu permet une narration au passé sans marquage français identique, mais le plus-que-parfait rend clairement l’antériorité du commandement de Genèse 17 sans ajouter de contenu théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit ; « à l’âge de huit jours » rend l’idiome hébreu avec clarté. Le marqueur [a] figure dans le texte principal.
