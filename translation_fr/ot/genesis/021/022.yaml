  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: fr
  text: 'À cette époque, Abimélek et Pikol, chef de son armée, dirent à Abraham : « Dieu[a] est avec toi dans tout ce que tu fais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement dans ce contexte : « Un dieu est avec toi. » Le mot hébreu אֱלֹהִים peut recevoir différents sens selon le contexte, mais il désigne ici le plus naturellement Dieu, qui est avec Abraham.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: À cette époque
  rationale: Cette expression introduit une nouvelle scène et la situe dans le temps. La formulation française est naturelle et conserve la fonction narrative sans calque lourd.
- source_word: וַיֹּאמֶר
  choice: dirent
  rationale: Le verbe hébreu est morphologiquement au singulier devant un sujet composé, construction possible en hébreu biblique. Le français exige ici le pluriel puisque Abimélek et Pikol parlent ensemble.
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: Abimélek et Pikol
  rationale: Les noms propres sont translittérés selon des formes françaises claires et usuelles.
- source_word: שַׂר צְבָאוֹ
  choice: chef de son armée
  rationale: שַׂר désigne ici l'officier placé à la tête de la force militaire, et צָבָא l'armée. « Chef de son armée » est précis, courant et digne.
- source_word: אֶל אַבְרָהָם לֵאמֹר
  choice: 'à Abraham :'
  rationale: לֵאמֹר introduit le discours direct. En français, les deux-points rendent naturellement cette fonction; ajouter « en disant » serait redondant.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le mot désigne le plus naturellement ici le Dieu dont la faveur accompagne Abraham.
- source_word: עִמְּךָ
  choice: est avec toi
  rationale: L'expression indique la présence et le soutien divins; « est avec toi » en conserve la formulation sobre et théologiquement ouverte.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: dans tout ce que tu fais
  rationale: Cette formulation exprime clairement la portée globale de l'affirmation et rend le participe hébreu par un présent de portée générale.
theological_decisions:
- issue: Référent de אֱלֹהִים dans les paroles d'Abimélek
  choice: Dieu
  alternative: un dieu
  rationale: Le contexte narratif présente la réussite d'Abraham comme le résultat de la faveur du Dieu qui l'accompagne. « Dieu » est donc la lecture la plus naturelle, mais l'indétermination formelle possible du terme hébreu est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative hébraïque est rendue sans archaïsmes; la formule redondante לֵאמֹר n'est pas reproduite littéralement, mais sa fonction d'introduction au discours direct est conservée par les deux-points.
