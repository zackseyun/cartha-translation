  register: Français international moderne, narratif et digne. « Outre » apporte la précision culturelle sans nécessiter de note. La syntaxe impersonnelle « il n’y eut plus d’eau » évite une formulation lourde tout en conservant le sens d’épuisement du texte hébreu.
