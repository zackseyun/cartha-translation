base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: fr
  text: Quand il n’y eut plus d’eau dans l’outre, elle jeta[a] le garçon sous l’un des buissons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lança ». Le verbe hébreu est plus fort que « posa » ou « déposa ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ הַמַּיִם
  choice: il n’y eut plus d’eau
  rationale: כלה indique ici que l’eau est arrivée à épuisement. Cette tournure française exprime naturellement qu’il ne restait plus d’eau.
- source_word: מִן הַחֵמֶת
  choice: dans l’outre
  rationale: חֵמֶת désigne un récipient fait de peau, destiné ici à contenir de l’eau. « Outre » est le terme français précis et courant dans un registre biblique accessible.
- source_word: וַתַּשְׁלֵךְ
  choice: elle jeta
  rationale: Le verbe שלך est plus fort que « poser » ou « déposer » et évoque un geste brusque. « Jeta » en conserve la force sans ajouter de motivation au personnage.
- source_word: אֶת הַיֶּלֶד
  choice: le garçon
  rationale: יֶלֶד désigne un enfant de sexe masculin. « Garçon » rend explicitement le genre et convient au contexte narratif.
- source_word: תַּחַת אַחַד הַשִּׂיחִם
  choice: sous l’un des buissons
  rationale: La formulation traduit directement la relation spatiale et le sens collectif de « l’un des buissons », dans un français naturel.
