    issue: « je lui ai donné un fils » à la place de « j’ai enfanté / mis au monde un fils »
    rationale: Le verbe ילדתי désigne l’acte d’enfanter. La tournure actuelle peut être comprise comme « lui procurer un fils » et ne rend pas explicitement la maternité et la naissance exprimées par l’hébreu.
