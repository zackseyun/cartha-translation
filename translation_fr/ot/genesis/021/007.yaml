  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: fr
  text: 'Elle dit : « Qui aurait dit à Abraham que Sara allaiterait des enfants[a] ? Car j’ai mis au monde un fils alors qu’il était vieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des fils ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Elle dit
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français et le pronom reprend naturellement Sara.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: Qui aurait dit à Abraham
  rationale: Le conditionnel passé rend l'interrogation rhétorique et l'étonnement devant une issue qui paraissait inimaginable, sans réduire la formule à un simple fait passé.
- source_word: הֵינִיקָה
  choice: allaiterait
  rationale: Le hiphil de ינק signifie donner le sein, allaiter. « Allaiter » est précis, naturel et actuel en français.
- source_word: בָנִים
  choice: des enfants
  rationale: Le mot hébreu est formellement le pluriel de « fils », mais dans l'expression avec « allaiter », « des enfants » est idiomatique en français; la proposition suivante précise qu'il s'agit d'un fils.
- source_word: שָׂרָה
  choice: Sara
  rationale: Graphie française usuelle du nom biblique.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le fondement explicatif de l'exclamation précédente plutôt qu'un contraste.
- source_word: יָלַדְתִּי בֵן
  choice: je lui ai donné un fils
  rationale: Littéralement, Sara dit qu'elle a enfanté un fils. La formulation française exprime naturellement la naissance et permet de rendre explicitement la relation marquée par la suite du verset.
- source_word: לִזְקֻנָיו
  choice: dans sa vieillesse
  rationale: La tournure rend idiomatiquement l'âge avancé d'Abraham tout en conservant le référent masculin du suffixe hébreu.
