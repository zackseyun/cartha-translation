- from: 'Elle dit : « Qui aurait dit à Abraham que Sara allaiterait des enfants[a] ? Car je lui ai donné un fils dans sa vieillesse. »'
  to: 'Elle dit : « Qui aurait dit à Abraham que Sara allaiterait des enfants[a] ? Car j’ai mis au monde un fils alors qu’il était vieux. »'
  rationale: La révision remplace une expression indirecte (« lui ai donné ») par « ai mis au monde », qui rend explicitement le verbe hébreu « enfanter ». « Alors qu’il était vieux » conserve clairement Abraham comme référent de la vieillesse, conformément au suffixe masculin hébreu, dans un français moderne naturel.
  reviewer_model: gpt-5.6-terra
