  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: fr
  text: Ils conclurent une alliance à Beer-Shéba[a]. Puis Abimélek et Picol, le chef de son armée, se levèrent et retournèrent au pays des Philistins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « coupèrent une alliance », expression qui signifie conclure une alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: ils conclurent une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance ». En français actuel, « conclure une alliance » restitue naturellement l’idée de l’engagement solennel sans rendre l’idiome opaque.
- source_word: בִּבְאֵר שָׁבַע
  choice: à Beer-Shéba
  rationale: La préposition ב marque ici le lieu. « À » convient naturellement devant ce nom de lieu, transcrit selon un usage français courant.
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום signifie se lever ou se mettre debout. « Se leva » garde le mouvement narratif et un registre digne sans archaïsme.
- source_word: וּפִיכֹל
  choice: avec Pikol
  rationale: La conjonction hébraïque signifie formellement « et », mais « avec Pikol » rend clairement en français que les deux hommes se lèvent puis accomplissent ensemble l’action exprimée par le verbe pluriel suivant.
- source_word: שַׂר צְבָאוֹ
  choice: chef de son armée
  rationale: שַׂר désigne un chef ou commandant, et צָבָא l’armée ou les forces militaires. Cette formulation est claire, naturelle et fidèle.
- source_word: וַיָּשֻׁבוּ
  choice: ils retournèrent
  rationale: Dans ce contexte, שׁוב exprime le retour. Le passé simple convient au récit biblique français dans un registre littéraire accessible.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: au pays des Philistins
  rationale: Cette traduction suit directement l’expression ethnogéographique hébraïque, littéralement « vers le pays des Philistins ».
