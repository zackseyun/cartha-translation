  text: And Abraham set seven ewe lambs of the flock by themselves[a].
translation:
  language: fr
  text: Abraham plaça sept agnelles du troupeau à part[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mit à part sept agnelles du troupeau ». Le verbe hébreu peut évoquer le fait de les placer dans une position distincte, détail significatif dans le contexte de l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: plaça
  rationale: Le hiphil de נצב exprime ici le fait de mettre quelque chose dans une position déterminée. « Plaça » rend concrètement l’action sans préciser plus que l’hébreu sa fonction dans l’alliance.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶת
  choice: '[marqueur de l’objet direct, non traduit]'
  rationale: Ce marqueur hébreu n’a pas d’équivalent lexical en français; la fonction est indiquée par la syntaxe.
- source_word: שֶׁבַע
  choice: sept
  rationale: Rend directement le nombre cardinal.
- source_word: כִּבְשֹׂת
  choice: agnelles
  rationale: Le nom désigne des agneaux femelles. « Agnelles » en préserve de façon concise le sexe et le jeune âge.
- source_word: הַצֹּאן
  choice: du troupeau
  rationale: צֹאן est un collectif désignant le petit bétail. « Du troupeau » reste naturel et évite de restreindre inutilement le collectif aux seuls moutons.
- source_word: לְבַדְּהֶן
  choice: à part
  rationale: L’expression indique que les sept agnelles sont séparées du reste; « à part » est clair et idiomatique en français.
theological_decisions:
- issue: Portée de la mise à part dans le contexte de l’alliance
  choice: Ne pas expliciter sa fonction dans le texte principal
  alternative: « mit à part » ou ajout d’une indication de témoignage
  rationale: Le verset décrit une séparation concrète, mais n’en donne l’explication que dans le contexte suivant. La traduction préserve cette progression sans imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, simple et digne. « Agnelles » est précis sans être excessivement technique; « plaça… à part » conserve la nuance concrète du verbe hébreu tout en restant naturel.
