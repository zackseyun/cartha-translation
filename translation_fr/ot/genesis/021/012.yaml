  to: 'Mais Dieu dit à Abraham : « Ne t’afflige pas à cause du garçon et de ton esclave[a]. Tout ce que Sara te dira, écoute sa voix[b], car c’est par Isaac qu’une descendance portera ton nom[c]. »'
  rationale: La révision remplace une tournure française déficiente par « une descendance portera ton nom », qui communique clairement la désignation de la lignée d’Abraham par Isaac. « Ne t’afflige pas » reste proche de l’idiome hébreu tout en étant plus direct que « ne te tourmente pas ». Les notes conservent l’image et la formulation plus littérales sans surinterpréter la portée de la promesse.
