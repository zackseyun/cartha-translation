review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle, y compris le statut servile d’Agar et l’orientation de la lignée par Isaac. Toutefois, « sera appelée ta descendance » ne rend pas de façon intelligible en français la construction hébraïque יִקָּרֵא לְךָ זָרַע : il paraît manquer le complément de « appelée » et peut évoquer un appel adressé à la descendance plutôt que sa désignation comme celle d’Abraham.'
  naturalness: « Ne te tourmente pas » est possible, mais « ne t’afflige pas » rend plus directement l’idée de peine ou de contrariété. La dernière proposition doit être reformulée pour un français moderne naturel et précis.
  terminology: « le garçon », « ton esclave », « écoute sa voix » et « descendance » sont appropriés. « Portera ton nom » est une expression française naturelle pour la descendance reconnue comme celle d’Abraham; elle rend la fonction de désignation sans introduire une lecture confessionnelle.
  issues:
  - severity: medium
    issue: La formulation « c’est par Isaac que sera appelée ta descendance » est syntaxiquement et sémantiquement incomplète en français.
    rationale: Le passif « sera appelée » appelle normalement un attribut ou un complément indiquant sous quel nom la descendance est appelée. La construction peut être comprise comme si la descendance était convoquée par Isaac, ce qui ne correspond pas à l’hébreu. Le texte exprime que la descendance portant le nom d’Abraham sera désignée par Isaac.
