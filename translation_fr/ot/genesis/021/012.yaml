  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: fr
  text: 'Mais Dieu dit à Abraham : « Ne t’afflige pas à cause du garçon et de ton esclave[a]. Tout ce que Sara te dira, écoute sa voix[b], car c’est par Isaac qu’une descendance portera ton nom[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que cela ne soit pas mauvais à tes yeux au sujet du garçon et de ton esclave » ; autrement dit : « N’en sois pas affligé ou contrarié. »'
    reason: lexical_alternative
  - marker: b
    text: '« Écoute sa voix » signifie ici : tiens compte de ce que Sara te dit.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « car c’est en/par Isaac qu’une descendance sera appelée pour toi ». La tournure indique que la lignée reconnue comme celle d’Abraham passera par Isaac.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: ne te tourmente pas
  rationale: L’expression idiomatique décrit ce qui afflige ou contrarie Abraham. Cette formulation rend naturellement la détresse évoquée dans le contexte, tandis que la note conserve l’image hébraïque des yeux.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נַעַר désigne ici Ismaël comme jeune garçon; « garçon » est courant, précis et non archaïque.
- source_word: אֲמָתֶךָ
  choice: ton esclave
  rationale: אָמָה désigne une femme en condition servile. « Ton esclave » préserve sans l’adoucir cette réalité sociale; le genre féminin ressort de l’identité d’Agar dans le contexte.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: écoute sa voix
  rationale: La traduction conserve l’expression hébraïque, qui signifie prêter attention à ce que Sara dit et agir en conséquence, sans la renforcer automatiquement en « obéis-lui ».
- source_word: בְּיִצְחָק
  choice: par Isaac
  rationale: La préposition בְּ indique ici la lignée ou le moyen par lequel la descendance promise sera identifiée; « par Isaac » l’exprime clairement.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: sera appelée ta descendance
  rationale: Cette formulation garde le langage d’appel ou de désignation du texte hébreu et rattache לְךָ à la descendance d’Abraham, sans réduire la phrase à une simple affirmation biologique.
- source_word: זָרַע
  choice: descendance
  rationale: זֶרַע est un nom collectif. « Descendance » en restitue naturellement la portée collective en français moderne.
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Mais Dieu dit
  rationale: « Mais » rend le contraste narratif entre la détresse d’Abraham au verset précédent et la réponse de Dieu.
theological_decisions:
- issue: Statut social d’Agar
  choice: ton esclave
  alternative: ta servante
  rationale: Le terme hébreu marque la condition servile d’Agar. Le choix retenu évite d’atténuer cette réalité historique sans ajouter de jugement absent du verset.
- issue: Sens de la promesse concernant Isaac
  choice: car c’est par Isaac que sera appelée ta descendance
  alternative: car c’est par Isaac que ta descendance sera reconnue comme la tienne
  rationale: Le texte identifie par Isaac la lignée promise à Abraham, tout en laissant intacte sa relation biologique avec Ismaël. Le verbe « appelée » préserve le langage de désignation de l’hébreu plutôt que d’expliciter entièrement la notion de lignée d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. Le texte conserve deux images hébraïques importantes (« écoute sa voix » et « sera appelée »), expliquées en notes, tout en employant une syntaxe française fluide. « Esclave » maintient explicitement le statut social exprimé par le texte source.
