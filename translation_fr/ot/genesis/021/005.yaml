  text: וְ/אַבְרָהָ֖ם בֶּן מְאַ֣ת שָׁנָ֑ה בְּ/הִוָּ֣לֶד ל֔/וֹ אֵ֖ת יִצְחָ֥ק בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: fr
  text: Abraham avait cent ans lorsque son fils Isaac naquit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: En français, la simple juxtaposition assure naturellement le lien narratif; traduire וְ par « Et » serait possible, mais plus lourd ici.
- source_word: בֶּן מְאַת שָׁנָה
  choice: avait cent ans
  rationale: L’expression hébraïque littérale « fils de cent ans » est un idiome indiquant l’âge; « avait cent ans » est son équivalent français naturel.
- source_word: בְּ/הִוָּלֶד
  choice: lorsque … naquit
  rationale: La préposition suivie de l’infinitif construit exprime ici une circonstance temporelle. Le passé simple « naquit » convient au récit et rend naturellement le sens passif de la forme hébraïque.
- source_word: ל֔/וֹ
  choice: lui
  rationale: Le pronom indique qu’Isaac est né à Abraham; la construction française « lui naquit » conserve cette relation sans ajouter l’idée plus interprétative de « pour lui ».
- source_word: אֵת יִצְחָק
  choice: Isaac
  rationale: אֵת est un marqueur grammatical sans équivalent lexical autonome dans cette construction; le nom est rendu selon sa forme française traditionnelle.
- source_word: בְּנֽ/וֹ
  choice: son fils
  rationale: Cette apposition explicite la relation filiale d’Isaac avec Abraham, sans l’emphase supplémentaire qu’introduirait « son propre fils ».
