  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: fr
  text: Dieu était avec le garçon, qui grandit. Il vécut dans le désert et devint archer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: Dieu était avec le garçon
  rationale: L’expression היה את marque ici la présence bienveillante et le soutien de Dieu. « Était avec » la rend naturellement sans expliciter davantage ses implications.
- source_word: וַיִּגְדָּל
  choice: qui grandit
  rationale: Le verbe גדל évoque ici la croissance et la maturation du garçon. La relative permet un enchaînement naturel en français sans ajouter l’idée plus précise de parvenir à l’âge adulte.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: Il vécut dans le désert
  rationale: ישב désigne une résidence durable, rendue ici par « vivre ». מִדְבָּר désigne une région aride et peu habitée ; « désert » est le terme français courant et approprié dans ce contexte.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: devint archer
  rationale: La construction décrit quelqu’un qui tire à l’arc. « Archer » en donne une expression française concise, naturelle et exacte.
theological_decisions:
- issue: Formule de présence divine appliquée à Ismaël
  choice: Dieu était avec le garçon
  alternative: Dieu aidait le garçon
  rationale: La formulation conserve l’affirmation de la présence et du soutien de Dieu sans la réduire à une aide ponctuelle ni développer ses implications théologiques.
translation_notes:
  register: Français international moderne, simple et digne. Le rythme narratif est conservé dans deux phrases, avec un vocabulaire accessible et sans archaïsmes.
