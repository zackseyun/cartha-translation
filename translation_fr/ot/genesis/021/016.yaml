base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: fr
  text: 'Elle alla s’asseoir en face de lui, à distance, à environ une portée d’arc, car elle se disait : « Que je ne voie pas mourir l’enfant ! » Elle s’assit donc en face de lui, éleva la voix et pleura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: en face de lui
  rationale: L’expression indique une position à l’opposé, à une certaine distance. Le complément הַרְחֵק et la portée d’arc précisent ici l’éloignement; la répétition de « en face de lui » conserve celle de l’hébreu.
- source_word: הַרְחֵק
  choice: à l’écart
  rationale: Cette forme adverbiale de רחק souligne l’éloignement. « À l’écart » est naturel en français et évite de répéter « à distance » avant l’indication de la portée d’arc.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: à environ une portée d’arc
  rationale: Cette expression donne une distance approximative mesurée par la portée d’un tir à l’arc; la formulation française reste concise et concrète.
- source_word: הַיָּלֶד
  choice: l’enfant
  rationale: יֶלֶד peut désigner un enfant ou un garçon. « L’enfant » convient à la relation maternelle mise en avant dans la scène sans imposer un âge trop précis.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: Je ne veux pas voir mourir l’enfant
  rationale: Le tour volitif négatif exprime son refus ou son souhait de ne pas assister à la mort. Cette formulation française naturelle conserve le point de vue d’Agar et le caractère poignant de la phrase.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  choice: elle éleva la voix
  rationale: La traduction conserve l’image de l’idiome hébreu tout en restant compréhensible en français actuel; le verbe suivant précise qu’il s’agit de pleurs.
- source_word: וַתֵּבְךְּ
  choice: pleura
  rationale: « Pleura » rend directement le verbe בכה et le distingue de l’action précédente d’élever la voix.
- source_word: לָהּ
  choice: elle alla s’asseoir
  rationale: Le datif pronominal accompagne ici le verbe s’asseoir et peut avoir une nuance éthique ou réflexive, difficile à isoler naturellement en français. L’idée de séparation est déjà portée par « à l’écart » et « en face de lui ».
