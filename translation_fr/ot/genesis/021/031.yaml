  text: עַל כֵּ֗ן קָרָ֛א לַ/מָּק֥וֹם הַ/ה֖וּא בְּאֵ֣ר שָׁ֑בַע כִּ֛י שָׁ֥ם נִשְׁבְּע֖וּ שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/031.yaml
  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: fr
  text: C’est pourquoi il appela ce lieu Beer-Shéba[a], car c’est là qu’ils prêtèrent serment tous les deux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, Beer-Shéba évoque à la fois « puits des sept » et « puits du serment » ; l’explication donnée ici rattache surtout ce nom au serment prêté en ce lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Expression causale-consécutive naturelle en français moderne, qui relie explicitement le nom du lieu à l’événement qui vient d’être raconté.
- source_word: קָרָא
  choice: il appela
  rationale: Le verbe peut signifier « appeler » ou « nommer ». « Il appela ce lieu » reste proche de la formulation hébraïque tout en exprimant clairement l’attribution d’un nom.
- source_word: לַמָּקוֹם הַהוּא
  choice: ce lieu
  rationale: Le démonstratif renvoie au lieu précis déjà mentionné ; « ce lieu » est naturel et fidèle.
- source_word: בְּאֵר שָׁבַע
  choice: Beer-Shéba
  rationale: Translittération française usuelle du nom propre. Le jeu de mots hébreu associant le puits, le chiffre sept et le serment est conservé dans une note plutôt que traduit dans le corps du texte.
- source_word: כִּי
  choice: car
  rationale: Introduit l’explication du nom. « Car » convient à la syntaxe narrative et au registre digne du passage.
- source_word: שָׁם
  choice: c’est là
  rationale: Rend l’adverbe locatif avec une tournure française naturelle qui maintient l’accent sur le lieu.
- source_word: נִשְׁבְּעוּ
  choice: prêtèrent serment
  rationale: Le nifal de שבע signifie « jurer, prêter serment ». Cette expression française explicite l’acte solennel et laisse percevoir le lien avec le nom Beer-Shéba.
- source_word: שְׁנֵיהֶם
  choice: tous les deux
  rationale: Rend clairement l’insistance hébraïque sur les deux parties concernées.
theological_decisions: []
