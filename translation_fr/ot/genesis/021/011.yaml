source:
  edition: WLC
  text: וַ/יֵּ֧רַע הַ/דָּבָ֛ר מְאֹ֖ד בְּ/עֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: fr
  text: Cette affaire déplut beaucoup à Abraham, à cause de son fils[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet de son fils ».
    reason: La locution hébraïque עַל אֹדוֹת peut indiquer aussi bien la cause que le sujet de la réaction d’Abraham.
lexical_decisions:
- source_word: וַיֵּרַע
  choice: déplut beaucoup
  rationale: Avec בְּעֵינֵי, le verbe exprime ici une réaction fortement négative. « Déplut beaucoup à Abraham » rend naturellement l’idiome hébreu sans attribuer explicitement à l’affaire une qualité morale mauvaise.
- source_word: הַדָּבָר
  choice: cette affaire
  rationale: דָּבָר désigne ici la demande formulée par Sara au verset précédent. « Cette affaire » renvoie clairement au contexte tout en conservant la portée assez large du terme.
- source_word: מְאֹד
  choice: beaucoup
  rationale: L’adverbe intensifie fortement le déplaisir; placé après « déplut », « beaucoup » est naturel en français moderne.
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: à Abraham
  rationale: L’expression signifie littéralement « aux yeux d’Abraham ». Le français idiomatique avec « déplaire » appelle le complément « à Abraham »; le sens évaluatif de l’image hébraïque est conservé.
- source_word: עַל אֹדוֹת
  choice: à cause de
  rationale: La locution peut exprimer le motif ou le sujet de la réaction. « À cause de » convient au contexte immédiat, tout en laissant la note signaler la lecture plus générale « au sujet de ».
- source_word: בְּנוֹ
  choice: son fils
  rationale: בֵּן désigne explicitement un fils; cette traduction préserve la précision relationnelle et sexuée de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure française naturelle « déplut à Abraham » remplace l’idiome littéral « fut très mauvaise aux yeux d’Abraham », tandis qu’une note préserve l’ambiguïté de la locution finale.
