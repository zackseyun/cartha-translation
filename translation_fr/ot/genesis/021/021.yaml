  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: fr
  text: Il habita dans le désert de Parân[a], et sa mère lui prit pour femme une Égyptienne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il vécut dans le désert de Parân. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une femme du pays d’Égypte ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Il habita
  rationale: Le verbe יׁשב exprime ici le fait de demeurer ou de vivre en un lieu. « Il habita » convient au résumé narratif sans affirmer un établissement définitif.
- source_word: בְּמִדְבַּר פָּארָן
  choice: dans le désert de Parân
  rationale: מִדְבָּר désigne une région aride et peu habitée. « Désert » est naturel en français moderne, et le nom géographique est translittéré « Parân ».
- source_word: וַתִּקַּח לוֹ אִמּוֹ
  choice: sa mère lui prit
  rationale: La construction indique que sa mère prit ou choisit quelqu’un pour lui. Cette formulation reste proche de l’hébreu tout en signalant l’initiative maternelle dans le mariage.
- source_word: אִשָּׁה
  choice: pour femme
  rationale: אִשָּׁה peut signifier « femme » au sens général ou « épouse ». Le contexte matrimonial justifie « pour femme », formule qui préserve aussi le tour verbal de l’hébreu.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: une Égyptienne
  rationale: L’hébreu dit littéralement « une femme du pays d’Égypte ». « Une Égyptienne » transmet naturellement en français son origine, tandis que la forme explicite est conservée en note.
