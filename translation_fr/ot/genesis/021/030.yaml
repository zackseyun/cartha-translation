  text: וַ/יֹּ֕אמֶר כִּ֚י אֶת שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִ/יָּדִ֑/י בַּ/עֲבוּר֙ תִּֽהְיֶה לִּ֣/י לְ/עֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת הַ/בְּאֵ֥ר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: fr
  text: 'Il dit : « Tu prendras de ma main ces sept agnelles, afin que cela soit pour moi un témoignage[a] que j’ai creusé ce puits. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « afin qu’elles soient pour moi un témoignage ». Le verbe hébreu est au singulier, bien que son référent immédiat soit les sept agnelles ; elles peuvent être envisagées collectivement, ou le singulier peut renvoyer à leur remise ou à l’accord conclu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol fait avancer le récit; le passé simple convient au registre narratif français sans surinterpréter la relation temporelle.
- source_word: כִּי אֶת שֶׁבַע כְּבָשֹׂת תִּקַּח
  choice: Tu prendras ces sept agnelles
  rationale: Le premier כִּי introduit ici le contenu de la parole, sans devoir être traduit séparément. L’imparfait hébreu exprime l’action attendue; le futur français garde cette valeur directive. כְּבָשֹׂת désigne des agnelles.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: La formulation concrète de l’hébreu est naturelle en français et souligne la remise formelle des animaux.
- source_word: בַּעֲבוּר
  choice: afin que
  rationale: La locution marque ici le but.
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: cela me serve de témoignage
  rationale: Le verbe hébreu est au féminin singulier, malgré les sept agnelles comme référent immédiat. « Cela » peut viser collectivement leur remise ou l’accord ainsi attesté, tout en conservant le singulier du texte.
- source_word: כִּי חָפַרְתִּי
  choice: c’est moi qui ai creusé
  rationale: Le second כִּי introduit le contenu du témoignage. La tournure clivée française exprime naturellement la revendication d’Abraham dans ce contexte de contestation du puits, sans ajouter une idée étrangère.
- source_word: הַבְּאֵר הַזֹּאת
  choice: ce puits
  rationale: Traduction directe et idiomatique du syntagme démonstratif.
theological_decisions:
- issue: Référent singulier de תִּהְיֶה
  choice: « cela me serve de témoignage »
  alternative: « elles me servent de témoignage »
  rationale: Le singulier grammatical est maintenu sans imposer précisément si le témoin est le groupe considéré collectivement, sa remise ou l’accord; une note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient le registre narratif; le futur « tu prendras » restitue une directive ferme sans tonalité juridique excessive. Le marqueur [a] est placé après la phrase concernée.
