    issue: Focalisation ajoutée dans « c’est moi qui ai creusé »
    rationale: La tournure clivée introduit une insistance sur le sujet qui n’est pas explicitement marquée par le texte hébreu. La formulation simple maintient l’affirmation d’Abraham sans ajout rhétorique.
  - severity: low
    issue: Ancrage de la note éloigné du syntagme concerné
    rationale: La note explique le singulier de « témoignage » et son référent possible; l’appel doit suivre ce mot plutôt que la phrase entière.
