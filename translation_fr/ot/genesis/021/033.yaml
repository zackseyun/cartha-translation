  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: fr
  text: Il planta un tamaris à Beer-Shéba et, là, il invoqua le nom de Yahweh[a], le Dieu éternel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il proclama le nom de Yahweh » ou « il fit appel au nom de Yahweh ». L’expression hébraïque peut évoquer à la fois la proclamation et l’invocation dans un contexte de culte.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Dieu d’éternité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: il planta
  rationale: Le qal de נטע signifie couramment « planter ». Le passé simple convient au récit suivi en français et conserve le sujet pronominal non explicité du texte hébreu.
- source_word: אֶשֶׁל
  choice: un tamaris
  rationale: Le nom singulier אֶשֶׁל désigne très probablement un tamaris. Cette traduction garde la précision botanique sans adopter l’interprétation ancienne « bosquet ».
- source_word: בִּבְאֵר שָׁבַע
  choice: à Beer-Shéba
  rationale: La préposition ב marque ici le lieu. « À » est naturel devant un nom de ville, et « Beer-Shéba » est une translittération française courante du toponyme.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: là, il invoqua le nom de
  rationale: Dans ce contexte cultuel, קרא בשם peut exprimer l’invocation, tout en pouvant aussi évoquer la proclamation. Le choix principal est idiomatique en français, et la note conserve l’autre valeur possible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: אֵל עוֹלָם
  choice: le Dieu éternel
  rationale: Cette expression française naturelle rend אֵל « Dieu » et la valeur attributive de עוֹלָם, qui exprime ici la perpétuité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Portée de la formule cultuelle קרא בשם יהוה
  choice: invoqua le nom de Yahweh
  alternative: proclama le nom de Yahweh / fit appel au nom de Yahweh
  rationale: La formule peut désigner un appel cultuel adressé à Dieu et comporter aussi une dimension de proclamation. La traduction principale retient l’invocation, tandis que la note maintient l’ambiguïté réelle.
- issue: Valeur de אֵל עוֹלָם
  choice: le Dieu éternel
  alternative: le Dieu d’éternité
  rationale: « Le Dieu éternel » exprime naturellement la durée sans fin, tandis que la formulation plus littérale reste signalée afin de ne pas masquer la structure hébraïque.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre du récit biblique sans être archaïque. La phrase conserve le pronom « il » de l’hébreu au lieu d’ajouter explicitement le nom d’Abraham. Les marqueurs de note sont placés immédiatement après les expressions qu’ils expliquent.
