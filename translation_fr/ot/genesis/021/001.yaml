  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: fr
  text: Yahweh intervint en faveur de Sara comme il l’avait dit[a], et Yahweh fit pour Sara ce qu’il avait déclaré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh visita Sara ». Le verbe hébreu peut indiquer que Dieu porte son attention sur quelqu’un afin d’agir en sa faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel et préserve sa répétition emphatique dans les deux propositions.
- source_word: פָּקַד
  choice: intervint en faveur de
  rationale: Dans ce contexte d’accomplissement de la promesse, le verbe désigne l’attention de Dieu qui se traduit par une action bienfaisante; cette formulation évite le sens français courant, simplement spatial ou social, de « visiter ».
- source_word: כַּאֲשֶׁר אָמָר
  choice: comme il l’avait dit
  rationale: Le plus-que-parfait renvoie naturellement à la parole divine antérieure et souligne son accomplissement.
- source_word: וַיַּעַשׂ ... לְשָׂרָה
  choice: fit pour Sara
  rationale: Conserve la généralité du verbe עשה et rend la préposition ל dans son sens bénéficiaire.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: ce qu’il avait annoncé
  rationale: Rend la seconde formule de parole en français naturel tout en la distinguant légèrement de אָמַר; « annoncé » convient à une parole divine antérieure dont le contenu s’accomplit ici.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; la translittération conserve le nom personnel sans introduire un titre de substitution.
- issue: Portée de l’intervention divine envers Sara
  choice: intervint en faveur de Sara
  alternative: visita Sara
  rationale: Le choix exprime une attention divine effective et bienveillante sans préciser dans ce verset seul le moyen concret, exposé au verset suivant.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination et la répétition de « Yahweh » reproduisent la structure solennelle de l’hébreu. Aucun marqueur temporel équivalent à « maintenant » n’est ajouté.
