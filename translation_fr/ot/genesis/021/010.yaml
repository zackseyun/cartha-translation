  text: וַ/תֹּ֨אמֶר֙ לְ/אַבְרָהָ֔ם גָּרֵ֛שׁ הָ/אָמָ֥ה הַ/זֹּ֖את וְ/אֶת בְּנָ֑/הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן הָ/אָמָ֣ה הַ/זֹּ֔את עִם בְּנִ֖/י עִם יִצְחָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: fr
  text: 'Alors elle dit à Abraham : « Chasse cette esclave et son fils, car le fils de cette esclave n’héritera pas avec mon fils, avec Isaac. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: Chasse
  rationale: L’impératif exprime une expulsion énergique. « Chasse » en conserve la force, contrairement au plus doux « renvoie ».
- source_word: הָאָמָה
  choice: cette esclave
  rationale: אָמָה désigne ici une femme en condition servile. « Esclave » rend clairement le statut social et juridique, tandis que le démonstratif conserve la distance méprisante du propos.
- source_word: בְּנָהּ
  choice: son fils
  rationale: Rend directement la construction possessive hébraïque.
- source_word: כִּי לֹא יִירַשׁ
  choice: car … n’héritera pas
  rationale: כִּי introduit le motif de l’ordre, et יָרַשׁ relève ici de l’héritage. Le futur français convient à la forme verbale et au contexte.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: le fils de cette esclave
  rationale: La reprise du groupe nominal, plutôt qu’un simple pronom, préserve l’insistance et la mise à distance présentes dans l’hébreu.
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: avec mon fils, avec Isaac
  rationale: La répétition de עִם est conservée afin de respecter l’emphase appositionnelle inhabituelle du texte hébreu, sans la lisser en « avec mon fils Isaac ».
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: Elle dit donc à Abraham
  rationale: Le waw narratif marque la suite du récit; « donc » exprime naturellement ici l’enchaînement avec la scène précédente.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve la dureté du discours de Sarah, la répétition dépréciative de « cette esclave » et l’emphase de la double préposition finale, même si celle-ci est légèrement marquée en français.
