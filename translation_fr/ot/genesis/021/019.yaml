base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: fr
  text: Alors Dieu lui ouvrit les yeux, et elle vit un puits d’eau. Elle alla remplir d’eau l’outre[a], puis elle donna à boire au garçon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une outre était un récipient en peau utilisé pour transporter des liquides.
    reason: Précision lexicale pour un objet qui peut être peu familier au lecteur moderne.
lexical_decisions:
- source_word: וַיִּפְקַח אֱלֹהִים אֶת עֵינֶיהָ
  choice: Dieu lui ouvrit les yeux
  rationale: Cette formulation conserve l’action explicitement attribuée à Dieu ainsi que l’image hébraïque de l’ouverture des yeux, tout en étant naturelle en français.
- source_word: וַתֵּרֶא
  choice: elle vit
  rationale: Le verbe simple « voir » rend directement ראה et s’insère naturellement dans la succession narrative.
- source_word: בְּאֵר מָיִם
  choice: un puits d’eau
  rationale: Cette expression conserve la mention explicite de l’eau dans l’hébreu et souligne sa découverte vitale dans le contexte.
- source_word: הַחֵמֶת
  choice: l’outre
  rationale: חֵמֶת désigne un récipient en peau destiné à transporter un liquide. « Outre » est précis, concis et idiomatique en français.
- source_word: וַתַּשְׁקְ אֶת הַנָּעַר
  choice: elle donna à boire au garçon
  rationale: La tournure rend naturellement la forme causative de שׁקה et traduit נַעַר par un terme moderne adapté au contexte.
theological_decisions:
- issue: Faut-il interpréter l’ouverture des yeux comme le simple fait de remarquer un puits déjà présent ?
  choice: Dieu lui ouvrit les yeux
  alternative: Dieu lui permit d’apercevoir le puits
  rationale: Le texte hébreu attribue directement cette action à Dieu. La traduction garde cette image et la tension concernant le mode de l’intervention divine sans l’expliquer.
translation_notes:
  register: Français international moderne, narratif et digne. « Alors » marque la progression du récit, et « puis » clarifie sobrement la succession des actions sans ajouter d’interprétation.
