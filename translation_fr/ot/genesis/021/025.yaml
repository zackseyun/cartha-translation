lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: fit des reproches
  rationale: Le hifil de יכח exprime ici une réprimande ou une protestation adressée directement à Abimélek; cette tournure est naturelle et digne en français.
- source_word: עַל אֹדוֹת
  choice: au sujet de
  rationale: Rend précisément la locution indiquant l’objet de la protestation.
- source_word: בְּאֵר הַמַּיִם
  choice: un puits
  rationale: En français, « puits » suffit naturellement à exprimer un puits d’eau; l’article hébreu peut ici se rendre par l’indéfini lors de la première mention dans cette scène.
- source_word: גָּזְלוּ
  choice: avaient pris de force
  rationale: Le verbe désigne une appropriation violente ou injuste; « pris de force » conserve cette intensité sans imposer le vocabulaire juridique plus étroit de « voler ».
