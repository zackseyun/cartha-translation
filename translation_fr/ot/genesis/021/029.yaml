  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה הֵ֗נָּה שֶׁ֤בַע כְּבָשֹׂת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר הִצַּ֖בְתָּ לְ/בַדָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/029.yaml
  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: fr
  text: 'Abimélek dit à Abraham : « Que sont ces sept agnelles que tu as placées à part[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que tu as mises à part ». Le verbe hébreu peut signifier simplement « placer » ou « disposer » ; avec « à part », il indique que les agnelles étaient séparées du reste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: demanda
  rationale: Dans ce contexte interrogatif, « demanda » rend naturellement l’acte de parole tout en faisant avancer le récit.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: מָה הֵנָּה
  choice: Que représentent
  rationale: La tournure hébraïque signifie littéralement « que sont-elles ? ». En français actuel, « Que représentent… ? » exprime naturellement la question portant sur la fonction ou la signification de ce groupe d’animaux, sans la transformer directement en question causale (« pourquoi »).
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: ces sept agnelles
  rationale: כְּבָשֹׂת désigne ici de jeunes brebis; « agnelles » conserve avec concision la précision du féminin.
- source_word: הִצַּבְתָּ
  choice: tu as mises à part
  rationale: Le hifil de נצב signifie « placer, établir ». Avec לְבַדָּנָה, le contexte indique que les agnelles ont été disposées séparément du reste.
- source_word: לְבַדָּנָה
  choice: à part
  rationale: Cette expression indique que les sept agnelles forment un groupe séparé.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Agnelles » préserve la précision féminine du terme hébreu. La question reste centrée sur la signification ou la fonction des sept animaux, plutôt que d’être reformulée explicitement avec « pourquoi ».
