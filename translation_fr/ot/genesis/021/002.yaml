  text: וַ/תַּהַר֩ וַ/תֵּ֨לֶד שָׂרָ֧ה לְ/אַבְרָהָ֛ם בֵּ֖ן לִ/זְקֻנָ֑י/ו לַ/מּוֹעֵ֕ד אֲשֶׁר דִּבֶּ֥ר אֹת֖/וֹ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: fr
  text: Ainsi, Sara devint enceinte et donna un fils à Abraham dans sa vieillesse, au moment fixé dont Dieu lui avait parlé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: devint enceinte
  rationale: Le verbe הרה exprime le fait de concevoir ou de devenir enceinte. Cette formulation est naturelle en français moderne et convient à la progression narrative.
- source_word: וַתֵּלֶד
  choice: donna un fils à Abraham
  rationale: Le verbe ילד désigne ici l’accouchement. Cette tournure rend naturellement la construction hébraïque « enfanta pour Abraham un fils » sans archaïsme.
- source_word: בֵּן
  choice: un fils
  rationale: Le nom singulier désigne explicitement un enfant de sexe masculin; l’article indéfini est idiomatique en français.
- source_word: לִזְקֻנָיו
  choice: dans sa vieillesse
  rationale: L’expression situe la naissance pendant la vieillesse d’Abraham. Placée immédiatement après son nom, elle conserve le référent masculin indiqué par le suffixe hébreu.
- source_word: לַמּוֹעֵד
  choice: au moment fixé
  rationale: מוֹעֵד désigne un moment déterminé ou fixé. « Moment fixé » est clair, naturel et préserve l’idée d’une échéance préalablement établie.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: dont Dieu lui avait parlé
  rationale: La relative se rapporte au moment fixé et évoque la parole antérieure de Dieu à Abraham. « Dont » rend ce rapport sans suggérer que Dieu aurait parlé à ce moment-là.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Traduction française directe et habituelle de אֱלֹהִים dans ce contexte.
- source_word: וַ
  choice: Ainsi
  rationale: Le waw initial poursuit le récit tout en présentant l’accomplissement de la promesse du verset précédent. « Ainsi » exprime naturellement ce lien sans ajouter de commentaire.
theological_decisions:
- issue: Exprimer l’accomplissement de la parole divine sans accent interprétatif ajouté
  choice: au moment fixé dont Dieu lui avait parlé
  alternative: au moment fixé que Dieu lui avait annoncé
  rationale: La formulation retenue conserve le verbe général « parler » et rattache clairement la proposition relative au moment fixé, maintenant ainsi le motif de l’accomplissement sans expliciter davantage la nature de la parole divine.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite l’archaïsme « enfanta » tout en conservant la succession concise de la conception et de la naissance.
