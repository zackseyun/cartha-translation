id: GEN.21.18
reference: Genesis 21:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: fr
  text: Lève-toi, relève le garçon et soutiens-le fermement de ta main[a], car je ferai de lui une grande nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « saisis-le fermement de ta main ». L’expression hébraïque évoque une prise ferme ou un soutien énergique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: Lève-toi
  rationale: Impératif féminin singulier de קום adressé à Agar. « Lève-toi » est naturel, direct et conserve la force de l’ordre.
- source_word: שְׂאִ֣י אֶת הַנַּ֔עַר
  choice: relève le garçon
  rationale: Dans ce contexte, נשׂא indique qu’Agar doit soulever le garçon de l’endroit où elle l’a laissé. « Relève » rend naturellement ce mouvement sans impliquer nécessairement qu’elle doive le porter ensuite.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נַעַר peut désigner un garçon ou un jeune homme. « Le garçon » convient au cadre narratif et reste naturel en français moderne.
- source_word: וְהַחֲזִ֥יקִי אֶת יָדֵ֖ךְ בּ֑וֹ
  choice: et soutiens-le fermement de ta main
  rationale: La construction associe le causatif de חזק, la main d’Agar et בּוֹ (« sur/en lui »). Elle évoque une prise ou un soutien ferme. Cette formulation restitue la force concrète de l’expression sans donner à penser qu’Agar doit simplement lui tenir la main.
- source_word: כִּֽי
  choice: car
  rationale: La conjonction introduit la raison de l’ordre. « Car » convient au registre narratif digne du passage.
- source_word: לְג֥וֹי גָּד֖וֹל אֲשִׂימֶֽנּוּ
  choice: je ferai de lui une grande nation
  rationale: Avec שׂים, le לְ marque ici le résultat. La tournure française exprime clairement la destinée collective promise au garçon.
theological_decisions:
- issue: Promesse divine concernant l’avenir d’Ismaël
  choice: Présenter directement la promesse de faire de lui une grande nation.
  alternative: Préciser la relation de cette promesse avec l’alliance faite à Abraham et à Isaac.
  rationale: Le verset affirme la destinée nationale du garçon sans en définir ici le statut théologique. La traduction conserve cette affirmation et n’importe aucune distinction doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs restent directs. « Relève » évite la lourdeur de « soulève » tout en tenant compte de la situation immédiate; « soutiens-le fermement » préserve l’idée de force et d’appui portée par l’expression hébraïque.
