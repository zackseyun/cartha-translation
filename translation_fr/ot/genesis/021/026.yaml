  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: fr
  text: 'Abimélek dit : « Je ne sais pas qui a fait cette affaire[a]. Toi non plus, tu ne m’en as pas informé, et moi-même, je n’en ai entendu parler qu’aujourd’hui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette chose », « ce fait » ou « cet acte ». Le mot hébreu davar peut désigner une chose, une affaire ou un événement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw consécutif fait progresser le récit. Le passé simple « dit » convient au registre narratif français sans ajouter une nuance de réponse absente du verbe.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: לֹא יָדַעְתִּי
  choice: Je ne savais pas
  rationale: Le qatal exprime ici l’absence de connaissance d’Abimélek jusqu’au moment de cet échange ; l’imparfait est naturel en français dans ce discours rétrospectif.
- source_word: מִי עָשָׂה
  choice: qui avait fait
  rationale: Le plus-que-parfait situe l’acte antérieurement à l’absence de connaissance évoquée par Abimélek.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: cette affaire
  rationale: דבר désigne ici l’incident faisant l’objet du différend. « Affaire » est idiomatique tout en maintenant l’étendue sémantique du terme.
- source_word: וְגַם אַתָּה
  choice: Toi non plus
  rationale: 'Sous la négation, גם marque l’inclusion : Abraham, lui non plus, n’avait rien signalé. Le pronom détaché conserve l’emphase de אַתָּה.'
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: tu ne me l’avais pas signalée
  rationale: הגיד signifie annoncer, rapporter ou faire savoir. « Signaler » convient à l’information concernant un incident et le plus-que-parfait marque son antériorité.
- source_word: וְגַם אָנֹכִי
  choice: et moi-même
  rationale: La forme pronominale אָנֹכִי est explicite et potentiellement emphatique ; « moi-même » en restitue le relief sans surinterprétation.
- source_word: לֹא שָׁמַעְתִּי בִּלְתִּי הַיּוֹם
  choice: je n’en ai entendu parler qu’aujourd’hui
  rationale: 'La tournure restrictive « ne… que » rend naturellement l’exception exprimée par בִּלְתִּי : Abimélek n’en a eu connaissance qu’en ce jour.'
theological_decisions: []
