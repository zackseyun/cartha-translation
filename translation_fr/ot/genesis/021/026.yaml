- from: 'Abimélek dit : « Je ne savais pas qui avait fait cette affaire[a]. Toi non plus, tu ne me l’avais pas signalée, et moi-même, je n’en ai entendu parler qu’aujourd’hui. »'
  to: 'Abimélek dit : « Je ne sais pas qui a fait cette affaire[a]. Toi non plus, tu ne m’en as pas informé, et moi-même, je n’en ai entendu parler qu’aujourd’hui. »'
  rationale: La révision rend la valeur présente naturelle du verbe statif hébreu ידעתי, sans nier que l’incident n’a été porté à la connaissance d’Abimélek que ce jour-là. Elle conserve les emphases inclusives (« Toi non plus », « moi-même »), l’ambiguïté quant à l’auteur, ainsi que l’ancrage et la fonction de la note lexicale.
