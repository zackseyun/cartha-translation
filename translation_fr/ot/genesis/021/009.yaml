  text: וַ/תֵּ֨רֶא שָׂרָ֜ה אֶֽת בֶּן הָגָ֧ר הַ/מִּצְרִ֛ית אֲשֶׁר יָלְדָ֥ה לְ/אַבְרָהָ֖ם מְצַחֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: fr
  text: Sara vit le fils qu’Agar l’Égyptienne avait enfanté à Abraham en train de rire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en train de jouer » ; selon le contexte, le terme peut aussi signifier « en train de se moquer ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Sara vit
  rationale: Le wayyiqtol de ראה fait avancer le récit. Le passé simple rend naturellement cette succession narrative en français sans ajouter une opposition absente du texte.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: le fils qu’Agar l’Égyptienne…
  rationale: La formulation identifie le fils par sa mère et conserve le gentilé féminin הַמִּצְרִית. L’intégration de la proposition relative évite une phrase française pesante.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: qu’Agar l’Égyptienne avait mis au monde pour Abraham
  rationale: Le plus-que-parfait situe la naissance avant la scène observée. « Mettre au monde » rend clairement ילד, tandis que « pour Abraham » exprime naturellement לְאַבְרָהָם en français.
- source_word: מְצַחֵק
  choice: en train de rire
  rationale: Le participe de צחק peut désigner le rire, le jeu ou, selon le contexte, une attitude moqueuse. La traduction principale conserve le sens lexical ouvert sans imposer une nuance hostile.
theological_decisions:
- issue: Sens précis de l’action exprimée par מְצַחֵק
  choice: en train de rire
  alternative: en train de jouer ; en train de se moquer
  rationale: Le participe hébreu n’a pas de complément explicite et ne précise pas à lui seul si l’action est innocente ou hostile. Le texte principal garde cette ouverture, tandis que la note signale les nuances contextuellement possibles.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase reste accessible tout en conservant l’ambiguïté du participe hébreu.
