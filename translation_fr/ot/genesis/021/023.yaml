review_pass:
  verdict: revise
  source_fidelity: La demande de serment, l’invocation « par Dieu », l’interdiction de déloyauté et la réciprocité du ḥesed sont bien rendues. Toutefois, גַּרְתָּה est un accompli (« tu as séjourné »), non un présent, et la construction française avec « tromper » est peu idiomatique pour rendre שׁקר dans ce contexte.
  naturalness: « Ne tromperas ni moi » est maladroit en français moderne. « Te montrer déloyal envers » exprime naturellement l’idée d’agir faussement envers quelqu’un. « En tant qu’étranger » est plus naturel que « en étranger » ici.
  terminology: « Bonté » est un rendu recevable de חֶסֶד dans ce contexte interpersonnel. « Enfants » et « descendants » conserve prudemment la portée successive, sans trancher plus précisément les termes généalogiques rares.
  issues:
  - severity: medium
    issue: Temps de גַּרְתָּה
    rationale: Le verbe est à l’accompli et désigne le séjour antérieur d’Abraham dans le pays. « Où tu séjournes » le transforme indûment en présent.
  - severity: low
    issue: Formulation de la déloyauté
    rationale: « Tromper » peut convenir sémantiquement, mais « ne tromperas ni moi » n’est pas une construction française naturelle. La déloyauté demandée dans le serment est mieux exprimée par « ne te montreras pas déloyal envers ».
  revised_text: À présent, jure-moi ici par Dieu que tu ne te montreras pas déloyal envers moi, envers mes enfants ni envers mes descendants. Tu agiras envers moi et envers le pays où tu as séjourné en tant qu’étranger avec la même bonté que celle dont j’ai fait preuve envers toi.
  revised_footnotes: []
  revision_rationale: La révision conserve le marqueur discursif explicite וְעַתָּה par « À présent », rend le serment et la réciprocité sans ajout interprétatif, corrige le présent en passé pour l’accompli גַּרְתָּה, et emploie une formulation française idiomatique pour l’idée de conduite déloyale exprimée par שׁקר.
