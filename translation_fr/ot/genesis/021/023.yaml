revisions:
- from: Maintenant, jure-moi ici par Dieu que tu ne tromperas ni moi, ni mes enfants, ni mes descendants. Tu agiras envers moi et envers le pays où tu séjournes en étranger avec la même bonté que celle dont j’ai fait preuve envers toi.
  to: À présent, jure-moi ici par Dieu que tu ne te montreras pas déloyal envers moi, envers mes enfants ni envers mes descendants. Tu agiras envers moi et envers le pays où tu as séjourné en tant qu’étranger avec la même bonté que celle dont j’ai fait preuve envers toi.
  rationale: La révision conserve le marqueur discursif explicite וְעַתָּה par « À présent », rend le serment et la réciprocité sans ajout interprétatif, corrige le présent en passé pour l’accompli גַּרְתָּה, et emploie une formulation française idiomatique pour l’idée de conduite déloyale exprimée par שׁקר.
