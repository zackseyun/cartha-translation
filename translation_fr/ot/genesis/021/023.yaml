  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: fr
  text: À présent, jure-moi ici par Dieu que tu ne te montreras pas déloyal envers moi, envers mes enfants ni envers mes descendants. Tu agiras envers moi et envers le pays où tu as séjourné en tant qu’étranger avec la même bonté que celle dont j’ai fait preuve envers toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: La conjonction suivie de l’adverbe introduit ici la demande qui découle de ce qui précède; « Maintenant » en conserve explicitement la progression.
- source_word: תִּשְׁקֹר
  choice: tromperas
  rationale: Le verbe שׁקר désigne ici le fait d’agir faussement ou avec déloyauté; « tromper » est naturel en français et convient au contexte d’un serment.
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: mes enfants, ni mes descendants
  rationale: Les deux termes désignent des générations successives. Cette formulation claire préserve la distinction générale sans imposer des degrés généalogiques trop précis, discutés pour ces mots rares.
- source_word: חֶסֶד
  choice: bonté
  rationale: Dans ce contexte relationnel, חֶסֶד évoque une bienveillance fidèle manifestée concrètement; « bonté » reste accessible et évite de surcharger le terme d’une nuance confessionnelle.
- source_word: גַּרְתָּה
  choice: tu séjournes en étranger
  rationale: גור décrit la résidence d’une personne qui n’est pas établie comme autochtone; la formulation conserve à la fois le séjour et le statut d’étranger.
theological_decisions:
- issue: Portée de l’invocation divine dans le serment
  choice: jure-moi ici par Dieu
  alternative: jure-moi devant Dieu
  rationale: בֵאלֹהִים exprime naturellement le fait de jurer par Dieu. La traduction conserve l’invocation directe sans interpréter davantage la forme ou la théologie du serment.
- issue: Sens de חֶסֶד dans une alliance humaine
  choice: bonté
  alternative: fidélité bienveillante
  rationale: Le contexte concerne la conduite réciproque d’Abimélek et d’Abraham. « Bonté » préserve la dimension éthique et relationnelle sans réserver le mot à l’usage divin ou l’assimiler techniquement à une alliance.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au dialogue singulier. La seconde phrase a été restructurée pour une syntaxe française fluide tout en conservant la réciprocité exprimée par l’hébreu.
