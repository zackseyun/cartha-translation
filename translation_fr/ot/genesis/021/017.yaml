source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: fr
  text: 'Dieu entendit la voix du garçon[a]. Alors l’ange de Dieu appela Agar depuis le ciel et lui dit : « Qu’as-tu, Agar ? N’aie pas peur, car Dieu a entendu la voix du garçon, là où il est. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cri du garçon », ici et à la fin du verset ; le mot hébreu peut désigner un cri de détresse audible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: Dieu entendit
  rationale: Le qal de שׁמע signifie couramment « entendre ». Le passé simple convient à la progression narrative sans ajouter l’idée explicite de réponse.
- source_word: אֶת קוֹל הַנַּעַר
  choice: la voix du garçon
  rationale: קוֹל désigne littéralement la voix ou le son et peut, dans ce contexte, évoquer un cri de détresse. « Voix » conserve la répétition lexicale des deux occurrences, tandis qu’une note signale l’autre possibilité.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נַעַר désigne ici Ismaël comme jeune homme ou garçon. « Garçon » est naturel en français moderne et ne précise pas davantage son âge que le contexte.
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: Alors l’ange de Dieu appela
  rationale: « L’ange de Dieu » reproduit le groupe construit sans définir plus précisément l’identité du messager. « Alors » rend naturellement la succession narrative portée par וַ.
- source_word: מִן הַשָּׁמַיִם
  choice: depuis le ciel
  rationale: שָׁמַיִם a une forme plurielle en hébreu, mais le singulier « le ciel » est l’expression locative idiomatique en français.
- source_word: מַה לָּךְ
  choice: Qu’as-tu ?
  rationale: L’expression idiomatique demande ce qui arrive ou trouble Agar. « Qu’as-tu ? » est concise, naturelle et conserve la forme interrogative sans tonalité accusatrice.
- source_word: אַל תִּירְאִי
  choice: N’aie pas peur
  rationale: Cette formulation française actuelle transmet directement l’interdiction à la deuxième personne féminine sans l’archaïsme possible de « Ne crains pas ».
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: car Dieu a entendu
  rationale: « Car » exprime la raison de l’encouragement, et le passé composé rend ici l’action accomplie dont le résultat demeure pertinent.
- source_word: אֶל קוֹל הַנַּעַר
  choice: la voix du garçon
  rationale: La même formulation est reprise pour préserver la répétition hébraïque, bien que la construction avec אֶל diffère de celle de la première occurrence.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: là où il est
  rationale: Cette traduction locative naturelle conserve l’insistance de שָׁם, « là », mieux que le seul « où il est ».
theological_decisions:
- issue: Identité de מַלְאַךְ אֱלֹהִים et rapport entre le messager divin et Dieu
  choice: l’ange de Dieu
  alternative: un ange de Dieu ; l’ange envoyé par Dieu
  rationale: La traduction maintient l’expression hébraïque et sa tension narrative sans identifier le messager à Dieu ni l’en distinguer selon une doctrine ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple soutient le registre narratif biblique sans lourdeur ; les paroles directes emploient des tournures courantes. La répétition de « la voix du garçon » et l’expression « là où il est » restent proches de la forme hébraïque.
