revisions:
- from: Les eaux montèrent avec une force extrême sur la terre[a], et toutes les hautes montagnes qui sont sous tous les cieux[b] furent recouvertes.
  to: Les eaux devinrent extrêmement puissantes sur la terre[a], et toutes les hautes montagnes sous le ciel tout entier[b] furent recouvertes.
  rationale: La révision retire l'ajout interprétatif « montèrent », rend l'intensité redoublée par « extrêmement », et remplace un calque français peu idiomatique par l'équivalent naturel de l'expression hébraïque. Les notes conservent les alternatives lexicales sans trancher la portée du récit.
