  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: fr
  text: Les eaux devinrent extrêmement puissantes sur la terre[a], et toutes les hautes montagnes sous le ciel tout entier[b] furent recouvertes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays ». Le mot hébreu אֶרֶץ peut désigner la terre au sens large ou un territoire, selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Littéralement, « sous tous les cieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: montèrent avec une force extrême
  rationale: Le verbe exprime la puissance ou l’intensification des eaux. Cette formulation française rend à la fois leur montée dans le contexte et leur force, sans employer le peu naturel « prévalurent ».
- source_word: מְאֹד מְאֹד
  choice: avec une force extrême
  rationale: Le redoublement de מְאֹד marque une très forte intensification. « Extrême » transmet cette emphase en français moderne et naturel.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: עַל signifie ici « sur », tandis que אָרֶץ peut désigner la terre ou le pays. « La terre » correspond à la portée universelle du langage narratif, tout en conservant l’autre possibilité en note.
- source_word: וַיְכֻסּוּ
  choice: furent recouvertes
  rationale: La forme est rendue naturellement par un passif français qui décrit le résultat subi par les montagnes.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: toutes les hautes montagnes
  rationale: La traduction conserve la totalité exprimée par כָּל et le sens ordinaire de הָרִים et גְּבֹהִים.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: sous tous les cieux
  rationale: Cette traduction suit de près le pluriel morphologique שָּׁמָיִם et la structure distributive de l’hébreu, malgré le caractère moins idiomatique de l’expression en français.
theological_decisions:
- issue: Portée de אָרֶץ dans le récit du déluge
  choice: la terre
  alternative: le pays / la région
  rationale: L’expression « sous tous les cieux » donne au verset une portée universelle dans le cadre du récit. « La terre » respecte cette présentation sans transformer le texte en affirmation scientifique moderne; l’ambiguïté lexicale est signalée en note.
- issue: Portée de תַּחַת כָּל הַשָּׁמָיִם
  choice: sous tous les cieux
  alternative: sous le ciel tout entier
  rationale: Le choix principal préserve la forme plurielle et l’ampleur rhétorique de l’hébreu. La tournure française plus idiomatique est donnée en note sans réduire la tension du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation évite le calque archaïque « les eaux prévalurent » tout en conservant l’idée hébraïque de puissance. Les notes maintiennent les ambiguïtés réelles concernant אֶרֶץ et l’expression « tous les cieux ».
