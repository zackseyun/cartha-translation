  source_fidelity: La formulation « montèrent » ajoute explicitement l'idée de montée, alors que גָּבְרוּ décrit d'abord la puissance croissante ou la domination des eaux. « Devinrent extrêmement puissantes » rend plus directement le verbe et le redoublement intensif de מְאֹד, sans éliminer l'image narrative. L'expression idiomatique תַּחַת כָּל הַשָּׁמָיִם est mieux rendue en français par « sous le ciel tout entier »; le pluriel morphologique de שָׁמַיִם ne requiert pas « tous les cieux » en français.
  naturalness: Le texte révisé est soutenu, clair et naturel en français international moderne. « Sous le ciel tout entier » évite le calque peu idiomatique « sous tous les cieux ».
  terminology: « Terre » conserve l'ampleur narrative de הָאָרֶץ tout en laissant ouverte, en note, la possibilité de « pays ». « Recouvertes » rend correctement le résultat exprimé par וַיְכֻסּוּ.
  issues:
  - severity: medium
    issue: « montèrent avec une force extrême » pour גָּבְרוּ מְאֹד מְאֹד
    rationale: « Monter » interprète le verbe comme une élévation des eaux; le lexème hébreu porte plus directement l'idée de devenir puissant, de l'emporter ou de croître en force. Cette précision doit être évitée dans la traduction principale.
  - severity: low
    issue: « sous tous les cieux » comme texte principal
    rationale: La tournure reproduit le pluriel de forme de שָׁמַיִם mais est peu naturelle en français. Dans cette expression hébraïque, « sous le ciel tout entier » communique plus idiomatiquement la portée universelle, sans la renforcer.
  - severity: low
