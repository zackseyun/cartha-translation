  text: La pluie tomba sur la terre pendant quarante jours et quarante nuits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הַגֶּשֶׁם
  choice: La pluie tomba
  rationale: Dans ce récit, la construction avec וַיְהִי présente la survenue et la durée de la pluie. « Tomba » est naturel en français et concorde avec le contexte immédiat, où les eaux se déversent sur la terre.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Rend directement la préposition עַל et le nom הָאָרֶץ sans préciser davantage la portée géographique.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: pendant quarante jours et quarante nuits
  rationale: « Pendant » exprime clairement la durée implicite en hébreu. Le singulier morphologique לָיְלָה après le nombre quarante se traduit naturellement par le pluriel français « nuits ».
