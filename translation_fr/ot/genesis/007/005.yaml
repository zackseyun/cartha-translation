source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: fr
  text: Noé fit tout ce que Yahweh lui avait ordonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה signifie largement « faire » ou « accomplir ». Ici, devant ce qui a été ordonné, « fit » exprime naturellement l’exécution du commandement sans ajouter d’interprétation.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom hébreu נֹחַ.
- source_word: כְּכֹל אֲשֶׁר
  choice: tout ce que
  rationale: Cette tournure française naturelle rend l’idée de conformité totale portée par כְּכֹל (« selon tout »), sans la lourdeur de « selon tout ce que ».
- source_word: צִוָּהוּ
  choice: lui avait ordonné
  rationale: Le plus-que-parfait marque naturellement l’antériorité de l’ordre par rapport à son exécution. « Ordonner » rend la force de צוה dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, conservé comme nom propre plutôt que remplacé par un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » en préserve la fonction de nom propre sans lui substituer un titre.
- issue: Étendue de l’obéissance de Noé
  choice: tout ce que Yahweh lui avait ordonné
  alternative: selon tout ce que Yahweh lui avait ordonné
  rationale: « Tout ce que » maintient explicitement l’exhaustivité de כְּכֹל tout en donnant une phrase française fluide; aucune limitation ou précision étrangère au texte n’est ajoutée.
translation_notes:
  register: Français moderne, simple et digne. La formulation concise conserve l’insistance hébraïque sur l’obéissance complète de Noé. Aucun appel de note n’est nécessaire, puisque le texte ne présente ici aucune variante ou ambiguïté exigeant une note.
