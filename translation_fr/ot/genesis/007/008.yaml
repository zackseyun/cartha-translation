base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: fr
  text: Parmi les animaux purs et parmi les animaux qui ne sont pas purs[a], parmi les oiseaux et parmi tout ce qui rampe sur le sol —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « qui sont impurs ». L’hébreu dit plus littéralement : « qui ne sont pas purs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: parmi
  rationale: La préposition introduit ici les catégories dont certains représentants entrent dans l’arche. « Parmi » rend ce rapport naturellement en français tout en conservant la structure répétitive de l’énumération.
- source_word: בְּהֵמָה
  choice: animaux
  rationale: Dans cette liste, le terme désigne une catégorie générale distinguée des oiseaux et des créatures qui rampent; « animaux » évite de la limiter au seul bétail domestique.
- source_word: טְּהוֹרָה
  choice: purs
  rationale: « Purs » exprime en français la classification rituelle ou cultuelle du contexte, sans suggérer une simple propreté physique.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: qui ne sont pas purs
  rationale: Cette formulation conserve la négation analytique de l’hébreu, littéralement « qui n’est pas pure », plutôt que de la remplacer silencieusement par l’antonyme « impurs ».
- source_word: עוֹף
  choice: oiseaux
  rationale: Bien que le terme puisse couvrir plus largement les créatures volantes, « oiseaux » est ici naturel, clair et adapté à l’énumération.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: tout ce qui rampe
  rationale: La formulation restitue l’idée verbale de déplacement rampant et demeure idiomatique en français moderne.
- source_word: עַל הָאֲדָמָה
  choice: sur le sol
  rationale: Le mot désigne ici la surface terrestre où se déplacent ces créatures; « sur le sol » est précis et naturel.
