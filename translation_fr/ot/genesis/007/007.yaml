  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: fr
  text: Noé entra dans l’arche avec ses fils, sa femme et les femmes de ses fils, à cause des eaux du déluge.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entra
  rationale: Le verbe בוא peut signifier venir, aller ou entrer selon le contexte. Avec אֶל הַתֵּבָה, « entra dans l’arche » exprime naturellement le mouvement vers l’intérieur.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom hébreu נֹחַ.
- source_word: בָנָיו
  choice: ses fils
  rationale: Le nom hébreu désigne précisément les fils, et non les enfants en général.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Dans ce contexte familial, אִשָּׁה avec suffixe possessif signifie clairement « sa femme » au sens d’épouse.
- source_word: נְשֵׁי בָנָיו
  choice: les femmes de ses fils
  rationale: Cette formulation suit de près le groupe construit hébreu, littéralement « les femmes de ses fils », sans le remplacer par le terme relationnel plus indirect « belles-filles ».
- source_word: אִתּוֹ
  choice: avec
  rationale: L’accompagnement exprimé par אִתּוֹ est rendu par « avec » dans une construction française où tous les membres de la famille sont rattachés à Noé.
- source_word: אֶל הַתֵּבָה
  choice: dans l’arche
  rationale: Après « entra », la préposition « dans » restitue idiomatiquement en français le mouvement dirigé vers l’intérieur de l’arche.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La locution exprime ici la cause ou la circonstance motivant l’entrée dans l’arche.
- source_word: מֵי הַמַּבּוּל
  choice: les eaux du déluge
  rationale: Cette traduction conserve explicitement les deux noms hébreux, « eaux » et « déluge », dans la formulation biblique française habituelle.
theological_decisions: []
