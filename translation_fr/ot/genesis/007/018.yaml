    issue: « montèrent considérablement » pour וַיִּרְבּוּ מְאֹד
    rationale: Le verbe רבה exprime l’accroissement abondant ; il ne désigne pas spécifiquement une montée. « Augmentèrent beaucoup » préserve le sens sans interprétation physique additionnelle.
  - severity: low
    issue: Imparfait « se déplaçait » pour וַתֵּלֶךְ
    rationale: Le wayyiqtol poursuit la narration par une action achevée. Le passé simple « se déplaça » respecte mieux cette valeur dans un registre biblique français.
  - severity: low
    issue: « devinrent puissantes »
    rationale: Cette tournure est littéralement défendable, mais elle est raide en français appliquée aux eaux. « S’imposèrent » restitue naturellement l’idée de prévaloir.
  revised_text: Les eaux s’imposèrent et augmentèrent beaucoup sur la terre, et l’arche se déplaça à la surface des eaux.
