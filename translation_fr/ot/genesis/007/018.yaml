  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: fr
  text: Les eaux s’imposèrent et augmentèrent beaucoup sur la terre, et l’arche se déplaça à la surface des eaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: devinrent puissantes
  rationale: Le verbe גבר exprime l’idée de devenir fort ou puissant. Cette formulation conserve la force croissante des eaux sans réduire le sens à leur seule montée.
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le pluriel français traditionnel et naturel dans le récit du déluge correspond à la forme hébraïque plurielle.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: montèrent considérablement
  rationale: רבה avec מְאֹד marque une forte augmentation. Dans ce contexte, « montèrent considérablement » exprime naturellement l’accroissement du volume et du niveau des eaux.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. « Sur la terre » conserve ici la portée large suggérée par le récit tout en restant idiomatique.
- source_word: וַתֵּלֶךְ
  choice: se déplaçait
  rationale: הלך signifie littéralement « aller ». Avec l’arche pour sujet, « se déplaçait » rend le mouvement sans préciser indûment qu’elle dérivait ou qu’elle était dirigée.
- source_word: הַתֵּבָה
  choice: l’arche
  rationale: « Arche » est le terme français établi et contextuellement exact pour תֵּבָה dans le récit de Noé.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: à la surface des eaux
  rationale: L’expression hébraïque, littéralement « sur la face des eaux », désigne idiomatiquement leur surface.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: la terre
  alternative: le pays / la région
  rationale: Le mot hébreu permet les deux sens. Le contexte immédiat du récit favorise « la terre », sans que la traduction ajoute une qualification doctrinale sur l’étendue géographique du déluge.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination et la progression du texte hébreu sont conservées, tandis que l’imparfait « se déplaçait » rend naturellement le mouvement continu de l’arche.
