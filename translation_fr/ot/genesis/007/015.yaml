    text: Ou « l’esprit de vie ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit ».
    reason: lexical_alternative
  revision_rationale: La formulation révisée clarifie en français que les créatures entrent dans l’arche et viennent auprès de Noé, sans ajouter de détail absent du texte. Elle conserve « deux par deux », « toute chair » et « souffle de vie », ainsi que l’ambiguïté lexicale de רוּחַ dans la note.
