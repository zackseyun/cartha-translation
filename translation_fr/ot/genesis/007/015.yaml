  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: fr
  text: Ils entrèrent dans l’arche auprès de Noé, deux par deux, de toute chair dans laquelle se trouvait le souffle de vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit de vie ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils vinrent
  rationale: Le wayyiqtol de בוא exprime ici un déplacement au passé dans la chaîne narrative. « Ils vinrent » conserve le point de vue orienté vers Noé.
- source_word: אֶל נֹחַ
  choice: vers Noé
  rationale: אֶל marque le mouvement en direction d’une personne. « Vers Noé » restitue cette relation sans laisser entendre que Noé est lui-même le lieu où ils entrent.
- source_word: אֶל הַתֵּבָה
  choice: dans l’arche
  rationale: Dans le contexte de l’embarquement, le français exprime naturellement par « dans » le terme du mouvement; « vers l’arche » laisserait incertaine l’entrée effective.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: deux par deux
  rationale: La répétition du nombre a une valeur distributive; « deux par deux » en est l’équivalent français naturel et précis.
- source_word: מִכָּל הַבָּשָׂר
  choice: d’entre toute chair
  rationale: בָּשָׂר signifie littéralement « chair » et désigne ici l’ensemble des êtres animés concernés. « Toute chair » préserve le vocabulaire et l’écho thématique du récit du déluge.
- source_word: אֲשֶׁר בּוֹ
  choice: en laquelle était
  rationale: Cette formulation garde la structure relative hébraïque et rattache la présence du souffle à « toute chair », sans explicitation interprétative supplémentaire.
- source_word: רוּחַ חַיִּים
  choice: le souffle de vie
  rationale: רוּחַ peut désigner le souffle, le vent ou l’esprit. Dans cette description des êtres animés, « souffle de vie » convient au contexte, tandis que la note conserve l’autre lecture possible; חַיִּים, morphologiquement pluriel, a ici le sens idiomatique de « vie ».
theological_decisions:
- issue: Sens de רוּחַ dans רוּחַ חַיִּים
  choice: le souffle de vie
  alternative: l’esprit de vie
  rationale: Le contexte zoologique et créationnel met au premier plan la respiration vitale des créatures, sans imposer une anthropologie particulière. La note maintient l’ambiguïté réelle du terme hébreu.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve volontairement « toute chair » et la relative « en laquelle était » pour maintenir les images et la structure théologique de l’hébreu, tout en employant l’expression naturelle « deux par deux ».
