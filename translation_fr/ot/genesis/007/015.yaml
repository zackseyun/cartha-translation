revisions:
- from: Ils vinrent vers Noé dans l’arche, deux par deux, d’entre toute chair en laquelle était le souffle de vie[a].
  to: Ils entrèrent dans l’arche auprès de Noé, deux par deux, de toute chair dans laquelle se trouvait le souffle de vie[a].
  rationale: La formulation révisée clarifie en français que les créatures entrent dans l’arche et viennent auprès de Noé, sans ajouter de détail absent du texte. Elle conserve « deux par deux », « toute chair » et « souffle de vie », ainsi que l’ambiguïté lexicale de רוּחַ dans la note.
