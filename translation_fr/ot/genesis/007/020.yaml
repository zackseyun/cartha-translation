  yaml_path: translation/ot/genesis/007/020.yaml
  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: fr
  text: Les eaux montèrent de quinze coudées plus haut, et les montagnes furent couvertes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבְרוּ
  choice: montèrent
  rationale: Le verbe signifie littéralement « furent fortes / prévalurent » ; dans ce contexte, il décrit la montée et la domination des eaux. « Montèrent » exprime naturellement le mouvement vertical en français.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: de quinze coudées
  rationale: Conserve l’unité de mesure ancienne et la valeur exacte du texte hébreu.
- source_word: מִלְמַעְלָה
  choice: encore
  rationale: Le terme indique ici une élévation vers le haut ou supplémentaire. « Encore » donne un français naturel sans préciser silencieusement le point de référence, qui reste ambigu en hébreu.
- source_word: וַיְכֻסּוּ
  choice: furent recouvertes
  rationale: Le passif hébreu est maintenu ; « recouvertes » indique que les montagnes se trouvèrent sous les eaux.
theological_decisions:
- issue: Point de référence des quinze coudées
  choice: Ne pas préciser dans le corps du verset si la mesure part du niveau précédent des eaux ou du sommet des montagnes.
  alternative: « Les eaux dépassèrent les montagnes de quinze coudées »
  rationale: La formulation hébraïque permet de comprendre soit une montée supplémentaire de quinze coudées, soit une hauteur de quinze coudées au-dessus des montagnes. Le texte principal conserve cette indétermination, et la note signale l’autre lecture.
translation_notes:
  register: Français international moderne, simple et digne. La phrase reste concise et narrative, tout en conservant l’ancienne unité de mesure « coudée ».
