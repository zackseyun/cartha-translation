  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: fr
  text: Tu prendras aussi parmi les oiseaux du ciel, sept par sept[a], mâle et femelle, afin d’assurer la survie de leur descendance sur toute la surface de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept couples ». L’hébreu dit littéralement « sept, sept », une tournure distributive qui peut désigner sept de chaque sorte ou sept couples ; le texte principal conserve cette ambiguïté.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם מֵעוֹף הַשָּׁמַיִם
  choice: Tu prendras aussi des oiseaux du ciel
  rationale: Le verbe « prendras » est sous-entendu par la consigne du verset précédent et doit être repris pour obtenir une phrase française naturelle. « Aussi » marque l’ajout d’une nouvelle catégorie, et « oiseaux du ciel » rend simplement le sens contextuel de עוֹף et שָׁמַיִם.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: sept et sept
  rationale: La répétition du nombre est conservée afin de ne pas trancher dans le texte principal entre une distribution par sept et l’interprétation « sept couples ».
- source_word: זָכָר וּנְקֵבָה
  choice: mâle et femelle
  rationale: Cette formulation directe conserve l’expression hébraïque de l’appariement sexué sans ajouter de précision absente du texte.
- source_word: לְחַיּוֹת זֶרַע
  choice: afin de garder leur descendance en vie
  rationale: Le hiphil de חיה exprime ici la préservation de la vie, tandis que זֶרַע désigne la postérité animale plutôt que la semence au sens matériel.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: sur toute la surface de la terre
  rationale: Cette tournure française actuelle restitue l’image de la « face » de la terre sans lourdeur littérale.
