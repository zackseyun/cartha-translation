base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: fr
  text: De tout animal pur, tu prendras pour toi sept couples[a], un mâle et sa femelle ; et des animaux qui ne sont pas purs, deux[b], un mâle et sa femelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sept sept, un mâle et sa femelle ». Cela signifie probablement sept couples, mais certains comprennent sept animaux au total.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « des animaux impurs ». L’hébreu dit : « des animaux qui ne sont pas purs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: De tout animal
  rationale: מִן avec כֹּל introduit l’ensemble dont chaque élément est pris. Le singulier distributif « de tout animal » est naturel en français et respecte le nom collectif hébreu.
- source_word: הַטְּהוֹרָה
  choice: pur
  rationale: Dans le vocabulaire biblique français, « pur » exprime clairement la distinction entre animaux purs et non purs sans ajouter explicitement une qualification rituelle absente du texte.
- source_word: תִּקַּח לְךָ
  choice: tu prendras pour toi
  rationale: Le futur français rend ici l’instruction, et « pour toi » conserve לְךָ, même si sa valeur est légère.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: sept couples
  rationale: La répétition du nombre, suivie de « le mâle et sa femelle », indique très probablement des unités appariées. Une note conserve toutefois la littéralité et l’autre compréhension possible.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: le mâle et sa femelle
  rationale: Appliquée aux animaux, l’expression littérale « un homme et sa femme » désigne naturellement les deux sexes d’un couple. « Le mâle et sa femelle » garde la relation exprimée par le suffixe possessif sans anthropomorphisme trompeur.
- source_word: הַבְּהֵמָה אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: les animaux qui ne sont pas purs
  rationale: Cette formulation préserve l’expression analytique de l’hébreu, « qui n’est pas pur », plutôt que de la remplacer silencieusement par l’adjectif « impur ».
- source_word: שְׁנַיִם
  choice: deux
  rationale: Le mot hébreu signifie simplement « deux » ; la proposition suivante précise qu’il s’agit d’un mâle et de sa femelle.
theological_decisions:
- issue: Sens du nombre répété pour les animaux purs
  choice: sept couples d’animaux purs
  alternative: sept animaux purs au total
  rationale: שִׁבְעָה שִׁבְעָה, suivi de אִישׁ וְאִשְׁתּוֹ, suggère fortement sept unités mâle-femelle et contraste avec « deux, le mâle et sa femelle ». Comme le tour hébreu peut être rendu plus littéralement et a aussi été compris comme sept individus, cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse divine singulière. « Pur / pas pur » conserve le contraste lexical du texte ; « sept couples » privilégie le sens contextuel tout en documentant l’ambiguïté dans la note.
