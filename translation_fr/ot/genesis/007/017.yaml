  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: fr
  text: Le déluge dura quarante jours sur la terre[a]. Les eaux montèrent et soulevèrent l’arche, qui s’éleva au-dessus de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se traduire plus formellement : « Le déluge fut sur la terre pendant quarante jours. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַמַּבּוּל אַרְבָּעִים יוֹם
  choice: Le déluge dura quarante jours
  rationale: Avec l’expression temporelle « quarante jours », וַיְהִי indique ici la durée. « dura » rend naturellement cet emploi en français, sans ajouter l’idée plus forte de « se poursuivit ».
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Rendu direct et naturel ; dans ce contexte, « terre » convient mieux que le sens plus local possible de « pays » ou « sol ».
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: Les eaux montèrent
  rationale: Le verbe exprime l’accroissement des eaux. En français, « montèrent » communique clairement cet accroissement dans le contexte d’une inondation, tout en préparant naturellement le soulèvement de l’arche.
- source_word: וַיִּשְׂאוּ אֶת הַתֵּבָה
  choice: soulevèrent l’arche
  rationale: נשא décrit ici les eaux qui élèvent physiquement l’arche ; « soulevèrent » est précis, courant et digne.
- source_word: וַתָּרָם מֵעַל הָאָרֶץ
  choice: qui s’éleva au-dessus de la terre
  rationale: La forme féminine renvoie à l’arche et exprime son élévation résultante. « s’éleva » préserve le mouvement sans répétition maladroite.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le découpage en deux phrases allège la coordination hébraïque sans modifier la progression narrative. « Arche » conserve le terme biblique établi.
