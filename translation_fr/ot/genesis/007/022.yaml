source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: fr
  text: Tout ce qui, sur la terre ferme, avait dans les narines un souffle de vie mourut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le souffle de l’esprit de vie ».'
    reason: La note conserve la formulation hébraïque complète derrière l’expression française naturelle « un souffle de vie ».
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tout ce qui
  rationale: La tournure exprime l’ensemble des êtres répondant à la condition énoncée; « tout ce qui » englobe naturellement humains et animaux.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: un souffle de vie
  rationale: L’expression composée désigne le souffle vital. Cette formulation est naturelle en français tout en signalant en note la structure hébraïque plus développée.
- source_word: בְּאַפָּיו
  choice: dans les narines
  rationale: Le suffixe masculin singulier a une valeur distributive; le français peut conserver naturellement l’expression corporelle sans ajouter de possessif.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: sur la terre ferme
  rationale: Cette expression restreint la portée aux êtres vivant hors de l’eau et maintient le contraste propre au récit du déluge.
- source_word: מֵתוּ
  choice: mourut
  rationale: Le verbe énonce directement la mort de l’ensemble collectif désigné par « tout ce qui »; le singulier français s’accorde avec ce sujet.
theological_decisions:
- issue: Rapport entre « souffle » et « esprit » dans נִשְׁמַת רוּחַ חַיִּים
  choice: Rendre dans le texte « un souffle de vie » et conserver la formulation littérale en note.
  alternative: « le souffle de l’esprit de vie »
  rationale: Le chevauchement sémantique de נְשָׁמָה et רוּחַ permet de comprendre l’ensemble comme une expression du souffle vital. La traduction courante évite de suggérer une construction métaphysique que le contexte n’impose pas, tandis que la note préserve la densité et l’ambiguïté de l’hébreu.
translation_notes:
  register: Français moderne, sobre et digne. La phrase conserve la portée collective du texte hébreu ainsi que la restriction aux êtres présents sur la terre ferme.
