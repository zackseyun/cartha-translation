base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: fr
  text: Dans la six-centième année de la vie de Noé, le deuxième mois, le dix-septième jour du mois, ce jour-là, toutes les sources du grand abîme[a] jaillirent, et les fenêtres du ciel[b] s’ouvrirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fontaines du grand abîme ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vannes du ciel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: La six-centième année de la vie de Noé
  rationale: La tournure conserve la formule hébraïque qui date l’événement d’après la durée de la vie de Noé, tout en restant naturelle et solennelle en français.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: le deuxième mois
  rationale: Équivalent direct et idiomatique de la formule temporelle hébraïque.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: le dix-septième jour du mois
  rationale: Le cardinal hébreu exprime ici une date ordinale; cette formulation est naturelle en français.
- source_word: בַּיּוֹם הַזֶּה
  choice: ce jour-là
  rationale: Cette expression reprend avec une légère insistance le jour qui vient d’être précisément indiqué.
- source_word: נִבְקְעוּ
  choice: jaillirent
  rationale: Dans le contexte de sources aquatiques, ce verbe français rend de façon vive l’ouverture violente exprimée par le nifal de בקע, sans imposer une explication scientifique.
- source_word: כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: toutes les sources du grand abîme
  rationale: « Sources » rend מַעְיְנֹת dans son sens courant; « grand abîme » préserve l’image des eaux profondes et primordiales portée par תְּהוֹם רַבָּה.
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: et les fenêtres du ciel
  rationale: « Fenêtres » conserve l’image concrète de אֲרֻבּוֹת. En français, « le ciel » est la manière naturelle de rendre שָׁמַיִם dans cette expression cosmique.
- source_word: נִפְתָּחוּ
  choice: s’ouvrirent
  rationale: Le pronominal français exprime naturellement l’ouverture survenue, tout en restant proche du nifal hébreu.
theological_decisions:
- issue: Imagerie cosmique des eaux du déluge
  choice: Conserver « le grand abîme » et « les fenêtres du ciel »
  alternative: Paraphraser par « les eaux souterraines » et « les vannes du ciel »
  rationale: Le texte emploie une imagerie cosmique ancienne qui participe à la force du récit. La traduction la maintient sans la convertir en description scientifique moderne.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe répétitive de la datation hébraïque est largement préservée. Les images cosmiques restent concrètes et ne sont pas rationalisées.
