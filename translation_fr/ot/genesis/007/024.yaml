  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֖יִם עַל הָ/אָ֑רֶץ חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: fr
  text: Les eaux eurent le dessus sur la terre pendant cent cinquante jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le pays » ; le mot hébreu אֶרֶץ peut désigner la terre ou un pays, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: dominèrent
  rationale: Le verbe גבר au qal exprime ici la force supérieure et la domination persistante des eaux. « Dominèrent » conserve cette idée sans réduire le sens à une simple montée du niveau de l’eau.
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le pluriel français reflète la forme hébraïque et convient au registre du récit du déluge.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: La préposition עַל est rendue naturellement par « sur ». Dans le cadre narratif immédiat, « la terre » exprime mieux la portée du déluge, tout en laissant l’alternative lexicale en note.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: pendant cent cinquante jours
  rationale: L’expression hébraïque indique une durée de cent cinquante jours ; « pendant » rend cette relation temporelle explicitement et naturellement en français.
theological_decisions:
- issue: Portée de אֶרֶץ dans le récit du déluge
  choice: la terre
  alternative: le pays / la région
  rationale: Les formulations universelles du contexte immédiat favorisent « la terre ». Cependant, אֶרֶץ peut aussi désigner un pays ou un territoire ; cette possibilité lexicale est donc signalée sans trancher davantage que le contexte.
translation_notes:
  register: Français moderne, sobre et narratif. « Dominèrent » garde la force du verbe hébreu et la continuité du récit, tandis que la formulation du nombre en toutes lettres convient à une édition biblique courante.
