id: GEN.7.1
reference: Genesis 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Noé : « Entre dans l’arche, toi et toute ta maisonnée, car j’ai vu que tu es juste devant moi au milieu de cette génération. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que par un titre de substitution.
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait progresser le récit ; « Alors » exprime naturellement cette succession en français moderne.
- source_word: בֹּא
  choice: Entre
  rationale: L’impératif signifie « viens/entre » ; avec l’arche comme complément, « Entre » est concis et idiomatique.
- source_word: בֵּיתְךָ
  choice: ta maisonnée
  rationale: Dans ce contexte, « maison » désigne les personnes qui composent le foyer, non le bâtiment. « Maisonnée » conserve ce sens collectif sans le réduire à la seule famille nucléaire.
- source_word: הַתֵּבָה
  choice: l’arche
  rationale: « Arche » est le terme français consacré et contextuellement précis pour la תֵּבָה de Noé.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’ordre ; « car » convient au registre narratif digne et reste clair.
- source_word: רָאִיתִי
  choice: j’ai vu
  rationale: Le parfait hébreu présente l’évaluation comme établie ; le passé composé français en préserve naturellement la portée actuelle.
- source_word: צַדִּיק
  choice: juste
  rationale: « Juste » est la désignation française biblique naturelle d’une personne conforme à la justice ; elle maintient la portée morale et théologique du terme.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Cette formulation conserve directement l’idiome hébreu exprimant le jugement porté en présence de Dieu ou à ses yeux.
- source_word: בַּדּוֹר הַזֶּה
  choice: au milieu de cette génération
  rationale: La préposition ב peut situer Noé dans le cadre de ses contemporains. « Au milieu de » est naturel en français et fait ressortir le contraste implicite sans ajouter qu’il serait le seul juste.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin. Le conserver évite de le remplacer par un titre.
- issue: Nature de la justice de Noé
  choice: j’ai vu que tu es juste devant moi
  alternative: je t’ai considéré comme juste ; toi seul, tu es juste devant moi
  rationale: La formulation traduit l’évaluation divine sans expliquer le fondement de cette justice ni ajouter l’exclusivité absente du texte hébreu.
- issue: Rapport de Noé à sa génération
  choice: au milieu de cette génération
  alternative: dans cette génération
  rationale: Ce choix situe Noé parmi ses contemporains et laisse intacte la tension entre son statut de juste et l’état de sa génération, sans transformer le contraste en affirmation explicite d’exclusivité.
translation_notes:
  register: Français international moderne, narratif et digne. Tutoiement conservé conformément au singulier hébreu adressé à Noé. Ponctuation française et formulation accessible, sans archaïsme.
