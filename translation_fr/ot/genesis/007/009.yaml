  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: fr
  text: Deux par deux[a], mâle et femelle, ils vinrent vers Noé dans l’arche[b], comme Dieu l’avait ordonné à Noé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « deux, deux » ; autrement dit, par paires.'
    reason: lexical_alternative
  - marker: b
    text: 'La formulation hébraïque peut se rendre plus littéralement : « vers Noé, vers l’arche ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: Deux par deux
  rationale: La répétition du nombre exprime une répartition par paires. « Deux par deux » est idiomatique en français tout en conservant l’accent placé en tête de proposition.
- source_word: בָּאוּ
  choice: ils vinrent
  rationale: Le verbe בוא exprime ici un mouvement vers Noé et l’arche. « Vinrent » conserve ce point de vue narratif sans réduire le sens au seul fait d’entrer.
- source_word: אֶל נֹחַ
  choice: auprès de Noé
  rationale: La préposition אֶל marque le mouvement en direction de Noé. « Auprès de Noé » rend naturellement l’arrivée des animaux là où il se trouve.
- source_word: אֶל הַתֵּבָה
  choice: dans l’arche
  rationale: Dans ce contexte de déplacement, אֶל présente l’arche comme destination et implique l’entrée. « Dans l’arche » est le tour français naturel, tandis qu’une note signale la formulation plus littérale.
- source_word: זָכָר וּנְקֵבָה
  choice: mâle et femelle
  rationale: Cette formulation concise conserve la désignation biologique du texte hébreu et sa valeur distributive pour chaque paire.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction exprime la conformité de l’événement au commandement divin. « Comme » suffit naturellement en français sans surinterpréter le degré de correspondance.
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: Dieu l’avait ordonné à Noé
  rationale: Le plus-que-parfait situe correctement le commandement avant l’arrivée des animaux. Le pronom « l’ » reprend implicitement ce qui se produit, comme l’exige l’usage français.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce récit, le nom désigne le Dieu unique et appelle naturellement le singulier « Dieu ».
theological_decisions:
- issue: Agent et mécanisme de l’arrivée des animaux
  choice: Le texte dit que les animaux vinrent auprès de Noé conformément au commandement antérieur de Dieu, sans préciser comment leur venue fut produite.
  alternative: Attribuer explicitement leur venue à l’instinct, à une action directe de Dieu ou aux seuls efforts de Noé.
  rationale: La traduction conserve le lien avec le commandement divin, mais n’ajoute aucun mécanisme absent de l’hébreu.
translation_notes:
  register: Français international moderne, narratif et digne. L’ordre des mots a été légèrement réorganisé pour éviter une suite lourde de compléments tout en gardant « Deux par deux » en position initiale, conformément à l’accent de l’hébreu.
