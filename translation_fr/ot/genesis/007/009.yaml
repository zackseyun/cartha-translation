  source_fidelity: 'Le sens essentiel est bien rendu : la venue se fait par paires, vers Noé et vers l’arche, conformément à un ordre antérieur de Dieu. Toutefois, « auprès de Noé, dans l’arche » décrit plus naturellement le lieu où ils se trouvent une fois arrivés et atténue le second mouvement exprimé par אֶל (« vers/à l’arche »).'
