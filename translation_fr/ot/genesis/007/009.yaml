    issue: Le complément « dans l’arche » est séparé par une virgule après « auprès de Noé ».
    rationale: L’hébreu comporte un second complément de direction, אֶל הַתֵּבָה. La formulation actuelle peut se lire comme une indication de lieu après l’arrivée, plutôt que comme l’arche vers laquelle les animaux viennent. Une formulation plus directe préserve mieux la relation de mouvement tout en restant idiomatique.
  revised_text: Deux par deux[a], mâle et femelle, ils vinrent vers Noé dans l’arche[b], comme Dieu l’avait ordonné à Noé.
