source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: fr
  text: 'Il effaça[a] tout être vivant qui se trouvait à la surface du sol : de l’être humain[b] au bétail, aux petites bêtes qui se déplacent sur le sol et aux oiseaux du ciel. Tous furent effacés de la terre. Il ne resta que Noé et ceux qui étaient avec lui dans l’arche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fit disparaître ». Le verbe hébreu évoque l’action d’essuyer ou d’effacer.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici adam au singulier dans un sens collectif; on pourrait aussi traduire « l’humanité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: effaça / furent effacés
  rationale: Le verbe מחה évoque l’action d’essuyer ou d’effacer. « Effacer » conserve cette image et permet de rendre la forme niphal du second emploi par un passif.
- source_word: כָּל הַיְקוּם
  choice: tout être vivant
  rationale: Dans le contexte du déluge, le terme désigne l’ensemble des êtres animés présents sur la terre ferme, plutôt qu’une notion abstraite d’existence.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: à la surface du sol
  rationale: Cette formulation française naturelle restitue l’image spatiale de l’expression hébraïque.
- source_word: מֵאָדָם
  choice: depuis l’être humain
  rationale: Le singulier collectif « l’être humain » exprime ici l’humanité comme catégorie tout en respectant le nombre grammatical de l’hébreu.
- source_word: בְּהֵמָה
  choice: le bétail
  rationale: « Bétail » désigne clairement et naturellement les animaux domestiques terrestres dans cette énumération.
- source_word: רֶמֶשׂ
  choice: les animaux qui se déplacent sur le sol
  rationale: Cette expression évite de limiter le terme aux seuls reptiles ou aux animaux qui rampent littéralement, tout en conservant son lien avec le déplacement au ras du sol.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: « Du ciel » est l’expression française courante et digne qui rend ici שָּׁמַיִם sans lourdeur.
- source_word: מִן הָאָרֶץ
  choice: de la terre
  rationale: « Terre » convient à la portée narrative du passage, sans préciser davantage la question débattue de l’étendue géographique du déluge.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: Il ne resta que Noé
  rationale: La tournure restitue naturellement la valeur restrictive de אַךְ et le sens de « rester » du verbe שׁאר.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: et ceux qui étaient avec lui dans l’arche
  rationale: La relative désigne les compagnons de Noé; « arche » est le terme français consacré et toujours compréhensible pour תֵּבָה dans ce récit.
theological_decisions:
- issue: Étendue de la destruction décrite par le récit du déluge
  choice: Rendre directement l’affirmation concernant tous les êtres terrestres énumérés, sans en atténuer ni en amplifier la portée.
  alternative: Lire le langage comme une hyperbole régionale, ou le reformuler comme une déclaration scientifique explicitement mondiale.
  rationale: Le français conserve la force et les catégories du texte hébreu, tout en laissant ouverte la question interprétative de l’étendue géographique du déluge.
translation_notes:
  register: Français international moderne, narratif et digne. Le rythme de l’énumération hébraïque est conservé sans archaïsmes; les répétitions du verbe « effacer » reproduisent volontairement l’insistance du texte source.
