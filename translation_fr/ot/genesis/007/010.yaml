  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: fr
  text: Au bout de sept jours[a], les eaux du déluge étaient sur la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et il arriva, au bout de sept jours, que les eaux du déluge étaient sur la terre. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le pays ». Le mot hébreu peut désigner la terre ou un territoire, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: Au bout de sept jours
  rationale: La tournure hébraïque marque l’aboutissement de la période annoncée. « Au bout de sept jours » rend naturellement la transition temporelle sans conserver le peu idiomatique « et il arriva ».
- source_word: וּמֵי הַמַּבּוּל
  choice: les eaux du déluge
  rationale: Le construit hébreu désigne littéralement les eaux associées au מַבּוּל. « Déluge » est naturel en français dans le récit de Noé et distingue cet événement d’une inondation ordinaire.
- source_word: הָיוּ עַל
  choice: furent sur
  rationale: Cette formulation reste proche du sens littéral « étaient/furent sur » et préserve la sobriété de l’énoncé hébreu, sans expliciter davantage le mouvement ou l’étendue.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre au sens large ou un territoire. « La terre » convient au contexte, tandis qu’une note conserve l’autre possibilité lexicale.
theological_decisions:
- issue: Étendue désignée par הָאָרֶץ dans le récit du déluge
  choice: la terre
  alternative: le pays / la région
  rationale: Le contexte narratif favorise ici « la terre », mais le nom hébreu reste lexicalement susceptible d’un sens territorial. La traduction principale ne prétend donc pas trancher à elle seule les débats plus larges sur l’étendue du déluge.
translation_notes:
  register: Français international moderne, sobre et digne. « Au bout de » est idiomatique tout en exprimant l’achèvement des sept jours. « Déluge » conserve le terme biblique courant sans archaïsme marqué.
