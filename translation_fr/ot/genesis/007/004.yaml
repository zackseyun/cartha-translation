revisions:
- from: Car dans sept jours, je ferai pleuvoir sur la terre pendant quarante jours et quarante nuits, et j’effacerai de la surface du sol tout être qui subsiste, tout ce que j’ai fait.[a]
  to: Car dans sept jours, je ferai pleuvoir sur la terre pendant quarante jours et quarante nuits, et j’effacerai de la surface du sol tout être vivant que j’ai fait.
  rationale: La révision supprime le dédoublement artificiel du complément et rend la relation du relatif avec son antécédent explicite. Elle conserve la portée générale du jugement dans son contexte, l’image d’« effacer » pour מחה, et la distinction lexicale entre « terre » et « sol ». La note proposée n’est plus nécessaire, puisque son alternative reproduisait la construction maladroite sans apporter une ambiguïté source utile au lecteur.
