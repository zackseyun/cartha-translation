base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: fr
  text: Car dans sept jours, je ferai pleuvoir sur la terre pendant quarante jours et quarante nuits, et j’effacerai de la surface du sol tout être vivant que j’ai fait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison du commandement donné au verset précédent et conserve naturellement le lien explicatif.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: dans sept jours
  rationale: Rend l’idiome hébreu indiquant qu’il reste sept jours avant le commencement de la pluie.
- source_word: אָנֹכִי מַמְטִיר
  choice: je ferai pleuvoir
  rationale: Le hiphil de מטר exprime la causalité; cette formulation française claire maintient explicitement l’action divine.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: « Terre » convient au contexte du déluge et préserve la distinction avec אֲדָמָה, rendu plus loin par « sol ».
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: pendant quarante jours et quarante nuits
  rationale: L’ajout idiomatique de « pendant » indique clairement la durée en français sans modifier le sens.
- source_word: וּמָחִיתִי
  choice: et j’effacerai
  rationale: Conserve l’image de מחה, qui évoque l’action d’essuyer ou d’effacer, sans la réduire au verbe générique « détruire ».
- source_word: כָּל הַיְקוּם
  choice: tout être qui subsiste
  rationale: יקום désigne littéralement ce qui se tient ou subsiste. Cette formulation préserve davantage la nuance lexicale et l’étendue contextuelle que le seul mot « créature ».
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: tout ce que j’ai fait
  rationale: Le relatif peut reprendre collectivement ce qui précède; le passé composé relie l’acte créateur antérieur au jugement annoncé.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: de la surface du sol
  rationale: Rend naturellement l’idiome hébreu « de dessus la face du sol » et maintient la distinction entre אֶרֶץ, « terre », et אֲדָמָה, « sol ».
theological_decisions:
- issue: Étendue du jugement dans אֶרֶץ et כָּל הַיְקוּם
  choice: Employer « terre » et « tout être qui subsiste », expressions de portée ample, sans préciser davantage l’étendue géographique.
  alternative: Employer « pays » et une formulation susceptible de suggérer explicitement un événement régional.
  rationale: Le texte formule un jugement général sur ce que Dieu a fait. La traduction en conserve la force tout en évitant de trancher une question moderne sur l’étendue géographique du déluge.
- issue: Référent de כָּל הַיְקוּם
  choice: Conserver la notion large de tout être ou de toute réalité qui subsiste dans le cadre du vivant touché par le déluge.
  alternative: Traduire par « toute existence », ce qui pourrait inclure sans limite l’ensemble de la réalité créée, ou par « toute créature », formulation plus interprétative.
  rationale: Le contexte oriente vers les êtres terrestres exposés au jugement, tandis que la forme hébraïque garde une expression collective inhabituelle qu’il convient de ne pas banaliser entièrement.
translation_notes:
  register: Français international moderne, digne et accessible. « Je ferai pleuvoir » conserve l’action causative explicite; « effacerai » maintient l’image vive de l’hébreu. La formulation distingue « terre » (אֶרֶץ) de « sol » (אֲדָמָה).
