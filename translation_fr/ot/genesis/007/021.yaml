source:
  edition: WLC
  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: fr
  text: 'Et toute chair qui se déplaçait sur la terre mourut : les oiseaux, le bétail, les animaux sauvages, toutes les créatures qui pullulent sur la terre, et tous les êtres humains[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « tout l’adam » ; l’hébreu désigne ici collectivement l’ensemble de l’humanité.
    reason: Précision sur le sens collectif de הָאָדָם.
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: mourut
  rationale: Le verbe גוע signifie mourir ou expirer. « Mourut » est direct, naturel et garde le caractère solennel du récit.
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: Cette expression conserve l’idiome hébreu, compréhensible en français biblique courant, et désigne ici l’ensemble des êtres terrestres animés énumérés ensuite.
- source_word: הָרֹמֵשׂ
  choice: qui se mouvait
  rationale: Le participe רמש peut évoquer le fait de ramper, de grouiller ou, plus largement, de se mouvoir. Le sens large convient puisque la liste comprend aussi les oiseaux, le bétail et les animaux sauvages.
- source_word: עַל הָאָרֶץ
  choice: sur la terre
  rationale: Cette traduction naturelle rend la portée géographique du récit sans réduire אֶרֶץ à une région particulière.
- source_word: בָּעוֹף
  choice: les oiseaux
  rationale: Dans cette classification des êtres vivants, « les oiseaux » rend עוֹף de façon claire et idiomatique.
- source_word: וּבַבְּהֵמָה
  choice: le bétail
  rationale: בְּהֵמָה désigne ici les animaux domestiques, par contraste avec les animaux sauvages. « Le bétail » exprime naturellement cette catégorie collective.
- source_word: וּבַחַיָּה
  choice: les animaux sauvages
  rationale: Dans l’opposition avec le bétail, חַיָּה renvoie aux animaux terrestres non domestiqués.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: toutes les créatures qui pullulent
  rationale: שֶׁרֶץ et le participe apparenté décrivent des créatures qui abondent, grouillent ou pullulent. La formulation française reste naturelle, même si elle ne peut reproduire entièrement la répétition étymologique de l’hébreu.
- source_word: וְכֹל הָאָדָם
  choice: et tous les êtres humains
  rationale: אָדָם est ici collectif et désigne l’humanité, non les seuls adultes de sexe masculin ni l’individu Adam.
theological_decisions:
- issue: Portée collective de הָאָדָם
  choice: tous les êtres humains
  alternative: toute l’humanité
  rationale: 'L’article et le contexte donnent à אָדָם un sens collectif : la race humaine dans son ensemble. La traduction explicite cette portée sans introduire de distinction de sexe.'
translation_notes:
  register: Français moderne, digne et accessible. « Toute chair » conserve un idiome central du récit du déluge, tandis que les catégories animales sont formulées dans un vocabulaire courant.
