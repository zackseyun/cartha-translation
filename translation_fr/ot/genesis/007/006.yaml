  text: וְ/נֹ֕חַ בֶּן שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה וְ/הַ/מַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: fr
  text: Noé avait six cents ans, et les eaux du déluge étaient sur la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays ».
    reason: Préserver le sens possible de הָאָרֶץ, qui peut désigner la terre ou le pays.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Noé
  rationale: Le nom est rendu selon sa forme française consacrée. La coordination initiale וְ est naturellement portée par l’enchaînement narratif et n’exige pas ici un « Et » en tête de verset.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: avait six cents ans
  rationale: L’expression hébraïque, littéralement « fils de six cents ans », est une tournure idiomatique indiquant l’âge ; le français naturel dit « avait six cents ans ».
- source_word: וְ/הַ/מַּבּוּל
  choice: et le déluge
  rationale: מַבּוּל désigne ici le grand déluge du récit. « Déluge » est précis, courant dans ce contexte biblique et évite d’ajouter « eaux » au sujet.
- source_word: הָיָה מַיִם
  choice: couvrait
  rationale: La structure littérale « était des eaux » serait peu naturelle en français. « Couvrait » exprime de façon concise et idiomatique la présence des eaux du déluge sur la terre, sans introduire l’idée temporelle supplémentaire de « survint ».
- source_word: עַל הָ/אָרֶץ
  choice: la terre
  rationale: הָאָרֶץ peut signifier « la terre » ou « le pays ». Dans le contexte du déluge, « la terre » convient le mieux, tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Étendue de הָאָרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le nom hébreu permet les deux sens. Le contexte immédiat favorise « la terre », mais la note conserve l’ambiguïté lexicale sans imposer une conclusion doctrinale sur l’étendue géographique du déluge.
translation_notes:
  register: 'Français international moderne, sobre et digne. La formulation privilégie une équivalence optimale : elle rend naturellement l’âge de Noé et explicite idiomatiquement la présence des eaux, tandis que la note conserve la forme plus littérale et l’ambiguïté de « terre/pays ».'
