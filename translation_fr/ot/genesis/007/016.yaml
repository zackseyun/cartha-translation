base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: fr
  text: Et ceux qui entraient[a], mâle et femelle de toute chair[b], entrèrent comme Dieu le lui avait ordonné ; et Yahweh ferma derrière lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui venaient d’entrer ». Le participe hébreu peut décrire ceux qui entrent ou les désigner comme ceux qui sont entrés.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de toute chair » ; cette expression collective désigne ici les êtres vivants.'
    reason: cultural_note
  - marker: c
    text: 'On peut aussi comprendre : « Yahweh l’enferma ». L’hébreu ne mentionne pas explicitement la porte, bien que le contexte la fasse comprendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: Ceux qui entraient ... entrèrent
  rationale: Le participe substantivé suivi du verbe conjugué est reproduit afin de conserver la structure et l’insistance de l’hébreu, tout en restant intelligible en français.
- source_word: זָכָר וּנְקֵבָה
  choice: mâle et femelle
  rationale: Cette paire rend directement les catégories sexuelles exprimées par l’hébreu et convient ici aux êtres vivants qui entrent dans l’arche.
- source_word: מִכָּל בָּשָׂר
  choice: de toute chair
  rationale: La formulation conserve la préposition מִן et le terme collectif בָּשָׂר sans remplacer silencieusement l’image hébraïque par une interprétation.
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: comme Dieu le lui avait ordonné
  rationale: Le plus-que-parfait exprime naturellement l’antériorité de l’ordre; le pronom « le » reprend implicitement ce que Dieu avait prescrit, sans nommer Noé là où l’hébreu emploie un pronom.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Équivalent français courant du titre divin dans ce récit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וַיִּסְגֹּר יְהוָה בַּעֲדוֹ
  choice: Puis Yahweh referma derrière lui
  rationale: « Referma » convient au contexte d’une ouverture désormais fermée, tandis que « derrière lui » traduit בַּעֲדוֹ sans ajouter explicitement « la porte », absent du texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le conserve au lieu de le remplacer par le titre traditionnel.
- issue: Objet implicite de וַיִּסְגֹּר
  choice: referma derrière lui
  alternative: l’enferma
  rationale: La formulation retenue préserve l’absence d’objet explicite et la légère tension du texte hébreu; le contexte laisse comprendre qu’il s’agit de l’accès à l’arche.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « entraient ... entrèrent » est volontairement conservée pour refléter la construction hébraïque. « De toute chair » garde l’image biblique et reçoit une note explicative; « referma derrière lui » évite d’ajouter explicitement une porte.
