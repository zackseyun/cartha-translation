base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: fr
  text: Ce jour-là même, Noé entra dans l’arche[a] avec ses fils Sem, Cham et Japhet, sa femme et les trois femmes de ses fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vint » (avec « vers l’arche ») ; dans ce contexte, il s’agit d’y entrer.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu conclut par « avec eux ». Le français exprime ce rapport d’accompagnement par le « avec » qui introduit l’énumération.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Ce jour-là même
  rationale: L’expression idiomatique souligne qu’il s’agit précisément de ce jour-là. Cette formulation en restitue naturellement l’emphase en français moderne.
- source_word: בָּא
  choice: entra
  rationale: Le verbe signifie littéralement « vint », mais, avec l’arche comme destination introduite par אֶל, il décrit ici l’entrée dans l’arche. « Entra dans » exprime clairement ce mouvement en français.
- source_word: נֹחַ
  choice: Noé
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: וְשֵׁם וְחָם וָיֶפֶת
  choice: avec Sem, Cham et Japhet
  rationale: La préposition « avec » rend explicite en français que les trois fils accompagnent Noé, tandis que la coordination des noms reste naturelle.
- source_word: בְּנֵי נֹחַ
  choice: ses fils
  rationale: Dans ce contexte immédiat, le possessif renvoie sans ambiguïté à Noé et évite une répétition pesante de son nom.
- source_word: וְאֵשֶׁת נֹחַ
  choice: avec sa femme
  rationale: Le possessif français rend naturellement la relation exprimée par l’état construit hébreu.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: avec les trois femmes de ses fils
  rationale: Cette formulation conserve le nombre précis et la relation familiale sans suggérer que chaque fils aurait plusieurs femmes.
- source_word: אִתָּם
  choice: avec
  rationale: L’hébreu porte littéralement « avec eux » à la fin de l’énumération. La répétition de « avec » en français intègre ce rapport d’accompagnement sans produire l’ambiguïté ou la lourdeur de « les femmes de ses fils avec eux ».
- source_word: אֶל הַתֵּבָה
  choice: dans l’arche
  rationale: Avec le verbe « entra », « dans » exprime naturellement la destination intérieure indiquée par אֶל. « Arche » est le terme français établi dans le récit de Noé.
