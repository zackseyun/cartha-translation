base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: fr
  text: eux, ainsi que tous les animaux sauvages selon leur espèce, tous les animaux domestiques selon leur espèce, toutes les petites bêtes qui se déplacent sur la terre selon leur espèce, et tous les oiseaux selon leur espèce — tout oiseau, toute créature ailée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la fin de la phrase dit : « tout oiseau, toute aile ». « Toute aile » est une manière de désigner toute créature ailée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: eux
  rationale: Pronom masculin pluriel emphatique renvoyant à Noé et à ceux qui entrent avec lui; « eux » assure la continuité syntaxique avec le verset précédent.
- source_word: הַחַיָּה
  choice: animaux sauvages
  rationale: Dans la classification animale de la Genèse, le terme désigne ici les animaux sauvages par contraste avec בְּהֵמָה.
- source_word: הַבְּהֵמָה
  choice: animaux domestiques
  rationale: Le terme couvre les grands animaux domestiqués ou le bétail sans se limiter aux bovins; cette formulation maintient le contraste avec les animaux sauvages.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: selon leur espèce
  rationale: Formule classificatoire naturelle en français, proche de l'hébreu et répétée pour conserver la structure du verset.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: les petites bêtes qui se déplacent sur la terre
  rationale: Rend la catégorie des créatures terrestres de petite taille et le participe apparenté sans suggérer à tort que toutes rampent au sens strict.
- source_word: הָעוֹף
  choice: oiseaux
  rationale: Dans ce contexte, l'apposition qui suit précise que la catégorie visée est celle des êtres ailés, principalement les oiseaux; « oiseaux » est naturel en français.
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: tout oiseau, toute créature ailée
  rationale: Conserve les deux expressions apposées de l'hébreu et leur portée exhaustive, plutôt que de les fusionner silencieusement.
