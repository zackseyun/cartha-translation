base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/026.yaml
  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: fr
  text: Yoqtân engendra Almodad, Shélef, Hatsarmaveth et Yérah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Et Yoqtân engendra Almodad, et Shélef, et Hatsarmaveth, et Yérah. » L’enchaînement des « et » de l’hébreu a été allégé en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָקְטָן
  choice: Yoqtân
  rationale: Nom propre translittéré selon une forme française courante, avec q pour ק et accent circonflexe signalant la voyelle longue finale.
- source_word: יָלַד
  choice: engendra
  rationale: Dans cette généalogie, le verbe désigne la paternité ou l’origine de la lignée; « engendra » est concis, digne et traditionnellement intelligible en français biblique.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur du complément d’objet direct sans équivalent lexical autonome en français; sa fonction est rendue par la syntaxe.
- source_word: אַלְמוֹדָד
  choice: Almodad
  rationale: Nom propre translittéré sous sa forme française biblique usuelle.
- source_word: שָׁלֶף
  choice: Shélef
  rationale: Nom propre translittéré en français; « sh » représente שׁ et les accents facilitent la prononciation.
- source_word: חֲצַרְמָוֶת
  choice: Hatsarmaveth
  rationale: Nom propre translittéré dans une forme française reconnaissable; « ts » rend צ, tandis que le h initial représente approximativement ח sans notation savante.
- source_word: יָרַח
  choice: Yérah
  rationale: Nom propre translittéré directement depuis l’hébreu, avec Y initial pour י et h final pour ח.
