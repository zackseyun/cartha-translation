id: GEN.10.1
reference: Genesis 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: fr
  text: 'Voici la descendance des fils de Noé : Sem, Cham et Japhet. Après le déluge, des fils leur naquirent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne une nouvelle section généalogique, tout en rendant la force présentative de la formule hébraïque.
- source_word: תּוֹלְדֹת
  choice: la descendance
  rationale: Dans ce contexte, le terme désigne ce qui est issu des fils de Noé, comme le confirme la liste qui suit. « Descendance » est naturel et conserve l'idée de lignée, sans imposer le maladroit « générations de ».
- source_word: בְּנֵי נֹחַ
  choice: des fils de Noé
  rationale: Rend directement la chaîne construite hébraïque dans un registre digne et courant.
- source_word: שֵׁם חָם וָיָפֶת
  choice: Sem, Cham et Japhet
  rationale: Emploie les formes françaises usuelles des noms bibliques.
- source_word: וַיִּוָּלְדוּ לָהֶם בָּנִים
  choice: des fils leur naquirent
  rationale: Préserve le passif/intransitif de ילד, le rapport exprimé par לָהֶם et le masculin explicite בָּנִים, dans une syntaxe française naturelle et soutenue.
- source_word: אַחַר הַמַּבּוּל
  choice: Après le déluge
  rationale: Rend clairement l'indication temporelle et emploie le terme français biblique courant pour מַבּוּל.
theological_decisions:
- issue: Portée de la formule תּוֹלְדֹת
  choice: la descendance
  alternative: l’histoire de la lignée / les générations
  rationale: La formule peut désigner une lignée ou ce qui procède d’une personne. Ici, le contexte généalogique favorise « descendance », sans ajouter d’interprétation doctrinale.
- issue: Terme masculin בָּנִים
  choice: fils
  alternative: enfants
  rationale: L’hébreu emploie explicitement le masculin pluriel dans une généalogie de descendants mâles; « enfants » en atténuerait la précision.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite le calque peu naturel « les générations des fils de Noé » tout en conservant la fonction de titre généalogique. Le passé simple « naquirent » convient au registre narratif biblique sans être archaïque.
