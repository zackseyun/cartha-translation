id: GEN.10.21
reference: Genesis 10:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: fr
  text: Des enfants naquirent aussi à Sem, père de tous les fils d’Éber et frère aîné de Japhet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « frère de Japhet l’aîné ». L’adjectif hébreu traduit par « aîné » peut qualifier Sem ou Japhet.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם ... גַּם הוּא
  choice: aussi à Sem
  rationale: La tournure conserve l’enchaînement généalogique et la valeur additive de גַּם הוּא, tout en restant naturelle en français.
- source_word: יֻלַּד
  choice: Des enfants naquirent
  rationale: Le passif singulier hébreu introduit idiomatiquement la descendance de Sem. Le pluriel explicite restitue naturellement ce sens en français.
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: père de tous les fils d’Éber
  rationale: « Père » et « fils » préservent les termes généalogiques concrets du texte sans identifier automatiquement ces derniers aux Hébreux ni les paraphraser comme de simples descendants.
- source_word: אֲחִי יֶפֶת הַגָּדוֹל
  choice: frère aîné de Japhet
  rationale: Dans ce contexte familial, גָּדוֹל désigne vraisemblablement l’âge. Le texte principal rattache l’adjectif à Sem, tandis que la note conserve l’autre rattachement syntaxiquement possible.
theological_decisions:
- issue: Rattachement syntaxique de הַגָּדוֹל
  choice: 'L’adjectif qualifie Sem : « frère aîné de Japhet ».'
  alternative: 'L’adjectif qualifie Japhet : « frère de Japhet l’aîné » ou « frère de Japhet, qui était l’aîné » selon l’interprétation.'
  rationale: L’hébreu permet les deux rattachements. Le texte principal retient une lecture plausible sans effacer l’ambiguïté, signalée en note.
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase place naturellement le sujet verbal en tête et coordonne les deux appositions décrivant Sem. Les noms propres suivent les formes françaises usuelles : Sem, Éber, Japhet.'
