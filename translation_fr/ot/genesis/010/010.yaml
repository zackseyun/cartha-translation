source:
  edition: WLC
  text: וַ/תְּהִ֨י רֵאשִׁ֤ית מַמְלַכְתּ/וֹ֙ בָּבֶ֔ל וְ/אֶ֖רֶךְ וְ/אַכַּ֣ד וְ/כַלְנֵ֑ה בְּ/אֶ֖רֶץ שִׁנְעָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: fr
  text: Le commencement de son royaume fut Babel[a], Érek, Akkad et Kalné[b], dans le pays de Shinéar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Babylone ».
    reason: lexical_alternative
  - marker: b
    text: Érek est généralement identifiée à l’ancienne Uruk.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: fut
  rationale: Le wayyiqtol de היה sert ici de copule au passé. « Fut » convient au registre narratif digne et s’intègre naturellement à cette proposition énumérative.
- source_word: רֵאשִׁית
  choice: Le commencement de
  rationale: רֵאשִׁית peut désigner le commencement, la première partie ou la partie principale. « Le commencement de » conserve ici l’idée du noyau initial ou de la première étendue du royaume sans imposer le sens de « capitale ».
- source_word: מַמְלַכְתּוֹ
  choice: son royaume
  rationale: Le nom peut désigner la royauté, le règne ou le royaume. Puisque des villes sont énumérées, « son royaume » exprime clairement le domaine royal de Nimrod.
- source_word: בָּבֶל
  choice: Babel
  rationale: Cette forme française traditionnelle suit le nom hébreu et préserve le lien littéraire avec Genèse 11. « Babylone » est signalé comme autre désignation.
- source_word: אֶרֶךְ
  choice: Érek
  rationale: La forme translittère le nom hébreu אֶרֶךְ dans une graphie adaptée au français. L’identification historique courante à Uruk est indiquée en note.
- source_word: אַכַּד
  choice: Akkad
  rationale: « Akkad » est la forme moderne courante en français pour la ville et correspond étroitement au nom hébreu.
- source_word: כַלְנֵה
  choice: Kalné
  rationale: La translittération française « Kalné » représente la forme du texte massorétique sans l’assimiler au nom apparenté Kalno.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: dans le pays de Shinéar
  rationale: « Pays » rend naturellement אֶרֶץ dans ce contexte géographique, tandis que « Shinéar » conserve le toponyme hébreu traditionnellement adapté au français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les toponymes suivent des formes françaises ou des translittérations lisibles. La syntaxe garde la concision de l’énumération hébraïque, et « commencement » préserve l’ambiguïté entre origine chronologique et noyau initial du royaume.
