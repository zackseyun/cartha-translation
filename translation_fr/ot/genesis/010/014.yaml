source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: fr
  text: les Patrousites, les Kaslouhites — c’est de là que sont sortis les Philistins[a] — et les Caphtorites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « de là sont sortis les Philistins ». Cette proposition peut être comprise comme rattachant leur origine aux Kaslouhites, nommés juste avant.'
    reason: ambiguïté syntaxique et possibilité lexicale
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: Patrousites
  rationale: Translittération française du nom de peuple dérivé de Patros, avec la terminaison ethnonymique « -ites ».
- source_word: כַּסְלֻחִים
  choice: Kaslouhites
  rationale: Translittération qui conserve la forme hébraïque d’un ethnonyme dont l’identification extrabiblique demeure incertaine.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: c’est de là que sont sortis
  rationale: Rend directement l’adverbe מִשָּׁם (« de là ») et le verbe de sortie, sans imposer au relatif un antécédent plus précis que ne le fait l’hébreu.
- source_word: פְּלִשְׁתִּים
  choice: les Philistins
  rationale: Forme française courante de cet ethnonyme.
- source_word: כַּפְתֹּרִים
  choice: Caphtorites
  rationale: Translittération française traditionnelle du nom de peuple lié à Caphtor.
- source_word: וְאֶת
  choice: et
  rationale: Dans cette énumération généalogique, la conjonction est rendue par « et », tandis que le marqueur d’objet direct n’a pas d’équivalent explicite en français.
theological_decisions:
- issue: Référent de la proposition indiquant l’origine des Philistins
  choice: Conserver la formulation adverbiale « c’est de là que sont sortis les Philistins »
  alternative: « les Kaslouhites, dont sont issus les Philistins »
  rationale: L’hébreu dit littéralement « qui/de là sortirent les Philistins » et peut être rattaché aux Kaslouhites immédiatement précédents. La formulation retenue préserve cette proximité tout en évitant de transformer l’adverbe « de là » en une filiation explicitement affirmée.
translation_notes:
  register: Français moderne, clair et digne. Les ethnonymes sont translittérés selon des formes françaises lisibles; les tirets isolent la remarque d’origine au sein de l’énumération.
