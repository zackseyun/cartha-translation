  text: וְ/אֶת הַֽ/חִוִּ֥י וְ/אֶת הַֽ/עַרְקִ֖י וְ/אֶת הַ/סִּינִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/017.yaml
  text: and the Hivites[a], the Arkites, and the Sinites.
translation:
  language: fr
  text: les Hivites[a], les Arqites et les Sinites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le clan hivite, le clan arqite et le clan sinite ». En hébreu, ces gentilés sont au singulier avec l’article, mais ils désignent collectivement des peuples ou des clans.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: et
  rationale: Dans cette liste généalogique, וְ coordonne les éléments, tandis que אֶת, marqueur du complément d’objet, ne se traduit pas directement en français. La première occurrence n’est pas rendue séparément, puisque le verset commence au milieu d’une énumération et que la ponctuation française réserve « et » au dernier élément.
- source_word: הַחִוִּי
  choice: les Hivites
  rationale: Le gentilé hébreu singulier avec article a ici une valeur collective. Le pluriel français désigne naturellement ce peuple et correspond à l’usage biblique courant.
- source_word: הָעַרְקִי
  choice: les Arqites
  rationale: Ce gentilé désigne collectivement les habitants ou descendants associés à Arqa. « Arqites » conserve clairement le lien avec ce nom géographique et suit la forme française usuelle du gentilé.
- source_word: הַסִּינִי
  choice: les Sinites
  rationale: Ce gentilé ethnique singulier à valeur collective est naturellement rendu par un pluriel français, qui préserve son caractère de nom de peuple.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Les ethnonymes traditionnels sont employés au pluriel pour rendre la valeur collective des formes hébraïques. La coordination est adaptée à l’usage naturel du français sans modifier la structure de l’énumération.
