  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: fr
  text: 'Les fils de Sem : Élam, Assour, Arpakshad[a], Loud et Aram[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Arpakshad » ; la forme traditionnelle « Arphaxad » est influencée par le grec.'
    reason: lexical_alternative
  - marker: b
    text: Les noms « Assour » et « Aram » sont souvent associés aux régions ou aux peuples connus plus tard sous les noms d’Assyrie et de Syrie.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן désigne directement les fils dans cette généalogie; « descendants » serait plus large et plus interprétatif.
- source_word: שֵׁם
  choice: Sem
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: עֵילָם
  choice: Élam
  rationale: Transcription française usuelle du nom propre, avec accent conforme à l’orthographe française.
- source_word: אַשּׁוּר
  choice: Assour
  rationale: Transcription du nom hébreu dans son rôle généalogique; « Assyrie » désignerait plus explicitement le territoire ou le peuple associé.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakshad
  rationale: Transcription fondée sur la forme hébraïque, plutôt que « Arphaxad », forme traditionnelle influencée par le grec.
- source_word: לוּד
  choice: Loud
  rationale: Transcription française directe du singulier hébreu; « Loudim » ne correspond pas à la forme présente dans ce verset.
- source_word: אֲרָם
  choice: Aram
  rationale: Le nom hébreu est conservé; « Syrie » serait un équivalent géographique ultérieur et moins précis ici.
