lexical_decisions:
- source_word: וְ/אֶת
  choice: virgule, puis « et » avant le dernier nom
  rationale: 'La particule אֶת marque chaque complément d’objet direct et n’a pas d’équivalent naturel en français. La conjonction וְ est rendue selon l’usage français d’une énumération : virgules, puis « et » avant le dernier élément.'
- source_word: עוֹבָל
  choice: Obal
  rationale: Nom propre translittéré selon la forme française biblique usuelle.
- source_word: אֲבִימָאֵל
  choice: Abimaël
  rationale: Nom propre translittéré ; le tréma indique que les voyelles a et ë se prononcent séparément.
- source_word: שְׁבָא
  choice: Saba
  rationale: Forme française biblique usuelle pour ce nom hébreu dans ce contexte ; elle le distingue de Seba, qui correspond ailleurs à une autre forme hébraïque.
theological_decisions: []
translation_notes:
  register: Formulation concise et naturelle adaptée à une liste généalogique. Le français ne reproduit ni les marqueurs d’objet hébreux ni la répétition de « et » devant chaque nom, puisqu’ils sont déjà portés par la syntaxe du verset précédent.
