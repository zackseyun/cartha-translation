id: GEN.10.9
reference: Genesis 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: fr
  text: 'Il fut un puissant chasseur devant Yahweh. C’est pourquoi l’on dit[a] : « Comme Nimrod, puissant chasseur devant Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « au mépris de Yahweh », si l’expression est comprise dans un sens hostile d’après le contexte plus large.'
    reason: Lecture interprétative alternative de לִפְנֵי יְהוָה.
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: puissant chasseur
  rationale: L’expression décrit un homme remarquable par sa force ou son habileté à la chasse. « Puissant chasseur » reste proche de l’hébreu tout en étant naturel et proverbial en français.
- source_word: לִפְנֵי
  choice: devant
  rationale: « Devant » conserve le sens spatial et relationnel fondamental de l’expression, sans décider si elle indique l’approbation, la simple présence ou une nuance hostile.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette tournure française introduit naturellement la conséquence et l’origine de la parole proverbiale.
- source_word: יֵאָמַר
  choice: l’on dit
  rationale: Le passif impersonnel hébreu introduit une parole proverbiale. « L’on dit » rend cette valeur dans un français actuel et digne.
- source_word: כְּנִמְרֹד
  choice: Comme Nimrod
  rationale: La préposition כְּ marque ici une comparaison; « Comme Nimrod » est la formulation française la plus directe.
theological_decisions:
- issue: Valeur de לִפְנֵי יְהוָה appliqué à Nimrod
  choice: devant Yahweh
  alternative: au mépris de Yahweh / en défiant Yahweh
  rationale: L’expression signifie normalement « devant » ou « en présence de ». Une nuance hostile est parfois proposée d’après le contexte, mais elle n’est pas explicitement encodée par les mots eux-mêmes; le texte principal préserve donc l’ambiguïté et la note signale l’interprétation possible.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « puissant chasseur devant Yahweh » est conservée pour respecter la forme proverbiale du texte hébreu.
