  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: fr
  text: les Jébuséens[a], les Amoréens et les Guirgasiens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie des gentilés au singulier (« le Jébuséen », « l’Amoréen », « le Guirgasien »), mais ceux-ci désignent ici collectivement des peuples; ils sont donc rendus au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: les Jébuséens
  rationale: Le gentilé hébreu est morphologiquement singulier, mais il désigne collectivement un peuple dans la liste des nations. Le pluriel est naturel en français.
- source_word: הָאֱמֹרִי
  choice: les Amoréens
  rationale: Le singulier gentilice hébreu a ici une valeur collective. « Les Amoréens » est la désignation française courante du peuple.
- source_word: הַגִּרְגָּשִׁי
  choice: les Guirgasiens
  rationale: Le gentilé singulier fonctionne collectivement dans cette énumération. « Guirgasiens » suit une forme française biblique largement reconnue.
- source_word: וְאֶת / וְאֵת
  choice: ponctuation de liste et « et » devant le dernier terme
  rationale: אֵת, marqueur de l’objet direct, ne se traduit pas séparément. Les וְ successifs structurent la liste; en français naturel, on emploie des virgules puis « et » avant le dernier élément.
