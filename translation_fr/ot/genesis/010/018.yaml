  text: וְ/אֶת הָֽ/אַרְוָדִ֥י וְ/אֶת הַ/צְּמָרִ֖י וְ/אֶת הַֽ/חֲמָתִ֑י וְ/אַחַ֣ר נָפֹ֔צוּ מִשְׁפְּח֖וֹת הַֽ/כְּנַעֲנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: fr
  text: les Arvadiens, les Tsemariens et les Hamathiens. Par la suite, les clans des Cananéens[a] se dispersèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « du Cananéen » ; le singulier hébreu est ici collectif et désigne le peuple cananéen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: les Arvadiens
  rationale: Le gentilé hébreu singulier a ici une valeur collective dans la liste des peuples issus de Canaan ; le pluriel français rend naturellement ce sens.
- source_word: הַצְּמָרִי
  choice: les Tsemariens
  rationale: Comme les gentilés voisins, le terme désigne collectivement un peuple ; « Tsemariens » conserve le nom ancien tout en adoptant une forme française naturelle.
- source_word: הַחֲמָתִי
  choice: les Hamathiens
  rationale: Le gentilé est collectif dans ce contexte ethnographique ; le pluriel convient à une liste de peuples.
- source_word: וְאַחַר
  choice: Par la suite
  rationale: Cette expression marque clairement la succession temporelle sans alourdir la phrase par un « et » initial.
- source_word: נָפֹצוּ
  choice: se dispersèrent
  rationale: Le niphal décrit ici la dispersion des clans ; la tournure pronominale française préserve la nuance intransitive sans imposer explicitement un agent.
- source_word: מִשְׁפְּחוֹת
  choice: les clans
  rationale: Dans ce cadre généalogique et ethnographique, le mot désigne des groupes de parenté plus larges que les familles nucléaires.
- source_word: הַכְּנַעֲנִי
  choice: des Cananéens
  rationale: Bien que le gentilé soit morphologiquement au singulier, il désigne collectivement le peuple cananéen ; le pluriel français communique clairement cette valeur.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. Les noms de peuples sont rendus par des gentilés français au pluriel, conformément à leur valeur collective dans la Table des nations. « Se dispersèrent » maintient la nuance de dispersion sans préciser un agent que l’hébreu ne nomme pas.
