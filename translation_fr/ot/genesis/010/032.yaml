- from: Telles sont les familles des fils de Noé, selon leurs lignées, dans leurs nations. C’est d’elles que les nations se sont séparées[a] sur la terre après le déluge.
  to: Telles sont les familles des fils de Noé, selon leurs lignées, dans leurs nations. C’est à partir d’elles que les nations se sont séparées[a] sur la terre après le déluge.
  rationale: La seule modification nécessaire remplace « d’elles » par « à partir d’elles » afin de préserver en français la valeur de provenance de מֵאֵלֶּה sans produire l’ambiguïté que crée la construction usuelle « se séparer de ». Le reste du texte et la note sont conservés.
