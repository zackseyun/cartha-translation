  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: fr
  text: Telles sont les familles des fils de Noé, selon leurs lignées, dans leurs nations. C’est à partir d’elles que les nations se sont séparées[a] sur la terre après le déluge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont divisées » ou « se sont dispersées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: familles
  rationale: Le terme désigne des groupes de parenté. « Familles » est naturel en français et convient à cette conclusion généalogique, tandis que « clans » serait possible mais plus spécialisé.
- source_word: לְתוֹלְדֹתָם
  choice: selon leurs lignées
  rationale: תּוֹלְדוֹת peut désigner les générations, la descendance ou les lignées généalogiques. « Lignées » exprime ici clairement l’organisation généalogique sans réduire le mot à une simple liste formelle.
- source_word: בְּגוֹיֵהֶם
  choice: dans leurs nations
  rationale: La préposition ב est conservée dans son sens associatif ou classificatoire. « Dans leurs nations » maintient la structure hébraïque et évite de transformer explicitement la phrase en critère de classement.
- source_word: וּמֵאֵלֶּה
  choice: C’est d’elles que
  rationale: Cette tournure française naturelle met en relief l’origine des nations dans les familles précédemment énumérées, tout en rendant מִן « de, à partir de ».
- source_word: נִפְרְדוּ
  choice: se sont séparées
  rationale: Le nifal de פרד exprime ici la séparation ou la division. La forme pronominale française préserve mieux que « ont été divisées » l’ambiguïté entre processus moyen et résultat passif.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans Genèse 10, גּוֹיִם désigne les peuples constitués en groupes nationaux; « nations » est précis et cohérent dans le contexte.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: La conclusion de la table des nations présente une dispersion d’ampleur universelle; « sur la terre » garde cette portée sans la restreindre à un territoire particulier.
- source_word: אַחַר הַמַּבּוּל
  choice: après le déluge
  rationale: Traduction directe et idiomatique de l’expression temporelle, en continuité avec le récit précédent.
theological_decisions:
- issue: Portée de אֶרֶץ dans le résumé de la dispersion postérieure au déluge
  choice: « la terre », de portée globale
  alternative: « le pays », de portée locale
  rationale: Le verset conclut la table des nations issues des fils de Noé. Le contexte universel favorise « la terre », sans imposer une localisation territoriale étroite.
- issue: Valeur grammaticale et causale de נִפְרְדוּ
  choice: « se sont séparées », formulation moyenne laissant ouverte la dynamique précise
  alternative: « ont été divisées » ou « se sont dispersées »
  rationale: L’hébreu affirme la séparation des nations sans nommer ici l’agent ni préciser si l’accent porte sur l’acte de division ou sur la dispersion qui en résulte. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve les deux compléments parallèles du résumé généalogique et évite un vocabulaire excessivement technique.
