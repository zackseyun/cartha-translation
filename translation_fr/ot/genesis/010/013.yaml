  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: fr
  text: Mitsraïm engendra[a] les Loudim, les Anamim, les Lehabim[b] et les Naftouhim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « eut pour descendants » ou « devint le père de ». Le verbe hébreu est le terme généalogique habituel pour exprimer la génération ou la descendance.'
    reason: lexical_alternative
  - marker: b
    text: Ces noms sont translittérés comme des noms de peuples, sans être remplacés par des noms de lieux ni par des identifications ethniques postérieures.
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mitsraïm
  rationale: 'Translittération du nom propre dans la table des nations : le terme désigne ici l’ancêtre éponyme plutôt que directement le pays d’Égypte.'
- source_word: יָלַד
  choice: engendra
  rationale: Dans ce contexte généalogique, le verbe exprime la génération ou l’origine d’une descendance. « Engendra » est concis, digne et traditionnellement intelligible en français.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur de l’objet direct sans équivalent lexical autonome en français.
- source_word: לוּדִים
  choice: les Loudim
  rationale: Translittération d’un nom collectif de peuple au pluriel, sans imposer une identification historique incertaine.
- source_word: עֲנָמִים
  choice: les Anamim
  rationale: Translittération conservant le caractère de nom de peuple dans la généalogie.
- source_word: לְהָבִים
  choice: les Lehabim
  rationale: Translittération proche de la forme hébraïque, sans l’assimiler à un peuple ultérieur dont l’identification demeure discutée.
- source_word: נַפְתֻּחִים
  choice: les Naftouhim
  rationale: Translittération adaptée aux conventions phonétiques françaises tout en conservant la forme ethnique plurielle.
- source_word: וְ
  choice: et
  rationale: Conjonction française naturelle reliant le dernier élément de l’énumération.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les ethnonymes hébreux sont translittérés selon des graphies lisibles en français. « Engendra » conserve la concision de la formule généalogique, tandis que la note signale que le rapport peut viser plus largement la descendance.
