  text: מֵ֠/אֵלֶּה נִפְרְד֞וּ אִיֵּ֤י הַ/גּוֹיִם֙ בְּ/אַרְצֹתָ֔/ם אִ֖ישׁ לִ/לְשֹׁנ֑/וֹ לְ/מִשְׁפְּחֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: fr
  text: C’est à partir d’eux que les peuples des régions côtières[a] se séparèrent dans leurs territoires, chacun selon sa langue[b], selon leurs clans, dans leurs nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les îles — ou les régions côtières — des nations ». Le terme hébreu peut désigner des îles ou des régions maritimes ; dans ce contexte, l’expression peut aussi désigner les peuples qui les habitent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un homme selon sa langue », tournure distributive qui signifie « chacun selon sa langue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: À partir de ceux-ci
  rationale: 'La préposition מִן jointe au démonstratif indique ici l’origine : les groupes mentionnés procèdent des descendants qui viennent d’être nommés.'
- source_word: נִפְרְדוּ
  choice: se répartirent
  rationale: Le nifal de פרד exprime la séparation en groupes distincts. « Se répartirent » convient au contexte géographique et ethnographique sans imposer l’idée plus forte d’une dispersion désordonnée.
- source_word: אִיֵּי הַגּוֹיִם
  choice: les peuples des régions côtières
  rationale: אִיִּים peut désigner des îles ou, plus largement, des régions côtières et maritimes. La formulation rend explicites les populations qui se répartissent, tout en signalant en note la construction hébraïque plus littérale.
- source_word: בְּאַרְצֹתָם
  choice: dans leurs pays
  rationale: אֶרֶץ désigne ici les territoires occupés par les différents groupes. « Pays » est naturel en français moderne et garde une portée géographique large.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: chacun selon sa langue
  rationale: אִישׁ a une valeur distributive dans cette construction. « Chacun » restitue ce sens, tandis que « langue » rend l’emploi idiomatique de לָשׁוֹן.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: Dans ce cadre généalogique et tribal, מִשְׁפָּחָה désigne des groupes de parenté plus larges que la famille nucléaire ; « clans » convient donc au contexte.
- source_word: בְּגוֹיֵהֶם
  choice: au sein de leurs nations
  rationale: גּוֹי désigne ici un peuple constitué ou une nation. « Au sein de » exprime naturellement la dernière catégorie d’appartenance marquée par בְּ.
theological_decisions:
- issue: 'Le sujet de la séparation : territoires ou populations'
  choice: les peuples des régions côtières se répartirent
  alternative: les régions côtières des nations furent séparées
  rationale: La construction hébraïque nomme littéralement les « îles/régions côtières des nations », mais la suite distributive (« chacun selon sa langue », « selon leurs clans ») vise manifestement des groupes humains. Le texte principal privilégie cette référence humaine, tandis que la note conserve la forme plus littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit l’énumération ethnographique du texte hébreu, tout en évitant de faire des territoires eux-mêmes les locuteurs de langues. Les notes préservent les formulations et ambiguïtés de l’original.
