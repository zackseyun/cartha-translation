  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: fr
  text: Koush engendra Nimrod ; celui-ci commença à être un homme puissant[a] sur la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un héros », « un homme vaillant » ou « un guerrier ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le pays ». Le mot hébreu peut désigner la terre entière ou un territoire particulier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכּוּשׁ
  choice: Coush
  rationale: Le waw poursuit simplement la généalogie et n’a pas besoin d’être rendu en tête de phrase en français. Le nom est transcrit selon l’usage biblique français courant.
- source_word: יָלַד
  choice: engendra
  rationale: Dans une généalogie, le verbe désigne l’engendrement paternel. « Engendra » est précis, digne et idiomatique dans ce registre.
- source_word: נִמְרֹד
  choice: Nimrod
  rationale: Transcription française traditionnelle du nom propre.
- source_word: הוּא
  choice: celui-ci
  rationale: Le pronom indépendant reprend Nimrod avec une légère mise en relief et lève toute ambiguïté sur le sujet.
- source_word: הֵחֵל לִהְיוֹת
  choice: commença à devenir
  rationale: Cette formulation conserve directement la valeur inchoative de la construction hébraïque, sans lui ajouter l’idée interprétative qu’il aurait été le premier.
- source_word: גִּבּוֹר
  choice: un homme puissant
  rationale: Cette expression garde la portée assez large du terme, qui peut désigner un homme fort, vaillant, héroïque ou guerrier, sans imposer ici une nuance exclusivement militaire.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: Dans le contexte de la table des nations, « terre » convient au sens large de אֶרֶץ, et « sur » est l’expression française naturelle pour une personne qui agit ou acquiert un statut dans le monde.
theological_decisions:
- issue: Portée de אֶרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le cadre universel de la généalogie des nations favorise le sens large, mais le sens régional demeure lexicalement possible et est signalé en note.
- issue: Valeur de הֵחֵל לִהְיוֹת
  choice: commença à devenir
  alternative: fut le premier à devenir
  rationale: L’hébreu exprime clairement un commencement, mais ne dit pas explicitement que Nimrod fut chronologiquement le premier. La traduction évite donc d’ajouter cette priorité.
- issue: Nature de la puissance de Nimrod
  choice: homme puissant
  alternative: guerrier / héros
  rationale: Le verset seul ne précise pas encore si גִּבּוֹר doit être compris strictement au sens militaire. Une formulation large préserve cette tension.
translation_notes:
  register: Français international moderne, avec le registre généalogique soutenu mais courant de « engendra ». La syntaxe reste proche de l’hébreu tout en étant naturelle. Les appels de note sont placés après la proposition à laquelle ils se rapportent.
