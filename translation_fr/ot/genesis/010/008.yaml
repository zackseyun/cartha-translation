revisions:
- from: Coush engendra Nimrod ; celui-ci commença à devenir un homme puissant sur la terre.[a][b]
  to: Koush engendra Nimrod ; celui-ci commença à être un homme puissant[a] sur la terre[b].
  rationale: La révision remplace « commença à devenir » par « commença à être », rendu plus naturel et plus étroitement calqué sur la valeur inchoative de הֵחֵל לִהְיוֹת, sans ajouter une priorité chronologique. Elle adopte « Koush » comme graphie biblique française moderne et replace les appels de note sur leurs référents respectifs. Les alternatives lexicales de גִּבּוֹר et de אֶרֶץ sont conservées.
