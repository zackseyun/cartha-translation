    rationale: La construction hébraïque signifie littéralement « commença à être ». En français, « devenir » est redondant après « commencer à » et peut suggérer un processus de transformation plus marqué que le texte ne l'indique.
  - severity: low
    issue: Les appels de note sont placés à la fin de la phrase plutôt qu'auprès de leurs référents immédiats.
    rationale: La note a concerne גִּבּוֹר et la note b concerne בָּאָרֶץ. Les placer après « puissant » et « terre » rend leur portée non ambiguë.
  - severity: low
