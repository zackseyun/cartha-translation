  text: וַֽ/יְהִ֥י מוֹשָׁבָ֖/ם מִ/מֵּשָׁ֑א בֹּאֲ/כָ֥ה סְפָ֖רָ/ה הַ֥ר הַ/קֶּֽדֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: fr
  text: Leur territoire s’étendait depuis Mésha en direction de Séfar[a], la région montagneuse de l’est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Leur lieu d’habitation allait de Mésha vers Séfar, la montagne de l’est. »'
    reason: Le mot hébreu rendu par « région montagneuse » peut désigner une montagne, et la construction permet une traduction plus littérale de l’ensemble de la proposition.
lexical_decisions:
- source_word: וַיְהִי
  choice: s’étendait
  rationale: Dans cette description géographique, l’imparfait « s’étendait » exprime naturellement l’étendue du lieu d’habitation, tout en rendant la fonction narrative de la forme verbale.
- source_word: מוֹשָׁבָם
  choice: leur territoire
  rationale: Le nom désigne ici le lieu où le groupe habitait. « Leur territoire » convient à cette délimitation géographique et reste plus naturel que « leur habitation » en français.
- source_word: מִמֵּשָׁא
  choice: depuis Mésha
  rationale: Le nom de lieu est translittéré selon l’usage français, et la préposition marque le point de départ.
- source_word: בֹּאֲכָה
  choice: en direction de
  rationale: Cette formule géographique issue du verbe « venir/aller » indique le mouvement ou l’orientation vers un lieu sans imposer nécessairement l’idée d’une limite atteinte.
- source_word: סְפָרָה
  choice: Séfar
  rationale: Le nom propre est translittéré en français; le hé directionnel est rendu par « en direction de ».
- source_word: הַר
  choice: la région montagneuse
  rationale: Dans une indication territoriale, le terme peut désigner une montagne ou, collectivement, une zone montagneuse. Le texte principal retient le sens régional naturel dans ce contexte.
- source_word: הַקֶּדֶם
  choice: de l’est
  rationale: Le terme désigne ici l’est ou la région orientale; « de l’est » conserve la formulation géographique du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La formulation géographique reste naturelle sans effacer l’ambiguïté entre une montagne précise et une région montagneuse.
