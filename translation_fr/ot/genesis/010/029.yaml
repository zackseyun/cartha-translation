  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: fr
  text: Ophir, Havila et Jobab. Tous ceux-ci étaient les fils[a] de Joktan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « descendants de Joktan ». Dans les généalogies, le terme hébreu rendu par « fils » peut parfois avoir un sens plus large; ici, il renvoie le plus naturellement aux fils nommés dans la liste qui précède.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: '[marque de l’objet direct non rendue; coordination par « et »]'
  rationale: Les occurrences répétées de אֵת introduisent chacun des derniers noms de la liste commencée au verset précédent. Le français ne marque pas grammaticalement l’objet direct de cette manière; la coordination naturelle est donc conservée avec des virgules et « et » devant le dernier nom.
- source_word: אוֹפִר
  choice: Ofir
  rationale: Nom propre transcrit selon l’usage biblique français courant.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Nom propre transcrit sous une forme claire et courante en français biblique moderne.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nom propre transcrit de manière à représenter la consonne initiale hébraïque yod, selon une convention française transparente.
- source_word: כָּל אֵלֶּה
  choice: Tous ceux-là
  rationale: Cette formulation rend directement la récapitulation de toute la liste et reste naturelle en français.
- source_word: בְּנֵי
  choice: fils de
  rationale: Dans les généalogies, le terme peut parfois désigner plus largement des descendants, mais le contexte immédiat présente une liste de fils nommés; « fils de » préserve donc le sens le plus naturel sans effacer l’extension possible.
- source_word: יָקְטָן
  choice: Yoqtan
  rationale: Transcription française transparente du nom hébreu, distinguant le qof par « q ».
