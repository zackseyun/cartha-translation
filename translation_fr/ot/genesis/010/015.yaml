  variant: modern international French
source:
  edition: WLC
  text: וּ/כְנַ֗עַן יָלַ֛ד אֶת צִידֹ֥ן בְּכֹר֖/וֹ וְ/אֶת חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/015.yaml
  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: fr
  text: Canaan engendra Sidon, son premier-né, et Heth.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Heth est présenté ailleurs comme l’ancêtre des Hittites (voir Gn 23.3).
    reason: 'Renvoi généalogique : précise le lien traditionnel sans attribuer à ce verset la mention explicite des Hittites.'
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Canaan
  rationale: Le nom propre est rendu selon sa forme française traditionnelle. La conjonction וּ est intégrée naturellement à la continuité de la généalogie sans qu’un « Et » initial soit nécessaire en français.
- source_word: יָלַד
  choice: engendra
  rationale: Dans ce contexte généalogique, le verbe désigne l’action d’avoir pour descendant direct ou d’engendrer. « Engendra » conserve avec concision le sens généalogique masculin et le registre digne du passage.
- source_word: אֶת
  choice: '[non traduit]'
  rationale: Cette particule marque le complément d’objet direct défini et n’a pas d’équivalent lexical en français.
- source_word: צִידֹן
  choice: Sidon
  rationale: Le nom propre est rendu selon sa forme française conventionnelle.
- source_word: בְּכֹר/וֹ
  choice: son premier-né
  rationale: Le nom avec suffixe masculin singulier présente Sidon comme le premier-né de Canaan. Cette formulation directe préserve l’information sans préciser davantage le rapport chronologique ou juridique.
- source_word: וְ/אֶת
  choice: et
  rationale: La conjonction relie le second descendant au premier; la particule d’objet direct reste sans traduction distincte.
- source_word: חֵת
  choice: Heth
  rationale: Le texte hébreu donne seulement le nom personnel. La translittération « Heth » évite d’ajouter dans le corps du verset une identification explicative absente de l’original.
theological_decisions: []
translation_notes:
  register: Français moderne, concis et digne, adapté à une liste généalogique. « Engendra » est légèrement soutenu mais reste clair et traditionnellement intelligible dans ce genre littéraire. Le marqueur [a] est placé après « Heth », puisque la note porte sur ce nom.
