lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: La forme construite plurielle בְּנֵי signifie littéralement « fils de » et conserve ici la formulation généalogique de l’hébreu. La conjonction initiale est naturellement omise en français dans un verset qui poursuit une liste.
- source_word: יָוָן
  choice: Javan
  rationale: Transcription française traditionnelle et immédiatement reconnaissable de ce nom propre.
- source_word: אֱלִישָׁה
  choice: Élisha
  rationale: Transcription française usuelle du nom propre, avec accent initial pour guider naturellement la lecture.
- source_word: תַרְשִׁישׁ
  choice: Tarsis
  rationale: Forme française traditionnelle de ce nom de peuple ou de lieu, plus naturelle que la translittération anglaise « Tarshish ».
- source_word: כִּתִּים
  choice: Kittim
  rationale: Transcription courante qui préserve la forme plurielle de cet ethnonyme ou nom géographique.
- source_word: דֹדָנִים
  choice: Dodanim
  rationale: Le texte massorétique fourni porte דֹדָנִים, rendu par « Dodanim »; la variante « Rodanim » est signalée en note.
