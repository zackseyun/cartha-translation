  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: fr
  text: La frontière des Cananéens s’étendait depuis Sidon en direction de Guérar, jusqu’à Gaza, puis en direction de Sodome, Gomorrhe, Adma et Tseboïm, jusqu’à Lacha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lécha ».
    reason: Variante de transcription du nom de lieu לָשַׁע.
lexical_decisions:
- source_word: וַיְהִי
  choice: s’étendait
  rationale: Dans cette description géographique, la forme narrative de היה introduit l’étendue de la frontière. « S’étendait » rend naturellement en français la valeur copulative et spatiale du contexte.
- source_word: גְּבוּל הַכְּנַעֲנִי
  choice: la frontière des Cananéens
  rationale: גְּבוּל désigne ici la limite territoriale, et le gentilé singulier הַכְּנַעֲנִי a un sens collectif. Le pluriel français « des Cananéens » exprime clairement cette valeur.
- source_word: מִצִּידֹן
  choice: depuis Sidon
  rationale: La préposition מִן marque le point de départ de la délimitation. « Sidon » est la forme française courante du toponyme.
- source_word: בֹּאֲכָה
  choice: en direction de
  rationale: Dans les formules de délimitation, cette expression indique l’orientation ou le trajet vers un lieu. « En direction de » conserve ce sens sans imposer un sujet indéfini comme « en allant ».
- source_word: גְרָרָה
  choice: Guérar
  rationale: La terminaison directionnelle hébraïque est rendue par « en direction de » ; « Guérar » est la forme française usuelle du nom de lieu.
- source_word: עַד
  choice: jusqu’à
  rationale: Cette préposition marque le terme ou l’étendue de la frontière.
- source_word: עַזָּה
  choice: Gaza
  rationale: Forme française courante du toponyme.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: Sodome, Gomorrhe, Adma et Tseboïm
  rationale: Les formes françaises usuelles des quatre toponymes sont retenues. La coordination est exprimée selon l’usage naturel du français, sans modifier leur fonction dans le tracé.
- source_word: לָשַׁע
  choice: Lacha
  rationale: « Lacha » transcrit directement les consonnes et la vocalisation du texte massorétique selon les conventions françaises ; la variante « Lécha », fréquente dans la tradition française, est signalée en note.
