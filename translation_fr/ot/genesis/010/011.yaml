  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: fr
  text: De ce pays, Assour sortit et bâtit Ninive[a], Rehoboth-Ir et Kalah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « De ce pays, il partit pour l’Assyrie et bâtit Ninive, Rehoboth-Ir et Kalah. » Cette lecture garde Nimrod, mentionné au verset précédent, comme sujet et comprend אַשּׁוּר comme le territoire de l’Assyrie plutôt que comme la personne Assour.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: De ce pays
  rationale: מִן indique la provenance, et אֶרֶץ désigne ici un territoire. « De ce pays » est naturel et conserve le sens géographique.
- source_word: יָצָא
  choice: sortit
  rationale: יצא signifie couramment « sortir ». Le passé simple convient au registre narratif soutenu sans être archaïque.
- source_word: אַשּׁוּר
  choice: Assour
  rationale: Le nom peut désigner soit la personne Assour, soit le territoire de l’Assyrie. Le texte principal le prend comme sujet explicite, tandis que l’autre analyse est signalée en note.
- source_word: וַיִּבֶן
  choice: qui bâtit
  rationale: בנה signifie directement « bâtir, construire ». La relative française clarifie naturellement que le sujet reste Assour, sans ajouter de contenu.
- source_word: נִינְוֵה
  choice: Ninive
  rationale: Forme française usuelle du nom de lieu.
- source_word: רְחֹבֹת עִיר
  choice: Rehoboth-Ir
  rationale: Dans cette liste introduite par des marqueurs d’objet répétés, l’expression est vraisemblablement un nom de lieu. La translittération préserve toutefois l’incertitude lexicale.
- source_word: כָּלַח
  choice: Kalah
  rationale: Translittération française claire du nom de lieu, distinguant le ח final par « h ».
theological_decisions:
- issue: Sujet de יָצָא et sens de אַשּׁוּר
  choice: 'Assour est le sujet : « Assour sortit »'
  alternative: 'Nimrod demeure le sujet sous-entendu : « De ce pays, il passa en Assyrie »'
  rationale: Le texte hébreu permet les deux analyses, puisque אַשּׁוּר peut être le nom de la personne Assour ou celui de l’Assyrie. L’ordre immédiat des mots permet naturellement de prendre Assour comme sujet explicite, mais l’autre lecture ancienne et plausible doit être conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le rythme narratif biblique. Les formes françaises établies « Assour » et « Ninive » sont retenues; « Rehoboth-Ir » et « Kalah » sont translittérés.
