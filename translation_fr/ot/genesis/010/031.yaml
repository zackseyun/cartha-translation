  text: אֵ֣לֶּה בְנֵי שֵׁ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם לְ/גוֹיֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/031.yaml
  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: fr
  text: Voici les fils de Sem, selon leurs clans, selon leurs langues, dans leurs pays, selon leurs nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Introduit naturellement en français moderne une formule récapitulative déictique dans une proposition nominale.
- source_word: בְנֵי שֵׁם
  choice: les fils de Sem
  rationale: Conserve la formulation généalogique formelle de l’hébreu et le nom propre sous sa forme française traditionnelle.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: מִשְׁפָּחָה désigne ici les subdivisions généalogiques ou tribales; « selon » rend la valeur classificatoire de la préposition לְ.
- source_word: לִלְשֹׁנֹתָם
  choice: selon leurs langues
  rationale: לָשׁוֹן signifie littéralement « langue » et désigne ici les groupes linguistiques; le français conserve naturellement ce même terme.
- source_word: בְּאַרְצֹתָם
  choice: dans leurs pays
  rationale: La préposition בְ a une valeur locative. Au pluriel, אֶרֶץ désigne les territoires où résident ces groupes; « pays » est clair sans exiger la notion moderne d’État.
- source_word: לְגוֹיֵהֶם
  choice: selon leurs nations
  rationale: גּוֹי désigne un peuple ou une nation; « selon » maintient la structure classificatoire répétée de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « selon » restitue la cadence classificatoire des trois occurrences de לְ, tandis que « dans » distingue la relation géographique exprimée par בְ. « Fils » préserve la formulation généalogique plutôt que de l’élargir explicitement à « descendants ».
