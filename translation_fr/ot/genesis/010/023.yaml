  yaml_path: translation/ot/genesis/010/023.yaml
  text: 'The sons of Aram: Uz[a], Hul, Gether, and Mash.'
translation:
  language: fr
  text: 'Les fils d’Aram : Outs, Houl, Guéter et Mash[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte « Mash » ; 1 Chroniques 1.17 porte « Méshek ».
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Le pluriel construit de בֵּן désigne ici les fils dans une formule généalogique. La conjonction initiale n’est pas rendue séparément, puisque le français introduit naturellement ce nouvel élément de la liste.
- source_word: אֲרָם
  choice: Aram
  rationale: Nom propre conservé selon sa forme française biblique usuelle.
- source_word: עוּץ
  choice: Outs
  rationale: Translittération française usuelle du nom hébreu עוּץ, avec « ou » pour la voyelle /u/ et « ts » pour la consonne finale.
- source_word: חוּל
  choice: Houl
  rationale: Translittération française naturelle de חוּל, qui distingue ce nom de mots français courants tout en restant proche de la forme hébraïque.
- source_word: גֶתֶר
  choice: Guéter
  rationale: 'Translittération adaptée au français : « Gu » maintient le son dur devant « é », et les accents rendent la lecture naturelle.'
- source_word: מַשׁ
  choice: Mash
  rationale: Le texte massorétique de Genèse 10.23 porte מַשׁ. « Mash » le reproduit directement sans l’harmoniser avec la forme différente de 1 Chroniques 1.17.
theological_decisions: []
translation_notes:
  register: Formulation généalogique concise et digne, en français international moderne. Les noms suivent des translittérations françaises lisibles. Le marqueur de note est placé après « Mash », le nom concerné par la variante, plutôt qu’après « Outs » comme dans la couche anglaise fournie.
