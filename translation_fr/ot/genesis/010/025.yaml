source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: fr
  text: 'Deux fils naquirent à Éber : l’un s’appelait Péleg[a], car de son temps la terre fut divisée, et son frère s’appelait Yoqtân.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le pays fut divisé ». Le mot hébreu peut désigner soit la terre, soit un pays ou un territoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: Deux fils naquirent à Éber
  rationale: Cette formulation rend naturellement en français la construction hébraïque passive « à Éber furent nés deux fils », sans transformer le verbe en un actif tel que « engendra ».
- source_word: שֵׁם הָאֶחָד
  choice: l’un s’appelait
  rationale: Le sens littéral est « le nom de l’un ». La tournure choisie est plus naturelle en français moderne et conserve le contraste avec « son frère ».
- source_word: פֶּלֶג
  choice: Péleg
  rationale: Translittération française usuelle du nom hébreu, avec un accent facilitant la prononciation.
- source_word: כִּי בְיָמָיו
  choice: car de son temps
  rationale: « Car » introduit l’explication du nom, tandis que « de son temps » rend idiomatiquement l’expression temporelle hébraïque.
- source_word: נִפְלְגָה
  choice: fut divisée
  rationale: Le nifal de פלג exprime ici l’action d’être divisé. Ce choix conserve aussi l’écho sonore et étymologique avec le nom Péleg.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans le contexte de la généalogie des peuples, « la terre » convient à la portée générale du récit, tout en laissant en note l’autre sens lexical possible, « le pays ».
- source_word: וְשֵׁם אָחִיו
  choice: et son frère s’appelait
  rationale: Tournure française naturelle pour l’hébreu « et le nom de son frère », sans perte de sens.
- source_word: יָקְטָן
  choice: Yoqtân
  rationale: Translittération du nom hébreu יָקְטָן qui représente distinctement ses consonnes et sa voyelle longue finale.
theological_decisions:
- issue: Portée de הָאָרֶץ dans l’explication du nom de Péleg
  choice: la terre
  alternative: le pays
  rationale: Le contexte de Genèse 10, qui présente les peuples issus de Noé, favorise la portée large de « la terre ». Toutefois, le mot hébreu peut aussi désigner un pays ou un territoire ; cette possibilité est donc conservée en note sans préciser le mécanisme historique de la division.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe généalogique a été légèrement lissée pour éviter une tournure passive peu idiomatique, tout en maintenant le contenu et les ambiguïtés du texte hébreu.
