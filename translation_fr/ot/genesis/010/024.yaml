  text: וְ/אַרְפַּכְשַׁ֖ד יָלַ֣ד אֶת שָׁ֑לַח וְ/שֶׁ֖לַח יָלַ֥ד אֶת עֵֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/024.yaml
  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: fr
  text: Arpakshad[a] engendra Shalah, et Shélah engendra Éber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les formes hébraïques de ce verset sont « Arpakshad », « Shalah » (première occurrence) et « Shélah » (seconde occurrence). Les versions françaises traditionnelles emploient souvent des formes telles qu’« Arphaxad » et « Sala », influencées par les traditions grecque et latine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpakshad
  rationale: Translittération française proche de la forme hébraïque אַרְפַּכְשַׁד; le k rend naturellement le son /k/ en français, tandis qu’« Arphaxad » relève surtout de la tradition grecque et latine.
- source_word: יָלַד
  choice: engendra
  rationale: Dans une généalogie avec un sujet masculin, le verbe signifie qu’un homme devient le père de quelqu’un. « Engendra » est concis, digne et immédiatement reconnaissable dans ce contexte.
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu du complément d’objet direct, sans équivalent lexical autonome en français.
- source_word: שָׁלַח / שֶׁלַח
  choice: Shélah
  rationale: Translittération fondée sur la forme hébraïque du nom dans ce verset; elle est conservée de façon uniforme aux deux occurrences.
- source_word: וְ/שֶׁלַח
  choice: et Shélah
  rationale: La conjonction וְ est rendue par « et », et le nom répété garde la même translittération.
- source_word: עֵבֶר
  choice: Éber
  rationale: Forme française qui représente directement le nom hébreu עֵבֶר; l’accent initial guide la prononciation française et évite la forme traditionnelle « Héber », moins proche de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple « engendra » convient à la cadence généalogique et reste clair dans un texte biblique. Les noms propres sont translittérés à partir de l’hébreu plutôt que repris des formes grecques ou latines traditionnelles.
