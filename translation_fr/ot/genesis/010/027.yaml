lexical_decisions:
- source_word: וְ/אֶת
  choice: et
  rationale: אֵת est ici le marqueur non traduit du complément d’objet direct dans une liste généalogique; וְ coordonne les noms. En français, une coordination naturelle par « et » suffit, sans répéter la conjonction devant chaque élément.
- source_word: הֲדוֹרָם
  choice: Hadoram
  rationale: Nom propre translittéré selon une forme française claire et proche de l’hébreu.
- source_word: אוּזָל
  choice: Ouzal
  rationale: La graphie « Ouzal » représente naturellement en français la voyelle initiale /ou/ du nom hébreu.
- source_word: דִּקְלָה
  choice: Diqla
  rationale: Translittération lisible du nom hébreu; « q » rend le qof et évite de suggérer une traduction du nom.
