  text: אֵ֣לֶּה בְנֵי חָ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹֽׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: fr
  text: Voici les fils de Cham, selon leurs clans, selon leurs langues, dans leurs pays, selon leurs nations[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon leurs peuples ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Voici
  rationale: Le démonstratif introduit ici une formule récapitulative. « Voici » rend naturellement cette fonction d’identification en français.
- source_word: בְנֵי חָם
  choice: les fils de Cham
  rationale: La traduction formelle conserve l’expression généalogique, qui peut inclure les descendants présentés dans les versets précédents.
- source_word: לְמִשְׁפְּחֹתָם
  choice: selon leurs clans
  rationale: La préposition marque ici le classement par groupes. « Clans » désigne plus précisément des groupes de parenté que « familles ».
- source_word: לִלְשֹׁנֹתָם
  choice: selon leurs langues
  rationale: Bien que לָשׁוֹן signifie littéralement « langue » au sens anatomique, le pluriel désigne ici les langues parlées.
- source_word: בְּאַרְצֹתָם
  choice: dans leurs territoires
  rationale: La préposition est locative. « Territoires » évite les connotations modernes de l’État-nation que pourrait suggérer « pays ».
- source_word: בְּגוֹיֵהֶם
  choice: selon leurs nations
  rationale: Dans cette formule récapitulative, l’expression indique le classement en ensembles de peuples. « Nations » conserve la distinction avec les clans et les territoires.
theological_decisions:
- issue: Portée généalogique de בְנֵי
  choice: fils
  alternative: descendants
  rationale: « Fils » préserve la forme hébraïque traditionnelle sans exclure, dans ce contexte généalogique, une portée plus large comprenant les descendants.
- issue: Sens de גּוֹי dans la formule
  choice: nations
  alternative: peuples
  rationale: « Nations » rend le terme de façon concise tout en gardant sa dimension collective; la note signale « peuples », qui évite une lecture exclusivement politique ou moderne.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « selon leurs » conserve le caractère formulaire et classificatoire de l’hébreu; « et » avant le dernier élément fluidifie l’énumération sans en modifier la structure.
