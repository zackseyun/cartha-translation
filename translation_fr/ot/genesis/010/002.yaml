  text: 'Les fils de Japhet : Gomer, Magog, Madaï, Javan[a], Tubal, Méschec et Tiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans des emplois ultérieurs, certains noms peuvent aussi désigner des peuples ou des régions : « Madaï » peut désigner les Mèdes, et « Javan » l’Ionie ou les Grecs. Le texte principal conserve les noms généalogiques hébreux sous une forme translittérée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: les fils de
  rationale: Le pluriel construit de בֵּן introduit ici une généalogie. « Les fils de » restitue directement le cadrage masculin du texte hébreu sans l’élargir à « descendants » ou « enfants ».
- source_word: יֶפֶת
  choice: Japhet
  rationale: Nom propre rendu selon sa forme française traditionnelle et courante.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Nom propre dans la liste généalogique, conservé par translittération.
- source_word: מָגוֹג
  choice: Magog
  rationale: Nom propre à portée ethnogéographique possible ailleurs, mais employé ici comme nom dans la généalogie.
- source_word: מָדַי
  choice: Madaï
  rationale: La forme du nom hébreu est préservée en français plutôt que remplacée dans le corps du texte par l’identification interprétative « les Mèdes ».
- source_word: יָוָן
  choice: Yavân
  rationale: La translittération conserve la présentation généalogique du passage sans substituer l’identification possible avec l’Ionie ou les Grecs.
- source_word: תֻבָל
  choice: Toubal
  rationale: Translittération française usuelle du nom propre.
- source_word: מֶשֶׁךְ
  choice: Méchek
  rationale: Translittération française lisible du nom propre, reflétant les consonnes hébraïques.
- source_word: תִירָס
  choice: Tiras
  rationale: Nom propre conservé par translittération.
