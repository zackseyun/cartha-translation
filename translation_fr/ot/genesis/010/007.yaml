  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: fr
  text: 'Et les fils[a] de Koush : Seba, Havila, Sabta, Raama et Sabteka[b]. Les fils de Raama : Saba et Dedan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les généalogies hébraïques, l’expression « fils de » peut désigner des descendants ou l’origine de clans et de peuples, et pas seulement des fils au sens biologique immédiat.
    reason: cultural_note
  - marker: b
    text: Plusieurs noms de ce verset peuvent désigner des peuples, des régions ou des ancêtres éponymes, plutôt que seulement des individus.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Les fils de
  rationale: Rend directement la formule généalogique hébraïque. Dans ce contexte, « fils » peut aussi désigner des descendants ou des groupes issus d’un ancêtre.
- source_word: כּוּשׁ
  choice: Koush
  rationale: Translittération française usuelle du nom propre.
- source_word: סְבָא
  choice: Seba
  rationale: Le nom est translittéré sans trancher s’il désigne un individu, un peuple ou un territoire.
- source_word: חֲוִילָה
  choice: Havila
  rationale: Translittération française claire et courante du nom propre.
- source_word: סַבְתָּה
  choice: Sabta
  rationale: Translittération naturelle en français, qui représente la forme hébraïque sans ajouter un h final non prononcé.
- source_word: רַעְמָה
  choice: Raama
  rationale: Translittération lisible qui conserve les deux voyelles séparées du nom hébreu.
- source_word: סַבְתְּכָא
  choice: Sabteka
  rationale: Translittération proche de la forme hébraïque et adaptée aux conventions phonétiques françaises.
- source_word: וּבְנֵי רַעְמָה
  choice: Les fils de Raama
  rationale: La répétition de la formule généalogique est conservée afin de respecter la structure du verset.
- source_word: שְׁבָא
  choice: Saba
  rationale: Forme française traditionnelle du nom connu notamment par l’expression « reine de Saba ».
- source_word: דְדָן
  choice: Dedân
  rationale: Translittération française traditionnelle; l’accent circonflexe aide à distinguer la dernière voyelle nasalisée de la simple terminaison écrite.
