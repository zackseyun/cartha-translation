  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: fr
  text: et Résen, entre Ninive et Kalah[a] ; c’est la grande ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Kalhu », forme assyrienne du nom de lieu traditionnellement rendu par « Kalah ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « c’est la grande ville » peut désigner Résen en particulier ou, plus largement, la région urbaine située entre Ninive et Kalah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: et
  rationale: Dans la liste des villes fondées, וְ introduit un nouvel élément et אֵת marque l’objet direct sans équivalent autonome nécessaire en français.
- source_word: רֶסֶן
  choice: Résèn
  rationale: Translittération française actuelle du nom de lieu hébreu, avec des accents qui en facilitent la prononciation.
- source_word: בֵּין ... וּבֵין
  choice: entre ... et
  rationale: Rend directement la construction corrélative qui situe Résèn par rapport à Ninive et à Kalah.
- source_word: נִינְוֵה
  choice: Ninive
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: כָּלַח
  choice: Kalah
  rationale: Translittération proche de la forme hébraïque ; la forme assyrienne Kalhu est signalée en note.
- source_word: הִוא
  choice: c’est
  rationale: Le pronom indépendant a ici une fonction de reprise et de copule ; « c’est » conserve la formulation explicative sans préciser son référent.
- source_word: הָעִיר הַגְּדֹלָה
  choice: la grande ville
  rationale: Rend les deux formes définies et conserve à גָּדוֹל son sens ouvert de grandeur, qui peut évoquer l’étendue ou l’importance.
theological_decisions:
- issue: Référent de « c’est la grande ville »
  choice: La formulation reste sans référent explicité.
  alternative: Comprendre la proposition comme désignant précisément Résèn, ou comme désignant l’ensemble urbain situé entre Ninive et Kalah.
  rationale: La syntaxe hébraïque ne tranche pas explicitement entre ces possibilités ; la traduction préserve donc cette ambiguïté au lieu de l’interpréter dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres suivent des formes françaises lisibles, et le point-virgule maintient le lien formel entre la localisation et la proposition finale sans lever son ambiguïté.
