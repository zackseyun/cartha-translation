  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: fr
  text: 'Et les fils de Cham : Koush, Mitsraïm[a], Pouth[b] et Canaan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Mitsraïm » ; beaucoup de traductions rendent ce nom par « Égypte ». Dans cette généalogie, ce nom hébreu est employé comme nom personnel ou ancestral.'
    reason: alternative_reading
  - marker: b
    text: Le nom « Pouth » est aussi transcrit « Pout » dans certaines traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Les fils de
  rationale: Le pluriel construit signifie littéralement « les fils de ». Dans cette généalogie, il peut désigner des fils ou des lignées issues d’ancêtres nommés; la formulation traditionnelle conserve cette portée sans l’aplanir en « descendants ».
- source_word: חָם
  choice: Cham
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: כּוּשׁ
  choice: Koush
  rationale: Translittération française moderne du nom propre כּוּשׁ, préférable ici à une identification géographique interprétative.
- source_word: וּ/מִצְרַיִם
  choice: Mitsraïm
  rationale: Dans cette liste généalogique, le terme fonctionne comme nom personnel ou ancestral; il est donc translittéré plutôt que rendu par « Égypte ».
- source_word: וּ/פוּט
  choice: Pouth
  rationale: Forme française biblique usuelle du nom propre פּוּט, fondée sur sa prononciation hébraïque.
- source_word: וּ/כְנָעַן
  choice: et Canaan
  rationale: La forme française établie « Canaan » est conservée, avec la conjonction pour coordonner naturellement le dernier élément de la liste.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres suivent les formes françaises bibliques établies lorsqu’elles restent naturelles; Mitsraïm est conservé afin de respecter sa fonction généalogique. Le waw initial n’est pas rendu séparément, car l’ouverture par « Et » serait moins naturelle dans un verset français isolé, tandis que la continuité de la liste demeure évidente.
