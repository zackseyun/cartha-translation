  text: 'And the sons of Gomer: Ashkenaz[a], Riphath, and Togarmah.'
translation:
  language: fr
  text: 'Et les fils de Gomer : Ashkenaz, Riphath[a] et Togarma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En 1 Chroniques 1.6, on lit « Difath » au lieu de « Riphath ».
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Et les fils de
  rationale: Le pluriel construit de בֵּן, précédé de la conjonction, est rendu naturellement dans ce contexte généalogique par « Et les fils de », ce qui préserve à la fois le lien avec le verset précédent et la structure de filiation.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Nom propre translittéré selon la forme française courante.
- source_word: אַשְׁכֲּנַז
  choice: Ashkenaz
  rationale: Nom propre translittéré selon l’usage français courant, sans chercher à lui attribuer ici une identification géographique.
- source_word: וְ/רִיפַת
  choice: Rifath
  rationale: Le texte massorétique de la Genèse porte רִיפַת. La conjonction est rendue dans l’énumération française avant le dernier élément, tandis que la variante « Difath » du passage parallèle est signalée en note.
- source_word: וְ/תֹגַרְמָה
  choice: et Togarma
  rationale: Nom propre translittéré selon la forme française courante; la conjonction hébraïque est rendue par « et » conformément à la syntaxe naturelle d’une énumération française.
