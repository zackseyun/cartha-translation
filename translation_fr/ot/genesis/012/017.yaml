review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : Yahweh inflige des fléaux graves au pharaon et à sa maison en raison de Saraï, femme d’Abram. Toutefois, « les siens » est plus large et moins précis que בֵּיתוֹ, qui vise la maisonnée ou les gens de sa maison. « Infligea ... des fléaux » restitue aussi plus naturellement en français l’expression hébraïque formée du verbe נגע et du nom נגעים.'
  naturalness: « Frapper quelqu’un de fléaux » est compréhensible, mais « infliger des fléaux à quelqu’un » est plus idiomatique en français moderne. « Les gens de sa maison » est clair, naturel et évite l’ambiguïté de « les siens ».
  terminology: « Yahweh », « pharaon », « Saraï » et « Abram » sont cohérents avec le texte source et l’usage français. « Graves fléaux » rend sans surcharge l’intensité de נְגָעִים גְּדֹלִים. L’apposition « la femme d’Abram » conserve explicitement la relation exprimée en hébreu.
  issues:
  - severity: low
    issue: « les siens » élargit et atténue « sa maison »
    rationale: Le terme peut désigner les proches au sens général, tandis que בֵּיתוֹ renvoie plus précisément à la maisonnée ou aux personnes de la maison du pharaon.
  - severity: low
    issue: Construction « frappa ... de terribles fléaux » moins idiomatique
    rationale: Bien qu’elle soit possible dans un registre soutenu, « infligea ... de graves fléaux » est plus fluide et rend adéquatement la valeur causative et nuisible du contexte.
  revised_text: Mais Yahweh infligea au pharaon et aux gens de sa maison de graves fléaux, à cause de Saraï, la femme d’Abram[a].
