  rationale: La révision précise la portée de « sa maison », améliore l’idiomaticité française de la construction verbale et conserve le sens causal concis du texte hébreu. La note, ancrée après l’identification complète de Saraï, préserve les principales possibilités lexicales sans imposer une interprétation supplémentaire.
