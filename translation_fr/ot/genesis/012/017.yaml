  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: fr
  text: Mais Yahweh infligea au pharaon et aux gens de sa maison de graves fléaux, à cause de Saraï, la femme d’Abram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Mais Yahweh frappa le pharaon et les gens de sa maison de grands maux, à cause de Saraï, femme d’Abram. » L’hébreu emploie un verbe qui peut signifier « toucher », « frapper » ou « affliger », avec un nom pouvant désigner des coups, des afflictions ou des fléaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: frappa
  rationale: Avec le nom apparenté נְגָעִים, la forme verbale exprime ici l’action d’infliger un mal. « Frappa » conserve l’image hébraïque tout en restant naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: En français, le titre est normalement précédé de l’article défini lorsqu’il désigne le souverain égyptien sans nom propre.
- source_word: נְגָעִים גְּדֹלִים
  choice: de terribles fléaux
  rationale: נְגָעִים peut désigner des coups, des atteintes ou des fléaux; גְּדֹלִים en souligne ici la gravité. « Terribles fléaux » rend cette intensité dans un français naturel et solennel.
- source_word: וְאֶת בֵּיתוֹ
  choice: et les siens
  rationale: בֵּיתוֹ désigne ici la maisonnée du pharaon, c’est-à-dire les personnes de sa maison, plutôt que le bâtiment. « Les siens » est clair et idiomatique.
- source_word: עַל דְּבַר
  choice: à cause de
  rationale: Dans ce contexte, la locution introduit la raison des fléaux.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Saraï, femme d’Abram
  rationale: La construction appositionnelle identifie Saraï comme l’épouse d’Abram; cette relation est essentielle au motif narratif.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin personnel. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée causale de עַל דְּבַר שָׂרַי
  choice: à cause de Saraï
  alternative: au sujet de Saraï
  rationale: Le contexte indique que la situation impliquant Saraï motive l’intervention divine. La formulation conserve la concision et une certaine indétermination du texte quant au mécanisme précis de la faute.
translation_notes:
  register: Français international moderne, digne et narratif. « Les siens » évite l’ambiguïté matérielle de « sa maison », tandis que la note préserve l’éventail lexical de la construction hébraïque.
