  text: לָ/מָ֤ה אָמַ֨רְתָּ֙ אֲחֹ֣תִ/י הִ֔וא וָ/אֶקַּ֥ח אֹתָ֛/הּ לִ֖/י לְ/אִשָּׁ֑ה וְ/עַתָּ֕ה הִנֵּ֥ה אִשְׁתְּ/ךָ֖ קַ֥ח וָ/לֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: fr
  text: 'Pourquoi as-tu dit : « C’est ma sœur », si bien que je l’ai prise pour femme[a] ? Maintenant, voici ta femme. Prends-la et va-t’en !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et je l’ai prise pour moi comme épouse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: Pourquoi as-tu dit
  rationale: Rend directement la question de reproche en français naturel, au passé composé adapté au discours narratif.
- source_word: אֲחֹתִי הִוא
  choice: C’est ma sœur
  rationale: La tournure présentative est la manière la plus naturelle de citer cette affirmation en français moderne.
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: Je l’ai alors prise pour femme
  rationale: « Alors » exprime la conséquence contextuelle sans transformer la coordination hébraïque en proposition de but; « prise pour femme » conserve l’idiome matrimonial et la portée de לִי.
- source_word: וְעַתָּה הִנֵּה אִשְׁתְּךָ
  choice: Maintenant, voici ta femme
  rationale: « Voici » restitue naturellement la force déictique de הִנֵּה, tandis que « maintenant » marque le passage du reproche à l’ordre.
- source_word: קַח וָלֵךְ
  choice: Prends-la et va-t’en
  rationale: L’objet féminin, implicite en hébreu, est requis en français; « va-t’en » rend l’ordre de partir avec sa force, sans ajouter de contenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le lien de conséquence entre la déclaration d’Abram et l’action du pharaon est indiqué par « alors », sans faire du waw une proposition de but. La ponctuation conserve le caractère vif du reproche et de l’ordre.
