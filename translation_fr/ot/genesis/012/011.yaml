  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: fr
  text: 'Comme il était sur le point d’entrer en Égypte, il dit à Saraï, sa femme : « Vois donc, je sais que tu es une belle femme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une femme belle d’apparence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Au moment où
  rationale: La formule narrative introduit ici la circonstance temporelle de la parole d’Abram. Cette tournure française naturelle en conserve la valeur sans reproduire lourdement « Et il arriva que ».
- source_word: הִקְרִיב לָבוֹא
  choice: il allait entrer
  rationale: Le hiphil de קרב suivi de l’infinitif בוא exprime l’imminence de l’entrée; « allait entrer » rend cette proximité de façon idiomatique.
- source_word: מִצְרָיְמָה
  choice: en Égypte
  rationale: La terminaison directionnelle indique un mouvement vers l’Égypte; avec « entrer », le français emploie naturellement « en Égypte ».
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: Saraï, sa femme
  rationale: Conserve l’identification appositionnelle de l’hébreu et la forme traditionnelle moderne du nom propre.
- source_word: הִנֵּה נָא
  choice: Écoute
  rationale: L’association du présentatif et de la particule d’insistance attire ici l’attention de l’interlocutrice. Dans ce dialogue, « Écoute » en restitue naturellement la force, sans archaïsme.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait exprime un état présent de connaissance; « je sais » est direct et naturel.
- source_word: אִשָּׁה יְפַת מַרְאֶה אָתְּ
  choice: tu es une belle femme
  rationale: Cette formulation française naturelle rend le prédicat nominal et l’idée de beauté visible, tandis que la note conserve une traduction plus formelle de יְפַת מַרְאֶה.
