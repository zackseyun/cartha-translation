  terminology: « Yahweh » est cohérent avec le rendu demandé du tétragramme. « Autel à Yahweh » rend correctement la dédicace exprimée par לַיהוָה. « Descendance » et la note préservent la valeur collective, formellement singulière, de זֶרַע sans trancher sa portée.
