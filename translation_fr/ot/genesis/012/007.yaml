  source_fidelity: 'Le sens narratif et la promesse sont correctement rendus : Yahweh apparaît à Abram, promet le territoire à sa descendance, puis Abram construit un autel dédié à Yahweh qui lui est apparu. « Descendance » convient bien au collectif hébreu זֶרַע, avec une note qui signale utilement « semence ». En revanche, « ce pays » peut évoquer plus nettement une entité politique qu’אָרֶץ, tandis que « cette terre » rend plus directement le terme hébreu et conserve le vocabulaire territorial de la promesse.'
