  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: fr
  text: 'Alors Yahweh apparut à Abram et lui dit : « À ta descendance[a], je donnerai cette terre. » Là, Abram bâtit un autel à Yahweh, qui lui était apparu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « semence ». Le mot hébreu est singulier dans sa forme et peut avoir un sens collectif, désignant l’ensemble de la descendance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיֵּרָא
  choice: apparut
  rationale: Le niphal de ראה désigne ici une manifestation perceptible de Yahweh à Abram; « apparut » est naturel et précis en français.
- source_word: לְזַרְעֲךָ
  choice: à ta descendance
  rationale: זֶרַע est singulier dans sa forme, mais peut avoir un sens collectif. « Descendance » rend naturellement cette valeur en français sans réduire la promesse à plusieurs descendants distincts ni à un seul individu.
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: L’inaccompli exprime ici une promesse future.
- source_word: הָאָרֶץ הַזֹּאת
  choice: ce pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire montré à Abram. « Pays » est idiomatique en français et ne suggère pas nécessairement un État politique moderne.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Là, Abram bâtit un autel
  rationale: Cette formulation conserve l’indication de lieu et la progression narrative; la répétition du nom d’Abram évite une légère ambiguïté pronominale en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici la destination ou la dédicace de l’autel.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: qui lui était apparu
  rationale: Le participe défini identifie Yahweh comme celui qui s’était manifesté à Abram; le plus-que-parfait indique naturellement l’antériorité par rapport à la construction de l’autel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le préserve sans lui substituer un titre.
- issue: Portée de זֶרַע dans la promesse
  choice: descendance, avec note « semence »
  alternative: semence; descendants
  rationale: Le terme hébreu est morphologiquement singulier et peut être collectif. Le texte français reste naturel, tandis que la note conserve cette caractéristique et l’ambiguïté potentiellement significative.
translation_notes:
  register: Français international moderne, clair et digne. « Bâtit » maintient un registre narratif biblique accessible; « ce pays » est plus idiomatique que « cette terre » pour le territoire promis. Le nom divin est rendu uniformément par « Yahweh ».
