  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: fr
  text: Les dignitaires de Pharaon la virent et firent son éloge auprès de Pharaon[a], et la femme fut emmenée dans la maison de Pharaon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la recommandèrent à Pharaon » ou « parlèrent d’elle en termes élogieux à Pharaon ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « maison » peut aussi désigner la résidence royale ou la maisonnée de Pharaon, et pas seulement un bâtiment.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: les hauts fonctionnaires de Pharaon
  rationale: Dans ce contexte de cour, שָׂרִים désigne des dignitaires ou responsables de haut rang. « Hauts fonctionnaires » est naturel en français moderne et n’implique pas qu’ils soient des fils de roi.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: firent son éloge auprès de Pharaon
  rationale: Le piel de הלל signifie ici louer ou vanter quelqu’un. Cette formulation exprime qu’ils parlèrent d’elle favorablement à Pharaon sans préciser davantage leur intention.
- source_word: וַתֻּקַּח
  choice: fut emmenée
  rationale: Le passif français conserve l’absence d’agent explicite et la passivité de la femme. « Emmenée » convient naturellement au déplacement vers la résidence royale.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: Le texte hébreu dit littéralement « la femme ». Cette traduction évite d’introduire ici « l’épouse », bien que le contexte identifie Saraï comme la femme d’Abram.
- source_word: בֵּית פַּרְעֹה
  choice: dans la maison de Pharaon
  rationale: בַּיִת peut désigner une maison, une résidence ou une maisonnée. Le rendu littéral garde cette amplitude plutôt que d’imposer « palais » ou « harem ».
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: la virent
  rationale: ראה est le verbe courant signifiant « voir » ; le passé simple convient au registre narratif biblique français.
