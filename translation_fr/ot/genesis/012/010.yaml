id: GEN.12.10
reference: Genesis 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨רֶד אַבְרָ֤ם מִצְרַ֨יְמָ/ה֙ לָ/ג֣וּר שָׁ֔ם כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: fr
  text: Il y eut une famine dans le pays, et Abram descendit en Égypte pour y séjourner[a], car la famine était sévère dans le pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour y résider temporairement comme étranger ».
    reason: Cette formulation explicite les nuances de résidence provisoire et de statut d’étranger que peut porter le verbe hébreu גור.
lexical_decisions:
- source_word: וַיְהִי
  choice: Il y eut
  rationale: Cette tournure introduit naturellement en français un nouveau développement du récit, sans ajouter un marqueur temporel absent de l’hébreu.
- source_word: רָעָב
  choice: une famine
  rationale: Le nom désigne une pénurie générale de nourriture, et non la faim ressentie par un individu.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ renvoie ici au territoire où se trouve Abram, non à la terre entière. La répétition finale est conservée comme en hébreu.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe ירד signifie « descendre » et correspond à la manière biblique habituelle de décrire un déplacement vers l’Égypte.
- source_word: מִצְרַיְמָה
  choice: en Égypte
  rationale: La terminaison directionnelle exprime un mouvement vers l’Égypte; « en Égypte » est la formulation française naturelle après « descendre ».
- source_word: לָגוּר
  choice: pour y séjourner
  rationale: גור exprime le fait de résider quelque temps dans un lieu où l’on est étranger. « Séjourner » préserve l’idée de résidence temporaire dans un registre actuel et digne.
- source_word: שָׁם
  choice: y
  rationale: Le pronom adverbial « y » reprend naturellement l’Égypte et traduit le locatif « là » sans lourdeur.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du départ d’Abram. « Car » convient au registre narratif tout en exprimant clairement le rapport causal.
- source_word: כָבֵד
  choice: sévère
  rationale: L’adjectif signifie littéralement « lourd », mais qualifie ici l’intensité de la famine; « sévère » rend naturellement cet emploi idiomatique.
- source_word: הָרָעָב
  choice: la famine
  rationale: L’article défini renvoie à la famine qui vient d’être introduite.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique écrit. La répétition de « dans le pays » est maintenue afin de respecter la structure et l’insistance du texte hébreu.
