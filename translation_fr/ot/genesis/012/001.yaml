  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: fr
  text: 'Yahweh dit à Abram : « Pars de ton pays, de ta parenté et de la maison de ton père, vers le pays que je te montrerai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ־לְךָ
  choice: Pars
  rationale: L’impératif idiomatique exprime ici un départ résolu. « Pars » est naturel en français et conserve la force de l’ordre sans surtraduire le pronom réfléchi.
- source_word: מֵאַרְצְךָ
  choice: de ton pays
  rationale: אֶרֶץ désigne ici le territoire ou pays d’origine d’Abram; « pays » convient mieux que « terre » dans cette énumération sociale et géographique.
- source_word: מִמּוֹלַדְתְּךָ
  choice: de ta parenté
  rationale: מוֹלֶדֶת peut renvoyer au milieu natal ou au clan. « Parenté » préserve ici la dimension familiale entre le pays et la maison paternelle.
- source_word: מִבֵּית אָבִיךָ
  choice: de la maison de ton père
  rationale: Rendu formel de l’expression désignant la maisonnée paternelle, sans la réduire au seul bâtiment.
- source_word: אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  choice: vers le pays que je te montrerai
  rationale: Le mouvement vers une destination encore non précisée est conservé, ainsi que la promesse divine de la faire voir à Abram.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu porte explicitement le tétragramme; sa translittération distingue le nom divin d’un titre comme « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: La translittération représente le nom propre présent dans le texte source sans le remplacer par un titre traditionnel.
- issue: Portée de לֶךְ־לְךָ
  choice: Pars
  alternative: Va-t’en / Va pour toi
  rationale: « Pars » transmet l’ordre de quitter le lieu d’origine. Les autres solutions risqueraient d’ajouter une nuance de rejet ou de bénéfice personnel que le contexte ne tranche pas explicitement.
translation_notes:
  register: Français international moderne, sobre et dignifié. L’énumération progressive — pays, parenté, maison du père — est maintenue, de même que l’indétermination de la destination.
