  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: fr
  text: Abram traversa le pays jusqu’au site de Sichem, jusqu’au grand arbre de Moré[a]. Les Cananéens étaient alors dans le pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au chêne de Moré » ou « au térébinthe de Moré ». Le mot hébreu désigne un grand arbre, mais l’espèce exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le singulier, « le Cananéen », avec un sens collectif.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: traversa
  rationale: Le verbe עבר au wayyiqtol décrit le déplacement d’Abram à travers le pays. « Traverser » restitue cette progression sans préciser indûment l’itinéraire ni le mode de déplacement.
- source_word: בָּאָרֶץ
  choice: le pays
  rationale: Avec l’article, l’expression désigne le territoire dont il est question, ici Canaan. « Le pays » est naturel en français et convient aussi à la reprise finale.
- source_word: עַד
  choice: jusqu’à
  rationale: La préposition, répétée deux fois, marque le point atteint par Abram. La répétition de « jusqu’à » reproduit la structure et l’insistance de l’hébreu.
- source_word: מְקוֹם שְׁכֶם
  choice: le site de Sichem
  rationale: « Site » rend מקום tout en évitant de présupposer que Sichem était déjà une ville pleinement développée à ce stade du récit.
- source_word: אֵלוֹן מוֹרֶה
  choice: le grand arbre de Moré
  rationale: אֵלוֹן désigne un arbre imposant, mais son espèce exacte est incertaine. « Grand arbre » conserve cette indétermination dans le texte principal; les traductions traditionnelles sont signalées en note.
- source_word: מוֹרֶה
  choice: Moré
  rationale: Le terme est compris ici comme un nom propre associé à l’arbre. Sa translittération évite d’imposer le sens incertain de « maître » ou « devin ».
- source_word: וְהַכְּנַעֲנִי
  choice: Les Cananéens
  rationale: Le nom ethnique hébreu est au singulier avec l’article, mais il a ici une valeur collective. Le pluriel exprime naturellement cette valeur en français.
- source_word: אָז
  choice: alors
  rationale: L’adverbe situe la présence cananéenne au moment du passage d’Abram.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: La répétition de l’expression hébraïque est conservée afin de maintenir la cohésion et l’accent territorial du verset.
theological_decisions:
- issue: Nombre du nom ethnique וְהַכְּנַעֲנִי
  choice: 'pluriel collectif : « Les Cananéens étaient alors dans le pays »'
  alternative: 'singulier formel : « Le Cananéen était alors dans le pays »'
  rationale: L’hébreu emploie un singulier ethnique collectif. En français moderne, le pluriel communique plus clairement qu’il s’agit du peuple cananéen, tandis qu’une note préserve la forme grammaticale de la source.
- issue: Identification botanique de אֵלוֹן
  choice: 'terme générique : « grand arbre »'
  alternative: « chêne » ou « térébinthe »
  rationale: L’espèce précise n’est pas assurée. Le rendu générique maintient l’ambiguïté lexicale du texte hébreu au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; le vocabulaire reste courant. « Grand arbre » préserve l’incertitude botanique, et le pluriel « les Cananéens » rend clairement en français la valeur collective du singulier hébreu.
