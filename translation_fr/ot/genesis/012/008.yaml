  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: fr
  text: De là, il se déplaça vers la région montagneuse, à l’est de Béthel, et y dressa sa tente, Béthel à l’ouest et Aï à l’est. Là, il bâtit un autel pour Yahweh et invoqua le nom de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « proclama le nom de Yahweh ». L’expression hébraïque peut désigner le fait d’invoquer Yahweh dans le culte ou de proclamer publiquement son nom.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: il se déplaça
  rationale: Le verbe exprime le déplacement d’un lieu à un autre; cette formulation est naturelle en français et convient au récit.
- source_word: הָהָרָה
  choice: vers la région montagneuse
  rationale: Le suffixe directionnel indique un mouvement vers la zone de collines; « région montagneuse » rend ici le relief plutôt qu’une montagne précise.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: à l’est de Béthel
  rationale: קֶדֶם a ici une valeur géographique et situe le lieu par rapport à Béthel.
- source_word: וַיֵּט אָהֳלֹה
  choice: et dressa sa tente
  rationale: Équivalent français idiomatique de l’expression hébraïque désignant l’installation d’une tente.
- source_word: מִיָּם
  choice: à l’ouest
  rationale: Bien que יָם signifie littéralement « mer », il désigne couramment l’ouest dans les indications géographiques bibliques.
- source_word: וְהָעַי מִקֶּדֶם
  choice: et Aï à l’est
  rationale: La formulation parallèle situe clairement le camp entre Béthel et Aï.
- source_word: מִזְבֵּחַ
  choice: un autel
  rationale: Terme français usuel pour la structure destinée au sacrifice ou au culte.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition indique le destinataire de l’autel, et le nom divin est translittéré afin de représenter directement יהוה.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: et invoqua le nom de Yahweh
  rationale: La locution peut désigner l’invocation cultuelle tout en permettant aussi l’idée d’une proclamation; l’ambiguïté est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: La translittération « Yahweh » représente le nom propre de l’alliance sans le remplacer par un titre; elle suit également la couche de consultation fournie.
- issue: Sens de וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: invoqua le nom de Yahweh
  alternative: proclama le nom de Yahweh
  rationale: Dans ce contexte d’autel et de culte, l’invocation est le sens immédiat le plus probable, mais l’hébreu peut aussi exprimer une proclamation publique; la note conserve cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. Les toponymes traditionnels « Béthel » et « Aï » sont conservés. La géographie est formulée naturellement sans effacer les indications directionnelles de l’hébreu.
