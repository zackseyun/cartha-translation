  to: Il traita bien Abram à cause d’elle[a], et Abram en vint à posséder du petit bétail, du gros bétail, des ânes, des hommes esclaves, des femmes esclaves, des ânesses et des chameaux.
  rationale: La révision rend explicitement la distinction masculine/féminine présente dans les deux termes hébreux désignant les personnes esclaves, sans changer le sens ni atténuer leur statut. La note est resserrée afin d’exposer les deux nuances possibles de l’expression hébraïque sans imposer l’une d’elles.
