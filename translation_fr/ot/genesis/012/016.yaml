base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: fr
  text: Il traita bien Abram à cause d’elle[a], et Abram en vint à posséder du petit bétail, du gros bétail, des ânes, des hommes esclaves, des femmes esclaves, des ânesses et des chameaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour elle » ou « en sa faveur ». L’expression hébraïque peut désigner soit la cause du traitement accordé à Abram, soit l’action accomplie pour elle.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: traita bien
  rationale: Le hifil de יטב signifie ici faire du bien à quelqu’un ou le traiter favorablement. « Traita bien » est naturel et conserve la relation personnelle avec Abram.
- source_word: בַּעֲבוּרָהּ
  choice: à cause d’elle
  rationale: L’expression indique la cause ou l’occasion du traitement favorable. « À cause d’elle » reste neutre quant à l’intention et évite de suggérer nécessairement que l’action visait son bien.
- source_word: וַיְהִי לוֹ
  choice: Abram en vint à posséder
  rationale: L’idiome exprime ici une possession qui résulte du traitement favorable. Cette formulation rend mieux cette progression que le simple « il avait ».
- source_word: צֹאן
  choice: petit bétail
  rationale: Le nom collectif peut englober les moutons et les chèvres. « Petit bétail » préserve cette portée sans réduire arbitrairement le terme aux seuls moutons.
- source_word: בָקָר
  choice: gros bétail
  rationale: Ce collectif désigne les bovins. « Gros bétail » forme en français un parallèle naturel avec « petit bétail ».
- source_word: חֲמֹרִים
  choice: ânes
  rationale: Le pluriel masculin désigne des ânes mâles; le contraste avec « ânesses » plus loin dans la liste rend la distinction sexuelle perceptible en français.
- source_word: עֲבָדִים
  choice: esclaves
  rationale: Dans cette liste de biens, le statut de dépendance et de propriété est saillant. « Esclaves » est historiquement et lexicalement plus précis que « serviteurs ».
- source_word: שְׁפָחֹת
  choice: femmes esclaves
  rationale: Le féminin pluriel désigne des femmes en condition servile. « Femmes esclaves » conserve à la fois leur sexe et leur statut, sans employer un terme archaïque ou atténué.
- source_word: אֲתֹנֹת
  choice: ânesses
  rationale: Le nom désigne explicitement des ânes femelles. « Ânesses » est le terme français direct et préserve le contraste avec les ânes mâles.
- source_word: גְמַלִּים
  choice: chameaux
  rationale: Équivalent français courant du nom hébreu pluriel.
