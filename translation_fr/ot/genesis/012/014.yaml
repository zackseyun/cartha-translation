  text: וַ/יְהִ֕י כְּ/ב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָ/ה וַ/יִּרְא֤וּ הַ/מִּצְרִים֙ אֶת הָ֣/אִשָּׁ֔ה כִּֽי יָפָ֥ה הִ֖וא מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/014.yaml
  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: fr
  text: Quand Abram entra en Égypte, les Égyptiens virent que la femme[a] était très belle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épouse ». Le mot hébreu אִשָּׁה peut signifier « femme » ou « épouse »; la traduction retient ici le terme le plus général.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: Quand … entra
  rationale: La construction narrative avec היה et l’infinitif précédé de כ exprime ici la circonstance temporelle. « Quand … entra » est naturel en français et évite le calque lourd « Il arriva que, lorsque ».
- source_word: מִצְרָיְמָה
  choice: en Égypte
  rationale: Le ה directionnel indique le mouvement vers l’Égypte; avec « entrer », le français l’exprime naturellement par « entrer en Égypte ».
- source_word: וַיִּרְאוּ
  choice: virent
  rationale: ראה signifie directement « voir »; « remarquèrent » serait possible en contexte, mais ajouterait une nuance interprétative.
- source_word: הַמִּצְרִים
  choice: les Égyptiens
  rationale: Il s’agit du gentilé défini au pluriel.
- source_word: הָאִשָּׁה
  choice: la femme
  rationale: אִשָּׁה peut désigner une femme ou une épouse. « La femme » conserve ici la formulation générale de l’hébreu sans expliciter le lien conjugal dans cette proposition.
- source_word: כִּי
  choice: que
  rationale: 'כִּי introduit le contenu de leur perception: ils virent qu’elle était très belle.'
- source_word: יָפָה הִוא מְאֹד
  choice: était très belle
  rationale: Cette formulation française rend naturellement l’adjectif יָפָה, le pronom sujet הִוא et l’intensif מְאֹד.
