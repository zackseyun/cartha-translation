  text: וַ/יִּסַּ֣ע אַבְרָ֔ם הָל֥וֹךְ וְ/נָס֖וֹעַ הַ/נֶּֽגְבָּ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
translation:
  language: fr
  text: Abram poursuivit sa route, se dirigeant vers le Néguev.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers le sud ». Le terme hébreu peut désigner soit la région méridionale appelée le Néguev, soit la direction du sud ; ici, le sens régional est vraisemblable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: poursuivit sa route
  rationale: Le qal wayyiqtol de נסע décrit ici le départ et la progression du voyage. « Poursuivit sa route » exprime naturellement la continuité narrative sans préciser indûment le démontage du camp.
- source_word: אַבְרָם
  choice: Abram
  rationale: Translittération française usuelle du nom propre à ce stade du récit.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: se dirigeant
  rationale: Cette construction à infinitifs absolus donne au déplacement une valeur progressive et continue. « Se dirigeant » conserve cette progression en français naturel, sans ajouter l’idée plus précise d’étapes.
- source_word: הַנֶּגְבָּה
  choice: vers le Néguev
  rationale: Le nom avec article et hé directionnel désigne vraisemblablement ici la région méridionale du Néguev, tout en marquant la direction. « Vers le Néguev » rend ces deux éléments.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation évite le calque peu naturel « allant et voyageant » ainsi que « par étapes », qui expliciterait davantage que l’hébreu. Le marqueur [a] figure immédiatement après le terme concerné.
