  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: fr
  text: 'Quand les Égyptiens te verront, ils diront : « C’est sa femme. » Alors ils me tueront, mais toi, ils te laisseront en vie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils te garderont en vie » ou « ils t’épargneront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Quand
  rationale: Cette tournure introduit ici la situation future qu’Abram anticipe. « Quand » en restitue naturellement la valeur temporelle en français, sans la lourdeur de « Il arrivera que, lorsque ».
- source_word: יִרְאוּ אֹתָךְ
  choice: te verront
  rationale: ראה désigne ici simplement le fait de voir ; le futur convient à la situation anticipée.
- source_word: הַמִּצְרִים
  choice: les Égyptiens
  rationale: Désignation nationale ordinaire, avec l’article défini du texte hébreu.
- source_word: וְאָמְרוּ
  choice: ils diront
  rationale: Traduction directe du verbe de parole, sans ajouter l’idée de penser ou de se dire à soi-même.
- source_word: אִשְׁתּוֹ זֹאת
  choice: C’est sa femme
  rationale: Cette formulation française naturelle conserve la valeur d’identification du démonstratif זֹאת dans la proposition nominale hébraïque.
- source_word: וְהָרְגוּ אֹתִי
  choice: Alors ils me tueront
  rationale: הרג signifie directement « tuer ». « Alors » rend naturellement la progression envisagée, sans modifier le rapport logique essentiel.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: mais toi, ils te laisseront en vie
  rationale: Le hifil de חיה signifie « maintenir en vie, laisser vivre ». « Mais » exprime le contraste contextuel entre le sort d’Abram et celui de Sara, tandis que la dislocation « mais toi » reflète la mise en relief de אֹתָךְ.
