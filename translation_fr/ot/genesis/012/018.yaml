base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: fr
  text: 'Alors le pharaon appela Abram et lui dit : « Qu’est-ce que tu m’as fait là ? Pourquoi ne m’as-tu pas dit qu’elle est ta femme ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: appela
  rationale: Avec לְ suivi d’une personne, קרא signifie ici appeler ou faire venir. « Appela » reste proche de l’hébreu et convient au récit sans renforcer inutilement en « convoqua ».
- source_word: פַרְעֹה
  choice: le pharaon
  rationale: Le titre royal est rendu par sa forme française usuelle, avec l’article naturel en français.
- source_word: לְאַבְרָם
  choice: Abram
  rationale: Le nom propre est translittéré selon l’usage français biblique courant.
- source_word: וַיֹּאמֶר
  choice: lui dit
  rationale: אמר est le verbe narratif ordinaire « dire ». Le pronom « lui » explicite naturellement en français le destinataire déjà marqué par le contexte.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: Qu’est-ce que tu m’as fait là ?
  rationale: Cette tournure française naturelle conserve la force démonstrative et indignée de מַה זֹּאת, tandis que le passé composé exprime les conséquences présentes de l’acte accompli.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: Pourquoi ne m’as-tu pas dit
  rationale: נגד au hiphil signifie faire savoir ou dire. L’inversion interrogative donne au reproche un registre digne et courant.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce qu’Abram n’a pas révélé.
- source_word: אִשְׁתְּךָ הִוא
  choice: elle était ta femme
  rationale: La proposition nominale hébraïque ne marque pas grammaticalement le temps. Dans la question française au passé, l’imparfait respecte la concordance naturelle sans nier qu’elle demeure sa femme.
theological_decisions:
- issue: Temps de la proposition אִשְׁתְּךָ הִוא
  choice: elle était ta femme
  alternative: elle est ta femme
  rationale: L’hébreu laisse le temps implicite. Le français idiomatique après « ne m’as-tu pas dit » appelle ici l’imparfait dans le discours indirect; ce choix est temporel et stylistique, non théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement rend l’adresse directe singulière de l’hébreu et convient à la vive réprimande. « Là » restitue idiomatiquement la nuance démonstrative de מַה זֹּאת.
