  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: fr
  text: Dis, je t’en prie, que tu es ma sœur, afin que, grâce à toi, tout se passe bien pour moi et que j’aie la vie sauve à cause de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et que ma vie vive à cause de toi ». Le mot hébreu נפשׁ (nefesh), rendu ici par « vie », désigne dans ce contexte la vie ou la personne elle-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Dis, je t’en prie
  rationale: L’impératif féminin singulier accompagné de נָא exprime ici une demande pressante et adoucie. Cette tournure est naturelle et digne en français moderne.
- source_word: אֲחֹתִי אָתְּ
  choice: que tu es ma sœur
  rationale: Après « dis », le français introduit naturellement le contenu de la déclaration par « que ». « Ma sœur » rend directement אֲחֹתִי.
- source_word: לְמַעַן
  choice: afin que
  rationale: La locution marque le but recherché par Abram; « afin que » en conserve clairement la valeur finale.
- source_word: יִיטַב לִי
  choice: tout se passe bien pour moi
  rationale: Cette formulation idiomatique garde le sens large de « bien aller pour moi » sans préciser indûment la forme du traitement favorable attendu.
- source_word: בַעֲבוּרֵךְ
  choice: grâce à toi
  rationale: Dans la première proposition, l’expression indique que Sara sera la cause du sort favorable espéré. « Grâce à toi » convient à ce résultat positif.
- source_word: וְחָיְתָה נַפְשִׁי
  choice: et que j’aie la vie sauve
  rationale: Littéralement, « et que ma נפש vive ». Ici נֶפֶשׁ désigne la vie ou la personne d’Abram; l’expression française transmet naturellement l’idée qu’il échappera à la mort.
- source_word: בִּגְלָלֵךְ
  choice: à cause de toi
  rationale: Cette seconde expression causale, proche de בַעֲבוּרֵךְ, est conservée plutôt qu’effacée, avec une formulation française distincte.
theological_decisions: []
