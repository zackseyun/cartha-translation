id: GEN.12.3
reference: Genesis 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: fr
  text: Je bénirai ceux qui te bénissent, et je maudirai celui qui te méprise[a] ; en toi, toutes les familles de la terre seront bénies[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui te traite avec mépris », « celui qui te déshonore » ou « celui qui te maudit ». Le verbe hébreu employé pour l’action humaine peut être moins fort que celui traduit ensuite par « je maudirai ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par toi, toutes les familles de la terre se béniront » ; autre possibilité : « par ton intermédiaire, toutes les familles de la terre seront bénies ». La forme hébraïque peut être comprise au passif ou dans un sens réfléchi ou moyen, et la préposition peut aussi marquer le moyen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: Je bénirai
  rationale: Le qal à la première personne exprime ici la promesse divine ; le futur français la rend naturellement.
- source_word: מְבָרְכֶיךָ
  choice: ceux qui te bénissent
  rationale: Le participe pluriel substantivé désigne une catégorie de personnes et conserve le contraste avec le participe singulier qui suit.
- source_word: וּמְקַלֶּלְךָ
  choice: celui qui te méprise
  rationale: Le verbe קלל peut exprimer le fait de tenir quelqu’un pour peu de chose, de le déshonorer ou de le maudire. « Méprise » reste naturel en français et maintient une distinction avec le verbe plus fort ארר.
- source_word: אָאֹר
  choice: je maudirai
  rationale: Le verbe ארר désigne clairement l’action de maudire et marque une réponse divine plus forte.
- source_word: וְנִבְרְכוּ
  choice: seront bénies
  rationale: Le niphal se prête naturellement à une lecture passive, sans exclure la lecture réfléchie ou moyenne signalée en note.
- source_word: בְּךָ
  choice: en toi
  rationale: Cette traduction directe de la préposition ב préserve la formulation et son ambiguïté entre sphère et moyen.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: toutes les familles de la terre
  rationale: « Familles » rend le sens de groupes familiaux ou clans dans une langue accessible ; « terre » convient à la portée universelle de la promesse.
theological_decisions:
- issue: Sens de la formule וְנִבְרְכוּ בְךָ
  choice: 'lecture passive : « en toi… seront bénies »'
  alternative: 'lecture réfléchie ou moyenne : « se béniront par toi / prendront ton nom comme formule de bénédiction », ou nuance instrumentale : « par ton intermédiaire… seront bénies »'
  rationale: Le niphal et la préposition permettent plusieurs analyses. Le texte principal conserve la lecture passive la plus directe, tandis que la note maintient ouvertes les autres possibilités sans imposer une conclusion doctrinale.
translation_notes:
  register: Français international actuel, digne et fluide. La structure conserve le contraste entre le pluriel « ceux qui » et le singulier « celui qui », ainsi que la différence de force entre les deux verbes hébreux liés à la malédiction.
