    rationale: Le possessif « ses » n’apparaît pas dans l’hébreu et tend à identifier les hommes comme les serviteurs ou agents personnels de Pharaon, rôle que le texte ne définit pas.
  - severity: high
    issue: « hors du pays »
    rationale: Cette précision géographique n’est pas présente en Genèse 12.20. Le contexte peut l’évoquer, mais la traduction ne doit pas l’intégrer au texte du verset.
  - severity: medium
    issue: « ils le reconduisirent »
    rationale: « Reconduire » implique couramment l’idée d’escorter ou d’accompagner. וַיְשַׁלְּחוּ indique plus sobrement qu’ils le renvoyèrent ou l’envoyèrent.
