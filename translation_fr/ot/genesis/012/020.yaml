  verdict: revise
  source_fidelity: La mention ajoutée « ses hommes » introduit une relation de possession ou de service que l’hébreu אַנָשִׁים (« des hommes ») ne précise pas. Surtout, « hors du pays » n’est pas exprimé dans ce verset. Le verbe וַיְשַׁלְּחוּ signifie ici « renvoyer / envoyer »; « reconduire » peut suggérer un accompagnement absent du texte.
  naturalness: « Donner à des hommes des ordres le concernant » est un français moderne et clair. « Le renvoyèrent avec sa femme et tout ce qui lui appartenait » rend naturellement la série d’objets coordonnés de l’hébreu sans ajouter de détail narratif.
  terminology: « Pharaon », « femme » et « tout ce qui lui appartenait » conviennent. Le maintien de « des hommes » préserve la formulation non spécifiée du texte source.
