  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: fr
  text: Alors le pharaon donna à des hommes des ordres le concernant[a], et ils le renvoyèrent[b] avec sa femme et tout ce qui lui appartenait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le pharaon donna à des hommes des ordres à son sujet ». Le texte ne précise pas quelle fonction ces hommes exerçaient.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils l’envoyèrent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים
  choice: le pharaon donna à ses hommes des ordres à son sujet
  rationale: צוה signifie « ordonner, donner des ordres » et על peut ici introduire la personne concernée. « Ses hommes » reste naturel en français tout en évitant de préciser s’il s’agissait de serviteurs, de gardes ou d’autres agents.
- source_word: וַיְשַׁלְּחוּ אֹתוֹ
  choice: ils le reconduisirent hors du pays
  rationale: Le piel de שלח peut signifier « renvoyer, faire partir ». Dans ce contexte, le pharaon charge des hommes de faire partir Abram; la formulation française exprime cette évacuation encadrée sans affirmer les modalités exactes.
- source_word: וְאֶת אִשְׁתּוֹ
  choice: avec sa femme
  rationale: אשה avec suffixe possessif désigne ici sans ambiguïté l’épouse d’Abram.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: et tout ce qui lui appartenait
  rationale: La locution désigne l’ensemble de ce qu’Abram possédait; cette formulation garde la portée générale de l’hébreu.
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Titre royal rendu selon l’usage français courant, avec article défini.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Reconduisirent hors du pays » convient au contexte immédiat, où le pharaon ordonne le départ d’Abram, tandis que la note conserve la formulation plus littérale et son ambiguïté quant aux modalités.
