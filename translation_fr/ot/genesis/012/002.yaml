  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: fr
  text: Je ferai de toi une grande nation, je te bénirai et je rendrai ton nom grand ; sois une bénédiction[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu seras une bénédiction ». La forme hébraïque est un impératif (« sois »), mais certains la comprennent ici comme exprimant le résultat des promesses de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: Je ferai de toi une grande nation
  rationale: La construction « faire de quelqu’un » rend naturellement עשה avec le complément introduit par לְ, tandis que « grande nation » conserve le sens courant de גּוֹי גָּדוֹל dans la promesse patriarcale.
- source_word: וַאֲבָרֶכְךָ
  choice: je te bénirai
  rationale: Le piel de ברך signifie directement « bénir » ; le pronom « te » maintient le caractère personnel de la promesse.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: je rendrai ton nom grand
  rationale: Cette formulation conserve « nom » pour שֵׁם et l’idée causative de גדל, sans réduire le sens à la seule réputation.
- source_word: וֶהְיֵה בְּרָכָה
  choice: sois une bénédiction
  rationale: וֶהְיֵה est un impératif masculin singulier de היה. « Sois » en préserve la force grammaticale, et l’article indéfini rend naturellement le nom singulier בְּרָכָה.
theological_decisions:
- issue: Valeur de וֶהְיֵה בְּרָכָה
  choice: 'Lecture impérative : « sois une bénédiction »'
  alternative: 'Lecture résultative ou prédictive : « tu seras une bénédiction »'
  rationale: La forme hébraïque est impérative, ce que retient le texte principal. Comme la proposition se trouve au sein d’une série de promesses divines, la lecture résultative demeure possible et est signalée en note afin de préserver la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le point-virgule marque le passage rhétorique des promesses divines à l’impératif adressé à Abram, tout en maintenant l’unité de la phrase.
