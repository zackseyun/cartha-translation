  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: fr
  text: Abram partit, comme Yahweh le lui avait dit, et Lot partit avec lui. Abram avait soixante-quinze ans lorsqu’il quitta Harân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: partit
  rationale: Le wayyiqtol de הלך exprime ici le déplacement d’Abram en réponse à l’appel précédent. « Partit » est naturel en français et convient au contexte d’un départ, sans surcharger le verbe.
- source_word: כַּאֲשֶׁר
  choice: comme
  rationale: La conjonction marque la conformité entre l’action d’Abram et la parole de Yahweh. « Comme » rend cette relation clairement et naturellement.
- source_word: דִּבֶּר אֵלָיו
  choice: le lui avait dit
  rationale: Le plus-que-parfait explicite l’antériorité de la parole divine. En français courant, « dire » est plus idiomatique ici que « parler », tout en conservant le sens contextuel de דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אִתּוֹ
  choice: avec lui
  rationale: Rendu direct, concis et idiomatique de la préposition accompagnée du suffixe pronominal.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: avait soixante-quinze ans
  rationale: L’idiome hébreu littéralement construit avec « fils de » est rendu selon l’expression française normale de l’âge.
- source_word: בְּצֵאתוֹ
  choice: lorsqu’il quitta
  rationale: L’infinitif construit avec ב situe temporellement la sortie. « Lorsqu’il quitta » est fluide et associe naturellement le verbe au lieu d’origine.
- source_word: מֵחָרָן
  choice: Harrân
  rationale: Le nom de lieu est translittéré selon une forme française qui signale les deux consonnes hébraïques distinctes ח et ר sans prétendre reproduire exactement la phonétique ancienne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. La translittération « Yahweh » préserve le caractère de nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste simple et accessible. « Donc » relie explicitement ce verset à l’ordre divin précédent, valeur discursive naturelle du וַ initial dans ce contexte.
