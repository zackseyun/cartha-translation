  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: fr
  text: Abram prit avec lui Saraï, sa femme, Lot, le fils de son frère, tous les biens qu’ils avaient acquis et les personnes qu’ils avaient rassemblées à Harrân[a]. Ils partirent pour se rendre au pays de Canaan, et ils arrivèrent au pays de Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’âme qu’ils avaient faite ». Cette expression hébraïque désigne probablement les personnes intégrées à leur maisonnée à Harrân; on peut aussi traduire : « les personnes qu’ils avaient acquises ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit avec lui
  rationale: Dans ce récit de départ, le verbe signifie qu’Abram emmène les personnes et les biens énumérés. « Prit avec lui » exprime naturellement ce sens en français.
- source_word: אִשְׁתּוֹ
  choice: sa femme
  rationale: Dans ce contexte conjugal, אִשָּׁה avec suffixe désigne clairement l’épouse.
- source_word: בֶּן אָחִיו
  choice: le fils de son frère
  rationale: Cette formulation conserve explicitement le lien de parenté exprimé en hébreu, plutôt que de le condenser en « neveu ».
- source_word: רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: les biens qu’ils avaient acquis
  rationale: רְכוּשׁ désigne les possessions ou biens, et רכשׁ leur acquisition. La formulation française est précise et naturelle.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: les personnes qu’ils avaient rassemblées
  rationale: נֶפֶשׁ est ici un collectif désignant des personnes. « Rassemblées » rend prudemment l’emploi idiomatique de עשה sans suggérer qu’elles auraient été créées; la formulation littérale et l’autre possibilité lexicale sont signalées en note.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: ils partirent pour se rendre
  rationale: Cette tournure rend à la fois le départ et le but du déplacement sans reproduire lourdement le pléonasme hébreu.
- source_word: אַרְצָה כְּנַעַן
  choice: au pays de Canaan
  rationale: Le suffixe directionnel de אַרְצָה et le nom propre indiquent le mouvement vers le pays de Canaan.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: ils arrivèrent au pays de Canaan
  rationale: « Arrivèrent » convient au terme du déplacement, tandis que la répétition de « pays de Canaan » préserve celle du texte hébreu.
theological_decisions:
- issue: Sens de « les personnes qu’ils avaient faites/acquises »
  choice: les personnes qu’ils avaient rassemblées
  alternative: les personnes qu’ils avaient acquises; littéralement, l’âme qu’ils avaient faite
  rationale: L’expression peut évoquer les membres d’une maisonnée obtenus ou réunis à Harrân. La traduction principale évite de trancher leur statut précis, tandis que la note conserve l’étrangeté et l’ambiguïté de l’hébreu.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe narrative reste fluide, le lien de parenté est formulé explicitement et la répétition finale du pays de Canaan est conservée.
