base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: fr
  text: Laban rejoignit Jacob[a]. Jacob avait dressé sa tente dans la région montagneuse[b], et Laban dressa son camp avec les siens[c] dans la région montagneuse de Galaad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rattrapa Jacob ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur la montagne » ; à la fin du verset : « sur le mont Galaad » ou « dans les montagnes de Galaad ».'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « ses frères » ; il s’agit vraisemblablement ici de ses parents ou des membres de son clan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: rejoignit
  rationale: Dans le contexte d’une poursuite, נשׂג signifie atteindre ou rattraper. « Rejoignit » exprime ici le fait que Laban parvient jusqu’à Jacob sans suggérer nécessairement qu’il le capture.
- source_word: תָּקַע ... אָהֳלוֹ
  choice: avait dressé sa tente
  rationale: L’expression idiomatique désigne l’installation d’une tente. Le plus-que-parfait indique naturellement que Jacob était déjà installé lorsque Laban le rejoignit.
- source_word: בָּהָר
  choice: dans la région montagneuse
  rationale: הַר peut désigner une montagne précise ou une contrée montagneuse. Le contexte géographique favorise ici le sens régional, tout en conservant l’autre possibilité en note.
- source_word: תָּקַע אֶת אֶחָיו
  choice: dressa son camp avec les siens
  rationale: 'La formulation hébraïque est elliptique : le verbe reprend l’idée de camper, tandis que « ses frères » désigne le groupe accompagnant Laban. « Dressa son camp » restitue l’action sans ajouter explicitement plusieurs tentes.'
- source_word: אֶחָיו
  choice: les siens
  rationale: Littéralement « ses frères », le terme peut englober des parents ou des membres du clan. « Les siens » reste naturel et suffisamment large en français.
- source_word: בְּהַר הַגִּלְעָד
  choice: dans la région montagneuse de Galaad
  rationale: Le groupe nominal peut être compris comme « sur le mont Galaad » ou comme désignant les montagnes, c’est-à-dire la région montagneuse, de Galaad. Le contexte favorise cette dernière lecture.
