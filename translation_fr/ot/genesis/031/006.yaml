  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: fr
  text: Et vous savez vous-mêmes que j’ai servi votre père de toutes mes forces[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai travaillé pour votre père ». Le verbe hébreu peut signifier « servir » ou « travailler » ; les deux sens conviennent aux années de labeur de Jacob auprès de Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  choice: Vous savez vous-mêmes
  rationale: Le pronom indépendant féminin pluriel renforce l’adresse à Rachel et Léa. En français, « vous-mêmes » restitue cette insistance; le וְ de liaison n’a pas besoin d’être rendu séparément dans ce verset isolé.
- source_word: יְדַעְתֶּן
  choice: savez
  rationale: Le parfait qal exprime ici un état de connaissance acquis et actuel; le présent français est naturel.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce que Rachel et Léa savent.
- source_word: בְּ/כָל כֹּחִי
  choice: de toutes mes forces
  rationale: Cette expression française courante rend l’idée d’un engagement de toute la capacité physique et personnelle de Jacob.
- source_word: עָבַדְתִּי
  choice: j’ai servi
  rationale: Le verbe עבד peut signifier « servir » ou « travailler ». « Servi » conserve la relation personnelle avec Laban sans exclure le travail accompli.
- source_word: אֶת אֲבִיכֶן
  choice: votre père
  rationale: Avec « servir », le complément direct hébreu se transpose naturellement par un complément direct en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « De toutes mes forces » est plus idiomatique que « avec toute ma force », tandis que « vous-mêmes » préserve l’emphase de l’adresse féminine plurielle.
