base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: fr
  text: Pourquoi t’es-tu caché pour fuir et es-tu parti à mon insu[a], sans me le dire ? Je t’aurais laissé partir dans la joie, au son des chants[b], du tambourin[c] et de la lyre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu m’as volé ». Cette expression hébraïque signifie ici partir furtivement, à l’insu de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des chansons ».'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement : « timbrel » ; il s’agit probablement d’un tambour sur cadre.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « harpe » ; le terme hébreu désigne plus précisément un instrument de type lyre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נַחְבֵּאתָ לִבְרֹחַ
  choice: Pourquoi t’es-tu caché pour prendre la fuite ?
  rationale: La formulation conserve la nuance réfléchie du nifal de חבא et la force de ברח, tout en restant naturelle en français moderne.
- source_word: וַתִּגְנֹב אֹתִי
  choice: Pourquoi es-tu parti à mon insu
  rationale: Littéralement « tu m’as volé », l’expression décrit ici un départ furtif effectué à l’insu de Laban. Le français choisi restitue clairement l’idiome sans introduire l’idée distincte de tromperie.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: sans me prévenir
  rationale: Le hifil de נגד signifie faire savoir ou annoncer. Dans le contexte d’un départ, « prévenir » est idiomatique et précis.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: Je t’aurais laissé partir
  rationale: Le conditionnel passé exprime l’action irréalisée que Laban prétend qu’il aurait accomplie si Jacob l’avait averti.
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: dans la joie, au son des chants
  rationale: Cette formulation française exprime naturellement les circonstances festives du départ; שִׁירִים peut désigner des chants ou le fait de chanter.
- source_word: בְּתֹף
  choice: du tambourin
  rationale: « Tambourin » est l’équivalent moderne courant de תֹף; « tambour sur cadre » serait techniquement plus précis mais moins immédiatement accessible.
- source_word: וּבְכִנּוֹר
  choice: et de la lyre
  rationale: כִּנּוֹר désigne un instrument à cordes de type lyre; « lyre » est plus précis que le traditionnel « harpe ».
