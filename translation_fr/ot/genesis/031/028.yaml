  text: וְ/לֹ֣א נְטַשְׁתַּ֔/נִי לְ/נַשֵּׁ֥ק לְ/בָנַ֖/י וְ/לִ/בְנֹתָ֑/י עַתָּ֖ה הִסְכַּ֥לְתָּֽ עֲשֽׂוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/028.yaml
  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: fr
  text: Et tu ne m’as pas permis d’embrasser mes fils et mes filles[a]. Maintenant, tu as agi follement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Et tu ne m’as pas laissé embrasser mes fils et mes filles. »'
    reason: alternative_lexicale
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: tu ne m’as même pas laissé
  rationale: Dans cette construction avec l’infinitif « embrasser », נטשׁ exprime le fait de laisser à quelqu’un la possibilité d’agir. « Tu ne m’as pas laissé » est naturel en français; « même » rend la force de la plainte portée par וְלֹא dans le contexte.
- source_word: לְנַשֵּׁק
  choice: embrasser
  rationale: Le verbe signifie « embrasser ». Le contexte implique un baiser d’adieu, mais cette précision n’est pas explicitement exprimée dans l’hébreu.
- source_word: לְבָנַי וְלִבְנֹתָי
  choice: mes fils et mes filles
  rationale: L’hébreu nomme explicitement les deux groupes; la formulation est conservée plutôt que généralisée en « mes enfants ».
- source_word: עַתָּה
  choice: maintenant
  rationale: Ce marqueur introduit directement le jugement de Laban sur la conduite de Jacob.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: tu as agi en insensé
  rationale: La tournure hébraïque signifie que Jacob s’est conduit de manière insensée. Cette formulation française reste digne et naturelle tout en conservant l’idée d’une conduite caractéristique d’un insensé.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. L’exclamation restitue la vive plainte de Laban. « Embrasser » garde l’action simple sans expliciter le caractère d’adieu, seulement implicite dans le contexte.
