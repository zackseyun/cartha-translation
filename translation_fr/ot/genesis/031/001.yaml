  text: וַ/יִּשְׁמַ֗ע אֶת דִּבְרֵ֤י בְנֵֽי לָבָן֙ לֵ/אמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל אֲשֶׁ֣ר לְ/אָבִ֑י/נוּ וּ/מֵ/אֲשֶׁ֣ר לְ/אָבִ֔י/נוּ עָשָׂ֕ה אֵ֥ת כָּל הַ/כָּבֹ֖ד הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: fr
  text: 'Il entendit les fils de Laban dire : « Jacob a pris tout ce qui appartenait à notre père, et de ce qui appartenait à notre père, il a tiré toute cette richesse[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute cette gloire ». Le mot hébreu peut désigner l’honneur, la splendeur ou la richesse matérielle ; ici, il évoque la prospérité visible de Jacob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Il entendit
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français et n’ajoute aucun marqueur temporel absent de l’hébreu.
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: les fils de Laban dire
  rationale: Cette formulation française naturelle rend l’idée qu’il entend leurs paroles et introduit directement leur discours, sans la lourdeur de « les paroles… disant ».
- source_word: לָקַח
  choice: a pris
  rationale: Le passé composé convient à une accusation portant sur une action accomplie dont les effets sont présents. « Pris » n’accentue pas indûment l’idée de saisie violente.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: tout ce qui appartenait à notre père
  rationale: La construction avec לְ exprime ici la possession; cette formulation est claire et idiomatique.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: et c’est avec les biens de notre père
  rationale: מִן indique la provenance. La tournure emphatique « c’est avec » restitue l’accusation selon laquelle la prospérité de Jacob provient des biens du père, tandis que « les biens » évite une répétition française pesante.
- source_word: עָשָׂה
  choice: il a amassé
  rationale: Le verbe signifie littéralement « faire », mais avec la richesse comme complément il décrit ici l’acquisition ou l’accumulation de biens. « Amassé » exprime naturellement ce sens contextuel.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: toute cette richesse
  rationale: כָּבוֹד peut désigner la gloire, l’honneur ou une prospérité matérielle imposante. Dans ce contexte de troupeaux et de biens, « richesse » rend le mieux le référent concret; « gloire » est conservé en note.
