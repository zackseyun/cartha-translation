base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: fr
  text: 'Alors Laban dit à Jacob : « Qu’as-tu fait ? Tu m’as trompé[a] et tu as emmené mes filles comme des captives de guerre[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu as volé mon cœur » ; expression hébraïque signifiant ici que Jacob a agi à l’insu de Laban ou l’a trompé.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme des captives de l’épée », c’est-à-dire des femmes faites prisonnières à la guerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Qu’as-tu fait ?
  rationale: Cette question accusatrice rend directement et naturellement l’hébreu, tout en conservant sa force rhétorique.
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: Tu m’as trompé
  rationale: L’expression hébraïque signifie ici agir à l’insu de quelqu’un ou le tromper. Le calque « tu as volé mon cœur » évoquerait en français moderne la séduction amoureuse et fausserait l’accusation de Laban; l’image littérale est donc signalée en note.
- source_word: לְבָבִי
  choice: m’
  rationale: Dans cette locution, « mon cœur » représente la conscience ou l’entendement de Laban. Le pronom personnel permet de rendre idiomatiquement le sens global sans introduire une connotation romantique.
- source_word: וַתְּנַהֵג
  choice: tu as emmené
  rationale: Le verbe désigne l’action de conduire ou d’emmener. La comparaison avec des captives apporte déjà la nuance de contrainte, sans qu’il soit nécessaire d’employer le peu naturel « chassé devant toi ».
- source_word: בְּנֹתַי
  choice: mes filles
  rationale: Traduction directe du nom pluriel avec son possessif, conservant la revendication familiale formulée par Laban.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: comme des captives de guerre
  rationale: Littéralement « comme des captives de l’épée », cette formule désigne des femmes faites prisonnières lors d’un conflit. « Captives de guerre » transmet clairement l’image militaire en français courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct conserve le ton indigné de Laban. Les idiomes hébraïques susceptibles d’être mal compris s’ils étaient calqués sont rendus selon leur sens contextuel, tandis que leur image originale est préservée en note.
