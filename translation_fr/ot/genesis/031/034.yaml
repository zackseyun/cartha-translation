source:
  edition: WLC
  text: וְ/רָחֵ֞ל לָקְחָ֣ה אֶת הַ/תְּרָפִ֗ים וַ/תְּשִׂמֵ֛/ם בְּ/כַ֥ר הַ/גָּמָ֖ל וַ/תֵּ֣שֶׁב עֲלֵי/הֶ֑ם וַ/יְמַשֵּׁ֥שׁ לָבָ֛ן אֶת כָּל הָ/אֹ֖הֶל וְ/לֹ֥א מָצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: fr
  text: Rachel avait pris les idoles domestiques[a], les avait mises dans le coussin de selle du chameau[b] et s’était assise dessus. Laban fouilla tout l’intérieur de la tente en tâtant, mais ne les trouva pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les téraphim » ou « les dieux domestiques ». Le terme hébreu désigne des objets cultuels du foyer.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la selle du chameau » ou « dans le bât du chameau ». L’hébreu désigne probablement une partie rembourrée de son équipement de monte ou de bât.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: les idoles domestiques
  rationale: Le terme désigne des objets cultuels ou divinités du foyer. « Idoles domestiques » est clair en français moderne tout en conservant la nature concrète et cultuelle des objets.
- source_word: בְּכַר הַגָּמָל
  choice: dans le coussin de selle du chameau
  rationale: כַּר désigne couramment un coussin ou un élément rembourré ; dans ce contexte, il s’agit vraisemblablement d’une partie rembourrée de l’équipement de monte du chameau.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: et s’était assise dessus
  rationale: Le plus-que-parfait inscrit cette action dans la séquence antérieure à la fouille de Laban ; « dessus » exprime naturellement la position physique sur les objets cachés.
- source_word: וַיְמַשֵּׁשׁ
  choice: fouilla … en tâtant
  rationale: מששׁ décrit une recherche effectuée par le toucher. Cette formulation française garde à la fois l’idée de fouille et sa nuance tactile.
- source_word: כָּל הָאֹהֶל
  choice: tout l’intérieur de la tente
  rationale: L’hébreu dit littéralement « toute la tente » ; l’ajout idiomatique d’« intérieur » évite de suggérer que Laban palpait la structure extérieure et rend clairement le lieu fouillé.
- source_word: וְלֹא מָצָא
  choice: mais ne les trouva pas
  rationale: Le pronom explicite reprend les idoles, objet sous-entendu en hébreu, tandis que « mais » rend naturellement le contraste avec la fouille.
- source_word: וְרָחֵל
  choice: Rachel
  rationale: Le waw assure ici la continuité ou le déplacement narratif sans exiger un marqueur français tel que « Or » ou « Maintenant ».
theological_decisions: []
