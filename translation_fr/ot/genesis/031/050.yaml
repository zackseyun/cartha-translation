  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: fr
  text: Si tu maltraites mes filles ou si tu épouses d’autres femmes en plus de mes filles — aucun homme n’est avec nous[a] — vois, Dieu est témoin entre moi et toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « aucun homme n’est avec nous ». Il s’agit de l’absence de témoin humain.'
    reason: La relation de cette proposition avec l’avertissement n’est pas explicitement indiquée en hébreu ; la note en explicite le sens contextuel sans imposer une nuance concessive.
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: maltraites
  rationale: Dans ce contexte matrimonial, le piel de ענה désigne le fait de faire subir de mauvais traitements. « Maltraiter » est naturel en français moderne et évite les sens potentiellement trompeurs de « humilier ».
- source_word: בְּנֹתַי
  choice: mes filles
  rationale: Le possessif pluriel est rendu directement et répété comme dans l’hébreu, afin de conserver l’insistance de Laban.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: prends d’autres femmes en plus de mes filles
  rationale: L’expression signifie prendre des épouses supplémentaires, et non remplacer les filles de Laban. « En plus de » exprime clairement cette addition.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: alors qu’aucun homme n’est avec nous
  rationale: 'La formulation conserve אִישׁ par « homme » et fait ressortir la valeur circonstancielle ou concessive de la proposition dans ce contexte : aucun témoin humain n’assiste à l’engagement.'
- source_word: רְאֵה
  choice: vois
  rationale: 'L’impératif est conservé avec sa force directe : Laban attire solennellement l’attention de Jacob sur Dieu comme témoin.'
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans cette formule d’attestation, אֱלֹהִים désigne la divinité invoquée comme témoin et se rend naturellement au singulier.
- source_word: עֵד
  choice: témoin
  rationale: Le nom est attribut dans une formule solennelle d’alliance ; « Dieu est témoin » est idiomatique et fidèle.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre moi et toi
  rationale: Cette formulation directe conserve la relation d’obligation mutuelle entre les deux parties.
theological_decisions:
- issue: Portée de אִישׁ dans l’absence de témoin humain
  choice: aucun homme n’est avec nous
  alternative: personne n’est avec nous
  rationale: « Homme » correspond formellement à אִישׁ, tandis que le contexte indique plus largement l’absence de témoin humain. La note explicite cette portée sans neutraliser le terme dans le texte principal.
translation_notes:
  register: Français international moderne, sobre et solennel. Le tutoiement correspond au singulier hébreu. La répétition de « mes filles » et l’impératif bref « vois » maintiennent l’insistance et la vigueur de l’original.
