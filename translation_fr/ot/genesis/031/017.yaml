  yaml_path: translation/ot/genesis/031/017.yaml
  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: fr
  text: Alors Jacob se leva et fit monter ses fils et ses épouses sur les chameaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se leva
  rationale: Le verbe קום, au wayyiqtol, fait progresser le récit et exprime ici le fait de se lever pour agir. « Se leva » est naturel, digne et fidèle à la séquence narrative.
- source_word: וַיִּשָּׂא
  choice: fit monter
  rationale: נשׂא signifie fondamentalement « soulever, porter ». Avec des personnes et עַל הַגְּמַלִּים, le contexte décrit l’action de les placer sur les chameaux; « fit monter » rend naturellement ce sens causatif en français.
- source_word: בָּנָיו
  choice: ses fils
  rationale: Le masculin pluriel בנים désigne ici les fils de Jacob. « Ses fils » conserve la précision du texte hébreu.
- source_word: נָשָׁיו
  choice: ses épouses
  rationale: Le pluriel de אִשָּׁה avec Jacob comme possesseur désigne ses femmes au sens d’épouses. « Ses épouses » est précis et évite l’ambiguïté possible de « ses femmes » en français moderne.
- source_word: עַל הַגְּמַלִּים
  choice: sur les chameaux
  rationale: Avec un verbe de mise en mouvement, עַל indique ici la destination ou la position sur les animaux. En français, « sur les chameaux » exprime naturellement les deux nuances sans qu’une note soit nécessaire.
