  variant: modern international French
source:
  edition: WLC
  text: וְ/לָבָ֣ן הָלַ֔ךְ לִ/גְזֹ֖ז אֶת צֹאנ֑/וֹ וַ/תִּגְנֹ֣ב רָחֵ֔ל אֶת הַ/תְּרָפִ֖ים אֲשֶׁ֥ר לְ/אָבִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: fr
  text: Laban était allé tondre son troupeau, et Rachel vola les idoles domestiques[a] qui appartenaient à son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : téraphim ; autre traduction possible : « dieux domestiques ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: était allé
  rationale: 'Dans ce récit, le qatal fournit l’arrière-plan de l’action principale : Laban était absent lorsque Rachel agit. Le plus-que-parfait l’exprime naturellement en français.'
- source_word: לִגְזֹז
  choice: tondre
  rationale: L’infinitif désigne précisément la tonte des animaux du troupeau ; « tondre » est le terme français courant et exact.
- source_word: צֹאנוֹ
  choice: son troupeau
  rationale: צֹאן désigne collectivement le petit bétail, notamment les moutons et les chèvres. « Troupeau » reste naturel et suffisamment large.
- source_word: וַתִּגְנֹב
  choice: vola
  rationale: Le verbe גנב signifie directement « voler » ; cette portée morale et juridique ne doit pas être atténuée.
- source_word: הַתְּרָפִים
  choice: les idoles domestiques
  rationale: תְּרָפִים désigne des objets cultuels liés à la maison. « Idoles domestiques » rend accessibles leur cadre familial et leur fonction religieuse.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: qui appartenaient à son père
  rationale: La tournure hébraïque exprime ici la possession ; cette formulation est claire et naturelle en français moderne.
- source_word: וְ
  choice: et
  rationale: La conjonction relie cette information d’arrière-plan à la suite du récit sans ajouter un marqueur temporel absent de l’hébreu.
theological_decisions:
- issue: Traduction de תְּרָפִים dans un contexte d’objets de culte domestique
  choice: idoles domestiques
  alternative: téraphim ; dieux domestiques
  rationale: Le terme hébreu désigne des objets ou images cultuels domestiques. « Idoles domestiques » en indique clairement la nature religieuse sans imposer une interprétation confessionnelle ; les autres rendus reconnus sont signalés en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le plus-que-parfait marque l’arrière-plan narratif, tandis que le passé simple conserve la progression du récit. Le marqueur de note [a] est placé après « idoles domestiques », le terme auquel la note se rapporte.
