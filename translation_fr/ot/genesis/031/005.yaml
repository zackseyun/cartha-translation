  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת פְּנֵ֣י אֲבִי/כֶ֔ן כִּֽי אֵינֶ֥/נּוּ אֵלַ֖/י כִּ/תְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽ/אלֹהֵ֣י אָבִ֔/י הָיָ֖ה עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: fr
  text: 'Il leur dit : « Je vois que votre père n’a plus la même attitude envers moi qu’autrefois[a]. Mais le Dieu de mon père a été avec moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le visage de votre père n’est pas envers moi comme hier et avant-hier », expression hébraïque signifiant « comme auparavant ».'
    reason: La note préserve l’image du « visage », l’orientation exprimée par « envers moi » et l’idiome temporel hébreu rendu dans le texte par « qu’autrefois ».
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: Il leur dit
  rationale: Le passé simple rend naturellement le wayyiqtol narratif. Le pronom « leur » renvoie à Rachel et Léa sans marquer leur genre, comme il est normal en français.
- source_word: רֹאֶה אָנֹכִי
  choice: Je vois
  rationale: Le participe accompagné du pronom indépendant exprime la perception présente de Jacob ; le présent français convient naturellement.
- source_word: אֶת פְּנֵי אֲבִיכֶן כִּי אֵינֶנּוּ אֵלַי
  choice: que votre père n’a plus envers moi la même attitude
  rationale: Littéralement, le texte parle du « visage » du père qui n’est plus « envers » Jacob. En français, cette formulation idiomatique exprime clairement le changement de disposition sans préciser s’il s’agit seulement de l’expression du visage ou de l’attitude générale.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: qu’autrefois
  rationale: L’expression hébraïque signifie littéralement « comme hier et avant-hier » et désigne l’état antérieur. « Autrefois » en transmet le sens avec naturel ; la tournure concrète est conservée en note.
- source_word: וֵאלֹהֵי אָבִי
  choice: Mais le Dieu de mon père
  rationale: Dans le contexte, la conjonction introduit un contraste entre l’attitude devenue défavorable de Laban et la présence secourable de Dieu. « Le Dieu de mon père » conserve la construction familiale et la portée d’alliance du texte.
- source_word: הָיָה עִמָּדִי
  choice: a été avec moi
  rationale: Le passé composé présente la présence de Dieu comme une réalité vécue jusqu’au moment où Jacob parle, sans ajouter de précision étrangère au texte.
theological_decisions:
- issue: La désignation divine אֱלֹהֵי אָבִי
  choice: le Dieu de mon père
  alternative: le Dieu qu’adorait mon père
  rationale: La traduction retenue suit directement la construction hébraïque et préserve sa portée familiale et relationnelle, tandis que l’alternative expliciterait indûment la nature du lien entre le père et Dieu.
translation_notes:
  register: Français international actuel, clair et digne. La formulation idiomatique évite le calque peu naturel « son visage n’est pas envers moi », tandis que la note permet au lecteur d’accéder à l’image hébraïque. Le contraste est marqué par « Mais ».
