source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: fr
  text: 'Alors l’ange de Dieu me dit dans le rêve[a] : « Jacob ! » Je répondis : « Me voici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un rêve ». L’hébreu porte littéralement « dans le rêve ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … me dit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, tandis que le passé simple convient au registre narratif français.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom objet indirect rend naturellement la préposition אֶל avec le suffixe de première personne.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: l’ange de Dieu
  rationale: Dans ce contexte, מַלְאָךְ désigne un être céleste. « L’ange de Dieu » est une formulation claire et traditionnelle qui ne précise pas davantage son identité.
- source_word: בַּחֲלוֹם
  choice: dans le rêve
  rationale: L’hébreu comporte l’article défini. La formulation retenue le conserve; « dans un rêve » reste une possibilité idiomatique signalée en note.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française conventionnelle du nom propre.
- source_word: וָאֹמַר
  choice: Je répondis
  rationale: Le verbe est littéralement « et je dis », mais il introduit ici une réponse directe; « je répondis » exprime naturellement cette fonction en français sans modifier le contenu.
- source_word: הִנֵּנִי
  choice: Me voici
  rationale: Équivalent français idiomatique de la formule hébraïque de disponibilité ou de réponse à un appel.
theological_decisions:
- issue: L’identité de מַלְאַךְ הָאֱלֹהִים dans un contexte susceptible de suggérer un lien étroit avec Dieu
  choice: l’ange de Dieu
  alternative: le messager de Dieu
  rationale: Le verset désigne simplement la figure comme « l’ange de Dieu » sans trancher les questions théologiques plus larges concernant son identité. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient une tonalité narrative soutenue mais courante dans la Bible; les paroles directes restent immédiates et accessibles.
