base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: fr
  text: 'Ce tas de pierres est témoin, et cette stèle est témoin[a] : je ne passerai pas de l’autre côté de ce tas de pierres vers toi, et toi, tu ne passeras pas de l’autre côté de ce tas de pierres et de cette stèle vers moi pour faire du mal[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu présente parallèlement le tas de pierres et la stèle comme des témoins de l’engagement.
    reason: lexical_alternative
  - marker: b
    text: Il ne s’agit pas d’interdire tout passage de l’autre côté de cette limite, mais de le faire dans le but de nuire.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד
  choice: est témoin
  rationale: Le nom attribut exprime la fonction commémorative et juridique du tas. En français, « est témoin » conserve naturellement l’image personnifiée sans exiger d’article.
- source_word: גַּל
  choice: tas de pierres
  rationale: Dans le contexte immédiat, il s’agit du tas de pierres dressé comme marque de délimitation. L’ajout « de pierres », fourni par le contexte, rend l’image immédiatement claire en français moderne.
- source_word: וְעֵדָה
  choice: et cette stèle est témoin
  rationale: 'La tournure est comprise en parallèle avec la première proposition : les deux monuments servent de témoins. La répétition explicite respecte ce parallélisme.'
- source_word: מַצֵּבָה
  choice: stèle
  rationale: Le terme désigne une pierre dressée servant de monument ou de repère. « Stèle » est précis, courant dans le contexte biblique et plus évocateur ici que « pilier ».
- source_word: אִם ... לֹא
  choice: je n’irai pas… et tu n’iras pas
  rationale: Dans cette déclaration solennelle liée à l’alliance, la construction introduit les engagements attestés par les monuments plutôt qu’une simple condition hypothétique. Les deux négations sont rendues directement.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: irai au-delà de
  rationale: Le verbe décrit le franchissement de la limite matérialisée par les pierres. « Aller au-delà de » évite de suggérer qu’il faudrait physiquement escalader le tas ou la stèle.
- source_word: אֵלֶיךָ / אֵלַי
  choice: dans ta direction / dans ma direction
  rationale: La préposition indique le mouvement vers l’autre partie. Cette formulation préserve la valeur directionnelle sans lui attribuer à elle seule une nuance hostile.
- source_word: לְרָעָה
  choice: dans une intention hostile
  rationale: L’expression indique le but nuisible ou malveillant du franchissement, et non une interdiction absolue de tout déplacement au-delà de la limite.
theological_decisions:
- issue: Portée de לְרָעָה sur les deux engagements
  choice: La formule finale qualifie l’intention du franchissement dans l’ensemble de la déclaration réciproque.
  alternative: La rattacher grammaticalement au seul engagement de Laban, le plus proche.
  rationale: Le contexte d’alliance et la symétrie des deux propositions favorisent une interdiction réciproque des incursions hostiles, tout en conservant la formule une seule fois à la fin comme en hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « est témoin » préserve le parallélisme solennel. « Aller au-delà de » explicite la fonction de limite des monuments sans effacer l’image concrète du texte.
