  text: וְ/עַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי נִכְסֹ֥ף נִכְסַ֖פְתָּה לְ/בֵ֣ית אָבִ֑י/ךָ לָ֥/מָּה גָנַ֖בְתָּ אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: fr
  text: Et maintenant, tu es bel et bien parti, parce que tu as tant désiré la maison de ton père. Pourquoi as-tu volé mes dieux[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mes dieux domestiques ». L’hébreu dit simplement « mes dieux » ; dans ce contexte, il s’agit des idoles domestiques de Laban.'
    reason: 'Alternative lexicale contextuelle : le texte principal conserve le terme hébreu général « dieux », tandis que la note explicite le référent probable sans l’importer dans le verset.'
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Marque la transition vers le point suivant de l’accusation de Laban, tout en conservant la valeur connective de וְ et la valeur temporelle de עַתָּה.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: tu es bel et bien parti
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’affirmation. « Bel et bien » exprime naturellement cette insistance en français moderne.
- source_word: כִּי
  choice: puisque… parce que
  rationale: כִּי introduit le motif que Laban reconnaît au départ de Jacob. La structure française distingue naturellement le fait concédé (« puisque tu es parti ») de sa cause (« parce que… »), sans modifier le rapport logique.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: tu désirais ardemment
  rationale: La construction avec infinitif absolu intensifie le profond désir exprimé par la racine כָּסַף. « Ardemment » restitue cette intensité sans réduire le sens à la seule nostalgie.
- source_word: לְבֵית אָבִיךָ
  choice: retourner chez ton père
  rationale: Littéralement « vers la maison de ton père ». Dans ce contexte de départ et de retour, « retourner chez ton père » exprime idiomatiquement la destination familiale, sans employer le peu naturel « maison de ton père ».
- source_word: לָמָּה
  choice: pourquoi
  rationale: Interrogatif direct qui introduit l’accusation de Laban.
- source_word: גָנַבְתָּ
  choice: as-tu volé
  rationale: Le passé composé convient naturellement en français pour cette question portant sur un acte antérieur dont les conséquences demeurent présentes.
- source_word: אֶת אֱלֹהָי
  choice: mes dieux
  rationale: Le texte hébreu dit simplement « mes dieux ». Cette formulation directe est conservée dans le corps du texte; l’identification contextuelle comme objets cultuels domestiques est donnée en note.
theological_decisions:
- issue: Traduction de אֱלֹהָי dans les paroles de Laban
  choice: mes dieux
  alternative: mes dieux domestiques
  rationale: L’hébreu emploie simplement le pluriel « mes dieux » et ne contient pas ici le terme « téraphim ». La traduction préserve donc la formulation de Laban sans l’atténuer ni préciser dans le texte principal ce que seul le contexte permet d’identifier.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux constructions hébraïques intensives sont rendues distinctement par « bel et bien » et « ardemment ». La syntaxe reste orale, adaptée à une accusation directe, tout en évitant les tournures archaïques.
