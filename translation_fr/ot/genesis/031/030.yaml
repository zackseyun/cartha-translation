revisions:
- from: Et maintenant, puisque tu es bel et bien parti parce que tu désirais ardemment retourner chez ton père, pourquoi as-tu volé mes dieux[a] ?
  to: Et maintenant, tu es bel et bien parti, parce que tu as tant désiré la maison de ton père. Pourquoi as-tu volé mes dieux[a] ?
  rationale: La révision conserve les deux intensifications hébraïques par « bel et bien » et « tant », rétablit « la maison de ton père » sans ajouter le verbe « retourner », et exprime la causalité par une seule proposition naturelle en français. La note est conservée avec une formulation typographiquement et lexicalement harmonisée.
