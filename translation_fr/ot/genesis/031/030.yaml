    issue: Ajout de « retourner » et effacement de « la maison de ton père »
    rationale: לְבֵית אָבִיךָ signifie littéralement « vers/pour la maison de ton père ». Le contexte permet d’inférer un retour, mais le verbe « retourner » n’est pas exprimé et déplace l’accent du désir vers l’action de revenir.
  - severity: low
    issue: Double articulation causale « puisque ... parce que »
    rationale: Le texte hébreu ne comporte qu’un seul כִּי causal. La double subordination française est grammaticalement possible, mais elle est moins directe et rend la phrase pesante.
