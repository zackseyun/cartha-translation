  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: fr
  text: Ne nous considère-t-il pas comme des étrangères ? Car il nous a vendues et a bel et bien englouti notre argent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a bel et bien dévoré notre argent ». L’hébreu emploie l’image de « manger », renforcée par un infinitif absolu, pour exprimer une consommation totale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Ne sommes-nous pas… ?
  rationale: Introduit une question rhétorique appelant une réponse affirmative ; cette tournure est naturelle en français et conserve la force interrogative.
- source_word: נָכְרִיּוֹת
  choice: des étrangères
  rationale: Désigne ici des femmes traitées comme étrangères à la famille ; le féminin est requis par les locutrices et par la forme hébraïque.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: considérées par lui
  rationale: Conserve le sens passif du nifal de חשב et rend explicitement la relation exprimée par לוֹ.
- source_word: כִּי
  choice: En effet
  rationale: Introduit la justification de la question rhétorique ; « En effet » exprime naturellement cette valeur explicative.
- source_word: מְכָרָנוּ
  choice: il nous a vendues
  rationale: Rend l'action accomplie avec sa pertinence présente et marque l'accord féminin des deux locutrices.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: et il a même entièrement englouti
  rationale: « Englouti » conserve l'image hébraïque de manger, tandis que « même entièrement » rend l'intensification produite par גַּם et l'infinitif absolu.
- source_word: אֶת כַּסְפֵּנוּ
  choice: notre argent
  rationale: כֶּסֶף peut désigner l'argent-métal ou l'argent comme bien économique ; « notre argent » convient au contexte sans trancher plus précisément la nature de la somme.
