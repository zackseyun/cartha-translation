base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: fr
  text: 'Alors Jacob se mit en colère et se querella avec Laban. Jacob répondit à Laban : « Quelle est ma faute ? Quel est mon péché, pour que tu m’aies poursuivi[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut évoquer une poursuite ardente ou acharnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: Jacob se mit en colère
  rationale: L’expression idiomatique indique que la colère s’allume chez Jacob. « Se mit en colère » rend naturellement en français cette entrée dans la colère.
- source_word: וַיָּרֶב בְּלָבָן
  choice: et se querella avec Laban
  rationale: Le verbe ריב décrit ici une confrontation verbale ou une dispute. « Se querella avec » conserve cette force adversative dans un français courant.
- source_word: וַיַּעַן יַעֲקֹב וַיֹּאמֶר לְלָבָן
  choice: Jacob répondit à Laban
  rationale: La tournure hébraïque « répondit et dit » est une formule narrative. En français moderne, « répondit » en exprime naturellement la fonction sans lourdeur.
- source_word: מַה פִּשְׁעִי
  choice: Quelle est ma faute ?
  rationale: פשע peut désigner une transgression ou une rébellion. Dans cette protestation d’innocence, « faute » garde la nuance morale et juridique tout en restant accessible.
- source_word: מַה חַטָּאתִי
  choice: Quel est mon péché
  rationale: חטאת désigne directement le péché ou la faute. « Péché » préserve le parallélisme avec « faute » et la portée morale du terme.
- source_word: כִּי
  choice: pour que
  rationale: Dans la question, כִּי relie la faute supposée à la poursuite de Laban. « Pour que » reproduit naturellement en français cette relation rhétorique.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: tu me poursuives
  rationale: דלק suivi de אחרי signifie poursuivre quelqu’un avec ardeur. « Poursuivre » exprime clairement l’action, tandis que la vigueur imagée du verbe est signalée en note sans surcharger le texte.
