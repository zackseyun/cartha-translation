id: GEN.31.24
reference: Genesis 31:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל לָבָ֥ן הָ/אֲרַמִּ֖י בַּ/חֲלֹ֣ם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִשָּׁ֧מֶר לְ/ךָ֛ פֶּן תְּדַבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: fr
  text: 'Mais Dieu vint vers Laban l’Araméen dans un rêve, pendant la nuit, et lui dit : « Garde-toi de dire à Jacob quoi que ce soit, en bien ou en mal.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du bien jusqu’au mal » ; cette expression signifie ici : quoi que ce soit, que ce soit favorable ou défavorable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vint vers
  rationale: Le verbe בוא exprime ici la venue de Dieu auprès de Laban. « Vint vers » reste proche de l’hébreu sans introduire explicitement l’idée d’apparition.
- source_word: לָבָן הָאֲרַמִּי
  choice: Laban l’Araméen
  rationale: אֲרַמִּי est l’ethnonyme « Araméen » ; « Syrien » relèverait d’une terminologie géographique plus tardive.
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: dans un rêve, pendant la nuit
  rationale: 'Cette formulation naturelle conserve les deux éléments du texte hébreu : le rêve et son cadre nocturne.'
- source_word: הִשָּׁמֶר לְךָ
  choice: Garde-toi
  rationale: La formule française exprime avec dignité et netteté l’avertissement porté par l’impératif niphal de שמר accompagné de לְךָ.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: de dire à Jacob quoi que ce soit
  rationale: Après « garde-toi », l’infinitif rend naturellement l’interdiction introduite par פֶּן. « Dire à Jacob quoi que ce soit » explicite en français la portée idiomatique de l’expression qui suit.
- source_word: מִטּוֹב עַד רָע
  choice: en bien ou en mal
  rationale: Littéralement « du bien jusqu’au mal », cette expression mérismatique couvre toute parole, favorable ou défavorable. L’ajout de « quoi que ce soit » rend sa portée idiomatique claire.
theological_decisions:
- issue: Identité de אֱלֹהִים
  choice: Dieu
  alternative: des dieux / un être divin
  rationale: Le verbe au singulier et le contexte narratif désignent Dieu au singulier, sans qu’il soit nécessaire d’ajouter une précision doctrinale.
- issue: Portée de l’interdiction « du bien jusqu’au mal »
  choice: interdiction de dire quoi que ce soit à Jacob, en bien ou en mal
  alternative: interdiction limitée aux paroles mauvaises ou menaçantes
  rationale: Le mérisme hébreu embrasse les deux pôles et interdit toute intervention verbale, sans réduire l’avertissement aux seules paroles hostiles.
translation_notes:
  register: Français international moderne, clair et digne. « L’Araméen » conserve l’ethnonyme hébreu. « Garde-toi » maintient la force solennelle de l’avertissement, tandis que « quoi que ce soit, en bien ou en mal » communique naturellement la valeur du mérisme.
