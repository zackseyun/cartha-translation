  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: fr
  text: Pourtant, votre père m’a trompé et a changé dix fois[a] mon salaire, mais Dieu ne lui a pas permis de me faire du mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dix fois »; l’expression peut désigner des changements répétés sans constituer nécessairement un décompte exact.
    reason: cultural_note
lexical_decisions:
- source_word: הֵתֶל
  choice: m’a trompé
  rationale: Le hifil de התל peut exprimer une conduite trompeuse ou moqueuse. Dans ce contexte de modifications malhonnêtes du salaire, « m’a trompé » rend naturellement l’accusation sans exclure l’idée de mauvais traitement.
- source_word: וְהֶחֱלִף
  choice: a changé
  rationale: Le hifil de חלף désigne ici la modification répétée de la rémunération convenue; « a changé » est clair et idiomatique.
- source_word: מַשְׂכֻּרְתִּי
  choice: mon salaire
  rationale: Le nom désigne la rémunération due pour un travail; le singulier collectif « mon salaire » convient naturellement en français.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: dix fois
  rationale: L’expression signifie « dix fois » et peut fonctionner comme une tournure conventionnelle indiquant des changements répétés, sans imposer nécessairement un décompte exact.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: mais Dieu ne lui a pas permis
  rationale: Littéralement, Dieu « ne l’a pas donné » pour nuire; la formulation française explicite avec justesse l’idée de permission refusée.
- source_word: לְהָרַע עִמָּדִי
  choice: de me faire du mal
  rationale: L’infinitif de רעע avec עִם exprime le fait d’agir mal envers quelqu’un ou de lui nuire; cette tournure est naturelle et fidèle.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans le discours de Jacob, אֱלֹהִים désigne Dieu.
theological_decisions:
- issue: La retenue divine exprimée par « Dieu ne l’a pas donné »
  choice: Dieu n’a pas permis au père de leur faire du mal à Jacob
  alternative: Dieu ne l’a pas laissé réussir à nuire à Jacob
  rationale: Le texte attribue à Dieu l’empêchement du mal envisagé, mais ne précise ni le mécanisme de cette protection ni l’étendue exacte de l’intention de Laban.
translation_notes:
  register: Français international moderne, courant et digne. « Pourtant » marque le contraste avec le contexte; « votre père » conserve l’adresse au pluriel aux fils de Laban. Les notes sont placées immédiatement après les expressions qu’elles éclairent.
