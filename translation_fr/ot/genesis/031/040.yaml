  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: fr
  text: 'J’étais ainsi : le jour, la chaleur me dévorait, et la nuit, le gel me dévorait ; le sommeil fuyait mes yeux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: '[intégré à la construction de la phrase]'
  rationale: Le verbe « j’étais » introduit la description de l’état de Jacob. En français naturel, sa valeur est rendue par la construction circonstancielle sans qu’il soit nécessaire de le traduire séparément.
- source_word: בַיּוֹם
  choice: Le jour
  rationale: Cette expression temporelle concise établit le contraste avec « la nuit ».
- source_word: אֲכָלַנִי
  choice: me dévorait
  rationale: Le verbe אכל signifie littéralement « manger » et décrit ici de façon imagée l’effet éprouvant de la chaleur. « Dévorait » conserve cette métaphore vive.
- source_word: חֹרֶב
  choice: la chaleur
  rationale: Dans le contraste avec le gel nocturne, le terme désigne la chaleur sèche ou brûlante du jour.
- source_word: וְקֶרַח
  choice: et la nuit, le gel
  rationale: קֶרַח désigne la glace ou le gel. La proposition elliptique française conserve le parallélisme hébreu tout en restant naturelle.
- source_word: בַּלָּיְלָה
  choice: la nuit
  rationale: Cette formulation répond directement à « Le jour » et préserve l’équilibre du verset.
- source_word: וַתִּדַּד
  choice: fuyait loin
  rationale: Ce verbe rare exprime l’éloignement ou la fuite. « Fuyait loin » rend clairement la personnification du sommeil.
- source_word: שְׁנָתִי
  choice: le sommeil
  rationale: Le nom désigne le sommeil de Jacob comme état, et non simplement une nuit de repos.
- source_word: מֵעֵינָי
  choice: de mes yeux
  rationale: La traduction conserve l’image hébraïque traditionnelle de l’insomnie, qui demeure compréhensible en français.
