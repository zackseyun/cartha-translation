id: GEN.31.49
reference: Genesis 31:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/מִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣/י וּ/בֵינֶ֑/ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵ/רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: fr
  text: 'Et Mitspa[a], parce qu’il avait dit : « Que Yahweh veille entre moi et toi lorsque nous serons hors de la vue l’un de l’autre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mitspa évoque en hébreu un « poste d’observation » ou une « tour de guet »; le nom fait écho au verbe traduit par « veille ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lorsque nous serons cachés l’un à l’autre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: Et Mitspa
  rationale: Le terme fonctionne ici comme un nom de lieu. La translittération française « Mitspa » préserve cet emploi onomastique, tandis que la note signale le jeu de mots avec la racine צפה, « observer, veiller ».
- source_word: אֲשֶׁר אָמַר
  choice: parce qu’il avait dit
  rationale: La proposition relative explique le nom donné dans le contexte. « Parce que » exprime naturellement ce lien explicatif, et le plus-que-parfait situe la parole avant la désignation sans ajouter explicitement « il l’appela ».
- source_word: יִצֶף
  choice: veille
  rationale: 'La forme exprime ici un souhait : « Que… veille ». Ce choix rend le sens de צפה et maintient l’écho avec le nom Mitspa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle afin de conserver le nom propre présent dans le texte hébreu.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre moi et toi
  rationale: Cette formulation suit l’ordre de l’hébreu et reste naturelle en français.
- source_word: כִּי
  choice: lorsque
  rationale: Dans ce contexte, כִּי introduit la circonstance dans laquelle la vigilance divine est invoquée; « lorsque » convient mieux qu’une valeur causale.
- source_word: נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: nous serons hors de la vue l’un de l’autre
  rationale: Le niphal de סתר signifie être caché ou soustrait à la vue, et אִישׁ מֵרֵעֵהוּ a ici une valeur réciproque. Cette formulation française exprime clairement la séparation visuelle sans réduire le sens à une simple absence.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre יהוה. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de la vigilance divine
  choice: « veille entre moi et toi »
  alternative: « soit témoin entre nous »
  rationale: Le verbe צפה désigne directement l’action de regarder ou de veiller. Le traduire par « être témoin » expliciterait une fonction juridique plausible dans le contexte de l’alliance, mais non exprimée lexicalement ici.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la formule explicative abrupte de l’hébreu sans ajouter un verbe de nomination absent du verset. « Hors de la vue l’un de l’autre » rend idiomatiquement l’image de personnes cachées l’une à l’autre, tandis que la note en donne la forme plus littérale.
