  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: fr
  text: 'Laban dit : « Ce tas de pierres est aujourd’hui témoin entre moi et toi. » C’est pourquoi il l’appela Galaad[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Galaad » (hébreu Galéed) évoque les mots hébreux pour « tas » et « témoin »; le nom signifie approximativement « tas témoin ».
    reason: Le jeu de mots étiologique entre le nom et les termes hébreux pour « tas » et « témoin » ne se reproduit pas directement en français.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol fait progresser le récit; le passé simple convient au registre narratif français sans devoir expliciter la coordination par « et ».
- source_word: לָבָן
  choice: Laban
  rationale: Le nom propre est translittéré selon son usage français courant.
- source_word: הַגַּל הַזֶּה
  choice: ce tas de pierres
  rationale: גַּל désigne ici le tas de pierres élevé dans le contexte immédiat; l’ajout de « de pierres » rend naturellement le référent explicite en français.
- source_word: עֵד
  choice: est témoin
  rationale: Cette formulation conserve la personnification juridique du tas comme témoin, plutôt que de l’affaiblir en simple « témoignage ».
- source_word: בֵּינִי וּבֵינְךָ
  choice: entre moi et toi
  rationale: La formulation garde l’expression directe et singulière des deux parties.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent moderne et direct de l’adverbe temporel hébreu; sa place initiale produit une phrase française naturelle.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution introduit clairement et naturellement l’explication étiologique du nom.
- source_word: קָרָא שְׁמוֹ
  choice: on l’appela
  rationale: Le sujet exact du masculin singulier est ambigu en contexte, Laban ou Jacob pouvant être envisagé. Le pronom indéfini français préserve cette indétermination tout en rendant idiomatiquement la formule de dénomination.
- source_word: גַּלְעֵד
  choice: Galed
  rationale: Le nom est translittéré dans le texte; sa relation sonore et sémantique avec גַּל et עֵד est expliquée en note.
