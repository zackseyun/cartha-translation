source:
  edition: WLC
  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: fr
  text: 'J’ai le pouvoir de vous faire du mal, mais le Dieu de votre père m’a parlé la nuit dernière et m’a dit : « Garde-toi de parler à Jacob, que ce soit en bien ou en mal[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du bien jusqu’au mal ». Cette expression hébraïque englobe toute la gamme des paroles, favorables ou hostiles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: J’ai le pouvoir
  rationale: Cette tournure hébraïque exprime la capacité effective d’agir. « J’ai le pouvoir » est naturel en français et conserve l’affirmation de puissance de Laban.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: de vous faire du mal
  rationale: Dans ce contexte, רָע désigne le tort que Laban pourrait infliger à Jacob et aux siens. « Faire du mal » rend clairement cette menace sans la réduire à une notion abstraite de mal moral.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: mais le Dieu de votre père
  rationale: Le waw introduit ici un contraste entre le pouvoir revendiqué par Laban et l’intervention divine qui le limite. « Votre père » garde le nom singulier tout en respectant le suffixe pluriel lié aux destinataires.
- source_word: אֶמֶשׁ
  choice: la nuit dernière
  rationale: Le mot renvoie ici à la nuit précédente, conformément au récit du rêve de Laban.
- source_word: הִשָּׁמֶר לְךָ
  choice: Garde-toi
  rationale: Cette formulation restitue la force de l’impératif d’avertissement et la prohibition qui suit, dans un registre digne mais encore courant.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: de parler à Jacob
  rationale: Avec הִשָּׁמֶר et מִן, la construction exprime une défense. « Garde-toi de parler » en rend naturellement la portée.
- source_word: מִטּוֹב עַד רָע
  choice: que ce soit en bien ou en mal
  rationale: Cette traduction conserve les deux pôles de l’expression hébraïque tout en faisant entendre qu’aucune parole, favorable ou hostile, ne doit être adressée à Jacob.
theological_decisions:
- issue: Désignation de la divinité qui avertit Laban
  choice: le Dieu de votre père
  alternative: le Dieu de vos pères
  rationale: Le nom « père » est singulier dans l’hébreu. La traduction maintient la référence personnelle au Dieu du père de Jacob sans développer ni préciser davantage son contenu théologique.
- issue: Portée de l’interdiction divine concernant la parole de Laban
  choice: que ce soit en bien ou en mal
  alternative: ne lui dis absolument rien
  rationale: L’expression idiomatique peut signifier que Laban ne doit rien dire ou entreprendre de sa propre initiative, mais le texte conserve explicitement la polarité « bien / mal ». La traduction la maintient afin de ne pas résoudre une ambiguïté réelle du passage.
translation_notes:
  register: Français international moderne, clair et digne. « Garde-toi » maintient la force solennelle de l’avertissement divin; le reste de la phrase privilégie des formulations courantes et immédiatement compréhensibles.
