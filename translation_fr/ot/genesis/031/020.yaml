  yaml_path: translation/ot/genesis/031/020.yaml
  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: fr
  text: Jacob trompa Laban l’Araméen en ne lui disant pas qu’il s’enfuyait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Jacob vola le cœur de Laban l’Araméen », expression hébraïque signifiant qu’il le trompa ou le prit au dépourvu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת לֵב
  choice: trompa
  rationale: L’expression hébraïque signifie littéralement « voler le cœur de », mais elle désigne ici le fait d’agir à l’insu de quelqu’un, de le tromper ou de le prendre au dépourvu. « Trompa » restitue clairement le sens idiomatique sans suggérer à tort que Jacob aurait gagné l’affection de Laban.
- source_word: הָאֲרַמִּי
  choice: l’Araméen
  rationale: Cette désignation ethnique et géographique correspond directement à l’hébreu et est plus précise que le traditionnel « le Syrien ».
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: en ne lui disant pas
  rationale: Cette formulation naturelle exprime le moyen par lequel Jacob agit à l’insu de Laban.
- source_word: כִּי בֹרֵחַ הוּא
  choice: qu’il s’enfuyait
  rationale: Le participe hébreu présente la fuite comme une action en cours ou immédiate ; l’imparfait français en rend naturellement l’aspect dans le discours indirect.
