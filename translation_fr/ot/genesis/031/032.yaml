base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: fr
  text: « Celui chez qui tu trouveras tes dieux ne vivra pas.[a] Devant nos frères[b], identifie ce qui t’appartient chez moi et prends-le pour toi. » Jacob ne savait pas que Rachel les avait volés.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut exprimer ici une sentence ou une malédiction.
    reason: lexical_alternative
  - marker: b
    text: Le mot « frères » peut désigner ici plus largement les hommes de la parenté ou du groupe présents, et non uniquement des frères biologiques.
    reason: cultural_note
  - marker: c
    text: Le pronom « les » renvoie aux dieux de Laban, c’est-à-dire à ses dieux domestiques.
    reason: clarification
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: Celui chez qui tu trouveras
  rationale: Rend directement la construction hébraïque avec son relatif indéfini et maintient Laban comme sujet de « trouver », sans recourir au passif.
- source_word: אֱלֹהֶיךָ
  choice: tes dieux
  rationale: Traduction littérale du pluriel; le contexte identifie ces objets comme les dieux domestiques de Laban sans qu’il soit nécessaire de l’expliciter dans le corps du verset.
- source_word: לֹא יִחְיֶה
  choice: ne vivra pas
  rationale: Conserve la formulation brève et solennelle de la sentence ou malédiction, sans trancher entre valeur juridique, volitive ou prédictive.
- source_word: נֶגֶד אַחֵינוּ
  choice: Devant nos frères
  rationale: Préserve le terme concret « frères » et l’idée d’une vérification publique en leur présence.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: reconnais ce qui t’appartient parmi mes biens
  rationale: Exprime naturellement l’injonction d’examiner et d’identifier les biens de Laban qui pourraient se trouver en possession de Jacob; « parmi mes biens » rend l’ellipse contextuelle de מָה עִמָּדִי.
- source_word: וְקַח לָךְ
  choice: et reprends-le
  rationale: « Reprendre » convient à un propriétaire invité à récupérer son bien; le pronom singulier reprend collectivement « ce qui t’appartient ».
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: Jacob ignorait
  rationale: Formulation narrative française naturelle pour indiquer l’absence de connaissance au moment de la déclaration.
- source_word: גְּנָבָתַם
  choice: les avait volés
  rationale: Le plus-que-parfait marque l’antériorité du vol, et le pluriel renvoie aux dieux.
theological_decisions:
- issue: Nature de la déclaration « ne vivra pas »
  choice: Maintien de la formulation « ne vivra pas »
  alternative: « sera mis à mort » ou « qu’il ne vive pas »
  rationale: L’hébreu peut fonctionner comme sentence ou malédiction; une formulation plus explicite résoudrait indûment cette tension.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond au dialogue familial et conflictuel. La syntaxe conserve la force solennelle de la déclaration de Jacob tout en restant naturelle.
