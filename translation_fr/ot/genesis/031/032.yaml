  to: « Celui chez qui tu trouveras tes dieux ne vivra pas.[a] Devant nos frères[b], identifie ce qui t’appartient chez moi et prends-le pour toi. » Jacob ne savait pas que Rachel les avait volés.[c]
  rationale: La révision retire deux nuances non exprimées (« parmi mes biens », « reprends »), rend plus directement l’injonction d’identifier ce qui appartient à Laban et conserve le datif de bénéfice dans « pour toi ». Les ancres et les trois notes sont conservées; la note a est resserrée afin de ne pas proposer une paraphrase moins fidèle tout en préservant l’ambiguïté de l’hébreu.
