  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: fr
  text: Il s’enfuit avec tout ce qui lui appartenait ; il se leva, traversa le fleuve[a] et se dirigea vers la région montagneuse de Galaad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « traversa l’Euphrate » ; l’hébreu dit simplement « le fleuve », qui désigne probablement ici l’Euphrate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: Il s’enfuit
  rationale: Le verbe ברח exprime la fuite ou un départ clandestin. « S’enfuit » est concis et garde la pression narrative sans ajouter de motif.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: avec tout ce qui lui appartenait
  rationale: Cette formulation reste assez large pour englober les membres de sa maisonnée, les troupeaux et les biens, sans réduire le sens aux seules possessions matérielles.
- source_word: וַיָּקָם
  choice: Il se mit en route
  rationale: Dans cette séquence narrative, קום marque le passage à l’action. Le français idiomatique « se mit en route » rend mieux la fonction du verbe qu’un littéral « se leva », sans modifier la direction du déplacement.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: traversa le Fleuve
  rationale: עבר signifie « traverser ». Avec l’article et dans ce contexte géographique, « le Fleuve » est probablement une désignation conventionnelle de l’Euphrate; la majuscule en signale la valeur géographique tout en conservant l’expression hébraïque.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: se dirigea vers
  rationale: Littéralement, l’expression signifie « plaça/tourna son visage ». « Se dirigea vers » transmet naturellement en français l’orientation délibérée exprimée par l’idiome.
- source_word: הַר הַגִּלְעָד
  choice: la région montagneuse de Galaad
  rationale: הַר peut désigner une montagne, un massif ou une région montagneuse. Ici, le sens régional convient à la géographie et évite de présenter Galaad comme un sommet unique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les formulations idiomatiques « se mit en route » et « se dirigea vers » évitent des calques peu naturels, tandis que « le Fleuve » conserve la désignation géographique du texte source et son degré d’explicitation.
