revisions:
- from: Il s’enfuit donc avec tout ce qui lui appartenait. Il se mit en route, traversa le Fleuve[a] et se dirigea vers la région montagneuse de Galaad.
  to: Il s’enfuit avec tout ce qui lui appartenait ; il se leva, traversa le fleuve[a] et se dirigea vers la région montagneuse de Galaad.
  rationale: La révision retire l’inférence causale ajoutée par « donc » et rend וַיָּקָם de manière plus directe. Elle conserve les choix justes concernant l’étendue des biens et de la maisonnée, l’orientation vers Galaad, et le sens régional de הַר. La note continue de distinguer le libellé hébreu de son identification géographique probable.
