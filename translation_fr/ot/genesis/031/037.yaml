    rationale: Dans ce contexte de différend soumis à des témoins, le verbe a une nuance judiciaire ou arbitrale. « Qu’ils jugent entre nous deux » est à la fois plus proche du sens et plus naturel que « qu’ils tranchent entre nous deux ».
