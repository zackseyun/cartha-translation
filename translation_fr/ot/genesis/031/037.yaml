  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: fr
  text: Puisque tu as fouillé toutes mes affaires, parmi tous les biens de ta maisonnée, qu’as-tu trouvé ? Dépose-le ici devant mes frères et tes frères[a], et qu’ils jugent entre nous deux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frères » peut aussi désigner plus largement les proches ou les membres du clan.
    reason: lexical_scope
  - marker: b
    text: Ou « qu’ils tranchent entre nous deux ». Le verbe hébreu peut avoir un sens judiciaire ou arbitral.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: tu as fouillé
  rationale: Le verbe évoque littéralement le fait de tâter ou palper, mais désigne ici une fouille minutieuse des effets de Jacob. « Fouiller » rend naturellement l’action en français sans effacer son caractère concret.
- source_word: כָּל כֵּלַי
  choice: toutes mes affaires
  rationale: כְּלִי peut désigner un objet, un ustensile ou un bien mobilier. Dans ce contexte domestique, « affaires » couvre naturellement l’ensemble des possessions examinées.
- source_word: מַה מָּצָאתָ מִכֹּל כְּלֵי בֵיתֶךָ
  choice: qu’as-tu trouvé qui fasse partie des biens de ta maison ?
  rationale: Cette formulation rend la valeur partitive de מִן et évite de laisser entendre que la fouille aurait eu lieu dans la maison de Laban. « Les biens de ta maison » désigne les possessions appartenant à sa maisonnée.
- source_word: שִׂים כֹּה
  choice: Dépose-le ici
  rationale: L’impératif exige que tout objet prétendument volé soit produit publiquement. « Dépose-le ici » est direct, naturel et adapté à la scène.
- source_word: נֶגֶד
  choice: devant
  rationale: Le terme indique une présentation publique en présence de témoins ; « devant » en conserve la concision.
- source_word: אַחַי וְאַחֶיךָ
  choice: mes frères et tes frères
  rationale: La traduction conserve le terme familial ordinaire du texte hébreu, tout en signalant en note qu’il peut englober des parents ou des membres du clan.
- source_word: וְיוֹכִיחוּ
  choice: qu’ils tranchent
  rationale: À la forme causative, יכח possède ici un sens judiciaire ou arbitral. « Trancher » exprime clairement le règlement du différend sans imposer l’idée d’un tribunal institutionnel.
- source_word: בֵּין שְׁנֵינוּ
  choice: entre nous deux
  rationale: Le français conserve l’insistance explicite du duel hébreu sur les deux parties au conflit.
