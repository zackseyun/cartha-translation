  naturalness: Le français est globalement naturel et le registre convient. « Parmi tous les biens de ta maisonnée, qu’as-tu trouvé ? » est plus fluide et moins périphrastique. « Juger entre nous deux » est plus idiomatique et plus proche du registre de règlement public du différend que « trancher entre nous deux ».
