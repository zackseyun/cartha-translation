base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: fr
  text: 'Il dit : « Je t’en prie, lève les yeux et regarde : tous les boucs qui montent les femelles du troupeau[a] sont rayés[b], mouchetés et tachetés, car j’ai vu tout ce que Laban te fait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui montent le troupeau ». L’expression hébraïque appartient au vocabulaire de la reproduction animale.'
    reason: lexical_alternative
  - marker: b
    text: On traduit aussi traditionnellement le terme hébreu par « annelés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ וּרְאֵה
  choice: Lève donc les yeux et regarde
  rationale: L’expression signifie regarder en levant les yeux. « donc » rend discrètement la particule נָא sans donner à l’ordre un ton artificiellement cérémonieux.
- source_word: הָעַתֻּדִים
  choice: les boucs
  rationale: Le terme désigne ici les mâles des chèvres ; « boucs » est le mot français courant et précis.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: qui s’accouplent avec les bêtes du troupeau
  rationale: Dans ce contexte d’élevage, l’expression hébraïque désigne les mâles qui montent les femelles. Cette formulation française en communique naturellement le sens tout en conservant la référence collective au troupeau.
- source_word: עֲקֻדִּים
  choice: rayés
  rationale: Le mot évoque des marques en bandes ou en raies. « Rayés » est clair en français moderne ; la traduction traditionnelle « annelés » est signalée en note.
- source_word: נְקֻדִּים
  choice: mouchetés
  rationale: Le terme désigne de petites taches ou mouchetures et reste ainsi distinct du qualificatif suivant.
- source_word: וּבְרֻדִּים
  choice: tachetés
  rationale: Le mot décrit une robe bigarrée ou marquée de taches. « Tachetés » est immédiatement compréhensible et maintient autant que possible la distinction avec « mouchetés ».
- source_word: כִּי רָאִיתִי
  choice: car j’ai vu
  rationale: Le parfait exprime une perception accomplie ayant une portée présente, et כִּי introduit ici la raison.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: tout ce que Laban te fait
  rationale: Le participe עֹשֶׂה présente l’action comme en cours. « Te fait » rend la manière dont Laban traite Jacob, plutôt qu’un sens bénéfique « fait pour toi ».
