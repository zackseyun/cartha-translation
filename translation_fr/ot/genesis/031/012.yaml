  - severity: low
    issue: « qui s’accouplent avec les bêtes du troupeau »
    rationale: La formulation est compréhensible, mais « bêtes » est vague et l’expression « s’accoupler avec le troupeau » sonne peu naturelle. L’idiome hébreu désigne les mâles qui montent les femelles; l’explicitation est justifiée pour un français fluide.
