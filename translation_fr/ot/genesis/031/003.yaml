  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: fr
  text: 'Alors Yahweh dit à Jacob : « Retourne au pays de tes pères et auprès de ta parenté[a], et je serai avec toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers ton lieu d’origine » ou « dans ton pays natal » ; le terme hébreu peut désigner la parenté aussi bien que le lieu d’origine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » restitue naturellement cette succession en français sans alourdir la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel employé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: שׁוּב
  choice: Retourne
  rationale: L’impératif exprime ici le retour vers le pays d’origine de Jacob. « Retourne » est direct, naturel et adapté à la parole divine.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: dans le pays de tes pères
  rationale: Cette formulation suit étroitement la construction hébraïque et conserve le terme familial masculin « pères ».
- source_word: וּלְמוֹלַדְתֶּךָ
  choice: et vers ta parenté
  rationale: מוֹלֶדֶת peut désigner le groupe familial ou le lieu d’origine. Dans ce contexte, « ta parenté » rend bien la dimension relationnelle tout en laissant l’autre sens en note.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: et je serai avec toi
  rationale: Cette traduction directe et idiomatique conserve la promesse de la présence divine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en conserve la fonction de nom personnel et correspond à la translittération retenue.
- issue: Portée de מוֹלֶדֶת
  choice: ta parenté
  alternative: ton pays natal
  rationale: Le mot peut renvoyer soit aux proches, soit au lieu d’origine. Le texte principal retient le sens familial, plausible auprès de « pays de tes pères », tandis que la note maintient explicitement l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle ; le tutoiement convient à l’adresse directe de Dieu à Jacob.
