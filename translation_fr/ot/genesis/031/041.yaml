base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: fr
  text: Voilà vingt ans que je suis chez toi. Je t’ai servi quatorze ans pour tes deux filles, et six ans pour ton troupeau, et tu as changé mon salaire dix fois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה בְּבֵיתֶךָ
  choice: Voilà vingt ans que je suis chez toi
  rationale: Cette tournure française naturelle exprime la durée récapitulative de l’idiome hébreu, tout en rendant בְּבֵיתֶךָ de manière relationnelle et idiomatique. Le sens concret de « maison » demeure possible, mais « chez toi » convient mieux ici au séjour de Jacob auprès de Laban.
- source_word: עֲבַדְתִּיךָ
  choice: Je t’ai servi
  rationale: « Servir » conserve à la fois l’idée du travail accompli et la relation de service envers Laban.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: quatorze ans pour tes deux filles
  rationale: La préposition בְּ marque ici ce en vue de quoi le service a été rendu; « pour » restitue sobrement l’accord matrimonial sans l’expliciter davantage.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: et six ans pour ton troupeau
  rationale: צֹאן désigne collectivement le petit bétail, notamment moutons et chèvres; « troupeau » garde cette portée générale.
- source_word: וַתַּחֲלֵף אֶת מַשְׂכֻּרְתִּי
  choice: et tu as changé mon salaire
  rationale: Le verbe חלף au causatif signifie changer ou substituer, tandis que מַשְׂכֹּרֶת désigne la rémunération; cette formulation est directe et courante.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: dix fois
  rationale: Il s’agit d’une expression idiomatique indiquant des changements répétés; une traduction littérale par « comptes » ou « dénombrements » serait obscure en français.
