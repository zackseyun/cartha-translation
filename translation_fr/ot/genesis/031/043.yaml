  text: וַ/יַּ֨עַן לָבָ֜ן וַ/יֹּ֣אמֶר אֶֽל יַעֲקֹ֗ב הַ/בָּנ֨וֹת בְּנֹתַ֜/י וְ/הַ/בָּנִ֤ים בָּנַ/י֙ וְ/הַ/צֹּ֣אן צֹאנִ֔/י וְ/כֹ֛ל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לִ/י ה֑וּא וְ/לִ/בְנֹתַ֞/י מָֽה אֶֽעֱשֶׂ֤ה לָ/אֵ֨לֶּה֙ הַ/יּ֔וֹם א֥וֹ לִ/בְנֵי/הֶ֖ן אֲשֶׁ֥ר יָלָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: fr
  text: 'Laban répondit à Jacob : « Ces filles sont mes filles, ces fils sont mes fils, ce troupeau est mon troupeau, et tout ce que tu vois est à moi. Mais que pourrais-je faire aujourd’hui pour mes filles que voici, ou pour leurs enfants[a], ceux qu’elles ont mis au monde ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à leurs fils », si בְּנֵיהֶן désigne ici plus précisément les descendants masculins plutôt que les enfants en général.'
    reason: Alternative lexicale réelle du substantif hébreu בָּנִים.
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: Laban répondit à Jacob
  rationale: En français narratif, « répondit » rend naturellement la formule hébraïque « répondit et dit » sans reproduire une redondance peu idiomatique.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: Ces filles sont mes filles
  rationale: Le démonstratif français restitue la référence aux femmes présentes, tandis que la répétition conserve l’insistance possessive de Laban.
- source_word: וְהַבָּנִים בָּנַי
  choice: ces fils sont mes fils
  rationale: « Fils » garde ici le sens masculin de בָּנִים et le parallélisme avec « filles ».
- source_word: וְהַצֹּאן צֹאנִי
  choice: ce troupeau est mon troupeau
  rationale: צֹאן désigne collectivement le petit bétail ; « troupeau » est naturel et préserve la répétition emphatique.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: et tout ce que tu vois est à moi
  rationale: Cette formulation concise reproduit directement la revendication possessive.
- source_word: מָה אֶעֱשֶׂה ... לְ
  choice: que pourrais-je faire ... à
  rationale: Le conditionnel traduit la portée rhétorique de l’imparfait hébreu sans décider si Laban exprime une incapacité réelle ou une absence d’intention ; « faire à » convient aux personnes susceptibles de subir son action.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent moderne, direct et idiomatique de l’adverbe temporel.
- source_word: לִבְנֹתַי ... לָאֵלֶּה
  choice: à mes filles que voici
  rationale: La tournure rend à la fois le possessif et le démonstratif hébreux dans un français digne et naturel.
- source_word: לִבְנֵיהֶן
  choice: à leurs enfants
  rationale: Dans ce contexte généalogique, בָּנִים peut désigner l’ensemble de la descendance ; l’autre lecture, « fils », est signalée en note.
- source_word: אֲשֶׁר יָלָדוּ
  choice: ceux qu’elles ont mis au monde
  rationale: La formule rend explicitement l’acte maternel exprimé par יָלַד et rattache sans ambiguïté le sujet aux filles.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La redondance hébraïque « répondit et dit » est allégée selon l’usage français, mais les répétitions possessives centrales de la déclaration de Laban sont conservées. Le conditionnel « pourrais-je » maintient le caractère rhétorique et potentiellement intéressé de ses paroles.
