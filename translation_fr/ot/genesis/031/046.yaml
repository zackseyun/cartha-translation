translation_notes:
  register: Français international moderne, simple et digne. La syntaxe narrative reste proche de l’hébreu tout en évitant une succession pesante de « et ». Les deux ambiguïtés principales, concernant « frères » et la préposition עַל, sont préservées par des notes.
