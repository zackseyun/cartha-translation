  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: fr
  text: 'Alors Jacob dit à ses frères[a] : « Ramassez des pierres. » Ils prirent donc des pierres et en firent un tas, puis ils mangèrent là, près du tas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « frères » peut désigner plus largement les hommes de la parenté de Jacob ou ses compagnons, et pas seulement ses frères au sens strict.
    reason: cultural_note
  - marker: b
    text: 'Ou : « sur le tas ». La préposition hébraïque peut se comprendre plus littéralement ainsi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: à ses frères
  rationale: Le sens premier de אָח est « frère », mais le terme peut aussi désigner des hommes apparentés ou des compagnons. La traduction conserve le terme source, tandis qu’une note signale son extension possible dans ce contexte.
- source_word: לִקְטוּ אֲבָנִים
  choice: Ramassez des pierres
  rationale: L’impératif לקט exprime l’action de recueillir ou ramasser des objets. « Ramassez » est naturel en français pour des pierres prises au sol.
- source_word: וַיַּעֲשׂוּ גָל
  choice: en firent un tas
  rationale: גַּל désigne ici un amas de pierres. « Tas » est direct, courant et compréhensible, sans imposer le terme plus technique « cairn ».
- source_word: עַל הַגָּל
  choice: près du tas
  rationale: La préposition עַל signifie souvent « sur », mais peut aussi situer une action auprès ou à proximité de quelque chose. « Près du tas » rend naturellement la scène tout en conservant le sens plus littéral en note.
