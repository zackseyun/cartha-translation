base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: fr
  text: 'Alors Rachel et Léa lui répondirent : « Avons-nous encore une part et un héritage dans la maison de notre père[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, la « maison » peut désigner non seulement l’habitation, mais aussi la famille, son domaine et son patrimoine.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַרְנָה לֹו
  choice: lui répondirent
  rationale: Le français exprime naturellement la réponse et son destinataire par « lui répondirent ». La formule hébraïque redondante « répondirent et dirent » n’a pas besoin d’être reproduite littéralement.
- source_word: רָחֵל וְלֵאָה
  choice: Rachel et Léa
  rationale: Formes françaises usuelles des noms propres bibliques.
- source_word: הַעוֹד
  choice: encore
  rationale: '« Encore » conserve la nuance temporelle et interrogative : elles demandent si une part leur reste toujours.'
- source_word: לָנוּ
  choice: avons-nous
  rationale: La tournure possessive française rend naturellement le datif hébreu « pour nous ».
- source_word: חֵלֶק
  choice: une part
  rationale: Dans ce contexte patrimonial, « part » désigne clairement ce qui revient à chacune dans les biens familiaux.
- source_word: וְנַחֲלָה
  choice: un héritage
  rationale: « Héritage » rend le bien ou droit patrimonial transmis au sein de la famille.
- source_word: בְּבֵית אָבִינוּ
  choice: dans la maison de notre père
  rationale: Cette formulation reste proche de l’hébreu tout en étant naturelle; « maison » peut englober ici la maisonnée, le domaine et le patrimoine familial.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le pluriel « répondirent » respecte le fait que Rachel et Léa parlent ensemble. La coordination « une part et un héritage » conserve les deux termes distincts de l’hébreu.
