  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: fr
  text: 'S’il disait : « Les bêtes tachetées seront ton salaire », tout le troupeau donnait naissance à des petits tachetés ; et s’il disait : « Les bêtes rayées seront ton salaire », tout le troupeau donnait naissance à des petits rayés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: bêtes tachetées / petits tachetés
  rationale: Le terme désigne des animaux marqués de petites taches. L’ajout de « bêtes » puis de « petits » rend explicites en français les référents naturellement compris dans l’hébreu.
- source_word: עֲקֻדִּים
  choice: bêtes rayées / petits rayés
  rationale: Le terme décrit ici des animaux portant des bandes ou rayures; « rayées » est naturel et distinct de « tachetées ».
- source_word: הַצֹּאן
  choice: le petit bétail
  rationale: Le nom collectif peut englober brebis et chèvres; « petit bétail » conserve cette portée mieux que « troupeau » seul.
- source_word: וְיָלְדוּ
  choice: mettait bas
  rationale: Dans ce contexte animal, « mettre bas » rend précisément le verbe enfanter, avec un imparfait français exprimant la répétition dans le récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La construction conditionnelle répétée de l’hébreu est conservée, sans ajouter « alors », et le contraste entre les deux types de marques reste net.
