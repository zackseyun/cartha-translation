base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: fr
  text: Laban entra dans la tente de Jacob, dans celle de Léa et dans celle des deux servantes, mais il ne trouva rien[a]. Puis il sortit de la tente de Léa et entra dans celle de Rachel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mais il ne trouva pas » ; l’objet n’est pas exprimé en hébreu. D’après le contexte, il s’agit des dieux domestiques que Laban recherchait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entra
  rationale: Avec la préposition בְּ, le verbe בוא exprime ici un mouvement vers l’intérieur. « Entra » est naturel en français narratif et convient à chacune des étapes de la fouille.
- source_word: אֹהֶל
  choice: tente
  rationale: Le sens concret ordinaire est « tente » ; il convient au cadre patriarcal et ne doit pas être généralisé en « demeure ».
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: les deux servantes
  rationale: אָמָה désigne une femme en position de servitude. « Servantes » est clair en français moderne, tout en évitant de préciser davantage que ne le fait ce contexte immédiat la nature juridique de leur condition.
- source_word: וְלֹא מָצָא
  choice: mais il ne trouva pas ce qu’il cherchait
  rationale: L’objet de מָצָא n’est pas exprimé en hébreu mais se comprend par le contexte. Cette formulation française reste fluide sans nommer directement les dieux domestiques ; une note signale l’ellipse du texte source.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: Il sortit alors de la tente de Léa
  rationale: יצא signifie « sortir ». « Alors » rend naturellement la progression narrative portée par le waw consécutif.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: et entra dans celle de Rachel
  rationale: La répétition du verbe de mouvement est conservée, tandis que « celle » évite une répétition lourde de « tente » en français.
theological_decisions: []
