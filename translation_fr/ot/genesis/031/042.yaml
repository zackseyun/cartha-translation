id: GEN.31.42
reference: Genesis 31:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: fr
  text: Si le Dieu de mon père, le Dieu d’Abraham et la Crainte d’Isaac[a] n’avait pas été avec moi, tu m’aurais certainement maintenant renvoyé les mains vides. Dieu a vu mon affliction et le travail de mes mains, et il a rendu son jugement la nuit dernière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qu’Isaac craint ». L’hébreu dit littéralement « la Crainte d’Isaac », titre distinctif donné ici à Dieu.'
    reason: Signaler le caractère inhabituel du titre divin et fournir une autre compréhension possible sans résoudre l’ambiguïté dans le texte.
lexical_decisions:
- source_word: לוּלֵי
  choice: Si … n’avait pas été
  rationale: Introduit une condition contraire aux faits ; cette construction rend naturellement la valeur irréelle en français.
- source_word: אֱלֹהֵי אָבִי
  choice: le Dieu de mon père
  rationale: Rend directement la chaîne construite et préserve l’appel de Jacob au Dieu de sa lignée.
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: le Dieu d’Abraham
  rationale: Traduction formelle et naturelle de l’expression hébraïque.
- source_word: וּפַחַד יִצְחָק
  choice: et la Crainte d’Isaac
  rationale: Conserve le titre divin inhabituel et l’ambiguïté expressive du mot פַחַד, plutôt que de le remplacer dans le texte par une explication.
- source_word: הָיָה לִי
  choice: avait été avec moi
  rationale: Dans ce contexte, l’expression indique la présence favorable et le soutien de Dieu.
- source_word: כִּי עַתָּה
  choice: certainement
  rationale: Marque avec force la conséquence qui se serait déjà produite ; la valeur temporelle est suffisamment portée par le plus-que-parfait et le conditionnel passé français.
- source_word: רֵיקָם
  choice: les mains vides
  rationale: Expression française idiomatique désignant un départ sans biens ni rémunération.
- source_word: שִׁלַּחְתָּנִי
  choice: tu m’aurais renvoyé
  rationale: Le conditionnel passé convient à la conséquence irréelle ; « renvoyé » exprime ici le fait de congédier Jacob.
- source_word: עָנְיִי
  choice: mon affliction
  rationale: Désigne largement la détresse et les mauvais traitements subis, sans réduire le sens à la pauvreté matérielle.
- source_word: יְגִיעַ כַּפַּי
  choice: le travail de mes mains
  rationale: Reproduit clairement l’image hébraïque du labeur personnel.
- source_word: רָאָה אֱלֹהִים
  choice: Dieu a vu
  rationale: Le passé composé s’intègre naturellement au récit français et exprime l’intervention divine récente.
- source_word: וַיּוֹכַח
  choice: et il a rendu son jugement
  rationale: Le verbe peut signifier juger, trancher ou reprendre. Cette formulation conserve sa nuance judiciaire sans ajouter l’objet « te », absent de l’hébreu.
- source_word: אָמֶשׁ
  choice: la nuit dernière
  rationale: Équivalent français naturel de l’indication temporelle, en référence au songe de Laban.
theological_decisions:
- issue: Le titre divin וּפַחַד יִצְחָק
  choice: la Crainte d’Isaac
  alternative: Celui qu’Isaac craint
  rationale: Le texte hébreu emploie un titre singulier pour Dieu. Le conserver maintient sa texture théologique et son ambiguïté, tandis que la note donne l’interprétation relationnelle possible.
- issue: Le sens de וַיּוֹכַח
  choice: il a rendu son jugement
  alternative: il a repris ; il a tranché
  rationale: Le contexte évoque l’avertissement adressé à Laban, mais l’hébreu ne nomme aucun objet. La traduction retenue préserve la dimension judiciaire sans préciser indûment qui est repris.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conditionnelle est fluide, les images hébraïques importantes sont conservées, et la formulation n’ajoute pas de destinataire au dernier verbe.
