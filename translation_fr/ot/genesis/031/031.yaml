  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: fr
  text: 'Jacob répondit à Laban : « J’avais peur, car je me disais que tu pourrais m’arracher tes filles. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: répondit
  rationale: En français naturel, « répondit » exprime à lui seul la formule hébraïque de réponse suivie de parole; « répondit et dit » serait inutilement lourd.
- source_word: כִּי יָרֵאתִי
  choice: J’avais peur
  rationale: Le premier כִּי introduit la raison de la fuite secrète; la formulation française directe conserve cette valeur causale dans le contexte de la réponse.
- source_word: כִּי אָמַרְתִּי
  choice: car je me disais
  rationale: אמר signifie littéralement « dire », mais désigne ici une parole intérieure. « Je me disais » reste proche de l’image hébraïque tout en étant idiomatique.
- source_word: פֶּן
  choice: Tu pourrais
  rationale: פֶּן introduit un événement redouté. Le conditionnel de possibilité intégré à la citation rend naturellement cette appréhension en français moderne.
- source_word: תִּגְזֹל
  choice: m’arracher ... de force
  rationale: Le verbe גזל évoque une dépossession violente ou injuste. « Arracher de force » en préserve l’intensité sans traiter les filles comme de simples biens volés.
- source_word: בְּנוֹתֶיךָ מֵעִמִּי
  choice: m’arracher tes filles
  rationale: Cette construction française exprime clairement que Laban aurait séparé ses filles de Jacob, tout en conservant le lien familial marqué par « tes filles ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et oralement fluide. La redondance narrative hébraïque « répondit et dit » est condensée selon l’usage français, tandis que la force de גזל est explicitement maintenue par « arracher ... de force ».
