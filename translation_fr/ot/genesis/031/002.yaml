  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: fr
  text: Jacob observa le visage de Laban et voici que Laban n’était plus disposé envers lui comme auparavant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’était pas avec lui comme hier et avant-hier »; cette expression signifie que l’attitude de Laban envers Jacob avait changé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: observa
  rationale: Le verbe ראה désigne ici la perception attentive de Jacob. « Observa » convient naturellement à la mention du visage et n’ajoute pas une conclusion étrangère au contexte.
- source_word: פְּנֵי לָבָן
  choice: le visage de Laban
  rationale: Cette formulation conserve l’image concrète de l’hébreu, où le visage manifeste la disposition ou l’attitude d’une personne.
- source_word: וְהִנֵּה
  choice: il était évident que
  rationale: Dans ce contexte, הִנֵּה attire l’attention sur ce que Jacob constate. Cette tournure restitue sa fonction narrative en français courant sans recourir à l’archaïsant « voici ».
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: celui-ci n’était plus disposé envers lui
  rationale: Littéralement, l’expression signifie « il n’était pas avec lui »; dans ce contexte, elle décrit la disposition changée de Laban envers Jacob. « Celui-ci » clarifie le référent sans effacer la relation exprimée par עִם.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: comme auparavant
  rationale: L’expression idiomatique, littéralement « comme hier et avant-hier », signifie « comme autrefois » ou « comme auparavant ». Le choix retenu est naturel et précis en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La traduction conserve l’image du visage tout en explicitant sobrement l’idiome relationnel hébreu; le sens littéral est signalé en note.
