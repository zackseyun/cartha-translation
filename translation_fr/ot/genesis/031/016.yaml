  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: fr
  text: Car toute la richesse que Dieu a retirée[a] à notre père est à nous et à nos enfants. Maintenant, fais donc tout ce que Dieu t’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a délivrée » ou « a arrachée ». Le verbe hébreu exprime souvent l’idée de délivrance ; ici, il désigne la richesse que Dieu a retirée à Laban pour la donner à la famille de Jacob.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison donnée par Rachel et Léa pour approuver la décision de Jacob.
- source_word: כָל הָעֹשֶׁר
  choice: toute la richesse
  rationale: עֹשֶׁר désigne la richesse ou les biens; cette formulation naturelle reste assez large pour inclure les troupeaux et les autres avoirs.
- source_word: הִצִּיל
  choice: a retirée
  rationale: Le hiphil de נצל signifie souvent « délivrer » ou « arracher », mais il décrit ici la richesse soustraite à Laban et attribuée à la maison de Jacob. « Retirer à » exprime ce transfert sans suggérer nécessairement une saisie violente.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Traduction française usuelle lorsque אֱלֹהִים désigne le vrai Dieu dans ce récit.
- source_word: מֵאָבִינוּ
  choice: à notre père
  rationale: Avec « retirer », la préposition מן indiquant la provenance se rend naturellement par « à » en français.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: est à nous et à nos enfants
  rationale: Rend directement la possession ou le droit exprimé par les prépositions לְ et le pronom הוּא.
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: 'Marque la transition et la conséquence: après leur justification, les deux femmes exhortent Jacob à agir.'
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: tout ce que Dieu t’a dit
  rationale: Conserve la totalité de כֹּל אֲשֶׁר dans une tournure française naturelle.
- source_word: עֲשֵׂה
  choice: fais
  rationale: L’impératif bref reprend comme complément « tout ce que Dieu t’a dit » et préserve la concision de l’hébreu.
theological_decisions:
- issue: Action divine à l’égard de la richesse de Laban
  choice: a retirée à notre père
  alternative: a délivrée de notre père / a arrachée à notre père
  rationale: Le contexte présente les biens auparavant détenus par Laban comme revenant désormais à la famille de Jacob. « Retirer à » rend le transfert providentiel sans trancher davantage la portée morale de l’action; la note conserve le sens habituel de délivrance du verbe.
translation_notes:
  register: Français international moderne, naturel et digne. « Maintenant donc » restitue la transition logique; l’impératif « fais » conserve la brièveté de l’original. Le marqueur de note est placé après la proposition concernée par la variante lexicale.
