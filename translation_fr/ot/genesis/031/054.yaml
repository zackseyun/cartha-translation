  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: fr
  text: Alors Jacob offrit un sacrifice sur la montagne et appela ses frères[a] à manger du pain. Ils mangèrent du pain et passèrent la nuit sur la montagne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hommes de sa parenté » ou « ses proches » ; en hébreu, le mot « frères » peut aussi désigner, selon le contexte, des membres de la parenté ou des compagnons.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח יַעֲקֹב זֶבַח
  choice: Jacob offrit un sacrifice
  rationale: La construction associe le verbe זבח et le nom apparenté זֶבַח. « Offrit un sacrifice » conserve le sens cultuel sans reproduire en français la tournure lourde « sacrifia un sacrifice ».
- source_word: בָּהָר
  choice: sur la montagne
  rationale: הַר peut désigner une montagne, une hauteur ou une région montagneuse. L’article défini et la répétition du lieu dans ce récit favorisent « sur la montagne ».
- source_word: וַיִּקְרָא
  choice: appela
  rationale: קרא signifie d’abord « appeler ». Ici, l’appel tient lieu d’invitation, mais « appela » reste naturel et proche de la formulation hébraïque.
- source_word: לְאֶחָיו
  choice: ses frères
  rationale: אָח désigne des frères au sens propre, mais peut aussi s’étendre à des parents masculins ou à des compagnons. Le texte principal garde le terme familial direct, avec une note signalant son extension possible.
- source_word: לֶאֱכָל לָחֶם
  choice: à manger du pain
  rationale: L’expression signifie littéralement « manger du pain » et peut idiomatiquement désigner la prise d’un repas. La traduction conserve l’image et la répétition du texte source.
- source_word: וַיֹּאכְלוּ לֶחֶם
  choice: Ils mangèrent du pain
  rationale: Cette formulation maintient la répétition délibérée de לֶחֶם et la possible nuance de repas partagé liée au sacrifice.
- source_word: וַיָּלִינוּ
  choice: passèrent la nuit
  rationale: לון exprime le fait de loger ou de demeurer pendant la nuit. « Passèrent la nuit » est clair et courant en français moderne.
theological_decisions:
- issue: Portée de « ses frères » dans le contexte de l’alliance
  choice: « ses frères » dans le texte principal
  alternative: « ses parents » ou « les hommes de sa parenté »
  rationale: Le mot hébreu peut englober davantage que des frères biologiques, mais il emploie explicitement le langage de la fraternité. Le conserver évite de trancher silencieusement l’identité précise du groupe; la note présente les autres possibilités.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme excessif. Les répétitions « manger du pain / mangèrent du pain » et « sur la montagne » sont conservées parce qu’elles structurent le verset hébreu.
