  naturalness: « Jacob envoya appeler Rachel et Léa aux champs, auprès de son troupeau » est idiomatique en français moderne, narratif et concis. « Aux champs » est naturel dans ce cadre pastoral, bien que l'hébreu ait le singulier collectif « le champ ».
