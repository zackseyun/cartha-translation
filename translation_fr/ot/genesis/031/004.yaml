lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: envoya chercher
  rationale: Dans ce contexte, שׁלח introduit l’envoi destiné à faire venir Rachel et Léa. « Envoya chercher » exprime naturellement en français l’action implicite d’envoyer quelqu’un les appeler.
- source_word: וַיִּקְרָא
  choice: les fit venir
  rationale: Avec לְ suivi de personnes puis d’une destination, קרא signifie ici appeler ou convoquer. « Les fit venir » évite la lourdeur de « envoya et appela » tout en conservant le mouvement vers le lieu indiqué.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: Rachel et Léa
  rationale: Les noms propres sont rendus selon leurs formes françaises usuelles.
- source_word: הַשָּׂדֶה
  choice: aux champs
  rationale: שׂדה désigne ici la campagne ou les terres ouvertes où paît le troupeau. « Aux champs » est une expression française naturelle qui rend cette valeur locative.
- source_word: אֶל צֹאנוֹ
  choice: auprès de son troupeau
  rationale: La préposition אֶל marque normalement la direction vers un point; dans cette construction, la dernière expression précise vraisemblablement l’endroit où Jacob demande aux femmes de venir. « Auprès de son troupeau » rend clairement cette précision sans suggérer deux destinations indépendantes.
