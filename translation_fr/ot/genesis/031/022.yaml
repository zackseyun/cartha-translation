  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: fr
  text: Le troisième jour, on informa Laban que Jacob s’était enfui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: on informa
  rationale: Le hofal de נגד exprime ici la transmission passive d’une information. La tournure impersonnelle « on informa Laban » est naturelle en français moderne et n’ajoute aucun informateur précis.
- source_word: לְלָבָן
  choice: Laban
  rationale: La préposition לְ marque le destinataire de l’information; la syntaxe française le présente comme complément direct de « informa ».
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: Rendu direct de l’expression temporelle, sans ajouter « après cela », absent de l’hébreu.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de l’information rapportée, d’où la conjonction française « que ».
- source_word: בָרַח
  choice: s’était enfui
  rationale: ברח signifie « fuir, s’enfuir ». Le plus-que-parfait marque naturellement que la fuite avait précédé le moment où Laban en fut informé.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle et courante du nom propre.
