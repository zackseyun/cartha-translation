source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָבָ֖ן לְ/יַעֲקֹ֑ב הִנֵּ֣ה הַ/גַּ֣ל הַ/זֶּ֗ה וְ/הִנֵּה֙ הַ/מַצֵּבָ֔ה אֲשֶׁ֥ר יָרִ֖יתִי בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: fr
  text: 'Laban dit alors à Jacob : « Regarde ce tas de pierres[a], et regarde la stèle[b] que j’ai dressée entre moi et toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce monceau ». Le terme hébreu désigne ici l’amas de pierres élevé comme témoin entre Laban et Jacob.
    reason: lexical_alternative
  - marker: b
    text: Ou « la pierre dressée » ; le terme hébreu désigne une pierre érigée comme monument ou repère.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit alors
  rationale: Le waw consécutif fait progresser le récit ; « dit alors » en restitue naturellement la succession en français moderne.
- source_word: הִנֵּה … וְהִנֵּה
  choice: Regarde… et regarde
  rationale: La répétition de la particule attire deux fois l’attention sur les repères visibles ; elle est conservée pour rendre le parallélisme emphatique.
- source_word: הַגַּל הַזֶּה
  choice: ce tas de pierres
  rationale: Dans ce contexte, גַּל désigne l’amas de pierres érigé comme témoin. La formulation explicite évite que « tas » ou « tertre » soit compris comme une simple masse de terre.
- source_word: הַמַּצֵּבָה
  choice: la stèle
  rationale: מַצֵּבָה désigne ici une pierre dressée servant de monument ou de repère. « Stèle » est précis, naturel et distinct du tas de pierres.
- source_word: יָרִיתִי
  choice: j’ai dressée
  rationale: Avec מַצֵּבָה comme antécédent, le verbe exprime ici la mise en place de la pierre ; « dresser » convient idiomatiquement à une stèle, tout en laissant la note signaler la formulation hébraïque inhabituelle.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre moi et toi
  rationale: Rendu direct de la formule relationnelle, dont la tournure solennelle demeure naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « regarde » préserve l’insistance du texte hébreu. « Tas de pierres » rend le référent concret immédiatement compréhensible, tandis que « stèle » conserve la distinction entre les deux monuments.
