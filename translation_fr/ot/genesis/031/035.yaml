  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: fr
  text: 'Elle dit à son père : « Que mon seigneur ne se fâche pas contre moi si je ne peux pas me lever devant toi, car j’ai ce qui arrive aux femmes[a]. » Il fouilla donc, mais ne trouva pas les idoles domestiques[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Euphémisme désignant les règles, c’est-à-dire les menstruations.
    reason: clarification
  - marker: b
    text: 'Hébreu : « les téraphim », terme désignant des objets ou images cultuels domestiques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: Que mon seigneur ne se fâche pas contre moi
  rationale: L’expression hébraïque signifie idiomatiquement que le seigneur ne doit pas s’irriter ou prendre ombrage. Une traduction littérale avec « dans les yeux » serait obscure en français. « Mon seigneur » conserve la déférence de Rachel envers son père sans constituer un titre divin.
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: si je ne peux pas me lever devant toi
  rationale: « Se lever » garde le sens physique de קום, tandis que « devant toi » rend la présence de l’interlocuteur et la dimension de respect. « Si » exprime naturellement en français le motif susceptible de provoquer le mécontentement.
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: car j’ai ce qui arrive aux femmes
  rationale: Cette formulation française conserve l’euphémisme du texte hébreu pour les menstruations, tout en restant compréhensible. La note explicite le sens sans rendre le corps du texte clinique.
- source_word: וַיְחַפֵּשׂ
  choice: Il fouilla donc
  rationale: Le verbe חפש décrit ici une recherche concrète et minutieuse. « Fouilla » convient au contexte où Laban cherche des objets cachés; « donc » marque naturellement la reprise du récit après l’explication de Rachel.
- source_word: הַתְּרָפִים
  choice: les idoles domestiques
  rationale: תְּרָפִים désigne des objets ou images cultuels liés à la maisonnée. « Idoles domestiques » en communique la fonction religieuse et le cadre familial dans un français accessible, tandis que la note conserve le terme hébreu.
theological_decisions:
- issue: Sens religieux de תְּרָפִים
  choice: idoles domestiques
  alternative: téraphim ; dieux domestiques
  rationale: « Idoles domestiques » indique qu’il s’agit d’objets cultuels sans suggérer que le récit reconnaît ces objets comme de véritables divinités. La translittération, plus précise lexicalement mais moins accessible, est donnée en note.
- issue: Euphémisme relatif aux menstruations
  choice: j’ai ce qui arrive aux femmes
  alternative: j’ai mes règles ; la voie des femmes est sur moi
  rationale: Le choix préserve la retenue de l’hébreu sans masquer le sens. La formulation clinique serait plus explicite mais modifierait le registre; le calque serait peu naturel et potentiellement obscur.
translation_notes:
  register: Français international moderne, naturel et digne. La parole de Rachel conserve sa déférence filiale par « mon seigneur », avec passage naturel à « toi » comme dans l’hébreu. L’euphémisme concernant les menstruations est maintenu et expliqué en note.
