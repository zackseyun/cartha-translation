  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: fr
  text: Que le Dieu d’Abraham et le dieu de Nahor, le dieu de leur père, jugent entre nous[a]. Et Jacob prêta serment par la Crainte de son père Isaac[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Que le Dieu d’Abraham et le Dieu de Nahor, le Dieu de leur père, juge entre nous. » L’hébreu permet d’identifier toutes ces expressions à une même divinité ; toutefois, le verbe hébreu traduit ici par « jugent » est au pluriel.'
    reason: alternative_reading
  - marker: b
    text: « La Crainte de son père Isaac » est une désignation inhabituelle de Dieu ; le texte emploie littéralement le nom « crainte » ou « effroi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: le Dieu d’Abraham
  rationale: Dans cette construction, אֱלֹהֵי désigne naturellement le Dieu associé à Abraham. La majuscule convient à cette référence personnelle.
- source_word: וֵאלֹהֵי נָחוֹר
  choice: et le dieu de Nahor
  rationale: La minuscule préserve la tension du texte entre l’invocation religieuse plus large de Laban et le serment distinct de Jacob, sans identifier d’emblée le dieu de Nahor au Dieu confessé par Jacob.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: le dieu de leur père
  rationale: La formule est rendue comme une apposition au groupe précédent. La minuscule maintient l’ambiguïté quant à l’identité précise de la divinité ancestrale invoquée.
- source_word: יִשְׁפְּטוּ
  choice: jugent
  rationale: L’imparfait hébreu exprime ici un souhait ou un appel à l’arbitrage. Le pluriel français rend explicitement la forme verbale plurielle du texte source et en préserve l’ambiguïté.
- source_word: בֵינֵינוּ
  choice: entre nous
  rationale: Traduction directe et idiomatique de la formule réciproque dans le contexte de l’alliance.
- source_word: וַיִּשָּׁבַע
  choice: Et Jacob prêta serment
  rationale: Le waw narratif est rendu simplement, tandis que « prêter serment » constitue une formulation française naturelle et digne.
- source_word: בְּפַחַד
  choice: par la Terreur
  rationale: פַחַד signifie littéralement « terreur, effroi » et sert ici de désignation divine inhabituelle. La majuscule conserve sa fonction de titre sans l’expliquer à la place du texte.
- source_word: אָבִיו יִצְחָק
  choice: de son père Isaac
  rationale: La formulation française conserve clairement le lien entre Isaac, père de Jacob, et la désignation « la Terreur ».
theological_decisions:
- issue: Faut-il identifier uniformément les divinités invoquées par Laban comme étant le même Dieu ?
  choice: « le Dieu d’Abraham » mais « le dieu de Nahor, le dieu de leur père »
  alternative: « le Dieu d’Abraham et le Dieu de Nahor, le Dieu de leur père »
  rationale: L’hébreu répète אֱלֹהֵי et emploie un verbe pluriel, tandis que Jacob jure ensuite distinctement par « la Terreur de son père Isaac ». La différence de capitalisation conserve cette tension sans imposer une identification totale.
- issue: Comment rendre le pluriel יִשְׁפְּטוּ dans une invocation dont les référents peuvent être compris comme un seul Dieu ou plusieurs ?
  choice: « jugent »
  alternative: « juge »
  rationale: Le pluriel français correspond formellement au verbe hébreu et laisse ouverte la question de savoir si l’invocation distingue plusieurs référents ou emploie une formulation ancestrale complexe.
- issue: Comment traduire la formule de serment בְּפַחַד אָבִיו יִצְחָק ?
  choice: « par la Terreur de son père Isaac »
  alternative: « par le Dieu que craignait son père Isaac »
  rationale: Le texte emploie le nom concret פַחַד comme titre divin. Le conserver évite de réduire l’expression à une simple description interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. La traduction conserve l’apposition répétitive de l’hébreu, la différence possible entre les référents divins et le titre saisissant « la Terreur ». « Prêta serment » est préféré à « jura » pour une lecture courante sans perte de solennité.
