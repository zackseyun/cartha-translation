base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: fr
  text: Je ne t’ai pas apporté de bête déchirée par des fauves ; j’en ai moi-même assumé la perte[a]. Tu me réclamais les bêtes volées de jour et les bêtes volées de nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je la remplaçais moi-même » ou « j’en payais moi-même le prix ». Le verbe hébreu exprime ici le fait d’assumer la responsabilité de la perte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְרֵפָה
  choice: les bêtes déchirées par des fauves
  rationale: Dans ce contexte pastoral, le terme désigne le bétail mis en pièces par des animaux sauvages. Le pluriel générique s’accorde naturellement en français avec le bilan de nombreuses années de garde.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: je ne t’ai pas apporté
  rationale: La construction exprime le fait d’apporter quelque chose à quelqu’un. L’objet est fourni par le syntagme précédent.
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: j’en assumais moi-même la perte
  rationale: Le pronom indépendant אָנֹכִי marque l’insistance, rendue par « moi-même ». Le piel de חטא exprime ici le fait de répondre personnellement de la perte ou de la compenser.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: tu me réclamais
  rationale: L’expression idiomatique signifie demander à quelqu’un de rendre compte ou exiger de lui la compensation. Une traduction littérale par « de ma main » serait moins naturelle en français actuel.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: celles qui étaient volées le jour comme celles qui étaient volées la nuit
  rationale: La conjonction additive relie deux catégories parallèles de pertes dues au vol. Cette formulation évite de rattacher à tort les vols à la seule bête déchirée et conserve le contraste jour-nuit.
