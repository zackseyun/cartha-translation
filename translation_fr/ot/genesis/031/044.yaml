source:
  edition: WLC
  text: וְ/עַתָּ֗ה לְכָ֛/ה נִכְרְתָ֥ה בְרִ֖ית אֲנִ֣י וָ/אָ֑תָּה וְ/הָיָ֥ה לְ/עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: fr
  text: 'Et maintenant, viens : concluons une alliance, toi et moi, et que cela serve de témoin entre nous.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « coupons une alliance ». En hébreu, cette expression signifie conclure ou établir une alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve la conjonction et marque naturellement le passage à la proposition suivante dans le dialogue.
- source_word: לְכָה
  choice: viens
  rationale: Bien qu’issu du verbe « aller, marcher », l’impératif fonctionne ici comme une invitation à agir ensemble ; « viens » est naturel en français.
- source_word: נִכְרְתָה בְרִית
  choice: concluons une alliance
  rationale: L’expression hébraïque signifie littéralement « coupons une alliance », mais « conclure une alliance » restitue clairement et dignement l’idiome en français moderne.
- source_word: אֲנִי וָאָתָּה
  choice: toi et moi
  rationale: Maintient la mention explicite des deux parties et l’accent bilatéral, dans l’ordre idiomatique français.
- source_word: וְהָיָה לְעֵד
  choice: et qu’elle serve de témoin
  rationale: Le tour volitif « qu’elle serve » convient au contexte de proposition et לְ indique ici la fonction de témoin.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: entre nous
  rationale: Expression française naturelle qui renvoie sans ambiguïté aux deux personnes explicitement nommées juste avant.
theological_decisions:
- issue: Référent grammatical de « témoin »
  choice: « qu’elle serve de témoin », avec « elle » renvoyant à l’alliance
  alternative: « et cela servira de témoin »
  rationale: Le sujet implicite du masculin hébreu וְהָיָה peut être compris à partir de l’alliance ou de l’acte/dispositif qui suit. Le féminin français est requis si l’on reprend naturellement « alliance », sans prétendre résoudre toutes les nuances du référent implicite.
translation_notes:
  register: Français international moderne, naturel et digne. « Concluons une alliance » conserve la force formelle de בְרִית sans reproduire littéralement un idiome hébreu opaque. Le deux-points rend l’invitation de לְכָה et la proposition qui suit.
