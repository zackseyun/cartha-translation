  text: וַ/יִּנְהַ֣ג אֶת כָּל מִקְנֵ֗/הוּ וְ/אֶת כָּל רְכֻשׁ/וֹ֙ אֲשֶׁ֣ר רָכָ֔שׁ מִקְנֵה֙ קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/פַדַּ֣ן אֲרָ֑ם לָ/ב֛וֹא אֶל יִצְחָ֥ק אָבִ֖י/ו אַ֥רְצָ/ה כְּנָֽעַן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: fr
  text: Il emmena tout son bétail et tous les biens qu’il avait acquis — le bétail qu’il avait acquis à Paddân-Aram — pour se rendre auprès de son père Isaac, au pays de Canaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le pays de Canaan ». La forme hébraïque indique un mouvement en direction de Canaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: Il emmena
  rationale: Le verbe נהג décrit ici l’action de faire avancer des animaux. « Emmena » convient au déplacement de l’ensemble du bétail et reste naturel en français.
- source_word: מִקְנֵהוּ
  choice: tout son bétail
  rationale: מִקְנֶה désigne collectivement les animaux domestiques possédés; « bétail » en restitue la portée générale sans limiter le sens aux bovins.
- source_word: רְכֻשׁוֹ
  choice: tous les biens
  rationale: רְכוּשׁ renvoie aux possessions ou aux biens, notamment mobiliers. « Biens » est clair, large et idiomatique.
- source_word: רָכָשׁ
  choice: avait acquis
  rationale: Le verbe exprime l’acquisition de biens. La répétition de « acquis » reproduit la répétition intentionnelle de la racine hébraïque.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: le bétail qu’il avait acquis
  rationale: Cette formulation naturelle conserve l’idée d’un bétail constituant son acquisition, sans reproduire lourdement le tour nominal hébreu.
- source_word: בְּפַדַּן אֲרָם
  choice: à Paddân-Aram
  rationale: Le nom géographique est translittéré; « à » est l’usage français naturel avec un lieu de cette nature.
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: pour se rendre auprès de son père Isaac
  rationale: L’infinitif לָבוֹא exprime le but. « Se rendre auprès de » restitue le mouvement vers Isaac de façon naturelle et digne.
- source_word: אַרְצָה כְּנָעַן
  choice: au pays de Canaan
  rationale: La forme directionnelle indique un mouvement vers Canaan. Dans la syntaxe française, « au pays de Canaan » peut se rattacher naturellement à « se rendre » tout en désignant la destination.
theological_decisions: []
