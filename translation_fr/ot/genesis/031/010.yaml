source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/עֵת֙ יַחֵ֣ם הַ/צֹּ֔אן וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא בַּ/חֲל֑וֹם וְ/הִנֵּ֤ה הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: fr
  text: 'Au temps où le petit bétail était en chaleur, je levai les yeux et vis en rêve : les boucs qui saillissaient les bêtes du troupeau étaient rayés[a], mouchetés et marbrés[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « annelés »; le terme hébreu désigne des marques disposées en bandes.
    reason: lexical_alternative
  - marker: b
    text: Ou « bigarrés ». Les trois termes hébreux semblent désigner des motifs de pelage distincts, mais leur nuance exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Au temps où
  rationale: Rend le cadre temporel narratif de façon naturelle en français sans alourdir la phrase par un calque de וַיְהִי.
- source_word: יַחֵם הַצֹּאן
  choice: le petit bétail était en chaleur
  rationale: יחם désigne ici l’état physiologique propice à l’accouplement; « était en chaleur » est précis, tandis que « s’accouplait » décrirait plutôt l’acte lui-même.
- source_word: וָאֶשָּׂא עֵינַי
  choice: je levai les yeux
  rationale: Conserve l’image de l’idiome hébreu tout en restant courant et intelligible.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: et vis en rêve
  rationale: Exprime naturellement le rêve comme cadre de la perception, sans imposer une valeur définie à חֲלוֹם.
- source_word: וְהִנֵּה
  choice: ':'
  rationale: Les deux-points introduisent directement la scène soudainement présentée par הִנֵּה; un « voici » explicite serait également possible, mais plus lourd ici.
- source_word: הָעַתֻּדִים
  choice: les boucs
  rationale: Le terme désigne des caprins mâles, notamment reproducteurs; « boucs » est le mot français précis et courant.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: qui saillissaient les bêtes du troupeau
  rationale: עלה על décrit ici la monte sexuelle. « Saillir » est précis en contexte d’élevage, et « les bêtes du troupeau » évite l’étrangeté de « saillir le troupeau ».
- source_word: עֲקֻדִּים
  choice: rayés
  rationale: Le mot évoque des marques en bandes; « rayés » est clair pour le lectorat moderne, avec l’alternative plus littérale signalée en note.
- source_word: נְקֻדִּים
  choice: mouchetés
  rationale: Rend des marques faites de petites taches et maintient la distinction avec les deux autres motifs du pelage.
- source_word: וּבְרֻדִּים
  choice: marbrés
  rationale: Évoque une coloration irrégulière ou mêlée, distincte des rayures et des mouchetures; la nuance exacte du terme reste incertaine.
theological_decisions: []
