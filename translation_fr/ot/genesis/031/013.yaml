  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: fr
  text: Je suis le Dieu de Béthel[a], où tu as oint une stèle et où tu m’as fait un vœu. Maintenant, lève-toi, quitte ce pays et retourne dans ton pays natal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Béthel » signifie « maison de Dieu » ; il s’agit ici du nom du lieu.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: le Dieu de Béthel
  rationale: L’article défini et le contexte du discours divin identifient le Dieu qui s’est révélé à Jacob à Béthel. « Béthel » est ici un nom de lieu.
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: où tu as consacré une stèle par l’onction
  rationale: מָשַׁח désigne l’action d’oindre, et מַצֵּבָה une pierre dressée. Cette formulation naturelle explicite l’acte concret sans réduire l’onction à un simple geste matériel.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: où tu m’as fait un vœu
  rationale: Le français idiomatique rend la construction hébraïque verbe-nom apparentés par « faire un vœu »; « m’ » conserve le destinataire du vœu.
- source_word: קוּם
  choice: lève-toi
  rationale: Impératif courant et digne exprimant la mise en mouvement; plus naturel en français moderne que « debout » dans cette suite d’ordres.
- source_word: צֵא מִן הָאָרֶץ הַזֹּאת
  choice: quitte ce pays
  rationale: Dans ce contexte de départ territorial, צֵא מן signifie naturellement « quitter ». אֶרֶץ désigne ici le pays où Jacob séjourne.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: et retourne dans ton pays natal
  rationale: Avec אֶרֶץ, מוֹלֶדֶת renvoie naturellement au pays d’origine ou de naissance. « Pays natal » est clair et idiomatique sans limiter le sens à la parenté.
theological_decisions:
- issue: Auto-identification du locuteur comme הָאֵל בֵּית אֵל
  choice: Je suis le Dieu de Béthel
  alternative: Je suis Dieu à Béthel
  rationale: La construction rattache le locuteur à la rencontre antérieure de Jacob à Béthel. Elle ne présente pas Dieu comme une divinité locale parmi d’autres et n’exige pas d’ajouter « qui t’est apparu ».
translation_notes:
  register: Français international moderne, naturel et digne. La répétition hébraïque « vouer un vœu » est rendue idiomatiquement par « faire un vœu ». « Stèle » désigne clairement la pierre dressée par Jacob; la mention de l’onction conserve le geste de Genèse 28.18.
