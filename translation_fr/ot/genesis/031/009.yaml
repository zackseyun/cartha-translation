source:
  edition: WLC
  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: fr
  text: Ainsi, Dieu a retiré à votre père son bétail et me l’a donné[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « arraché » ou « délivré ». Le verbe hébreu peut désigner le fait de retirer quelque chose à l’un pour le transférer à un autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: a retiré à
  rationale: Le hiphil de נצל peut exprimer le fait d’arracher, de délivrer ou de soustraire quelque chose à quelqu’un. Ici, « retirer à » rend clairement le transfert du bétail de Laban à Jacob sans suggérer nécessairement un sauvetage face à un danger ni un geste brusque.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le terme hébreu courant désigne ici Dieu, présenté comme l’auteur de ce transfert.
- source_word: מִקְנֵה
  choice: bétail
  rationale: מִקְנֶה désigne des biens acquis, en particulier les animaux domestiques. Dans ce contexte pastoral, « bétail » est précis, naturel et conserve la valeur collective du singulier hébreu.
- source_word: אֲבִיכֶם
  choice: votre père
  rationale: 'Le nom est au singulier avec un suffixe de deuxième personne du pluriel : Jacob s’adresse à Rachel et Léa au sujet de leur père commun, Laban. « Votre père » conserve naturellement cette donnée en français.'
- source_word: וַיִּתֶּן לִי
  choice: et me l’a donné
  rationale: Le pronom « l’ » reprend le nom collectif singulier « bétail ». Le passé composé convient au discours direct moderne et exprime le transfert à Jacob.
theological_decisions:
- issue: L’action divine dans la prospérité de Jacob
  choice: Le texte affirme directement que Dieu a retiré le bétail au père de Rachel et Léa et l’a donné à Jacob.
  alternative: Atténuer l’énoncé en parlant seulement d’une bénédiction providentielle accordée à Jacob.
  rationale: Les deux verbes hébreux attribuent explicitement à Dieu l’action de retirer puis de donner. La traduction maintient cette forte affirmation de l’action divine sans l’expliquer ni la minimiser.
translation_notes:
  register: Français international moderne, naturel et digne. « Ainsi » relie cette conclusion à l’explication précédente. La construction « retirer à votre père son bétail » rend explicite la dépossession déjà contenue dans le verbe hébreu, tandis que « me l’a donné » respecte le caractère collectif singulier de « bétail ».
