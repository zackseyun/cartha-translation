  text: זֶה֩ עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ עִמָּ֔/ךְ רְחֵלֶ֥י/ךָ וְ/עִזֶּ֖י/ךָ לֹ֣א שִׁכֵּ֑לוּ וְ/אֵילֵ֥י צֹאנְ/ךָ֖ לֹ֥א אָכָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: fr
  text: Voilà vingt ans que je suis avec toi. Tes brebis et tes chèvres n’ont pas perdu leurs petits[a], et je n’ai pas mangé les béliers de ton troupeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’ont pas avorté ». Le verbe hébreu peut désigner le fait d’être privé de sa progéniture; dans ce contexte pastoral, il évoque une fausse couche ou la perte des petits.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: Voilà vingt ans
  rationale: Cette tournure française naturelle exprime une durée qui s’étend jusqu’au moment où Jacob parle, tout en conservant la force présentative du démonstratif hébreu.
- source_word: אָנֹכִי עִמָּךְ
  choice: que je suis avec toi
  rationale: La proposition nominale hébraïque résume la présence de Jacob auprès de Laban pendant vingt ans. Avec « voilà vingt ans que », le présent français exprime naturellement cette durée continue.
- source_word: רְחֵלֶיךָ וְעִזֶּיךָ
  choice: tes brebis et tes chèvres
  rationale: Les deux noms désignent ici respectivement les femelles des ovins et des caprins. En français courant, « brebis » est spécifique et « chèvres » désigne naturellement les femelles.
- source_word: לֹא שִׁכֵּלוּ
  choice: n’ont pas perdu leurs petits
  rationale: Le verbe peut évoquer la privation de descendance, notamment une fausse couche ou la perte des petits. La formulation choisie conserve cette amplitude dans le contexte pastoral.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: les béliers de ton troupeau
  rationale: אֵילִים désigne précisément les béliers; la formulation préserve aussi leur appartenance au troupeau de Laban.
- source_word: לֹא אָכָלְתִּי
  choice: je n’ai pas mangé
  rationale: Le passé composé convient à la rétrospective de Jacob sur sa conduite durant toute cette période.
