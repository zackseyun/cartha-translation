  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: fr
  text: Alors Jacob prit une pierre et la dressa comme une stèle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierre dressée » ou « pierre commémorative ». Le mot hébreu מַצֵּבָה désigne une pierre érigée servant de marqueur ou de monument.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit
  rationale: Le qatal narratif de לקח signifie couramment « prendre » ; « prit » convient naturellement au récit.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: אָבֶן
  choice: une pierre
  rationale: Le nom singulier désigne une pierre ; l’article indéfini est naturel en français.
- source_word: וַיְרִימֶהָ
  choice: la dressa
  rationale: Le verbe exprime ici l’action d’élever et de mettre debout la pierre ; le pronom féminin « la » reprend naturellement « pierre ».
- source_word: מַצֵּבָה
  choice: comme une stèle
  rationale: מַצֵּבָה désigne une pierre dressée servant de marqueur ou de monument. « Stèle » exprime avec concision l’objet érigé sans préciser une fonction cultuelle ou commémorative que le verset seul ne définit pas.
theological_decisions:
- issue: Traduction de מַצֵּבָה, terme pouvant avoir selon le contexte une fonction commémorative ou cultuelle
  choice: stèle
  alternative: pierre dressée ; pierre commémorative ; pilier
  rationale: « Stèle » conserve l’idée physique d’une pierre érigée sans imposer une fonction religieuse ou mémorielle plus précise que celle explicitement indiquée dans ce verset.
translation_notes:
  register: Français international moderne, narratif et digne. « Alors » rend la progression narrative ; « dressa » est idiomatique pour une pierre mise debout. La répétition « pierre… stèle » reste claire et fidèle à la construction hébraïque.
