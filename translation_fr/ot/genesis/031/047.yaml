  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: fr
  text: Laban l’appela Jegar-Sahadutha[a], et Jacob l’appela Galaad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jegar-Sahadutha est une expression araméenne qui signifie « tas du témoignage ».
    reason: lexical_alternative
  - marker: b
    text: Galaad est un nom hébreu qui signifie « tas du témoignage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לּוֹ
  choice: l’appela
  rationale: Dans ce contexte de dénomination, קרא suivi de ל signifie « appeler, donner le nom de ». Le pronom masculin renvoie au tas de pierres et se rend naturellement par « l’ » en français.
- source_word: לָבָן
  choice: Laban
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: Yegar-Sahadouta
  rationale: Translittération française de l’appellation araméenne, afin de préserver le contraste linguistique voulu par le récit; son sens est indiqué en note.
- source_word: וְיַעֲקֹב
  choice: tandis que Jacob
  rationale: Le ו relie les deux propositions tout en soulignant le contraste entre les noms araméen et hébreu donnés au même tas.
- source_word: קָרָא לּוֹ
  choice: l’appela
  rationale: La répétition du même verbe français reflète celle du texte hébreu.
- source_word: גַּלְעֵד
  choice: Gal-Éd
  rationale: Translittération qui rend perceptibles les deux éléments hébreux gal (« tas ») et ‘ed (« témoin, témoignage »), sans remplacer le nom par son explication.
theological_decisions: []
translation_notes:
  register: Français international actuel, sobre et narratif. Les deux appellations sont translittérées pour conserver le contraste entre l’araméen de Laban et l’hébreu de Jacob; « tandis que » exprime ce contraste sans lui donner une portée polémique.
