  text: וַ/יִּקַּ֤ח אֶת אֶחָי/ו֙ עִמּ֔/וֹ וַ/יִּרְדֹּ֣ף אַחֲרָ֔י/ו דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וַ/יַּדְבֵּ֥ק אֹת֖/וֹ בְּ/הַ֥ר הַ/גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: fr
  text: Il prit avec lui les membres de son clan[a], poursuivit Jacob pendant sept jours de marche et le rejoignit dans la région montagneuse de Galaad[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses frères »; le terme hébreu peut désigner des frères au sens strict ou, plus largement, des proches parents.
    reason: lexical_alternative
  - marker: b
    text: Ou « au mont Galaad »; l’hébreu peut désigner soit une montagne précise, soit la région montagneuse de Galaad.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: les membres de son clan
  rationale: Le terme אָח peut désigner des frères au sens strict ou, plus largement, des proches parents. Dans ce contexte, Laban rassemble vraisemblablement les hommes de son groupe familial; « membres de son clan » évite de limiter le groupe à ses frères biologiques.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: poursuivit Jacob
  rationale: En français courant, « poursuivre quelqu’un » exprime naturellement רדף אחרי sans reproduire de façon pesante la préposition hébraïque. Le nom « Jacob » clarifie le référent du pronom dans une phrase comportant plusieurs pronoms masculins.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: pendant sept jours de marche
  rationale: דֶּרֶךְ indique ici l’étendue du trajet. « Sept jours de marche » conserve cette nuance de déplacement tout en restant idiomatique en français.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: le rejoignit
  rationale: Dans le contexte d’une poursuite, דבק signifie atteindre ou rattraper la personne poursuivie. « Le rejoignit » rend ce résultat sans suggérer nécessairement qu’il la dépassa.
- source_word: בְּהַר הַגִּלְעָד
  choice: dans la région montagneuse de Galaad
  rationale: הַר peut désigner une montagne précise ou un territoire montagneux. Le contexte géographique favorise ici le sens régional, tout en laissant l’autre possibilité en note.
