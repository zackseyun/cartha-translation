  source_fidelity: 'Le texte rend fidèlement la progression du récit hébreu : Laban prend avec lui ses proches, poursuit Jacob sur l’équivalent d’un trajet de sept jours, puis le rejoint dans la zone montagneuse de Galaad. « Les membres de son clan » représente de façon recevable אֶחָיו dans ce contexte sans le restreindre à des frères biologiques. « Le rejoignit » convient à וַיַּדְבֵּק dans un contexte de poursuite, sans imposer l’idée plus forte de dépasser.'
