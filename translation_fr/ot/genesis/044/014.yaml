  text: וַ/יָּבֹ֨א יְהוּדָ֤ה וְ/אֶחָי/ו֙ בֵּ֣יתָ/ה יוֹסֵ֔ף וְ/ה֖וּא עוֹדֶ֣/נּוּ שָׁ֑ם וַ/יִּפְּל֥וּ לְ/פָנָ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: fr
  text: Juda et ses frères entrèrent dans la maison de Joseph. Joseph était encore là, et ils tombèrent à terre devant lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: entrèrent
  rationale: Le verbe בוא exprime ici l’arrivée avec mouvement vers l’intérieur, précisé par la forme directionnelle בֵּיתָה. « Entrèrent » rend ce mouvement naturellement en français narratif.
- source_word: יְהוּדָה וְאֶחָיו
  choice: Juda et ses frères
  rationale: Cette formulation conserve la mise en avant explicite de Juda tout en rendant simplement le lien familial.
- source_word: בֵּיתָה יוֹסֵף
  choice: dans la maison de Joseph
  rationale: La terminaison directionnelle de בֵּיתָה indique un mouvement vers la maison, compris dans ce contexte comme une entrée.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: Celui-ci était encore là
  rationale: « Encore » exprime la continuité marquée par עוֹדֶנּוּ. « Celui-ci » identifie naturellement Joseph comme référent du pronom sans alourdir la phrase.
- source_word: וַיִּפְּלוּ
  choice: ils tombèrent
  rationale: Le sens premier de נפל est conservé. Le complément « à terre devant lui » fait clairement comprendre qu’il s’agit d’un geste de soumission ou d’hommage.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: C’est l’équivalent français naturel de l’expression hébraïque signifiant littéralement « devant sa face ».
- source_word: אָרְצָה
  choice: à terre
  rationale: La forme directionnelle exprime un mouvement vers le sol ; « à terre » en donne une traduction concise et idiomatique.
