  yaml_path: translation/ot/genesis/044/027.yaml
  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: fr
  text: 'Alors mon père, ton serviteur, nous a dit : « Vous savez que ma femme m’a donné deux fils[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ma femme m’a donné deux ». Le mot « fils » est sous-entendu par le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... a dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » rend naturellement cette progression en français.
- source_word: עַבְדְּךָ אָבִי
  choice: mon père, ton serviteur
  rationale: Cette apposition conserve à la fois l’identification familiale et la déférence de Juda envers Joseph, dans l’ordre naturel du français.
- source_word: אֵלֵינוּ
  choice: nous a dit
  rationale: La préposition אֶל avec suffixe signifie « à nous » ; en français, elle s’intègre naturellement au verbe « dire ».
- source_word: אַתֶּם יְדַעְתֶּם
  choice: Vous savez
  rationale: Le pronom explicite donne de l’emphase, tandis que le présent exprime un savoir toujours pertinent dans le discours rapporté.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce qui est su.
- source_word: שְׁנַיִם
  choice: deux fils
  rationale: L’hébreu dit littéralement « deux » ; « fils » est fourni par le contexte et rend la phrase idiomatique en français.
- source_word: יָלְדָה לִּי
  choice: m’a donné
  rationale: Dans ce contexte de naissance, « m’a donné deux fils » est une formulation française naturelle qui rend l’idée de « a enfanté pour moi ».
- source_word: אִשְׁתִּי
  choice: ma femme
  rationale: אִשָּׁה avec le suffixe de première personne désigne clairement l’épouse du locuteur.
