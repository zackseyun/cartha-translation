  yaml_path: translation/ot/genesis/044/019.yaml
  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: fr
  text: 'Mon seigneur a demandé à ses serviteurs : « Avez-vous un père ou un frère ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Mon seigneur
  rationale: Formule d’adresse respectueuse à un haut dignitaire; elle conserve la déférence du discours de cour sans la familiarité de « monsieur ».
- source_word: שָׁאַל
  choice: a demandé
  rationale: Équivalent français naturel du verbe « demander, interroger » dans ce contexte d’une question directe.
- source_word: עֲבָדָיו
  choice: à ses serviteurs
  rationale: Les frères parlent d’eux-mêmes avec déférence devant le gouverneur. « Serviteurs » rend cette autodésignation conventionnelle sans imposer ici le sens plus précis d’esclaves.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français actuel, les deux-points introduisent naturellement le contenu exact de la question; traduire littéralement par « en disant » alourdirait la phrase.
- source_word: הֲיֵשׁ לָכֶם
  choice: Avez-vous encore
  rationale: La construction existentielle avec ל exprime ici la présence dans leur famille. « Encore » rend naturellement, dans ce contexte, la question de savoir si leur père est toujours en vie, tout en restant compatible avec la formulation qui suit.
- source_word: אָב
  choice: votre père
  rationale: Le possessif est idiomatique en français pour parler du père des interlocuteurs; il évite l’étrange « avez-vous un père ».
- source_word: אָח
  choice: un frère
  rationale: Le singulier indéfini du texte hébreu est conservé.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La déférence judiciaire est maintenue par « Mon seigneur » et « ses serviteurs »; la formule hébraïque d’introduction du discours est intégrée par une ponctuation française idiomatique.
