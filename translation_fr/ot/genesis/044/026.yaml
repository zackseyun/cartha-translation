    issue: La dernière subordonnée emploie « quand » au lieu d’une condition explicite.
    rationale: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ décrit la circonstance conditionnelle dans laquelle ils ne peuvent « voir le visage » de l’homme. « Si ... n’est pas avec nous » préserve mieux cette relation.
  - severity: low
    issue: « Cet homme » et la note ne correspondent pas exactement à la formulation source.
    rationale: הָאִישׁ est littéralement « l’homme ». De plus, « être admis en sa présence » peut suggérer une permission absente de l’idiome; « se présenter devant lui » ou « paraître devant lui » suffit.
