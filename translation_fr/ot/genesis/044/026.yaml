base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: fr
  text: 'Mais nous avons répondu : « Nous ne pouvons pas descendre. Si notre plus jeune frère est avec nous, nous descendrons, car nous ne pouvons pas voir le visage de l’homme[a] si notre plus jeune frère n’est pas avec nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « voir le visage de l’homme »; cette expression signifie ici se présenter devant lui ou paraître en sa présence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Mais nous avons répondu
  rationale: Le waw fait progresser le récit et, dans le discours de Juda, introduit leur réaction opposée à l’exigence précédente. « Répondu » est naturel dans ce contexte dialogué, tandis que « mais » marque le contraste.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: Nous ne pouvons pas descendre
  rationale: יכל exprime la capacité, et ירד signifie littéralement « descendre »; ce verbe convient aussi au déplacement géographique vers l’Égypte.
- source_word: אָחִינוּ הַקָּטֹן
  choice: notre plus jeune frère
  rationale: Dans ce contexte familial, הַקָּטֹן désigne le benjamin, c’est-à-dire le plus jeune des frères, et non un frère de petite taille.
- source_word: אִם יֵשׁ ... אִתָּנוּ וְיָרַדְנוּ
  choice: Si notre plus jeune frère est avec nous, nous descendrons
  rationale: La formulation conserve la condition positive suivie de sa conséquence, conformément à la structure rhétorique de l’hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du refus. « Car » convient au registre narratif digne sans être archaïque.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: voir le visage de cet homme
  rationale: La traduction garde l’image concrète de l’hébreu. Dans ce contexte, l’expression signifie être admis en présence de l’homme ou se présenter devant lui; une note explicite cet idiome.
- source_word: הָאִישׁ
  choice: cet homme
  rationale: Le nom signifie simplement « l’homme » et renvoie ici à Joseph. Le démonstratif français identifie naturellement l’homme déjà mentionné sans lui attribuer un titre absent de l’hébreu.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: quand notre plus jeune frère n’est pas avec nous
  rationale: L’hébreu coordonne littéralement la circonstance négative par waw. « Quand » exprime naturellement en français la situation dans laquelle ils ne peuvent voir le visage de l’homme, sans imposer une reformulation en « à moins que ».
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. La répétition de « notre plus jeune frère » est conservée, car elle reflète l’insistance de l’hébreu. L’expression imagée « voir le visage » est maintenue dans le texte et expliquée en note.
