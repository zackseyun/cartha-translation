- from: 'Mais nous avons répondu : « Nous ne pouvons pas descendre. Si notre plus jeune frère est avec nous, nous descendrons, car nous ne pouvons pas voir le visage de cet homme[a] quand notre plus jeune frère n’est pas avec nous. »'
  to: 'Mais nous avons répondu : « Nous ne pouvons pas descendre. Si notre plus jeune frère est avec nous, nous descendrons, car nous ne pouvons pas voir le visage de l’homme[a] si notre plus jeune frère n’est pas avec nous. »'
