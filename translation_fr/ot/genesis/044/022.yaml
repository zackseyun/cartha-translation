  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: fr
  text: 'Nous avons dit à mon seigneur : « Le garçon ne peut pas quitter son père, car s’il quittait son père, il mourrait[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il quitte son père, et il meurt ». L’hébreu ne précise pas le sujet de « meurt » ; d’après le contexte, il s’agit vraisemblablement du père.'
    reason: L’ordre des propositions et l’absence de sujet explicite créent une ambiguïté que la traduction française doit signaler.
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Nous avons répondu
  rationale: Le verbe אמר signifie littéralement « dire », mais, dans ce dialogue, il introduit la réponse des frères à Joseph. « Nous avons répondu » rend naturellement la fonction de la forme narrative en français.
- source_word: אֶל אֲדֹנִי
  choice: à mon seigneur
  rationale: Cette formule exprime la déférence de Juda envers Joseph dans un cadre officiel. « Mon seigneur » conserve le respect de l’hébreu sans imposer l’idée de propriété que pourrait suggérer « mon maître ».
- source_word: לֹא יוּכַל
  choice: ne peut pas
  rationale: יכל exprime ici l’incapacité. « Ne peut pas » est direct et naturel en français moderne.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: נער peut désigner un garçon ou un jeune homme. « Le garçon » maintient ici la perspective familiale et affective de Juda, qui présente Benjamin comme dépendant de son père.
- source_word: לַעֲזֹב
  choice: quitter
  rationale: עזב indique ici le fait de se séparer de quelqu’un ou de le laisser, sans connotation nécessaire d’abandon moral. « Quitter son père » convient naturellement au contexte.
- source_word: וְעָזַב
  choice: s’il quittait
  rationale: La coordination hébraïque prend dans le contexte une valeur conditionnelle. L’imparfait après « si » restitue idiomatiquement cette éventualité en français.
- source_word: וָמֵת
  choice: il mourrait
  rationale: Le conditionnel correspond à l’éventualité exprimée par la proposition précédente. Le pronom « il » conserve dans le texte la non-explicitation du sujet en hébreu.
theological_decisions:
- issue: Identité du sujet de וָמֵת (« il mourrait »)
  choice: Conserver le pronom ambigu « il » dans le texte et expliquer en note que le père est vraisemblablement visé
  alternative: 'Expliciter dans le texte : « son père mourrait »'
  rationale: L’hébreu ne répète pas le sujet. Le contexte plus large, notamment la crainte que le père meure si Benjamin ne revient pas, oriente vers le père, mais l’ambiguïté grammaticale ne doit pas être supprimée sans indication.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours demeure respectueux sans archaïsme marqué. La répétition de « son père », présente dans l’hébreu, est conservée pour maintenir l’insistance affective.
