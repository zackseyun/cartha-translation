source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: fr
  text: Que celui de tes serviteurs[a] chez qui elle sera trouvée meure ! Et nous aussi, nous deviendrons les esclaves de mon seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même mot hébreu est rendu ici par « serviteurs » et, à la fin du verset, par « esclaves ». Dans le premier cas, il s’agit d’une formule de déférence ; dans le second, d’un véritable asservissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: celui de tes serviteurs chez qui elle sera trouvée
  rationale: La proposition relative désigne l’un des membres du groupe. « Chez qui » exprime naturellement la possession ou la présence auprès d’une personne. Le pronom « elle », nécessaire en français, reprend la coupe mentionnée dans le contexte sans la répéter explicitement.
- source_word: וָמֵת
  choice: meure
  rationale: Dans cette proposition solennelle, le parfait coordonné exprime la conséquence proposée avec une valeur volitive. Le subjonctif français après « que » rend cette force sans introduire l’idée plus causative de « mettre à mort ».
- source_word: וְגַם אֲנַחְנוּ
  choice: Et nous aussi
  rationale: Cette formulation conserve l’ajout emphatique d’une seconde conséquence touchant tous les frères.
- source_word: נִהְיֶה
  choice: nous deviendrons
  rationale: Le verbe présente ici l’entrée dans un nouvel état résultant de la sanction proposée ; « deviendrons » rend cette nuance prospective.
- source_word: לַאדֹנִי
  choice: de mon seigneur
  rationale: Le suffixe est à la première personne du singulier et le titre constitue une formule humaine de déférence. Avec « esclaves », le français idiomatique exprime l’appartenance par « de ».
- source_word: לַעֲבָדִים
  choice: les esclaves
  rationale: La condition proposée est ici un véritable asservissement punitif, et non une simple formule de politesse ; « esclaves » rend clairement cet enjeu.
theological_decisions:
- issue: Traduction des deux emplois du lexème עבד
  choice: « serviteurs » dans la formule déférente, puis « esclaves » pour l’asservissement proposé
  alternative: Employer « serviteurs » ou « esclaves » dans les deux cas
  rationale: 'Le même lexème hébreu est employé deux fois, mais sa portée contextuelle diffère : le premier emploi relève de l’auto-désignation respectueuse devant un haut dignitaire, tandis que le second décrit la perte effective de liberté proposée comme sanction. La note maintient visible le lien lexical.'
- issue: Force de וָמֵת
  choice: « que … meure »
  alternative: « il mourra »
  rationale: La forme peut se lire comme la conséquence solennellement consentie dans la proposition des frères. Le tour volitif français préserve cette force sans transformer la phrase en simple prédiction.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La tournure « Que celui… meure ! » conserve le caractère solennel et téméraire de l’engagement. « Mon seigneur » est un titre humain de courtoisie dans ce contexte.
