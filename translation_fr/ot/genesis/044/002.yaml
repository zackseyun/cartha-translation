  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: fr
  text: « Tu mettras ma coupe, la coupe d’argent, à l’ouverture[a] du sac du plus jeune, avec l’argent pour son grain. » L’intendant fit comme Joseph l’avait dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « à la bouche du sac », expression hébraïque désignant son ouverture.
    reason: cultural_note
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: ma coupe, la coupe d’argent
  rationale: גְּבִיעַ désigne une coupe ou un gobelet. « Coupe » est naturel en français moderne, et l’apposition répétée de l’hébreu est conservée.
- source_word: תָּשִׂים
  choice: tu mettras
  rationale: Le verbe שׂים signifie couramment « mettre, placer ». Le futur français convient ici à l’ordre formulé dans le discours direct.
- source_word: בְּפִי
  choice: à l’entrée
  rationale: Littéralement « à la bouche » du sac. En français, « à l’entrée du sac » transmet naturellement l’idiome hébreu sans suggérer une bouche au sens propre.
- source_word: אַמְתַּחַת הַקָּטֹן
  choice: du sac du plus jeune
  rationale: אַמְתַּחַת est un sac de transport, notamment pour le grain; הַקָּטֹן désigne ici le plus jeune des frères.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: l’argent payé pour son grain
  rationale: כֶּסֶף peut désigner l’argent comme métal ou comme moyen de paiement, tandis que שִׁבְרוֹ renvoie ici au grain acheté. La formulation garde clairement le sens commercial.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: L’intendant fit ce que Joseph lui avait dit
  rationale: Cette tournure française restitue idiomatiquement « il fit selon la parole de Joseph qu’il avait prononcée ». Le sujet implicite est l’intendant mentionné dans le contexte immédiat; son explicitation évite une ambiguïté peu naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition emphatique « ma coupe, la coupe d’argent » est conservée, tandis que les idiomes sont rendus naturellement. Le discours direct se poursuit depuis le verset précédent.
