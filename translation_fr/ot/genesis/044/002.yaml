  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
