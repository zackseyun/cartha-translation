  variant: modern international French
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ אִם לֹ֥א יֵרֵ֛ד אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן אִתְּ/כֶ֑ם לֹ֥א תֹסִפ֖וּ/ן לִ/רְא֥וֹת פָּנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: fr
  text: 'Tu as dit à tes serviteurs : « Si votre plus jeune frère ne descend pas avec vous, vous ne reverrez plus mon visage[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « vous ne vous présenterez plus devant moi ».'
    reason: L’expression hébraïque « voir mon visage » peut signifier comparaître ou se présenter devant quelqu’un.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Tu as dit
  rationale: Le wayyiqtol de אמר poursuit le récit et se rend naturellement par le passé composé en français moderne.
- source_word: עֲבָדֶיךָ
  choice: à tes serviteurs
  rationale: Dans ce contexte de cour, « serviteurs » conserve la formule déférente employée par Juda sans mettre au premier plan une condition servile que le verset ne souligne pas.
- source_word: אִם לֹא
  choice: Si … ne … pas
  rationale: Cette formulation reproduit clairement la structure conditionnelle négative de l’hébreu; « à moins que » serait également possible, mais moins proche de sa forme.
- source_word: יֵרֵד
  choice: ne descend pas
  rationale: Le verbe ירד exprime le déplacement vers l’Égypte, traditionnellement conçu comme une descente. Le français permet de conserver cette orientation sans ajouter « venir » ou « aller ».
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: votre plus jeune frère
  rationale: Le syntagme désigne le benjamin du groupe, et non simplement un frère moins âgé.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: Rendu direct et naturel du marqueur d’accompagnement.
- source_word: לֹא תֹסִפוּן
  choice: vous ne … plus
  rationale: Avec l’infinitif qui suit, יסף nie toute nouvelle occurrence de l’action. En français, « ne… plus » exprime naturellement ce sens.
- source_word: לִרְאוֹת פָּנָי
  choice: reverrez … mon visage
  rationale: Le texte principal conserve l’image hébraïque de « voir mon visage », tout en combinant le sens itératif de יסף avec le verbe français « revoir ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement reflète la deuxième personne du singulier adressée à Joseph; dans la citation, le pluriel « vous » vise les frères. L’image sémitique « voir mon visage » est maintenue dans le texte et explicitée en note.
