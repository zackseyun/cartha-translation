source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: fr
  text: 'Puis il donna cet ordre à celui qui était chargé de sa maison : « Remplis de nourriture les sacs de ces hommes, autant qu’ils pourront en porter, et mets l’argent de chacun à l’ouverture de son sac[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la bouche de son sac ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Puis il donna cet ordre
  rationale: Le wayyiqtol fait progresser le récit. « Puis » exprime la succession narrative, tandis que « donna cet ordre » rend naturellement le sens de צוה en français.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: celui qui était chargé de sa maison
  rationale: Littéralement « celui qui était sur sa maison ». La formulation française explicite sobrement la fonction de responsable sans imposer le titre plus interprétatif d’« intendant ».
- source_word: מַלֵּא
  choice: Remplis
  rationale: Impératif de מלא, rendu directement par l’impératif français courant.
- source_word: אַמְתְּחֹת
  choice: les sacs
  rationale: Le terme désigne ici des contenants servant au transport des vivres ; « sacs » convient au contexte ancien et reste précis.
- source_word: הָאֲנָשִׁים
  choice: de ces hommes
  rationale: Le texte dit « les hommes ». Le démonstratif français permet une désignation naturelle des hommes présents sans introduire l’identification contextuelle « frères », absente de la proposition.
- source_word: אֹכֶל
  choice: de nourriture
  rationale: אֹכֶל est un terme général signifiant « nourriture ». Le traduire par « grain » préciserait davantage que le texte hébreu.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: autant qu’ils pourront en porter
  rationale: Cette tournure française restitue à la fois la capacité exprimée par יכל et l’action de porter exprimée par נשׂא.
- source_word: כֶּסֶף אִישׁ
  choice: l’argent de chacun
  rationale: Dans ce contexte, כֶּסֶף désigne l’argent en métal apporté en paiement. « De chacun » conserve la valeur distributive de אִישׁ.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: à l’ouverture de son sac
  rationale: L’expression hébraïque dit littéralement « à la bouche de son sac ». « À l’ouverture » en transmet clairement le sens en français moderne, tandis que l’image originale est conservée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’hébreu tout en évitant les calques peu naturels ; l’image concrète de la « bouche » du sac est signalée en note.
