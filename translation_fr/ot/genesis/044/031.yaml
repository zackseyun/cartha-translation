source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: fr
  text: Alors, quand il verra que le garçon n’est pas là, il mourra, et tes serviteurs feront descendre au Shéol, dans le chagrin, les cheveux gris de ton serviteur, notre père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à la tombe » ou « au séjour des morts ». Hébreu : « shéol ».'
    reason: Alternative lexicale pour un terme hébreu dont le champ sémantique dépasse potentiellement la tombe individuelle.
lexical_decisions:
- source_word: וְהָיָה
  choice: alors
  rationale: Dans ce contexte, la formule introduit le résultat de la situation évoquée précédemment; « alors » en rend naturellement la fonction discursive.
- source_word: כִּרְאוֹתוֹ
  choice: quand il verra
  rationale: L’infinitif construit précédé de כ et muni du suffixe masculin singulier exprime ici une circonstance temporelle.
- source_word: כִּי אֵין הַנַּעַר
  choice: que le garçon n’est pas là
  rationale: אֵין exprime ici l’absence de Benjamin au retour des frères; cette formulation n’implique pas qu’il soit déjà mort.
- source_word: וָמֵת
  choice: il mourra
  rationale: 'Le contexte donne à la forme verbale une valeur future et résultative: Jacob mourra en constatant l’absence de Benjamin.'
- source_word: וְהוֹרִידוּ
  choice: feront descendre
  rationale: Le hifil de ירד exprime l’action de faire descendre et conserve l’image spatiale liée au shéol.
- source_word: שֵׂיבַת
  choice: les cheveux gris
  rationale: Le nom désigne littéralement les cheveux gris et, par extension, la vieillesse; le choix retenu préserve l’image concrète de l’hébreu.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: de notre père, ton serviteur
  rationale: L’ordre français est ajusté pour rendre clairement la double désignation de Jacob comme père des frères et serviteur du gouverneur, sans modifier le rapport syntaxique.
- source_word: בְּיָגוֹן
  choice: dans la douleur
  rationale: יָגוֹן désigne le chagrin ou la douleur; « dans la douleur » convient au registre solennel de cette déclaration.
- source_word: שְׁאֹלָה
  choice: au shéol
  rationale: La translittération conserve l’étendue sémantique et l’univers conceptuel du terme hébreu sans le réduire à la seule tombe.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: shéol
  alternative: la tombe; le séjour des morts
  rationale: Le terme hébreu peut évoquer le domaine des morts plus largement qu’une tombe individuelle. Le conserver sous forme translittérée préserve cette ambiguïté sans imposer une cosmologie particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’image hébraïque des cheveux gris que les fils feront descendre au shéol, tout en plaçant l’apposition « ton serviteur » de manière naturelle en français.
