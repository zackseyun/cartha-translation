- from: 'Ils étaient sortis de la ville, mais ils n’étaient pas encore loin lorsque Joseph dit à l’intendant de sa maison[a] : « Debout ! Poursuis ces hommes. Quand tu les auras rattrapés, dis-leur : “Pourquoi avez-vous rendu le mal pour le bien ?” »'
  to: 'Ils étaient sortis de la ville et n’en étaient pas encore loin lorsque Joseph dit à l’intendant de sa maison[a] : « Lève-toi, poursuis les hommes. Quand tu les auras rattrapés, dis-leur : “Pourquoi avez-vous rendu le mal pour le bien ?” »'
  rationale: La révision supprime l’opposition ajoutée par « mais », rend l’article défini de « les hommes » et améliore la formulation littérale de la note. Elle conserve le sens, le registre et la progression temporelle du texte hébreu.
