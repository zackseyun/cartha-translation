base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: fr
  text: 'Ils étaient sortis de la ville et n’en étaient pas encore loin lorsque Joseph dit à l’intendant de sa maison[a] : « Lève-toi, poursuis les hommes. Quand tu les auras rattrapés, dis-leur : “Pourquoi avez-vous rendu le mal pour le bien ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à celui qui était préposé à sa maison »; c’est-à-dire au responsable de sa maisonnée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: Ils étaient sortis de la ville, mais ils n’étaient pas encore loin
  rationale: Le plus-que-parfait situe leur départ avant l’ordre de Joseph. « Pas encore loin » rend naturellement le hiphil de רחק dans ce contexte narratif; « mais » explicite avec mesure le contraste implicite entre la sortie et la faible distance parcourue.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: à l’intendant de sa maison
  rationale: L’expression signifie littéralement « à celui qui était sur sa maison » et désigne le responsable de la maisonnée. « Intendant de sa maison » est clair, actuel et conforme à la fonction évoquée.
- source_word: קוּם
  choice: Debout !
  rationale: L’impératif de קום introduit avec urgence l’action commandée. « Debout ! » conserve cette vigueur sans archaïsme.
- source_word: רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: Poursuis ces hommes
  rationale: רדף אחרי exprime la poursuite. Le démonstratif « ces » convient au groupe précis que l’intendant doit poursuivre, tandis que « hommes » conserve le référent masculin explicite.
- source_word: וְהִשַּׂגְתָּם
  choice: Quand tu les auras rattrapés
  rationale: Le hiphil de נשׂג signifie atteindre ou rattraper. La proposition temporelle rend naturellement la succession des impératifs en français.
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: Pourquoi avez-vous rendu le mal pour le bien ?
  rationale: Le piel de שלם exprime ici le fait de rendre ou payer en retour. La formulation française préserve l’opposition morale concise entre רָעָה et טוֹבָה.
