  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: fr
  text: Alors ils déchirèrent leurs vêtements[a]. Chacun chargea son âne, et ils retournèrent à la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs habits ». Le terme hébreu peut désigner de façon générale les vêtements, notamment les vêtements de dessus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: ils déchirèrent
  rationale: Le verbe קרע désigne ici l’action concrète de déchirer ses vêtements, geste conventionnel exprimant la détresse ou le bouleversement.
- source_word: שִׂמְלֹתָם
  choice: leurs vêtements
  rationale: שִׂמְלָה est un terme général pour une pièce d’habillement, souvent extérieure. « Vêtements » est naturel, actuel et suffisamment large.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: Chacun rechargea son âne
  rationale: עמס signifie charger ou placer une charge sur. אִישׁ a ici une valeur distributive, rendue naturellement par « chacun ». « Rechargea » indique qu’après l’inspection et le déchargement implicite des sacs, chacun remit sa charge sur son âne, sans alourdir la phrase.
- source_word: אִישׁ
  choice: chacun
  rationale: Le singulier distributif désigne chacun des hommes du groupe. En français, « chacun » est plus idiomatique que « chaque homme » tout en conservant le sens.
- source_word: חֲמֹרוֹ
  choice: son âne
  rationale: חֲמוֹר est le terme courant pour l’âne; « son âne » respecte la construction distributive.
- source_word: וַיָּשֻׁבוּ
  choice: ils retournèrent
  rationale: שׁוב signifie revenir ou retourner. Le passé simple convient au registre narratif biblique en français.
- source_word: הָעִירָה
  choice: à la ville
  rationale: Le hé directionnel marque le mouvement vers la ville; « à la ville » l’exprime naturellement.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la continuité du récit. « Alors » traduit l’enchaînement narratif; la formulation reste concrète et ne développe pas explicitement la signification symbolique du geste.
