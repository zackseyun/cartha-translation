  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: fr
  text: Car comment pourrais-je retourner auprès de mon père si le jeune homme n’est pas avec moi ? Sinon, je verrais le malheur qui frapperait mon père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: retourner
  rationale: Le verbe signifie littéralement « monter », mais, dans ce contexte de déplacement vers le père, « retourner auprès de » exprime naturellement le mouvement visé en français.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר peut désigner un garçon, un serviteur ou un jeune homme. Benjamin étant ici un adulte, « jeune homme » convient mieux que « garçon » sans surinterpréter son âge.
- source_word: בָרָע
  choice: le malheur
  rationale: רַע peut signifier le mal, le malheur ou le désastre. Ici, il désigne la calamité qui atteindrait Jacob.
- source_word: יִמְצָא אֶת־אָבִי
  choice: qui frapperait mon père
  rationale: L’expression signifie littéralement « qui trouverait/atteindrait mon père ». « Frapperait » rend idiomatiquement l’idée qu’un malheur l’atteindrait.
theological_decisions:
- issue: Portée de פֶּן et réaction de Juda
  choice: Je ne pourrais supporter de voir
  alternative: de peur que je ne voie / sinon je verrais
  rationale: פֶּן introduit ici l’issue redoutée. La formulation française exprime la détresse de Juda sans déterminer précisément si le malheur serait la mort de Jacob ou une autre calamité.
translation_notes:
  register: Français moderne, digne et oralement naturel. La question pressante de Juda est conservée, ainsi que l’indétermination du « malheur » qui atteindrait son père.
