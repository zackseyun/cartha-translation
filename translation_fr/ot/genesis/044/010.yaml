  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: fr
  text: 'Il répondit : « Eh bien, qu’il en soit comme vous l’avez dit. Celui chez qui elle sera trouvée sera mon esclave, et vous, vous serez hors de cause. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Eh bien
  rationale: Dans cette réponse immédiate, l’expression marque une prise en compte de la proposition précédente. « Eh bien » restitue naturellement cette valeur discursive en français, sans suggérer à tort une simple indication temporelle.
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: qu’il en soit comme vous l’avez dit
  rationale: Cette formulation conserve l’adhésion apparente aux paroles des frères. Le point qui suit respecte la pause majeure du texte hébreu et permet de voir que l’intendant modifie ensuite la peine proposée.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: Celui chez qui elle sera trouvée
  rationale: La relative désigne la personne en possession de la coupe. Le pronom féminin « elle » reprend naturellement la coupe dans le contexte, tandis que la tournure passive reste proche de l’hébreu.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: sera mon esclave
  rationale: Dans ce contexte pénal et coercitif, עֶבֶד désigne un statut d’asservissement plutôt qu’un service librement consenti. « Esclave » rend cette réalité plus exactement que « serviteur ».
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: et vous, vous serez hors de cause
  rationale: נָקִי exprime ici l’absence de culpabilité ou de responsabilité juridique. « Hors de cause » indique clairement que les autres ne seront pas tenus responsables, sans leur attribuer une innocence morale absolue.
