id: GEN.44.33
reference: Genesis 44:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: fr
  text: Maintenant donc, que ton serviteur reste, je t’en prie, à la place du jeune homme, comme esclave de mon seigneur, et que le jeune homme remonte[a] avec ses frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « monte » ; c’est une manière courante de décrire le voyage de l’Égypte vers Canaan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Cette transition conserve à la fois la valeur conjonctive et la force discursive de l’hébreu au début de la demande culminante de Juda.
- source_word: יֵשֶׁב נָא
  choice: que ... reste, je t’en prie
  rationale: Le jussif accompagné de נָא exprime une requête respectueuse. « Rester » convient au fait que Juda propose de demeurer en Égypte à la place de Benjamin.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Dans la bouche de Juda, il s’agit d’une autodésignation déférente adressée à Joseph, plutôt que d’une description littérale de son statut.
- source_word: תַּחַת הַנַּעַר
  choice: à la place du jeune homme
  rationale: תַּחַת a ici un sens substitutif. « Jeune homme » rend naturellement נַעַר sans faire de Benjamin un petit enfant.
- source_word: עֶבֶד
  choice: comme esclave
  rationale: Ici, contrairement à l’autodésignation courtoise précédente, le mot désigne le statut réel de dépendance que Juda propose d’assumer dans la maison de Joseph.
- source_word: לַאדֹנִי
  choice: de mon seigneur
  rationale: Le titre humain respectueux désigne Joseph. « Mon seigneur » maintient le registre social du discours sans lui donner une référence divine.
- source_word: וְהַנַּעַר יַעַל
  choice: et que le jeune homme remonte
  rationale: La tournure poursuit la requête de Juda. « Remonter » conserve l’image géographique habituelle d’un déplacement depuis l’Égypte vers Canaan.
- source_word: עִם אֶחָיו
  choice: avec ses frères
  rationale: Traduction directe et contextuellement exacte du terme familial.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. La formulation distingue « ton serviteur », autodésignation de politesse, de « comme esclave », qui décrit ici la servitude effective proposée par Juda. Le tutoiement correspond au système d’adresse retenu dans le verset, tandis que « mon seigneur » préserve sa forte déférence.
