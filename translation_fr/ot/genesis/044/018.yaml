base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: fr
  text: 'Alors Juda s’approcha de lui et dit : « Je vous en prie, mon seigneur, permettez à votre serviteur de vous dire un mot, et que votre colère ne s’enflamme pas contre votre serviteur, car vous êtes comme Pharaon. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו
  choice: s’approcha de lui
  rationale: Rend directement le mouvement concret de Juda vers Joseph, dans un français naturel et digne.
- source_word: בִּי אֲדֹנִי
  choice: Je t’en prie, mon seigneur
  rationale: בִּי introduit ici une supplication déférente; « Je t’en prie » en exprime naturellement la force, tandis que « mon seigneur » conserve le titre honorifique de cour.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: permets à ton serviteur de dire un mot
  rationale: La formulation rend la requête polie portée par le jussif et נָא, tout en conservant l’auto-désignation déférente « ton serviteur » et le singulier דָבָר.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: à mon seigneur
  rationale: Littéralement « aux oreilles de mon seigneur »; en contexte, l’expression signifie parler de manière à être entendu. Le français direct évite un calque peu naturel sans changer le sens.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: que ta colère ne s’enflamme pas contre ton serviteur
  rationale: Préserve l’image hébraïque de la colère qui brûle, sous une forme idiomatique en français, ainsi que sa direction contre Juda.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: car tu es comme le pharaon
  rationale: Conserve la comparaison explicite et l’ambiguïté de sa portée exacte, vraisemblablement liée à l’autorité et au rang de Joseph, sans la transformer en égalité absolue.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le tutoiement correspond aux formes hébraïques de deuxième personne du singulier, tandis que « mon seigneur » et « ton serviteur » maintiennent la forte déférence de Juda. « Le pharaon » est employé comme titre royal.
