revisions:
- from: 'Alors Juda s’approcha de lui et dit : « Je t’en prie, mon seigneur, permets à ton serviteur de dire un mot à mon seigneur, et que ta colère ne s’enflamme pas contre ton serviteur, car tu es comme le pharaon. »'
  to: 'Alors Juda s’approcha de lui et dit : « Je vous en prie, mon seigneur, permettez à votre serviteur de vous dire un mot, et que votre colère ne s’enflamme pas contre votre serviteur, car vous êtes comme Pharaon. »'
  rationale: La révision se limite à adapter l’adresse au vouvoiement de déférence attendu en français moderne dans un cadre de cour, à rendre plus directement la demande de parler en étant entendu, et à capitaliser « Pharaon ». Le sens, la comparaison et l’image de la colère qui s’enflamme sont conservés.
  reviewer_model: gpt-5.6-terra
