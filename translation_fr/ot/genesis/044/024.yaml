id: GEN.44.24
reference: Genesis 44:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ֣י עָלִ֔ינוּ אֶֽל עַבְדְּ/ךָ֖ אָבִ֑/י וַ/נַּ֨גֶּד ל֔/וֹ אֵ֖ת דִּבְרֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: fr
  text: Quand nous sommes remontés auprès de ton serviteur, mon père[a], nous lui avons rapporté les paroles de mon seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « auprès de mon père, ton serviteur ». L’ordre de l’hébreu est : « auprès de ton serviteur, mon père ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Quand
  rationale: La formule narrative introduit l’étape suivante. En français, « Quand » rend naturellement la relation temporelle sans le tour lourd « Et il arriva que ».
- source_word: עָלִינוּ
  choice: nous sommes remontés
  rationale: Le verbe עלה signifie couramment « monter ». Ici, il décrit le retour d’Égypte vers Canaan; « remonter » conserve à la fois le mouvement et la perspective géographique.
- source_word: אֶל
  choice: auprès de
  rationale: Dans ce contexte de retour vers une personne, « auprès de » est plus naturel que le strict « vers » et exprime l’arrivée auprès du père.
- source_word: עַבְדְּךָ אָבִי
  choice: ton serviteur, mon père
  rationale: Ce choix conserve l’ordre hébreu et le ton déférent de Juda envers Joseph, tout en ajoutant la ponctuation nécessaire à la clarté en français.
- source_word: וַנַּגֶּד
  choice: nous avons rapporté
  rationale: À la forme hiphil, נגד signifie faire connaître, raconter ou rapporter. « Rapporter » convient au fait de transmettre fidèlement à Jacob ce que Joseph a dit.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom indirect français « lui » rend naturellement l’hébreu לוֹ.
- source_word: אֵת דִּבְרֵי
  choice: les paroles de
  rationale: « Les paroles de » suit formellement דִּבְרֵי et maintient le lien avec les propos précédents, sans réduire ceux-ci à un simple « message ».
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit ici d’un titre humain respectueux adressé à Joseph, et non du nom divin. « Mon seigneur » préserve explicitement la déférence de Juda.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le passé composé convient au discours direct narratif. Le tutoiement reflète les formes hébraïques singulières et reste cohérent avec l’adresse déférente « mon seigneur ».
