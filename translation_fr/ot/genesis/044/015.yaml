  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יוֹסֵ֔ף מָֽה הַ/מַּעֲשֶׂ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר עֲשִׂיתֶ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם כִּֽי נַחֵ֧שׁ יְנַחֵ֛שׁ אִ֖ישׁ אֲשֶׁ֥ר כָּמֹֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: fr
  text: 'Joseph leur dit : « Quel est cet acte que vous avez commis ? Ne saviez-vous pas qu’un homme comme moi pratique bel et bien la divination[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devine assurément », « saurait certainement le découvrir par divination » ou « peut certainement découvrir de telles choses ». L’hébreu emploie une forme intensive du verbe issu de la racine qui désigne la divination.
    reason: Signaler la construction intensive et les nuances possibles sans atténuer, dans le texte principal, la référence explicite à la divination.
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה אֲשֶׁר עֲשִׂיתֶם
  choice: Qu’est-ce que vous avez fait là ?
  rationale: Cette formulation française naturelle conserve la force réprobatrice de la question. « Là » reprend la valeur démonstrative de הַזֶּה sans la lourdeur de « Quelle est cette action que vous avez commise ? ».
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Ne saviez-vous pas
  rationale: La question négative attend une réponse affirmative et garde ici toute sa force rhétorique.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: pratique bel et bien la divination
  rationale: Le nom « divination » rend explicitement la racine נחש, tandis que « bel et bien » restitue l’intensification produite par l’infinitif absolu associé au verbe conjugué. Le présent français convient à l’affirmation générale portant sur l’homme de ce rang.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: un homme comme moi
  rationale: Traduction directe, idiomatique et fidèle au masculin singulier du texte hébreu.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française conventionnelle du nom propre.
theological_decisions:
- issue: La déclaration de Joseph au sujet de la divination décrit-elle une pratique réelle, une capacité de découvrir les faits, ou un rôle joué dans sa mise en scène égyptienne ?
  choice: 'Traduire directement ses paroles : « pratique bel et bien la divination »'
  alternative: « saurait certainement le découvrir par divination » ou « peut certainement découvrir de telles choses »
  rationale: Le texte emploie explicitement et de manière intensive la racine נחש, liée à la divination. La traduction ne doit ni nier que Joseph en revendique ici la pratique, ni affirmer hors de son discours qu’il s’y livrait réellement. Elle préserve ainsi la tension narrative et théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure orale « Qu’est-ce que vous avez fait là ? » convient au discours direct et porte nettement le reproche ; « bel et bien » exprime l’insistance sans archaïsme.
