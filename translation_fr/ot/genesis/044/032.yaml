id: GEN.44.32
reference: Genesis 44:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י עַבְדְּ/ךָ֙ עָרַ֣ב אֶת הַ/נַּ֔עַר מֵ/עִ֥ם אָבִ֖/י לֵ/אמֹ֑ר אִם לֹ֤א אֲבִיאֶ֨/נּוּ֙ אֵלֶ֔י/ךָ וְ/חָטָ֥אתִי לְ/אָבִ֖/י כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: fr
  text: 'Car ton serviteur s’est porté garant[a] du garçon auprès de mon père en disant : « Si je ne te le ramène pas, je serai coupable envers mon père toute ma vie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a répondu du garçon » ou « s’est engagé personnellement pour le garçon ». Le verbe hébreu désigne la responsabilité assumée par un garant.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’aurai péché envers ou contre mon père tous les jours ». Dans ce contexte, l’expression évoque une culpabilité durable devant son père.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication donnée par Juda et relie naturellement ce verset à sa supplication.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Conserve la formule de déférence employée devant un supérieur sans imposer ici le sens plus marqué d’« esclave ».
- source_word: עָרַב
  choice: s’est porté garant
  rationale: Exprime la responsabilité personnelle assumée par Juda comme garant, avec une tournure française naturelle.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: Rend le terme familial désignant Benjamin sans suggérer nécessairement qu’il s’agit d’un petit enfant.
- source_word: מֵעִם אָבִי
  choice: auprès de mon père
  rationale: Indique que Juda a pris cet engagement vis-à-vis de son père, tout en restant proche de la construction hébraïque.
- source_word: לֵאמֹר
  choice: en disant
  rationale: Introduit directement le contenu de l’engagement de Juda.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: Si je ne te le ramène pas
  rationale: Le contexte implique le retour de Benjamin auprès de Jacob ; « ramener » rend cette idée naturellement en français.
- source_word: וְחָטָאתִי לְאָבִי
  choice: je serai coupable envers mon père
  rationale: Préserve le vocabulaire de culpabilité du verbe חטא tout en exprimant clairement la responsabilité relationnelle de Juda envers son père.
- source_word: כָּל הַיָּמִים
  choice: toute ma vie
  rationale: Expression française idiomatique correspondant à une culpabilité qui durerait tous les jours de l’existence de Juda.
theological_decisions:
- issue: Portée de וְחָטָאתִי לְאָבִי
  choice: je serai coupable envers mon père
  alternative: j’aurai péché contre mon père
  rationale: La traduction principale conserve l’idée morale de culpabilité sans décider que le syntagme décrit exclusivement un péché au sens religieux ; la note maintient visible la formulation plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement reflète les formes hébraïques singulières et la continuité du discours de Juda. La formulation conserve le ton déférent de « ton serviteur » et la force morale de la responsabilité assumée.
