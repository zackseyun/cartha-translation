  text: וְ/עַתָּ֗ה כְּ/בֹאִ/י֙ אֶל עַבְדְּ/ךָ֣ אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתָּ֑/נוּ וְ/נַפְשׁ֖/וֹ קְשׁוּרָ֥ה בְ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: fr
  text: Et maintenant, lorsque j’irai auprès de ton serviteur, mon père, et que le jeune homme ne sera pas avec nous — sa vie étant liée à la sienne[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son âme [ou : sa vie] est liée à son âme [ou : sa vie] ». Le premier pronom renvoie au père, le second au jeune homme, Benjamin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la liaison narrative de וְ et la progression du plaidoyer marquée par עַתָּה.
- source_word: כְּבֹאִי
  choice: quand je retournerai
  rationale: La construction כְּ + infinitif construit avec suffixe exprime le moment de l’arrivée. « Retournerai » explicite naturellement le retour de Juda auprès de son père, déjà impliqué par le contexte.
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: auprès de ton serviteur, mon père
  rationale: Préserve la formule déférente adressée à Joseph et l’apposition qui identifie le serviteur comme étant le père de Juda.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר peut désigner un garçon ou un jeune homme. Benjamin étant adulte, « jeune homme » convient mieux en français moderne tout en gardant le point de vue familial de Juda.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: n’est pas avec nous
  rationale: Rend directement et naturellement l’expression hébraïque de l’absence.
- source_word: וְנַפְשׁוֹ קְשׁוּרָה בְנַפְשׁוֹ
  choice: sa vie étant liée à la sienne
  rationale: « Vie » rend ici נֶפֶשׁ sans imposer une anthropologie technique. La tournure participiale conserve le caractère circonstanciel et laisse ouverte sa nuance exacte; le second pronom renvoie contextuellement au jeune homme.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans la relation entre Jacob et Benjamin
  choice: vie
  alternative: âme
  rationale: Le contexte décrit l’attachement vital de Jacob à Benjamin, non une distinction doctrinale entre corps et âme. « Vie » préserve cette force sans introduire une lecture confessionnelle.
- issue: Valeur logique de la proposition participiale finale
  choice: tournure circonstancielle non explicitement causale
  alternative: car sa vie est liée à la sienne
  rationale: L’hébreu juxtapose une proposition participiale; traduire par « car » fixerait une relation causale plausible mais plus explicite que le texte source.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le verset reste syntaxiquement suspendu, comme en hébreu, puisque la conséquence vient au verset suivant. Le tiret met en relief la proposition circonstancielle sans lui imposer une valeur causale.
