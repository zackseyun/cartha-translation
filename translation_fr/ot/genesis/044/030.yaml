  source_fidelity: La coordination hébraïque exige « et que le jeune homme ne soit pas avec nous », non « si le jeune homme… », qui transforme la coordination/circonstance en condition. « Retournerai » ajoute l’idée de retour, absente de כְּבֹאִי (« quand je viendrai / irai »). Le participe « sa vie étant liée à la sienne » rend bien la construction finale et conserve la suspension du discours.
  naturalness: La phrase révisée reste naturelle dans un registre soutenu moderne et reproduit correctement la phrase laissée en suspens, dont l’apodose se poursuit au verset suivant. « Lorsque j’irai » évite l’ajout de « retournerai » tout en étant idiomatique.
  terminology: « Jeune homme » convient à נַעַר dans ce contexte. « Vie » pour נֶפֶשׁ est contextuellement juste et ne force aucune lecture anthropologique. La note explicite avec justesse les deux référents des suffixes.
