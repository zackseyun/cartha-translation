  text: 'Il les rattrapa et leur adressa ces paroles :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: Il les rattrapa
  rationale: Le hifil de נשׂג avec le suffixe de troisième personne masculine plurielle exprime ici le fait de rejoindre les frères en chemin. « Les rattrapa » est naturel en français moderne et convient au contexte de poursuite.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: et leur adressa
  rationale: דבר signifie « parler », et אֶל indique les destinataires. Avec « ces paroles » comme complément, « leur adressa » restitue naturellement en français l’idée de parler à quelqu’un sans produire la tournure pesante « leur parla ces paroles ».
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: L’expression signifie littéralement « ces paroles » et introduit le discours direct qui suit. « Paroles » conserve mieux la valeur verbale de דְּבָרִים que « choses ».
