  text: הֲ/ל֣וֹא זֶ֗ה אֲשֶׁ֨ר יִשְׁתֶּ֤ה אֲדֹנִ/י֙ בּ֔/וֹ וְ/ה֕וּא נַחֵ֥שׁ יְנַחֵ֖שׁ בּ֑/וֹ הֲרֵעֹתֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: fr
  text: N’est-ce pas la coupe dans laquelle mon maître boit et dont il se sert assurément pour pratiquer la divination[a] ? Vous avez mal agi en faisant cela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et il peut assurément deviner grâce à elle ». En hébreu, un infinitif absolu accompagne le verbe conjugué pour renforcer l’affirmation.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Vous avez mal agi dans ce que vous avez fait. »'
    reason: literal_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: N’est-ce pas la coupe
  rationale: La particule introduit une question rhétorique attendant l’assentiment. Le référent de זֶה étant la coupe, sa reprise explicite produit un français naturel.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: dans laquelle mon maître boit
  rationale: Avec un récipient, le français dit naturellement « boire dans une coupe ». « Mon maître » convient au rapport social entre l’intendant et Joseph sans connotation théologique indue.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: et dont il se sert pour pratiquer la divination
  rationale: Le second בּוֹ exprime ici l’instrument. La construction infinitif absolu + verbe fini renforce l’affirmation; « se sert pour pratiquer » rend clairement l’usage instrumental, tandis que la note signale l’emphase.
- source_word: הֲרֵעֹתֶם
  choice: Vous avez mal agi
  rationale: Le hiphil de רעע exprime une conduite mauvaise. « Mal agir » conserve le jugement moral tout en étant plus idiomatique en français que « faire le mal » dans cette construction.
- source_word: אֲשֶׁר עֲשִׂיתֶם
  choice: en faisant cela
  rationale: La relative précise l’acte reproché. Cette formulation naturelle évite en français une répétition pesante de « faire » tout en maintenant le lien explicatif.
theological_decisions:
- issue: Faut-il présenter Joseph comme pratiquant réellement la divination, ou seulement comme jouant un rôle dans son stratagème ?
  choice: 'Traduire sans l’atténuer l’affirmation de l’intendant : « il se sert [de la coupe] pour pratiquer la divination ».'
  alternative: Formuler « il peut certainement deviner grâce à elle » ou suggérer qu’il ne s’agit que d’une réputation.
  rationale: L’hébreu place cette affirmation dans la bouche de l’intendant et emploie explicitement le vocabulaire de la divination. La traduction doit conserver cette tension narrative sans décider si l’affirmation décrit la pratique réelle de Joseph ou relève de sa mise en scène.
translation_notes:
  register: Français international moderne, naturel et digne. « Coupe » est explicité pour assurer la cohésion du verset; « pratiquer la divination » conserve le terme religieux et la tension du récit. Les marqueurs [a] et [b] figurent tous deux dans le texte.
