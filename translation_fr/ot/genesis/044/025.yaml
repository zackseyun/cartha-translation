  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: fr
  text: 'Alors notre père a dit : « Retournez-y et achetez-nous un peu de nourriture[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Retournez-y et achetez-nous un peu de céréales. » Le mot hébreu traduit par « nourriture » est général, bien que le contexte concerne les céréales.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... a dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette succession en français moderne.
- source_word: אָבִינוּ
  choice: notre père
  rationale: Dans ce contexte, le terme désigne Jacob, le père immédiat des frères.
- source_word: שֻׁבוּ
  choice: Retournez-y
  rationale: L’impératif demande aux frères de se rendre de nouveau au lieu où ils avaient acheté de la nourriture ; « -y » rend cette orientation naturellement sans alourdir la phrase.
- source_word: שִׁבְרוּ
  choice: achetez
  rationale: Dans le récit de Joseph, le verbe signifie acheter des vivres, notamment des céréales. Le complément explicite permet de conserver le verbe général « acheter ».
- source_word: לָנוּ
  choice: -nous
  rationale: Le pronom marque le bénéficiaire ; « achetez-nous » est une tournure française naturelle et concise.
- source_word: מְעַט
  choice: un peu de
  rationale: Cette expression conserve l’idée d’une petite quantité.
- source_word: אֹכֶל
  choice: nourriture
  rationale: Le mot hébreu est général et signifie « nourriture », même si le contexte plus large concerne l’achat de céréales.
