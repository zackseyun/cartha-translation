  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: fr
  text: 'Nous avons dit à mon seigneur : « Nous avons un père âgé et un jeune garçon, enfant de sa vieillesse[a]. Son frère est mort ; il est donc le seul fils qui reste à sa mère[b], et son père l’aime. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un jeune enfant de sa vieillesse ». Cette expression hébraïque désigne un enfant né alors que son père était déjà avancé en âge.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lui seul est resté à sa mère » ; autrement dit, il est le seul fils de sa mère qui soit encore en vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Dans ce récit, il s’agit d’une adresse respectueuse à un supérieur. « Mon seigneur » conserve la hiérarchie sociale et l’écho de la formulation hébraïque.
- source_word: זָקֵן
  choice: âgé
  rationale: Le mot indique l’âge avancé du père ; « âgé » est naturel, digne et précis en français moderne.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: un jeune garçon, enfant de sa vieillesse
  rationale: Cette formulation rend à la fois יֶלֶד et קָטָן, tout en conservant l’idiome « enfant de sa vieillesse » sans expliciter dans le texte ce que l’hébreu laisse implicite.
- source_word: וְאָחִיו מֵת
  choice: Son frère est mort
  rationale: Le français exprime naturellement l’état résultant signalé par la proposition hébraïque.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: il est donc le seul qui reste de sa mère
  rationale: « Le seul qui reste » exprime l’exclusivité de לְבַדּוֹ. « De sa mère » indique qu’il est l’unique fils de cette mère encore en vie, sans suggérer qu’il aurait été confié à ses soins.
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: et son père l’aime
  rationale: Traduction directe et transparente de l’affection particulière du père pour le garçon.
