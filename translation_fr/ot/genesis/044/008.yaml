  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: fr
  text: 'Voyez : l’argent que nous avions trouvé à l’ouverture de nos sacs, nous vous l’avons rapporté du pays de Canaan. Comment donc aurions-nous pu voler de l’argent ou de l’or de la maison de votre maître ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: Particule qui attire l’attention sur la preuve avancée. « Voyez » conserve l’appel emphatique dans un français actuel et digne.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le mot désigne littéralement l’argent-métal et, dans ce contexte, la monnaie. Le français « argent » rend naturellement les deux nuances et maintient la reprise avec « de l’argent ou de l’or ».
- source_word: מָצָאנוּ
  choice: nous avions trouvé
  rationale: Le plus-que-parfait explicite naturellement en français que cette découverte précède le fait de rapporter l’argent.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: à l’ouverture de nos sacs
  rationale: Littéralement « dans la bouche de nos sacs ». « À l’ouverture » transmet clairement l’image idiomatique sans produire une formulation française étrange.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: nous vous l’avons rapporté
  rationale: Le hifil de שוב exprime ici le fait de faire revenir l’argent. « Rapporter » est la tournure française la plus naturelle.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: du pays de Canaan
  rationale: Formulation géographique courante et fidèle.
- source_word: וְאֵיךְ נִגְנֹב
  choice: Comment donc aurions-nous pu voler
  rationale: La question est rhétorique et tire une conclusion du comportement antérieur des frères. Le conditionnel passé avec « pouvoir » restitue cette impossibilité alléguée.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: dans la maison de votre maître
  rationale: אדון désigne ici le maître humain de l’intendant. En français, on vole quelque chose « dans » une maison ; cette préposition rend idiomatiquement l’origine marquée par מִן.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: de l’argent ou de l’or
  rationale: Conserve la paire concrète du texte hébreu et la répétition argumentative de « argent ».
theological_decisions: []
