  register: 'Français international moderne, clair et digne. La syntaxe conserve le mouvement argumentatif du verset : rappel de leur honnêteté passée, puis question rhétorique. L’idiome hébreu « bouche des sacs » est rendu directement par son sens afin d’éviter une note inutile.'
