  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: fr
  text: 'Ils lui dirent : « Pourquoi mon seigneur parle-t-il ainsi[a] ? Loin de tes serviteurs l’idée de faire une chose pareille ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prononce de telles paroles » ; autre traduction : « dit de telles choses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Ils lui dirent
  rationale: Le wayyiqtol poursuit simplement le récit et introduit la réponse collective des frères; le pronom renvoie à l’intendant de Joseph.
- source_word: לָמָּה יְדַבֵּר אֲדֹנִי
  choice: Pourquoi mon seigneur parle-t-il
  rationale: La question directe et l’adresse respectueuse au singulier sont conservées. Ici, אֲדֹנִי désigne un supérieur humain, non Dieu.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ainsi
  rationale: Dans ce contexte, le français idiomatique « parler ainsi » rend naturellement l’idée de prononcer des paroles de cette sorte; la formulation plus littérale est signalée en note.
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: Loin de tes serviteurs l’idée de
  rationale: Cette tournure française exprime la vive répudiation portée par חָלִילָה et maintient l’auto-désignation déférente « tes serviteurs ».
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: faire une chose pareille
  rationale: La formulation est naturelle en français et conserve le renvoi démonstratif à l’acte dont ils sont soupçonnés.
