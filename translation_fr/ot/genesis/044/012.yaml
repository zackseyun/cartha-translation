id: GEN.44.12
reference: Genesis 44:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְחַפֵּ֕שׂ בַּ/גָּד֣וֹל הֵחֵ֔ל וּ/בַ/קָּטֹ֖ן כִּלָּ֑ה וַ/יִּמָּצֵא֙ הַ/גָּבִ֔יעַ בְּ/אַמְתַּ֖חַת בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: fr
  text: Il fouilla, en commençant par l’aîné et en terminant par le plus jeune, et la coupe[a] fut trouvée dans le sac de Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « gobelet ». Le terme hébreu peut désigner une coupe ou un gobelet.'
    reason: Alternative lexicale authentique pour הַגָּבִיעַ.
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: Il fouilla
  rationale: Le verbe חפשׂ décrit ici une fouille méthodique des bagages. « Fouilla » est naturel en français narratif et conserve l’action exprimée sans préciser davantage l’objet implicite.
- source_word: בַּגָּדוֹל
  choice: par l’aîné
  rationale: Dans ce contexte familial, גָּדוֹל désigne le frère le plus âgé plutôt que le plus grand par la taille ou le rang.
- source_word: הֵחֵל
  choice: en commençant
  rationale: Cette formulation marque clairement le point de départ de la fouille ordonnée et s’associe naturellement à « en terminant ».
- source_word: וּבַקָּטֹן
  choice: par le plus jeune
  rationale: En contraste avec « l’aîné », קָטֹן renvoie ici au frère le plus jeune, non au plus petit physiquement ou au moins important.
- source_word: כִּלָּה
  choice: en terminant
  rationale: Le verbe indique le terme de la fouille et rend la progression ordonnée du texte hébreu.
- source_word: וַיִּמָּצֵא
  choice: fut trouvée
  rationale: Le nifal est rendu au passif, conformément à la forme hébraïque, sans remplacer celle-ci par l’actif « il trouva ».
- source_word: הַגָּבִיעַ
  choice: la coupe
  rationale: גָּבִיעַ peut désigner une coupe ou un gobelet. « Coupe » convient au registre narratif et reste immédiatement compréhensible; l’autre possibilité est signalée en note.
- source_word: בְּאַמְתַּחַת
  choice: dans le sac
  rationale: אַמְתַּחַת désigne un sac servant au transport de provisions ou de marchandises; « sac » convient au contexte du voyage et du grain.
- source_word: בִּנְיָמִן
  choice: de Benjamin
  rationale: Le nom propre est rendu selon sa forme française conventionnelle.
