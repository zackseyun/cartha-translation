  edition: WLC
  text: הַ/בֹּ֖קֶר א֑וֹר וְ/הָ/אֲנָשִׁ֣ים שֻׁלְּח֔וּ הֵ֖מָּה וַ/חֲמֹרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: fr
  text: Dès qu’il fit jour[a], les hommes furent renvoyés, eux et leurs ânes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dès l’aube » ou « Lorsque le matin fut clair ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּקֶר
  choice: le matin
  rationale: Le nom défini désigne le moment du jour; « le matin » en conserve naturellement la détermination en français.
- source_word: אוֹר
  choice: fut clair
  rationale: Le verbe אור exprime ici l’apparition de la lumière du jour. « fut clair » en préserve la valeur verbale sans imposer l’interprétation plus idiomatique « se leva ».
- source_word: וְהָאֲנָשִׁים
  choice: les hommes
  rationale: Rendu direct du pluriel défini; la coordination est intégrée naturellement après la proposition temporelle.
- source_word: שֻׁלְּחוּ
  choice: on laissa partir
  rationale: Le pual de שלח a un sens passif de renvoi ou de permission de partir. La tournure française indéfinie conserve ce sens tout en évitant le peu naturel « furent envoyés au loin ».
- source_word: הֵמָּה
  choice: eux
  rationale: Le pronom indépendant, apposé, est conservé afin de maintenir le léger relief de l’hébreu et le groupement avec les ânes.
- source_word: וַחֲמֹרֵיהֶם
  choice: et leurs ânes
  rationale: Cette formulation reproduit directement la coordination hébraïque, plutôt que d’ajouter la préposition « avec ».
