  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: fr
  text: Ils se dépêchèrent donc, et chacun descendit son sac à terre, puis chacun ouvrit son sac.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: ils se dépêchèrent
  rationale: Le verbe מהר exprime l’empressement et la rapidité. « Se dépêcher » est naturel en français moderne et conserve la vivacité du récit.
- source_word: וַיּוֹרִדוּ
  choice: descendit
  rationale: La forme hiphil de ירד signifie faire descendre. Dans le contexte, chacun fait descendre son sac, vraisemblablement de sa monture, jusqu’au sol ; « descendit » préserve ce mouvement sans ajouter explicitement la monture.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: chacun ... son sac
  rationale: אִישׁ a ici une valeur distributive. La répétition de « chacun » reproduit l’insistance hébraïque sur l’action individuelle de tous les hommes.
- source_word: אַמְתַּחַת
  choice: sac
  rationale: Le terme désigne un contenant destiné aux provisions ou aux céréales. « Sac » convient au contexte et reste clair pour le lecteur moderne.
- source_word: אָרְצָה
  choice: à terre
  rationale: La forme directionnelle indique un mouvement vers le sol. « À terre » est idiomatique et précis en français.
- source_word: וַיִּפְתְּחוּ
  choice: ouvrit
  rationale: פתח signifie simplement ouvrir. Le singulier s’accorde naturellement avec le distributif « chacun », tandis que le sens collectif du pluriel hébreu demeure intact.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe garde d’abord le sujet collectif du verbe pluriel (« ils »), puis reproduit les deux emplois distributifs de אִישׁ par « chacun ». « Puis » rend la succession narrative du second wayyiqtol sans alourdir la phrase.
