base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: fr
  text: Si vous m’enlevez aussi celui-ci, et qu’un malheur lui arrive, vous ferez descendre mes cheveux blancs dans la détresse au séjour des morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : shéol. Peut aussi être traduit par « la tombe » ou « le domaine des morts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקַחְתֶּם
  choice: Si vous… enlevez
  rationale: Le waw suivi de l’accompli poursuit ici une construction conditionnelle; « si » rend naturellement la logique du discours de Juda rapportant les paroles de Jacob.
- source_word: גַּם אֶת זֶה
  choice: aussi celui-ci
  rationale: גַּם marque l’ajout de Benjamin aux fils déjà perdus ou absents, tandis que « celui-ci » conserve la désignation affective et contextuelle.
- source_word: מֵעִם פָּנַי
  choice: m’enlevez
  rationale: L’expression signifie littéralement « d’auprès de ma face/présence ». « M’enlevez » exprime idiomatiquement en français la séparation redoutée par Jacob sans calquer maladroitement l’hébreu.
- source_word: וְקָרָהוּ אָסוֹן
  choice: qu’un malheur lui arrive
  rationale: Cette formulation conserve le sens de « survenir, arriver » avec אָסוֹן, qui désigne ici une calamité ou un accident grave, sans préciser indûment sa nature.
- source_word: וְהוֹרַדְתֶּם
  choice: vous ferez descendre
  rationale: Le hiphil de ירד est causatif. « Faire descendre » préserve explicitement la causalité et l’image de la descente.
- source_word: שֵׂיבָתִי
  choice: mes cheveux blancs
  rationale: Le terme évoque littéralement les cheveux blancs comme métonymie de la vieillesse; le pluriel est l’expression française naturelle qui conserve l’image hébraïque.
- source_word: בְּרָעָה
  choice: dans la détresse
  rationale: Dans ce contexte, רָעָה désigne l’affliction ou la détresse plutôt que le mal moral. « Dans la détresse » reste sobre et compatible avec la douleur envisagée.
- source_word: שְׁאֹלָה
  choice: au séjour des morts
  rationale: Le terme désigne le monde ou domaine des morts. « Séjour des morts » communique directement ce sens en français moderne sans le réduire à la seule tombe ni lui imposer une précision doctrinale ultérieure.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le shéol; la tombe
  rationale: « Le séjour des morts » préserve l’idée vétérotestamentaire du domaine des défunts sans l’identifier simplement à une sépulture ni importer une conception théologique plus tardive. La translittération « shéol » est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conditionnelle reste claire; l’image des cheveux blancs et celle de la descente sont conservées. Le marqueur [a] est placé après l’expression qu’il explique.
