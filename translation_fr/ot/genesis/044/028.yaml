  text: 'L’un est parti de chez moi, et j’ai dit : « Il a certainement été mis en pièces. » Depuis, je ne l’ai pas revu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: L’un d’eux m’a quitté
  rationale: Rend l’idée qu’un des deux fils s’est éloigné de Jacob, dans un français naturel, sans préciser davantage les circonstances.
- source_word: אַךְ טָרֹף טֹרָף
  choice: Il a certainement été déchiqueté !
  rationale: אַךְ marque ici la certitude, tandis que l’infinitif absolu suivi du verbe intensifie l’affirmation d’une mise en pièces par une bête.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: Depuis, je ne l’ai pas revu
  rationale: Formulation idiomatique qui conserve le sens temporel de « jusqu’à maintenant » et le fait que Jacob ne l’a plus vu.
