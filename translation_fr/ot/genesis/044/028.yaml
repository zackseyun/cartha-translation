  verdict: revise
  source_fidelity: La proposition rend correctement l’affirmation intensive אַךְ טָרֹף טֹרָף (« il a certainement été mis en pièces ») et le constat qu’il ne l’a pas vu jusqu’à présent. Toutefois, וַיֵּצֵא ... מֵאִתִּי signifie plus précisément « l’un est parti d’auprès/de chez moi » que « m’a quitté », formulation française qui peut suggérer une rupture relationnelle ou un décès.
  naturalness: Le français est globalement fluide. « L’un est parti de chez moi » est plus concret et plus fidèle au mouvement exprimé par l’hébreu, tout en restant naturel dans le discours de Jacob. « Depuis, je ne l’ai pas revu » rend idiomatiquement « jusqu’ici ».
  terminology: « Mis en pièces » rend naturellement l’idée de proie déchirée sans ajouter un agent non exprimé. Aucun terme théologique ni nom propre n’est en jeu.
