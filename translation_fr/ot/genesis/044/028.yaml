    rationale: Le texte dit littéralement qu’« un » est sorti/parti d’auprès de Jacob. En français, « quitter quelqu’un » peut introduire une nuance affective ou relationnelle non nécessaire.
  - severity: low
    issue: « déchiqueté » est possible, mais « mis en pièces » reflète plus directement l’intensif passif « certainement déchiré en morceaux ».
    rationale: Cette expression conserve l’incertitude de Jacob concernant la cause exacte, sans expliciter une bête prédatrice.
