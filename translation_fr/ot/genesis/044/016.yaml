  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: fr
  text: 'Juda dit : « Que pouvons-nous dire à mon seigneur ? Que pouvons-nous déclarer ? Et comment pourrions-nous nous justifier[a] ? Dieu a mis au jour la faute[b] de tes serviteurs. Nous voici esclaves[c] de mon seigneur, aussi bien nous que celui entre les mains de qui la coupe a été trouvée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comment pourrions-nous prouver notre innocence ? » Le verbe hébreu peut signifier se montrer dans son droit ou se justifier.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « a découvert la culpabilité de tes serviteurs ». Le terme hébreu peut désigner la faute, la culpabilité qui en résulte, ou sa conséquence.'
    reason: lexical_alternative
  - marker: c
    text: « Tes serviteurs » est d’abord une formule de déférence devant un supérieur ; « esclaves » désigne ensuite la condition de servitude que les frères acceptent.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: à mon seigneur / de mon seigneur
  rationale: Dans ce contexte, אָדוֹן désigne Joseph comme supérieur. « Mon seigneur » conserve l’adresse déférente sans suggérer un titre divin.
- source_word: מַה נֹּאמַר / מַה נְּדַבֵּר
  choice: Que pouvons-nous dire ? / Que pouvons-nous déclarer ?
  rationale: Les deux verbes forment une progression rhétorique. « Déclarer » distingue le second sans lui imposer le sens plus précis de « plaider ».
- source_word: וּמַה נִּצְטַדָּק
  choice: Et comment pourrions-nous nous justifier ?
  rationale: Le hitpael de צדק signifie ici se montrer dans son droit ou établir son innocence. Le conditionnel exprime naturellement l’impuissance rhétorique de Juda.
- source_word: מָצָא אֶת עֲוֺן
  choice: a mis au jour la faute
  rationale: L’expression indique que Dieu a découvert ou révélé une culpabilité jusque-là cachée. « Mis au jour » rend cette dimension mieux qu’un simple « trouvé ».
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: tes serviteurs / esclaves
  rationale: Le premier emploi est une autodésignation déférente devant un supérieur ; le second décrit la condition de dépendance à laquelle les frères se livrent effectivement.
- source_word: הִנֶּנּוּ
  choice: Nous voici
  rationale: Cette tournure française actuelle conserve la force présentative et l’idée de reddition.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: aussi bien nous que celui entre les mains de qui la coupe a été trouvée
  rationale: « Aussi bien… que… » restitue la double inclusion marquée par גַּם, tandis que « entre les mains » suit l’image juridique et concrète de l’hébreu.
- source_word: הַגָּבִיעַ
  choice: la coupe
  rationale: « Coupe » est naturel et digne en français moderne ; « gobelet » serait trop ordinaire et « calice » introduirait une connotation cultuelle absente.
theological_decisions:
- issue: Sens de הָאֱלֹהִים dans la confession de Juda
  choice: Juda attribue à Dieu la mise au jour de leur faute cachée.
  alternative: Une puissance divine indéterminée aurait découvert leur méfait.
  rationale: 'Dans le contexte narratif de la Genèse, הָאֱלֹהִים renvoie clairement au Dieu unique. La formulation laisse toutefois ouverte la faute précise que Juda a en vue : le vol supposé de la coupe ou la culpabilité plus ancienne des frères.'
- issue: Référent de עֲוֺן
  choice: « la faute » conserve une portée générale.
  alternative: Préciser « notre faute envers Joseph » ou « le vol de la coupe ».
  rationale: Le texte ne nomme pas explicitement la faute. Une formulation générale préserve la tension entre l’accusation immédiate et la culpabilité ancienne des frères.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le discours conserve la triple question rhétorique et distingue l’adresse déférente « serviteurs » de l’offre effective de devenir « esclaves ».
