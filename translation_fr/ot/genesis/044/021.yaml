  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ הוֹרִדֻ֖/הוּ אֵלָ֑/י וְ/אָשִׂ֥ימָה עֵינִ֖/י עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: fr
  text: 'Alors tu as dit à tes serviteurs : « Faites-le descendre auprès de moi, afin que je pose les yeux sur lui.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que je le voie ». L’expression hébraïque signifie littéralement « poser mon œil sur lui » et peut évoquer le fait de voir, d’examiner ou d’accorder une attention particulière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors tu as dit
  rationale: Le wayyiqtol poursuit le récit; « Alors » exprime naturellement la succession tout en conservant l’adresse directe à Joseph.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans cette scène de cour, עבד désigne ceux qui se présentent comme subordonnés de Joseph; « serviteurs » convient mieux ici que « esclaves ».
- source_word: הוֹרִדֻהוּ
  choice: Faites-le descendre
  rationale: L’impératif hiphil pluriel de ירד avec suffixe masculin singulier exprime l’action de faire descendre quelqu’un et conserve la direction traditionnelle du voyage vers l’Égypte.
- source_word: אֵלָי
  choice: jusqu’à moi
  rationale: La préposition marque le mouvement vers Joseph; « jusqu’à moi » rend clairement la destination personnelle.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: afin que je pose les yeux sur lui
  rationale: Cette formulation préserve l’image hébraïque sans trancher entre le simple fait de voir, l’examen et une attention particulière.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement n’est pas employé, puisque Juda s’adresse ici directement à Joseph au singulier; le pluriel de « Faites » correspond aux serviteurs auxquels Joseph avait donné l’ordre.
