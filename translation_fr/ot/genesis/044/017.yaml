  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: fr
  text: 'Mais il dit : « Il est hors de question que je fasse cela ! L’homme chez qui la coupe a été trouvée, c’est lui qui sera mon esclave[a]. Quant à vous, remontez en paix auprès de votre père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mon serviteur ». Le mot hébreu עָבֶד peut désigner un serviteur ou un esclave ; ici, il s’agit d’une servitude imposée comme châtiment. Littéralement : « dans la main duquel la coupe a été trouvée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Il est hors de question que je fasse cela
  rationale: Cette tournure française actuelle exprime le refus énergique et l’indignation portés par l’idiome hébreu, sans archaïsme.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: L’homme entre les mains de qui la coupe a été trouvée
  rationale: La formulation conserve l’image concrète de l’hébreu « dans sa main », tout en utilisant le pluriel idiomatique français « entre les mains », qui évoque la possession.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: c’est lui qui sera mon esclave
  rationale: La construction emphatique rend le pronom הוּא. Dans ce contexte de servitude punitive imposée, « esclave » exprime mieux que « serviteur » la contrainte impliquée, tout en signalant en note l’étendue sémantique du terme.
- source_word: וְאַתֶּם עֲלוּ
  choice: Quant à vous, remontez
  rationale: « Quant à vous » marque le contraste entre Benjamin et ses frères; l’impératif « remontez » conserve à la fois la forme verbale et l’orientation géographique conventionnelle du récit.
- source_word: לְשָׁלוֹם אֶל אֲבִיכֶם
  choice: en paix auprès de votre père
  rationale: « En paix » préserve l’idiome hébreu de départ sans hostilité ni danger; « auprès de votre père » est naturel en français pour le retour vers une personne.
