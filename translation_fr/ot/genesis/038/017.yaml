  yaml_path: translation/ot/genesis/038/017.yaml
  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: fr
  text: 'Il dit : « Je t’enverrai un chevreau du troupeau. » Elle répondit : « À condition que tu me donnes un gage[a] jusqu’à ce que tu l’envoies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une garantie » ou « un dépôt » pour « un gage » (עֵרָבוֹן).'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: un chevreau
  rationale: L’expression désigne le petit d’une chèvre. « Chevreau » est précis, naturel et suffit en français sans reproduire lourdement le complément « de chèvres ».
- source_word: מִן הַצֹּאן
  choice: du troupeau
  rationale: צֹאן désigne collectivement le petit bétail, notamment les moutons et les chèvres. « Du troupeau » est idiomatique puisque l’animal est déjà identifié comme un chevreau.
- source_word: עֵרָבוֹן
  choice: un gage[a]
  rationale: Le nom désigne un objet remis comme sûreté en attendant l’exécution d’une promesse. « Gage » convient au contexte, tandis qu’une note conserve les principales nuances lexicales.
- source_word: עַד שָׁלְחֶךָ
  choice: jusqu’à ce que tu l’envoies
  rationale: L’infinitif construit avec suffixe de deuxième personne masculine exprime l’envoi promis par Juda. Le pronom « l’ » reprend naturellement le chevreau mentionné juste avant.
- source_word: אִם תִּתֵּן
  choice: À condition que tu me donnes
  rationale: אִם introduit ici la condition posée par Tamar. « À condition que » rend clairement cette valeur dans un dialogue naturel; « me » explicite le destinataire nécessairement impliqué par le contexte.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: Je t’enverrai
  rationale: Le pronom indépendant אָנֹכִי souligne le sujet, mais le français l’exprime déjà par « je ». Le futur rend la promesse, et « t’ » explicite naturellement la destinataire.
