source:
  edition: WLC
  text: וַ/תֹּ֤סֶף עוֹד֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁלָ֑ה וְ/הָיָ֥ה בִ/כְזִ֖יב בְּ/לִדְתָּ֥/הּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: fr
  text: Elle eut encore un fils et l’appela Shéla. Il[a] était à Kezib[b] lorsqu’elle le mit au monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu porte « il était ». Certains témoins anciens et interprètes comprennent plutôt : « elle était à Kezib lorsqu’elle le mit au monde ». Le référent du pronom masculin est discuté.'
    reason: alternative_reading
  - marker: b
    text: Le nom de ce lieu est aussi transcrit Chezib ; Kezib et Chezib désignent le même endroit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: Elle eut encore un fils
  rationale: L’expression יסף + עוד marque ici la répétition, suivie de « elle enfanta un fils ». « Elle eut encore un fils » restitue naturellement et sobrement la progression du récit sans ajouter explicitement une conception que l’hébreu ne nomme pas.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: et l’appela Shéla
  rationale: Cette formulation française naturelle rend l’expression hébraïque « elle appela son nom » sans lourdeur, tout en conservant le nom propre sous une forme usuelle en français.
- source_word: וְהָיָה
  choice: Il était
  rationale: Le texte massorétique emploie une forme masculine singulière. Le pronom « Il » en maintient le genre sans identifier explicitement son référent, qui demeure discuté.
- source_word: בִכְזִיב
  choice: à Kezib
  rationale: La préposition « à » convient à la localisation dans une ville. « Kezib » est une translittération française claire du nom de lieu hébreu.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: lorsqu’elle le mit au monde
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle. « Lorsqu’elle le mit au monde » est idiomatique en français et exprime clairement l’accouchement.
theological_decisions:
- issue: Sujet de וְהָיָה (« il était » / « elle était »)
  choice: 'Conserver au masculin : « Il était »'
  alternative: « Elle était »
  rationale: La forme consonantique et vocalisée du texte massorétique est masculine singulière. Certains témoins anciens et interprètes comprennent toutefois un sujet féminin, probablement la mère. Le texte principal suit l’hébreu reçu, tandis que la note préserve l’ambiguïté de transmission et d’interprétation sans identifier dogmatiquement le référent masculin.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est concise et naturelle. Le pronom masculin du texte hébreu est conservé sans explicitation, et la variante féminine est signalée en note.
