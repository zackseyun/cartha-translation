base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: fr
  text: 'Il demanda aux hommes du lieu : « Où est la femme consacrée[a] qui se trouvait à Énaïm[b], au bord du chemin ? » Ils répondirent : « Il n’y a pas eu de femme consacrée ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est apparenté à l’idée de consécration. Il est traditionnellement compris, dans ce contexte, comme désignant une femme associée à des pratiques cultuelles et à la prostitution ; la nature précise de ce statut est discutée.
    reason: lexical_alternative
  - marker: b
    text: Énaïm est un nom de lieu. Sa forme hébraïque est apparentée au mot qui signifie « yeux » et peut aussi évoquer des sources.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Il interrogea
  rationale: Le verbe שׁאל décrit ici une demande de renseignement. « Interrogea » convient au récit et introduit naturellement la question directe.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: les hommes de l’endroit
  rationale: Cette formulation rend אַנְשֵׁי de manière explicite et restitue naturellement en français le lieu auquel renvoie le suffixe féminin, sans l’expression peu idiomatique « les hommes de son endroit ».
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français actuel, les deux-points introduisent naturellement les paroles directes là où l’hébreu emploie l’infinitif conventionnel « en disant ».
- source_word: הַקְּדֵשָׁה
  choice: la prostituée sacrée
  rationale: Ce choix distingue קְדֵשָׁה de זֹנָה dans le chapitre et signale l’association cultuelle suggérée par le terme, sans supposer l’existence d’un bâtiment de temple précis.
- source_word: בָעֵינַיִם
  choice: à Énaïm
  rationale: Le contexte traite עֵינַיִם comme un nom de lieu. La translittération française « Énaïm » préserve ce statut plutôt que de traduire littéralement le nom.
- source_word: עַל הַדָּרֶךְ
  choice: au bord du chemin
  rationale: Dans cette scène, עַל indique une position attenante à la voie. « Au bord du chemin » est précis et idiomatique.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: Il n’y a pas eu de prostituée sacrée ici
  rationale: La tournure rend la négation de la présence d’une telle femme en ce lieu, tout en évitant d’ajouter « jamais », qui élargirait explicitement la portée temporelle.
theological_decisions:
- issue: Nature exacte de la קְדֵשָׁה
  choice: prostituée sacrée
  alternative: femme consacrée ; prostituée liée à un culte
  rationale: Le mot est lié à la racine de la sainteté ou de la consécration et est traditionnellement compris ici comme une désignation cultuelle distincte de זֹנָה. La note conserve toutefois l’incertitude historique sur la fonction institutionnelle exacte.
translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct est allégé du calque « en disant ». Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
