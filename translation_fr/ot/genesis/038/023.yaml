  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: fr
  text: 'Juda dit : « Qu’elle garde ces objets, de peur que nous ne devenions la risée[a]. Regarde : j’ai envoyé ce chevreau, mais toi, tu ne l’as pas trouvée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « devenir un objet de mépris », « devenir méprisables » ou « être tournés en ridicule ». L’expression hébraïque évoque le mépris ou la dérision.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: Qu’elle garde ces objets
  rationale: 'La forme verbale a ici une valeur permissive : Juda renonce à récupérer les objets laissés en gage. « Ces objets » explicite sobrement le complément implicite et rend compte de leur pluralité dans le contexte.'
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: sinon nous risquons de devenir la risée des gens
  rationale: בּוּז évoque le mépris et la dérision. Cette formulation française naturelle exprime la crainte de Juda de devenir l’objet des moqueries publiques, sans réduire le terme à la seule honte.
- source_word: הִנֵּה
  choice: Après tout
  rationale: Dans ce contexte, la particule attire l’attention sur le fait invoqué par Juda pour justifier l’abandon des recherches. « Après tout » restitue naturellement cette fonction argumentative en français.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: j’ai envoyé ce chevreau
  rationale: גְּדִי désigne un jeune de la chèvre. « Chevreau » est précis et idiomatique, et le démonstratif « ce » conserve הַזֶּה.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: mais toi, tu ne l’as pas trouvée
  rationale: Le ו marque ici un contraste avec l’envoi du chevreau. Le pronom féminin renvoie à la femme recherchée, tandis que « toi » conserve l’insistance du pronom indépendant אַתָּה.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom propre biblique.
