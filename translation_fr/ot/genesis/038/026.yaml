base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: fr
  text: 'Juda les reconnut et dit : « Elle est plus juste que moi[a], car je ne l’ai pas donnée à mon fils Shéla. » Et il n’eut plus de relations sexuelles avec elle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elle est davantage dans son droit que moi. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « il ne recommença plus à la connaître »; « connaître » est ici un euphémisme désignant les relations sexuelles.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: les reconnut
  rationale: Le verbe indique que Juda reconnaît les objets remis en gage et présentés au verset précédent. Le pronom « les » explicite naturellement cet objet pluriel fourni par le contexte.
- source_word: צָדְקָה מִמֶּנִּי
  choice: Elle est plus juste que moi
  rationale: La construction comparative avec מִן présente Tamar comme plus juste que Juda dans cette affaire. Cette formulation conserve la portée morale de la racine צדק sans faire de cette déclaration un jugement absolu sur toute sa conduite.
- source_word: כִּי עַל כֵּן
  choice: car
  rationale: Dans ce contexte, l’expression introduit la raison donnée par Juda. « Car » restitue clairement et sobrement cette valeur causale.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: je ne l’ai pas donnée à mon fils Shéla
  rationale: La formulation suit de près l’hébreu; le contexte narratif indique qu’il s’agit de la donner en mariage.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: Et il n’eut plus de relations sexuelles avec elle
  rationale: Le verbe ידע, « connaître », est ici un euphémisme hébreu désignant les relations sexuelles. La tournure française choisie en communique directement le sens, tandis que « plus » rend l’idée qu’il ne recommença pas.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: שֵׁלָה
  choice: Shéla
  rationale: Translittération française claire du nom hébreu שֵׁלָה.
theological_decisions:
- issue: Portée morale de la confession de Juda
  choice: Juda reconnaît que Tamar est plus juste que lui dans cette affaire.
  alternative: Juda dit seulement qu’elle est davantage dans son droit, ou la déclare entièrement innocente.
  rationale: Le comparatif porte sur leur conduite respective dans la situation racontée. La traduction conserve la force morale de צדק sans attribuer à Tamar une innocence absolue ni réduire la phrase à une simple régularité de procédure.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct reste concis; l’euphémisme hébreu est explicité dans le texte pour être immédiatement compris, tout en étant signalé en note.
