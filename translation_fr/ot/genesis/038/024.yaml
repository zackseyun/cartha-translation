base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: fr
  text: 'Environ trois mois plus tard, on informa Juda : « Tamar, ta belle-fille, s’est livrée à la prostitution[a] ; voici qu’elle est aussi enceinte à la suite de ses actes de prostitution[b]. » Juda dit alors : « Faites-la sortir, et qu’elle soit brûlée ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’est conduite comme une prostituée » ; plus largement : « s’est livrée à l’inconduite sexuelle ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « est enceinte du fait de la prostitution » ou « est enceinte à la suite d’actes de prostitution ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: Environ trois mois plus tard
  rationale: La préposition כְּ marque ici l’approximation. Cette formulation française naturelle situe clairement le nouvel épisode sans reprendre littéralement la tournure narrative hébraïque וַיְהִי.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: on informa Juda
  rationale: Le hophal de נגד exprime qu’un rapport est fait à Juda. Le sujet indéfini « on » rend naturellement le passif hébreu, tandis que les deux-points introduisent le contenu annoncé par לֵאמֹר.
- source_word: זָנְתָה
  choice: s’est prostituée
  rationale: Le verbe זנה évoque directement la prostitution ou, par extension, une conduite sexuelle illicite. Le choix français conserve l’image précise et la force accusatrice du propos.
- source_word: כַּלָּתֶךָ
  choice: ta belle-fille
  rationale: Dans ce contexte, le terme désigne sans ambiguïté la femme du fils de Juda. « Belle-fille » est le terme usuel en français.
- source_word: וְגַם הִנֵּה
  choice: elle est même
  rationale: « Même » restitue de façon idiomatique l’effet cumulatif et emphatique de וְגַם הִנֵּה, qui présente la grossesse comme confirmation frappante de l’accusation.
- source_word: הָרָה לִזְנוּנִים
  choice: enceinte du fait de sa prostitution
  rationale: Cette formulation exprime le lien causal porté par לִ et conserve le champ lexical de זנה dans un français compréhensible.
- source_word: הוֹצִיאוּהָ
  choice: Faites-la sortir
  rationale: L’impératif pluriel suivi du suffixe féminin singulier ordonne à plusieurs destinataires de faire sortir Tamar. Le causatif français reflète précisément la forme hiphil.
- source_word: וְתִשָּׂרֵף
  choice: et qu’elle soit brûlée
  rationale: La tournure au subjonctif passif rend la valeur injonctive de la forme niphal tout en laissant l’agent de l’exécution indéterminé, comme en hébreu.
theological_decisions:
- issue: Vocabulaire de l’accusation sexuelle
  choice: 'Employer le langage explicite de la prostitution : « s’est prostituée » et « du fait de sa prostitution ».'
  alternative: « s’est livrée à l’inconduite sexuelle » ou « est enceinte à la suite d’une relation illicite »
  rationale: Les formes apparentées זָנְתָה et זְנוּנִים appartiennent au champ lexical de la prostitution. Les rendre par un terme moral plus général atténuerait l’accusation formulée dans le récit et effacerait la répétition hébraïque.
- issue: Nature de l’ordre prononcé par Juda
  choice: « Faites-la sortir, et qu’elle soit brûlée ! »
  alternative: « Faites-la sortir pour la brûler » ou « Sortez-la et brûlez-la »
  rationale: Le texte présente un ordre sévère visant une mise à mort par le feu. La formulation retenue conserve le passif du niphal et n’ajoute aucune précision sur l’identité des exécutants ni sur les modalités du supplice.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement dans l’accusation correspond à l’adresse directe à Juda. « Faites-la sortir » et « qu’elle soit brûlée » conservent la solennité et la brutalité de l’ordre sans archaïsme. Les marqueurs de notes [a] et [b] sont placés sur les expressions qu’ils expliquent.
