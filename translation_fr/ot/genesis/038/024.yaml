    issue: Rendu atténué de וְגַם הִנֵּה
    rationale: « Elle est même enceinte » exprime l’ajout, mais ne rend qu’indirectement le marqueur déictique et emphatique הִנֵּה. « Voici qu’elle est aussi enceinte » conserve mieux l’effet de constat surprenant.
  - severity: low
    issue: Formulation causale légèrement raide
    rationale: « Du fait de sa prostitution » est grammatical, mais sonne moins naturel et peut évoquer une caractérisation générale. « À la suite de ses actes de prostitution » est plus idiomatique et correspond bien au pluriel abstrait זְנוּנִים.
