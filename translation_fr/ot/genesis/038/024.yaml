review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement la chronologie approximative, le rapport adressé à Juda, l’accusation formulée avec le vocabulaire de la prostitution, la grossesse présentée comme liée à cette accusation, et l’ordre passif de brûler Tamar. La révision restitue plus explicitement la valeur de surprise ou de constat de וְגַם הִנֵּה (« voici qu’elle est aussi »).
  naturalness: « Environ trois mois plus tard » et « on informa Juda » sont naturels. « Elle est même enceinte du fait de sa prostitution » est compréhensible, mais un peu lourd et moins proche de l’effet discursif de הִנֵּה. « Voici qu’elle est aussi enceinte à la suite de ses actes de prostitution » est plus fluide dans ce contexte accusatoire.
  terminology: « Belle-fille », « prostitution » et « qu’elle soit brûlée » conviennent au français moderne et maintiennent respectivement le lien familial, la répétition lexicale זנה/זנונים et la voix passive du niphal. « S’est livrée à la prostitution » évite de faire de « s’est prostituée » une désignation potentiellement plus statutaire, tout en préservant la force de l’accusation.
  issues:
