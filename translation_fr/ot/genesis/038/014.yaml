  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: fr
  text: Alors elle ôta ses vêtements de veuve, se couvrit d’un voile et s’en enveloppa. Puis elle s’assit à l’entrée d’Énaïm[a], sur le chemin de Timna. En effet, elle avait vu que Shéla avait grandi, mais qu’elle ne lui avait pas été donnée pour femme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Péta-Enaïm » ; l’expression hébraïque peut être comprise comme un nom de lieu.
    reason: Préserve l’incertitude sur l’analyse de פתח עינים, qui peut désigner « l’entrée d’Énaïm » ou être traité comme un toponyme composé.
lexical_decisions:
- source_word: וַתְּכַס בַּצָּעִיף וַתִּתְעַלָּף
  choice: se couvrit d’un voile et s’en enveloppa
  rationale: 'Rend les deux verbes successifs du texte hébreu sans les fondre en une seule action : elle se couvre avec le voile, puis s’en enveloppe.'
- source_word: בְּפֶתַח עֵינַיִם
  choice: à l’entrée d’Énaïm
  rationale: Comprend פֶתַח dans son sens courant d’« entrée » et עֵינַיִם comme le nom de lieu Énaïm, tout en signalant en note une autre analyse possible.
- source_word: גָדַל שֵׁלָה
  choice: Shéla avait grandi
  rationale: Traduction naturelle du verbe גָדַל qui préserve l’implication contextuelle de maturité sans ajouter explicitement « adulte ».
- source_word: לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: elle ne lui avait pas été donnée pour femme
  rationale: Conserve la construction passive et la formulation matrimoniale du texte source.
theological_decisions:
- issue: Motif de l’action de Tamar
  choice: maintenir la formulation factuelle selon laquelle Shéla avait grandi sans que Tamar lui ait été donnée
  alternative: expliciter que Juda n’avait pas l’intention de respecter son engagement
  rationale: Le verset expose les faits observés par Tamar, mais n’énonce pas directement les intentions de Juda ; la traduction ne les ajoute donc pas.
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent une translittération française lisible. La répétition des deux gestes liés au voile est conservée parce qu’elle correspond à deux verbes distincts en hébreu.
