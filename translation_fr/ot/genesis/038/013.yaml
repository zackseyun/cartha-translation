  text: וַ/יֻּגַּ֥ד לְ/תָמָ֖ר לֵ/אמֹ֑ר הִנֵּ֥ה חָמִ֛י/ךְ עֹלֶ֥ה תִמְנָ֖תָ/ה לָ/גֹ֥ז צֹאנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: fr
  text: 'On informa Tamar : « Voici que ton beau-père monte à Timna pour tondre ses moutons. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: On informa Tamar
  rationale: Le hofal de נגד exprime une communication passive dont Tamar est la destinataire. La tournure française impersonnelle avec « on » restitue naturellement ce sens sans inventer l’identité de l’informateur.
- source_word: לֵאמֹר
  choice: 'en ces termes :'
  rationale: Cette formule introduit le discours direct. « En ces termes » en exprime la fonction dans un français naturel et digne.
- source_word: הִנֵּה
  choice: non traduit séparément
  rationale: Dans cette annonce, הִנֵּה attire l’attention sur l’information qui suit. En français courant, la présentation directe après « en ces termes » porte déjà cette force; ajouter « regarde » serait moins idiomatique pour une information rapportée.
- source_word: חָמִיךְ
  choice: ton beau-père
  rationale: Le suffixe féminin singulier désigne Tamar comme interlocutrice; le terme de parenté est conservé explicitement.
- source_word: עֹלֶה
  choice: monte
  rationale: Le participe qal présente le déplacement en cours ou imminent. « Monte » conserve la nuance directionnelle de עלה sans préciser indûment le point de vue du locuteur.
- source_word: תִמְנָתָה
  choice: à Timna
  rationale: Le nom de lieu accompagné du hé directionnel indique la destination.
- source_word: לָגֹז
  choice: pour tondre
  rationale: L’infinitif construit avec ל exprime le but du déplacement.
- source_word: צֹאנוֹ
  choice: ses moutons
  rationale: צאן désigne collectivement le petit bétail; le contexte de la tonte justifie ici le terme précis et naturel « moutons ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe impersonnelle évite une lourde construction passive, tandis que le discours direct reste vif et clair.
