  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: fr
  text: Quand Juda la vit, il la prit pour une prostituée, car elle s’était couvert le visage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: Quand Juda la vit
  rationale: Le verbe ראה signifie « voir ». « Quand » rend naturellement en français l’enchaînement narratif et le rapport temporel avec le jugement qui suit.
- source_word: וַיַּחְשְׁבֶהָ לְזוֹנָה
  choice: il la prit pour une prostituée
  rationale: חשב avec ל exprime ici un jugement d’identité. « Prendre quelqu’un pour » est une tournure française naturelle qui communique clairement la méprise de Juda.
- source_word: לְזוֹנָה
  choice: une prostituée
  rationale: זונה désigne ici une prostituée. Ce terme est actuel, clair et sans coloration archaïque ni nuance sociologique moderne ajoutée.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison du jugement de Juda. « Car » conserve explicitement ce lien causal dans un registre narratif digne et naturel.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: elle s’était couvert le visage
  rationale: Le parfait décrit une circonstance antérieure expliquant la conclusion de Juda. Le plus-que-parfait français rend cette antériorité, et « se couvrir le visage » est idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste concise, évite les archaïsmes et ne précise pas au-delà de l’hébreu la nature ou le but de la couverture du visage.
