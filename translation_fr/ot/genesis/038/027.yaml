  text: Au moment de son accouchement, voici qu’il y avait des jumeaux dans son ventre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Quand le moment … arriva
  rationale: La construction introduit l’étape suivante du récit et en précise le cadre temporel. Cette formulation restitue naturellement la progression narrative sans archaïsme.
- source_word: לִדְתָּהּ
  choice: où elle devait accoucher
  rationale: L’infinitif construit de ילד avec suffixe féminin singulier désigne ici le moment où elle allait donner naissance; « accoucher » est clair et idiomatique en français actuel.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette expression attire l’attention sur une réalité remarquable ou inattendue; « voici que » en conserve la force discursive dans un registre digne.
- source_word: תְאוֹמִים
  choice: des jumeaux
  rationale: Le nom pluriel désigne directement des jumeaux.
- source_word: בְּבִטְנָהּ
  choice: elle portait
  rationale: Dans ce contexte de grossesse et d’accouchement, l’expression signifie que les jumeaux étaient dans son ventre. « Elle portait des jumeaux » rend ce sens de manière naturelle sans suggérer qu’ils venaient seulement d’être découverts à cet instant.
