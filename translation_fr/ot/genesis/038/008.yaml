review_pass:
  verdict: revise
  source_fidelity: 'Le sens général et la progression des trois impératifs sont bien rendus. Toutefois, « donne une descendance à ton frère » exprime moins nettement la valeur de finalité/attribution de לְאָחִיךָ : la descendance doit être suscitée pour le frère, dont la lignée est ainsi continuée.'
  naturalness: « Remplis envers elle ton devoir de beau-frère » est compréhensible, mais « accomplis envers elle ton devoir de beau-frère » est plus idiomatique en français moderne et conserve la portée technique du verbe יִבֵּם. Le reste est naturel, avec l’euphémisme « Va vers » qui maintient la retenue de l’hébreu.
  terminology: « Juda », « Onan », « femme de ton frère », « devoir de beau-frère » et « lévirat » sont appropriés. « Suscite une descendance pour ton frère » rend plus précisément l’établissement d’une postérité au bénéfice du frère, sans imposer une interprétation confessionnelle.
  issues:
  - severity: low
    issue: Nuance de finalité dans « à ton frère »
    rationale: Le לְ de לְאָחִיךָ indique que la postérité est établie pour le frère. « Pour ton frère » le signale plus clairement que « à ton frère ».
  - severity: low
    issue: Collocation de « remplir ... un devoir »
    rationale: En français courant, on accomplit un devoir; « accomplis envers elle ton devoir de beau-frère » est plus fluide tout en conservant le complément direct féminin du verbe hébreu.
  revised_text: 'Alors Juda dit à Onan : « Va vers la femme de ton frère, accomplis envers elle ton devoir de beau-frère[a] et suscite une descendance pour ton frère. »'
  revised_footnotes:
