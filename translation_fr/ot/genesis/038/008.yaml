  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: fr
  text: 'Alors Juda dit à Onan : « Va vers la femme de ton frère, accomplis envers elle ton devoir de beau-frère[a] et suscite une descendance pour ton frère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en termes plus techniques : « accomplis envers elle le devoir du lévirat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement la succession narrative en français moderne.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom hébreu יְהוּדָה.
- source_word: בֹּא אֶל
  choice: Va vers
  rationale: L’expression hébraïque désigne ici les relations sexuelles dans un cadre conjugal. « Va vers » conserve avec dignité l’euphémisme du texte source sans l’expliciter davantage.
- source_word: אֵשֶׁת אָחִיךָ
  choice: la femme de ton frère
  rationale: Rendu direct et naturel de la construction hébraïque.
- source_word: וְיַבֵּם אֹתָהּ
  choice: remplis envers elle ton devoir de beau-frère
  rationale: Le verbe technique יִבֵּם désigne l’accomplissement du devoir familial envers la veuve d’un frère. Cette formulation reste accessible tout en préservant le caractère juridique et familial du terme.
- source_word: וְהָקֵם זֶרַע
  choice: donne une descendance
  rationale: Dans cette expression, קום avec זֶרַע signifie susciter ou assurer une lignée. « Donne une descendance » est idiomatique en français et évite l’opacité de « suscite une semence ».
- source_word: לְאָחִיךָ
  choice: à ton frère
  rationale: La préposition ל indique ici que la descendance doit être attribuée au frère décédé. « À ton frère » exprime cette destination de façon concise.
theological_decisions:
- issue: Rendre la terminologie du devoir léviratique sans lui imposer les formulations d’une législation postérieure
  choice: remplis envers elle ton devoir de beau-frère
  alternative: accomplis envers elle le devoir du lévirat
  rationale: Le verbe יִבֵּם renvoie à l’obligation du beau-frère de donner une descendance au frère mort. Le texte principal en exprime la dimension familiale sans réduire l’acte à des relations sexuelles ni employer uniquement un terme technique peu connu; la note fournit ce terme.
translation_notes:
  register: Français international moderne, naturel et digne. L’euphémisme sexuel de l’hébreu est conservé par « va vers », tandis que le terme technique lié au lévirat est expliqué en note.
