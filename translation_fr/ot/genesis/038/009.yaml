  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: fr
  text: Mais Onan savait que la descendance ne serait pas la sienne[a]. Ainsi, chaque fois qu’il s’unissait à la femme de son frère, il répandait sa semence à terre[b], afin de ne pas donner de descendance à son frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la semence ne serait pas à lui ». Ici, le mot hébreu désigne la descendance, c’est-à-dire l’enfant qui serait rattaché à son frère décédé.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie un verbe signifiant « détruire » ou « gâcher » et ajoute « à terre », sans exprimer l’objet. Dans ce contexte, il s’agit de sa semence, répandue afin d’empêcher la conception.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: savait
  rationale: Rend directement ידע dans le récit, sans ajouter l’idée plus ponctuelle de « comprendre soudain ».
- source_word: הַזָּרַע
  choice: la descendance
  rationale: Dans le contexte du devoir familial envers le frère décédé, זרע désigne ici l’enfant ou la postérité qui serait juridiquement rattachée à celui-ci.
- source_word: לֹּא לוֹ יִהְיֶה הַזָּרַע
  choice: la descendance ne serait pas la sienne
  rationale: Conserve la formulation possessive de l’hébreu et sa portée familiale et juridique, sans préciser davantage la manière dont l’enfant aurait été reconnu.
- source_word: וְהָיָה אִם־בָּא
  choice: chaque fois qu’il s’unissait
  rationale: La construction décrit une conduite habituelle ou répétée; « chaque fois » rend cette valeur itérative.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: il s’unissait à la femme de son frère
  rationale: Formulation française naturelle et digne qui exprime clairement l’euphémisme sexuel hébreu sans crudité.
- source_word: וְשִׁחֵת אַרְצָה
  choice: il répandait sa semence à terre
  rationale: Le verbe שחת signifie littéralement « détruire, gâcher ». Dans ce contexte, la formulation explicite naturellement l’objet sous-entendu et l’acte destiné à empêcher la conception, tout en restant sobre.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: afin de ne pas donner de descendance à son frère
  rationale: Rend clairement la proposition de but et reprend le sens familial de זרע dans ce contexte.
theological_decisions:
- issue: Rapport entre l’acte physique d’Onan et la descendance due à son frère
  choice: Distinguer dans la traduction la « descendance » attendue et la « semence » répandue à terre.
  alternative: Employer « semence » dans toutes les occurrences et formulations afin de reproduire plus formellement le même champ lexical.
  rationale: Le verset articule l’enjeu familial — donner une descendance au frère — et l’acte physique par lequel Onan empêche la conception. La traduction rend ces deux plans intelligibles sans tirer de conclusion doctrinale ou morale allant au-delà du texte.
translation_notes:
  register: Français international actuel, sobre et digne. « S’unissait à » conserve le caractère euphémique du récit tout en étant immédiatement compréhensible. Les deux notes signalent les formulations plus littérales et les éléments implicites de l’hébreu.
