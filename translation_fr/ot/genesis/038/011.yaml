base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: fr
  text: 'Alors Juda dit à Tamar, sa belle-fille : « Reste veuve dans la maison de ton père jusqu’à ce que mon fils Shéla grandisse. » Car il se disait[a] : « Il ne faudrait pas que lui aussi meure comme ses frères. » Tamar alla habiter dans la maison de son père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il dit » ; en hébreu, cette expression peut introduire une réflexion intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: Reste veuve
  rationale: L’impératif de ישׁב accompagné de אַלְמָנָה ordonne à Tamar de demeurer dans son état de veuve. « Reste veuve » est naturel, précis et conserve la portée sociale de l’injonction.
- source_word: בֵית אָבִיךְ
  choice: dans la maison de ton père
  rationale: Cette expression désigne le lieu de résidence au sein du foyer paternel; la formulation française reste proche de l’hébreu et se comprend naturellement.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: jusqu’à ce que mon fils Shéla ait grandi
  rationale: גדל indique ici le fait de grandir et d’atteindre la maturité. Le passé du subjonctif présente cette croissance comme accomplie au terme de l’attente, sans expliciter davantage l’âge matrimonial.
- source_word: כִּי אָמַר
  choice: Car il se disait
  rationale: Le verbe « dire » peut introduire en hébreu une réflexion intérieure. Le pronom réfléchi rend ce sens clairement en français, tout en signalant en note la formulation plus littérale.
- source_word: פֶּן יָמוּת גַּם הוּא
  choice: Il ne faudrait pas que lui aussi meure
  rationale: פֶּן exprime l’appréhension d’une éventualité redoutée. Cette tournure française actuelle restitue la crainte de Juda sans présenter la mort comme certaine.
- source_word: כְּאֶחָיו
  choice: comme ses frères
  rationale: La comparaison renvoie directement au sort des frères de Shéla, Er et Onan, sans ajouter d’explication au texte.
- source_word: וַתֵּלֶךְ ... וַתֵּשֶׁב
  choice: partit donc vivre
  rationale: La formulation rend la succession narrative « elle alla et habita » dans un français fluide et indique une résidence durable.
- source_word: כַּלָּתוֹ
  choice: sa belle-fille
  rationale: C’est le terme français courant correspondant au lien familial indiqué.
- source_word: בֵּית אָבִיהָ
  choice: dans la maison de son père
  rationale: La reprise de la même formulation que dans l’ordre de Juda maintient la cohésion lexicale et montre son exécution.
theological_decisions:
- issue: Nature de la parole introduite par כִּי אָמַר
  choice: 'Discours intérieur : « il se disait »'
  alternative: 'Discours formulé sans précision : « il dit »'
  rationale: Le contexte présente la crainte de Juda comme le motif caché de son ordre à Tamar. La traduction française explicite le caractère intérieur probable sans modifier le contenu de sa pensée; la note préserve l’alternative formelle.
translation_notes:
  register: Français international moderne, narratif et digne. « Reste veuve » conserve la force directe de l’ordre; « Il ne faudrait pas que » rend naturellement l’appréhension exprimée par פֶּן. Le nom שֵׁלָה est transcrit « Shéla » selon une forme française lisible.
