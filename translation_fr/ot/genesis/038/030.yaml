  text: וְ/אַחַר֙ יָצָ֣א אָחִ֔י/ו אֲשֶׁ֥ר עַל יָד֖/וֹ הַ/שָּׁנִ֑י וַ/יִּקְרָ֥א שְׁמ֖/וֹ זָֽרַח־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: fr
  text: Ensuite, son frère sortit, avec le fil écarlate à la main[a], et on l’appela Zérah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’écarlate » à sa main; le mot « fil » est repris du contexte immédiat au verset 28.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « il appela son nom Zérah »; le sujet masculin singulier n’est pas précisé.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאַחַר
  choice: Ensuite
  rationale: Marque la succession des événements après la naissance du premier jumeau; « Ensuite » est naturel et précis en français moderne.
- source_word: יָצָא
  choice: sortit
  rationale: Dans le contexte d’un accouchement, « sortir » rend simplement le verbe courant יָצָא.
- source_word: אָחִיו
  choice: son frère
  rationale: Rend directement le terme de parenté accompagné du suffixe masculin singulier.
- source_word: אֲשֶׁר עַל־יָדוֹ הַשָּׁנִי
  choice: avec le fil écarlate à la main
  rationale: La proposition relative identifie le second enfant par le signe placé sur sa main au verset 28. « Fil » est repris du contexte immédiat, car le texte hébreu emploie ici « l’écarlate » de façon elliptique.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: et on l’appela
  rationale: Cette formulation française naturelle rend l’acte de nommer sans attribuer arbitrairement l’action au frère qui vient d’être mentionné. L’hébreu emploie littéralement « il appela son nom », avec un sujet masculin singulier non exprimé.
- source_word: זָרַח
  choice: Zérah
  rationale: Translittération française usuelle du nom hébreu, avec accent pour guider la prononciation.
theological_decisions:
- issue: Identité du sujet de וַיִּקְרָא
  choice: Sujet laissé indéterminé par « on l’appela »
  alternative: « il l’appela » ou « son nom fut appelé »
  rationale: Le verbe hébreu est au masculin singulier, mais le sujet n’est pas nommé. En français, « il » risquerait de renvoyer grammaticalement au frère nouveau-né; « on » préserve l’indétermination contextuelle sans imposer une identité.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant l’ordre des événements et l’indétermination du sujet qui donne le nom.
