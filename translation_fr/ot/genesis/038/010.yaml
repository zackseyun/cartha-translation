id: GEN.38.10
reference: Genesis 38:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: fr
  text: Ce qu’il avait fait était mal aux yeux de Yahweh, et Yahweh le fit mourir lui aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: était mal
  rationale: Le verbe רעע exprime ici une évaluation morale négative. « Était mal » reste direct et naturel, sans l’atténuation de « déplut ».
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette formulation conserve l’image de l’expression hébraïque courante désignant l’évaluation divine, tout en étant idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: אֲשֶׁר עָשָׂה
  choice: Ce qu’il avait fait
  rationale: Le plus-que-parfait relie clairement l’évaluation à l’acte d’Onan raconté juste auparavant, sans ajouter de précision absente de l’hébreu.
- source_word: וַיָּמֶת
  choice: le fit mourir
  rationale: La forme causative de מות attribue directement la mort d’Onan à Yahweh. « Le fit mourir » en conserve la force causative et le registre solennel.
- source_word: גַּם אֹתוֹ
  choice: lui aussi
  rationale: L’expression rattache le sort d’Onan à celui d’Er au verset 7; « lui aussi » rend nettement cette correspondance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Agent du jugement dans וַיָּמֶת
  choice: qui le fit mourir lui aussi
  alternative: et lui aussi mourut
  rationale: La forme causative hébraïque présente Yahweh comme l’agent de la mort. La traduction ne transforme donc pas ce jugement en simple constat passif.
- issue: Lien syntaxique entre l’évaluation et la mort
  choice: Yahweh, qui le fit mourir
  alternative: alors Yahweh le fit mourir
  rationale: Le pronom relatif français évite l’ambiguïté momentanée de « il » tout en conservant le lien direct entre l’évaluation divine et le jugement, sans expliciter davantage la causalité que ne le fait le waw narratif.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe est fluide tout en conservant l’image hébraïque « aux yeux de », le nom divin et la causalité explicite du jugement.
