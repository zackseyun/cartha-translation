    rationale: יָד signifie « main » ici. Le fil est attaché « sur/à sa main » ; le texte ne dit pas « poignet ».
  - severity: low
    issue: « passa une main » est une formulation française maladroite.
    rationale: Elle ne correspond pas à un usage narratif courant. « Tendit la main » communique naturellement le geste décrit par l’idiome hébreu « donna une main ».
