  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: fr
  text: 'Pendant qu’elle accouchait, l’un des enfants tendit la main. La sage-femme la prit et attacha un fil écarlate à sa main, en disant : « C’est lui qui est sorti le premier. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: Pendant qu’elle accouchait
  rationale: La préposition ב suivie de l’infinitif construit et du suffixe féminin exprime ici une circonstance temporelle concomitante. Cette formulation est naturelle en français et conserve l’idée d’un accouchement en cours.
- source_word: וַיִּתֶּן יָד
  choice: l’un des enfants passa une main
  rationale: Littéralement « il donna une main », tournure qui décrit l’apparition de la main durant l’accouchement. « L’un des enfants » explicite sobrement le sujet masculin singulier sans décider lequel des jumeaux il était.
- source_word: הַמְיַלֶּדֶת
  choice: la sage-femme
  rationale: Le participe substantivé de ילד désigne la femme qui assiste l’accouchement ; « sage-femme » est l’équivalent français courant et précis.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: attacha un fil écarlate à son poignet
  rationale: שָׁנִי désigne une matière ou un fil teint en écarlate. Le poignet est l’endroit naturel où un fil servant de marque est attaché, tout en restant rattaché sémantiquement à la « main » de l’hébreu.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: C’est celui-ci qui est sorti le premier
  rationale: Le démonstratif identifie l’enfant marqué et רִאשֹׁנָה fonctionne adverbialement. La traduction n’introduit pas la notion statutaire de « premier-né », absente de la formulation.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite le littéralisme obscur « donna une main », tout en préservant le fait que seule la main apparaît d’abord et que l’identification du premier enfant repose sur le signe posé par la sage-femme.
