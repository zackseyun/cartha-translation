  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: fr
  text: Alors elle se leva et partit. Elle ôta son voile et revêtit ses vêtements de veuve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: elle se leva
  rationale: Le qal wayyiqtol de קום fait progresser le récit et se rend naturellement par « se leva ».
- source_word: וַתֵּלֶךְ
  choice: partit
  rationale: Après « se leva », הלך exprime ici le départ; « partit » est concis et naturel en français.
- source_word: וַתָּסַר צְעִיפָהּ מֵעָלֶיהָ
  choice: elle ôta son voile
  rationale: « Ôta » rend le hiphil de סור avec le complément צְעִיפָהּ. En français, l’idée de מֵעָלֶיהָ (« de dessus elle ») est déjà clairement contenue dans « ôta son voile ».
- source_word: וַתִּלְבַּשׁ
  choice: remit
  rationale: לבש signifie mettre ou revêtir un vêtement. « Remit » tient compte du contexte immédiat, où Tamar avait auparavant enlevé ses vêtements de veuve, sans modifier l’action décrite.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: ses vêtements de veuve
  rationale: Cette formulation française naturelle exprime les vêtements liés à son statut de veuve tout en restant proche du syntagme construit hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La coordination hébraïque est répartie en deux phrases pour une lecture fluide, sans perte de contenu.
