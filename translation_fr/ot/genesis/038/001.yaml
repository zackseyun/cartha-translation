base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: fr
  text: À cette époque[a], Juda descendit d’auprès de ses frères et se détourna vers un homme d’Adoullam[b], nommé Hira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Et il arriva, à cette époque-là. »'
    reason: lexical_alternative
  - marker: b
    text: Ou « un certain Adoullamite »; l’hébreu l’identifie comme un homme originaire d’Adoullam et peut aussi l’introduire comme un individu particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: À cette époque
  rationale: Cette formulation naturelle en français situe le nouvel épisode dans le temps sans traduire lourdement la formule narrative וַיְהִי; la variante plus formelle est signalée en note.
- source_word: וַיֵּרֶד
  choice: descendit
  rationale: Le verbe conserve le mouvement descendant exprimé par ירד, sans préciser une destination que le texte hébreu ne donne pas.
- source_word: מֵאֵת אֶחָיו
  choice: en s’éloignant de ses frères
  rationale: Cette tournure exprime clairement la séparation d’avec ses frères tout en s’intégrant naturellement au verbe de mouvement précédent.
- source_word: וַיֵּט עַד
  choice: se rendit chez
  rationale: Dans ce contexte, נטה avec עַד décrit le fait de se diriger à l’écart vers une personne. « Se rendit chez » est naturel en français et convient à la suite du récit, sans retenir le sens littéral inadapté d’« étendre ».
- source_word: אִישׁ עֲדֻלָּמִי
  choice: un certain Adoullamite
  rationale: אִישׁ suivi d’un gentilé peut introduire un individu précis. « Un certain Adoullamite » rend cette fonction narrative sans l’expression redondante « un homme adoullamite »; l’autre analyse possible est conservée en note.
- source_word: וּשְׁמוֹ חִירָה
  choice: nommé Hira
  rationale: Cette formulation française concise et naturelle transmet pleinement l’identification littérale « et son nom était Hira ».
- source_word: חִירָה
  choice: Hira
  rationale: Transcription française usuelle du nom personnel hébreu.
