base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: fr
  text: 'Il revint auprès de Juda et dit : « Je ne l’ai pas trouvée. De plus, les hommes du lieu ont dit : “Il n’y avait pas de femme consacrée[a] ici.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu qedecha, terme apparenté à « consacré ». Il peut désigner une femme liée à un culte; dans ce contexte, certains le comprennent comme « prostituée sacrée » ou « prostituée cultuelle », mais son sens précis est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Il revint
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif français et exprime clairement le retour du messager.
- source_word: אֶל־יְהוּדָה
  choice: auprès de Juda
  rationale: Dans ce contexte, אֶל indique que le messager revient vers Juda; « auprès de » est naturel pour le retour auprès d’une personne.
- source_word: לֹא מְצָאתִיהָ
  choice: Je ne l’ai pas trouvée
  rationale: Le parfait négatif rapporte une recherche achevée sans résultat. Le passé composé est naturel dans le discours direct.
- source_word: וְגַם
  choice: De plus
  rationale: Cette expression introduit un second élément du compte rendu. « De plus » restitue sa valeur additive sans lourdeur.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: les hommes de l’endroit
  rationale: La traduction conserve le masculin pluriel de l’hébreu et désigne les habitants masculins interrogés sur place.
- source_word: לֹא הָיְתָה בָזֶה
  choice: Il n’y a pas eu … ici
  rationale: La tournure existentielle rend naturellement la négation de la présence d’une telle femme en ce lieu, tandis que « ici » traduit idiomatiquement בָזֶה.
- source_word: קְדֵשָׁה
  choice: prostituée sacrée
  rationale: Le terme désigne une femme liée à un cadre cultuel et la distingue de זֹנָה dans le récit voisin. « Sacrée » conserve cette association sans supposer nécessairement un temple institutionnel précis; une note signale l’incertitude sur son rôle exact.
theological_decisions:
- issue: Nature exacte de la קְדֵשָׁה
  choice: prostituée sacrée, avec une note explicative
  alternative: femme consacrée; prostituée de temple
  rationale: Le contexte associe la femme recherchée à une relation sexuelle rémunérée, mais le terme hébreu souligne surtout un statut ou un lien cultuel. La formulation retenue rend les deux aspects sans présenter comme certaine une institution particulière de prostitution dans un temple.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple porte la narration, tandis que le passé composé reste naturel dans les paroles rapportées. La citation intérieure est conservée pour distinguer les propos des hommes de l’endroit du compte rendu du messager.
