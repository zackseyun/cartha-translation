base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: fr
  text: 'Il demanda : « Quel gage te donnerai-je ? » Elle répondit : « Ton sceau[a], ton cordon et le bâton que tu tiens à la main. » Il les lui donna, s’unit à elle[b], et elle devint enceinte de lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton cachet ». L’hébreu ne précise pas la forme exacte de l’objet servant à sceller.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « vint vers elle ». Cette expression hébraïque est employée ici comme euphémisme pour désigner des relations sexuelles.
    reason: source_idiom
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: gage
  rationale: Le terme désigne un objet remis comme garantie en attendant le paiement promis. « Gage » est précis, naturel dans ce contexte et conserve le caractère concret de l’objet.
- source_word: חֹתָמְךָ
  choice: ton sceau
  rationale: Le nom désigne un dispositif servant à apposer une marque d’identification. « Sceau » reste assez général pour ne pas préciser sans fondement qu’il s’agissait d’une bague.
- source_word: וּפְתִילֶךָ
  choice: ton cordon
  rationale: Le mot désigne un fil ou cordon, probablement associé au sceau. « Cordon » rend le sens simplement sans ajouter cette association probable au texte.
- source_word: וּמַטְּךָ אֲשֶׁר בְּיָדֶךָ
  choice: le bâton que tu tiens à la main
  rationale: « Bâton » convient à cet objet personnel porté à la main. La formulation française naturelle conserve l’image concrète de l’hébreu.
- source_word: וַיִּתֶּן לָּהּ
  choice: Il les lui donna
  rationale: Bien que l’hébreu n’exprime pas de pronom objet explicite, le français reprend naturellement par « les » les trois objets demandés.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: s’unit à elle
  rationale: L’expression hébraïque est un euphémisme désignant un rapport sexuel. « S’unit à elle » en transmet le sens dans un registre digne sans adopter une tournure française artificielle.
- source_word: וַתַּהַר לוֹ
  choice: elle devint enceinte de lui
  rationale: Cette formulation actuelle exprime clairement la conception et rend la relation indiquée par לוֹ sans employer le tour plus soutenu et moins courant « elle conçut de lui ».
