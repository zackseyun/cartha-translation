  yaml_path: translation/ot/genesis/038/004.yaml
  text: She conceived again and bore a son, and she named him Onan.
translation:
  language: fr
  text: Elle devint de nouveau enceinte et mit au monde un fils, qu’elle appela Onân.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: Elle devint enceinte
  rationale: Le verbe הרה exprime ici le fait de devenir enceinte. Cette formulation est naturelle en français moderne et convient au récit.
- source_word: עוֹד
  choice: de nouveau
  rationale: Dans cette succession de naissances, עוֹד marque la répétition.
- source_word: וַתֵּלֶד בֵּן
  choice: et mit au monde un fils
  rationale: Cette tournure française courante rend clairement et dignement l’expression hébraïque de l’accouchement.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: qu’elle appela
  rationale: L’expression hébraïque signifie littéralement « elle appela son nom » ; le français idiomatique emploie simplement « elle l’appela », ici sous la forme relative pour éviter une coordination lourde.
- source_word: אוֹנָן
  choice: Onân
  rationale: Le nom propre est translittéré selon l’usage biblique français, avec un accent circonflexe indiquant la voyelle longue de la forme hébraïque.
