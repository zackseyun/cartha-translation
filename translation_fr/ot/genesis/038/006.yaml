  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: fr
  text: Juda prit une épouse pour Er, son premier-né, et elle s’appelait Tamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: prit pour
  rationale: Le verbe לָקַח signifie couramment « prendre ». Avec le complément introduit par לְ dans ce contexte matrimonial, « prit pour Er » exprime naturellement en français le fait que Juda lui procura une épouse, sans expliciter davantage que l’hébreu l’idée d’un mariage arrangé.
- source_word: אִשָּׁה
  choice: une femme
  rationale: Dans ce contexte matrimonial, אִשָּׁה désigne une épouse. La tournure française « prendre une femme pour quelqu’un » rend clairement ce sens sans lourdeur.
- source_word: לְעֵר
  choice: pour Er
  rationale: La préposition לְ présente Er comme le bénéficiaire de l’action de Juda ; « pour Er » reproduit naturellement cette relation.
- source_word: בְּכוֹרוֹ
  choice: son fils aîné
  rationale: בְּכוֹר désigne ici le fils premier-né de Juda. « Son fils aîné » est clair et idiomatique en français moderne tout en conservant le lien familial explicite.
- source_word: וּשְׁמָהּ
  choice: nommée
  rationale: Le condensé « une femme nommée Tamar » rend en français naturel la formule hébraïque littérale « et son nom [était] Tamar », sans perte d’information.
- source_word: תָּמָר
  choice: Tamar
  rationale: Le nom propre est conservé sous sa forme française biblique usuelle.
