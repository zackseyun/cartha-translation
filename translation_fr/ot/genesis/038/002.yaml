  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: fr
  text: Là, Juda vit la fille d’un Cananéen nommé Shoua[a]. Il la prit et s’unit à elle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et son nom était Shoua ». Le pronom masculin désigne le père cananéen, non sa fille.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il vint vers elle » ; expression hébraïque désignant des relations sexuelles.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: Le verbe ראה, dans la suite narrative, signifie directement « voir » ; « rencontra » ajouterait une nuance absente du texte.
- source_word: שָׁם
  choice: Là
  rationale: Équivalent français naturel et concis de l’adverbe de lieu.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: la fille d’un Cananéen
  rationale: Cette formulation restitue naturellement la relation exprimée par la chaîne construite, sans alourdir le français par « d’un homme cananéen ».
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: nommé Shoua
  rationale: Le suffixe masculin de שְׁמוֹ renvoie au père cananéen, et non à sa fille. « Nommé Shoua » garde ce référent clair en français.
- source_word: וַיִּקָּחֶהָ
  choice: Il la prit
  rationale: La traduction conserve le sens formel de לקח. Le contexte peut évoquer une prise pour épouse, mais le verset n’emploie pas ici un terme explicite signifiant « épouser ».
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: s’unit à elle
  rationale: L’expression hébraïque est un idiome désignant des relations sexuelles. « S’unit à elle » en transmet naturellement le sens dans un registre biblique digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide tout en restant proche de l’hébreu. « Shoua » suit une translittération française usuelle ; l’idiome sexuel est rendu par son sens plutôt que calqué de manière peu naturelle.
