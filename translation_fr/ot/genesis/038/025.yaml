base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: fr
  text: 'Au moment où on l’emmenait dehors, elle fit dire à son beau-père : « Je suis enceinte de l’homme à qui appartiennent ces objets. » Puis elle dit : « Je t’en prie, reconnais[a] à qui appartiennent ce sceau, ces cordons et ce bâton. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « identifie ». Le verbe hébreu peut signifier reconnaître ou identifier ; dans ce contexte, il invite Juda à établir à qui appartiennent ces objets.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: on l’emmenait dehors
  rationale: 'Le participe passif exprime une action en cours : Tamar est conduite hors du lieu où elle se trouve, dans le contexte de l’exécution de la sentence.'
- source_word: שָׁלְחָה אֶל חָמִיהָ
  choice: elle fit dire à son beau-père
  rationale: Cette tournure française rend naturellement l’envoi d’un message au beau-père, sans supposer que le verbe désigne seulement l’envoi matériel des objets.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: Je suis enceinte de l’homme à qui appartiennent ces objets
  rationale: La formulation explicite naturellement le lien de paternité impliqué par l’hébreu tout en conservant la proposition possessive.
- source_word: הַכֶּר נָא
  choice: Examine, je te prie
  rationale: L’impératif de נכר invite Juda à reconnaître ou identifier les objets. « Examine » convient à la présentation de pièces permettant cette reconnaissance, tandis que « je te prie » rend נָא.
- source_word: הַחֹתֶמֶת
  choice: ce sceau
  rationale: חֹתֶמֶת désigne l’objet personnel servant à sceller et à identifier son propriétaire. « Sceau » est précis sans imposer la forme d’une bague, que l’hébreu ne spécifie pas.
- source_word: הַפְּתִילִים
  choice: ces cordons
  rationale: Le pluriel hébreu est conservé; il s’agit vraisemblablement des cordons associés au sceau.
- source_word: הַמַּטֶּה
  choice: ce bâton
  rationale: « Bâton » est le terme français courant et digne pour מַטֶּה dans ce contexte personnel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition « elle dit » est maintenue par « Puis elle dit » pour respecter la structure hébraïque. Le choix de « sceau » évite de préciser sans preuve qu’il s’agissait d’une bague.
