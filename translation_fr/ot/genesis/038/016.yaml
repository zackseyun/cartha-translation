base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: fr
  text: 'Il se détourna vers elle, au bord du chemin, et dit : « S’il te plaît, laisse-moi venir à toi[a]. » Car il ne savait pas qu’elle était sa belle-fille. Elle lui demanda : « Que me donneras-tu[b] pour que tu viennes à moi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « venir à toi / à moi » est ici un euphémisme désignant des relations sexuelles.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Que me paieras-tu pour que tu viennes à moi ? » L’hébreu dit plus littéralement : « Que me donneras-tu… ? »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט
  choice: Il se détourna
  rationale: Le verbe נטה indique ici que Juda quitte sa trajectoire pour aller vers la femme; « se détourna » conserve ce mouvement sans l’aplatir en un simple « se tourna ».
- source_word: אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: vers elle, au bord du chemin
  rationale: « Vers elle » exprime le mouvement en direction de Tamar, tandis que « au bord du chemin » situe naturellement l’endroit où elle se trouve dans le récit.
- source_word: הָבָה נָּא
  choice: Laisse-moi, je te prie
  rationale: Cette formulation rend l’exhortation accompagnée de la particule de politesse נָא dans un français actuel et digne.
- source_word: אָבוֹא אֵלַיִךְ
  choice: venir à toi
  rationale: L’expression בוא אל est ici un euphémisme sexuel. « Venir à toi » en préserve la retenue et la formulation relationnelle, avec une note qui en précise le sens contextuel.
- source_word: כִּי לֹא יָדַע
  choice: En effet, il ne savait pas
  rationale: כִּי introduit l’explication du comportement de Juda; « En effet » relie clairement et naturellement cette précision au récit.
- source_word: כִּי כַלָּתוֹ הִוא
  choice: qu’elle était sa belle-fille
  rationale: « Belle-fille » est le terme français exact pour כַלָּה dans ce contexte familial.
- source_word: מַה תִּתֶּן לִּי
  choice: Que me donneras-tu
  rationale: Le texte dit littéralement « donner », même si le contexte implique une rémunération. Le choix conserve cette formulation plus large.
- source_word: כִּי תָבוֹא אֵלָי
  choice: pour que tu viennes à moi
  rationale: Cette traduction garde la structure finale de la proposition ainsi que le même euphémisme sexuel que dans la demande de Juda.
