  text: וַ/יִּשְׁלַ֨ח יְהוּדָ֜ה אֶת גְּדִ֣י הָֽ/עִזִּ֗ים בְּ/יַד֙ רֵעֵ֣/הוּ הָֽ/עֲדֻלָּמִ֔י לָ/קַ֥חַת הָ/עֵרָב֖וֹן מִ/יַּ֣ד הָ/אִשָּׁ֑ה וְ/לֹ֖א מְצָאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: fr
  text: Alors Juda envoya le chevreau par l’intermédiaire de son ami adoullamite[a], afin de reprendre le gage de la main de la femme[b]. Mais son ami ne la trouva pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de son ami adoullamite ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin de récupérer la garantie auprès de la femme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Alors … envoya
  rationale: Le wayyiqtol fait progresser le récit; « Alors » exprime naturellement la succession en français.
- source_word: גְּדִי הָעִזִּים
  choice: le chevreau
  rationale: L’expression désigne un jeune bouc; « chevreau » est précis, courant et renvoie à l’animal promis auparavant.
- source_word: בְּיַד רֵעֵהוּ
  choice: par l’intermédiaire de son ami
  rationale: Littéralement « par la main de son ami »; l’expression hébraïque marque ici l’intermédiaire chargé de la mission.
- source_word: הָעֲדֻלָּמִי
  choice: adoullamite
  rationale: Gentilé indiquant que l’ami était originaire d’Adoullam; la forme française usuelle est retenue.
- source_word: לָקַחַת הָעֵרָבוֹן
  choice: afin de reprendre le gage
  rationale: L’infinitif indique le but. « Reprendre » rend la récupération de l’objet remis, et « gage » désigne naturellement une garantie matérielle.
- source_word: מִיַּד הָאִשָּׁה
  choice: des mains de la femme
  rationale: Cette formulation conserve l’image concrète de l’hébreu tout en restant idiomatique en français.
- source_word: וְלֹא מְצָאָהּ
  choice: Mais son ami ne la trouva pas
  rationale: Le sujet grammatical implicite pourrait formellement renvoyer à Juda, mais le contexte immédiat montre que l’ami envoyé mène la recherche; le nom est répété en français pour éviter une ambiguïté référentielle artificielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme excessif. L’image des « mains » est conservée pour refléter la formulation hébraïque, tandis que la première occurrence de בְּיַד est rendue selon son sens idiomatique d’intermédiaire.
