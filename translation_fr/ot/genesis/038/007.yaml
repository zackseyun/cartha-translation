source:
  edition: WLC
  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: fr
  text: Er, le premier-né de Juda, était méchant aux yeux de Yahweh, et Yahweh le mit à mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus formelle : « Yahweh le fit mourir. »'
    reason: Alternative lexicale reflétant plus directement la forme causative du verbe hébreu.
lexical_decisions:
- source_word: וַיְהִי
  choice: était
  rationale: Le verbe היה sert ici de copule dans la progression du récit. Le français n’a pas besoin d’ajouter un marqueur comme « alors » ou « or », absent comme terme temporel explicite dans l’hébreu.
- source_word: עֵר
  choice: Er
  rationale: Le nom propre est translittéré selon sa forme française courante.
- source_word: בְּכוֹר יְהוּדָה
  choice: le premier-né de Juda
  rationale: La chaîne construite exprime à la fois la filiation et le rang de naissance. Cette formulation est naturelle et précise en français.
- source_word: רַע
  choice: mauvais
  rationale: Dans ce contexte d’évaluation morale par Yahweh, l’adjectif qualifie la conduite ou le caractère d’Er comme moralement mauvais, et non comme simplement malheureux ou défectueux.
- source_word: בְּעֵינֵי יְהוָה
  choice: aux yeux de Yahweh
  rationale: Cette expression française conserve l’image hébraïque tout en exprimant clairement l’évaluation portée par Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que remplacé par un titre.
- source_word: וַיְמִתֵהוּ
  choice: le mit à mort
  rationale: 'Le hiphil de מות exprime une causalité directe : Yahweh causa sa mort. « Le mit à mort » est idiomatique, solennel et préserve cette agentivité.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même. Le translittérer préserve sa fonction de nom personnel sans lui substituer un titre.
- issue: Agentivité divine dans la mort d’Er
  choice: Yahweh le mit à mort
  alternative: Yahweh le fit mourir
  rationale: La forme causative hébraïque attribue explicitement la mort d’Er à l’action de Yahweh. Le rendu ne l’atténue pas et n’ajoute aucune explication sur le moyen employé.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu sans reproduire mécaniquement son connecteur narratif initial. L’expression « aux yeux de » conserve l’image source et demeure parfaitement naturelle.
