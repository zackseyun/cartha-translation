  to: 'Comme il retirait sa main, voici que son frère sortit. Elle dit alors : « Quelle brèche tu t’es ouverte ! »[a] On l’appela donc Pérets.'
  rationale: La révision améliore l’idiomaticité de l’exclamation tout en préservant son caractère inhabituel, l’image de la brèche et le jeu de mots qui motive le nom Pérets. La note est reformulée pour décrire fidèlement le procédé hébreu sans prétendre fournir une traduction littérale artificielle.
