  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: fr
  text: 'Comme il retirait sa main, voici que son frère sortit. Elle dit alors : « Quelle brèche tu t’es ouverte ! »[a] On l’appela donc Pérets.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu joue sur la répétition de la racine liée à « brèche » ou « percée » ; le nom Pérets est formé sur cette même racine.
    reason: lexical_wordplay
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: Comme il retirait sa main
  rationale: Le participe hiphil de שוב avec « main » décrit ici le geste de ramener ou retirer la main. « Retirait » est naturel en français et conserve l’action concrète.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: הִנֵּה introduit avec vivacité un événement inattendu. « Voici que » garde cet effet narratif sans recourir à une tournure archaïque.
- source_word: יָצָא אָחִיו
  choice: son frère sortit
  rationale: Dans le contexte de l’accouchement, « sortit » rend directement יָצָא et reste idiomatique.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: Quelle brèche tu as ouverte pour toi !
  rationale: La formulation conserve l’exclamation ainsi que l’image de la brèche, essentielle au jeu de mots avec le nom Pérets. « Pour toi » représente prudemment le difficile עָלֶיךָ sans en fermer le sens.
- source_word: פָּרֶץ
  choice: Pérets
  rationale: Cette translittération française usuelle rend le nom propre tout en permettant à la note d’en signaler le lien avec la racine hébraïque פרץ, « faire une brèche, se frayer un passage ».
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: On l’appela donc Pérets
  rationale: Le pronom indéfini « on » rend naturellement en français la formule de nomination dont le sujet n’est pas explicitement identifié, sans imposer qui donna le nom.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » maintient la vivacité du récit; l’exclamation, volontairement inhabituelle, préserve le jeu de mots hébreu plutôt que de le remplacer par une paraphrase.
