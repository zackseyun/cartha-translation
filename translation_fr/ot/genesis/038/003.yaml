  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ עֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: fr
  text: Elle conçut et mit au monde un fils, et il[a] lui donna le nom d’Er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est au masculin singulier ; le sujet le plus naturel est Juda.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: Elle conçut
  rationale: Le verbe הרה exprime le fait de concevoir ou de devenir enceinte. « Elle conçut » est concis, digne et conserve la progression narrative de l’hébreu.
- source_word: וַתֵּלֶד
  choice: et mit au monde
  rationale: Le verbe ילד au qal signifie ici enfanter. « Mit au monde » est naturel en français moderne et s’emploie aisément avec « un fils ».
- source_word: בֵּן
  choice: un fils
  rationale: בן désigne ici l’enfant mâle dans sa relation familiale ; « un fils » est la formulation narrative normale.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: et il lui donna le nom de
  rationale: La tournure rend naturellement en français l’expression hébraïque « il appela son nom », tout en conservant explicitement le sujet masculin singulier « il ».
- source_word: עֵר
  choice: Er
  rationale: Le nom propre est translittéré selon sa forme française conventionnelle.
theological_decisions:
- issue: Sujet de וַיִּקְרָא (« il donna le nom »)
  choice: 'Le sujet masculin est conservé explicitement : « il lui donna le nom d’Er » ; il renvoie le plus naturellement à Juda.'
  alternative: Certaines traductions mettent la femme comme sujet ou emploient une formulation passive qui ne précise pas qui donne le nom.
  rationale: Le verbe hébreu est au masculin singulier, contrairement aux deux verbes féminins précédents. La traduction préserve ce changement grammatical sans l’harmoniser ; il s’agit d’une décision textuelle, non doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « Mit au monde » évite le tour plus littéraire « enfanta », tandis que « lui donna le nom de » restitue idiomatiquement la construction hébraïque sans effacer le changement de sujet.
