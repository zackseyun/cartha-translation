  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: fr
  text: Bien des jours plus tard[a], la fille de Shoua[b], femme de Juda, mourut. Une fois consolé[c], Juda monta à Timna, auprès de ceux qui tondaient son troupeau, avec son ami Hira, l’Adoullamite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Longtemps après. » Littéralement : « les jours devinrent nombreux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « la fille de Shoua » ; certains comprennent cette expression comme le nom propre « Bath-Shoua ».'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « Juda fut consolé » ; le verbe hébreu évoque ici la consolation qui suit le deuil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: Bien des jours plus tard
  rationale: L’expression hébraïque signifie littéralement que « les jours devinrent nombreux ». Cette formulation française naturelle conserve à la fois l’idée du temps écoulé et la nuance d’une période assez longue.
- source_word: וַתָּמָת
  choice: mourut
  rationale: Rendu narratif standard du verbe מות, au passé simple conformément au registre du récit.
- source_word: בַּת שׁוּעַ
  choice: la fille de Shoua
  rationale: L’hébreu présente explicitement une relation de parenté. Le traduire ainsi est plus transparent que d’y voir nécessairement le nom propre composé « Bath-Shoua ».
- source_word: אֵשֶׁת יְהוּדָה
  choice: femme de Juda
  rationale: Rendu direct et idiomatique de la construction possessive hébraïque.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: Une fois consolé
  rationale: Le niphal de נחם désigne ici la consolation qui suit le deuil. La tournure marque naturellement que l’action suivante intervient après cette période, sans transformer le verbe en idée de repentance.
- source_word: וַיַּעַל
  choice: monta
  rationale: Conserve la valeur directionnelle habituelle de עלה, plutôt que de la réduire au simple fait d’aller.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: auprès de ceux qui tondaient son troupeau
  rationale: Le texte désigne les personnes occupées à tondre le troupeau de Juda. Cette formulation évite de laisser entendre que Juda allait lui-même effectuer la tonte.
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: avec son ami Hira
  rationale: Expression française naturelle de l’accompagnement indiqué par « lui et Hira, son ami ».
- source_word: הָעֲדֻלָּמִי
  choice: l’Adoullamite
  rationale: Gentilé indiquant que Hira est originaire d’Adoullam.
- source_word: תִּמְנָתָה
  choice: à Timna
  rationale: Le suffixe directionnel hébreu indique un mouvement vers Timna, exprimé naturellement en français par « à » après « monter ».
theological_decisions:
- issue: Sens de נחם après la mort de la femme de Juda
  choice: être consolé après le deuil
  alternative: se repentir ou changer d’avis
  rationale: Dans ce contexte de décès, la forme verbale décrit la consolation reçue après le deuil. Le sens de repentance, possible dans d’autres contextes et formes du même radical, ne convient pas ici.
translation_notes:
  register: 'Français international moderne, narratif et digne. Le passé simple maintient la tenue littéraire du récit sans archaïsme marqué. Les noms propres suivent des formes françaises transparentes : Juda, Shoua, Hira, Adoullamite et Timna.'
