source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/אִ֔ישׁ כַּֽ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֥יתָ/ה יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/017.yaml
  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: fr
  text: L’homme fit ce que Joseph avait dit, puis il conduisit les hommes dans la maison de Joseph.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe עשה exprime ici l’exécution d’une instruction. La tournure « fit ce que… avait dit » est naturelle en français et rend clairement l’idée d’obéissance.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: L’hébreu dit simplement « l’homme ». Même si le contexte permet de comprendre qu’il s’agit de l’intendant de Joseph, préciser sa fonction ici importerait une information absente du verset.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: ce que Joseph avait dit
  rationale: Cette formulation exprime la conformité aux paroles, en contexte aux instructions, de Joseph. Le plus-que-parfait situe naturellement ces paroles avant leur exécution dans le récit français.
- source_word: וַיָּבֵא
  choice: conduisit
  rationale: Le hiphil de בוא signifie faire venir ou amener. Avec des personnes et l’entrée dans une maison, « conduisit » est idiomatique et conserve l’idée que l’homme les fait entrer.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le texte les désigne génériquement comme « les hommes », sans les appeler explicitement les frères dans ce verset.
- source_word: בֵּיתָה יוֹסֵף
  choice: dans la maison de Joseph
  rationale: Le ה directionnel de בֵּיתָה marque un mouvement vers la maison; le contexte indique l’entrée, naturellement exprimée en français par « dans » après « conduisit ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La répétition hébraïque de « l’homme » dans la seconde proposition est allégée par le pronom « il », conformément à l’usage naturel du français, sans perte de référent. « Puis » rend la progression narrative des deux wayyiqtol sans surcharger la phrase.
