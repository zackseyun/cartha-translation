  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: fr
  text: 'Ils dirent : « Je vous en prie, mon seigneur[a], nous étions bien descendus une première fois pour acheter de la nourriture[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « mon seigneur » est une formule respectueuse adressée à un supérieur humain, et non un titre divin.
    reason: cultural_note
  - marker: b
    text: L’hébreu renforce l’affirmation « nous étions descendus » en associant un infinitif absolu au verbe conjugué.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils dirent
  rationale: Le waw consécutif poursuit le récit et introduit directement les paroles des frères ; en français narratif, « Ils dirent » est naturel.
- source_word: בִּי
  choice: Pardon
  rationale: L’interjection exprime ici une supplication polie adressée à un supérieur. « Pardon » rend naturellement cette entrée en matière déférente.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Cette formule respectueuse s’adresse à un supérieur humain. « Mon seigneur » conserve le registre social élevé sans en faire un titre divin.
- source_word: יָרֹד יָרַדְנוּ
  choice: nous étions bien descendus
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’affirmation. « bien » restitue sobrement cette insistance, tandis que le plus-que-parfait convient au retour sur leur premier voyage.
- source_word: בַּתְּחִלָּה
  choice: une première fois
  rationale: Dans ce contexte, l’expression renvoie à leur voyage antérieur plutôt qu’à un commencement abstrait.
- source_word: לִשְׁבָּר
  choice: pour acheter
  rationale: Le verbe désigne l’acquisition de vivres, normalement par achat ; cette formulation française est concise et précise.
- source_word: אֹכֶל
  choice: de la nourriture
  rationale: Le nom signifie généralement « nourriture ». Le contexte concerne des céréales, mais le verset emploie ici un terme plus large qu’il convient de préserver.
theological_decisions:
- issue: Portée du titre אֲדֹנִי
  choice: « mon seigneur », compris comme une adresse honorifique humaine
  alternative: « monsieur » ou « mon maître »
  rationale: Le contexte montre que les frères s’adressent à l’intendant. La traduction maintient la déférence sociale sans suggérer une adresse à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. « Pardon, mon seigneur ! » garde la forte déférence de la scène ; « bien » préserve l’emphase hébraïque sans alourdir la phrase.
