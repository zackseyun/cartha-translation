  text: וַֽ/יְהִ֞י כִּי בָ֣אנוּ אֶל הַ/מָּל֗וֹן וַֽ/נִּפְתְּחָ/ה֙ אֶת אַמְתְּחֹתֵ֔י/נוּ וְ/הִנֵּ֤ה כֶֽסֶף אִישׁ֙ בְּ/פִ֣י אַמְתַּחְתּ֔/וֹ כַּסְפֵּ֖/נוּ בְּ/מִשְׁקָל֑/וֹ וַ/נָּ֥שֶׁב אֹת֖/וֹ בְּ/יָדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: fr
  text: 'Quand nous sommes arrivés au lieu d’étape[a] et que nous avons ouvert nos sacs, voici que l’argent de chacun se trouvait à l’ouverture de son sac[b] : notre argent, selon son poids exact. Nous l’avons rapporté avec nous[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire au lieu où nous devions passer la nuit.
    reason: lexical_clarification
  - marker: b
    text: 'Littéralement : « à la bouche de son sac ».'
    reason: source_idiom
  - marker: c
    text: 'Littéralement : « dans notre main ».'
    reason: source_idiom
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: le lieu d’étape
  rationale: Le nom désigne un endroit où des voyageurs passent la nuit, sans impliquer nécessairement une auberge commerciale.
- source_word: וַנִּפְתְּחָה
  choice: nous avons ouvert
  rationale: La forme à la première personne du pluriel exprime ici une action narrative accomplie.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: nos sacs / son sac
  rationale: Le terme désigne des sacs de voyage ou servant au transport du grain; « sacs » convient naturellement au contexte.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure conserve l’effet de découverte soudaine et la vivacité de la particule hébraïque.
- source_word: כֶּסֶף אִישׁ
  choice: l’argent de chacun
  rationale: אִישׁ a ici une valeur distributive. En français, « argent » désigne naturellement le métal précieux utilisé comme moyen de paiement tout en restant proche de כֶּסֶף.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: à l’ouverture de son sac
  rationale: L’hébreu dit littéralement « à la bouche de son sac »; « ouverture » transmet clairement cet idiome en français moderne.
- source_word: בְּמִשְׁקָלוֹ
  choice: selon son poids exact
  rationale: La formule indique que toute la quantité pesée se trouvait là, sans manque.
- source_word: וַנָּשֶׁב אֹתוֹ בְּיָדֵנוּ
  choice: nous l’avons donc rapporté avec nous
  rationale: La traduction exprime l’action accomplie en conséquence de la découverte. « Avec nous » rend naturellement l’idiome hébreu « dans notre main ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Lieu d’étape » évite l’idée trop précise d’une auberge; « voici que » préserve la vivacité du récit. La ponctuation met en relief la constatation concernant la totalité de l’argent.
