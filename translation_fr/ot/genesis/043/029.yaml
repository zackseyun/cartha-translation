base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: fr
  text: 'Il leva les yeux, vit Benjamin, son frère, le fils de sa mère, et dit : « Est-ce là votre plus jeune frère, celui dont vous m’avez parlé ? » Puis il dit : « Que Dieu te fasse grâce, mon fils ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Il leva les yeux
  rationale: Cette formulation conserve l’image vive de l’idiome hébreu tout en restant naturelle dans un récit en français.
- source_word: וַיַּרְא
  choice: et vit
  rationale: Le verbe ראה désigne simplement le fait de voir et s’enchaîne directement avec l’action précédente.
- source_word: אֶת בִּנְיָמִין אָחִיו בֶּן אִמּוֹ
  choice: Benjamin, son frère, le fils de sa mère
  rationale: La construction en apposition est conservée afin de souligner, sans la réduire à une explication, que Benjamin et Joseph ont la même mère.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: votre plus jeune frère
  rationale: Dans le contexte familial, הַקָּטֹן désigne le plus jeune des frères, et non quelqu’un de petite taille.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: celui dont vous m’avez parlé
  rationale: Cette tournure française naturelle rend le sens de l’expression hébraïque sans ajouter de précision.
- source_word: אֱלֹהִים יָחְנְךָ
  choice: Que Dieu te fasse grâce
  rationale: Le subjonctif introduit par « Que » exprime naturellement en français la valeur de souhait ou de bénédiction de la forme hébraïque, tandis que « faire grâce » rend directement חנן.
- source_word: בְּנִי
  choice: mon fils
  rationale: Cette traduction conserve l’adresse masculine singulière et sa tonalité affectueuse.
theological_decisions:
- issue: Valeur de souhait de la bénédiction avec אֱלֹהִים
  choice: Que Dieu te fasse grâce, mon fils !
  alternative: Dieu te fasse grâce, mon fils !
  rationale: L’introduction par « Que » rend clairement la valeur jussive de la bénédiction en français moderne, sans transformer le souhait en affirmation ni ajouter de contenu théologique.
translation_notes:
  register: Français moderne, international et digne. La structure appositionnelle « son frère, le fils de sa mère » est volontairement conservée pour maintenir l’insistance du texte hébreu; le passage du pluriel « votre » au singulier « te » suit exactement les destinataires grammaticaux du discours.
