  text: וַֽ/יִּגְּשׁוּ֙ אֶל הָ/אִ֔ישׁ אֲשֶׁ֖ר עַל בֵּ֣ית יוֹסֵ֑ף וַ/יְדַבְּר֥וּ אֵלָ֖י/ו פֶּ֥תַח הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/019.yaml
  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: fr
  text: Ils s’approchèrent de l’homme qui était responsable de la maison de Joseph et lui parlèrent à l’entrée de la maison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la porte de la maison » ; littéralement : « à l’ouverture de la maison ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: Ils s’approchèrent
  rationale: Le verbe נגשׁ exprime le fait de venir près de quelqu’un. « S’approchèrent » est naturel en français moderne et convient au récit.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: L’hébreu dit simplement « l’homme ». Le contexte permet de comprendre sa fonction, mais le texte n’emploie ici ni « intendant » ni « serviteur ».
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: qui était responsable de la maison de Joseph
  rationale: La construction avec עַל indique l’autorité ou la responsabilité. « Responsable de la maison de Joseph » exprime la gestion de l’ensemble domestique sans réduire le sens au bâtiment.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: et lui parlèrent
  rationale: דבר avec אֶל signifie couramment « parler à ». Cette formulation introduit naturellement les paroles rapportées au verset suivant.
- source_word: פֶּתַח הַבָּיִת
  choice: à l’entrée de la maison
  rationale: פֶּתַח peut désigner l’entrée, l’ouverture ou la porte. « À l’entrée de la maison » est clair et laisse entendre que la conversation a lieu avant qu’ils n’entrent complètement.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve « l’homme » plutôt que de préciser sa fonction par un titre absent de l’hébreu. Le connecteur « donc » rend la progression narrative portée par le wayyiqtol dans ce contexte.
