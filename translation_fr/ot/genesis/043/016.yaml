  text: וַ/יַּ֨רְא יוֹסֵ֣ף אִתָּ/ם֮ אֶת בִּנְיָמִין֒ וַ/יֹּ֨אמֶר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ הָבֵ֥א אֶת הָ/אֲנָשִׁ֖ים הַ/בָּ֑יְתָ/ה וּ/טְבֹ֤חַ טֶ֨בַח֙ וְ/הָכֵ֔ן כִּ֥י אִתִּ֛/י יֹאכְל֥וּ הָ/אֲנָשִׁ֖ים בַּֽ/צָּהֳרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: fr
  text: 'Lorsque Joseph vit Benjamin avec eux, il dit à celui qui avait la charge de sa maison : « Fais entrer ces hommes dans la maison, abats un animal[a] et prépare-le, car ces hommes mangeront avec moi à midi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie littéralement une tournure apparentée à « abats un abattage », c’est-à-dire : abats une bête pour le repas.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: vit
  rationale: 'Le qal de ראה exprime ici la perception directe : Joseph remarque que Benjamin accompagne les autres.'
- source_word: אִתָּם
  choice: avec eux
  rationale: La préposition indique que Benjamin se trouve en compagnie des autres hommes.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: à celui qui avait la charge de sa maison
  rationale: Cette formulation naturelle conserve le sens concret de l’hébreu, littéralement « celui qui était sur sa maison », sans imposer un titre administratif précis comme « intendant ».
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: Fais entrer ces hommes dans la maison
  rationale: La terminaison directionnelle de הַבַּיְתָה marque un mouvement vers l’intérieur. Le démonstratif « ces » identifie naturellement, en français, les hommes présents sous les yeux de Joseph.
- source_word: וּטְבֹחַ טֶבַח
  choice: abats un animal
  rationale: La construction associant le verbe et le nom de même racine est un idiome signifiant qu’il faut abattre une bête en vue du repas. « Un animal » explicite l’objet sous-entendu sans préciser indûment l’espèce.
- source_word: וְהָכֵן
  choice: et prépare-le
  rationale: L’impératif signifie « préparer, apprêter ». Le pronom renvoie naturellement à l’animal abattu, compris comme nourriture à préparer.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: car ces hommes mangeront avec moi
  rationale: כִּי introduit la raison des ordres. « Manger avec moi » rend directement l’hébreu sans ajouter l’idée plus formelle de banquet.
- source_word: בַּצָּהֳרָיִם
  choice: à midi
  rationale: Le terme désigne le milieu de la journée ; « à midi » est l’équivalent français courant et précis.
theological_decisions: []
