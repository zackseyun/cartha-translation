lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Le premier כִּי introduit l’explication que Juda donne à son père ; « Car » rend naturellement ce lien logique.
- source_word: לוּלֵא
  choice: si… ne… pas
  rationale: לוּלֵא introduit ici une condition passée contraire aux faits ; la tournure « si nous n’avions pas » l’exprime clairement en français.
- source_word: הִתְמַהְמָהְנוּ
  choice: nous n’avions pas tardé
  rationale: Le verbe désigne le fait de tarder, de s’attarder ou d’hésiter. « Tarder » est naturel et convient au départ repoussé dans ce contexte.
- source_word: כִּי עַתָּה
  choice: déjà
  rationale: Dans la conséquence de cette condition irréelle, l’expression situe au moment présent un retour qui aurait déjà eu lieu. « Déjà » rend ce sens idiomatiquement avec le conditionnel passé.
- source_word: שַׁבְנוּ
  choice: nous serions revenus
  rationale: Bien que la forme hébraïque soit un accompli, la construction contrefactuelle exige en français le conditionnel passé pour exprimer le résultat qui se serait produit.
- source_word: זֶה פַעֲמָיִם
  choice: deux fois
  rationale: Cette expression idiomatique signifie ici que deux voyages aller-retour auraient pu être accomplis ; « deux fois » en donne une traduction française directe et naturelle.
