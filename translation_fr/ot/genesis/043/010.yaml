  text: Car, si nous n’avions pas tardé[a], nous serions déjà revenus deux fois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si nous ne nous étions pas attardés » ou « si nous n’avions pas hésité ». Le verbe hébreu peut évoquer le fait de tarder, de s’attarder ou d’hésiter.'
    reason: lexical_alternative
  - marker: b
