base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: fr
  text: C’est moi qui me porte garant de lui. Tu pourras me le réclamer. Si je ne te l’amène pas et ne le présente pas devant toi, je serai en faute envers toi toute ma vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « j’aurai péché contre toi tous les jours de ma vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: C’est moi qui
  rationale: 'Le pronom indépendant est emphatique : Juda assume personnellement la responsabilité.'
- source_word: אֶֽעֶרְבֶנּוּ
  choice: me porte garant de lui
  rationale: Le verbe exprime l’engagement comme garant; cette formulation est naturelle en français moderne et conserve la portée juridique.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: Tu pourras me le réclamer
  rationale: L’expression hébraïque signifie que Jacob pourra demander Benjamin à Juda et lui en faire rendre compte. La formulation française évite le calque peu naturel « de ma main » tout en gardant la responsabilité personnelle.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: je ne te le ramène pas
  rationale: Le verbe signifie littéralement « l’amener à toi »; « ramener » explicite naturellement le retour déjà impliqué par la situation.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: et ne le présente pas devant toi
  rationale: Le hiphil de יצג désigne l’action de placer ou présenter quelqu’un devant une personne.
- source_word: וְחָטָאתִי לְךָ
  choice: je serai coupable envers toi
  rationale: Le verbe ordinaire pour « pécher » exprime ici la culpabilité durable encourue par Juda envers son père; « coupable » convient au contexte de garantie sans effacer la dimension morale.
- source_word: כָּל הַיָּמִים
  choice: tous les jours de ma vie
  rationale: L’expression indique une durée viagère; cette tournure française transmet clairement cette portée.
theological_decisions:
- issue: Sens de וְחָטָאתִי לְךָ dans un engagement interpersonnel
  choice: je serai coupable envers toi
  alternative: j’aurai péché contre toi
  rationale: Le contexte est celui de la responsabilité personnelle assumée par Juda, mais le verbe hébreu reste le verbe courant « pécher ». Le texte principal rend le sens relationnel et juridique, tandis que la note conserve la formulation plus littérale et sa tension morale.
translation_notes:
  register: Français international moderne, naturel et digne. « Se porter garant » conserve la solennité de l’engagement sans archaïsme; les deux phrases suivantes rendent clairement la responsabilité personnelle de Juda.
