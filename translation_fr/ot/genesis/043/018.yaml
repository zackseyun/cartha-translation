translation_notes:
  register: Français international moderne, narratif et digne. Le discours direct reste naturel tout en conservant la succession des craintes exprimées. L’ambiguïté de l’expression לְהִתְגֹּלֵל עָלֵינוּ est signalée en note plutôt que résolue de manière dogmatique.
