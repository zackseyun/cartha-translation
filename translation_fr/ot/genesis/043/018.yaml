  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: fr
  text: 'Les hommes eurent peur parce qu’on les avait conduits dans la maison de Joseph. Ils se dirent : « C’est à cause de l’argent qui avait été remis dans nos sacs la première fois qu’on nous fait entrer ici, pour trouver un prétexte contre nous[a], se jeter sur nous, nous réduire en esclavage et prendre nos ânes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « chercher une occasion contre nous ». L’expression hébraïque est idiomatique et son sens précis est difficile à établir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הָאֲנָשִׁים
  choice: Les hommes eurent peur
  rationale: Le verbe ירא décrit ici leur réaction dans la progression narrative. Le passé simple convient au récit soutenu et reste naturel en français écrit.
- source_word: כִּי הוּבְאוּ בֵּית יוֹסֵף
  choice: parce qu’on les avait conduits dans la maison de Joseph
  rationale: Le hophal de בוא exprime le fait d’être amené ou conduit à l’intérieur. Le plus-que-parfait rend l’antériorité par rapport à leur peur; la tournure avec « on » est un passif idiomatique français.
- source_word: עַל דְּבַר הַכֶּסֶף הַשָּׁב בְּאַמְתְּחֹתֵינוּ בַּתְּחִלָּה
  choice: C’est à cause de l’argent remis dans nos sacs la première fois
  rationale: עַל דְּבַר marque ici la cause supposée. הַשָּׁב indique l’argent revenu ou remis dans les sacs; « remis » conserve cette nuance sans préciser explicitement l’agent. בַּתְּחִלָּה renvoie contextuellement au premier voyage.
- source_word: אֲנַחְנוּ מוּבָאִים
  choice: qu’on nous fait entrer ici
  rationale: Le participe passif présente l’action comme en cours. « Faire entrer » rend la valeur causative de la forme passive de בוא, et « ici » explicite naturellement la destination déjà nommée.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: on veut trouver un prétexte contre nous
  rationale: L’expression idiomatique, difficile, évoque une manœuvre hostile ou la recherche d’un motif contre eux. Cette formulation française préserve ce sens probable sans le réduire à une accusation formelle.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: se jeter sur nous
  rationale: La forme de נפל avec עַל exprime une action hostile. « Se jeter sur » garde l’image du texte hébreu tout en étant idiomatique.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים וְאֶת חֲמֹרֵינוּ
  choice: puis nous réduire en esclavage et prendre nos ânes
  rationale: לַעֲבָדִים désigne ici la condition d’esclaves, non un simple service. « Réduire en esclavage » exprime clairement le changement de statut; les ânes sont également l’objet de la prise.
