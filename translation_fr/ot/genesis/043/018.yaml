revisions:
- from: 'Les hommes eurent peur parce qu’on les avait conduits dans la maison de Joseph. Ils se dirent : « C’est à cause de l’argent remis dans nos sacs la première fois qu’on nous fait entrer ici : on veut trouver un prétexte contre nous[a], se jeter sur nous, puis nous réduire en esclavage et prendre nos ânes. »'
  to: 'Les hommes eurent peur parce qu’on les avait conduits dans la maison de Joseph. Ils se dirent : « C’est à cause de l’argent qui avait été remis dans nos sacs la première fois qu’on nous fait entrer ici, pour trouver un prétexte contre nous[a], se jeter sur nous, nous réduire en esclavage et prendre nos ânes. »'
  rationale: La révision remplace « on veut trouver » par une construction finale qui reflète mieux les infinitifs de but hébreux. « Qui avait été remis » explicite également que l’argent était celui replacé dans leurs sacs lors du premier voyage, sans préciser indûment l’agent. La note conserve l’ambiguïté lexicale de l’expression idiomatique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:11:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la peur des frères, l’entrée dans la maison de Joseph, l’argent rendu lors du premier voyage, la manœuvre hostile, l’agression redoutée, l’asservissement et la saisie des ânes. Toutefois, « on veut trouver » explicite une volonté présente là où les infinitifs hébreux expriment plus directement le but supposé de leur introduction.'
  naturalness: Le français est naturel et d’un registre narratif moderne. Une formulation de but avec « pour » rend toutefois plus directement et plus fluidement la syntaxe de la crainte exprimée dans le discours direct.
  terminology: « Réduire en esclavage » rend correctement לַעֲבָדִים. « Prétexte contre nous » est une solution recevable à l’idiome difficile לְהִתְגֹּלֵל עָלֵינוּ; la note maintient à juste titre l’incertitude.
