    issue: « on veut trouver un prétexte » transforme légèrement la proposition finale en affirmation de volonté.
    rationale: Les infinitifs לְהִתְגֹּלֵל, וּלְהִתְנַפֵּל et וְלָקַחַת indiquent le dessein que les frères prêtent à ceux qui les font entrer. « Pour trouver » préserve plus directement cette relation de but sans ajouter l’idée de « vouloir ».
