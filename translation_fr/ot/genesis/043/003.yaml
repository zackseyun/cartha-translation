id: GEN.43.3
reference: Genesis 43:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר אֵלָ֛י/ו יְהוּדָ֖ה לֵ/אמֹ֑ר הָעֵ֣ד הֵעִד֩ בָּ֨/נוּ הָ/אִ֤ישׁ לֵ/אמֹר֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: fr
  text: 'Alors Juda lui dit : « L’homme nous a avertis avec insistance[a] : “Vous ne verrez pas mon visage[b] si votre frère n’est pas avec vous.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « nous a formellement avertis » ou « nous a clairement prévenus ». L’hébreu associe un infinitif absolu au verbe conjugué pour renforcer l’avertissement.'
    reason: lexical_alternative
  - marker: b
    text: 'Cette expression peut aussi signifier : « Vous ne vous présenterez pas devant moi. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » rend naturellement cette succession en français moderne.
- source_word: אֵלָיו
  choice: lui
  rationale: Le pronom renvoie à Jacob, destinataire des paroles de Juda.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הָעֵד הֵעִד
  choice: a avertis avec insistance
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’idée verbale. Dans ce contexte, עוד exprime un avertissement appuyé plutôt qu’un témoignage judiciaire.
- source_word: בָּנוּ
  choice: nous
  rationale: Complément naturel du verbe « avertir » en français.
- source_word: הָאִישׁ
  choice: L’homme
  rationale: Conserve la désignation ordinaire employée dans l’hébreu pour parler du responsable égyptien.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Vous ne verrez pas mon visage
  rationale: 'Reproduit l’image hébraïque sans effacer son sens idiomatique possible : être admis en présence de quelqu’un ou se présenter devant lui.'
- source_word: בִּלְתִּי
  choice: si … n’est pas
  rationale: Rend en français naturel la condition restrictive exprimée par l’hébreu.
- source_word: אֲחִיכֶם
  choice: votre frère
  rationale: Le nom est au singulier avec un suffixe pluriel et désigne ici Benjamin.
- source_word: אִתְּכֶם
  choice: avec vous
  rationale: Rend directement le groupe prépositionnel hébreu; le verbe « être », sous-entendu en hébreu, est explicité en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image concrète de « voir mon visage » tout en signalant en note sa portée idiomatique. La répétition hébraïque de « disant » n’est pas reproduite mécaniquement, les deux-points introduisant naturellement les paroles rapportées en français.
