source:
  edition: WLC
  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: fr
  text: 'Mais si tu ne l’envoies pas, nous ne descendrons pas, car l’homme nous a dit : « Vous ne verrez pas mon visage[a], à moins que votre frère ne soit avec vous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Vous ne verrez pas mon visage » ; expression signifiant ici : « Vous ne paraîtrez pas devant moi » ou « Vous ne serez pas admis en ma présence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction introduit ici le contraste avec la proposition conditionnelle du verset précédent ; « Mais si » exprime naturellement cette opposition.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: tu ne l’envoies pas
  rationale: La construction négative avec participe exprime le refus ou la décision de ne pas envoyer. Le pronom « l’ » est fourni par le contexte et désigne Benjamin, objet implicite en hébreu.
- source_word: לֹא נֵרֵד
  choice: nous ne descendrons pas
  rationale: Le verbe ירד décrit traditionnellement le déplacement de Canaan vers l’Égypte comme une descente ; le futur convient à la conséquence envisagée.
- source_word: כִּי
  choice: car
  rationale: La conjonction donne la raison du refus. « Car » relie clairement et dignement les deux propositions.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Joseph n’étant pas encore reconnu par ses frères, Juda le désigne simplement comme « l’homme », sans introduire une information extérieure au point de vue du récit.
- source_word: אָמַר אֵלֵינוּ
  choice: nous a dit
  rationale: Cette formulation française naturelle conserve le verbe de parole et introduit directement la citation.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Vous ne verrez pas mon visage
  rationale: 'La traduction conserve l’expression hébraïque littérale, intelligible en français, tout en signalant en note sa valeur idiomatique : être admis en présence de quelqu’un.'
- source_word: בִּלְתִּי
  choice: à moins que
  rationale: Dans cette construction, le terme introduit la condition nécessaire. « À moins que » rend précisément cette valeur restrictive.
- source_word: אֲחִיכֶם
  choice: votre frère
  rationale: L’hébreu ne nomme pas Benjamin ici ; la traduction maintient cette formulation et laisse le contexte l’identifier.
- source_word: אִתְּכֶם
  choice: ne soit avec vous
  rationale: Le français exige un verbe dans cette proposition, absent mais sous-entendu dans la phrase nominale hébraïque. Le subjonctif est requis après « à moins que ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier rend l’adresse à Jacob, tandis que le pluriel « vous » dans la citation vise l’ensemble des frères. L’image géographique de la descente vers l’Égypte et l’expression hébraïque « voir mon visage » sont conservées.
