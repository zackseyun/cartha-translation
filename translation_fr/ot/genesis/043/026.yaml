revisions:
- from: Quand Joseph entra dans la maison, ils lui apportèrent le présent[a] qu’ils avaient en main, à l’intérieur de la maison[b], puis ils se prosternèrent devant lui jusqu’à terre.
  to: Quand Joseph entra dans la maison, ils lui apportèrent le présent[a] qu’ils avaient en main jusque dans la maison, puis ils se prosternèrent devant lui jusqu’à terre.
  rationale: Le remplacement de « à l’intérieur de la maison » par « jusque dans la maison » rend la direction implicite dans la seconde occurrence hébraïque tout en préservant la répétition de « maison ». La note b est maintenue afin d’expliciter cette répétition structurelle. L’ancre b n’est pas insérée dans le texte, puisque la répétition est directement visible dans la traduction et que la note n’est pas nécessaire à sa compréhension.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T12:11:58Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’entrée de Joseph, la présentation du présent, l’hommage et la répétition de « maison ». Toutefois, « à l’intérieur de la maison » est statique et ne rend pas nettement la valeur directionnelle de la seconde forme הַבָּיְתָה (« dans/vers la maison »).
  naturalness: Le français est globalement naturel et de registre narratif approprié. « Jusque dans la maison » exprime plus clairement et plus idiomatiquement que « à l’intérieur de la maison » le déplacement du présent vers l’intérieur, tout en conservant la répétition voulue.
  terminology: « Présent » convient bien à מִנְחָה dans ce contexte non cultuel; la note qui signale « cadeau » et « tribut » est équilibrée. « Se prosternèrent ... jusqu’à terre » restitue convenablement le geste d’hommage sans lui imposer un sens cultuel.
  issues:
  - severity: medium
    issue: La seconde occurrence de « maison » est rendue par une expression statique.
    rationale: Le ה directionnel de הַבָּיְתָה indique le mouvement vers/dans la maison. « À l’intérieur de la maison » peut seulement situer l’action et laisse moins clairement entendre que le présent y est apporté.
  revised_text: Quand Joseph entra dans la maison, ils lui apportèrent le présent[a] qu’ils avaient en main jusque dans la maison, puis ils se prosternèrent devant lui jusqu’à terre.
  revised_footnotes:
  - marker: a
    text: Ou « le cadeau » ; le terme hébreu peut aussi désigner un tribut selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète « dans la maison » : Joseph entre dans la maison, puis le présent y est apporté.'
    reason: source_structure
  revision_rationale: Le remplacement de « à l’intérieur de la maison » par « jusque dans la maison » rend la direction implicite dans la seconde occurrence hébraïque tout en préservant la répétition de « maison ». La note b est maintenue afin d’expliciter cette répétition structurelle. L’ancre b n’est pas insérée dans le texte, puisque la répétition est directement visible dans la traduction et que la note n’est pas nécessaire à sa compréhension.
