base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: fr
  text: Quand Joseph entra dans la maison, ils lui apportèrent le présent[a] qu’ils avaient en main jusque dans la maison, puis ils se prosternèrent devant lui jusqu’à terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cadeau » ; le terme hébreu peut aussi désigner un tribut selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יוֹסֵף הַבַּיְתָה
  choice: Quand Joseph entra dans la maison
  rationale: Le verbe בוא avec le ה directionnel exprime ici l’entrée de Joseph dans la maison. « Entra dans » rend naturellement le mouvement en français.
- source_word: וַיָּבִיאוּ לוֹ
  choice: ils lui apportèrent
  rationale: Le hiphil de בוא signifie « apporter » et לוֹ désigne Joseph comme destinataire. Cette construction est naturelle et fidèle en français.
- source_word: הַמִּנְחָה
  choice: le présent
  rationale: מִנְחָה désigne ici un cadeau diplomatique destiné à gagner la faveur du gouverneur, et non une offrande cultuelle. « Présent » convient au registre narratif et à la situation.
- source_word: אֲשֶׁר בְּיָדָם
  choice: qu’ils avaient en main
  rationale: Cette formulation conserve l’image concrète de l’hébreu tout en restant idiomatique en français.
- source_word: הַבָּיְתָה
  choice: à l’intérieur de la maison
  rationale: Cette seconde occurrence du nom avec le ה directionnel indique que le présent est apporté dans la maison. La formulation permet de conserver la répétition de « maison » sans obscurcir la syntaxe française.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: ils se prosternèrent devant lui jusqu’à terre
  rationale: שׁחה exprime une prosternation en signe d’hommage, tandis que אָרְצָה en précise le mouvement vers le sol. « Jusqu’à terre » rend nettement l’ampleur du geste.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « maison », marquée dans l’hébreu, est conservée malgré une légère lourdeur voulue. « Se prosternèrent » exprime clairement l’hommage sans lui attribuer nécessairement une portée cultuelle.
