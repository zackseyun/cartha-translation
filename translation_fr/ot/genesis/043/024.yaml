  text: וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֣יתָ/ה יוֹסֵ֑ף וַ/יִּתֶּן מַ֨יִם֙ וַ/יִּרְחֲצ֣וּ רַגְלֵי/הֶ֔ם וַ/יִּתֵּ֥ן מִסְפּ֖וֹא לַ/חֲמֹֽרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: fr
  text: L’homme fit entrer les hommes dans la maison de Joseph et leur donna de l’eau ; ils se lavèrent les pieds. Puis il donna du fourrage à leurs ânes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu dit littéralement « l’homme » et « les hommes » ; il ne les désigne pas explicitement ici comme l’intendant de Joseph et les frères de Joseph, même si le contexte permet de les identifier ainsi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: fit entrer
  rationale: Le hifil de בוא exprime ici le fait de faire entrer ou d’amener à l’intérieur. « Fit entrer » rend clairement la valeur causative et la direction indiquée par בֵּיתָה.
- source_word: הָאִישׁ
  choice: L’homme
  rationale: L’hébreu dit simplement « l’homme ». Le contexte permet de reconnaître l’intendant de Joseph, mais sa fonction n’est pas nommée dans ce verset.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le texte emploie le pluriel ordinaire « les hommes », et non « les frères » ; cette formulation est donc conservée.
- source_word: בֵּיתָה יוֹסֵף
  choice: dans la maison de Joseph
  rationale: Le suffixe directionnel de בֵּיתָה marque un mouvement vers l’intérieur ; après « fit entrer », « dans » l’exprime naturellement en français.
- source_word: וַיִּתֶּן מַיִם
  choice: leur donna de l’eau
  rationale: Le bénéficiaire est implicite en hébreu mais clair dans le contexte. Le pronom « leur » est nécessaire à une formulation française naturelle.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: ils se lavèrent les pieds
  rationale: 'Le verbe est actif et pluriel : ce sont les hommes qui se lavent les pieds. La traduction n’introduit donc ni serviteur ni tournure passive.'
- source_word: מִסְפּוֹא
  choice: du fourrage
  rationale: Le terme désigne la nourriture destinée aux animaux. « Fourrage » est précis, courant et adapté aux ânes.
- source_word: לַחֲמֹרֵיהֶם
  choice: à leurs ânes
  rationale: La préposition ל marque ici les destinataires de ce qui est donné ; « à leurs ânes » conserve la construction du texte tout en restant idiomatique.
