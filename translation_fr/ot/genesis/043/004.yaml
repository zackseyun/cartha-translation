  yaml_path: translation/ot/genesis/043/004.yaml
  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: fr
  text: Si tu envoies notre frère avec nous[a], nous descendrons acheter de la nourriture pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si tu consens à envoyer notre frère avec nous. » La tournure hébraïque peut exprimer la disposition ou la volonté d’agir aussi bien que l’action elle-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit simplement la condition, sans ajouter d’emphase absente de l’hébreu.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: tu acceptes de laisser partir
  rationale: La tournure יֵשׁ avec suffixe pronominal et participe peut exprimer la disposition ou la volonté d’agir. Cette formulation est naturelle en français et garde au père la décision d’autoriser le départ.
- source_word: אֶת אָחִינוּ אִתָּנוּ
  choice: notre frère avec nous
  rationale: Rend directement l’objet et l’idée d’accompagnement, tout en conservant l’accent familial.
- source_word: נֵרְדָה
  choice: nous descendrons
  rationale: Le cohortatif exprime ici l’action résolue qui découlera de la condition; le futur convient naturellement en français.
- source_word: וְנִשְׁבְּרָה
  choice: t’acheter
  rationale: Dans ce contexte d’approvisionnement, שבר signifie acheter. La construction avec le pronom bénéficiaire est rendue naturellement par « t’acheter ».
- source_word: לְךָ
  choice: t’
  rationale: Indique que l’achat sera fait pour le père, bénéficiaire de l’action.
- source_word: אֹכֶל
  choice: de la nourriture
  rationale: Le nom désigne largement la nourriture; il ne convient donc pas de le restreindre explicitement au blé ou aux céréales.
