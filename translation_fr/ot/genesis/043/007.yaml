base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: fr
  text: 'Ils répondirent : « Cet homme nous a interrogés avec insistance sur nous et sur notre famille : “Votre père est-il encore en vie ? Avez-vous un frère ?” Nous lui avons donc répondu en fonction de ces questions. Comment aurions-nous pu savoir qu’il dirait : “Faites descendre votre frère” ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: nous a interrogés avec insistance
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’interrogation; cette tournure française en restitue naturellement la force.
- source_word: מוֹלֶדֶת
  choice: famille
  rationale: Dans ce contexte, le terme désigne les liens et la situation familiale plutôt que le lieu de naissance.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: en fonction de ces questions
  rationale: Littéralement « selon ces paroles/choses »; le contexte montre qu’ils ont donné les renseignements correspondant aux questions posées.
- source_word: הוֹרִידוּ
  choice: Faites descendre
  rationale: Le verbe exprime le déplacement vers l’Égypte, conventionnellement décrit comme une descente dans le récit de la Genèse.
theological_decisions:
- issue: Portée de la question rhétorique finale
  choice: Comment aurions-nous pu savoir
  alternative: Savions-nous vraiment
  rationale: La construction emphatique הֲיָדוֹעַ נֵדַע exprime leur impossibilité de prévoir la demande, sans ajouter de motif théologique.
translation_notes:
  register: Français international moderne, narratif et digne. Le dialogue conserve la défense vive des frères, tout en évitant une littéralité obscure.
