  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: fr
  text: Que Dieu tout-puissant vous fasse trouver compassion auprès de cet homme[a], afin qu’il vous renvoie votre autre frère[b] et Benjamin. Quant à moi, si je suis privé de mes enfants, je le suis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, Dieu « vous donne des compassions devant cet homme ». Le mot hébreu peut désigner la compassion, la miséricorde ou une tendre pitié; « auprès de cet homme » exprime la faveur espérée de sa part.
    reason: lexical_alternative
  - marker: b
    text: « Votre autre frère » désigne Siméon, retenu en Égypte.
    reason: cross_reference
  - marker: c
    text: 'L’hébreu répète le même verbe : « comme/lorsque j’ai été privé d’enfants, je suis privé d’enfants ». Dans le contexte, la formule est couramment comprise comme une résignation : « si je suis privé de mes enfants, je le suis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: le Dieu tout-puissant
  rationale: Traduit le titre divin de manière claire et traditionnelle en français, plutôt que de translittérer « El Shaddaï ».
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: vous accorde la compassion de cet homme
  rationale: Dans ce contexte, רַחֲמִים désigne la compassion ou la pitié favorable que les fils espèrent trouver auprès du gouverneur; cette formulation rend naturellement en français la construction avec לִפְנֵי.
- source_word: וְשִׁלַּח לָכֶם
  choice: afin qu’il laisse repartir avec vous
  rationale: Rend la continuation du souhait et le sens contextuel de renvoyer ou relâcher le frère détenu pour qu’il reparte avec eux.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: votre autre frère
  rationale: Reproduit simplement la distinction faite par אַחֵר; le contexte désigne Siméon.
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Conserve la mise en relief du pronom et marque le passage à la résignation personnelle de Jacob.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: si je dois perdre mes enfants, je les perdrai
  rationale: Exprime en français actuel la résignation portée par la répétition du verbe שׁכל, tout en explicitant son emploi parental.
theological_decisions:
- issue: Traduction du titre divin אֵל שַׁדַּי
  choice: le Dieu tout-puissant
  alternative: El Shaddaï
  rationale: Le syntagme fonctionne comme un titre divin; le traduire communique son sens conventionnel aux lecteurs sans imposer une interprétation confessionnelle particulière.
- issue: Portée de la formule finale de Jacob
  choice: une résignation conditionnelle à la perte éventuelle de ses enfants
  alternative: une déclaration selon laquelle il est déjà privé d’enfants et le restera
  rationale: Le contexte immédiat concerne le risque de perdre encore ses fils. La formulation française conserve la tension de l’hébreu sans faire de la phrase une affirmation doctrinale sur la providence ou le destin.
translation_notes:
  register: Français international moderne, digne et accessible. « Cet homme » reprend le gouverneur égyptien déjà connu dans le récit. La dernière proposition privilégie une formulation idiomatique tout en signalant en note la répétition hébraïque.
