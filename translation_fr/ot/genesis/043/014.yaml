    issue: « la compassion de cet homme »
    rationale: Cette formulation suggère que la compassion est celle que possède l’homme, alors que Dieu est le sujet de « accorder » et que לִפְנֵי הָאִישׁ situe la faveur ou compassion reçue auprès de cet homme.
  - severity: low
    issue: 'Note a : « Littéralement : vous donne compassion devant cet homme »'
    rationale: La note est trop brute et l’expression française « donne compassion devant » n’est pas naturelle. Elle peut expliquer sobrement que l’hébreu parle de compassion/faveur « auprès de » ou « devant » l’homme.
  - severity: medium
    issue: Note c présente « si » comme si c’était la forme littérale unique
    rationale: La conjonction כַּאֲשֶׁר peut aussi être comprise « comme/lorsque ». La note doit préserver cette difficulté et ne pas suraffirmer une paraphrase conditionnelle.
