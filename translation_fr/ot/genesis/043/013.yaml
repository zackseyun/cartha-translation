  text: וְ/אֶת אֲחִי/כֶ֖ם קָ֑חוּ וְ/ק֖וּמוּ שׁ֥וּבוּ אֶל הָ/אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: fr
  text: Prenez aussi votre frère[a], levez-vous et retournez auprès de l’homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « votre frère »; dans le contexte, il s’agit de Benjamin.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם
  choice: aussi votre frère
  rationale: La conjonction introduit ici un élément supplémentaire à emmener. « Aussi » exprime naturellement cette valeur additive, tandis que « votre frère » conserve la formulation hébraïque sans ajouter son nom.
- source_word: קָחוּ
  choice: Prenez
  rationale: Impératif pluriel de לקח, rendu directement par « prendre »; dans ce contexte, il implique de l’emmener avec eux.
- source_word: וְ/ק֖וּמוּ
  choice: levez-vous
  rationale: Impératif pluriel de קום. « Levez-vous » conserve l’image et l’élan du commandement tout en restant naturel en français moderne.
- source_word: שׁ֥וּבוּ
  choice: retournez
  rationale: Impératif pluriel de שוב employé au sens de revenir ou retourner vers un lieu ou une personne déjà rencontrée.
- source_word: אֶל הָ/אִישׁ
  choice: auprès de cet homme
  rationale: אֶל marque le mouvement vers la personne. « Auprès de » est idiomatique après « retourner »; « cet homme » identifie naturellement l’homme déjà connu dans le contexte, sans préciser sa fonction.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La suite de deux impératifs hébreux est rendue par « levez-vous et retournez », formulation naturelle qui conserve les deux actions et leur urgence.
