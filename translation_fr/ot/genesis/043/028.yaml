  text: וַ/יֹּאמְר֗וּ שָׁל֛וֹם לְ/עַבְדְּ/ךָ֥ לְ/אָבִ֖י/נוּ עוֹדֶ֣/נּוּ חָ֑י וַֽ/יִּקְּד֖וּ ו/ישתחו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: fr
  text: 'Ils répondirent[a] : « Ton serviteur, notre père, va bien ; il est encore en vie. » Puis ils s’inclinèrent et se prosternèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Paix à ton serviteur, à notre père » ; ici, le mot hébreu traduit par « va bien » désigne son bien-être.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: va bien
  rationale: Dans cette réponse concernant l’état du père, le nom exprime idiomatiquement son bien-être. « Va bien » est naturel en français moderne et convient à la question implicite sur sa santé.
- source_word: לְעַבְדְּךָ
  choice: ton serviteur
  rationale: Les frères parlent à Joseph avec déférence. Ici, עבד est une formule d’humilité envers un supérieur plutôt qu’une indication de statut servile au sens strict.
- source_word: לְאָבִינוּ
  choice: notre père
  rationale: La construction possessive est rendue directement ; « notre père » est en apposition à « ton serviteur ».
- source_word: עוֹדֶנּוּ חָי
  choice: il est encore en vie
  rationale: La formulation préserve l’idée de continuité portée par עוד et reste naturelle en français contemporain.
- source_word: וַיִּקְּדוּ
  choice: ils s’inclinèrent
  rationale: Le verbe קדד décrit le fait de courber le corps ou de s’incliner.
- source_word: וישתחו
  choice: se prosternèrent
  rationale: Le verbe décrit ici une prosternation devant un supérieur humain. Ce choix restitue le geste sans suggérer à tort un culte religieux.
theological_decisions:
- issue: Sens du verbe d’hommage וישתחו
  choice: se prosternèrent
  alternative: adorèrent ; s’inclinèrent
  rationale: Le contexte présente un geste de déférence sociale devant Joseph, non un acte explicite d’adoration divine. La traduction conserve l’action corporelle sans ajouter une portée cultuelle.
translation_notes:
  register: 'Français international moderne, naturel et digne. Le tutoiement reflète l’adresse au singulier de l’hébreu et la relation hiérarchique. Les deux verbes gestuels sont distingués : inclinaison, puis prosternation.'
