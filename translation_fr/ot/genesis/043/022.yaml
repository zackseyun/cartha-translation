  text: וְ/כֶ֧סֶף אַחֵ֛ר הוֹרַ֥דְנוּ בְ/יָדֵ֖/נוּ לִ/שְׁבָּר אֹ֑כֶל לֹ֣א יָדַ֔עְנוּ מִי שָׂ֥ם כַּסְפֵּ֖/נוּ בְּ/אַמְתְּחֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: fr
  text: Nous avons aussi apporté avec nous une autre somme d’argent pour acheter des vivres[a]. Nous ne savons pas qui a mis notre argent dans nos sacs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du grain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: Nous avons aussi… une autre somme d’argent
  rationale: כֶּסֶף désigne l’argent métal ou l’argent servant au paiement. En français, « argent » conserve naturellement cette polysémie. אַחֵר indique ici une somme distincte et supplémentaire.
- source_word: הוֹרַדְנוּ בְ/יָדֵ/נוּ
  choice: apporté avec nous
  rationale: Le hifil de ירד signifie littéralement « faire descendre, faire aller en bas », selon la représentation habituelle du voyage de Canaan vers l’Égypte. Dans cette phrase, « apporté avec nous » rend naturellement l’action et l’expression idiomatique « dans notre main », sans suggérer que la somme était littéralement tenue à la main.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: pour acheter des vivres
  rationale: Dans ce contexte, שׁבר désigne l’achat de provisions, souvent de grain, tandis que אֹכֶל est le terme plus large pour la nourriture. « Vivres » convient au contexte d’approvisionnement tout en évitant de restreindre indûment le sens.
- source_word: לֹא יָדַעְנוּ
  choice: Nous ne savons pas
  rationale: Le parfait hébreu peut exprimer ici un état présent résultant d’une ignorance antérieure. Dans le discours direct, le présent français rend clairement leur déclaration actuelle.
- source_word: מִי שָׂם
  choice: qui a mis
  rationale: מִי introduit une interrogation indirecte, et שׂים a le sens courant de « mettre, placer ». Le passé composé est naturel en français pour l’acte accompli dont le résultat est constaté.
- source_word: כַּסְפֵּ/נוּ בְּ/אַמְתְּחֹתֵי/נוּ
  choice: notre argent dans nos sacs
  rationale: La répétition d’« argent » reproduit celle de כֶּסֶף. אַמְתַּחַת désigne un sac de transport, notamment pour les provisions ou le grain.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Une autre somme d’argent » explicite qu’il s’agit d’un paiement supplémentaire; « avec nous » rend idiomatiquement בְיָדֵנוּ. Le mouvement vers le bas exprimé par הוֹרַדְנוּ n’est pas reproduit littéralement, car « faire descendre de l’argent avec nous » serait peu naturel en français et n’ajouterait pas ici d’information essentielle.
