  yaml_path: translation/ot/genesis/043/006.yaml
  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: fr
  text: 'Alors Israël dit : « Pourquoi m’avez-vous fait du tort en disant à cet homme que vous aviez encore un frère ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le wayyiqtol fait avancer le récit ; « Alors » en exprime naturellement la succession en français moderne.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le texte hébreu emploie ici le nom Israël ; il est conservé plutôt que remplacé par Jacob.
- source_word: לָמָה
  choice: Pourquoi
  rationale: Équivalent direct et naturel de l’interrogatif hébreu.
- source_word: הֲרֵעֹתֶם לִי
  choice: m’avez-vous fait du tort
  rationale: Le hifil de רעע exprime ici le fait de causer du mal ou du tort à quelqu’un. Cette formulation reste directe, idiomatique et ne transforme pas nécessairement le reproche en jugement moral absolu.
- source_word: לְהַגִּיד לָאִישׁ
  choice: en disant à cet homme
  rationale: L’infinitif indique le moyen par lequel le tort aurait été causé. « Cet homme » renvoie naturellement au responsable égyptien déjà connu dans le récit.
- source_word: הַעוֹד לָכֶם אָח
  choice: que vous aviez encore un frère
  rationale: La construction indique qu’un frère leur restait ou existait encore pour eux. « Encore un frère » garde cette idée sans ajouter explicitement « autre », absent du texte hébreu.
