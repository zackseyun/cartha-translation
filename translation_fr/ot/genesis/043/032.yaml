  text: וַ/יָּשִׂ֥ימוּ ל֛/וֹ לְ/בַדּ֖/וֹ וְ/לָ/הֶ֣ם לְ/בַדָּ֑/ם וְ/לַ/מִּצְרִ֞ים הָ/אֹכְלִ֤ים אִתּ/וֹ֙ לְ/בַדָּ֔/ם כִּי֩ לֹ֨א יוּכְל֜וּ/ן הַ/מִּצְרִ֗ים לֶ/אֱכֹ֤ל אֶת הָֽ/עִבְרִים֙ לֶ֔חֶם כִּי תוֹעֵבָ֥ה הִ֖וא לְ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: fr
  text: On le servit à part, ses frères à part, et les Égyptiens qui mangeaient avec lui à part. En effet, les Égyptiens ne pouvaient pas prendre leur repas avec les Hébreux[a], car c’est une abomination pour les Égyptiens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « manger du pain avec les Hébreux », expression qui signifie partager un repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: On le servit
  rationale: Le verbe signifie littéralement « placer » ou « disposer », mais, dans ce contexte de repas, il s’agit de disposer les mets devant les convives; « servir » exprime naturellement cette action en français.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: à part
  rationale: La répétition de « à part » conserve l’insistance de l’hébreu sur la séparation des trois groupes à table.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: qui mangeaient avec lui
  rationale: Le participe hébreu est rendu par une proposition relative à l’imparfait, naturelle dans le cadre descriptif de la scène.
- source_word: לֹא יוּכְלוּן
  choice: ne pouvaient pas
  rationale: Cette formulation préserve l’idée d’impossibilité, ici vraisemblablement sociale ou coutumière, sans en préciser davantage la nature.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: prendre leur repas avec les Hébreux
  rationale: L’expression hébraïque signifie littéralement « manger du pain avec » et fonctionne comme un idiome désignant le partage d’un repas. La traduction française en donne clairement le sens, tandis que la note conserve la forme de l’original.
- source_word: תוֹעֵבָה
  choice: une abomination
  rationale: Ce terme fort désigne ce qui est jugé répugnant ou inadmissible, notamment sur le plan culturel ou rituel. « Abomination » en maintient la force sans expliquer la cause, que le texte ne donne pas.
- source_word: מִצְרִים / הָעִבְרִים
  choice: les Égyptiens / les Hébreux
  rationale: Ces désignations collectives naturelles en français préservent l’opposition ethnique et sociale centrale dans le verset.
theological_decisions:
- issue: Nature de l’impossibilité et de l’abomination
  choice: Ne pas préciser la raison de l’interdit social
  alternative: Expliquer l’interdit par une règle rituelle, alimentaire ou de caste déterminée
  rationale: Le verset affirme que le repas commun était une abomination pour les Égyptiens, mais n’en indique pas la cause exacte. La traduction conserve cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. La triple répétition de « à part » reproduit volontairement l’effet insistant de l’hébreu. « Prendre leur repas » rend l’idiome avec naturel, et « abomination » conserve la vigueur du terme source.
