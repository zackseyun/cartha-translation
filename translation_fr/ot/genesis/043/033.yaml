- from: Ils s’assirent devant lui, du premier-né au plus jeune, chacun selon son rang de naissance[a]. Les hommes se regardèrent les uns les autres avec stupéfaction[b].
  to: Ils s’assirent devant lui, de l’aîné au plus jeune, selon leur ordre de naissance[a]. Les hommes se regardèrent avec stupéfaction[b].
  rationale: La révision conserve le sens contextuel certain — les frères sont assis par ordre d’âge — dans un français moderne naturel. Elle évite d’intégrer au texte une paraphrase uniforme des deux expressions hébraïques et laisse la note signaler leur parallélisme. La note sur l’étonnement est corrigée pour donner une représentation littérale plus exacte et idiomatique.
