  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: fr
  text: Ils s’assirent devant lui, de l’aîné au plus jeune, selon leur ordre de naissance[a]. Les hommes se regardèrent avec stupéfaction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « le premier-né selon sa primogéniture et le plus jeune selon sa jeunesse » ; il décrit ainsi leur disposition selon l’ordre des naissances.'
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « et les hommes s’étonnèrent, chacun vers son compagnon ». Le verbe hébreu exprime la stupéfaction, et la tournure indique une réaction réciproque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Ils s’assirent
  rationale: Le verbe ישׁב est actif dans le texte hébreu. « Ils s’assirent » conserve cette forme narrative sans introduire le passif « furent placés », même si le contexte suppose une disposition voulue.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Rend directement l’expression spatiale hébraïque et désigne Joseph sans explicitation interprétative.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: du premier-né au plus jeune, chacun selon son rang de naissance
  rationale: La formulation française exprime naturellement l’organisation des frères selon l’ordre des naissances, tout en conservant « premier-né » pour le statut spécifique de l’aîné. Une note signale le parallélisme plus concret de l’hébreu entre primogéniture et jeunesse.
- source_word: וַיִּתְמְהוּ
  choice: avec stupéfaction
  rationale: Le verbe תמה exprime un vif étonnement. « Stupéfaction » convient à l’intensité de la réaction dans ce contexte.
- source_word: הָאֲנָשִׁים
  choice: Les hommes
  rationale: Conserve le substantif du texte source plutôt que de l’expliciter par « les frères ».
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: les uns les autres
  rationale: Équivalent français idiomatique de la tournure réciproque « chacun vers son compagnon ».
