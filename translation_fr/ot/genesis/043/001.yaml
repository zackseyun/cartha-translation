lexical_decisions:
- source_word: וְהָרָעָב
  choice: La famine
  rationale: רָעָב désigne ici une famine. Le וְ initial marque la continuité du récit; il n’est pas nécessaire de le rendre par « Et » dans cette phrase française, puisque l’enchaînement ressort du contexte.
- source_word: כָּבֵד
  choice: était sévère
  rationale: L’adjectif signifie littéralement « lourd », mais appliqué à une famine il en exprime l’intensité. « Sévère » est naturel et précis en français moderne.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ renvoie ici au territoire concerné par le récit, et non à la terre entière. « Dans le pays » convient au contexte narratif.
