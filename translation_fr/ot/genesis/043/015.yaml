  source_fidelity: 'Le projet rend correctement les principaux éléments hébreux : « les hommes », le présent conciliatoire, le double de l’argent, Benjamin, la descente en Égypte et la comparution devant Joseph. « Se mirent en route » est une bonne contextualisation de וַיָּקֻמוּ. Toutefois, la relative « qu’ils emportèrent avec eux » est mal rattachée dans la coordination actuelle et rend la séquence des objets difficile à lire.'
