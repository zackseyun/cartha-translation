  terminology: « Présent », « argent », « descendirent en Égypte » et « se présentèrent devant Joseph » conviennent au français international moderne et au registre narratif. La note sur l’idiome « dans leur main » reste appropriée, mais doit être ancrée au syntagme révisé.
