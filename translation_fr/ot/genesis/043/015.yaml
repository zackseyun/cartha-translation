base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: fr
  text: Les hommes prirent donc ce présent. Ils prirent aussi avec eux le double de l’argent[a] et Benjamin. Puis ils se mirent en route, descendirent en Égypte[b] et se présentèrent devant Joseph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans leur main », expression hébraïque indiquant qu’ils avaient l’argent sur eux et l’emportaient.'
    reason: lexical_alternative
  - marker: b
    text: « Descendirent en Égypte » reprend la manière habituelle, dans la Bible hébraïque, de décrire le trajet de Canaan vers l’Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: הַמִּנְחָה הַזֹּאת
  choice: ce présent
  rationale: Dans ce récit, מִנְחָה désigne des biens apportés à un supérieur pour se le concilier, et non une offrande cultuelle. « Présent » convient au registre narratif et à la situation.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: le double de la somme d’argent
  rationale: La locution indique une quantité d’argent doublée par rapport à la somme précédente. Cette formulation est claire en français et conserve la valeur quantitative.
- source_word: כֶּסֶף
  choice: argent
  rationale: כֶּסֶף signifie littéralement « argent » au sens du métal, mais désigne couramment la monnaie dans un contexte de paiement; le français « argent » rend naturellement les deux nuances.
- source_word: בְיָדָם
  choice: qu’ils emportèrent avec eux
  rationale: Littéralement « dans leur main », cette tournure hébraïque exprime ici le fait d’avoir sur soi et de transporter. La traduction idiomatique évite en français l’image maladroite d’une somme tenue collectivement dans une seule main.
- source_word: וְאֶת־בִּנְיָמִן
  choice: et Benjamin
  rationale: Le marqueur d’objet direct coordonne Benjamin aux autres éléments qu’ils prirent avec eux. La formulation concise conserve la coordination hébraïque.
- source_word: וַיָּקֻמוּ
  choice: Ils se mirent en route
  rationale: Dans un récit de déplacement, קום marque couramment le commencement de l’action. « Se mirent en route » rend mieux la fonction narrative que le littéral « se levèrent ».
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: descendirent en Égypte
  rationale: La traduction conserve l’idiome géographique hébreu qui décrit le trajet de Canaan vers l’Égypte comme une descente.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: se présentèrent devant Joseph
  rationale: La locution signifie se tenir ou paraître en présence de quelqu’un. Ici, « se présentèrent devant » exprime naturellement en français leur comparution devant Joseph tout en gardant la solennité de la scène.
- source_word: הָאֲנָשִׁים
  choice: les hommes
  rationale: Le texte les appelle explicitement « les hommes ». Cette désignation est conservée plutôt que d’expliciter « les frères » à partir du contexte.
theological_decisions: []
