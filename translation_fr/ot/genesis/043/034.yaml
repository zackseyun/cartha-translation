  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: fr
  text: Il leur fit servir des portions de ce qui était devant lui[a], mais la portion de Benjamin était cinq fois plus grande que celle de chacun des autres[b]. Ils burent et s’enivrèrent avec lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « venant de devant lui », probablement de la place de Joseph à table.'
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « cinq mains », expression hébraïque signifiant ici « cinq fois autant ».'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu signifie directement « devenir ivre » ; certaines traductions l’atténuent en « se réjouir » ou « être de bonne humeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: Il leur fit servir des portions
  rationale: Dans le contexte du banquet, l’expression désigne l’action de faire apporter ou distribuer des portions de nourriture.
- source_word: מֵאֵת פָּנָיו
  choice: prises devant lui
  rationale: Cette formulation conserve l’image hébraïque tout en suggérant que les portions venaient de la place de Joseph à table.
- source_word: וַתֵּרֶב מַשְׂאַת בִּנְיָמִן מִמַּשְׂאֹת כֻּלָּם
  choice: la portion de Benjamin était cinq fois plus grande que celle de chacun des autres
  rationale: Le singulier distributif français « celle de chacun des autres » exprime naturellement la comparaison entre la portion de Benjamin et chaque portion des autres convives.
- source_word: חָמֵשׁ יָדוֹת
  choice: cinq fois plus grande
  rationale: Littéralement « cinq mains » ; l’expression idiomatique indique une quantité cinq fois supérieure.
- source_word: וַיִּשְׁתּוּ
  choice: Ils burent
  rationale: Traduction directe du verbe narratif désignant l’action de boire.
- source_word: וַיִּשְׁכְּרוּ
  choice: jusqu’à s’enivrer
  rationale: Le verbe signifie directement devenir ivre ; cette traduction évite de l’atténuer en simple gaieté.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Le pronom renvoie à Joseph, dont l’identité ressort clairement du contexte.
theological_decisions: []
