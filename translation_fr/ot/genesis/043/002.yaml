  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר כִּלּוּ֙ לֶ/אֱכֹ֣ל אֶת הַ/שֶּׁ֔בֶר אֲשֶׁ֥ר הֵבִ֖יאוּ מִ/מִּצְרָ֑יִם וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ אֲבִי/הֶ֔ם שֻׁ֖בוּ שִׁבְרוּ לָ֥/נוּ מְעַט אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: fr
  text: 'Quand ils eurent fini de manger le grain qu’ils avaient rapporté d’Égypte, leur père leur dit : « Retournez là-bas et achetez-nous un peu de nourriture. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quand
  rationale: La formule narrative introduit la circonstance temporelle. En français moderne, « Quand » restitue naturellement l’enchaînement sans calquer le tour hébreu « et il arriva que ».
- source_word: כִּלּוּ לֶאֱכֹל
  choice: ils eurent fini de manger
  rationale: Le verbe כלה suivi de l’infinitif exprime l’achèvement. Le passé antérieur convient au récit soutenu et marque que la réserve fut épuisée avant la parole du père.
- source_word: הַשֶּׁבֶר
  choice: le grain
  rationale: Dans le cycle de Joseph, שֶׁבֶר désigne le grain obtenu pendant la famine plutôt que la nourriture au sens large.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: qu’ils avaient rapporté d’Égypte
  rationale: « Rapporté » convient à des hommes revenus d’Égypte avec le grain; le plus-que-parfait indique l’antériorité de ce transport.
- source_word: אֲבִיהֶם
  choice: leur père
  rationale: La traduction conserve la désignation relationnelle du texte hébreu sans lui substituer le nom de Jacob.
- source_word: שֻׁבוּ
  choice: Retournez là-bas
  rationale: L’impératif שׁוב demande de reprendre le chemin de l’Égypte. « Là-bas » rend explicite en français naturel la destination déjà donnée par le contexte, sans la nommer de nouveau.
- source_word: שִׁבְרוּ
  choice: achetez
  rationale: Dans ce contexte, le verbe שׁבר signifie acheter des vivres, particulièrement du grain. L’objet אֹכֶל étant exprimé ensuite, « achetez » suffit.
- source_word: לָנוּ
  choice: nous
  rationale: La construction française idiomatique « achetez-nous » rend le bénéficiaire exprimé par לָנוּ.
- source_word: מְעַט אֹכֶל
  choice: un peu de nourriture
  rationale: אֹכֶל est ici le terme général pour la nourriture, tandis que מְעַט indique une petite quantité. Cette formulation distingue correctement ce terme du « grain » mentionné plus tôt.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le temps narratif soutenu (« eurent fini ») maintient la succession des événements; le dialogue reste direct et courant. Aucun élément ambigu ou théologiquement chargé n’exige de note.
