base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: fr
  text: 'Il leur dit : « Que la paix soit avec vous ! N’ayez pas peur. Votre Dieu, le Dieu de votre père, vous a donné un trésor[a] dans vos sacs. Votre argent[b] m’est parvenu. » Puis il fit sortir Siméon et le leur amena.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un trésor caché ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « votre argent » ; le mot hébreu peut désigner l’argent métal et, fréquemment, la monnaie.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: Que la paix soit avec vous !
  rationale: Cette formule garde le sens fondamental de שָׁלוֹם et sa fonction rassurante, tout en étant naturelle et digne en français.
- source_word: אַל תִּירָאוּ
  choice: N’ayez pas peur
  rationale: Impératif négatif courant et naturel, fidèle au verbe ירא.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: Votre Dieu, le Dieu de votre père
  rationale: L’apposition française évite qu’un accord au pluriel ne suggère deux dieux, tout en conservant la référence singulière au père des frères.
- source_word: נָתַן לָכֶם
  choice: vous a donné
  rationale: Le passé composé exprime naturellement en français l’acte accompli dont le résultat explique la présence actuelle du trésor.
- source_word: מַטְמוֹן
  choice: un trésor
  rationale: « Trésor » restitue avec concision l’idée d’un bien précieux mis en réserve ou caché, sans expliciter excessivement cette nuance dans le texte principal.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: dans vos sacs
  rationale: « Sacs » convient au contexte du transport du grain et reste plus précis que le terme général « bagages ».
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: Votre argent m’est parvenu
  rationale: « Argent » rend le sens monétaire courant de כֶּסֶף en français, tandis que « m’est parvenu » conserve l’image hébraïque de ce qui est venu jusqu’au serviteur.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: Puis il fit sortir Siméon pour le conduire auprès d’eux
  rationale: La formulation conserve la valeur causative et directionnelle de יצא, tout en offrant un enchaînement narratif naturel.
theological_decisions:
- issue: La référence à Dieu dans les paroles de l’intendant
  choice: Rapporter simplement ses paroles comme une référence au Dieu des frères et de leur père.
  alternative: Présenter ces paroles soit comme une simple formule diplomatique, soit comme une profession de foi personnelle de l’intendant.
  rationale: Le texte rapporte les paroles de l’intendant sans préciser sa conviction intérieure ; la traduction ne tranche donc pas cette question.
translation_notes:
  register: Français international moderne, clair et digne. La formule de paix conserve une légère solennité adaptée au récit biblique. Les marqueurs de notes [a] et [b] sont placés immédiatement après les mots concernés.
