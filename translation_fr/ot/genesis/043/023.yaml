    issue: Ajout d'une finalité dans la dernière proposition
    rationale: « pour le conduire auprès d’eux » signifie que la sortie de Siméon avait ce but, alors que וַיּוֹצֵא ... אֲלֵהֶם énonce simplement que l'intendant le fit sortir et l'amena vers eux. Une coordination rend ce mouvement sans ajouter de relation de but.
  - severity: low
    issue: Formulation de la note b peu idiomatique
    rationale: « argent-monétaire » n'est pas une expression naturelle en français moderne. Il suffit d'indiquer que le terme signifie littéralement « argent » ou « argent métal » et peut désigner la monnaie.
