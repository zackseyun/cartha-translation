    rationale: 'Cette expression est ambiguë en français courant : elle peut être comprise comme « deux fois davantage », plutôt que comme une quantité exactement double. Le texte hébreu demande une somme double.'
  - severity: low
    issue: « l’argent qui avait été remis à l’entrée de vos sacs »
    rationale: « Remis à l’entrée » suggère plus facilement qu’il a été donné à quelqu’un à cet endroit. Le participe passif décrit l’argent replacé/restauré dans l’ouverture des sacs.
  revised_text: Prenez avec vous une double somme d’argent, et rapportez aussi l’argent qui avait été replacé à l’ouverture de vos sacs ; c’était peut-être une erreur.
