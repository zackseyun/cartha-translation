  text: וְ/כֶ֥סֶף מִשְׁנֶ֖ה קְח֣וּ בְ/יֶדְ/כֶ֑ם וְ/אֶת הַ/כֶּ֜סֶף הַ/מּוּשָׁ֨ב בְּ/פִ֤י אַמְתְּחֹֽתֵי/כֶם֙ תָּשִׁ֣יבוּ בְ/יֶדְ/כֶ֔ם אוּלַ֥י מִשְׁגֶּ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: fr
  text: Prenez avec vous une double somme d’argent, et rapportez aussi l’argent qui avait été replacé à l’ouverture de vos sacs ; c’était peut-être une erreur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: deux fois plus d’argent
  rationale: מִשְׁנֶה désigne ici une quantité doublée. Cette formulation est claire en français moderne et conserve la valeur quantitative du texte.
- source_word: קְחוּ בְיֶדְכֶם
  choice: prenez avec vous
  rationale: L’expression hébraïque emploie littéralement « dans votre main » pour exprimer le fait d’emporter. « Avec vous » rend naturellement cet idiome en français.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: l’argent qui avait été remis
  rationale: Le participe passif indique que l’argent avait été replacé ou rendu. « Avait été remis » respecte cette passivité sans laisser entendre que les frères l’avaient eux-mêmes rapporté.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: à l’entrée de vos sacs
  rationale: Littéralement « à la bouche de vos sacs » ; en français, « à l’entrée » transmet naturellement l’image de l’ouverture du contenant.
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: rapportez aussi
  rationale: Le hifil de שוב signifie faire revenir, donc « rapporter ». Le complément idiomatique « dans votre main » est rendu implicitement par ce verbe, dans le contexte du déplacement.
- source_word: אוּלַי מִשְׁגֶּה הוּא
  choice: c’était peut-être une erreur
  rationale: אוּלַי marque l’incertitude, et מִשְׁגֶּה désigne une erreur ou une méprise sans nécessairement impliquer une faute morale.
