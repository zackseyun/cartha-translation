  text: וַ/יִּשְׁאַ֤ל לָ/הֶם֙ לְ/שָׁל֔וֹם וַ/יֹּ֗אמֶר הֲ/שָׁל֛וֹם אֲבִי/כֶ֥ם הַ/זָּקֵ֖ן אֲשֶׁ֣ר אֲמַרְתֶּ֑ם הַ/עוֹדֶ֖/נּוּ חָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: fr
  text: 'Il leur demanda s’ils allaient bien[a], puis dit : « Votre père âgé[b], dont vous avez parlé, va-t-il bien ? Est-il encore en vie ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement qu’il les interrogea au sujet de leur bien-être ou de leur prospérité.
    reason: lexical_alternative
  - marker: b
    text: Ou « votre vieux père » ; le terme hébreu souligne son âge avancé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: Il leur demanda s’ils allaient bien
  rationale: Cette formulation naturelle rend l’expression hébraïque qui signifie demander des nouvelles de quelqu’un ou s’enquérir de son bien-être.
- source_word: הֲשָׁלוֹם
  choice: va-t-il bien ?
  rationale: Dans cette question, שָׁלוֹם désigne l’état général ou le bien-être du père, et non seulement sa santé ou l’absence de conflit.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: votre père âgé
  rationale: « Père âgé » conserve la référence explicite à l’âge tout en restant respectueux et naturel en français moderne.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: dont vous avez parlé
  rationale: La relative renvoie simplement au père que les frères avaient mentionné auparavant, sans ajouter d’interprétation.
- source_word: הַעוֹדֶנּוּ חָי
  choice: Est-il encore en vie ?
  rationale: Cette tournure idiomatique restitue directement עוֹד, « encore », et חָי, « vivant, en vie ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition de l’idée d’« aller bien », présente dans la répétition hébraïque de שָׁלוֹם, est conservée.
