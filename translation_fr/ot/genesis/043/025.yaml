  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: fr
  text: Ils préparèrent le cadeau en attendant l’arrivée de Yosef à midi, car ils avaient appris qu’ils y prendraient leur repas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mangeraient du pain », expression hébraïque signifiant « prendre un repas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: Ils préparèrent
  rationale: Le hiphil de כון signifie ici « préparer, mettre en état ». Le passé simple convient à la progression narrative et garde le verbe centré sur l’objet.
- source_word: הַמִּנְחָה
  choice: le cadeau
  rationale: Dans ce récit, מִנְחָה désigne le présent apporté à Yosef, et non une offrande cultuelle. « Cadeau » est clair et naturel en français actuel.
- source_word: עַד בּוֹא יוֹסֵף
  choice: jusqu’à l’arrivée de Yosef
  rationale: עַד suivi de l’infinitif construit בּוֹא marque la limite temporelle atteinte à l’arrivée de Yosef. Cette formulation française conserve directement cette relation.
- source_word: בַּצָּהֳרָיִם
  choice: à midi
  rationale: Le terme désigne le milieu du jour. « À midi » est la formulation française la plus courante et concise.
- source_word: כִּי שָׁמְעוּ
  choice: car ils avaient appris
  rationale: Le premier כִּי est causal. Le plus-que-parfait indique que cette information précédait leurs préparatifs; « apprendre » exprime naturellement ici le fait d’avoir reçu une information.
- source_word: כִּי שָׁם
  choice: qu’ils prendraient là
  rationale: Le second כִּי introduit le contenu de l’information reçue, tandis que שָׁם indique le lieu. La syntaxe est réorganisée selon l’usage naturel du français.
- source_word: יֹאכְלוּ לָחֶם
  choice: ils prendraient leur repas
  rationale: L’expression signifie littéralement « manger du pain », mais fonctionne ici comme un idiome désignant le fait de prendre un repas. La traduction donne le sens courant, tandis que la note conserve l’image hébraïque.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: Le nom est translittéré directement plutôt que remplacé par sa forme française traditionnelle.
