  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: fr
  text: Alors Joseph se hâta, car il fut saisi d’une profonde émotion pour son frère. Il chercha un endroit pour pleurer[a], entra dans la pièce et y pleura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « il chercha à pleurer ». Le contexte peut indiquer qu’il cherchait un endroit où pleurer à l’écart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: se hâta
  rationale: Le verbe signifie se hâter. Cette formulation reste proche de l’hébreu sans ajouter un mouvement de sortie absent du texte.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: il était profondément ému
  rationale: L’expression hébraïque évoque littéralement ses compassions qui s’échauffent ou sont bouleversées. La formulation française restitue naturellement l’intensité de l’émotion.
- source_word: אֶל אָחִיו
  choice: pour son frère
  rationale: La préposition indique ici l’objet vers lequel se porte l’émotion de Joseph, sans qu’il soit nécessaire d’ajouter le nom de Benjamin.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: Il chercha un endroit où pleurer
  rationale: L’hébreu dit plus littéralement qu’il « chercha à pleurer ». Le contexte montre qu’il cherche à s’isoler pour pleurer ; l’ajout implicite d’un endroit produit un français clair.
- source_word: הַחַדְרָה
  choice: dans la pièce
  rationale: Le nom désigne une pièce ou chambre intérieure. « La pièce » est naturel en français moderne et préserve l’article défini.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: et y pleura
  rationale: Cette formulation rend à la fois l’action de pleurer et l’indication de lieu exprimée par שָׁמָּה.
