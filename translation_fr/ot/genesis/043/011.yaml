source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: fr
  text: 'Israël, leur père, leur dit : « S’il le faut vraiment, alors faites ceci : prenez dans vos récipients quelques-uns des meilleurs produits du pays[a] et apportez à cet homme un cadeau : un peu de baume, un peu de miel[b], de la gomme aromatique et de la myrrhe[c], des pistaches et des amandes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelques-uns des plus beaux produits du pays ». L’expression hébraïque désigne au sens large des productions choisies du pays, et pas seulement des fruits.
    reason: lexical_alternative
  - marker: b
    text: Dans certains contextes, le mot traduit par « miel » peut désigner un sirop sucré plutôt que du miel d’abeilles.
    reason: lexical_alternative
  - marker: c
    text: L’identification exacte des termes hébreux traduits par « gomme aromatique » et « myrrhe » est incertaine. Ils pourraient désigner diverses résines aromatiques, notamment la gomme adragante ou le ladanum.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: Israël, leur père
  rationale: Conserve le nom narratif « Israël » et sa mise en apposition avec « leur père », dans un ordre naturel en français.
- source_word: אִם כֵּן אֵפוֹא
  choice: Puisqu’il le faut
  rationale: Rend la concession résignée exprimée par l’idiome hébreu, plus fortement qu’un simple « s’il en est ainsi ».
- source_word: זֹאת עֲשׂוּ
  choice: faites ceci
  rationale: Reproduit directement et naturellement l’impératif hébreu.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: quelques-uns des meilleurs produits du pays
  rationale: Le terme désigne des productions choisies du pays sans se limiter nécessairement aux fruits.
- source_word: בִּכְלֵיכֶם
  choice: dans vos récipients
  rationale: Le mot hébreu est générique et ne permet pas de préciser s’il s’agit de sacs, de vases ou d’autres contenants.
- source_word: וְהוֹרִידוּ לָאִישׁ
  choice: apportez à cet homme
  rationale: Formulation idiomatique française qui exprime le transport jusqu’à l’homme déjà mentionné; le mouvement de descente vers l’Égypte reste implicite dans le contexte.
- source_word: מִנְחָה
  choice: un cadeau
  rationale: Dans ce contexte diplomatique, « cadeau » est naturel et évite la connotation cultuelle d’« offrande » ou la nuance politique plus forte de « tribut ».
- source_word: מְעַט צֳרִי
  choice: un peu de baume
  rationale: « Baume » est le terme français établi pour cette substance résineuse, souvent associée à Galaad.
- source_word: וּמְעַט דְּבַשׁ
  choice: un peu de miel
  rationale: « Miel » est le sens courant du terme, tout en signalant en note la possibilité d’un sirop sucré.
- source_word: נְכֹאת
  choice: gomme aromatique
  rationale: Le qualificatif « aromatique » évite le sens moderne de gomme à mâcher et laisse ouverte l’identification botanique incertaine.
- source_word: לֹט
  choice: myrrhe
  rationale: Retient une désignation traditionnelle et intelligible, tout en indiquant en note que l’identification exacte, notamment avec le ladanum, demeure incertaine.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: des pistaches et des amandes
  rationale: Désigne clairement en français moderne les deux fruits à coque mentionnés.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Puisqu’il le faut » restitue la résignation du père sans alourdir la phrase. L’énumération conserve le caractère concret du cadeau, tandis que les incertitudes botaniques sont reportées en notes.
