  text: וַ/יִּרְחַ֥ץ פָּנָ֖י/ו וַ/יֵּצֵ֑א וַ/יִּ֨תְאַפַּ֔ק וַ/יֹּ֖אמֶר שִׂ֥ימוּ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: fr
  text: 'Puis il se lava le visage, sortit, se maîtrisa et dit : « Servez le repas[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le pain » ; le mot hébreu peut désigner ici plus largement la nourriture ou le repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ פָּנָיו
  choice: il se lava le visage
  rationale: Le verbe רחץ signifie couramment « laver ». Après avoir pleuré à l’écart, Joseph se lave le visage avant de revenir. Le pluriel morphologique פָּנִים désigne idiomatiquement le visage d’une personne.
- source_word: וַיֵּצֵא
  choice: sortit
  rationale: Le verbe יצא exprime le fait de sortir. Le français « sortit » convient naturellement au retour de Joseph depuis la pièce où il s’était retiré.
- source_word: וַיִּתְאַפַּק
  choice: se maîtrisa
  rationale: La forme hitpael de אפק indique ici que Joseph contient de nouveau son émotion. « Se maîtrisa » restitue clairement cette idée d’effort sur soi, sans suggérer que son émotion a entièrement disparu.
- source_word: שִׂימוּ
  choice: Servez
  rationale: L’impératif signifie littéralement « mettez » ou « placez », mais, dans ce contexte de repas, il ordonne aux serviteurs d’apporter et de disposer ce qui va être mangé. « Servez » est l’expression française naturelle.
- source_word: לָחֶם
  choice: le repas
  rationale: לֶחֶם désigne littéralement le pain, mais peut aussi, par métonymie, désigner la nourriture ou le repas. Ici, « le repas » correspond à la scène du banquet tout en restant idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple conserve la dignité du récit écrit. La formulation suit étroitement la succession des actions en hébreu, tandis que « Servez le repas » rend idiomatiquement l’ordre donné dans le contexte.
