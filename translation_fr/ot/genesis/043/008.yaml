  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: fr
  text: 'Juda dit à Israël, son père : « Envoie le jeune homme[a] avec moi. Levons-nous et partons, afin que nous vivions et ne mourions pas, nous, toi et nos petits. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le garçon ». Le mot hébreu נַעַר peut désigner un garçon ou un jeune homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le waw consécutif fait avancer le récit. En français, le passé simple assure naturellement cette continuité sans qu’un « et » initial soit nécessaire.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: à Israël, son père
  rationale: Conserve le nom « Israël » donné par l’hébreu et explicite naturellement l’apposition.
- source_word: שִׁלְחָה
  choice: Envoie
  rationale: L’impératif exprime ici une demande directe et pressante; le hé paragogique n’exige pas de rendu distinct en français.
- source_word: הַנַּעַר
  choice: le jeune homme
  rationale: נַעַר peut désigner un jeune homme plutôt qu’un petit garçon; ce choix évite de donner une fausse indication sur l’âge de Benjamin tout en préservant la perspective familiale du passage.
- source_word: אִתִּי
  choice: avec moi
  rationale: Rend directement l’accompagnement personnel de Benjamin par Juda et la responsabilité que celui-ci assume.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: Levons-nous et partons
  rationale: Les deux cohortatifs appellent à une action commune immédiate. Cette formulation moderne et digne conserve la séquence des deux verbes.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: afin que nous vivions et ne mourions pas
  rationale: « Afin que » exprime la valeur de but ou de résultat de la démarche sans réduire la tension entre les deux possibilités énoncées.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: ni nous, ni toi, ni nos petits
  rationale: Après « ne mourions pas », la répétition de « ni » restitue idiomatiquement l’inclusion emphatique des trois groupes portée par גַּם.
- source_word: טַפֵּנוּ
  choice: nos petits
  rationale: טַף désigne les jeunes enfants ou les membres vulnérables à charge; « nos petits » conserve cette nuance affective et concrète.
theological_decisions: []
