  source_fidelity: Le projet rend correctement le hophal « a été rendu », l’insistance de « voici même », la perte de courage exprimée par l’image du cœur, le tremblement et la référence à Dieu. La finale « Qu’est-ce que Dieu nous a fait là ? » ajoute toutefois la particule discursive « là », absente de l’hébreu et inutilement familière.
