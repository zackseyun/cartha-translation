  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: fr
  text: 'Il dit à ses frères : « Mon argent m’a été rendu, et le voici même dans mon sac ! » Alors, le cœur leur manqua[a] ; ils tremblèrent et se dirent l’un à l’autre[b] : « Que nous a fait Dieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur cœur sortit » ; autre traduction possible : « leur courage les abandonna ».'
    reason: L’expression hébraïque est imagée et peut désigner une défaillance intérieure ou la perte du courage.
  - marker: b
    text: 'Littéralement : « chacun à son frère ».'
    reason: La note préserve la forme distributive et relationnelle précise de l’hébreu derrière la formulation française naturelle.
lexical_decisions:
- source_word: הוּשַׁב כַּסְפִּי
  choice: Mon argent m’a été rendu
  rationale: Le hophal de שׁוב exprime ici le retour subi de l’argent. « Argent » rend le sens monétaire naturel de כֶּסֶף en français, tandis que le pronom « m’ » explicite naturellement le bénéficiaire déjà contenu dans « mon argent ».
- source_word: וְגַם הִנֵּה
  choice: et le voici même
  rationale: « Voici » conserve la force déictique et soudaine de הִנֵּה, tandis que « même » rend l’insistance de גַּם.
- source_word: אַמְתַּחַת
  choice: sac
  rationale: Le terme désigne un contenant servant au transport des vivres ou du grain ; « sac » convient au cadre narratif et reste immédiatement compréhensible.
- source_word: וַיֵּצֵא לִבָּם
  choice: le cœur leur manqua
  rationale: Cette tournure française exprime la défaillance soudaine du courage tout en conservant l’image du cœur et le singulier collectif de l’hébreu.
- source_word: וַיֶּחֶרְדוּ
  choice: ils tremblèrent
  rationale: Le verbe חָרַד évoque un tremblement causé par la peur ou l’angoisse ; cette traduction en maintient à la fois la dimension physique et émotionnelle.
- source_word: אִישׁ אֶל אָחִיו
  choice: se dirent l’un à l’autre
  rationale: La tournure distributive hébraïque signifie que chacun s’adresse à son frère. Dans ce contexte où les interlocuteurs viennent d’être identifiés comme des frères, cette formulation française est naturelle sans effacer la relation fraternelle.
- source_word: מַה זֹּאת עָשָׂה אֱלֹהִים לָנוּ
  choice: Qu’est-ce que Dieu nous a fait là ?
  rationale: La question conserve l’exclamation directe מַה זֹּאת et attribue explicitement l’action à Dieu, sans la transformer en question causale avec « pourquoi ».
theological_decisions:
- issue: Référence de אֱלֹהִים dans la question angoissée des frères
  choice: Dieu
  alternative: un dieu / les dieux
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici Dieu au singulier selon la syntaxe et le contexte narratif. La traduction n’ajoute aucune explication à l’interprétation craintive que les frères donnent à l’événement.
- issue: Portée de אִישׁ אֶל אָחִיו
  choice: se dirent l’un à l’autre
  alternative: chacun dit à son frère
  rationale: Le choix principal rend naturellement la réciprocité distributive en français. La mention immédiatement précédente de « ses frères » maintient clairement le caractère masculin et fraternel du groupe.
translation_notes:
  register: Français international actuel, sobre et narratif. Le passé simple convient au récit biblique littéraire, tandis que le passé composé dans le discours direct exprime l’état nouvellement constaté. L’image du cœur est conservée sans recourir au calque obscur « leur cœur sortit ».
