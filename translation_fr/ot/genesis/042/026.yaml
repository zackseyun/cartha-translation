  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: fr
  text: Puis ils chargèrent leur grain sur leurs ânes et partirent de là[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs provisions » ou « le grain qu’ils avaient acheté ». Le terme hébreu peut désigner des vivres, mais, dans ce contexte, il renvoie très probablement au grain acquis en Égypte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: ils chargèrent
  rationale: Le verbe נשׂא signifie littéralement « lever, porter » ; avec des marchandises placées sur des animaux, « charger » exprime naturellement l’action en français.
- source_word: שִׁבְרָם
  choice: leur grain
  rationale: Dans le récit de Joseph, שֶׁבֶר désigne habituellement les céréales acquises en période de famine. « Leur grain » est précis et naturel, tout en conservant une note pour les sens plus larges possibles.
- source_word: עַל חֲמֹרֵיהֶם
  choice: sur leurs ânes
  rationale: Avec le verbe « charger », la préposition française « sur » indique naturellement le placement de la cargaison sur les ânes.
- source_word: וַיֵּלְכוּ
  choice: partirent
  rationale: הלך est un verbe courant de déplacement ; dans ce contexte, « partirent » rend clairement le départ sans lourdeur.
- source_word: מִשָּׁם
  choice: de là
  rationale: Rendu direct et idiomatique de l’expression déictique hébraïque.
