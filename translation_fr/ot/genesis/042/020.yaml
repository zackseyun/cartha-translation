  text: וְ/אֶת אֲחִי/כֶ֤ם הַ/קָּטֹן֙ תָּבִ֣יאוּ אֵלַ֔/י וְ/יֵאָמְנ֥וּ דִבְרֵי/כֶ֖ם וְ/לֹ֣א תָמ֑וּתוּ וַ/יַּעֲשׂוּ כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: fr
  text: Amenez-moi votre plus jeune frère, afin que vos paroles soient confirmées[a] et que vous ne mouriez pas. » Ils firent ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soient reconnues comme vraies » ou « soient crues ». Le verbe hébreu peut désigner ce qui est établi comme vrai ou accepté comme digne de foi ; ici, le contexte favorise l’idée de confirmation.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: votre plus jeune frère
  rationale: Dans ce contexte familial, הַקָּטֹן désigne le frère le plus jeune, Benjamin; cette formulation est naturelle et précise en français.
- source_word: תָּבִיאוּ אֵלַי
  choice: Amenez-moi
  rationale: Le hiphil de בוא signifie «amener»; le pronom «me» rend directement אֵלַי.
- source_word: וְיֵאָמְנוּ דִבְרֵיכֶם
  choice: afin que vos paroles soient confirmées
  rationale: Le niphal de אמן peut exprimer le fait d'être établi comme vrai ou reconnu comme digne de foi. «Soient confirmées» conserve cette nuance sans réduire le sens à une simple croyance subjective.
- source_word: וְלֹא תָמֻתוּ
  choice: et que vous ne mouriez pas
  rationale: Cette coordination exprime le résultat attendu de leur obéissance tout en maintenant la menace implicite de Joseph.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Ils firent ainsi
  rationale: Formule narrative concise qui rend fidèlement leur mise en conformité avec l'ordre donné.
theological_decisions: []
