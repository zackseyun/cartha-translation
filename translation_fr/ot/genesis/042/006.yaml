source:
  edition: WLC
  text: וְ/יוֹסֵ֗ף ה֚וּא הַ/שַּׁלִּ֣יט עַל הָ/אָ֔רֶץ ה֥וּא הַ/מַּשְׁבִּ֖יר לְ/כָל עַ֣ם הָ/אָ֑רֶץ וַ/יָּבֹ֨אוּ֙ אֲחֵ֣י יוֹסֵ֔ף וַ/יִּשְׁתַּֽחֲווּ ל֥/וֹ אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: fr
  text: Joseph était le dirigeant du pays ; c’était lui qui vendait du grain à toute la population du pays. Les frères de Joseph vinrent et se prosternèrent devant lui[a], le visage contre terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’inclinèrent profondément devant lui ». Le verbe hébreu peut désigner une profonde inclination ou une prosternation en signe d’hommage.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: le dirigeant
  rationale: Le terme désigne celui qui exerce l’autorité. « Le dirigeant » exprime le statut de Joseph sans lui attribuer un titre administratif plus précis que l’hébreu.
- source_word: עַל הָאָרֶץ
  choice: du pays
  rationale: Dans ce contexte, אֶרֶץ désigne le pays concerné, l’Égypte, et non la terre entière. Avec « dirigeant », le français idiomatique demande ici « du pays ».
- source_word: הַמַּשְׁבִּיר
  choice: celui qui vendait du grain
  rationale: Le participe hifil de שׁבר renvoie ici à la vente de céréales pendant la famine. L’objet implicite est explicité d’après le contexte immédiat.
- source_word: לְכָל עַם הָאָרֶץ
  choice: à toute la population du pays
  rationale: Le singulier collectif עַם désigne ici l’ensemble des habitants. « Toute la population » est naturel en français et évite l’ambiguïté possible de « tout le peuple ».
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: se prosternèrent devant lui
  rationale: Le verbe décrit une profonde inclination ou une prosternation marquant la soumission et l’hommage. La mention du visage contre terre favorise ici « se prosternèrent » sans introduire l’idée d’un culte rendu à Joseph.
- source_word: אַפַּיִם אָרְצָה
  choice: le visage contre terre
  rationale: Cette expression idiomatique décrit la posture physique complète. Le singulier collectif français est fluide et s’applique naturellement au groupe.
theological_decisions:
- issue: Nature du geste des frères envers Joseph
  choice: se prosternèrent devant lui
  alternative: s’inclinèrent profondément devant lui
  rationale: Le geste accomplit narrativement les rêves antérieurs de Joseph et exprime la soumission sociale. « Se prosternèrent » conserve toute la force physique du geste, tandis que le contexte ne permet pas de le qualifier de culte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste claire et narrative. Aucun « maintenant » ou autre marqueur temporel absent de l’hébreu n’a été ajouté en tête de verset. Le point-virgule préserve le lien étroit entre l’autorité de Joseph et son rôle dans la vente du grain.
