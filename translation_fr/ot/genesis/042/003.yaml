  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: fr
  text: Les dix frères de Joseph descendirent alors pour acheter du grain provenant d’Égypte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « acheter du grain en Égypte ». Littéralement, l’hébreu dit « acheter du grain d’Égypte », indiquant la provenance du grain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: descendirent
  rationale: Le verbe ירד signifie « descendre ». Ce choix conserve l’expression géographique courante employée pour un voyage vers l’Égypte et reste naturel en français.
- source_word: אֲחֵי יוֹסֵף
  choice: les frères de Joseph
  rationale: La construction hébraïque signifie directement « les frères de Joseph », formulation naturelle en français.
- source_word: עֲשָׂרָה
  choice: les dix frères
  rationale: Le nombre cardinal précise combien de frères partirent. En français, il se place naturellement devant le nom.
- source_word: לִשְׁבֹּר
  choice: acheter
  rationale: Dans ce récit de famine, שׁבר désigne l’action de se procurer du grain par achat. « Acheter » exprime clairement ce sens.
- source_word: בָּר
  choice: du grain
  rationale: בָּר désigne ici des céréales. « Du grain » est précis, courant et non ambigu en français moderne.
- source_word: מִמִּצְרָיִם
  choice: provenant d’Égypte
  rationale: La préposition מן marque normalement la provenance. Cette formulation préserve l’idée que le grain vient d’Égypte tout en évitant la tournure française potentiellement ambiguë « acheter du grain d’Égypte ».
