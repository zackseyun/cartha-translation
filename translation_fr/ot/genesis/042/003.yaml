  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : les dix frères de Joseph vont « descendre » afin d’acheter du grain, dont l’Égypte est la source. « Descendirent » conserve utilement l’idiome géographique du récit. Toutefois, « donc » introduit une déduction plus marquée que ne l’exige le waw narratif ; « alors » rend mieux la progression du récit. La note appelle aussi une légère correction : la formulation littérale française appropriée est « d’Égypte », non « depuis l’Égypte ».'
