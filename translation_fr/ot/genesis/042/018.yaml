  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: fr
  text: 'Le troisième jour, Joseph leur dit : « Faites ceci et vous vivrez[a], car je crains Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Faites ceci afin que vous viviez » ; l’hébreu peut exprimer soit un ordre suivi de sa conséquence, soit un résultat visé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: leur dit
  rationale: Le verbe אמר introduit ici le discours direct, et אֲלֵהֶם en indique les destinataires. « Leur dit » est la tournure française naturelle.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: Cette expression temporelle hébraïque se rend naturellement ainsi en français moderne.
- source_word: זֹאת עֲשׂוּ
  choice: Faites ceci
  rationale: Le démonstratif suivi de l’impératif exprime un ordre bref et direct.
- source_word: וִחְיוּ
  choice: et vous vivrez
  rationale: Après un impératif, cette forme peut indiquer une conséquence ou un résultat. Le futur français exprime naturellement la conséquence sans exclure la nuance finale.
- source_word: אֶת הָאֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte narratif, הָאֱלֹהִים désigne Dieu. Le français omet naturellement l’article.
- source_word: אֲנִי יָרֵא
  choice: car je crains
  rationale: Le pronom explicite et le participe prédicatif présentent cette crainte comme une disposition caractéristique de Joseph. « Car » marque le lien explicatif avec la mesure qu’il ordonne.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Portée de la déclaration אֶת הָאֱלֹהִים אֲנִי יָרֵא
  choice: Joseph affirme qu’il craint Dieu, ce qui motive la conduite qu’il propose.
  alternative: Joseph ferait référence de manière générique au respect d’une divinité dans un cadre égyptien.
  rationale: Le contexte de la Genèse présente Joseph en relation avec le Dieu de ses pères. La traduction « je crains Dieu » conserve cette portée sans ajouter d’explication doctrinale au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste concis, et l’ambiguïté fonctionnelle de וִחְיוּ est signalée en note.
