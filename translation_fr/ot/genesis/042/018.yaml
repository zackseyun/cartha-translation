  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֤ם יוֹסֵף֙ בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֔י זֹ֥את עֲשׂ֖וּ וִֽ/חְי֑וּ אֶת הָ/אֱלֹהִ֖ים אֲנִ֥י יָרֵֽא־׃
base_translation:
