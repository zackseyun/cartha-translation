  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: fr
  text: 'Et nous lui avons dit : « Nous sommes honnêtes[a] ; nous n’étions pas des espions[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « droits » ou « sincères ».'
