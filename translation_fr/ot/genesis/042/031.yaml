lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Et nous avons dit
  rationale: Le wayyiqtol de אמר fait progresser le récit. « Et nous avons dit » conserve simplement cet enchaînement narratif.
- source_word: אֵלָיו
  choice: lui
  rationale: La préposition אֶל avec le suffixe de troisième personne masculin singulier signifie directement « à lui » ; en français, le pronom indirect « lui » est naturel.
- source_word: כֵּנִים
  choice: honnêtes
  rationale: Dans ce contexte, כֵּנִים présente les frères comme des personnes sincères et dignes de confiance, par opposition à des espions. « Honnêtes » est naturel et n’ajoute pas le nom « hommes », absent de l’hébreu.
- source_word: אֲנָחְנוּ
  choice: nous
  rationale: Le pronom indépendant souligne le sujet. La formulation « Nous sommes honnêtes » rend cette insistance naturellement.
- source_word: לֹא הָיִינוּ
  choice: nous n’étions pas
  rationale: La négation de היה avec le participe exprime ici une identité ou une activité niée dans le passé. L’imparfait français conserve cette valeur sans la transformer en affirmation absolue avec « jamais ».
- source_word: מְרַגְּלִים
  choice: des espions
  rationale: Le participe de רגל désigne ici ceux qui exercent l’activité d’espionnage. Le nom « espions » est l’équivalent français courant.
