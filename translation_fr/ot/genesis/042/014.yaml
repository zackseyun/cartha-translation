  text: וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם יוֹסֵ֑ף ה֗וּא אֲשֶׁ֨ר דִּבַּ֧רְתִּי אֲלֵ/כֶ֛ם לֵ/אמֹ֖ר מְרַגְּלִ֥ים אַתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/014.yaml
  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
translation:
  language: fr
  text: 'Joseph leur dit : « C’est bien ce que je vous ai dit : “Vous êtes des espions.” »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le wayyiqtol narratif de אמר se rend naturellement en français par le passé simple « dit »; la conjonction initiale est intégrée au déroulement du récit.
- source_word: אֲלֵהֶם
  choice: leur
  rationale: 'Le pronom complément indirect rend directement la préposition et le suffixe pluriel : Joseph s’adresse à eux.'
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הוּא אֲשֶׁר
  choice: C’est bien ce que
  rationale: Cette tournure restitue la construction emphatique qui réaffirme les paroles antérieures de Joseph, sans la rendre artificiellement mot à mot.
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: je vous ai dit
  rationale: Dans ce contexte de discours cité, « dire à quelqu’un » est plus idiomatique que « parler à quelqu’un » tout en conservant le sens de דבר.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le deux-points remplit naturellement en français la fonction de l’infinitif introducteur de citation, sans reproduire le pléonasme hébraïque « dit en disant ».
- source_word: מְרַגְּלִים אַתֶּם
  choice: Vous êtes des espions
  rationale: Le participe de רגל désigne ici des personnes qui espionnent; la proposition nominale exige naturellement la copule « êtes » en français.
