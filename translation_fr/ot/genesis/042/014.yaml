translation_notes:
  register: Français international moderne, naturel et digne. L’emphase de הוּא אֲשֶׁר est conservée par « bien », tandis que לֵאמֹר est rendu selon sa fonction par les deux-points. Les guillemets français encadrent la parole principale et les guillemets doubles la citation interne.
