  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: fr
  text: Nous sommes douze frères, fils de notre père. L’un de nous est absent[a], et le plus jeune est aujourd’hui[b] avec notre père au pays de Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’un n’est pas ». Cette expression hébraïque peut indiquer qu’une personne est absente, disparue ou tenue pour morte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « est à présent avec notre père ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: Nous sommes douze frères
  rationale: La proposition nominale hébraïque est rendue par une phrase française naturelle avec « sommes »; « frères » désigne ici des frères au sens propre.
- source_word: בְּנֵי אָבִינוּ
  choice: fils de notre père
  rationale: Cette apposition conserve la formulation et l’insistance de l’hébreu sans ajouter « même », qui n’est pas exprimé.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: L’un de nous n’est plus
  rationale: L’expression idiomatique signale que le frère est absent, disparu ou tenu pour mort, sans préciser davantage son sort. « De nous » rend le référent clair en français.
- source_word: וְהַקָּטֹן
  choice: et le plus jeune
  rationale: Dans une fratrie, l’adjectif signifiant littéralement « le petit » ou « le jeune » désigne naturellement le plus jeune.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Le sens temporel direct est conservé, tout en signalant en note la nuance possible « à présent ».
- source_word: אֶת אָבִינוּ
  choice: avec notre père
  rationale: אֶת exprime ici l’accompagnement; « avec » est l’équivalent français naturel.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: au pays de Canaan
  rationale: Cette tournure française courante conserve explicitement le nom « pays/terre » présent dans l’hébreu.
theological_decisions:
- issue: Sort du frère absent
  choice: n’est plus
  alternative: n’est pas / a disparu / est mort
  rationale: 'La traduction préserve l’indétermination de l’idiome hébreu: les interlocuteurs présentent Joseph comme absent ou perdu sans que la formulation affirme explicitement sa mort.'
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; la note sur « n’est plus » préserve l’ambiguïté du texte source.
