  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו אֲבָל֮ אֲשֵׁמִ֣ים אֲנַחְנוּ֮ עַל אָחִי/נוּ֒ אֲשֶׁ֨ר רָאִ֜ינוּ צָרַ֥ת נַפְשׁ֛/וֹ בְּ/הִתְחַֽנְנ֥/וֹ אֵלֵ֖י/נוּ וְ/לֹ֣א שָׁמָ֑עְנוּ עַל כֵּן֙ בָּ֣אָה אֵלֵ֔י/נוּ הַ/צָּרָ֖ה הַ/זֹּֽאת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: fr
  text: 'Ils se dirent les uns aux autres : « Certes, nous sommes coupables envers notre frère. Nous avons vu sa profonde détresse[a] lorsqu’il nous suppliait, mais nous ne l’avons pas écouté. C’est pourquoi cette détresse[b] est venue sur nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la détresse de son âme », expression qui désigne ici une profonde angoisse personnelle.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le même mot pour la « détresse » de Joseph et celle que connaissent maintenant ses frères, reliant ainsi leur cruauté passée à leur souffrance présente.
    reason: literary_wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Ils se dirent les uns aux autres
  rationale: L’expression distributive hébraïque décrit une parole échangée entre les frères. Cette formulation française est naturelle et conserve la réciprocité.
- source_word: אֲבָל
  choice: Oui
  rationale: Ici, le terme introduit une reconnaissance appuyée plutôt qu’une opposition. « Oui » exprime naturellement l’aveu solennel en français moderne.
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: nous sommes coupables envers notre frère
  rationale: « Coupables » rend clairement la culpabilité reconnue, et « envers notre frère » conserve la relation marquée par עַל sans expliciter davantage la nature de la faute.
- source_word: צָרַת נַפְשׁוֹ
  choice: sa profonde détresse
  rationale: Littéralement « la détresse de son âme ». L’expression choisie transmet en français courant l’intensité de l’angoisse personnelle sans donner à « âme » un sens technique absent du contexte.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: lorsqu’il nous suppliait
  rationale: Le verbe exprime une supplication insistante. « Suppliait » en rend la force sans ajouter explicitement un objet comme « d’avoir pitié ».
- source_word: וְלֹא שָׁמָעְנוּ
  choice: mais nous ne l’avons pas écouté
  rationale: Dans ce contexte, שׁמע signifie entendre au sens de prêter attention et d’accéder à la demande. « Écouté » rend mieux cette portée que le simple fait d’entendre.
- source_word: עַל־כֵּן
  choice: C’est pourquoi
  rationale: Cette locution marque directement le lien de conséquence établi par les frères entre leur faute passée et leur épreuve présente.
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: cette détresse est venue sur nous
  rationale: La formulation garde l’image hébraïque d’une détresse qui vient sur eux et répète « détresse » afin de préserver l’écho lexical avec la souffrance de Joseph.
theological_decisions:
- issue: Lien entre la faute des frères et leur détresse présente
  choice: 'Conserver leur affirmation causale directe : « C’est pourquoi »'
  alternative: Atténuer en présentant ce lien comme une simple impression ou un pressentiment
  rationale: Le verset rapporte sans réserve l’interprétation que les frères donnent de leur situation. La traduction ne doit ni confirmer au-delà du récit un jugement divin explicite, ni affaiblir leur aveu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de l’hébreu, tandis que « sa profonde détresse » évite une tournure littérale potentiellement obscure. La répétition de « détresse » est volontaire afin de conserver l’écho lexical du texte source.
