lexical_decisions:
- source_word: וַיַּכֵּר
  choice: reconnut
  rationale: Le hifil de נכר signifie ici reconnaître une personne déjà connue. « Reconnut » est naturel en français et ouvre le contraste narratif.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֶת־אֶחָיו
  choice: ses frères
  rationale: Le pluriel masculin de אָח avec suffixe renvoie ici précisément aux frères de Joseph.
- source_word: וְהֵם
  choice: mais eux
  rationale: La conjonction ו introduit ici un contraste. Le pronom tonique « eux » rend l'opposition explicite et naturelle en français.
- source_word: לֹא הִכִּרֻהוּ
  choice: ne le reconnurent pas
  rationale: La reprise du verbe נכר est conservée afin de préserver le parallélisme et l'ironie narrative de l'hébreu.
