  naturalness: Le français est globalement naturel et d’un registre approprié. « Là où vous êtes gardés » peut toutefois évoquer une simple surveillance plutôt qu’une détention ; « pendant la famine » rend plus naturellement en français le rapport pratique entre le grain et la famine.
  terminology: « Honnêtes », « l’un de vos frères », « détenu » et « grain » sont des choix justes et modernes. « Maisonnées » est un bon équivalent de בתי־כם, plus proche que « familles » du cadre domestique sans se limiter au bâtiment.
