source:
  edition: WLC
  text: אִם כֵּנִ֣ים אַתֶּ֔ם אֲחִי/כֶ֣ם אֶחָ֔ד יֵאָסֵ֖ר בְּ/בֵ֣ית מִשְׁמַרְ/כֶ֑ם וְ/אַתֶּם֙ לְכ֣וּ הָבִ֔יאוּ שֶׁ֖בֶר רַעֲב֥וֹן בָּתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: fr
  text: Si vous êtes honnêtes[a], l’un de vos frères restera détenu, là où vous êtes retenus[b] ; quant à vous, allez rapporter du grain pour vos maisonnées pendant la famine[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si vous dites vrai ». L’adjectif hébreu peut qualifier des personnes vraies, sincères ou dignes de confiance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la maison de votre garde » ou « de votre détention ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, de façon condensée, « rapportez du grain [pour] la famine de vos maisons ». Le texte relie le grain, la famine et les maisonnées sans préciser davantage ce rapport.
    reason: source_ambiguity
lexical_decisions:
- source_word: כֵּנִים
  choice: honnêtes
  rationale: Dans cet interrogatoire, Joseph met à l’épreuve la véracité des frères. « Honnêtes » est naturel en français et peut désigner des hommes dignes de confiance, sans réduire entièrement le terme à la seule sincérité verbale.
- source_word: אֲחִיכֶם אֶחָד
  choice: l’un de vos frères
  rationale: 'Cette formulation française naturelle conserve le sens partitif : un seul membre du groupe doit rester.'
- source_word: יֵאָסֵר
  choice: soit détenu
  rationale: Le niphal de אסר peut signifier « être lié » ou « être emprisonné ». Le contexte d’un lieu de garde favorise le sens de détention sans imposer l’idée de liens matériels.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: là où vous êtes gardés
  rationale: Cette tournure exprime naturellement que le frère restera dans le lieu de détention où le groupe se trouve alors, sans supposer une institution carcérale moderne.
- source_word: וְאַתֶּם לְכוּ
  choice: Quant à vous, allez
  rationale: « Quant à vous » rend l’emphase portée par le pronom indépendant et marque le contraste entre le frère retenu et ceux qui repartiront.
- source_word: הָבִיאוּ
  choice: rapporter
  rationale: Dans la situation narrative, les frères doivent emporter d’Égypte le grain destiné à leur foyer. « Rapporter » explicite naturellement ce mouvement de retour impliqué par le contexte.
- source_word: שֶׁבֶר
  choice: du grain
  rationale: Dans le récit de Joseph, שֶׁבֶר désigne couramment le grain obtenu pendant la famine. « Grain » reste plus précis que « vivres » et moins spécifique que « blé ».
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: à vos familles qui souffrent de la famine
  rationale: La formulation restitue en français courant le besoin causé par la famine au sein des maisonnées, tout en conservant explicitement la notion de famine.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est divisée en deux pour éviter une coordination lourde. « Quant à vous » préserve le contraste emphatique de l’hébreu, tandis que les notes signalent les formulations plus littérales et les ambiguïtés lexicales.
