  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: fr
  text: 'Mais Jacob n’envoya pas Benjamin, le frère de Joseph, avec ses frères, car il disait : « Il pourrait lui arriver un malheur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: Mais
  rationale: La conjonction relie le verset au précédent tout en marquant le contraste entre le départ des autres fils et le fait que Benjamin reste auprès de Jacob. Le marqueur d’objet אֶת n’est pas traduit.
- source_word: בִּנְיָמִין
  choice: Benjamin
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: אֲחִי יוֹסֵף
  choice: le frère de Joseph
  rationale: Cette formulation naturelle rend fidèlement la chaîne construite et souligne le lien particulier entre Benjamin et Joseph.
- source_word: לֹא שָׁלַח
  choice: n’envoya pas
  rationale: Le passé simple convient au récit suivi et שׁלח signifie ici « envoyer ».
- source_word: אֶת אֶחָיו
  choice: avec ses frères
  rationale: Le contexte indique que Benjamin ne fut pas envoyé en compagnie de ses frères. La préposition « avec » explicite en français la relation implicite requise par le sens.
- source_word: כִּי אָמַר
  choice: car il se disait
  rationale: כִּי introduit la raison. Le verbe אָמַר signifie littéralement « dire » ; la forme pronominale française exprime naturellement les paroles que Jacob formule pour lui-même, sans les réduire à une simple pensée.
- source_word: פֶּן
  choice: Il pourrait
  rationale: Dans ce contexte, פֶּן introduit une éventualité redoutée. Une tournure au conditionnel est plus actuelle et naturelle en français que « de peur que », tout en conservant l’appréhension de Jacob.
- source_word: יִקְרָאֶנּוּ
  choice: lui arriver
  rationale: Avec אָסוֹן, le verbe forme l’expression idiomatique « qu’un malheur lui arrive ».
- source_word: אָסוֹן
  choice: un malheur
  rationale: Le terme désigne une atteinte grave, une catastrophe ou un événement funeste. « Un malheur » préserve cette largeur sémantique et correspond à l’usage français naturel.
