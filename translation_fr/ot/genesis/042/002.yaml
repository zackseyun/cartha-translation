  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: fr
  text: 'Il dit : « Voilà, j’ai appris qu’il y a du grain en Égypte. Descendez là-bas pour nous acheter du grain, afin que nous vivions et ne mourions pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voilà
  rationale: Particule qui attire l’attention sur l’information qui suit. « Voilà » en conserve la fonction dans un français moderne, sans recourir à l’archaïque « voici que ».
- source_word: שָׁמַעְתִּי
  choice: j’ai appris
  rationale: Dans ce contexte, le verbe désigne une information reçue et désormais connue. « J’ai appris » est plus naturel en français que le calque « j’ai entendu ».
- source_word: שֶׁבֶר
  choice: du grain
  rationale: Dans le contexte de la famine, le nom désigne des céréales disponibles à l’achat, plutôt que la nourriture en général.
- source_word: רְדוּ
  choice: Descendez
  rationale: Conserve le mouvement descendant exprimé en hébreu pour le trajet de Canaan vers l’Égypte.
- source_word: שָׁמָּה
  choice: là-bas
  rationale: Rend naturellement l’adverbe directionnel indiquant le déplacement vers l’Égypte.
- source_word: וְשִׁבְרוּ
  choice: achetez… du grain
  rationale: Dans cet emploi commercial, le verbe signifie précisément acheter des céréales. La répétition de « grain » reste claire et naturelle en français.
- source_word: לָנוּ
  choice: nous
  rationale: Le pronom datif de « achetez-nous » exprime naturellement que l’achat doit être fait pour Jacob et sa maisonnée.
- source_word: מִשָּׁם
  choice: y
  rationale: Dans « achetez-nous-y du grain », le pronom renvoie au lieu indiqué et rend idiomatiquement l’idée de s’en procurer là-bas, sans alourdir la phrase par « de là-bas ».
- source_word: וְנִחְיֶה
  choice: afin que nous vivions
  rationale: La tournure finale exprime le but ou le résultat recherché par cet achat.
- source_word: וְלֹא נָמוּת
  choice: et ne mourions pas
  rationale: Préserve le parallélisme hébreu entre vivre et ne pas mourir, ainsi que l’urgence de la situation.
