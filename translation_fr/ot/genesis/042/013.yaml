source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: fr
  text: 'Ils dirent : « Nous, tes serviteurs, sommes douze frères, fils d’un même homme au pays de Canaan. Voici, le plus jeune est aujourd’hui avec notre père, et l’un de nous n’est plus[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et l’un n’est pas ». Cette expression euphémique peut signifier qu’il a disparu ou laisser entendre qu’il est mort.'
    reason: Préciser le sens littéral et préserver l’ambiguïté lexicale de l’hébreu.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Ils répondirent
  rationale: Dans cet échange, le verbe introduit leur réponse à Joseph. Le passé simple maintient un registre narratif digne et naturel en français.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Il s’agit ici d’une formule de déférence adressée à un haut dignitaire, non d’une affirmation de servitude juridique.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: Nous ... sommes douze frères
  rationale: Cette formulation française naturelle conserve à la fois le nombre et le lien fraternel exprimés par l’hébreu.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: fils d’un même homme
  rationale: Le masculin précis de l’hébreu est conservé; « un même homme » exprime idiomatiquement qu’ils ont le même père.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: au pays de Canaan
  rationale: Conserve le substantif אֶרֶץ tout en employant une tournure française courante.
- source_word: וְהִנֵּה
  choice: Voici
  rationale: Marque naturellement en français la présentation d’un fait pertinent, sans la lourdeur archaïsante de « voici que ».
- source_word: הַקָּטֹן
  choice: le plus jeune
  rationale: Dans ce contexte familial, le terme désigne le benjamin plutôt qu’une personne simplement petite.
- source_word: אֶת אָבִינוּ
  choice: avec notre père
  rationale: אֶת exprime ici l’accompagnement; « avec » en donne directement le sens.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Rend directement l’indication temporelle du texte hébreu.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: et l’un de nous n’est plus
  rationale: La formulation conserve l’euphémisme et l’ambiguïté de l’hébreu, qui affirme littéralement que l’un « n’est pas », sans déclarer explicitement sa mort.
theological_decisions:
- issue: Langage de parenté genré
  choice: fils d’un même homme
  alternative: enfants d’un même homme
  rationale: Le texte hébreu est explicitement masculin et vise ici les fils de Jacob; la traduction ne neutralise donc pas ce trait.
- issue: Statut ambigu de Joseph dans אֵינֶנּוּ
  choice: l’un de nous n’est plus
  alternative: l’un de nous est mort
  rationale: Les frères parlent de sa disparition d’une manière euphémique. La traduction préserve cette tension narrative au lieu de préciser qu’il serait mort.
translation_notes:
  register: Français international moderne, narratif et digne. Tutoiement cohérent avec le singulier hébreu adressé à Joseph. « Voici » conserve la fonction présentative de הִנֵּה sans archaïsme excessif.
