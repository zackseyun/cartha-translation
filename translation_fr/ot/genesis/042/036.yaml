  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יַעֲקֹ֣ב אֲבִי/הֶ֔ם אֹתִ֖/י שִׁכַּלְתֶּ֑ם יוֹסֵ֤ף אֵינֶ֨/נּוּ֙ וְ/שִׁמְע֣וֹן אֵינֶ֔/נּוּ וְ/אֶת בִּנְיָמִ֣ן תִּקָּ֔חוּ עָלַ֖/י הָי֥וּ כֻלָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: fr
  text: 'Jacob, leur père, leur dit : « Vous m’avez privé de mes enfants : Joseph n’est plus là, Siméon n’est plus là, et vous voulez prendre Benjamin ! Tout cela est contre moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: vous me privez de mes enfants
  rationale: Le piel de שׁכל exprime le fait de causer la perte d’enfants ou de rendre sans enfants. Cette formulation française naturelle conserve l’accusation adressée aux fils et explicite l’objet sous-entendu par le verbe.
- source_word: אֵינֶנּוּ
  choice: n’est plus là
  rationale: Dans ce contexte, l’expression marque l’absence douloureuse sans affirmer à elle seule la mort; « n’est plus là » convient aussi bien à Joseph qu’à Siméon.
- source_word: תִּקָּחוּ
  choice: vous voulez prendre
  rationale: L’imparfait hébreu renvoie ici à l’action envisagée par les fils. « Vous voulez prendre » rend naturellement la protestation de Jacob sans transformer le propos en simple prédiction.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: Tout cela retombe sur moi
  rationale: La formule rend la totalité cumulative exprimée par כֻלָּנָה et la charge adverse portée par עָלַי, dans un français actuel et expressif.
- source_word: אֹתִי
  choice: me
  rationale: Le pronom est conservé à la place saillante qu’exige naturellement le français dans « vous me privez », maintenant Jacob comme victime mise en avant.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Jacob, leur père
  rationale: Cette apposition respecte les deux éléments de l’hébreu tout en donnant une phrase française fluide et digne.
