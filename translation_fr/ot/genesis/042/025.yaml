  naturalness: 'La formulation révisée est plus fluide en français international moderne : « remplir leurs récipients de grain » évite l’ordre des compléments, un peu lourd, de la version proposée. Le tour « Joseph ordonna qu’on… » rend naturellement la série d’instructions.'
  terminology: « Récipients », « grain », « argent », « sac » et « provisions pour le voyage » sont précis et adaptés au registre narratif. La note proposant « ustensiles » est remplacée, car ce mot suggère trop facilement des instruments plutôt que des contenants dans ce contexte. La note sur la préposition est reformulée pour ne pas présenter « vers » comme une équivalence littérale française satisfaisante.
