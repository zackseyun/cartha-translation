  text: וַ/יְצַ֣ו יוֹסֵ֗ף וַ/יְמַלְא֣וּ אֶת כְּלֵי/הֶם֮ בָּר֒ וּ/לְ/הָשִׁ֤יב כַּסְפֵּי/הֶם֙ אִ֣ישׁ אֶל שַׂקּ֔/וֹ וְ/לָ/תֵ֥ת לָ/הֶ֛ם צֵדָ֖ה לַ/דָּ֑רֶךְ וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: fr
  text: Joseph ordonna qu’on remplisse leurs récipients[a] de grain, qu’on remette l’argent de chacun dans son sac[b] et qu’on leur donne des provisions pour le voyage. Et l’on fit ainsi pour eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs contenants » ; le terme hébreu est général et diffère du mot traduit ensuite par « sac ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu exprime le mouvement de l’argent de chacun vers son sac ; le contexte justifie « dans son sac ».
    reason: translation_clarity
  - marker: c
    text: Ou « Et il fit ainsi pour eux ». Le sujet du verbe hébreu n’est pas exprimé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: donna l’ordre
  rationale: Le verbe צוה exprime un commandement ou un ordre. Cette formulation est naturelle en français et introduit clairement les infinitifs qui suivent.
- source_word: כְּלֵיהֶם
  choice: leurs récipients
  rationale: כְּלִי est un terme général désignant un objet ou récipient. « Récipients » préserve la distinction avec שַׂק, rendu plus loin par « sac ».
- source_word: בָּר
  choice: grain
  rationale: Dans le contexte de la famine et des réserves égyptiennes, בָּר désigne des céréales, sans permettre de préciser qu’il s’agit exclusivement de blé.
- source_word: וּלְהָשִׁיב כַּסְפֵּיהֶם
  choice: de remettre l’argent de chacun
  rationale: כֶּסֶף signifie littéralement « argent » au sens du métal et, par extension, de la monnaie. Le français « argent » conserve naturellement les deux valeurs.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: de chacun dans son sac
  rationale: אִישׁ a ici une valeur distributive, « chacun », et שַׂק désigne précisément un sac. « Dans » rend naturellement le mouvement vers l’intérieur impliqué par le contexte.
- source_word: וְלָתֵת לָהֶם צֵדָה לַדָּרֶךְ
  choice: et de leur donner des provisions pour le voyage
  rationale: צֵדָה désigne les vivres ou provisions emportés en route. La formulation est actuelle, claire et digne.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Et l’on fit ainsi pour eux
  rationale: Le verbe singulier a un sujet non exprimé. Le pronom indéfini « on » préserve cette indétermination sans attribuer explicitement l’exécution à Joseph.
theological_decisions: []
translation_notes:
  register: Français international moderne, au registre narratif digne et accessible. La distinction lexicale entre le terme général כְּלִי (« récipient ») et שַׂק (« sac ») est conservée. La conclusion emploie « on » afin de ne pas préciser abusivement l’agent du verbe hébreu.
