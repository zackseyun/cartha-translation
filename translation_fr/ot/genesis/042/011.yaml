  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: fr
  text: Nous sommes tous fils d’un même homme. Nous sommes honnêtes[a] ; tes serviteurs n’ont pas été des espions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « droits », « sincères » ou « dignes de confiance ». Le mot hébreu les présente comme des personnes fiables et sincères, par opposition à l’accusation d’espionnage.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « tes serviteurs ne sont pas des espions » ou « tes serviteurs n’étaient pas des espions ». La construction hébraïque permet plusieurs formulations naturelles en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: nous sommes tous
  rationale: Exprime la totalité du groupe ; cette place de « tous » est naturelle en français tout en conservant l’accent du texte hébreu.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: fils d’un même homme
  rationale: Le texte dit littéralement « fils d’un homme unique ». « D’un même homme » exprime naturellement qu’ils ont tous le même père, tout en conservant le masculin explicite.
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: nous sommes
  rationale: Les pronoms indépendants sont emphatiques. Le français exige ici le verbe « être » ; la répétition de « nous » demeure perceptible dans les deux propositions.
- source_word: כֵּנִים
  choice: honnêtes
  rationale: Dans cette défense contre l’accusation d’espionnage, le terme présente les frères comme sincères, droits et dignes de confiance. « Honnêtes » est clair, courant et n’ajoute pas le substantif « hommes », absent de l’hébreu.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Il s’agit ici d’une manière déférente de parler de soi devant un dirigeant, sans insister sur une condition servile ; « serviteurs » convient donc mieux qu’« esclaves ».
- source_word: מְרַגְּלִים
  choice: espions
  rationale: Dans le contexte, le participe désigne des personnes venues espionner le pays, et non de simples éclaireurs.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: n’ont pas été des espions
  rationale: La construction avec היה et le participe nie qu’ils aient eu le statut ou l’activité d’espions. Le passé composé rend la formulation naturellement sans imposer « jamais », qui n’est pas exprimé explicitement.
