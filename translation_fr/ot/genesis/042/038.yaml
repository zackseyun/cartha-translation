  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: fr
  text: 'Mais il dit : « Mon fils ne descendra pas avec vous, car son frère est mort, et lui seul reste. S’il lui arrivait un malheur[a] sur le chemin que vous allez prendre, vous feriez descendre mes cheveux blancs au shéol[b] dans le chagrin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si un désastre lui arrivait ».'
    reason: lexical_alternative
  - marker: b
    text: Le shéol est le terme hébreu désignant le séjour des morts ; selon le contexte, on peut aussi traduire par « la tombe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: ne descendra pas
  rationale: Le verbe ירד signifie littéralement « descendre » et désigne régulièrement, dans la Genèse, le déplacement de Canaan vers l’Égypte.
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: lui seul reste
  rationale: Cette formulation conserve l’insistance de לְבַדּוֹ et exprime que Benjamin est, aux yeux de Jacob, le seul fils de Rachel qui lui reste.
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: s’il lui arrivait un malheur
  rationale: La proposition a ici une valeur conditionnelle. אָסוֹן désigne un malheur grave, un accident ou une catastrophe, sans en préciser la nature.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: sur le chemin que vous allez prendre
  rationale: Cette tournure française naturelle conserve l’image concrète du chemin et l’idée du trajet à venir.
- source_word: וְהוֹרַדְתֶּם
  choice: vous feriez descendre
  rationale: Le hiphil de ירד signifie « faire descendre ». Le conditionnel exprime la conséquence du malheur envisagé.
- source_word: שֵׂיבָתִי
  choice: mes cheveux blancs
  rationale: Le rendu concret préserve l’image hébraïque de la vieillesse plutôt que de la remplacer par l’abstraction « ma vieillesse ».
- source_word: בְּיָגוֹן
  choice: dans le chagrin
  rationale: יגון désigne une profonde peine; « dans le chagrin » maintient le lien entre l’état de Jacob et sa descente au shéol.
- source_word: שְׁאֹלָה
  choice: au shéol
  rationale: La translittération garde la portée du terme hébreu, qui peut évoquer le monde des morts sans se réduire nécessairement à une tombe physique.
theological_decisions:
- issue: Traduction de שְׁאֹל
  choice: au shéol
  alternative: dans le séjour des morts / dans la tombe
  rationale: Conserver « shéol » évite de trancher entre la tombe et le domaine des morts, tout en permettant une explication accessible en note.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve les images fortes de l’hébreu (« descendre », « cheveux blancs », « shéol ») tout en formulant naturellement la condition et le trajet.
