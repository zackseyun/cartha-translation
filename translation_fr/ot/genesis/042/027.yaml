- from: 'Alors l’un d’eux ouvrit son sac pour donner du fourrage à son âne, au lieu où ils passaient la nuit[a]. Il vit son argent[b] : et voici qu’il était à l’ouverture de sa besace.'
  to: Alors l’un d’eux ouvrit son sac pour donner du fourrage à son âne, à l’étape[a]. Il vit son argent[b], et voici qu’il se trouvait à l’ouverture de sa besace.
  rationale: La révision resserre le rendu de « lieu de halte » et améliore la syntaxe française, tout en conservant les distinctions lexicales entre le sac et la besace, la découverte de l’argent et la force de surprise du récit. Les ancres de notes sont placées sur les expressions qu’elles éclairent.
