base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: fr
  text: Alors l’un d’eux ouvrit son sac pour donner du fourrage à son âne, à l’étape[a]. Il vit son argent[b], et voici qu’il se trouvait à l’ouverture de sa besace.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au lieu où ils passaient la nuit ».
    reason: lexical_alternative
  - marker: b
    text: L’« argent » désigne ici la somme qu’il avait payée.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: ouvrit
  rationale: 'Le verbe פתח a ici son sens narratif courant : ouvrir.'
- source_word: הָאֶחָד
  choice: l’un d’eux
  rationale: Littéralement « l’un » ; le complément « d’eux » explicite naturellement qu’il s’agit de l’un des frères.
- source_word: שַׂקּוֹ
  choice: son sac
  rationale: שַׂק désigne couramment un sac, ici utilisé pour transporter les provisions.
- source_word: לָתֵת מִסְפּוֹא
  choice: pour donner du fourrage
  rationale: מִסְפּוֹא désigne la nourriture destinée aux animaux ; « fourrage » convient au contexte du voyage.
- source_word: לַחֲמֹרוֹ
  choice: à son âne
  rationale: Le lamed marque ici le destinataire de la nourriture.
- source_word: בַּמָּלוֹן
  choice: au lieu où ils passaient la nuit
  rationale: מָלוֹן désigne un lieu d’étape ou d’hébergement, sans nécessairement évoquer une auberge commerciale.
- source_word: וַיַּרְא אֶת־כַּסְפּוֹ
  choice: Il vit son argent
  rationale: כֶּסֶף signifie « argent » au sens du métal comme au sens monétaire ; dans ce contexte, il s’agit de la somme versée pour le grain.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: La formule signale une découverte soudaine et surprenante ; « voici que » en conserve la force narrative.
- source_word: בְּפִי
  choice: à l’ouverture de
  rationale: Littéralement « à la bouche de » ; en parlant d’un contenant, le français naturel emploie « à l’ouverture de ».
- source_word: אַמְתַּחְתּוֹ
  choice: sa besace
  rationale: Ce terme désigne un contenant et se distingue de שַׂק dans le verset ; « besace » maintient cette distinction sans suggérer un petit porte-monnaie.
theological_decisions: []
translation_notes:
  register: Français international actuel, narratif et digne. La tournure « au lieu où ils passaient la nuit » évite l’anachronisme possible d’« auberge ». « Et voici que » préserve l’effet de surprise de l’hébreu, tandis que « à l’ouverture » rend naturellement son image idiomatique.
