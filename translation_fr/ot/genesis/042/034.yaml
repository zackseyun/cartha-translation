source:
  edition: WLC
  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: fr
  text: Ramenez-moi votre plus jeune frère, afin que je sache que vous n’êtes pas des espions, mais des hommes honnêtes. Alors je vous rendrai votre frère, et vous pourrez faire du commerce dans le pays[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « circuler dans le pays ». Le verbe hébreu peut désigner plus largement le fait de parcourir un territoire, mais son sens commercial convient bien au contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: Ramenez-moi
  rationale: L’impératif hiphil de בוא demande de faire venir le frère auprès du locuteur. « Ramenez-moi » est naturel dans le récit et intègre אֵלַי sans alourdir la phrase.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: votre plus jeune frère
  rationale: Dans ce contexte familial, הַקָּטֹן désigne naturellement le plus jeune des frères plutôt qu’un frère de petite taille.
- source_word: וְאֵדְעָה
  choice: afin que je sache
  rationale: Le cohortatif exprime ici le but ou le résultat attendu de l’ordre précédent; cette tournure française rend clairement ce lien.
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם
  choice: que vous n’êtes pas des espions
  rationale: מְרַגְּלִים désigne ici des espions; la construction attributive est directe et idiomatique en français.
- source_word: כִּי כֵנִים אַתֶּם
  choice: mais des hommes honnêtes
  rationale: כֵנִים qualifie des personnes fiables, sincères ou honnêtes. « Hommes honnêtes » conserve le contraste avec « espions » et la référence masculine plurielle.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: je vous rendrai votre frère
  rationale: Le contexte montre qu’il s’agit du frère retenu. « Rendre » exprime naturellement la restitution implicite dans l’hébreu.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: vous pourrez faire du commerce dans le pays
  rationale: סחר a couramment un sens commercial. Dans le contexte de la famine et de l’achat de grain, « faire du commerce » convient mieux, tout en signalant en note le sens plus large possible.
