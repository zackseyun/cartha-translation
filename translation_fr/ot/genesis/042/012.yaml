  text: וַ/יֹּ֖אמֶר אֲלֵ/הֶ֑ם לֹ֕א כִּֽי עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶ֥ם לִ/רְאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: fr
  text: 'Mais il leur dit : « Non ! C’est la nudité du pays[a] que vous êtes venus voir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les parties exposées ou sans défense du pays ». L’hébreu dit littéralement « la nudité du pays », métaphore désignant des zones vulnérables que des envahisseurs ou des espions pourraient exploiter.
    reason: lexical_alternative
  - marker: b
    text: Ou « espionner ». Le verbe hébreu signifie littéralement « voir », mais, dans ce contexte, Joseph les accuse d’effectuer une reconnaissance du pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Mais il leur dit
  rationale: Le waw narratif fait progresser le récit, tandis que « mais » rend ici l’opposition à leur dénégation du verset précédent. « Leur dit » exprime naturellement le destinataire indiqué par אֲלֵהֶם.
- source_word: לֹא כִּי
  choice: Non ! C’est… que
  rationale: לֹא rejette vigoureusement leur affirmation, et כִּי introduit l’accusation qui la corrige. La phrase clivée française rend cette correction avec naturel sans alourdir le texte par un « car » ambigu.
- source_word: עֶרְוַת הָאָרֶץ
  choice: la nudité du pays
  rationale: Le texte hébreu dit littéralement « la nudité du pays », image désignant ses zones exposées ou vulnérables. Le maintien de la métaphore préserve la force et l’ambiguïté du texte source.
- source_word: בָּאתֶם
  choice: vous êtes venus
  rationale: Le passé composé convient au parfait hébreu dans ce discours, puisque leur venue passée demeure directement pertinente au moment de l’accusation.
- source_word: לִרְאוֹת
  choice: voir
  rationale: L’infinitif de ראה signifie littéralement « voir ». Le contexte évoque une mission d’espionnage, mais le verset n’emploie pas le verbe hébreu habituel pour « espionner » ; la traduction conserve donc le terme général.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La phrase clivée met en relief l’objet de l’accusation et rend le mouvement correctif de לֹא כִּי. La métaphore concrète de la « nudité » est conservée dans le texte principal et explicitée en note.
