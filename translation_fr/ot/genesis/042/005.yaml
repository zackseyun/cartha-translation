  text: וַ/יָּבֹ֨אוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/שְׁבֹּ֖ר בְּ/ת֣וֹךְ הַ/בָּאִ֑ים כִּֽי הָיָ֥ה הָ/רָעָ֖ב בְּ/אֶ֥רֶץ כְּנָֽעַן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: fr
  text: Les fils d’Israël vinrent donc acheter du grain[a] parmi ceux qui arrivaient, car la famine sévissait dans le pays de Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou simplement « acheter » ; le verbe hébreu n’exprime pas ici l’objet, mais le contexte de famine indique qu’il s’agit d’acheter du grain ou de la nourriture.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: vinrent
  rationale: Le verbe בוא fait progresser le récit et présente ici l’arrivée en Égypte; « vinrent » conserve ce point de vue.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  rationale: Dans ce contexte immédiat, l’expression désigne précisément les fils de Jacob, et non l’ensemble du peuple d’Israël.
- source_word: לִשְׁבֹּר
  choice: acheter du grain
  rationale: Le verbe signifie fondamentalement « acheter », mais, dans le récit de la famine, son objet implicite est le grain ou la nourriture.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: parmi ceux qui arrivaient
  rationale: Cette formulation rend à la fois l’idée d’appartenir à un groupe et le participe « ceux qui arrivent », sans effacer la répétition conceptuelle présente en hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de leur venue; « car » convient au registre narratif et reste limpide.
- source_word: הָיָה הָרָעָב
  choice: la famine sévissait
  rationale: Cette tournure française naturelle exprime l’état durable et pénible de la famine connue dans le récit.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: dans le pays de Canaan
  rationale: La formulation conserve l’expression géographique concrète de l’hébreu.
