  text: וַ/יֹּ֣אמֶר אֵלֵ֗י/נוּ הָ/אִישׁ֙ אֲדֹנֵ֣י הָ/אָ֔רֶץ בְּ/זֹ֣את אֵדַ֔ע כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֲחִי/כֶ֤ם הָֽ/אֶחָד֙ הַנִּ֣יחוּ אִתִּ֔/י וְ/אֶת רַעֲב֥וֹן בָּתֵּי/כֶ֖ם קְח֥וּ וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: fr
  text: 'Alors l’homme, le maître du pays, nous a dit : « Voici comment je saurai si vous êtes honnêtes : laissez auprès de moi l’un de vos frères, prenez de quoi nourrir vos familles pendant la famine[a], et partez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prenez la famine de vos maisons ». Il s’agit de prendre les vivres nécessaires aux familles touchées par la famine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: l’homme, le maître du pays
  rationale: Le premier groupe nominal désigne simplement « l’homme », et le second précise en apposition son autorité sur le pays. « Maître du pays » est naturel en français et n’implique pas ici une relation servile.
- source_word: בְּזֹאת
  choice: Voici comment
  rationale: La préposition avec le démonstratif introduit le moyen ou le critère qui permettra de vérifier leur honnêteté. « Voici comment » exprime clairement cette fonction en français courant.
- source_word: אֵדַע
  choice: je saurai
  rationale: L’imparfait hébreu a ici une valeur future, le constat dépendant de l’exécution de l’ordre donné.
- source_word: כֵנִים
  choice: honnêtes
  rationale: Dans ce récit, le terme caractérise des hommes francs et dignes de confiance, par opposition à des espions. « Honnêtes » rend naturellement cette portée.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: l’un de vos frères
  rationale: L’expression désigne un frère choisi parmi le groupe ; cette formulation est l’équivalent idiomatique français.
- source_word: הַנִּיחוּ אִתִּי
  choice: laissez auprès de moi
  rationale: Le hiphil de נוח signifie ici faire rester ou laisser sur place. « Auprès de moi » convient au registre narratif et évite une tournure ambiguë.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: de quoi nourrir vos familles pendant la famine
  rationale: L’hébreu dit littéralement de « prendre la famine de vos maisons », ellipse désignant ce qui est nécessaire pour faire face à la famine. Le contexte indique des vivres, notamment du grain, destinés aux maisonnées.
- source_word: קְחוּ וָלֵכוּ
  choice: prenez… et partez
  rationale: Les deux impératifs simples sont conservés, avec la coordination et l’ordre de l’hébreu.
