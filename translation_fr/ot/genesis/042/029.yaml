  text: וַ/יָּבֹ֛אוּ אֶל יַעֲקֹ֥ב אֲבִי/הֶ֖ם אַ֣רְצָ/ה כְּנָ֑עַן וַ/יַּגִּ֣ידוּ ל֔/וֹ אֵ֛ת כָּל הַ/קֹּרֹ֥ת אֹתָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/029.yaml
  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: fr
  text: 'Ils arrivèrent chez Jacob, leur père, au pays de Canaan, et lui racontèrent tout ce qui leur était arrivé, en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Ils arrivèrent
  rationale: Le wayyiqtol de בוא fait progresser le récit. Le passé simple convient au registre narratif français et exprime naturellement leur arrivée.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: auprès de leur père Jacob
  rationale: אֶל marque la destination. « Auprès de » évite la tournure peu naturelle « arrivèrent à Jacob », tandis que l’ordre « leur père Jacob » est idiomatique en français.
- source_word: אַרְצָה כְּנָעַן
  choice: au pays de Canaan
  rationale: La terminaison directionnelle de אַרְצָה indique un mouvement vers le pays de Canaan. Après « arrivèrent auprès de », le complément géographique se rend naturellement par « au pays de Canaan » et peut désigner à la fois le lieu atteint et le cadre où se trouve Jacob.
- source_word: וַיַּגִּידוּ לוֹ
  choice: et lui racontèrent
  rationale: Le hiphil de נגד signifie annoncer, rapporter ou raconter. Ici, les frères font à Jacob le récit des événements; « racontèrent » est naturel et précis.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: tout ce qui leur était arrivé
  rationale: La forme de קרה désigne ce qui est survenu ou les événements qui ont touché quelqu’un. Cette formulation française restitue l’ensemble des faits antérieurs.
- source_word: לֵאמֹר
  choice: 'Ils dirent :'
  rationale: L’infinitif introduit le discours direct qui suit. Une nouvelle phrase avec deux-points est plus naturelle en français que le calque « disant ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif biblique naturel sans archaïsme. Aucun appel de note n’est nécessaire, puisque la syntaxe française rend convenablement la double indication de destination du texte hébreu.
