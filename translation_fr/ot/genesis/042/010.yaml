  text: וַ/יֹּאמְר֥וּ אֵלָ֖י/ו לֹ֣א אֲדֹנִ֑/י וַ/עֲבָדֶ֥י/ךָ בָּ֖אוּ לִ/שְׁבָּר אֹֽכֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: fr
  text: 'Mais ils lui répondirent : « Non, mon seigneur ! Tes serviteurs sont venus acheter de la nourriture[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du grain ». Le mot hébreu signifie « nourriture », mais, dans le contexte de la famine, il s’agit probablement de céréales.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Mais ils lui répondirent
  rationale: La construction fait progresser le récit tout en introduisant une réplique qui contredit directement l’accusation de Joseph. « Répondirent » exprime naturellement en français la fonction contextuelle de « dirent à lui ».
- source_word: לֹא
  choice: Non
  rationale: La négation constitue ici un refus direct et appuyé de l’accusation précédente.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Cette formule respectueuse maintient la forte déférence des frères envers le haut fonctionnaire égyptien sans suggérer que Joseph serait littéralement leur propriétaire.
- source_word: וַעֲבָדֶיךָ
  choice: Tes serviteurs
  rationale: Dans cette formule de courtoisie hiérarchique, עֶבֶד exprime une position humble plutôt qu’un statut explicite d’esclave.
- source_word: בָּאוּ
  choice: sont venus
  rationale: 'Le passé composé convient au dialogue moderne et souligne le résultat présent de leur venue : ils se trouvent devant Joseph dans ce but.'
- source_word: לִשְׁבָּר
  choice: acheter
  rationale: Dans le contexte du ravitaillement pendant la famine, le verbe désigne l’acquisition de denrées contre paiement.
- source_word: אֹכֶל
  choice: de la nourriture
  rationale: Le mot hébreu désigne largement ce qui se mange. Le contexte évoque probablement des céréales, mais le texte ne les nomme pas explicitement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement hiérarchique (« tes serviteurs ») suit la forme singulière de l’hébreu et conserve la déférence de la scène. L’exclamation après « mon seigneur » rend le démenti pressant sans ajouter de contenu.
