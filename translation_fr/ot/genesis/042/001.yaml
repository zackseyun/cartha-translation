  text: וַ/יַּ֣רְא יַעֲקֹ֔ב כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם וַ/יֹּ֤אמֶר יַעֲקֹב֙ לְ/בָנָ֔י/ו לָ֖/מָּה תִּתְרָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: fr
  text: 'Quand Jacob vit qu’il y avait du grain en Égypte, il dit à ses fils : « Pourquoi vous regardez-vous les uns les autres[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi vous montrez-vous ? » Le verbe hébreu peut être compris de plusieurs manières, mais, dans ce contexte, il évoque probablement les frères qui se regardent les uns les autres sans agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quand … vit
  rationale: Le waw consécutif fait progresser le récit. La tournure temporelle relie naturellement la constatation de Jacob aux paroles qui suivent.
- source_word: כִּי יֶשׁ
  choice: qu’il y avait
  rationale: כִּי introduit le contenu de ce que Jacob constate, et יֵשׁ exprime l’existence ou la disponibilité. Dans un récit au passé, « il y avait » est naturel en français.
- source_word: שֶׁבֶר
  choice: du grain
  rationale: Dans le récit de Joseph, le terme désigne les céréales disponibles à l’achat pendant la famine. « Grain » est précis et courant.
- source_word: בְּמִצְרָיִם
  choice: en Égypte
  rationale: Traduction française idiomatique de la préposition locative avec le nom du pays.
- source_word: לְבָנָיו
  choice: à ses fils
  rationale: Le terme désigne ici les fils de Jacob présents dans le récit.
- source_word: לָמָּה
  choice: Pourquoi
  rationale: L’interrogatif direct est rendu simplement et fidèlement.
- source_word: תִּתְרָאוּ
  choice: restez-vous à vous regarder les uns les autres
  rationale: Le hitpael peut exprimer ici une action réciproque. « Restez-vous à » rend naturellement, dans ce contexte, leur hésitation et leur inaction sans modifier l’image du regard mutuel.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Du grain » conserve la précision concrète du contexte de famine, tandis que « restez-vous à vous regarder » exprime naturellement l’hésitation suggérée par la scène. Le marqueur de note est placé immédiatement après l’expression concernée.
