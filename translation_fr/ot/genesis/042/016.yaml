source:
  edition: WLC
  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: fr
  text: 'Envoyez l’un de vous chercher votre frère[a], tandis que vous resterez détenus[b]. Ainsi, vos paroles seront mises à l’épreuve : on verra si la vérité est avec vous[c]. Sinon, aussi vrai que Pharaon est vivant[d], vous êtes bel et bien des espions.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « prendre votre frère ». Il s’agit ici d’aller le chercher pour le ramener.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous serez emprisonnés » ou « vous resterez sous bonne garde ». Le verbe hébreu peut évoquer le fait d’être lié ou maintenu en détention.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « si la vérité est avec vous », c’est-à-dire si vous dites vrai.'
    reason: lexical_alternative
  - marker: d
    text: « Aussi vrai que Pharaon est vivant » est une formule de serment qui invoque la vie de Pharaon.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: Envoyez l’un de vous
  rationale: L’impératif pluriel suivi de « l’un d’entre vous » commande au groupe de déléguer un seul homme.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: chercher votre frère
  rationale: Le verbe לקח signifie normalement « prendre », mais le mouvement attendu consiste ici à aller chercher le frère pour le ramener auprès de Joseph. Le français naturel emploie « chercher » dans ce contexte.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: tandis que vous resterez détenus
  rationale: Le nifal de אסר exprime le fait d’être lié ou gardé en détention. « Détenus » conserve la portée carcérale sans imposer l’image concrète de liens; « tandis que » rend la relation circonstancielle.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: vos paroles seront mises à l’épreuve
  rationale: Le nifal de בחן désigne un examen ou une mise à l’épreuve. « Vos paroles » préserve l’expression hébraïque plutôt que de l’interpréter comme « votre récit ».
- source_word: הַאֱמֶת אִתְּכֶם
  choice: si la vérité est avec vous
  rationale: Cette formulation garde l’image littérale et intelligible de l’hébreu, tout en laissant le contexte indiquer qu’il s’agit de vérifier leur véracité.
- source_word: וְאִם לֹא
  choice: Sinon
  rationale: Cette tournure française concise introduit naturellement la conséquence contraire si leurs déclarations ne résistent pas à l’épreuve.
- source_word: חֵי פַרְעֹה
  choice: aussi vrai que Pharaon est vivant
  rationale: Il s’agit d’une formule de serment fondée sur la vie de Pharaon. Cette expression est idiomatique en français et conserve sa solennité.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: vous êtes bel et bien des espions
  rationale: Dans ce contexte, כי renforce l’affirmation. « Bel et bien » transmet cette valeur emphatique sans transformer explicitement la proposition en simple conséquence logique.
