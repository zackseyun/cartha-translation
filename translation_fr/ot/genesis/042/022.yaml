base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: fr
  text: 'Alors Ruben leur répondit : « Ne vous ai-je pas dit : “Ne péchez pas contre l’enfant” ? Mais vous n’avez pas écouté. Et maintenant, voici que son sang est réclamé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַיֶּלֶד
  choice: contre l’enfant
  rationale: La préposition ב avec חטא exprime ici l’acte commis contre quelqu’un; « l’enfant » conserve le terme employé par Ruben pour Joseph.
- source_word: דָּמוֹ הִנֵּה נִדְרָשׁ
  choice: voici que son sang est réclamé
  rationale: Cette formulation conserve l’image biblique du sang dont justice est demandée et le passif du texte hébreu, sans préciser explicitement qui le réclame.
theological_decisions:
- issue: Agent implicite du passif נִדְרָשׁ
  choice: 'Maintenir le passif : « son sang est réclamé »'
  alternative: « Dieu nous demande compte de son sang »
  rationale: L’hébreu ne nomme pas l’agent. Le passif peut suggérer le jugement divin, mais l’expliciter résoudrait une ambiguïté réelle du texte.
translation_notes:
  register: Français moderne, sobre et digne. La tournure répétitive « répondit… en disant » est allégée conformément à l’usage naturel du français, tandis que « voici que » rend l’effet de הִנֵּה et attire l’attention sur la conséquence présente.
