base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: fr
  text: 'Alors Ruben dit à son père : « Tu pourras faire mourir mes deux fils si je ne te le ramène pas. Confie-le-moi[a], et moi, je te le ramènerai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Mets-le dans ma main. »'
    reason: L’expression hébraïque concrète désigne le fait de remettre quelqu’un sous la responsabilité d’une personne.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » en rend naturellement la valeur séquentielle.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: אֶל אָבִיו
  choice: à son père
  rationale: Rend directement et naturellement la relation exprimée par l’hébreu.
- source_word: לֵאמֹר
  choice: non rendu séparément
  rationale: En français naturel, les deux-points et le discours direct remplissent déjà la fonction de l’introducteur hébreu.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: Tu pourras faire mourir mes deux fils
  rationale: « Faire mourir » conserve la valeur causative du hifil ; le futur à valeur de permission traduit ici l’offre de garantie de Ruben sans transformer la phrase en ordre abrupt.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: si je ne te le ramène pas
  rationale: La condition négative est conservée, et « ramener » explicite le retour de Benjamin auprès de Jacob qu’implique le contexte.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: Confie-le-moi
  rationale: Cette formulation française rend naturellement l’idiome hébreu littéral « mets-le sur ma main », qui exprime la remise sous la responsabilité de Ruben.
- source_word: וַאֲנִי
  choice: et moi, je
  rationale: La reprise pronominale reproduit l’insistance portée par le pronom hébreu explicite.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: je te le ramènerai
  rationale: Le hifil de שוב signifie ici faire revenir, donc ramener Benjamin à son père.
