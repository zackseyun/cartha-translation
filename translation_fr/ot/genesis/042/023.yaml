source:
  edition: WLC
  text: וְ/הֵם֙ לֹ֣א יָֽדְע֔וּ כִּ֥י שֹׁמֵ֖עַ יוֹסֵ֑ף כִּ֥י הַ/מֵּלִ֖יץ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: fr
  text: Mais ils ne savaient pas que Joseph comprenait ce qu’ils disaient, car l’interprète était entre eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵם
  choice: Mais ils
  rationale: La conjonction et le pronom explicite marquent ici un contraste avec le contexte précédent; « Mais ils » le rend naturellement en français.
- source_word: לֹא יָדְעוּ
  choice: ne savaient pas
  rationale: Traduction directe de l’absence de connaissance exprimée par ידע au qatal.
- source_word: כִּי
  choice: que
  rationale: Le premier כִּי introduit le contenu de ce qu’ils ignoraient.
- source_word: שֹׁמֵעַ
  choice: comprenait ce qu’ils disaient
  rationale: שׁמע signifie fondamentalement entendre ou écouter, mais peut exprimer la compréhension. Dans ce contexte, les frères savent que Joseph est présent et peut les entendre extérieurement; ce qu’ils ignorent, c’est qu’il comprend leur langue. La formulation explicite ce sens contextuel sans réduire le verbe au seul acte d’écouter.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: כִּי
  choice: car
  rationale: Le second כִּי introduit la raison pour laquelle les frères pensaient que Joseph ne comprenait pas.
- source_word: הַמֵּלִיץ
  choice: un interprète
  rationale: Dans cette scène, le terme désigne la personne qui assure l’interprétation linguistique entre Joseph et ses frères. L’indéfini est naturel en français pour présenter sa fonction dans le récit.
- source_word: בֵּינֹתָם
  choice: servait d’intermédiaire entre eux
  rationale: La tournure rend la position relationnelle et la fonction médiatrice de l’interprète, plutôt qu’une simple localisation physique.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La traduction privilégie le sens contextuel de שֹׁמֵעַ : les frères n’ignoraient pas que Joseph pouvait matériellement les entendre, mais qu’il comprenait leurs paroles. Aucun marqueur de note n’est nécessaire.'
