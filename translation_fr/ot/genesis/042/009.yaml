  text: וַ/יִּזְכֹּ֣ר יוֹסֵ֔ף אֵ֚ת הַ/חֲלֹמ֔וֹת אֲשֶׁ֥ר חָלַ֖ם לָ/הֶ֑ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מְרַגְּלִ֣ים אַתֶּ֔ם לִ/רְא֛וֹת אֶת עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: fr
  text: 'Alors Joseph se souvint des rêves qu’il avait faits à leur sujet et leur dit : « Vous êtes des espions ! Vous êtes venus voir la nudité du pays[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les parties exposées ou vulnérables du pays » ; l’hébreu dit littéralement « la nudité du pays », expression qui désigne les endroits ouverts à une attaque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: se souvint
  rationale: Le wayyiqtol de זכר marque ici le moment où Joseph se rappelle ses rêves ; « se souvint » convient naturellement au récit français.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: les rêves qu’il avait faits
  rationale: L’hébreu emploie une construction avec un verbe et un nom de même racine. En français courant, « faire un rêve » restitue naturellement le sens sans la lourdeur de « rêver des rêves ».
- source_word: לָהֶם
  choice: à leur sujet
  rationale: Dans ce contexte, les rêves concernaient les frères de Joseph. Cette formulation conserve ce rapport sans imposer le sens plus littéral mais ambigu de « pour eux ».
- source_word: מְרַגְּלִים
  choice: des espions
  rationale: Le participe désigne ici des hommes soupçonnés de recueillir clandestinement des renseignements ; « espions » est le terme français précis et courant.
- source_word: לִרְאוֹת
  choice: voir
  rationale: L’infinitif signifie littéralement « voir ». Le contexte d’espionnage lui donne la nuance d’examiner ou de repérer, sans qu’il soit nécessaire de l’expliciter dans le texte.
- source_word: עֶרְוַת הָאָרֶץ
  choice: la nudité du pays
  rationale: 'Cette traduction préserve l’image frappante de l’hébreu, tandis que la note en explique le sens idiomatique : les parties exposées ou vulnérables du territoire.'
- source_word: בָּאתֶם
  choice: vous êtes venus
  rationale: Le passé composé convient à l’accusation directe et exprime une venue dont le but reste pertinent au moment où Joseph parle.
