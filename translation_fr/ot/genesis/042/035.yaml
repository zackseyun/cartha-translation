  text: וַ/יְהִ֗י הֵ֚ם מְרִיקִ֣ים שַׂקֵּי/הֶ֔ם וְ/הִנֵּה אִ֥ישׁ צְרוֹר כַּסְפּ֖/וֹ בְּ/שַׂקּ֑/וֹ וַ/יִּרְא֞וּ אֶת צְרֹר֧וֹת כַּסְפֵּי/הֶ֛ם הֵ֥מָּה וַ/אֲבִי/הֶ֖ם וַ/יִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: fr
  text: Or, pendant qu’ils vidaient leurs sacs, voici que le paquet d’argent de chacun[a] était dans son sac. Eux et leur père virent leurs paquets d’argent, et ils eurent peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la bourse d’argent de chacun ». Le terme hébreu désigne quelque chose de lié ou enveloppé ensemble.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: Or, pendant qu’ils vidaient
  rationale: La tournure introduit un nouveau développement au cours de l’action. « Or, pendant que » restitue naturellement en français la progression narrative et la valeur circonstancielle du participe.
- source_word: שַׂקֵּיהֶם
  choice: leurs sacs
  rationale: שַׂק désigne un sac servant au transport de grain ou de marchandises ; « sacs » conserve ce cadre concret et ancien.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: La particule signale une découverte soudaine et surprenante. « Voici que » en garde la force dans un registre narratif digne et courant.
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: le paquet d’argent de chacun
  rationale: אִישׁ a ici une valeur distributive, tandis que צְרוֹר désigne quelque chose de lié ou enveloppé. « Paquet d’argent » reste concret sans préciser à tort la forme exacte du contenant.
- source_word: בְּשַׂקּוֹ
  choice: dans son sac
  rationale: 'Le singulier distributif est conservé : le paquet de chacun se trouvait dans son propre sac.'
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: Eux et leur père
  rationale: Cette formulation maintient l’insistance du pronom hébreu et désigne explicitement tous ceux qui voient les paquets.
- source_word: וַיִּירָאוּ
  choice: ils eurent peur
  rationale: Le passé simple exprime clairement la réaction de crainte provoquée par la découverte et convient au récit écrit moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation évite le calque lourd « il arriva que » tout en conservant la progression du récit, l’effet de surprise de וְהִנֵּה et le caractère concret des paquets d’argent.
