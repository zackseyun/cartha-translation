source:
  edition: WLC
  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: fr
  text: 'Voici comment vous serez mis à l’épreuve : aussi vrai que Pharaon est vivant, vous ne sortirez pas d’ici, à moins que votre plus jeune frère ne vienne ici.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּזֹאת
  choice: Voici comment
  rationale: Le ב instrumental avec le démonstratif introduit le moyen ou le critère de l’épreuve. « Voici comment » est naturel en français et annonce clairement la condition qui suit.
- source_word: תִּבָּחֵנוּ
  choice: vous serez mis à l’épreuve
  rationale: Le nifal de בחן exprime le fait d’être éprouvé ou examiné afin de vérifier une affirmation.
- source_word: חֵי פַרְעֹה
  choice: aussi vrai que le pharaon est vivant
  rationale: Cette formule française restitue clairement la valeur de serment de l’expression hébraïque littérale « vie de Pharaon ».
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: vous ne sortirez pas d’ici
  rationale: Après une formule de serment, אִם introduit ici une forte assertion négative plutôt qu’une simple condition. מִזֶּה signifie naturellement « d’ici ».
- source_word: כִּי אִם
  choice: à moins que
  rationale: Les particules introduisent l’unique exception à l’assertion négative précédente.
- source_word: בְּבוֹא
  choice: ne vienne
  rationale: L’infinitif construit avec ב indique la circonstance requise. Après « à moins que », le subjonctif est idiomatique en français.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: votre plus jeune frère
  rationale: Dans ce contexte familial, הַקָּטֹן désigne le frère le plus jeune, Benjamin, plutôt qu’un frère simplement petit.
- source_word: הֵנָּה
  choice: ici
  rationale: L’adverbe directionnel signifie « ici, jusqu’ici » ; « vienne ici » est naturel en français moderne.
theological_decisions: []
