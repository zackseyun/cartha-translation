base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: fr
  text: Il se détourna d’eux et pleura. Puis il revint vers eux et leur parla. Il prit Siméon d’entre eux et l’attacha sous leurs yeux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: Il se détourna d’eux
  rationale: Le verbe סבב exprime ici un mouvement d’éloignement; avec מֵעֲלֵיהֶם, la formulation indique que Joseph se détourne de ses frères, probablement pour cacher ses pleurs, sans ajouter explicitement ce motif.
- source_word: וַיֵּבְךְּ
  choice: pleura
  rationale: בכה désigne directement le fait de pleurer; « pleura » est précis, naturel et adapté au récit.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: il revint vers eux
  rationale: שוב marque le retour après l’éloignement précédent, tandis que אֲלֵהֶם indique le mouvement vers ses frères.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: leur parla
  rationale: Cette formulation rend directement le piel de דבר avec son complément, sans préciser un contenu que le texte ne donne pas.
- source_word: וַיִּקַּח מֵאִתָּם אֶת שִׁמְעוֹן
  choice: Il prit Siméon parmi eux
  rationale: מֵאִתָּם présente Siméon comme retiré du groupe. « Parmi eux » conserve cette idée de sélection sans alourdir la phrase.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: le fit ligoter
  rationale: אסר signifie attacher ou lier. Le causatif français naturel « fit ligoter » laisse ouverte l’identité de ceux qui exécutent matériellement l’ordre, comme le fait la tournure narrative hébraïque, tout en attribuant l’action à Joseph.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: L’expression signifie littéralement que l’acte a lieu devant leurs yeux; l’idiome français « sous leurs yeux » en garde la force visuelle et publique.
