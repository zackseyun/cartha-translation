  yaml_path: translation/ot/genesis/042/017.yaml
  text: And he put them in custody for three days[a].
translation:
  language: fr
  text: Il les mit sous garde pendant trois jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Il les plaça en détention pendant trois jours. » Le verbe hébreu signifie littéralement « rassembler » ou « recueillir », mais il s’emploie ici avec « garde » au sens de placer quelqu’un sous surveillance ou en détention.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: mit
  rationale: Le verbe אָסַף signifie littéralement « rassembler » ou « recueillir », mais, avec אֶל מִשְׁמָר, il exprime ici l’action de placer des personnes sous garde. « Mit » rend naturellement cet emploi idiomatique sans préciser davantage le lieu de détention.
- source_word: אֹתָם
  choice: les
  rationale: Pronom objet masculin pluriel renvoyant aux frères de Joseph.
- source_word: אֶל מִשְׁמָר
  choice: sous garde
  rationale: La préposition אֶל indique la mise dans une situation de détention, et מִשְׁמָר désigne le fait ou le lieu d’être gardé. « Sous garde » est idiomatique en français et n’impose pas l’idée plus précise d’une prison.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: pendant trois jours
  rationale: Le groupe nominal exprime une durée; « pendant trois jours » est une formulation française naturelle et exacte.
