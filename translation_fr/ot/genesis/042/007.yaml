base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: fr
  text: 'Quand Joseph vit ses frères, il les reconnut, mais il se comporta envers eux comme un étranger[a] et leur parla durement. Il leur demanda : « D’où venez-vous ? » Ils répondirent : « Du pays de Canaan, pour acheter de la nourriture[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il se rendit méconnaissable pour eux ». L’hébreu peut désigner le fait de se présenter à eux comme un étranger ou un inconnu, sans préciser nécessairement qu’il s’est déguisé physiquement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des céréales ». Dans ce contexte de famine, le verbe hébreu désigne souvent l’achat de céréales, bien que le nom employé ici signifie plus largement « nourriture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: Quand Joseph vit ses frères
  rationale: « Quand » rend naturellement l’enchaînement narratif avec l’action suivante, tandis que « vit ses frères » traduit directement la proposition hébraïque.
- source_word: וַיַּכִּרֵם
  choice: il les reconnut
  rationale: Le hiphil de נכר exprime ici le fait de reconnaître ou d’identifier des personnes déjà connues.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: il se comporta envers eux comme un étranger
  rationale: Le hitpael de נכר décrit une manière de se présenter comme étranger ou inconnu vis-à-vis d’eux, sans imposer l’idée plus précise d’un déguisement physique.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: leur parla durement
  rationale: קָשׁוֹת qualifie ici la manière de parler. « Parler durement à quelqu’un » est naturel en français et conserve la sévérité du propos.
- source_word: מֵאַיִן בָּאתֶם
  choice: D’où venez-vous ?
  rationale: Formulation française directe et idiomatique qui exprime la question sur leur provenance.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: Du pays de Canaan
  rationale: Cette formulation conserve explicitement אֶרֶץ tout en restant naturelle en français moderne.
- source_word: לִשְׁבָּר אֹכֶל
  choice: pour acheter de la nourriture
  rationale: שבר désigne ici l’achat de provisions, souvent de céréales dans le contexte de famine, mais אֹכֶל a le sens plus large de « nourriture ».
