  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: fr
  text: L’homme, le maître du pays, nous a parlé durement et nous a pris pour des espions venus reconnaître le pays.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: le maître du pays
  rationale: Le pluriel de forme אֲדֹנֵי désigne ici le détenteur de l’autorité sur le pays. « Maître » est naturel en français et évite la coloration féodale possible de « seigneur ».
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: nous a parlé durement
  rationale: קָשׁוֹת qualifie des paroles sévères ou rudes. La construction française rend naturellement l’idée sans reproduire mécaniquement la préposition « avec ».
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: nous a pris pour des espions
  rationale: Littéralement, il « nous a placés/considérés comme des espions ». « Prendre pour » exprime clairement qu’il les a traités ou tenus pour tels.
- source_word: מְרַגְּלִים אֶת־הָאָרֶץ
  choice: des espions venus reconnaître le pays
  rationale: Le verbe implicite lié à מְרַגְּלִים évoque l’exploration clandestine du territoire. L’ajout idiomatique « venus reconnaître » explicite en français la relation entre les espions et le pays sans modifier l’accusation.
