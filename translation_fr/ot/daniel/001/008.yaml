  source_fidelity: La répétition de « se souiller » rend correctement le hitpael de גאל sans en préciser indûment la cause. En revanche, « prit à cœur de » exprime surtout le fait de prendre quelque chose au sérieux et atténue la résolution volontaire de וַיָּשֶׂם ... עַל־לִבּוֹ. « Résolut en son cœur » restitue mieux cette décision intérieure. « Le vin que le roi buvait » suit de manière claire la référence royale de יֵין מִשְׁתָּיו.
  naturalness: La révision reste naturelle dans un français international moderne et conserve un registre narratif digne. « Demanda ... de lui permettre » exprime explicitement, sans lourdeur, l’autorisation impliquée par le contexte.
  terminology: « Se souiller », « mets du roi » et « chef des eunuques » sont appropriés. La note doit conserver le rang de « chef » dans l’alternative administrative, et non proposer seulement « des hauts fonctionnaires ».
