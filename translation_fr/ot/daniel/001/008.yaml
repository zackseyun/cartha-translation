source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּנִיֵּאל֙ עַל לִבּ֔/וֹ אֲשֶׁ֧ר לֹֽא יִתְגָּאַ֛ל בְּ/פַתְבַּ֥ג הַ/מֶּ֖לֶךְ וּ/בְ/יֵ֣ין מִשְׁתָּ֑י/ו וַ/יְבַקֵּשׁ֙ מִ/שַּׂ֣ר הַ/סָּרִיסִ֔ים אֲשֶׁ֖ר לֹ֥א יִתְגָּאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/008.yaml
  text: But Daniel resolved in his heart that he would not defile himself with the king’s food or with the wine he drank[a], and he sought permission from the chief of the eunuchs that he might not defile himself.
translation:
  language: fr
  text: Mais Daniel résolut en son cœur de ne pas se souiller avec les mets du roi ni avec le vin que le roi buvait. Il demanda au chef des eunuques[a] de lui permettre de ne pas se souiller.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef des hauts fonctionnaires de la cour » ; le terme hébreu peut désigner des eunuques au sens propre ou, plus généralement, de hauts fonctionnaires royaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... עַל לִבּוֹ
  choice: prit à cœur
  rationale: L’expression hébraïque signifie littéralement « mettre sur son cœur » et marque ici une résolution intérieure. « Prit à cœur » conserve l’image du cœur dans un français naturel et digne.
- source_word: יִתְגָּאַל
  choice: se souiller
  rationale: Le hitpael exprime ici le fait de se rendre impur ou souillé. « Se souiller » préserve la portée morale et rituelle sans préciser une cause que le verset ne donne pas.
- source_word: פַּתְבַּג
  choice: mets
  rationale: Ce terme d’origine étrangère désigne les provisions ou plats attribués par le roi. « Mets » évoque naturellement la nourriture de la table royale sans imposer l’idée de luxe contenue dans « mets délicats ».
- source_word: יֵין מִשְׁתָּיו
  choice: le vin que celui-ci buvait
  rationale: La construction signifie littéralement « le vin de sa consommation » ou « de son banquet ». Cette formulation française rattache clairement le pronom au roi et rend l’expression sans lourdeur.
- source_word: שַׂר הַסָּרִיסִים
  choice: le chef des eunuques
  rationale: סָרִיס peut désigner un eunuque au sens propre ou, plus largement, un haut fonctionnaire de cour. Le sens lexical direct est retenu dans le texte, avec l’autre possibilité en note.
- source_word: וַיְבַקֵּשׁ
  choice: Il demanda ... la permission
  rationale: Le verbe peut signifier « chercher » ou « demander ». Le contexte implique une demande d’autorisation adressée au supérieur responsable.
- source_word: אֲשֶׁר לֹא יִתְגָּאָל
  choice: de ne pas se souiller
  rationale: L’infinitif français après « demander la permission » exprime naturellement le contenu et le but de la demande, tout en reprenant le terme employé dans la première proposition.
theological_decisions:
- issue: Nature de la souillure redoutée par Daniel
  choice: Conserver le terme général « se souiller » sans en expliquer la cause.
  alternative: Préciser qu’il s’agissait d’une impureté cérémonielle, d’une violation des prescriptions alimentaires de la Loi ou d’une association avec l’idolâtrie.
  rationale: Le texte hébreu ne précise pas pourquoi les mets et le vin auraient souillé Daniel. La formulation retenue conserve cette ambiguïté et évite de trancher une question d’interprétation.
- issue: Sens de סָרִיסִים
  choice: « eunuques » dans le texte principal, avec « hauts fonctionnaires de la cour » en note.
  alternative: Traduire directement par « hauts fonctionnaires de la cour » ou « officiers du palais ».
  rationale: Le mot peut désigner des eunuques au sens propre ou des fonctionnaires royaux plus généralement. Le texte principal reste transparent à son sens lexical traditionnel, tandis que la note préserve l’ambiguïté historique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la répétition de « se souiller », structurante dans l’hébreu. « Celui-ci » évite l’ambiguïté du pronom et renvoie clairement au roi.
