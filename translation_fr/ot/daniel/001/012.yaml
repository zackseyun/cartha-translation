  text: נַס נָ֥א אֶת עֲבָדֶ֖י/ךָ יָמִ֣ים עֲשָׂרָ֑ה וְ/יִתְּנוּ לָ֜/נוּ מִן הַ/זֵּרֹעִ֛ים וְ/נֹאכְלָ֖ה וּ/מַ֥יִם וְ/נִשְׁתֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/012.yaml
  text: Please test your servants for ten days[a], and let us be given vegetables to eat and water to drink.
translation:
  language: fr
  text: « Je t’en prie, mets tes serviteurs à l’épreuve pendant dix jours ; qu’on nous donne des aliments végétaux[a] à manger et de l’eau à boire. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des aliments issus de semences ». Le terme hébreu désigne largement de la nourriture végétale provenant de semences.
    reason: Précise la portée lexicale de זֵרֹעִים sans restreindre le sens aux seuls légumes ni à des graines consommées comme telles.
lexical_decisions:
- source_word: נַס נָא
  choice: Je t’en prie, mets … à l’épreuve
  rationale: L’impératif de נסה demande un essai permettant d’évaluer les serviteurs, tandis que נָא adoucit la demande. Cette formulation reste courtoise et naturelle en français.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Daniel emploie une désignation déférente de lui-même et de ses compagnons devant un supérieur de la cour ; « serviteurs » convient mieux ici que « esclaves ».
- source_word: יָמִים עֲשָׂרָה
  choice: pendant dix jours
  rationale: L’accusatif hébreu indique la durée de la période d’essai.
- source_word: וְיִתְּנוּ לָנוּ
  choice: qu’on nous donne
  rationale: Le jussif à la troisième personne du pluriel exprime une demande. Le pronom indéfini français conserve le caractère non précisé des personnes chargées de fournir la nourriture.
- source_word: מִן הַזֵּרֹעִים
  choice: des aliments tirés des graines
  rationale: Le terme désigne largement une nourriture végétale issue de semences. La traduction conserve cette nuance lexicale sans recourir à l’ancien « légumes secs » ni la réduire aux seuls légumes.
- source_word: וְנֹאכְלָה
  choice: à manger
  rationale: L’injonction cohortative est rendue idiomatiquement comme le complément de la nourriture demandée.
- source_word: וּמַיִם וְנִשְׁתֶּה
  choice: et de l’eau à boire
  rationale: Cette formulation française naturelle maintient le parallélisme simple entre nourriture et boisson.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à l’adresse hébraïque au singulier et ne supprime pas la déférence, exprimée par « Je t’en prie » et « tes serviteurs ».
