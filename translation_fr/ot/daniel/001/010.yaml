  text: וַ/יֹּ֜אמֶר שַׂ֤ר הַ/סָּרִיסִים֙ לְ/דָ֣נִיֵּ֔אל יָרֵ֤א אֲנִי֙ אֶת אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁ֣ר מִנָּ֔ה אֶת מַאֲכַלְ/כֶ֖ם וְ/אֶת מִשְׁתֵּי/כֶ֑ם אֲשֶׁ֡ר לָ/מָּה֩ יִרְאֶ֨ה אֶת פְּנֵי/כֶ֜ם זֹֽעֲפִ֗ים מִן הַ/יְלָדִים֙ אֲשֶׁ֣ר כְּ/גִֽילְ/כֶ֔ם וְ/חִיַּבְתֶּ֥ם אֶת רֹאשִׁ֖/י לַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/010.yaml
  text: But the chief of the eunuchs said to Daniel[a], “I fear my lord the king, who assigned your food and your drink[c][b]. Why should he see your faces looking worse than the youths who are of your own age? Then you would endanger my head with the king.”
translation:
  language: fr
  text: 'Mais le chef des eunuques[a] dit à Daniel : « Je crains mon seigneur le roi, qui a fixé votre nourriture et votre boisson. Pourquoi le roi verrait-il vos visages plus abattus que ceux des jeunes gens de votre âge ? Vous mettriez alors ma tête en danger devant le roi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef des hauts fonctionnaires ». Le terme hébreu traduit par « eunuques » peut aussi désigner plus largement des fonctionnaires de la cour royale.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « vous rendriez ma tête passible de sanction devant le roi », une expression indiquant qu’il risquerait sa vie.
    reason: idiom_explanation
lexical_decisions:
- source_word: שַׂר הַסָּרִיסִים
  choice: le chef des eunuques
  rationale: Rend directement l’expression hébraïque, tout en signalant en note que סָרִיס peut désigner plus largement un haut fonctionnaire de cour.
- source_word: יָרֵא אֲנִי אֶת אֲדֹנִי הַמֶּלֶךְ
  choice: Je crains mon seigneur le roi
  rationale: Conserve la crainte présente et le registre respectueux de la cour exprimé par אֲדֹנִי.
- source_word: מִנָּה אֶת מַאֲכַלְכֶם וְאֶת מִשְׁתֵּיכֶם
  choice: qui a fixé ce que vous devez manger et boire
  rationale: Exprime naturellement en français l’attribution royale des provisions, sans préciser « vin » puisque מִשְׁתֶּה désigne ici plus largement la boisson.
- source_word: פְּנֵיכֶם זֹעֲפִים
  choice: le visage plus abattu
  rationale: זֹעֲפִים décrit une apparence sombre, troublée ou abattue. Le comparatif français explicite la comparaison introduite par מִן sans réduire l’expression à une mauvaise santé certaine.
- source_word: הַיְלָדִים אֲשֶׁר כְּגִילְכֶם
  choice: les jeunes gens de votre âge
  rationale: Convient au contexte de jeunes hommes formés à la cour et restitue clairement la comparaison d’âge.
- source_word: וְחִיַּבְתֶּם אֶת רֹאשִׁי לַמֶּלֶךְ
  choice: Vous mettriez alors ma tête en danger auprès du roi
  rationale: Préserve l’image vive de « ma tête » et communique le sens contextuel de responsabilité susceptible d’entraîner la mort.
theological_decisions: []
