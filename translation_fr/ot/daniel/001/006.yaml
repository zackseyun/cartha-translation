  text: וַ/יְהִ֥י בָ/הֶ֖ם מִ/בְּנֵ֣י יְהוּדָ֑ה דָּנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/006.yaml
  text: And among them[a], from the sons of Judah, were Daniel, Hananiah, Mishael, and Azariah.
translation:
  language: fr
  text: 'Parmi eux se trouvaient des fils de Juda[a] : Daniel, Hanania, Mishaël et Azaria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». L’hébreu dit plus littéralement « des fils de Juda ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: se trouvaient
  rationale: Dans ce contexte, la forme narrative de היה introduit naturellement l’existence de ces hommes au sein du groupe. « Se trouvaient » restitue cette valeur sans le calque lourd « et il arriva que ».
- source_word: בָהֶם
  choice: Parmi eux
  rationale: La préposition ב avec suffixe marque ici l’appartenance au groupe mentionné précédemment; « parmi eux » est idiomatique et précis.
- source_word: מִבְּנֵי יְהוּדָה
  choice: d’entre les fils de Juda
  rationale: Cette formulation conserve l’expression masculine et la désignation « Juda » du texte hébreu, tout en exprimant naturellement en français l’origine au sein de ce groupe.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forme française traditionnelle et usuelle du nom biblique.
- source_word: חֲנַנְיָה
  choice: Hanania
  rationale: Translittération française courante du nom hébreu.
- source_word: מִישָׁאֵל
  choice: Mishaël
  rationale: Translittération française courante, avec tréma pour marquer la séparation des voyelles.
- source_word: וַעֲזַרְיָה
  choice: et Azaria
  rationale: La conjonction relie le dernier nom à la liste; « Azaria » est la forme française usuelle.
