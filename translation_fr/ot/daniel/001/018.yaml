base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/018.yaml
  text: And at the end of the days that the king had said to bring them in[a], the chief of the eunuchs brought them before Nebuchadnezzar.
translation:
  language: fr
  text: Au terme du délai fixé par le roi pour les faire venir, le chef des eunuques[a] les amena devant Nabuchodonosor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef des hauts fonctionnaires » ou « le responsable des fonctionnaires de la cour ». Le terme hébreu peut désigner un eunuque ou, plus largement, un fonctionnaire royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִקְצָת הַיָּמִים
  choice: Au terme de la période
  rationale: L’expression désigne l’achèvement de la période déterminée au verset 5. « Au terme de la période » restitue le sens avec un français naturel, sans le calque peu idiomatique « à la fin des jours ».
- source_word: אֲשֶׁר אָמַר הַמֶּלֶךְ
  choice: fixée par le roi
  rationale: Le verbe אָמַר signifie littéralement « dire », mais la proposition renvoie ici à la durée que le roi avait prescrite. « Fixée » exprime cette valeur contextuelle sans alourdir la phrase.
- source_word: לַהֲבִיאָם
  choice: pour qu’on les lui présente
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Dans le cadre d’une audience royale, « présenter » rend naturellement le mouvement vers le roi; le pronom « lui » explicite le destinataire contextuel sans changer le référent.
- source_word: וַיְבִיאֵם
  choice: les amena
  rationale: Le même hiphil de בוא décrit ensuite l’action accomplie. « Amener » conserve ici plus directement l’idée de déplacement, avec la destination donnée par « devant Nabuchodonosor ».
- source_word: שַׂר הַסָּרִיסִים
  choice: le chef des eunuques
  rationale: סָרִיס peut désigner un eunuque ou, par extension, un haut fonctionnaire de cour. La traduction principale retient le sens concret et traditionnel, tandis qu’une note conserve l’acception plus large.
- source_word: לִפְנֵי
  choice: devant
  rationale: לִפְנֵי indique ici l’introduction dans la présence du souverain. « Devant » est concis, exact et idiomatique.
- source_word: נְבֻכַדְנֶצַּר
  choice: Nabuchodonosor
  rationale: Forme française conventionnelle du nom du roi babylonien.
