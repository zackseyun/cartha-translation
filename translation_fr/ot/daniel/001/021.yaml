  text: וַֽ/יְהִי֙ דָּֽנִיֵּ֔אל עַד שְׁנַ֥ת אַחַ֖ת לְ/כ֥וֹרֶשׁ הַ/מֶּֽלֶךְ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/021.yaml
  text: And Daniel remained until the first year of King Cyrus[a].
translation:
  language: fr
  text: Daniel resta jusqu’à la première année du roi Cyrus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Daniel fut jusqu’à la première année du roi Cyrus ». Le verbe hébreu signifie littéralement « fut », mais il exprime probablement ici la continuité de la présence de Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: resta là
  rationale: Le verbe signifie littéralement « fut/était ». Avec un sujet personnel et la limite temporelle introduite par עַד, « resta là » exprime naturellement en français la présence continue de Daniel, tout en signalant par une note la formulation plus littérale.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: עַד
  choice: jusqu’à
  rationale: Préposition temporelle naturelle indiquant la durée jusqu’au point mentionné.
- source_word: שְׁנַת אַחַת
  choice: la première année
  rationale: Dans cette formule de datation royale, le cardinal « un » a une valeur ordinale; « la première année » est l’expression française idiomatique.
- source_word: לְכוֹרֶשׁ
  choice: du roi Cyrus
  rationale: Dans la datation des règnes, la préposition לְ rattache l’année au souverain concerné; le français dit naturellement « la première année du roi Cyrus ».
- source_word: הַמֶּלֶךְ
  choice: roi
  rationale: Le titre royal explicitement présent en hébreu est conservé dans l’ordre français usuel « roi Cyrus ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Resta là » est plus naturel que le calque « fut » et évite de préciser au-delà du texte la fonction ou la situation de Daniel. La note préserve la valeur littérale et l’ambiguïté du verbe hébreu.
