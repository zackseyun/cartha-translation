  text: וַ/יֹּ֥אמֶר דָּנִיֵּ֖אל אֶל הַ/מֶּלְצַ֑ר אֲשֶׁ֤ר מִנָּה֙ שַׂ֣ר הַ/סָּֽרִיסִ֔ים עַל דָּנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/011.yaml
  text: Then Daniel said to the steward whom the chief of the eunuchs had appointed over Daniel[a], Hananiah, Mishael, and Azariah,
translation:
  language: fr
  text: 'Alors Daniel dit à l’intendant à qui le chef des eunuques[a] avait confié la responsabilité de Daniel, Hanania, Mishaël et Azaria :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef des fonctionnaires de la cour » ; le terme hébreu traduit par « eunuques » peut, dans certains contextes, désigner plus largement des fonctionnaires de la cour royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors Daniel dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » exprime naturellement la succession des événements en français.
- source_word: הַמֶּלְצַר
  choice: l’intendant
  rationale: Ce terme, probablement emprunté à une langue étrangère, désigne ici l’agent chargé de surveiller les jeunes gens et leurs provisions. « Intendant » rend naturellement cette fonction sans imposer une translittération obscure.
- source_word: אֲשֶׁר מִנָּה
  choice: que … avait préposé
  rationale: Le plus-que-parfait marque que la nomination a précédé la parole de Daniel; « préposer » conserve l’idée d’une désignation officielle à une responsabilité.
- source_word: שַׂר הַסָּרִיסִים
  choice: le chef des eunuques
  rationale: Cette traduction suit directement le sens courant des termes hébreux, tout en signalant en note que סָרִיס peut aussi désigner plus largement un haut fonctionnaire de cour.
- source_word: עַל
  choice: avait préposé à
  rationale: Dans ce contexte de nomination, la préposition marque les personnes confiées à la responsabilité de l’intendant.
- source_word: דָּנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: Daniel, Hanania, Mishaël et Azaria
  rationale: Les noms hébreux employés par le texte source sont conservés et transcrits selon l’usage français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste ouverte par un deux-points, puisque les paroles de Daniel commencent au verset suivant. Le marqueur de note est placé après « eunuques », le terme auquel la variante lexicale se rapporte.
