  source_fidelity: 'Le sens de la phrase est bien rendu : Daniel s’adresse à l’intendant que le chef des eunuques avait désigné pour exercer une responsabilité sur les quatre jeunes gens. Les noms hébreux et l’ouverture de la phrase par un deux-points sont appropriés.'
  naturalness: '« Avait préposé à Daniel » est grammaticalement possible, mais demeure maladroit et ambigu en français moderne : on peut comprendre que l’intendant était affecté à Daniel plutôt qu’établi responsable de lui et des autres. Une formulation avec « confié la responsabilité » est plus idiomatique tout en conservant la relation de supervision marquée par עַל.'
  terminology: « Intendant » convient pour הַמֶּלְצַר. « Chef des eunuques » rend directement שַׂר הַסָּרִיסִים; la note préserve avec justesse la possibilité que סָרִיס désigne des fonctionnaires de cour. « Fonctionnaires de la cour » est plus neutre et plus directement lié à l’alternative lexicale que « hauts fonctionnaires ».
