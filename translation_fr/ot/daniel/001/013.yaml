    rationale: Le וְכַאֲשֶׁר introduit la clause « et selon ce que tu verras »; il ne porte pas à lui seul l’adverbe temporel explicite « puis ». Le contexte permet une succession, mais il est préférable de ne pas la lexicaliser davantage.
  revised_text: Que notre apparence et celle des jeunes gens qui mangent les mets du roi[a] soient alors observées devant toi ; et, d’après ce que tu verras, agis envers tes serviteurs.
  revised_footnotes:
