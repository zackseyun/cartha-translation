source:
  edition: WLC
  text: וְ/יֵרָא֤וּ לְ/פָנֶ֨י/ךָ֙ מַרְאֵ֔י/נוּ וּ/מַרְאֵה֙ הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֣ג הַ/מֶּ֑לֶךְ וְ/כַ/אֲשֶׁ֣ר תִּרְאֵ֔ה עֲשֵׂ֖ה עִם עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/013.yaml
  text: Then let our appearance and the appearance of the youths who are eating the king’s food be seen before you[a], and according to what you see, deal with your servants.
translation:
  language: fr
  text: Que notre apparence et celle des jeunes gens qui mangent les mets du roi[a] soient alors observées devant toi ; et, d’après ce que tu verras, agis envers tes serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ration du roi » ou « les mets raffinés du roi ». Le terme hébreu désigne les provisions royales.
    reason: Alternative lexicale pour le terme d’emprunt פַּתְבַּג.
lexical_decisions:
- source_word: וְיֵרָאוּ
  choice: soient alors observées
  rationale: Le niphal à valeur jussive demande que leur état visible soit regardé et constaté. « Soient observées » conserve la tournure passive et convient mieux en français actuel que le calque « soient vues ».
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Expression hébraïque idiomatique indiquant ici la présence et le jugement du responsable ; « devant toi » préserve l’adresse directe.
- source_word: מַרְאֵינוּ
  choice: notre apparence
  rationale: מַרְאֶה désigne ce qui est visible, l’aspect extérieur. « Apparence » est précis, courant et non archaïque.
- source_word: וּמַרְאֵה הַיְלָדִים
  choice: et celle des jeunes gens
  rationale: La reprise par « celle » évite une lourdeur en français. Dans ce contexte de formation à la cour, יְלָדִים désigne des jeunes gens plutôt que de petits enfants.
- source_word: הָאֹכְלִים
  choice: qui mangent
  rationale: Le participe décrit leur pratique continue durant l’épreuve ; le présent français l’exprime naturellement.
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: les mets du roi
  rationale: Ce terme d’emprunt désigne les provisions ou la nourriture de la table royale. « Mets du roi » reste clair et concis sans imposer l’idée de luxe, signalée seulement comme possibilité en note.
- source_word: וְכַאֲשֶׁר תִּרְאֶה
  choice: puis, d’après ce que tu verras
  rationale: La décision demandée doit reposer sur le constat personnel du responsable. « D’après ce que tu verras » maintient cette relation explicite.
- source_word: עֲשֵׂה עִם עֲבָדֶיךָ
  choice: agis envers tes serviteurs
  rationale: L’expression עשה עם signifie agir ou se comporter envers quelqu’un. « Agis envers » est naturel et conserve le ton déférent de Daniel.
theological_decisions:
- issue: Traduction de עֲבָדֶיךָ
  choice: tes serviteurs
  alternative: tes esclaves
  rationale: Daniel emploie ici une formule de déférence dans un cadre administratif. Le verset ne met pas au premier plan le statut de dépendance juridique ; « serviteurs » rend donc mieux la fonction pragmatique du terme sans nier que עבד puisse ailleurs signifier « esclave ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure passive de la demande est conservée sans recourir au calque peu naturel « soient vues ». Le comparatif implicite entre les deux groupes n’est pas rendu explicite afin de ne pas ajouter au texte.
