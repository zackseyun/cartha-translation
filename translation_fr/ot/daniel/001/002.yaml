id: DAN.1.2
reference: Daniel 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֲדֹנָ֨/י בְּ/יָד֜/וֹ אֶת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֗ה וּ/מִ/קְצָת֙ כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יְבִיאֵ֥/ם אֶֽרֶץ שִׁנְעָ֖ר בֵּ֣ית אֱלֹהָ֑י/ו וְ/אֶת הַ/כֵּלִ֣ים הֵבִ֔יא בֵּ֖ית אוֹצַ֥ר אֱלֹהָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/002.yaml
  text: And the Lord gave Jehoiakim king of Judah into his hand[a], along with some of the vessels of the house of God. He brought them to the land of Shinar, to the house of his god[c][b], and he brought the vessels into the treasury of his god.
translation:
  language: fr
  text: Le Seigneur remit entre ses mains[a] Yoyakim, roi de Juda, ainsi qu’une partie des objets de la maison de Dieu. Il les amena au pays de Shinéar[b], dans la maison de son dieu[c], et il apporta les objets dans la salle du trésor de son dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donna entre ses mains » ; autrement : « livra à son pouvoir ».'
    reason: lexical_alternative
  - marker: b
    text: Shinéar est l’ancien nom de la Babylonie.
    reason: cultural_note
  - marker: c
    text: Ou « dans le temple de son dieu ». L’hébreu emploie le mot « maison » aussi bien pour la maison de Dieu que pour celle de la divinité babylonienne.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le texte consonantique porte אֲדֹנָי et non le nom divin YHWH. « Le Seigneur » en est le rendu français direct.
- source_word: וַיִּתֵּן ... בְּיָדוֹ
  choice: remit entre ses mains
  rationale: Cette formulation conserve l’image concrète de la main et exprime naturellement en français le fait de livrer quelqu’un au pouvoir d’un autre.
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Yoyakim, roi de Juda
  rationale: Transcription française usuelle du nom, suivie du titre royal en apposition.
- source_word: וּמִקְצָת כְּלֵי בֵית הָאֱלֹהִים
  choice: ainsi qu’une partie des objets de la maison de Dieu
  rationale: מִקְצָת désigne une partie ou une portion, et כְּלֵי un ensemble d’objets ou d’ustensiles. « Maison de Dieu » maintient le terme hébreu et son parallèle dans la suite du verset.
- source_word: וַיְבִיאֵם
  choice: Il les amena
  rationale: Le pronom pluriel français conserve sans la résoudre la portée possible du suffixe hébreu, qui peut reprendre l’ensemble précédent, Yoyakim et les objets, ou être compris comme visant les objets.
- source_word: אֶרֶץ שִׁנְעָר
  choice: au pays de Shinéar
  rationale: אֶרֶץ est rendu par « pays », tandis que le nom géographique ancien est transcrit sous la forme française Shinéar.
- source_word: בֵּית אֱלֹהָיו
  choice: dans la maison de son dieu
  rationale: Le choix de « maison » préserve le parallèle littéraire avec la « maison de Dieu » et laisse la note préciser le sens cultuel de temple.
- source_word: בֵּית אוֹצַר אֱלֹהָיו
  choice: dans la salle du trésor de son dieu
  rationale: אוֹצָר désigne un trésor ou son lieu de dépôt. « Salle du trésor » est clair et naturel en français dans ce contexte cultuel.
theological_decisions:
- issue: Souveraineté divine dans la chute de Yoyakim
  choice: Le Seigneur remet activement Yoyakim entre les mains du conquérant.
  alternative: Le Seigneur permet seulement que Yoyakim tombe en son pouvoir.
  rationale: Avec Dieu pour sujet, נתן présente une action divine, non une simple permission. La traduction maintient cette affirmation sans en atténuer la tension théologique.
- issue: Référent du suffixe dans וַיְבִיאֵם
  choice: Employer le pronom non explicité « les ».
  alternative: Préciser soit « Yoyakim et les objets », soit uniquement « les objets ».
  rationale: La forme plurielle peut reprendre le groupe coordonné précédent, tandis que le contexte permet aussi de la rapporter aux objets. Le français conserve cette ambiguïté authentique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant la répétition du verbe « apporter » dans la dernière proposition, le parallèle entre les deux « maisons » et l’ambiguïté du pronom pluriel.
