base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/007.yaml
  text: 'And the chief of the eunuchs gave them names: he gave Daniel the name Belteshazzar[a], Hananiah the name Shadrach, Mishael the name Meshach, and Azariah the name Abed-nego.'
translation:
  language: fr
  text: 'Le chef des eunuques[a] leur attribua des noms : il donna à Daniel le nom de Belteshatsar, à Hanania celui de Shadrak, à Mishaël celui de Méshak et à Azaria celui d’Abed-Nego.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un haut fonctionnaire » ou « le chef des fonctionnaires de la cour » ; le terme hébreu peut désigner un eunuque ou, par extension, un fonctionnaire royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם לָהֶם שֵׁמוֹת
  choice: leur attribua des noms
  rationale: L’expression hébraïque emploie littéralement « mettre » avec « noms ». « Attribuer des noms » exprime naturellement en français l’acte de donner de nouveaux noms.
- source_word: שַׂר הַסָּרִיסִים
  choice: le chef des eunuques
  rationale: סָרִיס désigne couramment un eunuque, mais peut aussi, par extension, désigner un haut fonctionnaire de cour. La traduction retient le sens lexical direct tout en signalant l’autre possibilité en note.
- source_word: וַיָּשֶׂם
  choice: il donna
  rationale: Dans l’énumération, « donner le nom de » rend idiomatiquement le verbe hébreu et indique clairement qu’il s’agit d’un changement de nom.
- source_word: לְדָנִיֵּאל בֵּלְטְשַׁאצַּר
  choice: à Daniel le nom de Beltshatsar
  rationale: Cette formulation explicite en français la relation entre Daniel et le nom qui lui est attribué, déjà établie par la première proposition.
- source_word: שַׁדְרַךְ / מֵישַׁךְ / עֲבֵד נְגוֹ
  choice: Shadrak / Méshak / Abed-Nego
  rationale: Ces noms propres sont translittérés selon des formes françaises usuelles et lisibles, sans chercher à en traduire une étymologie incertaine.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La reprise « celui de » évite une répétition pesante de « le nom de » tout en maintenant explicitement la structure distributive de l’énumération. La note est placée sur « eunuques », terme auquel elle se rapporte.
