id: DAN.1.3
reference: Daniel 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ לְ/אַשְׁפְּנַ֖ז רַ֣ב סָרִיסָ֑י/ו לְ/הָבִ֞יא מִ/בְּנֵ֧י יִשְׂרָאֵ֛ל וּ/מִ/זֶּ֥רַע הַ/מְּלוּכָ֖ה וּ/מִן הַֽ/פַּרְתְּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/003.yaml
  text: Then the king told Ashpenaz[a], the chief of his court officials, to bring some of the sons of Israel, both from the royal offspring and from the nobles,
translation:
  language: fr
  text: Puis le roi dit à Ashpenaz, chef de ses hauts fonctionnaires[a], de faire venir quelques-uns des fils d’Israël, pris parmi la descendance royale et parmi les nobles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chef de ses eunuques ». Le terme hébreu peut désigner des eunuques au sens propre ou, plus généralement, de hauts fonctionnaires royaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis le roi dit
  rationale: Le waw consécutif fait progresser le récit ; « Puis » marque naturellement cette succession. « Dit » conserve le sens ordinaire du verbe sans introduire explicitement l’idée plus forte de commandement.
- source_word: לְאַשְׁפְּנַז
  choice: à Ashpenaz
  rationale: Le nom propre est translittéré selon sa forme traditionnelle en français.
- source_word: רַב סָרִיסָיו
  choice: chef de ses hauts fonctionnaires[a]
  rationale: רַב désigne le chef ou responsable principal. סָרִיס peut désigner un eunuque au sens propre ou, plus largement, un haut fonctionnaire de cour ; le sens large convient au texte principal, tandis que l’autre possibilité est conservée en note.
- source_word: לְהָבִיא
  choice: de faire venir
  rationale: Le hifil de בוא exprime ici le fait d’amener ou de faire venir quelqu’un. Après « dit à », cette tournure française rend naturellement l’instruction.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: quelques-uns des fils d’Israël
  rationale: La préposition מן a ici une valeur partitive. « Fils d’Israël » conserve l’expression collective hébraïque traditionnelle sans la réduire à une simple désignation géographique.
- source_word: וּמִזֶּרַע הַמְּלוּכָה
  choice: pris parmi la descendance royale
  rationale: זֶרַע exprime la descendance. « Descendance royale » en garde la nuance généalogique, tandis que « pris parmi » explicite naturellement en français la valeur partitive de מן.
- source_word: וּמִן הַפַּרְתְּמִים
  choice: et parmi les nobles
  rationale: Ce terme rare désigne vraisemblablement les membres de l’élite ou de la noblesse. « Nobles » est concis et évite de lui attribuer un titre administratif trop précis.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La phrase conserve la structure ouverte du verset, qui se poursuit au verset suivant. La répétition de « parmi » distingue clairement les deux groupes d’origine mentionnés dans l’hébreu.
