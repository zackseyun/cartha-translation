  terminology: Ashpenaz est une translittération française usuelle. « Hauts fonctionnaires » rend prudemment סָרִיסָיו dans son emploi possible de dignitaires de cour, et la note conserve avec exactitude l’alternative « eunuques ». « Descendance royale » préserve la nuance généalogique de זֶרַע, tandis que « nobles » est une restitution appropriée du terme rare פַּרְתְּמִים sans sur-spécification.
