  - severity: low
    issue: « Doués pour toute forme de sagesse » est légèrement imprécis et peu naturel.
    rationale: L’hébreu exprime la compétence dans toute sagesse, c’est-à-dire dans tous les domaines du savoir sage; « versés dans tous les domaines de la sagesse » est plus idiomatique et plus proche.
