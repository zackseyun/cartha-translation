source:
  edition: WLC
  text: יְלָדִ֣ים אֲשֶׁ֣ר אֵֽין בָּ/הֶ֣ם כָּל מאום וְ/טוֹבֵ֨י מַרְאֶ֜ה וּ/מַשְׂכִּילִ֣ים בְּ/כָל חָכְמָ֗ה וְ/יֹ֤דְעֵי דַ֨עַת֙ וּ/מְבִינֵ֣י מַדָּ֔ע וַ/אֲשֶׁר֙ כֹּ֣חַ בָּ/הֶ֔ם לַ/עֲמֹ֖ד בְּ/הֵיכַ֣ל הַ/מֶּ֑לֶךְ וּֽ/לֲ/לַמְּדָ֥/ם סֵ֖פֶר וּ/לְשׁ֥וֹן כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/004.yaml
  text: young men in whom there was no defect at all[a], good in appearance, skillful in all wisdom, knowledgeable in learning, discerning in understanding, and who had the ability to stand in the king’s palace[c][b], and to teach them the literature and language of the Chaldeans.
translation:
  language: fr
  text: des jeunes gens sans aucun défaut, beaux, versés dans tous les domaines de la sagesse, possédant des connaissances et capables de discernement, et ayant l’aptitude à se tenir dans le palais du roi[a]. On devait leur enseigner les écrits[b] et la langue des Chaldéens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « servir dans le palais du roi » ou « se tenir à la cour du roi » ; littéralement « se tenir dans le palais du roi ».
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « écrits » peut aussi désigner l’écriture, les livres ou le savoir des scribes.
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, « Chaldéens » peut désigner plus largement les Babyloniens, mais le texte hébreu emploie précisément le nom « Chaldéens ».
    reason: cultural_note
lexical_decisions:
- source_word: יְלָדִים
  choice: des jeunes gens
  rationale: Dans ce contexte de sélection pour le service royal, le nom désigne des adolescents ou de jeunes hommes, plutôt que de petits enfants.
- source_word: אֵין בָּהֶם כָּל מְאוּם
  choice: sans aucun défaut
  rationale: La formulation exprime l’absence complète de défaut, vraisemblablement physique, sans introduire la coloration cultuelle que pourrait avoir « sans tache ».
- source_word: טוֹבֵי מַרְאֶה
  choice: beaux
  rationale: Rend naturellement l’évaluation favorable de leur apparence physique.
- source_word: מַשְׂכִּילִים בְּכָל חָכְמָה
  choice: doués pour toute forme de sagesse
  rationale: Le participe évoque l’intelligence, le discernement et l’aptitude; « toute forme de sagesse » exprime ici l’étendue du savoir recherché.
- source_word: יֹדְעֵי דַעַת וּמְבִינֵי מַדָּע
  choice: instruits et intelligents
  rationale: Cette paire accumule des notions proches de connaissance, d’instruction et de compréhension. La traduction conserve les deux qualités sans produire en français des répétitions artificielles.
- source_word: כֹּחַ בָּהֶם
  choice: capables
  rationale: כֹּחַ désigne ici la capacité ou l’aptitude requise pour la cour, plutôt que la seule force physique.
- source_word: לַעֲמֹד בְּהֵיכַל הַמֶּלֶךְ
  choice: se tenir dans le palais du roi
  rationale: La traduction maintient l’image concrète de l’hébreu; dans ce contexte, elle implique la présence et le service à la cour.
- source_word: סֵפֶר
  choice: les écrits
  rationale: Le terme peut désigner l’écriture, des livres ou le savoir scribal. « Les écrits » convient au programme de formation et préserve cette largeur sémantique.
- source_word: לְשׁוֹן כַּשְׂדִּים
  choice: la langue des Chaldéens
  rationale: Traduction directe qui conserve la désignation ethnique précise du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La série hébraïque de qualifications est rendue avec fluidité sans effacer la distinction entre aptitude à la sagesse, instruction et intelligence. La seconde proposition devient une phrase autonome afin d’éviter une coordination française maladroite tout en conservant la portée de l’ordre royal.
