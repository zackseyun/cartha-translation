  rationale: La révision conserve la structure, les choix terminologiques et les notes du projet, tout en rendant explicitement les deux qualifications intellectuelles successives du texte hébreu. Elle améliore aussi la formulation de la compétence « en toute sagesse » sans ajouter d’interprétation confessionnelle ou historique.
