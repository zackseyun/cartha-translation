  text: וְ/הַ/יְלָדִ֤ים הָ/אֵ֨לֶּה֙ אַרְבַּעְתָּ֔/ם נָתַ֨ן לָ/הֶ֧ם הָֽ/אֱלֹהִ֛ים מַדָּ֥ע וְ/הַשְׂכֵּ֖ל בְּ/כָל סֵ֣פֶר וְ/חָכְמָ֑ה וְ/דָנִיֵּ֣אל הֵבִ֔ין בְּ/כָל חָז֖וֹן וַ/חֲלֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/017.yaml
  text: As for these four youths[a], God gave them knowledge and insight in every kind of literature and wisdom[b]; and Daniel had understanding in every vision and dream.
translation:
  language: fr
  text: Quant à ces quatre jeunes gens, Dieu leur donna connaissance et discernement dans tous les écrits[a] et en toute sagesse. Et Daniel comprenait toute vision et tous les rêves[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tout livre » ; l’expression hébraïque peut désigner plus largement les textes ou le savoir écrit.
    reason: lexical_alternative
  - marker: b
    text: Ou « avait du discernement concernant toute vision et tous les rêves ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים הָאֵלֶּה אַרְבַּעְתָּם
  choice: ces quatre jeunes gens
  rationale: Dans le contexte de la formation à la cour, « jeunes gens » exprime leur jeunesse sans suggérer qu’il s’agit de petits enfants. La tournure française rend naturellement le démonstratif, le nombre et le suffixe pronominal.
- source_word: נָתַן לָהֶם הָאֱלֹהִים
  choice: Dieu leur donna
  rationale: Cette formulation simple conserve l’attribution explicite de leurs capacités à Dieu et la valeur ordinaire du verbe נתן.
- source_word: מַדָּע
  choice: connaissance
  rationale: Le terme désigne le savoir ou l’instruction acquise; « connaissance » en garde clairement la dimension cognitive.
- source_word: הַשְׂכֵּל
  choice: discernement
  rationale: La forme issue de שכל évoque l’intelligence avisée et la capacité de comprendre. « Discernement » évite une répétition avec « comprenait » dans la proposition suivante.
- source_word: בְּכָל סֵפֶר
  choice: dans tous les écrits
  rationale: סֵפֶר signifie littéralement « livre », mais peut désigner ici le domaine des textes et du savoir écrit. « Tous les écrits » reste proche de l’image hébraïque tout en étant naturel en français.
- source_word: וְחָכְמָה
  choice: et dans toute forme de sagesse
  rationale: « Sagesse » est l’équivalent usuel de חָכְמָה. « Toute forme de » explicite idiomatiquement la portée de כָל commune aux domaines mentionnés sans réduire la sagesse à une seule discipline.
- source_word: הֵבִין
  choice: comprenait
  rationale: Le hiphil de בין exprime ici la capacité de comprendre ou de discerner. L’imparfait français présente cette capacité durable et s’intègre naturellement au récit.
- source_word: בְּכָל חָזוֹן וַחֲלֹמוֹת
  choice: toute vision et tout rêve
  rationale: La formulation distributive française rend la portée de כָל et le domaine particulier dans lequel Daniel possédait de l’intelligence, sans préciser indûment s’il s’agit de réception ou d’interprétation.
theological_decisions:
- issue: L’origine des capacités des quatre jeunes gens
  choice: Leur connaissance, leur discernement et leur sagesse sont explicitement présentés comme des dons de Dieu.
  alternative: Présenter ces capacités comme le simple résultat naturel de leur formation.
  rationale: Dieu est le sujet explicite de נָתַן; la traduction maintient donc sans l’atténuer l’action divine affirmée par le texte.
- issue: La nature de la capacité particulière de Daniel
  choice: Daniel comprend ce qui relève de toute vision et de tout rêve, sans que la traduction précise davantage la nature de cette compréhension.
  alternative: Affirmer explicitement qu’il interprétait chaque vision et chaque rêve, ou qu’il les recevait tous lui-même.
  rationale: Le texte porte sur son intelligence à l’égard des visions et des rêves. Il ne tranche pas ici entre compréhension, discernement et interprétation, ni n’affirme qu’il recevait lui-même toutes ces révélations.
translation_notes:
  register: Français international moderne, clair et digne. « Jeunes gens », « écrits » et « discernement » restent accessibles tout en convenant au cadre narratif de la cour. La syntaxe distingue la capacité commune aux quatre jeunes gens du don particulier de Daniel.
