    text: Ou « dans tout livre » ; l’expression hébraïque peut désigner plus largement les textes ou le savoir écrit.
    reason: lexical_alternative
  - marker: b
    text: Ou « avait du discernement concernant toute vision et tous les rêves ».
    reason: lexical_alternative
  revision_rationale: La révision conserve la structure et le sens de la traduction proposée, tout en rétablissant le pluriel de « rêves » exigé par le texte hébreu et en supprimant l’ajout interprétatif léger « forme » devant « sagesse ».
