source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע לָ/הֶ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יְנַסֵּ֖/ם יָמִ֥ים עֲשָׂרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/014.yaml
  text: So he listened to them in this matter and tested them for ten days[a].
translation:
  language: fr
  text: Il accepta leur proposition et les mit à l’épreuve pendant dix jours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il les écouta à ce sujet » ; le verbe hébreu peut exprimer le fait d’écouter favorablement ou d’accéder à une demande.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע לָהֶם
  choice: Il accepta leur proposition
  rationale: Avec la préposition לְ, שׁמע peut signifier écouter, prêter attention ou accéder à une demande. Dans ce contexte, l’intendant donne suite à la proposition; « accepta » exprime naturellement cette idée en français sans suggérer qu’il leur obéit.
- source_word: לַדָּבָר הַזֶּה
  choice: leur proposition
  rationale: דָּבָר peut désigner une parole, une affaire ou une demande. Ici, il renvoie précisément à la proposition formulée au verset précédent; le possessif évite une répétition lourde et clarifie le référent.
- source_word: וַיְנַסֵּם
  choice: les mit à l’épreuve
  rationale: Le piel de נסה signifie essayer ou mettre à l’épreuve. Cette formulation française convient à l’essai alimentaire envisagé et conserve la notion de test.
- source_word: יָמִים עֲשָׂרָה
  choice: pendant dix jours
  rationale: L’accusatif hébreu exprime ici la durée; « pendant » le rend clairement et naturellement en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. « Proposition » explicite le sens contextuel de דָּבָר, tandis que la note préserve l’image plus littérale de l’écoute et l’étendue sémantique du verbe hébreu.
