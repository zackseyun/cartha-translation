  text: וַ/יְמַן֩ לָ/הֶ֨ם הַ/מֶּ֜לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֗/וֹ מִ/פַּת בַּ֤ג הַ/מֶּ֨לֶךְ֙ וּ/מִ/יֵּ֣ין מִשְׁתָּ֔י/ו וּֽ/לְ/גַדְּלָ֖/ם שָׁנִ֣ים שָׁל֑וֹשׁ וּ/מִ֨/קְצָתָ֔/ם יַֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/005.yaml
  text: And the king assigned to them a daily portion from the king’s food and from the wine he drank[a], and to bring them up for three years[c][b]; and at the end of them they were to stand before the king.
translation:
  language: fr
  text: Le roi leur attribua, pour chaque jour, une portion des mets du roi et du vin qu’il buvait[a], afin de les élever pendant trois ans; au terme de ces années[b], ils se tiendraient devant le roi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des mets raffinés du roi » ou « de la nourriture riche du roi ». Le terme désigne les provisions de la table royale et peut suggérer des aliments de luxe.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à leur terme », c’est-à-dire au terme des trois années.
    reason: lexical_alternative
  - marker: c
    text: « Se tenir devant le roi » est une expression de cour qui peut signifier comparaître devant lui ou être admis à son service.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַן
  choice: attribua
  rationale: Le verbe exprime ici l’attribution officielle de provisions par le roi; « attribua » convient au contexte administratif.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: chaque jour une portion
  rationale: Cette formulation française naturelle conserve l’idée d’une ration déterminée jour après jour.
- source_word: מִפַּת בַּג הַמֶּלֶךְ
  choice: des mets royaux
  rationale: L’expression désigne les provisions servies à la table du roi, avec une possible nuance de nourriture recherchée ou luxueuse, sans que celle-ci doive être imposée dans le texte principal.
- source_word: וּמִיֵּין מִשְׁתָּיו
  choice: du vin qu’il buvait
  rationale: La formulation rend directement le vin associé à la consommation du roi et conserve le pronom personnel du texte hébreu.
- source_word: וּלְגַדְּלָם
  choice: qu’on les élève ainsi
  rationale: La forme causative évoque le fait de les faire grandir et de les amener à maturité dans le cadre du régime prescrit; « élever » préserve cette portée sans la réduire à la seule instruction scolaire.
- source_word: שָׁנִים שָׁלוֹשׁ
  choice: pendant trois ans
  rationale: Rend clairement la durée indiquée.
- source_word: וּמִקְצָתָם
  choice: au terme de cette période
  rationale: Le pronom renvoie aux trois années; cette formulation explicite naturellement son référent sans modifier le sens.
- source_word: יַעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: ils se tiendraient devant le roi
  rationale: La traduction conserve l’expression de cour, qui peut évoquer à la fois la comparution, la présence et le service auprès du souverain.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement restructurée en deux phrases pour éviter un enchaînement artificiel d’infinitifs, tout en conservant les rapports logiques du texte hébreu. L’expression de cour « se tenir devant le roi » est maintenue afin de ne pas réduire son ambiguïté à la seule idée de service officiel.
