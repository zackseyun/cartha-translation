  variant: modern international French
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֑ה בָּ֣א נְבוּכַדְנֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל יְרוּשָׁלִַ֖ם וַ/יָּ֥צַר עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/001.yaml
  text: In the third year of the reign of Jehoiakim king of Judah[b][a], Nebuchadnezzar king of Babylon came to Jerusalem and besieged it.
translation:
  language: fr
  text: La troisième année du règne de Joïakim, roi de Juda, Nebucadnetsar[a], roi de Babylone, vint à Jérusalem et l’assiégea[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On trouve aussi la forme française traditionnelle « Nabuchodonosor ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mit le siège devant elle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ
  choice: La troisième année
  rationale: Dans cette formule de datation royale, le cardinal hébreu prend en français la valeur ordinale « troisième ». L’absence de « pendant » conserve la concision et la solennité de l’hébreu.
- source_word: לְמַלְכוּת
  choice: du règne de
  rationale: מַלְכוּת désigne ici l’exercice chronologique de la royauté ; « règne » est le terme français naturel et précis.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Forme française biblique courante du nom royal hébreu.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Le groupe nominal est une apposition qui précise la fonction et le royaume de Jojakim.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebucadnetsar
  rationale: Transcription française moderne, proche de la forme consonantique du texte hébreu de ce verset ; la forme française traditionnelle est signalée en note.
- source_word: בָּא
  choice: vint
  rationale: Le verbe בוא signifie simplement « venir ». Le passé simple convient au registre narratif français et évite d’ajouter explicitement l’idée de marche militaire.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Titre apposé au nom propre, rendu sans article conformément à l’usage français.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française établie du nom de la ville.
- source_word: וַיָּצַר עָלֶיהָ
  choice: et l’assiégea
  rationale: Dans ce contexte militaire, צור avec על exprime l’action d’assiéger une ville. Cette formulation est concise et naturelle.
