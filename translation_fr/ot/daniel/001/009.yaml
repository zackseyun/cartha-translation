id: DAN.1.9
reference: Daniel 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן הָֽ/אֱלֹהִים֙ אֶת דָּ֣נִיֵּ֔אל לְ/חֶ֖סֶד וּֽ/לְ/רַחֲמִ֑ים לִ/פְנֵ֖י שַׂ֥ר הַ/סָּרִיסִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/009.yaml
  text: And God gave Daniel favor and compassion before the chief of the eunuchs[a].
translation:
  language: fr
  text: Dieu accorda à Daniel faveur et compassion auprès du chef des eunuques[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du chef des hauts fonctionnaires de la cour » ou « du chef des hauts fonctionnaires du palais » ; le terme hébreu peut désigner aussi bien des eunuques au sens propre que, plus généralement, des fonctionnaires royaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: accorda
  rationale: Le verbe נתן présente Dieu comme la source active de la disposition favorable dont Daniel bénéficie. « Accorda » exprime naturellement cette action en français.
- source_word: הָאֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le nom désigne le vrai Dieu. Le nom divin YHWH n’est pas employé.
- source_word: אֶת דָּנִיֵּאל
  choice: Daniel
  rationale: La particule אֶת marque le complément d’objet direct et ne se traduit pas séparément en français.
- source_word: לְחֶסֶד
  choice: faveur
  rationale: Ici, חֶסֶד décrit la bienveillance dont Daniel jouit auprès d’un responsable, plutôt qu’une loyauté d’alliance. « Faveur » convient au contexte relationnel.
- source_word: וּלְרַחֲמִים
  choice: compassion
  rationale: Le pluriel רַחֲמִים exprime ici un sentiment de compassion ou de miséricorde. « Compassion » forme une association naturelle avec « faveur ».
- source_word: לִפְנֵי
  choice: auprès de
  rationale: Littéralement « devant » ou « en présence de ». Dans cette construction, « auprès de » rend idiomatiquement en français le regard favorable du responsable envers Daniel.
- source_word: שַׂר
  choice: chef
  rationale: שַׂר désigne une personne investie d’autorité. Dans l’état construit, « chef » exprime clairement sa fonction de direction.
- source_word: הַסָּרִיסִים
  choice: des eunuques
  rationale: סָרִיס peut désigner un eunuque au sens propre ou, plus largement, un dignitaire de cour. Le sens direct est retenu dans le texte, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Sens de סָרִיסִים dans le contexte de la cour babylonienne
  choice: des eunuques
  alternative: des hauts fonctionnaires de la cour ou du palais
  rationale: Le terme hébreu peut désigner des eunuques au sens propre ou des fonctionnaires royaux sans préciser leur condition physique. Le texte principal conserve le sens lexical direct, mais la note maintient l’ambiguïté réelle.
translation_notes:
  register: Français moderne, clair et digne. « Auprès de » évite le calque peu naturel « devant le chef » tout en conservant le rapport de faveur exprimé par לִפְנֵי. Le passé simple convient au registre narratif biblique sans être archaïque.
