id: DAN.1.20
reference: Daniel 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹ֗ל דְּבַר֙ חָכְמַ֣ת בִּינָ֔ה אֲשֶׁר בִּקֵּ֥שׁ מֵ/הֶ֖ם הַ/מֶּ֑לֶךְ וַֽ/יִּמְצָאֵ֞/ם עֶ֣שֶׂר יָד֗וֹת עַ֤ל כָּל הַֽ/חַרְטֻמִּים֙ הָֽ/אַשָּׁפִ֔ים אֲשֶׁ֖ר בְּ/כָל מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/020.yaml
  text: And in every matter of wisdom and understanding that the king asked of them[b][a], he found them ten times better than all the magicians and enchanters who were in all his kingdom.
translation:
  language: fr
  text: Dans toutes les questions de sagesse et d’intelligence sur lesquelles le roi les interrogea, il les trouva dix fois supérieurs[a] à tous les magiciens et enchanteurs[b] de tout son royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dix mains au-dessus de ». Cette expression hébraïque marque une nette supériorité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « astrologues ». Le terme hébreu désigne une catégorie de sages babyloniens, mais son sens précis est incertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹל דְּבַר
  choice: Dans toutes les questions
  rationale: דָּבָר désigne ici les sujets sur lesquels porte l’examen royal. « Dans toutes les questions » rend naturellement la portée distributive de וְכֹל et le contexte d’interrogation.
- source_word: חָכְמַת בִּינָה
  choice: de sagesse et d’intelligence
  rationale: Cette formulation conserve les deux notions du syntagme hébreu tout en restant idiomatique en français.
- source_word: אֲשֶׁר בִּקֵּשׁ מֵהֶם הַמֶּלֶךְ
  choice: sur lesquelles le roi les interrogea
  rationale: בקשׁ avec מן peut exprimer le fait de demander ou de rechercher auprès de quelqu’un. Dans ce contexte d’examen, « interrogea » communique clairement l’action du roi sans ajouter de contenu.
- source_word: וַיִּמְצָאֵם
  choice: il les trouva
  rationale: Le verbe présente le constat évaluatif du roi et conserve les quatre jeunes gens comme objet direct.
- source_word: עֶשֶׂר יָדוֹת עַל
  choice: dix fois supérieurs à
  rationale: Littéralement « dix mains au-dessus de », l’expression marque une nette supériorité. « Dix fois supérieurs à » garde le nombre et la force comparative sans reproduire un idiome obscur en français.
- source_word: הַחַרְטֻמִּים
  choice: les magiciens
  rationale: Le terme désigne des spécialistes de cour liés aux savoirs sacrés ou occultes. « Magiciens » est compréhensible et traditionnel sans imposer une définition technique trop étroite.
- source_word: הָאַשָּׁפִים
  choice: enchanteurs
  rationale: Le sens technique exact reste incertain; le mot désigne vraisemblablement une catégorie de sages babyloniens associée aux incantations ou aux pratiques occultes. « Enchanteurs » préserve cette généralité.
- source_word: אֲשֶׁר בְּכָל מַלְכוּתוֹ
  choice: de tout son royaume
  rationale: La tournure française concise exprime que ces spécialistes se trouvaient dans l’ensemble du royaume du roi.
theological_decisions:
- issue: Désignation des spécialistes de la cour babylonienne sans surinterprétation de leurs fonctions
  choice: magiciens et enchanteurs
  alternative: magiciens et astrologues
  rationale: Le contraste porte sur la sagesse donnée aux jeunes Hébreux et celle des spécialistes reconnus de Babylone. Le second terme hébreu ne permet pas d’identifier avec certitude des astrologues; « enchanteurs » garde la dimension occulte probable tout en signalant l’incertitude en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit le mouvement de l’hébreu tout en employant une formulation naturelle; les termes techniques incertains sont rendus simplement et accompagnés de notes.
