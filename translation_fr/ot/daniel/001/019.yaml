  text: וַ/יְדַבֵּ֣ר אִתָּ/ם֮ הַ/מֶּלֶךְ֒ וְ/לֹ֤א נִמְצָא֙ מִ/כֻּלָּ֔/ם כְּ/דָנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָ֑ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/019.yaml
  text: The king spoke with them[a], and among them all no one was found like Daniel, Hananiah, Mishael, and Azariah; so they stood before the king.
translation:
  language: fr
  text: Le roi s’entretint avec eux, et parmi eux tous, on n’en trouva aucun qui fût comparable à Daniel, Hanania, Mishaël et Azaria. Ils se tinrent donc devant le roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « se tenir devant le roi » peut désigner le fait d’entrer à son service et d’exercer ses fonctions en sa présence.
    reason: Précise la valeur idiomatique de l’expression de cour tout en maintenant son image littérale dans le texte.
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם
  choice: s’entretint avec eux
  rationale: Le verbe דבר construit avec אִתָּם désigne ici une conversation directe. « S’entretint avec eux » reste naturel et digne sans préciser, comme le ferait « interrogea », la forme exacte de l’échange.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction courante de מֶלֶךְ, avec conservation de l’article défini.
- source_word: וְלֹא נִמְצָא מִכֻּלָּם
  choice: et parmi eux tous, aucun ne fut trouvé
  rationale: Le nifal de מצא est rendu par « fut trouvé », tandis que מִכֻּלָּם établit une comparaison avec l’ensemble du groupe.
- source_word: כְּדָנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: comme Daniel, Hanania, Mishaël et Azaria
  rationale: La préposition כְּ exprime la comparaison, rendue sans ajouter explicitement un critère tel que « comparable à ». Les noms personnels sont translittérés selon leur forme hébraïque.
- source_word: וַיַּעַמְדוּ
  choice: Ils se tinrent donc
  rationale: Le sens concret de עמד, « se tenir debout », est conservé. « Donc » exprime ici la conséquence narrative de l’évaluation favorable.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: לִפְנֵי signifie littéralement « devant, en présence de ». Dans le contexte de la cour, l’expression peut aussi désigner le service auprès du souverain; cette nuance est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la comparaison ouverte introduite par כְּ et l’image de la présence devant le roi, sans transformer la conversation en interrogatoire formel.
