id: DAN.1.16
reference: Daniel 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֣י הַ/מֶּלְצַ֗ר נֹשֵׂא֙ אֶת פַּתְבָּגָ֔/ם וְ/יֵ֖ין מִשְׁתֵּי/הֶ֑ם וְ/נֹתֵ֥ן לָ/הֶ֖ם זֵרְעֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/016.yaml
  text: So the steward kept taking away their choice food and the wine they were to drink[b][a], and kept giving them vegetables.
translation:
  language: fr
  text: Ainsi, l’intendant continuait à retirer les mets de choix qui leur étaient destinés et le vin qu’ils devaient boire, et à leur donner des légumes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des aliments végétaux ». Le mot hébreu désigne des aliments provenant de graines, probablement des légumes et des légumineuses.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְצַר
  choice: l’intendant
  rationale: Dans ce contexte, le terme désigne le responsable chargé de gérer la nourriture et la boisson des jeunes. « Intendant » exprime naturellement cette fonction.
- source_word: נֹשֵׂא
  choice: continuait à retirer
  rationale: 'Le participe associé à וַיְהִי présente une action suivie ou habituelle : l’intendant retirait régulièrement les provisions assignées.'
- source_word: פַּתְבָּגָם
  choice: les mets qui leur étaient réservés
  rationale: Ce mot d’emprunt désigne les mets de la table royale attribués aux jeunes. Cette formulation conserve l’idée d’une portion spécialement assignée sans ajouter explicitement « du roi », absent du verset.
- source_word: יֵין מִשְׁתֵּיהֶם
  choice: le vin qu’ils devaient boire
  rationale: La construction désigne le vin destiné à leur consommation ; cette formulation rend clairement l’idiome hébreu en français actuel.
- source_word: וְנֹתֵן
  choice: et à leur donner
  rationale: Le second participe partage avec le premier la valeur continue introduite par וַיְהִי ; en français, « continuait à » porte naturellement sur les deux infinitifs coordonnés.
- source_word: זֵרְעֹנִים
  choice: des légumes
  rationale: Le terme renvoie à des aliments issus de graines, vraisemblablement des végétaux et des légumineuses. « Légumes » est la formulation courante la plus claire.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « continuait à » restitue l’aspect habituel des participes sans alourdir la phrase. Le terme traditionnel « légumes secs » serait trop restrictif, puisque l’étendue exacte de זֵרְעֹנִים demeure incertaine.
