  yaml_path: translation/ot/daniel/001/015.yaml
  text: And at the end of ten days, their appearance seemed better, and they were healthier in flesh than all the youths who were eating the king’s food.
translation:
  language: fr
  text: Au bout de dix jours, ils avaient meilleure mine et étaient plus robustes que tous les jeunes gens qui mangeaient les mets du roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִרְאָה מַרְאֵיהֶם טוֹב
  choice: ils paraissaient en meilleure forme
  rationale: Littéralement, « leur apparence paraissait bonne/meilleure ». La formulation française conserve la dimension visuelle exprimée par נִרְאָה tout en évitant une répétition peu naturelle.
- source_word: וּבְרִיאֵי בָּשָׂר
  choice: avaient le corps en meilleure santé
  rationale: בָּשָׂר désigne ici le corps ou la chair, et בְּרִיאֵי évoque une condition saine, robuste. Cette tournure naturelle garde la comparaison avec les autres jeunes gens.
- source_word: הַיְלָדִים
  choice: les jeunes gens
  rationale: Dans ce contexte de cour, le terme désigne les jeunes hommes sélectionnés pour être formés, plutôt que de petits enfants.
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: les mets du roi
  rationale: פַּתְבַּג désigne la nourriture ou ration prestigieuse assignée par le roi. « Mets » rend son caractère royal sans préciser indûment sa composition.
