source:
  edition: WLC
  text: וַ/אֲנִי֙ בִּ/שְׁנַ֣ת אַחַ֔ת לְ/דָרְיָ֖וֶשׁ הַ/מָּדִ֑י עָמְדִ֛/י לְ/מַחֲזִ֥יק וּ/לְ/מָע֖וֹז לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/001.yaml
  text: And as for me[a], in the first year of Darius the Mede[b], I stood up to strengthen and be a fortress to him.
translation:
  language: fr
  text: Quant à moi, la première année de Darius le Mède[a], je me suis levé pour le fortifier et lui servir de forteresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la tradition hébraïque, ce verset est Daniel 11.1 ; dans certaines numérotations, il est compté comme Daniel 10.21b–11.1 ou relève d’une division de chapitre légèrement différente.
    reason: textual_variant
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant après la conjonction marque un léger contraste et ramène l’attention sur le locuteur.
- source_word: בִּשְׁנַת אַחַת
  choice: la première année
  rationale: Dans une formule de datation royale, l’expression désigne naturellement la première année du règne.
- source_word: לְדָרְיָוֶשׁ הַמָּדִי
  choice: de Darius le Mède
  rationale: La préposition s’exprime idiomatiquement par « de » avec une année de règne; le nom et le titre ethnique sont rendus selon l’usage français.
- source_word: עָמְדִי
  choice: je me suis tenu à ses côtés
  rationale: Le verbe signifie « se tenir, prendre position ». L’ajout idiomatique « à ses côtés » rend ici la posture de soutien indiquée par les compléments qui suivent, sans identifier davantage le locuteur.
- source_word: לְמַחֲזִיק
  choice: pour le fortifier
  rationale: L’infinitif causatif de חזק exprime l’action de rendre fort ou d’apporter du soutien.
- source_word: וּלְמָעוֹז
  choice: et lui servir de forteresse
  rationale: מָעוֹז est un nom désignant une forteresse ou une place forte. Cette formulation française conserve l’image nominale plutôt que de la réduire à « protéger ».
- source_word: לוֹ
  choice: le / lui
  rationale: Le pronom masculin singulier renvoie le plus naturellement à Darius; sa double réalisation est imposée en français par les deux constructions coordonnées.
theological_decisions:
- issue: Identité du locuteur et référent du pronom masculin
  choice: Ne pas nommer le locuteur; laisser « le/lui » renvoyer naturellement à Darius le Mède.
  alternative: Identifier explicitement le locuteur comme la figure angélique du contexte précédent, ou rattacher différemment le verset à la division précédente.
  rationale: Le contexte fait poursuivre le discours par la figure angélique, mais le verset ne la nomme pas. La traduction conserve donc la continuité narrative sans ajouter d’identification spéculative.
translation_notes:
  register: Français international moderne, digne et lisible. « Quant à moi » conserve l’emphase discursive; « lui servir de forteresse » maintient l’image concrète de l’hébreu, tandis que « je me suis tenu à ses côtés » exprime naturellement la prise de position en soutien.
