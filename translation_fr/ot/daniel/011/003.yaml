  text: וְ/עָמַ֖ד מֶ֣לֶךְ גִּבּ֑וֹר וּ/מָשַׁל֙ מִמְשָׁ֣ל רַ֔ב וְ/עָשָׂ֖ה כִּ/רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/003.yaml
  text: Then a mighty king will arise[a], and he will rule with great dominion and do as he pleases.
translation:
  language: fr
  text: Puis un roi puissant se lèvera et exercera une vaste domination; il fera tout ce qu’il voudra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָמַד
  choice: Puis ... se lèvera
  rationale: Dans ce contexte prophétique, עמד évoque l’apparition ou l’accession d’un souverain. « Puis » marque naturellement la progression du récit, et le futur convient à la séquence prophétique.
- source_word: מֶלֶךְ גִּבּוֹר
  choice: un roi puissant
  rationale: גִּבּוֹר exprime la force et la puissance, éventuellement militaire, sans imposer ici le sens plus précis de « guerrier ».
- source_word: וּמָשַׁל
  choice: exercera
  rationale: Le verbe משל signifie exercer le pouvoir ou dominer. Avec le nom apparenté qui suit, « exercera une vaste domination » restitue la construction sans lourde répétition.
- source_word: מִמְשָׁל רַב
  choice: une vaste domination
  rationale: מִמְשָׁל désigne l’exercice ou l’étendue du pouvoir, et רַב en souligne l’ampleur. « Vaste » rend ici plus naturellement cette portée que « grande ».
- source_word: וְעָשָׂה כִּרְצוֹנוֹ
  choice: il fera tout ce qu’il voudra
  rationale: L’expression signifie qu’il agira selon sa propre volonté, avec l’idée d’une grande liberté d’action. Cette formulation française est naturelle et conserve la force de l’idiome.
theological_decisions: []
