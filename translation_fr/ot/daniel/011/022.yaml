source:
  edition: WLC
  text: וּ/זְרֹע֥וֹת הַ/שֶּׁ֛טֶף יִשָּׁטְפ֥וּ מִ/לְּ/פָנָ֖י/ו וְ/יִשָּׁבֵ֑רוּ וְ/גַ֖ם נְגִ֥יד בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/022.yaml
  text: The flood-like forces will be swept away from before him and be broken[b][a], and also the prince of the covenant.
translation:
  language: fr
  text: Les forces semblables à un torrent seront balayées de devant lui et brisées[a], ainsi que le chef de l’alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les bras du torrent » ; expression qui désigne probablement des forces militaires déferlantes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le prince de l’alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרֹעוֹת הַשֶּׁטֶף
  choice: les forces semblables à un torrent
  rationale: Littéralement « les bras du torrent ». Dans ce contexte militaire et politique, זְרֹעוֹת évoque vraisemblablement des forces armées, tandis que הַשֶּׁטֶף conserve l’image d’un flot irrésistible.
- source_word: יִשָּׁטְפוּ
  choice: seront emportées
  rationale: 'Le nifal est compris passivement : les forces sont balayées ou emportées, ce qui maintient l’image du torrent et s’accorde avec le parallèle « brisées ».'
- source_word: מִלְּפָנָיו
  choice: loin de lui
  rationale: Rend le mouvement exprimé par מִן et la confrontation devant le personnage, dans un français plus naturel que « de devant lui ».
- source_word: וְיִשָּׁבֵרוּ
  choice: et brisées
  rationale: שבר au nifal signifie être brisé ou fracassé. « Brisées » préserve la sobriété et ne précise pas davantage le degré de destruction.
- source_word: וְגַם
  choice: ainsi que
  rationale: Exprime naturellement en français l’ajout du chef de l’alliance aux êtres ou forces qui subissent les verbes précédents.
- source_word: נְגִיד
  choice: chef
  rationale: נְגִיד désigne un dirigeant, un chef ou un prince. « Chef » reste transparent sans suggérer nécessairement une filiation royale.
- source_word: בְּרִית
  choice: de l’alliance
  rationale: Bien que le nom hébreu soit sans article, le contexte permet un sens défini. La traduction conserve la formulation traditionnelle sans identifier l’alliance.
theological_decisions:
- issue: Identité et statut du « chef de l’alliance »
  choice: Conserver le titre sans identifier le personnage.
  alternative: L’identifier à Onias III, à un dirigeant lié à une alliance, ou à une figure messianique.
  rationale: L’hébreu ne précise pas l’identité historique ou théologique de ce chef. La traduction laisse donc ouverte cette question interprétative.
translation_notes:
  register: Français international moderne, clair et digne. L’image du torrent est conservée, tandis que l’expression hébraïque difficile est rendue intelligible. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
