  text: וּ/מִן הַ/מַּשְׂכִּילִ֣ים יִכָּֽשְׁל֗וּ לִ/צְר֥וֹף בָּ/הֶ֛ם וּ/לְ/בָרֵ֥ר וְ/לַ/לְבֵּ֖ן עַד עֵ֣ת קֵ֑ץ כִּי ע֖וֹד לַ/מּוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/035.yaml
  text: And some of those who have insight will stumble[a], so that they may be refined among them, purified, and made white, until the time of the end[d][c][b]; for it is still for the appointed time.
translation:
  language: fr
  text: Certains de ceux qui ont du discernement trébucheront[a], afin qu’ils soient, parmi eux, affinés[b], purifiés et blanchis[c], jusqu’au temps de la fin, car le moment fixé est encore à venir[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tomberont ». Le verbe hébreu garde l’image du trébuchement et peut évoquer une chute ou un revers causé par l’épreuve ou la persécution.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu ajoute « parmi eux » à l’action d’affiner. La relation exacte demeure incertaine : il peut s’agir d’un affinage au sein du groupe, ou, selon une autre analyse, par eux ou à travers eux.'
    reason: lexical_alternative
  - marker: c
    text: « Blanchis » traduit littéralement l’image hébraïque, qui exprime la purification.
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « car c’est encore pour le moment fixé » ; autrement dit, la fin attend toujours le moment déterminé.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הַמַּשְׂכִּילִים
  choice: Certains de ceux qui ont du discernement
  rationale: מִן est partitif ici (« certains parmi »), et le participe הַמַּשְׂכִּילִים désigne des personnes qui comprennent et discernent. Cette formulation française reste naturelle sans réduire le terme aux seuls « sages ».
- source_word: יִכָּשְׁלוּ
  choice: trébucheront
  rationale: Le verbe כשל conserve l’image d’un faux pas ou d’une chute, sans préciser s’il s’agit d’une défaillance morale, d’une persécution ou d’un revers.
- source_word: לִצְרוֹף בָּהֶם
  choice: afin d’être affinés
  rationale: צרף appartient au vocabulaire de l’affinage des métaux. Le passif français exprime naturellement la fonction de l’épreuve. La valeur exacte de בָּהֶם demeure difficile et est signalée en note.
- source_word: וּלְבָרֵר
  choice: purifiés
  rationale: ברר peut évoquer la purification par séparation ou élimination. « Purifiés » convient à la série d’images sans imposer un mécanisme précis.
- source_word: וְלַלְבֵּן
  choice: blanchis
  rationale: Le hiphil de לבן signifie littéralement « rendre blanc ». « Blanchis » conserve cette image concrète plutôt que de la fondre dans l’idée générale de pureté.
- source_word: עַד עֵת קֵץ
  choice: jusqu’au temps de la fin
  rationale: Cette expression récurrente de Daniel est rendue de façon proche du texte et intelligible en français moderne.
- source_word: כִּי עוֹד לַמּוֹעֵד
  choice: car le moment fixé est encore à venir
  rationale: La proposition hébraïque est elliptique. Cette formulation restitue naturellement l’idée que l’issue attend encore le moment déterminé.
theological_decisions:
- issue: Fonction de la chute des personnes qui ont du discernement
  choice: La chute est présentée comme conduisant à leur affinage et à leur purification.
  alternative: Comprendre les infinitifs comme indiquant seulement le résultat, sans nuance de finalité.
  rationale: La construction infinitive permet une nuance de but ou de résultat. « Afin de » garde la présentation intentionnelle du texte sans développer une doctrine générale de la souffrance.
- issue: Référent et fonction de בָּהֶם
  choice: Le texte principal exprime l’affinage des personnes qui trébuchent, tandis que la note conserve l’incertitude liée à la préposition.
  alternative: Traduire explicitement « parmi eux », « par eux » ou « à travers eux ».
  rationale: L’hébreu est concis et syntaxiquement ambigu. Une traduction française fluide ne doit pas faire passer pour certaine l’une des relations possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Les images de l’affinage, du trébuchement et du blanchiment sont conservées, tandis que les ellipses hébraïques sont rendues dans une syntaxe française naturelle. Les notes préservent les ambiguïtés lexicales et syntaxiques réelles.
