  rationale: La révision rétablit dans le texte la préposition בָהֶם par « parmi eux », tout en maintenant une note qui préserve les analyses concurrentes. Le passif et la série « affinés, purifiés et blanchis » conservent les trois images distinctes de l’hébreu sans imposer une interprétation doctrinale ou un référent plus précis.
