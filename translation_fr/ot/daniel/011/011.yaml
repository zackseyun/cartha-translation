source:
  edition: WLC
  text: וְ/יִתְמַרְמַר֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יָצָ֕א וְ/נִלְחַ֥ם עִמּ֖/וֹ עִם מֶ֣לֶךְ הַ/צָּפ֑וֹן וְ/הֶעֱמִיד֙ הָמ֣וֹן רָ֔ב וְ/נִתַּ֥ן הֶ/הָמ֖וֹן בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/011.yaml
  text: Then the king of the South will become enraged and go out and fight with him[a], with the king of the North; and he will raise up a great multitude[c][b], but the multitude will be given into his hand.
translation:
  language: fr
  text: Le roi du Sud entrera alors en fureur[a], sortira et combattra contre lui, contre le roi du Nord[b]. Le roi du Nord mobilisera une grande armée[c], mais cette armée sera livrée au pouvoir du roi du Sud[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « sera profondément agité » ou « s’aigrira ». Le verbe hébreu exprime une intense agitation intérieure qui pousse à agir.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « combattra avec lui, avec le roi du Nord » ; dans ce contexte, « avec » signifie qu’il l’affrontera.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « une grande multitude » ; le contexte indique qu’il s’agit d’une masse de combattants.'
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « la multitude sera livrée dans sa main ». « Dans sa main » signifie « sous son pouvoir ». L’hébreu emploie des pronoms : le roi du Nord mobilise l’armée, qui est ensuite livrée au pouvoir du roi du Sud.'
    reason: cultural_note
lexical_decisions:
- source_word: וְיִתְמַרְמַר
  choice: entrera alors en fureur
  rationale: Le hitpael de מרר exprime ici une vive agitation intérieure, teintée d’amertume et débouchant sur l’action. « Entrera en fureur » en restitue naturellement l’intensité sans réduire le sens à une simple irritation.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: le roi du Sud
  rationale: Cette désignation géopolitique récurrente dans Daniel 11 est conservée sous sa forme traditionnelle et claire en français.
- source_word: וְיָצָא
  choice: sortira
  rationale: Le verbe signifie littéralement « sortir » et, dans ce contexte militaire, évoque le départ en campagne sans qu’il soit nécessaire d’ajouter « marchera ».
- source_word: וְנִלְחַם עִמּוֹ עִם מֶלֶךְ הַצָּפוֹן
  choice: combattra contre lui, contre le roi du Nord
  rationale: La préposition עם signifie littéralement « avec », mais avec le verbe « combattre » elle désigne ici l’adversaire. La reprise « contre lui, contre le roi du Nord » conserve l’apposition emphatique de l’hébreu.
- source_word: וְהֶעֱמִיד הָמוֹן רָב
  choice: Celui-ci mobilisera une immense armée
  rationale: Le hiphil de עמד signifie faire tenir debout, mettre en place ou mobiliser. המון désigne une masse ou multitude et, dans ce contexte, des forces armées. « Immense armée » communique clairement le sens militaire.
- source_word: וְנִתַּן הֶהָמוֹן בְּיָדוֹ
  choice: mais cette armée sera livrée au pouvoir du roi du Sud
  rationale: Le niphal de נתן exprime le fait d’être livré. L’expression « dans sa main » signifie être placé sous le pouvoir de quelqu’un. Les référents sont explicités dans le texte pour éviter une succession de pronoms trompeuse en français, tout en signalant la forme hébraïque en note.
theological_decisions:
- issue: Référents des sujets et du possessif dans la seconde moitié du verset
  choice: « Celui-ci » désigne le roi du Nord, qui mobilise l’armée; « du roi du Sud » désigne celui au pouvoir duquel elle est livrée.
  alternative: Conserver uniquement les pronoms « il » et « son », ce qui pourrait faire croire en français qu’ils renvoient tous au roi du Sud.
  rationale: Le déroulement de l’affrontement et le verset suivant indiquent que le roi du Nord rassemble la grande armée, laquelle tombe au pouvoir du roi du Sud. L’hébreu emploie toutefois des formes pronominales; cette caractéristique est rendue transparente dans la note afin de ne pas masquer la structure du texte source.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition d’« armée » reproduit la reprise du même nom hébreu et assure la cohésion. « Alors » marque naturellement la progression narrative portée par le waw initial. Les référents pronominaux sont clarifiés dans le corps du texte, tandis qu’une note conserve la transparence de la formulation hébraïque.
