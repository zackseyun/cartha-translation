id: DAN.11.41
reference: Daniel 11:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בָא֙ בְּ/אֶ֣רֶץ הַ/צְּבִ֔י וְ/רַבּ֖וֹת יִכָּשֵׁ֑לוּ וְ/אֵ֨לֶּה֙ יִמָּלְט֣וּ מִ/יָּד֔/וֹ אֱד֣וֹם וּ/מוֹאָ֔ב וְ/רֵאשִׁ֖ית בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/041.yaml
  text: 'He will enter into the Beautiful Land[a], and many will stumble; but these will escape from his hand: Edom, Moab[c][b], and the foremost of the sons of Ammon.'
translation:
  language: fr
  text: 'Il entrera dans le Pays magnifique[a], et beaucoup trébucheront[b] ; mais ceux-ci échapperont à son pouvoir : Édom, Moab et les principaux des fils d’Ammon[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Pays glorieux » ou « le Pays désirable ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « beaucoup » ; le texte ne précise pas s’il s’agit de personnes, de pays ou de régions.
    reason: lexical_alternative
  - marker: c
    text: Ou « la partie principale des fils d’Ammon » ou « les chefs des Ammonites ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Il entrera
  rationale: Avec בְּ suivi de « pays », בוא exprime naturellement l’entrée dans un territoire. Le sujet masculin singulier est repris du contexte précédent.
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: dans le Pays magnifique
  rationale: צְבִי évoque la beauté, la splendeur ou ce qui est désirable. « Pays magnifique » garde l’image hébraïque et la valeur de désignation géographique sans ajouter explicitement « Israël ».
- source_word: וְרַבּוֹת
  choice: et beaucoup
  rationale: L’adjectif féminin pluriel est employé substantivement sans nom exprimé. « Beaucoup » conserve cette ellipse et ne tranche pas entre des personnes, des terres ou des entités politiques.
- source_word: יִכָּשֵׁלוּ
  choice: trébucheront
  rationale: Le niphal de כשל signifie « trébucher, tomber » et peut évoquer ici la défaite. « Trébucheront » préserve la métaphore de façon proche du texte.
- source_word: וְאֵלֶּה יִמָּלְטוּ
  choice: mais ceux-ci échapperont
  rationale: Le contexte donne à la coordination une valeur contrastive. ימלטו signifie qu’ils réussiront à échapper ou seront délivrés.
- source_word: מִיָּדוֹ
  choice: à son pouvoir
  rationale: Littéralement « de sa main ». En français, « échapper à son pouvoir » restitue clairement l’idiome de domination tout en restant naturel.
- source_word: אֱדוֹם וּמוֹאָב
  choice: Édom, Moab
  rationale: Formes françaises usuelles de ces noms propres.
- source_word: וְרֵאשִׁית בְּנֵי עַמּוֹן
  choice: et les principaux des fils d’Ammon
  rationale: רֵאשִׁית peut désigner la première partie ou la partie principale. Cette formulation conserve la structure « fils d’Ammon » et l’incertitude entre les principaux membres et la partie principale du peuple.
theological_decisions:
- issue: Référent du « Pays magnifique »
  choice: La désignation géographique est conservée sans expliciter Israël ou Juda.
  alternative: « le pays d’Israël » ou, plus généralement, « le pays glorieux »
  rationale: Dans Daniel, l’expression renvoie vraisemblablement au territoire d’Israël/Juda, mais le texte hébreu emploie une désignation imagée plutôt que son nom.
- issue: Référent de וְרַבּוֹת (« beaucoup »)
  choice: Le nom sous-entendu n’est pas précisé.
  alternative: « beaucoup de personnes », « beaucoup de pays » ou « beaucoup de régions »
  rationale: L’hébreu présente un féminin pluriel substantivé sans nom. Préciser le référent résoudrait une ambiguïté réelle du texte.
- issue: Sens de רֵאשִׁית בְּנֵי עַמּוֹן
  choice: « les principaux des fils d’Ammon »
  alternative: « la partie principale des fils d’Ammon » ou « les chefs des Ammonites »
  rationale: רֵאשִׁית peut exprimer le commencement, la première part ou ce qui occupe le premier rang. La traduction choisie reste proche de la syntaxe, et la note signale l’autre analyse possible.
translation_notes:
  register: Français international moderne, digne et accessible. La majuscule à « Pays » marque son emploi comme désignation géographique. Le point-virgule clarifie le contraste, et les notes maintiennent les ambiguïtés lexicales du texte hébreu.
