revisions:
- from: Il corrompra par des paroles enjôleuses[a] ceux qui agissent avec méchanceté contre l’alliance. Mais les membres du peuple qui connaissent leur Dieu tiendront ferme et passeront à l’action[b].
  to: Il corrompra par des paroles enjôleuses[a] ceux qui agissent méchamment contre l’alliance. Mais le peuple qui connaît son Dieu tiendra ferme et agira[b].
  rationale: La révision supprime l’ajout « membres », restitue la désignation collective du peuple et rend le dernier verbe par « agira », formulation suffisamment large pour le verbe hébreu. « Tiendra ferme » maintient l’idée contextuelle de force et de persévérance; la note signale la formulation plus littérale « sera fort ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:51:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure contrastive et le sens général sont bien rendus : le souverain corrompt les infidèles à l’alliance par la flatterie, tandis que le peuple connaissant son Dieu demeure fort et agit. Toutefois, « les membres du peuple » introduit inutilement l’idée de membres et contourne la formulation collective de וְעַם. « Passeront à l’action » est plus marqué et plus spécifique que le simple ועשו (« ils agiront / feront »).'
  naturalness: Le français est globalement fluide et de registre approprié. « Le peuple qui connaît son Dieu » est plus direct, plus naturel et plus proche de la valeur collective de l’hébreu que « les membres du peuple ». « Tiendra ferme et agira » conserve une expression française claire sans amplifier l’action finale.
  terminology: « Alliance », « corrompra » et « paroles enjôleuses » conviennent au contexte. Le singulier collectif « son Dieu » est idiomatique en français et respecte le suffixe singulier hébreu, sans exclure la portée collective du peuple.
  issues:
  - severity: medium
    issue: « les membres du peuple » ajoute une notion absente du texte
    rationale: וְעַם signifie « un peuple / le peuple » dans cette construction. Le mot « membres » n’est pas requis pour rendre les verbes pluriels hébreux et introduit une précision institutionnelle non exprimée.
  - severity: medium
    issue: « passeront à l’action » est plus interprétatif que ועשו
    rationale: עשה est un verbe très large, « faire » ou « agir ». Dans le contexte, « agiront » rend l’élan actif sans ajouter la tournure plus dramatique et idiomatiquement spécifique « passer à l’action ».
  revised_text: Il corrompra par des paroles enjôleuses[a] ceux qui agissent méchamment contre l’alliance. Mais le peuple qui connaît son Dieu tiendra ferme et agira[b].
  revised_footnotes:
  - marker: a
    text: Ou « par des flatteries ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sera fort et agira ».
    reason: lexical_alternative
  revision_rationale: La révision supprime l’ajout « membres », restitue la désignation collective du peuple et rend le dernier verbe par « agira », formulation suffisamment large pour le verbe hébreu. « Tiendra ferme » maintient l’idée contextuelle de force et de persévérance; la note signale la formulation plus littérale « sera fort ».
