source:
  edition: WLC
  text: וּ/מַרְשִׁיעֵ֣י בְרִ֔ית יַחֲנִ֖יף בַּ/חֲלַקּ֑וֹת וְ/עַ֛ם יֹדְעֵ֥י אֱלֹהָ֖י/ו יַחֲזִ֥קוּ וְ/עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/032.yaml
  text: He will corrupt with smooth words those who act wickedly against the covenant[b][a], but the people who know their God will stand firm and take action.
translation:
  language: fr
  text: Il corrompra par des paroles enjôleuses[a] ceux qui agissent méchamment contre l’alliance. Mais le peuple qui connaît son Dieu tiendra ferme et agira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par des flatteries ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sera fort et agira ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַרְשִׁיעֵי בְרִית
  choice: ceux qui agissent avec méchanceté contre l’alliance
  rationale: Le participe issu de רשע désigne des personnes qui se conduisent en coupables ou avec méchanceté. « Contre l’alliance » rend clairement leur relation hostile ou infidèle à celle-ci sans réduire l’expression à une violation juridique précise.
- source_word: יַחֲנִיף
  choice: il corrompra
  rationale: Le hiphil de חנף évoque ici le fait d’entraîner dans l’impiété ou de rendre profane. « Corrompra » exprime cette séduction morale et religieuse sans en préciser excessivement le mécanisme.
- source_word: בַּחֲלַקּוֹת
  choice: par des paroles enjôleuses
  rationale: Le terme évoque littéralement ce qui est lisse et, dans cet emploi, un discours flatteur et trompeur. « Paroles enjôleuses » conserve l’idée de séduction verbale en français naturel.
- source_word: וְעַם
  choice: Mais les membres du peuple
  rationale: Le ו est littéralement coordonnant, mais il introduit ici un contraste net avec les infidèles à l’alliance. « Les membres du peuple » permet en français de reprendre naturellement le pluriel des verbes suivants.
- source_word: יֹדְעֵי אֱלֹהָיו
  choice: qui connaissent leur Dieu
  rationale: Le participe exprime une connaissance durable et relationnelle. Le suffixe masculin singulier est rendu distributivement par « leur », en accord avec le groupe pluriel désigné.
- source_word: יַחֲזִקוּ
  choice: tiendront ferme
  rationale: 'Dans ce contexte, le hiphil de חזק a vraisemblablement une valeur résultative ou intransitive : demeurer fort, résister. « Tiendront ferme » rend cette constance avec naturel.'
- source_word: וְעָשׂוּ
  choice: et passeront à l’action
  rationale: עשה est un verbe large signifiant faire ou agir. Dans le contexte de conflit et de résistance, « passeront à l’action » exprime une action effective sans ajouter l’idée plus précise d’exploits.
theological_decisions:
- issue: Nature de la réaction des fidèles dans la dernière proposition
  choice: Le peuple fidèle demeure ferme et agit concrètement.
  alternative: « se montreront forts et agiront », formulation plus proche de la structure hébraïque
  rationale: Le contexte oppose l’infidélité suscitée par la séduction à la fermeté active de ceux qui connaissent Dieu. La traduction garde cette opposition sans préciser la forme de leur action ni lui attribuer un contenu doctrinal absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Paroles enjôleuses » fait entendre à la fois la flatterie et la tromperie; « tiendront ferme et passeront à l’action » restitue idiomatiquement les deux verbes finaux tout en signalant en note leur rendu plus formel.
