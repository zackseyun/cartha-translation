base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/029.yaml
  text: At the appointed time he will return and come into the south[a], but it will not be as the former or as the latter.
translation:
  language: fr
  text: Au moment fixé, il reviendra et entrera dans le Sud, mais il n’en sera pas comme la première fois ni comme la dernière[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « mais il n’en sera pas comme auparavant ni par la suite ». En hébreu, la comparaison est condensée et quelque peu elliptique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד
  choice: Au moment fixé
  rationale: מוֹעֵד désigne ici un moment déterminé. Cette formulation exprime la précision temporelle sans y voir nécessairement une fête ou une rencontre.
- source_word: יָשׁוּב
  choice: il reviendra
  rationale: Le qal de שׁוּב signifie couramment « revenir » ou « retourner » ; dans ce contexte de campagne militaire, « reviendra » est naturel.
- source_word: וּבָא
  choice: et entrera
  rationale: בוא peut signifier « venir » ou « entrer ». Avec un territoire comme complément, « entrera dans » rend clairement le mouvement sans ajouter d'interprétation.
- source_word: בַנֶּגֶב
  choice: dans le Sud
  rationale: Dans Daniel 11, נֶגֶב s'inscrit dans l'opposition géopolitique entre le Nord et le Sud ; « le Sud » convient donc mieux que le Néguev.
- source_word: וְלֹא תִהְיֶה
  choice: mais cette fois ne sera
  rationale: Le verbe féminin singulier renvoie probablement de manière implicite à la campagne ou à l'expédition. « Cette fois » offre en français un référent discret sans préciser davantage la nature de l'événement.
- source_word: כָרִאשֹׁנָה
  choice: comme la première
  rationale: רִאשֹׁנָה signifie « première » ou « précédente ». Le féminin conserve le renvoi implicite probable à une campagne.
- source_word: וְכָאַחֲרֹנָה
  choice: ni comme la dernière
  rationale: אַחֲרֹנָה signifie « dernière » ou « ultérieure ». La coordination négative française « ni… ni… » rend naturellement la comparaison hébraïque condensée.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l'ellipse de la comparaison tout en rendant la syntaxe intelligible ; la majuscule à « Sud » signale l'entité géopolitique du contexte.
