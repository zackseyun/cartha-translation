  text: וְ/יִשְׁלַ֥ח יָד֖/וֹ בַּ/אֲרָצ֑וֹת וְ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א תִהְיֶ֖ה לִ/פְלֵיטָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/042.yaml
  text: He will stretch out his hand against the countries[a], and the land of Egypt will not escape.
translation:
  language: fr
  text: Il étendra la main contre les pays, et le pays d’Égypte n’échappera pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’aura aucune échappatoire ». L’hébreu dit littéralement : « ne sera pas pour échapper ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁלַח
  choice: Il étendra
  rationale: Avec « la main » comme complément, שׁלח exprime ici l’extension du pouvoir ou une action hostile. « Étendra » conserve l’image hébraïque sans la remplacer par le verbe plus interprétatif « attaquera ».
- source_word: יָדוֹ
  choice: la main
  rationale: L’expression est conservée littéralement, car « étendre la main contre » reste compréhensible en français et évoque l’exercice d’un pouvoir hostile.
- source_word: בָּאֲרָצוֹת
  choice: contre les pays
  rationale: Dans ce contexte militaire, la préposition בְּ est rendue par « contre ». Le pluriel défini « les pays » restitue naturellement אֲרָצוֹת.
- source_word: וְאֶרֶץ מִצְרַיִם
  choice: et le pays d’Égypte
  rationale: Cette formulation garde la construction explicite « le pays d’Égypte » et son accent géographique, plutôt que de la réduire à « l’Égypte ».
- source_word: לֹא תִהְיֶה לִפְלֵיטָה
  choice: n’échappera pas
  rationale: La tournure hébraïque signifie idiomatiquement que l’Égypte ne pourra se soustraire à son action. « N’échappera pas » est clair et naturel, tandis qu’une note conserve la forme inhabituelle de l’original.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. L’image de la main étendue est maintenue afin de préserver la force et la relative indétermination de l’expression hébraïque.
