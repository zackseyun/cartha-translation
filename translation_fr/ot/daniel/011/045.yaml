source:
  edition: WLC
  text: וְ/יִטַּע֙ אָהֳלֶ֣י אַפַּדְנ֔/וֹ בֵּ֥ין יַמִּ֖ים לְ/הַר צְבִי קֹ֑דֶשׁ וּ/בָא֙ עַד קִצּ֔/וֹ וְ/אֵ֥ין עוֹזֵ֖ר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/045.yaml
  text: He will pitch the tents of his royal pavilion between the seas and the beautiful holy mountain[a]; yet he will come to his end[b], and there will be no one to help him.
translation:
  language: fr
  text: Il dressera les tentes de son pavillon royal[a] entre les mers et la magnifique montagne sainte[b]. Pourtant, il parviendra à son terme, et il n’y aura personne pour l’aider.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son palais », « sa tente palatiale » ou « son pavillon ». Le mot hébreu, rare, désigne probablement une résidence royale ou un pavillon d’apparat.
    reason: lexical_alternative
  - marker: b
    text: Ou « la glorieuse montagne sainte » ou « la montagne de sainte splendeur ». L’expression hébraïque peut évoquer la beauté, la gloire ou la splendeur de la montagne sainte, probablement Sion/Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִטַּע
  choice: Il dressera
  rationale: Le verbe signifie littéralement « planter », mais, avec des tentes pour complément, il désigne naturellement l’action de les dresser ou de les installer.
- source_word: אָהֳלֵי
  choice: les tentes de
  rationale: Le pluriel construit est conservé et peut évoquer l’ensemble des tentes d’un campement royal.
- source_word: אַפַּדְנוֹ
  choice: son pavillon royal
  rationale: Ce terme rare, probablement emprunté, semble désigner une résidence royale, un palais ou un pavillon d’apparat. Dans le contexte de tentes, « pavillon royal » convient à un campement souverain sans suggérer nécessairement un édifice permanent.
- source_word: בֵּין יַמִּים
  choice: entre les mers
  rationale: Cette formulation conserve le pluriel géographique de l’hébreu dans un français naturel.
- source_word: לְהַר צְבִי קֹדֶשׁ
  choice: et la magnifique montagne sainte
  rationale: צְבִי peut exprimer la beauté, la splendeur ou la gloire. La préposition est comprise comme le second terme de la construction « entre… et… ». L’expression désigne vraisemblablement la montagne sainte associée à Jérusalem/Sion, sans que ce nom soit ajouté au texte.
- source_word: וּבָא עַד קִצּוֹ
  choice: Pourtant, il arrivera à sa fin
  rationale: « Arriver à sa fin » rend de près l’expression hébraïque. « Pourtant » explicite sobrement le contraste contextuel entre son déploiement de puissance et sa fin.
- source_word: וְאֵין עוֹזֵר לוֹ
  choice: et il n’y aura personne pour l’aider
  rationale: La tournure française exprime naturellement l’absence totale de tout secours, tout en conservant le sens du participe « quelqu’un qui aide ».
theological_decisions:
- issue: Identité du roi en Daniel 11.45
  choice: Le personnage demeure désigné uniquement par « il ».
  alternative: L’identifier à Antiochos IV Épiphane, à une figure eschatologique de l’Antichrist, ou à un souverain composite ou typologique.
  rationale: Le texte hébreu ne nomme pas ici le personnage. La traduction préserve donc l’ambiguïté et n’impose aucune identification interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur narratif est conservé. Le pluriel « les tentes » et l’expression géographique « entre les mers » restent proches de l’hébreu, tandis que les termes rares ou ambigus sont signalés en notes.
