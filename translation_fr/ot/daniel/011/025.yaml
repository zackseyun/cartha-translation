base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/025.yaml
  text: And he will stir up his power and his heart against the king of the South with a great army[a], and the king of the South will engage in battle with a very great and mighty army, but he will not stand[b], for they will devise schemes against him.
translation:
  language: fr
  text: Il mobilisera sa puissance et son courage contre le roi du Sud avec une grande armée. Le roi du Sud engagera le combat avec une armée très grande et extrêmement puissante, mais il ne tiendra pas[a], car on concevra des plans contre lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « il ne résistera pas » ou « il ne tiendra pas ferme ». L’hébreu dit littéralement : « il ne se tiendra pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « on complotera contre lui ». L’hébreu emploie deux mots de la même famille, littéralement : « on pensera des pensées contre lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָעֵר כֹּחוֹ וּלְבָבוֹ
  choice: Il mobilisera sa puissance et son courage
  rationale: Le hifil de עור exprime ici la mise en action ou la mobilisation. « Puissance » rend כֹּחַ, tandis que « courage » explicite dans ce contexte militaire la résolution intérieure évoquée par לֵבָב, sans effacer les deux éléments de l’hébreu.
- source_word: עַל מֶלֶךְ הַנֶּגֶב
  choice: contre le roi du Sud
  rationale: Dans Daniel 11, נֶגֶב est une désignation géopolitique directionnelle. « Sud » est donc plus clair et contextuellement plus juste que « Néguev ».
- source_word: בְּחַיִל גָּדוֹל
  choice: avec une grande armée
  rationale: Dans ce contexte militaire, חַיִל désigne une armée ou des forces armées. « Grande armée » est naturel en français et conserve l’idée d’ampleur.
- source_word: יִתְגָּרֶה לַמִּלְחָמָה
  choice: engagera le combat
  rationale: Le hitpael de גרה indique qu’il se met en mouvement pour la guerre ou entre dans l’affrontement. « Engagera le combat » est actuel, précis et non paraphrastique.
- source_word: בְּחַיִל גָּדוֹל וְעָצוּם עַד מְאֹד
  choice: avec une armée très grande et extrêmement puissante
  rationale: La formulation conserve à la fois la grandeur numérique ou imposante de גָּדוֹל, la puissance de עָצוּם et l’intensification עַד מְאֹד.
- source_word: וְלֹא יַעֲמֹד
  choice: mais il ne tiendra pas
  rationale: Le verbe signifie littéralement « se tenir », mais peut ici exprimer le fait de résister, de tenir bon ou de l’emporter. « Ne tiendra pas » préserve la concision et une part de l’ambiguïté de l’image hébraïque.
- source_word: יַחְשְׁבוּ עָלָיו מַחֲשָׁבוֹת
  choice: on concevra des plans contre lui
  rationale: La construction apparentée, littéralement « penser des pensées », évoque l’élaboration de projets hostiles. Le pronom indéfini « on » respecte l’absence d’antécédent explicite pour le sujet pluriel hébreu.
