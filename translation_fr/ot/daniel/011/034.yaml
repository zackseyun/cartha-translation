source:
  edition: WLC
  text: וּ/בְ/הִכָּ֣שְׁלָ֔/ם יֵעָזְר֖וּ עֵ֣זֶר מְעָ֑ט וְ/נִלְו֧וּ עֲלֵי/הֶ֛ם רַבִּ֖ים בַּ/חֲלַקְלַקּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/034.yaml
  text: When they stumble[a], they will receive a little help, and many will join themselves to them with smooth words.
translation:
  language: fr
  text: Lorsqu’ils trébucheront, ils recevront un peu d’aide, et beaucoup se joindront à eux par des paroles flatteuses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par des choses lisses » ; l’expression peut désigner des flatteries ou des propos trompeurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּשְׁלָם
  choice: Lorsqu’ils trébucheront
  rationale: L’infinitif construit au nifal précédé de ב exprime ici une circonstance temporelle. « Trébucher » conserve l’image hébraïque sans préciser qu’il s’agit nécessairement d’une chute définitive.
- source_word: יֵעָזְרוּ
  choice: ils recevront […] de l’aide
  rationale: Le nifal présente l’aide comme reçue. Cette formulation est plus naturelle en français que le passif « ils seront aidés » tout en conservant le même sens.
- source_word: עֵזֶר מְעָט
  choice: un peu d’aide
  rationale: Cette expression française naturelle rend explicitement le caractère limité du secours.
- source_word: וְנִלְווּ עֲלֵיהֶם
  choice: se joindront à eux
  rationale: La tournure pronominale restitue l’idée de s’attacher ou de se rallier à un groupe, dans un français courant et digne.
- source_word: רַבִּים
  choice: beaucoup
  rationale: Rendu quantitatif direct et naturel du terme hébreu.
- source_word: בַּחֲלַקְלַקּוֹת
  choice: par des paroles flatteuses
  rationale: Le nom évoque littéralement des choses lisses et, métaphoriquement, un langage flatteur ou trompeur. La traduction rend l’usage figuré intelligible, tandis que la note conserve l’image et l’ambiguïté de l’expression hébraïque.
