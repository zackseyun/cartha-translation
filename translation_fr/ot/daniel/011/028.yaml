  variant: modern international French
source:
  edition: WLC
  text: וְ/יָשֹׁ֤ב אַרְצ/וֹ֙ בִּ/רְכ֣וּשׁ גָּד֔וֹל וּ/לְבָב֖/וֹ עַל בְּרִ֣ית קֹ֑דֶשׁ וְ/עָשָׂ֖ה וְ/שָׁ֥ב לְ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/028.yaml
  text: Then he will return to his land with great wealth[a], but his heart will be against the holy covenant[b]; and he will act and return to his land.
translation:
  language: fr
  text: Puis il retournera dans son pays avec de grandes richesses[a]. Son cœur sera hostile à l’alliance sainte ; il agira, puis retournera dans son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nombreux biens » ; le terme hébreu peut désigner des possessions, des biens ou des richesses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב אַרְצוֹ
  choice: Puis il retournera dans son pays
  rationale: Le qal imparfait de שׁוב exprime ici le retour dans la progression du récit. « Puis » rend naturellement וְ en français moderne, et « pays » convient au cadre géopolitique.
- source_word: בִּרְכוּשׁ גָּדוֹל
  choice: avec de grandes richesses
  rationale: רְכוּשׁ peut désigner des biens, des possessions ou des richesses. Cette formulation reste large et n’introduit pas explicitement l’idée de butin.
- source_word: וּלְבָבוֹ עַל
  choice: Son cœur sera hostile à
  rationale: La construction décrit une disposition intérieure dirigée contre quelque chose. « Sera hostile à » exprime clairement cette orientation sans préciser une action non formulée dans l’hébreu.
- source_word: בְּרִית קֹדֶשׁ
  choice: l’alliance sainte
  rationale: La formulation conserve le terme théologique « alliance » et rend קֹדֶשׁ adjectivalement, sans réduire le référent à une religion ou à une institution particulière.
- source_word: וְעָשָׂה
  choice: il agira
  rationale: Le verbe עשׂה est très général et ne comporte ici aucun complément exprimé. « Il agira » préserve cette brièveté et cette indétermination.
- source_word: וְשָׁב לְאַרְצוֹ
  choice: puis retournera dans son pays
  rationale: La répétition de שׁוב est maintenue, tandis que « puis » marque naturellement la succession après l’action intermédiaire.
theological_decisions:
- issue: Référent de « l’alliance sainte »
  choice: Conserver le langage de l’alliance sans explicitation interprétative.
  alternative: la religion juive ; le peuple ou l’ordre fondé sur l’alliance de Dieu
  rationale: Le contexte peut orienter vers l’ordre de l’alliance lié au peuple saint, mais le texte dit simplement « alliance sainte ». La traduction préserve cette catégorie et son amplitude théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « retournera » et l’indétermination de « il agira » reproduisent la sobriété du texte hébreu. La rupture en deux phrases évite une coordination lourde sans modifier la succession des actes.
