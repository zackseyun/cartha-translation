id: DAN.11.14
reference: Daniel 11:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם רַבִּ֥ים יַֽעַמְד֖וּ עַל מֶ֣לֶךְ הַ/נֶּ֑גֶב וּ/בְנֵ֣י פָּרִיצֵ֣י עַמְּ/ךָ֗ יִֽנַּשְּׂא֛וּ לְ/הַעֲמִ֥יד חָז֖וֹן וְ/נִכְשָֽׁלוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/014.yaml
  text: And in those times many will rise up against the king of the South[a], and the violent among your people will lift themselves up to establish the vision[c][b], but they will stumble.
translation:
  language: fr
  text: En ces temps-là, beaucoup se soulèveront contre le roi du Sud, et les violents de ton peuple[a] s’exalteront pour établir la vision[b], mais ils trébucheront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils des violents de ton peuple » ; l’expression hébraïque est difficile et peut aussi désigner les violents appartenant à ton peuple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour accomplir la vision ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: En ce temps-là
  rationale: Cette tournure française naturelle exprime la période indiquée par le pluriel hébreu sans suggérer nécessairement des jours précis.
- source_word: רַבִּים
  choice: beaucoup
  rationale: L’adjectif hébreu est employé comme substantif; « beaucoup » le rend sans ajouter un référent absent du texte.
- source_word: יַעַמְדוּ עַל
  choice: se soulèveront contre
  rationale: Dans ce contexte conflictuel, l’expression désigne une opposition active et hostile.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: le roi du Sud
  rationale: Dans Daniel 11, le Néguev fonctionne comme désignation géopolitique directionnelle; la majuscule marque ce titre.
- source_word: וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: les hommes violents de ton peuple
  rationale: La formulation rend le caractère négatif de פָּרִיצִים tout en évitant le calque obscur « les fils des violents »; une note conserve la structure littérale difficile.
- source_word: יִנַּשְּׂאוּ
  choice: s’élèveront
  rationale: Le verbe réflexif évoque le fait de se hausser ou de s’exalter; « s’élèveront » préserve l’image et la nuance d’affirmation orgueilleuse.
- source_word: לְהַעֲמִיד חָזוֹן
  choice: pour établir la vision
  rationale: Le verbe signifie littéralement « faire tenir, établir ». Cette traduction reste proche de l’hébreu sans décider si les acteurs cherchent à accomplir ou à confirmer la vision.
- source_word: חָזוֹן
  choice: la vision
  rationale: « Vision » correspond à l’usage prophétique régulier de ce terme dans Daniel.
- source_word: וְנִכְשָׁלוּ
  choice: mais ils trébucheront
  rationale: Le choix conserve l’image hébraïque et laisse ouvertes les nuances d’échec et de chute.
theological_decisions:
- issue: Identification et caractérisation de וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: les hommes violents de ton peuple
  alternative: les fils des hommes violents de ton peuple; les hommes sans loi de ton peuple
  rationale: La traduction garde la qualification morale négative sans identifier ce groupe à un mouvement historique ou religieux particulier que le verset ne nomme pas.
- issue: Sens de לְהַעֲמִיד חָזוֹן
  choice: pour établir la vision
  alternative: pour accomplir la vision
  rationale: L’hébreu dit « établir, faire tenir » plutôt qu’explicitement « accomplir ». Le texte principal conserve cette tension et la note signale l’interprétation plus précise possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement du verset hébreu tout en restant naturelle; les termes « vision » et « trébucheront » maintiennent ses images et son ambiguïté.
