  text: וְ/עָמַ֛ד מִ/נֵּ֥צֶר שָׁרָשֶׁ֖י/הָ כַּנּ֑/וֹ וְ/יָבֹ֣א אֶל הַ/חַ֗יִל וְ/יָבֹא֙ בְּ/מָעוֹז֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/עָשָׂ֥ה בָ/הֶ֖ם וְ/הֶחֱזִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/007.yaml
  text: And one from a branch of her roots shall arise in his place[a], and he shall come against the army and enter the fortress of the king of the north[d][c][b], and he shall act against them and prevail.
translation:
  language: fr
  text: Un rejeton issu de ses racines[a] se lèvera à sa place. Il viendra contre l’armée et entrera dans la forteresse du roi du Nord[b] ; il agira contre eux[c] et l’emportera[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pousse sortie de ses racines », c’est-à-dire un membre de sa lignée familiale.
    reason: lexical_alternative
  - marker: b
    text: Ou « entrer dans la place forte du roi du Nord ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il agira à leur égard » ou « il agira parmi eux » ; l’expression hébraïque a un sens large.
    reason: lexical_alternative
  - marker: d
    text: Ou « se montrera fort » ou « prendra le dessus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  choice: se lèvera
  rationale: Dans ce contexte de succession dynastique, עמד désigne le fait de surgir ou d’entrer en scène, plutôt que la simple posture debout.
- source_word: מִנֵּצֶר שָׁרָשֶׁיהָ
  choice: un rejeton issu de ses racines
  rationale: נֵצֶר évoque une pousse ou un rejeton ; associé à « ses racines », le langage métaphorique désigne ici un membre de sa lignée.
- source_word: כַּנּוֹ
  choice: à sa place
  rationale: Cette expression marque le remplacement ou la succession tout en laissant ouverte l’identité précise de l’antécédent du pronom.
- source_word: הַחַיִל
  choice: l’armée
  rationale: Dans ce contexte militaire, חַיִל désigne une force armée plutôt que la richesse, la capacité ou la vaillance.
- source_word: בְּמָעוֹז מֶלֶךְ הַצָּפוֹן
  choice: dans la forteresse du roi du Nord
  rationale: מָעוֹז désigne un lieu fortifié ou un lieu de puissance ; avec le verbe de mouvement, « entrer dans la forteresse » constitue une traduction naturelle.
- source_word: וְעָשָׂה בָהֶם
  choice: il agira contre eux
  rationale: La tournure עשה ב est large et peut signifier agir contre, agir parmi ou traiter d’une certaine manière ; le contexte militaire favorise ici le sens hostile sans en préciser excessivement la nature.
- source_word: וְהֶחֱזִיק
  choice: il l’emportera
  rationale: Le hiphil de חזק peut exprimer le fait de se montrer fort, de prendre l’avantage ou de prévaloir ; « l’emportera » rend naturellement l’issue favorable dans ce contexte.
theological_decisions: []
