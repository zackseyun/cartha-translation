id: DAN.11.30
reference: Daniel 11:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בָ֨אוּ ב֜/וֹ צִיִּ֤ים כִּתִּים֙ וְ/נִכְאָ֔ה וְ/שָׁ֛ב וְ/זָעַ֥ם עַל בְּרִֽית ק֖וֹדֶשׁ וְ/עָשָׂ֑ה וְ/שָׁ֣ב וְ/יָבֵ֔ן עַל עֹזְבֵ֖י בְּרִ֥ית קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/030.yaml
  text: For ships of Kittim will come against him[a], and he will be disheartened. Then he will turn back and rage against the holy covenant, and he will act[b]. He will turn back and pay attention to those who forsake the holy covenant.
translation:
  language: fr
  text: Des navires de Kittim viendront contre lui[a], et il sera découragé. Il rebroussera chemin, entrera en fureur contre l’alliance sainte et agira. Puis il reviendra et prêtera attention[b] à ceux qui abandonnent l’alliance sainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des navires venant de Kittim ». Kittim peut désigner Chypre ou, plus largement, les puissances maritimes occidentales.
    reason: lexical_alternative
  - marker: b
    text: Ou « témoignera de la considération envers ceux qui abandonnent l’alliance sainte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים כִּתִּים
  choice: des navires de Kittim
  rationale: Dans ce contexte, צִיִּים désigne des navires ou des forces maritimes, tandis que כִּתִּים renvoie à Kittim, associé à Chypre ou, plus largement, aux puissances maritimes occidentales. Cette formulation conserve l’expression géographique du texte sans la préciser excessivement.
- source_word: וְנִכְאָה
  choice: et il sera découragé
  rationale: Le verbe peut exprimer le découragement, l’intimidation ou l’humiliation provoqués par une opposition. « Sera découragé » convient au contexte politico-militaire sans suggérer à tort une destruction physique.
- source_word: וְשָׁב
  choice: il rebroussera chemin / puis il reviendra
  rationale: Les deux occurrences de שׁוּב indiquent un retour ou un changement de direction. La première décrit clairement un repli après un revers; la seconde est rendue plus littéralement, car sa relation précise avec l’action suivante demeure concise et ambiguë.
- source_word: וְזָעַם עַל
  choice: entrera en fureur contre
  rationale: Le verbe exprime une vive colère dirigée contre quelqu’un ou quelque chose. La tournure française restitue cette hostilité avec naturel.
- source_word: בְּרִית קֹדֶשׁ / בְּרִית קוֹדֶשׁ
  choice: l’alliance sainte
  rationale: La traduction directe préserve la qualification religieuse de l’alliance sans en expliciter davantage le référent.
- source_word: וְעָשָׂה
  choice: et agira
  rationale: Le verbe est général, « faire » ou « agir », et aucun complément n’est exprimé. « Agira » conserve la brièveté et l’indétermination de l’hébreu.
- source_word: וְיָבֵן
  choice: et prêtera attention à
  rationale: Dans ce contexte, le verbe peut signifier considérer, prendre en compte ou accorder de l’attention. Cette traduction reste assez large pour ne pas imposer l’idée plus précise d’une alliance ou d’une faveur.
- source_word: עֹזְבֵי
  choice: ceux qui abandonnent
  rationale: Le participe désigne ceux qui délaissent l’alliance. « Abandonnent » est clair en français moderne et n’introduit pas de terme théologique technique.
theological_decisions:
- issue: Référent de « l’alliance sainte »
  choice: Conserver « l’alliance sainte » sans autre précision.
  alternative: « l’alliance de Dieu avec Israël » ou « l’alliance juive »
  rationale: Le contexte relie cette alliance au peuple saint et à son culte, mais l’hébreu ne l’explicite pas ici; la traduction ne doit donc pas réduire cette ouverture.
- issue: Nature de l’attention portée à ceux qui abandonnent l’alliance
  choice: « prêtera attention à », formulation volontairement large
  alternative: « témoignera de la faveur à » ou « s’entendra avec »
  rationale: Le contexte peut suggérer une considération favorable ou une collaboration, mais le verbe lui-même ne précise pas entièrement la nature de cette attention.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe garde le rythme narratif serré de l’hébreu. « Rebroussera chemin » distingue naturellement le repli militaire de la seconde occurrence, rendue par « reviendra ». Tous les marqueurs de notes sont placés sur les expressions auxquelles les variantes se rapportent.
