  text: וְ/עָמַ֧ד עַל כַּנּ֛/וֹ מַעֲבִ֥יר נוֹגֵ֖שׂ הֶ֣דֶר מַלְכ֑וּת וּ/בְ/יָמִ֤ים אֲחָדִים֙ יִשָּׁבֵ֔ר וְ/לֹ֥א בְ/אַפַּ֖יִם וְ/לֹ֥א בְ/מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/020.yaml
  text: Then one will arise in his place who will send an exactor through the splendor of the kingdom[a]; but within a few days he will be broken[c][b], though not in anger and not in battle.
translation:
  language: fr
  text: À sa place se lèvera quelqu’un qui enverra un percepteur à travers la splendeur du royaume[a]. Mais en quelques jours, il sera brisé, non par la colère ni par la guerre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un collecteur de tribut » ou « un oppresseur » pour « un percepteur ». L’expression « la splendeur du royaume » peut désigner la partie la plus prestigieuse du territoire ou, plus généralement, la majesté du royaume.
    reason: lexical_alternative
  - marker: b
    text: Litt. « non dans/par la colère et non dans/par la guerre ». Ou « non sous l’effet de la colère » ou « non par la fureur »; « guerre » peut aussi être rendu par « combat ». La relation exacte de ces expressions avec la chute annoncée reste concise et ambiguë en hébreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל כַּנּוֹ
  choice: À sa place se lèvera quelqu’un
  rationale: La formule de succession indique qu’un nouveau dirigeant prend la place du précédent. Cette formulation française conserve la progression du récit sans réduire עמד à l’action physique de se tenir debout.
- source_word: מַעֲבִיר
  choice: qui enverra … à travers
  rationale: Le participe hiphil de עבר exprime ici le fait de faire passer un agent dans le territoire. « Enverra … à travers » rend naturellement cette idée causative.
- source_word: נוֹגֵשׂ
  choice: un percepteur
  rationale: Le terme désigne un agent chargé d’exiger un paiement ou un tribut. « Percepteur » est clair en français moderne tout en laissant la note signaler les nuances plus coercitives possibles.
- source_word: הֶדֶר מַלְכוּת
  choice: la splendeur du royaume
  rationale: Cette traduction maintient le rapport génitif et l’ambiguïté entre la partie prestigieuse du territoire et la majesté du royaume en général.
- source_word: וּבְיָמִים אֲחָדִים
  choice: en quelques jours
  rationale: L’expression indique un bref délai sans exiger un nombre littéral et précis de jours.
- source_word: יִשָּׁבֵר
  choice: il sera brisé
  rationale: Le nifal de שבר décrit métaphoriquement la ruine ou la disparition du dirigeant. « Brisé » conserve l’image hébraïque sans préciser indûment la manière de sa fin.
- source_word: וְלֹא בְאַפַּיִם
  choice: sans colère
  rationale: אַפַּיִם désigne couramment la colère ou la fureur. La construction prépositionnelle est concise et ambiguë; « sans colère » en conserve la retenue.
- source_word: וְלֹא בְמִלְחָמָה
  choice: sans combat
  rationale: מִלְחָמָה peut signifier guerre ou combat. Ici, « combat » décrit naturellement la manière dont sa chute ne se produira pas.
