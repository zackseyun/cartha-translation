    rationale: Elle peut se lire comme une description de l’état ou de l’attitude du dirigeant (« il sera brisé sans colère »), alors que l’hébreu qualifie plus probablement, tout en gardant une certaine compression, le mode ou le moyen de sa ruine. Une formulation avec « non par » préserve mieux cette relation sans prétendre résoudre toute ambiguïté.
  - severity: low
    issue: « Combat » est plus étroit que מלחמה.
    rationale: מלחמה désigne normalement la guerre; « guerre » est donc le rendu français de base le plus fidèle. Une note peut signaler « combat » comme possibilité contextuelle.
