  source_fidelity: La formule de succession (« À sa place se lèvera quelqu’un »), l’envoi d’un agent chargé d’exiger des paiements, le bref délai et l’image de la rupture sont fidèles à l’hébreu. La finale doit toutefois mieux rendre les שני compléments introduits par ב (« non par/dans la colère, ni par/dans la guerre »), sans faire de la colère une simple absence d’émotion chez le personnage.
  naturalness: « Sans colère et sans combat » est compréhensible, mais sonne elliptique et peut modifier le sujet plutôt que la manière de sa chute. « Non par la colère ni par la guerre » est plus net, naturel et conserve la concision solennelle du verset. « Guerre » rend plus directement מלחמה que « combat ».
  terminology: « Percepteur » est un choix moderne acceptable pour נוגשׂ, avec note pour « collecteur de tribut » et « oppresseur ». « Splendeur du royaume » conserve utilement l’ambiguïté de הֶדֶר מַלְכוּת. La note sur la finale doit couvrir les deux négations et ne pas surinterpréter l’expression.
