  text: וּ/בָ֗א בְּ/מַלְכוּת֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/שָׁ֖ב אֶל אַדְמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/009.yaml
  text: Then he will come into the realm of the king of the South[a], but he will return to his own land.
translation:
  language: fr
  text: Il viendra alors dans le royaume du roi du Sud[a], mais il retournera dans son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il viendra dans le royaume du roi du Sud et retournera dans son pays. »'
    reason: Cette variante conserve plus directement les deux waw par une coordination simple, sans expliciter la progression par « alors » ni le contraste par « mais ».
lexical_decisions:
- source_word: וּבָא
  choice: Il viendra alors
  rationale: Le waw suivi de l’accompli poursuit ici la séquence prophétique. « Alors » exprime naturellement cette progression en français sans faire du waw un marqueur temporel univoque.
- source_word: בְּמַלְכוּת
  choice: dans le royaume
  rationale: מַלְכוּת désigne ici le territoire politique soumis au roi. Avec un verbe de mouvement, בְ peut recevoir une valeur directionnelle; « venir dans le royaume » reste naturel et conserve distinctement le verbe et la préposition.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: le roi du Sud
  rationale: Dans Daniel 11, l’expression sert de titre géopolitique au souverain méridional; « Sud » convient mieux que le toponyme « Néguev ».
- source_word: וְשָׁב
  choice: mais il retournera
  rationale: Le waw signifie formellement « et », mais la seconde proposition présente un retour qui contraste avec l’avancée précédente. « Mais » rend ce rapport discursif probable, tandis que la lecture strictement coordonnée est signalée en note.
- source_word: אֶל אַדְמָתוֹ
  choice: dans son pays
  rationale: אַדָמָה signifie littéralement « sol, terre ». Dans ce contexte politico-militaire, « pays » exprime naturellement le territoire auquel le roi retourne; le suffixe possessif est rendu par « son ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et soutenu. « Royaume » maintient le vocabulaire politique du passage; « pays » évite le littéralisme peu naturel de « sol » tout en gardant le sens territorial.
