source:
  edition: WLC
  text: וְ/עָשָׂ֞ה לְ/מִבְצְרֵ֤י מָֽעֻזִּים֙ עִם אֱל֣וֹהַּ נֵכָ֔ר אֲשֶׁ֥ר הכיר יַרְבֶּ֣ה כָב֑וֹד וְ/הִמְשִׁילָ/ם֙ בָּֽ/רַבִּ֔ים וַ/אֲדָמָ֖ה יְחַלֵּ֥ק בִּ/מְחִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/039.yaml
  text: And he will act against the strongest fortresses with a foreign god[a]. Those whom he acknowledges, he will increase with honor, and he will make them rule over many[d][c][b], and he will divide land for a price.
translation:
  language: fr
  text: Il agira contre les forteresses les plus puissantes[a] avec un dieu étranger[b]. Ceux qu’il reconnaîtra[c], il les comblera d’honneur et les fera gouverner beaucoup de gens. Il répartira aussi des terres contre paiement[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « envers les forteresses puissamment défendues » ou « pour les forteresses des lieux forts ». L’expression hébraïque est condensée et peut être comprise de plusieurs manières proches.
    reason: lexical_alternative
  - marker: b
    text: Ou « au moyen d’un dieu étranger ». La préposition traduite par « avec » peut exprimer l’accompagnement ou le moyen.
    reason: lexical_alternative
  - marker: c
    text: Ou « ceux qui le reconnaîtront ». L’hébreu a parfois été compris ainsi, bien que « ceux qu’il reconnaîtra » corresponde mieux à la forme verbale et au pronom qui suit.
    reason: alternative_reading
  - marker: d
    text: Ou « il répartira des terres pour un prix » ou « en récompense ». L’expression indique que les terres sont distribuées en échange d’une contrepartie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: Il agira
  rationale: Le verbe עשה est très large (« faire, agir »). Dans ce contexte militaire et politique, « agir » est naturel tout en évitant de préciser au-delà du texte la nature exacte de l’action.
- source_word: לְמִבְצְרֵי מָעֻזִּים
  choice: contre les forteresses les plus puissantes
  rationale: מִבְצָר désigne une place fortifiée et מָעוֹז la force ou un lieu fort. La préposition ל est comprise ici comme indiquant la direction hostile de l’action; le superlatif français rend naturellement l’intensité de l’expression condensée.
- source_word: עִם אֱלוֹהַּ נֵכָר
  choice: avec un dieu étranger
  rationale: עִם signifie normalement « avec » et peut ici exprimer aussi bien l’accompagnement que le moyen. La formulation française conserve cette ambiguïté.
- source_word: אֲשֶׁר הִכִּיר
  choice: Ceux qu’il reconnaîtra
  rationale: Le hifil de נכר signifie « reconnaître, agréer ». La forme verbale à la troisième personne du masculin singulier a le roi pour sujet selon la lecture syntaxique la plus directe, et le complément pluriel est repris par le suffixe de הִמְשִׁילָם.
- source_word: יַרְבֶּה כָבוֹד
  choice: il les comblera d’honneur
  rationale: L’expression hébraïque condensée signifie qu’il fera abonder l’honneur en leur faveur. « Combler d’honneur » exprime naturellement en français cette idée causative sans préciser la forme des distinctions accordées.
- source_word: וְהִמְשִׁילָם בָּרַבִּים
  choice: les fera dominer sur beaucoup
  rationale: Au hifil, משל signifie « faire régner, donner autorité ». « Sur beaucoup » garde l’indétermination de רַבִּים, qui peut viser de nombreuses personnes sans les identifier.
- source_word: וַאֲדָמָה יְחַלֵּק בִּמְחִיר
  choice: Il partagera aussi des terres contre paiement
  rationale: אֲדָמָה désigne la terre ou le sol, חלק au piel l’action de partager ou répartir, et מְחִיר un prix ou paiement. Le pluriel français « des terres » convient à une répartition territoriale, tandis que « contre paiement » maintient le caractère transactionnel sans décider s’il s’agit d’argent, d’une récompense ou d’une contrepartie politique.
theological_decisions:
- issue: Référent des personnes reconnues dans la deuxième proposition
  choice: Le roi reconnaît certains individus, puis leur accorde honneur et autorité.
  alternative: Ceux qui reconnaissent le roi, ou ceux qui reconnaissent le dieu étranger, reçoivent ces avantages.
  rationale: La syntaxe hébraïque prend le plus naturellement הִכִּיר comme un verbe à la troisième personne du masculin singulier dont le roi est le sujet. Cette lecture évite d’introduire une affirmation plus précise concernant les adorateurs du dieu étranger, tout en conservant la tension politico-religieuse du passage.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase reste proche de la structure hébraïque, mais la reprise pronominale (« Ceux qu’il reconnaîtra, il les… ») et « comblera d’honneur » assurent une lecture naturelle. Les ambiguïtés lexicales et syntaxiques importantes sont conservées dans les notes.
