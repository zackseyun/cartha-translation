id: DAN.11.17
reference: Daniel 11:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָשֵׂ֣ם פָּ֠נָי/ו לָ/ב֞וֹא בְּ/תֹ֧קֶף כָּל מַלְכוּת֛/וֹ וִ/ישָׁרִ֥ים עִמּ֖/וֹ וְ/עָשָׂ֑ה וּ/בַ֤ת הַ/נָּשִׁים֙ יִתֶּן ל֣/וֹ לְ/הַשְׁחִיתָ֔/הּ וְ/לֹ֥א תַעֲמֹ֖ד וְ/לֹא ל֥/וֹ תִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/017.yaml
  text: He will set his face to come with the strength of his whole kingdom[a], and upright terms will be with him; and he will act. He will give him the daughter of women to destroy it, but she will not stand[d][c][b], and she will not be for him.
translation:
  language: fr
  text: Il se disposera à venir avec toute la puissance de son royaume ; avec des conditions équitables[a], il agira. Il lui donnera la fille des femmes[b] pour la détruire[c]. Mais elle ne tiendra pas[d] et ne sera pas pour lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes droits seront avec lui », ou « il conclura un accord avec lui ». L’expression hébraïque, littéralement « des choses droites » ou « des hommes droits », est difficile dans ce contexte et peut désigner des personnes, des conditions équitables ou un accord.
    reason: alternative_reading
  - marker: b
    text: Littéralement « la fille des femmes » ; l’expression désigne probablement une fille royale donnée en mariage, dans le cadre d’une alliance politique.
    reason: cultural_note
  - marker: c
    text: Le pronom hébreu est féminin singulier. Il peut renvoyer à la femme (« pour la ruiner ») ou à une réalité de genre féminin, telle que la royauté ou l’entreprise politique.
    reason: lexical_alternative
  - marker: d
    text: Ou « mais cela ne tiendra pas », ou « mais elle ne réussira pas ». Le verbe au féminin peut renvoyer à la femme ou au projet.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשֵׂם פָּנָיו
  choice: Il décidera
  rationale: L’expression idiomatique signifie qu’il oriente résolument son intention vers l’action. « Il décidera » en restitue naturellement la détermination en français moderne.
- source_word: לָבוֹא
  choice: de venir
  rationale: Le verbe בוא reste général. « Venir » évite d’imposer le sens militaire plus précis d’« envahir ».
- source_word: בְּתֹקֶף כָּל מַלְכוּתוֹ
  choice: avec toute la puissance de son royaume
  rationale: תֹּקֶף désigne la force ou la puissance, et la tournure française exprime les ressources entières de son royaume.
- source_word: וִישָׁרִים עִמּוֹ
  choice: et des conditions équitables seront avec lui
  rationale: Dans ce contexte diplomatique difficile, le pluriel « choses droites » peut désigner des conditions justes ou un accord. La formulation demeure volontairement proche de la syntaxe hébraïque, tandis que les autres possibilités sont signalées en note.
- source_word: וְעָשָׂה
  choice: puis il agira
  rationale: עשה est très large. « Il agira » maintient cette indétermination sans préciser abusivement ce qu’il accomplira.
- source_word: וּבַת הַנָּשִׁים
  choice: la fille des femmes
  rationale: La traduction littérale conserve cette expression hébraïque inhabituelle, probablement appliquée ici à une fille royale donnée en mariage.
- source_word: יִתֶּן לוֹ
  choice: il lui donnera
  rationale: Rendu direct et idiomatique du transfert exprimé par נתן avec le pronom indirect.
- source_word: לְהַשְׁחִיתָהּ
  choice: pour la détruire
  rationale: 'Le suffixe féminin singulier est conservé par « la », dont le référent reste ambigu : la femme, ou une réalité féminine implicite telle que la royauté ou l’entreprise politique.'
- source_word: וְלֹא תַעֲמֹד
  choice: Mais elle ne tiendra pas
  rationale: Le féminin singulier peut renvoyer à la femme ou à l’entreprise. « Elle ne tiendra pas » préserve cette tension et l’image du verbe עמד.
- source_word: וְלֹא לוֹ תִהְיֶה
  choice: et ne sera pas pour lui
  rationale: Cette formulation conserve la brièveté et l’ambiguïté de l’hébreu entre appartenance, soutien et loyauté.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La traduction privilégie une équivalence optimale, avec une syntaxe fluide, tout en conservant dans le texte et les notes les ambiguïtés du passage concernant les « droits », la « fille des femmes » et les référents féminins.
