id: DAN.11.36
reference: Daniel 11:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עָשָׂ֨ה כִ/רְצוֹנ֜/וֹ הַ/מֶּ֗לֶךְ וְ/יִתְרוֹמֵ֤ם וְ/יִתְגַּדֵּל֙ עַל כָּל אֵ֔ל וְ/עַל֙ אֵ֣ל אֵלִ֔ים יְדַבֵּ֖ר נִפְלָא֑וֹת וְ/הִצְלִ֨יחַ֙ עַד כָּ֣לָה זַ֔עַם כִּ֥י נֶחֱרָצָ֖ה נֶעֱשָֽׂתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/036.yaml
  text: And the king will do as he pleases[a]. He will exalt himself and magnify himself above every god, and against the God of gods he will speak astonishing things. And he will prosper until the indignation is finished[c][b], for what has been decreed will be done.
translation:
  language: fr
  text: Le roi agira comme bon lui semblera. Il s’élèvera et se proclamera grand au-dessus de tous les dieux. Contre le Dieu des dieux, il proférera des paroles extraordinaires[a]. Il réussira jusqu’à ce que l’indignation prenne fin[b], car ce qui a été décrété s’accomplira[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des choses prodigieuses ». Le mot hébreu désigne ce qui est extraordinaire ou étonnant ; dans ce contexte, il peut évoquer des paroles choquantes et arrogantes.
    reason: Alternative lexicale préservant l’étendue de sens de נִפְלָאוֹת.
  - marker: b
    text: Ou « jusqu’à ce que la colère soit arrivée à son terme ».
    reason: Alternative lexicale pour זַעַם et כָּלָה.
  - marker: c
    text: Ou « car ce qui a été décidé sera réalisé ».
    reason: Alternative de traduction pour la décision arrêtée et son exécution.
lexical_decisions:
- source_word: וְעָשָׂה כִרְצוֹנוֹ
  choice: agira comme bon lui semblera
  rationale: L’expression signifie littéralement « agira selon sa volonté ». La formulation retenue est idiomatique en français actuel et exprime clairement l’autonomie souveraine que le roi revendique.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini est rendu directement, sans préciser son identité au-delà de ce que dit le verset.
- source_word: וְיִתְרוֹמֵם וְיִתְגַּדֵּל
  choice: il s’élèvera et se fera grand
  rationale: Les deux formes verbales expriment l’action réflexive du roi et leur juxtaposition intensifie son auto-exaltation. « Se fera grand » conserve cette nuance sans introduire l’idée différente de se glorifier.
- source_word: עַל כָּל אֵל
  choice: au-dessus de tout dieu
  rationale: Avec les verbes d’élévation et de grandeur, עַל exprime ici une supériorité revendiquée. Le singulier distributif « tout dieu » suit la formulation hébraïque.
- source_word: וְעַל אֵל אֵלִים
  choice: contre le Dieu des dieux
  rationale: Dans cette proposition, עַל marque l’hostilité de la parole. Le construit אֵל אֵלִים désigne naturellement le Dieu suprême dans ce contexte.
- source_word: יְדַבֵּר נִפְלָאוֹת
  choice: il proférera des paroles stupéfiantes
  rationale: נִפְלָאוֹת désigne des choses extraordinaires ou étonnantes. Le contexte hostile donne à ces paroles une force choquante, sans obliger à traduire explicitement par « blasphèmes ».
- source_word: וְהִצְלִיחַ
  choice: il réussira
  rationale: Le verbe peut signifier réussir ou prospérer. « Réussira » est naturel et exprime le succès temporaire du roi sans suggérer nécessairement une prospérité matérielle.
- source_word: עַד כָּלָה זַעַם
  choice: jusqu’à ce que l’indignation ait pris fin
  rationale: זַעַם peut désigner l’indignation ou la colère, probablement divine ici. La traduction conserve ce registre prophétique sans expliciter dans le texte principal celui qui éprouve cette indignation.
- source_word: כִּי נֶחֱרָצָה נֶעֱשָׂתָה
  choice: car ce qui a été décrété s’accomplira
  rationale: La formulation française rend à la fois la décision arrêtée et sa réalisation certaine, tout en restant naturelle.
theological_decisions:
- issue: Référent et majuscule de אֵל אֵלִים
  choice: « le Dieu des dieux », avec une majuscule
  alternative: « le dieu des dieux », comme désignation générique
  rationale: Le contexte oppose tous les dieux au Dieu suprême contre lequel le roi parle. La majuscule indique ce référent probable sans ajouter de qualification absente de l’hébreu.
- issue: Nature de זַעַם
  choice: « l’indignation », probablement divine, sans sujet explicité
  alternative: « la colère » ou « la fureur », éventuellement comprises de manière générale
  rationale: Dans le contexte prophétique de Daniel, le terme désigne vraisemblablement une période déterminée d’indignation divine. Ne pas ajouter « de Dieu » préserve toutefois la concision et l’implicite du texte source.
- issue: Caractère des paroles נִפְלָאוֹת
  choice: « des paroles stupéfiantes »
  alternative: « des choses prodigieuses » ou, de manière plus interprétative, « des paroles outrageantes »
  rationale: Le terme hébreu exprime d’abord le caractère extraordinaire des propos. Le contexte les rend choquants, mais le texte ne les qualifie pas directement de blasphèmes; la traduction maintient cette tension.
translation_notes:
  register: Français international moderne, clair et digne, avec un léger registre prophétique. Les répétitions et l’intensification de l’hébreu sont conservées autant que le permet un français naturel. Les marqueurs de notes ont été placés auprès des expressions auxquelles ils se rapportent.
