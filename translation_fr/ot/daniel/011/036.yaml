revisions:
- from: Le roi agira comme bon lui semblera. Il s’élèvera et se fera grand au-dessus de tout dieu. Contre le Dieu des dieux, il proférera des paroles stupéfiantes[a]. Il réussira jusqu’à ce que l’indignation ait pris fin[b], car ce qui a été décrété s’accomplira[c].
  to: Le roi agira comme bon lui semblera. Il s’élèvera et se proclamera grand au-dessus de tous les dieux. Contre le Dieu des dieux, il proférera des paroles extraordinaires[a]. Il réussira jusqu’à ce que l’indignation prenne fin[b], car ce qui a été décrété s’accomplira[c].
  rationale: La révision ne modifie pas le sens du passage. Elle rend plus idiomatiques la double auto-exaltation et le collectif « tous les dieux », maintient la majuscule contextuellement justifiée à « Dieu des dieux », et conserve l’indignation sans en expliciter le sujet. « Extraordinaires » évite de rendre intrinsèquement négatif un terme qui reste lexicalement large, tandis que la note signale la coloration hostile du contexte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:51:51Z'
