  naturalness: « Se fera grand » est compréhensible mais peu idiomatique en français international moderne. « Se proclamera grand » conserve l’auto-grandissement tout en étant plus naturel. « Tous les dieux » est plus idiomatique que le singulier distributif après « au-dessus de ».
  terminology: « Le Dieu des dieux », « indignation », « décrété » et « s’accomplira » sont appropriés et respectent le registre prophétique. « Paroles stupéfiantes » reste possible, mais « paroles extraordinaires » rend plus directement l’amplitude non explicitement péjorative de נִפְלָאוֹת; la note situe la nuance hostile du contexte.
