revisions:
- from: Quant à eux deux, les rois, leur cœur est tourné vers le mal. À la même table, ils se diront des mensonges, mais cela ne réussira pas[a], car la fin reste fixée au temps déterminé[b].
  to: Quant à eux deux, les rois, leurs cœurs sont tournés vers le mal. À la même table, ils diront des mensonges, mais cela ne réussira pas[a], car la fin attend encore le temps fixé[b].
  rationale: La révision retire la réciprocité non exprimée par le texte source, emploie un pluriel français naturel pour les dispositions des deux rois et rend la dernière clause comme une attente du temps fixé. Elle préserve l'indétermination du référent de « cela » et l'implication, sans explicitation doctrinale, d'un calendrier fixé.
