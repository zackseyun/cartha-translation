base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/027.yaml
  text: As for both of them[a], the kings—their hearts are set on evil, and at one table they will speak lies, but it will not succeed[c][b], for the end is still for the appointed time.
translation:
  language: fr
  text: Quant à eux deux, les rois, leurs cœurs sont tournés vers le mal. À la même table, ils diront des mensonges, mais cela ne réussira pas[a], car la fin attend encore le temps fixé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais leur entreprise ne prospérera pas ». Le verbe hébreu est au féminin singulier et semble être employé ici de manière impersonnelle, à propos de leur projet ou de son résultat.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car la fin est encore pour le temps fixé ». La formulation souligne que l''issue attend un moment déterminé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵיהֶם הַמְּלָכִים
  choice: Quant à eux deux, les rois
  rationale: Cette formulation rend la mise en relief des deux souverains déjà évoqués tout en conservant l'apposition « les rois ».
- source_word: לְבָבָם לְמֵרָע
  choice: leur cœur est tourné vers le mal
  rationale: Le singulier collectif « leur cœur » suit l'hébreu et exprime leur intention commune et résolument mauvaise dans un français naturel.
- source_word: וְעַל שֻׁלְחָן אֶחָד
  choice: À la même table
  rationale: Cette expression naturelle conserve l'image d'une table partagée, probablement dans un cadre diplomatique ou de banquet.
- source_word: כָּזָב יְדַבֵּרוּ
  choice: ils se diront des mensonges
  rationale: כָּזָב désigne le mensonge ou la fausseté. Le pronom réciproque explicite naturellement en français la tromperie mutuelle suggérée par les deux rois assis ensemble.
- source_word: וְלֹא תִצְלָח
  choice: mais cela ne réussira pas
  rationale: Le verbe féminin singulier est vraisemblablement employé de manière impersonnelle au sujet de leur entreprise, de leur tromperie ou de son résultat; « cela » préserve cette indétermination.
- source_word: כִּי עוֹד קֵץ לַמּוֹעֵד
  choice: car la fin reste fixée au temps déterminé
  rationale: La formulation conserve l'idée que la fin dépend encore d'un moment fixé, sans ajouter explicitement qui l'a déterminé.
theological_decisions:
- issue: La souveraineté divine impliquée par le temps déterminé
  choice: Conserver l'énoncé temporel sans nommer explicitement Dieu
  alternative: « car la fin attend encore le temps fixé par Dieu »
  rationale: Dans Daniel, le temps fixé implique fortement la souveraineté divine, mais Dieu n'est pas nommé dans cette proposition. La traduction ne rend donc pas explicite ce que le texte laisse implicite.
- issue: Le référent de « cela ne réussira pas »
  choice: Maintenir un référent impersonnel et ouvert
  alternative: « mais leur complot ne réussira pas »
  rationale: L'hébreu ne nomme pas expressément un complot. « Cela » peut viser leurs mensonges, leur entreprise ou l'issue recherchée, et préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe garde la mise en relief initiale et l'image de la table commune. Les notes signalent l'impersonnalité du verbe et la formulation temporelle inhabituelle sans surinterprétation théologique.
