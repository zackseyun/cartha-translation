  text: וּ/מַשְׂכִּ֣ילֵי עָ֔ם יָבִ֖ינוּ לָֽ/רַבִּ֑ים וְ/נִכְשְׁל֞וּ בְּ/חֶ֧רֶב וּ/בְ/לֶהָבָ֛ה בִּ/שְׁבִ֥י וּ/בְ/בִזָּ֖ה יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/033.yaml
  text: And those among the people who have insight will give understanding to the many[a], but they will stumble by sword and by flame, by captivity and by plunder[d][c][b], for days.
translation:
  language: fr
  text: Ceux qui, parmi le peuple, auront du discernement[a] instruiront beaucoup de gens. Mais ils tomberont[b] par l’épée et par la flamme, par la captivité[c] et par le pillage, pendant des jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « les sages parmi le peuple ». On peut aussi rendre la suite par : « feront comprendre beaucoup de gens » ou « donneront du discernement à la multitude ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « trébucheront ». L’image hébraïque peut évoquer la défaite, l’effondrement ou la mort au cours de la persécution.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « en étant emmenés en captivité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּילֵי עָם
  choice: Ceux qui, parmi le peuple, auront du discernement
  rationale: Cette formulation conserve le sens participial de מַשְׂכִּילֵי, qui désigne des personnes douées de discernement, et rend עָם par « le peuple » sans préciser explicitement Israël au-delà de l’hébreu.
- source_word: יָבִינוּ לָרַבִּים
  choice: instruiront beaucoup de gens
  rationale: 'Le hiphil de בין a ici une valeur causative : ces personnes communiquent la compréhension à d’autres. « Instruiront » exprime naturellement cette idée en français, tandis que « beaucoup de gens » rend le substantif pluriel רַבִּים sans la tournure peu idiomatique « les nombreux ».'
- source_word: וְנִכְשְׁלוּ
  choice: Mais ils tomberont
  rationale: כשל évoque le fait de trébucher ou de tomber et peut couvrir la défaite, l’effondrement ou la mort. « Tomberont » reste imagé et convient mieux que « trébucheront » à la série de persécutions qui suit.
- source_word: בְּחֶרֶב וּבְלֶהָבָה
  choice: par l’épée et par la flamme
  rationale: La répétition de « par » reflète les prépositions instrumentales, et « flamme » garde l’image précise de לֶהָבָה plutôt que de la généraliser en « feu ».
- source_word: בִּשְׁבִי וּבְבִזָּה
  choice: par la captivité et par le pillage
  rationale: La traduction maintient le parallélisme des quatre épreuves introduites par בְּ. « Pillage » désigne clairement l’action et les pertes associées à בִּזָּה.
- source_word: יָמִים
  choice: pendant quelque temps
  rationale: Le pluriel nu « jours » exprime ici une durée indéterminée. « Pendant quelque temps » est naturel en français et n’impose aucune durée précise; le sens littéral est signalé en note.
theological_decisions:
- issue: Faut-il comprendre וְנִכְשְׁלוּ comme une mort certaine ou conserver la portée plus large de l’image de la chute ?
  choice: Mais ils tomberont
  alternative: Mais ils trébucheront / succomberont
  rationale: « Tomberont » préserve l’image hébraïque et laisse ouvertes la défaite, la persécution et la mort, sans affirmer que chaque personne mentionnée mourra.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant le parallélisme des quatre formes de persécution et l’indétermination de leur durée.
