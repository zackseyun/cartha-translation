  - severity: low
    issue: La note a est ancrée après « beaucoup de gens » alors qu’elle porte aussi sur « Ceux qui... auront du discernement ».
    rationale: Déplacer l’ancre après « discernement » rend l’attachement de la note lexicalement clair. La note peut aussi signaler l’alternative « les sages » correspondant à מַשְׂכִּילֵי.
