  text: וְ/נִשָּׂ֥א הֶ/הָמ֖וֹן ירום לְבָב֑/וֹ וְ/הִפִּ֛יל רִבֹּא֖וֹת וְ/לֹ֥א יָעֽוֹז׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/012.yaml
  text: And when the multitude is carried away[a], his heart will be lifted up, and he will cast down tens of thousands[c][b], but he will not prevail.
translation:
  language: fr
  text: Quand la multitude aura été emportée[a], son cœur s’enorgueillira[b] ; il fera tomber des dizaines de milliers, mais il ne triomphera pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aura été élevée » ou « aura été enlevée ». Le verbe hébreu peut exprimer le fait d’être élevé, emporté ou ôté ; le contexte d’une défaite militaire favorise « emportée ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son cœur s’élèvera », expression hébraïque signifiant qu’il deviendra orgueilleux.
    reason: cultural_note
  - marker: c
    text: Ou « il ne deviendra pas puissant ». L’hébreu peut souligner soit son incapacité à triompher, soit son incapacité à consolider sa puissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשָּׂא
  choice: Quand … aura été emportée
  rationale: Le nifal de נשׂא peut signifier « être élevé », « être emporté » ou « être enlevé ». Dans ce contexte militaire, « être emportée » évoque le plus naturellement la multitude balayée par la défaite. La tournure temporelle rend clairement l’enchaînement des propositions.
- source_word: הֶהָמוֹן
  choice: cette multitude
  rationale: הָמוֹן désigne une multitude, une masse ou une foule. Le contexte évoque probablement des troupes, mais « multitude » conserve l’étendue du terme sans préciser excessivement.
- source_word: ירום לְבָבוֹ
  choice: son cœur s’élèvera
  rationale: L’expression hébraïque décrit l’orgueil au moyen de l’image d’un cœur qui s’élève. La traduction conserve cette image, intelligible en français, tandis qu’une note en explicite le sens idiomatique.
- source_word: וְהִפִּיל
  choice: il fera tomber
  rationale: Le hifil de נפל signifie littéralement « faire tomber ». Dans un contexte guerrier, il s’agit de vaincre ou d’abattre, mais cette formulation conserve la valeur causative du verbe.
- source_word: רִבֹּאוֹת
  choice: des dizaines de milliers
  rationale: Le pluriel רִבֹּאוֹת désigne des nombres très élevés, littéralement des « dizaines de milliers » ou des « myriades ». La formulation retenue est claire en français moderne.
- source_word: וְלֹא יָעוֹז
  choice: mais il ne triomphera pas
  rationale: Le verbe עוז peut exprimer le fait d’être fort, de devenir puissant ou de l’emporter. « Ne triomphera pas » rend naturellement, dans le contexte, l’idée que ce succès ne débouchera pas sur une victoire durable, tout en signalant l’autre nuance possible en note.
