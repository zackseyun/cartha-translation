  text: וּ/מִן הִֽתְחַבְּר֥וּת אֵלָ֖י/ו יַעֲשֶׂ֣ה מִרְמָ֑ה וְ/עָלָ֥ה וְ/עָצַ֖ם בִּ/מְעַט גּֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/023.yaml
  text: And from the time of an alliance with him[a], he will act deceitfully; and he will rise and become strong with a small nation.
translation:
  language: fr
  text: Après s’être allié avec lui, il agira avec perfidie ; il s’élèvera et deviendra puissant avec une petite nation[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec peu de gens ». L’expression hébraïque est concise et peut désigner soit une petite nation, soit le petit nombre de personnes grâce auxquelles il devient puissant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הִתְחַבְּרוּת אֵלָיו
  choice: Dès qu’il se sera allié avec lui
  rationale: Le nom verbal הִתְחַבְּרוּת désigne ici une alliance ou association politique. La tournure française exprime naturellement le point de départ temporel marqué par וּמִן, sans perdre le rapport d’alliance avec « lui ».
- source_word: יַעֲשֶׂה מִרְמָה
  choice: il agira avec perfidie
  rationale: Littéralement « il fera [de] la tromperie ». « Agir avec perfidie » rend idiomatiquement la conduite trompeuse et potentiellement déloyale indiquée par מִרְמָה.
- source_word: וְעָלָה
  choice: il s’élèvera
  rationale: עלה signifie monter ou s’élever ; dans ce contexte politique, « s’élever » conserve l’image tout en évoquant une montée en puissance.
- source_word: וְעָצַם
  choice: et deviendra puissant
  rationale: Le verbe exprime le fait de devenir fort ou puissant. « Deviendra puissant » convient au contexte de l’ascension d’un dirigeant.
- source_word: בִּמְעַט גּוֹי
  choice: avec une petite nation
  rationale: La formule compacte peut décrire soit une nation de faible importance ou peu nombreuse, soit un petit nombre de personnes servant d’appui. Le texte principal garde la lecture syntaxiquement directe, et la note préserve l’autre possibilité.
theological_decisions: []
