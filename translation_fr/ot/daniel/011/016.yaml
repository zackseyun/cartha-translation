id: DAN.11.16
reference: Daniel 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יַ֨עַשׂ הַ/בָּ֤א אֵלָי/ו֙ כִּ/רְצוֹנ֔/וֹ וְ/אֵ֥ין עוֹמֵ֖ד לְ/פָנָ֑י/ו וְ/יַעֲמֹ֥ד בְּ/אֶֽרֶץ הַ/צְּבִ֖י וְ/כָלָ֥ה בְ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/016.yaml
  text: And the one who comes against him will do as he pleases[a], and no one will stand before him. He will stand in the Beautiful Land[b], and it will be consumed in his hand.
translation:
  language: fr
  text: Celui qui marchera contre lui agira à sa guise, sans que personne puisse lui résister. Il prendra position dans le Pays magnifique[a], et la destruction sera entre ses mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays de splendeur ». L’expression hébraïque désigne un pays remarquable par sa beauté ou sa splendeur et renvoie ici au pays d’Israël/Juda.
    reason: lexical_alternative
  - marker: b
    text: Ou « et il le ravagera entièrement ». L’expression hébraïque est concise et peut souligner soit le pouvoir destructeur qu’il détient, soit la ruine infligée au pays.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַעַשׂ
  choice: agira
  rationale: Le verbe עשה signifie fondamentalement « faire, agir ». Dans ce contexte politico-militaire, « agira » est naturel et conserve la portée générale du verbe.
- source_word: הַבָּא אֵלָיו
  choice: Celui qui marchera contre lui
  rationale: אֶל signifie normalement « vers », mais le contexte d’affrontement donne ici au mouvement une valeur hostile. « Marchera contre lui » rend clairement cette progression militaire.
- source_word: כִּרְצוֹנוֹ
  choice: à sa guise
  rationale: L’expression signifie littéralement « selon sa volonté ». « À sa guise » exprime en français actuel sa liberté d’action sans entrave.
- source_word: וְאֵין עוֹמֵד לְפָנָיו
  choice: sans que personne puisse lui résister
  rationale: L’image hébraïque de quelqu’un qui se tient devant lui exprime, dans ce contexte militaire, la capacité de lui tenir tête. La formulation française explicite cet idiome sans ajouter de précision étrangère au texte.
- source_word: וְיַעֲמֹד
  choice: Il prendra position
  rationale: עמד signifie « se tenir, prendre position ». Ici, la formulation suggère l’établissement d’une présence militaire tout en conservant l’image spatiale du texte.
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: dans le Pays magnifique
  rationale: צְבִי peut désigner la beauté, la splendeur ou ce qui est désirable. « Pays magnifique » fonctionne comme un titre géographique compréhensible et renvoie ici au pays d’Israël/Juda.
- source_word: וְכָלָה בְיָדוֹ
  choice: et la destruction sera entre ses mains
  rationale: La proposition est brève et elliptique. כָלָה peut évoquer l’achèvement, la fin ou la destruction, tandis que בְיָדוֹ indique ce qui se trouve en son pouvoir. La traduction conserve cette image sans décider explicitement si le pays est détruit ou si le conquérant détient le pouvoir de détruire.
theological_decisions:
- issue: Référent du « Pays magnifique »
  choice: Une désignation du pays d’Israël/Juda dans la vision de Daniel
  alternative: Une désignation plus générale, « le pays de splendeur », sans identification explicite
  rationale: Dans le contexte géographique et narratif de Daniel, l’expression renvoie au territoire d’Israël/Juda. Le texte principal garde toutefois le caractère figuré du titre au lieu d’insérer directement cette identification.
- issue: Sens de la dernière proposition
  choice: La destruction est présentée comme étant entre les mains du conquérant
  alternative: Le pays sera entièrement ravagé par lui
  rationale: L’hébreu est compact et permet de mettre l’accent soit sur le pouvoir destructeur du conquérant, soit sur la ruine subie par le pays. Le texte principal conserve cette tension, et la note donne l’autre lecture possible.
translation_notes:
  register: Français international moderne, clair et digne. Le style garde la tonalité prophétique sans archaïsmes. Les formulations « à sa guise », « prendre position » et « entre ses mains » rendent naturellement les idiomes hébreux tout en préservant l’ambiguïté de la dernière proposition.
