  text: וּ/מָשַׁ֗ל בְּ/מִכְמַנֵּי֙ הַ/זָּהָ֣ב וְ/הַ/כֶּ֔סֶף וּ/בְ/כֹ֖ל חֲמֻד֣וֹת מִצְרָ֑יִם וְ/לֻבִ֥ים וְ/כֻשִׁ֖ים בְּ/מִצְעָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/043.yaml
  text: And he will rule over the treasures of gold and silver[a], and over all the precious things of Egypt[b]; and the Libyans and Cushites will be in his train.
translation:
  language: fr
  text: Il contrôlera les réserves cachées d’or et d’argent[a], ainsi que tous les biens précieux de l’Égypte. Les Libyens et les Koushites seront à sa suite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les trésors cachés d’or et d’argent ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « dans ses pas » ; autre traduction possible : « suivront ses pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁל
  choice: Il contrôlera
  rationale: Le verbe משל exprime ici l’exercice d’une domination ou d’un contrôle. « Contrôlera » convient à des richesses placées sous son pouvoir et reste naturel en français moderne.
- source_word: בְּמִכְמַנֵּי
  choice: les réserves cachées
  rationale: מִכְמָן désigne ce qui est dissimulé et gardé en réserve, notamment un dépôt précieux. Cette formulation conserve à la fois l’idée de richesse et celle de biens cachés.
- source_word: הַזָּהָב וְהַכֶּסֶף
  choice: d’or et d’argent
  rationale: Rendu direct des deux métaux précieux, sans explicitation inutile.
- source_word: וּבְכֹל חֲמֻדוֹת מִצְרָיִם
  choice: ainsi que tous les biens précieux de l’Égypte
  rationale: חֲמֻדוֹת désigne des choses désirables ou précieuses. « Biens précieux » exprime leur valeur sans limiter le sens à de l’argent ou à des trésors monétaires.
- source_word: לֻבִים
  choice: les Libyens
  rationale: L’ethnonyme désigne conventionnellement des peuples libyens; la forme française usuelle est claire et naturelle.
- source_word: כֻשִׁים
  choice: les Koushites
  rationale: « Koushites » conserve le nom historique et géographique de Koush sans l’identifier de façon anachronique à l’Éthiopie moderne.
- source_word: בְּמִצְעָדָיו
  choice: seront à sa suite
  rationale: L’expression évoque les pas, la marche ou le cortège de cet homme. « Seront à sa suite » préserve l’idée qu’ils l’accompagnent ou le suivent, sans préciser indûment s’ils sont alliés, sujets ou captifs.
theological_decisions:
- issue: Statut des Libyens et des Koushites dans l’avancée du roi
  choice: seront à sa suite
  alternative: marcheront sur ses pas
  rationale: Le texte indique qu’ils se trouvent dans ses pas ou sa marche, mais ne précise pas la nature exacte de leur relation avec lui. La traduction maintient cette indétermination.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’hébreu tout en évitant des tournures peu idiomatiques comme « dominer sur ». « Koushites » privilégie la précision historique, et « à sa suite » conserve l’ambiguïté de leur statut.
