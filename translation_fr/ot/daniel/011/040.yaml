id: DAN.11.40
reference: Daniel 11:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/עֵ֣ת קֵ֗ץ יִתְנַגַּ֤ח עִמּ/וֹ֙ מֶ֣לֶךְ הַ/נֶּ֔גֶב וְ/יִשְׂתָּעֵ֨ר עָלָ֜י/ו מֶ֣לֶךְ הַ/צָּפ֗וֹן בְּ/רֶ֨כֶב֙ וּ/בְ/פָ֣רָשִׁ֔ים וּ/בָ/אֳנִיּ֖וֹת רַבּ֑וֹת וּ/בָ֥א בַ/אֲרָצ֖וֹת וְ/שָׁטַ֥ף וְ/עָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/040.yaml
  text: At the time of the end[a], the king of the South will clash with him, and the king of the North will storm against him with chariots, horsemen, and many ships[d][c][b]; he will enter into the lands and sweep through and pass on.
translation:
  language: fr
  text: Au temps de la fin, le roi du Sud se heurtera à lui[a], et le roi du Nord fondra sur lui[b] avec des chars, des cavaliers et de nombreux navires. Il entrera dans les pays[c], déferlera et poursuivra sa route.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le référent de « lui » n’est pas précisé dans le texte hébreu; son identification dépend de l’interprétation du contexte.
    reason: alternative_reading
  - marker: b
    text: Ou « se précipitera contre lui comme une tempête ». Le verbe évoque un mouvement violent et impétueux.
    reason: lexical_alternative
  - marker: c
    text: Ou « territoires ». Le pluriel hébreu peut désigner plusieurs terres, territoires ou pays.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת קֵץ
  choice: Au temps de la fin
  rationale: Expression temporelle naturelle en français qui conserve l’idée de la période finale sans en préciser indûment la chronologie.
- source_word: יִתְנַגַּח עִמּוֹ
  choice: se heurtera à lui
  rationale: Le hitpael de נגח évoque littéralement le fait de donner des coups de corne et, au figuré, un affrontement hostile. « Se heurtera à » en garde la vigueur et la valeur conflictuelle.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: le roi du Sud
  rationale: Titre géopolitique récurrent dans Daniel 11; « Sud » est clair et conforme à sa fonction contextuelle.
- source_word: וְיִשְׂתָּעֵר עָלָיו
  choice: fondra sur lui
  rationale: Rend en français courant le mouvement impétueux et violent porté par le verbe, sans transformer explicitement l’image en comparaison avec une tempête.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: le roi du Nord
  rationale: Titre géopolitique récurrent, rendu parallèlement à « roi du Sud ».
- source_word: בְּרֶכֶב וּבְפָרָשִׁים וּבָאֳנִיּוֹת רַבּוֹת
  choice: avec des chars, des cavaliers et de nombreux navires
  rationale: Restitue naturellement en français l’énumération des forces militaires terrestres et navales.
- source_word: וּבָא בָאֲרָצוֹת
  choice: Il entrera dans les pays
  rationale: Le pluriel אֲרָצוֹת peut désigner plusieurs pays ou territoires. « Entrera dans » reste proche de la construction hébraïque sans expliciter l’invasion.
- source_word: וְשָׁטַף
  choice: déferlera
  rationale: Conserve la métaphore d’un flot débordant tout en l’appliquant naturellement à une avance militaire.
- source_word: וְעָבָר
  choice: poursuivra sa route
  rationale: Exprime la progression successive indiquée par עבר sans répéter « traversera » après l’image de déferlement.
theological_decisions:
- issue: Référent des pronoms « lui »
  choice: Conserver les pronoms sans identifier leur référent
  alternative: Identifier le référent comme le souverain évoqué auparavant, un dirigeant eschatologique final, ou l’un des deux rois selon un système d’interprétation
  rationale: L’hébreu emploie seulement le pronom et n’en répète pas explicitement l’antécédent dans ce verset. Le laisser indéterminé préserve l’ambiguïté du texte et évite d’imposer un scénario eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le rythme de l’avancée militaire, l’image du flot et l’indétermination des pronoms. Tous les appels de notes figurent dans le texte à l’endroit pertinent.
