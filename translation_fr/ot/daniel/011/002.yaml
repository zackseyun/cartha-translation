reference: Daniel 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֱמֶ֖ת אַגִּ֣יד לָ֑/ךְ הִנֵּה עוֹד֩ שְׁלֹשָׁ֨ה מְלָכִ֜ים עֹמְדִ֣ים לְ/פָרַ֗ס וְ/הָֽ/רְבִיעִי֙ יַעֲשִׁ֤יר עֹֽשֶׁר גָּדוֹל֙ מִ/כֹּ֔ל וּ/כְ/חֶזְקָת֣/וֹ בְ/עָשְׁר֔/וֹ יָעִ֣יר הַ/כֹּ֔ל אֵ֖ת מַלְכ֥וּת יָוָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/002.yaml
  text: 'And now I will tell you the truth: behold[a], three more kings will arise for Persia, and the fourth will become far richer than all of them; and when he becomes strong through his riches[c][b], he will stir up everyone against the kingdom of Greece.'
translation:
  language: fr
  text: 'Et maintenant, je vais te dire la vérité : voici, trois autres rois se lèveront en Perse[a], puis le quatrième deviendra beaucoup plus riche que tous les autres[b]. Quand il sera devenu puissant grâce à ses richesses, il mobilisera tout le monde contre le royaume de Grèce[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se lèveront pour la Perse »; littéralement : « se tiendront / se lèveront pour la Perse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « acquerra une immense richesse, plus que tous les autres ».'
    reason: lexical_alternative
  - marker: c
    text: Le terme rendu par « tout le monde » peut aussi se traduire par « tout ». La relation hostile envers le royaume de Grèce est comprise d’après le contexte; la construction hébraïque est discutée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et la progression temporelle du discours.
- source_word: אֱמֶת אַגִּיד לָךְ
  choice: je vais te dire la vérité
  rationale: Rend naturellement en français moderne l’annonce solennelle d’une révélation véridique.
- source_word: הִנֵּה
  choice: voici
  rationale: Préserve la valeur déictique et emphatique sans employer l’archaïsme « voici que ».
- source_word: עוֹד שְׁלֹשָׁה מְלָכִים
  choice: trois autres rois
  rationale: עוֹד exprime ici l’addition; « trois autres » est idiomatique et précis.
- source_word: עֹמְדִים לְפָרַס
  choice: se lèveront pour la Perse
  rationale: Dans un contexte de succession royale, עמד signifie « se lever, surgir ». « Pour la Perse » garde la relation exprimée par לְ sans la transformer silencieusement en localisation.
- source_word: וְהָרְבִיעִי
  choice: puis le quatrième
  rationale: « Puis » marque naturellement la succession tout en rendant la conjonction hébraïque.
- source_word: יַעֲשִׁיר עֹשֶׁר גָּדוֹל מִכֹּל
  choice: deviendra beaucoup plus riche que tous les autres
  rationale: Le verbe et son nom apparenté intensifient l’enrichissement; la comparaison est explicitée naturellement.
- source_word: וּכְחֶזְקָתוֹ בְעָשְׁרוֹ
  choice: Quand il sera devenu puissant grâce à ses richesses
  rationale: כְ est compris comme temporel ou circonstanciel, tandis que בְ indique que ses richesses constituent le moyen ou le fondement de sa puissance.
- source_word: יָעִיר הַכֹּל
  choice: il mobilisera tout le monde
  rationale: Le hiphil de עור évoque l’action de réveiller, soulever ou mettre en mouvement. Dans ce contexte politico-militaire, « mobilisera » rend clairement cette force, et « tout le monde » interprète הַכֹּל comme collectif humain.
- source_word: אֵת מַלְכוּת יָוָן
  choice: contre le royaume de Grèce
  rationale: Dans le contexte, le royaume grec est la cible de la mobilisation. « Royaume » rend מַלְכוּת et « Grèce » le nom יָוָן.
theological_decisions:
- issue: Sens historico-politique de la dernière proposition
  choice: Le quatrième roi perse mobilise tous ceux qui sont sous son autorité contre le royaume de Grèce.
  alternative: Il met tout en mouvement, y compris le royaume de Grèce, ou en faveur de celui-ci.
  rationale: La lecture adversative convient au contexte de conflit et à l’emploi de עור avec הַכֹּל. Elle relève surtout d’une décision syntaxique et contextuelle, sans identifier explicitement le roi à un personnage historique particulier.
- issue: Portée de הַכֹּל
  choice: 'Collectif humain : « tout le monde ».'
  alternative: 'Totalité indéfinie : « tout » ou « toutes choses ».'
  rationale: L’action politico-militaire de mobiliser favorise une référence aux personnes, tout en laissant la note signaler la formulation plus littérale.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement respecte le singulier de לָךְ et la continuité du discours angélique à Daniel. « Voici » maintient la solennité prophétique; « mobilisera » clarifie le contexte politique sans préciser au-delà du texte la forme exacte de l’action.
