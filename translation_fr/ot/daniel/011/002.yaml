    issue: « Se lèveront pour la Perse » est ambigu et peu idiomatique.
    rationale: Le לְ de לְפָרַס marque la relation de ces rois avec la Perse dans une formule de succession. En français, « pour la Perse » suggère facilement une finalité ou une représentation. « En Perse » exprime naturellement qu’il s’agit de rois perses, sans ajouter d’identification historique.
  - severity: medium
    issue: La note c présente comme littérale une traduction qui interprète déjà la relation hostile envers la Grèce.
    rationale: La préposition française « contre » ne correspond pas littéralement à un mot hébreu indépendant dans cette séquence; elle résulte d’une compréhension contextuelle de יָעִיר הַכֹּל אֵת מַלְכוּת יָוָן. La note doit signaler que la construction et le référent de « tout » admettent une autre compréhension.
