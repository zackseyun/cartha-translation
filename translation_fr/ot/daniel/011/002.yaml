revisions:
- from: 'Et maintenant, je vais te dire la vérité : voici, trois autres rois se lèveront pour la Perse[a], puis le quatrième deviendra beaucoup plus riche que tous les autres[b]. Quand il sera devenu puissant grâce à ses richesses, il mobilisera tout le monde contre le royaume de Grèce[c].'
  to: 'Et maintenant, je vais te dire la vérité : voici, trois autres rois se lèveront en Perse[a], puis le quatrième deviendra beaucoup plus riche que tous les autres[b]. Quand il sera devenu puissant grâce à ses richesses, il mobilisera tout le monde contre le royaume de Grèce[c].'
