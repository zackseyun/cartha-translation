source:
  edition: WLC
  text: וְ/עַל אֱלֹהֵ֤י אֲבֹתָי/ו֙ לֹ֣א יָבִ֔ין וְ/עַל חֶמְדַּ֥ת נָשִׁ֛ים וְ/עַֽל כָּל אֱל֖וֹהַּ לֹ֣א יָבִ֑ין כִּ֥י עַל כֹּ֖ל יִתְגַּדָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/037.yaml
  text: He will show no regard for the gods of his fathers[a], or for the desire of women, or for any god[b], because he will magnify himself above all.
translation:
  language: fr
  text: Il ne tiendra compte ni des dieux de ses pères[a], ni du désir des femmes[b], ni d’aucun dieu, car il s’élèvera au-dessus de tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Dieu de ses pères ». La forme hébraïque est au pluriel (« dieux de »), mais certains y voient l’expression biblique habituelle désignant le Dieu d’Israël.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu : « le désir des femmes ». Cette expression peut désigner « ce que les femmes désirent » ou « celui que les femmes désirent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: les dieux de ses pères
  rationale: La forme construite אֱלֹהֵי est morphologiquement plurielle et le contexte évoque aussi « aucun dieu ». « Pères » suit de près le texte hébreu, tandis que la lecture traditionnelle au singulier est signalée en note.
- source_word: לֹא יָבִין
  choice: il n’aura égard
  rationale: Avec עַל, le verbe בין exprime ici l’attention ou la considération plutôt que la seule compréhension intellectuelle. Cette tournure française rend naturellement cette valeur contextuelle.
- source_word: חֶמְדַּת נָשִׁים
  choice: le désir des femmes
  rationale: 'Cette formulation directe conserve l’ambiguïté du groupe construit hébreu : il peut s’agir de ce que les femmes désirent ou de celui qu’elles désirent.'
- source_word: כָּל אֱלוֹהַּ
  choice: aucun dieu
  rationale: 'Dans une phrase négative, כָּל suivi du singulier אֱלוֹהַּ prend naturellement un sens distributif : « aucun dieu ».'
- source_word: כִּי עַל כֹּל יִתְגַּדָּל
  choice: car il s’élèvera au-dessus de tout
  rationale: Le hitpael de גדל marque l’auto-exaltation. « S’élèvera » en restitue le sens réflexif, et « au-dessus de tout » préserve la portée générale de עַל כֹּל.
theological_decisions:
- issue: Interprétation de חֶמְדַּת נָשִׁים
  choice: Conserver « le désir des femmes » dans le texte principal.
  alternative: « ce que les femmes désirent » ou « celui que les femmes désirent »
  rationale: L’hébreu est réellement ambigu. La traduction ne précise donc ni une réalité générale ni une personne ou divinité particulière.
- issue: Nombre de אֱלֹהֵי אֲבֹתָיו
  choice: 'Employer le pluriel : « les dieux de ses pères ».'
  alternative: « le Dieu de ses pères »
  rationale: La morphologie et le contexte favorisent ici le pluriel, sans exclure la lecture traditionnelle au singulier, qui est indiquée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La construction avec « ni… ni… ni… » rend naturellement l’énumération hébraïque tout en conservant ses trois éléments. Les deux ambiguïtés interprétatives importantes sont maintenues ou signalées sans ajout confessionnel.
