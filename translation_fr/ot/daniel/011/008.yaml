revisions:
- from: Il emportera aussi en Égypte, comme butin, leurs dieux, leurs statues de métal fondu et leurs objets précieux en argent et en or. Pendant quelques années, il se tiendra à l’écart du roi du Nord.[a]
  to: Il emportera aussi en Égypte, comme butin, leurs dieux, leurs statues de métal fondu et leurs objets précieux en argent et en or. Pendant des années, il se tiendra à l’écart du roi du Nord.[a]
  rationale: La révision supprime l’implication non exprimée d’un nombre limité d’années et améliore la formulation française de la première lecture comparative en note. Elle maintient la structure, le sens militaire de butin, l’ambiguïté syntaxique de la clause finale et l’ancre de note.
