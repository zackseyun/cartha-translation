  variant: modern international French
source:
  edition: WLC
  text: וְ/גַ֣ם אֱֽלֹהֵי/הֶ֡ם עִם נְסִֽכֵי/הֶם֩ עִם כְּלֵ֨י חֶמְדָּתָ֜/ם כֶּ֧סֶף וְ/זָהָ֛ב בַּ/שְּׁבִ֖י יָבִ֣א מִצְרָ֑יִם וְ/הוּא֙ שָׁנִ֣ים יַעֲמֹ֔ד מִ/מֶּ֖לֶךְ הַ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/008.yaml
  text: He will also carry off to Egypt their gods[a], with their cast images and with their precious vessels of silver and gold, as plunder; and for some years he will stand aloof from the king of the north.
translation:
  language: fr
  text: Il emportera aussi en Égypte, comme butin, leurs dieux, leurs statues de métal fondu et leurs objets précieux en argent et en or. Pendant des années, il se tiendra à l’écart du roi du Nord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il se maintiendra des années de plus que le roi du Nord », ou : « il restera plus fort que le roi du Nord pendant des années ». La proposition hébraïque est condensée et peut être comprise comme une comparaison plutôt que comme un éloignement.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: aussi
  rationale: Rend naturellement la valeur additive et légèrement emphatique de l’expression.
- source_word: אֱלֹהֵיהֶם
  choice: leurs dieux
  rationale: Traduction directe du pluriel avec suffixe possessif, sans ajouter dans le texte principal le terme interprétatif « idoles ».
- source_word: נְסִכֵיהֶם
  choice: leurs statues de métal fondu
  rationale: Le nom désigne ici des représentations fabriquées par fonte; cette formulation moderne explicite le procédé sans archaïsme.
- source_word: כְּלֵי חֶמְדָּתָם
  choice: leurs objets précieux
  rationale: כְּלֵי est un terme large pouvant désigner des récipients, ustensiles ou objets; « objets précieux » reste naturel et évite de préciser indûment leur fonction.
- source_word: כֶּסֶף וְזָהָב
  choice: en argent et en or
  rationale: La formulation française indique naturellement la matière des objets précieux.
- source_word: בַּשְּׁבִי
  choice: comme butin
  rationale: Dans ce contexte militaire, l’expression qualifie les biens saisis et emportés plutôt qu’une captivité de personnes.
- source_word: יָבִא מִצְרָיִם
  choice: il emportera en Égypte
  rationale: Le hifil de בוא signifie « faire venir, apporter »; avec un butin, « emporter » exprime clairement la saisie et le transport.
- source_word: שָׁנִים
  choice: pendant quelques années
  rationale: Le pluriel est indéfini; « quelques années » donne en français un sens temporel idiomatique sans fixer de durée.
- source_word: יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: il se tiendra à l’écart du roi du Nord
  rationale: Cette traduction conserve l’image de עמד et comprend מן dans un sens de séparation, sans expliciter davantage l’action militaire.
theological_decisions:
- issue: Sens de וְהוּא שָׁנִים יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: Une période durant laquelle il se tient à l’écart du roi du Nord
  alternative: Il subsistera quelques années de plus que le roi du Nord; ou il restera plus fort que le roi du Nord pendant des années
  rationale: La proposition hébraïque est très condensée. עמד avec מן peut exprimer la séparation, mais מן peut aussi recevoir une valeur comparative. Le texte principal préserve l’image verbale et la lecture de l’éloignement; la note maintient les lectures comparatives plausibles sans trancher artificiellement.
translation_notes:
  register: Français international moderne, clair et digne. « Statues de métal fondu » évite l’archaïsme de « images de fonte »; « objets précieux » conserve la portée générale de כְּלֵי. La majuscule à « Nord » marque le titre récurrent du personnage dans ce passage.
