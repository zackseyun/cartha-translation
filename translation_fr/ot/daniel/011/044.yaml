  text: וּ/שְׁמֻע֣וֹת יְבַהֲלֻ֔/הוּ מִ/מִּזְרָ֖ח וּ/מִ/צָּפ֑וֹן וְ/יָצָא֙ בְּ/חֵמָ֣א גְדֹלָ֔ה לְ/הַשְׁמִ֥יד וּֽ/לְ/הַחֲרִ֖ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/044.yaml
  text: But reports from the east and from the north will alarm him[b][a], and he will go out with great fury to destroy and to devote many to destruction.
translation:
  language: fr
  text: Mais des nouvelles[a] venues de l’est et du nord l’alarmeront, et il partira avec une grande fureur pour détruire et vouer un grand nombre de personnes à la destruction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des informations » ou « des rumeurs ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut signifier « frapper d’interdit » ou « vouer à la destruction » ; il est plus spécifique que le verbe précédent, rendu par « détruire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֻעוֹת
  choice: nouvelles
  rationale: Le pluriel désigne des choses entendues, donc des informations reçues. « Nouvelles » est naturel en français moderne et ne suppose pas qu’elles soient incertaines, contrairement à « rumeurs ».
- source_word: יְבַהֲלֻהוּ
  choice: l’alarmeront
  rationale: Le piel de בהל exprime le fait de provoquer une agitation soudaine ou de l’effroi. « Alarmeront » conserve cette valeur causative sans imposer l’intensité maximale de « terrifieront ».
- source_word: מִמִּזְרָח וּמִצָּפוֹן
  choice: venues de l’orient et du nord
  rationale: La formulation conserve les deux indications géographiques parallèles. « Orient » est ici un terme géographique courant et digne pour מִזְרָח.
- source_word: וְיָצָא
  choice: et il partira
  rationale: יצא signifie fondamentalement sortir ou partir. « Partira » est naturel dans ce contexte et n’ajoute pas explicitement une action militaire absente du verbe lui-même.
- source_word: בְּחֵמָא גְדֹלָה
  choice: dans une grande fureur
  rationale: חֵמָה évoque une colère ardente ou une fureur. Cette expression française rend sa force et convient au contexte.
- source_word: לְהַשְׁמִיד
  choice: pour détruire
  rationale: Le hiphil de שׁמד signifie détruire ou exterminer. « Détruire » est le rendu large et direct, sans préciser indûment l’étendue de l’action.
- source_word: וּלְהַחֲרִים
  choice: et vouer à l’anéantissement
  rationale: Le hiphil de חרם peut désigner le fait de vouer à la destruction, avec une nuance plus spécifique que שׁמד. Cette formulation maintient la distinction entre les deux verbes.
- source_word: רַבִּים
  choice: un grand nombre de gens
  rationale: Employé comme substantif, רַבִּים signifie « beaucoup » ou « de nombreuses personnes ». La formulation explicite naturellement la référence humaine en français.
theological_decisions:
- issue: Rendu de חרם dans un contexte de guerre et de jugement
  choice: vouer à l’anéantissement
  alternative: exterminer complètement ; frapper d’interdit
  rationale: Le texte emploie successivement שׁמד et חרם. Deux simples synonymes effaceraient cette distinction, tandis que « frapper d’interdit » risquerait d’être obscur sans explication. « Vouer à l’anéantissement » conserve la nuance particulière de חרם sans développer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La coordination et la progression des deux verbes de destruction sont conservées, tout comme l’ambiguïté de « nouvelles », qui peut aussi désigner des informations ou des rumeurs.
