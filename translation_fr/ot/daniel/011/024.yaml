    issue: « parmi les siens » interprète le pronom לָהֶם.
    rationale: Le texte ne définit pas les bénéficiaires comme « les siens »; il dit seulement « pour eux/à eux ». « Parmi eux » conserve l’ambiguïté du référent et s’accorde avec la note alternative.
  - severity: low
