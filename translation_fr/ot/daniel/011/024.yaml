source:
  edition: WLC
  text: בְּ/שַׁלְוָ֞ה וּ/בְ/מִשְׁמַנֵּ֣י מְדִינָה֮ יָבוֹא֒ וְ/עָשָׂ֗ה אֲשֶׁ֨ר לֹא עָשׂ֤וּ אֲבֹתָי/ו֙ וַ/אֲב֣וֹת אֲבֹתָ֔י/ו בִּזָּ֧ה וְ/שָׁלָ֛ל וּ/רְכ֖וּשׁ לָ/הֶ֣ם יִבְז֑וֹר וְ/עַ֧ל מִבְצָרִ֛ים יְחַשֵּׁ֥ב מַחְשְׁבֹתָ֖י/ו וְ/עַד עֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/024.yaml
  text: 'In a time of security he will come into the richest parts of the province[a], and he will do what neither his fathers nor his fathers’ fathers did: he will scatter among them plunder, spoil, and goods; and against fortresses he will devise his plans[c][b], but only until a time.'
translation:
  language: fr
  text: 'En temps de sécurité[a], il entrera dans les régions les plus riches de la province. Il fera ce que n’avaient fait ni ses pères ni les pères de ses pères : il répandra parmi eux le butin, les dépouilles et les biens[b]. Il concevra des plans contre les forteresses, mais seulement jusqu’à un certain temps[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « dans la tranquillité », « paisiblement » ou « à l’improviste ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il leur distribuera le butin, les dépouilles et les possessions ».'
    reason: lexical_alternative
  - marker: c
    text: 'Autres traductions possibles : « Il complotera contre les places fortes » ou « jusqu’au temps fixé ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשַׁלְוָה
  choice: En toute tranquillité
  rationale: שַׁלְוָה évoque le calme, la quiétude ou la sécurité. Cette formulation française reste naturelle et conserve l’ambiguïté entre la manière paisible d’entrer et une situation de sécurité dont il profite.
- source_word: וּבְמִשְׁמַנֵּי מְדִינָה
  choice: dans les régions les plus riches de la province
  rationale: מִשְׁמַנִּים désigne littéralement les parties « grasses », c’est-à-dire fertiles ou prospères; מְדִינָה désigne ici une province ou région administrative.
- source_word: יָבוֹא
  choice: il entrera
  rationale: Le verbe courant בוא signifie venir ou entrer. « Entrera » exprime le mouvement sans ajouter la nuance militaire plus forte d’« envahir ».
- source_word: וְעָשָׂה אֲשֶׁר לֹא עָשׂוּ
  choice: Il fera ce que n’avaient fait ni
  rationale: La formulation rend directement la comparaison emphatique avec les générations précédentes.
- source_word: אֲבֹתָיו וַאֲבוֹת אֲבֹתָיו
  choice: ses pères ni les pères de ses pères
  rationale: Le redoublement inhabituel de l’hébreu est conservé plutôt que réduit au seul mot « ancêtres ».
- source_word: בִּזָּה וְשָׁלָל וּרְכוּשׁ
  choice: le butin, les dépouilles et les biens
  rationale: Les trois termes proches sont maintenus afin de préserver leur effet d’accumulation; רְכוּשׁ désigne les biens ou possessions.
- source_word: לָהֶם יִבְזוֹר
  choice: il répandra parmi les siens
  rationale: בזר signifie disperser ou répandre. Le complément pronominal renvoie aux bénéficiaires; « les siens » l’explicite légèrement sans définir plus précisément leur identité.
- source_word: וְעַל מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו
  choice: Il concevra des plans contre les forteresses
  rationale: La construction avec le verbe et le nom de même racine signifie élaborer des projets ou des stratégies; מִבְצָרִים désigne des forteresses ou places fortes.
- source_word: וְעַד עֵת
  choice: mais seulement jusqu’à un certain temps
  rationale: L’hébreu dit littéralement « et jusqu’à un temps ». « Un certain temps » conserve la limite indéfinie sans introduire explicitement l’idée d’un temps fixé.
theological_decisions:
- issue: Faut-il présenter la limite temporelle comme explicitement fixée par Dieu ou la laisser indéfinie ?
  choice: mais seulement jusqu’à un certain temps
  alternative: jusqu’au temps fixé ; mais seulement pour un temps
  rationale: עַד עֵת ne comporte ici aucun qualificatif signifiant explicitement « fixé ». Le texte principal préserve donc l’indétermination de l’expression, tandis que la note signale les autres compréhensions possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les répétitions rhétoriques de l’hébreu sans devenir artificielle. Les ambiguïtés de בְּשַׁלְוָה et de עַד עֵת sont maintenues dans le texte et précisées en notes.
