  text: וְ/עָמַ֤ד עַל כַּנּ/וֹ֙ נִבְזֶ֔ה וְ/לֹא נָתְנ֥וּ עָלָ֖י/ו ה֣וֹד מַלְכ֑וּת וּ/בָ֣א בְ/שַׁלְוָ֔ה וְ/הֶחֱזִ֥יק מַלְכ֖וּת בַּ/חֲלַקְלַקּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/021.yaml
  text: And in his place a despised man will arise[a], on whom they had not bestowed the majesty of kingship[b]; he will come in quietly and seize the kingdom by intrigues.
translation:
  language: fr
  text: À sa place se lèvera un homme méprisé, à qui l’on n’aura pas conféré la majesté royale. Il viendra tranquillement[a] et s’assurera la royauté par des flatteries[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « paisiblement » ou « en toute sécurité » : l’expression peut désigner le calme, la tranquillité ou la sécurité, plutôt qu’une attaque ouverte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « par des intrigues » : le terme peut désigner des paroles flatteuses et trompeuses, ainsi que les manœuvres politiques qui en découlent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל־כַּנּוֹ
  choice: À sa place surgira
  rationale: Dans ce contexte de succession, עמד exprime l’apparition ou l’accession d’un nouveau dirigeant, tandis que עַל־כַּנּוֹ signifie qu’il prend la place de son prédécesseur.
- source_word: נִבְזֶה
  choice: un homme méprisé
  rationale: Le terme désigne quelqu’un tenu en mépris; cette formulation conserve la valeur passive sans recourir à « méprisable », qui décrirait plus directement sa qualité intrinsèque.
- source_word: וְלֹא נָתְנוּ עָלָיו הוֹד מַלְכוּת
  choice: à qui l’on n’aura pas accordé la dignité royale
  rationale: Le pluriel hébreu indéfini se rend naturellement par « l’on ». הוֹד מַלְכוּת évoque l’honneur ou la majesté attachés à la fonction royale, ici exprimés par « dignité royale ».
- source_word: וּבָא בְשַׁלְוָה
  choice: Il viendra sans éveiller la méfiance
  rationale: בְשַׁלְוָה peut exprimer le calme, la tranquillité ou la sécurité. Dans le contexte d’une prise de pouvoir non frontale, cette formulation rend l’idée d’une arrivée apparemment inoffensive tout en signalant en note l’alternative plus formelle.
- source_word: וְהֶחֱזִיק מַלְכוּת
  choice: et s’emparera de la royauté
  rationale: Le hiphil de חזק indique ici qu’il obtiendra une ferme emprise. « S’emparer » convient à l’usurpation décrite, et « royauté » désigne le pouvoir royal plutôt que le territoire.
- source_word: בַּחֲלַקְלַקּוֹת
  choice: par des flatteries
  rationale: Le mot dérive de l’idée de paroles lisses et désigne des propos flatteurs ou trompeurs. « Flatteries » préserve cette image lexicale; la portée politique plus large est donnée en note.
