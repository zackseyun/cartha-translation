  text: וְ/לֶ/אֱלֹ֨הַּ֙ מָֽעֻזִּ֔ים עַל כַּנּ֖/וֹ יְכַבֵּ֑ד וְ/לֶ/אֱל֜וֹהַּ אֲשֶׁ֧ר לֹא יְדָעֻ֣/הוּ אֲבֹתָ֗י/ו יְכַבֵּ֛ד בְּ/זָהָ֥ב וּ/בְ/כֶ֛סֶף וּ/בְ/אֶ֥בֶן יְקָרָ֖ה וּ/בַ/חֲמֻדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/038.yaml
  text: Instead[a], he will honor a god of fortresses in his place; he will honor a god whom his fathers did not know with gold, silver, precious stones[c][b], and desirable things.
translation:
  language: fr
  text: Mais il honorera à sa place[b] un dieu des forteresses[a] ; il honorera avec de l’or, de l’argent, des pierres précieuses et des objets de valeur un dieu que ses pères ne connaissaient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un dieu des places fortes ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « à sa place » peut aussi signifier « sur son socle » ou « sur son piédestal » ; son sens et son référent sont incertains.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֶאֱלֹהַּ מָעֻזִּים
  choice: Mais… le dieu des forteresses
  rationale: La conjonction marque ici le contraste avec le verset précédent. מָעֻזִּים désigne des lieux fortifiés ou des places fortes ; « forteresses » convient au contexte militaire. L’article défini français rend la construction naturelle sans identifier ce dieu à une divinité précise.
- source_word: עַל־כַּנּוֹ
  choice: à sa place
  rationale: La locution est difficile et peut avoir un sens spatial (« sur son socle ») ou substitutif (« à sa place »). Le texte principal retient la formulation idiomatique tout en maintenant l’ambiguïté du référent.
- source_word: יְכַבֵּד
  choice: il honorera
  rationale: Le piel de כבד signifie ici accorder de l’honneur ou glorifier. « Honorer » est précis, naturel et convient aux deux occurrences.
- source_word: אֱלוֹהַּ אֲשֶׁר לֹא יְדָעֻהוּ אֲבֹתָיו
  choice: un dieu que ses pères ne connaissaient pas
  rationale: Cette traduction suit directement la syntaxe hébraïque et conserve « ses pères », qui désigne ici les ancêtres de la lignée.
- source_word: בְּזָהָב וּבְכֶסֶף
  choice: avec de l’or, de l’argent
  rationale: La préposition ב marque le moyen par lequel ce dieu est honoré ; « avec » est naturel en français.
- source_word: וּבְאֶבֶן יְקָרָה
  choice: des pierres précieuses
  rationale: Le singulier hébreu peut avoir une valeur collective. Le pluriel français est idiomatique dans cette énumération de richesses.
- source_word: וּבַחֲמֻדוֹת
  choice: des objets de valeur
  rationale: חֲמֻדוֹת désigne des choses désirables, précieuses ou coûteuses. « Objets de valeur » est clair et garde une portée plus large que « trésors ».
theological_decisions:
- issue: Identité du « dieu des forteresses »
  choice: Conserver la désignation descriptive sans identifier la divinité.
  alternative: Y voir un dieu historique précis, un dieu de la guerre ou la puissance militaire personnifiée.
  rationale: Le verset ne fournit pas assez d’éléments pour imposer une identification historique ou eschatologique. La traduction préserve donc l’indétermination du texte.
- issue: Sens de עַל־כַּנּוֹ
  choice: « à sa place »
  alternative: « sur son socle », « sur son piédestal » ou « à la place de celui-ci »
  rationale: La formulation hébraïque est concise et discutée. « À sa place » exprime le sens probablement substitutif sans préciser de manière excessive le référent ; la note conserve la lecture spatiale littérale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « il honorera » est conservée pour refléter la structure hébraïque. L’ordre de la seconde proposition a été légèrement réorganisé afin que la longue série introduite par « avec » reste claire en français.
