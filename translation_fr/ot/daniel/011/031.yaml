source:
  edition: WLC
  text: וּ/זְרֹעִ֖ים מִמֶּ֣/נּוּ יַעֲמֹ֑דוּ וְ/חִלְּל֞וּ הַ/מִּקְדָּ֤שׁ הַ/מָּעוֹז֙ וְ/הֵסִ֣ירוּ הַ/תָּמִ֔יד וְ/נָתְנ֖וּ הַ/שִּׁקּ֥וּץ מְשׁוֹמֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/031.yaml
  text: And forces from him will arise[a], and they will profane the sanctuary fortress, and remove the regular burnt offering[d][c][b], and set up the abomination that desolates.
translation:
  language: fr
  text: Des forces de sa part se présenteront[a] ; elles profaneront le sanctuaire, la forteresse[b], supprimeront le sacrifice quotidien[c] et installeront l’abomination qui dévaste[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des bras » ; le mot peut désigner des forces militaires.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « le sanctuaire, la forteresse » ; autre traduction possible : « le sanctuaire fortifié ».'
    reason: alternative_reading
  - marker: c
    text: 'Hébreu : « le régulier » ou « le continuel » ; l’expression désigne ici le sacrifice offert quotidiennement.'
    reason: lexical_alternative
  - marker: d
    text: 'Autre traduction possible : « l’abomination qui cause la désolation ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּזְרֹעִים
  choice: des forces
  rationale: Le pluriel signifie littéralement « bras », mais désigne ici la puissance armée ou des troupes. « Des forces » restitue naturellement cet emploi militaire sans préciser davantage leur nature.
- source_word: מִמֶּנּוּ
  choice: venant de lui
  rationale: Le suffixe renvoie le plus naturellement au personnage royal évoqué auparavant. Cette formulation conserve la provenance sans ajouter explicitement l’idée d’un envoi.
- source_word: יַעֲמֹדוּ
  choice: se lèveront
  rationale: Le verbe signifie fondamentalement « se tenir debout » et peut, dans ce contexte militaire, évoquer des forces qui surgissent ou prennent position. « Se lèveront » conserve l’image tout en restant idiomatique.
- source_word: וְחִלְּלוּ
  choice: elles profaneront
  rationale: Au piel, le verbe exprime l’action de rendre profane ou de traiter comme profane. « Profaner » convient précisément au contexte du sanctuaire.
- source_word: הַמִּקְדָּשׁ הַמָּעוֹז
  choice: le sanctuaire-forteresse
  rationale: Le trait d’union garde visibles les deux substantifs juxtaposés et leur relation étroite, sans décider complètement entre apposition (« le sanctuaire, la forteresse ») et qualification (« le sanctuaire fortifié »).
- source_word: וְהֵסִירוּ
  choice: supprimeront
  rationale: Le hiphil signifie « ôter, faire disparaître ». « Supprimeront » exprime ici l’interruption imposée du sacrifice sans affirmer qu’elle sera définitive.
- source_word: הַתָּמִיד
  choice: le sacrifice quotidien
  rationale: Le terme signifie littéralement « le régulier, le continuel » et sert dans ce contexte cultuel à désigner le sacrifice offert régulièrement. « Quotidien » rend sa fréquence habituelle, tandis que la note signale l’ellipse hébraïque.
- source_word: וְנָתְנוּ
  choice: installeront
  rationale: Le verbe courant « donner, placer » décrit ici la mise en place d’une réalité sacrilège. « Installeront » est naturel et conserve cette idée.
- source_word: הַשִּׁקּוּץ
  choice: l’abomination
  rationale: Le mot désigne une chose détestable, souvent liée à l’idolâtrie. « Abomination » est précis, intelligible et maintient le registre solennel de Daniel.
- source_word: מְשׁוֹמֵם
  choice: qui dévaste
  rationale: Le participe peut exprimer ce qui désole ou produit la dévastation. La relative française en conserve la force active sans identifier l’abomination ni expliquer son accomplissement.
theological_decisions:
- issue: Rapport syntaxique entre « le sanctuaire » et « la forteresse » (הַמִּקְדָּשׁ הַמָּעוֹז)
  choice: le sanctuaire-forteresse
  alternative: le sanctuaire fortifié ; le sanctuaire, la forteresse
  rationale: L’hébreu juxtapose deux noms définis sans expliciter leur rapport. La formulation composée maintient cette densité et évite de trancher entièrement entre qualification et apposition.
- issue: Référent elliptique de הַתָּמִיד
  choice: le sacrifice quotidien
  alternative: le sacrifice régulier ; le perpétuel
  rationale: Le substantif désignant le sacrifice n’est pas exprimé, mais l’usage cultuel du terme dans Daniel permet de le restituer pour la clarté. La note préserve la forme elliptique de l’original.
- issue: Valeur de מְשׁוֹמֵם
  choice: qui dévaste
  alternative: qui cause la désolation ; dévastatrice
  rationale: Le participe est rendu activement sans préciser une interprétation historique ou eschatologique particulière.
translation_notes:
  register: Français international actuel, clair et digne. Le point-virgule allège la longue coordination hébraïque. « Sanctuaire-forteresse » est volontairement compact afin de conserver l’ambiguïté de la juxtaposition originale ; les termes cultuels restent compréhensibles sans imposer une lecture confessionnelle ou historique particulière.
