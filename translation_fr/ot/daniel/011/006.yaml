source:
  edition: WLC
  text: וּ/לְ/קֵ֤ץ שָׁנִים֙ יִתְחַבָּ֔רוּ וּ/בַ֣ת מֶֽלֶךְ הַ/נֶּ֗גֶב תָּבוֹא֙ אֶל מֶ֣לֶךְ הַ/צָּפ֔וֹן לַ/עֲשׂ֖וֹת מֵישָׁרִ֑ים וְ/לֹֽא תַעְצֹ֞ר כּ֣וֹחַ הַ/זְּר֗וֹעַ וְ/לֹ֤א יַעֲמֹד֙ וּ/זְרֹע֔/וֹ וְ/תִנָּתֵ֨ן הִ֤יא וּ/מְבִיאֶ֨י/הָ֙ וְ/הַ/יֹּ֣לְדָ֔/הּ וּ/מַחֲזִקָ֖/הּ בָּ/עִתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/006.yaml
  text: At the end of years they will join together[a], and the daughter of the king of the South will come to the king of the North to make an agreement. But she will not retain the strength of her arm, and he and his arm will not stand; and she will be given up, along with those who brought her, and the one who fathered her[b], and the one who supported her in those times.
translation:
  language: fr
  text: Au terme de quelques années, ils s’allieront. La fille du roi du Sud viendra auprès du roi du Nord pour conclure un accord[a]. Mais elle ne conservera pas la force de son bras, et lui-même ne tiendra pas, pas plus que son bras. Elle sera livrée, avec ceux qui l’auront amenée, celui qui l’a engendrée[b] et celui qui l’aura soutenue en ces temps-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour établir des conditions équitables ». L’hébreu parle littéralement de « faire des rectitudes » ou des « choses équitables ».
    reason: lexical_alternative
  - marker: b
    text: « Celui qui l’a engendrée » suit la forme masculine du participe hébreu. Certaines traductions comprennent plutôt « son enfant » ou retiennent un autre référent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקֵץ שָׁנִים
  choice: Au terme de quelques années
  rationale: קֵץ désigne le terme ou la fin d’une période. En français, « au terme de quelques années » restitue naturellement l’idée d’un laps de temps sans imposer une durée précise.
- source_word: יִתְחַבָּרוּ
  choice: ils s’allieront
  rationale: Le hitpael de חבר exprime ici le fait de se joindre l’un à l’autre; dans ce contexte royal et diplomatique, « s’allier » est précis sans définir la forme exacte de l’alliance.
- source_word: וּבַת מֶלֶךְ הַנֶּגֶב
  choice: La fille du roi du Sud
  rationale: La chaîne construite est définie dans le contexte. « Roi du Sud » conserve la désignation géopolitique récurrente de Daniel 11.
- source_word: תָּבוֹא אֶל מֶלֶךְ הַצָּפוֹן
  choice: viendra auprès du roi du Nord
  rationale: בוא indique un mouvement vers le roi du Nord. « Auprès de » convient à la fois au déplacement et à la démarche diplomatique sans ajouter l’idée d’un mariage.
- source_word: לַעֲשׂוֹת מֵישָׁרִים
  choice: pour conclure un accord
  rationale: מֵישָׁרִים signifie littéralement « rectitudes » ou « conditions équitables ». Dans le contexte diplomatique, « conclure un accord » communique clairement la fonction de l’expression; sa nuance littérale est signalée en note.
- source_word: וְלֹא תַעְצֹר כּוֹחַ הַזְּרוֹעַ
  choice: elle ne conservera pas la force de son bras
  rationale: עצר signifie retenir ou conserver, tandis que זרוע, « bras », représente la force ou le pouvoir. La formulation conserve volontairement la métaphore hébraïque.
- source_word: וְלֹא יַעֲמֹד וּזְרֹעוֹ
  choice: lui-même ne tiendra pas, pas plus que son bras
  rationale: Le masculin singulier renvoie vraisemblablement au roi du Nord, mais le texte ne le renomme pas. « Tenir » rend l’idée de demeurer debout ou de subsister, et « son bras » préserve la métaphore du pouvoir.
- source_word: וְתִנָּתֵן הִיא
  choice: Elle sera livrée
  rationale: Le nifal de נתן est passif et signifie ici être remise, livrée ou abandonnée. « Sera livrée » est direct et garde ouverte l’identité de l’agent.
- source_word: וּמְבִיאֶיהָ
  choice: ceux qui l’auront amenée
  rationale: Le participe pluriel de בוא avec suffixe désigne les personnes qui l’ont conduite ou escortée. La traduction reste proche de la forme du texte.
- source_word: וְהַיֹּלְדָהּ
  choice: celui qui lui a donné naissance
  rationale: Le participe hébreu est masculin singulier et désigne normalement celui qui l’a engendrée. Cette formulation respecte le genre grammatical tout en évitant un registre archaïque; une note mentionne l’incertitude textuelle et interprétative.
- source_word: וּמַחֲזִקָהּ
  choice: celui qui l’aura soutenue
  rationale: Le participe hiphil de חזק désigne celui qui rend fort, soutient ou appuie. « Soutenue » demeure assez large pour un protecteur ou un appui politique.
- source_word: בָּעִתִּים
  choice: en ces temps-là
  rationale: Le pluriel « temps » est conservé dans une tournure française naturelle qui désigne la période évoquée.
theological_decisions:
- issue: Référent du masculin dans וְלֹא יַעֲמֹד וּזְרֹעוֹ
  choice: Employer « lui-même » sans identifier explicitement le personnage
  alternative: Nommer « le roi du Nord »
  rationale: Le contexte favorise le roi du Nord, mais l’hébreu ne répète pas son titre. La traduction préserve cette légère ambiguïté référentielle.
- issue: Nature de l’accord exprimé par מֵישָׁרִים
  choice: Ne pas préciser qu’il s’agit d’un mariage ou d’un traité de paix
  alternative: Traduire « pour faire la paix » ou expliciter une alliance matrimoniale
  rationale: La démarche peut historiquement impliquer une union dynastique, mais le verset parle seulement d’établir des conditions droites ou un accord. L’explicitation dépasserait le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Les titres « roi du Sud » et « roi du Nord » sont conservés pour assurer la cohérence du chapitre. Les métaphores du « bras » et du fait de « tenir » restent visibles afin de préserver la texture et l’ambiguïté du texte hébreu.
