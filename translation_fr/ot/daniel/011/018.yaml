revisions:
- from: Puis il tournera son visage vers les régions côtières[a] et en prendra beaucoup[b]. Mais un commandant mettra fin à l’affront qu’il lui inflige ; bien plus, il fera retomber sur lui son affront.
  to: Puis il tournera son visage vers les régions côtières[a] et en prendra beaucoup. Mais un commandant mettra fin à l’affront que celui-ci lui a fait ; bien plus, il le fera retomber sur lui[b].
  rationale: La révision corrige l’ambiguïté possessive française de la dernière proposition, sans résoudre les référents historiques ni aplanir la difficulté syntaxique de l’hébreu. Elle déplace aussi l’appel de note b au passage réellement concerné. Le choix « bien plus » maintient la lecture emphatique de בלתי suivie dans la piste d’audit anglaise, tout en signalant en note la difficulté de l’ensemble.
