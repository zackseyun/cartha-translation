base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/018.yaml
  text: Then he will turn his face to the coastlands and capture many[b][a]. But a commander will put an end to his reproach against him; indeed, he will repay his reproach to him.
translation:
  language: fr
  text: Puis il tournera son visage vers les régions côtières[a] et en prendra beaucoup. Mais un commandant mettra fin à l’affront que celui-ci lui a fait ; bien plus, il le fera retomber sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les îles ». Le terme hébreu peut désigner des îles ou, plus largement, des régions côtières et maritimes.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu des dernières propositions est difficile. Il peut signifier qu’un commandant fera cesser l’affront que cet homme lui a fait et le fera retomber sur lui.
    reason: alternative_reading
lexical_decisions:
- source_word: וישב פניו
  choice: il tournera son visage
  rationale: Cette formulation conserve l’image de l’expression hébraïque tout en indiquant naturellement qu’il se dirigera vers un nouvel objectif.
- source_word: לאיים
  choice: vers les régions côtières
  rationale: אִיִּים peut désigner des îles ou, plus largement, des territoires côtiers et maritimes. « Régions côtières » préserve cette portée géographique sans limiter le sens à des îles.
- source_word: ולכד רבים
  choice: et en prendra beaucoup
  rationale: לכד exprime la prise ou la conquête. Le pronom « en » rattache naturellement l’objet sous-entendu aux régions mentionnées, tandis que « beaucoup » conserve l’absence de substantif explicite dans l’hébreu.
- source_word: קצין
  choice: un commandant
  rationale: קָצִין désigne un dirigeant ou un officier ; « commandant » convient au contexte militaire.
- source_word: והשבית
  choice: mettra fin à
  rationale: Le hiphil de שבת signifie ici faire cesser ; cette tournure est claire, énergique et fidèle.
- source_word: חרפתו לו
  choice: l’affront qu’il lui inflige
  rationale: חֶרְפָּה peut signifier affront, opprobre ou insulte. La reformulation rend intelligible la relation pronominale difficile sans identifier les personnages.
- source_word: בלתי חרפתו ישיב לו
  choice: bien plus, il fera retomber sur lui son affront
  rationale: La proposition est très condensée et discutée. « Bien plus » comprend בִּלְתִּי comme emphatique, et « fera retomber » rend la valeur causative de יָשִׁיב ainsi que l’idée de retournement ou de rétribution.
theological_decisions:
- issue: Référents et syntaxe des deux dernières propositions
  choice: Le commandant fait cesser l’affront du roi et le fait retomber sur celui-ci.
  alternative: Le commandant fait cesser l’affront sans que son propre affront retombe sur lui ; ou il supprime l’opprobre qui pesait sur lui.
  rationale: La syntaxe et les pronoms sont difficiles. Le texte retient le commandant comme sujet des deux verbes et exprime le retournement de l’affront, tout en évitant toute identification historique explicite.
translation_notes:
  register: Français international moderne, digne et accessible. L’image hébraïque du visage est conservée. La fin du verset reste volontairement peu explicite quant aux référents, conformément à l’ambiguïté de l’original.
