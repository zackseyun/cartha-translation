  terminology: « Fils », « troupes », « forteresse » et « se remettre en guerre » conviennent au contexte dynastique et militaire. « L’un d’eux » rend explicitement, sans le nommer, le singulier qui succède à « ses fils » ; « sa forteresse » ne résout pas l’antécédent disputé.
