source:
  edition: WLC
  text: ו/בנ/ו יִתְגָּר֗וּ וְ/אָסְפוּ֙ הֲמוֹן֙ חֲיָלִ֣ים רַבִּ֔ים וּ/בָ֥א ב֖וֹא וְ/שָׁטַ֣ף וְ/עָבָ֑ר וְ/יָשֹׁ֥ב ו/יתגרו עַד מעז/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/010.yaml
  text: His sons will stir themselves up and assemble a multitude of great forces[a], and one will certainly come and overflow and pass through[b]; then he will return and stir up war as far as his fortress.
translation:
  language: fr
  text: Ses fils se mettront en guerre et rassembleront une multitude de troupes. L’un d’eux viendra à coup sûr[a], déferlera et traversera le pays. Puis il reviendra, et ils se remettront en guerre jusqu’à sa forteresse[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe ici du pluriel (« ses fils ») au singulier. On peut aussi traduire : « il viendra à coup sûr ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « jusqu’à sa place forte ». L’hébreu ne précise pas à qui appartient la forteresse.'
    reason: lexical_alternative
  - marker: c
    text: 'Le texte hébreu porte ici une forme plurielle, « ils se remettront en guerre »; certains comprennent le verbe au singulier : « il se remettra en guerre ».'
    reason: textual_grammatical_ambiguity
lexical_decisions:
- source_word: וּבָנָיו
  choice: Ses fils
  rationale: Dans ce conflit dynastique, בנים désigne les descendants royaux masculins; « fils » est donc plus précis que « enfants ».
- source_word: יִתְגָּרוּ
  choice: se mettront en guerre
  rationale: Le hitpael de גרה exprime ici le fait de s’engager ou de se lancer dans le conflit. Cette formulation française garde la nuance réflexive tout en rendant clairement le contexte militaire.
- source_word: וְאָסְפוּ הֲמוֹן חֲיָלִים רַבִּים
  choice: rassembleront une multitude de troupes
  rationale: הֲמוֹן évoque une masse nombreuse, et חֲיָלִים des forces militaires. « Une multitude de troupes » restitue naturellement l’ampleur du rassemblement sans transformer l’expression en une désignation technique d’armée.
- source_word: וּבָא בּוֹא
  choice: L’un d’eux viendra à coup sûr
  rationale: L’infinitif absolu joint au verbe conjugué renforce l’action. « À coup sûr » rend cette insistance, tandis que « l’un d’eux » signale le passage du sujet pluriel au sujet singulier sans identifier le fils concerné.
- source_word: וְשָׁטַף
  choice: déferlera
  rationale: שטף emploie l’image d’un flot qui submerge; « déferlera » conserve cette image appliquée à une avancée militaire.
- source_word: וְעָבָר
  choice: traversera le pays
  rationale: עבר signifie passer ou traverser. L’ajout léger de « le pays » fournit en français le complément de parcours laissé implicite en hébreu, sans préciser de territoire particulier.
- source_word: וְיָשֹׁב
  choice: Puis il reviendra
  rationale: שוב indique un retour; « puis » rend naturellement la succession des actions.
- source_word: וְיִתְגָּרוּ
  choice: ils se remettront en guerre
  rationale: La forme transmise est plurielle et reprend le vocabulaire du début du verset. La traduction conserve à la fois ce pluriel et l’idée d’un nouvel engagement dans le conflit.
- source_word: עַד מָעֻזֹּה
  choice: jusqu’à sa forteresse
  rationale: מָעוֹז désigne une place forte ou un refuge fortifié, et le suffixe est masculin singulier. « Sa forteresse » conserve l’antécédent implicite.
theological_decisions:
- issue: Référent du sujet singulier après « ses fils »
  choice: Signaler le passage au singulier par « l’un d’eux » sans identifier ce fils.
  alternative: « Il viendra à coup sûr », ou identification historique explicite d’un fils particulier.
  rationale: L’hébreu passe du pluriel au singulier, mais ne nomme pas l’individu. La traduction rend ce changement grammatical sans trancher son identification historique.
- issue: Nombre grammatical dans la dernière proposition
  choice: 'Conserver le pluriel transmis: « ils se remettront en guerre ».'
  alternative: 'Comprendre ou corriger contextuellement au singulier: « il se remettra en guerre » ou « il poursuivra le combat ».'
  rationale: Le texte consonantique présenté porte une forme plurielle. La conserver évite de résoudre silencieusement la tension créée par le sujet singulier des verbes précédents.
- issue: Possesseur de la forteresse
  choice: Garder « sa forteresse » sans préciser le possesseur.
  alternative: Identifier la forteresse comme celle de l’un ou l’autre roi, ou lisser au pluriel par « leur forteresse ».
  rationale: Le suffixe hébreu est masculin singulier, mais son référent demeure implicite et discuté; la traduction préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme soutient l’image d’une offensive qui déferle. Les changements de nombre grammatical et l’identité du possesseur de la forteresse restent volontairement non résolus.
