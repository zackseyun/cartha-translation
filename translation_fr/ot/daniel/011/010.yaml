  source_fidelity: 'Le texte français suit fidèlement le TM : pluriel pour « ses fils », passage marqué au singulier avec « L’un d’eux », retour au pluriel pour « ils se remettront en guerre », et suffixe masculin singulier conservé dans « sa forteresse ». « Déferlera et traversera le pays » rend de manière naturelle l’enchaînement militaire métaphorique שטף ועבר. L’ajout de « le pays » explicite seulement le parcours impliqué par « passer/traverser » sans identifier un territoire. L’audit anglais rend le dernier verbe au singulier, mais le texte hébreu fourni porte bien un pluriel ; le français conserve donc à juste titre la donnée source plutôt que cette simplification anglaise.'
