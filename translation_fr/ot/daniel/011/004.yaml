source:
  edition: WLC
  text: וּ/כְ/עָמְד/וֹ֙ תִּשָּׁבֵ֣ר מַלְכוּת֔/וֹ וְ/תֵחָ֕ץ לְ/אַרְבַּ֖ע רוּח֣וֹת הַ/שָּׁמָ֑יִם וְ/לֹ֣א לְ/אַחֲרִית֗/וֹ וְ/לֹ֤א כְ/מָשְׁל/וֹ֙ אֲשֶׁ֣ר מָשָׁ֔ל כִּ֤י תִנָּתֵשׁ֙ מַלְכוּת֔/וֹ וְ/לַ/אֲחֵרִ֖ים מִ/לְּ/בַד אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/004.yaml
  text: And as soon as he has arisen[a], his kingdom will be broken and divided toward the four winds of heaven, but not to his posterity, and not according to the dominion with which he ruled[b]; for his kingdom will be uprooted and given to others besides these.
translation:
  language: fr
  text: Lorsqu’il sera parvenu au pouvoir, son royaume sera brisé et partagé aux quatre vents du ciel[a], mais il ne reviendra pas à sa postérité[b] et n’aura pas une domination comparable à celle qu’il exerçait. En effet, son royaume sera déraciné et donné à d’autres, en dehors de ceux-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « aux quatre vents du ciel » signifie que le royaume sera partagé dans toutes les directions, vers les quatre points de l’horizon.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « pas à ce qui vient après lui ». Dans ce contexte de succession royale, l’expression désigne sa postérité, c’est-à-dire ses descendants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעָמְדוֹ
  choice: Lorsqu’il se sera élevé
  rationale: La tournure temporelle avec עמד désigne ici l’accession ou l’établissement du roi au pouvoir, non le simple fait de se tenir debout. « Lorsqu’il se sera élevé » reste naturel sans imposer une immédiateté plus forte que celle qu’exprime nécessairement l’hébreu.
- source_word: תִּשָּׁבֵר מַלְכוּתוֹ
  choice: son royaume sera brisé
  rationale: Le niphal de שׁבר exprime la rupture subie par le royaume. « Brisé » conserve directement l’image hébraïque.
- source_word: וְתֵחָץ
  choice: et partagé
  rationale: Le verbe חצה indique une division en parts. « Partagé » convient au morcellement politique du royaume et s’enchaîne naturellement avec « brisé ».
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: aux quatre vents du ciel
  rationale: Cette expression directionnelle traditionnelle évoque les quatre points de l’horizon. La formulation française conserve l’image source tout en restant immédiatement compréhensible.
- source_word: וְלֹא לְאַחֲרִיתוֹ
  choice: mais pas au profit de ses descendants
  rationale: אַחֲרִיתוֹ signifie littéralement ce qui vient après lui et, dans ce contexte dynastique, renvoie à sa postérité. La traduction explicite cette valeur contextuelle.
- source_word: וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל
  choice: ni avec la puissance qu’il avait exercée
  rationale: La construction associe le nom et le verbe de la racine משׁל pour parler de la domination exercée par le roi. « Puissance » et « exercée » rendent le sens politique sans reproduire une répétition peu naturelle en français.
- source_word: כִּי תִנָּתֵשׁ מַלְכוּתוֹ
  choice: En effet, son royaume sera déraciné
  rationale: כִּי introduit ici une explication, tandis que le niphal de נתשׁ conserve l’image d’un royaume arraché à son implantation. « En effet » et « déraciné » rendent ces deux fonctions.
- source_word: וְלַאֲחֵרִים מִלְּבַד אֵלֶּה
  choice: et passera à d’autres qu’à eux
  rationale: L’hébreu dit littéralement « et à d’autres en dehors de ceux-ci ». Le verbe « passera » est suppléé pour exprimer clairement le transfert du royaume; « eux » reprend les descendants mentionnés auparavant sans identifier historiquement les bénéficiaires.
theological_decisions:
- issue: Identification historique du roi et des bénéficiaires du royaume
  choice: Ne nommer aucun personnage ni royaume dans le texte traduit.
  alternative: Insérer dans la traduction les identifications historiques couramment proposées.
  rationale: Le verset décrit l’élévation d’un roi, le démantèlement de son royaume et son transfert, mais ne donne ici aucun nom. Les identifications relèvent du commentaire plutôt que de la traduction.
- issue: Portée de וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל
  choice: Conserver l’idée générale que la puissance exercée par le roi ne subsistera pas dans le partage.
  alternative: Attribuer explicitement cette moindre domination soit aux descendants, soit aux autres bénéficiaires.
  rationale: La syntaxe hébraïque est concise et ne précise pas explicitement quel groupe exercerait une domination moindre. La traduction évite de trancher davantage que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure prophétique au futur est conservée. Les marqueurs de notes ont été placés immédiatement après les expressions qu’ils expliquent.
