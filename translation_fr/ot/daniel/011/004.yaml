    text: 'Littéralement : « pas à ce qui vient après lui ». Dans ce contexte de succession royale, l’expression désigne sa postérité, c’est-à-dire ses descendants.'
    reason: lexical_alternative
  revision_rationale: La révision améliore l’expression française de l’accession au pouvoir, restitue la comparaison avec la domination antérieure et préserve l’ambiguïté de « ceux-là ». Les notes conservent leurs ancres et expliquent les mêmes expressions sans ajouter d’interprétation historique ou doctrinale.
