revisions:
- from: Lorsqu’il se sera élevé, son royaume sera brisé et partagé aux quatre vents du ciel[a], mais pas au profit de ses descendants[b] ni avec la puissance qu’il avait exercée. En effet, son royaume sera déraciné et passera à d’autres qu’à eux.
  to: Lorsqu’il sera parvenu au pouvoir, son royaume sera brisé et partagé aux quatre vents du ciel[a], mais il ne reviendra pas à sa postérité[b] et n’aura pas une domination comparable à celle qu’il exerçait. En effet, son royaume sera déraciné et donné à d’autres, en dehors de ceux-là.
  rationale: La révision améliore l’expression française de l’accession au pouvoir, restitue la comparaison avec la domination antérieure et préserve l’ambiguïté de « ceux-là ». Les notes conservent leurs ancres et expliquent les mêmes expressions sans ajouter d’interprétation historique ou doctrinale.
