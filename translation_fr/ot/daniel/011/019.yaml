  text: וְ/יָשֵׁ֣ב פָּנָ֔י/ו לְ/מָעוּזֵּ֖י אַרְצ֑/וֹ וְ/נִכְשַׁ֥ל וְ/נָפַ֖ל וְ/לֹ֥א יִמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/019.yaml
  text: Then he will turn his face toward the fortresses of his own land[a], but he will stumble and fall[b], and he will not be found.
translation:
  language: fr
  text: Puis il se tournera vers les forteresses de son pays[a], mais il trébuchera, tombera et on ne le trouvera pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « places fortes ». Le terme hébreu désigne de manière générale des lieux de force, de refuge ou de défense.
    reason: lexical_alternative
  - marker: b
    text: L’expression « on ne le trouvera pas » dit indirectement qu’il disparaît de la scène, probablement à la suite de sa mort ou de son renversement, sans en préciser la manière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֵׁב פָּנָיו
  choice: Puis il tournera son visage
  rationale: Le verbe שׁוב peut signifier « revenir » ou « se tourner ». Avec « son visage », il exprime ici un changement de direction. La formulation conserve l’image hébraïque tout en restant naturelle en français.
- source_word: לְמָעוּזֵּי
  choice: vers les forteresses
  rationale: מָעוֹז désigne un lieu fort, un refuge ou une place fortifiée. « Forteresses » convient au contexte militaire et politique, tandis que « vers » rend la direction marquée par לְ après le verbe de mouvement.
- source_word: אַרְצוֹ
  choice: de son pays
  rationale: אֶרֶץ désigne ici son territoire ou son pays. « Son pays » est idiomatique et n’ajoute pas l’insistance que pourrait suggérer « son propre pays ».
- source_word: וְנִכְשַׁל וְנָפַל
  choice: Mais il trébuchera, tombera
  rationale: Le niphal de כשל conserve l’image de l’action de trébucher, suivie par נפל, « tomber ». « Mais » explicite la valeur adversative du contexte sans modifier l’issue décrite.
- source_word: וְלֹא יִמָּצֵא
  choice: et on ne le trouvera plus
  rationale: La tournure française impersonnelle rend naturellement le passif hébreu « il ne sera pas trouvé ». « Plus » exprime ici sa disparition de la scène sans préciser s’il meurt ou s’il est renversé.
theological_decisions:
- issue: Nature de la disparition finale
  choice: Conserver l’expression indirecte « on ne le trouvera plus »
  alternative: Expliciter par « il mourra » ou « il disparaîtra »
  rationale: Le texte hébreu ne précise ni la cause ni les circonstances de sa disparition. La traduction préserve cette retenue et n’impose aucune identification historique ou interprétation théologique particulière.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre des actions et les images de l’hébreu sont conservés, avec une syntaxe française fluide. Les marqueurs [a] et [b] figurent dans le texte.
