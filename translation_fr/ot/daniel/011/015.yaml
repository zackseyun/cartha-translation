source:
  edition: WLC
  text: וְ/יָבֹא֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/יִשְׁפֹּךְ֙ סֽוֹלֲלָ֔ה וְ/לָכַ֖ד עִ֣יר מִבְצָר֑וֹת וּ/זְרֹע֤וֹת הַ/נֶּ֨גֶב֙ לֹ֣א יַעֲמֹ֔דוּ וְ/עַם֙ מִבְחָרָ֔י/ו וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/015.yaml
  text: Then the king of the north will come and heap up a siege ramp and capture a fortified city[a], and the forces of the south will not stand, nor his choice troops[b], for there will be no strength to stand.
translation:
  language: fr
  text: Alors le roi du Nord viendra, élèvera une rampe de siège et s’emparera d’une ville fortifiée. Les forces du Sud[a] ne tiendront pas, pas même ses troupes d’élite[b], car il n’y aura pas de force pour tenir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les bras du Sud »; « bras » représente ici la puissance ou les forces militaires.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses hommes choisis »; dans ce contexte, l’expression désigne vraisemblablement les soldats sélectionnés ou les troupes d’élite du roi du Sud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָבֹא
  choice: Alors … viendra
  rationale: Le waw suivi de l’imparfait fait progresser la séquence prophétique. « Alors » exprime naturellement cette succession en français.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: le roi du Nord
  rationale: Cette formulation conserve la désignation géopolitique récurrente et l’opposition entre le Nord et le Sud dans Daniel 11.
- source_word: וְיִשְׁפֹּךְ סֹלֲלָה
  choice: élèvera une rampe de siège
  rationale: L’expression désigne la construction d’un ouvrage permettant d’assiéger une ville. « Élever une rampe de siège » restitue le sens militaire sans calquer littéralement le verbe « verser ».
- source_word: וְלָכַד
  choice: et s’emparera
  rationale: Dans ce contexte militaire, le verbe exprime la prise de la ville; « s’emparer de » est naturel et précis.
- source_word: עִיר מִבְצָרוֹת
  choice: une ville fortifiée
  rationale: Le pluriel du nom en construction caractérise ici la puissance défensive de la ville. La formulation française rend ce sens de façon idiomatique.
- source_word: וּזְרֹעוֹת הַנֶּגֶב
  choice: Les forces du Sud
  rationale: « Bras » est employé métaphoriquement pour la puissance militaire. « Forces » rend clairement cette valeur tout en signalant en note l’image hébraïque.
- source_word: לֹא יַעֲמֹדוּ
  choice: ne tiendront pas
  rationale: Le verbe signifie littéralement « se tenir, tenir » et, dans le contexte, évoque l’incapacité de résister. « Ne tiendront pas » conserve l’image militaire.
- source_word: וְעַם מִבְחָרָיו
  choice: pas même ses troupes d’élite
  rationale: Le groupe nominal peut se comprendre littéralement comme « le peuple de ses élus/choisis », mais le contexte militaire favorise les hommes sélectionnés, donc les troupes d’élite. « Pas même » relie naturellement ce groupe à la négation précédente.
- source_word: וְאֵין כֹּחַ לַעֲמֹד
  choice: car il n’y aura pas de force pour tenir
  rationale: Cette traduction préserve à la fois l’énoncé impersonnel de l’hébreu et la répétition du verbe « tenir », sans préciser artificiellement qui manque de force.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prophétique est conservé. La répétition de « tenir » reproduit le lien verbal de l’hébreu, et l’expression impersonnelle finale en maintient l’ouverture référentielle.
