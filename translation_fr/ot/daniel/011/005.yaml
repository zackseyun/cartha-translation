source:
  edition: WLC
  text: וְ/יֶחֱזַ֥ק מֶֽלֶךְ הַ/נֶּ֖גֶב וּ/מִן שָׂרָ֑י/ו וְ/יֶחֱזַ֤ק עָלָי/ו֙ וּ/מָשָׁ֔ל מִמְשָׁ֥ל רַ֖ב מֶמְשַׁלְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/005.yaml
  text: Then the king of the South will grow strong[a], but one of his commanders will grow stronger than he and will rule, and his dominion will be a great dominion.
translation:
  language: fr
  text: Le roi du Sud deviendra puissant. Mais l’un de ses chefs deviendra plus puissant que lui[a], dominera, et sa domination sera grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « deviendra puissant au-dessus de lui ». L’expression peut indiquer que ce chef surpassera le roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶחֱזַק
  choice: deviendra puissant
  rationale: Le qal inaccompli de חזק exprime ici l’accession à la puissance politique ou militaire dans une narration prophétique orientée vers l’avenir.
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: le roi du Sud
  rationale: Cette formulation conserve le titre géopolitique récurrent dans Daniel 11 et reste naturelle en français.
- source_word: וּמִן שָׂרָיו
  choice: mais l’un de ses chefs
  rationale: מִן suivi du pluriel avec suffixe désigne ici quelqu’un issu du groupe de ses hauts responsables. « Chefs » convient au contexte politico-militaire, tandis que « mais » rend le contraste implicite avec la supériorité qui suit.
- source_word: וְיֶחֱזַק עָלָיו
  choice: deviendra plus puissant que lui
  rationale: Avec עַל, le verbe exprime ici une supériorité sur le roi précédemment mentionné. Le comparatif explicite est idiomatique en français sans effacer le rapport de force.
- source_word: וּמָשָׁל
  choice: et dominera
  rationale: Le verbe משל désigne l’exercice du pouvoir; le parfait coordonné poursuit ici la séquence prophétique au futur.
- source_word: מִמְשָׁל רַב מֶמְשַׁלְתּוֹ
  choice: sa domination sera considérable
  rationale: La formulation rend l’ampleur exceptionnelle de son pouvoir tout en reprenant « domination » pour refléter l’écho lexical hébreu entre מִמְשָׁל et מֶמְשָׁלָה.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le choix de « puissant » convient mieux à des personnes que « fort » dans ce contexte politique. « Considérable » évite la lourdeur de « une grande domination » tout en préservant l’idée d’ampleur.
