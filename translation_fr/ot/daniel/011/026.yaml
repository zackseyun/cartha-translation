  text: וְ/אֹכְלֵ֧י פַת בָּג֛/וֹ יִשְׁבְּר֖וּ/הוּ וְ/חֵיל֣/וֹ יִשְׁט֑וֹף וְ/נָפְל֖וּ חֲלָלִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/026.yaml
  text: Those who eat his food will break him[a], and his army will be swept away[c][b], and many slain will fall.
translation:
  language: fr
  text: Ceux qui mangent de sa nourriture causeront sa ruine[a]. Son armée déferlera[b], et beaucoup tomberont, tués.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le briseront ». « Ceux qui mangent de sa nourriture » est un idiome pour des personnes qui bénéficient des provisions d’un souverain, telles que des proches ou des dépendants.'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu évoque un flot qui déborde : « son armée déferlera » ou « son armée débordera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכְלֵי פַת בָּגוֹ
  choice: ceux qui mangent de ses mets
  rationale: L’expression désigne ceux qui vivent de ses provisions, donc ses proches ou ses dépendants. « Ses mets » reste naturel en français et conserve la référence concrète à la nourriture sans ajouter explicitement la notion de table.
- source_word: יִשְׁבְּרוּהוּ
  choice: causeront sa ruine
  rationale: Le verbe signifie littéralement « briser ». Dans ce contexte de trahison intérieure, l’expression française rend clairement l’idée de provoquer sa perte, tandis que la note conserve l’image hébraïque.
- source_word: חֵילוֹ
  choice: son armée
  rationale: חַיִל peut désigner la force, les richesses ou les forces militaires. Le contexte guerrier favorise ici « armée ».
- source_word: יִשְׁטוֹף
  choice: sera emportée comme par un flot
  rationale: Le verbe évoque un débordement ou une inondation. Cette formulation française exprime la déroute militaire tout en maintenant l’image du flot.
- source_word: וְנָפְלוּ חֲלָלִים רַבִּים
  choice: et beaucoup tomberont, tués
  rationale: חֲלָלִים désigne des personnes frappées à mort. La formulation conserve à la fois le verbe « tomber » et l’idée explicite des morts, dans un français intelligible.
theological_decisions: []
translation_notes:
  register: 'Français moderne, international et digne. La traduction privilégie une équivalence optimale : elle explicite la ruine dans le corps du texte, tout en conservant en note l’image littérale de la fracture, et maintient directement l’imagerie du flot pour la déroute de l’armée.'
