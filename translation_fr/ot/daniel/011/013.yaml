  rationale: La seule correction nécessaire remplace le calque peu naturel « lèvera une multitude » par « rassemblera une multitude ». Le reste du texte préserve avec justesse la densité temporelle de l’hébreu, l’emphase verbale et l’étendue sémantique de « ressources ». La note a est légèrement ajustée pour ne pas limiter indûment la comparaison à un simple décompte numérique.
