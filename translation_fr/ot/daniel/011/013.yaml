  text: וְ/שָׁב֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/הֶעֱמִ֣יד הָמ֔וֹן רַ֖ב מִן הָ/רִאשׁ֑וֹן וּ/לְ/קֵ֨ץ הָֽ/עִתִּ֤ים שָׁנִים֙ יָ֣בוֹא ב֔וֹא בְּ/חַ֥יִל גָּד֖וֹל וּ/בִ/רְכ֥וּשׁ רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/013.yaml
  text: Then the king of the north will return and raise a multitude greater than the former one[a]; and at the end of the times, after some years[c][b], he will surely come with a great army and with much equipment.
translation:
  language: fr
  text: Alors le roi du Nord reviendra et rassemblera une multitude plus grande que la précédente[a]. Au terme des temps, après des années[b], il viendra à coup sûr avec une grande armée et d’abondantes ressources[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande multitude, supérieure à la première ». L’hébreu peut souligner à la fois l’ampleur et le nombre.
    reason: lexical_alternative
  - marker: b
    text: Ou « au terme des temps fixés, après des années ». L’expression hébraïque est condensée et peut évoquer une période déterminée arrivée à son terme.
    reason: lexical_alternative
  - marker: c
    text: Ou « beaucoup de matériel » ou « de grandes provisions ». Le mot hébreu désigne plus largement les biens ou les ressources qui accompagnent la campagne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Alors ... reviendra
  rationale: Le qal de שׁוב signifie ici « revenir ». « Alors » rend naturellement la progression narrative marquée par la conjonction.
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: le roi du Nord
  rationale: Cette formulation conserve le titre géographique récurrent du chapitre; la majuscule à « Nord » marque son emploi comme désignation régionale.
- source_word: וְהֶעֱמִיד
  choice: lèvera
  rationale: Le hiphil de עמד exprime ici le fait de faire se tenir ou de rassembler des forces. « Lever » convient naturellement à la constitution d’une force armée sans préciser davantage que l’hébreu.
- source_word: הָמוֹן רַב
  choice: une multitude
  rationale: הָמוֹן désigne une masse, une multitude ou une foule; le contexte est militaire, mais « multitude » préserve la largeur lexicale. L’idée de grandeur ressort déjà de la comparaison qui suit.
- source_word: מִן הָרִאשׁוֹן
  choice: plus grande que la précédente
  rationale: La préposition מן a une valeur comparative. Le féminin « précédente » reprend naturellement « multitude » et explicite le référent sous-entendu.
- source_word: וּלְקֵץ הָעִתִּים שָׁנִים
  choice: Au terme des temps, après des années
  rationale: 'La formulation conserve les deux éléments temporels de l’expression hébraïque condensée: l’achèvement des « temps » et le passage d’années, sans ajouter « quelques », absent du texte.'
- source_word: יָבוֹא בּוֹא
  choice: il viendra à coup sûr
  rationale: L’infinitif absolu joint au verbe conjugué intensifie l’affirmation. « À coup sûr » rend cette insistance en français courant et digne.
- source_word: בְּחַיִל גָּדוֹל
  choice: avec une grande armée
  rationale: חַיִל peut désigner la force, les richesses ou une armée; le contexte de campagne militaire favorise nettement « armée ».
- source_word: וּבִרְכוּשׁ רָב
  choice: et d’abondantes ressources
  rationale: רְכוּשׁ désigne largement des biens, possessions ou ressources. « Ressources » convient au contexte militaire tout en évitant de réduire le sens au seul équipement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La syntaxe temporelle volontairement resserrée garde l’ambiguïté de l’hébreu, expliquée en note. « Ressources » maintient la portée générale de רְכוּשׁ dans un contexte militaire.
