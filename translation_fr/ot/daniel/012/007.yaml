    text: 'Ou, plus littéralement, « pour une période fixée, des périodes fixées et une moitié » ; beaucoup comprennent : « pour un an, deux ans et six mois ».'
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : « la main du peuple saint » ; ici, la « main » désigne probablement la puissance ou la force.'
