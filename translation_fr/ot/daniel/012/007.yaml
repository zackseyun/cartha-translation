revisions:
- from: J’entendis alors l’homme vêtu de lin, qui se tenait au-dessus des eaux du fleuve. Il leva la main droite et la main gauche vers le ciel et jura par celui qui vit éternellement que ce serait pour un temps, des temps et la moitié d’un temps[a]. Quand l’anéantissement de la puissance du peuple saint serait achevé[b], toutes ces choses prendraient fin.
  to: J’entendis alors l’homme vêtu de lin, qui se trouvait au-dessus des eaux du fleuve. Il leva sa main droite et sa main gauche vers le ciel et jura par celui qui vit éternellement que ce serait pour un temps, des temps et la moitié d’un temps[a]. Lorsque le brisement de la puissance du peuple saint serait achevé[b], toutes ces choses seraient achevées.
  rationale: La révision limite « brisement » à la portée lexicale de נַפֵּץ, sans atténuer la violence de l'image ni imposer une lecture sur l'issue du peuple saint. « Seraient achevées » rend plus directement l'accomplissement de « toutes ces choses ». Les deux notes conservent les ancrages et l'ambiguïté du texte source.
