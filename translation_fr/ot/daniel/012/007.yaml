  text: וָ/אֶשְׁמַ֞ע אֶת הָ/אִ֣ישׁ לְב֣וּשׁ הַ/בַּדִּ֗ים אֲשֶׁ֣ר מִ/מַּעַל֮ לְ/מֵימֵ֣י הַ/יְאֹר֒ וַ/יָּ֨רֶם יְמִינ֤/וֹ וּ/שְׂמֹאל/וֹ֙ אֶל הַ/שָּׁמַ֔יִם וַ/יִּשָּׁבַ֖ע בְּ/חֵ֣י הָ/עוֹלָ֑ם כִּי֩ לְ/מוֹעֵ֨ד מֽוֹעֲדִ֜ים וָ/חֵ֗צִי וּ/כְ/כַלּ֛וֹת נַפֵּ֥ץ יַד עַם קֹ֖דֶשׁ תִּכְלֶ֥ינָה כָל אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/007.yaml
  text: Then I heard the man clothed in linen[a], who was above the waters of the river, and he raised his right hand and his left hand to heaven and swore by him who lives forever that it would be for a time, times, and half a time; and when the shattering of the power of the holy people is finished[b], all these things will be completed.
translation:
  language: fr
  text: J’entendis alors l’homme vêtu de lin, qui se trouvait au-dessus des eaux du fleuve. Il leva sa main droite et sa main gauche vers le ciel et jura par celui qui vit éternellement que ce serait pour un temps, des temps et la moitié d’un temps[a]. Lorsque le brisement de la puissance du peuple saint serait achevé[b], toutes ces choses seraient achevées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement, « pour une période fixée, des périodes fixées et une moitié » ; beaucoup comprennent : « pour un an, deux ans et six mois ».'
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : « la main du peuple saint » ; ici, la « main » désigne probablement la puissance ou la force.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבוּשׁ הַבַּדִּים
  choice: vêtu de lin
  rationale: Rend naturellement le participe passif et conserve l’image concrète du vêtement de lin.
- source_word: הַיְאֹר
  choice: le fleuve
  rationale: Dans le contexte de la vision de Daniel, le terme désigne le grand cours d’eau sans imposer l’identification au Nil.
- source_word: וַיָּרֶם יְמִינוֹ וּשְׂמֹאלוֹ
  choice: Il leva la main droite et la main gauche
  rationale: La formulation garde la mention explicite des deux mains, importante dans ce geste solennel de serment.
- source_word: בְּחֵי הָעוֹלָם
  choice: par celui qui vit éternellement
  rationale: Cette formulation française naturelle préserve la référence personnelle et divine de la formule de serment.
- source_word: לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: pour un temps, des temps et la moitié d’un temps
  rationale: Conserve l’expression apocalyptique et son ambiguïté sans imposer des unités chronologiques précises.
- source_word: וּכְכַלּוֹת נַפֵּץ יַד עַם קֹדֶשׁ
  choice: Quand l’anéantissement de la puissance du peuple saint serait achevé
  rationale: Le syntagme temporel est rendu clairement; « puissance » exprime la valeur métonymique de « main », tandis qu’« anéantissement » communique la violence de נַפֵּץ.
- source_word: תִּכְלֶינָה כָל אֵלֶּה
  choice: toutes ces choses prendraient fin
  rationale: Le futur dans le discours dépendant est naturellement rendu par le conditionnel en français; « prendraient fin » exprime l’aboutissement des événements annoncés.
theological_decisions:
- issue: Interprétation de la formule apocalyptique לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: Maintien de la formule « pour un temps, des temps et la moitié d’un temps » sans préciser la durée.
  alternative: « pour une période fixée, des périodes fixées et une moitié » ou « pour un an, deux ans et six mois »
  rationale: L’hébreu ne définit pas explicitement ici les unités. La traduction conserve donc l’ouverture interprétative du texte.
- issue: Valeur métonymique de יַד dans נַפֵּץ יַד עַם קֹדֶשׁ
  choice: « la puissance du peuple saint »
  alternative: « la main du peuple saint » ou « la force du peuple saint »
  rationale: « Puissance » transmet en français le sens métonymique probable de « main » sans atténuer l’écrasement subi par le peuple saint.
- issue: Portée de תִּכְלֶינָה
  choice: « prendraient fin »
  alternative: « seraient accomplies » ou « seraient achevées »
  rationale: Le choix exprime l’arrivée au terme de tous les événements annoncés sans déterminer davantage leur nature eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe du serment a été divisée en deux phrases pour la lisibilité, tout en conservant sa progression. Les marqueurs [a] et [b] figurent dans le texte principal.
