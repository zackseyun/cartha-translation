id: DAN.12.9
reference: Daniel 12:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לֵ֣ךְ דָּנִיֵּ֑אל כִּֽי סְתֻמִ֧ים וַ/חֲתֻמִ֛ים הַ/דְּבָרִ֖ים עַד עֵ֥ת קֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/009.yaml
  text: And he said[a], “Go your way, Daniel, because the words are concealed and sealed until the time of the end.”
translation:
  language: fr
  text: 'Il dit : « Va, Daniel, car ces paroles sont tenues secrètes et scellées jusqu’au temps de la fin. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le wayyiqtol fait avancer le récit. En français, « Il dit » rend naturellement la succession sans imposer un connecteur inutile.
- source_word: לֵךְ
  choice: Va
  rationale: L’impératif de הלך est rendu directement et naturellement; le contexte lui confère une nuance de congé ou de clôture.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Transcription française usuelle du nom propre.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’ordre; « car » convient au registre digne du passage tout en restant courant.
- source_word: סְתֻמִים
  choice: tenues secrètes
  rationale: Le participe passif de סתם évoque des paroles fermées, rendues inaccessibles ou gardées secrètes. Cette formulation française conserve cet état sans réduire le sens à la seule dissimulation.
- source_word: וַחֲתֻמִים
  choice: et scellées
  rationale: Le participe passif de חתם désigne naturellement ce qui est muni d’un sceau ou fermé par scellement, notamment un document.
- source_word: הַדְּבָרִים
  choice: ces paroles
  rationale: דברים renvoie ici au message révélé qui précède. Le démonstratif explicite en français cette référence contextuelle, tandis que « paroles » conserve la dimension verbale du message.
- source_word: עַד עֵת קֵץ
  choice: jusqu’au temps de la fin
  rationale: Rend formellement l’expression caractéristique de Daniel et en préserve la portée eschatologique sans préciser indûment sa chronologie.
theological_decisions:
- issue: Portée eschatologique de עֵת קֵץ
  choice: le temps de la fin
  alternative: le temps de la conclusion / l’époque finale
  rationale: « Le temps de la fin » maintient l’expression marquée de Daniel ainsi que son ouverture interprétative, sans identifier la fin à un calendrier ou à un événement doctrinal précis.
- issue: Nature de l’inaccessibilité des paroles
  choice: tenues secrètes et scellées
  alternative: fermées et scellées
  rationale: Le texte emploie deux participes passifs complémentaires. La traduction conserve les deux images et n’affirme pas si l’inaccessibilité concerne principalement la compréhension, la divulgation ou la conservation du message.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise et conserve le parallélisme des deux participes passifs ainsi que l’expression daniélique « le temps de la fin ».
