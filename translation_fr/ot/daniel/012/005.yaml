base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/005.yaml
  text: 'Then I[a], Daniel, looked, and behold, two others were standing: one on this bank of the river, and one on that bank of the river.'
translation:
  language: fr
  text: 'Alors, moi, Daniel, je regardai, et voici : deux autres se tenaient, l’un sur cette rive du fleuve et l’autre sur l’autre rive du fleuve.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète un adverbe de lieu (« ici/là ») pour chacun des deux personnages; le texte principal explicite qu’ils se trouvent sur des rives opposées.
    reason: La répétition de הֵנָּה et de לִשְׂפַת הַיְאֹר est rendue idiomatiquement par « cette rive » et « l’autre rive », sans prétendre que cette explicitation soit une traduction strictement littérale.
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: Puis … je regardai
  rationale: Le waw suivi du qatal fait progresser le récit. « Puis » exprime la succession, tandis que « je regardai » introduit naturellement la nouvelle scène contemplée.
- source_word: אֲנִי דָנִיֵּאל
  choice: moi, Daniel
  rationale: Le pronom explicite joint au nom propre a une valeur emphatique et d’auto-identification. « moi, Daniel » conserve cette insistance en français idiomatique.
- source_word: וְהִנֵּה
  choice: et voici
  rationale: Ce marqueur attire vivement l’attention sur un nouvel élément de la vision sans ajouter l’idée de soudaineté.
- source_word: שְׁנַיִם אֲחֵרִים
  choice: deux autres
  rationale: La formulation distingue ces personnages de celui qui est déjà présent, sans préciser leur nature.
- source_word: עֹמְדִים
  choice: se tenaient là
  rationale: Le participe décrit une posture continue. Cette tournure restitue la valeur durative et convient au décor visionnaire.
- source_word: הֵנָּה
  choice: cette rive / l’autre rive
  rationale: L’adverbe local répété situe les deux personnages de part et d’autre du fleuve. En français, le contraste entre « cette rive » et « l’autre rive » est clair et naturel.
- source_word: לִשְׂפַת
  choice: sur … rive
  rationale: שָׂפָה désigne le bord ou la rive; avec un cours d’eau, « rive » est le terme contextuel naturel.
- source_word: הַיְאֹר
  choice: le fleuve
  rationale: Dans ce contexte visionnaire, le mot désigne le cours d’eau déjà mentionné et n’impose pas l’identification au Nil. « Fleuve » maintient cette neutralité.
theological_decisions:
- issue: Identité des « deux autres »
  choice: Conserver la désignation neutre « deux autres »
  alternative: « deux autres anges » ou « deux autres êtres célestes »
  rationale: L’hébreu ne précise pas leur identité dans ce verset. La traduction ne doit donc pas ajouter une qualification théologique absente du texte.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque; « et voici » préserve la vivacité visionnaire. La formulation reste neutre quant à l’identité des personnages.
