base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/013.yaml
  text: But as for you[a], go to the end[d][c][b]; and you will rest and stand in your allotted place at the end of the days.
translation:
  language: fr
  text: Quant à toi, va jusqu’à la fin[a]. Tu te reposeras[b] et tu te tiendras debout pour la part qui t’est attribuée[c], à la fin des jours[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « va vers la fin ». La préposition peut présenter la fin comme le terme visé ; dans ce contexte, « jusqu’à la fin » est plus naturel.'
    reason: lexical_alternative
  - marker: b
    text: Ce repos désigne probablement la mort de Daniel avant l’accomplissement final, mais le texte hébreu dit simplement qu’il se reposera.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « tu te tiendras debout pour ton lot ». Il s’agit de la part qui lui est assignée ; dans ce contexte, le fait de se tenir debout peut aussi évoquer la résurrection.'
    reason: lexical_alternative
  - marker: d
    text: « La fin des jours » est une expression eschatologique ; voir aussi Daniel 12.2.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Quant à toi
  rationale: Le pronom indépendant, précédé de la conjonction, marque un retour contrasté à Daniel lui-même. « Quant à toi » rend naturellement ce changement de perspective sans accentuer excessivement l’opposition.
- source_word: לֵךְ לַ/קֵּץ
  choice: va vers la fin
  rationale: לֵךְ est un impératif simple, et לַקֵּץ présente la fin comme le terme vers lequel Daniel doit aller. Cette formulation conserve la valeur directionnelle possible de לְ, tandis que « jusqu’à la fin » reste une autre lecture plausible signalée en note.
- source_word: וְ/תָנוּחַ
  choice: Tu te reposeras
  rationale: Le verbe נוח signifie « se reposer ». Le futur convient à la suite de l’impératif et laisse implicite, comme l’hébreu, l’idée probable de la mort de Daniel avant l’accomplissement final.
- source_word: וְ/תַעֲמֹד
  choice: puis tu te tiendras debout
  rationale: עמד signifie littéralement « se tenir debout ». Dans ce contexte eschatologique, le verbe peut évoquer le relèvement ou la résurrection, mais la traduction conserve l’image lexicale sans expliciter davantage que le texte.
- source_word: לְ/גֹרָלְ/ךָ
  choice: pour la part qui t’est attribuée
  rationale: גּוֹרָל désigne d’abord le « lot », puis, par extension, la part attribuée par tirage ou décision. Cette formulation transmet le sens en français courant tout en maintenant l’idée d’une part assignée.
- source_word: לְ/קֵץ הַ/יָּמִין
  choice: à la fin des jours
  rationale: La formule correspond de près à l’hébreu et garde sa portée eschatologique sans préciser indûment la chronologie ou la nature de l’accomplissement.
theological_decisions:
- issue: Le repos désigne-t-il explicitement la mort de Daniel ?
  choice: Le texte principal dit simplement « Tu te reposeras ».
  alternative: « Tu reposeras dans la mort » ou « tu mourras et tu reposeras ».
  rationale: Le contexte rend probable une allusion à la mort, mais נוח signifie « se reposer ». La traduction préserve l’implicite et évite d’ajouter une précision interprétative au texte principal.
- issue: Le fait de se tenir debout désigne-t-il explicitement la résurrection ?
  choice: Le texte principal conserve « tu te tiendras debout ».
  alternative: « tu te relèveras » ou « tu ressusciteras ».
  rationale: Daniel 12, notamment le verset 2, donne à la formule une résonance de résurrection. Toutefois, עמד signifie « se tenir debout » plutôt que « ressusciter » de manière explicite ; la traduction maintient donc cette tension.
- issue: Sens de « ton lot »
  choice: « la part qui t’est attribuée »
  alternative: « ton lot », « ton héritage » ou « la place qui t’est réservée ».
  rationale: Le mot peut désigner une part ou un héritage assigné. « La part qui t’est attribuée » reste compréhensible sans imposer une conception plus précise de la récompense finale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en évitant l’expression opaque « pour ton lot » dans le texte principal. Les implications de mort, de résurrection et d’héritage final sont préservées sans être transformées en affirmations plus explicites que l’original.
