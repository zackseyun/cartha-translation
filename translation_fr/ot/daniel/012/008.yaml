reference: Daniel 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֥י שָׁמַ֖עְתִּי וְ/לֹ֣א אָבִ֑ין וָ/אֹ֣מְרָ֔/ה אֲדֹנִ֕/י מָ֥ה אַחֲרִ֖ית אֵֽלֶּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/008.yaml
  text: As for me[a], I heard, but I did not understand. So I said, “My lord, what will be the outcome of these things?”
translation:
  language: fr
  text: 'Quant à moi, j’entendis, mais je ne compris pas. Alors je dis : « Mon seigneur, quelle sera l’issue de tout cela[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelle sera la fin de ces choses ? »
    reason: 'Alternative lexicale : אַחֲרִית peut signifier aussi bien « issue, aboutissement » que « fin ».'
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant précédé de la conjonction met légèrement en relief le point de vue personnel de Daniel; « Quant à moi » restitue naturellement cette reprise contrastive.
- source_word: שָׁמַעְתִּי
  choice: j’entendis
  rationale: 'Le qal de שׁמע signifie ici simplement « entendre » : Daniel reçoit auditivement la révélation, sans que le verbe implique nécessairement une écoute attentive.'
- source_word: וְלֹא אָבִין
  choice: mais je ne compris pas
  rationale: 'בין signifie « comprendre, discerner ». « Mais » explicite la valeur adversative du contexte : Daniel entend les paroles sans en saisir le sens.'
- source_word: וָאֹמְרָה
  choice: Alors je dis
  rationale: La forme narrative fait progresser le récit; « Alors » exprime naturellement que la question de Daniel découle de son incompréhension.
- source_word: אֲדֹנִי
  choice: mon seigneur
  rationale: Il s’agit d’une formule respectueuse adressée au personnage céleste qui révèle le message. La minuscule évite de l’identifier sans nécessité au Seigneur Dieu.
- source_word: מָה אַחֲרִית אֵלֶּה
  choice: quelle sera l’issue de tout cela ?
  rationale: אַחֲרִית peut désigner la fin ou l’aboutissement. « L’issue de tout cela » exprime clairement la portée finale de la question tout en restant idiomatique en français moderne.
theological_decisions:
- issue: Référent de אֲדֹנִי
  choice: Formule respectueuse adressée au messager céleste, rendue par « mon seigneur » avec une minuscule.
  alternative: Adresse directe à Dieu, rendue par « mon Seigneur ».
  rationale: Le contexte immédiat présente Daniel s’adressant au personnage qui lui communique la révélation. La minuscule préserve la possibilité textuelle sans imposer une identification divine.
- issue: Sens de אַחֲרִית
  choice: « l’issue », au sens d’aboutissement final
  alternative: « la fin »
  rationale: Le mot hébreu permet les deux nuances. Le texte principal privilégie l’aboutissement dans ce contexte apocalyptique, tandis que la note conserve explicitement la traduction plus formelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient la tonalité narrative sans archaïsme marqué. La ponctuation française et la minuscule à « seigneur » distinguent respectueusement le titre de l’appellation divine.
