reference: Daniel 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה דָֽנִיֵּ֗אל סְתֹ֧ם הַ/דְּבָרִ֛ים וַ/חֲתֹ֥ם הַ/סֵּ֖פֶר עַד עֵ֣ת קֵ֑ץ יְשֹׁטְט֥וּ רַבִּ֖ים וְ/תִרְבֶּ֥ה הַ/דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/004.yaml
  text: But you[a], Daniel, shut up the words and seal the book until the time of the end. Many will roam about[b], and knowledge will increase.
translation:
  language: fr
  text: Quant à toi, Daniel, tiens secrètes les paroles et scelle le livre[a] jusqu’au temps de la fin. Beaucoup iront çà et là[b], et la connaissance augmentera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rouleau ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Beaucoup courront de tous côtés ». Le verbe hébreu peut aussi évoquer le fait de parcourir ou d’examiner quelque chose, d’où le sens possible : « Beaucoup feront des recherches, et la connaissance augmentera. »'
    reason: alternative_reading
lexical_decisions:
- source_word: סְתֹם
  choice: tiens … secrètes
  rationale: L’impératif exprime l’idée de fermer ou de rendre inaccessible. Cette formulation française naturelle conserve ici la notion de mise à l’écart sans affirmer que le message restera absolument incompréhensible.
- source_word: הַדְּבָרִים
  choice: les paroles
  rationale: דבר peut désigner des paroles ou des choses. Dans ce contexte, il renvoie au message révélé à Daniel; « les paroles » garde ce lien immédiat.
- source_word: חֲתֹם
  choice: scelle
  rationale: Le verbe évoque l’action d’apposer un sceau à un document, à la fois pour le préserver et pour en restreindre l’accès.
- source_word: הַסֵּפֶר
  choice: le livre
  rationale: סֵפֶר désigne un écrit, un document ou un rouleau. « Livre » est clair et consacré dans ce contexte; « rouleau » est signalé en note comme possibilité liée au support matériel ancien.
- source_word: עַד עֵת קֵץ
  choice: jusqu’au temps de la fin
  rationale: Cette traduction rend directement la limite temporelle et conserve la formulation eschatologique sans la paraphraser.
- source_word: יְשֹׁטְטוּ רַבִּים
  choice: Beaucoup iront çà et là
  rationale: שוטט décrit le fait de se déplacer en divers sens ou de parcourir quelque chose. La formulation principale garde l’image générale du mouvement, tandis que la note préserve la possibilité d’une recherche attentive.
- source_word: וְתִרְבֶּה הַדָּעַת
  choice: et la connaissance augmentera
  rationale: רבה indique ici l’accroissement, et דַּעַת désigne la connaissance. La formulation reste ouverte quant à la nature exacte de cette connaissance.
theological_decisions:
- issue: Sens de יְשֹׁטְטוּ רַבִּים וְתִרְבֶּה הַדָּעַת
  choice: Une déclaration ouverte selon laquelle beaucoup iront çà et là et la connaissance augmentera, sans préciser la nature de leurs déplacements ni celle de cette connaissance.
  alternative: Beaucoup parcourront attentivement le livre, de sorte que la compréhension de la prophétie augmentera; ou bien beaucoup se déplaceront littéralement et le savoir humain en général augmentera.
  rationale: L’hébreu permet aussi bien une évocation de déplacements qu’une idée de parcours ou de recherche. Le texte traduit et sa note maintiennent cette tension au lieu de l’identifier soit au progrès technologique, soit exclusivement à l’étude de la prophétie.
translation_notes:
  register: Français international moderne, digne et accessible. « Quant à toi » marque le contraste porté par וְאַתָּה; « tiens les paroles secrètes » est idiomatique tout en conservant l’idée de fermeture ou d’inaccessibilité. Les deux notes sont placées sur les mots auxquels elles se rapportent.
