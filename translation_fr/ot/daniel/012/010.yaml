source:
  edition: WLC
  text: יִ֠תְבָּֽרֲרוּ וְ/יִֽתְלַבְּנ֤וּ וְ/יִצָּֽרְפוּ֙ רַבִּ֔ים וְ/הִרְשִׁ֣יעוּ רְשָׁעִ֔ים וְ/לֹ֥א יָבִ֖ינוּ כָּל רְשָׁעִ֑ים וְ/הַ/מַּשְׂכִּלִ֖ים יָבִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/010.yaml
  text: Many will purify themselves and make themselves white and be refined[a], but the wicked will act wickedly; and none of the wicked will understand[b], but those who have insight will understand.
translation:
  language: fr
  text: Beaucoup se purifieront, deviendront blancs et seront affinés[a]. Mais les méchants agiront avec méchanceté ; aucun des méchants ne comprendra, tandis que ceux qui ont du discernement[b] comprendront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Beaucoup seront purifiés, blanchis et affinés. » Les deux premiers verbes hébreux peuvent avoir un sens passif, bien que leur forme permette aussi la nuance réfléchie ou moyenne retenue dans le texte.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « les sages ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְבָּרֲרוּ
  choice: se purifieront
  rationale: Le hitpael de ברר peut exprimer une action réfléchie ou un processus subi. « Se purifieront » conserve ici la nuance réfléchie sans exclure l’idée d’un processus de purification.
- source_word: יִתְלַבְּנוּ
  choice: se blanchiront
  rationale: Le hitpael de לבן évoque littéralement le fait de devenir blanc ou de se rendre blanc. « Se blanchiront » maintient l’image concrète au lieu de la réduire à une abstraction.
- source_word: יִצָּרְפוּ
  choice: seront affinés
  rationale: Le niphal de צרף désigne l’affinage, notamment celui des métaux, puis par extension la purification par l’épreuve. La forme passive française préserve à la fois la voix du verbe et la métaphore.
- source_word: רַבִּים
  choice: Beaucoup
  rationale: L’adjectif substantivé désigne un grand nombre de personnes sans les identifier davantage. « Beaucoup » est direct et naturel.
- source_word: הִרְשִׁיעוּ רְשָׁעִים
  choice: les méchants agiront avec méchanceté
  rationale: La tournure hébraïque associe deux mots de même racine pour souligner la conduite mauvaise. Cette formulation française en conserve l’insistance sans devenir artificielle.
- source_word: וְלֹא יָבִינוּ כָּל רְשָׁעִים
  choice: aucun des méchants ne comprendra
  rationale: L’hébreu exprime la négation totale par « tous » avec un verbe négatif. En français idiomatique, « aucun des méchants » rend clairement cette portée.
- source_word: הַמַּשְׂכִּלִים
  choice: ceux qui ont du discernement
  rationale: Le participe de שכל désigne des personnes capables de comprendre et de discerner, avec parfois une nuance d’instruction. Ce choix garde le lien lexical avec « comprendront » sans généraliser en « sages ».
- source_word: יָבִינוּ
  choice: comprendront
  rationale: Le qal de בין signifie couramment comprendre ou discerner. « Comprendront » fait ressortir nettement le contraste entre les deux groupes.
theological_decisions:
- issue: Les trois premiers verbes décrivent-ils une action réfléchie des personnes ou une purification qu’elles subissent ?
  choice: Les deux premiers verbes sont rendus de manière réfléchie (« se purifieront, se blanchiront »), et le troisième au passif (« seront affinés »).
  alternative: « Beaucoup seront purifiés, blanchis et affinés. »
  rationale: Les deux premiers verbes sont au hitpael et admettent une valeur réfléchie ou moyenne, tandis que le troisième est au niphal et se prête naturellement au passif. La traduction conserve cette variation grammaticale et ne nomme pas un agent que l’hébreu laisse implicite.
- issue: Faut-il rendre הַמַּשְׂכִּלִים par une catégorie générale comme « les sages » ?
  choice: ceux qui ont du discernement
  alternative: les sages
  rationale: Dans Daniel, ce terme désigne particulièrement ceux qui comprennent et discernent. Le rendu retenu préserve son rapport immédiat avec le verbe « comprendre » et évite d’introduire une catégorie de sagesse plus large que ne l’exige le contexte.
translation_notes:
  register: 'Français international moderne, clair et digne. La répétition « méchants… méchanceté… méchants » est volontaire : elle reflète l’insistance et les reprises lexicales de l’hébreu. « Se blanchiront » et « seront affinés » conservent les images concrètes de purification malgré leur caractère moins courant dans la langue quotidienne.'
