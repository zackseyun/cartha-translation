  source_fidelity: 'Le sens et la structure du texte hébreu sont bien rendus : la triple transformation de רבים, la conduite obstinée des méchants, la négation totale (« aucun ») et le contraste final avec les discernants sont conservés. « Seront affinés » maintient correctement l’image de צרף. Pour le deuxième hitpael, « se blanchiront » est grammaticalement possible, mais sonne peu naturel lorsqu’il s’applique à des personnes et peut suggérer une action matérielle volontaire plus étroite que la valeur moyenne admise par l’hébreu.'
  naturalness: La phrase est claire, digne et adaptée au français international moderne. Le remplacement de « se blanchiront » par « deviendront blancs » rend l’image concrète plus idiomatiquement française tout en conservant l’ambiguïté moyenne/réfléchie du hitpael. La répétition de « méchants » est justifiée par le texte source.
  terminology: « Se purifieront », « seront affinés », « agiront avec méchanceté », « comprendront » et « ceux qui ont du discernement » sont des choix terminologiques fidèles et cohérents. La note « les sages » donne utilement l’alternative lexicale pour הַמַּשְׂכִּלִים, sans imposer une interprétation.
