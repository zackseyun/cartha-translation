  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מֵ/עֵת֙ הוּסַ֣ר הַ/תָּמִ֔יד וְ/לָ/תֵ֖ת שִׁקּ֣וּץ שֹׁמֵ֑ם יָמִ֕ים אֶ֖לֶף מָאתַ֥יִם וְ/תִשְׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/011.yaml
  text: And from the time that the regular offering is removed and the abomination that desolates is set up[b][a], there will be 1,290 days.
translation:
  language: fr
  text: Et à partir du moment où l’offrande régulière sera supprimée[a] et où l’abomination qui dévaste sera mise en place[b], il y aura 1 290 jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le sacrifice quotidien ». L’hébreu תָּמִיד est un terme elliptique du vocabulaire cultuel qui désigne l’offrande régulière ou continuelle du temple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’abomination de la désolation » ou « l’abomination dévastatrice ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵעֵת
  choice: Et à partir du moment où
  rationale: La préposition מִן avec עֵת indique le point de départ temporel, tandis que ו relie l’énoncé au contexte précédent. Cette formulation est naturelle en français et conserve ces deux valeurs.
- source_word: הוּסַר
  choice: sera supprimée
  rationale: Le hofal de סור exprime une action passive d’enlèvement. Le futur convient au cadre prophétique et s’accorde naturellement avec « à partir du moment où ».
- source_word: הַתָּמִיד
  choice: l’offrande régulière
  rationale: תָּמִיד est ici un raccourci cultuel désignant l’offrande régulière ou continuelle du temple. « Offrande régulière » reste précis sans ajouter explicitement l’idée d’holocauste, absente du terme lui-même.
- source_word: וְלָתֵת
  choice: et où … sera mise en place
  rationale: Littéralement « et pour donner/placer », l’infinitif introduit ici l’installation de ce qui suit. Une tournure passive coordonnée rend clairement en français le second repère associé au point de départ.
- source_word: שִׁקּוּץ
  choice: l’abomination
  rationale: Le mot désigne une chose détestable, souvent liée à l’idolâtrie ou à la profanation. « Abomination » conserve le registre biblique reconnu sans préciser indûment sa nature.
- source_word: שֹׁמֵם
  choice: qui dévaste
  rationale: Le participe qualifie שִׁקּוּץ et peut exprimer son effet dévastateur. La proposition relative conserve cette force active tout en restant idiomatique.
- source_word: יָמִים אֶלֶף מָאתַיִם וְתִשְׁעִים
  choice: il y aura 1 290 jours
  rationale: 'L’hébreu énonce elliptiquement la durée : « jours, mille deux cents et quatre-vingt-dix ». L’ajout de « il y aura » produit une phrase française complète sans modifier le nombre.'
theological_decisions:
- issue: Sens de הַתָּמִיד dans le contexte cultuel et apocalyptique
  choice: l’offrande régulière
  alternative: le sacrifice quotidien ; l’offrande continuelle
  rationale: Le terme hébreu est elliptique et renvoie au rite régulier du temple. Le choix principal préserve cette référence sans restreindre le sens à un type de sacrifice que le verset ne nomme pas explicitement ; la formulation traditionnelle est signalée en note.
- issue: Rapport entre שִׁקּוּץ et שֹׁמֵם
  choice: l’abomination qui dévaste
  alternative: l’abomination de la désolation ; l’abomination dévastatrice
  rationale: Le participe שֹׁמֵם peut être rendu avec une force active et qualifier l’effet de l’abomination. La traduction principale garde cette valeur, tandis que la tournure traditionnelle et une autre construction possible sont conservées en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe prophétique demeure solennelle sans être archaïque. Les deux notes préservent les formulations traditionnelles et les ambiguïtés réelles de l’hébreu.
