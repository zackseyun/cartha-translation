  text: אַשְׁרֵ֥י הַֽ/מְחַכֶּ֖ה וְ/יַגִּ֑יעַ לְ/יָמִ֕ים אֶ֕לֶף שְׁלֹ֥שׁ מֵא֖וֹת שְׁלֹשִׁ֥ים וַ/חֲמִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/012.yaml
  text: Blessed is the one who waits and reaches the 1,335 days[a].
translation:
  language: fr
  text: Heureux celui qui attend et qui atteint le terme des 1 335 jours[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Heureux celui qui continue d’attendre et qui arrive au terme des 1 335 jours ! »'
    reason: Alternative lexicale mettant davantage en relief la durée de l’attente et l’arrivée au terme.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule exprime un état enviable de bonheur ou de faveur et conserve en français le ton solennel d’une béatitude.
- source_word: הַמְחַכֶּה
  choice: celui qui attend
  rationale: Le participe désigne une attente qui se prolonge, avec une nuance d’espérance, rendue naturellement par cette formulation.
- source_word: וְיַגִּיעַ
  choice: et qui parvient
  rationale: Dans ce contexte temporel, la forme verbale signifie atteindre un point déterminé. « Parvient » exprime à la fois l’arrivée au terme et l’endurance implicite.
- source_word: לְיָמִים
  choice: aux … jours
  rationale: La préposition marque ici le point temporel atteint; « parvenir aux 1 335 jours » reste proche de l’hébreu tout en étant intelligible en français.
- source_word: אֶלֶף שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: 1 335
  rationale: La suite de nombres hébraïque totalise 1 335; l’écriture chiffrée avec une espace suit l’usage typographique français moderne.
theological_decisions:
- issue: Sens de la béatitude dans un calendrier apocalyptique
  choice: Conserver l’indication temporelle sans préciser si les 1 335 jours doivent être compris littéralement ou symboliquement.
  alternative: Interpréter explicitement ce nombre soit comme une durée chronologique stricte, soit comme un nombre apocalyptique symbolique.
  rationale: Le texte bénit celui qui persévère jusqu’au terme indiqué, mais ne définit pas lui-même la nature de cette période; la traduction préserve donc cette tension interprétative.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « Heureux celui qui… » reprend naturellement la forme française d’une béatitude. Le point d’exclamation rend la force exclamative de אַשְׁרֵי sans ajouter d’interprétation.
