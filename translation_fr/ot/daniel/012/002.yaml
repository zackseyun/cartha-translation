source:
  edition: WLC
  text: וְ/רַבִּ֕ים מִ/יְּשֵׁנֵ֥י אַדְמַת עָפָ֖ר יָקִ֑יצוּ אֵ֚לֶּה לְ/חַיֵּ֣י עוֹלָ֔ם וְ/אֵ֥לֶּה לַ/חֲרָפ֖וֹת לְ/דִרְא֥וֹן עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/002.yaml
  text: And many of those sleeping in the dust of the earth will awake[a], these to everlasting life, and those to reproaches[c][b], to everlasting contempt.
translation:
  language: fr
  text: 'Beaucoup de ceux qui dorment dans la poussière de la terre se réveilleront[a] : les uns pour la vie éternelle, les autres pour les opprobres[b], pour une horreur éternelle[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Des multitudes parmi ceux qui dorment dans la poussière de la terre se réveilleront. » L’hébreu dit « beaucoup » et non explicitement « tous ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la honte » ou « le déshonneur ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un mépris éternel » ou « une répulsion éternelle ». Comparer Ésaïe 66.24, où le même nom rare apparaît dans un contexte de jugement.'
    reason: cross_reference
lexical_decisions:
- source_word: רַבִּים
  choice: beaucoup
  rationale: Rend directement l’idée de « nombreux/beaucoup » sans l’élargir explicitement à « tous ». En français, « beaucoup de ceux qui… » est naturel tout en conservant la portée indéterminée de l’hébreu.
- source_word: מִיְּשֵׁנֵי
  choice: de ceux qui dorment
  rationale: Préserve la métaphore du sommeil appliquée aux morts, sans la remplacer par une interprétation explicite.
- source_word: אַדְמַת עָפָר
  choice: dans la poussière de la terre
  rationale: Expression française claire et digne qui conserve les images hébraïques de la terre, de la poussière, de l’ensevelissement et de la mortalité.
- source_word: יָקִיצוּ
  choice: se réveilleront
  rationale: Maintient le lien lexical et imagé avec « ceux qui dorment », sans introduire un autre verbe tel que « ressusciter ».
- source_word: אֵלֶּה ... וְאֵלֶּה
  choice: les uns ... les autres
  rationale: Le français idiomatique emploie naturellement cette construction pour reproduire le contraste démonstratif hébreu entre deux groupes.
- source_word: לְחַיֵּי עוֹלָם
  choice: pour la vie éternelle
  rationale: Formulation française établie et naturelle. « Éternelle » est repris dans le second membre afin de préserver le parallélisme de עוֹלָם.
- source_word: חֲרָפוֹת
  choice: les humiliations
  rationale: Conserve le pluriel et la dimension publique de honte, d’opprobre ou d’affront. « Humiliations » est plus immédiatement compréhensible en français moderne que « opprobres », tout en restant distinct du terme suivant.
- source_word: דִרְאוֹן
  choice: horreur
  rationale: Ce nom rare exprime l’aversion ou la répulsion. « Horreur » rend fortement cette idée et correspond bien au contexte apparenté d’Ésaïe 66.24; « mépris » demeure une possibilité lexicale.
- source_word: עוֹלָם
  choice: éternelle
  rationale: La même traduction est employée dans les deux occurrences afin de préserver le parallélisme formel et sémantique du verset.
theological_decisions:
- issue: Portée de la résurrection exprimée par רַבִּים
  choice: Traduire par « beaucoup » sans expliciter « tous ».
  alternative: « Des multitudes » ou, par interprétation inclusive, « tous ».
  rationale: Le texte hébreu dit littéralement « beaucoup ». La traduction ne tranche donc pas la question de savoir si ce terme désigne ici l’ensemble des morts concernés.
- issue: Nature du destin négatif
  choice: 'Conserver deux expressions distinctes : « pour les humiliations, pour une horreur éternelle ».'
  alternative: « Pour la honte et le mépris éternel » ou « pour l’opprobre et une répulsion éternelle ».
  rationale: L’hébreu juxtapose un nom pluriel évoquant les affronts ou la honte et un nom singulier rare évoquant l’aversion. Les maintenir distincts préserve la structure et la tension du texte sans imposer une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du parallélisme hébreu, tandis que « les uns… les autres » évite un calque maladroit. Les marqueurs de notes sont placés immédiatement après les éléments concernés.
