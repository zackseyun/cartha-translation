  text: וַ/יֹּ֗אמֶר לָ/אִישׁ֙ לְב֣וּשׁ הַ/בַּדִּ֔ים אֲשֶׁ֥ר מִ/מַּ֖עַל לְ/מֵימֵ֣י הַ/יְאֹ֑ר עַד מָתַ֖י קֵ֥ץ הַ/פְּלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/006.yaml
  text: And he said to the man clothed in linen[a], who was above the waters of the river[b], “How long until the end of these wonders?”
translation:
  language: fr
  text: 'Et il dit à l’homme vêtu de lin, qui était au-dessus des eaux du fleuve : « Dans combien de temps viendra la fin de ces prodiges ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et il dit
  rationale: Le wayyiqtol poursuit le récit. « Et il dit » conserve le lien narratif sans préciser davantage l’identité du locuteur.
- source_word: לָאִישׁ לְבוּשׁ הַבַּדִּים
  choice: à l’homme vêtu de lin
  rationale: L’article désigne un personnage déjà identifiable dans la vision. « Vêtu de lin » rend naturellement la construction participiale et le nom du tissu.
- source_word: אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר
  choice: qui se tenait au-dessus des eaux du fleuve
  rationale: מִמַּעַל exprime une position supérieure. « Se tenait » explicite sobrement la position implicite en français, tandis que « fleuve » convient au cours d’eau de la scène sans imposer une identification au Nil.
- source_word: עַד מָתַי
  choice: Jusqu’à quand faudra-t-il attendre
  rationale: L’expression demande le temps restant avant l’aboutissement annoncé. Cette formulation est idiomatique en français moderne tout en conservant l’orientation prospective.
- source_word: קֵץ הַפְּלָאוֹת
  choice: la fin de ces événements extraordinaires
  rationale: קֵץ désigne le terme ou l’achèvement. Le pluriel substantivé הַפְּלָאוֹת évoque des faits extraordinaires ou prodigieux; « événements extraordinaires » est clair dans ce contexte visionnaire, sans supposer qu’il s’agit exclusivement de miracles.
theological_decisions:
- issue: Identité du locuteur et de l’homme vêtu de lin
  choice: Conserver le simple pronom narratif « il » et la description « l’homme vêtu de lin »
  alternative: Identifier explicitement le locuteur comme un ange ou l’homme vêtu de lin comme une manifestation divine ou christologique
  rationale: Le verset ne fournit pas lui-même ces identifications. La traduction préserve donc l’indétermination du texte et n’introduit aucune conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la solennité de la vision sans archaïsmes. Aucun appel de note n’est nécessaire, car les variantes lexicales peuvent être représentées adéquatement dans le corps du texte sans perte significative.
