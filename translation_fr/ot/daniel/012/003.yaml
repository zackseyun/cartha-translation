source:
  edition: WLC
  text: וְ/הַ֨/מַּשְׂכִּלִ֔ים יַזְהִ֖רוּ כְּ/זֹ֣הַר הָ/רָקִ֑יעַ וּ/מַצְדִּיקֵי֙ הָֽ/רַבִּ֔ים כַּ/כּוֹכָבִ֖ים לְ/עוֹלָ֥ם וָ/עֶֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/003.yaml
  text: And those who have insight will shine like the brightness of the expanse[a], and those who make the many righteous[c][b], like the stars forever and ever.
translation:
  language: fr
  text: Ceux qui auront du discernement[a] brilleront comme l’éclat de l’étendue céleste[b], et ceux qui conduiront la multitude à la justice[c], comme les étoiles, à tout jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sages » ou « ceux qui comprennent ».
    reason: lexical_alternative
  - marker: b
    text: L’« étendue céleste » désigne la vaste voûte des cieux ; la traduction traditionnelle est « firmament ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « ceux qui rendront juste la multitude ». Ou « ceux qui déclareront juste la multitude ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּשְׂכִּלִים
  choice: ceux qui auront du discernement
  rationale: Le participe de שכל désigne des personnes caractérisées par l’intelligence et le discernement. Cette formulation conserve cette nuance active et convient au cadre futur du passage.
- source_word: יַזְהִרוּ
  choice: brilleront
  rationale: Le hifil de זהר exprime ici l’éclat ou le rayonnement. « Brilleront » est naturel et s’accorde avec les deux comparaisons du verset.
- source_word: כְּזֹהַר
  choice: comme l’éclat
  rationale: זֹהַר désigne la clarté ou le rayonnement. « Éclat » évite la répétition immédiate de « brilleront » tout en gardant l’image lumineuse.
- source_word: הָרָקִיעַ
  choice: l’étendue céleste
  rationale: רָקִיעַ désigne l’étendue déployée du ciel. « Étendue céleste » est plus transparent en français moderne que « firmament » et plus précis que le seul mot « ciel ».
- source_word: וּמַצְדִּיקֵי
  choice: ceux qui rendront juste
  rationale: Le participe hifil de צדק a une force causative et peut signifier rendre juste, déclarer juste ou amener à la justice. Le rendu principal reste proche de cette forme causative sans réduire le terme à une seule catégorie doctrinale.
- source_word: הָרַבִּים
  choice: la multitude
  rationale: L’article défini est conservé. « La multitude » rend naturellement en français la portée collective de « les nombreux ».
- source_word: כַּכּוֹכָבִים
  choice: comme les étoiles
  rationale: Traduction directe et idiomatique de la comparaison.
- source_word: לְעוֹלָם וָעֶד
  choice: à tout jamais
  rationale: Cette locution française actuelle et digne exprime la perpétuité renforcée de la formule hébraïque.
theological_decisions:
- issue: Sens de מַצְדִּיקֵי הָרַבִּים
  choice: ceux qui rendront juste la multitude
  alternative: ceux qui conduiront la multitude à la justice ; ceux qui déclareront juste la multitude
  rationale: 'La construction causative permet plusieurs compréhensions : transformation morale, orientation vers la justice ou déclaration de justice. Le texte principal suit de près la causativité hébraïque, tandis que la note préserve les autres lectures sans imposer une doctrine ultérieure.'
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique et les images lumineuses sont conservés. Les futurs explicites situent naturellement les deux groupes dans la même promesse eschatologique, tandis que les notes maintiennent les ambiguïtés lexicales et théologiques de l’hébreu.
