review_pass:
  verdict: revise
  source_fidelity: La traduction restitue bien la structure générale, « se lèvera », « le grand prince », la détresse sans précédent et l’inscription dans le livre. Toutefois, « échappera au danger » ajoute « danger », absent de l’hébreu, et modifie inutilement l’expression de la délivrance. « Auprès de » est possible dans le contexte, mais atténue la relation exprimée par עַל ; la note doit mieux en signaler la portée possible sans présenter une interprétation comme certaine.
  naturalness: 'Le français est globalement moderne et lisible. La séquence « ton peuple échappera au danger : tous ceux... » est moins naturelle, car le collectif singulier est suivi d’une apposition plurielle et le deux-points est trop appuyé. Employer « sera délivré, tous ceux... » rend mieux le collectif hébreu et l’enchaînement explicatif.'
  terminology: « Michel », « grand prince », « détresse » et « livre » conviennent au registre apocalyptique. « Fils de ton peuple » conserve volontairement la formulation source. « Sera délivré » traduit יִמָּלֵט sans l’ajout interprétatif de « au danger » ; l’alternative « échappera » est conservée en note.
  issues:
