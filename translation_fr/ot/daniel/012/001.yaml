    issue: Ajout de « au danger » dans la traduction de יִמָּלֵט.
    rationale: Le mot « danger » ne correspond à aucun élément explicite du texte hébreu. Le verbe peut signifier « échapper » ou « être délivré » sans que l’objet ou la nature exacte de la menace soit formulé ici.
  - severity: low
    issue: 'Construction « ton peuple échappera au danger : tous ceux qui seront trouvés... ».'
    rationale: Le singulier collectif suivi du pluriel explicatif est plus fluide avec « sera délivré, tous ceux... », et la virgule reflète mieux la relation appositionnelle de כָּל que les deux-points.
  - severity: low
    issue: La note a peut distinguer plus nettement l’alternative plus littérale et la nuance protectrice contextuelle.
    rationale: עַל peut évoquer une position au-dessus, une charge ou une protection. La note ne doit pas fixer exclusivement le sens « défend ».
