revisions:
- from: 'En ce temps-là se lèvera Michel, le grand prince qui se tient auprès des fils de ton peuple.[a] Ce sera un temps de détresse tel qu’il n’y en a pas eu depuis qu’une nation existe jusqu’à ce temps-là.[b] En ce temps-là, ton peuple échappera au danger[c] : tous ceux qui seront trouvés inscrits dans le livre.'
  to: En ce temps-là, Michel se lèvera, le grand prince qui se tient auprès des fils de ton peuple.[a] Ce sera un temps de détresse tel qu’il n’y en a pas eu depuis qu’une nation existe jusqu’à ce temps-là.[b] En ce temps-là, ton peuple sera délivré, tous ceux qui seront trouvés inscrits dans le livre.[c]
  rationale: La révision retire l’ajout « au danger », non exprimé dans le texte source, et adopte « sera délivré » pour rendre naturellement le niphal de מלט tout en préservant « échappera » comme alternative. La dernière proposition est également ponctuée de façon plus conforme à la syntaxe explicative de l’hébreu. La note sur la relation de Michel aux « fils de ton peuple » préserve les nuances possibles de עַל sans trancher une interprétation doctrinale.
