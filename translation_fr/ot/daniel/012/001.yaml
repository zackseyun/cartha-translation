  text: וּ/בָ/עֵ֣ת הַ/הִיא֩ יַעֲמֹ֨ד מִֽיכָאֵ֜ל הַ/שַּׂ֣ר הַ/גָּד֗וֹל הָ/עֹמֵד֮ עַל בְּנֵ֣י עַמֶּ/ךָ֒ וְ/הָיְתָה֙ עֵ֣ת צָרָ֔ה אֲשֶׁ֤ר לֹֽא נִהְיְתָה֙ מִֽ/הְי֣וֹת גּ֔וֹי עַ֖ד הָ/עֵ֣ת הַ/הִ֑יא וּ/בָ/עֵ֤ת הַ/הִיא֙ יִמָּלֵ֣ט עַמְּ/ךָ֔ כָּל הַ/נִּמְצָ֖א כָּת֥וּב בַּ/סֵּֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/001.yaml
  text: And at that time Michael[a], the great prince who stands over the sons of your people, will arise. And there will be a time of distress such as has not happened since there was a nation until that time. And at that time your people will escape[c][b], everyone who is found written in the book.
translation:
  language: fr
  text: En ce temps-là, Michel se lèvera, le grand prince qui se tient auprès des fils de ton peuple.[a] Ce sera un temps de détresse tel qu’il n’y en a pas eu depuis qu’une nation existe jusqu’à ce temps-là.[b] En ce temps-là, ton peuple sera délivré, tous ceux qui seront trouvés inscrits dans le livre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui se tient au-dessus des fils de ton peuple ». La formulation peut aussi évoquer une fonction de protection ou de défense en leur faveur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un temps d’angoisse » ou « un temps de trouble ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « échappera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: se lèvera
  rationale: Le verbe signifie littéralement « se tenir debout », mais peut ici évoquer le fait de se lever pour intervenir. « Se lèvera » conserve cette force d’action sans préciser davantage la nature de l’intervention de Michel.
- source_word: הַשַּׂר הַגָּדוֹל
  choice: le grand prince
  rationale: שַׂר désigne un prince, un chef ou un haut dignitaire. « Prince » convient au cadre céleste et politique du livre de Daniel.
- source_word: הָעֹמֵד עַל
  choice: qui se tient auprès de
  rationale: La construction signifie littéralement « qui se tient sur/au-dessus de », mais exprime ici vraisemblablement une position de protection ou de responsabilité. « Auprès de » reste naturel en français tout en préservant l’image de présence; une autre interprétation est signalée en note.
- source_word: בְּנֵי עַמֶּךָ
  choice: les fils de ton peuple
  rationale: La formulation reproduit l’expression hébraïque masculine et collective sans la réduire simplement à « ton peuple ».
- source_word: עֵת צָרָה
  choice: un temps de détresse
  rationale: צָרָה peut désigner la détresse, le malheur ou l’angoisse. « Détresse » exprime clairement la gravité de la situation en français actuel.
- source_word: אֲשֶׁר לֹא נִהְיְתָה מִהְיוֹת גּוֹי
  choice: tel qu’il n’y en a pas eu depuis qu’une nation existe
  rationale: Cette formulation suit étroitement la comparaison historique de l’hébreu sans généraliser explicitement au commencement de toutes les nations.
- source_word: יִמָּלֵט
  choice: échappera au danger
  rationale: Le niphal de מלט peut signifier « échapper » ou « être délivré ». L’ajout idiomatique « au danger » rend la phrase naturelle en français sans exclure l’idée d’une délivrance.
- source_word: כָּל הַנִּמְצָא כָּתוּב
  choice: tous ceux qui seront trouvés inscrits
  rationale: Cette formulation conserve l’idée hébraïque de personnes constatées comme étant inscrites, avec un pluriel naturel après le collectif « ton peuple ».
- source_word: בַּסֵּפֶר
  choice: dans le livre
  rationale: סֵפֶר peut désigner un livre ou un rouleau. « Livre » est ici clair, traditionnel et compatible avec le motif céleste sans le préciser davantage.
theological_decisions:
- issue: Nature de l’action de Michel
  choice: « se lèvera », suggérant une intervention décisive
  alternative: « se tiendra » ou « se dressera »
  rationale: Le contexte favorise une action de Michel en faveur du peuple, mais le texte ne définit ni son mécanisme ni une doctrine angélologique détaillée.
- issue: Relation de Michel au peuple
  choice: « se tient auprès de », avec une note indiquant la valeur possible de défense
  alternative: « se tient au-dessus de », « veille sur » ou « défend »
  rationale: La préposition עַל permet une idée de position, d’autorité ou de protection. Le texte principal demeure imagé et la note rend explicite l’autre nuance plausible.
- issue: Portée de יִמָּלֵט
  choice: l’échappée hors du danger est mise au premier plan
  alternative: « sera délivré », pouvant souligner davantage l’action divine ou une délivrance eschatologique
  rationale: Le contexte apocalyptique permet une portée théologique plus large, mais le verset ne précise pas à lui seul la nature exacte de cette délivrance.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « En ce temps-là » et l’enchaînement des phrases reflètent la structure hébraïque. Les termes « prince », « détresse » et « livre » maintiennent le registre apocalyptique sans archaïsme excessif.
