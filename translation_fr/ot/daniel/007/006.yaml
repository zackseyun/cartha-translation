  text: בָּאתַ֨ר דְּנָ֜ה חָזֵ֣ה הֲוֵ֗ית וַ/אֲר֤וּ אָֽחֳרִי֙ כִּ/נְמַ֔ר וְ/לַ֨/הּ גַּפִּ֥ין אַרְבַּ֛ע דִּי ע֖וֹף עַל גבי/ה וְ/אַרְבְּעָ֤ה רֵאשִׁין֙ לְ/חֵ֣יוְתָ֔/א וְ/שָׁלְטָ֖ן יְהִ֥יב לַֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/006.yaml
  text: After this I kept looking[a], and behold, another, like a leopard; it had four wings of a bird on its back, and the beast had four heads, and dominion was given to it.
translation:
  language: fr
  text: 'Après cela, je regardais encore, et voici : une autre bête, semblable à un léopard ; elle avait quatre ailes d’oiseau sur le dos[a], et la bête avait quatre têtes. La domination lui fut donnée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur ses flancs » ; l’expression araméenne peut désigner le dos ou, plus généralement, la partie supérieure du corps de la créature.'
    reason: Alternative lexicale liée à l’étendue sémantique de גַּב.
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: Après cela
  rationale: Cette expression temporelle introduit l’élément suivant de la vision et conserve clairement la progression du récit.
- source_word: חָזֵה הֲוֵית
  choice: je continuai à regarder
  rationale: Le participe accompagné de l’auxiliaire exprime une action en cours dans le passé ; cette formulation française en restitue la durée.
- source_word: וַאֲרוּ
  choice: et voici
  rationale: L’interjection attire vivement l’attention sur une nouvelle scène de la vision.
- source_word: אָחֳרִי
  choice: une autre bête
  rationale: Le nom « bête » est explicité d’après le contexte immédiat afin que la phrase soit naturelle en français, sans changer le référent.
- source_word: כִּנְמַר
  choice: semblable à un léopard
  rationale: Cette formulation rend directement la comparaison marquée par le préfixe araméen.
- source_word: גַּפִּין אַרְבַּע דִּי עוֹף
  choice: quatre ailes d’oiseau
  rationale: La construction française exprime naturellement le nombre et le type d’ailes décrits.
- source_word: עַל גבי/ה
  choice: sur le dos
  rationale: « Dos » est ici le sens spatial le plus direct, tout en signalant en note la portée possible plus large du terme araméen.
- source_word: וְאַרְבְּעָה רֵאשִׁין לְחֵיוְתָא
  choice: La bête avait quatre têtes
  rationale: Le verbe « avait » rend naturellement en français la proposition nominale araméenne, tandis que « bête » maintient le vocabulaire symbolique du chapitre.
- source_word: שָׁלְטָן
  choice: la domination
  rationale: Le terme désigne le pouvoir de gouverner ; « domination » convient au registre politique et apocalyptique de Daniel.
- source_word: יְהִיב לַהּ
  choice: lui fut donnée
  rationale: Le passif conserve la formulation du texte et n’identifie pas celui qui accorde la domination.
theological_decisions:
- issue: Identité de celui qui donne la domination
  choice: la domination lui fut donnée
  alternative: elle reçut de Dieu la domination
  rationale: Le verset affirme que la domination fut donnée à la bête, mais ne nomme pas explicitement celui qui la donne. La traduction préserve cette réserve.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme visionnaire est conservé par « et voici », tandis que les phrases sont légèrement segmentées pour assurer une lecture naturelle.
