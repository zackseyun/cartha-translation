    issue: « sous ses pattes »
    rationale: L’araméen dit littéralement « avec/sur ses pieds ». « Sous ses pattes » est une explicitation imagée acceptable en français, mais elle ajoute une nuance spatiale; « avec ses pieds » est à la fois naturel et plus direct.
  - severity: low
    issue: « puis » avant « piétinait »
    rationale: La conjonction araméenne coordonne les actions sans marquer explicitement une étape ultérieure. « Et » conserve mieux cette simple coordination.
