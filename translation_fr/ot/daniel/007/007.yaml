source:
  edition: WLC
  text: בָּאתַ֣ר דְּנָה֩ חָזֵ֨ה הֲוֵ֜ית בְּ/חֶזְוֵ֣י לֵֽילְיָ֗/א וַ/אֲר֣וּ חֵיוָ֣ה רביעיה דְּחִילָה֩ וְ/אֵֽימְתָנִ֨י וְ/תַקִּיפָ֜א יַתִּ֗ירָא וְ/שִׁנַּ֨יִן דִּֽי פַרְזֶ֥ל לַ/הּ֙ רַבְרְבָ֔ן אָֽכְלָ֣ה וּ/מַדֱּקָ֔ה וּ/שְׁאָרָ֖/א ב/רגלי/ה רָפְסָ֑ה וְ/הִ֣יא מְשַׁנְּיָ֗ה מִן כָּל חֵֽיוָתָ/א֙ דִּ֣י קָֽדָמַ֔י/הּ וְ/קַרְנַ֥יִן עֲשַׂ֖ר לַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/007.yaml
  text: After this I kept looking in the visions of the night[a], and behold, a fourth beast, terrifying and dreadful and exceedingly strong. It had large iron teeth; it devoured and crushed, and it trampled the remainder with its feet. It was different from all the beasts that were before it[b], and it had ten horns.
translation:
  language: fr
  text: 'Après cela, je continuais à regarder dans les visions de la nuit : voici une quatrième bête, terrifiante, redoutable et d’une force extraordinaire. Elle avait de grandes dents de fer. Elle dévorait et broyait, et elle piétinait le reste avec ses pieds. Elle était différente de toutes les bêtes qui l’avaient précédée et elle avait dix cornes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: Après cela
  rationale: Marque naturellement la succession des scènes de la vision sans alourdir la phrase.
- source_word: חָזֵה הֲוֵית
  choice: je continuais à regarder
  rationale: Le participe accompagné de l’auxiliaire exprime une action en cours dans le passé; cette formulation en restitue la durée.
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: dans les visions de la nuit
  rationale: Rend directement le groupe araméen tout en conservant le pluriel et le cadre nocturne.
- source_word: וַאֲרוּ
  choice: voici
  rationale: Introduit avec vivacité l’apparition soudaine de la quatrième bête.
- source_word: חֵיוָה רביעיה
  choice: une quatrième bête
  rationale: « Bête » convient à la créature symbolique du contexte et évite le terme trop général « être vivant ».
- source_word: דְּחִילָה וְאֵימְתָנִי
  choice: terrifiante, redoutable
  rationale: Les deux adjectifs distincts sont maintenus afin de préserver l’accumulation et l’intensité de la description.
- source_word: וְתַקִּיפָא יַתִּירָא
  choice: d’une force extraordinaire
  rationale: Exprime clairement une puissance exceptionnelle dans un français actuel et soutenu.
- source_word: וְשִׁנַּיִן דִּי פַרְזֶל לַהּ רַבְרְבָן
  choice: Elle avait de grandes dents de fer
  rationale: Conserve la taille et la matière des dents dans un ordre naturel en français.
- source_word: אָכְלָה וּמַדֱּקָה
  choice: Elle dévorait et broyait
  rationale: Préserve l’image animale et la violence progressive des deux actions.
- source_word: וּשְׁאָרָא בְרגליה רָפְסָה
  choice: puis piétinait sous ses pattes ce qui restait
  rationale: « Ce qui restait » explicite naturellement שְׁאָרָא; « pattes » convient à une bête, et « piétinait » rend l’action violente du verbe.
- source_word: מְשַׁנְּיָה מִן כָּל חֵיוָתָא דִּי קָדָמַיהּ
  choice: différente de toutes les bêtes qui l’avaient précédée
  rationale: Rend la différence de nature ou d’aspect sans préciser en quoi elle consistait.
- source_word: וְקַרְנַיִן עֲשַׂר לַהּ
  choice: elle avait dix cornes
  rationale: Traduction directe qui conserve intacte l’image symbolique.
theological_decisions:
- issue: Identification de la quatrième bête
  choice: Décrire la bête sans identifier le royaume qu’elle représente.
  alternative: Introduire dans le verset une identification à Rome, à un empire hellénistique ou à un royaume eschatologique composite.
  rationale: Le verset souligne le caractère terrifiant, la puissance et la singularité de la bête, mais ne nomme pas le royaume; la traduction laisse donc cette identification à l’interprétation.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait soutient la continuité de la scène visionnaire; les verbes concrets préservent la vigueur de l’imagerie sans ajouter d’explication historique ou doctrinale.
