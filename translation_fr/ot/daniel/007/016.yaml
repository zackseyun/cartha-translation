source:
  edition: WLC
  text: קִרְבֵ֗ת עַל חַד֙ מִן קָ֣אֲמַיָּ֔/א וְ/יַצִּיבָ֥א אֶבְעֵֽא מִנֵּ֖/הּ עַֽל כָּל דְּנָ֑ה וַ/אֲמַר לִ֕/י וּ/פְשַׁ֥ר מִלַּיָּ֖/א יְהוֹדְעִנַּֽ/נִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/016.yaml
  text: I approached one of those standing there and asked him the certainty about all this[b][a]. So he told me and made known to me the interpretation of the matter.
translation:
  language: fr
  text: Je m’approchai de l’un de ceux qui se tenaient là et lui demandai la vérité au sujet de tout cela.[a] Il me dit et me fit connaître l’interprétation des paroles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est certain au sujet de tout cela »; le terme araméen peut désigner ce qui est ferme, certain ou vrai.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « l’interprétation des paroles »; ici, « paroles » peut désigner le contenu ou l’objet de la vision.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבֵת
  choice: Je m’approchai
  rationale: Le parfait araméen à la première personne fait avancer le récit. Le passé simple convient au registre narratif biblique moderne et « s’approcher » exprime directement le mouvement vers quelqu’un.
- source_word: עַל חַד מִן קָאֲמַיָּא
  choice: de l’un de ceux qui se tenaient là
  rationale: Cette formulation conserve l’idée d’un individu pris parmi plusieurs personnes présentes et debout, sans préciser leur identité.
- source_word: וְיַצִּיבָא אֶבְעֵא מִנֵּהּ עַל כָּל דְּנָה
  choice: et lui demandai ce qu’il en était exactement au sujet de tout cela
  rationale: יַצִּיבָא désigne ce qui est ferme, certain ou vrai. Cette tournure française naturelle exprime une demande d’éclaircissement sûr sans réduire le terme à une notion abstraite.
- source_word: וַאֲמַר לִי
  choice: Il me parla
  rationale: La traduction garde le verbe « dire/parler » sans transformer explicitement l’énoncé en réponse, tout en restant idiomatique dans l’enchaînement français.
- source_word: וּפְשַׁר מִלַּיָּא
  choice: l’interprétation de ces choses
  rationale: פְשַׁר signifie « interprétation » ou « explication ». מִלַּיָּא signifie littéralement « les paroles », mais peut ici désigner le contenu de la vision; « ces choses » garde cette portée contextuelle.
- source_word: יְהוֹדְעִנַּנִי
  choice: me fit connaître
  rationale: Cette formulation préserve la valeur causative du haphel de ידע et reste naturelle dans un registre biblique digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, au registre narratif digne. Le passé simple maintient la tonalité littéraire habituelle du récit biblique, tandis que les formulations restent accessibles et évitent de surinterpréter l’identité des personnages ou la nature de l’explication.
