revisions:
- from: Je m’approchai de l’un de ceux qui se tenaient là et lui demandai ce qu’il en était exactement au sujet de tout cela.[a] Il me parla et me fit connaître l’interprétation de ces choses.[b]
  to: Je m’approchai de l’un de ceux qui se tenaient là et lui demandai la vérité au sujet de tout cela.[a] Il me dit et me fit connaître l’interprétation des paroles.[b]
  rationale: La révision resserre la formulation française, restitue explicitement le verbe « dire » et conserve « paroles », plus proche de l’araméen, sans imposer une compréhension étroite grâce à la note. Les deux ancres de note restent placées sur les expressions qu’elles éclairent.
