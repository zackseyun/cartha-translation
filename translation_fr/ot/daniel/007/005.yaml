source:
  edition: WLC
  text: וַ/אֲר֣וּ חֵיוָה֩ אָחֳרִ֨י תִנְיָנָ֜ה דָּמְיָ֣ה לְ/דֹ֗ב וְ/לִ/שְׂטַר חַד֙ הֳקִמַ֔ת וּ/תְלָ֥ת עִלְעִ֛ין בְּ/פֻמַּ֖/הּ בֵּ֣ין שני/ה וְ/כֵן֙ אָמְרִ֣ין לַ֔/הּ ק֥וּמִֽי אֲכֻ֖לִי בְּשַׂ֥ר שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/005.yaml
  text: 'And look[a], another beast, a second one, resembling a bear; it was raised up on one side, and three ribs were in its mouth between its teeth. And this is what they were saying to it: “Arise[b], eat much flesh.”'
translation:
  language: fr
  text: 'Et voici : une autre bête, une deuxième, qui ressemblait à un ours. Elle fut dressée sur un côté[a], et trois côtes[b] étaient dans sa gueule, entre ses dents. Et voici ce qu’on lui disait : « Lève-toi, mange beaucoup de chair. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle fut dressée sur un flanc » ; l’expression souligne peut-être la posture déséquilibrée de la bête.
    reason: lexical_alternative
  - marker: b
    text: Peut-être « trois défenses », mais « trois côtes » correspond mieux à l’expression « entre ses dents ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוּ
  choice: Et voici
  rationale: Ce marqueur araméen introduit avec vivacité un nouvel élément de la vision. « Et voici » conserve cette force déictique dans un registre digne et courant.
- source_word: חֵיוָה
  choice: bête
  rationale: Dans Daniel 7, le mot désigne les créatures symboliques et menaçantes de la vision ; « bête » convient mieux que le terme plus neutre « animal ».
- source_word: אָחֳרִי תִנְיָנָה
  choice: une autre bête, une deuxième
  rationale: 'La formulation maintient les deux indications du texte : il s’agit d’une autre bête et elle occupe la deuxième place dans la série.'
- source_word: דָּמְיָה לְדֹב
  choice: ressemblait à un ours
  rationale: Le verbe exprime une ressemblance, sans identifier simplement la bête à un ours.
- source_word: וְלִשְׂטַר חַד הֳקִמַת
  choice: elle fut dressée sur un côté
  rationale: Le passif de « fut dressée » reflète la forme verbale araméenne, tandis que « sur un côté » préserve l’image difficile d’une posture asymétrique.
- source_word: וּתְלָת עִלְעִין
  choice: trois côtes
  rationale: « Côtes » est le sens le plus courant ici et s’accorde avec l’image de restes de proie maintenus entre les dents ; « défenses » demeure une possibilité lexicale minoritaire.
- source_word: בְּפֻמַּהּ בֵּין שניּה
  choice: étaient dans sa gueule, entre ses dents
  rationale: La traduction conserve les deux précisions de lieu et emploie « gueule », terme français naturel pour la bouche d’une bête.
- source_word: וְכֵן אָמְרִין לַהּ
  choice: Et voici ce qu’on lui disait
  rationale: Le pronom « on » rend naturellement en français le sujet pluriel non identifié, sans préciser qui parle.
- source_word: קוּמִי
  choice: Lève-toi
  rationale: Cet impératif est naturel en français moderne tout en gardant la solennité de l’ordre adressé à la bête.
- source_word: אֲכֻלִי בְּשַׂר שַׂגִּיא
  choice: mange beaucoup de chair
  rationale: La traduction garde le verbe simple « manger », sans l’intensifier en « dévorer », et conserve l’image concrète de la « chair ».
theological_decisions: []
