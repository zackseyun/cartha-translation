  text: עַד כָּ֖ה סוֹפָ֣/א דִֽי מִלְּתָ֑/א אֲנָ֨ה דָֽנִיֵּ֜אל שַׂגִּ֣יא רַעְיוֹנַ֣/י יְבַהֲלֻנַּ֗/נִי וְ/זִיוַ/י֙ יִשְׁתַּנּ֣וֹן עֲלַ֔/י וּ/מִלְּתָ֖/א בְּ/לִבִּ֥/י נִטְרֵֽת־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/028.yaml
  text: This is the end of the matter[a]. As for me, Daniel, my thoughts greatly terrified me, and my appearance changed because of it[b]; but I kept the matter in my heart.
translation:
  language: fr
  text: C’est ici la fin de l’affaire[a]. Quant à moi, Daniel, mes pensées me troublèrent beaucoup, et mon visage changea[b]. Mais je gardai l’affaire dans mon cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la conclusion de l’affaire ». Littéralement « Jusqu’ici, la fin de l’affaire ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mon apparence changea » ou « mon éclat changea ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד כָּה
  choice: Ici se termine
  rationale: Cette locution araméenne marque le point où le compte rendu s’achève. La formulation française exprime naturellement cette fonction conclusive sans reproduire lourdement « jusqu’ici ».
- source_word: סוֹפָא דִי מִלְּתָא
  choice: le récit
  rationale: L’expression signifie littéralement « la fin de l’affaire/de la parole ». Dans ce contexte, מִלְּתָא désigne le contenu rapporté de la vision; « récit » donne en français une conclusion claire, tandis que la note conserve l’alternative plus formelle.
- source_word: אֲנָה דָנִיֵּאל
  choice: Quant à moi, Daniel
  rationale: Le pronom indépendant suivi du nom propre est emphatique. « Quant à moi » conserve cette mise en relief dans un français naturel.
- source_word: שַׂגִּיא רַעְיוֹנַי יְבַהֲלֻנַּנִי
  choice: mes pensées m’effrayaient profondément
  rationale: רַעְיוֹנַי désigne les pensées ou réflexions de Daniel; le verbe exprime un profond effroi ou bouleversement, renforcé par שַׂגִּיא. Cette traduction préserve l’intensité sans ajouter une interprétation psychologique.
- source_word: וְזִיוַי יִשְׁתַּנּוֹן עֲלַי
  choice: et mon visage changea d’aspect
  rationale: זִיו peut désigner l’éclat, l’apparence ou la physionomie. Avec le verbe « changer », le contexte évoque l’altération visible du visage de Daniel. La formulation française reste idiomatique et la note signale les autres nuances possibles.
- source_word: וּמִלְּתָא ... נִטְרֵת
  choice: Mais je gardai cette affaire
  rationale: נִטְרֵת signifie garder, conserver ou préserver. « Mais » rend le contraste entre le trouble visible de Daniel et la conservation intérieure de la révélation; « cette affaire » reprend le sens large de מִלְּתָא.
- source_word: בְּלִבִּי
  choice: dans mon cœur
  rationale: La traduction conserve l’image anthropologique biblique du cœur comme siège de la vie intérieure, plutôt que de la réduire au seul intellect.
theological_decisions:
- issue: Langage anthropologique de בְּלִבִּי
  choice: Conserver « dans mon cœur »
  alternative: « dans mon esprit » ou « en moi-même »
  rationale: « Cœur » préserve la conception biblique globale de la personne intérieure et n’impose pas une lecture exclusivement cognitive.
- issue: Nature du trouble provoqué par la vision
  choice: « m’effrayaient profondément »
  alternative: « me bouleversaient beaucoup »
  rationale: Le verbe araméen permet plusieurs degrés d’alarme. Le contexte et l’intensif שַׂגִּיא justifient une formulation forte, sans préciser davantage la cause ou la portée théologique de cette peur.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la conclusion narrative solennelle du livre. Les répétitions liées à מִלְּתָא sont rendues selon le contexte par « récit » puis « affaire », avec les nuances littérales conservées en note.
