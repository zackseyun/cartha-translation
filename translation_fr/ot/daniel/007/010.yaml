id: DAN.7.10
reference: Daniel 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נְהַ֣ר דִּי נ֗וּר נָגֵ֤ד וְ/נָפֵק֙ מִן קֳדָמ֔וֹ/הִי אֶ֤לֶף אלפים יְשַׁמְּשׁוּנֵּ֔/הּ וְ/רִבּ֥וֹ רבון קָֽדָמ֣וֹ/הִי יְקוּמ֑וּן דִּינָ֥/א יְתִ֖ב וְ/סִפְרִ֥ין פְּתִֽיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/010.yaml
  text: A river of fire was flowing and coming out from before him[a]; a thousand thousands were serving him, and ten thousand times ten thousand were standing before him. The court sat[c][b], and the books were opened.
translation:
  language: fr
  text: Un fleuve de feu coulait et jaillissait de devant lui. Mille milliers le servaient, et dix mille fois dix mille se tenaient devant lui. Le tribunal prit place[a], et des livres furent ouverts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le jugement s’assit »; l’expression désigne le tribunal qui prend place pour juger.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des rouleaux furent ouverts ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהַר דִּי נוּר
  choice: un fleuve de feu
  rationale: Cette formulation conserve l’image forte et substantielle du texte araméen tout en étant naturelle en français.
- source_word: נָגֵד וְנָפֵק
  choice: coulait et jaillissait
  rationale: Les deux formes décrivent une action continue. « Coulait » exprime le mouvement du fleuve, tandis que « jaillissait » rend sa sortie dynamique sans réduire les deux verbes à un seul.
- source_word: מִן קֳדָמוֹהִי
  choice: de devant lui
  rationale: Cette traduction maintient l’image spatiale du texte et renvoie sans explicitation supplémentaire à celui qui siège sur le trône.
- source_word: אֶלֶף אלפים
  choice: mille milliers
  rationale: Le tour reproduit l’expression numérique emphatique de l’araméen et reste intelligible en français biblique moderne.
- source_word: יְשַׁמְּשׁוּנֵּהּ
  choice: le servaient
  rationale: Le verbe désigne le service ou l’assistance auprès d’un souverain; « servaient » est clair et n’impose pas une nuance liturgique technique.
- source_word: וְרִבּוֹ רבון
  choice: dix mille fois dix mille
  rationale: Cette formulation préserve l’imagerie numérique et l’ampleur de la multitude sans la remplacer par une simple idée d’innombrabilité.
- source_word: קָדָמוֹהִי יְקוּמוּן
  choice: se tenaient devant lui
  rationale: Dans la scène de cour, cette expression évoque naturellement des assistants debout en présence du souverain.
- source_word: דִּינָא יְתִב
  choice: Le tribunal prit place
  rationale: 'Littéralement, « le jugement s’assit ». Le français choisi restitue l’idiome judiciaire: la cour se constitue et siège pour juger.'
- source_word: וְסִפְרִין פְּתִיחוּ
  choice: des livres furent ouverts
  rationale: Le nom peut désigner des livres, des registres ou des rouleaux. « Livres » demeure suffisamment large et naturel dans cette scène judiciaire.
theological_decisions:
- issue: Interprétation de l’idiome judiciaire דִּינָא יְתִב
  choice: Le tribunal prit place
  alternative: Le jugement s’assit; la cour siégea
  rationale: Le choix communique la tenue de la cour céleste sans personnifier artificiellement le jugement ni préciser au-delà du texte la composition du tribunal.
- issue: Portée des expressions numériques concernant les assistants célestes
  choice: mille milliers… dix mille fois dix mille
  alternative: des milliers de milliers… des myriades de myriades
  rationale: La traduction conserve les nombres et leur intensification rhétorique sans décider s’ils doivent être compris comme un dénombrement exact ou comme l’expression d’une multitude immense.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme solennel et les répétitions numériques de la vision sont conservés, avec une formulation judiciaire naturelle.
