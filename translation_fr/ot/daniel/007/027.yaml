  variant: modern international French
source:
  edition: WLC
  text: וּ/מַלְכוּתָ֨/ה וְ/שָׁלְטָנָ֜/א וּ/רְבוּתָ֗/א דִּ֚י מַלְכְוָת֙ תְּח֣וֹת כָּל שְׁמַיָּ֔/א יְהִיבַ֕ת לְ/עַ֖ם קַדִּישֵׁ֣י עֶלְיוֹנִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/כֹל֙ שָׁלְטָ֣נַיָּ֔/א לֵ֥/הּ יִפְלְח֖וּן וְ/יִֽשְׁתַּמְּעֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/027.yaml
  text: And the kingdom and the dominion and the greatness of the kingdoms under all heaven shall be given to the people of the saints of the Most High[a]. His kingdom shall be an everlasting kingdom[c][b], and all dominions shall serve and obey him.
translation:
  language: fr
  text: La royauté, la domination et la grandeur des royaumes sous tout le ciel seront données au peuple des saints du Très-Haut[a]. Son royaume sera un royaume éternel[b], et toutes les puissances le serviront[c] et lui obéiront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « au peuple des êtres saints du Très-Haut » ou « au peuple saint du Très-Haut ».'
    reason: La construction araméenne et l’identité des « saints » permettent plusieurs compréhensions.
  - marker: b
    text: 'L’araméen emploie ici le singulier : « Son royaume… le serviront et lui obéiront. » Cela peut renvoyer au souverain représentatif apparu plus tôt dans la vision, alors même que le royaume est donné aux saints.'
    reason: Le singulier grammatical doit être signalé, car son référent demeure contextuellement et théologiquement significatif.
  - marker: c
    text: Dans Daniel, le verbe traduit par « servir » peut aussi avoir le sens d’« adorer » lorsque ce service est rendu à la divinité.
    reason: La traduction principale garde la portée large du verbe, tandis que la note indique sa possible nuance cultuelle.
lexical_decisions:
- source_word: מַלְכוּתָה
  choice: la royauté
  rationale: Dans cette triade, le terme désigne l'exercice du pouvoir royal autant que le royaume; «royauté» évite la répétition immédiate avec «des royaumes» et restitue le sens abstrait.
- source_word: שָׁלְטָנָא
  choice: la domination
  rationale: Le mot exprime l'autorité souveraine ou le pouvoir exercé; «domination» convient au registre politique et solennel du passage.
- source_word: רְבוּתָא
  choice: la grandeur
  rationale: Traduction directe qui conserve l'ampleur et le registre élevé du terme sans le réduire à la seule majesté royale.
- source_word: דִּי מַלְכְוָת תְּחוֹת כָּל שְׁמַיָּא
  choice: des royaumes sous tous les cieux
  rationale: Cette formulation naturelle en français exprime l'étendue universelle du pouvoir envisagé tout en conservant le pluriel araméen de «cieux».
- source_word: יְהִיבַת
  choice: seront données
  rationale: Bien que la forme soit un accompli, le contexte visionnaire et eschatologique lui donne une valeur prospective; l'accord pluriel reprend les trois éléments coordonnés.
- source_word: לְעַם קַדִּישֵׁי עֶלְיוֹנִין
  choice: au peuple des saints du Très-Haut
  rationale: Cette traduction maintient la structure difficile du texte et le sens lexical de «saints», sans décider si les «saints» sont des êtres célestes ou le peuple consacré à Dieu.
- source_word: מַלְכוּתֵהּ
  choice: Son royaume
  rationale: Le suffixe araméen est masculin singulier. La majuscule française signale naturellement le référent divin ou royal probable sans effacer la tension avec le peuple qui reçoit le royaume.
- source_word: מַלְכוּת עָלַם
  choice: un royaume éternel
  rationale: «Éternel» rend clairement la durée sans fin exprimée par עָלַם dans un français moderne et digne.
- source_word: שָׁלְטָנַיָּא
  choice: toutes les puissances
  rationale: Au pluriel, le terme peut désigner les autorités ou pouvoirs souverains. «Puissances» est plus naturel ici que «dominations» et laisse ouverte la question des royaumes ou de leurs dirigeants.
- source_word: יִפְלְחוּן
  choice: le serviront
  rationale: Le verbe désigne le service et peut, dans Daniel, prendre une portée cultuelle. «Servir» conserve cette amplitude sans imposer «adorer» dans le corps du texte.
- source_word: וְיִשְׁתַּמְּעוּן
  choice: et lui obéiront
  rationale: Dans ce cadre royal, l'idée d'écouter implique la soumission et l'obéissance; «obéir» rend clairement cette valeur contextuelle.
theological_decisions:
- issue: Référent des pronoms singuliers dans la seconde proposition
  choice: 'Conserver le singulier: «Son royaume… le serviront et lui obéiront».'
  alternative: Employer le pluriel («leur royaume… les serviront») ou prendre le royaume comme référent impersonnel.
  rationale: L'araméen porte des marques masculines singulières. Les conserver maintient la tension du chapitre entre le royaume donné aux saints et la souveraineté du représentant singulier, sans résoudre cette tension par la traduction.
- issue: Identité des «saints du Très-Haut»
  choice: Traduire littéralement «le peuple des saints du Très-Haut».
  alternative: «Le peuple saint du Très-Haut» ou «le peuple des êtres saints du Très-Haut».
  rationale: La construction peut être comprise collectivement ou comme désignant des «êtres saints». Le texte principal préserve sa forme et une note expose les principales possibilités.
- issue: Portée religieuse de יִפְלְחוּן
  choice: Employer «serviront» dans le texte principal.
  alternative: «Adoreront».
  rationale: Le verbe peut désigner un service cultuel rendu à la divinité dans Daniel, mais «servir» conserve à la fois la portée politique et la possible portée religieuse.
translation_notes:
  register: Français international moderne, solennel sans archaïsmes. La phrase conserve le rythme ternaire du début et les ambiguïtés de l'araméen. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
