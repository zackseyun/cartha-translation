  text: And four great beasts were coming up from the sea[a], different from one another.
translation:
  language: fr
  text: Et quatre grandes bêtes montaient de la mer[a], différentes les unes des autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « montaient hors de la mer ».'
    reason: La préposition araméenne indique la provenance ; « hors de la mer » explicite possible­ment l’émergence, tandis que le texte principal conserve une formulation française concise.
lexical_decisions:
- source_word: וְ/אַרְבַּע
  choice: Et quatre
  rationale: Le simple « et » conserve l’enchaînement de la vision sans lui ajouter une nuance temporelle.
- source_word: חֵיוָן
  choice: bêtes
  rationale: Dans cette vision apocalyptique, le terme désigne des êtres d’apparence animale à la portée inquiétante et symbolique ; « bêtes » en préserve la force sans expliciter d’avance leur interprétation.
- source_word: רַבְרְבָן
  choice: grandes
  rationale: L’adjectif exprime la grandeur ou la taille ; « grandes » reste naturel et laisse subsister cette amplitude de sens.
- source_word: סָלְקָן
  choice: montaient
  rationale: La forme araméenne présente l’action en cours dans la scène visionnaire ; l’imparfait français restitue naturellement ce mouvement continu.
- source_word: מִן יַמָּא
  choice: de la mer
  rationale: La préposition indique la provenance. « De la mer » est concis et naturel ; « hors de la mer » rend plus explicitement le mouvement de sortie et figure en note.
- source_word: שָׁנְיָן
  choice: différentes
  rationale: Dans cette construction comparative, le terme signifie que les bêtes se distinguent entre elles.
- source_word: דָּא מִן דָּא
  choice: les unes des autres
  rationale: Cette expression idiomatique marque la différenciation réciproque entre les quatre bêtes.
theological_decisions:
- issue: Force symbolique de חֵיוָן dans le contexte apocalyptique
  choice: « bêtes »
  alternative: « êtres vivants » ou « animaux »
  rationale: « Bêtes » conserve la tonalité menaçante et la portée symbolique des créatures, ultérieurement associées à des royaumes, sans introduire cette interprétation directement dans le verset.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait présente la scène comme une action visionnaire en cours ; l’accord au féminin suit « bêtes ».
