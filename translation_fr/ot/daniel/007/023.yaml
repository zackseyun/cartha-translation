base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/023.yaml
  text: 'Thus he said: ‘The fourth beast will be a fourth kingdom on the earth[a], which will be different from all the kingdoms[b]; and it will devour the whole earth and trample it down and crush it.’'
translation:
  language: fr
  text: 'Voici ce qu’il dit : « La quatrième bête sera un quatrième royaume sur la terre, différent de tous les royaumes ; il dévorera toute la terre, la piétinera et la broiera[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la réduira en morceaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן אֲמַר
  choice: Il dit ainsi
  rationale: Rend la formule introductive araméenne dans un français soutenu et naturel, tout en conservant sa valeur explicative.
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: la quatrième bête
  rationale: « Bête » maintient la force inquiétante de la figure apocalyptique et correspond à l’usage du contexte de Daniel 7.
- source_word: מַלְכוּ רביעיא
  choice: un quatrième royaume
  rationale: Le nom désigne ici un royaume ou pouvoir politique, comme l’explication de la vision l’indique explicitement ; l’article indéfini convient à l’emploi prédicatif.
- source_word: בְאַרְעָא
  choice: sur la terre
  rationale: La portée impériale et universelle du passage favorise « terre » plutôt qu’un territoire local.
- source_word: דִּי תִשְׁנֵא מִן כָּל מַלְכְוָתָא
  choice: Il sera différent de tous les autres royaumes
  rationale: Le verbe exprime la différence. La reprise par « il » rend en français la proposition araméenne sans ambiguïté, et « autres » explicite naturellement la comparaison implicite.
- source_word: וְתֵאכֻל כָּל אַרְעָא
  choice: il dévorera toute la terre
  rationale: « Dévorer » conserve l’image animale et violente du texte source.
- source_word: וּתְדוּשִׁנַּהּ
  choice: la piétinera
  rationale: Le verbe décrit l’action de fouler ou piétiner ; ce choix est direct et idiomatique.
- source_word: וְתַדְּקִנַּהּ
  choice: la broiera
  rationale: « Broyer » exprime la destruction intensive qui suit le piétinement ; « la mettra en pièces » demeure une traduction possible.
theological_decisions:
- issue: Référent de la quatrième bête
  choice: La bête est explicitement présentée comme un quatrième royaume.
  alternative: Laisser la nature politique de la bête moins explicite.
  rationale: Le texte araméen lui-même identifie la quatrième bête à un royaume ; la traduction conserve donc cette interprétation interne à la vision.
- issue: Étendue de כָּל אַרְעָא
  choice: toute la terre
  alternative: tout le pays
  rationale: Le cadre des royaumes mondiaux de Daniel 7 favorise une portée universelle, sans imposer l’identification historique précise de ce royaume.
translation_notes:
  register: Français international moderne, digne et accessible. La structure garde le ton solennel de l’explication angélique, avec des verbes concrets qui préservent la violence de l’imagerie.
