  text: וְ/קַרְנַיָּ֣/א עֲשַׂ֔ר מִנַּ/הּ֙ מַלְכוּתָ֔/ה עַשְׂרָ֥ה מַלְכִ֖ין יְקֻמ֑וּן וְ/אָחֳרָ֞ן יְק֣וּם אַחֲרֵי/ה֗וֹן וְ/ה֤וּא יִשְׁנֵא֙ מִן קַדְמָיֵ֔/א וּ/תְלָתָ֥ה מַלְכִ֖ין יְהַשְׁפִּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/024.yaml
  text: As for the ten horns[a], out of this kingdom ten kings will arise; and another will arise after them. He will be different from the former ones[b], and he will humble three kings.
translation:
  language: fr
  text: Les dix cornes représentent dix rois qui surgiront de ce royaume. Après eux, un autre surgira. Il sera différent des précédents et abaissera trois rois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « humiliera » ou « fera descendre trois rois ».
    reason: Alternative lexicale pour le causatif de שׁפל, qui signifie faire descendre ou abaisser sans préciser ici le moyen exact.
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: Les dix cornes représentent dix rois
  rationale: Conserve le symbole apocalyptique des « cornes », puis exprime l’identification donnée par le verset. « Représentent » rend naturellement en français la relation explicative implicite.
- source_word: מִנַּהּ מַלְכוּתָה
  choice: de ce royaume
  rationale: Le suffixe féminin renvoie au royaume figuré par la bête; cette formulation est claire et idiomatique.
- source_word: מַלְכִין יְקֻמוּן
  choice: dix rois qui surgiront
  rationale: Dans ce contexte, קום désigne l’apparition ou l’accession de dirigeants; « surgir » convient au registre prophétique sans préciser leur mode d’arrivée au pouvoir.
- source_word: וְאָחֳרָן יְקוּם אַחֲרֵיהוֹן
  choice: Après eux, un autre surgira
  rationale: Préserve la succession temporelle et le parallèle verbal avec les dix premiers rois.
- source_word: יִשְׁנֵא מִן קַדְמָיֵא
  choice: Il sera différent des précédents
  rationale: Le verbe araméen exprime ici la différence ou la distinction. Cette traduction n’en précise ni la nature ni le degré.
- source_word: וּתְלָתָה מַלְכִין יְהַשְׁפִּל
  choice: et abaissera trois rois
  rationale: « Abaisser » conserve l’image causative de שׁפל sans déterminer si l’action signifie humilier, destituer ou soumettre.
theological_decisions:
- issue: Nature de la différence du dernier roi
  choice: Il sera différent des précédents
  alternative: Il sera plus sévère que les précédents
  rationale: Le texte affirme sa différence sans définir celle-ci ni identifier le personnage; la traduction évite d’importer un système interprétatif.
- issue: Nature de l’action exercée contre les trois rois
  choice: abaissera trois rois
  alternative: soumettra trois rois
  rationale: « Abaissera » préserve la métaphore et l’indétermination du texte quant au mécanisme politique ou militaire.
translation_notes:
  register: Français international moderne, clair et digne. Le texte garde le symbolisme des cornes tout en donnant l’explication interne du verset. Le marqueur [a] est placé après la proposition concernée.
