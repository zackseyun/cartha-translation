source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֗ית עַ֣ד דִּ֤י כָרְסָוָן֙ רְמִ֔יו וְ/עַתִּ֥יק יוֹמִ֖ין יְתִ֑ב לְבוּשֵׁ֣/הּ כִּ/תְלַ֣ג חִוָּ֗ר וּ/שְׂעַ֤ר רֵאשֵׁ/הּ֙ כַּ/עֲמַ֣ר נְקֵ֔א כָּרְסְיֵ/הּ֙ שְׁבִיבִ֣ין דִּי נ֔וּר גַּלְגִּלּ֖וֹ/הִי נ֥וּר דָּלִֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/009.yaml
  text: I kept watching until thrones were set in place[a], and the Ancient of Days took his seat. His clothing was white as snow, and the hair of his head was like pure wool. His throne was flames of fire[b]; its wheels were a burning fire.
translation:
  language: fr
  text: Je continuai à regarder jusqu’à ce que des trônes soient mis en place[a], et l’Ancien des jours[b] s’assit. Son vêtement était blanc comme la neige, et les cheveux de sa tête étaient comme de la laine pure. Son trône était formé de flammes de feu, et ses roues étaient un feu ardent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soient placés ». La traduction traditionnelle « soient renversés » est possible pour ce verbe dans d’autres contextes, mais elle convient moins ici, où la cour céleste est en train de se réunir.'
    reason: alternative_reading
  - marker: b
    text: 'Araméen : « Ancien des jours », titre qui souligne un âge très ancien et une majesté éternelle.'
    reason: cultural_note
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Je continuai à regarder
  rationale: Le participe accompagné de l’auxiliaire exprime une action passée qui se prolonge; cette tournure en restitue la durée dans un registre narratif digne.
- source_word: עַד דִּי
  choice: jusqu’à ce que
  rationale: La locution marque le point jusqu’auquel Daniel poursuit son observation.
- source_word: כָרְסָוָן
  choice: des trônes
  rationale: Le pluriel désigne des sièges royaux ou judiciaires et maintient l’image de la cour céleste.
- source_word: רְמִיו
  choice: soient mis en place
  rationale: Dans cette scène où la cour céleste se réunit, le verbe indique probablement que les trônes sont disposés; le sens « renversés » demeure possible et est signalé en note.
- source_word: וְעַתִּיק יוֹמִין
  choice: et l’Ancien des jours
  rationale: Cette expression consacrée rend étroitement le titre araméen tout en conservant sa solennité et sa portée temporelle.
- source_word: יְתִב
  choice: s’assit
  rationale: Le verbe signifie s’asseoir ou siéger; le contexte judiciaire et royal donne à la formulation simple toute sa force.
- source_word: לְבוּשֵׁהּ כִּתְלַג חִוָּר
  choice: Son vêtement était blanc comme la neige
  rationale: La formulation conserve le singulier et la comparaison visuelle explicite.
- source_word: וּשְׂעַר רֵאשֵׁהּ כַּעֲמַר נְקֵא
  choice: et les cheveux de sa tête comme de la laine pure
  rationale: « Pure » rend la notion de propreté ou de pureté sans remplacer celle-ci par la blancheur, déjà suggérée par le parallèle.
- source_word: כָּרְסְיֵהּ שְׁבִיבִין דִּי נוּר
  choice: Son trône était fait de flammes de feu
  rationale: שְׁבִיבִין peut désigner des flammes ou des étincelles ardentes; « flammes de feu » préserve l’image intense, tandis que « fait de » produit une phrase française naturelle.
- source_word: גַּלְגִּלּוֹהִי נוּר דָּלִק
  choice: et ses roues étaient un feu ardent
  rationale: Le suffixe renvoie naturellement au trône; la formulation conserve l’identification métaphorique et l’image du trône-char.
theological_decisions:
- issue: Traduction de עַתִּיק יוֹמִין comme titre divin
  choice: l’Ancien des jours
  alternative: l’Ancien / un ancien chargé de jours
  rationale: L’expression fonctionne comme un titre révérencieux dans la vision de la cour céleste. La traduction retenue reste proche de l’araméen sans expliquer ni réduire l’identité du personnage.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le passé simple soutient le registre visionnaire et narratif. Les images concrètes et la tension théologique du texte araméen sont préservées sans ajout confessionnel.
