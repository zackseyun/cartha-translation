  source_fidelity: La construction araméenne situe l’esprit de Daniel « dans son étui/fourreau », image rare qui désigne vraisemblablement le corps. « Au-dedans de son enveloppe » cherche à conserver cette image, mais « enveloppe » est imprécis et ne rend pas naturellement la fonction corporelle du terme. « Dans mon corps », avec une note littérale, communique le sens contextuel sans supprimer l’ambiguïté lexicale. Le reste rend correctement l’affliction intérieure et la forte frayeur causée par les visions.
  naturalness: « J’eus l’esprit profondément troublé au-dedans de son enveloppe » est compréhensible, mais très peu naturel en français moderne et l’antécédent de « son » est momentanément opaque. « Mon esprit fut profondément troublé dans mon corps » est clair, digne et conserve une certaine littéralité. « Les visions de ma tête » reste une expression volontairement concrète, fidèle à l’araméen, tout en étant recevable dans un registre biblique moderne.
  terminology: « Esprit », « visions » et « m’épouvantèrent » conviennent. La note doit présenter « étui/fourreau » comme la formulation littérale et le corps comme le sens probable, sans transformer l’image en affirmation anthropologique doctrinale.
