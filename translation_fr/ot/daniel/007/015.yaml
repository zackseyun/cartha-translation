  text: אֶתְכְּרִיַּ֥ת רוּחִ֛/י אֲנָ֥ה דָנִיֵּ֖אל בְּ/ג֣וֹא נִדְנֶ֑ה וְ/חֶזְוֵ֥י רֵאשִׁ֖/י יְבַהֲלֻנַּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/015.yaml
  text: As for me[a], Daniel, my spirit was distressed within me, and the visions of my head terrified me.
translation:
  language: fr
  text: Moi, Daniel, mon esprit fut profondément troublé dans mon corps[a], et les visions de ma tête m’épouvantèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « dans son étui » ou « dans son fourreau ». Le terme araméen rare désigne probablement ici le corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתְכְּרִיַּת
  choice: profondément troublé
  rationale: Le verbe exprime une souffrance ou une agitation intérieure. « Profondément troublé » en restitue la force sans imposer l’image plus littérale mais incertaine d’un esprit « transpercé ».
- source_word: רוּחִי
  choice: l’esprit
  rationale: Dans « j’eus l’esprit… », le possessif français est naturellement exprimé par la construction avec « avoir ». Le terme désigne ici l’être intérieur de Daniel, et non le vent ou le souffle physique.
- source_word: בְּגוֹא
  choice: au-dedans de
  rationale: Cette locution marque explicitement une situation intérieure et convient à l’image du contenant qui suit.
- source_word: נִדְנֶה
  choice: son enveloppe
  rationale: Ce nom araméen rare désigne littéralement un étui ou un fourreau et sert ici de métaphore du corps qui contient l’esprit. « Enveloppe » conserve l’image tout en restant plus intelligible en français que « fourreau ».
- source_word: חֶזְוֵי
  choice: les visions
  rationale: Dans ce contexte apocalyptique, le mot désigne les scènes contemplées par Daniel en vision.
- source_word: רֵאשִׁי
  choice: de ma tête
  rationale: La formulation conserve l’expression concrète et inhabituelle de l’araméen, sans la remplacer de manière interprétative par « de mon esprit ».
- source_word: יְבַהֲלֻנַּנִי
  choice: m’épouvantèrent
  rationale: Le verbe exprime une peur ou un bouleversement intense. « M’épouvantèrent » en préserve la force.
theological_decisions:
- issue: Rapport entre l’esprit et son « enveloppe »
  choice: 'Conserver la métaphore corporelle : « mon esprit… au-dedans de son enveloppe »'
  alternative: « mon esprit fut profondément troublé en moi » ou « dans mon corps »
  rationale: L’araméen emploie un terme rare évoquant un étui ou un fourreau. Le texte principal préserve cette anthropologie imagée sans définir dogmatiquement la relation entre l’esprit et le corps; la note explicite le sens probable.
translation_notes:
  register: Français moderne, digne et lisible. La tournure « j’eus l’esprit profondément troublé » est idiomatique, tandis que « de ma tête » et la métaphore de l’« enveloppe » maintiennent les particularités expressives de l’araméen.
