  variant: modern international French
source:
  edition: WLC
  text: אִלֵּין֙ חֵיוָתָ֣/א רַבְרְבָתָ֔/א דִּ֥י אִנִּ֖ין אַרְבַּ֑ע אַרְבְּעָ֥ה מַלְכִ֖ין יְקוּמ֥וּן מִן אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/017.yaml
  text: These great beasts[a], which are four, are four kings who will arise from the earth.
translation:
  language: fr
  text: Ces grandes bêtes, qui sont au nombre de quatre, sont quatre rois qui surgiront de la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays ». Le mot araméen אַרְעָא peut désigner soit la « terre », soit un « pays » ; « terre » est retenu ici en raison de la vaste portée apocalyptique du chapitre.
    reason: Alternative lexicale
lexical_decisions:
- source_word: אִלֵּין
  choice: Ces
  rationale: Le démonstratif pluriel renvoie directement aux bêtes qui viennent d’apparaître dans la vision.
- source_word: חֵיוָתָא
  choice: bêtes
  rationale: Dans ce contexte apocalyptique, « bêtes » restitue mieux la force inquiétante et symbolique du terme que « animaux » ou « êtres vivants ».
- source_word: רַבְרְבָתָא
  choice: grandes
  rationale: L’adjectif exprime la grandeur ou la grande taille ; « grandes bêtes » est naturel en français et conserve ces deux nuances possibles.
- source_word: דִּי אִנִּין אַרְבַּע
  choice: qui sont au nombre de quatre
  rationale: Cette formulation française naturelle conserve la proposition relative et précise explicitement le nombre des bêtes.
- source_word: אַרְבְּעָה מַלְכִין
  choice: quatre rois
  rationale: Le texte araméen dit explicitement « rois », et non « royaumes » ; la traduction préserve cette donnée sans imposer une interprétation harmonisante.
- source_word: יְקוּמוּן
  choice: surgiront
  rationale: Le verbe signifie se lever ou apparaître. « Surgiront » convient à l’émergence de souverains dans un cadre prophétique et apocalyptique.
- source_word: מִן אַרְעָא
  choice: de la terre
  rationale: Le nom peut désigner la terre au sens large ou un pays. « La terre » convient mieux à l’ampleur de la vision et à sa perspective céleste, tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Référent des « quatre rois » dans le symbolisme apocalyptique
  choice: Conserver « quatre rois » dans le texte principal.
  alternative: Traduire de manière interprétative par « quatre royaumes » ou expliquer ce référent dans le texte.
  rationale: L’araméen emploie מַלְכִין, « rois ». La traduction maintient la formulation et la tension du texte sans y introduire une harmonisation tirée du contexte voisin.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « qui sont au nombre de quatre » évite une construction lourde tout en restant proche de la syntaxe araméenne. Le marqueur de note est placé après « terre », le mot auquel la variante se rapporte.
