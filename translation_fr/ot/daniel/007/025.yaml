    issue: « jusqu’à un temps, des temps et la moitié d’un temps »
    rationale: Cette tournure française présente spontanément la formule comme un point d’arrivée (« jusqu’à ») plutôt que comme la durée pendant laquelle ils sont livrés. Dans ce contexte, « pendant » rend plus clairement la valeur temporelle de la formule araméenne sans en fixer la durée.
  - severity: low
    issue: Note c formulée d’abord de manière interprétative
    rationale: La note dit directement « trois temps et demi », alors que le texte principal conserve intentionnellement la formule « un temps, des temps et la moitié d’un temps ». Il est préférable de signaler d’abord qu’il s’agit de la formulation littérale, puis de mentionner les interprétations possibles.
