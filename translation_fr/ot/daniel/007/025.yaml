  to: Il prononcera des paroles contre le Très-Haut et épuisera les saints du Très-Haut. Il projettera de changer les temps[a] et la loi. Ils seront livrés en son pouvoir[b] pendant un temps, des temps et la moitié d’un temps[c].
  rationale: La révision remplace seulement « jusqu’à » par « pendant », afin d’exprimer naturellement la durée de la remise au pouvoir du personnage. La note c est ajustée pour conserver d’abord la formulation araméenne et ne présenter les lectures numériques ou symboliques qu’à titre de possibilités.
