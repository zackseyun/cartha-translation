source:
  edition: WLC
  text: וּ/מִלִּ֗ין לְ/צַ֤ד עלי/א יְמַלִּ֔ל וּ/לְ/קַדִּישֵׁ֥י עֶלְיוֹנִ֖ין יְבַלֵּ֑א וְ/יִסְבַּ֗ר לְ/הַשְׁנָיָה֙ זִמְנִ֣ין וְ/דָ֔ת וְ/יִתְיַהֲב֣וּן בִּ/ידֵ֔/הּ עַד עִדָּ֥ן וְ/עִדָּנִ֖ין וּ/פְלַ֥ג עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/025.yaml
  text: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
translation:
  language: fr
  text: Il prononcera des paroles contre le Très-Haut et épuisera les saints du Très-Haut. Il projettera de changer les temps[a] et la loi. Ils seront livrés en son pouvoir[b] pendant un temps, des temps et la moitié d’un temps[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les temps fixés », éventuellement les saisons établies ou les temps de fête.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans sa main ». Le sujet implicite de « seront livrés » désigne très probablement les saints.
    reason: alternative_reading
  - marker: c
    text: Littéralement « un temps, des temps et la moitié d’un temps ». Cette formule peut évoquer trois temps et demi, parfois compris comme trois ans et demi, ou plus généralement une période limitée.
    reason: alternative_reading
lexical_decisions:
- source_word: מִלִּין לְצַד עֶלְיָא
  choice: des paroles contre le Très-Haut
  rationale: « Paroles » rend directement le pluriel araméen dans ce contexte de discours hostile, et la préposition a ici une valeur d’opposition. « Le Très-Haut » conserve le titre divin usuel.
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: les saints du Très-Haut
  rationale: Cette formulation concise conserve l’expression traditionnelle ainsi que la possibilité formelle de comprendre « saints » comme des êtres saints, même si le contexte de Daniel 7 désigne très probablement le peuple consacré à Dieu.
- source_word: יְבַלֵּא
  choice: épuisera
  rationale: Le verbe évoque l’action d’user ou d’épuiser par une oppression prolongée. « Épuisera » est naturel en français et maintient cette force métaphorique.
- source_word: יִסְבַּר לְהַשְׁנָיָה
  choice: projettera de changer
  rationale: Le verbe exprime une pensée ou une intention. « Projettera » indique une volonté d’agir sans affirmer que la tentative aboutira.
- source_word: זִמְנִין וְדָת
  choice: les temps et la loi
  rationale: « Temps » préserve l’étendue sémantique du terme, qui peut aussi désigner des temps fixés ou des fêtes. « Loi » convient au nom araméen qui peut également signifier décret.
- source_word: יִתְיַהֲבוּן בִּידֵהּ
  choice: Ils seront livrés en son pouvoir
  rationale: Le passif pluriel est conservé. « En son pouvoir » rend naturellement l’image sémitique de la main comme symbole d’autorité, tandis que le pronom maintient le sujet implicite du texte.
- source_word: עַד עִדָּן וְעִדָּנִין וּפְלַג עִדָּן
  choice: jusqu’à un temps, des temps et la moitié d’un temps
  rationale: « Jusqu’à » rend עַד et la formule apocalyptique est maintenue sans la convertir en années ni en fixer la valeur exacte.
theological_decisions:
- issue: Référent des « saints du Très-Haut »
  choice: Conserver « saints » sans expliciter davantage dans le texte principal
  alternative: Le peuple saint du Très-Haut ; les êtres saints du Très-Haut
  rationale: Le contexte des versets 18, 22 et 27 oriente vers le peuple de Dieu, mais la formulation araméenne n’exclut pas formellement un référent céleste. La traduction préserve cette tension.
- issue: Sujet implicite de « seront livrés »
  choice: Employer le pronom pluriel « ils », renvoyant le plus naturellement aux saints
  alternative: Les saints seront livrés ; les temps et la loi seront livrés
  rationale: L’accord pluriel et le contexte favorisent les saints comme référent, mais le texte ne répète pas explicitement le nom. Le pronom reproduit cette part d’implicite, avec une note explicative.
- issue: Valeur de la formule temporelle finale
  choice: Conserver littéralement la formule apocalyptique
  alternative: Trois ans et demi ; une période limitée symbolique
  rationale: Le texte permet des lectures numérique et symbolique. Le traduire directement par une durée calendaire imposerait une interprétation qui n’est pas exprimée explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’araméen tout en évitant des tournures artificielles. « Saints » et la formule temporelle sont conservés afin de ne pas effacer les ambiguïtés du passage.
