  text: וְ/עַל קַרְנַיָּ֤/א עֲשַׂר֙ דִּ֣י בְ/רֵאשַׁ֔/הּ וְ/אָחֳרִי֙ דִּ֣י סִלְקַ֔ת ו/נפלו מִן קדמי/ה תְּלָ֑ת וְ/קַרְנָ֨/א דִכֵּ֜ן וְ/עַיְנִ֣ין לַ֗/הּ וְ/פֻם֙ מְמַלִּ֣ל רַבְרְבָ֔ן וְ/חֶזְוַ֖/הּ רַ֥ב מִן חַבְרָתַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/020.yaml
  text: and about the ten horns that were on its head[a], and the other horn that came up, before which three fell—the horn that had eyes and a mouth speaking great things, and whose appearance was greater than that of its companions.
translation:
  language: fr
  text: et au sujet des dix cornes qui étaient sur sa tête, et de l’autre corne qui s’était élevée et devant laquelle trois étaient tombées — cette corne qui avait des yeux et une bouche qui disait de grandes choses[a], et dont l’apparence était plus grande que celle de ses compagnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une bouche qui tenait des propos arrogants » ou « qui proférait de grandes vantardises ».'
    reason: Signale la nuance possible de discours orgueilleux dans רַבְרְבָן, tout en maintenant dans le texte la formulation plus littérale.
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: les dix cornes
  rationale: Conserve sans l’interpréter l’image symbolique explicite de l’araméen.
- source_word: בְרֵאשַׁהּ
  choice: sur sa tête
  rationale: Rend naturellement la relation spatiale; le suffixe féminin renvoie à la bête.
- source_word: אָחֳרִי דִּי סִלְקַת
  choice: l’autre corne qui était montée
  rationale: « L’autre » distingue cette corne des dix déjà mentionnées, tandis que « était montée » maintient l’image visuelle de son apparition.
- source_word: וּנְפָלוּ מִן קֳדָמַיהּ תְּלָת
  choice: devant laquelle trois étaient tombées
  rationale: Préserve le rapport spatial ou confrontationnel de « devant elle » sans préciser davantage la cause de leur chute.
- source_word: וְעַיְנִין לַהּ
  choice: qui avait des yeux
  rationale: Expression française directe qui conserve le détail saisissant de la vision.
- source_word: וְפֻם מְמַלִּל רַבְרְבָן
  choice: une bouche qui disait de grandes choses
  rationale: Suit de près la formulation araméenne et évite d’introduire dans le texte principal l’idée explicite de vantardise, bien que le contexte puisse la suggérer.
- source_word: וְחֶזְוַהּ רַב מִן חַבְרָתַהּ
  choice: dont l’apparence était plus imposante que celle de ses compagnes
  rationale: « Plus imposante » exprime ici une grandeur ou une prééminence visible sans la réduire nécessairement à la taille physique; « compagnes » maintient la relation avec les autres cornes.
theological_decisions:
- issue: Faut-il rendre רַבְרְבָן par une formulation explicitement arrogante?
  choice: de grandes choses
  alternative: des propos arrogants; de grandes vantardises
  rationale: L’araméen dit littéralement « de grandes choses ». Le contexte autorise une nuance de vantardise, mais ne l’impose pas lexicalement dans cette proposition; cette interprétation est donc signalée en note plutôt qu’intégrée au texte.
- issue: La supériorité d’apparence désigne-t-elle uniquement une plus grande taille?
  choice: plus imposante
  alternative: plus grande
  rationale: רַב peut évoquer la grandeur, la prééminence ou l’aspect impressionnant. La traduction retenue préserve cette amplitude au lieu de limiter le sens aux dimensions physiques.
translation_notes:
  register: Français moderne, digne et accessible. La phrase reste un élément coordonné avec le contexte précédent, conformément à son ouverture par « et au sujet de ». Le tiret met en relief la reprise descriptive de la corne sans modifier la syntaxe de fond.
