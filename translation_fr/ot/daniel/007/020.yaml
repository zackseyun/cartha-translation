  terminology: « Cornes », « tête », « yeux », « bouche » et « grandes choses » respectent l’imagerie et la formulation du texte source. La note maintient à juste titre l’alternative interprétative de propos vantards sans l’imposer dans le texte principal. « Compagnes » convient aux autres cornes associées.
