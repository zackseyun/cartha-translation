  variant: modern international French
source:
  edition: WLC
  text: וִֽ/יקַבְּלוּן֙ מַלְכוּתָ֔/א קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/יַחְסְנ֤וּן מַלְכוּתָ/א֙ עַֽד עָ֣לְמָ֔/א וְ/עַ֖ד עָלַ֥ם עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/018.yaml
  text: But the holy ones of the Most High will receive the kingdom and possess the kingdom forever—forever and ever[a].
translation:
  language: fr
  text: Mais les saints du Très-Haut recevront le royaume et le posséderont pour toujours, oui, pour toujours et à jamais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les êtres saints du Très-Haut ». L’expression araméenne peut désigner le peuple saint de Dieu ; dans ce contexte, certains y voient aussi une référence à des êtres célestes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיקַבְּלוּן
  choice: recevront
  rationale: Le peal inaccompli de קבל signifie naturellement « recevoir » ou « accepter ». « Recevront » respecte la forme active sans suggérer une prise par la force ni expliciter un passif absent du texte.
- source_word: מַלְכוּתָא
  choice: le royaume
  rationale: Le nom peut désigner le royaume, la royauté ou la domination. « Le royaume » est naturel en français et conserve à la fois la dimension royale et le contraste avec les royaumes bestiaux du chapitre.
- source_word: קַדִּישֵׁי
  choice: les saints
  rationale: L’adjectif substantivé signifie littéralement « les saints » ou « les êtres saints ». En français biblique courant, « les saints » demeure une désignation collective compréhensible, tandis que la note préserve l’ambiguïté concernant leur identité.
- source_word: עֶלְיוֹנִין
  choice: du Très-Haut
  rationale: Dans ce contexte, l’expression fonctionne comme un titre divin. « Le Très-Haut » en restitue naturellement la valeur superlative en français.
- source_word: וְיַחְסְנוּן
  choice: et le posséderont
  rationale: Le verbe exprime ici la possession durable. « Posséderont » convient au parallélisme avec « recevront » et évite le sens plus interprétatif d’« hériteront ».
- source_word: עַד עָלְמָא
  choice: pour toujours
  rationale: Cette expression araméenne indique une durée sans fin. « Pour toujours » en donne un équivalent français idiomatique.
- source_word: וְעַד עָלַם עָלְמַיָּא
  choice: oui, pour toujours et à jamais
  rationale: La formule redoublée renforce solennellement l’idée de permanence. « Oui » marque l’intensification, et « pour toujours et à jamais » conserve l’escalade emphatique sans calque obscur.
theological_decisions:
- issue: Identité de קַדִּישֵׁי עֶלְיוֹנִין
  choice: La traduction « les saints du Très-Haut » ne précise pas s’il s’agit du peuple saint de Dieu, d’êtres célestes ou d’une expression associant ces réalités.
  alternative: « les êtres saints du Très-Haut » ou « le peuple saint du Très-Haut »
  rationale: Le contexte de Daniel 7 permet plusieurs compréhensions et le verset ne tranche pas explicitement. La traduction et la note conservent donc cette tension au lieu d’imposer une identification.
translation_notes:
  register: Français moderne, international et digne. La structure reste proche de l’araméen, tout en rendant idiomatiquement l’intensification finale. « Les saints » est employé au sens collectif biblique, avec une note destinée à éviter une lecture ecclésiastique ou ontologique trop étroite.
