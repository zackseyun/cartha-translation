base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/002.yaml
  text: Daniel answered and said[a], “I was seeing in my vision by night, and behold, the four winds of heaven were stirring up the great sea.”
translation:
  language: fr
  text: 'Daniel prit la parole et dit : « Dans ma vision, pendant la nuit, je regardais, et voici que les quatre vents du ciel[a] agitaient la grande mer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les quatre esprits du ciel ». Le mot araméen peut signifier « vents » ou « esprits ».
    reason: alternative_reading
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: prit la parole et dit
  rationale: Cette formule narrative araméenne introduit la déclaration de Daniel. « Prit la parole et dit » en conserve les deux éléments sans suggérer en français qu’il répond nécessairement à une question explicite.
- source_word: חָזֵה הֲוֵית
  choice: je regardais
  rationale: Le participe accompagné de l’auxiliaire exprime une action passée en cours. L’imparfait français rend naturellement cet aspect duratif.
- source_word: בְּחֶזְוִי עִם לֵילְיָא
  choice: Dans ma vision, pendant la nuit
  rationale: Le singulier suffixé désigne la vision de Daniel, tandis que l’expression temporelle situe celle-ci durant la nuit. Cette formulation est claire et naturelle en français moderne.
- source_word: וַאֲרוּ
  choice: et voici que
  rationale: Ce marqueur attire vivement l’attention sur la scène qui apparaît, tout en gardant le ton visionnaire du passage.
- source_word: אַרְבַּע רוּחֵי שְׁמַיָּא
  choice: les quatre vents du ciel
  rationale: Dans une scène où la mer est mise en mouvement, « vents » est le sens contextuel le plus immédiat. Le sens possible « esprits » est conservé en note.
- source_word: מְגִיחָן
  choice: soulevaient
  rationale: Le participe féminin pluriel décrit les vents en train d’agir avec force sur la mer. « Soulevaient » rend naturellement l’agitation produite, sans préciser indûment le mécanisme exact.
- source_word: לְיַמָּא רַבָּא
  choice: la Grande Mer
  rationale: La traduction littérale préserve la désignation solennelle et l’éventuelle résonance géographique ou symbolique de l’expression, sans trancher entre elles.
theological_decisions:
- issue: Le sens de רוּחֵי dans une vision apocalyptique
  choice: vents
  alternative: esprits
  rationale: L’action exercée sur la mer favorise « vents » dans le texte principal, mais le nom araméen peut aussi signifier « esprits ». La note maintient cette ambiguïté pertinente sans imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait restitue la durée de la perception; « et voici que » maintient la vivacité apocalyptique. La majuscule à « Grande Mer » préserve la possibilité d’une désignation consacrée sans exclure une lecture symbolique.
