  text: אֱדַ֗יִן צְבִית֙ לְ/יַצָּבָ֔א עַל חֵֽיוְתָ/א֙ רְבִיעָ֣יְתָ֔/א דִּֽי הֲוָ֥ת שָֽׁנְיָ֖ה מִן כל/הון דְּחִילָ֣ה יַתִּ֗ירָה שני/ה דִּֽי פַרְזֶל֙ וְ/טִפְרַ֣י/הּ דִּֽי נְחָ֔שׁ אָֽכְלָ֣ה מַדֲּקָ֔ה וּ/שְׁאָרָ֖/א בְּ/רַגְלַ֥י/הּ רָֽפְסָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/019.yaml
  text: Then I wanted to know for certain about the fourth beast[a], which was different from all of them, exceedingly terrifying, with teeth of iron and claws of bronze, which devoured, crushed[b], and trampled what was left with its feet.
translation:
  language: fr
  text: Alors, j’ai voulu savoir avec certitude ce qu’il en était de la quatrième bête[a], qui était différente de toutes les autres et extrêmement redoutable. Elle avait des dents de fer et des griffes[b] de bronze ; elle dévorait, broyait et piétinait le reste avec ses pattes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « connaître avec certitude ce qu’il en était de la quatrième bête ». L’expression araméenne indique le désir d’obtenir une connaissance certaine.'
    reason: lexical_alternative
  - marker: b
    text: Le terme peut aussi désigner des « ongles » ; « griffes » convient à l’image de la bête.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque la progression du récit et introduit naturellement la nouvelle démarche de Daniel.
- source_word: צְבִית לְיַצָּבָא
  choice: j’ai voulu avoir des certitudes
  rationale: Rend à la fois le désir exprimé par צְבִית et l’idée de certitude portée ici par לְיַצָּבָא, dans un français courant.
- source_word: עַל חֵיוְתָא רְבִיעָיְתָא
  choice: au sujet de la quatrième bête
  rationale: Traduction directe et naturelle du complément introduisant l’objet de la demande.
- source_word: דִּי הֲוָת שָׁנְיָה מִן כלהון
  choice: Elle était différente de toutes les autres
  rationale: Préserve le contraste entre cette bête et l’ensemble des précédentes.
- source_word: דְּחִילָה יַתִּירָה
  choice: extrêmement terrifiante
  rationale: Conserve la forte intensification de la peur inspirée par la bête.
- source_word: שני/ה דִּי פַרְזֶל
  choice: des dents de fer
  rationale: Rend directement la caractéristique physique de la bête.
- source_word: וְטִפְרַי/הּ דִּי נְחָשׁ
  choice: des griffes de bronze
  rationale: « Griffes » convient à l’image animale tout en laissant en note l’autre valeur possible, « ongles ».
- source_word: אָכְלָה מַדֲּקָה
  choice: elle dévorait et broyait
  rationale: Reproduit la succession de deux actes violents ; « broyait » exprime nettement la mise en pièces.
- source_word: וּשְׁאָרָא בְּרַגְלַי/הּ רָפְסָה
  choice: elle piétinait sous ses pattes ce qui restait
  rationale: « Ce qui restait » conserve le caractère concret du reliquat, et « pattes » convient mieux qu’« pieds » à une bête en français.
