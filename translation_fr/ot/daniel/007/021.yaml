  verdict: revise
  source_fidelity: 'Le sens de l’araméen est fidèlement rendu : vision en cours, corne en guerre contre les qaddishin et l’emportant sur eux. Les imparfaits français reproduisent bien le caractère duratif. « Faire la guerre à » est l’équivalent idiomatique nécessaire de l’expression avec עִם.'
  naturalness: « Je continuais à regarder » et « faisait la guerre à » sont naturels en français moderne. En revanche, « les êtres saints » est peu idiomatique dans ce contexte et risque de suggérer plus fortement des êtres célestes que ne le fait le terme araméen.
  terminology: « Les saints » est le rendu français établi et naturel de קַדִּישִׁין. Il ne résout pas indûment le référent; la note peut signaler la possibilité de comprendre « êtres saints » ou « peuple saint de Dieu ». La note initiale est à corriger, car elle présente deux formulations françaises comme si elles étaient toutes deux la formulation littérale de l’araméen.
  issues:
