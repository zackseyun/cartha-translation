source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית וְ/קַרְנָ֣/א דִכֵּ֔ן עָבְדָ֥ה קְרָ֖ב עִם קַדִּישִׁ֑ין וְ/יָכְלָ֖ה לְ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/021.yaml
  text: I kept watching[a], and that horn was making war with the holy ones and was prevailing over them,
translation:
  language: fr
  text: 'Je continuais à regarder : cette corne faisait la guerre aux saints[a] et l’emportait sur eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux êtres saints » ou « au peuple saint de Dieu ». L’araméen emploie littéralement l’expression « les saints ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Je continuais à regarder
  rationale: La construction formée du participe et du verbe « être » exprime une action passée en cours. Cette formulation restitue naturellement la durée de l’observation.
- source_word: וְקַרְנָא דִכֵּן
  choice: cette corne
  rationale: Le démonstratif renvoie à la corne déjà décrite. « Cette corne » constitue en français une reprise anaphorique naturelle et précise.
- source_word: עָבְדָה קְרָב
  choice: faisait la guerre
  rationale: L’expression araméenne associe littéralement « faire » et « guerre/combat ». L’imparfait rend l’action en cours dans la vision.
- source_word: עִם
  choice: aux
  rationale: 'La préposition signifie littéralement « avec », mais, après « faire la guerre », le français idiomatique demande « à » : « faire la guerre à quelqu’un ». Le rapport hostile reste explicite.'
- source_word: קַדִּישִׁין
  choice: les êtres saints
  rationale: L’adjectif substantivé signifie littéralement « les saints » ou « les êtres saints ». Cette formulation évite les associations ecclésiastiques possibles de « les saints » et ne tranche pas entre un référent humain et un référent plus largement céleste.
- source_word: וְיָכְלָה לְהוֹן
  choice: et l’emportait sur eux
  rationale: Le verbe peut signifier « être capable », « prévaloir » ou « vaincre ». L’imparfait « l’emportait » conserve l’aspect progressif de la scène sans présenter encore l’action comme un fait ponctuel achevé.
theological_decisions:
- issue: Référent de קַדִּישִׁין
  choice: les êtres saints
  alternative: les saints ; le peuple saint de Dieu
  rationale: Le terme peut désigner les membres du peuple consacré à Dieu ou, plus largement, des êtres saints. Une traduction littérale préserve cette ambiguïté dans la vision de Daniel au lieu d’imposer une interprétation ecclésiologique ou exclusivement humaine.
translation_notes:
  register: Français international moderne, clair et digne. Les imparfaits maintiennent le caractère continu de la scène visionnaire. « Êtres saints » préserve l’étendue possible du terme araméen, tandis que la note fournit les formulations traditionnelles et contextuelles.
