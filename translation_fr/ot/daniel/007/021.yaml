    issue: « êtres saints » est une formulation française peu naturelle et interprétativement marquée.
    rationale: Cette expression peut orienter le lecteur vers des êtres angéliques/célestes. « Les saints » rend plus idiomatiquement l’adjectif substantivé tout en laissant le référent ouvert grâce à la note.
  - severity: low
    issue: La note décrit de manière imprécise le littéral araméen.
    rationale: L’araméen emploie un seul terme substantivé, correspondant à « les saints » / « les êtres saints » selon le choix de français; il ne dit pas littéralement les deux expressions françaises comme des alternatives.
