  variant: modern international French
source:
  edition: WLC
  text: וְ/לֵ֨/הּ יְהִ֤יב שָׁלְטָן֙ וִ/יקָ֣ר וּ/מַלְכ֔וּ וְ/כֹ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ֛/א וְ/לִשָּׁנַיָּ֖/א לֵ֣/הּ יִפְלְח֑וּן שָׁלְטָנֵ֞/הּ שָׁלְטָ֤ן עָלַם֙ דִּֽי לָ֣א יֶעְדֵּ֔ה וּ/מַלְכוּתֵ֖/הּ דִּי לָ֥א תִתְחַבַּֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/014.yaml
  text: And to him was given dominion and glory and a kingdom[a], that all peoples, nations, and languages should serve him. His dominion is an everlasting dominion, which will not pass away, and his kingdom is one that will not be destroyed.
translation:
  language: fr
  text: On lui donna la domination, la gloire et un royaume, afin que tous les peuples, toutes les nations et toutes les langues le servent[a]. Sa domination est une domination éternelle, qui ne passera pas, et son royaume ne sera pas détruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adorent » ou « lui rendent hommage ». Le verbe araméen peut désigner le service, notamment le service religieux ; la nuance peut donc aller au-delà de la seule soumission politique.
    reason: alternative lexicale préservant une ambiguïté théologique réelle
lexical_decisions:
- source_word: יְהִיב
  choice: on lui donna
  rationale: La forme araméenne exprime ici un don reçu. La tournure française garde le donateur indéterminé, comme le texte source, tout en restant naturelle.
- source_word: שָׁלְטָן
  choice: domination
  rationale: Le mot désigne le pouvoir souverain d’exercer l’autorité. « Domination » convient au contexte royal et permet de conserver la répétition dans la seconde moitié du verset.
- source_word: וִיקָר
  choice: gloire
  rationale: Le terme évoque l’honneur et la splendeur conférés au personnage. « Gloire » préserve le registre élevé et la portée théologique sans exclure la nuance d’honneur royal.
- source_word: מַלְכוּ
  choice: un royaume
  rationale: Le nom peut désigner la royauté, le règne ou le royaume. Ici, « royaume » s’accorde naturellement avec le pouvoir accordé et avec sa destruction niée à la fin du verset.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: tous les peuples, toutes les nations et toutes les langues
  rationale: Cette formulation conserve les trois catégories et leur portée universelle. La répétition de « toutes » est idiomatique en français et rend explicite la portée de כֹל sur l’ensemble de l’énumération.
- source_word: יִפְלְחוּן
  choice: le servent
  rationale: Le verbe peut désigner le service, y compris le service religieux. « Servent » maintient volontairement ouverte la question de savoir s’il s’agit d’allégeance politique, de culte ou des deux.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: Sa domination est une domination éternelle
  rationale: La répétition du nom est conservée pour respecter l’insistance du texte. « Éternelle » exprime clairement la permanence opposée aux royaumes passagers du chapitre.
- source_word: יֶעְדֵּה
  choice: ne passera pas
  rationale: Le verbe peut signifier disparaître, passer ou être ôté. « Ne passera pas » rend naturellement l’idée de permanence sans préciser indûment le mode d’une éventuelle disparition.
- source_word: תִתְחַבַּל
  choice: ne sera pas détruit
  rationale: Dans le contexte des royaumes, le verbe exprime la destruction ou la ruine. Cette traduction est claire et correspond au contraste avec les puissances terrestres.
theological_decisions:
- issue: Sens de יִפְלְחוּן à propos du personnage semblable à un fils d’homme
  choice: le servent
  alternative: l’adorent ; lui rendent hommage
  rationale: Dans Daniel, ce verbe peut avoir une portée religieuse, mais « adorer » trancherait plus nettement que ne l’exige à lui seul le terme araméen. « Servir » préserve la tension entre service royal, soumission et service cultuel.
- issue: Agent du don de la domination, de la gloire et du royaume
  choice: on lui donna
  alternative: il lui fut donné
  rationale: Le texte ne nomme pas explicitement le donateur dans ce verset. La tournure indéfinie conserve cette discrétion tout en laissant le contexte de la vision identifier l’origine du don.
translation_notes:
  register: Français international moderne, clair et soutenu. La syntaxe garde le parallélisme solennel du texte araméen sans archaïsmes. La répétition de « domination » est intentionnelle, tandis que « toutes » devant chaque élément renforce naturellement en français la portée universelle de l’énumération.
