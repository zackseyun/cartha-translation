source:
  edition: WLC
  text: מִשְׂתַּכַּ֨ל הֲוֵ֜ית בְּ/קַרְנַיָּ֗/א וַ֠/אֲלוּ קֶ֣רֶן אָחֳרִ֤י זְעֵירָה֙ סִלְקָ֣ת ביני/הון וּ/תְלָ֗ת מִן קַרְנַיָּ/א֙ קַדְמָ֣יָתָ֔/א אתעקרו מִן קדמי/ה וַ/אֲל֨וּ עַיְנִ֜ין כְּ/עַיְנֵ֤י אֲנָשָׁ/א֙ בְּ/קַרְנָ/א דָ֔א וּ/פֻ֖ם מְמַלִּ֥ל רַבְרְבָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/008.yaml
  text: I was considering the horns[a], and behold, another horn, a little one, came up among them, and three of the first horns were uprooted before it. And behold, in this horn were eyes like the eyes of a man[b], and a mouth speaking great things.
translation:
  language: fr
  text: J’observais attentivement les cornes, et voici qu’une autre corne, une petite, surgit parmi elles. Trois des premières cornes furent arrachées devant elle. Et voici que, dans cette corne, il y avait des yeux comme ceux d’un homme[a], ainsi qu’une bouche qui proférait de grandes choses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des yeux semblables à des yeux humains ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des paroles arrogantes » ou « de grandes vantardises ».
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׂתַּכַּל הֲוֵית
  choice: Je considérais attentivement
  rationale: Le participe accompagné de l’auxiliaire exprime une action passée en cours. « Considérais attentivement » rend à la fois l’observation prolongée et l’attention réfléchie de Daniel.
- source_word: בְּקַרְנַיָּא
  choice: les cornes
  rationale: Le pluriel déterminé araméen renvoie aux cornes déjà présentes dans la vision.
- source_word: וַאֲלוּ
  choice: et voici que
  rationale: Cette formule marque une transition vive dans la vision tout en conservant un registre apocalyptique digne et naturel en français.
- source_word: קֶרֶן אָחֳרִי זְעֵירָה
  choice: une autre corne, une petite
  rationale: La tournure en apposition suit l’ordre araméen et conserve distinctement les idées d’une autre corne et de sa petite taille.
- source_word: סִלְקָת
  choice: monta
  rationale: Le verbe décrit la montée ou l’apparition de la corne dans la scène visionnaire; « monta » maintient directement cette image.
- source_word: ביניהון
  choice: au milieu d’elles
  rationale: La formule situe la nouvelle corne parmi les autres; « au milieu d’elles » est clair et idiomatique avec l’antécédent féminin pluriel « cornes ».
- source_word: וּתְלָת מִן קַרְנַיָּא קַדְמָיָתָא
  choice: Trois des premières cornes
  rationale: « Premières » indique les cornes antérieures dans l’ordre de la vision sans leur attribuer une identité supplémentaire.
- source_word: אתעקרו
  choice: furent arrachées
  rationale: Le passif conserve l’image forte du déracinement, naturellement exprimée en français par « arracher ».
- source_word: מִן קֳדָמֵיהּ
  choice: devant elle
  rationale: La formulation garde le sens spatial ou relationnel assez large de l’araméen sans préciser indûment l’agent de l’arrachement.
- source_word: עַיְנִין כְּעַיְנֵי אֲנָשָׁא
  choice: des yeux comme ceux d’un homme
  rationale: Cette traduction conserve la comparaison explicite et le singulier de אֲנָשָׁא. Une formulation française plus générale est signalée en note.
- source_word: בְּקַרְנָא דָא
  choice: cette corne avait
  rationale: Bien que l’araméen dise littéralement « dans cette corne », « cette corne avait » exprime naturellement la présence de ces traits sans modifier l’image.
- source_word: וּפֻם מְמַלִּל רַבְרְבָן
  choice: une bouche qui proférait de grandes choses
  rationale: « Grandes choses » conserve le sens formel de רַבְרְבָן et son ambiguïté, tandis que « proférait » convient à une bouche personnifiée et au registre de la vision.
theological_decisions:
- issue: Faut-il interpréter רַבְרְבָן comme désignant explicitement des paroles arrogantes ?
  choice: de grandes choses
  alternative: des paroles arrogantes ; de grandes vantardises
  rationale: L’expression araméenne signifie formellement « de grandes choses », même si le contexte peut évoquer l’arrogance ou la vantardise. Le texte principal préserve cette tension, et la note présente l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la vivacité répétée de « voici » et le caractère étrange de la vision, tout en évitant des tournures inutilement archaïques.
