  to: La première ressemblait à un lion et avait des ailes d’aigle. Je continuai à regarder jusqu’à ce que ses ailes soient arrachées[a]. Elle fut soulevée de terre et mise debout sur ses pieds comme un être humain[b], et un cœur humain lui fut donné[c].
  rationale: La révision est limitée à une expression plus exacte du passif causatif (« mise debout ») et à la clarification de la note lexicale sur l’arrachement des ailes. Elle conserve l’ambiguïté relative à « cœur humain / cœur d’homme », ainsi que l’absence d’identification interprétative des symboles.
