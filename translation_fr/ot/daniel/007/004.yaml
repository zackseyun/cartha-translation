  terminology: « Être humain » et « cœur humain » préservent le contraste anthropologique sans imposer une lecture sexuelle ou doctrinale. « Ailes d’aigle » est naturel. La note a actuelle ne formule pas une véritable variante française claire ; elle est remplacée par une alternative lexicale directe.
