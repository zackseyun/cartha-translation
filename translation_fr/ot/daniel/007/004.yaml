source:
  edition: WLC
  text: קַדְמָיְתָ֣/א כְ/אַרְיֵ֔ה וְ/גַפִּ֥ין דִּֽי נְשַׁ֖ר לַ֑/הּ חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּי מְּרִ֨יטוּ גַפַּ֜י/הּ וּ/נְטִ֣ילַת מִן אַרְעָ֗/א וְ/עַל רַגְלַ֨יִן֙ כֶּ/אֱנָ֣שׁ הֳקִימַ֔ת וּ/לְבַ֥ב אֱנָ֖שׁ יְהִ֥יב לַֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/004.yaml
  text: The first was like a lion[a], and it had the wings of an eagle. I kept watching until its wings were plucked off, and it was lifted up from the earth and made to stand on two feet like a man[c][b], and a human heart was given to it.
translation:
  language: fr
  text: La première ressemblait à un lion et avait des ailes d’aigle. Je continuai à regarder jusqu’à ce que ses ailes soient arrachées[a]. Elle fut soulevée de terre et mise debout sur ses pieds comme un être humain[b], et un cœur humain lui fut donné[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plumées » ou « dépouillées ».
    reason: Le verbe araméen désigne l’action d’arracher ou d’enlever en tirant ; ces formulations rendent des nuances lexicales possibles.
  - marker: b
    text: 'Littéralement : « mise debout sur des pieds comme un être humain ».'
    reason: Le texte mentionne les pieds, sans expliciter le nombre deux.
  - marker: c
    text: Ou « un cœur d’homme lui fut donné ».
    reason: La construction araméenne peut être rendue par un adjectif relationnel (« humain ») ou par un complément du nom.
lexical_decisions:
- source_word: קַדְמָיְתָא
  choice: La première
  rationale: Ordinal féminin singulier renvoyant naturellement à la première bête de la série.
- source_word: כְאַרְיֵה
  choice: ressemblait à un lion
  rationale: Le préfixe כ marque une comparaison et non une identité; cette formulation est naturelle en français moderne.
- source_word: וְגַפִּין דִּי נְשַׁר לַהּ
  choice: et avait des ailes d’aigle
  rationale: La tournure araméenne exprime la possession; « avait » la rend idiomatiquement tout en conservant l’image.
- source_word: חָזֵה הֲוֵית
  choice: Je continuai à regarder
  rationale: Le participe accompagné de l’auxiliaire exprime une action passée prolongée.
- source_word: מְּרִיטוּ גַפַּיהּ
  choice: ses ailes soient arrachées
  rationale: Le verbe désigne l’action d’arracher ou d’enlever en tirant; « arrachées » conserve la vigueur de l’image.
- source_word: וּנְטִילַת מִן אַרְעָא
  choice: Elle fut soulevée de terre
  rationale: Le passif décrit le déplacement de la bête loin du sol sans préciser l’agent.
- source_word: וְעַל רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת
  choice: et dressée sur ses pieds comme un être humain
  rationale: Le causatif indique qu’elle est mise debout; « sur ses pieds » reste proche du texte sans ajouter explicitement « deux ».
- source_word: וּלְבַב אֱנָשׁ יְהִיב לַהּ
  choice: et un cœur humain lui fut donné
  rationale: Cette expression naturelle préserve le contraste entre la bête et les caractéristiques humaines, sans réduire « cœur » au seul intellect.
theological_decisions:
- issue: Portée anthropologique de אֱנָשׁ dans la comparaison et dans l’expression du cœur
  choice: « comme un être humain » et « un cœur humain »
  alternative: « comme un homme » et « un cœur d’homme »
  rationale: Dans les deux occurrences, le contraste porte d’abord sur l’humain par opposition à l’animal. Le français inclusif quant au sens évite d’introduire inutilement le sexe masculin tout en préservant l’image anthropologique.
- issue: Sens de « cœur » dans לְבַב אֱנָשׁ
  choice: Conserver « cœur » sans explicitation interprétative
  alternative: « intelligence humaine » ou « esprit humain »
  rationale: Le terme peut englober la disposition intérieure, la pensée et la volonté. Le traduire simplement par « cœur » maintient cette amplitude et la tension du texte.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Le féminin des pronoms reprend « la première », c’est-à-dire la première bête. Les formulations évitent d’identifier les symboles ou leur agent implicite.
