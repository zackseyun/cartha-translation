  variant: modern international French
source:
  edition: WLC
  text: חָזֵ֤ה הֲוֵית֙ בְּ/חֶזְוֵ֣י לֵֽילְיָ֔/א וַ/אֲרוּ֙ עִם עֲנָנֵ֣י שְׁמַיָּ֔/א כְּ/בַ֥ר אֱנָ֖שׁ אָתֵ֣ה הֲוָ֑ה וְ/עַד עַתִּ֤יק יֽוֹמַיָּ/א֙ מְטָ֔ה וּ/קְדָמ֖וֹ/הִי הַקְרְבֽוּ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/013.yaml
  text: I kept looking in the visions of the night[a], and behold, with the clouds of heaven one like a son of man was coming, and he came to the Ancient of Days[b], and they brought him near before him.
translation:
  language: fr
  text: 'Je continuais à regarder dans les visions de la nuit : voici qu’avec les nuées du ciel[a] venait quelqu’un qui ressemblait à un fils d’homme[b]. Il parvint jusqu’à l’Ancien des jours, et ils le firent approcher devant lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « sur les nuées du ciel ». La préposition araméenne signifie ici « avec » et peut exprimer l’accompagnement plutôt qu’un déplacement explicitement effectué sur les nuées.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « quelqu’un qui ressemblait à un être humain ». Littéralement : « comme un fils d’homme » ; l’expression peut désigner une figure humaine et acquiert par la suite une grande importance comme titre messianique dans l’interprétation biblique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Je continuais à regarder
  rationale: La construction formée du participe et de הוה exprime une action passée en cours ou répétée. Cette formulation française en restitue la durée sans la raideur de « j’étais voyant ».
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: dans les visions de la nuit
  rationale: Cette traduction conserve le pluriel « visions » ainsi que le rapport entre celles-ci et la nuit, tout en restant naturelle en français.
- source_word: וַאֲרוּ
  choice: voici que
  rationale: Ce marqueur attire vivement l’attention sur une nouvelle scène de la vision. « Voici que » conserve cette force dans un registre narratif digne et actuel.
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  choice: avec les nuées du ciel
  rationale: La préposition עִם signifie « avec ». « Nuées » convient au registre visionnaire et « du ciel » rend le complément araméen sans préciser que le personnage se trouverait sur les nuées.
- source_word: כְּבַר אֱנָשׁ
  choice: quelqu’un qui ressemblait à un fils d’homme
  rationale: Cette formulation préserve la comparaison introduite par כְּ et l’expression littérale « fils d’homme », tout en donnant une syntaxe française claire. Elle ne tranche pas au-delà du texte l’identité du personnage.
- source_word: אָתֵה הֲוָה
  choice: venait
  rationale: L’imparfait rend l’approche en cours exprimée par la construction participiale, avant l’arrivée achevée de la proposition suivante.
- source_word: עַתִּיק יוֹמַיָּא
  choice: l’Ancien des jours
  rationale: Cette traduction formelle garde le caractère de titre et l’image temporelle de l’expression araméenne, sans la réduire au simple terme « vieillard ».
- source_word: מְטָה
  choice: Il parvint jusqu’à
  rationale: Le verbe marque l’aboutissement de l’approche. « Parvint jusqu’à » distingue clairement cette arrivée du mouvement en cours rendu auparavant par « venait ».
- source_word: הַקְרְבוּהִי
  choice: ils le firent approcher
  rationale: Le causatif et le sujet pluriel non exprimé sont tous deux conservés. Cette solution évite de transformer sans nécessité la phrase en passif.
theological_decisions:
- issue: Sens de כְּבַר אֱנָשׁ dans une vision à forte portée messianique
  choice: quelqu’un qui ressemblait à un fils d’homme
  alternative: quelqu’un qui ressemblait à un être humain
  rationale: Le texte présente une comparaison et non une identification formulée sans réserve. Le maintien de « fils d’homme » respecte la forme araméenne et son importance dans la réception biblique, sans importer dans le verset une conclusion christologique ultérieure.
- issue: Rapport du personnage aux nuées dans עִם עֲנָנֵי שְׁמַיָּא
  choice: avec les nuées du ciel
  alternative: sur les nuées du ciel
  rationale: La préposition du texte est « avec ». La traduction conserve donc l’accompagnement ou l’association possible, tandis que la lecture traditionnelle « sur » est signalée en note sans être imposée au texte.
- issue: Identification de עַתִּיק יוֹמַיָּא
  choice: l’Ancien des jours
  alternative: le Vieillard
  rationale: La forme retenue traduit les deux éléments du titre araméen et préserve son imagerie théologique sans expliciter davantage l’identité du personnage.
translation_notes:
  register: Français international moderne, clair et digne, avec un léger relief visionnaire dans « voici », « nuées » et « l’Ancien des jours ». L’ordre des verbes distingue l’approche en cours (« venait »), son aboutissement (« parvint ») et la présentation du personnage (« ils le firent approcher »).
