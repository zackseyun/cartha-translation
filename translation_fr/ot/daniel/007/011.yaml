language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית בֵּ/אדַ֗יִן מִן קָל֙ מִלַּיָּ֣/א רַבְרְבָתָ֔/א דִּ֥י קַרְנָ֖/א מְמַלֱּלָ֑ה חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּ֨י קְטִילַ֤ת חֵֽיוְתָ/א֙ וְ/הוּבַ֣ד גִּשְׁמַ֔/הּ וִ/יהִיבַ֖ת לִ/יקֵדַ֥ת אֶשָּֽׁא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/011.yaml
  text: I kept watching then because of the sound of the great words that the horn was speaking. I kept watching until the beast was killed[a], and its body was destroyed and given over to the burning fire.
translation:
  language: fr
  text: Je regardais alors, au son des grandes paroles que prononçait la corne. Je regardais jusqu’à ce que la bête soit tuée, que son corps soit détruit et livré au feu ardent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « grandes paroles » ; ou « paroles arrogantes », « paroles vantardes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Je continuais à regarder
  rationale: Le participe accompagné de l’auxiliaire exprime une action passée qui se prolonge; cette formulation française en restitue naturellement la valeur durative.
- source_word: בֵּאדַיִן
  choice: alors
  rationale: Cet adverbe temporel marque la progression de la vision.
- source_word: מִן קָל
  choice: à cause du bruit
  rationale: מִן indique ici la cause ou l’occasion de l’observation prolongée; קָל désigne ce qui est entendu, ici le bruit produit par les paroles.
- source_word: מִלַּיָּא רַבְרְבָתָא
  choice: des grandes paroles
  rationale: La traduction conserve l’expression littérale et son ambiguïté, sans expliciter dans le texte principal sa connotation probable de vantardise ou d’arrogance.
- source_word: קַרְנָא
  choice: la corne
  rationale: L’image symbolique de la vision est conservée sans identification interprétative.
- source_word: מְמַלֱּלָה
  choice: prononçait
  rationale: L’imparfait rend l’action en cours exprimée par le participe araméen et convient idiomatiquement à des paroles.
- source_word: עַד דִּי
  choice: jusqu’à ce que
  rationale: Cette locution marque le terme de l’observation de Daniel.
- source_word: קְטִילַת חֵיוְתָא
  choice: la bête soit tuée
  rationale: Le passif est préservé dans une formulation française moderne et directe.
- source_word: וְהוּבַד גִּשְׁמַהּ
  choice: que son corps soit détruit
  rationale: La coordination avec «jusqu’à ce que» appelle ici le subjonctif; «corps» conserve le sens concret de גִּשְׁמַהּ.
- source_word: וִיהִיבַת לִיקֵדַת אֶשָּׁא
  choice: livré au feu ardent
  rationale: «Livré» rend le passif de נתן, tandis que «au feu ardent» exprime naturellement l’idée de combustion par le feu sans abstraire l’image.
theological_decisions:
- issue: Faut-il expliciter les «grandes paroles» comme des propos arrogants ou blasphématoires?
  choice: Conserver «grandes paroles» dans le texte principal.
  alternative: «paroles arrogantes», «paroles pleines de vantardise» ou «paroles blasphématoires»
  rationale: Le contexte suggère nettement l’arrogance, mais l’expression araméenne dit littéralement «grandes paroles». La traduction préserve donc la tension lexicale et signale la nuance en note.
- issue: Faut-il interpréter la bête et son corps comme un royaume ou comme son jugement?
  choice: Maintenir les images de «la bête», de «son corps» et du «feu».
  alternative: Rendre directement l’image par «le royaume fut détruit» ou «il fut entièrement jugé».
  rationale: Le verset rapporte une vision symbolique; identifier ou paraphraser ses symboles introduirait une interprétation absente de la formulation immédiate.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de «Je continuais à regarder» est maintenue pour reproduire la structure visionnaire et l’insistance du texte. «Bruit» évite de personnifier excessivement קָל, tandis que «prononçait» reste naturel avec «paroles».
