source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת חֲדָ֗ה לְ/בֵלְאשַׁצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל דָּנִיֵּאל֙ חֵ֣לֶם חֲזָ֔ה וְ/חֶזְוֵ֥י רֵאשֵׁ֖/הּ עַֽל מִשְׁכְּבֵ֑/הּ בֵּ/אדַ֨יִן֙ חֶלְמָ֣/א כְתַ֔ב רֵ֥אשׁ מִלִּ֖ין אֲמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/001.yaml
  text: In the first year of Belshazzar king of Babylon[a], Daniel saw a dream and visions in his head while on his bed. Then he wrote down the dream—the summary of the words he told.
translation:
  language: fr
  text: La première année de Belshatsar, roi de Babylone, Daniel fit un rêve et eut des visions dans son esprit alors qu’il était sur son lit. Ensuite, il mit le rêve par écrit et en exposa l’essentiel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il écrivit le rêve et dit la tête des paroles ». Cette expression araméenne désigne probablement les points principaux, c’est-à-dire l’essentiel du récit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה
  choice: La première année
  rationale: Cette formule araméenne de datation emploie le cardinal avec une valeur ordinale; « la première année » est l’expression française naturelle.
- source_word: לְבֵלְאשַׁצַּר מֶלֶךְ בָּבֶל
  choice: de Belshatsar, roi de Babylone
  rationale: La préposition rattache l’année au règne de Belshatsar, et la chaîne construite précise sa fonction royale.
- source_word: חֵלֶם חֲזָה
  choice: Daniel fit un rêve
  rationale: Littéralement, Daniel « vit un rêve ». En français courant, « faire un rêve » exprime naturellement l’expérience onirique sans employer le calque peu idiomatique « voir un rêve ».
- source_word: וְחֶזְוֵי רֵאשֵׁהּ
  choice: et eut des visions dans son esprit
  rationale: Littéralement « des visions de sa tête »; « dans son esprit » rend en français moderne le siège intérieur de ces visions sans suggérer qu’elles étaient visibles extérieurement.
- source_word: עַל מִשְׁכְּבֵהּ
  choice: alors qu’il était sur son lit
  rationale: La locution situe l’expérience sur son lieu de repos; cette formulation reste proche de l’araméen tout en étant naturelle.
- source_word: בֵּאדַיִן
  choice: Ensuite
  rationale: Ce séquenceur narratif araméen introduit l’action qui suit le rêve.
- source_word: חֶלְמָא כְתַב
  choice: il mit le rêve par écrit
  rationale: Cette expression française rend clairement l’acte de consigner le rêve, exprimé littéralement par « il écrivit le rêve ».
- source_word: רֵאשׁ מִלִּין אֲמַר
  choice: et en exposa l’essentiel
  rationale: L’expression, littéralement « il dit la tête des paroles », désigne vraisemblablement les points principaux ou la substance du récit. La note conserve la forme littérale et signale l’ambiguïté de l’idiome.
