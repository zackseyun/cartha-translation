  text: עַ֣ד דִּֽי אֲתָ֗ה עַתִּיק֙ יֽוֹמַיָּ֔/א וְ/דִינָ֣/א יְהִ֔ב לְ/קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/זִמְנָ֣/א מְטָ֔ה וּ/מַלְכוּתָ֖/א הֶחֱסִ֥נוּ קַדִּישִֽׁין־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/022.yaml
  text: until the Ancient of Days came[a], and judgment was given to the saints of the Most High, and the time arrived[c][b], and the saints took possession of the kingdom.
translation:
  language: fr
  text: jusqu’à ce que l’Ancien des jours vienne, que le jugement soit rendu en faveur des saints du Très-Haut, que le temps arrive et que les saints prennent possession du royaume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד דִּי
  choice: jusqu’à ce que
  rationale: Cette locution introduit la limite temporelle de l’oppression décrite auparavant; « jusqu’à ce que » est naturel en français et convient au verbe au subjonctif.
- source_word: אֲתָה
  choice: vienne
  rationale: Le verbe exprime la venue ou l’arrivée. Après « jusqu’à ce que », le subjonctif « vienne » est requis en français.
- source_word: עַתִּיק יוֹמַיָּא
  choice: l’Ancien des jours
  rationale: Cette formulation conserve l’image et le titre divin de l’araméen, tout en correspondant à l’usage biblique français établi.
- source_word: וְדִינָא יְהִב
  choice: et que le jugement soit rendu
  rationale: דִּין possède un sens judiciaire, et l’expression passive « soit rendu » est plus idiomatique en français que « soit donné », sans effacer la forme réceptive de l’araméen.
- source_word: לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: en faveur des saints du Très-Haut
  rationale: Dans le contexte judiciaire, la préposition לְ peut indiquer que la décision est rendue en leur faveur. « Saints » désigne ici ceux qui appartiennent à Dieu, tandis que « Très-Haut » conserve le titre divin.
- source_word: וְזִמְנָא מְטָה
  choice: Puis le temps arriva où
  rationale: L’expression marque l’arrivée du moment décisif. L’ajout syntaxique de « où » relie naturellement en français ce moment à la prise de possession qui suit, sans ajouter l’idée non explicite de temps « fixé ».
- source_word: וּמַלְכוּתָא
  choice: du royaume
  rationale: Dans Daniel 7, le nom peut désigner le royaume ou la souveraineté royale; « royaume » est ici clair et cohérent avec le contexte.
- source_word: הֶחֱסִנוּ
  choice: prirent possession de
  rationale: Le verbe exprime l’entrée en possession ou la possession effective. « Prirent possession de » rend clairement cette transition.
- source_word: קַדִּישִׁין
  choice: les saints
  rationale: Ce choix maintient la cohérence avec la première occurrence et demeure assez large pour ne pas préciser au-delà du texte l’identité de ces êtres ou de ce peuple consacré.
theological_decisions:
- issue: Sens de וְדִינָא יְהִב לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: le jugement soit rendu en faveur des saints du Très-Haut
  alternative: le jugement soit remis aux saints du Très-Haut
  rationale: Le contexte favorise l’idée d’une décision judiciaire prononcée en faveur des saints après leur oppression. Toutefois, la préposition araméenne peut aussi faire des saints les destinataires du jugement ou de l’autorité judiciaire; cette ambiguïté est conservée en note.
- issue: Référent de קַדִּישִׁין
  choice: les saints
  alternative: les êtres saints
  rationale: Le terme est laissé dans sa portée générale afin de ne pas imposer une identification confessionnelle ou eschatologique plus précise que celle du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement visionnaire du passage tout en employant une syntaxe française naturelle. « L’Ancien des jours » et « le Très-Haut » gardent les titres traditionnels et transparents; « saints » est maintenu sans définition doctrinale ajoutée.
