review_pass:
  verdict: revise
  source_fidelity: La traduction rend justement les principaux termes araméens, notamment « l’Ancien des jours », « le jugement », « les saints du Très-Haut » et « prendre possession du royaume ». Toutefois, « Puis » transforme la série de propositions introduites par עַד דִּי (« jusqu’à ce que ») en une succession narrative indépendante. Le texte araméen maintient les trois événements dans la limite temporelle introduite par « jusqu’à ce que ».
  naturalness: Le français proposé est globalement naturel et d’un registre biblique moderne. Une phrase unique avec des subjonctifs coordonnés est à la fois plus fidèle à la syntaxe source et idiomatique en français soutenu accessible.
  terminology: « L’Ancien des jours », « le Très-Haut », « saints » et « royaume » sont appropriés, cohérents et ne surinterprètent pas le passage. « Rendu en faveur de » exprime bien la lecture contextuellement probable de la préposition, tandis que la note conserve l’autre possibilité sans la trancher.
  issues:
  - severity: medium
    issue: « Puis le temps arriva » rompt la dépendance de la dernière partie du verset à « jusqu’à ce que ».
    rationale: Après עַד דִּי, l’araméen enchaîne la venue de l’Ancien des jours, le jugement, l’arrivée du temps et la possession du royaume. « Puis » présente les deux derniers éléments comme une étape ultérieure indépendante plutôt que comme l’aboutissement qui borne la période précédente.
  - severity: low
    issue: La note traduit l’alternative par « le jugement soit remis aux saints ».
    rationale: « Remis » peut évoquer la transmission d’un document ou d’un objet. « Donné aux saints » est plus proche de l’expression araméenne et conserve plus clairement l’ambiguïté entre une décision en leur faveur et un jugement qui leur est accordé.
  revised_text: jusqu’à ce que l’Ancien des jours vienne, que le jugement soit rendu en faveur des saints du Très-Haut, que le temps arrive et que les saints prennent possession du royaume.
  revised_footnotes:
  - marker: a
    text: Ou « que le jugement soit donné aux saints du Très-Haut ». La préposition araméenne peut signifier que le jugement est rendu en leur faveur ou qu’il leur est donné.
    reason: alternative_reading
  revision_rationale: La révision rétablit la portée de « jusqu’à ce que » sur l’ensemble de la série araméenne, sans introduire une séquence temporelle distincte par « Puis ». Elle conserve la lecture contextuelle « en faveur des saints » et garde en note la possibilité grammaticale que le jugement leur soit donné.
