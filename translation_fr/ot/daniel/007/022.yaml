revisions:
- from: jusqu’à ce que l’Ancien des jours vienne et que le jugement soit rendu en faveur des saints du Très-Haut[a]. Puis le temps arriva où les saints prirent possession du royaume.
  to: jusqu’à ce que l’Ancien des jours vienne, que le jugement soit rendu en faveur des saints du Très-Haut, que le temps arrive et que les saints prennent possession du royaume.
  rationale: La révision rétablit la portée de « jusqu’à ce que » sur l’ensemble de la série araméenne, sans introduire une séquence temporelle distincte par « Puis ». Elle conserve la lecture contextuelle « en faveur des saints » et garde en note la possibilité grammaticale que le jugement leur soit donné.
