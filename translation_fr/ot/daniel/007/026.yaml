source:
  edition: WLC
  text: וְ/דִינָ֖/א יִתִּ֑ב וְ/שָׁלְטָנֵ֣/הּ יְהַעְדּ֔וֹן לְ/הַשְׁמָדָ֥ה וּ/לְ/הוֹבָדָ֖ה עַד סוֹפָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/026.yaml
  text: But the court will sit[a], and his dominion will be taken away[c][b], to be destroyed and annihilated to the end.
translation:
  language: fr
  text: Mais le tribunal siégera[a], et sa domination lui sera retirée[b], pour être détruite et anéantie jusqu’à la fin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jugement se tiendra »; l’araméen peut mettre l’accent soit sur le tribunal qui entre en séance, soit sur la séance judiciaire elle-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « son pouvoir lui sera retiré » ou « son autorité lui sera retirée ».
    reason: lexical_alternative
  - marker: c
    text: La formule peut aussi exprimer l’idée d’une destruction complète; elle souligne le caractère définitif du jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִינָא
  choice: le tribunal
  rationale: En araméen biblique, le terme peut désigner le jugement, la séance judiciaire ou l’instance qui juge. Avec « siégera », « le tribunal » rend naturellement la scène de cour céleste sans exclure l’idée de jugement.
- source_word: יִתִּב
  choice: siégera
  rationale: Le verbe signifie littéralement « s’asseoir ». Dans un cadre judiciaire, « siéger » conserve l’image tout en exprimant naturellement l’entrée en session du tribunal.
- source_word: שָׁלְטָנֵהּ
  choice: sa domination
  rationale: Le nom désigne le pouvoir souverain, l’autorité exercée ou la domination. « Domination » convient au contexte royal et apocalyptique de Daniel 7.
- source_word: יְהַעְדּוֹן
  choice: lui sera retirée
  rationale: Le verbe pluriel a ici une valeur indéfinie ou impersonnelle. Le passif français évite d’introduire un sujet absent du texte; le pronom « lui » indique clairement que c’est sa domination qui est ôtée.
- source_word: לְהַשְׁמָדָה
  choice: pour être détruite
  rationale: La forme infinitive exprime le but ou le résultat du retrait. Le féminin renvoie à « domination ».
- source_word: וּלְהוֹבָדָה
  choice: et anéantie
  rationale: Le second infinitif renforce le premier et souligne la disparition totale. L’ellipse de « être » est naturelle en français et préserve le parallélisme.
- source_word: עַד סוֹפָא
  choice: jusqu’à la fin
  rationale: Cette traduction littérale conserve la portée temporelle et l’idée de caractère définitif, sans réduire la formule au seul adverbe « complètement ».
theological_decisions:
- issue: Référent de « sa domination »
  choice: Conserver le pronom singulier, qui renvoie immédiatement au dirigeant arrogant ou à la petite corne du contexte précédent, sans l’identifier davantage.
  alternative: Comprendre plus largement la domination de la quatrième bête ou de son royaume dans son ensemble.
  rationale: Le contexte immédiat met l’accent sur le jugement de la corne, mais celle-ci reste liée au royaume représenté par la bête. La traduction maintient l’ambiguïté relative du référent au lieu d’imposer une identification doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Tribunal siégera » maintient l’imagerie judiciaire; « domination » préserve le vocabulaire royal et apocalyptique. La syntaxe reste proche de l’araméen tout en étant naturelle en français.
