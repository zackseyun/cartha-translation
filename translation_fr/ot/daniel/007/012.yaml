id: DAN.7.12
reference: Daniel 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁאָר֙ חֵֽיוָתָ֔/א הֶעְדִּ֖יו שָׁלְטָנְ/ה֑וֹן וְ/אַרְכָ֧ה בְ/חַיִּ֛ין יְהִ֥יבַת לְ/ה֖וֹן עַד זְמַ֥ן וְ/עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/012.yaml
  text: As for the rest of the beasts[a], their dominion was taken away, but an extension of life was given to them for a time and a season.
translation:
  language: fr
  text: Quant aux autres bêtes, leur domination leur fut retirée, mais une prolongation de vie leur fut accordée jusqu’à un temps et une période[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour un temps et une période ». L’expression araméenne peut aussi décrire la durée limitée de la prolongation qui leur est accordée.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר חֵיוָתָא
  choice: Quant aux autres bêtes
  rationale: « Quant aux » marque naturellement le déplacement contrastif vers le reste des bêtes; « bêtes » convient aux figures symboliques de la vision.
- source_word: הֶעְדִּיו שָׁלְטָנְהוֹן
  choice: leur domination leur fut retirée
  rationale: Cette formulation conserve la valeur passive du retrait et rend שָׁלְטָן par « domination », terme adapté au vocabulaire politique et visionnaire de Daniel.
- source_word: וְאַרְכָה בְחַיִּין
  choice: mais une prolongation de vie
  rationale: 'Le contexte donne à la conjonction une valeur adversative : la domination est retirée, tandis que la vie se poursuit. « Prolongation de vie » rend naturellement l’expression araméenne.'
- source_word: יְהִיבַת לְהוֹן
  choice: leur fut accordée
  rationale: Le passif est préservé sans préciser l’auteur implicite du don; « accordée » convient idiomatiquement à une prolongation.
- source_word: עַד זְמַן וְעִדָּן
  choice: pour un temps et une période
  rationale: La traduction exprime une durée limitée sans imposer une chronologie eschatologique technique; deux substantifs distincts préservent le parallélisme de l’araméen.
theological_decisions:
- issue: Durée de la survie des bêtes après la perte de leur domination
  choice: pour un temps et une période
  alternative: jusqu’à un temps et une période
  rationale: La préposition עַד peut présenter la limite temporelle sous l’angle de la durée ou de son terme. Le texte principal exprime la durée limitée, tandis que la note conserve l’autre compréhension possible sans trancher davantage.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple soutient le registre narratif de la vision sans archaïsme marqué. La répétition pronominale dans « leur domination leur fut retirée » est maintenue pour rendre clairement à la fois le possesseur et le bénéficiaire du retrait.
