source:
  edition: WLC
  text: וְ/דָנִיֵּ֣אל דְּנָ֔ה הַצְלַ֖ח בְּ/מַלְכ֣וּת דָּרְיָ֑וֶשׁ וּ/בְ/מַלְכ֖וּת כּ֥וֹרֶשׁ פרסי/א׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/029.yaml
  text: And this Daniel prospered during the reign of Darius and during the reign of Cyrus the Persian[a].
translation:
  language: fr
  text: Et ce Daniel prospéra sous le règne de Darius et sous le règne de Cyrus le Perse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « sous le règne de Darius, c’est-à-dire sous le règne de Cyrus le Perse », si les deux noms sont compris comme désignant le même souverain.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּנָה
  choice: ce
  rationale: Le démonstratif reprend avec insistance Daniel, qui vient d’être mentionné. « Ce Daniel » conserve cette valeur récapitulative en français naturel.
- source_word: הַצְלַח
  choice: prospéra
  rationale: Le verbe exprime la réussite ou la prospérité. « Prospéra » résume naturellement le succès de Daniel sans le limiter à la richesse matérielle.
- source_word: בְּמַלְכוּת
  choice: sous le règne de
  rationale: L’expression signifie littéralement « dans le règne/royaume de », mais elle a ici une valeur temporelle. « Sous le règne de » est idiomatique et précis en français moderne.
- source_word: דָּרְיָוֶשׁ
  choice: Darius
  rationale: Forme française traditionnelle et courante du nom royal.
- source_word: וּבְמַלְכוּת
  choice: et sous le règne de
  rationale: La répétition de la construction est conservée afin de respecter la structure et le rythme de l’araméen.
- source_word: כּוֹרֶשׁ
  choice: Cyrus
  rationale: Forme française traditionnelle et courante du nom royal.
- source_word: פרסי
  choice: le Perse
  rationale: Le gentilé qualifie Cyrus par son appartenance ethnique ou impériale. « Le Perse » est la formulation française directe et consacrée.
theological_decisions:
- issue: Rapport entre Darius et Cyrus dans ce verset
  choice: Présenter les deux propositions telles quelles, sans décider si Darius et Cyrus sont deux souverains distincts ou deux noms désignant le même souverain.
  alternative: 'Comprendre : « sous le règne de Darius, c’est-à-dire sous le règne de Cyrus le Perse » ; ou y voir deux règnes successifs.'
  rationale: Le texte relie les deux expressions par « et » sans expliciter le rapport historique entre les noms. La traduction principale préserve donc cette formulation et la note signale l’autre compréhension possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit sans être archaïque. La répétition « sous le règne de » maintient la clarté et la structure du texte source.
