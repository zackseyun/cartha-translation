  to: Alors, ce Daniel se distinguait plus que les hauts fonctionnaires et les satrapes, parce qu’un esprit extraordinaire était en lui[a], et le roi projetait de l’établir à la tête de tout le royaume[b].
  rationale: La révision explicite la supériorité comparative indiquée par l’araméen, sans modifier l’aspect descriptif de la phrase ni lever l’ambiguïté du terme « esprit ». La seconde note est légèrement ajustée afin de conserver plus directement l’idée d’autorité sur l’ensemble du royaume.
