source:
  edition: WLC
  text: אֱדַ֨יִן֙ דָּנִיֵּ֣אל דְּנָ֔ה הֲוָ֣א מִתְנַצַּ֔ח עַל סָרְכַיָּ֖/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֑/א כָּ/ל קֳבֵ֗ל דִּ֣י ר֤וּחַ יַתִּירָא֙ בֵּ֔/הּ וּ/מַלְכָּ֣/א עֲשִׁ֔ית לַ/הֲקָמוּתֵ֖/הּ עַל כָּל מַלְכוּתָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/004.yaml
  text: Then this Daniel distinguished himself above the high officials and the satraps[a], because an extraordinary spirit was in him[b], and the king planned to set him over the whole kingdom.
translation:
  language: fr
  text: Alors, ce Daniel se distinguait plus que les hauts fonctionnaires et les satrapes, parce qu’un esprit extraordinaire était en lui[a], et le roi projetait de l’établir à la tête de tout le royaume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit excellent était en lui ». L’expression peut désigner, de manière générale, les qualités intérieures, la sagesse ou les dispositions exceptionnelles de Daniel.'
    reason: Alternative lexicale et préservation de l’ambiguïté de רוּחַ יַתִּירָא.
  - marker: b
    text: 'Ou : « le roi avait l’intention de le nommer à la tête de tout le royaume ».'
    reason: Autre manière de rendre l’intention royale et la nomination envisagée.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque naturellement la progression temporelle du récit.
- source_word: דָּנִיֵּאל דְּנָה
  choice: ce Daniel
  rationale: Conserve l’emphase portée par le démonstratif araméen, plutôt que de rendre simplement « Daniel ».
- source_word: הֲוָא מִתְנַצַּח
  choice: se distinguait
  rationale: Exprime de façon idiomatique une supériorité durable ou manifeste, tout en respectant l’aspect continu de la construction.
- source_word: עַל סָרְכַיָּא וַאֲחַשְׁדַּרְפְּנַיָּא
  choice: des hauts fonctionnaires et des satrapes
  rationale: « Hauts fonctionnaires » rend clairement le premier titre administratif; « satrapes » conserve le titre historique perse précis.
- source_word: כָּל־קֳבֵל דִּי
  choice: parce que
  rationale: Introduit clairement la cause de la distinction de Daniel.
- source_word: רוּחַ יַתִּירָא
  choice: un esprit extraordinaire
  rationale: Préserve le mot « esprit » et l’idée d’une qualité exceptionnelle, sans réduire celle-ci à la seule compétence ou au seul caractère.
- source_word: בֵּהּ
  choice: il avait en lui
  rationale: Formulation française naturelle qui conserve l’idée que cet esprit résidait en Daniel ou le caractérisait intérieurement.
- source_word: וּמַלְכָּא עֲשִׁית
  choice: et le roi projetait
  rationale: Rend l’intention ou le dessein du roi sans suggérer que la nomination avait déjà eu lieu.
- source_word: לַהֲקָמוּתֵהּ עַל כָּל מַלְכוּתָא
  choice: de l’établir à la tête de tout le royaume
  rationale: Rend idiomatiquement l’idée de placer Daniel en position d’autorité sur l’ensemble du royaume.
theological_decisions:
- issue: Sens de l’« esprit » extraordinaire de Daniel
  choice: Conserver « esprit » sans préciser davantage sa nature.
  alternative: Interpréter par « capacités exceptionnelles », « sagesse exceptionnelle » ou « caractère remarquable ».
  rationale: L’araméen ne précise pas ici s’il s’agit du tempérament, de la sagesse, d’une aptitude particulière ou d’une action divine. La traduction maintient cette ouverture théologique et littéraire.
translation_notes:
  register: Français international moderne, clair et digne. Les titres administratifs restent compréhensibles sans effacer la précision historique de « satrapes ». La syntaxe suit le mouvement narratif de l’araméen tout en demeurant naturelle en français.
