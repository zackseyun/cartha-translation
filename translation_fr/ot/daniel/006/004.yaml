    issue: La comparaison de supériorité n’est pas explicitement exprimée.
    rationale: Dans « se distinguait des hauts fonctionnaires et des satrapes », la préposition « de » peut seulement marquer une différence. L’araméen עַל marque ici que Daniel les surpassait ou excellait plus qu’eux.
