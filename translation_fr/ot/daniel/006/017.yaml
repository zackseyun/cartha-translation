  text: בֵּ/אדַ֜יִן מַלְכָּ֣/א אֲמַ֗ר וְ/הַיְתִיו֙ לְ/דָ֣נִיֵּ֔אל וּ/רְמ֕וֹ לְ/גֻבָּ֖/א דִּ֣י אַרְיָוָתָ֑/א עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר לְ/דָנִיֵּ֔אל אֱלָהָ֗/ךְ דִּ֣י אנתה פָּֽלַֽח לֵ/הּ֙ בִּ/תְדִירָ֔/א ה֖וּא יְשֵׁיזְבִנָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/017.yaml
  text: Then the king gave the command[a], and they brought Daniel and threw him into the den of lions. The king answered and said to Daniel, “Your God, whom you continually serve[b], he will deliver you.”
translation:
  language: fr
  text: 'Alors le roi donna l’ordre, et l’on amena Daniel et le jeta dans la fosse aux lions. Le roi prit la parole et dit à Daniel : « Ton Dieu, que tu sers continuellement, c’est lui qui te délivrera[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « puisse-t-il te délivrer ». Certains comprennent l’araméen comme l’expression d’un souhait; le texte principal retient le sens déclaratif plus direct.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: אֲמַר
  choice: donna l’ordre
  rationale: Le verbe signifie littéralement « dit », mais il introduit ici un ordre royal immédiatement exécuté.
- source_word: וְהַיְתִיו
  choice: l’on amena
  rationale: Le causatif de « venir » exprime ici le fait de faire venir ou d’amener Daniel; le pronom indéfini convient aux agents non nommés.
- source_word: וּרְמוֹ
  choice: jeta
  rationale: Rend la force du verbe araméen « jeter », sans l’atténuer en « mettre ».
- source_word: לְגֻבָּא דִּי אַרְיָוָתָא
  choice: dans la fosse aux lions
  rationale: « Fosse » correspond bien au lieu d’enfermement évoqué par גֻּבָּא; « aux lions » est l’expression française naturelle.
- source_word: עָנֵה ... וְאָמַר
  choice: prit la parole et dit
  rationale: Conserve les deux éléments de la formule narrative sémitique dans un français digne et intelligible.
- source_word: דִּי אנתה פָּלַח לֵהּ
  choice: que tu sers
  rationale: « Servir » préserve l’étendue de sens du verbe, qui désigne ici le service fidèle rendu à Dieu sans le réduire au seul culte rituel.
- source_word: בִּתְדִירָא
  choice: continuellement
  rationale: Exprime la constance et la régularité persistante du service de Daniel.
- source_word: הוּא
  choice: c’est lui qui
  rationale: Rend explicitement l’emphase portée par le pronom indépendant araméen.
- source_word: יְשֵׁיזְבִנָּךְ
  choice: te délivrera
  rationale: Traduit le sauvetage hors d’un danger et convient au registre élevé du récit.
theological_decisions:
- issue: Valeur de la déclaration finale du roi
  choice: « c’est lui qui te délivrera »
  alternative: « puisse-t-il te délivrer »
  rationale: La forme araméenne se lit naturellement comme une affirmation ou l’expression d’une confiance. La note conserve néanmoins la possibilité d’une nuance de souhait, sans effacer l’ambiguïté reconnue.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’emphase du pronom araméen et la formule narrative à deux verbes, tout en évitant un tour archaïque.
