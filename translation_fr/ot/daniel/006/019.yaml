  text: אֱ֠דַיִן אֲזַ֨ל מַלְכָּ֤/א לְ/הֵֽיכְלֵ/הּ֙ וּ/בָ֣ת טְוָ֔ת וְ/דַחֲוָ֖ן לָא הַנְעֵ֣ל קָֽדָמ֑וֹ/הִי וְ/שִׁנְתֵּ֖/הּ נַדַּ֥ת עֲלֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/019.yaml
  text: Then the king went to his palace and spent the night fasting; no entertainment was brought before him[a], and sleep fled from him.
translation:
  language: fr
  text: Alors le roi se rendit dans son palais et passa la nuit à jeun. Aucun divertissement ne fut amené devant lui[a], et le sommeil le fuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun musicien ne fut amené devant lui ». Le terme araméen est incertain et peut désigner plus précisément des artistes ou des distractions.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe narratif araméen marquant l’événement suivant; « Alors » convient naturellement au récit.
- source_word: לְהֵיכְלֵהּ
  choice: dans son palais
  rationale: הֵיכַל peut désigner un palais ou un temple; ici, le contexte du retour du roi à sa résidence impose naturellement « palais ».
- source_word: וּבָת טְוָת
  choice: passa la nuit à jeun
  rationale: Rend de façon idiomatique l’idée de passer la nuit en jeûnant.
- source_word: וְדַחֲוָן
  choice: divertissement
  rationale: Le terme est incertain et peut renvoyer à des musiciens, à des amusements ou plus généralement à ce qui distrait; le singulier collectif français conserve cette largeur de sens.
- source_word: לָא הַנְעֵל קָדָמוֹהִי
  choice: ne fut amené devant lui
  rationale: La tournure passive restitue le causatif dans son contexte et l’idée d’une chose qu’on introduit en présence du roi.
- source_word: וְשִׁנְתֵּהּ נַדַּת עֲלוֹהִי
  choice: et le sommeil le fuit
  rationale: Préserve la personnification expressive du sommeil qui s’éloigne du roi, dans un français naturel et soutenu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit. « À jeun » est plus naturel que « dans le jeûne », et la note maintient l’incertitude lexicale de וְדַחֲוָן.
