base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/024.yaml
  text: Then the king was very glad because of him[a], and he ordered that Daniel be brought up from the pit. So Daniel was brought up from the pit, and no kind of harm was found on him[b], because he had trusted in his God.
translation:
  language: fr
  text: Alors le roi éprouva une très grande joie à son sujet et ordonna qu’on fasse remonter Daniel de la fosse. On fit donc remonter Daniel de la fosse, et l’on ne trouva sur lui aucune blessure, parce qu’il avait mis sa confiance en son Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parce qu’il avait cru en son Dieu ». Le verbe araméen peut exprimer le fait de croire ou de faire confiance ; ici, le contexte met en avant le fait de s’en remettre personnellement à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: שַׂגִּיא טְאֵב עֲלוֹהִי
  choice: le roi éprouva une très grande joie à son sujet
  rationale: Rend l’intensité de l’expression araméenne et rattache clairement la joie du roi à Daniel, sans alourdir la phrase.
- source_word: וּלְדָנִיֵּאל אֲמַר לְהַנְסָקָה
  choice: ordonna qu’on fasse remonter Daniel
  rationale: La construction avec l’infinitif exprime ici un ordre; le causatif de נסק indique que Daniel doit être tiré vers le haut.
- source_word: מִן גֻּבָּא
  choice: de la fosse
  rationale: Le nom désigne une cavité ou fosse; « fosse » préserve l’image spatiale, tandis que le contexte établit qu’il s’agit de la fosse aux lions.
- source_word: וְהֻסַּק
  choice: fut donc remonté
  rationale: Le passif conserve le lien lexical avec l’ordre précédent et « donc » marque naturellement son exécution.
- source_word: וְכָל חֲבָל לָא הִשְׁתְּכַח בֵּהּ
  choice: l’on ne trouva sur lui aucune blessure
  rationale: « Blessure » convient à un examen corporel après l’exposition aux lions; « aucune » exprime la portée totale de כָל dans la négation.
- source_word: דִּי הֵימִן בֵּאלָהֵהּ
  choice: parce qu’il avait mis sa confiance en son Dieu
  rationale: Conserve explicitement le rapport causal et rend הֵימִן par une confiance personnelle plutôt que par une simple adhésion intellectuelle.
theological_decisions:
- issue: Fondement de la délivrance de Daniel
  choice: parce qu’il avait mis sa confiance en son Dieu
  alternative: parce qu’il avait cru en son Dieu / parce qu’il avait cru son Dieu
  rationale: Le texte attribue explicitement l’absence de blessure à la confiance de Daniel en Dieu. La formulation conserve ce lien causal sans préciser un mécanisme doctrinal ni présenter cette confiance comme un mérite.
translation_notes:
  register: Français international moderne, narratif et digne. « Fosse » maintient l’image concrète d’une cavité dont Daniel est remonté; aucune note n’est nécessaire puisque le contexte immédiat précise qu’il s’agit de la fosse aux lions. Le marqueur [a] est placé après la proposition qu’il documente.
