id: DAN.6.6
reference: Daniel 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ אָֽמְרִ֔ין דִּ֣י לָ֧א נְהַשְׁכַּ֛ח לְ/דָנִיֵּ֥אל דְּנָ֖ה כָּל עִלָּ֑א לָהֵ֕ן הַשְׁכַּ֥חְנָֽה עֲל֖וֹ/הִי בְּ/דָ֥ת אֱלָהֵֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/006.yaml
  text: Then these men said[a], ‘We will not find any charge against this Daniel unless we find it against him in the law of his God.’
translation:
  language: fr
  text: 'Alors ces hommes dirent : « Nous ne trouverons aucun motif d’accusation[a] contre ce Daniel, à moins d’en trouver un contre lui dans la loi de son Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun chef d’accusation ».
    reason: Alternative lexicale pour כָּל עִלָּא, qui peut désigner le fondement ou le chef d’une accusation.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe temporel et séquentiel qui fait progresser le récit ; « Alors » est naturel en français narratif moderne.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: ces hommes
  rationale: Rend littéralement le groupe nominal sans importer ici leur titre officiel fourni par le contexte plus large.
- source_word: אָמְרִין
  choice: dirent
  rationale: Le passé simple convient au registre narratif soutenu mais accessible et rend l’acte de parole sans surinterpréter l’aspect.
- source_word: דִּי לָא נְהַשְׁכַּח
  choice: Nous ne trouverons
  rationale: Le futur exprime la conclusion à laquelle les hommes arrivent quant au résultat attendu de leurs recherches.
- source_word: לְדָנִיֵּאל דְּנָה
  choice: contre ce Daniel
  rationale: « Contre » convient au cadre accusatoire, tandis que « ce Daniel » conserve le démonstratif et sa possible nuance dépréciative.
- source_word: כָּל עִלָּא
  choice: aucun motif d’accusation
  rationale: Le nom désigne ici une base ou un motif permettant d’accuser quelqu’un ; cette formulation est claire et juridiquement naturelle.
- source_word: לָהֵן
  choice: à moins de
  rationale: La conjonction introduit l’unique exception à l’affirmation précédente.
- source_word: הַשְׁכַּחְנָה
  choice: en trouver un
  rationale: La répétition du verbe « trouver » conserve l’effet lexical de la source ; le pronom renvoie au motif d’accusation.
- source_word: עֲלֹוהִי
  choice: contre lui
  rationale: Dans ce contexte juridique et hostile, la préposition indique qu’une accusation serait dirigée contre Daniel.
- source_word: בְּדָת אֱלָהֵהּ
  choice: dans la loi de son Dieu
  rationale: « Loi » rend דָת dans son sens normatif religieux ; « dans » conserve l’idée que le motif serait découvert dans le domaine de cette loi.
theological_decisions:
- issue: Majuscule à « Dieu » pour אֱלָהֵהּ
  choice: son Dieu
  alternative: son dieu
  rationale: L’araméen ne marque pas la majuscule, mais le référent est le Dieu que Daniel reconnaît personnellement. La majuscule française identifie ce référent selon la perspective du récit sans ajouter de précision doctrinale.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient le ton du récit biblique sans archaïsme marqué. La répétition de « trouver » et le démonstratif « ce Daniel » préservent les traits rhétoriques de l’araméen.
