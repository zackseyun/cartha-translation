  text: וּ/כְ/מִקְרְבֵ֣/הּ לְ/גֻבָּ֔/א לְ/דָ֣נִיֵּ֔אל בְּ/קָ֥ל עֲצִ֖יב זְעִ֑ק עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/דָנִיֵּ֗אל דָּֽנִיֵּאל֙ עֲבֵד֙ אֱלָהָ֣/א חַיָּ֔/א אֱלָהָ֗/ךְ דִּ֣י אנתה פָּֽלַֽח לֵ/הּ֙ בִּ/תְדִירָ֔/א הַ/יְכִ֥ל לְ/שֵׁיזָבוּתָ֖/ךְ מִן אַרְיָוָתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/021.yaml
  text: And when he came near the den[a], he cried out to Daniel with a distressed voice. The king spoke and said to Daniel, “Daniel, servant of the living God, has your God, whom you continually serve[c][b], been able to deliver you from the lions?”
translation:
  language: fr
  text: 'Lorsqu’il s’approcha de la fosse[a], il cria à Daniel d’une voix angoissée. Le roi prit la parole et dit à Daniel : « Daniel, serviteur du Dieu vivant, ton Dieu, que tu sers continuellement[b], a-t-il pu te délivrer des lions ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la fosse aux lions ». Le mot araméen désigne une fosse ou un antre servant ici d’enclos aux lions.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que tu adores continuellement ». Le verbe araméen peut désigner le service religieux ou l’adoration.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמִקְרְבֵהּ לְגֻבָּא
  choice: Lorsqu’il s’approcha de la fosse
  rationale: La construction marque le moment où le roi arrive près de l’endroit. « S’approcha » est naturel et précis; « fosse » rend le creux ou l’enclos souterrain désigné par גֻבָּא dans ce récit.
- source_word: בְּקָל עֲצִיב
  choice: d’une voix angoissée
  rationale: עֲצִיב exprime la peine, l’affliction ou la détresse. « Angoissée » convient à l’émotion du roi sans en préciser excessivement la nature.
- source_word: זְעִק
  choice: il appela
  rationale: Le verbe désigne un appel poussé à haute voix. Dans ce contexte, « appela » est idiomatique; l’intensité ressort aussi de la voix angoissée.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Le roi prit la parole et dit
  rationale: Cette formule sémitique introduit la déclaration du roi. « Prit la parole et dit » conserve son caractère formulaire sans suggérer nécessairement une réponse à une parole antérieure.
- source_word: עֲבֵד אֱלָהָא חַיָּא
  choice: serviteur du Dieu vivant
  rationale: עֲבֵד peut désigner un serviteur ou un esclave. Ici, il caractérise honorifiquement la fidélité religieuse de Daniel; « serviteur » convient mieux au contexte.
- source_word: דִּי אנתה פָּלַח לֵהּ בִּתְדִירָא
  choice: que tu sers continuellement
  rationale: פְּלַח désigne ici le service religieux et peut aussi se rendre par « adorer ». « Servir » garde la portée large de la fidélité active et le lien lexical avec « serviteur »; בִּתְדִירָא indique la continuité.
- source_word: הַיְכִל לְשֵׁיזָבוּתָךְ
  choice: a-t-il pu te délivrer
  rationale: La forme verbale demande si Dieu s’est montré capable d’accomplir le sauvetage jusqu’à ce moment. « Délivrer » exprime directement le secours hors du danger.
- source_word: מִן אַרְיָוָתָא
  choice: des lions
  rationale: Traduction directe et naturelle de la préposition et du nom déterminé.
theological_decisions:
- issue: Statut exprimé par עֲבֵד dans la relation de Daniel à Dieu
  choice: serviteur du Dieu vivant
  alternative: esclave du Dieu vivant
  rationale: Le terme peut lexicalement désigner un esclave, mais sa fonction dans cette adresse royale met en avant le dévouement fidèle de Daniel. « Serviteur » préserve ce sens sans imposer au passage un accent socio-juridique.
- issue: Portée religieuse de פָּלַח
  choice: que tu sers continuellement
  alternative: que tu adores continuellement
  rationale: Le verbe peut désigner l’adoration, mais aussi plus largement le service rendu à une divinité. « Sers » préserve cette amplitude et l’écho avec « serviteur ».
- issue: Nuance de la question הַיְכִל
  choice: a-t-il pu te délivrer
  alternative: a-t-il été capable de te délivrer
  rationale: La formulation reste une véritable question du roi et ne préjuge ni de sa foi ni de l’issue, tout en exprimant naturellement en français l’examen d’un acte désormais accompli ou non.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de l’araméen tout en évitant une formule de parole artificielle en français. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
