lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe narratif araméen marquant la succession des événements ; « Alors » est naturel en français moderne.
- source_word: דָּנִיֶּאל
  choice: Daniel
  rationale: Transcription française traditionnelle du nom propre.
- source_word: עִם
  choice: au
  rationale: La préposition signifie littéralement « avec », mais, avec un verbe de parole et son destinataire, « parler au roi » est l’expression française naturelle.
- source_word: מַלְכָּא
  choice: le roi
  rationale: La première occurrence désigne le destinataire de la parole de Daniel.
- source_word: מַלִּל
  choice: parla
  rationale: Le parfait peal exprime ici simplement l’acte de parler, sans qu’il soit nécessaire d’ajouter « répondit ».
- source_word: מַלְכָּא
  choice: Ô roi
  rationale: La seconde occurrence est un vocatif ; « Ô roi » conserve le ton solennel de l’adresse royale.
- source_word: לְעָלְמִין
  choice: pour toujours
  rationale: Expression araméenne de durée indéfinie, employée dans une formule conventionnelle de bénédiction royale.
- source_word: חֱיִי
  choice: vis
  rationale: La forme impérative appartient ici à une formule de souhait ; l’impératif français en préserve la formulation concise tout en laissant entendre le sens optatif.
