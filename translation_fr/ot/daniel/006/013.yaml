id: DAN.6.13
reference: Daniel 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֵּ֠/אדַיִן קְרִ֨יבוּ וְ/אָמְרִ֥ין קֳדָם מַלְכָּ/א֮ עַל אֱסָ֣ר מַלְכָּ/א֒ הֲ/לָ֧א אֱסָ֣ר רְשַׁ֗מְתָּ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִבְעֵה֩ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/ג֖וֹב אַרְיָותָ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר יַצִּיבָ֧א מִלְּתָ֛/א כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/013.yaml
  text: 'Then they came near and spoke before the king concerning the king’s injunction: “Did you not sign an injunction that any man who makes a petition to any god or man for thirty days[a], except to you, O king, shall be thrown into the lions’ den?” The king answered and said, “The matter is certain, according to the law of the Medes and Persians[c][b], which cannot be changed.”'
translation:
  language: fr
  text: 'Alors ils s’approchèrent et parlèrent devant le roi au sujet de l’interdit royal : « N’as-tu pas signé un interdit selon lequel toute personne qui, pendant trente jours, adresserait une requête à quelque dieu ou être humain que ce soit, sauf à toi, ô roi, serait jetée dans la fosse aux lions ? » Le roi répondit : « La chose est certaine, conformément à la loi des Mèdes et des Perses, qui ne peut être révoquée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ne peut être changée » ou « abrogée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression du récit de façon naturelle en français moderne.
- source_word: קְרִיבוּ
  choice: ils s’approchèrent
  rationale: Rend concrètement le mouvement vers le roi.
- source_word: וְאָמְרִין קֳדָם מַלְכָּא
  choice: et parlèrent devant le roi
  rationale: Préserve le cadre formel de la cour exprimé par « devant ».
- source_word: עַל אֱסָר מַלְכָּא
  choice: au sujet de l’interdit royal
  rationale: אֱסָר désigne ici une interdiction officielle et contraignante, plus précisément qu’un décret au sens large.
- source_word: רְשַׁמְתָּ
  choice: signé
  rationale: Dans ce contexte juridique, le verbe évoque la mise par écrit et la validation officielle de l’interdit.
- source_word: כָל אֱנָשׁ
  choice: toute personne
  rationale: Le masculin singulier araméen a ici une portée générique dans une formulation juridique; « toute personne » est naturel et exact en français.
- source_word: יִבְעֵה מִן
  choice: adresserait une requête à
  rationale: Le verbe et la préposition désignent une demande faite auprès d’un destinataire; cette formulation conserve la nuance formelle.
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: à quelque dieu ou être humain que ce soit
  rationale: La tournure française exprime clairement l’indéfinition universelle de כָּל sans confondre l’être humain avec le sexe masculin.
- source_word: עַד יוֹמִין תְּלָתִין
  choice: pendant trente jours
  rationale: Rend naturellement la durée visée par l’interdiction.
- source_word: לָהֵן מִנָּךְ
  choice: sauf à toi
  rationale: Exprime directement l’unique exception concernant le destinataire des requêtes.
- source_word: יִתְרְמֵא לְגוֹב אַרְיָותָא
  choice: serait jetée dans la fosse aux lions
  rationale: Le conditionnel s’accorde naturellement en français avec la citation indirectement formulée après « selon lequel », tout en conservant la sanction passive.
- source_word: יַצִּיבָא מִלְּתָא
  choice: La chose est certaine
  rationale: Rend la confirmation ferme donnée par le roi sans ajouter d’explication.
- source_word: דִּי לָא תֶעְדֵּא
  choice: qui ne peut être révoquée
  rationale: Dans le contexte d’une loi, « révoquée » exprime clairement qu’elle ne peut être abrogée ou supprimée.
theological_decisions:
- issue: Portée générique de אֱנָשׁ dans la formule juridique
  choice: toute personne / être humain
  alternative: tout homme / un homme
  rationale: Le nom masculin singulier fonctionne génériquement et vise quiconque tombe sous l’interdit. Le français contemporain exprime plus clairement cette portée par « personne » et « être humain », sans modifier le champ d’application du texte.
- issue: Nature de אֱסָר
  choice: interdit
  alternative: décret / ordonnance
  rationale: Le terme souligne une prohibition contraignante plutôt qu’une proclamation royale générale.
- issue: Caractère immuable de la loi des Mèdes et des Perses
  choice: qui ne peut être révoquée
  alternative: qui ne peut être changée
  rationale: « Révoquée » conserve la portée juridique de l’expression sans trancher au-delà du texte sur le mécanisme exact de son immutabilité.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire juridique reste clair sans devenir technique; « ô roi » conserve la solennité de l’adresse araméenne.
