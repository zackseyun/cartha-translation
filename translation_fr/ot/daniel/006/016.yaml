  text: בֵּ/אדַ֨יִן֙ גֻּבְרַיָּ֣/א אִלֵּ֔ךְ הַרְגִּ֖שׁוּ עַל מַלְכָּ֑/א וְ/אָמְרִ֣ין לְ/מַלְכָּ֗/א דַּ֤ע מַלְכָּ/א֙ דִּֽי דָת֙ לְ/מָדַ֣י וּ/פָרַ֔ס דִּֽי כָל אֱסָ֥ר וּ/קְיָ֛ם דִּֽי מַלְכָּ֥/א יְהָקֵ֖ים לָ֥א לְ/הַשְׁנָיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/016.yaml
  text: Then these men came by agreement to the king and said to the king[a], "Know, O king[b], that it is a law of the Medes and Persians that any injunction or statute that the king establishes cannot be changed."
translation:
  language: fr
  text: 'Alors ces hommes se précipitèrent en groupe auprès du roi[a] et lui dirent : « Sache, ô roi, que, selon la loi des Mèdes et des Perses, toute interdiction ou ordonnance établie par le roi ne peut être modifiée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se liguèrent contre le roi ». Le verbe araméen peut évoquer une action collective, concertée et insistante, et non une simple démarche.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « aucun interdit ni décret promulgué par le roi ne peut être changé ». Les deux termes couvrent diverses formes de décisions royales juridiquement contraignantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque naturellement la progression du récit en français moderne.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: ces hommes
  rationale: Renvoie directement au groupe hostile déjà mentionné et respecte le masculin du texte.
- source_word: הַרְגִּשׁוּ עַל
  choice: se rendirent ensemble auprès de
  rationale: Rend l’idée d’une démarche collective et concertée auprès du roi sans réduire le verbe à une simple arrivée ni imposer l’image d’une pression physique.
- source_word: וְאָמְרִין לְמַלְכָּא
  choice: et lui dirent
  rationale: Formulation française naturelle; le pronom reprend sans ambiguïté le roi.
- source_word: דַּע מַלְכָּא
  choice: Sache, ô roi
  rationale: Conserve l’impératif et l’apostrophe solennelle du langage de cour.
- source_word: דִּי דָת לְמָדַי וּפָרַס
  choice: que, selon la loi des Mèdes et des Perses
  rationale: Exprime idiomatiquement l’appel à l’ordre juridique réputé immuable des Mèdes et des Perses.
- source_word: כָל אֱסָר
  choice: toute interdiction
  rationale: אֱסָר désigne ici une restriction juridiquement contraignante; « interdiction » est clair et précis en français courant.
- source_word: וּקְיָם
  choice: ou ordonnance
  rationale: Désigne une disposition officiellement établie et maintient la distinction avec l’interdiction.
- source_word: דִּי מַלְכָּא יְהָקֵים
  choice: établie par le roi
  rationale: Rend la mise en vigueur royale de l’une ou l’autre mesure juridique.
- source_word: לָא לְהַשְׁנָיָה
  choice: ne peut être modifiée
  rationale: Communique clairement le caractère juridiquement inaltérable de la mesure.
