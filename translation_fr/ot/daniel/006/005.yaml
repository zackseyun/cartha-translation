revisions:
- from: Alors, les hauts responsables et les satrapes cherchèrent un motif d’accuser Daniel au sujet des affaires du royaume. Mais ils ne purent trouver aucun motif d’accusation ni aucune corruption, parce qu’il était digne de confiance[a] ; aucune négligence[b] ni aucune corruption ne put être trouvée contre lui.
  to: Alors, les hauts responsables et les satrapes cherchaient à trouver un motif pour accuser Daniel au sujet des affaires du royaume, mais ils ne purent trouver aucun motif d’accusation ni aucune corruption, parce qu’il était digne de confiance[a] ; il ne se trouvait contre lui ni négligence[b] ni corruption.
  rationale: La révision rétablit l’aspect duratif de la recherche hostile, explicite la construction infinitive sans introduire d’accusation déjà établie, et améliore la dernière proposition tout en préservant sa fonction juridique (« contre lui »). Les deux ancres de notes et leur contenu sont maintenus.
