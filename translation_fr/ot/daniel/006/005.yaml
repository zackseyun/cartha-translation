review_pass:
  verdict: revise
  source_fidelity: Le projet rend avec justesse le cadre administratif, le sens accusatoire de עִלָּה, la fiabilité professionnelle de מְהֵימַן et l’orientation judiciaire de עֲלוֹהִי (« contre lui »). Toutefois, les formes verbales araméennes décrivent une recherche en cours ; l’imparfait français les rend mieux que le passé simple.
  naturalness: « Cherchèrent un motif d’accuser » est moins naturel et ne reflète pas explicitement l’infinitif « trouver ». La formulation révisée « cherchaient à trouver un motif pour accuser » est idiomatique. « Il ne se trouvait contre lui… » évite l’accord lourd et peu naturel de « aucune négligence ni aucune corruption ne put être trouvée », tout en conservant le sens passif/forensique.
  terminology: « Hauts responsables », « satrapes », « affaires du royaume », « corruption », « digne de confiance » et « négligence » conviennent au français international moderne et au contexte administratif. Les notes lexicales restent appropriées.
  issues:
  - severity: medium
    issue: Aspect verbal de la recherche
    rationale: הֲווֹ בָעַיִן (« étaient en train de chercher ») appelle normalement l’imparfait en français. Le passé simple « cherchèrent » présente l’action comme ponctuelle ou achevée.
  - severity: low
    issue: Tour « motif d’accuser »
    rationale: Le français moderne préfère « un motif pour accuser Daniel » ou « des motifs d’accusation ». Ajouter « à trouver » rend aussi explicitement l’infinitif araméen לְהַשְׁכָּחָה.
  - severity: low
    issue: Construction finale peu fluide
    rationale: La coordination de deux noms féminins avec « ne put être trouvée » est grammaticalement et stylistiquement maladroite. La tournure impersonnelle « il ne se trouvait contre lui… » conserve la portée judiciaire sans ambiguïté.
  revised_text: Alors, les hauts responsables et les satrapes cherchaient à trouver un motif pour accuser Daniel au sujet des affaires du royaume, mais ils ne purent trouver aucun motif d’accusation ni aucune corruption, parce qu’il était digne de confiance[a] ; il ne se trouvait contre lui ni négligence[b] ni corruption.
