  text: אֱדַ֨יִן סָֽרְכַיָּ֜/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֗/א הֲו֨וֹ בָעַ֧יִן עִלָּ֛ה לְ/הַשְׁכָּחָ֥ה לְ/דָנִיֵּ֖אל מִ/צַּ֣ד מַלְכוּתָ֑/א וְ/כָל עִלָּ֨ה וּ/שְׁחִיתָ֜ה לָא יָכְלִ֣ין לְ/הַשְׁכָּחָ֗ה כָּ/ל קֳבֵל֙ דִּֽי מְהֵימַ֣ן ה֔וּא וְ/כָל שָׁלוּ֙ וּ/שְׁחִיתָ֔ה לָ֥א הִשְׁתְּכַ֖חַת עֲלֽוֹ/הִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/005.yaml
  text: Then the high officials and satraps tried to find grounds for accusing Daniel in matters of the kingdom, but they could find no grounds for accusation or corruption, because he was trustworthy[a], and no negligence[b] or corruption could be found against him.
translation:
  language: fr
  text: Alors, les hauts responsables et les satrapes cherchaient à trouver un motif pour accuser Daniel au sujet des affaires du royaume, mais ils ne purent trouver aucun motif d’accusation ni aucune corruption, parce qu’il était digne de confiance[a] ; il ne se trouvait contre lui ni négligence[b] ni corruption.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidèle » ou « fiable » ; l’araméen décrit la fiabilité de Daniel dans l’exercice de sa charge.
    reason: lexical_alternative
  - marker: b
    text: Ou « erreur », « manquement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque naturellement en français la progression du récit.
- source_word: סָרְכַיָּא
  choice: hauts responsables
  rationale: Rend clairement ce titre administratif sans lui attribuer une fonction moderne trop précise.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: satrapes
  rationale: Terme historique établi qui préserve le cadre perse.
- source_word: בָעַיִן עִלָּה לְהַשְׁכָּחָה
  choice: cherchèrent un motif d’accuser
  rationale: Exprime à la fois leur recherche active et la portée accusatoire de עִלָּה, sans supposer qu’une accusation formelle existait déjà.
- source_word: מִצַּד מַלְכוּתָא
  choice: au sujet des affaires du royaume
  rationale: Situe leur enquête dans la sphère du service gouvernemental de Daniel.
- source_word: שְׁחִיתָה
  choice: corruption
  rationale: Convient au contexte administratif et désigne une conduite fautive ou corrompue.
- source_word: מְהֵימַן
  choice: digne de confiance
  rationale: Souligne la fiabilité de Daniel dans l’exercice de sa charge sans donner au terme une coloration exclusivement religieuse.
- source_word: שָׁלוּ
  choice: négligence
  rationale: Désigne ici une défaillance, une erreur ou un manquement dans l’exercice d’une fonction.
- source_word: הִשְׁתְּכַחַת עֲלֹוהִי
  choice: être trouvée contre lui
  rationale: Conserve l’orientation quasi judiciaire de la préposition dans ce contexte de recherche d’un grief.
theological_decisions:
- issue: Nature de la fidélité de Daniel
  choice: digne de confiance
  alternative: fidèle ; fiable
  rationale: Le contexte porte directement sur l’intégrité et la fiabilité de Daniel dans sa charge publique. Cette formulation préserve le poids moral du terme sans en faire explicitement une affirmation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le cadre administratif et la répétition rhétorique de l’absence de motif d’accusation ou de corruption.
