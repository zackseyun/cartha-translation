  text: שְׁפַר֙ קֳדָ֣ם דָּרְיָ֔וֶשׁ וַ/הֲקִים֙ עַל מַלְכוּתָ֔/א לַ/אֲחַשְׁדַּרְפְּנַיָּ֖/א מְאָ֣ה וְ/עֶשְׂרִ֑ין דִּ֥י לֶהֱוֺ֖ן בְּ/כָל מַלְכוּתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/002.yaml
  text: It seemed good to Darius to appoint over the kingdom one hundred and twenty satraps[a], who would be throughout the whole kingdom.
translation:
  language: fr
  text: Darius jugea bon d’établir sur le royaume cent vingt satrapes[a], répartis dans tout le royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gouverneurs de province »; les satrapes étaient de hauts fonctionnaires de l’administration perse.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַר קֳדָם דָּרְיָוֶשׁ
  choice: Darius jugea bon
  rationale: Cette tournure naturelle rend l’idiome araméen selon lequel une décision parut bonne à Darius, sans accentuer indûment son émotion.
- source_word: וַהֲקִים
  choice: d’établir
  rationale: Dans ce contexte administratif, le verbe désigne l’installation de responsables dans leur fonction. « Établir » conserve une tonalité digne et courante.
- source_word: עַל מַלְכוּתָא
  choice: sur le royaume
  rationale: La préposition marque ici l’autorité ou la compétence administrative exercée à l’échelle du royaume.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: satrapes
  rationale: Terme français consacré et historiquement précis pour ces hauts fonctionnaires de l’administration perse; une formulation explicative est donnée en note.
- source_word: מְאָה וְעֶשְׂרִין
  choice: cent vingt
  rationale: Restitution directe du nombre cardinal en toutes lettres dans le corps du texte.
- source_word: דִּי לֶהֱוֺן בְּכָל מַלְכוּתָא
  choice: répartis dans tout le royaume
  rationale: La proposition exprime la présence prévue de ces fonctionnaires à travers l’ensemble du territoire. « Répartis » explicite naturellement cette distribution administrative sans en modifier le sens.
