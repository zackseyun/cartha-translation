  text: אֱ֠דַיִן סָרְכַיָּ֤/א וַ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ אִלֵּ֔ן הַרְגִּ֖שׁוּ עַל מַלְכָּ֑/א וְ/כֵן֙ אָמְרִ֣ין לֵ֔/הּ דָּרְיָ֥וֶשׁ מַלְכָּ֖/א לְ/עָלְמִ֥ין חֱיִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/007.yaml
  text: 'Then these high officials and satraps came before the king and said this to him: “King Darius[b][a], live forever!”'
translation:
  language: fr
  text: 'Alors ces hauts fonctionnaires et ces satrapes se présentèrent ensemble devant le roi[a] et lui dirent : « Roi Darius, vis éternellement ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « se rassemblèrent devant le roi », « se rendirent d’un commun accord auprès du roi » ou « se précipitèrent en foule auprès du roi ». L’expression araméenne souligne une démarche collective et coordonnée ; dans ce contexte, elle peut aussi suggérer une intention concertée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « vis pour des âges ». Il s’agit d’une acclamation conventionnelle adressée au roi, et non de l’affirmation qu’il serait immortel.'
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe temporel qui marque la suite du récit ; « Alors » est naturel en français narratif moderne.
- source_word: סָרְכַיָּא
  choice: hauts fonctionnaires
  rationale: Titre administratif araméen désignant de hauts responsables impériaux ; cette formulation indique clairement leur rang sans employer un terme institutionnel anachronique.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: satrapes
  rationale: Terme historique français reconnu pour les gouverneurs ou administrateurs provinciaux de l’Empire perse.
- source_word: אִלֵּן
  choice: ces
  rationale: Démonstratif renvoyant aux responsables qui viennent d’être mentionnés.
- source_word: הַרְגִּשׁוּ עַל
  choice: se présentèrent ensemble devant
  rationale: L’expression décrit une démarche collective et coordonnée auprès du roi. « Ensemble » en conserve la dimension collective sans imposer dans le texte principal l’idée plus forte d’agitation ou de complot.
- source_word: מַלְכָּא
  choice: le roi / Roi
  rationale: Le premier emploi désigne le souverain dans le récit ; le second est un titre employé pour s’adresser directement à lui.
- source_word: וְכֵן אָמְרִין לֵהּ
  choice: et lui dirent
  rationale: Rendu idiomatique en français de la formule qui introduit leurs paroles, sans reproduire lourdement « et ainsi ils lui disaient ».
- source_word: דָּרְיָוֶשׁ
  choice: Darius
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: לְעָלְמִין חֱיִי
  choice: vis éternellement
  rationale: Formule d’acclamation conventionnelle à la cour, rendue par une expression française concise qui conserve la forme directe de l’araméen.
