  register: Français international moderne, naturel et digne. Le vocabulaire administratif reste accessible, tandis que « satrapes » préserve le cadre historique perse. La formulation conserve l’ambiguïté de la démarche collective dans une note plutôt que d’attribuer explicitement aux responsables une agitation ou une intention conspiratrice.
