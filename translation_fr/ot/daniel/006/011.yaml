source:
  edition: WLC
  text: וְ֠/דָנִיֵּאל כְּ/דִ֨י יְדַ֜ע דִּֽי רְשִׁ֤ים כְּתָבָ/א֙ עַ֣ל לְ/בַיְתֵ֔/הּ וְ/כַוִּ֨ין פְּתִיחָ֥ן לֵ/הּ֙ בְּ/עִלִּיתֵ֔/הּ נֶ֖גֶד יְרוּשְׁלֶ֑ם וְ/זִמְנִין֩ תְּלָתָ֨ה בְ/יוֹמָ֜/א ה֣וּא בָּרֵ֣ךְ עַל בִּרְכ֗וֹ/הִי וּ/מְצַלֵּ֤א וּ/מוֹדֵא֙ קֳדָ֣ם אֱלָהֵ֔/הּ כָּ/ל קֳבֵל֙ דִּֽי הֲוָ֣א עָבֵ֔ד מִן קַדְמַ֖ת דְּנָֽה־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/011.yaml
  text: And when Daniel knew that the document had been signed[a], he went to his house. Now the windows in his upper room were open toward Jerusalem, and three times a day he knelt on his knees and prayed and gave thanks before his God[c][b], just as he had been doing before this.
translation:
  language: fr
  text: Lorsque Daniel sut que le document avait été signé[a], il entra dans sa maison. Les fenêtres de sa chambre haute étaient ouvertes en direction de Jérusalem[b]. Trois fois par jour, il s’agenouillait[c], priait et rendait grâce devant son Dieu, comme il le faisait auparavant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que l’écrit avait été signé »; l’araméen évoque un décret mis par écrit et officiellement validé.
    reason: lexical_alternative
  - marker: b
    text: Ou « face à Jérusalem ».
    reason: lexical_alternative
  - marker: c
    text: L’araméen emploie littéralement le verbe « bénir » avec l’expression « sur ses genoux »; dans ce contexte, l’expression décrit sa posture agenouillée de prière.
    reason: cultural_note
lexical_decisions:
- source_word: כְּדִי יְדַע
  choice: Lorsque Daniel sut
  rationale: La tournure introduit la circonstance temporelle sans préciser une immédiateté que l’araméen n’impose pas.
- source_word: רְשִׁים כְּתָבָא
  choice: le document avait été signé
  rationale: L’expression désigne un écrit officiel formellement validé; « document » et « signé » rendent clairement ce contexte administratif.
- source_word: עַל לְבַיְתֵהּ
  choice: il rentra chez lui
  rationale: Dans la séquence narrative, l’expression indique que Daniel se rend à sa maison; « rentra chez lui » est naturel en français.
- source_word: כַוִּין פְּתִיחָן
  choice: Les fenêtres […] étaient ouvertes
  rationale: Le texte décrit l’état des ouvertures sans affirmer que Daniel venait de les ouvrir.
- source_word: עִלִּיתֵהּ
  choice: sa chambre haute
  rationale: Le terme désigne une pièce située dans la partie supérieure de la maison; « chambre haute » reste précis et compréhensible.
- source_word: נֶגֶד יְרוּשְׁלֶם
  choice: en direction de Jérusalem
  rationale: Cette formulation conserve l’idée d’orientation sans surinterpréter la disposition exacte des fenêtres.
- source_word: זִמְנִין תְּלָתָה בְיוֹמָא
  choice: Trois fois par jour
  rationale: Équivalent français idiomatique et exact de l’expression temporelle.
- source_word: בָּרֵךְ עַל בִּרְכֹוהִי
  choice: il se mettait à genoux
  rationale: Avec la mention des genoux, le verbe décrit ici la posture consistant à s’agenouiller; la formulation française évite une répétition maladroite.
- source_word: מְצַלֵּא וּמוֹדֵא
  choice: priait et rendait grâce
  rationale: Les deux verbes expriment respectivement la prière et l’action de grâce; l’imparfait fait ressortir la pratique habituelle.
- source_word: קֳדָם אֱלָהֵהּ
  choice: devant son Dieu
  rationale: La traduction conserve la relation spatiale ou relationnelle exprimée par l’araméen au lieu de la remplacer par le seul complément « à son Dieu ».
- source_word: כָּל קֳבֵל דִּי הֲוָא עָבֵד מִן קַדְמַת דְּנָה
  choice: tout comme il le faisait auparavant
  rationale: Cette tournure souligne la continuité de l’habitude de Daniel avant la promulgation du document.
theological_decisions:
- issue: La pratique de prière de Daniel sous le décret royal
  choice: 'Décrire sobrement la poursuite de sa pratique habituelle: il s’agenouille, prie et rend grâce.'
  alternative: Présenter explicitement son geste comme un acte de défi envers le décret royal.
  rationale: Le verset met l’accent sur la continuité fidèle de sa conduite sans qualifier explicitement celle-ci de protestation politique.
- issue: L’orientation vers Jérusalem
  choice: Conserver la donnée concrète selon laquelle les fenêtres étaient orientées vers Jérusalem.
  alternative: Expliquer dans le texte principal la portée cultuelle ou théologique de cette orientation.
  rationale: Le verset fournit l’orientation sans en développer lui-même le sens; la traduction n’ajoute donc pas d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait rend la pratique régulière de Daniel, tandis que le passé simple fait avancer le récit. Les formulations évitent aussi bien l’archaïsme que l’ajout d’une interprétation confessionnelle.
