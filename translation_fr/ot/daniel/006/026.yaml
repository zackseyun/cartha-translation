  text: בֵּ/אדַ֜יִן דָּרְיָ֣וֶשׁ מַלְכָּ֗/א כְּ֠תַב לְֽ/כָל עַֽמְמַיָּ֞/א אֻמַיָּ֧/א וְ/לִשָּׁנַיָּ֛/א דִּֽי דארין בְּ/כָל אַרְעָ֖/א שְׁלָמְ/כ֥וֹן יִשְׂגֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/026.yaml
  text: 'Then King Darius wrote to all the peoples[a], nations[b], and languages that dwell in all the earth: “May your peace abound.”'
translation:
  language: fr
  text: 'Alors le roi Darius écrivit à tous les peuples, à toutes les nations et aux gens de toutes langues qui habitent sur toute la terre[a] : « Que votre paix soit multipliée[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sur toute la terre » reprend la formulation araméenne ; dans ce contexte, elle désigne toute l’étendue du domaine impérial de Darius.
    reason: cultural_note
  - marker: b
    text: Ou « Que votre paix soit abondante ! »
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Ce marqueur narratif araméen introduit l’événement suivant. « Alors » restitue naturellement la progression du récit.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: le roi Darius
  rationale: L’ordre titre-nom est idiomatique en français et conserve pleinement le sens de l’expression araméenne.
- source_word: כְּתַב
  choice: écrivit
  rationale: Le verbe désigne simplement l’acte d’écrire. Le rendre par « publia un décret » préciserait plus que ne le fait le texte source.
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: à tous les peuples, à toutes les nations et aux gens de toutes langues
  rationale: La triade impériale est conservée, tandis que « aux gens de toutes langues » rend intelligible en français la métonymie araméenne littérale « aux langues ».
- source_word: דִּי דארין
  choice: qui habitent
  rationale: Cette proposition relative restitue simplement le participe araméen, dans un registre actuel et digne.
- source_word: בְּכָל אַרְעָא
  choice: sur toute la terre
  rationale: אַרְעָא peut désigner la terre ou un territoire. La formulation universelle de la proclamation est conservée sans la réduire dans le texte à l’empire de Darius.
- source_word: שְׁלָמְכוֹן
  choice: votre paix
  rationale: Le nom couvre les idées de paix, de bien-être et de prospérité. « Votre paix » maintient le possessif explicite et la forme de bénédiction.
- source_word: יִשְׂגֵּא
  choice: soit grande
  rationale: Le verbe signifie devenir grand ou s’accroître. « Que votre paix soit grande » est une formule française compréhensible et solennelle qui évite le tour moins naturel « que votre paix abonde ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne, avec une légère solennité adaptée à une proclamation royale. La formule impériale est rendue naturellement sans effacer sa portée rhétorique.
