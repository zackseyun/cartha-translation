  text: בֵּ֠/אדַיִן עֲנ֣וֹ וְ/אָמְרִין֮ קֳדָ֣ם מַלְכָּ/א֒ דִּ֣י דָנִיֵּ֡אל דִּי֩ מִן בְּנֵ֨י גָלוּתָ֜/א דִּ֣י יְה֗וּד לָא שָׂ֨ם עלי/ך מַלְכָּ/א֙ טְעֵ֔ם וְ/עַל אֱסָרָ֖/א דִּ֣י רְשַׁ֑מְתָּ וְ/זִמְנִ֤ין תְּלָתָה֙ בְּ/יוֹמָ֔/א בָּעֵ֖א בָּעוּתֵֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/014.yaml
  text: Then they answered and said before the king[a], “Daniel, who is one of the exiles from Judah, pays no attention to you, O king, or to the injunction that you have signed[c][b], but three times a day he makes his petition.”
translation:
  language: fr
  text: 'Alors ils répondirent et dirent devant le roi : « Daniel, qui est l’un des exilés de Juda, ne tient compte ni de toi, ô roi,[a] ni de l’interdiction que tu as signée[b] ; mais, trois fois par jour, il présente sa requête.[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne montre aucune considération pour toi ». L’expression araméenne parle littéralement du fait de ne pas porter son attention ou sa considération sur le roi.
    reason: lexical_alternative
  - marker: b
    text: Ou « du décret » ou « de la défense ». Le terme désigne ici une prohibition juridiquement contraignante.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « il cherche sa requête ». L’expression signifie qu’il continue à présenter sa demande dans la prière. Le destinataire n’est pas nommé dans cette proposition, bien que le contexte indique qu’il s’agit du Dieu de Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression du récit de manière naturelle en français moderne.
- source_word: עֲנוֹ וְאָמְרִין
  choice: ils répondirent et dirent
  rationale: Conserve la formule sémitique à deux verbes au lieu de la réduire à un seul.
- source_word: קֳדָם מַלְכָּא
  choice: devant le roi
  rationale: Préserve l’idée de parler en présence du roi et le cadre formel de la cour.
- source_word: דִּי מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: qui est l’un des déportés de Juda
  rationale: Rend idiomatiquement l’appartenance à la communauté déportée tout en conservant la désignation accusatrice liée à l’origine de Daniel.
- source_word: לָא שָׂם עֲלַיִךְ ... טְעֵם
  choice: ne tient compte ni de toi
  rationale: Restitue en français courant l’idiome araméen qui signifie ne pas accorder d’attention ou de considération à quelqu’un.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Maintient le vocatif explicite et la pression rhétorique exercée dans le cadre de la cour.
- source_word: וְעַל אֱסָרָא דִּי רְשַׁמְתָּ
  choice: ni de l’interdiction que tu as signée
  rationale: « Interdiction » exprime la prohibition juridiquement contraignante ; « signée » correspond au contexte d’un acte écrit officiellement promulgué.
- source_word: וְזִמְנִין תְּלָתָה בְּיוֹמָא
  choice: trois fois par jour
  rationale: Équivalent français naturel de l’expression temporelle indiquant une action quotidienne répétée.
- source_word: בָּעֵא בָּעוּתֵהּ
  choice: il présente sa requête
  rationale: Rend la combinaison verbe-nom comme un acte continu de supplication sans ajouter dans le texte le destinataire, qui n’est pas nommé dans cette proposition.
theological_decisions:
- issue: Faut-il expliciter que la requête de Daniel est adressée à Dieu ?
  choice: 'Laisser le destinataire implicite : « il présente sa requête »'
  alternative: « il prie son Dieu » ou « il présente sa requête à Dieu »
  rationale: La proposition araméenne ne nomme pas explicitement le destinataire, même si le contexte l’identifie clairement. La traduction conserve cette formulation sans résoudre par ajout ce que le verset laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère formel de l’accusation devant la cour, ainsi que le vocatif « ô roi », sans archaïsmes inutiles.
