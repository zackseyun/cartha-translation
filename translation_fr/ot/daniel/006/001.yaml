id: DAN.6.1
reference: Daniel 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/דָרְיָ֨וֶשׁ֙ מָֽדָיָ֔/א קַבֵּ֖ל מַלְכוּתָ֑/א כְּ/בַ֥ר שְׁנִ֖ין שִׁתִּ֥ין וְ/תַרְתֵּֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/001.yaml
  text: And Darius the Mede received the kingdom[a], being about sixty-two years old.
translation:
  language: fr
  text: Et Darius le Mède reçut le royaume[a], alors qu’il avait environ soixante-deux ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prit possession du royaume ». Le verbe araméen a un sens assez large, mais « reçut » reflète de plus près la formulation du texte sans suggérer un mode précis d’accession au pouvoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָרְיָוֶשׁ
  choice: Et Darius
  rationale: La conjonction וְ est rendue simplement par « Et », ce qui conserve le lien narratif sans préciser davantage sa valeur discursive. Le nom propre est transcrit sous sa forme française usuelle.
- source_word: מָדָיָא
  choice: le Mède
  rationale: Le gentilé identifie Darius par son origine ethnique ou nationale. « Le Mède » est la formulation française traditionnelle et naturelle.
- source_word: קַבֵּל
  choice: reçut
  rationale: Le verbe araméen signifie couramment « recevoir ». Ce choix reste proche du texte et n’affirme pas que Darius se serait emparé du pouvoir par un mécanisme particulier.
- source_word: מַלְכוּתָא
  choice: le royaume
  rationale: « Royaume » rend naturellement ici le domaine ou pouvoir royal, tout en conservant la formulation concrète du texte.
- source_word: כְּבַר שְׁנִין
  choice: alors qu’il avait environ … ans
  rationale: La formule d’âge, littéralement construite avec l’idée de « fils de », est rendue par une expression française idiomatique. « Environ » préserve l’approximation indiquée par כְּ.
- source_word: שִׁתִּין וְתַרְתֵּין
  choice: soixante-deux
  rationale: Les nombres araméens, littéralement « soixante et deux », sont rendus selon l’usage courant du français moderne.
theological_decisions:
- issue: Nature de l’accession de Darius
  choice: reçut le royaume
  alternative: prit le royaume
  rationale: « Reçut » suit le sens courant du verbe araméen et laisse ouverte la manière dont Darius accéda au pouvoir, sans trancher entre conquête, transmission ou nomination.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien narratif initial et emploie une formule d’âge idiomatique sans perdre l’approximation du texte araméen.
