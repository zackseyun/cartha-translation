source:
  edition: WLC
  text: אִתְיָעַ֜טוּ כֹּ֣ל סָרְכֵ֣י מַלְכוּתָ֗/א סִגְנַיָּ֤/א וַֽ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ הַדָּֽבְרַיָּ֣/א וּ/פַחֲוָתָ֔/א לְ/קַיָּמָ֤ה קְיָם֙ מַלְכָּ֔/א וּ/לְ/תַקָּפָ֖ה אֱסָ֑ר דִּ֣י כָל דִּֽי יִבְעֵ֣ה בָ֠עוּ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/גֹ֖ב אַרְיָוָתָֽ/א׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/008.yaml
  text: 'All the high officials of the kingdom[a], the prefects and satraps, the counselors and governors, have agreed together to establish a royal statute and to enforce an injunction: that whoever makes a petition to any god or man for thirty days, except to you, O king[c][b], shall be thrown into the lions’ den.'
translation:
  language: fr
  text: 'Tous les hauts fonctionnaires du royaume, les préfets et les satrapes, les conseillers et les gouverneurs, se sont concertés[a] pour établir un décret royal[b] et rendre contraignante une interdiction : pendant trente jours, quiconque adressera une requête à quelque dieu ou être humain que ce soit, si ce n’est à toi, ô roi, sera jeté dans la fosse aux lions.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont mis d’accord ». Le verbe peut mettre l’accent aussi bien sur la délibération commune que sur l’accord qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: Ou « une loi royale ». Les termes juridiques araméens employés ici recouvrent les notions de décret, de statut et d’interdiction contraignante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִתְיָעַטוּ
  choice: se sont concertés
  rationale: La forme réciproque exprime une délibération commune, possiblement une collusion. « Se sont concertés » conserve cette nuance sans affirmer plus explicitement un accord unanime.
- source_word: סָרְכֵי מַלְכוּתָא
  choice: les hauts fonctionnaires du royaume
  rationale: Expression générique désignant les principaux responsables royaux; ce rendu est clair, moderne et distinct des titres qui suivent.
- source_word: סִגְנַיָּא
  choice: les préfets
  rationale: « Préfets » conserve un titre administratif historique sans recourir à une périphrase.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: les satrapes
  rationale: Terme historique français établi pour les gouverneurs provinciaux de l’Empire perse.
- source_word: הַדָּבְרַיָּא
  choice: les conseillers
  rationale: Le terme désigne vraisemblablement des conseillers royaux; le français est naturel et fonctionnel.
- source_word: פַחֲוָתָא
  choice: les gouverneurs
  rationale: Équivalent direct et intelligible de cette charge gouvernementale.
- source_word: לְקַיָּמָה קְיָם מַלְכָּא
  choice: pour établir un décret royal
  rationale: Le couple verbal et nominal exprime la mise en vigueur ferme d’une disposition royale. « Décret » convient au contexte juridique, bien que « statut » soit possible.
- source_word: וּלְתַקָּפָה אֱסָר
  choice: et rendre contraignante une interdiction
  rationale: Le syntagme indique qu’une prohibition doit recevoir force obligatoire. Ce rendu distingue l’interdiction du décret qui l’établit.
- source_word: יִבְעֵה בָעוּ
  choice: adressera une requête
  rationale: L’expression redoublée désigne l’action de présenter une demande. « Requête » préserve le ton officiel sans réduire le sens à la seule prière religieuse.
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: à quelque dieu ou être humain que ce soit
  rationale: L’araméen emploie littéralement « de », indiquant la source auprès de laquelle la demande est recherchée. Avec « adresser une requête », le français idiomatique exige « à ». « Être humain » rend אֱנָשׁ sans masculin générique ambigu.
- source_word: עַד יוֹמִין תְּלָתִין
  choice: pendant trente jours
  rationale: La locution marque ici la durée d’application de l’interdiction.
- source_word: לָהֵן מִנָּךְ
  choice: excepté à toi
  rationale: Formulation concise de l’unique exception, avec maintien du complément requis par « adresser ».
- source_word: יִתְרְמֵא לְגֹב אַרְיָוָתָא
  choice: sera jeté dans la fosse aux lions
  rationale: Rendu direct de la sanction, en conservant le passif du texte araméen.
