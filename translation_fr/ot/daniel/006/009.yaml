  text: כְּעַ֣ן מַלְכָּ֔/א תְּקִ֥ים אֱסָרָ֖/א וְ/תִרְשֻׁ֣ם כְּתָבָ֑/א דִּ֣י לָ֧א לְ/הַשְׁנָיָ֛ה כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/009.yaml
  text: Now[a], O king, establish the injunction and sign the document so that it cannot be changed, according to the law of the Medes and Persians[b], which cannot be revoked.
translation:
  language: fr
  text: Maintenant, ô roi, confirme l’interdit et signe le document[a], afin qu’il ne puisse être modifié[b], conformément à la loi des Mèdes et des Perses, qui ne peut être abrogée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mets le document par écrit » ou « enregistre le document ». Le verbe araméen peut désigner la rédaction ou l’inscription officielle; dans ce contexte, la signature royale est probablement visée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de manière qu’on ne puisse pas le changer ». L’araméen souligne le caractère inaltérable de l’écrit.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « qui ne passe pas », expression indiquant qu’une loi ne peut être annulée.'
    reason: idiom
lexical_decisions:
- source_word: כְּעַן
  choice: Maintenant
  rationale: Adverbe de discours qui donne à la demande un caractère immédiat, sans lui imposer une valeur logique plus forte comme « donc ».
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Le nom est employé comme vocatif dans une adresse solennelle à la cour.
- source_word: תְּקִים
  choice: confirme
  rationale: Le verbe signifie établir ou rendre ferme. Dans ce contexte juridique, « confirme » exprime l’acte royal qui donne force à l’interdit.
- source_word: אֱסָרָא
  choice: l’interdit
  rationale: Le terme désigne ici une mesure contraignante qui prohibe un comportement; « interdit » est plus précis que le terme général « décret ».
- source_word: וְתִרְשֻׁם
  choice: et signe
  rationale: Le verbe renvoie à la mise par écrit ou à l’enregistrement officiel. Avec le document royal, « signe » rend naturellement l’autorisation formelle, tout en signalant l’alternative en note.
- source_word: כְּתָבָא
  choice: le document
  rationale: Il s’agit d’un écrit juridique officiel; « document » conserve cette valeur dans un français moderne.
- source_word: דִּי לָא לְהַשְׁנָיָה
  choice: afin qu’il ne puisse être modifié
  rationale: 'La tournure exprime le but recherché: rendre l’écrit juridiquement inaltérable.'
- source_word: כְּדָת
  choice: conformément à la loi
  rationale: Le terme désigne une loi, une règle ou un statut; cette formulation convient au registre juridique du passage.
- source_word: מָדַי וּפָרַס
  choice: des Mèdes et des Perses
  rationale: La formulation désigne les peuples ou royaumes dont la tradition juridique est invoquée.
- source_word: דִּי לָא תֶעְדֵּא
  choice: qui ne peut être abrogée
  rationale: L’expression signifie littéralement que la loi « ne passe pas »; « ne peut être abrogée » en rend l’idiome juridique.
