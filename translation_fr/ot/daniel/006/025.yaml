source:
  edition: WLC
  text: וַ/אֲמַ֣ר מַלְכָּ֗/א וְ/הַיְתִ֞יו גֻּבְרַיָּ֤/א אִלֵּךְ֙ דִּֽי אֲכַ֤לוּ קַרְצ֨וֹ/הִי֙ דִּ֣י דָֽנִיֵּ֔אל וּ/לְ/גֹ֤ב אַרְיָוָתָ/א֙ רְמ֔וֹ אִנּ֖וּן בְּנֵי/ה֣וֹן וּ/נְשֵׁי/ה֑וֹן וְ/לָֽא מְט֞וֹ לְ/אַרְעִ֣ית גֻּבָּ֗/א עַ֠ד דִּֽי שְׁלִ֤טֽוּ בְ/הוֹן֙ אַרְיָ֣וָתָ֔/א וְ/כָל גַּרְמֵי/ה֖וֹן הַדִּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/025.yaml
  text: Then the king commanded[a], and those men who had maliciously accused Daniel were brought and thrown into the lions’ den—they, their sons, and their wives. And before they reached the bottom of the den, the lions overpowered them and crushed all their bones.
translation:
  language: fr
  text: Alors le roi donna l’ordre de faire venir ces hommes qui avaient accusé Daniel avec malveillance[a]. On les jeta dans la fosse aux lions, eux, leurs fils et leurs femmes. Avant même qu’ils aient atteint le fond de la fosse, les lions se rendirent maîtres d’eux et leur broyèrent tous les os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expression araméenne signifiant littéralement « avaient mangé ses morceaux » ; elle désigne ici le fait d’accuser avec malveillance ou de calomnier Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר
  choice: Alors le roi donna l’ordre
  rationale: Le verbe signifie littéralement « dire », mais, dans ce contexte royal suivi de l’exécution immédiate de la décision, il exprime un ordre. « Alors » rend la progression narrative.
- source_word: וְהַיְתִיו
  choice: de faire venir
  rationale: La forme causative indique que les hommes furent amenés sur ordre du roi. Cette tournure française conserve ce lien avec l’ordre royal sans alourdir la phrase.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: les hommes
  rationale: Le groupe est déterminé et renvoie aux accusateurs déjà identifiés dans le récit. En français, l’article défini suffit naturellement dans ce contexte.
- source_word: אֲכַלוּ קַרְצֹוהִי דִּי דָנִיֵּאל
  choice: avaient accusé Daniel avec malveillance
  rationale: L’expression araméenne idiomatique désigne une accusation hostile ou calomnieuse. La formulation retenue préserve à la fois la dimension accusatrice et l’intention malveillante.
- source_word: וּלְגֹב אַרְיָוָתָא רְמוֹ
  choice: On les jeta dans la fosse aux lions
  rationale: « Fosse aux lions » est l’expression française naturelle dans ce récit, tandis que « jeta » rend la violence de l’action judiciaire.
- source_word: אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן
  choice: eux, leurs fils et leurs femmes
  rationale: La formulation conserve l’insistance du pronom ainsi que la mention précise des fils et des épouses, sans généraliser « fils » en « enfants ».
- source_word: וְלָא מְטוֹ לְאַרְעִית גֻּבָּא עַד דִּי
  choice: Avant même qu’ils aient atteint le fond de la fosse
  rationale: La construction négative et temporelle indique que l’attaque eut lieu avant qu’ils ne touchent le fond. « Même » souligne naturellement cette antériorité immédiate sans ajouter d’idée étrangère.
- source_word: שְׁלִטוּ בְהוֹן אַרְיָוָתָא
  choice: les lions se rendirent maîtres d’eux
  rationale: Cette expression rend directement l’idée de domination ou de maîtrise portée par le verbe, tout en conservant sa force narrative.
- source_word: וְכָל גַּרְמֵיהוֹן הַדִּקוּ
  choice: leur broyèrent tous les os
  rationale: « Broyèrent » communique la violence et le caractère total de l’action; « tous les os » préserve l’exhaustivité du texte.
theological_decisions:
- issue: Châtiment collectif des familles des accusateurs
  choice: Conserver explicitement « eux, leurs fils et leurs femmes » sans commentaire moral.
  alternative: Employer « leurs enfants », omettre les membres des familles ou atténuer leur sort.
  rationale: Le texte mentionne expressément les fils et les femmes parmi les victimes de l’ordre royal. La traduction doit préserver la dureté et la tension morale du récit sans les justifier ni les condamner par une addition interprétative.
translation_notes:
  register: Français international moderne, courant et digne. Le rythme narratif est maintenu par des phrases claires; le vocabulaire reste concret et énergique sans archaïsme. Le marqueur de note est placé après l’expression qu’il explique.
