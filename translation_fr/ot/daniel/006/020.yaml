source:
  edition: WLC
  text: בֵּ/אדַ֣יִן מַלְכָּ֔/א בִּ/שְׁפַּרְפָּרָ֖/א יְק֣וּם בְּ/נָגְהָ֑/א וּ/בְ/הִ֨תְבְּהָלָ֔ה לְ/גֻבָּ֥/א דִֽי אַרְיָוָתָ֖/א אֲזַֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/020.yaml
  text: Then the king arose at dawn[a], at first light[b], and in haste went to the den of the lions.
translation:
  language: fr
  text: Alors le roi se leva dès l’aube[a], aux premières lueurs du jour, et se rendit en toute hâte[b] à la fosse aux lions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au point du jour… quand la lumière parut ». Le verset emploie deux expressions proches désignant l’aube, ce qui crée une insistance.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi évoquer l’agitation, l’alarme ou une urgence anxieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression du récit de façon naturelle en français.
- source_word: מַלְכָּא
  choice: le roi
  rationale: Reflète la forme emphatique définie et le personnage déjà connu.
- source_word: בִּשְׁפַּרְפָּרָא
  choice: dès l’aube
  rationale: Désigne le point du jour; « dès » souligne la promptitude du roi sans confondre cette expression avec la suivante.
- source_word: יְקוּם
  choice: se leva
  rationale: Rend directement l’action de se lever dans un registre narratif courant et digne.
- source_word: בְּנָגְהָא
  choice: aux premières lueurs du jour
  rationale: Conserve la seconde expression liée à la lumière naissante et l’effet d’insistance du texte araméen.
- source_word: וּבְהִתְבְּהָלָה
  choice: en toute hâte
  rationale: Exprime la rapidité pressante tout en laissant à la note la nuance possible d’agitation ou d’alarme.
- source_word: לְגֻבָּא
  choice: à la fosse
  rationale: Dans ce contexte, il s’agit de l’enclos ou de la fosse où sont gardés les lions; « fosse aux lions » est naturel et précis en français.
- source_word: דִי
  choice: aux
  rationale: La relation entre la fosse et les lions se rend naturellement par l’expression française consacrée « fosse aux lions ».
- source_word: אַרְיָוָתָא
  choice: lions
  rationale: Le contexte identifie clairement les lions; l’article contracté de « aux » porte la détermination.
- source_word: אֲזַל
  choice: se rendit
  rationale: Rend le mouvement vers une destination de manière idiomatique, sans ajouter de sens.
theological_decisions: []
