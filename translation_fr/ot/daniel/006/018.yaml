base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/018.yaml
  text: Then a stone was brought and placed over the mouth of the pit[a], and the king sealed it with his signet ring and with the signet rings of his nobles, so that nothing concerning Daniel might be changed.
translation:
  language: fr
  text: Puis on apporta une pierre et on la plaça sur l’ouverture de la fosse. Le roi scella l’ouverture avec son anneau sigillaire et avec ceux de ses hauts dignitaires, afin que rien de ce qui concernait Daniel ne puisse être changé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que la décision concernant Daniel ne puisse être modifiée ». Le mot araméen peut désigner une affaire, une intention ou une décision.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיתָיִת אֶבֶן חֲדָה
  choice: Puis on apporta une pierre
  rationale: Le passif araméen et la progression narrative sont rendus naturellement. חֲדָה signifie littéralement « une »; en français, l’article indéfini suffit ici sans insister artificiellement sur « une seule ».
- source_word: וְשֻׂמַת עַל פֻּם גֻּבָּא
  choice: et on la plaça sur l’ouverture de la fosse
  rationale: פֻּם signifie littéralement « bouche », mais « ouverture » exprime clairement et naturellement l’image appliquée à la fosse. « Fosse » reste proche de גֻּבָּא et convient au contexte.
- source_word: וְחַתְמַהּ מַלְכָּא
  choice: Le roi la scella
  rationale: Le pronom reprend naturellement la pierre; le verbe français « sceller » correspond directement à l’action d’apposer un sceau.
- source_word: בְּעִזְקְתֵהּ
  choice: de son anneau sigillaire
  rationale: עִזְקְתָא désigne une bague ou un anneau servant ici de sceau. « Anneau sigillaire » est précis, digne et compréhensible dans ce contexte ancien.
- source_word: וּבְעִזְקָת רַבְרְבָנוֹהִי
  choice: et de ceux de ses hauts dignitaires
  rationale: Le pronom « ceux » reprend les anneaux sigillaires sans lourde répétition. רַבְרְבָנִין désigne les grands du royaume ou hauts responsables; « hauts dignitaires » convient au cadre de cour.
- source_word: דִּי לָא תִשְׁנֵא צְבוּ בְּדָנִיֵּאל
  choice: afin que rien de ce qui concernait Daniel ne puisse être changé
  rationale: Cette formulation conserve l’étendue sémantique de צְבוּ, qui peut désigner l’affaire, la décision, l’intention ou la situation, sans imposer un sens unique.
