base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/028.yaml
  text: who rescues and delivers, and works signs and wonders in heaven and on earth—he who rescued Daniel from the power of the lions.
translation:
  language: fr
  text: lui qui sauve et délivre, qui accomplit des signes et des prodiges dans le ciel et sur la terre — lui qui a sauvé Daniel de la puissance des lions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשֵׁיזִב וּמַצִּל
  choice: sauve et délivre
  rationale: Conserve les deux participes araméens parallèles sans chercher à imposer entre eux une distinction plus précise que le contexte ne le permet.
- source_word: וְעָבֵד אָתִין וְתִמְהִין
  choice: qui accomplit des signes et des prodiges
  rationale: « Accomplir » rend naturellement עבד dans cette formule, tandis que « signes et prodiges » maintient le couple traditionnel et sa portée extraordinaire.
- source_word: בִּשְׁמַיָּא וּבְאַרְעָא
  choice: dans le ciel et sur la terre
  rationale: Rend directement la portée cosmique de l’expression araméenne dans un français idiomatique.
- source_word: מִן יַד אַרְיָוָתָא
  choice: de la puissance des lions
  rationale: Littéralement « de la main des lions » ; « puissance » communique ici l’idée d’emprise ou de pouvoir menaçant sans attribuer des mains aux lions.
theological_decisions:
- issue: Rapport entre l’action générale de Dieu et le sauvetage de Daniel
  choice: répétition emphatique « lui qui » après le tiret
  alternative: 'simple proposition relative coordonnée : « qui a sauvé Daniel »'
  rationale: L’araméen enchaîne avec דִּי, mais le français gagne en force rhétorique à reprendre « lui qui », en présentant le salut de Daniel comme l’exemple concret des affirmations précédentes, sans ajouter de doctrine.
translation_notes:
  register: Français moderne, digne et accessible. Le fragment conserve sa forme syntaxique dépendante du contexte précédent. Le tiret marque l’application emphatique au cas de Daniel.
