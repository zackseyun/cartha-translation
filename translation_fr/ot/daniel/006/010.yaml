  yaml_path: translation/ot/daniel/006/010.yaml
  text: Because of this[a], King Darius signed the document and the injunction.
translation:
  language: fr
  text: C’est pourquoi le roi Darius signa le document et l’interdiction[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « mit par écrit le document et l’interdit » ; le verbe peut désigner l’action d’écrire ou d’inscrire officiellement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: C’est pourquoi
  rationale: Cette locution araméenne marque la conséquence de ce qui précède. « C’est pourquoi » restitue naturellement ce lien logique en français.
- source_word: מַלְכָּא דָּרְיָוֶשׁ
  choice: le roi Darius
  rationale: L’ordre usuel du français conserve le titre royal et le nom propre.
- source_word: רְשַׁם
  choice: signa
  rationale: Le verbe signifie fondamentalement mettre par écrit ou inscrire. Dans ce contexte juridico-administratif, « signa » exprime naturellement l’acte royal qui donne force au texte, sans effacer l’alternative plus formelle signalée en note.
- source_word: כְּתָבָא
  choice: le document
  rationale: Le nom désigne un écrit ou document. « Document » convient au cadre juridique sans préciser indûment sa nature.
- source_word: וֶאֱסָרָא
  choice: et l’interdiction
  rationale: Le terme désigne une restriction contraignante. « Interdiction » est courant et clair en français moderne, tandis qu’« injonction » pourrait suggérer à tort un ordre positif plutôt qu’une prohibition.
