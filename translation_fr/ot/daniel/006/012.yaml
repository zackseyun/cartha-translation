revisions:
- from: Alors ces hommes arrivèrent ensemble[a] et trouvèrent Daniel en train d’adresser des requêtes et des supplications à son Dieu[b].
  to: Alors ces hommes vinrent d’un commun accord[a] et trouvèrent Daniel, qui présentait des requêtes et des supplications devant son Dieu[b].
  rationale: La révision remplace une expression française moins précise par un rendu qui explicite la concertation sans trancher la question d’une arrivée tumultueuse. Elle rétablit aussi « devant son Dieu », correspondant à קֳדָם, tout en préservant la distinction entre requêtes et supplications.
