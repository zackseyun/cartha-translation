source:
  edition: WLC
  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ הַרְגִּ֔שׁוּ וְ/הַשְׁכַּ֖חוּ לְ/דָנִיֵּ֑אל בָּעֵ֥א וּ/מִתְחַנַּ֖ן קֳדָ֥ם אֱלָהֵֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/012.yaml
  text: Then these men came by agreement and found Daniel petitioning and pleading before his God[a][b].
translation:
  language: fr
  text: Alors ces hommes vinrent d’un commun accord[a] et trouvèrent Daniel, qui présentait des requêtes et des supplications devant son Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se réunirent », ou peut-être « arrivèrent en tumulte ». Le verbe araméen suggère vraisemblablement que ces hommes agissent ensemble et de manière concertée; il peut aussi évoquer un rassemblement précipité ou tumultueux.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui priait et suppliait devant son Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe temporel qui fait progresser le récit; « Alors » est naturel et fidèle à la succession des événements.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: ces hommes
  rationale: Rend directement le nom pluriel accompagné du démonstratif et renvoie aux conspirateurs déjà mentionnés.
- source_word: הַרְגִּשׁוּ
  choice: arrivèrent ensemble
  rationale: Le verbe évoque un rassemblement concerté, peut-être précipité ou tumultueux. Cette formulation conserve l’idée d’une action collective sans rendre certaine sa nuance exacte.
- source_word: וְהַשְׁכַּחוּ
  choice: et trouvèrent
  rationale: Rendu narratif direct du verbe signifiant trouver ou découvrir.
- source_word: לְדָנִיֵּאל
  choice: Daniel
  rationale: Forme française traditionnelle du nom propre.
- source_word: בָּעֵא
  choice: en train d’adresser des requêtes
  rationale: Le participe décrit Daniel formulant des demandes; la construction progressive indique qu’ils le surprennent pendant l’action.
- source_word: וּמִתְחַנַּן
  choice: et des supplications
  rationale: Le terme exprime une imploration fervente visant faveur ou grâce, sans exiger qu’un objet comme « la faveur » soit ajouté au texte.
- source_word: קֳדָם
  choice: à
  rationale: Dans ce contexte de prière, le français idiomatique « adresser ... à son Dieu » transmet le rapport exprimé par « devant/en présence de ».
- source_word: אֱלָהֵהּ
  choice: son Dieu
  rationale: Le suffixe possessif masculin singulier est conservé explicitement.
theological_decisions:
- issue: Expression de la prière de Daniel sans ajout doctrinal ni objet implicite
  choice: adresser des requêtes et des supplications à son Dieu
  alternative: prier et supplier devant son Dieu
  rationale: Le choix distingue les deux participes araméens tout en évitant d’ajouter explicitement « pour obtenir faveur », objet qui n’est pas formulé dans le verset. La note conserve une traduction plus traditionnelle et plus formelle de קֳדָם.
translation_notes:
  register: Français international moderne, digne et accessible. « Arrivèrent ensemble » laisse perceptible la concertation des hommes sans imposer la nuance incertaine de tumulte. « Adresser des requêtes et des supplications » conserve les deux termes de la prière dans une formulation française naturelle.
