  text: מִן קֳדָמַ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י בְּ/כָל שָׁלְטָ֣ן מַלְכוּתִ֗/י לֶהֱוֺ֤ן זאעין וְ/דָ֣חֲלִ֔ין מִן קֳדָ֖ם אֱלָהֵ֣/הּ דִּי דָֽנִיֵּ֑אל דִּי ה֣וּא אֱלָהָ֣/א חַיָּ֗/א וְ/קַיָּם֙ לְ/עָ֣לְמִ֔ין וּ/מַלְכוּתֵ/הּ֙ דִּֽי לָ֣א תִתְחַבַּ֔ל וְ/שָׁלְטָנֵ֖/הּ עַד סוֹפָֽ/א־׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/027.yaml
  text: A decree is issued by me[a], that in all the dominion of my kingdom people are to tremble and fear before the God of Daniel, for he is the living God, enduring forever; and his kingdom will not be destroyed[c][b], and his dominion will be to the end.
translation:
  language: fr
  text: 'Je promulgue un décret : dans toute l’étendue de mon royaume, on doit trembler et craindre devant le Dieu de Daniel. Car il est le Dieu vivant et il demeure éternellement. Son royaume ne sera pas détruit, et sa domination durera jusqu’à la fin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa domination est jusqu’à la fin ». L’araméen ne comporte pas ici de verbe exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן קֳדָמַי שִׂים טְעֵם
  choice: Un ordre est donné de ma part
  rationale: La formule administrative araméenne signifie littéralement qu’un ordre est établi « de devant moi ». Cette formulation française conserve le ton officiel et l’autorité personnelle du roi sans calquer l’idiome.
- source_word: בְּכָל שָׁלְטָן מַלְכוּתִי
  choice: dans toute l’étendue de mon royaume
  rationale: שָׁלְטָן désigne ici la sphère sur laquelle s’exerce l’autorité royale. « Toute l’étendue » exprime naturellement que le décret vaut partout dans le royaume.
- source_word: לֶהֱוֺן זאעין וְדָחֲלִין
  choice: on doit trembler et éprouver de la crainte
  rationale: Le premier terme évoque le tremblement, le second la peur ou la crainte. La traduction maintient les deux éléments et leur intensité, tandis que « on doit » rend la force prescriptive du décret.
- source_word: אֱלָהָא חַיָּא
  choice: le Dieu vivant
  rationale: Cette expression présente le Dieu de Daniel comme vivant, dans une affirmation solennelle et définie.
- source_word: וְקַיָּם לְעָלְמִין
  choice: il subsiste éternellement
  rationale: קַיָּם exprime la permanence et la continuité. « Subsiste éternellement » rend ces deux nuances dans un français digne et intelligible.
- source_word: וּמַלְכוּתֵהּ דִּי לָא תִתְחַבַּל
  choice: Son royaume ne sera pas détruit
  rationale: Dans ce contexte, le verbe désigne la ruine ou la destruction. La formulation française transmet directement l’indestructibilité du royaume.
- source_word: וְשָׁלְטָנֵהּ עַד סוֹפָא
  choice: sa domination durera jusqu’à la fin
  rationale: 'L’araméen est elliptique : « sa domination jusqu’à la fin ». Le verbe « durera » explicite naturellement la durée sans préciser davantage ce que désigne « la fin ».'
theological_decisions:
- issue: Nature de la réaction exigée devant le Dieu de Daniel
  choice: trembler et éprouver de la crainte
  alternative: révérer et craindre
  rationale: Les deux participes araméens expriment une vive réaction de tremblement et de peur mêlée de respect. Le texte principal en conserve la force au lieu d’atténuer le premier terme en simple révérence.
- issue: Permanence de Dieu, de son royaume et de sa domination
  choice: il subsiste éternellement ; son royaume ne sera pas détruit ; sa domination durera jusqu’à la fin
  alternative: il demeure à jamais ; son royaume est indestructible ; sa domination est jusqu’à la fin
  rationale: La traduction garde les trois affirmations distinctes du texte et ne développe pas leur portée doctrinale au-delà de ce que dit le verset. L’expression « jusqu’à la fin » reste volontairement non précisée.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le tour administratif « Un ordre est donné de ma part » conserve la tonalité d’un décret royal. Les répétitions et l’intensité de l’araméen sont maintenues sans archaïsme.
