  naturalness: « Un ordre est donné de ma part » est compréhensible, mais reste assez calqué et peu idiomatique en français moderne. « Je promulgue un décret » rend avec plus de naturel la formule administrative tout en maintenant l’autorité royale. « Il demeure éternellement » est également plus courant et plus fluide que « il subsiste éternellement » dans cette affirmation solennelle.
  terminology: « Dieu vivant », « royaume » et « domination » sont appropriés et cohérents. « Trembler et craindre » préserve la force des deux participes araméens sans les réduire à la seule révérence. Le terme « décret » convient mieux que « ordre » au contexte d’une proclamation royale.
