  to: 'Je promulgue un décret : dans toute l’étendue de mon royaume, on doit trembler et craindre devant le Dieu de Daniel. Car il est le Dieu vivant et il demeure éternellement. Son royaume ne sera pas détruit, et sa domination durera jusqu’à la fin.[a]'
  rationale: Révision limitée à l’idiomaticité française. « Je promulgue un décret » transmet le caractère officiel et l’origine royale du décret sans reproduire une tournure araméenne de manière pesante. « Craindre » maintient le second verbe de la paire sans en atténuer la force, et « demeure éternellement » rend naturellement la permanence divine. La note est conservée, correctement ancrée, car elle signale l’ellipse verbale de la dernière proposition.
