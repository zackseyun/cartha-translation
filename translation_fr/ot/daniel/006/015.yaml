base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/015.yaml
  text: Then the king[a], when he heard the statement, was greatly distressed, and he set his mind on delivering Daniel; and until the going down of the sun he kept striving to rescue him.
translation:
  language: fr
  text: Alors le roi, lorsqu’il entendit cette déclaration, en fut profondément bouleversé[a]. Il résolut de délivrer Daniel et, jusqu’au coucher du soleil, il s’efforça de le sauver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut très mécontent de lui-même ». Littéralement, l’expression araméenne dit qu’il fut très troublé ou mécontent « contre lui-même »; elle peut exprimer un trouble intense, avec une possible nuance de reproche envers lui-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque la progression du récit de façon naturelle en français moderne.
- source_word: מַלְכָּא
  choice: le roi
  rationale: L’état emphatique et le contexte désignent un roi déjà identifié.
- source_word: כְּדִי ... שְׁמַע
  choice: lorsqu’il entendit
  rationale: La conjonction introduit ici une proposition temporelle.
- source_word: מִלְּתָא
  choice: ces paroles
  rationale: Le terme peut désigner une parole, une déclaration ou une affaire; « ces paroles » renvoie naturellement à la déclaration qui vient d’être prononcée.
- source_word: שַׂגִּיא בְּאֵשׁ עֲלוֹהִי
  choice: en fut profondément bouleversé
  rationale: Rend l’intense trouble intérieur exprimé par l’idiome araméen, tout en conservant en note sa possible nuance réflexive.
- source_word: שָׂם בָּל ... לְשֵׁיזָבוּתֵהּ
  choice: Il résolut de délivrer Daniel
  rationale: L’idiome « placer le cœur » exprime une détermination délibérée; « délivrer » convient au danger judiciaire immédiat.
- source_word: וְעַד מֶעָלֵי שִׁמְשָׁא
  choice: jusqu’au coucher du soleil
  rationale: Équivalent français usuel de l’expression araméenne désignant le déclin ou coucher du soleil.
- source_word: הֲוָא מִשְׁתַּדַּר
  choice: il s’efforça
  rationale: Exprime l’effort soutenu de la construction périphrastique; la limite temporelle « jusqu’au coucher du soleil » en indique la durée.
- source_word: לְהַצָּלוּתֵהּ
  choice: de le sauver
  rationale: Rend le second terme de délivrance sans répétition lourde, le pronom renvoyant clairement à Daniel.
