  text: אֱלָהִ֞/י שְׁלַ֣ח מַלְאֲכֵ֗/הּ וּֽ/סֲגַ֛ר פֻּ֥ם אַרְיָוָתָ֖/א וְ/לָ֣א חַבְּל֑וּ/נִי כָּ/ל קֳבֵ֗ל דִּ֤י קָֽדָמ֨וֹ/הִי֙ זָכוּ֙ הִשְׁתְּכַ֣חַת לִ֔/י וְ/אַ֤ף קדמי/ך מַלְכָּ֔/א חֲבוּלָ֖ה לָ֥א עַבְדֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/023.yaml
  text: My God sent his angel and shut the mouths of the lions[a], and they have not harmed me, because innocence was found in me before him; and also before you, O king[c][b], I have done no harm.
translation:
  language: fr
  text: Mon Dieu a envoyé son ange et a fermé les gueules des lions[a]. Ils ne m’ont fait aucun mal, parce qu’il a été reconnu que j’étais innocent devant lui. Devant toi aussi, ô roi, je n’ai commis aucun tort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son messager ». Le terme araméen peut désigner un messager ou un ange ; ici, le contexte miraculeux favorise « ange ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je n’ai rien fait de nuisible contre toi, ô roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהִי
  choice: Mon Dieu
  rationale: Rend directement le possessif araméen et l’identification personnelle de Dieu dans la confession de Daniel.
- source_word: שְׁלַח מַלְאֲכֵהּ
  choice: a envoyé son ange
  rationale: Le parfait exprime une action accomplie. מַלְאָךְ peut désigner un messager ou un ange; le contexte de délivrance miraculeuse favorise ici « ange ».
- source_word: וּסֲגַר פֻּם אַרְיָוָתָא
  choice: et a fermé la gueule des lions
  rationale: Le singulier collectif « gueule » suit de près la formulation araméenne tout en restant idiomatique en français.
- source_word: וְלָא חַבְּלוּנִי
  choice: Ils ne m’ont fait aucun mal
  rationale: Le verbe au pluriel renvoie aux lions; le passé composé exprime naturellement l’action passée et son résultat présent.
- source_word: כָּל־קֳבֵל דִּי
  choice: parce que
  rationale: Expression causale rendue dans un français moderne et clair.
- source_word: קָדָמוֹהִי זָכוּ הִשְׁתְּכַחַת לִי
  choice: j’ai été trouvé innocent devant lui
  rationale: Cette formulation française naturelle conserve l’image judiciaire de l’innocence constatée en présence de Dieu, sans prétendre à une perfection absolue.
- source_word: וְאַף קֳדָמָיךְ מַלְכָּא
  choice: Et devant toi non plus, ô roi
  rationale: Dans une proposition négative, « non plus » exprime naturellement l’ajout de la seconde sphère de justification. « Ô roi » maintient l’adresse directe et solennelle.
- source_word: חֲבוּלָה לָא עַבְדֵת
  choice: je n’ai commis aucun tort
  rationale: Rend le sens d’un acte nuisible ou fautif sans répéter exactement « faire du mal » employé pour les lions.
theological_decisions:
- issue: Identité de מַלְאֲכֵהּ dans le récit de la délivrance
  choice: son ange
  alternative: son messager
  rationale: Le terme peut lexicalement désigner un messager, mais l’intervention surnaturelle dans la fosse aux lions indique ici un envoyé céleste, sans permettre d’en préciser davantage l’identité.
- issue: Portée de l’innocence de Daniel
  choice: j’ai été trouvé innocent devant lui
  alternative: la pureté a été trouvée en moi devant lui
  rationale: Le contexte judiciaire porte sur l’innocence de Daniel dans l’affaire qui a conduit à sa condamnation; la traduction ne transforme pas cette affirmation en doctrine de perfection morale absolue.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde la progression de la confession de Daniel, de l’intervention divine à sa justification devant Dieu puis devant le roi. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
