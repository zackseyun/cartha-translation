    issue: Coordination de la seconde affirmation
    rationale: « Et devant toi non plus » est grammaticalement possible, mais « devant toi aussi » correspond plus directement à וְאַף (« et aussi / même ») et est plus clair avec la négation qui suit.
  - severity: low
    issue: Formulation de l’innocence constatée
    rationale: Le texte araméen présente l’innocence comme une qualité trouvée en Daniel. « Il a été reconnu que j’étais innocent » conserve la constatation judiciaire tout en étant plus idiomatique que « j’ai été trouvé innocent ».
  - severity: low
    issue: Nombre de « gueule »
    rationale: Bien que le singulier collectif soit défendable, le pluriel français représente plus nettement les lions multiples et leur empêchement individuel, sans modifier le sens.
