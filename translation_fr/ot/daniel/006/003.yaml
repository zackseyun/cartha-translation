  text: וְ/עֵ֤לָּא מִנְּ/הוֹן֙ סָרְכִ֣ין תְּלָתָ֔א דִּ֥י דָנִיֵּ֖אל חַֽד מִנְּ/ה֑וֹן דִּֽי לֶהֱוֺ֞ן אֲחַשְׁדַּרְפְּנַיָּ֣/א אִלֵּ֗ין יָהֲבִ֤ין לְ/הוֹן֙ טַעְמָ֔/א וּ/מַלְכָּ֖/א לָֽא לֶהֱוֵ֥א נָזִֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/003.yaml
  text: And over them were three high officials[a], of whom Daniel was one[b], so that these satraps might give account to them and the king might suffer no loss.
translation:
  language: fr
  text: Au-dessus d’eux, il y avait trois hauts fonctionnaires, dont Daniel était l’un, afin que ces satrapes leur rendent compte[a] et que le roi ne subisse aucune perte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur faire rapport » ; l’expression araméenne peut désigner le fait de rendre compte ou de présenter un rapport dans un cadre administratif.
    reason: lexical_alternative
  - marker: b
    text: Ou « que le roi ne subisse aucun dommage » ; dans ce contexte, il s’agit probablement d’une perte administrative ou financière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵלָּא מִנְּהוֹן
  choice: Au-dessus d’eux se trouvaient
  rationale: L’expression araméenne introduit un échelon administratif supérieur aux satrapes; cette formulation conserve clairement la hiérarchie.
- source_word: סָרְכִין תְּלָתָא
  choice: trois hauts fonctionnaires
  rationale: Le terme désigne des responsables de haut rang placés au-dessus des satrapes. « Hauts fonctionnaires » est naturel en français et évite l’anachronisme de « présidents ».
- source_word: דִּי דָנִיֵּאל חַד מִנְּהוֹן
  choice: dont Daniel était l’un d’eux
  rationale: La proposition identifie Daniel comme l’un des trois, sans ajouter de nuance absente du texte.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: satrapes
  rationale: « Satrapes » est le terme historique usuel pour ce titre administratif perse et préserve le cadre culturel.
- source_word: יָהֲבִין לְהוֹן טַעְמָא
  choice: leur rendre compte
  rationale: Dans ce contexte administratif, l’expression indique que les satrapes devaient répondre de leur gestion devant les trois responsables; elle peut aussi désigner la remise d’un rapport.
- source_word: וּמַלְכָּא לָא לֶהֱוֵא נָזִק
  choice: afin que le roi ne subisse aucune perte
  rationale: נזק désigne ici vraisemblablement un préjudice porté aux intérêts royaux, notamment financier ou administratif, plutôt qu’une atteinte physique.
