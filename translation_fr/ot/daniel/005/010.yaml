source:
  edition: WLC
  text: מַלְכְּתָ֕/א לָ/קֳבֵ֨ל מִלֵּ֤י מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי לְ/בֵ֥ית מִשְׁתְּיָ֖/א עללת עֲנָ֨ת מַלְכְּתָ֜/א וַ/אֲמֶ֗רֶת מַלְכָּ/א֙ לְ/עָלְמִ֣ין חֱיִ֔י אַֽל יְבַהֲלוּ/ךְ֙ רַעְיוֹנָ֔/ךְ וְ/זִיוָ֖י/ךְ אַל יִשְׁתַּנּֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/010.yaml
  text: Because of the words of the king and his nobles[a], the queen entered the banquet hall. The queen spoke and said, “O king, live forever! Do not let your thoughts terrify you[b], and do not let your face grow pale.”
translation:
  language: fr
  text: 'À cause des paroles du roi et de ses hauts dignitaires, la reine entra dans la salle du banquet. Elle prit la parole et dit : « Ô roi, vis pour toujours ! Que tes pensées ne t’épouvantent pas et que ton visage ne pâlisse pas.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que ton éclat ne change pas » ; l’expression évoque un changement visible de l’apparence du visage sous l’effet de la peur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקֳבֵל
  choice: À cause de
  rationale: 'La préposition indique ici naturellement la cause ou l’occasion de l’entrée de la reine : elle vient à la suite des paroles entendues.'
- source_word: מִלֵּי
  choice: paroles
  rationale: Le pluriel désigne ici les propos ou les exclamations du roi et de ses dignitaires.
- source_word: רַבְרְבָנוֹהִי
  choice: ses hauts dignitaires
  rationale: Le terme désigne les grands personnages et hauts responsables de la cour ; cette expression est claire en français moderne.
- source_word: לְבֵית מִשְׁתְּיָא
  choice: dans la salle du banquet
  rationale: Littéralement « maison du festin/de la boisson » ; « salle du banquet » restitue naturellement le lieu.
- source_word: עֲנָת ... וַאֲמֶרֶת
  choice: prit la parole et dit
  rationale: La formule araméenne peut signifier « répondit et dit », mais aucun interlocuteur ne vient de s’adresser directement à elle ; cette traduction conserve l’idée d’une prise de parole sans créer une réponse explicite.
- source_word: לְעָלְמִין חֱיִי
  choice: Ô roi, vis pour toujours !
  rationale: Formule d’hommage conventionnelle de la cour, rendue directement tout en conservant l’impératif araméen.
- source_word: רַעְיוֹנָךְ
  choice: tes pensées
  rationale: Le substantif désigne les pensées ou réflexions ; l’effroi est exprimé séparément par le verbe.
- source_word: יְבַהֲלוּךְ
  choice: ne t’épouvantent pas
  rationale: Le verbe exprime un trouble ou un effroi intense, conforme à la détresse visible du roi.
- source_word: זִיוָיךְ ... יִשְׁתַּנּוֹ
  choice: que ton visage ne pâlisse pas
  rationale: Littéralement, l’éclat ou l’apparence du roi ne doit pas changer. Dans le contexte, il s’agit d’un changement visible du visage sous l’effet de la peur ; « pâlir » rend naturellement l’idiome.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le cadre de cour est marqué par « hauts dignitaires » et par la formule solennelle « Ô roi, vis pour toujours ! ». La répétition araméenne « répondit et dit » est rendue idiomatiquement par « prit la parole et dit ».
