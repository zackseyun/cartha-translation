  text: 'Peres: your kingdom has been divided and given to the Medes and Persians[a].'
translation:
  language: fr
  text: 'Pérès : ton royaume a été divisé et donné aux Mèdes et aux Perses[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme araméen « Pérès » ressemble au verbe traduit par « divisé » et fait aussi écho au nom des Perses : l’interprétation de Daniel repose sur ce jeu de mots.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרֵס
  choice: Pérès
  rationale: Translittération du terme inscrit, puisque Daniel interprète ici le mot lui-même. Les accents facilitent une prononciation française proche de l’araméen et permettent de conserver le lien sonore avec le verbe et avec « Perses ».
- source_word: פְּרִיסַת
  choice: a été divisé
  rationale: Le verbe, issu de la même racine que פְּרֵס, exprime la division. Le passé composé présente ce jugement comme décidé et accompli.
- source_word: מַלְכוּתָךְ
  choice: ton royaume
  rationale: « Royaume » désigne naturellement le domaine soumis à l’autorité du roi, plutôt que la seule fonction royale.
- source_word: וִיהִיבַת
  choice: et donné
  rationale: Rend simplement la forme passive et le transfert du royaume à de nouveaux détenteurs.
- source_word: לְמָדַי
  choice: aux Mèdes
  rationale: Le nom est compris comme désignant le peuple des Mèdes, en parallèle avec les Perses.
- source_word: וּפָרָס
  choice: et aux Perses
  rationale: Le terme est rendu comme le nom du peuple coordonné aux Mèdes. « Perses » conserve en français une partie de l’écho sonore avec « Pérès ».
