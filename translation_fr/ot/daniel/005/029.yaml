base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/029.yaml
  text: Then Belshazzar gave the command[a], and they clothed Daniel with purple, put a chain of gold around his neck[b], and proclaimed concerning him that he should be the third ruler in the kingdom.
translation:
  language: fr
  text: Alors Belschatsar donna l’ordre, et l’on revêtit Daniel de pourpre, on lui mit une chaîne d’or autour du cou et l’on proclama à son sujet qu’il serait le troisième dirigeant du royaume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui occuperait le troisième rang dans le royaume ». L’expression indique le rang de Daniel dans l’exercice du pouvoir.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la succession narrative de manière naturelle en français moderne.
- source_word: אֲמַר בֵּלְשַׁאצַּר
  choice: Belschatsar donna l’ordre
  rationale: Le verbe signifie littéralement « dit », mais les actes exécutés aussitôt par d’autres montrent ici la valeur performative d’un ordre royal.
- source_word: וְהַלְבִּישׁוּ לְדָנִיֵּאל אַרְגְּוָנָא
  choice: l’on revêtit Daniel de pourpre
  rationale: La tournure conserve l’action de vêtir Daniel ainsi que la pourpre comme signe d’honneur royal, sans préciser indûment la forme exacte du vêtement ou du tissu.
- source_word: ו/המונכ/א דִי דַהֲבָא עַל צַוְּארֵהּ
  choice: on lui mit une chaîne d’or autour du cou
  rationale: Rend naturellement en français l’ornement honorifique placé au cou.
- source_word: וְהַכְרִזוּ עֲלוֹהִי
  choice: l’on proclama à son sujet
  rationale: Exprime une annonce publique concernant le nouveau statut de Daniel.
- source_word: דִּי לֶהֱוֵא שַׁלִּיט תַּלְתָּא
  choice: qu’il serait le troisième dirigeant
  rationale: La tournure française convient à la teneur d’une nomination proclamée; « troisième dirigeant » conserve le rang ordinal et l’idée d’autorité.
- source_word: בְּמַלְכוּתָא
  choice: du royaume
  rationale: Le complément français « du royaume » exprime idiomatiquement le rang exercé au sein du royaume.
theological_decisions:
- issue: Sens du rang « troisième »
  choice: le troisième dirigeant du royaume
  alternative: celui qui occuperait le troisième rang dans le royaume
  rationale: Le texte affirme explicitement un rang ordinal, sans expliquer la structure politique qui le sous-tend; la traduction préserve cette donnée sans identifier les deux autorités supérieures.
translation_notes:
  register: Français international moderne, narratif et digne. « Revêtit de pourpre » garde la coloration royale du geste; les tournures impersonnelles au singulier rendent naturellement les verbes araméens au pluriel sans inventer leurs agents.
