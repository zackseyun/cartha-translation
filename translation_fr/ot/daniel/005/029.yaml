  source_fidelity: 'Le texte rend fidèlement la séquence araméenne : l’ordre de Belschatsar, l’investiture de Daniel par la pourpre et la chaîne d’or, puis la proclamation de son rang de « troisième dirigeant ». « Alors », « donna l’ordre », « revêtit ... de pourpre » et « autour du cou » sont justes et ne surinterprètent pas les données historiques ou politiques du verset.'
