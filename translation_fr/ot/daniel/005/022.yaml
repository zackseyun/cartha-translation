source:
  edition: WLC
  text: ו/אנתה בְּרֵ/הּ֙ בֵּלְשַׁאצַּ֔ר לָ֥א הַשְׁפֵּ֖לְתְּ לִבְבָ֑/ךְ כָּ/ל קֳבֵ֕ל דִּ֥י כָל דְּנָ֖ה יְדַֽעְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/022.yaml
  text: But you[a], his son, Belshazzar, have not humbled your heart, though you knew all this.
translation:
  language: fr
  text: Mais toi, son fils, Belshatsar[a], tu ne t’es pas humilié, alors même que tu savais tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme araméen traduit par « fils » peut aussi désigner un descendant ou un successeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant marque un contraste appuyé avec le récit précédent concernant Nabuchodonosor.
- source_word: בְּרֵהּ
  choice: son fils
  rationale: Le terme araméen signifie directement « fils », tout en pouvant désigner plus largement un descendant ou un successeur dans un cadre dynastique; cette possibilité est signalée en note.
- source_word: בֵּלְשַׁאצַּר
  choice: Belshatsar
  rationale: Le nom propre est translittéré sous une forme claire et courante en français biblique contemporain.
- source_word: הַשְׁפֵּלְתְּ לִבְבָךְ
  choice: tu n’as pas humilié ton cœur
  rationale: Cette formulation conserve le verbe causatif « abaisser, humilier » ainsi que l’image biblique du cœur comme siège de la volonté et de la compréhension.
- source_word: כָּל־קֳבֵל דִּי
  choice: alors même que
  rationale: 'Dans ce contexte, l’expression introduit une concession appuyée: Belshatsar ne s’est pas humilié malgré sa connaissance des événements antérieurs.'
- source_word: כָל־דְּנָה יְדַעְתָּ
  choice: tu savais tout cela
  rationale: Le démonstratif renvoie à l’ensemble des événements qui viennent d’être racontés au sujet de Nabuchodonosor; l’imparfait exprime naturellement en français cette connaissance déjà acquise.
theological_decisions:
- issue: Sens de « son fils » dans la relation entre Nabuchodonosor et Belshatsar
  choice: Conserver « son fils » dans le texte principal sans préciser s’il s’agit d’un fils au sens strict ou d’un lien dynastique plus large.
  alternative: son descendant; son successeur
  rationale: L’araméen peut employer « fils » au sens large pour la descendance ou la succession royale. Le texte principal préserve donc l’expression source, tandis que la note maintient ouvertes les autres possibilités sans imposer une harmonisation historique.
translation_notes:
  register: Français moderne, digne et directement compréhensible. La reprise « toi… tu » rend l’insistance du pronom araméen. L’expression biblique « humilier son cœur » est conservée afin de respecter l’image et la structure du texte source.
