    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque la progression du récit de façon naturelle en français moderne.
- source_word: מַלְכָּא בֵלְשַׁאצַּר
  choice: le roi Belshatsar
  rationale: Le titre précédant le nom propre correspond à l’usage français courant.
- source_word: שַׂגִּיא מִתְבָּהַל
  choice: fut profondément alarmé
  rationale: L’intensif שַׂגִּיא renforce le trouble exprimé par בהל ; cette formulation conserve une forte réaction de peur sans imposer le degré extrême de « terrifié ».
- source_word: וְזִיוֹהִי שָׁנַיִן עֲלוֹהִי
  choice: son visage changea de couleur
  rationale: L’expression araméenne parle littéralement de son éclat ou de son apparence qui change sur lui ; dans ce contexte de peur, elle décrit visiblement l’altération du teint.
- source_word: וְרַבְרְבָנוֹהִי
  choice: ses hauts dignitaires
  rationale: Le terme désigne les grands personnages et principaux responsables de la cour ; « hauts dignitaires » est clair et adapté au contexte royal.
- source_word: מִשְׁתַּבְּשִׁין
  choice: furent déconcertés
  rationale: Le participe exprime la confusion ou le désarroi ; « déconcertés » rend cette désorientation dans un français naturel.
