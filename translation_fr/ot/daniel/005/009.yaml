  text: Then King Belshazzar became greatly alarmed[a], his color changed[b], and his nobles were perplexed.
translation:
  language: fr
  text: Alors le roi Belshatsar fut profondément alarmé, son visage changea de couleur[a], et ses hauts dignitaires furent déconcertés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son éclat » ou « son apparence fut changé(e) sur lui » ; l’expression peut aussi se traduire par « son teint changea » ou « son visage pâlit ».'
