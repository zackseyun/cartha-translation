source:
  edition: WLC
  text: וְ/עַ֣ל מָרֵֽא שְׁמַיָּ֣/א הִתְרוֹמַ֡מְתָּ וּ/לְ/מָֽאנַיָּ֨/א דִֽי בַיְתֵ֜/הּ הַיְתִ֣יו קדמי/ך ו/אנתה ו/רברבני/ך שֵֽׁגְלָתָ֣/ךְ וּ/לְחֵנָתָ/ךְ֮ חַמְרָ/א֮ שָׁתַ֣יִן בְּ/הוֹן֒ וְ/לֵֽ/אלָהֵ֣י כַסְפָּֽ/א וְ֠/דַהֲבָ/א נְחָשָׁ֨/א פַרְזְלָ֜/א אָעָ֣/א וְ/אַבְנָ֗/א דִּ֠י לָֽא חָזַ֧יִן וְ/לָא שָׁמְעִ֛ין וְ/לָ֥א יָדְעִ֖ין שַׁבַּ֑חְתָּ וְ/לֵֽ/אלָהָ֞/א דִּֽי נִשְׁמְתָ֥/ךְ בִּ/ידֵ֛/הּ וְ/כָל אֹרְחָתָ֥/ךְ לֵ֖/הּ לָ֥א הַדַּֽרְתָּ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/023.yaml
  text: But you have exalted yourself against the Lord of heaven[a], and the vessels of his house were brought before you, and you and your nobles, your wives, and your concubines have been drinking wine from them. And you have praised the gods of silver and gold, bronze, iron, wood, and stone, which do not see or hear or know; but the God in whose hand is your breath, and to whom belong all your ways[c][b], you have not honored.
translation:
  language: fr
  text: Mais tu t’es élevé contre le Seigneur du ciel[a]. Les ustensiles de sa maison ont été apportés devant toi, et toi, tes dignitaires, tes femmes et tes concubines, vous avez bu du vin dans ces ustensiles. Tu as loué les dieux d’argent et d’or, de bronze, de fer, de bois et de pierre, qui ne voient pas, n’entendent pas et ne savent pas. Mais le Dieu qui tient ton souffle dans sa main[b] et à qui appartiennent toutes tes voies, tu ne l’as pas honoré[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Maître du ciel ». Le titre araméen peut signifier « seigneur » ou « maître ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le Dieu dans la main de qui est ton souffle ».'
    reason: literal_rendering
  - marker: c
    text: Ou « glorifié » ou « à qui tu n’as pas rendu gloire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרֵא שְׁמַיָּא
  choice: le Seigneur du ciel
  rationale: מָרֵא signifie « seigneur » ou « maître ». « Le Seigneur du ciel » est un titre divin naturel et élevé en français, tandis que la note conserve l’autre possibilité lexicale.
- source_word: הִתְרוֹמַמְתָּ
  choice: tu t’es élevé contre
  rationale: La forme réfléchie exprime l’élévation arrogante de soi; cette tournure française en préserve à la fois l’image et l’opposition à Dieu.
- source_word: מָאנַיָּא דִי בַיְתֵהּ
  choice: les ustensiles de sa maison
  rationale: « Ustensiles » désigne clairement les objets employés dans le sanctuaire, et « sa maison » maintient l’expression concrète du texte araméen sans la remplacer par son interprétation « temple ».
- source_word: רַבְרְבָנַיִךְ
  choice: tes dignitaires
  rationale: Le terme désigne les grands personnages et hauts responsables de la cour; « dignitaires » est précis et actuel en français.
- source_word: שֵׁגְלָתָךְ וּלְחֵנָתָךְ
  choice: tes femmes et tes concubines
  rationale: Le premier terme désigne les épouses ou consortes royales, le second des femmes de rang conjugal inférieur. Cette distinction est conservée sans surcharge.
- source_word: חַמְרָא שָׁתַיִן בְּהוֹן
  choice: vous y avez bu du vin
  rationale: La reprise par « y » rend naturellement l’usage des ustensiles comme récipients. Le passé composé présente directement l’acte profanateur accompli dans la scène.
- source_word: שַׁבַּחְתָּ
  choice: tu as loué
  rationale: Le verbe signifie louer ou exalter. « Louer » est direct, naturel et convient au contexte cultuel.
- source_word: אֱלָהֵי כַסְפָּא וְדַהֲבָא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא
  choice: les dieux d’argent et d’or, de bronze, de fer, de bois et de pierre
  rationale: La construction conserve la série des matières dont sont faits les dieux-idoles sans explicitation interprétative inutile.
- source_word: דִּי לָא חָזַיִן וְלָא שָׁמְעִין וְלָא יָדְעִין
  choice: qui ne voient pas, n’entendent pas et ne savent pas
  rationale: Cette traduction garde les trois verbes concrets et leur progression, notamment « savoir » plutôt que l’interprétation « comprendre ».
- source_word: אֱלָהָא דִּי נִשְׁמְתָךְ בִּידֵהּ
  choice: le Dieu qui tient ton souffle dans sa main
  rationale: Cette formulation française naturelle conserve l’image de la main divine et le nom concret « souffle », qui expriment la souveraineté de Dieu sur la vie.
- source_word: וְכָל אֹרְחָתָךְ לֵהּ
  choice: et à qui appartiennent toutes tes voies
  rationale: La construction exprime l’appartenance à Dieu. « Tes voies » maintient l’image ouverte du texte, qui peut englober conduite, parcours et destinée.
- source_word: לָא הַדַּרְתָּ
  choice: tu ne l’as pas honoré
  rationale: « Honorer » rend clairement le fait d’accorder honneur ou gloire; la note signale la traduction plus formelle « glorifier ».
theological_decisions:
- issue: Titre divin מָרֵא
  choice: le Seigneur du ciel
  alternative: le Maître du ciel
  rationale: Le choix exprime la souveraineté divine sans ajouter de précision christologique; l’ambiguïté lexicale entre seigneur et maître demeure visible en note.
- issue: Contraste entre les idoles et le vrai Dieu
  choice: conserver « ton souffle », « sa main » et « toutes tes voies »
  alternative: expliciter par « ta vie », « son pouvoir » et « ta destinée »
  rationale: Les images concrètes du texte soulignent que Dieu gouverne la vie entière de Belshatsar. Les conserver évite de réduire la portée théologique à une seule interprétation abstraite.
- issue: Portée de הַדַּר
  choice: honorer
  alternative: glorifier / rendre gloire
  rationale: « Honorer » est ici le sens contextuel immédiat et contraste avec la louange rendue aux idoles; la note préserve l’expression théologique alternative.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement maintient l’adresse directe au roi; le passage au pluriel dans « vous y avez bu » inclut explicitement le roi et les membres de sa cour. La syntaxe finale conserve la mise en relief accusatrice de « le Dieu… tu ne l’as pas honoré ».
