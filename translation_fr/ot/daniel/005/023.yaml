  to: Mais tu t’es élevé contre le Seigneur du ciel[a]. Les ustensiles de sa maison ont été apportés devant toi, et toi, tes dignitaires, tes femmes et tes concubines, vous avez bu du vin dans ces ustensiles. Tu as loué les dieux d’argent et d’or, de bronze, de fer, de bois et de pierre, qui ne voient pas, n’entendent pas et ne savent pas. Mais le Dieu qui tient ton souffle dans sa main[b] et à qui appartiennent toutes tes voies, tu ne l’as pas honoré[c].
  rationale: La révision se limite à remplacer le pronom locatif ambigu « y » par « dans ces ustensiles », afin de rendre explicitement le complément araméen « en eux » et de conserver l’image de la profanation des objets du sanctuaire. Les ancres et les notes restent inchangées dans leur contenu et leur portée.
