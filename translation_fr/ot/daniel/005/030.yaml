  text: Cette nuit-là, Belschatsar, le roi des Chaldéens, fut tué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּהּ בְּלֵילְיָא
  choice: Cette nuit-là
  rationale: La combinaison araméenne du pronom suffixé et de l’expression temporelle déterminée désigne idiomatiquement cette nuit précise. « Cette nuit-là » est naturel en français et conserve la force déictique sans calquer maladroitement les prépositions.
- source_word: קְטִיל
  choice: fut tué
  rationale: La forme exprime un état ou événement passif. « Fut tué » restitue clairement ce passif dans un registre narratif digne et actuel, sans la nuance plus littéraire de « fut mis à mort ».
- source_word: בֵּלְאשַׁצַּר
  choice: Belshatsar
  rationale: Translittération française courante du nom araméen.
- source_word: מַלְכָּא כַשְׂדָּיָא
  choice: le roi des Chaldéens
  rationale: Cette formulation suit directement la relation entre « roi » et le nom de peuple. Elle est naturelle en français et évite de remplacer lexicalement « Chaldéens » par le terme plus large « Babyloniens ».
