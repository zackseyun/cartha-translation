  text: תְּקֵ֑ל תְּקִ֥ילְתָּה בְ/מֹֽאזַנְיָ֖/א וְ/הִשְׁתְּכַ֥חַתְּ חַסִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/027.yaml
  text: 'Tekel: you have been weighed in the balances and found lacking[a][b][c].'
translation:
  language: fr
  text: 'Téqel : tu as été pesé dans la balance et trouvé insuffisant[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’araméen « Téqel » est le mot écrit que Daniel interprète; il est apparenté à l’idée de peser.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans les balances »; on pourrait aussi traduire la fin par « trouvé déficient » ou « trouvé trop léger ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקֵל
  choice: Téqel
  rationale: Le mot araméen inscrit est conservé sous forme translittérée afin de distinguer le terme mystérieux de l’explication que Daniel en donne; sa forme est liée au verbe « peser ».
- source_word: תְּקִילְתָּה
  choice: tu as été pesé
  rationale: La forme passive s’adresse directement à Belshatsar et présente la pesée comme une évaluation accomplie.
- source_word: בְמֹאזַנְיָא
  choice: sur la balance
  rationale: Cette expression française naturelle conserve l’image concrète de l’instrument de pesée; l’araméen emploie une forme plurielle pouvant être rendue par « dans les balances ».
- source_word: וְהִשְׁתְּכַחַתְּ
  choice: et trouvé
  rationale: La formulation exprime le résultat constaté après la pesée; en français, l’ellipse de « tu as été » est naturelle après le premier passif.
- source_word: חַסִּיר
  choice: insuffisant
  rationale: Le mot désigne ce qui manque ou n’atteint pas la mesure requise. « Insuffisant » est clair, actuel et maintient à la fois l’idée de déficit et le verdict défavorable.
theological_decisions:
- issue: Nature de l’image du jugement
  choice: Conserver l’image d’une pesée qui révèle une insuffisance.
  alternative: Expliciter par une paraphrase telle que « Dieu t’a jugé et déclaré coupable ».
  rationale: Le texte exprime le jugement divin au moyen d’une métaphore de poids et de mesure. La traduction garde cette tension imagée sans ajouter une explication doctrinale absente du verset.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse individuelle au roi. « Sur la balance » est plus idiomatique en français courant que le pluriel littéral, signalé en note; « trouvé insuffisant » conserve la concision solennelle du verdict.
