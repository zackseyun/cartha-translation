source:
  edition: WLC
  text: דְּנָ֖ה פְּשַֽׁר מִלְּתָ֑/א מְנֵ֕א מְנָֽה אֱלָהָ֥/א מַלְכוּתָ֖/ךְ וְ/הַשְׁלְמַֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/026.yaml
  text: 'This is the interpretation of the message: MENE—God has numbered your kingdom and finished it[a][b].'
translation:
  language: fr
  text: 'Voici l’interprétation du message[a] : MENÉ[b] — Dieu a compté ton royaume et y a mis fin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la parole », « de l’affaire » ou « de l’inscription ».
    reason: lexical_alternative
  - marker: b
    text: En araméen, MENÉ appartient à la même famille de mots que le verbe traduit par « a compté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Voici
  rationale: Le démonstratif araméen introduit l’explication. « Voici » rend naturellement la proposition nominale et convient au registre solennel du contexte.
- source_word: פְּשַׁר
  choice: interprétation
  rationale: Dans Daniel, ce nom désigne régulièrement l’interprétation d’un rêve, d’un signe ou d’une parole énigmatique.
- source_word: מִלְּתָא
  choice: message
  rationale: Le terme peut désigner une parole, une affaire ou, ici, les mots inscrits sur le mur en tant que communication porteuse de sens. « Message » est clair sans réduire le terme à son seul support matériel.
- source_word: מְנֵא
  choice: MENÉ
  rationale: Le mot inscrit est conservé par translittération puisqu’il fait lui-même l’objet de l’interprétation. L’accent final guide la prononciation française.
- source_word: מְנָה
  choice: a compté
  rationale: Le verbe reprend la même racine araméenne que MENÉ et exprime l’acte de compter ou de fixer un nombre. La traduction littérale préserve l’image sans ajouter « les jours », absent du texte.
- source_word: אֱלָהָא
  choice: Dieu
  rationale: La forme déterminée désigne ici Dieu comme auteur du jugement; « Dieu » est la formulation française naturelle.
- source_word: מַלְכוּתָךְ
  choice: ton royaume
  rationale: Le nom peut désigner le royaume, la royauté ou le règne. « Ton royaume » conserve l’étendue possible du terme et correspond à l’adresse directe à Belshatsar.
- source_word: וְהַשְׁלְמַהּ
  choice: et y a mis fin
  rationale: Le verbe signifie achever ou mener à son terme. Dans ce contexte de jugement, « mettre fin » exprime clairement la cessation du royaume sans suggérer un accomplissement réussi.
theological_decisions:
- issue: Nature de l’action divine exprimée par MENÉ
  choice: Dieu a compté le royaume de Belshatsar et y a mis fin
  alternative: Dieu a compté les jours du royaume de Belshatsar et l’a achevé
  rationale: La formulation retenue affirme le jugement souverain de Dieu tout en évitant d’introduire « les jours », qui n’apparaît pas explicitement dans l’araméen. Elle conserve aussi l’image du dénombrement et la force terminale du dernier verbe.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe au roi. La structure concise de l’araméen est conservée, tandis que « y a mis fin » fournit une formulation française naturelle et sans ambiguïté contextuelle.
