  variant: modern international French
source:
  edition: WLC
  text: וּ/מִן רְבוּתָ/א֙ דִּ֣י יְהַב לֵ֔/הּ כֹּ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ/א֙ וְ/לִשָּׁ֣נַיָּ֔/א הֲו֛וֹ זאעין וְ/דָחֲלִ֖ין מִן קֳדָמ֑וֹ/הִי דִּֽי הֲוָ֨ה צָבֵ֜א הֲוָ֣א קָטֵ֗ל וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מַחֵ֔א וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מָרִ֔ים וְ/דִֽי הֲוָ֥ה צָבֵ֖א הֲוָ֥ה מַשְׁפִּֽיל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/019.yaml
  text: And because of the greatness that he gave him[a], all peoples, nations, and languages were trembling and fearing before him. Whomever he wanted, he killed; and whomever he wanted, he kept alive; and whomever he wanted, he raised up; and whomever he wanted[c][b], he humbled.
translation:
  language: fr
  text: À cause de la grandeur qu’il lui avait accordée[a], tous les peuples, toutes les nations et toutes les langues tremblaient de peur devant lui. Il faisait mourir qui il voulait et laissait vivre qui il voulait ; il élevait qui il voulait et abaissait qui il voulait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « il » renvoie à Dieu, mentionné au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: רְבוּתָא
  choice: grandeur
  rationale: Le nom désigne la grandeur ou la haute position royale ; « grandeur » conserve cette amplitude sans préciser excessivement sa nature.
- source_word: יְהַב לֵהּ
  choice: qu’il lui avait accordée
  rationale: Le plus-que-parfait situe naturellement en français le don antérieur à la réaction des peuples. Le sujet reste pronominal comme en araméen et renvoie à Dieu dans le verset précédent.
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: tous les peuples, toutes les nations et toutes les langues
  rationale: Cette formulation préserve la triade conventionnelle de Daniel ; « langues » désigne par métonymie les groupes linguistiques sans recourir à l’archaïsme « langues/tongues » au sens d’organes.
- source_word: זאעין וְדָחֲלִין
  choice: tremblaient de peur
  rationale: Cette expression française naturelle rend conjointement les deux participes araméens, le tremblement et la crainte, sans la lourdeur de « tremblaient et craignaient ».
- source_word: מִן קֳדָמוֹהִי
  choice: devant lui
  rationale: L’expression restitue sobrement l’idée de présence et de soumission au roi.
- source_word: דִּי הֲוָה צָבֵא
  choice: qui il voulait
  rationale: La répétition conserve l’insistance du texte sur l’exercice personnel et absolu de la volonté royale.
- source_word: קָטֵל
  choice: faisait mourir
  rationale: L’imparfait et la tournure causative idiomatique décrivent une pratique répétée de mise à mort et s’accordent avec la série parallèle.
- source_word: מַחֵא
  choice: laissait vivre
  rationale: Dans l’antithèse avec la mise à mort, cette expression rend la préservation de la vie tout en maintenant une formulation concise.
- source_word: מָרִים
  choice: élevait
  rationale: Le verbe conserve la métaphore verticale et peut naturellement désigner l’élévation en dignité ou en rang.
- source_word: מַשְׁפִּיל
  choice: abaissait
  rationale: « Abaissait » forme avec « élevait » une antithèse directe et restitue l’idée de faire descendre à un rang inférieur.
theological_decisions:
- issue: Agent qui accorde la grandeur à Nabuchodonosor
  choice: Conserver le sujet sous la forme du pronom « il » et signaler son antécédent en note.
  alternative: 'Expliciter dans le texte : « la grandeur que Dieu lui avait accordée ».'
  rationale: L’araméen ne répète pas ici le nom de Dieu, même si le verset précédent l’identifie clairement. La formulation retenue respecte cette cohésion et évite une explicitation dans le corps du texte.
- issue: Nature du pouvoir royal décrit
  choice: Préserver la série factuelle « faisait mourir… laissait vivre… élevait… abaissait » sans qualifier moralement les décisions.
  alternative: Employer une formulation telle que « selon son bon plaisir » ou « arbitrairement ».
  rationale: Le passage souligne l’étendue de la volonté royale, mais n’emploie pas ici un terme qui autoriserait à insérer explicitement un jugement moral.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « qui il voulait » est volontaire afin de préserver le rythme et l’insistance de l’araméen. Le point-virgule fait ressortir les deux paires antithétiques.
