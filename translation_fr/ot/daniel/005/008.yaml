source:
  edition: WLC
  text: אֱדַ֨יִן֙ עללין כֹּ֖ל חַכִּימֵ֣י מַלְכָּ֑/א וְ/לָֽא כָהֲלִ֤ין כְּתָבָ/א֙ לְ/מִקְרֵ֔א ו/פשר/א לְ/הוֹדָעָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/008.yaml
  text: Then all the king’s wise men came in[b][a], but they were not able to read the writing or make its interpretation known to the king.
translation:
  language: fr
  text: Alors tous les sages du roi entrèrent, mais ils ne purent ni lire l’inscription[a] ni en faire connaître l’interprétation[b] au roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lire le texte ». Le terme araméen peut désigner le message écrit lui-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « en expliquer le sens ». Dans Daniel, le terme araméen traduit par « interprétation » revient pour désigner l’explication d’un message mystérieux ou d’un rêve.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: עללין
  choice: entrèrent
  rationale: Rend directement le verbe araméen désignant l’entrée des sages auprès du roi.
- source_word: כֹּל חַכִּימֵי מַלְכָּא
  choice: tous les sages du roi
  rationale: Reproduit naturellement la chaîne construite et désigne l’ensemble des sages attachés à la cour royale.
- source_word: וְלָא כָהֲלִין
  choice: mais ils ne purent
  rationale: Exprime à la fois le contraste narratif et leur incapacité à accomplir la tâche.
- source_word: כְּתָבָא לְמִקְרֵא
  choice: lire l’inscription
  rationale: Dans ce contexte, כְּתָבָא désigne concrètement le texte écrit sur le mur; « inscription » est clair et idiomatique.
- source_word: וּפִשְׁרָא
  choice: l’interprétation
  rationale: Conserve le terme récurrent de Daniel pour l’explication d’un message mystérieux.
- source_word: לְהוֹדָעָה לְמַלְכָּא
  choice: en faire connaître l’interprétation au roi
  rationale: Rend la valeur causative de ידע et rattache explicitement l’interprétation à l’inscription.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La coordination « ni… ni… » rend clairement les deux tâches que les sages étaient incapables d’accomplir, sans atténuer la distinction entre lecture et interprétation.
