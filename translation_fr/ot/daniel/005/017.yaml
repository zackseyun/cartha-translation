- from: 'Alors Daniel répondit et dit devant le roi : « Que tes dons restent à toi, et donne tes récompenses à un autre. Cependant, je lirai l’inscription au roi et je lui en ferai connaître l’interprétation. »'
  to: 'Alors Daniel répondit au roi : « Garde tes dons pour toi et donne tes récompenses à un autre. Cependant, je lirai l’inscription pour le roi et je lui en ferai connaître l’interprétation. »'
  rationale: Révision limitée à l’idiomaticité française. Le texte conserve l’opposition marquée par בְּרַם, le refus des dons royaux, le singulier « à un autre », ainsi que la lecture de l’inscription et la communication de son interprétation au roi.
