base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/017.yaml
  text: Then Daniel answered and said before the king, “Let your gifts remain yours, and give your rewards to another. Nevertheless, I will read the writing for the king and make its interpretation known to him.”
translation:
  language: fr
  text: 'Alors Daniel répondit au roi : « Garde tes dons pour toi et donne tes récompenses à un autre. Cependant, je lirai l’inscription pour le roi et je lui en ferai connaître l’interprétation. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression du récit de manière naturelle en français moderne.
- source_word: עָנֵה ... וְאָמַר
  choice: répondit et dit
  rationale: Conserve les deux verbes de la tournure narrative araméenne sans rendre la phrase incompréhensible.
- source_word: קֳדָם מַלְכָּא
  choice: devant le roi
  rationale: Préserve l’idée de présence et le cadre de la cour, plutôt que de réduire l’expression à « au roi ».
- source_word: מַתְּנָתָךְ ... לָךְ לֶהֶוְיָן
  choice: Que tes dons restent à toi
  rationale: Exprime naturellement le refus de Daniel tout en conservant la référence explicite aux dons du roi.
- source_word: נְבָזְבְּיָתָךְ
  choice: tes récompenses
  rationale: Désigne les gratifications promises par le roi dans le contexte immédiat.
- source_word: לְאָחֳרָן הַב
  choice: donne ... à un autre
  rationale: Respecte le singulier substantivé de l’araméen et le caractère direct de la déclaration.
- source_word: בְּרַם
  choice: Cependant
  rationale: Marque clairement le contraste entre le refus des récompenses et l’acceptation de lire et d’interpréter le message.
- source_word: כְּתָבָא
  choice: l’inscription
  rationale: Dans ce contexte, il s’agit du message écrit sur le mur; « inscription » est précis et naturel en français.
- source_word: אֶקְרֵא לְמַלְכָּא
  choice: je lirai l’inscription au roi
  rationale: Conserve l’objet explicite et rend le complément introduit par ל de façon idiomatique.
- source_word: פִשְׁרָא
  choice: l’interprétation
  rationale: Maintient le terme technique employé dans Daniel pour l’explication d’un message énigmatique.
- source_word: אֲהוֹדְעִנֵּהּ
  choice: je lui en ferai connaître
  rationale: Rend la valeur causative du verbe et le pronom renvoyant au roi; « en » rattache naturellement l’interprétation à l’inscription.
