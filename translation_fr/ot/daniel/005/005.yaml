  text: בַּ/הּ שַׁעֲתָ֗/ה נפקו אֶצְבְּעָן֙ דִּ֣י יַד אֱנָ֔שׁ וְ/כָֽתְבָן֙ לָ/קֳבֵ֣ל נֶבְרַשְׁתָּ֔/א עַל גִּירָ֕/א דִּֽי כְתַ֥ל הֵיכְלָ֖/א דִּ֣י מַלְכָּ֑/א וּ/מַלְכָּ֣/א חָזֵ֔ה פַּ֥ס יְדָ֖/ה דִּ֥י כָתְבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/005.yaml
  text: At that moment the fingers of a human hand came out and wrote opposite the lampstand on the plaster of the wall of the king’s palace[e][d][c][b][a], and the king saw the palm of the hand that was writing.
translation:
  language: fr
  text: À ce moment-là, les doigts d’une main humaine[a] surgirent et se mirent à écrire en face du candélabre[b], sur le plâtre[c] du mur du palais royal[d]. Le roi vit la paume[e] de la main qui écrivait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les doigts d’une main d’homme ». Le terme araméen peut désigner un homme ou, plus généralement, un être humain.
    reason: lexical_alternative
  - marker: b
    text: Ou « devant le candélabre ».
    reason: lexical_alternative
  - marker: c
    text: Ou « l’enduit à la chaux » ou « le badigeon » du mur.
    reason: lexical_alternative
  - marker: d
    text: Ou « de la grande salle du roi » ; le terme araméen peut désigner un palais ou une grande salle qui s’y trouve.
    reason: lexical_alternative
  - marker: e
    text: Ou, peut-être, « la main » de manière plus générale ; la nuance exacte du terme araméen est discutée.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָה
  choice: À ce moment-là
  rationale: Cette expression araméenne marque l’immédiateté. La formulation française est naturelle et conserve la soudaineté de la scène.
- source_word: נפקו
  choice: surgirent
  rationale: Le verbe signifie littéralement « sortir ». « Surgirent » rend clairement l’apparition soudaine et visible des doigts sans l’affaiblir en simple constat d’apparition.
- source_word: אֶצְבְּעָן דִּי יַד אֱנָשׁ
  choice: les doigts d’une main humaine
  rationale: Cette traduction respecte le groupe construit et rend אֱנָשׁ sans supposer qu’il s’agit nécessairement d’un homme de sexe masculin.
- source_word: וְכָתְבָן
  choice: se mirent à écrire
  rationale: La tournure française décrit naturellement l’action immédiatement consécutive à leur surgissement et s’accorde avec la vision de l’écriture en cours à la fin du verset.
- source_word: לָקֳבֵל נֶבְרַשְׁתָּא
  choice: en face du porte-lampes
  rationale: לָקֳבֵל indique une position en face ou vis-à-vis, tandis que נֶבְרַשְׁתָּא désigne un support portant des lampes.
- source_word: עַל גִּירָא
  choice: sur le plâtre
  rationale: Le nom désigne l’enduit à base de chaux du mur. « Plâtre » est clair et non technique dans le corps du texte.
- source_word: דִּי כְתַל הֵיכְלָא דִּי מַלְכָּא
  choice: du mur du palais royal
  rationale: הֵיכְלָא peut désigner un palais ou une grande salle. Dans le contexte de la cour, « palais royal » est une formulation française fluide, tout en signalant l’autre possibilité en note.
- source_word: וּמַלְכָּא חָזֵה
  choice: Le roi vit
  rationale: Le passé simple convient à la progression narrative et traduit directement la perception du roi.
- source_word: פַּס יְדָה
  choice: la paume de la main
  rationale: פַּס désigne ici une partie ou extrémité de la main, souvent comprise comme la paume, mais sa nuance exacte reste discutée et fait l’objet d’une note.
- source_word: דִּי כָתְבָה
  choice: qui écrivait
  rationale: L’imparfait restitue naturellement l’action en cours observée par le roi.
theological_decisions: []
