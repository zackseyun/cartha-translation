  register: Français international moderne, narratif et digne. Le passé simple maintient le registre biblique sans archaïsme marqué. Les ambiguïtés lexicales concernant l’être humain, la position du porte-lampes, l’enduit, le palais ou la salle, et la partie visible de la main sont conservées dans les notes.
