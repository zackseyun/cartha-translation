id: DAN.5.24
reference: Daniel 5:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֵּ/אדַ֨יִן֙ מִן קֳדָמ֔וֹ/הִי שְׁלִ֖יַחַ פַּסָּ֣/א דִֽי יְדָ֑/א וּ/כְתָבָ֥/א דְנָ֖ה רְשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/024.yaml
  text: Then from before him the palm of a hand was sent[b][a], and this writing was inscribed.
translation:
  language: fr
  text: Alors, de devant lui, la paume d’une main fut envoyée[a], et cette inscription fut tracée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa présence ». L’araméen dit littéralement « de devant lui » et indique que la main vient de la présence de celui qui vient d’être mentionné.
    reason: lexical_alternative
  - marker: b
    text: Ou « et cet écrit fut inscrit » ou « et ce message fut écrit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression immédiate du récit dans un français naturel.
- source_word: מִן קֳדָמוֹהִי
  choice: de devant lui
  rationale: Conserve l’image spatiale et personnelle de l’araméen, qui indique l’origine depuis la présence de celui qui vient d’être mentionné, sans expliciter davantage le sujet divin.
- source_word: שְׁלִיחַ
  choice: fut envoyée
  rationale: Rend directement la forme passive du verbe « envoyer ».
- source_word: פַּסָּא דִי יְדָא
  choice: la paume d’une main
  rationale: Reproduit le rapport anatomique exprimé par le texte tout en restant compréhensible; le terme peut désigner la paume ou l’extrémité de la main.
- source_word: וּכְתָבָא דְנָה
  choice: et cette inscription
  rationale: Désigne le message écrit visible sur le mur; « inscription » convient naturellement à la scène.
- source_word: רְשִׁים
  choice: fut tracée
  rationale: Rend l’idée d’écrire ou d’inscrire tout en évitant en français la répétition « inscription fut inscrite ».
theological_decisions:
- issue: Référent de « de devant lui »
  choice: Maintenir le pronom et l’image de provenance depuis sa présence.
  alternative: Traduire simplement « de sa présence » ou « de lui », voire expliciter « de Dieu ».
  rationale: Le contexte identifie Dieu comme source, mais l’araméen n’énonce pas ici de nouveau le nom divin. La formulation retenue préserve cette retenue et l’imagerie du texte.
translation_notes:
  register: Français moderne, digne et lisible. La tournure inhabituelle « de devant lui » est volontairement conservée pour rendre l’image de l’araméen, puis éclairée en note. L’accord féminin de « envoyée » et « tracée » suit respectivement « paume » et « inscription ».
