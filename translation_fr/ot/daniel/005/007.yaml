source:
  edition: WLC
  text: קָרֵ֤א מַלְכָּ/א֙ בְּ/חַ֔יִל לְ/הֶֽעָלָה֙ לְ/אָ֣שְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/חַכִּימֵ֣י בָבֶ֗ל דִּ֣י כָל אֱ֠נָשׁ דִּֽי יִקְרֵ֞ה כְּתָבָ֣/ה דְנָ֗ה וּ/פִשְׁרֵ/הּ֙ יְחַוִּנַּ֔/נִי אַרְגְּוָנָ֣/א יִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארֵ֔/הּ וְ/תַלְתִּ֥י בְ/מַלְכוּתָ֖/א יִשְׁלַֽט׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/007.yaml
  text: The king called out loudly to bring in the enchanters[a], the Chaldeans, and the diviners. The king answered and said to the wise men of Babylon, “Any man who reads this writing and makes its interpretation known to me shall be clothed with purple, have a chain of gold around his neck[c][b], and rule as third in the kingdom.”
translation:
  language: fr
  text: 'Le roi cria d’une voix forte qu’on fasse venir les enchanteurs, les Chaldéens[a] et les devins. Puis le roi prit la parole et dit aux sages de Babylone : « Quiconque lira cette inscription et m’en fera connaître l’interprétation sera vêtu de pourpre, portera une chaîne en or autour du cou et exercera le pouvoir au troisième rang dans le royaume[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les astrologues ». Le terme « Chaldéens » peut désigner ici une catégorie de sages de la cour babylonienne plutôt que le groupe ethnique seulement.
    reason: lexical_alternative
  - marker: b
    text: Ou « sera le troisième dirigeant du royaume ». L’araméen évoque probablement le troisième rang d’autorité.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵא ... בְּחַיִל
  choice: cria d’une voix forte
  rationale: L’expression araméenne désigne un appel puissant et public. Cette formulation naturelle conserve l’intensité de la scène.
- source_word: לְהֶעָלָה
  choice: qu’on fasse venir
  rationale: Dans le contexte de la cour, l’infinitif causatif exprime l’ordre de faire entrer ces spécialistes auprès du roi.
- source_word: אָשְׁפַיָּא
  choice: les enchanteurs
  rationale: Le terme désigne une catégorie de spécialistes des pratiques occultes; « enchanteurs » la distingue des autres groupes cités.
- source_word: כשדיא
  choice: les Chaldéens
  rationale: Le mot peut désigner le peuple chaldéen ou une classe de sages de cour babyloniens. La translittération traditionnelle préserve cette ambiguïté, explicitée en note.
- source_word: גָזְרַיָּא
  choice: les devins
  rationale: Le terme renvoie à ceux qui déterminent ou annoncent le sens de signes et de présages; « devins » est clair en français moderne.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Puis le roi prit la parole et dit
  rationale: Cette tournure française rend naturellement la formule narrative sémitique sans suggérer qu’il répond nécessairement à une question explicite.
- source_word: לְחַכִּימֵי בָבֶל
  choice: aux sages de Babylone
  rationale: Rendu direct du titre collectif des savants et conseillers de la cour babylonienne.
- source_word: כָל אֱנָשׁ
  choice: Quiconque
  rationale: Le masculin singulier araméen a ici une portée générique. « Quiconque » restitue ce sens naturellement, sans restreindre artificiellement la déclaration aux hommes.
- source_word: יִקְרֵה כְּתָבָה דְנָה
  choice: lira cette inscription
  rationale: Dans ce contexte, כְּתָב désigne le texte écrit sur le mur; « inscription » est précis et idiomatique.
- source_word: וּפִשְׁרֵהּ יְחַוִּנַּנִי
  choice: m’en fera connaître l’interprétation
  rationale: La formulation conserve à la fois le substantif « interprétation » et l’idée de la communiquer au roi.
- source_word: אַרְגְּוָנָא יִלְבַּשׁ
  choice: sera vêtu de pourpre
  rationale: Le rendu préserve la forme de la promesse et la valeur honorifique du vêtement pourpre.
- source_word: והמונכא די דהבא על צוארהּ
  choice: portera une chaîne en or autour du cou
  rationale: Cette expression française naturelle décrit l’ornement honorifique placé au cou.
- source_word: וְתַלְתִּי בְמַלְכוּתָא יִשְׁלַט
  choice: exercera le pouvoir au troisième rang dans le royaume
  rationale: Le texte promet vraisemblablement le troisième rang d’autorité. La formulation évite de faire du bénéficiaire le souverain d’un tiers territorial du royaume.
theological_decisions:
- issue: Sens de וְתַלְתִּי בְמַלְכוּתָא יִשְׁלַט
  choice: exercera le pouvoir au troisième rang dans le royaume
  alternative: sera le troisième dirigeant du royaume
  rationale: L’araméen est concis et peut être formulé de plusieurs façons, mais il renvoie probablement au rang d’autorité. Le texte principal exprime ce sens tout en signalant en note une autre traduction formelle possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de la proclamation royale sans reproduire mécaniquement les tournures sémitiques. Les désignations distinctes des spécialistes babyloniens sont maintenues, et l’ambiguïté de « Chaldéens » ainsi que celle du troisième rang est signalée en notes.
