id: DAN.5.13
reference: Daniel 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֵּ/אדַ֨יִן֙ דָּֽנִיֵּ֔אל הֻעַ֖ל קֳדָ֣ם מַלְכָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/דָנִיֵּ֗אל אנתה ה֤וּא דָנִיֵּאל֙ דִּֽי מִן בְּנֵ֤י גָלוּתָ/א֙ דִּ֣י יְה֔וּד דִּ֥י הַיְתִ֛י מַלְכָּ֥/א אַ֖בִ/י מִן יְהֽוּד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/013.yaml
  text: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
translation:
  language: fr
  text: 'Alors Daniel fut introduit devant le roi. Le roi prit la parole et lui dit : « Est-ce toi, Daniel, l’un des exilés de Juda que le roi, mon père[a], a fait venir de Juda ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon prédécesseur » ; dans le langage royal, « père » peut désigner un ancêtre ou un roi antérieur, et pas seulement le père biologique immédiat.
    reason: Note culturelle expliquant l’étendue possible du terme royal sans remplacer la formulation de la source.
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Ce marqueur araméen fait progresser le récit en introduisant l’événement suivant ; « Alors » est naturel en français narratif.
- source_word: הֻעַל
  choice: fut introduit
  rationale: La forme passive-causative indique que d’autres personnes font entrer Daniel auprès du roi. « Fut introduit » convient au cadre de la cour.
- source_word: קֳדָם מַלְכָּא
  choice: devant le roi
  rationale: Expression idiomatique désignant la présence du roi, rendue de manière concise et naturelle.
- source_word: עָנֵה ... וְאָמַר
  choice: prit la parole et lui dit
  rationale: Cette formulation française conserve la présence des deux verbes de la tournure narrative sémitique sans produire un calque maladroit.
- source_word: אַנְתָּה הוּא דָנִיֵּאל
  choice: Est-ce toi, Daniel
  rationale: Le contexte appelle une question d’identification. Cette tournure restitue l’insistance portée par le pronom et la copule tout en restant idiomatique en français.
- source_word: דִּי מִן בְּנֵי גָלוּתָא
  choice: l’un des exilés
  rationale: Littéralement « parmi les fils de l’exil » ; l’expression choisie désigne clairement un membre de la communauté déportée.
- source_word: יְהוּד
  choice: Juda
  rationale: Dans ce contexte, le terme renvoie au pays et à la communauté de Juda ; « Juda » convient aux deux occurrences et évite un terme potentiellement anachronique.
- source_word: דִּי הַיְתִי מַלְכָּא אַבִי מִן יְהוּד
  choice: que le roi, mon père, a fait venir de Juda
  rationale: La proposition relative attribue au roi désigné comme « mon père » le déplacement forcé depuis Juda. « A fait venir » exprime la valeur causative sans ajouter explicitement « déporter », absent de cette proposition.
theological_decisions:
- issue: Sens de « mon père » (אַבִי) dans le langage royal
  choice: Conserver « mon père » dans le texte principal
  alternative: mon prédécesseur
  rationale: L’araméen dit explicitement « mon père ». Dans le langage royal du Proche-Orient ancien, ce mot peut aussi désigner un ancêtre ou un roi antérieur ; une note préserve cette possibilité sans résoudre dans le texte la tension historique.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure « prit la parole et lui dit » conserve la formule araméenne avec naturel ; « fut introduit » maintient le cadre formel de la cour.
