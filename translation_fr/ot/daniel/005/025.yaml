source:
  edition: WLC
  text: וּ/דְנָ֥ה כְתָבָ֖/א דִּ֣י רְשִׁ֑ים מְנֵ֥א מְנֵ֖א תְּקֵ֥ל וּ/פַרְסִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/025.yaml
  text: 'And this is the inscription that was written: MENE[a], MENE, TEKEL[b], and PARSIN.'
translation:
  language: fr
  text: 'Et voici l’inscription qui fut écrite : « MENÉ[a], MENÉ, TEKEL et PARSIN. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les mots araméens sont conservés en translittération parce que Daniel les interprète dans les versets suivants par des jeux de mots : MENÉ évoque « compté », TEKEL « pesé », et PARSIN/PERÈS « divisé », tout en faisant aussi écho aux Perses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְנָה
  choice: Et voici
  rationale: Rend à la fois la conjonction וּ et la force présentative du démonstratif דְנָה dans un français naturel.
- source_word: כְתָבָא
  choice: l’inscription
  rationale: Dans le contexte du message tracé sur le mur, « inscription » est plus précis que le terme général « écriture ».
- source_word: דִּי רְשִׁים
  choice: qui fut tracée
  rationale: Le relatif et la forme passive indiquent ce qui a été écrit ou inscrit. « Fut tracée » convient au contexte visuel sans alourdir la répétition avec « inscription ».
- source_word: מְנֵא מְנֵא
  choice: MENÉ, MENÉ
  rationale: La translittération préserve le caractère énigmatique de la formule et le jeu de mots expliqué ensuite; la répétition du texte source est maintenue.
- source_word: תְּקֵל
  choice: TEQEL
  rationale: La translittération conserve le jeu de mots ultérieur avec l’idée de peser. La lettre q rend ici le qoph araméen et distingue la forme de manière utile en français.
- source_word: וּפַרְסִין
  choice: et PARSIN
  rationale: La conjonction est explicitement rendue. La forme araméenne est translittérée afin de préserver les échos ultérieurs à la division et aux Perses, ainsi que la différence avec la forme singulière PERÈS du verset suivant.
theological_decisions:
- issue: Sens de la formule araméenne
  choice: Conserver les mots en translittération
  alternative: Traduire par des valeurs monétaires ou par « compté, pesé, divisé »
  rationale: Le récit maintient d’abord l’inscription sous une forme énigmatique, puis Daniel en donne l’interprétation au moyen de jeux de mots. Une traduction immédiate résoudrait prématurément cette tension.
translation_notes:
  register: Français moderne, international et digne. « Et voici » introduit naturellement la formule solennelle. Les capitales signalent les termes de l’inscription sans les traduire avant leur interprétation narrative.
