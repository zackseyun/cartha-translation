id: DAN.5.4
reference: Daniel 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִשְׁתִּ֖יו חַמְרָ֑/א וְ֠/שַׁבַּחוּ לֵֽ/אלָהֵ֞י דַּהֲבָ֧/א וְ/כַסְפָּ֛/א נְחָשָׁ֥/א פַרְזְלָ֖/א אָעָ֥/א וְ/אַבְנָֽ/א׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/004.yaml
  text: They drank the wine and praised the gods of gold and silver[a], bronze, iron, wood, and stone.
translation:
  language: fr
  text: Ils burent le vin et louèrent les dieux d’or et d’argent, de bronze[a], de fer, de bois et de pierre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de cuivre ». Le terme araméen peut désigner le cuivre ou le bronze; « bronze » convient bien à la liste conventionnelle des matériaux d’idoles dans ce passage.
    reason: alternative lexicale
lexical_decisions:
- source_word: אִשְׁתִּיו
  choice: Ils burent
  rationale: Le peal parfait, troisième personne du pluriel, fait avancer le récit. Le passé simple convient au registre narratif biblique tout en restant clair en français moderne.
- source_word: חַמְרָא
  choice: le vin
  rationale: L’état emphatique et le contexte désignent le vin précis consommé pendant le festin; l’article défini le rend naturellement.
- source_word: וְשַׁבַּחוּ
  choice: et louèrent
  rationale: Le verbe exprime l’action d’adresser des louanges. « Louèrent » est naturel, digne et conserve ici la portée cultuelle.
- source_word: לֵאלָהֵי
  choice: les dieux de
  rationale: La préposition marque le complément du verbe « louer »; en français idiomatique, on dit « louer les dieux », tandis que « de » introduit les matériaux dont leurs représentations sont faites.
- source_word: דַּהֲבָא
  choice: d’or
  rationale: Rend directement le premier matériau de la série décrivant les dieux ou leurs images.
- source_word: וְכַסְפָּא
  choice: et d’argent
  rationale: Conserve la coordination et le parallélisme de l’énumération araméenne.
- source_word: נְחָשָׁא
  choice: de bronze
  rationale: Le terme peut désigner le cuivre ou le bronze; « bronze » convient bien à cette liste conventionnelle de matériaux d’idoles, sans effacer l’autre possibilité, signalée en note.
- source_word: פַרְזְלָא
  choice: de fer
  rationale: Équivalent français direct et courant du terme araméen.
- source_word: אָעָא
  choice: de bois
  rationale: Équivalent français direct dans une liste de matériaux servant à fabriquer des idoles.
- source_word: וְאַבְנָא
  choice: et de pierre
  rationale: « Pierre » est l’équivalent naturel dans le contexte de représentations cultuelles.
theological_decisions:
- issue: Faut-il rendre אֱלָהֵי par « dieux » ou par « Dieu » ?
  choice: dieux
  alternative: Dieu
  rationale: La forme plurielle et l’énumération des matériaux indiquent clairement des divinités païennes représentées par des idoles, et non le Dieu d’Israël.
- issue: Rapport entre les « dieux » et les matériaux énumérés
  choice: Conserver littéralement « les dieux d’or… »
  alternative: Expliciter « les statues des dieux faites d’or… »
  rationale: Le texte identifie rhétoriquement les divinités à leurs représentations matérielles. L’explicitation en « statues » résoudrait une tension que l’araméen laisse intacte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient la narration écrite; l’énumération resserrée reproduit le rythme de l’araméen sans lourdeur.
