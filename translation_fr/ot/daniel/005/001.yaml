  text: בֵּלְשַׁאצַּ֣ר מַלְכָּ֗/א עֲבַד֙ לְחֶ֣ם רַ֔ב לְ/רַבְרְבָנ֖וֹ/הִי אֲלַ֑ף וְ/לָ/קֳבֵ֥ל אַלְפָּ֖/א חַמְרָ֥/א שָׁתֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/001.yaml
  text: King Belshazzar made a great feast for a thousand of his nobles[a], and in the presence of the thousand he was drinking wine.
translation:
  language: fr
  text: Le roi Belschatsar donna un grand festin pour mille de ses hauts dignitaires et, en présence de ces mille convives[a], il buvait du vin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et devant les mille, il buvait du vin ». L’expression araméenne peut indiquer une position « devant » ou « en face de », mais elle signifie probablement ici que le roi buvait publiquement en présence des mille convives.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: Le roi
  rationale: 'Le nom araméen à l’état emphatique est en apposition au nom propre. En français naturel, le titre prend l’article : « le roi Belshatsar ».'
- source_word: עֲבַד
  choice: donna
  rationale: Le verbe signifie littéralement « faire ». Avec « festin », le français idiomatique dit « donner un festin », ce qui exprime l’organisation de l’événement sans surinterprétation.
- source_word: לְחֶם רַב
  choice: un grand festin
  rationale: Bien que לְחֶם désigne d’abord le pain ou la nourriture, l’expression renvoie ici à un repas solennel et abondant. « Grand festin » conserve l’adjectif רַב et convient au contexte royal.
- source_word: לְרַבְרְבָנֹוהִי
  choice: pour mille de ses hauts dignitaires
  rationale: Le terme désigne les grands personnages ou hauts responsables du royaume. « Hauts dignitaires » est clair, moderne et adapté au cadre de la cour, sans la coloration féodale possible de « seigneurs ».
- source_word: אֲלַף
  choice: mille
  rationale: Équivalent direct du nombre cardinal araméen.
- source_word: וְלָקֳבֵל
  choice: et, en présence de
  rationale: La locution peut signifier « devant », « en face de » ou « en présence de ». Dans ce contexte, elle indique vraisemblablement que le roi buvait publiquement sous les yeux de l’assemblée, tout en laissant l’alternative plus littérale en note.
- source_word: אַלְפָּא
  choice: ces mille convives
  rationale: La reprise du nombre désigne le groupe déjà mentionné. L’ajout de « ces » et de « convives » évite en français la tournure lourde « en présence des mille » sans changer le référent.
- source_word: חַמְרָא
  choice: du vin
  rationale: Équivalent courant et direct du terme araméen.
- source_word: שָׁתֵה
  choice: il buvait
  rationale: La forme participiale présente l’action comme en cours. L’imparfait français rend naturellement cette valeur progressive dans un récit au passé.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Belshatsar » suit une translittération française courante ; « hauts dignitaires » rend le vocabulaire de cour sans archaïsme féodal. La syntaxe conserve la répétition des mille invités tout en la rendant naturelle grâce à « ces mille convives ».
