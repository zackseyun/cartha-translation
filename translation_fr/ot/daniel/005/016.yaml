revisions:
- from: Mais j’ai entendu dire à ton sujet que tu es capable de donner des interprétations et de résoudre des difficultés[a]. Maintenant, si tu es capable de lire l’inscription et de m’en faire connaître l’interprétation, tu seras revêtu de pourpre, un collier d’or sera placé autour de ton cou, et tu gouverneras en troisième position dans le royaume[b].
  to: Mais j’ai entendu dire à ton sujet que tu es capable de donner des interprétations et de résoudre des difficultés[a]. Maintenant, si tu es capable de lire l’écriture et de m’en faire connaître l’interprétation, tu seras revêtu de pourpre, une chaîne d’or sera placée autour de ton cou, et tu gouverneras comme troisième dans le royaume[b].
  rationale: La révision évite de spécifier « l’écriture » comme une inscription, restitue plus exactement la chaîne d’or, et remplace une expression de rang peu idiomatique par une formulation qui conserve la légère indétermination de l’araméen. Les ancres et le contenu des notes sont maintenus, avec une note b formulée de manière moins affirmative.
