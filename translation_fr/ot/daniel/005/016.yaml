source:
  edition: WLC
  text: וַ/אֲנָה֙ שִׁמְעֵ֣ת עלי/ך דִּֽי תוכל פִּשְׁרִ֛ין לְ/מִפְשַׁ֖ר וְ/קִטְרִ֣ין לְ/מִשְׁרֵ֑א כְּעַ֡ן הֵן֩ תוכל כְּתָבָ֜/א לְ/מִקְרֵ֗א וּ/פִשְׁרֵ/הּ֙ לְ/הוֹדָ֣עֻתַ֔/נִי אַרְגְּוָנָ֣/א תִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארָ֔/ךְ וְ/תַלְתָּ֥א בְ/מַלְכוּתָ֖/א תִּשְׁלַֽט־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/016.yaml
  text: But I have heard about you that you are able to give interpretations and to solve difficulties[a]. Now, if you are able to read the writing and make its interpretation known to me, you shall be clothed with purple, and a chain of gold shall be put around your neck[b], and you shall rule as third in the kingdom.
translation:
  language: fr
  text: Mais j’ai entendu dire à ton sujet que tu es capable de donner des interprétations et de résoudre des difficultés[a]. Maintenant, si tu es capable de lire l’écriture et de m’en faire connaître l’interprétation, tu seras revêtu de pourpre, une chaîne d’or sera placée autour de ton cou, et tu gouverneras comme troisième dans le royaume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’araméen dit littéralement « dénouer des nœuds », image qui signifie résoudre des problèmes difficiles ou éclaircir ce qui paraît insoluble.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu seras le troisième dirigeant dans le royaume ». L’expression peut désigner le troisième rang dans le royaume.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנָה
  choice: Mais j’ai
  rationale: La conjonction suivie du pronom indépendant marque ici une transition personnelle et contrastive dans le discours de Belshatsar; « Mais j’ai » la rend naturellement.
- source_word: שִׁמְעֵת עֲלָיִךְ
  choice: entendu dire à ton sujet
  rationale: Le parfait exprime une information reçue auparavant et encore pertinente; la tournure française rend idiomatiquement le contenu du rapport concernant Daniel.
- source_word: פִּשְׁרִין לְמִפְשַׁר
  choice: donner des interprétations
  rationale: L’association du nom pluriel et du verbe apparenté est une tournure araméenne signifiant fournir des interprétations; ce rendu conserve le pluriel sans lourdeur.
- source_word: וְקִטְרִין לְמִשְׁרֵא
  choice: résoudre des difficultés
  rationale: L’expression signifie littéralement « dénouer des nœuds » et désigne métaphoriquement la résolution de problèmes complexes; une note conserve l’image source.
- source_word: כְּעַן הֵן תוכל
  choice: Maintenant, si tu es capable
  rationale: כְּעַן introduit la proposition immédiate et הֵן la condition; la répétition de « capable » reflète celle du texte.
- source_word: כְּתָבָא
  choice: l’inscription
  rationale: Dans la scène de l’écriture sur le mur, « inscription » désigne avec précision et naturel le texte écrit visible.
- source_word: וּפִשְׁרֵהּ לְהוֹדָעוּתַנִי
  choice: et de m’en faire connaître l’interprétation
  rationale: Ce rendu garde le substantif « interprétation » ainsi que la valeur causative de « faire connaître ».
- source_word: אַרְגְּוָנָא תִלְבַּשׁ
  choice: tu seras revêtu de pourpre
  rationale: La formulation rend la remise honorifique d’un vêtement pourpre, signe de dignité royale.
- source_word: וְתַלְתָּא בְמַלְכוּתָא תִּשְׁלַט
  choice: tu gouverneras en troisième position dans le royaume
  rationale: La formulation conserve l’idée de gouvernement et explicite prudemment le rang ordinal sans décider si Daniel est « troisième souverain » ou titulaire du troisième rang.
theological_decisions:
- issue: Sens du rang promis à Daniel
  choice: tu gouverneras en troisième position dans le royaume
  alternative: tu seras le troisième gouvernant du royaume
  rationale: L’araméen indique un exercice du pouvoir associé à la troisième place, mais peut se comprendre comme le troisième rang ou comme la qualité de troisième gouvernant. Le texte principal préserve cette relative ambiguïté, et la note signale l’autre formulation.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement correspond à l’adresse royale à Daniel. Les formulations de cour restent soutenues sans archaïsmes; les métaphores et ambiguïtés araméennes importantes sont conservées en note.
