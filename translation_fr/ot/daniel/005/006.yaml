  text: Then the king’s color changed[a], and his thoughts terrified him; the joints of his hips gave way[b], and his knees knocked against each other.
translation:
  language: fr
  text: Alors le roi changea de couleur[a] et ses pensées le terrifièrent ; ses hanches se dérobèrent[b], et ses genoux s’entrechoquèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « son éclat changea ». L’expression araméenne désigne ici le changement visible de son apparence ou de son teint sous l’effet de la peur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les jointures de ses reins se desserrèrent ». L’expression décrit l’affaiblissement ou l’effondrement physique causé par la terreur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Adverbe temporel araméen qui fait avancer le récit ; « Alors » est naturel et précis.
- source_word: מַלְכָּא
  choice: le roi
  rationale: Le nom à l’état emphatique désigne le roi déjà identifié dans le récit.
- source_word: זִיוֹהִי שְׁנוֹהִי
  choice: changea de couleur
  rationale: Littéralement, l’éclat ou l’apparence du roi change ; l’expression française rend clairement le changement visible de teint provoqué par la peur tout en conservant une note sur l’image originale.
- source_word: רַעְיוֹנֹהִי
  choice: ses pensées
  rationale: Le terme désigne ses pensées ou représentations mentales ; la traduction directe préserve le lien entre sa perception et sa terreur.
- source_word: יְבַהֲלוּנֵּהּ
  choice: le terrifièrent
  rationale: Le verbe exprime un effroi soudain et intense, confirmé par les réactions physiques qui suivent.
- source_word: קִטְרֵי חַרְצֵהּ
  choice: les articulations de ses hanches
  rationale: Cette expression difficile évoque les jointures ou attaches de la région des reins et des hanches ; la formulation retenue demeure concrète sans adopter l’image plus opaque des « nœuds ».
- source_word: מִשְׁתָּרַיִן
  choice: se relâchèrent
  rationale: Le verbe décrit ce qui se desserre ou se défait ; « se relâchèrent » conserve l’image corporelle et la faiblesse causée par la terreur.
- source_word: אַרְכֻבָּתֵהּ
  choice: ses genoux
  rationale: Équivalent français direct et usuel.
- source_word: דָּא לְדָא נָקְשָׁן
  choice: s’entrechoquèrent
  rationale: Le tour réciproque et le verbe « frapper » sont rendus naturellement par un verbe français qui exprime que les genoux se heurtent l’un contre l’autre.
