  variant: modern international French
source:
  edition: WLC
  text: כָּ/ל קֳבֵ֡ל דִּ֣י ר֣וּחַ יַתִּירָ֡ה וּ/מַנְדַּ֡ע וְ/שָׂכְלְתָנ֡וּ מְפַשַּׁ֣ר חֶלְמִין֩ וַֽ/אַֽחֲוָיַ֨ת אֲחִידָ֜ן וּ/מְשָׁרֵ֣א קִטְרִ֗ין הִשְׁתְּכַ֤חַת בֵּ/הּ֙ בְּ/דָ֣נִיֵּ֔אל דִּֽי מַלְכָּ֥/א שָׂם שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר כְּעַ֛ן דָּנִיֵּ֥אל יִתְקְרֵ֖י וּ/פִשְׁרָ֥/ה יְהַֽחֲוֵֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/012.yaml
  text: because an extraordinary spirit[a], knowledge, and understanding to interpret dreams, explain riddles, and solve difficulties were found in him, in Daniel, whom the king named Belteshazzar. Now let Daniel be called[c][b], and he will show the interpretation.
translation:
  language: fr
  text: parce qu’on a trouvé en lui — en Daniel, à qui le roi avait donné le nom de Beltshatsar — un esprit extraordinaire[a], de la connaissance et de l’intelligence pour interpréter les rêves, expliquer les énigmes et dénouer les difficultés[b]. Que Daniel soit donc appelé, et il fera connaître l’interprétation[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit exceptionnel » ou « un esprit supérieur ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dénouer des nœuds », image qui désigne la résolution de problèmes difficiles.
    reason: cultural_note
  - marker: c
    text: Ou « il indiquera l’interprétation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דִּי
  choice: parce que
  rationale: Cette locution araméenne introduit la raison pour laquelle la reine recommande Daniel; « parce que » en conserve clairement la valeur causale.
- source_word: רוּחַ יַתִּירָה
  choice: un esprit extraordinaire
  rationale: יַתִּירָה exprime ici un caractère exceptionnel ou supérieur. La traduction conserve « esprit » sans préciser s’il s’agit explicitement de l’Esprit divin.
- source_word: מַנְדַּע וְשָׂכְלְתָנוּ
  choice: de la connaissance et de l’intelligence
  rationale: Les deux termes sont distingués afin de préserver l’accumulation des qualités attribuées à Daniel.
- source_word: מְפַשַּׁר חֶלְמִין
  choice: interpréter les rêves
  rationale: Rendu français naturel de la capacité décrite par la construction participiale araméenne.
- source_word: אַחֲוָיַת אֲחִידָן
  choice: expliquer les énigmes
  rationale: L’expression désigne le fait de rendre clairs des propos énigmatiques ou des énigmes.
- source_word: מְשָׁרֵא קִטְרִין
  choice: dénouer les difficultés
  rationale: « Dénouer » conserve une trace naturelle de la métaphore littérale des nœuds, tandis que « difficultés » en communique le sens idiomatique.
- source_word: הִשְׁתְּכַחַת בֵּהּ
  choice: on a trouvé en lui
  rationale: La tournure impersonnelle française rend naturellement l’idée que ces qualités et aptitudes se trouvaient chez Daniel.
- source_word: דִּי מַלְכָּא שָׂם שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: à qui le roi avait donné le nom de Beltshatsar
  rationale: Rendu idiomatique de l’expression littérale « le roi fixa son nom », avec le plus-que-parfait adapté à l’antériorité.
- source_word: כְּעַן דָּנִיֵּאל יִתְקְרֵי
  choice: Que Daniel soit donc appelé
  rationale: Le passif à valeur jussive est conservé; « donc » marque naturellement la transition logique dans ce contexte.
- source_word: פִשְׁרָה יְהַחֲוֵה
  choice: il fera connaître l’interprétation
  rationale: Cette formulation rend directement le causatif araméen « faire connaître » sans réduire le sens à une simple action de montrer.
theological_decisions:
- issue: Sens du mot « esprit » dans la description de la sagesse de Daniel
  choice: « un esprit extraordinaire », sans identification explicite à l’Esprit de Dieu
  alternative: Comprendre l’expression comme une référence explicite à l’Esprit divin
  rationale: Le passage affirme le caractère exceptionnel de l’esprit ou de la disposition de Daniel, mais ne nomme pas explicitement l’Esprit de Dieu. La traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est restructurée autour de « on a trouvé en lui » pour éviter un accord lourd avec une longue série de qualités et d’aptitudes. Les tirets isolent l’identification de Daniel et son nom babylonien. « Dénouer les difficultés » maintient la métaphore tout en restant idiomatique.
