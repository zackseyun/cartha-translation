base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/018.yaml
  text: As for you[a], O king, the Most High God gave kingship and greatness and glory and majesty to Nebuchadnezzar your father.
translation:
  language: fr
  text: Quant à toi, ô roi, le Dieu Très-Haut a donné la royauté, la grandeur, la gloire et la majesté à Nabuchodonosor, ton père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton ancêtre » ou « ton prédécesseur » ; le terme araméen signifie littéralement « ton père », mais peut s’employer plus largement dans le langage des lignées royales.
    reason: lexical_alternative
lexical_decisions:
- source_word: אנתה
  choice: Quant à toi
  rationale: Le pronom indépendant placé en tête marque l’insistance et le contraste dans le discours.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Le vocatif maintient le caractère solennel de l’adresse à la cour.
- source_word: אֱלָהָא עִלָּיָא
  choice: le Dieu Très-Haut
  rationale: Cette formulation française naturelle conserve le titre divin superlatif.
- source_word: מַלְכוּתָא
  choice: la royauté
  rationale: Il s’agit ici du pouvoir et de la dignité royale accordés personnellement à Nabuchodonosor, plutôt que du territoire de son royaume.
- source_word: רְבוּתָא
  choice: la grandeur
  rationale: Le terme désigne la grandeur ou le rang élevé et s’intègre naturellement à l’énumération.
- source_word: וִיקָרָא
  choice: la gloire
  rationale: Dans ce contexte royal, le mot évoque la gloire et l’honneur; « gloire » préserve le registre élevé.
- source_word: הַדְרָה
  choice: la majesté
  rationale: Le terme exprime la magnificence royale et se distingue convenablement de la gloire qui précède.
- source_word: יְהַב
  choice: a donné
  rationale: Le verbe simple « donner » rend directement l’araméen sans alourdir la phrase.
- source_word: לִנְבֻכַדְנֶצַּר
  choice: à Nabuchodonosor
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et bien établie.
- source_word: אֲבוּךְ
  choice: ton père
  rationale: Le texte emploie le terme ordinaire pour « père », qui peut toutefois avoir un sens dynastique plus large; ce sens est signalé en note.
theological_decisions:
- issue: Sens de « ton père » dans le langage royal et dynastique
  choice: Conserver « ton père » dans le texte principal.
  alternative: « ton ancêtre » ou « ton prédécesseur »
  rationale: Le rendu littéral préserve l’expression du texte araméen sans trancher la relation historique précise. Dans le langage royal du Proche-Orient ancien, « père » peut désigner plus largement un ancêtre ou un prédécesseur.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse « ô roi » conserve la solennité de la scène de cour, tandis que l’énumération garde le rythme élevé de l’araméen.
