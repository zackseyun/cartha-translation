revisions:
- from: Il fut chassé loin des êtres humains[a]. Son cœur devint semblable à celui des bêtes[b], et il habita avec les ânes sauvages[c]. On lui donna à manger de l’herbe comme aux bœufs, et son corps fut trempé par la rosée du ciel, jusqu’à ce qu’il reconnaisse que le Dieu Très-Haut règne sur le royaume des humains et qu’il établit à sa tête qui il veut.
  to: Il fut chassé d’entre les êtres humains[a], et son cœur fut rendu semblable à celui des bêtes[b] ; il eut sa demeure parmi les ânes sauvages[c]. On lui donna à manger de l’herbe comme aux bœufs, et son corps fut trempé par la rosée du ciel, jusqu’à ce qu’il reconnaisse que le Dieu Très-Haut règne sur le royaume des humains et qu’il y établit qui il veut.
  rationale: La révision améliore la fidélité aux passifs et aux syntagmes nominaux de l’araméen, et clarifie la dernière proposition en français. Elle ne modifie ni le sens historique ni l’affirmation de la souveraineté divine, et elle maintient les notes nécessaires.
