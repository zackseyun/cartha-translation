id: DAN.5.21
reference: Daniel 5:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מִן בְּנֵי֩ אֲנָשָׁ֨/א טְרִ֜יד וְ/לִבְבֵ֣/הּ עִם חֵיוְתָ֣/א שוי וְ/עִם עֲרָֽדַיָּ/א֙ מְדוֹרֵ֔/הּ עִשְׂבָּ֤/א כְ/תוֹרִין֙ יְטַ֣עֲמוּנֵּ֔/הּ וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּֽי יְדַ֗ע דִּֽי שַׁלִּ֞יט אֱלָהָ֤/א עלי/א בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖ה יְהָקֵ֥ים עלי/ה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/021.yaml
  text: He was driven away from the sons of men[a], and his heart was made like the beasts, and his dwelling was with the wild donkeys. He was fed grass like oxen, and his body was drenched with the dew of heaven[d][c][b], until he knew that the Most High God rules over the kingdom of mankind and sets over it whomever he wills.
translation:
  language: fr
  text: Il fut chassé d’entre les êtres humains[a], et son cœur fut rendu semblable à celui des bêtes[b] ; il eut sa demeure parmi les ânes sauvages[c]. On lui donna à manger de l’herbe comme aux bœufs, et son corps fut trempé par la rosée du ciel, jusqu’à ce qu’il reconnaisse que le Dieu Très-Haut règne sur le royaume des humains et qu’il y établit qui il veut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’entre les fils des hommes ».'
    reason: L’expression source est un idiome collectif désignant les êtres humains.
  - marker: b
    text: Le « cœur » peut ici désigner aussi l’esprit, la pensée ou les dispositions intérieures.
    reason: Le champ sémantique du terme araméen dépasse l’organe physique et ne doit pas être réduit à une seule faculté.
  - marker: c
    text: Les « ânes sauvages » sont des onagres.
    reason: Précision zoologique et culturelle sur l’animal désigné par le terme araméen.
lexical_decisions:
- source_word: טְרִיד
  choice: fut chassé loin de
  rationale: Le participe passif exprime l’exclusion subie par le roi. Cette formulation française rend clairement l’éloignement forcé sans ajouter la notion plus juridique d’expulsion.
- source_word: בְּנֵי אֲנָשָׁא
  choice: les êtres humains
  rationale: L’expression araméenne signifie littéralement « les fils des hommes », mais elle désigne ici les humains en général, par contraste avec les bêtes.
- source_word: לִבְבֵהּ עִם חֵיוְתָא שוי
  choice: Son cœur devint semblable à celui des bêtes
  rationale: « Cœur » conserve l’image araméenne et peut englober la pensée, la volonté et les dispositions intérieures. « Devint semblable » exprime naturellement le changement d’état sans préciser artificiellement son mécanisme.
- source_word: עֲרָדַיָּא
  choice: les ânes sauvages
  rationale: Le terme désigne les onagres, c’est-à-dire des ânes sauvages. La formulation choisie est précise et immédiatement compréhensible.
- source_word: יְטַעֲמוּנֵּהּ
  choice: On lui donna à manger
  rationale: La forme causative signifie qu’on lui fit manger ou qu’on lui donna à manger. Le sujet n’étant pas exprimé, le pronom indéfini « on » évite d’en inventer un.
- source_word: כְתוֹרִין
  choice: comme aux bœufs
  rationale: La comparaison porte sur la manière dont il reçoit l’herbe comme nourriture. « Bœufs » conserve l’image concrète du texte.
- source_word: יִצְטַבַּע
  choice: fut trempé
  rationale: La forme passive indique que son corps fut fortement mouillé par la rosée; « trempé » en restitue l’intensité.
- source_word: אֱלָהָא עליא
  choice: le Dieu Très-Haut
  rationale: Cette formulation française naturelle conserve à la fois le nom divin et le titre « Très-Haut ».
- source_word: בְּמַלְכוּת אֲנָשָׁא
  choice: sur le royaume des humains
  rationale: Le terme אֲנָשָׁא est générique. « Des humains » évite une lecture exclusivement masculine et préserve l’idée du domaine royal humain.
- source_word: יְהָקֵים עליה
  choice: il établit à sa tête
  rationale: Le verbe signifie établir ou installer, et la tournure française « à sa tête » rend la préposition « sur lui », dont l’antécédent est le royaume.
theological_decisions:
- issue: Affirmation de la souveraineté divine sur le pouvoir humain
  choice: le Dieu Très-Haut règne sur le royaume des humains et il établit à sa tête qui il veut
  alternative: le Dieu Très-Haut est souverain sur le royaume des humains et y nomme qui il désire
  rationale: « Règne » et « établit » rendent directement les verbes araméens sans transformer l’énoncé en terminologie théologique technique ni atténuer l’action divine.
- issue: Portée générique de אֲנָשָׁא
  choice: les êtres humains / le royaume des humains
  alternative: les fils des hommes / le royaume des hommes
  rationale: Dans les deux occurrences, le terme vise l’humanité en général et non les seuls hommes de sexe masculin. Le choix garde cette portée tout en maintenant le contraste entre l’existence humaine et celle des animaux.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases ont été légèrement segmentées pour éviter une accumulation lourde de coordinations, tout en conservant la progression de l’araméen. Les images concrètes (« cœur », « bêtes », « bœufs », « rosée ») et l’affirmation finale de souveraineté sont maintenues.
