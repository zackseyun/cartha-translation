  text: בֵּ/אדַ֗יִן הַיְתִיו֙ מָאנֵ֣י דַהֲבָ֔/א דִּ֣י הַנְפִּ֗קוּ מִן הֵֽיכְלָ֛/א דִּֽי בֵ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/אִשְׁתִּ֣יו בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/003.yaml
  text: Then they brought in the gold vessels that had been taken out of the temple[a], the house of God, which was in Jerusalem, and the king and his nobles[b], his wives and his concubines drank from them.
translation:
  language: fr
  text: Alors on apporta les vases d’or qu’on avait emportés du temple, la maison de Dieu qui était à Jérusalem, et le roi, ses hauts dignitaires, ses épouses[a] et ses concubines burent dans ces vases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses reines ». Le terme araméen peut désigner les épouses ou les consorts royales.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression du récit de façon naturelle et actuelle.
- source_word: הַיְתִיו
  choice: on apporta
  rationale: Avec les récipients comme objet, le verbe désigne leur introduction dans la salle; le sujet indéfini français évite d’ajouter une identité absente du texte.
- source_word: מָאנֵי דַהֲבָא
  choice: les récipients d’or
  rationale: « Récipients » convient aux objets cultuels servant ici à boire, tout en restant plus naturel en français moderne que « vases ».
- source_word: דִּי הַנְפִּקוּ
  choice: qu’on avait emportés
  rationale: Le verbe est actif dans l’araméen, avec un sujet non exprimé; cette formulation conserve cette indétermination.
- source_word: מִן הֵיכְלָא
  choice: du temple
  rationale: Dans ce contexte, le terme désigne le temple de Jérusalem.
- source_word: דִּי בֵית אֱלָהָא
  choice: la maison de Dieu
  rationale: Apposition explicative à « temple », conservant l’expression biblique sans lourdeur excessive.
- source_word: דִּי בִירוּשְׁלֶם
  choice: qui était à Jérusalem
  rationale: Rend explicitement la relative locative rattachée à la maison de Dieu.
- source_word: וְאִשְׁתִּיו בְּהוֹן
  choice: y burent
  rationale: Le pronom « y » renvoie naturellement aux récipients et exprime leur emploi pour boire.
- source_word: מַלְכָּא
  choice: le roi
  rationale: Équivalent direct et naturel.
- source_word: רַבְרְבָנוֹהִי
  choice: ses hauts dignitaires
  rationale: Désigne les grands personnages ou hauts responsables du roi; « hauts dignitaires » est clair et digne en français international.
- source_word: שֵׁגְלָתֵהּ
  choice: ses épouses
  rationale: Le terme peut désigner les femmes ou consorts royales; « épouses » est transparent sans supposer qu’elles portaient toutes le titre de reine.
- source_word: וּלְחֵנָתֵהּ
  choice: ses concubines
  rationale: Équivalent traditionnel et précis pour les femmes de statut secondaire dans la maisonnée royale.
theological_decisions: []
