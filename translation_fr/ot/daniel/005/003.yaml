    issue: Le pronom « y » dans « y burent » est ambigu.
    rationale: En français, « y » renvoie normalement à un lieu et ne désigne pas clairement des contenants. L’araméen בְּהוֹן signifie que les personnes boivent en se servant des vases.
  revised_text: Alors on apporta les vases d’or qu’on avait emportés du temple, la maison de Dieu qui était à Jérusalem, et le roi, ses hauts dignitaires, ses épouses[a] et ses concubines burent dans ces vases.
