  text: אִיתַ֨י גְּבַ֜ר בְּ/מַלְכוּתָ֗/ךְ דִּ֠י ר֣וּחַ אֱלָהִ֣ין קַדִּישִׁין֮ בֵּ/הּ֒ וּ/בְ/יוֹמֵ֣י אֲב֗/וּךְ נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה כְּ/חָכְמַת אֱלָהִ֖ין הִשְׁתְּכַ֣חַת בֵּ֑/הּ וּ/מַלְכָּ֤/א נְבֻֽכַדְנֶצַּר֙ אֲב֔/וּךְ רַ֧ב חַרְטֻמִּ֣ין אָֽשְׁפִ֗ין כַּשְׂדָּאִין֙ גָּזְרִ֔ין הֲקִימֵ֖/הּ אֲב֥/וּךְ מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/011.yaml
  text: There is a man in your kingdom in whom is a spirit of the holy gods[a], and in the days of your father light and insight and wisdom like the wisdom of the gods were found in him. And King Nebuchadnezzar, your father, appointed him chief of the magicians, enchanters, Chaldeans, and diviners—your father[b], the king.
translation:
  language: fr
  text: Il y a dans ton royaume un homme en qui se trouve un esprit des dieux saints[a]. Du temps de ton père, on trouva en lui lumière, intelligence et une sagesse semblable à celle des dieux. Le roi Nabuchodonosor, ton père, l’a établi chef des magiciens, des enchanteurs, des Chaldéens et des devins — ton père[b], le roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Esprit du Dieu saint » ou « un esprit du Dieu saint ». L’araméen emploie le pluriel (« dieux »), mais certains comprennent les paroles de la reine comme une référence au Dieu unique.'
    reason: alternative_reading
  - marker: b
    text: Dans ce contexte de cour et de dynastie, « ton père » peut aussi signifier « ton ancêtre » ou « ton prédécesseur ».
    reason: cultural_note
lexical_decisions:
- source_word: אִיתַי גְּבַר בְּמַלְכוּתָךְ
  choice: Il y a dans ton royaume un homme
  rationale: Rend directement la tournure existentielle araméenne dans un français naturel, sans ajouter l’idée d’un homme « certain ».
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: un esprit des dieux saints
  rationale: Les formes araméennes « dieux » et « saints » sont morphologiquement plurielles et correspondent au langage de la cour babylonienne; la lecture monothéiste reste signalée en note.
- source_word: נַהִירוּ
  choice: lumière
  rationale: Conserve la métaphore de l’illumination intellectuelle présente dans l’araméen.
- source_word: שָׂכְלְתָנוּ
  choice: intelligence
  rationale: Exprime ici la faculté de comprendre et de discerner, dans un français courant et digne.
- source_word: חָכְמָה כְּחָכְמַת אֱלָהִין
  choice: sagesse, une sagesse semblable à celle des dieux
  rationale: La reprise de « sagesse » clarifie naturellement en français que la comparaison porte sur cette qualité, tout en maintenant le pluriel araméen.
- source_word: רַב חַרְטֻמִּין אָשְׁפִין כַּשְׂדָּאִין גָּזְרִין
  choice: chef des magiciens, des enchanteurs, des Chaldéens et des devins
  rationale: Rend les quatre groupes de spécialistes de la cour de façon distincte et intelligible; « Chaldéens » désigne ici une classe de sages de cour.
- source_word: אֲבוּךְ
  choice: ton père
  rationale: Conserve l’expression répétée du texte source, dont la portée dynastique plus large est expliquée en note.
theological_decisions:
- issue: Sens de אֱלָהִין קַדִּישִׁין et אֱלָהִין dans le discours de la reine
  choice: « les dieux saints » et « les dieux » au pluriel
  alternative: « le Dieu saint » / « Dieu », ou « l’Esprit du Dieu saint »
  rationale: Le pluriel respecte la morphologie araméenne et le point de vue narratif d’une locutrice de la cour babylonienne, sans imposer une harmonisation monothéiste. L’autre compréhension est conservée en note.
- issue: Rapport entre Nabuchodonosor et Belshatsar exprimé par « ton père »
  choice: Maintenir « ton père » dans le texte principal
  alternative: « ton ancêtre » ou « ton prédécesseur »
  rationale: L’araméen répète littéralement « ton père »; dans le langage ancien de cour et de dynastie, ce terme peut avoir un sens plus large que celui de père biologique. La note préserve cette nuance sans remplacer le texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement royal suit la deuxième personne singulière du texte. La syntaxe a été légèrement réorganisée en deux phrases pour éviter une accumulation lourde, tandis que la répétition emphatique de « ton père » est maintenue.
