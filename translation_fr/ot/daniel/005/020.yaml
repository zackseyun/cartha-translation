id: DAN.5.20
reference: Daniel 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/כְ/דִי֙ רִ֣ם לִבְבֵ֔/הּ וְ/רוּחֵ֖/הּ תִּֽקְפַ֣ת לַ/הֲזָדָ֑ה הָנְחַת֙ מִן כָּרְסֵ֣א מַלְכוּתֵ֔/הּ וִֽ/יקָרָ֖/ה הֶעְדִּ֥יוּ מִנֵּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/020.yaml
  text: But when his heart was lifted up and his spirit was hardened in arrogance[a], he was brought down from his royal throne[b], and his glory was taken away from him.
translation:
  language: fr
  text: Mais lorsque son cœur s’est élevé et que son esprit s’est endurci dans l’orgueil[a], il a été abaissé de son trône royal, et sa gloire[b] lui a été retirée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son esprit est devenu arrogant »; ou « son esprit s’est affermi dans la présomption ».
    reason: lexical_alternative
  - marker: b
    text: Ou « son honneur »; ou « sa majesté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְדִי
  choice: Mais lorsque
  rationale: La conjonction araméenne introduit la circonstance temporelle du jugement; « Mais » rend aussi le contraste avec le contexte précédent.
- source_word: רִם לִבְבֵהּ
  choice: son cœur s’est élevé
  rationale: Cette formulation conserve la métaphore du cœur qui s’élève tout en évoquant naturellement l’orgueil en français.
- source_word: וְרוּחֵהּ תִּקְפַת לַהֲזָדָה
  choice: son esprit s’est endurci dans l’orgueil
  rationale: « S’est endurci » rend l’idée de devenir fort ou inflexible, tandis que « dans l’orgueil » exprime la présomption arrogante sans effacer la tension lexicale.
- source_word: הָנְחַת
  choice: il a été abaissé
  rationale: Le passif garde l’agent implicite et préserve le contraste entre le cœur qui s’élève et le roi qui est abaissé.
- source_word: מִן כָּרְסֵא מַלְכוּתֵהּ
  choice: de son trône royal
  rationale: Rendu français naturel de « trône de sa royauté », qui conserve l’idée de la position et du pouvoir royaux.
- source_word: וִיקָרֵהּ
  choice: sa gloire
  rationale: Le terme araméen peut désigner la gloire, l’honneur ou la majesté; « gloire » convient au contexte royal, tandis qu’une note préserve les autres nuances.
- source_word: הֶעְדִּיוּ מִנֵּהּ
  choice: lui a été retirée
  rationale: Le passif français rend naturellement le pluriel à sujet indéfini sans introduire un agent que le verset ne nomme pas.
theological_decisions:
- issue: Nature de l’abaissement de Nabuchodonosor
  choice: Le verset décrit son humiliation et la perte de sa dignité royale sans nommer explicitement l’agent.
  alternative: Expliciter que Dieu l’a abaissé et lui a retiré sa gloire.
  rationale: Les formes passive et à sujet indéfini laissent ici l’agent implicite. Le contexte plus large permet de reconnaître l’action divine sans l’ajouter explicitement dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du cœur élevé et son contraste avec l’abaissement sont conservés; les passifs évitent de préciser un agent absent de la formulation immédiate.
