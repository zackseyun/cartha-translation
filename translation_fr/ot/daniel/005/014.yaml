  text: וְ/שִׁמְעֵ֣ת עלי/ך דִּ֛י ר֥וּחַ אֱלָהִ֖ין בָּ֑/ךְ וְ/נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה יַתִּירָ֖ה הִשְׁתְּכַ֥חַת בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/014.yaml
  text: And I have heard about you that the spirit of the gods is in you[b][a], and that light and insight and extraordinary wisdom are found in you.
translation:
  language: fr
  text: J’ai entendu dire à ton sujet que l’esprit des dieux est en toi[a], et que la lumière[b], l’intelligence et une sagesse extraordinaire se trouvent en toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit de Dieu » ou « l’Esprit de Dieu ». L’araméen dit littéralement « l’esprit des dieux », selon la manière de parler du roi.
    reason: alternative_reading
  - marker: b
    text: Littéralement « lumière » ou « éclat » ; le mot évoque ici la clarté d’esprit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁמְעֵת עֲלָיִךְ
  choice: J’ai entendu dire à ton sujet
  rationale: Le parfait araméen rapporte une information parvenue au roi; cette tournure est naturelle en français moderne et conserve le sens de « concernant toi ».
- source_word: דִּי
  choice: que
  rationale: La particule introduit ici le contenu de ce que le roi a entendu.
- source_word: רוּחַ אֱלָהִין
  choice: l’esprit des dieux
  rationale: אֱלָהִין est morphologiquement pluriel et la formulation appartient au discours du roi babylonien; le pluriel préserve son point de vue sans imposer une lecture théologique ultérieure.
- source_word: בָּךְ
  choice: est en toi
  rationale: Rendu locatif simple, direct et idiomatique.
- source_word: נַהִירוּ
  choice: lumière
  rationale: Le nom signifie littéralement « lumière » ou « éclat » et fonctionne ici comme métaphore de la clarté intellectuelle; « lumière » conserve cette image.
- source_word: שָׂכְלְתָנוּ
  choice: intelligence
  rationale: Le terme désigne la compréhension ou le discernement; « intelligence » est clair, digne et distinct de « sagesse » dans l’énumération.
- source_word: חָכְמָה יַתִּירָה
  choice: une sagesse extraordinaire
  rationale: יַתִּירָה exprime ce qui dépasse l’ordinaire; « extraordinaire » restitue naturellement cette intensification.
- source_word: הִשְׁתְּכַחַת
  choice: on trouve en toi
  rationale: Le verbe signifie « être trouvé »; la construction impersonnelle française permet de coordonner naturellement les trois qualités.
theological_decisions:
- issue: Faut-il rendre אֱלָהִין par le singulier « Dieu » ou par le pluriel « dieux » dans les paroles du roi païen ?
  choice: l’esprit des dieux
  alternative: l’esprit de Dieu ou l’Esprit de Dieu
  rationale: Le locuteur est Belshatsar et l’araméen porte une forme plurielle conforme au langage de la cour babylonienne. Le pluriel respecte donc la perspective du personnage. Une note conserve la lecture monothéiste possible sans l’introduire dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier. L’ordre de l’araméen est légèrement réorganisé dans la seconde proposition pour éviter une tournure passive lourde, tout en conservant l’énumération et la métaphore de la lumière.
