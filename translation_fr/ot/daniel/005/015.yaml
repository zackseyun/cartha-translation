  text: וּ/כְעַ֞ן הֻעַ֣לּוּ קָֽדָמַ֗/י חַכִּֽימַיָּ/א֙ אָֽשְׁפַיָּ֔/א דִּֽי כְתָבָ֤/ה דְנָה֙ יִקְר֔וֹן וּ/פִשְׁרֵ֖/הּ לְ/הוֹדָעֻתַ֑/נִי וְ/לָֽא כָהֲלִ֥ין פְּשַֽׁר מִלְּתָ֖/א לְ/הַחֲוָיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/015.yaml
  text: And now the wise men, the enchanters, have been brought before me to read this writing and make its interpretation known to me, but they were not able to show the interpretation of the message.
translation:
  language: fr
  text: Et maintenant, les sages et les enchanteurs ont été amenés devant moi pour lire cette inscription et m’en faire connaître l’interprétation, mais ils n’ont pas été capables d’en indiquer le sens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכִּימַיָּא
  choice: les sages
  rationale: Équivalent naturel et traditionnel du terme araméen désignant les savants ou conseillers de la cour.
- source_word: אָשְׁפַיָּא
  choice: les enchanteurs
  rationale: Rend la catégorie de spécialistes occultes de la cour sans la confondre avec l’ensemble plus large des « sages ».
- source_word: כְתָבָה דְנָה
  choice: cette inscription
  rationale: Dans le contexte de l’écriture tracée sur le mur, « inscription » est plus idiomatique et précis que le simple « écrit ».
- source_word: פִשְׁרֵהּ / פְּשַׁר מִלְּתָא
  choice: l’interprétation / le sens
  rationale: Le premier emploi est rendu formellement par « interprétation »; le second par « sens » afin d’exprimer naturellement l’interprétation du message sans répétition pesante.
- source_word: לְהַחֲוָיָה
  choice: indiquer
  rationale: Reflète l’idée de montrer ou d’exposer l’interprétation, plutôt que de répéter simplement « faire connaître ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La syntaxe conserve la progression de l’araméen et la distinction entre les sages et les enchanteurs.
