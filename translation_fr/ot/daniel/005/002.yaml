  text: בֵּלְשַׁאצַּ֞ר אֲמַ֣ר בִּ/טְעֵ֣ם חַמְרָ֗/א לְ/הַיְתָיָה֙ לְ/מָאנֵי֙ דַּהֲבָ֣/א וְ/כַסְפָּ֔/א דִּ֤י הַנְפֵּק֙ נְבוּכַדְנֶצַּ֣ר אֲב֔/וּהִי מִן הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וְ/יִשְׁתּ֣וֹן בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/002.yaml
  text: Belshazzar gave the order[a], as he tasted the wine, to bring the vessels of gold and silver that Nebuchadnezzar his father had taken out of the temple that was in Jerusalem, so that the king and his nobles, his wives and his concubines[b], might drink from them.
translation:
  language: fr
  text: Alors qu’il goûtait le vin[a], Belshatsar ordonna d’apporter les récipients d’or et d’argent que Nabuchodonosor, son père[b], avait retirés du temple de Jérusalem, afin que le roi, ses hauts dignitaires, ses femmes et ses concubines boivent dans ces récipients.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous l’effet du vin » ; l’expression araméenne signifie littéralement « dans le goût du vin ».
    reason: lexical_alternative
  - marker: b
    text: 'Araméen : « son père » ; dans le langage royal, ce terme peut aussi désigner un ancêtre ou un prédécesseur.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַר
  choice: ordonna
  rationale: Le verbe signifie couramment « dire », mais il introduit ici la directive d’apporter les récipients. « Ordonna » rend naturellement cette valeur performative dans le contexte royal.
- source_word: בִּטְעֵם חַמְרָא
  choice: alors qu’il goûtait le vin
  rationale: L’expression signifie littéralement « dans le goût du vin ». Cette formulation conserve l’image concrète sans affirmer explicitement que le roi était ivre, tout en laissant cette implication contextuelle possible.
- source_word: לְהַיְתָיָה
  choice: d’apporter
  rationale: La forme causative demande que les récipients soient amenés auprès du roi. « Apporter » est naturel et précis dans ce contexte.
- source_word: מָאנֵי דַּהֲבָא וְכַסְפָּא
  choice: les récipients d’or et d’argent
  rationale: Le terme araméen désigne largement des objets ou récipients. « Récipients » convient à leur emploi pour boire sans les réduire nécessairement à des coupes.
- source_word: הַנְפֵּק
  choice: avait retirés
  rationale: Le verbe signifie « faire sortir » ou « retirer ». « Avait retirés » exprime clairement l’enlèvement des objets sacrés hors du temple.
- source_word: אֲבוּהִי
  choice: son père
  rationale: Le texte porte le terme ordinaire pour « père ». La traduction le conserve, tandis qu’une note signale son emploi royal plus large.
- source_word: הֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: du temple de Jérusalem
  rationale: « Temple » est ici le sens contextuel clair de הֵיכְלָא. La tournure française concise « de Jérusalem » rend naturellement la relation exprimée en araméen.
- source_word: וְיִשְׁתּוֹן בְּהוֹן
  choice: afin que … y boivent
  rationale: L’imparfait araméen exprime le but de l’ordre. En français, « y boire » renvoie naturellement aux récipients et évite la tournure moins idiomatique « boire d’eux ».
- source_word: רַבְרְבָנוֹהִי
  choice: ses hauts dignitaires
  rationale: Le terme désigne les grands du royaume ou de hauts responsables. « Hauts dignitaires » est clair en français moderne et convient au cadre de la cour.
- source_word: שֵׁגְלָתֵהּ
  choice: ses femmes
  rationale: Le mot désigne les femmes ou épouses du roi. « Femmes » est le rendu français le plus large et n’attribue pas à chacune un rang formel de reine.
- source_word: לְחֵנָתֵהּ
  choice: ses concubines
  rationale: Le terme désigne des femmes de statut inférieur à celui des épouses dans la maison royale. « Concubines » en est l’équivalent français précis et usuel.
theological_decisions:
- issue: Lien de parenté royal entre Nabuchodonosor et Belshatsar
  choice: Conserver « son père » dans le texte principal
  alternative: « son ancêtre » ou « son prédécesseur »
  rationale: L’araméen emploie le terme ordinaire pour « père », mais celui-ci peut avoir un sens dynastique plus large dans le langage royal. Le texte garde donc la formulation source et la note préserve la nuance historique sans trancher à sa place.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit le mouvement du récit araméen tout en plaçant le complément temporel en tête pour une lecture naturelle. Les termes de cour restent précis sans archaïsme inutile.
