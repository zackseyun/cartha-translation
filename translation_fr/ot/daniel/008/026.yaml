source:
  edition: WLC
  text: וּ/מַרְאֵ֨ה הָ/עֶ֧רֶב וְ/הַ/בֹּ֛קֶר אֲשֶׁ֥ר נֶאֱמַ֖ר אֱמֶ֣ת ה֑וּא וְ/אַתָּה֙ סְתֹ֣ם הֶֽ/חָז֔וֹן כִּ֖י לְ/יָמִ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/026.yaml
  text: And the vision of the evening and the morning that was spoken is true; but you, seal up the vision, for it concerns many days from now.
translation:
  language: fr
  text: La vision des soirs et des matins dont il a été question est vraie. Quant à toi, garde la vision secrète, car elle concerne des jours encore lointains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַרְאֵה
  choice: vision
  rationale: Désigne ici la révélation vue par Daniel; « vision » est naturel et cohérent avec le contexte.
- source_word: הָעֶרֶב וְהַבֹּקֶר
  choice: des soirs et des matins
  rationale: Conserve le pluriel collectif implicite et le lien avec les « soirs et matins » de Daniel 8.14, sans réduire l’expression à une seule soirée et une seule matinée.
- source_word: נֶאֱמַר
  choice: dont il a été question
  rationale: Rend le passif « qui a été dit » en français idiomatique tout en renvoyant à la révélation précédemment énoncée.
- source_word: אֱמֶת הוּא
  choice: est vraie
  rationale: Affirme la véracité et la fiabilité de la vision, conformément au sens direct de l’hébreu.
- source_word: סְתֹם
  choice: tiens … secrète
  rationale: Le verbe signifie fermer ou rendre inaccessible. Dans ce contexte, l’idée est de préserver la vision sans la rendre publiquement accessible; cette formulation évite l’image française potentiellement trompeuse de « sceller » une vision.
- source_word: לְיָמִים רַבִּים
  choice: des jours encore lointains
  rationale: Expression temporelle indiquant que l’accomplissement se situe dans un avenir éloigné, plutôt qu’une simple durée de « nombreux jours ».
theological_decisions:
- issue: Portée temporelle de לְיָמִים רַבִּים
  choice: elle concerne des jours encore lointains
  alternative: elle concerne de nombreux jours
  rationale: 'Le contexte explique pourquoi la vision doit rester inaccessible: elle vise une époque éloignée. La traduction conserve cette portée sans préciser davantage l’identité ou la date de l’accomplissement.'
- issue: Sens de l’ordre סְתֹם
  choice: tiens cette vision secrète
  alternative: scelle la vision
  rationale: L’ordre peut évoquer fermeture, conservation ou mise à l’écart. « Tiens … secrète » exprime clairement l’effet pragmatique sans importer une doctrine particulière sur la révélation ou son interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste proche de la structure hébraïque, avec une légère explicitation idiomatique. Aucun marqueur de note n’est nécessaire.
