  source_fidelity: 'Le sens des principaux termes est bien rendu : les deux « êtres saints », l’offrande régulière (תמיד), la transgression dévastatrice, le sanctuaire et l’armée. La note sur Palmoni préserve correctement l’incertitude de לַפַּלְמוֹנִי. Toutefois, « au piétinement » est une transposition nominale peu idiomatique et rend moins clairement la destination exprimée par מִרְמָס. La formulation révisée explicite aussi que le sanctuaire et l’armée sont ensemble livrés à être foulés aux pieds.'
  naturalness: Le registre est moderne, sobre et approprié. « Pour qu’ils soient foulés aux pieds » est nettement plus naturel en français international que « au piétinement », tout en restant fidèle au sens de profanation.
  terminology: « Être saint », « offrande régulière », « sanctuaire » et « transgression dévastatrice » sont appropriés. « Armée » demeure un rendu recevable de צָבָא, à condition que la note conserve explicitement l’incertitude quant au référent.
