source:
  edition: WLC
  text: וָ/אֶשְׁמְעָ֥/ה אֶֽחָד קָד֖וֹשׁ מְדַבֵּ֑ר וַ/יֹּאמֶר֩ אֶחָ֨ד קָד֜וֹשׁ לַ/פַּֽלְמוֹנִ֣י הַֽ/מְדַבֵּ֗ר עַד מָתַ֞י הֶ/חָז֤וֹן הַ/תָּמִיד֙ וְ/הַ/פֶּ֣שַׁע שֹׁמֵ֔ם תֵּ֛ת וְ/קֹ֥דֶשׁ וְ/צָבָ֖א מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/013.yaml
  text: Then I heard a holy one speaking[a], and one holy one said to the one speaking, “How long is the vision concerning the regular burnt offering and the desolating transgression[d][c][b], and the giving over of both the sanctuary and the host to be trampled?”
translation:
  language: fr
  text: 'Puis j’entendis un être saint parler, et un autre être saint dit à celui qui parlait[a] : « Jusqu’à quand se prolongera la vision concernant l’offrande régulière[b] et la transgression dévastatrice[c], ainsi que la livraison du sanctuaire et de l’armée[d] pour qu’ils soient foulés aux pieds ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « à Palmoni, qui parlait », si לַפַּלְמוֹנִי est compris comme un nom propre ou un titre plutôt que comme une désignation indéfinie.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionnellement : « le sacrifice quotidien » ou « l’holocauste perpétuel ». Le mot hébreu תָּמִיד désigne ici l’offrande régulièrement présentée dans le service du sanctuaire.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « la transgression qui dévaste ».'
    reason: lexical_alternative
  - marker: d
    text: Le mot traduit par « armée » peut désigner le peuple associé au sanctuaire, une armée ou une autre collectivité ; son référent précis reste incertain ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדוֹשׁ
  choice: être saint
  rationale: Dans le cadre de la vision, l’adjectif substantivé désigne vraisemblablement un être céleste. « Être saint » évite les connotations ecclésiales possibles de « saint » employé seul, sans préciser davantage par « ange ».
- source_word: לַפַּלְמוֹנִי הַמְדַבֵּר
  choice: à celui qui parlait
  rationale: L’expression obscure est rendue comme la désignation indéfinie de l’interlocuteur. La possibilité d’un nom propre ou d’un titre est conservée en note.
- source_word: הֶחָזוֹן
  choice: la vision concernant
  rationale: La relation entre « la vision » et les éléments qui suivent est explicitée avec discrétion afin de rendre en français la syntaxe hébraïque très condensée.
- source_word: הַתָּמִיד
  choice: l’offrande régulière
  rationale: Le substantif désigne l’offrande cultuelle accomplie régulièrement. Le texte hébreu ne précise pas ici à lui seul qu’il s’agit d’un holocauste, d’où la formulation plus sobre.
- source_word: הַפֶּשַׁע שֹׁמֵם
  choice: la transgression dévastatrice
  rationale: Cette formulation compacte conserve à la fois l’idée de transgression ou de rébellion et son effet dévastateur, sans transformer l’expression en formule technique ultérieure.
- source_word: תֵּת
  choice: la livraison
  rationale: Le nom verbal français rend la valeur infinitive du mot hébreu et exprime le fait de livrer le sanctuaire et l’armée au piétinement.
- source_word: קֹדֶשׁ
  choice: le sanctuaire
  rationale: Dans ce contexte cultuel, le terme renvoie concrètement au lieu saint plutôt qu’à la sainteté comme notion abstraite.
- source_word: צָבָא
  choice: l’armée
  rationale: Le mot peut désigner une armée, une troupe ou une collectivité organisée. « Armée » est le correspondant français le plus direct, tandis qu’une note maintient l’incertitude sur son référent précis.
- source_word: מִרְמָס
  choice: au piétinement
  rationale: Cette tournure nominale reste proche de l’hébreu et exprime la profanation par le fait d’être foulé aux pieds.
theological_decisions:
- issue: Identité des êtres saints
  choice: Des êtres célestes, sans les appeler explicitement des anges
  alternative: Des saints humains
  rationale: Le cadre visionnaire de Daniel favorise l’interprétation céleste, mais la traduction garde le terme « saint » du texte source au lieu d’introduire le mot « ange ».
- issue: Référent de צָבָא
  choice: Maintenir un terme collectif large, « armée », sans identifier son référent
  alternative: Le peuple de Dieu, l’armée céleste ou une armée terrestre
  rationale: Le contexte ne permet pas de trancher avec certitude. La note expose donc l’éventail sémantique sans résoudre la tension interprétative.
- issue: Nature précise de הַתָּמִיד
  choice: « l’offrande régulière »
  alternative: « l’holocauste perpétuel » ou « le sacrifice quotidien »
  rationale: Le terme exprime directement la régularité ou la continuité de l’offrande, tandis que sa qualification plus précise comme holocauste dépend du contexte cultuel plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure interrogative et la coordination du texte hébreu, tout en rendant explicite le lien condensé entre la vision et son contenu. « Un autre être saint » traduit naturellement la succession de deux interlocuteurs sans préciser leur identité.
