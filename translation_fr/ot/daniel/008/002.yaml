source:
  edition: WLC
  text: וָֽ/אֶרְאֶה֮ בֶּ/חָזוֹן֒ וַ/יְהִי֙ בִּ/רְאֹתִ֔/י וַ/אֲנִי֙ בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֔ה אֲשֶׁ֖ר בְּ/עֵילָ֣ם הַ/מְּדִינָ֑ה וָ/אֶרְאֶה֙ בֶּֽ/חָז֔וֹן וַ/אֲנִ֥י הָיִ֖יתִי עַל אוּבַ֥ל אוּלָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/002.yaml
  text: And I saw in the vision[a], and when I saw, I was in Susa the citadel, which is in the province of Elam; and I saw in the vision that I was beside the Ulai Canal.
translation:
  language: fr
  text: Je vis dans la vision ; et, lorsque je regardais, je me trouvais à Suse, la citadelle, qui est dans la province d’Élam. Je vis dans la vision que j’étais près du canal d’Oulaï.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « près de la rivière Oulaï » ou « près du cours d’eau Oulaï ». Le terme hébreu peut désigner différents types de cours d’eau, mais « canal » convient bien au cadre probable de Suse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Je regardai / je vis
  rationale: Le verbe ראה décrit ici l’expérience visionnaire passée. La variation française évite une répétition pesante tout en conservant le sens de perception visuelle des deux occurrences.
- source_word: בֶּחָזוֹן
  choice: dans la vision
  rationale: La formulation désigne la vision particulière déjà introduite dans le contexte, plutôt qu’une vision indéterminée.
- source_word: וַיְהִי בִּרְאֹתִי
  choice: tandis que je regardais
  rationale: L’expression hébraïque introduit une circonstance temporelle. Cette tournure naturelle garde l’aspect continu de l’observation sans reproduire littéralement l’idiome hébreu.
- source_word: בְּשׁוּשַׁן
  choice: à Suse
  rationale: « Suse » est la forme française usuelle du nom de lieu.
- source_word: הַבִּירָה
  choice: la citadelle
  rationale: בִּירָה désigne un centre royal ou administratif fortifié. « Citadelle » préserve cette dimension sans réduire le lieu au seul palais.
- source_word: אֲשֶׁר בְּעֵילָם הַמְּדִינָה
  choice: située dans la province d’Élam
  rationale: La relative localise Suse dans la circonscription administrative d’Élam; la formulation est idiomatique en français moderne.
- source_word: וַאֲנִי הָיִיתִי
  choice: je vis que j’étais
  rationale: Dans la seconde proposition, ces mots expriment le contenu perçu dans la vision. « Que » explicite naturellement ce rapport en français.
- source_word: עַל
  choice: près de
  rationale: Avec un cours d’eau, עַל marque naturellement la proximité plutôt qu’une position littérale au-dessus ou sur celui-ci.
- source_word: אוּבַל
  choice: canal
  rationale: Le nom désigne un cours d’eau ou chenal; « canal » convient bien au cadre hydraulique probable de Suse, tout en laissant les autres possibilités dans la note.
- source_word: אוּלָי
  choice: Oulaï
  rationale: Il s’agit d’un nom propre, translittéré selon des conventions françaises lisibles.
theological_decisions:
- issue: 'Présence de Daniel à Suse : physique ou visionnaire'
  choice: 'Formulation non résolutive : « dans la vision, je vis que j’étais »'
  alternative: « j’étais à Suse » compris comme une présence physique certaine
  rationale: Le texte peut décrire soit l’emplacement de Daniel, soit sa présence au sein de la vision. La traduction conserve cette tension au lieu de trancher.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple soutient le registre narratif biblique sans archaïsme marqué. La répétition de « dans la vision » est conservée parce qu’elle appartient à la structure emphatique de l’hébreu.
