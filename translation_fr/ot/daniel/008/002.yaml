  to: Je vis dans la vision ; et, lorsque je regardais, je me trouvais à Suse, la citadelle, qui est dans la province d’Élam. Je vis dans la vision que j’étais près du canal d’Oulaï.[a]
  rationale: La révision resserre la correspondance avec l’idiome temporel hébreu, conserve les deux mentions de la vision dans leur ordre source et préserve l’ambiguïté narrative concernant la présence de Daniel à Suse. Aucun changement de sens théologique n’est introduit.
