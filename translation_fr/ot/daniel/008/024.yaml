source:
  edition: WLC
  text: וְ/עָצַ֤ם כֹּח/וֹ֙ וְ/לֹ֣א בְ/כֹח֔/וֹ וְ/נִפְלָא֥וֹת יַשְׁחִ֖ית וְ/הִצְלִ֣יחַ וְ/עָשָׂ֑ה וְ/הִשְׁחִ֥ית עֲצוּמִ֖ים וְ/עַם קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/024.yaml
  text: His power will become strong[a], but not by his own power. He will bring about extraordinary destruction, and he will succeed and act; he will destroy the mighty and the people of the holy ones.
translation:
  language: fr
  text: Sa puissance gagnera en force, mais non par sa propre puissance. Il causera des destructions extraordinaires ; il réussira et agira ; il détruira les puissants ainsi que le peuple des êtres saints[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le peuple saint » ou « le peuple des saints ».
    reason: La construction hébraïque et le pluriel קְדֹשִׁים permettent ces rendus alternatifs.
lexical_decisions:
- source_word: וְעָצַם כֹּחוֹ
  choice: Sa puissance deviendra grande
  rationale: Le verbe עָצַם exprime ici le fait de devenir puissant ou considérable. En français, « sa puissance deviendra grande » restitue naturellement cette croissance sans confondre la puissance avec la force physique.
- source_word: וְלֹא בְכֹחוֹ
  choice: mais non par sa propre puissance
  rationale: 'La préposition בְּ indique le moyen ou l''instrument. « Sa propre » explicite le contraste interne à la phrase : sa puissance ne proviendra pas de lui-même.'
- source_word: וְנִפְלָאוֹת יַשְׁחִית
  choice: Il causera des destructions extraordinaires
  rationale: נִפְלָאוֹת désigne ce qui est extraordinaire ou stupéfiant ; associé à שׁחת, le terme qualifie l'ampleur saisissante des ravages. Cette formulation française conserve le sens destructeur sans donner à « merveilles » une valeur positive.
- source_word: וְהִצְלִיחַ וְעָשָׂה
  choice: il réussira dans ses entreprises
  rationale: צָלַח signifie réussir ou prospérer, tandis que עָשָׂה désigne l'action accomplie. L'expression française réunit naturellement les deux verbes sans ajouter l'idée non exprimée qu'il agirait « à sa guise ».
- source_word: וְהִשְׁחִית עֲצוּמִים
  choice: détruira les puissants
  rationale: Dans ce contexte d'oppression, שׁחת signifie détruire, et עֲצוּמִים, adjectif substantivé, désigne des personnes puissantes ou fortes.
- source_word: וְעַם קְדֹשִׁים
  choice: le peuple des êtres saints
  rationale: La chaîne construite signifie littéralement « peuple des saints/êtres saints ». « Êtres saints » préserve le pluriel et évite que « les saints » soit spontanément compris comme un titre canonisé propre à une tradition.
theological_decisions:
- issue: Référent et nuance de וְעַם קְדֹשִׁים
  choice: le peuple des êtres saints
  alternative: le peuple saint ; le peuple des saints
  rationale: Le pluriel קְדֹשִׁים peut désigner des êtres saints, tandis que l'ensemble peut aussi être compris idiomatiquement comme le peuple saint. Le texte principal maintient la construction hébraïque et la note conserve les autres lectures sans trancher leur portée théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation fait ressortir la progression des actions. « Dans ses entreprises » rend idiomatiquement la coordination des verbes réussir et agir, sans lui attribuer explicitement une liberté absolue.
