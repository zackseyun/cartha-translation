  text: וּ/רְאִיתִ֞י/ו מַגִּ֣יעַ אֵ֣צֶל הָ/אַ֗יִל וַ/יִּתְמַרְמַ֤ר אֵלָי/ו֙ וַ/יַּ֣ךְ אֶת הָ/אַ֔יִל וַ/יְשַׁבֵּר֙ אֶת שְׁתֵּ֣י קְרָנָ֔י/ו וְ/לֹא הָ֥יָה כֹ֛חַ בָּ/אַ֖יִל לַ/עֲמֹ֣ד לְ/פָנָ֑י/ו וַ/יַּשְׁלִיכֵ֤/הוּ אַ֨רְצָ/ה֙ וַֽ/יִּרְמְסֵ֔/הוּ וְ/לֹא הָיָ֥ה מַצִּ֛יל לָ/אַ֖יִל מִ/יָּדֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/007.yaml
  text: And I saw him come up to the ram[a], and he was enraged against him, and he struck the ram and broke its two horns. And there was no strength in the ram to stand before him; he threw him to the ground and trampled him[d][c][b], and there was no one to rescue the ram from his hand.
translation:
  language: fr
  text: 'Je le vis s’approcher du bélier[a]. Il devint furieux contre lui, frappa le bélier et brisa ses deux cornes. Le bélier n’eut pas la force de lui résister[b] : il le jeta à terre et le piétina. Personne ne put délivrer le bélier de son pouvoir[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parvenir jusqu’à lui ». Le verbe hébreu peut exprimer le fait de s’approcher ou d’arriver auprès de quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de se tenir devant lui » ; dans ce combat, l’expression signifie tenir tête ou résister.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « de sa main ». Cette expression hébraïque désigne ici son emprise ou son pouvoir.'
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתִיו
  choice: Je le vis
  rationale: Le parfait à la première personne avec suffixe masculin singulier poursuit le récit de la vision et renvoie au bouc du contexte.
- source_word: מַגִּיעַ אֵצֶל
  choice: s’approcher de
  rationale: Le participe de נגע avec אֵצֶל exprime le fait d’arriver auprès de quelqu’un ou de l’atteindre; « s’approcher de » est naturel et conserve le mouvement vers le bélier.
- source_word: הָאַיִל
  choice: le bélier
  rationale: C’est le sens ordinaire de אַיִל dans cette vision animale.
- source_word: וַיִּתְמַרְמַר אֵלָיו
  choice: Il devint furieux contre lui
  rationale: Le hitpael de מרר évoque une hostilité intense, une rage nourrie d’amertume; cette formulation rend sa force dans la scène de combat sans ajouter une action absente du texte.
- source_word: וַיַּךְ
  choice: frappa
  rationale: נכה signifie couramment « frapper »; le choix reste direct et laisse les propositions suivantes préciser la violence du coup.
- source_word: וַיְשַׁבֵּר אֶת שְׁתֵּי קְרָנָיו
  choice: brisa ses deux cornes
  rationale: שבר signifie « briser » et le suffixe renvoie aux cornes du bélier.
- source_word: וְלֹא הָיָה כֹחַ בָּאַיִל לַעֲמֹד לְפָנָיו
  choice: Le bélier n’eut pas la force de lui résister
  rationale: כֹחַ désigne ici la force, tandis que « se tenir devant lui », dans ce contexte de combat, exprime naturellement la capacité à tenir tête ou à résister.
- source_word: וַיַּשְׁלִיכֵהוּ אַרְצָה
  choice: il le jeta à terre
  rationale: השליך indique l’action de jeter et אַרְצָה un mouvement vers le sol; « à terre » est idiomatique en français.
- source_word: וַיִּרְמְסֵהוּ
  choice: le piétina
  rationale: רמס désigne le fait de fouler ou piétiner, image violente conservée sans amplification.
- source_word: וְלֹא הָיָה מַצִּיל לָאַיִל מִיָּדוֹ
  choice: Personne ne put délivrer le bélier de son pouvoir
  rationale: מַצִּיל désigne celui qui délivre. L’expression hébraïque « de sa main » signifie ici échapper à son emprise ou à son pouvoir; le français explicite cet idiome.
theological_decisions: []
translation_notes:
  register: Français moderne international, narratif et digne. Les pronoms masculins suivent le genre grammatical et le contexte du bouc et du bélier. La syntaxe a été légèrement resserrée pour une lecture naturelle, tout en préservant la progression et la violence de la scène hébraïque.
