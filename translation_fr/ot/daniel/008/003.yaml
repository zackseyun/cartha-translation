source:
  edition: WLC
  text: וָ/אֶשָּׂ֤א עֵינַ/י֙ וָ/אֶרְאֶ֔ה וְ/הִנֵּ֣ה אַ֣יִל אֶחָ֗ד עֹמֵ֛ד לִ/פְנֵ֥י הָ/אֻבָ֖ל וְ/ל֣/וֹ קְרָנָ֑יִם וְ/הַ/קְּרָנַ֣יִם גְּבֹה֗וֹת וְ/הָ/אַחַת֙ גְּבֹהָ֣ה מִן הַ/שֵּׁנִ֔ית וְ/הַ֨/גְּבֹהָ֔ה עֹלָ֖ה בָּ/אַחֲרֹנָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/003.yaml
  text: Then I lifted up my eyes and saw[a], and behold, one ram was standing before the canal, and it had two horns. The horns were high, but one was higher than the other[b], and the higher one came up last.
translation:
  language: fr
  text: 'Je levai les yeux et je vis : voici qu’un bélier se tenait devant le canal[a]. Il avait deux cornes. Les cornes étaient hautes, mais l’une était plus haute que l’autre, et la plus haute s’éleva la dernière[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cours d’eau » ou « rivière » ; le terme hébreu désigne un cours d’eau et, dans Daniel, probablement un canal.
    reason: lexical_alternative
  - marker: b
    text: Ou « et la plus haute apparut plus tard ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: Je levai les yeux
  rationale: Cette formulation française naturelle conserve l’idiome hébreu qui décrit l’action de diriger son regard, ainsi que le style solennel du récit visionnaire.
- source_word: וָאֶרְאֶה וְהִנֵּה
  choice: 'et je vis : voici que'
  rationale: « Voici que » restitue la force déictique et vivante de הִנֵּה sans alourdir la phrase par une coordination trop littérale.
- source_word: אַיִל אֶחָד
  choice: un bélier
  rationale: אַיִל désigne précisément un bélier. En français, l’article indéfini exprime naturellement l’introduction d’un seul animal; traduire אֶחָד par « un seul » ajouterait ici une insistance peu certaine.
- source_word: עֹמֵד לִפְנֵי הָאֻבָל
  choice: se tenait devant le canal
  rationale: Le participe décrit la position du bélier. Dans Daniel, אֻבָל désigne vraisemblablement un canal ou, plus largement, un cours d’eau; « canal » convient au cadre probable tout en laissant les autres possibilités en note.
- source_word: וְלוֹ קְרָנָיִם
  choice: Il avait deux cornes
  rationale: La construction possessive hébraïque est rendue par la tournure française idiomatique « avoir »; le duel קְרָנָיִם impose le nombre deux.
- source_word: וְהַקְּרָנַיִם גְּבֹהוֹת
  choice: Les cornes étaient hautes
  rationale: « Hautes » rend directement גְּבֹהוֹת et conserve la répétition lexicale avec « plus haute ».
- source_word: וְהָאַחַת גְּבֹהָה מִן הַשֵּׁנִית
  choice: mais l’une était plus haute que l’autre
  rationale: « L’une… l’autre » est l’équivalent français naturel de la comparaison hébraïque; « mais » explicite le contraste déjà porté par le contexte.
- source_word: וְהַגְּבֹהָה עֹלָה בָּאַחֲרֹנָה
  choice: et la plus haute poussa en dernier
  rationale: עֹלָה peut évoquer la montée, l’apparition ou la croissance de la corne. « Poussa » convient à une corne et בָּאַחֲרֹנָה indique qu’elle vint après l’autre, sans préciser davantage la nuance temporelle.
theological_decisions:
- issue: Imagerie animale symbolique de la vision apocalyptique
  choice: Conserver sans explication les images concrètes du bélier et des cornes.
  alternative: Insérer dans le verset l’interprétation historique donnée plus loin dans le chapitre.
  rationale: Le verset rapporte d’abord la vision, tandis que son interprétation vient ensuite. La traduction ne doit ni anticiper cette explication ni réduire la portée symbolique du tableau.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « voici que » maintient la vivacité visionnaire; la syntaxe reste fluide, et les répétitions descriptives de l’hébreu sont conservées lorsqu’elles sont naturelles en français.
