  terminology: « Offrande régulière » rend bien הַתָּמִיד sans imposer « sacrifice quotidien » ni spécifier indûment l’espèce sacrificielle dans le corps du texte. « Transgression », « vérité » et « troupe » sont des choix lexicalement recevables et théologiquement non directifs. Les notes a, b et c sont correctement ancrées et rendent compte des alternatives pertinentes.
