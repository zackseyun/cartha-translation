  source_fidelity: 'Le texte rend fidèlement la syntaxe dense de l’hébreu : צָבָא est conservé comme collectif (« une troupe »), תִּנָּתֵן comme passif (« fut livrée »), et le lien incertain introduit par עַל est prudemment rendu par « avec ». « À cause de la transgression » convient à בְּפָשַׁע sans identifier l’auteur de cette transgression. « Jeta la vérité à terre, agit et réussit » correspond aux trois verbes finaux et maintient leur concision. Le féminin de « elle » et la note associée reflètent correctement les formes verbales féminines singulières, sans trancher leur référent visionnaire.'
