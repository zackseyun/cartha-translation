id: DAN.8.12
reference: Daniel 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/צָבָ֛א תִּנָּתֵ֥ן עַל הַ/תָּמִ֖יד בְּ/פָ֑שַׁע וְ/תַשְׁלֵ֤ךְ אֱמֶת֙ אַ֔רְצָ/ה וְ/עָשְׂתָ֖ה וְ/הִצְלִֽיחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/012.yaml
  text: And a host was given over with the regular burnt offering because of transgression[a]; and it cast truth to the ground[c][b], and it acted and prospered.
translation:
  language: fr
  text: Une troupe fut livrée avec l’offrande régulière[a][b], à cause de la transgression. Elle[c] jeta la vérité à terre, agit et réussit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sacrifice quotidien » ou « l’offrande continuelle ». Le terme hébreu tamid désigne ici l’offrande régulièrement présentée au sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « contre l’offrande régulière ». La préposition hébraïque qui relie la troupe à l’offrande régulière est difficile à interpréter.
    reason: alternative_reading
  - marker: c
    text: Les verbes hébreux sont au féminin singulier. Leur référent précis reste implicite dans cette vision et peut être la puissance hostile symbolisée dans le contexte précédent.
    reason: alternative_reading
lexical_decisions:
- source_word: וְצָבָא
  choice: une troupe
  rationale: צָבָא peut désigner une armée, une troupe ou un ensemble de personnes. « Une troupe » conserve mieux que « une armée » l’ambiguïté entre une force militaire et un groupe collectif, tout en restant naturel en français.
- source_word: תִּנָּתֵן
  choice: fut livrée
  rationale: Le nifal de נתן est passif. « Fut livrée » exprime ici la remise au pouvoir d’une force hostile, sans préciser un agent absent du texte.
- source_word: עַל
  choice: avec
  rationale: La préposition עַל est difficile dans cette construction. « Avec » associe la troupe et l’offrande dans un même sort sans imposer le sens plus interprétatif de « contre ».
- source_word: הַתָּמִיד
  choice: l’offrande régulière
  rationale: Dans ce contexte cultuel, תָּמִיד désigne l’offrande présentée régulièrement au sanctuaire. Cette formulation est claire et ne précise pas dans le corps du texte un élément que le nom hébreu laisse sous-entendu.
- source_word: בְּפָשַׁע
  choice: à cause de la transgression
  rationale: Le beth est compris dans un sens causal. « Transgression » préserve la portée morale et religieuse de פֶּשַׁע sans déterminer qui en est l’auteur.
- source_word: וְתַשְׁלֵךְ אֱמֶת אַרְצָה
  choice: Elle jeta la vérité à terre
  rationale: 'La traduction garde l’image concrète et vigoureuse de l’hébreu : la vérité est jetée au sol. Le pronom féminin correspond à la forme verbale, tandis qu’une note signale l’incertitude du référent.'
- source_word: וְעָשְׂתָה
  choice: agit
  rationale: עשה est employé sans complément exprimé. « Agit » respecte cette concision et évite d’ajouter « comme elle le voulait ».
- source_word: וְהִצְלִיחָה
  choice: réussit
  rationale: Le hifil de צלח peut signifier réussir ou prospérer. « Réussit » convient à l’action d’une puissance et sonne plus naturellement ici que « prospéra ».
theological_decisions:
- issue: Référent des verbes au féminin singulier
  choice: Employer « elle » et signaler que son référent exact demeure incertain.
  alternative: Préciser « la corne » ou employer un masculin personnel.
  rationale: Les formes verbales hébraïques sont au féminin singulier, mais la vision comprime la syntaxe et n’identifie pas explicitement leur sujet. La traduction conserve le genre grammatical sans trancher l’identité de la puissance en cause.
- issue: Sens de תָּמִיד
  choice: Traduire par « l’offrande régulière ».
  alternative: « le sacrifice quotidien », « l’holocauste perpétuel » ou « l’offrande continuelle »
  rationale: Le terme désigne dans ce contexte le service sacrificiel régulier du sanctuaire. « Offrande régulière » rend ce sens sans faire dépendre la traduction d’une formulation confessionnelle ou traditionnelle particulière.
- issue: Rapport entre la troupe et l’offrande régulière
  choice: Les relier par « avec ».
  alternative: « contre l’offrande régulière »
  rationale: La construction avec עַל est difficile. « Avec » préserve l’idée possible d’un sort commun, tandis que la note maintient ouverte la lecture adversative.
translation_notes:
  register: Français international moderne, sobre et soutenu. La phrase conserve la brièveté heurtée de la vision tout en restant intelligible. « Jeta la vérité à terre » maintient l’image concrète du texte, et les notes rendent visibles les principales ambiguïtés syntaxiques et lexicales.
