source:
  edition: WLC
  text: וְ/עַל שִׂכְל֗/וֹ וְ/הִצְלִ֤יחַ מִרְמָה֙ בְּ/יָד֔/וֹ וּ/בִ/לְבָב֣/וֹ יַגְדִּ֔יל וּ/בְ/שַׁלְוָ֖ה יַשְׁחִ֣ית רַבִּ֑ים וְ/עַ֤ל שַׂר שָׂרִים֙ יַעֲמֹ֔ד וּ/בְ/אֶ֥פֶס יָ֖ד יִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/025.yaml
  text: And through his shrewdness he will make deceit prosper in his hand; and in his heart he will magnify himself. In a time of security he will destroy many[a], and he will rise up against the Prince of princes; but he will be broken without hand.
translation:
  language: fr
  text: Grâce à son habileté, la tromperie prospérera entre ses mains. Il s’enorgueillira dans son cœur et, en pleine sécurité, il détruira beaucoup de gens. Il se dressera contre le Prince des princes, mais il sera brisé sans qu’aucune main intervienne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans main ». La formule hébraïque elliptique implique probablement une chute qui ne sera pas provoquée par une puissance humaine ordinaire.'
    reason: Conserve l’expression elliptique dans le texte tout en indiquant, sans l’imposer, son sens idiomatique probable.
lexical_decisions:
- source_word: שִׂכְלוֹ
  choice: son habileté
  rationale: Le terme désigne l’intelligence, la perspicacité ou l’habileté. Dans ce contexte hostile, « habileté » garde la nuance de compétence calculatrice sans ajouter explicitement la malveillance déjà exprimée par « tromperie ».
- source_word: וְהִצְלִיחַ מִרְמָה
  choice: il fera réussir la tromperie
  rationale: 'Le hiphil de צלח est causatif et מִרְמָה en est l’objet : il ne réussit pas simplement lui-même, mais fait aboutir la tromperie.'
- source_word: בְּיָדוֹ
  choice: entre ses mains
  rationale: Cette expression française conserve l’image de la main tout en indiquant naturellement que la tromperie est maniée et contrôlée par lui.
- source_word: וּבִלְבָבוֹ יַגְדִּיל
  choice: il s’enorgueillira dans son cœur
  rationale: Le verbe exprime ici le fait de se grandir soi-même, et le cœur situe cette exaltation dans son for intérieur. « S’enorgueillir » rend naturellement le sens implicite en français.
- source_word: וּבְשַׁלְוָה
  choice: tandis qu’ils se croiront en sécurité
  rationale: שַׁלְוָה peut désigner le calme, l’aisance ou la sécurité. La formulation retient l’état d’insouciance des nombreuses victimes, tout en évitant « en paix », qui pourrait suggérer surtout l’absence de guerre.
- source_word: יַשְׁחִית רַבִּים
  choice: il détruira beaucoup de gens
  rationale: Dans ce contexte politico-apocalyptique, le hiphil de שׁחת signifie naturellement causer la ruine ou la destruction. « Beaucoup de gens » est plus idiomatique que le substantif isolé « beaucoup ».
- source_word: שַׂר שָׂרִים
  choice: le Prince des princes
  rationale: La chaîne construite exprime la suprématie sur les princes. « Prince des princes » conserve le titre élevé et sa forme traditionnelle sans préciser davantage son référent.
- source_word: יַעֲמֹד עַל
  choice: il se dressera contre
  rationale: Avec עַל, עמד exprime ici une opposition hostile. « Se dresser contre » en restitue clairement la force.
- source_word: וּבְאֶפֶס יָד
  choice: sans l’intervention d’aucune main
  rationale: La locution est elliptique et signifie qu’aucune main n’agira pour provoquer sa chute. Cette formulation française garde l’image et son caractère ouvert; la note explicite le sens probable d’une absence d’intervention humaine.
- source_word: יִשָּׁבֵר
  choice: il sera brisé
  rationale: Le niphal de שׁבר est passif. « Sera brisé » conserve la métaphore et laisse inexprimé l’auteur de sa chute.
theological_decisions:
- issue: Référent et majuscule de שַׂר שָׂרִים
  choice: le Prince des princes
  alternative: le prince des princes
  rationale: Le titre désigne le souverain suprême face auquel l’adversaire se dresse. La majuscule signale sa portée transcendante probable dans le contexte de Daniel, sans identifier plus précisément le référent que ne le fait ce verset.
- issue: Sens de וּבְאֶפֶס יָד
  choice: il sera brisé sans l’intervention d’aucune main
  alternative: il sera brisé sans intervention humaine
  rationale: L’hébreu ne contient pas explicitement le mot « humaine ». Le texte principal conserve donc l’image de la main, tandis que la note indique l’interprétation idiomatique probable sans la rendre obligatoire.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases ont été légèrement segmentées pour la lisibilité. « Entre ses mains », « dans son cœur » et « aucune main » maintiennent les images corporelles de l’hébreu sans produire une syntaxe artificielle.
