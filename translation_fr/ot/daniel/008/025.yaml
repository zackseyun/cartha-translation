revisions:
- from: Grâce à son habileté, il fera réussir la tromperie entre ses mains. Il s’enorgueillira dans son cœur et, tandis qu’ils se croiront en sécurité, il détruira beaucoup de gens. Il se dressera contre le Prince des princes, mais il sera brisé sans l’intervention d’aucune main[a].
  to: Grâce à son habileté, la tromperie prospérera entre ses mains. Il s’enorgueillira dans son cœur et, en pleine sécurité, il détruira beaucoup de gens. Il se dressera contre le Prince des princes, mais il sera brisé sans qu’aucune main intervienne[a].
  rationale: 'La révision élimine l’inférence non exprimée selon laquelle les victimes ne feraient que se croire en sécurité. Elle améliore aussi la fluidité de la première proposition. La note finale maintient la tension voulue : le texte ne précise pas l’agent de la chute, tandis que l’explication probable d’une action non humaine reste explicitement présentée comme telle.'
