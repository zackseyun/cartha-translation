source:
  edition: WLC
  text: וּֽ/בְ/אַחֲרִית֙ מַלְכוּתָ֔/ם כְּ/הָתֵ֖ם הַ/פֹּשְׁעִ֑ים יַעֲמֹ֛ד מֶ֥לֶךְ עַז פָּנִ֖ים וּ/מֵבִ֥ין חִידֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/023.yaml
  text: And at the latter end of their kingdom[a], when the transgressors have reached their full measure, a king will arise, fierce in countenance and skilled in intrigue.
translation:
  language: fr
  text: À la fin de leur règne, quand les rebelles auront atteint leur pleine mesure, un roi au visage dur se lèvera, qui comprendra les énigmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : «qui comprendra les paroles obscures»; dans ce contexte, l’expression peut aussi évoquer un homme habile en intrigues.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחֲרִית מַלְכוּתָם
  choice: À la fin de leur règne
  rationale: אַחֲרִית situe l’action dans la dernière partie ou à la fin d’une période. מַלְכוּת, au singulier avec un suffixe pluriel, peut désigner ici l’exercice collectif de la royauté; «leur règne» est naturel en français et évite de transformer explicitement le singulier hébreu en plusieurs royaumes.
- source_word: כְּהָתֵם הַפֹּשְׁעִים
  choice: quand les rebelles auront atteint leur pleine mesure
  rationale: Le verbe תמם exprime l’achèvement ou la plénitude. La formulation indique que les rebelles arrivent à un point d’accomplissement, sans affirmer qu’ils cessent d’exister. «Rebelles» rend la dimension de révolte portée par פשׁע.
- source_word: יַעֲמֹד מֶלֶךְ
  choice: un roi ... se lèvera
  rationale: Dans ce contexte politique, עמד décrit l’apparition ou l’accession d’un souverain. «Se lèvera» conserve l’image hébraïque tout en restant idiomatique.
- source_word: עַז פָּנִים
  choice: au visage dur
  rationale: L’expression signifie littéralement «fort de visage» et évoque la dureté, l’audace ou la férocité. «Au visage dur» conserve l’image corporelle sans en préciser excessivement la nuance.
- source_word: וּמֵבִין חִידוֹת
  choice: qui comprendra les énigmes
  rationale: La formulation rend directement בין, «comprendre», et חידות, «énigmes, paroles obscures». Elle préserve le caractère énigmatique de l’expression au lieu de la réduire d’emblée à l’habileté politique.
theological_decisions:
- issue: Portée de וּמֵבִין חִידוֹת
  choice: qui comprendra les énigmes
  alternative: qui sera habile en intrigues; qui comprendra les paroles obscures
  rationale: L’hébreu peut désigner la compréhension d’énigmes ou de propos obscurs et, par extension contextuelle, une intelligence rusée des affaires secrètes. Le texte principal reste proche de la formulation source, tandis que la note signale la nuance politique possible sans l’imposer.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste proche du mouvement de l’hébreu, avec un vocabulaire courant. L’image «au visage dur» et l’expression «comprendre les énigmes» sont conservées afin de ne pas effacer les ambiguïtés du texte source.
