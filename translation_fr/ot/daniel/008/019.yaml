source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הִנְ/נִ֣י מוֹדִֽיעֲ/ךָ֔ אֵ֥ת אֲשֶׁר יִהְיֶ֖ה בְּ/אַחֲרִ֣ית הַ/זָּ֑עַם כִּ֖י לְ/מוֹעֵ֥ד קֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/019.yaml
  text: Then he said, “Look, I am making known to you what will happen in the latter part of the indignation, for the end is for the appointed time.”
translation:
  language: fr
  text: 'Puis il dit : « Voici, je te fais connaître ce qui arrivera vers la fin de l’indignation, car la fin viendra au temps fixé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici
  rationale: Conserve la fonction présentative et solennelle de l’hébreu tout en restant naturelle dans un registre biblique moderne.
- source_word: בְּאַחֲרִית הַזָּעַם
  choice: vers la fin de l’indignation
  rationale: אַחֲרִית désigne ici la phase finale ou l’issue temporelle; « vers la fin » évite de préciser davantage que le texte. « Indignation » conserve la portée forte, possiblement divine, de זַעַם sans l’expliciter.
- source_word: כִּי לְמוֹעֵד קֵץ
  choice: car la fin viendra au temps fixé
  rationale: Rend la formulation nominale concise de l’hébreu en français idiomatique, en maintenant le lien entre la fin et le moment déterminé.
theological_decisions:
- issue: Référent et nature de « l’indignation »
  choice: Ne pas identifier explicitement l’auteur ni l’objet de l’indignation
  alternative: « la colère de Dieu »
  rationale: Le contexte peut suggérer une indignation divine, mais le verset ne nomme pas Dieu; l’ajout fermerait une ambiguïté réelle.
- issue: Rapport entre la fin et le temps fixé
  choice: « la fin viendra au temps fixé »
  alternative: « cela concerne le temps fixé de la fin »
  rationale: La syntaxe hébraïque elliptique autorise plusieurs formulations. Le choix retenu exprime naturellement que la fin est déterminée pour un moment fixé, sans développer un schéma eschatologique particulier.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » maintient la solennité du discours angélique; la phrase reste concise et ne surinterprète ni « l’indignation » ni « la fin ».
