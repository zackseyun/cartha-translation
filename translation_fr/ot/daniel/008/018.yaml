  variant: modern international French
source:
  edition: WLC
  text: וּ/בְ/דַבְּר֣/וֹ עִמִּ֔/י נִרְדַּ֥מְתִּי עַל פָּנַ֖/י אָ֑רְצָ/ה וַ/יִּ֨גַּע בִּ֔/י וַ/יַּֽעֲמִידֵ֖/נִי עַל עָמְדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/018.yaml
  text: And while he was speaking with me[a], I fell into a deep sleep with my face to the ground[b]; but he touched me and made me stand up where I had been standing.
translation:
  language: fr
  text: Pendant qu’il me parlait, je tombai dans un profond sommeil[a], le visage contre terre. Mais il me toucha et me remit debout à ma place[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je fus plongé dans une profonde torpeur ». Le mot hébreu décrit un sommeil profond ou un état d’engourdissement comparable au sommeil.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « il me fit tenir debout sur ma position ». L’expression peut désigner le fait de remettre Daniel debout, à sa place.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: Pendant qu’il me parlait
  rationale: La préposition בְּ avec l’infinitif construit exprime ici la simultanéité. « Pendant que » rend naturellement l’action en cours, et « me parlait » traduit עִמִּי (« avec moi ») de façon idiomatique en français.
- source_word: נִרְדַּמְתִּי
  choice: je tombai dans un profond sommeil
  rationale: Le niphal de רדם désigne le fait d’être gagné par un sommeil profond ou une torpeur. Cette formulation conserve la nuance d’entrée dans cet état sans imposer le terme théologiquement plus marqué de « transe ».
- source_word: עַל־פָּנַי אָרְצָה
  choice: le visage contre terre
  rationale: L’expression signifie littéralement « sur mon visage, vers la terre ». La traduction retenue décrit clairement et naturellement la posture de Daniel.
- source_word: וַיִּגַּע בִּי
  choice: il me toucha
  rationale: Le verbe נגע construit avec ב signifie normalement « toucher ». Le contexte ne demande pas un verbe plus fort.
- source_word: וַיַּעֲמִידֵנִי עַל־עָמְדִי
  choice: il me remit debout à ma place
  rationale: Le hiphil de עמד a une valeur causative, « faire tenir debout ». L’expression condensée עַל־עָמְדִי, littéralement « sur ma position / mon emplacement debout », peut évoquer à la fois le rétablissement en position debout et la remise à sa place; la formulation française garde ces deux éléments.
theological_decisions:
- issue: Nature de l’état de Daniel pendant la vision
  choice: Un profond sommeil ou une torpeur physique, sans qualification technique
  alternative: Une transe ou une extase visionnaire
  rationale: Le verbe רדם décrit un sommeil profond ou un état de torpeur. Le texte ne requiert pas un terme technique comme « transe »; la traduction conserve donc la description narrative sans lui ajouter une catégorie doctrinale.
- issue: Sens de עַל־עָמְדִי
  choice: Rétablissement debout à sa place
  alternative: Simple remise sur ses pieds, sans nuance de lieu
  rationale: La tournure hébraïque associe la station debout à עַל et au nom עָמְדִי. « À ma place » maintient la composante possible d’emplacement au lieu de la supprimer, tandis que la note signale le caractère littéral et l’ambiguïté de l’expression.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsmes lexicaux. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
