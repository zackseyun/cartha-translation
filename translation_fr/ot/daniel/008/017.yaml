source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֵ֣צֶל עָמְדִ֔/י וּ/בְ/בֹא֣/וֹ נִבְעַ֔תִּי וָ/אֶפְּלָ֖/ה עַל פָּנָ֑/י וַ/יֹּ֤אמֶר אֵלַ/י֙ הָבֵ֣ן בֶּן אָדָ֔ם כִּ֖י לְ/עֶת קֵ֥ץ הֶ/חָזֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/017.yaml
  text: So he came near where I was standing[a], and when he came, I was terrified and fell on my face. Then he said to me, “Understand, son of man[b], that the vision is for the time of the end.”
translation:
  language: fr
  text: 'Il s’approcha de l’endroit où je me tenais et, quand il arriva, je fus terrifié et tombai face contre terre. Il me dit alors : « Comprends, fils d’homme[a] : la vision concerne le temps de la fin[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « être humain » ou « mortel ». Littéralement : « fils d’homme ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « la vision est pour le temps de la fin ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵצֶל עָמְדִי
  choice: de l’endroit où je me tenais
  rationale: Avec le verbe « s’approcha », cette formulation française exprime naturellement la proximité indiquée par אֵצֶל et le lieu où Daniel se tenait.
- source_word: נִבְעַתִּי
  choice: je fus terrifié
  rationale: Le niphal de בעת exprime une peur intense qui saisit Daniel ; « terrifié » en conserve la force.
- source_word: וָאֶפְּלָה עַל־פָּנַי
  choice: et tombai face contre terre
  rationale: Cette expression française naturelle rend l’action de tomber prosterné, le visage tourné vers le sol.
- source_word: הָבֵן
  choice: Comprends
  rationale: L’impératif hiphil de בין appelle directement Daniel à comprendre ou discerner la vision.
- source_word: בֶּן אָדָם
  choice: fils d’homme
  rationale: La traduction littérale préserve la formulation hébraïque et ses résonances dans Daniel, tout en laissant la note préciser son sens humain dans cette adresse.
- source_word: לְעֵת קֵץ
  choice: le temps de la fin
  rationale: Cette formulation reste proche de l’hébreu et évite de préciser quel accomplissement final est visé.
- source_word: הֶחָזוֹן
  choice: la vision
  rationale: L’article défini renvoie naturellement à la vision que Daniel vient de recevoir.
theological_decisions:
- issue: Sens de בֶּן אָדָם dans ce contexte apocalyptique
  choice: fils d’homme
  alternative: être humain ; mortel
  rationale: Le choix conserve la forme hébraïque et ses possibles résonances littéraires sans réduire l’expression à une simple paraphrase ; ici, elle s’adresse néanmoins à Daniel en soulignant son humanité.
- issue: Portée de לְעֵת קֵץ
  choice: la vision concerne le temps de la fin
  alternative: la vision est pour le temps de la fin ; la vision concerne la fin fixée
  rationale: « Concerne » exprime le rapport indiqué par לְ sans imposer que la vision elle-même ne doive être vue qu’à cette époque. « Temps de la fin » préserve l’indétermination du terme קֵץ et n’importe aucun système eschatologique particulier.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Face contre terre » rend naturellement le geste de prosternation. Les deux notes maintiennent les ambiguïtés lexicales et syntaxiques réelles.
