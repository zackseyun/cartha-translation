  text: הָ/אַ֥יִל אֲשֶׁר רָאִ֖יתָ בַּ֣עַל הַ/קְּרָנָ֑יִם מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/020.yaml
  text: The ram that you saw[a], the one with the two horns, is the kings of Media and Persia.
translation:
  language: fr
  text: Le bélier que tu as vu, qui avait deux cornes, représente les rois des Mèdes et des Perses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le bélier que tu as vu, possesseur des deux cornes : les rois des Mèdes et des Perses. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: le bélier
  rationale: אַיִל désigne un bélier; ce terme est précis et naturel dans le contexte de cette vision.
- source_word: אֲשֶׁר רָאִיתָ
  choice: que tu as vu
  rationale: La proposition relative qualifie le bélier; le passé composé convient naturellement en français moderne pour rappeler la vision reçue.
- source_word: בַּעַל הַקְּרָנַיִם
  choice: celui qui avait les deux cornes
  rationale: בַּעַל signifie littéralement «possesseur de», mais exprime ici naturellement le fait d'être pourvu de deux cornes. Le duel קְּרָנַיִם indique bien deux cornes.
- source_word: מַלְכֵי מָדַי וּפָרָס
  choice: les rois des Mèdes et des Perses
  rationale: מַלְכֵי est le pluriel construit «rois de». «Mèdes» et «Perses» rend ici naturellement les noms des peuples associés à leurs rois.
theological_decisions:
- issue: Restitution de la relation implicite entre le symbole et son référent dans une proposition hébraïque sans verbe
  choice: représente les rois des Mèdes et des Perses
  alternative: est les rois des Mèdes et des Perses
  rationale: L'hébreu juxtapose le bélier et les rois sans copule. Dans l'explication d'une vision symbolique, «représente» exprime clairement cette relation en français, tandis que «est les rois» serait grammaticalement maladroit. La note conserve la formulation plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l'adresse directe au voyant. La formulation principale privilégie la clarté du rapport symbolique, tandis que la note signale la structure nominale et l'expression littérale de l'hébreu.
