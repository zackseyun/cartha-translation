id: DAN.8.1
reference: Daniel 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁל֔וֹשׁ לְ/מַלְכ֖וּת בֵּלְאשַׁצַּ֣ר הַ/מֶּ֑לֶךְ חָז֞וֹן נִרְאָ֤ה אֵלַ/י֙ אֲנִ֣י דָנִיֵּ֔אל אַחֲרֵ֛י הַ/נִּרְאָ֥ה אֵלַ֖/י בַּ/תְּחִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/001.yaml
  text: In the third year of the reign of Belshazzar the king[a], a vision appeared to me—I, Daniel—after the one that had appeared to me at the first.
translation:
  language: fr
  text: La troisième année du règne du roi Belshatsar, une vision m’apparut, à moi, Daniel, après celle qui m’était apparue au commencement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après la vision qui m’était apparue la première fois ». L’hébreu renvoie à une apparition antérieure, vraisemblablement à la vision précédente de Daniel.'
    reason: L’expression peut se comprendre comme « au commencement », « la première fois » ou, plus librement, « auparavant ».
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ
  choice: La troisième année
  rationale: Dans cette formule de datation, le cardinal hébreu a une valeur ordinale. La tournure française exprime naturellement la date sans alourdir la phrase.
- source_word: לְמַלְכוּת
  choice: du règne de
  rationale: Le nom désigne ici l’exercice du pouvoir royal envisagé comme repère chronologique.
- source_word: בֵּלְאשַׁצַּר הַמֶּלֶךְ
  choice: du roi Belshatsar
  rationale: Cette formulation française naturelle conserve explicitement le titre royal apposé au nom dans l’hébreu. « Belshatsar » suit une translittération française courante.
- source_word: חָזוֹן נִרְאָה אֵלַי
  choice: une vision m’apparut
  rationale: Le nifal de ראה exprime ici l’apparition d’une vision. « M’apparut » reste proche de la forme source tout en étant idiomatique en français.
- source_word: אֲנִי דָנִיֵּאל
  choice: à moi, Daniel
  rationale: L’hébreu ajoute le pronom explicite et le nom pour identifier avec une légère insistance le bénéficiaire de la vision. L’apposition française en conserve l’effet.
- source_word: אַחֲרֵי הַנִּרְאָה אֵלַי
  choice: après celle qui m’était apparue
  rationale: Le français fournit le support pronominal « celle » sans répéter dans le texte le nom « vision », sous-entendu par la forme hébraïque. Le plus-que-parfait marque clairement l’antériorité.
- source_word: בַּתְּחִלָּה
  choice: au commencement
  rationale: Ce rendu conserve la valeur littérale et la relative ouverture de l’expression, qui renvoie à une apparition antérieure sans préciser explicitement son rang exact.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et soutenu. La syntaxe conserve l’auto-identification emphatique de Daniel et la répétition du verbe « apparaître », tout en suivant l’ordre naturel du français.
