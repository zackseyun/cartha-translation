source:
  edition: WLC
  text: וַ/תִּגְדַּ֖ל עַד צְבָ֣א הַ/שָּׁמָ֑יִם וַ/תַּפֵּ֥ל אַ֛רְצָ/ה מִן הַ/צָּבָ֥א וּ/מִן הַ/כּוֹכָבִ֖ים וַֽ/תִּרְמְסֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/010.yaml
  text: It grew as high as the host of heaven[a], and it cast some of the host and some of the stars down to the earth, and trampled them.
translation:
  language: fr
  text: Elle grandit jusqu’à atteindre l’armée du ciel[a]. Elle fit tomber à terre une partie de cette armée et une partie des étoiles, puis les piétina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la multitude céleste ». L’expression peut désigner symboliquement des êtres célestes, le peuple de Dieu ou des puissances astrales ; l’hébreu laisse l’image ouverte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְדַּל
  choice: Elle grandit
  rationale: Le qal wayyiqtol de גדל exprime ici un accroissement en grandeur ou en portée. « Elle grandit » reste naturel et conserve l’image sans introduire le sens réfléchi « elle s’éleva elle-même ».
- source_word: עַד
  choice: jusqu’à atteindre
  rationale: La préposition indique l’extension jusqu’au niveau de l’armée céleste. Cette formulation rend clairement le mouvement vertical suggéré par le contexte.
- source_word: צְבָא הַשָּׁמַיִם
  choice: l’armée du ciel
  rationale: צָבָא peut désigner une armée ou une multitude organisée. « L’armée du ciel » est compréhensible en français moderne et préserve l’ambiguïté entre êtres célestes, peuple de Dieu et puissances astrales, signalée en note.
- source_word: וַתַּפֵּל
  choice: Elle fit tomber
  rationale: 'Le hiphil de נפל est causatif : « faire tomber ». Cette traduction respecte directement la forme hébraïque et sa force.'
- source_word: אַרְצָה
  choice: à terre
  rationale: La forme directive indique un mouvement vers la terre ou le sol. « À terre » est idiomatique et exprime nettement la chute depuis le ciel.
- source_word: מִן הַצָּבָא וּמִן הַכּוֹכָבִים
  choice: une partie de cette armée et des étoiles
  rationale: 'מִן est compris dans un sens partitif : seuls certains membres de l’armée et certaines étoiles sont jetés à terre. « Une partie de » évite de suggérer que leur totalité tombe.'
- source_word: הַכּוֹכָבִים
  choice: les étoiles
  rationale: Traduction directe de כּוֹכָבִים, sans remplacer l’image apocalyptique par une identification interprétative.
- source_word: וַתִּרְמְסֵם
  choice: puis les piétina
  rationale: רמס signifie « piétiner ». Le pronom renvoie aux éléments de l’armée et aux étoiles qui viennent d’être jetés à terre; « puis » rend naturellement la succession narrative du wayyiqtol.
theological_decisions:
- issue: Identification de « l’armée du ciel » et des « étoiles »
  choice: Conserver les images d’« armée du ciel » et d’« étoiles » sans identifier leurs référents dans le texte principal.
  alternative: Les interpréter explicitement comme des anges, le peuple de Dieu, les saints ou des dirigeants symbolisés par des astres.
  rationale: Le langage apocalyptique est symbolique, mais l’hébreu ne précise pas ici le référent. La traduction maintient donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le féminin « elle » reprend naturellement « la petite corne » du contexte immédiat. La syntaxe conserve la progression de l’image apocalyptique tout en évitant un calque lourd de l’hébreu.
