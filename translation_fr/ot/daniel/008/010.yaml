  terminology: « L’armée du ciel » rend bien צְבָא הַשָּׁמַיִם et maintient l’image sans imposer d’identification doctrinale. « Étoiles » et « piétina » sont précis. La note conserve à juste titre l’ouverture référentielle du langage apocalyptique.
