  text: וּ/מִן הָ/אַחַ֣ת מֵ/הֶ֔ם יָצָ֥א קֶֽרֶן אַחַ֖ת מִ/צְּעִירָ֑ה וַ/תִּגְדַּל יֶ֛תֶר אֶל הַ/נֶּ֥גֶב וְ/אֶל הַ/מִּזְרָ֖ח וְ/אֶל הַ/צֶּֽבִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/009.yaml
  text: And out of one of them came a small horn[a], and it grew exceedingly great toward the south, toward the east[b], and toward the Beautiful Land.
translation:
  language: fr
  text: De l’un d’entre eux sortit une petite corne, qui devint extrêmement grande vers le sud, vers l’est et vers le Pays magnifique[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Pays splendide » ou « le pays désirable ». Cette expression hébraïque est un titre descriptif qui désigne probablement le pays d’Israël.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הָאַחַת מֵהֶם
  choice: De l’une d’elles
  rationale: La double construction avec מִן exprime l’origine au sein du groupe. Le féminin « l’une » reflète הָאַחַת et reprend naturellement les cornes mentionnées dans le contexte.
- source_word: יָצָא
  choice: sortit
  rationale: Le verbe יָצָא signifie sortir. Le passé simple convient au registre narratif biblique français tout en restant clair et digne.
- source_word: קֶרֶן אַחַת מִצְּעִירָה
  choice: une petite corne
  rationale: La traduction conserve l’image apocalyptique de la corne sans l’interpréter comme roi ou puissance. מִצְּעִירָה indique ici la petitesse; « petite corne » est naturel et précis en français.
- source_word: וַתִּגְדַּל יֶתֶר
  choice: qui grandit démesurément
  rationale: גדל exprime la croissance et יֶתֶר en intensifie fortement le degré. « Démesurément » communique une croissance excessive sans alourdir la phrase.
- source_word: אֶל הַנֶּגֶב
  choice: vers le sud
  rationale: Dans cette série géographique, נגב fonctionne naturellement comme indication de direction plutôt que comme nom propre du Néguev.
- source_word: וְאֶל הַמִּזְרָח
  choice: vers l’est
  rationale: מזרח désigne couramment l’est, littéralement la région du levant; la direction cardinale convient au contexte.
- source_word: וְאֶל הַצְּבִי
  choice: vers le Pays magnifique
  rationale: צְבִי évoque la beauté, la splendeur ou ce qui est désirable. « Pays magnifique » conserve le titre descriptif sans remplacer celui-ci par l’identification interprétative à Israël.
theological_decisions:
- issue: Interprétation du symbole apocalyptique de la corne
  choice: Conserver « corne » dans le texte principal
  alternative: roi, puissance ou royaume
  rationale: Le texte hébreu présente un symbole sans l’expliciter dans ce verset. Le traduire directement par son référent supposé supprimerait l’image et imposerait une interprétation.
- issue: Sens de הַצְּבִי
  choice: « le Pays magnifique » avec variantes en note
  alternative: « le Pays splendide » ou « le pays désirable »
  rationale: Le mot désigne la beauté, la splendeur ou le caractère désirable. Le titre descriptif est conservé, tout en signalant ses nuances et son référent probable sans les imposer au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient la continuité du récit visionnaire. Les répétitions directionnelles de l’hébreu sont conservées, tandis que le dernier « vers » est coordonné sans répétition pour une syntaxe française fluide.
