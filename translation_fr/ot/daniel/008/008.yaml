source:
  edition: WLC
  text: וּ/צְפִ֥יר הָ/עִזִּ֖ים הִגְדִּ֣יל עַד מְאֹ֑ד וּ/כְ/עָצְמ֗/וֹ נִשְׁבְּרָה֙ הַ/קֶּ֣רֶן הַ/גְּדוֹלָ֔ה וַֽ/תַּעֲלֶ֜נָה חָז֤וּת אַרְבַּע֙ תַּחְתֶּ֔י/הָ לְ/אַרְבַּ֖ע רוּח֥וֹת הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/008.yaml
  text: And the male goat grew exceedingly great[a], but when he was strong, the great horn was broken[b], and in its place four conspicuous horns came up toward the four winds of heaven.
translation:
  language: fr
  text: Le bouc devint extrêmement grand. Mais alors qu’il était en pleine force, la grande corne se brisa, et quatre cornes remarquables[a] s’élevèrent à sa place[b], en direction des quatre vents du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi se rendre par « bien visibles » ou « imposantes » ; le mot « cornes » est sous-entendu et fourni par le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sous elle » ; dans ce contexte, l’expression signifie « à sa place » ou « pour la remplacer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְפִיר הָעִזִּים
  choice: le bouc
  rationale: L’expression désigne précisément un mâle de la chèvre. « Le bouc » est le terme français courant, clair et exact.
- source_word: הִגְדִּיל עַד מְאֹד
  choice: devint extrêmement puissant
  rationale: Dans ce contexte visionnaire, la grandeur évoque surtout la puissance et l’importance. « Extrêmement » restitue l’intensification de עַד מְאֹד.
- source_word: וּכְעָצְמוֹ
  choice: mais alors qu’il était en pleine force
  rationale: La formule situe la rupture au moment où le bouc est fort ou puissant. Cette tournure française conserve la valeur temporelle et souligne le contraste sans identifier historiquement le symbole.
- source_word: נִשְׁבְּרָה
  choice: se brisa
  rationale: Le nifal exprime ici le fait que la corne est brisée. Le pronominal français est naturel tout en conservant l’absence d’agent exprimé.
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: la grande corne
  rationale: La traduction littérale préserve l’image symbolique de la vision ainsi que l’ambivalence de « grande » entre taille et importance.
- source_word: וַתַּעֲלֶנָה
  choice: s’élevèrent
  rationale: Le verbe décrit l’apparition ascendante des nouvelles cornes. « S’élevèrent » convient au registre visionnaire et restitue cette image.
- source_word: חָזוּת אַרְבַּע
  choice: quatre cornes remarquables
  rationale: Le terme חָזוּת qualifie ici ce qui est visible, apparent ou marquant. Le nom « cornes » est explicité d’après le contexte et l’accord verbal féminin pluriel.
- source_word: תַּחְתֶּיהָ
  choice: à sa place
  rationale: Bien que le sens spatial de base soit « sous elle », la préposition indique ici le remplacement de la corne brisée par les quatre autres.
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: en direction des quatre vents du ciel
  rationale: Cette formulation conserve l’image biblique des vents tout en exprimant clairement l’orientation des quatre cornes.
theological_decisions:
- issue: Conserver ou interpréter les symboles de la vision
  choice: Conserver les images de la « corne » et des « quatre vents du ciel » sans leur attribuer dans le texte une identité historique.
  alternative: Remplacer directement les cornes par des rois ou des royaumes, et les vents par les quatre points cardinaux.
  rationale: Le verset présente d’abord les éléments symboliques de la vision; leur interprétation appartient au contexte ultérieur. Les expliciter ici imposerait prématurément une lecture.
- issue: Référent de la force dans וּכְעָצְמוֹ
  choice: Faire porter « en pleine force » sur le bouc, conformément au pronom masculin hébreu.
  alternative: Rapporter la force à la grande corne en fonction du sens symbolique.
  rationale: Le suffixe masculin renvoie grammaticalement au bouc, tandis que « corne » est féminin en hébreu. La traduction respecte cette distinction sans résoudre davantage la relation symbolique.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation garde le caractère saisissant de la vision, évite les archaïsmes et maintient les symboles sans ajouter d’interprétation confessionnelle.
