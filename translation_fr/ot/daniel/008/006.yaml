id: DAN.8.6
reference: Daniel 8:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּבֹ֗א עַד הָ/אַ֨יִל֙ בַּ֣עַל הַ/קְּרָנַ֔יִם אֲשֶׁ֣ר רָאִ֔יתִי עֹמֵ֖ד לִ/פְנֵ֣י הָ/אֻבָ֑ל וַ/יָּ֥רָץ אֵלָ֖י/ו בַּ/חֲמַ֥ת כֹּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/006.yaml
  text: He came up to the ram with the two horns[a], which I had seen standing before the canal[b], and ran at him in the fury of his power.
translation:
  language: fr
  text: Il arriva jusqu’au bélier aux deux cornes, que j’avais vu se tenir devant le canal[a], et courut sur lui dans la fureur de sa force[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cours d’eau ». Le mot hébreu אוּבָל désigne un chenal ou un cours d’eau; « canal » convient bien au cadre de Daniel 8.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec la colère de sa puissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עַד
  choice: Il arriva jusqu’à
  rationale: La combinaison du verbe בוא et de עַד exprime un déplacement qui atteint son terme auprès du bélier. « Arriva jusqu’à » conserve cette nuance directionnelle.
- source_word: הָאַיִל
  choice: le bélier
  rationale: אַיִל désigne ici le mouton mâle de la vision; « bélier » est le terme français précis et traditionnel.
- source_word: בַּעַל הַקְּרָנַיִם
  choice: aux deux cornes
  rationale: בַּעַל signifie littéralement « possesseur de », mais la tournure attributive « aux deux cornes » est naturelle en français et préserve le duel hébreu.
- source_word: אֲשֶׁר רָאִיתִי עֹמֵד
  choice: que j’avais vu se tenir
  rationale: Le plus-que-parfait situe la vision antérieure par rapport à l’action racontée, tandis que « se tenir » rend le participe עֹמֵד sans suggérer seulement une posture momentanée.
- source_word: לִפְנֵי הָאֻבָל
  choice: devant le canal
  rationale: אוּבָל désigne un cours d’eau ou un chenal. « Canal » convient bien au cadre de Daniel 8, tout en laissant l’autre possibilité en note.
- source_word: וַיָּרָץ אֵלָיו
  choice: et courut sur lui
  rationale: רוץ signifie « courir ». Dans ce contexte hostile, « courir sur quelqu’un » exprime le mouvement agressif sans remplacer le verbe par une paraphrase plus libre.
- source_word: בַּחֲמַת כֹּחוֹ
  choice: dans la fureur de sa force
  rationale: Cette formulation conserve les deux substantifs du texte, חֵמָה (« fureur, colère ») et כֹּחַ (« force, puissance »), ainsi que leur relation volontairement intense et inhabituelle.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et narratif. La formulation reste proche de l’image hébraïque, notamment dans « la fureur de sa force », sans expliciter l’identité symbolique des animaux ni atténuer la violence de la scène.
