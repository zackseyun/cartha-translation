  text: וַ/אֲנִ֣י דָנִיֵּ֗אל נִהְיֵ֤יתִי וְ/נֶֽחֱלֵ֨יתִי֙ יָמִ֔ים וָ/אָק֕וּם וָ/אֶֽעֱשֶׂ֖ה אֶת מְלֶ֣אכֶת הַ/מֶּ֑לֶךְ וָ/אֶשְׁתּוֹמֵ֥ם עַל הַ/מַּרְאֶ֖ה וְ/אֵ֥ין מֵבִֽין־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/027.yaml
  text: And I[a], Daniel, was overcome and was sick for days. Then I rose and did the king’s work, but I was appalled by the vision, and there was no one who understood it.
translation:
  language: fr
  text: Moi, Daniel, j’ai été accablé et je suis tombé malade pendant des jours. Puis je me suis levé et j’ai fait le travail du roi, mais j’étais consterné par la vision, et personne ne la comprenait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais je ne la comprenais pas ». L’expression hébraïque est concise et peut être comprise soit de manière impersonnelle (« personne ne la comprenait »), soit comme se rapportant à Daniel lui-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִהְיֵיתִי
  choice: j’ai été épuisé
  rationale: Dans ce contexte, le verbe exprime l’état d’abattement qui résulte de la vision, et non la simple existence. « Épuisé » évoque l’effondrement ou la perte de forces sans préciser à tort que Daniel s’est évanoui.
- source_word: וְנֶחֱלֵיתִי
  choice: et malade
  rationale: Le niphal de חלה désigne couramment le fait de tomber malade ou de s’affaiblir. « Malade » est ici naturel et convient à la durée indiquée ensuite.
- source_word: יָמִים
  choice: durant des jours
  rationale: Le pluriel indique une période indéterminée. Cette formulation conserve cette indétermination sans ajouter « plusieurs » ou « de nombreux ».
- source_word: וָאָקוּם
  choice: Puis je me suis levé
  rationale: « Puis » marque naturellement la progression du récit, tandis que « je me suis levé » conserve l’idée de rétablissement et de reprise de l’activité.
- source_word: וָאֶעֱשֶׂה אֶת מְלֶאכֶת הַמֶּלֶךְ
  choice: j’ai fait le travail du roi
  rationale: La formulation reste proche du sens courant de מְלָאכָה, « travail, tâche, activité », sans préciser davantage la nature des fonctions royales de Daniel.
- source_word: וָאֶשְׁתּוֹמֵם
  choice: je restais bouleversé
  rationale: Le verbe décrit un état de stupeur ou de profond trouble, plus fort qu’un simple étonnement. L’imparfait « restais » rend l’effet persistant de la vision après la reprise du travail.
- source_word: הַמַּרְאֶה
  choice: la vision
  rationale: Dans ce contexte apocalyptique, le nom désigne la révélation visionnaire reçue par Daniel, et non une simple apparence visuelle.
- source_word: וְאֵין מֵבִין
  choice: personne ne la comprenait
  rationale: Le participe n’a pas de sujet explicite. La tournure existentielle « personne ne la comprenait » reflète directement la formulation massorétique, tandis que l’interprétation personnelle est signalée en note.
theological_decisions:
- issue: Sujet implicite de וְאֵין מֵבִין
  choice: 'Lecture existentielle ou impersonnelle : « personne ne la comprenait »'
  alternative: 'Lecture personnelle : « je ne la comprenais pas »'
  rationale: L’hébreu ne contient aucun pronom explicite de première personne et dit littéralement qu’il n’y a pas de personne comprenant. Toutefois, la réaction de Daniel dans le contexte immédiat rend aussi plausible une référence à sa propre incompréhension. La note conserve donc cette ambiguïté sans la résoudre de manière dogmatique.
translation_notes:
  register: Français international actuel, clair et digne. Le passé composé convient à un témoignage narratif à la première personne; l’imparfait dans « je restais bouleversé » souligne la persistance de l’état. La formulation demeure proche de l’hébreu tout en étant naturelle en français.
