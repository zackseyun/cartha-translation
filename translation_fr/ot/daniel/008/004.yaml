  text: רָאִ֣יתִי אֶת הָ/אַ֡יִל מְנַגֵּחַ֩ יָ֨מָּ/ה וְ/צָפ֜וֹנָ/ה וָ/נֶ֗גְבָּ/ה וְ/כָל חַיּוֹת֙ לֹֽא יַֽעַמְד֣וּ לְ/פָנָ֔י/ו וְ/אֵ֥ין מַצִּ֖יל מִ/יָּד֑/וֹ וְ/עָשָׂ֥ה כִ/רְצֹנ֖/וֹ וְ/הִגְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/004.yaml
  text: I saw the ram charging westward and northward and southward[a], and no beasts could stand before him, and there was no one who could rescue from his hand. He did as he pleased and became great.
translation:
  language: fr
  text: Je vis le bélier frapper de ses cornes vers l’ouest, vers le nord et vers le sud. Aucune bête ne pouvait lui tenir tête, et personne ne pouvait arracher qui que ce soit à sa main. Il fit ce qui lui plaisait et devint grand[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se rendit grand » ou « grandit ». L’hébreu peut exprimer soit le fait de devenir grand, soit celui de se rendre grand.'
    reason: Alternative lexicale préservant l’ambiguïté du hiphil de גדל.
lexical_decisions:
- source_word: רָאִיתִי
  choice: Je vis
  rationale: Le qal accompli à la première personne du singulier introduit simplement ce que Daniel vit dans le récit de la vision.
- source_word: הָאַיִל
  choice: le bélier
  rationale: אַיִל désigne un bélier; l’article défini est conservé puisqu’il s’agit de l’animal déjà présent dans la vision.
- source_word: מְנַגֵּחַ
  choice: frapper de ses cornes
  rationale: Le participe de נגח décrit l’action offensive d’un animal à cornes. Cette formulation française garde explicitement l’image des cornes sans recourir au peu naturel « pousser ».
- source_word: יָמָּה וְצָפוֹנָה וָנֶגְבָּה
  choice: vers l’ouest, vers le nord et vers le sud
  rationale: Le suffixe directionnel indique un mouvement en direction de ces trois points cardinaux.
- source_word: וְכָל חַיּוֹת לֹא יַעַמְדוּ לְפָנָיו
  choice: Aucune bête ne pouvait tenir devant lui
  rationale: חַיּוֹת désigne ici les bêtes de la vision; avec la négation, l’imparfait exprime leur incapacité à lui tenir tête. « Tenir devant lui » préserve l’image hébraïque.
- source_word: וְאֵין מַצִּיל מִיָּדוֹ
  choice: et personne ne pouvait délivrer qui que ce soit de sa main
  rationale: Le hiphil de נצל signifie « délivrer, arracher ». « De sa main » conserve la métaphore hébraïque du pouvoir, tandis que « qui que ce soit » rend explicite en français l’objet sous-entendu.
- source_word: וְעָשָׂה כִרְצֹנוֹ
  choice: Il faisait ce qui lui plaisait
  rationale: L’expression signifie agir selon sa propre volonté. L’imparfait français convient à l’action caractéristique décrite dans cette séquence.
- source_word: וְהִגְדִּיל
  choice: et devint puissant
  rationale: Le hiphil de גדל peut exprimer le fait de devenir grand ou de se grandir. Dans ce contexte de domination, « devint puissant » est naturel en français tout en laissant les autres nuances en note.
theological_decisions:
- issue: Faut-il comprendre וְהִגְדִּיל comme un accroissement de puissance ou comme l’action de s’élever soi-même ?
  choice: et devint puissant
  alternative: et s’éleva / et grandit
  rationale: Le texte ne comporte pas de pronom réfléchi explicite. Le contexte immédiat souligne la réussite et l’expansion du bélier; la traduction principale exprime donc sa puissance croissante sans lui attribuer nécessairement une attitude morale d’orgueil. La note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve les images de la corne, de la station devant l’adversaire et de la main comme symbole du pouvoir, tout en explicitant seulement l’objet implicite de « délivrer » pour assurer une lecture fluide.
