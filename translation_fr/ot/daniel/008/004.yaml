revisions:
- from: Je vis le bélier frapper de ses cornes vers l’ouest, vers le nord et vers le sud. Aucune bête ne pouvait tenir devant lui, et personne ne pouvait délivrer qui que ce soit de sa main. Il faisait ce qui lui plaisait et devint puissant[a].
  to: Je vis le bélier frapper de ses cornes vers l’ouest, vers le nord et vers le sud. Aucune bête ne pouvait lui tenir tête, et personne ne pouvait arracher qui que ce soit à sa main. Il fit ce qui lui plaisait et devint grand[a].
  rationale: La révision conserve toutes les images et relations du texte hébreu, tout en corrigeant une restriction de sens et en améliorant l'idiomaticité française. Elle ne tranche pas entre une simple croissance en grandeur et une auto-exaltation possible dans והגדיל; cette ambiguïté demeure explicitement signalée en note.
