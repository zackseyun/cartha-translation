  variant: modern international French
source:
  edition: WLC
  text: וְ/עַ֥ד שַֽׂר הַ/צָּבָ֖א הִגְדִּ֑יל וּ/מִמֶּ֨/נּוּ֙ הרים הַ/תָּמִ֔יד וְ/הֻשְׁלַ֖ךְ מְכ֥וֹן מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/011.yaml
  text: It even magnified itself up to the Prince of the host[a], and from him the regular offering was taken away[c][b], and the place of his sanctuary was cast down.
translation:
  language: fr
  text: Il s’éleva même jusqu’au prince de l’armée[a] ; l’offrande régulière lui fut retirée[b], et l’emplacement de son sanctuaire fut jeté à terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se traduire par « chef de l’armée » ou « commandant de l’armée ». Le texte ne précise ni l’identité du prince ni la nature de cette armée.
    reason: ambiguïté lexicale et théologique
  - marker: b
    text: « Lui » rend littéralement le pronom hébreu masculin singulier ; son antécédent est débattu.
    reason: antécédent ambigu
  - marker: c
    text: Ou « la fondation de son sanctuaire fut jetée à terre ». Le mot hébreu peut désigner un emplacement, un site établi ou une fondation.
    reason: variante lexicale
lexical_decisions:
- source_word: וְעַד
  choice: même jusqu’au
  rationale: עַד marque la limite atteinte (« jusqu’à »), tandis que וְ poursuit et intensifie la description. « Même jusqu’au » exprime naturellement l’ampleur surprenante de cette élévation.
- source_word: שַׂר הַצָּבָא
  choice: le chef de l’armée
  rationale: שַׂר peut désigner un prince, un dirigeant ou un chef militaire, et צָבָא une armée ou une troupe, notamment céleste. Cette formulation française reste élevée sans identifier d’avance le personnage ni préciser la nature de l’armée.
- source_word: הִגְדִּיל
  choice: il s’éleva
  rationale: Dans ce chapitre, le hiphil de גדל évoque une grandeur arrogante. « S’éleva » rend idiomatiquement cette exaltation de soi tout en conservant le sujet masculin du contexte, la petite corne.
- source_word: וּמִמֶּנּוּ
  choice: de lui
  rationale: Le suffixe pronominal est masculin singulier. La traduction littérale conserve l’ambiguïté de son antécédent au lieu de la résoudre.
- source_word: הרים
  choice: fut retirée
  rationale: Dans ce contexte cultuel, l’idée est celle de la suppression du service régulier. Le passif français suit la compréhension contextuelle traditionnelle sans préciser l’agent.
- source_word: הַתָּמִיד
  choice: l’offrande régulière
  rationale: תָּמִיד signifie « régulier, continuel » et désigne ici elliptiquement le service sacrificiel permanent du sanctuaire. « Offrande régulière » garde la référence cultuelle sans ajouter un terme absent comme « holocauste ».
- source_word: וְהֻשְׁלַךְ
  choice: fut jeté à terre
  rationale: Le hophal exprime le passif et conserve une image de renversement violent. « Jeté à terre » est naturel en français tout en restant proche de l’hébreu.
- source_word: מְכוֹן
  choice: l’emplacement
  rationale: מָכוֹן peut désigner un lieu établi, un site ou une fondation. « Emplacement » convient au sanctuaire et évite de limiter indûment le sens à ses fondations matérielles.
- source_word: מִקְדָּשׁוֹ
  choice: son sanctuaire
  rationale: מִקְדָּשׁ désigne un lieu saint ou sanctuaire. « Sanctuaire » conserve précisément sa portée cultuelle sans l’élargir à tout le complexe du temple.
theological_decisions:
- issue: Identité du « chef de l’armée »
  choice: Le titre est rendu sans identifier son référent.
  alternative: Il peut être compris comme Dieu, un chef céleste ou angélique, le grand prêtre Onias III dans certaines lectures historiques, ou le Messie dans certaines lectures chrétiennes.
  rationale: Le titre hébreu est élevé, mais le verset ne précise pas à lui seul l’identité du personnage. La traduction laisse donc subsister cette tension interprétative.
- issue: Antécédent de « de lui »
  choice: Le pronom masculin singulier est conservé littéralement.
  alternative: Il peut être rapporté au chef de l’armée, compris par rapport à l’armée, ou rendu de manière impersonnelle selon l’analyse syntaxique retenue.
  rationale: Le discours permet plusieurs analyses débattues. Expliciter l’antécédent dans le texte principal trancherait une question que l’hébreu laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe légèrement solennelle « de lui fut retirée » est maintenue afin de préserver le pronom hébreu et son ambiguïté, tandis que le reste de la phrase privilégie une formulation naturelle.
