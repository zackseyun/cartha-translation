source:
  edition: WLC
  text: וְ/הַ֨/נִּשְׁבֶּ֔רֶת וַ/תַּֽעֲמֹ֥דְנָה אַרְבַּ֖ע תַּחְתֶּ֑י/הָ אַרְבַּ֧ע מַלְכֻי֛וֹת מִ/גּ֥וֹי יַעֲמֹ֖דְנָה וְ/לֹ֥א בְ/כֹחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/022.yaml
  text: 'And as for the broken horn[a], in whose place four arose: four kingdoms will arise from that nation, but not with its power.'
translation:
  language: fr
  text: Quant à la corne brisée, à la place de laquelle quatre autres se sont élevées, quatre royaumes s’élèveront de cette nation, mais pas avec sa puissance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le possessif peut renvoyer au premier roi représenté par la corne brisée : « mais pas avec la puissance de celui-ci ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁבֶּרֶת
  choice: Quant à la corne brisée
  rationale: Le participe féminin singulier « brisée » reprend implicitement la « corne » du verset précédent. Le nom est rétabli pour que la phrase soit claire en français, et « Quant à » rend la fonction explicative de la proposition.
- source_word: וַתַּעֲמֹדְנָה אַרְבַּע תַּחְתֶּיהָ
  choice: à la place de laquelle quatre autres se sont élevées
  rationale: Dans ce contexte politique et visionnaire, עמד décrit l’apparition ou l’accession au pouvoir. « Autres » explicite naturellement que les quatre cornes succèdent à celle qui a été brisée.
- source_word: אַרְבַּע מַלְכֻיּוֹת
  choice: quatre royaumes
  rationale: Le terme peut désigner la royauté ou la domination royale, mais « royaumes » exprime ici naturellement les puissances politiques issues de la nation.
- source_word: מִגּוֹי
  choice: de cette nation
  rationale: גּוֹי désigne une nation ou un peuple. Le démonstratif renvoie clairement à la nation mentionnée dans le contexte sans ajouter d’identification historique au texte.
- source_word: יַעֲמֹדְנָה
  choice: s’élèveront
  rationale: Le verbe indique ici que des puissances politiques apparaîtront et accéderont à la domination; « s’élèveront » conserve aussi l’image du texte.
- source_word: וְלֹא בְכֹחוֹ
  choice: mais pas avec sa puissance
  rationale: Cette formulation proche de l’hébreu conserve le pronom possessif et laisse ouverte la question de son référent, tout en restant compréhensible en français.
theological_decisions:
- issue: Référent du suffixe pronominal dans וְלֹא בְכֹחוֹ
  choice: La formulation « pas avec sa puissance » conserve l’ambiguïté du référent.
  alternative: « mais pas avec la puissance de celui-ci », en renvoyant explicitement au premier roi représenté par la corne brisée
  rationale: Les cornes représentent étroitement des rois et des royaumes dans la vision. Le texte hébreu ne contraint pas à trancher entre le symbole politique et le premier roi; la traduction principale préserve donc cette tension, et la note signale la lecture personnelle possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe explicative est légèrement réorganisée pour être naturelle, tout en conservant l’image des cornes, le mouvement d’élévation et l’ambiguïté du possessif final.
