id: DAN.8.5
reference: Daniel 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֣י הָיִ֣יתִי מֵבִ֗ין וְ/הִנֵּ֤ה צְפִיר הָֽ/עִזִּים֙ בָּ֤א מִן הַֽ/מַּעֲרָב֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֵ֥ין נוֹגֵ֖עַ בָּ/אָ֑רֶץ וְ/הַ֨/צָּפִ֔יר קֶ֥רֶן חָז֖וּת בֵּ֥ין עֵינָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/005.yaml
  text: As I was considering[a], behold, a male goat came from the west over the face of the whole earth, without touching the ground[c][b]; and the goat had a conspicuous horn between its eyes.
translation:
  language: fr
  text: Tandis que je réfléchissais[a], voici qu’un bouc venait de l’ouest, parcourant toute la surface de la terre[b] sans toucher le sol. Le bouc avait entre les yeux une corne bien visible[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tandis que je cherchais à comprendre ».
    reason: Le participe hébreu peut mettre l’accent soit sur la réflexion attentive, soit sur l’effort de compréhension.
  - marker: b
    text: Ou « tout le pays ». Le mot hébreu peut désigner la terre entière ou un territoire.
    reason: La portée géographique de הָאָרֶץ demeure lexicalement ouverte, même si le contexte visionnaire favorise ici « la terre ».
  - marker: c
    text: Ou « une corne proéminente » ou « remarquable ».
    reason: Le sens précis de חָזוּת peut relever de la visibilité, de la proéminence ou du caractère frappant.
lexical_decisions:
- source_word: הָיִיתִי מֵבִין
  choice: Tandis que je réfléchissais
  rationale: La construction היה suivie d’un participe exprime une action en cours. Dans le contexte de la vision, מבין désigne ici une réflexion attentive plutôt que la simple possession d’une compréhension.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette tournure française conserve la vivacité du marqueur visionnaire hébreu tout en restant naturelle et digne.
- source_word: צְפִיר הָעִזִּים
  choice: un bouc
  rationale: L’expression désigne précisément un caprin mâle. « Bouc » exprime ce détail clairement et sans lourdeur en français moderne.
- source_word: מִן הַמַּעֲרָב
  choice: de l’ouest
  rationale: מַעֲרָב désigne l’ouest, région du coucher du soleil. La traduction directe est naturelle en français.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: parcourant toute la surface de la terre
  rationale: La formulation rend le déplacement sur ou au-dessus de l’ensemble de la surface terrestre, sans reproduire servilement l’idiome hébreu.
- source_word: וְאֵין נוֹגֵעַ בָּאָרֶץ
  choice: sans toucher le sol
  rationale: Cette expression française naturelle conserve l’image d’un déplacement d’une rapidité extraordinaire. « Sol » évite une répétition pesante de « terre ».
- source_word: קֶרֶן חָזוּת
  choice: une corne bien visible
  rationale: « Corne » maintient l’image animale et symbolique. חָזוּת signale ici une apparence frappante ou une forte visibilité; « bien visible » préserve cette nuance sans surinterpréter sa taille.
- source_word: בֵּין עֵינָיו
  choice: entre les yeux
  rationale: La traduction garde exactement la localisation donnée par l’hébreu, sans la remplacer par l’interprétation anatomique « sur le front ».
theological_decisions:
- issue: Imagerie animale symbolique de la vision apocalyptique
  choice: Conserver littéralement le bouc et la corne sans identifier leurs référents.
  alternative: Introduire dès ce verset l’interprétation ultérieure en parlant d’un royaume ou d’un souverain.
  rationale: Le verset présente d’abord les éléments de la vision; leur interprétation vient plus tard. Les expliciter ici modifierait la progression du texte.
- issue: Portée de הָאָרֶץ
  choice: Traduire par « la terre » tout en signalant l’autre possibilité en note.
  alternative: Traduire par « le pays » ou « toute la région ».
  rationale: Dans cette vision, l’ampleur du mouvement favorise « la terre », mais le nom hébreu peut aussi désigner un pays ou un territoire; cette ambiguïté lexicale mérite d’être conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici que » maintient le relief visionnaire; « bouc » est précis et courant; la syntaxe fluide conserve l’image d’un déplacement sans contact avec le sol.
