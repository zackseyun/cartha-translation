  text: וְ/הַ/צָּפִ֥יר הַ/שָּׂעִ֖יר מֶ֣לֶךְ יָוָ֑ן וְ/הַ/קֶּ֤רֶן הַ/גְּדוֹלָה֙ אֲשֶׁ֣ר בֵּין עֵינָ֔י/ו ה֖וּא הַ/מֶּ֥לֶךְ הָ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/021.yaml
  text: And the shaggy male goat is the king of Greece[b][a], and the great horn that is between his eyes is the first king.
translation:
  language: fr
  text: Le bouc velu est le roi de Grèce[a], et la grande corne entre ses yeux est le premier roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yavân », terme qui désigne couramment ici la Grèce ou le monde grec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּפִיר הַשָּׂעִיר
  choice: le bouc au poil rude
  rationale: L’expression associe deux termes qui désignent un bouc et soulignent son caractère velu. « Bouc au poil rude » conserve cette image vive dans un français naturel, sans réduire l’expression au simple « bouc ».
- source_word: מֶלֶךְ יָוָן
  choice: le roi de Grèce
  rationale: Dans ce contexte, יָוָן désigne la Grèce ou le monde grec. מֶלֶךְ étant singulier, « roi de Grèce » respecte plus directement la formulation que « royaume de Grèce ».
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: la grande corne
  rationale: Cette formulation naturelle conserve la grandeur et l’importance symbolique de la corne.
- source_word: אֲשֶׁר בֵּין עֵינָיו
  choice: entre ses yeux
  rationale: Le français peut rendre naturellement la relative hébraïque par un groupe prépositionnel. « Ses » reprend le bouc, masculin singulier.
- source_word: הוּא הַמֶּלֶךְ הָרִאשׁוֹן
  choice: est le premier roi
  rationale: רִאשׁוֹן indique ici le premier dans une succession. « Roi » maintient la correspondance avec מֶלֶךְ dans la première proposition.
theological_decisions:
- issue: Référent symbolique du bouc et de la corne
  choice: Le bouc représente le roi de Grèce, et la grande corne le premier roi.
  alternative: Comprendre le bouc collectivement comme le royaume grec.
  rationale: Le texte hébreu porte explicitement מֶלֶךְ יָוָן, « roi de Grèce », puis identifie la corne comme « le premier roi ». La traduction maintient cette tension entre la figure royale et la puissance politique collective sans ajouter d’identification historique.
translation_notes:
  register: Français international moderne, clair et digne. L’image inhabituelle du bouc velu est conservée sous une forme compréhensible. La phrase reste concise comme l’hébreu.
