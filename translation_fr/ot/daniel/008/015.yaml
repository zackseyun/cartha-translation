  text: וַ/יְהִ֗י בִּ/רְאֹתִ֛/י אֲנִ֥י דָנִיֵּ֖אל אֶת הֶ/חָז֑וֹן וָ/אֲבַקְשָׁ֣/ה בִינָ֔ה וְ/הִנֵּ֛ה עֹמֵ֥ד לְ/נֶגְדִּ֖/י כְּ/מַרְאֵה גָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/015.yaml
  text: And it happened[a], when I, Daniel, had seen the vision and was seeking understanding, behold, standing before me was one with the appearance of a man.
translation:
  language: fr
  text: Il arriva que[a], lorsque moi, Daniel, j’eus vu la vision et que je cherchai à la comprendre, voici qu’un être ayant l’apparence d’un homme se tenait devant moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « voici que se tenait devant moi quelqu’un qui avait l’apparence d’un homme ».'
    reason: alternative de formulation
lexical_decisions:
- source_word: וַיְהִי
  choice: Quand…
  rationale: La formule narrative introduit ici la circonstance temporelle qui mène à l’apparition. En français naturel, elle est intégrée à la proposition temporelle plutôt que rendue littéralement par « Et il arriva ».
- source_word: בִּרְאֹתִי אֲנִי דָנִיֵּאל
  choice: Quand moi, Daniel, j’eus vu
  rationale: L’infinitif construit avec ב exprime le temps. Le passé antérieur marque que la vision a été vue avant la recherche d’intelligence, tandis que « moi, Daniel » conserve l’insistance du pronom explicite suivi du nom.
- source_word: הֶחָזוֹן
  choice: la vision
  rationale: Rendu direct et cohérent de חָזוֹן dans le contexte visionnaire de Daniel.
- source_word: וָאֲבַקְשָׁה בִינָה
  choice: et que je cherchai à la comprendre
  rationale: בקשׁ exprime la recherche et בינה l’intelligence ou la compréhension. Le pronom « la » renvoie naturellement à la vision et évite en français la tournure abstraite et moins idiomatique « chercher de la compréhension ».
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette formule attire vivement l’attention sur ce qui apparaît, tout en gardant un registre narratif digne et actuel.
- source_word: עֹמֵד לְנֶגְדִּי
  choice: se tenait devant moi
  rationale: Le participe de עמד décrit la figure debout ou présente face à Daniel. « Se tenait devant moi » restitue naturellement cette posture sans surinterprétation.
- source_word: כְּמַרְאֵה גָבֶר
  choice: un être qui avait l’apparence d’un homme
  rationale: La préposition comparative כ et מראה décrivent une ressemblance visible. « Un être » explicite sobrement le référent implicite sans décider de sa nature; « homme » convient ici au masculin גבר.
theological_decisions:
- issue: Nature de la figure décrite par כְּמַרְאֵה גָבֶר
  choice: Décrire seulement un être ayant l’apparence d’un homme.
  alternative: L’identifier comme un ange sous forme humaine, un homme ou une figure divine préincarnée.
  rationale: Le verset donne une description phénoménologique, non une identification ontologique. La traduction préserve donc cette réserve et la tension du texte.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe évite l’archaïsme « il arriva que » tout en conservant l’accent porté sur « moi, Daniel » et la vivacité de « voici que ».
