source:
  edition: WLC
  text: וָ/אֶשְׁמַ֥ע קוֹל אָדָ֖ם בֵּ֣ין אוּלָ֑י וַ/יִּקְרָא֙ וַ/יֹּאמַ֔ר גַּבְרִיאֵ֕ל הָבֵ֥ן לְ/הַלָּ֖ז אֶת הַ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/016.yaml
  text: And I heard the voice of a man between the banks of the Ulai[a], and he called out and said, “Gabriel[c][b], make this one understand the vision.”
translation:
  language: fr
  text: 'Et j’entendis la voix d’un homme entre les rives de l’Oulaï[a], et un homme appela et dit : « Gabriel, fais comprendre la vision à celui-ci[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « entre l’Oulaï » ; le sens paraît être « entre les deux rives » ou « au milieu de l’Oulaï ».'
    reason: La construction hébraïque est concise et permet plusieurs manières de représenter la position par rapport au cours d’eau.
  - marker: b
    text: 'Ou : « à celui-là ».'
    reason: Le démonstratif hébreu peut être rendu par un démonstratif plus distant ; dans la scène, il désigne Daniel.
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Et j’entendis
  rationale: Le wayyiqtol poursuit le récit. Le passé simple convient au registre narratif français et conserve l’enchaînement sans expliciter davantage la valeur temporelle.
- source_word: קוֹל אָדָם
  choice: la voix d’un homme
  rationale: קוֹל signifie « voix » et אָדָם désigne ici un être humain concret, vraisemblablement masculin dans la scène. Cette formulation reste proche de l’hébreu tout en étant naturelle en français.
- source_word: בֵּין אוּלָי
  choice: entre les rives de l’Oulaï
  rationale: בֵּין signifie « entre », tandis qu’Oulaï est le nom du cours d’eau. La mention des rives explicite en français les deux côtés entre lesquels se trouve la voix, sans transformer la scène en une localisation « au-dessus » du cours d’eau.
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: Il appela et dit
  rationale: La traduction garde les deux verbes hébreux au lieu de les fondre en une seule introduction au discours.
- source_word: גַּבְרִיאֵל
  choice: Gabriel
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: הָבֵן
  choice: fais comprendre
  rationale: 'L’impératif au hiphil de בין a une valeur causative : Gabriel doit amener le destinataire à comprendre, et non simplement comprendre lui-même.'
- source_word: לְהַלָּז
  choice: à celui-ci
  rationale: Le démonstratif désigne Daniel sans répéter explicitement « homme ». « Celui-ci » conserve cette référence individuelle et la concision de l’hébreu.
- source_word: אֶת הַמַּרְאֶה
  choice: la vision
  rationale: Dans ce contexte de révélation, מַרְאֶה désigne ce qui a été montré à Daniel, donc « la vision » plutôt qu’une simple apparence.
theological_decisions:
- issue: Référence humaine dans קוֹל אָדָם et לְהַלָּז
  choice: « la voix d’un homme » pour אָדָם, puis « à celui-ci » pour le démonstratif
  alternative: « une voix humaine » et « à cet homme »
  rationale: Le premier syntagme nomme explicitement un homme, tandis que le second ne comporte qu’un démonstratif. La traduction distingue ces deux formes sans neutraliser la première ni ajouter un nom à la seconde.
- issue: Localisation de la voix par rapport à l’Oulaï
  choice: « entre les rives de l’Oulaï »
  alternative: « au milieu de l’Oulaï » ou, plus littéralement, « entre l’Oulaï »
  rationale: Le texte situe la voix « entre » par rapport au cours d’eau, mais la construction est concise et peut évoquer l’espace entre ses côtés. La traduction principale rend cette image intelligible, tandis que la note signale la formulation hébraïque.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple s’accorde au récit biblique écrit ; la syntaxe du discours reste directe et aisément compréhensible. Les notes ne signalent que les ambiguïtés réelles de la localisation et du démonstratif.
