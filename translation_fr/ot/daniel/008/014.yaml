  text: וַ/יֹּ֣אמֶר אֵלַ֔/י עַ֚ד עֶ֣רֶב בֹּ֔קֶר אַלְפַּ֖יִם וּ/שְׁלֹ֣שׁ מֵא֑וֹת וְ/נִצְדַּ֖ק קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/014.yaml
  text: And he said to me[a], “Until 2,300 evenings and mornings[b]; then the sanctuary will be restored.”
translation:
  language: fr
  text: 'Et il me dit : « Jusqu’à 2 300 soirs et matins[a] ; alors le sanctuaire sera rétabli[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu porte littéralement : « Jusqu’à soir-matin, 2 300 » ; l’expression peut désigner soit 2 300 jours complets, soit 2 300 offrandes du soir et du matin, ce qui correspondrait à environ 1 150 jours.'
    reason: alternative_reading
  - marker: b
    text: 'Autres traductions possibles : « alors le sanctuaire sera purifié », « réhabilité » ou « reconnu juste ». Le verbe hébreu signifie littéralement qu’il sera remis dans son juste état.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Et il dit
  rationale: Le wayyiqtol de אמר poursuit simplement le récit et introduit la réponse.
- source_word: אֵלַי
  choice: me
  rationale: Le complément avec suffixe de première personne se rend naturellement par « me » dans « il me dit ».
- source_word: עַד
  choice: Jusqu’à
  rationale: עַד marque ici la limite temporelle demandée par la question « Jusqu’à quand ? ».
- source_word: עֶרֶב בֹּקֶר
  choice: soirs et matins
  rationale: Cette formulation conserve les deux noms hébreux et ne tranche pas entre un décompte de jours complets et celui des offrandes du soir et du matin.
- source_word: אַלְפַּיִם וּשְׁלֹשׁ מֵאוֹת
  choice: 2 300
  rationale: La notation chiffrée avec espace des milliers suit l’usage typographique français moderne.
- source_word: וְנִצְדַּק
  choice: sera rétabli
  rationale: Le nifal de צדק exprime ici l’idée d’être remis en ordre ou dans son juste état ; « sera rétabli » reste naturel sans imposer le sens cultuel plus étroit de « purifié ».
- source_word: קֹדֶשׁ
  choice: le sanctuaire
  rationale: Dans le contexte du temple en Daniel 8, קֹדֶשׁ désigne le plus naturellement le sanctuaire ou lieu saint.
theological_decisions:
- issue: Sens de וְנִצְדַּק קֹדֶשׁ concernant le temple
  choice: le sanctuaire sera rétabli
  alternative: le sanctuaire sera purifié, réhabilité ou reconnu juste
  rationale: Le texte emploie צדק et non le verbe habituel signifiant « purifier ». La traduction principale garde donc l’idée large de remise en ordre, tandis que la note signale les principales possibilités lexicales.
- issue: Portée chronologique de עֶרֶב בֹּקֶר
  choice: conserver « 2 300 soirs et matins »
  alternative: 2 300 jours complets, ou 2 300 offrandes du soir et du matin correspondant à environ 1 150 jours
  rationale: La formulation hébraïque ne permet pas de résoudre sûrement le mode de calcul ; le texte principal préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu, avec une ponctuation française naturelle. Les marqueurs de notes sont placés après « me dit » et après « soirs et matins » afin de correspondre précisément à leur objet.
