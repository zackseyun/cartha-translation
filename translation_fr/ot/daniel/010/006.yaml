source:
  edition: WLC
  text: וּ/גְוִיָּת֣/וֹ כְ/תַרְשִׁ֗ישׁ וּ/פָנָ֞י/ו כְּ/מַרְאֵ֤ה בָרָק֙ וְ/עֵינָי/ו֙ כְּ/לַפִּ֣ידֵי אֵ֔שׁ וּ/זְרֹֽעֹתָי/ו֙ וּ/מַרְגְּלֹתָ֔י/ו כְּ/עֵ֖ין נְחֹ֣שֶׁת קָלָ֑ל וְ/ק֥וֹל דְּבָרָ֖י/ו כְּ/ק֥וֹל הָמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/006.yaml
  text: His body was like beryl[a], his face like the appearance of lightning, his eyes like torches of fire, his arms and his feet like the gleam of polished bronze[c][b], and the sound of his words like the sound of a multitude.
translation:
  language: fr
  text: Son corps était semblable à une pierre de Tarsis[a], son visage avait l’aspect de l’éclair, ses yeux étaient comme des torches de feu, ses bras et ses pieds comme l’éclat du bronze poli[b], et le son de ses paroles comme le bruit d’une multitude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque désigne une pierre précieuse dont l’identification exacte est incertaine; on propose notamment le béryl, la topaze ou la chrysolite.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme l’aspect du bronze étincelant »; le sens exact du terme décrivant le métal est incertain.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « comme le tumulte d’une foule » ou « comme le grondement d’une multitude ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְוִיָּתוֹ
  choice: son corps
  rationale: גְוִיָּה désigne ici le corps ou la forme physique; « son corps » est naturel et précis dans cette description visionnaire.
- source_word: כְתַרְשִׁישׁ
  choice: semblable à une pierre de Tarsis
  rationale: L’identification minéralogique de תַּרְשִׁישׁ est incertaine. La translittération descriptive évite de trancher arbitrairement entre béryl, topaze et chrysolite; une note explicite l’incertitude.
- source_word: כְמַרְאֵה בָרָק
  choice: avait l’aspect de l’éclair
  rationale: מַרְאֶה exprime l’apparence visible. Cette formulation conserve cette nuance tout en restant idiomatique en français.
- source_word: כְלַפִּידֵי אֵשׁ
  choice: comme des torches de feu
  rationale: לַפִּיד désigne une torche ou un brandon; la formulation garde l’image vive et la construction hébraïque.
- source_word: זְרֹעֹתָיו וּמַרְגְּלֹתָיו
  choice: ses bras et ses pieds
  rationale: Les termes anatomiques sont rendus dans leur sens courant, sans préciser davantage les extrémités inférieures que ne le fait le contexte.
- source_word: כְעֵין נְחֹשֶׁת קָלָל
  choice: comme l’éclat du bronze poli
  rationale: עֵין indique ici l’aspect ou l’éclat; נְחֹשֶׁת désigne le bronze ou le cuivre, et קָלָל suggère vraisemblablement un métal poli, luisant ou bruni.
- source_word: קוֹל דְּבָרָיו
  choice: le son de ses paroles
  rationale: Cette traduction conserve la structure littérale et met en relief l’effet auditif de sa parole.
- source_word: כְקוֹל הָמוֹן
  choice: comme le bruit d’une multitude
  rationale: הָמוֹן peut évoquer à la fois une foule nombreuse et le tumulte qu’elle produit; « bruit d’une multitude » maintient cette double évocation.
theological_decisions:
- issue: Identification du personnage décrit
  choice: Présenter directement la figure visionnaire sans l’identifier.
  alternative: L’identifier comme un messager angélique, une manifestation divine ou une apparition préincarnée du Christ.
  rationale: Le verset décrit son apparence sans établir explicitement son identité; la traduction ne doit pas imposer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et imagé. La syntaxe répétitive de la vision est conservée sans devenir pesante. « Pierre de Tarsis » préserve l’incertitude du nom de la gemme, tandis que les notes présentent les principales possibilités.
