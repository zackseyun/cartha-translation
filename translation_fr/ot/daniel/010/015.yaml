source:
  edition: WLC
  text: וּ/בְ/דַבְּר֣/וֹ עִמִּ֔/י כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה נָתַ֧תִּי פָנַ֛/י אַ֖רְצָ/ה וְ/נֶאֱלָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/015.yaml
  text: And when he spoke these words with me[b][a], I set my face toward the ground and became speechless.
translation:
  language: fr
  text: Pendant qu’il me disait ces paroles, je tournai le visage vers le sol et restai sans voix.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְדַבְּרוֹ
  choice: Quand il m’eut dit
  rationale: La préposition בְּ avec l’infinitif construit exprime ici le temps. Le passé antérieur marque naturellement, dans un récit au passé, que ces paroles précèdent immédiatement la réaction de Daniel, sans exclure absolument que celle-ci ait commencé pendant le discours.
- source_word: עִמִּי
  choice: m’
  rationale: עִם signifie littéralement « avec », mais « dire/parler avec moi ces paroles » serait peu naturel en français. « Il m’eut dit ces paroles » rend idiomatiquement le destinataire tout en conservant le sens contextuel.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ces paroles
  rationale: Dans le contexte immédiat d’un discours, דְּבָרִים désigne le plus naturellement les paroles qui viennent d’être prononcées. Le כְּ est bien rendu par la construction française globale, sans calque lourd tel que « de telles paroles ».
- source_word: נָתַתִּי פָנַי אַרְצָה
  choice: je tournai mon visage vers le sol
  rationale: Cette formulation conserve l’image hébraïque du visage orienté vers le bas tout en étant plus naturelle en français moderne que le calque « je plaçai mon visage ».
- source_word: אַרְצָה
  choice: vers le sol
  rationale: La terminaison directionnelle est rendue par « vers » ; dans cette description de posture, « le sol » est plus précis et idiomatique que « la terre ».
- source_word: וְנֶאֱלָמְתִּי
  choice: et restai sans voix
  rationale: Le nifal de אלם décrit ici l’état de Daniel, devenu incapable de parler. « Restai sans voix » est naturel et n’implique ni mutisme permanent ni intervention extérieure explicite.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple et le passé antérieur conviennent au registre biblique soutenu sans archaïsme lexical. La formulation évite un calque de עִמִּי qui serait maladroit en français.
