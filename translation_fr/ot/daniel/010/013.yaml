id: DAN.10.13
reference: Daniel 10:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שַׂ֣ר מַלְכ֣וּת פָּרַ֗ס עֹמֵ֤ד לְ/נֶגְדִּ/י֙ עֶשְׂרִ֣ים וְ/אֶחָ֣ד י֔וֹם וְ/הִנֵּ֣ה מִֽיכָאֵ֗ל אַחַ֛ד הַ/שָּׂרִ֥ים הָ/רִאשֹׁנִ֖ים בָּ֣א לְ/עָזְרֵ֑/נִי וַ/אֲנִי֙ נוֹתַ֣רְתִּי שָׁ֔ם אֵ֖צֶל מַלְכֵ֥י פָרָֽס׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/013.yaml
  text: But the prince of the kingdom of Persia stood against me for twenty-one days[a], and behold, Michael, one of the chief princes, came to help me[b], and I was left there beside the kings of Persia.
translation:
  language: fr
  text: Mais le prince du royaume de Perse s’est opposé à moi pendant vingt et un jours. Et voici que Michel, l’un des principaux princes[a], est venu à mon aide, et moi, je suis resté là auprès des rois de Perse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’un des premiers princes » ou « l’un des princes les plus éminents ».
    reason: Alternative lexicale pour הָרִאשֹׁנִים, qui peut indiquer la priorité ou la prééminence.
  - marker: b
    text: L’hébreu dit littéralement « les rois de Perse » ; certaines traductions emploient le singulier « le roi de Perse », mais le texte hébreu est au pluriel.
    reason: Préservation du pluriel de מַלְכֵי פָרָס et signalement d’une traduction traditionnelle alternative.
lexical_decisions:
- source_word: שַׂר
  choice: prince
  rationale: « Prince » conserve l’ambiguïté du terme hébreu entre une haute autorité politique et une puissance céleste, tout en maintenant le parallèle entre le prince de Perse et Michel.
- source_word: מַלְכוּת פָּרַס
  choice: royaume de Perse
  rationale: Cette traduction rend explicitement le rapport construit de l’hébreu et reste naturelle en français.
- source_word: עֹמֵד לְנֶגְדִּי
  choice: s’est opposé à moi
  rationale: L’expression décrit une position d’opposition durable. Le passé composé convient au récit français et « s’opposer » restitue clairement la valeur adversative sans préciser la nature du conflit.
- source_word: עֶשְׂרִים וְאֶחָד יוֹם
  choice: pendant vingt et un jours
  rationale: « Pendant » exprime naturellement en français la durée indiquée directement en hébreu.
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: La formule maintient l’effet de mise en relief et la vivacité de הִנֵּה dans un registre digne mais actuel.
- source_word: מִיכָאֵל
  choice: Michel
  rationale: La forme française traditionnelle et largement reconnue du nom biblique est employée.
- source_word: אַחַד הַשָּׂרִים הָרִאשֹׁנִים
  choice: l’un des principaux princes
  rationale: « Principaux » exprime naturellement une primauté de rang ou d’importance, sans exclure le sens plus littéral de « premiers », signalé en note.
- source_word: בָּא לְעָזְרֵנִי
  choice: est venu à mon aide
  rationale: Cette tournure française courante rend fidèlement le mouvement suivi du but exprimé en hébreu.
- source_word: נוֹתַרְתִּי
  choice: je suis resté
  rationale: Le nifal de יתר peut signifier « rester » ou « être laissé ». « Je suis resté » est naturel en français et évite d’introduire explicitement un agent que le texte ne nomme pas.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe locatif est conservé afin de respecter la continuité spatiale du récit.
- source_word: אֵצֶל מַלְכֵי פָרָס
  choice: auprès des rois de Perse
  rationale: « Auprès de » rend le sens spatial ou relationnel de אֵצֶל sans imposer ici une relation hostile. Le pluriel « rois » est maintenu conformément au texte hébreu.
theological_decisions:
- issue: Identité du « prince du royaume de Perse » et des « principaux princes »
  choice: Conserver le mot « prince » sans identifier explicitement ces personnages comme des anges ou comme des dirigeants humains.
  alternative: Traduire ou expliciter par « ange », « puissance spirituelle » ou « dirigeant ».
  rationale: Le contexte suggère fortement un conflit surnaturel, notamment par le parallèle avec Michel, mais שַׂר ne signifie pas en lui-même « ange ». Le maintien de « prince » laisse au contexte sa portée et préserve la tension du texte.
- issue: Valeur de הָרִאשֹׁנִים
  choice: « principaux », avec l’alternative plus littérale en note.
  alternative: « premiers » ou « les plus éminents ».
  rationale: Le terme peut marquer la priorité, le rang ou la prééminence. « Principaux » est idiomatique et garde l’idée hiérarchique sans trancher entièrement la nuance.
- issue: Pluriel מַלְכֵי פָרָס
  choice: « les rois de Perse »
  alternative: « le roi de Perse » ou une explicitation dynastique telle que « la lignée des rois de Perse ».
  rationale: Le texte hébreu porte un pluriel réel. Le conserver évite une harmonisation interprétative et permet qu’il désigne plusieurs rois, une dynastie ou plusieurs autorités royales.
translation_notes:
  register: Français international moderne, clair et digne. Les tournures « Et voici que » et « auprès de » gardent une légère solennité biblique sans archaïsme. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
