  variant: modern international French
source:
  edition: WLC
  text: לֶ֣חֶם חֲמֻד֞וֹת לֹ֣א אָכַ֗לְתִּי וּ/בָשָׂ֥ר וָ/יַ֛יִן לֹא בָ֥א אֶל פִּ֖/י וְ/ס֣וֹךְ לֹא סָ֑כְתִּי עַד מְלֹ֕את שְׁלֹ֥שֶׁת שָׁבֻעִ֖ים יָמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/003.yaml
  text: I ate no delicacies[a], and no meat or wine entered my mouth, nor did I anoint myself at all[b], until the completion of three full weeks.
translation:
  language: fr
  text: Je ne mangeai aucun mets de choix[a] ; ni viande ni vin n’entrèrent dans ma bouche, et je ne m’oignis pas du tout, jusqu’à ce que trois semaines entières soient écoulées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pain de choses désirables », c’est-à-dire une nourriture recherchée ou délicate.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « trois semaines de jours », c’est-à-dire trois semaines complètes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֲמֻדוֹת
  choice: mets de choix
  rationale: L’expression signifie littéralement « pain de choses désirables » et désigne idiomatiquement une nourriture recherchée ou délicate, non le pain seul.
- source_word: בָשָׂר
  choice: viande
  rationale: Dans ce contexte alimentaire, « viande » est l’équivalent français naturel de בָשָׂר.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent direct et usuel du terme hébreu.
- source_word: לֹא בָא אֶל־פִּי
  choice: n’entrèrent dans ma bouche
  rationale: Cette formulation conserve l’image de l’idiome hébreu tout en exprimant clairement l’abstention de consommation.
- source_word: סוֹךְ ... סָכְתִּי
  choice: je ne m’oignis pas du tout
  rationale: Le verbe désigne l’application d’huile sur le corps, pratique de soin ou de rafraîchissement ; « du tout » rend l’insistance de la construction hébraïque.
- source_word: עַד מְלֹאת
  choice: jusqu’à ce que ... soient écoulées
  rationale: Cette tournure française naturelle exprime l’achèvement de la période indiqué par l’infinitif de מלא.
- source_word: שְׁלֹשֶׁת שָׁבֻעִים יָמִים
  choice: trois semaines entières
  rationale: Littéralement « trois semaines de jours » ; l’expression souligne qu’il s’agit de trois semaines complètes.
