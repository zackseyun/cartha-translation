  text: אֲבָל֙ אַגִּ֣יד לְ/ךָ֔ אֶת הָ/רָשׁ֥וּם בִּ/כְתָ֖ב אֱמֶ֑ת וְ/אֵ֨ין אֶחָ֜ד מִתְחַזֵּ֤ק עִמִּ/י֙ עַל אֵ֔לֶּה כִּ֥י אִם מִיכָאֵ֖ל שַׂרְ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/021.yaml
  text: But I will tell you what is recorded in the writing of truth[a]. And there is no one who stands firmly with me against these except Michael[b], your prince.
translation:
  language: fr
  text: Mais je te révélerai ce qui est consigné dans l’écrit de vérité[a]. Personne ne se tient fermement à mes côtés contre ceux-là, excepté Michel[b], votre prince.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui est écrit dans l’écrit de vérité ».'
    reason: Alternative lexicale reflétant plus littéralement le participe passif.
  - marker: b
    text: 'Ou : « Personne ne me soutient dans ces affaires, excepté Michel ». L’expression hébraïque peut évoquer le fait de tenir ferme aux côtés de quelqu’un, et « ceux-là » peut désigner soit les puissances adverses, soit les affaires dont il est question.'
    reason: La construction permet une lecture adversative ou une référence plus générale aux affaires évoquées.
lexical_decisions:
- source_word: אֲבָל
  choice: Mais
  rationale: La particule marque un contraste avec ce qui précède; « Mais » est direct et naturel en français.
- source_word: אַגִּיד לְךָ
  choice: je te révélerai
  rationale: Le hiphil de נגד signifie annoncer, faire connaître ou révéler. Dans le contexte d’une révélation céleste, « révélerai » est naturel sans ajouter de contenu.
- source_word: הָרָשׁוּם
  choice: ce qui est consigné
  rationale: Le participe passif substantivé de רשם désigne ce qui a été inscrit ou enregistré; « consigné » conserve l’idée d’un écrit faisant autorité.
- source_word: בִּכְתָב אֱמֶת
  choice: dans l’écrit de vérité
  rationale: כְּתָב désigne un écrit ou document. « L’écrit de vérité » reste proche de la formulation hébraïque et évite de préciser qu’il s’agit d’un livre.
- source_word: וְאֵין אֶחָד
  choice: Personne ne
  rationale: Cette tournure française rend naturellement la construction existentielle hébraïque sans alourdir la phrase.
- source_word: מִתְחַזֵּק עִמִּי
  choice: ne se tient fermement à mes côtés
  rationale: Le hitpael de חזק exprime ici l’idée de se montrer fort ou de tenir ferme avec quelqu’un; cette formulation conserve à la fois la force et l’association.
- source_word: עַל אֵלֶּה
  choice: contre ceux-là
  rationale: Dans le contexte de conflit, עַל peut être compris dans un sens adversatif. Le pronom masculin pluriel laisse les référents implicites comme dans l’hébreu.
- source_word: כִּי אִם
  choice: excepté
  rationale: Après une négation, la locution introduit naturellement l’unique exception.
- source_word: מִיכָאֵל
  choice: Michel
  rationale: La forme française traditionnelle et intelligible du nom biblique est retenue.
- source_word: שַׂרְכֶם
  choice: votre prince
  rationale: שַׂר désigne un prince, chef ou dirigeant. « Votre prince » correspond au contexte céleste de Daniel sans importer un titre absent du verset.
theological_decisions:
- issue: Identité et fonction de Michel
  choice: Michel est appelé « votre prince ».
  alternative: L’identifier explicitement comme archange ou comme représentation symbolique d’Israël.
  rationale: Le verset emploie seulement שַׂרְכֶם, « votre prince ». La traduction conserve ce titre sans ajouter une identification théologique ultérieure.
- issue: Référent de עַל אֵלֶּה
  choice: « contre ceux-là », compris dans le cadre du conflit avec des puissances adverses.
  alternative: « dans ces affaires », en comprenant le groupe comme un soutien concernant les sujets évoqués.
  rationale: Le contexte immédiat de lutte favorise le sens adversatif, mais l’ambiguïté grammaticale est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure proche de l’imagerie du texte hébreu, notamment « l’écrit de vérité » et « votre prince », tout en employant une syntaxe française naturelle.
