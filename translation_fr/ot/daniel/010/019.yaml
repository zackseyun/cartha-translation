source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר אַל תִּירָ֧א אִישׁ חֲמֻד֛וֹת שָׁל֥וֹם לָ֖/ךְ חֲזַ֣ק וַ/חֲזָ֑ק וּֽ/בְ/דַבְּר֤/וֹ עִמִּ/י֙ הִתְחַזַּ֔קְתִּי וָ/אֹֽמְרָ֛/ה יְדַבֵּ֥ר אֲדֹנִ֖/י כִּ֥י חִזַּקְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/019.yaml
  text: And he said[a], “Do not fear, man greatly beloved; peace be to you. Be strong, yes, be strong.” And when he spoke with me, I was strengthened and said, “Let my lord speak, for you have strengthened me.”
translation:
  language: fr
  text: 'Il dit : « N’aie pas peur, homme bien-aimé[a] ! Que la paix soit avec toi. Sois fort, oui, sois fort ! » Pendant qu’il me parlait, je repris des forces et je dis : « Que mon seigneur parle, car tu m’as fortifié. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « homme hautement estimé » ou « homme précieux ». L’expression hébraïque signifie littéralement « homme des choses désirables/précieuses » et marque une faveur particulière.
    reason: Alternative lexicale nécessaire pour préserver l’éventail de sens de l’expression hébraïque.
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: homme bien-aimé
  rationale: L’expression associe « homme » à un pluriel évoquant les choses désirables ou précieuses et fonctionne ici comme une appellation marquant une faveur particulière. « Homme bien-aimé » est naturel en français et conserve la dimension personnelle, tout en signalant en note les autres nuances possibles.
- source_word: שָׁלוֹם לָךְ
  choice: Que la paix soit avec toi
  rationale: La formule exprime ici un souhait ou une bénédiction, et non une simple affirmation. Cette tournure française en restitue clairement la valeur.
- source_word: חֲזַק וַחֲזָק
  choice: Sois fort, oui, sois fort
  rationale: La répétition des impératifs intensifie l’exhortation. Le redoublement est conservé, avec « oui » pour rendre son emphase de façon naturelle.
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: Pendant qu’il me parlait
  rationale: La préposition suivie de l’infinitif construit a une valeur temporelle. L’imparfait français rend le déroulement de la parole durant lequel Daniel reprend des forces.
- source_word: הִתְחַזַּקְתִּי
  choice: je repris des forces
  rationale: Le hitpael indique que Daniel entre dans un état de force renouvelée. Cette expression idiomatique française rend naturellement ce résultat sans effacer le lien contextuel avec la force.
- source_word: יְדַבֵּר אֲדֹנִי
  choice: Que mon seigneur parle
  rationale: L’inaccompli a ici une valeur jussive de demande respectueuse. La minuscule à « seigneur » indique un titre honorifique adressé à l’interlocuteur, sans l’identifier au nom divin.
- source_word: כִּי חִזַּקְתָּנִי
  choice: car tu m’as fortifié
  rationale: La conjonction introduit la raison pour laquelle Daniel est désormais prêt à écouter. « Fortifié » préserve explicitement le motif lexical de la force présent dans tout le verset.
theological_decisions:
- issue: Sens de אֲדֹנִי dans l’adresse à l’interlocuteur
  choice: mon seigneur
  alternative: mon maître ; Seigneur
  rationale: La forme hébraïque est une adresse respectueuse au singulier. Le contexte désigne celui qui parle à Daniel, sans imposer son identification au tétragramme ni un titre christologique. La minuscule maintient cette distinction.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier hébreu et convient au dialogue direct. La répétition emphatique est maintenue, de même que le contraste entre « reprendre des forces » et « fortifier ». Le marqueur [a] figure dans le texte principal.
