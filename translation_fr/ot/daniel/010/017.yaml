  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵ֣יךְ יוּכַ֗ל עֶ֤בֶד אֲדֹנִ/י֙ זֶ֔ה לְ/דַבֵּ֖ר עִם אֲדֹ֣נִ/י זֶ֑ה וַ/אֲנִ֤י מֵ/עַ֨תָּה֙ לֹֽא יַעֲמָד בִּ֣/י כֹ֔חַ וּ/נְשָׁמָ֖ה לֹ֥א נִשְׁאֲרָה בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/017.yaml
  text: So how can this servant of my lord speak with my lord like this? As for me[a], from now on no strength remains in me[c][b], and no breath is left in me.
translation:
  language: fr
  text: Comment donc ce serviteur de mon seigneur pourrait-il parler avec mon seigneur que voici[b] ? Quant à moi, maintenant[c], aucune force ne subsiste en moi, et il ne me reste plus de souffle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'L’hébreu répète le démonstratif : littéralement, « ce serviteur de mon seigneur … mon seigneur que voici ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « dès maintenant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵיךְ יוּכַל
  choice: Comment donc… pourrait-il
  rationale: « Comment donc » rend le lien avec ce qui précède et la force de la question rhétorique ; le conditionnel exprime naturellement en français l’incapacité éprouvée dans cette situation.
- source_word: עֶבֶד אֲדֹנִי זֶה
  choice: le serviteur de mon seigneur que je suis
  rationale: « Serviteur » convient à cette autodésignation respectueuse de cour. La tournure « que je suis » restitue naturellement la référence démonstrative à Daniel lui-même sans suggérer un statut d’esclave.
- source_word: לְדַבֵּר עִם אֲדֹנִי זֶה
  choice: parler ainsi avec mon seigneur
  rationale: « Parler avec » conserve la valeur de עִם. « Ainsi » exprime idiomatiquement la valeur situationnelle du second זֶה, tandis qu’une note signale la répétition hébraïque.
- source_word: מֵעַתָּה
  choice: maintenant
  rationale: Dans le contexte, l’expression désigne avant tout l’état présent de Daniel. « Dès maintenant » reste possible, mais pourrait en français suggérer plus fortement un état durable à venir.
- source_word: לֹא יַעֲמָד בִּי כֹחַ
  choice: aucune force ne subsiste en moi
  rationale: Cette formulation rend l’image hébraïque d’une force qui ne tient plus ou ne demeure plus en Daniel, dans un français naturel et soutenu.
- source_word: וּנְשָׁמָה לֹא נִשְׁאֲרָה בִי
  choice: il ne me reste plus de souffle
  rationale: נְשָׁמָה désigne ici le souffle vital, en parallèle avec la perte de force. La formulation française exprime clairement son épuisement physique sans interpréter le mot comme une entité spirituelle.
theological_decisions:
- issue: Sens de אֲדֹנִי dans l’adresse à un personnage exalté
  choice: mon seigneur
  alternative: mon maître
  rationale: Le terme est un titre respectueux adressé à l’interlocuteur et non le nom divin YHWH. « Mon seigneur » préserve le registre élevé et l’ambiguïté sur l’identité exacte du personnage sans lui attribuer explicitement un statut divin.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le respect de l’adresse et l’épuisement physique de Daniel, tout en évitant la répétition démonstrative peu naturelle en français.
