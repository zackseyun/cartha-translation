revisions:
- from: Je suis venu pour te faire comprendre ce qui arrivera à ton peuple dans la suite des temps[a], car la vision concerne encore des jours à venir[b].
  to: Je suis venu pour te faire comprendre ce qui arrivera à ton peuple dans les derniers temps[a], car la vision concerne des jours encore à venir[b].
  rationale: La révision remplace une expression française peu naturelle par « dans les derniers temps », qui rend plus précisément l’idiome prophétique hébreu tout en évitant de trancher des questions eschatologiques. Elle clarifie aussi, sans modification de sens, que les « jours » restent à venir. Les ancres et le contenu des notes demeurent cohérents avec les alternatives textuelles.
