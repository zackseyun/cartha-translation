id: DAN.10.14
reference: Daniel 10:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בָ֨אתִי֙ לַ/הֲבִ֣ינְ/ךָ֔ אֵ֛ת אֲשֶׁר יִקְרָ֥ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֣ית הַ/יָּמִ֑ים כִּי ע֥וֹד חָז֖וֹן לַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/014.yaml
  text: And I have come to make you understand what will happen to your people in the latter days[b][a], for the vision is yet for days to come.
translation:
  language: fr
  text: Je suis venu pour te faire comprendre ce qui arrivera à ton peuple dans les derniers temps[a], car la vision concerne des jours encore à venir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les derniers jours ». L’expression hébraïque désigne l’horizon futur où les événements parviennent à leur aboutissement.
    reason: alternative_reading
  - marker: b
    text: Ou « concerne de nombreux jours » ou « concerne des jours futurs ». L’expression indique que la vision porte sur un temps encore à venir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתִי
  choice: Je suis venu
  rationale: Le parfait qal à la première personne décrit une venue accomplie dont le but est maintenant exposé; le passé composé est naturel en français et maintient cette pertinence présente.
- source_word: לַהֲבִינְךָ
  choice: pour te faire comprendre
  rationale: L’infinitif construit au hiphil de בין avec suffixe de deuxième personne masculine singulière a une valeur causative, rendue clairement par « faire comprendre ».
- source_word: אֵת אֲשֶׁר
  choice: ce qui
  rationale: La marque de l’objet suivie du relatif introduit le contenu à comprendre; « ce qui » est l’équivalent français naturel.
- source_word: יִקְרָה לְעַמְּךָ
  choice: arrivera à ton peuple
  rationale: Le verbe קרה avec ל désigne ici ce qui se produira pour la partie concernée. « Arriver à » reste neutre et n’ajoute pas nécessairement une nuance de malheur.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: dans la suite des temps
  rationale: Cette formulation française conserve l’idée de la période ultérieure ou finale visée par l’expression prophétique, sans l’enfermer dans un système eschatologique précis.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici une explication ou une justification; « car » convient au registre biblique moderne sans être archaïque.
- source_word: עוֹד חָזוֹן לַיָּמִים
  choice: la vision concerne encore des jours à venir
  rationale: La construction concise et quelque peu ambiguë situe la vision dans un horizon encore futur. Cette traduction explicite la relation sans imposer l’idée quantitative de « nombreux jours ».
theological_decisions:
- issue: Portée eschatologique de בְּאַחֲרִית הַיָּמִים
  choice: dans la suite des temps
  alternative: dans les derniers jours
  rationale: L’expression hébraïque peut viser l’aboutissement futur des événements, mais le verset ne définit pas à lui seul un schéma précis de la fin. Le texte principal préserve cette ouverture, et la note fournit la formulation traditionnelle plus nettement eschatologique.
- issue: Sens temporel de לַיָּמִים
  choice: des jours à venir
  alternative: de nombreux jours
  rationale: La préposition et le nom peuvent être compris comme orientant la vision vers une époque future; une lecture quantitative demeure possible et est donc signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement suit l’adresse hébraïque au singulier. La phrase garde un ton prophétique sans employer de tournures inutilement archaïques; les deux ambiguïtés temporelles principales sont conservées au moyen de notes.
