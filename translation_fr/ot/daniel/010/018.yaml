  text: Again one with the appearance of a man touched me and strengthened me[a].
translation:
  language: fr
  text: De nouveau, celui qui avait l’apparence d’un homme me toucha et me fortifia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelqu’un qui ressemblait à un homme ». L’hébreu décrit l’aspect visible de la figure sans affirmer explicitement qu’elle était simplement humaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: De nouveau
  rationale: Avec le verbe qui suit, יסף marque ici la répétition de l’action. « De nouveau » rend naturellement cette valeur.
- source_word: וַיִּגַּע בִּי
  choice: me toucha
  rationale: Dans ce contexte visionnaire, נגע avec ב désigne un contact physique; « me toucha » en donne le sens direct.
- source_word: כְּמַרְאֵה אָדָם
  choice: celui qui avait l’apparence d’un homme
  rationale: מַרְאֶה désigne l’aspect visible et la préposition כ exprime la ressemblance. Cette formulation décrit la figure sans l’identifier simplement comme un être humain.
- source_word: אָדָם
  choice: homme
  rationale: Le contexte évoque l’apparence d’une figure masculine individuelle; « homme » convient mieux ici que « humanité » ou une désignation collective.
- source_word: וַיְחַזְּקֵנִי
  choice: me fortifia
  rationale: Le piel de חזק signifie rendre fort ou affermir. « Me fortifia » conserve la portée physique et intérieure du verbe sans la réduire au seul encouragement.
theological_decisions:
- issue: Identité de la figure ayant l’apparence d’un homme
  choice: La décrire sans préciser son identité
  alternative: L’identifier comme un ange ou comme le Christ préincarné
  rationale: L’hébreu indique seulement son apparence humaine. La traduction préserve cette description et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique, tandis que « celui qui avait l’apparence d’un homme » préserve clairement la valeur descriptive de l’hébreu.
