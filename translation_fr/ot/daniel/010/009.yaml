base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/009.yaml
  text: Then I heard the sound of his words[a], and when I heard the sound of his words, I fell into a deep sleep on my face[b], with my face to the ground.
translation:
  language: fr
  text: Puis j’entendis le son de ses paroles[a] et, lorsque j’entendis le son de ses paroles, je sombrai dans un profond sommeil, face contre terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la voix de ses paroles ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur mon visage, et mon visage vers la terre ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Puis j’entendis
  rationale: Le wayyiqtol du qal de שׁמע marque la progression du récit. « Puis » la restitue naturellement en français.
- source_word: קוֹל דְּבָרָיו
  choice: le son de ses paroles
  rationale: קוֹל peut désigner la voix ou le son, et דְּבָרָיו signifie « ses paroles ». Cette formulation conserve l’expression hébraïque et son ambiguïté lexicale, signalée en note.
- source_word: וּכְשָׁמְעִי
  choice: Et tandis que j’entendais
  rationale: La construction conjonction + כ avec la forme infinitive et le suffixe a une valeur temporelle. L’imparfait français convient à l’action en cours et évite de gommer la répétition voulue.
- source_word: נִרְדָּם
  choice: je sombrai dans un profond sommeil
  rationale: Le niphal de רדם évoque un sommeil lourd ou profond. « Sombrai » rend naturellement l’entrée dans cet état sans imposer l’idée technique d’une transe.
- source_word: עַל פָּנַי וּפָנַי אָרְצָה
  choice: face contre terre
  rationale: Cette expression française naturelle réunit les deux indications spatiales hébraïques, littéralement « sur mon visage, mon visage vers la terre », tout en conservant l’image de l’effondrement en position renversée.
theological_decisions:
- issue: Nature de l’état de Daniel sous l’effet de la vision
  choice: Effondrement dans un profond sommeil, face contre terre
  alternative: Transe extatique
  rationale: נִרְדָּם désigne le plus naturellement un sommeil profond ou une torpeur. Le texte décrit l’état corporel accablé de Daniel sans exiger une catégorie technique telle que la transe.
translation_notes:
  register: Français international moderne, digne et narratif. La répétition de « le son de ses paroles » est maintenue parce qu’elle appartient à la structure emphatique de l’hébreu. « Face contre terre » évite en français la lourdeur d’une répétition littérale, laquelle est donnée en note.
