  text: וָ/אֶשָּׂ֤א אֶת עֵינַ/י֙ וָ/אֵ֔רֶא וְ/הִנֵּ֥ה אִישׁ אֶחָ֖ד לָב֣וּשׁ בַּדִּ֑ים וּ/מָתְנָ֥י/ו חֲגֻרִ֖ים בְּ/כֶ֥תֶם אוּפָֽז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/005.yaml
  text: I lifted up my eyes and looked[a], and behold, a man clothed in linen, with his waist girded with the gold of Uphaz.
translation:
  language: fr
  text: Je levai les yeux et regardai, et voici un homme vêtu de lin, les reins ceints d’or d’Oufaz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’or fin d’Oufaz ». Le terme hébreu peut souligner la qualité de l’or aussi bien que son origine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת־עֵינַי וָאֵרֶא
  choice: Je levai les yeux et regardai
  rationale: Conserve les deux étapes de l’expression hébraïque — lever les yeux puis regarder — dans un français naturel et digne.
- source_word: וְהִנֵּה
  choice: voici que… se tenait là
  rationale: « Voici que » restitue la force présentative et le ton visionnaire; « se tenait là » permet une phrase française naturelle sans préciser davantage la posture.
- source_word: אִישׁ אֶחָד
  choice: un homme
  rationale: Rend simplement la figure masculine unique sans en déterminer l’identité surnaturelle ou théologique.
- source_word: לָבוּשׁ בַּדִּים
  choice: vêtu de lin
  rationale: Formulation concise qui conserve la matière du vêtement sans en préciser indûment la forme.
- source_word: מָתְנָיו חֲגֻרִים
  choice: les reins ceints
  rationale: « Reins » correspond ici à la région de la taille, tandis que « ceints » préserve l’image solennelle du vêtement attaché autour du corps.
- source_word: בְּכֶתֶם אוּפָז
  choice: d’or d’Oufaz
  rationale: כֶּתֶם désigne un or précieux ou raffiné; la traduction principale reste sobre et conserve Oufaz comme nom propre, tandis que la nuance qualitative est signalée en note.
theological_decisions:
- issue: Identité de la figure visionnaire
  choice: un homme
  alternative: un être angélique; une manifestation divine ou messianique
  rationale: Le verset décrit la figure mais ne l’identifie pas explicitement; la traduction préserve donc cette indétermination.
translation_notes:
  register: Français international moderne, naturel et solennel. Le passé simple convient au récit visionnaire écrit. « Les reins ceints » conserve la dignité et l’imagerie du texte tout en restant intelligible; la figure n’est pas identifiée au-delà de ce que dit l’hébreu.
