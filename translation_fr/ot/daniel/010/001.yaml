source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שָׁל֗וֹשׁ לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס דָּבָר֙ נִגְלָ֣ה לְ/דָֽנִיֵּ֔אל אֲשֶׁר נִקְרָ֥א שְׁמ֖/וֹ בֵּלְטְשַׁאצַּ֑ר וֶ/אֱמֶ֤ת הַ/דָּבָר֙ וְ/צָבָ֣א גָד֔וֹל וּ/בִין֙ אֶת הַ/דָּבָ֔ר וּ/בִ֥ינָה ל֖/וֹ בַּ/מַּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/001.yaml
  text: In the third year of Cyrus king of Persia[a], a word was revealed to Daniel, who was called Belteshazzar. The word was true, and it concerned a great conflict; and he understood the word and had understanding in the vision.
translation:
  language: fr
  text: La troisième année du règne de Cyrus, roi de Perse, une parole fut révélée à Daniel, qui était appelé Belteshatsar. Cette parole était vraie et concernait un grand conflit[a]. Daniel comprit la parole et eut l’intelligence dans la vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et une grande guerre ». Le terme hébreu peut aussi être rendu dans un sens plus strictement militaire.'
    reason: Alternative lexicale préservant l’ambiguïté de צָבָא גָדוֹל, sans ajouter de verbe absent de l’hébreu.
lexical_decisions:
- source_word: דָּבָר
  choice: une parole
  rationale: Dans ce contexte de révélation, « parole » désigne le contenu communiqué tout en conservant le terme hébreu, répété ensuite dans le verset.
- source_word: נִגְלָה
  choice: fut révélée
  rationale: Le nifal de גלה exprime ici le dévoilement d’un contenu révélé; cette tournure est claire et naturelle en français.
- source_word: נִקְרָא שְׁמוֹ
  choice: qui était appelé
  rationale: Cette formulation française rend naturellement l’expression hébraïque passive qui introduit le nom babylonien de Daniel.
- source_word: בֵּלְטְשַׁאצַּר
  choice: Belteshatsar
  rationale: Translittération française intelligible du nom propre hébreu.
- source_word: וֶאֱמֶת הַדָּבָר
  choice: Cette parole était vraie
  rationale: La reprise de « parole » rend visible la répétition de דָּבָר et affirme sans paraphrase la véracité de la révélation.
- source_word: וְצָבָא גָדוֹל
  choice: et concernait un grand conflit
  rationale: צָבָא peut évoquer l’armée, la guerre, le service pénible ou le conflit. Le contexte de Daniel 10–12 favorise ici l’idée d’un conflit considérable; « concernait » explicite sobrement le rapport de la phrase à la révélation.
- source_word: וּבִין אֶת הַדָּבָר
  choice: Daniel comprit la parole
  rationale: בין exprime ici le discernement ou la compréhension. La répétition explicite du nom « Daniel » évite en français toute ambiguïté sur le sujet.
- source_word: וּבִינָה לוֹ בַּמַּרְאֶה
  choice: et eut l’intelligence de la vision
  rationale: La construction nominale indique que Daniel possédait ou recevait l’intelligence relativement à la vision. Cette formulation reste proche de l’hébreu sans affirmer plus précisément comment cette intelligence lui fut donnée.
theological_decisions:
- issue: Sens de צָבָא גָדוֹל dans cette révélation apocalyptique
  choice: concernait un grand conflit
  alternative: et il y avait une grande guerre / et une grande armée
  rationale: Le terme צָבָא possède une portée militaire, mais peut désigner plus largement une guerre ou un conflit éprouvant. Le contexte annonce des luttes célestes et terrestres; le texte principal retient donc une formulation large, tandis que la note conserve la possibilité d’une traduction plus strictement militaire.
- issue: Nature de l’intelligence mentionnée dans וּבִינָה לוֹ בַּמַּרְאֶה
  choice: eut l’intelligence de la vision
  alternative: reçut de l’intelligence dans la vision
  rationale: L’hébreu établit que l’intelligence était à Daniel en rapport avec la vision, sans préciser explicitement l’agent ni le moment où elle lui fut accordée. La traduction évite d’ajouter une causalité théologique absente de la formulation.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « La troisième année du règne de Cyrus » rend naturellement la datation hébraïque; la note est placée après « grand conflit », expression qu’elle précise.
