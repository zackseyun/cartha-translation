source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הֲ/יָדַ֨עְתָּ֙ לָ/מָּה בָּ֣אתִי אֵלֶ֔י/ךָ וְ/עַתָּ֣ה אָשׁ֔וּב לְ/הִלָּחֵ֖ם עִם שַׂ֣ר פָּרָ֑ס וַ/אֲנִ֣י יוֹצֵ֔א וְ/הִנֵּ֥ה שַׂר יָוָ֖ן בָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/020.yaml
  text: Then he said[a], “Do you know why I have come to you? And now I will return to fight against the prince of Persia; and when I go out, behold[c][b], the prince of Greece is coming.”
translation:
  language: fr
  text: 'Il dit : « Sais-tu pourquoi je suis venu auprès de toi ? Maintenant, je retournerai combattre le prince de Perse[b]. Quand je partirai[a], voici que le prince de Grèce[c] vient. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et moi, je pars ». La proposition hébraïque est concise ; elle peut exprimer un simple départ ou introduire la suite dans le temps : « quand je partirai ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « prince » désigne probablement un souverain surnaturel associé à une nation, bien que ce verset ne le qualifie pas explicitement ainsi.
    reason: alternative_reading
  - marker: c
    text: 'Hébreu : « Yavân », nom qui désigne couramment la Grèce ou le monde grec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Sais-tu
  rationale: L’interrogation porte naturellement sur la connaissance ou la compréhension par Daniel du motif de la venue ; « Sais-tu » est direct et idiomatique.
- source_word: לָמָּה
  choice: pourquoi
  rationale: Équivalent français naturel et concis de l’interrogatif de cause.
- source_word: בָּאתִי אֵלֶיךָ
  choice: je suis venu vers toi
  rationale: Le passé composé exprime une venue accomplie dont l’effet demeure dans l’échange présent ; « vers toi » conserve explicitement la direction portée par אֵלֶיךָ.
- source_word: וְעַתָּה
  choice: Maintenant
  rationale: Le mot marque la progression du discours. En français, « Maintenant » suffit naturellement, sans devoir reproduire mécaniquement la conjonction.
- source_word: אָשׁוּב
  choice: je vais retourner
  rationale: Le contexte donne à l’imparfait hébreu une orientation future. Cette tournure française exprime un retour imminent avec naturel.
- source_word: לְהִלָּחֵם עִם
  choice: combattre
  rationale: Le verbe exprime l’engagement dans un conflit ; avec le complément direct en français, « combattre le prince » rend clairement le sens adversatif.
- source_word: שַׂר פָּרָס
  choice: le prince de Perse
  rationale: « Prince » préserve la gamme de sens de שַׂר et n’ajoute aucune qualification ontologique absente du verset ; « Perse » est le nom historique usuel.
- source_word: וַאֲנִי יוֹצֵא
  choice: Quand je partirai
  rationale: La proposition hébraïque est concise et peut être comprise comme une indication temporelle liée à la suite. La note conserve l’autre lecture coordinative possible.
- source_word: וְהִנֵּה
  choice: voici que
  rationale: Cette formule attire solennellement l’attention sur l’événement annoncé tout en restant naturelle en français moderne.
- source_word: שַׂר יָוָן
  choice: le prince de Grèce
  rationale: Dans ce contexte, יָוָן désigne couramment la Grèce ou le monde grec ; la note signale le nom hébreu.
- source_word: בָּא
  choice: viendra
  rationale: Le participe indique une venue en cours ou imminente. Après la proposition future « Quand je partirai », le futur français donne une séquence naturelle sans exclure l’imminence.
theological_decisions:
- issue: Identité du « prince de Perse » et du « prince de Grèce »
  choice: Conserver « prince » dans le texte sans préciser s’il s’agit d’un être angélique ou démoniaque.
  alternative: Un prince surnaturel associé à une nation, ou un dirigeant politique humain.
  rationale: Le contexte élargi favorise fortement une identité surnaturelle, mais ce verset ne l’explicite pas. La traduction maintient donc la tension interprétative.
- issue: Rapport temporel de וַאֲנִי יוֹצֵא avec la venue du prince de Grèce
  choice: « Quand je partirai »
  alternative: « Et moi, je pars » ou « et je sortirai »
  rationale: La syntaxe est brève et permet une lecture temporelle idiomatique, mais l’alternative coordinative demeure réelle et est indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici que » conserve la force présentative de וְהִנֵּה sans l’archaïsme marqué de « voici ». Les marqueurs de notes sont placés immédiatement après les expressions concernées ; la note théologique générale [b] se trouve en fin de verset.
