source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ אַל תִּירָ֣א דָנִיֵּאל֒ כִּ֣י מִן הַ/יּ֣וֹם הָ/רִאשׁ֗וֹן אֲשֶׁ֨ר נָתַ֧תָּ אֶֽת לִבְּ/ךָ֛ לְ/הָבִ֧ין וּ/לְ/הִתְעַנּ֛וֹת לִ/פְנֵ֥י אֱלֹהֶ֖י/ךָ נִשְׁמְע֣וּ דְבָרֶ֑י/ךָ וַ/אֲנִי בָ֖אתִי בִּ/דְבָרֶֽי/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/012.yaml
  text: Then he said to me[a], “Do not fear, Daniel, because from the first day that you set your heart to understand and to humble yourself before your God, your words were heard[b], and I have come because of your words.”
translation:
  language: fr
  text: 'Il me dit : « N’aie pas peur, Daniel, car dès le premier jour où tu as pris à cœur de comprendre et de t’humilier[a] devant ton Dieu, tes paroles ont été entendues, et je suis venu à cause de tes paroles[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de t’affliger ». Le verbe hébreu peut désigner la privation volontaire ou l’abaissement de soi dans un contexte de dévotion.
    reason: Alternative lexicale préservant l’étendue sémantique du verbe hébreu.
  - marker: b
    text: Ou « en réponse à tes paroles ».
    reason: Autre manière de rendre la valeur causale ou responsive de la préposition hébraïque.
lexical_decisions:
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Cette formulation rend naturellement en français moderne l’interdiction exprimée par la négation suivie du verbe ירא, tout en conservant le ton rassurant du messager.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן
  choice: dès le premier jour
  rationale: « Dès » exprime clairement le point de départ temporel et souligne que les paroles de Daniel ont été entendues dès le commencement.
- source_word: נָתַתָּ אֶת לִבְּךָ
  choice: tu as pris à cœur
  rationale: Cette locution française naturelle conserve les dimensions intérieure, volontaire et attentive de l’expression hébraïque, sans la réduire à une simple activité intellectuelle.
- source_word: לְהָבִין
  choice: de comprendre
  rationale: Le verbe בין au hiphil désigne ici l’action de comprendre ou d’acquérir du discernement ; « comprendre » est direct et clair.
- source_word: וּלְהִתְעַנּוֹת
  choice: et de t’humilier
  rationale: Dans ce contexte de dévotion, le hitpael de ענה évoque l’abaissement volontaire devant Dieu. « T’humilier » communique ce sens sans imposer une pratique ascétique précise.
- source_word: לִפְנֵי אֱלֹהֶיךָ
  choice: devant ton Dieu
  rationale: « Devant » rend simplement la relation exprimée par לִפְנֵי et convient au contexte religieux.
- source_word: נִשְׁמְעוּ דְבָרֶיךָ
  choice: tes paroles ont été entendues
  rationale: La traduction conserve le passif hébreu et le terme général « paroles », plutôt que d’expliciter celles-ci comme des prières.
- source_word: וַאֲנִי בָאתִי בִּדְבָרֶיךָ
  choice: et je suis venu à cause de tes paroles
  rationale: La préposition בְּ peut ici exprimer la cause ou la réponse. « À cause de » maintient le lien causal sans préciser davantage les modalités de la venue du messager.
theological_decisions:
- issue: Sens de l’action dévotionnelle וּלְהִתְעַנּוֹת
  choice: de t’humilier
  alternative: de t’affliger
  rationale: Le texte décrit une attitude volontaire d’abaissement devant Dieu, mais le verbe peut aussi évoquer la privation ou l’affliction de soi. Le texte principal retient le sens spirituel le plus naturel en français, et la note préserve l’autre nuance.
- issue: Valeur de בִּדְבָרֶיךָ à la fin du verset
  choice: à cause de tes paroles
  alternative: en réponse à tes paroles
  rationale: La formulation retenue préserve le rapport causal entre les paroles de Daniel et la venue du messager, tandis que l’alternative en explicite la dimension de réponse.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au discours direct adressé personnellement à Daniel. L’expression « prendre à cœur » conserve l’image intérieure de l’hébreu sous une forme idiomatique française. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
