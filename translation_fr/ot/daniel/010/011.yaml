source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֡/י דָּנִיֵּ֣אל אִישׁ חֲ֠מֻדוֹת הָבֵ֨ן בַּ/דְּבָרִ֜ים אֲשֶׁר֩ אָנֹכִ֨י דֹבֵ֤ר אֵלֶ֨י/ךָ֙ וַ/עֲמֹ֣ד עַל עָמְדֶ֔/ךָ כִּ֥י עַתָּ֖ה שֻׁלַּ֣חְתִּי אֵלֶ֑י/ךָ וּ/בְ/דַבְּר֥/וֹ עִמִּ֛/י אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עָמַ֥דְתִּי מַרְעִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/011.yaml
  text: And he said to me[a], “Daniel, man greatly beloved, understand the words that I am speaking to you, and stand in your place, for now I have been sent to you.” And when he spoke this word to me[c][b], I stood trembling.
translation:
  language: fr
  text: 'Il me dit : « Daniel, homme très aimé[a], comprends les paroles que je t’adresse et tiens-toi debout à ta place[b], car maintenant j’ai été envoyé vers toi. » Pendant qu’il me disait cette parole[c], je me tins debout, tout tremblant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « homme hautement estimé ». L’expression hébraïque décrit littéralement un homme précieux ou désirable et sert ici de titre honorifique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tiens-toi sur ta position ». L’expression peut aussi se comprendre : « tiens-toi droit » ou « prends ta place ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « ce message » ou « cette chose ». Le mot hébreu peut désigner une parole, une affaire ou un message.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: homme très aimé
  rationale: L’expression décrit littéralement un homme caractérisé par ce qui est précieux ou désirable. Dans cette adresse honorifique, « homme très aimé » rend naturellement sa force relationnelle, tandis qu’une note conserve l’autre nuance possible d’estime.
- source_word: הָבֵן
  choice: comprends
  rationale: L’impératif demande à Daniel de saisir le sens des paroles qui lui sont adressées, et non simplement de les entendre.
- source_word: בַּדְּבָרִים אֲשֶׁר אָנֹכִי דֹבֵר אֵלֶיךָ
  choice: les paroles que je t’adresse
  rationale: דברים prend ici son sens verbal en raison du participe « parlant ». La formulation française exprime clairement une parole actuellement adressée à Daniel sans lourdeur.
- source_word: וַעֲמֹד עַל עָמְדֶךָ
  choice: tiens-toi debout à ta place
  rationale: Cette formulation garde à la fois l’idée physique de se mettre debout et celle de prendre ou reprendre sa place, sans réduire l’idiome à une seule de ces nuances.
- source_word: שֻׁלַּחְתִּי אֵלֶיךָ
  choice: j’ai été envoyé vers toi
  rationale: Le parfait passif désigne une mission accomplie dont la pertinence est immédiate dans la scène. « Vers toi » exprime naturellement la direction de l’envoi.
- source_word: וּבְדַבְּרוֹ עִמִּי אֶת־הַדָּבָר הַזֶּה
  choice: Pendant qu’il me disait cette parole
  rationale: L’infinitif construit marque une action contemporaine. « Me disait » rend naturellement עִמִּי dans ce contexte de communication, et « cette parole » conserve le singulier hébreu ainsi que son ambiguïté sémantique.
- source_word: עָמַדְתִּי מַרְעִיד
  choice: je me tins debout, tout tremblant
  rationale: Le premier verbe reprend le commandement de se tenir debout, tandis que le participe exprime le tremblement physique persistant de Daniel.
theological_decisions:
- issue: Description honorifique de Daniel dans l’adresse du messager
  choice: homme très aimé
  alternative: homme hautement estimé
  rationale: Le choix rend l’affection et la faveur exprimées par l’hébreu sans ajouter de catégorie doctrinale. La note signale honnêtement que l’expression peut également mettre l’accent sur l’estime ou le prix accordé à Daniel.
- issue: Portée du commandement וַעֲמֹד עַל עָמְדֶךָ
  choice: tiens-toi debout à ta place
  alternative: tiens-toi droit / prends ta place
  rationale: La traduction maintient ensemble le geste physique et la notion de position ou de place, au lieu de trancher une ambiguïté réelle de l’idiome.
- issue: Sens de הַדָּבָר הַזֶּה
  choice: cette parole
  alternative: ce message / cette chose
  rationale: Le singulier concret de l’hébreu est conservé, tout en indiquant en note l’étendue sémantique possible de דָּבָר.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au singulier. La syntaxe demeure proche de la progression hébraïque, mais évite les calques peu naturels. Les répétitions autour de « se tenir debout » sont maintenues parce qu’elles relient explicitement l’ordre du messager à la réaction de Daniel.
