lexical_decisions:
- source_word: וְהִנֵּה
  choice: Et voici que
  rationale: Conserve la fonction vive du marqueur narratif, qui attire l’attention sur une apparition soudaine, dans un français actuel et digne.
- source_word: יָד
  choice: une main
  rationale: L’indéfini respecte l’absence d’article en hébreu et maintient l’attente quant à l’identité de celui dont il s’agit.
- source_word: נָגְעָה בִּי
  choice: me toucha
  rationale: Rend directement le contact physique exprimé par נגע dans ce contexte.
- source_word: וַתְּנִיעֵנִי
  choice: me fit trembler
  rationale: Le hifil de נוע exprime ici le fait de provoquer un mouvement, une secousse ou un tremblement. Ce choix restitue la valeur causative et l’instabilité corporelle de Daniel sans masquer l’éventail lexical, signalé en note.
- source_word: עַל בִּרְכַּי
  choice: sur mes genoux
  rationale: Rend directement la position corporelle résultante ou maintenue.
- source_word: וְכַפּוֹת יָדָי
  choice: et les paumes de mes mains
  rationale: Préserve la précision concrète de כַּפּוֹת, plutôt que de réduire l’expression à « mes mains ».
