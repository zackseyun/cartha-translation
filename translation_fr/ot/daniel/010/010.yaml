  text: And behold[a], a hand touched me and set me on my knees and the palms of my hands.
translation:
  language: fr
  text: Et voici qu’une main me toucha et me mit[a] sur mes genoux et les paumes de mes mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « me fit bouger » ; ou « me fit vaciller », « me secoua » ou « me fit trembler ».
