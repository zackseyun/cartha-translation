revisions:
- from: Je restai donc seul et je vis cette grande vision[a]. Il ne resta plus aucune force en moi ; mon éclat se changea sur moi en ruine[b], et je ne conservai aucune force.
  to: Je restai seul et vis cette grande vision[a] ; aucune force ne resta en moi. Mon éclat se changea en déchéance[b], et je ne conservai aucune force.
  rationale: La révision corrige le calque français « sur moi en ruine ». « Se changea en déchéance » exprime le renversement de l’éclat de Daniel vers un état dégradé, tout en laissant indécise la question de savoir si הוֹדִי désigne principalement son apparence, sa dignité ou sa vigueur. Les deux mentions de l’absence de force sont conservées, conformément à la répétition du texte source.
