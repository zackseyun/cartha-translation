source:
  edition: WLC
  text: וַ/אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י וָֽ/אֶרְאֶ֗ה אֶת הַ/מַּרְאָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/לֹ֥א נִשְׁאַר בִּ֖/י כֹּ֑ח וְ/הוֹדִ֗/י נֶהְפַּ֤ךְ עָלַ/י֙ לְ/מַשְׁחִ֔ית וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/008.yaml
  text: So I alone was left and saw this great vision[a], and no strength remained in me; my splendor was turned to ruin upon me[b], and I retained no strength.
translation:
  language: fr
  text: Je restai seul et vis cette grande vision[a] ; aucune force ne resta en moi. Mon éclat se changea en déchéance[b], et je ne conservai aucune force.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette grande apparition » ou « ce grand spectacle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mon apparence se changea en déchéance » ou « ma vigueur se changea en déchéance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַרְתִּי לְבַדִּי
  choice: Je restai donc seul
  rationale: « Rester seul » rend naturellement le sens de שׁאר avec לְבַדִּי dans le contexte où les autres hommes se sont enfuis. « Donc » exprime le lien narratif porté par וַ sans alourdir la phrase.
- source_word: הַמַּרְאָה הַגְּדֹלָה הַזֹּאת
  choice: cette grande vision
  rationale: מַרְאָה peut désigner une vision, une apparition ou un spectacle. « Vision » convient au contexte révélatoire de Daniel tout en laissant les autres possibilités dans la note.
- source_word: כֹּחַ
  choice: force
  rationale: Dans ses deux occurrences, le mot désigne ici la capacité physique de Daniel, qui l'abandonne complètement.
- source_word: וְלֹא נִשְׁאַר בִּי כֹּחַ
  choice: Il ne resta plus aucune force en moi
  rationale: Cette formulation conserve le verbe « rester » et la localisation intérieure exprimée par בִּי, dans un français naturel.
- source_word: הוֹדִי
  choice: mon éclat
  rationale: הוֹד désigne l'éclat, la splendeur ou la majesté. « Mon éclat » préserve le noyau lexical tout en pouvant évoquer l'apparence et la vigueur visibles de Daniel.
- source_word: נֶהְפַּךְ עָלַי לְמַשְׁחִית
  choice: se changea sur moi en ruine
  rationale: 'La formulation conserve la rudesse et l''ambiguïté de l''hébreu : נֶהְפַּךְ indique un changement, עָלַי signifie littéralement « sur moi », et לְמַשְׁחִית un état destructeur ou ruiné.'
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: et je ne conservai aucune force
  rationale: עצר exprime ici l'idée de retenir ou conserver. La traduction distingue ainsi cette dernière proposition de la précédente sans en modifier le sens.
theological_decisions:
- issue: Nature de הַמַּרְאָה dans le contexte apocalyptique
  choice: vision
  alternative: apparition ; spectacle
  rationale: Le contexte de Daniel 10 est révélatoire, ce qui favorise « vision », mais le terme hébreu possède une portée visuelle plus large ; les autres sens sont donc signalés en note.
- issue: Sens de הוֹדִי dans la description de l'état de Daniel
  choice: mon éclat
  alternative: mon apparence ; ma vigueur
  rationale: « Éclat » reste proche du sens lexical de הוֹד sans décider si le texte vise surtout l'apparence extérieure, la dignité ou la vitalité de Daniel.
- issue: Interprétation de לְמַשְׁחִית
  choice: en ruine
  alternative: en corruption ; dans un état misérable
  rationale: « En ruine » maintient l'image forte et indéterminée du texte sans la réduire à une pâleur physique ni lui donner un sens doctrinal particulier.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans être archaïque. La tournure inhabituelle « sur moi en ruine » est conservée pour refléter l'expression hébraïque difficile ; la note explicite les principales possibilités lexicales.
