  timestamp: '2026-07-15T08:51:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Daniel demeure seul, voit la grande vision et perd toute force. « Vision » est un choix contextuellement justifié pour מַרְאָה. Toutefois, « se changea sur moi en ruine » calque עָלַי d’une manière qui n’est pas recevable en français moderne. Dans cette expression difficile, עָלַי ne doit pas être reproduit par un « sur moi » spatial et opaque ; le changement subi par Daniel est suffisamment conservé par la formulation française.'
  naturalness: Le passé simple convient au registre biblique narratif. La phrase initiale est naturelle après suppression de « donc », qui explicite inutilement le simple enchaînement narratif. La reformulation de la clause sur l’éclat évite un calque syntaxique tout en maintenant son caractère imagé et sa portée non spécifiée.
  terminology: « Éclat » préserve de façon appropriée l’ambiguïté de הוֹדִי entre splendeur, apparence et vigueur. « Déchéance » rend naturellement le passage à un état dégradé exprimé par לְמַשְׁחִית, sans imposer une description médicale ni une interprétation doctrinale.
  issues:
  - severity: medium
    issue: « mon éclat se changea sur moi en ruine » est syntaxiquement et idiomatiquement défectueux en français.
    rationale: La préposition « sur » est un calque trop littéral de עָלַי et produit une image incompréhensible. Le texte hébreu est difficile, mais une traduction française ne doit pas conserver une construction opaque lorsqu’une expression naturelle peut préserver l’ambiguïté sémantique.
  - severity: low
    issue: « donc » ajoute une inférence logique absente du texte.
    rationale: Le waw narratif relie les événements sans exiger la conclusion marquée par « donc ».
  revised_text: Je restai seul et vis cette grande vision[a] ; aucune force ne resta en moi. Mon éclat se changea en déchéance[b], et je ne conservai aucune force.
