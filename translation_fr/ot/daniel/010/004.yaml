base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/004.yaml
  text: On the twenty-fourth day of the first month[a], I was by the side of the great river—that is, the Tigris.
translation:
  language: fr
  text: Le vingt-quatrième jour du premier mois, je me trouvais au bord du grand fleuve, c’est-à-dire le Tigre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Hiddéqel, nom hébreu traditionnel du Tigre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: Le vingt-quatrième jour
  rationale: La construction hébraïque emploie un nombre cardinal dans une formule de date; le français idiomatique demande ici l’ordinal. La conjonction initiale n’a pas besoin d’être rendue séparément.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: du premier mois
  rationale: Cette formulation naturelle conserve le rapport entre le jour indiqué et le premier mois.
- source_word: וַאֲנִי הָיִיתִי
  choice: je me trouvais
  rationale: Le verbe situe Daniel en un lieu; « je me trouvais » rend naturellement cette valeur sans suggérer un déplacement.
- source_word: עַל יַד
  choice: au bord de
  rationale: L’expression signifie « à côté de, auprès de ». Dans le contexte d’un fleuve, « au bord de » est idiomatique, tout en évitant de préciser une rive particulière.
- source_word: הַנָּהָר הַגָּדוֹל
  choice: du grand fleuve
  rationale: Rendu direct du nom et de l’adjectif; « fleuve » convient au Tigre en français.
- source_word: הוּא חִדָּקֶל
  choice: c’est-à-dire le Tigre
  rationale: Le pronom introduit l’identification du grand fleuve. « Tigre » est le nom français usuel du חִדָּקֶל biblique.
