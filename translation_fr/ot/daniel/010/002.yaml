  yaml_path: translation/ot/daniel/010/002.yaml
  text: In those days[a], I, Daniel, was mourning for three weeks of days.
translation:
  language: fr
  text: En ces jours-là, moi, Daniel, j’étais en deuil pendant trois semaines entières.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « trois semaines de jours », expression qui souligne qu’il s’agit de trois semaines ordinaires complètes, et non de « semaines » symboliques.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Expression temporelle standard qui conserve le pluriel de יָמִים et situe naturellement le récit.
- source_word: אֲנִי דָנִיֵּאל
  choice: moi, Daniel,
  rationale: Le pronom indépendant suivi du nom a une valeur d'insistance et d'auto-identification, rendue naturellement en français par la dislocation appositive.
- source_word: הָיִיתִי מִתְאַבֵּל
  choice: je fus dans le deuil
  rationale: La construction avec הָיָה et le participe hitpael décrit un état prolongé dans le passé. « Être dans le deuil » est naturel et conserve le sens spécifique de אבל.
- source_word: שְׁלֹשָׁה שָׁבֻעִים יָמִים
  choice: pendant trois semaines entières
  rationale: La formulation hébraïque littérale, « trois semaines, jours », précise qu'il s'agit de semaines constituées de jours ordinaires. « Trois semaines entières » en transmet la portée sans le calque peu naturel « semaines de jours ».
theological_decisions:
- issue: Portée de « semaines, jours »
  choice: trois semaines entières
  alternative: trois semaines de jours
  rationale: La traduction retenue indique des semaines ordinaires et complètes sans imposer une interprétation du cadre symbolique plus large du livre; la note conserve la forme inhabituelle de l'hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit; « dans le deuil » garde la nuance spécifique du verbe hébreu. Le marqueur de note est placé après l’expression qu’il explique.
