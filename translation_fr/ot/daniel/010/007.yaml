source:
  edition: WLC
  text: וְ/רָאִיתִי֩ אֲנִ֨י דָנִיֵּ֤אל לְ/בַדִּ/י֙ אֶת הַ/מַּרְאָ֔ה וְ/הָ/אֲנָשִׁים֙ אֲשֶׁ֣ר הָי֣וּ עִמִּ֔/י לֹ֥א רָא֖וּ אֶת הַ/מַּרְאָ֑ה אֲבָ֗ל חֲרָדָ֤ה גְדֹלָה֙ נָפְלָ֣ה עֲלֵי/הֶ֔ם וַֽ/יִּבְרְח֖וּ בְּ/הֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/007.yaml
  text: And I[a], Daniel, alone saw the vision, and the men who were with me did not see the vision; but a great trembling fell upon them[b], and they fled to hide themselves.
translation:
  language: fr
  text: Moi, Daniel, je fus le seul à voir la vision. Les hommes qui étaient avec moi ne virent pas la vision, mais une grande terreur[a] s’abattit sur eux, et ils s’enfuirent pour se cacher[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un grand tremblement ». Le mot hébreu חֲרָדָה peut désigner un tremblement, un effroi ou une terreur.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils s’enfuirent et se cachèrent » ou « ils s’enfuirent dans une cachette ». L’infinitif hébreu בְּהֵחָבֵא peut exprimer le but ou la manière de leur fuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אֲנִי דָנִיֵּאל לְבַדִּי
  choice: Moi, Daniel, je fus le seul à voir
  rationale: L’expression française met naturellement en relief le pronom explicite, le nom de Daniel et l’exclusivité marquée par לְבַדִּי, tout en présentant la perception comme un fait accompli.
- source_word: הַמַּרְאָה
  choice: la vision
  rationale: Dans ce contexte révélatoire de Daniel, « vision » rend mieux מַרְאָה qu’une simple « apparence », sans nier sa dimension visuelle.
- source_word: וְהָאֲנָשִׁים אֲשֶׁר הָיוּ עִמִּי
  choice: Les hommes qui étaient avec moi
  rationale: אֲנָשִׁים est ici un pluriel masculin désignant les compagnons de Daniel; cette formulation en conserve le sens direct.
- source_word: לֹא רָאוּ אֶת הַמַּרְאָה
  choice: ne virent pas la vision
  rationale: La répétition de « vision » et du verbe « voir » maintient le contraste explicite entre Daniel et ses compagnons.
- source_word: אֲבָל
  choice: mais
  rationale: La conjonction adversative souligne que, sans voir la vision, les compagnons en éprouvent néanmoins l’effet.
- source_word: חֲרָדָה גְדֹלָה
  choice: une grande terreur
  rationale: חֲרָדָה peut désigner le tremblement, l’effroi ou la terreur. « Grande terreur » est naturel en français et exprime fortement l’expérience physique et émotionnelle.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: s’abattit sur eux
  rationale: Cette expression conserve l’image vive de quelque chose qui « tombe sur » eux, dans une tournure française idiomatique.
- source_word: וַיִּבְרְחוּ
  choice: ils s’enfuirent
  rationale: Le verbe fait progresser le récit et exprime une fuite provoquée par la peur.
- source_word: בְּהֵחָבֵא
  choice: pour se cacher
  rationale: L’infinitif peut indiquer le but ou la manière de la fuite; « pour se cacher » exprime clairement le but tout en gardant le sens réfléchi.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit biblique écrit sans archaïsme excessif. L’emphase hébraïque est rendue naturellement par « Moi, Daniel, je fus le seul », et la métaphore de la terreur qui tombe sur les hommes est conservée sous la forme idiomatique « s’abattit sur eux ».
