source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כִּ/דְמוּת֙ בְּנֵ֣י אָדָ֔ם נֹגֵ֖עַ עַל שְׂפָתָ֑/י וָ/אֶפְתַּח פִּ֗/י וָ/אֲדַבְּרָ/ה֙ וָ/אֹֽמְרָ/ה֙ אֶל הָ/עֹמֵ֣ד לְ/נֶגְדִּ֔/י אֲדֹנִ֗/י בַּ/מַּרְאָה֙ נֶהֶפְכ֤וּ צִירַ/י֙ עָלַ֔/י וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/016.yaml
  text: And behold[a], something like the likeness of a son of man touched my lips. Then I opened my mouth and spoke, and I said to the one standing before me, “My lord, because of the vision my pains have come upon me[c][b], and I have retained no strength.”
translation:
  language: fr
  text: 'Et voici : une forme semblable à celle d’un être humain[a] toucha mes lèvres. Alors j’ouvris la bouche, je parlai et je dis à celui qui se tenait devant moi : « Mon seigneur, à cause de la vision, mes douleurs m’ont saisi[b], et je n’ai conservé aucune force[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme la ressemblance des fils de l’homme », c’est-à-dire des êtres humains. Autres traductions possibles : « quelqu’un d’apparence humaine » ou « une forme humaine ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mes angoisses se sont abattues sur moi » ; ou : « les douleurs m’ont envahi ». L’hébreu décrit une détresse intense qui saisit Daniel.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « et aucune force ne m’est restée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְמוּת בְּנֵי אָדָם
  choice: une forme semblable à celle d’un être humain
  rationale: כִּדְמוּת associe comparaison et ressemblance, tandis que בְּנֵי אָדָם désigne collectivement les humains. Cette formulation française conserve le caractère indirect et imprécis de la description visionnaire sans créer un titre messianique.
- source_word: נֹגֵעַ עַל שְׂפָתָי
  choice: toucha mes lèvres
  rationale: Le participe s’insère dans la séquence narrative et se rend naturellement par un passé simple. נגע avec עַל exprime ici le contact.
- source_word: וָאֶפְתַּח פִּי
  choice: Alors j’ouvris la bouche
  rationale: L’expression hébraïque marque le commencement de la prise de parole. « Alors » rend clairement la progression narrative.
- source_word: וָאֲדַבְּרָה וָאֹמְרָה
  choice: je parlai et je dis
  rationale: Les deux verbes sont maintenus afin de préserver l’ampleur expressive de l’hébreu, malgré leur proximité sémantique.
- source_word: הָעֹמֵד לְנֶגְדִּי
  choice: celui qui se tenait devant moi
  rationale: לְנֶגֶד indique une position en face ou devant Daniel. La formulation retenue est naturelle et ne suggère pas nécessairement une opposition.
- source_word: אֲדֹנִי
  choice: Mon seigneur
  rationale: Il s’agit d’une adresse respectueuse au personnage céleste, non du nom divin. La minuscule évite de l’identifier explicitement au Seigneur Dieu.
- source_word: בַּמַּרְאָה
  choice: à cause de la vision
  rationale: 'La préposition בְּ peut avoir ici une valeur causale : Daniel attribue son état de détresse à la vision.'
- source_word: נֶהֶפְכוּ צִירַי עָלַי
  choice: mes douleurs m’ont saisi
  rationale: צִירַי évoque des douleurs aiguës ou des angoisses, et l’ensemble décrit celles-ci comme s’abattant sur Daniel. « M’ont saisi » restitue cette irruption sans préciser indûment leur nature.
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: et je n’ai conservé aucune force
  rationale: עצר exprime ici le fait de retenir ou conserver. La traduction reste proche de la construction hébraïque tout en étant idiomatique en français.
theological_decisions:
- issue: Valeur de בְּנֵי אָדָם dans la description visionnaire
  choice: 'référence générique à l’humanité : « un être humain »'
  alternative: « un fils d’homme » compris comme titre messianique
  rationale: Le pluriel hébreu désigne les humains en général et se trouve enchâssé dans une formule de ressemblance. Le traduire comme un titre christologique résoudrait abusivement l’identité du personnage.
- issue: Valeur de l’adresse אֲדֹנִי
  choice: « Mon seigneur » avec une minuscule
  alternative: « Mon Seigneur » comme désignation divine
  rationale: Le mot constitue ici une adresse honorifique au personnage de la vision. Le texte ne l’identifie pas par le nom divin.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit littéraire biblique sans archaïsme excessif. La formulation principale préserve l’imprécision de la vision, tandis que la note expose la structure hébraïque inhabituellement redoublée. Les marqueurs de notes suivent l’ordre a, b, c dans le texte.
