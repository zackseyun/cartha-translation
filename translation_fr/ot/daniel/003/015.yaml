- from: 'Maintenant, si vous êtes prêts, lorsque vous entendrez le son du cor, de la flûte, de la lyre, de la harpe triangulaire[a], du psaltérion[b], de la cornemuse[c] et de toutes sortes d’instruments de musique, tombez à terre et adorez la statue que j’ai faite : très bien[d]. Mais si vous ne l’adorez pas, vous serez jetés à l’instant même au milieu de la fournaise de feu ardent. Et quel est le dieu qui pourra vous délivrer de mes mains ?'
  to: Maintenant, si, lorsque vous entendrez le son du cor, de la flûte, de la lyre, de la harpe triangulaire[a], du psaltérion[b], de la cornemuse[c] et de toutes sortes de musique, vous êtes prêts à vous prosterner et à adorer la statue que j’ai faite, ce sera bien[d]. Mais si vous ne l’adorez pas, vous serez jetés à l’instant même au milieu d’une fournaise de feu ardent. Et quel dieu pourra vous délivrer de ma main ?
  rationale: La révision corrige la syntaxe française de la condition et rend plus précisément la portée de l’expression musicale générale ainsi que l’idiome final. Elle maintient l’ellipse favorable après la condition, signalée en note, sans lui attribuer un contenu doctrinal ou narratif supplémentaire.
