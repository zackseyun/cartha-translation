source:
  edition: WLC
  text: כְּעַ֞ן הֵ֧ן אִֽיתֵי/כ֣וֹן עֲתִידִ֗ין דִּ֣י בְ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַשְׁרוֹקִיתָ֣/א קיתרס שַׂבְּכָ֡א פְּסַנְתֵּרִין֩ וְ/סוּמְפֹּ֨נְיָ֜ה וְ/כֹ֣ל זְנֵ֣י זְמָרָ֗/א תִּפְּל֣וּן וְ/תִסְגְּדוּן֮ לְ/צַלְמָ֣/א דִֽי עַבְדֵת֒ וְ/הֵן֙ לָ֣א תִסְגְּד֔וּן בַּ/הּ שַׁעֲתָ֣/ה תִתְרְמ֔וֹן לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּ֑/א וּ/מַן ה֣וּא אֱלָ֔הּ דֵּ֥י יְשֵֽׁיזְבִנְ/כ֖וֹן מִן יְדָֽ/י־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/015.yaml
  text: Now if you are ready[a], when you hear the sound of the horn, pipe, lyre, trigon, harp, and bagpipe, and every kind of music, to fall down and worship the image that I have made, well and good. But if you do not worship, in that very hour you will be thrown into the midst of a blazing furnace of fire[d][c][b]. And who is the god who will deliver you out of my hands?
translation:
  language: fr
  text: Maintenant, si, lorsque vous entendrez le son du cor, de la flûte, de la lyre, de la harpe triangulaire[a], du psaltérion[b], de la cornemuse[c] et de toutes sortes de musique, vous êtes prêts à vous prosterner et à adorer la statue que j’ai faite, ce sera bien[d]. Mais si vous ne l’adorez pas, vous serez jetés à l’instant même au milieu d’une fournaise de feu ardent. Et quel dieu pourra vous délivrer de ma main ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’instrument désigné par le mot araméen שַׂבְּכָא est incertain; on le nomme aussi « sambuque » ou « trigone ».
    reason: lexical_alternative
  - marker: b
    text: Le psaltérion était un instrument à cordes; son identification précise est incertaine.
    reason: lexical_alternative
  - marker: c
    text: Peut-être « flûte double »; l’identification de סוּמְפֹּנְיָה est discutée. Le mot apparenté à « symphonie » ne désigne pas ici un orchestre moderne.
    reason: lexical_alternative
  - marker: d
    text: Après « que j’ai faite », l’araméen laisse la proposition principale sous-entendue; « ce sera bien » explicite brièvement le sens implicite.
    reason: textual_ellipsis
lexical_decisions:
- source_word: כְּעַן
  choice: Maintenant
  rationale: Cet adverbe araméen introduit le défi renouvelé du roi et marque l’immédiateté de la situation.
- source_word: אִיתֵיכון עֲתִידִין
  choice: si vous êtes prêts
  rationale: Rend naturellement l’expression araméenne indiquant qu’ils sont disposés ou préparés à agir immédiatement.
- source_word: קַרְנָא מַשְׁרוֹקִיתָא קיתרס
  choice: cor, flûte, lyre
  rationale: Termes français actuels et compréhensibles qui rendent les catégories instrumentales sans précision excessive.
- source_word: שַׂבְּכָא
  choice: harpe triangulaire
  rationale: Désignation descriptive vraisemblable de cet instrument à cordes, dont l’identification exacte demeure incertaine; cette incertitude est signalée en note.
- source_word: פְּסַנְתֵּרִין
  choice: psaltérion
  rationale: Le terme français traditionnel distingue cet instrument de la lyre déjà mentionnée et conserve le lien avec le mot araméen d’emprunt.
- source_word: סוּמְפֹּנְיָה
  choice: cornemuse
  rationale: Identification moderne courante, mais discutée; une autre possibilité est conservée en note.
- source_word: כֹל זְנֵי זְמָרָא
  choice: toutes sortes d’instruments de musique
  rationale: Dans cette énumération instrumentale, cette formulation française restitue naturellement le caractère englobant de l’expression.
- source_word: שַׁעֲתָה
  choice: à l’instant même
  rationale: Exprime en français actuel l’exécution immédiate de la menace.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: fournaise de feu ardent
  rationale: Conserve l’image emphatique et la formulation concrète de l’araméen.
- source_word: וּמַן הוּא אֱלָהּ
  choice: Et quel est le dieu
  rationale: Reproduit le défi générique et méprisant du roi sans identifier ce dieu au Dieu d’Israël.
theological_decisions:
- issue: Sens de סגד dans un contexte idolâtre
  choice: adorez / l’adorez
  alternative: prosternez-vous devant / lui rendre hommage
  rationale: La posture corporelle est déjà exprimée par « tombez à terre »; « adorez » rend donc la portée religieuse de l’acte exigé devant la statue.
- issue: Référence de אֱלָהּ dans la provocation du roi
  choice: le dieu, avec une minuscule
  alternative: Dieu
  rationale: Le roi lance un défi générique et ne confesse pas le Dieu d’Israël; la minuscule préserve son point de vue.
- issue: Apodose sous-entendue après « la statue que j’ai faite »
  choice: très bien
  alternative: laisser la phrase en suspens
  rationale: L’araméen est elliptique. Le bref ajout complète naturellement en français la conséquence favorable implicite sans préciser davantage ce que le texte ne dit pas.
translation_notes:
  register: Français international moderne, direct et digne. L’énumération garde son effet cérémoniel, tandis que les notes reconnaissent l’incertitude entourant plusieurs instruments anciens. Le tutoiement pluriel n’étant pas distinct du vouvoiement en français, « vous » convient naturellement à l’adresse du roi aux trois hommes.
