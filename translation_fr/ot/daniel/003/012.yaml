  text: אִיתַ֞י גֻּבְרִ֣ין יְהוּדָאיִ֗ן דִּֽי מַנִּ֤יתָ יָתְ/הוֹן֙ עַל עֲבִידַת֙ מְדִינַ֣ת בָּבֶ֔ל שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ גֻּבְרַיָּ֣/א אִלֵּ֗ךְ לָא שָׂ֨מֽוּ עלי/ך מַלְכָּ/א֙ טְעֵ֔ם ל/אלהי/ך לָ֣א פָלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א סָגְדִֽין־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/012.yaml
  text: 'There are certain Jewish men whom you have appointed over the administration of the province of Babylon—Shadrach[a], Meshach, and Abed-nego. These men have paid no attention to you, O king: they do not serve your gods[b], and they do not worship the golden image that you have set up.'
translation:
  language: fr
  text: 'Il y a des hommes juifs que tu as chargés de l’administration de la province de Babylone : Shadrak, Méshak et Abed-Nego. Ces hommes n’ont tenu aucun compte de toi, ô roi[a] : ils ne servent pas tes dieux et n’adorent pas la statue d’or que tu as dressée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’ont eu aucun égard pour toi » ou « ne t’ont pas écouté ». L’expression araméenne évoque littéralement le fait de ne pas avoir porté attention ou considération au roi.'
    reason: lexical_alternative
  - marker: b
    text: 'L’araméen emploie deux verbes différents : ils ne « servent » pas les dieux du roi et n’« adorent » pas la statue d’or.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי גֻּבְרִין יְהוּדָאיִן
  choice: Il y a des hommes juifs
  rationale: Rend naturellement la tournure existentielle araméenne tout en conservant le nom masculin explicite et l’identité juive des accusés.
- source_word: דִּי מַנִּיתָ יָתְהוֹן עַל עֲבִידַת מְדִינַת בָּבֶל
  choice: que tu as chargés de l’administration de la province de Babylone
  rationale: « Charger de » exprime ici la nomination à une responsabilité officielle; « administration » convient au contexte gouvernemental de עֲבִידַת.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Shadrak, Méshak et Abed-Nego
  rationale: Translittération française moderne et reconnaissable des noms araméens.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: Ces hommes
  rationale: Reprend avec insistance les trois hommes nommés et préserve la valeur démonstrative.
- source_word: לָא שָׂמוּ עֲלַיִךְ ... טְעֵם
  choice: n’ont tenu aucun compte de toi
  rationale: Expression française naturelle qui conserve l’idée de mépris ou d’absence d’égard envers le roi, sans préciser indûment qu’il s’agit seulement de son ordre.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Marque clairement l’apostrophe dans un registre solennel adapté à la scène de cour.
- source_word: לֵאלָהַיִךְ לָא פָלְחִין
  choice: ils ne servent pas tes dieux
  rationale: « Servir » préserve la valeur cultuelle de פְלַח et sa distinction avec le verbe suivant.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: la statue d’or
  rationale: « Statue » est concret et naturel dans ce récit; « d’or » reproduit sans ambiguïté le groupe construit araméen.
- source_word: דִּי הֲקֵימְתָּ
  choice: que tu as dressée
  rationale: « Dresser » rend l’action d’ériger la statue et convient à un objet monumental.
- source_word: לָא סָגְדִין
  choice: n’adorent pas
  rationale: Dans ce contexte cultuel, « adorer » exprime clairement l’hommage religieux, tout en restant distinct de « servir ».
theological_decisions:
- issue: Distinction entre les deux verbes décrivant l’action religieuse
  choice: Traduire פָלְחִין par « servent » et סָגְדִין par « adorent »
  alternative: Traduire les deux verbes par « adorent »
  rationale: Le texte emploie deux verbes distincts, l’un pour le service cultuel rendu aux dieux, l’autre pour la prosternation ou l’adoration devant la statue. La traduction conserve cette distinction sans lui imposer une interprétation confessionnelle.
- issue: Nature de l’offense envers le roi
  choice: « n’ont tenu aucun compte de toi »
  alternative: « n’ont pas obéi à ton ordre »
  rationale: L’idiome araméen peut évoquer le manque d’égard ou l’inattention à une décision. Comme le complément vise ici le roi lui-même, la formulation retenue préserve cette latitude plutôt que de réduire l’accusation à la désobéissance à un ordre précis.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le ton formel de l’accusation à la cour. Les marqueurs de notes [a] et [b] figurent tous deux dans le texte principal; [b] est placé après l’ensemble de l’accusation religieuse qu’il explique.
