  text: כָּ/ל קֳבֵ֣ל דְּנָ֗ה מִן דִּ֞י מִלַּ֤ת מַלְכָּ/א֙ מַחְצְפָ֔ה וְ/אַתּוּנָ֖/א אֵזֵ֣ה יַתִּ֑ירָא גֻּבְרַיָּ֣/א אִלֵּ֗ךְ דִּ֤י הַסִּ֨קוּ֙ לְ/שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ קַטִּ֣ל הִמּ֔וֹן שְׁבִיבָ֖/א דִּ֥י נוּרָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/022.yaml
  text: Because of this, since the king’s command was harsh and the furnace had been heated exceedingly, the flame of the fire killed those men who brought up Shadrach, Meshach, and Abed-nego.
translation:
  language: fr
  text: À cause de cela, puisque l’ordre du roi était impérieux et que la fournaise avait été chauffée à l’extrême, la flamme du feu tua les hommes qui y avaient fait monter Shadrak, Méshak et Abed-Nego.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלַּת מַלְכָּא מַחְצְפָה
  choice: l’ordre du roi était impérieux
  rationale: מִלָּה désigne ici l’ordre royal, et מַחְצְפָה exprime son caractère pressant, rigoureux ou impérieux. « Impérieux » conserve à la fois l’autorité et l’urgence de l’ordre sans ajouter explicitement l’idée de cruauté.
- source_word: וְאַתּוּנָא אֵזֵה יַתִּירָא
  choice: la fournaise avait été chauffée à l’extrême
  rationale: Le passif verbal et l’adverbe intensif יַתִּירָא indiquent une chauffe exceptionnellement forte; cette formulation est naturelle en français et préserve l’intensité.
- source_word: הַסִּקוּ
  choice: avaient fait monter
  rationale: Le verbe araméen signifie littéralement « faire monter ». Le pronom « y » explicite seulement la destination déjà donnée par « la fournaise », tout en gardant le mouvement décrit par le texte.
- source_word: שְׁבִיבָא דִּי נוּרָא
  choice: la flamme du feu
  rationale: Traduction formellement proche de l’expression araméenne, qui souligne la flamme jaillissant de la fournaise.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms propres suivent des formes françaises usuelles et immédiatement reconnaissables. La causalité répétée de l’araméen est conservée par « À cause de cela, puisque… ».
