  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א לְֽ/כָל עַֽמְמַיָּ֞/א אֻמַיָּ֧/א וְ/לִשָּׁנַיָּ֛/א דִּֽי דארין בְּ/כָל אַרְעָ֖/א שְׁלָמְ/כ֥וֹן יִשְׂגֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/031.yaml
  text: 'King Nebuchadnezzar[a], to all peoples, nations[b], and languages that dwell in all the earth: May your peace abound.'
translation:
  language: fr
  text: 'Le roi Nabuchodonosor, à tous les peuples, nations et langues qui habitent sur toute la terre[a] : Que votre paix abonde[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sur toute la terre » est une formule impériale conventionnelle qui peut avoir ici le sens rhétorique de « dans tout le royaume ».
    reason: cultural_note
  - marker: b
    text: Ou « Que votre bien-être augmente ! »
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: Le roi
  rationale: Le nom est en apposition à Nabuchodonosor. En français, « le roi Nabuchodonosor » constitue une formule de titulature naturelle.
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: à tous les peuples, nations et langues
  rationale: La triade impériale englobe les diverses populations soumises. « Langues » conserve l’image concrète de l’araméen tout en restant clair en français moderne.
- source_word: דִּי דארין
  choice: qui habitent
  rationale: La particule relative suivie du participe décrit les groupes destinataires comme les habitants du territoire; « qui habitent » est à la fois exact et naturel.
- source_word: בְּכָל אַרְעָא
  choice: sur toute la terre
  rationale: אַרְעָא peut désigner la terre ou un territoire. La traduction retient la portée universelle de la formule impériale sans exclure sa fonction rhétorique.
- source_word: שְׁלָמְכוֹן
  choice: votre paix
  rationale: Le terme couvre la paix, le bien-être et la prospérité. « Paix » préserve la formule sémitique de salutation et sa résonance biblique.
- source_word: יִשְׂגֵּא
  choice: abonde
  rationale: Le verbe signifie devenir grand, croître ou se multiplier. « Abonde » exprime naturellement en français le souhait formulé par la proclamation.
theological_decisions: []
translation_notes:
  register: Style solennel d’une proclamation royale, mais syntaxe et vocabulaire accessibles en français international moderne. Les notes maintiennent l’ambiguïté de אַרְעָא (« terre » ou territoire impérial) et l’étendue sémantique de שְׁלָם (« paix », bien-être, prospérité).
