source:
  edition: WLC
  text: עָנֵ֨ה נְבֽוּכַדְנֶצַּ֜ר וְ/אָמַ֗ר בְּרִ֤יךְ אֱלָהֲ/הוֹן֙ דִּֽי שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ דִּֽי שְׁלַ֤ח מַלְאֲכֵ/הּ֙ וְ/שֵׁיזִ֣ב לְ/עַבְד֔וֹ/הִי דִּ֥י הִתְרְחִ֖צוּ עֲל֑וֹ/הִי וּ/מִלַּ֤ת מַלְכָּ/א֙ שַׁנִּ֔יו וִ/יהַ֣בוּ גשמי/הון דִּ֠י לָֽא יִפְלְח֤וּן וְ/לָֽא יִסְגְּדוּן֙ לְ/כָל אֱלָ֔הּ לָהֵ֖ן לֵ/אלָֽהֲ/הֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/028.yaml
  text: Nebuchadnezzar answered and said[a], “Blessed be the God of Shadrach, Meshach, and Abed-nego, who sent his angel and delivered his servants, who trusted in him, and set aside the king’s command, and gave up their bodies[c][b], that they might not serve or worship any god except their own God.”
translation:
  language: fr
  text: 'Nabuchodonosor prit la parole et dit : « Béni soit le Dieu de Shadrak, de Méshak et d’Abed-Nego ! Il a envoyé son ange[a] et délivré ses serviteurs, qui lui ont fait confiance, ont passé outre à l’ordre du roi[b] et ont livré leurs corps afin de ne servir ni d’adorer[c] aucun dieu, si ce n’est leur Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son messager ». Le terme araméen peut avoir les deux sens ; le verset ne précise pas davantage l’identité de cette figure.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « changé la parole du roi » : ils ont refusé de se conformer à son ordre.'
    reason: lexical_alternative
  - marker: c
    text: Ou « se prosterner devant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: prit la parole et dit
  rationale: Cette formule narrative araméenne introduit une déclaration sans supposer nécessairement qu’une question a été posée. « Prit la parole et dit » est idiomatique et digne en français.
- source_word: בְּרִיךְ
  choice: Béni soit
  rationale: Le tour conserve la valeur de bénédiction et de louange de la forme prédicative.
- source_word: אֱלָהֲהוֹן
  choice: le Dieu de Shadrak, de Méshak et d’Abed-Nego
  rationale: Le suffixe possessif est explicité par les trois noms qui suivent ; la tournure française rend clairement ce rapport.
- source_word: שְׁלַח מַלְאֲכֵהּ
  choice: a envoyé son ange
  rationale: מַלְאַךְ peut désigner un ange ou un messager. Dans ce récit de délivrance miraculeuse, « ange » est naturel, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: וְשֵׁיזִב
  choice: délivré
  rationale: Le verbe exprime le fait d’arracher à un danger. « Délivré » convient au sauvetage hors de la fournaise sans ajouter une interprétation doctrinale.
- source_word: לְעַבְדֹוהִי
  choice: ses serviteurs
  rationale: Dans ce contexte de fidélité et de culte, « serviteurs » est le terme français courant et approprié.
- source_word: הִתְרְחִצוּ עֲלֹוהִי
  choice: qui lui ont fait confiance
  rationale: La forme exprime le fait de placer sa confiance en quelqu’un. Cette formulation est claire et relationnelle en français moderne.
- source_word: וּמִלַּת מַלְכָּא שַׁנִּיו
  choice: ont passé outre à l’ordre du roi
  rationale: L’expression signifie littéralement qu’ils ont « changé la parole du roi », mais désigne ici leur refus de se conformer à son décret. « Passer outre à l’ordre » transmet ce sens sans gommer leur opposition délibérée.
- source_word: וִיהַבוּ גשמי/הון
  choice: livré leur corps
  rationale: L’expression évoque le fait d’exposer volontairement son corps au danger ou à la mort plutôt que de céder à l’idolâtrie. « Livré leur corps » reste proche de l’image araméenne.
- source_word: לָא יִפְלְחוּן
  choice: servir
  rationale: Le verbe désigne le service rendu à une divinité et forme ici un couple avec l’acte d’adoration.
- source_word: וְלָא יִסְגְּדוּן
  choice: adorer
  rationale: Le verbe peut décrire plus concrètement le fait de se prosterner, mais, associé à « servir » dans ce contexte religieux, « adorer » en communique clairement la portée.
- source_word: לָהֵן
  choice: si ce n’est
  rationale: La particule introduit une exception. « Si ce n’est » conserve une formulation soutenue mais compréhensible.
theological_decisions:
- issue: Identité de מַלְאֲכֵהּ dans le récit de la délivrance
  choice: son ange
  alternative: son messager ; une figure théophanique identifiée plus précisément par certains interprètes
  rationale: Le mot araméen permet « ange » ou « messager ». Le verset rapporte les paroles de Nebucadnetsar et n’impose pas une identification christologique ou théophanique plus précise ; la traduction s’en tient donc au sens contextuel sans résoudre cette question doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation scinde la longue phrase araméenne pour en faciliter la lecture sans modifier ses liens logiques. Les noms suivent des formes françaises courantes, et la traduction évite aussi bien l’archaïsme excessif que la paraphrase doctrinale.
