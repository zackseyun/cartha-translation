  text: כָּ/ל קֳבֵ֤ל דְּנָה֙ בֵּ/הּ זִמְנָ֔/א קְרִ֖בוּ גֻּבְרִ֣ין כַּשְׂדָּאִ֑ין וַ/אֲכַ֥לוּ קַרְצֵי/ה֖וֹן דִּ֥י יְהוּדָיֵֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/008.yaml
  text: For this reason[a], at that time certain Chaldean men came forward and maliciously accused the Jews.
translation:
  language: fr
  text: C’est pourquoi, à ce moment-là, certains Chaldéens s’avancèrent et portèrent des accusations malveillantes contre les Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Le terme araméen peut désigner le peuple de Juda sous un angle ethnique et géographique aussi bien que « les Juifs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: C’est pourquoi
  rationale: Cette locution araméenne exprime une conséquence ou un lien causal. « C’est pourquoi » restitue ce lien clairement et naturellement.
- source_word: בֵּהּ זִמְנָא
  choice: à ce moment-là
  rationale: Cette expression temporelle désigne le moment précis de l’intervention; la formulation française est courante et digne.
- source_word: קְרִבוּ
  choice: s’avancèrent
  rationale: Le verbe signifie « s’approcher ». Dans le cadre de la cour royale, « s’avancèrent » évoque naturellement le fait de se présenter pour parler.
- source_word: גֻּבְרִין כַּשְׂדָּאִין
  choice: certains hommes chaldéens
  rationale: La traduction conserve le nom masculin explicite « hommes » sans ajouter la fonction non exprimée d’« officiels ». « Certains » rend le caractère indéfini du groupe.
- source_word: וַאֲכַלוּ קַרְצֵיהוֹן
  choice: accusèrent avec malveillance
  rationale: L’expression idiomatique, littéralement liée au fait de « manger les morceaux » de quelqu’un, désigne une accusation ou une dénonciation hostile. Cette formulation conserve à la fois la dimension judiciaire et l’intention malveillante.
- source_word: דִּי יְהוּדָיֵא
  choice: les Juifs
  rationale: Le terme peut désigner les Juifs ou, dans un sens ethnique et géographique, les Judéens. « Les Juifs » est clair dans ce contexte, tandis que l’autre possibilité est signalée en note.
