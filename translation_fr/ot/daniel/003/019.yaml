base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/019.yaml
  text: Then Nebuchadnezzar was filled with fury[a], and the expression of his face was changed against Shadrach, Meshach, and Abed-nego. He answered and said to heat the furnace seven times more than it was usually heated.
translation:
  language: fr
  text: Alors Nabuchodonosor fut rempli de fureur, et son expression changea contre Shadrak, Méshak et Abed-Nego. Il donna l’ordre de chauffer la fournaise sept fois plus qu’on ne le faisait habituellement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au septuple, au-delà de ce qu’on jugeait convenable ». L’expression araméenne peut renvoyer à la chaleur habituelle ou au degré considéré comme approprié.'
    reason: La note est ancrée à l’expression entière sur le chauffage de la fournaise et préserve l’ambiguïté de la clause finale.
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression immédiate du récit dans un français naturel.
- source_word: הִתְמְלִי חֱמָא
  choice: fut rempli de fureur
  rationale: Conserve l’image d’un homme que la colère remplit et rend l’intensité de חֱמָא.
- source_word: וּצְלֵם אַנְפּוֹהִי אשתנו
  choice: l’expression de son visage changea
  rationale: Rend l’image concrète de l’apparence du visage tout en exprimant idiomatiquement le changement visible d’expression.
- source_word: עַל
  choice: envers
  rationale: La préposition indique ici l’orientation hostile de son expression à l’égard des trois hommes; « envers » laisse le contexte porter cette hostilité.
- source_word: עָנֵה וְאָמַר
  choice: Il ordonna
  rationale: Dans ce contexte, la formule introduit un ordre dont le contenu est exprimé par l’infinitif; cette formulation est naturelle en français sans ajouter un destinataire absent du texte.
- source_word: לְמֵזֵא לְאַתּוּנָא
  choice: de chauffer la fournaise
  rationale: Rend directement l’infinitif causatif et conserve le terme narratif traditionnel mais courant « fournaise ».
- source_word: חַד שִׁבְעָה
  choice: sept fois
  rationale: Expression araméenne indiquant une intensification au septuple.
- source_word: עַל דִּי חֲזֵה לְמֵזְיֵהּ
  choice: plus que d’habitude
  rationale: Rend idiomatiquement l’idée d’aller au-delà du degré auquel on avait coutume ou jugeait convenable de la chauffer.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Shadrak, Méshak et Abed-Nego
  rationale: Translittération française moderne et reconnaissable des noms araméens.
