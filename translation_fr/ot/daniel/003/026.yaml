source:
  edition: WLC
  text: בֵּ/אדַ֜יִן קְרֵ֣ב נְבוּכַדְנֶצַּ֗ר לִ/תְרַע֮ אַתּ֣וּן נוּרָ֣/א יָקִֽדְתָּ/א֒ עָנֵ֣ה וְ/אָמַ֗ר שַׁדְרַ֨ךְ מֵישַׁ֧ךְ וַ/עֲבֵד נְג֛וֹ עַבְד֛וֹ/הִי דִּֽי אֱלָהָ֥/א עלי/א פֻּ֣קוּ וֶ/אֱת֑וֹ בֵּ/אדַ֣יִן נָֽפְקִ֗ין שַׁדְרַ֥ךְ מֵישַׁ֛ךְ וַ/עֲבֵ֥ד נְג֖וֹ מִן גּ֥וֹא נוּרָֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/026.yaml
  text: Then Nebuchadnezzar came near to the door of the blazing fiery furnace[a]. He answered and said, “Shadrach, Meshach, and Abed-nego, servants of the Most High God, come out and come here.” Then Shadrach, Meshach[b], and Abed-nego came out from the midst of the fire.
translation:
  language: fr
  text: 'Alors Nabuchodonosor s’approcha de l’entrée[a] de la fournaise au feu ardent[b]. Il prit la parole et dit : « Shadrak, Méshak et Abed-Nego, serviteurs du Dieu Très-Haut, sortez et venez ici ! » Alors Shadrak, Méshak et Abed-Nego sortirent du milieu du feu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’ouverture » ou « de la porte ».
    reason: Le terme araméen peut désigner une porte, une ouverture ou une entrée.
  - marker: b
    text: Litt. « de la fournaise du feu brûlant ».
    reason: La note signale la construction emphatique de l’araméen, rendue de manière plus naturelle dans le texte principal.
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Ce marqueur narratif araméen introduit l’événement suivant. « Alors » restitue naturellement la progression du récit.
- source_word: קְרֵב
  choice: s’approcha
  rationale: Le verbe désigne un mouvement physique vers un lieu. « S’approcha » est précis et naturel en français moderne.
- source_word: לִתְרַע
  choice: de l’entrée
  rationale: Le nom peut désigner une porte, une ouverture ou une entrée. Dans le cas d’une fournaise, « entrée » évite de suggérer nécessairement un battant tout en conservant l’idée d’un accès défini.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: la fournaise au feu ardent
  rationale: La formulation conserve les trois éléments de l’expression araméenne — fournaise, feu et fait de brûler — dans un français fluide et emphatique.
- source_word: עָנֵה וְאָמַר
  choice: Il prit la parole et dit
  rationale: Cette formule sémitique introduit une déclaration en réaction à la scène observée. Cette traduction en garde le relief sans imposer l’idée d’une réponse à une question explicite.
- source_word: עַבְדוֹהִי
  choice: serviteurs
  rationale: Le terme peut désigner des serviteurs ou des esclaves. Ici, il exprime leur appartenance au service de Dieu ; « serviteurs » convient au contexte sans ajouter une idée de servitude humaine.
- source_word: אֱלָהָא עליא
  choice: du Dieu Très-Haut
  rationale: Cette formulation rend le titre divin comme un titre reconnu, tout en exprimant clairement la suprématie attribuée à Dieu.
- source_word: פֻּקוּ
  choice: sortez
  rationale: L’impératif commande de quitter l’intérieur de la fournaise. « Sortez » est direct et idiomatique.
- source_word: וֶאֱתוֹ
  choice: venez ici
  rationale: Le second impératif indique un mouvement vers celui qui parle. « Venez ici » rend explicitement cette orientation.
- source_word: נָפְקִין
  choice: sortirent
  rationale: Le verbe narratif décrit l’exécution de l’ordre et reprend naturellement le verbe de l’impératif précédent.
- source_word: מִן גּוֹא נוּרָא
  choice: du milieu du feu
  rationale: גּוֹא désigne l’intérieur ou le milieu. Cette traduction souligne qu’ils émergent de l’intérieur même du feu.
theological_decisions:
- issue: Traduction du titre divin אֱלָהָא עליא
  choice: le Dieu Très-Haut
  alternative: Dieu, le Très-Haut
  rationale: Le choix retenu préserve le titre divin et l’affirmation de la suprématie de Dieu dans les paroles de Nabuchodonosor, sans développer ni restreindre la portée théologique de sa déclaration.
translation_notes:
  register: Français international moderne, digne et accessible. Les noms suivent des formes françaises courantes. La formule de parole sémitique est conservée sous une forme naturelle, et le parallélisme entre l’ordre de sortir et son accomplissement reste visible.
