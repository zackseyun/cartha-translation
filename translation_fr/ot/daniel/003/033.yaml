id: DAN.3.33
reference: Daniel 3:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָת֨וֹ/הִי֙ כְּ/מָ֣ה רַבְרְבִ֔ין וְ/תִמְה֖וֹ/הִי כְּ/מָ֣ה תַקִּיפִ֑ין מַלְכוּתֵ/הּ֙ מַלְכ֣וּת עָלַ֔ם וְ/שָׁלְטָנֵ֖/הּ עִם דָּ֥ר וְ/דָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/033.yaml
  text: How great are his signs[a], and how mighty are his wonders! His kingdom is an everlasting kingdom[c][b], and his dominion is from generation to generation.
translation:
  language: fr
  text: Que ses signes sont grands[a], que ses prodiges sont puissants ! Son royaume est un royaume éternel[b], et sa domination subsiste de génération en génération[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses merveilles ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un royaume pour toujours ».
    reason: lexical_alternative
  - marker: c
    text: 'L’araméen dit littéralement : « avec génération et génération », expression qui indique une continuité à travers toutes les générations.'
    reason: cultural_note
lexical_decisions:
- source_word: אָתוֹהִי
  choice: ses signes
  rationale: En araméen biblique, le terme désigne des signes, notamment miraculeux. « Signes » est naturel en français et forme un binôme biblique reconnaissable avec « prodiges ».
- source_word: כְּמָה
  choice: que… sont
  rationale: La particule introduit ici une exclamation admirative. La tournure française « Que… sont… ! » en restitue naturellement la force.
- source_word: רַבְרְבִין
  choice: grands
  rationale: Dans cette louange, l'adjectif exprime la grandeur qualitative des signes plutôt que leur nombre.
- source_word: תִמְהוֹהִי
  choice: ses prodiges
  rationale: Le mot désigne des actes qui suscitent l'étonnement. « Prodiges » convient au registre élevé et à l'association traditionnelle « signes et prodiges ».
- source_word: תַקִּיפִין
  choice: puissants
  rationale: L'adjectif souligne la force et la puissance des prodiges ; « puissants » est clair et actuel.
- source_word: מַלְכוּתֵהּ
  choice: son royaume
  rationale: La forme possessive désigne le royaume ou règne de Dieu ; « royaume » maintient l'image royale du texte.
- source_word: מַלְכוּת עָלַם
  choice: un royaume éternel
  rationale: L'expression indique une durée sans fin. « Royaume éternel » est une formulation française naturelle et fidèle.
- source_word: שָׁלְטָנֵהּ
  choice: sa domination
  rationale: Le terme désigne l'autorité souveraine exercée. « Domination » préserve la nuance royale et le parallélisme avec « royaume ».
- source_word: עִם דָּר וְדָר
  choice: subsiste de génération en génération
  rationale: Littéralement « avec génération et génération », l'expression indique une continuité à travers les générations. L'ajout de « subsiste » donne une phrase française complète sans modifier le sens.
theological_decisions:
- issue: Référent divin des pronoms possessifs dans la louange de Nabuchodonosor
  choice: Conserver simplement « ses » et « son/sa », en référence au Dieu Très-Haut indiqué par le contexte.
  alternative: 'Expliciter dans le corps du texte : « les signes de Dieu » et « le royaume de Dieu ».'
  rationale: Le contexte identifie clairement le référent ; une explicitation introduirait des mots absents du verset et réduirait sa cohésion avec ce qui précède.
- issue: Portée temporelle de מַלְכוּת עָלַם
  choice: « un royaume éternel »
  alternative: « un royaume pour toujours »
  rationale: Les deux formulations expriment la perpétuité. « Éternel » conserve la concision et le parallélisme solennel sans préciser davantage la nature de cette éternité.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exclamative et le parallélisme poétique sont conservés. « Prodiges » maintient le registre biblique sans archaïsme excessif ; « subsiste » explicite sobrement le rapport verbal sous-entendu dans le second membre.
