  to: C’est pourquoi, à ce moment-là, lorsque tous les peuples entendirent le son du cor, de la flûte, de la lyre, de la harpe triangulaire, du psaltérion[a] et de toutes sortes de musique, tous les peuples, nations et langues tombèrent à terre et adorèrent la statue d’or que le roi Nabuchodonosor avait dressée.
