source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָ֡ה בֵּ/הּ זִמְנָ֡/א כְּ/דִ֣י שָֽׁמְעִ֣ין כָּֽל עַמְמַיָּ֡/א קָ֣ל קַרְנָ/א֩ מַשְׁר֨וֹקִיתָ֜/א קיתרס שַׂבְּכָא֙ פְּסַנְטֵרִ֔ין וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א נָֽפְלִ֨ין כָּֽל עַֽמְמַיָּ֜/א אֻמַיָּ֣/א וְ/לִשָּׁנַיָּ֗/א סָֽגְדִין֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/007.yaml
  text: Therefore[a], at that time, when all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image that King Nebuchadnezzar had set up.
translation:
  language: fr
  text: C’est pourquoi, à ce moment-là, lorsque tous les peuples entendirent le son du cor, de la flûte, de la lyre, de la harpe triangulaire, du psaltérion[a] et de toutes sortes de musique, tous les peuples, nations et langues tombèrent à terre et adorèrent la statue d’or que le roi Nabuchodonosor avait dressée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte de plusieurs de ces instruments anciens est incertaine. La « harpe triangulaire » pourrait être un autre type d’instrument à cordes, et le « psaltérion » une sorte de cithare ou de harpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: C’est pourquoi
  rationale: Rend naturellement l’idiome araméen qui introduit la conséquence du décret royal.
- source_word: בֵּהּ זִמְנָא
  choice: à ce moment-là
  rationale: Expression temporelle naturelle qui situe l’exécution immédiate du commandement sans la suraccentuer.
- source_word: כְּדִי שָׁמְעִין
  choice: lorsque ... entendirent
  rationale: Conserve la relation temporelle du texte sans imposer explicitement le sens « dès que ».
- source_word: כָּל עַמְמַיָּא
  choice: tous les peuples
  rationale: Le pluriel désigne des groupes ethniques et correspond à la triade répétée dans le verset.
- source_word: קָל
  choice: le son
  rationale: Il s’agit ici du son produit par les instruments, et non d’une voix.
- source_word: קַרְנָא
  choice: cor
  rationale: Terme français courant et suffisamment général pour cet instrument à vent, sans préciser indûment sa nature.
- source_word: מַשְׁרוֹקִיתָא
  choice: flûte
  rationale: Équivalent français accessible pour cet instrument à vent, dont l’identification exacte demeure incertaine.
- source_word: קיתרס
  choice: lyre
  rationale: Le mot d’emprunt, apparenté au grec kithara, désigne un instrument à cordes; « lyre » est clair et usuel.
- source_word: שַׂבְּכָא
  choice: harpe triangulaire
  rationale: Rend une identification probable de cet instrument ancien tout en signalant en note l’incertitude lexicale.
- source_word: פְּסַנְטֵרִין
  choice: psaltérion
  rationale: Équivalent français traditionnel d’un instrument à cordes ancien; la note préserve l’incertitude sur sa forme exacte.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: et de toutes sortes d’instruments de musique
  rationale: Dans le contexte d’une énumération instrumentale, cette formulation rend le résumé global de façon idiomatique et concrète.
- source_word: נָפְלִין
  choice: tombèrent à terre
  rationale: Préserve l’action corporelle concrète exprimée par le verbe dans ce contexte de prosternation.
- source_word: צֶלֶם דַּהֲבָא
  choice: la statue d’or
  rationale: « Statue » est naturel en français pour cette représentation matérielle dressée par le roi, sans ajouter de précision sur sa forme.
theological_decisions:
- issue: Nature de l’acte accompli devant la statue
  choice: adorèrent
  alternative: se prosternèrent devant / rendirent hommage à
  rationale: Le cadre cultuel, l’objet étant une statue et le geste étant imposé au son des instruments, donne au verbe une portée religieuse; « adorèrent » la conserve sans réduire l’acte à un hommage civil.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la répétition solennelle de « tous les peuples » et la longue énumération du texte araméen, tout en employant des noms d’instruments compréhensibles; la note explicite l’incertitude réelle.
