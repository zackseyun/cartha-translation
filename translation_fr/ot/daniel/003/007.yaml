    issue: Restriction indue de וְכֹל זְנֵי זְמָרָא
    rationale: « Et de toutes sortes d’instruments de musique » limite le syntagme araméen à des instruments. Après l’énumération, זְנֵי זְמָרָא est plus largement rendu par « toute sorte de musique ». Cette formulation conserve l’ampleur de l’expression source et s’aligne sur l’audit anglais.
