source:
  edition: WLC
  text: אֱדַ֨יִן֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א תְּוַ֖הּ וְ/קָ֣ם בְּ/הִתְבְּהָלָ֑ה עָנֵ֨ה וְ/אָמַ֜ר לְ/הַדָּֽבְר֗וֹ/הִי הֲ/לָא֩ גֻבְרִ֨ין תְּלָתָ֜א רְמֵ֤ינָא לְ/גוֹא נוּרָ/א֙ מְכַפְּתִ֔ין עָנַ֤יִן וְ/אָמְרִין֙ לְ/מַלְכָּ֔/א יַצִּיבָ֖א מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/024.yaml
  text: Then King Nebuchadnezzar was astonished and rose up in haste[a]. He answered and said to his counselors, “Did we not throw three men, bound, into the midst of the fire?” They answered and said to the king, “Certainly[b], O king.”
translation:
  language: fr
  text: 'Alors le roi Nabuchodonosor, stupéfait, se leva précipitamment. Il prit la parole et dit à ses conseillers[a] : « N’avons-nous pas jeté trois hommes ligotés au milieu du feu[b] ? » Ils répondirent au roi : « Certainement, ô roi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ses hauts fonctionnaires » ou « à ses ministres » ; le terme araméen désigne des personnes au service de la cour royale.
    reason: lexical_alternative
  - marker: b
    text: Ou simplement « dans le feu » ; l’araméen dit plus précisément « au milieu du feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque la succession narrative de façon naturelle en français moderne.
- source_word: תְּוַהּ
  choice: stupéfait
  rationale: Exprime la vive surprise mêlée de saisissement provoquée par ce que le roi voit.
- source_word: בְּהִתְבְּהָלָה
  choice: précipitamment
  rationale: Rend à la fois la hâte et l’agitation impliquées par le terme araméen.
- source_word: עָנֵה וְאָמַר
  choice: Il prit la parole et dit
  rationale: Conserve les deux éléments de la formule sémitique dans un français digne et intelligible.
- source_word: לְהַדָּבְרוֹהִי
  choice: à ses conseillers
  rationale: Désigne les personnes de la cour qui assistent le roi, vraisemblablement dans une fonction consultative ou administrative.
- source_word: הֲלָא
  choice: N’avons-nous pas
  rationale: Introduit naturellement une question rhétorique qui attend une confirmation.
- source_word: גֻבְרִין תְּלָתָא
  choice: trois hommes
  rationale: Traduction directe et contextuellement précise.
- source_word: רְמֵינָא
  choice: jeté
  rationale: Équivalent courant du verbe araméen signifiant jeter ou lancer.
- source_word: לְגוֹא נוּרָא
  choice: au milieu du feu
  rationale: Préserve la valeur spatiale explicite de גּוֹא, plutôt que de la réduire à « dans le feu ».
- source_word: מְכַפְּתִין
  choice: ligotés
  rationale: Décrit clairement en français moderne l’état des hommes lorsqu’ils furent jetés dans le feu.
- source_word: עָנַיִן וְאָמְרִין
  choice: Ils répondirent
  rationale: La formule littérale « ils répondirent et dirent » serait lourde en français; le verbe « répondre » transmet naturellement sa fonction discursive.
- source_word: יַצִּיבָא
  choice: Certainement
  rationale: Rend l’affirmation forte signifiant « c’est vrai » ou « assurément ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formule de prise de parole est partiellement conservée pour refléter la texture araméenne, tandis que la réponse des conseillers est allégée afin d’éviter une répétition peu naturelle. Les deux appels de notes figurent dans le texte principal et correspondent à de véritables variantes lexicales.
