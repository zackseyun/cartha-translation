id: DAN.3.6
reference: Daniel 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מַן דִּי לָ֥א יִפֵּ֖ל וְ/יִסְגֻּ֑ד בַּ/הּ שַׁעֲתָ֣/א יִתְרְמֵ֔א לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/006.yaml
  text: And whoever does not fall down and worship shall in that hour be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: fr
  text: Et quiconque ne se prosternera pas et n’adorera pas sera, à l’instant même[a], jeté au milieu d’une fournaise de feu ardent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Araméen : « à cette heure-là », expression qui signifie ici immédiatement, sur-le-champ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: Et quiconque
  rationale: L’expression relative indéfinie introduit une condition générale; « quiconque » en conserve la portée universelle dans un français digne et naturel.
- source_word: לָא יִפֵּל
  choice: ne se prosternera pas
  rationale: Le verbe signifie littéralement « tomber », mais décrit ici le geste de se jeter à terre devant l’image. « Se prosterner » exprime clairement la posture sans la confondre avec une chute accidentelle.
- source_word: וְיִסְגֻּד
  choice: et n’adorera pas
  rationale: Le verbe désigne la prosternation ou l’hommage cultuel. Dans le contexte de l’image, « adorer » rend la portée religieuse de l’acte, tandis que « se prosterner » en indique déjà la posture.
- source_word: בַּהּ שַׁעֲתָא
  choice: à l’instant même
  rationale: L’expression signifie littéralement « à cette heure / à ce moment-là » et, dans ce décret, souligne l’exécution immédiate de la peine. Cette formulation française garde à la fois l’idée du moment précis et celle d’immédiateté.
- source_word: יִתְרְמֵא
  choice: sera jeté
  rationale: La forme passive est rendue directement. « Jeté » est actuel et naturel, contrairement au plus littéraire « précipité » ou à l’archaïsant « sera lancé ».
- source_word: לְגוֹא
  choice: au milieu de
  rationale: Le terme désigne l’intérieur ou le milieu; cette traduction conserve l’image d’une personne jetée à l’intérieur même de la fournaise.
- source_word: אַתּוּן
  choice: une fournaise
  rationale: Le mot désigne un grand four ou foyer; « fournaise » est le terme narratif français le plus clair pour cet instrument de mise à mort.
- source_word: נוּרָא יָקִדְתָּא
  choice: de feu ardent
  rationale: La tournure araméenne, littéralement « feu brûlant », intensifie l’image. « Feu ardent » restitue cette force dans un français naturel sans ajouter d’élément absent du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et solennel. Le futur rend naturellement la sanction du décret. La répétition négative (« ne se prosternera pas et n’adorera pas ») évite toute ambiguïté syntaxique en français et conserve les deux actes coordonnés de l’araméen.
