base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/025.yaml
  text: He answered and said[a], “Look! I see four men unbound, walking in the midst of the fire, and there is no harm on them; and the appearance of the fourth is like a son of the gods.”
translation:
  language: fr
  text: 'Il répondit : « Voici ! Je vois quatre hommes déliés qui marchent au milieu du feu sans subir aucun mal, et l’aspect du quatrième est comme celui d’un fils des dieux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’interprétation chrétienne traditionnelle : « le Fils de Dieu ». L’araméen porte littéralement « un fils des dieux », ce qui reflète la perspective de Nabuchodonosor.'
    reason: Lecture alternative liée à l’ambiguïté théologique et à l’histoire de l’interprétation.
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  choice: Il prit la parole et dit
  rationale: Cette formule araméenne introduit une prise de parole. La tournure retenue est naturelle et digne en français, sans imposer l’idée d’une réponse à une question explicite.
- source_word: הָא
  choice: Regardez !
  rationale: L’interjection attire vivement l’attention sur ce que le roi découvre. « Regardez ! » restitue cette soudaineté en français actuel.
- source_word: חָזֵה
  choice: je vois
  rationale: Le présent exprime directement l’observation immédiate du roi.
- source_word: גֻּבְרִין אַרְבְּעָה
  choice: quatre hommes
  rationale: Le nom araméen désigne ici des êtres humains masculins, en contraste direct avec les trois hommes jetés dans la fournaise.
- source_word: שְׁרַיִן
  choice: déliés
  rationale: Le terme indique qu’ils ne sont plus liés et rappelle précisément les liens avec lesquels ils avaient été jetés au feu.
- source_word: מַהְלְכִין בְּגוֹא נוּרָא
  choice: qui marchent au milieu du feu
  rationale: Le participe décrit une action en cours, et « au milieu du feu » conserve la force spatiale de l’expression araméenne.
- source_word: וַחֲבָל לָא אִיתַי בְּהוֹן
  choice: sans subir aucun mal
  rationale: Cette formulation idiomatique exprime clairement l’absence totale de blessure ou de dommage, tout en gardant le sens de la proposition araméenne.
- source_word: וְרֵוֵהּ דִּי רְבִיעָיָא
  choice: et l’apparence du quatrième
  rationale: Le nom renvoie à l’aspect visible de la quatrième figure. « Du quatrième » conserve la référence comparative sans préciser davantage son identité.
- source_word: דָּמֵה לְבַר אֱלָהִין
  choice: ressemble à celle d’un fils des dieux
  rationale: Le verbe marque une ressemblance et non une identification. « Un fils des dieux » rend naturellement la construction indéfinie et le pluriel araméen dans la bouche de Nabuchodonosor.
theological_decisions:
- issue: Identité de la quatrième figure décrite par Nabuchodonosor
  choice: un fils des dieux
  alternative: le Fils de Dieu ; un être divin ou angélique
  rationale: Le texte rapporte l’observation du roi selon sa propre perspective et ne formule pas ici une identification messianique explicite. Le pluriel אֱלָהִין et l’absence d’article favorisent « un fils des dieux ». L’interprétation chrétienne traditionnelle est néanmoins signalée en note sans être introduite dans les paroles du roi.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le caractère saisissant de la découverte, le contraste avec les liens antérieurs et la comparaison prudente du roi, sans archaïsme ni identification doctrinale ajoutée.
