  to: 'Il répondit : « Voici ! Je vois quatre hommes déliés qui marchent au milieu du feu sans subir aucun mal, et l’aspect du quatrième est comme celui d’un fils des dieux[a]. »'
  rationale: La révision restitue « il répondit », rend l’interjection araméenne sans ajouter un impératif pluriel, et maintient la comparaison indéfinie et polythéiste dans la bouche de Nabuchodonosor. La note conserve l’interprétation chrétienne traditionnelle comme lecture alternative, sans l’imposer au texte.
