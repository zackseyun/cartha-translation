  text: עָנֵ֤ה נְבֻֽכַדְנֶצַּר֙ וְ/אָמַ֣ר לְ/ה֔וֹן הַ/צְדָּ֕א שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לֵֽ/אלָהַ֗/י לָ֤א אִֽיתֵי/כוֹן֙ פָּֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימֶת לָ֥א סָֽגְדִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/014.yaml
  text: Nebuchadnezzar answered and said to them[a], “Is it true, Shadrach, Meshach, and Abed-nego, that you do not serve my god and do not bow down to the golden image that I have set up?”
translation:
  language: fr
  text: 'Nabuchodonosor leur répondit : « Est-il vrai[a], Shadrak, Méshak et Abed-Nego, que vous ne servez pas mon dieu et que vous ne vous prosternez pas devant la statue d’or que j’ai dressée ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’araméen הַצְדָּא peut aussi exprimer le caractère intentionnel du refus : « Est-ce délibérément que vous ne servez pas mon dieu et que vous ne vous prosternez pas devant la statue d’or… ? » ou « Est-ce exprès… ? »'
    reason: 'Alternative lexicale : הַצְדָּא peut porter sur la véracité de l’accusation ou sur le caractère intentionnel du refus.'
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: demanda
  rationale: Cette tournure narrative araméenne introduit ici une question. « Leur demanda » rend naturellement sa fonction en français moderne, sans reproduire lourdement l’idiome « répondit et dit ».
- source_word: לְהוֹן
  choice: leur
  rationale: Pronom pluriel renvoyant collectivement aux trois Judéens.
- source_word: הַצְדָּא
  choice: Est-il vrai
  rationale: Dans le contexte d’une accusation rapportée au roi, cette traduction exprime naturellement la vérification des faits. Le sens possible d’un acte délibéré est conservé en note.
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Shadrak, Méshak et Abed-Nego
  rationale: Translittération française moderne et reconnaissable des trois noms propres.
- source_word: לֵאלָהַי
  choice: mon dieu
  rationale: La forme est comprise comme un singulier muni du suffixe de première personne ; la minuscule convient au dieu revendiqué par le roi.
- source_word: פָּלְחִין
  choice: servez
  rationale: Le verbe désigne le service cultuel. « Servir » maintient sa distinction avec le geste de prosternation exprimé ensuite.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: devant la statue d’or
  rationale: « Statue » convient à l’objet dressé dans ce récit et sonne plus naturellement en français courant que « image d’or » ; « devant » accompagne idiomatiquement le verbe « se prosterner ».
- source_word: דִּי הֲקֵימֶת
  choice: que j’ai dressée
  rationale: « Dresser » rend l’action d’ériger la statue ; le passé composé exprime une action accomplie dont le résultat demeure présent.
- source_word: סָגְדִין
  choice: vous vous prosternez
  rationale: Le verbe indique précisément l’inclination ou la prosternation en hommage et reste distinct du service cultuel.
theological_decisions:
- issue: Maintien de deux verbes distincts pour les actes idolâtres
  choice: « servez » et « vous vous prosternez »
  alternative: Employer « adorez » pour l’un des verbes ou pour les deux
  rationale: L’araméen distingue le service cultuel de la prosternation. La traduction conserve cette articulation sans réduire les deux actes à une seule catégorie.
- issue: Interprétation de הַצְדָּא
  choice: « Est-il vrai » dans le texte principal
  alternative: « Est-ce délibérément ? » ou « Est-ce exprès ? »
  rationale: Le contexte permet soit une vérification de l’accusation, soit une interrogation sur le caractère volontaire du refus. Le premier sens est naturel dans le discours, tandis que l’autre demeure explicitement signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite le calque narratif « répondit et dit », peu naturel ici, tout en conservant la question du roi, la distinction entre service et prosternation, ainsi que l’ambiguïté de הַצְדָּא au moyen d’une note.
