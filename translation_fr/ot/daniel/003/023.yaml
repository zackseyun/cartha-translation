base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/023.yaml
  text: And these three men—Shadrach[a], Meshach[b], and Abed-nego—fell bound into the midst of the blazing furnace.
translation:
  language: fr
  text: Et ces trois hommes — Shadrac, Méshac et Abed-Nego — tombèrent, ligotés, au milieu de la fournaise ardente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire, de manière plus interprétative : « furent jetés au milieu de la fournaise ardente ». Le verbe araméen signifie simplement « tombèrent », même si le contexte indique qu’on les avait jetés dans la fournaise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֻבְרַיָּא אִלֵּךְ תְּלָתֵּהוֹן
  choice: ces trois hommes
  rationale: Cette formulation naturelle rend le nom « hommes », le démonstratif et le nombre muni du suffixe (« les trois d’entre eux »).
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Shadrak, Méshak et Abed-Nego
  rationale: Les noms propres sont translittérés selon leurs formes françaises usuelles et reconnaissables.
- source_word: נְפַלוּ
  choice: tombèrent
  rationale: Le verbe araméen signifie simplement « tomber ». Cette traduction conserve le point de vue du verset sans y réintroduire explicitement l’action de les jeter, déjà donnée par le contexte.
- source_word: לְגוֹא
  choice: au milieu de
  rationale: Le terme désigne l’intérieur ou le milieu et apporte davantage de précision spatiale qu’un simple « dans ».
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: la fournaise ardente
  rationale: Cette expression française naturelle désigne une fournaise caractérisée par un feu brûlant, sans reproduire lourdement chaque élément de l’expression araméenne.
- source_word: מְכַפְּתִין
  choice: ligotés
  rationale: Le participe passif signifie qu’ils étaient attachés. « Ligotés » est courant et précis, sans ajouter qu’ils l’étaient « pieds et poings liés ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’araméen tout en étant naturelle; « fournaise ardente » est idiomatique, et « tombèrent » préserve la formulation exacte ainsi que sa tension avec le contexte.
