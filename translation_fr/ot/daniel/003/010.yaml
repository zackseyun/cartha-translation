source:
  edition: WLC
  text: אנתה מַלְכָּ/א֮ שָׂ֣מְתָּ טְּעֵם֒ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִשְׁמַ֡ע קָ֣ל קַרְנָ֣/א מַ֠שְׁרֹקִיתָ/א קיתרס שַׂבְּכָ֤א פְסַנְתֵּרִין֙ ו/סיפניה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א יִפֵּ֥ל וְ/יִסְגֻּ֖ד לְ/צֶ֥לֶם דַּהֲבָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/010.yaml
  text: You[a], O king, have issued a decree that every man who hears the sound of the horn, pipe, lyre[b], trigon, psaltery, and bagpipe, and every kind of music, must fall down and worship the golden image.
translation:
  language: fr
  text: 'Ô roi, tu as promulgué un décret : tout homme[a] qui entend le son de la corne, de la flûte, de la lyre, de la harpe triangulaire, du psaltérion, de la cornemuse[b], ainsi que toute sorte de musique, doit tomber à terre et adorer la statue d’or.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute personne » ou « quiconque » ; l’araméen emploie ici un masculin singulier dans un sens générique.
    reason: lexical_alternative
  - marker: b
    text: Ou « double flûte » ; l’identification exacte de cet instrument araméen est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה מַלְכָּא
  choice: Toi, ô roi
  rationale: Le pronom indépendant ouvre une adresse directe et solennelle. « Toi » en conserve la légère mise en relief, tandis que « ô roi » rend le vocatif de cour.
- source_word: שָׂמְתָּ טְּעֵם
  choice: tu as promulgué un décret
  rationale: Cette expression signifie littéralement « établir un décret ». « Promulguer un décret » en restitue naturellement la portée officielle et juridique.
- source_word: כָל אֱנָשׁ
  choice: tout homme
  rationale: Le nom araméen est un masculin singulier employé dans un sens générique. La traduction conserve cette forme tout en signalant en note son sens représentatif.
- source_word: יִשְׁמַע קָל
  choice: qui entendrait le son
  rationale: « Le son » rend directement קָל, et le conditionnel s’intègre naturellement à l’énoncé rapportant le contenu du décret.
- source_word: קַרְנָא
  choice: corne
  rationale: Le terme désigne de manière générale un instrument à vent fait comme une corne ou appelé ainsi, sans imposer l’identification plus précise de « cor de bélier ».
- source_word: מַשְׁרֹקִיתָא
  choice: flûte
  rationale: Le mot désigne un instrument à vent, mais son identification exacte reste incertaine. « Flûte » est une désignation française courante et prudente.
- source_word: קיתרס
  choice: lyre
  rationale: Cet emprunt apparenté au grec kithara désigne un instrument à cordes. « Lyre » est clair et accessible en français moderne.
- source_word: שַׂבְּכָא
  choice: harpe triangulaire
  rationale: L’instrument est probablement un instrument à cordes de forme triangulaire. Cette expression est plus intelligible en français que le terme technique « trigone », sans prétendre à une certitude absolue.
- source_word: פְסַנְתֵּרִין
  choice: psaltérion
  rationale: Le terme français traditionnel désigne un ancien instrument à cordes pincées et permet de le distinguer des autres instruments énumérés.
- source_word: סִיפֹנְיָה
  choice: cornemuse
  rationale: « Cornemuse » suit une identification ancienne et plausible, mais l’instrument exact demeure discuté; « double flûte » est donc conservé en note.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: ainsi que toute sorte de musique
  rationale: La formulation conserve le sens littéral de « toute sorte de musique » plutôt que de réduire l’expression aux seuls instruments.
- source_word: יִפֵּל וְיִסְגֻּד
  choice: devrait tomber à terre et adorer
  rationale: « Tomber à terre » exprime le geste physique, tandis que « adorer » conserve la portée cultuelle de l’acte imposé devant la statue.
- source_word: צֶלֶם דַּהֲבָא
  choice: la statue d’or
  rationale: Dans ce récit, צֶלֶם désigne une représentation matérielle dressée. « Statue » est naturel et concret en français.
theological_decisions:
- issue: Portée du masculin générique אֱנָשׁ
  choice: tout homme
  alternative: toute personne / quiconque
  rationale: Le texte emploie un nom masculin singulier avec une portée représentative. Le corps du texte en garde la forme, tandis que la note explicite qu’il vise toute personne.
- issue: Portée religieuse de וְיִסְגֻּד
  choice: adorer
  alternative: rendre hommage / se prosterner
  rationale: L’acte vise une statue d’or dans un cadre cultuel. « Adorer » préserve cette tension théologique, tandis que « rendre hommage » pourrait atténuer la dimension religieuse.
translation_notes:
  register: Français international moderne, digne et lisible. Le ton officiel de l’adresse et du décret est préservé sans archaïsme excessif. Les noms d’instruments restent distincts, avec une note lorsque l’identification est particulièrement incertaine.
