    rationale: L’araméen emploie des imperfectifs prescrivant ce que toute personne qui entend les instruments est tenue de faire. En français, le présent (« entend », « doit ») restitue mieux l’énoncé normatif direct sans introduire une nuance hypothétique ou indirectement atténuée.
  - severity: low
    issue: Redoublement emphatique dans « Toi, ô roi, tu ».
    rationale: Le pronom indépendant peut marquer l’adresse directe, mais la répétition française est lourde. « Ô roi, tu » conserve la solennité et reste idiomatique.
