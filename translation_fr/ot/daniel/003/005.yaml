id: DAN.3.5
reference: Daniel 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַ֠שְׁרוֹקִיתָ/א קיתרוס סַבְּכָ֤א פְּסַנְתֵּרִין֙ סוּמְפֹּ֣נְיָ֔ה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א תִּפְּל֤וּן וְ/תִסְגְּדוּן֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/005.yaml
  text: At the time when you hear the sound of the horn[a], pipe, lyre, trigon, psaltery, bagpipe, and every kind of music[b], you are to fall down and pay homage to the golden image that King Nebuchadnezzar has set up.
translation:
  language: fr
  text: Au moment où vous entendrez le son du cor, de la flûte, de la lyre, du trigone, du psaltérion, de la cornemuse[b] et de toutes sortes de musique, vous vous jetterez à terre et rendrez hommage[a] à la statue d’or que le roi Nabuchodonosor a dressée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « adorer ». Le verbe araméen désigne le fait de se prosterner avec révérence; dans ce contexte, l’hommage rendu à la statue a un caractère idolâtre.
    reason: alternative_reading
  - marker: b
    text: L’identification de cet instrument est incertaine; on propose aussi « double flûte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעִדָּנָא דִּי
  choice: Au moment où
  rationale: Rend l’expression temporelle araméenne de façon naturelle tout en conservant l’idée du moment précis où retentit le signal.
- source_word: קַרְנָא
  choice: cor
  rationale: Désignation française générale d’un instrument à vent de type corne, sans préciser indûment qu’il s’agit d’une corne de bélier.
- source_word: מַשְׁרוֹקִיתָא
  choice: flûte
  rationale: Équivalent français courant pour cet instrument à vent, dont l’identification exacte comme flûte ou pipeau demeure générale.
- source_word: קיתרוס
  choice: lyre
  rationale: Rend clairement le nom d’emprunt désignant un instrument à cordes apparenté à la cithare ou à la lyre.
- source_word: סַבְּכָא
  choice: trigone
  rationale: Terme spécialisé qui maintient la distinction dans l’énumération et reflète l’identification traditionnelle d’un instrument triangulaire à cordes, sans la présenter comme certaine.
- source_word: פְּסַנְתֵּרִין
  choice: psaltérion
  rationale: Nom français traditionnel d’un instrument à cordes, distinct des autres instruments énumérés.
- source_word: סוּמְפֹּנְיָה
  choice: cornemuse
  rationale: Identification courante mais incertaine du terme; cette incertitude est explicitée en note.
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: et de toutes sortes d’instruments de musique
  rationale: Dans le contexte d’une liste instrumentale et de leur son, cette formulation française explicite naturellement la catégorie générale sans réduire זְמָרָא au seul chant.
- source_word: תִּפְּלוּן
  choice: vous vous jetterez à terre
  rationale: Conserve le mouvement concret de tomber ou de se prosterner, ici exigé par l’ordre royal.
- source_word: וְתִסְגְּדוּן
  choice: rendrez hommage
  rationale: Exprime l’acte de révérence et de soumission impliqué par le verbe sans remplacer d’emblée sa valeur lexicale par le terme théologique plus déterminé « adorer ».
- source_word: צֶלֶם דַּהֲבָא
  choice: statue d’or
  rationale: « Statue » est naturel en français pour l’objet matériel dressé par le roi, tout en rendant le sens d’image ou de représentation.
- source_word: הֲקֵים
  choice: a dressée
  rationale: Rend l’action d’ériger ou d’installer la statue dans un français idiomatique.
theological_decisions:
- issue: Sens de סגד dans un contexte idolâtre
  choice: rendre hommage
  alternative: adorer; se prosterner devant
  rationale: Le verbe désigne la prosternation ou l’hommage révérenciel. Le contexte narratif rend cet hommage idolâtre, mais la traduction principale préserve la portée propre du verbe; la note signale « adorer » comme possibilité contextuelle.
translation_notes:
  register: 'Français international moderne, clair et digne. L’énumération conserve les distinctions entre les instruments, y compris les termes spécialisés « trigone » et « psaltérion ». Les appels de notes ont été placés sur les expressions auxquelles ils se rapportent: [a] après « hommage » et [b] après « cornemuse ».'
