source:
  edition: WLC
  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א עֲבַד֙ צְלֵ֣ם דִּֽי דְהַ֔ב רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֣ין שִׁ֑ת אֲקִימֵ/הּ֙ בְּ/בִקְעַ֣ת דּוּרָ֔א בִּ/מְדִינַ֖ת בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/001.yaml
  text: King Nebuchadnezzar made an image of gold[a], its height sixty cubits and its width six cubits. He set it up in the plain of Dura[b], in the province of Babylon.
translation:
  language: fr
  text: Le roi Nabuchodonosor fit une statue[a] en or, haute de soixante coudées[b] et large de six coudées. Il la dressa dans la plaine de Doura, dans la province de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une image ». Le terme araméen peut désigner une image ou une statue. « Idole » est également possible à la lumière de la suite du récit, mais le texte principal conserve ici une formulation plus neutre.
    reason: Alternative lexicale pour צְלֵם ; la note est ancrée au terme traduit.
  - marker: b
    text: Une coudée était une ancienne unité de longueur correspondant approximativement à la distance entre le coude et l’extrémité des doigts.
    reason: Note culturelle sur l’unité de mesure ; la note est ancrée à sa première occurrence.
lexical_decisions:
- source_word: מַלְכָּא
  choice: Le roi
  rationale: 'En français, le titre précédant un nom propre s''emploie naturellement avec l''article défini : « le roi Nabuchodonosor ».'
- source_word: עֲבַד
  choice: fit
  rationale: Le verbe araméen signifie couramment « faire » ; le passé simple convient au registre narratif soutenu sans préciser indûment le procédé de fabrication.
- source_word: צְלֵם
  choice: statue
  rationale: Le terme désigne une image ou une statue. Vu les dimensions et le fait qu'elle est dressée, « statue » est naturel en français, tout en évitant l'interprétation cultuelle explicite de « idole ».
- source_word: דִּי דְהַב
  choice: en or
  rationale: Cette formulation française exprime naturellement la matière sans trancher entre or massif et revêtement d'or.
- source_word: רוּמֵהּ אַמִּין שִׁתִּין
  choice: haute de soixante coudées
  rationale: La tournure adjectivale est claire et idiomatique en français tout en rendant exactement la hauteur indiquée.
- source_word: פְּתָיֵהּ אַמִּין שִׁת
  choice: large de six coudées
  rationale: « Large de » rend naturellement la dimension de largeur en français contemporain.
- source_word: אֲקִימֵהּ
  choice: Il la dressa
  rationale: Le verbe signifie faire tenir debout, ériger ou installer ; « dresser » convient à une grande statue et maintient un registre digne.
- source_word: בְּבִקְעַת
  choice: dans la plaine
  rationale: Le nom désigne une plaine ou une large vallée ; « plaine » convient au cadre géographique sans surinterprétation.
- source_word: דּוּרָא
  choice: Doura
  rationale: Le toponyme est translittéré selon une forme française usuelle.
- source_word: בִּמְדִינַת בָּבֶל
  choice: dans la province de Babylone
  rationale: מְדִינָה désigne ici une circonscription administrative ; « province de Babylone » rend directement la construction araméenne.
theological_decisions:
- issue: Faut-il rendre צְלֵם par un terme explicitement cultuel ?
  choice: statue
  alternative: image ; idole
  rationale: Le verset décrit l'objet et son installation sans encore le qualifier explicitement d'idole. « Statue » convient à sa forme monumentale tout en laissant le contexte ultérieur établir sa fonction religieuse.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple garde la tenue littéraire du récit biblique. La note unique est placée après « en or » et couvre à la fois l'alternative lexicale et l'explication des coudées, puisque le texte source fourni ne comporte qu'un marqueur pertinent sans ambiguïté de placement.
