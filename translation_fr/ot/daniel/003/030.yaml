  yaml_path: translation/ot/daniel/003/030.yaml
  text: Then the king caused Shadrach[a], Meshach, and Abednego to prosper in the province of Babylon.
translation:
  language: fr
  text: Alors le roi fit prospérer Shadrak[a], Méshak et Abed-Nego dans la province de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « accorda de l’avancement à Shadrak, Méshak et Abed-Nego dans la province de Babylone ». Le verbe araméen peut signifier faire prospérer quelqu’un ou le faire réussir ; dans ce contexte, cela peut inclure une promotion officielle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marqueur narratif araméen qui présente la conséquence ou la suite de l’événement précédent ; « Alors » est naturel et conserve l’enchaînement du récit.
- source_word: מַלְכָּא
  choice: le roi
  rationale: Le nom à l’état emphatique signifie « le roi ». Le contexte permet de l’identifier à Nabucodonosor, mais le texte source ne répète pas ici son nom.
- source_word: הַצְלַח
  choice: fit prospérer
  rationale: La forme verbale exprime l’idée de faire réussir ou prospérer. Cette traduction garde la valeur causative et l’action du roi sans la réduire à une promotion administrative.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Shadrak, Méshak et Abed-Nego
  rationale: Translittération française moderne et reconnaissable des trois noms propres araméens.
- source_word: בִּמְדִינַת בָּבֶל
  choice: dans la province de Babylone
  rationale: מְדִינָה désigne ici une circonscription administrative ; « province de Babylone » est une formulation française naturelle adaptée au cadre impérial.
