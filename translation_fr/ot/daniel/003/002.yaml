  text: וּ/נְבוּכַדְנֶצַּ֣ר מַלְכָּ֡/א שְׁלַ֡ח לְ/מִכְנַ֣שׁ לַֽ/אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ/א֩ גְדָ֨בְרַיָּ֤/א דְּתָבְרַיָּ/א֙ תִּפְתָּיֵ֔/א וְ/כֹ֖ל שִׁלְטֹנֵ֣י מְדִֽינָתָ֑/א לְ/מֵתֵא֙ לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/002.yaml
  text: Then King Nebuchadnezzar sent to assemble the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces, to come to the dedication of the image that King Nebuchadnezzar had set up.
translation:
  language: fr
  text: Puis le roi Nabuchodonosor envoya convoquer les satrapes, les préfets, les gouverneurs, les conseillers, les trésoriers, les juges, les magistrats et tous les responsables des provinces, afin qu’ils viennent à la dédicace de la statue[a] que le roi Nabuchodonosor avait dressée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « image ». Le terme araméen peut désigner une représentation en général ou, dans ce contexte, une statue monumentale.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְמִכְנַשׁ
  choice: envoya l’ordre de rassembler
  rationale: Le verbe signifie littéralement « envoya », suivi d’un infinitif exprimant le but. En français, « envoya l’ordre de » rend naturellement l’idée d’une convocation officielle sans réduire le verbe à « ordonna ».
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: satrapes
  rationale: Ce terme administratif d’origine perse est bien établi en français et préserve le cadre impérial historique.
- source_word: סִגְנַיָּא
  choice: préfets
  rationale: Équivalent français traditionnel et intelligible pour cette catégorie de hauts fonctionnaires.
- source_word: פַחֲוָתָא
  choice: gouverneurs
  rationale: Rend directement un titre administratif reconnu tout en le distinguant des satrapes.
- source_word: אֲדַרְגָּזְרַיָּא
  choice: conseillers
  rationale: La fonction exacte est incertaine; ce terme conventionnel communique prudemment une fonction consultative de haut rang.
- source_word: גְדָבְרַיָּא
  choice: trésoriers
  rationale: Le mot désigne vraisemblablement des responsables du trésor ou des finances.
- source_word: דְּתָבְרַיָּא
  choice: juges
  rationale: Équivalent direct pour des responsables chargés de décisions juridiques.
- source_word: תִּפְתָּיֵא
  choice: magistrats
  rationale: La nuance exacte est discutée; « magistrats » conserve le sens judiciaire et administratif sans prétendre identifier plus précisément la charge.
- source_word: שִׁלְטֹנֵי מְדִינָתָא
  choice: tous les responsables des provinces
  rationale: Cette formulation générale résume les autorités provinciales après l’énumération des charges particulières.
- source_word: לְמֵתֵא
  choice: afin qu’ils viennent
  rationale: Rend le sens concret de « venir » et explicite naturellement en français le sujet sous-entendu.
- source_word: חֲנֻכַּת
  choice: dédicace
  rationale: Le nom désigne la cérémonie par laquelle un objet est inauguré ou consacré.
- source_word: צַלְמָא
  choice: statue
  rationale: Le terme peut désigner une image au sens large; dans ce contexte monumental et tridimensionnel, « statue » est le choix français le plus naturel.
- source_word: הֲקֵים
  choice: avait dressée
  rationale: Le verbe signifie établir ou ériger. « Dresser » convient à une statue et l’accord au féminin suit le choix lexical français.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue liste administrative est conservée pour respecter la solennité et l’effet cumulatif de l’araméen. « Envoya l’ordre » évite le calque peu naturel « envoya pour rassembler » tout en maintenant le verbe source.
