revisions:
- from: Puis le roi Nabuchodonosor envoya l’ordre de rassembler les satrapes, les préfets, les gouverneurs, les conseillers, les trésoriers, les juges, les magistrats et tous les responsables des provinces, afin qu’ils viennent à la dédicace de la statue[a] que le roi Nabuchodonosor avait dressée.
  to: Puis le roi Nabuchodonosor envoya convoquer les satrapes, les préfets, les gouverneurs, les conseillers, les trésoriers, les juges, les magistrats et tous les responsables des provinces, afin qu’ils viennent à la dédicace de la statue[a] que le roi Nabuchodonosor avait dressée.
  rationale: La seule correction remplace « envoya l’ordre de rassembler » par « envoya convoquer ». Elle évite une addition explicative non nécessaire, rend plus directement la syntaxe et le sens de l’araméen, et maintient le ton administratif et solennel du verset. La note est correctement ancrée et doit être conservée sans modification.
