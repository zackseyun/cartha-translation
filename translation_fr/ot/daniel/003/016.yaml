  text: עֲנ֗וֹ שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ וְ/אָמְרִ֖ין לְ/מַלְכָּ֑/א נְבֽוּכַדְנֶצַּ֔ר לָֽא חַשְׁחִ֨ין אֲנַ֧חְנָה עַל דְּנָ֛ה פִּתְגָ֖ם לַ/הֲתָבוּתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/016.yaml
  text: Shadrach, Meshach, and Abed-nego answered and said to the king, Nebuchadnezzar, “We have no need to give you an answer concerning this matter.”
translation:
  language: fr
  text: 'Shadrak, Méshak et Abed-Nego répondirent au roi Nebucadnetsar : « Nous n’avons pas besoin de te répondre au sujet de cette affaire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנוֹ ... וְאָמְרִין
  choice: répondirent
  rationale: La formule araméenne littérale « répondirent et dirent » est un idiome d’introduction à la parole; « répondirent » en restitue naturellement la fonction en français.
- source_word: לְמַלְכָּא נְבוּכַדְנֶצַּר
  choice: 'au roi : « Nebucadnetsar »'
  rationale: Le texte présente d’abord le destinataire comme « le roi », puis l’interpelle par son nom; la ponctuation française conserve cette articulation.
- source_word: לָא חַשְׁחִין אֲנַחְנָה
  choice: nous n’avons pas besoin
  rationale: L’expression indique l’absence de nécessité ou d’obligation, plutôt qu’une incapacité.
- source_word: פִּתְגָם לַהֲתָבוּתָךְ
  choice: de te répondre
  rationale: Littéralement, il s’agit de « retourner/rendre une parole à toi »; « te répondre » exprime clairement cet idiome sans lourdeur.
- source_word: עַל דְּנָה
  choice: à ce sujet
  rationale: Rend naturellement « concernant ceci/cette affaire » tout en laissant le référent au contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Les noms propres suivent des formes françaises courantes. Le vouvoiement n’est pas employé, car l’araméen marque ici le singulier sans distinction de politesse; le tutoiement conserve cette donnée grammaticale sans ajouter de nuance honorifique absente du texte.
