  text: בֵּ/אדַ֜יִן גֻּבְרַיָּ֣/א אִלֵּ֗ךְ כְּפִ֨תוּ֙ בְּ/סַרְבָּלֵי/הוֹן֙ פטישי/הון וְ/כַרְבְּלָתְ/ה֖וֹן וּ/לְבֻשֵׁי/ה֑וֹן וּ/רְמִ֕יו לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/021.yaml
  text: Then these men were bound in their trousers[a], their tunics, their cloaks, and their other garments[b], and they were thrown into the midst of the blazing furnace.
translation:
  language: fr
  text: Alors ces hommes furent ligotés, encore vêtus de leurs pantalons, de leurs tuniques[a], de leurs manteaux et de leurs autres vêtements, puis jetés au milieu de la fournaise ardente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de leurs turbans ». Le mot araméen est rare, et le vêtement précis qu’il désigne est incertain.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la fournaise du feu brûlant ».'
    reason: literal_rendering
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la succession immédiate des événements dans le récit, dans un français naturel.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: ces hommes
  rationale: Le démonstratif renvoie aux trois Judéens dont il vient d’être question.
- source_word: כְּפִתוּ
  choice: furent ligotés
  rationale: La forme passive présente les hommes comme ceux que l’on attache; « ligotés » exprime clairement l’immobilisation avant leur exécution.
- source_word: בְּסַרְבָּלֵיהוֹן
  choice: tout habillés de leurs pantalons
  rationale: Le terme, probablement un emprunt au perse, désigne vraisemblablement un vêtement couvrant le bas du corps. La tournure indique qu’ils sont attachés sans être dévêtus.
- source_word: פטישי/הון
  choice: leurs tuniques
  rationale: Ce terme rare désigne un vêtement dont la nature exacte reste incertaine. « Tuniques » est une solution lisible et prudente; l’autre interprétation courante, « turbans », est signalée en note.
- source_word: כַרְבְּלָתְהוֹן
  choice: leurs manteaux
  rationale: Le mot paraît désigner un vêtement extérieur ou une pièce d’étoffe enveloppante.
- source_word: לְבֻשֵׁיהוֹן
  choice: leurs autres vêtements
  rationale: Terme général récapitulatif après l’énumération de plusieurs pièces d’habillement.
- source_word: וּרְמִיו
  choice: puis jetés
  rationale: Le contexte donne au verbe un sens passif à l’égard des trois hommes; « puis » rend naturellement la progression de l’action.
- source_word: לְגוֹא
  choice: au milieu de
  rationale: Rend l’idée de l’intérieur ou du cœur de la fournaise, et non la seule direction du mouvement.
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: la fournaise ardente
  rationale: Expression française naturelle qui conserve l’intensité de la formule araméenne accumulant les notions de fournaise, de feu et de combustion.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Tout habillés de » évite l’ambiguïté de « liés avec leurs vêtements », qui pourrait laisser croire que ceux-ci servaient de liens, tout en conservant l’idée qu’ils furent jetés dans la fournaise sans être dévêtus.
