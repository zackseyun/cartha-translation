source:
  edition: WLC
  text: הֵ֣ן אִיתַ֗י אֱלָהַ֨/נָא֙ דִּֽי אֲנַ֣חְנָא פָֽלְחִ֔ין יָכִ֖ל לְ/שֵׁיזָבוּתַ֑/נָא מִן אַתּ֨וּן נוּרָ֧/א יָקִֽדְתָּ֛/א וּ/מִן יְדָ֥/ךְ מַלְכָּ֖/א יְשֵׁיזִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/017.yaml
  text: If it is so[a], our God whom we serve is able to deliver us from the furnace of blazing fire, and he will deliver us from your hand[c][b], O king.
translation:
  language: fr
  text: S’il en est ainsi[a], notre Dieu, que nous servons, a le pouvoir de nous délivrer de la fournaise au feu ardent[b], et de ta main, ô roi, il nous délivrera[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « S’il y a [un tel cas] ». L’expression araméenne est idiomatique et renvoie à la peine dont le roi vient de les menacer.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la fournaise de feu brûlant » ; traduction française traditionnelle : « la fournaise ardente ».'
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi comprendre : « il peut nous délivrer » ou « qu’il nous délivre ». La forme araméenne admet plusieurs interprétations ; le texte principal la comprend comme une affirmation confiante concernant l’avenir.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן אִיתַי
  choice: S’il en est ainsi
  rationale: L’expression araméenne associe une particule conditionnelle à une forme existentielle et renvoie à la peine dont le roi vient de les menacer. Cette formulation française restitue naturellement l’enchaînement conditionnel.
- source_word: אֱלָהַנָא
  choice: notre Dieu
  rationale: Rend directement le nom avec son suffixe possessif.
- source_word: דִּי אֲנַחְנָא פָלְחִין
  choice: que nous servons
  rationale: Le verbe פְּלַח désigne ici un service de nature cultuelle. « Servons » conserve l’image et laisse le contexte exprimer sa dimension religieuse.
- source_word: יָכִל
  choice: a le pouvoir de
  rationale: Exprime clairement la capacité divine, avec un registre digne et naturel en français.
- source_word: לְשֵׁיזָבוּתַנָא
  choice: nous délivrer
  rationale: Le verbe désigne l’action d’arracher quelqu’un à un danger. « Délivrer » convient au péril physique immédiat et au registre de la confession.
- source_word: מִן אַתּוּן נוּרָא יָקִדְתָּא
  choice: de la fournaise au feu ardent
  rationale: La traduction garde les trois éléments de l’araméen — fournaise, feu et caractère brûlant — tout en évitant une accumulation adjectivale peu naturelle en français moderne.
- source_word: וּמִן יְדָךְ
  choice: de ta main
  rationale: Conserve la métaphore araméenne de la main comme pouvoir ou domination. Le tutoiement correspond au singulier du texte source.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Marque explicitement le vocatif dans un registre solennel adapté à l’adresse directe au souverain.
- source_word: יְשֵׁיזִב
  choice: il nous délivrera
  rationale: L’imparfait araméen est compris dans le texte principal comme une affirmation confiante tournée vers l’avenir, sans masquer les autres analyses possibles.
theological_decisions:
- issue: Valeur de l’imparfait final יְשֵׁיזִב
  choice: 'affirmation confiante : « il nous délivrera »'
  alternative: « il peut nous délivrer » ou « qu’il nous délivre »
  rationale: Le discours permet une déclaration assurée de la capacité et de l’intervention de Dieu. La note maintient cependant l’ambiguïté grammaticale réelle, tandis que le verset suivant préserve la tension théologique en envisageant qu’il n’intervienne pas ainsi.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme de la confession, la métaphore de la main et l’adresse solennelle au roi, tout en expliquant en notes les tournures araméennes et l’ambiguïté du verbe final.
