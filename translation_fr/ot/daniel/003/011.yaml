id: DAN.3.11
reference: Daniel 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מַן דִּי לָ֥א יִפֵּ֖ל וְ/יִסְגֻּ֑ד יִתְרְמֵ֕א לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/011.yaml
  text: And whoever does not fall down and worship shall be thrown into the midst of a furnace of blazing fire[a].
translation:
  language: fr
  text: Et quiconque ne se prosternera pas et n’adorera pas sera jeté au milieu d’une fournaise où brûle un feu ardent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dans l’intérieur d’une fournaise de feu brûlant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: Et quiconque
  rationale: 'La conjonction poursuit l’énoncé du décret, tandis que מַן דִּי introduit une relative indéfinie : « quiconque ».'
- source_word: לָא יִפֵּל וְיִסְגֻּד
  choice: ne se prosternera pas et n’adorera pas
  rationale: Dans ce contexte d’hommage imposé à une statue, יִפֵּל désigne le fait de tomber à terre, rendu naturellement par « se prosterner », et סגד exprime l’adoration ou l’hommage cultuel. Le futur convient à la sanction formulée dans le décret.
- source_word: יִתְרְמֵא
  choice: sera jeté
  rationale: La forme passive exprime la peine prescrite par l’autorité royale ; « sera jeté » est direct, actuel et conserve la force juridique.
- source_word: לְגוֹא
  choice: au milieu de
  rationale: L’expression vise l’intérieur de la fournaise ; « au milieu de » en conserve l’image avec naturel.
- source_word: אַתּוּן
  choice: une fournaise
  rationale: Le terme araméen désigne un four ou une fournaise. « Fournaise » correspond au contexte d’exécution par le feu et au registre solennel.
- source_word: נוּרָא יָקִדְתָּא
  choice: où brûle un feu ardent
  rationale: La formulation restitue distinctement le feu et son caractère brûlant, sans déplacer l’intensification vers la fournaise elle-même. Elle évite aussi la tournure française lourde « fournaise de feu ardent ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Se prosterner » rend le geste d’abaissement cultuel sans suggérer une simple chute physique. La construction « où brûle un feu ardent » privilégie un français naturel tout en maintenant les éléments sémantiques de l’araméen.
