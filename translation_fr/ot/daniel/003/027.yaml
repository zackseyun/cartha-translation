source:
  edition: WLC
  text: וּ֠/מִֽתְכַּנְּשִׁין אֲחַשְׁדַּרְפְּנַיָּ֞/א סִגְנַיָּ֣/א וּ/פַחֲוָתָ/א֮ וְ/הַדָּבְרֵ֣י מַלְכָּ/א֒ חָזַ֣יִן לְ/גֻבְרַיָּ֣/א אִלֵּ֡ךְ דִּי֩ לָֽא שְׁלֵ֨ט נוּרָ֜/א בְּ/גֶשְׁמְ/ה֗וֹן וּ/שְׂעַ֤ר רֵֽאשְׁ/הוֹן֙ לָ֣א הִתְחָרַ֔ךְ וְ/סָרְבָּלֵי/ה֖וֹן לָ֣א שְׁנ֑וֹ וְ/רֵ֣יחַ נ֔וּר לָ֥א עֲדָ֖ת בְּ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/027.yaml
  text: And the satraps[a], the prefects, the governors, and the king’s counselors gathered together and saw concerning these men that the fire had no power over their bodies, and the hair of their heads was not singed, and their cloaks were not changed, and no smell of fire had come upon them.
translation:
  language: fr
  text: 'Les satrapes, les préfets, les gouverneurs et les conseillers du roi se rassemblèrent. Ils constatèrent, au sujet de ces hommes, que le feu n’avait eu aucun pouvoir sur leur corps : pas un cheveu de leur tête n’avait été roussi, leurs manteaux[a] n’avaient pas été altérés et aucune odeur de feu ne s’était attachée à eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vêtements » ; le terme araméen désignant cette pièce d’habillement est de sens incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתְכַּנְּשִׁין
  choice: se rassemblèrent
  rationale: Le participe araméen de כנש exprime l’action collective de se réunir; le passé simple convient au registre narratif français.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: satrapes
  rationale: Ce titre administratif d’origine perse est historiquement précis et bien établi en français.
- source_word: סִגְנַיָּא
  choice: préfets
  rationale: Le terme désigne de hauts administrateurs; « préfets » les distingue clairement des autres fonctions énumérées.
- source_word: פַחֲוָתָא
  choice: gouverneurs
  rationale: Équivalent usuel et naturel de ce titre administratif provincial.
- source_word: הַדָּבְרֵי מַלְכָּא
  choice: les conseillers du roi
  rationale: Dans le contexte de la cour, cette expression rend des agents ou dignitaires royaux sans leur attribuer une fonction technique plus précise que ne le permet le terme.
- source_word: חָזַיִן לְגֻבְרַיָּא אִלֵּךְ
  choice: Ils constatèrent, au sujet de ces hommes, que
  rationale: La préposition לְ marque ici le domaine de référence. Cette formulation conserve cette relation tout en donnant un français intelligible et naturel.
- source_word: לָא שְׁלֵט נוּרָא בְּגֶשְׁמְהוֹן
  choice: le feu n’avait eu aucun pouvoir sur leur corps
  rationale: שׁלט évoque l’exercice d’un pouvoir ou d’une domination; « aucun pouvoir sur » en préserve la force.
- source_word: וּשְׂעַר רֵאשְׁהוֹן לָא הִתְחָרַךְ
  choice: pas un cheveu de leur tête n’avait été roussi
  rationale: « Roussi » décrit précisément l’effet du feu sur les cheveux; la tournure française conserve l’insistance sur leur préservation complète.
- source_word: וְסָרְבָּלֵיהוֹן לָא שְׁנוֹ
  choice: leurs manteaux n’avaient pas été altérés
  rationale: סָרְבָּל désigne une pièce d’habillement dont la nature exacte reste incertaine; « manteaux » est plausible, tandis que la note signale l’incertitude. « Altérés » préserve l’idée littérale de changement sans la réduire à la combustion.
- source_word: וְרֵיחַ נוּר לָא עֲדָת בְּהוֹן
  choice: aucune odeur de feu ne s’était attachée à eux
  rationale: Cette formulation naturelle exprime qu’aucune odeur provenant du feu ne les avait atteints ni imprégnés.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. Le passage à deux phrases évite une coordination excessivement lourde. Le passé simple porte l’action principale, tandis que le plus-que-parfait décrit l’état constaté après l’épreuve du feu. La note est placée sur « manteaux », terme réellement concerné par l’incertitude lexicale.
