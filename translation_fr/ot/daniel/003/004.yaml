  text: And the herald cried aloud[a], “To you it is proclaimed, O peoples, nations[b], and languages:”
translation:
  language: fr
  text: 'Et le héraut cria d’une voix forte[a] : « Peuples, nations et langues, il vous est proclamé[b] : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’araméen dit littéralement « avec force », expression qui décrit ici la puissance ou le volume de la voix du héraut.
    reason: lexical_alternative
  - marker: b
    text: 'L’araméen dit littéralement « ils disent »; cette forme sert ici de formule impersonnelle de proclamation officielle : « il vous est proclamé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרוֹזָא
  choice: le héraut
  rationale: Désigne le proclamateur public officiel; « héraut » conserve le cadre solennel de la cour tout en restant compréhensible en français moderne.
- source_word: קָרֵא
  choice: cria
  rationale: Le verbe exprime ici le fait de lancer publiquement l’annonce à haute voix.
- source_word: בְחָיִל
  choice: d’une voix forte
  rationale: Littéralement « avec force »; dans ce contexte, l’expression décrit la puissance ou le volume de la voix.
- source_word: לְכוֹן אָמְרִין
  choice: Voici ce qui vous est ordonné
  rationale: La forme « ils disent » fonctionne comme une formule impersonnelle d’annonce officielle. Dans le contexte du décret royal, « ordonné » rend sa force prescriptive sans reproduire maladroitement le tour araméen.
- source_word: עַמְמַיָּא
  choice: peuples
  rationale: Conserve le pluriel distributif et le premier élément de la formule impériale ternaire.
- source_word: אֻמַּיָּא
  choice: nations
  rationale: Maintient la distinction avec « peuples » ainsi que le rythme de l’énumération.
- source_word: לִשָּׁנַיָּא
  choice: gens de toutes langues
  rationale: Le mot signifie littéralement « langues », mais il désigne ici, dans une adresse directe, les groupes humains classés selon leur langue; cette formulation est naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, solennel mais accessible. La formule d’adresse conserve le rythme ternaire araméen; « Voici ce qui vous est ordonné » rend naturellement la proclamation officielle et prépare le commandement du verset suivant.
