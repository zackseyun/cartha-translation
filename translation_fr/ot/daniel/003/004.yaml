  source_fidelity: 'La traduction de כָרוֹזָא, קָרֵא et בְחָיִל est fidèle : « le héraut cria d’une voix forte ». En revanche, « Voici ce qui vous est ordonné » renforce indûment אָמְרִין : la formule araméenne impersonnelle signifie « il est proclamé / on proclame », sans exprimer encore un ordre. Le commandement ne vient qu’au verset suivant.'
