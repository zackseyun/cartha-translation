id: DAN.3.18
reference: Daniel 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵ֣ן לָ֔א יְדִ֥יעַ לֶהֱוֵא לָ֖/ךְ מַלְכָּ֑/א דִּ֤י ל/אלהי/ך לָא איתי/נא פָֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א נִסְגֻּֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/018.yaml
  text: But if not[a], let it be known to you, O king, that we will not serve your gods, and we will not bow down to the golden image that you have set up.
translation:
  language: fr
  text: Mais sinon[a], sache, ô roi, que nous ne servirons pas tes dieux et que nous ne nous prosternerons pas devant la statue d’or que tu as dressée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais même s’il ne le fait pas », avec ce sens sous-entendu d’après le verset précédent : « même s’il ne nous délivre pas ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵן לָא
  choice: Mais sinon
  rationale: Cette expression araméenne introduit le cas contraire après l’affirmation du verset précédent. La formulation concise conserve l’ellipse de la source et sa force conditionnelle.
- source_word: יְדִיעַ לֶהֱוֵא לָךְ
  choice: sache
  rationale: L’expression impersonnelle signifie littéralement « que cela te soit connu ». « Sache » est naturel en français moderne tout en gardant le ton ferme et déclaratif.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Le nom est employé comme vocatif. « Ô roi » restitue l’adresse directe et solennelle sans archaïsme excessif.
- source_word: דִּי
  choice: que
  rationale: La particule introduit ici le contenu de ce que le roi doit savoir.
- source_word: לֵאלָהָיִךְ
  choice: tes dieux
  rationale: Le lamed marque le complément du verbe « servir » ; en français, la préposition n’est pas exprimée séparément.
- source_word: לָא אִיתַנָא פָלְחִין
  choice: nous ne servirons pas
  rationale: La construction participiale négative exprime un refus résolu dans le contexte présent et futur. Le futur français rend clairement cet engagement.
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: et ... devant la statue d’or
  rationale: צֶלֶם désigne une représentation ou statue, et דַּהֲבָא l’or. « Statue d’or » est naturel en français et convient à l’objet concret décrit dans le contexte.
- source_word: דִּי הֲקֵימְתָּ
  choice: que tu as dressée
  rationale: Le parfait renvoie à l’action accomplie du roi. « Dresser une statue » est idiomatique et conserve l’idée de l’avoir érigée.
- source_word: לָא נִסְגֻּד
  choice: nous ne nous prosternerons pas
  rationale: Le verbe désigne concrètement l’action de se courber ou de se prosterner en hommage. Ce choix préserve le geste physique et laisse le contexte en manifester la portée cultuelle.
theological_decisions:
- issue: Traduction de l’expression conditionnelle initiale elliptique
  choice: Mais sinon
  alternative: Mais même s’il ne le fait pas / Mais s’il ne nous délivre pas
  rationale: Le verset précédent fournit implicitement l’idée de délivrance, mais le présent verset ne la répète pas. Garder l’ellipse préserve la tension rhétorique et théologique sans expliciter indûment son objet.
translation_notes:
  register: Français international moderne, digne et direct. « Sache, ô roi » maintient la solennité de l’adresse, tandis que « statue d’or », « dressée » et « nous prosternerons » restent immédiatement compréhensibles.
