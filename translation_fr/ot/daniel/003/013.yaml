source:
  edition: WLC
  text: בֵּ/אדַ֤יִן נְבוּכַדְנֶצַּר֙ בִּ/רְגַ֣ז וַ/חֲמָ֔ה אֲמַר֙ לְ/הַיְתָיָ֔ה לְ/שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ בֵּ/אדַ֨יִן֙ גֻּבְרַיָּ֣/א אִלֵּ֔ךְ הֵיתָ֖יוּ קֳדָ֥ם מַלְכָּֽ/א׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/013.yaml
  text: Then Nebuchadnezzar, in rage and fury, commanded that Shadrach, Meshach, and Abed-nego be brought in. Then these men were brought before the king.
translation:
  language: fr
  text: Alors Nabuchodonosor, rempli de rage et de fureur, ordonna qu’on amène Shadrak, Méshak et Abed-Nego. Ces hommes furent donc amenés devant le roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors / donc
  rationale: Ce marqueur narratif araméen fait progresser le récit. « Alors » introduit naturellement l’ordre du roi, tandis que « donc » à la seconde occurrence évite une répétition lourde tout en conservant l’enchaînement.
- source_word: בִּרְגַז וַחֲמָה
  choice: rempli de rage et de fureur
  rationale: Les deux noms coordonnés expriment avec insistance la violente colère du roi. Cette formulation française conserve le redoublement et présente cette colère comme l’état dans lequel il agit.
- source_word: אֲמַר לְהַיְתָיָה
  choice: ordonna qu’on amène
  rationale: La construction « dire » suivie de l’infinitif causatif a ici valeur d’ordre. « Qu’on amène » rend clairement le fait que le roi commande à d’autres de faire venir les trois hommes.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Shadrak, Méshak et Abed-Nego
  rationale: Les noms propres sont translittérés selon des formes françaises courantes et reconnaissables.
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: ces hommes
  rationale: Le démonstratif renvoie directement aux trois hommes qui viennent d’être nommés.
- source_word: הֵיתָיוּ קֳדָם מַלְכָּא
  choice: furent amenés devant le roi
  rationale: 'La forme verbale est causative passive : les hommes ne viennent pas simplement d’eux-mêmes, mais sont conduits auprès du roi. « Devant le roi » convient naturellement au cadre de la cour.'
theological_decisions: []
