  to: Alors les satrapes, les préfets, les gouverneurs, les conseillers, les trésoriers, les juges, les magistrats et tous les responsables des provinces se réunirent pour la dédicace de l’image[a] que le roi Nabuchodonosor avait dressée, et ils se tinrent devant l’image que Nabuchodonosor avait dressée.
