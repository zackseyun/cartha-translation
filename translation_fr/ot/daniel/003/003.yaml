  variant: modern international French
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן מִֽתְכַּנְּשִׁ֡ין אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ֣/א גְדָבְרַיָּ/א֩ דְּתָ֨בְרַיָּ֜/א תִּפְתָּיֵ֗/א וְ/כֹל֙ שִׁלְטֹנֵ֣י מְדִֽינָתָ֔/א לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֣ר מַלְכָּ֑/א ו/קאמין לָ/קֳבֵ֣ל צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/003.yaml
  text: Then the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces were assembled for the dedication of the image that King Nebuchadnezzar had set up, and they stood before the image that Nebuchadnezzar had set up.
translation:
  language: fr
  text: Alors les satrapes, les préfets, les gouverneurs, les conseillers, les trésoriers, les juges, les magistrats et tous les responsables des provinces se réunirent pour la dédicace de l’image[a] que le roi Nabuchodonosor avait dressée, et ils se tinrent devant l’image que Nabuchodonosor avait dressée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « statue ». Le terme araméen peut désigner une image ou une figure monumentale.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Marque la progression du récit de manière naturelle en français moderne.
- source_word: מִתְכַּנְּשִׁין
  choice: se réunirent
  rationale: Rend la valeur collective et réflexive du participe araméen sans alourdir la phrase.
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: satrapes
  rationale: Titre administratif perse bien établi, préférable à une généralisation comme « gouverneurs provinciaux ».
- source_word: סִגְנַיָּא
  choice: préfets
  rationale: Équivalent français courant qui maintient la distinction entre les différents offices.
- source_word: פַחֲוָתָא
  choice: gouverneurs
  rationale: Désignation claire d’une fonction administrative impériale, distincte de celle des satrapes.
- source_word: אֲדַרְגָּזְרַיָּא
  choice: conseillers
  rationale: Le sens précis du titre demeure incertain ; ce terme rend prudemment l’idée de hauts fonctionnaires consultatifs.
- source_word: גְדָבְרַיָּא
  choice: trésoriers
  rationale: Rend l’interprétation courante de ces agents chargés du trésor ou des finances.
- source_word: דְּתָבְרַיָּא
  choice: juges
  rationale: Équivalent direct et intelligible pour des responsables de fonction judiciaire.
- source_word: תִּפְתָּיֵא
  choice: magistrats
  rationale: Conserve la nuance juridico-administrative tout en distinguant cet office de celui des juges.
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: tous les fonctionnaires des provinces
  rationale: Formule récapitulative naturelle qui englobe les autres détenteurs d’une autorité administrative.
- source_word: לַחֲנֻכַּת
  choice: pour la dédicace de
  rationale: Désigne clairement la cérémonie officielle par laquelle le monument est consacré ou inauguré.
- source_word: צַלְמָא
  choice: image
  rationale: Préserve le terme générique araméen et sa répétition, sans décider si l’objet est une représentation ou plus précisément une statue monumentale.
- source_word: הֲקֵים
  choice: avait dressée
  rationale: Exprime naturellement l’action d’ériger ou d’installer un monument et respecte l’antériorité par rapport au rassemblement.
- source_word: לָקֳבֵל
  choice: devant
  rationale: Rend directement la position des fonctionnaires face à l’image.
theological_decisions:
- issue: Nature exacte de צַלְמָא
  choice: image
  alternative: statue
  rationale: Le texte ne précise pas sans ambiguïté la forme ni la fonction représentative de l’objet ; le texte principal garde donc le terme plus large, avec l’autre possibilité en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue énumération administrative et la répétition finale de « l’image que Nabuchodonosor avait dressée » sont conservées pour respecter la solennité et l’insistance du texte araméen.
