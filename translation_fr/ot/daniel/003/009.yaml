base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/009.yaml
  text: They answered and said to King Nebuchadnezzar[a], “O king, live forever!”
translation:
  language: fr
  text: 'Ils répondirent au roi Nabuchodonosor : « Ô roi, puisses-tu vivre éternellement[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Araméen : « Vis pour des âges. » Cette expression est une acclamation conventionnelle de cour qui signifie « puisses-tu vivre éternellement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ וְאָמְרִין
  choice: Ils répondirent
  rationale: La formule araméenne associe littéralement « répondre » et « dire ». En français narratif actuel, « ils répondirent » en exprime naturellement la fonction sans la lourdeur de « ils répondirent et dirent ».
- source_word: לִנְבוּכַדְנֶצַּר מַלְכָּא
  choice: au roi Nabuchodonosor
  rationale: La préposition désigne l’interlocuteur et מַלְכָּא donne son titre. L’ordre « roi Nabuchodonosor » est naturel en français.
- source_word: מַלְכָּא
  choice: Ô roi
  rationale: La seconde occurrence est un vocatif solennel. « Ô roi » conserve le ton de l’acclamation de cour.
- source_word: לְעָלְמִין חֱיִי
  choice: puisses-tu vivre éternellement
  rationale: L’impératif חֱיִי a ici la valeur d’un souhait respectueux. Le pluriel לְעָלְמִין signifie littéralement « pour des âges », mais forme dans ce contexte l’acclamation idiomatique « vivre éternellement ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La formule redondante « répondirent et dirent » est rendue idiomatiquement par « répondirent », tandis que le vocatif solennel et la valeur optative de l’acclamation sont conservés.
