  text: וּ/לְ/גֻבְרִ֤ין גִּבָּֽרֵי חַ֨יִל֙ דִּ֣י בְ/חַיְלֵ֔/הּ אֲמַר֙ לְ/כַפָּתָ֔ה לְ/שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לְ/מִרְמֵ֕א לְ/אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/020.yaml
  text: And he commanded certain mighty men of valor who were in his army to bind Shadrach[a], Meshach, and Abednego, to throw them into the blazing furnace of fire.
translation:
  language: fr
  text: Puis il ordonna à des hommes vaillants de son armée d’attacher Shadrak, Méshak et Abed-Nego, et de les jeter dans la fournaise de feu ardent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְגֻבְרִין גִּבָּרֵי חַיִל
  choice: à quelques hommes robustes
  rationale: L’expression désigne des hommes particulièrement forts et capables, ici des soldats choisis pour exécuter l’ordre. « Hommes robustes » exprime naturellement leur force physique dans ce contexte.
- source_word: דִּי בְחַיְלֵהּ
  choice: de son armée
  rationale: חַיִל désigne ici la force militaire du roi plutôt qu’une qualité abstraite.
- source_word: אֲמַר
  choice: il ordonna
  rationale: Le verbe signifie littéralement « dire », mais les infinitifs qui suivent lui donnent clairement ici la valeur contextuelle d’un ordre.
- source_word: לְכַפָּתָה
  choice: de ligoter
  rationale: Le verbe signifie attacher ou lier. « Ligoter » est actuel, précis et convient à l’action imposée aux soldats.
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: Shadrak, Méshak et Abed-Nego
  rationale: Les noms sont transcrits selon des formes françaises courantes et aisément reconnaissables.
- source_word: לְמִרְמֵא
  choice: de les jeter
  rationale: Le verbe exprime l’action de jeter; le pronom objet est ajouté en français pour une syntaxe naturelle et non ambiguë.
- source_word: לְאַתּוּן נוּרָא יָקִדְתָּא
  choice: dans la fournaise où flambait le feu
  rationale: Cette formulation conserve les trois éléments du texte araméen — la fournaise, le feu et son caractère brûlant — tout en évitant une accumulation adjectivale peu naturelle en français.
