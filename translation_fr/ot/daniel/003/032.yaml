    rationale: Ce choix interprète les actes comme exclusivement favorables au roi. Le contexte immédiat du récit comporte également son abaissement; « à mon égard » maintient le sens relationnel sans imposer cette qualification.
  - severity: low
    issue: La note b propose une alternative plus large que le texte principal
    rationale: Puisque la traduction principale est révisée pour préserver l’ambiguïté, la note doit expliciter le littéral et éviter de présenter « en sa faveur » comme le sens déterminant.
