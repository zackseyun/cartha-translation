  text: אָֽתַיָּ/א֙ וְ/תִמְהַיָּ֔/א דִּ֚י עֲבַ֣ד עִמִּ֔/י אֱלָהָ֖/א עלי/א שְׁפַ֥ר קָֽדָמַ֖/י לְ/הַחֲוָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/032.yaml
  text: It has seemed good to me to declare the signs and wonders that the Most High God has done for me[a][b].
translation:
  language: fr
  text: Il m’a paru bon de faire connaître les signes et les prodiges que le Dieu Très-Haut a accomplis à mon égard[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il m’a semblé bon de déclarer » ; l’expression araméenne est une formule officielle indiquant l’approbation ou la décision du roi.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « a accomplis avec moi » ; l’expression désigne ce que Dieu a fait dans le cas de Nabuchodonosor ou à son égard.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָתַיָּא
  choice: les signes
  rationale: Le nom araméen pluriel désigne des « signes ». L’article français convient aux actes précis que le roi va raconter.
- source_word: וְתִמְהַיָּא
  choice: et les prodiges
  rationale: Dans cette association traditionnelle, « prodiges » exprime des actes extraordinaires suscitant l’émerveillement et conserve un registre biblique digne mais courant.
- source_word: עֲבַד
  choice: a accomplis
  rationale: Le verbe signifie « faire ». Avec « signes et prodiges », « accomplir » est naturel en français et présente ces actes comme achevés, mais toujours pertinents pour la proclamation.
- source_word: עִמִּי
  choice: en ma faveur
  rationale: Littéralement « avec moi » ; dans ce contexte, l’expression décrit ce que Dieu a fait à l’égard de Nabuchodonosor. « En ma faveur » rend la portée bénéfique sans effacer la formulation littérale, signalée en note.
- source_word: אֱלָהָא עִלָּיָא
  choice: le Dieu Très-Haut
  rationale: Cette formulation française naturelle conserve explicitement le titre divin superlatif sans y ajouter de précision doctrinale.
- source_word: שְׁפַר קָדָמַי
  choice: Il m’a paru bon
  rationale: L’expression signifie littéralement que la chose a paru bonne devant le roi. Cette tournure garde le caractère formel d’une décision royale tout en restant idiomatique.
- source_word: לְהַחֲוָיָה
  choice: de faire connaître
  rationale: L’infinitif signifie « montrer, faire connaître, déclarer ». « Faire connaître » exprime clairement la publication des actes divins et reste proche du sens source.
theological_decisions:
- issue: Traduction du titre אֱלָהָא עִלָּיָא
  choice: le Dieu Très-Haut
  alternative: le Dieu suprême
  rationale: « Le Dieu Très-Haut » préserve le titre explicite et son caractère superlatif, sans importer une formulation doctrinale postérieure.
- issue: Portée de עִמִּי
  choice: en ma faveur
  alternative: avec moi
  rationale: Le contexte indique des actes de Dieu concernant personnellement le roi et compris comme bénéfiques. La note maintient visible l’ambiguïté de la préposition araméenne.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Il m’a paru bon » conserve le ton d’une proclamation royale ; « signes et prodiges » maintient l’association biblique consacrée sans archaïsme marqué.
