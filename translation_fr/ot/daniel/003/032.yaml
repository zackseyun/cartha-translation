  to: Il m’a paru bon de faire connaître les signes et les prodiges que le Dieu Très-Haut a accomplis à mon égard[a][b].
  rationale: La révision se limite à remplacer « en ma faveur » par « à mon égard » et à ajuster la note correspondante. Elle conserve le caractère personnel de l’énoncé tout en ne qualifiant pas à l’avance les actes divins comme uniquement bénéfiques.
