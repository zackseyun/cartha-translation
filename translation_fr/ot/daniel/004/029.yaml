id: DAN.4.29
reference: Daniel 4:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מִן אֲנָשָׁ/א֩ לָ֨/ךְ טָֽרְדִ֜ין וְֽ/עִם חֵיוַ֧ת בָּרָ֣/א מְדֹרָ֗/ךְ עִשְׂבָּ֤/א כְ/תוֹרִין֙ לָ֣/ךְ יְטַעֲמ֔וּן וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עלי/ך עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/029.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: fr
  text: Tu seras chassé du milieu des humains[a], et tu habiteras avec les animaux des champs. On te fera manger de l’herbe comme les bœufs, et sept temps[b] passeront sur toi, jusqu’à ce que tu reconnaisses que le Très-Haut règne sur le royaume des humains et qu’il le donne à qui il veut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Humains » désigne ici les êtres humains par opposition aux animaux.
    reason: lexical_alternative
  - marker: b
    text: 'Araméen : « sept temps » ; il peut s’agir de sept années ou, plus généralement, de sept périodes.'
    reason: alternative_reading
lexical_decisions:
- source_word: טָרְדִין
  choice: tu seras chassé
  rationale: La forme araméenne est active à la troisième personne du pluriel (« ils te chasseront »), mais le passif français exprime naturellement l’action subie sans préciser les agents, qui ne sont pas nommés.
- source_word: אֲנָשָׁא
  choice: les humains
  rationale: Le nom désigne ici l’ensemble des êtres humains, par contraste avec les animaux. « Les humains » est précis, naturel et inclusif sans effacer cette opposition.
- source_word: חֵיוַת בָּרָא
  choice: les animaux des champs
  rationale: Cette expression conserve l’image biblique des animaux vivant hors de la société humaine, dans les espaces ouverts.
- source_word: מְדֹרָךְ
  choice: tu habiteras
  rationale: La tournure verbale rend naturellement en français l’expression nominale araméenne « ta demeure sera », sans modifier le sens.
- source_word: עִשְׂבָּא כְתוֹרִין
  choice: de l’herbe comme aux bœufs
  rationale: « Herbe » convient au contexte du pâturage, et « bœufs » conserve l’image précise des bovins.
- source_word: יְטַעֲמוּן
  choice: on te fera manger
  rationale: Le causatif indique que cette alimentation lui sera imposée. Le pronom indéfini « on » rend naturellement les agents non précisés.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sept temps
  rationale: Cette formulation conserve l’indétermination du terme araméen, qui désigne des temps ou périodes sans préciser explicitement leur durée.
- source_word: יַחְלְפוּן עֲלָךְ
  choice: passeront sur toi
  rationale: Le rendu garde l’image araméenne du temps qui passe sur la personne frappée par ce jugement.
- source_word: תִנְדַּע
  choice: tu reconnaisses
  rationale: Dans ce contexte, il ne s’agit pas seulement d’acquérir une information, mais d’en venir à reconnaître par expérience l’autorité du Très-Haut.
- source_word: שַׁלִּיט עִלָּיָא
  choice: le Très-Haut règne
  rationale: La formulation exprime clairement et directement l’exercice actif de la souveraineté divine.
- source_word: בְּמַלְכוּת אֲנָשָׁא
  choice: sur le royaume des humains
  rationale: « Sur » est le complément naturel du verbe français « régner » et exprime ici la domination du Très-Haut sur la royauté ou le domaine politique humain.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: et qu’il le donne à qui il veut
  rationale: Le pronom « le » reprend le royaume, conformément au suffixe féminin araméen qui renvoie à מַלְכוּתָא.
theological_decisions:
- issue: Durée exprimée par עִדָּנִין
  choice: sept temps
  alternative: sept années ; sept périodes
  rationale: Le contexte a souvent conduit à comprendre des années, mais le mot araméen lui-même reste plus général. Le texte principal préserve donc cette indétermination et la note présente les interprétations possibles.
- issue: Portée de la souveraineté du Très-Haut
  choice: règne sur le royaume des humains
  alternative: est souverain dans la royauté humaine
  rationale: Le choix conserve l’affirmation que l’autorité divine s’exerce sur le pouvoir humain, sans préciser davantage la manière théologique dont cette souveraineté opère.
- issue: Sens de תִנְדַּע
  choice: tu reconnaisses
  alternative: tu saches ; tu apprennes
  rationale: « Reconnaître » rend la prise de conscience imposée par l’expérience du jugement, sans ajouter l’idée plus forte de repentance ou de confession volontaire.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement suit l’adresse directe au roi. Les expressions « animaux des champs », « bœufs » et « sept temps » maintiennent l’imagerie et l’ambiguïté du texte araméen, tandis que la syntaxe reste naturelle en français.
