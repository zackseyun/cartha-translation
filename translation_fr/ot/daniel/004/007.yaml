  text: וְ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י חָזֵ֣ה הֲוֵ֔ית וַ/אֲל֥וּ אִילָ֛ן בְּ/ג֥וֹא אַרְעָ֖/א וְ/רוּמֵ֥/הּ שַׂגִּֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/007.yaml
  text: 'These were the visions of my head as I lay on my bed: and behold[a], a tree in the midst of the earth, and its height was great.'
translation:
  language: fr
  text: 'Voici les visions de mon esprit[a], tandis que j’étais couché sur mon lit et que je regardais : voici, il y avait un arbre au milieu de la terre, et sa hauteur était grande.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Araméen, littéralement : « les visions de ma tête ». Cette expression désigne les visions ou perceptions intérieures du rêveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: Voici les visions qui se présentaient à mon esprit
  rationale: L’expression araméenne signifie littéralement « les visions de ma tête ». La formulation française conserve l’idée de perceptions intérieures tout en restant naturelle; « Voici » introduit le contenu de la vision dans une phrase française complète.
- source_word: עַל מִשְׁכְּבִי
  choice: tandis que j’étais couché sur mon lit
  rationale: Rend idiomatiquement le cadre temporel exprimé par « sur mon lit », sans suggérer que les visions se trouvaient physiquement sur le lit.
- source_word: חָזֵה הֲוֵית
  choice: je regardais
  rationale: 'La construction périphrastique formée du participe et de הוה exprime une action en cours : « j’étais en train de regarder ». L’imparfait français en restitue naturellement l’aspect.'
- source_word: וַאֲלוּ
  choice: et voici que
  rationale: Conserve la particule déictique qui attire l’attention sur l’apparition soudaine de l’arbre dans la vision.
- source_word: אִילָן
  choice: un arbre
  rationale: Équivalent direct du nom araméen, avec l’article indéfini requis lors de la première mention.
- source_word: בְּגוֹא אַרְעָא
  choice: au milieu de la terre
  rationale: Préserve le sens spatial de בְּגוֹא et retient « terre » plutôt que « pays », conformément à la portée étendue de la vision.
- source_word: וְרוּמֵהּ שַׂגִּיא
  choice: et sa hauteur était immense
  rationale: Conserve le substantif « hauteur » et rend שַׂגִּיא par un adjectif français naturel exprimant une grandeur exceptionnelle, sans ajouter de mesure précise.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait maintient le caractère progressif de la scène, tandis que « et voici que » en conserve la force visionnaire et narrative.
