  text: בֵּ/אדַ֣יִן עללין חַרְטֻמַיָּ/א֙ אָֽשְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א וְ/חֶלְמָ֗/א אָמַ֤ר אֲנָה֙ קֳדָ֣מֵי/ה֔וֹן וּ/פִשְׁרֵ֖/הּ לָא מְהוֹדְעִ֥ין לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/004.yaml
  text: Then the magicians[a], enchanters, Chaldeans, and diviners came in, and I told the dream before them[b], but they did not make its interpretation known to me.
translation:
  language: fr
  text: Alors les magiciens, les enchanteurs, les Chaldéens[a] et les devins entrèrent. Je racontai le rêve devant eux, mais ils ne m’en firent pas connaître l’interprétation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Chaldéens » peut désigner non seulement un groupe ethnique, mais aussi une catégorie de spécialistes de la cour babylonienne.
    reason: cultural_note
  - marker: b
    text: 'Ou, selon ce que le contexte peut laisser entendre : « ils ne purent pas m’en faire connaître l’interprétation ». L’araméen dit directement qu’ils ne la firent pas connaître; l’incapacité est une déduction contextuelle adoptée par certaines traductions.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Alors
  rationale: Ce marqueur araméen fait progresser le récit. « Alors » est naturel en français moderne et exprime clairement la succession des événements.
- source_word: עללין
  choice: entrèrent
  rationale: Le verbe désigne l’entrée ou la présentation de ces spécialistes devant le roi. « Entrèrent » convient au cadre de la cour sans ajouter de détail absent du texte.
- source_word: חַרְטֻמַיָּא
  choice: magiciens
  rationale: Le terme désigne une catégorie de sages babyloniens associés aux arts secrets. « Magiciens » est l’équivalent français traditionnel, clair et contextuellement approprié.
- source_word: אָשְׁפַיָּא
  choice: enchanteurs
  rationale: Le mot désigne une autre catégorie de spécialistes des pratiques occultes ou incantatoires. « Enchanteurs » la distingue des magiciens et des devins tout en restant intelligible.
- source_word: כשדי/א
  choice: Chaldéens
  rationale: Le terme est conservé sous sa forme historique, comme dans l’araméen. Dans cette liste de cour, il peut désigner une classe de spécialistes plutôt que seulement un peuple; cette possibilité est signalée en note.
- source_word: גָזְרַיָּא
  choice: devins
  rationale: Dans ce contexte, le terme renvoie à des praticiens de la divination. « Devins » est concis, courant et distinct des autres groupes nommés.
- source_word: חֶלְמָא
  choice: le rêve
  rationale: L’état emphatique et le contexte désignent le rêve précis du roi, d’où l’article défini.
- source_word: אָמַר אֲנָה קֳדָמֵיהוֹן
  choice: Je racontai le rêve devant eux
  rationale: « Racontai » rend naturellement l’idée de rapporter le contenu du rêve, tandis que « devant eux » conserve la mention explicite de leur présence.
- source_word: וּפִשְׁרֵהּ
  choice: l’interprétation
  rationale: Dans Daniel, ce nom est le terme technique employé pour l’interprétation des rêves et des mystères. « Interprétation » est donc plus précis que le simple « sens ».
- source_word: לָא מְהוֹדְעִין לִי
  choice: ils ne m’en firent pas connaître l’interprétation
  rationale: La forme causative signifie « faire connaître, informer ». La traduction exprime la non-communication constatée sans introduire explicitement une incapacité que l’araméen ne formule pas.
theological_decisions:
- issue: La dernière proposition exprime-t-elle une incapacité ou seulement le fait que l’interprétation n’a pas été communiquée?
  choice: « ils ne m’en firent pas connaître l’interprétation »
  alternative: « ils ne purent pas m’en faire connaître l’interprétation »
  rationale: L’araméen nie directement l’action de faire connaître; il ne contient pas de verbe modal signifiant « pouvoir ». Le contexte peut laisser entendre une incapacité, mais le texte ne l’affirme pas explicitement. La formulation retenue préserve cette réserve.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les quatre catégories distinctes de spécialistes et la nuance littérale de la dernière proposition. Les marqueurs de notes ont été placés auprès des expressions auxquelles les notes se rapportent.
