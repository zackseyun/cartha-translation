id: DAN.4.5
reference: Daniel 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַ֣ד אָחֳרֵ֡ין עַל֩ קָֽדָמַ֨/י דָּנִיֵּ֜אל דִּֽי שְׁמֵ֤/הּ בֵּלְטְשַׁאצַּר֙ כְּ/שֻׁ֣ם אֱלָהִ֔/י וְ/דִ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בֵּ֑/הּ וְ/חֶלְמָ֖/א קָֽדָמ֥וֹ/הִי אַמְרֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/005.yaml
  text: 'At last Daniel came in before me—he whose name was Belteshazzar[a], after the name of my god, and in whom is the spirit of the holy gods—and I told the dream before him:'
translation:
  language: fr
  text: 'Et enfin, Daniel se présenta devant moi, lui dont le nom était Belteshatsar, d’après le nom de mon dieu, et en qui réside l’esprit des dieux saints[a] ; je lui exposai le rêve :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « l’Esprit du Dieu saint » ou « l’esprit du Dieu saint ». L’araméen peut être compris de plusieurs manières, mais, dans la bouche du roi, « l’esprit des dieux saints » reflète le plus naturellement sa perspective polythéiste.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַד אָחֳרֵין
  choice: Finalement
  rationale: Cette expression temporelle indique que Daniel se présente en dernier, après les autres sages. « Finalement » rend naturellement l’idée sans accentuer indûment l’impatience.
- source_word: עַל קָדָמַי
  choice: se présenta devant moi
  rationale: La tournure conserve à la fois le mouvement vers le roi et la nuance d’une comparution en sa présence.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: lui qui s’appelait Beltshatsar
  rationale: La proposition relative identifie Daniel par son nom babylonien; cette formulation est naturelle en français tout en gardant sa valeur explicative.
- source_word: כְּשֻׁם אֱלָהִי
  choice: d’après le nom de mon dieu
  rationale: La préposition exprime ici une correspondance de nom. La formulation reste proche de l’araméen et préserve le point de vue du roi.
- source_word: וְדִי רוּחַ אֱלָהִין קַדִּישִׁין בֵּהּ
  choice: et en qui réside l’esprit des dieux saints
  rationale: Le pluriel araméen אֱלָהִין, accompagné de l’adjectif pluriel קַדִּישִׁין, est rendu au pluriel dans le discours du roi. « Réside » exprime idiomatiquement la présence de cet esprit en Daniel sans l’identifier explicitement à l’Esprit Saint.
- source_word: וְחֶלְמָא קָדָמוֹהִי אַמְרֵת
  choice: Je racontai le rêve en sa présence
  rationale: La traduction conserve le rêve comme objet du verbe et rend explicitement la locution de présence, au lieu de la réduire à un simple complément indirect.
theological_decisions:
- issue: Interprétation de רוּחַ אֱלָהִין קַדִּישִׁין dans les paroles de Nabuchodonosor
  choice: l’esprit des dieux saints
  alternative: l’Esprit du Dieu saint; l’esprit du Dieu saint
  rationale: Le substantif אֱלָהִין et son adjectif קַדִּישִׁין ont ici une forme plurielle, et le contexte est celui du discours d’un roi polythéiste. Le texte principal préserve donc cette perspective sans la transformer en confession monothéiste. Une note maintient toutefois les lectures singulières possibles, puisque la forme אֱלָהִין peut, dans certains contextes, désigner le Dieu unique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La phrase conserve le cadre de cour par « se présenta devant moi » et « en sa présence ». Le deux-points final introduit la suite du discours.
