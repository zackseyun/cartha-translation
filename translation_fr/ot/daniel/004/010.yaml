id: DAN.4.10
reference: Daniel 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוֵ֥י רֵאשִׁ֖/י עַֽל מִשְׁכְּבִ֑/י וַ/אֲלוּ֙ עִ֣יר וְ/קַדִּ֔ישׁ מִן שְׁמַיָּ֖/א נָחִֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/010.yaml
  text: I was looking in the visions of my head as I lay on my bed[a], and behold, a watcher, a holy one, came down from heaven.
translation:
  language: fr
  text: Je regardais les visions de mon esprit tandis que j’étais couché sur mon lit. Et voici qu’un veilleur, un saint[a], descendit du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un veilleur céleste » ; l’araméen dit littéralement « un veilleur, un saint ».
    reason: Alternative lexicale signalant la nature céleste possible de l’être sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: Je contemplais
  rationale: La construction périphrastique exprime une perception en cours dans le passé. « Je contemplais » restitue cette durée dans un français naturel et digne.
- source_word: בְּחֶזְוֵי רֵאשִׁי
  choice: les visions de mon esprit
  rationale: L’expression araméenne signifie littéralement « les visions de ma tête ». « De mon esprit » conserve l’idée de visions intérieures sans produire en français une formulation artificielle.
- source_word: עַל מִשְׁכְּבִי
  choice: tandis que j’étais couché sur mon lit
  rationale: Cette formulation rend à la fois le lieu et la circonstance temporelle indiqués par l’araméen.
- source_word: וַאֲלוּ
  choice: Et voici que
  rationale: Cette tournure française attire l’attention sur l’apparition soudaine qui suit, comme la particule araméenne.
- source_word: עִיר
  choice: un veilleur
  rationale: Le terme désigne littéralement un être qui veille. Le choix conserve cette désignation particulière au lieu de la réduire au terme plus général « ange ».
- source_word: וְקַדִּישׁ
  choice: un saint
  rationale: L’adjectif substantivé qualifie le même être en apposition à « veilleur ». La ponctuation préserve cette relation sans la préciser davantage.
- source_word: מִן שְׁמַיָּא
  choice: du ciel
  rationale: Bien que la forme araméenne soit morphologiquement plurielle, le singulier « ciel » est l’équivalent français idiomatique dans ce contexte.
- source_word: נָחִת
  choice: descendit
  rationale: Le passé simple exprime nettement l’événement aperçu dans la vision et maintient un registre narratif digne.
theological_decisions:
- issue: Identité de עִיר וְקַדִּישׁ
  choice: un veilleur, un saint
  alternative: un ange ; un messager céleste ; un veilleur angélique
  rationale: Le texte emploie une désignation particulière et ne nomme pas explicitement un ange. La traduction littérale préserve l’identité ouverte du personnage tout en laissant le contexte céleste orienter la compréhension.
translation_notes:
  register: Français international actuel, clair et digne. L’imparfait rend la contemplation continue, tandis que le passé simple marque l’apparition dans la vision. « Visions de mon esprit » adapte avec retenue l’idiome araméen « visions de ma tête ».
