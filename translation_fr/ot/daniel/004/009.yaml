base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/009.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field found shade, and in its branches the birds of the heavens dwelt, and from it all flesh was fed.
translation:
  language: fr
  text: Son feuillage était beau et son fruit abondant ; il contenait de la nourriture pour tous. Sous lui, les animaux des champs trouvaient de l’ombre ; dans ses branches habitaient les oiseaux du ciel, et toute chair se nourrissait de lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les êtres vivants ». L’araméen dit littéralement « toute chair », expression biblique qui désigne ici l’ensemble des êtres animés.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: son feuillage
  rationale: Le terme araméen désigne collectivement la couverture feuillue de l’arbre ; « feuillage » est précis et naturel en français.
- source_word: שַׁפִּיר
  choice: était beau
  rationale: Rend directement l’idée de beauté exprimée par l’adjectif araméen, dans une formulation française simple.
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: son fruit abondant
  rationale: « Fruit » correspond au produit de l’arbre, et « abondant » exprime ici la grandeur sous l’angle de la quantité.
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: il y avait en lui de la nourriture pour tous
  rationale: Cette formulation conserve les éléments « nourriture », « pour tous » et « en lui », tout en adoptant une syntaxe française naturelle.
- source_word: תַּטְלֵל חֵיוַת בָּרָא
  choice: les animaux des champs trouvaient de l’ombre
  rationale: Le verbe évoque l’ombre ou l’abri ; « trouvaient de l’ombre » convient au contexte. « Animaux des champs » préserve l’expression biblique sans l’archaïsme de « bêtes ».
- source_word: בְעַנְפוֹהִי ידרון צִפֲּרֵי שְׁמַיָּא
  choice: dans ses branches habitaient les oiseaux du ciel
  rationale: « Habitaient » garde le sens général de demeurer ou loger sans préciser indûment qu’ils y nichaient.
- source_word: וּמִנֵּהּ יִתְּזִין כָּל בִּשְׂרָא
  choice: et de lui se nourrissait toute chair
  rationale: La tournure pronominale rend naturellement le passif araméen tout en conservant l’image de la nourriture provenant de l’arbre et l’idiome « toute chair ».
theological_decisions:
- issue: Sens de l’expression כָּל בִּשְׂרָא
  choice: toute chair
  alternative: tous les êtres vivants
  rationale: « Toute chair » préserve un idiome biblique riche d’échos intertextuels. Une note en explicite le sens inclusif afin d’éviter qu’il soit compris comme désignant seulement l’humanité.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme descriptif et le parallélisme du texte araméen sont conservés, avec une ponctuation qui clarifie les trois groupes d’êtres nourris ou abrités par l’arbre.
