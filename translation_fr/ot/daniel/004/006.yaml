  revision_rationale: La révision rétablit « son interprétation », afin de refléter le suffixe singulier araméen et son rattachement naturel au rêve. Elle conserve le pluriel théologiquement et grammaticalement motivé dans le texte principal, avec la lecture singulière en note.
