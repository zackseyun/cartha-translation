source:
  edition: WLC
  text: בֵּלְטְשַׁאצַּר֮ רַ֣ב חַרְטֻמַיָּ/א֒ דִּ֣י אֲנָ֣ה יִדְעֵ֗ת דִּ֠י ר֣וּחַ אֱלָהִ֤ין קַדִּישִׁין֙ בָּ֔/ךְ וְ/כָל רָ֖ז לָא אָנֵ֣ס לָ֑/ךְ חֶזְוֵ֨י חֶלְמִ֧/י דִֽי חֲזֵ֛ית וּ/פִשְׁרֵ֖/הּ אֱמַֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/006.yaml
  text: Belteshazzar[a], chief of the magicians, whom I know has the spirit of the holy gods in you, and no mystery is too difficult for you, tell me the visions of my dream that I saw, and its interpretation.
translation:
  language: fr
  text: Belteshatsar[a], chef des magiciens, je sais que l’esprit des dieux saints est en toi et qu’aucun mystère n’est trop difficile pour toi. Dis-moi les visions de mon rêve que j’ai vues, ainsi que son interprétation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Esprit du Dieu saint » ou « l’esprit du Dieu saint ».'
    reason: Lecture alternative de רוּחַ אֱלָהִין קַדִּישִׁין, expression dont la morphologie favorise le pluriel mais qui peut être comprise comme une référence singulière à Dieu.
lexical_decisions:
- source_word: רַב חַרְטֻמַיָּא
  choice: chef des magiciens
  rationale: Dans Daniel, חַרְטֻמַיָּא désigne une catégorie de sages de la cour babylonienne, couramment appelés « magiciens »; רַב indique que Daniel en est le chef.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: l’esprit des dieux saints
  rationale: Le pluriel morphologique de אֱלָהִין et de קַדִּישִׁין, ainsi que le point de vue de Nabuchodonosor, favorisent cette lecture, sans exclure la lecture singulière signalée en note.
- source_word: וְכָל רָז לָא אָנֵס לָךְ
  choice: aucun mystère n’est trop difficile pour toi
  rationale: רָז désigne un mystère ou une réalité cachée; l’expression idiomatique indique qu’aucun mystère ne dépasse la capacité de Daniel.
- source_word: חֶזְוֵי חֶלְמִי דִי חֲזֵית
  choice: les visions que j’ai eues dans mon rêve
  rationale: Cette formulation naturelle conserve le pluriel « visions » et leur rattachement au rêve, tout en rendant idiomatiquement l’expérience visionnaire.
- source_word: וּפִשְׁרֵהּ אֱמַר
  choice: et leur interprétation. Dis-moi
  rationale: פִּשְׁרֵהּ est le terme technique pour l’interprétation du rêve. En français, l’antécédent immédiat pluriel « visions » appelle naturellement « leur », tandis que l’impératif אֱמַר est rendu par « Dis-moi ».
theological_decisions:
- issue: Faut-il comprendre רוּחַ אֱלָהִין קַדִּישִׁין comme une expression polythéiste au pluriel ou comme une référence singulière à Dieu ?
  choice: l’esprit des dieux saints
  alternative: l’Esprit du Dieu saint ; l’esprit du Dieu saint
  rationale: Le locuteur est Nabuchodonosor et l’accord pluriel favorise la lecture « dieux saints ». La note conserve néanmoins la lecture singulière possible et sa distinction entre « Esprit » et « esprit ».
translation_notes:
  register: Français international moderne, clair et digne. L’adresse directe est ponctuée en deux phrases pour éviter une syntaxe lourde. Le nom araméen est transcrit « Belteshatsar » afin de distinguer Daniel de Belshatsar.
