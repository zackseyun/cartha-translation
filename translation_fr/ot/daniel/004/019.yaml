id: DAN.4.19
reference: Daniel 4:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אנתה ה֣וּא מַלְכָּ֔/א דִּ֥י רְבַ֖ית וּ/תְקֵ֑פְתְּ וּ/רְבוּתָ֤/ךְ רְבָת֙ וּ/מְטָ֣ת לִ/שְׁמַיָּ֔/א וְ/שָׁלְטָנָ֖/ךְ לְ/ס֥וֹף אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/019.yaml
  text: You are the king[a], who has grown great and strong; your greatness has become great and reached to heaven, and your dominion to the end of the earth.
translation:
  language: fr
  text: C’est toi, le roi, qui es devenu grand et puissant. Ta grandeur s’est accrue et a atteint le ciel, et ta domination s’est étendue jusqu’à l’extrémité de la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’aux extrémités de la terre ».
    reason: Variante lexicale et idiomatique possible pour le singulier araméen.
lexical_decisions:
- source_word: אַנְתָּה הוּא
  choice: C’est toi
  rationale: La tournure emphatique identifie directement le roi à l’arbre du rêve; « C’est toi » restitue naturellement cette insistance en français.
- source_word: מַלְכָּא
  choice: le roi
  rationale: La forme déterminée appartient à l’énoncé d’identification. « Le roi » convient mieux ici que le vocatif « ô roi ».
- source_word: דִּי
  choice: qui
  rationale: La particule relative introduit la description personnelle du roi.
- source_word: רְבַית וּתְקֵפְתְּ
  choice: qui es devenu grand et puissant
  rationale: Les deux verbes expriment l’accession à la grandeur et à la puissance; cette formulation conserve leur valeur dynamique.
- source_word: וּרְבוּתָךְ רְבָת
  choice: Ta grandeur s’est accrue
  rationale: Cette formulation garde le lien lexical avec l’idée de grandeur tout en évitant en français la lourdeur de « ta grandeur est devenue grande ».
- source_word: וּמְטָת לִשְׁמַיָּא
  choice: et a atteint le ciel
  rationale: Le verbe signifie atteindre ou parvenir, et le pluriel araméen peut désigner idiomatiquement le ciel.
- source_word: וְשָׁלְטָנָךְ
  choice: et ta domination
  rationale: « Domination » exprime l’autorité royale et convient au vocabulaire récurrent du livre de Daniel.
- source_word: לְסוֹף אַרְעָא
  choice: jusqu’à l’extrémité de la terre
  rationale: Le singulier reflète étroitement l’araméen; la variante française au pluriel est signalée en note.
theological_decisions:
- issue: Étendue de la domination du roi
  choice: jusqu’à l’extrémité de la terre
  alternative: jusqu’aux extrémités de la terre
  rationale: La formulation conserve l’affirmation universelle et son caractère possible d’hyperbole royale sans décider si elle décrit une maîtrise politique strictement mondiale ou l’immense portée de l’empire.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’identification emphatique est conservée, ainsi que la répétition conceptuelle autour de la grandeur. L’ellipse de la dernière proposition est explicitée par « s’est étendue » pour produire une phrase française naturelle.
