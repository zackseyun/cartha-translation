source:
  edition: WLC
  text: לָהֵ֣ן מַלְכָּ֗/א מִלְכִּ/י֙ יִשְׁפַּ֣ר עלי/ך ו/חטי/ך בְּ/צִדְקָ֣ה פְרֻ֔ק וַ/עֲוָיָתָ֖/ךְ בְּ/מִחַ֣ן עֲנָ֑יִן הֵ֛ן תֶּהֱוֵ֥א אַרְכָ֖ה לִ/שְׁלֵוְתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/024.yaml
  text: 'Therefore[a], O king, let my counsel be acceptable to you: break off your sins by righteousness, and your iniquities by showing mercy to the poor[b], that there may perhaps be a prolonging of your prosperity.'
translation:
  language: fr
  text: 'C’est pourquoi, ô roi, que mon conseil te soit agréable : romps avec tes péchés en pratiquant la justice, et avec tes fautes en faisant preuve de compassion envers les pauvres[a]. Peut-être alors ta tranquillité se prolongera-t-elle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rachète tes péchés par la justice, et tes fautes par la compassion envers les pauvres ». Le verbe araméen peut signifier « rompre, se défaire de », mais aussi, selon le contexte, « délivrer, racheter ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ton bien-être » ou « ta prospérité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion que Daniel tire de l’interprétation du rêve.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Conserve l’interpellation vocative et le ton déférent de la cour.
- source_word: מִלְכִּי יִשְׁפַּר עֲלָיִךְ
  choice: que mon conseil te soit agréable
  rationale: Rend l’expression araméenne idiomatique par laquelle Daniel demande au roi d’accueillir favorablement son conseil.
- source_word: וְחֲטָיָךְ בְּצִדְקָה פְרֻק
  choice: romps avec tes péchés en pratiquant la justice
  rationale: « Rompre avec » exprime une cessation résolue sans imposer le sens théologique de « racheter »; « en pratiquant la justice » rend concrètement la conduite juste visée par צִדְקָה.
- source_word: וַעֲוָיָתָךְ
  choice: tes fautes
  rationale: Préserve une légère variation par rapport à « péchés » tout en exprimant la conduite coupable.
- source_word: בְּמִחַן עֲנָיִן
  choice: en faisant preuve de compassion envers les pauvres
  rationale: Exprime en français naturel l’action bienveillante et compatissante envers les pauvres ou les affligés.
- source_word: הֵן תֶּהֱוֵא אַרְכָה
  choice: Peut-être alors … se prolongera-t-elle
  rationale: Conserve le caractère contingent, et non certain, de la perspective annoncée.
- source_word: לִשְׁלֵוְתָךְ
  choice: ta tranquillité
  rationale: Rend directement l’idée de quiétude, d’aisance ou de prospérité paisible, sans la limiter au seul domaine matériel.
theological_decisions:
- issue: Le verbe פְרֻק implique-t-il le rachat des péchés par des œuvres méritoires, ou l’abandon du péché manifesté par une conduite juste ?
  choice: romps avec tes péchés
  alternative: rachète tes péchés
  rationale: Le contexte appelle le roi à abandonner concrètement sa conduite pécheresse. La traduction principale évite d’affirmer que les œuvres expient par elles-mêmes la faute, tout en signalant en note l’autre valeur lexicale possible.
- issue: La prolongation de la tranquillité est-elle certaine ou seulement possible ?
  choice: Peut-être alors ta tranquillité se prolongera-t-elle
  alternative: afin que ta tranquillité se prolonge
  rationale: הֵן introduit une possibilité conditionnelle; la formulation retenue préserve explicitement cette réserve.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au roi dans le passage. La syntaxe garde le respect de Daniel tout en évitant un français excessivement archaïque.
