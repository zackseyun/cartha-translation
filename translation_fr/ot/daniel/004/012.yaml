  revision_rationale: La révision est limitée au complément relatif au fer et au bronze et à sa note. Elle maintient la fidélité lexicale tout en évitant de privilégier sans nécessité l’image d’un cercle autour de la souche plutôt que celle d’une entrave, qui anticipe possiblement le sort du roi.
