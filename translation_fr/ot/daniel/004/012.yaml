source:
  edition: WLC
  text: בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶֽ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֤ל שְׁמַיָּ/א֙ יִצְטַבַּ֔ע וְ/עִם חֵיוְתָ֥/א חֲלָקֵ֖/הּ בַּ/עֲשַׂ֥ב אַרְעָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/012.yaml
  text: Nevertheless[a], leave the stump of its roots in the earth, even with a band of iron and bronze in the grass of the field; and let him be drenched with the dew of heaven, and let his portion be with the beasts in the grass of the earth.
translation:
  language: fr
  text: Cependant, laissez dans la terre la souche avec ses racines, avec un lien de fer et de bronze[a], au milieu de l’herbe des champs. Qu’il soit trempé de la rosée du ciel et qu’il ait sa part avec les bêtes dans l’herbe de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : avec une entrave de fer et de bronze.'
    reason: Le terme araméen peut désigner un lien ou une entrave; la traduction principale conserve cette ambiguïté sans préciser qu’il s’agit nécessairement d’un cercle entourant la souche.
lexical_decisions:
- source_word: בְּרַם
  choice: Cependant
  rationale: La particule adversative introduit l’exception à l’ordre d’abattre l’arbre. « Cependant » exprime clairement ce contraste dans un registre digne et actuel.
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: la souche avec ses racines
  rationale: L’expression désigne la base enracinée qui demeure après l’abattage. Cette formulation française rend naturellement à la fois la souche visible et les racines qui subsistent.
- source_word: בְּאַרְעָא
  choice: dans la terre
  rationale: 'Le sens est ici local et agricole : la souche reste dans le sol.'
- source_word: שְׁבֻקוּ
  choice: laissez
  rationale: L’impératif pluriel exprime un ordre adressé aux agents chargés d’abattre l’arbre.
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: entourée d’un lien de fer et de bronze
  rationale: אֱסוּר peut désigner ce qui lie ou retient. « Lien » conserve cette portée sans décider s’il s’agit surtout d’un cercle autour de la souche ou d’une entrave évoquant déjà le roi. « Bronze » convient au contexte métallurgique ancien.
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: au milieu de l’herbe des champs
  rationale: La locution situe la souche parmi la végétation de la campagne ouverte; « herbe des champs » garde l’image concrète et reste idiomatique.
- source_word: וּבְטַל שְׁמַיָּא יִצְטַבַּע
  choice: Qu’il soit trempé de la rosée du ciel
  rationale: Le masculin personnel reproduit le passage intentionnel de l’arbre symbolique au roi représenté. « Trempé » rend avec force la forme passive du verbe.
- source_word: וְעִם חֵיוְתָא חֲלָקֵהּ
  choice: qu’il ait sa part avec les bêtes
  rationale: La formulation conserve l’idée de part ou de lot et le registre du décret, tandis que « bêtes » convient aux animaux vivant en plein champ.
- source_word: בַּעֲשַׂב אַרְעָא
  choice: dans l’herbe de la terre
  rationale: La traduction maintient l’image de l’abaissement parmi la végétation terrestre et distingue cette expression de « l’herbe des champs » qui précède.
theological_decisions:
- issue: Passage de l’image de l’arbre à la personne qu’elle représente
  choice: 'Employer le masculin personnel : « Qu’il soit trempé… qu’il ait sa part… »'
  alternative: 'Poursuivre au féminin avec la souche : « Qu’elle soit trempée… »'
  rationale: L’araméen passe explicitement du référent végétal au référent humain. Conserver ce changement respecte la tension symbolique de la vision et prépare son application au roi.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le ton impératif du décret ainsi que le brusque passage du féminin implicite de la souche au masculin personnel du roi.
