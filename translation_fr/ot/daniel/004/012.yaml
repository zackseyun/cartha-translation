    issue: « entourée d’un lien » surinterprète le rapport du lien à la souche.
    rationale: L’araméen dit littéralement que la souche est laissée « avec un lien/une entrave de fer et de bronze »; il ne précise pas explicitement qu’elle est entourée. Conserver « avec » préserve l’ambiguïté pertinente, également reconnue par la note.
  revised_text: Cependant, laissez dans la terre la souche avec ses racines, avec un lien de fer et de bronze[a], au milieu de l’herbe des champs. Qu’il soit trempé de la rosée du ciel et qu’il ait sa part avec les bêtes dans l’herbe de la terre.
