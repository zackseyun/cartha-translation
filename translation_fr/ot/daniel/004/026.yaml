  text: Au bout de douze mois, il marchait sur le palais royal de Babylone[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’araméen dit littéralement « sur le palais du royaume de Babylone » ; l’expression peut désigner le toit ou une partie élevée du palais.
