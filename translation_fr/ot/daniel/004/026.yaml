lexical_decisions:
- source_word: לִקְצָת
  choice: Au bout de
  rationale: Dans cette construction temporelle, le terme marque l’achèvement d’une période. « Au bout de » est naturel en français et conserve ce sens.
- source_word: יַרְחִין תְּרֵי עֲשַׂר
  choice: douze mois
  rationale: L’araméen désigne explicitement douze mois; le rendre par « un an » serait une compression interprétative.
- source_word: עַל הֵיכַל
  choice: sur le toit du palais
  rationale: L’expression dit littéralement « sur le palais ». Dans ce contexte de déplacement, elle désigne vraisemblablement le toit ou la partie supérieure du palais; cette explicitation naturelle est signalée en note afin de préserver l’ambiguïté.
- source_word: מַלְכוּתָא דִּי בָבֶל
  choice: royal de Babylone
  rationale: Littéralement « du royaume de Babylone ». En français, « palais royal de Babylone » exprime naturellement la fonction du palais et son rattachement à Babylone sans alourdir la phrase.
- source_word: מְהַלֵּךְ הֲוָה
  choice: il se promenait
  rationale: Le participe accompagné du verbe « être » exprime une action en cours. Dans ce cadre palatial, « se promenait » rend idiomatiquement le déplacement continu.
