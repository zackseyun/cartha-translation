  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל דארי אַרְעָ/א֙ כְּ/לָ֣ה חֲשִׁיבִ֔ין וּֽ/כְ/מִצְבְּיֵ֗/הּ עָבֵד֙ בְּ/חֵ֣יל שְׁמַיָּ֔/א ו/דארי אַרְעָ֑/א וְ/לָ֤א אִיתַי֙ דִּֽי יְמַחֵ֣א בִ/ידֵ֔/הּ וְ/יֵ֥אמַר לֵ֖/הּ מָ֥ה עֲבַֽדְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/032.yaml
  text: And all the inhabitants of the earth are regarded as nothing[a], and he does according to his will among the army of heaven and among the inhabitants of the earth; and there is no one who can strike his hand or say to him[b], “What have you done?”
translation:
  language: fr
  text: 'Tous les habitants de la terre sont considérés comme rien, et il agit selon sa volonté parmi l’armée du ciel[a] et parmi les habitants de la terre. Personne ne peut retenir sa main[b] ni lui dire : « Qu’as-tu fait ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi l’armée des cieux » ; l’expression peut désigner collectivement les êtres ou les puissances célestes.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « frapper sa main » ; c’est-à-dire l’empêcher d’agir ou retenir sa main.
    reason: idiom_explanation
lexical_decisions:
- source_word: דארי אַרְעָא
  choice: les habitants de la terre
  rationale: Expression française naturelle qui rend le participe araméen désignant ceux qui habitent la terre et en conserve ici la portée universelle.
- source_word: כְּלָה חֲשִׁיבִין
  choice: sont considérés comme rien
  rationale: Rend l’idée d’évaluation ou de compte sans suggérer que les habitants n’existent pas.
- source_word: וּכְמִצְבְּיֵהּ
  choice: selon sa volonté
  rationale: Conserve le sens de volonté, désir ou bon plaisir dans une formulation française claire et digne.
- source_word: עָבֵד
  choice: il agit
  rationale: « Agit » est plus naturel ici que « fait » employé absolument, tout en rendant directement le verbe araméen.
- source_word: בְּחֵיל שְׁמַיָּא
  choice: parmi l’armée du ciel
  rationale: Préserve l’image collective et militaire de חֵיל sans préciser s’il s’agit des anges ou des corps célestes.
- source_word: וְלָא אִיתַי דִּי
  choice: Personne ne peut
  rationale: Formulation idiomatique qui exprime clairement l’absence de quiconque capable d’entraver l’action décrite.
- source_word: יְמַחֵא בִידֵהּ
  choice: frapper sa main
  rationale: Conserve dans le texte l’image vive et littérale de l’araméen; la note en donne le sens idiomatique probable.
- source_word: מָה עֲבַדְתְּ
  choice: Qu’as-tu fait ?
  rationale: Le passé composé rend naturellement l’accompli araméen et maintient la force du défi rhétorique.
theological_decisions:
- issue: Référent de l’acteur souverain
  choice: Conserver le pronom « il »
  alternative: Expliciter « Dieu » ou « le Très-Haut »
  rationale: Le contexte immédiat identifie le Très-Haut, mais le verset emploie un pronom; la traduction laisse donc le contexte fournir le référent.
- issue: Identité de l’armée du ciel
  choice: Traduction générique « l’armée du ciel »
  alternative: Préciser les anges ou les corps célestes
  rationale: L’expression araméenne ne tranche pas explicitement entre ces référents; la traduction préserve cette amplitude.
- issue: Sens de l’expression « frapper sa main »
  choice: Maintenir l’image littérale dans le texte et expliquer l’idiome en note
  alternative: Traduire directement « retenir sa main » ou « l’empêcher d’agir »
  rationale: Ce choix préserve l’image source sans cacher son sens contextuel d’empêchement ou de contrainte.
translation_notes:
  register: Français international moderne, clair et digne. La coordination solennelle du texte araméen est conservée, tandis que « il agit » et « Personne ne peut » assurent une lecture naturelle.
