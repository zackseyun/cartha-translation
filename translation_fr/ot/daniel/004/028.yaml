source:
  edition: WLC
  text: ע֗וֹד מִלְּתָ/א֙ בְּ/פֻ֣ם מַלְכָּ֔/א קָ֖ל מִן שְׁמַיָּ֣/א נְפַ֑ל לָ֤/ךְ אָֽמְרִין֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א מַלְכוּתָ֖/ה עֲדָ֥ת מִנָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/028.yaml
  text: 'While the word was still in the king’s mouth[a], a voice fell from heaven: “To you it is said, King Nebuchadnezzar, the kingdom has departed from you.”'
translation:
  language: fr
  text: 'Alors que la parole était encore dans la bouche du roi, une voix tomba du ciel : « On te le déclare, roi Nabuchodonosor : le royaume t’a quitté[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le royaume t’a été retiré ».

      '
    reason: 'Variante lexicale et syntaxique possible pour עֲדָת מִנָּךְ : le texte présente le royaume comme ayant quitté le roi, tandis que le contexte permet aussi de l’exprimer au passif.'
lexical_decisions:
- source_word: עוֹד
  choice: alors que… encore
  rationale: Avec la proposition qui suit, le terme marque une action encore en cours au moment où elle est interrompue.
- source_word: מִלְּתָא
  choice: la parole
  rationale: Le nom désigne ici les paroles que le roi venait de prononcer; « parole » garde la concision et la dignité du texte.
- source_word: בְּפֻם מַלְכָּא
  choice: dans la bouche du roi
  rationale: La formulation conserve l’image araméenne, compréhensible en français, selon laquelle le roi n’avait pas encore fini de parler.
- source_word: קָל
  choice: une voix
  rationale: Le discours direct qui suit montre qu’il s’agit d’une voix articulée et non d’un simple bruit.
- source_word: מִן שְׁמַיָּא
  choice: du ciel
  rationale: Dans cette annonce de jugement divin, le singulier collectif français « ciel » rend naturellement le domaine céleste.
- source_word: נְפַל
  choice: tomba
  rationale: Le verbe signifie littéralement « tomber »; cette traduction préserve l’image vive et inhabituelle de la voix qui tombe du ciel.
- source_word: לָךְ אָמְרִין
  choice: On te le déclare
  rationale: Le participe pluriel a une valeur impersonnelle. La tournure française conserve cette indétermination tout en exprimant le caractère solennel de l’annonce.
- source_word: נְבוּכַדְנֶצַּר מַלְכָּא
  choice: roi Nabuchodonosor
  rationale: L’ordre titre-nom est naturel en français et maintient la valeur vocative.
- source_word: מַלְכוּתָה
  choice: le royaume
  rationale: Le terme peut désigner le royaume, la royauté ou le pouvoir royal; « le royaume » convient directement au contexte sans exclure l’idée de domination royale.
- source_word: עֲדָת מִנָּךְ
  choice: s’est retiré de toi
  rationale: Cette formulation conserve l’image première d’un royaume qui s’éloigne ou passe loin du roi, sans transformer explicitement le verbe en passif; la possibilité d’un retrait subi est signalée en note.
theological_decisions:
- issue: Nature du « ciel » dans l’annonce
  choice: du ciel
  alternative: des cieux / du firmament
  rationale: Le contexte présente une sentence divine; « du ciel » conserve cette portée théologique sans réduire l’expression à un phénomène météorologique.
- issue: Manière dont le royaume est perdu
  choice: le royaume s’est retiré de toi
  alternative: le royaume t’a été retiré
  rationale: Le texte araméen exprime d’abord le départ ou l’éloignement du royaume. Le corps du texte préserve cette formulation, tandis que la note donne la lecture passive contextuellement plausible sans imposer grammaticalement l’agent.
translation_notes:
  register: Français international actuel, sobre et solennel. L’image « dans la bouche du roi » et le verbe « tomba » sont volontairement conservés pour refléter la vigueur de l’araméen, tandis que « On te le déclare » rend naturellement sa construction impersonnelle.
