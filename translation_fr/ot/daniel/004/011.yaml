base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/011.yaml
  text: 'He cried aloud and said thus: ‘Chop down the tree[a], and cut off its branches; strip off its foliage, and scatter its fruit. Let the beasts flee from beneath it[b], and the birds from its branches.’'
translation:
  language: fr
  text: 'Il cria d’une voix forte et dit : « Abattez l’arbre[a] et coupez ses branches ; ôtez son feuillage et dispersez ses fruits. Que les bêtes s’enfuient de sous l’arbre[b], et les oiseaux de ses branches ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Coupez l’arbre. »'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est elliptique en araméen : il faut comprendre que les oiseaux doivent eux aussi s’enfuir de ses branches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרֵא בְחַיִל
  choice: Il cria d’une voix forte
  rationale: L’expression araméenne signifie littéralement appeler avec force ; cette formulation française rend naturellement une proclamation puissante et sonore.
- source_word: וְכֵן אָמַר
  choice: et dit
  rationale: כֵן introduit ici les paroles qui suivent. En français, les deux-points remplissent naturellement la fonction de « ainsi », sans alourdir la phrase.
- source_word: גֹּדּוּ אִילָנָא
  choice: Abattez l’arbre
  rationale: Le verbe commande de faire tomber l’arbre en le coupant. « Abattez » est précis, énergique et idiomatique.
- source_word: וְקַצִּצוּ עַנְפוֹהִי
  choice: et coupez ses branches
  rationale: Le verbe désigne l’action de couper ou retrancher ; cette traduction reste claire et distincte de l’abattage de l’arbre entier.
- source_word: אַתַּרוּ עָפְיֵהּ
  choice: arrachez son feuillage
  rationale: Le premier terme exprime l’enlèvement, tandis que עָפְיֵהּ désigne l’ensemble des feuilles. « Feuillage » en conserve le sens collectif.
- source_word: וּבַדַּרוּ אִנְבֵּהּ
  choice: et dispersez ses fruits
  rationale: Le verbe signifie disperser ou éparpiller. Le pluriel français « fruits » convient naturellement au produit collectif de l’arbre.
- source_word: תְּנֻד חֵיוְתָא מִן תַּחְתּוֹהִי
  choice: Que les bêtes s’enfuient de dessous lui
  rationale: Dans cette scène de destruction, le verbe exprime l’éloignement soudain. « De dessous lui » conserve le rapport spatial avec l’arbre.
- source_word: וְצִפְּרַיָּא מִן עַנְפוֹהִי
  choice: et les oiseaux, de ses branches
  rationale: La proposition finale est sans verbe en araméen et dépend du verbe précédent. L’ellipse française, marquée par une virgule, préserve cette structure tout en restant compréhensible.
theological_decisions:
- issue: Valeur impérative et jussive de la proclamation
  choice: Traduire directement les impératifs et rendre le jussif par « Que les bêtes s’enfuient », tout en conservant l’ellipse pour les oiseaux.
  alternative: Répéter explicitement « que les oiseaux s’enfuient de ses branches ».
  rationale: La succession araméenne passe d’impératifs à un jussif, puis à une proposition parallèle sans verbe. La formulation choisie communique l’ordre tout en préservant l’ellipse authentique du texte.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs sont vigoureux sans être archaïques ; la ponctuation rend explicite l’enchaînement tout en conservant l’ellipse finale du texte araméen.
