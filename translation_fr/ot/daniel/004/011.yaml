  to: 'Il cria d’une voix forte et dit : « Abattez l’arbre[a] et coupez ses branches ; ôtez son feuillage et dispersez ses fruits. Que les bêtes s’enfuient de sous l’arbre[b], et les oiseaux de ses branches ! »'
  rationale: Révision limitée à deux améliorations de français moderne. Le remplacement de « de dessous lui » par « de sous l’arbre » supprime une tournure vieillie et évite toute ambiguïté référentielle. « Ôtez son feuillage » traduit naturellement l’enlèvement du feuillage sans renforcer indûment l’image. L’ellipse finale et les deux ancres de note sont conservées.
