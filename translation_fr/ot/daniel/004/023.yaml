  source_fidelity: La source araméenne dit littéralement « ils ont dit », même si le contexte est celui d’un décret. « Ils ont ordonné » renforce donc légèrement le verbe au-delà de sa formulation. מִן־דִּי indique le point temporel à partir duquel la royauté est assurée; « dès que » est possible, mais « à partir du moment où » est plus précis.
  naturalness: La formulation proposée est globalement claire et d’un registre approprié. « Ton royaume te sera conservé » est plus idiomatique que « te sera maintenu », tout en gardant l’idée que le royaume demeure destiné au roi.
  terminology: « La souche de l’arbre avec ses racines » rend bien l’image. « Le Ciel règne » conserve avec justesse la métonymie révérencielle; l’appel de note doit être placé sur cette expression, à laquelle la variante se rapporte.
