  variant: modern international French
source:
  edition: WLC
  text: וְ/דִ֣י אֲמַ֗רוּ לְ/מִשְׁבַּ֞ק עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ דִּ֣י אִֽילָנָ֔/א מַלְכוּתָ֖/ךְ לָ֣/ךְ קַיָּמָ֑ה מִן דִּ֣י תִנְדַּ֔ע דִּ֥י שַׁלִּטִ֖ן שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/023.yaml
  text: And because they said to leave the stump of the tree with its roots[a], your kingdom will remain yours from the time that you know that Heaven rules.
translation:
  language: fr
  text: Et puisqu’ils ont dit de laisser la souche de l’arbre avec ses racines, ton royaume te sera conservé à partir du moment où tu reconnaîtras que le Ciel[a] règne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les cieux règnent ». En araméen, « les cieux » est ici une manière révérencielle de parler de l’autorité souveraine de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִי
  choice: Et puisque
  rationale: Introduit l’explication tirée de l’ordre rapporté au verset précédent, avec une valeur causale naturelle en français.
- source_word: אֲמַרוּ
  choice: ils ont ordonné
  rationale: Le parfait peal à la troisième personne du pluriel signifie littéralement « ils ont dit »; dans ce contexte de décret, « ont ordonné » exprime naturellement la portée de cette parole tout en conservant le sujet indéfini pluriel.
- source_word: לְמִשְׁבַּק
  choice: de laisser
  rationale: L’infinitif de שבק signifie laisser, permettre de rester ou épargner; « laisser » convient directement à l’image de l’arbre abattu.
- source_word: עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא
  choice: la souche de l’arbre avec ses racines
  rationale: La locution désigne la base enracinée laissée après l’abattage; cette formulation française rend clairement l’image sans la surinterpréter.
- source_word: מַלְכוּתָךְ לָךְ קַיָּמָה
  choice: ton royaume te sera maintenu
  rationale: קַיָּמָה évoque ce qui demeure, subsiste ou est assuré. « Te sera maintenu » conserve le datif לָךְ et indique que la royauté est réservée en vue de sa restitution.
- source_word: מִן דִּי
  choice: dès que
  rationale: L’expression marque le moment à partir duquel la situation annoncée se réalise; « dès que » rend avec naturel cette valeur temporelle.
- source_word: תִנְדַּע
  choice: tu reconnaîtras
  rationale: Le verbe signifie « savoir, connaître », mais le contexte implique que le roi en vient à admettre la souveraineté céleste; « reconnaître » restitue cette nuance contextuelle.
- source_word: שַׁלִּטִן שְׁמַיָּא
  choice: le Ciel règne
  rationale: « Le Ciel » conserve la métonymie révérencielle araméenne pour l’autorité divine, tandis que « règne » exprime clairement la souveraineté.
theological_decisions:
- issue: Faut-il rendre שְׁמַיָּא littéralement par « les cieux » ou comme métonymie révérencielle de Dieu?
  choice: le Ciel règne
  alternative: les cieux règnent
  rationale: Dans ce contexte, le terme désigne révérencieusement l’autorité souveraine de Dieu. Le singulier avec majuscule préserve cette expression indirecte sans la remplacer explicitement par « Dieu ».
- issue: Faut-il comprendre תִנְדַּע comme une simple connaissance ou comme une reconnaissance?
  choice: tu reconnaîtras
  alternative: tu sauras
  rationale: Le sens lexical de base est « savoir », mais l’épreuve vise l’aveu effectif de la souveraineté céleste. « Reconnaître » transmet cette portée sans ajouter une doctrine étrangère au passage.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’image concrète de la souche et la métonymie théologique du « Ciel ». Le marqueur de note [a] figure dans le texte principal.
