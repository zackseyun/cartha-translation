  text: כֹּ֣לָּ/א מְּטָ֔א עַל נְבוּכַדְנֶצַּ֖ר מַלְכָּֽ/א־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/025.yaml
  text: All this came upon King Nebuchadnezzar[a].
translation:
  language: fr
  text: Tout cela arriva au roi Nebucadnetsar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout cela s’abattit sur le roi Nebucadnetsar. »'
    reason: Alternative lexicale qui fait davantage ressortir l’idée d’un jugement atteignant le roi, possibilité permise par l’association de מְּטָא avec עַל.
lexical_decisions:
- source_word: כֹּלָּא
  choice: Tout cela
  rationale: L’expression araméenne totalisante renvoie à l’ensemble de ce qui vient d’être annoncé; « Tout cela » est naturel en français et en conserve la portée globale.
- source_word: מְּטָא
  choice: arriva
  rationale: Le verbe signifie « parvenir, atteindre, arriver ». Avec עַל et un destinataire humain, « arriver à » rend clairement l’accomplissement de ce qui avait été annoncé.
- source_word: עַל
  choice: au
  rationale: La préposition, liée au verbe מְּטָא, introduit ici la personne atteinte par l’événement; la tournure française idiomatique est « arriver à quelqu’un ».
- source_word: נְבוּכַדְנֶצַּר
  choice: Nebucadnetsar
  rationale: Le nom propre suit une translittération française courante et reconnaissable.
- source_word: מַלְכָּא
  choice: roi
  rationale: L’état emphatique porte une valeur définie; dans « au roi Nebucadnetsar », le titre est rendu naturellement tout en conservant sa fonction.
