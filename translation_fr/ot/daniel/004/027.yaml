source:
  edition: WLC
  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר הֲ/לָ֥א דָא הִ֖יא בָּבֶ֣ל רַבְּתָ֑/א דִּֽי אֲנָ֤ה בֱנַיְתַ/הּ֙ לְ/בֵ֣ית מַלְכ֔וּ בִּ/תְקַ֥ף חִסְנִ֖/י וְ/לִ/יקָ֥ר הַדְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/027.yaml
  text: The king answered and said[a], “Is this not Babylon the Great[b], which I myself built as a royal residence by the might of my power and for the glory of my majesty?”
translation:
  language: fr
  text: 'Le roi prit la parole et dit : « N’est-ce pas là Babylone la Grande, celle que moi-même j’ai bâtie pour être la demeure royale, par la puissance de ma force et pour la gloire de ma majesté ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: prit la parole et dit
  rationale: Formule narrative araméenne rendue par une tournure française naturelle et digne, sans suggérer nécessairement une réponse à une question explicite.
- source_word: הֲלָא
  choice: N’est-ce pas
  rationale: Conserve la question rhétorique qui attend une réponse affirmative.
- source_word: בָּבֶל רַבְּתָא
  choice: Babylone la Grande
  rationale: Préserve l’emphase et la tonalité grandiose de la proclamation royale.
- source_word: אֲנָה בֱנַיְתַהּ
  choice: celle que moi-même j’ai bâtie
  rationale: Le pronom indépendant אֲנָה est explicite et emphatique; « moi-même » restitue la vantardise sans ajouter l’idée d’exclusivité.
- source_word: לְבֵית מַלְכוּ
  choice: pour être la demeure royale
  rationale: Rend l’idée littérale de « maison de royauté/du royaume » dans un français intelligible, tout en laissant Babylone désigner le siège et la manifestation du pouvoir royal plutôt qu’un simple palais.
- source_word: בִּתְקַף חִסְנִי
  choice: par la puissance de ma force
  rationale: Maintient le redoublement emphatique et orgueilleux de l’araméen au lieu de le simplifier.
- source_word: וְלִיקָר הַדְרִי
  choice: et pour la gloire de ma majesté
  rationale: Distingue les notions de gloire/honneur et de majesté/splendeur dans une formulation élevée mais claire.
theological_decisions:
- issue: La vantardise de Nabuchodonosor au sujet de la grandeur de Babylone
  choice: Babylone la Grande
  alternative: la grande Babylone
  rationale: La construction demeure descriptive plutôt qu’un titre technique, mais « Babylone la Grande » rend avec force l’orgueil royal et l’emphase de l’adjectif postposé.
- issue: Portée de לְבֵית מַלְכוּ
  choice: pour être la demeure royale
  alternative: comme maison de la royauté / comme siège du royaume
  rationale: La traduction choisie reste naturelle tout en évitant de réduire avec certitude l’expression à un palais individuel; elle peut évoquer Babylone comme résidence et centre du pouvoir royal.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La cadence volontairement grandiose et le léger redoublement « puissance de ma force » reproduisent l’orgueil emphatique du roi.
