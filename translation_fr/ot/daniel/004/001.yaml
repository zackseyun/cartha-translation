  yaml_path: translation/ot/daniel/004/001.yaml
  text: I[a], Nebuchadnezzar[b], was at ease in my house and flourishing in my palace.
translation:
  language: fr
  text: Moi, Nabuchodonosor, j’étais tranquille[a] dans ma maison et florissant[b] dans mon palais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en sécurité » ; le terme araméen peut souligner la tranquillité ou la sécurité.
    reason: lexical_alternative
  - marker: b
    text: Ou « prospère » ; le terme évoque la vigueur, le bien-être ou la prospérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנָה
  choice: Moi
  rationale: Le pronom indépendant est exprimé avec emphase devant le nom en apposition; « Moi, Nabuchodonosor » préserve cette structure naturelle en français.
- source_word: נְבוּכַדְנֶצַּר
  choice: Nabuchodonosor
  rationale: Forme française traditionnelle et largement reconnue du nom propre araméen.
- source_word: שְׁלֵה
  choice: tranquille
  rationale: L’adjectif évoque le calme, l’aisance ou la sécurité; « tranquille » rend naturellement l’état personnel sans imposer l’idée de prospérité matérielle.
- source_word: הֲוֵית
  choice: je vivais
  rationale: La copule passée décrit ici un état durable; « je vivais » s’accorde idiomatiquement avec les compléments de lieu et les deux adjectifs.
- source_word: בְּבֵיתִי
  choice: dans ma maison
  rationale: Rendu concret et littéral qui conserve le parallélisme avec « dans mon palais ».
- source_word: וְרַעְנַן
  choice: et florissant
  rationale: Le terme exprime fraîcheur, vigueur et bien-être prospère; « florissant » en conserve l’image et la portée sans la réduire à la richesse.
- source_word: בְּהֵיכְלִי
  choice: dans mon palais
  rationale: Dans ce contexte royal, le mot désigne le palais plutôt qu’un temple; ce choix évite une association cultuelle trompeuse.
