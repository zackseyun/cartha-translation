  variant: modern international French
source:
  edition: WLC
  text: בֵּ/הּ זִמְנָ֞/א מַנְדְּעִ֣/י יְת֣וּב עֲלַ֗/י וְ/לִ/יקַ֨ר מַלְכוּתִ֜/י הַדְרִ֤/י וְ/זִוִ/י֙ יְת֣וּב עֲלַ֔/י וְ/לִ֕/י הַדָּֽבְרַ֥/י וְ/רַבְרְבָנַ֖/י יְבַע֑וֹן וְ/עַל מַלְכוּתִ֣/י הָתְקְנַ֔ת וּ/רְב֥וּ יַתִּירָ֖ה ה֥וּסְפַת לִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/033.yaml
  text: At that time my reason returned to me[a], and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my nobles sought me, and I was reestablished over my kingdom[c][b], and surpassing greatness was added to me.
translation:
  language: fr
  text: À ce moment-là, la raison me revint[a] et, pour la gloire de mon royaume, ma majesté et ma splendeur me furent rendues. Mes conseillers et mes hauts dignitaires me recherchèrent[b]. Je fus rétabli à la tête de mon royaume[c], et une grandeur encore plus grande me fut ajoutée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon intelligence me revint ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mes conseillers et mes grands me cherchèrent ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je fus restauré » ou « affermi dans la royauté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: À ce moment-là
  rationale: Expression temporelle naturelle qui marque le moment de la restauration sans préciser davantage son immédiateté.
- source_word: מַנְדְּעִי
  choice: la raison
  rationale: Dans le contexte du retour à la lucidité de Nabuchodonosor, le terme désigne sa faculté de comprendre et de raisonner; « la raison » est clair et concis.
- source_word: יְתוּב עֲלַי
  choice: me revint / me furent rendues
  rationale: Le verbe exprime le retour. La première formulation est directe; la seconde adapte naturellement la répétition araméenne aux noms de majesté et de splendeur.
- source_word: לִיקַר מַלְכוּתִי
  choice: pour la gloire de mon royaume
  rationale: Conserve la relation ambiguë de לִ avec la gloire royale, sans la réduire explicitement à un but, une cause ou un résultat.
- source_word: הַדְרִי וְזִוִי
  choice: ma majesté et ma splendeur
  rationale: 'Rend les deux aspects complémentaires de la dignité royale: la grandeur honorifique et son éclat manifeste.'
- source_word: הַדָּבְרַי
  choice: mes conseillers
  rationale: Désigne naturellement les personnes chargées de conseiller le roi.
- source_word: רַבְרְבָנַי
  choice: mes hauts dignitaires
  rationale: Expression française moderne pour les grands personnages et responsables de haut rang du royaume.
- source_word: יְבַעוֹן
  choice: me recherchèrent
  rationale: Préserve le sens fondamental de « chercher » tout en suggérant que les responsables royaux se tournèrent de nouveau vers le roi, sans imposer le sens plus précis de « consulter ».
- source_word: עַל מַלְכוּתִי הָתְקְנַת
  choice: Je fus rétabli à la tête de mon royaume
  rationale: Exprime une remise ferme en position d'autorité; « à la tête de » est plus idiomatique en français que « sur mon royaume ».
- source_word: רְבוּ יַתִּירָה
  choice: une grandeur plus éclatante encore
  rationale: Rend l'idée d'une grandeur supérieure ou accrue dans un français naturel et royal, sans la réduire à la seule quantité.
- source_word: הוּסְפַת לִי
  choice: me fut ajoutée
  rationale: Conserve le passif du texte et laisse implicite l'agent de cette augmentation.
theological_decisions:
- issue: Degré d'explicitation de l'action divine dans la restauration du roi
  choice: 'Conserver des formulations où l''agent reste implicite: « me furent rendues », « je fus rétabli », « me fut ajoutée ».'
  alternative: Ajouter explicitement « par Dieu » ou « par le Très-Haut ».
  rationale: Le contexte attribue la restauration au Très-Haut, mais ce verset ne nomme pas directement l'agent. L'implicite du texte doit être préservé.
- issue: Nature exacte du retour des conseillers et dignitaires
  choice: « me recherchèrent »
  alternative: « vinrent me consulter »
  rationale: Le verbe peut, selon le contexte, suggérer une démarche auprès du roi, mais le sens lexical de recherche ne doit pas être remplacé par une interprétation administrative plus précise.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve les passifs et l'ambiguïté de l'agent, évite un vocabulaire confessionnel, et place chaque appel de note immédiatement après l'expression concernée.
