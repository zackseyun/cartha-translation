source:
  edition: WLC
  text: וְ/לִ/קְצָ֣ת יֽוֹמַיָּ/ה֩ אֲנָ֨ה נְבוּכַדְנֶצַּ֜ר עַיְנַ֣/י לִ/שְׁמַיָּ֣/א נִטְלֵ֗ת וּ/מַנְדְּעִ/י֙ עֲלַ֣/י יְת֔וּב ו/ל/עלי/א בָּרְכֵ֔ת וּ/לְ/חַ֥י עָלְמָ֖/א שַׁבְּחֵ֣ת וְ/הַדְּרֵ֑ת דִּ֤י שָׁלְטָנֵ/הּ֙ שָׁלְטָ֣ן עָלַ֔ם וּ/מַלְכוּתֵ֖/הּ עִם דָּ֥ר וְ/דָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/031.yaml
  text: At the end of the days[a], I, Nebuchadnezzar, lifted my eyes to heaven, and my understanding returned to me; and I blessed the Most High, and I praised and honored him who lives forever, for his dominion is an everlasting dominion, and his kingdom is from generation to generation.
translation:
  language: fr
  text: Au terme de ces jours, moi, Nabuchodonosor, j’ai levé les yeux vers le ciel, et mon intelligence m’est revenue[a]. J’ai béni le Très-Haut, et j’ai loué et honoré celui qui vit éternellement, car sa souveraineté est une souveraineté éternelle, et son royaume subsiste de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma raison m’est revenue ». Le terme araméen peut désigner la connaissance, l’intelligence ou la raison.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִקְצָת יֽוֹמַיָּה
  choice: Au terme de ces jours
  rationale: La tournure araméenne désigne l’achèvement de la période annoncée. « Au terme » est naturel et digne, tandis que « ces jours » conserve la formulation temporelle du texte.
- source_word: עַיְנַי לִשְׁמַיָּא נִטְלֵת
  choice: j’ai levé les yeux vers le ciel
  rationale: Cette traduction conserve l’image concrète et son implication d’un mouvement vers Dieu, sans réduire l’expression à un simple regard vers le haut.
- source_word: וּמַנְדְּעִי עֲלַי יְתוּב
  choice: mon intelligence m’est revenue
  rationale: מַנְדַּע peut évoquer la connaissance, l’intelligence ou la raison. Dans ce contexte, « intelligence » exprime le retour de la lucidité sans imposer une catégorie psychologique moderne; la note signale l’autre rendu principal.
- source_word: לעליא
  choice: le Très-Haut
  rationale: Titre divin consacré en français, qui rend clairement la valeur superlative de l’araméen.
- source_word: בָּרְכֵת
  choice: J’ai béni
  rationale: Le verbe signifie proprement « bénir ». Le distinguer du verbe suivant préserve la succession des actes de célébration.
- source_word: לְחַי עָלְמָא
  choice: celui qui vit éternellement
  rationale: La formulation exprime naturellement en français l’existence perpétuelle de Dieu tout en gardant la référence personnelle.
- source_word: שַׁבְּחֵת וְהַדְּרֵת
  choice: j’ai loué et honoré
  rationale: Les deux verbes proches mais distincts sont conservés, sans les fondre en une seule notion.
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: sa souveraineté est une souveraineté éternelle
  rationale: « Souveraineté » convient au vocabulaire royal de Daniel et évite la connotation souvent négative de « domination ». La répétition du nom reproduit l’emphase de la construction apparentée en araméen.
- source_word: וּמַלְכוּתֵהּ עִם דָּר וְדָר
  choice: son royaume subsiste de génération en génération
  rationale: La proposition araméenne est sans verbe exprimé. « Subsiste » explicite sobrement sa valeur durative, et « de génération en génération » rend l’idiome désignant la succession des générations.
theological_decisions:
- issue: Référence personnelle à Dieu dans la doxologie de Nabuchodonosor
  choice: j’ai loué et honoré celui qui vit éternellement
  alternative: j’ai loué et honoré l’Éternel Vivant
  rationale: « Celui qui vit éternellement » suit la construction descriptive de l’araméen, garde la force personnelle de la confession et n’introduit pas un titre divin plus technique que le texte.
translation_notes:
  register: Français international actuel, digne et accessible. Le passé composé favorise une narration naturelle à la première personne. Les parallélismes et les répétitions significatives de la doxologie sont préservés.
