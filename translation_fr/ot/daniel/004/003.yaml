id: DAN.4.3
reference: Daniel 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מִנִּ/י֙ שִׂ֣ים טְעֵ֔ם לְ/הַנְעָלָ֣ה קָֽדָמַ֔/י לְ/כֹ֖ל חַכִּימֵ֣י בָבֶ֑ל דִּֽי פְשַׁ֥ר חֶלְמָ֖/א יְהֽוֹדְעֻנַּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/003.yaml
  text: And by me a decree was issued to bring before me all the wise men of Babylon[a], that they might make known to me the interpretation of the dream.
translation:
  language: fr
  text: Et j’ai donné l’ordre de faire venir devant moi tous les sages de Babylone, afin qu’ils me fassent connaître l’interprétation du rêve[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils me disent ce que signifie le rêve ».'
    reason: Alternative idiomatique pour rendre ensemble פְשַׁר חֶלְמָא יְהוֹדְעֻנַּנִי, sans modifier le sens.
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Et j’ai donné l’ordre
  rationale: Littéralement, « et de ma part un décret fut établi ». Dans ce contexte administratif royal, cette formulation active rend naturellement l’idée que l’ordre émane du roi, tout en conservant la coordination initiale.
- source_word: לְהַנְעָלָה קָדָמַי
  choice: de faire venir devant moi
  rationale: 'L’infinitif causatif exprime le fait de faire entrer ou venir quelqu’un, et קָדָמַי désigne la présence du roi : « devant moi ».'
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: tous les sages de Babylone
  rationale: La construction désigne l’ensemble des spécialistes de la cour babylonienne. « Sages » est naturel en français et convient au contexte du livre de Daniel.
- source_word: דִּי
  choice: afin que
  rationale: La particule introduit ici le but de l’ordre royal. « Afin que » explicite sans excès cette valeur finale.
- source_word: פְשַׁר חֶלְמָא
  choice: l’interprétation du rêve
  rationale: פְשַׁר est le terme technique employé dans Daniel pour l’interprétation d’un rêve ou d’un mystère. Le texte dit littéralement « le rêve », sans possessif explicite.
- source_word: יְהוֹדְעֻנַּנִי
  choice: ils me fassent connaître
  rationale: La forme causative de ידע avec le suffixe de première personne signifie « faire savoir à moi » ou « me faire connaître ».
