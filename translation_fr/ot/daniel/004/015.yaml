source:
  edition: WLC
  text: דְּנָה֙ חֶלְמָ֣/א חֲזֵ֔ית אֲנָ֖ה מַלְכָּ֣/א נְבוּכַדְנֶצַּ֑ר ו/אנתה בֵּלְטְשַׁאצַּ֜ר פִּשְׁרֵ֣/א אֱמַ֗ר כָּ/ל קֳבֵל֙ דִּ֣י כָּל חַכִּימֵ֣י מַלְכוּתִ֗/י לָֽא יָכְלִ֤ין פִּשְׁרָ/א֙ לְ/הוֹדָ֣עֻתַ֔/נִי ו/אנתה כָּהֵ֔ל דִּ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בָּֽ/ךְ׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/015.yaml
  text: This is the dream that I[a], King Nebuchadnezzar, saw. And you, Belteshazzar, tell its interpretation, because all the wise men of my kingdom are not able to make its interpretation known to me, but you are able, for the spirit of the holy gods is in you.
translation:
  language: fr
  text: Voici le rêve que j’ai vu, moi, le roi Nabuchodonosor. Et toi, Beltshatsar, donnes-en l’interprétation, car aucun des sages de mon royaume n’est capable de me la faire connaître. Mais toi, tu en es capable, parce que l’esprit des dieux saints[a] est en toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Esprit du Dieu saint ». En araméen, les formes rendues par « dieux saints » sont plurielles, mais certains comprennent l’expression comme une référence singulière.'
    reason: Lecture alternative préservant l’ambiguïté grammaticale et théologique.
lexical_decisions:
- source_word: דְּנָה חֶלְמָא
  choice: Voici le rêve
  rationale: Le démonstratif araméen introduit directement le rêve déjà raconté; « Voici » restitue naturellement cette valeur déictique, et l’état déterminé de חֶלְמָא justifie l’article défini.
- source_word: חֲזֵית
  choice: que j’ai eu
  rationale: Littéralement « que j’ai vu ». En français courant, on dit naturellement « avoir un rêve »; le sens de perception onirique est conservé sans lourdeur.
- source_word: אֲנָה מַלְכָּא נְבוּכַדְנֶצַּר
  choice: moi, le roi Nabuchodonosor
  rationale: Conserve l’auto-identification appositionnelle et l’insistance portée par le pronom indépendant.
- source_word: פִּשְׁרֵא אֱמַר
  choice: donnes-en l’interprétation
  rationale: L’impératif אמר signifie ici communiquer ou exposer; « donner l’interprétation » est idiomatique en français. Le pronom « en » rattache explicitement l’interprétation au rêve.
- source_word: כָּל־קֳבֵל דִּי
  choice: car
  rationale: Cette locution introduit la raison de la demande; « car » convient au registre direct et dignifié.
- source_word: כָּל חַכִּימֵי מַלְכוּתִי לָא יָכְלִין
  choice: aucun des sages de mon royaume n’est capable
  rationale: La tournure française négative rend naturellement le sens de « tous les sages… ne sont pas capables » sans suggérer que quelques-uns pourraient l’être.
- source_word: פִּשְׁרָא לְהוֹדָעוּתַנִי
  choice: de me la faire connaître
  rationale: Le causatif de ידע est rendu par « faire connaître »; le pronom féminin renvoie clairement à « l’interprétation ».
- source_word: וְאַנתָּה כָּהֵל
  choice: Mais toi, tu en es capable
  rationale: Le « mais » explicite le contraste contextuel avec l’incapacité des sages, tandis que la reprise pronominale est naturelle et emphatique en français.
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: l’esprit des dieux saints
  rationale: Les formes « dieux » et « saints » sont morphologiquement plurielles, et la parole est celle du roi babylonien. La traduction principale préserve donc cette lecture sans imposer une interprétation monothéiste.
theological_decisions:
- issue: Sens de רוּחַ אֱלָהִין קַדִּישִׁין dans la bouche de Nabuchodonosor
  choice: l’esprit des dieux saints
  alternative: l’Esprit du Dieu saint
  rationale: Le pluriel grammatical et le contexte babylonien favorisent la lecture polythéiste dans le texte principal. La construction peut toutefois être comprise comme une référence singulière au Dieu d’Israël; cette ambiguïté théologique réelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et dignifié. Le tutoiement correspond à l’adresse directe du roi à Daniel. « Beltshatsar » suit une translittération française reconnaissable du nom araméen. La répétition anglaise de « interpretation » est allégée par des pronoms français, sans perte du référent.
