source:
  edition: WLC
  text: בַּ/הּ שַׁעֲתָ֗/א מִלְּתָ/א֮ סָ֣פַת עַל נְבוּכַדְנֶצַּר֒ וּ/מִן אֲנָשָׁ֣/א טְרִ֔יד וְ/עִשְׂבָּ֤/א כְ/תוֹרִין֙ יֵאכֻ֔ל וּ/מִ/טַּ֥ל שְׁמַיָּ֖/א גִּשְׁמֵ֣/הּ יִצְטַבַּ֑ע עַ֣ד דִּ֥י שַׂעְרֵ֛/הּ כְּ/נִשְׁרִ֥ין רְבָ֖ה וְ/טִפְר֥וֹ/הִי כְ/צִפְּרִֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/030.yaml
  text: At that moment the word was fulfilled against Nebuchadnezzar. He was driven away from among men[a], and he ate grass like oxen, and his body was drenched with the dew of heaven, until his hair grew like eagles’ feathers and his nails like birds’ claws.
translation:
  language: fr
  text: À cet instant, la parole s’accomplit contre Nabuchodonosor. Il fut chassé du milieu des humains, mangea de l’herbe comme les bœufs et eut le corps trempé par la rosée du ciel, jusqu’à ce que ses cheveux deviennent semblables aux plumes des aigles[a] et ses ongles aux griffes des oiseaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme les plumes des vautours » ; le terme araméen peut désigner plus largement de grands oiseaux de proie, bien que « aigles » soit la traduction traditionnelle.
    reason: Alternative lexicale pour נִשְׁרִין, dont le référent zoologique peut inclure les vautours.
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָא
  choice: À cet instant
  rationale: L’expression araméenne signifie littéralement « à cette heure / en ce temps ». « À cet instant » rend naturellement l’immédiateté du jugement.
- source_word: מִלְּתָא סָפַת
  choice: la parole s’accomplit
  rationale: מִלְּתָא peut désigner une parole, une affaire ou un décret, et renvoie ici à la parole de jugement qui vient d’être prononcée. « La parole s’accomplit » conserve l’expression biblique sans réduire explicitement le terme à une sentence judiciaire.
- source_word: עַל נְבוּכַדְנֶצַּר
  choice: contre Nabuchodonosor
  rationale: Dans ce contexte de jugement, « contre » exprime la portée défavorable de עַל plus clairement que le spatial « sur ».
- source_word: וּמִן אֲנָשָׁא טְרִיד
  choice: Il fut chassé du milieu des humains
  rationale: טְרִיד exprime l’expulsion ou l’éloignement forcé. « Du milieu des humains » indique son exclusion de la société humaine et convient mieux au français actuel que « du milieu des hommes », potentiellement compris comme exclusivement masculin.
- source_word: וְעִשְׂבָּא כְתוֹרִין יֵאכֻל
  choice: mangea de l’herbe comme les bœufs
  rationale: עִשְׂבָּא désigne l’herbe ou la végétation, et תוֹרִין les bovins. « Bœufs » conserve l’image traditionnelle et reste immédiatement compréhensible.
- source_word: וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע
  choice: eut le corps trempé par la rosée du ciel
  rationale: גִּשְׁמֵהּ signifie « son corps » et יִצְטַבַּע indique qu’il devient mouillé ou détrempé. Cette formulation française garde l’image de la « rosée du ciel » tout en évitant une construction passive pesante.
- source_word: עַד דִּי
  choice: jusqu’à ce que
  rationale: Conjonction temporelle standard qui marque la durée de cet état jusqu’au résultat décrit.
- source_word: שַׂעְרֵהּ כְּנִשְׁרִין רְבָה
  choice: ses cheveux poussent comme les plumes des aigles
  rationale: רְבָה décrit ici la croissance des cheveux. נִשְׁרִין est traditionnellement rendu par « aigles », mais peut désigner plus largement de grands rapaces ou des vautours ; l’alternative est signalée en note.
- source_word: וְטִפְרוֹהִי כְצִפְּרִין
  choice: ses ongles comme les griffes des oiseaux
  rationale: טִפְרוֹהִי peut désigner des ongles ou des griffes. La comparaison avec les oiseaux appelle naturellement « griffes » dans le second membre.
theological_decisions:
- issue: Portée du terme anthropologique אֲנָשָׁא
  choice: les humains
  alternative: les hommes / l’humanité
  rationale: Le terme oppose ici la société humaine à l’état bestial de Nabuchodonosor, sans viser uniquement les personnes de sexe masculin. « Les humains » préserve cette portée générale.
- issue: Nature de מִלְּתָא dans le contexte du jugement
  choice: la parole
  alternative: la sentence / le décret
  rationale: Le contexte permet une nuance judiciaire, mais le terme demeure plus large. « La parole » conserve cette amplitude et le lien avec l’annonce précédente sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, courant et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La coordination a été légèrement allégée pour produire une phrase fluide, tout en conservant la succession des événements et les images du texte araméen.
