    rationale: L’adverbe araméen initial signifie « à présent / maintenant ». Même s’il introduit la conclusion du récit, son omission retire un élément explicite du texte source.
  - severity: medium
    issue: Calques prédicatifs peu naturels
    rationale: « Toutes ses œuvres sont vérité et ses voies sont justice » ne correspond pas à l’usage moderne naturel. Le sens de vérité/rectitude est mieux rendu par des adjectifs prédicatifs pluriels.
