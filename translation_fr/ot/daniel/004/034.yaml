base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/034.yaml
  text: I, Nebuchadnezzar, praise and exalt and honor the King of heaven, because all his works are truth, and his ways are justice; and those who walk in pride he is able to humble.
translation:
  language: fr
  text: À présent, moi, Nabuchodonosor, je loue, j’exalte et j’honore le Roi du ciel, car toutes ses œuvres sont vraies et ses voies sont justes ; ceux qui marchent dans l’orgueil, il peut les humilier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּעַן
  choice: non rendu séparément
  rationale: Dans ce contexte conclusif, l’adverbe araméen sert de marqueur discursif (« à présent », « donc »). Le rendre explicitement par « maintenant » serait lourd et pourrait suggérer à tort une opposition temporelle forte.
- source_word: קְשֹׁט
  choice: vérité
  rationale: Le terme désigne ce qui est vrai, sûr et conforme à la réalité. « Sont vérité » conserve la formulation prédicative forte de l’araméen.
- source_word: דִּין
  choice: justice
  rationale: Le mot exprime ici le jugement juste ou la rectitude judiciaire ; « justice » convient naturellement à la caractérisation des voies de Dieu.
- source_word: מַהְלְכִין בְּגֵוָה
  choice: marchent dans l’orgueil
  rationale: Cette formulation conserve la métaphore de la conduite et le sens d’orgueil ou d’arrogance.
- source_word: יָכִל לְהַשְׁפָּלָה
  choice: il peut les abaisser
  rationale: Rend directement la capacité du Roi du ciel à humilier ou rabaisser les orgueilleux, sans expliciter davantage le mode de cette action.
theological_decisions:
- issue: Rapport entre les œuvres divines et la vérité
  choice: « toutes ses œuvres sont vérité »
  alternative: « toutes ses œuvres sont vraies »
  rationale: La formulation nominale préserve la force et la tension de l’expression araméenne, sans la réduire à la seule véracité factuelle.
- issue: Capacité divine d’abaisser les orgueilleux
  choice: « il peut les abaisser »
  alternative: « il sait humilier »
  rationale: « Peut » traduit plus directement יָכִל et évite de transformer une affirmation de puissance en affirmation de savoir-faire.
translation_notes:
  register: Français moderne, international et digne. La triple série « je loue, j’exalte et j’honore » est maintenue, ainsi que le parallélisme entre « œuvres » et « voies ». L’inversion détachée finale (« ceux qui…, il… ») reproduit l’accent porté sur les orgueilleux tout en restant intelligible.
