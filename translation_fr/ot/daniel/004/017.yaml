  text: אִֽילָנָ/א֙ דִּ֣י חֲזַ֔יְתָ דִּ֥י רְבָ֖ה וּ/תְקִ֑ף וְ/רוּמֵ/הּ֙ יִמְטֵ֣א לִ/שְׁמַיָּ֔/א וַ/חֲזוֹתֵ֖/הּ לְ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/017.yaml
  text: The tree that you saw[a], which grew and became strong, whose height reached to the heavens and was visible to all the earth—
translation:
  language: fr
  text: L’arbre que tu as vu, qui a grandi et est devenu vigoureux, dont la hauteur atteignait les cieux et qui était visible de toute la terre[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’araméen peut aussi signifier «pays»; ici, «terre» correspond mieux à la portée universelle de l’image du rêve.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִילָנָא
  choice: l’arbre
  rationale: Le nom araméen désigne couramment un arbre; l’article défini renvoie à celui du rêve.
- source_word: דִּי חֲזַיְתָ
  choice: que tu as vu
  rationale: La particule relative suivie du parfait à la deuxième personne du masculin singulier se rend naturellement ainsi en français moderne.
- source_word: רְבָה וּתְקִף
  choice: a grandi et est devenu vigoureux
  rationale: Les deux verbes décrivent l’accroissement puis la vigueur de l’arbre; «vigoureux» convient mieux à un arbre que «fort» tout en conservant l’idée de puissance.
- source_word: וְרוּמֵהּ יִמְטֵא
  choice: dont la hauteur atteignait
  rationale: רוּם désigne ici la hauteur, et מטא l’action d’atteindre; l’imparfait français convient à la description du rêve passé.
- source_word: לִשְׁמַיָּא
  choice: les cieux
  rationale: Le pluriel biblique araméen est conservé sans réduire l’image au seul ciel atmosphérique.
- source_word: וַחֲזוֹתֵהּ
  choice: et qui était visible
  rationale: La tournure exprime naturellement en français que l’arbre pouvait être vu, sans alourdir par «son apparence».
- source_word: לְכָל אַרְעָא
  choice: de toute la terre
  rationale: La préposition marque ici l’étendue depuis laquelle l’arbre est visible; «terre» correspond à la portée universelle de l’image, tout en signalant l’autre sens possible en note.
theological_decisions:
- issue: Portée de אַרְעָא dans l’image du rêve royal
  choice: terre
  alternative: pays
  rationale: Le mot peut désigner la terre ou un pays. La hauteur céleste de l’arbre et sa visibilité universelle favorisent «terre», sans transformer pour autant l’image en affirmation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La structure relative et le tiret final sont maintenus, car le verset poursuit une phrase qui s’achève dans le contexte suivant.
