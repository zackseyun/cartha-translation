base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/008.yaml
  text: The tree grew large and became strong[a], and its height reached to the heavens, and it was visible to the end of the whole earth.
translation:
  language: fr
  text: L’arbre grandit et devint fort ; sa hauteur atteignit les cieux, et il était visible jusqu’aux extrémités de toute la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et son apparence s’étendait jusqu’aux extrémités de toute la terre ». Le nom araméen peut désigner l’apparence ou l’aspect aussi bien que ce qui est vu, mais le contexte favorise ici l’idée de visibilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְבָה אִילָנָא
  choice: L’arbre grandit
  rationale: Le verbe exprime l’accroissement ou le fait de devenir grand. « Grandit » rend naturellement le développement de l’arbre, tandis que l’état emphatique d’אִילָנָא désigne ici l’arbre précis de la vision.
- source_word: וּתְקִף
  choice: et devint fort
  rationale: Le verbe indique que l’arbre acquiert force et puissance. « Devint fort » conserve la progression de la vision.
- source_word: וְרוּמֵהּ
  choice: sa hauteur
  rationale: Le nom désigne directement la hauteur ou l’élévation de l’arbre ; « sa hauteur » est clair et naturel en français.
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: atteignit les cieux
  rationale: Le verbe signifie atteindre ou parvenir, et le pluriel araméen שְׁמַיָּא est rendu par « les cieux », ce qui préserve l’ampleur de l’image.
- source_word: וַחֲזוֹתֵהּ
  choice: il était visible
  rationale: Le substantif peut désigner l’apparence, l’aspect ou ce qui est vu. Dans la construction avec l’extrémité de toute la terre, une formulation exprimant la visibilité est naturelle et contextuellement probable.
- source_word: לְסוֹף כָּל אַרְעָא
  choice: jusqu’aux extrémités de toute la terre
  rationale: La tournure exprime la portée jusqu’à la limite la plus éloignée. Le pluriel idiomatique français « aux extrémités » communique cette étendue universelle sans réduire אַרְעָא à un territoire local.
