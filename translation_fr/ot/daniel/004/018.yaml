  text: וְ/עָפְיֵ֤/הּ שַׁפִּיר֙ וְ/אִנְבֵּ֣/הּ שַׂגִּ֔יא וּ/מָז֨וֹן לְ/כֹ֖לָּ/א בֵ֑/הּ תְּחֹת֗וֹ/הִי תְּדוּר֙ חֵיוַ֣ת בָּרָ֔/א וּ/בְ/עַנְפ֕וֹ/הִי יִשְׁכְּנָ֖ן צִפֲּרֵ֥י שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/018.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field lived, and in its branches the birds of the heavens dwelled.
translation:
  language: fr
  text: Son feuillage était beau, ses fruits abondants, et il y avait en lui de la nourriture pour tous. Sous lui vivaient les animaux des champs, et dans ses branches habitaient les oiseaux du ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les oiseaux des cieux ».'
    reason: La forme araméenne שְׁמַיָּא est plurielle; le singulier « ciel » est plus naturel en français dans cette expression.
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: son feuillage
  rationale: Le nom araméen désigne collectivement la parure feuillue de l’arbre. « Feuillage » restitue naturellement ce sens collectif.
- source_word: שַׁפִּיר
  choice: était beau
  rationale: L’adjectif exprime la beauté ou l’agrément visuel. « Beau » est direct, actuel et convient à « feuillage ».
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: ses fruits abondants
  rationale: Le singulier collectif araméen désigne la production fruitière de l’arbre, tandis que שַׂגִּיא en souligne l’abondance. Le pluriel français est idiomatique.
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: il y avait en lui de la nourriture pour tous
  rationale: Cette formulation conserve la localisation explicite « en lui » et le caractère universel de לְכֹלָּא, sans remplacer l’image de l’arbre par une paraphrase.
- source_word: תְּחֹתוֹהִי תְּדוּר חֵיוַת בָּרָא
  choice: sous lui vivaient les animaux des champs
  rationale: « Vivaient » rend naturellement l’idée de résidence exprimée par le verbe. « Animaux des champs » préserve l’expression araméenne sans la limiter aux seuls animaux sauvages.
- source_word: וּבְעַנְפוֹהִי יִשְׁכְּנָן
  choice: et dans ses branches habitaient
  rationale: « Branches » est le terme moderne usuel. « Habitaient » maintient l’idée d’établissement ou de demeure sans préciser indûment qu’il s’agissait de nids.
- source_word: צִפֲּרֵי שְׁמַיָּא
  choice: les oiseaux du ciel
  rationale: « Oiseaux du ciel » est une expression française naturelle et bibliquement familière. Une note signale que l’araméen emploie formellement le pluriel « cieux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle du verset et les indications spatiales (« en lui », « sous lui », « dans ses branches ») sont conservées. Le pronom masculin « lui » maintient la personnification grammaticale de l’arbre et la cohésion de l’image.
