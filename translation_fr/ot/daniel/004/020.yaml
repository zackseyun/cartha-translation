id: DAN.4.20
reference: Daniel 4:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/דִ֣י חֲזָ֣ה מַלְכָּ֡/א עִ֣יר וְ/קַדִּ֣ישׁ נָחִ֣ת מִן שְׁמַיָּ֡/א וְ/אָמַר֩ גֹּ֨דּוּ אִֽילָנָ֜/א וְ/חַבְּל֗וּ/הִי בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֧ל שְׁמַיָּ֣/א יִצְטַבַּ֗ע וְ/עִם חֵיוַ֤ת בָּרָ/א֙ חֲלָקֵ֔/הּ עַ֛ד דִּֽי שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/020.yaml
  text: And because the king saw a watcher[a], a holy one, coming down from heaven and saying, ‘Cut down the tree and destroy it, but leave the stump of its roots in the earth, with a band of iron and bronze, in the grass of the field, and let him be drenched with the dew of heaven[c][b], and let his portion be with the beasts of the field until seven times pass over him’—
translation:
  language: fr
  text: 'Et puisque le roi a vu un veilleur[a], un saint, descendre du ciel et dire : « Abattez l’arbre et détruisez-le. Mais laissez en terre la souche avec ses racines, avec un lien de fer et de bronze[b], au milieu de l’herbe des champs. Qu’il soit trempé de la rosée du ciel et que sa part soit avec les bêtes des champs, jusqu’à ce que sept temps[c] passent sur lui » —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un gardien »; le terme araméen désigne un être céleste caractérisé par sa vigilance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec une entrave de fer et de bronze ».'
    reason: lexical_alternative
  - marker: c
    text: Les « sept temps » sont sept périodes dont la durée exacte n’est pas précisée ici.
    reason: alternative_reading
lexical_decisions:
- source_word: עִיר
  choice: veilleur
  rationale: Dans l’araméen de Daniel, le terme désigne un être céleste caractérisé par sa vigilance. « Veilleur » conserve cette désignation propre sans préciser davantage sa catégorie.
- source_word: וְקַדִּישׁ
  choice: un saint
  rationale: Le groupe est compris comme une seconde désignation, en apposition à « un veilleur », du même être céleste.
- source_word: נָחִת מִן שְׁמַיָּא
  choice: descendre du ciel
  rationale: Après « a vu », l’infinitif français rend naturellement l’être aperçu pendant sa descente.
- source_word: גֹּדּוּ
  choice: Abattez
  rationale: L’impératif pluriel ordonne de faire tomber l’arbre; « abattez » est précis et naturel dans ce contexte.
- source_word: וְחַבְּלוּהִי
  choice: détruisez-le
  rationale: Le verbe exprime l’action d’endommager ou de détruire; le pronom renvoie à l’arbre.
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: la souche avec ses racines
  rationale: Cette formulation française claire désigne la partie enracinée qui subsiste après l’abattage.
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: avec un lien de fer et de bronze
  rationale: « Lien » préserve l’idée générale de ce qui entoure ou entrave, sans imposer qu’il s’agisse seulement d’un cercle autour de la souche ou de chaînes.
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: au milieu de l’herbe des champs
  rationale: Rend naturellement la végétation du terrain ouvert tout en conservant l’image champêtre.
- source_word: יִצְטַבַּע
  choice: Qu’il soit trempé
  rationale: Le passif exprime une forte imprégnation par la rosée et conserve le passage remarquable du référent végétal au pronom masculin.
- source_word: וְעִם חֵיוַת בָּרָא חֲלָקֵהּ
  choice: que sa part soit avec les bêtes des champs
  rationale: « Sa part » conserve le sens de lot ou condition partagée; « bêtes des champs » convient au registre biblique tout en restant compréhensible.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sept temps
  rationale: Le texte indique sept périodes sans en préciser explicitement la durée; la traduction maintient cette indétermination.
theological_decisions:
- issue: Identité du « veilleur, un saint »
  choice: Conserver les deux désignations araméennes d’un même être céleste
  alternative: Traduire par « ange » ou préciser son rang dans le conseil céleste
  rationale: Le texte ne donne pas de taxonomie angélique plus précise; la traduction évite donc d’introduire une identification doctrinale supplémentaire.
- issue: Passage de l’arbre à une personne dans les pronoms
  choice: Employer « ses » pour la souche enracinée, puis « il/lui/sa » dans la suite
  alternative: Uniformiser tous les pronoms comme renvoyant soit à l’arbre, soit directement au roi
  rationale: Cette transition présente dans l’araméen fait partie du dévoilement de la métaphore et ne doit pas être effacée.
- issue: Durée des « sept temps »
  choice: Ne pas préciser l’unité chronologique
  alternative: Traduire explicitement par « sept années »
  rationale: Bien qu’une interprétation en années soit courante dans le contexte, עִדָּנִין signifie ici des périodes ou temps sans nommer directement l’unité.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve le discours adressé au roi à la troisième personne, le mouvement de la métaphore de l’arbre vers une personne et la suspension finale du verset, dont la phrase se poursuit.
