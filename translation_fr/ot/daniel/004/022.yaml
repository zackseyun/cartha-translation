source:
  edition: WLC
  text: וְ/לָ֣/ךְ טָֽרְדִ֣ין מִן אֲנָשָׁ֡/א וְ/עִם חֵיוַ֣ת בָּרָ/א֩ לֶהֱוֵ֨ה מְדֹרָ֜/ךְ וְ/עִשְׂבָּ֥/א כְ/תוֹרִ֣ין לָ֣/ךְ יְטַֽעֲמ֗וּן וּ/מִ/טַּ֤ל שְׁמַיָּ/א֙ לָ֣/ךְ מְצַבְּעִ֔ין וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עֲלָ֑/יךְ עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/022.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and you will be drenched with the dew of heaven, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: fr
  text: On te chassera du milieu des hommes, et tu auras ta demeure avec les bêtes des champs. On te fera manger de l’herbe comme aux bœufs, et tu seras trempé de la rosée du ciel. Sept temps passeront sur toi[a], jusqu’à ce que tu reconnaisses que le Très-Haut règne sur le royaume des hommes[b] et qu’il le donne à qui il veut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept périodes »; beaucoup comprennent qu’il s’agit de sept années.
    reason: alternative_reading
  - marker: b
    text: L’expression « royaume des hommes » peut désigner la domination humaine ou le monde gouverné par les humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָרְדִין
  choice: on te chassera
  rationale: La forme active au pluriel a un sujet indéfini; la tournure impersonnelle française « on te chassera » en conserve naturellement le caractère forcé.
- source_word: אֲנָשָׁא
  choice: les hommes
  rationale: Le terme désigne ici la société humaine, mise en contraste avec les animaux; cette formulation maintient aussi le lien avec « le royaume des hommes » plus loin dans le verset.
- source_word: חֵיוַת בָּרָא
  choice: les bêtes des champs
  rationale: Cette expression française, concrète et digne, rend les animaux vivant hors de l’espace humain civilisé.
- source_word: מְדֹרָךְ
  choice: ta demeure
  rationale: Le mot désigne le lieu où l’on habite; « demeure » convient au registre élevé sans être obscur.
- source_word: וְעִשְׂבָּא
  choice: de l’herbe
  rationale: Dans l’image d’un bovin qui paît, « herbe » est l’équivalent français le plus précis et naturel.
- source_word: כְתוֹרִין
  choice: comme aux bœufs
  rationale: Le terme désigne des bovins; la construction « on te fera manger… comme aux bœufs » exprime idiomatiquement la comparaison en français.
- source_word: יְטַעֲמוּן
  choice: on te fera manger
  rationale: La tournure causative indique que cette nourriture lui sera imposée, et non simplement qu’il choisira de la manger.
- source_word: מִטַּל שְׁמַיָּא
  choice: de la rosée du ciel
  rationale: La traduction directe conserve l’image vive de l’exposition nocturne en plein air et le registre du passage.
- source_word: מְצַבְּעִין
  choice: tu seras trempé
  rationale: Le verbe exprime le fait d’être mouillé ou imbibé; « trempé » restitue sa force en français courant.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sept temps
  rationale: « Temps » préserve l’indétermination du terme araméen, qui désigne des périodes sans préciser explicitement leur durée.
- source_word: יַחְלְפוּן עֲלָיךְ
  choice: passeront sur toi
  rationale: La formulation reste proche de l’image araméenne et présente cette durée comme une expérience subie personnellement.
- source_word: עַד דִּי תִנְדַּע
  choice: jusqu’à ce que tu reconnaisses
  rationale: Le verbe signifie littéralement « savoir », mais le contexte évoque un savoir acquis par l’expérience et devenu reconnaissance effective; « reconnaisses » exprime naturellement cette nuance.
- source_word: שַׁלִּיט עִלָּיָא
  choice: le Très-Haut règne
  rationale: La formule exprime l’autorité souveraine du Très-Haut; « règne » est concise, naturelle et adaptée au complément « royaume ».
- source_word: יִתְּנִנַּהּ
  choice: il le donne
  rationale: Le pronom reprend le royaume; la traduction conserve l’affirmation directe de la libre attribution de l’autorité par le Très-Haut.
theological_decisions:
- issue: Durée exprimée par עִדָּנִין
  choice: sept temps
  alternative: sept périodes; selon une interprétation courante, sept années
  rationale: L’araméen ne fixe pas ici une unité calendaire précise. Le texte principal conserve donc l’ambiguïté, et la note signale l’interprétation fréquente sans l’imposer.
- issue: Sens de מַלְכוּת אֲנָשָׁא
  choice: le royaume des hommes
  alternative: la domination humaine; le monde des humains
  rationale: La formulation concrète reproduit l’expression araméenne et maintient la tension entre les royaumes humains et la souveraineté du Très-Haut, sans réduire le sens à une théorie politique particulière.
- issue: Portée de תִנְדַּע
  choice: tu reconnaisses
  alternative: tu saches; tu apprennes
  rationale: Dans ce jugement, la connaissance visée est expérientielle et implique l’acceptation de la souveraineté divine. « Reconnaître » rend cette portée contextuelle sans ajouter une doctrine confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Les tournures impersonnelles rendent naturellement les sujets indéfinis araméens. Le vocabulaire conserve l’imagerie concrète et le ton solennel sans archaïsmes inutiles.
