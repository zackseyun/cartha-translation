source:
  edition: WLC
  text: חֵ֥לֶם חֲזֵ֖ית וִֽ/ידַחֲלִנַּ֑/נִי וְ/הַרְהֹרִין֙ עַֽל מִשְׁכְּבִ֔/י וְ/חֶזְוֵ֥י רֵאשִׁ֖/י יְבַהֲלֻנַּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/002.yaml
  text: I saw a dream[a], and it frightened me; and the thoughts on my bed and the visions of my head terrified me.
translation:
  language: fr
  text: J’ai fait un rêve, et il m’a effrayé ; les pensées qui me venaient sur mon lit et les visions dans ma tête m’ont terrifié.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les réflexions sur mon lit et les visions de ma tête m’ont bouleversé ».'
    reason: Variantes lexicales possibles pour הַרְהֹרִין, חֶזְוֵי רֵאשִׁי et בהל ; cette formulation conserve plus littéralement les constructions araméennes.
lexical_decisions:
- source_word: חֵלֶם חֲזֵית
  choice: J’ai fait un rêve
  rationale: Littéralement, « j’ai vu un rêve ». En français actuel, « faire un rêve » exprime naturellement l’expérience d’un rêve sans en modifier le sens.
- source_word: וִידַחֲלִנַּנִי
  choice: et il m’a effrayé
  rationale: Le verbe singulier renvoie naturellement au rêve et exprime la peur qu’il provoque.
- source_word: וְהַרְהֹרִין
  choice: les pensées qui me venaient
  rationale: Le nom araméen désigne des pensées ou des réflexions. La tournure verbale est idiomatique en français et s’accorde avec le contexte du lit.
- source_word: עַל מִשְׁכְּבִי
  choice: sur mon lit
  rationale: Cette traduction directe conserve le cadre spatial et nocturne du texte.
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: les visions dans ma tête
  rationale: La formulation conserve l’image de la tête tout en restant compréhensible et naturelle en français moderne.
- source_word: יְבַהֲלֻנַּנִי
  choice: m’ont terrifié
  rationale: Le verbe exprime un profond bouleversement ou une vive terreur. Le pluriel rend l’action conjointe des pensées et des visions, et « terrifié » distingue ce verbe du précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La traduction privilégie une expression idiomatique tout en conservant le parallélisme entre les pensées et les visions ainsi que la progression d’« effrayé » à « terrifié ».
