id: DAN.4.14
reference: Daniel 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּ/גְזֵרַ֤ת עִירִין֙ פִּתְגָמָ֔/א וּ/מֵאמַ֥ר קַדִּישִׁ֖ין שְׁאֵֽלְתָ֑/א עַד דִּבְרַ֡ת דִּ֣י יִנְדְּע֣וּן חַ֠יַּיָּ/א דִּֽי שַׁלִּ֨יט עלי/א בְּ/מַלְכ֣וּת אנוש/א וּ/לְ/מַן דִּ֤י יִצְבֵּא֙ יִתְּנִנַּ֔/הּ וּ/שְׁפַ֥ל אֲנָשִׁ֖ים יְקִ֥ים עלי/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/014.yaml
  text: The sentence is by the decree of the watchers[a], and the decision by the word of the holy ones, so that the living may know that the Most High rules in the kingdom of mankind and gives it to whom he wills[c][b], and sets up over it the lowliest of men.
translation:
  language: fr
  text: Cette sentence est rendue par le décret des veilleurs[a], et cette décision, par la parole des êtres saints, afin que les vivants sachent que le Très-Haut domine sur le royaume des humains[b], qu’il le donne à qui il veut et qu’il établit à sa tête le plus humble des hommes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les « veilleurs » sont des êtres célestes dans le livre de Daniel; beaucoup les comprennent comme des anges. On peut aussi traduire le début : « Cette sentence vient du décret des veilleurs, et la décision est une requête selon la parole des êtres saints. » Le texte araméen est très condensé, et שְׁאֵלְתָא peut signifier « demande » ou « requête ».'
    reason: Note culturelle et variante lexicale liées à la terminologie céleste et à la syntaxe comprimée.
  - marker: b
    text: 'Ou : « dans la royauté humaine » ou « sur le royaume de l’humanité ».'
    reason: Le mot araméen désigne le royaume, la royauté ou le pouvoir royal; la préposition et l’usage français permettent plusieurs formulations.
  - marker: c
    text: 'Ou : « le plus bas des hommes ». L’expression désigne quelqu’un de condition très basse; elle ne qualifie pas nécessairement son caractère moral.'
    reason: Précision sémantique sur l’expression araméenne שְׁפַל אֲנָשִׁים.
lexical_decisions:
- source_word: בִּגְזֵרַת עִירִין
  choice: par décret des veilleurs
  rationale: « Décret » conserve la force juridique de גְזֵרָה. « Veilleurs » rend littéralement le terme technique araméen עִירִין sans l’interpréter directement comme « anges ».
- source_word: פִּתְגָמָא
  choice: Cette sentence est prononcée
  rationale: Dans ce cadre judiciaire, פִּתְגָמָא désigne la sentence annoncée. L’ajout idiomatique de « est prononcée » explicite naturellement en français le rapport elliptique avec « par décret ».
- source_word: וּמֵאמַר קַדִּישִׁין שְׁאֵלְתָא
  choice: et cette décision, par la parole des saints
  rationale: Le texte araméen est condensé et שְׁאֵלְתָא signifie normalement « demande » ou « requête ». La formulation principale suit le parallélisme judiciaire du contexte, tandis que la note conserve l’autre analyse possible.
- source_word: קַדִּישִׁין
  choice: les saints
  rationale: « Saints » est la désignation française concise correspondant aux « êtres saints » célestes du passage. Le contexte et la note sur les veilleurs empêchent de l’entendre ici comme un titre ecclésial.
- source_word: עַד דִּבְרַת דִּי
  choice: afin que
  rationale: La locution introduit le but ou le résultat; « afin que » en conserve clairement la portée téléologique.
- source_word: חַיַּיָּא
  choice: les vivants
  rationale: La traduction reste générale et concise, comme l’expression araméenne.
- source_word: שַׁלִּיט עִלָּיָא
  choice: le Très-Haut domine
  rationale: עִלָּיָא est le titre « le Très-Haut » et שַׁלִּיט exprime l’exercice effectif de l’autorité souveraine.
- source_word: בְּמַלְכוּת אֱנוֹשָׁא
  choice: sur la royauté humaine
  rationale: « Royauté » rend ici le domaine et l’exercice du pouvoir royal. « Humaine » exprime la valeur collective de אֱנוֹשָׁא, et « sur » donne en français le rapport naturel de domination porté par le contexte.
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: qu’il la donne à qui il veut
  rationale: La formulation naturelle conserve la liberté souveraine du Très-Haut dans l’octroi de la royauté.
- source_word: וּשְׁפַל אֲנָשִׁים יְקִים עֲלַהּ
  choice: et qu’il établit à sa tête le plus humble des hommes
  rationale: L’idiome désigne un homme situé au rang le plus bas. « À sa tête » rend naturellement l’idée de l’établir au-dessus de la royauté.
theological_decisions:
- issue: Identité des « veilleurs » et des « saints »
  choice: Conserver les termes propres à la scène de cour céleste.
  alternative: Traduire directement par « anges » ou « êtres célestes ».
  rationale: Le texte présente ces êtres par ses propres désignations. Les maintenir évite de réduire une imagerie particulière de Daniel à une catégorie interprétative plus générale.
- issue: Souveraineté du Très-Haut sur la royauté humaine
  choice: 'Traduire les verbes activement : il domine, donne et établit.'
  alternative: Employer une formulation abstraite telle que « le Très-Haut est souverain ».
  rationale: La suite verbale du texte souligne non seulement un statut divin, mais aussi l’action concrète du Très-Haut dans l’attribution du pouvoir.
- issue: Valeur de שְׁפַל אֲנָשִׁים
  choice: « le plus humble des hommes »
  alternative: « le plus vil des hommes » ou « un homme de basse condition ».
  rationale: Le terme peut signaler un rang très bas sans imposer nécessairement un jugement moral péjoratif. « Humble » préserve cette ouverture sémantique.
translation_notes:
  register: Français international moderne, digne et lisible. Le registre juridique de « sentence » et « décret » est maintenu, ainsi que le vocabulaire propre à la cour céleste. La syntaxe a été légèrement déployée pour rendre intelligible en français la formulation araméenne très condensée, sans effacer son ambiguïté, signalée en note.
