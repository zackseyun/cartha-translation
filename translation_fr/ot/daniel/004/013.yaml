  text: לִבְבֵ/הּ֙ מִן אנוש/א יְשַׁנּ֔וֹן וּ/לְבַ֥ב חֵיוָ֖ה יִתְיְהִ֣ב לֵ֑/הּ וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/013.yaml
  text: Let his heart be changed from that of a man[a], and let the heart of a beast be given to him, and let seven times pass over him.
translation:
  language: fr
  text: 'Que son cœur soit changé : qu’il ne soit plus celui d’un homme, et qu’un cœur de bête lui soit donné. Que sept périodes[a] passent sur lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept temps » ou « sept saisons ». Le terme araméen désigne des temps ou des périodes fixés, dont la durée exacte n’est pas précisée ici.
    reason: Alternative lexicale et préservation de l’indétermination temporelle du texte source.
lexical_decisions:
- source_word: לִבְבֵהּ מִן אֱנוֹשָׁא
  choice: son cœur soit changé, qu’il ne soit plus celui d’un homme
  rationale: Le « cœur » désigne ici l’être intérieur, notamment la pensée et les dispositions. La formulation française explicite naturellement la séparation exprimée par מִן sans réduire le terme à « esprit » ni préciser la nature du changement.
- source_word: יְשַׁנּוֹן
  choice: soit changé
  rationale: Le pluriel araméen a ici une valeur impersonnelle. Le passif français conserve cette indétermination sans nommer l’agent.
- source_word: וּלְבַב חֵיוָה
  choice: et qu’un cœur de bête
  rationale: « Bête » conserve l’image forte de חֵיוָה et convient au registre biblique tout en restant compréhensible en français moderne.
- source_word: יִתְיְהִב לֵהּ
  choice: lui soit donné
  rationale: Cette traduction directe maintient la forme passive du texte et n’ajoute aucune interprétation sur l’agent ou le mécanisme.
- source_word: שִׁבְעָה עִדָּנִין
  choice: sept périodes
  rationale: עִדָּן désigne un temps ou une période déterminée, sans que sa durée exacte soit indiquée ici. « Périodes » est naturel en français moderne et évite de suggérer une unité chronologique précise.
- source_word: יַחְלְפוּן עֲלֹוהִי
  choice: passent sur lui
  rationale: La formulation conserve l’image araméenne de périodes qui passent sur la personne, tout en restant idiomatique dans ce contexte.
theological_decisions:
- issue: Nature du jugement décrit
  choice: Le cœur humain du personnage est changé et un cœur de bête lui est donné, sans préciser la nature exacte de ce changement.
  alternative: Comprendre explicitement soit une métamorphose physique, soit un état mental comparable à celui d’une bête.
  rationale: L’araméen maintient l’ambiguïté entre transformation littérale et description d’un état intérieur ou mental. La traduction conserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux propositions introduites par « Que » restitue la tonalité solennelle du décret. « Cœur » et « bête » préservent les images concrètes de l’araméen.
