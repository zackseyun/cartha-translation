source:
  edition: WLC
  text: אֱדַ֨יִן דָּֽנִיֵּ֜אל דִּֽי שְׁמֵ֣/הּ בֵּלְטְשַׁאצַּ֗ר אֶשְׁתּוֹמַם֙ כְּ/שָׁעָ֣ה חֲדָ֔ה וְ/רַעְיֹנֹ֖/הִי יְבַהֲלֻנֵּ֑/הּ עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֗ר בֵּלְטְשַׁאצַּר֙ חֶלְמָ֤/א וּ/פִשְׁרֵ/א֙ אַֽל יְבַהֲלָ֔/ךְ עָנֵ֤ה בֵלְטְשַׁאצַּר֙ וְ/אָמַ֔ר מרא/י חֶלְמָ֥/א ל/שנאי/ך וּ/פִשְׁרֵ֥/הּ ל/ערי/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/016.yaml
  text: Then Daniel[a], whose name was Belteshazzar, was appalled for about an hour, and his thoughts terrified him. The king answered and said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar answered and said, “My lord, may the dream be for those who hate you[b], and its interpretation for your enemies.”
translation:
  language: fr
  text: 'Alors Daniel, dont le nom était Beltshatsar, resta frappé de stupeur[a] pendant environ une heure[b], et ses pensées l’épouvantèrent. Le roi prit la parole et dit : « Beltshatsar, ne te laisse pas épouvanter par le rêve ni par son interprétation. » Beltshatsar répondit : « Mon seigneur, que le rêve soit pour ceux qui vous haïssent, et son interprétation pour vos ennemis ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « resta interdit » ou « fut bouleversé ». Le verbe araméen peut décrire un choc qui laisse sans voix ; ici, le contexte suggère aussi un profond désarroi.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « comme une heure » ; l’expression peut désigner une durée approximative.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Alors
  rationale: Marque la progression du récit de manière naturelle en français moderne.
- source_word: דָּנִיֵּאל דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: Daniel, dont le nom était Beltshatsar
  rationale: Conserve l’identification explicative de Daniel par son nom babylonien dans un récit au passé.
- source_word: אֶשְׁתּוֹמַם
  choice: resta frappé de stupeur
  rationale: Le verbe exprime un choc qui laisse interdit ou silencieux. Cette formulation rend à la fois la sidération et le profond désarroi suscité par le sens du rêve.
- source_word: כְּשָׁעָה חֲדָה
  choice: pendant environ une heure
  rationale: La construction signifie littéralement « pendant une heure »; la préposition כְ autorise ici la nuance approximative « environ ».
- source_word: וְרַעְיֹנֹהִי
  choice: et ses pensées
  rationale: Terme clair et courant pour les réflexions intérieures de Daniel.
- source_word: יְבַהֲלֻנֵּהּ / יְבַהֲלָךְ
  choice: l’épouvantèrent / ne te laisse pas épouvanter
  rationale: Conserve la reprise de la même racine araméenne et sa forte charge émotionnelle, tout en adaptant naturellement la syntaxe française.
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: Le roi prit la parole et dit
  rationale: Rend la formule sémitique de prise de parole sans lourdeur excessive en français.
- source_word: חֶלְמָא וּפִשְׁרֵא אַל יְבַהֲלָךְ
  choice: ne te laisse pas épouvanter par le rêve ni par son interprétation
  rationale: Le tour négatif avec « ni » est idiomatique et présente le rêve et son interprétation comme les causes possibles de l’effroi.
- source_word: מָרִי
  choice: Mon seigneur
  rationale: Titre humain de respect adressé au roi, dans un registre de cour digne mais compréhensible.
- source_word: לְשָׂנְאָיִךְ
  choice: pour ceux qui vous haïssent
  rationale: Le lamed indique ici à qui Daniel souhaite voir appliquer le rêve; le vouvoiement marque naturellement en français le respect dû au roi.
- source_word: וּפִשְׁרֵהּ לְעָרָיִךְ
  choice: et son interprétation pour vos ennemis
  rationale: Préserve le parallélisme concis entre le rêve et son interprétation, d’une part, ceux qui haïssent le roi et ses ennemis, d’autre part.
theological_decisions:
- issue: Valeur du titre מָרִי adressé à Nabuchodonosor
  choice: Mon seigneur
  alternative: Mon maître ; Sire
  rationale: Il s’agit d’un titre honorifique humain dans le cadre de la cour royale, non d’un titre divin. « Mon seigneur » conserve la déférence de Daniel sans ajouter de portée théologique.
- issue: Souhait concernant le rêve et son interprétation
  choice: que le rêve soit pour ceux qui vous haïssent, et son interprétation pour vos ennemis
  alternative: que le rêve s’accomplisse sur ceux qui vous haïssent, et son interprétation sur vos ennemis
  rationale: La traduction retenue préserve la formulation elliptique et prudente de l’araméen, sans expliciter à tort un accomplissement que le texte laisse sous-entendu.
translation_notes:
  register: Français international moderne, digne et narratif. Le tutoiement du roi envers Daniel et le vouvoiement respectueux de Daniel envers le roi reproduisent naturellement l’asymétrie sociale du dialogue en français. Les marqueurs de notes ont été placés sur les expressions auxquelles ils se rapportent.
