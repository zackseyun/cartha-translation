source:
  edition: WLC
  text: דְּנָ֥ה פִשְׁרָ֖/א מַלְכָּ֑/א וּ/גְזֵרַ֤ת עלי/א הִ֔יא דִּ֥י מְטָ֖ת עַל מרא/י מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/021.yaml
  text: 'This is the interpretation[a], O king, and it is a decree of the Most High that has come upon my lord the king:'
translation:
  language: fr
  text: 'Voici l’interprétation, ô roi, et voici le décret du Très-Haut[a] qui a atteint mon seigneur le roi :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Suprême ». Ce titre araméen présente Dieu comme souverain au-dessus de tous les dirigeants.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: Voici
  rationale: Le démonstratif introduit l’explication de Daniel. « Voici » rend naturellement en français la présentation solennelle de ce qui suit.
- source_word: פִשְׁרָא
  choice: l’interprétation
  rationale: En araméen biblique, le terme désigne couramment l’interprétation d’un rêve ou d’un mystère; ce choix convient au contexte et reste proche de la formulation source.
- source_word: מַלְכָּא
  choice: ô roi
  rationale: Le nom est employé comme vocatif. « Ô roi » conserve le registre solennel et courtois de l’adresse royale.
- source_word: וּגְזֵרַת ... הִיא
  choice: et voici le décret
  rationale: La proposition nominale présente le décret parallèlement à l’interprétation. La répétition de « voici » donne une formulation française claire sans modifier le rapport entre les deux propositions.
- source_word: עִלָּיָא
  choice: le Très-Haut
  rationale: Titre divin traditionnel et naturel en français, exprimant la souveraineté suprême de Dieu sans ajouter de précision doctrinale.
- source_word: דִּי
  choice: qui
  rationale: Le relatif introduit la proposition qui qualifie le décret; « qui » est requis en français puisque « le décret » est sujet de « a atteint ».
- source_word: מְטָת
  choice: a atteint
  rationale: Le verbe exprime l’idée d’arriver jusqu’à quelqu’un. « A atteint » conserve cette nuance et le parfait indique que le décret concerne désormais le roi.
- source_word: עַל
  choice: a atteint
  rationale: La relation exprimée par la préposition est intégrée à la construction verbale française. Ce rendu évite de préciser excessivement si le décret vient simplement sur le roi ou contre lui.
- source_word: מָרִי מַלְכָּא
  choice: mon seigneur le roi
  rationale: Cette expression respecte l’appellation honorifique de cour et distingue le roi humain du titre divin qui précède.
theological_decisions:
- issue: Traduction du titre divin עִלָּיָא
  choice: le Très-Haut
  alternative: le Suprême
  rationale: « Le Très-Haut » est un titre divin français établi qui traduit fidèlement la suprématie exprimée par l’araméen. La note signale une autre formulation possible sans atténuer la portée du titre.
- issue: Portée du décret sur le roi
  choice: qui a atteint mon seigneur le roi
  alternative: qui est venu sur mon seigneur le roi
  rationale: « A atteint » garde l’image d’un décret parvenu jusqu’au roi et ne tranche pas explicitement entre simple arrivée et action hostile, même si le contexte est celui du jugement.
translation_notes:
  register: Français international moderne, digne et intelligible. Le vocatif « ô roi » et l’expression « mon seigneur le roi » maintiennent le ton de cour, tandis que « voici » donne une syntaxe naturelle et solennelle.
