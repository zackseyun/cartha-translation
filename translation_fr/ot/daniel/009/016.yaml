  naturalness: 'Le registre est moderne, digne et approprié. La séquence « de ta ville, Jérusalem, ta montagne sainte » est toutefois difficile à lire en français : les appositions successives font provisoirement de « ta montagne sainte » une apposition de « Jérusalem » sans expliciter suffisamment le lien. « De Jérusalem, ta ville, ta montagne sainte » est plus fluide tout en conservant les désignations apposées.'
  terminology: « Seigneur », « actes de justice », « colère et fureur », « péchés », « fautes » et « objet de mépris » conviennent. La note a préserve à juste titre l’alternative abstraite « justice » et la portée concrète du pluriel. La note b explique correctement que « pères » désigne les générations antérieures.
