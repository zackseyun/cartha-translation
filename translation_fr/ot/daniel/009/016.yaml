source:
  edition: WLC
  text: אֲדֹנָ֗/י כְּ/כָל צִדְקֹתֶ֨/ךָ֙ יָֽשָׁב נָ֤א אַפְּ/ךָ֙ וַ/חֲמָ֣תְ/ךָ֔ מֵ/עִֽירְ/ךָ֥ יְרוּשָׁלִַ֖ם הַר קָדְשֶׁ֑/ךָ כִּ֤י בַ/חֲטָאֵ֨י/נוּ֙ וּ/בַ/עֲוֺנ֣וֹת אֲבֹתֵ֔י/נוּ יְרוּשָׁלִַ֧ם וְ/עַמְּ/ךָ֛ לְ/חֶרְפָּ֖ה לְ/כָל סְבִיבֹתֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/016.yaml
  text: Lord[a], according to all your righteous acts, please let your anger and your wrath turn away from your city Jerusalem, your holy mountain; because through our sins and the iniquities of our fathers[b], Jerusalem and your people have become a reproach to all those around us.
translation:
  language: fr
  text: Seigneur, conformément à tous tes actes de justice[a], que ta colère et ta fureur se détournent, je t’en prie, de Jérusalem, ta ville, ta montagne sainte ! Car, à cause de nos péchés et des fautes de nos ancêtres[b], Jérusalem et ton peuple sont un objet de mépris pour tous ceux qui nous entourent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conformément à toute ta justice » ou « à toutes tes œuvres justes ». Le mot hébreu est au pluriel et évoque probablement les manifestations concrètes de la justice de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de nos pères » ; il s’agit ici des générations précédentes, des ancêtres du peuple.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin employé en adresse directe ; « Seigneur » est naturel, digne et fidèle sans ajouter un possessif absent.
- source_word: כְּכָל צִדְקֹתֶיךָ
  choice: conformément à tous tes actes de justice
  rationale: La préposition כְּ indique la norme invoquée, et le pluriel צִדְקוֹת désigne vraisemblablement les manifestations concrètes de la justice de Dieu.
- source_word: יָשָׁב נָא
  choice: que ... se détournent, je t’en prie
  rationale: Le jussif accompagné de נָא exprime une supplication ; שוב signifie ici se détourner ou revenir en arrière.
- source_word: אַפְּךָ וַחֲמָתְךָ
  choice: ta colère et ta fureur
  rationale: אַף est l’expression idiomatique de la colère, tandis que חֵמָה en renforce l’intensité ; deux termes distincts sont conservés.
- source_word: מֵעִירְךָ יְרוּשָׁלַם הַר קָדְשֶׁךָ
  choice: de ta ville, Jérusalem, ta montagne sainte
  rationale: 'La construction appositionnelle est préservée : Jérusalem est la ville de Dieu et sa montagne sainte.'
- source_word: בַחֲטָאֵינוּ וּבַעֲוֹנוֹת אֲבֹתֵינוּ
  choice: à cause de nos péchés et des fautes de nos ancêtres
  rationale: Le beth a ici une valeur causale. « Fautes » distingue עָוֹן de חֵטְא sans imposer un vocabulaire technique, et « ancêtres » exprime le référent intergénérationnel de אָבוֹת.
- source_word: לְחֶרְפָּה
  choice: sont devenus un objet de mépris
  rationale: La tournure française rend naturellement l’état résultant exprimé par לְ, sans ajouter un verbe d’action précis absent de l’hébreu.
- source_word: לְכָל סְבִיבֹתֵינוּ
  choice: pour tous ceux qui nous entourent
  rationale: Le substantif désigne ici les peuples ou personnes des alentours ; cette formulation est idiomatique en français.
theological_decisions:
- issue: Portée de צִדְקֹתֶיךָ dans l’appel adressé à Dieu
  choice: tes actes de justice
  alternative: ta justice ; tes œuvres justes
  rationale: Le pluriel favorise des interventions concrètes conformes à la justice divine, tout en laissant ouverte leur dimension salvatrice, judiciaire ou liée à l’alliance.
- issue: Solidarité collective et intergénérationnelle dans la confession
  choice: nos péchés et les fautes de nos ancêtres
  alternative: nos péchés et les fautes de nos pères
  rationale: Le texte distingue la génération présente des générations antérieures et les associe dans la confession. « Ancêtres » indique clairement la portée historique sans restreindre artificiellement la référence aux pères immédiats.
- issue: État de Jérusalem et du peuple comme חֶרְפָּה
  choice: sont devenus un objet de mépris
  alternative: sont un objet de mépris ; sont livrés à l’opprobre
  rationale: Cette formulation communique le résultat historique de leurs péchés tout en évitant d’expliciter davantage que le texte la manière dont cet état est survenu.
translation_notes:
  register: Français international moderne, digne et accessible. La supplication est rendue sans archaïsme par « je t’en prie ». La phrase conserve le parallélisme « colère et fureur », les appositions concernant Jérusalem et la confession collective.
