base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/022.yaml
  text: He made me understand[a], and spoke with me, and said, “Daniel[b], I have now come out to give you insight and understanding.”
translation:
  language: fr
  text: 'Il me fit comprendre, me parla et dit : « Daniel, maintenant, je suis sorti pour te donner intelligence et discernement. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֶן
  choice: Il m’instruisit
  rationale: 'Le verbe est compris dans son sens causatif : le messager amène Daniel à comprendre. « Il m’instruisit » est naturel en français et évite la lourdeur de « il me fit comprendre » sans préciser indûment le contenu.'
- source_word: וַיְדַבֵּר עִמִּי
  choice: puis me parla
  rationale: דבר עם signifie parler avec quelqu’un. En français narratif, « me parla » rend naturellement la relation exprimée, tandis que « parla avec moi » pourrait suggérer un échange réciproque que le contexte ne développe pas.
- source_word: וַיֹּאמַר
  choice: et dit
  rationale: Formule narrative ordinaire introduisant le discours direct.
- source_word: דָּנִיֵּאל
  choice: Daniel
  rationale: Forme française traditionnelle et courante du nom.
- source_word: עַתָּה
  choice: maintenant
  rationale: Adverbe temporel conservé explicitement.
- source_word: יָצָאתִי
  choice: je suis sorti
  rationale: Rend directement le verbe יצא sans résoudre son orientation déictique en « je suis venu » ou « je suis parti »; le contexte peut évoquer le départ du messager pour accomplir sa mission.
- source_word: לְהַשְׂכִּילְךָ
  choice: pour te donner intelligence
  rationale: Le hifil de שכל exprime ici l’action de rendre perspicace ou de communiquer l’intelligence nécessaire. Cette formulation conserve la valeur causative.
- source_word: בִינָה
  choice: compréhension
  rationale: Le nom désigne la compréhension ou le discernement. « Compréhension » maintient la distinction lexicale avec שכל tout en formant un binôme intelligible en français.
theological_decisions:
- issue: Origine et direction de la mission du messager dans יָצָאתִי
  choice: je suis sorti
  alternative: je suis venu / je suis parti
  rationale: Le texte affirme littéralement une sortie sans nommer ici son point de départ ni imposer une perspective française précise. La traduction préserve cette retenue et n’ajoute pas explicitement une provenance céleste.
translation_notes:
  register: Français moderne, soutenu mais accessible. Le passé simple convient au récit biblique écrit; la coordination est légèrement allégée par « puis » tout en préservant la succession des actions.
