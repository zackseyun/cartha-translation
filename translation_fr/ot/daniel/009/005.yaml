id: DAN.9.5
reference: Daniel 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָטָ֥אנוּ וְ/עָוִ֖ינוּ ו/הרשענו וּ/מָרָ֑דְנוּ וְ/ס֥וֹר מִ/מִּצְוֺתֶ֖/ךָ וּ/מִ/מִּשְׁפָּטֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/005.yaml
  text: We have sinned and done wrong and acted wickedly and rebelled[b][a], turning aside from your commandments and your judgments.
translation:
  language: fr
  text: Nous avons péché, nous avons commis l’iniquité[a], nous avons agi avec méchanceté et nous nous sommes révoltés, nous détournant de tes commandements et de tes jugements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avons mal agi » ou « nous avons agi de manière perverse ». Le verbe hébreu évoque ce qui est tortueux, pervers ou coupable.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes prescriptions ». Le terme hébreu peut désigner des décisions de justice, des jugements ou des règles prescrites.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: Nous avons péché
  rationale: Le qal accompli à la première personne du pluriel de חטא est le verbe courant pour pécher. Le passé composé convient au caractère rétrospectif de la confession.
- source_word: וְעָוִינוּ
  choice: nous avons commis l’iniquité
  rationale: Le verbe עוה évoque ce qui est moralement tortueux, pervers ou coupable. Cette formulation distingue ce terme de חטא tout en conservant le registre solennel de la prière.
- source_word: וְהִרְשַׁעְנוּ
  choice: nous avons agi avec méchanceté
  rationale: Le hiphil de רשע désigne le fait d’agir en méchant ou de faire le mal. La tournure verbale préserve cette nuance sans confondre le terme avec le précédent.
- source_word: וּמָרָדְנוּ
  choice: nous nous sommes révoltés
  rationale: מרד signifie se révolter ou se rebeller. La forme pronominale est naturelle en français et exprime la défiance envers Dieu présente dans le contexte d’alliance.
- source_word: וְסוֹר
  choice: nous détournant
  rationale: La forme de סור poursuit la série confessionnelle avec l’idée de s’écarter ou de se détourner. Le participe présent relie naturellement cet acte aux verbes précédents sans en faire une simple conséquence.
- source_word: מִמִּצְוֺתֶיךָ
  choice: de tes commandements
  rationale: מִצְוָה désigne un commandement ou un ordre. « Commandements » maintient le registre biblique et la portée liée à l’alliance.
- source_word: וּמִמִּשְׁפָּטֶיךָ
  choice: et de tes jugements
  rationale: מִשְׁפָּט peut désigner des décisions judiciaires, des jugements ou des prescriptions. « Jugements » conserve sa nuance juridique et reste intelligible en français.
theological_decisions:
- issue: Maintien de l’accumulation des verbes de confession
  choice: 'Rendre séparément les cinq éléments : pécher, commettre l’iniquité, agir avec méchanceté, se révolter et se détourner.'
  alternative: 'Regrouper les termes sous une formulation plus fluide, par exemple : « Nous avons péché, fait le mal et désobéi. »'
  rationale: L’hébreu accumule des termes proches mais distincts afin d’intensifier la confession. Les conserver évite d’atténuer sa force rhétorique et théologique.
- issue: Sens de מִשְׁפָּטִים
  choice: tes jugements
  alternative: tes prescriptions
  rationale: « Jugements » préserve la dimension juridique du terme sans exclure son emploi pour les règles ou décisions prescrites par Dieu.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « nous avons » préserve la solennité et l’intensité de la confession, tandis que les deux notes signalent les principales ambiguïtés lexicales.
