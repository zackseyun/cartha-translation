  text: וַ/יָּ֜קֶם אֶת דברי/ו אֲשֶׁר דִּבֶּ֣ר עָלֵ֗י/נוּ וְ/עַ֤ל שֹֽׁפְטֵ֨י/נוּ֙ אֲשֶׁ֣ר שְׁפָט֔וּ/נוּ לְ/הָבִ֥יא עָלֵ֖י/נוּ רָעָ֣ה גְדֹלָ֑ה אֲשֶׁ֣ר לֹֽא נֶעֶשְׂתָ֗ה תַּ֚חַת כָּל הַ/שָּׁמַ֔יִם כַּ/אֲשֶׁ֥ר נֶעֶשְׂתָ֖ה בִּ/ירוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/012.yaml
  text: He has confirmed his words that he spoke against us and against our judges who judged us[a], by bringing upon us a great disaster such as had not been done under all heaven, as it was done in Jerusalem.
translation:
  language: fr
  text: Il a confirmé les paroles qu’il avait prononcées contre nous et contre nos juges qui nous ont jugés[a], en faisant venir sur nous un grand malheur, tel qu’il ne s’en était jamais produit sous le ciel entier, comme il s’en est produit à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos dirigeants qui nous gouvernaient ». Les termes hébreux traduits par « juges » et « jugés » peuvent désigner plus largement les autorités qui exercent le pouvoir, et pas seulement des juges siégeant dans un tribunal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Il a confirmé
  rationale: Le hifil de קום avec « paroles » signifie les confirmer, les accomplir ou les faire tenir. « A confirmé » exprime que Dieu a rendu effectives les paroles de jugement qu’il avait prononcées.
- source_word: דבריו אֲשֶׁר דִּבֶּר עָלֵינוּ
  choice: les paroles qu’il avait prononcées contre nous
  rationale: Le pluriel de דבריו est conservé. Dans ce contexte de jugement, דבר על a une valeur défavorable, bien rendue par « prononcées contre nous ».
- source_word: שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ
  choice: nos juges qui nous gouvernaient
  rationale: שפט peut désigner aussi bien l’exercice du jugement que celui du gouvernement. La formulation conserve « juges » tout en signalant, par le verbe « gouvernaient », la portée politique plus large de l’expression.
- source_word: לְהָבִיא עָלֵינוּ
  choice: en faisant venir sur nous
  rationale: L’infinitif indique ici le moyen par lequel les paroles ont été confirmées. « En faisant venir » est naturel en français et conserve l’idée causative.
- source_word: רָעָה גְדֹלָה
  choice: un grand malheur
  rationale: Dans un contexte de châtiment, רעה désigne une calamité plutôt qu’un mal moral. « Grand malheur » convient au registre de la prière et reste accessible.
- source_word: אֲשֶׁר לֹא נֶעֶשְׂתָה תַּחַת כָּל הַשָּׁמַיִם
  choice: tel qu’il ne s’en était jamais produit sous le ciel entier
  rationale: Cette formulation rend naturellement en français le caractère sans précédent de la calamité, tout en conservant l’image hébraïque « sous le ciel entier ».
- source_word: כַּאֲשֶׁר נֶעֶשְׂתָה בִּירוּשָׁלָם
  choice: comme celui qui s’est produit à Jérusalem
  rationale: Le féminin hébreu renvoie au malheur ou à la calamité. Le pronom « celui » clarifie ce référent en français sans changer le sens.
theological_decisions:
- issue: Référent du sujet implicite
  choice: Le pronom « Il » désigne Dieu, conformément au contexte immédiat de la prière.
  alternative: Insérer explicitement « Dieu » comme sujet.
  rationale: L’hébreu poursuit avec un sujet implicite clairement identifiable dans le contexte. Garder le pronom respecte la forme du texte sans effacer le référent théologique.
translation_notes:
  register: 'Français moderne, digne et accessible. La traduction vise une équivalence optimale : elle conserve la répétition lexicale partielle autour de « juges » tout en rendant explicite la portée gouvernementale possible de שפט. Le tour « sous le ciel entier » maintient l’image hébraïque sans paraître archaïque.'
