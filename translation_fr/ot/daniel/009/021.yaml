source:
  edition: WLC
  text: וְ/ע֛וֹד אֲנִ֥י מְדַבֵּ֖ר בַּ/תְּפִלָּ֑ה וְ/הָ/אִ֣ישׁ גַּבְרִיאֵ֡ל אֲשֶׁר֩ רָאִ֨יתִי בֶ/חָז֤וֹן בַּ/תְּחִלָּה֙ מֻעָ֣ף בִּ/יעָ֔ף נֹגֵ֣עַ אֵלַ֔/י כְּ/עֵ֖ת מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/021.yaml
  text: while I was still speaking in prayer[a], the man Gabriel, whom I had seen in the vision at the beginning, came to me in swift flight at the time of the evening offering.
translation:
  language: fr
  text: Alors que je parlais encore dans la prière, l’homme Gabriel, que j’avais vu dans la vision au début, vint jusqu’à moi d’un vol rapide[a], au moment de l’offrande du soir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement : « épuisé » ou « dans l’épuisement », plutôt que « d’un vol rapide ». L’expression hébraïque est difficile.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר בַּתְּפִלָּה
  choice: Alors que je parlais encore dans la prière
  rationale: La tournure exprime une action en cours au moment de l’arrivée de Gabriel. « Dans la prière » conserve l’expression concrète du texte hébreu sans la réduire simplement à « je priais ».
- source_word: הָאִישׁ גַּבְרִיאֵל
  choice: l’homme Gabriel
  rationale: Daniel présente Gabriel sous une apparence humaine. Cette formulation proche de l’hébreu préserve cette caractérisation sans expliciter sa nature angélique.
- source_word: אֲשֶׁר רָאִיתִי בֶחָזוֹן בַּתְּחִלָּה
  choice: que j’avais vu dans la vision au début
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité de cette vision. « Au début » rend בַּתְּחִלָּה sans préciser davantage le référent temporel.
- source_word: מֻעָף בִּיעָף
  choice: d’un vol rapide
  rationale: La lecture traditionnelle et contextuellement probable comprend la formule comme une description du déplacement rapide de Gabriel. L’hébreu demeure difficile, ce qui justifie une note signalant l’autre analyse.
- source_word: נֹגֵעַ אֵלַי
  choice: s’approcha de moi
  rationale: נגע peut signifier « toucher » ou « atteindre ». Dans ce contexte d’arrivée, « s’approcha de moi » exprime le mouvement sans affirmer un contact physique qui reste incertain.
- source_word: כְּעֵת מִנְחַת עָרֶב
  choice: au moment de l’offrande du soir
  rationale: La formule situe l’événement à l’heure de l’offrande régulière du soir. « Offrande » conserve la portée de מִנְחָה sans la limiter explicitement à une offrande de céréales.
theological_decisions:
- issue: Sens de מֻעָף בִּיעָף et nature du déplacement de Gabriel
  choice: Gabriel s’approche d’un vol rapide.
  alternative: Gabriel s’approche épuisé ou dans l’épuisement.
  rationale: La formule hébraïque est difficile. Le contexte d’une arrivée soudaine favorise le sens lié au vol rapide, mais l’analyse fondée sur la fatigue demeure assez notable pour être conservée en note plutôt que supprimée.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; le vocabulaire évite de surinterpréter le contact physique, le type précis d’offrande et l’expression difficile décrivant l’arrivée de Gabriel.
