  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֤כֶת בְּ/תֽוֹרֹתָי/ו֙ אֲשֶׁ֣ר נָתַ֣ן לְ/פָנֵ֔י/נוּ בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/010.yaml
  text: and we have not obeyed the voice of Yahweh our God[a], to walk in his laws, which he set before us through his servants the prophets.
translation:
  language: fr
  text: Nous n’avons pas écouté la voix de Yahweh, notre Dieu, en suivant ses lois, qu’il a placées devant nous par l’intermédiaire de ses serviteurs, les prophètes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main de ses serviteurs, les prophètes » ; cette expression signifie « par l’intermédiaire de ses serviteurs, les prophètes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ בְּקוֹל
  choice: nous n’avons pas écouté la voix de
  rationale: La construction שׁמע בְּקוֹל implique une écoute qui se traduit par l’obéissance. « Écouter la voix de » demeure naturel en français biblique actuel et conserve à la fois l’image de la voix et la portée d’obéissance.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh notre Dieu
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », tandis que le suffixe de première personne du pluriel est rendu par « notre ».
- source_word: לָלֶכֶת
  choice: pour suivre
  rationale: L’infinitif exprime ici la conduite attendue comme conséquence de l’écoute. « Suivre » rend naturellement en français la métaphore hébraïque de la marche sans la réduire à un déplacement physique.
- source_word: בְּתוֹרֹתָיו
  choice: ses lois
  rationale: Le pluriel de תּוֹרָה désigne ici les directives divines données à Israël. « Lois » convient au contexte d’infidélité à l’alliance, tout en gardant le pluriel du texte.
- source_word: אֲשֶׁר נָתַן לְפָנֵינוּ
  choice: qu’il avait placées devant nous
  rationale: L’expression signifie présenter ou mettre quelque chose devant quelqu’un. Le plus-que-parfait situe clairement cet acte divin avant la désobéissance confessée.
- source_word: בְּיַד
  choice: par l’intermédiaire de
  rationale: Littéralement « par la main de », l’expression marque l’agence ou la médiation. « Par l’intermédiaire de » en communique clairement le sens en français moderne.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: ses serviteurs les prophètes
  rationale: Dans cette formule de mission, עֶבֶד désigne ceux qui sont au service de Dieu; « serviteurs » est donc plus approprié que « esclaves ». L’apposition « les prophètes » identifie ces serviteurs.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom divin personnel; sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Portée de תּוֹרָה au pluriel
  choice: lois
  alternative: instructions
  rationale: Le contexte de conduite et de désobéissance à l’alliance favorise « lois », sans nier que תּוֹרָה puisse avoir le sens plus large d’enseignement ou d’instruction.
- issue: Valeur de שׁמע בְּקוֹל
  choice: écouter la voix de
  alternative: obéir à
  rationale: « Écouter la voix de » conserve l’expression hébraïque et sa dimension relationnelle, tandis que le contexte indique qu’il s’agit d’une écoute obéissante.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve « la voix de » et le nom Yahweh, tout en rendant naturellement la métaphore de la marche par « suivre ». Le marqueur de note [a] est placé après l’expression qu’il explique.
