    issue: Valeur de l’infinitif לָלֶכֶת
    rationale: '« Pour suivre » suggère une finalité, alors que l’infinitif indique le comportement correspondant à l’écoute-obéissance : marcher/suivre les lois. « En suivant » rend mieux ce lien.'
  - severity: low
    issue: Temps de « qu’il avait placées »
    rationale: Le plus-que-parfait introduit une antériorité explicite que le parfait hébreu ne demande pas. Le passé composé français est plus neutre dans cette confession.
  - severity: low
    issue: Position de l’ancre de note
    rationale: L’ancre doit suivre directement « par l’intermédiaire de », expression que la note documente, plutôt que la phrase entière.
