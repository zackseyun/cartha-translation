- from: et nous n’avons pas écouté la voix de Yahweh notre Dieu, pour suivre ses lois, qu’il avait placées devant nous par l’intermédiaire de ses serviteurs les prophètes.[a]
  to: Nous n’avons pas écouté la voix de Yahweh, notre Dieu, en suivant ses lois, qu’il a placées devant nous par l’intermédiaire de ses serviteurs, les prophètes[a].
  rationale: La révision conserve la formulation biblique « écouter la voix de », tout en corrigeant la relation de l’infinitif par « en suivant ». Elle évite l’antériorité ajoutée par le plus-que-parfait et place l’ancre au contact de l’idiome expliqué.
