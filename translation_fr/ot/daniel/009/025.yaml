source:
  edition: WLC
  text: וְ/תֵדַ֨ע וְ/תַשְׂכֵּ֜ל מִן מֹצָ֣א דָבָ֗ר לְ/הָשִׁיב֙ וְ/לִ/בְנ֤וֹת יְרֽוּשָׁלִַ֨ם֙ עַד מָשִׁ֣יחַ נָגִ֔יד שָׁבֻעִ֖ים שִׁבְעָ֑ה וְ/שָׁבֻעִ֞ים שִׁשִּׁ֣ים וּ/שְׁנַ֗יִם תָּשׁוּב֙ וְ/נִבְנְתָה֙ רְח֣וֹב וְ/חָר֔וּץ וּ/בְ/צ֖וֹק הָ/עִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/025.yaml
  text: 'So know and understand: from the issuing of the word to restore and rebuild Jerusalem until an anointed one[a], a prince, there will be seven weeks, and for sixty-two weeks it will be restored and rebuilt, with plaza and moat[c][b], but in troubled times.'
translation:
  language: fr
  text: 'Sache donc et comprends : depuis que la parole a été prononcée pour rétablir et rebâtir Jérusalem jusqu’à un oint[a], un chef, il y aura sept semaines[b] ; et, pendant soixante-deux semaines[b], elle sera rétablie et rebâtie, avec une place publique et un fossé[c], mais en des temps de détresse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Messie, un chef » ou « le Messie, le Prince ». L’hébreu porte littéralement « oint, chef/prince ».
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque peut aussi se traduire par « sept septaines » et « soixante-deux septaines ». Elle ne précise pas ici explicitement la nature des unités comptées.
    reason: lexical_alternative
  - marker: c
    text: Ou « une place et une tranchée ». Le sens du terme hébreu traduit par « fossé » est incertain ; il pourrait désigner une tranchée ou un fossé défensif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתֵדַע וְתַשְׂכֵּל
  choice: Sache-le donc et comprends
  rationale: Les deux verbes invitent Daniel à connaître et à discerner. Cette formulation française est naturelle, tout en conservant le parallélisme cognitif de l’hébreu.
- source_word: מִן מֹצָא דָבָר
  choice: depuis la promulgation de la parole
  rationale: מֹצָא évoque la sortie ou l’émission, et דָבָר peut désigner une parole, une affaire ou un décret. « Promulgation de la parole » rend le caractère officiel du contexte sans remplacer explicitement « parole » par « décret ».
- source_word: לְהָשִׁיב וְלִבְנוֹת יְרוּשָׁלִַם
  choice: ordonnant de rétablir et de rebâtir Jérusalem
  rationale: Les infinitifs expriment le but ou le contenu de la parole. « Rétablir et rebâtir » convient au renouvellement politique et matériel de la ville.
- source_word: עַד מָשִׁיחַ נָגִיד
  choice: jusqu’à un oint, un chef
  rationale: מָשִׁיחַ signifie lexicalement « oint » sans imposer ici une identification unique, tandis que נָגִיד désigne un dirigeant, chef ou prince. « Chef » reste digne et suffisamment large.
- source_word: שָׁבֻעִים שִׁבְעָה / שָׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: sept semaines / soixante-deux semaines
  rationale: שָׁבֻעִים désigne des unités de sept et se rend traditionnellement par « semaines ». L’alternative plus littérale « septaines » est signalée en note afin de ne pas trancher la chronologie.
- source_word: תָּשׁוּב וְנִבְנְתָה
  choice: elle sera rétablie et rebâtie
  rationale: Les formes féminines renvoient à Jérusalem. La formulation exprime son rétablissement et sa reconstruction sans le tour français peu naturel « elle reviendra et sera bâtie ».
- source_word: רְחוֹב
  choice: place publique
  rationale: Le terme évoque un espace urbain large et ouvert, souvent une place, plutôt qu’une rue étroite.
- source_word: חָרוּץ
  choice: fossé
  rationale: Dans ce contexte urbain, le mot difficile peut désigner une tranchée ou un ouvrage défensif. « Fossé » demeure intelligible et moins spécifique que « douves ».
- source_word: וּבְצוֹק הָעִתִּים
  choice: mais en des temps de détresse
  rationale: La locution décrit une période d’oppression ou d’angoisse. Le contraste « mais » rend naturellement la portée adversative du contexte.
theological_decisions:
- issue: Faut-il rendre מָשִׁיחַ par le titre « Messie » dans le texte principal ?
  choice: Employer « un oint » dans le texte principal.
  alternative: « le Messie », « un messie » ou « le Messie, le Prince »
  rationale: Le nom hébreu signifie d’abord une personne ointe et n’identifie pas à lui seul le personnage de façon univoque. La traduction principale conserve donc l’indétermination grammaticale et lexicale, tandis que la lecture messianique traditionnelle figure en note.
- issue: Comment rendre שָׁבֻעִים dans cette prophétie ?
  choice: Employer « semaines » dans le texte principal.
  alternative: « septaines » ou « périodes de sept ans »
  rationale: Le mot désigne une unité de sept. « Semaines » est la traduction française conventionnelle et lexicalement possible, mais la note conserve « septaines » sans préciser qu’il s’agit nécessairement d’années.
- issue: Comment articuler les sept semaines et les soixante-deux semaines ?
  choice: Présenter les soixante-deux semaines comme la période durant laquelle Jérusalem est rétablie et rebâtie.
  alternative: Additionner directement les deux périodes avant la proposition sur la reconstruction.
  rationale: La syntaxe et l’accentuation hébraïques ont donné lieu à plusieurs ponctuations. La formulation retenue suit une lecture possible du texte en rattachant la seconde période à la reconstruction, sans fusionner les deux nombres en une seule durée.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le verset conserve le vocabulaire concret de la reconstruction et évite de résoudre dans le texte principal l’identité de l’oint, la nature des « semaines » et l’incertitude du terme חָרוּץ.
