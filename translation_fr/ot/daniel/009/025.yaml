  source_fidelity: 'La traduction conserve les principaux éléments du texte massorétique : le double appel à savoir et comprendre, l’émission d’une parole concernant le rétablissement et la reconstruction de Jérusalem, l’« oint » qualifié de dirigeant, les deux durées, puis la reconstruction dans des temps de détresse. La distinction entre les sept semaines et les soixante-deux semaines suit une ponctuation possible, également reflétée dans l’audit anglais. Une légère révision rend plus directement מִן מֹצָא דָבָר sans l’implication administrative un peu forte de « promulgation » et sans l’objet ajouté dans « Sache-le ».'
