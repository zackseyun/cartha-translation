source:
  edition: WLC
  text: וְ/לֹ֤א שָׁמַ֨עְנוּ֙ אֶל עֲבָדֶ֣י/ךָ הַ/נְּבִיאִ֔ים אֲשֶׁ֤ר דִּבְּרוּ֙ בְּ/שִׁמְ/ךָ֔ אֶל מְלָכֵ֥י/נוּ שָׂרֵ֖י/נוּ וַ/אֲבֹתֵ֑י/נוּ וְ/אֶ֖ל כָּל עַ֥ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/006.yaml
  text: We have not listened to your servants the prophets[a], who spoke in your name to our kings, our officials, our fathers[b], and to all the people of the land.
translation:
  language: fr
  text: Nous n’avons pas écouté[a] tes serviteurs, les prophètes, qui ont parlé en ton nom à nos rois, à nos dirigeants, à nos pères[b] et à tout le peuple du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous n’avons pas obéi ». Le verbe hébreu peut désigner une écoute qui conduit à tenir compte de ce qui est dit, et non le simple fait d’entendre.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « nos ancêtres ». Littéralement : « nos pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: nous n’avons pas écouté
  rationale: Avec אֶל, le verbe שׁמע signifie écouter quelqu’un, avec l’idée possible de tenir compte de ses paroles. « Écouté » conserve à la fois le sens auditif et l’implication d’obéissance sans réduire le terme à cette dernière.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: tes serviteurs, les prophètes
  rationale: « Serviteurs » convient au service honorifique de Dieu accompli par les prophètes. L’apposition explicative est conservée.
- source_word: דִּבְּרוּ בְּשִׁמְךָ
  choice: ont parlé en ton nom
  rationale: Cette expression naturelle et proche de l’hébreu conserve les idées d’autorisation et de représentation divines.
- source_word: מְלָכֵינוּ
  choice: nos rois
  rationale: Rendu direct du premier groupe de destinataires.
- source_word: שָׂרֵינוּ
  choice: nos dirigeants
  rationale: שׂרים désigne les détenteurs d’une autorité politique ou administrative. « Dirigeants » est clair en français moderne sans restreindre le terme à une noblesse héréditaire.
- source_word: אֲבֹתֵינוּ
  choice: nos pères
  rationale: Le rendu littéral préserve la forme masculine de l’hébreu et son expression traditionnelle des générations antérieures; une note signale le sens contextuel « ancêtres ».
- source_word: כָּל עַם הָאָרֶץ
  choice: tout le peuple du pays
  rationale: עַם est un collectif singulier, et הָאָרֶץ désigne ici naturellement le pays ou territoire dont toute la population est visée.
theological_decisions:
- issue: שָׁמַעְנוּ exprime-t-il simplement l’écoute ou explicitement l’obéissance ?
  choice: nous n’avons pas écouté
  alternative: nous n’avons pas obéi
  rationale: La confession implique la désobéissance, mais le verbe hébreu est plus large. « Écouté » préserve cette amplitude sémantique et laisse le contexte porter la force morale.
- issue: אֲבֹתֵינוּ doit-il être rendu littéralement ou généralisé ?
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » reflète directement le masculin pluriel hébreu, tandis que la note explicite sa portée possible aux générations antérieures.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient à la confession d’un manquement passé dont les conséquences demeurent présentes. La répétition de « à » clarifie la série des destinataires, et les notes préservent les principales ambiguïtés lexicales.
