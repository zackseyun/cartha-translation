  text: הַטֵּ֨ה אֱלֹהַ֥/י אָזְנְ/ךָ֮ וּֽ/שֲׁמָע֒ פקח/ה עֵינֶ֗י/ךָ וּ/רְאֵה֙ שֹֽׁמְמֹתֵ֔י/נוּ וְ/הָ/עִ֕יר אֲשֶׁר נִקְרָ֥א שִׁמְ/ךָ֖ עָלֶ֑י/הָ כִּ֣י לֹ֣א עַל צִדְקֹתֵ֗י/נוּ אֲנַ֨חְנוּ מַפִּילִ֤ים תַּחֲנוּנֵ֨י/נוּ֙ לְ/פָנֶ֔י/ךָ כִּ֖י עַל רַחֲמֶ֥י/ךָ הָ/רַבִּֽים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/018.yaml
  text: Incline your ear[a], my God, and hear; open your eyes and see our desolations and the city that is called by your name. For we are not presenting our pleas before you because of our righteousnesses[b], but because of your abundant mercies.
translation:
  language: fr
  text: Mon Dieu, tends ton oreille et écoute ! Ouvre les yeux et vois nos dévastations, ainsi que la ville qui porte ton nom[a]. Car ce n’est pas à cause de nos actes justes[b] que nous présentons devant toi nos supplications, mais à cause de tes grandes compassions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la ville sur laquelle ton nom est appelé ». Cette expression indique que la ville est associée au nom de Dieu et lui appartient.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nos justices », c’est-à-dire nos actes justes ou les titres que nous pourrions faire valoir comme justes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: tends l’oreille
  rationale: Conserve l’image anthropomorphique et l’impératif de la prière dans une expression française naturelle.
- source_word: שֹׁמְמֹתֵינוּ
  choice: nos lieux dévastés
  rationale: Le pluriel peut désigner les réalités ou les lieux dévastés. Cette formulation convient au parallèle avec la ville sans réduire le terme aux seules ruines matérielles.
- source_word: אֲשֶׁר נִקְרָא שִׁמְךָ עָלֶיהָ
  choice: sur laquelle ton nom est invoqué
  rationale: Reproduit de près l’idiome hébreu et maintient l’idée d’appartenance et d’association au nom divin.
- source_word: מַפִּילִים תַּחֲנוּנֵינוּ לְפָנֶיךָ
  choice: nous déposons devant toi nos supplications
  rationale: Rend naturellement l’idiome formé avec le causatif de נפל, tout en gardant l’image d’une requête placée devant Dieu.
- source_word: צִדְקֹתֵינוּ
  choice: nos actes justes
  rationale: Le pluriel hébreu peut évoquer des actes conformes à la justice ou des titres à faire valoir. Cette formulation française garde le pluriel et évite l’étrange « nos justices ».
- source_word: רַחֲמֶיךָ הָרַבִּים
  choice: tes grandes compassions
  rationale: רחמים est pluriel et exprime une profonde miséricorde; הָרַבִּים indique leur grandeur ou leur abondance. « Grandes compassions » reste naturel et proche de la forme hébraïque.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « tends l’oreille », « ouvre les yeux » et « vois »
  alternative: Paraphraser par « sois attentif » ou « prends en considération »
  rationale: Les images corporelles structurent l’appel pressant de Daniel et doivent être conservées sans les expliquer ni les atténuer.
- issue: Fondement de la supplication
  choice: Exprimer le contraste entre les actes justes humains et les compassions divines
  alternative: Généraliser en opposant le mérite humain à la miséricorde divine
  rationale: Le texte nomme explicitement « nos justices » au pluriel et « tes compassions »; la traduction conserve ce contraste sans développer une doctrine du mérite au-delà du verset.
- issue: La ville associée au nom de Dieu
  choice: « la ville sur laquelle ton nom est invoqué »
  alternative: « la ville qui porte ton nom »
  rationale: La formulation choisie préserve l’idiome et sa possible portée d’appartenance, de protection et de réputation, sans en fixer une seule explication.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs brefs conservent l’urgence de la prière. Le point d’exclamation rend la force des appels successifs sans archaïsme.
