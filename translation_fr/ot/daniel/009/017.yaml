  terminology: « Dieu », « serviteur », « supplications », « visage », « sanctuaire » et « Seigneur » sont appropriés. Le maintien de « Seigneur » à la troisième personne dans le texte principal préserve la forme inhabituelle de l’hébreu sans imposer l’interprétation directe proposée en note.
