  text: וְ/עַתָּ֣ה שְׁמַ֣ע אֱלֹהֵ֗י/נוּ אֶל תְּפִלַּ֤ת עַבְדְּ/ךָ֙ וְ/אֶל תַּ֣חֲנוּנָ֔י/ו וְ/הָאֵ֣ר פָּנֶ֔י/ךָ עַל מִקְדָּשְׁ/ךָ֖ הַ/שָּׁמֵ֑ם לְמַ֖עַן אֲדֹנָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/017.yaml
  text: And now[a], our God, hear the prayer of your servant and his pleas for mercy, and let your face shine upon your sanctuary, which lies desolate, for the Lord’s sake.
translation:
  language: fr
  text: Et maintenant, notre Dieu, écoute la prière de ton serviteur et ses supplications, et fais briller ton visage sur ton sanctuaire qui est dévasté, pour l’amour du Seigneur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour l’amour de toi-même, Seigneur ». L’hébreu dit « pour l’amour du Seigneur » et emploie un titre divin à la troisième personne au sein d’une adresse directe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien assuré par וְ et la reprise temporelle marquée par עַתָּה.
- source_word: שְׁמַע
  choice: écoute
  rationale: Dans une prière adressée directement à Dieu, « écoute » est naturel en français moderne et exprime l’appel à prêter attention favorablement.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom avec le suffixe de première personne du pluriel.
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: la prière de ton serviteur
  rationale: Préserve la relation construite et le registre d’humble adresse à Dieu.
- source_word: תַּחֲנוּנָיו
  choice: ses supplications
  rationale: Le terme désigne des demandes instantes de faveur ou de compassion ; « supplications » en conserve la force dans un registre digne et intelligible.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: et fais briller ton visage
  rationale: Reproduit la forme causative et conserve l’image biblique du visage divin qui brille comme expression de faveur.
- source_word: עַל מִקְדָּשְׁךָ
  choice: sur ton sanctuaire
  rationale: « Sanctuaire » rend מִקְדָּשׁ sans réduire son sens au seul bâtiment du temple.
- source_word: הַשָּׁמֵם
  choice: qui est dévasté
  rationale: La proposition relative française exprime naturellement l’état de désolation du sanctuaire tout en gardant sa force descriptive.
- source_word: לְמַעַן אֲדֹנָי
  choice: à cause du Seigneur
  rationale: לְמַעַן indique ici le motif ou la considération déterminante. La traduction maintient le titre divin à la troisième personne, conformément à la formulation hébraïque inhabituelle.
theological_decisions:
- issue: Référence divine à la troisième personne dans לְמַעַן אֲדֹנָי
  choice: à cause du Seigneur
  alternative: pour l’amour de toi-même, Seigneur
  rationale: Bien que Daniel parle directement à Dieu, l’hébreu emploie אֲדֹנָי, « Seigneur », et non un pronom de deuxième personne. Le texte principal préserve cette tension grammaticale et rhétorique ; la note donne la reformulation directe possible sans l’imposer.
translation_notes:
  register: Français international moderne, digne et adapté à la prière. Le tutoiement maintient la cohérence des suffixes hébreux singuliers et l’usage biblique français courant. L’expression « fais briller ton visage » conserve volontairement la métaphore traditionnelle plutôt que de la paraphraser par « accorde ta faveur ».
