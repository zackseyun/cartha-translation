  source_fidelity: 'Le sens général est fidèle au texte massorétique : Israël est envisagé comme un tout, la transgression et le détournement sont conservés, ainsi que la double expression « la malédiction et le serment », la référence à la loi de Moïse et la confession « nous avons péché contre lui ». Toutefois, le verbe וַתִּתַּךְ exprime ici un déversement subi ; une forme passive française le rend plus exactement que le pronominal actif « se sont déversés ».'
  naturalness: Le français est globalement moderne et clair. « Alors » peut cependant se lire comme un simple repère temporel, tandis que la conjonction introduit ici la conséquence des fautes confessées. « Ainsi » rend mieux ce lien. « Ont été déversés sur nous » conserve l’image du texte et évite l’effet inhabituel selon lequel la malédiction et le serment se déverseraient eux-mêmes.
  terminology: « Tout Israël », « ta loi », « la malédiction », « le serment », « la loi de Moïse » et « serviteur de Dieu » sont appropriés. La note maintient utilement l’alternative sans résoudre de façon doctrinale le rapport précis entre la malédiction et le serment.
