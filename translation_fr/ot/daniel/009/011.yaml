    issue: « se sont déversés sur nous »
    rationale: Cette tournure pronominale est moins précise pour le passif hébreu et sonne moins naturellement avec les abstraits « malédiction » et « serment ». Le passif français rend directement le déversement subi.
  - severity: low
    issue: « Alors »
    rationale: 'Le contexte est causal-consécutif plutôt que temporel : les sanctions surviennent en conséquence du péché. « Ainsi » préserve mieux la relation logique.'
