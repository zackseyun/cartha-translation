source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל עָֽבְרוּ֙ אֶת תּ֣וֹרָתֶ֔/ךָ וְ/ס֕וֹר לְ/בִלְתִּ֖י שְׁמ֣וֹעַ בְּ/קֹלֶ֑/ךָ וַ/תִּתַּ֨ךְ עָלֵ֜י/נוּ הָ/אָלָ֣ה וְ/הַ/שְּׁבֻעָ֗ה אֲשֶׁ֤ר כְּתוּבָה֙ בְּ/תוֹרַת֙ מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֔ים כִּ֥י חָטָ֖אנוּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/011.yaml
  text: All Israel has transgressed your law and turned aside[a], not listening to your voice. So the curse and the oath that are written in the law of Moses, the servant of God, have been poured out on us, because we have sinned against him.
translation:
  language: fr
  text: Tout Israël a transgressé ta loi et s’en est détourné, sans écouter ta voix. Ainsi, la malédiction et le serment[a] inscrits dans la loi de Moïse, serviteur de Dieu, ont été déversés sur nous, parce que nous avons péché contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la malédiction jurée ». L’hébreu porte littéralement « la malédiction et le serment », expression qui renvoie probablement aux sanctions de l’alliance énoncées sous serment dans la loi de Moïse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Tout Israël
  rationale: כָל avec le nom propre Israël désigne la nation dans son ensemble. « Tout Israël » est naturel en français et conserve la portée collective de la confession.
- source_word: עָבְרוּ אֶת תּוֹרָתֶךָ
  choice: a transgressé ta loi
  rationale: עבר avec תּוֹרָה exprime ici la violation des prescriptions de l’alliance. Le singulier français s’accorde naturellement avec le nom collectif « Israël ».
- source_word: וְסוֹר
  choice: et s’en est détourné
  rationale: La forme de סור évoque le fait de s’écarter ou de se détourner. Le pronom « en » renvoie naturellement à la loi sans ajouter un objet absent du texte.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלֶךָ
  choice: sans écouter ta voix
  rationale: Cette formulation rend sobrement la construction négative et conserve l’image hébraïque d’écouter la voix de Dieu, sans expliciter davantage la volonté ou l’obéissance.
- source_word: וַתִּתַּךְ עָלֵינוּ
  choice: se sont déversés sur nous
  rationale: נתך décrit ici le déversement des sanctions. La tournure pronominale active est idiomatique en français et laisse « la malédiction et le serment » comme sujet grammatical.
- source_word: הָאָלָה וְהַשְּׁבֻעָה
  choice: la malédiction et le serment
  rationale: Les deux termes distincts sont conservés formellement. Le contexte permet d’y voir les sanctions jurées de l’alliance, mais le texte principal ne réduit pas le serment à la malédiction.
- source_word: אֲשֶׁר כְּתוּבָה בְּתוֹרַת מֹשֶׁה
  choice: inscrits dans la loi de Moïse
  rationale: « Inscrits » exprime naturellement ce qui figure dans un document. Le pluriel français se rapporte aux deux noms coordonnés, malgré le participe hébreu au féminin singulier.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: serviteur de Dieu
  rationale: Le titre honorifique de Moïse est rendu directement et dignement.
- source_word: כִּי חָטָאנוּ לוֹ
  choice: parce que nous avons péché contre lui
  rationale: חטא avec ל désigne ici le péché commis contre Dieu. Le passé composé convient au contexte de confession rétrospective.
theological_decisions:
- issue: Culpabilité collective et accord grammatical
  choice: Employer le singulier avec « Tout Israël a transgressé… s’en est détourné », puis conserver le « nous » de la confession.
  alternative: Employer une formulation plurielle telle que « tous les Israélites ont transgressé ».
  rationale: Le texte présente Israël comme une unité collective, tandis que Daniel s’inclut ensuite dans la communauté coupable. Le singulier français préserve cette solidarité nationale.
- issue: Sens du « serment » dans le contexte de l’alliance
  choice: Conserver « le serment » dans le texte principal.
  alternative: Traduire de manière interprétative par « la malédiction jurée » ou « le serment de malédiction ».
  rationale: Le passage évoque probablement les sanctions de l’alliance consignées dans la loi de Moïse, mais le maintien des deux substantifs respecte leur distinction et l’ambiguïté du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Dieu dans la prière. La formulation reste proche de l’hébreu tout en évitant les calques peu naturels.
