id: DAN.9.9
reference: Daniel 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לַֽ/אדֹנָ֣/י אֱלֹהֵ֔י/נוּ הָ/רַחֲמִ֖ים וְ/הַ/סְּלִח֑וֹת כִּ֥י מָרַ֖דְנוּ בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/009.yaml
  text: To the Lord our God belong compassion and forgiveness[a], for we have rebelled against him.
translation:
  language: fr
  text: Au Seigneur notre Dieu appartiennent la compassion et le pardon[a], car nous nous sommes rebellés contre lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les compassions et les pardons ». L’hébreu emploie les deux noms au pluriel, ce qui peut exprimer l’abondance ou avoir une valeur abstraite.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנָי
  choice: Au Seigneur appartiennent
  rationale: 'Le préfixe לְ exprime ici la possession : ces qualités appartiennent au Seigneur. Le verbe « appartiennent », sous-entendu dans la proposition nominale hébraïque, rend cette relation naturellement en français.'
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le suffixe de première personne du pluriel signifie simplement « notre » ; l’expression est maintenue avec « Seigneur » pour préserver l’adresse de la prière.
- source_word: הָרַחֲמִים
  choice: la compassion
  rationale: Bien que le nom soit morphologiquement pluriel, il peut fonctionner comme un pluriel abstrait exprimant la compassion, éventuellement dans sa plénitude. Le singulier abstrait est naturel en français moderne.
- source_word: וְהַסְּלִחוֹת
  choice: et le pardon
  rationale: Le pluriel hébreu peut désigner les actes de pardon dans leur abondance ou fonctionner comme un abstrait. « Le pardon » est l’équivalent français le plus naturel, tandis qu’une note conserve l’information sur la forme plurielle.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication qui relie la compassion et le pardon de Dieu à la confession de la rébellion du peuple.
- source_word: מָרַדְנוּ
  choice: nous nous sommes rebellés
  rationale: Le verbe מרד désigne une rébellion, et non simplement le fait de pécher. Le passé composé convient à une confession portant sur des actes passés dont la portée demeure présente.
- source_word: בּוֹ
  choice: contre lui
  rationale: Avec מרד, la préposition בְ marque la personne contre laquelle la rébellion est dirigée ; « contre lui » est donc l’expression idiomatique exacte en français.
theological_decisions:
- issue: Titre divin dans la prière
  choice: Seigneur ... Dieu
  alternative: Maître ... Dieu
  rationale: אֲדֹנָי est rendu par « Seigneur », titre divin naturel et digne dans ce contexte de prière. « Maître » est lexicalement possible, mais moins approprié ici.
translation_notes:
  register: Français international moderne, naturel et digne. La structure possessive de la proposition hébraïque est conservée au moyen de « appartiennent », et les pluriels abstraits sont rendus par des singuliers idiomatiques, avec leur nuance signalée en note.
