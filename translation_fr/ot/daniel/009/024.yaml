source:
  edition: WLC
  text: שָׁבֻעִ֨ים שִׁבְעִ֜ים נֶחְתַּ֥ךְ עַֽל עַמְּ/ךָ֣ וְ/עַל עִ֣יר קָדְשֶׁ֗/ךָ לְ/כַלֵּ֨א הַ/פֶּ֜שַׁע ו/ל/חתם חטאות וּ/לְ/כַפֵּ֣ר עָוֺ֔ן וּ/לְ/הָבִ֖יא צֶ֣דֶק עֹֽלָמִ֑ים וְ/לַ/חְתֹּם֙ חָז֣וֹן וְ/נָבִ֔יא וְ/לִ/מְשֹׁ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/024.yaml
  text: 'Seventy weeks are decreed concerning your people and your holy city: to finish the transgression[a], to seal up sins, to make atonement for iniquity, to bring in everlasting righteousness, to seal up vision and prophet[d][c][b], and to anoint the most holy place.'
translation:
  language: fr
  text: 'Soixante-dix semaines[a] ont été fixées pour ton peuple et pour ta ville sainte : pour mettre fin à la transgression, pour sceller les péchés[b], pour faire expiation pour l’iniquité, pour instaurer une justice éternelle, pour sceller vision et prophète[c], et pour oindre le lieu très saint[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « soixante-dix septaines » ; beaucoup comprennent qu’il s’agit de soixante-dix semaines d’années.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour mettre fin aux péchés ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte « vision et prophète » ; certains comprennent « vision et prophétie ».
    reason: alternative_reading
  - marker: d
    text: Ou « une réalité très sainte », éventuellement « une personne très sainte » ; l’expression hébraïque peut désigner le lieu le plus saint ou une chose d’une sainteté suprême.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁבֻעִים שִׁבְעִים
  choice: Soixante semaines
  rationale: שָׁבֻעִים désigne des semaines ou des unités de sept. « Semaines » reste naturel en français et n’introduit pas « d’années », absent du verset; l’ambiguïté est signalée en note.
- source_word: נֶחְתַּךְ
  choice: ont été fixées
  rationale: Le niphal exprime ici ce qui est déterminé, décidé ou assigné. « Ont été fixées » est clair et conserve l’idée d’une détermination ferme sans reproduire littéralement et obscurément l’image de « couper ».
- source_word: עַל עַמְּךָ וְעַל עִיר קָדְשֶׁךָ
  choice: pour ton peuple et pour ta ville sainte
  rationale: Dans ce contexte, עַל indique le champ auquel s’applique la période fixée. « Pour » est idiomatique et garde le lien avec le peuple et la ville de Daniel.
- source_word: לְכַלֵּא הַפֶּשַׁע
  choice: pour mettre fin à la révolte
  rationale: Le verbe exprime l’achèvement ou la cessation. הַפֶּשַׁע est défini et peut désigner la transgression conçue comme rébellion; « la révolte » en rend ici la force morale sans ajouter de référent.
- source_word: וְלַחְתֹּם חטאות
  choice: pour sceller les péchés
  rationale: חתם signifie littéralement « sceller ». La traduction conserve cette métaphore, dont le sens peut inclure clôture ou cessation, tandis que l’interprétation explicite est donnée en note.
- source_word: וּלְכַפֵּר עָוֺן
  choice: pour faire l’expiation de la faute
  rationale: כפר est le verbe majeur de l’expiation. La formulation conserve ses connotations cultuelles sans préciser davantage le mécanisme; עָוֺן est rendu par « faute », terme distinct de « péchés » et chargé moralement.
- source_word: וּלְהָבִיא צֶדֶק עֹלָמִים
  choice: pour instaurer une justice éternelle
  rationale: הביא peut ici signifier faire venir ou introduire. « Instaurer » exprime naturellement l’établissement de צֶדֶק, tandis que עֹלָמִים indique sa durée perpétuelle.
- source_word: וְלַחְתֹּם חָזוֹן וְנָבִיא
  choice: pour sceller vision et prophète
  rationale: Le texte vocalisé porte נָבִיא, « prophète », et non le nom abstrait « prophétie ». La traduction directe préserve cette donnée inhabituelle ainsi que la métaphore de חתם.
- source_word: וְלִמְשֹׁחַ
  choice: pour consacrer par l’onction
  rationale: משׁח signifie « oindre ». Avec un lieu ou objet sacré comme complément probable, « consacrer par l’onction » rend clairement en français la fonction de cette onction sans effacer le geste.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: le lieu très saint
  rationale: L’expression superlative désigne souvent un espace ou un objet d’une sainteté suprême. « Le lieu très saint » est naturel dans ce contexte, mais le caractère non explicite du référent et la lecture personnelle possible sont conservés en note.
theological_decisions:
- issue: Référent de קֹדֶשׁ קָדָשִׁים
  choice: le lieu très saint
  alternative: une personne très sainte; une chose très sainte; le Saint des saints
  rationale: La formule désigne régulièrement un espace du sanctuaire ou une réalité consacrée et n’identifie pas explicitement une personne. Le texte principal retient le référent spatial le plus naturel sans imposer une identification messianique; la note préserve les autres possibilités.
- issue: Nature des שָׁבֻעִים
  choice: semaines
  alternative: unités de sept; semaines d’années
  rationale: Le mot désigne littéralement des périodes de sept, mais le verset ne précise pas « années ». La traduction évite donc d’inscrire cette interprétation courante dans le texte principal.
- issue: Sens de « sceller vision et prophète »
  choice: conserver la formulation concrète du texte hébreu
  alternative: sceller vision et prophétie; accomplir ou authentifier vision et prophète
  rationale: Le substantif hébreu signifie « prophète » et le verbe « sceller » peut suggérer clôture, accomplissement ou authentification. Traduire directement maintient la tension plutôt que d’en sélectionner une explication.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe en six propositions finales reproduit la structure solennelle du verset. Les métaphores « sceller » et « onction » sont maintenues, tandis que les ambiguïtés chronologique et référentielle sont reportées en notes sans ajout confessionnel.
