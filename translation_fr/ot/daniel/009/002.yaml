source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת אַחַת֙ לְ/מָלְכ֔/וֹ אֲנִי֙ דָּֽנִיֵּ֔אל בִּינֹ֖תִי בַּ/סְּפָרִ֑ים מִסְפַּ֣ר הַ/שָּׁנִ֗ים אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֶל יִרְמִיָ֣ה הַ/נָּבִ֔יא לְ/מַלֹּ֛אות לְ/חָרְב֥וֹת יְרוּשָׁלִַ֖ם שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/002.yaml
  text: 'In the first year of his reign[a], I, Daniel, understood from the books the number of the years about which the word of Yahweh had come to Jeremiah the prophet, for the completion of the desolations of Jerusalem: seventy years.'
translation:
  language: fr
  text: 'La première année de son règne, moi, Daniel, je compris, d’après les livres[a], le nombre des années au sujet desquelles la parole de Yahweh était parvenue au prophète Jérémie : soixante-dix années de désolations pour Jérusalem devaient s’accomplir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’après les rouleaux ». Le mot hébreu peut désigner divers documents écrits ; « livres » est plus naturel en français actuel, tandis que « rouleaux » évoque plus précisément leur forme ancienne.
    reason: Note culturelle et lexicale.
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת לְמָלְכוֹ
  choice: La première année de son règne
  rationale: Le cardinal « un » a ici une valeur ordinale idiomatique. « De son règne » exprime naturellement en français la période où il exerce la royauté.
- source_word: בִּינֹתִי בַּסְּפָרִים
  choice: je compris, d’après les livres
  rationale: Le verbe בין exprime l’accès à la compréhension; la préposition ב indique ici vraisemblablement la source ou le moyen de cette compréhension. « D’après » rend cette relation plus naturellement que le seul locatif « dans ».
- source_word: מִסְפַּר הַשָּׁנִים
  choice: le nombre d’années
  rationale: Cette formulation française restitue clairement le total déterminé que Daniel découvre, sans lourdeur inutile.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל יִרְמִיָה הַנָּבִיא
  choice: au sujet desquelles la parole de Yahweh était parvenue au prophète Jérémie
  rationale: La proposition rattache les années à une révélation antérieure reçue par Jérémie. Le plus-que-parfait marque cette antériorité, et « Yahweh » conserve le nom divin יהוה.
- source_word: לְמַלֹּאות לְחָרְבוֹת יְרוּשָׁלִַם
  choice: jusqu’à l’accomplissement de la dévastation de Jérusalem
  rationale: Cette tournure exprime le terme de la période annoncée sans faire de la dévastation elle-même l’objet d’un « accomplissement » volontaire, formulation qui serait ambiguë en français. Le singulier collectif « dévastation » est plus naturel en français, tout en couvrant l’état de désolation exprimé par le pluriel hébreu.
- source_word: שִׁבְעִים שָׁנָה
  choice: soixante-dix ans
  rationale: Rendu direct de l’expression numérique hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Rapport entre לְמַלֹּאות et la dévastation de Jérusalem
  choice: jusqu’à l’accomplissement de la dévastation de Jérusalem
  alternative: pour accomplir les dévastations de Jérusalem; pour que la dévastation de Jérusalem prenne fin
  rationale: L’hébreu est compact et ne précise pas explicitement le sujet de l’infinitif. Le choix retenu conserve l’accent temporel sur les soixante-dix ans et évite de préciser davantage que le texte qui met fin à la dévastation ou qui l’accomplit.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « moi, Daniel, je compris » conserve l’insistance du pronom hébreu sans produire une tournure artificielle. Le deux-points met en relief le total annoncé.
