  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י אֱלֹהֵ֗י/נוּ אֲשֶׁר֩ הוֹצֵ֨אתָ אֶֽת עַמְּ/ךָ֜ מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ בְּ/יָ֣ד חֲזָקָ֔ה וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כַּ/יּ֣וֹם הַ/זֶּ֑ה חָטָ֖אנוּ רָשָֽׁעְנוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/015.yaml
  text: And now[a], O Lord our God, who brought your people out of the land of Egypt with a strong hand and made for yourself a name, as it is this day—we have sinned[c][b]; we have acted wickedly.
translation:
  language: fr
  text: Et maintenant, Seigneur notre Dieu, toi qui as fait sortir ton peuple du pays d’Égypte d’une main puissante et qui t’es fait un nom, comme c’est encore le cas aujourd’hui[a], nous avons péché, nous avons agi avec méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à aujourd’hui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: Seigneur notre Dieu
  rationale: Formule d’adresse naturelle et digne en contexte de prière; « Seigneur » rend le titre divin אֲדֹנָי.
- source_word: הוֹצֵאתָ אֶת עַמְּךָ מֵאֶרֶץ מִצְרַיִם
  choice: tu as fait sortir ton peuple du pays d’Égypte
  rationale: Le factitif « faire sortir » rend précisément le hiphil de יצא et conserve la formule de l’Exode.
- source_word: בְּיָד חֲזָקָה
  choice: d’une main puissante
  rationale: Expression française consacrée, proche de l’image hébraïque et adaptée à l’évocation de l’Exode; « forte » serait plus littéral mais moins idiomatique ici.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: tu t’es fait un nom
  rationale: Conserve l’image hébraïque tout en exprimant naturellement l’idée d’acquérir une grande renommée.
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: Rend la notoriété encore manifeste au moment où parle Daniel sans réduire l’expression au seul sens temporel de « jusqu’à aujourd’hui ».
- source_word: חָטָאנוּ
  choice: nous avons péché
  rationale: Le passé composé convient à l’aveu de fautes passées dont la culpabilité demeure présente.
- source_word: רָשָׁעְנוּ
  choice: nous avons agi avec méchanceté
  rationale: Distingue ce second aveu de « nous avons péché » et conserve la force morale du verbe רשע.
theological_decisions:
- issue: Évocation de l’Exode et renommée de Dieu
  choice: Conserver la formule « fait sortir… d’une main puissante » et l’image « t’es fait un nom ».
  alternative: « délivré ton peuple d’Égypte par ta puissance et acquis une grande renommée »
  rationale: La formulation retenue préserve les échos à l’histoire fondatrice de l’Exode et l’imagerie du texte sans imposer une explicitation théologique.
- issue: Portée de כַּיּוֹם הַזֶּה
  choice: « comme on le voit aujourd’hui »
  alternative: « jusqu’à aujourd’hui »
  rationale: L’expression peut souligner soit la situation manifeste au jour présent, soit sa continuité jusqu’à ce jour. Le texte principal garde l’idée de constat public; la note signale l’autre nuance légitime.
translation_notes:
  register: Français international moderne, digne et adapté à une prière solennelle. Le vocatif est rendu sans « ô », aujourd’hui marqué, et la structure hébraïque est légèrement fluidifiée par « toi qui ».
