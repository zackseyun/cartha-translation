  to: Et maintenant, Seigneur notre Dieu, toi qui as fait sortir ton peuple du pays d’Égypte d’une main puissante et qui t’es fait un nom, comme c’est encore le cas aujourd’hui[a], nous avons péché, nous avons agi avec méchanceté.
  rationale: La révision limitée de la formule finale de la proposition relative évite l’ajout interprétatif « on le voit » et rend plus directement l’idiome hébreu « comme en ce jour / comme c’est aujourd’hui ». Les autres choix sont conservés.
