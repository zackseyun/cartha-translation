language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲדֹנָ֤/י שְׁמָ֨עָ/ה֙ אֲדֹנָ֣/י סְלָ֔חָ/ה אֲדֹנָ֛/י הַֽקֲשִׁ֥יבָ/ה וַ/עֲשֵׂ֖ה אַל תְּאַחַ֑ר לְמַֽעֲנְ/ךָ֣ אֱלֹהַ֔/י כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל עִירְ/ךָ֖ וְ/עַל עַמֶּֽ/ךָ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/019.yaml
  text: Lord[a], hear! Lord, forgive! Lord, pay attention and act! Do not delay, for your own sake, my God, because your name is called over your city and your people.
translation:
  language: fr
  text: Seigneur, écoute ! Seigneur, pardonne ! Seigneur, sois attentif et agis ! Ne tarde pas, par égard pour toi-même, mon Dieu, car ta ville et ton peuple portent ton nom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car ton nom est appelé sur ta ville et sur ton peuple »; cette expression marque leur identification à Dieu et leur appartenance à lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin employé ici comme apostrophe. « Seigneur » est naturel dans une prière française et n’exige pas l’ajout de « mon », même si la forme hébraïque peut historiquement s’analyser ainsi.
- source_word: שְׁמָעָה
  choice: écoute
  rationale: L’impératif exprime une supplication pressante. En français actuel, « écoute » convient mieux à l’adresse directe que le plus littéral « entends ».
- source_word: סְלָחָה
  choice: pardonne
  rationale: Équivalent direct et usuel de סלח dans le contexte d’une prière de repentance.
- source_word: הַקֲשִׁיבָה
  choice: sois attentif
  rationale: Le hifil de קשׁב demande une attention active et soutenue; cette formulation le distingue du simple « écoute » précédent.
- source_word: וַעֲשֵׂה
  choice: et agis
  rationale: Dans cette suite de supplications, עשה appelle une intervention concrète de Dieu; « agis » rend ce sens contextuel sans préciser indûment l’action.
- source_word: אַל תְּאַחַר
  choice: Ne tarde pas
  rationale: Rend avec concision la défense de différer l’intervention demandée.
- source_word: לְמַעַנְךָ
  choice: par égard pour toi-même
  rationale: La demande est fondée sur Dieu lui-même, son honneur et ses intérêts. Cette expression conserve la force réflexive sans introduire explicitement « ton nom » à cet endroit.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Conserve la forme possessive et le caractère personnel de l’appel.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français soutenu la raison qui appuie la supplication.
- source_word: שִׁמְךָ נִקְרָא עַל
  choice: portent ton nom
  rationale: Cette formulation française rend clairement l’idiome d’identification et d’appartenance, tandis qu’une note conserve son image hébraïque inhabituelle.
- source_word: עִירְךָ וְעַל עַמֶּךָ
  choice: ta ville et ton peuple
  rationale: Rend directement les deux groupes coordonnés et leurs possessifs; dans le contexte, la ville est Jérusalem.
theological_decisions:
- issue: L’idiome d’identification שִׁמְךָ נִקְרָא עַל
  choice: ta ville et ton peuple portent ton nom
  alternative: ton nom est appelé sur ta ville et sur ton peuple
  rationale: L’hébreu présente littéralement le nom de Dieu comme « appelé sur » la ville et le peuple, image qui exprime leur appartenance à Dieu et leur identification à lui. Le texte principal emploie l’idiome français naturel « porter ton nom », sans réduire cette relation à une seule nuance; la note signale la forme plus littérale.
translation_notes:
  register: Français international moderne, digne et priant. Les exclamations brèves reproduisent l’urgence de la série d’impératifs. Le tutoiement suit l’adresse biblique française courante à Dieu et permet de conserver clairement les possessifs singuliers.
