source:
  edition: WLC
  text: לְ/ךָ֤ אֲדֹנָ/י֙ הַ/צְּדָקָ֔ה וְ/לָ֛/נוּ בֹּ֥שֶׁת הַ/פָּנִ֖ים כַּ/יּ֣וֹם הַ/זֶּ֑ה לְ/אִ֤ישׁ יְהוּדָה֙ וּ/לְ/יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם וּֽ/לְ/כָל יִשְׂרָאֵ֞ל הַ/קְּרֹבִ֣ים וְ/הָ/רְחֹקִ֗ים בְּ/כָל הָֽ/אֲרָצוֹת֙ אֲשֶׁ֣ר הִדַּחְתָּ֣/ם שָׁ֔ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֥ר מָֽעֲלוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/007.yaml
  text: To you[a], O Lord, belongs righteousness, but to us belongs shame of face, as it is this day—to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those who are near and those who are far away[b], in all the lands where you have driven them[c], because of their unfaithfulness that they committed against you.
translation:
  language: fr
  text: À toi, Seigneur, appartient la justice, mais à nous la honte au visage[a], comme c’est le cas aujourd’hui — aux hommes de Juda[b], aux habitants de Jérusalem et à tout Israël, à ceux qui sont proches comme à ceux qui sont loin, dans tous les pays où tu les as chassés, à cause de l’infidélité[c] qu’ils ont commise envers toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la honte des visages » ; l’expression évoque une honte publique qui se lit sur le visage.'
    reason: idiome_hébraïque
  - marker: b
    text: 'Ou : « à chaque homme de Juda ». Le singulier hébreu a ici une valeur distributive ou collective.'
    reason: alternative_lexicale
  - marker: c
    text: 'Ou : « à cause de leur trahison envers toi ». Le terme hébreu désigne une rupture de fidélité.'
    reason: nuance_lexicale
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Vocatif adressé à Dieu. « Seigneur » est naturel dans une prière et ne confond pas אֲדֹנָי avec le nom divin YHWH.
- source_word: הַצְּדָקָה
  choice: la justice
  rationale: Le mot affirme ici que Dieu est juste et dans son droit, par contraste avec la honte méritée du peuple. « Justice » conserve à la fois la rectitude morale et la dimension judiciaire du contexte.
- source_word: בֹּשֶׁת הַפָּנִים
  choice: la honte au visage
  rationale: Cette formulation garde l’image hébraïque de la honte publiquement visible sur le visage, sans employer un calque français obscur comme « honte de visage ».
- source_word: כַּיּוֹם הַזֶּה
  choice: comme on le voit aujourd’hui
  rationale: L’expression désigne la situation présente et manifeste. Cette tournure française rend sa valeur démonstrative de façon naturelle.
- source_word: לְאִישׁ יְהוּדָה
  choice: aux hommes de Juda
  rationale: Le singulier אִישׁ a ici une valeur distributive ou collective. « Aux hommes de Juda » conserve la forme masculine du texte, tandis qu’une note signale la lecture distributive possible.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: aux habitants de Jérusalem
  rationale: Rendu courant et précis du participe désignant les personnes qui résident dans une ville.
- source_word: כָּל יִשְׂרָאֵל
  choice: à tout Israël
  rationale: Formulation française consacrée et fidèle pour l’ensemble du peuple d’Israël.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: ceux qui sont proches comme ceux qui sont loin
  rationale: Préserve l’opposition géographique entre les Israélites restés relativement proches et ceux dispersés au loin.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: dans tous les pays
  rationale: « Pays » exprime naturellement en français les différents territoires de la dispersion sans imposer une conception politique moderne précise.
- source_word: הִדַּחְתָּם
  choice: tu les as chassés
  rationale: Le hifil de נדח exprime l’action de faire partir ou d’expulser. « Chassés » maintient la force du verbe et l’action directe attribuée à Dieu.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בָךְ
  choice: à cause de l’infidélité dont ils se sont rendus coupables envers toi
  rationale: מעל désigne une rupture de fidélité, voire une trahison, envers Dieu. La formulation conserve le possessif implicite dans le suffixe hébreu, le caractère coupable de l’acte et son orientation personnelle envers Dieu, tout en évitant une répétition maladroite en français.
theological_decisions:
- issue: La justice de Dieu opposée à la honte d’Israël
  choice: « À toi, Seigneur, appartient la justice, mais à nous la honte »
  alternative: Comprendre הַצְּדָקָה plus étroitement comme la seule justice judiciaire ou punitive.
  rationale: La confession reconnaît que Dieu est juste et dans son droit, tandis que le peuple porte une honte due à son infidélité. La traduction ne réduit pas cette justice à la punition et n’efface pas la responsabilité du peuple.
- issue: Valeur collective et masculine de לְאִישׁ יְהוּדָה
  choice: « aux hommes de Juda »
  alternative: « au peuple de Juda » ou « à chacun en Juda »
  rationale: Le texte emploie אִישׁ au masculin singulier avec une portée distributive ou collective. Le corps du texte conserve cette forme représentative, et la note expose l’autre manière de faire ressortir sa distribution.
- issue: Responsabilité humaine et action divine dans l’exil
  choice: Dieu les a « chassés » à cause de leur infidélité.
  alternative: Atténuer l’action divine par « là où ils ont été dispersés » ou rendre l’exil sans lien causal explicite avec leur faute.
  rationale: La syntaxe hébraïque attribue directement la dispersion à Dieu et la relie à la rupture de fidélité du peuple. La traduction garde cette tension sans développer davantage sa portée doctrinale.
translation_notes:
  register: Français international moderne, digne et adapté à une prière de confession. La phrase conserve le parallélisme « à toi… à nous… », l’ampleur de l’énumération et l’adresse directe à Dieu, tout en évitant les calques difficiles. Les tirets structurent la longue expansion sans en modifier les rapports syntaxiques.
