id: DAN.9.20
reference: Daniel 9:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/ע֨וֹד אֲנִ֤י מְדַבֵּר֙ וּ/מִתְפַּלֵּ֔ל וּ/מִתְוַדֶּה֙ חַטָּאתִ֔/י וְ/חַטַּ֖את עַמִּ֣/י יִשְׂרָאֵ֑ל וּ/מַפִּ֣יל תְּחִנָּתִ֗/י לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהַ֔/י עַ֖ל הַר קֹ֥דֶשׁ אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/020.yaml
  text: While I was still speaking and praying[a], confessing my sin and the sin of my people Israel, and presenting my plea before Yahweh my God concerning the holy mountain of my God[b],
translation:
  language: fr
  text: Alors que je parlais encore, que je priais, que je confessais mon péché et le péché de mon peuple Israël, et que je présentais ma supplication[a] devant Yahvé, mon Dieu, au sujet de la montagne sainte de mon Dieu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « je faisais tomber ma supplication devant » Yahvé, idiome qui signifie la présenter devant lui.'
    reason: lexical_alternative
  - marker: b
    text: La « montagne sainte de mon Dieu » désigne Sion, à Jérusalem, où se trouvait le sanctuaire de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר
  choice: Alors que je parlais encore
  rationale: La tournure rend naturellement en français l’action qui se poursuit au moment où survient la suite du récit.
- source_word: וּמִתְפַּלֵּל
  choice: que je priais
  rationale: Le verbe désigne ici sans ambiguïté l’action de prier Dieu.
- source_word: וּמִתְוַדֶּה
  choice: que je confessais
  rationale: Avec le péché pour objet, la forme réfléchie de ידה signifie reconnaître ou confesser sa faute.
- source_word: חַטָּאתִי וְחַטַּאת עַמִּי יִשְׂרָאֵל
  choice: mon péché et le péché de mon peuple Israël
  rationale: Cette formulation conserve le singulier collectif du texte hébreu et l’apposition « mon peuple Israël ».
- source_word: וּמַפִּיל תְּחִנָּתִי
  choice: et que je présentais ma supplication
  rationale: Littéralement, Daniel « fait tomber » sa supplication devant Dieu ; « présenter » restitue clairement cet idiome, tandis que « supplication » garde l’idée d’un appel pressant à la faveur divine.
- source_word: לִפְנֵי יְהוָה אֱלֹהַי
  choice: devant Yahvé, mon Dieu
  rationale: « Devant » correspond à la préposition hébraïque dans ce contexte de prière, et le possessif est conservé.
- source_word: עַל הַר קֹדֶשׁ אֱלֹהָי
  choice: au sujet de la montagne sainte de mon Dieu
  rationale: עַל indique ici l’objet de la supplication ; la formulation préserve la répétition de « mon Dieu » présente dans l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie directement le tétragramme. « Yahvé » rend le nom propre divin dans sa forme française courante sans le remplacer par un titre.
- issue: Référent de « la montagne sainte de mon Dieu »
  choice: Conserver l’expression dans le texte et préciser son référent en note
  alternative: Traduire explicitement par « Sion » ou « Jérusalem »
  rationale: L’hébreu dit « la montagne sainte de mon Dieu ». Remplacer cette expression par son référent interprétatif effacerait l’image et ajouterait une précision absente du texte.
translation_notes:
  register: Français international actuel, digne et accessible. La structure répétitive (« que je… ») maintient l’enchaînement des participes hébreux. La virgule finale est conservée parce que la phrase se poursuit au verset suivant.
