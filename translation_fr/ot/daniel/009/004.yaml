  text: וָֽ/אֶתְפַּֽלְלָ֛/ה לַ/יהוָ֥ה אֱלֹהַ֖/י וָ/אֶתְוַדֶּ֑ה וָ/אֹֽמְרָ֗/ה אָנָּ֤א אֲדֹנָ/י֙ הָ/אֵ֤ל הַ/גָּדוֹל֙ וְ/הַ/נּוֹרָ֔א שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/004.yaml
  text: And I prayed to Yahweh my God and confessed and said[a], “Please, Lord, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: fr
  text: 'Je priai Yahweh, mon Dieu, je confessai et je dis : « Je t’en prie, Seigneur, Dieu grand et redoutable[a], toi qui gardes l’alliance et l’amour fidèle[b] envers ceux qui t’aiment et qui gardent tes commandements, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui inspires une crainte révérencielle ». Le terme hébreu désigne celui qui suscite une crainte mêlée de profond respect.
    reason: lexical_alternative
  - marker: b
    text: Ou « la fidélité à l’alliance » ou « la bonté fidèle ». Le mot hébreu חֶסֶד associe ici amour, bonté et loyauté dans le cadre de l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלְלָה
  choice: Je priai
  rationale: Le wayyiqtol fait progresser le récit. Le passé simple convient au registre narratif digne et reste clair en français écrit.
- source_word: לַיהוָה אֱלֹהַי
  choice: Yahweh, mon Dieu
  rationale: La préposition marque le destinataire de la prière, le suffixe de première personne est conservé, et le nom divin est transcrit.
- source_word: וָאֶתְוַדֶּה
  choice: je confessai mes fautes
  rationale: Le hitpael de ידה désigne ici la confession des péchés. L’ajout explicatif « mes fautes » rend naturellement en français l’objet sous-entendu par le contexte pénitentiel.
- source_word: וָאֹמְרָה
  choice: et je dis
  rationale: Cette forme poursuit la succession des actions et introduit directement la prière.
- source_word: אָנָּא
  choice: Ah !
  rationale: La particule exprime une supplication pressante. « Ah ! » convient mieux que le poli « s’il te plaît » à cette invocation solennelle.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Ce titre d’adresse est distingué du nom propre Yahweh employé plus tôt dans le verset.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: Dieu grand et redoutable
  rationale: La formulation conserve les qualificatifs hébreux. « Redoutable » exprime celui qui inspire crainte et respect sans employer le sens familier moderne de « formidable ».
- source_word: שֹׁמֵר הַבְּרִית
  choice: toi qui gardes l’alliance
  rationale: Le participe décrit une action caractéristique de Dieu. La reprise « toi qui » est naturelle dans une adresse directe.
- source_word: הַחֶסֶד
  choice: l’amour fidèle
  rationale: Cette expression française réunit les dimensions de bonté, de loyauté et de fidélité relationnelle de חֶסֶד, ici étroitement associé à l’alliance.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: envers ceux qui t’aiment et qui gardent tes commandements
  rationale: Les suffixes hébreux à la troisième personne deviennent naturellement la deuxième personne puisque Daniel s’adresse directement à Dieu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La transcription préserve le nom propre et le distingue du titre אֲדֹנָי, rendu « Seigneur ».
- issue: Portée de חֶסֶד dans le cadre de l’alliance
  choice: amour fidèle
  alternative: fidélité à l’alliance / bonté / miséricorde
  rationale: Le mot est coordonné à « l’alliance » et exprime à la fois attachement, bonté et loyauté. « Amour fidèle » évite de le réduire soit à un sentiment, soit à une fidélité abstraite.
- issue: Relation entre l’amour fidèle de Dieu et ceux qui l’aiment
  choice: envers ceux qui t’aiment et qui gardent tes commandements
  alternative: pour ceux qui l’aiment et gardent ses commandements
  rationale: La formulation maintient sans l’expliquer davantage le lien énoncé par le texte entre la fidélité divine et l’amour obéissant des fidèles.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple soutient la narration biblique écrite sans archaïsmes lexicaux. La phrase reste ouverte par une virgule finale, conformément au fait que la prière se poursuit au verset suivant.
