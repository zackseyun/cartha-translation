id: DAN.9.1
reference: Daniel 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת אַחַ֗ת לְ/דָרְיָ֛וֶשׁ בֶּן אֲחַשְׁוֵר֖וֹשׁ מִ/זֶּ֣רַע מָדָ֑י אֲשֶׁ֣ר הָמְלַ֔ךְ עַ֖ל מַלְכ֥וּת כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/001.yaml
  text: In the first year of Darius son of Ahasuerus[a], of the offspring of the Medes, who was made king over the kingdom of the Chaldeans—
translation:
  language: fr
  text: La première année de Darius, fils d’Assuérus, de descendance mède, qui avait été établi roi sur le royaume des Chaldéens[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Babyloniens ». « Chaldéens » traduit le terme hébreu, mais celui-ci peut désigner ici le royaume babylonien.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת
  choice: La première année
  rationale: Dans cette formule de datation royale, le cardinal « un » a une valeur ordinale. « La première année » est à la fois fidèle et naturel en français.
- source_word: לְדָרְיָוֶשׁ
  choice: de Darius
  rationale: Le préfixe לְ marque ici la relation dans une formule de datation; « de Darius » convient à l’usage français.
- source_word: בֶּן אֲחַשְׁוֵרוֹשׁ
  choice: fils d’Assuérus
  rationale: בֶּן indique directement la filiation. « Assuérus » est la forme française biblique usuelle du nom.
- source_word: מִזֶּרַע מָדָי
  choice: de descendance mède
  rationale: זֶרַע désigne ici la lignée ou l’ascendance, et non une semence au sens propre. Cette formulation naturelle conserve le sens généalogique.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif introduit une proposition décrivant Darius.
- source_word: הָמְלַךְ
  choice: avait été établi roi
  rationale: 'La forme hophal est passive et causative: Darius a reçu la royauté. Le plus-que-parfait situe naturellement cette accession avant l’année évoquée.'
- source_word: עַל מַלְכוּת
  choice: sur le royaume
  rationale: עַל exprime l’autorité exercée sur le domaine désigné par מַלְכוּת, ici un royaume.
- source_word: כַּשְׂדִּים
  choice: les Chaldéens
  rationale: Le texte hébreu emploie l’ethnonyme « Chaldéens ». Il est conservé dans le texte, tandis que sa valeur contextuelle est signalée en note.
theological_decisions: []
