  register: Français international moderne, sobre et soutenu. Les noms propres suivent leurs formes françaises bibliques usuelles. Le tiret final conserve le caractère inachevé de la phrase, qui se poursuit au verset suivant. Le marqueur de note est placé après « Chaldéens », terme auquel la note se rapporte.
