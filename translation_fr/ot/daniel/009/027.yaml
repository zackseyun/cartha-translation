  to: Il affermira une alliance avec le grand nombre pendant une semaine[a] et, pendant la moitié de la semaine, il fera cesser le sacrifice et l’offrande[b]. Et sur l’aile des abominations[c] viendra celui qui dévaste[d], jusqu’à ce que la fin décrétée soit déversée sur le dévastateur[e].
  rationale: 'Une unique révision stylistique sûre a été apportée : « rendra ferme » devient « affermira ». Cette correction améliore nettement l’idiomaticité française tout en conservant la force causative de l’hébreu et sans trancher la question de savoir si l’alliance est nouvelle ou déjà existante. « Le grand nombre » est retenu à la place de « la multitude » afin de rendre plus naturellement le collectif défini de לָרַבִּים. Les images difficiles, les référents disputés et les notes d’alternatives sont maintenus.'
